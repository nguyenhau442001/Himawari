<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Sand / Beach base -->
    <path d="M 40,165 Q 120,150 200,165 L 200,185 L 40,185 Z" fill="#2E3440" opacity="0.6"/>
    <path d="M 30,175 Q 120,160 210,175 L 220,195 L 20,195 Z" fill="#3B4252"/>
    
    <!-- Left footprint (fading/background) -->
    <g transform="translate(75, 155) rotate(-10)" opacity="0.4">
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#1A1D24"/>
      <circle cx="-10" cy="-12" r="3" fill="#1A1D24"/>
      <circle cx="-4" cy="-15" r="3" fill="#1A1D24"/>
      <circle cx="2" cy="-15" r="3" fill="#1A1D24"/>
      <circle cx="8" cy="-13" r="2.5" fill="#1A1D24"/>
      <circle cx="12" cy="-10" r="2" fill="#1A1D24"/>
    </g>

    <!-- Main central footprint (representing "留下" - leaving a trace/mark) -->
    <g transform="translate(130, 140) rotate(5)">
      <!-- Indentation shadow -->
      <ellipse cx="2" cy="4" rx="22" ry="13" fill="#1A1D24" opacity="0.8"/>
      
      <!-- Footprint sole -->
      <path d="M -15,-5 C -20,10 -15,22 0,25 C 15,22 22,10 16,-5 C 12,-15 -10,-15 -15,-5 Z" fill="#E5C07B"/>
      
      <!-- Toes -->
      <circle cx="-12" cy="-18" r="4" fill="#E5C07B"/>
      <circle cx="-5" cy="-21" r="4.5" fill="#E5C07B"/>
      <circle cx="3" cy="-21" r="4.5" fill="#E5C07B"/>
      <circle cx="10" cy="-18" r="3.5" fill="#E5C07B"/>
      <circle cx="15" cy="-13" r="2.5" fill="#E5C07B"/>
      
      <!-- Inner sole highlight for depth -->
      <ellipse cx="1" cy="5" rx="10" ry="14" fill="#D19A66" opacity="0.4"/>
    </g>

    <!-- Ripple/Impression waves indicating impact/impression -->
    <path d="M 100,120 Q 120,112 140,120" stroke="#61AFEF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 90,110 Q 120,98 150,110" stroke="#61AFEF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Glowing focal sparkles representing lasting impression (印象) -->
    <g transform="translate(155, 95)">
      <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#E5C07B"/>
      <circle cx="0" cy="0" r="1" fill="#FFFFFF"/>
    </g>
    <g transform="translate(95, 80) scale(0.6)">
      <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#61AFEF"/>
    </g>
  </g>
</svg>