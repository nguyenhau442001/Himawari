<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Subtle Presentation Screen & Podium Context -->
  <g opacity="0.3">
    <!-- Presentation board -->
    <rect x="70" y="55" width="100" height="55" rx="4" fill="#252A34" stroke="#3A4252" stroke-width="2"/>
    <!-- Abstract slide graphics -->
    <line x1="82" y1="72" x2="115" y2="72" stroke="#4F5D73" stroke-width="4" stroke-linecap="round"/>
    <line x1="82" y1="88" x2="140" y2="88" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="72" r="6" fill="#F39C12"/>
  </g>

  <!-- Podium / Lectern -->
  <path d="M96 160L102 120H138L144 160H96Z" fill="#2C3440"/>
  <path d="M92 116H148V122H92V116Z" fill="#F39C12" rx="1"/>
  <!-- Microphone on Podium -->
  <rect x="118" y="105" width="4" height="12" fill="#8892B0"/>
  <circle cx="120" cy="103" r="3" fill="#8892B0"/>

  <!-- Character: 院长 (Director / President / Dean) -->
  <g>
    <!-- Suit / Shoulders -->
    <path d="M85 210C85 185 102 175 120 175C138 175 155 185 155 210H85Z" fill="#1E2430"/>
    <!-- Shirt collar & Tie -->
    <polygon points="110,175 120,192 130,175" fill="#FFFFFF"/>
    <polygon points="117,185 123,185 125,208 120,212 115,208" fill="#F39C12"/>

    <!-- Neck -->
    <rect x="113" y="163" width="14" height="15" fill="#E2B395"/>

    <!-- Head / Face -->
    <ellipse cx="120" cy="140" rx="20" ry="24" fill="#E2B395"/>

    <!-- Hair (Professional, neat, mature with slight grey temples) -->
    <path d="M100 135C100 120 108 114 120 114C132 114 140 120 140 135C140 137 138 132 136 128C132 120 126 118 120 118C114 118 108 120 104 128C102 132 100 137 100 135Z" fill="#3E4C59"/>
    <path d="M100 136C100 136 102 124 110 120" stroke="#8892B0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M140 136C140 136 138 124 130 120" stroke="#8892B0" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Glasses (Intellectual look) -->
    <rect x="105" y="132" width="13" height="9" rx="2" fill="none" stroke="#252A34" stroke-width="2"/>
    <rect x="122" y="132" width="13" height="9" rx="2" fill="none" stroke="#252A34" stroke-width="2"/>
    <line x1="118" y1="135" x2="122" y2="135" stroke="#252A34" stroke-width="2"/>

    <!-- Confident, warm expression / Speaking -->
    <path d="M115,152 Q120,157 125,152" fill="none" stroke="#A66847" stroke-width="2" stroke-linecap="round"/>

    <!-- Gesturing Arm (Giving a speech / 讲了话) -->
    <!-- Back arm resting -->
    <path d="M92 180L84 195L95 200" fill="none" stroke="#1E2430" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front active gesturing arm -->
    <path d="M145 185Q162 170 155 155" fill="none" stroke="#1E2430" stroke-width="9" stroke-linecap="round"/>
    <!-- Hand in expressive speech gesture -->
    <circle cx="155" cy="151" r="5" fill="#E2B395"/>
  </g>

  <!-- Accent Focus Glow / Leadership symbol (Subtle Golden Ring/Badge element) -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="#F39C12" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 6"/>
</svg>