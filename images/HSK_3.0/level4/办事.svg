<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Subtle Grid / Elements for modern dark mode UI vibe -->
  <path d="M40 180 L200 180" stroke="#2A2F3B" stroke-width="2" stroke-linecap="round"/>
  <rect x="50" y="70" width="140" height="95" rx="8" fill="#222631" stroke="#2E3442" stroke-width="2"/>

  <!-- Workspace / Desk Setup -->
  <!-- Laptop Base -->
  <path d="M75 145 H165 L175 155 H65 Z" fill="#3B4252"/>
  <!-- Laptop Screen Frame -->
  <rect x="85" y="85" width="70" height="48" rx="3" fill="#2E3442"/>
  <!-- Laptop Screen UI (Abstract structured work/charts) -->
  <rect x="92" y="93" width="30" height="4" rx="2" fill="#E5C07B"/>
  <rect x="92" y="103" width="56" height="3" rx="1.5" fill="#4C566A"/>
  <rect x="92" y="110" width="45" height="3" rx="1.5" fill="#4C566A"/>
  <polyline points="95,125 105,118 115,122 130,112 140,120" fill="none" stroke="#61AFEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Document / Task sheet with checkmark (representing "办事" - handling/executing tasks) -->
  <rect x="155" y="105" width="32" height="42" rx="3" fill="#E5E9F0"/>
  <line x1="162" y1="115" x2="178" y2="115" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
  <line x1="162" y1="123" x2="175" y2="123" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
  <polyline points="163,135 167,139 176,130" fill="none" stroke="#98C379" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Human Character Action (Focused, executing work with motion lines) -->
  <!-- Head & Hair -->
  <circle cx="120" cy="50" r="14" fill="#E5C07B"/>
  <path d="M106 48 C106 38, 134 38, 134 48 C134 52, 130 52, 130 46 C130 42, 110 42, 110 46 C110 52, 106 52, 106 48 Z" fill="#D19A66"/>

  <!-- Torso & Clothing -->
  <path d="M98 75 C98 64, 142 64, 142 75 L148 115 H92 Z" fill="#61AFEF"/>

  <!-- Active Arms & Hands interacting with laptop / documents -->
  <!-- Left arm interacting with keyboard -->
  <path d="M102 75 L85 105 L95 110" fill="none" stroke="#61AFEF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="97" cy="111" r="5" fill="#E5C07B"/>

  <!-- Right arm reaching forward with precision (Handling business/task) -->
  <path d="M138 75 L155 102 L168 98" fill="none" stroke="#61AFEF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="170" cy="96" r="5" fill="#E5C07B"/>

  <!-- Motion lines indicating purposeful action / efficiency ("办事认真/利落") -->
  <path d="M178 88 L188 85" stroke="#E5C07B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M182 96 L193 95" stroke="#E5C07B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M179 104 L187 108" stroke="#E5C07B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Focus / Concentration Accent Element (Golden professional glow ring / badge subtle) -->
  <circle cx="120" cy="50" r="18" fill="none" stroke="#E5C07B" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
</svg>