<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: Midterm Exam (A clipboard with an exam paper marked at the halfway point, paired with a grading pen/pencil) -->
  <g transform="translate(0, 5)">
    <!-- Clipboard Background / Shadow -->
    <rect x="52" y="32" width="136" height="176" rx="12" fill="#15181E" />

    <!-- Main Clipboard Body -->
    <rect x="48" y="28" width="136" height="176" rx="12" fill="#283044" />

    <!-- Metallic Clip at Top -->
    <path d="M96 28h48v12c0 2.2-1.8 4-4 4h-40c-2.2 0-4-1.8-4-4V28z" fill="#718096" />
    <rect x="104" y="30" width="32" height="4" rx="2" fill="#A0AEC0" />
    <circle cx="120" cy="38" r="2" fill="#1A1D24" />

    <!-- Paper Sheet -->
    <rect x="64" y="52" width="104" height="136" rx="4" fill="#F7FAFC" />

    <!-- Header lines on paper -->
    <rect x="76" y="66" width="40" height="4" rx="2" fill="#CBD5E0" />
    <rect x="144" y="66" width="16" height="4" rx="2" fill="#CBD5E0" />

    <!-- Exam questions mockup (Top half: answered) -->
    <rect x="76" y="82" width="60" height="3" rx="1.5" fill="#A0AEC0" />
    <circle cx="152" cy="83" r="4" fill="#48BB78" /> <!-- Checkmark/Correct -->

    <rect x="76" y="94" width="50" height="3" rx="1.5" fill="#A0AEC0" />
    <circle cx="152" cy="95" r="4" fill="#48BB78" /> <!-- Checkmark/Correct -->

    <!-- Divider indicating "Middle / 期中" -->
    <line x1="76" y1="112" x2="164" y2="112" stroke="#ED8936" stroke-width="2.5" stroke-dasharray="4 2" />
    
    <!-- Midpoint marker label area -->
    <rect x="100" y="108" width="40" height="8" rx="4" fill="#ED8936" />

    <!-- Exam questions mockup (Bottom half: pending/next) -->
    <rect x="76" y="130" width="55" height="3" rx="1.5" fill="#CBD5E0" />
    <circle cx="152" cy="131" r="3" fill="#E2E8F0" />

    <rect x="76" y="142" width="45" height="3" rx="1.5" fill="#CBD5E0" />
    <circle cx="152" cy="143" r="3" fill="#E2E8F0" />

    <rect x="76" y="154" width="60" height="3" rx="1.5" fill="#CBD5E0" />
    <circle cx="152" cy="155" r="3" fill="#E2E8F0" />

    <!-- Big Score / Grade Badge (A+ / Good result representing "考得不错") -->
    <circle cx="140" cy="172" r="16" fill="#ED8936" />
    <text x="140" y="177" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle">A</text>

    <!-- Grading Pencil angled across the clipboard -->
    <g transform="translate(130, 110) rotate(45)">
      <!-- Pencil Body -->
      <polygon points="0,-36 8,-36 8,24 0,24" fill="#ECC94B" />
      <polygon points="8,-36 12,-36 12,24 8,24" fill="#D69E2E" />
      
      <!-- Eraser & Ferrule -->
      <rect x="0" y="-44" width="12" height="8" fill="#CBD5E0" />
      <path d="M0 -44 c0 -4 3 -6 6 -6 s6 2 6 6z" fill="#FC8181" />

      <!-- Pencil Tip -->
      <polygon points="0,24 4,32 8,24" fill="#CBD5E0" />
      <polygon points="3,30 4,32 5,30" fill="#1A1D24" />
    </g>
  </g>
</svg>