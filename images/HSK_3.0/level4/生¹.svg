<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Soft ambient glow behind the subject -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual illustration: Mother and newborn baby representing "生" (birth/new life) -->
  <g transform="translate(0, 10)">
    <!-- Mother's arms and gentle embrace -->
    <path d="M 60 140 C 60 110, 85 95, 120 95 C 155 95, 180 110, 180 140 C 180 160, 160 175, 120 175 C 80 175, 60 160, 60 140 Z" fill="#2D3342" />
    
    <!-- Mother's profile / head leaning down lovingly -->
    <path d="M 85 75 C 75 75, 68 85, 72 95 C 75 102, 85 108, 95 102 C 102 98, 105 88, 98 80 C 94 76, 89 75, 85 75 Z" fill="#E0E6ED" />
    <path d="M 70 88 C 72 93, 78 98, 85 98 C 92 98, 95 90, 95 85 C 85 85, 75 85, 70 88 Z" fill="#1A1D24" opacity="0.15" />

    <!-- Swaddle blanket wrapping the newborn -->
    <path d="M 100 115 C 95 115, 92 125, 98 135 C 104 145, 120 150, 135 145 C 145 140, 148 130, 142 120 C 136 112, 120 110, 100 115 Z" fill="#FFB74D" />
    
    <!-- Fold of the blanket -->
    <path d="M 105 120 C 115 118, 130 122, 138 128 C 135 133, 125 137, 115 135 C 108 133, 103 125, 105 120 Z" fill="#FFA726" />

    <!-- Newborn baby's tiny head and face -->
    <circle cx="115" cy="112" r="14" fill="#E0E6ED" />
    
    <!-- Peaceful closed eye (gentle curved line) -->
    <path d="M 112 112 C 114 114, 116 114, 118 112" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Tiny peaceful smile -->
    <path d="M 114 118 C 115 119, 117 119, 118 118" stroke="#1A1D24" stroke-width="1" stroke-linecap="round" fill="none" />

    <!-- Gentle light / sparkle indicating new life -->
    <path d="M 148 95 L 150 102 L 157 104 L 150 106 L 148 113 L 146 106 L 139 104 L 146 102 Z" fill="#FFE082" />
    <path d="M 85 135 L 86 139 L 90 140 L 86 141 L 85 145 L 84 141 L 80 140 L 84 139 Z" fill="#FFE082" opacity="0.8" />
  </g>
</svg>