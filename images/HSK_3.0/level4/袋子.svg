<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Soft glow / shadow base for depth in dark mode -->
    <ellipse cx="120" cy="200" rx="45" ry="8" fill="#111318" opacity="0.8"/>

    <!-- Shopping / Carry Bag Object representing "袋子" (dàizi) -->
    <!-- Bag Handles -->
    <path d="M 90 95 C 90 55, 150 55, 150 95" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Bag Body (Main Rectangle with subtle rounded bottom) -->
    <path d="M 75 95 L 165 95 L 175 190 C 175 198, 168 205, 160 205 L 80 205 C 72 205, 65 198, 65 190 Z" fill="#3B82F6"/>
    
    <!-- Bag Fold-over Top Edge (Inner shadow / rim) -->
    <path d="M 72 95 L 168 95 L 165 108 L 75 108 Z" fill="#2563EB"/>
    
    <!-- Modern geometric accent / front pocket design on the bag -->
    <path d="M 90 125 L 150 125 L 142 180 L 98 180 Z" fill="#60A5FA" opacity="0.3"/>
    
    <!-- Subtle vertical fold lines / dimension details -->
    <line x1="120" y1="108" x2="120" y2="195" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Highlight elements to match sleek modern flat vector art -->
    <!-- Top rim highlight -->
    <line x1="75" y1="95" x2="165" y2="95" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>