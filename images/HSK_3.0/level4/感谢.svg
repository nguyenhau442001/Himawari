<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Gratitude/Heart -->
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Gift Box Gradients -->
    <linearGradient id="boxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="personLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="personRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <circle cx="120" cy="120" r="90" fill="url(#heartGlow)"/>
  
  <!-- Subtle background stars / sparkles -->
  <g fill="#fbbf24" opacity="0.6">
    <path d="M40 70 L42 75 L47 77 L42 79 L40 84 L38 79 L33 77 L38 75 Z" transform="scale(0.6) translate(20, 20)"/>
    <path d="M190 60 L191 63 L194 64 L191 65 L190 68 L189 65 L186 64 L189 63 Z" transform="scale(0.8) translate(40, 10)"/>
    <path d="M180 170 L182 175 L187 177 L182 179 L180 184 L178 179 L173 177 L178 175 Z" transform="scale(0.5) translate(80, 40)"/>
  </g>

  <!-- Surface / Floor -->
  <ellipse cx="120" cy="205" rx="90" ry="15" fill="#0f172a" opacity="0.8"/>

  <!-- SCENE: Two friendly characters exchanging a gift / showing gratitude -->
  <g filter="url(#softShadow)">
    
    <!-- Left Character (Giving / Thanking) -->
    <g transform="translate(65, 135)">
      <!-- Body -->
      <path d="M-15 45 C-15 25 -5 15 10 15 C25 15 35 25 35 45 L25 65 C20 65 -10 65 -15 45 Z" fill="url(#personLeft)"/>
      <!-- Head -->
      <circle cx="10" cy="-2" r="14" fill="#fed7aa"/>
      <!-- Hair -->
      <path d="M-2 -12 C5 -18 20 -12 24 -4 C20 -8 5 -10 -2 -12 Z" fill="#451a03"/>
      <!-- Arm reaching out -->
      <path d="M20 20 C30 20 40 25 45 30 L40 38 C35 34 28 30 20 28 Z" fill="#0284c7"/>
      <!-- Happy Face -->
      <circle cx="14" cy="-3" r="1.5" fill="#1e293b"/>
      <path d="M12 2 C13 4 16 4 17 2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Right Character (Receiving / Grateful) -->
    <g transform="translate(175, 135)">
      <!-- Body -->
      <path d="M-35 45 C-35 25 -25 15 -10 15 C5 15 15 25 15 45 L5 65 C-5 65 -25 65 -35 45 Z" fill="url(#personRight)"/>
      <!-- Head -->
      <circle cx="-10" cy="-2" r="14" fill="#fed7aa"/>
      <!-- Hair -->
      <path d="M-24 -4 C-20 -14 -5 -18 2 -12 C-5 -10 -20 -8 -24 -4 Z" fill="#1e1b4b"/>
      <!-- Arm reaching out -->
      <path d="M-20 20 C-30 20 -40 25 -45 30 L-40 38 C-35 34 -28 30 -20 28 Z" fill="#059669"/>
      <!-- Happy Face (Eyes closed in joy) -->
      <path d="M-15 -4 L-11 -2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-13 2 C-11 4 -8 4 -7 2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Central Gift Box (Representing the tangible exchange of kindness/appreciation) -->
    <g transform="translate(120, 140)">
      <!-- Drop shadow for box -->
      <ellipse cx="0" cy="25" rx="18" ry="6" fill="#000" opacity="0.3"/>
      
      <!-- Box Base -->
      <path d="M-18 5 L-18 25 C-18 28 -15 30 -12 30 L12 30 C15 30 18 28 18 25 L18 5 Z" fill="url(#boxBody)"/>
      
      <!-- Vertical Ribbon -->
      <rect x="-4" y="5" width="8" height="25" fill="url(#ribbon)"/>
      
      <!-- Box Lid -->
      <path d="M-22 0 L22 0 L20 6 L-20 6 Z" fill="#db2777"/>
      <rect x="-4" y="0" width="8" height="6" fill="#f59e0b"/>

      <!-- Ribbon Bow -->
      <path d="M0 0 C-8 -8 -15 -2 -8 2 C-12 6 -6 10 0 2 Z" fill="url(#ribbon)"/>
      <path d="M0 0 C8 -8 15 -2 8 2 C12 6 6 10 0 2 Z" fill="url(#ribbon)"/>
      <circle cx="0" cy="2" r="2.5" fill="#d97706"/>
    </g>

    <!-- Warm Golden Gratitude Star / Sparkle of Appreciation (Polite & friendly) -->
    <g transform="translate(120, 75)" filter="url(#softShadow)">
      <animateTransform attributeName="transform" type="translate" values="120,78; 120,70; 120,78" dur="3s" repeatCount="indefinite"/>
      <!-- Radiant golden star sparkle -->
      <path d="M0 -15 C1 -4 4 -1 15 0 C4 1 1 4 0 15 C-1 4 -4 1 -15 0 C-4 -1 -1 -4 0 -15 Z" fill="#fbbf24"/>
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.9"/>
    </g>

  </g>

  <!-- Sparkles around the gratitude glow -->
  <g fill="#38bdf8">
    <circle cx="95" cy="70" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="75" r="1.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="55" r="2.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>