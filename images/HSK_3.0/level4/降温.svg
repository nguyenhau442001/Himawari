<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Warm Indoor Light -->
    <radialGradient id="indoor-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="scarf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Coat Gradient -->
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Indoor Ambient Light -->
  <rect width="240" height="240" fill="url(#indoor-glow)"/>

  <!-- BACKGROUND & ENVIRONMENT -->
  <!-- Window Frame & Night View (Representing "Tomorrow's Weather / Temperature Drop") -->
  <g id="window" transform="translate(140, 25)">
    <!-- Window Outer Frame -->
    <rect x="0" y="0" width="70" height="110" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Window Glass (Night Sky) -->
    <rect x="4" y="4" width="62" height="102" fill="url(#night-sky)" rx="3"/>
    
    <!-- Moon (Symbolizing Night before tomorrow's temperature drop) -->
    <circle cx="50" cy="22" r="10" fill="#fef08a" opacity="0.9"/>
    
    <!-- Stars / Cold Sparkles outside -->
    <path d="M15 30 L17 35 L22 37 L17 39 L15 44 L13 39 L8 37 L13 35 Z" fill="#ffffff" opacity="0.6" transform="scale(0.4) translate(15, 20)"/>
    <path d="M15 30 L17 35 L22 37 L17 39 L15 44 L13 39 L8 37 L13 35 Z" fill="#ffffff" opacity="0.8" transform="scale(0.3) translate(90, 80)"/>

    <!-- Window Pane Dividers -->
    <line x1="35" y1="4" x2="35" y2="106" stroke="#475569" stroke-width="2"/>
    <line x1="4" y1="55" x2="66" y2="55" stroke="#475569" stroke-width="2"/>

    <!-- Weather Icon Sticker on Window (Thermometer dropping - visual clue for "降温") -->
    <g transform="translate(12, 65)">
      <!-- Sticker background -->
      <rect x="0" y="0" width="20" height="32" rx="4" fill="#ffffff" opacity="0.9"/>
      <!-- Thermometer Outline -->
      <circle cx="10" cy="24" r="5" fill="#ef4444"/>
      <rect x="8" y="8" width="4" height="15" rx="2" fill="#ef4444"/>
      <!-- Drop Arrow indicating temperature drop -->
      <path d="M4 14 L10 20 L16 14" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- House Interior Props (Bookshelf / Plant / Warm Lamp) -->
  <g id="interior-props">
    <!-- Bookshelf background slice -->
    <rect x="20" y="40" width="35" height="90" fill="#1e293b" opacity="0.5"/>
    <line x1="20" y1="80" x2="55" y2="80" stroke="#334155" stroke-width="3"/>
    <line x1="20" y1="120" x2="55" y2="120" stroke="#334155" stroke-width="3"/>
    
    <!-- Colorful Books on Shelf -->
    <rect x="24" y="60" width="6" height="20" rx="1" fill="#ec4899"/>
    <rect x="31" y="55" width="8" height="25" rx="1" fill="#3b82f6"/>
    <rect x="40" y="62" width="5" height="18" rx="1" fill="#10b981"/>

    <!-- House Plant -->
    <path d="M25 120 Q25 105 32 105 Q39 105 39 120 Z" fill="#0f766e"/>
    <path d="M32 105 Q28 90 22 95" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 105 Q36 85 42 90" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Wall Calendar (Showing tomorrow's preparation) -->
  <g transform="translate(85, 30)">
    <rect x="0" y="0" width="36" height="42" rx="4" fill="#f1f5f9"/>
    <!-- Calendar Header -->
    <rect x="0" y="0" width="36" height="12" rx="4" fill="#ef4444"/>
    <circle cx="10" cy="6" r="2" fill="#cbd5e1"/>
    <circle cx="26" cy="6" r="2" fill="#cbd5e1"/>
    <!-- Calendar Grid lines representing days -->
    <rect x="6" y="18" width="6" height="6" rx="1" fill="#cbd5e1"/>
    <rect x="15" y="18" width="6" height="6" rx="1" fill="#cbd5e1"/>
    <rect x="24" y="18" width="6" height="6" rx="1" fill="#3b82f6"/> <!-- Highlighted tomorrow -->
    <rect x="6" y="28" width="6" height="6" rx="1" fill="#cbd5e1"/>
    <rect x="15" y="28" width="6" height="6" rx="1" fill="#cbd5e1"/>
    <rect x="24" y="28" width="6" height="6" rx="1" fill="#cbd5e1"/>
  </g>

  <!-- Foreground Table -->
  <rect x="0" y="200" width="240" height="40" fill="#334155"/>
  <rect x="0" y="196" width="240" height="6" fill="#475569"/>

  <!-- Table Props: Mug of hot drink (ready for the cold) -->
  <g transform="translate(180, 168)">
    <path d="M 5 8 Q 5 28 15 28 Q 25 28 25 8 Z" fill="#f8fafc"/>
    <!-- Handle -->
    <path d="M 23 11 Q 31 11 31 18 Q 31 25 23 25" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam indicating warm drink for dropping temperature -->
    <path d="M 10 2 Q 13 -2 10 -6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 18 4 Q 21 0 18 -4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- MAIN CHARACTER (Preparing winter clothes / putting on scarf due to temperature drop) -->
  <g id="main-character" transform="translate(65, 80)">
    <!-- Character Body & Heavy Winter Coat -->
    <!-- Torso -->
    <path d="M 30 50 L 20 120 L 70 120 L 60 50 Z" fill="url(#coat-grad)"/>
    <!-- Coat Collar / Lapels -->
    <path d="M 35 50 L 45 75 L 30 90" fill="#c2410c"/>
    <path d="M 55 50 L 45 75 L 60 90" fill="#c2410c"/>

    <!-- Arms & Hands wrapping warm winter clothes -->
    <!-- Left Arm -->
    <path d="M 25 55 Q 10 70 20 95" fill="none" stroke="#ea580c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm -->
    <path d="M 65 55 Q 80 75 65 95" fill="none" stroke="#ea580c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hands -->
    <circle cx="17" cy="98" r="6" fill="#fde68a"/>
    <circle cx="68" cy="98" r="6" fill="#fde68a"/>

    <!-- Neck -->
    <rect x="38" y="38" width="14" height="15" fill="#fde68a"/>

    <!-- Cozy Knitted Scarf (Crucial prop highlighting "降温" / cold weather preparation) -->
    <g id="scarf">
      <!-- Scarf Loop around neck -->
      <path d="M 32 45 Q 45 52 58 45 Q 53 58 37 58 Z" fill="url(#scarf-grad)"/>
      <!-- Scarf Tails hanging down -->
      <path d="M 38 55 L 32 95 L 44 95 L 46 55 Z" fill="url(#scarf-grad)"/>
      <path d="M 38 95 L 32 95 L 32 99 L 44 99 L 44 95 Z" fill="#bae6fd"/> <!-- Fringe -->
      <path d="M 42 52 L 52 85 L 62 80 L 52 48 Z" fill="#0284c7"/>
    </g>

    <!-- Head & Face -->
    <!-- Hair -->
    <path d="M 33 30 Q 45 12 57 30 Q 62 38 58 42 L 32 42 Q 28 38 33 30 Z" fill="#1e293b"/>
    <!-- Face Skin -->
    <circle cx="45" cy="36" r="14" fill="#fde68a"/>
    
    <!-- Facial Expression: Anticipating the cold / thoughtful -->
    <!-- Eyes (Happy / Content squint) -->
    <path d="M 39 34 Q 41 32 43 34" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 47 34 Q 49 32 51 34" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks (Rosy from cold preparation) -->
    <circle cx="38" cy="38" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="52" cy="38" r="3" fill="#f43f5e" opacity="0.4"/>
    <!-- Smile -->
    <path d="M 43 41 Q 45 43 47 41" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute Winter Beanie Hat -->
    <path d="M 31 32 Q 45 16 59 32 Z" fill="#3b82f6"/>
    <!-- Hat Fold/Brim -->
    <rect x="31" y="29" width="28" height="6" rx="3" fill="#2563eb"/>
    <!-- Pom-pom -->
    <circle cx="45" cy="14" r="5" fill="#f8fafc"/>
  </g>

  <!-- Floating Weather / Cold Elements (Subtle stylized snowflakes/chill breeze indicating temperature drop) -->
  <g id="chill-air-effects" opacity="0.7">
    <!-- Wind swirl lines near window -->
    <path d="M 115 70 Q 125 65 135 75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 120 95 Q 130 90 138 98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Stylized gentle snowflake sparkles -->
    <g transform="translate(100, 110)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-4" y1="4" x2="4" y2="-4" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(30, 95) scale(0.7)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>