<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: subtle layered deep forest hills -->
  <path d="M20 180 Q 70 150, 120 165 T 220 155 L 220 200 L 20 200 Z" fill="#242B38"/>
  <path d="M10 190 Q 90 165, 150 180 T 230 170 L 230 205 L 10 205 Z" fill="#1E2430"/>

  <!-- Ground plane -->
  <path d="M0 190 C 60 182, 180 182, 240 190 L 240 215 C 180 220, 60 220, 0 215 Z" fill="#2E384A"/>

  <!-- Forest (树林): Multiple layered trees representing a grove/woods -->
  
  <!-- Far background tree (left) -->
  <path d="M50 145 L62 175 L38 175 Z" fill="#364A45"/>
  <rect x="47" y="175" width="6" height="20" fill="#3D2E24"/>

  <!-- Far background tree (right) -->
  <path d="M190 140 L203 170 L177 170 Z" fill="#364A45"/>
  <rect x="187" y="170" width="6" height="22" fill="#3D2E24"/>

  <!-- Mid-ground tree (left-center) -->
  <path d="M80 120 L98 160 L62 160 Z" fill="#42635A"/>
  <path d="M80 135 L94 165 L66 165 Z" fill="#4E786B"/>
  <rect x="77" y="160" width="6" height="32" fill="#4A382C"/>

  <!-- Mid-ground tree (right-center) -->
  <path d="M160 125 L178 165 L142 165 Z" fill="#42635A"/>
  <path d="M160 140 L174 170 L146 170 Z" fill="#4E786B"/>
  <rect x="157" y="165" width="6" height="27" fill="#4A382C"/>

  <!-- Main Central Tree (Focal Point) -->
  <path d="M120 75 L148 130 L92 130 Z" fill="#528F7B"/>
  <path d="M120 95 L142 145 L98 145 Z" fill="#62A891"/>
  <path d="M120 115 L138 160 L102 160 Z" fill="#75C2A7"/>
  <rect x="114" y="155" width="12" height="37" fill="#594436"/>

  <!-- Contextual element: "树林里有很多小鸟" -> Birds flying/perched in the woods -->
  <!-- Bird 1 (Flying left to right) -->
  <path d="M 65 105 Q 72 98, 80 106 Q 88 98, 95 105 Q 87 110, 80 104 Q 73 110, 65 105 Z" fill="#F4B942"/>
  
  <!-- Bird 2 (Smaller, flying high right) -->
  <path d="M 155 85 Q 161 79, 168 87 Q 175 79, 181 85 Q 174 90, 168 84 Q 162 90, 155 85 Z" fill="#F4B942"/>

  <!-- Bird 3 (Perched on the central tree) -->
  <ellipse cx="103" cy="130" rx="5" ry="4" fill="#F4B942"/>
  <circle cx="106" cy="128" r="1.5" fill="#1A1D24"/>
  <path d="M 98 130 L 95 131 L 98 133 Z" fill="#E28743"/>

  <!-- Subtle ambient nature details (glow/fireflies or forest sparkle for modern flat vector style) -->
  <circle cx="140" cy="110" r="1.5" fill="#F4B942" opacity="0.8"/>
  <circle cx="85" cy="150" r="1" fill="#F4B942" opacity="0.6"/>
  <circle cx="150" cy="150" r="1.5" fill="#F4B942" opacity="0.7"/>
  <circle cx="105" cy="85" r="1" fill="#F4B942" opacity="0.5"/>
</svg>