<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background glow / window representing upper floor "楼上" context -->
  <path d="M50 45 L190 45 L190 195 L50 195 Z" fill="#222733" rx="4"/>
  <path d="M65 60 L125 60 L125 110 L65 110 Z" fill="#2A303D" opacity="0.6"/>
  <path d="M135 60 L175 60 L175 110 L135 110 Z" fill="#2A303D" opacity="0.6"/>

  <!-- Modern Office Desk Setup -->
  <!-- Desk Base -->
  <path d="M60 160 L180 160 L185 175 L55 175 Z" fill="#3A4252"/>
  <rect x="70" y="175" width="12" height="30" fill="#2D333F"/>
  <rect x="158" y="175" width="12" height="30" fill="#2D333F"/>

  <!-- Computer Monitor (Modern Flat Design) -->
  <rect x="95" y="95" width="50" height="34" rx="3" fill="#1A1D24" stroke="#4F5D73" stroke-width="2"/>
  <rect x="98" y="98" width="44" height="28" fill="#3B82F6" opacity="0.15"/>
  <!-- Abstract UI lines on screen representing work -->
  <rect x="103" y="104" width="18" height="3" rx="1.5" fill="#3B82F6"/>
  <rect x="103" y="111" width="28" height="2" rx="1" fill="#4F5D73"/>
  <rect x="103" y="116" width="22" height="2" rx="1" fill="#4F5D73"/>
  <!-- Monitor Stand -->
  <path d="M115 129 L125 129 L127 140 L113 140 Z" fill="#4F5D73"/>
  <rect x="105" y="140" width="30" height="3" rx="1.5" fill="#4F5D73"/>

  <!-- Laptop / Keyboard -->
  <path d="M80 150 L110 150 L115 158 L75 158 Z" fill="#64748B"/>

  <!-- Coffee Mug -->
  <rect x="150" y="142" width="10" height="13" rx="2" fill="#E2E8F0"/>
  <path d="M160 145 C164 145 164 151 160 151" stroke="#E2E8F0" stroke-width="1.5" fill="none"/>

  <!-- Dynamic Human Character (Manager / Working Action) -->
  <!-- Chair Back -->
  <path d="M102 115 L138 115 L135 158 L105 158 Z" fill="#2A303D" rx="4"/>
  
  <!-- Character Body / Torso -->
  <path d="M96 135 C96 122 108 120 120 120 C132 120 144 122 144 135 L142 162 L98 162 Z" fill="#F59E0B"/>
  
  <!-- Collar / Tie accent -->
  <path d="M116 120 L124 120 L122 132 L118 132 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M119 132 L121 132 L122 142 L120 145 L118 142 Z" fill="#EF4444"/>

  <!-- Head -->
  <circle cx="120" cy="104" r="13" fill="#FBCFE8"/>
  <!-- Hair -->
  <path d="M107 104 C107 94 133 94 133 104 C133 98 127 91 120 91 C113 91 107 98 107 104 Z" fill="#1E293B"/>

  <!-- Active Working Arms (Direct Action: typing/interacting) -->
  <!-- Left arm -->
  <path d="M100 132 L88 144 L95 148" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right arm -->
  <path d="M140 132 L150 144 L142 148" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Motion Lines indicating active working/typing -->
  <path d="M85 138 L81 136" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 142 L80 140" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M153 138 L157 136" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M154 142 L158 140" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Focus/Action Accent Elements (Gold/Orange theme for action) -->
  <circle cx="120" cy="45" r="0" fill="none"/> <!-- spacer anchor -->
</svg>