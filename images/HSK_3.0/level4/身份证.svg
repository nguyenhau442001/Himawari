<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/ambient light -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Identity Card (身份证) -->
  <g transform="translate(45, 65)">
    <!-- Card Base -->
    <rect x="0" y="0" width="150" height="100" rx="12" fill="#2D323E" stroke="#3A4150" stroke-width="2"/>
    
    <!-- Header accent stripe -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 138 0 A 12 12 0 0 1 150 12 L 150 28 L 0 28 Z" fill="#3B4252"/>
    <circle cx="18" cy="14" r="4" fill="#E5C07B"/>
    <circle cx="32" cy="14" r="3" fill="#4B5263"/>
    <circle cx="42" cy="14" r="3" fill="#4B5263"/>

    <!-- Photo Placeholder -->
    <rect x="16" y="42" width="36" height="44" rx="6" fill="#1E222B"/>
    <!-- Silhouette Head & Shoulders -->
    <circle cx="34" cy="58" r="10" fill="#4B5263"/>
    <path d="M 20 80 Q 34 68 48 80 Z" fill="#4B5263"/>

    <!-- Data lines (representing text fields) -->
    <rect x="62" y="44" width="65" height="6" rx="3" fill="#E5C07B" opacity="0.85"/>
    <rect x="62" y="58" width="45" height="5" rx="2.5" fill="#4B5263"/>
    <rect x="62" y="69" width="55" height="5" rx="2.5" fill="#4B5263"/>
    <rect x="62" y="80" width="35" height="5" rx="2.5" fill="#3B4252"/>
  </g>

  <!-- Security / Verification Badge overlay -->
  <g transform="translate(145, 125)">
    <circle cx="24" cy="24" r="20" fill="#1A1D24" stroke="#2D323E" stroke-width="4"/>
    <circle cx="24" cy="24" r="16" fill="#98C379"/>
    <path d="M 16 24 L 21 29 L 32 17" fill="none" stroke="#1A1D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>