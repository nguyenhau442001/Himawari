<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Clothing rack bar -->
    <rect x="50" y="60" width="140" height="8" rx="4" fill="#3A3F4B"/>
    <path d="M70 60 L70 45 C70 42 72 40 75 40 L165 40 C168 40 170 42 170 45 L170 60" fill="none" stroke="#3A3F4B" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Rack supports -->
    <path d="M70 64 L50 190" stroke="#3A3F4B" stroke-width="4" stroke-linecap="round"/>
    <path d="M170 64 L190 190" stroke="#3A3F4B" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="50" cy="190" rx="14" ry="5" fill="#2E333D"/>
    <ellipse cx="190" cy="190" rx="14" ry="5" fill="#2E333D"/>

    <!-- Left garment (Blue shirt) -->
    <path d="M80 80 L65 130 L85 135 L95 100 L115 100 L125 135 L145 130 L130 80 Z" fill="#3B82F6"/>
    <path d="M95 100 Q105 110 115 100" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

    <!-- Right garment (Coral dress/shirt) -->
    <path d="M140 80 L125 145 L155 150 L165 100 L185 100 L190 145 L200 145 L180 80 Z" fill="#F43F5E"/>
    <path d="M165 100 Q175 110 185 100" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>

    <!-- Price Tag (Main focus object for 降价) -->
    <g transform="translate(100, 110)">
      <!-- Tag body -->
      <path d="M 10 30 L 50 30 C 53 30 55 32 55 35 L 55 75 C 55 78 53 80 50 80 L 10 80 C 7 80 5 78 5 75 L 5 35 C 5 32 7 30 10 30 Z" fill="#F59E0B"/>
      <!-- Tag hole & ring -->
      <circle cx="15" cy="55" r="4" fill="#1A1D24"/>
      <circle cx="15" cy="55" r="6" fill="none" stroke="#D97706" stroke-width="2"/>
      
      <!-- Downward Arrow Graphic inside Tag -->
      <path d="M 30 45 L 30 65 M 22 57 L 30 65 L 38 57" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>