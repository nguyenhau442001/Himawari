<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow Behind Payment Device -->
  <circle cx="120" cy="115" r="50" fill="#FF9F43" opacity="0.1" filter="blur(10px)"/>

  <!-- POS / Terminal Reader Device -->
  <g transform="translate(145, 75)">
    <!-- Terminal Body -->
    <rect x="0" y="0" width="48" height="75" rx="8" fill="#2C3240"/>
    <!-- Terminal Screen -->
    <rect x="6" y="8" width="36" height="22" rx="4" fill="#1E232D"/>
    <!-- Screen checkmark / icon -->
    <path d="M19 19L23 23L30 15" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Keypad Buttons -->
    <rect x="8" y="38" width="8" height="6" rx="2" fill="#3A4252"/>
    <rect x="20" y="38" width="8" height="6" rx="2" fill="#3A4252"/>
    <rect x="32" y="38" width="8" height="6" rx="2" fill="#3A4252"/>
    
    <rect x="8" y="47" width="8" height="6" rx="2" fill="#3A4252"/>
    <rect x="20" y="47" width="8" height="6" rx="2" fill="#3A4252"/>
    <rect x="32" y="47" width="8" height="6" rx="2" fill="#3A4252"/>

    <rect x="8" y="56" width="8" height="6" rx="2" fill="#3A4252"/>
    <rect x="20" y="56" width="8" height="6" rx="2" fill="#3A4252"/>
    <rect x="32" y="56" width="8" height="6" rx="2" fill="#3A4252"/>
  </g>

  <!-- Radio Waves / NFC Signal (Indicating "Tap to Pay") -->
  <path d="M136 100C138 103 138 107 136 110" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M141 96C145 101 145 109 141 114" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Smartphone (The Noun: physical object used to pay) -->
  <g transform="translate(65, 55) rotate(-12)">
    <!-- Phone Body Shadow -->
    <rect x="2" y="2" width="60" height="110" rx="12" fill="#000000" opacity="0.3"/>
    <!-- Phone Body -->
    <rect x="0" y="0" width="60" height="110" rx="12" fill="#252A34"/>
    <rect x="2" y="2" width="56" height="106" rx="10" fill="#1E232D"/>
    
    <!-- Screen UI - Payment Success Graphic -->
    <circle cx="30" cy="50" r="18" fill="#FF9F43" opacity="0.2"/>
    <circle cx="30" cy="50" r="12" fill="#FF9F43"/>
    <path d="M25 50L28 53L36 45" stroke="#1E232D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Digital Wallet Card graphic on screen -->
    <rect x="12" y="78" width="36" height="16" rx="3" fill="#323846"/>
    <circle cx="20" cy="86" r="3" fill="#FF9F43"/>

    <!-- Speaker Notch -->
    <rect x="22" y="7" width="16" height="3" rx="1.5" fill="#3A4252"/>
  </g>

  <!-- Hand Holding Phone (Human Element anchoring context) -->
  <path d="M45 160C45 130 65 115 85 110L95 155C95 165 85 175 70 175C55 175 45 170 45 160Z" fill="#E0A96D"/>

  <!-- Sparkles / Success Indicators -->
  <path d="M100 45L103 52L110 55L103 58L100 65L97 58L90 55L97 52L100 45Z" fill="#FF9F43" opacity="0.9"/>
  <path d="M165 40L167 44L171 46L167 48L165 52L163 48L159 46L163 44L165 40Z" fill="#FFD37A" opacity="0.6"/>

</svg>