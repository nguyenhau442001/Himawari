<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stack of magazines representing "期" (issue/number) -->
  <g transform="translate(60, 60)">
    <!-- Bottom Magazine -->
    <rect x="10" y="40" width="100" height="120" rx="4" fill="#3D4451"/>
    <rect x="20" y="50" width="80" height="10" rx="2" fill="#FFB84D"/>
    <rect x="20" y="70" width="80" height="60" rx="2" fill="#2C3340"/>
    
    <!-- Middle Magazine -->
    <rect x="5" y="20" width="100" height="120" rx="4" fill="#4A5263"/>
    <rect x="15" y="30" width="80" height="10" rx="2" fill="#FFB84D"/>
    <rect x="15" y="50" width="80" height="60" rx="2" fill="#3D4451"/>
    
    <!-- Top Magazine (Focus) -->
    <rect x="0" y="0" width="100" height="120" rx="4" fill="#FFB84D"/>
    <rect x="10" y="10" width="80" height="10" rx="2" fill="#1A1D24"/>
    <rect x="10" y="30" width="80" height="60" rx="2" fill="#2C3340"/>
    <circle cx="50" cy="100" r="10" fill="#1A1D24"/>
  </g>
</svg>