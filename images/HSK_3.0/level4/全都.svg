<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Background Surface -->
  <path d="M40 170 L200 170 L210 200 L30 200 Z" fill="#222731" opacity="0.6"/>

  <!-- Open Textbook / Notebook representing "Homework" (作业) -->
  <path d="M55 110 L120 95 L185 110 L185 165 L120 180 L55 165 Z" fill="#2A313C"/>
  <path d="M120 95 L120 180" stroke="#1A1D24" stroke-width="3"/>

  <!-- Notebook Pages -->
  <path d="M63 115 L115 103 L115 168 L63 158 Z" fill="#E2E8F0"/>
  <path d="M177 115 L125 103 L125 168 L177 158 Z" fill="#E2E8F0"/>

  <!-- Homework Lines (Writing/Content) -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <!-- Left page text lines -->
    <line x1="73" y1="120" x2="105" y2="114"/>
    <line x1="73" y1="130" x2="108" y2="124"/>
    <line x1="73" y1="140" x2="98" y2="135"/>
    
    <!-- Right page text lines -->
    <line x1="135" y1="114" x2="167" y2="120"/>
    <line x1="135" y1="124" x2="160" y2="130"/>
    <line x1="135" y1="135" x2="165" y2="141"/>
  </g>

  <!-- COMPLETION BADGES & CHECKMARKS (Visualizing "全都做完了" - All finished) -->
  <!-- Checkmark 1 on left page -->
  <circle cx="95" cy="152" r="10" fill="#10B981"/>
  <path d="M90 152 L93 155 L101 147" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark 2 on right page -->
  <circle cx="145" cy="152" r="10" fill="#10B981"/>
  <path d="M140 152 L143 155 L151 147" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating "All / Complete" glowing checkmark cluster representing "全都" (Entirety / Everything Done) -->
  <g transform="translate(0, -10)">
    <circle cx="120" cy="65" r="22" fill="#F59E0B" opacity="0.2"/>
    <circle cx="120" cy="65" r="16" fill="#F59E0B"/>
    <path d="M112 65 L117 70 L128 59" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Secondary accent indicators for "Everything / All" -->
  <circle cx="75" cy="85" r="5" fill="#3B82F6"/>
  <circle cx="165" cy="85" r="5" fill="#3B82F6"/>
  <circle cx="150" cy="70" r="3" fill="#10B981"/>
  <circle cx="90" cy="70" r="3" fill="#10B981"/>
</svg>