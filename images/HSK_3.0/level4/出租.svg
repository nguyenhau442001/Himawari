<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background architectural details (subtle window grid for the apartment context) -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <line x1="40" y1="50" x2="200" y2="50" />
    <line x1="40" y1="90" x2="200" y2="90" />
    <line x1="120" y1="50" x2="120" y2="90" />
  </g>

  <!-- Central Object: Modern Apartment Building representing "这套房子" -->
  <!-- Building body -->
  <rect x="70" y="60" width="100" height="135" rx="4" fill="#2C323D" />
  
  <!-- Building roof/top accent -->
  <path d="M65 60 L120 40 L175 60 Z" fill="#3A4252" />

  <!-- Windows (Apartment units) -->
  <!-- Row 1 -->
  <rect x="85" y="75" width="25" height="30" rx="3" fill="#3E4859" />
  <rect x="130" y="75" width="25" height="30" rx="3" fill="#3E4859" />
  
  <!-- Row 2 -->
  <rect x="85" y="115" width="25" height="30" rx="3" fill="#3E4859" />
  <rect x="130" y="115" width="25" height="30" rx="3" fill="#3E4859" />

  <!-- Building Entrance -->
  <path d="M105 195 L105 165 C105 160 135 160 135 165 L135 195 Z" fill="#1F242D" />

  <!-- FOR RENT Sign ("出租" - physical key visual indicator placed prominently in front) -->
  <!-- Sign post -->
  <rect x="117" y="150" width="6" height="50" fill="#E59838" />
  
  <!-- Sign Board (Gold/Orange high-contrast accent) -->
  <rect x="70" y="130" width="100" height="38" rx="6" fill="#F2A93B" stroke="#1A1D24" stroke-width="3" />
  
  <!-- Key icon carved/depicted on the sign to represent renting/leasing a property -->
  <g transform="translate(105, 137) scale(0.8)">
    <!-- Key ring -->
    <circle cx="12" cy="12" r="7" fill="none" stroke="#1A1D24" stroke-width="4"/>
    <!-- Key shaft -->
    <line x1="18" y1="12" x2="38" y2="12" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <!-- Key teeth -->
    <line x1="30" y1="12" x2="30" y2="17" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="12" x2="35" y2="16" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ambient lighting/glow on sign -->
  <rect x="74" y="134" width="92" height="6" rx="3" fill="#FFFFFF" opacity="0.25" />
</svg>