<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="195" rx="70" ry="10" fill="#111318"/>

  <!-- Physical Object: A framed art painting (representing the artwork bought) -->
  <g transform="translate(65, 40)">
    <!-- Outer Frame -->
    <rect x="0" y="0" width="110" height="90" rx="4" fill="#C59B27" stroke="#E2B739" stroke-width="2"/>
    <!-- Inner Matting -->
    <rect x="8" y="8" width="94" height="74" fill="#F4F5F7"/>
    <!-- Abstract Art inside the painting -->
    <path d="M18 62 L45 35 L68 55 L92 28 L92 72 L18 72 Z" fill="#3B82F6" opacity="0.8"/>
    <circle cx="75" cy="32" r="10" fill="#F59E0B"/>
  </g>

  <!-- Physical Object: A prominent golden price tag (hanging/attached) symbolizing "高价" (High Price) -->
  <g transform="translate(100, 115)">
    <!-- Tag String/Ribbon -->
    <path d="M 20 -15 Q 10 -25 5 -45" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Tag Body (Large, glowing gold to emphasize high value) -->
    <polygon points="10,0 80,0 110,35 80,70 10,70" fill="#F59E0B" stroke="#FBBF24" stroke-width="2"/>
    
    <!-- Tag Hole -->
    <circle cx="25" cy="35" r="6" fill="#1A1D24"/>

    <!-- Prominent Dollar/Currency Symbol (representing high cost/price) -->
    <path d="M 62 20 
             L 62 50 
             M 54 26 
             C 54 26, 75 22, 75 33 
             C 75 44, 50 42, 50 51 
             C 50 60, 72 56, 72 56" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>