<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to create depth for the dark theme -->
  <circle cx="120" cy="120" r="80" fill="#242832" opacity="0.5"/>

  <!-- Wall mounting structure (Door/Wall frame context) -->
  <rect x="95" y="45" width="50" height="12" rx="4" fill="#3A4252"/>
  <rect x="115" y="57" width="10" height="16" fill="#2C323D"/>

  <!-- Main Signboard (Biển, bảng) -->
  <g transform="translate(0, 0)">
    <!-- Sign Board Body -->
    <rect x="52" y="73" width="136" height="94" rx="10" fill="#F0F3F9" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Inner Border Accent -->
    <rect x="60" y="81" width="120" height="78" rx="6" fill="#FFFFFF"/>
    
    <!-- Contextual Graphic: No Smoking Symbol (Matching sentence reference: "门口有一个牌，上面写着禁止吸烟。") -->
    <!-- Cigarette -->
    <rect x="95" y="112" width="38" height="6" rx="3" fill="#A0AEC0"/>
    <rect x="133" y="112" width="6" height="6" fill="#ED8936"/>
    <!-- Smoke wisp -->
    <path d="M 120 102 Q 125 96 120 90 T 120 78" fill="none" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Prohibition Circle & Slash -->
    <circle cx="114" cy="115" r="28" fill="none" stroke="#E53E3E" stroke-width="6"/>
    <line x1="94" y1="95" x2="134" y2="135" stroke="#E53E3E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Decorative playing card corner peek (representing 'bài chơi' / card aspect of 牌) -->
  <g transform="translate(32, 142) rotate(-15)">
    <rect width="36" height="50" rx="4" fill="#2D3748" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="4" y="4" width="28" height="42" rx="2" fill="#FFFFFF"/>
    <path d="M 18 20 C 18 16 13 14 13 18 C 13 22 18 26 18 26 C 18 26 23 22 23 18 C 23 14 18 16 18 20 Z" fill="#E53E3E"/>
  </g>

  <!-- Decorative label tag corner peek (representing 'nhãn hiệu' / label aspect of 牌) -->
  <g transform="translate(172, 138) rotate(15)">
    <rect width="36" height="44" rx="6" fill="#F6AD55"/>
    <circle cx="18" cy="14" r="4" fill="#1A1D24"/>
    <line x1="10" y1="26" x2="26" y2="26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="34" x2="22" y2="34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>