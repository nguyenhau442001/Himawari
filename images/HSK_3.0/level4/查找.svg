<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="10" fill="#343A46" rx="2"/>
  <rect x="50" y="170" width="10" height="40" fill="#2C313C"/>
  <rect x="180" y="170" width="10" height="40" fill="#2C313C"/>
  
  <!-- Laptop -->
  <path d="M70 160 L170 160 L185 130 L55 130 Z" fill="#4A5568"/>
  <path d="M60 130 L180 130 L180 125 C180 122 178 120 175 120 L65 120 C62 120 60 122 60 125 Z" fill="#718096"/>
  <rect x="65" y="125" width="110" height="30" fill="#2D3748"/>
  
  <!-- Screen Content (Abstract search results) -->
  <rect x="75" y="130" width="90" height="4" fill="#F6AD55" opacity="0.8"/>
  <rect x="75" y="138" width="70" height="4" fill="#A0AEC0" opacity="0.6"/>
  <rect x="75" y="146" width="80" height="4" fill="#A0AEC0" opacity="0.6"/>
  
  <!-- Character -->
  <g transform="translate(120, 110)">
    <!-- Head -->
    <circle cx="0" cy="0" r="15" fill="#E2E8F0"/>
    <!-- Eyes -->
    <circle cx="-5" cy="-2" r="2" fill="#1A1D24"/>
    <circle cx="5" cy="-2" r="2" fill="#1A1D24"/>
    <!-- Arm reaching to screen -->
    <path d="M10 10 L35 30" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <!-- Magnifying Glass -->
    <circle cx="45" cy="40" r="12" stroke="#F6AD55" stroke-width="4" fill="none"/>
    <line x1="53" y1="48" x2="65" y2="60" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M30 100 Q50 80 70 90" stroke="#F6AD55" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M170 90 Q190 80 210 100" stroke="#F6AD55" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>