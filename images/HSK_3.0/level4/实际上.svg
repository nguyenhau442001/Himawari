<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow representing depth/reality contrast -->
  <circle cx="120" cy="120" r="85" fill="#222733" opacity="0.6"/>
  
  <!-- Conceptual physical object: A dual-layered transparent architectural/human model or physical reveal-box showing appearance vs internal reality -->
  <!-- Outer strict exterior (The surface impression - strict teacher silhouette/mask) -->
  <g transform="translate(0, 0)">
    <!-- Base podium/desk -->
    <path d="M 80 180 L 160 180 L 170 195 L 70 195 Z" fill="#2E3646"/>
    <rect x="90" y="150" width="60" height="30" rx="4" fill="#3A445A"/>
    
    <!-- Strict Mask / Outer Persona (Dark slate with sharp, unsmiling silhouette lines) -->
    <path d="M 120 70 C 98 70 85 88 85 110 C 85 130 95 145 105 150 L 135 150 C 145 145 155 130 155 110 C 155 88 142 70 120 70 Z" fill="#2A3140" stroke="#4A5568" stroke-width="2"/>
    <!-- Stern brow & glasses outline -->
    <line x1="100" y1="102" x2="114" y2="106" stroke="#718096" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="126" y1="106" x2="140" y2="102" stroke="#718096" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="98" y="98" width="18" height="12" rx="2" fill="none" stroke="#718096" stroke-width="2"/>
    <rect x="124" y="98" width="18" height="12" rx="2" fill="none" stroke="#718096" stroke-width="2"/>
    <!-- Stern mouth -->
    <line x1="110" y1="135" x2="130" y2="135" stroke="#718096" stroke-width="2" stroke-linecap="round"/>

    <!-- Inner Core / The Reality (Warm gold/orange glowing caring element revealed from within) -->
    <g transform="translate(120, 115)">
      <!-- Radiating warm core representing genuine care/warmth ("实际上") -->
      <circle cx="0" cy="0" r="22" fill="#D69E2E" opacity="0.2"/>
      <circle cx="0" cy="0" r="15" fill="#ED8936"/>
      
      <!-- Friendly warm smile and soft glowing elements inside -->
      <path d="M -6 -2 C -6 -2 -4 -5 -2 -2" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <path d="M 2 -2 C 2 -2 4 -5 6 -2" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <path d="M -5 3 C -3 7 3 7 5 3" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Cutaway/Reveal effect: Spotlight / Lens focusing on the core reality -->
    <path d="M 60 115 L 90 115" stroke="#ED8936" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
    <path d="M 150 115 L 180 115" stroke="#ED8936" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
    
    <!-- Magnifying lens overlay emphasizing "reality" / "actual fact" -->
    <circle cx="120" cy="115" r="42" fill="none" stroke="#F6AD55" stroke-width="3" opacity="0.9"/>
    <path d="M 150 145 L 175 170" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>