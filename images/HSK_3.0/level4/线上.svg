<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing background network line (representing 'xiàn' / wire/line) -->
  <path d="M 30,120 Q 90,70 120,120 T 210,120" fill="none" stroke="#2D3748" stroke-width="4" stroke-linecap="round"/>
  <path d="M 30,120 Q 90,70 120,120 T 210,120" fill="none" stroke="#3182CE" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.6"/>

  <!-- Physical Object: Modern Sleek Laptop (representing 'online' terminal/place) -->
  <!-- Laptop Base/Keyboard Deck -->
  <path d="M 60,158 L 180,158 C 185,158 188,162 186,166 L 176,182 C 174,185 170,187 166,187 L 74,187 C 70,187 66,185 64,182 L 54,166 C 52,162 55,158 60,158 Z" fill="#4A5568"/>
  <path d="M 74,187 L 166,187 C 168,187 170,189 170,191 L 170,193 C 170,195 168,197 166,197 L 74,197 C 72,197 70,195 70,193 L 70,191 C 70,189 72,187 74,187 Z" fill="#2D3748"/>
  <rect x="105" y="170" width="30" height="12" rx="2" fill="#2D3748" opacity="0.5"/>

  <!-- Laptop Screen Frame -->
  <rect x="68" y="58" width="104" height="96" rx="8" fill="#2D3748"/>
  <rect x="73" y="63" width="94" height="86" rx="4" fill="#0F172A"/>

  <!-- Video Call Interface on Screen (Context: "我们今天在线上开会") -->
  <!-- Participant 1 -->
  <circle cx="95" cy="93" r="14" fill="#3182CE"/>
  <path d="M 81,114 C 83,107 88,105 95,105 C 102,105 107,107 109,114 Z" fill="#63B3ED"/>
  
  <!-- Participant 2 -->
  <circle cx="145" cy="93" r="14" fill="#DD6B20"/>
  <path d="M 131,114 C 133,107 138,105 145,105 C 152,105 157,107 159,114 Z" fill="#FBD38D"/>

  <!-- Connecting Video Grid Line -->
  <line x1="85" y1="130" x2="155" y2="130" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>

  <!-- Active Connection Node/Pulse (Focus accent: Orange/Gold) -->
  <circle cx="120" cy="120" r="16" fill="#DD6B20" opacity="0.2"/>
  <circle cx="120" cy="120" r="8" fill="#ED8936"/>
  <circle cx="120" cy="120" r="3" fill="#FFFFFF"/>

  <!-- Webcam indicator -->
  <circle cx="120" cy="60" r="1.5" fill="#64748B"/>
</svg>