<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- House Body -->
  <rect x="70" y="80" width="100" height="80" fill="#E0E0E0"/>
  
  <!-- House Roof (Accent color) -->
  <polygon points="70,80 120,40 170,80" fill="#FFA500"/>
  
  <!-- House Door -->
  <rect x="105" y="120" width="30" height="40" fill="#4A4A4A"/>
  
  <!-- House Window -->
  <rect x="85" y="100" width="20" height="20" fill="#FFFFFF"/>
  
  <!-- Stack of Coins (Gold accent color, representing rent) -->
  <circle cx="155" cy="175" r="18" fill="#FFD700"/>
  <circle cx="155" cy="160" r="18" fill="#FFD700"/>
  <circle cx="155" cy="145" r="18" fill="#FFD700"/>
</svg>