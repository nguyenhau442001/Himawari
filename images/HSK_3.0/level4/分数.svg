<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 分数 (Exam score / Test paper with grade) -->
  <g transform="translate(0, 0)">
    <!-- Subtle background glow/shadow for the test paper -->
    <path d="M 68 36 L 172 36 C 177.5 36 182 40.5 182 46 L 182 194 C 182 199.5 177.5 204 172 204 L 68 204 C 62.5 204 58 199.5 58 194 L 58 46 C 58 40.5 62.5 36 68 36 Z" fill="#0E1116" opacity="0.6"/>

    <!-- Main Test Paper -->
    <path d="M 70 30 L 155 30 L 182 57 L 182 202 C 182 207.5 177.5 212 172 212 L 70 212 C 64.5 212 60 207.5 60 202 L 60 40 C 60 34.5 64.5 30 70 30 Z" fill="#F4F6F9"/>
    
    <!-- Paper folded top-right corner -->
    <path d="M 155 30 L 182 57 L 155 57 Z" fill="#D2D6DC"/>

    <!-- Red Grade Circle / Score Stamp (Indicating the test score concept) -->
    <circle cx="121" cy="95" r="32" fill="none" stroke="#FF4757" stroke-width="5" stroke-dasharray="180 15" stroke-linecap="round" transform="rotate(-15 121 95)"/>
    
    <!-- Score digits inside the stamp representing 分数 (e.g., 85) -->
    <path d="M 112 82 C 112 79 115 76 119 76 C 123 76 126 79 126 82 C 126 85 123 88 119 88 C 115 88 112 85 112 82 Z" fill="#FF4757"/>
    <path d="M 111 93 C 111 90 114 87 118 87 C 122 87 125 90 125 93 C 125 96 122 99 118 99 C 114 99 111 96 111 93 Z" fill="#FF4757"/>
    <!-- Simplified 5 or grade strokes -->
    <path d="M 129 78 L 137 78 L 133 93 C 137 93 140 95 140 98 C 140 102 136 105 131 105 C 127 105 124 102 124 99" fill="none" stroke="#FF4757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Document Header lines (mocking name, date fields) -->
    <rect x="76" y="46" width="45" height="4" rx="2" fill="#D2D6DC"/>
    <line x1="76" y1="58" x2="130" y2="58" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"/>

    <!-- Content lines on test paper (simulating questions/answers) -->
    <!-- Item 1 -->
    <circle cx="72" cy="138" r="3" fill="#6B7280"/>
    <rect x="82" y="136" width="65" height="4" rx="2" fill="#D2D6DC"/>
    <rect x="82" y="145" width="45" height="4" rx="2" fill="#E5E7EB"/>
    <circle cx="166" cy="140" r="6" fill="none" stroke="#10B981" stroke-width="2"/> <!-- Checkmark or indicator -->

    <!-- Item 2 -->
    <circle cx="72" cy="168" r="3" fill="#6B7280"/>
    <rect x="82" y="166" width="75" height="4" rx="2" fill="#D2D6DC"/>
    <rect x="82" y="175" width="55" height="4" rx="2" fill="#E5E7EB"/>
    <path d="M 161 166 L 171 176 M 171 166 L 161 176" stroke="#FF4757" stroke-width="2.5" stroke-linecap="round"/> <!-- Cross/incorrect indicator -->

    <!-- Item 3 -->
    <circle cx="72" cy="198" r="3" fill="#6B7280"/>
    <rect x="82" y="196" width="50" height="4" rx="2" fill="#D2D6DC"/>

    <!-- Accent floating pen/pencil beside the paper to ground the educational context -->
    <g transform="translate(182, 115) rotate(25)">
      <!-- Pencil body -->
      <polygon points="-8,-40 8,-40 8,30 -8,30" fill="#FFA502"/>
      <!-- Pencil tip -->
      <polygon points="-8,30 8,30 0,45" fill="#E5E7EB"/>
      <polygon points="-3,40 3,40 0,45" fill="#1A1D24"/>
      <!-- Eraser metal band -->
      <rect x="-8" y="-48" width="16" height="8" fill="#9CA3AF"/>
      <!-- Eraser -->
      <path d="M -8 -48 L 8 -48 L 8 -54 C 8 -58 4 -60 0 -60 C -4 -60 -8 -58 -8 -54 Z" fill="#FF6B81"/>
    </g>
  </g>
</svg>