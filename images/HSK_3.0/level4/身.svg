<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Outfit / "身" as in "一身衣服" (A full set of clothing) -->
  <g transform="translate(0, 5)">
    <!-- Hanger hook -->
    <path d="M120 42 C120 36 125 32 130 32 C135 32 138 36 138 40 C138 44 130 48 120 54" 
          fill="none" stroke="#6C7A89" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Hanger triangle -->
    <path d="M120 54 L55 82 L185 82 Z" fill="none" stroke="#6C7A89" stroke-width="4" stroke-linejoin="round"/>

    <!-- Complete Outfit (Jacket/Coat and Pants set) -->
    <!-- Coat / Upper Garment -->
    <path d="M85 82 L70 120 L85 130 L95 105 L120 115 L145 105 L155 130 L170 120 L155 82 Z" 
          fill="#34495E"/>
    
    <!-- Inner collar -->
    <path d="M105 82 L120 98 L135 82 Z" fill="#2C3E50"/>

    <!-- Accent details (Buttons & Zipper) -->
    <line x1="120" y1="98" x2="120" y2="135" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="108" r="2" fill="#F39C12"/>
    <circle cx="120" cy="122" r="2" fill="#F39C12"/>

    <!-- Sleeves -->
    <path d="M70 120 L55 145 L70 155 L85 130 Z" fill="#2C3E50"/>
    <path d="M170 120 L185 145 L170 155 L155 130 Z" fill="#2C3E50"/>

    <!-- Pants / Lower Garment (Hanging neatly underneath as a complete outfit) -->
    <g transform="translate(0, 15)">
      <!-- Waistband -->
      <rect x="92" y="125" width="56" height="10" rx="3" fill="#2C3E50"/>
      
      <!-- Pants legs -->
      <path d="M96 135 L96 175 L116 175 L120 145 L124 175 L144 175 L144 135 Z" 
            fill="#2C3E50"/>
      <!-- Crease lines -->
      <line x1="106" y1="138" x2="106" y2="170" stroke="#1F2C3A" stroke-width="2" stroke-linecap="round"/>
      <line x1="134" y1="138" x2="134" y2="170" stroke="#1F2C3A" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Focus accent highlight ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#F1C40F" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
</svg>