<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "迟" (Late/Chí - represented as a classic mechanical pocket watch showing a hurried, running traveler/character context or late arrival metaphor) -->
  
  <!-- Subtle background glow/clock aura -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>
  
  <!-- Clock face representing time / being late -->
  <circle cx="120" cy="115" r="60" fill="none" stroke="#3A4256" stroke-width="4"/>
  
  <!-- Clock markers -->
  <line x1="120" y1="60" x2="120" y2="66" stroke="#5C6882" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="164" x2="120" y2="170" stroke="#5C6882" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="115" x2="71" y2="115" stroke="#5C6882" stroke-width="3" stroke-linecap="round"/>
  <line x1="169" y1="115" x2="175" y2="115" stroke="#5C6882" stroke-width="3" stroke-linecap="round"/>

  <!-- Clock hands pointing to a late hour (e.g., almost 12) -->
  <line x1="120" y1="115" x2="120" y2="80" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="115" x2="145" y2="105" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="115" r="4" fill="#F59E0B"/>

  <!-- Pocket watch crown/ring on top -->
  <path d="M113 51 L127 51 L125 43 C125 40 115 40 115 43 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="120" cy="38" r="7" fill="none" stroke="#F59E0B" stroke-width="3"/>

  <!-- Speed lines / Urgency lines indicating rushing because of being late -->
  <path d="M45 135 L70 135" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M35 150 L60 150" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M50 165 L75 165" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Running character silhouette / physical person object context -->
  <!-- Head -->
  <circle cx="155" cy="145" r="10" fill="#E2E8F0"/>
  <!-- Body/Torso leaning forward -->
  <path d="M148 160 L162 155 L170 175 L155 180 Z" fill="#E2E8F0"/>
  <!-- Briefcase/Bag (symbolizing everyday life/appointment) -->
  <rect x="165" y="170" width="14" height="10" rx="2" fill="#F59E0B"/>
  <path d="M170 170 V167 C170 166 174 166 174 167 V170" fill="none" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- Running legs -->
  <path d="M155 180 L140 195" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <path d="M162 178 L175 192" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

  <!-- Educational UI Label Pill -->
  <rect x="70" y="200" width="100" height="24" rx="12" fill="#252A34" stroke="#3A4256" stroke-width="1.5"/>
  <text x="120" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle" letter-spacing="1.5">MỘT / CHẬM</text>
</svg>