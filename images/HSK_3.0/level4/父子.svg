<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/accent representing connection -->
  <circle cx="120" cy="120" r="70" fill="#222733"/>
  <path d="M 90 140 Q 120 110 150 140" stroke="#2D3342" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Father Figure (Left) -->
  <g transform="translate(68, 65)">
    <!-- Body / Shoulders -->
    <path d="M 10 95 C 10 70, 20 60, 42 60 C 64 60, 74 70, 74 95 Z" fill="#3B82F6"/>
    <!-- Collar / Shirt detail -->
    <path d="M 32 60 L 42 72 L 52 60 Z" fill="#1E293B"/>
    <!-- Head -->
    <circle cx="42" cy="36" r="18" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M 24 36 C 24 24, 32 18, 42 18 C 52 18, 60 24, 60 36 C 54 30, 30 30, 24 36 Z" fill="#4B5563"/>
    <!-- Facial expression / Glasses (mature look) -->
    <circle cx="48" cy="35" r="2.5" fill="#1E293B"/>
    <path d="M 38 43 Q 42 47 46 43" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Son Figure (Right) -->
  <g transform="translate(110, 85)">
    <!-- Body / Shoulders (slightly smaller) -->
    <path d="M 12 75 C 12 55, 20 48, 38 48 C 56 48, 64 55, 64 75 Z" fill="#10B981"/>
    <!-- Collar / Shirt detail -->
    <path d="M 28 48 L 38 58 L 48 48 Z" fill="#1E293B"/>
    <!-- Head -->
    <circle cx="38" cy="28" r="15" fill="#FBBF24"/>
    <!-- Hair (youthful spiky style) -->
    <path d="M 23 26 C 23 14, 30 10, 38 12 C 46 10, 53 14, 53 26 C 47 20, 29 20, 23 26 Z" fill="#1E293B"/>
    <!-- Facial expression -->
    <circle cx="42" cy="27" r="2" fill="#1E293B"/>
    <path d="M 34 33 Q 38 37 42 33" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Connection / Interaction: Holding hands or walking side by side -->
  <!-- Overlapping arms creating a bond -->
  <path d="M 98 145 C 105 135, 115 135, 122 145" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- High-contrast focus accent: Floating symbolic relationship spark above -->
  <circle cx="120" cy="45" r="4" fill="#F59E0B"/>
  <path d="M 112 35 Q 120 25 128 35" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Ground shadow -->
  <ellipse cx="120" cy="175" rx="75" ry="6" fill="#11141B"/>
</svg>