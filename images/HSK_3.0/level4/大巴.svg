<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 60)">
    <!-- Road -->
    <rect x="0" y="95" width="200" height="6" fill="#2E3440" rx="3"/>
    
    <!-- Large Coach Bus (大巴) -->
    <!-- Bus Body Base -->
    <path d="M15,55 L185,55 C193,55 198,61 198,69 L198,100 L2,100 L2,69 C2,61 7,55 15,55 Z" fill="#3B82F6"/>
    
    <!-- Roof Accent -->
    <path d="M20,55 L180,55 L180,52 C180,48 176,44 171,44 L29,44 C24,44 20,48 20,52 Z" fill="#1D4ED8"/>

    <!-- Front & Rear Bumpers/Trim -->
    <rect x="2" y="92" width="196" height="8" fill="#1E293B"/>
    
    <!-- Windshield -->
    <path d="M165,58 L188,58 C192,58 195,61 195,66 L195,82 L165,82 Z" fill="#93C5FD"/>
    <path d="M167,60 L187,60 C189,60 191,62 191,64 L191,80 L167,80 Z" fill="#E0F2FE"/>

    <!-- Side Windows -->
    <rect x="15" y="60" width="22" height="22" rx="3" fill="#93C5FD"/>
    <rect x="42" y="60" width="28" height="22" rx="3" fill="#93C5FD"/>
    <rect x="74" y="60" width="28" height="22" rx="3" fill="#93C5FD"/>
    <rect x="106" y="60" width="28" height="22" rx="3" fill="#93C5FD"/>
    <rect x="138" y="60" width="22" height="22" rx="3" fill="#93C5FD"/>
    
    <!-- Window Highlights -->
    <rect x="17" y="62" width="18" height="6" rx="1" fill="#E0F2FE" opacity="0.6"/>
    <rect x="44" y="62" width="24" height="6" rx="1" fill="#E0F2FE" opacity="0.6"/>
    <rect x="76" y="62" width="24" height="6" rx="1" fill="#E0F2FE" opacity="0.6"/>
    <rect x="108" y="62" width="24" height="6" rx="1" fill="#E0F2FE" opacity="0.6"/>
    <rect x="140" y="62" width="18" height="6" rx="1" fill="#E0F2FE" opacity="0.6"/>

    <!-- Headlight & Grille -->
    <rect x="193" y="85" width="4" height="6" rx="2" fill="#FBBF24"/>
    <rect x="180" y="86" width="12" height="4" fill="#64748B"/>
    
    <!-- Taillight -->
    <rect x="2" y="85" width="3" height="6" rx="1" fill="#EF4444"/>

    <!-- Wheels -->
    <g>
      <!-- Rear Wheel -->
      <circle cx="45" cy="100" r="16" fill="#0F172A"/>
      <circle cx="45" cy="100" r="10" fill="#94A3B8"/>
      <circle cx="45" cy="100" r="4" fill="#334155"/>
    </g>
    <g>
      <!-- Front Wheel -->
      <circle cx="155" cy="100" r="16" fill="#0F172A"/>
      <circle cx="155" cy="100" r="10" fill="#94A3B8"/>
      <circle cx="155" cy="100" r="4" fill="#334155"/>
    </g>
    
    <!-- Modern Accent Stripe -->
    <path d="M2,88 L198,88 L198,90 L2,90 Z" fill="#F59E0B"/>
