<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow for Warmth -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.06" />

  <!-- Semantic Illustration: "客气" (Politeness, bowing in a warm home/welcoming context) -->
  <g transform="translate(0, 10)">
    <!-- Floor Line -->
    <line x1="50" y1="175" x2="190" y2="175" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Character (Host welcoming warmly) -->
    <g id="host">
      <!-- Body / Torso -->
      <path d="M 85 145 L 98 175 L 72 175 Z" fill="#264653" />
      <rect x="75" y="115" width="26" height="35" rx="6" fill="#2A9D8F" />
      <!-- Head -->
      <circle cx="88" cy="98" r="12" fill="#E9C46A" />
      <!-- Hair -->
      <path d="M 76 96 C 76 89, 100 89, 100 96 Z" fill="#2B2D42" />
      <!-- Welcoming Arm (Gesture toward center) -->
      <path d="M 92 125 C 105 125, 110 135, 108 140" fill="none" stroke="#2A9D8F" stroke-width="6" stroke-linecap="round" />
      <circle cx="109" cy="142" r="4" fill="#E9C46A" />
      <!-- Warm Smile Face Detail -->
      <circle cx="92" cy="97" r="1.5" fill="#2B2D42" />
    </g>

    <!-- Right Character (Guest politely bowing/returning the gesture) -->
    <g id="guest" transform="translate(44, 0)">
      <!-- Slightly bowed posture group -->
      <g transform="rotate(-15, 88, 140)">
        <!-- Body / Torso -->
        <path d="M 85 145 L 98 175 L 72 175 Z" fill="#457B9D" />
        <rect x="75" y="115" width="26" height="35" rx="6" fill="#E76F51" />
        <!-- Head -->
        <circle cx="88" cy="98" r="12" fill="#F4A261" />
        <!-- Hair -->
        <path d="M 76 96 C 76 89, 100 89, 100 96 Z" fill="#1D3557" />
        <!-- Polite Bowing Hand Gesture (Hands crossed slightly in front) -->
        <circle cx="80" cy="130" r="4" fill="#F4A261" />
        <circle cx="90" cy="132" r="4" fill="#F4A261" />
      </g>
    </g>

    <!-- Subtle Home/Interior Context Element (Warm glowing lamp representing "就像在自己家一样") -->
    <g id="home-lamp" transform="translate(120, 35)">
      <!-- Lamp Cord -->
      <line x1="0" y1="0" x2="0" y2="25" stroke="#4A5568" stroke-width="2" />
      <!-- Lampshade -->
      <path d="M -15 25 L 15 25 L 8 40 L -8 40 Z" fill="#FFB703" />
      <!-- Light Cone Effect -->
      <path d="M -8 40 L 8 40 L 35 90 L -35 90 Z" fill="#FFB703" opacity="0.07" />
    </g>

    <!-- Polite Interaction Sparkles / Warmth Indicators -->
    <g id="sparkles" fill="#FFB703" opacity="0.8">
      <circle cx="120" cy="100" r="2.5" />
      <circle cx="114" cy="108" r="1.5" opacity="0.5" />
      <circle cx="128" cy="106" r="1.5" opacity="0.6" />
    </g>
  </g>
</svg>