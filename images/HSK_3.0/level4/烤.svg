<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#475569"/>
  <path d="M50 210 L60 230 L180 230 L190 210 Z" fill="#334155"/>
  
  <!-- Grill -->
  <ellipse cx="120" cy="175" rx="50" ry="20" fill="#334155"/>
  <ellipse cx="120" cy="170" rx="45" ry="18" fill="#1e293b"/>
  
  <!-- Meat slices -->
  <path d="M105 165 C 110 160, 120 160, 125 165 S 130 175, 125 175 S 110 175, 105 165" fill="#fb923c"/>
  <path d="M120 172 C 125 168, 135 168, 140 172 S 145 180, 140 180 S 125 180, 120 172" fill="#f59e0b"/>
  
  <!-- Steam/Heat -->
  <path d="M110 160 Q 105 140 115 130" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M130 160 Q 135 140 125 130" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Character 1 -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="15" fill="#cbd5e1"/>
    <path d="M10 40 Q 20 60 30 40" stroke="#cbd5e1" stroke-width="4" fill="none"/>
    <rect x="5" y="50" width="30" height="50" rx="5" fill="#38bdf8"/>
    <path d="M5 55 L-10 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Character 2 -->
  <g transform="translate(140, 120)">
    <circle cx="20" cy="20" r="15" fill="#fecdd3"/>
    <path d="M10 40 Q 20 60 30 40" stroke="#fecdd3" stroke-width="4" fill="none"/>
    <rect x="5" y="50" width="30" height="50" rx="5" fill="#ec4899"/>
    <path d="M35 55 L50 80" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Utensils -->
  <path d="M145 150 L155 170" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M95 150 L85 170" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
</svg>