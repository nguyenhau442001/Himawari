<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Printer Shadow -->
  <ellipse cx="120" cy="182" rx="68" ry="8" fill="#111318"/>

  <!-- Printer Paper Output Tray (Back) -->
  <path d="M85 85 L155 85 L165 110 L75 110 Z" fill="#2D333F"/>

  <!-- Paper Sheet being printed (with subtle lines) -->
  <g>
    <path d="M92 45 L148 45 L148 95 L92 95 Z" fill="#F0F3F9"/>
    <line x1="102" y1="58" x2="138" y2="58" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="70" x2="132" y2="70" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="82" x2="124" y2="82" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Main Printer Body (Bottom/Base) -->
  <rect x="52" y="125" width="136" height="55" rx="8" fill="#3E4553"/>
  <rect x="52" y="125" width="136" height="25" rx="8" fill="#4C5565"/>

  <!-- Paper Output Tray (Front) -->
  <path d="M72 180 L168 180 L158 150 L82 150 Z" fill="#2D333F"/>
  <path d="M80 180 L160 180 L155 162 L85 162 Z" fill="#242933"/>

  <!-- Control Panel & Buttons -->
  <circle cx="158" cy="138" r="4" fill="#FF8C42"/>
  <rect x="130" y="136" width="14" height="4" rx="2" fill="#8C96A5"/>
  <rect x="110" y="136" width="14" height="4" rx="2" fill="#8C96A5"/>

  <!-- Paper Feed Slot (Top opening) -->
  <rect x="76" y="118" width="88" height="7" rx="3.5" fill="#242933"/>

  <!-- Accent Details / Highlights -->
  <path d="M52 133 C52 129 55 125 60 125 L180 125 C185 125 188 129 188 133 L188 134 L52 134 Z" fill="#5A6578" opacity="0.4"/>
</svg>