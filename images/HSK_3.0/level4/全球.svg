<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Globe / Global Noun Graphic -->
  <g transform="translate(120, 115)">
    <!-- Outer Glow / Atmosphere Ring -->
    <circle cx="0" cy="0" r="74" fill="none" stroke="#2D3748" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    
    <!-- Main Globe Sphere -->
    <circle cx="0" cy="0" r="64" fill="#2563EB"/>
    <circle cx="0" cy="0" r="64" fill="url(#globeGradient)" opacity="0.4"/>

    <!-- Continents / Landmasses (Stylized Flat Vector) -->
    <g fill="#3B82F6">
      <!-- North/South America stylized shape -->
      <path d="M-30 -35 C-20 -40 -10 -25 -15 -10 C-20 5 -35 15 -30 30 C-25 45 -10 50 -5 40 C0 30 -5 20 0 10 C5 0 20 -10 15 -25 C10 -40 -20 -30 -30 -35 Z"/>
      <!-- Eurasia / Africa stylized shape -->
      <path d="M20 -45 C35 -50 50 -35 45 -20 C40 -5 55 10 45 25 C35 40 15 35 25 15 C35 -5 10 -25 20 -45 Z"/>
      <!-- Australia / Islands -->
      <circle cx="40" cy="35" r="6"/>
    </g>

    <!-- Latitude / Longitude Grid Lines -->
    <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="24" ry="64" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.4"/>
    <line x1="-64" y1="0" x2="64" y2="0" stroke="#60A5FA" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-64" x2="0" y2="64" stroke="#60A5FA" stroke-width="1.5" opacity="0.4"/>

    <!-- Focus Pins / Connection Nodes (Representing worldwide attention/network) -->
    <circle cx="-15" cy="-20" r="4" fill="#F59E0B"/>
    <circle cx="-15" cy="-20" r="8" fill="#F59E0B" opacity="0.3"/>
    
    <circle cx="30" cy="-10" r="4" fill="#F59E0B"/>
    <circle cx="30" cy="-10" r="8" fill="#F59E0B" opacity="0.3"/>

    <circle cx="15" cy="25" r="4" fill="#F59E0B"/>
    <circle cx="15" cy="25" r="8" fill="#F59E0B" opacity="0.3"/>

    <!-- Connecting Network Arcs -->
    <path d="M-15 -20 Q 10 -30 30 -10" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
    <path d="M30 -10 Q 25 10 15 25" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
    <path d="M15 25 Q 0 10 -15 -20" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  </g>

  <!-- Definitions -->
  <defs>
    <radialGradient id="globeGradient" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
</svg>