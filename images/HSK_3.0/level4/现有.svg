<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Open Physical Folder / Binder representing available existing physical materials (资料) -->
  <g transform="translate(48, 55)">
    <!-- Back cover of the folder -->
    <path d="M12 20 C12 14.5 16.5 10 22 10 L62 10 C67.5 10 72 14.5 72 20 L132 20 C137.5 20 142 24.5 142 30 L142 110 C142 115.5 137.5 120 132 120 L22 120 C16.5 120 12 115.5 12 110 Z" fill="#2D3748"/>
    
    <!-- Folder spine/interior shadow -->
    <path d="M12 30 L142 30 L142 40 L12 40 Z" fill="#1A202C"/>

    <!-- Document pages inside the folder (representing tangible physical inventory/materials) -->
    <!-- Page 3 (Back) -->
    <rect x="24" y="32" width="96" height="76" rx="2" fill="#E2E8F0"/>
    
    <!-- Page 2 (Middle) -->
    <rect x="28" y="26" width="96" height="76" rx="2" fill="#EDF2F7"/>
    <line x1="38" y1="42" x2="80" y2="42" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="54" x2="104" y2="54" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="66" x2="90" y2="66" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>

    <!-- Page 1 (Front - crisp, clear details representing "现在" - currently available) -->
    <rect x="32" y="20" width="96" height="76" rx="2" fill="#FFFFFF"/>
    <!-- Document header line -->
    <line x1="44" y1="36" x2="84" y2="36" stroke="#4A5568" stroke-width="5" stroke-linecap="round"/>
    <!-- Text lines -->
    <line x1="44" y1="52" x2="108" y2="52" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="64" x2="96" y2="64" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="76" x2="102" y2="76" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>

    <!-- Front cover of the folder -->
    <path d="M16 45 C16 39.5 20.5 35 26 35 L118 35 C123.5 35 128 39.5 128 45 L128 125 C128 130.5 123.5 135 118 135 L26 135 C20.5 135 16 130.5 16 125 Z" fill="#3182CE"/>
    <path d="M16 45 L128 45 L128 55 L16 55 Z" fill="#2B6CB0"/>

    <!-- High-contrast focus accent badge (Gold/Orange) indicating "现有" - currently on hand / ready inventory -->
    <circle cx="108" cy="115" r="18" fill="#DD6B20"/>
    <!-- Checkmark icon inside accent badge showing availability/possession -->
    <path d="M99 115 L105 121 L119 107" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>