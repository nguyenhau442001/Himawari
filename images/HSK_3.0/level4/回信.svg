<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glow representing anticipation / arrival -->
  <circle cx="120" cy="115" r="70" fill="#2D333F" opacity="0.4"/>

  <!-- Main Envelope Body (Back and base) -->
  <g transform="translate(48, 70)">
    <!-- Envelope Shadow/Base -->
    <rect x="0" y="20" width="144" height="96" rx="8" fill="#3B4252" />
    
    <!-- Inner Envelope Pocket (Darker shade) -->
    <path d="M 0 28 L 72 76 L 144 28 L 144 108 C 144 112.418 140.418 116 136 116 L 8 116 C 3.582 116 0 112.418 0 108 Z" fill="#2E3440" />

    <!-- Letter sliding out (representing the reply/response) -->
    <g transform="translate(16, -16)">
      <rect x="0" y="0" width="112" height="72" rx="4" fill="#ECEFF4"/>
      <!-- Text lines on the letter -->
      <rect x="16" y="18" width="80" height="6" rx="3" fill="#D8DEE9"/>
      <rect x="16" y="32" width="60" height="6" rx="3" fill="#D8DEE9"/>
      <rect x="16" y="46" width="72" height="6" rx="3" fill="#D8DEE9"/>
    </g>

    <!-- Envelope Flap (Open, pointing upwards) -->
    <path d="M 0 28 L 72 80 L 144 28 L 72 2 Z" fill="#4C566A" />

    <!-- Accent Return Arrow indicating "reply" / "huíxìn" -->
    <circle cx="120" cy="92" r="22" fill="#EBCB8B" />
    <path d="M 112 92 L 122 84 L 122 90 L 132 90 L 132 94 L 122 94 L 122 100 Z" fill="#2E3440" transform="translate(0, 0)" />
    <!-- Curved return arrow vector -->
    <path d="M 128 83 C 128 78 124 75 119 75 C 113 75 109 79 109 84 M 109 84 L 105 80 M 109 84 L 114 80" stroke="#2E3440" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>