<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient Glow for Focus -->
  <circle cx="120" cy="130" r="70" fill="#FF9F43" opacity="0.08" filter="blur(15px)"/>

  <!-- Lunch Box Container / Base Shadow -->
  <ellipse cx="120" cy="182" rx="72" ry="10" fill="#111318"/>

  <!-- Bento Lunch Box (Bottom Tier) -->
  <path d="M 54 135 L 62 172 C 63 178, 68 182, 74 182 L 166 182 C 172 182, 177 178, 178 172 L 186 135 Z" fill="#2C3240"/>
  <!-- Lunch Box Rim Bottom -->
  <path d="M 52 135 C 52 130, 58 126, 120 126 C 182 126, 188 130, 188 135 C 188 140, 182 144, 120 144 C 58 144, 52 140, 52 135 Z" fill="#3A4254"/>

  <!-- Bento Lunch Box (Top Tier / Lid) -->
  <path d="M 50 92 L 56 127 C 57 132, 62 136, 68 136 L 172 136 C 178 136, 183 132, 184 127 L 190 92 Z" fill="#252A36"/>
  <!-- Lunch Box Lid Top (Accent Color: Warm Orange) -->
  <ellipse cx="120" cy="92" rx="70" ry="14" fill="#FF9F43"/>
  <ellipse cx="120" cy="90" rx="64" ry="11" fill="#FFAE5C"/>

  <!-- Chopsticks Resting on Top -->
  <g transform="rotate(-15 120 72)">
    <!-- Chopstick 1 -->
    <rect x="70" y="68" width="100" height="3.5" rx="1.75" fill="#E2E8F0"/>
    <rect x="70" y="68" width="15" height="3.5" fill="#E53E3E"/>
    <!-- Chopstick 2 -->
    <rect x="70" y="74.5" width="100" height="3.5" rx="1.75" fill="#CBD5E1"/>
    <rect x="70" y="74.5" width="15" height="3.5" fill="#C53030"/>
  </g>

  <!-- Delicious Meal Contents (Visible inside/above open box or artistically arranged) -->
  <!-- Rice compartment representation / Onigiri / Food elements -->
  <circle cx="95" cy="115" r="18" fill="#F8FAFC" opacity="0.9"/>
  <!-- Nori on rice -->
  <rect x="90" y="107" width="10" height="16" rx="2" fill="#1E293B"/>

  <!-- Salmon / Main Dish -->
  <path d="M 125 103 C 130 98, 148 100, 155 107 C 162 114, 158 126, 148 127 C 138 128, 122 112, 125 103 Z" fill="#F97316"/>
  <path d="M 132 107 C 135 105, 145 106, 148 111" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Broccoli / Veggie side -->
  <circle cx="152" cy="120" r="8" fill="#10B981"/>
  <circle cx="145" cy="122" r="6" fill="#059669"/>
  <circle cx="156" cy="125" r="5" fill="#047857"/>

  <!-- Steam / Aroma lines -->
  <path d="M 105 60 C 103 52, 109 46, 105 38" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 135 58 C 133 50, 139 44, 135 36" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

</svg>