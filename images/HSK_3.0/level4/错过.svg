<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Station atmosphere) -->
  <line x1="30" y1="175" x2="210" y2="175" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>
  <!-- Train tracks perspective -->
  <line x1="160" y1="110" x2="220" y2="175" stroke="#2A2F3D" stroke-width="2"/>
  <line x1="140" y1="110" x2="80" y2="175" stroke="#2A2F3D" stroke-width="2"/>
  <line x1="145" y1="130" x2="190" y2="130" stroke="#2A2F3D" stroke-width="2"/>
  <line x1="140" y1="150" x2="205" y2="150" stroke="#2A2F3D" stroke-width="2"/>

  <!-- Departing Train (Moving away into the distance, right side) -->
  <g transform="translate(130, 75)">
    <rect x="0" y="10" width="50" height="35" rx="6" fill="#3A4256"/>
    <rect x="8" y="16" width="12" height="10" rx="2" fill="#5A6580"/>
    <rect x="28" y="16" width="12" height="10" rx="2" fill="#5A6580"/>
    <circle cx="12" cy="50" r="6" fill="#222630"/>
    <circle cx="38" cy="50" r="6" fill="#222630"/>
    <!-- Red tail lights & motion lines -->
    <circle cx="45" cy="22" r="3" fill="#FF5C5C"/>
    <path d="M52 25 L65 22 M52 32 L68 28" stroke="#FF5C5C" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Motion speed lines behind train -->
    <line x1="-15" y1="20" x2="-5" y2="20" stroke="#5A6580" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="30" x2="-8" y2="30" stroke="#5A6580" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Left behind human character (Regretful action of "cuòguò" - missing out) -->
  <g transform="translate(50, 95)">
    <!-- Body / Torso -->
    <path d="M25 40 L35 75 L15 75 Z" fill="#3D5AFE"/>
    
    <!-- Head -->
    <circle cx="25" cy="24" r="10" fill="#FFCC80"/>
    
    <!-- Hair -->
    <path d="M15 22 C15 14, 35 14, 35 22 C35 25, 33 22, 25 18 C17 22, 15 25, 15 22 Z" fill="#4E342E"/>

    <!-- Reaching/Missed arm (stretched forward, palm open in vain) -->
    <path d="M30 45 C45 45, 55 42, 62 40" stroke="#FFCC80" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Other arm dropped to the side in disappointment -->
    <path d="M20 45 L14 62" stroke="#FFCC80" stroke-width="5" stroke-linecap="round"/>

    <!-- Legs -->
    <path d="M22 75 L20 105" stroke="#283593" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 75 L33 105" stroke="#283593" stroke-width="6" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="18" cy="107" rx="6" ry="3" fill="#1A1D24"/>
    <ellipse cx="36" cy="107" rx="6" ry="3" fill="#1A1D24"/>

    <!-- Dropped luggage / bag near feet -->
    <rect x="-2" y="90" width="14" height="15" rx="3" fill="#FF8F00"/>
    <path d="M3 90 C3 86, 9 86, 9 90" stroke="#FF8F00" stroke-width="2" fill="none"/>

    <!-- Sweat drop / frustration indicator near head -->
    <path d="M38 16 C38 16, 43 22, 40 25 C38 27, 36 25, 38 16 Z" fill="#00E5FF" opacity="0.8"/>
  </g>

  <!-- Dynamic gap indicator / Visual separation showing the "missed" timing -->
  <path d="M95 120 Q112 105 125 120" stroke="#FFB300" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Focal Accent Marker (Modern UI touch) -->
  <circle cx="112" cy="112" r="4" fill="#FFB300"/>
</svg>