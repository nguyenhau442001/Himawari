<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Acoustic Guitar Body -->
    <path d="M 120 45 
             C 95 45, 80 65, 80 95
             C 80 115, 92 135, 98 150
             C 102 160, 95 185, 90 205
             C 150 205, 145 185, 142 150
             C 148 135, 160 115, 160 95
             C 160 65, 145 45, 120 45 Z" 
          fill="#D47A36" stroke="#E59866" stroke-width="2"/>
             
    <!-- Guitar Neck -->
    <rect x="110" y="-15" width="20" height="70" rx="3" fill="#8C5335" stroke="#A76D4D" stroke-width="2"/>
    
    <!-- Sound Hole -->
    <circle cx="120" cy="115" r="18" fill="#111317" stroke="#A76D4D" stroke-width="2"/>
    <circle cx="120" cy="115" r="14" fill="#1A1D24"/>

    <!-- Bridge -->
    <rect x="108" y="165" width="24" height="6" rx="2" fill="#593622"/>
    <circle cx="114" cy="168" r="1.5" fill="#111317"/>
    <circle cx="120" cy="168" r="1.5" fill="#111317"/>
    <circle cx="126" cy="168" r="1.5" fill="#111317"/>

    <!-- Strings -->
    <line x1="114" y1="-15" x2="114" y2="165" stroke="#E6EDF3" stroke-width="0.75" opacity="0.6"/>
    <line x1="117" y1="-15" x2="117" y2="165" stroke="#E6EDF3" stroke-width="0.75" opacity="0.6"/>
    <line x1="120" y1="-15" x2="120" y2="165" stroke="#E6EDF3" stroke-width="1.25" opacity="0.8"/>
    <line x1="123" y1="-15" x2="123" y2="165" stroke="#E6EDF3" stroke-width="0.75" opacity="0.6"/>
    <line x1="126" y1="-15" x2="126" y2="165" stroke="#E6EDF3" stroke-width="0.75" opacity="0.6"/>

    <!-- Plucking Hand / Finger Action (Focus Accent) -->
    <path d="M 120 125 
             C 135 120, 155 125, 162 135
             C 167 142, 160 148, 152 143
             C 140 135, 128 135, 120 133 Z" 
          fill="#F29E38"/>
          
    <!-- Dynamic sound / plucking waves -->
    <path d="M 140 105 C 148 110, 148 120, 140 125" stroke="#F29E38" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 146 100 C 158 108, 158 122, 146 130" stroke="#F29E38" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>