<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Room Background Structure (Isometric-flat perspective) -->
    <!-- Back Wall -->
    <path d="M20 50 L140 20 L200 65 L200 170 L20 170 Z" fill="#222733"/>
    <!-- Floor -->
    <path d="M20 170 L200 170 L200 190 L20 190 Z" fill="#15181F"/>
    
    <!-- Bookshelf (The physical object "用来" - tool/purpose container) -->
    <!-- Shelf Outer Frame -->
    <path d="M50 70 L130 50 L130 170 L50 170 Z" fill="#2E3648"/>
    <path d="M130 50 L175 80 L175 200 L130 170 Z" fill="#252C3B"/>
    
    <!-- Shelf Inner Depths -->
    <path d="M58 80 L122 64 L122 164 L58 164 Z" fill="#1D232F"/>
    
    <!-- Shelf Dividers / Levels -->
    <path d="M58 110 L122 94 L122 98 L58 114 Z" fill="#3B465C"/>
    <path d="M58 140 L122 124 L122 128 L58 144 Z" fill="#3B465C"/>

    <!-- Books inside (Representing "放书" - used for placing books) -->
    <!-- Shelf 1 (Top) - Colorful books -->
    <path d="M66 88 L74 86 L74 105 L66 107 Z" fill="#F59E0B"/> <!-- Gold/Orange accent -->
    <path d="M78 85 L86 83 L86 102 L78 104 Z" fill="#38BDF8"/>
    <path d="M89 82 L99 80 L99 99 L89 101 Z" fill="#EC4899"/>
    <path d="M103 79 L109 77 L109 96 L103 98 Z" fill="#10B981"/>

    <!-- Shelf 2 (Middle) -->
    <path d="M65 118 L76 115 L76 135 L65 138 Z" fill="#EF4444"/>
    <path d="M80 114 L85 113 L85 133 L80 134 Z" fill="#F59E0B"/>
    <path d="M89 112 L99 109 L99 129 L89 132 Z" fill="#6366F1"/>
    
    <!-- Shelf 3 (Bottom) - Leaning books -->
    <path d="M64 147 L73 145 L73 162 L64 164 Z" fill="#10B981"/>
    <path d="M76 143 L84 141 L84 158 L76 160 Z" fill="#F59E0B"/>
    <path d="M89 146 L102 143 L105 155 L92 158 Z" fill="#94A3B8"/> <!-- Leaning book -->

    <!-- Focus / Function Indicator (Action flow representing "purpose/use") -->
    <g transform="translate(145, 110)">
      <!-- Curved arrow wrapping into the shelf, signifying "used for holding/placing" -->
      <path d="M -20 -10 C -10 -25, 20 -25, 30 5" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
      <path d="M 24 12 L 32 8 L 30 -1" fill="#F59E0B"/>
      <!-- Small floating book entering -->
      <g transform="translate(-25, -15) rotate(-15)">
        <rect x="0" y="0" width="14" height="18" rx="2" fill="#F59E0B"/>
        <line x1="7" y1="2" x2="7" y2="16" stroke="#1A1D24" stroke-width="1.5"/>
      </g>
    </g>
  </g>
</svg>