<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Desk / Counter Surface -->
    <path d="M 40 185 L 200 185 L 210 200 L 30 200 Z" fill="#2A303C"/>
    <rect x="35" y="180" width="170" height="7" rx="3.5" fill="#3A4454"/>
    
    <!-- Character (Person in Charge / Professional Leader) -->
    <!-- Torso & Suit -->
    <path d="M 95 185 L 95 145 C 95 130 145 130 145 145 L 145 185 Z" fill="#243B55"/>
    <!-- Shirt -->
    <polygon points="120,145 110,165 130,165" fill="#FFFFFF"/>
    <!-- Tie -->
