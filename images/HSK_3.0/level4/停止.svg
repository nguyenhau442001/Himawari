<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Rain effect -->
  <g stroke="#5D6D7E" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="20" x2="30" y2="60"/>
    <line x1="80" y1="10" x2="70" y2="50"/>
    <line x1="120" y1="30" x2="110" y2="70"/>
    <line x1="160" y1="15" x2="150" y2="55"/>
    <line x1="200" y1="25" x2="190" y2="65"/>
  </g>

  <!-- Ground -->
  <path d="M20 200 L220 200" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>

  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 80 L-20 20 L20 20 L20 80" fill="#3498DB"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#F39C12"/>
    <!-- Arm extended upward to stop rain -->
    <path d="M20 30 L50 -20" stroke="#F39C12" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand palm flat -->
    <rect x="40" y="-35" width="20" height="10" rx="2" fill="#F39C12"/>
    
    <!-- Motion lines indicating the stop -->
    <path d="M60 -20 L80 -20" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 -30 L75 -30" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Puddle -->
  <ellipse cx="60" cy="200" rx="30" ry="5" fill="#2C3E50"/>
</svg>