<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Flower (Peony) -->
  <g transform="translate(160, 140)">
    <circle cx="0" cy="0" r="25" fill="#FF6B6B"/>
    <circle cx="-15" cy="-10" r="20" fill="#FF8787"/>
    <circle cx="15" cy="-10" r="20" fill="#FF8787"/>
    <circle cx="0" cy="15" r="20" fill="#FF8787"/>
    <path d="M0 20 L0 60" stroke="#51CF66" stroke-width="6" stroke-linecap="round"/>
    <path d="M-10 40 L-25 30" stroke="#51CF66" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character -->
  <g transform="translate(80, 140)">
    <!-- Body -->
    <path d="M-20 80 L20 80 L15 30 L-15 30 Z" fill="#4DABF7"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="20" fill="#FFD8A8"/>
    <!-- Arm pointing -->
    <path d="M15 40 L45 60" stroke="#FFD8A8" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="50" cy="62" r="6" fill="#FFD8A8"/>
  </g>

  <!-- Motion/Focus Lines -->
  <path d="M60 50 Q 100 20 140 80" fill="none" stroke="#FAB005" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
  <path d="M145 75 L135 85 L145 90 Z" fill="#FAB005"/>
</svg>