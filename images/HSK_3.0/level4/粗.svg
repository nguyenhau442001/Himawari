<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M30 200 H210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Thin Tree (Contrast Element) -->
  <path d="M60 200 L62 80" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <circle cx="62" cy="75" r="12" fill="#2D3748"/>
  <circle cx="54" cy="82" r="8" fill="#2D3748"/>
  <circle cx="70" cy="80" r="9" fill="#2D3748"/>

  <!-- Thick Tree (The Focus: 粗) -->
  <!-- Trunk -->
  <path d="M110 200 C115 180 115 100 120 60 H190 C195 100 195 180 200 200 Z" fill="#FF9F1C"/>
  
  <!-- Bark Texture for Girth Emphasis -->
  <path d="M135 80 V180" stroke="#B45309" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M155 70 V190" stroke="#B45309" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M175 85 V175" stroke="#B45309" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Massive Canopy for the Thick Tree -->
  <circle cx="155" cy="45" r="25" fill="#FFD700" opacity="0.9"/>
  <circle cx="130" cy="60" r="20" fill="#FFD700" opacity="0.9"/>
  <circle cx="180" cy="60" r="22" fill="#FFD700" opacity="0.9"/>
  <circle cx="155" cy="75" r="18" fill="#FFD700" opacity="0.9"/>

  <!-- Scale Indicator (Comparison) -->
  <path d="M110 210 H200" stroke="#FFD700" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M110 206 V214" stroke="#FFD700" stroke-width="2"/>
  <path d="M200 206 V214" stroke="#FFD700" stroke-width="2"/>
</svg>