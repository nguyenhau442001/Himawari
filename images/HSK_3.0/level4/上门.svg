<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- House Structure -->
  <path d="M120 60 L180 100 L180 180 L60 180 L60 100 Z" fill="#2D343E" stroke="#4A5568" stroke-width="4" stroke-linejoin="round"/>
  <rect x="95" y="130" width="50" height="50" fill="#3A4452" stroke="#4A5568" stroke-width="4"/>
  <rect x="110" y="145" width="20" height="35" fill="#2D343E" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Motion Lines -->
  <path d="M40 120 C 50 110, 60 110, 70 120" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M30 135 C 45 120, 60 120, 75 135" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Delivery Person -->
  <g transform="translate(40, 110)">
    <circle cx="20" cy="20" r="12" fill="#FFD180"/>
    <path d="M10 40 L20 80 L30 40" fill="#FFB84D"/>
    <path d="M5 45 L35 45" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
    <!-- Carrying a package -->
    <rect x="25" y="30" width="20" height="20" fill="#FFB84D" rx="2"/>
    <path d="M25 35 L45 35" stroke="#1A1D24" stroke-width="2"/>
  </g>
  
  <!-- Doorbell/Interaction Point -->
  <circle cx="145" cy="160" r="6" fill="#FFB84D"/>
</svg>