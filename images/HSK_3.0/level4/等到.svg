<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements: Sun setting/Moon rising -->
  <circle cx="180" cy="60" r="25" fill="#F59E0B" opacity="0.8"/>
  <path d="M60 180 C 80 140, 160 140, 180 180" fill="#374151"/>
  
  <!-- Character -->
  <g transform="translate(100, 120)">
    <!-- Body -->
    <path d="M-10 80 L-10 40 L10 40 L10 80 Z" fill="#60A5FA"/>
    <!-- Head -->
    <circle cx="0" cy="25" r="15" fill="#FDE68A"/>
    <!-- Arm reaching out to check time/watch -->
    <path d="M10 50 L30 65" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="32" cy="67" r="5" fill="#9CA3AF"/>
  </g>
  
  <!-- Motion lines indicating waiting/passage of time -->
  <path d="M140 100 Q 160 90 180 100" stroke="#4B5563" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M140 110 Q 160 100 180 110" stroke="#4B5563" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Foreground: Door/Threshold -->
  <rect x="20" y="140" width="40" height="80" fill="#374151" rx="4"/>
  <circle cx="50" cy="180" r="3" fill="#1A1D24"/>
  
  <!-- Ground -->
  <rect x="0" y="220" width="240" height="20" fill="#111827"/>
</svg>