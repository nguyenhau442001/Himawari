<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background ambient glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Iconic Physical Object representing "提到" (The Book from the contextual sentence: 你刚才提到的那本书在哪儿买的？) -->
  <!-- Floating/Highlighted Book casting a gentle upward focus -->
  <g transform="translate(0, -2)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="172" rx="42" ry="8" fill="#111318"/>

    <!-- Open Book Base/Pages -->
    <path d="M 68 115 C 68 110, 90 100, 120 108 C 150 100, 172 110, 172 115 L 172 158 C 172 158, 150 148, 120 156 C 90 148, 68 158, 68 158 Z" fill="#E2E8F0"/>
    
    <!-- Left Page Inner curve shadow -->
    <path d="M 68 115 C 68 110, 90 100, 120 108 L 120 156 C 90 148, 68 158, 68 158 Z" fill="#CBD5E1"/>

    <!-- Book Cover (Hardback spine and outer edges visible) -->
    <!-- Left Cover -->
    <path d="M 64 112 C 64 107, 86 97, 118 105 L 118 153 C 86 145, 64 155, 64 155 Z" fill="#3B82F6"/>
    <!-- Right Cover -->
    <path d="M 122 105 C 154 97, 176 107, 176 112 L 176 155 C 176 155, 154 145, 122 153 Z" fill="#2563EB"/>

    <!-- Spine -->
    <path d="M 118 105 L 122 105 L 122 153 L 118 153 Z" fill="#1D4ED8"/>

    <!-- Abstract Content Lines on Pages (representing text/subject being mentioned) -->
    <g fill="#94A3B8" opacity="0.8">
      <!-- Left page lines -->
      <rect x="78" y="118" rx="2" width="30" height="4"/>
      <rect x="78" y="127" rx="2" width="24" height="4"/>
      <rect x="78" y="136" rx="2" width="28" height="4"/>

      <!-- Right page lines -->
      <rect x="132" y="118" rx="2" width="28" height="4"/>
      <rect x="132" y="127" rx="2" width="32" height="4"/>
      <rect x="132" y="136" rx="2" width="20" height="4"/>
    </g>

    <!-- Bookmark ribbon hanging out -->
    <path d="M 116 106 L 116 138 L 120 145 L 124 138 L 124 106 Z" fill="#F59E0B"/>
  </g>

  <!-- Semantic Focus Element: "Mentioned / Brought to attention" glowing indicator / speech-bubble framing -->
  <g transform="translate(0, -10)">
    <!-- Floating speech bubble / focus aura wrapping the book to signify "being spoken of / mentioned" -->
    <path d="M 95 62 
             h 50 
             a 16 16 0 0 1 16 16 
             v 16 
             a 16 16 0 0 1 -16 16 
             h -22 
             l -10 10 
             l -3 -10 
             h -15 
             a 16 16 0 0 1 -16 -16 
             v -16 
             a 16 16 0 0 1 16 -16 z" 
          fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Focus sparkle dots -->
    <circle cx="72" cy="74" r="2.5" fill="#F59E0B"/>
    <circle cx="168" cy="88" r="2" fill="#F59E0B"/>
    <circle cx="158" cy="62" r="3" fill="#F59E0B" opacity="0.7"/>
  </g>

</svg>