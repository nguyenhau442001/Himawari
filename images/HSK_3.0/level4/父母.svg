<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="130" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Father Character (Left) -->
  <g transform="translate(65, 115)">
    <!-- Body / Shoulders -->
    <path d="M-30 65 C-30 45, -15 35, 0 35 C15 35, 30 45, 30 65 Z" fill="#3B82F6"/>
    <!-- Collar / Shirt -->
    <path d="M-10 35 L0 45 L10 35 L5 35 L0 40 L-5 35 Z" fill="#60A5FA"/>
    <!-- Neck -->
    <rect x="-6" y="24" width="12" height="15" fill="#E2B291"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="18" fill="#E2B291"/>
    <!-- Hair -->
    <path d="M-18 10 C-18 -2, -10 -8, 0 -8 C10 -8, 18 -2, 18 10 C15 4, 8 2, 0 2 C-8 2, -15 4, -18 10 Z" fill="#2C2C2C"/>
    <!-- Glasses -->
    <circle cx="-6" cy="9" r="5" fill="none" stroke="#2C2C2C" stroke-width="1.5"/>
    <circle cx="6" cy="9" r="5" fill="none" stroke="#2C2C2C" stroke-width="1.5"/>
    <line x1="-1" y1="9" x2="1" y2="9" stroke="#2C2C2C" stroke-width="1.5"/>
    <!-- Smile -->
    <path d="M-4 17 C-2 19, 2 19, 4 17" fill="none" stroke="#2C2C2C" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Mother Character (Right) -->
  <g transform="translate(175, 115)">
    <!-- Body / Shoulders -->
    <path d="M-30 65 C-30 45, -15 35, 0 35 C15 35, 30 45, 30 65 Z" fill="#F43F5E"/>
    <!-- Collar -->
    <path d="M-12 35 C-12 42, 12 42, 12 35 Z" fill="#FDA4AF"/>
    <!-- Neck -->
    <rect x="-6" y="24" width="12" height="15" fill="#E2B291"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="17" fill="#E2B291"/>
    <!-- Hair (Bob style) -->
    <path d="M-18 8 C-18 -4, -10 -10, 0 -10 C10 -10, 18 -4, 18 8 C19 18, 15 25, 12 25 C10 25, 8 18, 6 15 C3 12, -3 12, -6 15 C-8 18, -10 25, -12 25 C-15 25, -19 18, -18 8 Z" fill="#3D2314"/>
    <!-- Gentle Smile -->
    <path d="M-4 17 C-2 19, 2 19, 4 17" fill="none" stroke="#3D2314" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-6" cy="9" r="1.5" fill="#3D2314"/>
    <circle cx="6" cy="9" r="1.5" fill="#3D2314"/>
  </g>

  <!-- Child Character (Center, slightly lower) -->
  <g transform="translate(120, 145)">
    <!-- Body -->
    <path d="M-22 50 C-22 35, -12 28, 0 28 C12 28, 22 35, 22 50 Z" fill="#10B981"/>
    <!-- Neck -->
    <rect x="-4" y="18" width="8" height="12" fill="#E2B291"/>
    <!-- Head -->
    <circle cx="0" cy="8" r="14" fill="#E2B291"/>
    <!-- Hair -->
    <path d="M-14 6 C-14 -3, -8 -8, 0 -8 C8 -8, 14 -3, 14 6 C12 2, 7 0, 0 0 C-7 0, -12 2, -14 6 Z" fill="#D97706"/>
    <!-- Happy Smile -->
    <path d="M-3 13 C-1 16, 1 16, 3 13" fill="none" stroke="#2C2C2C" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-5" cy="7" r="1.2" fill="#2C2C2C"/>
    <circle cx="5" cy="7" r="1.2" fill="#2C2C2C"/>
  </g>

  <!-- Connecting / Supporting Arms & Hands -->
  <!-- Father's arm holding child -->
  <path d="M45 140 C55 140, 85 140, 98 150" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
  <!-- Mother's arm holding child -->
  <path d="M195 140 C185 140, 155 140, 142 150" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round"/>

  <!-- Accent top lighting / framing -->
  <path d="M80 55 L120 40 L160 55" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="120" cy="40" r="4" fill="#F59E0B"/>
</svg>