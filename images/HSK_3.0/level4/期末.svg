<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "期末" (End of term/Final exam context) -->
  <!-- Central Physical Object: A sleek academic graduation cap (mortarboard) resting neatly on top of an hourglass / calendar milestone, representing the definitive end point of a school term. -->
  
  <g transform="translate(0, 5)">
    <!-- Hourglass / Time indicator base symbolizing "期" (Period/Term) -->
    <!-- Lower bulb -->
    <path d="M 95 165 L 145 165 C 145 185, 95 185, 95 165 Z" fill="#2E3440"/>
    <path d="M 90 165 L 150 165 L 155 170 L 85 170 Z" fill="#4C566A" rx="2"/>
    <path d="M 100 135 C 100 150, 140 150, 140 135 C 140 120, 100 120, 100 135 Z" fill="#2E3440" opacity="0.3"/>
    
    <!-- Sand accumulating at the bottom (representing the final moments) -->
    <path d="M 103 155 C 115 162, 125 162, 137 155 C 143 162, 97 162, 103 155 Z" fill="#EBCB8B"/>

    <!-- Upper hourglass glass outline -->
    <path d="M 92 85 L 148 85 C 148 85, 129 110, 120 110 C 111 110, 92 85, 92 85 Z" fill="none" stroke="#4C566A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 92 135 L 148 135 C 148 135, 129 110, 120 110 C 111 110, 92 135, 92 135 Z" fill="none" stroke="#4C566A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sand flowing / almost empty top -->
    <path d="M 99 92 L 141 92 C 137 102, 103 102, 99 92 Z" fill="#EBCB8B" opacity="0.8"/>
    <line x1="120" y1="110" x2="120" y2="140" stroke="#EBCB8B" stroke-width="2" stroke-dasharray="2,3"/>

    <!-- Hourglass frame top/bottom caps -->
    <rect x="88" y="80" width="64" height="6" rx="3" fill="#D8DEE9"/>
    <rect x="88" y="165" width="64" height="6" rx="3" fill="#D8DEE9"/>

    <!-- Academic Mortarboard (representing "末" - end/final achievement) positioned prominently above -->
    <!-- Cap Skull Cap -->
    <path d="M 120 40 C 95 40, 88 55, 88 55 L 152 55 C 152 55, 145 40, 120 40 Z" fill="#3B4252"/>
    <ellipse cx="120" cy="55" rx="32" ry="8" fill="#434C5E"/>

    <!-- Mortarboard Square Top (Flat diamond perspective) -->
    <polygon points="120,25 180,45 120,65 60,45" fill="#5E81AC"/>
    <polygon points="120,27 175,45 120,63 65,45" fill="#88C0D0"/>

    <!-- Center Button -->
    <circle cx="120" cy="45" r="4" fill="#EBCB8B"/>

    <!-- Tassel hanging to the right -->
    <path d="M 122 45 C 145 45, 160 55, 158 75" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round"/>
    <!-- Tassel fringe -->
    <line x1="158" y1="73" x2="158" y2="85" stroke="#EBCB8B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Clean decorative accent dots representing completion/milestone -->
  <circle cx="65" cy="115" r="3" fill="#D08770" opacity="0.8"/>
  <circle cx="175" cy="115" r="3" fill="#A3BE8C" opacity="0.8"/>
  <circle cx="80" cy="195" r="2" fill="#EBCB8B" opacity="0.5"/>
  <circle cx="160" cy="195" r="2" fill="#5E81AC" opacity="0.5"/>
</svg>