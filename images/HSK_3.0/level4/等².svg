<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements for depth -->
  <path d="M40 180h160v10H40z" fill="#2D343E"/>
  
  <!-- Character: The person waiting -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#FFC107"/> <!-- Head -->
    <path d="M5 40h30l-5 60h-20z" fill="#FFC107"/> <!-- Body -->
    <path d="M10 50l-15 20" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/> <!-- Arm 1 -->
    <path d="M30 50l15 20" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/> <!-- Arm 2 -->
    <path d="M10 100l-5 30" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/> <!-- Leg 1 -->
    <path d="M30 100l5 30" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/> <!-- Leg 2 -->
  </g>
  
  <!-- Motion lines indicating patience/waiting -->
  <path d="M110 90 Q 120 80 130 90" fill="none" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M110 100 Q 120 90 130 100" fill="none" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- The object being waited for (a bus/transport silhouette) -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#00BCD4"/>
    <rect x="10" y="10" width="15" height="15" fill="#1A1D24"/>
    <rect x="35" y="10" width="15" height="15" fill="#1A1D24"/>
    <circle cx="15" cy="45" r="8" fill="#4A5568"/>
    <circle cx="45" cy="45" r="8" fill="#4A5568"/>
  </g>
  
  <!-- Gesture: Hand raised in a polite 'hold on' or 'wait' gesture -->
  <g transform="translate(160, 60)">
    <path d="M0 0 L10 0 L10 20 L0 20 Z" fill="#FFC107"/>
    <path d="M10 5 L20 5 L20 15 L10 15 Z" fill="#FFC107"/>
  </g>
</svg>