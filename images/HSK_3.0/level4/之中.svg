<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Group of students (representing "all students") -->
  <g transform="translate(40, 120)">
    <circle cx="20" cy="40" r="12" fill="#4A5568"/>
    <circle cx="60" cy="40" r="12" fill="#4A5568"/>
    <circle cx="100" cy="40" r="12" fill="#4A5568"/>
    <circle cx="140" cy="40" r="12" fill="#4A5568"/>
    <circle cx="180" cy="40" r="12" fill="#4A5568"/>
  </g>
  
  <!-- The highlighted individual (the one "in the middle" of the group) -->
  <g transform="translate(100, 80)">
    <circle cx="20" cy="40" r="16" fill="#F6AD55"/>
    <path d="M12 55 Q20 65 28 55" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <circle cx="14" cy="35" r="2" fill="#1A1D24"/>
    <circle cx="26" cy="35" r="2" fill="#1A1D24"/>
  </g>
  
  <!-- Focus indicator lines to show "amongst" -->
  <path d="M120 130 L120 110" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 115 L120 110 L125 115" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>