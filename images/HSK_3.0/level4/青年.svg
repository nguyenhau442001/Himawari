<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Background subtle glow representing energy/idealism -->
    <circle cx="120" cy="115" r="65" fill="#242B38" />
    <circle cx="120" cy="115" r="45" fill="#2B3544" />
    
    <!-- Dynamic ascending path / "idealism" vector ray -->
    <path d="M120 180 L145 60 L120 40 L95 60 Z" fill="#F59E0B" opacity="0.15"/>
    <path d="M120 170 L138 75 L120 58 L102 75 Z" fill="#F59E0B" opacity="0.25"/>

    <!-- Character: Modern Youth (青年) with confident posture -->
    <!-- Shoulders/Coat -->
    <path d="M75 175 C75 145 95 135 120 135 C145 135 165 145 165 175 L175 195 C175 198 172 200 168 200 L72 200 C68 200 65 198 65 195 Z" fill="#3B82F6"/>
    
    <!-- Collar / Shirt inner -->
    <path d="M105 135 L120 155 L135 135 Z" fill="#F8FAFC"/>
    <path d="M112 135 L120 148 L128 135 Z" fill="#E2E8F0"/>

    <!-- Neck -->
    <rect x="110" y="115" width="20" height="25" rx="6" fill="#FDE68A"/>

    <!-- Head -->
    <circle cx="120" cy="95" r="28" fill="#FDE68A"/>

    <!-- Hair (Stylish modern youthful haircut) -->
    <path d="M92 90 C92 70 105 63 120 63 C138 63 148 72 148 92 C148 95 147 98 147 98 C147 98 142 90 135 85 C125 78 115 82 105 85 C98 87 92 90 92 90 Z" fill="#1E293B"/>
    <path d="M92 95 C93 83 99 75 110 70 C105 78 102 88 100 98 Z" fill="#1E293B"/>

    <!-- Confident facial expression / subtle smile -->
    <path d="M113 104 Q120 110 127 104" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Eyes - determined and bright -->
    <circle cx="109" cy="93" r="3" fill="#1E293B"/>
    <circle cx="131" cy="93" r="3" fill="#1E293B"/>
    <!-- Eyebrows angled slightly up for ambition/ideals -->
    <path d="M105 88 L113 89" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <path d="M127 89 L135 88" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

    <!-- Floating Spark/Star symbol representing "Idealism" (有理想) -->
    <g transform="translate(162, 55) scale(0.8)">
      <path d="M0 -12 C0 -4 4 0 12 0 C4 0 0 4 0 12 C0 4 -4 0 -12 0 C-4 0 0 -4 0 -12 Z" fill="#F59E0B"/>
    </g>
    <g transform="translate(72, 80) scale(0.5)">
      <path d="M0 -12 C0 -4 4 0 12 0 C4 0 0 4 0 12 C0 4 -4 0 -12 0 C-4 0 0 -4 0 -12 Z" fill="#F59E0B"/>
    </g>
  </g>
</svg>