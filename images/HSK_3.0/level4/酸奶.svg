<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Yogurt Cup / Container -->
  <g transform="translate(0, 5)">
    <!-- Cup body (trapezoid) -->
    <path d="M 85 90 L 155 90 L 142 180 L 98 180 Z" fill="#F4F5F7"/>
    
    <!-- Cup shading / 3D side -->
    <path d="M 120 90 L 155 90 L 142 180 L 120 180 Z" fill="#E2E5EC"/>

    <!-- Foil lid peeled back slightly -->
    <ellipse cx="120" cy="90" rx="35" ry="9" fill="#94A3B8"/>
    <ellipse cx="120" cy="88" rx="35" ry="9" fill="#CBD5E1"/>
    <!-- Lid fold/peel -->
    <path d="M 100 83 Q 120 70 145 80 Q 130 92 100 83 Z" fill="#E2E5EC" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M 100 83 Q 120 70 145 80" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <!-- Decorative label stripe on cup -->
    <path d="M 88 115 L 152 115 L 150 145 L 90 145 Z" fill="#38BDF8"/>
    
    <!-- Fresh fruit graphic on label (blueberry / berries motif) -->
    <circle cx="112" cy="130" r="6" fill="#818CF8"/>
    <circle cx="128" cy="130" r="8" fill="#6366F1"/>

    <!-- Yogurt drip emerging or visible inside/over edge -->
    <path d="M 95 90 Q 120 98 145 90 C 145 96 135 102 120 102 C 105 102 95 96 95 90 Z" fill="#FFFFFF"/>

    <!-- Spoon dipping into the yogurt -->
    <g transform="rotate(-25 155 100)">
      <!-- Spoon handle -->
      <rect x="150" y="45" width="10" height="65" rx="5" fill="#E2E5EC"/>
      <rect x="152" y="45" width="4" height="65" rx="2" fill="#CBD5E1"/>
      <!-- Spoon bowl -->
      <ellipse cx="155" cy="115" rx="12" ry="16" fill="#F1F5F9"/>
      <ellipse cx="155" cy="116" rx="9" ry="13" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Accent highlight floating drops / berries for educational context -->
  <circle cx="68" cy="150" r="5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="178" cy="155" r="7" fill="#818CF8" opacity="0.8"/>
  <circle cx="78" cy="85" r="4" fill="#6366F1" opacity="0.8"/>

</svg>