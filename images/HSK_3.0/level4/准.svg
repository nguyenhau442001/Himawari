<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle radial glow behind the clock for focus -->
  <circle cx="120" cy="115" r="75" fill="#222733"/>

  <!-- Clock Outer Ring / Case -->
  <circle cx="120" cy="115" r="68" fill="none" stroke="#2D3446" stroke-width="8"/>
  <circle cx="120" cy="115" r="64" fill="#14171F"/>

  <!-- Clock Hour Ticks -->
  <line x1="120" y1="55" x2="120" y2="61" stroke="#56617A" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="169" x2="120" y2="175" stroke="#56617A" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="115" x2="66" y2="115" stroke="#56617A" stroke-width="3" stroke-linecap="round"/>
  <line x1="174" y1="115" x2="180" y2="115" stroke="#56617A" stroke-width="3" stroke-linecap="round"/>

  <!-- Decorative small minute ticks -->
  <circle cx="152" cy="67" r="1.5" fill="#3A4255"/>
  <circle cx="172" cy="87" r="1.5" fill="#3A4255"/>
  <circle cx="172" cy="143" r="1.5" fill="#3A4255"/>
  <circle cx="152" cy="163" r="1.5" fill="#3A4255"/>
  <circle cx="88" cy="163" r="1.5" fill="#3A4255"/>
  <circle cx="68" cy="143" r="1.5" fill="#3A4255"/>
  <circle cx="68" cy="87" r="1.5" fill="#3A4255"/>
  <circle cx="88" cy="67" r="1.5" fill="#3A4255"/>

  <!-- Clock Center Pin Shadow/Base -->
  <circle cx="120" cy="115" r="8" stroke="#101217" stroke-width="2" fill="#E5A93B"/>

  <!-- Clock Hands (Displaying precise time alignment) -->
  <!-- Hour hand pointing up-right -->
  <line x1="120" y1="115" x2="148" y2="92" stroke="#E6EDF5" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand pointing straight up -->
  <line x1="120" y1="115" x2="120" y2="76" stroke="#E6EDF5" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Second hand / Accent hand pointing sharply down-left -->
  <line x1="120" y1="115" x2="92" y2="152" stroke="#F0544F" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="115" r="3.5" fill="#F0544F"/>

  <!-- Precision Bullseye / Crosshair overlay element representing exactness ("zhǔn") -->
  <circle cx="120" cy="115" r="48" fill="none" stroke="#E5A93B" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="120" cy="115" r="30" fill="none" stroke="#E5A93B" stroke-width="1.5" opacity="0.4"/>

  <!-- Top Crown / Loop of the Pocket Watch -->
  <path d="M112 43 C112 39 128 39 128 43" fill="none" stroke="#2D3446" stroke-width="5" stroke-linecap="round"/>
  <rect x="115" y="42" width="10" height="6" rx="1" fill="#E5A93B"/>

  <!-- Visual indicator of absolute accuracy (Tiny alignment ticks radiating from center top) -->
  <line x1="120" y1="48" x2="120" y2="52" stroke="#E5A93B" stroke-width="2" stroke-linecap="round"/>
</svg>