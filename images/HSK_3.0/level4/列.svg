<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Railway track and perspective ground -->
  <path d="M40 180 L200 180" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M30 200 L210 200" stroke="#374151" stroke-width="3"/>
  <line x1="120" y1="200" x2="120" y2="180" stroke="#4B5563" stroke-width="3"/>
  <line x1="90" y1="200" x2="80" y2="180" stroke="#4B5563" stroke-width="3"/>
  <line x1="150" y1="200" x2="160" y2="180" stroke="#4B5563" stroke-width="3"/>
  <line x1="60" y1="200" x2="45" y2="180" stroke="#4B5563" stroke-width="3"/>
  <line x1="180" y1="200" x2="195" y2="180" stroke="#4B5563" stroke-width="3"/>

  <!-- Motion lines / speed trails -->
  <line x1="20" y1="120" x2="50" y2="120" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="10" y1="140" x2="40" y2="140" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="25" y1="160" x2="60" y2="160" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Train ( đoàn tàu - representing 列) -->
  <!-- Carriage 3 (Back) -->
  <rect x="175" y="145" width="45" height="40" rx="6" fill="#475569"/>
  <rect x="185" y="155" width="12" height="15" rx="2" fill="#E2E8F0"/>
  <rect x="202" y="155" width="12" height="15" rx="2" fill="#E2E8F0"/>
  <circle cx="187" cy="188" r="6" fill="#1E293B"/>
  <circle cx="213" cy="188" r="6" fill="#1E293B"/>

  <!-- Carriage 2 (Middle) -->
  <rect x="120" y="142" width="50" height="43" rx="6" fill="#64748B"/>
  <rect x="130" y="153" width="13" height="16" rx="2" fill="#E2E8F0"/>
  <rect x="148" y="153" width="13" height="16" rx="2" fill="#E2E8F0"/>
  <circle cx="135" cy="188" r="6" fill="#1E293B"/>
  <circle cx="155" cy="188" r="6" fill="#1E293B"/>

  <!-- Locomotive (Front) -->
  <path d="M 65 140 L 105 140 C 112 140 115 143 115 150 L 115 185 L 65 185 Z" fill="#F59E0B"/>
  <path d="M 90 130 L 110 130 L 115 140 L 90 140 Z" fill="#D97706"/>
  <!-- Train Windshield -->
  <path d="M 92 147 L 110 147 L 110 162 L 92 162 Z" fill="#1E293B"/>
  <!-- Headlight beam -->
  <path d="M 65 155 L 20 145 L 20 185 L 65 175 Z" fill="#FDE68A" opacity="0.2"/>
  <circle cx="67" cy="165" r="4" fill="#FEF3C7"/>
  <!-- Wheels -->
  <circle cx="80" cy="188" r="7" fill="#1E293B"/>
  <circle cx="80" cy="188" r="3" fill="#94A3B8"/>
  <circle cx="102" cy="188" r="7" fill="#1E293B"/>
  <circle cx="102" cy="188" r="3" fill="#94A3B8"/>

  <!-- Connector links between cars -->
  <rect x="115" y="165" width="5" height="4" fill="#334155"/>
  <rect x="170" y="165" width="5" height="4" fill="#334155"/>

  <!-- Overhead subtle glow/accent -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.08"/>
</svg>