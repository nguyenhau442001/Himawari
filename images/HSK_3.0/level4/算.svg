<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Receipt Paper Base -->
    <path d="M 85 45 L 155 45 L 155 185 L 150 190 L 145 185 L 140 190 L 135 185 L 130 190 L 125 185 L 120 190 L 115 185 L 110 190 L 105 185 L 100 190 L 95 185 L 90 190 L 85 185 Z" fill="#282C35" />
    <path d="M 90 40 L 150 40 L 150 180 L 145 185 L 140 180 L 135 185 L 130 180 L 125 185 L 120 180 L 115 185 L 110 180 L 105 185 L 100 180 L 95 185 L 90 180 Z" fill="#F0F3F9" />

    <!-- Receipt Header / Barcode lines -->
    <rect x="105" y="55" width="30" height="6" rx="2" fill="#D0D6E0" />
    
    <!-- Receipt Item Lines -->
    <rect x="100" y="75" width="40" height="4" rx="1" fill="#A0AAB8" />
    <rect x="100" y="87" width="25" height="4" rx="1" fill="#CBD2D9" />
    
    <rect x="100" y="110" width="35" height="4" rx="1" fill="#A0AAB8" />
    <rect x="100" y="122" width="20" height="4" rx="1" fill="#CBD2D9" />

    <!-- Divider Line -->
    <line x1="100" y1="140" x2="140" y2="140" stroke="#D0D6E0" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Total Line (Highlighted) -->
    <rect x="100" y="152" width="40" height="6" rx="1" fill="#FF9F43" />
    <rect x="100" y="164" width="20" height="5" rx="1" fill="#FF9F43" opacity="0.7" />

    <!-- Modern Calculator Body (Overlapping bottom right) -->
    <g transform="translate(108, 115)">
      <!-- Calculator Shadow -->
      <rect x="4" y="4" width="84" height="106" rx="12" fill="#111317" opacity="0.4" />
      <!-- Calculator Case -->
      <rect x="0" y="0" width="84" height="106" rx="12" fill="#21252B" stroke="#3A3F4B" stroke-width="2" />
      
      <!-- Calculator Screen -->
      <rect x="10" y="12" width="64" height="24" rx="6" fill="#14161A" />
      <path d="M 60 22 L 66 22 M 63 19 L 63 25" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" /> <!-- Plus sign styling -->
      <circle cx="50" cy="22" r="1.5" fill="#FF9F43" />
      <rect x="18" y="20" width="24" height="4" rx="2" fill="#FF9F43" />

      <!-- Keypad Grid -->
      <!-- Row 1 -->
      <rect x="10" y="44" width="16" height="12" rx="4" fill="#313640" />
      <rect x="34" y="44" width="16" height="12" rx="4" fill="#313640" />
      <rect x="58" y="44" width="16" height="12" rx="4" fill="#313640" />
      
      <!-- Row 2 -->
      <rect x="10" y="60" width="16" height="12" rx="4" fill="#313640" />
      <rect x="34" y="60" width="16" height="12" rx="4" fill="#313640" />
      <rect x="58" y="60" width="16" height="12" rx="4" fill="#313640" />

      <!-- Row 3 -->
      <rect x="10" y="76" width="16" height="12" rx="4" fill="#313640" />
      <rect x="34" y="76" width="16" height="12" rx="4" fill="#313640" />
      <!-- Equals / Action Key (Highlighted Orange) -->
      <rect x="58" y="76" width="16" height="28" rx="6" fill="#FF9F43" />
      <path d="M 64 86 L 68 86 M 64 94 L 68 94" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

      <!-- Row 4 bottom -->
      <rect x="10" y="92" width="40" height="12" rx="4" fill="#313640" />
    </g>

    <!-- Floating Coins / Numerical Calculation Elements (Accent) -->
    <g transform="translate(60, 90)">
      <circle cx="0" cy="0" r="12" fill="#FF9F43" />
      <circle cx="0" cy="0" r="8" fill="#F39C12" />
      <path d="M 0 -4 L 0 4 M -3 0 L 3 0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <g transform="translate(75, 140)">
      <circle cx="0" cy="0" r="9" fill="#FF9F43" />
      <path d="M 0 -3 L 0 3 M -2 0 L 2 0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>