<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background City Silhouette / Night Atmosphere -->
  <g opacity="0.25" fill="#3A4454">
    <rect x="25" y="110" width="30" height="85"/>
    <polygon points="40,90 25,110 55,110"/>
    <rect x="60" y="130" width="25" height="65"/>
    <rect x="155" y="120" width="35" height="75"/>
    <rect x="195" y="100" width="20" height="95"/>
    <polygon points="205,80 195,100 215,100"/>
  </g>

  <!-- City Wall Base (Tường thành) -->
  <g>
    <!-- Main Wall Structure -->
    <path d="M 40,195 L 40,135 L 200,135 L 200,195 Z" fill="#2E3846"/>
    
    <!-- Wall Bricks / Texture Lines -->
    <g stroke="#1A1D24" stroke-width="1.5" opacity="0.6">
      <line x1="40" y1="150" x2="200" y2="150"/>
      <line x1="40" y1="165" x2="200" y2="165"/>
      <line x1="40" y1="180" x2="200" y2="180"/>
      <!-- Vertical staggered joints -->
      <line x1="70" y1="135" x2="70" y2="150"/>
      <line x1="120" y1="135" x2="120" y2="150"/>
      <line x1="170" y1="135" x2="170" y2="150"/>
      
      <line x1="55" y1="150" x2="55" y2="165"/>
      <line x1="95" y1="150" x2="95" y2="165"/>
      <line x1="145" y1="150" x2="145" y2="165"/>
      <line x1="185" y1="150" x2="185" y2="165"/>

      <line x1="75" y1="165" x2="75" y2="180"/>
      <line x1="110" y1="165" x2="110" y2="180"/>
      <line x1="160" y1="165" x2="160" y2="180"/>

      <line x1="60" y1="180" x2="60" y2="195"/>
      <line x1="130" y1="180" x2="130" y2="195"/>
      <line x1="175" y1="180" x2="175" y2="195"/>
    </g>

    <!-- Battlements / Crenellations (Được tường thành) -->
    <path d="M 35,135 
             L 35,120 L 50,120 L 50,135 
             L 65,135 L 65,120 L 80,120 L 80,135 
             L 95,135 L 95,120 L 110,120 L 110,135 
             L 125,135 L 125,120 L 140,120 L 140,135 
             L 155,135 L 155,120 L 170,120 L 170,135 
             L 185,135 L 185,120 L 200,120 L 200,135 Z" fill="#3A4454"/>

    <!-- City Gate Arch (Cổng thành) -->
    <path d="M 105,195 L 105,160 C 105,150 135,150 135,160 L 135,195 Z" fill="#14161B"/>
    <!-- Wooden Gate Details -->
    <path d="M 112,195 L 112,163 C 112,158 128,158 128,163 L 128,195 Z" fill="#8C5230"/>
    <line x1="120" y1="160" x2="120" y2="195" stroke="#5A321A" stroke-width="1.5"/>
  </g>

  <!-- Modern City Skyline rising behind the wall (Thành phố hiện đại) -->
  <g>
    <!-- Tower Center (Gold/Orange accent for focus) -->
    <rect x="100" y="60" width="40" height="75" fill="#E59838"/>
    <!-- Glass panel lines on golden tower -->
    <line x1="110" y1="70" x2="110" y2="125" stroke="#B87522" stroke-width="2"/>
    <line x1="130" y1="70" x2="130" y2="125" stroke="#B87522" stroke-width="2"/>
    <line x1="100" y1="85" x2="140" y2="85" stroke="#B87522" stroke-width="1.5"/>
    <line x1="100" y1="105" x2="140" y2="105" stroke="#B87522" stroke-width="1.5"/>

    <!-- Left Modern Skyscraper -->
    <rect x="70" y="80" width="25" height="55" fill="#4B5A6F"/>
    <line x1="82" y1="90" x2="82" y2="125" stroke="#2E3846" stroke-width="2"/>

    <!-- Right Modern Skyscraper -->
    <rect x="145" y="70" width="28" height="65" fill="#5C6D85"/>
    <line x1="159" y1="80" x2="159" y2="125" stroke="#3A4454" stroke-width="2"/>

    <!-- Antenna on Main Tower -->
    <line x1="120" y1="60" x2="120" y2="45" stroke="#E59838" stroke-width="2.5"/>
    <circle cx="120" cy="43" r="2.5" fill="#F4D06F"/>
  </g>

  <!-- Foreground Ground Plane -->
  <rect x="25" y="195" width="190" height="6" rx="3" fill="#4B5A6F"/>
</svg>