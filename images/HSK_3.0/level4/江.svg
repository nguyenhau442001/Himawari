<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Water Gradient -->
    <linearGradient id="riverBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0F1722"/>
    </linearGradient>

    <!-- Vibrant River Surface Gradient -->
    <linearGradient id="riverSurface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Distant Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#1A2634"/>
    </linearGradient>

    <!-- Bank / Land Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2A38"/>
      <stop offset="100%" stop-color="#28384B"/>
    </linearGradient>
  </defs>

  <!-- Sky & Horizon -->
  <rect x="0" y="0" width="240" height="120" fill="url(#riverBg)"/>
  
  <!-- Distant Mountains (Showing expansive scale of a "large river" / 江) -->
  <path d="M-20 110 L40 60 L95 95 L150 50 L210 85 L260 55 L260 110 Z" fill="url(#mountainGrad)"/>

  <!-- Setting Sun / Warm Accent -->
  <circle cx="180" cy="55" r="14" fill="#FFB703" opacity="0.9"/>
  <circle cx="180" cy="55" r="20" fill="#FFB703" opacity="0.2"/>

  <!-- Left Land Bank -->
  <path d="M0 110 C30 108 55 115 70 130 C85 145 90 170 95 240 L0 240 Z" fill="url(#landGrad)"/>
  <path d="M0 110 C30 108 55 115 70 130 C85 145 90 170 95 240" fill="none" stroke="#3A4D63" stroke-width="2"/>

  <!-- Right Land Bank -->
  <path d="M240 100 C210 98 185 105 165 120 C145 135 135 160 130 240 L240 240 Z" fill="url(#landGrad)"/>
  <path d="M240 100 C210 98 185 105 165 120 C145 135 135 160 130 240" fill="none" stroke="#3A4D63" stroke-width="2"/>

  <!-- The Wide River Flowing Downward (Representing "江") -->
  <path d="M70 130 C85 145 90 170 95 240 L130 240 C135 160 145 135 165 120 C185 105 210 98 240 100 L240 85 C210 83 185 90 165 105 C145 120 130 140 120 180 C110 140 95 120 75 105 C55 90 30 83 0 85 L0 110 C30 108 55 115 70 130 Z" fill="url(#riverSurface)"/>

  <!-- Dynamic River Current Waves / Flow Lines (Sleek Modern Flat Style) -->
  <path d="M112 125 C115 135 118 150 115 170" fill="none" stroke="#E0F7FF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M128 140 C125 155 122 170 125 195" fill="none" stroke="#E0F7FF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M98 150 C102 165 105 185 100 210" fill="none" stroke="#E0F7FF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M142 160 C138 175 135 195 138 220" fill="none" stroke="#E0F7FF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Modern Flat Cargo Boat / Sailboat (Emphasizing the grandeur and scale of a navigable "江") -->
  <g transform="translate(145, 135)">
    <!-- Reflection -->
    <ellipse cx="12" cy="18" rx="14" ry="3" fill="#00D2FF" opacity="0.3"/>
    <!-- Hull -->
    <path d="M0 12 L24 12 C21 18 3 18 0 12 Z" fill="#FF5722"/>
    <!-- Cabin -->
    <rect x="7" y="6" width="10" height="6" fill="#FFFFFF" opacity="0.9"/>
    <!-- Mast -->
    <line x1="12" y1="6" x2="12" y2="1" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Sail -->
    <path d="M13 1 L20 4 L13 6 Z" fill="#FFB703"/>
  </g>

  <!-- Scenic Trees on Banks (Scale reference showing wideness) -->
  <!-- Left bank trees -->
  <circle cx="55" cy="118" r="8" fill="#2E4A3F"/>
  <circle cx="45" cy="115" r="6" fill="#3A5A4C"/>
  <circle cx="65" cy="123" r="7" fill="#243B31"/>

  <!-- Right bank trees -->
  <circle cx="175" cy="112" r="9" fill="#2E4A3F"/>
  <circle cx="187" cy="115" r="6" fill="#3A5A4C"/>

  <!-- Subtle Framing Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
</svg>