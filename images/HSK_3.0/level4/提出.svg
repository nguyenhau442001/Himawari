<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to focus on center -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual illustration for "提出" (bringing forth an idea/object) -->
  <!-- Person / Supporter base representing "He" (他) -->
  <g transform="translate(0, 15)">
    <!-- Body/Torso -->
    <path d="M 90 155 L 150 155 L 140 195 C 138 200, 102 200, 100 195 Z" fill="#2E3648"/>
    <!-- Head -->
    <circle cx="120" cy="130" r="14" fill="#E0E6ED"/>
    <!-- Collar / Shirt detail -->
    <path d="M 110 155 L 120 165 L 130 155" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Arms lifting/presenting upward -->
  <g fill="none" stroke="#E0E6ED" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left arm -->
    <path d="M 105 160 C 95 140, 95 110, 105 95"/>
    <!-- Right arm -->
    <path d="M 135 160 C 145 140, 145 110, 135 95"/>
  </g>

  <!-- Dynamic motion lines or directional upward energy -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="95" y1="80" x2="95" y2="65" />
    <line x1="145" y1="80" x2="145" y2="65" />
  </g>

  <!-- The Idea/Object being "brought forth" (提出) - Glowing Golden Lightbulb with Sparkle -->
  <g transform="translate(0, -10)">
    <!-- Outer glow / illumination aura -->
    <circle cx="120" cy="75" r="28" fill="#F59E0B" opacity="0.15"/>
    <circle cx="120" cy="75" r="20" fill="#F59E0B" opacity="0.25"/>

    <!-- Lightbulb base/threads -->
    <rect x="113" y="92" width="14" height="6" rx="2" fill="#94A3B8"/>
    <path d="M 115 98 L 125 98 L 123 103 L 117 103 Z" fill="#64748B"/>
    
    <!-- Lightbulb glass body -->
    <path d="M 104 70 C 104 58, 111 50, 120 50 C 129 50, 136 58, 136 70 C 136 78, 130 84, 126 88 L 126 92 L 114 92 L 114 88 C 110 84, 104 78, 104 70 Z" fill="#F59E0B"/>
    
    <!-- Lightbulb inner filament (bright accent) -->
    <path d="M 117 72 L 120 65 L 123 72" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Accent sparkle indicating a "good idea" or brilliant thought -->
    <path d="M 120 30 L 123 42 L 135 45 L 123 48 L 120 60 L 117 48 L 105 45 L 117 42 Z" fill="#FBBF24"/>
  </g>

</svg>