  <path d="M120 48 L120 62 M120 55 C114 53 109 48 109 42 C109 37 114 33 120 33 C126 33 131 37 131 42" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M74 74 L120 62 L166 74" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Outer Jacket (外套 - Coat/Jacket) -->
  <g>
    <!-- Main Body Shape -->
    <path d="M84 74 L70 94 L80 185 C80 190 84 194 89 194 L151 194 C156 194 160 190 160 185 L170 94 L156 74 Z" fill="#3B82F6"/>
    
