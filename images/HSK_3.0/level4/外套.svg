    <path d="M144 142 L128 142 L128 166 L144 166 C147 166 149 164 149 161 L149 147 C149 144 147 142 144 142 Z" fill="#1D4ED8"/>

    <!-- High-contrast focus accent (warm zipper pull / tag element) -->
    <circle cx="120" cy="106" r="4" fill="#F59E0B"/>
    <rect x="118.5" y="110" width="3" height="12" rx="1.5" fill="#F59E0B"/>
  </g>
</svg>