<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing Accent Background Effect -->
  <circle cx="120" cy="120" r="70" fill="#FF9F43" opacity="0.08"/>

  <!-- Backpack Illustration -->
  <g transform="translate(0, 5)">
    <!-- Top Handle -->
    <path d="M105,52 C105,42 135,42 135,52" fill="none" stroke="#3A3F4B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Shoulder Straps (Background) -->
    <path d="M85,75 L65,185" fill="none" stroke="#FF9F43" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <path d="M155,75 L175,185" fill="none" stroke="#FF9F43" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- Main Backpack Body -->
    <rect x="70" y="55" width="100" height="135" rx="28" fill="#2E3544"/>
    
    <!-- Main Body Highlight/Shadow depth -->
    <path d="M70,83 C70,68 82,55 97,55 L143,58 C158,58 170,70 170,85 L170,162 C170,177 158,190 143,190 L97,190 C82,190 70,177 70,162 Z" fill="none" stroke="#FF9F43" stroke-width="3" opacity="0.8"/>

    <!-- Front Zipper Pocket -->
    <rect x="85" y="105" width="70" height="70" rx="18" fill="#252A36"/>
    
    <!-- Pocket Zipper -->
    <line x1="95" y1="105" x2="145" y2="105" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="105" r="4" fill="#FFFFFF"/>

    <!-- Main Zipper Line -->
    <path d="M80,72 L160,72" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="72" r="5" fill="#FFFFFF"/>

    <!-- Side Pockets / Details -->
    <path d="M64,105 C60,105 57,108 57,112 L57,145 C57,149 60,152 64,152 L70,152 L70,105 Z" fill="#252A36"/>
    <path d="M176,105 C180,105 183,108 183,112 L183,145 C183,149 180,152 176,152 L170,152 L170,105 Z" fill="#252A36"/>

    <!-- Subtle Stitching Lines -->
    <rect x="93" y="120" width="54" height="40" rx="10" fill="none" stroke="#3A3F4B" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
</svg>