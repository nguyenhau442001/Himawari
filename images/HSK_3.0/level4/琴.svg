<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow behind the guqin -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.06"/>

  <!-- Guqin (Traditional Chinese Zither) - Centered iconic physical object -->
  <g transform="translate(120, 120) rotate(-22)">
    
    <!-- Main body (soundboard / wooden frame) -->
    <path d="M -85,-18 C -70,-22 40,-25 85,-12 C 92,-10 95,-3 92,2 C 85,12 35,18 -85,14 Z" fill="#D4A373"/>
    
    <!-- Wood grain highlight / shading -->
    <path d="M -80,-14 C -65,-17 35,-20 80,-9 C 86,-8 88,-3 86,0 C 80,7 30,12 -80,10 Z" fill="#E9EDC9" opacity="0.25"/>
    <path d="M -85,-2 C -40,3 40,7 85,2 C 85,6 80,11 75,13 C 30,17 -50,11 -85,3 Z" fill="#BC6C25" opacity="0.35"/>

    <!-- Head (Jiaotou / 头部) - Left side rounded end -->
    <path d="M -85,-18 C -92,-15 -95,-6 -92,2 C -92,7 -88,11 -85,14 Z" fill="#9A531B"/>

    <!-- Tail (Longwei / 龙尾) - Right side intricate end -->
    <path d="M 85,-12 C 92,-10 98,-6 98,0 C 98,6 92,10 85,12 Z" fill="#7F4412"/>

    <!-- Tuning pegs / feet accents (Yueshan / Nan Jiao) -->
    <rect x="-78" y="-14" width="4" height="28" rx="1.5" fill="#432818"/>
    <rect x="74" y="-9" width="3" height="20" rx="1" fill="#432818"/>

    <!-- Strings (7 strings running along the length) -->
    <line x1="-76" y1="-9" x2="74" y2="-6" stroke="#FFE6A7" stroke-width="0.8" opacity="0.9"/>
    <line x1="-76" y1="-6" x2="74" y2="-4" stroke="#FFE6A7" stroke-width="1.0" opacity="0.9"/>
    <line x1="-76" y1="-3" x2="74" y2="-2" stroke="#FFE6A7" stroke-width="1.2" opacity="0.95"/>
    <line x1="-76" y1="0"  x2="74" y2="0"  stroke="#FFE6A7" stroke-width="1.4" opacity="1.0"/>
    <line x1="-76" y1="3"  x2="74" y2="2"  stroke="#FFE6A7" stroke-width="1.2" opacity="0.95"/>
    <line x1="-76" y1="6"  x2="74" y2="4"  stroke="#FFE6A7" stroke-width="1.0" opacity="0.9"/>
    <line x1="-76" y1="9"  x2="74" y2="6"  stroke="#FFE6A7" stroke-width="0.8" opacity="0.9"/>

    <!-- Sound holes / bridge accents -->
    <rect x="-45" y="-3" width="6" height="6" rx="1" fill="#281408" opacity="0.6"/>
    <rect x="35" y="-2" width="5" height="4" rx="1" fill="#281408" opacity="0.6"/>

  </g>

  <!-- Musical notes / sound waves floating upward (representing playing music) -->
  <g fill="#FFB703" opacity="0.85">
    <!-- Note 1 -->
    <circle cx="82" cy="72" r="3.5"/>
    <path d="M 85.5,72 L 85.5,56 C 89,53 93,52 97,51 L 97,54 C 93.5,55 90,57 88.5,60 L 88.5,72 Z"/>
    
    <!-- Note 2 -->
    <circle cx="158" cy="85" r="4"/>
    <path d="M 162,85 L 162,67 C 166,64 170,63 174,62 L 174,65 C 170,66 166.5,68 165,71 L 165,85 Z"/>
    
    <!-- Small sparkle / accent -->
    <path d="M 120,48 L 122,54 L 128,56 L 122,58 L 120,64 L 118,58 L 112,56 L 118,54 Z" fill="#FB8500" opacity="0.7"/>
  </g>

</svg>