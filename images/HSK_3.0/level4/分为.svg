<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Book spine and cover representation -->
  <g transform="translate(60, 50)">
    <!-- Bottom volume -->
    <rect x="0" y="100" width="120" height="40" rx="4" fill="#FFB347"/>
    <rect x="5" y="105" width="110" height="30" fill="#1A1D24" fill-opacity="0.2"/>
    
    <!-- Top volume -->
    <rect x="0" y="40" width="120" height="40" rx="4" fill="#FFD700"/>
    <rect x="5" y="45" width="110" height="30" fill="#1A1D24" fill-opacity="0.2"/>
    
    <!-- Separation lines/visual indicator of division -->
    <line x1="-20" y1="90" x2="140" y2="90" stroke="#4A5568" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Arrows indicating division -->
    <path d="M150 70 L165 85 L150 100" stroke="#E2E8F0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-30 70 L-45 85 L-30 100" stroke="#E2E8F0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>