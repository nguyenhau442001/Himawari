<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Table representing the group gathering -->
  <ellipse cx="120" cy="145" rx="55" ry="25" fill="#2D333B" stroke="#3A424C" stroke-width="2"/>
  
  <!-- Team member 1 (Top / Leader) -->
  <g transform="translate(120, 75)">
    <circle cx="0" cy="12" r="10" fill="#FFA726"/>
    <path d="M-14 32 C-14 23, 14 23, 14 32 Z" fill="#FFA726"/>
  </g>

  <!-- Team member 2 (Left-Top) -->
  <g transform="translate(75, 105)">
    <circle cx="0" cy="12" r="10" fill="#4DB6AC"/>
    <path d="M-14 32 C-14 23, 14 23, 14 32 Z" fill="#4DB6AC"/>
  </g>

  <!-- Team member 3 (Right-Top) -->
  <g transform="translate(165, 105)">
    <circle cx="0" cy="12" r="10" fill="#42A5F5"/>
    <path d="M-14 32 C-14 23, 14 23, 14 32 Z" fill="#42A5F5"/>
  </g>

  <!-- Team member 4 (Left-Bottom) -->
  <g transform="translate(85, 155)">
    <circle cx="0" cy="12" r="10" fill="#AB47BC"/>
    <path d="M-14 32 C-14 23, 14 23, 14 32 Z" fill="#AB47BC"/>
  </g>

  <!-- Team member 5 (Right-Bottom) -->
  <g transform="translate(155, 155)">
    <circle cx="0" cy="12" r="10" fill="#EF5350"/>
    <path d="M-14 32 C-14 23, 14 23, 14 32 Z" fill="#EF5350"/>
  </g>

  <!-- Central collaboration item (Notepad/Project sheet on table) -->
  <rect x="108" y="133" width="24" height="18" rx="2" fill="#E0E0E0"/>
  <line x1="112" y1="138" x2="128" y2="138" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="112" y1="143" x2="124" y2="143" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Connecting connection nodes/dots to emphasize "Group/Team" concept -->
  <circle cx="120" cy="115" r="3" fill="#FFC107" opacity="0.8"/>
  <line x1="120" y1="87" x2="120" y2="115" stroke="#FFC107" stroke-dasharray="2 2" stroke-width="1.5"/>
  <line x1="120" y1="115" x2="90" y2="117" stroke="#FFC107" stroke-dasharray="2 2" stroke-width="1.5"/>
  <line x1="120" y1="115" x2="150" y2="117" stroke="#FFC107" stroke-dasharray="2 2" stroke-width="1.5"/>
  <line x1="120" y1="115" x2="97" y2="150" stroke="#FFC107" stroke-dasharray="2 2" stroke-width="1.5"/>
  <line x1="120" y1="115" x2="143" y2="150" stroke="#FFC107" stroke-dasharray="2 2" stroke-width="1.5"/>
</svg>