<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Conceptual Representation: Absolute negation / complete contradiction (matching "并" in "并不同样/并不简单") -->
  <!-- Two parallel tracks or opposing absolute states crossed decisively -->
  
  <!-- Left/First state indicator -->
  <g transform="translate(70, 95)">
    <rect x="-25" y="-15" width="50" height="30" rx="6" fill="#3A4256"/>
    <circle cx="0" cy="0" r="6" fill="#61AFEF"/>
  </g>

  <!-- Right/Second state indicator -->
  <g transform="translate(170, 95)">
    <rect x="-25" y="-15" width="50" height="30" rx="6" fill="#3A4256"/>
    <circle cx="0" cy="0" r="6" fill="#E06C75"/>
  </g>

  <!-- Absolute rejection / emphatic negation barrier (Vivid Orange/Gold accent) -->
  <path d="M 95 95 L 145 95" stroke="#E5C07B" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Central Focal Object: A precise analytical magnifying lens completely invalidating the surface complexity -->
  <g transform="translate(120, 120)">
    <!-- Outer rim -->
    <circle cx="0" cy="0" r="46" fill="#1A1D24" stroke="#E5C07B" stroke-width="6"/>
    
    <!-- Lens glass inner -->
    <circle cx="0" cy="0" r="38" fill="#212630"/>
    
    <!-- Clear distinct contrast symbol inside lens (X marks absolute negation) -->
    <path d="M -14 -14 L 14 14 M 14 -14 L -14 14" stroke="#E06C75" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Magnifier handle -->
    <path d="M 32 32 L 54 54" stroke="#E5C07B" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Floating particles representing depth and clarity -->
  <circle cx="50" cy="170" r="3" fill="#61AFEF" opacity="0.6"/>
  <circle cx="190" cy="60" r="4" fill="#E5C07B" opacity="0.6"/>
  <circle cx="180" cy="180" r="2.5" fill="#98C379" opacity="0.6"/>
</svg>