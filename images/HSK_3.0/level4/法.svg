<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow behind the object -->
  <circle cx="120" cy="115" r="70" fill="#FFC107" opacity="0.08"/>

  <!-- Central Physical Object: The Scales of Justice / Law (representing "法") -->
  <g transform="translate(0, 5)">
    <!-- Base stand -->
    <path d="M 95 180 L 145 180 L 140 190 L 100 190 Z" fill="#94A3B8" rx="2"/>
    <rect x="114" y="85" width="12" height="95" rx="3" fill="#E2E8F0"/>
    
    <!-- Base dome -->
    <path d="M 100 180 C 100 165, 140 165, 140 180 Z" fill="#CBD5E1"/>

    <!-- Top ornate finial / ring -->
    <circle cx="120" cy="72" r="8" fill="none" stroke="#FFC107" stroke-width="4"/>
    <rect x="117" y="78" width="6" height="12" fill="#FFC107" rx="2"/>

    <!-- Central balancing beam -->
    <path d="M 70 85 L 170 85 L 165 93 L 75 93 Z" fill="#FFC107" rx="2"/>
    <circle cx="120" cy="89" r="6" fill="#FFF" stroke="#D97706" stroke-width="2"/>

    <!-- Left Pan Assembly -->
    <!-- Suspension chains/strings -->
    <line x1="75" y1="91" x2="60" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="91" x2="100" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left Scale Bowl -->
    <path d="M 50 135 C 50 152, 110 152, 110 135 Z" fill="#38BDF8" opacity="0.9"/>
    <ellipse cx="80" cy="135" rx="30" ry="7" fill="#0EA5E9"/>

    <!-- Right Pan Assembly -->
    <!-- Suspension chains/strings -->
    <line x1="145" y1="91" x2="140" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="165" y1="91" x2="180" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right Scale Bowl -->
    <path d="M 130 135 C 130 152, 190 152, 190 135 Z" fill="#38BDF8" opacity="0.9"/>
    <ellipse cx="160" cy="135" rx="30" ry="7" fill="#0EA5E9"/>
    
    <!-- Balance indicator (gavel-like subtle accent or core highlight) -->
    <circle cx="120" cy="89" r="2.5" fill="#1A1D24"/>
  </g>

  <!-- Ground reflection / shadow -->
  <ellipse cx="120" cy="198" rx="35" ry="4" fill="#0F172A"/>

</svg>