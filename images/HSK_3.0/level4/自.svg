<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Contextual shipping icon representation for "自" (from/origin point) based on: 这批货自上海运来 -->
  <g transform="translate(0, 10)">
    <!-- Map grid / background horizon line -->
    <line x1="40" y1="160" x2="200" y2="160" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Origin point pin (Shanghai / "自") -->
    <g transform="translate(90, 130)">
      <!-- Radar ping / Origin waves -->
      <ellipse cx="0" cy="20" rx="18" ry="7" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="0" cy="20" rx="30" ry="12" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.2"/>
      
      <!-- Location Pin shape -->
      <path d="M0 -15 C-12 -15 -20 -7 -20 3 C-20 15 0 30 0 30 C0 30 20 15 20 3 C20 -7 12 -15 0 -15 Z" fill="#F59E0B"/>
      <!-- Inner core circle -->
      <circle cx="0" cy="0" r="7" fill="#1A1D24"/>
      <!-- Origin dot -->
      <circle cx="0" cy="0" r="3.5" fill="#F59E0B"/>
    </g>

    <!-- Destination point marker -->
    <g transform="translate(170, 100)" opacity="0.5">
      <path d="M0 -10 C-8 -10 -14 -4 -14 2 C-14 10 0 20 0 20 C0 20 14 10 14 2 C14 -4 8 -10 0 -10 Z" fill="#64748B"/>
      <circle cx="0" cy="0" r="4" fill="#1A1D24"/>
    </g>

    <!-- Curved trajectory path (From -> To) -->
    <path d="M 95 130 Q 130 70 165 95" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

    <!-- Cargo Box moving along path -->
    <g transform="translate(122, 85)">
      <!-- Box shadow -->
      <ellipse cx="0" cy="18" rx="12" ry="4" fill="#000000" opacity="0.3"/>
      <!-- 3D Shipping Box -->
      <path d="M -12 -2 L 0 -8 L 12 -2 L 0 4 Z" fill="#3B82F6"/>
      <path d="M -12 -2 L 0 4 L 0 16 L -12 10 Z" fill="#2563EB"/>
      <path d="M 12 -2 L 0 4 L 0 16 L 12 10 Z" fill="#1D4ED8"/>
    </g>
  </g>
</svg>