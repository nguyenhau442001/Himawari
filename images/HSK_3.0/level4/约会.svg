<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Romantic Midnight Date Sky -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Candle Glow -->
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- String Light Bulb Glow -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Heart Glow Filter -->
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ==================== BACKGROUND: ROMANTIC EVENING ==================== -->

  <!-- Crescent Moon in Night Sky -->
  <path d="M 196 28 A 13 13 0 1 0 208 45 A 10 10 0 1 1 196 28 Z" fill="#fef08a" opacity="0.95"/>

  <!-- Twinkling Night Stars -->
  <circle cx="36" cy="44" r="1.2" fill="#ffffff" opacity="0.85"/>
  <circle cx="76" cy="30" r="1.4" fill="#fef08a" opacity="0.9"/>
  <circle cx="162" cy="22" r="1.2" fill="#38bdf8" opacity="0.85"/>
  <circle cx="218" cy="68" r="1.3" fill="#ffffff" opacity="0.8"/>
  <circle cx="26" cy="88" r="1.1" fill="#fef08a" opacity="0.75"/>
  <circle cx="95" cy="52" r="1" fill="#ffffff" opacity="0.7"/>

  <!-- Elegant Terrace Balcony Railing Silhouette -->
  <line x1="15" y1="126" x2="225" y2="126" stroke="#1e293b" stroke-width="2.5" opacity="0.7"/>
  <line x1="35" y1="126" x2="35" y2="155" stroke="#1e293b" stroke-width="1.8" opacity="0.5"/>
  <line x1="75" y1="126" x2="75" y2="155" stroke="#1e293b" stroke-width="1.8" opacity="0.5"/>
  <line x1="165" y1="126" x2="165" y2="155" stroke="#1e293b" stroke-width="1.8" opacity="0.5"/>
  <line x1="205" y1="126" x2="205" y2="155" stroke="#1e293b" stroke-width="1.8" opacity="0.5"/>

  <!-- Distant City Lights / Bokeh circles in deep background -->
  <circle cx="50" cy="116" r="12" fill="#fbbf24" opacity="0.06"/>
  <circle cx="190" cy="114" r="14" fill="#f43f5e" opacity="0.05"/>
  <circle cx="120" cy="112" r="18" fill="#38bdf8" opacity="0.04"/>

  <!-- Festoon Fairy String Lights across the terrace -->
  <path d="M 8 18 Q 65 34 120 20 Q 175 34 232 16" fill="none" stroke="#475569" stroke-width="1.5"/>

  <circle cx="38" cy="26" r="7" fill="url(#lightGlow)"/>
  <circle cx="38" cy="26" r="3" fill="#fef08a"/>

  <circle cx="88" cy="28" r="7" fill="url(#lightGlow)"/>
  <circle cx="88" cy="28" r="3" fill="#fef08a"/>

  <circle cx="152" cy="28" r="7" fill="url(#lightGlow)"/>
  <circle cx="152" cy="28" r="3" fill="#fef08a"/>

  <circle cx="202" cy="23" r="7" fill="url(#lightGlow)"/>
  <circle cx="202" cy="23" r="3" fill="#fef08a"/>

  <!-- Floating Romantic Hearts between the Dating Couple -->
  <g filter="url(#heartGlow)">
    <path d="M 120 68 C 120 62 113 58 108 63 C 102 68 107 76 120 84 C 133 76 138 68 132 63 C 127 58 120 62 120 68 Z" fill="#f43f5e" opacity="0.95"/>
  </g>
  <path d="M 104 88 C 104 84 99 81 96 84 C 92 87 95 93 104 98 C 113 93 116 87 112 84 C 109 81 104 84 104 88 Z" fill="#fb7185" opacity="0.75"/>
  <path d="M 136 86 C 136 82 133 80 131 82 C 128 85 130 89 136 94 C 142 89 144 85 141 82 C 139 80 136 82 136 86 Z" fill="#fb7185" opacity="0.7"/>

  <!-- Romantic Sparkles floating in the air -->
  <circle cx="106" cy="58" r="1.2" fill="#fde047" opacity="0.85"/>
  <circle cx="134" cy="60" r="1.3" fill="#fde047" opacity="0.85"/>

  <!-- ==================== CHARACTERS (THE DATING COUPLE) ==================== -->

  <!-- Left: Boy on Date -->
  <g id="boy-dating">
    <!-- Torso / Smart Teal Sweater with natural curved shoulders -->
    <path d="M 34 142 C 40 130 65 128 72 136 L 78 185 L 28 185 Z" fill="#0d9488"/>

    <!-- Head & Neck -->
    <rect x="49" y="118" width="8" height="10" fill="#fcd34d"/>
    <circle cx="53" cy="113" r="14" fill="#fde68a"/>

    <!-- Hair (Stylish side parting) -->
    <path d="M 39 112 C 46 96 64 100 69 104 C 69 114 62 108 52 108 C 44 108 39 112 39 112 Z" fill="#1e293b"/>

    <!-- Eyes (Happy curved eyes looking at date) -->
    <path d="M 48 113 Q 51 116 54 113" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 56 113 Q 59 116 62 113" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Sweet Smile & Rosy Blush -->
    <path d="M 52 119 Q 55 122 58 119" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="47" cy="117" r="2.8" fill="#f43f5e" opacity="0.4"/>
    <circle cx="63" cy="117" r="2.8" fill="#f43f5e" opacity="0.4"/>

    <!-- Arm reaching forward towards center to clink glass -->
    <path d="M 64 142 Q 88 144 108 135" fill="none" stroke="#0d9488" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="109" cy="134" r="3.5" fill="#fcd34d"/>

    <!-- Wine Glass (Left) -->
    <line x1="110" y1="135" x2="110" y2="147" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="110" cy="147" rx="3.5" ry="1.5" fill="#cbd5e1"/>
    <!-- Bowl tilted slightly towards center -->
    <path d="M 106 125 C 106 136 116 136 116 125 Z" fill="#991b1b"/>
    <path d="M 106 125 C 106 137 116 137 116 125 Z" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M 107 128 C 107 134 115 134 115 128 Z" fill="#e11d48"/>
  </g>

  <!-- Right: Girl on Date -->
  <g id="girl-dating">
    <!-- Long flowing hair behind shoulder -->
    <path d="M 175 110 Q 200 98 202 118 Q 204 136 196 156 Q 190 140 188 126 Z" fill="#334155"/>

    <!-- Torso / Elegant Rose Dress with curved shoulders -->
    <path d="M 206 142 C 200 130 175 128 168 136 L 162 185 L 212 185 Z" fill="#ec4899"/>

    <!-- Head & Neck -->
    <rect x="183" y="118" width="8" height="10" fill="#fcd34d"/>
    <circle cx="187" cy="113" r="14" fill="#fde68a"/>

    <!-- Hair (Graceful front bangs with hair clip) -->
    <path d="M 200 110 Q 188 96 174 104 Q 170 112 173 123 Q 176 110 188 106 Q 198 106 200 110 Z" fill="#334155"/>
    <circle cx="197" cy="106" r="2.8" fill="#fb7185"/>

    <!-- Eyes (Happy curved eyes looking at date) -->
    <path d="M 178 113 Q 181 116 184 113" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 186 113 Q 189 116 192 113" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Sweet Smile & Rosy Blush -->
    <path d="M 182 119 Q 185 122 188 119" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="177" cy="117" r="2.8" fill="#f43f5e" opacity="0.4"/>
    <circle cx="193" cy="117" r="2.8" fill="#f43f5e" opacity="0.4"/>

    <!-- Arm reaching forward towards center to clink glass -->
    <path d="M 176 142 Q 152 144 132 135" fill="none" stroke="#ec4899" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="131" cy="134" r="3.5" fill="#fcd34d"/>

    <!-- Wine Glass (Right) -->
    <line x1="130" y1="135" x2="130" y2="147" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="130" cy="147" rx="3.5" ry="1.5" fill="#cbd5e1"/>
    <!-- Bowl tilted slightly towards center -->
    <path d="M 124 125 C 124 136 134 136 134 125 Z" fill="#991b1b"/>
    <path d="M 124 125 C 124 137 134 137 134 125 Z" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M 125 128 C 125 134 133 134 133 128 Z" fill="#e11d48"/>
  </g>

  <!-- Clinking Glasses Cheers Sparkle! Right between the two glasses -->
  <circle cx="120" cy="128" r="2" fill="#ffffff"/>
  <path d="M 120 122 L 120 134 M 114 128 L 126 128" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ==================== INTIMATE DINNER TABLE ==================== -->

  <!-- Table Floor Shadow -->
  <ellipse cx="120" cy="220" rx="44" ry="7" fill="#090d16" opacity="0.8"/>

  <!-- Pedestal Center Column & Foot -->
  <rect x="117" y="178" width="6" height="40" rx="2" fill="#334155"/>
  <path d="M 100 218 L 140 218" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- Round Dining Table Top -->
  <ellipse cx="120" cy="178" rx="68" ry="19" fill="url(#tableGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Table Runner / Center Mat -->
  <ellipse cx="120" cy="177" rx="52" ry="13" fill="#1e293b" opacity="0.6"/>

  <!-- Warm Candle Light Pool on Table -->
  <circle cx="120" cy="164" r="32" fill="url(#candleGlow)"/>

  <!-- Centerpiece: Glowing Candle in Glass Holder -->
  <rect x="114" y="161" width="12" height="15" rx="2" fill="#cbd5e1" opacity="0.35" stroke="#94a3b8" stroke-width="1"/>
  <rect x="116" y="165" width="8" height="10" rx="1" fill="#f8fafc"/>
  <path d="M 120 156 C 117 160 117 163 120 165 C 123 163 123 160 120 156 Z" fill="#fbbf24"/>
  <circle cx="120" cy="162" r="2" fill="#fef08a"/>

  <!-- Single Romantic Red Rose in Bud Vase -->
  <g id="table-rose" transform="translate(98, 157)">
    <path d="M 2 16 L 6 16 L 5 10 L 3 10 Z" fill="#e2e8f0" opacity="0.6"/>
    <!-- Stem & Leaves -->
    <path d="M 4 10 Q 5 4 3 0" fill="none" stroke="#10b981" stroke-width="1.4"/>
    <path d="M 4 6 Q 8 5 7 3 Q 4 4 4 6 Z" fill="#059669"/>
    <!-- Red Rose Blossom -->
    <circle cx="3" cy="-1" r="4.5" fill="#e11d48"/>
    <path d="M 0 -2 Q 3 -5 6 -2 Q 5 2 3 3 Q 0 2 0 -2 Z" fill="#f43f5e"/>
    <circle cx="3" cy="-1" r="2" fill="#be123c"/>
  </g>

  <!-- Dessert Plate with Sweet Strawberry Tart -->
  <ellipse cx="142" cy="174" rx="8" ry="3.5" fill="#f8fafc"/>
  <circle cx="142" cy="173" r="2.2" fill="#f43f5e"/>
  <circle cx="142" cy="172" r="1" fill="#fecdd3"/>
</svg>