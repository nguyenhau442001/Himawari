<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing digital network flow -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>
  <path d="M70 120 Q120 70 170 120" stroke="#2F3646" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Left message card (Source) -->
  <g transform="translate(45, 95)">
    <!-- Card background -->
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#2A303C" stroke="#3A4254" stroke-width="1.5"/>
    <!-- Message lines inside source card -->
    <rect x="10" y="14" width="22" height="4" rx="2" fill="#64748B"/>
    <rect x="10" y="24" width="30" height="4" rx="2" fill="#475569"/>
    <rect x="10" y="34" width="16" height="4" rx="2" fill="#475569"/>
  </g>
  
  <!-- Right message card (Destination / Forwarded) -->
  <g transform="translate(145, 95)">
    <!-- Card background -->
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#252D3D" stroke="#00C853" stroke-width="1.5"/>
    <!-- Message lines inside destination card -->
    <rect x="10" y="14" width="22" height="4" rx="2" fill="#A0AEC0"/>
    <rect x="10" y="24" width="30" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="10" y="34" width="16" height="4" rx="2" fill="#CBD5E1"/>
    <!-- Tiny success checkmark badge -->
    <circle cx="42" cy="8" r="7" fill="#00C853"/>
    <path d="M39 8 L41 10 L45 6" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Central Dynamic Forwarding Arrow (The Physical Object of Transfer) -->
  <g transform="translate(120, 120)">
    <!-- Outer glow for focus -->
    <circle cx="0" cy="0" r="26" fill="#1A1D24" stroke="#FF9800" stroke-width="2" stroke-opacity="0.3"/>
    <!-- Main circular button container -->
    <circle cx="0" cy="0" r="22" fill="#FF9800"/>
    
    <!-- Sleek dual curved forwarding arrows icon -->
    <path d="M-8 -5 C -2 -12, 6 -10, 10 -4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M5 -9 L10 -4 L5 1" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <path d="M8 5 C 2 12, -6 10, -10 4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-5 9 L-10 4 L-5 -1" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Motion particles representing transfer in action -->
  <circle cx="95" cy="108" r="2" fill="#FF9800" opacity="0.8"/>
  <circle cx="103" cy="113" r="3.5" fill="#FF9800"/>
  <circle cx="137" cy="127" r="3.5" fill="#FF9800"/>
  <circle cx="145" cy="132" r="2" fill="#FF9800" opacity="0.8"/>
</svg>