<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Base platform / tray representing the object/item added onto -->
    <path d="M 60,150 L 180,150 C 185,150 188,153 188,157 C 188,161 185,164 180,164 L 60,164 C 55,164 52,161 52,157 C 52,153 55,150 60,150 Z" fill="#2E3440" />
    <path d="M 80,164 L 160,164 L 155,178 C 155,181 152,183 148,183 L 92,183 C 88,183 85,181 85,178 Z" fill="#4C566A" />

    <!-- Primary object resting on the base (representing the initial item/condition) -->
    <rect x="85" y="105" width="70" height="45" rx="6" fill="#434C5E" />
    <rect x="95" y="115" width="50" height="25" rx="4" fill="#3B4252" />

    <!-- Dotted motion / addition trajectory arcs (visualizing "adding/supplementing") -->
    <path d="M 120,50 C 145,50 165,70 165,95" fill="none" stroke="#D08770" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round" />
    <path d="M 120,40 C 155,40 180,65 180,100" fill="none" stroke="#D08770" stroke-width="2" stroke-dasharray="3,5" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- Added object descending (representing '加上' - the extra item added on top) -->
    <g transform="translate(0, -10)">
      <!-- Drop shadow for the falling/added object -->
      <ellipse cx="120" cy="115" rx="22" ry="6" fill="#000000" opacity="0.3"/>
      
      <!-- The additional physical item being added -->
      <rect x="92" y="70" width="56" height="36" rx="6" fill="#EBCB8B" />
      <!-- Detail on the added item -->
      <circle cx="120" cy="88" r="8" fill="#D08770" />
      <path d="M 116,88 L 124,88 M 120,84 L 120,92" stroke="#E5E9F0" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Clear "+" Action Indicator floating above to emphasize the semantic meaning of adding -->
    <circle cx="120" cy="45" r="14" fill="#5E81AC" />
    <path d="M 120,38 L 120,52 M 113,45 L 127,45" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>