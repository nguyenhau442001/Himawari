<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Left character (Person A) -->
  <g transform="translate(40, 80)">
    <circle cx="40" cy="30" r="20" fill="#FFB86C"/>
    <path d="M20 120 C 20 80, 60 80, 60 120 L 60 180 L 20 180 Z" fill="#6272A4"/>
  </g>
  
  <!-- Right character (Person B) -->
  <g transform="translate(140, 80)">
    <circle cx="40" cy="30" r="20" fill="#FFB86C"/>
    <path d="M20 120 C 20 80, 60 80, 60 120 L 60 180 L 20 180 Z" fill="#6272A4"/>
  </g>
  
  <!-- The space between (The visual representation of "Between") -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="40" height="60" rx="4" fill="none" stroke="#FFB86C" stroke-width="4" stroke-dasharray="8 8"/>
    <line x1="20" y1="0" x2="20" y2="60" stroke="#FFB86C" stroke-width="2"/>
    <path d="M10 20 L 30 30 L 10 40" fill="none" stroke="#FFB86C" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Ground line -->
  <line x1="40" y1="200" x2="200" y2="200" stroke="#44475A" stroke-width="2"/>
</svg>