<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glow/Background effect for focus -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Browser Window Object -->
  <g transform="translate(45, 60)">
    <!-- Window Outer Frame -->
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#2E3846" stroke="#48556A" stroke-width="2"/>
    
    <!-- Title Bar -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 140 0 A 10 10 0 0 1 150 10 L 150 28 L 0 28 Z" fill="#212833"/>
    
    <!-- Window Control Dots -->
    <circle cx="15" cy="14" r="3" fill="#FF5F56"/>
    <circle cx="27" cy="14" r="3" fill="#FFBD2E"/>
    <circle cx="39" cy="14" r="3" fill="#27C93F"/>
    
    <!-- Address Bar (URL Bar) -->
    <rect x="52" y="7" width="86" height="14" rx="7" fill="#1A1D24"/>
    
    <!-- Globe/Web Icon inside Address Bar -->
    <circle cx="61" cy="14" r="4" fill="none" stroke="#F39C12" stroke-width="1.5"/>
    <path d="M 57 14 H 65 M 61 10 C 62.5 11.5 62.5 16.5 61 18 C 59.5 16.5 59.5 11.5 61 10" fill="none" stroke="#F39C12" stroke-width="1.5"/>
    
    <!-- URL text placeholder lines -->
    <line x1="70" y1="14" x2="128" y2="14" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>

    <!-- Content Area (Webpage Content) -->
    <!-- Document Header graphic -->
    <rect x="15" y="44" width="70" height="8" rx="4" fill="#48556A"/>
    
    <!-- Paragraph lines -->
    <rect x="15" y="60" width="120" height="4" rx="2" fill="#3A4656"/>
    <rect x="15" y="70" width="100" height="4" rx="2" fill="#3A4656"/>
    <rect x="15" y="80" width="110" height="4" rx="2" fill="#3A4656"/>
    
    <!-- Image placeholder graphic -->
    <circle cx="120" cy="85" r="10" fill="#48556A"/>
  </g>

  <!-- Highlight accent badge (Cursor pointer clicking the address bar) -->
  <g transform="translate(130, 60)">
    <path d="M 0 0 L 12 18 L 7 19 L 4 25 L 1 23 L 4 17 L 0 16 Z" fill="#F39C12" stroke="#1A1D24" stroke-width="1.5"/>
  </g>
</svg>