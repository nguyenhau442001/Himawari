<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <g id="daliang-books">
    <!-- Tall vertical stack of books (representing "large quantity" of books based on context) -->
    <!-- Book 1 (Bottom) -->
    <path d="M70 185 L170 185 L165 200 L65 200 Z" fill="#3A4660"/>
    <rect x="65" y="172" width="105" height="13" rx="2" fill="#E67E22"/>
    <path d="M75 178 H160" stroke="#B95C10" stroke-width="2" stroke-linecap="round"/>

    <!-- Book 2 -->
    <path d="M72 170 L168 170 L164 183 L68 183 Z" fill="#2C3E50"/>
    <rect x="68" y="158" width="100" height="12" rx="2" fill="#3498DB"/>
    <line x1="80" y1="164" x2="110" y2="164" stroke="#2980B9" stroke-width="2" stroke-linecap="round"/>

    <!-- Book 3 -->
    <path d="M75 156 L165 156 L162 168 L78 168 Z" fill="#4E5D6C"/>
    <rect x="73" y="145" width="94" height="11" rx="2" fill="#E74C3C"/>
    <circle cx="85" cy="150.5" r="2" fill="#C0392B"/>

    <!-- Book 4 -->
    <path d="M78 143 L162 143 L159 154 L81 154 Z" fill="#3A4660"/>
    <rect x="77" y="132" width="86" height="11" rx="2" fill="#2ECC71"/>
    <line x1="90" y1="137" x2="130" y2="137" stroke="#27AE60" stroke-width="2" stroke-linecap="round"/>

    <!-- Book 5 -->
    <path d="M80 130 L160 130 L157 141 L83 141 Z" fill="#2C3E50"/>
    <rect x="80" y="119" width="80" height="11" rx="2" fill="#F1C40F"/>
    
    <!-- Book 6 -->
    <path d="M83 117 L157 117 L155 128 L85 128 Z" fill="#4E5D6C"/>
    <rect x="83" y="107" width="74" height="10" rx="2" fill="#9B59B6"/>

    <!-- Book 7 -->
    <path d="M86 105 L154 105 L152 115 L88 115 Z" fill="#3A4660"/>
    <rect x="86" y="95" width="68" height="10" rx="2" fill="#E67E22"/>

    <!-- Book 8 -->
    <path d="M90 93 L150 93 L148 103 L92 103 Z" fill="#2C3E50"/>
    <rect x="90" y="84" width="60" height="9" rx="2" fill="#3498DB"/>

    <!-- Book 9 (Top) -->
    <path d="M94 82 L146 82 L144 91 L96 91 Z" fill="#4E5D6C"/>
    <rect x="94" y="73" width="52" height="9" rx="2" fill="#E74C3C"/>

    <!-- Open book gracefully resting on top or beside to emphasize reading context -->
    <path d="M 60 203 C 60 198, 85 195, 120 198 C 155 195, 180 198, 180 203 C 180 208, 155 212, 120 210 C 85 212, 60 208, 60 203 Z" fill="#ECF0F1"/>
    <!-- Center spine / page divider -->
    <line x1="120" y1="198" x2="120" y2="210" stroke="#BDC3C7" stroke-width="1.5"/>
    <!-- Left page lines -->
    <line x1="75" y1="202" x2="105" y2="203" stroke="#BDC3C7" stroke-width="1" stroke-linecap="round"/>
    <line x1="80" y1="205" x2="100" y2="206" stroke="#BDC3C7" stroke-width="1" stroke-linecap="round"/>
    <!-- Right page lines -->
    <line x1="135" y1="203" x2="165" y2="202" stroke="#BDC3C7" stroke-width="1" stroke-linecap="round"/>
    <line x1="140" y1="206" x2="160" y2="205" stroke="#BDC3C7" stroke-width="1" stroke-linecap="round"/>

    <!-- Visual indicators of "Large Quantity" (Upward floating glowing particles / energy accentuating height & mass) -->
    <circle cx="120" cy="55" r="3.5" fill="#F39C12" opacity="0.9"/>
    <circle cx="120" cy="55" r="7" fill="#F39C12" opacity="0.3"/>
    
    <circle cx="95" cy="62" r="2" fill="#3498DB" opacity="0.8"/>
    <circle cx="145" cy="62" r="2.5" fill="#2ECC71" opacity="0.8"/>
    
    <circle cx="80" cy="75" r="1.5" fill="#F1C40F" opacity="0.7"/>
    <circle cx="160" cy="75" r="2" fill="#E74C3C" opacity="0.7"/>

    <!-- Subtle upward arrows framing the tall stack to indicate "大量" (large amount / volume) -->
    <path d="M 45 150 L 40 160 L 50 160 Z" fill="#F39C12" opacity="0.8"/>
    <line x1="45" y1="160" x2="45" y2="185" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 45 110 L 40 120 L 50 120 Z" fill="#F39C12" opacity="0.8"/>
    <line x1="45" y1="120" x2="45" y2="145" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <path d="M 195 150 L 190 160 L 200 160 Z" fill="#F39C12" opacity="0.8"/>
    <line x1="195" y1="160" x2="195" y2="185" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 195 110 L 190 120 L 200 120 Z" fill="#F39C12" opacity="0.8"/>
    <line x1="195" y1="120" x2="195" y2="145" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>