<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "省" (Noun: Province / Địa điểm hành chính) -->
  <g transform="translate(0, 0)">
    <!-- Map Region / Territory Base (Stylized Province shape) -->
    <path d="M 75 140 C 70 110, 85 90, 110 80 C 135 70, 170 85, 175 110 C 180 135, 160 160, 135 170 C 110 180, 80 170, 75 140 Z" fill="#242B38" stroke="#3A465B" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Internal territory regions / borders -->
    <path d="M 110 80 L 125 120 L 160 110" fill="none" stroke="#3A465B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 125 120 L 135 170" fill="none" stroke="#3A465B" stroke-width="2" stroke-linecap="round"/>

    <!-- Accent highlight for territorial core / capital -->
    <path d="M 95 115 C 92 105, 105 95, 118 102 C 125 106, 120 122, 110 125 C 100 128, 97 122, 95 115 Z" fill="#2E394D"/>

    <!-- Capital City Map Pin (Focal Point) -->
    <g transform="translate(120, 95)">
      <!-- Pin Drop Shadow -->
      <ellipse cx="0" cy="38" rx="5" ry="2" fill="#101319"/>
      
      <!-- Pin Body -->
      <path d="M 0 35 C 0 35, -12 18, -12 10 C -12 3, -6 0, 0 0 C 6 0, 12 3, 12 10 C 12 18, 0 35, 0 35 Z" fill="#F59E0B"/>
      
      <!-- Inner White Dot -->
      <circle cx="0" cy="10" r="4.5" fill="#1A1D24"/>
    </g>

    <!-- Secondary Location Marker (Sub-city/District) -->
    <g transform="translate(150, 135)">
      <circle cx="0" cy="0" r="5" fill="#3B82F6"/>
      <circle cx="0" cy="0" r="2" fill="#1A1D24"/>
    </g>

    <!-- Secondary Location Marker -->
    <g transform="translate(90, 145)">
      <circle cx="0" cy="0" r="5" fill="#3B82F6"/>
      <circle cx="0" cy="0" r="2" fill="#1A1D24"/>
    </g>

    <!-- Connecting route line -->
    <path d="M 90 145 L 120 95 L 150 135" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Decorative Geographic / Compass Accent in corner -->
    <g transform="translate(195, 45)" opacity="0.8">
      <circle cx="0" cy="0" r="14" fill="#242B38" stroke="#3A465B" stroke-width="2"/>
      <polygon points="0,-9 3,-2 0,5 -3,-2" fill="#F59E0B"/>
      <polygon points="0,9 3,2 0,-5 -3,2" fill="#64748B"/>
    </g>

    <!-- Scale / Boundary marker element -->
    <g transform="translate(45, 185)" opacity="0.7">
      <rect x="0" y="0" width="30" height="4" rx="2" fill="#3A465B"/>
      <rect x="35" y="0" width="30" height="4" rx="2" fill="#3A465B"/>
      <rect x="70" y="0" width="30" height="4" rx="2" fill="#3A465B"/>
    </g>
  </g>
</svg>