<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background atmospheric glow/cold frost gradient -->
  <circle cx="120" cy="110" r="70" fill="#223048" opacity="0.6"/>

  <!-- Falling Snowflakes in the background -->
  <g fill="#A4C2F4" opacity="0.4">
    <path d="M70,60 L70,70 M65,65 L75,65 M67,62 L73,68 M67,68 L73,62" stroke="#A4C2F4" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M175,80 L175,88 M171,84 L179,84" stroke="#A4C2F4" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M85,150 L85,156 M82,153 L88,153" stroke="#A4C2F4" stroke-width="1" stroke-linecap="round"/>
    <circle cx="155" cy="50" r="1.5"/>
    <circle cx="60" cy="110" r="1"/>
    <circle cx="180" cy="140" r="1.5"/>
  </g>

  <!-- Central Physical Object: Modern Outdoor Thermometer mounted on a snowy wall/post -->
  <!-- Mounting bracket / backing -->
  <rect x="106" y="45" width="28" height="135" rx="14" fill="#2E384D"/>

  <!-- Thermometer Glass Tube Outer -->
  <rect x="115" y="55" width="10" height="110" rx="5" fill="#11151C"/>
  <rect x="117" y="57" width="6" height="85" rx="3" fill="#1A2230"/>

  <!-- Bulb at bottom -->
  <circle cx="120" cy="155" r="12" fill="#11151C"/>
  <circle cx="120" cy="155" r="9" fill="#FF5C5C"/>

  <!-- Mercury Level: Staying completely in the negative zone (below 0 level) -->
  <!-- 0 level marker is roughly at y = 100. Mercury fills only from y = 115 to 155 (below zero) -->
  <rect x="117" y="115" width="6" height="40" rx="3" fill="#3B82F6"/>

  <!-- Temperature Scale Ticks & Labels (Visual lines) -->
  <g stroke="#8FA3BF" stroke-width="2" stroke-linecap="round">
    <!-- Above Zero Ticks (Inactive/Empty) -->
    <line x1="128" y1="70" x2="134" y2="70" opacity="0.3"/>
    <line x1="128" y1="85" x2="134" y2="85" opacity="0.3"/>
    
    <!-- Zero Line (Distinct marker) -->
    <line x1="126" y1="100" x2="137" y2="100" stroke="#E2E8F0" stroke-width="2.5"/>
    
    <!-- Below Zero Ticks (Active/Cold zone) -->
    <line x1="128" y1="115" x2="134" y2="115" stroke="#60A5FA" stroke-width="2"/>
    <line x1="128" y1="130" x2="134" y2="130" stroke="#60A5FA" stroke-width="2"/>
    <line x1="128" y1="145" x2="134" y2="145" stroke="#60A5FA" stroke-width="2"/>
  </g>

  <!-- Frost / Ice crystals framing the bottom and thermometer -->
  <path d="M 95 190 Q 110 180 120 190 Q 130 180 145 190 L 145 195 L 95 195 Z" fill="#E2E8F0" opacity="0.15"/>
  <path d="M 45 195 L 195 195 L 195 198 L 45 198 Z" fill="#2E384D" rx="1.5"/>

  <!-- Icicles hanging from top cap of thermometer -->
  <path d="M115,55 L118,67 L121,55 Z" fill="#60A5FA" opacity="0.8"/>
  <path d="M123,55 L125,63 L127,55 Z" fill="#60A5FA" opacity="0.8"/>

  <!-- Negative indicator arrow / cold aura accent pointing downward into the bulb -->
  <g stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 88 125 L 80 135 L 88 145"/>
    <path d="M 80 135 L 102 135"/>
  </g>

  <!-- Highlight accent badge (Minimalist frost crystal representing sub-zero state) -->
  <g transform="translate(165, 105)" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-12" x2="0" y2="12"/>
    <line x1="-10" y1="-6" x2="10" y2="6"/>
    <line x1="-10" y1="6" x2="10" y2="-6"/>
    <circle cx="0" cy="0" r="3" fill="#1A1D24"/>
  </g>
</svg>