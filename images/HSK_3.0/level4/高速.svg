<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Curving elevated highway structure conveying high speed/scale contrast -->
    <path d="M 30 180 Q 120 180 140 120 T 210 50" fill="none" stroke="#2A303C" stroke-width="36" stroke-linecap="round"/>
    <path d="M 30 180 Q 120 180 140 120 T 210 50" fill="none" stroke="#3E4756" stroke-width="28" stroke-linecap="round"/>
    
    <!-- High speed motion blurs (orange/gold accent) -->
    <path d="M 45 185 Q 125 185 145 125 T 195 55" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 60 175 Q 115 175 135 115 T 185 45" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 20 180 Q 120 180 138 122 T 215 52" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="8 12" stroke-linecap="round"/>

    <!-- Scale exaggeration: Sleek modern vehicle zoomed into focus at the top right -->
    <g transform="translate(170, 48) rotate(-40)">
      <!-- Car body -->
      <rect x="-18" y="-9" width="36" height="18" rx="7" fill="#F59E0B"/>
      <!-- Windshield -->
      <path d="M -6 -8 L 4 -8 L 8 8 L -6 8 Z" fill="#1A1D24" opacity="0.8"/>
      <!-- Speed streaks behind vehicle -->
      <line x1="-22" y1="-4" x2="-35" y2="-4" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="-25" y1="2" x2="-42" y2="2" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-20" y1="7" x2="-30" y2="7" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Secondary small background vehicle to emphasize contrast -->
    <g transform="translate(65, 175) scale(0.55) rotate(-5)">
      <rect x="-18" y="-9" width="36" height="18" rx="7" fill="#64748B"/>
      <path d="M -6 -8 L 4 -8 L 8 8 L -6 8 Z" fill="#1A1D24" opacity="0.6"/>
    </g>

    <!-- Scenic speed lines cutting across the background -->
    <line x1="110" y1="95" x2="145" y2="85" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="125" y1="75" x2="155" y2="65" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>