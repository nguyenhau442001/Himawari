<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Lamp Cone -->
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Projector Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Office Interior -->
  <!-- Wall panels & Architecture -->
  <rect x="20" y="20" width="200" height="150" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  
  <!-- Large Window with City Skyline Silhouette -->
  <path d="M150,30 L200,30 L200,120 L150,120 Z" fill="#0f172a" />
  <!-- Skyline inside window -->
  <path d="M155,120 L155,90 L162,90 L162,120 L168,120 L168,70 L176,70 L176,120 L184,120 L184,80 L195,80 L195,120 Z" fill="#1e293b" />
  <!-- Window Light Beam -->
  <polygon points="175,30 210,170 120,170" fill="url(#window-light)" />

  <!-- Presentation/Whiteboard on Wall showing a bold upward trend (Decisiveness/魄力) -->
  <rect x="40" y="35" width="80" height="55" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <rect x="46" y="42" width="68" height="35" rx="2" fill="#1e293b" />
  <!-- Upward Trend Chart Lines -->
  <polyline points="52,68 68,62 84,52 108,46" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="108" cy="46" r="3" fill="#10b981" />
  <polygon points="108,40 114,46 106,48" fill="#10b981" />
  <!-- Screen Glow Effect -->
  <rect x="46" y="42" width="68" height="35" rx="2" fill="url(#screen-glow)" />

  <!-- Bookshelf / Props on left -->
  <rect x="24" y="95" width="20" height="60" fill="#334155" rx="1" />
  <rect x="27" y="100" width="14" height="4" fill="#fb923c" />
  <rect x="27" y="106" width="14" height="6" fill="#38bdf8" />
  <rect x="27" y="114" width="14" height="5" fill="#ec4899" />

  <!-- Office Desk -->
  <rect x="30" y="165" width="180" height="12" rx="3" fill="#334155" filter="url(#soft-shadow)" />
  <rect x="45" y="177" width="10" height="43" fill="#1e293b" />
  <rect x="185" y="177" width="10" height="43" fill="#1e293b" />
  <!-- Desk Floor Base -->
  <rect x="0" y="215" width="240" height="25" fill="#0b0f19" />

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M60,165 L95,165 L100,162 L55,162 Z" fill="#94a3b8" />
  <path d="M62,138 L93,138 C94.5,138 95,139.5 95,141 L93,164 C93,164.5 92.5,165 92,165 L63,165 C62.5,165 62,164.5 62,164 L60,141 C60,139.5 60.5,138 62,138 Z" fill="#64748b" />
  <rect x="65" y="141" width="26" height="20" rx="1" fill="#0f172a" />
  <!-- Mini graphs on laptop screen -->
  <polyline points="68,155 74,150 80,153 88,144" fill="none" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Desk Lamp -->
  <path d="M175,165 L179,165 L181,135 L173,135 Z" fill="#475569" />
  <path d="M168,135 C168,130 184,130 184,135 Z" fill="#fbbf24" />
  <!-- Lamp light cone -->
  <polygon points="176,135 155,175 195,175" fill="url(#lamp-cone)" />

  <!-- Coffee Mug -->
  <rect x="145" y="152" width="10" height="13" rx="2" fill="#cbd5e1" />
  <path d="M155,155 C158,155 158,160 155,162" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- MAIN CHARACTER: Decisive Leader / Professional showing "魄力" (Decisiveness, Bold Action) -->
  <!-- Character Body / Suit -->
  <!-- Torso leaning forward decisively -->
  <path d="M100,170 C100,150 115,135 125,130 L135,145 C135,145 145,160 148,170 Z" fill="#1e293b" filter="url(#soft-shadow)" />
  <!-- Crisp white shirt collar -->
  <polygon points="120,132 125,142 130,132" fill="#f8fafc" />
  <!-- Bold Red/Amber Tie (Signifies confidence and decisive energy) -->
  <polygon points="124,138 126,138 127,155 125,158 123,155" fill="#f59e0b" />

  <!-- Arms in a strong, decisive gesture (One hand firmly planted, one pointing forward/downward on table) -->
  <!-- Back Arm (supporting) -->
  <path d="M108,145 L95,155 L102,165" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Front Arm (Pointing / Striking table with resolve) -->
  <path d="M132,138 L150,150 L142,165" fill="none" stroke="#1e293b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand resting/pointing firmly on desk -->
  <circle cx="142" cy="165" r="5" fill="#f8d7da" /> <!-- Skin tone -->

  <!-- Neck -->
  <rect x="120" y="123" width="10" height="12" fill="#f8d7da" rx="3" />

  <!-- Head with confident expression -->
  <circle cx="125" cy="108" r="16" fill="#f8d7da" filter="url(#soft-shadow)" />
  
  <!-- Stylish Modern Hair (Dark Navy/Black) -->
  <path d="M110,108 C110,95 120,90 132,93 C140,95 141,105 141,110 C141,110 138,98 128,96 C118,94 112,102 110,108 Z" fill="#0f172a" />

  <!-- Facial Features (Determined, Focused eyes, strong eyebrows) -->
  <!-- Eyebrows angled sharply down for resolute look -->
  <polyline points="116,103 123,105" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <polyline points="128,105 135,103" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="120" cy="109" r="1.5" fill="#0f172a" />
  <circle cx="131" cy="109" r="1.5" fill="#0f172a" />
  <!-- Confident Smirk / Firm Mouth -->
  <path d="M123,116 Q126,118 130,115" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" />

  <!-- Action / Energy Effect Lines radiating from the hand strike (Depicting decisive impact/魄力) -->
  <path d="M148,162 L158,158" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M150,167 L162,168" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <path d="M146,171 L155,177" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

  <!-- Foreground plant for framing depth -->
  <path d="M0,230 Q10,200 25,240 Z" fill="#0f172a" />
  <path d="M5,240 Q18,210 35,235 Z" fill="#1e293b" />
</svg>