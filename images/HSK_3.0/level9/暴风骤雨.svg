<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background Gradient for Storm Sky -->
    <linearGradient id="stormBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242B38"/>
      <stop offset="100%" stop-color="#14171E"/>
    </linearGradient>
    
    <!-- Heavy Dark Rain Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    
    <!-- Sea Water Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
    
    <!-- Lightning Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="240" height="240" fill="url(#stormBg)"/>

  <!-- Dramatic Storm Background Elements -->
  <g opacity="0.3">
    <circle cx="180" cy="60" r="2" fill="#94A3B8"/>
    <circle cx="60" cy="50" r="1.5" fill="#94A3B8"/>
    <circle cx="90" cy="35" r="1" fill="#94A3B8"/>
    <circle cx="150" cy="40" r="1.5" fill="#94A3B8"/>
  </g>

  <!-- Lightning Bolt (暴风骤雨 - Sudden violent storm) -->
  <polygon points="135,45 110,95 130,95 105,145 155,85 130,85" fill="#FBBF24" filter="url(#glow)"/>

  <!-- Massive Storm Clouds -->
  <path d="M 40,90 
           C 40,65  70,55  90,75
           C 105,55 145,55  160,75
           C 185,70 210,90  200,115
           C 215,130 195,155 170,150
           L 50,150
           C 30,150 25,120  40,90 Z" 
        fill="url(#cloudGrad)"/>

  <!-- Torrential Rain (Diagonal heavy downpour) -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="50" y1="110" x2="30" y2="150" />
    <line x1="70" y1="100" x2="50" y2="140" />
    <line x1="90" y1="115" x2="70" y2="155" />
    <line x1="110" y1="105" x2="90" y2="145" />
    <line x1="130" y1="115" x2="110" y2="155" />
    <line x1="150" y1="100" x2="130" y2="140" />
    <line x1="170" y1="110" x2="150" y2="150" />
    <line x1="190" y1="105" x2="170" y2="145" />
    
    <!-- Secondary denser rain layer -->
    <line x1="60" y1="130" x2="40" y2="170" opacity="0.6"/>
    <line x1="100" y1="135" x2="80" y2="175" opacity="0.6"/>
    <line x1="140" y1="130" x2="120" y2="170" opacity="0.6"/>
    <line x1="180" y1="135" x2="160" y2="175" opacity="0.6"/>
  </g>

  <!-- Violent Waves (Sea / 暴风雨的海洋) -->
  <path d="M 20,170 
           Q 50,155 80,175 
           Q 110,195 140,170 
           Q 170,145 200,175
           Q 220,190 230,180
           L 230,220 
           L 20,220 Z" 
        fill="url(#seaGrad)"/>
        
  <!-- White Foam on Waves -->
  <path d="M 75,172 Q 80,168 85,173" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 135,173 Q 140,165 148,172" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 195,172 Q 202,165 208,175" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Foreground Splash / Heavy Water Impact -->
  <path d="M 90,160 Q 95,140 100,165" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 150,155 Q 158,135 162,160" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none"/>

</svg>