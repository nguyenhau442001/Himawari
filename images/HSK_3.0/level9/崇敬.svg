<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Podium Glow -->
    <linearGradient id="podium-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Character 1 (Speaker) Skin & Hair gradients -->
    <linearGradient id="speaker-jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Medal Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting / Spotlight Effect -->
  <circle cx="120" cy="80" r="110" fill="url(#spotlight)" />

  <!-- ENVIRONMENT: Stage & Backdrop -->
  <!-- Back Wall Panels / Architecture -->
  <path d="M40 180 L200 180 L220 220 L20 220 Z" fill="#1e293b" opacity="0.6" />
  <line x1="80" y1="50" x2="60" y2="180" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <line x1="160" y1="50" x2="180" y2="180" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- Stage Floor -->
  <polygon points="10,190 230,190 240,240 0,240" fill="#0f172a" />
  <polygon points="40,190 200,190 210,240 30,240" fill="#1e293b" />
  
  <!-- Podium -->
  <path d="M100 160 L140 160 L145 210 L95 210 Z" fill="#334155" filter="url(#shadow)" />
  <path d="M98 160 L142 160 L142 166 L98 166 Z" fill="#475569" />
  <!-- Podium Glow Band -->
  <rect x="106" y="175" width="28" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
  <polygon points="100,210 140,210 150,240 90,240" fill="url(#podium-glow)" opacity="0.5" />

  <!-- CENTRAL HERO SUBJECT: The Respected Person (Speaker at Podium) -->
  <g id="hero-speaker" transform="translate(0, 5)">
    <!-- Body / Torso -->
    <path d="M100 135 C100 120, 140 120, 140 135 L145 165 L95 165 Z" fill="url(#speaker-jacket)" />
    <!-- Shirt Collar & Tie -->
    <path d="M113 124 L120 138 L127 124 Z" fill="#ffffff" />
    <polygon points="119,132 121,132 122,152 118,152" fill="#ef4444" />
    
    <!-- Head & Neck -->
    <rect x="115" y="110" width="10" height="16" fill="#fbcfe8" rx="3" />
    <circle cx="120" cy="100" r="16" fill="#fbcfe8" filter="url(#shadow)" />
    
    <!-- Hair (Dignified mature styling) -->
    <path d="M104 98 C104 84, 136 84, 136 98 C136 98, 132 90, 120 90 C108 90, 104 98, 104 98 Z" fill="#334155" />
    
    <!-- Facial expression: Warm, confident smile -->
    <circle cx="114" cy="98" r="1.5" fill="#1e293b" />
    <circle cx="126" cy="98" r="1.5" fill="#1e293b" />
    <path d="M117 105 Q120 108 123 105" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M110 95 Q114 93 118 95" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M122 95 Q126 93 130 95" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Gestures: One hand holding podium, one slightly raised in gracious acceptance -->
    <path d="M96 145 C90 145, 88 155, 92 160" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M144 140 C152 140, 156 148, 152 155" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- AUDIENCE / ADMIRERS (Showing Respect: Clapping, Bowing, Gazing Upward) -->
  <!-- Character 2 (Left - Applauding & Gazing with Respect) -->
  <g id="admirer-left" transform="translate(-15, 20)">
    <!-- Torso -->
    <path d="M50 150 C50 135, 75 135, 75 150 L80 190 L45 190 Z" fill="#10b981" />
    <!-- Head tilted up admiringly -->
    <circle cx="62" cy="120" r="13" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M50 120 C50 108, 74 108, 74 120 C70 114, 54 114, 50 120 Z" fill="#78350f" />
    <!-- Face looking up-right -->
    <circle cx="68" cy="118" r="1.2" fill="#1e293b" />
    <path d="M66 125 Q69 127 72 124" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <!-- Hands clapping near chest -->
    <circle cx="62" cy="148" r="8" fill="#fed7aa" />
  </g>

  <!-- Character 3 (Right - Bowing / Hand on Heart in Respect) -->
  <g id="admirer-right" transform="translate(15, 20)">
    <!-- Torso leaning slightly forward -->
    <path d="M165 150 C165 135, 190 135, 190 150 L195 190 L160 190 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="178" cy="122" r="13" fill="#fbcfe8" />
    <!-- Hair bun -->
    <circle cx="186" cy="114" r="5" fill="#475569" />
    <path d="M166 124 C166 112, 190 112, 190 124 Z" fill="#475569" />
    <!-- Face expression (Eyes closed in deep respect/admiration) -->
    <path d="M182 120 Q185 122 188 120" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M174 125 Q178 127 182 125" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Hand placed over heart / chest -->
    <circle cx="178" cy="148" r="7" fill="#fbcfe8" />
  </g>

  <!-- Foreground Character 4 (Partial - Front Left, looking up with awe) -->
  <g id="admirer-foreground" transform="translate(-40, 45)">
    <path d="M45 160 C45 145, 75 145, 75 160 L80 200 L40 200 Z" fill="#8b5cf6" />
    <circle cx="60" cy="132" r="12" fill="#fbcfe8" />
    <path d="M50 130 C50 120, 70 120, 70 130 Z" fill="#1e1b4b" />
    <!-- Eyes wide with admiration -->
    <circle cx="65" cy="131" r="1.5" fill="#1e293b" />
    <path d="M63 137 Q66 140 69 137" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- ATMOSPHERIC DETAILS: Floating Golden Honor Sparkles & Tribute Elements -->
  <g id="sparkles">
    <!-- Sparkle 1 -->
    <path d="M120 50 L122 55 L127 57 L122 59 L120 64 L118 59 L113 57 L118 55 Z" fill="url(#gold)" opacity="0.9" />
    <!-- Sparkle 2 -->
    <path d="M80 75 L81 78 L84 79 L81 80 L80 83 L79 80 L76 79 L79 78 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Sparkle 3 -->
    <path d="M160 70 L161.5 73.5 L165 75 L161.5 76.5 L160 80 L158.5 76.5 L155 75 L158.5 73.5 Z" fill="url(#gold)" opacity="0.9" />
    <!-- Small glowing dots -->
    <circle cx="100" cy="65" r="2" fill="#fbbf24" opacity="0.7" />
    <circle cx="140" cy="65" r="1.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="120" cy="35" r="2.5" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Subtle vignette border for app-icon / card polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
</svg>