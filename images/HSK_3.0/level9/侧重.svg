<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Scale base (Physical object representing weighting/focus/侧重) -->
    <!-- Fulcrum / Base -->
    <path d="M-15,45 L15,45 L25,70 L-25,70 Z" fill="#4B5563"/>
    <rect x="-6" y="25" width="12" height="25" fill="#9CA3AF"/>
    <circle cx="0" cy="25" r="8" fill="#FBBF24"/>
    
    <!-- Central beam -->
    <path d="M-85,17 L85,23 L85,31 L-85,25 Z" fill="#9CA3AF"/>
    
    <!-- Left arm and lightweight pan (General subjects) -->
    <line x1="-75" y1="20" x2="-75" y2="70" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <path d="M-105,70 C-105,70 -95,95 -75,95 C-55,95 -45,70 -45,70 Z" fill="#374151" opacity="0.9"/>
    <ellipse cx="-75" cy="70" rx="30" ry="6" fill="#4B5563"/>
    <!-- Small items on left pan -->
    <circle cx="-85" cy="62" r="7" fill="#60A5FA"/>
    <rect x="-70" y="58" width="12" height="12" rx="2" fill="#34D399"/>
    
    <!-- Right arm and heavy/focused pan (Business Communication & Writing - 侧重) -->
    <line x1="75" y1="22" x2="75" y2="55" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M35,55 C35,55 50,90 75,90 C100,90 115,55 115,55 Z" fill="#1F2937" stroke="#FBBF24" stroke-width="2" opacity="0.95"/>
    <ellipse cx="75" cy="55" rx="40" ry="8" fill="#374151" stroke="#FBBF24" stroke-width="2"/>
    
    <!-- Prominent focus items on right pan (Representing Business English & Speech) -->
    <!-- Speech bubble icon representing communication -->
    <g transform="translate(62, 30) scale(0.9)">
      <rect x="-12" y="-12" width="28" height="20" rx="4" fill="#F59E0B"/>
      <path d="M-4,8 L2,15 L4,8 Z" fill="#F59E0B"/>
      <circle cx="-5" cy="-2" r="2.5" fill="#1A1D24"/>
      <circle cx="2" cy="-2" r="2.5" fill="#1A1D24"/>
      <circle cx="9" cy="-2" r="2.5" fill="#1A1D24"/>
    </g>
    
    <!-- Document / Writing icon representing business writing -->
    <g transform="translate(88, 36) scale(0.85)">
      <rect x="-10" y="-14" width="20" height="26" rx="2" fill="#60A5FA"/>
      <rect x="-6" y="-8" width="12" height="2.5" rx="1" fill="#1A1D24"/>
      <rect x="-6" y="-2" width="12" height="2.5" rx="1" fill="#1A1D24"/>
      <rect x="-6" y="4" width="8" height="2.5" rx="1" fill="#1A1D24"/>
    </g>
    
    <!-- Emphasized accent glow/ring indicating "侧重" (strong gravitational tilt/focus) -->
    <path d="M85,23 L85,55" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="75" cy="55" r="4" fill="#FFFFFF"/>
  </g>
</svg>