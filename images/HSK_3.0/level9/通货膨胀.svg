<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glowing effect representing economic heat -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.05"/>

  <!-- Upward Trend Arrow in Background -->
  <path d="M50 160 L100 110 L140 130 L190 70" stroke="#FF5400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
  <path d="M165 70 H190 V95" stroke="#FF5400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>

  <!-- Piggy Bank (Physical Object representing currency/value) - Expanding/Inflating Concept -->
  <g transform="translate(120, 125)">
    <!-- Shadow -->
    <ellipse cx="0" cy="65" rx="45" ry="10" fill="#000000" opacity="0.3"/>

    <!-- Main Body (Inflated Rounded Piggy Bank) -->
    <ellipse cx="0" cy="5" rx="55" ry="48" fill="#FFB703"/>
    
    <!-- Belly shine for glossy flat vector look -->
    <path d="M -30 -20 Q 0 -45 30 -20" stroke="#FFE169" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Snout -->
    <ellipse cx="42" cy="10" rx="16" ry="12" fill="#FFA500"/>
    <ellipse cx="38" cy="10" rx="3" ry="4" fill="#C67D00"/>
    <ellipse cx="46" cy="10" rx="3" ry="4" fill="#C67D00"/>

    <!-- Ear Back -->
    <polygon points="-15,-42 -5,-58 10,-45" fill="#FFA500"/>
    <!-- Ear Front -->
    <polygon points="-10,-43 -2,-53 6,-46" fill="#FFD166"/>

    <!-- Eye -->
    <circle cx="25" cy="-12" r="4" fill="#1A1D24"/>
    
    <!-- Legs -->
    <rect x="-35" y="45" width="12" height="15" rx="6" fill="#FFA500"/>
    <rect x="-15" y="48" width="12" height="15" rx="6" fill="#FFA500"/>
    <rect x="15" y="48" width="12" height="15" rx="6" fill="#FFA500"/>
    <rect x="30" y="42" width="12" height="15" rx="6" fill="#FFA500"/>

    <!-- Coin Slot -->
    <rect x="-8" y="-48" width="16" height="4" rx="2" fill="#C67D00"/>

    <!-- Tail -->
    <path d="M -52 5 C -65 0 -60 15 -50 12 C -45 10 -45 5 -48 2" stroke="#FFA500" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Coins & Upward Expansion indicators -->
  <g fill="#2EC4B6">
    <!-- Coin 1 -->
    <circle cx="75" cy="55" r="10" fill="#FFD166"/>
    <circle cx="75" cy="55" r="6" fill="none" stroke="#C67D00" stroke-width="2"/>
    <!-- Coin 2 -->
    <circle cx="165" cy="45" r="14" fill="#FFD166"/>
    <circle cx="165" cy="45" r="9" fill="none" stroke="#C67D00" stroke-width="2"/>
    <!-- Coin 3 (Smaller) -->
    <circle cx="140" cy="35" r="8" fill="#FFD166"/>
  </g>

  <!-- Expansion / Inflation Steam Lines (Heat/Swelling Effect) -->
  <path d="M 105 -15 Q 110 -25 105 -35" stroke="#FF5400" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 120 -20 Q 125 -32 120 -44" stroke="#FF5400" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 135 -15 Q 140 -25 135 -35" stroke="#FF5400" stroke-width="3" stroke-linecap="round" fill="none"/>

</svg>