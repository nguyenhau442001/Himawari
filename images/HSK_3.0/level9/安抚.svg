<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative soft glow representing warmth and safety -->
  <circle cx="120" cy="120" r="70" fill="#252D3D" opacity="0.6"/>

  <!-- Character group: Teacher/Adult comforting a child (representing 安抚) -->
  <g id="comfort-scene">
    <!-- Adult figure (Teacher/Guardian) body and clothes -->
    <path d="M 85 160 C 85 140 100 130 115 130 C 130 130 145 140 145 160 L 155 200 L 75 200 Z" fill="#3B82F6"/>
    
    <!-- Adult head and hair -->
    <circle cx="115" cy="105" r="18" fill="#FBBF24"/>
    <path d="M 97 105 C 97 92 105 85 115 85 C 125 85 133 92 133 105 C 130 100 123 98 115 98 C 107 98 100 100 97 105 Z" fill="#D97706"/>

    <!-- Adult warm, protective arm embracing the child -->
    <path d="M 115 130 C 115 130 135 135 145 150 C 150 157 145 165 135 165 C 125 165 110 150 105 142" fill="none" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>

    <!-- Child figure -->
    <g id="child">
      <!-- Child body -->
      <path d="M 130 170 C 130 158 140 150 150 150 C 160 150 170 158 170 170 L 175 200 L 125 200 Z" fill="#EC4899"/>
      <!-- Child head -->
      <circle cx="150" cy="135" r="14" fill="#FBBF24"/>
      <!-- Child hair -->
      <path d="M 136 135 C 136 125 142 120 150 120 C 158 120 164 125 164 135 C 161 130 156 128 150 128 C 144 128 139 130 136 135 Z" fill="#92400E"/>
    </g>

    <!-- Gentle soothing hand touching child's head/hair (The core action of "安抚") -->
    <path d="M 105 130 C 115 120 130 120 138 125 C 142 128 144 132 142 135" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>

    <!-- Calm visual waves / peaceful motion lines indicating soothing and calming -->
    <path d="M 65 90 C 70 85 70 75 65 70" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 55 100 C 63 92 63 80 55 72" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Focus floor line -->
  <line x1="50" y1="200" x2="190" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
</svg>