<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Ambient background glow representing "enlightenment/vỡ lòng" -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.08"/>
  <circle cx="120" cy="110" r="50" fill="#fbbf24" opacity="0.12"/>

  <!-- Classroom / Study Environment Background -->
  <!-- Walls & Bookshelf -->
  <rect x="24" y="36" width="192" height="130" rx="6" fill="#1e293b"/>
  
  <!-- Window with warm light -->
  <rect x="156" y="52" width="44" height="60" rx="4" fill="#334155"/>
  <rect x="160" y="56" width="36" height="52" rx="2" fill="#fbbf24" opacity="0.15"/>
  <line x1="178" y1="52" x2="178" y2="112" stroke="#1e293b" stroke-width="2"/>
  <line x1="156" y1="82" x2="200" y2="82" stroke="#1e293b" stroke-width="2"/>

  <!-- Bookshelf background details -->
  <rect x="36" y="52" width="70" height="6" rx="2" fill="#334155"/>
  <rect x="42" y="38" width="10" height="14" rx="1" fill="#ec4899" opacity="0.6"/>
  <rect x="54" y="40" width="8" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="64" y="37" width="12" height="15" rx="1" fill="#10b981" opacity="0.6"/>
  <rect x="78" y="39" width="9" height="13" rx="1" fill="#fbbf24" opacity="0.6"/>

  <!-- Large Wooden Desk -->
  <path d="M20 156 L220 156 L210 186 L30 186 Z" fill="#334155"/>
  <rect x="20" y="150" width="200" height="8" rx="2" fill="#475569"/>

  <!-- Desk Props: First brush/pen strokes, open picture book -->
  <g transform="translate(85, 155)">
    <!-- Open Book -->
    <path d="M -30 0 Q 0 -8 30 0 L 25 -18 Q 0 -22 -25 -18 Z" fill="#f8fafc"/>
    <path d="M -25 -18 Q 0 -22 25 -18 L 25 -18 L -30 0 Z" fill="#e2e8f0"/>
    <line x1="0" y1="-4" x2="0" y2="-20" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Tiny colorful colorful drawings on book pages -->
    <circle cx="-14" cy="-10" r="3" fill="#ec4899" opacity="0.8"/>
    <polygon points="10,-6 14,-14 18,-6" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Glowing Desk Lamp -->
  <path d="M 185 150 L 195 150 L 190 120 Z" fill="#64748b"/>
  <path d="M 175 105 Q 190 90 205 105 Z" fill="#fbbf24"/>
  <ellipse cx="190" cy="105" rx="15" ry="6" fill="#fbbf24"/>
  <path d="M 190 111 L 190 135" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Teacher and Child Characters (Representing "Cô ấy là giáo viên vỡ lòng của tôi") -->
  
  <!-- Teacher (Cô ấy - Female Teacher, guiding) -->
  <g transform="translate(140, 95)">
    <!-- Teacher Body/Torso -->
    <path d="M 15 45 C 15 30 25 25 40 25 C 55 25 65 30 65 45 L 75 90 C 75 92 73 95 70 95 L 10 95 C 7 95 5 92 5 90 Z" fill="#0ea5e9"/>
    <!-- Teacher Neck & Head -->
    <rect x="33" y="14" width="14" height="15" rx="4" fill="#fbcfe8"/>
    <circle cx="40" cy="10" r="16" fill="#fbcfe8"/>
    <!-- Teacher Hair (Stylish bob) -->
    <path d="M 24 4 C 24 -4 56 -4 56 4 C 56 18 50 24 50 24 L 52 28 L 28 28 L 30 24 C 30 24 24 18 24 4 Z" fill="#334155"/>
    <path d="M 24 4 C 24 14 28 22 34 26" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Teacher Face Expression (Warm, encouraging smile) -->
    <circle cx="35" cy="9" r="1.5" fill="#1e293b"/>
    <circle cx="45" cy="9" r="1.5" fill="#1e293b"/>
    <path d="M 38 14 Q 40 17 42 14" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Teacher Right Arm reaching forward to guide -->
    <path d="M 20 35 Q 0 45 -15 38" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
    <!-- Teacher Hand guiding child's hand -->
    <circle cx="-16" cy="37" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Child (Tôi - Young student learning foundational skills) -->
  <g transform="translate(75, 110)">
    <!-- Child Body/Torso -->
    <path d="M 10 40 C 10 25 20 20 35 20 C 50 20 60 25 60 40 L 65 80 C 65 83 62 85 59 85 L 11 85 C 8 85 5 83 5 80 Z" fill="#ec4899"/>
    <!-- Child Neck & Head -->
    <rect x="28" y="10" width="12" height="14" rx="4" fill="#fed7aa"/>
    <circle cx="34" cy="6" r="14" fill="#fed7aa"/>
    <!-- Child Hair (Cute messy spikes/bob) -->
    <path d="M 21 0 C 24 -8 44 -8 48 0 C 50 2 48 6 48 6 C 40 2 28 2 21 0 Z" fill="#78350f"/>
    <path d="M 22 2 C 20 8 23 12 25 14" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <!-- Child Face Expression (Focused, bright-eyed discovery) -->
    <circle cx="30" cy="5" r="1.5" fill="#1e293b"/>
    <circle cx="39" cy="5" r="1.5" fill="#1e293b"/>
    <path d="M 33 10 Q 34.5 12 36 10" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Child Arm holding pencil over book -->
    <path d="M 50 35 Q 38 45 25 38" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <circle cx="23" cy="38" r="4" fill="#fed7aa"/>

    <!-- Bright Pencil pointing down to book -->
    <line x1="23" y1="38" x2="8" y2="48" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <polygon points="6,49 10,47 8,52" fill="#1e293b"/>
  </g>

  <!-- Sparkles of "Enlightenment / Vỡ lòng" floating near the hands/book -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 110 135 L 112 140 L 117 142 L 112 144 L 110 149 L 108 144 L 103 142 L 108 140 Z"/>
    <!-- Star 2 -->
    <path d="M 85 120 L 86.5 123.5 L 90 125 L 86.5 126.5 L 85 130 L 83.5 126.5 L 80 125 L 83.5 123.5 Z" transform="scale(0.8) translate(30, 20)"/>
    <!-- Star 3 (cyan accent) -->
    <path d="M 135 155 L 136 158 L 139 159 L 136 160 L 135 163 L 134 160 L 131 159 L 134 158 Z" fill="#38bdf8"/>
  </g>

  <!-- Foreground Frame / Vignette Soft Edges -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>