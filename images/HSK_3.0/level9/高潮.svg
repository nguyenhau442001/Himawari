<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Court Wood Gradient -->
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2219"/>
      <stop offset="100%" stop-color="#22130e"/>
    </linearGradient>

    <!-- Spotlight Beam -->
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Energy Glow Gradient -->
    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Arena Atmosphere / Background Elements -->
  <g id="stadium-background">
    <!-- Stadium upper seating rows & lights -->
    <path d="M20 70 L220 70 L200 40 L40 40 Z" fill="#1e293b" opacity="0.6"/>
    <circle cx="60" cy="52" r="3" fill="#cbd5e1" opacity="0.4"/>
    <circle cx="90" cy="52" r="3" fill="#cbd5e1" opacity="0.4"/>
    <circle cx="120" cy="52" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="150" cy="52" r="3" fill="#cbd5e1" opacity="0.4"/>
    <circle cx="180" cy="52" r="3" fill="#cbd5e1" opacity="0.4"/>

    <!-- Scoreboard / Banner -->
    <rect x="85" y="30" width="70" height="22" rx="4" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="102" y="45" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f43f5e">98</text>
    <text x="120" y="45" font-family="sans-serif" font-weight="bold" font-size="11" fill="#64748b">-</text>
    <text x="128" y="45" font-family="sans-serif" font-weight="bold" font-size="11" fill="#38bdf8">99</text>

    <!-- Dynamic Spotlight Beams -->
    <polygon points="120,0 20,200 70,200" fill="url(#spotlight)"/>
    <polygon points="120,0 170,200 220,200" fill="url(#spotlight)"/>
  </g>

  <!-- Basketball Court Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#courtGrad)"/>
  <!-- Court perspective lines -->
  <ellipse cx="120" cy="170" rx="70" ry="18" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <path d="M 90 170 L 90 220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 150 170 L 150 220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Crowd Silhouettes (Excited cheering) -->
  <g fill="#334155" opacity="0.8">
    <path d="M 10 160 Q 15 140 20 160 Q 25 138 30 160 Q 35 142 40 160 Q 45 135 50 160 Q 55 140 60 160 Z"/>
    <path d="M 180 160 Q 185 140 190 160 Q 195 135 200 160 Q 205 142 210 160 Q 215 138 220 160 Q 225 140 230 160 Z"/>
    <!-- Cheering arms raised -->
    <line x1="25" y1="140" x2="22" y2="128" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="138" x2="48" y2="125" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="195" y1="138" x2="192" y2="124" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="215" y1="140" x2="218" y2="126" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- CLIMAX / PEAK ACTION (GAME HIGHPOINT) -->
  <g id="climax-action">
    <!-- Energy/Action Burst behind the dunk -->
    <circle cx="120" cy="115" r="45" fill="url(#energyGlow)"/>

    <!-- Kinetic Speed Lines / Impact Rays -->
    <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="120" y1="75" x2="120" y2="60"/>
      <line x1="150" y1="90" x2="162" y2="80"/>
      <line x1="90" y1="90" x2="78" y2="80"/>
      <line x1="155" y1="115" x2="172" y2="115"/>
      <line x1="85" y1="115" x2="68" y2="115"/>
    </g>

    <!-- Basketball Hoop & Backboard (Top center) -->
    <rect x="100" y="58" width="40" height="26" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" opacity="0.9"/>
    <rect x="112" y="72" width="16" height="10" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Rim -->
    <ellipse cx="120" cy="85" rx="14" ry="4" fill="none" stroke="#f97316" stroke-width="3"/>
    <!-- Net -->
    <path d="M 108 86 L 112 102 L 120 106 L 128 102 L 132 86" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" opacity="0.8"/>
    <path d="M 111 91 L 129 91 M 113 97 L 127 97" stroke="#cbd5e1" stroke-width="1" opacity="0.6"/>

    <!-- Defender (Teal/Blue Jersey) - Reaching desperately -->
    <g id="defender">
      <!-- Body/Torso -->
      <path d="M 140 120 L 155 105 L 168 125 L 155 155 Z" fill="#0284c7"/>
      <path d="M 148 108 L 155 105 L 160 115 Z" fill="#fcd34d"/> <!-- Head -->
      <circle cx="156" cy="111" r="5" fill="#f87171"/> <!-- face tone -->
      <!-- Arms reaching up -->
      <path d="M 160 115 L 175 90" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
      <path d="M 145 115 L 135 95" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
      <!-- Legs -->
      <path d="M 150 150 L 160 185" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
      <path d="M 162 150 L 175 180" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Main Athlete (Orange/Red Jersey) - Dynamic Slam Dunk -->
    <g id="athlete">
      <!-- Dynamic flying body -->
      <!-- Left Leg Bent -->
      <path d="M 95 110 L 80 135 L 95 145" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Right Leg trailing -->
      <path d="M 105 125 L 90 155 L 75 160" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Torso -->
      <path d="M 100 100 L 120 95 L 125 125 L 105 130 Z" fill="#f97316"/>
      <path d="M 112 112 L 118 110 L 116 122 L 110 124 Z" fill="#ef4444"/> <!-- Jersey detail -->

      <!-- Head & Determination -->
      <circle cx="98" cy="92" r="7" fill="#fca5a5"/>
      <path d="M 92 88 Q 97 84 103 89" fill="#1e293b" stroke="#1e293b" stroke-width="2"/> <!-- hair -->

      <!-- Left Arm (Supporting balance) -->
      <path d="M 105 105 L 90 115" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>

      <!-- Right Arm (Dunking slam action into the net) -->
      <path d="M 118 100 L 120 84" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>

      <!-- Basketball crashing through the rim -->
      <circle cx="120" cy="84" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
      <!-- Basketball lines -->
      <path d="M 112 78 Q 120 84 128 78" fill="none" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M 112 90 Q 120 84 128 90" fill="none" stroke="#c2410c" stroke-width="1.5"/>
      <line x1="120" y1="74" x2="120" y2="94" stroke="#c2410c" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Dramatic Lighting Flares & Particles -->
  <g id="sparkles">
    <circle cx="138" cy="72" r="2.5" fill="#fef08a"/>
    <circle cx="102" cy="76" r="2" fill="#fef08a"/>
    <circle cx="128" cy="100" r="1.5" fill="#fef08a"/>
    <circle cx="95" cy="65" r="2" fill="#fef08a" opacity="0.8"/>
    <!-- Action sparks -->
    <path d="M 135 84 L 142 80" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M 105 84 L 98 80" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Border frame -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
</svg>