<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ancient Architecture Context -->
  <path d="M40 180 L40 100 L70 70 L100 100 L100 180 Z" fill="#334155"/>
  <path d="M140 180 L140 100 L170 70 L200 100 L200 180 Z" fill="#334155"/>
  <rect x="30" y="180" width="180" height="10" fill="#475569"/>
  
  <!-- The Slave Figure (Subject) -->
  <g transform="translate(70, 120)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M10 18 L10 40 M10 25 L0 35 M10 25 L20 35 M5 60 L5 80 M15 60 L15 80" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
