    <circle cx="10" cy="70" r="6" fill="none" stroke="#94a3b8" stroke-width="3"/>
  </g>
  
  <!-- Overseer Figure -->
  <g transform="translate(160, 110)">
    <circle cx="10" cy="10" r="8" fill="#38bdf8"/>
    <path d="M10 18 L10 45 L0 60 M10 45 L20 60 M10 25 L25 35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 35 L35 30" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Environmental Details -->
  <path d="M20 200 Q120 180 220 200" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="200" cy="40" r="20" fill="#f59e0b" opacity="0.2"/>
  <circle cx="200" cy="40" r="10" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Chains/Constraint visual -->
  <path d="M20 140 L65 140" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
