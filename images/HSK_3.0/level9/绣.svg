<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow & Depth Elements -->
  <circle cx="120" cy="120" r="80" fill="#222732" opacity="0.6"/>

  <!-- Embroidery Hoop (Context: 绣 - to embroider) -->
  <g transform="translate(120, 115)">
    <!-- Outer Wooden/Metallic Hoop Ring -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#D48E3D" stroke-width="5" stroke-linecap="round"/>
    <!-- Inner Tightening Screw/Hardware at top -->
    <rect x="-6" y="-77" width="12" height="10" rx="2" fill="#E5C158"/>
    <rect x="-3" y="-83" width="6" height="7" fill="#C29B38"/>
    
    <!-- Fabric stretched inside -->
    <circle cx="0" cy="0" r="64" fill="#2D323E"/>
    <circle cx="0" cy="0" r="64" fill="#363C4C" opacity="0.5"/>

    <!-- Embroidered Flower Pattern (The Flower on the Handkerchief) -->
    <g transform="translate(10, 5)">
      <!-- Flower Petals -->
      <path d="M0,0 Q-15,-20 -5,-30 Q10,-25 0,0" fill="#FF5E7E" opacity="0.9"/>
      <path d="M0,0 Q15,-20 20,-5 Q10,10 0,0" fill="#FF5E7E" opacity="0.9"/>
      <path d="M0,0 Q20,10 10,25 Q-5,20 0,0" fill="#FF5E7E" opacity="0.9"/>
      <path d="M0,0 Q-20,10 -15,-10 Q-5,-5 0,0" fill="#FF5E7E" opacity="0.9"/>
      <path d="M0,0 Q-15,25 0,30 Q15,20 0,0" fill="#FF7994" opacity="0.9"/>
      <!-- Flower Center -->
      <circle cx="0" cy="0" r="7" fill="#FFD15C"/>
      
      <!-- Stem and Leaves -->
      <path d="M0,5 Q-15,30 -25,45" fill="none" stroke="#2ED573" stroke-width="3" stroke-linecap="round"/>
      <path d="M-15,25 Q-5,15 -8,35 Z" fill="#2ED573"/>
    </g>
  </g>

  <!-- Dynamic Action: Hand holding needle and thread -->
  <g transform="translate(120, 115)">
    <!-- Motion / Stitch arc lines -->
    <path d="M-35,40 Q-50,20 -10,-10" fill="none" stroke="#FFD15C" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    <path d="M-50,25 Q-30,-20 15,-25" fill="none" stroke="#FFD15C" stroke-width="2" stroke-linecap="round"/>

    <!-- Hand & Fingers crafting -->
    <g transform="translate(-45, 15) rotate(-25)">
      <!-- Thumb -->
      <path d="M15,5 Q25,12 28,20 Q22,25 12,18 Z" fill="#E0A96D"/>
      <!-- Index Finger holding needle -->
      <rect x="-5" y="-12" width="24" height="32" rx="10" fill="#E0A96D"/>
      <!-- Fingernail -->
      <ellipse cx="14" cy="-5" rx="3" ry="5" fill="#F4C28C" opacity="0.7"/>

      <!-- Silver Needle -->
      <line x1="-35" y1="-25" x2="8" y2="2" stroke="#EAEAEA" stroke-width="2" stroke-linecap="round"/>
      <!-- Needle Eye / Thread connection -->
      <circle cx="-33" cy="-23" r="1.5" fill="#4B6584"/>
      
      <!-- Golden Thread trailing through the fabric -->
      <path d="M-33,-23 Q-45,-40 -60,-25 Q-75,-10 -50,25" fill="none" stroke="#FFD15C" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Focus Accent Elements (Modern Flat UI Highlights) -->
  <circle cx="55" cy="65" r="3" fill="#FFD15C" opacity="0.6"/>
  <circle cx="185" cy="165" r="4" fill="#FF5E7E" opacity="0.6"/>
  <circle cx="170" cy="70" r="2" fill="#2ED573" opacity="0.8"/>
</svg>