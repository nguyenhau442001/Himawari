<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mine Shaft Entrance -->
  <path d="M60 180 L180 180 L170 80 L70 80 Z" fill="#2C313C"/>
  <path d="M70 80 L120 40 L170 80 Z" fill="#3D4454"/>
  
  <!-- Mining Drill Machine -->
  <g transform="translate(80, 110)">
    <!-- Body -->
    <rect x="0" y="20" width="60" height="30" rx="4" fill="#FF9F1C"/>
    <!-- Drill Bit -->
    <path d="M60 35 L90 35 L85 25 L95 35 L85 45 L90 35" fill="#FFC107" stroke="#FF9F1C" stroke-width="2"/>
    <!-- Tracks -->
    <rect x="5" y="50" width="50" height="10" rx="2" fill="#4A5568"/>
    <circle cx="15" cy="60" r="4" fill="#718096"/>
    <circle cx="45" cy="60" r="4" fill="#718096"/>
  </g>
  
  <!-- Ore/Mineral rocks -->
  <path d="M40 190 L55 170 L70 190 Z" fill="#FF9F1C"/>
  <path d="M170 195 L185 175 L200 195 Z" fill="#FF9F1C"/>
  <path d="M190 180 L205 165 L220 180 Z" fill="#FF9F1C"/>
  
  <!-- Structural supports -->
  <rect x="60" y="80" width="8" height="100" fill="#4A5568"/>
  <rect x="172" y="80" width="8" height="100" fill="#4A5568"/>
</svg>