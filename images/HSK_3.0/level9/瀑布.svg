<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Waterfall Gradient -->
    <linearGradient id="waterfallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Cliff Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Foliage Gradient -->
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Mist Gradient -->
    <linearGradient id="mistGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Sky / Distant Rocks -->
  <path d="M0 0 H240 V120 H0 Z" fill="#1e293b" opacity="0.5" />
  <circle cx="190" cy="50" r="18" fill="#fbbf24" opacity="0.8" />

  <!-- Background Mountains / Cliffs -->
  <path d="M20 120 L80 60 L140 120 Z" fill="#293548" />
  <path d="M100 120 L170 40 L240 120 Z" fill="#334155" />

  <!-- Waterfall Cliff Left & Right -->
  <path d="M0 120 L80 120 L80 240 L0 240 Z" fill="url(#cliffGrad)" />
  <path d="M150 120 L240 120 L240 240 L150 240 Z" fill="url(#cliffGrad)" />

  <!-- Lush Greenery / Trees on Cliffs -->
  <circle cx="60" cy="115" r="14" fill="url(#treeGrad)" />
  <circle cx="45" cy="110" r="12" fill="url(#treeGrad)" />
  <circle cx="75" cy="120" r="10" fill="url(#treeGrad)" />
  
  <circle cx="170" cy="115" r="16" fill="url(#treeGrad)" />
  <circle cx="190" cy="122" r="12" fill="url(#treeGrad)" />

  <!-- THE WATERFALL (Main Subject) -->
  <rect x="80" y="110" width="70" height="90" fill="url(#waterfallGrad)" />
  <!-- Waterfall Motion Lines -->
  <path d="M90 110 L90 195" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M115 110 L115 190" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M135 110 L135 195" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Waterfall Mist & Base Pool -->
  <path d="M60 195 Q115 180 170 195 L180 240 H50 Z" fill="#0ea5e9" opacity="0.3" />
  <ellipse cx="115" cy="200" rx="45" ry="12" fill="url(#mistGrad)" />
  <ellipse cx="115" cy="204" rx="55" ry="10" fill="#38bdf8" opacity="0.4" />
  
  <!-- Wooden Viewing Platform -->
  <path d="M30 220 L150 220 L170 240 L10 240 Z" fill="#78350f" />
  <path d="M30 224 L150 224 L170 240 L10 240 Z" fill="#92400e" />
  <!-- Platform Planks Lines -->
  <line x1="50" y1="220" x2="35" y2="240" stroke="#451a03" stroke-width="1.5" />
  <line x1="80" y1="220" x2="65" y2="240" stroke="#451a03" stroke-width="1.5" />
  <line x1="110" y1="220" x2="95" y2="240" stroke="#451a03" stroke-width="1.5" />
  <line x1="140" y1="220" x2="125" y2="240" stroke="#451a03" stroke-width="1.5" />

  <!-- Railing -->
  <line x1="30" y1="205" x2="30" y2="220" stroke="#b45309" stroke-width="3" />
  <line x1="120" y1="205" x2="120" y2="220" stroke="#b45309" stroke-width="3" />
  <line x1="20" y1="208" x2="135" y2="208" stroke="#b45309" stroke-width="2.5" />

  <!-- CHARACTER 1: Tourist pointing in awe ("这座瀑布非常壮观") -->
  <!-- Legs -->
  <line x1="60" y1="222" x2="58" y2="238" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <line x1="72" y1="222" x2="75" y2="238" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <!-- Torso (Orange Jacket) -->
  <path d="M52 195 L80 195 L78 222 L50 222 Z" fill="url(#jacketGrad)" rx="3" />
  <!-- Head -->
  <circle cx="65" cy="183" r="9" fill="#fbcfe8" />
  <!-- Hair (Dark) -->
  <path d="M56 183 C56 175 74 175 74 183 C72 181 58 181 56 183 Z" fill="#0f172a" />
  <!-- Back Arm (Holding Camera Strap or relaxed) -->
  <path d="M54 198 L45 212" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  <!-- Front Arm (Pointing enthusiastically toward the waterfall) -->
  <path d="M76 198 L92 188" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  <!-- Pointing Hand -->
  <circle cx="94" cy="187" r="3" fill="#fbcfe8" />

  <!-- CHARACTER 2: Companion taking photo / watching -->
  <!-- Legs -->
  <line x1="95" y1="222" x2="92" y2="238" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" />
  <line x1="105" y1="222" x2="108" y2="238" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" />
  <!-- Torso (Teal Hoodie) -->
  <path d="M88 198 L114 198 L112 222 L90 222 Z" fill="#0d9488" rx="3" />
  <!-- Head -->
  <circle cx="101" cy="186" r="8.5" fill="#fbcfe8" />
  <!-- Hair (Ponytail) -->
  <path d="M93 184 C93 177 109 177 109 184 C112 188 114 192 114 192 C114 192 108 186 93 184 Z" fill="#451a03" />
  <!-- Arms holding camera -->
  <path d="M92 202 L102 200 L108 205" stroke="#0f766e" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Camera Box -->
  <rect x="98" y="197" width="9" height="7" rx="1.5" fill="#e2e8f0" />
  <circle cx="102.5" cy="200.5" r="2" fill="#0f172a" />

  <!-- Atmospheric Sparkles / Mist Droplets -->
  <circle cx="130" cy="170" r="1.5" fill="#bae6fd" opacity="0.8" />
  <circle cx="145" cy="150" r="2" fill="#bae6fd" opacity="0.6" />
  <circle cx="155" cy="175" r="1" fill="#bae6fd" opacity="0.9" />
  <circle cx="75" cy="160" r="2" fill="#bae6fd" opacity="0.7" />
  <circle cx="85" cy="140" r="1.5" fill="#bae6fd" opacity="0.5" />

  <!-- Foreground foliage frame element -->
  <path d="M240 0 C220 20 230 50 240 60 Z" fill="#047857" opacity="0.8" />
  <path d="M0 0 C20 15 10 40 0 50 Z" fill="#047857" opacity="0.8" />
</svg>