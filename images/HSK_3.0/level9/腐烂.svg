<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Table Top Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Soft Ambient Light Glow -->
    <radialGradient id="lampGlow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Room Interior Details: Wall & Window backdrop -->
  <path d="M0 0 H240 V150 H0 Z" fill="#0f172a" opacity="0.4" />
  <!-- Window Frame -->
  <rect x="150" y="20" width="60" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M180 20 V100 M150 60 H210" stroke="#334155" stroke-width="2" />
  <circle cx="170" cy="40" r="4" fill="#fbbf24" opacity="0.6" /> <!-- Outside night star/moon -->

  <!-- Hanging Lamp -->
  <path d="M70 0 V35" stroke="#475569" stroke-width="2" />
  <path d="M50 35 H90 L95 45 H45 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M70 45 V60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

  <!-- Kitchen/Dining Table Surface -->
  <path d="M0 150 L30 140 H240 V240 H0 Z" fill="url(#tableGrad)" />
  <path d="M0 150 L240 150" stroke="#475569" stroke-width="2" />

  <!-- Background Shelf with jars/props -->
  <path d="M15 110 H90 V114 H15 Z" fill="#475569" />
  <rect x="25" y="90" width="16" height="20" rx="3" fill="#10b981" opacity="0.5" />
  <rect x="45" y="85" width="20" height="25" rx="3" fill="#f59e0b" opacity="0.4" />

  <!-- CHARACTER: Frustrated/Disappointed Person -->
  <!-- Body/Torso -->
  <path d="M 175 220 C 160 190, 160 170, 150 155 C 180 150, 200 160, 225 180 L 235 220 Z" fill="#38bdf8" />
  <!-- Head & Neck -->
  <path d="M 145 130 C 140 120, 145 110, 155 110 C 165 110, 170 120, 165 130 Z" fill="url(#skinGrad)" />
  <circle cx="158" cy="118" r="18" fill="url(#skinGrad)" />
  <!-- Hair -->
  <path d="M 142 110 C 140 95, 160 90, 172 105 C 170 115, 168 120, 168 120 C 168 120, 150 115, 142 110 Z" fill="#334155" />
  <!-- Expression: Frown/Worried -->
  <path d="M 162 122 Q 166 125 170 122" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- mouth -->
  <path d="M 166 114 L 171 116" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- eyebrow angled -->

  <!-- Arm leaning on table, hand near chin -->
  <path d="M 185 170 C 195 160, 190 145, 180 140 C 175 138, 170 145, 175 155 Z" fill="url(#skinGrad)" />
  <path d="M 150 165 C 170 160, 185 180, 200 220" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none" />

  <!-- FOREGROUND SCENARIO: Fruit Bowl with Rotted/Spoiled Fruit -->
  <!-- Ceramic Bowl -->
  <path d="M 50 175 C 50 205, 110 205, 110 175 Z" fill="#e2e8f0" />
  <ellipse cx="80" cy="175" rx="30" ry="8" fill="#cbd5e1" />

  <!-- Fresh Banana (partially okay, but turning) -->
  <path d="M 55 165 C 50 150, 65 140, 75 145 C 80 148, 75 160, 65 168 Z" fill="#facc15" />
  <path d="M 58 155 Q 65 150 71 156" stroke="#713f12" stroke-width="3" fill="none" /> <!-- brown spot on banana -->

  <!-- ROTTEN FRUIT 1: Mushy Apple with dark bruised patches -->
  <circle cx="85" cy="162" r="14" fill="#991b1b" /> <!-- deep bruised red/brown -->
  <!-- Rot spots / Mold patches -->
  <path d="M 75 160 C 78 155, 85 158, 82 165 C 78 168, 73 165, 75 160 Z" fill="#451a03" />
  <circle cx="92" cy="167" r="4" fill="#3f3f46" /> <!-- mold -->
  <!-- Apple Stem & Leaf dropping -->
  <path d="M 85 148 L 87 144" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
  <path d="M 87 144 C 92 142, 95 146, 92 149 Z" fill="#78350f" /> <!-- wilting leaf -->

  <!-- ROTTEN FRUIT 2: Sagging, melting orange/peach -->
  <ellipse cx="102" cy="168" rx="11" ry="9" fill="#7c2d12" />
  <!-- Liquid / Slumped shape representing 'fǔlàn' (rotting/decaying) -->
  <path d="M 91 170 C 95 178, 105 178, 112 172 C 110 165, 95 165, 91 170 Z" fill="#581c87" opacity="0.6" /> <!-- decay fluid shadow -->

  <!-- Flies / Stench / Decay Indicator Lines -->
  <!-- Small stylized flies buzzing around -->
  <ellipse cx="68" cy="138" rx="2" ry="1" fill="#cbd5e1" />
  <path d="M 66 138 Q 64 135 62 137" stroke="#94a3b8" stroke-width="1" fill="none" />
  <ellipse cx="98" cy="142" rx="2" ry="1" fill="#cbd5e1" />

  <!-- Stench wavy lines rising up -->
  <path d="M 82 140 Q 85 130 80 120 T 85 100" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M 95 145 Q 92 135 97 125 T 93 105" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3" />
</svg>