<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle ripple effect to represent the 'touching' of the heart/emotion -->
  <circle cx="120" cy="120" r="40" fill="none" stroke="#2D343E" stroke-width="2" opacity="0.5"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#2D343E" stroke-width="2" opacity="0.3"/>
  
  <!-- Stylized Human Silhouette (The audience) -->
  <g transform="translate(80, 80)">
    <path d="M40 20C40 8.95 48.95 0 60 0C71.05 0 80 8.95 80 20C80 31.05 71.05 40 60 40C48.95 40 40 31.05 40 20Z" fill="#F5A623"/>
    <path d="M20 120C20 86.86 46.86 60 80 60C113.14 60 140 86.86 140 120V160H20V120Z" fill="#F5A623"/>
  </g>
  
  <!-- The 'Heart' (Anatomical/Symbolic representation of the core of emotion) -->
  <!-- Using a simple, clean, non-romanticized organic shape for the 'soul/heart' -->
  <path d="M120 100 C 110 90, 90 90, 90 110 C 90 125, 120 140, 120 140 C 120 140, 150 125, 150 110 C 150 90, 130 90, 120 100" fill="#FFB74D"/>
  
  <!-- Motion lines indicating the 'impact' or 'trigger' of the emotion -->
  <path d="M105 105 L95 95" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 105 L145 95" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Subtle light rays emanating from the center to show the 'stirring' effect -->
  <line x1="120" y1="80" x2="120" y2="60" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="140" y1="100" x2="155" y2="85" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="100" y1="100" x2="85" y2="85" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>