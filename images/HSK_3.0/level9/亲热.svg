<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric background room details (Warm co-working / community space) -->
  <path d="M0 0h240v240H0z" fill="url(#bg-grad)"/>
  
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Glow & Interior Elements -->
  <rect x="0" y="0" width="240" height="240" fill="url(#warm-glow)"/>
  <!-- Windows / Warm hanging lights -->
  <circle cx="60" cy="50" r="18" fill="#f59e0b" opacity="0.1"/>
  <circle cx="180" cy="40" r="24" fill="#f59e0b" opacity="0.08"/>
  <path d="M55 20h10v30H55z" fill="#334155"/>
  <path d="M175 10h10v30h-10z" fill="#334155"/>
  <circle cx="60" cy="52" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="180" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>

  <!-- House Plants / Bookshelf background context -->
  <path d="M20 200h35v40H20z" fill="#334155" opacity="0.4"/>
  <circle cx="37" cy="190" r="14" fill="#10b981" opacity="0.6"/>
  <circle cx="28" cy="180" r="10" fill="#34d399" opacity="0.5"/>
  <circle cx="48" cy="183" r="11" fill="#059669" opacity="0.6"/>

  <path d="M205 180h25v60h-25z" fill="#334155" opacity="0.4"/>
  <rect x="210" y="190" width="15" height="4" fill="#f43f5e" opacity="0.5"/>
  <rect x="210" y="200" width="15" height="4" fill="#38bdf8" opacity="0.5"/>
  <rect x="210" y="210" width="15" height="4" fill="#fbbf24" opacity="0.5"/>

  <!-- Floor line -->
  <path d="M0 200h240v40H0z" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- SCENE & CHARACTERS: Depicting "她对每个人都很亲热" (She is very warm and affectionate with everyone) -->
  <!-- Central Character (The friendly woman 'she' welcoming/greeting people warmly) -->
  <!-- Woman's Legs/Body -->
  <path d="M110 140l-8 60h16l4-60z" fill="#475569"/>
  <!-- Torso & Dress -->
  <path d="M95 90l25-5 25 5-5 55H100z" fill="#ec4899"/>
  <path d="M102 85h36v15h-36z" fill="#f472b6"/>
  <!-- Arms gesturing warmly (open, welcoming posture) -->
  <!-- Left Arm (waving/greeting) -->
  <path d="M98 92l-22 15 6 10 16-10z" fill="#fb7185"/>
  <circle cx="72" cy="108" r="6" fill="#fbcfe8"/>
  <!-- Right Arm (reaching out/welcoming) -->
  <path d="M142 92l22 12-5 11-17-7z" fill="#fb7185"/>
  <circle cx="166" cy="103" r="6" fill="#fbcfe8"/>

  <!-- Head & Face -->
  <circle cx="120" cy="65" r="18" fill="#fbcfe8"/>
  <!-- Hair (friendly bob style) -->
  <path d="M102 60c0-12 8-20 18-20s18 8 18 20v15h-36V60z" fill="#334155"/>
  <path d="M102 60c-4 8-3 18 2 24l4-15c-3-4-4-6-6-9z" fill="#334155"/>
  <path d="M138 60c4 8 3 18-2 24l-4-15c3-4 4-6 6-9z" fill="#334155"/>
  <!-- Warm Friendly Face Expressions -->
  <path d="M113 65c0-2 2-3 4-3s4 1 4 3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M125 65c0-2 2-3 4-3s4 1 4 3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Big Warm Smile -->
  <path d="M115 74q5 5 10 0" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks (Warm flush) -->
  <circle cx="111" cy="71" r="3" fill="#fb7185" opacity="0.6"/>
  <circle cx="129" cy="71" r="3" fill="#fb7185" opacity="0.6"/>

  <!-- Character 2 (Left - Neighbor / Friend being greeted warmly) -->
  <!-- Body -->
  <path d="M45 150l5 50h14l-2-50z" fill="#1e293b"/>
  <path d="M38 105l24 3 4 42H38z" fill="#3b82f6"/>
  <!-- Arm raised holding gift/coffee -->
  <path d="M58 115l15 10-6 10-14-5z" fill="#93c5fd"/>
  <!-- Head -->
  <circle cx="50" cy="85" r="14" fill="#fbcfe8"/>
  <path d="M38 82c2-10 10-14 24-10-2 6-5 12-4 18h-20z" fill="#475569"/>
  <!-- Friendly expression -->
  <circle cx="46" cy="85" r="2" fill="#1e293b"/>
  <circle cx="54" cy="85" r="2" fill="#1e293b"/>
  <path d="M47 92q3 3 6 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Character 3 (Right - Colleague / Friend smiling back) -->
  <!-- Body -->
  <path d="M185 155l-3 45h-15l4-45z" fill="#334155"/>
  <path d="M172 110l25 8-2 42h-25z" fill="#10b981"/>
  <!-- Arm waving -->
  <path d="M174 118l-18 12 6 9 14-8z" fill="#34d399"/>
  <!-- Head -->
  <circle cx="185" cy="90" r="14" fill="#fbcfe8"/>
  <path d="M172 88c2-10 8-15 22-12-1 8-2 15-4 18h-18z" fill="#b45309"/>
  <!-- Friendly expression -->
  <circle cx="181" cy="90" r="2" fill="#1e293b"/>
  <circle cx="189" cy="90" r="2" fill="#1e293b"/>
  <path d="M182 96q3 3 6 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Context Props: Coffee cups, indoor elements showing interaction -->
  <!-- Small table with plant/cup between them -->
  <path d="M90 180h60v12H90z" fill="#475569"/>
  <rect x="115" y="165" width="10" height="15" fill="#f8fafc" rx="2"/>
  <path d="M125 168c3 0 5 2 5 4s-2 4-5 4" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
  <ellipse cx="120" cy="165" rx="5" ry="2" fill="#38bdf8"/>

  <!-- Floating Warm Affection/Friendship Sparkles / Hearts (Stylized geometric/organic friendly floating shapes) -->
  <path d="M102 42l2-4 4 2-4 4z" fill="#f43f5e" opacity="0.8"/>
  <path d="M140 45l3-2 2 3-3 2z" fill="#f43f5e" opacity="0.7"/>
  <circle cx="132" cy="35" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="108" cy="32" r="2" fill="#38bdf8" opacity="0.9"/>
  
  <!-- Subtle heart icon representing '亲热' (warmth/affection) floating softly -->
  <path d="M120 30c-2-3-6-3-8 0-2 3 1 6 8 10 7-4 10-7 8-10-2-3-6-3-8 0z" fill="#f43f5e" opacity="0.85"/>
  <path d="M85 55c-1-2-4-2-5 0-1 2 0 4 5 7 5-3 6-5 5-7-1-2-4-2-5 0z" fill="#f43f5e" opacity="0.5"/>
  <path d="M158 52c-1-2-4-2-5 0-1 2 0 4 5 7 5-3 6-5 5-7-1-2-4-2-5 0z" fill="#f43f5e" opacity="0.6"/>

</svg>