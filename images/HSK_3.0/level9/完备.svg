<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic & Case Gradients -->
    <linearGradient id="caseBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>

    <linearGradient id="caseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28313E"/>
      <stop offset="100%" stop-color="#1E252F"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </linearGradient>

    <linearGradient id="steelTool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF9800" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Dark Theme Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <circle cx="120" cy="125" r="95" fill="url(#bgGlow)"/>

  <!-- Equipment Case Shadow & Main Assembly -->
  <g filter="url(#dropShadow)">
    <!-- Case Handle -->
    <path d="M 94 48 C 94 43, 98 39, 103 39 L 137 39 C 142 39, 146 43, 146 48 L 146 54 L 94 54 Z" fill="#242B35" stroke="#3E4A59" stroke-width="2"/>
    <rect x="106" y="44" width="28" height="5" rx="2.5" fill="#1A1D24"/>

    <!-- Case Outer Shell -->
    <rect x="30" y="52" width="180" height="142" rx="14" fill="url(#caseBorder)"/>
    <rect x="33" y="55" width="174" height="136" rx="11" fill="url(#caseBody)"/>

    <!-- Rugged Corner Protectors -->
    <path d="M 30 64 L 42 52 L 30 52 Z" fill="#FF9800"/>
    <path d="M 210 64 L 198 52 L 210 52 Z" fill="#FF9800"/>
    <path d="M 30 182 L 42 194 L 30 194 Z" fill="#FF9800"/>
    <path d="M 210 182 L 198 194 L 210 194 Z" fill="#FF9800"/>

    <!-- Latches -->
    <rect x="62" y="50" width="14" height="7" rx="1.5" fill="#B0BEC5"/>
    <rect x="164" y="50" width="14" height="7" rx="1.5" fill="#B0BEC5"/>

    <!-- High-density Custom Foam Tray -->
    <rect x="40" y="62" width="160" height="122" rx="7" fill="#13171D"/>
    <rect x="42" y="64" width="156" height="118" rx="5" fill="#181D24" stroke="#0F1318" stroke-width="1.5"/>
  </g>

  <!-- Precision Cutouts & Fully Slotted Equipment (完备) -->
  <!-- Compartment 1: Multi-functional Device (Left) -->
  <rect x="50" y="73" width="34" height="100" rx="6" fill="#10141A"/>
  <rect x="52" y="75" width="30" height="96" rx="5" fill="#263238" stroke="#37474F" stroke-width="1"/>
  <!-- Device Screen (Cyan Monitor with Full Status Grid) -->
  <rect x="56" y="81" width="22" height="24" rx="3" fill="#0E2229" stroke="#00838F" stroke-width="1"/>
  <circle cx="67" cy="93" r="6" fill="none" stroke="url(#cyanAccent)" stroke-width="1.5" stroke-dasharray="28 8"/>
  <circle cx="67" cy="93" r="2.5" fill="#4DD0E1"/>
  <!-- Device Controls -->
  <circle cx="60" cy="113" r="2" fill="#FFB300"/>
  <circle cx="67" cy="113" r="2" fill="#78909C"/>
  <circle cx="74" cy="113" r="2" fill="#78909C"/>
  <rect x="56" y="122" width="22" height="4" rx="2" fill="#1E272E"/>
  <rect x="56" y="130" width="22" height="4" rx="2" fill="#1E272E"/>
  <rect x="56" y="138" width="22" height="4" rx="2" fill="#1E272E"/>
  <rect x="56" y="146" width="22" height="18" rx="2" fill="#1F2833"/>
  <rect x="59" y="149" width="16" height="3" rx="1.5" fill="#FF9800"/>

  <!-- Compartment 2: Top Center Precision Caliper / Measurement Tool -->
  <rect x="91" y="73" width="58" height="26" rx="5" fill="#10141A"/>
  <!-- Caliper Unit -->
  <rect x="95" y="79" width="50" height="5" rx="1" fill="url(#steelTool)"/>
  <path d="M 97 76 L 103 76 L 100 89 L 97 89 Z" fill="#CFD8DC"/>
  <rect x="114" y="76" width="12" height="11" rx="2" fill="#37474F"/>
  <rect x="116" y="78" width="8" height="7" rx="1" fill="#FFB300"/>

  <!-- Compartment 3: Middle Center Hardware Tool (Wrench) -->
  <rect x="91" y="105" width="58" height="24" rx="5" fill="#10141A"/>
  <!-- Steel Wrench -->
  <path d="M 95 117 C 95 113, 98 110, 102 110 C 104 110, 106 111, 107 113 L 133 115 C 135 113, 138 111, 142 112 C 145 113, 147 116, 146 119 L 142 119 C 140 119, 138 118, 137 119 L 107 121 C 106 123, 104 124, 102 124 C 98 124, 95 121, 95 117 Z" fill="url(#steelTool)"/>
  <circle cx="102" cy="117" r="3" fill="#10141A"/>

  <!-- Compartment 4: Central Completion Seal (完备 - 100% Complete & Certified) -->
  <rect x="91" y="135" width="58" height="38" rx="5" fill="#10141A"/>
  <g filter="url(#glowBadge)">
    <!-- Golden Shield Badge -->
    <circle cx="120" cy="154" r="14" fill="url(#goldAccent)"/>
    <circle cx="120" cy="154" r="11" fill="#1E232B"/>
    <!-- Perfect Checkmark -->
    <path d="M 114 154 L 118 158 L 127 149" fill="none" stroke="url(#goldAccent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Compartment 5: Right Array of Fitted Modular Tech Components -->
  <!-- Top Right: Micro Modules / Batteries -->
  <rect x="156" y="73" width="34" height="26" rx="5" fill="#10141A"/>
  <rect x="160" y="77" width="7" height="18" rx="2" fill="url(#cyanAccent)"/>
  <rect x="170" y="77" width="7" height="18" rx="2" fill="url(#cyanAccent)"/>
  <rect x="180" y="77" width="7" height="18" rx="2" fill="url(#cyanAccent)"/>

  <!-- Middle Right: Precision Bits / Probe Array -->
  <rect x="156" y="105" width="34" height="24" rx="5" fill="#10141A"/>
  <circle cx="163" cy="117" r="3.5" fill="#B0BEC5"/>
  <circle cx="163" cy="117" r="1.5" fill="#37474F"/>
  <circle cx="173" cy="117" r="3.5" fill="#B0BEC5"/>
  <circle cx="173" cy="117" r="1.5" fill="#37474F"/>
  <circle cx="183" cy="117" r="3.5" fill="#B0BEC5"/>
  <circle cx="183" cy="117" r="1.5" fill="#37474F"/>

  <!-- Bottom Right: Secondary Instrument / Probe -->
  <rect x="156" y="135" width="34" height="38" rx="5" fill="#10141A"/>
  <rect x="161" y="141" width="24" height="12" rx="3" fill="#2E3842" stroke="#455A64" stroke-width="1"/>
  <rect x="164" y="144" width="8" height="6" rx="1.5" fill="#00E676"/>
  <circle cx="178" cy="147" r="2" fill="#FFB300"/>
  <path d="M 166 158 L 180 158" stroke="url(#steelTool)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="180" cy="158" r="2" fill="#FF9800"/>

  <!-- Sparkling Completeness Accents (✦ Aesthetic polish) -->
  <path d="M 27 45 Q 31 45 31 41 Q 31 45 35 45 Q 31 45 31 49 Q 31 45 27 45 Z" fill="#FFD54F"/>
  <path d="M 207 38 Q 211 38 211 34 Q 211 38 215 38 Q 211 38 211 42 Q 211 38 207 38 Z" fill="#4DD0E1"/>
  <path d="M 215 142 Q 218 142 218 139 Q 218 142 221 142 Q 218 142 218 145 Q 218 142 215 142 Z" fill="#FFD54F" opacity="0.8"/>
</svg>