<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="floodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="stormGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  
  <!-- Atmospheric Storm Details -->
  <rect width="240" height="240" rx="24" fill="url(#stormGlow)"/>
  
  <!-- Rain streaks -->
  <g opacity="0.4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="20" x2="25" y2="60"/>
    <line x1="80" y1="10" x2="65" y2="50"/>
    <line x1="130" y1="30" x2="115" y2="70"/>
    <line x1="180" y1="15" x2="165" y2="55"/>
    <line x1="210" y1="40" x2="195" y2="80"/>
    <line x1="60" y1="80" x2="45" y2="120"/>
    <line x1="110" y1="70" x2="95" y2="110"/>
    <line x1="160" y1="90" x2="145" y2="130"/>
  </g>

  <!-- Distant Background Hills / Riverbank Left -->
  <path d="M0 130 L90 120 L90 190 L0 190 Z" fill="#334155"/>

  <!-- Riverbed / Right Bank -->
  <path d="M170 130 L240 125 L240 190 L170 190 Z" fill="#334155"/>

  <!-- The Dike (堤坝) - Broken / Collapsing Center -->
  <!-- Left stable dike section -->
  <path d="M70 125 L105 125 L100 170 L70 170 Z" fill="#64748b"/>
  <path d="M70 125 L105 125 L105 130 L70 130 Z" fill="#94a3b8"/> <!-- top edge -->

  <!-- Right stable dike section -->
  <path d="M145 125 L180 125 L180 170 L135 170 Z" fill="#64748b"/>
  <path d="M145 125 L180 125 L180 130 L145 130 Z" fill="#94a3b8"/> <!-- top edge -->

  <!-- Breached / Collapsing Dike Debris (Flying blocks) -->
  <polygon points="112,135 125,128 120,145 108,142" fill="#475569" transform="rotate(15 115 135)"/>
  <polygon points="128,150 140,140 142,158 130,162" fill="#64748b" transform="rotate(-25 135 150)"/>
  <rect x="110" y="152" width="14" height="10" rx="2" fill="#475569" transform="rotate(40 117 157)"/>

  <!-- Raging Flood Water (冲毁 - Overflowing through the breach) -->
  <path d="M90 120 
           C 95 120, 105 135, 120 138 
           C 135 140, 145 125, 150 120
           L 175 170 
           C 150 190, 80 190, 65 170 Z" 
        fill="url(#floodGrad)" opacity="0.9"/>

  <!-- Dynamic Wave Splashes & Foam -->
  <path d="M100 138 Q115 155 130 136 Q140 150 155 138" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/>
  <path d="M85 150 Q105 175 125 150 Q145 175 165 150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Floating debris in water (branches/logs) -->
  <path d="M105 160 L125 155" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <path d="M135 168 L150 162" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

  <!-- Foreground Ground / Riverbanks (Bottom) -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a"/>
  
  <!-- Wet bank highlights -->
  <path d="M0 170 Q120 165 240 170 L240 175 Q120 170 0 175 Z" fill="#334155"/>

  <!-- Environmental Props: Warning / Evacuation Sign Post on the left bank -->
  <rect x="35" y="140" width="4" height="35" fill="#475569"/>
  <circle cx="37" cy="137" r="9" fill="#ef4444"/>
  <path d="M37 132 L37 140 M37 143 L37 144" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trees swaying in the storm (Left) -->
  <path d="M15 145 Q20 130 12 115 Q25 125 22 145" fill="#065f46"/>
  <path d="M22 155 L22 170" stroke="#451a03" stroke-width="4"/>

  <!-- Distant electricity pole leaning slightly -->
  <line x1="210" y1="125" x2="215" y2="170" stroke="#475569" stroke-width="3"/>
  <line x1="205" y1="133" x2="220" y2="137" stroke="#475569" stroke-width="2"/>

  <!-- Dramatic lighting / ambient glow on top spray -->
  <circle cx="120" cy="135" r="25" fill="#38bdf8" opacity="0.15" filter="blur(8px)"/>

  <!-- Foreground Rain drops -->
  <g opacity="0.6" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="130" x2="18" y2="170"/>
    <line x1="90" y1="110" x2="78" y2="150"/>
    <line x1="150" y1="115" x2="138" y2="155"/>
    <line x1="195" y1="135" x2="183" y2="175"/>
  </g>
</svg>