<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background grid/glow effects for modern app aesthetic -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>
  <path d="M 60 120 L 180 120" stroke="#2F3640" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Motion lines and trickery effects (representing "giở trò" / tricks) -->
  <path d="M 70 85 Q 95 65 120 85 T 170 85" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="6 4"/>
  <path d="M 65 155 Q 95 175 120 155 T 175 155" fill="none" stroke="#FF7043" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Floating playful/tricky objects (cards / illusions) -->
  <!-- Card 1 -->
  <g transform="translate(65, 95) rotate(-15)">
    <rect x="-12" y="-18" width="24" height="36" rx="3" fill="#374151" stroke="#FFA726" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#FFA726"/>
  </g>

  <!-- Card 2 (Center/Main trick object) -->
  <g transform="translate(145, 80) rotate(25)">
    <rect x="-14" y="-20" width="28" height="40" rx="4" fill="#1F2937" stroke="#FF7043" stroke-width="2"/>
    <path d="M-6 -8 L6 8 M-6 8 L6 -8" stroke="#FF7043" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Character Action (Sleight of hand / "giở trò") -->
  <!-- Torso & Shoulders -->
  <path d="M 85 175 C 85 145 100 135 120 135 C 140 135 155 145 155 175 Z" fill="#3B82F6"/>

  <!-- Head -->
  <circle cx="120" cy="110" r="18" fill="#FBBF24"/>
  <!-- Playful/Scheming expression (implied by head tilt and dynamic pose) -->
  <path d="M 112 112 Q 120 118 128 112" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Back Arm (Holding/Hiding something) -->
  <path d="M 95 145 L 75 125 L 85 115" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="85" cy="115" r="6" fill="#FBBF24"/>

  <!-- Front Arm (Dynamic action gesture, performing the trick) -->
  <path d="M 145 145 L 165 110 L 150 95" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="95" r="6" fill="#FBBF24"/>

  <!-- Magic Sparkles / Action Highlights -->
  <path d="M 175 70 L 178 78 L 186 81 L 178 84 L 175 92 L 172 84 L 164 81 L 172 78 Z" fill="#FFA726"/>
  <path d="M 55 105 L 57 110 L 62 112 L 57 114 L 55 119 L 53 114 L 48 112 L 53 110 Z" fill="#FF7043" transform="scale(0.8) translate(20, 20)"/>
</svg>