<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Police Light Gradients & Glows -->
    <linearGradient id="red-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="blue-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.6"/>
    </linearGradient>
    
    <radialGradient id="red-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Urban Alley Background Environment -->
  <!-- Brick Wall Left -->
  <path d="M0 0 L70 0 L70 240 L0 240 Z" fill="#1b263b" opacity="0.7"/>
  <path d="M70 0 L190 240 L0 240 Z" fill="#0f172a" opacity="0.9"/> <!-- Ground Perspective -->
  
  <!-- Brick Pattern Left Wall -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="40" x2="70" y2="40"/>
    <line x1="0" y1="80" x2="70" y2="80"/>
    <line x1="0" y1="120" x2="70" y2="120"/>
    <line x1="0" y1="160" x2="70" y2="160"/>
    <line x1="0" y1="200" x2="70" y2="200"/>
    <line x1="35" y1="0" x2="35" y2="240"/>
  </g>

  <!-- Distant City Backdrop -->
  <rect x="130" y="80" width="30" height="100" fill="#334155" opacity="0.3"/>
  <rect x="170" y="60" width="45" height="120" fill="#334155" opacity="0.2"/>
  <rect x="90" y="100" width="35" height="80" fill="#334155" opacity="0.3"/>
  <!-- Windows -->
  <rect x="140" y="90" width="10" height="15" fill="#fbbf24" opacity="0.4"/>
  <rect x="140" y="120" width="10" height="15" fill="#fbbf24" opacity="0.4"/>
  <rect x="180" y="80" width="10" height="15" fill="#fbbf24" opacity="0.3"/>

  <!-- Dynamic Police Flashing Lights (Atmosphere) -->
  <circle cx="20" cy="20" r="80" fill="url(#red-glow)"/>
  <circle cx="220" cy="40" r="90" fill="url(#blue-glow)"/>

  <!-- Action Scene: Police Officer capturing the Villain (歹徒) -->
  <g filter="url(#shadow)">
    
    <!-- Bag of Stolen Goods (Dropped prop for the villain) -->
    <g transform="translate(100, 180)">
      <path d="M-12 10 Q -15 -10 0 -18 Q 15 -10 12 10 Z" fill="#b45309"/>
      <path d="M-5 -18 Q 0 -25 5 -18" fill="none" stroke="#78350f" stroke-width="3"/>
      <circle cx="-3" cy="-2" r="3" fill="#f59e0b"/>
      <circle cx="4" cy="4" r="2.5" fill="#10b981"/>
    </g>

    <!-- Villain Character (歹徒) - Struggling / Caught -->
    <g id="villain" transform="translate(90, 115)">
      <!-- Villain Body Bent Forward -->
      <path d="M 15 35 Q 25 55 35 75 L 15 80 Q 5 60 -5 40 Z" fill="#334155"/> <!-- Legs -->
      
      <!-- Villain Torso -->
      <path d="M 20 20 Q 30 40 10 50 L -10 30 Q 10 10 20 20 Z" fill="#0f172a"/> <!-- Dark robber hoodie -->
      <path d="M -5 35 L -20 50" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/> <!-- Back Arm -->

      <!-- Villain Head (Surprised/Caught expression) -->
      <circle cx="25" cy="10" r="14" fill="#fcd34d"/> <!-- Skin -->
      <path d="M 10 5 Q 25 -2 35 8 L 38 4 Q 25 -6 11 0 Z" fill="#1e293b"/> <!-- Messy dark hair/mask -->
      <!-- Eyes wide in shock -->
      <circle cx="22" cy="9" r="2.5" fill="#1e293b"/>
      <circle cx="30" cy="11" r="2.5" fill="#1e293b"/>
      <circle cx="23" cy="8" r="1" fill="#ffffff"/>
      <circle cx="31" cy="10" r="1" fill="#ffffff"/>
      <!-- Open mouth gasping -->
      <ellipse cx="27" cy="16" rx="2.5" ry="3.5" fill="#7f1d1d"/>

      <!-- Struggling Front Arm being pulled back -->
      <path d="M 10 35 L -10 45" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-12" cy="46" r="6" fill="#fcd34d"/> <!-- Hand -->
    </g>

    <!-- Police Officer Character - Confidently subduing -->
    <g id="police-officer" transform="translate(135, 95)">
      <!-- Police Legs -->
      <path d="M -15 50 L -25 90 L -5 90 L 5 55 Z" fill="#1e3a8a"/>
      <path d="M 5 50 L 15 90 L 35 90 L 20 55 Z" fill="#1e3a8a"/>

      <!-- Police Torso (Uniform) -->
      <path d="M -20 20 L 25 20 L 15 60 L -15 60 Z" fill="#2563eb"/>
      <path d="M -2 20 L -2 60" stroke="#1d4ed8" stroke-width="3"/> <!-- Uniform detail -->
      <!-- Police Badge / Pocket -->
      <rect x="5" y="30" width="6" height="8" rx="1" fill="#f59e0b"/>

      <!-- Police Head & Cap -->
      <circle cx="2" cy="0" r="13" fill="#fcd34d"/> <!-- Face -->
      <!-- Determined Expression -->
      <path d="M -4 -2 L 8 0" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <circle cx="6" cy="3" r="1.5" fill="#1e293b"/>
      <path d="M 2 9 Q 6 12 10 9" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Police Cap -->
      <path d="M -12 -8 L 16 -8 Q 18 -16 2 -18 Q -14 -16 -12 -8 Z" fill="#1e3a8a"/>
      <path d="M -14 -7 L 18 -7 L 15 -3 L -11 -3 Z" fill="#0f172a"/> <!-- Visor -->
      <ellipse cx="2" cy="-10" rx="4" ry="2" fill="#f59e0b"/> <!-- Cap badge -->

      <!-- Officer Arm Subduing (Holding Villain's wrist/arm) -->
      <path d="M -15 30 L -45 42" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-47" cy="43" r="6" fill="#fcd34d"/> <!-- Officer Hand -->

      <!-- Metallic Handcuff Effect (The Capture!) -->
      <circle cx="-25" cy="44" r="5" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="-35" cy="43" r="5" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="-30" y1="44" x2="-30" y2="44" stroke="#94a3b8" stroke-width="3"/>
    </g>

    <!-- Police Officer Other Arm / Walkie Talkie / Action Posture -->
    <g transform="translate(135, 95)">
      <path d="M 15 25 L 35 40" stroke="#2563eb" stroke-width="11" stroke-linecap="round"/>
      <circle cx="37" cy="42" r="5.5" fill="#fcd34d"/>
    </g>

  </g>

  <!-- Foreground / Ground Details -->
  <ellipse cx="120" cy="200" rx="90" ry="15" fill="#0b0f19" opacity="0.6"/>

  <!-- Police Vehicle Siren Beams (Top Right Corner) -->
  <g transform="translate(200, 30)">
    <!-- Siren Light Fixture -->
    <path d="M -10 5 L 10 5 L 6 -5 L -6 -5 Z" fill="#334155"/>
    <path d="M -8 -5 L 8 -5 Q 10 -12 0 -15 Q -10 -12 -8 -5 Z" fill="#ef4444"/>
    <ellipse cx="0" cy="-10" rx="6" ry="3" fill="#fca5a5" filter="url(#shadow)"/>
    
    <!-- Light Beamcone Projection -->
    <polygon points="0,-10 -70,180 30,180" fill="url(#red-light)" opacity="0.15" style="mix-blend-mode: screen;"/>
  </g>

  <g transform="translate(170, 20)">
    <!-- Second Siren (Blue) -->
    <path d="M -10 5 L 10 5 L 6 -5 L -6 -5 Z" fill="#334155"/>
    <path d="M -8 -5 L 8 -5 Q 10 -12 0 -15 Q -10 -12 -8 -5 Z" fill="#3b82f6"/>
    <ellipse cx="0" cy="-10" rx="6" ry="3" fill="#93c5fd" filter="url(#shadow)"/>
    
    <!-- Light Beamcone Projection -->
    <polygon points="0,-10 -90,210 0,210" fill="url(#blue-light)" opacity="0.15" style="mix-blend-mode: screen;"/>
  </g>

</svg>