<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Character: The Observant Woman -->
  <g transform="translate(60, 60)">
    <!-- Hair -->
    <path d="M20 10 C 10 10, 5 30, 5 50 L 60 50 C 60 30, 55 10, 45 10 Z" fill="#fb923c"/>
    <!-- Face -->
    <circle cx="32" cy="45" r="25" fill="#fde68a"/>
    <!-- Eyes (Focusing) -->
    <ellipse cx="22" cy="42" rx="4" ry="2" fill="#0f172a"/>
    <ellipse cx="42" cy="42" rx="4" ry="2" fill="#0f172a"/>
    <!-- Glasses -->
    <rect x="15" y="35" width="14" height="14" rx="2" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <rect x="35" y="35" width="14" height="14" rx="2" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <line x1="29" y1="42" x2="35" y2="42" stroke="#38bdf8" stroke-width="2"/>
  </g>
  
  <!-- Magnifying Glass (The tool of observation) -->
  <g transform="translate(130, 100)">
    <circle cx="40" cy="40" r="30" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <path d="M60 60 L 85 85" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- Focus Effect -->
    <circle cx="40" cy="40" r="25" fill="#38bdf8" opacity="0.2"/>
  </g>
  
  <!-- Evidence/Document -->
  <rect x="30" y="170" width="80" height="60" rx="4" fill="#e2e8f0"/>
  <line x1="40" y1="185" x2="100" y2="185" stroke="#94a3b8" stroke-width="4"/>
  <line x1="40" y1="200" x2="100" y2="200" stroke="#94a3b8" stroke-width="4"/>
  <line x1="40" y1="215" x2="80" y2="215" stroke="#94a3b8" stroke-width="4"/>
  
  <!-- Spotlight/Glow -->
  <circle cx="170" cy="130" r="60" fill="#fbbf24" opacity="0.05"/>
  <circle cx="170" cy="130" r="30" fill="#fbbf24" opacity="0.1"/>
</svg>