<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <g id="object-container" transform="translate(0, 5)">
    <!-- Document/Idea Paper representing an intention or thought (辞职意向书/想法) -->
    <g transform="translate(70, 45)">
      <!-- Paper Shadow -->
      <path d="M15,15 H85 V115 H15 Z" fill="#12141A" opacity="0.5"/>
      <!-- Paper Base -->
      <path d="M12,12 H82 V112 H12 Z" fill="#E2E8F0" rx="4"/>
      <!-- Folded corner effect -->
      <path d="M68,12 L82,26 V12 Z" fill="#CBD5E1"/>
      
      <!-- Content lines on document (representing text) -->
      <rect x="24" y="28" width="44" height="6" rx="3" fill="#64748B"/>
      <rect x="24" y="44" width="34" height="4" rx="2" fill="#94A3B8"/>
      <rect x="24" y="56" width="40" height="4" rx="2" fill="#94A3B8"/>
      <rect x="24" y="68" width="28" height="4" rx="2" fill="#94A3B8"/>

      <!-- Stamp/Marker overlay showing cancellation/dismissal -->
      <circle cx="47" cy="62" r="32" fill="none" stroke="#EF4444" stroke-width="4" opacity="0.85"/>
      <line x1="28" y1="43" x2="66" y2="81" stroke="#EF4444" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- Hand sweeping away / discarding the idea (gạt bỏ, từ bỏ) -->
    <g transform="translate(0, 0)">
      <!-- Motion trail lines -->
      <path d="M60,145 Q80,130 95,120" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" opacity="0.6"/>
      <path d="M75,160 Q95,145 110,135" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

      <!-- Dynamic Hand gesture pushing/swiping away -->
      <path d="M 45,175 C 45,175 60,140 85,130 C 105,122 135,130 145,145 C 150,153 145,165 130,165 C 115,165 95,170 85,185 C 75,200 50,195 45,175 Z" fill="#F59E0B"/>
      <!-- Cuff/Wrist -->
      <path d="M42,175 L30,195 L55,205 L65,185 Z" fill="#0284C7"/>
    </g>

    <!-- Sparkles/fragments representing the dispelled impulse fading out -->
    <g fill="#FBBF24">
      <circle cx="165" cy="55" r="3"/>
      <circle cx="178" cy="72" r="2"/>
      <circle cx="155" cy="95" r="4"/>
      <path d="M150,45 L153,51 L159,54 L153,57 L150,63 L147,57 L141,54 L147,51 Z" opacity="0.9"/>
    </g>
  </g>
</svg>