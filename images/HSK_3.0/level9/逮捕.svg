<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Police Light Glow Gradients -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Streetlight Cone Gradient -->
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Clip Path for Canvas Bounds -->
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <!-- Container -->
  <g clip-path="url(#canvasClip)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>

    <!-- Dynamic Police Lights Flash Background Layer -->
    <ellipse cx="60" cy="40" rx="90" ry="50" fill="url(#blueGlow)"/>
    <ellipse cx="180" cy="40" rx="90" ry="50" fill="url(#redGlow)"/>

    <!-- ENVIRONMENT / URBAN STREET SCENE -->
    <!-- Far buildings / Skyline -->
    <path d="M0 160 L0 100 L25 100 L25 85 L45 85 L45 160 Z" fill="#1e293b" opacity="0.7"/>
    <path d="M40 160 L40 60 L75 60 L75 160 Z" fill="#090d16" opacity="0.8"/>
    <path d="M70 160 L70 115 L105 115 L105 160 Z" fill="#1e293b" opacity="0.6"/>
    <path d="M150 160 L150 75 L190 75 L190 160 Z" fill="#090d16" opacity="0.9"/>
    <path d="M185 160 L185 95 L240 95 L240 160 Z" fill="#1e293b" opacity="0.7"/>

    <!-- Building Windows (Lit) -->
    <rect x="52" y="70" width="6" height="8" rx="1" fill="#fde047" opacity="0.4"/>
    <rect x="63" y="70" width="6" height="8" rx="1" fill="#fde047" opacity="0.3"/>
    <rect x="52" y="85" width="6" height="8" rx="1" fill="#38bdf8" opacity="0.5"/>
    <rect x="63" y="85" width="6" height="8" rx="1" fill="#fde047" opacity="0.4"/>

    <rect x="160" y="85" width="8" height="10" rx="1" fill="#fde047" opacity="0.5"/>
    <rect x="174" y="85" width="8" height="10" rx="1" fill="#fde047" opacity="0.2"/>
    <rect x="160" y="105" width="8" height="10" rx="1" fill="#38bdf8" opacity="0.4"/>

    <!-- Street Pavement & Ground -->
    <rect x="0" y="160" width="240" height="80" fill="#0b0f19"/>
    <!-- Sidewalk Curb -->
    <rect x="0" y="155" width="240" height="8" fill="#334155"/>
    <rect x="0" y="153" width="240" height="2" fill="#64748b"/>
    <!-- Road Surface Markings -->
    <path d="M0 190 Q120 185 240 195" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 12" fill="none"/>
    <path d="M0 215 Q120 210 240 220" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 16" fill="none" opacity="0.5"/>

    <!-- Street Lamp Pole & Cone -->
    <rect x="205" y="60" width="6" height="100" fill="#475569"/>
    <path d="M208 60 L130 200 L240 200 Z" fill="url(#lightCone)" style="mix-blend-mode: screen;"/>
    <circle cx="208" cy="60" r="8" fill="#fde047"/>

    <!-- Police Car Silhouette/Context in Background -->
    <path d="M15 170 L50 170 L65 150 L100 150 L115 170 L140 170 L140 190 L15 190 Z" fill="#1e3a8a"/>
    <rect x="35" y="155" width="25" height="15" rx="3" fill="#60a5fa" opacity="0.3"/>
    <rect x="75" y="155" width="25" height="15" rx="3" fill="#60a5fa" opacity="0.3"/>
    <!-- Flashing Bar on Car -->
    <rect x="65" y="145" width="10" height="5" rx="2" fill="#ef4444"/>
    <rect x="75" y="145" width="10" height="5" rx="2" fill="#3b82f6"/>

    <!-- MAIN CHARACTERS: POLICE OFFICER & SUSPECT -->
    
    <!-- SUSPECT (Nghi phạm - Center-Left) -->
    <g id="suspect" transform="translate(15, 0)">
      <!-- Shadow -->
      <ellipse cx="75" cy="210" rx="18" ry="6" fill="#020617"/>
      
      <!-- Suspect Body/Torso (Orange/Grey Jumpsuit or Hoodie) -->
      <path d="M60 160 L90 160 L98 210 L52 210 Z" fill="#ea580c"/>
      <!-- Hoodie Details -->
      <path d="M75 160 L75 210" stroke="#c2410c" stroke-width="3"/>
      <path d="M65 170 L85 170" stroke="#c2410c" stroke-width="2"/>

      <!-- Suspect Head & Hair -->
      <circle cx="75" cy="138" r="16" fill="#fbcfe8"/> <!-- Skin base -->
      <path d="M59 135 C59 122 91 122 91 135 C91 140 85 138 75 136 C65 138 59 140 59 135 Z" fill="#334155"/> <!-- Messy hair -->
      
      <!-- Surrendered / Caught Expression -->
      <!-- Worried eyes -->
      <circle cx="70" cy="137" r="2" fill="#0f172a"/>
      <circle cx="80" cy="137" r="2" fill="#0f172a"/>
      <!-- Worried eyebrows -->
      <path d="M68 132 L72 134" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M82 132 L78 134" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Nervous open mouth -->
      <ellipse cx="75" cy="144" rx="3" ry="4" fill="#0f172a"/>

      <!-- Arms pushed back / cuffed -->
      <!-- Left arm going back -->
      <path d="M62 165 C50 175 45 185 48 195" stroke="#ea580c" stroke-width="9" stroke-linecap="round" fill="none"/>
      <!-- Right arm going back -->
      <path d="M88 165 C100 175 105 185 102 195" stroke="#ea580c" stroke-width="9" stroke-linecap="round" fill="none"/>

      <!-- Handcuffs & Hands in Center/Back -->
      <circle cx="50" cy="195" r="5" fill="#fbcfe8"/>
      <circle cx="100" cy="195" r="5" fill="#fbcfe8"/>
      <!-- Steel Handcuffs Link -->
      <ellipse cx="75" cy="195" rx="14" ry="4" fill="none" stroke="#94a3b8" stroke-width="4"/>
      <circle cx="65" cy="195" r="3" fill="#cbd5e1"/>
      <circle cx="85" cy="195" r="3" fill="#cbd5e1"/>
    </g>

    <!-- POLICE OFFICER (Cảnh sát - Center-Right) -->
    <g id="officer" transform="translate(60, 0)">
      <!-- Shadow -->
      <ellipse cx="75" cy="212" rx="20" ry="7" fill="#020617"/>

      <!-- Legs (Dark Police Uniform Pants) -->
      <path d="M63 180 L63 210 L73 210 L73 180 Z" fill="#0f172a"/>
      <path d="M81 180 L81 210 L91 210 L91 180 Z" fill="#0f172a"/>
      <!-- Police Boots -->
      <path d="M58 210 L73 210 L73 215 L56 215 Z" fill="#020617"/>
      <path d="M79 210 L94 210 L94 215 L77 215 Z" fill="#020617"/>

      <!-- Officer Torso (Police Uniform Shirt & Vest) -->
      <path d="M60 140 L90 140 L95 180 L55 180 Z" fill="#1e3a8a"/>
      <!-- Tactical Vest / Belt -->
      <rect x="57" y="155" width="36" height="15" rx="2" fill="#0f172a"/>
      <rect x="70" y="158" width="10" height="9" rx="1" fill="#3b82f6" opacity="0.6"/> <!-- Radio/Badge -->
      <line x1="75" y1="140" x2="75" y2="155" stroke="#93c5fd" stroke-width="2"/> <!-- Shirt buttons/zip -->

      <!-- Officer Head & Cap -->
      <circle cx="75" cy="120" r="15" fill="#fbcfe8"/>
      <!-- Police Cap -->
      <path d="M58 116 C58 105 92 105 92 116 Z" fill="#1e3a8a"/>
      <path d="M55 116 L95 116 L98 120 L52 120 Z" fill="#0f172a"/> <!-- Cap Visor/Peak -->
      <ellipse cx="75" cy="116" rx="17" ry="4" fill="#3b82f6"/> <!-- Cap Band -->
      
      <!-- Officer Determined Expression -->
      <circle cx="70" cy="120" r="1.5" fill="#0f172a"/>
      <circle cx="80" cy="120" r="1.5" fill="#0f172a"/>
      <path d="M68 116 L73 118" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M82 116 L77 118" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M73 126 Q75 128 77 126" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Left Arm (Holding Suspect's Shoulder/Arm securely) -->
      <path d="M60 145 C45 150 35 160 30 175" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round" fill="none"/>
      <circle cx="30" cy="175" r="4" fill="#fbcfe8"/>

      <!-- Right Arm (Reaching forward to cuff / guide suspect) -->
      <path d="M90 145 C105 155 112 175 105 190" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round" fill="none"/>
      <circle cx="105" cy="190" r="4" fill="#fbcfe8"/>
      <!-- Handcuff in Officer's Hand ready or holding link -->
      <circle cx="102" cy="190" r="6" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    </g>

    <!-- DRAMATIC LIGHTING OVERLAYS -->
    <!-- Top-down rim light highlight -->
    <path d="M0 0 L240 0 L240 240 L0 240 Z" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.15"/>

    <!-- Foreground Atmosphere / Dust Specks -->
    <circle cx="40" cy="100" r="1.5" fill="#38bdf8" opacity="0.6"/>
    <circle cx="110" cy="80" r="2" fill="#fde047" opacity="0.5"/>
    <circle cx="190" cy="120" r="1" fill="#ef4444" opacity="0.7"/>
    <circle cx="140" cy="50" r="2" fill="#38bdf8" opacity="0.4"/>
    <circle cx="80" cy="65" r="1.5" fill="#fde047" opacity="0.6"/>

    <!-- Subtle Vignette Frame Border -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.8"/>
  </g>
</svg>