<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="30" y="140" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="155" width="10" height="60" fill="#475569"/>
  <rect x="190" y="155" width="10" height="60" fill="#475569"/>
  
  <!-- Character: Frustrated person looking at a complex blueprint/puzzle -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <path d="M-10 -5 Q -5 -10 0 -5 T 10 -5" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M-8 5 Q 0 12 8 5" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="-30" y="25" width="60" height="40" rx="5" fill="#94a3b8"/>
  </g>
  
  <!-- Complex tangled wires/gears on desk -->
  <path d="M60 140 L 70 120 L 90 130 L 110 110 L 130 125" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="140" cy="120" r="8" fill="#fb923c"/>
  <circle cx="160" cy="135" r="6" fill="#ec4899"/>
  
  <!-- Magnifying glass focus -->
  <circle cx="170" cy="90" r="20" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="185" y1="105" x2="200" y2="120" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Floating "complex" indicators -->
  <rect x="40" y="50" width="30" height="20" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="50" y="60" width="30" height="20" rx="2" fill="#fbbf24" opacity="0.6"/>
  <rect x="60" y="70" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.6"/>
</svg>