<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle warm kitchen ambient glow for context -->
  <circle cx="120" cy="120" r="90" fill="#252A34" opacity="0.6"/>

  <!-- Character 1 (Mother/Main cook, left side, slightly busy) -->
  <g transform="translate(75, 115)">
    <!-- Body/Apron -->
    <path d="M-15 45 C-15 30 -5 20 0 20 C5 20 15 30 15 45 L20 85 L-20 85 Z" fill="#3E4C59"/>
    <path d="M-10 35 L10 35 L15 85 L-15 85 Z" fill="#F0F4F8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="16" fill="#F6C90E"/>
    <!-- Hair -->
    <path d="M-16 0 C-16 -12 -8 -18 0 -18 C8 -18 16 -12 16 -2 L14 10 L10 4 Z" fill="#2C3E50"/>
    <!-- Busy arms holding a platter/bowl -->
    <path d="M-12 35 C-25 35 -30 50 -20 55" fill="none" stroke="#F6C90E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Cooking Table / Prep surface -->
  <path d="M50 170 L190 170 L180 200 L60 200 Z" fill="#2C3E50"/>
  <rect x="70" y="155" width="60" height="15" rx="3" fill="#E67E22"/>

  <!-- Character 2 (The Helper / Trợ thủ - right side, supportive, smiling, handing over a bowl) -->
  <g transform="translate(155, 105)">
    <!-- Body -->
    <path d="M-15 45 C-15 30 -5 20 0 20 C5 20 15 30 15 45 L22 95 L-22 95 Z" fill="#3498DB"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="16" fill="#F6C90E"/>
    <!-- Hair (Modern youthful style) -->
    <path d="M-16 -2 C-14 -16 0 -18 12 -12 C18 -8 16 6 16 6 L10 4 C10 4 8 -10 0 -10 C-8 -10 -14 0 -16 -2 Z" fill="#E67E22"/>
    
    <!-- Supportive gesture / Helper arm reaching forward with bowl -->
    <path d="M-12 35 C-30 35 -45 45 -55 40" fill="none" stroke="#F6C90E" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Red festive bowl being passed (symbolizing New Year preparation / teamwork) -->
    <g transform="translate(-62, 38)">
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="#E74C3C"/>
      <path d="M-10 0 L-6 10 C-3 12 3 12 6 10 L10 0 Z" fill="#C0392B"/>
    </g>
  </g>

  <!-- Floating Sparkles / Accent highlights indicating "得力" (efficient/helpful teamwork) -->
  <g fill="#F1C40F">
    <circle cx="110" cy="70" r="3" />
    <circle cx="125" cy="62" r="2" />
    <polygon points="118,50 120,55 125,57 120,59 118,64 116,59 111,57 116,55" />
    
    <polygon points="145,130 146,133 149,134 146,135 145,138 144,135 141,134 144,133" />
  </g>

</svg>