<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stylized Ocean Waves at Bottom -->
  <path d="M 20 200 C 60 190, 80 210, 120 200 C 160 190, 180 210, 220 200 L 220 220 L 20 220 Z" fill="#243b55" opacity="0.6"/>
  <path d="M 20 208 C 50 198, 90 218, 130 208 C 170 198, 200 218, 220 208 L 220 220 L 20 220 Z" fill="#1f4068" opacity="0.8"/>
  <path d="M 10 215 C 60 205, 110 225, 160 215 C 190 208, 210 218, 230 215 L 230 230 L 10 230 Z" fill="#132743"/>
  
  <!-- Dynamic Wind Gust Lines -->
  <path d="M 30 70 L 80 70" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 20 95 L 60 95" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 40 120 L 70 120" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Boat Hull -->
  <path d="M 85 185 L 155 185 C 160 185, 163 192, 155 195 L 85 195 C 77 192, 80 185, 85 185 Z" fill="#b0bec5"/>
  
  <!-- Mast -->
  <rect x="118" y="55" width="4" height="132" rx="2" fill="#90a4ae"/>
  
  <!-- Main Sail (Cánh buồm - Fān) with Orange/Gold Focus Accent -->
  <path d="M 120 60 C 90 90, 85 140, 85 180 C 110 180, 115 140, 120 60 Z" fill="#ffb74d" opacity="0.9"/>
  <path d="M 122 65 C 145 95, 155 140, 157 178 C 135 178, 128 140, 122 65 Z" fill="#ffa726"/>
  
  <!-- Sail Curvature / Detail Lines -->
  <path d="M 102 105 C 108 125, 110 145, 112 165" stroke="#ffe082" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 138 100 C 142 122, 144 145, 146 168" stroke="#ffcc80" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Wind Action Highlights on Sail -->
  <path d="M 105 85 C 112 90, 115 98, 118 105" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>