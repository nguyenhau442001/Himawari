<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative glow/ambience for spring theme -->
  <circle cx="120" cy="120" r="80" fill="#2E4033" opacity="0.4"/>

  <!-- Adjective / Describing Word Contrast:
       Dull, muted gray/brown lifeless soil on the left side vs. 
       Vibrant, bursting, oversized "cuìlǜ" (vivid emerald green) fresh sprout on the right side.
       This visual contrast highlights the state/quality of "翠绿" (vivid, lush emerald green). -->

  <!-- Left Side: Dull / Lifeless ground context -->
  <path d="M 40 160 Q 80 155 120 160" stroke="#374151" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 50 165 C 60 162, 70 168, 80 164" stroke="#4B5563" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Right Side: Vibrant Spring Ground -->
  <path d="M 120 160 Q 160 165 200 160" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Central Focus: Oversized, vibrant emerald green sprout (cuìlǜ state) -->
  <!-- Soil mound -->
  <ellipse cx="120" cy="165" rx="35" ry="12" fill="#334155"/>
  <ellipse cx="120" cy="163" rx="25" ry="8" fill="#475569"/>

  <!-- Main Stem - glowing vibrant green -->
  <path d="M 120 163 C 118 130 125 100 120 75" stroke="#34D399" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Highlight on stem -->
  <path d="M 120 155 C 119 130 123 105 120 85" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Left Leaf - Scale exaggerated to show lush quality -->
  <path d="M 120 110 C 100 105 75 115 65 100 C 60 90, 75 80, 95 90 C 110 97, 120 105, 120 110 Z" fill="#059669"/>
  <!-- Left Leaf Inner Shading/Highlight -->
  <path d="M 120 110 C 105 107, 85 112, 75 102 C 70 96, 80 88, 95 94 C 108 100, 118 107, 120 110 Z" fill="#34D399"/>
  <path d="M 120 110 C 105 108, 90 105, 80 100" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Right Leaf - Scale exaggerated -->
  <path d="M 120 90 C 140 85 165 95 175 80 C 180 70, 165 60, 145 70 C 130 77, 120 85, 120 90 Z" fill="#10B981"/>
  <!-- Right Leaf Inner Highlight -->
  <path d="M 120 90 C 135 87, 155 92, 165 82 C 170 76, 160 68, 145 74 C 132 80, 122 87, 120 90 Z" fill="#6EE7B7"/>
  <path d="M 120 90 C 135 88, 150 85, 160 80" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Top fresh bud -->
  <path d="M 120 75 C 115 60 120 50 120 45 C 120 50, 125 60, 120 75 Z" fill="#34D399"/>
  <path d="M 120 75 C 118 63, 120 55, 120 45" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Floating energy/vitality sparkles representing "令人心旷神怡" (refreshing/exhilarating feeling) -->
  <circle cx="85" cy="65" r="2.5" fill="#FBBF24"/>
  <circle cx="160" cy="55" r="2" fill="#34D399"/>
  <circle cx="150" cy="120" r="3" fill="#FBBF24" opacity="0.8"/>
  <circle cx="75" cy="135" r="1.5" fill="#A7F3D0"/>

  <!-- Ambient light accent (Gold/Orange focus per instructions) -->
  <path d="M 105 35 Q 120 25 135 35" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>