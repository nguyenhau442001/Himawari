<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing background focus effect representing internal reflection -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="115" r="45" fill="#2E3646" opacity="0.4"/>

  <!-- Person Silhouette / Body -->
  <!-- Shoulders and torso -->
  <path d="M 68 185 C 68 155, 90 142, 120 142 C 150 142, 172 155, 172 185 Z" fill="#3A4454"/>
  <!-- Collar / Shirt details -->
  <path d="M 102 142 L 120 162 L 138 142" fill="none" stroke="#4E5D73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="110" y="125" width="20" height="22" rx="4" fill="#E0A96D"/>

  <!-- Head (Thoughtful posture, slightly bowed) -->
  <circle cx="120" cy="98" r="26" fill="#F4B886"/>

  <!-- Hair -->
  <path d="M 94 95 C 94 76, 108 72, 120 72 C 132 72, 146 76, 146 95 C 146 102, 144 105, 144 105 L 140 85 C 135 80, 128 79, 120 79 C 112 79, 105 80, 100 85 L 96 105 C 96 105, 94 102, 94 95 Z" fill="#2C3540"/>

  <!-- Closed thoughtful eye / calm expression -->
  <path d="M 128 98 C 131 99, 134 99, 137 98" fill="none" stroke="#8D5B3C" stroke-width="2" stroke-linecap="round"/>

  <!-- Hand on chin (classic pose for self-reflection / fǎnxǐng) -->
  <!-- Arm & Elbow -->
  <path d="M 120 185 L 105 155 C 102 148, 108 140, 116 142 L 132 148" fill="none" stroke="#3A4454" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand supporting chin -->
  <circle cx="124" cy="116" r="11" fill="#E0A96D"/>
  <path d="M 118 122 C 122 125, 128 124, 132 120" fill="none" stroke="#C68B53" stroke-width="2" stroke-linecap="round"/>

  <!-- Internal Reflection / Insight Element: Glowing Mirror/Mind projection -->
  <!-- Floating translucent thought bubble / introspection mirror above -->
  <path d="M 90 48 C 90 38, 105 32, 120 32 C 135 32, 150 38, 150 48 C 150 58, 135 64, 120 64 C 105 64, 90 58, 90 48 Z" fill="#1F2633" stroke="#F5A623" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="120" cy="48" r="8" fill="#F5A623" opacity="0.8"/>
  <path d="M 117 48 L 121 44 L 125 48 M 121 44 L 121 54" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Focus / Accent Glow Rays -->
  <line x1="75" y1="95" x2="65" y2="95" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="165" y1="95" x2="175" y2="95" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="82" y1="125" x2="72" y2="130" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="158" y1="125" x2="168" y2="130" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>