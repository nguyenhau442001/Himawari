<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Industrial Press Mechanism -->
  <path d="M70 180 L170 180 L160 100 L80 100 Z" fill="#3A3F4B"/>
  <rect x="90" y="60" width="60" height="40" fill="#FFB347"/>
  <rect x="105" y="40" width="30" height="20" fill="#FFB347"/>
  
  <!-- Worker Character (Abstracted flat style) -->
  <g transform="translate(40, 120)">
    <circle cx="20" cy="20" r="12" fill="#E0E0E0"/>
    <path d="M10 35 L30 35 L25 80 L15 80 Z" fill="#E0E0E0"/>
    <path d="M5 40 L15 60" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 40 L25 60" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Boss Character (Abstracted flat style) -->
  <g transform="translate(170, 120)">
    <circle cx="20" cy="20" r="12" fill="#FFB347"/>
    <path d="M10 35 L30 35 L25 80 L15 80 Z" fill="#FFB347"/>
    <path d="M20 35 L20 100" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Motion/Force Lines -->
  <path d="M120 50 L120 90" stroke="#FFB347" stroke-width="4" stroke-dasharray="6 6"/>
  <path d="M110 40 L130 40" stroke="#FFB347" stroke-width="4"/>
  
  <!-- Sweat/Effort Drops -->
  <circle cx="55" cy="110" r="3" fill="#5DADE2"/>
  <circle cx="62" cy="115" r="2" fill="#5DADE2"/>
  
  <!-- The "Squeezing" effect -->
  <path d="M95 100 L145 100" stroke="#FF4747" stroke-width="3"/>
  <path d="M100 105 L140 105" stroke="#FF4747" stroke-width="2"/>
</svg>