<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Border Line -->
  <line x1="120" y1="80" x2="120" y2="200" stroke="#4A5568" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Left Figure (Armed) -->
  <g transform="translate(60, 120)">
    <path d="M-20 0 L-10 0 L-10 -40 L-20 -40 Z" fill="#F6AD55"/>
    <circle cx="-15" cy="-50" r="10" fill="#F6AD55"/>
    <rect x="-35" y="-35" width="10" height="5" fill="#E2E8F0" transform="rotate(-15 -30 -32)"/>
  </g>
  
  <!-- Right Figure (Armed) -->
  <g transform="translate(180, 120)">
    <path d="M10 0 L20 0 L20 -40 L10 -40 Z" fill="#63B3ED"/>
    <circle cx="15" cy="-50" r="10" fill="#63B3ED"/>
    <rect x="25" y="-35" width="10" height="5" fill="#E2E8F0" transform="rotate(15 30 -32)"/>
  </g>
  
  <!-- Tension Lines -->
  <path d="M90 100 L110 100 M90 110 L110 110" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 100 L150 100 M130 110 L150 110" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
</svg>