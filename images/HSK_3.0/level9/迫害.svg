<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Amber Glow for Desk Lamp -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container / Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" fill="url(#spotlight)" />

  <!-- Environmental Context: Prison Bars / Window Shadows (Symbolizing Political Oppression) -->
  <g opacity="0.35">
    <rect x="40" y="0" width="8" height="240" fill="#090d16" />
    <rect x="90" y="0" width="8" height="240" fill="#090d16" />
    <rect x="140" y="0" width="8" height="240" fill="#090d16" />
    <rect x="190" y="0" width="8" height="240" fill="#090d16" />
    <!-- Diagonal harsh light bars cutting across -->
    <polygon points="0,0 80,0 200,240 120,240" fill="#38bdf8" opacity="0.08" />
  </g>

  <!-- Office / Interrogation Desk & Props -->
  <!-- Desk surface -->
  <path d="M 20 180 L 220 180 L 230 220 L 10 220 Z" fill="#334155" />
  <path d="M 20 175 L 220 175 L 220 180 L 20 180 Z" fill="#475569" />

  <!-- Case Files / Documents (Political Dossier) -->
  <g transform="translate(45, 160) rotate(-5)">
    <rect width="45" height="30" rx="2" fill="#cbd5e1" />
    <line x1="8" y1="8" x2="30" y2="8" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="15" x2="37" y2="15" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="21" x2="22" y2="21" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <!-- Red Stamp / Seal of Censorship -->
    <circle cx="33" cy="20" r="7" fill="none" stroke="#ef4444" stroke-width="1.5" />
    <line x1="29" y1="17" x2="37" y2="23" stroke="#ef4444" stroke-width="1.5" />
  </g>

  <g transform="translate(75, 165) rotate(8)">
    <rect width="40" height="28" rx="2" fill="#94a3b8" />
    <line x1="6" y1="7" x2="25" y2="7" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="13" x2="32" y2="13" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <circle cx="30" cy="20" r="5" fill="#ef4444" opacity="0.8" />
  </g>

  <!-- Desk Lamp -->
  <circle cx="185" cy="140" r="25" fill="url(#lampGlow)" />
  <path d="M 175 180 L 195 180 L 190 145 L 180 145 Z" fill="#1e293b" />
  <path d="M 185 145 L 170 120 L 200 120 Z" fill="#f59e0b" />
  <line x1="185" y1="145" x2="185" y2="180" stroke="#cbd5e1" stroke-width="3" />

  <!-- Main Subject: Man sitting, showing exhaustion, resilience, and memory of past persecution -->
  <g id="main-character" transform="translate(0, 5)">
    <!-- Chair Backrest -->
    <rect x="95" y="80" width="50" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <path d="M 105 100 L 135 100" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <path d="M 105 120 L 135 120" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Character Body / Torso (Wearing a muted grey-blue collared shirt, reflecting solemn tone) -->
    <path d="M 90 135 Q 120 120 150 135 L 165 190 L 75 190 Z" fill="#475569" />
    
    <!-- Collar & Tie -->
    <polygon points="105,135 120,150 135,135" fill="#f8fafc" />
    <polygon points="117,148 123,148 125,180 115,180" fill="#b91c1c" />

    <!-- Shoulders & Arms (Crossed or Resting weebly on desk) -->
    <path d="M 90 135 Q 70 150 85 175 L 105 170" fill="#334155" />
    <path d="M 150 135 Q 170 150 155 175 L 135 170" fill="#334155" />

    <!-- Hands (Expressive, slightly clenched or weary) -->
    <circle cx="95" cy="175" r="9" fill="#f1d0a9" />
    <circle cx="145" cy="175" r="9" fill="#f1d0a9" />

    <!-- Neck -->
    <rect x="110" y="115" width="20" height="25" fill="#f1d0a9" />

    <!-- Head -->
    <circle cx="120" cy="95" r="24" fill="#f1d0a9" />

    <!-- Hair (Mature, slightly disheveled grey/dark hair) -->
    <path d="M 96 95 C 96 75, 144 75, 144 95 C 144 95, 142 84, 135 80 C 125 74, 110 74, 103 80 C 97 84, 96 95, 96 95 Z" fill="#334155" />

    <!-- Facial Features (Expressing solemnity, trauma, and deep contemplation) -->
    <!-- Eyebrows (Furrowed slightly with tension) -->
    <path d="M 107 88 L 115 91" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 125 91 L 133 88" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Thoughtful, looking slightly downward) -->
    <circle cx="111" cy="95" r="2.5" fill="#1e293b" />
    <circle cx="129" cy="95" r="2.5" fill="#1e293b" />
    
    <!-- Subtle eye bags (indicating past hardship/sleeplessness) -->
    <path d="M 108 99 Q 111 101 114 99" stroke="#d4b28c" stroke-width="1.5" fill="none" />
    <path d="M 126 99 Q 129 101 132 99" stroke="#d4b28c" stroke-width="1.5" fill="none" />

    <!-- Nose -->
    <path d="M 120 95 L 118 103 L 122 103" fill="none" stroke="#d4b28c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth (Straight, serious line) -->
    <path d="M 113 110 L 127 110" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Narrative Metaphor / Floating Memory Elements (Faint silhouettes of official seals, official stamp mark, badge of oppression fading away) -->
  <g opacity="0.25" transform="translate(165, 55)">
    <polygon points="15,0 30,10 25,25 5,25 0,10" fill="#ef4444" />
    <line x1="8" y1="10" x2="22" y2="10" stroke="#ffffff" stroke-width="2" />
    <line x1="10" y1="16" x2="20" y2="16" stroke="#ffffff" stroke-width="2" />
  </g>

  <g opacity="0.2" transform="translate(30, 75)">
    <circle cx="15" cy="15" r="15" fill="none" stroke="#ef4444" stroke-width="3" />
    <line x1="5" y1="5" x2="25" y2="25" stroke="#ef4444" stroke-width="3" />
  </g>

  <!-- Foreground Atmospheric Particles / Dust illuminated by desk lamp & harsh light -->
  <circle cx="150" cy="110" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="165" cy="95" r="2" fill="#f59e0b" opacity="0.8" />
  <circle cx="140" cy="80" r="1" fill="#ffffff" opacity="0.7" />
  <circle cx="180" cy="100" r="1.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="70" cy="120" r="1.5" fill="#f59e0b" opacity="0.5" />
  <circle cx="55" cy="100" r="2" fill="#ffffff" opacity="0.4" />

  <!-- Outer frame border accent for clean HSK app card aesthetic -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>