<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main Book Object -->
  <rect x="70" y="60" width="100" height="120" rx="4" fill="#343A46" stroke="#FFB86C" stroke-width="2"/>
  <rect x="70" y="60" width="100" height="15" rx="4" fill="#FFB86C"/>
  
  <!-- Pages inside -->
  <rect x="80" y="85" width="80" height="5" rx="2" fill="#4A5568"/>
  <rect x="80" y="100" width="80" height="5" rx="2" fill="#4A5568"/>
  <rect x="80" y="115" width="80" height="5" rx="2" fill="#4A5568"/>
  <rect x="80" y="130" width="80" height="5" rx="2" fill="#4A5568"/>
  
  <!-- Bookmark/Reference marker (The "See Also" indicator) -->
  <path d="M140 50 L140 90 L150 80 L160 90 L160 50 Z" fill="#FF79C6"/>
  
  <!-- Magnifying glass pointing to the appendix/reference section -->
  <circle cx="110" cy="160" r="25" fill="none" stroke="#F8F8F2" stroke-width="4"/>
  <line x1="128" y1="178" x2="150" y2="200" stroke="#F8F8F2" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Detail lines inside lens -->
  <line x1="100" y1="150" x2="120" y2="150" stroke="#F8F8F2" stroke-width="2"/>
  <line x1="100" y1="160" x2="120" y2="160" stroke="#F8F8F2" stroke-width="2"/>
  <line x1="100" y1="170" x2="115" y2="170" stroke="#F8F8F2" stroke-width="2"/>
</svg>