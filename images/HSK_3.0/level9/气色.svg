<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.05" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- UI/Glow Accent Gradient -->
    <linearGradient id="glowAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light from Lamp -->
  <circle cx="180" cy="80" r="120" fill="url(#lampGlow)" />

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Window Frame in Background -->
  <rect x="25" y="45" width="55" height="75" rx="4" fill="#334155" />
  <rect x="29" y="49" width="47" height="67" rx="2" fill="url(#windowGrad)" />
  <!-- Window Crossbars -->
  <line x1="52" y1="49" x2="52" y2="116" stroke="#334155" stroke-width="2" />
  <line x1="29" y1="82" x2="76" y2="82" stroke="#334155" stroke-width="2" />
  <!-- City silhouette outside window -->
  <path d="M32 116 L32 98 L37 98 L37 116 L45 116 L45 90 L50 90 L50 116 L65 116 L65 85 L73 85 L73 116 Z" fill="#1e293b" opacity="0.6" />

  <!-- Bookshelf & Books on the Left -->
  <rect x="15" y="130" width="55" height="8" rx="2" fill="#475569" />
  <rect x="22" y="106" width="10" height="24" rx="1" fill="#f43f5e" />
  <rect x="34" y="110" width="8" height="20" rx="1" fill="#38bdf8" />
  <rect x="44" y="98" width="12" height="32" rx="1" fill="#fbbf24" />

  <!-- Houseplant on Shelf / Table -->
  <path d="M195 138 C195 125 210 125 210 138 Z" fill="#334155" />
  <path d="M202 138 L202 152 C202 154 200 155 198 155 L206 155 C204 155 202 154 202 152 Z" fill="#475569" />
  <!-- Leaves -->
  <path d="M202 138 C190 120 175 125 185 138 C190 145 198 140 202 138 Z" fill="url(#leafGrad)" />
  <path d="M202 138 C215 115 225 125 215 138 C210 145 204 140 202 138 Z" fill="url(#leafGrad)" />
  <path d="M202 138 C202 115 202 110 202 138 Z" fill="url(#leafGrad)" />

  <!-- Warm Hanging Lamp -->
  <path d="M180 0 L180 35" stroke="#475569" stroke-width="2" />
  <path d="M165 35 L195 35 L200 48 L160 48 Z" fill="#cbd5e1" />
  <ellipse cx="180" cy="48" rx="20" ry="6" fill="#fbbf24" />

  <!-- Table / Counter Surface -->
  <rect x="0" y="155" width="240" height="85" fill="#1e293b" />
  <path d="M0 155 L240 155" stroke="#334155" stroke-width="3" />

  <!-- Coffee Mug / Teacup on Table -->
  <path d="M35 150 C35 142 45 142 45 150 L43 170 C43 173 37 173 37 170 Z" fill="#f8fafc" />
  <path d="M44 146 C50 146 50 158 44 158" stroke="#f8fafc" stroke-width="2.5" fill="none" />
  <!-- Steam from cup -->
  <path d="M38 136 C35 130 42 125 38 120" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- CHARACTER 1: FRIEND / SPEAKER (Right side, leaning in with warm expression) -->
  <g transform="translate(130, 65)">
    <!-- Body / Torso -->
    <path d="M50 95 C50 75 75 75 75 95 L85 130 C85 135 40 135 40 130 Z" fill="#38bdf8" />
    <!-- Arm gesturing towards friend -->
    <path d="M55 90 C35 95 15 85 5 95 C0 100 10 105 25 100 C35 98 45 100 55 105 Z" fill="#0284c7" />
    <!-- Neck -->
    <path d="M58 65 L67 65 L67 80 L58 80 Z" fill="#ffd1b3" />
    <!-- Head -->
    <circle cx="62.5" cy="50" r="22" fill="#ffe0cc" />
    <!-- Hair (Stylish brown bob/cut) -->
    <path d="M41 48 C41 30 84 30 84 48 C84 65 75 70 75 60 C75 52 70 42 62.5 42 C55 42 50 52 50 60 C50 70 41 65 41 48 Z" fill="#451a03" />
    <!-- Facial Features: Smiling warmly, eyes crinkled in happiness -->
    <path d="M53 47 C55 44 59 44 61 47" stroke="#332211" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M64 47 C66 44 70 44 72 47" stroke="#332211" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Warm Smiling Mouth -->
    <path d="M58 56 C60 60 65 60 67 56" stroke="#991b1b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks indicating good mood/friendliness -->
    <circle cx="53" cy="53" r="4" fill="#f43f5e" opacity="0.3" />
    <circle cx="72" cy="53" r="4" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- CHARACTER 2: SUBJECT (Left/Center, radiant and glowing with healthy "qìsè") -->
  <g transform="translate(45, 60)">
    <!-- Body / Torso -->
    <path d="M45 100 C45 80 75 80 75 100 L90 170 C90 175 30 175 30 170 Z" fill="#10b981" />
    <!-- Collar details -->
    <path d="M50 100 L60 112 L70 100" fill="#ecfdf5" />

    <!-- Neck -->
    <path d="M53 72 L67 72 L67 90 L53 90 Z" fill="#ffdbbc" />

    <!-- Head -->
    <circle cx="60" cy="55" r="25" fill="#ffe4d0" />

    <!-- Healthy Radiance / Glow over face (Visualizing "qìsè") -->
    <circle cx="60" cy="55" r="26" fill="url(#glowAccent)" />

    <!-- Hair (Dark flowing/neat hair) -->
    <path d="M35 52 C33 25 87 25 85 52 C85 62 82 75 78 65 C75 58 72 45 60 45 C48 45 45 58 42 65 C38 75 35 62 35 52 Z" fill="#1e1b4b" />
    <!-- Hair strands framing face -->
    <path d="M37 50 C37 68 45 75 48 70" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
    <path d="M83 50 C83 68 75 75 72 70" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />

    <!-- Facial Features: Bright, energetic eyes -->
    <!-- Left Eye -->
    <circle cx="51" cy="52" r="3" fill="#1e1b4b" />
    <circle cx="50" cy="51" r="1" fill="#ffffff" />
    <path d="M47 47 C49 45 53 45 55 48" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Right Eye -->
    <circle cx="69" cy="52" r="3" fill="#1e1b4b" />
    <circle cx="68" cy="51" r="1" fill="#ffffff" />
    <path d="M65 48 C67 45 71 45 73 47" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Rosy Healthy Cheeks (Emphasizing "Khí sắc" / Vibrant Complexion) -->
    <circle cx="49" cy="59" r="6" fill="#fb7185" opacity="0.5" />
    <circle cx="71" cy="59" r="6" fill="#fb7185" opacity="0.5" />

    <!-- Confident, Healthy Smile -->
    <path d="M53 62 C56 67 64 67 67 62" stroke="#9f1239" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Subtle lip highlight -->
    <path d="M55 64 C58 66 62 66 65 64" fill="#fda4af" opacity="0.6" />
  </g>

  <!-- FOREGROUND PROPS / ACCENTS -->
  <!-- Small table item: Mirror or cosmetic jar (indicating self-care/wellness) -->
  <ellipse cx="105" cy="165" rx="12" ry="5" fill="#0f172a" opacity="0.4" />
  <rect x="99" y="152" width="12" height="14" rx="2" fill="#38bdf8" />
  <path d="M97 152 L113 152 L110 148 L100 148 Z" fill="#cbd5e1" />

  <!-- Sparkles / Vitality indicators near the glowing healthy person -->
  <path d="M35 85 L37 90 L42 92 L37 94 L35 99 L33 94 L28 92 L33 90 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M110 95 L111 98 L114 99 L111 100 L110 103 L109 100 L106 99 L109 98 Z" fill="#38bdf8" opacity="0.7" />
  <path d="M25 130 L26 132 L28 133 L26 134 L25 136 L24 134 L22 133 L24 132 Z" fill="#34d399" opacity="0.8" />

</svg>