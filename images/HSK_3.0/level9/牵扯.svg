<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- Background Environment: Office/Investigation Wall -->
  <rect x="24" y="24" width="192" height="192" rx="12" fill="url(#boardGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Connecting Lines Network (Representing '牵扯' - involvement/interconnection) -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M 65 95 L 120 70 L 175 95 L 145 155 L 95 155 Z"/>
    <line x1="120" y1="70" x2="120" y2="125"/>
    <line x1="65" y1="95" x2="120" y2="125"/>
    <line x1="175" y1="95" x2="120" y2="125"/>
  </g>

  <!-- Connected Sticky Notes/Photos (Representing "many people involved") -->
  <!-- Top Center Photo/Note -->
  <g transform="translate(108, 55)">
    <rect x="0" y="0" width="24" height="28" rx="2" fill="#fbbf24"/>
    <circle cx="12" cy="10" r="5" fill="#1e293b" opacity="0.8"/>
    <path d="M 6 20 C 6 18 18 18 18 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="3" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Left Photo/Note -->
  <g transform="translate(48, 80)">
    <rect x="0" y="0" width="26" height="28" rx="2" fill="#38bdf8"/>
    <circle cx="13" cy="10" r="5" fill="#1e293b" opacity="0.8"/>
    <path d="M 7 20 C 7 18 19 18 19 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="13" cy="3" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Right Photo/Note -->
  <g transform="translate(166, 80)">
    <rect x="0" y="0" width="26" height="28" rx="2" fill="#10b981"/>
    <circle cx="13" cy="10" r="5" fill="#1e293b" opacity="0.8"/>
    <path d="M 7 20 C 7 18 19 18 19 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="13" cy="3" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Bottom Left Note -->
  <g transform="translate(78, 140)">
    <rect x="0" y="0" width="24" height="26" rx="2" fill="#ec4899"/>
    <circle cx="12" cy="9" r="4" fill="#1e293b" opacity="0.8"/>
    <circle cx="12" cy="3" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Bottom Right Note -->
  <g transform="translate(138, 140)">
    <rect x="0" y="0" width="24" height="26" rx="2" fill="#fb923c"/>
    <circle cx="12" cy="9" r="4" fill="#1e293b" opacity="0.8"/>
    <circle cx="12" cy="3" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Main Central Focus Node (The core complex issue) -->
  <circle cx="120" cy="125" r="14" fill="#ef4444" stroke="#f87171" stroke-width="3"/>
  <circle cx="120" cy="125" r="6" fill="#ffffff"/>

  <!-- Foreground Main Character (Investigating / Pointing at the complex web) -->
  <!-- Character Body / Shoulders -->
  <path d="M 90 220 L 95 190 C 100 180 140 180 145 190 L 150 220 Z" fill="#3b82f6"/>
  <!-- Collar / Tie -->
  <polygon points="115,190 125,190 120,205" fill="#ffffff"/>
  <polygon points="118,205 122,205 120,218" fill="#ef4444"/>

  <!-- Character Neck -->
  <rect x="113" y="176" width="14" height="16" fill="#fbcfe8" rx="4"/>

  <!-- Character Head -->
  <circle cx="120" cy="158" r="20" fill="#fbcfe8"/>

  <!-- Hair -->
  <path d="M 100 156 C 100 140 110 136 120 136 C 130 136 140 140 140 156 C 138 150 130 144 120 144 C 110 144 102 150 100 156 Z" fill="#0f172a"/>

  <!-- Concerned Facial Expression -->
  <path d="M 112 152 Q 116 148 120 152" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 124 152 Q 128 148 132 152" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="116" cy="156" r="2" fill="#1e293b"/>
  <circle cx="128" cy="156" r="2" fill="#1e293b"/>
  <!-- Puzzled Mouth -->
  <path d="M 117 167 Q 120 164 123 167" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Pointing Arm reaching up to the center node -->
  <path d="M 135 190 C 150 180 160 150 155 135" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Hand pointing -->
  <circle cx="153" cy="132" r="5" fill="#fbcfe8"/>

  <!-- Desk Surface at bottom for grounding -->
  <path d="M 24 210 L 216 210 L 216 220 L 24 220 Z" fill="#475569" opacity="0.8"/>
  <rect x="105" y="202" width="30" height="8" rx="2" fill="#94a3b8"/>
  
  <!-- Ambient Highlights / Red Pins and Connection Pulses -->
  <circle cx="120" cy="70" r="3" fill="#fbbf24"/>
  <circle cx="65" cy="95" r="3" fill="#38bdf8"/>
  <circle cx="175" cy="95" r="3" fill="#10b981"/>
</svg>