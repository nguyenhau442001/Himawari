<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background seismic wave accents -->
  <g opacity="0.15">
    <path d="M 30,190 Q 70,170 110,190 T 190,190" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 20,205 Q 60,185 100,205 T 180,205" fill="none" stroke="#FF5722" stroke-width="1.5"/>
  </g>

  <!-- Ground plane -->
  <rect x="20" y="200" width="200" height="6" rx="3" fill="#2C313C"/>
  <path d="M 20,203 L 220,203" stroke="#FF5722" stroke-width="2" opacity="0.6"/>

  <!-- Collapsing Structure (倒塌) -->
  <g transform="translate(120, 110)">
    <!-- Base debris and dust clouds -->
    <path d="M -70,80 Q -40,75 0,90 Q 40,75 70,80 Z" fill="#2C313C" opacity="0.8"/>
    <circle cx="-50" cy="85" r="12" fill="#3A4150" opacity="0.6"/>
    <circle cx="55" cy="82" r="15" fill="#3A4150" opacity="0.6"/>
    <circle cx="-25" cy="88" r="8" fill="#4B5563" opacity="0.5"/>
    <circle cx="30" cy="86" r="10" fill="#4B5563" opacity="0.5"/>

    <!-- Falling debris fragments -->
    <rect x="-65" y="20" width="12" height="18" rx="2" fill="#E0E6ED" transform="rotate(-25 -59 29)"/>
    <rect x="45" y="10" width="14" height="14" rx="2" fill="#FFA726" transform="rotate(40 52 17)"/>
    <polygon points="-40,55 -25,45 -30,65" fill="#9CA3AF"/>
    <polygon points="35,40 50,55 42,60" fill="#E0E6ED"/>

    <!-- Collapsing walls and roof sections -->
    <!-- Left falling wall segment -->
    <g transform="rotate(-22 -30 20)">
      <rect x="-55" y="-10" width="30" height="75" rx="3" fill="#E0E6ED"/>
      <!-- Windows falling out -->
      <rect x="-47" y="2" width="14" height="16" rx="2" fill="#1A1D24"/>
      <rect x="-47" y="26" width="14" height="16" rx="2" fill="#1A1D24"/>
      <!-- Structural cracks -->
      <path d="M -40,-10 L -30,20 L -50,45" fill="none" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Right tilting wall segment -->
    <g transform="rotate(18 30 20)">
      <rect x="25" y="-10" width="30" height="75" rx="3" fill="#CFD8DC"/>
      <rect x="33" y="2" width="14" height="16" rx="2" fill="#1A1D24"/>
      <rect x="33" y="26" width="14" height="16" rx="2" fill="#1A1D24"/>
      <path d="M 45,-10 L 35,30 L 50,50" fill="none" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Collapsing Roof (Split / Caving in) -->
    <g>
      <!-- Left roof half -->
      <polygon points="-65,-12 -5,-12 -25,-42" fill="#FF5722" transform="rotate(-15 -35 -27)"/>
      <!-- Right roof half -->
      <polygon points="5,-12 65,-12 35,-42" fill="#F57C00" transform="rotate(25 35 -27)"/>
      <!-- Center collapse gap / dust plume -->
      <path d="M -15,-20 Q 0,-35 15,-20 Q 5,-5 -15,-20 Z" fill="#4B5563" opacity="0.7"/>
    </g>

    <!-- Motion/Impact lines -->
    <path d="M -50,60 L -65,75" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50,55 L 68,70" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <path d="M -10,65 L -15,80" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 15,62 L 22,78" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>