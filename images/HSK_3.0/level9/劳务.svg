<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Interior Wall & Window Background Context -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b"/>
  <!-- Modern Office Window showing night city lights -->
  <rect x="150" y="25" width="65" height="85" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
  <path d="M182.5 25 V110 M150 67.5 H215" stroke="#334155" stroke-width="1.5"/>
  <!-- City building lights outside -->
  <rect x="158" y="45" width="6" height="12" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="170" y="70" width="8" height="15" rx="1" fill="#38bdf8" opacity="0.5"/>
  <rect x="195" y="40" width="7" height="25" rx="1" fill="#ec4899" opacity="0.4"/>
  <rect x="185" y="80" width="5" height="15" rx="1" fill="#f59e0b" opacity="0.8"/>

  <!-- Indoor Ambient Light from desk lamp -->
  <path d="M70 120 L30 205 H210 L170 120 Z" fill="#f59e0b" opacity="0.05"/>

  <!-- Office Desk -->
  <path d="M20 160 H220 V168 H20 Z" fill="#334155"/>
  <rect x="35" y="168" width="16" height="50" rx="4" fill="#1e293b"/>
  <rect x="189" y="168" width="16" height="50" rx="4" fill="#1e293b"/>
  <rect x="20" y="155" width="200" height="6" rx="2" fill="#475569"/>

  <!-- Desk Props: Laptop & Coffee Mug -->
  <rect x="150" y="138" width="45" height="18" rx="2" fill="#64748b"/>
  <path d="M145 156 H200 L205 160 H140 Z" fill="#475569"/>
  <!-- Coffee mug -->
  <rect x="125" y="142" width="14" height="16" rx="2" fill="#cbd5e1"/>
  <path d="M139 146 C143 146 143 154 139 154" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <!-- Desk Lamp -->
  <path d="M50 155 L55 110 L60 110" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M45 105 Q57 95 69 105 Z" fill="#fbbf24"/>
  <ellipse cx="57" cy="105" rx="12" ry="4" fill="#f59e0b"/>

  <!-- Character Left (HR / Employer in business casual) -->
  <g transform="translate(10, 0)">
    <!-- Body & Torso -->
    <path d="M45 120 C45 105 65 105 75 120 L85 160 H35 Z" fill="#0ea5e9"/>
    <!-- Collar & Tie -->
    <path d="M55 120 L60 132 L65 120 Z" fill="#ffffff"/>
    <path d="M58 132 L62 132 L63 150 L60 155 L57 150 Z" fill="#e11d48"/>
    <!-- Head & Hair -->
    <circle cx="60" cy="85" r="16" fill="#fbcfe8"/>
    <path d="M46 80 C46 65 74 65 74 80 C74 85 70 82 68 76 C60 70 52 76 46 80 Z" fill="#334155"/>
    <!-- Face Profile (Looking Right) -->
    <circle cx="68" cy="85" r="2" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="62" y="81" width="8" height="6" rx="1" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- Left Arm & Hand pointing / holding side -->
    <path d="M45 125 Q35 140 45 150" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="47" cy="152" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Character Right (Employee / Worker accepting contract) -->
  <g transform="translate(110, 0)">
    <!-- Body & Torso -->
    <path d="M55 120 C55 105 75 105 85 120 L95 160 H45 Z" fill="#10b981"/>
    <!-- Inner Shirt -->
    <path d="M65 120 L70 135 L75 120 Z" fill="#ffffff"/>
    <!-- Head & Hair -->
    <circle cx="70" cy="83" r="16" fill="#fde68a"/>
    <path d="M55 83 C55 68 85 68 85 83 C85 83 80 75 70 75 C60 75 55 83 55 83 Z" fill="#92400e"/>
    <!-- Face -->
    <circle cx="63" cy="83" r="2" fill="#1e293b"/>
    <!-- Right Arm & Hand reaching out to hold contract -->
    <path d="M75 125 Q55 135 42 138" stroke="#10b981" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="39" cy="139" r="5" fill="#fde68a"/>
  </g>

  <!-- Central Focus: The Labor Contract Document (劳务合同) -->
  <g transform="translate(75, 115)">
    <!-- Clipboard / Paper Base -->
    <rect x="0" y="0" width="40" height="50" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Document Header / Clip -->
    <rect x="12" y="-4" width="16" height="8" rx="2" fill="#64748b"/>
    <!-- Mock text lines representing contract clauses -->
    <rect x="6" y="8" width="28" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="6" y="15" width="22" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="6" y="20" width="26" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="6" y="25" width="18" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="6" y="30" width="24" height="2" rx="1" fill="#cbd5e1"/>
    <!-- Signature / Stamp Area -->
    <circle cx="28" cy="40" r="5" fill="#ef4444" opacity="0.8"/>
    <path d="M25 40 L27 42 L32 37" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="6" y="38" width="14" height="2" rx="1" fill="#94a3b8"/>
  </g>

  <!-- Accent glow on the contract to emphasize importance -->
  <circle cx="95" cy="140" r="30" fill="#38bdf8" opacity="0.1" filter="blur(8px)"/>

</svg>