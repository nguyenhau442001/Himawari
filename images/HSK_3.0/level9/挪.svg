<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="room-glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Floor Gradient -->
    <linearGradient id="floor-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="chair-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#room-glow)"/>

  <!-- Interior Wall & Floor -->
  <path d="M0 0 H240 V170 H0 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M0 170 H240 V240 H0 Z" fill="url(#floor-grad)"/>
  
  <!-- Wooden Floor Planks Perspective Lines -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>

  <!-- Background Window with Warm City Glow -->
  <g transform="translate(150, 30)">
    <rect width="60" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="21" height="36" rx="2" fill="#fbbf24" opacity="0.2"/>
    <rect x="33" y="6" width="21" height="36" rx="2" fill="#fbbf24" opacity="0.1"/>
    <rect x="6" y="48" width="21" height="36" rx="2" fill="#fbbf24" opacity="0.15"/>
    <rect x="33" y="48" width="21" height="36" rx="2" fill="#fbbf24" opacity="0.25"/>
    <!-- Window sill -->
    <rect x="2" y="90" width="56" height="4" rx="1" fill="#475569"/>
  </g>

  <!-- Bookshelf / Environment Props -->
  <g transform="translate(20, 40)">
    <rect width="40" height="120" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="40" y2="80" stroke="#334155" stroke-width="1.5"/>
    <!-- Books -->
    <rect x="6" y="15" width="8" height="25" rx="1" fill="#ec4899" opacity="0.8"/>
    <rect x="16" y="18" width="6" height="22" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="8" y="55" width="10" height="25" rx="1" fill="#10b981" opacity="0.8"/>
    <rect x="22" y="58" width="12" height="22" rx="1" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Rug under table and chair -->
  <ellipse cx="110" cy="195" rx="70" ry="25" fill="#334155" opacity="0.5"/>

  <!-- Wooden Desk -->
  <g transform="translate(130, 110)">
    <!-- Desk Top -->
    <path d="M0 10 L80 10 L70 25 L-10 25 Z" fill="#b45309"/>
    <rect x="-10" y="25" width="90" height="6" rx="1" fill="#d97706"/>
    <!-- Desk Legs -->
    <rect x="0" y="31" width="6" height="65" fill="#78350f"/>
    <rect x="64" y="31" width="6" height="65" fill="#78350f"/>
    <!-- Desk Items (Lamp, Notebook) -->
    <path d="M45 10 L55 10 L52 -2 L48 -2 Z" fill="#94a3b8"/>
    <path d="M35 -2 C35 -12 65 -12 65 -2 Z" fill="#fbbf24"/>
    <rect x="15" y="15" width="18" height="12" rx="1" fill="#f8fafc"/>
    <line x1="18" y1="19" x2="28" y2="19" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="18" y1="22" x2="26" y2="22" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Original position ghost chair indicator (Dotted outline showing movement) -->
  <g transform="translate(65, 125)" opacity="0.3">
    <rect x="0" y="20" width="28" height="6" rx="2" fill="none" stroke="#f59e0b" stroke-dasharray="3 3" stroke-width="1.5"/>
    <path d="M4 20 L4 -5 C4 -10 24 -10 24 -5 L24 20" fill="none" stroke="#f59e0b" stroke-dasharray="3 3" stroke-width="1.5"/>
    <rect x="2" y="30" width="3" height="35" rx="1.5" fill="none" stroke="#f59e0b" stroke-dasharray="3 3" stroke-width="1.5"/>
    <rect x="23" y="30" width="3" height="35" rx="1.5" fill="none" stroke="#f59e0b" stroke-dasharray="3 3" stroke-width="1.5"/>
  </g>

  <!-- Motion Curved Arrows (Visualizing 'Nuó' - shifting/moving) -->
  <path d="M 80 135 Q 95 115 110 132" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="112,130 115,140 105,137" fill="#38bdf8"/>

  <!-- The Chair Being Moved (Active Placement) -->
  <g transform="translate(100, 130)">
    <!-- Chair Seat -->
    <rect x="0" y="15" width="28" height="6" rx="2" fill="url(#chair-grad)"/>
    <!-- Chair Backrest -->
    <path d="M4 15 L4 -8 C4 -13 24 -13 24 -8 L24 15" fill="url(#chair-grad)"/>
    <!-- Cutout in Backrest -->
    <path d="M8 3 L20 3 L20 -3 L8 -3 Z" fill="#1e293b" opacity="0.3"/>
    <!-- Chair Legs -->
    <rect x="2" y="21" width="3" height="38" rx="1.5" fill="#d97706"/>
    <rect x="23" y="21" width="3" height="38" rx="1.5" fill="#d97706"/>
  </g>

  <!-- Character: Young Man Actively Moving the Chair -->
  <g transform="translate(50, 100)">
    <!-- Legs -->
    <g>
      <!-- Back leg stepping -->
      <path d="M20 70 L10 100 L25 102" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front leg planted -->
      <path d="M35 70 L45 98 L35 102" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Shoes -->
      <ellipse cx="28" cy="102" rx="6" ry="3" fill="#0f172a"/>
      <ellipse cx="36" cy="102" rx="6" ry="3" fill="#0f172a"/>
    </g>

    <!-- Torso (Leaning forward slightly) -->
    <path d="M18 30 C18 25 35 25 38 45 L35 72 C35 72 18 70 18 55 Z" fill="url(#shirt-grad)"/>

    <!-- Head & Face -->
    <g transform="translate(25, 12)">
      <!-- Neck -->
      <rect x="-3" y="10" width="8" height="8" fill="#fcd34d"/>
      <!-- Head Base -->
      <circle cx="2" cy="0" r="14" fill="#fcd34d"/>
      <!-- Friendly Hair (Dark brown/black) -->
      <path d="M-10 -2 C-12 -12 8 -16 14 -6 C16 -10 10 -15 2 -15 C-6 -15 -12 -10 -10 -2 Z" fill="#334155"/>
      <!-- Focused/Smiling Facial Expression -->
      <circle cx="7" cy="-2" r="1.5" fill="#1e293b"/>
      <path d="M6 5 Q9 8 12 5" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Cheeks -->
      <circle cx="9" cy="3" r="2" fill="#fb7185" opacity="0.5"/>
    </g>

    <!-- Arms interacting with the chair -->
    <!-- Back Arm (Pushing/Holding) -->
    <path d="M22 35 L40 45 L50 40" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="40" r="4" fill="#fcd34d"/>

    <!-- Front Arm (Lifting/Guiding) -->
    <path d="M30 38 L45 50 L55 45" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="55" cy="45" r="4" fill="#fcd34d"/>
  </g>

  <!-- Potted Plant Decor for Extra Room Life -->
  <g transform="translate(195, 135)">
    <path d="M5 20 L15 20 L18 35 L2 35 Z" fill="#64748b"/>
    <ellipse cx="10" cy="35" rx="8" ry="3" fill="#475569"/>
    <!-- Plant Leaves -->
    <path d="M10 20 C10 10 0 5 0 0 C0 10 10 15 10 20 Z" fill="#10b981"/>
    <path d="M10 20 C10 5 22 2 25 -2 C22 10 15 15 10 20 Z" fill="#34d399"/>
    <path d="M10 20 C15 8 20 12 28 10 C20 18 15 18 10 20 Z" fill="#059669"/>
  </g>

  <!-- Soft Vignette Frame Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.08"/>
</svg>