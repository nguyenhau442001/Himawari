<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Cityscape Background -->
  <path d="M20 180 L60 120 L100 160 L140 100 L180 140 L220 110 L220 240 L20 240 Z" fill="#334155"/>
  <rect x="30" y="140" width="10" height="30" fill="#475569"/>
  <rect x="50" y="130" width="10" height="40" fill="#475569"/>
  <rect x="110" y="110" width="15" height="60" fill="#475569"/>
  <rect x="150" y="120" width="15" height="50" fill="#475569"/>
  
  <!-- Golden Sun/Light Glow -->
  <circle cx="190" cy="50" r="30" fill="#f59e0b" opacity="0.3"/>
  <circle cx="190" cy="50" r="20" fill="#fbbf24"/>
  
  <!-- Characters -->
  <!-- Person 1 (Pointing to progress) -->
  <g transform="translate(60, 150)">
    <circle cx="20" cy="20" r="10" fill="#fb923c"/>
    <path d="M20 30 L20 60 M20 40 L5 50 M20 40 L35 50 M20 60 L10 85 M20 60 L30 85" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 35 L50 25" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (Looking at the view) -->
  <g transform="translate(130, 160)">
    <circle cx="20" cy="20" r="10" fill="#38bdf8"/>
    <path d="M20 30 L20 60 M20 40 L5 50 M20 40 L35 50 M20 60 L10 85 M20 60 L30 85" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Prosperity Elements -->
  <path d="M100 80 L110 60 L120 80 Z" fill="#10b981"/>
  <path d="M130 90 L140 70 L150 90 Z" fill="#10b981"/>
  <circle cx="180" cy="180" r="5" fill="#ec4899"/>
  <circle cx="195" cy="170" r="4" fill="#ec4899"/>
  <circle cx="170" cy="195" r="3" fill="#ec4899"/>
</svg>