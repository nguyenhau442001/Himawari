<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stage Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Camera Flash / Glow -->
    <radialGradient id="flashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Public Event / Press Conference Setting -->
  <!-- Curtains/Backdrop Background -->
  <path d="M0 0 L240 0 L240 160 L0 160 Z" fill="#111827" />
  <!-- Vertical Backdrop Folds -->
  <path d="M40 0 L40 160 M80 0 L80 160 M120 0 L120 160 M160 0 L160 160 M200 0 L200 160" stroke="#1f2937" stroke-width="4" opacity="0.6" />

  <!-- Stage Floor -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" />

  <!-- Atmospheric Spotlight Cone -->
  <polygon points="120,0 40,180 200,180" fill="url(#spotlight)" />

  <!-- Press / Audience Silhouettes in the Foreground -->
  <path d="M-10 240 L-10 210 Q10 200 30 240 Z" fill="#090d16" />
  <path d="M20 240 Q40 195 60 240 Z" fill="#090d16" />
  <path d="M180 240 Q200 190 220 240 Z" fill="#090d16" />
  <path d="M210 240 Q225 205 250 240 Z" fill="#090d16" />

  <!-- Camera with Flash Effect (Paparazzi / Media element) -->
  <g transform="translate(195, 185)">
    <!-- Camera Body -->
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#64748b" />
    <!-- Lens -->
    <circle cx="0" cy="0" r="5" fill="#0f172a" />
    <circle cx="0" cy="0" r="2" fill="#38bdf8" />
    <!-- Flash Light -->
    <circle cx="0" cy="-20" r="14" fill="url(#flashGlow)" />
  </g>
  <g transform="translate(45, 195)">
    <!-- Camera Body 2 -->
    <rect x="-10" y="-6" width="20" height="14" rx="2" fill="#475569" />
    <circle cx="0" cy="0" r="4" fill="#0f172a" />
    <circle cx="0" cy="-15" r="10" fill="url(#flashGlow)" />
  </g>

  <!-- MAIN SUBJECT: Celebrated/Reclusive Character stepping into the light (露面) -->
  <g transform="translate(120, 105)">
    <!-- Character Shadow on Floor -->
    <ellipse cx="0" cy="65" rx="25" ry="8" fill="#020617" opacity="0.6" />

    <!-- Legs & Shoes -->
    <path d="M-8 45 L-10 62 L-2 62 L0 45" fill="#0f172a" />
    <path d="M8 45 L10 62 L2 62 L0 45" fill="#0f172a" />
    <ellipse cx="-5" cy="62" rx="5" ry="2" fill="#020617" />
    <ellipse cx="5" cy="62" rx="5" ry="2" fill="#020617" />

    <!-- Suit Body / Torso -->
    <path d="M-18 10 L-22 45 L22 45 L18 10 Z" fill="url(#suitGrad)" />
    <!-- Shirt Collar & Tie -->
    <path d="M-6 10 L0 20 L6 10 Z" fill="#f8fafc" />
    <polygon points="0,18 -3,32 0,36 3,32" fill="#ec4899" />

    <!-- Shoulders & Arms (Confident posture, one hand slightly raised in greeting) -->
    <path d="M-18 12 Q-30 25 -25 35" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <path d="M18 12 Q32 20 28 35" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="-25" cy="37" r="4" fill="#fcd34d" />
    <circle cx="28" cy="37" r="4" fill="#fcd34d" />

    <!-- Neck -->
    <rect x="-4" y="4" width="8" height="8" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="0" cy="-8" r="16" fill="#fcd34d" />

    <!-- Hair (Stylish dark hair) -->
    <path d="M-16 -12 Q-10 -24 0 -22 Q12 -24 16 -12 Q18 -20 10 -25 Q0 -27 -10 -25 Q-18 -20 -16 -12 Z" fill="#0f172a" />

    <!-- Facial Expressions (Subtle polite smile, eyes looking forward) -->
    <!-- Eyes -->
    <circle cx="-5" cy="-9" r="1.5" fill="#0f172a" />
    <circle cx="5" cy="-9" r="1.5" fill="#0f172a" />
    <!-- Glasses (Intellectual / Celebrity look) -->
    <rect x="-9" y="-13" width="7" height="6" rx="1" fill="none" stroke="#334155" stroke-width="1.2" />
    <rect x="2" y="-13" width="7" height="6" rx="1" fill="none" stroke="#334155" stroke-width="1.2" />
    <line x1="-2" y1="-10" x2="2" y2="-10" stroke="#334155" stroke-width="1.2" />
    <!-- Smile -->
    <path d="M-3 -3 Q0 -1 3 -3" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="-8" cy="-5" r="2" fill="#fb923c" opacity="0.4" />
    <circle cx="8" cy="-5" r="2" fill="#fb923c" opacity="0.4" />
  </g>

  <!-- Foreground Atmospheric Particles (Camera flashes & stage dust) -->
  <circle cx="90" cy="70" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="150" cy="50" r="1" fill="#fbbf24" opacity="0.9" />
  <circle cx="70" cy="120" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="170" cy="110" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="110" cy="35" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>