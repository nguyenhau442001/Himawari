<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Atmospheric Background Glow (Idea generation light) -->
  <circle cx="120" cy="110" r="70" fill="#1e293b" opacity="0.8"/>
  <path d="M 80 40 Q 120 10 160 40 Q 190 80 160 140 Q 120 180 80 140 Q 50 80 80 40 Z" fill="#38bdf8" opacity="0.05"/>

  <!-- Bookshelf / Environment Background -->
  <rect x="25" y="50" width="35" height="110" rx="4" fill="#1e293b"/>
  <rect x="30" y="65" width="25" height="6" fill="#334155"/>
  <rect x="30" y="90" width="25" height="6" fill="#334155"/>
  <rect x="30" y="115" width="25" height="6" fill="#334155"/>
  <rect x="30" y="140" width="25" height="6" fill="#334155"/>

  <!-- Books on Shelf (Colors) -->
  <rect x="32" y="73" width="6" height="17" fill="#f59e0b" rx="1"/>
  <rect x="40" y="71" width="8" height="19" fill="#ec4899" rx="1"/>
  <rect x="33" y="98" width="10" height="17" fill="#10b981" rx="1"/>
  <rect x="45" y="96" width="6" height="19" fill="#38bdf8" rx="1"/>
  <rect x="32" y="123" width="7" height="17" fill="#fb923c" rx="1"/>

  <!-- Window with Night City Silhouette -->
  <path d="M 175 45 L 215 45 L 215 115 L 175 115 Z" fill="#1e293b"/>
  <path d="M 177 47 L 213 47 L 213 113 L 177 113 Z" fill="#0b0f19"/>
  <!-- Cityscape inside window -->
  <rect x="181" y="80" width="7" height="33" fill="#1e293b"/>
  <rect x="190" y="70" width="9" height="43" fill="#1e293b"/>
  <rect x="201" y="85" width="8" height="28" fill="#1e293b"/>
  <circle cx="184" cy="75" r="1" fill="#f59e0b"/>
  <circle cx="194" cy="65" r="1" fill="#f59e0b"/>
  <circle cx="204" cy="78" r="1" fill="#38bdf8"/>

  <!-- Window Frame Divider -->
  <line x1="195" y1="45" x2="195" y2="115" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="80" x2="215" y2="80" stroke="#334155" stroke-width="2"/>

  <!-- Desk Surface -->
  <path d="M 40 160 L 200 160 L 215 190 L 25 190 Z" fill="#334155"/>
  <rect x="20" y="185" width="200" height="8" rx="2" fill="#475569"/>

  <!-- Desk Props: Lamp -->
  <path d="M 175 160 L 180 120 L 187 120 L 185 160 Z" fill="#64748b"/>
  <path d="M 170 120 C 170 105 195 105 195 120 Z" fill="#f59e0b"/>
  <!-- Lamp Light Cone -->
  <polygon points="172,122 193,122 135,185 105,185" fill="#f59e0b" opacity="0.15"/>

  <!-- Desk Props: Coffee Mug -->
  <rect x="150" y="163" width="12" height="15" rx="2" fill="#e2e8f0"/>
  <path d="M 162 166 C 166 166 166 174 162 174" stroke="#e2e8f0" stroke-width="2" fill="none"/>

  <!-- Creative Novel Notes / Papers scattered -->
  <polygon points="65,168 85,165 88,180 68,183" fill="#f8fafc"/>
  <line x1="68" y1="172" x2="82" y2="170" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="69" y1="176" x2="78" y2="174" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <polygon points="90,170 112,174 108,186 86,182" fill="#f1f5f9" transform="rotate(10 90 170)"/>

  <!-- Character: Author / Writer -->
  <!-- Torso & Hoodie/Shirt -->
  <path d="M 95 190 L 100 145 C 105 135 135 135 140 145 L 145 190 Z" fill="#3b82f6"/>
  <!-- Collar -->
  <path d="M 112 145 L 120 155 L 128 145 Z" fill="#1e293b"/>

  <!-- Head & Neck -->
  <rect x="114" y="125" width="12" height="22" fill="#fbcfe8"/>
  <path d="M 106 115 C 106 100 134 100 134 115 C 134 125 134 130 134 130 L 106 130 Z" fill="#fbcfe8"/>

  <!-- Hair (Thoughtful, slightly messy writer hair) -->
  <path d="M 105 115 C 104 95 136 95 135 115 C 138 115 140 108 136 102 C 132 90 108 90 104 102 C 100 108 102 115 105 115 Z" fill="#334155"/>

  <!-- Facial Expression (Contemplative / Concentrating) -->
  <!-- Glasses -->
  <rect x="111" y="112" width="10" height="7" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="123" y="112" width="10" height="7" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="121" y1="115" x2="123" y2="115" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Eyebrows (Thoughtful angle) -->
  <line x1="110" y1="109" x2="117" y2="111" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="125" y1="111" x2="132" y2="109" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gentle focused mouth -->
  <path d="M 118 123 Q 120 125 122 123" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Hand on Chin (Classic pose for "Gòusī" / Ideating) -->
  <path d="M 100 145 C 95 140 90 130 98 120 C 102 115 108 122 105 128 C 102 134 105 138 112 140 Z" fill="#fbcfe8"/>
  <circle cx="98" cy="120" r="4" fill="#fbcfe8"/>

  <!-- Floating Ideation / Story Elements (Visualizing "构思" - Plot Building) -->
  <!-- Glowing connection nodes floating above head representing plot structuring -->
  <g opacity="0.9">
    <!-- Central Idea Glow -->
    <circle cx="120" cy="70" r="16" fill="#f59e0b" opacity="0.2"/>
    <circle cx="120" cy="70" r="6" fill="#f59e0b"/>
    
    <!-- Branch Node 1 (Character) -->
    <circle cx="85" cy="55" r="10" fill="#38bdf8" opacity="0.2"/>
    <circle cx="85" cy="55" r="4" fill="#38bdf8"/>
    <line x1="114" y1="65" x2="91" y2="58" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Tiny icon inside node 1: person silhouette -->
    <circle cx="85" cy="53" r="1.5" fill="#0f172a"/>
    <path d="M 82 58 C 82 56 88 56 88 58" stroke="#0f172a" stroke-width="1.5" fill="none"/>

    <!-- Branch Node 2 (Plot Twist / Setting) -->
    <circle cx="155" cy="55" r="10" fill="#ec4899" opacity="0.2"/>
    <circle cx="155" cy="55" r="4" fill="#ec4899"/>
    <line x1="126" y1="65" x2="149" y2="58" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Tiny icon inside node 2: spark/star -->
    <path d="M 155 52 L 156 54 L 158 55 L 156 56 L 155 58 L 154 56 L 152 55 L 154 54 Z" fill="#0f172a"/>

    <!-- Branch Node 3 (Climax) -->
    <circle cx="120" cy="35" r="10" fill="#10b981" opacity="0.2"/>
    <circle cx="120" cy="35" r="4" fill="#10b981"/>
    <line x1="120" y1="64" x2="120" y2="41" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Tiny icon inside node 3: diamond -->
    <polygon points="120,32 122,35 120,38 118,35" fill="#0f172a"/>
  </g>

</svg>