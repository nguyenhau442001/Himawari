<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Parent figure (larger, calm, seated) -->
  <g transform="translate(120, 160)">
    <path d="M-40 0 C-40 -30, -20 -50, 0 -50 C20 -50, 40 -30, 40 0 L40 60 L-40 60 Z" fill="#4A5568"/>
    <circle cx="0" cy="-65" r="25" fill="#FBD38D"/>
    <path d="M-10 -70 Q0 -60 10 -70" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <path d="M-8 -60 Q0 -55 8 -60" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Child figure (smaller, standing, reaching up) -->
  <g transform="translate(180, 200)">
    <path d="M-20 0 C-20 -15, -10 -25, 0 -25 C10 -25, 20 -15, 20 0 L20 30 L-20 30 Z" fill="#63B3ED"/>
    <circle cx="0" cy="-35" r="15" fill="#FBD38D"/>
    <path d="M-5 -40 Q0 -35 5 -40" stroke="#1A1D24" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Visual representation of "欣慰" (relief/contentment): 
       A soft, warm glow emanating from the parent, 
       representing the internal feeling of peace and satisfaction. -->
  <circle cx="120" cy="100" r="40" fill="#F6E05E" opacity="0.15"/>
  <circle cx="120" cy="100" r="25" fill="#F6E05E" opacity="0.2"/>
  
  <!-- Subtle lines indicating the parent's gentle, satisfied expression -->
  <path d="M105 90 Q120 100 135 90" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>