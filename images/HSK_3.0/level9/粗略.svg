<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Grid Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="0" y1="180" x2="240" y2="180" />
  </g>

  <!-- Central Physical Object: A physical ledger/notepad with a broad, sketchy summary outline -->
  <g transform="translate(0, 5)">
    <!-- Notepad Shadow / Back Page -->
    <rect x="55" y="45" width="130" height="150" rx="8" fill="#2A313C" />
    
    <!-- Notepad Main Page -->
    <rect x="50" y="40" width="130" height="150" rx="8" fill="#242B35" stroke="#3A4454" stroke-width="2" />
    
    <!-- Spiral Binding Holes -->
    <circle cx="50" cy="55" r="3" fill="#1A1D24"/>
    <circle cx="50" cy="80" r="3" fill="#1A1D24"/>
    <circle cx="50" cy="105" r="3" fill="#1A1D24"/>
    <circle cx="50" cy="130" r="3" fill="#1A1D24"/>
    <circle cx="50" cy="155" r="3" fill="#1A1D24"/>
    <circle cx="50" cy="180" r="3" fill="#1A1D24"/>

    <!-- Spiral Rings -->
    <path d="M 45 52 C 43 52 42 54 42 56 C 42 58 43 60 45 60" fill="none" stroke="#6E7E98" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 45 77 C 43 77 42 79 42 81 C 42 83 43 85 45 85" fill="none" stroke="#6E7E98" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 45 102 C 43 102 42 104 42 106 C 42 108 43 110 45 110" fill="none" stroke="#6E7E98" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 45 127 C 43 127 42 129 42 131 C 42 133 43 135 45 135" fill="none" stroke="#6E7E98" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 45 152 C 43 152 42 154 42 156 C 42 158 43 160 45 160" fill="none" stroke="#6E7E98" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 45 177 C 43 177 42 179 42 181 C 42 183 43 185 45 185" fill="none" stroke="#6E7E98" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Document Content: "Rough/Broad" sketch lines instead of fine detailed text (representing 'sơ lược/đại khái') -->
    <!-- Title bar -->
    <rect x="70" y="58" width="50" height="8" rx="4" fill="#E67E22" opacity="0.8"/>
    
    <!-- Rough sketchy lines (uneven and broad strokes) -->
    <path d="M 70 85 L 140 85" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <path d="M 70 105 L 115 105" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <path d="M 70 125 L 150 125" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>

    <!-- A bold, rough highlighter mark crossing over indicating a broad overview -->
    <path d="M 62 155 Q 95 145 130 155 T 168 150" fill="none" stroke="#E67E22" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M 70 152 L 160 152" stroke="#E67E22" stroke-width="5" stroke-linecap="round"/>

    <!-- Magnifying Glass hovering to inspect the broad outline -->
    <g transform="translate(130, 95)">
      <!-- Glass Shadow -->
      <circle cx="3" cy="3" r="28" fill="#000000" opacity="0.3"/>
      <!-- Lens Border -->
      <circle cx="0" cy="0" r="28" fill="#1A1D24" stroke="#E67E22" stroke-width="5"/>
      <!-- Glass Reflection -->
      <circle cx="0" cy="0" r="24" fill="#2D3748" opacity="0.8"/>
      <path d="M -12 -12 Q 0 -18 12 -12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
      <!-- Handle -->
      <path d="M 19 19 L 40 40" stroke="#E67E22" stroke-width="8" stroke-linecap="round"/>
      <path d="M 19 19 L 40 40" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>