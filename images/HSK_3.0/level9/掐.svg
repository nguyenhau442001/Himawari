<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Scene Environment: Room Wall & Window backdrop -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="140" y="25" width="75" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M140 67.5 H215 M177.5 25 V110" stroke="#334155" stroke-width="2"/>
    <!-- Night sky through window -->
    <circle cx="160" cy="45" r="1.5" fill="#f8fafc" opacity="0.8"/>
    <circle cx="195" cy="55" r="1" fill="#f8fafc" opacity="0.6"/>
    <circle cx="180" cy="85" r="1.5" fill="#f8fafc" opacity="0.9"/>
    
    <!-- Warm Ambient Light Glow -->
    <circle cx="80" cy="70" r="70" fill="url(#lamp-glow)"/>

    <!-- Bookshelf / Wall shelf in background -->
    <rect x="25" y="35" width="85" height="6" rx="2" fill="#334155"/>
    <!-- Small books on shelf -->
    <path d="M35 25 h8 v10 h-8 z" fill="#38bdf8" opacity="0.8"/>
    <path d="M45 23 h10 v12 h-10 z" fill="#f43f5e" opacity="0.8"/>
    <path d="M57 27 h6 v8 h-6 z" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Wooden Table/Desk Surface -->
  <rect x="10" y="175" width="220" height="45" rx="4" fill="url(#wood-desk)"/>
  <rect x="10" y="170" width="220" height="6" fill="#64748b" opacity="0.4"/>

  <!-- Props: Glass Vase with flowers inserted -->
  <g id="vase-and-flowers">
    <!-- Glass Vase -->
    <path d="M185 130 C175 130 170 145 170 155 C170 168 173 172 173 172 H197 C197 172 200 168 200 155 C200 145 195 130 185 130 Z" fill="#93c5fd" opacity="0.35" stroke="#bfdbfe" stroke-width="1.5"/>
    <!-- Water inside vase -->
    <path d="M172 148 H198 C198 148 199 168 197 170 H173 C171 168 172 148 172 148 Z" fill="#60a5fa" opacity="0.3"/>
    <!-- Already Placed Flower Stems in Vase -->
    <path d="M185 130 Q180 110 165 95" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="165" cy="95" r="7" fill="#fb923c"/>
    <path d="M185 130 Q190 105 200 90" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="200" cy="90" r="6" fill="#ec4899"/>
  </g>

  <!-- Main Character: Woman pinching/cutting flower stem -->
  <g id-="character">
    <!-- Torso & Clothing -->
    <path d="M70 175 C70 155 85 140 100 140 C115 140 130 155 130 175 Z" fill="#38bdf8"/>
    <path d="M85 142 C93 148 107 148 115 142 L120 175 H80 Z" fill="#f8fafc" opacity="0.9"/> <!-- Collar/Shirt -->

    <!-- Neck & Head -->
    <path d="M93 130 H107 V143 H93 Z" fill="#fbcfe8"/>
    <circle cx="100" cy="105" r="21" fill="#fbcfe8"/>

    <!-- Hair style (Cute tied hair/bun) -->
    <path d="M79 105 C79 90 90 82 100 82 C110 82 121 90 121 105 C121 115 118 123 115 125 C112 120 108 112 100 112 C92 112 88 120 85 125 C82 123 79 115 79 105 Z" fill="#334155"/>
    <circle cx="100" cy="76" r="7" fill="#334155"/> <!-- Hair bun -->

    <!-- Facial expression (focused, gentle) -->
    <circle cx="93" cy="104" r="1.5" fill="#334155"/>
    <circle cx="107" cy="104" r="1.5" fill="#334155"/>
    <!-- Gentle happy smile -->
    <path d="M98 110 Q100 113 102 110" fill="none" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="90" cy="108" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="110" cy="108" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Left Arm (Holding branch) -->
    <path d="M75 155 Q60 145 68 125" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right Arm (Active hand pinching action) -->
    <path d="M125 155 Q135 145 125 130" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Detailed Focal Point: Flower Branch & Pinching Action -->
  <g id="flower-branch-action">
    <!-- Large Branch held in left hand extending from left to center -->
    <path d="M30 110 Q50 115 75 122 Q95 128 115 132" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Leaves on the branch -->
    <path d="M50 112 Q45 100 55 98 Q60 108 50 112 Z" fill="#34d399"/>
    <path d="M75 122 Q72 110 82 108 Q85 118 75 122 Z" fill="#34d399"/>

    <!-- The target flower being pinched (right tip of the branch) -->
    <!-- Flower Blossom -->
    <circle cx="120" cy="134" r="9" fill="#f43f5e"/>
    <circle cx="120" cy="134" r="3.5" fill="#fbbf24"/>
    <path d="M115 132 Q120 126 125 132" fill="none" stroke="#10b981" stroke-width="3"/>

    <!-- Character Hands performing "掐" (Pinching / Plucking with fingers) -->
    <!-- Thumb and Index finger interacting precisely with the stem -->
    <path d="M124 126 C120 126 117 129 119 133 C120 135 124 135 126 132 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="0.8"/>
    <!-- Hand outline/fingers detail -->
    <circle cx="123" cy="130" r="4" fill="#fbcfe8"/>
    <circle cx="117" cy="134" r="3.5" fill="#fbcfe8"/>

    <!-- Action / Motion / Cut Indicator (subtle glowing spark to highlight the snap/pinch) -->
    <path d="M121 125 L123 128 M126 130 L124 132" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Additional tabletop context props -->
  <!-- Scissors or pruning shears resting neatly on table -->
  <g transform="translate(45, 185) rotate(-20)">
    <path d="M0 0 L15 15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 15 L15 0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-3" cy="-3" r="3" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="-3" cy="18" r="3" fill="none" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Small potted succulent on the left for richness -->
  <g transform="translate(15, 155)">
    <path d="M5 25 L10 20 H25 L30 25 Z" fill="#cbd5e1"/>
    <path d="M7 20 Q17 10 27 20 Z" fill="#334155"/>
    <circle cx="14" cy="14" r="4" fill="#10b981"/>
    <circle cx="20" cy="12" r="5" fill="#059669"/>
    <circle cx="23" cy="16" r="3.5" fill="#34d399"/>
  </g>
</svg>