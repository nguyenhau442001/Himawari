<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural Blueprint Grid Lines (Subtle) -->
  <g stroke="#262C3A" stroke-width="0.8" opacity="0.6">
    <line x1="30" y1="60" x2="210" y2="60"/>
    <line x1="30" y1="100" x2="210" y2="100"/>
    <line x1="30" y1="140" x2="210" y2="140"/>
    <line x1="30" y1="180" x2="210" y2="180"/>
    <line x1="60" y1="30" x2="60" y2="210"/>
    <line x1="100" y1="30" x2="100" y2="210"/>
    <line x1="140" y1="30" x2="140" y2="210"/>
    <line x1="180" y1="30" x2="180" y2="210"/>
  </g>

  <!-- Physical Object: Precision Surveying Instrument & Engineering Transit (Theodolite/Measurement Device) -->
  <g transform="translate(120, 125)">
    <!-- Tripod Legs -->
    <polygon points="-5,15 -35,75 -25,75 -2,25" fill="#3E4C59"/>
    <polygon points="5,15 35,75 25,75 2,25" fill="#3E4C59"/>
    <polygon points="0,15 0,80 -5,80 -5,15" fill="#2E3842"/>

    <!-- Tripod Metal Spikes / Base Joint -->
    <circle cx="0" cy="15" r="8" fill="#5C6B73"/>

    <!-- Instrument Base & Horizontal Circle -->
    <rect x="-18" y="2" width="36" height="13" rx="2" fill="#4E5D6C"/>
    <rect x="-24" y="-2" width="48" height="6" rx="1" fill="#657786"/>

    <!-- Vertical Axis & Core Body -->
    <rect x="-10" y="-18" width="20" height="18" fill="#FFA726"/>

    <!-- Side Wheel / Adjustment Knob -->
    <circle cx="-16" cy="-10" r="5" fill="#FFC107"/>
    <circle cx="-16" cy="-10" r="2" fill="#3E4C59"/>

    <!-- Main Telescope Barrel (Measuring optics) -->
    <g transform="rotate(-15)">
      <rect x="-30" y="-28" width="60" height="18" rx="4" fill="#657786"/>
      <!-- Lens Hood / Front Objective -->
      <rect x="22" y="-30" width="10" height="22" rx="2" fill="#4E5D6C"/>
      <circle cx="27" cy="-19" r="8" fill="#29B6F6" opacity="0.8"/>
      <!-- Eyepiece -->
      <rect x="-35" y="-26" width="7" height="14" rx="2" fill="#4E5D6C"/>
    </g>

    <!-- Top Laser/Sighting Scope -->
    <rect x="-18" y="-38" width="36" height="7" rx="2" fill="#FF7043"/>

    <!-- Precision Laser Beam / Calculation Ray Indicator -->
    <polygon points="27,10 115,85 105,88 22,10" fill="#29B6F6" opacity="0.25"/>
    <line x1="27" y1="10" x2="110" y2="86" stroke="#29B6F6" stroke-width="2" stroke-dasharray="4,3"/>
  </g>

  <!-- Calculation / Measurement Target Marker (The exact spot being calculated) -->
  <g transform="translate(190, 205)">
    <ellipse cx="0" cy="0" rx="14" ry="5" fill="#FFA726" opacity="0.4"/>
    <circle cx="0" cy="-3" r="5" fill="#FF7043"/>
    <circle cx="0" cy="-3" r="2" fill="#FFFFFF"/>
    <!-- Target crosshairs -->
    <line x1="-10" y1="-3" x2="-5" y2="-3" stroke="#FF7043" stroke-width="1.5"/>
    <line x1="5" y1="-3" x2="10" y2="-3" stroke="#FF7043" stroke-width="1.5"/>
    <line x1="0" y1="-13" x2="0" y2="-8" stroke="#FF7043" stroke-width="1.5"/>
  </g>

</svg>