<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background accents (Park environment representation) -->
  <path d="M40 180 Q80 160 120 180 T200 180" fill="none" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>
  <circle cx="180" cy="70" r="16" fill="#F39C12" opacity="0.15"/>
  <path d="M60 180 L60 145" stroke="#2A2F3D" stroke-width="2" opacity="0.4"/>
  <path d="M55 155 Q60 150 65 155" fill="none" stroke="#2A2F3D" stroke-width="2" opacity="0.4"/>

  <!-- Main Object: 亭子 (Pavilion / Đình) -->
  <g transform="translate(0, 10)">
    <!-- Base Platform / Steps -->
    <path d="M70 170 L170 170 L185 185 L55 185 Z" fill="#2E3648"/>
    <path d="M75 160 L165 160 L170 170 L70 170 Z" fill="#3A445C"/>
    
    <!-- Pillars -->
    <rect x="85" y="115" width="8" height="45" fill="#E06D53"/>
    <rect x="147" y="115" width="8" height="45" fill="#E06D53"/>
    <rect x="105" y="115" width="6" height="45" fill="#C0392B"/>
    <rect x="129" y="115" width="6" height="45" fill="#C0392B"/>

    <!-- Railings -->
    <path d="M85 140 L155 140" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
    <line x1="97" y1="140" x2="97" y2="160" stroke="#E06D53" stroke-width="2"/>
    <line x1="120" y1="140" x2="120" y2="160" stroke="#E06D53" stroke-width="2"/>
    <line x1="143" y1="140" x2="143" y2="160" stroke="#E06D53" stroke-width="2"/>

    <!-- Lower Roof Structure -->
    <path d="M70 115 L170 115 L160 100 L80 100 Z" fill="#C0392B"/>
    <path d="M65 115 L175 115 L180 120 L60 120 Z" fill="#962D22"/>

    <!-- Upper Roof (Traditional Curved Chinese Pavilion Roof) -->
    <path d="M120 50 Q150 75 175 90 L65 90 Q90 75 120 50 Z" fill="#E74C3C"/>
    <!-- Roof Ridge & Eaves Detail -->
    <path d="M65 90 Q120 98 175 90 L182 96 Q120 106 58 96 Z" fill="#C0392B"/>
    
    <!-- Gable / Pinnacle (宝顶) -->
    <circle cx="120" cy="46" r="6" fill="#F1C40F"/>
    <path d="M117 40 L123 40 L120 33 Z" fill="#F1C40F"/>

    <!-- Decorative glowing focus element for modern flat style -->
    <path d="M120 50 L120 90" stroke="#F1C40F" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Foreground aesthetic elements -->
  <circle cx="120" cy="205" r="3" fill="#F1C40F" opacity="0.8"/>
  <circle cx="100" cy="200" r="1.5" fill="#F39C12" opacity="0.5"/>
  <circle cx="140" cy="202" r="2" fill="#F39C12" opacity="0.6"/>
</svg>