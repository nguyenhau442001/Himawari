<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background accent/glow for the fuse spark -->
  <circle cx="175" cy="80" r="45" fill="#FF5722" opacity="0.12" filter="blur(10px)"/>
  
  <!-- Dynamite / Explosive Device Body -->
  <g transform="translate(40, 110)">
    <!-- Stick 1 (Back left) -->
    <rect x="10" y="30" width="55" height="40" rx="6" fill="#D32F2F" transform="rotate(-15 37 50)"/>
    <!-- Stick 2 (Back right) -->
    <rect x="75" y="25" width="55" height="40" rx="6" fill="#C62828" transform="rotate(15 102 45)"/>
    <!-- Stick 3 (Center foreground) -->
    <rect x="42" y="35" width="60" height="42" rx="6" fill="#E53935"/>
    
    <!-- Paper bands on dynamite sticks -->
    <!-- Band Stick 1 -->
    <rect x="28" y="35" width="10" height="40" fill="#EEEEEE" opacity="0.85" transform="rotate(-15 33 55)"/>
    <text x="33" y="58" font-family="sans-serif" font-size="8" font-weight="bold" fill="#333" transform="rotate(-15 33 58)" text-anchor="middle">TNT</text>
    
    <!-- Band Stick 2 -->
    <rect x="92" y="30" width="10" height="40" fill="#EEEEEE" opacity="0.85" transform="rotate(15 97 50)"/>
    <text x="97" y="53" font-family="sans-serif" font-size="8" font-weight="bold" fill="#333" transform="rotate(15 97 53)" text-anchor="middle">TNT</text>
    
    <!-- Band Stick 3 -->
    <rect x="67" y="35" width="12" height="42" fill="#EEEEEE" opacity="0.9"/>
    <text x="73" y="59" font-family="sans-serif" font-size="9" font-weight="bold" fill="#B71C1C" text-anchor="middle">TNT</text>
    
    <!-- Tying rope/string knot in center -->
    <ellipse cx="72" cy="56" rx="8" ry="4" fill="#B0BEC5"/>
  </g>
  
  <!-- Fuse (导火索) winding up from the center dynamite to top-right -->
  <path d="M 112 110 C 112 95, 130 90, 135 75 C 140 60, 160 70, 170 80" fill="none" stroke="#795548" stroke-width="5" stroke-linecap="round"/>
  <!-- Fuse texture/highlights -->
  <path d="M 113 111 C 113 96, 131 91, 136 76" fill="none" stroke="#A1887F" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Sparks and Fire at the tip of the fuse (The triggering moment) -->
  <g transform="translate(170, 80)">
    <!-- Outer spark rays -->
    <line x1="0" y1="0" x2="16" y2="-12" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="8" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="-18" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="-15" stroke="#FF9800" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="-4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Ember core -->
    <circle cx="0" cy="0" r="5" fill="#FFEB3B"/>
    <!-- Flame body -->
    <path d="M -3 2 C -5 -6, 0 -12, 4 -15 C 6 -8, 2 -2, 4 3 C 2 5, -2 5, -3 2 Z" fill="#FF5722"/>
    <path d="M -1 1 C -2 -4, 0 -8, 2 -10 C 3 -5, 1 -2, 2 1 C 1 2, -1 2, -1 1 Z" fill="#FFEB3B"/>
  </g>

  <!-- Floating Ember Particles -->
  <circle cx="195" cy="65" r="2" fill="#FFC107" opacity="0.8"/>
  <circle cx="185" cy="50" r="1.5" fill="#FF5722" opacity="0.9"/>
  <circle cx="155" cy="62" r="1" fill="#FFEB3B" opacity="0.7"/>
  <circle cx="202" cy="85" r="1.5" fill="#FF9800" opacity="0.6"/>
</svg>