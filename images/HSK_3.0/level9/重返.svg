<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "重返" (Return/Comeback to a venue/stage) -->
  <!-- Background subtle elements (Olympic stadium arc/track hint) -->
  <path d="M40 180 C80 160 160 160 200 180" stroke="#2A313C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M30 195 C80 170 160 170 210 195" stroke="#2A313C" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Podium / Starting block signifying the arena/stage -->
  <rect x="90" y="150" width="60" height="25" rx="4" fill="#2E3846"/>
  <rect x="75" y="175" width="90" height="15" rx="3" fill="#242B35"/>
  <text x="120" y="167" font-family="sans-serif" font-weight="bold" font-size="12" fill="#E6B325" text-anchor="middle">1</text>

  <!-- Returning Athlete / Character stepping back onto the stage -->
  <!-- Body/Torso -->
  <path d="M120 105 L135 145 L105 145 Z" fill="#3B82F6"/>
  
  <!-- Head -->
  <circle cx="120" cy="85" r="14" fill="#FBBF24"/>
  
  <!-- Arms gesturing return/arrival (one arm welcoming/reaching forward, one back) -->
  <path d="M125 110 L150 120" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <path d="M115 110 L95 125" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>

  <!-- Legs stepping forward onto the podium -->
  <path d="M115 145 L110 165" stroke="#374151" stroke-width="7" stroke-linecap="round"/>
  <path d="M125 145 L135 155" stroke="#374151" stroke-width="7" stroke-linecap="round"/>

  <!-- Dynamic return/re-entry motion arrows curving downwards/onto the spot -->
  <path d="M70 70 C80 50, 110 50, 120 70" stroke="#E6B325" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
  <path d="M115 62 L121 70 L111 74" fill="#E6B325"/>

  <path d="M170 70 C160 50, 130 50, 120 70" stroke="#E6B325" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Spotlight / Glow effect highlighting the successful return -->
  <circle cx="120" cy="120" r="70" fill="url(#glowGradient)" opacity="0.15" style="mix-blend-mode: screen;"/>

  <defs>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6B325" />
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>