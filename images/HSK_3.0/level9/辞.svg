<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Desk -->
    <rect x="0" y="100" width="120" height="10" fill="#34495E" rx="2"/>
    <rect x="10" y="110" width="10" height="20" fill="#2C3E50"/>
    <rect x="100" y="110" width="10" height="20" fill="#2C3E50"/>
    
    <!-- Resignation Letter (The object) -->
    <rect x="35" y="40" width="50" height="60" fill="#ECF0F1" rx="2"/>
    <line x1="45" y1="55" x2="75" y2="55" stroke="#BDC3C7" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="75" y2="65" stroke="#BDC3C7" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="75" x2="60" y2="75" stroke="#BDC3C7" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Hand placing the letter -->
    <path d="M70 80 L90 60 L105 75 L85 95 Z" fill="#F39C12"/>
    <path d="M85 95 L95 105 L80 110 L70 100 Z" fill="#E67E22"/>
    
    <!-- Suit jacket sleeve -->
    <path d="M90 90 L120 120 L110 130 L80 100 Z" fill="#2980B9"/>
    
    <!-- Badge/ID card being pushed away -->
    <rect x="10" y="20" width="30" height="40" fill="#E74C3C" rx="4"/>
    <circle cx="25" cy="35" r="8" fill="#FFFFFF"/>
    <path d="M15 50 L35 50" stroke="#E74C3C" stroke-width="3"/>
  </g>
</svg>