<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shockwave Glow Gradient -->
    <radialGradient id="shockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Warm Light Cone -->
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environmental Context: Cozy modern cafe/lounge background -->
  <!-- Ambient background elements -->
  <circle cx="40" cy="50" r="1.5" fill="#475569"/>
  <circle cx="200" cy="80" r="1" fill="#475569"/>
  <circle cx="210" cy="40" r="2" fill="#475569"/>
  <circle cx="30" cy="190" r="1.5" fill="#475569"/>
  
  <!-- Hanging Lamp casting warm light -->
  <path d="M120 0 L120 45" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 45 L140 45 L145 52 L95 52 Z" fill="#64748b"/>
  <path d="M70 180 L120 52 L170 180 Z" fill="url(#lightCone)"/>

  <!-- Shockwave / "Sensation" Visual Effect -->
  <circle cx="120" cy="125" r="90" fill="url(#shockGlow)"/>
  
  <!-- Dynamic radiating shock rings -->
  <circle cx="120" cy="125" r="75" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <circle cx="120" cy="125" r="55" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="120" cy="125" r="35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Table/Surface -->
  <path d="M30 190 L210 190 L220 220 L20 220 Z" fill="#334155"/>
  <path d="M30 190 L210 190" stroke="#475569" stroke-width="2"/>

  <!-- Coffee Cup (Context Prop) -->
  <path d="M55 175 L75 175 L73 195 L57 195 Z" fill="#cbd5e1"/>
  <path d="M75 179 C82 179 82 191 73 191" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="65" cy="175" rx="10" ry="3" fill="#94a3b8"/>
  <!-- Steam from coffee -->
  <path d="M62 165 C60 160 66 155 64 150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Central Character: Expressive person reacting to massive breaking news -->
  <!-- Torso & Shoulders -->
  <path d="M85 220 C85 190 95 170 120 170 C145 170 155 190 155 220 Z" fill="#4f46e5"/>
  
  <!-- Collar / Shirt Detail -->
  <path d="M105 170 L120 185 L135 170" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neck -->
  <path d="M110 155 L130 155 L130 175 L110 175 Z" fill="#fbcfe8"/>

  <!-- Head with Shocked Expression -->
  <circle cx="120" cy="135" r="26" fill="#fbcfe8"/>
  
  <!-- Hair (Stylish dark messy bob) -->
  <path d="M94 135 C94 115 105 105 120 105 C135 105 146 115 146 135 C146 145 142 150 142 150 C142 150 145 125 130 115 C115 105 100 120 98 135 Z" fill="#0f172a"/>

  <!-- Surprised Face Features -->
  <!-- Eyebrows raised high -->
  <path d="M104 122 Q110 118 116 122" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <path d="M124 122 Q130 118 136 122" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Wide Eyes with sparkles -->
  <circle cx="110" cy="130" r="4" fill="#0f172a"/>
  <circle cx="130" cy="130" r="4" fill="#0f172a"/>
  <circle cx="111" cy="129" r="1.5" fill="#ffffff"/>
  <circle cx="131" cy="129" r="1.5" fill="#ffffff"/>

  <!-- Shocked "O" Mouth -->
  <ellipse cx="120" cy="144" rx="4.5" ry="6" fill="#0f172a"/>

  <!-- Arms expressing shock / holding phone -->
  <!-- Left Arm (bent back in surprise) -->
  <path d="M90 185 L70 155 L85 145" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="85" cy="145" r="6" fill="#fbcfe8"/> <!-- Left hand -->

  <!-- Right Arm (holding glowing phone forward) -->
  <path d="M150 185 L165 155 L150 135" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Hand -->
  <circle cx="147" cy="132" r="6" fill="#fbcfe8"/>

  <!-- Smartphone Prop (The Source of the "轰动" News) -->
  <!-- Floating angled phone with bright UI -->
  <g transform="translate(130, 90) rotate(15)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="36" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Screen -->
    <rect x="3" y="4" width="30" height="56" rx="4" fill="url(#screenGrad)"/>
    <!-- Abstract Breaking News UI -->
    <rect x="6" y="10" width="24" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
    <!-- Thumbnail Image in UI -->
    <circle cx="18" cy="19" r="6" fill="#f59e0b"/>
    <path d="M12 25 L18 20 L24 25 Z" fill="#ef4444"/>
    <!-- Headline text lines simulation -->
    <rect x="6" y="32" width="20" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="6" y="38" width="14" height="2" rx="1" fill="#93c5fd"/>
    <rect x="6" y="43" width="18" height="2" rx="1" fill="#93c5fd"/>
    <!-- Notification alert badge glowing -->
    <circle cx="30" cy="6" r="4" fill="#ef4444"/>
    <path d="M28 6 L30 4 L32 6 L30 8 Z" fill="#ffffff"/>
  </g>

  <!-- Floating "News / Sensation" Sparkles & Burst Icons -->
  <path d="M185 70 L190 75 L185 80 L180 75 Z" fill="#fbbf24"/>
  <path d="M55 90 L58 93 L55 96 L52 93 Z" fill="#38bdf8"/>
  <path d="M70 60 L73 62 L70 64 L67 62 Z" fill="#ec4899"/>
  <circle cx="170" cy="60" r="2" fill="#fbbf24"/>
  <circle cx="50" cy="130" r="1.5" fill="#38bdf8"/>
  <circle cx="195" cy="140" r="2.5" fill="#ec4899"/>
</svg>