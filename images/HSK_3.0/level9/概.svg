<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "概" based on the museum/exhibition context (object representing entirety/all exhibits encompassed by a rule):
       A sleek, modern glass museum display case containing a classic golden artifact, framed by a clean boundary structure, 
       with a precise prohibition/total inclusion symbol clearly visualizing "hết thảy / hoàn toàn / toàn bộ không cho mượn". -->
  
  <!-- Ambient glow and base structure -->
  <ellipse cx="120" cy="200" rx="60" ry="10" fill="#0E1015" opacity="0.8"/>

  <!-- Museum Display Pedestal -->
  <path d="M80,180 L160,180 L170,195 L70,195 Z" fill="#2D3342"/>
  <rect x="85" y="165" width="70" height="15" fill="#3B4252" rx="2"/>

  <!-- Glass Showcase Dome / Encompassing Container representing "Tổng quát / Hết thảy phạm vi" -->
  <path d="M85,165 L85,90 C85,65 105,45 120,45 C135,45 155,65 155,90 L155,165 Z" fill="#1E2430" stroke="#4C566A" stroke-width="2" opacity="0.6"/>
  
  <!-- Highlight on glass -->
  <path d="M93,95 L93,155" stroke="#88C0D0" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- The Artifact (Central physical object: Ancient ceremonial bronze vessel / Ding) representing the exhibit -->
  <g transform="translate(120, 125)">
    <!-- Vessel body -->
    <path d="M-22,-15 C-22,10 -15,22 0,22 C15,22 22,10 22,-15 Z" fill="#EBCB8B"/>
    <!-- Rim -->
    <ellipse cx="0" cy="-15" rx="24" ry="5" fill="#D08770"/>
    <ellipse cx="0" cy="-15" rx="21" ry="3.5" fill="#EBCB8B"/>
    <!-- Handles -->
    <path d="M-23,-18 C-30,-18 -30,-8 -22,-8" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round"/>
    <path d="M23,-18 C30,-18 30,-8 22,-8" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round"/>
    <!-- Base feet -->
    <path d="M-14,18 L-18,30 L-10,26 Z" fill="#D08770"/>
    <path d="M14,18 L18,30 L10,26 Z" fill="#D08770"/>
    <path d="M0,20 L0,32 L0,26 Z" fill="#D08770"/>
    <!-- Ancient engraving detail -->
    <path d="M-10,0 Q0,8 10,0" fill="none" stroke="#D08770" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent overlay: Strict boundary enclosure / Prohibition seal indicating "Hết thảy nghiêm ngặt không ngoại lệ" -->
  <circle cx="120" cy="115" r="75" fill="none" stroke="#BF616A" stroke-width="4" stroke-dasharray="8,4" opacity="0.85"/>

  <!-- Focus corner brackets for modern sleek design UI feel -->
  <path d="M45,65 L45,45 L65,45" fill="none" stroke="#88C0D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M195,65 L195,45 L175,45" fill="none" stroke="#88C0D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45,175 L45,195 L65,195" fill="none" stroke="#88C0D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M195,175 L195,195 L175,195" fill="none" stroke="#88C0D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Subtle total coverage indicator nodes -->
  <circle cx="120" cy="45" r="3" fill="#88C0D0"/>
  <circle cx="120" cy="195" r="3" fill="#88C0D0"/>
</svg>