<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Memorial Candle & Flame representation of Mourning/悼念 -->
    <!-- Glow effect -->
    <circle cx="120" cy="115" r="45" fill="#F5A623" opacity="0.12" filter="blur(8px)"/>
    <circle cx="120" cy="105" r="25" fill="#F5A623" opacity="0.2" filter="blur(4px)"/>
    
    <!-- Candle Holder / Base -->
    <path d="M 85,185 L 155,185 L 165,198 L 75,198 Z" fill="#3E4C59" />
    <ellipse cx="120" cy="185" rx="35" ry="6" fill="#52606D" />
    
    <!-- Candle Body -->
    <rect x="102" y="115" width="36" height="72" rx="4" fill="#E4E7EB" />
    <rect x="102" y="115" width="12" height="72" fill="#CBD5E1" /> <!-- shading side -->

    <!-- Wick -->
    <rect x="118" y="105" width="4" height="12" fill="#1E293B" />

    <!-- Flame Outer (Golden/Orange) -->
    <path d="M 120,60 C 132,78 138,92 138,102 C 138,112 130,118 120,118 C 110,118 102,112 102,102 C 102,92 108,78 120,60 Z" fill="#F5A623" />
    
    <!-- Flame Inner (Bright Yellow) -->
    <path d="M 120,72 C 126,84 130,94 130,102 C 130,108 125,112 120,112 C 115,112 110,108 110,102 C 110,94 114,84 120,72 Z" fill="#FDE047" />

    <!-- Subtle solemn decorative wreath/ribbon element at the base -->
    <path d="M 85,160 Q 120,175 155,160" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>