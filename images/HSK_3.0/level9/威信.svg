<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Prestige Halo / Sunburst -->
  <circle cx="120" cy="100" r="55" fill="none" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="120" cy="100" r="65" fill="none" stroke="#FFB300" stroke-width="1" stroke-dasharray="2 10" opacity="0.2"/>
  
  <!-- Laurel Wreath (Symbol of Prestige/Authority) -->
  <g fill="#FFB300" opacity="0.8">
    <!-- Left side -->
    <ellipse cx="75" cy="140" rx="6" ry="3" transform="rotate(-30 75 140)"/>
    <ellipse cx="70" cy="125" rx="6" ry="3" transform="rotate(-40 70 125)"/>
    <ellipse cx="72" cy="110" rx="6" ry="3" transform="rotate(-50 72 110)"/>
    <ellipse cx="80" cy="98" rx="6" ry="3" transform="rotate(-60 80 98)"/>
    <!-- Right side -->
    <ellipse cx="165" cy="140" rx="6" ry="3" transform="rotate(30 165 140)"/>
    <ellipse cx="170" cy="125" rx="6" ry="3" transform="rotate(40 170 125)"/>
    <ellipse cx="168" cy="110" rx="6" ry="3" transform="rotate(50 168 110)"/>
    <ellipse cx="160" cy="98" rx="6" ry="3" transform="rotate(60 160 98)"/>
  </g>

  <!-- Leader Figure (Character representing Authority) -->
  <circle cx="120" cy="85" r="22" fill="#F8FAFC"/>
  <path d="M85 185 C 85 145, 155 145, 155 185 L 155 210 L 85 210 Z" fill="#F8FAFC"/>
  
  <!-- Credibility Star (Symbol of Trust/Prestige) -->
  <path d="M120 152 L 123.5 160 H 132 L 125.5 165 L 128 174 L 120 169 L 112 174 L 114.5 165 L 108 160 H 116.5 Z" fill="#FFB300"/>
  
  <!-- Base/Podium line -->
  <rect x="70" y="210" width="100" height="4" rx="2" fill="#334155"/>
</svg>