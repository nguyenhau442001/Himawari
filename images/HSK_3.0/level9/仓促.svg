<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="140" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="155" width="10" height="85" fill="#334155"/>
  <rect x="200" y="155" width="10" height="85" fill="#334155"/>
  
  <!-- Papers flying -->
  <path d="M150 100 L190 90 L180 130 L140 140 Z" fill="#f8fafc" opacity="0.9"/>
  <path d="M160 80 L200 70 L190 110 L150 120 Z" fill="#f8fafc" opacity="0.7"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M20 160 C20 120, 60 110, 80 110 C100 110, 140 120, 140 160 L140 170 L20 170 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="80" cy="90" r="30" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M55 85 C55 60, 70 50, 80 50 C90 50, 105 60, 105 85 Z" fill="#475569"/>
    <!-- Eyes (Wide/Shocked) -->
    <circle cx="70" cy="85" r="4" fill="#1e293b"/>
    <circle cx="90" cy="85" r="4" fill="#1e293b"/>
    <!-- Mouth (Surprised) -->
    <ellipse cx="80" cy="100" rx="6" ry="4" fill="#1e293b"/>
    <!-- Arm reaching for clock -->
    <path d="M110 120 L140 90" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Clock -->
  <circle cx="180" cy="50" r="30" fill="#fb923c"/>
  <circle cx="180" cy="50" r="24" fill="#1e293b"/>
  <line x1="180" y1="50" x2="180" y2="30" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="50" x2="200" y2="50" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Suitcase -->
  <rect x="150" y="160" width="60" height="40" rx="4" fill="#ec4899"/>
  <rect x="165" y="150" width="30" height="10" rx="2" fill="#ec4899"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.1"/>
</svg>