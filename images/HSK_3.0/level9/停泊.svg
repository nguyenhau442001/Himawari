<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Water & Pier Elements -->
  <!-- Water depth -->
  <path d="M0 160 C 60 155, 120 165, 240 160 L 240 240 L 0 240 Z" fill="#1E2430"/>
  
  <!-- Water surface ripples -->
  <path d="M20 175 Q 50 170 80 175 T 140 175 T 200 175 T 230 175" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 195 Q 70 190 100 195 T 160 195 T 220 195" fill="none" stroke="#2D3748" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wooden Pier / Dock on the right -->
  <rect x="170" y="130" width="70" height="110" fill="#252D3D"/>
  <!-- Pier planks / lines -->
  <line x1="170" y1="145" x2="240" y2="145" stroke="#1A1D24" stroke-width="3"/>
  <line x1="170" y1="165" x2="240" y2="165" stroke="#1A1D24" stroke-width="3"/>
  <line x1="170" y1="185" x2="240" y2="185" stroke="#1A1D24" stroke-width="3"/>
  <line x1="170" y1="205" x2="240" y2="205" stroke="#1A1D24" stroke-width="3"/>
  <!-- Pier wooden pillars -->
  <rect x="180" y="150" width="10" height="90" fill="#161A23"/>
  <rect x="220" y="150" width="10" height="90" fill="#161A23"/>

  <!-- Mooring Bollard on the Pier (Accent Gold/Orange) -->
  <path d="M 195 120 Q 195 110 205 110 Q 215 110 215 120 L 218 130 L 192 130 Z" fill="#FFB703"/>
  <rect x="198" y="120" width="14" height="15" fill="#FB8500"/>

  <!-- Fishing Boat (Centered/Focal Physical Object) -->
  <g transform="translate(15, 20)">
    <!-- Hull Shadow in water -->
    <path d="M 30 145 C 50 155, 110 155, 130 145 Z" fill="#14171F"/>

    <!-- Main Hull (Modern Flat Style) -->
    <path d="M 15 125 L 145 125 C 135 142, 25 142, 15 125 Z" fill="#E63946"/>
    <!-- Hull Accent Stripe -->
    <path d="M 18 128 L 142 128 C 133 138, 27 138, 18 128 Z" fill="#F1FAEE"/>

    <!-- Cabin / Deckhouse -->
    <rect x="55" y="90" width="50" height="35" rx="4" fill="#F1FAEE"/>
    <!-- Cabin Windows -->
    <rect x="63" y="98" width="14" height="14" rx="2" fill="#1D3557"/>
    <rect x="83" y="98" width="14" height="14" rx="2" fill="#1D3557"/>

    <!-- Roof -->
    <path d="M 50 90 L 110 90 L 105 80 L 55 80 Z" fill="#457B9D"/>

    <!-- Mast & Flag -->
    <rect x="78" y="50" width="4" height="30" fill="#A8DADC"/>
    <polygon points="82,52 98,58 82,64" fill="#FFB703"/>

    <!-- Safety Life Ring on Cabin -->
    <circle cx="102" cy="105" r="5" fill="#FFB703"/>
    <circle cx="102" cy="105" r="2" fill="#F1FAEE"/>
  </g>

  <!-- Mooring Rope (Connecting Boat to Bollard - Semantic Indicator of "Tíngbó" / Mooring) -->
  <path d="M 108 135 Q 150 115 198 122" fill="none" stroke="#FFB703" stroke-width="3" stroke-dasharray="4 2" stroke-linecap="round"/>

  <!-- Focus/Anchor Graphic Element (Subtle indicator top-left for educational UI) -->
  <circle cx="32" cy="32" r="16" fill="#252D3D"/>
  <path d="M 32 23 V 37 M 26 31 L 32 37 L 38 31 M 28 41 H 36" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>