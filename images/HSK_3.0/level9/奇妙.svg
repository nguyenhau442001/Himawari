<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#162032" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Firefly Gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Magic Mushroom Cap Gradient -->
    <linearGradient id="shroomCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Character Outfit Colors -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Clip Path for Canvas Bounds -->
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Background Space & Night Sky -->
    <rect width="240" height="240" fill="url(#skyGrad)" />

    <!-- Stars & Cosmic Dust -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="35" cy="30" r="1" />
      <circle cx="85" cy="18" r="1.5" opacity="0.5" />
      <circle cx="120" cy="45" r="1" />
      <circle cx="175" cy="25" r="2" />
      <circle cx="215" cy="55" r="1" />
      <circle cx="20" cy="80" r="1.5" />
      <circle cx="225" cy="115" r="1.2" />
    </g>

    <!-- Nebula / Bioluminescent Glow in Sky -->
    <ellipse cx="180" cy="70" rx="50" ry="25" fill="#10b981" opacity="0.15" filter="blur(8px)" />
    <ellipse cx="60" cy="90" rx="40" ry="20" fill="#ec4899" opacity="0.12" filter="blur(8px)" />

    <!-- Distant Bioluminescent Mountain / Hills -->
    <path d="M-10 200 Q 50 140, 110 170 T 250 150 L 250 240 L -10 240 Z" fill="#0f172a" />
    <path d="M-10 210 Q 80 160, 150 190 T 250 170 L 250 240 L -10 240 Z" fill="#172554" opacity="0.7" />

    <!-- Giant Glowing Forest Flora (Nature's Wonder) -->
    <!-- Giant Mushroom 1 (Left) -->
    <path d="M40 240 Q 42 180, 50 150 L 60 150 Q 58 180, 65 240 Z" fill="#78350f" />
    <path d="M20 150 Q 50 100, 80 150 Z" fill="url(#shroomCap)" />
    <circle cx="35" cy="130" r="4" fill="#fbcfe8" opacity="0.8" />
    <circle cx="55" cy="120" r="6" fill="#fbcfe8" opacity="0.8" />
    <circle cx="70" cy="138" r="3.5" fill="#fbcfe8" opacity="0.8" />

    <!-- Giant Mushroom 2 (Right Background) -->
    <path d="M190 240 Q 188 190, 185 160 L 195 160 Q 198 190, 205 240 Z" fill="#78350f" />
    <path d="M165 160 Q 190 115, 215 160 Z" fill="#10b981" />
    <circle cx="180" cy="142" r="4" fill="#a7f3d0" opacity="0.8" />
    <circle cx="200" cy="148" r="5" fill="#a7f3d0" opacity="0.8" />

    <!-- Glowing Hanging Vines & Leaves -->
    <path d="M0 0 Q 20 40, 15 80 T 30 140" fill="none" stroke="#059669" stroke-width="2" />
    <circle cx="15" cy="80" r="4" fill="#34d399" />
    <circle cx="30" cy="120" r="5" fill="#34d399" />
    <circle cx="22" cy="145" r="6" fill="#34d399" />

    <path d="M240 10 Q 220 50, 225 90 T 210 130" fill="none" stroke="#059669" stroke-width="2.5" />
    <circle cx="225" cy="70" r="5" fill="#34d399" />
    <circle cx="218" cy="110" r="6" fill="#34d399" />

    <!-- Foreground Grass Silhouette -->
    <path d="M-10 240 L-10 215 Q 10 210, 25 240 Z" fill="#0f172a" />
    <path d="M15 240 Q 30 200, 45 240 Z" fill="#0f172a" />
    <path d="M210 240 Q 225 205, 240 235 L 240 240 Z" fill="#0f172a" />

    <!-- Glowing Magical Flora / Flowers on Ground -->
    <circle cx="95" cy="205" r="3" fill="#fbbf24" filter="blur(1px)" />
    <path d="M95 215 Q 93 205, 95 195" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="95" cy="195" r="5" fill="#ec4899" />
    <circle cx="95" cy="195" r="2" fill="#fff" />

    <circle cx="145" cy="210" r="3" fill="#fbbf24" filter="blur(1px)" />
    <path d="M145 220 Q 147 210, 145 200" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="145" cy="200" r="6" fill="#38bdf8" />
    <circle cx="145" cy="200" r="2.5" fill="#fff" />

    <!-- CHARACTER: Curious Explorer sitting/kneeling, gazing in awe -->
    <g transform="translate(100, 140)">
      <!-- Legs (Kneeling/Sitting posture) -->
      <path d="M -15 60 L 0 65 L 15 60 L 20 85 L 5 90 L -10 85 Z" fill="#1e3a8a" />
      <ellipse cx="-12" cy="87" rx="6" ry="4" fill="#0f172a" />
      <ellipse cx="12" cy="89" rx="6" ry="4" fill="#0f172a" />

      <!-- Torso & Jacket -->
      <path d="M -18 30 Q -25 50, -10 65 L 15 65 Q 25 50, 18 30 Z" fill="url(#jacketGrad)" />
      <!-- Backpack strap -->
      <path d="M -12 32 L -5 62" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

      <!-- Head & Face (Looking Upwards in Wonder) -->
      <circle cx="2" cy="12" r="14" fill="#ffedd5" />
      <!-- Hair -->
      <path d="M -12 10 Q -15 -2, 0 -2 Q 15 -2, 16 12 Q 10 5, 2 5 Q -6 5, -12 10 Z" fill="#78350f" />
      <!-- Expressive Face: Wide open eyes, smiling in absolute wonder -->
      <circle cx="6" cy="12" r="2" fill="#1e293b" />
      <circle cx="12" cy="13" r="2" fill="#1e293b" />
      <path d="M 7 18 Q 11 21, 14 17" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <!-- Rosy Cheeks -->
      <circle cx="10" cy="16" r="2.5" fill="#fca5a5" opacity="0.6" />

      <!-- Arms Reaching Out / Up in Awe -->
      <!-- Left Arm (Back) -->
      <path d="M -15 35 Q -25 35, -28 45" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
      <!-- Right Arm (Raised towards the magic) -->
      <path d="M 15 35 Q 30 30, 38 18" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="40" cy="15" r="3" fill="#ffedd5" />
    </g>

    <!-- MAGICAL ELEMENTS: Glowing Fireflies & Floating Particles swirling around -->
    <!-- Large Central Glow for Focus -->
    <circle cx="120" cy="100" r="50" fill="url(#glow)" opacity="0.4" />
    <circle cx="70" cy="120" r="35" fill="url(#glow)" opacity="0.3" />

    <!-- Individual Fireflies / Magic Sparks -->
    <g>
      <!-- Firefly 1 -->
      <circle cx="125" cy="95" r="8" fill="url(#glow)" />
      <circle cx="125" cy="95" r="2.5" fill="#fff" />

      <!-- Firefly 2 -->
      <circle cx="100" cy="75" r="6" fill="url(#glow)" />
      <circle cx="100" cy="75" r="2" fill="#fff" />

      <!-- Firefly 3 -->
      <circle cx="150" cy="115" r="7" fill="url(#glow)" />
      <circle cx="150" cy="115" r="2" fill="#fff" />

      <!-- Firefly 4 -->
      <circle cx="75" cy="135" r="5" fill="url(#glow)" />
      <circle cx="75" cy="135" r="1.5" fill="#fff" />

      <!-- Firefly 5 -->
      <circle cx="140" cy="60" r="6" fill="url(#glow)" />
      <circle cx="140" cy="60" r="2" fill="#fff" />

      <!-- Additional Tiny Floating Specks -->
      <circle cx="110" cy="130" r="1.5" fill="#fbbf24" opacity="0.9" />
      <circle cx="130" cy="140" r="2" fill="#f59e0b" opacity="0.8" />
      <circle cx="90" cy="95" r="1.2" fill="#38bdf8" opacity="0.9" />
      <circle cx="165" cy="90" r="1.8" fill="#34d399" opacity="0.9" />
      <circle cx="80" cy="60" r="1.5" fill="#ec4899" opacity="0.9" />
      <circle cx="155" cy="145" r="1" fill="#fbbf24" opacity="0.7" />
    </g>

    <!-- Swirling Magic Trail Lines -->
    <path d="M 140 150 Q 130 110, 100 90 T 70 80" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
    <path d="M 90 160 Q 120 130, 145 100 T 150 65" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 4" opacity="0.5" />

    <!-- Foreground Atmosphere / Soft Vignette -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.15" />
  </g>
</svg>