<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Office/Study Interior) -->
  <!-- Wallpaper Grid / Accents -->
  <path d="M0 40 H240 M0 80 H240 M0 120 H240" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
  <path d="M60 0 V140 M120 0 V140 M180 0 V140" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Window showing night/cityscape context -->
  <path d="M165 20 H220 V110 H165 Z" fill="#0b0f19" stroke="#475569" stroke-width="2"/>
  <rect x="173" y="28" width="18" height="35" fill="#38bdf8" opacity="0.2" rx="2"/>
  <rect x="197" y="28" width="18" height="50" fill="#38bdf8" opacity="0.3" rx="2"/>
  <rect x="173" y="68" width="18" height="35" fill="#38bdf8" opacity="0.1" rx="2"/>

  <!-- Desk Surface -->
  <path d="M10 165 C10 160, 15 155, 20 155 H220 C225 155, 230 160, 230 165 V225 C230 230, 225 235, 220 235 H20 C15 235, 10 230, 10 225 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <!-- Desk front edge highlight -->
  <path d="M10 165 H230" stroke="#475569" stroke-width="2"/>

  <!-- CONTEXT PROPS: The "Gain" (Gold coins/Investment chart) vs The "Loss" (Broken device/Damaged items) -->
  <!-- Computer Monitor (Work/Trading/Risk Context) -->
  <rect x="75" y="80" width="90" height="60" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="79" y="84" width="82" height="44" fill="url(#screenGrad)"/>
  <!-- Downward loss chart on screen -->
  <path d="M 85 95 L 105 110 L 125 100 L 150 122" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="122" r="3" fill="#ef4444"/>
  <!-- Monitor Stand -->
  <path d="M110 140 H130 V155 H110 Z" fill="#475569"/>
  <ellipse cx="120" cy="155" rx="18" ry="3" fill="#334155"/>

  <!-- Glowing background effect representing the unequal trade / "Loss outweighs Gain" -->
  <circle cx="60" cy="110" r="45" fill="url(#glowGold)"/>
  <circle cx="180" cy="110" r="45" fill="url(#glowRed)"/>

  <!-- Small "Gain" prop: A small coin/pouch on the left -->
  <circle cx="45" cy="150" r="10" fill="#f59e0b" filter="url(#shadow)"/>
  <circle cx="45" cy="150" r="7" fill="#fbbf24"/>
  <text x="45" y="154" font-family="sans-serif" font-weight="bold" font-size="10" fill="#b45309" text-anchor="middle">$</text>

  <!-- Big "Loss" prop: Broken/Smoking gadget or shattered item on the right -->
  <g transform="translate(160, 130)">
    <rect x="0" y="0" width="28" height="20" rx="3" fill="#64748b" transform="rotate(-15 14 10)" filter="url(#shadow)"/>
    <path d="M 5 5 L 20 15" stroke="#ef4444" stroke-width="2"/>
    <!-- Smoke puffs -->
    <path d="M 12 -2 C 10 -8, 16 -10, 14 -15 C 18 -18, 22 -12, 18 -6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- MAIN SUBJECT: Regretful/Frustrated Character -->
  <g id="character" filter="url(#shadow)">
    <!-- Body / Torso (leaning forward in regret/shock) -->
    <path d="M 85 200 C 85 175, 100 160, 120 160 C 140 160, 155 175, 155 200 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt Detail -->
    <path d="M 105 160 L 120 178 L 135 160 Z" fill="#f8fafc"/>

    <!-- Arms holding head in despair -->
    <!-- Left Arm -->
    <path d="M 90 175 C 75 165, 70 140, 85 130 C 95 125, 105 135, 100 145" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm -->
    <path d="M 150 175 C 165 165, 170 140, 155 130 C 145 125, 135 135, 140 145" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <path d="M 112 150 H 128 V 162 H 112 Z" fill="#fed7aa"/>

    <!-- Head -->
    <circle cx="120" cy="120" r="26" fill="#fed7aa"/>

    <!-- Hair (Messy/Stressed style) -->
    <path d="M 94 118 C 92 100, 105 92, 120 92 C 135 92, 148 100, 146 118 C 148 108, 142 90, 120 88 C 98 90, 92 108, 94 118 Z" fill="#1e293b"/>
    <!-- Hair tuft standing up from stress -->
    <path d="M 118 88 C 115 78, 122 75, 126 82" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

    <!-- Facial Expressions (Shock / Regret / Realization of bad trade) -->
    <!-- Eyes (Wide, stressed) -->
    <circle cx="110" cy="118" r="4" fill="#1e293b"/>
    <circle cx="130" cy="118" r="4" fill="#1e293b"/>
    <circle cx="111" cy="117" r="1.5" fill="#ffffff"/>
    <circle cx="131" cy="117" r="1.5" fill="#ffffff"/>

    <!-- Worried Eyebrows (Angled sharply upwards) -->
    <path d="M 104 110 L 116 113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 136 110 L 124 113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Open, shocked mouth (realizing loss) -->
    <ellipse cx="120" cy="133" rx="4" ry="6" fill="#1e293b"/>

    <!-- Sweat drop of anxiety -->
    <path d="M 142 115 C 142 115, 147 122, 147 125 C 147 127.8, 144.8 130, 142 130 C 139.2 130, 137 127.8, 137 125 C 137 122, 142 115, 142 115 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Frame Polish -->
  <!-- Subtle top rim light -->
  <path d="M 0 0 H 240" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>