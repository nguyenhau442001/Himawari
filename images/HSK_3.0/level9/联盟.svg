<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Amber Glow for Treaty/Alliance Table -->
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Flag 1 Gradient (Teal/Emerald) -->
    <linearGradient id="flag1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Flag 2 Gradient (Indigo/Cyan) -->
    <linearGradient id="flag2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Architecture (Summit Room) -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  
  <!-- Architectural Paneling / Pillars -->
  <rect x="20" y="20" width="16" height="150" fill="#172033" />
  <rect x="204" y="20" width="16" height="150" fill="#172033" />
  <rect x="40" y="30" width="160" height="130" fill="#131b2e" rx="2" />

  <!-- Large Arched Window in Background -->
  <path d="M 95 40 A 25 25 0 0 1 145 40 L 145 100 L 95 100 Z" fill="#0c1322" />
  <!-- City Skyline Silhouette Outside Window -->
  <path d="M 100 100 L 100 80 L 105 80 L 105 75 L 110 75 L 110 90 L 115 90 L 115 70 L 122 70 L 122 65 L 128 65 L 128 85 L 135 85 L 135 78 L 140 78 L 140 100 Z" fill="#1e293b" />
  <!-- Light Beam from Window -->
  <polygon points="120,40 70,180 170,180" fill="url(#lightBeam)" />

  <!-- Hanging Alliance Banners on the Back Wall -->
  <!-- Banner Left -->
  <polygon points="55,30 75,30 75,90 65,100 55,90" fill="url(#flag1)" />
  <circle cx="65" cy="55" r="6" fill="#fbbf24" />
  <!-- Banner Right -->
  <polygon points="165,30 185,30 185,90 175,100 165,90" fill="url(#flag2)" />
  <circle cx="175" cy="55" r="6" fill="#fbbf24" />

  <!-- Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0a0f1d" />
  <!-- Floor Tile Lines -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#131b2e" stroke-width="1.5" />
  <line x1="0" y1="215" x2="240" y2="215" stroke="#131b2e" stroke-width="1.5" />

  <!-- Ambient Glow around Treaty Table -->
  <circle cx="120" cy="165" r="60" fill="url(#tableGlow)" />

  <!-- Big Wooden Negotiation Table -->
  <!-- Table Legs -->
  <rect x="75" y="160" width="12" height="35" fill="#2d1e12" />
  <rect x="153" y="160" width="12" height="35" fill="#2d1e12" />
  <!-- Table Top (Ellipse/Oval for 3D perspective) -->
  <ellipse cx="120" cy="155" rx="75" ry="18" fill="#452a14" />
  <ellipse cx="120" cy="152" rx="73" ry="16" fill="#5c381a" />
  <!-- Table Edge Highlight -->
  <ellipse cx="120" cy="150" rx="73" ry="14" fill="#784a23" />

  <!-- Treaty Document (Center of Table) -->
  <rect x="105" y="143" width="30" height="16" rx="1" fill="#f8fafc" transform="rotate(-5 120 150)" />
  <!-- Document text lines (abstract) -->
  <line x1="108" y1="147" x2="120" y2="146" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="108" y1="151" x2="125" y2="149" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Wax Seal -->
  <circle cx="128" cy="154" r="3" fill="#ef4444" />

  <!-- Two Golden Desk Flags (Representing Two Nations) -->
  <!-- Left Flag -->
  <line x1="62" y1="150" x2="62" y2="125" stroke="#fbbf24" stroke-width="2" />
  <polygon points="62,125 78,131 62,137" fill="url(#flag1)" />
  <ellipse cx="62" cy="150" rx="5" ry="2" fill="#d97706" />

  <!-- Right Flag -->
  <line x1="178" y1="150" x2="178" y2="125" stroke="#fbbf24" stroke-width="2" />
  <polygon points="178,125 162,131 178,137" fill="url(#flag2)" />
  <ellipse cx="178" cy="150" rx="5" ry="2" fill="#d97706" />


  <!-- CHARACTER LEFT (Delegate 1 - Emerald Tie / Suit) -->
  <!-- Chair Back -->
  <path d="M 50 120 L 75 120 L 72 175 L 53 175 Z" fill="#172554" />
  <!-- Body / Suit -->
  <path d="M 50 170 C 50 150 75 150 75 170 L 80 205 C 80 210 50 210 50 205 Z" fill="#1e3a8a" />
  <!-- Shirt & Tie -->
  <polygon points="62,162 68,162 65,180" fill="#f8fafc" />
  <polygon points="63,166 67,166 66,185 64,185" fill="#059669" />
  
  <!-- Left Arm (Reaching out to shake hands) -->
  <path d="M 55 165 C 65 160 85 155 102 148" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" />
  <!-- Left Hand (Shaking) -->
  <circle cx="106" cy="146" r="5" fill="#fcd34d" />

  <!-- Head Left -->
  <circle cx="62" cy="135" r="14" fill="#fcd34d" />
  <!-- Hair Left (Dark Professional) -->
  <path d="M 48 135 C 48 123 60 120 74 128 C 76 132 72 135 72 135 C 72 135 60 126 50 135 Z" fill="#1e293b" />
  <!-- Friendly Smiling Expression & Glasses -->
  <circle cx="67" cy="133" r="2.5" fill="#0f172a" />
  <path d="M 64 139 Q 67 142 70 139" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  <rect x="64" y="130" width="6" height="4" rx="1" fill="none" stroke="#fbbf24" stroke-width="1" />


  <!-- CHARACTER RIGHT (Delegate 2 - Blue Tie / Suit) -->
  <!-- Chair Back -->
  <path d="M 190 120 L 165 120 L 168 175 L 187 175 Z" fill="#172554" />
  <!-- Body / Suit -->
  <path d="M 190 170 C 190 150 165 150 165 170 L 160 205 C 160 210 190 210 190 205 Z" fill="#334155" />
  <!-- Shirt & Tie -->
  <polygon points="178,162 172,162 175,180" fill="#f8fafc" />
  <polygon points="177,166 173,166 174,185 176,185" fill="#2563eb" />

  <!-- Right Arm (Reaching out to shake hands) -->
  <path d="M 185 165 C 175 160 155 155 138 148" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
  <!-- Right Hand (Shaking - meeting in the center) -->
  <circle cx="134" cy="146" r="5" fill="#fcd34d" />

  <!-- Head Right -->
  <circle cx="178" cy="135" r="14" fill="#fcd34d" />
  <!-- Hair Right -->
  <path d="M 192 135 C 192 123 180 120 166 128 C 164 132 168 135 168 135 C 168 135 180 126 190 135 Z" fill="#0f172a" />
  <!-- Friendly Expression -->
  <circle cx="173" cy="133" r="2.5" fill="#0f172a" />
  <path d="M 170 139 Q 173 142 176 139" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

  <!-- HANDSHAKE INTERLOCK (Center Highlighted Action) -->
  <ellipse cx="120" cy="146" rx="8" ry="5" fill="#fbbf24" />
  <!-- Sparkles / Success Indicator above handshake -->
  <g transform="translate(120, 130)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#fbbf24" />
    <circle cx="10" cy="-8" r="1.5" fill="#38bdf8" />
    <circle cx="-10" cy="-6" r="1.5" fill="#34d399" />
  </g>

  <!-- Foreground Plants for depth & framing -->
  <!-- Left Plant Pot -->
  <path d="M 10 210 L 30 210 L 26 240 L 14 240 Z" fill="#475569" />
  <ellipse cx="20" cy="210" rx="10" ry="3" fill="#64748b" />
  <!-- Plant Leaves (Monstera / Ficus style) -->
  <path d="M 20 207 C 10 190 0 195 -5 185 C 0 180 15 195 20 207 Z" fill="#10b981" />
  <path d="M 20 207 C 30 185 45 180 50 170 C 45 175 25 190 20 207 Z" fill="#059669" />
  <path d="M 20 210 C 20 190 25 180 20 170 C 15 180 15 195 20 210 Z" fill="#34d399" />

  <!-- Right Plant Pot -->
  <path d="M 210 210 L 230 210 L 226 240 L 214 240 Z" fill="#475569" />
  <ellipse cx="220" cy="210" rx="10" ry="3" fill="#64748b" />
  <!-- Plant Leaves -->
  <path d="M 220 207 C 230 190 240 195 245 185 C 240 180 225 195 220 207 Z" fill="#10b981" />
  <path d="M 220 207 C 210 185 195 180 190 170 C 195 175 215 190 220 207 Z" fill="#059669" />

</svg>