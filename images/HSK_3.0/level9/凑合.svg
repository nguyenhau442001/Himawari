<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Interior Details -->
  <!-- Window with Night City Silhouette -->
  <path d="M165 30 H215 V110 H165 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M175 40 H185 V60 H175 Z M195 45 H205 V75 H195 Z M175 70 H185 V95 H175 Z" fill="#f59e0b" opacity="0.4"/>
  <path d="M195 85 H205 V100 H195 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Wall Shelf with Prop -->
  <path d="M25 60 H95 V64 H25 Z" fill="#334155" rx="1"/>
  <circle cx="45" cy="50" r="10" fill="#10b981" opacity="0.8"/>
  <path d="M65 40 H75 V60 H65 Z" fill="#ec4899" opacity="0.7"/>

  <!-- Cork Notice Board -->
  <rect x="25" y="75" width="50" height="40" rx="2" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <rect x="32" y="82" width="16" height="12" fill="#fef08a" transform="rotate(-5 32 82)"/>
  <rect x="52" y="86" width="14" height="18" fill="#fbcfe8" transform="rotate(8 52 86)"/>

  <!-- Ambient Light from Lamp -->
  <circle cx="120" cy="110" r="70" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Desk Surface -->
  <path d="M10 185 H230 V225 H10 Z" fill="#334155"/>
  <path d="M10 185 H230 V191 H10 Z" fill="#475569"/>

  <!-- Workspace Props: Laptop & Project Papers -->
  <!-- Laptop Base -->
  <path d="M85 170 L70 187 H165 L150 170 Z" fill="#94a3b8" filter="url(#dropShadow)"/>
  <path d="M78 178 H157 V182 H78 Z" fill="#64748b"/>
  <!-- Laptop Screen -->
  <path d="M87 115 H148 V171 H87 Z" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <path d="M92 120 H143 V164 H92 Z" fill="url(#screenGlow)"/>
  <!-- Abstract "Plan" Wireframe on Screen -->
  <path d="M98 130 H137 M98 140 H125 M98 150 H132" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="130" cy="140" r="4" fill="#10b981"/>

  <!-- Messy Project Papers with "Fixes/Patches" (representing "còuhe" - making do) -->
  <g transform="translate(160, 150) rotate(12)">
    <rect width="35" height="45" fill="#f8fafc" rx="1" filter="url(#dropShadow)"/>
    <path d="M5 8 H30 M5 16 H22 M5 24 H28" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Sticky note patch (Fixing the plan) -->
    <rect x="10" y="20" width="22" height="20" fill="#fef08a" transform="rotate(-6 10 20)"/>
    <path d="M13 27 H28 M13 33 H22" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="45" y="158" width="18" height="24" rx="3" fill="#cbd5e1"/>
  <path d="M63 164 C68 164 68 176 63 176" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <path d="M48 154 C50 150 52 150 54 154" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Desk Lamp -->
  <path d="M195 185 V125" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M195 125 L180 110" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 100 L190 120 L200 105 L180 85 Z" fill="#f59e0b" filter="url(#dropShadow)"/>

  <!-- Main Character: Sitting at Desk, making a "so-so" gesture -->
  <!-- Chair Back -->
  <path d="M90 105 C90 90 110 90 110 105 V185 H90 Z" fill="#1e293b"/>

  <!-- Character Body & Shoulders -->
  <path d="M82 145 C82 125 138 125 138 145 V185 H82 Z" fill="#3b82f6"/> <!-- Blue hoodie/shirt -->

  <!-- Neck and Head -->
  <path d="M102 125 H118 V135 H102 Z" fill="#fbcfe8"/>
  <circle cx="110" cy="108" r="18" fill="#fbcfe8" filter="url(#dropShadow)"/>

  <!-- Hair (Stylized expressive dark hair) -->
  <path d="M92 108 C92 92 128 92 128 108 C128 112 125 115 125 115 C125 115 120 102 110 102 C100 102 95 115 95 115 C95 115 92 112 92 108 Z" fill="#334155"/>

  <!-- Facial Expression: Pragmatic / Hesitant smile ("tạm tạm") -->
  <!-- Eyebrows (one slightly raised in skeptical acceptance) -->
  <path d="M100 101 Q105 98 110 102" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M115 102 Q120 98 123 103" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Eyes (calm, squinted in evaluation) -->
  <circle cx="104" cy="108" r="1.5" fill="#1e293b"/>
  <circle cx="118" cy="108" r="1.5" fill="#1e293b"/>
  <!-- Mouth (asymmetrical subtle grin / wry acceptance) -->
  <path d="M104 116 Q110 113 118 117" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Arms & Hands performing the "So-So" gesture (Horizontal waving hand / palm down) -->
  <!-- Left arm resting -->
  <path d="M85 145 L72 165 L85 175" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right arm raised gesturing "so-so" (rocking palm) -->
  <path d="M135 145 L155 135 L145 122" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand waving flat (expressing 'barely acceptable / passable') -->
  <path d="M140 115 C140 112 152 110 156 118 C160 126 148 128 140 115 Z" fill="#fbcfe8" filter="url(#dropShadow)"/>

  <!-- Foreground decorative elements for depth -->
  <path d="M0 240 V225 C40 220 80 230 120 225 C160 220 200 230 240 225 V240 Z" fill="#0f172a" opacity="0.5"/>
</svg>