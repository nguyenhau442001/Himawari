<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Hospital Interior -->
    <radialGradient id="roomGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>

    <!-- Glass Partition Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Patient Uniform -->
    <linearGradient id="patientSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Ambient Light Base -->
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)"/>

  <!-- Back Wall & Floor Line -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#334155" stroke-width="2"/>
  <path d="M0 185 L0 240 L240 240 L240 185 Z" fill="url(#floorGrad)"/>

  <!-- BACKGROUND DETAILS (Patient Room Left Side) -->
  <!-- Medical Monitor on stand -->
  <g transform="translate(30, 115)">
    <!-- Stand -->
    <rect x="18" y="30" width="4" height="40" fill="#64748b"/>
    <path d="M10 70 L30 70" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Screen -->
    <rect x="0" y="0" width="40" height="30" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Vital Wave Line -->
    <path d="M5 15 L12 15 L16 8 L20 22 L24 12 L28 15 L35 15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- IV Pole & Bag -->
  <g transform="translate(15, 80)">
    <line x1="10" y1="0" x2="10" y2="105" stroke="#64748b" stroke-width="2"/>
    <path d="M5 0 L15 0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 10 C5 10 5 25 10 25 C15 25 15 10 10 10 Z" fill="#38bdf8" opacity="0.8"/>
    <line x1="10" y1="25" x2="10" y2="50" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- THE PATIENT (Left side, inside isolation) -->
  <g transform="translate(55, 105)">
    <!-- Bed Headboard -->
    <rect x="-10" y="35" width="15" height="45" rx="3" fill="#475569"/>
    <!-- Pillow -->
    <ellipse cx="12" cy="42" rx="12" ry="7" fill="#f8fafc"/>
    <!-- Patient Body under blanket -->
    <path d="M5 50 C20 50 65 50 75 80 L0 80 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Patient Head & Face -->
    <circle cx="15" cy="35" rx="13" ry="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M2 28 C5 22 25 22 28 30 C28 35 15 35 2 28 Z" fill="#334155"/>
    <!-- Medical Mask over face -->
    <path d="M10 33 C14 33 18 35 18 38 C18 41 12 41 10 38 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Gentle reassuring closed eyes -->
    <path d="M13 32 Q15 34 17 32" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <!-- IV Tube entering arm -->
    <path d="M-25 10 Q -10 20 5 48" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- GLASS PARTITION (The physical barrier representing "Isolation/隔离") -->
  <!-- Glass Pane Area -->
  <rect x="110" y="30" width="20" height="155" fill="url(#glassGrad)" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Glass Highlight Streaks -->
  <line x1="116" y1="40" x2="124" y2="120" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="122" y1="80" x2="114" y2="160" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
  <!-- Frame Top/Bottom/Sides -->
  <rect x="107" y="25" width="26" height="5" rx="1" fill="#334155"/>
  <rect x="107" y="180" width="26" height="6" rx="1" fill="#334155"/>

  <!-- DOCTOR / VISITOR (Right side, outside isolation) -->
  <g transform="translate(155, 95)">
    <!-- Doctor Body / Lab Coat -->
    <path d="M15 40 L35 40 L45 90 L5 90 Z" fill="#f8fafc"/>
    <path d="M25 40 L25 90" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Stethoscope -->
    <path d="M22 42 C15 45 15 55 20 60" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="20" cy="61" r="3" fill="#94a3b8"/>
    
    <!-- Doctor Head -->
    <circle cx="25" cy="23" rx="12" ry="13" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M14 20 C14 12 36 12 36 20 C32 17 18 17 14 20 Z" fill="#1e293b"/>
    <!-- Medical Mask (Worn properly outside) -->
    <path d="M18 22 C22 21 30 21 32 25 C32 28 20 28 18 25 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Focused/Empathetic Eyes -->
    <circle cx="22" cy="20" r="1.5" fill="#334155"/>
    <circle cx="29" cy="20" r="1.5" fill="#334155"/>

    <!-- Clipboard Prop held by doctor -->
    <g transform="translate(-3, 45)">
      <rect x="0" y="0" width="18" height="24" rx="2" fill="#94a3b8"/>
      <rect x="2" y="3" width="14" height="19" rx="1" fill="#f8fafc"/>
      <rect x="6" y="-1" width="6" height="3" rx="1" fill="#475569"/>
      <line x1="5" y1="8" x2="13" y2="8" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="12" x2="11" y2="12" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="16" x2="12" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Warm reassuring gesture: Hand raised towards glass -->
    <path d="M38 50 C45 50 48 55 46 58" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND / ENVIRONMENT DETAILS -->
  <!-- Warning / Safety Signage on Wall (Symbolic, No text) -->
  <g transform="translate(195, 45)">
    <polygon points="12,2 22,20 2,20" fill="#f59e0b"/>
    <circle cx="12" cy="14" r="1.5" fill="#0f172a"/>
    <rect x="11" y="8" width="2" height="4" rx="1" fill="#0f172a"/>
  </g>

  <!-- Plant for warm organic contrast -->
  <g transform="translate(205, 155)">
    <path d="M10 30 L15 30 L20 30 L15 10 Z" fill="#64748b"/>
    <ellipse cx="15" cy="30" rx="6" ry="3" fill="#475569"/>
    <!-- Leaves -->
    <path d="M15 10 C15 -5 5 -10 0 -5 C-5 0 0 10 15 10 Z" fill="#10b981" opacity="0.9"/>
    <path d="M15 10 C20 -2 30 -5 35 0 C40 5 30 15 15 10 Z" fill="#059669" opacity="0.9"/>
    <path d="M15 12 C18 0 25 -10 22 -15 C18 -20 10 -10 15 12 Z" fill="#34d399" opacity="0.8"/>
  </g>

  <!-- Ceiling Light Fixture casting soft vertical illumination -->
  <path d="M100 0 L140 0 L130 15 L110 15 Z" fill="#475569"/>
  <ellipse cx="120" cy="15" rx="10" ry="3" fill="#fde047"/>
  
  <!-- Subtle lighting cone over glass partition -->
  <polygon points="120,15 80,185 160,185" fill="#38bdf8" opacity="0.04"/>

</svg>