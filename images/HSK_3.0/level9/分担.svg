<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Subtle Visual Anchors -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#2A2E39" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M120 40 L120 200" stroke="#2A2E39" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- Central Object: Balanced Dual-load Platform / Shared Weight Scale representing "分担" (Sharing burdens/responsibilities) -->
  
  <!-- Base Stand & Pivot -->
  <path d="M100 195 L140 195 L135 175 L105 175 Z" fill="#4F5D75"/>
  <rect x="117" y="105" width="6" height="75" fill="#4F5D75" rx="3"/>
  <circle cx="120" cy="105" r="8" fill="#F39C12"/>

  <!-- Main Balance Beam -->
  <path d="M50 115 L190 115 L180 103 L60 103 Z" fill="#E0E6ED" rx="2"/>

  <!-- Left Hanging Load (House/Family & Child iconography combined into physical block) -->
  <g transform="translate(55, 115)">
    <!-- Strings -->
    <line x1="10" y1="0" x2="5" y2="35" stroke="#94A3B8" stroke-width="2"/>
    <line x1="30" y1="0" x2="35" y2="35" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Tray Platform -->
    <ellipse cx="20" cy="35" rx="22" ry="5" fill="#4F5D75"/>
    
    <!-- Shared Weight Object: House/Family block -->
    <path d="M8 35 L8 15 L20 5 L32 15 L32 35 Z" fill="#3B82F6"/>
    <!-- Window cutout -->
    <rect x="15" y="18" width="10" height="10" fill="#1A1D24" rx="2"/>
  </g>

  <!-- Right Hanging Load (Balanced weight block) -->
  <g transform="translate(145, 115)">
    <!-- Strings -->
    <line x1="10" y1="0" x2="5" y2="35" stroke="#94A3B8" stroke-width="2"/>
    <line x1="30" y1="0" x2="35" y2="35" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Tray Platform -->
    <ellipse cx="20" cy="35" rx="22" ry="5" fill="#4F5D75"/>
    
    <!-- Shared Weight Object: Matching Responsibility block -->
    <rect x="8" y="12" width="24" height="23" fill="#10B981" rx="3"/>
    <!-- Detail lines representing shared tasks -->
    <line x1="13" y1="18" x2="27" y2="18" stroke="#E0E6ED" stroke-width="2" stroke-linecap="round"/>
    <line x1="13" y1="26" x2="27" y2="26" stroke="#E0E6ED" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Equal Distribution Indicator (Gold accent arcs showing cooperative split) -->
  <path d="M95 75 A 30 30 0 0 1 145 75" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  <polygon points="120,42 125,50 115,50" fill="#F39C12"/>

  <!-- Human Interaction Symbolism: Two stylized hands supporting from below -->
  <g fill="none" stroke="#E0E6ED" stroke-width="3" stroke-linecap="round">
    <!-- Left Supporting Hand -->
    <path d="M75 165 C85 165 95 155 100 145"/>
    <!-- Right Supporting Hand -->
    <path d="M165 165 C155 165 145 155 140 145"/>
  </g>

</svg>