<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle elements -->
  <circle cx="120" cy="120" r="90" fill="#222630" opacity="0.5"/>
  <path d="M50 180 L190 180" stroke="#2D323F" stroke-width="2" stroke-linecap="round"/>

  <!-- Contrast Rule for Adjective: Scale Exaggeration & Conceptual Metaphor -->
  <!-- On the left: Complex, solid adult building blocks (structured, professional skyscraper concept) -->
  <g transform="translate(45, 95)">
    <!-- Base structure -->
    <rect x="0" y="20" width="40" height="65" rx="4" fill="#2E384D"/>
    <rect x="8" y="32" width="24" height="12" rx="2" fill="#52607D"/>
    <rect x="8" y="52" width="24" height="12" rx="2" fill="#52607D"/>
    <!-- Top antenna/tip -->
    <line x1="20" y1="20" x2="20" y2="8" stroke="#52607D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="6" r="3" fill="#F59E0B"/>
  </g>

  <!-- On the right: Oversized, clumsy, child-like stack (naive, unrefined idea) -->
  <g transform="translate(130, 85)">
    <!-- Wobbly mismatched blocks leaning/stacked -->
    <!-- Bottom block -->
    <rect x="5" y="55" width="55" height="30" rx="4" fill="#3B4252" transform="rotate(-4 32.5 70)"/>
    
    <!-- Middle block (offset clumsily) -->
    <rect x="12" y="28" width="42" height="29" rx="4" fill="#4C566A" transform="rotate(6 33 42.5)"/>
    
    <!-- Top block (toy-like, bright orange accent showing "immature/childish" focus) -->
    <rect x="18" y="2" width="30" height="28" rx="6" fill="#F59E0B" transform="rotate(-8 33 16)"/>
    <!-- Playful face / primitive smiley on the top block to clearly signify "childish/naive thought" -->
    <circle cx="26" cy="12" r="2.5" fill="#1A1D24"/>
    <circle cx="40" cy="11" r="2.5" fill="#1A1D24"/>
    <path d="M30 20 Q33 24 36 20" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Visualizing "Thought" process / Speech bubble connecting them -->
  <g transform="translate(0, 0)">
    <!-- Main thought bubble -->
    <path d="M 90 75 Q 120 50 150 75 Q 150 95 120 95 Q 90 95 90 75 Z" fill="#262D3D" stroke="#3B4252" stroke-width="2"/>
    <!-- Thought trail dots -->
    <circle cx="82" cy="85" r="3" fill="#3B4252"/>
    <circle cx="75" cy="93" r="2" fill="#3B4252"/>
    
    <!-- Exaggerated contrast spark/question mark inside the thought bubble to denote "naive idea" -->
    <path d="M 113 72 C 113 65, 127 65, 127 72 C 127 77, 120 78, 120 83" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="90" r="1.5" fill="#F59E0B"/>
  </g>

</svg>