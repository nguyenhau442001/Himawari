<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background security grid lines (subtle) -->
  <g stroke="#262B35" stroke-width="1" opacity="0.4">
    <line x1="30" y1="40" x2="210" y2="40" />
    <line x1="30" y1="80" x2="210" y2="80" />
    <line x1="30" y1="120" x2="210" y2="120" />
    <line x1="30" y1="160" x2="210" y2="160" />
    <line x1="30" y1="200" x2="210" y2="200" />
    <line x1="50" y1="20" x2="50" y2="220" />
    <line x1="90" y1="20" x2="90" y2="220" />
    <line x1="130" y1="20" x2="130" y2="220" />
    <line x1="170" y1="20" x2="170" y2="220" />
    <line x1="210" y1="20" x2="210" y2="220" />
  </g>

  <!-- Server / Device Terminal Frame -->
  <rect x="55" y="50" width="130" height="100" rx="8" fill="#222733" stroke="#343C4D" stroke-width="2"/>
  
  <!-- Screen Header -->
  <rect x="55" y="50" width="130" height="20" rx="8" fill="#1E232E"/>
  <circle cx="67" cy="60" r="3" fill="#FF5F56"/>
  <circle cx="77" cy="60" r="3" fill="#FFBD2E"/>
  <circle cx="87" cy="60" r="3" fill="#27C93F"/>

  <!-- Server Screen Content (Data stream lines) -->
  <line x1="68" y1="85" x2="110" y2="85" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="100" x2="140" y2="100" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="115" x2="95" y2="115" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  
  <!-- User/Data Padlock -->
  <rect x="135" y="105" width="34" height="28" rx="4" fill="#3B82F6"/>
  <path d="M143 105 V95 C143 90 147 86 152 86 C157 86 161 90 161 95 V105" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="152" cy="116" r="3" fill="#1E293B"/>
  <path d="M152 119 V124" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

  <!-- The Hacker / Thief Character (Dark hooded figure operating from outside) -->
  <g transform="translate(115, 95)">
    <!-- Hooded Body -->
    <path d="M35 75 C35 60 45 45 65 45 C85 45 95 60 95 75 L105 110 H25 Z" fill="#0F1117"/>
    <!-- Hood Shadow / Face -->
    <path d="M45 48 C45 35 55 25 65 25 C75 25 85 35 85 48 C85 58 78 62 65 62 C52 62 45 58 45 48 Z" fill="#0B0D12"/>
    <!-- Glowing Red Hacker Eyes -->
    <circle cx="58" cy="48" r="3" fill="#FF3333"/>
    <circle cx="72" cy="48" r="3" fill="#FF3333"/>
    <!-- Evil Smirk -->
    <path d="M60 56 Q65 60 70 56" fill="none" stroke="#FF3333" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Digital Extraction / Theft Beam (Gold/Orange high-contrast accent) -->
  <g>
    <!-- Pulled Data Cube / File flowing out -->
    <path d="M 125 105 L 145 90 L 165 105 L 145 120 Z" fill="#F59E0B" opacity="0.9"/>
    <path d="M 125 105 L 145 120 V 135 L 125 120 Z" fill="#D97706" opacity="0.9"/>
    <path d="M 165 105 L 145 120 V 135 L 165 120 Z" fill="#FBBF24" opacity="0.9"/>

    <!-- Data streams flowing upward toward the thief -->
    <path d="M135 95 Q145 75 160 60" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
    <path d="M148 100 Q160 80 175 65" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  </g>

  <!-- Base Stand for the Terminal -->
  <path d="M95 150 L145 150 L155 170 H85 Z" fill="#2C3240"/>
  <rect x="75" y="170" width="90" height="8" rx="4" fill="#3B4252"/>
</svg>