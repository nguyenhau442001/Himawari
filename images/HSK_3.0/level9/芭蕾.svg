<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Stage lighting effect -->
  <path d="M120 15 L200 180 L40 180 Z" fill="url(#spotlight)" opacity="0.15"/>
  <ellipse cx="120" cy="180" rx="70" ry="15" fill="#E5A93B" opacity="0.1"/>

  <!-- Definitions -->
  <defs>
    <linearGradient id="spotlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E5A93B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dancerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#E5A93B"/>
    </linearGradient>
    <linearGradient id="tutuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E5A93B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Motion lines / grace arcs -->
  <path d="M 65 110 C 75 90, 100 80, 115 85" stroke="#E5A93B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
  <path d="M 175 110 C 165 90, 140 80, 125 85" stroke="#E5A93B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
  <path d="M 90 190 C 110 198, 130 198, 150 190" stroke="#E5A93B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Dancer Figure (Action / Dynamic Pose) -->
  <g transform="translate(0, 5)">
    <!-- Standing Leg (En pointe) -->
    <path d="M 120 100 L 120 165" stroke="url(#dancerGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Pointe shoe tip -->
    <path d="M 117 167 L 123 167" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Lifted Leg (Attitude pose) -->
    <path d="M 120 145 C 135 130, 155 125, 160 140" stroke="url(#dancerGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Torso -->
    <path d="M 120 105 C 118 90, 122 75, 120 65" stroke="url(#dancerGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Tutu (Layered skirt) -->
    <path d="M 95 102 C 105 112, 135 112, 145 102 C 148 97, 92 97, 95 102 Z" fill="url(#tutuGrad)"/>
    <ellipse cx="120" cy="100" rx="26" ry="7" fill="#FFFFFF" opacity="0.8"/>

    <!-- Head & Bun -->
    <circle cx="120" cy="52" r="5.5" fill="url(#dancerGrad)"/>
    <circle cx="123" cy="50" r="2.5" fill="#E5A93B"/>

    <!-- Arms (Graceful curved port de bras) -->
    <path d="M 120 72 C 100 65, 80 80, 75 95" stroke="url(#dancerGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 120 72 C 140 65, 160 80, 165 95" stroke="url(#dancerGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkles / Stage Dust -->
  <circle cx="85" cy="85" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="160" cy="75" r="2" fill="#E5A93B" opacity="0.9"/>
  <circle cx="145" cy="135" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="95" cy="140" r="1.5" fill="#E5A93B" opacity="0.8"/>
  <polygon points="175,130 177,135 182,137 177,139 175,144 173,139 168,137 173,135" fill="#FFFFFF" opacity="0.6"/>
  <polygon points="65,120 66,123 69,124 66,125 65,128 64,125 61,124 64,123" fill="#E5A93B" opacity="0.7"/>
</svg>