<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Environment Background -->
  <!-- Wallpaper / Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4"/>
  
  <!-- Window showing night city -->
  <rect x="145" y="35" width="60" height="75" rx="4" fill="url(#windowGrad)" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="35" x2="175" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="145" y1="72" x2="205" y2="72" stroke="#334155" stroke-width="2"/>
  <!-- City lights through window -->
  <circle cx="155" cy="90" r="1.5" fill="#f59e0b"/>
  <circle cx="162" cy="85" r="1" fill="#38bdf8"/>
  <circle cx="195" cy="95" r="1.5" fill="#f59e0b"/>
  <circle cx="185" cy="88" r="1" fill="#ec4899"/>

  <!-- Bookshelf on wall -->
  <rect x="35" y="45" width="50" height="8" rx="2" fill="#475569"/>
  <path d="M42 45 L42 33 L48 33 L48 45 Z" fill="#38bdf8"/>
  <path d="M52 45 L52 30 L59 30 L59 45 Z" fill="#f43f5e"/>
  <path d="M63 45 L63 35 L69 35 L69 45 Z" fill="#10b981"/>

  <!-- Warm Desk Lamp -->
  <circle cx="120" cy="70" r="35" fill="url(#lampGlow)" filter="url(#glow)"/>
  <path d="M110 50 L130 50 L125 35 L115 35 Z" fill="#f59e0b"/>
  <path d="M120 50 L120 75" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 75 L130 75" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Light beam cone -->
  <polygon points="120,50 90,145 150,145" fill="#fbbf24" opacity="0.08"/>

  <!-- Wooden Desk Surface -->
  <path d="M15 150 L225 150 L215 170 L25 170 Z" fill="url(#tableGrad)"/>
  <rect x="15" y="145" width="210" height="7" rx="2" fill="#475569"/>

  <!-- Desk Props -->
  <!-- Open Notebook -->
  <path d="M75 152 L110 148 L110 162 L75 166 Z" fill="#f8fafc"/>
  <path d="M110 148 L145 152 L145 166 L110 162 Z" fill="#f8fafc"/>
  <line x1="110" y1="148" x2="110" y2="162" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Mug -->
  <rect x="50" y="148" width="14" height="16" rx="3" fill="#38bdf8"/>
  <path d="M64 153 C68 153 68 160 64 161" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- CHARACTER 1: Listener (Confiant / Reassured) (Left) -->
  <g transform="translate(45, 80)">
    <!-- Body / Torso -->
    <path d="M15 70 C15 55 35 55 45 70 L55 90 C55 90 20 95 10 90 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="30" cy="38" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M17 38 C16 25 30 22 42 30 C45 32 46 38 46 38 C46 38 40 28 30 27 C20 26 17 38 17 38 Z" fill="#1e293b"/>
    <!-- Facial expression: Warm, trusting smile, eyes wide with conviction -->
    <circle cx="26" cy="37" r="1.5" fill="#1e293b"/>
    <circle cx="36" cy="37" r="1.5" fill="#1e293b"/>
    <path d="M29 43 Q31 46 34 43" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheek -->
    <circle cx="37" cy="41" r="2.5" fill="#fca5a5" opacity="0.6"/>
    <!-- Hand on chin / confident pose -->
    <path d="M35 58 C35 55 42 52 44 56 C46 60 41 62 38 60 Z" fill="#fed7aa"/>
  </g>

  <!-- CHARACTER 2: Speaker (Honest, open gesture) (Right) -->
  <g transform="translate(125, 75)">
    <!-- Body / Torso -->
    <path d="M20 75 C25 55 50 55 60 75 L75 95 C75 95 35 100 15 95 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="45" cy="40" r="14" fill="#fbcfe8"/>
    <!-- Hair (Styled neat short) -->
    <path d="M32 38 C32 25 50 24 58 35 C58 35 55 28 45 28 C35 28 32 38 32 38 Z" fill="#475569"/>
    <!-- Facial expression: Earnest, speaking with absolute sincerity -->
    <circle cx="41" cy="39" r="1.5" fill="#1e293b"/>
    <circle cx="51" cy="39" r="1.5" fill="#1e293b"/>
    <ellipse cx="46" cy="45" rx="2" ry="2.5" fill="#9f1239"/> <!-- Open honest mouth -->
    <!-- Expressive Hand Gesture (Open palm assuring truth) -->
    <path d="M55 65 C62 60 72 65 68 73 C65 80 58 75 55 70 Z" fill="#fbcfe8"/>
    <path d="M68 66 L74 64" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Visual Metaphor of Trust / Certainty: Floating Glowing Checkmark / Sparkles above them -->
  <g transform="translate(100, 30)" filter="url(#glow)">
    <circle cx="20" cy="20" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M12 20 L17 25 L28 14" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accent Sparkles for Emotional Resonance -->
  <path d="M95 55 L97 60 L102 62 L97 64 L95 69 L93 64 L88 62 L93 60 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M142 50 L143 53 L146 54 L143 55 L142 58 L141 55 L138 54 L141 53 Z" fill="#38bdf8" opacity="0.7"/>

  <!-- Foreground Frame / Vignette Effect (Optional subtle clean bounds) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>