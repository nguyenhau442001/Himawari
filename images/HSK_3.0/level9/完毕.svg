  <!-- Checklist Item 2 (Done) -->
  <circle cx="80" cy="106" r="9" fill="#10B981"/>
  <path d="M76 106 L79 109 L85 103" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="103" width="54" height="6" rx="3" fill="#94A3B8"/>

  <!-- Checklist Item 3 (Done) -->
  <circle cx="80" cy="134" r="9" fill="#10B981"/>
  <path d="M76 134 L79 137 L85 131" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
