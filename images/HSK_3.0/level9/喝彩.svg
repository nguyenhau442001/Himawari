<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stage Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Curtain Gradient -->
    <linearGradient id="curtain-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="curtain-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Character 1 (Performer) Gradient -->
    <linearGradient id="performer-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sparkle shape -->
    <g id="sparkle">
      <path d="M0,-6 C1,-2 2,-1 6,0 C2,1 1,2 0,6 C-1,2 -2,1 -6,0 C-2,-1 -1,-2 0,-6 Z" fill="#fbbf24"/>
    </g>
    
    <g id="confetti-circle">
      <circle cx="0" cy="0" r="2.5" fill="#38bdf8"/>
    </g>
    <g id="confetti-square">
      <rect x="-2" y="-2" width="4" height="4" fill="#ec4899" transform="rotate(25)"/>
    </g>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Stage Lighting / Spotlight Cone -->
  <polygon points="120,0 20,240 220,240" fill="url(#spotlight)"/>

  <!-- Background Stage Elements / Instruments -->
  <!-- Piano / Keyboard silhouette -->
  <rect x="95" y="70" width="50" height="25" rx="3" fill="#334155"/>
  <rect x="100" y="95" width="40" height="35" fill="#1e293b"/>
  <!-- Music Stand -->
  <path d="M115,65 L125,65 L122,80 L118,80 Z" fill="#64748b"/>
  <line x1="120" y1="80" x2="120" y2="105" stroke="#64748b" stroke-width="2"/>

  <!-- PERFORMER ON STAGE -->
  <g transform="translate(120, 95)">
    <!-- Shadow -->
    <ellipse cx="0" cy="40" rx="18" ry="5" fill="#020617" opacity="0.6"/>
    
    <!-- Performer Legs -->
    <rect x="-6" y="20" width="5" height="20" rx="2.5" fill="#1e293b"/>
    <rect x="2" y="20" width="5" height="20" rx="2.5" fill="#1e293b"/>
    <ellipse cx="-3.5" cy="40" rx="4" ry="2" fill="#0f172a"/>
    <ellipse cx="4.5" cy="40" rx="4" ry="2" fill="#0f172a"/>

    <!-- Performer Torso & Suit -->
    <path d="M-10,-5 L10,-5 L12,22 L-12,22 Z" fill="url(#performer-suit)"/>
    <!-- Bow tie -->
    <circle cx="0" cy="-3" r="2.5" fill="#ffffff"/>
    <polygon points="0,-3 -5,-6 -5,0" fill="#ffffff"/>
    <polygon points="0,-3 5,-6 5,0" fill="#ffffff"/>

    <!-- Performer Arms (Bowing / Gesturing) -->
    <path d="M-10,-2 C-18,5 -15,15 -12,18" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M10,-2 C18,5 15,15 12,18" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

    <!-- Performer Head & Hair -->
    <circle cx="0" cy="-16" r="8" fill="#fde68a"/>
    <path d="M-8,-18 C-8,-23 8,-23 8,-18 C6,-25 -6,-25 -8,-18 Z" fill="#451a03"/>
    <!-- Happy Face (Smiling eyes closed) -->
    <path d="M-3,-16 Q-2,-18 -1,-16" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1,-16 Q2,-18 3,-16" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-2,-13 Q0,-10 2,-13" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- AUDIENCE FOREGROUND (Bottom Row / Balcony Railing / Silhouette cheering) -->
  <!-- Balcony / Seating ledge -->
  <path d="M0,190 L240,190 L240,240 L0,240 Z" fill="#090d16"/>
  <rect x="0" y="185" width="240" height="7" rx="3" fill="#334155"/>
  <rect x="0" y="188" width="240" height="3" fill="#1e293b"/>

  <!-- AUDIENCE MEMBERS (Cheering, clapping, raising hands) -->
  
  <!-- Audience Member 1 (Left - Cheering with arms up) -->
  <g transform="translate(35, 195)">
    <!-- Head & Body -->
    <circle cx="0" cy="-20" r="9" fill="#fbcfe8"/>
    <path d="M-7,-25 C-7,-30 7,-30 7,-25 Z" fill="#831843"/> <!-- Hair -->
    <path d="M-10,-11 L10,-11 L12,25 L-12,25 Z" fill="#db2777"/>
    <!-- Raised Arms (Clapping / Hooray) -->
    <path d="M-10,-8 C-20,-18 -22,-30 -18,-35" fill="none" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <path d="M10,-8 C20,-18 22,-30 18,-35" fill="none" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <!-- Joyful Expression (Eyes closed lines, big smile) -->
    <path d="M-3,-22 Q-1.5,-24 0,-22" fill="none" stroke="#831843" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,-22 Q1.5,-24 3,-22" fill="none" stroke="#831843" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-3,-18 Q0,-14 3,-18" fill="none" stroke="#831843" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Audience Member 2 (Center-Left - Clapping hands near face) -->
  <g transform="translate(85, 205)">
    <circle cx="0" cy="-22" r="8" fill="#fed7aa"/>
    <path d="M-8,-26 C-5,-30 5,-30 8,-26 C5,-27 -5,-27 -8,-26 Z" fill="#78350f"/>
    <path d="M-9,-14 L9,-14 L11,20 L-11,20 Z" fill="#d97706"/>
    <!-- Clapping Hands in front -->
    <path d="M-6,-15 C-2,-22 2,-22 6,-15" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-18" r="3" fill="#fef3c7"/>
  </g>

  <!-- Audience Member 3 (Center-Right - Cheering energetically) -->
  <g transform="translate(155, 198)">
    <circle cx="0" cy="-22" r="9" fill="#c7d2fe"/>
    <path d="M-9,-25 C0,-32 9,-25 9,-25 Z" fill="#312e81"/>
    <path d="M-10,-13 L10,-13 L13,25 L-13,25 Z" fill="#4f46e5"/>
    <!-- One arm high, one arm waving -->
    <path d="M-10,-10 C-18,-20 -25,-22 -22,-28" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>
    <path d="M10,-10 C20,-20 22,-30 18,-36" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>
    <!-- Face -->
    <path d="M-3,-24 Q0,-21 3,-24" fill="none" stroke="#312e81" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Audience Member 4 (Right edge - Half visible, enthusiastic) -->
  <g transform="translate(205, 202)">
    <circle cx="0" cy="-20" r="8" fill="#a7f3d0"/>
    <path d="M-8,-24 L8,-24 L6,-18 L-6,-18 Z" fill="#065f46"/>
    <path d="M-8,-12 L8,-12 L10,20 L-10,20 Z" fill="#059669"/>
    <!-- Raised arm -->
    <path d="M8,-10 C18,-18 20,-28 15,-32" fill="none" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- STAGE CURTAINS (Left & Right framing) -->
  <path d="M0,0 L50,0 C30,60 40,140 0,190 Z" fill="url(#curtain-l)"/>
  <path d="M240,0 L190,0 C210,60 200,140 240,190 Z" fill="url(#curtain-r)"/>
  
  <!-- Curtain folds / highlights -->
  <path d="M15,0 C5,50 15,120 0,160" fill="none" stroke="#fb7185" stroke-width="4" opacity="0.5"/>
  <path d="M225,0 C235,50 225,120 240,160" fill="none" stroke="#fb7185" stroke-width="4" opacity="0.5"/>

  <!-- CELEBRATORY SPARKS & CONFETTI (Flying around audience and stage) -->
  <use href="#sparkle" x="50" y="140" transform="scale(1.2)"/>
  <use href="#sparkle" x="180" y="130" transform="scale(1.5)"/>
  <use href="#sparkle" x="110" y="115" transform="scale(0.8)"/>
  <use href="#sparkle" x="70" y="170" transform="scale(1)"/>
  <use href="#sparkle" x="160" y="165" transform="scale(1.3)"/>

  <use href="#confetti-circle" x="40" y="120"/>
  <use href="#confetti-square" x="65" y="105"/>
  <use href="#confetti-circle" x="190" y="110"/>
  <use href="#confetti-square" x="170" y="145"/>
  <use href="#confetti-circle" x="130" y="135"/>
  <use href="#confetti-square" x="90" y="150"/>
  <use href="#confetti-circle" x="105" y="85"/>

  <!-- Musical notes floating up subtly to indicate 'performance' -->
  <g fill="#38bdf8" opacity="0.8" transform="translate(135, 75)">
    <ellipse cx="0" cy="6" rx="2" ry="1.5"/>
    <path d="M1.5,6 L1.5,-2 L6,-4 L6,2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <g fill="#ec4899" opacity="0.8" transform="translate(95, 80)">
    <ellipse cx="0" cy="5" rx="1.8" ry="1.3"/>
    <path d="M1.5,5 L1.5,-1 L5,-3" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  </g>
</svg>