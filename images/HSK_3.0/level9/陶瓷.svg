<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/pedestal -->
  <ellipse cx="120" cy="180" rx="50" ry="10" fill="#252A34"/>
  <path d="M90 180 C90 176, 150 176, 150 180 Z" fill="#FFB703" opacity="0.2"/>

  <!-- Ceramic Vase / Porcelain (陶瓷) -->
  <g transform="translate(0, -5)">
    <!-- Base/Foot -->
    <path d="M102 175 L138 175 L135 182 L105 182 Z" fill="#A0AAB8"/>

    <!-- Main Body -->
    <path d="M105 182 C80 160, 75 110, 95 85 C102 77, 108 72, 110 65 L130 65 C132 72, 138 77, 145 85 C165 110, 160 160, 135 182 Z" fill="#E9ECEF"/>

    <!-- Neck & Rim -->
    <path d="M110 65 L130 65 L133 55 C133 52, 128 50, 120 50 C112 50, 107 52, 107 55 Z" fill="#CED4DA"/>
    <ellipse cx="120" cy="55" rx="13" ry="4" fill="#DEE2E6"/>
    <ellipse cx="120" cy="55" rx="10" ry="2.5" fill="#495057"/>

    <!-- Classic Blue & White Porcelain Pattern (Ming style abstract motifs) -->
    <!-- Neck band -->
    <path d="M110 68 Q120 72 130 68" stroke="#1D3557" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Upper shoulder wave/petal pattern -->
    <path d="M98 88 Q105 95 112 88 Q120 95 128 88 Q135 95 142 88" stroke="#1D3557" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Center main decorative medallion (Stylized lotus/floral) -->
    <circle cx="120" cy="125" r="18" fill="none" stroke="#1D3557" stroke-width="3"/>
    <circle cx="120" cy="125" r="6" fill="#1D3557"/>
    <path d="M120 101 C115 110, 115 115, 120 120 C125 115, 125 110, 120 101 Z" fill="#1D3557"/>
    <path d="M120 149 C115 140, 115 135, 120 130 C125 135, 125 140, 120 149 Z" fill="#1D3557"/>
    <path d="M96 125 C105 120, 110 120, 115 125 C110 130, 105 130, 96 125 Z" fill="#1D3557"/>
    <path d="M144 125 C135 120, 130 120, 125 125 C130 130, 135 130, 144 125 Z" fill="#1D3557"/>

    <!-- Lower base cloud/mountain pattern -->
    <path d="M100 160 Q107 152 114 160 Q120 152 126 160 Q133 152 140 160" stroke="#1D3557" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Porcelain Gloss / Highlight (Sleek modern vector touch) -->
    <path d="M96 95 C90 115, 94 140, 102 165" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M103 72 C101 78, 101 82, 103 86" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Accent Focus Element (Gold craft spark / highlight) -->
  <path d="M165 75 L168 85 L178 88 L168 91 L165 101 L162 91 L152 88 L162 85 Z" fill="#FFB703"/>
  <path d="M75 135 L77 140 L82 142 L77 144 L75 149 L73 144 L68 142 L73 140 Z" fill="#FFB703" opacity="0.7"/>
</svg>