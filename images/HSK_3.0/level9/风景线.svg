<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing atmospheric path/scenic ribbon (representing the "line" in 风景线) -->
  <path d="M30 160 Q 90 120, 150 140 T 220 110" fill="none" stroke="#253245" stroke-width="16" stroke-linecap="round"/>
  <path d="M30 160 Q 90 120, 150 140 T 220 110" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- City background silhouettes -->
  <path d="M20 190 L20 130 L40 130 L40 190 Z" fill="#242B38"/>
  <path d="M45 190 L45 110 L70 110 L70 190 Z" fill="#242B38"/>
  <path d="M170 190 L170 120 L195 120 L195 190 Z" fill="#242B38"/>
  <path d="M200 190 L200 100 L225 100 L225 190 Z" fill="#242B38"/>

  <!-- Green park elements (trees/foliage) -->
  <circle cx="95" cy="155" r="14" fill="#0D9488" opacity="0.6"/>
  <circle cx="130" cy="150" r="18" fill="#14B8A6" opacity="0.7"/>
  <rect x="93" y="165" width="4" height="25" fill="#334155"/>
  <rect x="128" y="162" width="4" height="28" fill="#334155"/>

  <!-- Ground Line -->
  <line x1="20" y1="190" x2="220" y2="190" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Vibrant Cyclist 1 (Representing the vivid characteristic scenery / 人物与活力) -->
  <g transform="translate(110, 110)">
    <!-- Bicycle Wheels -->
    <circle cx="-15" cy="50" r="14" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="25" cy="50" r="14" fill="none" stroke="#94A3B8" stroke-width="3"/>
    
    <!-- Bike frame -->
    <path d="M-15 50 L5 30 L25 50 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M5 30 L-2 15 L-12 25" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 30 L18 20" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Cyclist Body -->
    <!-- Torso (leaning forward) -->
    <path d="M-2 22 L10 32" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
    <!-- Head with Helmet -->
    <circle cx="14" cy="16" r="6" fill="#F43F5E"/>
    <!-- Arms -->
    <path d="M8 26 L20 22" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs in motion -->
    <path d="M-2 22 L2 42 L-15 50" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-2 22 L12 40 L25 50" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Vibrant Cyclist 2 (Following closely to form the "scenic line") -->
  <g transform="translate(60, 120)">
    <!-- Bicycle Wheels -->
    <circle cx="-15" cy="50" r="14" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="25" cy="50" r="14" fill="none" stroke="#94A3B8" stroke-width="3"/>
    
    <!-- Bike frame -->
    <path d="M-15 50 L5 30 L25 50 Z" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M5 30 L-2 15 L-12 25" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 30 L18 20" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

    <!-- Cyclist Body -->
    <path d="M-2 22 L10 32" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="14" cy="16" r="6" fill="#10B981"/>
    <path d="M8 26 L20 22" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M-2 22 L2 42 L-15 50" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-2 22 L12 40 L25 50" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accent visual sparks / Vitality markers -->
  <circle cx="170" cy="85" r="3" fill="#F59E0B"/>
  <path d="M170 77 L170 93 M162 85 L178 85" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <circle cx="70" cy="75" r="2" fill="#38BDF8"/>
  <path d="M70 69 L70 81 M64 75 L76 75" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>