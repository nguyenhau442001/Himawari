<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="smokeGlow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Sky & Background Atmosphere -->
    <rect width="240" height="240" fill="url(#skyGrad)" />
    
    <!-- Distant Smoke and Destruction Glow -->
    <circle cx="150" cy="140" r="80" fill="url(#smokeGlow)" />

    <!-- Distant Ruined Skyline -->
    <path d="M10 200 L10 160 L25 160 L25 180 L40 180 L40 140 L55 140 L55 190 L75 190 L75 120 L90 120 L90 200 Z" fill="#1e293b" opacity="0.7" />
    <path d="M140 200 L140 110 L160 110 L160 170 L180 170 L180 130 L200 130 L200 200 Z" fill="#0f172a" opacity="0.9" />

    <!-- Foreground Ruined City Architecture (The Target of Destruction) -->
    <!-- Destroyed Building Left -->
    <path d="M0 200 L0 100 L18 100 L22 130 L35 90 L45 90 L45 200 Z" fill="#334155" />
    <!-- Jagged top showing destruction -->
    <path d="M18 100 L25 115 L32 100 L38 110 L45 90" fill="none" stroke="#1e293b" stroke-width="4" />
    <!-- Broken Windows / Debris -->
    <rect x="8" y="120" width="8" height="12" fill="#0f172a" rx="1" />
    <rect x="8" y="145" width="8" height="12" fill="#0f172a" rx="1" />
    
    <!-- Major Ruined Architecture Center/Right -->
    <path d="M60 200 L60 70 L95 70 L98 90 L110 65 L130 65 L135 200 Z" fill="#475569" />
    <!-- Collapsed roof / skeleton structure -->
    <path d="M95 70 L102 50 L115 55 L130 65" fill="#334155" />
    <line x1="75" y1="70" x2="70" y2="200" stroke="#1e293b" stroke-width="2" opacity="0.5" />
    <line x1="88" y1="70" x2="90" y2="200" stroke="#1e293b" stroke-width="2" opacity="0.5" />
    
    <!-- Broken Windows & Arches -->
    <path d="M68 90 C68 85 78 85 78 90 L78 115 L68 115 Z" fill="#0f172a" />
    <path d="M112 90 C112 85 122 85 122 90 L122 120 L112 120 Z" fill="#0f172a" />
    <rect x="70" y="135" width="16" height="20" fill="#0f172a" />
    <rect x="105" y="140" width="18" height="25" fill="#0f172a" />

    <!-- Debris and Rubble on the Ground -->
    <path d="M0 200 L240 200 L240 215 L0 215 Z" fill="#1e293b" />
    <polygon points="20,200 35,188 50,200" fill="#475569" />
    <polygon points="120,200 145,185 160,200" fill="#334155" />
    <polygon points="190,200 210,190 230,200" fill="#475569" />
    <rect x="80" y="195" width="25" height="10" fill="#64748b" rx="2" />
    <circle cx="135" cy="198" r="4" fill="#94a3b8" />
    <circle cx="45" cy="196" r="3" fill="#64748b" />

    <!-- Smoke & Dust Particles (Atmospheric devastation) -->
    <path d="M40 130 C45 110 70 110 75 130 C80 120 100 120 105 135" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <path d="M120 100 C130 80 160 85 165 110 C180 100 200 115 195 130" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.3" />
    <circle cx="160" cy="100" r="12" fill="#cbd5e1" opacity="0.15" />
    <circle cx="180" cy="90" r="18" fill="#cbd5e1" opacity="0.1" />

    <!-- Fire / Ember Accents (Active destruction element) -->
    <path d="M115 130 L118 120 L122 135 Z" fill="#f59e0b" />
    <path d="M72 155 L75 145 L79 158 Z" fill="#ef4444" />
    <circle cx="119" cy="118" r="2" fill="#fbbf24" />
    <circle cx="76" cy="143" r="1.5" fill="#fbbf24" />

    <!-- Expressive Character in Foreground (Experiencing the impact of devastation) -->
    <g transform="translate(160, 130)">
      <!-- Character Shadow -->
      <ellipse cx="15" cy="73" rx="18" ry="4" fill="#0f172a" opacity="0.6" />

      <!-- Body / Coat (Muted, dusty colors) -->
      <path d="M5 45 C5 35 15 30 25 35 L32 70 L2 70 Z" fill="#475569" />
      
      <!-- Head and Posture (Slumped, protective, emotional) -->
      <!-- Arms hugging knees / crouching down -->
      <path d="M10 55 C5 55 2 60 5 68 L25 68 C28 65 25 58 20 55 Z" fill="#64748b" />
      
      <!-- Head bowed down -->
      <circle cx="18" cy="24" r="9" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M10 22 C10 16 22 15 25 22 C24 19 12 19 10 22 Z" fill="#334155" />
      
      <!-- Concerned expression / Hands holding head -->
      <path d="M14 28 C14 26 22 26 22 28" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Floating Ember / Dust Particles for Depth -->
    <circle cx="95" cy="150" r="2" fill="#fb923c" opacity="0.8" />
    <circle cx="130" cy="125" r="1.5" fill="#f59e0b" opacity="0.9" />
    <circle cx="60" cy="170" r="1" fill="#fbbf24" opacity="0.7" />
    <circle cx="185" cy="155" r="2" fill="#ef4444" opacity="0.6" />

    <!-- Dramatic Vignette Lighting -->
    <rect width="240" height="240" fill="none" stroke="#0f172a" stroke-width="8" rx="24" opacity="0.5" />
  </g>
</svg>