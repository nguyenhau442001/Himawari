<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Ice/Frost Gradient -->
    <linearGradient id="iceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- UI Warning Alert Glow -->
    <radialGradient id="alertGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient lighting/glows -->
  <circle cx="120" cy="110" r="80" fill="url(#alertGlow)"/>

  <!-- ENVIRONMENT: Cozy Room Interior -->
  <!-- Bookshelf / Wall background details -->
  <rect x="25" y="45" width="40" height="75" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="33" y="60" width="24" height="6" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="33" y="80" width="24" height="6" rx="2" fill="#475569" opacity="0.6"/>

  <!-- Desk Surface -->
  <path d="M 20 180 L 220 180 L 205 210 L 35 210 Z" fill="#090d16"/>
  <rect x="20" y="175" width="200" height="6" rx="3" fill="#334155"/>

  <!-- Office Chair Backrest -->
  <path d="M 175 110 C 170 90 195 90 190 110 L 195 170 C 195 175 170 175 175 170 Z" fill="#334155"/>

  <!-- MAIN PROP: Laptop & Glowing Screen -->
  <!-- Laptop Base -->
  <path d="M 75 175 L 165 175 L 180 185 L 60 185 Z" fill="#64748b"/>
  <rect x="105" y="178" width="30" height="4" rx="2" fill="#475569"/>

  <!-- Laptop Screen Outer Frame -->
  <rect x="75" y="95" width="90" height="82" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  
  <!-- Laptop Screen Display -->
  <rect x="80" y="100" width="80" height="72" rx="4" fill="url(#screenGlow)"/>

  <!-- UI Elements on Screen (Abstract warning graphs, no text) -->
  <circle cx="120" cy="125" r="16" fill="#f43f5e" opacity="0.2"/>
  <!-- Warning Lock / Shield Icon on Screen -->
  <path d="M 115 118 L 125 118 L 125 132 L 115 132 Z" fill="#f43f5e"/>
  <path d="M 113 118 C 113 113 127 113 127 118" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- UI Data Bars -->
  <rect x="90" y="145" width="25" height="4" rx="2" fill="#f43f5e" opacity="0.7"/>
  <rect x="120" y="145" width="30" height="4" rx="2" fill="#475569" opacity="0.5"/>

  <!-- FROST / ICE OVERLAY (Visualizing "冻结" - Freezing) -->
  <!-- Icicles hanging from top of screen -->
  <path d="M 80 100 L 86 115 L 90 100 L 98 122 L 104 100 L 115 118 L 122 100 L 132 125 L 140 100 L 148 112 L 155 100 L 160 110 L 160 100 Z" fill="url(#iceGrad)"/>
  <!-- Frost crystals on screen corners -->
  <path d="M 80 160 L 95 172 L 80 172 Z" fill="#bae6fd" opacity="0.6"/>
  <path d="M 160 160 L 145 172 L 160 172 Z" fill="#bae6fd" opacity="0.6"/>
  <!-- Ice Crystal Sparks -->
  <path d="M 100 135 L 104 142 L 111 146 L 104 150 L 100 157 L 96 150 L 89 146 L 96 142 Z" fill="#e0f2fe" opacity="0.8"/>
  <path d="M 140 120 L 142 125 L 147 127 L 142 129 L 140 134 L 138 129 L 133 127 L 138 125 Z" fill="#e0f2fe" opacity="0.8"/>

  <!-- CHARACTER: Stunned/Shocked Man -->
  <!-- Body/Torso -->
  <path d="M 95 190 C 95 165 145 165 145 190 Z" fill="url(#shirtGrad)"/>
  <path d="M 105 165 L 120 180 L 135 165 Z" fill="#f8fafc"/> <!-- Collar -->

  <!-- Neck -->
  <rect x="110" y="150" width="20" height="20" fill="#fcd34d" rx="4"/>

  <!-- Head -->
  <circle cx="120" cy="130" r="22" fill="#fcd34d"/>

  <!-- Hair (Neat modern dark hair) -->
  <path d="M 98 125 C 98 110 110 106 120 106 C 132 106 142 110 142 125 C 142 128 140 122 138 118 C 132 112 108 112 102 118 C 100 122 98 125 98 125 Z" fill="#1e293b"/>

  <!-- Facial Expressions (Shock / Disbelief) -->
  <!-- Wide Eyes -->
  <circle cx="111" cy="128" r="4" fill="#ffffff"/>
  <circle cx="129" cy="128" r="4" fill="#ffffff"/>
  <circle cx="112" cy="128" r="1.5" fill="#0f172a"/>
  <circle cx="128" cy="128" r="1.5" fill="#0f172a"/>

  <!-- Surprised Eyebrows (Arched high) -->
  <path d="M 106 120 C 109 117 115 117 117 119" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 123 119 C 125 117 131 117 134 120" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Open O-shaped Mouth of Shock -->
  <ellipse cx="120" cy="138" rx="4" ry="6" fill="#0f172a"/>

  <!-- Hands in shock near face / touching cheeks -->
  <!-- Left Hand -->
  <circle cx="98" cy="142" r="7" fill="#fcd34d"/>
  <!-- Right Hand -->
  <circle cx="142" cy="142" r="7" fill="#fcd34d"/>

  <!-- Additional Foreground Desk Items -->
  <!-- Coffee Mug with subtle steam -->
  <rect x="52" y="160" width="14" height="18" rx="3" fill="#38bdf8"/>
  <path d="M 49 164 C 45 164 45 172 49 174" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M 56 153 C 58 150 56 147 59 144" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Decorative lighting accent on top right -->
  <circle cx="210" cy="40" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="30" cy="130" r="1.5" fill="#ffffff" opacity="0.2"/>
</svg>