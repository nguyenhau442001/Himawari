<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="campfireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spearWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="furTone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#nightSky)"/>

  <!-- Stars / Night atmosphere -->
  <g fill="#cbd5e1" opacity="0.6">
    <circle cx="35" cy="40" r="1"/>
    <circle cx="85" cy="25" r="1.5"/>
    <circle cx="160" cy="35" r="1"/>
    <circle cx="210" cy="50" r="1.2"/>
    <circle cx="50" cy="85" r="0.8"/>
    <circle cx="195" cy="95" r="1"/>
  </g>

  <!-- Distant Mountains / Horizon -->
  <path d="M0 160 L40 125 L90 150 L140 110 L190 145 L240 120 L240 240 L0 240 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M0 175 L60 140 L110 165 L170 135 L240 160 L240 240 L0 240 Z" fill="#172554"/>

  <!-- Ancient Forest Trees (Silhouettes) -->
  <g fill="#0b1329">
    <!-- Left Trees -->
    <polygon points="10,180 25,120 40,180" />
    <polygon points="25,190 42,110 60,190" />
    <polygon points="50,185 65,130 80,185" />
    <!-- Right Trees -->
    <polygon points="175,175 195,105 215,175" />
    <polygon points="200,180 220,120 240,180" />
    <polygon points="160,190 172,140 185,190" />
  </g>

  <!-- Campfire Scene (Ground context for living/survival) -->
  <circle cx="170" cy="180" r="45" fill="url(#campfireGlow)"/>
  <!-- Logs -->
  <rect x="150" y="185" width="40" height="8" rx="4" fill="#78350f" transform="rotate(-10 170 189)"/>
  <rect x="145" y="190" width="35" height="7" rx="3.5" fill="#451a03" transform="rotate(25 162 193)"/>
  <!-- Flames -->
  <path d="M170 165 Q162 180 166 190 Q174 190 170 165 Z" fill="#f59e0b"/>
  <path d="M168 172 Q164 182 170 188 Q176 182 168 172 Z" fill="#ef4444"/>
  <path d="M171 160 Q167 172 173 182 Q179 172 171 160 Z" fill="#fde047"/>

  <!-- Roasted meat on stick over fire -->
  <line x1="145" y1="155" x2="195" y2="165" stroke="url(#spearWood)" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="170" cy="160" rx="8" ry="5" fill="#b45309"/>

  <!-- Cave Entrance / Rocks (Ancient Setting) -->
  <path d="M0 240 L0 190 Q20 185 35 195 Q55 210 70 240 Z" fill="#334155"/>
  <path d="M0 240 L0 210 Q10 205 20 240 Z" fill="#1e293b"/>

  <!-- MAIN CHARACTER: Ancient Hunter tracking/holding spear -->
  <g transform="translate(75, 110)">
    <!-- Back leg (crouched) -->
    <path d="M25 60 L15 80 L30 85" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Animal skin tunic (Primitive clothing) -->
    <path d="M15 30 Q35 25 45 40 L50 75 Q35 80 20 75 Z" fill="url(#furTone)"/>
    <!-- Tunic belt/cord -->
    <path d="M18 50 Q30 55 42 48" fill="none" stroke="#b45309" stroke-width="3"/>

    <!-- Front leg -->
    <path d="M35 65 L40 82 L55 82" fill="none" stroke="#92400e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Body torso -->
    <path d="M20 30 Q35 20 42 45 Z" fill="#b45309"/>

    <!-- Head & Hair -->
    <circle cx="38" cy="16" r="10" fill="#fde047"/> <!-- warm skin tone -->
    <!-- Wild hair / top knot -->
    <path d="M28 14 Q32 2 42 8 Q48 14 42 18 Z" fill="#451a03"/>
    <!-- Focused face profile / eye -->
    <circle cx="43" cy="15" r="1.5" fill="#1e293b"/>
    <path d="M41 12 Q44 11 46 13" fill="none" stroke="#451a03" stroke-width="1.5"/> <!-- eyebrow -->

    <!-- Front Arm holding spear -->
    <path d="M38 35 L60 45 L75 42" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wooden Spear with stone blade -->
    <line x1="5" y1="52" x2="115" y2="35" stroke="url(#spearWood)" stroke-width="3" stroke-linecap="round"/>
    <!-- Spearhead (flint stone) -->
    <polygon points="115,35 125,32 117,39" fill="#94a3b8"/>
  </g>

  <!-- TARGET PREY: Wild Deer / Boar in distance (The focus of the hunt) -->
  <g transform="translate(130, 125)">
    <!-- Sleek wild deer silhouette -->
    <!-- Legs -->
    <line x1="15" y1="35" x2="12" y2="55" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="35" x2="25" y2="55" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="35" x2="35" y2="53" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="43" y1="35" x2="48" y2="53" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Body -->
    <ellipse cx="30" cy="30" rx="16" ry="10" fill="#9a3412"/>
    <!-- Neck & Head -->
    <path d="M40 28 Q48 20 48 14 L52 16 Q50 25 42 32 Z" fill="#9a3412"/>
    <circle cx="50" cy="13" r="4" fill="#9a3412"/>
    <!-- Antlers -->
    <path d="M48 10 Q53 2 58 5 M50 9 Q56 6 54 1" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Alert Eye -->
    <circle cx="51" cy="12" r="0.8" fill="#fde047"/>
  </g>

  <!-- Atmospheric Foliage in foreground (Depth framing) -->
  <path d="M0 240 Q15 200 45 220 Q70 240 70 240 Z" fill="#090d16"/>
  <path d="M240 240 Q225 210 195 225 Q170 240 170 240 Z" fill="#090d16"/>
  
  <!-- Detailed grass blades -->
  <path d="M35 240 Q40 215 45 240 M42 240 Q48 220 55 240 M20 240 Q28 222 32 240" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M205 240 Q212 218 218 240 M215 240 Q222 222 230 240" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
</svg>