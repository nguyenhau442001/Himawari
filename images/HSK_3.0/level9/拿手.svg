    <path d="M50 85 Q60 92 70 85" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Floating Ingredients/Props -->
  <circle cx="180" cy="100" r="10" fill="#ec4899"/>
  <circle cx="195" cy="120" r="8" fill="#10b981"/>
  <path d="M170 140 L190 140 L185 155 L175 155 Z" fill="#fbbf24"/>
  
  <!-- Steam/Action -->
  <path d="M120 130 Q110 110 120 90" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M125 125 Q135 105 125 85" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
</svg>