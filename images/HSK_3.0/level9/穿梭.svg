<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Motion blur gradients -->
    <linearGradient id="motionTrail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="headlightBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Traffic Elements (Static cars blurred/simplified to show movement context) -->
  <!-- Car left (stopped/slow) -->
  <rect x="25" y="70" width="40" height="20" rx="6" fill="#2D323F"/>
  <circle cx="35" cy="90" r="4" fill="#1A1D24"/>
  <circle cx="55" cy="90" r="4" fill="#1A1D24"/>
  
  <!-- Car right (stopped/slow) -->
  <rect x="175" y="140" width="45" height="22" rx="6" fill="#2D323F"/>
  <circle cx="187" cy="162" r="4" fill="#1A1D24"/>
  <circle cx="207" cy="162" r="4" fill="#1A1D24"/>
  
  <!-- Road Divider / Flow Lines -->
  <path d="M 30 130 L 210 130" stroke="#2D323F" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M 20 180 L 220 100" stroke="#2D323F" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>

  <!-- Motion Trails showing 'weaving' (穿梭) action -->
  <path d="M 60 185 Q 120 140 180 65" fill="none" stroke="url(#motionTrail)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 75 195 Q 135 150 195 75" fill="none" stroke="#FF9F43" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.5"/>

  <!-- Main Character on Electric Scooter (Dynamic pose weaving through) -->
  <g transform="translate(10, 10)">
    <!-- Speed Lines behind scooter -->
    <line x1="45" y1="150" x2="30" y2="160" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="135" x2="20" y2="145" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>

    <!-- Scooter Body -->
    <!-- Back wheel -->
    <circle cx="65" cy="155" r="11" fill="#111317"/>
    <circle cx="65" cy="155" r="5" fill="#4A5265"/>
    
    <!-- Front wheel -->
    <circle cx="130" cy="125" r="11" fill="#111317"/>
    <circle cx="130" cy="125" r="5" fill="#4A5265"/>
    
    <!-- Scooter frame & deck -->
    <path d="M 65 155 L 95 145 L 130 125" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Handlebar column -->
    <path d="M 115 135 L 125 90" stroke="#8A95A5" stroke-width="4" stroke-linecap="round"/>
    <!-- Handlebars -->
    <path d="M 118 90 L 132 86" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <!-- Delivery Box (Backpack/Box on scooter) -->
    <rect x="45" y="115" width="28" height="28" rx="4" fill="#FF5252"/>
    <path d="M 45 125 L 73 125" stroke="#B32424" stroke-width="2"/>

    <!-- Rider Character (Leaning dynamically into the turn) -->
    <!-- Torso (Leaning forward) -->
    <path d="M 70 130 Q 90 110 105 100" fill="none" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Delivery Jacket (Orange/Yellow accent) -->
    <path d="M 72 128 Q 92 108 108 98" fill="none" stroke="#FFB800" stroke-width="12" stroke-linecap="round"/>

    <!-- Helmet -->
    <circle cx="112" cy="84" r="9" fill="#FFB800"/>
    <!-- Visor -->
    <path d="M 114 80 Q 120 83 116 87" fill="#1A1D24"/>

    <!-- Arms reaching for handlebars -->
    <path d="M 98 102 L 124 90" stroke="#FFB800" stroke-width="6" stroke-linecap="round"/>

    <!-- Legs in motion/riding posture -->
    <path d="M 75 130 L 95 145" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Foreground Traffic Elements (giving depth of field) -->
  <!-- Car front-left (blurry, very close) -->
  <path d="M -10 220 Q 30 200 80 210" fill="none" stroke="#2D323F" stroke-width="25" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Additional dynamic wind/motion accents to emphasize high agility/weaving -->
  <path d="M 150 45 Q 170 35 190 40" fill="none" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 165 30 Q 180 22 195 26" fill="none" stroke="#FF9F43" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>