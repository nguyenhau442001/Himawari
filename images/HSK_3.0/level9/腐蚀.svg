<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lab Table Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Acid Liquid Gradient -->
    <linearGradient id="acid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.95" />
    </linearGradient>

    <!-- Metal Gear Gradient (Damaged) -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Laboratory Background Details -->
  <!-- Back Wall Shelf & Apparatus -->
  <rect x="30" y="45" width="180" height="4" rx="2" fill="#334155" />
  <!-- Flask 1 -->
  <path d="M50 45 L50 25 L58 25 L58 45 Z" fill="#475569" />
  <circle cx="54" cy="22" r="5" fill="#475569" />
  <path d="M47 33 L61 33 L58 45 L50 45 Z" fill="#38bdf8" opacity="0.6" />
  <!-- Flask 2 -->
  <path d="M85 45 L87 30 L93 30 L95 45 Z" fill="#475569" />
  <ellipse cx="90" cy="38" rx="8" ry="7" fill="#f43f5e" opacity="0.7" />

  <!-- Pegboard Wall Pattern -->
  <g fill="#334155" opacity="0.3">
    <circle cx="40" cy="70" r="1.5" />
    <circle cx="60" cy="70" r="1.5" />
    <circle cx="80" cy="70" r="1.5" />
    <circle cx="100" cy="70" r="1.5" />
    <circle cx="120" cy="70" r="1.5" />
    <circle cx="140" cy="70" r="1.5" />
    <circle cx="160" cy="70" r="1.5" />
    <circle cx="180" cy="70" r="1.5" />
    <circle cx="200" cy="70" r="1.5" />
    
    <circle cx="40" cy="95" r="1.5" />
    <circle cx="60" cy="95" r="1.5" />
    <circle cx="80" cy="95" r="1.5" />
    <circle cx="100" cy="95" r="1.5" />
    <circle cx="120" cy="95" r="1.5" />
    <circle cx="140" cy="95" r="1.5" />
    <circle cx="160" cy="95" r="1.5" />
    <circle cx="180" cy="95" r="1.5" />
    <circle cx="200" cy="95" r="1.5" />
  </g>

  <!-- Laboratory Workbench -->
  <rect x="15" y="180" width="210" height="35" rx="4" fill="url(#table-grad)" />
  <rect x="15" y="175" width="210" height="8" rx="2" fill="#475569" />
  <rect x="25" y="215" width="12" height="15" fill="#1e293b" />
  <rect x="203" y="215" width="12" height="15" fill="#1e293b" />

  <!-- SCENE: METAL CORROSION EXPERIMENT -->
  <!-- Glass Beaker holding the acid and metal -->
  <g transform="translate(100, 105)">
    <!-- Beaker Glass Body (Back) -->
    <path d="M 0 10 L 10 70 C 10 73, 13 75, 16 75 L 44 75 C 47 75, 50 73, 50 70 L 60 10 Z" fill="#ffffff" fill-opacity="0.08" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Acid Liquid -->
    <path d="M 3 28 L 57 28 L 54 69 C 54 71, 52 72, 50 72 L 10 72 C 8 72, 6 71, 6 69 Z" fill="url(#acid-grad)" />

    <!-- Submerged Corroding Metal Gear / Plate -->
    <!-- Metal Base Shape with eaten/corroded edges -->
    <g transform="translate(18, 35)">
      <!-- Intact gear reference merged with irregular eaten holes -->
      <path d="M15 0 L21 5 L28 2 L33 8 L40 9 L41 16 L47 21 L43 28 L47 35 L40 39 L38 46 L30 44 L24 50 L17 46 L10 48 L7 41 L1 38 L4 31 L0 24 L5 17 L2 10 L9 7 Z" fill="url(#metal-grad)" />
      
      <!-- Corrosion Holes / Pit marks (Dark cavities showing acid damage) -->
      <circle cx="15" cy="15" r="4" fill="#0f172a" />
      <circle cx="28" cy="25" r="6" fill="#0f172a" />
      <circle cx="35" cy="12" r="3" fill="#0f172a" />
      <circle cx="20" cy="35" r="5" fill="#0f172a" />
      <path d="M10 22 C12 25, 8 28, 12 32" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
      
      <!-- Glowing chemical reaction sparkles / fizzing bubbles -->
      <circle cx="22" cy="20" r="2.5" fill="#fef08a" filter="url(#glow)" />
      <circle cx="32" cy="30" r="2" fill="#fef08a" filter="url(#glow)" />
      <circle cx="15" cy="28" r="1.5" fill="#38bdf8" />
    </g>

    <!-- Rising Bubbles from Corrosion -->
    <circle cx="25" cy="22" r="2" fill="#a7f3d0" opacity="0.8" />
    <circle cx="23" cy="15" r="3" fill="#a7f3d0" opacity="0.7" />
    <circle cx="40" cy="18" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="38" cy="10" r="2.5" fill="#a7f3d0" opacity="0.6" />

    <!-- Beaker Lip (Front) -->
    <ellipse cx="30" cy="10" rx="30" ry="4" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
    
    <!-- Measurement lines on beaker -->
    <line x1="13" y1="35" x2="18" y2="35" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7" />
    <line x1="11" y1="48" x2="18" y2="48" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7" />
    <line x1="10" y1="60" x2="18" y2="60" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Scientist Character (Observing closely with magnifying glass) -->
  <!-- Torso & Lab Coat -->
  <path d="M 165 180 C 165 140, 195 140, 195 180 Z" fill="#38bdf8" /> <!-- Inner shirt -->
  <path d="M 150 180 L 155 130 L 180 120 L 205 130 L 210 180 Z" fill="#f8fafc" /> <!-- Lab coat -->
  <path d="M 175 125 L 165 150 L 195 150 L 185 125 Z" fill="#e2e8f0" /> <!-- Lapels -->

  <!-- Head & Face Profile / 3/4 View -->
  <circle cx="180" cy="100" r="18" fill="#ffedd5" />
  <!-- Hair -->
  <path d="M 164 95 C 163 80, 185 78, 195 90 C 198 90, 198 105, 198 105 L 190 100 C 185 85, 168 90, 164 95 Z" fill="#b45309" />
  <!-- Eye with protective goggles -->
  <rect x="178" y="92" width="14" height="10" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="185" cy="97" r="3" fill="#38bdf8" />

  <!-- Arm holding Magnifying Glass towards the Beaker -->
  <!-- Upper arm / Shoulder -->
  <path d="M 160 135 C 145 135, 130 145, 125 155" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
  <!-- Forearm reaching forward -->
  <path d="M 125 155 L 140 145" fill="none" stroke="#ffedd5" stroke-width="9" stroke-linecap="round" />
  
  <!-- Magnifying Glass -->
  <g transform="translate(135, 125)">
    <!-- Handle -->
    <line x1="0" y1="0" x2="-20" y2="20" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
    <!-- Lens Rim -->
    <circle cx="12" cy="-12" r="16" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <!-- Lens Glass Reflection -->
    <circle cx="12" cy="-12" r="15" fill="#38bdf8" fill-opacity="0.25" />
    <path d="M 3 -18 Q 8 -22 15 -18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Additional Lab Props on Table -->
  <!-- Extra small reagent bottle -->
  <path d="M 45 180 L 45 160 C 45 158, 47 157, 49 157 L 55 157 C 57 157, 59 158, 59 160 L 59 180 Z" fill="#f59e0b" />
  <rect x="47" y="152" width="10" height="5" rx="1" fill="#cbd5e1" />
  <!-- Warning Hazard Symbol on Bottle (Stylized abstract lines, no text) -->
  <polygon points="52,165 49,172 55,172" fill="#fef08a" />

  <!-- Safety Warning Steam / Vapor Wisps -->
  <path d="M 115 90 Q 120 75, 110 65 T 118 45" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 125 95 Q 132 80, 122 70 T 130 50" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- Ambient Lighting / Highlights -->
  <circle cx="180" cy="40" r="60" fill="#38bdf8" filter="url(#glow)" opacity="0.08" />
</svg>