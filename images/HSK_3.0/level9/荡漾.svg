<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Clip path to keep artwork inside rounded container with padding -->
  <defs>
    <clipPath id="container-clip">
      <rect x="20" y="20" width="200" height="200" rx="16" />
    </clipPath>
    
    <!-- Gradient for lake water -->
    <linearGradient id="lakeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <!-- Gradient for ripples -->
    <linearGradient id="rippleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#container-clip)">
    <!-- Deep night/evening sky background -->
    <rect x="20" y="20" width="200" height="110" fill="#12151b"/>

    <!-- Glowing celestial moon / light source -->
    <circle cx="170" cy="55" r="16" fill="#ffd166" opacity="0.15"/>
    <circle cx="170" cy="55" r="10" fill="#ffd166" opacity="0.3"/>
    <circle cx="170" cy="55" r="5" fill="#ffd166"/>

    <!-- Distant stylized mountain silhouette -->
    <path d="M20 115 L65 85 L105 100 L160 75 L220 110 L220 130 L20 130 Z" fill="#18222d"/>

    <!-- Clear Lake Water Surface (Noun representation of 荡漾) -->
    <rect x="20" y="125" width="200" height="95" fill="url(#lakeGradient)"/>

    <!-- Sparkling light reflections on water (波光粼粼) -->
    <ellipse cx="75" cy="140" rx="12" ry="1.5" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="140" cy="135" rx="8" ry="1" fill="#ffffff" opacity="0.4"/>
    <ellipse cx="110" cy="155" rx="16" ry="2" fill="#ffd166" opacity="0.5"/>
    <ellipse cx="165" cy="150" rx="10" ry="1.5" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="60" cy="168" rx="7" ry="1" fill="#4facfe" opacity="0.7"/>
    <ellipse cx="130" cy="175" rx="14" ry="2" fill="#4facfe" opacity="0.6"/>
    <ellipse cx="185" cy="180" rx="9" ry="1.2" fill="#ffffff" opacity="0.4"/>

    <!-- Concentric ripples spreading out (dàngyàng / 碧波荡漾 - physical gentle waves) -->
    <!-- Ripple Group 1 (Left-Center) -->
    <path d="M 50 160 Q 70 152 90 160 Q 110 168 130 160" fill="none" stroke="#4facfe" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 35 175 Q 60 165 85 175 Q 110 185 145 175" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Ripple Group 2 (Right-Center Focus) -->
    <path d="M 110 145 Q 135 137 160 145 Q 185 153 210 145" fill="none" stroke="#4facfe" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 95 162 Q 130 152 165 162 Q 200 172 225 162" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 120 188 Q 150 178 180 188 Q 210 198 230 188" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Subtle framing border -->
    <rect x="20" y="20" width="200" height="200" rx="16" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08"/>
  </g>
</svg>