<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    {/* Bank Building (Background/Institution) */}
    <path d="M70 95 L120 65 L170 95 Z" fill="#3A4454"/>
    <rect x="75" y="95" width="90" height="55" fill="#2A323F" rx="2"/>
    
    {/* Bank Pillars */}
    <rect x="88" y="102" width="6" height="42" fill="#4B566A"/>
    <rect x="105" y="102" width="6" height="42" fill="#4B566A"/>
    <rect x="129" y="102" width="6" height="42" fill="#4B566A"/>
    <rect x="146" y="102" width="6" height="42" fill="#4B566A"/>

    {/* House (Collateral asset - representing real estate being pledged) */}
    <g transform="translate(48, 120)">
      <path d="M30 35 L55 15 L80 35 Z" fill="#E5A93B"/>
      <rect x="35" y="35" width="40" height="35" fill="#F0B94E"/>
      <rect x="50" y="47" width="10" height="23" fill="#2A323F"/>
      <rect x="40" y="40" width="8" height="8" fill="#2A323F"/>
      <rect x="62" y="40" width="8" height="8" fill="#2A323F"/>
    </g>

    {/* Legal Document / Contract (Collateral/Mortgage Agreement) */}
    <g transform="translate(115, 115)">
      <rect x="0" y="0" width="42" height="54" rx="3" fill="#E2E8F0"/>
      <rect x="6" y="10" width="30" height="3" rx="1.5" fill="#94A3B8"/>
      <rect x="6" y="18" width="22" height="3" rx="1.5" fill="#94A3B8"/>
      <rect x="6" y="26" width="26" height="3" rx="1.5" fill="#94A3B8"/>
      {/* Gold Seal/Stamp */}
      <circle cx="28" cy="40" r="7" fill="#E5A93B"/>
      <path d="M26 40 L28 42 L31 38" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    {/* Glowing Connection / Security Indicator (representing guarantee/pledge) */}
    <path d="M90 145 C90 168 150 168 150 145" fill="none" stroke="#E5A93B" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
    
    {/* Padlock Symbol representing security/collateral */}
    <circle cx="120" cy="165" r="10" fill="#E5A93B"/>
    <path d="M116 163 V160 C116 157 118 155 120 155 C122 155 124 157 124 160 V163" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="166" r="2" fill="#1A1D24"/>
  </g>
</svg>