<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Scientific Flask/Experiment motif representing "experiment failure -> restart" -->
    <!-- Broken/Failed state reference in background glow or subtle elements, focusing on restarting from scratch (the fresh flask) -->
    
    <!-- Restart Circular Arrow Path representing "从头再来" (start over) -->
    <path d="M 120 50 A 70 70 0 1 1 50 120" fill="none" stroke="#3A4252" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round"/>
    
    <!-- Bright/Active Restart Arrow Head and Arc (Orange/Gold accent) -->
    <path d="M 120 40 A 80 80 0 1 1 60 70" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="55,58 75,64 63,78" fill="#F59E0B"/>
    
    <!-- Central Icon: A pristine scientific flask filled with bright energetic fluid (representing a fresh start/experiment from scratch) -->
    <!-- Stand base -->
    <rect x="90" y="185" width="60" height="8" rx="4" fill="#4B5563"/>
    <rect x="116" y="145" width="8" height="42" fill="#4B5563"/>
    
    <!-- Flask Shadow/Glow -->
    <path d="M 120 85 L 145 135 C 150 145 142 155 130 155 L 110 155 C 98 155 90 145 95 135 Z" fill="#F59E0B" opacity="0.15"/>
    
    <!-- Flask Outline & Body -->
    <path d="M 108 85 L 108 105 L 88 140 C 82 150 89 162 101 162 L 139 162 C 151 162 158 150 152 140 L 132 105 L 132 85 Z" fill="#2D3748" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Flask Neck Rim -->
    <rect x="104" y="80" width="32" height="6" rx="3" fill="#E2E8F0"/>
    
    <!-- Liquid inside (fresh, glowing gold/orange) -->
    <path d="M 94 138 L 102 125 L 138 125 L 146 138 C 150 145 145 154 137 154 L 103 154 C 95 154 90 145 94 138 Z" fill="#F59E0B"/>
    
    <!-- Bubbles indicating active fresh experiment -->
    <circle cx="112" cy="115" r="3.5" fill="#FBBF24"/>
    <circle cx="128" cy="110" r="2" fill="#FBBF24"/>
    <circle cx="120" cy="100" r="4" fill="#FBBF24"/>
  </g>
</svg>