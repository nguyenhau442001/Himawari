<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Symbolizing "毕生" (a lifetime of dedication): A glowing, mature rice stalk combined with an hourglass shape, merging time and life's work -->
    
    <!-- Background subtle timeline arc -->
    <path d="M -50 -50 C -20 -70, 20 -70, 50 -50" fill="none" stroke="#2D333B" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    
    <!-- Hourglass / Life Span Outline (Subtle background element) -->
    <path d="M -25 -60 L 25 -60 L 10 -20 L 25 20 L -25 20 L -10 -20 Z" fill="#22272E" opacity="0.6"/>
    
    <!-- Glowing Life Spark / Essence inside top -->
    <circle cx="0" cy="-35" r="12" fill="#FFC107" opacity="0.15"/>
    
    <!-- Rice Stalk / Scientific Dedication (Representing the context: water/rice research, lifetime devotion) -->
    <!-- Main Stem -->
    <path d="M 0 60 C 0 20, 0 -10, 0 -70" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Rice Grains / Harvest (Left side) -->
    <path d="M 0 -45 C -15 -50, -20 -35, -10 -25 C -5 -20, 0 -25, 0 -25" fill="#FFC107"/>
    <path d="M 0 -20 C -18 -25, -22 -10, -12 0 C -6 5, 0 0, 0 0" fill="#FFC107"/>
    <path d="M 0 5 C -15 0, -18 15, -8 22 C -4 25, 0 20, 0 20" fill="#FFC107"/>
    
    <!-- Rice Grains / Harvest (Right side) -->
    <path d="M 0 -55 C 15 -60, 20 -45, 10 -35 C 5 -30, 0 -35, 0 -35" fill="#FFD54F"/>
    <path d="M 0 -30 C 18 -35, 22 -20, 12 -10 C 6 -5, 0 -10, 0 -10" fill="#FFD54F"/>
    <path d="M 0 -5 C 15 -10, 18 5, 8 12 C 4 15, 0 10, 0 10" fill="#FFD54F"/>
    <path d="M 0 20 C 12 15, 16 28, 6 35 C 3 38, 0 32, 0 32" fill="#FFD54F"/>

    <!-- Base / Roots firmly planted (Lifelong commitment) -->
    <path d="M -15 60 C -5 55, 5 55, 15 60" fill="none" stroke="#81C784" stroke-width="3" stroke-linecap="round"/>
    <path d="M -8 60 C -3 58, 3 58, 8 60" fill="none" stroke="#FFC107" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Focal Gold Accent Ring (Emphasizing completeness/trọn đời) -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#FFC107" stroke-width="2" opacity="0.3" stroke-dasharray="8 4"/>
  </g>
</svg>