<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Illustration for "大片" (Blockbuster Movie / Epic Film) -->
  <g transform="translate(0, 0)">
    <!-- Movie Screen / Background Glow -->
    <rect x="36" y="55" width="168" height="104" rx="8" fill="#222733" stroke="#2F3646" stroke-width="2"/>
    
    <!-- Cinematic Projection Light Cones -->
    <path d="M 60 40 L 0 10 L 0 230 L 60 160 Z" fill="#3B82F6" opacity="0.08"/>
    <path d="M 180 40 L 240 10 L 240 230 L 180 160 Z" fill="#3B82F6" opacity="0.08"/>

    <!-- Dynamic Sci-Fi / Epic Landscape on Screen (Representing "Blockbuster") -->
    <path d="M 36 120 L 70 85 L 100 110 L 140 70 L 175 115 L 204 85 L 204 159 L 36 159 Z" fill="#1E2533"/>
    
    <!-- Sci-Fi Planet / Epic Celestial Object -->
    <circle cx="160" cy="85" r="16" fill="#F59E0B" opacity="0.9"/>
    <ellipse cx="160" cy="85" rx="22" ry="6" fill="none" stroke="#FBBF24" stroke-width="3" transform="rotate(-20 160 85)"/>

    <!-- Film Strips / Cinematic Elements framing the center -->
    <path d="M 46 65 L 194 65" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
    <path d="M 46 149 L 194 149" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>

    <!-- Clapperboard (Director's Slate) representing "Film" prominently in the foreground -->
    <g transform="translate(70, 115)">
      <!-- Clapperboard Base -->
      <rect x="0" y="16" width="100" height="70" rx="6" fill="#0F1117" stroke="#3B82F6" stroke-width="3"/>
      
      <!-- Clapperboard Stripes (Top Strip) -->
      <path d="M 0 16 L 100 16 L 100 0 L 0 0 Z" fill="#1E2533" rx="4"/>
      <path d="M 10 16 L 25 0 L 35 0 L 20 16 Z" fill="#F3F4F6"/>
      <path d="M 40 16 L 55 0 L 65 0 L 50 16 Z" fill="#F3F4F6"/>
      <path d="M 70 16 L 85 0 L 95 0 L 80 16 Z" fill="#F3F4F6"/>
      
      <!-- Hinge / Pivot Circle -->
      <circle cx="12" cy="16" r="3" fill="#F59E0B"/>

      <!-- Slate Details (Lines representing chalk text/scene info) -->
      <line x1="16" y1="36" x2="60" y2="36" stroke="#4B5563" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="54" x2="84" y2="54" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="70" x2="50" y2="70" stroke="#4B5563" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Star Icon symbolizing "Blockbuster / Major Release" -->
      <path d="M 74 38 L 78 46 L 87 47 L 80 53 L 82 61 L 74 57 L 66 61 L 68 53 L 61 47 L 70 46 Z" fill="#F59E0B"/>
    </g>

    <!-- Sparkles / Epic Highlights -->
    <path d="M 50 45 L 53 52 L 60 55 L 53 58 L 50 65 L 47 58 L 40 55 L 47 52 Z" fill="#FBBF24"/>
    <path d="M 195 125 L 197 129 L 202 131 L 197 133 L 195 137 L 193 133 L 188 131 L 193 129 Z" fill="#FBBF24"/>
    <path d="M 185 35 L 186 38 L 190 39 L 186 40 L 185 43 L 184 40 L 180 39 L 184 38 Z" fill="#3B82F6"/>
  </g>
</svg>