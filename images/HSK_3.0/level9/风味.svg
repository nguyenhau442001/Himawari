<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Lantern/Shop -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soup/Food Gradients -->
    <linearGradient id="brothGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Night Market / Local Restaurant Stall) -->
  <!-- Wooden Wall / Partition -->
  <rect x="20" y="30" width="200" height="150" rx="8" fill="#334155"/>
  <rect x="25" y="35" width="190" height="140" rx="6" fill="#1e293b"/>
  <!-- Wall Slats / Decor -->
  <line x1="60" y1="35" x2="60" y2="175" stroke="#334155" stroke-width="2" stroke-dasharray="10 5"/>
  <line x1="120" y1="35" x2="120" y2="175" stroke="#334155" stroke-width="2" stroke-dasharray="10 5"/>
  <line x1="180" y1="35" x2="180" y2="175" stroke="#334155" stroke-width="2" stroke-dasharray="10 5"/>

  <!-- Warm Hanging Lantern (Context Prop) -->
  <circle cx="195" cy="70" r="35" fill="url(#lampGlow)"/>
  <path d="M 190 40 L 200 40 L 205 60 L 185 60 Z" fill="#ef4444"/>
  <ellipse cx="195" cy="65" rx="14" ry="16" fill="#f87171"/>
  <path d="M 190 70 L 200 70 L 202 85 L 188 85 Z" fill="#ef4444"/>
  <line x1="195" y1="20" x2="195" y2="40" stroke="#64748b" stroke-width="2"/>

  <!-- Wooden Table Surface -->
  <path d="M 10 175 L 230 175 L 220 220 L 20 220 Z" fill="#475569"/>
  <path d="M 15 175 L 225 175 L 215 180 L 25 180 Z" fill="#64748b"/>

  <!-- MAIN SCENARIO: A person tasting a rich, local specialty dish -->
  
  <!-- Character: Upper body, happy/impressed expression -->
  <!-- Body/Shirt -->
  <path d="M 80 220 L 80 185 C 80 170, 95 160, 110 160 L 130 160 C 145 160, 160 170, 160 185 L 160 220 Z" fill="#38bdf8"/>
  <path d="M 95 160 L 115 185 L 125 185 L 145 160 Z" fill="#bae6fd"/> <!-- Collar/Neckline -->

  <!-- Neck -->
  <rect x="110" y="145" rx="4" width="20" ry="4" height="20" fill="#fbcfe8"/>

  <!-- Head -->
  <circle cx="120" cy="125" r="24" fill="#fbcfe8"/>

  <!-- Hair -->
  <path d="M 96 125 C 96 105, 110 100, 120 100 C 135 100, 144 105, 144 125 C 144 120, 138 108, 120 108 C 102 108, 96 120, 96 125 Z" fill="#0f172a"/>

  <!-- Face Details: Delighted expression (Eyes closed happily ^ ^, smiling mouth) -->
  <path d="M 110 122 Q 114 117 118 122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 122 122 Q 126 117 130 122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="107" cy="128" r="4" fill="#fda4af" opacity="0.6"/>
  <circle cx="133" cy="128" r="4" fill="#fda4af" opacity="0.6"/>
  <!-- Smiling Open Mouth -->
  <path d="M 116 133 Q 120 139 124 133 Z" fill="#e11d48"/>

  <!-- Hands holding chopsticks / bowl -->
  <!-- Back Arm & Hand holding bowl -->
  <path d="M 85 180 C 85 170, 95 165, 105 175" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="105" cy="175" r="6" fill="#fbcfe8"/>

  <!-- THE LOCAL SPECIALTY DISH (Bowl of steaming local noodles/soup with rich toppings) -->
  <!-- Ceramic Bowl -->
  <path d="M 85 185 L 155 185 C 155 205, 85 205, 85 185 Z" fill="#f8fafc"/>
  <ellipse cx="120" cy="185" rx="35" ry="8" fill="#e2e8f0"/>
  <!-- Broth & Ingredients -->
  <ellipse cx="120" cy="187" rx="32" ry="6" fill="url(#brothGrad)"/>
  <!-- Noodles / Toppings (Chili oil drops, greens, meat slice) -->
  <circle cx="110" cy="186" r="3" fill="#ef4444"/>
  <circle cx="130" cy="188" r="2.5" fill="#ef4444"/>
  <path d="M 115 185 Q 120 183 125 186" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="120" cy="187" rx="8" ry="3" fill="#b45309"/> <!-- Pork slice -->

  <!-- Rising Steam -->
  <path d="M 110 175 Q 105 165, 115 155 Q 125 145, 115 135" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 130 175 Q 135 165, 125 155 Q 115 145, 125 135" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Chopsticks and Tasting Action -->
  <path d="M 135 165 L 160 145" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <path d="M 138 168 L 163 148" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <!-- Food morsel lifted on chopsticks -->
  <circle cx="148" cy="155" r="3.5" fill="#f59e0b"/>

  <!-- Front Arm holding chopsticks near mouth -->
  <path d="M 140 175 C 150 175, 155 165, 150 150" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="150" cy="150" r="5" fill="#fbcfe8"/>

  <!-- Decorative Sparkles / Flavor indicator (Visualizing "fengwei" - rich local flavor) -->
  <path d="M 65 110 L 68 118 L 76 121 L 68 124 L 65 132 L 62 124 L 54 121 L 62 118 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 170 95 L 172 100 L 177 102 L 172 104 L 170 109 L 168 104 L 163 102 L 168 100 Z" fill="#fbbf24" opacity="0.8"/>
  <circle cx="155" cy="115" r="3" fill="#f59e0b"/>
  <circle cx="75" cy="140" r="2" fill="#f59e0b"/>

  <!-- Small side dish plate on the table -->
  <ellipse cx="185" cy="200" rx="18" ry="6" fill="#cbd5e1"/>
  <ellipse cx="185" cy="198" rx="14" ry="4" fill="#10b981"/> <!-- Green side veggies -->

  <!-- Table condiment jar -->
  <rect x="45" y="180" width="14" height="20" rx="3" fill="#e2e8f0"/>
  <path d="M 47 180 L 57 180 L 55 176 L 49 176 Z" fill="#ef4444"/>
  <circle cx="52" cy="190" r="3" fill="#ef4444"/>

</svg>