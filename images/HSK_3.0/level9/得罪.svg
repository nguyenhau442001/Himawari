<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Office Glow -->
    <radialGradient id="officeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lampLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#officeGlow)"/>

  <!-- Interior Environment: Office Wall & Window -->
  <!-- Window Frame -->
  <g opacity="0.6">
    <rect x="140" y="25" width="70" height="85" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="145" y="30" width="28" height="75" fill="#1e293b"/>
    <rect x="177" y="30" width="28" height="75" fill="#1e293b"/>
    <!-- City lights outside -->
    <circle cx="155" cy="50" r="1.5" fill="#fbbf24"/>
    <circle cx="165" cy="70" r="1" fill="#38bdf8"/>
    <circle cx="190" cy="45" r="1.5" fill="#f43f5e"/>
    <circle cx="185" cy="85" r="1" fill="#fbbf24"/>
  </g>

  <!-- Bookshelf Background -->
  <g opacity="0.4">
    <rect x="25" y="35" width="45" height="75" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="25" y1="60" x2="70" y2="60" stroke="#334155" stroke-width="1.5"/>
    <line x1="25" y1="85" x2="70" y2="85" stroke="#334155" stroke-width="1.5"/>
    <!-- Books -->
    <rect x="30" y="42" width="8" height="18" fill="#38bdf8" rx="1"/>
    <rect x="40" y="40" width="12" height="20" fill="#f43f5e" rx="1"/>
    <rect x="55" y="45" width="10" height="15" fill="#fbbf24" rx="1"/>
    <rect x="30" y="67" width="14" height="18" fill="#10b981" rx="1"/>
    <rect x="48" y="70" width="9" height="15" fill="#a855f7" rx="1"/>
  </g>

  <!-- Office Desk -->
  <rect x="20" y="165" width="200" height="12" rx="3" fill="#334155" filter="url(#softShadow)"/>
  <rect x="35" y="177" width="12" height="43" fill="#1e293b"/>
  <rect x="193" y="177" width="12" height="43" fill="#1e293b"/>

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M 85 165 L 125 165 L 132 155 L 78 155 Z" fill="#64748b"/>
  <rect x="75" y="162" width="60" height="3" rx="1.5" fill="#94a3b8"/>
  <path d="M 95 157 C 95 155.5 96.5 155 98 155 L 112 155 C 113.5 155 115 155.5 115 157 L 115 162 L 95 162 Z" fill="#0f172a" opacity="0.8"/>

  <!-- Coffee Mug -->
  <rect x="145" y="152" width="14" height="13" rx="2" fill="#f8fafc"/>
  <path d="M 159 155 C 163 155 163 162 159 162" stroke="#f8fafc" stroke-width="2" fill="none"/>

  <!-- Desk Lamp -->
  <path d="M 195 165 L 195 125 L 180 115" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 172 105 L 188 105 L 193 118 L 167 118 Z" fill="#fbbf24"/>
  <!-- Lamp Light Cone -->
  <polygon points="180,118 120,180 210,180" fill="url(#lampLight)" style="mix-blend-mode: screen;"/>

  <!-- Central Character (The Diplomatic, Overwhelmed Employee) -->
  <g id="main-character" filter="url(#softShadow)">
    <!-- Body / Torso (Wearing a neat navy blazer & blue shirt) -->
    <path d="M 90 165 C 90 140 100 135 120 135 C 140 135 150 140 150 165 Z" fill="#1e293b"/>
    <path d="M 105 135 L 120 155 L 135 135 L 130 120 L 110 120 Z" fill="#f8fafc"/> <!-- Shirt & Collar -->
    <polygon points="117,140 123,140 122,158 118,158" fill="#f43f5e"/> <!-- Tie -->

    <!-- Head -->
    <circle cx="120" cy="98" r="22" fill="#fed7aa"/>

    <!-- Hair (Neat dark brown styling) -->
    <path d="M 99 100 C 98 84 108 76 122 76 C 137 76 142 85 142 100 C 140 92 136 83 122 83 C 108 83 101 92 99 100 Z" fill="#33211d"/>

    <!-- Facial Expression: Anxious, placating, trying to balance opposing sides -->
    <!-- Eyebrows (Slightly arched in worry) -->
    <path d="M 106 90 Q 112 87 117 90" stroke="#33211d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 123 90 Q 128 87 134 90" stroke="#33211d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Eyes (Wide, attentive, nervous) -->
    <circle cx="112" cy="95" r="2.5" fill="#1e293b"/>
    <circle cx="128" cy="95" r="2.5" fill="#1e293b"/>

    <!-- Mouth (Nervous, tight-lipped diplomatic smile) -->
    <path d="M 113 107 Q 120 103 127 107" stroke="#33211d" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Sweat drop of tension -->
    <path d="M 137 92 C 141 95 140 100 137 100 C 134 100 133 95 137 92 Z" fill="#38bdf8" opacity="0.8"/>

    <!-- Arms Gesturing Openly / Balancing -->
    <!-- Left Arm (Reaching out calmingly) -->
    <path d="M 95 145 C 80 145 70 155 65 150" stroke="#1e293b" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="63" cy="148" r="5" fill="#fed7aa"/>

    <!-- Right Arm (Balancing gesture) -->
    <path d="M 145 145 C 160 145 170 155 175 150" stroke="#1e293b" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="177" cy="148" r="5" fill="#fed7aa"/>
  </g>

  <!-- Secondary Characters (Representing "Anyone" / Demanding People to Either Side) -->
  
  <!-- Left Demanding Colleague/Client (Impatient, pointing/talking) -->
  <g id="left-character" opacity="0.9">
    <!-- Body/Shoulder cutting off at left edge -->
    <path d="M 10 180 C 10 145 35 140 50 140 L 50 180 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="35" cy="115" r="18" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 22 112 C 22 100 30 98 42 100 C 48 101 49 110 49 115 L 22 115 Z" fill="#451a03"/>
    <!-- Angry/Demanding Eyebrow slant -->
    <line x1="28" y1="110" x2="35" y2="113" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <!-- Open demanding mouth -->
    <path d="M 32 122 Q 36 126 40 122" fill="#451a03"/>
    <!-- Pointing Arm -->
    <path d="M 45 150 L 65 142" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="67" cy="141" r="4" fill="#fcd34d"/>
  </g>

  <!-- Right Demanding Colleague/Client (Crossed arms or pressing demand) -->
  <g id="right-character" opacity="0.9">
    <!-- Body -->
    <path d="M 230 180 C 230 145 205 140 190 140 L 190 180 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="205" cy="115" r="18" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M 190 110 C 190 95 200 95 215 98 C 222 99 220 110 220 115 L 190 115 Z" fill="#881337"/>
    <!-- Eyebrow slant -->
    <line x1="200" y1="113" x2="208" y2="110" stroke="#881337" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth frowning/demanding -->
    <path d="M 198 123 Q 204 120 210 123" stroke="#881337" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arm folded / leaning in -->
    <path d="M 195 150 L 175 145" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <circle cx="173" cy="144" r="4" fill="#ffedd5"/>
  </g>

  <!-- Abstract Floating Conceptual Indicators (No text, strictly visual tension/balance) -->
  <!-- Balanced Energy Orbs floating above the central character showing neutrality/care -->
  <g opacity="0.8">
    <circle cx="95" cy="75" r="4" fill="#38bdf8" filter="url(#softShadow)"/>
    <circle cx="145" cy="75" r="4" fill="#ec4899" filter="url(#softShadow)"/>
    <!-- Gentle connecting arc showing peacekeeping / mediation -->
    <path d="M 98 73 Q 120 63 142 73" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  </g>

</svg>