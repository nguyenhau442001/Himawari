<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="15" fill="#334155" rx="2"/>
  <rect x="50" y="175" width="10" height="40" fill="#475569"/>
  <rect x="180" y="175" width="10" height="40" fill="#475569"/>

  <!-- Character -->
  <circle cx="120" cy="90" r="30" fill="#fde68a"/>
  <path d="M105 85 Q110 80 115 85 M125 85 Q130 80 135 85" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M110 100 Q120 105 130 100" stroke="#1e293b" stroke-width="2" fill="none"/>
  <rect x="90" y="120" width="60" height="50" fill="#38bdf8" rx="10"/>

  <!-- The "Dialectical" View: Split perspective props -->
  <!-- Left Side: Coin/Idea (Positive) -->
  <circle cx="80" cy="140" r="15" fill="#fbbf24"/>
  <circle cx="80" cy="140" r="8" fill="#f59e0b"/>
  
  <!-- Right Side: Coin/Idea (Negative/Shadow) -->
  <circle cx="160" cy="140" r="15" fill="#ec4899"/>
  <path d="M150 135 L170 145 M150 145 L170 135" stroke="#881337" stroke-width="3"/>

  <!-- Magnifying Glass -->
  <circle cx="120" cy="140" r="20" fill="none" stroke="#f8fafc" stroke-width="4"/>
  <path d="M135 155 L150 170" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>

  <!-- Ambient details -->
  <circle cx="200" cy="50" r="3" fill="#fb923c" opacity="0.6"/>
  <circle cx="30" cy="60" r="2" fill="#10b981" opacity="0.6"/>
  <path d="M40 40 L50 30" stroke="#475569" stroke-width="2"/>
  <path d="M200 190 L210 180" stroke="#475569" stroke-width="2"/>
</svg>