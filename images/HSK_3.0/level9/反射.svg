<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Light Beam Gradient (Yellow/Amber) -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Reflected Beam Gradient -->
    <linearGradient id="reflected-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Mirror Shine Gradient -->
    <linearGradient id="mirror-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Room Interior Background -->
  <!-- Back Wall & Floor Line -->
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="170" width="240" height="70" fill="#090d16" opacity="0.6"/>

  <!-- Wallpaper accent / window sill backdrop -->
  <rect x="25" y="40" width="60" height="130" fill="#1e293b" opacity="0.4" rx="4"/>

  <!-- Plant Prop for Context -->
  <g transform="translate(15, 125)">
    <path d="M10 45 C10 30 20 20 25 5 C30 20 40 30 40 45 Z" fill="#10b981"/>
    <path d="M5 48 C5 38 12 28 18 15 C20 28 15 38 12 48 Z" fill="#059669"/>
    <rect x="15" y="45" width="20" height="25" rx="3" fill="#64748b"/>
  </g>

  <!-- Flashlight / Light Source (Left side) -->
  <g transform="translate(20, 95) rotate(-15)">
    <rect x="0" y="0" width="28" height="14" rx="7" fill="#475569"/>
    <path d="M28 2 L38 -2 L38 16 L28 12 Z" fill="#cbd5e1"/>
    <ellipse cx="38" cy="7" rx="3" ry="9" fill="#f59e0b"/>
  </g>

  <!-- Incoming Light Beam (Flashlight to Mirror) -->
  <!-- Polygon from flashlight tip (approx 45, 95) to mirror center (140, 105) -->
  <polygon points="45,90 135,92 140,112 43,105" fill="url(#light-beam)"/>
  <polygon points="48,95 137,98 139,106 47,100" fill="#fef08a" opacity="0.6"/>

  <!-- The Mirror (Subject: 镜子) -->
  <!-- Mirror stand/base -->
  <path d="M125 180 L155 180 L150 165 L130 165 Z" fill="#64748b"/>
  <rect x="138" y="145" width="4" height="22" fill="#94a3b8"/>
  
  <!-- Mirror Frame & Glass -->
  <g transform="translate(110, 45)">
    <!-- Outer Frame -->
    <rect x="10" y="5" width="40" height="100" rx="20" fill="#b45309" stroke="#d97706" stroke-width="2"/>
    <!-- Glass Surface -->
    <rect x="13" y="8" width="34" height="94" rx="17" fill="#0f172a"/>
    <!-- Mirror Reflection / Sheen -->
    <path d="M13 30 L47 15 L47 35 L13 55 Z" fill="url(#mirror-sheen)"/>
    <circle cx="30" cy="75" r="3" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Reflected Light Beam (Mirror to Wall/Ceiling) -->
  <!-- Deflected upwards and rightwards: from mirror (140, 95) to upper right (215, 35) -->
  <polygon points="145,85 220,20 225,35 148,102" fill="url(#reflected-beam)"/>
  <polygon points="147,88 217,25 220,32 149,98" fill="#bae6fd" opacity="0.5"/>

  <!-- Reflected Light Spot on the Right Wall -->
  <ellipse cx="215" cy="30" rx="12" ry="8" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="215" cy="30" rx="6" ry="4" fill="#ffffff" opacity="0.8"/>

  <!-- Curious Character (Observing the reflection) -->
  <g transform="translate(170, 105)">
    <!-- Character Body & Hoodie -->
    <path d="M15 65 C10 45 25 35 35 35 C45 35 60 45 55 65 Z" fill="#6366f1"/>
    <!-- Character Head -->
    <circle cx="35" cy="22" r="14" fill="#fde047"/>
    <!-- Hair -->
    <path d="M21 20 C22 10 32 8 42 12 C48 15 49 22 49 22 C49 22 42 16 35 16 C28 16 21 20 21 20 Z" fill="#334155"/>
    <!-- Face Profile / Eye looking up-left toward light spot -->
    <circle cx="28" cy="22" r="1.5" fill="#1e293b"/>
    <!-- Pointing hand towards the light spot on wall -->
    <path d="M48 40 C55 35 60 28 62 25" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Dust particles / Ambient light sparkles -->
  <circle cx="85" cy="75" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="105" cy="85" r="1" fill="#fef08a" opacity="0.6"/>
  <circle cx="180" cy="55" r="1.5" fill="#7dd3fc" opacity="0.8"/>
  <circle cx="195" cy="40" r="1" fill="#7dd3fc" opacity="0.7"/>

  <!-- Foreground Books/Props for Rich Context -->
  <g transform="translate(65, 155)">
    <rect x="0" y="5" width="35" height="10" rx="2" fill="#ef4444"/>
    <rect x="3" y="-3" width="30" height="10" rx="2" fill="#3b82f6"/>
    <rect x="6" y="-10" width="25" height="9" rx="2" fill="#10b981"/>
  </g>
</svg>