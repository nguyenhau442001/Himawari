<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle depth / strata layers -->
  <path d="M40 70 L200 70 L200 200 L40 200 Z" fill="#222733"/>
  <path d="M40 100 L200 95 L200 200 L40 200 Z" fill="#2A303C"/>
  <path d="M40 140 L200 135 L200 200 L40 200 Z" fill="#323946"/>

  <!-- Geological Strata Blocks (Left Side) -->
  <g>
    <!-- Top stratum left -->
    <polygon points="40,90 105,80 105,130 40,140" fill="#4B5563"/>
    <!-- Middle stratum left -->
    <polygon points="40,140 105,130 105,175 40,180" fill="#374151"/>
    <!-- Bottom stratum left -->
    <polygon points="40,180 105,175 105,200 40,200" fill="#1F2937"/>
    <!-- Strata lines left -->
    <line x1="40" y1="115" x2="105" y2="105" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,2"/>
  </g>

  <!-- Geological Strata Blocks (Right Side - Shifted Down & Rotated slightly for fault line effect) -->
  <g transform="translate(135, 95) rotate(-5) translate(-135, -95)">
    <!-- Top stratum right -->
    <polygon points="130,65 200,75 200,115 130,105" fill="#6B7280"/>
    <!-- Middle stratum right -->
    <polygon points="130,105 200,115 200,155 130,145" fill="#4B5563"/>
    <!-- Bottom stratum right -->
    <polygon points="130,145 200,155 200,200 130,200" fill="#374151"/>
    <!-- Strata lines right -->
    <line x1="130" y1="125" x2="200" y2="135" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,2"/>
  </g>

  <!-- High-contrast Accent: The exact jagged Fault Line / Fracture (断裂缝) -->
  <path d="M105,80 L115,100 L100,120 L120,145 L110,165 L130,180" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing fracture highlights -->
  <path d="M105,80 L115,100 L100,120 L120,145 L110,165 L130,180" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Seismic / Stress Force Indicators (Arrows showing opposite movement) -->
  <g stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upward force on right -->
    <path d="M 165 45 L 165 30 L 155 38" fill="none"/>
    <path d="M 165 30 L 175 38" fill="none"/>
    
    <!-- Downward force on left -->
    <path d="M 75 45 L 75 60 L 65 52" fill="none"/>
    <path d="M 75 60 L 85 52" fill="none"/>
  </g>

  <!-- Small rubble pieces in the fracture -->
  <polygon points="112,110 117,113 114,117 109,114" fill="#D97706"/>
  <polygon points="116,148 122,146 120,152 114,153" fill="#D97706"/>
</svg>