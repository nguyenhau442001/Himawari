<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient (symbolizing earnest resolve/oath) -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Study Room Interior -->
  <!-- Wallpaper lines / accent wall -->
  <path d="M0 0 H240 V170 H0 Z" fill="#1e293b"/>
  <line x1="60" y1="0" x2="60" y2="170" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="180" y1="0" x2="180" y2="170" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Window with Night City Silhouette / Moonlight -->
  <rect x="155" y="25" width="55" height="90" rx="4" fill="#0b0f19" stroke="#475569" stroke-width="2"/>
  <rect x="160" y="30" width="45" height="80" fill="url(#windowLight)"/>
  <!-- Window frames -->
  <line x1="182" y1="30" x2="182" y2="110" stroke="#475569" stroke-width="1.5"/>
  <line x1="160" y1="70" x2="205" y2="70" stroke="#475569" stroke-width="1.5"/>
  <!-- City building silhouettes outside -->
  <path d="M165 110 V85 h8 v25 h7 V75 h10 v35 h8 v20 h-33 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Bookshelf Background Props -->
  <rect x="25" y="35" width="40" height="75" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="60" x2="65" y2="60" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="85" x2="65" y2="85" stroke="#334155" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <path d="M30 60 V45 h6 v15 z" fill="#ef4444" opacity="0.8"/>
  <path d="M37 60 V48 h5 v12 z" fill="#3b82f6" opacity="0.8"/>
  <path d="M48 60 V42 h7 v18 z" fill="#10b981" opacity="0.8"/>
  <path d="M30 85 V70 h5 v15 z" fill="#f59e0b" opacity="0.8"/>
  <path d="M37 85 V73 h7 v12 z" fill="#ec4899" opacity="0.8"/>

  <!-- Atmospheric Spotlight overlay -->
  <circle cx="120" cy="120" r="130" fill="url(#spotlight)"/>

  <!-- Desk & Foreground Props -->
  <rect x="20" y="170" width="200" height="40" rx="4" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <path d="M20 170 H240 V174 H20 Z" fill="#475569" opacity="0.6"/> <!-- Desk rim highlight -->

  <!-- Desk Props: Messy "Mistake/Error" papers being corrected -->
  <!-- Red-ink marked report paper (symbolizing "错误" - errors) -->
  <g transform="translate(45, 160) rotate(-8)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Mock error marks (red crosses & circles) -->
    <path d="M8 10 L14 16 M14 10 L8 16" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="13" x2="28" y2="13" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8 25 L14 31 M14 25 L8 31" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="28" x2="27" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="20" cy="28" r="10" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Clean corrected paper / blueprint stack -->
  <g transform="translate(155, 165) rotate(5)">
    <rect x="0" y="0" width="38" height="48" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="6" y1="10" x2="32" y2="10" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="26" y2="18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="30" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="34" x2="20" y2="34" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Green checkmark for correction -->
    <path d="M26 32 L30 36 L36 28" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Desk lamp -->
  <path d="M200 170 L195 130 h10 z" fill="#64748b"/>
  <path d="M185 125 c0-12 10-20 20-20 s20 8 20 20 z" fill="#38bdf8"/>
  <ellipse cx="205" cy="125" rx="20" ry="6" fill="#0ea5e9"/>

  <!-- MAIN CHARACTER: Young man making a solemn oath ("发誓") -->
  <g id="character" filter="url(#shadow)">
    <!-- Chair Back -->
    <rect x="95" y="105" width="50" height="75" rx="8" fill="#334155"/>
    <rect x="103" y="113" width="34" height="55" rx="4" fill="#1e293b" opacity="0.5"/>

    <!-- Torso (leaning slightly forward with determination) -->
    <path d="M90 145 C90 130, 110 120, 120 120 C130 120, 150 130, 150 145 L155 210 H85 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt details -->
    <path d="M110 120 L120 135 L130 120 Z" fill="#f8fafc"/>
    <path d="M117 135 L120 145 L123 135 Z" fill="#cbd5e1"/>

    <!-- Left Arm (resting firmly on desk) -->
    <path d="M95 140 C85 155, 75 180, 70 195 L95 200 C98 185, 105 165, 110 150 Z" fill="#2563eb"/>
    <!-- Left Hand clenched into a fist on desk -->
    <circle cx="68" cy="196" r="8" fill="#fcd34d"/>

    <!-- Right Arm (Raised high in a solemn oath gesture: "发誓") -->
    <!-- Shoulder to elbow -->
    <path d="M142 135 C155 130, 168 120, 175 105" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/>
    <!-- Forearm pointing upward -->
    <path d="M175 105 L178 70" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
    <!-- Open Palm / Hand raised up taking an oath -->
    <g transform="translate(178, 55)">
      <!-- Palm -->
      <path d="M-6 15 C-6 8, 6 8, 6 15 L8 0 C8 -4, -8 -4, -6 0 Z" fill="#fcd34d"/>
      <!-- Fingers straight up (swearing gesture) -->
      <rect x="-6" y="-14" width="3" height="15" rx="1.5" fill="#fcd34d"/>
      <rect x="-2" y="-18" width="3.5" height="19" rx="1.5" fill="#fcd34d"/>
      <rect x="2.5" y="-16" width="3.5" height="17" rx="1.5" fill="#fcd34d"/>
      <rect x="7" y="-12" width="3" height="13" rx="1.5" fill="#fcd34d"/>
      <!-- Thumb tucked/angled -->
      <path d="M-6 8 C-10 8, -12 4, -9 2" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Neck -->
    <path d="M112 112 H128 V125 H112 Z" fill="#fde68a"/>

    <!-- Head (Determined expression, looking slightly upward) -->
    <circle cx="120" cy="90" r="24" fill="#fef08a"/>

    <!-- Hair (Styled neat, dark) -->
    <path d="M96 90 C96 72, 104 64, 120 64 C136 64, 144 72, 144 90 C144 94, 142 92, 140 84 C136 72, 128 68, 120 68 C112 68, 104 72, 100 84 C98 92, 96 94, 96 90 Z" fill="#1e293b"/>
    <path d="M102 82 C108 72, 120 70, 132 76 C138 79, 141 84, 141 84 C138 74, 128 70, 120 70 C112 70, 106 74, 102 82 Z" fill="#334155"/>

    <!-- Facial Expression: Determined/Earnest Brows & Focused Eyes -->
    <!-- Eyebrows (Slanted down toward center for serious/resolved look) -->
    <path d="M106 83 L116 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M134 83 L124 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Focused, intense) -->
    <circle cx="111" cy="90" r="2.5" fill="#0f172a"/>
    <circle cx="129" cy="90" r="2.5" fill="#0f172a"/>

    <!-- Determined Mouth (Firmly set, slight upward hint of resolute confidence) -->
    <path d="M114 102 Q120 106 126 102" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Rosy/Determined Cheeks -->
    <circle cx="106" cy="95" r="3" fill="#f87171" opacity="0.3"/>
    <circle cx="134" cy="95" r="3" fill="#f87171" opacity="0.3"/>
  </g>

  <!-- Sparkle / Resolve Aura Effects (Subtle magical/earnest glowing accents) -->
  <g fill="#fbbf24">
    <!-- Star 1 near raised hand -->
    <path d="M195 40 L197 45 L202 47 L197 49 L195 54 L193 49 L188 47 L193 45 Z" opacity="0.9"/>
    <!-- Star 2 near head -->
    <path d="M145 60 L146.5 63.5 L150 65 L146.5 66.5 L145 70 L143.5 66.5 L140 65 L143.5 63.5 Z" opacity="0.7"/>
    <!-- Small floating particle -->
    <circle cx="165" cy="85" r="1.5" opacity="0.8"/>
    <circle cx="95" cy="115" r="2" opacity="0.5"/>
  </g>

  <!-- Foreground Vignette / Frame enhancement -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2"/>
</svg>