<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Left Region (Blue Theme) -->
    <path d="M 24 100 L 96 80 L 96 200 L 24 200 Z" fill="#243044" opacity="0.8"/>
    <path d="M 40 120 L 80 110 L 80 140 L 40 150 Z" fill="#2E4057" rx="4"/>
    <path d="M 40 160 L 80 150 L 80 180 L 40 190 Z" fill="#2E4057" rx="4"/>
    
    <!-- Right Region (Teal/Green Theme) -->
    <path d="M 144 80 L 216 100 L 216 200 L 144 200 Z" fill="#1E3A3A" opacity="0.8"/>
    <path d="M 160 110 L 200 120 L 200 150 L 160 140 Z" fill="#244C4C" rx="4"/>
    <path d="M 160 150 L 200 160 L 200 190 L 160 180 Z" fill="#244C4C" rx="4"/>

    <!-- Central Physical Wall / Barrier Structure (壁垒 - Noun) -->
    <!-- Foundation / Platform -->
    <path d="M 90 70 L 150 70 L 160 210 L 80 210 Z" fill="#0D1117" />
    
    <!-- Main Wall Blocks (Fortified Barrier) -->
    <rect x="96" y="76" width="48" height="128" fill="#323B4D" rx="4"/>
    
    <!-- Brick Pattern Details -->
    <line x1="96" y1="100" x2="144" y2="100" stroke="#1A1D24" stroke-width="3"/>
    <line x1="96" y1="124" x2="144" y2="124" stroke="#1A1D24" stroke-width="3"/>
    <line x1="96" y1="148" x2="144" y2="148" stroke="#1A1D24" stroke-width="3"/>
    <line x1="96" y1="172" x2="144" y2="172" stroke="#1A1D24" stroke-width="3"/>
    <line x1="96" y1="196" x2="144" y2="196" stroke="#1A1D24" stroke-width="3"/>
    
    <line x1="120" y1="76" x2="120" y2="100" stroke="#1A1D24" stroke-width="3"/>
    <line x1="108" y1="100" x2="108" y2="124" stroke="#1A1D24" stroke-width="3"/>
    <line x1="132" y1="124" x2="132" y2="148" stroke="#1A1D24" stroke-width="3"/>
    <line x1="108" y1="148" x2="108" y2="172" stroke="#1A1D24" stroke-width="3"/>
    <line x1="132" y1="172" x2="132" y2="196" stroke="#1A1D24" stroke-width="3"/>

    <!-- Wall Top Crenellations / Defensive Crest -->
    <rect x="92" y="60" width="16" height="16" fill="#F0883E" rx="2"/>
    <rect x="132" y="60" width="16" height="16" fill="#F0883E" rx="2"/>

    <!-- Focal Accents (Warning / Separation) -->
    <circle cx="120" cy="45" r="8" fill="#F0883E"/>
    <path d="M 120 39 L 120 47" stroke="#0D1117" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="51" r="1.5" fill="#0D1117"/>
    
    <!-- Blocked Trade/Connection Indicator (Red-Orange accent arrows hitting the wall) -->
    <!-- Left Arrow Blocked -->
    <path d="M 60 140 L 88 140" stroke="#F0883E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 80 132 L 90 140 L 80 148" fill="none" stroke="#F0883E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Arrow Blocked -->
    <path d="M 180 140 L 152 140" stroke="#F0883E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 160 132 L 150 140 L 160 148" fill="none" stroke="#F0883E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>