<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glowing grid/radiation waves representing geographic spread and economic radiation -->
  <g opacity="0.3">
    <circle cx="120" cy="120" r="85" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="35" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Directional outward propagation rays (symbolizing "辐射" / lan tỏa) -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="65" x2="120" y2="40" />
    <line x1="120" y1="175" x2="120" y2="200" />
    <line x1="65" y1="120" x2="40" y2="120" />
    <line x1="175" y1="120" x2="200" y2="120" />
    <line x1="81" y1="81" x2="63" y2="63" />
    <line x1="159" y1="81" x2="177" y2="63" />
    <line x1="81" y1="159" x2="63" y2="177" />
    <line x1="159" y1="159" x2="177" y2="177" />
  </g>

  <!-- Surrounding smaller node towns (representing neighboring towns / 周边城镇) -->
  <g>
    <!-- Top town -->
    <rect x="112" y="32" width="16" height="16" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <!-- Bottom town -->
    <rect x="112" y="192" width="16" height="16" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <!-- Left town -->
    <rect x="32" y="112" width="16" height="16" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <!-- Right town -->
    <rect x="192" y="112" width="16" height="16" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    
    <!-- Diagonal smaller towns -->
    <rect x="58" y="58" width="12" height="12" rx="2" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <rect x="170" y="58" width="12" height="12" rx="2" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <rect x="58" y="170" width="12" height="12" rx="2" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <rect x="170" y="170" width="12" height="12" rx="2" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- Connection pathways (Network dynamic) -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
    <line x1="120" y1="95" x2="120" y2="48" />
    <line x1="120" y1="145" x2="120" y2="192" />
    <line x1="95" y1="120" x2="48" y2="120" />
    <line x1="145" y1="120" x2="192" y2="120" />
    <line x1="102" y1="102" x2="68" y2="68" />
    <line x1="138" y1="102" x2="172" y2="68" />
    <line x1="102" y1="138" x2="68" y2="172" />
    <line x1="138" y1="138" x2="172" y2="172" />
  </g>

  <!-- Central Core Urban Metropolis (Center piece / 大都市中心) -->
  <g>
    <!-- Base glow halo -->
    <circle cx="120" cy="120" r="28" fill="#F59E0B" opacity="0.15"/>
    
    <!-- Central buildings / Skyline base -->
    <rect x="106" y="105" width="28" height="35" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="96" y="115" width="14" height="25" rx="2" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="130" y="110" width="14" height="30" rx="2" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Central Tower Spire -->
    <line x1="120" y1="105" x2="120" y2="92" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="120" cy="90" r="3" fill="#F59E0B"/>

    <!-- Modern architectural windows (abstract grid dots) -->
    <circle cx="113" cy="115" r="1" fill="#38BDF8"/>
    <circle cx="127" cy="115" r="1" fill="#38BDF8"/>
    <circle cx="113" cy="125" r="1" fill="#38BDF8"/>
    <circle cx="127" cy="125" r="1" fill="#38BDF8"/>
    <circle cx="120" cy="120" r="1.5" fill="#F59E0B"/>
  </g>

  <!-- Pulse rings emanating from center (Active Radiating Effect) -->
  <circle cx="120" cy="120" r="44" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>
</svg>