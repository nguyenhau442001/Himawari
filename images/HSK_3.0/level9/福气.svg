<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elderly person sitting in a comfortable chair -->
  <g transform="translate(120, 140)">
    <!-- Chair -->
    <path d="M-40 80 L40 80 L35 20 L-35 20 Z" fill="#34495E"/>
    <path d="M-35 20 L-35 -10 A 15 15 0 0 1 -20 -25 L20 -25 A 15 15 0 0 1 35 -10 L35 20" fill="#2C3E50"/>
    
    <!-- Elderly person body -->
    <circle cx="0" cy="-45" r="25" fill="#FAD7A0"/>
    <path d="M-20 -30 Q0 -10 20 -30 L15 30 L-15 30 Z" fill="#E67E22"/>
    
    <!-- Facial features -->
    <path d="M-10 -50 L-5 -55 M5 -50 L10 -55" stroke="#935116" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 -40 Q0 -35 8 -40" stroke="#935116" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Two younger figures (children) standing beside, showing respect/care -->
  <g transform="translate(60, 160)">
    <circle cx="0" cy="-30" r="15" fill="#FAD7A0"/>
    <path d="M-15 -15 L15 -15 L10 40 L-10 40 Z" fill="#3498DB"/>
    <path d="M0 -15 L0 10" stroke="#FAD7A0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(180, 160)">
    <circle cx="0" cy="-30" r="15" fill="#FAD7A0"/>
    <path d="M-15 -15 L15 -15 L10 40 L-10 40 Z" fill="#27AE60"/>
    <path d="M0 -15 L0 10" stroke="#FAD7A0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Golden glow effect behind the elder to represent 'Fortune/Blessing' -->
  <circle cx="120" cy="95" r="40" fill="none" stroke="#F1C40F" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="120" cy="95" r="30" fill="#F1C40F" opacity="0.1"/>
</svg>