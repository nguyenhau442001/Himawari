<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "丑陋" (Inner ugliness vs outer appearance / Describing word contrast) -->
  <!-- Using scale exaggeration and visual contrast: A sleek, polished exterior mask/surface cracking to reveal a stark, chaotic, dark inner state. -->
  
  <g transform="translate(0, 0)">
    <!-- Background subtle glow representing the dark reality -->
    <circle cx="120" cy="120" r="70" fill="#251F29" opacity="0.8"/>

    <!-- The Outer Shell / Persona (Sleek, gold/orange accented modern flat shape, calm exterior) -->
    <path d="M120 50 C155 50 180 75 180 120 C180 165 155 190 120 190 C85 190 60 165 60 120 C60 75 85 50 120 50 Z" 
          fill="#2D333B" stroke="#F39C12" stroke-width="2.5" stroke-dasharray="8 4"/>

    <!-- Peaceful/Attractive Outer Mask Features (Calm, neutral expression) -->
    <circle cx="98" cy="110" r="6" fill="#F39C12"/>
    <circle cx="142" cy="110" r="6" fill="#F39C12"/>
    <path d="M108 140 Q120 150 132 140" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>

    <!-- The Split / Crack representing inner corruption breaking through (Scale exaggeration of internal chaos) -->
    <path d="M120 50 L115 80 L130 100 L110 130 L125 160 L120 190" 
          fill="none" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chaotic Inner Core Elements bursting out (Visual contrast: jagged, dark, aggressive shapes) -->
    <path d="M125 95 L145 80 L138 105 Z" fill="#E74C3C" opacity="0.9"/>
    <path d="M110 135 L90 125 L100 150 Z" fill="#C0392B" opacity="0.9"/>
    
    <!-- Sharp jagged thorns/spikes radiating from the core representing "内心丑陋" (inner ugliness/malice) -->
    <path d="M130 115 L165 100 M110 125 L75 135 M120 130 L145 165 M120 110 L95 85" 
          stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>

    <!-- Accent floating geometric distortion particles -->
    <circle cx="155" cy="70" r="3" fill="#E74C3C"/>
    <circle cx="85" cy="165" r="4" fill="#E74C3C"/>
    <rect x="70" y="80" width="6" height="6" transform="rotate(45 73 83)" fill="#F39C12"/>
    <rect x="160" y="150" width="8" height="8" transform="rotate(15 164 154)" fill="#E74C3C"/>
  </g>
</svg>