<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow & Atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Central Object: Factory representing Economic Slump (不景气) -->
  <g transform="translate(0, 5)">
    <!-- Factory Building Base -->
    <path d="M60 145 L60 110 L95 110 L95 125 L145 125 L145 110 L180 110 L180 145 Z" fill="#2F3640" stroke="#485460" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Factory Main Body -->
    <rect x="65" y="145" width="110" height="35" fill="#23272F" stroke="#485460" stroke-width="2"/>

    <!-- Windows (Dim/Dark) -->
    <rect x="75" y="155" width="12" height="15" rx="2" fill="#3A3F4B"/>
    <rect x="95" y="155" width="12" height="15" rx="2" fill="#3A3F4B"/>
    <rect x="115" y="155" width="12" height="15" rx="2" fill="#3A3F4B"/>
    <rect x="135" y="155" width="12" height="15" rx="2" fill="#3A3F4B"/>
    <rect x="155" y="155" width="12" height="15" rx="2" fill="#3A3F4B"/>

    <!-- Factory Gate / Door -->
    <path d="M105 180 L105 160 L135 160 L135 180 Z" fill="#1E222A"/>

    <!-- Smokestacks -->
    <rect x="80" y="75" width="12" height="35" fill="#2F3640" stroke="#485460" stroke-width="2"/>
    <rect x="148" y="75" width="12" height="35" fill="#2F3640" stroke="#485460" stroke-width="2"/>

    <!-- Inactive, thin, dissipating smoke (Representing reduced output / stoppage) -->
    <path d="M86 72 C80 62 92 52 86 42 C82 36 88 30 86 24" fill="none" stroke="#57606F" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M154 72 C160 62 148 52 154 42 C158 36 152 30 154 24" fill="none" stroke="#57606F" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Large Downtrend Arrow Overlay (Focus Accent) -->
    <g transform="translate(120, 115)">
      <!-- Drop Shadow for Arrow -->
      <path d="M0 -35 L20 -15 L9 -15 L9 25 L-9 25 L-9 -15 L-20 -15 Z" fill="#000000" opacity="0.3" transform="translate(0, 4)"/>
      <!-- Main Amber/Orange Downtrend Arrow -->
      <path d="M0 -35 L20 -15 L9 -15 L9 25 L-9 25 L-9 -15 L-20 -15 Z" fill="#FF6B6B"/>
    </g>
  </g>

  <!-- Base Ground Line -->
  <path d="M50 185 L190 185" stroke="#485460" stroke-width="3" stroke-linecap="round"/>
</svg>