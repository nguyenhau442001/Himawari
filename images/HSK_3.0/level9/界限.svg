<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" fill-opacity="0.8"/>
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Floor/Perspective -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b" fill-opacity="0.5"/>

  <!-- The Boundary Line (界限) -->
  <rect x="118" y="60" width="4" height="160" fill="#fbbf24" filter="url(#glow)"/>
  <ellipse cx="120" cy="220" rx="40" ry="10" fill="#fbbf24" fill-opacity="0.1"/>

  <!-- Right Side: The "Right" (是) - Helping Scenario -->
  <g transform="translate(140, 80)">
    <!-- Sun/Light Symbolism -->
    <circle cx="60" cy="0" r="15" fill="#f59e0b" fill-opacity="0.2"/>
    <circle cx="60" cy="0" r="8" fill="#fbbf24"/>
    
    <!-- Character A (Helper) -->
    <path d="M40 70 Q45 40 50 70 L55 100 L35 100 Z" fill="#10b981"/>
    <circle cx="45" cy="45" r="8" fill="#ffedd5"/>
    <!-- Character B (Being Helped) -->
    <path d="M15 85 Q20 75 25 85 L30 100 L10 100 Z" fill="#38bdf8"/>
    <circle cx="20" cy="75" r="6" fill="#ffedd5"/>
    <!-- Action: Hand reaching out -->
    <path d="M38 65 L25 78" stroke="#ffedd5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Left Side: The "Wrong" (非) - Dishonest Scenario -->
  <g transform="translate(20, 80)">
    <!-- Shadow/Cloud Symbolism -->
    <path d="M20 0 Q30 -10 40 0 Q50 10 30 15 Q10 10 20 0" fill="#64748b" fill-opacity="0.3"/>
    
    <!-- Character C (Sneaky) -->
    <path d="M40 70 Q35 40 30 70 L25 100 L45 100 Z" fill="#475569"/>
    <circle cx="35" cy="45" r="8" fill="#d1d5db"/>
    <!-- Character D (Unaware victim) -->
    <path d="M65 70 Q70 40 75 70 L80 100 L60 100 Z" fill="#1e293b" stroke="#334155"/>
    <circle cx="70" cy="45" r="8" fill="#94a3b8"/>
    <!-- Action: Taking something secretly -->
    <path d="M42 65 L60 68" stroke="#d1d5db" stroke-width="2" stroke-dasharray="2,1"/>
    <circle cx="62" cy="68" r="3" fill="#fb923c"/>
  </g>

  <!-- Main Subject: The Observer (Distinguishing the Boundary) -->
  <g transform="translate(100, 150)">
    <!-- Mentor/Teacher Figure -->
    <path d="M10 30 Q20 0 30 30 L35 80 L5 80 Z" fill="#f1f5f9"/>
    <circle cx="20" cy="5" r="10" fill="#ffedd5"/>
    <!-- Pointing Arm -->
    <path d="M25 35 L20 55 L20 65" fill="none" stroke="#ffedd5" stroke-width="3" stroke-linecap="round"/>
    <!-- The hand pointing exactly at the line -->
    <path d="M20 65 L20 68" stroke="#ffedd5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Foreground Student -->
  <g transform="translate(70, 170)">
    <path d="M10 35 Q15 15 20 35 L25 65 L5 65 Z" fill="#ec4899"/>
    <circle cx="15" cy="20" r="8" fill="#fed7aa"/>
    <!-- Head tilted looking at the line -->
    <path d="M18 20 Q22 20 22 25" fill="none" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Decorative elements to ground the scene -->
  <rect x="20" y="220" width="200" height="1" fill="#334155"/>
  <circle cx="210" cy="40" r="30" fill="#38bdf8" fill-opacity="0.05"/>
  <circle cx="30" cy="50" r="20" fill="#ec4899" fill-opacity="0.05"/>
</svg>