<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Streetlamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Cloak Gradient -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- STREET CORNER ENVIRONMENT -->
  <!-- Brick Wall 1 (Left) -->
  <path d="M0 0 H90 V200 H0 Z" fill="#1b263b"/>
  <!-- Brick lines & texture -->
  <g stroke="#26354a" stroke-width="1" opacity="0.6">
    <line x1="0" y1="40" x2="90" y2="40"/>
    <line x1="0" y1="80" x2="90" y2="80"/>
    <line x1="0" y1="120" x2="90" y2="120"/>
    <line x1="0" y1="160" x2="90" y2="160"/>
    <line x1="45" y1="0" x2="45" y2="40"/>
    <line x1="20" y1="40" x2="20" y2="80"/>
    <line x1="70" y1="40" x2="70" y2="80"/>
    <line x1="45" y1="80" x2="45" y2="120"/>
    <line x1="20" y1="120" x2="20" y2="160"/>
    <line x1="70" y1="120" x2="70" y2="160"/>
  </g>

  <!-- Brick Wall 2 (Right - Receding) -->
  <path d="M90 0 H240 V180 H90 Z" fill="#141c2e"/>
  <g stroke="#1d283c" stroke-width="1" opacity="0.5">
    <line x1="90" y1="40" x2="240" y2="40"/>
    <line x1="90" y1="80" x2="240" y2="80"/>
    <line x1="90" y1="120" x2="240" y2="120"/>
    <line x1="90" y1="160" x2="240" y2="160"/>
  </g>

  <!-- Corner Shadow for Depth -->
  <path d="M85 0 L95 0 L95 200 L85 180 Z" fill="#090d16" opacity="0.6"/>

  <!-- Street Pavement / Ground -->
  <path d="M0 180 L240 160 V240 H0 Z" fill="#0f172a"/>
  <!-- Pavement Slab Lines -->
  <path d="M40 190 L120 175 M100 215 L220 185 M150 240 L240 210" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- STREET LAMP & LIGHTING -->
  <!-- Lamp Pole -->
  <path d="M200 0 V150" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <!-- Lamp Fixture -->
  <path d="M185 20 H215 L220 35 H180 Z" fill="#334155"/>
  <path d="M190 35 H210 V45 H190 Z" fill="#fbbf24"/>
  <!-- Light Beam / Glow Overlay -->
  <circle cx="200" cy="50" r="100" fill="url(#lampGlow)"/>
  <polygon points="200,45 100,220 220,220" fill="#fbbf24" opacity="0.06"/>

  <!-- THE BEGGAR (乞丐) -->
  <g transform="translate(115, 135)">
    <!-- Shadow beneath character -->
    <ellipse cx="5" cy="55" rx="35" ry="12" fill="#05080f" opacity="0.7"/>

    <!-- Slouched Body / Layered Cloak -->
    <path d="M -25 35 Q -30 10 -15 0 Q 5 -10 20 10 Q 30 30 35 48 Q -5 52 -25 35 Z" fill="url(#cloakGrad)"/>
    
    <!-- Patch details on cloak for realistic context -->
    <path d="M -15 20 L -5 15 L -2 30 L -18 32 Z" fill="#475569" rx="2"/>

    <!-- Head & Posture (Head bowed forward) -->
    <circle cx="-5" cy="-12" r="14" fill="#d8b4fe"/> <!-- Hood opening / face area -->
    <path d="M -18 -18 C -18 -28 8 -28 12 -12 C 12 -5 5 0 -5 5 C -12 5 -18 -5 -18 -18 Z" fill="#475569"/> <!-- Hood -->

    <!-- Closed peaceful/humble eyes -->
    <path d="M -10 -12 Q -7 -9 -4 -12" stroke="#581c87" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Reaching Arm holding Alms Bowl -->
    <!-- Upper Arm & Sleeve -->
    <path d="M 10 15 Q 25 18 35 25" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="38" cy="27" r="4" fill="#fcd34d"/>

    <!-- Alms Bowl (Prop) -->
    <path d="M 28 32 H 48 L 45 46 H 31 Z" fill="#94a3b8"/>
    <!-- Bowl rim & inside -->
    <ellipse cx="38" cy="32" rx="10" ry="3" fill="#cbd5e1"/>
    <ellipse cx="38" cy="33" rx="8" ry="2" fill="#64748b"/>
    <!-- Small coin inside bowl -->
    <circle cx="36" cy="33" r="2" fill="#fbbf24"/>
    <circle cx="41" cy="34" r="1.5" fill="#fbbf24"/>

    <!-- Second supporting arm resting on knee -->
    <path d="M -15 25 Q -5 35 5 45" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="8" cy="47" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- ENVIRONMENT DETAILS (Real-world context props) -->
  <!-- Loose discarded paper / leaf near corner -->
  <path d="M70 190 Q75 185 85 188 Q90 192 82 196 Z" fill="#f1f5f9" opacity="0.8"/>
  <path d="M120 210 Q128 208 132 214 Q125 218 118 213 Z" fill="#475569" opacity="0.5"/>

  <!-- Atmospheric Dust / Light Particles -->
  <circle cx="160" cy="100" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="130" cy="80" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="180" cy="130" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="110" cy="120" r="1" fill="#fbbf24" opacity="0.7"/>

  <!-- Foreground Vignette / Framing -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.3"/>
</svg>