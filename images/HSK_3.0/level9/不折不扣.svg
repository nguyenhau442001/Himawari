<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 25)">
    <!-- Document background sheet (representing the exact standard/directive) -->
    <rect x="25" y="10" width="130" height="150" rx="6" fill="#282D3D" stroke="#3A4256" stroke-width="2"/>
    <rect x="40" y="25" width="60" height="8" rx="4" fill="#4E5D78"/>
    <rect x="40" y="42" width="100" height="5" rx="2.5" fill="#3A4256"/>
    <rect x="40" y="55" width="85" height="5" rx="2.5" fill="#3A4256"/>
    <rect x="40" y="68" width="95" height="5" rx="2.5" fill="#3A4256"/>

    <!-- Perfectly aligned physical stamping device (The physical object representing strict execution) -->
    <!-- Handle -->
    <path d="M75 105 L105 105 L115 130 L65 130 Z" fill="#D97706"/>
    <rect x="80" y="85" width="20" height="20" rx="4" fill="#F59E0B"/>
    <circle cx="90" cy="80" r="12" fill="#D97706"/>

    <!-- Metallic Base of Stamp -->
    <rect x="55" y="130" width="70" height="12" rx="2" fill="#94A3B8"/>

    <!-- Glowing precise execution stamp imprint/seal at the bottom -->
    <circle cx="130" cy="120" r="28" fill="#1A1D24" stroke="#10B981" stroke-width="4"/>
    <!-- Checkmark inside seal -->
    <path d="M116 120 L125 129 L147 107" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sharp alignment grid/crosshairs indicating zero discrepancy -->
    <path d="M15 100 L35 100" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 2"/>
    <path d="M145 30 L165 30" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="15" cy="100" r="3" fill="#F59E0B"/>
    <circle cx="165" cy="30" r="3" fill="#F59E0B"/>
  </g>

  <!-- Ground shadow / base accent -->
  <ellipse cx="120" cy="205" rx="70" ry="6" fill="#111318"/>
</svg>