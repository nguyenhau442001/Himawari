<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background glow for source point -->
  <circle cx="120" cy="70" r="40" fill="#FFB703" opacity="0.1" filter="blur(10px)"/>

  <!-- Snowy peaks representing Qinghai-Tibet Plateau (青藏高原雪山之巅) -->
  <path d="M 80,100 L 120,40 L 160,100 Z" fill="#2E3542"/>
  <path d="M 100,70 L 120,40 L 140,70 L 130,65 L 120,72 Z" fill="#FFFFFF" opacity="0.9"/>
  
  <path d="M 40,120 L 80,70 L 120,120 Z" fill="#232833"/>
  <path d="M 65,90 L 80,70 L 95,90 L 87,85 L 80,92 Z" fill="#FFFFFF" opacity="0.7"/>

  <path d="M 120,120 L 160,70 L 200,120 Z" fill="#232833"/>
  <path d="M 145,90 L 160,70 L 175,90 L 167,85 L 160,92 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- Dynamic water source / spring (发源 - Origin / Source) -->
  <!-- Motion lines / energy springing forth -->
  <path d="M 112,55 C 112,45 120,40 120,40 C 120,40 128,45 128,55" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 106,62 C 104,52 112,46 112,46" stroke="#FFB703" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 134,62 C 136,52 128,46 128,46" stroke="#FFB703" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Diverging majestic rivers (Yangtze & Yellow River representation) -->
  <!-- Left River (Yellow River curve) -->
  <path d="M 115,75 Q 90,90 70,130 T 40,200" stroke="#F77F00" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 115,75 Q 90,90 70,130 T 40,200" stroke="#FFB703" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Right River (Yangtze curve) -->
  <path d="M 125,75 Q 150,90 170,130 T 200,200" stroke="#00B4D8" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 125,75 Q 150,90 170,130 T 200,200" stroke="#90E0EF" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Glowing origin point / spring burst -->
  <circle cx="120" cy="73" r="7" fill="#FFB703"/>
  <circle cx="120" cy="73" r="12" stroke="#FFB703" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Water droplets / active flow indicators -->
  <circle cx="95" cy="100" r="3" fill="#FFB703"/>
  <circle cx="145" cy="100" r="3" fill="#00B4D8"/>
  <circle cx="65" cy="150" r="2.5" fill="#F77F00"/>
  <circle cx="175" cy="150" r="2.5" fill="#90E0EF"/>

</svg>