<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="moodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Office / Room Interior context) -->
  <!-- Window showing night/evening -->
  <path d="M170 30 H210 V110 H170 Z" fill="#090d16" stroke="#475569" stroke-width="2" rx="4"/>
  <path d="M190 30 V110" stroke="#475569" stroke-width="1.5" />
  <path d="M170 70 H210" stroke="#475569" stroke-width="1.5" />
  <!-- City lights through window -->
  <circle cx="180" cy="50" r="1.5" fill="#f59e0b" />
  <circle cx="200" cy="65" r="1.5" fill="#38bdf8" />
  <circle cx="185" cy="90" r="1.5" fill="#ec4899" />

  <!-- Bookshelf / props in background -->
  <rect x="20" y="45" width="35" height="8" rx="2" fill="#334155" />
  <rect x="25" y="30" width="8" height="15" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="35" y="27" width="10" height="18" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="20" y="85" width="40" height="6" rx="2" fill="#334155" />
  <rect x="28" y="70" width="7" height="15" rx="1" fill="#ef4444" opacity="0.7"/>

  <!-- Ambient mood glow behind the character -->
  <circle cx="120" cy="120" r="80" fill="url(#moodGlow)" />

  <!-- Floating, dramatic emotional wave chart representing "起伏" (ups and downs) -->
  <!-- Background grid lines for the chart -->
  <path d="M50 110 H190 M50 140 H190 M50 80 H190" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.5"/>
  
  <!-- The dramatic fluctuating emotional wave line -->
  <path d="M 50 110 Q 70 50, 90 120 T 130 60 T 170 140 T 190 90" fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Peak and valley glowing nodes -->
  <circle cx="90" cy="120" r="4" fill="#ef4444" />
  <circle cx="90" cy="120" r="8" fill="#ef4444" opacity="0.3" />
  
  <circle cx="130" cy="60" r="5" fill="#f59e0b" />
  <circle cx="130" cy="60" r="10" fill="#f59e0b" opacity="0.3" />

  <circle cx="170" cy="140" r="4" fill="#38bdf8" />
  <circle cx="170" cy="140" r="8" fill="#38bdf8" opacity="0.3" />

  <!-- Desk Surface -->
  <path d="M20 185 H220 V205 C220 210, 215 215, 210 215 H30 C25 215, 20 210, 20 205 Z" fill="url(#deskGrad)" />
  <rect x="20" y="185" width="200" height="4" fill="#64748b" />

  <!-- Desk Props -->
  <!-- Laptop open -->
  <path d="M75 185 L65 160 H105 L95 185 Z" fill="#64748b" />
  <path d="M63 185 H107 V188 H63 Z" fill="#94a3b8" rx="1"/>
  <path d="M68 163 H102 V182 H68 Z" fill="#0f172a" />
  <!-- Mini graph glowing on laptop screen -->
  <path d="M 72 178 Q 78 168, 85 175 T 98 166" fill="none" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Coffee mug with steam -->
  <rect x="140" y="168" width="14" height="17" rx="3" fill="#f8fafc" />
  <path d="M154 173 C158 173, 158 181, 154 181" fill="none" stroke="#f8fafc" stroke-width="2" />
  <path d="M144 162 Q146 156, 143 150" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M149 161 Q151 155, 148 149" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Character: Sitting at desk, head in hands experiencing emotional ups and downs -->
  <!-- Body/Torso in chair -->
  <path d="M100 160 C100 140, 110 130, 120 130 C130 130, 140 140, 140 160 Z" fill="#3b82f6" />
  <!-- Collar -->
  <path d="M112 133 L120 143 L128 133 Z" fill="#f8fafc" />

  <!-- Arms resting/holding head -->
  <!-- Left arm -->
  <path d="M105 145 C95 140, 90 155, 95 175" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
  <!-- Right arm -->
  <path d="M135 145 C145 140, 150 155, 145 175" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="114" y="123" width="12" height="12" fill="#fed7aa" />

  <!-- Head (Expressive, stressed/overwhelmed expression showing emotional fluctuation) -->
  <circle cx="120" cy="112" r="18" fill="#fed7aa" />
  
  <!-- Hair (Messy/stylish dark hair) -->
  <path d="M102 112 C102 98, 110 92, 120 92 C130 92, 138 98, 138 112 C138 102, 132 94, 120 94 C108 94, 102 102, 102 112 Z" fill="#1e293b" />
  <path d="M103 108 L98 103" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M137 108 L142 102" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Facial Expression: Tensed eyes closed, expressive eyebrows showing inner turmoil/ups-and-downs -->
  <!-- Eyebrows angled sharply down -->
  <path d="M108 106 L115 109" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M125 109 L132 106" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Closed eyes (arched lines) -->
  <path d="M109 113 Q112 111, 115 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M125 113 Q128 111, 131 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Tensed mouth / sighing -->
  <path d="M116 122 Q120 119, 124 122" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Sweat drop (showing anxiety/mood swing stress) -->
  <path d="M134 102 C134 102, 138 107, 138 110 C138 112.2, 136.2 114, 134 114 C131.8 114, 130 112.2, 130 110 C130 107, 134 102, 134 102 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Foregrounds / Accent sparkles (symbolizing mental stress/dynamic energy state) -->
  <circle cx="75" cy="75" r="2" fill="#fbbf24" />
  <path d="M75 70 V80 M70 75 H80" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>
  
  <circle cx="165" cy="70" r="2" fill="#ec4899" />
  <path d="M165 65 V75 M160 70 H170" stroke="#ec4899" stroke-width="1" opacity="0.7"/>
</svg>