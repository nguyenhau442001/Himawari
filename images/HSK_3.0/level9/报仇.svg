<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Torch/Glow Gradient -->
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Cloak Gradient -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="bladeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>

    <!-- Dramatic Window / Temple Background Structure -->
    <path d="M70 40 L170 40 L190 190 L50 190 Z" fill="#090d16" opacity="0.7"/>
    <!-- Stone Window Arch & Pillars -->
    <path d="M90 40 L150 40 L150 140 C150 160 130 170 120 170 C110 170 90 160 90 140 Z" fill="#1e293b" opacity="0.6"/>
    <rect x="85" y="40" width="8" height="150" fill="#334155" opacity="0.4"/>
    <rect x="147" y="40" width="8" height="150" fill="#334155" opacity="0.4"/>

    <!-- Moonlight / Atmospheric Beam -->
    <path d="M100 0 L140 0 L170 240 L70 240 Z" fill="#38bdf8" opacity="0.04"/>

    <!-- Ambient Torch on Wall -->
    <circle cx="120" cy="85" r="45" fill="url(#torchGlow)"/>
    <path d="M117 80 L123 80 L122 95 L118 95 Z" fill="#b45309"/>
    <path d="M120 73 C122 75 123 78 120 81 C117 78 118 75 120 73 Z" fill="#fbbf24"/>

    <!-- MEMORIAL ALTAR (Father's context) -->
    <!-- Altar Table -->
    <rect x="75" y="145" width="90" height="8" rx="2" fill="#475569"/>
    <rect x="85" y="153" width="70" height="30" fill="#334155"/>
    <rect x="80" y="183" width="80" height="6" rx="1" fill="#475569"/>

    <!-- Ancestral Plaque / Memorial Tablet -->
    <rect x="105" y="105" width="30" height="38" rx="3" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <!-- Abstract Memorial Line Art (non-text representation of inscription) -->
    <line x1="113" y1="114" x2="127" y2="114" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="120" y1="118" x2="120" y2="135" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="120" cy="111" r="1.5" fill="#d97706"/>

    <!-- Incense Burner & Glowing Sticks -->
    <path d="M112 142 L128 142 L126 148 L114 148 Z" fill="#94a3b8"/>
    <!-- Smoke trails -->
    <path d="M118 141 C116 130 122 125 119 115" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
    <path d="M122 141 C124 132 118 127 121 118" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>

    <!-- FOREGROUND: The Son Making a Vow / Seeking Vengeance -->
    <!-- Main Character Figure (Kneeling/Crouching intensely) -->
    <!-- Shadow beneath -->
    <ellipse cx="120" cy="225" rx="45" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Lower Body / Kneeling Cloak -->
    <path d="M95 195 C90 215 95 222 110 224 L130 224 C145 222 150 215 145 195 L135 175 L105 175 Z" fill="url(#cloakGrad)"/>

    <!-- Torso leaning forward in determination -->
    <path d="M102 145 L138 145 C142 165 138 185 120 185 C102 185 98 165 102 145 Z" fill="#334155"/>

    <!-- Scarf / Collar Accent (Warm emotional pop) -->
    <path d="M104 144 C120 152 136 144 136 144 L139 154 C120 160 101 154 104 144 Z" fill="#d97706"/>

    <!-- Head / Face Profile (Determined expression) -->
    <circle cx="120" cy="125" r="14" fill="#cbd5e1"/>
    <!-- Hair -->
    <path d="M106 123 C106 112 114 110 123 111 C132 112 134 118 134 125 L132 121 C126 115 114 116 106 123 Z" fill="#0f172a"/>
    <!-- Determination Eyebrow & Eye (Fierce angle) -->
    <path d="M115 124 L125 121" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Determined Mouth Line -->
    <path d="M123 131 L128 132" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms & Hands Clutched in Vow / Holding Heirloom Sword -->
    <!-- Left arm holding sword hilt upright near chest -->
    <path d="M110 150 L95 170 L102 173 L116 155 Z" fill="#1e293b"/>
    
    <!-- Sword/Blade held vertically - symbolizing the oath -->
    <circle cx="120" cy="155" r="18" fill="url(#bladeGlow)"/>
    <!-- Hilt -->
    <rect x="118" y="130" width="4" height="25" rx="1" fill="#94a3b8"/>
    <rect x="112" y="145" width="16" height="3" rx="1" fill="#d97706"/>
    <!-- Blade tip pointing up -->
    <path d="M119 65 L121 65 L121 130 L119 130 Z" fill="#e2e8f0"/>
    <path d="M120 62 L122 66 L118 66 Z" fill="#38bdf8"/> <!-- Glowing tip accent -->

    <!-- Right Hand clutched into a fist of resolve -->
    <path d="M128 152 C135 152 142 160 138 168 C135 172 130 170 128 165 Z" fill="#cbd5e1"/>
    <!-- Fist overlay -->
    <circle cx="132" cy="162" r="6" fill="#94a3b8"/>

    <!-- Atmospheric Sparks / Emotional Intensity Particles -->
    <circle cx="95" cy="100" r="1.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="150" cy="115" r="1" fill="#fbbf24" opacity="0.6"/>
    <circle cx="105" cy="80" r="2" fill="#38bdf8" opacity="0.5"/>
    <circle cx="140" cy="90" r="1" fill="#38bdf8" opacity="0.7"/>
    <circle cx="75" cy="140" r="1.5" fill="#fbbf24" opacity="0.4"/>
    <circle cx="165" cy="150" r="2" fill="#fbbf24" opacity="0.5"/>

    <!-- Subtle Vignette Frame Border -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="6" opacity="0.8"/>
  </g>
</svg>