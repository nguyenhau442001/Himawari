<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground path representing a starting line/track -->
  <path d="M40 180 L200 180" stroke="#2C323D" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Starting blocks / Footprint starting point icon (Physical Object representing "Starting Point") -->
  <!-- Left Starting Block -->
  <g transform="translate(85, 155)">
    <!-- Base plate angled -->
    <path d="M0 10 L30 10 L35 20 L-5 20 Z" fill="#3A4252"/>
    <!-- Angled pedal -->
    <path d="M5 -5 L25 -5 L30 10 L0 10 Z" fill="#4E5D6C"/>
    <!-- Grip lines -->
    <line x1="10" y1="0" x2="20" y2="0" stroke="#6C7A89" stroke-width="2"/>
    <line x1="8" y1="4" x2="22" y2="4" stroke="#6C7A89" stroke-width="2"/>
  </g>

  <!-- Right Starting Block -->
  <g transform="translate(125, 150)">
    <path d="M0 15 L35 15 L40 25 L-5 25 Z" fill="#3A4252"/>
    <path d="M5 0 L30 0 L35 15 L0 15 Z" fill="#4E5D6C"/>
    <line x1="12" y1="5" x2="23" y2="5" stroke="#6C7A89" stroke-width="2"/>
    <line x1="10" y1="9" x2="25" y2="9" stroke="#6C7A89" stroke-width="2"/>
  </g>

  <!-- Central Starting Marker / Flag Pin pointing to the exact point -->
  <g transform="translate(120, 70)">
    <!-- Shadow on ground -->
    <ellipse cx="0" cy="110" rx="12" ry="4" fill="#111318"/>
    
    <!-- Vertical pole -->
    <line x1="0" y1="20" x2="0" y2="110" stroke="#8A99AD" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Glowing Accent Pin Flag (Orange/Gold focus) -->
    <path d="M0 20 L35 35 L0 50 Z" fill="#FF9F43"/>
    
    <!-- Base marker ring -->
    <ellipse cx="0" cy="110" rx="6" ry="3" fill="#FF9F43"/>
  </g>

  <!-- Spark / Focus bursts indicating origin/beginning -->
  <circle cx="120" cy="70" r="3" fill="#FFEAA7"/>
  <path d="M120 50 L120 40" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 65 L92 60" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
  <path d="M140 65 L148 60" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>

</svg>