<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Hologram Grid Pattern -->
    <pattern id="holo-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>

    <!-- Glow Filter for Hologram & Missile Tip -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- UI Panel Gradient -->
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Missile Body Gradient -->
    <linearGradient id="missile-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Tech Elements & Window showing Launch Control Center vibe -->
  <g opacity="0.4">
    <!-- Server racks in background -->
    <rect x="15" y="40" width="30" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="20" y="50" width="20" height="6" rx="2" fill="#38bdf8" opacity="0.6" />
    <rect x="20" y="62" width="20" height="6" rx="2" fill="#10b981" opacity="0.6" />
    <rect x="20" y="90" width="20" height="20" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5" />
    
    <!-- Control room screens -->
    <path d="M190 40 L225 50 L225 110 L190 100 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <path d="M195 55 L220 62 L220 95 L195 88 Z" fill="#0f172a" />
    <polyline points="198,75 205,68 212,80 218,72" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Floor and Workspace Desk -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 10 190 L 230 190 L 210 165 L 30 165 Z" fill="#334155" />
  <path d="M 20 190 L 220 190 L 220 193 L 20 193 Z" fill="#1e293b" />
  <!-- Desk LED accent -->
  <line x1="35" y1="167" x2="205" y2="167" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Holographic Projector Base on Desk -->
  <path d="M 95 180 L 145 180 L 135 165 L 105 165 Z" fill="#475569" />
  <ellipse cx="120" cy="165" rx="15" ry="4" fill="#38bdf8" filter="url(#glow)" />

  <!-- HOLOGRAPHIC PROJECTION AREA (The Core Illustration of the Missile) -->
  <g>
    <!-- Hologram Cone Grids -->
    <path d="M 120 165 L 70 60 L 170 60 Z" fill="url(#holo-grid)" opacity="0.5" />
    <line x1="120" y1="165" x2="70" y2="60" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.6" />
    <line x1="120" y1="165" x2="170" y2="60" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.6" />
    
    <!-- Hologram HUD Rings -->
    <ellipse cx="120" cy="140" rx="35" ry="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 2" opacity="0.5" />
    <ellipse cx="120" cy="100" rx="25" ry="7" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

    <!-- THE MISSILE (导弹) - Sleek, Advanced, Guided Design -->
    <g transform="translate(120, 110)">
      <!-- Main Fuselage -->
      <path d="M 0 -55 C 6 -50, 8 -20, 8 20 C 8 35, 6 45, 4 50 L -4 50 C -6 45, -8 35, -8 20 C -8 -20, -6 -50, 0 -55 Z" fill="url(#missile-grad)" stroke="#94a3b8" stroke-width="0.5" />
      
      <!-- Aerodynamic Cone / Guidance Nose Tip with glow -->
      <path d="M 0 -68 C 3 -60, 6 -55, 6 -50 L -6 -50 C -6 -55, -3 -60, 0 -68 Z" fill="#fbbf24" filter="url(#glow)" />
      <path d="M 0 -68 C 2 -60, 4 -55, 4 -50 L -4 -50 C -4 -55, -2 -60, 0 -68 Z" fill="#fef08a" />

      <!-- Fins (Tail and Mid-body Control Fins) -->
      <!-- Rear Stabilizing Fins -->
      <path d="M 8 30 L 22 45 L 22 48 L 8 42 Z" fill="#475569" stroke="#94a3b8" stroke-width="0.5" />
      <path d="M -8 30 L -22 45 L -22 48 L -8 42 Z" fill="#475569" stroke="#94a3b8" stroke-width="0.5" />
      <!-- Central Maneuvering Fins -->
      <path d="M 8 -5 L 18 -12 L 18 -8 L 8 -1 Z" fill="#475569" />
      <path d="M -8 -5 L -18 -12 L -18 -8 L -8 -1 Z" fill="#475569" />

      <!-- Body Panel Lines & Glowing Guidance Stripe -->
      <line x1="0" y1="-45" x2="0" y2="40" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
      <line x1="-5" y1="-20" x2="5" y2="-20" stroke="#334155" stroke-width="1" />
      <line x1="-7" y1="5" x2="7" y2="5" stroke="#334155" stroke-width="1" />

      <!-- Exhaust Plume / Thruster Glow -->
      <path d="M -4 50 L 0 65 L 4 50 Z" fill="#fb923c" filter="url(#glow)" />
      <path d="M -2 50 L 0 58 L 2 50 Z" fill="#fef08a" />
    </g>
  </g>

  <!-- Engineer Character (Right side, interacting/presenting) -->
  <g transform="translate(170, 115)">
    <!-- Body / Lab Coat / Uniform -->
    <path d="M -25 75 L 25 75 L 20 20 L -20 20 Z" fill="#0284c7" />
    <!-- Lab coat lapels -->
    <path d="M -15 20 L 0 45 L 15 20 Z" fill="#f8fafc" />
    <!-- Neck & Head -->
    <rect x="-6" y="8" width="12" height="14" fill="#fbcfe8" rx="3" />
    <circle cx="0" cy="0" r="15" fill="#fbcfe8" />
    <!-- Hair (Modern styled dark hair) -->
    <path d="M -15 -2 C -15 -12, -8 -17, 0 -17 C 8 -17, 15 -12, 16 -2 C 12 -8, -12 -8, -15 -2 Z" fill="#0f172a" />
    <!-- Friendly Expressive Face -->
    <circle cx="-5" cy="-2" r="1.5" fill="#0f172a" />
    <circle cx="5" cy="-2" r="1.5" fill="#0f172a" />
    <!-- Confident Smile -->
    <path d="M -3 4 C 0 7, 3 4, 3 4" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
    <!-- Pointing / Explaining Arm -->
    <path d="M -15 25 C -30 25, -45 35, -55 30" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Hand pointing towards hologram -->
    <circle cx="-57" cy="29" r="4" fill="#fbcfe8" />
  </g>

  <!-- Second Character / Colleague (Left side, observing with interest) -->
  <g transform="translate(65, 120)">
    <!-- Body -->
    <path d="M -20 70 L 20 70 L 15 25 L -15 25 Z" fill="#334155" />
    <!-- Neck & Head -->
    <rect x="-5" y="10" width="10" height="12" fill="#ffd6a5" rx="3" />
    <circle cx="0" cy="0" r="14" fill="#ffd6a5" />
    <!-- Hair (Bun style) -->
    <path d="M -14 -2 C -14 -12, -7 -15, 0 -15 C 7 -15, 14 -12, 14 -2 Z" fill="#b45309" />
    <circle cx="0" cy="-18" r="5" fill="#b45309" />
    <!-- Face Profile / Expression -->
    <circle cx="4" cy="-2" r="1.5" fill="#1e293b" />
    <path d="M 2 4 C 5 5, 7 3, 7 3" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" />
    <!-- Arm resting on chin / thinking pose -->
    <path d="M -10 30 C -20 30, -15 15, -5 10" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <circle cx="-3" cy="9" r="3.5" fill="#ffd6a5" />
  </g>

  <!-- Foreground UI Floating Diagnostic Elements (Tech HUD) -->
  <g opacity="0.8">
    <!-- Target Lock Reticle over Hologram Missile -->
    <path d="M 110 80 L 105 80 L 105 85" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 130 80 L 135 80 L 135 85" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 110 130 L 105 130 L 105 125" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 130 130 L 135 130 L 135 125" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="120" cy="105" r="22" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" />

    <!-- Floating UI Data Card Top Left -->
    <rect x="25" y="25" width="55" height="28" rx="4" fill="url(#panel-grad)" stroke="#38bdf8" stroke-width="0.75" />
    <circle cx="35" cy="35" r="3" fill="#10b981" />
    <line x1="43" y1="33" x2="70" y2="33" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="35" y1="43" x2="60" y2="43" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Floating UI Data Card Top Right -->
    <rect x="160" y="25" width="55" height="28" rx="4" fill="url(#panel-grad)" stroke="#38bdf8" stroke-width="0.75" />
    <circle cx="170" cy="35" r="3" fill="#fbbf24" />
    <line x1="178" y1="33" x2="205" y2="33" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="170" y1="43" x2="195" y2="43" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>