<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Window -->
  <g opacity="0.4">
    <rect x="30" y="30" width="80" height="90" rx="4" fill="#334155" opacity="0.3"/>
    <line x1="70" y1="30" x2="70" y2="120" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="30" y1="75" x2="110" y2="75" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- City Skyline outside window -->
    <path d="M 35 120 L 35 95 L 45 95 L 45 120 L 55 120 L 55 85 L 65 85 L 65 120 L 80 120 L 80 70 L 95 70 L 95 120 L 105 120 L 105 100 L 110 100 L 110 120 Z" fill="#475569"/>
  </g>

  <!-- Ambient Light Cone -->
  <polygon points="120,0 20,200 220,200" fill="url(#warmLight)"/>

  <!-- Bookshelf / Office background props -->
  <rect x="150" y="40" width="60" height="8" rx="2" fill="#475569"/>
  <rect x="160" y="24" width="12" height="16" rx="1" fill="#f43f5e"/>
  <rect x="174" y="22" width="10" height="18" rx="1" fill="#3b82f6"/>
  <rect x="186" y="26" width="14" height="14" rx="1" fill="#10b981"/>

  <rect x="150" y="80" width="60" height="8" rx="2" fill="#475569"/>
  <circle cx="170" cy="70" r="10" fill="#fbbf24"/>
  <rect x="185" y="60" width="12" height="20" rx="2" fill="#8b5cf6"/>

  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <rect x="0" y="165" width="240" height="5" fill="#475569"/>

  <!-- Laptop & Work Desk Props -->
  <g transform="translate(140, 130)">
    <!-- Laptop Base -->
    <path d="M -10 40 L 50 40 L 40 55 L -20 55 Z" fill="#94a3b8"/>
    <!-- Laptop Screen -->
    <path d="M -5 -5 L 35 -5 L 45 40 L -15 40 Z" fill="#475569"/>
    <path d="M -2 0 L 32 0 L 38 35 L -8 35 Z" fill="url(#screenGlow)"/>
    <!-- Code / Chart lines on screen -->
    <line x1="2" y1="8" x2="15" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="14" x2="25" y2="14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="20" x2="10" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="195" y="145" width="14" height="18" rx="3" fill="#f8fafc"/>
  <path d="M 209 150 C 215 150, 215 160, 209 160" fill="none" stroke="#f8fafc" stroke-width="2"/>

  <!-- THE BALANCED SCALES (Symbolizing "Cân nhắc" / Weighing options / Pros & Cons) -->
  <g transform="translate(120, 85)" filter="url(#glow)">
    <!-- Scale Stand -->
    <rect x="-3" y="15" width="6" height="55" rx="2" fill="#cbd5e1"/>
    <polygon points="-12,70 12,70 16,75 -16,75" fill="#94a3b8"/>
    <circle cx="0" cy="15" r="5" fill="#f59e0b"/>

    <!-- Scale Beam (Tilted slightly to show active weighing/decision making) -->
    <g transform="rotate(-8)">
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Left Pan (Pros / Green Accent) -->
      <line x1="-50" y1="0" x2="-50" y2="25" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M -65 25 Q -50 35 -35 25 Z" fill="#10b981" opacity="0.9"/>
      <!-- Green check icon on left pan -->
      <path d="M -53 27 L -50 30 L -45 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Right Pan (Cons / Orange Accent) -->
      <line x1="50" y1="0" x2="50" y2="20" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M 35 20 Q 50 30 65 20 Z" fill="#fb923c" opacity="0.9"/>
      <!-- Warning/Minus icon on right pan -->
      <line x1="46" y1="23" x2="54" y2="23" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- MAIN CHARACTER (Thoughtful professional leaning on desk, hand on chin) -->
  <g transform="translate(75, 95)">
    <!-- Body / Torso (Blue shirt with slate blazer) -->
    <path d="M -25 75 L 25 75 L 30 45 L 15 25 L -15 25 L -30 45 Z" fill="#3b82f6"/>
    <!-- Blazer Lapels -->
    <path d="M -15 25 L 0 50 L 15 25" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="-10" y="45" width="20" height="30" fill="#1e40af"/>

    <!-- Neck -->
    <rect x="-6" y="15" width="12" height="14" fill="#f5d0b1"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="#f5d0b1"/>

    <!-- Hair (Modern dark styling) -->
    <path d="M -17 -5 C -17 -16, -8 -20, 0 -20 C 10 -20, 18 -15, 18 -5 C 18 0, 15 5, 15 5 C 15 5, 8 -3, 0 -5 C -8 -7, -15 -2 -17 -5 Z" fill="#0f172a"/>

    <!-- Thoughtful Face Profile & Expression -->
    <!-- Eyebrow furrowed in deep thought / weighing options -->
    <path d="M -5 -6 L 4 -3" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Closed/focused eyes -->
    <path d="M -4 1 Q -1 3 3 1" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Subtle thoughtful mouth line -->
    <path d="M -2 9 Q 2 10 5 8" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hand resting thoughtfully on chin -->
    <path d="M 5 12 C 12 12, 16 5, 12 0 C 10 -2, 7 2, 5 7" fill="#f5d0b1"/>
    <!-- Arm supporting the hand -->
    <path d="M 10 12 L 25 25 L 15 45" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Atmospheric Particles / Floating Decision Sparks -->
  <circle cx="105" cy="55" r="3" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <circle cx="135" cy="45" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="90" cy="40" r="1.5" fill="#10b981" opacity="0.7"/>

</svg>