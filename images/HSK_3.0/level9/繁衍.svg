<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background Gradient for wetland glow -->
    <radialGradient id="wetlandGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#224233" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Nest Gradient -->
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A47551"/>
      <stop offset="100%" stop-color="#6E4729"/>
    </linearGradient>

    <!-- Adult Bird Gradient -->
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EA8DE"/>
      <stop offset="100%" stop-color="#2D728F"/>
    </linearGradient>

    <!-- Chick Gradient -->
    <linearGradient id="chickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C68F"/>
      <stop offset="100%" stop-color="#DDA15E"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric Glow representing the thriving wetland -->
  <circle cx="120" cy="140" r="90" fill="url(#wetlandGlow)"/>

  <!-- Reeds / Wetland Environment Background Elements -->
  <g opacity="0.3" stroke="#52B788" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="200" x2="45" y2="110"/>
    <line x1="60" y1="200" x2="58" y2="130"/>
    <line x1="190" y1="200" x2="195" y2="120"/>
    <line x1="180" y1="200" x2="175" y2="100"/>
  </g>

  <!-- Nest Structure -->
  <g id="nest">
    <!-- Outer twigs -->
    <path d="M 75 155 Q 120 180 165 155 Q 180 145 160 135 Q 120 145 80 135 Q 65 145 75 155 Z" fill="url(#nestGrad)"/>
    <!-- Nest inner bowl shadow -->
    <ellipse cx="120" cy="142" rx="35" ry="12" fill="#3D2314"/>
  </g>

  <!-- Eggs representing upcoming generation -->
  <g id="eggs">
    <ellipse cx="108" cy="140" rx="7" ry="9" fill="#E9ECEF" transform="rotate(-15 108 140)"/>
    <ellipse cx="122" cy="139" rx="7" ry="9" fill="#F8F9FA" transform="rotate(10 122 139)"/>
    <ellipse cx="134" cy="142" rx="6" ry="8" fill="#E9ECEF" transform="rotate(25 134 142)"/>
  </g>

  <!-- Newborn / Hatchling (Symbolizing offspring, '生息繁衍') -->
  <g id="chick">
    <!-- Tiny body -->
    <circle cx="122" cy="128" r="8" fill="url(#chickGrad)"/>
    <!-- Tiny head -->
    <circle cx="126" cy="118" r="6" fill="url(#chickGrad)"/>
    <!-- Tiny beak, open as if chirping -->
    <polygon points="131,117 137,118 131,120" fill="#F4A261"/>
    <!-- Tiny wing -->
    <ellipse cx="120" cy="130" rx="4" ry="3" fill="#BC6C25" transform="rotate(-20 120 130)"/>
    <!-- Closed happy eye -->
    <path d="M 125 116 Q 127 118 129 116" stroke="#4A3525" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Adult Migratory Bird (Protecting and nurturing, sleek modern vector style) -->
  <g id="adult-bird">
    <!-- Tail feathers -->
    <path d="M 65 125 L 45 115 L 60 135 Z" fill="#1D4ED8"/>
    
    <!-- Main Body -->
    <ellipse cx="90" cy="125" rx="22" ry="15" fill="url(#birdGrad)" transform="rotate(-10 90 125)"/>
    
    <!-- Wing curving protectively over the nest -->
    <path d="M 80 115 Q 100 110 115 125 Q 100 135 80 125 Z" fill="#3A86FF"/>
    
    <!-- Neck and Head -->
    <path d="M 105 118 C 115 110 115 95 125 90" stroke="url(#birdGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="127" cy="88" r="8" fill="url(#birdGrad)"/>
    
    <!-- Eye (wise, gentle) -->
    <circle cx="129" cy="87" r="1.5" fill="#1A1D24"/>
    
    <!-- Beak -->
    <polygon points="133,86 145,84 133,90" fill="#F4A261"/>
  </g>

  <!-- Glowing Focus Accent (Golden sun / spring energy above) -->
  <circle cx="120" cy="50" r="18" fill="#F4A261" opacity="0.15"/>
  <circle cx="120" cy="50" r="10" fill="#F4A261" opacity="0.25"/>
  <circle cx="120" cy="50" r="4" fill="#F4A261"/>

</svg>