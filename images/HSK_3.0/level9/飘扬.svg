<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Wind flow filter effect paths -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Atmospheric background elements: Soft distant hills/building roofline for context -->
  <path d="M0 200 L40 185 L90 195 L140 180 L190 188 L240 175 L240 240 L0 240 Z" fill="#090d16" opacity="0.6" />
  <path d="M0 215 L60 205 L120 210 L180 198 L240 208 L240 240 L0 240 Z" fill="#0f172a" />

  <!-- Wind streaks indicating air motion -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M20 70 Q 50 68, 80 72" />
    <path d="M10 95 Q 45 92, 70 98" />
    <path d="M30 130 Q 60 125, 95 132" />
    <path d="M15 160 Q 50 155, 80 162" />
  </g>

  <!-- Flagpole -->
  <rect x="70" y="30" width="6" height="180" rx="3" fill="url(#poleGrad)" />
  <!-- Pole top ball -->
  <circle cx="73" cy="28" r="5" fill="#fbbf24" />

  <!-- Waving Flag (飘扬 - Piāoyáng) -->
  <!-- Using dynamic cubic bezier curves to show cloth rippling in the wind -->
  <path d="M 76 40 
           C 100 25, 120 55, 145 38 
           C 170 21, 195 50, 220 35
           L 220 95
           C 195 110, 170 80, 145 98
           C 120 115, 100 85, 76 100
           Z" 
        fill="url(#flagGrad)" filter="url(#glow)" />

  <!-- Flag details: Star emblem on the flag -->
  <g transform="translate(100, 52) scale(0.6)" fill="#fbbf24">
    <polygon points="12,2 15,9 23,9 17,14 19,21 12,17 5,21 7,14 1,9 9,9" />
  </g>
  <g transform="translate(125, 45) scale(0.25)" fill="#fbbf24">
    <polygon points="12,2 15,9 23,9 17,14 19,21 12,17 5,21 7,14 1,9 9,9" />
  </g>
  <g transform="translate(133, 58) scale(0.25)" fill="#fbbf24">
    <polygon points="12,2 15,9 23,9 17,14 19,21 12,17 5,21 7,14 1,9 9,9" />
  </g>
  <g transform="translate(125, 72) scale(0.25)" fill="#fbbf24">
    <polygon points="12,2 15,9 23,9 17,14 19,21 12,17 5,21 7,14 1,9 9,9" />
  </g>

  <!-- Cloth fold shadow lines for depth -->
  <path d="M 120 45 C 130 55, 135 65, 145 70" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 170 40 C 180 50, 190 60, 198 68" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Character looking up admiring the flag -->
  <g transform="translate(45, 140)">
    <!-- Body / Jacket -->
    <path d="M15 40 Q25 30, 35 40 L45 75 L-5 75 Z" fill="#38bdf8" />
    <!-- Scarf blowing in the wind -->
    <path d="M12 28 Q30 25, 45 35 Q55 42, 65 38" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
    <path d="M42 34 Q55 40, 70 36" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" />
    
    <!-- Head tilted up -->
    <circle cx="20" cy="18" r="12" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M8 16 Q10 4, 22 6 Q32 8, 30 20 Q25 15, 15 15 Z" fill="#1e293b" />
    <!-- Face profile/expression (smiling, looking up) -->
    <circle cx="24" cy="18" r="1.5" fill="#475569" />
    <path d="M26 23 Q28 25, 30 23" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms pointing / holding posture -->
    <path d="M15 45 Q5 50, -2 40" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Base mount for flagpole -->
  <path d="M55 210 L91 210 L85 195 L61 195 Z" fill="#475569" />
  <rect x="53" y="210" width="40" height="6" rx="2" fill="#64748b" />

  <!-- Foreground ambient elements (falling leaves / wind particles) -->
  <circle cx="170" cy="140" r="2" fill="#fbbf24" opacity="0.8" />
  <path d="M190 120 Q193 123, 196 120" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.7" />
  <circle cx="210" cy="170" r="1.5" fill="#38bdf8" opacity="0.6" />
  <path d="M100 150 Q104 153, 108 149" stroke="#f43f5e" stroke-width="1.5" fill="none" opacity="0.8" />
</svg>