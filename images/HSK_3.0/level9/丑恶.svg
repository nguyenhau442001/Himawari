<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Office Surface Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Spotlight/Glow Effect for dramatic contrast -->
    <radialGradient id="dramaticGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warning / Ugly Behavior Spotlight (Amber/Red contrast) -->
    <radialGradient id="warningGlow" cx="0.75" cy="0.45" r="0.35">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow & lighting -->
  <rect width="240" height="240" fill="url(#dramaticGlow)" />
  <rect width="240" height="240" fill="url(#warningGlow)" />

  <!-- Background Office Environment Details -->
  <!-- Windows showing a dark urban night -->
  <g opacity="0.6">
    <rect x="25" y="30" width="45" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- City silhouette in window -->
    <path d="M29 105 L29 80 L35 80 L35 105 L42 105 L42 65 L48 65 L48 105 L58 105 L58 72 L64 72 L64 105 Z" fill="#1e293b"/>
    <rect x="37" y="70" width="3" height="4" fill="#fbbf24" opacity="0.8"/>
    <rect x="51" y="80" width="3" height="4" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Wall Shelf with office props -->
  <rect x="130" y="45" width="85" height="6" rx="2" fill="#475569" />
  <!-- Folder props on shelf -->
  <rect x="145" y="25" width="8" height="20" rx="1" fill="#38bdf8" />
  <rect x="154" y="22" width="10" height="23" rx="1" fill="#f43f5e" />
  <rect x="165" y="27" width="7" height="18" rx="1" fill="#10b981" />
  <!-- Small potted plant -->
  <path d="M190 45 L195 35 L205 35 L210 45 Z" fill="#cbd5e1"/>
  <path d="M200 35 C195 25 185 28 190 20 C195 25 205 20 200 35 Z" fill="#10b981"/>
  <path d="M200 35 C205 23 215 26 210 18 C205 25 195 20 200 35 Z" fill="#34d399"/>

  <!-- Main Desk Surface -->
  <path d="M 0 165 L 240 165 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk edge highlight -->
  <line x1="0" y1="165" x2="240" y2="165" stroke="#64748b" stroke-width="2" />

  <!-- Desk Props (Stapler, Coffee Mug, Notebook) -->
  <rect x="25" y="175" width="22" height="14" rx="3" fill="#64748b"/>
  <path d="M27 175 L45 175 L42 169 L30 169 Z" fill="#94a3b8"/>
  
  <!-- Coffee mug -->
  <rect x="200" y="170" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M216 175 C222 175 222 185 216 187" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <path d="M204 165 C204 162 212 162 212 165 Z" fill="#38bdf8" opacity="0.6"/> <!-- steam -->

  <!-- CHARACTER 1: The Victim / Whistleblower (Shocked, dismayed, pointing out the ugly act) -->
  <g transform="translate(15, 75)">
    <!-- Body / Torso -->
    <path d="M 45 90 L 75 90 L 80 120 L 40 120 Z" fill="#38bdf8"/>
    <!-- Collar / Tie -->
    <polygon points="52,90 68,90 60,105" fill="#f8fafc"/>
    <polygon points="57,105 63,105 60,120" fill="#0284c7"/>

    <!-- Head & Hair -->
    <circle cx="60" cy="50" r="18" fill="#fcd34d"/>
    <!-- Hair (neat bob cut) -->
    <path d="M 42 50 C 42 35 78 35 78 50 C 78 43 72 32 60 32 C 48 32 42 43 42 50 Z" fill="#334155"/>

    <!-- Shocked Facial Expression -->
    <!-- Eyes wide open -->
    <circle cx="53" cy="48" r="3" fill="#1e293b"/>
    <circle cx="67" cy="48" r="3" fill="#1e293b"/>
    <circle cx="54" cy="47" r="1" fill="#fff"/>
    <circle cx="68" cy="47" r="1" fill="#fff"/>
    <!-- Eyebrows raised high in shock -->
    <path d="M 50 42 C 53 39 56 42 56 42" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 64 42 C 67 42 70 39 70 42" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Open 'O' mouth of disbelief/condemnation -->
    <ellipse cx="60" cy="58" rx="3.5" ry="5" fill="#1e293b"/>

    <!-- Arms & Gestures (Pointing angrily/disgustedly at the document) -->
    <!-- Back arm resting -->
    <path d="M 45 95 L 30 110 L 40 115" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Pointing arm reaching forward -->
    <path d="M 75 95 C 90 95 95 105 105 105" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="107" cy="105" r="4" fill="#fcd34d"/> <!-- Hand pointing -->
  </g>

  <!-- CHARACTER 2: The Perpetrator (Sneaky, caught in the act of ugly/malicious behavior) -->
  <g transform="translate(125, 65)">
    <!-- Body / Torso (hunched, leaning defensively) -->
    <path d="M 40 100 L 75 90 L 70 130 L 35 130 Z" fill="#475569"/>
    <path d="M 40 100 L 55 100 L 50 130 L 35 130 Z" fill="#334155"/> <!-- jacket fold -->

    <!-- Head & Hair (slightly slouched, sweating) -->
    <circle cx="50" cy="40" r="18" fill="#fcd34d"/>
    <!-- Messy dark hair -->
    <path d="M 32 40 C 32 24 68 24 68 40 C 65 30 58 26 50 26 C 42 26 35 30 32 40 Z" fill="#0f172a"/>

    <!-- Guilty / Evil/Ugly Smirk & Sweat -->
    <!-- Squinting guilty eyes -->
    <path d="M 42 38 L 48 40" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 53 40 L 59 38" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Smirk / Twisted ugly smile -->
    <path d="M 44 49 C 48 54 55 50 56 46" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Sweat drop of panic -->
    <path d="M 62 30 C 62 30 65 35 65 37 C 65 39 63 40 62 40 C 61 40 59 39 59 37 C 59 35 62 30 62 30 Z" fill="#38bdf8" opacity="0.8"/>

    <!-- Arms pulling back / hiding the harmful document -->
    <path d="M 40 100 L 20 95 L 15 105" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="14" cy="107" r="4" fill="#fcd34d"/>
  </g>

  <!-- THE CENTRAL EVIDENCE / CATALYST OF THE "UGLY ACT" -->
  <!-- A torn/manipulated financial contract or malicious document on the desk -->
  <g transform="translate(90, 130)">
    <!-- Paper base -->
    <polygon points="10,10 65,0 70,55 15,65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Faked Red Stamp (Sign of corruption/fraud) -->
    <circle cx="45" cy="35" r="12" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2"/>
    <path d="M 39 35 L 51 35 M 45 29 L 45 41" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Scribbled manipulated text lines -->
    <line x1="20" y1="18" x2="40" y2="15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="26" x2="55" y2="22" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/> <!-- forged edit -->
    <line x1="25" y1="48" x2="50" y2="44" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Dramatic Warning Symbol hovering above the document to denote "丑恶" (ugly/vile behavior) -->
    <g transform="translate(30, -25)">
      <!-- Warning Triangle Badge -->
      <polygon points="12,2 24,22 0,22" fill="#ef4444" stroke="#fef2f2" stroke-width="1.5"/>
      <!-- Exclamation point -->
      <line x1="12" y1="8" x2="12" y2="15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="12" cy="18" r="1.2" fill="#ffffff"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Vignette / Framing Elements -->
  <!-- Top soft rim lighting -->
  <path d="M 0 0 L 240 0" stroke="#38bdf8" stroke-width="3" opacity="0.3"/>
</svg>