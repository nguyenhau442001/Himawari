<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="70" fill="#202530"/>

  <!-- Platter/Plate Base -->
  <ellipse cx="120" cy="155" rx="55" ry="18" fill="#2E3646"/>
  <ellipse cx="120" cy="152" rx="50" ry="15" fill="#1A1D24" stroke="#3A4456" stroke-width="2"/>

  <!-- Placed food items (Normal / Rejected) -->
  <!-- Broccoli piece (rejected off to the side with an X) -->
  <g transform="translate(85, 115)">
    <circle cx="0" cy="0" r="10" fill="#2D4A3E"/>
    <path d="M-4 6 L-4 14 L4 14 L4 6 Z" fill="#6A8570"/>
    <!-- Red X mark indicating picky rejection -->
    <path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Carrot slice (rejected) -->
  <g transform="translate(155, 115)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#3D2C20"/>
    <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Single tiny, overly scrutinized golden item in the exact center (The "perfect" choice) -->
  <g transform="translate(120, 142)">
    <!-- Glowing focus aura -->
    <circle cx="0" cy="0" r="16" fill="#FFB703" opacity="0.15"/>
    <circle cx="0" cy="0" r="12" fill="#FFB703" opacity="0.25"/>
    <!-- Selected food item (e.g., a pristine golden star-fruit/cube) -->
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#FFB703"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#FFEE93"/>
  </g>

  <!-- Magnifying Glass representing meticulous inspection / picky selection -->
  <g transform="translate(120, 105)">
    <!-- Handle -->
    <path d="M14 14 L28 28" stroke="#FFB703" stroke-width="5" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="3" fill="#E59800"/>
    
    <!-- Lens Frame -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#FFB703" stroke-width="4"/>
    <!-- Lens Glass Reflection -->
    <circle cx="0" cy="0" r="30" fill="#38BDF8" fill-opacity="0.08"/>
    <path d="M-18 -12 C-8 -22 8 -22 18 -12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Floating particles / contrast visual indicators -->
  <circle cx="65" cy="80" r="2" fill="#FF5C5C" opacity="0.6"/>
  <circle cx="175" cy="75" r="3" fill="#FF5C5C" opacity="0.6"/>
  <circle cx="140" cy="65" r="2" fill="#FFB703" opacity="0.8"/>
  <circle cx="95" cy="70" r="1.5" fill="#FFB703" opacity="0.8"/>
</svg>