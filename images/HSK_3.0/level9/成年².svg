<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Concept: "成年" (chéngnián) as "all year round / throughout the year" -->
  <!-- Visualizing a cycle of seasons represented by a stylized, grounded tree -->
  
  <!-- Tree Trunk -->
  <path d="M120 180 L120 120" stroke="#8B5E3C" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Seasonal Canopy Segments -->
  <!-- Spring/Summer (Green) -->
  <path d="M120 120 C 140 100, 160 100, 160 120 C 160 140, 140 140, 120 120" fill="#4CAF50"/>
  <!-- Autumn (Gold/Orange) -->
  <path d="M120 120 C 100 100, 80 100, 80 120 C 80 140, 100 140, 120 120" fill="#FFB300"/>
  <!-- Winter (White/Light Blue) -->
  <path d="M120 120 C 100 140, 100 160, 120 160 C 140 160, 140 140, 120 120" fill="#CFD8DC"/>
  
  <!-- Circular Time Indicator (Representing the full year cycle) -->
  <circle cx="120" cy="120" r="80" stroke="#37474F" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Sun/Moon cycle icon at the top to emphasize passage of time -->
  <circle cx="120" cy="40" r="10" fill="#FFC107"/>
</svg>