<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Subtle back wall gradient / lighting -->
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background Wall -->
    <rect width="240" height="170" fill="url(#wallGrad)"/>
    
    <!-- Warm Accent Light from center court / lamp -->
    <circle cx="120" cy="50" r="90" fill="url(#warmLight)"/>

    <!-- Courtroom Wood Paneling / Pillars in Background -->
    <rect x="30" y="30" width="12" height="120" fill="#334155" opacity="0.3"/>
    <rect x="198" y="30" width="12" height="120" fill="#334155" opacity="0.3"/>
    
    <!-- Large Scale of Justice Symbol on Back Wall (Abstractly stylized, subtle) -->
    <g transform="translate(120, 60)" opacity="0.25">
      <line x1="0" y1="-15" x2="0" y2="25" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="-25" y1="-5" x2="25" y2="-5" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <!-- Left pan -->
      <line x1="-25" y1="-5" x2="-35" y2="15" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="-25" y1="-5" x2="-15" y2="15" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M -40 15 Q -25 25 -10 15 Z" fill="#cbd5e1"/>
      <!-- Right pan -->
      <line x1="25" y1="-5" x2="15" y2="15" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="25" y1="-5" x2="35" y2="15" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 10 15 Q 25 25 40 15 Z" fill="#cbd5e1"/>
      <circle cx="0" cy="-15" r="4" fill="#cbd5e1"/>
    </g>

    <!-- Judge's Bench / Desk Platform -->
    <rect x="0" y="150" width="240" height="15" fill="#0f172a"/>
    <path d="M 40 150 L 200 150 L 215 205 L 25 205 Z" fill="url(#deskGrad)"/>
    <!-- Bench Highlight Edge -->
    <line x1="37" y1="150" x2="203" y2="150" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Bench Front Panel Details -->
    <rect x="65" y="165" width="110" height="25" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Gavel on Desk (Central Prop emphasizing "Verdict/Ruling") -->
    <g transform="translate(120, 162)">
      <!-- Gavel Block -->
      <rect x="-16" y="8" width="32" height="10" rx="2" fill="#b45309"/>
      <rect x="-13" y="12" width="26" height="3" fill="#92400e"/>
      <!-- Gavel Handle -->
      <rect x="-4" y="-12" width="8" height="22" rx="3" fill="#d97706" transform="rotate(-25)" />
      <circle cx="-13" cy="-16" r="5" fill="#b45309"/>
    </g>

    <!-- Documents / Verdict Paperwork on Desk -->
    <g transform="translate(75, 158) rotate(-8)">
      <rect x="0" y="0" width="28" height="20" rx="2" fill="#f8fafc"/>
      <line x1="4" y1="5" x2="20" y2="5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="10" x2="24" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="15" x2="14" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <!-- Official Red Seal/Stamp on Verdict Document -->
      <circle cx="21" cy="13" r="4" fill="#ef4444" opacity="0.8"/>
    </g>

    <!-- Judge Character (Center, authoritative and focused) -->
    <g transform="translate(120, 95)">
      <!-- Robe Body -->
      <path d="M -30 65 L -35 110 L 35 110 L 30 65 Z" fill="#1e293b"/>
      <path d="M -22 65 L -25 110 L 25 110 L 22 65 Z" fill="#0f172a"/>
      
      <!-- White Judge Collars / Jabot -->
      <path d="M -12 65 L 0 78 L 12 65 L 8 58 L -8 58 Z" fill="#f8fafc"/>
      <line x1="0" y1="58" x2="0" y2="78" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Shoulders & Arms -->
      <path d="M -32 68 Q -38 42 -22 38 L 22 38 Q 38 42 32 68 Z" fill="#1e293b"/>

      <!-- Neck -->
      <rect x="-6" y="32" width="12" height="12" fill="#fbcfe8"/>

      <!-- Head -->
      <circle cx="0" cy="18" r="18" fill="#fbcfe8"/>

      <!-- Facial Features - Focused/Serious Expression -->
      <path d="M -8 13 Q -4 10 0 13" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 2 13 Q 6 10 10 13" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Eyes (concentrated dots) -->
      <circle cx="-4" cy="16" r="1.5" fill="#1e293b"/>
      <circle cx="6" cy="16" r="1.5" fill="#1e293b"/>
      <!-- Mouth (firm, neutral line) -->
      <path d="M -3 24 L 3 24" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Professional Hair -->
      <path d="M -17 12 Q -18 -1 0 -2 Q 18 -1 17 12 Q 18 5 10 3 Q 0 1 -10 3 Q -18 5 -17 12 Z" fill="#334155"/>

      <!-- Traditional Judge / Legal Professional Robe Trim (Gold Accents) -->
      <path d="M -22 38 L -32 68 L -24 70 L -16 40 Z" fill="#d97706"/>
      <path d="M 22 38 L 32 68 L 24 70 L 16 40 Z" fill="#d97706"/>
    </g>

    <!-- Foreground framing elements / atmospheric particles -->
    <circle cx="45" cy="90" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="195" cy="75" r="1.5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="210" cy="120" r="2" fill="#38bdf8" opacity="0.4"/>
    <circle cx="30" cy="130" r="1.5" fill="#fbbf24" opacity="0.5"/>

    <!-- Bottom Vignette / Shadow -->
    <rect x="0" y="205" width="240" height="35" fill="#0b0f19"/>
  </g>
</svg>