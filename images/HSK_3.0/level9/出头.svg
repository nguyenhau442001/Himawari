<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E"/>
      <stop offset="100%" stop-color="#D69E2E"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D69E2E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F6E05E" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background decorative light rays (representing emerging/breakthrough) -->
  <path d="M120 160 L70 50 L170 50 Z" fill="url(#beamGrad)"/>
  <path d="M120 160 L40 70 L90 50 Z" fill="url(#beamGrad)"/>
  <path d="M120 160 L150 50 L200 70 Z" fill="url(#beamGrad)"/>

  <!-- Underground layer (Darker obstacles/strata) -->
  <g transform="translate(0, 150)">
    <!-- Earth block -->
    <rect x="30" y="10" width="180" height="40" rx="6" fill="url(#groundGrad)"/>
    
    <!-- Abstract pressure lines/strata inside earth -->
    <line x1="50" y1="20" x2="190" y2="20" stroke="#4A5568" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="60" y1="32" x2="180" y2="32" stroke="#4A5568" stroke-width="2" stroke-dasharray="4,6"/>

    <!-- Heavy Barrier Slab pressing down (representing hardship/intense competition) -->
    <rect x="45" y="0" width="150" height="14" rx="3" fill="#4A5568" filter="url(#shadow)"/>
    <rect x="55" y="3" width="130" height="3" rx="1.5" fill="#718096"/>
  </g>

  <!-- The Breakthrough Character / Head emerging (Ngóc đầu lên / Xuất đầu lộ diện) -->
  <g filter="url(#shadow)">
    <!-- Shoulders emerging from underground -->
    <path d="M 85 160 C 85 135, 100 125, 120 125 C 140 125, 155 135, 155 160 Z" fill="#2B6CB0"/>
    
    <!-- Torso clothing details -->
    <path d="M 105 160 L 120 142 L 135 160 Z" fill="#E2E8F0"/>

    <!-- Neck -->
    <rect x="111" y="112" width="18" height="18" fill="#FEEBC8"/>

    <!-- Head breaking past the surface line -->
    <circle cx="120" cy="94" r="22" fill="#FEEBC8"/>

    <!-- Confident facial expression / upward gaze -->
    <!-- Hair -->
    <path d="M 98 94 C 98 76, 142 76, 142 94 C 142 86, 134 80, 120 80 C 106 80, 98 86, 98 94 Z" fill="#2D3748"/>

    <!-- Determined Eyes (looking up/forward) -->
    <circle cx="112" cy="94" r="2.5" fill="#1A202C"/>
    <circle cx="128" cy="94" r="2.5" fill="#1A202C"/>

    <!-- Confident Smile -->
    <path d="M 115 103 Q 120 108 125 103" fill="none" stroke="#1A202C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent Elements: Golden Trophy / Achievement Star floating above -->
  <g transform="translate(120, 32)" filter="url(#shadow)">
    <!-- Glowing Star -->
    <path d="M 0 -16 L 4 -5 L 15 -5 L 6 1 L 10 12 L 0 6 L -10 12 L -6 1 L -15 -5 L -4 -5 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Side floating accent sparkles -->
  <path d="M 75 75 L 77 81 L 83 83 L 77 85 L 75 91 L 73 85 L 67 83 L 73 81 Z" fill="#F6E05E" opacity="0.8"/>
  <path d="M 165 75 L 167 81 L 173 83 L 167 85 L 165 91 L 163 85 L 157 83 L 163 81 Z" fill="#F6E05E" opacity="0.8"/>

  <!-- Surface separation line where the head breaks through -->
  <path d="M 30 150 L 90 150 M 150 150 L 210 150" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
</svg>