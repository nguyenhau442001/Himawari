<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Calm, grounded foundation (Left/Bottom side of contrast) -->
    <g transform="translate(-55, 30)">
      <!-- Steady stool/bench representing academic depth -->
      <path d="M-22,25 L22,25 L16,45 L-16,45 Z" fill="#2E3544"/>
      <rect x="-26" y="20" width="52" height="6" rx="3" fill="#4A5568"/>
      <!-- Deep blue grounded figure sitting quietly -->
      <circle cx="0" cy="-10" r="14" fill="#3B82F6"/>
      <path d="M-14,8 C-14,-2 14,-2 14,8 Z" fill="#3B82F6"/>
    </g>

    <!-- Chaotic, restless, floating state (Right side - Adjective Contrast) -->
    <g transform="translate(45, -10)">
      <!-- Unstable floating figure -->
      <g transform="translate(0, -15)">
        <animateTransform attributeName="transform" type="translate" values="0,-15; 0,-25; 0,-15" dur="3s" repeatCount="indefinite"/>
        <!-- Head -->
        <circle cx="0" cy="-10" r="13" fill="#F59E0B"/>
        <!-- Body tilting frantically -->
        <path d="M-12,8 C-12,-2 12,-2 12,8 Z" fill="#F59E0B" transform="rotate(15)"/>
        
        <!-- Motion lines / floating fragments -->
        <path d="M-25,-18 L-35,-22" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
        <path d="M25,-2 L33,2" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
        <path d="M-20,12 L-30,18" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </g>

      <!-- Fading superficial bubbles / false gold glitter -->
      <circle cx="35" cy="-35" r="4" fill="#FCD34D">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="-45" r="3" fill="#FCD34D">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="-55" r="5" fill="#F59E0B">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Unstable cracked platform below -->
      <path d="M-30,45 L30,45" stroke="#4A5568" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 4"/>
    </g>

    <!-- Dividing subtle energy split to emphasize contrast -->
    <line x1="-5" y1="-50" x2="-5" y2="60" stroke="#2E3544" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>