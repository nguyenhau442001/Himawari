<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm backlight / street glow -->
    <radialGradient id="lightGlow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Action motion effect lines -->
    <linearGradient id="motionFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="160" cy="80" r="120" fill="url(#lightGlow)" />

  <!-- Urban Environment Background Details -->
  <!-- Park railing / fence in background -->
  <g opacity="0.25" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="170" x2="220" y2="170" />
    <line x1="40" y1="150" x2="40" y2="170" />
    <line x1="90" y1="150" x2="90" y2="170" />
    <line x1="140" y1="150" x2="140" y2="170" />
    <line x1="190" y1="150" x2="190" y2="170" />
  </g>

  <!-- Distant street lamp pole -->
  <rect x="180" y="50" width="4" height="120" fill="#475569" rx="2" />
  <path d="M172,50 L192,50 L187,42 L177,42 Z" fill="#475569" />
  <circle cx="182" cy="52" r="6" fill="#fef08a" opacity="0.8" />

  <!-- Ground Line -->
  <rect x="15" y="170" width="210" height="4" rx="2" fill="#334155" />

  <!-- MOTION & FORCE LINES (Highlighting the "用力蹬" - forceful push) -->
  <g filter="url(#shadow)">
    <!-- Pedal force arcs -->
    <path d="M 125 155 Q 115 170 100 165" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    <path d="M 115 145 Q 105 160 90 155" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    
    <!-- Speed streaks behind bicycle -->
    <line x1="30" y1="150" x2="55" y2="150" stroke="url(#motionFade)" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="135" x2="45" y2="135" stroke="url(#motionFade)" stroke-width="2" stroke-linecap="round" />
    <line x1="35" y1="120" x2="50" y2="120" stroke="url(#motionFade)" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- BICYCLE -->
  <g id="bicycle" filter="url(#shadow)">
    <!-- Back Wheel -->
    <circle cx="70" cy="140" r="26" fill="none" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="70" cy="140" r="22" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="70" cy="140" r="4" fill="#94a3b8" />

    <!-- Front Wheel -->
    <circle cx="170" cy="140" r="26" fill="none" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="170" cy="140" r="22" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="170" cy="140" r="4" fill="#94a3b8" />

    <!-- Bike Frame (Modern City Bike, Teal/Emerald accent) -->
    <!-- Chainstay & Seatstay -->
    <path d="M 70 140 L 120 130 L 170 140" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Seat tube -->
    <path d="M 120 130 L 105 85" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <!-- Down tube -->
    <path d="M 120 130 L 155 85" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <!-- Top tube -->
    <path d="M 105 85 L 150 85" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <!-- Fork -->
    <path d="M 155 85 L 170 140" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />

    <!-- Handlebars -->
    <path d="M 150 85 Q 155 75 162 78" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <circle cx="163" cy="78" r="3" fill="#ef4444" />

    <!-- Saddle -->
    <path d="M 98 83 Q 107 80 114 83 Z" fill="#334155" />

    <!-- Crankset & Pedals (Crucial for "蹬") -->
    <circle cx="120" cy="130" r="8" fill="#64748b" />
    <!-- Pedal Rod pointing downward-forward for forceful push -->
    <path d="M 120 130 L 110 162" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <!-- The Pedal platform being pushed down hard -->
    <rect x="98" y="159" width="22" height="6" rx="3" fill="#fb923c" transform="rotate(-15 110 162)" />
  </g>

  <!-- CHARACTER: RIDER ACTIVELY PUSHING (蹬 - dēng) -->
  <g id="character" filter="url(#shadow)">
    <!-- Back Leg (relaxed on upper pedal position) -->
    <path d="M 108 105 L 125 120 L 122 133" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Torso (leaning forward into the acceleration) -->
    <path d="M 100 80 L 115 115 L 95 110 Z" fill="#ec4899" stroke="#ec4899" stroke-width="4" stroke-linejoin="round" />

    <!-- Backpack -->
    <path d="M 90 83 C 83 83 80 95 85 105 C 88 110 93 105 93 95 Z" fill="#f59e0b" />

    <!-- Head & Face -->
    <circle cx="118" cy="62" r="12" fill="#ffedd5" />
    <!-- Hair (Dynamic wind-blown look) -->
    <path d="M 106 60 Q 110 48 124 52 Q 130 54 130 62 Z" fill="#1e293b" />
    <!-- Determined Face expression (Eyebrow angled down) -->
    <line x1="120" y1="58" x2="126" y2="60" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="125" cy="63" r="1.5" fill="#1e293b" />
    <!-- Mouth determined -->
    <path d="M 123 68 Q 126 70 128 67" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Helmet -->
    <path d="M 107 57 C 108 48 122 48 128 55 L 128 59 L 107 59 Z" fill="#38bdf8" />
    <!-- Helmet strap -->
    <path d="M 112 59 Q 118 67 122 64" fill="none" stroke="#0284c7" stroke-width="1.5" />

    <!-- Arms (Gripping handlebars firmly) -->
    <path d="M 108 85 L 135 78 L 158 78" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hands -->
    <circle cx="158" cy="78" r="4" fill="#ffedd5" />

    <!-- FRONT LEG (THE ACTIVE "蹬" ACTION - Forcefully pushing down on the pedal) -->
    <!-- Thigh -->
    <path d="M 112 110 L 98 138" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
    <!-- Calf pushing forward/down -->
    <path d="M 98 138 L 107 160" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" />
    <!-- Foot squarely pressing down hard onto the pedal -->
    <path d="M 98 158 C 98 153 108 155 116 160 C 120 162 118 166 112 166 C 104 166 98 163 98 158 Z" fill="#1e293b" />
  </g>

  <!-- ADDITIONAL SCENE PROPS / DETAILS -->
  <!-- Falling autumn leaf (adds environmental richness and sense of motion) -->
  <path d="M 195 90 Q 200 95 195 102 Q 188 98 195 90 Z" fill="#fb923c" opacity="0.8" transform="rotate(25 195 95)" />
  <path d="M 60 75 Q 63 78 60 83 Q 56 80 60 75 Z" fill="#facc15" opacity="0.7" transform="rotate(-15 60 78)" />

</svg>