<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Document Base -->
    <path d="M-55 -75 L25 -75 L55 -45 L55 75 L-55 75 Z" fill="#2A2F3D"/>
    <path d="M25 -75 L25 -45 L55 -45 Z" fill="#3E4558"/>
    
    <!-- Document Lines / Content -->
    <rect x="-40" y="-45" width="45" height="6" rx="3" fill="#4E5970"/>
    <rect x="-40" y="-25" width="70" height="4" rx="2" fill="#3E4558"/>
    <rect x="-40" y="-13" width="60" height="4" rx="2" fill="#3E4558"/>
    <rect x="-40" y="-1" width="65" height="4" rx="2" fill="#3E4558"/>
    
    <!-- Stamp/Seal Background Area -->
    <circle cx="25" cy="40" r="22" fill="#1A1D24"/>
    
    <!-- Red Seal (Official Agreement Seal) -->
    <circle cx="25" cy="40" r="18" fill="#E65F2B"/>
    <path d="M17 40 L22 45 L34 33" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Fountain Pen Writing / Establishing -->
    <g transform="translate(15, -20) rotate(-35)">
      <!-- Pen Body -->
      <path d="M-4 -55 L4 -55 L6 -10 L0 10 L-6 -10 Z" fill="#FFB703"/>
      <!-- Pen Nib -->
      <path d="M-6 -10 L6 -10 L0 15 Z" fill="#D9A002"/>
      <path d="M0 -5 L0 10" fill="none" stroke="#B38102" stroke-width="1"/>
      <!-- Pen Cap/Top -->
      <rect x="-5" y="-65" width="10" height="10" rx="2" fill="#E5A400"/>
    </g>
  </g>
</svg>