<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Back Mountains Gradient (Furthest) -->
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Mid Mountains Gradient (Surrounding) -->
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Front Ringing Mountains (The 'Huánrào' embrace) -->
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>

    <!-- Warm Golden Glow for Village/Sunrise -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Stars & Moon -->
  <circle cx="190" cy="40" r="1.5" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="50" cy="35" r="1" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="120" cy="25" r="1.2" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="215" cy="70" r="1" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="30" cy="70" r="1.5" fill="#e2e8f0" opacity="0.3"/>

  <!-- Ambient Light from Center -->
  <circle cx="120" cy="140" r="90" fill="url(#sunGlow)"/>

  <!-- LAYER 1: Distant Mountains (Background Backdrop) -->
  <path d="M -20 160 L 30 90 L 90 140 L 160 80 L 220 130 L 260 160 Z" fill="url(#mountainBack)"/>

  <!-- LAYER 2: Mid-ground Mountains (Left & Right Flanks) -->
  <!-- Left Majestic Peak -->
  <path d="M -10 180 Q 30 110 70 180 Z" fill="url(#mountainMid)"/>
  <!-- Right Majestic Peak -->
  <path d="M 170 180 Q 210 100 250 180 Z" fill="url(#mountainMid)"/>

  <!-- LAYER 3: The Ringing Mountain Range ("Huánrào" - Wrapping around the town completely) -->
  <!-- Back arc of mountains enclosing the town -->
  <path d="M 15 160 C 40 100, 200 100, 225 160 C 240 195, 0 195, 15 160 Z" fill="url(#mountainFront)"/>

  <!-- Mountain ridges / stylized geometric facets for 2D vector depth -->
  <path d="M 120 110 L 80 165 L 120 180 Z" fill="#115e59" opacity="0.4"/>
  <path d="M 120 110 L 160 170 L 120 185 Z" fill="#0f766e" opacity="0.5"/>
  <path d="M 60 130 L 35 175 L 75 180 Z" fill="#0f766e" opacity="0.3"/>
  <path d="M 180 125 L 165 175 L 205 170 Z" fill="#115e59" opacity="0.4"/>

  <!-- Pine Trees on Mountain Slopes (Nature Context) -->
  <polygon points="45,150 40,165 50,165" fill="#065f46"/>
  <polygon points="55,145 50,160 60,160" fill="#065f46"/>
  <polygon points="185,140 180,155 190,155" fill="#065f46"/>
  <polygon points="195,145 190,160 200,160" fill="#065f46"/>

  <!-- LAYER 4: The Small Town (Nestled safely in the center valley) -->
  <!-- Valley Ground / Green Hills base -->
  <ellipse cx="120" cy="165" rx="75" ry="30" fill="#042f2e"/>
  <ellipse cx="120" cy="170" rx="65" ry="22" fill="#065f46"/>

  <!-- Winding River flowing through town -->
  <path d="M 120 150 Q 110 170 140 195 Q 150 205 130 220" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Cozy Houses / Architecture -->
  <!-- House 1 (Left) -->
  <polygon points="85,165 95,150 105,165" fill="#fb923c"/>
  <rect x="88" y="165" width="14" height="12" fill="#f8fafc"/>
  <rect x="92" y="171" width="4" height="6" fill="#1e293b"/>

  <!-- House 2 (Center - Main) -->
  <polygon points="112,158 122,142 132,158" fill="#ec4899"/>
  <rect x="115" y="158" width="14" height="14" fill="#f8fafc"/>
  <rect x="120" y="164" width="4" height="8" fill="#1e293b"/>

  <!-- House 3 (Right) -->
  <polygon points="140,163 148,150 156,163" fill="#38bdf8"/>
  <rect x="142" y="163" width="12" height="11" fill="#f8fafc"/>

  <!-- Warm glowing lights in houses -->
  <circle cx="95" cy="172" r="1.5" fill="#fbbf24"/>
  <circle cx="122" cy="168" r="1.5" fill="#fbbf24"/>
  <circle cx="148" cy="168" r="1.5" fill="#fbbf24"/>

  <!-- LAYER 5: Foreground & Human Element (Connecting learners to real-world scale) -->
  <!-- Foreground hill edge with a comfortable viewing deck / hiker context -->
  <path d="M 0 210 Q 60 195 120 205 T 240 205 L 240 240 L 0 240 Z" fill="#0f172a"/>
  
  <!-- Friendly Character Pointing/Admiring the Scenery (Right side foreground) -->
  <!-- Character Body / Jacket -->
  <path d="M 195 210 Q 190 195 200 185 L 210 190 L 215 210 Z" fill="#38bdf8"/>
  <!-- Character Head -->
  <circle cx="202" cy="177" r="7" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 195 175 Q 202 170 209 175 L 208 178 L 196 178 Z" fill="#1e293b"/>
  <!-- Arm pointing towards the town/mountains -->
  <path d="M 200 190 L 185 185" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Second Character (Companion) -->
  <path d="M 175 215 Q 172 200 182 192 L 190 195 L 194 215 Z" fill="#fb923c"/>
  <circle cx="184" cy="184" r="6.5" fill="#fcd34d"/>
  <path d="M 178 182 Q 184 177 190 182 Z" fill="#1e293b"/>

  <!-- Foreground foliage framing the shot (Bush & Flowers) -->
  <circle cx="20" cy="225" r="18" fill="#042f2e"/>
  <circle cx="35" cy="215" r="14" fill="#065f46"/>
  <circle cx="10" cy="230" r="12" fill="#0d9488" opacity="0.6"/>
  
  <!-- Tiny wildflowers -->
  <circle cx="28" cy="205" r="2" fill="#f43f5e"/>
  <circle cx="45" cy="210" r="1.5" fill="#fbbf24"/>
  <circle cx="15" cy="215" r="2" fill="#38bdf8"/>

  <!-- Subtle flying birds adding life to the sky -->
  <path d="M 70 70 Q 75 65 80 70 Q 85 65 90 70" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 155 85 Q 159 81 163 85 Q 167 81 171 85" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>