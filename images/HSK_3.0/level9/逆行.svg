<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road Surface -->
  <rect x="0" y="140" width="240" height="100" fill="#334155"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Traffic Sign Pole -->
  <rect x="40" y="60" width="4" height="100" fill="#94a3b8"/>
  <circle cx="42" cy="50" r="25" fill="#ef4444"/>
  <rect x="27" y="47" width="30" height="6" fill="#ffffff" rx="2"/>
  
  <!-- Car 1 (Correct direction) -->
  <g transform="translate(160, 150)">
    <rect x="0" y="0" width="60" height="25" fill="#38bdf8" rx="5"/>
    <circle cx="15" cy="30" r="8" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="45" cy="30" r="8" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <rect x="10" y="5" width="20" height="12" fill="#e2e8f0" rx="2"/>
  </g>
  
  <!-- Car 2 (The Wrong-Way Driver) -->
  <g transform="translate(120, 205) scale(-1, 1)">
    <rect x="0" y="0" width="60" height="25" fill="#fb923c" rx="5"/>
    <circle cx="15" cy="30" r="8" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="45" cy="30" r="8" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <rect x="10" y="5" width="20" height="12" fill="#e2e8f0" rx="2"/>
    <!-- Driver head -->
    <circle cx="40" cy="10" r="6" fill="#fde68a"/>
  </g>
  
  <!-- Motion lines for wrong way -->
  <path d="M100 215 L80 215 M90 205 L70 205" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
</svg>