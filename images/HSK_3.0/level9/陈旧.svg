<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="30" y="140" width="180" height="10" fill="#475569" rx="2"/>
  <rect x="40" y="150" width="10" height="80" fill="#334155"/>
  <rect x="190" y="150" width="10" height="80" fill="#334155"/>
  
  <!-- The "Old" Object: A dusty, clunky typewriter -->
  <g transform="translate(50, 100)">
    <rect x="0" y="20" width="80" height="40" rx="4" fill="#64748b"/>
    <rect x="10" y="10" width="60" height="10" fill="#94a3b8"/>
    <circle cx="20" cy="40" r="6" fill="#334155"/>
    <circle cx="40" cy="40" r="6" fill="#334155"/>
    <circle cx="60" cy="40" r="6" fill="#334155"/>
    <path d="M10 20 L20 5 L60 5 L70 20" fill="#475569"/>
  </g>
  
  <!-- The "New" Object: Sleek modern tablet -->
  <g transform="translate(140, 90)">
    <rect x="0" y="0" width="60" height="80" rx="6" fill="#38bdf8"/>
    <rect x="5" y="5" width="50" height="70" rx="2" fill="#0f172a"/>
    <circle cx="30" cy="72" r="3" fill="#f8fafc"/>
  </g>
  
  <!-- Character: Young person looking skeptical -->
  <g transform="translate(100, 40)">
    <!-- Head -->
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M5 15 C5 5, 35 5, 35 15 L35 20 L5 20 Z" fill="#78350f"/>
    <!-- Eyes -->
    <line x1="10" y1="15" x2="15" y2="18" stroke="#0f172a" stroke-width="2"/>
    <line x1="25" y1="18" x2="30" y2="15" stroke="#0f172a" stroke-width="2"/>
    <!-- Mouth (Skeptical) -->
    <path d="M12 28 Q20 25 28 28" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Hand pointing at typewriter -->
    <path d="M0 30 L-20 50 L-15 55 L5 35" fill="#fde68a"/>
  </g>
  
  <!-- Thought Bubble / Emphasis -->
  <path d="M160 30 Q180 20 200 30 T220 50" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <circle cx="210" cy="40" r="5" fill="#fb923c"/>
</svg>