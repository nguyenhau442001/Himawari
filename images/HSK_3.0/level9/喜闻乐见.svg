<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stage/Platform -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#343A46"/>
  
  <!-- Audience silhouettes (Representing the "everyone" aspect) -->
  <path d="M50 190 C 50 175, 60 165, 70 165 C 80 165, 90 175, 90 190 Z" fill="#4A5568"/>
  <path d="M100 190 C 100 175, 110 165, 120 165 C 130 165, 140 175, 140 190 Z" fill="#4A5568"/>
  <path d="M150 190 C 150 175, 160 165, 170 165 C 180 165, 190 175, 190 190 Z" fill="#4A5568"/>
  
  <!-- Central Performance/Program Icon (A stylized theatrical mask/puppet representing the "program" people love) -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="45" fill="#F59E0B" opacity="0.1"/>
    <path d="M-30 -10 C -30 -35, 30 -35, 30 -10 L 30 20 C 30 40, -30 40, -30 20 Z" fill="#F59E0B"/>
    <!-- Eyes -->
    <circle cx="-12" cy="-5" r="5" fill="#1A1D24"/>
    <circle cx="12" cy="-5" r="5" fill="#1A1D24"/>
    <!-- Smile -->
    <path d="M-15 10 C -5 20, 5 20, 15 10" stroke="#1A1D24" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Spotlight effect -->
  <path d="M80 0 L 160 0 L 200 240 L 40 240 Z" fill="url(#grad1)" opacity="0.05"/>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#1A1D24" />
    </linearGradient>
  </defs>
</svg>