<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#475569"/>
  <rect x="50" y="150" width="10" height="90" fill="#334155"/>
  <rect x="180" y="150" width="10" height="90" fill="#334155"/>
  
  <!-- Character 1 (The Speaker - Confident) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 35 Q20 45 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="0" y="50" width="40" height="80" rx="10" fill="#38bdf8"/>
    <path d="M-10 60 L0 80 L10 60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (The Listener - Embarrassed/Nankan) -->
  <g transform="translate(60, 90)">
    <circle cx="20" cy="20" r="20" fill="#fca5a5"/>
    <path d="M10 30 Q20 25 30 30" stroke="#7f1d1d" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#7f1d1d"/>
    <circle cx="28" cy="15" r="2" fill="#7f1d1d"/>
    <rect x="0" y="50" width="40" height="100" rx="10" fill="#ec4899"/>
    <!-- Hands covering face -->
    <circle cx="5" cy="55" r="8" fill="#fca5a5"/>
    <circle cx="35" cy="55" r="8" fill="#fca5a5"/>
  </g>
  
  <!-- Speech Bubble Indicator (Abstract lines) -->
  <path d="M100 90 L130 70" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M100 80 L130 60" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  
  <!-- Environment details -->
  <circle cx="200" cy="40" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="190" y="30" width="20" height="20" rx="4" fill="#334155"/>
</svg>