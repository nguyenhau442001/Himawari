<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: Subtle grid/context lines representing a full text/context document -->
  <g opacity="0.15" stroke="#718096" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="50" x2="210" y2="50"/>
    <line x1="30" y1="70" x2="180" y2="70"/>
    <line x1="30" y1="90" x2="200" y2="90"/>
    <line x1="30" y1="110" x2="160" y2="110"/>
    <line x1="30" y1="130" x2="190" y2="130"/>
  </g>

  <!-- Faded out context document block -->
  <rect x="40" y="40" width="160" height="100" rx="6" fill="#2D3748" opacity="0.4"/>
  <g opacity="0.3" fill="#A0AEC0">
    <rect x="55" y="55" width="40" height="6" rx="3"/>
    <rect x="100" y="55" width="60" height="6" rx="3"/>
    <rect x="55" y="75" width="80" height="6" rx="3"/>
    <rect x="140" y="75" width="40" height="6" rx="3"/>
    <rect x="55" y="95" width="50" height="6" rx="3"/>
  </g>

  <!-- Highlighted / Cut-out segment (The 'Fragment' taken out of context) -->
  <rect x="85" y="68" width="72" height="32" rx="4" fill="#1A1D24" stroke="#F6AD55" stroke-width="2.5" stroke-dasharray="4 2"/>
  <g fill="#F6AD55">
    <rect x="95" y="78" width="52" height="5" rx="2.5"/>
    <rect x="95" y="88" width="35" height="5" rx="2.5"/>
  </g>

  <!-- Dynamic Human Action: Pulling/Extracting the snippet -->
  <!-- Motion lines indicating the action of isolating/cutting -->
  <path d="M 120 120 L 120 150" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
  <path d="M 115 145 L 120 152 L 125 145" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Character hands interacting with the snippet (Verb/Action focus) -->
  <!-- Left Hand holding the context base -->
  <path d="M 60 175 C 50 175 45 165 45 155 C 45 145 55 145 60 155 Z" fill="#CBD5E0"/>
  <rect x="58" y="152" width="15" height="25" rx="4" fill="#4A5568" transform="rotate(-15 58 152)"/>

  <!-- Right Hand actively lifting/snipping the fragment out with bright accent color -->
  <path d="M 175 165 C 185 165 190 155 190 145 C 190 135 180 135 175 145 Z" fill="#CBD5E0"/>
  <rect x="160" y="135" width="18" height="25" rx="4" fill="#F6AD55" transform="rotate(25 160 135)"/>

  <!-- Scissors cutting motion overlay -->
  <g transform="translate(130, 105) scale(0.8)" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Scissor blades -->
    <line x1="0" y1="0" x2="30" y2="30"/>
    <line x1="0" y1="30" x2="30" y2="0"/>
    <!-- Pivot point -->
    <circle cx="15" cy="15" r="3" fill="#F6AD55"/>
    <!-- Handles -->
    <circle cx="-6" cy="-6" r="6"/>
    <circle cx="-6" cy="36" r="6"/>
  </g>

  <!-- Ground / Base line representing separation -->
  <path d="M 50 185 L 190 185" stroke="#4A5568" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Accent focus dots (Floating extracted isolated piece) -->
  <circle cx="120" cy="120" r="4" fill="#F6AD55"/>
</svg>