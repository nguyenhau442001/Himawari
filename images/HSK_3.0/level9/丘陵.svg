<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hillBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="hillMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="hillFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Background Stars / Atmosphere -->
  <circle cx="40" cy="30" r="1.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="110" cy="25" r="1" fill="#94a3b8" opacity="0.5" />
  <circle cx="190" cy="40" r="1.5" fill="#94a3b8" opacity="0.8" />
  <circle cx="215" cy="70" r="1" fill="#94a3b8" opacity="0.4" />

  <!-- Warm Sun / Glow at Horizon -->
  <circle cx="180" cy="110" r="28" fill="#fbbf24" opacity="0.15" filter="url(#glow)" />
  <circle cx="180" cy="110" r="14" fill="#fbbf24" opacity="0.9" />

  <!-- Background Distant Hills (丘陵 - Layer 1) -->
  <path d="M-20 160 Q 40 100, 110 130 T 260 120 L 260 220 L -20 220 Z" fill="url(#hillBack)" />

  <!-- Mid-ground Rolling Hills (丘陵 - Layer 2) -->
  <path d="M-20 170 Q 70 120, 150 150 T 260 145 L 260 220 L -20 220 Z" fill="url(#hillMid)" />

  <!-- Winding Path traversing the hilly terrain -->
  <path d="M 60 220 Q 90 190, 110 170 T 170 150 T 210 130" fill="none" stroke="url(#pathGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85" />

  <!-- Foreground Rolling Hills (丘陵 - Layer 3) -->
  <path d="M-10 190 Q 50 140, 130 170 T 250 165 L 250 240 L -10 240 Z" fill="url(#hillFront)" />

  <!-- Scenic Elements: Trees and Foliage on Hills -->
  <!-- Pine Tree 1 -->
  <polygon points="40,165 34,180 46,180" fill="#047857" />
  <polygon points="40,158 36,170 44,170" fill="#065f46" />
  <rect x="38.5" y="180" width="3" height="5" fill="#78350f" />

  <!-- Pine Tree 2 -->
  <polygon points="205,155 198,172 212,172" fill="#047857" />
  <polygon points="205,147 200,160 210,160" fill="#065f46" />
  <rect x="203.5" y="172" width="3" height="6" fill="#78350f" />

  <!-- Deciduous Tree -->
  <circle cx="85" cy="155" r="10" fill="#047857" />
  <rect x="83.5" y="162" width="3" height="8" fill="#78350f" />

  <!-- Human Character & Context: Hiking / Exploring the Hilly Terrain -->
  <!-- Hiking Character (Backpacker admiring the rolling hills landscape) -->
  <!-- Legs -->
  <line x1="125" y1="205" x2="120" y2="225" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line x1="131" y1="205" x2="138" y2="224" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <!-- Boots -->
  <ellipse cx="118" cy="226" rx="3" ry="1.5" fill="#334155" />
  <ellipse cx="140" cy="225" rx="3" ry="1.5" fill="#334155" />

  <!-- Body / Torso (Yellow jacket) -->
  <path d="M 120 185 L 138 185 L 140 207 L 118 207 Z" fill="#f59e0b" rx="2" />
  <!-- Backpack -->
  <rect x="132" y="187" width="9" height="16" rx="3" fill="#ec4899" />
  <line x1="136" y1="187" x2="136" y2="203" stroke="#db2777" stroke-width="1.5" />

  <!-- Head & Hair -->
  <circle cx="129" cy="176" r="6.5" fill="#fde047" />
  <path d="M 123 175 Q 128 169, 135 174" fill="#334155" />

  <!-- Raised arm pointing at the vast scenery -->
  <path d="M 134 190 L 148 180" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="150" cy="178" r="2" fill="#fde047" />

  <!-- Hiking Pole in other hand -->
  <line x1="124" y1="190" x2="112" y2="222" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <circle cx="112" cy="223" r="1.5" fill="#cbd5e1" />

  <!-- Foreground details: Grass tufts -->
  <path d="M 25 210 Q 27 203, 30 210" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 29 212 Q 32 206, 35 212" fill="none" stroke="#065f46" stroke-width="2" stroke-linecap="round" />
  
  <path d="M 175 220 Q 178 213, 182 220" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 180 221 Q 183 216, 186 221" fill="none" stroke="#065f46" stroke-width="2" stroke-linecap="round" />

  <!-- Additional scenic contour line to emphasize rolling nature -->
  <path d="M 150 185 Q 170 190, 195 182" fill="none" stroke="#065f46" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
</svg>