    <circle cx="60" cy="45" r="5" fill="#fb923c"/>
  </g>
  
  <!-- Character 2: The Worker (Distracted) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <path d="M5 40 L35 40 L30 100 L10 100 Z" fill="#ec4899"/>
    <rect x="10" y="80" width="20" height="20" fill="#94a3b8"/>
  </g>

  <!-- Repetition Indicators (The "屡次" concept) -->
  <g stroke="#fbbf24" stroke-width="2" fill="none">
    <path d="M110 70 Q120 60 130 70" />
    <path d="M110 55 Q120 45 130 55" />
    <path d="M110 40 Q120 30 130 40" />
  </g>
  
  <!-- Safety Gear -->
  <path d="M45 85 L75 85 Q80 85 80 90 L80 95 L40 95 L40 90 Q40 85 45 85" fill="#fb923c"/>
  <path d="M135 65 L165 65 Q170 65 170 70 L170 75 L130 75 L130 70 Q130 65 135 65" fill="#fb923c"/>
</svg>