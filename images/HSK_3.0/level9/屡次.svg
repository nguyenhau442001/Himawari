<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Construction Site Context -->
  <path d="M20 200 L220 200 L220 215 L20 215 Z" fill="#334155"/>
  <path d="M40 120 L80 120 L80 200 L40 200 Z" fill="#475569"/>
  <circle cx="60" cy="100" r="15" fill="#fbbf24"/>
  
  <!-- Character 1: The Advisor (Pointing) -->
  <g transform="translate(130, 80)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <path d="M5 40 L35 40 L30 120 L10 120 Z" fill="#38bdf8"/>
