<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Defensive Wall Base (representing defending territory) -->
    <path d="M40 180 L200 180 L200 160 L180 160 L180 140 L160 140 L160 160 L80 160 L80 140 L60 140 L60 160 L40 160 Z" fill="#2A303C"/>
    
    <!-- Incoming Threat Vectors (Faded red/orange incoming forces, stopped at the wall) -->
    <g opacity="0.4" stroke="#FF5722" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="80" x2="60" y2="120" />
      <line x1="50" y1="70" x2="90" y2="110" />
      <polygon points="60,120 50,115 55,110" fill="#FF5722"/>
      <polygon points="90,110 80,105 85,100" fill="#FF5722"/>
    </g>

    <!-- The Counter-Attack / Strike Back Object (A dynamic, powerful ballista / defensive counter-artillery piece mounted on the rampart) -->
    <!-- Platform -->
    <rect x="90" y="130" width="60" height="15" rx="3" fill="#3A4252"/>
    
    <!-- Pivot Base -->
    <circle cx="120" cy="130" r="12" fill="#FF9800"/>

    <!-- Launch Mechanism / Bow Aimed Upward and Outward (Countering) -->
    <g transform="rotate(-35 120 130)">
      <!-- Bow arms -->
      <path d="M120 90 C100 110 100 130 120 140 C140 130 140 110 120 90 Z" fill="#FFB74D"/>
      <!-- Bowstring tension -->
      <line x1="120" y1="90" x2="120" y2="140" stroke="#FFF" stroke-width="2"/>
      <!-- Main projectile / Bolt launching -->
      <polygon points="120,60 113,100 127,100" fill="#FF5722"/>
    </g>

    <!-- Outgoing Dynamic Counter-Strike Energy / Projectiles -->
    <g fill="none" stroke="#FF9800" stroke-width="4" stroke-linecap="round">
      <path d="M140 95 Q170 70 205 60"/>
      <path d="M150 110 Q180 90 215 80"/>
    </g>

    <!-- High-impact Action Arrows (Visualizing the immediate reversal of momentum) -->
    <g fill="#FF5722">
      <polygon points="210,55 195,58 202,68"/>
      <polygon points="220,75 205,78 212,88"/>
    </g>

    <!-- Shockwave / Impact Rings at the origin of counter-attack -->
    <circle cx="120" cy="120" r="45" fill="none" stroke="#FF9800" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="#FF5722" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>