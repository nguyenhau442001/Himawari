<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road surface -->
  <rect x="0" y="140" width="240" height="100" fill="#2D3436"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#4A5568" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Ambulance (Center) -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="40" height="25" rx="4" fill="#E53E3E"/>
    <rect x="5" y="5" width="10" height="10" fill="#FFFFFF"/>
    <circle cx="10" cy="25" r="5" fill="#2D3436"/>
    <circle cx="30" cy="25" r="5" fill="#2D3436"/>
    <rect x="15" y="2" width="20" height="5" fill="#F6E05E"/>
  </g>
  
  <!-- Car 1 (Left - Moving aside) -->
  <g transform="translate(20, 165)">
    <path d="M0 15 L35 15 L30 5 L10 5 Z" fill="#3182CE"/>
    <circle cx="8" cy="18" r="4" fill="#2D3436"/>
    <circle cx="27" cy="18" r="4" fill="#2D3436"/>
  </g>
  
  <!-- Car 2 (Right - Moving aside) -->
  <g transform="translate(185, 165)">
    <path d="M0 15 L35 15 L30 5 L10 5 Z" fill="#3182CE"/>
    <circle cx="8" cy="18" r="4" fill="#2D3436"/>
    <circle cx="27" cy="18" r="4" fill="#2D3436"/>
  </g>
  
  <!-- Motion lines for cars moving aside -->
  <path d="M20 160 L5 150" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
  <path d="M220 160 L235 150" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
</svg>