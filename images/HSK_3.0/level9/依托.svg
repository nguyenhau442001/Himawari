<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Foundation representing local resources -->
  <path d="M40 190 L200 190 L190 210 L50 210 Z" fill="#34495E"/>
  <rect x="60" y="150" width="120" height="40" rx="4" fill="#F39C12"/>
  
  <!-- The Project (represented by a stylized building structure) -->
  <rect x="85" y="90" width="70" height="60" rx="2" fill="#E67E22"/>
  <rect x="100" y="105" width="15" height="30" fill="#1A1D24" opacity="0.2"/>
  <rect x="125" y="105" width="15" height="30" fill="#1A1D24" opacity="0.2"/>
  
  <!-- Supporting structure (The "依托" action: leaning/resting on the foundation) -->
  <path d="M85 150 L60 150 L85 190 Z" fill="#D35400"/>
  <path d="M155 150 L180 150 L155 190 Z" fill="#D35400"/>
  
  <!-- Motion lines indicating stability and reliance -->
  <path d="M70 170 L80 170" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 170 L170 170" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 165 L75 175" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
  <path d="M165 165 L165 175" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
</svg>