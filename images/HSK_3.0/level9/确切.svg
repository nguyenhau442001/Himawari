<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Modal Glow -->
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <!-- Success Green Gradient -->
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Details -->
  <g id="environment">
    <!-- Window Frame & Night City Glow -->
    <rect x="25" y="25" width="60" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <path d="M55 25 V95 M25 60 H85" stroke="#334155" stroke-width="1.5"/>
    <!-- City lights outside -->
    <circle cx="40" cy="45" r="2" fill="#fbbf24" opacity="0.6"/>
    <rect x="65" y="70" width="8" height="15" fill="#38bdf8" opacity="0.4"/>
    <rect x="45" y="75" width="6" height="10" fill="#f43f5e" opacity="0.4"/>

    <!-- Bookshelf / Plants background props -->
    <rect x="180" y="35" width="35" height="60" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <line x1="180" y1="55" x2="215" y2="55" stroke="#334155" stroke-width="1"/>
    <line x1="180" y1="75" x2="215" y2="75" stroke="#334155" stroke-width="1"/>
    <!-- Plant pot on shelf -->
    <path d="M192 55 L195 45 H203 L206 55 Z" fill="#cbd5e1"/>
    <circle cx="199" cy="42" r="6" fill="#10b981"/>
    <circle cx="195" cy="38" r="5" fill="#059669"/>
  </g>

  <!-- Hanging Desk Lamp -->
  <g id="lamp">
    <path d="M120 0 V35" stroke="#64748b" stroke-width="2"/>
    <path d="M100 35 H140 L145 45 H95 Z" fill="#475569"/>
    <ellipse cx="120" cy="45" rx="25" ry="30" fill="url(#lampGlow)"/>
  </g>

  <!-- Office Desk -->
  <rect x="15" y="160" width="210" height="10" fill="#334155" rx="2"/>
  <rect x="30" y="170" width="12" height="50" fill="#1e293b"/>
  <rect x="198" y="170" width="12" height="50" fill="#1e293b"/>

  <!-- Character 1: The Curious Questioner (Left, leaning forward) -->
  <g id="questioner">
    <!-- Body & Torso -->
    <path d="M45 160 C45 135 65 135 75 160 Z" fill="#38bdf8"/>
    <!-- Head & Face -->
    <circle cx="65" cy="115" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M50 115 C50 100 80 100 80 115 C80 120 75 110 65 110 C55 110 50 115 50 115 Z" fill="#475569"/>
    <!-- Eyes (Inquisitive, wide) -->
    <circle cx="70" cy="114" r="2" fill="#0f172a"/>
    <!-- Arm leaning on desk -->
    <path d="M60 140 L95 155" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="95" cy="155" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: The Confident/Precise Expert (Right, gesturing clearly) -->
  <g id="expert">
    <!-- Body & Torso -->
    <path d="M165 160 C165 135 145 135 135 160 Z" fill="#10b981"/>
    <!-- Head & Face -->
    <circle cx="145" cy="115" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M130 112 C130 98 160 98 160 112 C150 108 140 108 130 112 Z" fill="#1e293b"/>
    <!-- Eyes (Confident, focused) -->
    <path d="M140 113 Q143 116 146 113" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Active Arm/Hand gesturing with precision (pointing/pinching for exactness) -->
    <path d="M150 140 L125 135" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="123" cy="135" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Context Props on Desk: Laptop, Notebook, Coffee Mug -->
  <g id="deskProps">
    <!-- Laptop Base -->
    <path d="M90 160 H135 L140 163 H85 Z" fill="#94a3b8"/>
    <!-- Laptop Screen showing exact check/graph -->
    <path d="M92 160 L98 135 H127 L133 160 Z" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <!-- Exact Match Graph/Check UI inside laptop screen -->
    <path d="M103 150 L108 155 L120 142" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Coffee Mug -->
    <rect x="155" y="145" width="12" height="15" rx="2" fill="#cbd5e1"/>
    <path d="M167 148 C172 148 172 157 167 157" stroke="#cbd5e1" stroke-width="2" fill="none"/>

    <!-- Notebook -->
    <polygon points="65,157 85,152 89,158 69,163" fill="#f8fafc"/>
    <line x1="72" y1="157" x2="82" y2="155" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Floating "Exact Answer" Thought/Speech Bubble with Checkmark & Target Focus -->
  <g id="exactAnswerBubble" transform="translate(0, -5)">
    <!-- Main Modal Box representing the "Definite/Exact Answer" -->
    <rect x="80" y="45" width="80" height="42" rx="8" fill="url(#modalGrad)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Bubble Pointer Triangle -->
    <polygon points="120,87 125,97 130,87" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="120" y1="87" x2="130" y2="87" stroke="#334155" stroke-width="2"/> <!-- Hides inner stroke line -->

    <!-- Precise Target/Bullseye & Check Icon graphics (NO TEXT) -->
    <!-- Bullseye ring -->
    <circle cx="100" cy="66" r="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
    <circle cx="100" cy="66" r="5" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="100" cy="66" r="2" fill="#fbbf24"/>

    <!-- Glowing Checkmark Symbol representing 'Correct/Exact' -->
    <circle cx="140" cy="66" r="12" fill="url(#successGrad)"/>
    <path d="M134 66 L138 70 L147 61" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dynamic Accent Sparkles for Clarity/Precision -->
  <g id="sparkles">
    <path d="M160 40 L162 45 L167 47 L162 49 L160 54 L158 49 L153 47 L158 45 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M75 55 L76 58 L79 59 L76 60 L75 63 L74 60 L71 59 L74 58 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>