<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Pond background elements -->
  <path d="M30 180 C 70 170, 110 190, 150 175 C 190 160, 210 170, 220 185 L 220 220 L 20 220 Z" fill="#152238" opacity="0.6"/>
  <path d="M20 195 C 60 185, 120 205, 170 190 C 205 180, 225 190, 230 198 L 230 220 L 10 220 Z" fill="#0D1B2A"/>
  
  <!-- Water ripples -->
  <path d="M110 205 Q 130 202, 150 205" stroke="#3A506B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M70 212 Q 85 210, 100 212" stroke="#3A506B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M165 215 Q 175 213, 185 215" stroke="#3A506B" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Goose (大白鹅) -->
  <g transform="translate(15, 15)">
    <!-- Body (plump, white/soft blue-white for contrast on dark) -->
    <path d="M 85 115 C 80 95, 105 85, 125 90 C 150 95, 165 115, 160 135 C 155 155, 120 160, 95 150 C 75 140, 90 125, 85 115 Z" fill="#F4F6F8"/>
    
    <!-- Wing overlay for layered depth -->
    <path d="M 95 110 C 110 105, 135 115, 140 135 C 120 145, 100 135, 95 110 Z" fill="#E2E8F0"/>

    <!-- Neck (graceful curve) -->
    <path d="M 115 95 C 110 75, 100 55, 108 42 C 112 36, 122 36, 124 45 C 127 58, 135 75, 135 95 Z" fill="#F4F6F8"/>

    <!-- Head -->
    <circle cx="112" cy="34" r="13" fill="#F4F6F8"/>

    <!-- Eye -->
    <circle cx="116" cy="32" r="2" fill="#1A1D24"/>

    <!-- Beak (distinctive orange/gold accent) -->
    <path d="M 100 32 C 90 31, 86 35, 90 39 C 95 42, 102 38, 104 35 Z" fill="#FF9F43"/>
    
    <!-- Beak detail/base -->
    <path d="M 104 32 C 108 32, 110 35, 104 35 Z" fill="#E8832A"/>

    <!-- Tail feathers -->
    <path d="M 155 125 C 170 120, 175 130, 165 140 Z" fill="#E2E8F0"/>
  </g>

  <!-- Contextual environment accents (reed / subtle plant) -->
  <path d="M 35 190 Q 32 150, 25 120" stroke="#2D4A3E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 25 130 Q 20 125, 18 115 C 22 110, 28 115, 25 130 Z" fill="#3A5A48"/>
  <path d="M 42 195 Q 45 160, 50 135" stroke="#2D4A3E" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 50 145 Q 56 142, 58 135 C 54 130, 48 135, 50 145 Z" fill="#3A5A48"/>

</svg>