<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="roomGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip">
      <path d="M 80,45 L 160,45 L 160,110 L 80,110 Z"/>
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#nightSky)"/>
  
  <!-- Interior Ambient Room Gradient -->
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)"/>

  <!-- Wallpaper / Interior Wall Detail -->
  <rect x="20" y="20" width="200" height="150" rx="6" fill="#2d3748" opacity="0.6"/>
  <line x1="20" y1="130" x2="220" y2="130" stroke="#1a202c" stroke-width="4"/>

  <!-- Window to outside (Night sky with moon and subtle stars) -->
  <g clip-path="url(#windowClip)">
    <rect x="80" y="45" width="80" height="65" fill="#0b0f19"/>
    <!-- Moon -->
    <circle cx="135" cy="70" r="10" fill="#fef08a" opacity="0.9"/>
    <!-- Subtle stars -->
    <circle cx="95" cy="60" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="110" cy="85" r="1.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="150" cy="95" r="1" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Window Frame -->
  <rect x="76" y="41" width="88" height="73" rx="2" fill="none" stroke="#475569" stroke-width="4"/>
  <line x1="120" y1="41" x2="120" y2="114" stroke="#475569" stroke-width="3"/>
  <line x1="76" y1="77" x2="164" y2="77" stroke="#475569" stroke-width="3"/>
  <!-- Windowsill -->
  <rect x="72" y="112" width="96" height="6" rx="1" fill="#64748b"/>

  <!-- House Floor -->
  <path d="M 20,170 L 220,170 L 230,220 L 10,220 Z" fill="#111827"/>
  <path d="M 20,170 L 220,170" stroke="#1f2937" stroke-width="2"/>

  <!-- Bookshelf / Prop Background Left -->
  <rect x="30" y="80" width="35" height="90" rx="2" fill="#334155"/>
  <rect x="34" y="100" width="27" height="6" rx="1" fill="#475569"/>
  <rect x="34" y="130" width="27" height="6" rx="1" fill="#475569"/>
  <rect x="34" y="160" width="27" height="6" rx="1" fill="#475569"/>
  <!-- Books on shelf -->
  <rect x="37" y="88" width="6" height="12" rx="1" fill="#f43f5e"/>
  <rect x="45" y="86" width="8" height="14" rx="1" fill="#38bdf8"/>
  <rect x="55" y="89" width="5" height="11" rx="1" fill="#fbbf24"/>

  <!-- Plant Prop Right -->
  <path d="M 195,145 L 205,145 L 208,170 L 192,170 Z" fill="#64748b"/>
  <!-- Plant leaves -->
  <path d="M 198,145 Q 185,120 175,125 Q 170,140 198,145 Z" fill="#10b981"/>
  <path d="M 200,145 Q 210,115 225,120 Q 220,138 200,145 Z" fill="#059669"/>
  <path d="M 200,145 Q 200,110 195,105 Q 190,120 200,145 Z" fill="#34d399"/>

  <!-- Desk & Lamp (Center-Right context) -->
  <rect x="150" y="150" width="65" height="8" rx="2" fill="#475569"/>
  <rect x="195" y="158" width="6" height="35" fill="#334155"/>
  <!-- Desk Lamp -->
  <path d="M 175,150 L 179,130 L 183,150 Z" fill="#fbbf24"/>
  <circle cx="179" cy="130" r="8" fill="#f59e0b"/>
  <circle cx="179" cy="130" r="100" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Main Character (Person listening/waiting intently in quiet room) -->
  <!-- Sitting on a cozy armchair -->
  <!-- Armchair Back & Base -->
  <path d="M 75,130 Q 75,105 105,105 Q 135,105 135,130 L 135,190 L 75,190 Z" fill="#3b82f6"/>
  <!-- Armchair Arms -->
  <rect x="65" y="140" width="18" height="45" rx="6" fill="#2563eb"/>
  <rect x="127" y="140" width="18" height="45" rx="6" fill="#2563eb"/>

  <!-- Character Body -->
  <!-- Torso (Wearing cozy sweater) -->
  <path d="M 85,135 L 125,135 L 130,175 L 80,175 Z" fill="#a855f7"/>
  <!-- Head -->
  <circle cx="105" cy="105" r="16" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M 89,102 Q 105,85 121,102 Q 123,93 105,91 Q 87,93 89,102 Z" fill="#451a03"/>

  <!-- Face expressing quiet concentration/alertness -->
  <!-- Open, wide-awake listening eyes looking towards the window/source -->
  <circle cx="100" cy="105" r="2" fill="#1e293b"/>
  <circle cx="112" cy="105" r="2" fill="#1e293b"/>
  <!-- Slight subtle curved line for focused mouth -->
  <path d="M 104,113 Q 107,115 110,113" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character Legs & Slippers -->
  <rect x="90" y="172" width="12" height="20" fill="#64748b"/>
  <rect x="108" y="172" width="12" height="20" fill="#64748b"/>
  <ellipse cx="94" cy="193" rx="8" ry="4" fill="#f43f5e"/>
  <ellipse cx="114" cy="193" rx="8" ry="4" fill="#f43f5e"/>

  <!-- Arm / Hand resting pose -->
  <path d="M 85,140 Q 75,150 82,160" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round"/>
  <circle cx="82" cy="162" r="4" fill="#fbcfe8"/>

  <!-- Visualizing "Absolute Silence / No Movement" (Subtle artistic floating quiet symbols, non-text) -->
  <!-- Gentle sound wave icon crossed out or fading / floating peaceful Zzz or stillness dots -->
  <g opacity="0.7">
    <!-- Quiet ripple near window -->
    <path d="M 115,65 Q 120,60 125,65" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <path d="M 112,62 Q 120,54 128,62" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>
    
    <!-- Floating stillness dust motes in room light -->
    <circle cx="145" cy="135" r="1.5" fill="#fde047" opacity="0.8"/>
    <circle cx="160" cy="120" r="1" fill="#fde047" opacity="0.6"/>
    <circle cx="130" cy="145" r="2" fill="#fde047" opacity="0.4"/>
    <circle cx="95" cy="130" r="1" fill="#fde047" opacity="0.5"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>