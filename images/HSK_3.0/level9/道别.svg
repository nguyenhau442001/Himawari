<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Airport Terminal Background Elements -->
  <path d="M40 180 L200 180 L190 120 L50 120 Z" fill="#2C313C"/>
  <rect x="70" y="130" width="20" height="40" fill="#3A404E"/>
  <rect x="110" y="130" width="20" height="40" fill="#3A404E"/>
  <rect x="150" y="130" width="20" height="40" fill="#3A404E"/>
  
  <!-- Character 1 (Traveler) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#FFC107"/>
    <path d="M5 40 L15 80 L10 120 M35 40 L25 80 L30 120" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <rect x="5" y="35" width="30" height="45" rx="5" fill="#FFC107"/>
    <!-- Waving hand -->
    <path d="M35 45 L55 30" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <circle cx="58" cy="28" r="5" fill="#FFC107"/>
  </g>
  
  <!-- Character 2 (Friend) -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="15" fill="#8892B0"/>
    <rect x="5" y="35" width="30" height="85" rx="5" fill="#8892B0"/>
    <path d="M5 40 L-10 80 M35 40 L50 80" stroke="#8892B0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="210" width="240" height="30" fill="#252932"/>
</svg>