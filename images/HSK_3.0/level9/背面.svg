<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.3" filter="blur(20px)"/>

  <!-- Conceptual illustration for "背面" (Back side of an object/document like a receipt) -->
  <g transform="translate(0, 0)">
    <!-- Shadow for depth -->
    <rect x="55" y="45" width="130" height="150" rx="10" fill="#111318" opacity="0.5"/>

    <!-- Main Receipt/Card Base (Flipped to show the back) -->
    <rect x="50" y="40" width="130" height="150" rx="8" fill="#283044" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Top torn edge effect or header band -->
    <path d="M50 48 L180 48" stroke="#3B4252" stroke-dasharray="4,4" stroke-width="2"/>
    
    <!-- Back side elements: Magnetic stripe / Barcode / Terms and Conditions lines -->
    <!-- Magnetic Stripe -->
    <rect x="50" y="58" width="130" height="20" fill="#1A1D24"/>
    
    <!-- Fine print lines (representing the terms/conditions mentioned in context) -->
    <rect x="65" y="90" width="70" height="4" rx="2" fill="#718096" opacity="0.7"/>
    <rect x="65" y="102" width="100" height="4" rx="2" fill="#4A5568"/>
    <rect x="65" y="114" width="90" height="4" rx="2" fill="#4A5568"/>
    <rect x="65" y="126" width="100" height="4" rx="2" fill="#4A5568"/>
    <rect x="65" y="138" width="50" height="4" rx="2" fill="#4A5568"/>

    <!-- Barcode at the bottom -->
    <g transform="translate(65, 155)">
      <rect x="0" y="0" width="4" height="18" fill="#718096"/>
      <rect x="7" y="0" width="2" height="18" fill="#718096"/>
      <rect x="12" y="0" width="6" height="18" fill="#718096"/>
      <rect x="21" y="0" width="3" height="18" fill="#718096"/>
      <rect x="27" y="0" width="5" height="18" fill="#718096"/>
      <rect x="35" y="0" width="2" height="18" fill="#718096"/>
      <rect x="40" y="0" width="6" height="18" fill="#718096"/>
      <rect x="49" y="0" width="4" height="18" fill="#718096"/>
      <rect x="56" y="0" width="2" height="18" fill="#718096"/>
      <rect x="61" y="0" width="5" height="18" fill="#718096"/>
      <rect x="69" y="0" width="3" height="18" fill="#718096"/>
      <rect x="75" y="0" width="6" height="18" fill="#718096"/>
      <rect x="84" y="0" width="2" height="18" fill="#718096"/>
      <rect x="89" y="0" width="4" height="18" fill="#718096"/>
    </g>

    <!-- Curved Flip / Rotation Arrow indicating "turning over" to the back -->
    <g transform="translate(145, 145)">
      <!-- Outer glow ring for focus -->
      <circle cx="25" cy="25" r="24" fill="#1A1D24" stroke="#D97706" stroke-width="3"/>
      
      <!-- Flip Arrow Icon (Curved circular arrow) -->
      <path d="M 14 25 A 11 11 0 1 1 25 36" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M 25 32 L 21 36 L 25 40" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>