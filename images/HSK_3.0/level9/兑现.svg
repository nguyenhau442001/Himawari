<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Promise/Fulfillment -->
    <radialGradient id="glow" cx="60%" cy="40%" r="60%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Gift Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting Effect -->
  <circle cx="150" cy="110" r="100" fill="url(#glow)"/>

  <!-- Interior Environment / Context Props -->
  <!-- Bookshelf / Window Frame Background Detail -->
  <path d="M20 190 L220 190" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <rect x="25" y="140" width="18" height="50" rx="2" fill="#334155" opacity="0.4"/>
  <rect x="46" y="150" width="14" height="40" rx="2" fill="#475569" opacity="0.4"/>
  
  <!-- Warm hanging lamp casting light -->
  <path d="M150 20 L150 45" stroke="#64748b" stroke-width="2"/>
  <path d="M135 45 L165 45 L170 55 L130 55 Z" fill="#64748b"/>
  <path d="M130 55 L170 55 L180 90 L120 90 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- Table/Desk Surface -->
  <path d="M15 175 L225 175 L210 205 L30 205 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Character 1: The Friend / Receiver (Smiling warmly) -->
  <g transform="translate(45, 95)">
    <!-- Body -->
    <path d="M 25 50 C 25 35, 45 30, 60 50 L 70 80 L 10 80 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="45" cy="20" r="16" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 29 18 C 30 10, 40 5, 53 10 C 58 12, 60 18, 60 18 C 60 18, 55 12, 45 12 C 35 12, 30 18, 29 18 Z" fill="#334155"/>
    <!-- Happy Expression -->
    <path d="M 40 22 Q 45 27 50 22" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="39" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="51" cy="18" r="1.5" fill="#1e293b"/>
    <!-- Raised Hand welcoming -->
    <path d="M 60 45 Q 70 35 75 42" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 2: The Subject (Fulfilling the promise / Giving the gift) -->
  <g transform="translate(115, 80)">
    <!-- Body & Torso -->
    <path d="M 15 65 C 15 45, 35 40, 50 65 L 65 110 L 5 110 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="35" cy="30" r="17" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 19 28 C 19 16, 30 12, 45 16 C 51 18, 52 28, 52 28 C 52 28, 48 18, 38 18 C 28 18, 21 24, 19 28 Z" fill="#1e293b"/>
    <!-- Confident, Caring Expression (Eyes closed in a happy smile) -->
    <path d="M 28 30 Q 32 34 36 30" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 40 30 Q 44 34 48 30" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 36 37 Q 38 39 40 37" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Reaching Out Arms Delivering the Promise -->
    <path d="M 10 65 Q -10 60 -25 55" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- The Promised Object / Gift Box (Symbolizing fulfillment of the promise) -->
  <g transform="translate(95, 115)">
    <!-- Box Body -->
    <rect x="0" y="15" width="36" height="30" rx="3" fill="url(#boxGrad)" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Vertical Ribbon -->
    <rect x="15" y="15" width="6" height="30" fill="url(#ribbonGrad)"/>
    <!-- Box Lid -->
    <rect x="-2" y="8" width="40" height="9" rx="2" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Horizontal Ribbon Lid -->
    <rect x="-2" y="10" width="40" height="4" fill="url(#ribbonGrad)"/>
    <!-- Fancy Bow -->
    <path d="M 10 8 C 5 2, 0 5, 8 8 Z" fill="#e11d48"/>
    <path d="M 20 8 C 25 2, 30 5, 22 8 Z" fill="#e11d48"/>
    <circle cx="18" cy="8" r="3" fill="#fb7185"/>
  </g>

  <!-- Sparkles / Magic of Fulfillment (Highlighting the achievement/action) -->
  <g fill="#fbbf24">
    <path d="M 115 70 L 117 75 L 122 77 L 117 79 L 115 84 L 113 79 L 108 77 L 113 75 Z"/>
    <path d="M 75 105 L 76 108 L 79 109 L 76 110 L 75 113 L 74 110 L 71 109 L 74 108 Z" transform="scale(0.8) translate(20, 10)"/>
    <circle cx="135" cy="65" r="2" opacity="0.8"/>
    <circle cx="95" cy="95" r="1.5" opacity="0.6"/>
  </g>

  <!-- Foreground Plants for Rich Real-World Framing -->
  <g transform="translate(15, 160)">
    <path d="M 10 40 Q 5 15 25 5 Q 35 25 10 40 Z" fill="#059669" opacity="0.9"/>
    <path d="M 2 45 Q 15 20 35 25 Q 30 45 2 45 Z" fill="#10b981" opacity="0.9"/>
    <ellipse cx="18" cy="40" rx="12" ry="6" fill="#334155"/>
  </g>
</svg>