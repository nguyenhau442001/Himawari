<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Room Context -->
  <!-- Bookshelf Background -->
  <g fill="#334155" opacity="0.6">
    <rect x="20" y="40" width="40" height="8" rx="2" />
    <rect x="25" y="25" width="8" height="15" rx="1" fill="#64748b" />
    <rect x="35" y="20" width="6" height="20" rx="1" fill="#38bdf8" />
    <rect x="43" y="28" width="10" height="12" rx="1" fill="#f43f5e" />
  </g>

  <!-- Window with Night Scene -->
  <path d="M170,25 L210,25 L210,95 L170,95 Z" fill="#0284c7" opacity="0.2" />
  <path d="M170,25 L210,25 L210,95 L170,95 Z" fill="url(#window-light)" />
  <!-- Window Frame -->
  <rect x="168" y="23" width="44" height="74" rx="2" fill="none" stroke="#475569" stroke-width="3" />
  <line x1="190" y1="23" x2="190" y2="97" stroke="#475569" stroke-width="2" />
  <line x1="168" y1="60" x2="212" y2="60" stroke="#475569" stroke-width="2" />
  <!-- Tiny Moon outside -->
  <circle cx="200" cy="40" r="5" fill="#fef08a" opacity="0.8" />

  <!-- Desk Surface -->
  <path d="M20,170 L220,170 L230,210 L10,210 Z" fill="#0f172a" />
  <rect x="15" y="165" width="210" height="8" rx="3" fill="#475569" />

  <!-- Desk Lamp -->
  <circle cx="50" cy="130" r="30" fill="url(#lamp-glow)" />
  <path d="M45,165 L55,165 L52,145 L48,145 Z" fill="#64748b" />
  <path d="M40,115 C35,125 45,145 50,145 C55,145 65,125 60,115 Z" fill="#fbbf24" />
  <path d="M50,115 L50,105 C50,100 40,95 35,90" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

  <!-- Open Article / Document with Abstract Lines (Representing "The Article") -->
  <g filter="url(#shadow)">
    <path d="M80,120 L160,110 L165,175 L85,185 Z" fill="#f8fafc" />
    <path d="M83,123 L157,113 L162,172 L88,182 Z" fill="#ffffff" />
    <!-- Binding crease -->
    <line x1="122" y1="116" x2="125" y2="178" stroke="#cbd5e1" stroke-width="2" />
    <!-- Abstract Text Lines on Article -->
    <g fill="#94a3b8">
      <!-- Left Page Text -->
      <rect x="92" y="130" width="22" height="3" rx="1" />
      <rect x="92" y="137" width="24" height="3" rx="1" />
      <rect x="92" y="144" width="18" height="3" rx="1" />
      <rect x="92" y="151" width="22" height="3" rx="1" />
      <rect x="92" y="158" width="15" height="3" rx="1" />
      <!-- Right Page Text -->
      <rect x="132" y="127" width="22" height="3" rx="1" />
      <rect x="132" y="134" width="25" height="3" rx="1" />
      <rect x="132" y="141" width="20" height="3" rx="1" />
      <rect x="132" y="148" width="24" height="3" rx="1" />
    </g>
    <!-- Highlighted Key Concept / Main Idea Focus (Golden Glow element) -->
    <rect x="131" y="155" width="26" height="16" rx="3" fill="#fef08a" opacity="0.8" />
    <rect x="134" y="159" width="20" height="2.5" rx="1" fill="#d97706" />
    <rect x="134" y="165" width="14" height="2.5" rx="1" fill="#d97706" />
  </g>

  <!-- Coffee Mug -->
  <rect x="180" y="140" width="16" height="20" rx="3" fill="#38bdf8" />
  <path d="M196,145 C202,145 202,155 196,155" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M184,136 Q188,130 185,124" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Main Character (Thoughtful Student/Reader leaning over desk) -->
  <g>
    <!-- Body / Torso -->
    <path d="M90,210 C90,175 110,165 125,165 C140,165 155,175 160,210 Z" fill="#4f46e5" />
    
    <!-- Arms leaning on desk -->
    <path d="M95,185 C100,165 115,155 125,155 C130,155 135,158 138,162" fill="none" stroke="#4f46e5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Hands holding chin / thinking pose -->
    <circle cx="120" cy="142" r="7" fill="#fcd34d" />

    <!-- Head & Hair -->
    <!-- Hair Base -->
    <path d="M102,110 C102,90 125,85 138,98 C145,105 146,120 142,130 C138,135 120,135 110,130 C104,125 102,118 102,110 Z" fill="#1e293b" />
    
    <!-- Face Profile / Skin -->
    <circle cx="120" cy="115" r="15" fill="#fcd34d" />

    <!-- Hair Details (Front bangs) -->
    <path d="M106,108 C112,115 122,112 130,106 C125,98 112,98 106,108 Z" fill="#1e293b" />

    <!-- Facial Expression: Thoughtful / Questioning (Eyebrow raised, focused eyes) -->
    <line x1="113" y1="110" x2="119" y2="112" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="116" cy="116" r="2" fill="#1e293b" />
    <!-- Cute thoughtful mouth -->
    <path d="M124,122 C126,123 128,122 129,121" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Glasses (Intelligent Reader Look) -->
    <rect x="111" y="110" width="10" height="7" rx="2" fill="none" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Floating Conceptual Elements (Signifying "Extracting the Main Idea / What is the core concept?") -->
  <g transform="translate(0, -5)">
    <!-- Glowing Thought/Focus Bubble with Sparkles -->
    <circle cx="145" cy="85" r="16" fill="#fef08a" opacity="0.9" filter="url(#shadow)" />
    <path d="M145,75 L147,81 L153,83 L147,85 L145,91 L143,85 L137,83 L143,81 Z" fill="#d97706" />
    
    <!-- Small trailing thought circles -->
    <circle cx="132" cy="102" r="5" fill="#fef08a" opacity="0.7" />
    <circle cx="124" cy="112" r="3" fill="#fef08a" opacity="0.5" />
  </g>

</svg>