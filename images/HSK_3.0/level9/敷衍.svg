<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow/lighting for dark mode context -->
  <circle cx="120" cy="110" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Desk Surface -->
  <path d="M 36 185 L 204 185 L 216 205 L 24 205 Z" fill="#2A2F3D"/>
  <line x1="36" y1="185" x2="204" y2="185" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>

  <!-- Document / Task Paper (Neglected, messy) -->
  <g transform="translate(65, 110)">
    <!-- Paper base -->
    <polygon points="15,10 95,5 105,75 25,80" fill="#E2E8F0"/>
    <!-- Messy, perfunctory scribbles representing "fūyǎn" (half-hearted work) -->
    <path d="M 30,25 Q 45,20 60,28" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="32" y1="42" x2="55" y2="39" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="55" x2="50" y2="53" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <!-- Careless ink blot / squiggle -->
    <path d="M 65,45 Q 75,55 70,65 Q 65,70 60,60" fill="#E11D48" opacity="0.8"/>
  </g>

  <!-- Laptop / Desk clutter in background (dim) -->
  <rect x="135" y="130" width="55" height="35" rx="3" fill="#334155" opacity="0.5"/>
  <polygon points="120,165 205,165 210,168 115,168" fill="#475569" opacity="0.5"/>

  <!-- Character (Upper body, leaning back nonchalantly, doing perfunctory work) -->
  <g transform="translate(10, 20)">
    <!-- Body / Torso leaning back -->
    <path d="M 65 130 C 65 110, 85 95, 110 100 C 130 104, 145 125, 145 155 L 55 155 Z" fill="#3B82F6"/>
    
    <!-- Neck -->
    <path d="M 102 85 L 110 100 L 98 102 Z" fill="#FCA5A5"/>

    <!-- Head turned slightly, looking away with indifference -->
    <g transform="translate(90, 50)">
      <!-- Hair -->
      <path d="M 2 25 C -2 10, 15 -2, 32 2 C 45 5, 48 18, 45 28 C 38 25, 30 28, 25 32 Z" fill="#1E293B"/>
      <!-- Face profile -->
      <circle cx="22" cy="22" r="16" fill="#FCA5A5"/>
      <!-- Closed / Bored Eye (arc) -->
      <path d="M 28 18 Q 32 21 35 18" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Indifferent Mouth / Smirk -->
      <path d="M 30 29 Q 34 28 36 31" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Back-rest of chair -->
    <path d="M 45 80 C 45 65, 55 60, 70 65 L 70 155 L 45 155 Z" fill="#1E293B" opacity="0.7"/>

    <!-- Dynamic Action Arm: Careless/Sluggish Interaction -->
    <!-- Upper arm -->
    <path d="M 105 105 L 125 125" stroke="#3B82F6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Forearm holding pen loosely -->
    <path d="M 125 125 L 140 105" stroke="#FCA5A5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hand & Pen (Not touching properly, haphazard motion) -->
    <circle cx="142" cy="102" r="6" fill="#FCA5A5"/>
    <!-- Pen pointing casually away from paper -->
    <line x1="142" y1="102" x2="165" y2="85" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Motion / Careless Action Lines (Emphasizing perfunctory, dismissive flick of the hand) -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 172 75 Q 182 70 188 78"/>
    <path d="M 178 88 Q 188 85 192 95"/>
    <line x1="168" y1="115" x2="182" y2="122" stroke-dasharray="4 4"/>
  </g>

  <!-- Visual indicators of perfunctory / shallow effort (Floating faint cross-marks) -->
  <g stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <!-- Faint X mark near document -->
    <line x1="155" y1="115" x2="165" y2="125"/>
    <line x1="165" y1="115" x2="155" y2="125"/>
    
    <!-- Another faded X -->
    <line x1="135" y1="145" x2="143" y2="153"/>
    <line x1="143" y1="145" x2="135" y2="153"/>
  </g>
</svg>