<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character 1 (Asking) Gradient -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Retorting) Gradient -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Warm Glow / Lamp Light -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Speech Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props -->
  <!-- Wall art / window grid -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="20" y1="40" x2="80" y2="40"/>
    <line x1="20" y1="60" x2="50" y2="60"/>
    <rect x="170" y="25" width="45" height="60" rx="4" fill="none"/>
    <line x1="170" y1="55" x2="215" y2="55"/>
  </g>

  <!-- Bookshelf in background -->
  <rect x="180" y="100" width="40" height="90" fill="#0f172a" rx="2" opacity="0.6"/>
  <line x1="180" y1="130" x2="220" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="160" x2="220" y2="160" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="188" y="112" width="6" height="18" fill="#38bdf8" rx="1"/>
  <rect x="196" y="108" width="8" height="22" fill="#f43f5e" rx="1"/>
  <rect x="206" y="114" width="5" height="16" fill="#fbbf24" rx="1"/>

  <!-- Hanging Desk Lamp -->
  <circle cx="120" cy="50" r="40" fill="url(#lampGlow)"/>
  <path d="M115 15 L125 15 L130 35 L110 35 Z" fill="#64748b"/>
  <path d="M120 35 L120 55" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="120" cy="55" rx="12" ry="4" fill="#fbbf24"/>

  <!-- Wooden Desk Surface -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#334155"/>
  <path d="M15 175 L225 175 L220 180 L20 180 Z" fill="#475569"/>

  <!-- Desk Props (Laptop, Coffee Cup, Papers) -->
  <!-- Laptop -->
  <path d="M85 175 L115 175 L120 162 L80 162 Z" fill="#94a3b8"/>
  <rect x="83" y="174" width="34" height="2" fill="#cbd5e1" rx="1"/>
  <!-- Coffee Cup -->
  <rect x="145" y="162" width="12" height="15" fill="#f8fafc" rx="2"/>
  <path d="M157 166 C162 166 162 173 157 173" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Notepad -->
  <rect x="50" y="167" width="22" height="11" fill="#f1f5f9" rx="1" transform="rotate(-5 50 167)"/>
  <line x1="53" y1="170" x2="68" y2="168" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="53" y1="173" x2="66" y2="171" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Character 1 (Left - Asking / Questioner) -->
  <g transform="translate(15, 0)">
    <!-- Body / Torso -->
    <path d="M50 180 C50 150 70 140 70 140 L85 180 Z" fill="url(#shirt1)"/>
    <!-- Head -->
    <circle cx="68" cy="120" r="16" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M52 120 C52 105 80 105 84 120 C80 114 56 114 52 120 Z" fill="#334155"/>
    <!-- Facial expression: Curious, pointing finger -->
    <circle cx="73" cy="118" r="1.5" fill="#1e293b"/>
    <path d="M70 126 C72 128 75 128 77 126" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Arm gesturing -->
    <path d="M60 145 L85 135 L88 128" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Hand -->
    <circle cx="89" cy="126" r="4" fill="#ffedd5"/>
  </g>

  <!-- Character 2 (Right - Retorting / "Fǎnwèn" Action) -->
  <g transform="translate(110, 0)">
    <!-- Body / Torso -->
    <path d="M50 180 C50 150 70 140 70 140 L85 180 Z" fill="url(#shirt2)"/>
    <!-- Head (Leaning slightly back in thoughtful/retorting posture) -->
    <circle cx="62" cy="118" r="16" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M48 118 C50 102 78 104 76 120 C70 114 54 112 48 118 Z" fill="#0f172a"/>
    <!-- Facial expression: Skeptical / Retorting (Raised eyebrow, smirk) -->
    <circle cx="58" cy="116" r="1.5" fill="#1e293b"/>
    <!-- Raised Eyebrow -->
    <path d="M55 111 C58 109 61 111 61 111" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Smirking Mouth -->
    <path d="M56 125 C58 127 61 125 63 123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Crossed / Thinking Arms reflecting "Asking back" -->
    <!-- Arm 1 (Hand on chin) -->
    <path d="M55 145 C50 135 60 125 60 125" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hand touching chin -->
    <circle cx="60" cy="123" r="4" fill="#ffedd5"/>
    <!-- Arm 2 (Supporting elbow) -->
    <path d="M68 150 L50 160" stroke="#e11d48" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Dialogue / Thought Bubbles Illustrating "Fǎnwèn" (Asking Back Concept) -->
  <!-- Question 1 Bubble (Normal Question from Left) -->
  <g transform="translate(35, 75)">
    <path d="M15 25 C15 10 45 10 45 25 C45 40 15 40 15 25 Z" fill="url(#bubbleGrad)" stroke="#475569" stroke-width="1.5"/>
    <polygon points="25,38 30,48 35,38" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Question mark icon inside bubble -->
    <path d="M26 18 C26 15 34 15 34 19 C34 23 28 23 28 27" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="31" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Question 2 Bubble (Retorting / Asking back from Right - "Fǎnwèn") -->
  <g transform="translate(135, 60)">
    <path d="M10 25 C10 8 50 8 50 25 C50 42 10 42 10 25 Z" fill="url(#bubbleGrad)" stroke="#f43f5e" stroke-width="2"/>
    <polygon points="25,40 20,52 32,40" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <!-- Double Question Mark / Inverted Question concept representing "Fǎnwèn" -->
    <path d="M23 16 C23 13 33 13 33 17 C33 21 27 21 27 25" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="27" cy="29" r="1.5" fill="#fbbf24"/>
    <!-- Exclamation / Reversal accent -->
    <path d="M38 18 L38 26" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="30" r="1.5" fill="#f43f5e"/>
  </g>

</svg>