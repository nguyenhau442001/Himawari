<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Motion / Delivery Trail -->
    <path d="M 60 120 C 80 100, 110 100, 130 120" stroke="#3A4252" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" fill="none"/>
    <path d="M 110 105 L 130 120 L 115 135" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Hand (Sender/Helper) -->
    <path d="M 45 150 C 45 135, 55 130, 65 140 L 85 160 C 95 170, 90 185, 75 190 C 60 195, 45 180, 45 150 Z" fill="#3B82F6"/>
    <path d="M 55 145 L 75 165" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>

    <!-- Letter / Physical Object (The item being carried/passed: 捎) -->
    <g transform="translate(100, 85) rotate(-15)">
      <!-- Envelope Shadow -->
      <rect x="2" y="2" width="70" height="50" rx="6" fill="#000000" opacity="0.3"/>
      <!-- Envelope Body -->
      <rect width="70" height="50" rx="6" fill="#F3F4F6"/>
      <!-- Envelope Flap / Lines -->
      <path d="M 0 6 L 35 30 L 70 6" stroke="#D1D5DB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="20" y1="35" x2="50" y2="35" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
      <!-- Accent Stamp -->
      <rect x="50" y="10" width="12" height="10" rx="2" fill="#F59E0B"/>
    </g>

    <!-- Receiving Hand / Destination -->
    <path d="M 195 150 C 195 135, 185 130, 175 140 L 155 160 C 145 170, 150 185, 165 190 C 180 195, 195 180, 195 150 Z" fill="#60A5FA"/>
    <path d="M 185 145 L 165 165" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>

    <!-- Focal Accent Glow / Sparkle -->
    <path d="M 135 65 L 138 75 L 148 78 L 138 81 L 135 91 L 132 81 L 122 78 L 132 75 Z" fill="#F59E0B"/>
    <path d="M 75 95 L 77 100 L 82 102 L 77 104 L 75 109 L 73 104 L 68 102 L 73 100 Z" fill="#F59E0B" opacity="0.7"/>
  </g>
</svg>