<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="warmLamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Restaurant/Hotel Lobby Scene Context -->
  <!-- Wallpaper / Back wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4"/>
  
  <!-- Large Window with City Night Glow -->
  <path d="M 140 35 L 205 35 L 205 120 L 140 120 Z" fill="url(#windowGlow)" stroke="#475569" stroke-width="2"/>
  <line x1="172" y1="35" x2="172" y2="120" stroke="#475569" stroke-width="1.5"/>
  <line x1="140" y1="77" x2="205" y2="77" stroke="#475569" stroke-width="1.5"/>

  <!-- Warm Wall Lamp -->
  <path d="M 45 50 L 55 50 L 52 65 L 48 65 Z" fill="#94a3b8"/>
  <path d="M 50 65 Q 50 85 30 90 Q 60 90 50 65" fill="url(#warmLamp)" opacity="0.8"/>
  <circle cx="50" cy="50" r="3" fill="#cbd5e1"/>

  <!-- Restaurant/Hotel Counter Desk -->
  <path d="M 20 135 L 220 135 L 210 170 L 30 170 Z" fill="url(#tableGrad)" filter="url(#shadow)"/>
  <rect x="25" y="130" width="190" height="7" fill="#94a3b8" rx="2"/>

  <!-- Props on Counter: Menu, Bell, Plant -->
  <!-- Menu -->
  <polygon points="45,133 75,127 78,145 48,151" fill="#ec4899" />
  <line x1="53" y1="137" x2="68" y2="134" stroke="#fbcfe8" stroke-width="2"/>
  <line x1="55" y1="142" x2="70" y2="139" stroke="#fbcfe8" stroke-width="2"/>
  <!-- Service Bell -->
  <path d="M 90 135 Q 90 125 100 125 Q 110 125 110 135 Z" fill="#fbbf24"/>
  <rect x="88" y="134" width="24" height="3" fill="#d97706" rx="1"/>
  <!-- Small Plant -->
  <rect x="180" y="125" width="16" height="12" fill="#38bdf8" rx="2"/>
  <path d="M 188 125 Q 183 110 175 105" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 188 125 Q 195 112 205 108" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- CHARACTER 1: The Outraged Manager / Host (Left, Reacting with disbelief) -->
  <g transform="translate(15, 60)">
    <!-- Body / Suit -->
    <path d="M 35 75 L 55 75 L 60 110 L 30 110 Z" fill="#3b82f6"/>
    <path d="M 40 75 L 50 75 L 50 95 L 40 95 Z" fill="#f8fafc"/> <!-- Shirt -->
    <polygon points="45,75 50,88 40,88" fill="#ef4444"/> <!-- Tie -->

    <!-- Head & Hair -->
    <circle cx="45" cy="45" r="16" fill="#fde047"/> <!-- Face -->
    <path d="M 29 42 Q 35 25 55 35 Q 61 42 61 48 L 30 48 Z" fill="#1e293b"/> <!-- Hair -->

    <!-- Expressive Face (Shocked, Angry, Eyebrows furrowed, Mouth open in disbelief) -->
    <!-- Angry Eyebrows -->
    <line x1="36" y1="39" x2="43" y2="42" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="39" x2="47" y2="42" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes (Wide with shock) -->
    <circle cx="40" cy="46" r="2.5" fill="#1e293b"/>
    <circle cx="50" cy="46" r="2.5" fill="#1e293b"/>
    <!-- Open mouth (Shouting "Unbelievable!") -->
    <ellipse cx="45" cy="55" rx="4" ry="5" fill="#991b1b"/>

    <!-- Dynamic Gestures (Hands up in exasperation/disbelief) -->
    <path d="M 32 75 Q 15 65 20 50" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="20" cy="48" r="4" fill="#fde047"/>
    <path d="M 58 75 Q 75 65 70 50" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="48" r="4" fill="#fde047"/>
  </g>

  <!-- CHARACTER 2: The Mistreated Guest / Customer (Right, Walking away or turning back indignantly) -->
  <g transform="translate(130, 55)">
    <!-- Body / Casual Smart Jacket -->
    <path d="M 30 80 L 50 80 L 55 115 L 25 115 Z" fill="#6366f1"/>
    <!-- Head -->
    <circle cx="40" cy="50" r="15" fill="#ffedd5"/>
    <path d="M 26 50 Q 30 32 52 38 Q 55 48 55 52 L 25 52 Z" fill="#b45309"/> <!-- Stylish hair -->

    <!-- Face (Indignant, turning back, looking stern) -->
    <line x1="33" y1="46" x2="39" y2="48" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="47" y1="46" x2="41" y2="48" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="36" cy="51" r="2" fill="#1e293b"/>
    <circle cx="44" cy="51" r="2" fill="#1e293b"/>
    <path d="M 38 59 Q 40 57 43 59" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Stern mouth -->

    <!-- Gestures (Dismissive arm wave) -->
    <path d="M 48 85 Q 65 90 70 75" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="71" cy="72" r="3.5" fill="#ffedd5"/>
  </g>

  <!-- Visual Accent / Outrage Symbol (Stylized explosive exclamation aura, completely abstract, no text) -->
  <g transform="translate(100, 35)" filter="url(#shadow)">
    <path d="M 0 -10 L 4 -2 L 12 -4 L 6 3 L 10 10 L 2 7 L -3 12 L -2 4 L -10 2 L -4 -3 Z" fill="#fb923c" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#ef4444" opacity="0.8"/>
    <!-- Exclamation mark shape inside graphic -->
    <rect x="-1" y="-5" width="2" height="6" fill="#ffffff" rx="1"/>
    <circle cx="0" cy="4" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Floor shadow under counter and characters -->
  <ellipse cx="120" cy="195" rx="95" ry="10" fill="#020617" opacity="0.6"/>

</svg>