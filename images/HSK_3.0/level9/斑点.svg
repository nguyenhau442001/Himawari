<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow/elements -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>

  <!-- Sika Deer Silhouette / Body Segment representing "斑点" (Bāndiǎn) -->
  <!-- Contextual reference: 梅花鹿身上布满了一圈圈整齐漂亮的白色斑点 -->
  <g transform="translate(0, 0)">
    <!-- Deer body contour (sleek, modern flat vector shape in rich warm brown/amber) -->
    <path d="M 60,150 C 60,110 80,90 120,90 C 160,90 180,110 180,150 C 180,175 165,190 140,195 L 100,195 C 75,190 60,175 60,150 Z" 
          fill="#D97736" />
          
    <!-- Deer neck rising up gracefully -->
    <path d="M 85,115 C 85,90 95,70 110,50 L 130,50 C 135,70 140,90 140,115 Z" 
          fill="#D97736" />

    <!-- Clean, stylish white spots (斑点) - the core focus of the illustration -->
    <!-- Spot group 1 (Neck) -->
    <circle cx="110" cy="70" r="4.5" fill="#FFFFFF"/>
    <circle cx="123" cy="82" r="4" fill="#FFFFFF"/>
    <circle cx="102" cy="90" r="3.5" fill="#FFFFFF"/>

    <!-- Spot group 2 (Main body / flank - distinct, neat, beautiful white dots) -->
    <circle cx="85" cy="125" r="5" fill="#FFFFFF"/>
    <circle cx="110" cy="115" r="5.5" fill="#FFFFFF"/>
    <circle cx="135" cy="120" r="5" fill="#FFFFFF"/>
    <circle cx="155" cy="130" r="4.5" fill="#FFFFFF"/>

    <circle cx="75" cy="150" r="5" fill="#FFFFFF"/>
    <circle cx="98" cy="142" r="5.5" fill="#FFFFFF"/>
    <circle cx="122" cy="145" r="6" fill="#FFFFFF"/>
    <circle cx="150" cy="152" r="5" fill="#FFFFFF"/>
    <circle cx="168" cy="162" r="4" fill="#FFFFFF"/>

    <circle cx="90" cy="172" r="4.5" fill="#FFFFFF"/>
    <circle cx="115" cy="170" r="5" fill="#FFFFFF"/>
    <circle cx="140" cy="175" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Focus / Accent Ring to highlight the concept clearly for educational flashcard -->
  <circle cx="120" cy="140" r="72" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85"/>
</svg>