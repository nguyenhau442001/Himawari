<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Grid/Atmosphere Lines -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="40" y1="180" x2="200" y2="180" />
    <line x1="120" y1="50" x2="120" y2="180" />
  </g>

  <!-- Causality / Branching Metaphor for "倘若" (If / Suppose) -->
  <!-- Base Trunk / Present State -->
  <path d="M120 180 L120 130" stroke="#4A5568" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Baseline Node (Present) -->
  <circle cx="120" cy="180" r="4" fill="#64748B"/>

  <!-- Decision / Split Point (The Condition) -->
  <circle cx="120" cy="130" r="6" fill="#3B82F6"/>

  <!-- Alternative Path A (Faded / Unselected Condition) -->
  <path d="M120 130 C120 100, 70 100, 70 75" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/>
  <circle cx="70" cy="75" r="4" fill="#334155"/>

  <!-- Alternative Path B (Highlighted / The "What If" Scenario) -->
  <!-- Glowing / Vibrant path representing the conditional outcome -->
  <g>
    <!-- Glow effect -->
    <path d="M120 130 C120 100, 170 100, 170 75" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-opacity="0.3" fill="none"/>
    <!-- Main Path -->
    <path d="M120 130 C120 100, 170 100, 170 75" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Outcome Node -->
    <circle cx="170" cy="75" r="8" fill="#1A1D24" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="170" cy="75" r="3" fill="#FBBF24"/>
  </g>

  <!-- Abstract Rain / Contextual Symbolism (subtle floating elements representing "明天下雨" context without text) -->
  <g opacity="0.8">
    <!-- Cloud base -->
    <path d="M155 52 C155 45, 165 42, 172 48 C178 44, 188 48, 186 56 C192 58, 190 68, 182 70 L158 70 C151 68, 150 58, 155 52 Z" fill="#475569"/>
    
    <!-- Raindrops falling toward the highlighted branch -->
    <line x1="164" y1="76" x2="160" y2="84" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <line x1="174" y1="78" x2="170" y2="86" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Question / Possibility Indicator (Spark/Node above) -->
  <g transform="translate(120, 95)">
    <circle cx="0" cy="0" r="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <!-- Abstract branching icon inside badge -->
    <path d="M-4 4 L0 -4 L4 4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="0" cy="-6" r="1.5" fill="#F59E0B"/>
  </g>

  <!-- Future Timeline Anchor Points -->
  <circle cx="120" cy="130" r="2" fill="#FFFFFF"/>
</svg>