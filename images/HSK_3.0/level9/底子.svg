<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background glow for depth -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Conceptual illustration for "底子" (foundation, bedrock, base/backing) -->
  <g transform="translate(0, 5)">
    <!-- Deepest foundation layer (Bottom bedrock) -->
    <path d="M 60 165 L 180 165 L 195 190 L 45 190 Z" fill="#2D3748"/>
    <path d="M 60 165 L 180 165 L 180 172 L 60 172 Z" fill="#E67E22" opacity="0.3"/>
    
    <!-- Secondary foundation layer (Middle structural base) -->
    <path d="M 70 142 L 170 142 L 182 163 L 58 163 Z" fill="#3B4659"/>
    <path d="M 70 142 L 170 142 L 170 149 L 70 149 Z" fill="#E67E22" opacity="0.6"/>

    <!-- Primary base layer (Top foundational slab) -->
    <path d="M 80 120 L 160 120 L 170 140 L 70 140 Z" fill="#4A5568"/>
    <path d="M 80 120 L 160 120 L 160 126 L 80 126 Z" fill="#F39C12"/>

    <!-- Core pillar / Rising structure emerging from the solid base (Representing built-up potential from the foundation) -->
    <!-- Pillars/Columns representing core strength -->
    <rect x="92" y="70" width="14" height="50" rx="2" fill="#2E4057"/>
    <rect x="134" y="70" width="14" height="50" rx="2" fill="#2E4057"/>

    <!-- Glowing golden accent core / upward energy representing growth from solid foundation -->
    <rect x="113" y="65" width="14" height="55" rx="3" fill="#F39C12"/>
    <circle cx="120" cy="62" r="6" fill="#F1C40F"/>

    <!-- Architectural cap / apex indicating stability and established foundation -->
    <path d="M 88 70 L 152 70 L 120 48 Z" fill="#5A6B82"/>
    <path d="M 116 48 L 124 48 L 124 44 L 116 44 Z" fill="#F39C12"/>

    <!-- Structural grid lines on the foundation blocks (reinforcing the concept of solid backing/base) -->
    <line x1="100" y1="126" x2="90" y2="140" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="126" x2="150" y2="140" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="149" x2="78" y2="163" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="152" y1="149" x2="162" y2="163" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>

    <!-- Spark/Focus indicator on the foundation base to highlight "底" (bottom/foundation) -->
    <circle cx="120" cy="133" r="3" fill="#FFFFFF"/>
    <path d="M 120 128 L 120 138 M 115 133 L 125 133" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>