<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid representing a dictionary page layout -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 4">
    <line x1="120" y1="20" x2="120" y2="220" />
    <line x1="20" y1="120" x2="220" y2="120" />
  </g>

  <!-- Open Dictionary / Reference Book Base -->
  <g transform="translate(0, 10)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="185" rx="80" ry="12" fill="#111318" />

    <!-- Left Page -->
    <path d="M 40 70 Q 80 60 115 75 L 115 175 Q 80 160 40 170 Z" fill="#2A2F3D" />
    
    <!-- Right Page -->
    <path d="M 200 70 Q 160 60 125 75 L 125 175 Q 160 160 200 170 Z" fill="#2E3545" />

    <!-- Book Spine Center crease -->
    <line x1="120" y1="75" x2="120" y2="175" stroke="#1A1D24" stroke-width="4" />

    <!-- Abstract Text Lines on Left Page -->
    <line x1="55" y1="90" x2="95" y2="85" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="110" x2="100" y2="105" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="130" x2="85" y2="125" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />

    <!-- Abstract Text Lines on Right Page -->
    <line x1="145" y1="90" x2="185" y2="95" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
    <line x1="140" y1="110" x2="185" y2="115" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="130" x2="180" y2="135" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Magnifying Glass (Indexing/Looking up tool) Focusing on Radicals -->
  <g transform="translate(10, 5)">
    <!-- Glass Glow / Shadow -->
    <circle cx="110" cy="110" r="42" fill="#000000" opacity="0.3" />

    <!-- Lens Outer Rim -->
    <circle cx="110" cy="110" r="38" fill="none" stroke="#F6AD55" stroke-width="6" />

    <!-- Lens Glass Surface -->
    <circle cx="110" cy="110" r="35" fill="#3182CE" fill-opacity="0.25" />

    <!-- Highlight Reflection on Lens -->
    <path d="M 85 95 A 35 35 0 0 1 125 80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Magnified Radical / Character Component Focus -->
    <!-- Stylized structural component representing a Chinese radical (e.g., 氵 / 扌 / 亻) in high contrast gold -->
    <g transform="translate(95, 95) scale(1.2)">
      <!-- Radical strokes rendered as precise, geometric vector paths -->
      <path d="M 5 5 L 5 25 M 2 12 L 15 12" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" />
      <path d="M 18 8 L 26 22" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Magnifying Glass Handle -->
    <path d="M 136 136 L 175 175" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" />
    <!-- Handle grip accent -->
    <path d="M 148 148 L 168 168" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Indexing Tabs on the side of the dictionary -->
  <g transform="translate(0, 10)">
    <path d="M 200 85 L 210 90 L 210 105 L 200 110 Z" fill="#ED8936" />
    <path d="M 200 120 L 210 125 L 210 140 L 200 145" fill="#DD6B20" />
    <path d="M 200 155 L 210 160 L 210 175 L 200 180" fill="#C05621" />
  </g>

  <!-- Floating accent dots for modern clean UI feel -->
  <circle cx="45" cy="50" r="3" fill="#F6AD55" opacity="0.8" />
  <circle cx="195" cy="45" r="4" fill="#3182CE" opacity="0.8" />
  <circle cx="210" cy="190" r="3" fill="#F6AD55" opacity="0.6" />
  <circle cx="35" cy="185" r="2" fill="#3182CE" opacity="0.7" />
</svg>