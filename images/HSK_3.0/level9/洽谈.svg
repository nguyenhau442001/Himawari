<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Meeting Room -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Window Gradient -->
    <linearGradient id="window-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Drop Shadow for Characters/Table -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Interior Wall & Background Details -->
  <!-- City Skyline through large window -->
  <path d="M 60,30 L 60,110 L 180,110 L 180,30 Z" fill="url(#window-grad)" stroke="#334155" stroke-width="2"/>
  <rect x="75" y="55" width="12" height="55" fill="#334155" opacity="0.4"/>
  <rect x="95" y="45" width="16" height="65" fill="#334155" opacity="0.4"/>
  <rect x="125" y="65" width="14" height="45" fill="#334155" opacity="0.4"/>
  <rect x="150" y="50" width="18" height="60" fill="#334155" opacity="0.4"/>
  
  <!-- Warm Overhead Lamp Lighting -->
  <circle cx="120" cy="0" r="120" fill="url(#lamp-glow)" pointer-events="none"/>
  <path d="M 105,10 L 135,10 L 140,22 L 100,22 Z" fill="#475569"/>
  <line x1="120" y1="0" x2="120" y2="10" stroke="#64748b" stroke-width="2"/>

  <!-- Meeting Table with Shadow -->
  <ellipse cx="120" cy="165" rx="75" ry="25" fill="#090d16" filter="url(#shadow)"/>
  <path d="M 45,155 L 195,155 L 205,175 L 35,175 Z" fill="#334155"/>
  <path d="M 50,155 L 190,155 L 190,162 L 50,162 Z" fill="#475569"/> <!-- Table edge highlight -->
  
  <!-- Table Props: Laptops, Documents, Coffee Cups -->
  <!-- Left Laptop -->
  <path d="M 60,155 L 85,155 L 80,142 L 65,142 Z" fill="#64748b"/>
  <path d="M 56,156 L 89,156 L 92,159 L 53,159 Z" fill="#94a3b8"/>
  
  <!-- Right Laptop -->
  <path d="M 155,155 L 180,155 L 175,142 L 160,142 Z" fill="#64748b"/>
  <path d="M 151,156 L 184,156 L 187,159 L 148,159 Z" fill="#94a3b8"/>

  <!-- Center Document / Blueprint of Cooperation -->
  <rect x="105" y="148" width="30" height="20" rx="2" fill="#f8fafc" transform="rotate(-5 120 158)"/>
  <line x1="110" y1="152" x2="128" y2="152" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="110" y1="157" x2="125" y2="157" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="126" cy="162" r="3" fill="#ec4899"/> <!-- Red seal/signature accent -->

  <!-- Coffee Cups -->
  <rect x="38" y="148" width="10" height="12" rx="2" fill="#f1f5f9"/>
  <path d="M 48,150 C 51,150 51,156 48,156" stroke="#f1f5f9" stroke-width="1.5" fill="none"/>
  
  <rect x="192" y="148" width="10" height="12" rx="2" fill="#f1f5f9"/>
  <path d="M 192,150 C 189,150 189,156 192,156" stroke="#f1f5f9" stroke-width="1.5" fill="none"/>

  <!-- CHARACTER LEFT (Professional Negotiator - Male in Blue Suit) -->
  <g id="character-left">
    <!-- Torso & Shoulders -->
    <path d="M 40,200 L 40,165 C 40,145 60,135 75,135 C 90,135 105,145 105,165 L 105,200 Z" fill="#1e3a8a"/>
    <!-- Shirt & Tie -->
    <polygon points="75,145 85,165 65,165" fill="#f8fafc"/>
    <polygon points="73,155 77,155 78,175 75,182 72,175" fill="#ef4444"/> <!-- Red Tie -->
    <!-- Suit lapels -->
    <path d="M 75,145 L 62,175 L 68,180 Z" fill="#172554"/>
    <path d="M 75,145 L 88,175 L 82,180 Z" fill="#172554"/>

    <!-- Head & Neck -->
    <rect x="68" y="125" width="14" height="16" fill="#fbcfe8" rx="4"/>
    <circle cx="75" cy="115" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 60,112 C 60,102 70,100 77,100 C 87,100 90,108 90,118 L 90,112 C 90,105 82,102 75,102 C 68,102 60,107 60,112 Z" fill="#334155"/>
    
    <!-- Face details (Engaged expression, smiling/talking) -->
    <circle cx="70" cy="114" r="1.5" fill="#0f172a"/>
    <circle cx="80" cy="114" r="1.5" fill="#0f172a"/>
    <path d="M 73,120 Q 75,123 78,120" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Gesturing Arm (Pointing/Explaining constructively) -->
    <path d="M 45,155 C 50,150 65,155 75,165" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="78" cy="167" r="5" fill="#fbcfe8"/> <!-- Hand -->
  </g>

  <!-- CHARACTER RIGHT (Professional Partner - Female in Emerald/Teal Outfit) -->
  <g id="character-right">
    <!-- Torso & Shoulders -->
    <path d="M 200,200 L 200,165 C 200,145 180,135 165,135 C 150,135 135,145 135,165 L 135,200 Z" fill="#065f46"/>
    <!-- Inner blouse -->
    <path d="M 165,145 L 175,165 L 155,165 Z" fill="#a7f3d0"/>
    <!-- Necklace / Detail -->
    <circle cx="165" cy="153" r="2.5" fill="#fbbf24"/>

    <!-- Head & Neck -->
    <rect x="158" y="125" width="14" height="16" fill="#fed7aa" rx="4"/>
    <circle cx="165" cy="115" r="15" fill="#fed7aa"/>
    <!-- Hair (Stylized Bun/Bob) -->
    <path d="M 150,110 C 150,98 180,98 180,112 C 180,120 175,125 175,130 L 155,130 C 155,125 150,120 150,110 Z" fill="#1e293b"/>
    <circle cx="165" cy="98" r="6" fill="#1e293b"/> <!-- Bun -->

    <!-- Face details (Listening intently, thoughtful smile) -->
    <circle cx="160" cy="114" r="1.5" fill="#1e293b"/>
    <circle cx="170" cy="114" r="1.5" fill="#1e293b"/>
    <path d="M 163,120 Q 165,122 168,120" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Gesturing Arm (Leaning in, hand resting on chin/table in agreement) -->
    <path d="M 195,155 C 190,150 175,155 165,160" stroke="#065f46" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="158" cy="162" r="5" fill="#fed7aa"/> <!-- Hand -->
  </g>

  <!-- Foreground Atmospheric Highlights (Modern Tech Glow Accents) -->
  <circle cx="30" cy="190" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="210" cy="100" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="25" cy="70" r="2.5" fill="#f59e0b" opacity="0.5"/>
</svg>