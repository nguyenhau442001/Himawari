<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#252932"/>
  
  <!-- Character: Little Girl -->
  <g transform="translate(120, 180)">
    <!-- Legs -->
    <rect x="-15" y="-60" width="10" height="60" fill="#FFD180"/>
    <rect x="5" y="-60" width="10" height="60" fill="#FFD180"/>
    <!-- Body -->
    <rect x="-20" y="-110" width="40" height="50" rx="5" fill="#4A90E2"/>
    <!-- Head -->
    <circle cx="0" cy="-135" r="25" fill="#FFD180"/>
    <!-- Hair -->
    <path d="M-25 -135 C -25 -160, 25 -160, 25 -135 L 25 -120 L -25 -120 Z" fill="#5D4037"/>
    <!-- Arms (Action: Holding a broom) -->
    <path d="M-20 -90 L -45 -60" stroke="#FFD180" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 -90 L 40 -70" stroke="#FFD180" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Broom -->
  <g transform="translate(160, 110)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 70 L 15 70 L 10 95 L -10 95 Z" fill="#D7CCC8"/>
    <path d="M-12 70 L 12 70" stroke="#A1887F" stroke-width="2"/>
  </g>
  
  <!-- Dustpan (Object of action) -->
  <g transform="translate(80, 170)">
    <path d="M-20 0 L 20 0 L 15 15 L -15 15 Z" fill="#E0E0E0"/>
    <rect x="-25" y="-5" width="50" height="5" fill="#BDBDBD"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M140 120 Q 150 110 160 120" stroke="#FFB74D" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M145 130 Q 155 120 165 130" stroke="#FFB74D" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>