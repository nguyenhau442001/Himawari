<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing accent background representing mystery/disappearance -->
  <circle cx="120" cy="115" r="70" fill="#222834" opacity="0.8"/>
  <ellipse cx="120" cy="180" rx="55" ry="8" fill="#12151B"/>

  <!-- Desk Drawer Unit -->
  <g transform="translate(60, 110)">
    <!-- Main desk body / drawer frame -->
    <rect x="0" y="0" width="120" height="75" rx="6" fill="#2C3440" stroke="#3A4454" stroke-width="2"/>
    
    <!-- Open Drawer slot cut-out (dark interior) -->
    <rect x="12" y="12" width="96" height="52" rx="4" fill="#15181E"/>

    <!-- Drawer handle -->
    <rect x="48" y="32" width="24" height="6" rx="3" fill="#6272A4"/>
  </g>

  <!-- The Disappearing Confidential Document & Motion Trails -->
  <g transform="translate(0, 0)">
    <!-- Motion particle dust / sparkle trails -->
    <circle cx="95" cy="85" r="3" fill="#F1FA8C" opacity="0.5"/>
    <circle cx="108" cy="72" r="2" fill="#F1FA8C" opacity="0.8"/>
    <circle cx="128" cy="55" r="4" fill="#FFB86C" opacity="0.9"/>
    <circle cx="145" cy="42" r="2.5" fill="#FFB86C" opacity="0.6"/>
    <path d="M 85 95 Q 110 70 135 45" stroke="#FFB86C" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.6"/>

    <!-- Document transforming / fading into wings/lines as it flies out -->
    <!-- Wing-like stylized paper trailing upward -->
    <path d="M 125 50 L 155 35 L 140 65 Z" fill="#FFB86C" opacity="0.4"/>
    <path d="M 115 60 L 95 40 L 110 50 Z" fill="#FFB86C" opacity="0.4"/>

    <!-- Main File Folder (Tilting upward, floating out of drawer) -->
    <g transform="translate(100, 55) rotate(-25)">
      <!-- Folder back -->
      <rect x="0" y="0" width="55" height="42" rx="3" fill="#E2E8F0"/>
      <!-- Folder tab -->
      <path d="M 5 0 L 22 0 L 25 -6 L 8 -6 Z" fill="#CBD5E1"/>
      <!-- Document lines inside -->
      <line x1="10" y1="10" x2="35" y2="10" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="20" x2="45" y2="20" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="30" x2="28" y2="30" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <!-- Red Confidential Stamp / Seal -->
      <circle cx="42" cy="28" r="7" fill="#FF5555" opacity="0.85"/>
      <rect x="39" y="26.5" width="6" height="3" rx="1" fill="#FFFFFF"/>
    </g>
  </g>
</svg>