<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stack of ornate, heavy, decorative book blocks representing "piling up" of words -->
  <g transform="translate(60, 60)">
    <!-- Bottom block -->
    <rect x="0" y="100" width="120" height="20" fill="#FFB347" rx="2"/>
    <rect x="5" y="105" width="110" height="10" fill="#E69138" rx="1"/>
    
    <!-- Middle block -->
    <rect x="10" y="70" width="100" height="25" fill="#FFD700" rx="2"/>
    <rect x="15" y="75" width="90" height="15" fill="#C6A000" rx="1"/>
    
    <!-- Top block -->
    <rect x="20" y="45" width="80" height="20" fill="#FFB347" rx="2"/>
    <rect x="25" y="50" width="70" height="10" fill="#E69138" rx="1"/>
    
    <!-- Top-most small block -->
    <rect x="35" y="30" width="50" height="10" fill="#FFD700" rx="2"/>
  </g>
  
  <!-- Decorative flourish lines suggesting excess/clutter -->
  <path d="M180 150 L200 130 M190 160 L210 140" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 150 L20 130 M30 160 L10 140" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
</svg>