<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road intersection / asphalt surface -->
  <path d="M 60,110 L 180,110 L 180,150 L 60,150 Z" fill="#252A34"/>
  
  <!-- Dashed lane divider -->
  <line x1="60" y1="130" x2="90" y2="130" stroke="#4B5563" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="110" y1="130" x2="140" y2="130" stroke="#4B5563" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="160" y1="130" x2="180" y2="130" stroke="#4B5563" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Road construction barrier / roadblock on the right -->
  <rect x="165" y="105" width="10" height="50" rx="2" fill="#374151"/>
  <path d="M 165,115 L 175,120 L 165,125 Z" fill="#F59E0B"/>
  <path d="M 165,135 L 175,140 L 165,145 Z" fill="#EF4444"/>

  <!-- U-Turn Path Indicator (Glowing curved arrow representing "Diàotóu") -->
  <path d="M 130,100 C 130,75 80,75 80,105 C 80,115 95,120 100,120" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>
  <!-- Arrowhead pointing left -->
  <polygon points="95,112 85,120 97,126" fill="#F59E0B"/>

  <!-- Modern Sleek Car performing the U-turn (facing left/backwards) -->
  <g transform="translate(95, 112)">
    <!-- Car Shadow -->
    <ellipse cx="20" cy="22" rx="22" ry="5" fill="#0D1117" opacity="0.6"/>
    
    <!-- Car Body (Sleek Modern Hatchback/Sedan) -->
    <path d="M 4,14 C 6,9 12,6 22,6 C 32,6 36,9 38,14 L 40,19 C 40,21 38,23 35,23 L 7,23 C 4,23 2,21 2,19 Z" fill="#3B82F6"/>
    
    <!-- Roof / Cabin Glass -->
    <path d="M 14,14 L 20,9 L 28,9 L 31,14 Z" fill="#1E293B"/>
    
    <!-- Headlights (Front pointing left) -->
    <circle cx="4" cy="16" r="1.5" fill="#FBBF24"/>
    
    <!-- Wheels -->
    <circle cx="10" cy="22" r="4" fill="#111827"/>
    <circle cx="10" cy="22" r="1.5" fill="#9CA3AF"/>
    
    <circle cx="32" cy="22" r="4" fill="#111827"/>
    <circle cx="32" cy="22" r="1.5" fill="#9CA3AF"/>
  </g>
</svg>