<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Hand peeling the sweet potato -->
  <g transform="translate(60, 60)">
    <!-- Sweet Potato Body -->
    <path d="M120,60 C140,60 160,80 160,100 C160,120 140,140 120,140 C100,140 80,120 80,100 C80,80 100,60 120,60 Z" fill="#D35400"/>
    
    <!-- Peeling Skin Flap -->
    <path d="M120,60 C100,60 80,70 70,80 L90,90 C100,80 110,75 120,75 Z" fill="#E67E22"/>
    
    <!-- Inner Flesh -->
    <path d="M85,95 C100,90 120,90 135,95 C130,110 110,120 90,115 Z" fill="#F39C12"/>
    
    <!-- Hand -->
    <g transform="translate(40, 30)">
      <path d="M40,60 C40,40 60,30 70,30 C80,30 90,40 90,60 L85,80 C80,85 70,85 65,80 L60,65" fill="#F1C40F"/>
      <path d="M70,30 L75,20 C80,15 90,15 95,20 L95,40" fill="#F1C40F"/>
      <path d="M80,30 L85,20 C90,15 100,15 105,20 L105,40" fill="#F1C40F"/>
      <path d="M90,35 L95,25 C100,20 110,20 115,25 L115,45" fill="#F1C40F"/>
    </g>
  </g>
  
  <!-- Steam effect -->
  <path d="M140,100 Q145,80 140,60 M150,90 Q155,70 150,50" stroke="#BDC3C7" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>