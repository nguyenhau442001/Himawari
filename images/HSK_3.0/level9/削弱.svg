<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (abstract crumbling structure representing declining power/strength) -->
  <g opacity="0.3">
    <path d="M 60 180 L 100 120 L 80 180 Z" fill="#64748B"/>
    <path d="M 180 180 L 140 100 L 160 180 Z" fill="#64748B"/>
    <line x1="50" y1="180" x2="190" y2="180" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Central Action: Two forces/pillars declining and fracturing (Visualizing "削弱" - weakening/diminishing strength) -->
  
  <!-- Left Pillar / Strength Representation (Collapsing/Fading) -->
  <g transform="translate(65, 80)">
    <!-- Shield/Tower base -->
    <path d="M 0 10 L 25 0 L 50 10 L 50 60 C 50 75 25 90 25 90 C 25 90 0 75 0 60 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Crack indicating weakening -->
    <path d="M 25 20 L 20 40 L 30 55 L 22 75" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fading motion/particle effects -->
    <circle cx="-10" cy="30" r="2" fill="#F59E0B" opacity="0.8"/>
    <circle cx="-5" cy="15" r="1.5" fill="#F59E0B" opacity="0.6"/>
  </g>

  <!-- Right Pillar / Strength Representation (Collapsing/Fading) -->
  <g transform="translate(125, 80)">
    <!-- Shield/Tower base -->
    <path d="M 0 10 L 25 0 L 50 10 L 50 60 C 50 75 25 90 25 90 C 25 90 0 75 0 60 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Crack indicating weakening -->
    <path d="M 25 15 L 30 35 L 20 50 L 28 70" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fading motion/particle effects -->
    <circle cx="60" cy="35" r="2" fill="#F59E0B" opacity="0.8"/>
    <circle cx="55" cy="20" r="1.5" fill="#F59E0B" opacity="0.6"/>
  </g>

  <!-- Dynamic human action / Cause effect: Hands interacting to reduce/diminish strength -->
  <!-- Top hands pressing down, eroding the power -->
  <g>
    <!-- Left downward hand -->
    <path d="M 75 55 C 80 50 95 45 105 55 C 110 60 105 68 95 65 Z" fill="#94A3B8"/>
    <path d="M 95 65 L 115 75" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right downward hand -->
    <path d="M 165 55 C 160 50 145 45 135 55 C 130 60 135 68 145 65 Z" fill="#94A3B8"/>
    <path d="M 145 65 L 125 75" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Motion lines indicating downward pressure / reduction -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 85 40 L 95 50" />
    <path d="M 155 40 L 145 50" />
    <path d="M 120 30 L 120 45" />
  </g>

  <!-- Energy / Power dissipation effects (downward fading bars representing loss of strength) -->
  <g transform="translate(0, 10)">
    <rect x="95" y="170" width="50" height="6" rx="3" fill="#EF4444" opacity="0.8"/>
    <rect x="102" y="182" width="36" height="5" rx="2.5" fill="#EF4444" opacity="0.5"/>
    <rect x="110" y="192" width="20" height="4" rx="2" fill="#EF4444" opacity="0.3"/>
  </g>

  <!-- Accent dynamic slash cutting across to signify the action of weakening -->
  <path d="M 60 110 L 180 140" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
</svg>