<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Soft ambient glow behind the bush -->
  <circle cx="120" cy="130" r="70" fill="#253238" opacity="0.5"/>

  <!-- Ground shadow / base -->
  <ellipse cx="120" cy="190" rx="65" ry="12" fill="#111318"/>

  <!-- BACK LAYER OF BUSH (Darker foliage for depth) -->
  <path d="M75 160 C50 160 45 125 70 110 C60 85 90 65 110 80 C130 60 165 75 165 105 C190 115 190 150 165 165 Z" fill="#203E30"/>

  <!-- MIDDLE LAYER OF BUSH -->
  <path d="M85 175 C60 175 55 135 80 120 C70 95 105 75 125 90 C145 75 175 95 170 125 C195 140 180 175 155 175 Z" fill="#2C5943"/>

  <!-- FOREGROUND LAYER OF BUSH (Vibrant green clusters) -->
  <circle cx="95" cy="145" r="32" fill="#387556"/>
  <circle cx="145" cy="140" r="35" fill="#387556"/>
  <circle cx="120" cy="120" r="38" fill="#438C67"/>
  <circle cx="100" cy="105" r="28" fill="#438C67"/>
  <circle cx="140" cy="105" r="30" fill="#438C67"/>

  <!-- Highlights on leaves -->
  <path d="M120 85 C110 85 105 95 110 100 C115 105 125 100 125 90 Z" fill="#54AB7F" opacity="0.6"/>
  <path d="M90 130 C80 130 75 140 85 145 C95 150 100 140 95 135 Z" fill="#54AB7F" opacity="0.6"/>
  <path d="M150 125 C160 125 165 135 155 140 C145 145 140 135 145 130 Z" fill="#54AB7F" opacity="0.6"/>

  <!-- Wild Roses (Bright red/magenta petals with gold centers matching the reference sentence) -->
  <!-- Rose 1 (Top) -->
  <g transform="translate(120, 95)">
    <circle cx="0" cy="0" r="14" fill="#E03E6D"/>
    <circle cx="0" cy="0" r="11" fill="#FF5C8A"/>
    <circle cx="0" cy="0" r="4" fill="#FFD15C"/>
  </g>

  <!-- Rose 2 (Left) -->
  <g transform="translate(85, 125)">
    <circle cx="0" cy="0" r="12" fill="#C72C5B"/>
    <circle cx="0" cy="0" r="9" fill="#E03E6D"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFD15C"/>
  </g>

  <!-- Rose 3 (Right) -->
  <g transform="translate(155, 120)">
    <circle cx="0" cy="0" r="13" fill="#C72C5B"/>
    <circle cx="0" cy="0" r="10" fill="#E03E6D"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFD15C"/>
  </g>

  <!-- Rose 4 (Bottom Center) -->
  <g transform="translate(125, 145)">
    <circle cx="0" cy="0" r="11" fill="#E03E6D"/>
    <circle cx="0" cy="0" r="8" fill="#FF5C8A"/>
    <circle cx="0" cy="0" r="3" fill="#FFD15C"/>
  </g>

  <!-- Rose 5 (Small background accent) -->
  <g transform="translate(95, 85)">
    <circle cx="0" cy="0" r="9" fill="#C72C5B"/>
    <circle cx="0" cy="0" r="3" fill="#FFD15C"/>
  </g>

  <!-- Elegant golden butterfly attracted to the bush -->
  <g transform="translate(165, 75) rotate(-25)">
    <!-- Wings -->
    <path d="M0 0 C-15 -15 -25 -5 -10 10 C-5 15 0 10 0 0 Z" fill="#FFB703"/>
    <path d="M0 0 C-12 12 -20 18 -5 15 C2 12 5 5 0 0 Z" fill="#FB8500"/>
    <path d="M0 0 C15 -15 25 -5 10 10 C5 15 0 10 0 0 Z" fill="#FFB703"/>
    <path d="M0 0 C12 12 20 18 5 15 C-2 12 -5 5 0 0 Z" fill="#FB8500"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="1.5" ry="8" fill="#1A1D24"/>
  </g>

</svg>