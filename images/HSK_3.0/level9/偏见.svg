<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Effects -->
  <circle cx="120" cy="100" r="100" fill="url(#spotlight)" />
  <polygon points="0,0 140,0 190,240 0,240" fill="url(#windowLight)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall / Architectural lines -->
  <line x1="0" y1="165" x2="240" y2="165" stroke="#334155" stroke-width="2" />
  <rect x="25" y="45" width="40" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="45" y1="45" x2="45" y2="120" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="82" x2="65" y2="82" stroke="#334155" stroke-width="1.5" />

  <!-- House Plant (Context Prop) -->
  <path d="M195,165 Q195,135 210,120 Q225,135 225,165 Z" fill="#10b981" opacity="0.8" />
  <path d="M210,165 L210,140" stroke="#059669" stroke-width="2" />
  <path d="M185,165 Q180,145 195,135 Q205,145 200,165 Z" fill="#059669" opacity="0.9" />
  <path d="M200,165 L220,165 L215,190 L205,190 Z" fill="#475569" />

  <!-- Meeting Table -->
  <path d="M40,175 L200,175 L210,195 L30,195 Z" fill="#334155" filter="url(#shadow)" />
  <rect x="50" y="195" width="12" height="30" fill="#1e293b" />
  <rect x="178" y="195" width="12" height="30" fill="#1e293b" />

  <!-- Desk Props (Papers, Coffee Cup) -->
  <rect x="95" y="178" width="22" height="15" rx="2" fill="#f8fafc" transform="rotate(-5 95 178)" />
  <rect x="112" y="180" width="20" height="14" rx="2" fill="#e2e8f0" transform="rotate(8 112 180)" />
  <path d="M145,185 C145,180 155,180 155,185 L157,193 C157,195 153,195 143,195 Z" fill="#fb923c" />
  <path d="M155,183 C160,183 160,190 155,191" fill="none" stroke="#fb923c" stroke-width="2" />

  <!-- MAIN SCENARIO: ELIMINATING PREJUDICE (Two people connecting, breaking barrier) -->

  <!-- Character Left (Person A - Warm, welcoming gesture) -->
  <g id="character-left">
    <!-- Chair -->
    <path d="M55,195 L40,145 L70,145 Z" fill="#475569" opacity="0.4" />
    <!-- Body -->
    <path d="M60,170 C60,150 75,145 85,145 C95,145 105,155 105,175 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="85" cy="120" r="15" fill="#fde047" />
    <!-- Hair -->
    <path d="M70,120 C70,105 100,105 100,120 C100,115 95,110 85,110 C75,110 70,115 70,120 Z" fill="#475569" />
    <!-- Arm reaching out -->
    <path d="M85,150 Q110,150 125,145" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <!-- Hand open -->
    <circle cx="127" cy="144" r="4" fill="#fde047" />
  </g>

  <!-- Character Right (Person B - Receptive, smiling, posture opens up) -->
  <g id="character-right">
    <!-- Chair -->
    <path d="M185,195 L200,145 L170,145 Z" fill="#475569" opacity="0.4" />
    <!-- Body -->
    <path d="M180,170 C180,150 165,145 155,145 C145,145 135,155 135,175 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="155" cy="120" r="15" fill="#fde047" />
    <!-- Hair -->
    <path d="M140,120 C140,105 170,105 170,120 C165,110 145,110 140,120 Z" fill="#1e293b" />
    <!-- Arm meeting -->
    <path d="M155,150 Q135,150 127,144" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />
    <!-- Hand meeting -->
    <circle cx="125" cy="144" r="4" fill="#fde047" />
  </g>

  <!-- ABSTRACT PREJUDICE / BARRIER BEING DISSOLVED (Visual Metaphor) -->
  <!-- Fading barrier particles / Breaking dark glass concept in the middle -->
  <g id="dissolving-barrier" opacity="0.8">
    <!-- Shattering shapes floating upwards -->
    <path d="M120,100 L126,90 L122,85 Z" fill="#94a3b8" opacity="0.5" />
    <path d="M128,125 L135,118 L130,115 Z" fill="#64748b" opacity="0.4" />
    <path d="M115,140 L120,132 L112,130 Z" fill="#64748b" opacity="0.3" />
    
    <!-- Glowing connection spark where hands meet (Eliminating bias / mutual understanding) -->
    <circle cx="126" cy="144" r="12" fill="#fbbf24" opacity="0.3" filter="url(#shadow)" />
    <circle cx="126" cy="144" r="6" fill="#fef08a" />
    
    <!-- Sparkles/Stars indicating positive change and harmony -->
    <path d="M126,115 L128,122 L135,124 L128,126 L126,133 L124,126 L117,124 L124,122 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M100,95 L101,98 L104,99 L101,100 L100,103 L99,100 L96,99 L99,98 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M150,100 L151,103 L154,104 L151,105 L150,108 L149,105 L146,104 L149,103 Z" fill="#ec4899" opacity="0.8" />
  </g>

</svg>