<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light from Desk Lamp -->
  <polygon points="120,40 20,200 220,200" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Background Environment (Bookshelf & Window) -->
  <g fill="#334155" opacity="0.6">
    <rect x="25" y="45" width="40" height="8" rx="2"/>
    <rect x="30" y="53" width="8" height="22"/>
    <rect x="42" y="50" width="6" height="25"/>
    <rect x="52" y="48" width="10" height="27"/>
  </g>
  <g fill="#475569" opacity="0.4">
    <rect x="175" y="40" width="35" height="6" rx="2"/>
    <rect x="180" y="46" width="6" height="24"/>
    <rect x="190" y="48" width="8" height="22"/>
  </g>

  <!-- Window Frame -->
  <rect x="155" y="65" width="55" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="182" y1="65" x2="182" y2="135" stroke="#334155" stroke-width="2"/>
  <line x1="155" y1="100" x2="210" y2="100" stroke="#334155" stroke-width="2"/>
  <!-- Cityscape silhouette outside -->
  <path d="M160,135 L160,115 L168,115 L168,135 L175,135 L175,105 L179,105 L179,135 L195,135 L195,95 L205,95 L205,135 Z" fill="#1e293b"/>

  <!-- Desk Surface -->
  <path d="M10,180 L230,180 L220,225 L20,225 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <path d="M10,180 L230,180 L230,184 L10,184 Z" fill="#475569"/>

  <!-- Desk Lamp -->
  <path d="M195,180 L205,180 L205,110 L195,110 Z" fill="#64748b"/>
  <path d="M185,100 L215,100 L225,115 L175,115 Z" fill="#fbbf24" filter="url(#shadow)"/>
  <ellipse cx="200" cy="180" rx="15" ry="5" fill="#475569"/>

  <!-- Documents & Translation Comparison Setup (The Core Action: 对照) -->
  <!-- Left Document (Original text) -->
  <g transform="translate(45, 145) rotate(-5)" filter="url(#shadow)">
    <rect width="65" height="55" rx="3" fill="#f8fafc"/>
    <rect x="8" y="8" width="20" height="4" rx="1" fill="#cbd5e1"/>
    <line x1="8" y1="18" x2="55" y2="18" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="26" x2="48" y2="26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="34" x2="52" y2="34" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="42" x2="35" y2="42" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right Document (Translation being checked) -->
  <g transform="translate(110, 140) rotate(4)" filter="url(#shadow)">
    <rect width="65" height="55" rx="3" fill="#f1f5f9"/>
    <rect x="8" y="8" width="20" height="4" rx="1" fill="#94a3b8"/>
    <line x1="8" y1="18" x2="55" y2="18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="26" x2="42" y2="26" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="34" x2="50" y2="34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="42" x2="45" y2="42" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Correction mark (checkmark / highlight) -->
    <circle cx="50" cy="42" r="5" fill="#10b981"/>
    <path d="M48,42 L49.5,43.5 L53,39.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Connecting magnifying / scanning indicator line (Visual metaphor for comparison/对照) -->
  <path d="M78,155 Q97,135 125,148" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Character (Student / Translator working diligently) -->
  <g id="character">
    <!-- Body / Torso with Hoodie/Sweater -->
    <path d="M60,225 C60,195 75,180 95,180 L125,180 C145,180 160,195 160,225 Z" fill="#4f46e5" filter="url(#shadow)"/>
    <!-- Collar / Details -->
    <path d="M90,180 L95,190 L125,190 L130,180" fill="#312e81"/>

    <!-- Neck -->
    <rect x="98" y="165" width="14" height="20" fill="#fcd34d"/>

    <!-- Head & Face -->
    <circle cx="105" cy="135" r="24" fill="#fde047" filter="url(#shadow)"/>
    <path d="M81,135 C81,120 92,111 105,111 C118,111 129,120 129,135 C129,135 110,138 105,138 C100,138 81,135 81,135 Z" fill="#1e293b"/> <!-- Hair -->

    <!-- Focused Eyes & Expression -->
    <circle cx="96" cy="136" r="3" fill="#0f172a"/>
    <circle cx="114" cy="136" r="3" fill="#0f172a"/>
    <!-- Glasses -->
    <rect x="91" y="131" width="10" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="109" y="131" width="10" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="101" y1="135" x2="109" y2="135" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Eyebrows in concentration -->
    <line x1="93" y1="128" x2="100" y2="130" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="110" y1="130" x2="117" y2="128" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Determined Mouth -->
    <path d="M102,146 Q105,148 108,146" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms & Hands actively comparing documents -->
    <!-- Left Arm -->
    <path d="M70,190 L85,160 L95,165 L80,200 Z" fill="#4f46e5"/>
    <!-- Left Hand pointing/holding left document -->
    <circle cx="85" cy="158" r="5" fill="#fcd34d"/>

    <!-- Right Arm -->
    <path d="M150,195 L135,165 L125,170 L140,210 Z" fill="#4f46e5"/>
    <!-- Right Hand holding pen over right document -->
    <circle cx="125" cy="168" r="5" fill="#fcd34d"/>
    <!-- Pen -->
    <line x1="125" y1="168" x2="135" y2="155" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug for cozy study atmosphere -->
  <g transform="translate(185, 155)" filter="url(#shadow)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#e2e8f0"/>
    <path d="M16,9 C20,9 20,17 16,19" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M3,2 L13,2" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M5,0 Q7,-4 5,-8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M11,-1 Q13,-5 11,-9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>