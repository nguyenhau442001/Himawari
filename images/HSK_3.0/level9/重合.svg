<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- First shape (base) -->
  <path d="M70 80 L170 80 L150 160 L50 160 Z" fill="#3A3F4B" stroke="#FFB84D" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Second shape (overlapping) -->
  <path d="M70 80 L170 80 L150 160 L50 160 Z" fill="none" stroke="#FFB84D" stroke-width="4" stroke-dasharray="0 0" opacity="0.8"/>
  
  <!-- Highlight of the overlap area -->
  <path d="M70 80 L170 80 L150 160 L50 160 Z" fill="#FFB84D" fill-opacity="0.2"/>
  
  <!-- Visual indicator of alignment/precision -->
  <circle cx="110" cy="120" r="6" fill="#FFB84D"/>
  <path d="M110 100 L110 140" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  <path d="M90 120 L130 120" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
</svg>