<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Meeting Room / Interior -->
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Flag Red Gradient -->
    <linearGradient id="flag-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Window Cityscape Glow -->
    <linearGradient id="window-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  
  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" fill="url(#lamp-glow)" />

  <!-- WINDOW & EXTERIOR CONTEXT (Setting the scene: Hanoi/Vietnam civic institution context) -->
  <g transform="translate(130, 25)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="85" height="110" rx="6" fill="url(#window-sky)" stroke="#334155" stroke-width="2"/>
    
    <!-- Exterior Cityscape Silhouette (Vietnam Urban Landmark motif hint) -->
    <path d="M10 110 L10 70 L18 70 L18 110 L25 110 L25 45 L35 45 L35 110 L45 110 L45 60 L55 60 L55 110 L70 110 L70 85 L75 85 L75 110 Z" fill="#1e293b" opacity="0.8"/>
    <!-- Distant Lotus / Iconic Tower Silhouette hint -->
    <path d="M50 75 Q60 50 62 30 Q64 50 74 75 Z" fill="#38bdf8" opacity="0.15"/>
    
    <!-- Window Pane Dividers -->
    <line x1="42" y1="0" x2="42" y2="110" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="55" x2="85" y2="55" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- INTERIOR WALL & DECOR -->
  <!-- Official Emblem Wall Mount (Gold Star & Red Background motif representing Republic/Socialist Republic context) -->
  <g transform="translate(85, 30)">
    <circle cx="20" cy="20" r="16" fill="url(#flag-red)" stroke="#fbbf24" stroke-width="2"/>
    <!-- Golden Star -->
    <polygon points="20,8 22.4,14.5 29.2,14.8 23.8,18.8 25.8,25.4 20,21.6 14.2,25.4 16.2,18.8 10.8,14.8 17.6,14.5" fill="#fbbf24"/>
  </g>

  <!-- INTERIOR FURNITURE: Conference Table & Props -->
  <g transform="translate(15, 155)">
    <!-- Table Surface -->
    <path d="M0 25 L140 25 L155 65 L-15 65 Z" fill="#475569" />
    <path d="M-15 15 L155 15 L155 25 L-15 25 Z" fill="#64748b" />
    <!-- Table Legs -->
    <rect x="15" y="65" width="10" height="30" fill="#334155"/>
    <rect x="125" y="65" width="10" height="30" fill="#334155"/>

    <!-- Desk Props: Official Documents / Folder & Miniature Flag -->
    <rect x="75" y="0" width="30" height="20" rx="2" fill="#f8fafc" transform="rotate(-5 90 10)" />
    <line x1="80" y1="5" x2="95" y2="5" stroke="#94a3b8" stroke-width="2" />
    <line x1="80" y1="10" x2="100" y2="10" stroke="#94a3b8" stroke-width="2" />

    <!-- Miniature Desk Flag (Red with Gold Star) -->
    <line x1="35" y1="20" x2="35" y2="-15" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M35 -15 L52 -8 L35 -1Z" fill="#dc2626"/>
    <polygon points="43,-8 44,-10 46,-10 44.5,-11.5 45,-13.5 43,-12.2 41,-13.5 41.5,-11.5 40,-10 42,-10" fill="#fbbf24" transform="scale(0.5) translate(43, -2)" />
  </g>

  <!-- MAIN CHARACTER (Delegate/Official presenting or discussing the Republic) -->
  <g transform="translate(45, 80)">
    <!-- Chair Back -->
    <path d="M-15 75 L15 75 L20 15 L-20 15 Z" fill="#334155" rx="5"/>

    <!-- Body / Suit (Formal Attire for State/Civic Context) -->
    <path d="M-22 80 C-22 55 -15 45 0 45 C15 45 22 55 22 80 Z" fill="#0284c7" /> <!-- Blue suit jacket -->
    <!-- White Shirt & Red Tie -->
    <polygon points="-6,45 6,45 0,70" fill="#f8fafc"/>
    <polygon points="-2,50 2,50 1,66 -1,66" fill="#dc2626"/>

    <!-- Neck & Head -->
    <rect x="-5" y="32" width="10" height="15" fill="#fbcfe8" />
    <circle cx="0" cy="22" r="15" fill="#fbcfe8" />

    <!-- Hair -->
    <path d="M-13 18 C-13 8 -5 6 0 6 C8 6 14 10 14 20 C10 15 5 14 0 15 C-5 16 -10 17 -13 18 Z" fill="#0f172a" />

    <!-- Expressive Face (Engaged, explaining/teaching context) -->
    <circle cx="-5" cy="20" r="1.5" fill="#0f172a" />
    <circle cx="5" cy="20" r="1.5" fill="#0f172a" />
    <!-- Gentle confident smile -->
    <path d="M-3 27 Q0 30 3 27" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Active Gesturing Arms -->
    <!-- Left arm resting -->
    <path d="M-18 50 C-25 60 -20 75 -20 75" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Right arm raised explaining -->
    <path d="M18 50 C28 40 32 25 35 20" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hand open -->
    <circle cx="36" cy="18" r="4" fill="#fbcfe8" />
  </g>

  <!-- SECONDARY CHARACTER (Listener / Student taking notes, adding narrative depth) -->
  <g transform="translate(170, 95)">
    <!-- Chair -->
    <path d="M-12 60 L12 60 L15 10 L-15 10 Z" fill="#334155" />

    <!-- Body -->
    <path d="M-18 65 C-18 45 -12 35 0 35 C12 35 18 45 18 65 Z" fill="#10b981" /> <!-- Emerald green professional top -->
    
    <!-- Neck & Head (turned slightly toward speaker) -->
    <rect x="-4" y="24" width="8" height="13" fill="#fbcfe8" />
    <circle cx="0" cy="15" r="13" fill="#fbcfe8" />
    <!-- Hair (Bob cut) -->
    <path d="M-12 10 C-14 25 -5 27 0 27 C8 27 13 22 13 12 C13 7 8 5 0 5 C-6 5 -11 7 -12 10 Z" fill="#334155" />
    <circle cx="4" cy="14" r="1" fill="#0f172a" />
    <path d="M2 19 Q4 21 6 19" stroke="#0f172a" stroke-width="1" fill="none" stroke-linecap="round" />

    <!-- Arm & Notebook Interaction -->
    <path d="M12 40 C18 45 15 55 5 55" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- FOREGROUND VIGNETTE / DEPTH ELEMENT (Warm ambient overlay for vector polish) -->
  <circle cx="220" cy="220" r="80" fill="#38bdf8" opacity="0.03" filter="blur(20px)" />
</svg>