<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow to emphasize the focal point -->
  <circle cx="120" cy="115" r="70" fill="#252D3D" opacity="0.6"/>

  <!-- Conceptual illustration for "顶尖" (Noun - Peak/Apex/Top physical object) -->
  <!-- A majestic, sharply defined mountain peak piercing upward, representing the absolute highest/topmost standard -->
  <g transform="translate(0, 5)">
    <!-- Base mountain silhouette (darker) -->
    <polygon points="120,45 60,165 180,165" fill="#2A3447"/>

    <!-- Mountain left face -->
    <polygon points="120,45 60,165 120,165" fill="#3B465E"/>

    <!-- Mountain right face (sunlit / highlighted) -->
    <polygon points="120,45 120,165 180,165" fill="#4E5C7A"/>

    <!-- Snow-capped apex (representing the pinnacle / 顶尖) -->
    <polygon points="120,45 100,85 140,85" fill="#F39C12"/>
    <polygon points="120,45 140,85 155,100 120,95" fill="#F1C40F"/>

    <!-- Glowing golden crown/starburst floating gracefully right above the peak to clearly denote "the very best / hàng đầu" -->
    <g transform="translate(120, 25)">
      <!-- Outer glow ring -->
      <circle cx="0" cy="0" r="16" fill="#F1C40F" opacity="0.2"/>
      
      <!-- Central apex star / diamond icon -->
      <path d="M 0,-14 L 4,-4 L 14,0 L 4,4 L 0,14 L -4,4 L -14,0 L -4,-4 Z" fill="#F39C12"/>
      <path d="M 0,-10 L 2,-2 L 10,0 L 2,2 L 0,10 L -2,2 L -10,0 L -2,-2 Z" fill="#FFFFFF"/>
    </g>

    <!-- Clean modern platform / pedestal base -->
    <path d="M 50,165 L 190,165 L 175,185 L 65,185 Z" fill="#222733"/>
    <line x1="50" y1="165" x2="190" y2="165" stroke="#F39C12" stroke-width="2" opacity="0.6"/>
  </g>
</svg>