<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow representing the park/environment context -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

  <g transform="translate(120, 115)">
    <!-- Stem and leaves -->
    <path d="M0,75 C0,45 -10,20 -15,5" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8,45 C-25,40 -30,25 -20,20 C-10,15 -5,30 -8,45 Z" fill="#16A34A"/>
    <path d="M5,55 C20,52 28,38 20,32 C12,26 8,40 5,55 Z" fill="#16A34A"/>

    <!-- Outer Blossom Petals (Blooming / 盛开) -->
    <path d="M0,0 C-40,-50 -70,-20 -50,15 C-40,30 -20,25 0,10 Z" fill="#F43F5E"/>
    <path d="M0,0 C40,-50 70,-20 50,15 C40,30 20,25 0,10 Z" fill="#F43F5E"/>
    <path d="M0,0 C-60,-20 -50,30 -15,35 C-5,35 -5,15 0,0 Z" fill="#FB7185"/>
    <path d="M0,0 C60,-20 50,30 15,35 C5,35 5,15 0,0 Z" fill="#FB7185"/>
    
    <!-- Top & Bottom Petals for full bloom effect -->
    <path d="M0,0 C-25,-70 25,-70 0,-15 Z" fill="#E11D48"/>
    <path d="M0,0 C-35,50 35,50 0,20 Z" fill="#FB7185"/>
    <path d="M0,0 C-20,-55 20,-55 0,-10 Z" fill="#FF809B"/>

    <!-- Flower Center -->
    <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="10" fill="#F59E0B"/>
    
    <!-- Center details -->
    <circle cx="-4" cy="-3" r="1.5" fill="#B45309"/>
    <circle cx="4" cy="-3" r="1.5" fill="#B45309"/>
    <circle cx="0" cy="3" r="1.5" fill="#B45309"/>
    <circle cx="-3" cy="4" r="1" fill="#B45309"/>
    <circle cx="3" cy="4" r="1" fill="#B45309"/>
  </g>

  <!-- Floating pollen/sparkles to indicate vitality and full bloom -->
  <circle cx="75" cy="70" r="2.5" fill="#FDE047" opacity="0.8"/>
  <circle cx="165" cy="85" r="2" fill="#FDE047" opacity="0.6"/>
  <circle cx="150" cy="160" r="3" fill="#FDE047" opacity="0.7"/>
  <circle cx="85" cy="150" r="1.5" fill="#FDE047" opacity="0.5"/>
</svg>