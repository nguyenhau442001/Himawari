<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow / ambient glow -->
  <ellipse cx="120" cy="195" rx="80" ry="16" fill="#111318" opacity="0.8"/>
  
  <!-- Tree canopy hint in the background (contextual reference: Park shade) -->
  <path d="M40 70 C40 30, 80 20, 120 25 C160 20, 200 30, 200 70 C200 100, 170 120, 120 120 C70 120, 40 100, 40 70 Z" fill="#222B38" opacity="0.5"/>
  <path d="M70 50 C70 25, 100 20, 120 22 C140 20, 170 25, 170 50 C170 70, 150 85, 120 85 C90 85, 70 70, 70 50 Z" fill="#2A3648" opacity="0.4"/>

  <!-- Stone Table / Wooden Go Board Stand -->
  <path d="M70 145 L170 145 L190 185 L50 185 Z" fill="#2C3545"/>
  <path d="M60 185 L180 185 L185 192 L55 192 Z" fill="#1E2530"/>

  <!-- Go Board (Xiangqi / Weiqi table surface, angled in perspective) -->
  <polygon points="65,115 175,115 195,145 45,145" fill="#E2B274"/>
  <!-- Board wood grain lines / grid hints -->
  <line x1="120" y1="115" x2="120" y2="145" stroke="#C89656" stroke-width="1.5"/>
  <line x1="85" y1="115" x2="75" y2="145" stroke="#C89656" stroke-width="1"/>
  <line x1="155" y1="115" x2="165" y2="145" stroke="#C89656" stroke-width="1"/>
  <line x1="55" y1="130" x2="185" y2="130" stroke="#C89656" stroke-width="1"/>

  <!-- Game Pieces (Stones / Chess pieces) on the board -->
  <ellipse cx="110" cy="125" rx="5" ry="3" fill="#DCDCDC"/>
  <ellipse cx="130" cy="135" rx="5" ry="3" fill="#2C2C2C"/>
  <ellipse cx="95" cy="132" rx="5" ry="3" fill="#2C2C2C"/>
  <ellipse cx="145" cy="123" rx="5" ry="3" fill="#E67E22" stroke="#F39C12" stroke-width="1"/>

  <!-- Left Player (Elderly / Focused) -->
  <!-- Body/Torso -->
  <path d="M45 195 C45 165, 60 145, 80 145 C95 145, 105 160, 105 195 Z" fill="#3B495E"/>
  <!-- Head -->
  <circle cx="75" cy="115" r="16" fill="#F4D0B4"/>
  <!-- Hair (White/Grey for elder) -->
  <path d="M62 112 C62 98, 88 98, 88 112 C88 115, 85 115, 85 110 C85 102, 65 102, 65 110 C65 115, 62 115, 62 112 Z" fill="#E5E7EB"/>
  <!-- Left arm leaning forward -->
  <path d="M70 145 L85 135 L100 135" stroke="#3B495E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Hand contemplating / hovering over piece -->
  <circle cx="103" cy="133" r="4" fill="#F4D0B4"/>

  <!-- Right Player (Elderly / Focused) -->
  <!-- Body/Torso -->
  <path d="M195 195 C195 165, 180 145, 160 145 C145 145, 135 160, 135 195 Z" fill="#2E3948"/>
  <!-- Head -->
  <circle cx="165" cy="115" r="16" fill="#F4D0B4"/>
  <!-- Hair (White/Grey for elder) -->
  <path d="M152 112 C152 98, 178 98, 178 112 C178 115, 175 115, 175 110 C175 102, 155 102, 155 110 C155 115, 152 115, 152 112 Z" fill="#D1D5DB"/>
  <!-- Right arm leaning forward -->
  <path d="M170 145 L155 136 L138 136" stroke="#2E3948" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Hand -->
  <circle cx="136" cy="135" r="4" fill="#F4D0B4"/>

  <!-- Focus / Concentration effect: Subtle warm energy/strategic spark floating above the board -->
  <circle cx="120" cy="100" r="1.5" fill="#F39C12" opacity="0.8"/>
  <circle cx="128" cy="104" r="1" fill="#F39C12" opacity="0.6"/>
  <circle cx="112" cy="105" r="1" fill="#F39C12" opacity="0.6"/>
  
  <!-- Sleek framing detail: Modern glowing accent line at the top -->
  <rect x="96" y="12" width="48" height="3" rx="1.5" fill="#F39C12"/>
</svg>