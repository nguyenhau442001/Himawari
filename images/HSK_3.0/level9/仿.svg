<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "仿" (imitation/copy based on Tang dynasty architectural example) -->
  <!-- We visualize this as an architectural blueprint/model comparison or modern building styled after a classic temple roof profile -->
  
  <g transform="translate(0, 10)">
    <!-- Grid background lines for architectural blueprint feel -->
    <line x1="40" y1="50" x2="200" y2="50" stroke="#2A303C" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="40" y1="90" x2="200" y2="90" stroke="#2A303C" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="40" y1="130" x2="200" y2="130" stroke="#2A303C" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="40" y1="170" x2="200" y2="170" stroke="#2A303C" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Left side: Classic Tang Dynasty Roof Outline (The Source) -->
    <g transform="translate(50, 80)">
      <!-- Base/pillar hint -->
      <rect x="20" y="70" width="10" height="30" fill="#4B5563"/>
      <rect x="40" y="70" width="10" height="30" fill="#4B5563"/>
      <!-- Classic curved roof -->
      <path d="M 5 70 Q 35 65 65 70 L 60 50 Q 35 40 10 50 Z" fill="#9CA3AF"/>
      <path d="M -5 50 Q 35 35 75 50 L 70 30 Q 35 15 0 30 Z" fill="#6B7280"/>
      <!-- Label icon: ancient scroll/temple outline -->
      <circle cx="35" cy="15" r="12" fill="#374151"/>
      <path d="M30 15 L40 15 M35 10 L35 20" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Center: Transformation/Imitation Arrow -->
    <g transform="translate(110, 105)">
      <path d="M 0 10 L 16 10 M 10 4 L 16 10 L 10 16" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 4 20 L 12 20" stroke="#4B5563" stroke-width="2" stroke-dasharray="2,2"/>
    </g>

    <!-- Right side: Modern Architectural Replica (The Result) -->
    <g transform="translate(135, 75)">
      <!-- Modern sleek building structure with glass facade -->
      <rect x="15" y="45" width="40" height="65" rx="2" fill="#1F2937" stroke="#374151" stroke-width="2"/>
      <!-- Glass panel lines -->
      <line x1="25" y1="45" x2="25" y2="110" stroke="#374151" stroke-width="1"/>
      <line x1="45" y1="45" x2="45" y2="110" stroke="#374151" stroke-width="1"/>
      <line x1="15" y1="70" x2="55" y2="70" stroke="#374151" stroke-width="1"/>
      <line x1="15" y1="90" x2="55" y2="90" stroke="#374151" stroke-width="1"/>
      
      <!-- Modern interpretation of classic curved roof (sleek overhang) -->
      <path d="M 5 45 Q 35 38 65 45 L 60 30 Q 35 23 10 30 Z" fill="#F59E0B"/>
      
      <!-- Accent glow / highlight representing modern design -->
      <polygon points="35,15 42,25 28,25" fill="#FBBF24"/>
    </g>

    <!-- Connecting construction / blueprint dimension lines at the bottom -->
    <path d="M 65 190 L 175 190" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="65" cy="190" r="3" fill="#F59E0B"/>
    <circle cx="175" cy="190" r="3" fill="#F59E0B"/>
    
    <!-- Center focal node -->
    <circle cx="120" cy="190" r="6" fill="#1A1D24" stroke="#F59E0B" stroke-width="2"/>
  </g>
</svg>