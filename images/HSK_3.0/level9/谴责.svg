<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Light -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT: Modern Office / Public Space Background -->
  <!-- Window Grid (City silhouette outside) -->
  <g opacity="0.15">
    <rect x="25" y="25" width="70" height="90" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="60" y1="25" x2="60" y2="115" stroke="#94a3b8" stroke-width="2"/>
    <line x1="25" y1="70" x2="95" y2="70" stroke="#94a3b8" stroke-width="2"/>
    <!-- City buildings silhouette -->
    <path d="M25 115 L25 90 L35 90 L35 80 L45 80 L45 115 Z" fill="#94a3b8"/>
    <path d="M50 115 L50 65 L65 65 L65 115 Z" fill="#94a3b8"/>
    <path d="M70 115 L70 85 L85 85 L85 115 Z" fill="#94a3b8"/>
  </g>

  <!-- Notice Board / Media Screen (Representing "Society / Public") -->
  <rect x="120" y="25" width="95" height="75" rx="6" fill="#334155" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
  <rect x="128" y="33" width="79" height="50" rx="4" fill="url(#screenGrad)" />
  <!-- Abstract "News / Public Outcry" Graphic on Screen -->
  <path d="M138 48 L158 58 L182 43" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="182" cy="43" r="4" fill="#ef4444" />
  <line x1="138" y1="65" x2="170" y2="65" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="73" x2="160" y2="73" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Stand for Board -->
  <path d="M167.5 100 L167.5 115" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M152 115 L183 115" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Office Desk / Counter -->
  <path d="M10 175 L230 175 L220 215 L20 215 Z" fill="#334155" filter="url(#shadow)" />
  <path d="M10 175 L230 175 L230 182 L10 182 Z" fill="#475569" />

  <!-- CHARACTER 1: The Wrongdoer (Anxious, turning away, head down) -->
  <g transform="translate(45, 105)">
    <!-- Body & Shoulders -->
    <path d="M25 70 C25 50 45 45 60 45 C75 45 95 50 95 70 L95 90 L25 90 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="60" cy="30" r="16" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M44 28 C44 18 52 14 60 14 C68 14 76 18 76 28 C72 22 68 20 60 20 C52 20 48 22 44 28 Z" fill="#1e293b" />
    <!-- Anxious Expression / Head bowed -->
    <!-- Sweating drop -->
    <path d="M72 32 C72 35 74 36 75 38 C76 36 78 35 78 32 C78 30 76 30 75 30 C74 30 72 30 72 32 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Closed nervous eyes -->
    <path d="M52 32 Q56 35 60 32" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Frowned mouth -->
    <path d="M57 41 Q60 39 63 41" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arms crossed / Defensive posture -->
    <path d="M35 55 L60 68 L85 55" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CHARACTER 2 & 3: Society / Public (Representing "Social Condemnation / 谴责") -->
  <!-- Public Figure / Accuser 1 (Pointing / Expressing disapproval) -->
  <g transform="translate(130, 95)">
    <!-- Body -->
    <path d="M20 80 C20 60 35 55 50 55 C65 55 80 60 80 80 L80 115 L20 115 Z" fill="#ef4444" />
    <!-- Head -->
    <circle cx="50" cy="40" r="15" fill="#fde68a" />
    <!-- Hair -->
    <path d="M36 38 C36 26 44 24 50 24 C56 24 64 26 64 38 C60 34 55 33 50 33 C45 33 40 34 36 38 Z" fill="#451a03" />
    <!-- Serious / Stern Face -->
    <path d="M43 40 L48 42" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M57 40 L52 42" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M46 50 Q50 47 54 50" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Pointing Arm / Hand -->
    <path d="M20 65 L5 55" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round" />
    <circle cx="2" cy="53" r="5" fill="#fde68a" />
  </g>

  <!-- Public Figure 2 (Arms crossed, stern disapproval) -->
  <g transform="translate(175, 105)">
    <!-- Body -->
    <path d="M15 70 C15 50 30 45 45 45 C60 45 75 50 75 70 L75 105 L15 105 Z" fill="#0ea5e9" />
    <!-- Head -->
    <circle cx="45" cy="30" r="14" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M32 28 C32 18 38 15 45 15 C52 15 58 18 58 28 Z" fill="#334155" />
    <!-- Stern expression -->
    <path d="M40 31 L43 33" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M50 31 L47 33" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M42 38 Q45 36 48 38" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Folded Arms -->
    <path d="M25 58 L45 70 L65 58" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND PROPS / CONTEXT -->
  <!-- Microphone on Desk (Press conference / Public statement vibe) -->
  <g transform="translate(115, 150)">
    <path d="M10 25 L10 40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M2 15 L18 15 L18 25 C18 29.4 14.4 33 10 33 C5.6 33 2 29.4 2 25 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="10" cy="40" rx="8" ry="3" fill="#64748b" />
    <!-- Stand -->
    <path d="M10 20 L25 10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtle visual emphasis lines (Sound / Condemnation wave ripples moving towards the wrongdoer) -->
  <g opacity="0.3" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M125 110 Q115 120 125 130"/>
    <path d="M115 100 Q100 120 115 140"/>
  </g>

  <!-- Lighting & Polish Overlays -->
  <!-- Vignette/Ambient Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>