<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "本性" (Innate nature/character) as a core, unchangeable seed/gem inside a human silhouette -->
  <!-- The silhouette represents the person, the glowing core represents the immutable inner nature -->
  
  <g transform="translate(120, 120)">
    <!-- Human silhouette outline -->
    <path d="M-40,80 C-40,40 -20,20 0,20 C20,20 40,40 40,80" fill="none" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="25" fill="#4A5568"/>
    
    <!-- The core "Nature" (Běnxìng) -->
    <circle cx="0" cy="40" r="18" fill="#F6AD55" stroke="#D69E2E" stroke-width="3"/>
    <path d="M-8,35 L8,35 M-8,45 L8,45" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Subtle radiating lines to emphasize the core -->
    <circle cx="0" cy="40" r="28" fill="none" stroke="#F6AD55" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  </g>
</svg>