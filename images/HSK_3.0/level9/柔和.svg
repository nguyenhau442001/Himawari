<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Sound Wave Gradient (representing soft voice) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1" />
    </linearGradient>
    
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow from warm bedside/desk lamp -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT / ROOM CONTEXT -->
  <!-- Window showing soft night cityscape -->
  <g transform="translate(145, 25)">
    <rect width="70" height="85" rx="6" fill="url(#windowGrad)" stroke="#475569" stroke-width="2" />
    <!-- Window pane frame cross -->
    <line x1="35" y1="0" x2="35" y2="85" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="42" x2="70" y2="42" stroke="#475569" stroke-width="2" />
    <!-- City lights outside (soft glowing dots) -->
    <circle cx="15" cy="20" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="25" cy="30" r="1.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="50" cy="15" r="2" fill="#f472b6" opacity="0.6" />
    <circle cx="55" cy="65" r="1.5" fill="#fbbf24" opacity="0.9" />
    <circle cx="20" cy="70" r="2" fill="#34d399" opacity="0.5" />
  </g>

  <!-- Bookshelf / Plant detail in background -->
  <path d="M25 110 L75 110 L75 113 L25 113 Z" fill="#475569" rx="1" />
  <!-- Small potted plant -->
  <path d="M35 109 L43 109 L41 95 L37 95 Z" fill="#cbd5e1" />
  <circle cx="39" cy="92" r="6" fill="#10b981" />
  <circle cx="35" cy="95" r="4" fill="#059669" />
  <circle cx="43" cy="94" r="45" fill="none" /> <!-- spacer -->
  <circle cx="43" cy="95" r="5" fill="#34d399" />

  <!-- Desk Surface -->
  <path d="M0 185 L240 185 L240 240 L0 240 Z" fill="#0f172a" />
  <path d="M0 180 L240 180 L240 185 L0 185 Z" fill="#334155" />

  <!-- Desk Props -->
  <!-- Cute Desk Lamp -->
  <path d="M190 180 L200 180 L198 140 L192 140 Z" fill="#64748b" />
  <path d="M185 140 L205 140 L200 125 L190 125 Z" fill="#f59e0b" />
  <path d="M180 120 C180 110, 210 110, 210 120 Z" fill="#fbbf24" />
  <!-- Lamp light cone projection -->
  <polygon points="195,120 160,180 230,180" fill="#fbbf24" opacity="0.08" />

  <!-- Coffee Mug with steam -->
  <rect x="150" y="165" width="16" height="20" rx="3" fill="#cbd5e1" />
  <path d="M166 170 C172 170, 172 178, 166 180" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Gentle steam wisps -->
  <path d="M155 160 Q158 153, 154 148" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M161 158 Q158 152, 162 146" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- MAIN CHARACTER: Woman speaking gently -->
  <g transform="translate(70, 75)">
    <!-- Body / Torso (Comfortable sweater) -->
    <path d="M20 110 C20 85, 45 80, 65 80 C85 80, 110 85, 110 110 L120 145 C120 145, 10 145, 20 110 Z" fill="#f472b6" />
    <!-- Sweater collar -->
    <path d="M45 80 C45 92, 85 92, 85 80 C75 75, 55 75, 45 80 Z" fill="#db2777" />

    <!-- Neck -->
    <path d="M54 65 L76 65 L78 82 L52 82 Z" fill="#fbcfe8" />

    <!-- Head & Hair Base -->
    <circle cx="65" cy="50" r="24" fill="#fbcfe8" />
    <!-- Hair Back/Sides (Dark stylish bob) -->
    <path d="M41 45 C40 25, 90 25, 89 45 C92 65, 85 80, 75 80 C70 80, 65 65, 65 65 C65 65, 60 80, 55 80 C45 80, 40 65, 41 45 Z" fill="#334155" />
    <!-- Hair Bangs / Front -->
    <path d="M43 42 C45 30, 85 30, 87 42 C80 48, 50 48, 43 42 Z" fill="#1e293b" />

    <!-- Gentle Facial Expression -->
    <!-- Soft closed/half-closed peaceful eyes -->
    <path d="M53 50 Q56 54, 59 50" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M71 50 Q74 54, 77 50" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="53" cy="57" r="5" fill="#fda4af" opacity="0.6" />
    <circle cx="77" cy="57" r="5" fill="#fda4af" opacity="0.6" />
    <!-- Gentle, soft smile (expressing 'róuhé' - mild/gentle voice) -->
    <path d="M61 60 Q65 64, 69 60" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" />

    <!-- Gesturing Hand (Soft, expressive hand movement) -->
    <!-- Arm reaching out slightly -->
    <path d="M105 100 C115 105, 125 95, 128 90" fill="none" stroke="#f472b6" stroke-width="12" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="130" cy="88" r="6" fill="#fbcfe8" />
  </g>

  <!-- VISUALIZING "SOFT VOICE" (Flowing, harmonious sound waves emanating from character) -->
  <g transform="translate(135, 125)">
    <!-- Wave arc 1 -->
    <path d="M0 -20 C12 -10, 12 10, 0 20" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Wave arc 2 -->
    <path d="M8 -30 C24 -15, 24 15, 8 30" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <!-- Wave arc 3 -->
    <path d="M16 -40 C36 -20, 36 20, 16 40" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    
    <!-- Floating gentle audio/melody notes -->
    <path d="M22 -15 L22 -25 L30 -28 L30 -18 Z" fill="#f472b6" opacity="0.7" />
    <circle cx="19" cy="-15" r="3" fill="#f472b6" opacity="0.7" />
    <circle cx="27" cy="-18" r="3" fill="#f472b6" opacity="0.7" />

    <circle cx="38" cy="10" r="3.5" fill="#fbbf24" opacity="0.8" />
    <path d="M41 10 L41 2" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8" />
    <path d="M41 3 Q45 0, 48 3" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8" />
  </g>

</svg>