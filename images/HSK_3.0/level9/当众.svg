<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background crowd silhouettes (representing "众" / the crowd) -->
  <g fill="#2A303C" opacity="0.7">
    <!-- Left crowd members -->
    <circle cx="55" cy="115" r="16"/>
    <path d="M35 155 C35 135 55 135 55 135 C55 135 75 135 75 155 Z"/>
    
    <circle cx="25" cy="135" r="14"/>
    <path d="M10 170 C10 152 25 152 25 152 C25 152 40 152 40 170 Z"/>

    <!-- Right crowd members -->
    <circle cx="185" cy="115" r="16"/>
    <path d="M165 155 C165 135 185 135 185 135 C185 135 205 135 205 155 Z"/>

    <circle cx="215" cy="135" r="14"/>
    <path d="M200 170 C200 152 215 152 215 152 C215 152 230 152 230 170 Z"/>

    <circle cx="145" cy="125" r="14"/>
    <path d="M130 160 C130 144 145 144 145 144 C145 144 160 144 160 160 Z"/>

    <circle cx="95" cy="125" r="14"/>
    <path d="M80 160 C80 144 95 144 95 144 C95 144 110 144 110 160 Z"/>
  </g>

  <!-- Foreground stage / podium base -->
  <path d="M70 190 L170 190 L185 210 L55 210 Z" fill="#323B4C"/>
  <rect x="85" y="165" width="70" height="25" rx="4" fill="#E5A93B"/>

  <!-- Central speaker figure (representing "当众" / in public, before the crowd) -->
  <g transform="translate(120, 105)">
    <!-- Spotlight effect / Glow behind speaker -->
    <path d="M-40 -60 L40 -60 L60 90 L-60 90 Z" fill="#E5A93B" opacity="0.08"/>

    <!-- Speaker Head & Hair -->
    <circle cx="0" cy="-35" r="14" fill="#4F5D73"/>
    <path d="M-12 -42 C-12 -52 12 -52 12 -42 C12 -40 10 -35 8 -35 C6 -35 6 -38 0 -38 C-6 -38 -6 -35 -8 -35 C-10 -35 -12 -40 -12 -42 Z" fill="#2C3542"/>

    <!-- Speaker Body / Suit -->
    <path d="M-18 -15 C-18 -25 18 -25 18 -15 L22 50 L-22 50 Z" fill="#3B82F6"/>
    <!-- Shirt collar & tie -->
    <polygon points="0,-15 -6,-22 0,-28 6,-22" fill="#F0F4F8"/>
    <polygon points="0,-22 -3,-12 0,-5 3,-12" fill="#EF4444"/>

    <!-- Gesturing Arm (Expressing public speaking) -->
    <path d="M14 -10 Q32 -5 22 15" fill="none" stroke="#4F5D73" stroke-width="6" stroke-linecap="round"/>
    <circle cx="22" cy="17" r="4" fill="#4F5D73"/>

    <!-- Other Arm resting on podium -->
    <path d="M-14 -10 Q-22 10 -15 25" fill="none" stroke="#4F5D73" stroke-width="6" stroke-linecap="round"/>

    <!-- Microphone -->
    <path d="M-2 -30 L-2 -10" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="-2" cy="-32" r="4" fill="#E2E8F0"/>
    <path d="M-8 -38 C-8 -26 4 -26 4 -38" fill="none" stroke="#64748B" stroke-width="1.5"/>
  </g>
</svg>