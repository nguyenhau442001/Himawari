<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm interior glow -->
    <radialGradient id="roomGlow" cx="120" cy="110" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Table surface gradient -->
    <linearGradient id="tableGrad" x1="20" y1="160" x2="220" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>

    <!-- Mediator aura/peaceful light -->
    <radialGradient id="peaceGlow" cx="120" cy="100" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment / Room Context -->
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)"/>

  <!-- Background Interior Details (Meeting Room / Office) -->
  <!-- Window silhouette -->
  <path d="M95,35 L145,35 L140,85 L100,85 Z" fill="#1e293b" opacity="0.6"/>
  <line x1="120" y1="35" x2="120" y2="85" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="97" y1="60" x2="142" y2="60" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Bookshelf / Plants in background -->
  <rect x="25" y="45" width="20" height="45" rx="3" fill="#334155" opacity="0.4"/>
  <rect x="195" y="45" width="20" height="45" rx="3" fill="#334155" opacity="0.4"/>
  <circle cx="205" cy="42" r="8" fill="#10b981" opacity="0.5"/>

  <!-- Ambient Light from Center (Peace gesture area) -->
  <circle cx="120" cy="110" r="60" fill="url(#peaceGlow)"/>

  <!-- Large Wooden Table -->
  <path d="M20,165 L220,165 L205,195 L35,195 Z" fill="url(#tableGrad)"/>
  <!-- Table border / highlight -->
  <path d="M20,165 L220,165" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Table legs silhouette -->
  <path d="M50,195 L40,225" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path d="M190,195 L200,225" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- Props on Table: Documents / Conflict notes -->
  <rect x="75" y="170" width="30" height="20" rx="2" fill="#e2e8f0" transform="rotate(-10 90 180)"/>
  <line x1="80" y1="175" x2="95" y2="175" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="180" x2="90" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="130" y="170" width="30" height="20" rx="2" fill="#e2e8f0" transform="rotate(12 145 180)"/>
  <line x1="135" y1="175" x2="150" y2="175" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="135" y1="180" x2="145" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ================= CHARACTER LEFT (Hostile posture) ================= -->
  <g id="character-left">
    <!-- Body / Torso (Blue jacket) -->
    <path d="M45,175 C45,150 65,140 75,140 C85,140 100,155 105,175 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="75" cy="115" r="16" fill="#fbcfe8"/>
    <!-- Hair (Dark, stylized spiky/neat) -->
    <path d="M60,115 C60,103 70,98 82,102 C88,104 90,110 90,115 C85,110 70,110 60,115 Z" fill="#0f172a"/>
    <!-- Stern Eyebrows (Angle showing hostility) -->
    <line x1="68" y1="112" x2="78" y2="116" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes (Glaring) -->
    <circle cx="72" cy="117" r="1.5" fill="#0f172a"/>
    <circle cx="82" cy="120" r="1.5" fill="#0f172a"/>
    <!-- Tight angry mouth -->
    <path d="M74,127 C78,125 82,127 84,127" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crossed Arm (Defensive/Aggressive stance) -->
    <path d="M60,145 L90,155 L75,170 Z" fill="#0284c7"/>
    <path d="M65,140 L85,155" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  </g>


  <!-- ================= CHARACTER RIGHT (Hostile posture) ================= -->
  <g id="character-right">
    <!-- Body / Torso (Orange/Coral sweater) -->
    <path d="M195,175 C195,150 175,140 165,140 C155,140 140,155 135,175 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="165" cy="115" r="16" fill="#fbcfe8"/>
    <!-- Hair (Slightly disheveled/stubborn) -->
    <path d="M150,113 C155,100 170,100 180,108 C175,107 162,107 150,113 Z" fill="#334155"/>
    <!-- Stern Eyebrows (Mirrored angle) -->
    <line x1="162" y1="116" x2="172" y2="112" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes (Glaring back) -->
    <line x1="156" y1="118" x2="162" y2="119" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="168" y1="119" x2="174" y2="118" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Tight angry mouth -->
    <path d="M156,127 C160,127 164,125 168,127" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crossed Arm (Defensive/Aggressive stance) -->
    <path d="M180,145 L150,155 L165,170 Z" fill="#ea580c"/>
    <path d="M175,140 L155,155" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  </g>


  <!-- ================= CENTER MEDIATOR / PEACEMAKER ================= -->
  <g id="character-center">
    <!-- Rising between them, holding hands up to stop hostility -->
    <!-- Torso / Suit -->
    <path d="M105,185 L135,185 L140,140 L100,140 Z" fill="#1e293b"/>
    <!-- Shirt collar & tie -->
    <path d="M115,140 L120,155 L125,140 Z" fill="#f8fafc"/>
    <polygon points="119,150 121,150 122,168 118,168" fill="#10b981"/>

    <!-- Head -->
    <circle cx="120" cy="100" r="16" fill="#fbcfe8"/>
    <!-- Friendly Neat Hair -->
    <path d="M107,98 C107,88 115,84 125,86 C131,88 133,93 133,98 Z" fill="#475569"/>

    <!-- Calm, compassionate expression -->
    <!-- Eyes (Friendly curves) -->
    <path d="M113,101 Q116,98 119,101" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M121,101 Q124,98 127,101" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Gentle Smile -->
    <path d="M116,108 Q120,112 124,108" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Arms raised in "Stop / Calm Down / Don't Fight" gesture -->
    <!-- Left arm reaching towards left person -->
    <path d="M105,145 C90,140 80,120 75,105" stroke="#1e293b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Open palm facing left person -->
    <circle cx="73" cy="100" r="5" fill="#fbcfe8"/>

    <!-- Right arm reaching towards right person -->
    <path d="M135,145 C150,140 160,120 165,105" stroke="#1e293b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Open palm facing right person -->
    <circle cx="167" cy="100" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Floating Peaceful / Intervention Elements (Golden Sparkles / Stop Symbolism without text) -->
  <g id="sparkles">
    <!-- Warm glowing dots representing calm energy -->
    <circle cx="120" cy="70" r="4" fill="#fbbf24"/>
    <circle cx="100" cy="85" r="2.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="140" cy="85" r="2.5" fill="#fbbf24" opacity="0.8"/>
    
    <!-- Subtle radiating light lines above center head -->
    <line x1="120" y1="75" x2="120" y2="65" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="78" x2="102" y2="72" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="132" y1="78" x2="138" y2="72" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>