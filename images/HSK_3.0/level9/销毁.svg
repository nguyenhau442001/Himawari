<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Motion lines for dynamic action -->
  <g stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="85" y1="120" x2="65" y2="135" />
    <line x1="80" y1="100" x2="60" y2="105" />
  </g>

  <!-- Industrial Paper Shredder Machine -->
  <g id="shredder">
    <!-- Shredder Bin / Body -->
    <rect x="120" y="130" width="80" height="75" rx="6" fill="#2D323E"/>
    <!-- Bin Window / Level Indicator -->
    <rect x="145" y="160" width="30" height="30" rx="3" fill="#1A1D24" opacity="0.5"/>
    <rect x="150" y="165" width="20" height="15" rx="2" fill="#E65100" opacity="0.7"/>

    <!-- Shredder Head / Motor Housing -->
    <rect x="110" y="110" width="100" height="25" rx="4" fill="#3B4252"/>
    <!-- Control Panel / Power Light -->
    <circle cx="190" cy="122" r="3" fill="#FF5252"/>
    <rect x="125" y="120" width="15" height="3" rx="1.5" fill="#4C566A"/>

    <!-- Feed Slot -->
    <rect x="130" y="110" width="60" height="4" fill="#1A1D24"/>
  </g>

  <!-- Documents & Shredding Effect -->
  <g id="documents">
    <!-- Intact Document sliding into slot -->
    <g transform="translate(145, 75) rotate(-15)">
      <rect x="0" y="0" width="35" height="45" rx="2" fill="#ECEFF4"/>
      <!-- Document lines -->
      <line x1="6" y1="8" x2="29" y2="8" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="16" x2="25" y2="16" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="24" x2="22" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Shredded Paper Confetti inside bin -->
    <g fill="#E2E8F0">
      <rect x="130" y="145" width="4" height="12" rx="1" transform="rotate(10 132 151)"/>
      <rect x="140" y="150" width="4" height="15" rx="1" transform="rotate(-15 142 157)"/>
      <rect x="155" y="140" width="4" height="10" rx="1" transform="rotate(25 157 145)"/>
      <rect x="170" y="148" width="4" height="14" rx="1" transform="rotate(-5 172 155)"/>
      <rect x="182" y="142" width="4" height="12" rx="1" transform="rotate(18 184 148)"/>
    </g>
  </g>

  <!-- Human Character Action (Dynamic Upper Body) -->
  <g id="character">
    <!-- Back Arm / Shoulder -->
    <path d="M70 120 C 70 120, 85 105, 105 110" fill="none" stroke="#3B4252" stroke-width="14" stroke-linecap="round"/>

    <!-- Torso & Clothing -->
    <path d="M50 175 L 50 145 C 50 130, 65 120, 85 120 L 115 150 L 115 175 Z" fill="#4F46E5"/>

    <!-- Neck & Head -->
    <rect x="72" y="102" width="12" height="20" fill="#FCA5A5"/>
    <circle cx="78" cy="92" r="15" fill="#FCA5A5"/>
    <!-- Hair -->
    <path d="M63 92 C 63 75, 93 75, 93 92 C 93 92, 90 85, 78 85 C 66 85, 63 92, 63 92 Z" fill="#1E293B"/>

    <!-- Front Arm feeding documents -->
    <path d="M85 125 C 95 125, 120 115, 140 100" fill="none" stroke="#4F46E5" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="143" cy="97" r="7" fill="#FCA5A5"/>
  </g>

  <!-- Destruction / Action Accent Sparks (Orange/Gold for Focus) -->
  <g fill="#F59E0B">
    <circle cx="155" cy="105" r="2" />
    <circle cx="130" cy="100" r="1.5" />
    <path d="M 162 95 L 166 98 L 162 101 Z" />
  </g>
</svg>