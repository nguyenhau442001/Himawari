<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="180" rx="70" ry="8" fill="#111318"/>
  
  <!-- Old Wrecked Truck Illustration (Physical Noun: 报废) -->
  <g transform="translate(0, 5)">
    <!-- Rear/Cargo Bed -->
    <path d="M70 120 L70 145 L175 145 L175 120 Z" fill="#3D4451"/>
    <!-- Cab Body -->
    <path d="M145 100 L175 100 L175 145 L145 145 Z" fill="#4B5362"/>
    
    <!-- Windshield (Cracked) -->
    <path d="M150 105 L170 105 L170 125 L150 125 Z" fill="#2A2E39"/>
    <!-- Crack lines on windshield -->
    <path d="M150 105 L162 118 M170 110 L158 118 M162 118 L165 125" stroke="#7A8496" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hood & Grille (Damaged front) -->
    <path d="M175 115 L190 125 L190 145 L175 145 Z" fill="#3D4451"/>
    <line x1="182" y1="128" x2="182" y2="140" stroke="#2A2E39" stroke-width="2"/>
    <line x1="186" y1="130" x2="186" y2="140" stroke="#2A2E39" stroke-width="2"/>

    <!-- Flatbed Details / Rust Patches -->
    <rect x="85" y="125" width="25" height="12" rx="2" fill="#5A3A29"/>
    <rect x="125" y="128" width="20" height="10" rx="2" fill="#5A3A29"/>

    <!-- Wheels (Deformed / Flat tires) -->
    <!-- Rear Wheel -->
    <circle cx="95" cy="148" r="16" fill="#2A2E39"/>
    <ellipse cx="95" cy="150" rx="10" ry="7" fill="#1A1D24"/>
    <!-- Front Wheel (Off axis / leaning) -->
    <ellipse cx="165" cy="148" rx="14" ry="12" fill="#2A2E39" transform="rotate(-15 165 148)"/>
    <ellipse cx="165" cy="149" rx="8" ry="6" fill="#1A1D24" transform="rotate(-15 165 149)"/>

    <!-- Exhaust Smoke / Smog (Indicating excessive emissions) -->
    <path d="M65 125 Q55 120 50 110 Q45 100 55 90 Q65 80 55 70" fill="none" stroke="#6C7A89" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="50" cy="112" r="6" fill="#6C7A89" opacity="0.4"/>
    <circle cx="57" cy="95" r="9" fill="#6C7A89" opacity="0.4"/>
    <circle cx="52" cy="75" r="12" fill="#6C7A89" opacity="0.3"/>

    <!-- Structural Damage / X / Slash Accent to denote "scrap/out of service" -->
    <g transform="translate(120, 120)" stroke="#E74C3C" stroke-width="5" stroke-linecap="round">
      <line x1="-15" y1="-15" x2="15" y2="15"/>
      <line x1="15" y1="-15" x2="-15" y2="15"/>
    </g>
  </g>
  
  <!-- Outer Red Warning Stamp / Border Accent -->
  <rect x="25" y="25" width="190" height="190" rx="16" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
</svg>