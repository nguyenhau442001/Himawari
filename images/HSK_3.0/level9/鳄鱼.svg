<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Murky river background elements -->
  <path d="M0 160 Q 60 150, 120 165 T 240 160 L 240 240 L 0 240 Z" fill="#24303F" opacity="0.7"/>
  <path d="M0 175 Q 80 190, 160 170 T 240 180 L 240 240 L 0 240 Z" fill="#151C24"/>
  
  <!-- Water ripples above the submerged part -->
  <path d="M30 155 Q 45 150, 60 155" stroke="#3A4D66" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M140 160 Q 155 155, 170 160" stroke="#3A4D66" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M90 168 Q 100 164, 110 168" stroke="#3A4D66" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Crocodile (鳄鱼 - ëyú) -->
  <g transform="translate(15, 75)">
    <!-- Tail (submerged/curved) -->
    <path d="M 180 50 Q 200 45, 210 55 Q 200 65, 180 60 Z" fill="#2E5A36"/>
    <polygon points="185,48 195,45 200,52" fill="#1E3C24"/>
    <polygon points="195,54 205,53 208,60" fill="#1E3C24"/>

    <!-- Main Body -->
    <path d="M 70 40 Q 120 30, 180 50 Q 190 65, 170 75 Q 110 85, 60 70 Z" fill="#387043"/>
    
    <!-- Scale pattern / texture overlay -->
    <path d="M 80 48 Q 125 40, 170 55" stroke="#2E5A36" stroke-width="3" fill="none"/>
    <path d="M 75 60 Q 120 52, 165 67" stroke="#2E5A36" stroke-width="3" fill="none"/>

    <!-- Dorsal Scutes (Spines along back) -->
    <polygon points="75,41 85,32 90,43" fill="#1E3C24"/>
    <polygon points="95,38 105,29 110,40" fill="#1E3C24"/>
    <polygon points="115,37 125,28 130,39" fill="#1E3C24"/>
    <polygon points="135,39 145,30 150,41" fill="#1E3C24"/>
    <polygon points="155,43 165,34 170,45" fill="#1E3C24"/>

    <!-- Head & Snout -->
    <path d="M 20 45 Q 45 42, 75 42 L 75 70 Q 45 72, 20 58 Z" fill="#387043"/>
    
    <!-- Snout ridges -->
    <polygon points="25,48 35,45 40,51" fill="#1E3C24"/>
    <polygon points="45,46 55,44 60,49" fill="#1E3C24"/>

    <!-- Eye (Vicious, focused, golden accent) -->
    <circle cx="55" cy="46" r="5" fill="#F59E0B"/>
    <ellipse cx="55" cy="46" rx="1.5" ry="3" fill="#111827"/>
    <!-- Brow ridge -->
    <path d="M 48 42 Q 55 39, 62 44" fill="#2E5A36"/>

    <!-- Jaw & Teeth -->
    <!-- Upper jaw overhang -->
    <path d="M 20 55 L 75 55 L 75 58 L 20 58 Z" fill="#2E5A36"/>
    <!-- Sharp Teeth -->
    <polygon points="30,58 34,64 38,58" fill="#F3F4F6"/>
    <polygon points="45,58 49,64 53,58" fill="#F3F4F6"/>
    <polygon points="60,58 64,65 68,58" fill="#F3F4F6"/>
    
    <!-- Lower jaw -->
    <path d="M 22 58 Q 45 60, 75 58 L 72 65 Q 45 68, 25 63 Z" fill="#2E5A36"/>

    <!-- Front Leg (submerged) -->
    <path d="M 110 68 Q 120 90, 105 100 Q 100 90, 110 68 Z" fill="#2E5A36"/>
    <!-- Claws -->
    <path d="M 102 98 L 98 103 M 105 100 L 103 105 M 109 99 L 109 105" stroke="#1E3C24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric subtle highlights/bubbles -->
  <circle cx="75" cy="130" r="2" fill="#60A5FA" opacity="0.6"/>
  <circle cx="160" cy="140" r="1.5" fill="#60A5FA" opacity="0.5"/>
  <circle cx="170" cy="135" r="3" fill="#60A5FA" opacity="0.4"/>
</svg>