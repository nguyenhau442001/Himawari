<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Subtle Room Interior Grid/Wallpaper -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="240" y2="40"/>
    <line x1="0" y1="80" x2="240" y2="80"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="160" x2="240" y2="160"/>
    <line x1="0" y1="200" x2="240" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
  </g>

  <!-- Ambient Glow from "Strange" Event -->
  <circle cx="120" cy="110" r="70" fill="#38bdf8" opacity="0.08" filter="blur(15px)"/>
  
  <!-- Living Room / Office Environment Props -->
  <!-- Bookshelf Background -->
  <rect x="25" y="45" width="50" height="130" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="60" width="40" height="8" rx="2" fill="#38bdf8" opacity="0.4"/>
  <rect x="35" y="90" width="30" height="8" rx="2" fill="#f59e0b" opacity="0.4"/>
  <rect x="30" y="130" width="40" height="8" rx="2" fill="#10b981" opacity="0.4"/>
  <rect x="35" y="160" width="25" height="8" rx="2" fill="#ec4899" opacity="0.4"/>

  <!-- Potted Plant (Normal context) -->
  <path d="M195 150 L205 180 L185 180 Z" fill="#64748b"/>
  <path d="M195 150 C 180 130, 175 110, 185 90 C 195 110, 205 120, 195 150 Z" fill="#10b981" opacity="0.8"/>
  <path d="M195 150 C 210 135, 225 120, 220 100 C 205 115, 200 130, 195 150 Z" fill="#34d399" opacity="0.8"/>

  <!-- Desk and Abnormal Action Props -->
  <rect x="70" y="165" width="100" height="12" rx="3" fill="#334155"/>
  <rect x="85" y="177" width="10" height="43" fill="#475569"/>
  <rect x="145" y="177" width="10" height="43" fill="#475569"/>

  <!-- Laptop on desk (showing error/glitch) -->
  <path d="M95 155 L125 155 L128 165 L92 165 Z" fill="#64748b"/>
  <rect x="98" y="135" width="24" height="20" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Glitch lines on screen -->
  <line x1="102" y1="140" x2="114" y2="140" stroke="#ef4444" stroke-width="2"/>
  <line x1="102" y1="146" x2="118" y2="146" stroke="#38bdf8" stroke-width="2"/>
  <line x1="102" y1="151" x2="110" y2="151" stroke="#fbbf24" stroke-width="2"/>

  <!-- THE OBSERVER (Surprised Friend/Colleague) -->
  <g transform="translate(165, 95)">
    <!-- Body -->
    <path d="M 20 65 Q 20 45, 35 45 Q 50 45, 50 65 L 55 125 L 15 125 Z" fill="#334155"/>
    <!-- Head -->
    <circle cx="35" cy="28" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 20 25 C 20 12, 50 12, 50 25 C 50 20, 45 15, 35 15 C 25 15, 20 20, 20 25 Z" fill="#475569"/>
    <!-- Face Expression: Shock / Confusion -->
    <circle cx="30" cy="26" r="2.5" fill="#1e293b"/>
    <circle cx="42" cy="26" r="2.5" fill="#1e293b"/>
    <!-- Wide open 'O' mouth of surprise -->
    <ellipse cx="36" cy="35" rx="3.5" ry="4.5" fill="#1e293b"/>
    <!-- Eyebrows raised high -->
    <path d="M 27 21 Q 30 18, 33 21" stroke="#475569" stroke-width="1.5" fill="none"/>
    <path d="M 39 21 Q 42 18, 45 21" stroke="#475569" stroke-width="1.5" fill="none"/>
    <!-- Pointing hand towards the abnormal behavior -->
    <path d="M 15 55 Q 0 50, -10 40" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="-12" cy="38" r="3" fill="#fbcfe8"/>
  </g>

  <!-- THE SUBJECT SHOWING ABNORMAL BEHAVIOR (e.g., Floating upside down or bizarre pose, representing "fǎncháng" - abnormal) -->
  <g transform="translate(95, 60)">
    <!-- Floating / Suspended in air motion lines -->
    <path d="M -15 30 Q -5 40, -15 50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.6"/>
    <path d="M 75 30 Q 65 40, 75 50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.6"/>

    <!-- Body (Leaning/Floating sideways in an absurdly unnatural way) -->
    <g transform="rotate(-25, 30, 50)">
      <!-- Torso -->
      <rect x="18" y="35" width="28" height="45" rx="8" fill="#ec4899"/>
      
      <!-- Head -->
      <circle cx="32" cy="18" r="16" fill="#fcd34d"/>
      <!-- Hair -->
      <path d="M 16 18 C 16 5, 48 5, 48 18 C 45 10, 19 10, 16 18 Z" fill="#b45309"/>
      
      <!-- Face: Wide frantic eyes, weird exaggerated smile (Abnormal expression) -->
      <circle cx="26" cy="16" r="3" fill="#1e293b"/>
      <circle cx="38" cy="16" r="3" fill="#1e293b"/>
      <!-- Glint in eyes -->
      <circle cx="27" cy="15" r="1" fill="#ffffff"/>
      <circle cx="39" cy="15" r="1" fill="#ffffff"/>
      <!-- Crazy Wide Smile -->
      <path d="M 26 23 Q 32 30, 38 23" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Raised arched eyebrows -->
      <path d="M 23 11 Q 26 8, 29 12" stroke="#b45309" stroke-width="1.5" fill="none"/>
      <path d="M 35 12 Q 38 8, 41 11" stroke="#b45309" stroke-width="1.5" fill="none"/>

      <!-- Arms acting strangely (one holding coffee cup upside down without spilling, defying physics) -->
      <!-- Left Arm -->
      <path d="M 18 42 Q 0 45, -10 35" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Upside down coffee mug -->
      <path d="M -15 32 L -5 32 L -7 42 L -13 42 Z" fill="#fbbf24"/>
      <!-- Floating coffee drops defying gravity -->
      <circle cx="-10" cy="24" r="2" fill="#92400e"/>
      <circle cx="-6" cy="18" r="1.5" fill="#92400e"/>
      <circle cx="-14" cy="14" r="1" fill="#92400e"/>

      <!-- Right Arm raised high in erratic gesture -->
      <path d="M 46 42 Q 65 30, 60 15" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="60" cy="13" r="4" fill="#fcd34d"/>

      <!-- Legs crossed bizarrely in mid-air -->
      <path d="M 25 80 Q 20 100, 35 105" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M 39 80 Q 50 95, 40 108" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Sparkles / Confusion indicators floating around -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 65 55 L 67 62 L 74 64 L 67 66 L 65 73 L 63 66 L 56 64 L 63 62 Z" transform="scale(0.8) translate(20, 10)"/>
    <!-- Star 2 -->
    <path d="M 65 55 L 67 62 L 74 64 L 67 66 L 65 73 L 63 66 L 56 64 L 63 62 Z" transform="scale(0.5) translate(260, 40)" fill="#38bdf8"/>
    <!-- Question mark symbols stylized graphically (no letters/text, pure geometric shapes forming abstract perplexity) -->
    <path d="M 140 45 C 140 35, 155 35, 155 45 C 155 52, 145 55, 145 62" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="70" r="1.5" fill="#f59e0b"/>
  </g>

  <!-- Floor shadow beneath everything -->
  <ellipse cx="120" cy="215" rx="75" ry="8" fill="#020617" opacity="0.6"/>
</svg>