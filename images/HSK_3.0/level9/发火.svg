<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Anger / Hot Head Glow -->
    <radialGradient id="angerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Calm Blue Glow -->
    <radialGradient id="calmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment Lighting -->
  <circle cx="120" cy="120" r="120" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Room Interior / Background Props -->
  <g id="background">
    <!-- Window with Night City View -->
    <rect x="25" y="30" width="60" height="75" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="35" width="23" height="32" rx="2" fill="#1e293b"/>
    <rect x="57" y="35" width="23" height="32" rx="2" fill="#1e293b"/>
    <rect x="30" y="72" width="23" height="28" rx="2" fill="#1e293b"/>
    <rect x="57" y="72" width="23" height="28" rx="2" fill="#1e293b"/>
    <!-- City lights in window -->
    <circle cx="36" cy="45" r="1.5" fill="#fbbf24"/>
    <circle cx="45" cy="55" r="1.5" fill="#38bdf8"/>
    <circle cx="65" cy="42" r="1.5" fill="#f43f5e"/>
    <circle cx="72" cy="85" r="1.5" fill="#fbbf24"/>
    <circle cx="38" cy="90" r="1.5" fill="#38bdf8"/>

    <!-- Bookshelf / Wall Shelf -->
    <rect x="145" y="45" width="70" height="6" rx="2" fill="#475569"/>
    <!-- Books on shelf -->
    <path d="M155 30 h8 v15 h-8 z" fill="#f43f5e" rx="1"/>
    <path d="M165 27 h10 v18 h-10 z" fill="#38bdf8" rx="1"/>
    <path d="M177 33 h6 v12 h-6 z" fill="#10b981" rx="1"/>
    <path d="M185 25 h12 v20 h-12 z" fill="#fbbf24" rx="1"/>

    <!-- Wall Plant -->
    <path d="M200 45 c0 10 -5 15 -10 20" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="190" cy="65" r="8" fill="#10b981"/>
    <circle cx="198" cy="68" r="6" fill="#34d399"/>
  </g>

  <!-- Office / Living Room Desk -->
  <rect x="15" y="165" width="210" height="15" rx="4" fill="#334155"/>
  <rect x="25" y="180" width="12" height="40" fill="#1e293b"/>
  <rect x="203" y="180" width="12" height="40" fill="#1e293b"/>

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M35 155 h50 l8 10 h-66 z" fill="#64748b"/>
  <path d="M40 135 h40 v20 h-40 z" fill="#94a3b8" rx="2"/>
  <rect x="45" y="139" width="30" height="12" rx="1" fill="#0f172a"/>
  <!-- Coffee Mug with steam -->
  <path d="M195 145 c0 -8 -10 -8 -10 0 v15 h10 z" fill="#e2e8f0"/>
  <path d="M195 150 h4 c2 0 2 4 0 4 h-4" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Steam lines -->
  <path d="M188 133 c-2 -3 2 -5 0 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M192 135 c-2 -3 2 -5 0 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- CHARACTER 1: The Frustrated Person (Left - About to "Fa Huo" / Lose Temper) -->
  <g id="character-angry">
    <!-- Anger Atmosphere Glow -->
    <circle cx="75" cy="115" r="45" fill="url(#angerGlow)" pointer-events="none"/>

    <!-- Body / Torso (Leaning forward, tense) -->
    <path d="M55 165 c5 -20 20 -25 35 -15 l10 35 h-45 z" fill="#f43f5e"/>
    
    <!-- Arm (Slamming fist or tense gesture) -->
    <path d="M75 150 c15 -5 25 0 32 10" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round"/>
    <!-- Fist -->
    <circle cx="108" cy="162" r="7" fill="#fbcfe8"/>

    <!-- Neck -->
    <path d="M72 145 h10 v10 h-10 z" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="77" cy="122" r="20" fill="#fbcfe8"/>

    <!-- Hair (Messy, spiky with frustration) -->
    <path d="M57 122 c0 -15 15 -22 25 -18 c5 -8 18 -5 18 5 c8 3 8 15 2 20 c-5 5 -12 2 -15 2 c-10 5 -25 -2 -30 -9z" fill="#334155"/>

    <!-- Face Expression (Angry, frowning, gritting teeth) -->
    <!-- Angry Eyebrows (slanted down sharply) -->
    <path d="M65 114 l10 6" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M89 114 l-10 6" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Eyes (Determined/Angry slits) -->
    <circle cx="70" cy="123" r="2" fill="#1e293b"/>
    <circle cx="84" cy="123" r="2" fill="#1e293b"/>

    <!-- Mouth (Grimace / Shouting) -->
    <path d="M72 134 q6 4 12 0" fill="#1e293b" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>

    <!-- Minor frustration action lines near head -->
    <path d="M102 105 l8 -5" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M105 115 l10 -2" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2: The Calming / Pacifying Person (Right - Gesturing "Don't get angry") -->
  <g id="character-calm">
    <!-- Calm Atmosphere Glow -->
    <circle cx="160" cy="115" r="45" fill="url(#calmGlow)" pointer-events="none"/>

    <!-- Body / Torso (Relaxed posture, leaning back slightly) -->
    <path d="M145 165 c-5 -15 -15 -25 -25 -15 l-10 35 h45 z" fill="#38bdf8"/>

    <!-- Arm (Calming gesture: palm open facing left, telling "stop/calm down") -->
    <path d="M135 150 c-15 -5 -25 -15 -35 -2" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
    <!-- Open Palm Hand -->
    <path d="M96 142 c-4 -2 -6 2 -4 5 c2 2 4 4 6 6 z" fill="#fed7aa"/>

    <!-- Neck -->
    <path d="M148 145 h-10 v10 h10 z" fill="#fed7aa"/>

    <!-- Head -->
    <circle cx="145" cy="120" r="18" fill="#fed7aa"/>

    <!-- Hair (Gentle, neat bob/style) -->
    <path d="M129 115 c0 -15 12 -22 22 -22 c12 0 20 8 20 20 c0 10 -2 18 -5 22 c-3 0 -6 -8 -10 -8 c-6 0 -12 6 -15 6 c-3 0 -2 -8 -12 -18z" fill="#0f172a"/>

    <!-- Face Expression (Calm, empathetic, reassuring) -->
    <!-- Soft Eyebrows -->
    <path d="M136 113 q4 -3 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M148 113 q4 -3 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Gentle Eyes -->
    <circle cx="140" cy="120" r="2" fill="#1e293b"/>
    <circle cx="152" cy="120" r="2" fill="#1e293b"/>

    <!-- Gentle reassuring smile -->
    <path d="M143 130 q4 3 8 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Elements / Stop/Cool down floating symbols (non-textual, purely graphic) -->
  <!-- Gentle cool breeze curves floating between them -->
  <path d="M110 95 q8 -5 16 0" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M115 105 q6 -4 12 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Desk Lamp Fixture (Hanging from top or standing) -->
  <path d="M120 0 v35" stroke="#475569" stroke-width="4"/>
  <path d="M100 35 h40 l-10 15 h-20 z" fill="#cbd5e1"/>
  <!-- Light cone representation -->
  <polygon points="120,50 60,175 180,175" fill="#fbbf24" opacity="0.07" pointer-events="none"/>
</svg>