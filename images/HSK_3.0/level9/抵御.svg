<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative depth -->
  <path d="M0 190 L240 190" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Slanted strong wind gusts (representing 强台风) -->
  <g opacity="0.3">
    <path d="M40 70 L90 50" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 100 L110 65" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 130 L130 95" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 160 L100 125" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Farmland / Crops (农田) -->
  <g>
    <!-- Soil ground -->
    <path d="M140 165 C170 160, 200 162, 230 170 L230 190 L140 190 Z" fill="#2E3748"/>
    <!-- Sprouts / Crops -->
    <path d="M160 165 Q165 145 175 140 Q170 155 160 165" fill="#34D399"/>
    <path d="M185 162 Q190 142 200 137 Q195 152 185 162" fill="#10B981"/>
    <path d="M210 167 Q215 147 225 142 Q220 157 210 167" fill="#34D399"/>
  </g>

  <!-- Windbreak Forest / Tree barrier (防风林) - The physical object representing 抵御 -->
  <g>
    <!-- Ground for trees -->
    <path d="M10 170 C40 165, 80 165, 130 170 L130 190 L10 190 Z" fill="#252D3D"/>
    
    <!-- Tree 1 (Back) -->
    <path d="M35 170 L35 110" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="35" cy="95" r="22" fill="#7C3AED"/>
    
    <!-- Tree 2 (Front Center - Sturdy trunk and lush canopy) -->
    <path d="M75 170 L75 90" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round"/>
    <circle cx="75" cy="75" r="28" fill="#0284C7"/>
    
    <!-- Tree 3 (Right) -->
    <path d="M110 170 L110 100" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="110" cy="85" r="25" fill="#0EA5E9"/>
  </g>

  <!-- Deflecting wind arrows (visualizing the action of resisting/withstanding) -->
  <g>
    <!-- Wind hitting the barrier and deflecting upward -->
    <path d="M70 85 Q90 55 130 45" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M120 47 L130 45 L125 55" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <path d="M60 115 Q80 85 120 75" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M110 77 L120 75 L115 85" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Peaceful, protected zone marker (calm air over farmland) -->
  <circle cx="185" cy="110" r="3" fill="#FBBF24" opacity="0.8"/>
  <circle cx="205" cy="130" r="2" fill="#FBBF24" opacity="0.6"/>
</svg>