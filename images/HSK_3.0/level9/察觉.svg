<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle grid / atmosphere -->
  <g opacity="0.1" stroke="#4A5568" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="0" y1="60" x2="240" y2="60"/>
    <line x1="0" y1="140" x2="240" y2="140"/>
  </g>

  <!-- Focused Character (Investigator/Detective symbolizing acute awareness) -->
  <g transform="translate(0, 10)">
    <!-- Coat / Shoulders -->
    <path d="M70 195 L70 165 C70 145 90 135 120 135 C150 135 170 145 170 165 L170 195 Z" fill="#2D3748"/>
    <path d="M95 135 L120 160 L145 135 Z" fill="#1A1D24"/>
    <!-- Collar / Shirt -->
    <polygon points="105,135 120,150 135,135" fill="#E2E8F0"/>
    <path d="M110 135 L120 142 L130 135 Z" fill="#CBD5E0"/>

    <!-- Head / Face silhouette -->
    <path d="M95 90 C95 70 105 60 120 60 C135 60 145 70 145 90 L145 125 C145 135 135 140 120 140 C105 140 95 135 95 125 Z" fill="#CBD5E0"/>
    
    <!-- Trench coat lapels -->
    <path d="M70 165 L95 135 L95 195 L70 195 Z" fill="#4A5568"/>
    <path d="M170 165 L145 135 L145 195 L170 195 Z" fill="#4A5568"/>

    <!-- Hat (Fedora brim & crown) -->
    <ellipse cx="120" cy="65" rx="38" ry="8" fill="#2D3748"/>
    <path d="M92 63 C95 45 105 40 120 40 C135 40 145 45 148 63 Z" fill="#2D3748"/>
    <rect x="100" y="56" width="40" height="6" fill="#F6AD55" rx="2"/>

    <!-- Hand holding magnifying glass up to face (Perception / Insight) -->
    <path d="M105 160 C90 150 85 130 95 115 C98 110 105 108 110 112 L120 120 Z" fill="#CBD5E0"/>
    
    <!-- Magnifying Glass -->
    <g transform="translate(115, 95)">
      <!-- Glass glare / glow -->
      <circle cx="0" cy="0" r="32" fill="#1A202C"/>
      <circle cx="0" cy="0" r="30" fill="#2B6CB0" opacity="0.3"/>
      
      <!-- The "Clue" / Aha moment discovered inside the lens (Golden glowing anomaly) -->
      <path d="M-8 -5 L8 -5 L0 15 Z" fill="#F6AD55"/>
      <circle cx="0" cy="-10" r="5" fill="#F6AD55"/>
      <path d="M-15 -12 L-10 -15" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
      <path d="M15 -12 L10 -15" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>

      <!-- Glass rim -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#F6AD55" stroke-width="5"/>
      <path d="M-21 -21 L-15 -15" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

      <!-- Handle -->
      <line x1="21" y1="21" x2="42" y2="42" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
      <line x1="21" y1="21" x2="42" y2="42" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Concentrated Eye visible behind/near lens -->
    <path d="M125 95 C132 93 138 96 140 98" stroke="#1A202C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="132" cy="95" r="2.5" fill="#1A202C"/>
  </g>

  <!-- Focused Insight Sparks (Visualizing "Realization / Phát giác / Nhận ra") -->
  <g transform="translate(120, 35)">
    <circle cx="0" cy="0" r="4" fill="#F6AD55"/>
    <path d="M-12 -6 L-6 -3" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 -6 L6 -3" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 -14 L0 -8" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(185, 80)">
    <circle cx="0" cy="0" r="3" fill="#F6AD55"/>
    <path d="M-8 0 L-4 0" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 -8 L0 -4" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(55, 110)">
    <circle cx="0" cy="0" r="3" fill="#F6AD55"/>
    <path d="M4 0 L8 0" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 -6 L0 -3" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>