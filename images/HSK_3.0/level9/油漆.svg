<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Wall surface in background -->
    <rect x="35" y="40" width="170" height="135" rx="4" fill="#242B35"/>
    <line x1="35" y1="85" x2="205" y2="85" stroke="#1D232C" stroke-width="2"/>
    <line x1="35" y1="130" x2="205" y2="130" stroke="#1D232C" stroke-width="2"/>
    <line x1="120" y1="40" x2="120" y2="85" stroke="#1D232C" stroke-width="2"/>
    <line x1="75" y1="85" x2="75" y2="130" stroke="#1D232C" stroke-width="2"/>
    <line x1="165" y1="85" x2="165" y2="130" stroke="#1D232C" stroke-width="2"/>
    <line x1="120" y1="130" x2="120" y2="175" stroke="#1D232C" stroke-width="2"/>

    <!-- Fresh glossy paint application on wall (Orange/Gold accent theme) -->
    <path d="M 60,60 L 140,60 L 130,150 L 50,150 Z" fill="#F59E0B" opacity="0.15"/>
    <path d="M 65,65 L 145,65 C 150,100 135,130 135,150 C 135,155 125,155 125,150 C 125,125 140,105 135,80 L 65,80 Z" fill="#F59E0B" opacity="0.3"/>
    
    <!-- Paint roller tool -->
    <!-- Roller handle -->
    <path d="M 175,175 L 155,145 C 152,141 154,136 159,134 L 163,132 C 168,130 173,133 175,138 L 190,165 Z" fill="#94A3B8"/>
    <path d="M 165,165 L 180,185 C 183,189 181,195 176,197 L 172,199 C 167,201 161,198 159,193 L 149,173 Z" fill="#334155"/>
    <!-- Metal frame -->
    <path d="M 163,132 L 163,105 C 163,98 168,95 175,95 L 185,95" fill="none" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Roller cylinder core -->
    <rect x="110" y="80" width="70" height="30" rx="6" fill="#334155"/>
    <!-- Roller cover (loaded with vibrant paint) -->
    <rect x="112" y="82" width="66" height="26" rx="5" fill="#F59E0B"/>
    <!-- Paint sheen / gloss on roller -->
    <path d="M 120,86 L 168,86" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Paint dripping effect from roller onto wall -->
    <path d="M 115,108 C 115,115 118,122 120,125 C 122,122 125,115 125,108 Z" fill="#F59E0B"/>
    <path d="M 145,108 C 145,118 147,128 149,132 C 151,128 153,118 153,108 Z" fill="#F59E0B"/>

    <!-- Paint can (Noun object) -->
    <!-- Can shadow -->
    <ellipse cx="85" cy="202" rx="35" ry="8" fill="#0F1115"/>
    
    <!-- Main can body -->
    <path d="M 50,140 L 50,195 C 50,203 70,208 85,208 C 100,208 120,203 120,195 L 120,140 Z" fill="#64748B"/>
    <path d="M 50,140 C 50,147 70,152 85,152 C 100,152 120,147 120,140 C 120,133 100,128 85,128 C 70,128 50,133 50,140 Z" fill="#94A3B8"/>
    
    <!-- Can label -->
    <path d="M 51,150 L 119,150 L 118,188 L 52,188 Z" fill="#1E293B"/>
    <rect x="62" y="160" width="46" height="18" rx="3" fill="#F59E0B" opacity="0.9"/>
    
    <!-- Can rim top -->
    <ellipse cx="85" cy="128" rx="32" ry="7" fill="#CBD5E1"/>
    <ellipse cx="85" cy="128" rx="28" ry="5" fill="#475569"/>
    
    <!-- Paint inside the open can (surface) -->
    <ellipse cx="85" cy="128" rx="26" ry="4" fill="#D97706"/>
    <ellipse cx="83" cy="127" rx="18" ry="2.5" fill="#F59E0B"/>
    
    <!-- Paint dripping down the side of the can -->
    <path d="M 75,145 C 75,155 72,162 70,168 C 68,162 66,155 66,145 Z" fill="#F59E0B"/>
  </g>
</svg>