<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Light Beam / Aha Moment Gradient -->
    <linearGradient id="ahaGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall Details -->
  <rect x="0" y="0" width="240" height="170" fill="#111827"/>
  
  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="40" width="35" height="90" rx="4" fill="#1f2937" opacity="0.6"/>
  <rect x="30" y="55" width="25" height="6" rx="2" fill="#374151"/>
  <rect x="30" y="75" width="20" height="6" rx="2" fill="#374151"/>
  <rect x="30" y="95" width="25" height="6" rx="2" fill="#374151"/>

  <!-- Window with Night City Silhouette -->
  <path d="M165 30 L210 30 L210 115 L165 115 Z" fill="url(#windowGlow)"/>
  <path d="M175 40 L190 40 L190 100 L175 100 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M195 50 L205 50 L205 100 L195 100 Z" fill="#0f172a" opacity="0.8"/>
  <!-- Window Frame Grid -->
  <rect x="165" y="30" width="45" height="85" rx="2" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="187" y1="30" x2="187" y2="115" stroke="#334155" stroke-width="1.5"/>
  <line x1="165" y1="72" x2="210" y2="72" stroke="#334155" stroke-width="1.5"/>

  <!-- Hanging Lamp -->
  <path d="M95 10 L115 10 L120 25 L90 25 Z" fill="#475569"/>
  <line x1="105" y1="0" x2="105" y2="10" stroke="#64748b" stroke-width="2"/>
  <!-- Lamp Light Cone -->
  <polygon points="105,25 30,170 180,170" fill="url(#ahaGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- DESK SURFACE -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#deskGrad)" filter="url(#softShadow)"/>
  <rect x="0" y="156" width="240" height="6" fill="#475569"/> <!-- Desk rim highlight -->

  <!-- DESK PROPS -->
  <!-- Laptop -->
  <path d="M130 140 L195 140 L205 162 L120 162 Z" fill="#64748b" filter="url(#softShadow)"/> <!-- Base -->
  <rect x="133" y="105" width="59" height="38" rx="3" fill="#334155"/> <!-- Screen frame -->
  <rect x="136" y="108" width="53" height="32" rx="2" fill="url(#screenGlow)"/> <!-- Screen lit -->
  <!-- Abstract Data / Graphs on Screen (No text!) -->
  <polyline points="142,130 150,120 158,125 168,114 178,118" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="168" cy="114" r="2.5" fill="#f43f5e"/>

  <!-- Coffee Mug -->
  <rect x="205" y="138" width="16" height="20" rx="3" fill="#cbd5e1" filter="url(#softShadow)"/>
  <path d="M221 143 C226 143, 226 153, 221 153" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam -->
  <path d="M211 130 C209 125, 215 120, 213 115" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Notebook & Pen -->
  <rect x="75" y="145" width="40" height="25" rx="2" transform="rotate(-5 95 155)" fill="#f8fafc" filter="url(#softShadow)"/>
  <line x1="82" y1="152" x2="108" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="83" y1="158" x2="105" y2="156" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="68" y1="152" x2="90" y2="168" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/> <!-- Pen -->

  <!-- THE "AHA MOMENT" / SECRET KEY / PUZZLE PIECE GLOW ICON FLOATING -->
  <!-- Magical glowing key/puzzle abstract representing "Qiaomen" (The trick/secret solution) -->
  <g transform="translate(105, 82)" filter="url(#glowFilter)">
    <circle cx="0" cy="0" r="16" fill="#fbbf24" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
    <!-- Star sparkles -->
    <path d="M 0 -18 L 3 -10 L 11 -7 L 3 -4 L 0 4 L -3 -4 L -11 -7 L -3 -10 Z" fill="#fef08a" transform="scale(0.6) translate(15, -15)"/>
    <path d="M 0 -18 L 3 -10 L 11 -7 L 3 -4 L 0 4 L -3 -4 L -11 -7 L -3 -10 Z" fill="#fef08a" transform="scale(0.4) translate(-25, 10)"/>
  </g>

  <!-- CHARACTER: The Smart Solver -->
  <g id="character">
    <!-- Body / Torso (leaning forward excitedly) -->
    <path d="M 75 165 C 75 140, 95 125, 115 135 L 125 170 L 65 170 Z" fill="#2563eb" filter="url(#softShadow)"/>
    
    <!-- Collar / Shirt detail -->
    <path d="M 90 132 L 100 145 L 110 132 Z" fill="#f8fafc"/>

    <!-- Head & Neck -->
    <path d="M 93 125 L 103 125 L 105 135 L 91 135 Z" fill="#fbcfe8" opacity="0.8"/> <!-- Neck -->
    <circle cx="98" cy="100" r="22" fill="#fbcfe8" filter="url(#softShadow)"/> <!-- Face base -->

    <!-- Hair (Stylish modern haircut) -->
    <path d="M 77 98 C 76 80, 90 75, 105 78 C 118 80, 121 92, 120 102 C 120 102, 115 90, 102 87 C 88 84, 80 95, 77 98 Z" fill="#1e293b"/>
    <path d="M 76 96 C 75 90, 82 82, 95 80 L 98 86 C 88 86, 80 92, 76 96 Z" fill="#334155"/>

    <!-- Facial Expression: Eureka / Aha! (Joyful realization) -->
    <!-- Eyebrows (Arched high in excitement) -->
    <path d="M 87 91 C 90 88, 95 88, 98 91" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 103 91 C 106 88, 111 88, 114 91" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes (Happy curved arcs or sparkling wide) -->
    <circle cx="92" cy="97" r="3" fill="#1e293b"/>
    <circle cx="109" cy="97" r="3" fill="#1e293b"/>
    <!-- Eye sparkle highlights -->
    <circle cx="93" cy="96" r="1" fill="#ffffff"/>
    <circle cx="110" cy="96" r="1" fill="#ffffff"/>

    <!-- Cheeks (Excited blush) -->
    <circle cx="89" cy="103" r="4" fill="#f43f5e" opacity="0.3"/>
    <circle cx="112" cy="103" r="4" fill="#f43f5e" opacity="0.3"/>

    <!-- Mouth (Wide joyful grin of discovery) -->
    <path d="M 94 105 Q 101 114 107 105 Z" fill="#9f1239"/>
    <path d="M 95 106 Q 101 111 106 106 Z" fill="#f43f5e"/>

    <!-- Arms & Hands Gesturing "Aha!" -->
    <!-- Left Arm (Back, supporting) -->
    <path d="M 75 145 L 60 160 L 70 170" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Arm & Hand pointing up triumphantly to the glowing solution icon -->
    <path d="M 115 138 C 130 130, 135 110, 130 95" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand / Finger pointing -->
    <circle cx="130" cy="92" r="6" fill="#fbcfe8"/>
    <path d="M 128 85 L 132 85 L 132 90 L 128 90 Z" fill="#fbcfe8"/> <!-- pointing finger -->
  </g>

  <!-- Foreground Atmospheric Particles (Light dust/magic floating motes) -->
  <circle cx="115" cy="70" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="135" cy="80" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="95" cy="75" r="1" fill="#fef08a" opacity="0.7"/>
  <circle cx="125" cy="55" r="2.5" fill="#fef08a" opacity="0.5"/>
</svg>