<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Ancient city wall silhouette) -->
  <path d="M 30,190 L 30,160 L 50,160 L 50,190 L 70,190 L 70,150 L 90,150 L 90,190 L 150,190 L 150,140 L 170,140 L 170,190 L 190,190 L 190,165 L 210,165 L 210,190 Z" fill="#242832" opacity="0.6"/>
  <!-- Base ground line -->
  <rect x="20" y="190" width="200" height="4" rx="2" fill="#323846"/>

  <!-- Central Physical Object: Ancient Multi-layered Chinese Pagoda / Temple Structure representing "Bề dày lịch sử văn hóa" (Cultural Depth) -->
  <!-- Foundation / Deep base layers -->
  <path d="M 80,190 L 160,190 L 150,175 L 90,175 Z" fill="#3D4455"/>
  <rect x="85" y="165" width="70" height="10" rx="1" fill="#4E5668"/>

  <!-- First Tier -->
  <path d="M 70,165 L 170,165 L 180,155 L 60,155 Z" fill="#E5983B"/>
  <rect x="80" y="125" width="80" height="30" fill="#2C313C"/>
  <!-- Traditional windows -->
  <rect x="95" y="135" width="12" height="15" rx="6" fill="#1A1D24"/>
  <rect x="114" y="135" width="12" height="15" rx="6" fill="#1A1D24"/>
  <rect x="133" y="135" width="12" height="15" rx="6" fill="#1A1D24"/>

  <!-- Second Tier -->
  <path d="M 65,125 L 175,125 L 185,115 L 55,115 Z" fill="#F4A261"/>
  <rect x="90" y="85" width="60" height="30" fill="#2C313C"/>
  <rect x="102" y="95" width="10" height="14" rx="5" fill="#1A1D24"/>
  <rect x="128" y="95" width="10" height="14" rx="5" fill="#1A1D24"/>

  <!-- Third Tier -->
  <path d="M 75,85 L 165,85 L 175,75 L 65,75 Z" fill="#E5983B"/>
  <rect x="100" y="55" width="40" height="20" fill="#2C313C"/>
  <rect x="113" y="62" width="14" height="13" rx="7" fill="#1A1D24"/>

  <!-- Roof Top & Spire -->
  <path d="M 90,55 L 150,55 L 140,45 L 100,45 Z" fill="#F4A261"/>
  <path d="M 115,45 L 125,45 L 128,25 L 120,18 L 112,25 Z" fill="#E76F51"/>

  <!-- Glowing cultural strata lines representing "Chiều sâu / Bề dày" (Layers of history) -->
  <path d="M 45,100 C 60,95 70,105 85,100" stroke="#E5983B" stroke-width="2" fill="none" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M 155,100 C 170,95 180,105 195,100" stroke="#E5983B" stroke-width="2" fill="none" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M 35,140 C 50,135 60,145 75,140" stroke="#E5983B" stroke-width="2" fill="none" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M 165,140 C 180,135 190,145 205,140" stroke="#E5983B" stroke-width="2" fill="none" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Floating ancient scroll/book accents symbolizing profound heritage -->
  <g transform="translate(32, 160) rotate(-15)">
    <rect x="0" y="0" width="22" height="12" rx="3" fill="#E5983B"/>
    <rect x="2" y="2" width="18" height="8" rx="1" fill="#FFF3CD" opacity="0.8"/>
  </g>
  <g transform="translate(185, 155) rotate(12)">
    <rect x="0" y="0" width="22" height="12" rx="3" fill="#E5983B"/>
    <rect x="2" y="2" width="18" height="8" rx="1" fill="#FFF3CD" opacity="0.8"/>
  </g>

  <!-- Focus illumination / aura at the center -->
  <circle cx="120" cy="110" r="75" fill="none" stroke="#F4A261" stroke-width="1.5" opacity="0.2"/>
</svg>