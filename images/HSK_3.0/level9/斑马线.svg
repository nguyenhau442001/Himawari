<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road Surface -->
  <rect x="0" y="140" width="240" height="100" fill="#2D3436"/>
  
  <!-- Zebra Crossing (斑马线) -->
  <rect x="80" y="140" width="80" height="100" fill="#E0E0E0"/>
  <rect x="85" y="145" width="10" height="90" fill="#2D3436"/>
  <rect x="100" y="145" width="10" height="90" fill="#2D3436"/>
  <rect x="115" y="145" width="10" height="90" fill="#2D3436"/>
  <rect x="130" y="145" width="10" height="90" fill="#2D3436"/>
  <rect x="145" y="145" width="10" height="90" fill="#2D3436"/>
  
  <!-- Pedestrian Character -->
  <g transform="translate(100, 80)">
    <circle cx="20" cy="20" r="8" fill="#FFC107"/>
    <rect x="18" y="28" width="4" height="25" fill="#FFC107"/>
    <rect x="10" y="35" width="20" height="4" fill="#FFC107"/>
    <rect x="16" y="53" width="3" height="15" fill="#FFC107"/>
    <rect x="21" y="53" width="3" height="15" fill="#FFC107"/>
  </g>
  
  <!-- Car (Representing the vehicle yielding) -->
  <g transform="translate(10, 160)">
    <rect x="0" y="10" width="60" height="20" rx="4" fill="#FF9800"/>
    <rect x="10" y="0" width="40" height="15" rx="2" fill="#FF9800"/>
    <circle cx="15" cy="30" r="6" fill="#FFFFFF"/>
    <circle cx="45" cy="30" r="6" fill="#FFFFFF"/>
  </g>
</svg>