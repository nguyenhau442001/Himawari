<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow & Grid Elements (Modern Dark Mode UI Context) -->
  <circle cx="120" cy="120" r="80" fill="#162032" opacity="0.6"/>
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2A3447" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Corporate Building Icon (Representing "Company") -->
  <g transform="translate(145, 60)">
    <!-- Building body -->
    <rect x="0" y="20" width="45" height="100" rx="4" fill="#2D3748"/>
    <!-- Windows -->
    <rect x="8" y="32" width="8" height="12" rx="1" fill="#4A5568"/>
    <rect x="28" y="32" width="8" height="12" rx="1" fill="#4A5568"/>
    <rect x="8" y="56" width="8" height="12" rx="1" fill="#4A5568"/>
    <rect x="28" y="56" width="8" height="12" rx="1" fill="#4A5568"/>
    <rect x="8" y="80" width="8" height="12" rx="1" fill="#4A5568"/>
    <rect x="28" y="80" width="8" height="12" rx="1" fill="#4A5568"/>
  </g>

  <!-- Motion Lines (Indicating Demand / Action of Taking) -->
  <g opacity="0.8">
    <path d="M 115 105 L 140 105" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
    <path d="M 110 120 L 135 120" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <polygon points="138,116 146,120 138,124" fill="#F6AD55"/>
    <path d="M 115 135 L 140 135" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  </g>

  <!-- Compensation/Asset Object (Gold coin/token being demanded) -->
  <g transform="translate(122, 107)">
    <circle cx="0" cy="0" r="14" fill="#D69E2E"/>
    <circle cx="0" cy="0" r="10" fill="#ECC94B"/>
    <path d="M-3 -4 L3 -4 M-3 0 L3 0 M-3 4 L3 4" stroke="#D69E2E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Human Character (Active stance, hand outstretched demanding/taking) -->
  <g transform="translate(45, 75)">
    <!-- Body / Torso -->
    <path d="M 30 50 L 50 50 L 55 105 L 25 105 Z" fill="#3182CE"/>
    
    <!-- Head -->
    <circle cx="40" cy="24" r="12" fill="#CBD5E0"/>
    
    <!-- Back Arm -->
    <path d="M 35 52 L 20 75" stroke="#2B6CB0" stroke-width="8" stroke-linecap="round"/>

    <!-- Front Arm Reaching Out (Action Focus) -->
    <path d="M 45 54 L 78 85" stroke="#3182CE" stroke-width="9" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="83" cy="88" r="6" fill="#CBD5E0"/>

    <!-- Legs -->
    <path d="M 32 105 L 25 145" stroke="#1A202C" stroke-width="8" stroke-linecap="round"/>
    <path d="M 48 105 L 55 145" stroke="#1A202C" stroke-width="8" stroke-linecap="round"/>
  </g>

</svg>