<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle grid/lines for context -->
  <path d="M0 120h240M120 0v240" stroke="#2D343E" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- The "Action" - A person (local authority figure) placing a puzzle piece (solution) into a gap -->
  <!-- Representing "Appropriate/Fitting" (得当) action -->
  
  <!-- Person's arm and hand -->
  <g transform="translate(80, 70)">
    <path d="M40 80 C 40 120, 60 140, 80 140" fill="none" stroke="#F9A825" stroke-width="12" stroke-linecap="round"/>
    <path d="M80 140 L 95 130" stroke="#F9A825" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- The Puzzle Piece (The 'Appropriate' solution) -->
  <g transform="translate(110, 100)">
    <path d="M0 0 L 40 0 L 40 40 L 20 40 C 20 55, 0 55, 0 40 Z" fill="#F9A825"/>
  </g>
  
  <!-- The Target Area (The 'Problem' being solved) -->
  <g transform="translate(110, 140)">
    <path d="M0 0 L 40 0 L 40 40 L 20 40 C 20 25, 0 25, 0 40 Z" fill="none" stroke="#5D6D7E" stroke-width="4" stroke-dasharray="6 6"/>
  </g>
  
  <!-- Motion lines indicating precise placement -->
  <path d="M130 90 L 130 100" stroke="#F9A825" stroke-width="3" stroke-linecap="round"/>
  <path d="M125 95 L 135 95" stroke="#F9A825" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative accent for professional context -->
  <circle cx="190" cy="50" r="4" fill="#F9A825" opacity="0.6"/>
  <circle cx="200" cy="60" r="6" fill="#F9A825" opacity="0.3"/>
</svg>