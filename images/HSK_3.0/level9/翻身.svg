<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="180" rx="70" ry="12" fill="#111318"/>

  <!-- Motion trajectory arc representing "turning over" / fānshēn -->
  <path d="M 65 145 C 65 100, 110 85, 120 85 C 130 85, 175 100, 175 145" 
        fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.6"/>
  <!-- Arrowhead indicating direction of the flip -->
  <path d="M 168 135 L 178 147 L 163 151" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Baby Character (Semantic: 婴儿学习自主翻身) -->
  <!-- Mattress / Baby mat -->
  <path d="M 65 155 L 175 155 C 183 155, 185 170, 175 170 L 65 170 C 55 170, 57 155, 65 155 Z" fill="#2D3748"/>
  <rect x="75" y="159" width="90" height="7" rx="3.5" fill="#4A5568"/>

  <!-- Baby body in a dynamic, semi-turned posture -->
  <!-- Head -->
  <circle cx="120" cy="108" r="22" fill="#FDE68A"/>
  <!-- Hair tuft -->
  <path d="M 116 86 C 116 84, 120 82, 123 85" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Body (On-the-side / rolling motion) -->
  <rect x="104" y="125" width="32" height="35" rx="12" fill="#60A5FA"/>

  <!-- Visible arm reaching up/over -->
  <path d="M 112 135 C 100 130, 92 140, 95 148" fill="none" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Visible legs bent in rolling motion -->
  <path d="M 125 155 C 135 160, 142 152, 148 142" fill="none" stroke="#93C5FD" stroke-width="9" stroke-linecap="round"/>

  <!-- Cheerful facial expression -->
  <circle cx="113" cy="106" r="2" fill="#1E293B"/>
  <circle cx="127" cy="106" r="2" fill="#1E293B"/>
  <path d="M 117 114 C 119 117, 121 117, 123 114" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
</svg>