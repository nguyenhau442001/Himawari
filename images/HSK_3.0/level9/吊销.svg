<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Driver's License Physical Object (Central Noun) -->
    <!-- Base card rotated and tilted to suggest formal invalidation/revocation -->
    <g transform="translate(120, 115) rotate(-12)">
      <!-- Card Body -->
      <rect x="-65" y="-45" width="130" height="90" rx="10" fill="#2D323E" stroke="#4A5265" stroke-width="2"/>
      
      <!-- Card Header Accent -->
      <path d="M -65 -35 L 65 -35" stroke="#E5534B" stroke-width="4" opacity="0.8"/>
      
      <!-- Photo Placeholder -->
      <rect x="-50" y="-22" width="28" height="36" rx="4" fill="#3E4455"/>
      <circle cx="-36" cy="-10" r="7" fill="#6C758A"/>
      <path d="M -48 7 C -48 1, -44 1, -36 1 C -28 1, -24 1, -24 7 Z" fill="#6C758A"/>
      
      <!-- ID Lines / Details -->
      <rect x="-16" y="-20" width="45" height="6" rx="3" fill="#6C758A" opacity="0.7"/>
      <rect x="-16" y="-8" width="60" height="5" rx="2.5" fill="#4A5265" opacity="0.6"/>
      <rect x="-16" y="1" width="50" height="5" rx="2.5" fill="#4A5265" opacity="0.6"/>
      <rect x="-16" y="10" width="35" height="5" rx="2.5" fill="#4A5265" opacity="0.6"/>
    </g>

    <!-- Revocation Action: Large Red Cross / X overlaying the license -->
    <g transform="translate(120, 115)">
      <!-- Drop shadow for the X -->
      <path d="M -38 -38 L 38 38 M -38 38 L 38 -38" stroke="#1A1D24" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
      <!-- Main Bright Red X -->
      <path d="M -36 -36 L 36 36 M -36 36 L 36 -36" stroke="#E5534B" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Formal Official Stamp / Seal (Bottom Right Accent) -->
    <g transform="translate(170, 160)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#E5534B" stroke-width="2.5" stroke-dasharray="4,2"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#E5534B" stroke-width="1.5"/>
      <path d="M -7 -2 L -2 4 L 7 -5" fill="none" stroke="#E5534B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Subtle contextual element: Steering wheel outline fading in background -->
    <circle cx="120" cy="115" r="85" fill="none" stroke="#252A34" stroke-width="3" stroke-dasharray="8,6" opacity="0.4"/>
  </g>
</svg>