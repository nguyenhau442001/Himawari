<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle UI surface/panel holding the button -->
  <rect x="52" y="52" width="136" height="136" rx="16" fill="#222730" stroke="#2D333F" stroke-width="2"/>
  
  <!-- Outer metallic/shadow rim of the button -->
  <circle cx="120" cy="116" r="44" fill="#2E3544"/>
  
  <!-- Bevel / 3D depth of the button body -->
  <circle cx="120" cy="114" r="38" fill="#3A4254"/>
  
  <!-- Main clickable button surface (active state, vibrant accent color) -->
  <circle cx="120" cy="110" r="38" fill="#FF7043"/>
  
  <!-- Top inner highlight for glossy flat-vector depth -->
  <path d="M 86 100 C 95 86, 145 86, 154 100 C 144 92, 96 92, 86 100 Z" fill="#FFB299" opacity="0.6"/>

  <!-- Cursor / Hand clicking action symbolizing "请点击这个按钮" -->
  <g transform="translate(12, 10)">
    <!-- Mouse Cursor -->
    <path d="M 124 116 L 124 146 L 134 136 L 148 160 L 156 156 L 142 132 L 158 132 Z" fill="#FFFFFF" stroke="#1A1D24" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Subtle click wave / ripple effect indicating interaction -->
    <circle cx="108" cy="100" r="18" fill="none" stroke="#FFB299" stroke-width="2.5" opacity="0.7"/>
  </g>
</svg>