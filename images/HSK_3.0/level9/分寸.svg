<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" clip-path="url(#canvasClip)"/>

  <!-- Interior Background / Office or Living Room Setting -->
  <g clip-path="url(#canvasClip)">
    <!-- Back wall & Floor -->
    <rect x="0" y="0" width="240" height="170" fill="#1e293b"/>
    <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
    <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

    <!-- Window with soft night light -->
    <path d="M170,30 L210,30 L210,110 L170,110 Z" fill="#0b1329" stroke="#334155" stroke-width="2"/>
    <line x1="190" y1="30" x2="190" y2="110" stroke="#334155" stroke-width="1.5"/>
    <line x1="170" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="1.5"/>

    <!-- Bookshelf / Props background -->
    <rect x="20" y="40" width="40" height="80" fill="#1b2a47" rx="2"/>
    <line x1="20" y1="65" x2="60" y2="65" stroke="#334155" stroke-width="1.5"/>
    <line x1="20" y1="95" x2="60" y2="95" stroke="#334155" stroke-width="1.5"/>
    <!-- Books -->
    <rect x="25" y="47" width="8" height="18" fill="#38bdf8" rx="1"/>
    <rect x="35" y="45" width="10" height="20" fill="#fb923c" rx="1"/>
    <rect x="25" y="75" width="12" height="20" fill="#10b981" rx="1"/>

    <!-- Ambient warm glow above the conversation -->
    <ellipse cx="120" cy="110" rx="80" ry="50" fill="url(#warmLight)"/>
  </g>

  <!-- Table and Props -->
  <g clip-path="url(#canvasClip)">
    <!-- Wooden Table -->
    <path d="M60,165 L180,165 L190,195 L50,195 Z" fill="#334155"/>
    <path d="M55,160 L185,160 L180,165 L60,165 Z" fill="#475569"/>
    <!-- Table legs -->
    <rect x="68" y="195" width="8" height="25" fill="#1e293b"/>
    <rect x="164" y="195" width="8" height="25" fill="#1e293b"/>

    <!-- Teacups on table -->
    <ellipse cx="85" cy="162" rx="8" ry="4" fill="#cbd5e1"/>
    <path d="M77,162 L79,169 C79,170 91,170 93,169 L93,162 Z" fill="#f8fafc"/>
    <ellipse cx="155" cy="162" rx="8" ry="4" fill="#cbd5e1"/>
    <path d="M147,162 L149,169 C149,170 161,170 163,169 L163,162 Z" fill="#f8fafc"/>
  </g>

  <!-- Characters -->
  <g clip-path="url(#canvasClip)">
    <!-- Left Character (Listening attentively, calm posture, embodying 'fēncun'/boundaries) -->
    <!-- Body / Torso -->
    <path d="M65,185 C65,150 85,145 95,145 C105,145 115,150 115,185 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="90" cy="118" r="16" fill="#fbcfe8"/>
    <!-- Hair (dark stylish bob) -->
    <path d="M75,115 C75,102 105,102 105,115 C105,122 102,125 102,125 L98,115 C98,110 82,110 80,115 Z" fill="#334155"/>
    <!-- Gentle expression, calm eyes, closed mouth (good listener) -->
    <circle cx="86" cy="117" r="1.5" fill="#1e293b"/>
    <circle cx="94" cy="117" r="1.5" fill="#1e293b"/>
    <path d="M88,124 Q90,126 92,124" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="87" y="132" width="6" height="15" fill="#fbcfe8"/>
    <!-- Arm resting gracefully -->
    <path d="M75,155 Q85,160 95,160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Right Character (Speaking with measured, balanced gestures - 'chừng mực') -->
    <!-- Body / Torso -->
    <path d="M125,185 C125,150 145,145 155,145 C165,145 175,150 175,185 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="150" cy="115" r="16" fill="#fbcfe8"/>
    <!-- Hair (neat short side part) -->
    <path d="M136,114 C136,100 164,100 164,114 C164,118 160,118 158,115 C150,108 140,110 138,115 Z" fill="#1e293b"/>
    <!-- Expression (engaged, thoughtful speaking face) -->
    <circle cx="146" cy="114" r="1.5" fill="#1e293b"/>
    <circle cx="154" cy="114" r="1.5" fill="#1e293b"/>
    <ellipse cx="150" cy="122" rx="2" ry="1.5" fill="#1e293b"/>
    <!-- Neck -->
    <rect x="147" y="129" width="6" height="15" fill="#fbcfe8"/>
    
    <!-- Expressive hand gesture indicating moderate measure/balance ("fēncun") -->
    <!-- Back arm/shoulder -->
    <path d="M165,155 Q160,145 155,145" stroke="#fb923c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Front arm raised calmly with open palm facing gently downward (signifying measured, polite tone) -->
    <path d="M135,155 Q125,145 125,130 L122,125" stroke="#fb923c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="121" cy="122" r="3.5" fill="#fbcfe8"/>
  </g>

  <!-- Visual Metaphor: Subtle Balance / Boundary Indicator (Clean, non-abstract, integrated into scene lighting) -->
  <g opacity="0.6">
    <!-- Gentle suspended pendant lamp casting the warm cone of light -->
    <path d="M100,10 L140,10 L135,30 L105,30 Z" fill="#64748b"/>
    <ellipse cx="120" cy="30" rx="18" ry="4" fill="#94a3b8"/>
    <!-- Balanced scale-like interplay represented by balanced positioning of speech bubbles or light rays (purely graphical, beautiful accent) -->
    <path d="M110,85 Q120,80 130,85" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="120" cy="82" r="2" fill="#fbbf24"/>
  </g>
</svg>