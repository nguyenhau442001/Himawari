<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Authority/Expertise -->
    <radialGradient id="expert-glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- UI Panel Gradients -->
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#expert-glow)" />

  <!-- ENVIRONMENT: Modern Research / Expert Laboratory Background -->
  <!-- Bookshelf / Lab Shelves -->
  <g fill="#334155" opacity="0.6">
    <rect x="20" y="35" width="70" height="6" rx="3" />
    <rect x="30" y="20" width="10" height="15" />
    <rect x="42" y="16" width="12" height="19" />
    <rect x="56" y="22" width="8" height="13" />
    <rect x="66" y="18" width="14" height="17" />
  </g>

  <!-- Large Interactive Holographic / Digital Display (Field of Expertise) -->
  <rect x="120" y="35" width="95" height="75" rx="8" fill="url(#panel-grad)" stroke="#475569" stroke-width="1.5" />
  <path d="M 135 75 Q 155 50, 175 65 T 205 50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="175" cy="65" r="4" fill="#10b981" />
  <circle cx="205" cy="50" r="4" fill="#fbbf24" />
  
  <!-- Data chart bars inside display -->
  <rect x="135" y="82" width="12" height="18" rx="2" fill="#38bdf8" opacity="0.7" />
  <rect x="153" y="70" width="12" height="30" rx="2" fill="#10b981" opacity="0.7" />
  <rect x="171" y="78" width="12" height="22" rx="2" fill="#fbbf24" opacity="0.7" />
  <rect x="189" y="62" width="12" height="38" rx="2" fill="#ec4899" opacity="0.7" />

  <!-- Lab / Office Desk -->
  <path d="M 20 180 L 220 180 L 210 140 L 30 140 Z" fill="#334155" />
  <rect x="15" y="180" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Props (Microscope / Scientific Instrument representing 'Field') -->
  <g transform="translate(45, 115)">
    <path d="M 15 25 L 25 25 L 20 10 Z" fill="#64748b" />
    <rect x="18" y="18" width="15" height="12" fill="#94a3b8" />
    <path d="M 10 25 C 10 15, 30 15, 30 25" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <rect x="5" y="25" width="30" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Laptop on Desk -->
  <path d="M 85 140 L 115 140 L 122 130 L 78 130 Z" fill="#94a3b8" />
  <rect x="75" y="125" width="50" height="7" rx="1" fill="#cbd5e1" />

  <!-- MAIN SUBJECT: The Authority Expert (权威专家) -->
  <g id="expert-character">
    <!-- Body / Suit Jacket -->
    <path d="M 110 155 Q 125 155, 140 155 L 145 200 L 105 200 Z" fill="#1e293b" />
    <!-- Shirt Inner -->
    <path d="M 120 155 L 125 175 L 130 155 Z" fill="#f8fafc" />
    <!-- Tie -->
    <polygon points="123,163 127,163 126,182 124,182" fill="#f59e0b" />

    <!-- Neck -->
    <rect x="118" y="145" width="14" height="15" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="125" cy="125" r="20" fill="#fed7aa" />

    <!-- Distinguished Hair (Expert Look) -->
    <path d="M 105 125 C 105 105, 145 105, 145 125 C 145 120, 140 112, 125 110 C 110 112, 105 120, 105 125 Z" fill="#475569" />
    <!-- Subtle Gray Temples indicating seniority/authority -->
    <path d="M 107 124 C 106 128, 109 133, 113 135 C 111 130, 110 126, 107 124 Z" fill="#cbd5e1" />
    <path d="M 143 124 C 144 128, 141 133, 137 135 C 139 130, 140 126, 143 124 Z" fill="#cbd5e1" />

    <!-- Glasses (Smart/Authority Vibe) -->
    <rect x="113" y="118" width="10" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <rect x="127" y="118" width="10" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <line x1="123" y1="121" x2="127" y2="121" stroke="#1e293b" stroke-width="1.5" />

    <!-- Confident, Wise Smile -->
    <path d="M 120 133 Q 125 137, 130 133" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" />

    <!-- Gesturing Arm (Explaining with Authority) -->
    <path d="M 110 160 C 95 160, 90 145, 80 135" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    <!-- Hand pointing/gesturing -->
    <circle cx="76" cy="132" r="5" fill="#fed7aa" />
  </g>

  <!-- FOREGROUND: Attentive Junior Colleague / Student (Listening to the Expert) -->
  <g id="junior-character">
    <!-- Back of head & shoulders framing the foreground -->
    <path d="M 0 240 L 0 210 Q 0 190, 25 190 Q 50 190, 50 210 L 50 240 Z" fill="#334155" />
    <!-- Head in profile looking at the expert -->
    <circle cx="28" cy="180" r="14" fill="#fbcfe8" />
    <path d="M 18 175 C 18 165, 38 165, 38 178 Z" fill="#38bdf8" />
    <!-- Notebook taking notes -->
    <rect x="35" y="200" width="35" height="30" rx="3" fill="#f8fafc" transform="rotate(-15 35 200)" />
    <line x1="42" y1="208" x2="60" y2="213" stroke="#64748b" stroke-width="2" />
    <line x1="40" y1="215" x2="58" y2="220" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- Professional Lighting Accent (Top-right rim light) -->
  <path d="M 240 0 L 240 80 Q 180 0, 240 0 Z" fill="#ffffff" opacity="0.05" />
</svg>