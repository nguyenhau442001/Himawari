<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="folder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Office Details -->
  <path d="M40 30 L200 30 L200 160 L40 160 Z" fill="#1e293b"/>
  <!-- Window Grid showing night city -->
  <rect x="145" y="45" width="60" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="45" x2="175" y2="120" stroke="#334155" stroke-width="1.5"/>
  <line x1="145" y1="82" x2="205" y2="82" stroke="#334155" stroke-width="1.5"/>
  <!-- City lights through window -->
  <rect x="152" y="60" width="6" height="10" fill="#f59e0b" opacity="0.6"/>
  <rect x="162" y="90" width="8" height="15" fill="#38bdf8" opacity="0.4"/>
  <rect x="185" y="55" width="5" height="20" fill="#f59e0b" opacity="0.5"/>
  <rect x="190" y="95" width="7" height="12" fill="#38bdf8" opacity="0.5"/>

  <!-- Desk Surface -->
  <path d="M10 165 L230 165 L220 220 L20 220 Z" fill="url(#desk-grad)"/>
  <line x1="10" y1="165" x2="230" y2="165" stroke="#475569" stroke-width="2"/>

  <!-- Lamp Light Cone -->
  <polygon points="40,20 25,20 10,170 80,170" fill="#fbbf24" opacity="0.08"/>

  <!-- Desk Lamp -->
  <path d="M35 165 L45 165 L42 120 L38 120 Z" fill="#64748b"/>
  <path d="M25 65 L55 65 L65 85 L15 85 Z" fill="#cbd5e1"/>
  <ellipse cx="40" cy="75" rx="15" ry="5" fill="#fef08a" filter="url(#glow)"/>

  <!-- Character 1 (Official/Speaker pointing to document) -->
  <!-- Body/Suit -->
  <path d="M85 140 C85 125 95 110 110 110 L125 110 C140 110 150 125 150 140 L160 210 L75 210 Z" fill="#3b82f6"/>
  <!-- Shirt & Tie -->
  <polygon points="110,115 125,115 120,145 115,145" fill="#f8fafc"/>
  <polygon points="118,125 122,125 124,140 120,155 116,140" fill="#ef4444"/>
  <!-- Head & Face -->
  <circle cx="117" cy="85" r="18" fill="#fbcfe8"/>
  <path d="M103 80 C103 70 131 70 131 80 L131 88 C131 88 117 92 103 88 Z" fill="#1e293b"/> <!-- Hair -->
  <!-- Serious Expression -->
  <line x1="110" y1="82" x2="116" y2="84" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="124" y1="84" x2="130" y2="82" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="113" cy="87" r="1.5" fill="#0f172a"/>
  <circle cx="127" cy="87" r="1.5" fill="#0f172a"/>
  <path d="M117 97 Q120 94 123 97" fill="none" stroke="#9f1239" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character 1 Arms & Hands (Pointing gesture) -->
  <path d="M90 125 L65 145 L75 155 L100 135 Z" fill="#3b82f6"/> <!-- Left arm -->
  <circle cx="62" cy="148" r="5" fill="#fbcfe8"/> <!-- Left hand -->

  <!-- Confidential File / Folder on Desk -->
  <g transform="translate(95, 145)">
    <!-- Folder shadow -->
    <rect x="-2" y="2" width="55" height="40" rx="3" fill="#000000" opacity="0.3"/>
    <!-- Folder base -->
    <rect x="0" y="0" width="55" height="40" rx="3" fill="url(#folder-grad)"/>
    <path d="M0 5 L15 5 L20 12 L55 12 L55 40 L0 40 Z" fill="#dc2626"/>
    <!-- Paper inside -->
    <rect x="6" y="8" width="43" height="30" fill="#f8fafc"/>
    <!-- Red Confidential Stamp / Seal -->
    <circle cx="35" cy="23" r="10" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,1"/>
    <circle cx="35" cy="23" r="7" fill="none" stroke="#dc2626" stroke-width="1"/>
    <!-- Abstract text lines on document -->
    <line x1="12" y1="15" x2="26" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="21" x2="25" y2="21" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="27" x2="22" y2="27" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Warning / Security Shield Floating Icon (Subtle, professional, no text) -->
  <g transform="translate(180, 110)" filter="url(#glow)">
    <path d="M0 0 L18 -8 L36 0 L36 18 C36 30 18 42 18 42 C18 42 0 30 0 18 Z" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Lock Symbol inside Shield -->
    <rect x="12" y="18" width="12" height="10" rx="2" fill="#fbbf24"/>
    <path d="M15 18 L15 14 C15 12 21 12 21 14 L21 18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="22" r="1.5" fill="#0f172a"/>
  </g>

</svg>