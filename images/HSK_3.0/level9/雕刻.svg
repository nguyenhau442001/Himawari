<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wood Block Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="woodLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Workshop Details -->
  <!-- Shelf in background -->
  <rect x="25" y="45" width="80" height="6" rx="3" fill="#334155" />
  <rect x="135" y="45" width="80" height="6" rx="3" fill="#334155" />
  <!-- Small carved items on shelf -->
  <path d="M45 35 L55 45 L35 45 Z" fill="#d97706" />
  <rect x="70" y="32" width="12" height="13" rx="2" fill="#b45309" />
  <circle cx="160" cy="37" r="7" fill="#f59e0b" />
  <rect x="185" y="30" width="10" height="15" rx="3" fill="#d97706" />

  <!-- Hanging Desk Lamp (Warm lighting zone) -->
  <path d="M120 10 L120 40" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M100 40 L140 40 L130 55 L110 55 Z" fill="#475569" />
  <circle cx="120" cy="55" r="12" fill="url(#lampGlow)" />
  <ellipse cx="120" cy="130" rx="70" ry="45" fill="url(#lampGlow)" />

  <!-- Workbench Surface -->
  <rect x="15" y="150" width="210" height="75" rx="6" fill="url(#deskGrad)" />
  <!-- Wood grain lines on desk -->
  <path d="M20 165 C 80 160, 160 170, 220 162" stroke="#475569" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
  <path d="M20 190 C 70 195, 150 185, 220 192" stroke="#475569" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- Completed Wooden Sculpture (The finished piece being pointed at/showcased) -->
  <g transform="translate(155, 105)">
    <!-- Sculpture shadow -->
    <ellipse cx="20" cy="47" rx="18" ry="6" fill="#0f172a" opacity="0.6" />
    <!-- Detailed Wooden Bird Sculpture -->
    <path d="M5 35 Q 15 40, 25 45 Q 35 30, 30 15 Q 20 10, 10 20 Z" fill="url(#woodLight)" />
    <!-- Wing detail -->
    <path d="M15 25 Q 25 30, 22 40" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Head & Beak -->
    <circle cx="28" cy="12" r="6" fill="url(#woodLight)" />
    <polygon points="33,11 41,9 34,14" fill="#b45309" />
    <!-- Carved base stand -->
    <rect x="10" y="44" width="22" height="6" rx="2" fill="#78350f" />
  </g>

  <!-- Carver / Craftsman Character (Left/Center) -->
  <g transform="translate(30, 85)">
    <!-- Body / Apron -->
    <path d="M30 65 L60 65 L70 100 L20 100 Z" fill="#38bdf8" />
    <path d="M35 65 L55 65 L55 95 L35 95 Z" fill="#0284c7" /> <!-- Apron pocket/detail -->

    <!-- Neck & Head -->
    <rect x="40" y="42" width="12" height="15" rx="4" fill="#fcd34d" />
    <!-- Head circle -->
    <circle cx="46" cy="30" r="16" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M30 30 C 30 15, 62 15, 62 30 C 62 24, 60 20, 55 18 C 50 15, 40 15, 37 18 C 32 20, 30 24, 30 30 Z" fill="#1e293b" />
    <!-- Focused Face Expression -->
    <circle cx="41" cy="30" r="1.5" fill="#1e293b" />
    <circle cx="51" cy="30" r="1.5" fill="#1e293b" />
    <!-- Concentrated eyebrow angle -->
    <path d="M39 26 L44 28" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M48 28 L53 26" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Friendly smile -->
    <path d="M44 36 Q 46 39, 48 36" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="38" cy="33" r="2.5" fill="#f87171" opacity="0.4" />
    <circle cx="54" cy="33" r="2.5" fill="#f87171" opacity="0.4" />

    <!-- Left Arm holding wood -->
    <path d="M32 68 Q 20 75, 25 85" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Right Arm holding carving chisel -->
    <path d="M60 68 Q 75 75, 80 85" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Hand & Chisel Tool -->
    <g transform="translate(75, 80)">
      <circle cx="5" cy="5" r="4" fill="#fcd34d" />
      <!-- Chisel Handle -->
      <rect x="-2" y="-12" width="6" height="15" rx="2" transform="rotate(25)" fill="#ef4444" />
      <!-- Chisel Metal Blade -->
      <polygon points="5,5 12,18 9,20 2,7" fill="#cbd5e1" />
    </g>
  </g>

  <!-- The Wood Block Being Carved (Center Stage on Desk) -->
  <g transform="translate(80, 125)">
    <!-- Wood block shadow -->
    <ellipse cx="35" cy="35" rx="32" ry="12" fill="#0f172a" opacity="0.4" />
    <!-- 3D Wood Block -->
    <path d="M10 15 L50 5 L75 20 L35 30 Z" fill="url(#woodLight)" />
    <path d="M10 15 L35 30 L35 45 L10 30 Z" fill="#b45309" />
    <path d="M35 30 L75 20 L75 35 L35 45 Z" fill="url(#woodGrad)" />
    
    <!-- Carved chips / wood shavings on desk around the block -->
    <path d="M -5 32 Q 2 40, -2 42" stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 65 38 Q 72 45, 80 40" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 45 42 Q 55 48, 52 44" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Extra Tools on Workbench (Hammer & Detail Knife) -->
  <g transform="translate(25, 155)">
    <!-- Mallet / Small Hammer -->
    <rect x="0" y="10" width="18" height="10" rx="3" transform="rotate(-15)" fill="#94a3b8" />
    <rect x="10" y="15" width="22" height="6" rx="2" transform="rotate(35)" fill="#78350f" />
  </g>

  <g transform="translate(190, 160)">
    <!-- Extra carving knife -->
    <rect x="0" y="0" width="25" height="4" rx="2" transform="rotate(-40)" fill="#64748b" />
    <polygon points="-15,10 -12,15 -25,20" fill="#94a3b8" />
  </g>

  <!-- Sparkles / Craft Magic Accents (Denoting handmade quality) -->
  <path d="M110 95 L112 100 L117 102 L112 104 L110 109 L108 104 L103 102 L108 100 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M185 85 L186.5 88.5 L190 90 L186.5 91.5 L185 95 L183.5 91.5 L180 90 L183.5 88.5 Z" fill="#38bdf8" opacity="0.9" />
  <path d="M65 110 L66 112 L69 113 L66 114 L65 117 L64 114 L61 113 L64 112 Z" fill="#f43f5e" opacity="0.7" />
</svg>