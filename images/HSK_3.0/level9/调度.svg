<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Grid & Roads (representing transportation network) -->
  <g opacity="0.25">
    <line x1="20" y1="180" x2="220" y2="180" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="40" x2="120" y2="200" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
    <path d="M 50 180 Q 50 120 120 120 Q 190 120 190 60" fill="none" stroke="#4A5568" stroke-dasharray="6 6" stroke-width="3"/>
  </g>

  <!-- Central Physical Object: Modern Control Console / Dispatch Hub representing "调度" -->
  <g>
    <!-- Console Body (Desktop Dispatch Terminal) -->
    <rect x="52" y="70" width="136" height="88" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Screen Bezel -->
    <rect x="60" y="78" width="120" height="64" rx="4" fill="#0F172A"/>

    <!-- Dispatch UI / Active Routing Visualization on Screen -->
    <!-- Grid Map Lines -->
    <line x1="75" y1="110" x2="165" y2="110" stroke="#334155" stroke-width="2"/>
    <line x1="105" y1="90" x2="105" y2="125" stroke="#334155" stroke-width="2"/>
    <line x1="140" y1="90" x2="140" y2="125" stroke="#334155" stroke-width="2"/>

    <!-- Active Bus Vectors / Connection Lines -->
    <path d="M 75 110 Q 105 95 140 110 T 165 110" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

    <!-- Dispatch Nodes (Buses / Checkpoints) -->
    <circle cx="75" cy="110" r="4" fill="#38BDF8"/>
    <circle cx="105" cy="98" r="5" fill="#F59E0B"/>
    <circle cx="140" cy="110" r="4" fill="#38BDF8"/>
    <circle cx="165" cy="110" r="5" fill="#10B981"/>

    <!-- Control Base / Stand -->
    <path d="M 90 158 L 150 158 L 162 174 L 78 174 Z" fill="#4A5568"/>
    
    <!-- Console Keyboard / Control Panel area -->
    <rect x="68" y="174" width="104" height="10" rx="2" fill="#64748B"/>
    <!-- Control Buttons -->
    <circle cx="82" cy="179" r="2" fill="#F59E0B"/>
    <circle cx="90" cy="179" r="2" fill="#38BDF8"/>
    <circle cx="98" cy="179" r="2" fill="#10B981"/>
    <rect x="110" y="177" width="20" height="4" rx="1" fill="#334155"/>
    <circle cx="150" cy="179" r="2.5" fill="#EF4444"/>
  </g>

  <!-- Interactive Dispatch Elements (Focus/Control Accents) -->
  <!-- Floating Command Cursor / Pointer -->
  <g transform="translate(145, 82)">
    <polygon points="0,0 0,12 3.5,9 7,14 9.5,12.5 6,7.5 10.5,7.5" fill="#F59E0B" stroke="#1A1D24" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Focus ring around cursor action -->
    <circle cx="5" cy="5" r="9" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Real-time Signal Waves (Transmitting Coordination/Dispatch Instructions) -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8">
    <!-- Left Signal Wave -->
    <path d="M 38 95 C 32 102 32 118 38 125"/>
    <path d="M 30 90 C 22 100 22 120 30 130"/>

    <!-- Right Signal Wave -->
    <path d="M 202 95 C 208 102 208 118 202 125"/>
    <path d="M 210 90 C 218 100 218 120 210 130"/>
  </g>

  <!-- Accent Indicator: Mini Bus Icon hovering above to clearly ground the context in transport/scheduling -->
  <g transform="translate(108, 38)">
    <rect x="0" y="0" width="24" height="14" rx="3" fill="#F59E0B"/>
    <rect x="3" y="3" width="6" height="5" rx="1" fill="#0F172A"/>
    <rect x="11" y="3" width="6" height="5" rx="1" fill="#0F172A"/>
    <circle cx="5" cy="16" r="2.5" fill="#334155"/>
    <circle cx="19" cy="16" r="2.5" fill="#334155"/>
  </g>
</svg>