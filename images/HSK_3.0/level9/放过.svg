<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Detective/Investigator Figure -->
  <g transform="translate(60, 40)">
    <!-- Body -->
    <path d="M40 160 L40 120 L80 120 L80 160 Z" fill="#3D4451"/>
    <!-- Head -->
    <circle cx="60" cy="90" r="25" fill="#E0E6ED"/>
    <!-- Trench Coat Collar -->
    <path d="M35 110 L60 130 L85 110" fill="#2A2F3A"/>
    <!-- Magnifying Glass -->
    <g transform="translate(80, 70)">
      <circle cx="20" cy="20" r="25" fill="none" stroke="#FFB84D" stroke-width="6"/>
      <path d="M38 38 L60 60" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- The "Clue" (Spiderweb/Trace) being examined -->
  <g transform="translate(140, 150)">
    <path d="M0 0 L40 0 M20 -20 L20 20 M5 -15 L35 15 M35 -15 L5 15" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The "Letting Go" gesture (Hand releasing a small object) -->
  <g transform="translate(40, 160)">
    <path d="M20 20 C 20 0, 60 0, 60 20 L 60 30 L 20 30 Z" fill="#E0E6ED"/>
    <path d="M30 20 L30 10 M40 20 L40 5 M50 20 L50 10" stroke="#E0E6ED" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>