<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm campfire glow -->
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Lantern glow -->
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain range gradient -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="mountainDistant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Background Sky with Starry Night -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#cbd5e1" opacity="0.7">
    <circle cx="30" cy="35" r="1" />
    <circle cx="75" cy="20" r="1.5" opacity="0.9"/>
    <circle cx="120" cy="45" r="1" />
    <circle cx="165" cy="25" r="1.2" />
    <circle cx="210" cy="40" r="1.5" />
    <circle cx="45" cy="65" r="0.8" />
    <circle cx="100" cy="75" r="1" />
    <circle cx="195" cy="70" r="1.2" />
  </g>

  <!-- Distant Mountains / Biên cương (Frontier Mountains) -->
  <polygon points="0,150 50,110 110,135 170,95 240,120 240,240 0,240" fill="url(#mountainDistant)" />
  <polygon points="0,170 65,130 130,155 185,120 240,145 240,240 0,240" fill="url(#mountainGrad)" />

  <!-- Snow caps on distant peaks -->
  <path d="M170,95 L182,112 L177,115 L165,103 Z" fill="#f8fafc" opacity="0.8"/>
  <path d="M50,110 L59,122 L50,125 L41,120 Z" fill="#f8fafc" opacity="0.8"/>

  <!-- Watchtower / Border Post Structure (哨所) -->
  <g id="watchtower">
    <!-- Tower Wall (Stone & Wood) -->
    <rect x="175" y="110" width="45" height="90" fill="#334155" rx="2"/>
    <path d="M170,110 L197,90 L224,110 Z" fill="#1e293b"/>
    <path d="M173,105 L197,87 L221,105 Z" fill="#475569"/>

    <!-- Window/Loophole lit with warm interior light -->
    <rect x="190" y="130" width="14" height="20" rx="7" fill="#fbbf24"/>
    <rect x="194" y="134" width="6" height="12" rx="3" fill="#fef08a"/>
    <!-- Window cross bars -->
    <line x1="197" y1="130" x2="197" y2="150" stroke="#334155" stroke-width="1.5"/>
    <line x1="190" y1="140" x2="204" y2="140" stroke="#334155" stroke-width="1.5"/>

    <!-- Wooden fence / barricade -->
    <path d="M130,190 L145,185 L145,215 L130,220 Z" fill="#64748b"/>
    <path d="M142,186 L158,181 L158,211 L142,216 Z" fill="#475569"/>
    <line x1="130" y1="195" x2="160" y2="188" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Hanging Lantern on Tower -->
  <circle cx="180" cy="125" r="18" fill="url(#lanternGlow)"/>
  <rect x="178" y="118" width="4" height="3" fill="#1e293b"/>
  <path d="M176,121 h8 l-1,8 h-6 z" fill="#ef4444"/>
  <rect x="178" y="129" width="4" height="5" fill="#fbbf24"/>
  <line x1="180" y1="110" x2="180" y2="118" stroke="#334155" stroke-width="1.5"/>

  <!-- Foreground Terrain -->
  <path d="M0,195 Q80,185 240,205 L240,240 L0,240 Z" fill="#1e293b"/>
  <!-- Snow patches on ground -->
  <path d="M20,215 Q40,210 70,218 Q50,225 20,215 Z" fill="#94a3b8" opacity="0.4"/>
  <path d="M180,225 Q210,220 235,230 L170,235 Z" fill="#94a3b8" opacity="0.4"/>

  <!-- Campfire Setup (Atmosphere & Warmth) -->
  <circle cx="95" cy="205" r="30" fill="url(#fireGlow)"/>
  <!-- Logs -->
  <rect x="80" y="212" width="28" height="5" rx="2" transform="rotate(-15 94 214)" fill="#78350f"/>
  <rect x="82" y="210" width="26" height="5" rx="2" transform="rotate(25 95 212)" fill="#92400e"/>
  <!-- Flames -->
  <path d="M94,215 Q90,200 95,190 Q100,202 103,215 Z" fill="#f59e0b"/>
  <path d="M91,216 Q95,203 94,195 Q98,206 99,216 Z" fill="#ef4444"/>
  <path d="M95,216 Q97,208 96,200 Q99,209 97,216 Z" fill="#fef08a"/>

  <!-- Main Character: Soldier on Guard (士兵驻守) -->
  <g id="sentinel-soldier">
    <!-- Soldier Body / Coat (Warm Military Overcoat) -->
    <!-- Legs -->
    <rect x="62" y="185" width="8" height="30" rx="3" fill="#334155"/>
    <rect x="76" y="185" width="8" height="30" rx="3" fill="#334155"/>
    <!-- Boots -->
    <path d="M58,210 L70,210 L70,216 L56,216 Z" fill="#0f172a"/>
    <path d="M74,210 L86,210 L86,216 L72,216 Z" fill="#0f172a"/>

    <!-- Torso / Heavy Coat -->
    <path d="M58,145 L88,145 L92,188 L54,188 Z" fill="#1e3a8a"/>
    <!-- Coat belt -->
    <rect x="56" y="165" width="34" height="6" rx="2" fill="#0f172a"/>
    <rect x="68" y="164" width="10" height="8" fill="#d97706"/> <!-- Belt buckle -->

    <!-- Backpack / Gear -->
    <rect x="85" y="142" width="14" height="26" rx="4" fill="#334155"/>

    <!-- Head and Ushanka Hat (Traditional Cold-weather Military Hat) -->
    <!-- Ushanka Ear flaps down -->
    <path d="M63,116 L63,136 L67,136 L67,116 Z" fill="#475569"/>
    <path d="M83,116 L83,136 L79,136 L79,116 Z" fill="#475569"/>
    <!-- Face base -->
    <circle cx="73" cy="125" r="11" fill="#fbcfe8"/>
    <!-- Hat Crown -->
    <path d="M60,120 Q73,110 86,120 L84,127 L62,127 Z" fill="#334155"/>
    <rect x="68" y="117" width="10" height="4" fill="#ef4444"/> <!-- Red star badge on hat -->

    <!-- Facial expression: alert, determined -->
    <circle cx="77" cy="124" r="1.5" fill="#1e293b"/> <!-- Eye -->
    <path d="M75,121 Q77,120 79,122" stroke="#1e293b" stroke-width="1.2" fill="none"/> <!-- Eyebrow -->
    <path d="M75,130 Q77,132 79,130" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Mouth -->
    <circle cx="69" cy="127" r="2.5" fill="#fda4af" opacity="0.6"/> <!-- Rosy cheek -->

    <!-- Arms holding rifle -->
    <!-- Left arm reaching forward -->
    <path d="M62,148 L45,160 L50,165 L65,155 Z" fill="#1e3a8a"/>
    <!-- Right arm -->
    <path d="M84,148 L95,165 L90,170 L80,155 Z" fill="#1e3a8a"/>

    <!-- Rifle / Weapon held steadily -->
    <path d="M30,175 L110,145 L111,148 L31,178 Z" fill="#334155"/>
    <rect x="75" y="152" width="12" height="7" rx="1" fill="#1e293b"/> <!-- Rifle magazine/body -->
    <!-- Rifle barrel extending out -->
    <rect x="25" y="177" width="30" height="2" fill="#64748b"/>
  </g>

  <!-- Border Marker Stone (界碑 - Boundary Marker symbolizing 边疆) -->
  <g id="boundary-marker" transform="translate(130, 160)">
    <!-- Base rock -->
    <path d="M-5,40 L35,40 L30,48 L-10,48 Z" fill="#475569"/>
    <!-- Main Stone Pillar -->
    <path d="M0,8 L25,0 L25,40 L0,40 Z" fill="#e2e8f0"/>
    <path d="M25,0 L32,6 L32,46 L25,40 Z" fill="#cbd5e1"/>
    <path d="M0,8 L32,6 L32,10 L0,12 Z" fill="#94a3b8"/> <!-- Top bevel -->
    
    <!-- Red stripe / emblem area on marker -->
    <path d="M5,16 L20,11 L20,25 L5,30 Z" fill="#dc2626"/>
    <!-- Simulated carving lines (Abstract representation, NO actual letters/words) -->
    <line x1="8" y1="33" x2="17" y2="30" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="37" x2="15" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Lighting Overlay & Vignette -->
  <circle cx="120" cy="120" r="140" fill="none" stroke="#000000" stroke-width="24" opacity="0.3"/>

</svg>