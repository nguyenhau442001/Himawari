<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Room Interior Gradient -->
    <linearGradient id="room-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Sound Wave / Shouting Waves Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Window Night Sky -->
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ROOM ENVIRONMENT (Interior) -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="url(#room-grad)"/>

  <!-- Floor -->
  <path d="M20 170 L220 170 L230 220 L10 220 Z" fill="url(#floor-grad)"/>
  <!-- Floor Wood Planks / Details -->
  <line x1="20" y1="185" x2="220" y2="185" stroke="#0b1329" stroke-width="1.5" opacity="0.5"/>
  <line x1="15" y1="202" x2="225" y2="202" stroke="#0b1329" stroke-width="1.5" opacity="0.5"/>

  <!-- Window Context Prop (Left) -->
  <rect x="35" y="35" width="45" height="65" rx="4" fill="#090d16" stroke="#475569" stroke-width="3"/>
  <rect x="39" y="39" width="37" height="57" fill="url(#night-sky)"/>
  <!-- Window crossbars -->
  <line x1="57" y1="39" x2="57" y2="96" stroke="#475569" stroke-width="2"/>
  <line x1="39" y1="67" x2="76" y2="67" stroke="#475569" stroke-width="2"/>
  <!-- Stars outside -->
  <circle cx="45" cy="48" r="1" fill="#cbd5e1"/>
  <circle cx="68" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="50" cy="80" r="1" fill="#94a3b8"/>

  <!-- Bookshelf / Prop Background (Right) -->
  <rect x="175" y="45" width="30" height="90" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="75" x2="205" y2="75" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="105" x2="205" y2="105" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="180" y="55" width="6" height="20" fill="#ef4444" rx="1"/>
  <rect x="188" y="52" width="8" height="23" fill="#3b82f6" rx="1"/>
  <rect x="198" y="58" width="5" height="17" fill="#10b981" rx="1"/>
  <rect x="181" y="85" width="12" height="20" fill="#f59e0b" rx="1"/>
  <rect x="195" y="88" width="7" height="17" fill="#ec4899" rx="1"/>

  <!-- Hanging Lamp Top Left (Atmosphere) -->
  <path d="M120 20 L120 45" stroke="#64748b" stroke-width="2"/>
  <path d="M105 45 L135 45 L140 55 L100 55 Z" fill="#475569"/>
  <!-- Lamp Glow Cone -->
  <polygon points="120,55 70,170 170,170" fill="#fbbf24" opacity="0.05"/>

  <!-- Wall Decor (Picture Frame) -->
  <rect x="95" y="40" width="25" height="20" fill="#475569" rx="2"/>
  <rect x="98" y="43" width="19" height="14" fill="#64748b"/>
  <circle cx="107.5" cy="48" r="3" fill="#fbbf24"/>
  <path d="M101 54 L107 48 L114 54 Z" fill="#10b981"/>

  <!-- MAIN CHARACTER: Stressed/Angry Person Shouting ("嚷") -->
  <!-- Character position: Center-Right in the room -->
  <g transform="translate(125, 80)">
    
    <!-- Sound Waves Emanating from Mouth (Dynamic Action Lines) -->
    <path d="M -22 -15 Q -38 -20 -48 -35" stroke="url(#wave-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -22 -8 Q -45 -10 -60 -18" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M -20 -2 Q -40 2 -55 5" stroke="url(#wave-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Dynamic Motion Lines behind head -->
    <line x1="25" y1="-25" x2="35" y2="-30" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="30" y1="-10" x2="42" y2="-12" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Torso / Hoodie (Teal/Blue modern tone) -->
    <path d="M -20 50 L 25 50 L 32 90 L -25 90 Z" fill="#0284c7" rx="6"/>
    <!-- Hoodie Pocket & Details -->
    <path d="M -8 70 L 8 70 L 6 88 L -6 88 Z" fill="#0369a1"/>
    <!-- Collar & Neck -->
    <path d="M -8 38 L 8 38 L 10 50 L -10 50 Z" fill="#fbcfe8"/>
    <path d="M -12 42 Q 0 48 12 42" stroke="#0284c7" stroke-width="3" fill="none"/>

    <!-- Arms - Aggressive / Expressive Gestures -->
    <!-- Left Arm (Clenched fist forward/up) -->
    <path d="M -18 52 C -30 55 -42 45 -48 30" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="-50" cy="27" r="7" fill="#fbcfe8"/> <!-- Fist -->

    <!-- Right Arm (Raised high, frustrated gesture) -->
    <path d="M 22 52 C 38 45 45 25 35 5" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="33" cy="2" r="7" fill="#fbcfe8"/> <!-- Fist Up -->

    <!-- Head & Face (Expressed shouting profile/3/4 view) -->
    <!-- Hair (Messy, upset spikes) -->
    <path d="M -15 -22 C -20 -38 0 -42 12 -35 C 22 -32 28 -15 25 -5 L -10 -5 Z" fill="#334155"/>
    <path d="M -12 -35 C -5 -45 10 -40 18 -32 Z" fill="#1e293b"/>

    <!-- Head Base -->
    <circle cx="2" cy="-12" r="18" fill="#fbcfe8"/>

    <!-- Angry Eyebrows (Angled sharply down) -->
    <line x1="-8" y1="-18" x2="2" y2="-13" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="-13" x2="16" y2="-18" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Squinted / Intensely focused in shout) -->
    <line x1="-6" y1="-12" x2="-1" y2="-10" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="-10" x2="14" y2="-12" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Open Shouting Mouth (Wide open, yelling "Rǎng") -->
    <path d="M -6 -3 Q -2 -1 -12 2 C -18 3 -24 -2 -22 -6 C -20 -9 -10 -5 -6 -3 Z" fill="#991b1b"/>
    <!-- Tongue & Teeth -->
    <path d="M -18 -4 Q -14 -1 -8 -2" fill="#ef4444"/>
    <rect x="-19" y="-7" width="11" height="3" fill="#ffffff" rx="1"/>

    <!-- Angry Flush/Blush on cheek -->
    <ellipse cx="-4" cy="-5" rx="3" ry="1.5" fill="#f43f5e" opacity="0.6"/>
  </g>

  <!-- FOREGROUND PROPS (Completing the room context) -->
  <!-- Wooden Chair / Stool -->
  <g transform="translate(60, 130)">
    <!-- Seat -->
    <rect x="0" y="0" width="35" height="8" rx="2" fill="#b45309" stroke="#78350f" stroke-width="1"/>
    <!-- Chair Legs -->
    <line x1="5" y1="8" x2="2" y2="55" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="8" x2="38" y2="55" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <!-- Crossbar -->
    <line x1="3" y1="30" x2="34" y2="30" stroke="#92400e" stroke-width="3"/>
  </g>

  <!-- Small Table with Tea Cup (Adds lived-in indoor context) -->
  <g transform="translate(30, 155)">
    <!-- Table Top -->
    <path d="M 0 0 L 45 0 L 40 10 L -5 10 Z" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
    <!-- Table Legs -->
    <line x1="5" y1="10" x2="2" y2="35" stroke="#92400e" stroke-width="3"/>
    <line x1="35" y1="10" x2="38" y2="35" stroke="#92400e" stroke-width="3"/>
    <!-- Tea Mug Prop -->
    <rect x="18" y="-12" width="10" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 28 -9 C 32 -9 32 -3 28 -3" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <!-- Steam rising slightly from cup -->
    <path d="M 21 -16 Q 23 -19 21 -22" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Indoor House Plant (Left corner) -->
  <g transform="translate(15, 120)">
    <path d="M 10 35 L 20 55 L 0 55 Z" fill="#64748b"/> <!-- Pot -->
    <!-- Leaves -->
    <path d="M 10 35 C 5 15 -10 10 -15 0 C -5 15 5 25 10 35 Z" fill="#10b981"/>
    <path d="M 12 35 C 18 10 32 5 40 0 C 28 15 18 25 12 35 Z" fill="#059669"/>
    <path d="M 10 35 C 10 10 15 -5 20 -15 C 15 5 12 20 10 35 Z" fill="#34d399"/>
  </g>

</svg>