<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Spool Core (Vertical) -->
  <rect x="114" y="45" width="12" height="150" rx="4" fill="#4A5568"/>
  
  <!-- Spool End Caps -->
  <ellipse cx="120" cy="50" rx="45" ry="14" fill="#2D3748"/>
  <ellipse cx="120" cy="190" rx="45" ry="14" fill="#2D3748"/>
  
  <!-- Fiber Bundle (Wound Thread) -->
  <rect x="82" y="70" width="76" height="100" rx="15" fill="#F6AD55"/>
  
  <!-- Fiber Texture (Winding Lines) -->
  <g stroke="#DD6B20" stroke-width="2.5" stroke-linecap="round">
    <path d="M82 85 Q 120 88 158 85"/>
    <path d="M82 100 Q 120 103 158 100"/>
    <path d="M82 115 Q 120 118 158 115"/>
    <path d="M82 130 Q 120 133 158 130"/>
    <path d="M82 145 Q 120 148 158 145"/>
    <path d="M82 160 Q 120 163 158 160"/>
  </g>
  
  <!-- Highlight on Bundle -->
  <rect x="95" y="75" width="12" height="90" rx="6" fill="#FBD38D" fill-opacity="0.4"/>
  
  <!-- Loose Fiber Strand -->
  <path d="M158 120 C 190 120, 200 155, 225 150" stroke="#F6AD55" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Frayed Fiber Detail at the end -->
  <g stroke="#F6AD55" stroke-width="2" stroke-linecap="round">
    <path d="M225 150 L 232 144"/>
    <path d="M225 150 L 234 152"/>
    <path d="M225 150 L 230 158"/>
  </g>
</svg>