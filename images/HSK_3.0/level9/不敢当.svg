<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Character 1 (The Praiser - Standing) -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M5 40 Q20 30 35 40 L30 100 L10 100 Z" fill="#38bdf8"/>
    <path d="M20 60 L40 80" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 60 L0 80" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (The Humble Recipient - Sitting) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M5 40 Q20 30 35 40 L30 120 L10 120 Z" fill="#ec4899"/>
    <!-- Humble Gesture: Hand covering mouth/shy -->
    <circle cx="35" cy="65" r="6" fill="#f59e0b"/>
    <path d="M10 70 Q20 60 30 70" stroke="#fff" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Props: Award/Certificate on desk -->
  <rect x="60" y="170" width="40" height="30" rx="2" fill="#fb923c"/>
  <rect x="65" y="175" width="30" height="20" rx="1" fill="#10b981"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="180" cy="30" r="2" fill="#38bdf8" opacity="0.5"/>
  <path d="M150 180 L170 180 M160 170 L160 190" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>