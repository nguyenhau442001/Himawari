<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background gradient for dark mode room setting -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing effect for the illusion -->
    <radialGradient id="illusionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm lamp light -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor Context -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#090d16"/>
  <!-- Wall base color -->
  <rect x="0" y="0" width="240" height="160" fill="#151e32"/>

  <!-- Window with night view -->
  <rect x="150" y="25" width="60" height="85" rx="6" fill="#0b1329" stroke="#334155" stroke-width="3"/>
  <line x1="180" y1="25" x2="180" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="67" x2="210" y2="67" stroke="#334155" stroke-width="2"/>
  <!-- Distant moon/stars outside window -->
  <circle cx="170" cy="45" r="6" fill="#f1f5f9" opacity="0.8"/>
  <circle cx="195" cy="85" r="2" fill="#f1f5f9" opacity="0.5"/>

  <!-- Bookshelf / Prop in background -->
  <rect x="20" y="40" width="45" height="120" fill="#1e293b" rx="2"/>
  <rect x="25" y="70" width="35" height="4" fill="#334155"/>
  <rect x="25" y="110" width="35" height="4" fill="#334155"/>
  <!-- Books on shelf -->
  <path d="M28 50 L35 50 L35 70 L28 70 Z" fill="#ef4444"/>
  <path d="M38 53 L44 53 L44 70 L38 70 Z" fill="#3b82f6"/>
  <path d="M47 48 L55 48 L55 70 L47 70 Z" fill="#10b981"/>

  <!-- Desk and Lamp -->
  <rect x="70" y="130" width="100" height="30" rx="4" fill="#334155"/>
  <path d="M115 130 L115 100 L125 100 L125 130 Z" fill="#64748b"/>
  <path d="M105 100 L135 100 L140 110 L100 110 Z" fill="#f59e0b"/>
  <circle cx="120" cy="115" r="30" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Character: Sitting at desk, rubbing eyes / reacting to hallucination -->
  <!-- Chair -->
  <rect x="85" y="135" width="30" height="50" rx="6" fill="#475569"/>
  
  <!-- Character Body (Torso in hoodie/sweater) -->
  <path d="M85 160 C85 145 115 145 115 160 L120 200 L80 200 Z" fill="#3b82f6"/>
  
  <!-- Character Head -->
  <circle cx="100" cy="125" r="18" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M82 120 C82 105 118 105 118 120 C118 125 115 120 110 115 C105 110 95 110 90 115 C85 120 82 125 82 120 Z" fill="#1e293b"/>

  <!-- Arms / Hands interacting with head -->
  <!-- Back Arm -->
  <path d="M90 150 L80 135 L90 128" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Arm rubbing eyes/forehead -->
  <path d="M110 155 L115 135 L105 125" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="123" r="4" fill="#fbcfe8"/>

  <!-- Surprised Face Expression (brows angled up/in) -->
  <line x1="92" y1="120" x2="98" y2="123" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="123" x2="108" y2="120" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="95" cy="126" r="1.5" fill="#1e293b"/>
  <circle cx="105" cy="126" r="1.5" fill="#1e293b"/>
  <path d="M98 133 Q100 137 102 133" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- THE ILLUSION (幻觉) - Floating magical/surreal elements emerging from a desk coffee mug -->
  <!-- Coffee mug on desk -->
  <rect x="85" y="125" width="12" height="15" rx="2" fill="#f1f5f9"/>
  <path d="M97 128 C101 128 101 137 97 137" fill="none" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Illusion area swirl & glow -->
  <circle cx="55" cy="95" r="35" fill="url(#illusionGlow)" style="mix-blend-mode: screen;"/>
  <circle cx="65" cy="100" r="25" fill="url(#illusionGlow)" style="mix-blend-mode: screen;"/>

  <!-- Surreal floating objects (A cute surreal cat-like creature with wings floating in mid-air) -->
  <!-- Glowing magical aura trail from mug to illusion -->
  <path d="M91 125 Q70 110 65 100" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M88 127 Q75 118 68 108" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="2 3" opacity="0.9"/>

  <!-- Floating Surreal Creature (The Hallucination) -->
  <g transform="translate(48, 80)">
    <!-- Body -->
    <ellipse cx="15" cy="15" rx="14" ry="12" fill="#ec4899" opacity="0.9"/>
    <!-- Glowing eyes -->
    <circle cx="10" cy="13" r="3" fill="#fef08a"/>
    <circle cx="20" cy="13" r="3" fill="#fef08a"/>
    <circle cx="10" cy="13" r="1" fill="#0f172a"/>
    <circle cx="20" cy="13" r="1" fill="#0f172a"/>
    <!-- Ears -->
    <path d="M5 6 L8 15 L2 14 Z" fill="#db2777"/>
    <path d="M25 6 L22 15 L28 14 Z" fill="#db2777"/>
    <!-- Little wings -->
    <path d="M1 15 C-5 10 -2 2 8 10 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M29 15 C35 10 32 2 22 10 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Floating sparkles around hallucination -->
    <path d="M -5 0 L -3 5 L -8 7 L -3 9 L -5 14 L 0 9 L 5 7 L 0 5 Z" fill="#fde047" transform="scale(0.4) translate(-20, -10)"/>
    <path d="M 35 25 L 36 28 L 33 29 L 36 30 L 35 33 L 38 30 L 41 29 L 38 28 Z" fill="#38bdf8" transform="scale(0.5) translate(10, 10)"/>
  </g>

  <!-- Additional floating magical bubbles/stars representing unreality -->
  <circle cx="85" cy="70" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="75" cy="60" r="2" fill="#c084fc" opacity="0.8"/>
  <circle cx="35" cy="115" r="3" fill="#f43f5e" opacity="0.6"/>
  <path d="M30 85 L32 90 L27 92 L32 94 L30 99 L35 94 L40 92 L35 90 Z" fill="#fde047" opacity="0.8" transform="scale(0.3) translate(80, 220)"/>

  <!-- Foreground plant for depth framing (bottom left corner) -->
  <path d="M0 240 Q10 200 25 180 Q15 210 0 240 Z" fill="#065f46"/>
  <path d="M15 240 Q25 195 45 175 Q30 210 15 240 Z" fill="#047857"/>
  <path d="M-5 220 Q10 190 20 170 Q5 195 -5 220 Z" fill="#10b981"/>
</svg>