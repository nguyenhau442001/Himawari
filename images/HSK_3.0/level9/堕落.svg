<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#1e1b2e" />
    </linearGradient>
    <radialGradient id="desk-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b2b1a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#141c2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Room Environment / Background details -->
  <!-- Wallpaper / Wall lines -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#090d16" stroke-width="3" />
  
  <!-- Messy bookshelf in background -->
  <rect x="25" y="45" width="40" height="85" fill="#182236" rx="2"/>
  <line x1="25" y1="70" x2="65" y2="70" stroke="#0f172a" stroke-width="3"/>
  <line x1="25" y1="95" x2="65" y2="95" stroke="#0f172a" stroke-width="3"/>
  <!-- Tilted books -->
  <path d="M32 70 L35 55 L40 56 L37 70 Z" fill="#334155"/>
  <path d="M42 70 L48 58 L53 60 L47 70 Z" fill="#475569"/>
  <rect x="30" y="75" width="25" height="18" fill="#1e293b"/>
  <!-- Messy papers on shelf -->
  <path d="M30 95 L35 85 L50 88 L48 95 Z" fill="#64748b" opacity="0.5"/>

  <!-- Window with nighttime city glow -->
  <rect x="175" y="35" width="45" height="65" rx="4" fill="#0b0f19" stroke="#2a364f" stroke-width="2"/>
  <line x1="197" y1="35" x2="197" y2="100" stroke="#2a364f" stroke-width="1.5"/>
  <line x1="175" y1="65" x2="220" y2="65" stroke="#2a364f" stroke-width="1.5"/>
  <!-- Distant city lights -->
  <circle cx="185" cy="50" r="1.5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="210" cy="45" r="1" fill="#38bdf8" opacity="0.8"/>
  <circle cx="205" cy="85" r="1.5" fill="#ef4444" opacity="0.5"/>
  
  <!-- Ambient lighting -->
  <circle cx="120" cy="110" r="90" fill="url(#desk-glow)"/>

  <!-- Desk & Clutter -->
  <!-- Desk surface -->
  <path d="M15 155 L225 155 L215 210 L25 210 Z" fill="#1b2436"/>
  <path d="M10 150 L230 150 L225 155 L15 155 Z" fill="#2d3748"/>

  <!-- Clutter: Pizza box open with slice missing -->
  <path d="M165 170 L195 160 L210 185 L180 195 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <path d="M175 168 L190 163 L198 178 L183 183 Z" fill="#f1f5f9"/>
  <!-- Pizza slices / pepperoni -->
  <circle cx="185" cy="172" r="3" fill="#ef4444"/>
  <circle cx="192" cy="178" r="2.5" fill="#ef4444"/>
  <!-- Empty soda cans -->
  <rect x="150" y="175" width="10" height="18" rx="2" fill="#ef4444"/>
  <rect x="142" y="180" width="9" height="15" rx="2" fill="#3b82f6"/>
  <ellipse cx="146" cy="180" rx="4.5" ry="1.5" fill="#93c5fd"/>
  <!-- Messy crumpled paper balls -->
  <circle cx="60" cy="185" r="7" fill="#cbd5e1"/>
  <circle cx="75" cy="192" r="6" fill="#94a3b8"/>
  <circle cx="50" cy="198" r="8" fill="#e2e8f0"/>

  <!-- Computer Screen (bright glow in dark room) -->
  <rect x="85" y="90" width="70" height="45" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="88" y="93" width="64" height="39" fill="url(#screen-glow)"/>
  <!-- Abstract bright video game / late-night media UI on screen -->
  <rect x="95" y="100" width="30" height="15" rx="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="138" cy="107" r="6" fill="#ec4899" opacity="0.8"/>
  <path d="M95 123 L135 123" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Monitor stand -->
  <path d="M115 135 L125 135 L128 153 L112 153 Z" fill="#334155"/>

  <!-- Character: Slouched, untidy, demoralized -->
  <!-- Chair back -->
  <path d="M90 115 L125 110 L120 180 L85 175 Z" fill="#0f172a"/>
  
  <!-- Character Body (Slumped forward over desk) -->
  <!-- Hoodie / Sweatshirt (dark/muted color representing neglect/apathy) -->
  <path d="M90 145 C80 140 70 160 75 185 L135 190 C140 160 125 145 115 145 Z" fill="#334155"/>
  
  <!-- Hood dropped over shoulders -->
  <path d="M85 145 C85 130 115 130 115 145 C105 150 95 150 85 145 Z" fill="#1e293b"/>

  <!-- Dropped/Slumped Head and Messy Hair -->
  <path d="M90 132 C85 120 105 115 112 128 C115 135 110 142 98 142 C92 142 91 138 90 132 Z" fill="#fbcfe8"/> <!-- Face turned down/hidden -->
  
  <!-- Messy uncombed hair -->
  <path d="M87 125 C82 120 88 110 98 112 C105 108 115 115 112 128 C105 120 95 120 87 125 Z" fill="#0f172a"/>
  <path d="M84 122 L80 127" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 115 L116 112" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arms resting heavily on desk -->
  <!-- Left arm -->
  <path d="M95 155 L65 170 L70 180 L100 165 Z" fill="#334155"/>
  <!-- Hand resting lifelessly -->
  <circle cx="62" cy="173" r="5" fill="#fbcfe8"/>

  <!-- Right arm reaching towards mouse/desk -->
  <path d="M115 150 L140 165 L145 175 L120 160 Z" fill="#334155"/>
  <circle cx="145" cy="175" r="5" fill="#fbcfe8"/>

  <!-- Atmospheric mood particles (dust motes / dim gloom) -->
  <circle cx="100" cy="70" r="1.5" fill="#fbbf24" opacity="0.3"/>
  <circle cx="130" cy="65" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="150" cy="80" r="2" fill="#fbbf24" opacity="0.2"/>
  <circle cx="75" cy="85" r="1.5" fill="#fbbf24" opacity="0.3"/>
  <circle cx="55" cy="110" r="2" fill="#38bdf8" opacity="0.2"/>
  
  <!-- Vignette overlay for dramatic isolation feel -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#000000" stroke-width="8" opacity="0.3"/>
</svg>