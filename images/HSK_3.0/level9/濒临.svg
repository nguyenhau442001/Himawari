<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Environment: Research Lab/Observation Deck -->
  <path d="M20 180 L220 180 L200 240 L40 240 Z" fill="#334155"/>
  <circle cx="120" cy="100" r="70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  
  <!-- The Species (Endangered Animal - stylized Snow Leopard) -->
  <g transform="translate(80, 110)">
    <path d="M20 60 C10 60 0 50 0 40 C0 20 20 10 40 10 C50 10 60 20 60 30 L70 20 L80 40 L60 50 C60 55 55 60 50 60 Z" fill="#94a3b8"/>
    <circle cx="20" cy="25" r="3" fill="#0f172a"/>
    <path d="M10 35 Q20 40 30 35" stroke="#0f172a" stroke-width="1"/>
  </g>
  
  <!-- Scientist/Observer -->
  <g transform="translate(150, 120)">
    <rect x="0" y="0" width="30" height="60" rx="5" fill="#f59e0b"/>
    <circle cx="15" cy="-10" r="12" fill="#f59e0b"/>
    <rect x="5" y="5" width="20" height="5" fill="#1e293b"/>
    <path d="M10 20 L5 40 M20 20 L25 40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Warning/Status Indicator -->
  <g transform="translate(40, 40)">
    <path d="M20 0 L40 40 L0 40 Z" fill="#ec4899"/>
    <rect x="18" y="10" width="4" height="15" rx="2" fill="#ffffff"/>
    <circle cx="20" cy="32" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Data/Graph Elements -->
  <path d="M180 60 L220 60 L220 100" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="220" cy="60" r="4" fill="#10b981"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="100" r="30" fill="#fb923c" opacity="0.05"/>
</svg>