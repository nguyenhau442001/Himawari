<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Bullet Trail Gradient -->
    <linearGradient id="trailGrad" x1="40" y1="130" x2="200" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="1"/>
    </linearGradient>

    <!-- Holographic Table Glow -->
    <radialGradient id="tableGlow" cx="120" cy="180" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment: Sci-Fi Lab / Workshop Details -->
  <!-- Grid lines on wall -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.6">
    <line x1="20" y1="50" x2="220" y2="50"/>
    <line x1="20" y1="90" x2="220" y2="90"/>
    <line x1="20" y1="130" x2="220" y2="130"/>
    <line x1="60" y1="30" x2="60" y2="150"/>
    <line x1="120" y1="30" x2="120" y2="150"/>
    <line x1="180" y1="30" x2="180" y2="150"/>
  </g>

  <!-- Ambient Light Cone -->
  <polygon points="120,30 200,160 40,160" fill="#38bdf8" opacity="0.04"/>

  <!-- Holographic Table Surface -->
  <ellipse cx="120" cy="170" rx="90" ry="25" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="170" rx="90" ry="25" fill="url(#tableGlow)"/>

  <!-- Target Dummy / Obstacle on the Right -->
  <g transform="translate(180, 110)">
    <!-- Base -->
    <rect x="-10" y="40" width="20" height="10" rx="3" fill="#64748b"/>
    <!-- Pole -->
    <rect x="-3" y="10" width="6" height="35" fill="#475569"/>
    <!-- Target Rings -->
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#f43f5e" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#f43f5e"/>
  </g>

  <!-- THE TRAJECTORY (轨迹) - Curved glowing path showing bullet motion -->
  <!-- Dashed calculation line -->
  <path d="M 45 135 Q 90 70, 180 110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Main Glowing Trajectory Arc -->
  <path d="M 45 135 Q 90 70, 180 110" fill="none" stroke="url(#trailGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Trajectory Nodes / Coordinate Markers -->
  <circle cx="75" cy="98" r="3" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="115" cy="88" r="3.5" fill="#fbbf24" filter="url(#neonGlow)"/>
  <circle cx="150" cy="96" r="4" fill="#fb923c" filter="url(#neonGlow)"/>

  <!-- The Bullet and Impact Spark -->
  <!-- Bullet tip at the end of trajectory -->
  <g transform="translate(180, 110)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    <!-- Impact Sparks -->
    <path d="M0,0 L8,-6 M0,0 L10,2 M0,0 L4,9 M0,0 L-5,8" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Character: Scientist / Analyst pointing at the trajectory -->
  <!-- Character Body / Lab Coat -->
  <g transform="translate(45, 110)">
    <!-- Lab Coat & Torso -->
    <path d="M -15 60 L 15 60 L 20 20 L -20 20 Z" fill="#e2e8f0"/>
    <path d="M -5 20 L 0 45 L 5 20 Z" fill="#cbd5e1"/> <!-- Coat opening -->

    <!-- Head -->
    <circle cx="0" cy="2" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M -13 2 C -13 -6, -6 -10, 2 -10 C 10 -10, 14 -4, 14 4 L 12 4 C 12 -2, 8 -7, 1 -7 C -6 -7, -10 -2, -11 3 Z" fill="#334155"/>

    <!-- Glasses -->
    <rect x="-7" y="-2" width="6" height="4" rx="1" fill="none" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="1" y="-2" width="6" height="4" rx="1" fill="none" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="-1" y1="0" x2="1" y2="0" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Pointing Arm & Hand -->
    <path d="M 15 25 Q 35 15, 45 5" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <circle cx="46" cy="4" r="3.5" fill="#fbcfe8"/>
    
    <!-- Focused, enthusiastic expression (implied by brow angle) -->
    <line x1="-5" y1="-5" x2="-2" y2="-4" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="-5" x2="6" y2="-4" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -2,7 Q 0,10 2,7" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Holographic Data Panel (Decorative Tech UI) -->
  <g transform="translate(25, 175)">
    <rect x="0" y="0" width="55" height="28" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <!-- Mini graph lines -->
    <path d="M 8 20 L 18 12 L 28 16 L 40 8 L 48 14" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="40" cy="8" r="2" fill="#fbbf24"/>
  </g>
</svg>