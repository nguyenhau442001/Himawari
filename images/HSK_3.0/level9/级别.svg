<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="150" y="25" width="65" height="85" rx="4" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Office Interior Details -->
  <!-- Window -->
  <rect x="150" y="25" width="65" height="85" rx="4" fill="#0f172a" />
  <rect x="152" y="27" width="61" height="81" rx="2" fill="url(#windowGrad)" />
  <!-- Cityscape outside window -->
  <rect x="160" y="70" width="10" height="40" fill="#38bdf8" opacity="0.15" />
  <rect x="175" y="55" width="15" height="55" fill="#38bdf8" opacity="0.2" />
  <rect x="195" y="80" width="12" height="30" fill="#38bdf8" opacity="0.1" />

  <!-- Wall shelf with decor -->
  <rect x="25" y="35" width="70" height="4" rx="2" fill="#475569" />
  <path d="M35 35 L38 20 L48 20 L51 35 Z" fill="#10b981" opacity="0.8" />
  <circle cx="65" cy="27" r="8" fill="#f59e0b" opacity="0.8" />

  <!-- Main Office Desk -->
  <rect x="15" y="165" width="210" height="12" rx="3" fill="url(#deskGrad)" />
  <rect x="30" y="177" width="12" height="50" fill="#1e293b" />
  <rect x="198" y="177" width="12" height="50" fill="#1e293b" />

  <!-- Desk Props (Lower Level / Colleague) -->
  <rect x="35" y="135" width="28" height="30" rx="2" fill="#64748b" />
  <rect x="39" y="139" width="20" height="18" fill="#0f172a" />
  <path d="M30 165 L60 165 L65 155 L25 155 Z" fill="#475569" /> <!-- In-tray -->

  <!-- Desk Props (Higher Level / Boss) -->
  <rect x="160" y="125" width="35" height="40" rx="3" fill="#38bdf8" />
  <rect x="164" y="129" width="27" height="24" fill="#0f172a" />
  <!-- Small corporate badge / high tier indicator stand on desk -->
  <path d="M135 150 L145 135 L155 150 Z" fill="#f59e0b" />

  <!-- Character 1: Lower Rank Employee (Left) -->
  <!-- Chair -->
  <path d="M45 160 L45 195 L65 195 L65 160" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Body & Torso -->
  <path d="M50 165 C50 145 70 145 75 165 Z" fill="#64748b" />
  <circle cx="62" cy="125" r="14" fill="#fed7aa" />
  <!-- Hair -->
  <path d="M48 123 C48 112 76 112 76 123 C76 123 70 116 62 116 C54 116 48 123 48 123 Z" fill="#334155" />
  <!-- Arm pointing/gesturing deferentially -->
  <path d="M70 150 L95 145 L105 150" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Character 2: Higher Rank Manager/Boss (Right) -->
  <!-- Chair with high back -->
  <path d="M155 130 L155 205 L185 205 L185 130 Z" fill="#334155" rx="4" />
  <path d="M162 115 L178 115 L178 135 L162 135 Z" fill="#475569" />
  <!-- Body & Torso (Wearing superior suit/tie) -->
  <path d="M150 155 C150 135 180 135 185 155 Z" fill="#1e293b" />
  <path d="M160 145 L175 145 L170 165 L165 165 Z" fill="#f8fafc" /> <!-- Shirt/Tie -->
  <path d="M166 148 L169 148 L170 160 L165 160 Z" fill="#ef4444" /> <!-- Red tie -->
  <!-- Head -->
  <circle cx="167" cy="115" r="15" fill="#fbcfe8" />
  <!-- Hair (Neat executive style) -->
  <path d="M152 115 C152 102 182 102 182 115 C180 110 175 107 167 107 C159 107 154 110 152 115 Z" fill="#1e293b" />
  <!-- Confident posture, arm resting on desk -->
  <path d="M160 145 L145 165 L120 165" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Visual Metaphor for "Higher Rank/Level" (Subtle abstract hierarchy indicators above characters) -->
  <!-- Left lower indicator (1 tier block) -->
  <rect x="55" y="90" width="14" height="6" rx="2" fill="#64748b" opacity="0.6" />
  
  <!-- Right higher indicator (3 stacked tier blocks representing higher position/级别) -->
  <g transform="translate(155, 75)">
    <rect x="0" y="18" width="24" height="6" rx="2" fill="#f59e0b" opacity="0.8" />
    <rect x="3" y="10" width="18" height="6" rx="2" fill="#f59e0b" opacity="0.9" />
    <rect x="6" y="2" width="12" height="6" rx="2" fill="#fbbf24" />
    <!-- Glowing star accent on top tier -->
    <path d="M12 -3 L13.5 0 L17 0.5 L14.5 3 L15.5 6.5 L12 4.5 L8.5 6.5 L9.5 3 L7 0.5 L10.5 0 Z" fill="#fef08a" transform="scale(0.6) translate(8, -4)" />
  </g>

  <!-- Foreground ambient lighting / depth vignette -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.08" />
</svg>