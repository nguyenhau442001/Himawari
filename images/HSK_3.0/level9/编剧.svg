<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(24, 24)">
    <!-- Script pages / background manuscript -->
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="132" height="152" rx="6" fill="#252A34" stroke="#3A4256" stroke-width="2"/>
      <!-- Page lines -->
      <line x1="16" y1="24" x2="100" y2="24" stroke="#3A4256" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="44" x2="116" y2="44" stroke="#3A4256" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="64" x2="90" y2="64" stroke="#3A4256" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="84" x2="116" y2="84" stroke="#3A4256" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="104" x2="108" y2="104" stroke="#3A4256" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="124" x2="70" y2="124" stroke="#3A4256" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Red dramatic cue / accent block -->
      <rect x="16" y="20" width="8" height="8" rx="2" fill="#E54B4B"/>
      <rect x="16" y="80" width="8" height="8" rx="2" fill="#E54B4B"/>
    </g>

    <!-- Clapperboard overlay representing screenwriting/production connection -->
    <g transform="translate(14, 96)">
      <!-- Clapperboard body -->
      <rect x="0" y="24" width="104" height="76" rx="6" fill="#1E232E" stroke="#F6C90E" stroke-width="3"/>
      <!-- Clapper top with stripes -->
      <path d="M-2,20 L106,6 L102,-4 L-6,10 Z" fill="#2E3748"/>
      <path d="M14,15 L28,13 L24,3 L10,5 Z" fill="#F6C90E"/>
      <path d="M46,11 L60,9 L56,-1 L42,1 Z" fill="#F6C90E"/>
      <path d="M78,7 L92,5 L88,-5 L74,-3 Z" fill="#F6C90E"/>
      <!-- Scene text placeholder lines inside clapperboard -->
      <line x1="16" y1="48" x2="52" y2="48" stroke="#7E8A9E" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="68" x2="88" y2="68" stroke="#7E8A9E" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Fountain Pen / Writing tool angled dynamically -->
    <g transform="translate(112, 10) rotate(35)">
      <!-- Pen body -->
      <path d="M30,10 L50,10 L55,90 L25,90 Z" fill="#F6C90E"/>
      <!-- Gold nib -->
      <path d="M30,90 L50,90 L40,120 Z" fill="#E5A900"/>
      <!-- Nib slit -->
      <line x1="40" y1="95" x2="40" y2="112" stroke="#1A1D24" stroke-width="2"/>
      <circle cx="40" cy="100" r="1.5" fill="#1A1D24"/>
      <!-- Pen cap/top accent -->
      <rect x="28" y="4" width="24" height="6" rx="2" fill="#D4AF37"/>
    </g>

    <!-- Creative sparkle/focus points -->
    <circle cx="168" cy="46" r="3" fill="#F6C90E"/>
    <circle cx="24" cy="80" r="2.5" fill="#E54B4B"/>
    <path d="M178,138 L182,148 L192,152 L182,156 L178,166 L174,156 L164,152 L174,148 Z" fill="#F6C90E" opacity="0.8"/>
  </g>
</svg>