<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect for focus -->
  <circle cx="120" cy="120" r="70" fill="#2D323E" opacity="0.6"/>

  <!-- Central Object: Reading Material / Illustrated Book (读物) -->
  <g transform="translate(120, 120)">
    <!-- Open Book Base (Back pages shadow) -->
    <path d="M-75 -35 C-45 -45 -15 -45 0 -40 C15 -45 45 -45 75 -35 L75 45 C45 35 15 35 0 40 C-15 35 -45 35 -75 45 Z" fill="#2E3548"/>

    <!-- Left Page -->
    <path d="M-72 -38 C-44 -47 -15 -47 0 -42 L0 38 C-15 33 -44 33 -72 42 Z" fill="#F4F5F7"/>
    <!-- Right Page -->
    <path d="M72 -38 C44 -47 15 -47 0 -42 L0 38 C15 33 44 33 72 42 Z" fill="#FFFFFF"/>

    <!-- Book Spine/Center Shadow -->
    <path d="M-3 -41 C-1 -41 0 -42 0 -42 C0 -42 1 -41 3 -41 L3 39 C1 39 0 38 0 38 C0 38 -1 39 -3 39 Z" fill="#D0D3DC"/>

    <!-- Left Page Content: Science/Nature Illustration (Sprout & Stars - matching context) -->
    <!-- Mini Mountain/Sun Graphic -->
    <circle cx="-36" cy="-10" r="10" fill="#FFB74D"/>
    <path d="M-56 20 L-36 -5 L-16 20 Z" fill="#78909C"/>
    <path d="M-46 20 L-36 5 L-26 20 Z" fill="#B0BEC5"/>

    <!-- Right Page Content: Text Lines & Educational Icons -->
    <rect x="18" y="-25" width="38" height="5" rx="2.5" fill="#E0E0E0"/>
    <rect x="18" y="-14" width="44" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="18" y="-5" width="28" height="4" rx="2" fill="#E0E0E0"/>

    <!-- Sprout / Science Growth Icon rising out of the right page -->
    <path d="M36 28 C36 15 45 8 52 5 C45 7 40 12 39 18 Z" fill="#66BB6A"/>
    <path d="M36 28 C36 15 27 8 20 5 C27 7 32 12 33 18 Z" fill="#81C784"/>
    <path d="M36 30 L36 10" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>

    <!-- Decorative Educational Elements Floating Up (Inspiration/Knowledge) -->
    <!-- Star/Sparkle 1 (Gold/Orange accent) -->
    <path d="M-52 -75 L-48 -63 L-60 -59 L-48 -55 L-52 -43 L-44 -55 L-32 -59 L-44 -63 Z" fill="#FFB74D"/>
    
    <!-- Star/Sparkle 2 -->
    <path d="M58 -65 L61 -56 L70 -53 L61 -50 L58 -41 L55 -50 L46 -53 L55 -56 Z" fill="#4DB6AC"/>

    <!-- Small floating dot/particle -->
    <circle cx="-15" cy="-70" r="3" fill="#FFB74D" opacity="0.8"/>
    <circle cx="25" cy="-60" r="2" fill="#66BB6A" opacity="0.8"/>
  </g>
</svg>