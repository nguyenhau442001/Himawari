<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Interior Environment (Office/Café Setting) -->
    <!-- Wallpaper & Window accent -->
    <path d="M160 0 H240 V160 H160 Z" fill="#1e293b" opacity="0.5" />
    <rect x="175" y="25" width="45" height="65" rx="4" fill="#0f172a" opacity="0.8" stroke="#334155" stroke-width="2" />
    <path d="M197.5 25 V90" stroke="#334155" stroke-width="2" />
    <path d="M175 57.5 H220" stroke="#334155" stroke-width="2" />

    <!-- Ambient lighting from desk lamp -->
    <circle cx="60" cy="160" r="80" fill="url(#warmLight)" />

    <!-- Bookshelf in background -->
    <rect x="20" y="30" width="80" height="90" rx="2" fill="#111827" opacity="0.4" />
    <rect x="25" y="50" width="70" height="6" fill="#334155" />
    <rect x="25" y="80" width="70" height="6" fill="#334155" />
    <!-- Books -->
    <path d="M35 35 H45 V50 H35 Z" fill="#38bdf8" opacity="0.6" />
    <path d="M48 38 H58 V50 H48 Z" fill="#f43f5e" opacity="0.6" />
    <path d="M62 33 H72 V50 H62 Z" fill="#10b981" opacity="0.6" />

    <!-- Desk Furniture -->
    <rect x="-10" y="160" width="260" height="80" fill="url(#deskGrad)" />
    <rect x="-10" y="160" width="260" height="6" fill="#475569" />

    <!-- Desk Props -->
    <!-- Laptop -->
    <path d="M110 160 L130 145 H175 L185 160 Z" fill="#64748b" />
    <path d="M100 160 H195 V163 H100 Z" fill="#94a3b8" />
    <!-- Coffee Mug -->
    <rect x="190" y="138" width="16" height="22" rx="3" fill="#cbd5e1" />
    <path d="M206 144 C212 144 212 154 206 154" stroke="#cbd5e1" stroke-width="2.5" fill="none" />

    <!-- CHARACTER 2 (The "Me" / Observer on the right, looking slightly surprised/awkward) -->
    <g transform="translate(130, 80)">
      <!-- Body / Torso -->
      <path d="M 25 80 C 25 65 35 55 50 55 C 65 55 75 65 75 80 V 90 H 25 Z" fill="#0284c7" />
      <!-- Neck -->
      <rect x="40" y="45" width="20" height="15" fill="#fcd34d" />
      <!-- Head -->
      <circle cx="50" cy="32" r="18" fill="#fef08a" />
      <!-- Hair -->
      <path d="M 32 30 C 32 15 42 12 50 12 C 62 12 68 20 68 32 C 60 27 40 27 32 30 Z" fill="#334155" />
      <!-- Eyes & Expression (slightly nervous/looking back) -->
      <circle cx="43" cy="32" r="2" fill="#1e293b" />
      <circle cx="57" cy="32" r="2" fill="#1e293b" />
      <!-- Nervous open mouth -->
      <ellipse cx="50" cy="40" rx="3" ry="2" fill="#b91c1c" />
      <!-- Raised hands in defensive/innocent posture -->
      <circle cx="28" cy="65" r="6" fill="#fcd34d" />
      <circle cx="72" cy="68" r="6" fill="#fcd34d" />
    </g>

    <!-- CHARACTER 1 (The Angry Staring Character "He" on the left - 瞪 "dèng") -->
    <g transform="translate(10, 65)">
      <!-- Torso (leaning forward aggressively) -->
      <path d="M 20 105 C 20 85 35 70 55 70 C 75 70 95 85 95 105 V 115 H 20 Z" fill="#dc2626" />
      <!-- Collar / Shirt details -->
      <path d="M 45 70 L 55 85 L 65 70" fill="#f8fafc" />

      <!-- Neck leaning forward -->
      <path d="M 45 55 L 58 72 H 70 L 62 55 Z" fill="#fcd34d" />

      <!-- Head (Tilted forward intensely) -->
      <g transform="translate(55, 38)">
        <!-- Angry Hair -->
        <path d="M -22 -10 C -15 -25 15 -25 24 -12 C 28 -5 30 5 30 10 C 20 2 0 -2 -22 -10 Z" fill="#1e293b" />
        <path d="M -22 -2 C -15 -18 10 -18 20 -5 C 10 -5 -10 2 -22 -2 Z" fill="#0f172a" />

        <!-- Face Base -->
        <circle cx="0" cy="0" r="22" fill="#fef08a" />

        <!-- ANGRY EYES & STARE (The Core Action: 瞪) -->
        <!-- Eyebrows slanting sharply down and in -->
        <path d="M -16 -8 L -4 -2" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
        <path d="M 16 -8 L 4 -2" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

        <!-- Wide open, glaring eyes -->
        <circle cx="-10" cy="1" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="-9" cy="1" r="2" fill="#0f172a" /> <!-- pupil locked intensely right -->

        <circle cx="10" cy="1" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="11" cy="1" r="2" fill="#0f172a" /> <!-- pupil locked intensely right -->

        <!-- Flaring nostrils / angry nose -->
        <path d="M -2 7 L 0 11 L 3 8" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Tense, grimacing mouth -->
        <path d="M -10 16 Q 0 12 10 16" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
      </g>

      <!-- Aggressive, pointing/slamming arm gesture -->
      <path d="M 75 75 C 95 80 110 85 115 80 C 118 78 118 72 112 72 C 105 72 90 75 80 70 Z" fill="#fcd34d" />
      <!-- Fist -->
      <circle cx="114" cy="76" r="7" fill="#f59e0b" />
    </g>

    <!-- Visual Impact / Tension Lines (Artistic representation of the fierce glare/anger) -->
    <path d="M 85 75 L 105 75" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2" />
    <path d="M 88 85 L 110 88" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />

    <!-- Foreground framing / depth vignette -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
  </g>
</svg>