<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines indicating speed/direction -->
  <path d="M160 80 L180 60 M170 90 L190 70 M180 100 L200 80" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Airplane silhouette -->
  <g transform="translate(60, 80)">
    <path d="M80 40 L20 40 L10 50 L0 50 L20 30 L80 30 Z" fill="#FFB84D"/>
    <path d="M40 30 L30 10 L50 10 L40 30 Z" fill="#FFB84D"/>
    <path d="M30 40 L20 60 L40 60 L35 40 Z" fill="#FFB84D"/>
  </g>
  
  <!-- Destination marker (Simplified map pin style) -->
  <g transform="translate(160, 140)">
    <path d="M0 0 C-10 -20 -20 -30 -20 -40 C-20 -51 -11 -60 0 -60 C11 -60 20 -51 20 -40 C20 -30 10 -20 0 0 Z" fill="#FF5252"/>
    <circle cx="0" cy="-40" r="6" fill="#1A1D24"/>
  </g>
  
  <!-- Ground/Landscape indication -->
  <path d="M20 180 L220 180" stroke="#4A5568" stroke-width="2" stroke-dasharray="8 8"/>
</svg>