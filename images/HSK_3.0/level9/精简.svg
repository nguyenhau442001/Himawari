<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)" />

  <!-- Office Wall -->
  <rect x="0" y="0" width="240" height="160" fill="#334155" />
  <!-- Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#475569" />

  <!-- Desk -->
  <rect x="50" y="130" width="140" height="30" rx="6" fill="#64748b" />
  <rect x="55" y="155" width="130" height="10" rx="4" fill="#475569" /> <!-- Desk shadow/thickness -->

  <!-- Manager Character -->
  <!-- Body -->
  <rect x="95" y="100" width="50" height="50" rx="10" fill="#94a3b8" />
  <!-- Head -->
  <circle cx="120" cy="80" r="20" fill="#fbbf24" />
  <!-- Hair -->
  <path d="M100 70 C95 60, 105 55, 120 55 C135 55, 145 60, 140 70 L120 70 Z" fill="#475569"/>
  <!-- Eyes -->
  <circle cx="110" cy="78" r="3" fill="#1e293b" />
  <circle cx="130" cy="78" r="3" fill="#1e293b" />
  <!-- Mouth (neutral/contemplative) -->
  <path d="M115 88 Q120 90, 125 88" stroke="#1e293b" stroke-width="2" fill="none" />
  <!-- Arms -->
  <rect x="75" y="110" width="25" height="15" rx="5" fill="#94a3b8" /> <!-- Left arm -->
  <rect x="140" y="110" width="25" height="15" rx="5" fill="#94a3b8" /> <!-- Right arm -->
  <!-- Hands (holding tablet) -->
  <circle cx="85" cy="120" r="8" fill="#fbbf24" />
  <circle cx="155" cy="120" r="8" fill="#fbbf24" />

  <!-- Tablet / Screen -->
  <rect x="90" y="105" width="60" height="45" rx="5" fill="#cbd5e1" /> <!-- Tablet frame -->
  <rect x="93" y="108" width="54" height="39" rx="3" fill="#f8fafc" /> <!-- Screen content area -->

  <!-- Screen Content: Bar Chart for Streamlining -->
  <!-- Left Bar (Taller - Original Personnel) -->
  <rect x="105" y="118" width="10" height="25" fill="#64748b" />
  <!-- Right Bar (Shorter - Streamlined Personnel) -->
  <rect x="125" y="125" width="10" height="18" fill="#64748b" />
  <!-- Downward Arrow indicating reduction -->
  <path d="M115 120 L115 128 M115 128 L113 126 M115 128 L117 126" stroke="#38bdf8" stroke-width="2" fill="none" />
  <!-- A subtle minus sign -->
  <rect x="113" y="132" width="4" height="1" fill="#38bdf8" />

  <!-- Office Chair (behind manager) -->
  <rect x="105" y="145" width="30" height="15" rx="5" fill="#475569" />
  <rect x="100" y="160" width="40" height="5" rx="2" fill="#334155" /> <!-- Chair base -->
  <circle cx="110" cy="168" r="3" fill="#334155" />
  <circle cx="130" cy="168" r="3" fill="#334155" />

  <!-- Office Plant (subtle background detail) -->
  <rect x="20" y="130" width="15" height="20" rx="4" fill="#64748b" /> <!-- Pot -->
  <path d="M27 130 Q25 120, 30 115 Q35 110, 37 120 Z" fill="#10b981" /> <!-- Leaf 1 -->
  <path d="M27 130 Q30 120, 25 115 Q20 110, 22 120 Z" fill="#10b981" /> <!-- Leaf 2 -->
  <path d="M27 130 Q27 115, 32 110 Q37 105, 35 115 Z" fill="#10b981" /> <!-- Leaf 3 -->

  <!-- Window (subtle background detail) -->
  <rect x="180" y="40" width="40" height="60" rx="5" fill="#94a3b8" opacity="0.3" />
  <rect x="185" y="45" width="30" height="50" rx="3" fill="#f8fafc" opacity="0.2" />
</svg>