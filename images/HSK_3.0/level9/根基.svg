<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ground surface cutaway / Foundation trench -->
  <path d="M40 145 H200 V155 H40 Z" fill="#2E3440" opacity="0.8"/>
  <path d="M40 155 H200 V200 H40 Z" fill="#111318"/>

  <!-- Deep Roots Network (Gốc rễ vững chắc) -->
  <g stroke="#D08770" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Center taproot -->
    <path d="M120 155 V185 C120 195, 110 200, 100 205"/>
    <path d="M120 170 L135 185"/>
    <path d="M120 165 L105 180"/>
    
    <!-- Left lateral roots -->
    <path d="M100 155 C90 165, 75 165, 65 175"/>
    <path d="M80 162 C70 170, 60 185, 50 190"/>
    <path d="M90 168 L80 180"/>

    <!-- Right lateral roots -->
    <path d="M140 155 C150 165, 165 165, 175 175"/>
    <path d="M160 162 C170 170, 180 185, 190 190"/>
    <path d="M150 168 L160 180"/>
  </g>

  <!-- Foundation Base / Concrete Footings (Nền móng) -->
  <g fill="#4C566A">
    <rect x="70" y="130" width="100" height="15" rx="2"/>
    <rect x="85" y="115" width="70" height="15" rx="2"/>
  </g>
  <g fill="#5E81AC">
    <rect x="95" y="100" width="50" height="15" rx="2"/>
  </g>

  <!-- Main Structural Pillar / Building Base (Nền tảng vững bền) -->
  <rect x="102" y="55" width="36" height="45" fill="#88C0D0" rx="3"/>
  
  <!-- Architectural Accent Lines on Pillar (Mathematical grid motif) -->
  <line x1="102" y1="67" x2="138" y2="67" stroke="#434C5E" stroke-width="2"/>
  <line x1="102" y1="79" x2="138" y2="79" stroke="#434C5E" stroke-width="2"/>
  <line x1="102" y1="91" x2="138" y2="91" stroke="#434C5E" stroke-width="2"/>
  <line x1="120" y1="55" x2="120" y2="100" stroke="#434C5E" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Golden Apex / Breakthrough Indicator (Đột phá) -->
  <polygon points="120,30 137,50 103,50" fill="#EBCB8B"/>

  <!-- Structural Ground Line -->
  <line x1="30" y1="145" x2="210" y2="145" stroke="#E5E9F0" stroke-width="3" stroke-linecap="round"/>
</svg>