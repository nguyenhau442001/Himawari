<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background cinema/screen frame to reference movie context -->
  <rect x="36" y="50" width="168" height="110" rx="8" fill="#222630" stroke="#2F3542" stroke-width="2"/>
  
  <!-- Divided contrast visual representing "庸俗" (tầm thường, dung tục / low-brow, tacky content) -->
  <!-- Left/Upper side: Sleek art/creative framing (dimmed) -->
  <path d="M56 80 L76 100 L56 120 Z" fill="#3B4252" opacity="0.5"/>
  <circle cx="95" cy="100" r="12" fill="#3B4252" opacity="0.5"/>
  
  <!-- Right/Center side: Exaggerated, loud, tacky visual tropes (bright gold/orange accent for contrast) -->
  <!-- Clashing bright elements symbolizing vulgar/cheap sensationalism in media -->
  <!-- Giant glowing exclamation/starburst emblem in sharp flat orange -->
  <g transform="translate(120, 95)">
    <!-- Exploding tacky star shape -->
    <path d="M0 -32 L8 -12 L30 -18 L15 0 L32 12 L12 15 L18 32 L0 18 L-18 32 L-12 15 L-32 12 L-15 0 L-30 -18 L-8 -12 Z" fill="#F39C12"/>
    <!-- Inner flashy diamond/spark -->
    <path d="M0 -16 L5 -4 L16 0 L5 4 L0 16 L-5 4 L-16 0 L-5 -4 Z" fill="#FFFFFF"/>
    <!-- Dollar sign / cheap commercialism trope integrated cleanly -->
    <path d="M0 -8 V8 M-3 -5 H3 M-3 5 H3" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Ground / Screen Base -->
  <rect x="80" y="160" width="80" height="6" rx="3" fill="#3B4252"/>
  <rect x="100" y="166" width="40" height="4" rx="2" fill="#2F3542"/>

  <!-- Lower visual contrast indicator (Adjective contrast rule: scale & expression) -->
  <!-- A sleek, modern rating or thumbs-down/low-quality indicator styled minimally -->
  <g transform="translate(120, 196)">
    <!-- Background pill -->
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#252A34" stroke="#E74C3C" stroke-width="1.5"/>
    <!-- Downward trend / vulgarity indicator icon -->
    <path d="M-22 -3 L-16 4 L-10 -3" fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-16" y1="-5" x2="-16" y2="4" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tacky/Low quality warning bars -->
    <rect x="0" y="-5" width="6" height="10" rx="1" fill="#E74C3C"/>
    <rect x="9" y="-2" width="6" height="7" rx="1" fill="#E74C3C" opacity="0.6"/>
    <rect x="18" y="1" width="6" height="4" rx="1" fill="#E74C3C" opacity="0.3"/>
  </g>
</svg>