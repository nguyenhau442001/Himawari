<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Canvas/Artwork Gradient -->
    <linearGradient id="artGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Studio / Gallery Ambient Light -->
  <circle cx="120" cy="80" r="100" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT: Art Studio / Exhibition Hall -->
  <!-- Floor Perspective Lines -->
  <path d="M 0 210 L 240 210 M 40 240 L 90 210 M 200 240 L 150 210" stroke="#312e81" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="0" y="210" width="240" height="30" fill="#090d16"/>

  <!-- Easel Structure -->
  <!-- Rear Leg -->
  <line x1="120" y1="30" x2="120" y2="210" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Front Left Leg -->
  <line x1="120" y1="30" x2="60" y2="210" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Front Right Leg -->
  <line x1="120" y1="30" x2="180" y2="210" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="85" y1="130" x2="155" y2="130" stroke="#475569" stroke-width="2.5"/>

  <!-- THE MASTERPIECE: Grand Landscape Painting (Grandeur / qìpò) -->
  <g transform="translate(55, 45)">
    <!-- Canvas Frame / Shadow -->
    <rect x="-3" y="-3" width="136" height="116" rx="6" fill="#020617" opacity="0.6"/>
    <rect x="0" y="0" width="130" height="110" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    
    <!-- Painting Inner Content -->
    <clipPath id="canvasClip">
      <rect x="4" y="4" width="122" height="102" rx="2"/>
    </clipPath>
    <g clip-path="url(#canvasClip)">
      <!-- Sky Background -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4c1d95"/>
        <stop offset="50%" stop-color="#7c2d12"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
      <rect x="4" y="4" width="122" height="102" fill="url(#skyGrad)"/>

      <!-- Glowing Sun/Moon -->
      <circle cx="95" cy="35" r="16" fill="#fde047" opacity="0.9"/>
      <circle cx="95" cy="35" r="22" fill="#f59e0b" opacity="0.3"/>

      <!-- Majestic Mountain Ranges (Layered for depth - Grandeur) -->
      <!-- Far Mountains -->
      <polygon points="4,90 35,50 70,80 100,45 130,95 130,110 4,110" fill="#431407" opacity="0.6"/>
      <!-- Mid Mountains -->
      <polygon points="4,95 45,60 85,95 126,70 126,110 4,110" fill="#581c87" opacity="0.8"/>
      <!-- Foreground Dramatic Peaks -->
      <polygon points="4,106 30,75 55,95 90,55 126,85 126,110 4,110" fill="url(#artGrad)"/>

      <!-- Epic Rushing Waterfall / River Light -->
      <path d="M 90 55 L 75 80 L 85 110" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M 87 65 L 72 90 L 82 110" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>

      <!-- Soaring Eagle Silhouettes (Scale & Freedom) -->
      <path d="M 30 30 Q 38 24 46 30 Q 38 33 30 30 Z" fill="#fef08a"/>
      <path d="M 50 22 Q 55 18 60 22 Q 55 24 50 22 Z" fill="#fef08a"/>
    </g>
  </g>

  <!-- Easel Shelf supporting canvas -->
  <rect x="50" y="152" width="140" height="6" rx="2" fill="#64748b"/>

  <!-- Foreground Artist / Creator Character (Expressing pride and awe in the artwork) -->
  <g transform="translate(135, 125)">
    <!-- Shadow beneath character -->
    <ellipse cx="25" cy="88" rx="25" ry="6" fill="#000000" opacity="0.4"/>

    <!-- Legs & Shoes -->
    <path d="M 15 55 L 12 85 L 5 88" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 32 55 L 35 85 L 42 88" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Torso (leaning back slightly, arms crossed in proud contemplation) -->
    <path d="M 12 25 Q 25 20 35 28 L 32 60 L 15 60 Z" fill="url(#shirtGrad)"/>

    <!-- Head & Hair -->
    <circle cx="24" cy="11" r="11" fill="#fbcfe8"/>
    <!-- Stylized Hair -->
    <path d="M 13 11 C 13 3, 35 3, 35 11 C 35 14, 30 16, 24 16 C 18 16, 13 14, 13 11 Z" fill="#334155"/>

    <!-- Arms crossed triumphantly -->
    <path d="M 15 32 Q 25 38 35 32" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
    <path d="M 17 40 Q 25 45 33 40" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>

    <!-- Hand resting on arm -->
    <circle cx="25" cy="36" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Studio Props: Art Palette and Brush on Floor -->
  <g transform="translate(35, 185)">
    <!-- Wooden Palette -->
    <ellipse cx="20" cy="12" rx="14" ry="10" fill="#a16207" transform="rotate(-15 20 12)"/>
    <!-- Thumb hole -->
    <ellipse cx="14" cy="14" rx="2" ry="1.5" fill="#0f172a"/>
    <!-- Paint Blobs on Palette -->
    <circle cx="12" cy="7" r="2.5" fill="#38bdf8"/>
    <circle cx="18" cy="6" r="2.5" fill="#f43f5e"/>
    <circle cx="26" cy="10" r="2.5" fill="#fbbf24"/>
    <circle cx="22" cy="16" r="2.5" fill="#10b981"/>

    <!-- Paintbrush -->
    <path d="M 2 20 L 28 4" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ferrule & Bristles -->
    <path d="M 26 5 L 29 3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 29 3 L 32 1" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Golden Dust Particles / Artistic Sparkles -->
  <circle cx="35" cy="90" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="45" cy="75" r="1" fill="#fef08a" opacity="0.9"/>
  <circle cx="195" cy="65" r="2" fill="#f59e0b" opacity="0.7"/>
  <circle cx="205" cy="100" r="1" fill="#fef08a" opacity="0.6"/>
  <circle cx="115" cy="20" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="130" cy="15" r="2" fill="#fbbf24" opacity="0.9"/>

  <!-- Outer Frame / Border Overlay for polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>