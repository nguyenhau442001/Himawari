<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="30" y="25" width="180" height="90" rx="6"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office Interior Background -->
  <rect x="30" y="25" width="180" height="90" rx="6" fill="url(#windowGrad)" stroke="#475569" stroke-width="1.5"/>
  <!-- City Skyline Silhouette outside window -->
  <g clip-path="url(#windowClip)" fill="#334155" opacity="0.4">
    <rect x="45" y="65" width="18" height="50"/>
    <rect x="68" y="45" width="22" height="70"/>
    <rect x="95" y="55" width="15" height="60"/>
    <rect x="115" y="40" width="25" height="75"/>
    <rect x="145" y="70" width="20" height="45"/>
    <rect x="170" y="50" width="22" height="65"/>
  </g>

  <!-- Hanging Office Lamp -->
  <path d="M120 0 L120 25" stroke="#64748b" stroke-width="2"/>
  <path d="M100 25 L140 25 L132 35 L108 35 Z" fill="#475569"/>
  <path d="M105 35 L135 35 L120 42 Z" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Back Wall Details (Shelves & Plant) -->
  <rect x="38" y="45" width="25" height="3" rx="1" fill="#475569"/>
  <circle cx="45" cy="42" r="6" fill="#10b981"/>
  <path d="M42 45 C42 40 48 40 48 45" fill="#334155"/>

  <!-- Office Desk -->
  <rect x="15" y="165" width="210" height="12" rx="3" fill="url(#deskGrad)" stroke="#475569" stroke-width="1"/>
  <path d="M30 177 L35 220 L45 220 L40 177 Z" fill="#334155"/>
  <path d="M210 177 L205 220 L195 220 L200 177 Z" fill="#334155"/>

  <!-- Desk Props (Laptop, Lamp, Nameplate) -->
  <rect x="160" y="145" width="35" height="20" rx="2" fill="#64748b"/>
  <path d="M155 165 L200 165 L205 167 L150 167 Z" fill="#94a3b8"/>
  <!-- Manager Nameplate / Desk Sign -->
  <path d="M125 155 L155 155 L150 165 L130 165 Z" fill="#e2e8f0"/>
  <path d="M128 153 L152 153 L155 155 L125 155 Z" fill="#cbd5e1"/>

  <!-- Character 1: The Director / Superior (Handing over appointment) -->
  <g id="boss-character">
    <!-- Body -->
    <path d="M85 120 C85 105 105 100 115 115 L120 165 L80 165 Z" fill="#1e293b"/>
    <!-- Suit Jacket -->
    <path d="M82 118 L100 118 L105 150 L90 165 L82 165 Z" fill="#334155"/>
    <path d="M118 118 L100 118 L95 150 L110 165 L118 165 Z" fill="#334155"/>
    <!-- Shirt & Tie -->
    <path d="M96 118 L104 118 L102 135 L98 135 Z" fill="#f8fafc"/>
    <polygon points="100,132 103,145 100,155 97,145" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="100" cy="92" r="14" fill="#fbcfe8"/>
    <path d="M86 92 C86 80 114 80 114 92 C114 96 112 90 100 90 C88 90 86 96 86 92 Z" fill="#334155"/>
    <!-- Hand handing document -->
    <path d="M115 130 C125 130 135 135 140 140" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 2: The Newly Appointed Manager (Excited, receiving) -->
  <g id="manager-character">
    <!-- Body -->
    <path d="M130 120 C130 105 150 100 160 115 L165 165 L125 165 Z" fill="#0f172a"/>
    <!-- Suit Jacket -->
    <path d="M128 118 L145 140 L135 165 L125 165 Z" fill="#1e293b"/>
    <path d="M162 118 L145 140 L155 165 L165 165 Z" fill="#1e293b"/>
    <!-- Shirt & Tie -->
    <path d="M141 118 L149 118 L147 138 L143 138 Z" fill="#f8fafc"/>
    <polygon points="145,135 148,148 145,158 142,148" fill="#f59e0b"/>
    <!-- Head & Hair -->
    <circle cx="145" cy="90" r="14" fill="#fbcfe8"/>
    <path d="M131 90 C131 78 159 78 159 90 C159 94 157 88 145 88 C133 88 131 94 131 90 Z" fill="#0f172a"/>
    <!-- Happy Expression (Eyes & Smile) -->
    <path d="M139 88 Q142 85 145 88" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M147 88 Q150 85 153 88" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M143 94 Q145 97 147 94" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Hand receiving -->
    <path d="M150 138 C145 140 138 142 135 145" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- The Appointment Document / Certificate (Central visual anchor) -->
  <g id="appointment-certificate" transform="translate(120, 115) rotate(-10)">
    <rect x="-18" y="-12" width="36" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Red Official Seal / Stamp -->
    <circle cx="8" cy="4" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="8" cy="4" r="3.5" fill="none" stroke="#b91c1c" stroke-width="0.75"/>
    <!-- Document lines representing text -->
    <line x1="-13" y1="-6" x2="2" y2="-6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-13" y1="-2" x2="0" y2="-2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-13" y1="2" x2="-3" y2="2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Golden Success / Promotion Glow Effects -->
  <g id="sparkles" fill="url(#goldGlow)">
    <path d="M120 70 L122 75 L127 77 L122 79 L120 84 L118 79 L113 77 L118 75 Z" opacity="0.9"/>
    <path d="M75 90 L76.5 93.5 L80 95 L76.5 96.5 L75 100 L73.5 96.5 L70 95 L73.5 93.5 Z" opacity="0.7"/>
    <path d="M165 75 L166 77 L168 78 L166 79 L165 81 L164 79 L162 78 L164 77 Z" opacity="0.6"/>
  </g>

  <!-- Foreground Plant Pot (Adds depth) -->
  <path d="M15 210 L30 210 L27 240 L18 240 Z" fill="#475569"/>
  <ellipse cx="22.5" cy="210" rx="7.5" ry="2" fill="#64748b"/>
  <!-- Plant Leaves -->
  <path d="M22.5 208 C22.5 190 10 185 5 180 C10 195 20 200 22.5 208 Z" fill="#10b981"/>
  <path d="M22.5 208 C25 185 40 180 45 175 C38 190 27 198 22.5 208 Z" fill="#059669"/>
  <path d="M22.5 208 C20 192 25 185 30 178 C25 193 23 202 22.5 208 Z" fill="#34d399"/>
</svg>