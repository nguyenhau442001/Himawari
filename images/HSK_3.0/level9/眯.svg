<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Strong Sunlight Ray Gradient -->
    <linearGradient id="sun-ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="window-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE CONTEXT: Indoors / Room with a large bright window -->
  <!-- Window frame and background wall -->
  <rect x="20" y="20" width="100" height="150" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="25" y="25" width="90" height="140" rx="2" fill="url(#window-glow)"/>
  
  <!-- Window pane divisions -->
  <line x1="70" y1="25" x2="70" y2="165" stroke="#334155" stroke-width="3"/>
  <line x1="25" y1="95" x2="115" y2="95" stroke="#334155" stroke-width="3"/>

  <!-- INTENSE SUNLIGHT RAYS STREAMING IN -->
  <polygon points="25,25 240,110 240,150 25,25" fill="url(#sun-ray)"/>
  <polygon points="25,60 220,200 180,200 25,100" fill="url(#sun-ray)"/>

  <!-- Room Interior Details / Props -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Houseplant silhouette for atmosphere -->
  <path d="M190,170 Q195,140 180,120 Q200,130 210,170 Z" fill="#047857"/>
  <ellipse cx="195" cy="170" rx="15" ry="6" fill="#475569"/>

  <!-- MAIN CHARACTER: Young woman shielding her eyes from the glaring sun -->
  <g transform="translate(110, 80)">
    <!-- Body & Shoulders -->
    <path d="M-30,120 C-30,95 -15,85 0,85 C15,85 30,95 30,120 L40,160 C40,160 -40,160 -30,120 Z" fill="#38bdf8"/>
    <!-- Collar details -->
    <path d="M-10,85 L0,98 L10,85" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="-8" y="70" width="16" height="20" rx="6" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="0" cy="45" r="30" fill="#fbcfe8"/>

    <!-- Hair (Stylish bob cut) -->
    <path d="M-30,35 C-32,15 -15,10 0,10 C15,10 32,15 30,35 L33,65 C33,65 38,40 30,30 C20,18 -10,18 -25,30 C-33,40 -30,65 -30,65 Z" fill="#1e293b"/>
    <!-- Hair strands framing face -->
    <path d="M-30,35 C-33,55 -28,75 -25,75" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <path d="M30,35 C33,55 28,75 25,75" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

    <!-- ACTION: SQUINTING EYES (眯 - Mī / Nhắm hờ mắt) -->
    <!-- Eyebrows furrowed slightly due to bright light -->
    <path d="M-14,37 C-10,34 -4,37 -2,39" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14,37 C10,34 4,37 2,39" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Squinting Eyes (Curved lines indicating tightly narrowed / half-closed eyes) -->
    <path d="M-15,42 Q-10,46 -5,42" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M5,42 Q10,46 15,42" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyelashes / Squint lines -->
    <line x1="-16" y1="41" x2="-13" y2="44" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="41" x2="-7" y2="44" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="41" x2="13" y2="44" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="41" x2="7" y2="44" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute Blush -->
    <circle cx="-16" cy="50" r="5" fill="#fda4af" opacity="0.6"/>
    <circle cx="16" cy="50" r="5" fill="#fda4af" opacity="0.6"/>

    <!-- Nose & Slight grimace/smile -->
    <circle cx="0" cy="49" r="1.5" fill="#db2777" opacity="0.4"/>
    <path d="M-5,58 Q0,62 5,58" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>

    <!-- Hand raised to block blinding light -->
    <path d="M15,90 C25,70 30,50 20,40 C15,35 10,40 12,48 C15,55 5,75 -5,85" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5"/>
    <path d="M18,43 C22,38 28,42 26,48 C25,52 20,55 17,55" fill="#fbcfe8"/>
  </g>

  <!-- Floating bright glare sparkles representing intense sunlight -->
  <g fill="#fef08a">
    <polygon points="140,50 142,56 148,58 142,60 140,66 138,60 132,58 138,56"/>
    <polygon points="180,90 181,93 184,94 181,95 180,98 179,95 176,94 179,93"/>
    <circle cx="100" cy="70" r="3" opacity="0.8"/>
    <circle cx="160" cy="40" r="2" opacity="0.9"/>
  </g>
</svg>