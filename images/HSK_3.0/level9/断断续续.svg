<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Warm Lamp Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Speech Pulse Gradient (intermittent effect) -->
    <linearGradient id="pulseGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Interior Environment / Background Details -->
  <!-- Bookshelf / Wall details -->
  <rect x="25" y="40" width="45" height="75" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="50" width="35" height="6" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="30" y="65" width="30" height="6" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="30" y="80" width="35" height="6" rx="2" fill="#475569" opacity="0.6"/>

  <!-- Window with Night City Silhouette -->
  <path d="M165,35 L215,35 L215,105 L165,105 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M175,45 L185,45 L185,60 L175,60 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M195,50 L205,50 L205,75 L195,75 Z" fill="#fbbf24" opacity="0.2"/>
  <path d="M175,70 L185,70 L185,95 L175,95 Z" fill="#38bdf8" opacity="0.2"/>
  <!-- Window Frame Divider -->
  <line x1="190" y1="35" x2="190" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="165" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="2"/>

  <!-- Desk & Lamp -->
  <rect x="20" y="185" width="200" height="12" rx="4" fill="#475569"/>
  <path d="M50,185 L50,135 L60,135 L60,185 Z" fill="#64748b"/>
  <path d="M40,135 L70,135 L65,120 L45,120 Z" fill="#94a3b8"/>
  <circle cx="55" cy="138" r="6" fill="#fbbf24"/>

  <!-- Coffee Mug with Steam -->
  <rect x="180" y="160" width="18" height="22" rx="3" fill="#cbd5e1"/>
  <path d="M198,166 C204,166 204,176 198,176" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <!-- Steam (Wavy lines indicating slight warmth/weakness) -->
  <path d="M185,150 Q188,144 185,138" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M193,148 Q190,142 193,136" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Character: Man sitting at desk, speaking hesitantly/intermittently -->
  <!-- Chair Back -->
  <path d="M85,115 L105,115 L100,185 L85,185 Z" fill="#334155"/>

  <!-- Character Body / Torso (Blue Sweater / Shirt) -->
  <path d="M90,140 C90,125 110,120 125,130 C135,136 145,150 150,185 L90,185 Z" fill="#2563eb"/>
  
  <!-- Character Neck & Head -->
  <path d="M110,125 L120,125 L120,140 L110,140 Z" fill="#fbcfe8"/>
  <circle cx="118" cy="105" r="18" fill="#fbcfe8"/>
  
  <!-- Hair (Neat dark hair) -->
  <path d="M100,102 C100,90 120,88 132,98 C135,102 135,108 135,108 L103,108 Z" fill="#0f172a"/>

  <!-- Facial expression: Hesitant, unsure (slightly open mouth, thoughtful brow) -->
  <!-- Eyebrow (slightly raised/puzzled) -->
  <path d="M112,98 Q118,95 124,99" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Eye (focused/calm) -->
  <circle cx="123" cy="104" r="2" fill="#0f172a"/>
  <!-- Open mouth (speaking) -->
  <path d="M127,112 C129,112 131,114 129,116 C127,116 126,114 127,112 Z" fill="#991b1b"/>

  <!-- Hand resting near chin (thoughtful pose) -->
  <path d="M125,125 C130,122 135,128 130,133" fill="#fbcfe8" stroke="#db2777" stroke-width="0.5"/>
  <circle cx="127" cy="122" r="5" fill="#fbcfe8"/>

  <!-- VISUAL METAPHOR FOR "断断续续" (Intermittent Speech / Broken Waves) -->
  <!-- Distinct, broken/disconnected speech bubbles & sound wave pulses -->
  
  <!-- Pulse 1: Strong start -->
  <path d="M142,102 Q152,95 162,102" stroke="url(#pulseGrad1)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="165" cy="103" r="3.5" fill="#38bdf8"/>

  <!-- Gap indicator (floating pause dots showing interruption) -->
  <circle cx="177" cy="103" r="1.5" fill="#64748b" opacity="0.8"/>
  <circle cx="185" cy="103" r="2" fill="#64748b" opacity="0.8"/>
  <circle cx="194" cy="103" r="2.5" fill="#64748b" opacity="0.8"/>

  <!-- Pulse 2: Faint/resumed speech further away -->
  <path d="M204,103 Q210,99 216,103" stroke="url(#pulseGrad2)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="219" cy="103" r="2.5" fill="#fb923c"/>

  <!-- Additional lower broken speech fragment (reinforcing "spoken in bits and pieces") -->
  <path d="M145,114 Q153,110 159,114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3" fill="none" opacity="0.7"/>
  <circle cx="163" cy="114" r="2" fill="#38bdf8" opacity="0.6"/>

  <circle cx="172" cy="114" r="1.5" fill="#64748b" opacity="0.5"/>
  <circle cx="178" cy="114" r="1.5" fill="#64748b" opacity="0.5"/>

  <path d="M185,114 Q190,111 195,114" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2" fill="none" opacity="0.6"/>

  <!-- Foreground Atmospheric Elements -->
  <!-- Desk edge highlight -->
  <rect x="20" y="185" width="200" height="3" fill="#64748b" opacity="0.5"/>
</svg>