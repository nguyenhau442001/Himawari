<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for modern dark mode UI feel -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>
  <path d="M120 40 L120 200 M40 120 L200 120" stroke="#2A303C" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Motion lines for the "Action/Verbs" requirement -->
  <g opacity="0.6">
    <path d="M 85 95 Q 105 85 125 105" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M 80 105 Q 100 95 120 115" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Giver Character (Left) -->
  <g transform="translate(20, 0)">
    <!-- Body -->
    <path d="M 45 150 C 45 130 55 120 70 120 C 85 120 95 130 95 150 L 95 185 L 45 185 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="70" cy="95" r="16" fill="#E2E8F0"/>
    <!-- Arm extending forward to bestow -->
    <path d="M 70 130 C 80 130 95 135 105 135" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="107" cy="135" r="5" fill="#E2E8F0"/>
  </g>

  <!-- Receiver Character (Right) -->
  <g transform="translate(100, 0)">
    <!-- Body -->
    <path d="M 45 150 C 45 130 55 120 70 120 C 85 120 95 130 95 150 L 95 185 L 45 185 Z" fill="#10B981"/>
    <!-- Head -->
    <circle cx="70" cy="95" r="16" fill="#E2E8F0"/>
    <!-- Arm reaching out to receive -->
    <path d="M 70 130 C 60 130 45 135 35 135" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
    <circle cx="33" cy="135" r="5" fill="#E2E8F0"/>
  </g>

  <!-- The Award / Honor Object being bestowed (授予 - "shòuyǔ" core focus: Medal / Honor Title) -->
  <g transform="translate(120, 115)">
    <!-- Glow effect behind the award -->
    <circle cx="0" cy="0" r="22" fill="#F59E0B" opacity="0.2"/>
    
    <!-- Ribbon -->
    <path d="M -8 -15 L 8 -15 L 12 5 L 0 15 L -12 5 Z" fill="#EF4444"/>
    <path d="M -4 -15 L 4 -15 L 8 2 L 0 10 L -8 2 Z" fill="#DC2626"/>

    <!-- Gold Medal -->
    <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="11" fill="#F59E0B"/>
    
    <!-- Star icon inside medal representing "荣誉称号" (Honor title) -->
    <polygon points="0,-6 1.8,-1.8 6,-1.8 2.5,0.8 3.8,5 0,2.5 -3.8,5 -2.5,0.8 -6,-1.8 -1.8,-1.8" fill="#FEF3C7"/>
  </g>

  <!-- Sparkles / Success Highlights -->
  <g fill="#FBBF24">
    <path d="M 120 65 L 122 72 L 129 74 L 122 76 L 120 83 L 118 76 L 111 74 L 118 72 Z" transform="scale(0.6) translate(100, 20)"/>
    <path d="M 120 65 L 122 72 L 129 74 L 122 76 L 120 83 L 118 76 L 111 74 L 118 72 Z" transform="scale(0.4) translate(140, 120)"/>
  </g>
</svg>