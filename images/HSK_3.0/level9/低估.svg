<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Floor Line -->
    <line x1="40" y1="185" x2="200" y2="185" stroke="#2A2F3B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Small Character (Underestimated Opponent) -->
    <g transform="translate(75, 120)">
      <!-- Shadow -->
      <ellipse cx="0" cy="65" rx="14" ry="4" fill="#111317"/>
      <!-- Body/Suit -->
      <path d="M-10 65 L-10 35 Q-10 30 -5 30 L5 30 Q10 30 10 35 L10 65 Z" fill="#4B5563"/>
      <!-- Head -->
      <circle cx="0" cy="18" r="10" fill="#9CA3AF"/>
      <!-- Small floating aura hinting hidden power -->
      <circle cx="0" cy="40" r="22" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    </g>

    <!-- Giant Power Core / Hologram / Manifestation representing "Potential Strength" (Hidden beneath small appearance) -->
    <g transform="translate(75, 115)" opacity="0.85">
      <polygon points="0,-35 25,-10 15,25 -15,25 -25,-10" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="0" cy="-5" r="8" fill="#F59E0B"/>
    </g>

    <!-- Magnifying Glass / Assessment Lens (Focusing on the small exterior, missing the giant reality) -->
    <g transform="translate(145, 95)">
      <!-- Handle -->
      <path d="M15 15 L35 35" stroke="#6B7280" stroke-width="8" stroke-linecap="round"/>
      <path d="M15 15 L33 33" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Glass Rim -->
      <circle cx="-5" cy="-5" r="32" fill="#1F2937" stroke="#3B82F6" stroke-width="5"/>
      
      <!-- Inside Lens: Revealing the towering giant silhouette -->
      <clipPath id="lens-clip">
        <circle cx="-5" cy="-5" r="29"/>
      </clipPath>
      
      <g clip-path="url(#lens-clip)">
        <!-- Background inside lens -->
        <circle cx="-5" cy="-5" r="29" fill="#0F172A"/>
        
        <!-- Giant silhouette inside -->
        <g transform="translate(-5, 10)">
          <!-- Massive shoulders/body -->
          <path d="M-25 40 L-25 10 Q-25 -5 -10 -10 L10 -10 Q25 -5 25 10 L25 40 Z" fill="#F59E0B"/>
          <!-- Glowing eyes/core -->
          <circle cx="-6" cy="-2" r="2.5" fill="#FFFFFF"/>
          <circle cx="6" cy="-2" r="2.5" fill="#FFFFFF"/>
          <!-- Head -->
          <circle cx="0" cy="-18" r="9" fill="#F59E0B"/>
        </g>
        
        <!-- Light reflection on lens -->
        <path d="M-18 -20 Q-10 -25 0 -22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none"/>
      </g>
    </g>
    
    <!-- Warning / Undervaluing Indicator (Subtle downward bracket/arrow context) -->
    <g transform="translate(145, 145)">
      <path d="M-10 -5 L0 5 L10 -5" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>