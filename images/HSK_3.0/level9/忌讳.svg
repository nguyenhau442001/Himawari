<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Warm Accent Gradient -->
    <linearGradient id="amber-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Light from "Forbidden" conversation focus -->
  <circle cx="120" cy="130" r="80" fill="url(#amber-glow)"/>

  <!-- ENVIRONMENT / INTERIOR -->
  <!-- Back Wall Windows with Modern Frame -->
  <g opacity="0.4">
    <rect x="30" y="30" width="60" height="70" rx="4" fill="#334155"/>
    <rect x="36" y="36" width="22" height="58" fill="#1e293b"/>
    <rect x="62" y="36" width="22" height="58" fill="#1e293b"/>

    <rect x="150" y="30" width="60" height="70" rx="4" fill="#334155"/>
    <rect x="156" y="36" width="22" height="58" fill="#1e293b"/>
    <rect x="182" y="36" width="22" height="58" fill="#1e293b"/>
  </g>

  <!-- Plant Decor for realism -->
  <path d="M205,140 Q215,120 210,100 Q205,115 195,125 Z" fill="#10b981" opacity="0.6"/>
  <path d="M190,145 Q180,130 185,110 Q190,125 195,135 Z" fill="#059669" opacity="0.7"/>
  <rect x="185" y="140" width="25" height="30" rx="4" fill="#64748b"/>

  <!-- Conference / Dining Table -->
  <rect x="40" y="150" width="160" height="12" rx="3" fill="url(#wood)" filter="url(#shadow)"/>
  <rect x="60" y="162" width="12" height="40" fill="#1e293b"/>
  <rect x="168" y="162" width="12" height="40" fill="#1e293b"/>

  <!-- Table Props: Teacups & Documents -->
  <rect x="95" y="142" width="18" height="10" rx="2" fill="#cbd5e1"/>
  <circle cx="104" cy="140" r="7" fill="#94a3b8"/>
  
  <rect x="130" y="144" width="22" height="8" rx="1" fill="#cbd5e1" transform="rotate(-10 130 144)"/>

  <!-- CHARACTERS -->

  <!-- Character 1 (Left - Speaking/Brought up the taboo topic) -->
  <g transform="translate(35, 75)">
    <!-- Body & Torso -->
    <path d="M25,85 C25,65 40,55 55,55 C70,55 85,65 85,85 L85,100 L25,100 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="55" cy="38" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M37,35 C37,22 50,18 60,20 C73,22 73,35 73,38 C65,33 45,33 37,35 Z" fill="#1e293b"/>
    <!-- Face expression (Oblivious/Casual) -->
    <circle cx="62" cy="37" r="2" fill="#1e293b"/>
    <path d="M58,46 Q62,49 66,46" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Expressive hand gesturing towards the center -->
    <path d="M75,70 Q95,65 100,75" fill="none" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="75" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Character 2 (Center/Right - Shocked/Taboo Reaction, "Shh" or tense gesture) -->
  <g transform="translate(125, 70)">
    <!-- Body & Torso -->
    <path d="M20,90 C20,70 35,60 50,60 C65,60 80,70 80,90 L80,110 L20,110 Z" fill="#ef4444"/>
    <!-- Head -->
    <circle cx="50" cy="35" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M32,32 C35,18 45,15 55,18 C68,22 68,32 68,35 C60,28 40,28 32,32 Z" fill="#475569"/>
    <!-- Shocked Face: Wide eyes, open gasping mouth -->
    <circle cx="43" cy="33" r="2.5" fill="#1e293b"/>
    <circle cx="57" cy="33" r="2.5" fill="#1e293b"/>
    <ellipse cx="50" cy="43" rx="3.5" ry="5" fill="#1e293b"/>
    <!-- Hand raised defensively / stopping gesture (Indicating 忌讳 - Taboo!) -->
    <path d="M35,65 Q25,50 30,40" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
    <!-- Palm facing forward -->
    <circle cx="30" cy="38" r="6" fill="#fbcfe8"/>
  </g>

  <!-- Character 3 (Far Right - Uncomfortable/Looking away) -->
  <g transform="translate(170, 80)">
    <!-- Body & Torso -->
    <path d="M15,80 C15,65 28,55 40,55 C52,55 65,65 65,80 L65,95 L15,95 Z" fill="#8b5cf6"/>
    <!-- Head -->
    <circle cx="40" cy="38" r="16" fill="#fbcfe8"/>
    <!-- Hair (Bob cut) -->
    <path d="M24,35 C24,22 34,18 40,18 C52,18 56,30 56,42 C50,42 30,42 24,35 Z" fill="#0f172a"/>
    <!-- Face looking down/away sideways -->
    <circle cx="33" cy="38" r="1.5" fill="#1e293b"/>
    <path d="M35,46 Q39,44 43,46" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- VISUAL CUE FOR "TABOO" (Subtle atmosphere, warning pulse above center, NO text/symbols) -->
  <g transform="translate(135, 55)" filter="url(#shadow)">
    <!-- Floating abstract tension lines / awkward silence indicator -->
    <path d="M-5,10 Q5,0 15,10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M5,15 Q15,5 25,15" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Border frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>
</svg>