<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="building-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="canvas-clip">
      <rect width="240" height="240" rx="24" fill="#1e293b"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- Background & Sky -->
    <rect width="240" height="240" fill="url(#bg-grad)"/>
    <path d="M0 0h240v170H0z" fill="url(#sky-grad)" opacity="0.3"/>

    <!-- Stars / Atmospheric lighting -->
    <circle cx="40" cy="30" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="90" cy="20" r="1.5" fill="#fde047" opacity="0.8"/>
    <circle cx="180" cy="40" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="210" cy="25" r="1.2" fill="#fff" opacity="0.7"/>

    <!-- Distant Mountains / Horizon -->
    <path d="M0 170 L40 135 L80 155 L130 120 L180 160 L240 125 L240 170 Z" fill="#1e1b4b" opacity="0.8"/>

    <!-- Grand Ancient-Modern Monumental Building (这座建筑非常宏伟) -->
    <!-- Base Platform & Stairs -->
    <polygon points="30,170 210,170 220,185 20,185" fill="#334155"/>
    <polygon points="45,155 195,155 210,170 30,170" fill="#475569"/>
    
    <!-- Plaza ground -->
    <rect x="0" y="185" width="240" height="55" fill="#0f172a"/>
    <line x1="0" y1="185" x2="240" y2="185" stroke="#64748b" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="1" opacity="0.4"/>
    <line x1="40" y1="220" x2="200" y2="220" stroke="#334155" stroke-width="1" opacity="0.4"/>

    <!-- Main Pillars (宏伟 columns) -->
    <g fill="#94a3b8">
      <rect x="55" y="80" width="10" height="75"/>
      <rect x="75" y="80" width="10" height="75"/>
      <rect x="95" y="80" width="10" height="75"/>
      <rect x="135" y="80" width="10" height="75"/>
      <rect x="155" y="80" width="10" height="75"/>
      <rect x="175" y="80" width="10" height="75"/>
    </g>

    <!-- Building Core Structure -->
    <rect x="50" y="70" width="140" height="15" fill="url(#gold-accent)"/>
    <rect x="65" y="85" width="110" height="70" fill="#1e293b"/>
    
    <!-- Glowing windows in building -->
    <g fill="#fbbf24" opacity="0.8">
      <rect x="75" y="95" width="12" height="20" rx="3"/>
      <rect x="95" y="95" width="12" height="20" rx="3"/>
      <rect x="115" y="95" width="12" height="20" rx="3"/>
      <rect x="135" y="95" width="12" height="20" rx="3"/>
      <rect x="155" y="95" width="12" height="20" rx="3"/>
      
      <rect x="75" y="125" width="12" height="20" rx="3"/>
      <rect x="95" y="125" width="12" height="20" rx="3"/>
      <rect x="115" y="125" width="12" height="20" rx="3"/>
      <rect x="135" y="125" width="12" height="20" rx="3"/>
      <rect x="155" y="125" width="12" height="20" rx="3"/>
    </g>

    <!-- Monumental Roof (Curved Traditional-Modern Fusion) -->
    <path d="M40 70 Q120 40 200 70 L210 55 Q120 20 30 55 Z" fill="url(#gold-accent)"/>
    <path d="M55 50 Q120 30 185 50 L180 42 Q120 24 60 42 Z" fill="#fef3c7" opacity="0.6"/>

    <!-- Decorative Roof Peak -->
    <circle cx="120" cy="35" r="5" fill="#f59e0b"/>
    <path d="M120 30 L120 20" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

    <!-- Ambient lighting from building -->
    <path d="M50 85 L190 85 L220 185 L20 185 Z" fill="#fbbf24" opacity="0.05" style="mix-blend-mode: screen;"/>

    <!-- Foreground Characters (Tourists/Observers admiring the grand building) -->
    <!-- Character 1 (Tourist pointing in awe) -->
    <g transform="translate(75, 175)">
      <!-- Shadow -->
      <ellipse cx="12" cy="32" rx="10" ry="3" fill="#000" opacity="0.4"/>
      <!-- Legs -->
      <rect x="8" y="18" width="4" height="15" fill="#0284c7"/>
      <rect x="14" y="18" width="4" height="15" fill="#0284c7"/>
      <!-- Torso -->
      <path d="M6 8 L18 8 L20 20 L6 20 Z" fill="#f43f5e"/>
      <!-- Head -->
      <circle cx="12" cy="4" r="5" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M7 3 Q12 -2 17 3 Z" fill="#334155"/>
      <!-- Arm pointing up & out -->
      <path d="M18 10 L28 4" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Character 2 (Tourist holding camera/tablet looking up) -->
    <g transform="translate(135, 178)">
      <!-- Shadow -->
      <ellipse cx="12" cy="30" rx="10" ry="3" fill="#000" opacity="0.4"/>
      <!-- Legs -->
      <rect x="7" y="16" width="5" height="16" fill="#334155"/>
      <rect x="14" y="16" width="5" height="16" fill="#334155"/>
      <!-- Torso -->
      <path d="M6 6 L20 6 L18 18 L8 18 Z" fill="#10b981"/>
      <!-- Head looking up -->
      <circle cx="13" cy="2" r="5" fill="#fde68a"/>
      <!-- Hair -->
      <path d="M8 0 Q13 -3 18 1 Z" fill="#78350f"/>
      <!-- Camera/Phone device held up -->
      <rect x="15" y="8" width="8" height="6" rx="1" fill="#94a3b8"/>
      <rect x="17" y="10" width="4" height="3" fill="#38bdf8"/>
      <!-- Arms -->
      <path d="M18 10 L16 14" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Foreground details: Lanterns / Trees for scale -->
    <!-- Traditional Lantern left -->
    <g transform="translate(25, 145)">
      <line x1="10" y1="0" x2="10" y2="15" stroke="#64748b" stroke-width="2"/>
      <rect x="5" y="15" width="10" height="14" rx="3" fill="#ef4444"/>
      <path d="M5 19 L15 19 M5 25 L15 25" stroke="#fef08a" stroke-width="1.5"/>
      <path d="M10 29 L10 35" stroke="#fef08a" stroke-width="2"/>
    </g>
    <!-- Traditional Lantern right -->
    <g transform="translate(205, 145)">
      <line x1="10" y1="0" x2="10" y2="15" stroke="#64748b" stroke-width="2"/>
      <rect x="5" y="15" width="10" height="14" rx="3" fill="#ef4444"/>
      <path d="M5 19 L15 19 M5 25 L15 25" stroke="#fef08a" stroke-width="1.5"/>
      <path d="M10 29 L10 35" stroke="#fef08a" stroke-width="2"/>
    </g>

    <!-- Subtle framing border -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
  </g>
</svg>