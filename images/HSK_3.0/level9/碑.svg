<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glowing aura & ground plane -->
  <ellipse cx="120" cy="200" rx="70" ry="12" fill="#111318"/>
  <path d="M70 200 L170 200" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Monument Base / Multi-tiered Platform -->
  <!-- Bottom tier -->
  <path d="M50 200 L190 200 L180 188 L60 188 Z" fill="#2E3646"/>
  <rect x="50" y="198" width="140" height="3" fill="#3E485D"/>
  
  <!-- Middle tier -->
  <path d="M68 188 L172 188 L166 176 L74 176 Z" fill="#374152"/>
  <rect x="68" y="186" width="104" height="2" fill="#4B5563"/>

  <!-- Upper platform / pedestal -->
  <path d="M82 176 L158 176 L154 166 L86 166 Z" fill="#4B5563"/>

  <!-- Main Stone Stele (碑) Body -->
  <path d="M92 60 C92 50 148 50 148 60 L148 166 L92 166 Z" fill="#5C6B82"/>
  
  <!-- Stele Cap (Traditional curved roof / ornamentation) -->
  <path d="M88 64 C88 44 152 44 152 64 Z" fill="#D4AF37"/>
  <rect x="90" y="62" width="60" height="4" fill="#F39C12"/>

  <!-- Inscription / Relief details on Stele (Golden glowing accents representing heroes/history) -->
  <line x1="120" y1="80" x2="120" y2="130" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="95" x2="130" y2="95" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="110" x2="132" y2="110" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="125" x2="128" y2="125" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>

  <!-- Atmospheric Lighting / Focus Glow -->
  <path d="M120 30 L100 170 L140 170 Z" fill="#F39C12" opacity="0.05" style="mix-blend-mode: screen;"/>
</svg>