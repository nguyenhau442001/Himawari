<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing/Floating Memory Effect (Background Radiance) -->
  <circle cx="120" cy="110" r="60" fill="#38BDF8" opacity="0.08"/>
  <circle cx="120" cy="110" r="40" fill="#38BDF8" opacity="0.12"/>

  <!-- Open Vintage Photo Album (Base / Context) -->
  <g transform="translate(120, 155)">
    <!-- Album Cover / Base -->
    <path d="M-75 15 L-5 25 L65 15 L75 -5 L5 -15 L-65 -5 Z" fill="#2D3748"/>
    <!-- Left Page -->
    <path d="M-70 -10 L-5 -20 L-5 15 L-70 20 Z" fill="#EDF2F7"/>
    <!-- Right Page -->
    <path d="M5 -20 L70 -10 L70 20 L5 15 Z" fill="#EDF2F7"/>
    <!-- Book Spine center shadow -->
    <line x1="-5" y1="-20" x2="-5" y2="15" stroke="#CBD5E0" stroke-width="2"/>
    <!-- Photo placeholder on left page -->
    <rect x="-55" y="-10" width="40" height="20" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- The Emerging Memory (浮现 - Fúxiàn): Iconic physical representation of a childhood memory floating upward, luminous and vivid -->
  <g transform="translate(120, 95)">
    <!-- Glowing Aura behind the emerging memory -->
    <ellipse cx="0" cy="5" r="38" fill="#1E293B" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    
    <!-- Floating Frame (Polaroid style emerging from album) -->
    <rect x="-32" y="-36" width="64" height="72" rx="4" fill="#F8FAFC" filter="drop-shadow(0px 8px 16px rgba(56, 189, 248, 0.3))"/>
    
    <!-- Picture Content Inside Frame: Childhood Scene (Child playing with kite/windmill or running) -->
    <rect x="-24" y="-28" width="48" height="48" rx="2" fill="#E0F2FE"/>
    
    <!-- Simplified warm scene: Sun & Childhood silhouette / elements -->
    <circle cx="12" cy="-12" r="8" fill="#FBBF24"/> <!-- Sun -->
    <!-- Green hills -->
    <path d="M-24 20 Q-5 5 12 20 Q20 25 24 20 L24 20 L-24 20 Z" fill="#34D399"/>
    <!-- Simple child figure running with kite -->
    <circle cx="-6" cy="2" r="3.5" fill="#1E293B"/> <!-- Head -->
    <path d="M-6 5 L-8 14 M-6 5 L-3 12 M-9 8 L-3 8" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/> <!-- Body & limbs -->
    <!-- Kite flying high -->
    <path d="M-6 5 Q2 -5 16 -12" stroke="#94A3B8" stroke-width="1" fill="none" stroke-dasharray="2 2"/>
    <polygon points="16,-16 20,-12 16,-8 12,-12" fill="#F43F5E"/>
  </g>

  <!-- Upward motion / Emergence effects (Subtle luminous particles/rings) -->
  <g stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M90 55 C90 45 95 40 100 35" />
    <path d="M150 55 C150 45 145 40 140 35" />
  </g>
  
  <circle cx="100" cy="30" r="2.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="140" cy="30" r="2" fill="#FBBF24" opacity="0.9"/>
  <circle cx="120" cy="22" r="3" fill="#38BDF8" opacity="0.7"/>

  <!-- Focus / Clarity Accent Sparkles -->
  <path d="M175 75 L178 85 L188 88 L178 91 L175 101 L172 91 L162 88 L172 85 Z" fill="#FBBF24" opacity="0.85"/>
  <path d="M65 110 L67 115 L72 117 L67 119 L65 124 L63 119 L58 117 L63 115 Z" fill="#38BDF8" opacity="0.7"/>
</svg>