<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character 1 (Annoyed/Refusing) Skin & Clothes -->
    <linearGradient id="shirtGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Inconsiderate) Skin & Clothes -->
    <linearGradient id="shirtGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Soft lighting glow for focus -->
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Interior Wall & Cafe/Office Environment Context -->
  <!-- Back wall paneling / window -->
  <path d="M20 20 H220 V170 H20 Z" fill="#1e293b" />
  <!-- Window frame showing night city blur outside -->
  <rect x="140" y="35" width="65" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M155 45 L175 75 L165 95" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none" />
  <circle cx="185" cy="55" r="3" fill="#fbbf24" opacity="0.6" />
  <circle cx="150" cy="100" r="2" fill="#ec4899" opacity="0.6" />

  <!-- Floor -->
  <path d="M0 170 H240 V240 H0 Z" fill="#090d16" />
  <!-- Floor line perspective -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2" />

  <!-- Table / Desk Object -->
  <rect x="15" y="145" width="210" height="30" rx="4" fill="#334155" />
  <rect x="25" y="175" width="12" height="50" rx="2" fill="#1e293b" />
  <rect x="203" y="175" width="12" height="50" rx="2" fill="#1e293b" />
  <!-- Table props: Coffee cup, smartphone -->
  <rect x="120" y="132" width="16" height="15" rx="3" fill="#cbd5e1" />
  <path d="M136 136 c4 0 4 8 0 8" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Phone on table -->
  <rect x="90" y="137" width="18" height="10" rx="2" transform="rotate(-15 90 137)" fill="#475569" />

  <!-- Ambient spotlight over characters -->
  <circle cx="120" cy="120" r="100" fill="url(#spotlight)" />

  <!-- CHARACTER 2: The Inconsiderate Behavior Subject (e.g., talking loudly / chewing with open mouth / putting feet up) -->
  <g transform="translate(150, 85)">
    <!-- Body / Torso -->
    <path d="M 15 45 Q 25 35 35 45 L 45 90 L -5 90 Z" fill="url(#shirtGrad2)" />
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="16" fill="#fbcfe8" />
    <path d="M 5 15 Q 10 -2 30 10 Q 35 25 25 25 Z" fill="#451a03" />
    <!-- Face expression: Oblivious / Smiling broadly while doing something annoying -->
    <circle cx="25" cy="18" r="2" fill="#1e293b" />
    <path d="M 22 24 Q 26 28 30 24" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Action prop: Holding a bag of chips or making a loud gesture -->
    <path d="M 35 55 L 50 40 L 45 30 L 30 45 Z" fill="#facc15" />
  </g>

  <!-- CHARACTER 1: The Main Subject Experiencing "反感" (Disgust/Strong Disapproval) -->
  <g transform="translate(35, 75)">
    <!-- Backrest of chair -->
    <rect x="-15" y="10" width="15" height="95" rx="4" fill="#475569" />

    <!-- Body leaning back sharply in rejection -->
    <path d="M 0 50 Q 20 40 10 95 L -35 95 L -15 50 Z" fill="url(#shirtGrad1)" />

    <!-- Head & Hair (Leaning back, chin tilted up, eyes narrowed in disgust) -->
    <circle cx="0" cy="22" r="17" fill="#fbcfe8" />
    <path d="M -15 15 Q -5 -2 15 10 Q 15 25 5 25 Z" fill="#1e293b" />

    <!-- Facial Expression: Disgusted, eyes squinted, mouth downturned -->
    <!-- Eyebrows furrowed down sharply -->
    <line x1="-6" y1="16" x2="-2" y2="18" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="2" y1="18" x2="6" y2="16" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Squinted eyes (horizontal dashes) -->
    <line x1="-6" y1="21" x2="-2" y2="21" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="2" y1="21" x2="6" y2="21" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Mouth pinched/downturned in aversion -->
    <path d="M -3 30 Q 0 27 4 30" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Arm 1: Hand up in a clear "stop / pulling away" gesture -->
    <path d="M -10 55 L -30 40 L -35 48 L -15 65" fill="url(#shirtGrad1)" />
    <!-- Hand -->
    <circle cx="-33" cy="44" r="5" fill="#fbcfe8" />
    <!-- Palm facing out (Stop gesture) -->
    <path d="M -38 42 L -34 38 L -30 43" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arm 2: Gripping chair armrest tightly -->
    <path d="M 5 60 L 25 70 L 25 78 L 0 68 Z" fill="url(#shirtGrad1)" />
  </g>

  <!-- Visual Accent / Emotion Waves (Conveying strong aversion/repulsion without text) -->
  <!-- Subtle warning / rejection symbols styled cleanly -->
  <g transform="translate(75, 55)" opacity="0.8">
    <path d="M 0 10 L 10 0 M 0 0 L 10 10" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <g transform="translate(100, 45)" opacity="0.6">
    <path d="M 0 8 L 8 0 M 0 0 L 8 8" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Ground Shadow under characters -->
  <ellipse cx="50" cy="172" rx="35" ry="6" fill="#020617" opacity="0.5" />
  <ellipse cx="170" cy="172" rx="30" ry="6" fill="#020617" opacity="0.5" />
</svg>