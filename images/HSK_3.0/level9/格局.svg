<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- UI Hologram Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Modern Office Interior Backdrop -->
  <!-- Window Grid showing skyline outside -->
  <g opacity="0.4">
    <line x1="20" y1="50" x2="100" y2="50" stroke="#475569" stroke-width="1" />
    <line x1="20" y1="90" x2="100" y2="90" stroke="#475569" stroke-width="1" />
    <line x1="60" y1="20" x2="60" y2="120" stroke="#475569" stroke-width="1" />
    <!-- City silhouette in background -->
    <polygon points="20,120 20,95 30,90 35,120" fill="#334155" />
    <polygon points="40,120 40,75 55,70 55,120" fill="#334155" />
    <polygon points="65,120 65,85 85,80 85,120" fill="#334155" />
  </g>

  <!-- Office Desk -->
  <path d="M 10 185 L 230 185 L 220 210 L 20 210 Z" fill="#334155" />
  <rect x="30" y="210" width="180" height="8" rx="2" fill="#1e293b" />

  <!-- Holographic Market Structure (Cục diện thị trường đang thay đổi) -->
  <!-- Hologram Base Projector -->
  <ellipse cx="150" cy="185" rx="35" ry="8" fill="#475569" />
  <ellipse cx="150" cy="185" rx="25" ry="5" fill="#38bdf8" filter="url(#neon-glow)" />

  <!-- Hologram Cone Projection Area -->
  <polygon points="150,110 120,185 180,185" fill="url(#holo-grad)" />

  <!-- Shifting Network Nodes & Arrows (Representing changing market structure) -->
  <!-- Old/Fading Structure (Orange/Red muted) -->
  <g opacity="0.4">
    <circle cx="130" cy="150" r="4" fill="#fb923c" />
    <circle cx="170" cy="140" r="4" fill="#fb923c" />
    <circle cx="150" cy="170" r="4" fill="#fb923c" />
    <line x1="130" y1="150" x2="170" y2="140" stroke="#fb923c" stroke-dasharray="2 2" stroke-width="1.5" />
    <line x1="130" y1="150" x2="150" y2="170" stroke="#fb923c" stroke-dasharray="2 2" stroke-width="1.5" />
  </g>

  <!-- New Dynamic Structure (Bright Green & Blue with motion arrows) -->
  <g filter="url(#neon-glow)">
    <!-- Nodes -->
    <circle cx="135" cy="130" r="5" fill="#38bdf8" />
    <circle cx="165" cy="125" r="6" fill="#10b981" />
    <circle cx="155" cy="155" r="5" fill="#38bdf8" />
    <circle cx="125" cy="160" r="4" fill="#10b981" />

    <!-- Connecting Edges -->
    <line x1="135" y1="130" x2="165" y2="125" stroke="#38bdf8" stroke-width="2" />
    <line x1="165" y1="125" x2="155" y2="155" stroke="#10b981" stroke-width="2" />
    <line x1="155" y1="155" x2="125" y2="160" stroke="#38bdf8" stroke-width="2" />
    <line x1="125" y1="160" x2="135" y2="130" stroke="#10b981" stroke-width="2" />

    <!-- Dynamic Transforming Arrows -->
    <path d="M 130 140 Q 145 125 158 135" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2" />
    <polygon points="158,135 153,132 154,138" fill="#fbbf24" />

    <path d="M 160 145 Q 145 165 138 152" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2" />
    <polygon points="138,152 143,153 141,148" fill="#fbbf24" />
  </g>

  <!-- Secondary Prop: Tablet on Desk -->
  <g transform="translate(65, 170) rotate(-10)">
    <rect x="0" y="0" width="30" height="20" rx="2" fill="#64748b" />
    <rect x="3" y="3" width="24" height="14" rx="1" fill="#0f172a" />
    <!-- Mini trend graph inside tablet -->
    <polyline points="5,14 10,10 15,12 22,6" fill="none" stroke="#10b981" stroke-width="1.5" />
  </g>

  <!-- CHARACTER: Business Analyst/Strategist -->
  <!-- Body/Torso (Sitting behind desk) -->
  <path d="M 60 210 L 65 155 C 65 145, 75 140, 85 140 L 105 140 C 115 140, 125 145, 125 155 L 130 210 Z" fill="#2563eb" /> <!-- Blue Suit Jacket -->
  <!-- Inner Shirt & Tie -->
  <polygon points="85,140 105,140 95,165" fill="#f8fafc" />
  <polygon points="93,150 97,150 96,175 94,175" fill="#ef4444" /> <!-- Red Tie -->

  <!-- Neck -->
  <rect x="88" y="128" width="14" height="15" fill="#fbcfe8" />

  <!-- Head & Face -->
  <circle cx="95" cy="115" r="18" fill="#fbcfe8" />
  
  <!-- Hair (Stylish dark slate) -->
  <path d="M 77 115 C 77 100, 85 95, 95 95 C 105 95, 113 100, 113 115 C 113 115, 110 105, 95 105 C 80 105, 77 115, 77 115 Z" fill="#1e293b" />

  <!-- Expressive Facial Features (Thoughtful, observing change) -->
  <!-- Eyebrows (Concentrated) -->
  <line x1="86" y1="110" x2="92" y2="112" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <line x1="98" y1="112" x2="104" y2="110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes (Looking forward towards the hologram) -->
  <circle cx="89" y="116" r="2" fill="#1e293b" />
  <circle cx="101" y="116" r="2" fill="#1e293b" />
  <!-- Glasses -->
  <rect x="85" y="112" width="9" height="7" rx="1" fill="none" stroke="#475569" stroke-width="1" />
  <rect x="96" y="112" width="9" height="7" rx="1" fill="none" stroke="#475569" stroke-width="1" />
  <line x1="94" y1="115" x2="96" y2="115" stroke="#475569" stroke-width="1" />
  <!-- Confident/Intriguied Mouth -->
  <path d="M 92 124 Q 95 127 98 124" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms & Hands Interacting -->
  <!-- Left Arm (Resting on table) -->
  <path d="M 68 160 L 50 185 L 75 190" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="75" cy="190" r="6" fill="#fbcfe8" /> <!-- Hand -->

  <!-- Right Arm (Gesturing towards hologram) -->
  <path d="M 115 155 C 125 155, 130 170, 135 175" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
  <!-- Pointing Hand -->
  <circle cx="138" cy="177" r="5" fill="#fbcfe8" />
  <path d="M 138 177 L 146 174" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" />

  <!-- Ambient lighting highlights -->
  <circle cx="150" cy="80" r="1" fill="#38bdf8" opacity="0.6" />
  <circle cx="180" cy="95" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="30" cy="70" r="1" fill="#38bdf8" opacity="0.5" />
</svg>