<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Radar / Grid Elements for Market Trend Context -->
  <circle cx="120" cy="120" r="75" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="50" fill="none" stroke="#2A2F3D" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="25" fill="none" stroke="#2A2F3D" stroke-width="1.5"/>
  <line x1="120" y1="35" x2="120" y2="205" stroke="#2A2F3D" stroke-width="1"/>
  <line x1="35" y1="120" x2="205" y2="120" stroke="#2A2F3D" stroke-width="1"/>

  <!-- Dynamic Trend Vector / Path (Representing Movement and Direction - 动向) -->
  <path d="M 65 155 Q 95 130, 120 100 T 175 60" fill="none" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>
  <path d="M 65 155 Q 95 130, 120 100 T 175 60 L 175 90 M 175 60 L 145 60" fill="none" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Physical Object: Compass / Lens / Direction Finder (Noun representation of observing trends) -->
  <circle cx="120" cy="120" r="38" fill="#222733" stroke="#FF9F43" stroke-width="3"/>
  <circle cx="120" cy="120" r="30" fill="#1A1D24"/>
  
  <!-- Compass Needle pointing dynamically up-right -->
  <polygon points="120,95 127,120 120,120" fill="#FF9F43"/>
  <polygon points="120,145 113,120 120,120" fill="#4A5568"/>
  <circle cx="120" cy="120" r="4" fill="#FF9F43"/>

  <!-- Focus Data Points (Tracking Movement/Changes) -->
  <circle cx="75" cy="140" r="5" fill="#4CD137"/>
  <circle cx="105" cy="115" r="5" fill="#4CD137"/>
  <circle cx="155" cy="75" r="6" fill="#FF9F43"/>
  
  <!-- Radar sweep highlight -->
  <path d="M 120 120 L 165 75 A 65 65 0 0 0 120 55 Z" fill="#FF9F43" opacity="0.1"/>
</svg>