<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="170" width="180" height="50" fill="#1e293b" opacity="0.5"/>
  
  <!-- Documents/Achievements -->
  <rect x="50" y="120" width="60" height="40" rx="2" fill="#f59e0b"/>
  <path d="M55 130h50M55 140h50M55 150h30" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character 1 (The one defending) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40c0-15 10-20 15-20s15 5 15 20" fill="#fb923c"/>
    <path d="M10 35l-10 20M30 35l10 20" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
    <path d="M15 25h10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (The one trying to erase/dismiss) -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <path d="M5 40c0-15 10-20 15-20s15 5 15 20" fill="#38bdf8"/>
    <path d="M20 35l-5 25M20 35l5 25" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
    <path d="M12 28h16" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Eraser/Action Prop -->
  <rect x="80" y="110" width="20" height="10" rx="1" fill="#ec4899"/>
  <path d="M90 110l-10-20" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stop Gesture -->
  <circle cx="140" cy="90" r="12" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4 4"/>
  <rect x="138" y="85" width="4" height="10" rx="1" fill="#f59e0b"/>
