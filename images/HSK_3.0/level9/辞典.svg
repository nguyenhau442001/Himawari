<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Shadow for depth -->
    <ellipse cx="0" cy="72" rx="70" ry="10" fill="#0E1014" opacity="0.6"/>
    
    <!-- Dictionary Book Body (Open / Thick) -->
    <!-- Back cover / pages block -->
    <path d="M-72 30 C-72 30 -40 45 0 40 C40 45 72 30 72 30 L72 -36 C72 -36 40 -21 0 -26 C-40 -21 -72 -36 -72 -36 Z" fill="#2A303C"/>
    
    <!-- Pages side (thickness) -->
    <path d="M-68 34 C-68 34 -38 48 0 43 C38 48 68 34 68 46 C68 46 38 60 0 55 C-38 60 -68 46 -68 46 Z" fill="#D2D6DC"/>
    
    <!-- Left Cover -->
    <path d="M-72 -36 C-72 -36 -40 -21 0 -26 L0 40 C-40 45 -72 30 -72 30 Z" fill="#2563EB"/>
    <!-- Right Cover -->
    <path d="M72 -36 C72 -36 40 -21 0 -26 L0 40 C40 45 72 30 72 30 Z" fill="#1D4ED8"/>
    
    <!-- Spine reinforcement/shadow in middle -->
    <path d="M-4 -26 L4 -26 L4 40 L-4 40 Z" fill="#1E2530" opacity="0.5"/>

    <!-- Gold Foil Details on Covers -->
    <!-- Left cover border & emblem -->
    <path d="M-60 -28 L-12 -22 L-12 32 L-60 26 Z" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="-36" cy="2" r="8" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Right cover border & emblem -->
    <path d="M60 -28 L12 -22 L12 32 L60 26 Z" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="36" cy="2" r="8" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Spine details (visible at bottom/top edges if needed, stylized clean) -->
    <rect x="-3" y="-30" width="6" height="4" fill="#FBBF24" rx="1"/>

    <!-- Bookmark Ribbon hanging down -->
    <path d="M 0 -26 C 0 -26 15 10 25 55 L 15 62 L 5 50 Z" fill="#EF4444"/>

    <!-- Magnifying Glass hovering over the dictionary (Focus on definition) -->
    <g transform="translate(18, -15)">
      <!-- Glass shadow -->
      <circle cx="4" cy="4" r="30" fill="#000000" opacity="0.3"/>
      
      <!-- Lens Outer Rim -->
      <circle cx="0" cy="0" r="30" fill="#1E293B" stroke="#FBBF24" stroke-width="4"/>
      
      <!-- Lens Glass & Reflection -->
      <circle cx="0" cy="0" r="26" fill="#38BDF8" fill-opacity="0.2"/>
      <path d="M-16 -12 C-8 -20 8 -20 16 -12 C10 -18 -10 -18 -16 -12 Z" fill="#FFFFFF" fill-opacity="0.4"/>
      
      <!-- Abstract text lines inside lens (representing definitions) -->
      <rect x="-14" y="-8" width="20" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="-14" y="-1" width="28" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.7"/>
      <rect x="-14" y="6" width="16" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.8"/>

      <!-- Magnifying Glass Handle -->
      <path d="M21 21 L42 42" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
      <path d="M21 21 L42 42" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>