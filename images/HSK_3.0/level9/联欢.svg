  <rect x="50" y="175" width="10" height="50" fill="#334155"/>
  <rect x="180" y="175" width="10" height="50" fill="#334155"/>
  
  <!-- Food/Props -->
  <circle cx="80" cy="155" r="12" fill="#f59e0b"/>
  <rect x="110" y="145" width="25" height="15" rx="2" fill="#ef4444"/>
  <circle cx="160" cy="150" r="10" fill="#10b981"/>
  
  <!-- Characters -->
  <!-- Person 1 -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
