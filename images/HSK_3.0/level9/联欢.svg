    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35 Q20 45 30 35" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="5" y="50" width="30" height="50" rx="5" fill="#fb923c"/>
  </g>
  
  <!-- Confetti/Atmosphere -->
  <circle cx="50" cy="80" r="2" fill="#f59e0b"/>
  <circle cx="190" cy="90" r="2" fill="#38bdf8"/>
