  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Decorations -->
  <path d="M40 20 L40 60 M200 20 L200 60" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="40" cy="70" r="6" fill="#ec4899"/>
