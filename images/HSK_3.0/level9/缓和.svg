<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Room Background Details -->
  <!-- Window showing calming dusk sky (symbolizing easing relations) -->
  <path d="M70 30 H170 V110 H70 Z" fill="#1b2a4a" stroke="#334155" stroke-width="2" rx="4"/>
  <!-- Dusk / warm horizon gradient through window -->
  <path d="M72 75 Q120 60 168 75 V108 H72 Z" fill="#1e1b4b" opacity="0.6"/>
  <!-- Gentle moon / calm light -->
  <circle cx="120" cy="55" r="10" fill="#fbbf24" opacity="0.3" filter="url(#soft-glow)"/>

  <!-- Wall panelling / interior lines -->
  <line x1="20" y1="130" x2="220" y2="130" stroke="#334155" stroke-width="1.5" opacity="0.4"/>

  <!-- Conference Table representing formal diplomatic/business meeting -->
  <path d="M30 180 L70 140 H170 L210 180 Z" fill="url(#table-grad)" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="120" cy="160" rx="50" ry="12" fill="#0f172a" opacity="0.7"/>

  <!-- Centerpiece: Warm glowing lamp / peace plant on table -->
  <path d="M115 145 H125 L122 135 H118 Z" fill="#64748b"/>
  <circle cx="120" cy="130" r="8" fill="#fbbf24" opacity="0.9" filter="url(#soft-glow)"/>
  <path d="M105 155 Q120 140 135 155" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Character Left (Delegate A - relaxing posture, hand open, smiling slightly) -->
  <g transform="translate(45, 100)">
    <!-- Body / Suit -->
    <path d="M25 60 L10 80 H45 L35 60 Z" fill="#1e3a8a"/>
    <path d="M22 60 L30 75 L38 60 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="28" cy="40" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M15 38 C15 25 40 25 41 38 C38 34 18 34 15 38 Z" fill="#1e293b"/>
    <!-- Relaxed Arm / Hand open toward center -->
    <path d="M15 65 Q5 70 12 78" fill="none" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="13" cy="79" r="3.5" fill="#fed7aa"/>
  </g>

  <!-- Character Right (Delegate B - matching posture, tension easing) -->
  <g transform="translate(150, 100)">
    <!-- Body / Suit -->
    <path d="M15 60 L30 80 H-5 L5 60 Z" fill="#065f46"/>
    <path d="M18 60 L10 75 L2 60 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="12" cy="40" r="14" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M0 38 C0 25 25 25 27 38 C24 34 4 34 0 38 Z" fill="#334155"/>
    <!-- Relaxed Arm / Hand open toward center -->
    <path d="M25 65 Q35 70 28 78" fill="none" stroke="#065f46" stroke-width="6" stroke-linecap="round"/>
    <circle cx="27" cy="79" r="3.5" fill="#ffedd5"/>
  </g>

  <!-- Visual Metaphor for "缓和" (Easing / Warmth / Harmony spreading between them) -->
  <!-- Gentle warm flowing wave / aura connecting both sides above table -->
  <path d="M70 115 Q120 95 170 115" fill="none" stroke="url(#glow-grad)" stroke-width="12" stroke-linecap="round" filter="url(#soft-glow)"/>
  <path d="M85 120 Q120 105 155 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating soft glowing peaceful sparkles / dots -->
  <circle cx="100" cy="110" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="140" cy="110" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="120" cy="100" r="3" fill="#38bdf8" opacity="0.9" filter="url(#soft-glow)"/>
</svg>