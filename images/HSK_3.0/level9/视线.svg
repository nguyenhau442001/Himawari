<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Eye symbol representing 'sight/gaze' -->
    <path d="M -50 0 C -25 -30, 25 -30, 50 0 C 25 30, -25 30, -50 0 Z" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="0" cy="0" r="7" fill="#F59E0B"/>

    <!-- Fog layers obscuring the vision (reference: 浓雾遮住了大家的视线) -->
    <path d="M -75 -15 Q -55 -25, -35 -15 Q -15 -5, 5 -15 Q 25 -25, 45 -15 Q 65 -5, 75 -15" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M -65 15 Q -45 5, -25 15 Q -5 25, 15 15 Q 35 5, 55 15 Q 75 25, 65 30" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- Focused light beam / line of sight getting interrupted -->
    <path d="M 0 18 L 0 65" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4,4" opacity="0.8"/>
  </g>
</svg>