<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/accent representing language/thought connection fading -->
  <circle cx="120" cy="120" r="70" fill="#242833" opacity="0.6"/>

  <!-- Central Iconic Object: An old-fashioned fountain pen / speech bubble merging with dust/breakup particles, representing rusty skills / language loss -->
  <g transform="translate(120, 110)">
    <!-- Fading connection waves / speech lines -->
    <path d="M-55,-10 C-55,-35 -30,-50 0,-50 C30,-50 55,-35 55,-10" fill="none" stroke="#3A3F4D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
    <path d="M-40,-5 C-40,-22 -22,-35 0,-35 C22,-35 40,-22 40,-5" fill="none" stroke="#4F566B" stroke-width="3" stroke-linecap="round"/>

    <!-- Main Tool (Pen / Language Symbol) held at an angle -->
    <g transform="rotate(-30)">
      <!-- Pen Body -->
      <rect x="-12" y="-45" width="24" height="65" rx="4" fill="#E67E22"/>
      <rect x="-8" y="-45" width="16" height="65" fill="#F39C12"/>
      
      <!-- Pen Grip -->
      <rect x="-12" y="10" width="24" height="20" fill="#D35400"/>
      <line x1="-12" y1="15" x2="12" y2="15" stroke="#B94A00" stroke-width="2"/>
      <line x1="-12" y1="22" x2="12" y2="22" stroke="#B94A00" stroke-width="2"/>

      <!-- Pen Nib -->
      <path d="M-12,30 L0,55 L12,30 Z" fill="#BDC3C7"/>
      <path d="M0,30 L0,50" stroke="#7F8C8D" stroke-width="2"/>
      <circle cx="0" cy="38" r="2" fill="#7F8C8D"/>
      
      <!-- Clip -->
      <rect x="-3" y="-35" width="6" height="30" rx="2" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- "Rust" / Disconnection particles floating away (representing "生疏" - unpracticed / rusty) -->
    <g fill="#E67E22" opacity="0.9">
      <circle cx="55" cy="-20" r="4"/>
      <circle cx="70" cy="-5" r="3"/>
      <circle cx="60" cy="15" r="5"/>
      <circle cx="75" cy="30" r="2"/>
    </g>
    <g fill="#F39C12" opacity="0.6">
      <circle cx="45" cy="-40" r="2.5"/>
      <circle cx="68" cy="8" r="3.5"/>
    </g>
    
    <!-- Cobweb / Rust overlay lines on the tool to signify lack of use -->
    <path d="M 25,10 L 45,25" stroke="#4F566B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 32,5 L 50,15" stroke="#4F566B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Focus Base / Ground shadow -->
  <ellipse cx="120" cy="190" rx="50" ry="8" fill="#13151A"/>
</svg>