<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background distant snowy mountains and cold night sky -->
  <path d="M0 160 L60 110 L120 145 L180 95 L240 135 L240 240 L0 240 Z" fill="#242A38"/>
  <path d="M30 140 L90 85 L160 130 L210 90 L240 115 L240 240 L0 240 Z" fill="#2E374A"/>
  
  <!-- Snowflakes in background -->
  <g fill="#7A99BB" opacity="0.6">
    <circle cx="45" cy="50" r="1.5"/>
    <circle cx="85" cy="35" r="2"/>
    <circle cx="150" cy="45" r="1.5"/>
    <circle cx="195" cy="65" r="2.5"/>
    <circle cx="215" cy="30" r="1.5"/>
    <circle cx="25" cy="95" r="2"/>
  </g>

  <!-- Foreground snow ground with deep drifts -->
  <path d="M0 180 C40 170, 90 190, 140 175 C190 160, 220 185, 240 175 L240 240 L0 240 Z" fill="#D2E3FC"/>
  <path d="M0 195 C60 185, 130 205, 240 185 L240 240 L0 240 Z" fill="#E8F0FE"/>

  <!-- Border Guard Character (Focus: Noun - Physical character in extreme cold) -->
  <g transform="translate(115, 110)">
    <!-- Backpack/Gear -->
    <rect x="-14" y="10" width="28" height="35" rx="6" fill="#1B3B2B"/>
    <rect x="-10" y="15" width="20" height="25" rx="4" fill="#234E38"/>
    
    <!-- Body with heavy winter coat -->
    <path d="M-18 15 L18 15 L22 55 L-22 55 Z" fill="#2E5A44"/>
    <!-- Coat collar / fur lining -->
    <path d="M-15 15 L15 15 L12 25 L-12 25 Z" fill="#F1F3F4"/>
    
    <!-- Belt -->
    <rect x="-20" y="42" width="40" height="5" fill="#1A1D24"/>
    <rect x="-4" y="41" width="8" height="7" fill="#F4B400"/>

    <!-- Head & Ushanka Winter Hat (characteristic for extreme cold) -->
    <!-- Earflaps down -->
    <path d="M-13 -5 C-13 -15, 13 -15, 13 -5 L15 12 L10 15 L-10 15 L-15 12 Z" fill="#1B3B2B"/>
    <!-- Hat crown -->
    <ellipse cx="0" cy="-6" rx="11" ry="9" fill="#234E38"/>
    <!-- Front fur badge -->
    <path d="M-6 -2 L6 -2 L4 4 L-4 4 Z" fill="#F1F3F4"/>
    <circle cx="0" cy="1" r="1.5" fill="#C5221F"/> <!-- Red star badge -->

    <!-- Face (masked/goggled against wind) -->
    <rect x="-8" y="2" width="16" height="8" rx="3" fill="#1A1D24"/>
    <rect x="-6" y="4" width="5" height="4" rx="1" fill="#8AB4F8" opacity="0.8"/>
    <rect x="1" y="4" width="5" height="4" rx="1" fill="#8AB4F8" opacity="0.8"/>

    <!-- Arms holding rifle / walking -->
    <rect x="-26" y="20" width="10" height="25" rx="4" fill="#2E5A44" transform="rotate(15)"/>
    <rect x="18" y="20" width="10" height="25" rx="4" fill="#2E5A44" transform="rotate(-15)"/>

    <!-- Rifle slung / held -->
    <line x1="-22" y1="12" x2="18" y2="52" stroke="#5F6368" stroke-width="3" stroke-linecap="round"/>
    <rect x="-3" y="28" width="8" height="3" fill="#BDC1C6"/>
  </g>

  <!-- Snow-covered Pine Tree on the side -->
  <g transform="translate(45, 125)">
    <!-- Tree trunk -->
    <rect x="-3" y="30" width="6" height="25" fill="#3C4043"/>
    <!-- Foliage layers covered in heavy snow -->
    <path d="M0 -25 L25 10 L-25 10 Z" fill="#13513B"/>
    <path d="M-22 5 C-10 2, 10 2, 22 5 C15 -2, -15 -2, -22 5 Z" fill="#E8F0FE"/> <!-- Snow cap -->
    
    <path d="M0 -10 L30 25 L-30 25 Z" fill="#13513B"/>
    <path d="M-27 20 C-12 16, 12 16, 27 20 C18 11, -18 11, -27 20 Z" fill="#E8F0FE"/> <!-- Snow cap -->

    <path d="M0 5 L35 45 L-35 45 Z" fill="#13513B"/>
    <path d="M-32 40 C-15 34, 15 34, 32 40 C20 28, -20 28, -32 40 Z" fill="#E8F0FE"/> <!-- Snow cap -->
  </g>

  <!-- Large foreground snowflakes (emphasizing the heavy snow) -->
  <g fill="#FFFFFF">
    <path d="M200 45 L204 55 L214 59 L204 63 L200 73 L196 63 L186 59 L196 55 Z" opacity="0.9"/>
    <path d="M70 95 L72 100 L77 102 L72 104 L70 109 L68 104 L63 102 L68 100 Z" opacity="0.7"/>
    <path d="M150 115 L152 119 L156 121 L152 123 L150 127 L148 123 L144 121 L148 119 Z" opacity="0.8"/>
  </g>

</svg>