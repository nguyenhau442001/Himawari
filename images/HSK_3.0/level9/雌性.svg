<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow to highlight subject -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Contextual reference visualization: A sleek, modern flat vector representation of a female bird (雌性) with modest, protective plumage as referenced in the prompt. -->
  <g transform="translate(0, 5)">
    <!-- Perch branch -->
    <path d="M 60 170 Q 120 160 180 175" stroke="#3E4959" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 140 167 L 155 152" stroke="#3E4959" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Bird Body (Female - Muted, earthy, sleek camouflage tones matching context: "羽毛朴素隐蔽") -->
    <!-- Tail feathers -->
    <path d="M 70 140 Q 50 145 45 130 Q 60 135 75 138" fill="#788697"/>
    
    <!-- Main Body / Torso -->
    <ellipse cx="115" cy="125" rx="36" ry="26" fill="#9BA8B7"/>
    
    <!-- Wing overlay with subtle camouflage feather patterns -->
    <path d="M 90 115 Q 120 110 135 130 Q 115 142 95 130 Z" fill="#788697"/>
    <path d="M 100 120 Q 115 118 125 128" stroke="#5C6B7B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 105 125 Q 115 123 120 133" stroke="#5C6B7B" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Underbelly (softer, natural tone) -->
    <path d="M 90 138 Q 115 151 135 135 Q 120 142 95 138 Z" fill="#B4C2D0"/>

    <!-- Head -->
    <circle cx="148" cy="100" r="18" fill="#9BA8B7"/>

    <!-- Eye (calm, alert, observant) -->
    <circle cx="153" cy="97" r="2.5" fill="#1A1D24"/>
    <circle cx="154" cy="96" r="1" fill="#FFFFFF"/>

    <!-- Beak (modest, short) -->
    <path d="M 164 99 L 174 102 L 164 105 Z" fill="#D48C46"/>

    <!-- Feet gripping branch -->
    <path d="M 105 150 L 105 168 M 100 163 L 110 163" stroke="#D48C46" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 125 153 L 125 169 M 120 165 L 130 165" stroke="#D48C46" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Accent focal indicator: Subtle elegant bracket highlighting the concept clearly -->
  <path d="M 45 65 L 35 65 L 35 175 L 45 175" stroke="#D48C46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
  <path d="M 195 65 L 205 65 L 205 175 L 195 175" stroke="#D48C46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
</svg>