<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative ocean waves -->
  <path d="M0 180 C40 160, 80 160, 120 180 C160 200, 200 200, 240 180 L240 240 L0 240 Z" fill="#222B38"/>
  <path d="M0 200 C50 185, 100 185, 150 200 C190 215, 220 215, 240 205 L240 240 L0 240 Z" fill="#1E2733"/>

  <!-- Giant dynamic wave (The core physical setting for 冲浪 - Surfing) -->
  <path d="M20 200 C20 100, 80 60, 150 50 C180 46, 210 55, 220 70 C225 78, 220 90, 205 95 C180 105, 140 90, 120 110 C100 130, 110 170, 140 190 C90 190, 50 200, 20 200 Z" fill="#2563EB"/>
  <path d="M35 195 C45 110, 100 70, 160 62 C185 58, 210 66, 216 76 C205 78, 185 85, 170 95 C145 112, 130 145, 140 185 C95 185, 60 193, 35 195 Z" fill="#3B82F6"/>
  
  <!-- Wave crest foam / highlights -->
  <path d="M150 50 C180 46, 210 55, 220 70 C210 62, 185 55, 155 58 C135 60, 115 70, 100 85 C115 70, 132 55, 150 50 Z" fill="#F8FAFC"/>
  <path d="M210 65 C218 72, 215 85, 205 92 C210 85, 214 75, 210 65 Z" fill="#93C5FD"/>

  <!-- Surfboard (Accent color: Orange/Gold for focus, sleek modern flat design) -->
  <g transform="translate(100, 115) rotate(-30)">
    <!-- Main board body -->
    <ellipse cx="40" cy="15" rx="42" ry="10" fill="#F97316"/>
    <!-- Surfboard stripe design -->
    <path d="M0 15 Q40 5 80 15 Q40 25 0 15 Z" fill="#EA580C" opacity="0.3"/>
    <rect x="30" y="9" width="20" height="12" rx="3" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Surfer character integrated naturally riding the wave -->
  <!-- Body/Torso in wetsuit -->
  <g transform="translate(110, 100) rotate(-15)">
    <!-- Legs in crouching stance -->
    <path d="M25 25 L45 35 L40 45 L20 35 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Torso -->
    <path d="M10 15 L35 25 L25 45 L5 30 Z" fill="#0F172A"/>
    <!-- Arms balanced -->
    <path d="M22 20 L2 10" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 22 L30 5" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <!-- Head & Helmet -->
    <circle cx="28" cy="8" r="7" fill="#FBBF24"/>
    <path d="M22 6 Q28 2 34 6" fill="#0284C7"/>
  </g>

  <!-- Water splash accents -->
  <circle cx="85" cy="155" r="4" fill="#60A5FA"/>
  <circle cx="75" cy="165" r="2.5" fill="#93C5FD"/>
  <circle cx="155" cy="170" r="3" fill="#60A5FA"/>
  <circle cx="165" cy="160" r="5" fill="#93C5FD"/>
  <circle cx="145" cy="180" r="2" fill="#FFFFFF"/>
</svg>