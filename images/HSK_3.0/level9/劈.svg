<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- Environment / Context Props -->
  <!-- Ground -->
  <path d="M 0 190 Q 120 180 240 190 L 240 240 L 0 240 Z" fill="#090d16"/>
  <!-- Distant trees / Nature -->
  <path d="M 20 190 L 30 140 L 40 190 Z" fill="#334155" opacity="0.4"/>
  <path d="M 35 190 L 48 130 L 60 190 Z" fill="#475569" opacity="0.4"/>
  <path d="M 190 190 L 205 135 L 220 190 Z" fill="#334155" opacity="0.4"/>
  
  <!-- Log Stump (木头) -->
  <ellipse cx="140" cy="185" rx="35" ry="15" fill="#451a03"/>
  <path d="M 105 185 L 105 165 Q 140 150 175 165 L 175 185 Q 140 200 105 185 Z" fill="#78350f"/>
  <ellipse cx="140" cy="165" rx="35" ry="15" fill="#b45309"/>
  <!-- Wood rings texture -->
  <ellipse cx="140" cy="165" rx="24" ry="10" fill="none" stroke="#92400e" stroke-width="2"/>
  <ellipse cx="140" cy="165" rx="12" ry="5" fill="none" stroke="#92400e" stroke-width="1.5"/>

  <!-- Split wood piece flying/falling -->
  <path d="M 160 145 L 175 125 L 165 115 Z" fill="#b45309"/>
  <!-- Flying wood chips -->
  <circle cx="165" cy="130" r="2" fill="#fbbf24"/>
  <circle cx="125" cy="135" r="1.5" fill="#fbbf24"/>
  <circle cx="155" cy="105" r="2.5" fill="#fbbf24"/>

  <!-- Character (Anh ấy) -->
  <!-- Legs -->
  <path d="M 85 190 L 75 140 L 95 135 L 105 185 Z" fill="#1e293b"/>
  <path d="M 100 190 L 110 145 L 125 145 L 120 190 Z" fill="#334155"/>
  
  <!-- Torso & Arms (Swinging action) -->
  <!-- Red plaid shirt / Working outfit -->
  <path d="M 70 120 L 105 115 L 115 155 L 80 160 Z" fill="#ef4444"/>
  <path d="M 85 117 L 100 115 L 110 155 L 90 155 Z" fill="#dc2626"/>

  <!-- Arms holding axe up -->
  <path d="M 95 115 Q 120 80 135 105" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Head & Face -->
  <circle cx="75" cy="100" r="14" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M 62 100 Q 70 85 88 92 L 85 100 Z" fill="#0f172a"/>
  <!-- Determined face expression -->
  <line x1="78" y1="96" x2="84" y2="98" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Axe (Búa - 斧子) -->
  <!-- Handle -->
  <path d="M 125 95 L 155 45" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <!-- Axe Head (Metal Blade) -->
  <path d="M 145 40 L 165 30 L 170 55 L 148 55 Z" fill="#94a3b8"/>
  <path d="M 165 30 L 170 55 L 175 42 Z" fill="#cbd5e1"/> <!-- Metallic sheen -->

  <!-- Action impact lines / Motion arc -->
  <path d="M 120 60 Q 150 40 165 55" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,4" opacity="0.8"/>
</svg>