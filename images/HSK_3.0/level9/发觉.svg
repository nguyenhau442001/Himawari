<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative depth elements -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.5"/>
  <circle cx="120" cy="120" r="60" fill="#282E3D" opacity="0.3"/>

  <!-- Motion/Discovery light rays emanating from focus -->
  <path d="M120 70 L100 35" stroke="#FFA726" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M150 90 L185 75" stroke="#FFA726" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M90 90 L55 75" stroke="#FFA726" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Child character (representing the observed person with slightly different/quirky emotion) -->
  <g transform="translate(135, 125)">
    <!-- Body & Hoodie -->
    <path d="M -15 45 C -15 30, -5 20, 15 20 C 35 20, 45 30, 45 45 L 45 65 L -15 65 Z" fill="#42A5F5"/>
    <!-- Head -->
    <circle cx="15" cy="5" r="16" fill="#FFCCBC"/>
    <!-- Hair -->
    <path d="M -1  -5 C 2 -12, 25 -12, 31 -2 C 28 0, 20 -4, 15 -4 C 10 -4, 2 0, -1 -5 Z" fill="#5D4037"/>
    <!-- Slight irregular expression (looking up/away - 'chuxing' emotion) -->
    <circle cx="21" cy="4" r="1.5" fill="#3E2723"/>
    <path d="M 18 11 Q 21 8 24 10" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Mother/Observer character (representing 'fājué' - noticing/realizing) -->
  <g transform="translate(65, 110)">
    <!-- Torso -->
    <path d="M -25 60 C -25 40, -10 30, 15 30 C 40 30, 55 40, 55 60 L 55 80 L -25 80 Z" fill="#AB47BC"/>
    <!-- Head -->
    <circle cx="15" cy="10" r="18" fill="#FFCCBC"/>
    <!-- Hair -->
    <path d="M -3 0 C 5 -10, 25 -10, 33 2 C 35 15, 30 25, 30 25 C 30 25, 20 20, 15 20 C 10 20, -1 15, -3 0 Z" fill="#3E2723"/>
    
    <!-- Focused, attentive eyes looking toward the child -->
    <circle cx="22" cy="9" r="2" fill="#3E2723"/>
    
    <!-- Gentle, realizing expression (soft smile) -->
    <path d="M 18 16 Q 22 20 26 17" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Hand raised gesturing realization/observation -->
    <path d="M 45 45 C 55 45, 65 35, 60 25 C 58 20, 52 22, 50 28" fill="#FFCCBC" stroke="#E65100" stroke-width="0.5"/>
  </g>

  <!-- Insight / "Aha!" Discovery focal element (Glowing conceptual lightbulb/spark near mother's head) -->
  <g transform="translate(100, 55)">
    <circle cx="0" cy="0" r="14" fill="#FFA726" opacity="0.2"/>
    <circle cx="0" cy="0" r="9" fill="#FFA726"/>
    <path d="M -4 6 L 4 6 L 2 12 L -2 12 Z" fill="#FFE082"/>
    <path d="M -9 0 L -14 0" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
    <path d="M 9 0 L 14 0" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6 -6 L -10 -10" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
    <path d="M 6 -6 L 10 -10" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtle connection/attention line (visualizing the moment of realization) -->
  <path d="M 95 105 Q 115 90 135 110" stroke="#FFA726" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" fill="none"/>
</svg>