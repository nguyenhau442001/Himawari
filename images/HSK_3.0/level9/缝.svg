<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Warm Ambient Light from Floor Lamp / Window -->
  <circle cx="120" cy="120" r="120" fill="url(#lamp-glow)" pointer-events="none"/>

  <!-- BACKGROUND ENVIRONMENT -->
  <!-- Wallpaper / Wall Panel -->
  <path d="M 0 0 H 240 V 160 H 0 Z" fill="#1e293b"/>
  <!-- Wooden Floor -->
  <path d="M 0 160 H 240 V 240 H 0 Z" fill="#0f172a"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="160" x2="20" y2="240" stroke="#172033" stroke-width="1.5"/>
  <line x1="120" y1="160" x2="100" y2="240" stroke="#172033" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="210" y2="240" stroke="#172033" stroke-width="1.5"/>

  <!-- Cozy Bookshelf in Background -->
  <g transform="translate(180, 70)" opacity="0.6">
    <rect x="0" y="0" width="45" height="90" rx="2" fill="#334155"/>
    <rect x="5" y="25" width="35" height="4" fill="#1e293b"/>
    <rect x="5" y="60" width="35" height="4" fill="#1e293b"/>
    <!-- Books -->
    <rect x="8" y="10" width="8" height="15" fill="#38bdf8" rx="1"/>
    <rect x="18" y="8" width="10" height="17" fill="#fb923c" rx="1"/>
    <rect x="8" y="35" width="12" height="25" fill="#10b981" rx="1"/>
    <rect x="22" y="40" width="7" height="20" fill="#ec4899" rx="1"/>
  </g>

  <!-- Hanging Picture Frame -->
  <g transform="translate(35, 45)" filter="url(#shadow)">
    <rect x="0" y="0" width="35" height="45" rx="3" fill="#475569"/>
    <rect x="4" y="4" width="27" height="37" fill="#cbd5e1"/>
    <!-- Simple Landscape inside frame -->
    <circle cx="17.5" cy="18" r="5" fill="#fbbf24"/>
    <path d="M 4 35 L 14 20 L 22 28 L 31 18 L 31 35 Z" fill="#64748b"/>
    <line x1="17.5" y1="0" x2="17.5" y2="-8" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- SIDE TABLE WITH PLANT -->
  <g transform="translate(15, 110)">
    <!-- Table -->
    <rect x="0" y="50" width="45" height="8" rx="2" fill="#64748b"/>
    <rect x="8" y="58" width="4" height="22" fill="#475569"/>
    <rect x="33" y="58" width="4" height="22" fill="#475569"/>
    <!-- Plant Pot -->
    <path d="M 12 25 L 16 50 H 28 L 32 25 Z" fill="#f8fafc"/>
    <!-- Plant Leaves -->
    <path d="M 22 25 Q 12 10 5 15 Q 0 25 15 25 Z" fill="#10b981"/>
    <path d="M 22 25 Q 32 8 38 15 Q 42 25 28 25 Z" fill="#34d399"/>
    <path d="M 22 25 Q 22 5 22 25 Z" fill="#059669"/>
  </g>

  <!-- MAIN CHARACTER: MOTHER SITTING & SEWING -->
  <g id="mother-character" filter="url(#shadow)">
    <!-- Chair -->
    <g transform="translate(85, 110)">
      <!-- Chair Back -->
      <path d="M 10 0 C 10 -15 45 -15 45 0 V 60 H 10 Z" fill="#475569" rx="4"/>
      <!-- Chair Seat -->
      <rect x="0" y="55" width="70" height="12" rx="4" fill="#64748b"/>
      <!-- Chair Legs -->
      <line x1="10" y1="67" x2="5" y2="110" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="67" x2="65" y2="110" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Mother's Body & Dress -->
    <!-- Lower body / Legs sitting -->
    <path d="M 95 145 L 125 170 H 155 L 140 145 Z" fill="#3b82f6"/>
    <!-- Shoes -->
    <path d="M 150 170 C 158 170 162 166 162 163 C 162 160 155 160 148 160 Z" fill="#1e293b"/>

    <!-- Torso (Pink Cardigan / Apron) -->
    <path d="M 90 95 C 90 85 110 85 120 85 C 130 85 150 85 150 95 L 155 150 H 85 Z" fill="#ec4899"/>
    <!-- Inner Shirt Collar -->
    <path d="M 110 85 L 120 95 L 130 85 Z" fill="#f8fafc"/>
    <!-- Button details -->
    <circle cx="120" cy="105" r="1.5" fill="#fbcfe8"/>
    <circle cx="120" cy="120" r="1.5" fill="#fbcfe8"/>
    <circle cx="120" cy="135" r="1.5" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <!-- Hair back/base -->
    <circle cx="120" cy="65" r="18" fill="#334155"/>
    <!-- Hair Bun -->
    <circle cx="135" cy="58" r="8" fill="#334155"/>
    <!-- Face Skin -->
    <circle cx="120" cy="68" r="15" fill="#ffedd5"/>
    <!-- Gentle Smiling Eye (Closed/Happy curve) -->
    <path d="M 124 66 C 127 68 130 66 132 64" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Gentle Rosy Cheek -->
    <circle cx="128" cy="71" r="3.5" fill="#fda4af" opacity="0.6"/>
    <!-- Gentle Smile -->
    <path d="M 126 74 C 128 76 131 76 133 74" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Arms & Hands performing the action (SEWING CLOTHES) -->
    <!-- Left Arm (supporting) -->
    <path d="M 95 100 Q 80 120 100 135" stroke="#ec4899" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Right Arm (holding needle actively) -->
    <path d="M 145 100 Q 155 120 135 130" stroke="#ec4899" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="133" cy="132" r="5" fill="#ffedd5"/>

    <!-- THE GARMENT BEING SEWN (QUẦN ÁO) -->
    <g transform="translate(100, 115)">
      <!-- Fabric/Cloth item (Bright energetic teal/cyan garment) -->
      <path d="M 0 15 Q 15 -5 35 10 Q 55 25 45 40 Q 35 55 10 40 Z" fill="#14b8a6"/>
      <!-- Seam / Stitching visual line -->
      <path d="M 12 12 Q 22 5 32 18" stroke="#99f6e4" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
      
      <!-- Needle & Thread -->
      <!-- Golden Needle -->
      <line x1="126" y1="115" x2="134" y2="128" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <!-- Thread flowing from needle up to spool/hand -->
      <path d="M 126 115 Q 115 105 105 110 T 95 125" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- SEWING BASKET / PROPS ON FLOOR -->
  <g transform="translate(65, 165)" filter="url(#shadow)">
    <!-- Basket Body -->
    <path d="M 10 15 L 15 35 H 45 L 50 15 Z" fill="#d97706"/>
    <path d="M 5 15 H 55 V 18 H 5 Z" fill="#b45309" rx="2"/>
    <!-- Yarn Ball inside basket -->
    <circle cx="25" cy="18" r="8" fill="#f43f5e"/>
    <circle cx="35" cy="20" r="7" fill="#38bdf8"/>
    <!-- Spool of thread -->
    <rect x="15" y="20" width="6" height="12" rx="1" fill="#fef08a"/>
  </g>

  <!-- WARM DESK LAMP ILLUMINATING THE SCENE -->
  <g transform="translate(170, 40)">
    <!-- Lamp Stand/Arm attached to wall/table -->
    <path d="M 0 50 L -20 20 L -35 25" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp Shade -->
    <path d="M -25 10 L -45 -5 H -5 Z" fill="#f59e0b"/>
    <!-- Light Beam Polygon -->
    <polygon points="-25,10 -70,120 30,120" fill="#fbbf24" opacity="0.12" pointer-events="none"/>
  </g>
</svg>