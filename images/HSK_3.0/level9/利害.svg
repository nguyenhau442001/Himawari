<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M20 180h200v30c0 5-5 10-10 10H30c-5 0-10-5-10-10V180z" fill="#334155"/>
  
  <!-- Character: Analyst -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="30" r="25" fill="#fbbf24"/>
    <path d="M15 35h30v5c0 8-7 15-15 15s-15-7-15-15v-5z" fill="#0f172a"/>
    <path d="M20 25h5v5h-5zM35 25h5v5h-5z" fill="#0f172a"/>
    <path d="M25 60l-5 40h10l-5-40z" fill="#38bdf8"/>
  </g>

  <!-- Analysis Board/Paper -->
  <rect x="110" y="60" width="80" height="100" rx="4" fill="#f1f5f9"/>
  <line x1="120" y1="80" x2="180" y2="80" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="100" x2="160" y2="100" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="180" y2="120" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Connection Lines (Visualizing "Relationship") -->
  <path d="M110 100 Q 90 100 85 80" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Props: Magnifying Glass -->
  <circle cx="100" cy="140" r="15" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <path d="M110 150l15 15" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Ambient Light -->
  <circle cx="200" cy="40" r="30" fill="#fbbf24" opacity="0.1"/>
</svg>