  <path d="M155 140 L 162 135 L 158 125 L 150 130 Z" fill="#94a3b8"/>
  
  <!-- Atmosphere -->
  <circle cx="200" cy="50" r="15" fill="#f59e0b" opacity="0.3"/>
  <circle cx="200" cy="50" r="25" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Trees -->
  <path d="M20 160 L 20 120 M 20 120 L 10 140 M 20 120 L 30 140" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M220 170 L 220 130 M 220 130 L 210 150 M 220 130 L 230 150" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>