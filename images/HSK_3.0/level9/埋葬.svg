    <path d="M-5 10 L -5 30 M 5 10 L 5 30" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(160, 165)">
    <circle cx="0" cy="-25" r="8" fill="#fbbf24"/>
    <path d="M-10 -15 L 10 -15 L 5 10 L -5 10 Z" fill="#ec4899"/>
    <path d="M-5 10 L -5 30 M 5 10 L 5 30" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Shovel -->
