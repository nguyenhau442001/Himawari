      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Mountain Slope -->
  <path d="M0 160 C 80 120, 160 120, 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  <path d="M0 180 C 60 150, 180 150, 240 200 L 240 240 L 0 240 Z" fill="#475569"/>
  
