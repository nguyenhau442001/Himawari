  <path d="M100 175 Q 120 160 140 175" fill="#475569"/>
  
  <!-- Characters -->
  <!-- Person 1 -->
  <g transform="translate(80, 160)">
    <circle cx="0" cy="-25" r="8" fill="#fbbf24"/>
