<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Leather Shoe Gradient (Rich Brown) -->
    <linearGradient id="leatherShoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    
    <!-- Leather Texture Highlight -->
    <linearGradient id="shoeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Skin & Clothes -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Spotlight -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- SHOP ENVIRONMENT / BACKGROUND -->
  <!-- Wooden Display Shelf Backing -->
  <rect x="30" y="40" width="180" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="95" x2="210" y2="95" stroke="#334155" stroke-width="2"/>
  
  <!-- Background Decor Props (Boxes & Tools) -->
  <rect x="45" y="60" width="24" height="30" rx="4" fill="#475569" opacity="0.6"/>
  <rect x="170" y="55" width="25" height="38" rx="4" fill="#334155" opacity="0.8"/>
  <circle cx="182" cy="74" r="6" fill="#f59e0b" opacity="0.4"/>

  <!-- Store Counter / Tabletop -->
  <path d="M 20 160 L 220 160 L 230 205 L 10 205 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="155" width="210" height="10" rx="3" fill="#475569"/>

  <!-- THE MAIN SUBJECT: "这双鞋是真皮革做的" (This pair of shoes is made of genuine leather) -->
  
  <!-- Shoe Pair (Right & Left) -->
  <g transform="translate(0, 5)" filter="url(#shadow)">
    <!-- Shoe 1 (Back/Left Shoe) -->
    <g transform="translate(65, 120) scale(0.9)">
      <path d="M 5 25 C 5 15, 20 10, 35 12 C 55 14, 70 20, 80 25 C 85 28, 85 35, 75 38 C 50 42, 20 42, 5 38 Z" fill="url(#leatherShoe)"/>
      <path d="M 12 18 C 22 15, 45 16, 65 22" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Sole -->
      <path d="M 3 39 L 82 39 L 80 43 L 5 43 Z" fill="#292524"/>
    </g>

    <!-- Shoe 2 (Front/Right Main Featured Leather Shoe) -->
    <g transform="translate(95, 128)">
      <!-- Shoe Body Base -->
      <path d="M 8 28 C 8 16, 25 10, 45 12 C 70 14, 88 22, 98 28 C 105 32, 102 42, 92 45 C 60 50, 25 50, 6 45 C 1 43, 3 32, 8 28 Z" fill="url(#leatherShoe)"/>
      <!-- Leather Gloss / Highlights -->
      <path d="M 15 22 C 30 18, 65 20, 88 28" stroke="url(#shoeHighlight)" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Shoe Laces & Eyelet Area -->
      <path d="M 18 20 C 28 17, 50 18, 70 24" stroke="#451a03" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="19" r="2" fill="#fef08a"/>
      <circle cx="35" cy="20" r="2" fill="#fef08a"/>
      <circle cx="45" cy="21" r="2" fill="#fef08a"/>
      <!-- Premium Sticking/Welting Detail -->
      <path d="M 6 44 C 30 49, 70 49, 94 44" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
      <!-- Thick Durable Leather Sole -->
      <path d="M 4 46 L 96 46 L 94 51 L 6 51 Z" fill="#1c1917"/>
      <path d="M 4 51 L 96 51 L 94 53 L 6 53 Z" fill="#b45309"/>
    </g>
  </g>

  <!-- CHARACTER INTERACTING (Customer / Shopper inspecting the leather) -->
  <!-- Character Bust & Hands leaning over counter -->
  <g transform="translate(10, 10)">
    <!-- Torso & Shirt -->
    <path d="M 120 180 C 120 155, 150 145, 175 145 C 200 145, 230 155, 230 180 L 230 210 L 120 210 Z" fill="url(#shirtGrad)"/>
    
    <!-- Arms reaching forward -->
    <!-- Left Arm -->
    <path d="M 125 150 C 135 155, 150 160, 160 175" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round"/>
    <!-- Hand inspecting/pointing at the shoe -->
    <circle cx="165" cy="176" r="8" fill="url(#skinGrad)" filter="url(#shadow)"/>
    <!-- Pointing Finger -->
    <path d="M 170 173 L 180 170 L 175 177 Z" fill="url(#skinGrad)"/>

    <!-- Right Arm -->
    <path d="M 215 155 C 200 160, 185 165, 175 178" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round"/>
    <circle cx="172" cy="181" r="7" fill="url(#skinGrad)"/>
  </g>

  <!-- MAGNIFYING GLASS ICON / QUALITY INSPECTION PROP -->
  <!-- Highlights that it's genuine high-grade leather being inspected closely -->
  <g transform="translate(140, 95)" filter="url(#shadow)">
    <!-- Glass Lens Circle -->
    <circle cx="20" cy="20" r="16" fill="#38bdf8" fill-opacity="0.2" stroke="#f8fafc" stroke-width="3"/>
    <!-- Glass Shine Reflection -->
    <path d="M 10 12 C 12 10, 18 10, 22 12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Handle -->
    <path d="M 7 33 L -3 43" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <path d="M 7 33 L -3 43" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- AUTHENTIC LEATHER BADGE / ICONIC DETAIL (Subtle, NO text) -->
  <g transform="translate(25, 170)">
    <circle cx="16" cy="16" r="14" fill="#b45309" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <!-- Leaf / Natural Hide symbol inside badge -->
    <path d="M 16 8 C 16 14, 10 20, 8 22 C 14 22, 20 18, 22 14 C 20 14, 18 12, 16 8 Z" fill="#fef3c7"/>
    <path d="M 11 19 L 20 10" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  </g>

</svg>