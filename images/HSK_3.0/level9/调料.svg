<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (subtle glowing culinary aura) -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Main Object Group: Condiment / Spice Containers (调料) -->
  <g transform="translate(0, 10)">
    
    <!-- Left Shaker (Salt/Powder Spice) -->
    <g transform="translate(62, 50)">
      <!-- Glass Body -->
      <path d="M12 25 L16 85 C16 90 20 94 26 94 L42 94 C48 94 52 90 52 85 L56 25 Z" fill="#2E384D"/>
      <!-- Glass reflection/highlight -->
      <path d="M18 35 L21 80 C21 80 25 82 28 82" stroke="#4B5E80" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Contents (Spices inside) -->
      <path d="M15 45 L17 83 C17 88 21 91 26 91 L42 91 C47 91 51 88 51 83 L53 45 Z" fill="#F0C674" opacity="0.85"/>
      <!-- Metal Cap -->
      <rect x="10" y="12" width="48" height="15" rx="3" fill="#A7B6C2"/>
      <!-- Cap Ribs -->
      <line x1="22" y1="12" x2="22" y2="27" stroke="#7A8B99" stroke-width="2"/>
      <line x1="34" y1="12" x2="34" y2="27" stroke="#7A8B99" stroke-width="2"/>
      <line x1="46" y1="12" x2="46" y2="27" stroke="#7A8B99" stroke-width="2"/>
      <!-- Holes on Cap -->
      <circle cx="28" cy="7" r="1.5" fill="#E6EDF2"/>
      <circle cx="34" cy="7" r="1.5" fill="#E6EDF2"/>
      <circle cx="40" cy="7" r="1.5" fill="#E6EDF2"/>
    </g>

    <!-- Right Bottle (Soy Sauce/Liquid Seasoning) -->
    <g transform="translate(122, 35)">
      <!-- Neck & Cap -->
      <rect x="25" y="10" width="10" height="15" fill="#A7B6C2" rx="2"/>
      <rect x="23" y="5" width="14" height="6" fill="#E6EDF2" rx="1"/>
      <path d="M22 25 Q30 23 38 25 L42 35 C42 35 18 35 22 25 Z" fill="#7A8B99"/>
      
      <!-- Glass Body -->
      <path d="M18 35 L18 105 C18 112 23 117 30 117 L38 117 C45 117 50 112 50 105 L50 35 Z" fill="#2E384D"/>
      <!-- Liquid Contents (Dark Soy Sauce) -->
      <path d="M19 45 L19 105 C19 111 23 115 30 115 L38 115 C45 115 49 111 49 105 L49 45 Z" fill="#D96B43"/>
      <!-- Glass Reflection -->
      <path d="M23 42 L23 100" stroke="#4B5E80" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Label on Bottle -->
      <rect x="23" y="60" width="22" height="30" rx="2" fill="#E6EDF2"/>
      <line x1="27" y1="68" x2="41" y2="68" stroke="#D96B43" stroke-width="3" stroke-linecap="round"/>
      <line x1="27" y1="77" x2="37" y2="77" stroke="#2E384D" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Center/Front Small Bowl (Chili Oil / Paste with Spoon) -->
    <g transform="translate(85, 120)">
      <!-- Bowl Base/Shadow -->
      <ellipse cx="35" cy="45" rx="36" ry="12" fill="#15181F"/>
      
      <!-- Bowl Outer -->
      <path d="M1 35 C1 55 15 65 35 65 C55 65 69 55 69 35 Z" fill="#E6EDF2"/>
      <!-- Bowl Rim -->
      <ellipse cx="35" cy="35" rx="34" ry="10" fill="#FFFFFF"/>
      <!-- Bowl Inner -->
      <ellipse cx="35" cy="37" rx="30" ry="8" fill="#2E384D"/>
      <!-- Contents (Rich Red Chili Oil) -->
      <ellipse cx="35" cy="38" rx="27" ry="6" fill="#D96B43"/>
      <!-- Spice Specks / Highlight -->
      <circle cx="28" cy="37" r="2.5" fill="#F0C674"/>
      <circle cx="42" cy="39" r="2" fill="#F0C674"/>
      <circle cx="35" cy="36" r="1.5" fill="#E6EDF2"/>
      
      <!-- Spoon resting across -->
      <g transform="translate(10, 8) rotate(-25)">
        <!-- Spoon Handle -->
        <rect x="0" y="3" width="45" height="4" rx="2" fill="#A7B6C2"/>
        <!-- Spoon Bowl -->
        <ellipse cx="0" cy="5" rx="8" ry="6" fill="#A7B6C2"/>
        <ellipse cx="0" cy="5" rx="5" ry="4" fill="#D96B43"/>
      </g>
    </g>
    
    <!-- Floating Flavor/Aroma Sparks (Modern touch) -->
    <g transform="translate(0, -5)">
      <!-- Spark 1 (Gold Accent) -->
      <path d="M45 45 Q50 35 60 40 Q50 45 45 55 Q40 45 30 40 Q40 35 45 45 Z" fill="#F0C674"/>
      <!-- Spark 2 (Orange Accent) -->
      <path d="M190 75 Q193 68 200 72 Q193 75 190 82 Q187 75 180 72 Q187 68 190 75 Z" fill="#D96B43"/>
    </g>
    
  </g>
</svg>