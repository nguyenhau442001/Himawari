<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for central focus -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Police Station Building Silhouette -->
  <path d="M75 160 L75 110 L120 85 L165 110 L165 160 Z" fill="#2C3545"/>
  <rect x="105" y="130" width="30" height="30" rx="3" fill="#1A1D24"/>
  <rect x="85" y="115" width="16" height="20" rx="2" fill="#3A465B"/>
  <rect x="139" y="115" width="16" height="20" rx="2" fill="#3A465B"/>

  <!-- Badge / Shield (Official Report Symbol) -->
  <path d="M120 70 L142 82 L142 112 C142 130 120 144 120 144 C120 144 98 130 98 112 L98 82 Z" fill="#F39C12"/>
  <path d="M120 76 L137 86 L137 110 C137 125 120 137 120 137 C120 137 103 125 103 110 L103 86 Z" fill="#F1C40F"/>
  <!-- Star on Badge -->
  <path d="M120 92 L123 100 L131 100 L125 105 L127 113 L120 108 L113 113 L115 105 L109 100 L117 100 Z" fill="#D35400"/>

  <!-- Document / Report (Bào) symbolizing the filing aspect -->
  <g transform="translate(70, 110) rotate(-15)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#FFFFFF"/>
    <rect x="8" y="10" width="24" height="4" rx="2" fill="#3A465B"/>
    <rect x="8" y="20" width="18" height="3" rx="1.5" fill="#95A5A6"/>
    <rect x="8" y="27" width="20" height="3" rx="1.5" fill="#95A5A6"/>
    <rect x="8" y="34" width="14" height="3" rx="1.5" fill="#95A5A6"/>
    <circle cx="28" cy="40" r="4" fill="#E74C3C"/>
  </g>

  <!-- Magnifying glass emphasizing investigation/reporting detail -->
  <g transform="translate(130, 130)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#E67E22" stroke-width="5"/>
    <line x1="8" y1="32" x2="-3" y2="43" stroke="#E67E22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="12" fill="#3498DB" opacity="0.2"/>
  </g>

  <!-- Ground Line -->
  <rect x="40" y="160" width="160" height="4" rx="2" fill="#3A465B"/>
</svg>