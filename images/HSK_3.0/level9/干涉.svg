<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="roomClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roomClip)">
    <!-- Base Room Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>

    <!-- Room Interior Elements (Cozy Living Room / Study) -->
    <!-- Wall & Floor Divider -->
    <rect x="0" y="160" width="240" height="80" fill="#090d16"/>
    <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2"/>

    <!-- Wallpaper Accent Stripes -->
    <path d="M60 0 L60 160 M120 0 L120 160 M180 0 L180 160" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>

    <!-- Window with Night City View -->
    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="60" height="95" rx="4" fill="#020617" stroke="#334155" stroke-width="3"/>
      <!-- Window Panes & City Lights -->
      <rect x="8" y="10" width="20" height="35" rx="2" fill="#1e293b"/>
      <rect x="32" y="10" width="20" height="35" rx="2" fill="#1e293b"/>
      <rect x="8" y="50" width="20" height="35" rx="2" fill="#1e293b"/>
      <rect x="32" y="50" width="20" height="35" rx="2" fill="#f59e0b" opacity="0.5"/>
      <circle cx="18" cy="20" r="2" fill="#fbbf24"/>
      <circle cx="42" cy="70" r="2" fill="#38bdf8"/>
      <!-- Window Frame Divider -->
      <line x1="30" y1="0" x2="30" y2="95" stroke="#334155" stroke-width="3"/>
      <line x1="0" y1="47" x2="60" y2="47" stroke="#334155" stroke-width="3"/>
    </g>

    <!-- Bookshelf in Background -->
    <g transform="translate(185, 45)">
      <rect x="0" y="0" width="40" height="115" fill="#111827" stroke="#334155" stroke-width="2"/>
      <line x1="0" y1="35" x2="40" y2="35" stroke="#334155" stroke-width="2"/>
      <line x1="0" y1="75" x2="40" y2="75" stroke="#334155" stroke-width="2"/>
      <!-- Books -->
      <rect x="5" y="15" width="8" height="20" fill="#ec4899" rx="1"/>
      <rect x="15" y="18" width="6" height="17" fill="#38bdf8" rx="1"/>
      <rect x="23" y="12" width="10" height="23" fill="#10b981" rx="1"/>
      <rect x="6" y="50" width="12" height="25" fill="#f59e0b" rx="1"/>
      <rect x="21" y="55" width="8" height="20" fill="#6366f1" rx="1"/>
    </g>

    <!-- Furniture: Cozy Desk & Lamp -->
    <g transform="translate(125, 120)">
      <!-- Desk Surface & Legs -->
      <rect x="-10" y="40" width="110" height="8" rx="2" fill="#334155"/>
      <rect x="0" y="48" width="8" height="45" fill="#1e293b"/>
      <rect x="80" y="48" width="8" height="45" fill="#1e293b"/>
      <!-- Desk Lamp -->
      <path d="M70 40 L70 15 L85 10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <path d="M75 5 L95 15 L85 25 Z" fill="#fbbf24"/>
      <polygon points="70,15 100,60 50,60" fill="url(#lampGlow)" opacity="0.6"/>
      <!-- Laptop / Notebook -->
      <rect x="25" y="25" width="28" height="15" rx="2" fill="#64748b"/>
      <rect x="20" y="38" width="38" height="3" rx="1" fill="#94a3b8"/>
      <!-- Coffee Mug -->
      <rect x="10" y="25" width="10" height="14" rx="2" fill="#f43f5e"/>
      <path d="M20 28 C 24 28, 24 34, 20 34" fill="none" stroke="#f43f5e" stroke-width="2"/>
    </g>

    <!-- CHARACTER 1 (Sitting, Private/Personal Space - Looking annoyed/busy) -->
    <g transform="translate(130, 95)">
      <!-- Chair Back -->
      <rect x="0" y="5" width="28" height="65" rx="6" fill="#1e293b"/>
      <!-- Body -->
      <path d="M6 35 C 6 25, 22 25, 22 35 L 26 70 L 2 70 Z" fill="#38bdf8"/>
      <!-- Head & Hair -->
      <circle cx="14" cy="14" r="11" fill="#fbcfe8"/>
      <path d="M 3 14 C 3 4, 25 4, 25 14 C 25 18, 22 20, 20 18 C 16 12, 10 12, 4 18 C 3 16, 3 14, 3 14 Z" fill="#475569"/>
      <!-- Face Expression (Focused & Protective) -->
      <line x1="9" y1="13" x2="12" y2="14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="16" y1="14" x2="19" y2="13" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="10.5" cy="16" r="1" fill="#1e293b"/>
      <circle cx="17.5" cy="16" r="1" fill="#1e293b"/>
      <path d="M 12 20 Q 14 18 16 20" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Crossed arms defending personal space -->
      <path d="M 4 45 Q 14 38 24 45" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- CHARACTER 2 (Intruder / Over-involved busybody leaning in) -->
    <g transform="translate(35, 75)">
      <!-- Body leaning forward dynamically -->
      <path d="M 40 45 C 50 45, 65 65, 75 85 L 35 90 L 25 60 Z" fill="#fb923c"/>
      <!-- Head & Hair -->
      <circle cx="55" cy="25" r="12" fill="#fed7aa"/>
      <path d="M 43 25 C 43 10, 67 10, 67 25 C 67 28, 63 30, 60 28 C 55 23, 50 23, 45 28 C 44 26, 43 25, 43 25 Z" fill="#78350f"/>
      <!-- Face Expression (Curious, nosy, intrusive smile) -->
      <circle cx="59" cy="26" r="1.5" fill="#78350f"/>
      <circle cx="52" cy="27" r="1.5" fill="#78350f"/>
      <path d="M 53 32 Q 56 36 59 32" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Pointing finger / Gesturing hand intruding -->
      <path d="M 70 65 L 85 55 L 75 75 Z" fill="#fed7aa"/>
      <path d="M 85 55 L 98 48" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
      <path d="M 35 48 Q 50 40 65 55" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- INTERVENTION VISUAL BARRIER / STOP GESTURE (The "Don't Interfere" Concept) -->
    <g transform="translate(95, 85)">
      <!-- Large bold Stop / Boundary Shield / Hand icon representing "Don't interfere" -->
      <circle cx="12" cy="12" r="18" fill="#ef4444" opacity="0.9"/>
      <!-- Hand / Stop symbol -->
      <path d="M 4 12 L 20 12 M 12 4 L 12 20" stroke="#ffffff" stroke-width="4" stroke-linecap="round" transform="rotate(45 12 12)"/>
    </g>

    <!-- Floating abstract interference lines (crossed out boundary) -->
    <g stroke="#f87171" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="85" y1="65" x2="105" y2="85"/>
      <line x1="105" y1="65" x2="85" y2="85"/>
    </g>

    <!-- Foreground Floor Shadow for Depth -->
    <ellipse cx="65" cy="170" rx="45" ry="8" fill="#020617" opacity="0.6"/>
    <ellipse cx="150" cy="190" rx="35" ry="6" fill="#020617" opacity="0.6"/>
  </g>
</svg>