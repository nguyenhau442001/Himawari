<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Ambient Glow from Factory Lights -->
    <radialGradient id="light-glow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Amber Work Light -->
    <radialGradient id="amber-glow" cx="70%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Loom Metal Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Spool / Yarn Gradients -->
    <linearGradient id="yarn-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="yarn-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#light-glow)"/>
  <rect width="240" height="240" rx="24" fill="url(#amber-glow)"/>

  <!-- Factory Industrial Interior Background -->
  <!-- Ceiling Structure -->
  <path d="M0 40 L120 20 L240 40 L240 60 L0 60 Z" fill="#0f172a" opacity="0.8"/>
  <line x1="60" y1="30" x2="60" y2="60" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="20" x2="120" y2="60" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="30" x2="180" y2="60" stroke="#334155" stroke-width="2"/>

  <!-- Industrial Hanging Lamps -->
  <path d="M55 60 L65 60 L68 75 L52 75 Z" fill="#64748b"/>
  <line x1="60" y1="45" x2="60" y2="60" stroke="#64748b" stroke-width="2"/>
  <path d="M45 75 Q60 110 75 75 Z" fill="#fef08a" opacity="0.9" filter="url(#shadow)"/>

  <path d="M175 60 L185 60 L188 75 L172 75 Z" fill="#64748b"/>
  <line x1="180" y1="45" x2="180" y2="60" stroke="#64748b" stroke-width="2"/>
  <path d="M165 75 Q180 110 195 75 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Background Machinery Silhouettes (Factory Context) -->
  <rect x="15" y="100" width="40" height="100" rx="4" fill="#1e293b" opacity="0.7"/>
  <circle cx="35" cy="120" r="12" fill="#334155" opacity="0.8"/>
  <circle cx="35" cy="160" r="16" fill="#334155" opacity="0.8"/>

  <rect x="185" y="110" width="40" height="90" rx="4" fill="#1e293b" opacity="0.7"/>
  <rect x="195" y="130" width="20" height="40" fill="#334155"/>

  <!-- MAIN HEAVY LOOM MACHINE (Foreground/Midground) -->
  <g filter="url(#shadow)">
    <!-- Loom Main Frame -->
    <rect x="65" y="90" width="110" height="120" rx="6" fill="url(#metal-grad)"/>
    <!-- Inner Working Area -->
    <rect x="75" y="105" width="90" height="90" rx="4" fill="#0f172a"/>

    <!-- Warp Beams & Spools on Top -->
    <rect x="75" y="95" width="90" height="10" rx="3" fill="#cbd5e1"/>
    <circle cx="85" cy="100" r="6" fill="#0284c7"/>
    <circle cx="120" cy="100" r="6" fill="#db2777"/>
    <circle cx="155" cy="100" r="6" fill="#10b981"/>

    <!-- Vertical Threads / Warp -->
    <line x1="85" y1="115" x2="85" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>
    <line x1="95" y1="115" x2="95" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>
    <line x1="105" y1="115" x2="105" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>
    <line x1="115" y1="115" x2="115" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>
    <line x1="125" y1="115" x2="125" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>
    <line x1="135" y1="115" x2="135" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>
    <line x1="145" y1="115" x2="145" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>
    <line x1="155" y1="115" x2="155" y2="180" stroke="#f8fafc" stroke-width="1" opacity="0.4"/>

    <!-- Woven Colorful Fabric Section Emerging -->
    <path d="M85 145 L155 145 L155 185 L85 185 Z" fill="url(#yarn-pink)"/>
    <!-- Fabric Pattern Details (Weave lines) -->
    <path d="M85 150 L155 150 M85 155 L155 155 M85 160 L155 160 M85 165 L155 165 M85 170 L155 170 M85 175 L155 175 M85 180 L155 180" stroke="#f472b6" stroke-width="1.5" opacity="0.8"/>
    <path d="M90 145 L90 185 M100 145 L100 185 M110 145 L110 185 M120 145 L120 185 M130 145 L130 185 M140 145 L140 185 M150 145 L150 185" stroke="#fbcfe8" stroke-width="1" opacity="0.6"/>

    <!-- Loom Shuttle / Mechanism Bar -->
    <rect x="73" y="140" width="94" height="8" rx="3" fill="#fbbf24" filter="url(#shadow)"/>
  </g>

  <!-- Large Yarn Spools Rack (Left Foreground Context) -->
  <g transform="translate(15, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="8" height="90" fill="#64748b"/>
    <!-- Spool 1 -->
    <rect x="-6" y="10" width="20" height="20" rx="3" fill="url(#yarn-pink)"/>
    <ellipse cx="4" cy="10" rx="10" ry="4" fill="#f472b6"/>
    <ellipse cx="4" cy="30" rx="10" ry="4" fill="#be185d"/>
    <!-- Spool 2 -->
    <rect x="-6" y="45" width="20" height="20" rx="3" fill="url(#yarn-blue)"/>
    <ellipse cx="4" cy="45" rx="10" ry="4" fill="#38bdf8"/>
    <ellipse cx="4" cy="65" rx="10" ry="4" fill="#0369a1"/>
  </g>

  <!-- FACTORY WORKER CHARACTER -->
  <g id="worker" filter="url(#shadow)">
    <!-- Worker Body / Uniform Torso (Cyan/Teal Factory Vest & Shirt) -->
    <path d="M115 150 C110 150 95 160 90 185 L145 185 C140 160 125 150 115 150 Z" fill="#0284c7"/>
    <path d="M100 155 L130 155 L125 185 L105 185 Z" fill="#0369a1"/> <!-- Vest center -->

    <!-- Worker Neck -->
    <rect x="108" y="138" width="14" height="15" rx="4" fill="#fbcfe8"/>

    <!-- Worker Head -->
    <circle cx="115" cy="125" r="16" fill="#fbcfe8"/>

    <!-- Hair (Stylish modern look) -->
    <path d="M99 122 C99 110 110 106 120 108 C130 110 131 122 131 122 C131 122 125 116 115 116 C105 116 99 122 99 122 Z" fill="#334155"/>

    <!-- Safety Cap / Hat -->
    <path d="M100 115 Q115 105 130 115 L134 118 Q115 113 96 118 Z" fill="#f59e0b"/>

    <!-- Face details: Concentrated & Happy Expression -->
    <!-- Eyes (Focused down at the weaving) -->
    <path d="M108 126 Q111 129 114 126" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M118 126 Q121 129 124 126" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cheeks (Warm friendly accent) -->
    <circle cx="107" cy="130" r="2.5" fill="#f43f5e" opacity="0.4"/>
    <circle cx="125" cy="130" r="2.5" fill="#f43f5e" opacity="0.4"/>
    <!-- Gentle Smile -->
    <path d="M113 133 Q115 136 117 133" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Arms & Hands interacting with the Loom -->
    <!-- Left Arm -->
    <path d="M100 155 Q85 160 88 175" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Left Hand holding thread/loom part -->
    <circle cx="88" cy="177" r="4" fill="#fbcfe8"/>

    <!-- Right Arm -->
    <path d="M130 155 Q145 160 140 175" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right Hand -->
    <circle cx="140" cy="177" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Hanging Yarn Thread Connection (Dynamic detail) -->
  <path d="M14 135 Q50 120 78 105" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="4 2" fill="none"/>
  <path d="M14 150 Q50 135 78 120" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- Factory Floor (Ground Line & Reflection) -->
  <rect x="0" y="205" width="240" height="35" fill="#0b0f19"/>
  <line x1="0" y1="205" x2="240" y2="205" stroke="#334155" stroke-width="3"/>
  <ellipse cx="120" cy="205" rx="90" ry="6" fill="#38bdf8" opacity="0.1"/>

  <!-- Safety Stripe Markings on Factory Floor -->
  <path d="M20 215 L40 215 L30 235 L10 235 Z" fill="#f59e0b" opacity="0.5"/>
  <path d="M60 215 L80 215 L70 235 L50 235 Z" fill="#f59e0b" opacity="0.5"/>
  <path d="M160 215 L180 215 L170 235 L150 235 Z" fill="#f59e0b" opacity="0.5"/>
  <path d="M200 215 L220 215 L210 235 L190 235 Z" fill="#f59e0b" opacity="0.5"/>
</svg>