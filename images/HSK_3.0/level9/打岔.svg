<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Speaker A (Left - focused, speaking) -->
  <g transform="translate(65, 120)">
    <!-- Body -->
    <path d="M-25,50 C-25,30 -15,20 0,20 C15,20 25,30 25,50 Z" fill="#2D3748"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="18" fill="#CBD5E0"/>
    <!-- Speech Waves / Active Speaking -->
    <path d="M 22,-15 Q 32,-10 22,-5" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 26,-20 Q 38,-10 26,0" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Focused Eye -->
    <circle cx="6" cy="-12" r="2" fill="#1A1D24"/>
  </g>

  <!-- Speaker B (Right - Interrupting/Cuttin in) -->
  <g transform="translate(175, 120)">
    <!-- Body (leaning in forward) -->
    <path d="M25,50 C25,30 15,20 0,20 C-15,20 -25,30 -25,50 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="-5" cy="-10" r="18" fill="#E2E8F0"/>
    <!-- Raised Hand / Interruption Gesture -->
    <path d="M-20,0 L-35,-15 L-30,-22 L-15,-10" fill="#E2E8F0"/>
    <!-- Interruption Speech Bubble / Burst -->
    <path d="M -30,-30 L -45,-45 L -25,-40 Z" fill="#FC8181"/>
    <!-- Eye (intense) -->
    <circle cx="-8" cy="-12" r="2" fill="#1A1D24"/>
  </g>

  <!-- Central Interruption / Clash Element (Visualizing '打岔' / Cut-off) -->
  <g transform="translate(120, 100)">
    <!-- Bold cross/break lines indicating abrupt interruption -->
    <line x1="-15" y1="-10" x2="15" y2="10" stroke="#FC8181" stroke-width="5" stroke-linecap="round"/>
    <line x1="15" y1="-10" x2="-15" y2="10" stroke="#FC8181" stroke-width="5" stroke-linecap="round"/>
    <!-- Accent sparks -->
    <circle cx="0" cy="-20" r="3" fill="#F6AD55"/>
    <circle cx="-22" cy="5" r="2.5" fill="#F6AD55"/>
    <circle cx="22" cy="5" r="2.5" fill="#F6AD55"/>
  </g>

  <!-- Ground Line -->
  <line x1="30" y1="170" x2="210" y2="170" stroke="#2D3748" stroke-width="4" stroke-linecap="round"/>
</svg>