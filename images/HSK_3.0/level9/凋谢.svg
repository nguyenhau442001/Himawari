<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: Late autumn chill lines -->
  <g opacity="0.25" stroke="#7E8C9E" stroke-width="1.5" stroke-linecap="round">
    <path d="M35 60 Q 60 55, 85 65" fill="none" />
    <path d="M150 40 Q 180 45, 210 35" fill="none" />
    <path d="M20 180 Q 50 185, 70 175" fill="none" />
  </g>

  <!-- Ground line -->
  <path d="M40 185 L200 185" stroke="#2E3544" stroke-width="2" stroke-linecap="round"/>

  <!-- ADJECTIVE CONTRAST REPRESENTATION: 
       Left side: Full bloom state (vibrant, upright, scaled up, warm gold accent)
       Right side: Withered, fading state (drooping, falling petals, desaturated, cool slate tones) -->

  <!-- Left: The vibrant blossom (Reference for contrast) -->
  <g transform="translate(70, 110)">
    <!-- Stem & Leaves -->
    <path d="M0 75 Q -5 30, 0 0" fill="none" stroke="#3DA872" stroke-width="3" stroke-linecap="round"/>
    <path d="M-3 40 Q -20 30, -15 50 Q -5 48, -3 40" fill="#2E8657" opacity="0.8"/>
    <path d="M-1 25 Q 15 15, 12 35 Q 2 32, -1 25" fill="#2E8657" opacity="0.8"/>
    
    <!-- Flower head (Vibrant/Upright) -->
    <g transform="translate(0, -10)">
      <circle cx="0" cy="0" r="16" fill="#F4B942" opacity="0.3"/>
      <!-- Petals -->
      <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F4B942"/>
      <ellipse cx="11" cy="-6" rx="6" ry="10" transform="rotate(60 11 -6)" fill="#F4B942"/>
      <ellipse cx="11" cy="6" rx="6" ry="10" transform="rotate(120 11 6)" fill="#EB9A2F"/>
      <ellipse cx="0" cy="12" rx="6" ry="10" fill="#EB9A2F"/>
      <ellipse cx="-11" cy="6" rx="6" ry="10" transform="rotate(240 -11 6)" fill="#EB9A2F"/>
      <ellipse cx="-11" cy="-6" rx="6" ry="10" transform="rotate(300 -11 -6)" fill="#F4B942"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="6" fill="#D97724"/>
    </g>
  </g>

  <!-- Transition Arrow / Motion lines showing decay over time -->
  <g opacity="0.4" stroke="#7E8C9E" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <path d="M 98 100 Q 120 85, 142 100"/>
  </g>

  <!-- Right: The Withered state (凋谢 - Primary Focus) -->
  <g transform="translate(170, 115)">
    <!-- Drooping stem -->
    <path d="M0 70 Q 10 30, -5 10 Q -12 0, -2 -5" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Withered leaf on stem -->
    <path d="M3 45 Q 20 40, 15 55 Q 5 52, 3 45" fill="#4A5568" opacity="0.6"/>

    <!-- Drooping, curling flower head -->
    <g transform="translate(-2, -8) rotate(25)">
      <!-- Faded, shrinking petals -->
      <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#7E8C9E" opacity="0.7"/>
      <ellipse cx="8" cy="-4" rx="4" ry="7" transform="rotate(60 8 -4)" fill="#687385" opacity="0.7"/>
      <ellipse cx="8" cy="4" rx="4" ry="7" transform="rotate(120 8 4)" fill="#5A6475" opacity="0.7"/>
      <ellipse cx="0" cy="8" rx="4" ry="7" fill="#5A6475" opacity="0.7"/>
      <ellipse cx="-8" cy="4" rx="4" ry="7" transform="rotate(240 -8 4)" fill="#687385" opacity="0.7"/>
      <ellipse cx="-8" cy="-4" rx="4" ry="7" transform="rotate(300 -8 -4)" fill="#7E8C9E" opacity="0.7"/>
      <!-- Shrunken center -->
      <circle cx="0" cy="0" r="4.5" fill="#4A5568"/>
    </g>

    <!-- Detached, falling petals (零落) -->
    <g transform="translate(0, 5)">
      <!-- Falling petal 1 (mid-air, tilting) -->
      <path d="M -15 20 Q -10 15, -5 22 Q -12 28, -15 20" fill="#7E8C9E" opacity="0.8" transform="rotate(-30 -15 20)"/>
      
      <!-- Falling petal 2 (drifting lower) -->
      <path d="M 12 40 Q 18 35, 20 45 Q 12 48, 12 40" fill="#687385" opacity="0.6" transform="rotate(45 12 40)"/>

      <!-- Fallen petals resting on the ground -->
      <ellipse cx="-25" cy="68" rx="5" ry="2" fill="#5A6475" transform="rotate(-15 -25 68)" opacity="0.7"/>
      <ellipse cx="-8" cy="70" rx="6" ry="2" fill="#687385" transform="rotate(10 -8 70)" opacity="0.8"/>
      <ellipse cx="15" cy="69" rx="5" ry="2" fill="#4A5568" transform="rotate(-5 15 69)" opacity="0.7"/>
    </g>
  </g>

</svg>