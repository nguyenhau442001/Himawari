<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Path representing the journey/road winding up -->
    <path d="M 60 190 Q 90 170 120 140 T 150 90 Q 165 65 180 50" fill="none" stroke="#2C323B" stroke-width="12" stroke-linecap="round"/>
    <path d="M 60 190 Q 90 170 120 140 T 150 90 Q 165 65 180 50" fill="none" stroke="#3A4250" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
    
    <!-- Distractions/Temptations along the path -->
    <!-- Gold coin / Temptation 1 -->
    <circle cx="145" cy="120" r="12" fill="#222831" stroke="#F59E0B" stroke-width="3"/>
    <text x="145" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F59E0B" text-anchor="middle">$</text>
    
    <!-- Diamond / Temptation 2 -->
    <polygon points="85,150 95,140 105,150 95,165" fill="#222831" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- The Core Object: A glowing compass / seed at the origin (representing original intent/chūzhōng) -->
    <!-- Compass/Origin base at the bottom left -->
    <g transform="translate(60, 190)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="22" fill="#161920" stroke="#F59E0B" stroke-width="3"/>
      <!-- Inner glowing seed/compass needle -->
      <circle cx="0" cy="0" r="14" fill="#1A1D24"/>
      <!-- Glowing spark representing the pure original aspiration -->
      <path d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- The traveler reaching the top with the glowing essence connected back -->
    <g transform="translate(180, 50)">
      <!-- Glowing connection beam to original intent -->
      <path d="M -120 140 Q -80 70 0 0" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      
      <!-- Traveler marker / Peak point -->
      <circle cx="0" cy="0" r="16" fill="#F59E0B" opacity="0.2"/>
      <circle cx="0" cy="0" r="10" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>
  </g>
</svg>