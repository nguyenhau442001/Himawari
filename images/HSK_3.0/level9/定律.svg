<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Orbiting Planet/Gravity Concept -->
  <g transform="translate(120, 120)">
    <!-- Central Mass (Sun/Anchor) -->
    <circle cx="0" cy="0" r="22" fill="#FFB84D"/>
    <circle cx="0" cy="0" r="22" fill="url(#grad1)" opacity="0.3"/>
    
    <!-- Orbital Path -->
    <ellipse cx="0" cy="0" rx="85" ry="45" fill="none" stroke="#3A404D" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Orbiting Body -->
    <circle cx="85" cy="0" r="12" fill="#4D9FFF"/>
    
    <!-- Gravitational Force Lines (Subtle) -->
    <path d="M 22 0 L 73 0" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>