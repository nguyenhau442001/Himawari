<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background accent rays/glow -->
  <circle cx="120" cy="120" r="85" fill="#222630" opacity="0.6"/>
  <path d="M120 35 L120 205" stroke="#2B313F" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M35 120 L205 120" stroke="#2B313F" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Conceptual Object: An ancient, sturdy Chinese brush (Máo-bǐ) etching an eternal, unbreakable glowing mountain/path -->
  <!-- We choose a physical object: A resilient stone pillar enduring wind and time, or an unyielding mountain climber's pick/flag, 
       or an eternal ink stone & brush carving deeply into rock. Let's make it a massive, sturdy stone pillar/monolith being steadily carved 
       by a perpetual golden chisel/brush, representing enduring perseverance. 
       Wait, constraint 1: "Center a clear, iconic, and unmistakable physical object or character representing the word."
       Let's use an iconic, majestic mountain peak with a steady glowing summit path & flag, struck by a resilient evergreen pine tree (Pines represent 持之以恒 / longevity / resilience in Chinese culture). -->

  <!-- Mountain Base / Rock Formations (Solid, Enduring) -->
  <path d="M60 175 L120 90 L180 175 Z" fill="#2E3646"/>
  <path d="M90 175 L120 120 L160 175 Z" fill="#3B4459"/>

  <!-- Core Object: The Resilient Pine Tree (Symbol of Perseverance / 坚韧) growing out of rock -->
  <!-- Trunk -->
  <path d="M116 175 L116 135 L124 135 L124 175 Z" fill="#7A583B"/>
  
  <!-- Pine layers (Evergreen foliage - flat layered vector design) -->
  <path d="M95 140 L120 100 L145 140 Z" fill="#2E6B4E"/>
  <path d="M90 120 L120 75 L150 120 Z" fill="#347D5B"/>
  <path d="M98 100 L120 55 L142 100 Z" fill="#3D936B"/>

  <!-- Golden Accent: Steady beam of enduring light shining from above (Perseverance over time) -->
  <path d="M120 25 L120 55" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="22" r="4" fill="#F5A623"/>

  <!-- Solid Root Anchor in stone -->
  <path d="M105 175 C105 185 135 185 135 175" fill="none" stroke="#242B38" stroke-width="6" stroke-linecap="round"/>

  <!-- Base platform ring -->
  <ellipse cx="120" cy="177" r="55" fill="none" stroke="#F5A623" stroke-width="2" opacity="0.3"/>
  <ellipse cx="120" cy="177" r="65" fill="none" stroke="#F5A623" stroke-width="1" opacity="0.15"/>

  <!-- Sparkle accents representing steady progress/time -->
  <circle cx="80" cy="85" r="2.5" fill="#F5A623" opacity="0.8"/>
  <circle cx="160" cy="95" r="2" fill="#F5A623" opacity="0.8"/>
  <circle cx="100" cy="50" r="1.5" fill="#F5A623" opacity="0.9"/>

</svg>