<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to highlight the central subject -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual illustration: A sturdy, unpolished jade core/gem resting on a rustic base, 
       representing "本色" (innate quality, true nature, authentic self).
       Using an unrefined yet brilliant natural mineral block with a glowing golden core 
       to symbolize genuine, unyielding inner character. -->

  <!-- Rustic stone/earth foundation (representing the working roots/down-to-earth nature) -->
  <path d="M 75 165 L 165 165 L 180 185 L 60 185 Z" fill="#3E4451"/>
  <path d="M 68 185 L 172 185 L 178 193 L 62 193 Z" fill="#2C313C"/>

  <!-- Outer rough shell (matte, textured dark slate/clay representation) -->
  <path d="M 90 95 L 150 95 L 170 135 L 150 165 L 90 165 L 70 135 Z" fill="#4B5563"/>
  <path d="M 90 95 L 120 95 L 105 165 L 90 165 Z" fill="#374151"/>

  <!-- Inner authentic brilliance / true core (Vibrant Gold/Amber accent, glowing innate quality) -->
  <polygon points="120,70 148,105 135,150 105,150 92,105" fill="#1A1D24"/>
  <path d="M 120,75 L 143,107 L 131,145 L 109,145 L 97,107 Z" fill="#F59E0B"/>

  <!-- Facets of the inner gem showing pure character -->
  <polygon points="120,75 143,107 120,125" fill="#FBBF24"/>
  <polygon points="120,75 97,107 120,125" fill="#D97706"/>
  <polygon points="97,107 109,145 120,125" fill="#B45309"/>
  <polygon points="143,107 131,145 120,125" fill="#F59E0B"/>

  <!-- Highlight glint on the core to emphasize precious authenticity -->
  <polygon points="120,85 128,105 120,115 112,105" fill="#FEF3C7" opacity="0.8"/>

  <!-- Clean minimalist accent floating particles representing enduring spirit -->
  <circle cx="85" cy="80" r="2.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="160" cy="85" r="2" fill="#F59E0B" opacity="0.6"/>
  <circle cx="155" cy="140" r="3" fill="#F59E0B" opacity="0.7"/>
  <circle cx="88" cy="145" r="1.5" fill="#F59E0B" opacity="0.5"/>
</svg>