<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#162238" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Architectural Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <linearGradient id="roofDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Lantern Red Gradient -->
    <linearGradient id="redLantern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Motion Blur Effect for "Endless Flow" -->
    <filter id="motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8, 0" />
    </filter>
  </defs>

  <!-- Full-Bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- DISTANT SCENERY & SKY -->
  <!-- Soft Glowing Moon/Atmosphere -->
  <circle cx="120" cy="50" r="30" fill="#fef08a" opacity="0.05" />

  <!-- Distant Mountains/Pagoda Silhouettes -->
  <path d="M0 120 L30 100 L60 115 L100 90 L140 110 L180 85 L210 105 L240 95 L240 160 L0 160 Z" fill="#131c2e" />

  <!-- Traditional Architecture Roofline (Background Street) -->
  <path d="M-10 90 Q 30 75 70 90 L80 110 L-10 110 Z" fill="url(#roofDark)" />
  <path d="M70 90 Q 120 70 170 90 L180 110 L60 110 Z" fill="url(#roofGrad)" />
  <path d="M160 85 Q 200 70 250 85 L250 115 L150 115 Z" fill="url(#roofDark)" />

  <!-- Glowing Red Lanterns hung across the street -->
  <g>
    <!-- Lantern 1 -->
    <line x1="45" y1="70" x2="45" y2="85" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="45" cy="85" rx="7" ry="9" fill="url(#redLantern)" />
    <circle cx="45" cy="85" r="9" fill="url(#lanternGlow)" />
    <!-- Lantern 2 -->
    <line x1="95" y1="65" x2="95" y2="80" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="95" cy="80" rx="7" ry="9" fill="url(#redLantern)" />
    <circle cx="95" cy="80" r="9" fill="url(#lanternGlow)" />
    <!-- Lantern 3 -->
    <line x1="145" y1="68" x2="145" y2="83" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="145" cy="83" rx="7" ry="9" fill="url(#redLantern)" />
    <circle cx="145" cy="83" r="9" fill="url(#lanternGlow)" />
    <!-- Lantern 4 -->
    <line x1="195" y1="65" x2="195" y2="80" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="195" cy="80" rx="7" ry="9" fill="url(#redLantern)" />
    <circle cx="195" cy="80" r="9" fill="url(#lanternGlow)" />
  </g>

  <!-- MID-GROUND: SHOPHOUSES & SIDEWALK -->
  <!-- Street Facade / Shops -->
  <rect x="0" y="110" width="240" height="50" fill="#0f172a" />
  <!-- Warm lights spilling from shops -->
  <rect x="15" y="115" width="35" height="45" fill="#f59e0b" opacity="0.15" rx="2" />
  <rect x="75" y="115" width="45" height="45" fill="#f59e0b" opacity="0.2" rx="2" />
  <rect x="145" y="115" width="35" height="45" fill="#f59e0b" opacity="0.15" rx="2" />
  <rect x="195" y="115" width="30" height="45" fill="#f59e0b" opacity="0.2" rx="2" />

  <!-- Street Pavement / Floor Base -->
  <path d="M0 155 Q 120 150 240 155 L240 240 L0 240 Z" fill="#1e293b" />
  <!-- Stone Tile Lines (Perspective) -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="1" stroke-dasharray="8, 12" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="1" stroke-dasharray="12, 16" />
  <line x1="0" y1="225" x2="240" y2="225" stroke="#334155" stroke-width="1" stroke-dasharray="16, 20" />

  <!-- FOREGROUND / ACTIVE CROWD (络绎不绝 - Continuous Flow of Tourists) -->
  <!-- We create overlapping characters moving rhythmically from right to left or weaving through, suggesting a continuous stream. -->

  <!-- Character Group 1: Background Layer (Faded, moving right) -->
  <g opacity="0.4" transform="translate(15, -5)">
    <!-- Person 1 -->
    <circle cx="150" cy="140" r="6" fill="#cbd5e1" />
    <path d="M143 148 Q 150 145 157 148 L155 168 L145 168 Z" fill="#3b82f6" />
  </g>
  <g opacity="0.5" transform="translate(-20, 0)">
    <!-- Person 2 -->
    <circle cx="100" cy="145" r="7" fill="#f1f5f9" />
    <path d="M92 153 Q 100 150 108 153 L106 175 L94 175 Z" fill="#ec4899" />
  </g>

  <!-- Character Group 2: Mid-Layer Flow (Detailed Tourists walking) -->
  
  <!-- Tourist A (Couple taking photos / holding camera) -->
  <g transform="translate(55, 12)">
    <!-- Shadow -->
    <ellipse cx="14" cy="193" rx="10" ry="3" fill="#020617" opacity="0.6" />
    <!-- Body & Backpack -->
    <rect x="8" y="162" width="12" height="18" rx="4" fill="#10b981" />
    <rect x="14" y="164" width="7" height="14" rx="2" fill="#047857" /> <!-- Backpack -->
    <!-- Head & Hair -->
    <circle cx="14" cy="153" r="7" fill="#fbcfe8" />
    <path d="M7 151 Q 14 145 21 151 L20 156 Q 14 153 8 156 Z" fill="#b45309" />
    <!-- Limbs -->
    <line x1="10" y1="180" x2="7" y2="192" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="180" x2="21" y2="192" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Camera in hands -->
    <rect x="12" y="170" width="8" height="6" rx="1" fill="#94a3b8" />
    <circle cx="16" cy="173" r="2" fill="#38bdf8" />
  </g>

  <!-- Tourist B (Walking companion, pointing at lights) -->
  <g transform="translate(25, 8)">
    <!-- Shadow -->
    <ellipse cx="14" cy="197" rx="10" ry="3" fill="#020617" opacity="0.6" />
    <!-- Body -->
    <path d="M8 166 L20 166 L18 184 L10 184 Z" fill="#38bdf8" />
    <!-- Head & Cap -->
    <circle cx="14" cy="157" r="7" fill="#fde047" />
    <path d="M7 155 Q 14 150 21 155 L18 158 L10 158 Z" fill="#0284c7" />
    <!-- Pointing Arm -->
    <path d="M18 170 Q 25 165 28 162" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <line x1="11" y1="184" x2="8" y2="196" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="17" y1="184" x2="20" y2="196" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Character Group 3: Foreground (Prominent, sharp focus, vibrant details) -->
  
  <!-- Main Tourist C (Family with child / smiling traveler with souvenir) -->
  <g transform="translate(100, 15)">
    <!-- Drop Shadow -->
    <ellipse cx="16" cy="202" rx="12" ry="4" fill="#020617" opacity="0.7" />
    
    <!-- Torso / Jacket -->
    <path d="M9 168 Q 16 165 23 168 L25 190 Q 16 193 7 190 Z" fill="#fb923c" />
    <!-- Scarf -->
    <path d="M11 166 Q 16 172 21 166 L23 172 Q 16 177 9 172 Z" fill="#ef4444" />
    
    <!-- Head & Cheerful Expression -->
    <circle cx="16" cy="157" r="8" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M8 156 Q 16 147 24 156 L22 161 Q 16 153 10 161 Z" fill="#78350f" />
    <!-- Smiling Face details (implied through cozy posture) -->
    
    <!-- Arm holding shopping bag / souvenir -->
    <path d="M22 172 Q 28 178 26 186" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Souvenir Bag -->
    <rect x="23" y="184" width="7" height="9" rx="1" fill="#facc15" />
    <path d="M24 184 Q 26.5 181 29 184" stroke="#ca8a04" stroke-width="1.5" fill="none" />

    <!-- Legs Walking -->
    <line x1="12" y1="190" x2="9" y2="201" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="20" y1="190" x2="23" y2="201" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Child riding on shoulders / accompanying -->
  <g transform="translate(145, 2)">
    <!-- Shadow -->
    <ellipse cx="15" cy="213" rx="14" ry="4" fill="#020617" opacity="0.7" />
    
    <!-- Adult Body carrying -->
    <path d="M8 175 Q 15 170 22 175 L25 208 Q 15 212 5 208 Z" fill="#8b5cf6" />
    <!-- Head -->
    <circle cx="15" cy="163" r="9" fill="#ffedd5" />
    <path d="M7 161 Q 15 152 23 161 L21 166 Q 15 159 9 166 Z" fill="#312e81" />
    
    <!-- Legs -->
    <line x1="11" y1="205" x2="8" y2="212" stroke="#4c1d95" stroke-width="4" stroke-linecap="round" />
    <line x1="19" y1="205" x2="22" y2="212" stroke="#4c1d95" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Additional Stream Silhouette (Right edge, suggesting infinite continuous crowd) -->
  <g opacity="0.7" transform="translate(195, 20)">
    <circle cx="15" cy="160" r="7" fill="#cbd5e1" />
    <path d="M9 168 L21 168 L19 190 L11 190 Z" fill="#ec4899" />
    <line x1="13" y1="190" x2="10" y2="201" stroke="#be185d" stroke-width="3" stroke-linecap="round" />
    <line x1="17" y1="190" x2="20" y2="201" stroke="#be185d" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Atmospheric Festival Details / Floating Sparkles (Joyful vibe) -->
  <g fill="#fde047">
    <circle cx="70" cy="100" r="1.5" opacity="0.8" />
    <circle cx="115" cy="95" r="2" opacity="0.9" />
    <circle cx="165" cy="105" r="1" opacity="0.7" />
    <circle cx="130" cy="130" r="1.5" opacity="0.6" />
    <circle cx="40" cy="135" r="2" opacity="0.8" />
    <circle cx="190" cy="120" r="1.5" opacity="0.9" />
  </g>

  <!-- Festive Ribbon / Streamer fluttering above -->
  <path d="M 0 65 Q 60 45 120 60 T 240 55" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.6" filter="url(#motionBlur)" />
  <path d="M 0 68 Q 60 48 120 63 T 240 58" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Frame border / Vignette for clean illustration presentation -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>