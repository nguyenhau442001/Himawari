<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle grid / glow elements for atmosphere -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>
  <path d="M120 40 L120 200 M40 120 L200 120" stroke="#2D3340" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Central Noun Illustration: Prisoner of War (俘虏 - fúlǔ) -->
  <!-- We visualize a minimalist, respectful captive figure in silhouette/uniform with hands bound or held lowered, standing dignified, matching the Geneva convention humane context -->
  
  <g transform="translate(0, 10)">
    <!-- Ground shadow / base -->
    <ellipse cx="120" cy="180" rx="45" ry="8" fill="#121418"/>

    <!-- Detaining restraint/guard elements (subtle barrier lines behind) -->
    <line x1="85" y1="70" x2="85" y2="175" stroke="#3A4250" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="155" y1="70" x2="155" y2="175" stroke="#3A4250" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Prisoner Character -->
    <!-- Torso / Uniform (muted slate blue) -->
    <path d="M95 125 L90 170 L150 170 L145 125 Z" fill="#3D4A5C"/>
    
    <!-- Shoulders & Upper Body -->
    <path d="M92 125 C92 110, 148 110, 148 125 Z" fill="#4E5D73"/>

    <!-- Head & Helmet/Cap -->
    <!-- Head/Face profile or forward facing neutral -->
    <circle cx="120" cy="88" r="18" fill="#E6EDF5"/>
    <!-- Simple cap / military styling -->
    <path d="M101 82 C101 73, 139 73, 139 82 Z" fill="#3D4A5C"/>
    <path d="M100 82 L132 80 L128 85 L104 85 Z" fill="#2D3542"/>

    <!-- Hands in front (restrained respectfully or held together, orange accent for focal point) -->
    <circle cx="120" cy="142" r="10" fill="#E6EDF5"/>
    <!-- Restraint band with high-contrast accent color (orange/gold) representing status/prisoner identification -->
    <rect x="110" y="138" width="20" height="8" rx="3" fill="#F39C12"/>

    <!-- Minimalist neutral expression line -->
    <line x1="116" y1="94" x2="124" y2="94" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Focus framing accent ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#F39C12" stroke-width="2" opacity="0.3"/>
</svg>