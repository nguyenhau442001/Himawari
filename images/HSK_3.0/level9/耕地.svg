<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Rich Soil Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Furrow Gradient for Cultivated Land -->
    <linearGradient id="furrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#572507"/>
    </linearGradient>
    
    <!-- Light Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="80" r="120" fill="url(#sunGlow)" />

  <!-- Distant Hills / Horizon -->
  <path d="M0 120 Q60 100 120 115 T240 110 L240 140 L0 140 Z" fill="#334155" opacity="0.5"/>

  <!-- Cultivated Land (耕地) Base -->
  <path d="M0 130 C60 120, 180 120, 240 130 L240 220 C180 230, 60 230, 0 220 Z" fill="url(#soilGrad)" />

  <!-- Perspective Furrows / Plowed Rows showing rich soil (耕地很肥沃) -->
  <!-- Row 1 -->
  <path d="M20 145 C70 140, 110 145, 130 235 L110 235 C95 160, 50 155, 10 150 Z" fill="url(#furrowGrad)" />
  <!-- Row 2 -->
  <path d="M70 148 C110 145, 150 150, 185 240 L160 240 C130 165, 100 160, 60 155 Z" fill="url(#furrowGrad)" />
  <!-- Row 3 -->
  <path d="M120 152 C155 150, 190 155, 235 245 L210 245 C175 168, 145 162, 110 158 Z" fill="url(#furrowGrad)" />

  <!-- Rich Nutrients / Sparkles indicating "肥沃" (fertile) -->
  <g fill="#10b981">
    <circle cx="85" cy="170" r="2.5" opacity="0.8"/>
    <circle cx="145" cy="185" r="2" opacity="0.9"/>
    <circle cx="105" cy="205" r="3" opacity="0.7"/>
    <circle cx="170" cy="165" r="2" opacity="0.8"/>
    <circle cx="55" cy="190" r="2.5" opacity="0.9"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="95" cy="160" r="2" opacity="0.8"/>
    <circle cx="130" cy="215" r="2.5" opacity="0.9"/>
    <circle cx="65" cy="175" r="1.5" opacity="0.7"/>
    <circle cx="155" cy="170" r="2" opacity="0.9"/>
  </g>

  <!-- Lush Sprouting Crops (Showing fertility and growth) -->
  <!-- Crop cluster 1 -->
  <g transform="translate(45, 150)">
    <path d="M0 5 Q -8 -15, -15 -10 C -20 -5, -10 5, 0 5 Z" fill="#10b981"/>
    <path d="M0 5 Q 8 -18, 15 -12 C 20 -5, 10 5, 0 5 Z" fill="#34d399"/>
    <path d="M0 8 Q 2 -12, 0 -22 C -2 -12, 0 8, 0 8 Z" fill="#059669"/>
  </g>

  <!-- Crop cluster 2 (Center-left) -->
  <g transform="translate(95, 158)">
    <path d="M0 5 Q -10 -20, -18 -12 C -24 -4, -10 8, 0 5 Z" fill="#10b981"/>
    <path d="M0 5 Q 12 -22, 20 -15 C 26 -7, 12 6, 0 5 Z" fill="#34d399"/>
    <path d="M0 8 Q -1 -15, 0 -26 C 1 -15, 0 8, 0 8 Z" fill="#059669"/>
  </g>

  <!-- Crop cluster 3 (Center-right, larger/thriving) -->
  <g transform="translate(140, 168)">
    <path d="M0 5 Q -12 -25, -22 -18 C -30 -10, -12 8, 0 5 Z" fill="#34d399"/>
    <path d="M0 5 Q 10 -28, 22 -20 C 30 -12, 10 6, 0 5 Z" fill="#10b981"/>
    <path d="M0 8 Q 2 -18, 0 -32 C -2 -18, 0 8, 0 8 Z" fill="#059669"/>
  </g>

  <!-- Crop cluster 4 (Foreground right) -->
  <g transform="translate(185, 185)">
    <path d="M0 5 Q -8 -20, -18 -15 C -25 -8, -8 5, 0 5 Z" fill="#10b981"/>
    <path d="M0 5 Q 10 -22, 18 -16 C 25 -10, 10 5, 0 5 Z" fill="#34d399"/>
    <path d="M0 8 Q 0 -15, 0 -28 C 0 -15, 0 8, 0 8 Z" fill="#059669"/>
  </g>

  <!-- Expressive Character: Farmer inspecting the fertile soil proudly -->
  <g transform="translate(0, 5)">
    <!-- Farmer Body / Torso (Blue overalls / shirt) -->
    <path d="M 95 125 L 125 125 L 132 165 L 88 165 Z" fill="#38bdf8"/>
    <!-- Overalls straps -->
    <path d="M 102 125 L 105 145" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M 118 125 L 115 145" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Farmer Head -->
    <circle cx="110" cy="105" r="14" fill="#fb923c"/>

    <!-- Friendly Face / Expression (Smiling proudly at the rich land) -->
    <path d="M 104 102 Q 107 105 110 102" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 114 102 Q 117 105 120 102" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 108 111 Q 110 114 113 111" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Straw Hat -->
    <ellipse cx="110" cy="94" rx="20" ry="6" fill="#fde047"/>
    <path d="M 98 92 C 98 84, 122 84, 122 92 Z" fill="#facc15"/>

    <!-- Bent Arm Pointing/Examining -->
    <path d="M 95 130 C 80 135, 75 120, 85 115" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Other arm resting on hip -->
    <path d="M 125 130 C 138 135, 142 145, 135 155" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Farming Tool: Wooden Hoe planted in the fertile ground -->
  <g transform="translate(170, 110)">
    <!-- Handle -->
    <path d="M 20 10 L 5 70" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <!-- Metal Blade -->
    <path d="M 1 65 L 14 68 L 10 78 L -2 75 Z" fill="#94a3b8"/>
    <path d="M 1 65 L 14 68 L 10 78 L -2 75 Z" stroke="#64748b" stroke-width="1" fill="none"/>
  </g>

  <!-- Floating Nature Elements / Butterflies / Air life -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8">
    <!-- Butterfly 1 -->
    <path d="M 50 75 Q 45 68, 40 72 Q 45 78, 50 75 Q 55 68, 60 72 Q 55 78, 50 75"/>
    <!-- Butterfly 2 -->
    <path d="M 180 60 Q 175 53, 170 57 Q 175 63, 180 60 Q 185 53, 190 57 Q 185 63, 180 60"/>
  </g>

  <!-- Sunlight Rays trickling down -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="40" x2="40" y2="130"/>
    <line x1="120" y1="35" x2="110" y2="130"/>
    <line x1="160" y1="40" x2="180" y2="130"/>
  </g>
</svg>