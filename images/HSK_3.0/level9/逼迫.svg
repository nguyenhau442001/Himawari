  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="40" y="140" width="160" height="15" rx="2" fill="#334155"/>
  <rect x="50" y="155" width="10" height="85" fill="#475569"/>
