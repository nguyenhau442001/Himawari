<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="192" rx="64" ry="8" fill="#111318" opacity="0.8"/>

  <!-- Main Luggage (Suitcase 1 - Back/Larger) -->
  <g transform="translate(82, 60)">
    <!-- Telescopic handle extended -->
    <path d="M22 15V-6 M38 15V-6" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <rect x="18" y="-9" width="24" height="4" rx="2" fill="#64748B"/>

    <!-- Case body -->
    <rect x="0" y="15" width="60" height="85" rx="8" fill="#F59E0B"/>
    <!-- Center stripe accent -->
    <rect x="28" y="15" width="4" height="85" fill="#D97706"/>
    <!-- Handle -->
    <path d="M18 15V11C18 9.34315 19.3431 8 21 8H39C40.6569 8 42 9.34315 42 11V15" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Wheels -->
    <rect x="8" y="100" width="8" height="6" rx="2" fill="#334155"/>
    <rect x="44" y="100" width="8" height="6" rx="2" fill="#334155"/>
  </g>

  <!-- Secondary Luggage (Suitcase 2 - Front/Smaller, overlapping) -->
  <g transform="translate(108, 90)">
    <!-- Case body -->
    <rect x="0" y="15" width="52" height="75" rx="7" fill="#3B82F6"/>
    <!-- Zipper/Trim line -->
    <rect x="0" y="27" width="52" height="3" fill="#1D4ED8"/>
    <!-- Handle -->
    <path d="M15 15V11.5C15 10.6716 15.6716 10 16.5 10H35.5C36.3284 10 37 10.6716 37 11.5V15" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Wheels -->
    <rect x="7" y="90" width="6" height="5" rx="1.5" fill="#1E293B"/>
    <rect x="39" y="90" width="6" height="5" rx="1.5" fill="#1E293B"/>
  </g>

  <!-- Travel Bag (Duffel/Backpack element stacked left) -->
  <g transform="translate(48, 115)">
    <!-- Bag body -->
    <rect x="0" y="10" width="45" height="55" rx="10" fill="#EF4444"/>
    <!-- Front pocket -->
    <rect x="6" y="32" width="33" height="26" rx="6" fill="#DC2626"/>
    <!-- Straps/Handles -->
    <path d="M12 10V6C12 4.34315 13.3431 3 15 3H30C31.6569 3 33 4.34315 33 6V10" stroke="#991B1B" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>