<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background glowing aura representing memory/mind activity -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>
  <path d="M90 75 C105 60, 135 60, 150 75" stroke="#3A4456" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Conceptual floating memory elements (representing names, faces, thoughts being captured) -->
  <g opacity="0.85">
    <!-- Abstract user profile node representing "his name" in the context -->
    <circle cx="175" cy="85" r="14" fill="#2E3846"/>
    <circle cx="175" cy="81" r="6" fill="#64748B"/>
    <path d="M163 97 C163 91, 187 91, 187 97" fill="#64748B"/>
    <!-- Connection motion/thought line -->
    <path d="M150 95 L142 102" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  </g>

  <!-- Notebook / Recording surface (representing 'ghi lại' / recording) -->
  <g transform="translate(70, 125)">
    <!-- Notebook cover/base -->
    <rect x="0" y="0" width="80" height="65" rx="6" fill="#2D3748"/>
    <rect x="6" y="6" width="68" height="53" rx="3" fill="#1E293B"/>
    <!-- Notebook spine / binding -->
    <rect x="0" y="0" width="10" height="65" rx="4" fill="#F59E0B"/>
    <!-- Spiral binding rings -->
    <circle cx="5" cy="12" r="1.5" fill="#1E293B"/>
    <circle cx="5" cy="22" r="1.5" fill="#1E293B"/>
    <circle cx="5" cy="32" r="1.5" fill="#1E293B"/>
    <circle cx="5" cy="42" r="1.5" fill="#1E293B"/>
    <circle cx="5" cy="52" r="1.5" fill="#1E293B"/>
    <!-- Written lines inside notebook -->
    <line x1="18" y1="18" x2="55" y2="18" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="30" x2="62" y2="30" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="42" x2="45" y2="42" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Hand & Pen Action (Verb: 记 - writing down, engraving into memory) -->
  <g>
    <!-- Motion lines showing action -->
    <path d="M125 105 C135 110, 140 120, 145 130" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M132 100 C140 105, 145 115, 150 125" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Pen / Stylus -->
    <g transform="translate(135, 95) rotate(-35)">
      <!-- Pen body -->
      <rect x="-3" y="-30" width="6" height="35" rx="2" fill="#F59E0B"/>
      <!-- Pen cap/top -->
      <rect x="-3" y="-35" width="6" height="7" rx="1.5" fill="#D97706"/>
      <!-- Pen tip -->
      <polygon points="-3,5 3,5 0,14" fill="#94A3B8"/>
    </g>

    <!-- Hand holding pen (sleek flat geometric style) -->
    <path d="M125 130 C120 125, 112 120, 105 125 C100 128, 98 135, 105 142 C112 148, 125 140, 130 135 Z" fill="#E2E8F0"/>
    <path d="M115 122 C118 118, 126 116, 132 121 C137 125, 139 132, 135 136" fill="#CBD5E1"/>
  </g>

  <!-- Focal highlight / Spark of memory/recognition -->
  <g transform="translate(85, 90)">
    <circle cx="0" cy="0" r="4" fill="#F59E0B"/>
    <path d="M0 -8 L0 -12 M0 8 L0 12 M-8 0 L-12 0 M8 0 L12 0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>