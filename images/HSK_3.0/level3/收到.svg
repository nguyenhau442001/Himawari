<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow/backdrop for action focus -->
  <circle cx="120" cy="120" r="85" fill="#252A34" opacity="0.6"/>

  <!-- Dynamic Motion Lines representing delivery / arrival -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M 45 75 Q 75 75 95 95" fill="none" stroke-dasharray="4 4"/>
    <path d="M 35 100 Q 60 100 80 110" fill="none"/>
  </g>

  <!-- Flying Envelope / Letter (The Object being received) -->
  <g transform="translate(10, -5) rotate(-15 85 105)">
    <!-- Envelope Shadow -->
    <rect x="70" y="90" width="45" height="32" rx="4" fill="#0F1115" opacity="0.4"/>
    <!-- Envelope Base -->
    <rect x="68" y="88" width="45" height="32" rx="4" fill="#F8FAFC"/>
    <!-- Envelope Flap (open/incoming angle) -->
    <path d="M 68 88 L 90.5 106 L 113 88" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round"/>
    <!-- Internal fold lines -->
    <path d="M 68 120 L 86 104 M 113 120 L 95 104" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Character / Hands (Receiving Action) -->
  <g>
    <!-- Character Torso & Sleeve (Right arm reaching out to receive) -->
    <path d="M 170 170 C 160 145 145 130 125 125 L 140 110 C 170 120 195 145 205 170 Z" fill="#3B82F6"/>
    <path d="M 130 135 L 105 118" stroke="#F59E0B" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Forearm and Hand catching/receiving the letter -->
    <!-- Palm / Fingers cupped gently upwards -->
    <path d="M 85 115 C 90 110 105 112 112 120 C 117 125 115 132 108 135 C 100 138 90 130 85 115 Z" fill="#FBBF24"/>
    <!-- Thumb resting over -->
    <path d="M 98 112 C 103 108 110 112 108 118 C 106 120 101 118 98 112 Z" fill="#F59E0B"/>
  </g>

  <!-- Focus / Success Checkmark Indicator (Subtle accent showing completion/received) -->
  <g transform="translate(150, 65)">
    <circle cx="16" cy="16" r="16" fill="#10B981" opacity="0.2"/>
    <circle cx="16" cy="16" r="12" fill="#10B981"/>
    <path d="M 10 16 L 14 20 L 22 11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>