<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Visual Metaphor: Progression/Escalation of sound pulses -->
  <!-- Baseline/Origin point -->
  <circle cx="60" cy="120" r="6" fill="#FFB800" opacity="0.3"/>
  
  <!-- First pulse (The first "声") -->
  <path d="M80 120 C 80 100, 100 100, 100 120 C 100 140, 80 140, 80 120" fill="none" stroke="#FFB800" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Second pulse (The second "声" - Escalation/Progression) -->
  <path d="M120 120 C 120 80, 160 80, 160 120 C 160 160, 120 160, 120 120" fill="none" stroke="#FFB800" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Third pulse (The peak/exaggerated outcome) -->
  <path d="M180 120 C 180 40, 240 40, 240 120 C 240 200, 180 200, 180 120" fill="none" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Connecting lines showing causality/progression -->
  <line x1="66" y1="120" x2="80" y2="120" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="100" y1="120" x2="120" y2="120" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="160" y1="120" x2="180" y2="120" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
</svg>