<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Visualization for "前年" (The year before last) -->
  <!-- Context: Timeline sequence of 3 years (Past 2 -> Past 1 -> Present) -->
  
  <g transform="translate(0, 15)">
    <!-- Central Timeline Track -->
    <line x1="36" y1="110" x2="204" y2="110" stroke="#2D333D" stroke-width="4" stroke-linecap="round"/>

    <!-- Year Node 3: Current Year (Present) - Dimmed/Subtle -->
    <g transform="translate(180, 110)">
      <circle cx="0" cy="0" r="10" fill="#2D333D"/>
      <circle cx="0" cy="0" r="5" fill="#4B5563"/>
      <!-- Subtle calendar icon outline -->
      <rect x="-10" y="-35" width="20" height="20" rx="3" fill="none" stroke="#4B5563" stroke-width="2"/>
      <line x1="-10" y1="-27" x2="10" y2="-27" stroke="#4B5563" stroke-width="2"/>
    </g>

    <!-- Year Node 2: Last Year (去年) - Medium focus -->
    <g transform="translate(120, 110)">
      <circle cx="0" cy="0" r="12" fill="#242B38"/>
      <circle cx="0" cy="0" r="6" stroke="#6B7280" stroke-width="2" fill="none"/>
      <!-- Calendar icon -->
      <rect x="-12" y="-37" width="24" height="24" rx="4" fill="#242B38" stroke="#6B7280" stroke-width="2"/>
      <line x1="-12" y1="-27" x2="12" y2="-27" stroke="#6B7280" stroke-width="2"/>
      <circle cx="-5" cy="-20" r="1.5" fill="#6B7280"/>
      <circle cx="0" cy="-20" r="1.5" fill="#6B7280"/>
      <circle cx="5" cy="-20" r="1.5" fill="#6B7280"/>
    </g>

    <!-- Year Node 1: The Year Before Last (前年) - PRIMARY FOCUS -->
    <g transform="translate(60, 110)">
      <!-- Outer Pulsing/Focus Ring -->
      <circle cx="0" cy="0" r="28" fill="#F59E0B" opacity="0.15"/>
      <circle cx="0" cy="0" r="20" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
      
      <!-- Prominent Calendar Icon representing the specific year object -->
      <g transform="translate(0, -50)">
        <rect x="-18" y="0" width="36" height="36" rx="6" fill="#242B38" stroke="#F59E0B" stroke-width="2.5"/>
        <!-- Calendar binding rings -->
        <rect x="-10" y="-4" width="4" height="6" rx="2" fill="#F59E0B"/>
        <rect x="6" y="-4" width="4" height="6" rx="2" fill="#F59E0B"/>
        <!-- Calendar grid dots / highlight -->
        <circle cx="-8" cy="10" r="2" fill="#F59E0B"/>
        <circle cx="0" cy="10" r="2" fill="#F59E0B"/>
        <circle cx="8" cy="10" r="2" fill="#F59E0B"/>
        <circle cx="-8" cy="18" r="2" fill="#F59E0B"/>
        <circle cx="0" cy="18" r="2" fill="#F59E0B"/>
        <circle cx="8" cy="18" r="2" fill="#F59E0B"/>
      </g>

      <!-- Jump Indicator / Past direction arrow -->
      <path d="M-15,-35 C-35,-35 -45,-15 -45,15" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
    </g>

    <!-- Visual time-hop arc connecting Present to The Year Before Last -->
    <path d="M 180,90 C 180,45 60,45 60,82" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4" opacity="0.8"/>
    
    <!-- Arrowhead pointing to the target year -->
    <path d="M 54,72 L 60,85 L 68,76" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>