<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.05"/>

  <!-- Exam paper / Test sheet representing the context "考试" -->
  <g transform="translate(75, 45)">
    <!-- Paper base -->
    <rect x="0" y="0" width="90" height="120" rx="6" fill="#2D333B" stroke="#3A424D" stroke-width="2"/>
    <!-- Paper header line -->
    <line x1="15" y1="20" x2="45" y2="20" stroke="#4E5D6C" stroke-width="3" stroke-linecap="round"/>
    <!-- Mock text lines -->
    <line x1="15" y1="40" x2="65" y2="40" stroke="#3A424D" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="56" x2="55" y2="56" stroke="#3A424D" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="72" x2="60" y2="72" stroke="#3A424D" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="88" x2="40" y2="88" stroke="#3A424D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Physical object representing the score/points (得分) - A glowing gold badge/medal with a star -->
  <g transform="translate(120, 115)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="42" fill="#FFB703" opacity="0.15"/>
    
    <!-- Ribbon tails hanging behind -->
    <path d="M-15,25 L-25,55 L-5,42 L0,32 Z" fill="#E63946"/>
    <path d="M15,25 L25,55 L5,42 L0,32 Z" fill="#D90429"/>
    <polygon points="-25,55 -15,25 0,32" fill="#B7094C" opacity="0.3"/>
    
    <!-- Main gold medallion body -->
    <circle cx="0" cy="0" r="34" fill="#1A1D24" stroke="#FFB703" stroke-width="5"/>
    <circle cx="0" cy="0" r="28" fill="#FFB703"/>
    
    <!-- Inner ring detail -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#FFA200" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Star symbol in the center representing high score/achievement -->
    <polygon points="0,-14 3.8,-4.5 14,-4.2 5.8,2 8.8,11.5 0,6 -8.8,11.5 -5.8,2 -14,-4.2 -3.8,-4.5" fill="#1A1D24"/>
  </g>

  <!-- Sparkles highlighting the success / high score -->
  <g fill="#FFD166">
    <path d="M 62,75 Q 65,75 65,72 Q 65,75 68,75 Q 65,75 65,78 Q 65,75 62,75 Z"/>
    <path d="M 180,95 Q 183,95 183,92 Q 183,95 186,95 Q 183,95 183,98 Q 183,95 180,95 Z"/>
    <path d="M 95,160 Q 98,160 98,157 Q 98,160 101,160 Q 98,160 98,163 Q 98,160 95,160 Z"/>
  </g>
</svg>