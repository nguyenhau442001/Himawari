  <circle cx="150" cy="205" r="12" fill="#3E4654"/>
  <circle cx="180" cy="200" r="10" fill="#3E4654"/>
  
  <!-- Festive Confetti/Stars -->
  <path d="M70 70 L73 76 L80 77 L75 82 L77 89 L70 85 L63 89 L65 82 L60 77 L67 76 Z" fill="#FFD700"/>
  <path d="M170 90 L173 96 L180 97 L175 102 L177 109 L170 105 L163 109 L165 102 L160 97 L167 96 Z" fill="#FF9500"/>
</svg>