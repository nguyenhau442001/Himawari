<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stage/Performance Area -->
  <path d="M40 180 L200 180 L190 140 L50 140 Z" fill="#2D343E"/>
  
  <!-- Spotlight Beam -->
  <path d="M120 40 L80 140 L160 140 Z" fill="#FFD700" opacity="0.15"/>
  
