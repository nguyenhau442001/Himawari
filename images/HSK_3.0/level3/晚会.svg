    <rect x="-2" y="-50" width="4" height="50" fill="#A0A0A0"/>
    <circle cx="0" cy="-55" r="8" fill="#FFD700"/>
    <ellipse cx="0" cy="-55" rx="4" ry="6" fill="#E6C200"/>
  </g>
  
