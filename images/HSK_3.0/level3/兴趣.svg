<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (subtle glowing sparks of curiosity) -->
  <circle cx="50" cy="70" r="1.5" fill="#F59E0B" opacity="0.4"/>
  <circle cx="190" cy="60" r="2" fill="#F59E0B" opacity="0.5"/>
  <circle cx="205" cy="170" r="1.5" fill="#3B82F6" opacity="0.4"/>
  <circle cx="35" cy="185" r="2" fill="#3B82F6" opacity="0.5"/>

  <!-- Glowing focal aura behind the central object -->
  <circle cx="120" cy="115" r="55" fill="#F59E0B" opacity="0.12"/>
  <circle cx="120" cy="115" r="40" fill="#F59E0B" opacity="0.18"/>

  <!-- Central Physical Object: Traditional Chinese Hand-painted Scroll (representing Chinese culture interest) -->
  <!-- Scroll wooden roller (bottom) -->
  <rect x="75" y="165" width="90" height="10" rx="5" fill="#D97706"/>
  <rect x="70" y="166" width="7" height="8" rx="2.5" fill="#B45309"/>
  <rect x="163" y="166" width="7" height="8" rx="2.5" fill="#B45309"/>

  <!-- Scroll wooden roller (top) -->
  <rect x="75" y="55" width="90" height="10" rx="5" fill="#D97706"/>
  <rect x="70" y="56" width="7" height="8" rx="2.5" fill="#B45309"/>
  <rect x="163" y="56" width="7" height="8" rx="2.5" fill="#B45309"/>

  <!-- Scroll paper body -->
  <path d="M78 65 L162 65 C164 65, 165 67, 165 70 L165 160 C165 163, 164 165, 162 165 L78 165 C76 165, 75 163, 75 160 L75 70 C75 67, 76 65, 78 65 Z" fill="#F3F4F6"/>
  
  <!-- Scroll inner borders -->
  <rect x="80" y="70" width="80" height="90" fill="#FEF3C7" rx="2"/>

  <!-- Detailed graphic inside scroll: Majestic Mountain & Sun (representing Chinese Landscape Art / Culture) -->
  <!-- Sun -->
  <circle cx="120" cy="95" r="12" fill="#F97316"/>
  
  <!-- Back Mountain -->
  <path d="M85 135 L115 100 L135 120 L155 105 L155 145 L85 145 Z" fill="#9CA3AF" opacity="0.6"/>

  <!-- Front Mountain (Styled with Chinese ink-wash aesthetic in vector) -->
  <path d="M90 145 L125 110 L160 145 Z" fill="#4B5563"/>
  <path d="M115 120 L125 110 L135 122 Z" fill="#F3F4F6"/>

  <!-- Pine Tree silhouette -->
  <path d="M102 145 L102 133 M98 138 L102 133 L106 138 M97 134 L102 128 L107 134" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Spark / Magic of Interest/Curiosity (Orange glowing star hovering top-right of scroll) -->
  <g transform="translate(162, 58)">
    <path d="M0 -8 C0 -2, 2 0, 8 0 C2 0, 0 2, 0 8 C0 2, -2 0, -8 0 C-2 0, 0 -2, 0 -8 Z" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(72, 142) scale(0.6)">
    <path d="M0 -8 C0 -2, 2 0, 8 0 C2 0, 0 2, 0 8 C0 2, -2 0, -8 0 C-2 0, 0 -2, 0 -8 Z" fill="#F59E0B"/>
  </g>

  <!-- Magnifying Glass overlaying the scroll, indicating "Interest/Focus/Explore" -->
  <g transform="translate(125, 105)">
    <!-- Glass circle shadow -->
    <circle cx="0" cy="0" r="24" fill="#1A1D24" opacity="0.3"/>
    <!-- Glass rim -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#3B82F6" stroke-width="5"/>
    <!-- Lens reflection/sheen -->
    <path d="M -12 -12 A 17 17 0 0 1 12 -12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Handle -->
    <path d="M 16 16 L 32 32" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
    <path d="M 16 16 L 32 32" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>