<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow & Elements -->
  <circle cx="120" cy="120" r="80" fill="#222831" opacity="0.5"/>

  <!-- Hospital Building / Room Symbolism (Noun: Place/Institution) -->
  <!-- Base structure representing a hospital ward/room -->
  <g transform="translate(0, 5)">
    <!-- Bed Outer structure / Frame -->
    <rect x="65" y="115" width="110" height="65" rx="8" fill="#2E384D"/>
    <!-- Mattress -->
    <rect x="70" y="120" width="100" height="40" rx="6" fill="#F0F4F8"/>
    <!-- Pillow -->
    <rect x="75" y="125" width="22" height="30" rx="4" fill="#D9E2EC"/>
    <!-- Blanket -->
    <path d="M 95 120 L 170 120 L 170 160 L 95 160 Z" fill="#4C6EF5"/>
    <path d="M 95 120 L 170 120 L 170 160 L 95 160 Z" fill="#3B5bdb" opacity="0.2"/>

    <!-- Patient resting (Simplified head and upper body) -->
    <circle cx="86" cy="140" r="10" fill="#FFCC99"/>
    <path d="M 78 150 C 78 144 94 144 94 150 Z" fill="#4C6EF5"/>

    <!-- IV Pole & Bag (Clinical context for hospital stay) -->
    <line x1="155" y1="85" x2="155" y2="155" stroke="#8A99AD" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="85" x2="155" y2="85" stroke="#8A99AD" stroke-width="2" stroke-linecap="round"/>
    <!-- IV Bag -->
    <path d="M 148 90 L 162 90 L 165 108 L 145 108 Z" fill="#E2E8F0" opacity="0.9"/>
    <path d="M 148 96 L 162 96 L 163 108 L 147 108 Z" fill="#38BDF8"/>
    <!-- IV Tube -->
    <path d="M 155 108 C 155 125 140 120 135 135" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Bed headboard and footboard -->
    <rect x="60" y="105" width="8" height="80" rx="4" fill="#8A99AD"/>
    <rect x="172" y="125" width="6" height="58" rx="3" fill="#8A99AD"/>
    
    <!-- Medical Cross Badge (Signifying Hospital/Medical facility) -->
    <g transform="translate(120, 60)">
      <circle cx="0" cy="0" r="22" fill="#252A34"/>
      <!-- Glowing border ring -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#FF5C5C" stroke-width="2.5"/>
      <!-- Cross icon -->
      <rect x="-3" y="-11" width="6" height="22" rx="2" fill="#FF5C5C"/>
      <rect x="-11" y="-3" width="22" height="6" rx="2" fill="#FF5C5C"/>
    </g>
  </g>
</svg>