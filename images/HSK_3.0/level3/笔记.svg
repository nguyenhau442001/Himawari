<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Centered Physical Object representing "笔记" (Notebook & Pen) -->
  <g transform="translate(120, 120)">
    <!-- Shadow for depth -->
    <ellipse cx="0" cy="85" rx="65" ry="12" fill="#101217" opacity="0.6"/>

    <!-- Open Notebook Background Pages -->
    <path d="M -75 -40 L -75 60 C -75 65 -70 70 -65 70 L 0 70 L 0 -50 L -65 -50 C -70 -50 -75 -45 -75 -40 Z" fill="#2E333D"/>
    <path d="M 75 -40 L 75 60 C 75 65 70 70 65 70 L 0 70 L 0 -50 L 65 -50 C 70 -50 75 -45 75 -40 Z" fill="#363C48"/>

    <!-- Open Notebook Main Pages -->
    <path d="M -70 -45 L -70 55 C -70 60 -65 65 -60 65 L 0 65 L 0 -55 L -60 -55 C -65 -55 -70 -50 -70 -45 Z" fill="#F0F3F6"/>
    <path d="M 70 -45 L 70 55 C 70 60 65 65 60 65 L 0 65 L 0 -55 L 60 -55 C 65 -55 70 -50 70 -45 Z" fill="#E2E7ED"/>

    <!-- Notebook Center Spine Shadow -->
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD2D9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9AA0A6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CBD2D9" stop-opacity="0.8"/>
    </linearGradient>
    <rect x="-4" y="-55" width="8" height="120" fill="url(#spineShadow)"/>

    <!-- Notebook Binding Rings -->
    <g fill="#FFA726">
      <ellipse cx="0" cy="-45" rx="3" ry="5"/>
      <ellipse cx="0" cy="-20" rx="3" ry="5"/>
      <ellipse cx="0" cy="5" rx="3" ry="5"/>
      <ellipse cx="0" cy="30" rx="3" ry="5"/>
      <ellipse cx="0" cy="55" rx="3" ry="5"/>
    </g>

    <!-- Content Lines (Note-taking representation) -->
    <!-- Left Page Lines -->
    <g stroke="#D0D7DE" stroke-width="3" stroke-linecap="round">
      <line x1="-55" y1="-30" x2="-20" y2="-30"/>
      <line x1="-55" y1="-10" x2="-30" y2="-10"/>
      <line x1="-55" y1="10" x2="-25" y2="10"/>
      <line x1="-55" y1="30" x2="-35" y2="30"/>
    </g>

    <!-- Right Page Lines & Highlighted Note -->
    <g stroke="#D0D7DE" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="-30" x2="55" y2="-30"/>
      <line x1="20" y1="-10" x2="45" y2="-10"/>
    </g>
    <!-- Highlighted/Important note line in Accent Orange -->
    <line x1="20" y1="10" x2="55" y2="10" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#D0D7DE" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="30" x2="40" y2="30"/>
    </g>

    <!-- Sleek Modern Pen (Writing implement) -->
    <g transform="translate(45, -5) rotate(25)">
      <!-- Pen Shadow -->
      <path d="M -3 -83 L 3 -83 L 6 97 L -6 97 Z" fill="#000000" opacity="0.3" transform="translate(4, 4)"/>
      
      <!-- Main Pen Body -->
      <path d="M -3 -80 L 3 -80 L 4 60 L -4 60 Z" fill="#4B6584"/>
      
      <!-- Pen Grip/Accent Section -->
      <rect x="-4" y="60" width="8" height="25" fill="#FFA726"/>
      
      <!-- Pen Tip (Metal) -->
      <path d="M -4 85 L 4 85 L 0 100 Z" fill="#DFE6E9"/>
      
      <!-- Pen Tip Center Line -->
      <line x1="0" y1="85" x2="0" y2="100" stroke="#B2BEC3" stroke-width="1"/>

      <!-- Pen Clip -->
      <rect x="-1" y="-75" width="2" height="35" rx="1" fill="#DFE6E9"/>
    </g>

    <!-- Sparkle / Focus Effect (Highlighting precision learning) -->
    <g fill="#FFA726" opacity="0.9">
      <path d="M 45 -45 Q 45 -35 35 -35 Q 45 -35 45 -25 Q 45 -35 55 -35 Q 45 -35 45 -45 Z"/>
      <path d="M -50 -10 Q -50 -2 -42 -2 Q -50 -2 -50 6 Q -50 -2 -58 -2 Q -50 -2 -50 -10 Z" transform="scale(0.7) translate(-20, -50)"/>
    </g>
  </g>
</svg>