<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Composition representing the 4 seasons (季) as a unified circular cycle -->
  <g transform="translate(120, 115)">
    
    <!-- Circular track / background accent -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#2A2F3B" stroke-width="6" stroke-dasharray="8 6"/>

    <!-- Spring (Top Left): Green sprout -->
    <g transform="translate(-45, -45)">
      <circle cx="0" cy="0" r="32" fill="#1E2923"/>
      <path d="M-5 12 C-5 4, -2 0, 5 -8 C10 -14, 5 -20, -2 -18 C-10 -16, -12 -8, -5 12" fill="#4ADE80"/>
      <path d="M-5 12 C-5 4, 2 0, 10 -4" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Summer (Top Right): Sun / Warmth -->
    <g transform="translate(45, -45)">
      <circle cx="0" cy="0" r="32" fill="#2E261D"/>
      <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
      <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-22" x2="0" y2="-26"/>
        <line x1="0" y1="22" x2="0" y2="26"/>
        <line x1="-22" y1="0" x2="-26" y2="0"/>
        <line x1="22" y1="0" x2="26" y2="0"/>
        <line x1="-15" y1="-15" x2="-19" y2="-19"/>
        <line x1="15" y1="15" x2="19" y2="19"/>
        <line x1="15" y1="-15" x2="19" y2="-19"/>
        <line x1="-15" y1="15" x2="-19" y2="19"/>
      </g>
    </g>

    <!-- Autumn (Bottom Right): Falling leaf -->
    <g transform="translate(45, 45)">
      <circle cx="0" cy="0" r="32" fill="#2D221C"/>
      <path d="M-10 12 C2 12, 12 2, 8 -12 C2 -16, -6 -10, -10 12" fill="#FB923C"/>
      <path d="M-10 12 C-4 4, 2 -2, 6 -10" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Winter (Bottom Left): Snowflake -->
    <g transform="translate(-45, 45)">
      <circle cx="0" cy="0" r="32" fill="#1C2530"/>
      <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-18" x2="0" y2="18"/>
        <line x1="-15" y1="-9" x2="15" y2="9"/>
        <line x1="-15" y1="9" x2="15" y2="-9"/>
        <!-- Snowflake crystal tips -->
        <polyline points="0,-18 -4,-14"/>
        <polyline points="0,-18 4,-14"/>
        <polyline points="0,18 -4,14"/>
        <polyline points="0,18 4,14"/>
      </g>
    </g>

    <!-- Center core representing the passing of time / cycle -->
    <circle cx="0" cy="0" r="22" fill="#222733" stroke="#3A4256" stroke-width="3"/>
    <path d="M-8 -2 L4 -8 L0 8 Z" fill="#60A5FA"/>
    <path d="M2 6 L-4 2 L6 -4 Z" fill="#93C5FD" opacity="0.6"/>

  </g>
</svg>