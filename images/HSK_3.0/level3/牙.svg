<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Subtle background glow for the tooth -->
    <circle cx="120" cy="115" r="55" fill="#2D323F" opacity="0.6"/>

    <!-- Sparkle/Pain indicator accents (representing '牙疼' context subtly) -->
    <path d="M 82 72 L 85 78 L 91 81 L 85 84 L 82 90 L 79 84 L 73 81 L 79 78 Z" fill="#F59E0B" opacity="0.8"/>
    <path d="M 162 95 L 164 99 L 168 101 L 164 103 L 162 107 L 160 103 L 156 101 L 160 99 Z" fill="#60A5FA" opacity="0.6"/>

    <!-- Main Tooth Illustration (Noun - 牙) -->
    <g>
      <!-- Tooth Root Left -->
      <path d="M 95 105 C 88 125 90 145 98 160 C 101 166 106 168 110 165 C 114 162 113 155 110 145 C 105 130 105 118 110 105 Z" fill="#E2E8F0"/>
      
      <!-- Tooth Root Right -->
      <path d="M 145 105 C 152 125 150 145 142 160 C 139 166 134 168 130 165 C 126 162 127 155 130 145 C 135 130 135 118 130 105 Z" fill="#CBD5E1"/>

      <!-- Tooth Crown (Main Body) -->
      <path d="M 78 88 
               C 72 75, 85 55, 105 65 
               C 112 52, 128 52, 135 65 
               C 155 55, 168 75, 162 88 
               C 172 102, 165 125, 145 125 
               L 95 125 
               C 75 125, 68 102, 78 88 Z" 
            fill="#F8FAFC" 
            stroke="#94A3B8" 
            stroke-width="3" 
            stroke-linejoin="round"/>

      <!-- Crown Highlights / 3D shading lines -->
      <path d="M 90 75 C 96 70, 104 72, 108 80" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 132 75 C 126 70, 118 72, 114 80" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Gentle face/expression to keep it engaging and friendly for learning -->
      <circle cx="103" cy="98" r="4" fill="#334155"/>
      <circle cx="137" cy="98" r="4" fill="#334155"/>
      <path d="M 115 107 Q 120 112 125 107" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Medical/Clinical cross accent badge at the base -->
    <g transform="translate(120, 195)">
      <circle cx="0" cy="0" r="16" fill="#F59E0B"/>
      <rect x="-8" y="-3" width="16" height="6" rx="2" fill="#1A1D24"/>
      <rect x="-3" y="-8" width="6" height="16" rx="2" fill="#1A1D24"/>
    </g>
  </g>
</svg>