<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements representing the "match/event" context -->
  <circle cx="120" cy="120" r="60" fill="#252932" />
  <path d="M90 100 L150 100 L140 140 L100 140 Z" fill="#323844" />
  
  <!-- Human character focusing/watching (Action: leaning forward, eyes directed) -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 120 C40 100, 80 100, 80 120 L80 150 L40 150 Z" fill="#FFB84D"/>
    <!-- Head -->
    <circle cx="60" cy="85" r="20" fill="#FFD580"/>
    <!-- Eyes directed towards the center -->
    <circle cx="68" cy="82" r="3" fill="#1A1D24"/>
    <!-- Motion lines indicating focus/attention -->
    <path d="M85 85 L105 85" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
    <path d="M88 75 L100 70" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
    <path d="M88 95 L100 100" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Second character observing -->
  <g transform="translate(100, 80)">
    <path d="M40 120 C40 100, 80 100, 80 120 L80 150 L40 150 Z" fill="#FFB84D" opacity="0.8"/>
    <circle cx="60" cy="85" r="20" fill="#FFD580" opacity="0.8"/>
    <circle cx="68" cy="82" r="3" fill="#1A1D24"/>
  </g>

  <!-- The object of attention (a stylized scoreboard/event marker) -->
  <rect x="105" y="110" width="30" height="20" rx="4" fill="#FFB84D"/>
  <rect x="110" y="115" width="20" height="2" fill="#1A1D24"/>
  <rect x="110" y="120" width="10" height="2" fill="#1A1D24"/>
</svg>