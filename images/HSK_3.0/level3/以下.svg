<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ground Line / Reference Plane -->
  <line x1="50" y1="185" x2="190" y2="185" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>

  <!-- Dimension Indicator Area (Below marker) -->
  <!-- Dashed vertical indicator line pointing downward -->
  <line x1="120" y1="75" x2="120" y2="165" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Arrow pointing down (representing "以下" / "at and below") -->
  <polygon points="115,160 125,160 120,170" fill="#F59E0B"/>
  
  <!-- Benchmark Line at upper boundary (Age 6 reference height) -->
  <line x1="90" y1="75" x2="150" y2="75" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

  <!-- Child Character (Representing "六岁以下的孩子" - Child at/below age 6) -->
  <!-- Positioned clearly BELOW the benchmark line -->
  
  <!-- Child Body / Outfit (Orange/Teal flat style) -->
  <!-- Head -->
  <circle cx="120" cy="120" r="20" fill="#FCE7F3"/>
  
  <!-- Hair -->
  <path d="M101 115 C 101 103, 139 103, 139 115 C 139 118, 137 122, 135 120 C 120 108, 115 110, 105 120 C 103 122, 101 118, 101 115 Z" fill="#4B3621"/>

  <!-- Face details (cute, simple) -->
  <circle cx="113" cy="120" r="2" fill="#1A1D24"/>
  <circle cx="127" cy="120" r="2" fill="#1A1D24"/>
  <path d="M118 126 Q 120 129 122 126" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Torso (Jacket/Shirt) -->
  <path d="M104 140 C 104 132, 136 132, 136 140 L 140 175 L 100 175 Z" fill="#0EA5E9"/>

  <!-- Arms (Friendly lowered posture) -->
  <path d="M104 142 L 90 158" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round"/>
  <path d="M136 142 L 150 158" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="90" cy="160" r="3" fill="#FCE7F3"/>
  <circle cx="150" cy="160" r="3" fill="#FCE7F3"/>

  <!-- Legs -->
  <line x1="112" y1="175" x2="112" y2="185" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="175" x2="128" y2="185" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

  <!-- Focus Accent: Ticket / Icon of Concept Context Floating Gently -->
  <!-- Small ticket icon near the child to tie into the contextual reference (ticket-free below age 6) -->
  <rect x="145" y="95" width="26" height="16" rx="3" fill="#334155" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="145" cy="103" r="2.5" fill="#1A1D24"/>
  <circle cx="171" cy="103" r="2.5" fill="#1A1D24"/>
  <line x1="155" y1="103" x2="161" y2="103" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="1,2"/>

</svg>