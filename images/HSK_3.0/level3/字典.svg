<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Shadow / Glow effect for focal point -->
    <ellipse cx="0" cy="55" rx="70" ry="14" fill="#0D0F14" opacity="0.6"/>

    <!-- Bookmark ribbon trailing down -->
    <path d="M 0,-35 L 14,-55 L 14,-15 Z" fill="#F59E0B" opacity="0.9"/>
    
    <!-- Dictionary Book Back Cover (Dark Navy) -->
    <path d="M -72,32 L -78,24 L -78,-35 L -72,-43 Z" fill="#25324A"/>
    <path d="M 72,32 L 78,24 L 78,-35 L 72,-43 Z" fill="#25324A"/>
    
    <!-- Open Dictionary Pages Base (Left & Right) -->
    <!-- Left Page Block -->
    <path d="M -75,-35 C -45,-42 -10,-45 0,-48 C -10,-51 -45,-54 -75,-61 Z" fill="#E2E8F0"/>
    <path d="M -75,-35 L -75,24 C -45,17 -10,14 0,11 C -10,14 -45,17 -75,24 Z" fill="#CBD5E1"/>
    <path d="M -75,-35 C -45,-42 -10,-45 0,-48 L 0,11 C -10,14 -45,17 -75,24 Z" fill="#F1F5F9"/>

    <!-- Right Page Block -->
    <path d="M 75,-35 C 45,-42 10,-45 0,-48 C 10,-51 45,-54 75,-61 Z" fill="#E2E8F0"/>
    <path d="M 75,-35 L 75,24 C 45,17 10,14 0,11 C 10,14 45,17 75,24 Z" fill="#CBD5E1"/>
    <path d="M 75,-35 C 45,-42 10,-45 0,-48 L 0,11 C 10,14 45,17 75,24 Z" fill="#F8FAFC"/>

    <!-- Center Spine Shadow -->
    <path d="M -3,-48 C -1,-48 1,-48 3,-48 L 3,11 C 1,11 -1,11 -3,11 Z" fill="#94A3B8" opacity="0.4"/>

    <!-- Cover Frame (Rich Blue / Slate Blue) -->
    <path d="M -78,-35 C -45,-42 -15,-45 0,-48 C 15,-45 45,-42 78,-35 L 78,24 C 45,17 15,14 0,11 C -15,14 -45,17 -78,24 Z" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dictionary Hard Cover (Front & Back Shells visible underneath) -->
    <path d="M -80,-33 L -80,26 C -45,20 -15,17 0,15 C 15,17 45,20 80,26 L 80,-33 C 45,-40 15,-43 0,-45 C -15,-43 -45,-40 -80,-33 Z" fill="none" stroke="#1E40AF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Gold Foil Accents on Cover Spine/Edges -->
    <line x1="-75" y1="-30" x2="-75" y2="20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="-30" x2="75" y2="20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Abstract Text Lines on Pages (Left Page) -->
    <line x1="-60" y1="-26" x2="-20" y2="-30" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="-16" x2="-25" y2="-20" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-60" y1="-8" x2="-15" y2="-12" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-60" y1="0" x2="-30" y2="-4" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-60" y1="8" x2="-20" y2="4" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Abstract Text Lines on Pages (Right Page) -->
    <line x1="20" y1="-30" x2="60" y2="-26" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="-20" x2="60" y2="-16" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="-12" x2="60" y2="-8" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="-4" x2="60" y2="0" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="4" x2="60" y2="8" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Magnifying Glass (Loupe for "Looking up / 查") -->
    <g transform="translate(18, 5) rotate(-15)">
      <!-- Glass Shadow -->
      <circle cx="2" cy="2" r="26" fill="#000000" opacity="0.3"/>
      <!-- Outer Rim (Gold/Orange Accent) -->
      <circle cx="0" cy="0" r="26" fill="#1E293B" stroke="#F59E0B" stroke-width="5"/>
      <!-- Lens Glass (Semi-transparent cyan/blue tint) -->
      <circle cx="0" cy="0" r="21" fill="#38BDF8" fill-opacity="0.25"/>
      <!-- Lens Reflection Highlight -->
      <path d="M -12,-10 C -5,-16 5,-16 10,-10 C 5,-13 -5,-13 -12,-10 Z" fill="#FFFFFF" opacity="0.6"/>
      <!-- Handle -->
      <rect x="-6" y="24" width="12" height="32" rx="6" fill="#3B82F6" transform="rotate(25, 0, 24)"/>
      <rect x="-3" y="26" width="6" height="28" rx="3" fill="#60A5FA" transform="rotate(25, 0, 24)"/>
    </g>

    <!-- Highlight Indicator / Focus Sparkles -->
    <path d="M 52,-38 L 55,-45 L 62,-48 L 55,-51 L 52,-58 L 49,-51 L 42,-48 L 49,-45 Z" fill="#F59E0B" opacity="0.9"/>
    <path d="M -58,-12 L -56,-16 L -52,-18 L -56,-20 L -58,-24 L -60,-20 L -64,-18 L -60,-16 Z" fill="#38BDF8" opacity="0.8"/>
  </g>
</svg>