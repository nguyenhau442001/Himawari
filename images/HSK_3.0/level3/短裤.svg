<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle ambient lighting -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Shorts / Quần đùi (Noun object representation) -->
  <g transform="translate(120, 120)">
    <!-- Waistband -->
    <path d="M-45,-45 L45,-45 L40,-30 L-40,-30 Z" fill="#3B82F6"/>
    <rect x="-42" y="-43" width="84" height="4" rx="2" fill="#60A5FA"/>
    
    <!-- Drawstring -->
    <path d="M-5,-30 C-5,-20 -10,-10 -5,-5" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M5,-30 C5,-20 10,-10 5,-5" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Main Body & Legs -->
    <path d="M-40,-30 
             C-42,10 -45,40 -47,55 
             C-48,60 -40,62 -30,60 
             C-20,58 -5,45 -2,25 
             L0,15 
             L2,25 
             C5,45 20,58 30,60 
             C40,62 48,60 47,55 
             C45,40 42,10 40,-30 Z" 
          fill="#3B82F6"/>

    <!-- Inner Leg Cutout (Shadow / Depth) -->
    <path d="M0,15 L-2,25 C-5,45 -20,58 -30,60 C-40,62 -48,60 -47,55 C-45,44 -43,20 -41,0 L0,0 Z" fill="#2563EB" opacity="0.4"/>
    <path d="M0,15 L2,25 C5,45 20,58 30,60 C40,62 48,60 47,55 C45,44 43,20 41,0 L0,0 Z" fill="#1D4ED8" opacity="0.2"/>

    <!-- Creases and Highlights -->
    <path d="M-30,-20 C-32,5 -35,30 -38,45" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M30,-20 C32,5 35,30 38,45" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Cuff Highlights / Details -->
    <path d="M-47,52 C-40,55 -32,54 -28,52" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <path d="M47,52 C40,55 32,54 28,52" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent focal indicator: Sun/Summer vibe subtle icon in corner -->
  <g transform="translate(195, 45)" opacity="0.8">
    <circle cx="0" cy="0" r="10" fill="#F59E0B"/>
    <path d="M0,-16 L0,-13 M0,13 L0,16 M-16,0 L-13,0 M13,0 L16,0 M-11,-11 L-9,-9 M9,9 L11,11 M-11,11 L-9,9 M9,-9 L11,-11" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>