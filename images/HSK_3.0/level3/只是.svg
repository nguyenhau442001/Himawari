<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Visual Metaphor: Contrast/Limitation (The "Just/Only" concept) -->
  <!-- A magnifying glass focusing on a single, small, isolated point, contrasting it against a larger, blurred background to show "only/merely" -->
  
  <!-- Background elements (blurred/muted) -->
  <circle cx="120" cy="120" r="60" fill="#2A2F3A" stroke="#3D4454" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="80" y="100" width="80" height="40" rx="4" fill="#2A2F3A"/>
  
  <!-- The Focus Area (The "Just/Only" - 只是) -->
  <g>
    <!-- Magnifying Glass Frame -->
    <circle cx="120" cy="120" r="35" fill="none" stroke="#FFB800" stroke-width="4"/>
    <line x1="145" y1="145" x2="175" y2="175" stroke="#FFB800" stroke-width="6" stroke-linecap="round"/>
    
    <!-- The isolated detail (The "Just" - a single point of inquiry) -->
    <circle cx="120" cy="120" r="12" fill="#FFB800"/>
    
    <!-- Representing the "Question/Inquiry" aspect of "只是想问问" -->
    <path d="M120 112 C 120 105 125 100 130 100 C 135 100 140 105 140 110 C 140 115 135 118 130 120 L 130 125" stroke="#1A1D24" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="130" cy="132" r="2" fill="#1A1D24"/>
  </g>
  
  <!-- Contrast indicator: A small scale tipping to show limitation -->
  <path d="M40 180 L 80 180 M 60 180 L 60 160" stroke="#4A5568" stroke-width="3"/>
  <circle cx="60" cy="155" r="5" fill="#FFB800"/>
  <circle cx="40" cy="185" r="5" fill="#3D4454"/>
</svg>