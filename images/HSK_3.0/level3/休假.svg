<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Background / Surface -->
  <path d="M 30,190 L 210,190 L 220,210 L 20,210 Z" fill="#252A34" opacity="0.6"/>

  <!-- Travel Luggage (Main Physical Object representing 休假 / Vacation) -->
  <!-- Luggage Body -->
  <rect x="75" y="75" width="90" height="105" rx="14" fill="#FF8C42"/>
  
  <!-- Luggage Stripes / Modern Accent -->
  <rect x="75" y="95" width="90" height="12" fill="#E06D24" opacity="0.4"/>
  
  <!-- Luggage Handle (Retractable) -->
  <path d="M 105,75 L 105,52 C 105,48 108,45 112,45 L 128,45 C 132,45 135,48 135,52 L 135,75" fill="none" stroke="#A0AAB8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="110" y="42" width="20" height="6" rx="3" fill="#E2E8F0"/>

  <!-- Luggage Wheels -->
  <rect x="85" y="180" width="12" height="6" rx="2" fill="#3A4454"/>
  <rect x="143" y="180" width="12" height="6" rx="2" fill="#3A4454"/>

  <!-- Zipper & Lock Details -->
  <path d="M 75,90 L 165,90" fill="none" stroke="#252A34" stroke-width="3" stroke-dasharray="4,2"/>
  <circle cx="120" cy="90" r="4" fill="#E2E8F0"/>

  <!-- Tropical Palm Leaf Accent (Vacation Vibe) -->
  <g transform="translate(155, 65) rotate(25)">
    <path d="M 0,35 C 0,35 15,20 20,0 C 15,10 5,20 0,35 Z" fill="#2ED573"/>
    <path d="M 0,35 C 0,35 -5,15 -15,5 C -8,15 -2,25 0,35 Z" fill="#2ED573"/>
    <path d="M 0,35 C 0,35 25,10 35,-5 C 20,5 10,20 0,35 Z" fill="#2ED573" opacity="0.8"/>
    <path d="M 0,35 L 0,0" fill="none" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Sun / Beach Element Accent -->
  <circle cx="65" cy="55" r="14" fill="#FFC312" opacity="0.9"/>
  <path d="M 65,33 L 65,37 M 65,73 L 65,77 M 43,55 L 47,55 M 83,55 L 87,55" stroke="#FFC312" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
</svg>