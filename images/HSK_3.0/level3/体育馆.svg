<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Gymnasium Structure -->
  <path d="M60 180 L180 180 L190 120 L50 120 Z" fill="#2C3440" stroke="#FFB84D" stroke-width="2"/>
  <path d="M50 120 L120 80 L190 120 Z" fill="#3D4756" stroke="#FFB84D" stroke-width="2"/>
  
  <!-- Entrance/Door -->
  <rect x="105" y="140" width="30" height="40" fill="#1A1D24" stroke="#FFB84D" stroke-width="2"/>
  
  <!-- Basketball Court Floor Detail -->
  <path d="M70 170 L170 170 L175 140 L65 140 Z" fill="#FFB84D" opacity="0.2"/>
  
  <!-- Basketball Hoop -->
  <circle cx="150" cy="130" r="5" fill="none" stroke="#FFB84D" stroke-width="2"/>
  <path d="M145 130 L155 130" stroke="#FFB84D" stroke-width="1"/>
  
  <!-- Structural lines -->
  <line x1="120" y1="80" x2="120" y2="120" stroke="#FFB84D" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="150" x2="160" y2="150" stroke="#FFB84D" stroke-width="1" opacity="0.5"/>
</svg>