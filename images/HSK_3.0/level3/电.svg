<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Ambient glow behind the plug/socket -->
    <circle cx="120" cy="110" r="65" fill="#38BDF8" opacity="0.08"/>
    <circle cx="120" cy="110" r="45" fill="#38BDF8" opacity="0.12"/>
    
    <!-- Wall Outlet (Socket) Plate -->
    <rect x="85" y="65" width="70" height="90" rx="12" fill="#222731" stroke="#333B4D" stroke-width="3"/>
    
    <!-- Socket Screw -->
    <circle cx="120" cy="77" r="3" fill="#333B4D"/>
    
    <!-- Left Socket (Neutral/Live holes) -->
    <rect x="98" y="92" width="12" height="20" rx="6" fill="#111418"/>
    <rect x="100" y="94" width="8" height="8" rx="4" fill="#0B0D10"/>
    
    <!-- Right Socket -->
    <rect x="130" y="92" width="12" height="20" rx="6" fill="#111418"/>
    <rect x="132" y="94" width="8" height="8" rx="4" fill="#0B0D10"/>
    
    <!-- Ground Pin Hole -->
    <circle cx="120" cy="132" r="6" fill="#111418"/>
    
    <!-- Plug Cord extending downwards -->
    <path d="M120,195 L120,165" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Plug Body (Coming forward/disconnnected slightly to show 'no power' or source) -->
    <rect x="102" y="145" width="36" height="30" rx="6" fill="#38BDF8"/>
    <rect x="106" y="149" width="28" height="22" rx="4" fill="#0284C7"/>
    
    <!-- Plug Prongs -->
    <rect x="109" y="137" width="5" height="10" rx="2.5" fill="#E2E8F0"/>
    <rect x="126" y="137" width="5" height="10" rx="2.5" fill="#E2E8F0"/>
    
    <!-- Energy/Lightning Spark Indicators (representing '电' / electricity) -->
    <path d="M65,85 L73,72 L68,72 L75,58" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M175,85 L167,72 L172,72 L165,58" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Dynamic Lightning Bolt hovering above -->
    <polygon points="125,25 110,48 122,48 115,70 138,42 124,42" fill="#F59E0B"/>
    <polygon points="125,29 113,47 122,47 117,66 134,43 123,43" fill="#FBBF24"/>
  </g>
</svg>