<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Outer Orbit/Environment Ring to anchor the concept of "center/middle" -->
  <circle cx="120" cy="120" r="76" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Secondary focal ring -->
  <circle cx="120" cy="120" r="52" fill="#222733"/>
  
  <!-- Directional indicators pointing to the center (representing "trong" / inside / midpoint) -->
  <path d="M120 44L120 62" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 178L120 196" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 120L62 120" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
  <path d="M178 120L196 120" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>

  <!-- Core Physical Object representing the absolute Center / Middle ("Chính giữa") -->
  <!-- Glowing central marker/pin -->
  <circle cx="120" cy="120" r="28" fill="#2E3648"/>
  <circle cx="120" cy="120" r="20" fill="#FF9F43"/>
  
  <!-- Inner core dot -->
  <circle cx="120" cy="120" r="8" fill="#FFFFFF"/>

  <!-- Floating spatial markers indicating "trong" (inside/midpoint context) -->
  <circle cx="92" cy="92" r="4" fill="#545D7A"/>
  <circle cx="148" cy="92" r="4" fill="#545D7A"/>
  <circle cx="92" cy="148" r="4" fill="#545D7A"/>
  <circle cx="148" cy="148" r="4" fill="#545D7A"/>
</svg>