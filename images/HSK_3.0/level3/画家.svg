<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative art studio elements (subtle) -->
  <circle cx="120" cy="115" r="75" fill="#222733" opacity="0.6"/>

  <!-- Painter character (Upper body / silhouette) -->
  <g id="painter-character">
    <!-- Body / Shirt -->
    <path d="M 80 185 C 80 160, 100 150, 120 150 C 140 150, 160 160, 160 185 L 175 220 L 65 220 Z" fill="#2E384D"/>
    <!-- Collar / Scarf accent -->
    <path d="M 105 155 L 120 168 L 135 155 Z" fill="#FFA726"/>
    <!-- Neck -->
    <rect x="111" y="138" width="18" height="20" rx="6" fill="#DDB088"/>
    <!-- Head -->
    <circle cx="120" cy="115" r="26" fill="#DDB088"/>
    <!-- Hair -->
    <path d="M 94 115 C 94 98, 106 90, 120 90 C 134 90, 146 98, 146 115 C 146 118, 144 119, 144 116 C 144 102, 133 94, 120 94 C 107 94, 96 102, 96 116 C 96 119, 94 118, 94 115 Z" fill="#4A3B32"/>
    <!-- Beret (Artist hat) -->
    <path d="M 92 103 C 92 90, 110 82, 134 88 C 150 92, 154 103, 150 106 C 146 109, 96 109, 92 103 Z" fill="#FFA726"/>
    <!-- Beret stem -->
    <path d="M 120 83 C 122 80, 125 80, 127 82" stroke="#FFA726" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Glasses -->
    <rect x="105" y="108" width="13" height="9" rx="2" fill="none" stroke="#2E384D" stroke-width="2"/>
    <rect x="122" y="108" width="13" height="9" rx="2" fill="none" stroke="#2E384D" stroke-width="2"/>
    <line x1="118" y1="112" x2="122" y2="112" stroke="#2E384D" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 115 125 C 118 128, 122 128, 125 125" stroke="#8D5B3C" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Easel -->
  <g id="easel">
    <!-- Back leg -->
    <line x1="120" y1="35" x2="120" y2="215" stroke="#5C4033" stroke-width="4" stroke-linecap="round"/>
    <!-- Left leg -->
    <line x1="120" y1="35" x2="65" y2="215" stroke="#6B4F3A" stroke-width="5" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="120" y1="35" x2="175" y2="215" stroke="#6B4F3A" stroke-width="5" stroke-linecap="round"/>
    <!-- Shelf / Canvas holder -->
    <rect x="55" y="145" width="130" height="8" rx="3" fill="#7C5A42"/>
  </g>

  <!-- Canvas -->
  <g id="canvas">
    <rect x="65" y="55" width="110" height="95" rx="6" fill="#F4F4F6"/>
    <!-- Painting on canvas: Modern abstract landscape/sunset -->
    <path d="M 65 110 Q 90 95, 115 115 T 175 100 L 175 144 L 65 144 Z" fill="#81C784"/>
    <circle cx="140" cy="85" r="14" fill="#FFB74D"/>
    <path d="M 65 125 Q 95 115, 125 130 T 175 120 L 175 144 L 65 144 Z" fill="#4DB6AC" opacity="0.7"/>
    <!-- Inner canvas border / frame highlight -->
    <rect x="65" y="55" width="110" height="95" rx="6" fill="none" stroke="#E0E0E6" stroke-width="2"/>
  </g>

  <!-- Paint Palette (Held by artist) -->
  <g id="palette" transform="translate(45, 160) rotate(-15)">
    <!-- Wooden board -->
    <ellipse cx="25" cy="25" rx="28" ry="20" fill="#D7CCC8" stroke="#A1887F" stroke-width="2"/>
    <!-- Thumb hole -->
    <ellipse cx="33" cy="28" rx="4" ry="6" fill="#1A1D24"/>
    <!-- Paint blobs -->
    <circle cx="12" cy="18" r="5" fill="#E53935"/> <!-- Red -->
    <circle cx="20" cy="12" r="5" fill="#FDD835"/> <!-- Yellow -->
    <circle cx="32" cy="14" r="5" fill="#43A047"/> <!-- Green -->
    <circle cx="14" cy="32" r="5" fill="#1E88E5"/> <!-- Blue -->
    <circle cx="25" cy="35" r="5" fill="#8E24AA"/> <!-- Purple -->
  </g>

  <!-- Paintbrush -->
  <g id="paintbrush" transform="translate(135, 135) rotate(45)">
    <!-- Brush handle -->
    <rect x="-3" y="-35" width="6" height="50" rx="3" fill="#D7CCC8"/>
    <!-- Ferrule -->
    <rect x="-3.5" y="-45" width="7" height="10" rx="1" fill="#B0BEC5"/>
    <!-- Bristles -->
    <path d="M -3 -45 C -3 -55, 3 -55, 3 -45 Z" fill="#E53935"/>
  </g>
</svg>