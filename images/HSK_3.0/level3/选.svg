<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative UI/App Framing Elements -->
  <line x1="20" y1="20" x2="40" y2="20" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="20" x2="220" y2="20" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="220" x2="40" y2="220" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="220" x2="220" y2="220" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- Scene Background Elements -->
  <rect x="52" y="150" width="136" height="6" rx="3" fill="#2D3748"/>
  
  <!-- Color Option Cards / Swatches (Contextual: "这么多颜色，你选哪个？") -->
  <!-- Option 1: Blue (Unselected) -->
  <g transform="translate(62, 85)">
    <rect width="30" height="42" rx="6" fill="#2563EB" opacity="0.4"/>
    <circle cx="15" cy="21" r="6" fill="#60A5FA" opacity="0.4"/>
  </g>

  <!-- Option 2: Orange/Gold (Selected - Focus/Active) -->
  <g transform="translate(105, 75)">
    <!-- Motion lines indicating action/selection -->
    <path d="M-8 21 L-14 21" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M38 21 L44 21" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Selected Card (Elevated & Glowing Accent) -->
    <rect x="-2" y="-2" width="34" height="46" rx="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <rect width="30" height="42" rx="6" fill="#D97706"/>
    <circle cx="15" cy="21" r="8" fill="#FBBF24"/>
    
    <!-- Checkmark icon inside the selected option -->
    <path d="M10 21 L13 24 L20 17" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Option 3: Purple (Unselected) -->
  <g transform="translate(148, 85)">
    <rect width="30" height="42" rx="6" fill="#7C3AED" opacity="0.4"/>
    <circle cx="15" cy="21" r="6" fill="#A78BFA" opacity="0.4"/>
  </g>

  <!-- Human Character Action (The Chooser) -->
  <!-- Body/Torso -->
  <path d="M 120 200 C 120 180, 105 165, 95 160 L 145 160 C 135 165, 120 180, 120 200 Z" fill="#4B5563"/>
  <!-- Head -->
  <circle cx="120" cy="142" r="13" fill="#E5E7EB"/>
  
  <!-- Pointing/Selecting Arm & Hand -->
  <!-- Upper arm & forearm reaching out precisely to the selected orange card -->
  <path d="M 115 155 Q 125 140, 128 122" fill="none" stroke="#4B5563" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand pointing index finger -->
  <circle cx="128" cy="116" r="5" fill="#E5E7EB"/>
  <path d="M 128 111 L 128 104" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>

  <!-- Supporting Arm -->
  <path d="M 125 155 Q 110 165, 105 178" fill="none" stroke="#374151" stroke-width="8" stroke-linecap="round"/>

  <!-- Selection Indicator Sparkle -->
  <path d="M 120 62 L 120 54 M 120 46 L 120 54 M 116 54 L 124 54" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
</svg>