<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ground shadow -->
  <ellipse cx="120" cy="168" rx="80" ry="8" fill="#111318" opacity="0.8"/>
  
  <!-- Speed lines indicating movement/commuting (Context: 他每天开汽车去上班) -->
  <path d="M40 100 L64 100" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M30 115 L52 115" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M45 130 L60 130" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Modern Sleek Flat Car (汽车) -->
  <g transform="translate(0, 5)">
    <!-- Car Body - Lower main block -->
    <path d="M50 140 L190 140 C195 140 198 135 195 130 L180 105 C178 102 174 100 170 100 L70 100 C66 100 62 102 60 105 L45 130 C42 135 45 140 50 140 Z" fill="#FF9F43"/>
    
    <!-- Car Roof / Cabin -->
    <path d="M85 100 L105 75 C107 72 111 70 115 70 L125 70 C129 70 133 72 135 75 L155 100 Z" fill="#F39C12"/>
    
    <!-- Windshields / Windows (Glass cutout effect with dark sleek tint) -->
    <path d="M90 98 L107 75 L120 75 L120 98 Z" fill="#1A1D24"/>
    <path d="M125 98 L125 75 L133 75 L150 98 Z" fill="#1A1D24"/>

    <!-- Headlight (Front) -->
    <path d="M188 115 L194 118 L194 125 L188 123 Z" fill="#FFFFFF"/>
    <path d="M194 118 L206 114 L206 122 L194 125 Z" fill="#FFEAA7" opacity="0.5"/> <!-- Headlight beam glow -->

    <!-- Taillight (Back) -->
    <path d="M48 115 L52 116 L52 122 L48 121 Z" fill="#FF5252"/>

    <!-- Wheels (Front & Rear) -->
    <!-- Rear Wheel -->
    <circle cx="80" cy="140" r="18" fill="#2C3E50"/>
    <circle cx="80" cy="140" r="8" fill="#BDC3C7"/>
    
    <!-- Front Wheel -->
    <circle cx="160" cy="140" r="18" fill="#2C3E50"/>
    <circle cx="160" cy="140" r="8" fill="#BDC3C7"/>

    <!-- Sleek Body Accent Line -->
    <path d="M46 120 L192 120" stroke="#E67E22" stroke-width="2" opacity="0.4"/>
  </g>
</svg>