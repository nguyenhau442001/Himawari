<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Autumn Moon / Warm Glow Background -->
    <circle cx="0" cy="-25" r="55" fill="#FF8C42" opacity="0.15"/>
    <circle cx="0" cy="-25" r="40" fill="#FFB703" opacity="0.2"/>

    <!-- Distant pagoda silhouette (Beijing context) -->
    <g fill="#2D3340" opacity="0.6">
      <rect x="-6" y="-35" width="12" height="25" />
      <polygon points="-16,-10 16,-10 12,-35 -12,-35" />
      <rect x="-20" y="-8" width="40" height="3" rx="1.5" />
      <rect x="-14" y="-22" width="28" height="3" rx="1.5" />
      <rect x="-10" y="-35" width="20" height="3" rx="1.5" />
      <polygon points="-4,-35 4,-35 0,-45" />
    </g>

    <!-- Maple Leaf Stem and Base -->
    <path d="M0,45 C0,25 0,10 0,0" stroke="#8D6B4F" stroke-width="3" stroke-linecap="round"/>

    <!-- Central Big Maple Leaf (Autumn Symbol) -->
    <path d="M0,0 
             C -8,-15 -25,-12 -35,-25 
             C -25,-28 -20,-38 -30,-48 
             C -15,-42 -10,-55 0,-62 
             C 10,-55 15,-42 30,-48 
             C 20,-38 25,-28 35,-25 
             C 25,-12 8,-15 0,0 Z" 
          fill="#FF5722"/>

    <!-- Leaf Veins -->
    <path d="M0,0 L0,-55" stroke="#F4D03F" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,-25 L-22,-32" stroke="#F4D03F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,-25 L22,-32" stroke="#F4D03F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,-15 L-15,-18" stroke="#F4D03F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,-15 L15,-18" stroke="#F4D03F" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Falling smaller autumn leaves for atmosphere -->
    <path d="M-55,-20 C-58,-25 -65,-24 -70,-30 C-64,-32 -62,-38 -68,-42 C-59,-39 -56,-46 -50,-50 C-46,-46 -48,-39 -40,-42 C-46,-38 -44,-32 -38,-30 C-43,-24 -50,-25 -55,-20 Z" fill="#FFB703" transform="rotate(-25)" opacity="0.9"/>
    
    <path d="M45,10 C42,5 35,6 30,0 C36,-2 38,-8 32,-12 C41,-9 44,-16 50,-20 C54,-16 52,-9 60,-12 C54,-8 56,-2 62,0 C57,6 50,5 45,10 Z" fill="#E76F51" transform="rotate(35) scale(0.7)" opacity="0.9"/>
  </g>
</svg>