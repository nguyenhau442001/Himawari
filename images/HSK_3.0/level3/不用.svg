<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="185" rx="70" ry="10" fill="#111318"/>

  <!-- Character Left (Person 1 - Receiving help / expressing gratitude) -->
  <g transform="translate(65, 85)">
    <!-- Body -->
    <path d="M 0 75 Q 0 45 15 45 Q 30 45 30 75 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="15" cy="22" r="14" fill="#FFD166"/>
    <!-- Hair -->
    <path d="M 1 18 Q 15 2 29 18 Q 28 8 15 8 Q 2 8 1 18 Z" fill="#4B5563"/>
    <!-- Slight respectful bow posture / angle -->
  </g>

  <!-- Character Right (Person 2 - Waving off thanks / "No need") -->
  <g transform="translate(145, 80)">
    <!-- Body -->
    <path d="M 0 80 Q 0 50 15 50 Q 30 50 30 80 Z" fill="#10B981"/>
    <!-- Head -->
    <circle cx="15" cy="22" r="14" fill="#FFD166"/>
    <!-- Hair -->
    <path d="M 1 18 Q 15 2 29 18 Q 28 8 15 8 Q 2 8 1 18 Z" fill="#1F2937"/>
    <!-- Friendly smiling face features (simplified flat style) -->
    <circle cx="11" cy="21" r="1.5" fill="#1F2937"/>
    <circle cx="19" cy="21" r="1.5" fill="#1F2937"/>
    <path d="M 12 26 Q 15 29 18 26" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm gesturing 'no need' (waving/crossing hand motion) -->
    <path d="M 0 55 C -15 55 -25 45 -35 45" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-35" cy="45" r="5" fill="#FFD166"/>
  </g>

  <!-- Central polite interaction indicator (Soft modern accent highlight, zero hearts, zero abstract fluff) -->
  <g transform="translate(120, 115)">
    <path d="M -15 -10 L 15 10 M 15 -10 L -15 10" fill="none" stroke="#F59E0B" stroke-width="0" opacity="0"/>
  </g>

</svg>