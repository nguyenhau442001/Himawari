<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Subtle Elements / Foliage -->
  <path d="M40 200 C30 180, 50 160, 40 140 C60 150, 70 170, 60 200 Z" fill="#2E4033" opacity="0.6"/>
  <path d="M200 210 C210 185, 190 170, 205 150 C185 165, 175 185, 185 210 Z" fill="#2E4033" opacity="0.6"/>
  
  <!-- Zoo Entrance Arch (Representing "Zoo" / 动物园) -->
  <!-- Pillars -->
  <rect x="55" y="90" width="18" height="110" rx="4" fill="#3E4551"/>
  <rect x="167" y="90" width="18" height="110" rx="4" fill="#3E4551"/>
  
  <!-- Pillar Accents -->
  <rect x="51" y="85" width="26" height="10" rx="2" fill="#525B6C"/>
  <rect x="163" y="85" width="26" height="10" rx="2" fill="#525B6C"/>

  <!-- Arch Top / Roof -->
  <path d="M45 85 L120 45 L195 85 Z" fill="#E5983B"/>
  <path d="M40 82 L120 40 L200 82 L200 90 L40 90 Z" fill="#F4B056"/>

  <!-- Zoo Silhouette / Animals inside the frame -->
  <!-- Giraffe Head & Neck peeking over -->
  <path d="M95 140 L95 105 C95 98, 103 98, 103 105 L103 140 Z" fill="#E5983B"/>
  <circle cx="99" cy="98" r="7" fill="#E5983B"/>
  <!-- Giraffe Ears / Horns -->
  <path d="M93 92 L95 95 M105 92 L103 95" stroke="#E5983B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="92" cy="91" r="1.5" fill="#3E4551"/>
  <circle cx="106" cy="91" r="1.5" fill="#3E4551"/>
  <circle cx="96" cy="96" r="1" fill="#3E4551"/>

  <!-- Elephant Head silhouette -->
  <path d="M130 150 C125 130, 155 130, 150 150 C148 165, 132 165, 130 150 Z" fill="#78869E"/>
  <!-- Trunk -->
  <path d="M140 148 C140 170, 130 175, 125 168" fill="none" stroke="#78869E" stroke-width="5" stroke-linecap="round"/>
  <!-- Big Ear -->
  <path d="M128 135 C118 135, 118 150, 128 148" fill="#78869E"/>

  <!-- Foreground Ground Line -->
  <rect x="30" y="200" width="180" height="6" rx="3" fill="#3E4551"/>

  <!-- Central Focus Icon Accent (Paw print emblem on top of the arch) -->
  <circle cx="120" cy="62" r="12" fill="#1A1D24"/>
  <!-- Paw Print SVG -->
  <circle cx="120" cy="58" r="3" fill="#F4B056"/>
  <circle cx="114" cy="63" r="2" fill="#F4B056"/>
  <circle cx="126" cy="63" r="2" fill="#F4B056"/>
  <circle cx="117" cy="67" r="1.5" fill="#F4B056"/>
  <circle cx="123" cy="67" r="1.5" fill="#F4B056"/>
</svg>