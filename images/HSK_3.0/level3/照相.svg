<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Camera Body -->
  <rect x="70" y="90" width="100" height="70" rx="8" fill="#F39C12"/>
  
  <!-- Lens -->
  <circle cx="120" cy="125" r="25" fill="#1A1D24" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="120" cy="125" r="15" fill="#34495E"/>
  
  <!-- Viewfinder/Flash -->
  <rect x="145" y="75" width="20" height="15" rx="2" fill="#F39C12"/>
  <rect x="80" y="75" width="30" height="15" rx="2" fill="#F39C12"/>
  
  <!-- Shutter Button -->
  <rect x="140" y="80" width="15" height="10" rx="2" fill="#E67E22"/>
  
  <!-- Flash light burst (stylized as simple lines) -->
  <line x1="120" y1="95" x2="120" y2="75" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="105" x2="150" y2="90" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="105" x2="90" y2="90" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
</svg>