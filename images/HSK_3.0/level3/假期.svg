    <path d="M105 85 C120 55 145 45 170 45 C150 65 125 75 105 85 Z" fill="#219653"/>

    <!-- Island Ground -->
    <path d="M70 155 C90 145 150 145 170 155 C185 162 180 172 160 175 C120 180 100 180 80 175 C60 172 55 162 70 155 Z" fill="#F1C40F"/>
    
    <!-- Sun / Sunset -->
    <circle cx="165" cy="95" r="22" fill="#F39C12" opacity="0.9"/>
    
    <!-- Waves -->
