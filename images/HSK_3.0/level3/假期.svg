    <path d="M120 155 C125 130 115 105 105 85" stroke="#8C6D53" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M117 135 C121 120 115 105 107 90" stroke="#A78362" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Palm Leaves -->
