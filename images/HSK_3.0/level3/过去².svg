<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "过去" (The Past) - Represented as a classic, physical physical object: An old vintage calendar/clock artifact with fading historical layers -->
  
  <g transform="translate(0, 0)">
    <!-- Subtle background spatial glow representing a timeline/distance -->
    <ellipse cx="120" cy="145" rx="70" ry="25" fill="#252A34" opacity="0.6"/>

    <!-- The Past Object: Vintage Desktop Calendar / Photo Frame showing a bygone era (Beijing traditional roof silhouette concept integrated) -->
    
    <!-- Wooden/Metal Stand Back -->
    <path d="M 95 160 L 70 195 L 90 200 L 115 165 Z" fill="#3E4451"/>
    <path d="M 145 160 L 170 195 L 150 200 L 125 165 Z" fill="#2E333D"/>
    
    <!-- Main Frame Body -->
    <rect x="75" y="65" width="90" height="100" rx="8" fill="#2D323E" stroke="#4A5260" stroke-width="2"/>
    
    <!-- Binding Rings at top -->
    <rect x="90" y="57" width="10" height="12" rx="4" fill="#E5C07B"/>
    <rect x="140" y="57" width="10" height="12" rx="4" fill="#E5C07B"/>
    <line x1="95" y1="69" x2="145" y2="69" stroke="#1A1D24" stroke-width="3"/>

    <!-- Inner Page (Fading sepia/retro tone for past) -->
    <rect x="83" y="77" width="74" height="80" rx="4" fill="#1E222B"/>

    <!-- Graphic inside: Historic Beijing gate silhouette (Contextual reference: 过去我住在北京) -->
    <!-- Sun/Moon setting in the past -->
    <circle cx="120" cy="105" r="16" fill="#E5C07B" opacity="0.8"/>
    
    <!-- Traditional Roof/Gate Silhouette -->
    <path d="M 93 130 L 100 120 L 140 120 L 147 130 L 153 134 L 87 134 Z" fill="#61AFEF"/>
    <path d="M 95 134 L 95 148 L 145 148 L 145 134 Z" fill="#4B5263"/>
    <!-- Traditional doorway/arch -->
    <path d="M 112 148 L 112 138 C 112 135 128 135 128 138 L 128 148 Z" fill="#1E222B"/>

    <!-- Ground line -->
    <line x1="88" y1="149" x2="152" y2="149" stroke="#61AFEF" stroke-width="2"/>

    <!-- Foreground overlay: Time fading effect (dotted trail / rewind arrow wrapping around the past object) -->
    <path d="M 50 115 C 50 75, 90 45, 135 48 C 160 50, 180 70, 185 95" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.7"/>
    
    <!-- Arrowhead pointing backwards into the past -->
    <path d="M 54 105 L 48 117 L 60 119" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating subtle memory particles / dust in light beam -->
    <circle cx="155" cy="85" r="2.5" fill="#E5C07B" opacity="0.8"/>
    <circle cx="165" cy="115" r="1.5" fill="#E5C07B" opacity="0.5"/>
    <circle cx="85" cy="95" r="2" fill="#E5C07B" opacity="0.6"/>
    
  </g>
</svg>