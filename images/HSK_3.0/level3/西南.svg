<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Compass Needle pointing Southwest -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="70" fill="#252932" stroke="#374151" stroke-width="4"/>
    
    <!-- Compass Needle -->
    <g transform="rotate(-45)">
      <path d="M0 -60 L10 0 L0 60 L-10 0 Z" fill="#F59E0B"/>
      <path d="M0 -60 L10 0 L0 10 Z" fill="#D97706"/>
      <circle cx="0" cy="0" r="8" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
    </g>
    
    <!-- Cardinal indicators (dots only) -->
    <circle cx="0" cy="-55" r="3" fill="#4B5563"/>
    <circle cx="55" cy="0" r="3" fill="#4B5563"/>
    <circle cx="0" cy="55" r="3" fill="#4B5563"/>
    <circle cx="-55" cy="0" r="3" fill="#4B5563"/>
    
    <!-- Southwest highlight -->
    <circle cx="-38.9" cy="38.9" r="6" fill="#F59E0B"/>
  </g>
  
  <!-- Stylized Mountain Range in the Southwest quadrant -->
  <path d="M60 180 L90 130 L120 180 Z" fill="#374151"/>
  <path d="M40 180 L70 140 L100 180 Z" fill="#4B5563"/>
</svg>