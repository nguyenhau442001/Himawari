<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Scene Atmosphere -->
  <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.6"/>
  
  <!-- Motion Lines Indicating Recognition/Flash of Memory -->
  <g stroke="#FFA726" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 85 65 Q 120 45 155 65" fill="none" stroke-dasharray="4 4"/>
    <path d="M 75 80 Q 120 55 165 80" fill="none"/>
  </g>
  
  <!-- Character A (Looking / Recognizing) -->
  <g id="character-a">
    <!-- Body & Shoulders -->
    <path d="M 60 185 C 60 155 85 140 100 140 C 100 140 100 140 100 140" fill="#3F51B5"/>
    <path d="M 50 195 L 105 195 C 105 170 85 155 65 155 Z" fill="#303F9F"/>
    
    <!-- Neck & Head -->
    <rect x="73" y="125" width="14" height="20" rx="6" fill="#FFCCBC"/>
    <circle cx="80" cy="115" r="18" fill="#FFCCBC"/>
    
    <!-- Hair -->
    <path d="M 62 110 C 62 98 72 95 82 95 C 95 95 98 105 98 115 C 98 115 62 115 62 110 Z" fill="#37474F"/>
    
    <!-- Eye & Facial Expression (Surprised / Recognized) -->
    <circle cx="87" cy="113" r="2.5" fill="#212121"/>
    <!-- Eyebrow raised -->
    <path d="M 83 107 Q 87 104 91 107" fill="none" stroke="#212121" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 85 120 Q 88 123 91 120" fill="none" stroke="#212121" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Pointing / Gesturing Hand (Direct interaction showing 'recognizing') -->
    <path d="M 95 155 L 115 145 L 118 149 L 102 165 Z" fill="#FFCCBC"/>
    <circle cx="116" cy="146" r="3" fill="#FFCCBC"/>
  </g>
  
  <!-- Character B (The person being recognized / smiled at) -->
  <g id="character-b">
    <!-- Body & Shoulders -->
    <path d="M 180 185 C 180 155 155 140 140 140" fill="#00897B"/>
    <path d="M 190 195 L 135 195 C 135 170 155 155 175 155 Z" fill="#00695C"/>
    
    <!-- Neck & Head -->
    <rect x="153" y="125" width="14" height="20" rx="6" fill="#D7CCC8"/>
    <circle cx="160" cy="115" r="18" fill="#D7CCC8"/>
    
    <!-- Hair -->
    <path d="M 145 112 C 145 98 155 94 168 94 C 178 94 178 105 178 115 Z" fill="#5D4037"/>
    
    <!-- Eye & Facial Expression (Friendly / Warm) -->
    <circle cx="153" cy="113" r="2" fill="#212121"/>
    <!-- Smile -->
    <path d="M 151 120 Q 155 124 159 120" fill="none" stroke="#212121" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Focus / Recognition Sparkle Icon (Amber/Gold accent) -->
  <g transform="translate(120, 75)">
    <path d="M 0 -12 C 0 -3 3 0 12 0 C 3 0 0 3 0 12 C 0 3 -3 0 -12 0 C -3 0 0 -3 0 -12 Z" fill="#FFA726"/>
    <circle cx="0" cy="0" r="3" fill="#FFF3E0"/>
  </g>
  
  <!-- Secondary Accent Sparkles -->
  <path d="M 145 95 L 148 101 L 154 104 L 148 107 L 145 113 L 142 107 L 136 104 L 142 101 Z" fill="#FFA726" opacity="0.4" transform="scale(0.6) translate(100, 30)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="198" rx="75" ry="5" fill="#111318"/>
</svg>