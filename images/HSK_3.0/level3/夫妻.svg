<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="195" rx="64" ry="8" fill="#111318"/>

  <!-- Character 1 (Left - Woman, Business/Teacher attire vibe matching context) -->
  <g transform="translate(74, 90)">
    <!-- Body / Torso -->
    <path d="M-22 90 C-22 68 -12 55 -2 55 C8 55 18 68 18 90 Z" fill="#3B82F6"/>
    <!-- Collar / Details -->
    <path d="M-6 55 L0 66 L6 55" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Head & Neck -->
    <rect x="-3" y="44" width="6" height="13" fill="#E5B299"/>
    <circle cx="0" cy="30" r="18" fill="#E5B299"/>
    
    <!-- Hair (Stylish bob/medium) -->
    <path d="M-18 24 C-19 12 -11 10 0 10 C11 10 19 12 18 24 C20 38 18 46 16 46 C14 46 13 36 12 30 C8 16 -8 16 -12 30 C-13 36 -14 46 -16 46 C-18 46 -20 38 -18 24 Z" fill="#2D221E"/>

    <!-- Friendly Face -->
    <circle cx="-5" cy="28" r="1.5" fill="#1A1D24"/>
    <circle cx="5" cy="28" r="1.5" fill="#1A1D24"/>
    <path d="M-3 35 Q0 38 3 35" fill="none" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Arm (Gentle rest) -->
    <path d="M-18 60 C-26 70 -28 82 -26 90" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Right - Man, standing side by side representing partnership/spouse) -->
  <g transform="translate(166, 90)">
    <!-- Body / Torso -->
    <path d="M-18 90 C-18 68 -10 55 0 55 C10 55 18 68 18 90 Z" fill="#F59E0B"/>
    <!-- Collar / Tie -->
    <path d="M-4 55 L0 68 L4 55" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="0,64 -2,74 0,82 2,74" fill="#1E293B"/>

    <!-- Head & Neck -->
    <rect x="-3" y="44" width="6" height="13" fill="#E5B299"/>
    <circle cx="0" cy="30" r="18" fill="#E5B299"/>

    <!-- Hair (Short modern neat cut) -->
    <path d="M-17 26 C-17 14 -10 11 0 11 C10 11 17 14 17 26 C17 29 15 29 13 26 C10 17 -10 17 -13 26 C-15 29 -17 29 -17 26 Z" fill="#1E1B18"/>

    <!-- Friendly Face -->
    <circle cx="-5" cy="28" r="1.5" fill="#1A1D24"/>
    <circle cx="5" cy="28" r="1.5" fill="#1A1D24"/>
    <path d="M-3 35 Q0 38 3 35" fill="none" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right Arm -->
    <path d="M18 60 C26 70 28 82 26 90" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Interlocked / Connected Arms in the center representing companionship/marriage -->
  <g transform="translate(120, 155)">
    <!-- Overlapping arms creating unified support bond -->
    <path d="M-46 5 C-30 -5 -10 -5 0 0 C10 -5 30 -5 46 5" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#F59E0B"/>
  </g>

  <!-- Accent focal highlight glow rings (Modern design touch) -->
  <circle cx="120" cy="115" r="75" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 6"/>
</svg>