<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background winter night glow -->
  <circle cx="120" cy="120" r="80" fill="#222B38" opacity="0.6"/>

  <!-- Stylized Winter Pine Tree (Iconic physical object for Winter) -->
  <g transform="translate(120, 55)">
    <!-- Tree layers -->
    <!-- Top layer -->
    <polygon points="0,15 -35,55 35,55" fill="#4A7C9D"/>
    <polygon points="0,15 0,55 35,55" fill="#3B637D"/>

    <!-- Middle layer -->
    <polygon points="0,40 -45,90 45,90" fill="#588BAE"/>
    <polygon points="0,40 0,90 45,90" fill="#4A7491"/>

    <!-- Bottom layer -->
    <polygon points="0,70 -55,125 55,125" fill="#6B9CC2"/>
    <polygon points="0,70 0,125 55,125" fill="#5882A3"/>

    <!-- Tree trunk -->
    <rect x="-6" y="125" width="12" height="18" fill="#362C2A" rx="2"/>

    <!-- Snow caps on tree -->
    <path d="M 0 15 Q -15 35 -35 55 Q -10 45 0 35 Q 10 45 35 55 Q 15 35 0 15 Z" fill="#E8F1F5"/>
    <path d="M 0 40 Q -20 65 -45 90 Q -15 75 0 65 Q 15 75 45 90 Q 20 65 0 40 Z" fill="#E8F1F5"/>
    <path d="M 0 70 Q -25 95 -55 125 Q -20 105 0 95 Q 20 105 55 125 Q 25 95 0 70 Z" fill="#E8F1F5"/>
  </g>

  <!-- Snow ground / drift at the bottom -->
  <path d="M 30 195 Q 70 180 120 190 Q 170 180 210 195 L 215 210 Q 120 220 25 210 Z" fill="#E8F1F5" opacity="0.9"/>
  <path d="M 45 200 Q 90 190 135 202 Q 185 192 205 202 L 210 215 Q 120 225 30 215 Z" fill="#FFFFFF"/>

  <!-- Falling Snowflakes (Vector flat design) -->
  <!-- Snowflake 1 (Top Left) -->
  <g transform="translate(65, 75) scale(0.7)" stroke="#E8F1F5" stroke-width="2.5" stroke-linecap="round">
    <line x1="-10" y1="0" x2="10" y2="0"/>
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="-7" y1="-7" x2="7" y2="7"/>
    <line x1="-7" y1="7" x2="7" y2="-7"/>
    <circle cx="0" cy="0" r="2" fill="#E8F1F5"/>
  </g>

  <!-- Snowflake 2 (Top Right - Accent Gold/Orange for focus as per constraints) -->
  <g transform="translate(175, 85) scale(0.9)" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round">
    <line x1="-10" y1="0" x2="10" y2="0"/>
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="-7" y1="-7" x2="7" y2="7"/>
    <line x1="-7" y1="7" x2="7" y2="-7"/>
    <circle cx="0" cy="0" r="2" fill="#F39C12"/>
  </g>

  <!-- Snowflake 3 (Mid Left) -->
  <g transform="translate(45, 135) scale(0.5)" stroke="#E8F1F5" stroke-width="2.5" stroke-linecap="round">
    <line x1="-10" y1="0" x2="10" y2="0"/>
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="-7" y1="-7" x2="7" y2="7"/>
    <line x1="-7" y1="7" x2="7" y2="-7"/>
  </g>

  <!-- Snowflake 4 (Mid Right) -->
  <g transform="translate(190, 145) scale(0.6)" stroke="#E8F1F5" stroke-width="2.5" stroke-linecap="round">
    <line x1="-10" y1="0" x2="10" y2="0"/>
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="-7" y1="-7" x2="7" y2="7"/>
    <line x1="-7" y1="7" x2="7" y2="-7"/>
  </g>

  <!-- Snowflake 5 (Bottom Left Accent) -->
  <g transform="translate(80, 160) scale(0.8)" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round">
    <line x1="-10" y1="0" x2="10" y2="0"/>
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="-7" y1="-7" x2="7" y2="7"/>
    <line x1="-7" y1="7" x2="7" y2="-7"/>
    <circle cx="0" cy="0" r="2" fill="#F39C12"/>
  </g>

  <!-- Small floating snow dots -->
  <circle cx="100" cy="100" r="2" fill="#E8F1F5" opacity="0.8"/>
  <circle cx="140" cy="115" r="1.5" fill="#E8F1F5" opacity="0.6"/>
  <circle cx="155" cy="65" r="2" fill="#F39C12" opacity="0.9"/>
  <circle cx="90" cy="130" r="1.5" fill="#E8F1F5" opacity="0.7"/>
</svg>