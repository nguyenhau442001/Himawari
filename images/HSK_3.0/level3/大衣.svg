<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow/shadow to anchor the physical object -->
  <ellipse cx="120" cy="205" rx="45" ry="8" fill="#111318"/>

  <!-- Main Object: "大衣" (Overcoat / Trench coat) in sleek modern flat vector style -->
  <g transform="translate(0, 5)">
    <!-- Coat body & skirts -->
    <path d="M92 45 L80 65 L88 200 L152 200 L160 65 L148 45 Z" fill="#2C364C"/>
    
    <!-- Coat lapels / collar structure -->
    <path d="M100 45 L120 75 L140 45 L130 35 L120 40 L110 35 Z" fill="#3B4863"/>
    
    <!-- Left & Right Front Panels (Overlap) -->
    <path d="M120 75 L100 200 L124 200 L135 110 Z" fill="#242E40"/>
    <path d="M120 75 L140 200 L116 200 L105 110 Z" fill="#242E40"/>
    
    <!-- Lapel flaps -->
    <path d="M120 75 L95 55 L90 70 Z" fill="#3B4863"/>
    <path d="M120 75 L145 55 L150 70 Z" fill="#3B4863"/>

    <!-- Sleeves -->
    <!-- Left Sleeve -->
    <path d="M92 48 L60 85 L75 95 L100 62 Z" fill="#242E40"/>
    <!-- Right Sleeve -->
    <path d="M148 48 L180 85 L165 95 L140 62 Z" fill="#242E40"/>

    <!-- Belt (Orange/Gold accent for contrast and modern flat aesthetic) -->
    <path d="M85 115 L155 115 L153 125 L87 125 Z" fill="#E59838"/>
    <!-- Belt buckle -->
    <rect x="115" y="113" width="10" height="14" rx="2" fill="#F4B95B"/>
    <rect x="117" y="116" width="6" height="8" rx="1" fill="#242E40"/>

    <!-- Buttons -->
    <circle cx="120" cy="95" r="3" fill="#E59838"/>
    <circle cx="120" cy="140" r="3" fill="#E59838"/>
    <circle cx="120" cy="165" r="3" fill="#E59838"/>
    <circle cx="120" cy="190" r="3" fill="#E59838"/>

    <!-- Pocket Flaps -->
    <rect x="92" y="145" width="18" height="6" rx="2" fill="#3B4863"/>
    <rect x="130" y="145" width="18" height="6" rx="2" fill="#3B4863"/>
  </g>
</svg>