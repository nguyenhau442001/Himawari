<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow/ambience for restaurant setting -->
  <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Restaurant table (top-down / perspective element) -->
  <ellipse cx="120" cy="165" rx="85" ry="32" fill="#222730" stroke="#2D3340" stroke-width="3"/>

  <!-- Table accessories: Delicious dishes / glowing warm plates -->
  <ellipse cx="120" cy="160" rx="26" ry="10" fill="#2E3544"/>
  <ellipse cx="120" cy="158" rx="22" ry="8" fill="#F39C12" opacity="0.2"/>
  <!-- Food steaming/glowing element -->
  <path d="M116 148 C114 142, 126 138, 124 132" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M124 149 C126 143, 114 139, 116 133" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Side dish / bowl -->
  <ellipse cx="80" cy="167" rx="14" ry="6" fill="#2E3544"/>
  <ellipse cx="160" cy="167" rx="14" ry="6" fill="#2E3544"/>

  <!-- HOST CHARACTER (Left side, extending hand generously, action pose) -->
  <g id="host-character">
    <!-- Body/Torso -->
    <path d="M65 145 C65 125, 75 115, 95 115 C115 115, 125 125, 125 145 Z" fill="#2B4C7E"/>
    <!-- Head -->
    <circle cx="95" cy="95" r="16" fill="#E0AC69"/>
    <!-- Hair -->
    <path d="M79 93 C79 82, 87 78, 95 78 C103 78, 111 82, 111 93 Z" fill="#3E2723"/>
    
    <!-- Host Arm & Hand gesturing towards the table/guests (Action: "请" - Inviting/Treating) -->
    <!-- Upper arm -->
    <path d="M80 120 L105 130" stroke="#2B4C7E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Forearm and open palm hand facing upward/forward -->
    <path d="M105 130 L130 125" stroke="#2B4C7E" stroke-width="8" stroke-linecap="round"/>
    <circle cx="134" cy="124" r="5" fill="#E0AC69"/>
  </g>

  <!-- GUEST CHARACTERS (Right side, smiling, responding to the treat) -->
  <g id="guest-characters">
    <!-- Guest 1 (Back/Right) -->
    <circle cx="170" cy="98" r="13" fill="#D4A373"/>
    <path d="M155 135 C155 120, 163 112, 175 112 C187 112, 195 120, 195 135 Z" fill="#4A5568"/>

    <!-- Guest 2 (Front/Right) -->
    <circle cx="150" cy="102" r="14" fill="#C68B59"/>
    <path d="M135 140 C135 125, 142 118, 155 118 C168 118, 175 125, 175 140 Z" fill="#2C7A7B"/>
  </g>

  <!-- DYNAMIC ACTION & FOCUS ELEMENTS -->
  <!-- Motion / gesture indicator lines emphasizing hospitality and generosity -->
  <path d="M115 110 C125 102, 138 105, 145 112" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M110 118 C118 112, 128 114, 133 120" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>

  <!-- Focal Accent: Golden glowing spark representing the "Treat / Free meal" generosity -->
  <g transform="translate(120, 85)">
    <path d="M0 -12 L3 -4 L11 -1 L3 2 L0 10 L-3 2 L-11 -1 L-3 -4 Z" fill="#F39C12"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#F39C12" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Secondary decorative sparkle -->
  <g transform="translate(75, 70)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F39C12" opacity="0.8"/>
  </g>
</svg>