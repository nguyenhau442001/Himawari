<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Book object -->
  <path d="M70 160h100v40c0 5.5-4.5 10-10 10H80c-5.5 0-10-4.5-10-10v-40z" fill="#FFB84D"/>
  <path d="M70 160h100v-50c0-5.5-4.5-10-10-10H80c-5.5 0-10 4.5-10 10v50z" fill="#FF9F1A"/>
  <path d="M75 110h90v40H75z" fill="#2D3436"/>
  <path d="M85 120h70v5H85zM85 130h70v5H85zM85 140h40v5H85z" fill="#4A5568"/>
  
  <!-- Reader Character (Upper body) -->
  <g transform="translate(120, 100)">
    <!-- Arms reaching out to hold the book -->
    <path d="M-40 20c-10 0-20 10-20 20l-5 30c0 5 5 10 10 10h15l10-30" fill="#FFD194"/>
    <path d="M40 20c10 0 20 10 20 20l5 30c0 5-5 10-10 10h-15l-10-30" fill="#FFD194"/>
    
    <!-- Face showing expression of enjoyment/liking -->
    <circle cx="0" cy="-20" r="35" fill="#FFD194"/>
    <path d="M-15 -25c0-5 5-10 10-10s10 5 10 10" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 -25c0-5 5-10 10-10s10 5 10 10" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15 -5c10 10 20 10 30 0" fill="none" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Motion/Focus lines indicating interest -->
  <path d="M180 100c10-10 15-25 10-40" fill="none" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M60 100c-10-10-15-25-10-40" fill="none" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
</svg>