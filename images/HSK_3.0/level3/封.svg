<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Gradients for depth and modern flat aesthetic -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252A34" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="1"/>
    </linearGradient>
    
    <linearGradient id="envelopeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F5D75"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>

    <linearGradient id="envelopeFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6272A4"/>
      <stop offset="100%" stop-color="#4F5D75"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6AD55"/>
      <stop offset="100%" stop-color="#DD6B20"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.3" filter="url(#glow)"/>

  <!-- Conceptual Escalation / Progression Framework (Visual Metaphor for Grammar/Classifier Structure) -->
  <g transform="translate(0, 0)">
    <!-- Baseline Stack representing the unit/classifier aspect ("bức", "lá") -->
    <!-- Base Paper / Document 1 (Background layer) -->
    <rect x="70" y="70" width="100" height="120" rx="6" fill="#2D3748" opacity="0.4" transform="rotate(-5 120 130)"/>
    
    <!-- Base Paper / Document 2 (Middle layer) -->
    <rect x="75" y="65" width="90" height="110" rx="6" fill="#3E4C59" opacity="0.7" transform="rotate(3 120 120)"/>

    <!-- Main Central Envelope (The "Fēng" entity - enclosed, sealed, categorized unit) -->
    <g filter="url(#shadow)">
      <!-- Letter emerging slightly to show content -->
      <path d="M 75 75 L 165 75 L 165 50 L 75 50 Z" fill="url(#paperGrad)" rx="2"/>
      <line x1="90" y1="60" x2="130" y2="60" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round"/>
      <line x1="90" y1="68" x2="150" y2="68" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round"/>

      <!-- Envelope Body -->
      <rect x="65" y="75" width="110" height="85" rx="6" fill="url(#envelopeBody)"/>
      
      <!-- Envelope Inner Pocket Fold -->
      <path d="M 65 75 L 120 120 L 175 75" fill="none" stroke="#2D3748" stroke-width="3" stroke-linejoin="round"/>

      <!-- Envelope Flap (Closed / Sealed state representing "Niêm phong" & Classifier boundary) -->
      <path d="M 65 75 L 120 125 L 175 75 Z" fill="url(#envelopeFlap)"/>
      
      <!-- Accent Sealing Stamp / Wax Seal (Focus point for '封') -->
      <circle cx="120" cy="105" r="14" fill="url(#sealGrad)" filter="url(#shadow)"/>
      
      <!-- Inner seal detail (Abstract crest instead of letters) -->
      <circle cx="120" cy="105" r="9" fill="none" stroke="#ED8936" stroke-width="1.5" opacity="0.6"/>
      <path d="M 115 105 L 125 105 M 120 100 L 120 110" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Progression / Action Indicator (Curved trajectory lines showing enclosure/action) -->
    <path d="M 50 110 C 40 90, 50 70, 70 60" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 190 110 C 200 90, 190 70, 170 60" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Dynamic Spark / Focus Dots -->
    <circle cx="50" cy="110" r="3" fill="#F6AD55"/>
    <circle cx="190" cy="110" r="3" fill="#F6AD55"/>
    <circle cx="120" cy="40" r="2.5" fill="#F6AD55"/>

    <!-- Bottom Stage/Platform representing grammatical unit container boundary -->
    <path d="M 85 180 L 155 180" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <path d="M 100 188 L 140 188" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>