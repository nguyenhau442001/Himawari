<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Glow and shadow filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <linearGradient id="mind-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252A34"/>
      <stop offset="100%" stop-color="#1E232D"/>
    </linearGradient>

    <linearGradient id="warm-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Conceptual Central Object: The "Mind's Eye" / Inner Vision representing "心目" (In the mind / heart) -->
  <g transform="translate(120, 115)">
    
    <!-- Outer silhouette representing the head/mind profile -->
    <path d="M-45,25 C-45,-25 -25,-60 0,-60 C35,-60 55,-30 55,10 C55,45 30,70 0,70 C-25,70 -45,50 -45,25 Z" 
          fill="url(#mind-bg)" 
          stroke="#303846" 
          stroke-width="2"/>

    <!-- Ambient inner warmth/light -->
    <circle cx="5" cy="5" r="45" fill="url(#warm-light)" filter="url(#soft-glow)"/>

    <!-- Central Symbolic Icon: Eye combined with gentle heart/mind warmth (representing perception, memory, and cherished image) -->
    <!-- Stylized open eye outline -->
    <path d="M-32,5 C-15,-18 15,-18 32,5 C15,28 -15,28 -32,5 Z" 
          fill="#1E232D" 
          stroke="#4A5568" 
          stroke-width="2.5"/>

    <!-- Glowing Iris (Focusing on gold/orange accent) -->
    <circle cx="0" cy="5" r="14" fill="#1A1D24"/>
    <circle cx="0" cy="5" r="10" fill="#FFA726" filter="url(#soft-glow)"/>
    <circle cx="0" cy="5" r="6" fill="#FFC107"/>
    <circle cx="-3" cy="2" r="2.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Eyelash / brow delicate curves representing serene vision -->
    <path d="M-22,-10 C-10,-18 10,-18 22,-10" fill="none" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtle radiating light beams upward from the mind's eye -->
    <g stroke="#FFA726" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="0" y1="-32" x2="0" y2="-42" />
      <line x1="-22" y1="-25" x2="-29" y2="-32" />
      <line x1="22" y1="-25" x2="29" y2="-32" />
    </g>

    <!-- Base pedestal / anchor indicating grounded mental conceptualization -->
    <path d="M-20,78 L20,78 C25,78 25,84 20,84 L-20,84 C-25,84 -25,78 -20,78 Z" fill="#303846"/>
  </g>

  <!-- Decorative modern UI frame elements -->
  <circle cx="120" cy="115" r="85" fill="none" stroke="#2B3342" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>
</svg>