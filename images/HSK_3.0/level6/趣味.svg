<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="book-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient light from reading lamp / magic realism -->
  <circle cx="120" cy="110" r="90" fill="url(#warm-glow)" filter="url(#soft-glow)"/>

  <!-- Room Interior Details -->
  <!-- Bookshelf background silhouette -->
  <rect x="25" y="40" width="40" height="110" rx="4" fill="#1e293b" opacity="0.6"/>
  <line x1="25" y1="75" x2="65" y2="75" stroke="#334155" stroke-width="3"/>
  <line x1="25" y1="110" x2="65" y2="110" stroke="#334155" stroke-width="3"/>
  <!-- Small books on shelf -->
  <rect x="30" y="55" width="8" height="20" rx="1" fill="#ec4899"/>
  <rect x="40" y="52" width="10" height="23" rx="1" fill="#f59e0b"/>
  <rect x="32" y="90" width="12" height="20" rx="1" fill="#10b981"/>

  <!-- Potted plant for cozy life context -->
  <path d="M195 150 Q205 130 190 120 Q180 130 195 150" fill="#10b981"/>
  <path d="M190 150 Q175 140 180 125 Q190 135 190 150" fill="#34d399"/>
  <path d="M200 150 Q215 135 205 120 Q195 130 200 150" fill="#059669"/>
  <path d="M188 150 L202 150 L198 168 L192 168 Z" fill="#fb923c"/>

  <!-- Window with night sky and stars -->
  <path d="M165 35 L215 35 L215 85 L165 85 Z" fill="#090d16" stroke="#334155" stroke-width="3" rx="4"/>
  <circle cx="180" cy="50" r="1.5" fill="#fef08a"/>
  <circle cx="200" cy="65" r="1" fill="#fef08a"/>
  <circle cx="190" cy="75" r="1.5" fill="#fef08a"/>
  <!-- Crescent moon outside -->
  <path d="M175 55 Q180 50 177 45 Q183 48 181 58 Z" fill="#fef08a" opacity="0.8"/>

  <!-- Floor and Rug -->
  <ellipse cx="120" cy="205" rx="85" ry="18" fill="#0f172a" opacity="0.8"/>
  <ellipse cx="120" cy="203" rx="75" ry="14" fill="#334155" opacity="0.5"/>

  <!-- Character & Furniture Setup -->
  <!-- Cozy Armchair -->
  <path d="M75 125 Q70 180 85 195 L155 195 Q170 180 165 125 Z" fill="url(#chair-grad)"/>
  <path d="M70 110 Q70 170 80 175 Q90 170 90 130 Z" fill="#475569"/> <!-- Left wing -->
  <path d="M170 110 Q170 170 160 175 Q150 170 150 130 Z" fill="#475569"/> <!-- Right wing -->
  <rect x="85" y="125" width="70" height="65" rx="8" fill="#475569"/>

  <!-- Sitting Character (Engrossed, leaning forward slightly) -->
  <!-- Legs / Pants -->
  <rect x="98" y="170" width="22" height="30" rx="6" fill="#3b82f6"/>
  <rect x="120" y="170" width="22" height="30" rx="6" fill="#3b82f6"/>
  <!-- Shoes -->
  <ellipse cx="94" cy="201" rx="10" ry="5" fill="#1e293b"/>
  <ellipse cx="146" cy="201" rx="10" ry="5" fill="#1e293b"/>

  <!-- Torso & Hoodie -->
  <path d="M95 125 Q120 115 145 125 L152 170 Q120 175 88 170 Z" fill="#ec4899"/>
  <!-- Hoodie pocket & strings -->
  <path d="M110 150 L130 150 L135 165 L105 165 Z" fill="#db2777" opacity="0.6"/>
  <line x1="112" y1="125" x2="115" y2="145" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="125" x2="125" y2="145" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round"/>

  <!-- Head & Face (Expressing fascination, wide eyes, slight smile) -->
  <circle cx="120" cy="98" r="18" fill="#fed7aa"/>
  <!-- Hair (Stylized modern neat cut) -->
  <path d="M102 98 Q103 80 120 80 Q138 80 138 98 Q135 86 120 84 Q105 86 102 98 Z" fill="#1e293b"/>
  
  <!-- Facial Expressions - Captivated & Amused -->
  <!-- Big sparkling eyes -->
  <circle cx="113" cy="97" r="3" fill="#1e293b"/>
  <circle cx="127" cy="97" r="3" fill="#1e293b"/>
  <circle cx="114" cy="96" r="1" fill="#ffffff"/>
  <circle cx="128" cy="96" r="1" fill="#ffffff"/>
  <!-- Cheeks glowing with delight -->
  <circle cx="110" cy="103" r="3.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="130" cy="103" r="3.5" fill="#f43f5e" opacity="0.4"/>
  <!-- Happy smiling mouth -->
  <path d="M115 104 Q120 110 125 104" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms holding the open book -->
  <path d="M95 130 Q85 145 105 155 L115 140 Z" fill="#db2777"/>
  <path d="M145 130 Q155 145 135 155 L125 140 Z" fill="#db2777"/>

  <!-- The Open Book (The center piece of "This book is written very interestingly") -->
  <g transform="translate(120, 142)">
    <!-- Book Shadow -->
    <path d="M-35 10 L0 20 L35 10 L25 35 L0 42 L-25 35 Z" fill="#0f172a" opacity="0.5"/>
    
    <!-- Left Page -->
    <path d="M-35 -2 L-2 -8 L-2 30 L-35 36 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Abstract playful lines/illustrations on pages -->
    <line x1="-28" y1="5" x2="-8" y2="2" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-28" y1="12" x2="-12" y2="9" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-28" y1="19" x2="-15" y2="16" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Tiny graphic pop-up element from the book to signify "interesting/fun" -->
    <circle cx="-20" cy="24" r="3" fill="#38bdf8"/>

    <!-- Right Page -->
    <path d="M2 -8 L35 -2 L35 36 L2 30 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="8" y1="2" x2="28" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="9" x2="28" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="16" x2="28" y2="19" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Tiny star pop-up from right page -->
    <path d="M20 22 L22 26 L26 27 L22 28 L20 32 L18 28 L14 27 L18 26 Z" fill="#f59e0b"/>

    <!-- Book Spine -->
    <path d="M-2 -8 L2 -8 L2 30 L-2 30 Z" fill="url(#book-cover)"/>
  </g>

  <!-- Visual Metaphors of Fun/Interest (Magical floating sparks emanating from the book) -->
  <!-- Spark 1 (Amber Star) -->
  <g transform="translate(75, 105)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#fbbf24"/>
  </g>
  
  <!-- Spark 2 (Cyan Sparkle) -->
  <g transform="translate(160, 95) scale(0.8)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#38bdf8"/>
  </g>

  <!-- Spark 3 (Pink Heart/Joy shape abstracted) -->
  <g transform="translate(145, 75)">
    <path d="M0 3 Q-5 -2 -3 -6 Q0 -8 3 -3 Q5 -2 0 3 Z" fill="#ec4899"/>
  </g>

  <!-- Floating energy circles representing engrossed engagement -->
  <circle cx="95" cy="80" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="150" cy="115" r="1.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="80" cy="135" r="2.5" fill="#ec4899" opacity="0.6"/>

</svg>