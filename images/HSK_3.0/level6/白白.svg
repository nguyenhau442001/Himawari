<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptualizing "Uổng công/Vô ích" (Wasted effort) -->
  <!-- A bucket of water being poured out into a dry, cracked ground, representing effort lost -->
  
  <!-- Cracked ground -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#3D4451"/>
  <path d="M80 180 L85 200 M120 180 L115 205 M160 180 L165 195" stroke="#2A2E38" stroke-width="2"/>
  
  <!-- Bucket -->
  <path d="M140 70 L170 70 L165 120 L145 120 Z" fill="#FFB84D"/>
  <path d="M140 70 L145 120" fill="#E69F33"/>
  <path d="M135 65 L175 65" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Spilled Water -->
  <path d="M150 120 C150 150 120 160 100 180" stroke="#4DA6FF" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="100" cy="180" rx="15" ry="5" fill="#4DA6FF" opacity="0.6"/>
  
  <!-- Person's hands reaching out in frustration/realization -->
  <g fill="#FFD180">
    <path d="M70 100 C60 100 50 110 50 120 L60 120 L60 110 Z"/>
    <path d="M80 90 C70 90 60 100 60 110 L70 110 L70 100 Z"/>
    <path d="M90 90 C80 90 70 100 70 110 L80 110 L80 100 Z"/>
    <path d="M100 100 C90 100 80 110 80 120 L90 120 L90 110 Z"/>
  </g>
  
  <!-- Head of the person looking down at the spill -->
  <circle cx="70" cy="80" r="15" fill="#FFD180"/>
  <path d="M65 75 L67 77 M73 75 L75 77" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  <path d="M65 85 Q70 88 75 85" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>