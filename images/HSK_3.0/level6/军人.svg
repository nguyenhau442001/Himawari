<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Border/Glow for Modern UI Feel -->
  <rect x="1" y="1" width="238" height="238" rx="23" fill="none" stroke="#2A2F3D" stroke-width="1.5"/>

  <!-- Conceptual Background: Borderline / Mountain / Homeland element subtly integrated -->
  <path d="M 30 185 L 90 145 L 140 175 L 210 120 L 210 205 L 30 205 Z" fill="#222836"/>
  <path d="M 80 185 L 130 155 L 180 185 L 210 165 L 210 205 L 80 205 Z" fill="#1E2330"/>

  <!-- Central Character (Soldier / 军人) -->
  <g transform="translate(0, 5)">
    <!-- Shoulders and Torso (Uniform) -->
    <path d="M 80 175 C 80 145, 95 130, 120 130 C 145 130, 160 145, 160 175 L 185 200 C 185 200, 150 215, 120 215 C 90 215, 55 200, 55 200 Z" fill="#3B5238"/>
    
    <!-- Uniform Collar & Details -->
    <polygon points="105,130 120,150 135,130" fill="#2E402B"/>
    <rect x="115" y="150" width="10" height="25" fill="#4A6644"/>
    <!-- Collar stars / insignia (Gold accent) -->
    <circle cx="95" cy="140" r="3" fill="#F39C12"/>
    <circle cx="145" cy="140" r="3" fill="#F39C12"/>

    <!-- Neck -->
    <rect x="110" y="115" width="20" height="20" fill="#E8BEAC"/>

    <!-- Head -->
    <circle cx="120" cy="95" r="22" fill="#E8BEAC"/>

    <!-- Facial features (Simplified modern flat style) -->
    <!-- Eyes -->
    <line x1="110" y1="92" x2="116" y2="94" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
    <line x1="124" y1="94" x2="130" y2="92" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
    <!-- Confident calm mouth -->
    <path d="M 115 106 Q 120 109 125 106" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>

    <!-- Military Cap (Peaked cap / Service cap style) -->
    <!-- Cap crown -->
    <path d="M 96 85 C 96 70, 144 70, 144 85 C 135 88, 105 88, 96 85 Z" fill="#3B5238"/>
    <!-- Cap visor/brim -->
    <path d="M 97 86 C 105 91, 135 91, 143 86 C 138 96, 102 96, 97 86 Z" fill="#1E2330"/>
    <!-- Cap badge / Emblem (Gold accent) -->
    <polygon points="120,77 122,83 127,83 123,86 125,91 120,88 115,91 117,86 113,83 118,83" fill="#F39C12"/>
  </g>

  <!-- Focus Accent: Laurel / Protection shield element subtly framing the upper portion -->
  <path d="M 65 75 Q 45 95 55 125" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 175 75 Q 195 95 185 125" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>