<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glowing atmosphere representing the present moment/focus -->
  <circle cx="120" cy="115" r="70" fill="#262C38" opacity="0.6"/>

  <!-- Physical Object representing "当下" (The Present / Right Now): A modern desk hourglass combined with a glowing focal point, symbolizing the exact passing moment -->
  <g transform="translate(0, 5)">
    <!-- Hourglass Stand - Top -->
    <path d="M 85,50 L 155,50 L 150,58 L 90,58 Z" fill="#4A5568" rx="2"/>
    
    <!-- Hourglass Stand - Bottom -->
    <path d="M 85,166 L 155,166 L 150,158 L 90,158 Z" fill="#4A5568" rx="2"/>
    
    <!-- Supporting Pillars -->
    <rect x="94" y="58" width="6" height="100" fill="#323B4D" rx="3"/>
    <rect x="140" y="58" width="6" height="100" fill="#323B4D" rx="3"/>

    <!-- Glass Bulb - Top -->
    <path d="M 98,62 C 98,62 98,102 120,108 C 142,102 142,62 142,62 Z" fill="#2D3748" opacity="0.8"/>
    <!-- Top Sand (Golden/Orange accent for focus) -->
    <path d="M 104,78 C 104,78 108,98 120,104 C 132,98 136,78 136,78 Z" fill="#F6AD55"/>

    <!-- Glass Bulb - Bottom -->
    <path d="M 98,154 C 98,154 98,114 120,108 C 142,114 142,154 142,154 Z" fill="#2D3748" opacity="0.8"/>
    
    <!-- Bottom Sand Pile (Accumulating in the present) -->
    <path d="M 105,150 C 112,150 120,140 120,140 C 120,140 128,150 135,150 Z" fill="#ED8936"/>

    <!-- Falling Sand Stream -->
    <line x1="120" y1="108" x2="120" y2="135" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Central Focus Sparkle (Emphasizing "Right Now" / 当下) -->
    <g transform="translate(120, 108)">
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      <path d="M 0,-10 L 0,10 M -10,0 L 10,0" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Glass Highlights -->
    <path d="M 102,68 C 102,68 104,85 110,95" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"/>
    <path d="M 102,148 C 102,148 104,130 110,120" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"/>
  </g>

  <!-- Ground shadow for depth -->
  <ellipse cx="120" cy="178" rx="45" ry="6" fill="#111318"/>
</svg>