<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & interior setting -->
  <path d="M0 0H240V240H0z" fill="url(#bg-gradient)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient light glow from ceiling lamp -->
  <circle cx="120" cy="80" r="100" fill="url(#lamp-glow)"/>

  <!-- Background Office Elements -->
  <!-- Bookshelf / Wall pattern -->
  <rect x="25" y="45" width="40" height="85" rx="4" fill="#334155" opacity="0.4"/>
  <line x1="25" y1="70" x2="65" y2="70" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <line x1="25" y1="95" x2="65" y2="95" stroke="#475569" stroke-width="2" opacity="0.4"/>
  
  <!-- Window with city night silhouette -->
  <path d="M175 35H215V110H175Z" fill="#1e293b" stroke="#475569" stroke-width="2" opacity="0.6"/>
  <path d="M185 45H205V75H185Z" fill="#38bdf8" opacity="0.15"/>
  <path d="M185 85H205V105H185Z" fill="#fb923c" opacity="0.15"/>

  <!-- Meeting Table -->
  <path d="M30 160L210 160C215 160 218 163 216 168L195 210C193 214 189 216 185 216H55C51 216 47 214 45 210L24 168C22 163 25 160 30 160Z" fill="#334155"/>
  <path d="M40 170H200L185 206H55L40 170Z" fill="#1e293b"/>

  <!-- Props on Table (Notes, pens, coffee cup) -->
  <rect x="100" y="178" width="22" height="18" rx="2" fill="#cbd5e1" transform="rotate(-10 100 178)"/>
  <rect x="120" y="182" width="22" height="18" rx="2" fill="#f8fafc" transform="rotate(15 120 182)"/>
  <circle cx="148" cy="188" r="7" fill="#f43f5e"/>
  <path d="M75 180H90V192H75Z" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Speaker Characters (Background - "Everyone" sharing opinions) -->
  <!-- Speaker 1 (Left) -->
  <g transform="translate(45, 105)">
    <!-- Body -->
    <path d="M10 50C10 38 18 30 30 30H40C52 30 60 38 60 50V70H10V50Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="35" cy="16" r="13" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M22 14C22 7 28 4 35 4C42 4 48 7 48 14C48 16 47 18 47 18H23C23 18 22 16 22 14Z" fill="#1e293b"/>
    <!-- Gesturing arm -->
    <path d="M50 35L62 25" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Speaker 2 (Right) -->
  <g transform="translate(145, 100)">
    <!-- Body -->
    <path d="M10 55C10 43 18 35 30 35H40C52 35 60 43 60 55V75H10V55Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="35" cy="18" r="13" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M21 16C21 8 27 3 35 3C43 3 49 8 49 16C49 19 48 23 48 23H22C22 23 21 19 21 16Z" fill="#701a75"/>
    <!-- Gesturing arm -->
    <path d="M15 42L4 32" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Speech / Idea Indicator Elements (Subtle floating abstract shapes representing opinions) -->
  <g opacity="0.8">
    <path d="M75 90C75 84 80 80 86 80H94C100 80 105 84 105 90V96C105 102 100 106 94 106H89L82 112V106H86C80 106 75 102 75 96V90Z" fill="#38bdf8" opacity="0.2"/>
    <path d="M140 85C140 79 145 75 151 75H159C165 75 170 79 170 85V91C170 97 165 101 159 101H154L147 107V101H151C145 101 140 97 140 91V85Z" fill="#f43f5e" opacity="0.2"/>
  </g>

  <!-- MAIN LISTENING SUBJECT (Foreground Center - "Anh ấy" / He) -->
  <g transform="translate(90, 110)">
    <!-- Torso leaning forward attentively -->
    <path d="M12 55C12 40 22 30 38 30H62C78 30 88 40 88 55V90H12V55Z" fill="#0284c7"/>
    <!-- Collar & Tie -->
    <path d="M38 30L50 45L62 30H38Z" fill="#f8fafc"/>
    <path d="M47 45L50 65L53 45H47Z" fill="#fbbf24"/>

    <!-- Head (Leaned slightly forward, focused expression) -->
    <circle cx="50" cy="14" r="16" fill="#fde047"/>
    <circle cx="50" cy="14" r="16" fill="#fef08a"/>
    
    <!-- Hair -->
    <path d="M34 14C34 6 41 2 50 2C59 2 66 6 66 14C66 16 65 19 65 19H35C35 19 34 16 34 14Z" fill="#0f172a"/>

    <!-- Face details showing deep concentration -->
    <!-- Focused eyes looking left/center towards speakers -->
    <circle cx="43" cy="15" r="2" fill="#0f172a"/>
    <circle cx="53" cy="15" r="2" fill="#0f172a"/>
    <!-- Gentle attentive smile/mouth line -->
    <path d="M46 22C48 23 51 23 53 22" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Eyebrows lowered in serious/attentive listening -->
    <path d="M41 11L45 12" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M51 12L55 11" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hands resting attentively / chin or posture -->
    <path d="M22 65C25 55 35 52 45 55" stroke="#fde047" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M78 65C75 55 65 52 55 55" stroke="#fde047" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Focused Sound/Listening Wave Vibe (Subtle glowing aura near main character's ear) -->
  <path d="M136 120C139 123 139 127 136 130" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M139 116C144 121 144 129 139 134" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

</svg>