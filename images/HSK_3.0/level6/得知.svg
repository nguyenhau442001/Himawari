<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle atmosphere (joyful arrival of news) -->
  <circle cx="120" cy="110" r="80" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="110" r="50" fill="#2F3643" opacity="0.4"/>

  <!-- Radiating communication / news wave lines -->
  <path d="M 85 75 C 95 65, 145 65, 155 75" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 70 60 C 85 45, 155 45, 170 60" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 55 45 C 75 25, 165 25, 185 45" stroke="#F39C12" stroke-width="3" stroke-linecap="round" fill="none" opacity="1"/>

  <!-- Glowing/incoming message card representing "news / information" -->
  <g transform="translate(0, -5)">
    <rect x="75" y="65" width="90" height="60" rx="10" fill="#2D3748" stroke="#F39C12" stroke-width="2"/>
    <!-- Card content lines -->
    <rect x="90" y="80" width="45" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="90" y="94" width="60" height="5" rx="2.5" fill="#A0AEC0"/>
    <rect x="90" y="106" width="30" height="5" rx="2.5" fill="#A0AEC0"/>
    <!-- Sparkling accent (receiving news moment) -->
    <path d="M 152 75 L 155 82 L 162 85 L 155 88 L 152 95 L 149 88 L 142 85 L 149 82 Z" fill="#F1C40F"/>
  </g>

  <!-- Motion lines showing action/discovery -->
  <path d="M 95 125 L 85 135" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 145 125 L 155 135" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Human Character (Reacting to good news: "得知" - receiving & realizing) -->
  <!-- Body/Torso -->
  <path d="M 90 200 C 90 170, 150 170, 150 200 Z" fill="#3182CE"/>
  <rect x="105" y="155" width="30" height="30" rx="6" fill="#4A5568"/>

  <!-- Neck -->
  <rect x="112" y="145" width="16" height="15" fill="#F6AD55"/>

  <!-- Head -->
  <circle cx="120" cy="125" r="22" fill="#F6AD55"/>

  <!-- Hair -->
  <path d="M 98 120 C 100 100, 140 100, 142 120 C 135 112, 105 112, 98 120 Z" fill="#2D3748"/>

  <!-- Facial expression: happy/enlightened realization (eyes wide, smiling) -->
  <circle cx="112" cy="124" r="2.5" fill="#1A1D24"/>
  <circle cx="128" cy="124" r="2.5" fill="#1A1D24"/>
  <path d="M 115 133 C 117 137, 123 137, 125 133" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Dynamic Hands (Action: reaching up, grasping/receiving knowledge or news) -->
  <path d="M 92 165 C 80 155, 75 130, 85 115" stroke="#F6AD55" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="85" cy="115" r="5" fill="#F6AD55"/>

  <path d="M 148 165 C 160 155, 165 130, 155 115" stroke="#F6AD55" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="155" cy="115" r="5" fill="#F6AD55"/>

  <!-- Sparkles of joy / realization around head -->
  <path d="M 95 95 L 97 100 L 102 102 L 97 104 L 95 109 L 93 104 L 88 102 L 93 100 Z" fill="#F1C40F"/>
  <path d="M 145 95 L 147 100 L 152 102 L 147 104 L 145 109 L 143 104 L 138 102 L 143 100 Z" fill="#F1C40F"/>

  <!-- Base Ground Line -->
  <rect x="50" y="200" width="140" height="4" rx="2" fill="#4A5568"/>
</svg>