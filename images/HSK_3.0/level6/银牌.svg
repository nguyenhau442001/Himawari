<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ribbon -->
  <g>
    <!-- Left ribbon tail -->
    <path d="M96 68 L80 120 L104 112 Z" fill="#3B82F6" opacity="0.9"/>
    <!-- Right ribbon tail -->
    <path d="M144 68 L160 120 L136 112 Z" fill="#1D4ED8" opacity="0.9"/>
    
    <!-- Main loop behind medal -->
    <path d="M100 70 C100 40 140 40 140 70 L140 92 C140 92 120 86 100 92 Z" fill="#2563EB"/>
  </g>

  <!-- Silver Medal (Noun Object) -->
  <g>
    <!-- Outer rim (darker silver shadow) -->
    <circle cx="120" cy="132" r="46" fill="#94A3B8"/>
    
    <!-- Main silver body -->
    <circle cx="120" cy="130" r="44" fill="#E2E8F0"/>
    
    <!-- Inner concentric circle / rim line -->
    <circle cx="120" cy="130" r="38" fill="none" fill-rule="evenodd" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Inner recessed face -->
    <circle cx="120" cy="130" r="36" fill="#F1F5F9"/>

    <!-- Prominent Star in the Center -->
    <polygon points="120,104 126,118 142,118 129,128 134,144 120,134 106,144 111,128 98,118 114,118" fill="#64748B"/>
    
    <!-- Star highlight for metallic sheen -->
    <polygon points="120,104 126,118 133,118 120,126 114,118" fill="#94A3B8" opacity="0.6"/>
  </g>

  <!-- Specular highlights for metallic glossy finish -->
  <path d="M90 110 C96 100 110 94 125 94 C110 94 98 102 90 110 Z" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="98" cy="116" r="3" fill="#FFFFFF" opacity="0.5"/>
</svg>