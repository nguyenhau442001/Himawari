<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Aura representing global/universal connectivity -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#252A37" stroke-width="1.5" opacity="0.6"/>

  <!-- Central Object: Universal Master Key combining connectivity elements (representing "thông dụng" - widely used, universally applicable tool/key) -->
  <g transform="translate(120, 115)">
    <!-- Globe/Network Core on Key Bow -->
    <circle cx="0" cy="-45" r="28" fill="#222733" stroke="#F5A623" stroke-width="3"/>
    <!-- Meridian/Equator lines inside core -->
    <path d="M -28 -45 H 28" stroke="#F5A623" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 -73 V -17" stroke="#F5A623" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="-45" rx="12" ry="28" fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.5"/>

    <!-- Key Shaft -->
    <rect x="-6" y="-20" width="12" height="75" rx="3" fill="#F5A623"/>

    <!-- Key Teeth / Universal Nodes (representing multi-compatibility) -->
    <path d="M 6 10 H 22 V 20 H 6 Z" fill="#F5A623"/>
    <path d="M 6 35 H 18 V 45 H 6 Z" fill="#F5A623"/>

    <!-- Highlight accents for sleek modern flat look -->
    <rect x="-3" y="-15" width="3" height="65" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Accent Orbit Dots (Universal connectivity nodes) -->
  <circle cx="65" cy="75" r="5" fill="#38BDF8"/>
  <circle cx="175" cy="85" r="4" fill="#38BDF8"/>
  <circle cx="80" cy="175" r="3.5" fill="#F5A623"/>
  <circle cx="160" cy="165" r="4.5" fill="#38BDF8"/>
  
  <!-- Connection rays -->
  <line x1="65" y1="75" x2="95" y2="90" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="175" y1="85" x2="140" y2="95" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>
</svg>