<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glows for high-tech atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.3"/>
  
  <!-- Central Physical Object: Modern Tablet / Digital Screen displaying New Media streams -->
  <!-- Outer Device Frame (Slate/Dark Gray) -->
  <rect x="55" y="45" width="130" height="150" rx="12" fill="#2A323D" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Screen Area -->
  <rect x="65" y="55" width="110" height="130" rx="6" fill="#111418"/>

  <!-- UI Elements on the screen representing "New Media" (Digital feeds, streaming, connection) -->
  <!-- Header bar -->
  <circle cx="77" cy="67" r="3" fill="#FF5252"/>
  <circle cx="87" cy="67" r="3" fill="#FFC107"/>
  <circle cx="97" cy="67" r="3" fill="#4CAF50"/>
  
  <!-- Content Card 1 (Video / Stream) -->
  <rect x="73" y="78" width="94" height="42" rx="4" fill="#1E2631"/>
  <!-- Play button icon -->
  <polygon points="113,93 113,105 125,99" fill="#00E5FF"/>
  
  <!-- Content Card 2 (Social Feed / Text stream lines) -->
  <rect x="73" y="126" width="94" height="24" rx="4" fill="#1E2631"/>
  <rect x="81" y="132" width="45" height="4" rx="2" fill="#A0AEC0"/>
  <rect x="81" y="140" width="70" height="3" rx="1.5" fill="#4A5568"/>

  <!-- Floating Digital Icons / Interactive Nodes representing Connectivity & Information -->
  <!-- Node top left -->
  <circle cx="42" cy="70" r="14" fill="#2563EB" opacity="0.8"/>
  <!-- Network symbol inside node -->
  <path d="M38 70 L46 70 M42 66 L42 74" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Node top right -->
  <circle cx="198" cy="80" r="12" fill="#F59E0B" opacity="0.9"/>
  <!-- Broadcast waves inside node -->
  <path d="M194 77 A 5 5 0 0 1 194 83 M192 75 A 8 8 0 0 1 192 85" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Node bottom right -->
  <circle cx="185" cy="165" r="15" fill="#10B981" opacity="0.9"/>
  <!-- Share / Global symbol inside node -->
  <circle cx="185" cy="160" r="2" fill="#FFFFFF"/>
  <circle cx="178" cy="170" r="2" fill="#FFFFFF"/>
  <circle cx="192" cy="170" r="2" fill="#FFFFFF"/>
  <path d="M184 162 L180 168 M186 162 L190 168" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Connection beam lines linking nodes to the central device -->
  <line x1="55" y1="75" x2="65" y2="75" stroke="#2563EB" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="185" y1="90" x2="175" y2="90" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="170" y1="160" x2="160" y2="150" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Dynamic Accent wave at the bottom representing continuous flow/broadcast -->
  <path d="M 80 185 Q 120 195 160 185" stroke="#00E5FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Stand base for the central screen (giving it a solid physical object anchor) -->
  <path d="M100 195 L140 195 L145 202 L95 202 Z" fill="#4A5568"/>
  <rect x="90" y="202" width="60" height="4" rx="2" fill="#718096"/>
</svg>