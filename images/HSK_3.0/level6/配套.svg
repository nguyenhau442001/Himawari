<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient for warm, cozy living room interior -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="wood-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#182232"/>
    </linearGradient>
    <linearGradient id="sofa-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Wallpaper accent lines & window -->
  <path d="M180 20 L220 20 L220 120 L180 120 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M185 25 L215 25 L215 115 L185 115 Z" fill="#0f172a"/>
  <line x1="200" y1="25" x2="200" y2="115" stroke="#334155" stroke-width="2"/>
  <line x1="185" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="2"/>

  <!-- Wooden Floor -->
  <polygon points="0,170 240,170 240,240 0,240" fill="url(#wood-floor)"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#0b1320" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#0b1320" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="230" x2="240" y2="230" stroke="#0b1320" stroke-width="1" opacity="0.5"/>

  <!-- Wall art matching the furniture theme -->
  <rect x="60" y="35" width="50" height="40" rx="4" fill="#334155"/>
  <rect x="65" y="40" width="40" height="30" rx="2" fill="#1e293b"/>
  <circle cx="85" cy="50" r="6" fill="#f59e0b"/>
  <path d="M70 62 Q85 52 100 62 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- MATCHING FURNITURE SET (配套家具: Sofa, Coffee Table, Floor Lamp sharing design style) -->

  <!-- 1. Floor Lamp (Matching style: slender matte black pole, amber warm glow) -->
  <line x1="30" y1="180" x2="30" y2="60" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M20 60 L40 60 L35 75 L25 75 Z" fill="#f59e0b"/>
  <!-- Lamp glow -->
  <circle cx="30" cy="75" r="25" fill="#f59e0b" opacity="0.15"/>

  <!-- 2. Matching Sofa (Modern blue tone with rounded corner matching the table & art) -->
  <!-- Sofa base shadow -->
  <ellipse cx="140" cy="180" rx="75" ry="10" fill="#000000" opacity="0.4"/>
  <!-- Sofa Backrest -->
  <rect x="75" y="105" width="130" height="50" rx="12" fill="#0284c7"/>
  <rect x="80" y="110" width="120" height="40" rx="8" fill="url(#sofa-grad)"/>
  <!-- Sofa Seat Cushions -->
  <rect x="70" y="145" width="140" height="30" rx="8" fill="#38bdf8"/>
  <rect x="75" y="150" width="62" height="20" rx="6" fill="#7dd3fc"/>
  <rect x="143" y="150" width="62" height="20" rx="6" fill="#7dd3fc"/>
  <!-- Sofa Armrests -->
  <rect x="65" y="125" width="18" height="45" rx="8" fill="#0284c7"/>
  <rect x="202" y="125" width="18" height="45" rx="8" fill="#0284c7"/>

  <!-- 3. Matching Coffee Table (Same rounded geometry, wood top & matching accent) -->
  <ellipse cx="140" cy="195" rx="45" ry="8" fill="#000000" opacity="0.3"/>
  <!-- Table Legs -->
  <line x1="105" y1="195" x2="95" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="195" x2="185" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="198" x2="120" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Table Top (Matching rounded pill shape) -->
  <rect x="90" y="185" width="100" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="92" y="187" width="96" height="10" rx="5" fill="#f8fafc"/>

  <!-- Deco items on table (Matching set theme: plant & tray) -->
  <path d="M110 187 L115 175 L120 187 Z" fill="#10b981"/>
  <ellipse cx="115" cy="187" rx="6" ry="3" fill="#334155"/>
  <circle cx="155" cy="190" r="6" fill="#f59e0b"/>

  <!-- Characters happily admiring their new matching furniture set -->
  <!-- Character 1 (Sitting on sofa) -->
  <circle cx="105" cy="120" r="12" fill="#fbcfe8"/> <!-- Head -->
  <path d="M95 115 C95 105 115 105 115 115 Z" fill="#475569"/> <!-- Hair -->
  <path d="M90 145 C90 130 120 130 120 145 Z" fill="#ec4899"/> <!-- Torso -->
  <!-- Hand gesturing satisfaction -->
  <circle cx="85" cy="135" r="4" fill="#fbcfe8"/>

  <!-- Character 2 (Standing, pointing at the coordinated set with approval) -->
  <!-- Body/Torso -->
  <path d="M165 140 L185 140 L190 175 L160 175 Z" fill="#3b82f6"/>
  <!-- Head -->
  <circle cx="175" cy="115" r="11" fill="#fbcfe8"/>
  <path d="M165 110 C165 102 185 102 185 110 Z" fill="#1e293b"/> <!-- Hair -->
  <!-- Raised arm pointing at furniture -->
  <path d="M180 130 L195 120" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="197" cy="118" r="3" fill="#fbcfe8"/>
  <!-- Legs -->
  <line x1="168" y1="175" x2="168" y2="205" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <line x1="182" y1="175" x2="182" y2="205" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Subtle glow highlighting the "配套" (matching/coordinated) concept harmoniously -->
  <path d="M60 100 Q140 80 220 100" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
</svg>