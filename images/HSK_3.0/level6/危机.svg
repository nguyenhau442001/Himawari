<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Decorative Element: Downward Trend -->
  <path d="M40 100 L80 120 L120 110 L160 160 L200 180" stroke="#2D333F" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M185 180 H200 V165" stroke="#2D333F" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Crisis Icon: Warning Triangle -->
  <path d="M120 45 L210 195 H30 Z" fill="#F59E0B"/>
  
  <!-- Shadow for depth -->
  <path d="M120 45 L210 195 H180 L120 65 Z" fill="#D97706" opacity="0.3"/>

  <!-- Exclamation Mark (Cutout) -->
  <rect x="114" y="95" width="12" height="50" rx="6" fill="#1A1D24"/>
  <circle cx="120" cy="165" r="7" fill="#1A1D24"/>

  <!-- Crisis Visual: The Crack -->
  <path d="M70 195 L95 150 L80 125 L105 90" stroke="#1A1D24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Accent: Plunging Arrow inside the triangle -->
  <path d="M145 100 L170 140 L155 140 M170 140 L170 125" stroke="#1A1D24" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>