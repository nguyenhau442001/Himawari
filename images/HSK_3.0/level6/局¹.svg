<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Visualizing "局" as a "Game/Match/Situation" (Ván cờ/Thế cuộc) -->
  <!-- Using a geometric, flat, modern representation of a board game state -->
  
  <!-- The Board Grid -->
  <g stroke="#3A404D" stroke-width="2" fill="none">
    <line x1="60" y1="80" x2="180" y2="80"/>
    <line x1="60" y1="120" x2="180" y2="120"/>
    <line x1="60" y1="160" x2="180" y2="160"/>
    <line x1="80" y1="60" x2="80" y2="180"/>
    <line x1="120" y1="60" x2="120" y2="180"/>
    <line x1="160" y1="60" x2="160" y2="180"/>
  </g>

  <!-- The "Situation/Match" pieces (Contrast of two sides) -->
  <!-- Gold pieces -->
  <circle cx="80" cy="80" r="12" fill="#FFB86C"/>
  <circle cx="160" cy="120" r="12" fill="#FFB86C"/>
  <circle cx="120" cy="160" r="12" fill="#FFB86C"/>
  
  <!-- Slate/Blue pieces -->
  <circle cx="120" cy="80" r="12" fill="#6272A4"/>
  <circle cx="80" cy="120" r="12" fill="#6272A4"/>
  <circle cx="160" cy="160" r="12" fill="#6272A4"/>

  <!-- The "Escalation/Progression" element: A sharp, decisive move indicator -->
  <!-- A path showing the progression of the "match" (thế cuộc) -->
  <path d="M 80 80 L 120 80 L 120 160" stroke="#FFB86C" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Final decisive marker -->
  <polygon points="120,160 112,145 128,145" fill="#FFB86C"/>
  
</svg>