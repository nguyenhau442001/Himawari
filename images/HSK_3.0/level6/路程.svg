<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Grid/Background Terrain lines -->
  <path d="M20 180 C 80 160, 160 160, 220 180" stroke="#2A2F3D" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M20 200 C 80 180, 160 180, 220 200" stroke="#2A2F3D" stroke-width="1.5" fill="none"/>

  <!-- Destination Point A (Start) -->
  <circle cx="50" cy="140" r="6" fill="#38BDF8"/>
  <circle cx="50" cy="140" r="12" fill="#38BDF8" fill-opacity="0.2"/>
  
  <!-- Destination Point B (End) -->
  <circle cx="190" cy="100" r="6" fill="#FB923C"/>
  <circle cx="190" cy="100" r="12" fill="#FB923C" fill-opacity="0.2"/>

  <!-- The Route Curve (路程 - journey / distance path) -->
  <path d="M 50 140 C 90 140, 120 70, 190 100" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Glowing nodes along the path representing distance intervals -->
  <circle cx="95" cy="120" r="3" fill="#1A1D24" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="145" cy="95" r="3" fill="#1A1D24" stroke="#FBBF24" stroke-width="2"/>

  <!-- Modern High-speed Train (Bullet train traversing the journey) representing "高铁" in context -->
  <g transform="translate(115, 80) rotate(-15)">
    <!-- Train Body -->
    <path d="M -22 0 L 18 0 C 22 0, 25 -2, 27 -5 L 32 -8 C 35 -10, 32 -13, 27 -13 L -22 -13 Z" fill="#F1F5F9"/>
    <!-- Red Accent Stripe -->
    <path d="M -22 -6 L 27 -6 C 29 -6, 30 -7, 27 -8 L -22 -8 Z" fill="#EF4444"/>
    <!-- Windows -->
    <rect x="-15" y="-11" width="5" height="4" rx="1" fill="#0F172A"/>
    <rect x="-7" y="-11" width="5" height="4" rx="1" fill="#0F172A"/>
    <rect x="1" y="-11" width="5" height="4" rx="1" fill="#0F172A"/>
    <rect x="9" y="-11" width="5" height="4" rx="1" fill="#0F172A"/>
    <!-- Headlight glow -->
    <circle cx="30" cy="-6" r="2" fill="#FDE047"/>
    <!-- Wheels -->
    <circle cx="-12" cy="1" r="3" fill="#475569"/>
    <circle cx="12" cy="1" r="3" fill="#475569"/>
  </g>

  <!-- Location Pin / Marker icon elements -->
  <path d="M190 85 C182 85, 176 91, 176 99 C176 109, 190 120, 190 120 C190 120, 204 109, 204 99 C204 91, 198 85, 190 85 Z" fill="#FB923C" fill-opacity="0.2"/>
  <circle cx="190" cy="98" r="3" fill="#FFF"/>

</svg>