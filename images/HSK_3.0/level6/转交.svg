  <line x1="105" y1="110" x2="135" y2="110" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="130" x2="135" y2="130" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="150" x2="120" y2="150" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  
