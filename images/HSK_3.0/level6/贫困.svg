<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container & Sky -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="houseWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="newRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  
  <!-- Ambient light from future/development -->
  <circle cx="180" cy="100" r="90" fill="url(#warmLight)" />

  <!-- Distant Mountains / Rural landscape -->
  <path d="M0 170 Q40 140 80 160 T160 150 T240 165 L240 240 L0 240 Z" fill="#1e293b" />
  <path d="M0 185 Q60 160 120 175 T240 170 L240 240 L0 240 Z" fill="#0f172a" />

  <!-- Ground -->
  <rect x="0" y="190" width="240" height="50" fill="#0b0f19" />
  <path d="M0 190 Q120 185 240 190 L240 240 L0 240 Z" fill="#111827" />

  <!-- Context: Rural house transitioning (Half old wood, half modern upgrade/aid) -->
  <!-- Old house side (Left) -->
  <path d="M20 190 L20 130 L65 100 L110 130 L110 190 Z" fill="url(#houseWood)" />
  <!-- Patchy roof -->
  <path d="M15 132 L65 96 L115 132 L110 140 L20 140 Z" fill="#451a03" />
  <!-- Old wooden planks texture -->
  <line x1="35" y1="135" x2="35" y2="190" stroke="#78350f" stroke-width="2" />
  <line x1="60" y1="120" x2="60" y2="190" stroke="#78350f" stroke-width="2" />
  <line x1="85" y1="135" x2="85" y2="190" stroke="#78350f" stroke-width="2" />

  <!-- New construction / Aid materials (Right / Center) -->
  <rect x="110" y="125" width="95" height="65" fill="#f8fafc" />
  <!-- Modern Blue Roof added by government aid -->
  <path d="M105 125 L157 95 L210 125 Z" fill="url(#newRoof)" />
  <!-- Solar panel on roof (symbol of modernization/help) -->
  <rect x="135" y="105" width="25" height="15" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="147.5" y1="105" x2="147.5" y2="120" stroke="#38bdf8" stroke-width="1" />

  <!-- New Window with warm light -->
  <rect x="140" y="140" width="25" height="35" rx="4" fill="#fbbf24" />
  <rect x="145" y="145" width="15" height="25" fill="#fef08a" />
  <line x1="152.5" y1="145" x2="152.5" y2="170" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Aid boxes / Agricultural tools stacked outside (Government support props) -->
  <rect x="95" y="170" width="20" height="20" rx="3" fill="#d97706" />
  <rect x="98" y="173" width="14" height="14" rx="1" fill="#f59e0b" />
  <rect x="80" y="175" width="18" height="15" rx="2" fill="#b45309" />
  
  <!-- Character 1: Government Official / Aid Worker (Helping hand, pointing forward to brighter future) -->
  <g transform="translate(115, 135)">
    <!-- Body / Suit -->
    <path d="M25 30 L35 55 L20 55 Z" fill="#0284c7" />
    <path d="M20 30 L30 55 L15 55 Z" fill="#0369a1" />
    <rect x="16" y="25" width="16" height="30" rx="4" fill="#0284c7" />
    <!-- White shirt collar & red tie accent -->
    <polygon points="24,25 21,33 27,33" fill="#f8fafc" />
    <polygon points="24,31 23,40 25,40" fill="#ef4444" />
    
    <!-- Head -->
    <circle cx="24" cy="16" r="8" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M16 15 Q24 9 32 15 Q30 11 24 10 Q18 11 16 15 Z" fill="#1e293b" />
    
    <!-- Arm pointing ahead -->
    <path d="M28 28 L42 22" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="43" cy="21" r="3" fill="#fcd34d" />
  </g>

  <!-- Character 2: Local Villager (Expressing gratitude and hope) -->
  <g transform="translate(55, 130)">
    <!-- Body -->
    <rect x="14" y="28" width="18" height="32" rx="5" fill="#10b981" />
    <!-- Scarf (warmth) -->
    <path d="M12 28 Q23 35 28 28 L25 36 Q19 32 14 36 Z" fill="#ef4444" />
    
    <!-- Head -->
    <circle cx="21" cy="16" r="8" fill="#fcd34d" />
    <!-- Smiling face features (simplified vector style) -->
    <path d="M19 17 Q21 19 23 17" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="18" cy="14" r="1" fill="#1e293b" />
    <circle cx="24" cy="14" r="1" fill="#1e293b" />

    <!-- Hair (tied back worker style) -->
    <path d="M13 15 Q21 8 28 15 Q29 12 25 10 Q21 8 16 11 Z" fill="#451a03" />
    <circle cx="28" cy="14" r="3" fill="#451a03" />

    <!-- Arm gesturing happily -->
    <path d="M16 32 L7 25" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="6" cy="24" r="2.5" fill="#fcd34d" />
  </g>

  <!-- Child character holding a small book/notebook (symbolizing future/education enabled by poverty alleviation) -->
  <g transform="translate(85, 150)">
    <!-- Body -->
    <rect x="10" y="20" width="14" height="25" rx="4" fill="#8b5cf6" />
    <!-- Head -->
    <circle cx="17" cy="10" r="6.5" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M11 9 Q17 4 23 9 Q20 6 17 6 Q14 6 11 9 Z" fill="#1e293b" />
    <!-- Holding book -->
    <rect x="14" y="25" width="10" height="8" rx="1" fill="#f8fafc" />
    <line x1="19" y1="25" x2="19" y2="33" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- Foreground details: Blooming flowers (symbol of new life / growth) -->
  <path d="M30 205 Q32 195 35 190 Q38 195 40 205" stroke="#10b981" stroke-width="2" fill="none" />
  <circle cx="35" cy="188" r="3" fill="#f43f5e" />
  <circle cx="32" cy="190" r="2" fill="#fb7185" />
  <circle cx="38" cy="190" r="2" fill="#fb7185" />

  <path d="M210 208 Q213 198 216 193 Q219 198 222 208" stroke="#10b981" stroke-width="2" fill="none" />
  <circle cx="216" cy="191" r="3.5" fill="#fbbf24" />
  <circle cx="213" cy="194" r="2" fill="#fde047" />

  <!-- Floating magic sparkle dust / upward particles indicating progress & rising out of poverty -->
  <g fill="#38bdf8">
    <circle cx="160" cy="80" r="2" opacity="0.8" />
    <circle cx="175" cy="65" r="3" opacity="0.6" />
    <circle cx="190" cy="85" r="1.5" opacity="0.9" />
    <circle cx="145" cy="70" r="2" opacity="0.7" />
    <path d="M130,95 L132,90 L134,95 L139,97 L134,99 L132,104 L130,99 L125,97 Z" fill="#fbbf24" opacity="0.8" transform="scale(0.6) translate(110, 40)" />
    <path d="M190,110 L191,106 L193,110 L197,112 L193,114 L191,118 L190,114 L186,112 Z" fill="#fbbf24" opacity="0.9" transform="scale(0.5) translate(220, 110)" />
  </g>

</svg>