<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Grid lines representing server infrastructure space -->
  <g stroke="#262B35" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="30" y1="120" x2="210" y2="120"/>
    <line x1="120" y1="30" x2="120" y2="210"/>
  </g>

  <!-- Dynamic Expansion Motion Lines (Orange/Gold accent) -->
  <g stroke="#FF9F0A" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 145 95 L 175 65" />
    <path d="M 180 70 L 175 65 L 170 73" />
    
    <path d="M 145 145 L 175 175" />
    <path d="M 170 172 L 175 175 L 175 167" />
  </g>

  <!-- Original Server Rack (Left) -->
  <g transform="translate(45, 75)">
    <!-- Server Body -->
    <rect x="0" y="0" width="36" height="90" rx="4" fill="#2E3646"/>
    <!-- Server Face Detail -->
    <rect x="6" y="12" width="24" height="16" rx="2" fill="#1A1D24"/>
    <circle cx="12" cy="20" r="2" fill="#32D74B"/>
    <rect x="18" y="18" width="8" height="4" rx="1" fill="#484F59"/>

    <rect x="6" y="37" width="24" height="16" rx="2" fill="#1A1D24"/>
    <circle cx="12" cy="45" r="2" fill="#32D74B"/>
    <rect x="18" y="43" width="8" height="4" rx="1" fill="#484F59"/>

    <rect x="6" y="62" width="24" height="16" rx="2" fill="#1A1D24"/>
    <circle cx="12" cy="70" r="2" fill="#32D74B"/>
    <rect x="18" y="68" width="8" height="4" rx="1" fill="#484F59"/>
  </g>

  <!-- Expanded/New Server Rack (Right, scaling outward with dashed highlight) -->
  <g transform="translate(135, 60)">
    <!-- Outline/Shadow box showing expansion -->
    <rect x="0" y="0" width="42" height="120" rx="4" fill="none" stroke="#FF9F0A" stroke-width="2" stroke-dasharray="5 3" opacity="0.5"/>
    
    <!-- Server Body -->
    <rect x="3" y="15" width="36" height="90" rx="4" fill="#3A4454"/>
    
    <!-- Server Face Detail -->
    <rect x="9" y="27" width="24" height="16" rx="2" fill="#1A1D24"/>
    <circle cx="15" cy="35" r="2" fill="#FF9F0A"/>
    <rect x="21" y="33" width="8" height="4" rx="1" fill="#5A6577"/>

    <rect x="9" y="52" width="24" height="16" rx="2" fill="#1A1D24"/>
    <circle cx="15" cy="60" r="2" fill="#FF9F0A"/>
    <rect x="21" y="58" width="8" height="4" rx="1" fill="#5A6577"/>

    <rect x="9" y="77" width="24" height="16" rx="2" fill="#1A1D24"/>
    <circle cx="15" cy="85" r="2" fill="#FF9F0A"/>
    <rect x="21" y="83" width="8" height="4" rx="1" fill="#5A6577"/>
  </g>

  <!-- Human Character actively connecting/installing the expansion -->
  <g transform="translate(85, 100)">
    <!-- Body / Torso -->
    <path d="M 22 55 L 35 90 L 10 90 Z" fill="#2563EB"/>
    
    <!-- Head -->
    <circle cx="25" cy="35" r="10" fill="#FBBF24"/>
    
    <!-- Hair -->
    <path d="M 17 32 C 18 26, 32 26, 33 32 C 30 28, 20 28, 17 32 Z" fill="#1E293B"/>

    <!-- Active Arm extending towards new server (Verb Action) -->
    <path d="M 30 50 L 52 45" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="54" cy="44" r="4" fill="#FBBF24"/>

    <!-- Other Arm -->
    <path d="M 20 50 L 10 65" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Data Connection Flow Particles -->
  <g fill="#38BDF8">
    <circle cx="95" cy="110" r="2"/>
    <circle cx="110" cy="100" r="3"/>
    <circle cx="125" cy="90" r="2"/>
  </g>
</svg>