<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines indicating speed -->
  <path d="M160 80 L180 60 M170 120 L200 100 M160 160 L180 140" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Person in motion -->
  <g transform="translate(80, 120)">
    <!-- Leg back -->
    <path d="M0 0 L-10 40" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <!-- Leg front -->
    <path d="M0 0 L20 30" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M0 0 L-5 -40" stroke="#E0E0E0" stroke-width="10" stroke-linecap="round"/>
    <!-- Arm back -->
    <path d="M-2 -20 L-20 -10" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <!-- Arm front -->
    <path d="M-2 -20 L15 -10" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="-5" cy="-55" r="12" fill="#E0E0E0"/>
  </g>

  <!-- Ground line -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#333842" stroke-width="2"/>
</svg>