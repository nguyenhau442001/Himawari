<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and effects -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="headlight-beam" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="car-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="road-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- City Background / Environment -->
  <!-- Distant buildings & night sky elements -->
  <g opacity="0.3">
    <rect x="20" y="60" width="30" height="80" fill="#475569"/>
    <rect x="60" y="40" width="40" height="100" fill="#334155"/>
    <rect x="110" y="70" width="35" height="70" fill="#475569"/>
    <rect x="155" y="50" width="45" height="90" fill="#334155"/>
    <rect x="210" y="65" width="25" height="75" fill="#475569"/>
    <!-- Building windows -->
    <rect x="28" y="70" width="6" height="8" fill="#fbbf24"/>
    <rect x="38" y="70" width="6" height="8" fill="#fbbf24"/>
    <rect x="70" y="50" width="8" height="10" fill="#fbbf24"/>
    <rect x="84" y="70" width="8" height="10" fill="#fbbf24"/>
    <rect x="165" y="60" width="10" height="12" fill="#fbbf24"/>
    <rect x="180" y="90" width="10" height="12" fill="#fbbf24"/>
  </g>

  <!-- Traffic Light Pole & Housing -->
  <rect x="195" y="45" width="6" height="95" fill="#64748b"/>
  <rect x="187" y="45" width="22" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Traffic Light - Red is lit (stopping) -->
  <circle cx="198" cy="55" r="5" fill="#ef4444" filter="drop-shadow(0 0 4px #ef4444)"/>
  <circle cx="198" cy="70" r="5" fill="#334155"/>
  <circle cx="198" cy="85" r="5" fill="#334155"/>

  <!-- Street and Ground Plane -->
  <path d="M0 140 L240 140 L240 240 L0 240 Z" fill="url(#road-grad)"/>
  <!-- Road markings (dashed center lines) -->
  <line x1="20" y1="190" x2="60" y2="190" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <line x1="90" y1="190" x2="130" y2="190" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <line x1="160" y1="190" x2="200" y2="190" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Crosswalk / Zebra Crossing -->
  <g fill="#94a3b8" opacity="0.8">
    <rect x="120" y="145" width="8" height="40"/>
    <rect x="132" y="145" width="8" height="40"/>
    <rect x="144" y="145" width="8" height="40"/>
    <rect x="156" y="145" width="8" height="40"/>
  </g>

  <!-- Pedestrian narrowly avoided (Safe context) -->
  <g transform="translate(145, 135)">
    <!-- Pedestrian shadow -->
    <ellipse cx="8" cy="35" rx="10" ry="3" fill="#000" opacity="0.4"/>
    <!-- Body & Clothes -->
    <path d="M3 15 L13 15 L16 30 L0 30 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="8" cy="8" r="6" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M2 6 C2 3 14 3 14 6 L14 9 L2 9 Z" fill="#1e293b"/>
    <!-- Arms gesturing / surprised -->
    <path d="M2 18 L-4 15" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 18 L20 15" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
    <!-- Shopping bag dropped / floating slightly -->
    <rect x="21" y="18" width="6" height="8" rx="1" fill="#10b981"/>
    <path d="M22 18 C22 15 26 15 26 18" stroke="#10b981" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Main Action: The Car abruptly braking -->
  <!-- Headlight beam projection -->
  <path d="M 115 130 L 20 110 L 20 160 Z" fill="url(#headlight-beam)"/>

  <!-- Car body group (Dynamic angle / tilted forward from braking) -->
  <g transform="translate(40, 105) rotate(3)">
    <!-- Suspension / Body lean effect lines behind wheels -->
    
    <!-- Car shadow -->
    <ellipse cx="60" cy="40" rx="55" ry="8" fill="#000" opacity="0.5"/>

    <!-- Car Main Chassis -->
    <path d="M 15 25 
             Q 30 5, 55 5 
             L 75 5 
             Q 95 10, 105 25 
             L 115 32 
             Q 120 35, 115 38
             L 15 38
             Z" fill="url(#car-body)"/>

    <!-- Car Cabin / Roof -->
    <path d="M 42 5 
             L 68 5 
             L 88 22 
             L 30 22 
             Z" fill="#38bdf8" opacity="0.9"/>
    
    <!-- Cabin Window Divider -->
    <line x1="58" y1="5" x2="62" y2="22" stroke="#dc2626" stroke-width="3"/>

    <!-- Driver inside (expression: alert/focused) -->
    <circle cx="50" cy="14" r="5" fill="#fbcfe8"/>
    <path d="M47 11 L52 11" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Headlights -->
    <circle cx="112" cy="30" r="4" fill="#fef08a" filter="drop-shadow(0 0 6px #fef08a)"/>
    <rect x="110" y="27" width="3" height="6" fill="#fbbf24"/>

    <!-- Wheels with motion blur / spin -->
    <!-- Rear Wheel -->
    <g transform="translate(32, 35)">
      <circle cx="0" cy="0" r="12" fill="#0f172a"/>
      <circle cx="0" cy="0" r="7" fill="#64748b"/>
      <circle cx="0" cy="0" r="3" fill="#cbd5e1"/>
    </g>
    <!-- Front Wheel -->
    <g transform="translate(92, 35)">
      <circle cx="0" cy="0" r="12" fill="#0f172a"/>
      <circle cx="0" cy="0" r="7" fill="#64748b"/>
      <circle cx="0" cy="0" r="3" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Braking Effects: Smoke, Skidding marks, Friction sparks -->
  <!-- Skidding tire marks on road -->
  <path d="M 70 148 L 125 148" stroke="#0f172a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 80 152 L 135 152" stroke="#0f172a" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Friction Smoke / Dust Clouds from sudden stop -->
  <g fill="#94a3b8" opacity="0.7">
    <circle cx="68" cy="140" r="7"/>
    <circle cx="58" cy="136" r="5"/>
    <circle cx="75" cy="133" r="4"/>
    <circle cx="125" cy="142" r="8"/>
    <circle cx="135" cy="138" r="5"/>
  </g>

  <!-- Dynamic Sparks near tires -->
  <path d="M 120 135 L 128 128" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" filter="drop-shadow(0 0 3px #f59e0b)"/>
  <path d="M 124 138 L 134 133" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 72 138 L 65 132" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Action Emphasis Lines (Speed slash / sudden halt indicator) -->
  <path d="M 25 100 L 15 95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 22 110 L 10 107" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 28 120 L 18 120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

</svg>