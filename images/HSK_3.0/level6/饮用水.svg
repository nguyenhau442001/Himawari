<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambient circle behind the object -->
  <circle cx="120" cy="120" r="70" fill="#222834" opacity="0.8"/>

  <!-- Water Drop Highlight/Shadow Background Elements -->
  <g transform="translate(0, 0)">
    <!-- Water drop droplet shape - iconic and unmistakable physical object for drinking water -->
    <!-- Base drop -->
    <path d="M120 45 C120 45, 165 95, 165 130 C165 154.85, 144.85 175, 120 175 C95.15 175, 75 154.85, 75 130 C75 95, 120 45, 120 45 Z" fill="#29B6F6" opacity="0.2"/>
    
    <!-- Main glass of drinking water -->
    <!-- Glass body -->
    <path d="M92 90 L98 175 C98 181, 102 185, 108 185 L132 185 C138 185, 142 181, 142 175 L148 90 Z" fill="#2C3548" stroke="#3A465F" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Glass rim (ellipse top) -->
    <ellipse cx="120" cy="90" rx="28" ry="7" fill="#3A465F"/>
    
    <!-- Water inside glass -->
    <path d="M94 105 L98 172 C98 177, 102 181, 107 181 L133 181 C138 181, 142 177, 142 172 L146 105 C138 102, 128 102, 120 102 C112 102, 102 102, 94 105 Z" fill="#00D2FF" opacity="0.85"/>
    
    <!-- Water surface ellipse -->
    <ellipse cx="120" cy="105" rx="26" ry="6" fill="#4BE2FF"/>
    <ellipse cx="120" cy="106" rx="22" ry="4" fill="#00B0FF" opacity="0.6"/>

    <!-- Glass inner reflection -->
    <path d="M101 115 L104 165" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Glass base/bottom thickness -->
    <ellipse cx="120" cy="180" rx="16" ry="3" fill="#202633"/>

    <!-- Sparkles/Purity indicators -->
    <path d="M85 75 L87 81 L93 83 L87 85 L85 91 L83 85 L77 83 L83 81 Z" fill="#FFC107"/>
    <path d="M155 125 L156 128 L159 129 L156 130 L155 133 L154 130 L151 129 L154 128 Z" fill="#FFC107" transform="scale(0.8) translate(40, 20)"/>

    <!-- Fresh water drop falling into the glass -->
    <path d="M120 60 C120 60, 132 75, 132 84 C132 90.627, 126.627 96, 120 96 C113.373 96, 108 90.627, 108 84 C108 75, 120 60, 120 60 Z" fill="#00E5FF"/>
    
    <!-- Ripple on water surface -->
    <ellipse cx="120" cy="106" rx="10" ry="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>