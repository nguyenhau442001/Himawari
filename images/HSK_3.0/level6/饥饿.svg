<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="soup-bowl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Glow from a distant warm light / streetlamp -->
  <circle cx="120" cy="40" r="120" fill="url(#glow-grad)" />

  <!-- Environmental Context: Distant city skyline / shelter architecture -->
  <g opacity="0.4">
    <!-- Buildings / Shelter pillars -->
    <rect x="20" y="140" width="30" height="100" fill="#334155" rx="2" />
    <rect x="190" y="130" width="35" height="110" fill="#334155" rx="2" />
    <!-- Overhang / Roof structure -->
    <path d="M10 140 L230 140 L240 150 L0 150 Z" fill="#475569" />
    <!-- Brick texture lines -->
    <line x1="20" y1="160" x2="50" y2="160" stroke="#1e293b" stroke-width="2" />
    <line x1="20" y1="180" x2="50" y2="180" stroke="#1e293b" stroke-width="2" />
    <line x1="20" y1="200" x2="50" y2="200" stroke="#1e293b" stroke-width="2" />
    <line x1="190" y1="155" x2="225" y2="155" stroke="#1e293b" stroke-width="2" />
    <line x1="190" y1="175" x2="225" y2="175" stroke="#1e293b" stroke-width="2" />
    <line x1="190" y1="195" x2="225" y2="195" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Ground plane -->
  <rect x="0" y="210" width="240" height="30" fill="#090d16" />

  <!-- ==================== CHARACTER 1 (Left: Hunched, holding empty bowl) ==================== -->
  <g transform="translate(15, 0)" filter="url(#soft-shadow)">
    <!-- Shadow -->
    <ellipse cx="60" cy="213" rx="22" ry="5" fill="#000" opacity="0.5" />
    
    <!-- Body / Torso (Hunched over) -->
    <path d="M45 160 Q55 140 75 145 L85 185 Q65 195 45 190 Z" fill="#3b82f6" />
    
    <!-- Legs (Sitting/Crouching) -->
    <path d="M50 185 Q35 195 40 210 L75 212 L70 190 Z" fill="#1e3a8a" />
    
    <!-- Head (Head bowed down in exhaustion/hunger) -->
    <circle cx="65" cy="132" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M51 130 C52 120 78 120 79 130 C75 125 55 125 51 130 Z" fill="#334155" />
    <!-- Closed exhausted eyes (slanted lines) -->
    <line x1="60" y1="133" x2="65" y2="135" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="68" y1="135" x2="73" y2="133" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Arms holding empty bowl -->
    <path d="M70 150 Q85 160 88 175" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    
    <!-- Empty Bowl (Tilted, showing nothing inside) -->
    <path d="M80 174 L98 174 L95 185 L83 185 Z" fill="url(#soup-bowl)" />
    <!-- Inside of bowl (dark, empty) -->
    <ellipse cx="89" cy="174" rx="9" ry="3" fill="#334155" />
  </g>


  <!-- ==================== CHARACTER 2 (Center: Main figure, enduring hunger, clutching stomach) ==================== -->
  <g transform="translate(0, 0)" filter="url(#soft-shadow)">
    <!-- Shadow -->
    <ellipse cx="120" cy="213" rx="26" ry="6" fill="#000" opacity="0.6" />

    <!-- Legs / Sitting posture -->
    <path d="M102 185 Q90 195 95 210 L145 210 Q140 195 130 185 Z" fill="#334155" />

    <!-- Torso (Slumped forward, expressing deep fatigue/hunger) -->
    <path d="M100 145 Q120 135 140 145 L145 190 Q120 195 95 190 Z" fill="#ef4444" />
    <path d="M105 150 L135 150 L138 185 L102 185 Z" fill="#dc2626" />

    <!-- Arms clutching the stomach (Visual metaphor for hunger pains) -->
    <!-- Back arm -->
    <path d="M110 155 Q115 170 125 170" fill="none" stroke="#b91c1c" stroke-width="8" stroke-linecap="round" />
    <!-- Front arm wrapping tightly around waist/stomach -->
    <path d="M135 155 Q125 175 105 175" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
    <!-- Hands clenching shirt -->
    <circle cx="106" cy="174" r="5" fill="#fbcfe8" />

    <!-- Head & Neck (Bowed deeply, face shadowed with strain) -->
    <path d="M115 133 L125 133 L127 145 L113 145 Z" fill="#fbcfe8" />
    <circle cx="120" cy="123" r="16" fill="#fbcfe8" />
    
    <!-- Messy Hair -->
    <path d="M103 120 C104 110 136 110 137 120 C130 114 110 114 103 120 Z" fill="#1e293b" />
    <path d="M110 116 L115 119" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M125 116 L130 119" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Face details: eyes squeezed shut in discomfort -->
    <path d="M113 124 Q116 127 119 124" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <path d="M121 124 Q124 127 127 124" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <!-- Frown / Mouth strained -->
    <path d="M117 132 Q120 130 123 132" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Subtle sweat drop indicating weakness -->
    <path d="M133 122 Q136 127 133 130 Q130 127 133 122 Z" fill="#38bdf8" opacity="0.8" />
  </g>


  <!-- ==================== CHARACTER 3 (Right: Seated against wall, looking weary) ==================== -->
  <g transform="translate(140, 0)" filter="url(#soft-shadow)">
    <!-- Shadow -->
    <ellipse cx="50" cy="213" rx="20" ry="5" fill="#000" opacity="0.5" />

    <!-- Torso leaning back against wall -->
    <path d="M35 150 Q50 145 65 155 L60 195 Q40 195 30 190 Z" fill="#10b981" />

    <!-- Legs stretched out -->
    <path d="M60 185 L85 198 L85 210 L30 210 Z" fill="#047857" />

    <!-- Head leaning down -->
    <circle cx="50" cy="138" r="13" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M38 136 C39 127 61 127 62 136 C55 131 45 131 38 136 Z" fill="#78350f" />
    
    <!-- Closed eyes -->
    <line x1="45" y1="138" x2="49" y2="140" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="52" y1="140" x2="56" y2="138" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Weak arm resting on knee -->
    <path d="M45 160 Q65 170 75 190" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Foreground Props: An overturned, empty ceramic pot/container emphasizing scarcity -->
  <g transform="translate(85, 195)" filter="url(#soft-shadow)">
    <ellipse cx="12" cy="15" rx="8" ry="4" fill="#000" opacity="0.4" />
    <!-- Broken/empty clay pot -->
    <path d="M5 8 Q15 2 22 10 L20 18 Q10 22 2 15 Z" fill="#b45309" />
    <path d="M5 8 Q10 12 15 8" fill="none" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Ambient lighting/dust specs floating to create solemn, moody atmosphere -->
  <g fill="#fbbf24" opacity="0.3">
    <circle cx="45" cy="90" r="1.5" />
    <circle cx="85" cy="70" r="1" />
    <circle cx="160" cy="85" r="2" />
    <circle cx="195" cy="110" r="1" />
    <circle cx="110" cy="80" r="1.5" />
  </g>
</svg>