<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Desk Surface -->
  <path d="M40 190 L200 190" stroke="#2A2F3B" stroke-width="2" stroke-linecap="round"/>
  <rect x="70" y="150" width="100" height="40" rx="4" fill="#222733"/>
  
  <!-- Professional Character (Medical/Industry Worker representing "从业" - Working in a profession) -->
  <!-- Head & Hair -->
  <circle cx="120" cy="85" r="24" fill="#E5A97C"/>
  <path d="M96 85 C96 68 144 68 144 85 C144 92 135 90 120 90 C105 90 96 92 96 85 Z" fill="#2C3240"/>
  
  <!-- Medical Head Mirror / Professional Accents -->
  <path d="M100 75 Q120 62 140 75" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="65" r="6" fill="#F59E0B"/>

  <!-- Body / Professional Attire (Lab coat / Uniform jacket) -->
  <path d="M85 140 L85 110 C85 98 155 98 155 110 L155 140 Z" fill="#2C3240"/>
  <path d="M95 140 L95 115 L145 115 L145 140 Z" fill="#E2E8F0"/>
  <!-- Lapels -->
  <path d="M110 115 L120 135 L130 115" fill="#CBD5E1"/>
  <!-- Stethoscope -->
  <path d="M110 95 Q120 105 120 115" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
  <circle cx="120" cy="118" r="4" fill="#38BDF8"/>

  <!-- Hands holding a professional tool/clipboard (Expertise & Career) -->
  <circle cx="95" cy="135" r="7" fill="#E5A97C"/>
  <circle cx="145" cy="135" r="7" fill="#E5A97C"/>

  <!-- Central Professional Symbol: Medical Clipboard / Specialized Gear -->
  <rect x="105" y="130" width="30" height="40" rx="3" fill="#F8FAFC" transform="rotate(-10 120 150)"/>
  <rect x="115" y="127" width="10" height="6" rx="2" fill="#F59E0B" transform="rotate(-10 120 150)"/>
  <!-- Chart lines -->
  <line x1="112" y1="140" x2="125" y2="138" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="148" x2="128" y2="145" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="156" x2="122" y2="153" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Professional Badge/Star Accent representing Industry Expertise -->
  <path d="M175 60 L180 72 L193 74 L183 83 L186 96 L175 89 L163 96 L166 83 L157 74 L170 72 Z" fill="#F59E0B" transform="scale(0.6) translate(140, 20)"/>
</svg>