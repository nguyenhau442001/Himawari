    <rect x="103" y="123" width="8" height="26" fill="#F5A623"/>
    <rect x="116" y="123" width="8" height="26" fill="#F5A623"/>
    <rect x="129" y="123" width="8" height="26" fill="#F5A623"/>

    <!-- Lower Roof -->
    <path d="M 85 115 L 155 115 L 163 103 L 77 103 Z" fill="#F5A623"/>
    <path d="M 82 111 L 158 111 L 160 107 L 80 107 Z" fill="#E09618"/>

