<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- File gradient -->
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F86F7"/>
      <stop offset="100%" stop-color="#2557D6"/>
    </linearGradient>
    
    <!-- Accent gradient (Gold/Orange for focus) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- Character skin/clothing tones -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00796B"/>
    </linearGradient>
  </defs>

  <!-- Background grid subtle lines for modern flat UI context -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="140" x2="240" y2="140" />
  </g>

  <!-- Motion lines indicating compression action -->
  <g stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" fill="none">
    <path d="M 68 115 L 82 115" />
    <path d="M 62 135 L 78 135" />
    <path d="M 172 115 L 158 115" />
    <path d="M 178 135 L 162 135" />
    <!-- Dynamic inward arrows -->
    <path d="M 85 108 L 78 115 L 85 122" />
    <path d="M 155 108 L 162 115 L 155 122" />
  </g>

  <!-- The File / Document Being Compressed (Central Object) -->
  <g id="file-object">
    <!-- Outer file container with folded corner -->
    <path d="M 96 90 L 130 90 L 148 108 L 148 160 L 96 160 Z" fill="url(#fileGrad)" />
    <!-- Folded corner piece -->
    <path d="M 130 90 L 130 108 L 148 108 Z" fill="#9CBFFB" opacity="0.6"/>
    
    <!-- Document content lines (representing data) -->
    <rect x="104" y="104" width="22" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="104" y="116" width="36" height="4" rx="2" fill="#FFFFFF" opacity="0.5"/>
    <rect x="104" y="128" width="28" height="4" rx="2" fill="#FFFFFF" opacity="0.5"/>

    <!-- Zip / Archive badge (Semantic indicator of compression) -->
    <circle cx="122" cy="142" r="10" fill="url(#accentGrad)" />
    <path d="M 118 139 L 126 139 L 122 147 Z" fill="#1A1D24" />
  </g>

  <!-- Left Compressing Hand/Press Device -->
  <g id="left-press">
    <!-- Press plate -->
    <rect x="80" y="98" width="8" height="54" rx="3" fill="#FFB300" />
    <!-- Actuator arm -->
    <rect x="50" y="121" width="30" height="8" rx="4" fill="#64748B" />
    <!-- Human hand interacting -->
    <circle cx="45" cy="125" r="10" fill="#E2E8F0" />
  </g>

  <!-- Right Compressing Hand/Press Device -->
  <g id="right-press">
    <!-- Press plate -->
    <rect x="152" y="98" width="8" height="54" rx="3" fill="#FFB300" />
    <!-- Actuator arm -->
    <rect x="160" y="121" width="30" height="8" rx="4" fill="#64748B" />
    <!-- Human hand interacting -->
    <circle cx="195" cy="125" r="10" fill="#E2E8F0" />
  </g>

  <!-- Top Character / Action element hinting at the user executing "请把这个文件压缩一下" -->
  <g id="operator-character" transform="translate(0, -10)">
    <!-- Head -->
    <circle cx="120" cy="48" r="14" fill="#FFCCBC" />
    <!-- Hair -->
    <path d="M 106 48 C 106 38 134 38 134 48 C 134 42 106 42 106 48 Z" fill="#374151" />
    <!-- Torso / Shoulders -->
    <path d="M 100 76 C 100 64 140 64 140 76 L 144 86 L 96 86 Z" fill="url(#shirtGrad)" />
    
    <!-- Arms reaching down to operate the compression -->
    <path d="M 102 70 L 82 92" stroke="url(#shirtGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 138 70 L 158 92" stroke="url(#shirtGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Hands -->
    <circle cx="80" cy="95" r="6" fill="#FFCCBC" />
    <circle cx="160" cy="95" r="6" fill="#FFCCBC" />
  </g>

  <!-- Result indicator: Smaller duplicate ghost file floating upward to show reduction/success -->
  <g opacity="0.4" transform="translate(0, -15)">
    <path d="M 125 35 L 140 35 L 148 43 L 148 60 L 125 60 Z" fill="none" stroke="#4F86F7" stroke-dasharray="2 2" stroke-width="1.5"/>
  </g>

</svg>