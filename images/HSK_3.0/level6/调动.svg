<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Office Lighting / Background Details -->
  <path d="M0 0h240v180H0z" fill="#1e293b"/>
  <!-- Floor line -->
  <path d="M0 180h240v60H0z" fill="#0f172a"/>
  
  <!-- Window view showing modern city skyline at dusk -->
  <g transform="translate(140, 30)">
    <rect width="70" height="90" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="6" y="10" width="12" height="70" fill="#1e293b"/>
    <rect x="24" y="25" width="16" height="55" fill="#1e293b"/>
    <rect x="46" y="15" width="18" height="65" fill="#1e293b"/>
    <!-- City lights -->
    <circle cx="10" cy="20" r="1" fill="#fbbf24"/>
    <circle cx="30" cy="35" r="1" fill="#38bdf8"/>
    <circle cx="55" cy="25" r="1" fill="#fbbf24"/>
    <circle cx="50" cy="50" r="1" fill="#38bdf8"/>
    <!-- Window frame separator -->
    <path d="M35 10v90M6 45h58" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Office Interior Props: Bookshelf / Plants on Left -->
  <g transform="translate(20, 45)">
    <rect width="35" height="135" rx="2" fill="#334155"/>
    <rect x="4" y="20" width="27" height="6" fill="#475569"/>
    <rect x="4" y="50" width="27" height="6" fill="#475569"/>
    <rect x="4" y="80" width="27" height="6" fill="#475569"/>
    <!-- Books on shelf -->
    <path d="M8 12h4v8H8zM14 10h5v10h-5z" fill="#38bdf8"/>
    <path d="M8 42h6v8H8zM16 38h4v12h-4z" fill="#fb923c"/>
    <!-- Plant pot on shelf -->
    <path d="M10 73h15l-3 7H13z" fill="#cbd5e1"/>
    <path d="M17.5 73c0-5-4-6-4-6s-1 3 0 5 4 1 4 1z" fill="#10b981"/>
    <path d="M15 72c-2-3-1-5-1-5s3 1 3 4-2 1-2 1z" fill="#34d399"/>
  </g>

  <!-- Desk & Transfer Elements -->
  <!-- Old Department Desk (Left) -->
  <g transform="translate(70, 140)">
    <rect x="0" y="0" width="55" height="8" rx="2" fill="#64748b"/>
    <rect x="8" y="8" width="5" height="32" fill="#475569"/>
    <rect x="42" y="8" width="5" height="32" fill="#475569"/>
    <!-- Laptop on desk -->
    <path d="M15 -4h20l3 4H12z" fill="#cbd5e1"/>
    <rect x="18" y="-7" width="14" height="3" rx="1" fill="#94a3b8"/>
  </g>

  <!-- New Department Desk (Right) - Warm Amber lighting glowing -->
  <g transform="translate(155, 140)">
    <rect x="-10" y="0" width="65" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="-2" y="8" width="5" height="32" fill="#94a3b8"/>
    <rect x="45" y="8" width="5" height="32" fill="#94a3b8"/>
    <!-- Desk lamp casting warm glow -->
    <path d="M35 0l5-12h8l5 12z" fill="#f59e0b"/>
    <path d="M42 -12v-5" stroke="#d97706" stroke-width="2"/>
    <path d="M38 -17h8" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="42" cy="0" rx="15" ry="3" fill="#fbbf24" opacity="0.3"/>
    <!-- Office plant on new desk -->
    <path d="M2 0h8l-2 5H4z" fill="#475569"/>
    <circle cx="6" cy="-3" r="4" fill="#10b981"/>
  </g>

  <!-- Motion / Transfer Arrow Curve -->
  <path d="M 95 110 Q 130 80 165 110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  <path d="M162 103l7 8-9 4" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Character (Moving/Being Transferred) -->
  <g transform="translate(100, 105)">
    <!-- Body / Suit -->
    <path d="M10 25c-5 0-10 4-12 10l-3 30h30l-3-30c-2-6-7-10-12-10z" fill="#1e293b"/>
    <path d="M10 25l-5 12h10z" fill="#cbd5e1"/> <!-- Shirt collar -->
    <path d="M9 32l1 15h-2z" fill="#ef4444"/> <!-- Tie -->
    
    <!-- Legs in walking motion -->
    <path d="M4 65l6 15-4 3" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 65l-4 15 5 4" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arms holding a box of personal belongings -->
    <path d="M0 35l10 10" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 35l-5 10" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

    <!-- Moving Box -->
    <rect x="3" y="38" width="18" height="15" rx="2" fill="#d97706"/>
    <path d="M3 42h18" stroke="#b45309" stroke-width="2"/>
    <path d="M9 38v15M15 38v15" stroke="#b45309" stroke-width="1.5"/>

    <!-- Head & Expression (Optimistic/Determined look for new department) -->
    <circle cx="10" cy="12" r="9" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M1 10c0-6 5-8 9-8s9 2 9 8c-2-1-4-2-9-2s-7 1-9 2z" fill="#0f172a"/>
    <!-- Eyes & Smile -->
    <circle cx="7" cy="11" r="1" fill="#0f172a"/>
    <circle cx="13" cy="11" r="1" fill="#0f172a"/>
    <path d="M9 15q1 1 2 0" fill="none" stroke="#0f172a" stroke-width="1" stroke-linecap="round"/>
    <!-- Cute rosy cheeks -->
    <circle cx="5" cy="13" r="1.5" fill="#fda4af" opacity="0.6"/>
    <circle cx="15" cy="13" r="1.5" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- Secondary Character (Manager gesturing / pointing to the new department) -->
  <g transform="translate(180, 100)">
    <!-- Body -->
    <path d="M10 30c-4 0-8 3-10 8l-2 32h24l-2-32c-2-5-6-8-10-8z" fill="#0284c7"/>
    <!-- White shirt collar & tie -->
    <path d="M10 30l-4 10h8z" fill="#f8fafc"/>
    <path d="M9 36l1 14h-2z" fill="#1e293b"/>
    <!-- Head -->
    <circle cx="10" cy="15" r="9" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M2 15c0-6 4-9 8-9s8 3 8 9c-1-1-3-2-8-2s-7 1-8 2z" fill="#334155"/>
    <!-- Facial features -->
    <circle cx="7" cy="14" r="1" fill="#1e293b"/>
    <circle cx="13" cy="14" r="1" fill="#1e293b"/>
    <path d="M9 18q1 1.5 2 0" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Arm pointing forward welcomingly -->
    <path d="M2 35l-12 10" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M4 70l2 10M16 70l-2 10" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Document / Transfer File floating slightly to symbolize official company decision -->
  <g transform="translate(75, 75)">
    <rect width="14" height="18" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M3 4h8M3 7h8M3 10h5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Official Red Stamp / Seal -->
    <circle cx="10" cy="13" r="3" fill="#ef4444" opacity="0.8"/>
  </g>

</svg>