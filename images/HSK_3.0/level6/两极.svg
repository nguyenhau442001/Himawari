<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- North Pole (Top) -->
  <path d="M120 50 L150 80 L120 110 L90 80 Z" fill="#E0F7FA" stroke="#B2EBF2" stroke-width="2"/>
  <path d="M120 50 L135 65 L120 80 L105 65 Z" fill="#B2EBF2"/>
  
  <!-- South Pole (Bottom) -->
  <path d="M120 130 L150 160 L120 190 L90 160 Z" fill="#E0F7FA" stroke="#B2EBF2" stroke-width="2"/>
  <path d="M120 130 L135 145 L120 160 L105 145 Z" fill="#B2EBF2"/>
  
  <!-- Globe Outline -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#37474F" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Melting Effect/Water Droplets -->
  <circle cx="155" cy="80" r="3" fill="#FFB300"/>
  <circle cx="85" cy="160" r="3" fill="#FFB300"/>
  
  <!-- Accent Lines -->
  <path d="M120 110 L120 130" stroke="#FFB300" stroke-width="2" stroke-linecap="round"/>
