<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#2A313C" opacity="0.4"/>

  <!-- Tea Set / Teapot representing 精致 (Exquisite craftsmanship) -->
  <g transform="translate(0, 5)">
    <!-- Wooden Table / Pedestal Base -->
    <path d="M 60 175 L 180 175 C 185 175, 185 183, 180 183 L 60 183 C 55 183, 55 175, 60 175 Z" fill="#3E4A59"/>
    <ellipse cx="120" cy="179" rx="60" ry="4" fill="#2E3842"/>

    <!-- Teapot Body (Elegant, refined shape) -->
    <path d="M 95 125 C 90 100, 105 85, 120 85 C 135 85, 150 100, 145 125 C 145 145, 95 145, 95 125 Z" fill="#E6AF2E"/>
    
    <!-- Teapot Lid -->
    <ellipse cx="120" cy="85" rx="15" ry="4" fill="#F4C443"/>
    <circle cx="120" cy="79" r="4" fill="#E6AF2E"/>

    <!-- Teapot Spout (Curved, delicate) -->
    <path d="M 145 105 C 165 102, 175 115, 170 125 C 168 128, 162 120, 153 115" fill="none" stroke="#E6AF2E" stroke-width="5" stroke-linecap="round"/>

    <!-- Teapot Handle (Graceful loop) -->
    <path d="M 95 103 C 78 105, 78 135, 96 137" fill="none" stroke="#E6AF2E" stroke-width="5" stroke-linecap="round"/>

    <!-- Teacup 1 (Left foreground) -->
    <g transform="translate(62, 130)">
      <path d="M 10 10 L 26 10 C 28 26, 8 26, 10 10 Z" fill="#F4C443"/>
      <ellipse cx="18" cy="10" rx="8" ry="3" fill="#E6AF2E"/>
      <!-- Tea liquid -->
      <ellipse cx="18" cy="11" rx="6" ry="2" fill="#3E4A59"/>
    </g>

    <!-- Teacup 2 (Right foreground) -->
    <g transform="translate(142, 130)">
      <path d="M 10 10 L 26 10 C 28 26, 8 26, 10 10 Z" fill="#F4C443"/>
      <ellipse cx="18" cy="10" rx="8" ry="3" fill="#E6AF2E"/>
      <!-- Tea liquid -->
      <ellipse cx="18" cy="11" rx="6" ry="2" fill="#3E4A59"/>
    </g>

    <!-- Exquisite pattern details on teapot (tỉ mỉ, tao nhã) -->
    <path d="M 112 105 Q 120 112 128 105" fill="none" stroke="#2E3842" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 112 115 Q 120 122 128 115" fill="none" stroke="#2E3842" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Sparkles / Highlights emphasizing "Exquisite / Tinh tế" -->
    <g fill="#FFFFFF" opacity="0.9">
      <!-- Top right sparkle -->
      <path d="M 165 65 C 165 72, 164 72, 164 72 C 164 72, 163 72, 163 65 C 163 58, 164 58, 164 58 C 164 58, 165 58, 165 65 Z"/>
      <path d="M 155 70 C 162 70, 162 71, 162 71 C 162 71, 162 72, 155 72 C 148 72, 148 71, 148 71 C 148 71, 148 70, 155 70 Z"/>
      
      <!-- Small left sparkle -->
      <circle cx="82" cy="95" r="2"/>
      <circle cx="140" cy="60" r="1.5"/>
    </g>
  </g>
</svg>