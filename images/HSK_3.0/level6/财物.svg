<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow behind the central object -->
  <circle cx="120" cy="125" r="55" fill="#F59E0B" opacity="0.12"/>

  <!-- Wallet/Bag Base (财物 - Money & Valuables) -->
  <g transform="translate(0, 5)">
    <!-- Main Wallet Body -->
    <rect x="64" y="85" width="112" height="78" rx="16" fill="#2563EB" stroke="#3B82F6" stroke-width="2"/>
    
    <!-- Wallet Flap/Pocket line -->
    <path d="M 64 110 C 100 120, 140 120, 176 110" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>

    <!-- Gold Accent / Clasp (Valuables motif) -->
    <rect x="104" y="112" width="32" height="20" rx="6" fill="#F59E0B"/>
    <circle cx="120" cy="122" r="4" fill="#1E293B"/>

    <!-- Emerging Gold Coins & Banknote (Wealth/Assets) -->
    <g transform="translate(0, -6)">
      <!-- Cash / Banknote peeking out -->
      <rect x="84" y="62" width="72" height="32" rx="4" fill="#10B981" opacity="0.9"/>
      <circle cx="120" cy="78" r="8" fill="#047857" opacity="0.6"/>

      <!-- Gold Coin 1 (Left) -->
      <circle cx="86" cy="68" r="14" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
      <circle cx="86" cy="68" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>

      <!-- Gold Coin 2 (Right) -->
      <circle cx="154" cy="68" r="14" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
      <circle cx="154" cy="68" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>
</svg>