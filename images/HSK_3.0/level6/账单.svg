<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambient light -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Main Bill / Invoice Object -->
  <g transform="translate(0, 5)">
    <!-- Paper Document Shadow -->
    <rect x="72" y="38" width="96" height="134" rx="8" fill="#111318" opacity="0.4"/>
    
    <!-- Main Paper Body -->
    <rect x="70" y="34" width="96" height="134" rx="8" fill="#FFFFFF"/>

    <!-- Document Header Accent (orange/gold for focus) -->
    <path d="M 70 42 A 8 8 0 0 1 78 34 L 158 34 A 8 8 0 0 1 166 42 L 166 60 L 70 60 Z" fill="#FF9F43"/>

    <!-- Header Icon/Circle on the bill -->
    <circle cx="88" cy="47" r="5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="98" y="44" width="36" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>

    <!-- Line Items (Simulated text/amounts) -->
    <rect x="85" y="76" width="45" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="142" y="76" width="18" height="5" rx="2.5" fill="#CBD5E1"/>

    <rect x="85" y="94" width="55" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="142" y="94" width="18" height="5" rx="2.5" fill="#CBD5E1"/>

    <rect x="85" y="112" width="38" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="142" y="112" width="18" height="5" rx="2.5" fill="#CBD5E1"/>

    <!-- Divider Line -->
    <line x1="85" y1="130" x2="155" y2="130" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round"/>

    <!-- Total Amount Section -->
    <rect x="85" y="142" width="30" height="6" rx="3" fill="#FF9F43"/>
    <rect x="132" y="142" width="28" height="6" rx="3" fill="#FF9F43"/>

    <!-- Folded corner effect -->
    <path d="M 150 34 L 166 50 L 150 50 Z" fill="#E58E26"/>
  </g>

  <!-- Interactive/Digital Payment Element (Phone/Interface hint or checkmark badge) -->
  <g transform="translate(136, 126)">
    <!-- Badge Background -->
    <circle cx="24" cy="24" r="20" fill="#1A1D24"/>
    <circle cx="24" cy="24" r="17" fill="#2E4057"/>
    <circle cx="24" cy="24" r="14" fill="#FF9F43"/>
    
    <!-- Checkmark Icon representing settled bill / invoice -->
    <path d="M 17 24 L 21 28 L 31 18" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>