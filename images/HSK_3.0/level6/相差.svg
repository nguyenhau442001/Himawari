<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Subtle comparison plane/grid) -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2A2F3A" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="150" x2="70" y2="180" stroke="#252B36" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="170" y1="100" x2="170" y2="180" stroke="#252B36" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Dynamic gap / difference indicator (Arched double-ended arrow showing "difference/span") -->
  <path d="M 75 90 Q 122.5 60 165 90" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="73,90 81,86 79,93" fill="#F59E0B"/>
  <polygon points="167,90 159,86 161,93" fill="#F59E0B"/>

  <!-- Character 1: Taller / Older Person (Left) -->
  <g transform="translate(50, 0)">
    <!-- Head -->
    <circle cx="20" cy="85" r="9" fill="#E2E8F0"/>
    <!-- Body / Outfit -->
    <path d="M 11 125 C 11 105, 29 105, 29 125 L 34 180 L 6 180 Z" fill="#3B82F6"/>
    <!-- Legs -->
    <line x1="15" y1="180" x2="15" y2="200" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="180" x2="25" y2="200" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <!-- Action Arm pointing/measuring -->
    <path d="M 15 110 L 32 118" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Shorter / Younger Person (Right) -->
  <g transform="translate(140, 0)">
    <!-- Head -->
    <circle cx="20" cy="120" r="7.5" fill="#E2E8F0"/>
    <!-- Body / Outfit -->
    <path d="M 13 145 C 13 135, 27 135, 27 145 L 31 180 L 9 180 Z" fill="#10B981"/>
    <!-- Legs -->
    <line x1="15" y1="180" x2="15" y2="200" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="23" y1="180" x2="23" y2="200" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Action Arm -->
    <path d="M 25 145 L 14 150" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Vertical Height Gap Indicator Line (Visualizing "Chēnglì/Xiāngchà") -->
  <line x1="70" y1="94" x2="70" y2="127" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="94" r="2" fill="#F59E0B"/>
  <circle cx="70" cy="127" r="2" fill="#F59E0B"/>
</svg>