<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Harbour Elements (Atmospheric context) -->
  <g opacity="0.4">
    <!-- Distant harbor crane silhouettes -->
    <path d="M40 140 L50 140 L55 110 L65 110 L60 140 L70 140 L70 145 L40 145 Z" fill="#2E3544"/>
    <path d="M50 110 L85 95 L88 98 L55 113 Z" fill="#2E3544"/>
    
    <path d="M180 145 L190 145 L195 115 L205 115 L200 145 L210 145 L210 150 L180 150 Z" fill="#2E3544"/>
    <path d="M190 115 L220 102 L223 105 L193 118 Z" fill="#2E3544"/>

    <!-- Calm water background waves -->
    <path d="M20 155 Q40 150 60 155 T100 155 T140 155 T180 155 T220 155" fill="none" stroke="#262D3D" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 165 Q30 160 50 165 T90 165 T130 165 T170 165 T210 165" fill="none" stroke="#262D3D" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Water Surface -->
  <rect x="0" y="150" width="240" height="90" fill="#14171F"/>
  
  <!-- Water ripples beneath the ships -->
  <path d="M35 175 Q45 172 55 175" fill="none" stroke="#222733" stroke-width="2" stroke-linecap="round"/>
  <path d="M115 185 Q125 182 135 185" fill="none" stroke="#222733" stroke-width="2" stroke-linecap="round"/>
  <path d="M185 170 Q195 167 205 170" fill="none" stroke="#222733" stroke-width="2" stroke-linecap="round"/>

  <!-- Secondary Ship (Background, smaller for depth) -->
  <g transform="translate(145, 125) scale(0.55)">
    <!-- Reflection -->
    <path d="M20 40 Q60 50 100 40 L90 55 Q55 60 30 55 Z" fill="#222A38" opacity="0.4"/>
    <!-- Hull -->
    <path d="M10 25 L30 40 L80 40 L100 25 Z" fill="#3B485E"/>
    <path d="M25 40 L85 40 L75 50 L35 50 Z" fill="#FFA726"/>
    <!-- Cabin -->
    <rect x="40" y="10" width="30" height="15" rx="2" fill="#E0E6ED"/>
    <rect x="45" y="13" width="8" height="8" rx="1" fill="#1A1D24"/>
    <rect x="57" y="13" width="8" height="8" rx="1" fill="#1A1D24"/>
    <!-- Mast -->
    <rect x="54" y="2" width="2" height="8" fill="#8C9BAE"/>
  </g>

  <!-- Primary Ship (Centerpiece - Noun Representation) -->
  <g transform="translate(65, 95)">
    <!-- Hull Water Reflection -->
    <path d="M10 58 Q55 70 100 58 L88 78 Q50 85 22 78 Z" fill="#263244" opacity="0.5"/>

    <!-- Hull Bottom (Darker tone) -->
    <path d="M15 45 L30 58 L80 58 L95 45 Z" fill="#2E394C"/>
    
    <!-- Hull Main Body (Vibrant Accent Color) -->
    <path d="M5 30 L15 45 L95 45 L105 30 Z" fill="#FF8F00"/>
    <path d="M15 45 L85 45 L78 58 L22 58 Z" fill="#FFA726"/>

    <!-- Deck Structure / Cabins -->
    <rect x="30" y="12" width="45" height="18" rx="3" fill="#ECEFF1"/>
    <!-- Cabin Windows -->
    <rect x="36" y="16" width="6" height="8" rx="1.5" fill="#1A1D24"/>
    <rect x="46" y="16" width="6" height="8" rx="1.5" fill="#1A1D24"/>
    <rect x="56" y="16" width="6" height="8" rx="1.5" fill="#1A1D24"/>

    <!-- Upper Bridge / Captain's Quarters -->
    <rect x="40" y="2" width="25" height="10" rx="2" fill="#CFD8DC"/>
    <rect x="45" y="4" width="15" height="6" rx="1" fill="#1A1D24"/>

    <!-- Mast & Communications -->
    <rect x="51" y="-10" width="3" height="12" fill="#78909C"/>
    <!-- Radar dish / details -->
    <circle cx="52.5" cy="-10" r="3" fill="#B0BEC5"/>
    <path d="M48 -6 L57 -6" stroke="#B0BEC5" stroke-width="1.5"/>

    <!-- Safety Railings / Details -->
    <line x1="12" y1="30" x2="98" y2="30" stroke="#CFD8DC" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Port holes on hull -->
    <circle cx="35" cy="37.5" r="2" fill="#1A1D24"/>
    <circle cx="52.5" cy="37.5" r="2" fill="#1A1D24"/>
    <circle cx="70" cy="37.5" r="2" fill="#1A1D24"/>
  </g>

  <!-- Foreground Water Waves (Overlapping slightly for depth) -->
  <path d="M0 165 Q25 160 50 165 T100 165 T150 165 T200 165 T240 165" fill="none" stroke="#2E384D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M0 180 Q30 185 60 180 T120 180 T180 180 T240 180" fill="none" stroke="#222A38" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 195 Q75 190 110 195 T180 195" fill="none" stroke="#1E2532" stroke-width="1.5" stroke-linecap="round"/>
</svg>