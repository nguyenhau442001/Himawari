<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow & Stars (Cosmic Context) -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>
  <circle cx="80" cy="80" r="1.5" fill="#4E5D6C" opacity="0.8"/>
  <circle cx="170" cy="70" r="1" fill="#4E5D6C" opacity="0.7"/>
  <circle cx="160" cy="165" r="1.5" fill="#4E5D6C" opacity="0.9"/>
  <circle cx="75" cy="160" r="1" fill="#4E5D6C" opacity="0.6"/>

  <!-- Orbit Rings -->
  <ellipse cx="120" cy="120" rx="85" ry="32" fill="none" stroke="#2F3847" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(-25 120 120)"/>
  <ellipse cx="120" cy="120" rx="65" ry="24" fill="none" stroke="#3A4454" stroke-width="1" transform="rotate(35 120 120)"/>

  <!-- Central Object: Sleek Modern Telescope / Exploration Instrument (Noun: Thám hiểm / Tìm hiểu) -->
  <g transform="rotate(-30 120 120)">
    <!-- Telescope Mount / Stand -->
    <path d="M120 135 L105 165 L135 165 Z" fill="#3A4454"/>
    <line x1="120" y1="135" x2="120" y2="122" stroke="#4E5D6C" stroke-width="4" stroke-linecap="round"/>

    <!-- Main Telescope Body (Cylinder) -->
    <rect x="85" y="105" width="75" height="28" rx="6" fill="#2D3748" stroke="#4E5D6C" stroke-width="2"/>
    
    <!-- Telescope Details (Grips & Rings) -->
    <rect x="95" y="105" width="8" height="28" fill="#4E5D6C"/>
    <rect x="135" y="105" width="6" height="28" fill="#4E5D6C"/>

    <!-- Lens Hood / Front Cone (Focusing on the Unknown) -->
    <path d="M160 103 L180 97 L180 141 L160 135 Z" fill="#F6AD55"/>
    <ellipse cx="180" cy="119" rx="3" ry="22" fill="#DD6B20"/>

    <!-- Eyepiece / Back Detail -->
    <rect x="75" y="112" width="10" height="14" rx="3" fill="#4E5D6C"/>
    <circle cx="75" cy="119" r="3" fill="#E2E8F0"/>
  </g>

  <!-- Focused Cosmic Object (Target of Exploration) -->
  <circle cx="185" cy="65" r="12" fill="#63B3ED" opacity="0.9"/>
  <circle cx="185" cy="65" r="16" fill="none" stroke="#63B3ED" stroke-width="1.5" opacity="0.4"/>
  <path d="M180 60 Q185 55 190 62" fill="none" stroke="#EBF8FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Magnifying / Discovery Light Beam (Concept of "Tànsuǒ") -->
  <path d="M142 88 L200 45 L210 58 L150 102 Z" fill="#F6AD55" opacity="0.12"/>
  <path d="M148 94 L203 52" stroke="#F6AD55" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Interactive Focus Reticle / UI Accent -->
  <path d="M55 90 L45 90 L45 100" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M185 155 L195 155 L195 145" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="#2F3847" stroke-width="1" opacity="0.5"/>
</svg>