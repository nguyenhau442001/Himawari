<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Peach Blossom (Representing 'Pink' and the context) -->
  <g transform="translate(120, 120)">
    <!-- Stem -->
    <path d="M-5,20 C-5,10 0,0 10,0" stroke="#8B7355" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Petals -->
    <path d="M0,0 C20,-20 40,-20 50,0 C40,20 20,20 0,0" fill="#FFB7C5"/>
    <path d="M0,0 C-20,-20 -40,-20 -50,0 C-40,20 -20,20 0,0" fill="#FFB7C5"/>
    <path d="M0,0 C-20,20 -20,40 0,50 C20,40 20,20 0,0" fill="#FFB7C5"/>
    
    <!-- Center Stamens -->
    <circle cx="0" cy="0" r="8" fill="#FFD700"/>
    <circle cx="5" cy="-5" r="2" fill="#FFF"/>
    <circle cx="-5" cy="5" r="2" fill="#FFF"/>
  </g>
  
  <!-- Powder/Dust representation (Representing 'Powder') -->
  <g transform="translate(60, 180)">
    <circle cx="0" cy="0" r="4" fill="#FFB7C5" opacity="0.8"/>
    <circle cx="15" cy="-10" r="3" fill="#FFB7C5" opacity="0.6"/>
    <circle cx="30" cy="-5" r="5" fill="#FFB7C5" opacity="0.9"/>
  </g>
  
  <!-- Fan silhouette (Representing 'Fan/Follower') -->
  <g transform="translate(180, 60)">
    <path d="M0,0 L20,-30 L40,0 L20,30 Z" fill="#FFD700"/>
    <circle cx="20" cy="0" r="6" fill="#1A1D24"/>
  </g>
</svg>