<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Medical Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Infection Glow (Red/Orange warning) -->
    <radialGradient id="infectionGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)" clip-path="url(#canvasClip)"/>

  <!-- Background Environment (Medical Room / Clinic Interior) -->
  <g id="environment">
    <!-- Back wall details -->
    <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="8"/>
    <!-- Shelf with medical supplies -->
    <rect x="150" y="50" width="60" height="6" fill="#334155" rx="3"/>
    <rect x="160" y="30" width="12" height="20" fill="#38bdf8" rx="2" opacity="0.6"/>
    <rect x="180" y="35" width="16" height="15" fill="#10b981" rx="2" opacity="0.6"/>
    <circle cx="166" cy="40" r="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- Medical Chart Poster -->
    <rect x="30" y="40" width="35" height="45" fill="#334155" rx="2"/>
    <rect x="35" y="46" width="25" height="4" fill="#64748b" rx="1"/>
    <rect x="35" y="54" width="18" height="3" fill="#64748b" rx="1"/>
    <rect x="35" y="60" width="22" height="3" fill="#64748b" rx="1"/>
    <circle cx="52" cy="73" r="6" fill="#ef4444" opacity="0.8"/>

    <!-- Desk / Table Surface -->
    <path d="M 10 180 L 230 180 L 240 220 L 0 220 Z" fill="#0f172a"/>
    <rect x="0" y="176" width="240" height="6" fill="#334155" rx="2"/>
  </g>

  <!-- Adjustable Medical Lamp (Top Right) -->
  <g id="medical-lamp">
    <path d="M 220 0 L 200 40" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="200" cy="40" r="6" fill="#64748b"/>
    <path d="M 200 40 L 160 80" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="80" r="25" fill="url(#lampGlow)"/>
    <path d="M 145 70 Q 160 90 175 75 Z" fill="#94a3b8"/>
    <ellipse cx="160" cy="83" rx="12" ry="5" fill="#38bdf8"/>
  </g>

  <!-- Main Subject & Character (Patient looking at infected arm) -->
  <g id="character-and-arm">
    <!-- Character Body / Shoulders (Seated) -->
    <path d="M 50 220 C 50 170, 80 150, 110 150 C 140 150, 170 170, 170 220 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Collar -->
    <path d="M 95 150 Q 110 165 125 150 Q 110 158 95 150 Z" fill="#bae6fd"/>

    <!-- Character Neck & Head (Worried/Concerned expression) -->
    <rect x="100" y="125" width="20" height="35" fill="#fdba74"/>
    <circle cx="110" cy="110" r="22" fill="#fdba74"/>
    
    <!-- Hair -->
    <path d="M 88 105 C 88 90, 100 85, 110 85 C 125 85, 132 95, 132 115 L 132 120 L 88 120 Z" fill="#334155"/>

    <!-- Worried Face Details -->
    <!-- Eyebrows (tilted inwards in concern) -->
    <path d="M 98 102 L 106 106" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 122 102 L 114 106" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="102" cy="110" r="2" fill="#1e293b"/>
    <circle cx="118" cy="110" r="2" fill="#1e293b"/>
    <!-- Mouth (slight frown/worry) -->
    <path d="M 108 122 Q 110 118 112 122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Foreground Arm / Hand Inspecting Wound -->
    <!-- Forearm extending towards center -->
    <path d="M 90 200 C 110 190, 130 185, 150 190 L 150 210 C 130 205, 110 210, 90 220 Z" fill="#fdba74"/>
    <circle cx="150" cy="200" r="14" fill="#fdba74"/> <!-- Hand/Wrist area -->

    <!-- THE WOUND & INFECTION FOCUS -->
    <g id="infected-wound">
      <!-- Glow indicating heat/inflammation -->
      <circle cx="140" cy="198" r="18" fill="url(#infectionGlow)"/>
      
      <!-- Arm surface backing at wound site -->
      <ellipse cx="140" cy="198" rx="10" ry="7" fill="#fdbdf4" transform="rotate(-10 140 198)"/>
      
      <!-- Injury / Scab -->
      <ellipse cx="140" cy="198" rx="6" ry="4" fill="#7f1d1d" transform="rotate(-10 140 198)"/>
      
      <!-- Redness / Swelling / Infection indicators (Angry red aura + pus dots) -->
      <circle cx="136" cy="195" r="1.5" fill="#fde047"/>
      <circle cx="144" cy="201" r="1" fill="#fde047"/>
      
      <!-- Pulsing/Inflammation rings -->
      <ellipse cx="140" cy="198" rx="8" ry="5" stroke="#ef4444" stroke-width="1.5" fill="none" opacity="0.8"/>
      <ellipse cx="140" cy="198" rx="12" ry="8" stroke="#f97316" stroke-width="1" fill="none" opacity="0.6"/>
    </g>

    <!-- Magnifying Glass held by user or hovering to examine infection -->
    <g id="magnifier" transform="translate(155, 160)">
      <!-- Glass Lens Circle with tint -->
      <circle cx="0" cy="0" r="20" fill="#38bdf8" fill-opacity="0.15" stroke="#94a3b8" stroke-width="4"/>
      <!-- Lens glare -->
      <path d="M -12 -12 Q -2 -18 4 -14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- Magnifier Handle -->
      <path d="M 14 14 L 32 32" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="3" fill="#475569"/>
    </g>
  </g>

  <!-- Foreground Props on Desk -->
  <g id="desk-props">
    <!-- Medical Bottle / Antiseptic -->
    <rect x="25" y="165" width="16" height="25" fill="#f8fafc" rx="3"/>
    <rect x="28" y="160" width="10" height="5" fill="#334155" rx="1"/>
    <!-- Red Cross / Warning symbol on bottle -->
    <rect x="30" y="173" width="6" height="2" fill="#ef4444"/>
    <rect x="32" y="171" width="2" height="6" fill="#ef4444"/>

    <!-- Cotton Swab / Bandage roll -->
    <circle cx="60" cy="185" r="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="60" cy="185" r="4" fill="#f8fafc"/>
  </g>
</svg>