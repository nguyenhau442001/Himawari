<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Window with Night Sky -->
  <rect x="150" y="40" width="60" height="80" rx="8" fill="#1e293b"/>
  <circle cx="190" cy="65" r="8" fill="#fde68a"/>
  <circle cx="194" cy="63" r="8" fill="#1e293b"/>
  <circle cx="165" cy="55" r="1" fill="#94a3b8"/>
  <circle cx="175" cy="90" r="1" fill="#94a3b8"/>
  
  <!-- Wall Clock -->
  <circle cx="60" cy="60" r="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="60" x2="60" y2="48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="72" y2="65" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Desk -->
  <rect x="20" y="190" width="200" height="12" rx="4" fill="#334155"/>
  
  <!-- Character -->
  <path d="M85 190 Q85 140 110 135 Q135 130 145 150 L155 190" fill="#334155"/> <!-- Chair back -->
  <path d="M100 190 C100 160 110 140 130 140 C150 140 160 160 160 190" fill="#38bdf8"/> <!-- Body/Shirt -->
  <circle cx="130" cy="115" r="18" fill="#fde68a"/> <!-- Head -->
  <path d="M112 110 Q115 95 130 95 Q145 95 148 110" fill="#1e293b"/> <!-- Hair -->
  
  <!-- Arms and Action -->
  <path d="M115 155 Q130 165 145 155" fill="none" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/> <!-- Arms on keyboard -->
  
  <!-- Laptop -->
  <path d="M140 185 L190 185 L205 155 L155 155 Z" fill="#94a3b8"/> <!-- Base -->
  <rect x="155" y="125" width="45" height="30" rx="2" fill="#0ea5e9" opacity="0.8"/> <!-- Screen -->
  <rect x="160" y="132" width="20" height="4" rx="1" fill="#ffffff" opacity="0.4"/> <!-- Screen lines -->
  <rect x="160" y="140" width="35" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
  
  <!-- Desk Lamp -->
  <path d="M40 190 L50 190 L45 140" stroke="#475569" stroke-width="4"/>
  <path d="M45 140 L75 130" stroke="#475569" stroke-width="4"/>
  <path d="M65 120 L85 140 L75 150 L55 130 Z" fill="#f59e0b"/> <!-- Lamp head -->
  
  <!-- Light Glow -->
  <path d="M75 140 L160 190 L80 190 Z" fill="#fbbf24" opacity="0.15"/>
  
  <!-- Props of "Busy" -->
  <!-- Coffee Cup -->
  <rect x="65" y="175" width="12" height="15" rx="2" fill="#ec4899"/>
  <path d="M68 170 Q71 165 74 170" fill="none" stroke="#94a3b8" stroke-width="1"/> <!-- Steam -->
  
  <!-- Stacks of Paper -->
  <rect x="25" y="178" width="25" height="4" rx="1" fill="#f8fafc"/>
  <rect x="25" y="182" width="25" height="4" rx="1" fill="#f8fafc"/>
  <rect x="25" y="186" width="25" height="4" rx="1" fill="#f8fafc"/>
  
  <!-- Sticky Notes on Wall -->
  <rect x="85" y="60" width="12" height="12" fill="#fb923c" opacity="0.8"/>
  <rect x="100" y="65" width="12" height="12" fill="#10b981" opacity="0.8"/>
  <rect x="88" y="75" width="12" height="12" fill="#38bdf8" opacity="0.8"/>
  
  <!-- Character Focus Details -->
  <circle cx="135" cy="115" r="1.5" fill="#1e293b"/> <!-- Eye -->
  <path d="M132 108 Q135 106 138 108" fill="none" stroke="#1e293b" stroke-width="1"/> <!-- Eyebrow -->
</svg>