<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Flowing water source / Dam base representing Three Gorges context -->
    <path d="M-90 40 L-40 40 L-20 70 L-90 70 Z" fill="#2C3440" opacity="0.6"/>
    <path d="M-70 10 L-20 10 L0 40 L-70 40 Z" fill="#364152"/>
    
    <!-- Water stream dynamic curve -->
    <path d="M-60 25 C -30 25, -20 45, 0 65 C 20 85, 40 90, 80 90" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M-65 15 C -35 15, -25 35, -5 55 C 15 75, 35 80, 75 80" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Generator Turbine Housing (The physical core object: 发电机) -->
    <circle cx="10" cy="15" r="52" fill="#242B38"/>
    <circle cx="10" cy="15" r="44" fill="#1E2430" stroke="#334155" stroke-width="3"/>
    
    <!-- Turbine Blades (Generating power) -->
    <g transform="translate(10, 15)">
      <path d="M0 0 L-14 -32 C-5 -38, 5 -38, 14 -32 Z" fill="#F59E0B"/>
      <path d="M0 0 L32 -14 C38 -5, 38 5, 32 14 Z" fill="#D97706"/>
      <path d="M0 0 L14 32 C5 38, -5 38, -14 32 Z" fill="#F59E0B"/>
      <path d="M0 0 L-32 14 C-38 5, -38 -5, -32 -14 Z" fill="#D97706"/>
      <circle cx="0" cy="0" r="10" fill="#FBBF24"/>
    </g>

    <!-- Electricity Sparks / Energy Output Representation -->
    <g transform="translate(75, -25)">
      <path d="M0 12 L8 0 L3 0 L9 -12 L-2 -2 L3 -2 Z" fill="#FBBF24"/>
    </g>
    <g transform="translate(60, -45) scale(0.7)">
      <path d="M0 12 L8 0 L3 0 L9 -12 L-2 -2 L3 -2 Z" fill="#38BDF8"/>
    </g>
    
    <!-- Radiant electrical glow nodes -->
    <circle cx="70" cy="-10" r="2" fill="#FDE68A"/>
    <circle cx="85" cy="5" r="3" fill="#FDE68A"/>
    <circle cx="55" cy="-35" r="2" fill="#7DD3FC"/>
  </g>
</svg>