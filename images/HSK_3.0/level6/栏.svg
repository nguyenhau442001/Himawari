<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Newspaper / Press Column Background Representation -->
    <rect x="20" y="20" width="160" height="160" rx="12" fill="#242833" stroke="#2D3340" stroke-width="2"/>
    
    <!-- Newspaper Header -->
    <rect x="36" y="36" width="70" height="8" rx="4" fill="#3B4252"/>
    <rect x="36" y="50" width="128" height="3" rx="1.5" fill="#2D3340"/>
    
    <!-- Left Column Content (Faded) -->
    <rect x="36" y="65" width="45" height="4" rx="2" fill="#2D3340"/>
    <rect x="36" y="75" width="40" height="3" rx="1.5" fill="#2D3340"/>
    <rect x="36" y="83" width="45" height="3" rx="1.5" fill="#2D3340"/>
    <rect x="36" y="91" width="30" height="3" rx="1.5" fill="#2D3340"/>
    
    <rect x="36" y="105" width="45" height="4" rx="2" fill="#2D3340"/>
    <rect x="36" y="115" width="42" height="3" rx="1.5" fill="#2D3340"/>
    <rect x="36" y="123" width="35" height="3" rx="1.5" fill="#2D3340"/>
    
    <!-- RIGHT COLUMN: THE HIGHLIGHTED "专栏" (Column/栏) - Focus Area -->
    <rect x="95" y="60" width="75" height="95" rx="8" fill="#1F2430" stroke="#F59E0B" stroke-width="2.5"/>
    
    <!-- Column Accent Header -->
    <path d="M 107 72 L 157 72" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Column Content Lines inside Focus Box -->
    <rect x="107" y="86" width="51" height="4" rx="2" fill="#64748B"/>
    <rect x="107" y="98" width="42" height="3" rx="1.5" fill="#475569"/>
    <rect x="107" y="106" width="48" height="3" rx="1.5" fill="#475569"/>
    <rect x="107" y="114" width="38" height="3" rx="1.5" fill="#475569"/>
    
    <!-- Miniature Image Placeholder inside the Column -->
    <rect x="107" y="123" width="51" height="22" rx="4" fill="#2E384D"/>
    <!-- Abstract Mountain/Sun inside mini image representing cultural content -->
    <circle cx="118" cy="131" r="3" fill="#F59E0B"/>
    <path d="M 107 141 L 119 133 L 129 139 L 143 129 L 158 141 Z" fill="#3B4252"/>
    
    <!-- Dividing Vertical Column Line / Barrier visual metaphor (栏 - railing/partition concept) -->
    <line x1="88" y1="58" x2="88" y2="160" stroke="#3B4252" stroke-dasharray="3 3" stroke-width="2"/>
    
    <!-- Focus Indicator Badge -->
    <circle cx="132.5" cy="60" r="10" fill="#F59E0B"/>
    <path d="M 128.5 60 L 131 62.5 L 137.5 56" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>