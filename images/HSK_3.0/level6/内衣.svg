<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to highlight the object -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Underwear / 内衣 (Vector Illustration) -->
  <g transform="translate(0, 0)">
    <!-- Soft fabric texture/accent lines (representing cotton softness) -->
    <path d="M75 105 C90 115 150 115 165 105" stroke="#E2E8F0" stroke-width="1.5" fill="none" opacity="0.15" stroke-dasharray="3 3"/>
    <path d="M80 135 C100 145 140 145 160 135" stroke="#E2E8F0" stroke-width="1.5" fill="none" opacity="0.15" stroke-dasharray="3 3"/>

    <!-- Main Garment Silhouette (Sleek Modern Flat Design) -->
    <!-- Straps -->
    <path d="M85 75 L95 100" stroke="#F1F5F9" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M155 75 L145 100" stroke="#F1F5F9" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Main Body -->
    <path d="M 95 100 
             Q 120 120 145 100 
             L 165 110 
             Q 175 130 165 170 
             Q 150 175 120 175 
             Q 90 175 75 170 
             Q 65 130 75 110 Z" 
          fill="#38BDF8" 
          opacity="0.9" />

    <!-- Inner neckline shadow / depth -->
    <path d="M 95 100 Q 120 125 145 100" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>

    <!-- Elastic Waistband/Trim Detail (Highlighting high-quality cotton comfort) -->
    <path d="M 77 163 Q 120 170 163 163" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Focus Accent (Gold/Orange highlight denoting premium/soft material as per prompt context) -->
    <circle cx="120" cy="138" r="4" fill="#F59E0B"/>
    <path d="M117 138 L123 138 M120 135 L120 141" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>