<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing background elements for depth -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Sewing Needle and Thread Illustration -->
  <g transform="translate(0, 0)">
    <!-- Needle Body (Silver/Gray metallic gradient look) -->
    <path d="M 68 180 L 165 83 C 168 80 172 80 175 83 C 178 86 178 90 175 93 L 78 190 C 75 193 71 193 68 190 C 65 187 65 183 68 180 Z" fill="#9BA1A6"/>
    
    <!-- Needle Tip (Sharp end) -->
    <path d="M 165 83 L 178 70 C 180 68 182 68 184 70 C 185 71 185 73 184 75 L 175 83 Z" fill="#E2E8F0"/>
    
    <!-- Needle Eye (Hole) -->
    <ellipse cx="163" cy="93" rx="3" ry="6" transform="rotate(-45 163 93)" fill="#1A1D24"/>

    <!-- The Thread ("线" - Vibrant Gold/Orange for high contrast focus) -->
    <!-- Thread passing through the eye and curving dramatically -->
    <path d="M 163 93 
             C 170 100, 185 115, 170 135 
             C 155 155, 120 135, 110 160 
             C 100 185, 130 205, 150 215" 
          fill="none" 
          stroke="#F59E0B" 
          stroke-width="3.5" 
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Loose end of the thread trailing off -->
    <path d="M 163 93 
             C 155 85, 140 70, 145 50 
             C 150 35, 130 25, 110 30" 
          fill="none" 
          stroke="#F59E0B" 
          stroke-width="3.5" 
          stroke-linecap="round"/>
  </g>

  <!-- Highlight effects -->
  <circle cx="168" cy="88" r="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>