<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background glow -->
  <circle cx="120" cy="120" r="80" fill="#2A303C" opacity="0.4"/>
  
  <!-- Stack of masonry / brick construction context (linking to the wall-rebuilding sentence) -->
  <g transform="translate(0, 15)">
    <!-- Bottom layer of wall / other bricks faded for context -->
    <rect x="50" y="150" width="65" height="24" rx="3" fill="#363C4A"/>
    <rect x="125" y="150" width="65" height="24" rx="3" fill="#363C4A"/>
    
    <rect x="75" y="122" width="65" height="24" rx="3" fill="#363C4A"/>
    <rect x="144" y="122" width="45" height="24" rx="3" fill="#363C4A"/>
    
    <!-- Shadow for the main focused brick -->
    <path d="M 68 107 L 172 107 L 180 115 L 60 115 Z" fill="#101217" opacity="0.6"/>

    <!-- MAIN FOCUSED BRICK (Zhuan - 砖) -->
    <!-- Front Face -->
    <rect x="60" y="80" width="120" height="34" rx="4" fill="#E65C00"/>
    
    <!-- Top Face (Isometric perspective) -->
    <path d="M 60 80 L 80 62 L 200 62 L 180 80 Z" fill="#FF7A1A"/>
    
    <!-- Right Face (Isometric perspective) -->
    <path d="M 180 80 L 200 62 L 200 96 L 180 114 Z" fill="#CC5200"/>
    
    <!-- Highlight details on the main brick -->
    <line x1="68" y1="73" x2="188" y2="73" stroke="#FFA366" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Center cavity/texture characteristic of traditional clay bricks -->
    <ellipse cx="120" cy="97" rx="16" ry="6" fill="#CC5200" opacity="0.6"/>
    <ellipse cx="120" cy="96" rx="12" ry="4" fill="#A34100" opacity="0.5"/>
  </g>

  <!-- Sparkle/Focus indicators indicating precision and placement -->
  <g transform="translate(0, -10)">
    <!-- Top right sparkle -->
    <path d="M 185 50 Q 185 62 197 62 Q 185 62 185 74 Q 185 62 173 62 Q 185 62 185 50 Z" fill="#FFC266"/>
    <!-- Bottom left small sparkle -->
    <path d="M 50 135 Q 50 142 57 142 Q 50 142 50 149 Q 50 142 43 142 Q 50 142 50 135 Z" fill="#FFC266" opacity="0.7"/>
  </g>
</svg>