<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character focusing on a path -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 120 L40 80 Q40 60 60 60 L80 60 Q100 60 100 80 L100 120" fill="#4A90E2" stroke="#1A1D24" stroke-width="2"/>
    <!-- Head -->
    <circle cx="70" cy="50" r="15" fill="#FFD700"/>
    <!-- Arm pointing forward -->
    <path d="M90 75 L120 60" stroke="#4A90E2" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The "Unexpected" event: A path diverging -->
  <g stroke="#FF9F1C" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Main expected path -->
    <path d="M140 140 L180 140" stroke-dasharray="6 6" opacity="0.5"/>
    <!-- Unexpected path branching off -->
    <path d="M140 140 Q160 140 170 110" stroke-width="6"/>
    <!-- Motion lines for surprise -->
    <line x1="180" y1="100" x2="190" y2="90" stroke-width="3"/>
    <line x1="185" y1="110" x2="195" y2="105" stroke-width="3"/>
  </g>

  <!-- Surprise expression: Raised eyebrows/eyes -->
  <g transform="translate(130, 130)">
    <circle cx="0" cy="0" r="3" fill="#FFD700"/>
    <circle cx="15" cy="0" r="3" fill="#FFD700"/>
  </g>
</svg>