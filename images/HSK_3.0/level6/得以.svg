<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Railway Tracks -->
  <path d="M40 160 L200 160" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
  <path d="M40 180 L200 180" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
  <g stroke="#718096" stroke-width="4">
    <line x1="60" y1="150" x2="60" y2="190"/>
    <line x1="100" y1="150" x2="100" y2="190"/>
    <line x1="140" y1="150" x2="140" y2="190"/>
    <line x1="180" y1="150" x2="180" y2="190"/>
  </g>

  <!-- Train (The object that is enabled/restored) -->
  <g transform="translate(120, 120)">
    <rect x="-40" y="-20" width="80" height="30" rx="4" fill="#F6AD55"/>
    <rect x="-30" y="-30" width="60" height="15" rx="2" fill="#F6AD55"/>
    <circle cx="-20" cy="15" r="8" fill="#2D3748" stroke="#F6AD55" stroke-width="2"/>
    <circle cx="20" cy="15" r="8" fill="#2D3748" stroke="#F6AD55" stroke-width="2"/>
    <rect x="-10" y="-25" width="20" height="10" rx="1" fill="#1A1D24"/>
  </g>

  <!-- Repair Tool (The cause/enabler) -->
  <path d="M80 80 L110 110 L120 100 L90 70 Z" fill="#E2E8F0"/>
  <path d="M75 85 L85 75" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <path d="M115 105 L125 95" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Spark/Action indicator -->
  <circle cx="100" cy="90" r="4" fill="#F6AD55"/>
</svg>