<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Runway lights and perspective ground -->
  <path d="M 60,190 L 180,190 L 140,130 L 100,130 Z" fill="#252A34"/>
  <line x1="120" y1="130" x2="120" y2="190" stroke="#FFD166" stroke-width="2" stroke-dasharray="4,6" opacity="0.8"/>
  
  <!-- Motion glide trails -->
  <path d="M 40,115 Q 80,105 130,110" fill="none" stroke="#06D6A0" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 50,122 Q 90,112 140,117" fill="none" stroke="#06D6A0" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  
  <!-- Commercial Airliner (The Noun object representing "滑行") -->
  <g transform="translate(45, 80)">
    <!-- Main Fuselage -->
    <path d="M 20,35 C 20,30 35,26 65,26 C 110,26 135,30 145,35 C 135,40 110,44 65,44 C 35,44 20,40 20,35 Z" fill="#EAEAEA"/>
    
    <!-- Cockpit Windshield -->
    <path d="M 135,32 C 140,33 143,35 143,35 C 143,35 140,37 135,38 Z" fill="#1A1D24"/>
    
    <!-- Wings (Swept back) -->
    <path d="M 65,35 L 50,10 L 65,10 L 85,35 Z" fill="#D8D8D8"/>
    <path d="M 65,35 L 50,60 L 65,60 L 85,35 Z" fill="#B0B5BC"/>
    
    <!-- Tail Fin -->
    <path d="M 25,35 L 15,18 L 30,22 L 35,35 Z" fill="#FFD166"/>
    
    <!-- Engine Nacelles -->
    <ellipse cx="60" cy="21" rx="4" ry="2" fill="#B0B5BC"/>
    <ellipse cx="60" cy="49" rx="4" ry="2" fill="#B0B5BC"/>
    
    <!-- Landing Gear (Wheels touching ground) -->
    <rect x="58" y="55" width="2" height="6" fill="#8D99AE"/>
    <circle cx="59" cy="62" r="2.5" fill="#1A1D24"/>
    <rect x="108" y="47" width="2" height="4" fill="#8D99AE"/>
    <circle cx="109" cy="52" r="2" fill="#1A1D24"/>
  </g>
  
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="148" rx="55" ry="6" fill="#0D0E12" opacity="0.5"/>
</svg>