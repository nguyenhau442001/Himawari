<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background grid or atmosphere elements (subtle) -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#2A2F3B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Central Quadrant Layout representing 衣 (Clothing), 食 (Food), 住 (Shelter), 行 (Travel) as dynamic actions -->
  
  <!-- Connecting subtle lines -->
  <line x1="120" y1="50" x2="120" y2="190" stroke="#2A2F3B" stroke-width="2"/>
  <line x1="50" y1="120" x2="190" y2="120" stroke="#2A2F3B" stroke-width="2"/>

  <!-- Top-Left: 衣 (Clothing / Putting on coat - Action) -->
  <g transform="translate(60, 60)">
    <!-- Motion lines -->
    <path d="M-15,-10 C-20,0 -20,10 -15,20" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Hanger / Garment being worn -->
    <path d="M-10,-12 L10,-12 L15,12 C15,15 10,22 0,22 C-10,22 -15,15 -15,12 Z" fill="#3B82F6"/>
    <!-- Action hands adjusting jacket -->
    <circle cx="-12" cy="5" r="4" fill="#E2E8F0"/>
    <circle cx="12" cy="5" r="4" fill="#E2E8F0"/>
    <path d="M-12,9 L-18,15" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <path d="M12,9 L18,15" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Top-Right: 食 (Food / Eating, holding bowl & chopsticks - Action) -->
  <g transform="translate(180, 60)">
    <!-- Steam lines -->
    <path d="M-4,-22 C-6,-26 -2,-30 -4,-34" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M4,-20 C2,-24 6,-28 4,-32" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bowl -->
    <path d="M-14,-10 C-14,6 14,6 14,-10 Z" fill="#10B981"/>
    <ellipse cx="0" cy="-10" rx="14" ry="4" fill="#34D399"/>
    <!-- Chopsticks in action -->
    <line x1="-8" y1="-25" x2="12" y2="-5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="-27" x2="16" y2="-7" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bottom-Left: 住 (Shelter / Building, placing roof block - Action) -->
  <g transform="translate(60, 180)">
    <!-- House base -->
    <rect x="-10" y="-2" width="20" height="22" fill="#8B5CF6" rx="2"/>
    <rect x="-4" y="6" width="8" height="14" fill="#1A1D24"/>
    <!-- Roof being placed by dynamic hand -->
    <path d="M-16,-2 L0,-16 L16,-2 Z" fill="#A78BFA"/>
    <!-- Motion lines for placement -->
    <line x1="-15" y1="-25" x2="-10" y2="-18" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="-25" x2="10" y2="-18" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Action hand -->
    <path d="M-6,-28 C-6,-24 6,-24 6,-28" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom-Right: 行 (Travel / Mobility, moving wheel & motion path - Action) -->
  <g transform="translate(180, 180)">
    <!-- Motion trail -->
    <path d="M-22,10 C-15,18 -5,18 2,10" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <!-- Wheel / Motion vector -->
    <circle cx="0" cy="-2" r="14" fill="none" stroke="#EC4899" stroke-width="3"/>
    <circle cx="0" cy="-2" r="4" fill="#F472B6"/>
    <line x1="0" y1="-16" x2="0" y2="12" stroke="#EC4899" stroke-width="2"/>
    <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#EC4899" stroke-width="2"/>
    <!-- Speed lines -->
    <line x1="-24" y1="-8" x2="-14" y2="-8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-28" y1="2" x2="-18" y2="2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Center Focal Point: Dynamic Life Cycle / Progress Core -->
  <circle cx="120" cy="120" r="22" fill="#252A34" stroke="#F59E0B" stroke-width="3"/>
  <!-- Central active glyph/arrow loop representing livelihood/transformation (翻天覆地的变化) -->
  <path d="M112,113 C115,108 125,108 128,113 C131,118 122,126 128,131" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128,131 L124,129 M128,131 L126,126" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>