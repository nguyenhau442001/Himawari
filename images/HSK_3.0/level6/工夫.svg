<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background Environment / Room Context -->
  <!-- Window with Night City Glow -->
  <rect x="150" y="25" width="65" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="62" x2="215" y2="62" stroke="#334155" stroke-width="2" />
  <line x1="182" y1="25" x2="182" y2="100" stroke="#334155" stroke-width="2" />
  <!-- City Lights outside -->
  <rect x="158" y="75" width="8" height="18" fill="#fb923c" opacity="0.6" rx="1" />
  <rect x="170" y="40" width="10" height="50" fill="#38bdf8" opacity="0.4" rx="1" />
  <rect x="195" y="55" width="12" height="38" fill="#fbbf24" opacity="0.5" rx="1" />

  <!-- Bookshelf Background -->
  <rect x="25" y="30" width="45" height="70" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="52" x2="70" y2="52" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="78" x2="70" y2="78" stroke="#334155" stroke-width="1.5" />
  <!-- Books on shelf -->
  <rect x="30" y="38" width="6" height="14" fill="#ec4899" rx="1" />
  <rect x="38" y="36" width="8" height="16" fill="#38bdf8" rx="1" />
  <rect x="48" y="40" width="5" height="12" fill="#10b981" rx="1" />
  <rect x="32" y="62" width="12" height="16" fill="#fbbf24" rx="1" />
  <rect x="46" y="60" width="7" height="18" fill="#a855f7" rx="1" />

  <!-- Warm Desk Lamp Beam -->
  <path d="M100 10 L80 115 L160 115 Z" fill="url(#lampGlow)" />
  <!-- Lamp structure -->
  <path d="M115 25 L125 15 L135 25 Z" fill="#64748b" />
  <path d="M125 25 L125 45" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M125 45 L105 85" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <circle cx="125" cy="45" r="3" fill="#94a3b8" />

  <!-- Desk Surface -->
  <rect x="15" y="145" width="210" height="80" rx="4" fill="url(#deskGrad)" />
  <rect x="15" y="140" width="210" height="8" fill="#475569" rx="2" />

  <!-- Context Props: Effort & Language Learning (Notebooks, Stack of Papers, Pen, Coffee Cup, Dictionary) -->
  <!-- Stack of notebooks / study materials showing hard work -->
  <rect x="40" y="130" width="42" height="20" rx="3" fill="#38bdf8" transform="rotate(-5 40 130)" />
  <rect x="38" y="122" width="44" height="20" rx="3" fill="#f8fafc" transform="rotate(-2 38 122)" />
  <rect x="42" y="112" width="40" height="20" rx="3" fill="#ec4899" transform="rotate(2 42 112)" />
  
  <!-- Open Dictionary / Textbook with notes & annotations -->
  <g transform="translate(130, 115)">
    <!-- Left page -->
    <path d="M 0 25 Q 25 15 50 25 L 50 55 Q 25 45 0 55 Z" fill="url(#paperGrad)" />
    <!-- Right page -->
    <path d="M 50 25 Q 75 15 100 25 L 100 55 Q 75 45 50 55 Z" fill="url(#paperGrad)" />
    <path d="M 50 25 L 50 55" stroke="#cbd5e1" stroke-width="2" />
    <!-- Scribbles representing language notes / vocab practice -->
    <line x1="12" y1="32" x2="35" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="38" x2="28" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="44" x2="38" y2="42" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="32" x2="88" y2="30" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="38" x2="80" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="44" x2="90" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Sticky note on book -->
    <rect x="65" y="22" width="22" height="20" fill="#fef08a" rx="1" transform="rotate(8 65 22)" />
    <line x1="69" y1="28" x2="83" y2="28" stroke="#ca8a04" stroke-width="1.5" />
    <line x1="69" y1="33" x2="78" y2="33" stroke="#ca8a04" stroke-width="1.5" />
  </g>

  <!-- Coffee Mug for late-night effort -->
  <rect x="195" y="115" width="18" height="22" rx="3" fill="#f1f5f9" />
  <path d="M 213 120 C 220 120 220 130 213 133" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
  <!-- Steam rising -->
  <path d="M 201 108 Q 204 102 201 96" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 207 110 Q 210 104 207 98" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Student Character (Hard at work, focused expression, leaning forward) -->
  <g id="student-character">
    <!-- Torso / Hoodie -->
    <path d="M 85 175 C 80 150 95 130 115 130 C 135 130 150 150 145 175 Z" fill="#6366f1" />
    <!-- Hoodie Strings -->
    <line x1="110" y1="135" x2="108" y2="155" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="135" x2="122" y2="155" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" />
    
    <!-- Neck -->
    <rect x="110" y="115" width="10" height="20" fill="#fbcfe8" rx="4" />

    <!-- Head & Hair -->
    <!-- Hair back/base -->
    <circle cx="115" cy="95" r="22" fill="#0f172a" />
    <!-- Face -->
    <circle cx="115" cy="98" r="18" fill="#fbcfe8" />
    <!-- Hair top stylized -->
    <path d="M 97 90 C 95 75 110 72 125 78 C 135 82 135 95 135 95 Z" fill="#0f172a" />
    <path d="M 125 78 C 132 75 142 82 138 92" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Glasses (Studious look) -->
    <rect x="104" y="90" width="11" height="8" rx="2" fill="none" stroke="#334155" stroke-width="1.5" />
    <rect x="117" y="90" width="11" height="8" rx="2" fill="none" stroke="#334155" stroke-width="1.5" />
    <line x1="115" y1="93" x2="117" y2="93" stroke="#334155" stroke-width="1.5" />

    <!-- Focused Eyes (slight squint of concentration) -->
    <line x1="107" y1="94" x2="112" y2="94" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="94" x2="125" y2="94" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Determined Mouth -->
    <path d="M 112 107 Q 115 105 118 107" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" />

    <!-- Eyebrows (focused, slanted) -->
    <line x1="105" y1="88" x2="112" y2="90" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="90" x2="127" y2="88" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Arms & Hands actively writing / holding pen -->
    <!-- Left arm resting on desk -->
    <path d="M 90 145 C 80 155 75 160 70 165" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round" />
    <circle cx="68" cy="167" r="5" fill="#fbcfe8" />

    <!-- Right arm holding pen leaning forward -->
    <path d="M 135 145 C 145 155 150 162 155 165" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="157" cy="167" r="5" fill="#fbcfe8" />
    <!-- Pen -->
    <line x1="155" y1="165" x2="170" y2="155" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Pen tip motion / sparks of effort -->
    <circle cx="172" cy="153" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Sparkles / Effort / Focus indicators (Abstract concept rendered as concrete desk highlights & glowing study energy) -->
  <g filter="url(#glow)">
    <circle cx="175" cy="135" r="2" fill="#fbbf24" />
    <path d="M 175 128 L 177 133 L 182 135 L 177 137 L 175 142 L 173 137 L 168 135 L 173 133 Z" fill="#38bdf8" opacity="0.8" transform="scale(0.5) translate(180, 100)" />
    <path d="M 95 105 L 96 108 L 99 109 L 96 110 L 95 113 L 94 110 L 91 109 L 94 108 Z" fill="#fbbf24" opacity="0.8" />
  </g>
</svg>