<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative upward growth chart grid/lines (representing stock exchange & market launch) -->
  <g opacity="0.15">
    <line x1="40" y1="180" x2="200" y2="180" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="40" y1="130" x2="200" y2="130" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="40" y1="80" x2="200" y2="80" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Rising trend line -->
    <path d="M50 170 L90 140 L130 150 L170 90 L200 60" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing background accent representing market spotlight -->
  <circle cx="120" cy="120" r="65" fill="#FFB703" opacity="0.08"/>

  <!-- Stock Exchange candlestick bars in background -->
  <g transform="translate(0, 10)">
    <!-- Bar 1 -->
    <line x1="75" y1="110" x2="75" y2="160" stroke="#FF5470" stroke-width="2"/>
    <rect x="69" y="125" width="12" height="25" rx="2" fill="#FF5470" opacity="0.6"/>

    <!-- Bar 2 -->
    <line x1="105" y1="95" x2="105" y2="150" stroke="#06D6A0" stroke-width="2"/>
    <rect x="99" y="110" width="12" height="25" rx="2" fill="#06D6A0" opacity="0.6"/>

    <!-- Bar 3 -->
    <line x1="135" y1="80" x2="135" y2="140" stroke="#06D6A0" stroke-width="2"/>
    <rect x="129" y="95" width="12" height="30" rx="2" fill="#06D6A0" opacity="0.8"/>

    <!-- Bar 4 (Highlight/Latest) -->
    <line x1="165" y1="50" x2="165" y2="120" stroke="#FFB703" stroke-width="2"/>
    <rect x="159" y="60" width="12" height="45" rx="2" fill="#FFB703"/>
  </g>

  <!-- Central Physical Object: The Smartwatch (representing "这款最新研发的智能手表" - physical product launched to market) -->
  <g transform="translate(0, 5)">
    <!-- Watch Strap Top -->
    <rect x="106" y="45" width="28" height="35" rx="6" fill="#2B313C"/>
    <line x1="120" y1="52" x2="120" y2="72" stroke="#3A4250" stroke-width="3" stroke-linecap="round"/>

    <!-- Watch Strap Bottom -->
    <rect x="106" y="160" width="28" height="35" rx="6" fill="#2B313C"/>
    <line x1="120" y1="168" x2="120" y2="188" stroke="#3A4250" stroke-width="3" stroke-linecap="round"/>

    <!-- Watch Case Outer Bezel -->
    <rect x="88" y="72" width="64" height="96" rx="22" fill="#3A4250"/>
    
    <!-- Watch Case Inner Body -->
    <rect x="91" y="75" width="58" height="90" rx="19" fill="#1A1D24" stroke="#FFB703" stroke-width="2.5"/>

    <!-- Watch Screen Interface (Clean vector UI showing product readiness & launch time) -->
    <rect x="98" y="82" width="44" height="76" rx="14" fill="#121418"/>
    
    <!-- UI Graphic: Rising Growth Curve on Watch Screen -->
    <path d="M106 138 L116 126 L126 130 L134 108" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- UI Graphic: Data Nodes -->
    <circle cx="106" cy="138" r="2.5" fill="#FFB703"/>
    <circle cx="116" cy="126" r="2.5" fill="#FFB703"/>
    <circle cx="126" cy="130" r="2.5" fill="#FFB703"/>
    <circle cx="134" cy="108" r="3.5" fill="#FFB703"/>

    <!-- UI Graphic: Clock/Time indicator -->
    <circle cx="120" cy="98" r="6" fill="none" stroke="#6C7A9C" stroke-width="1.5"/>
    <line x1="120" y1="95" x2="120" y2="98" stroke="#6C7A9C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="120" y1="98" x2="123" y2="98" stroke="#6C7A9C" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Watch Crown (Side button) -->
    <rect x="152" y="104" width="5" height="16" rx="2.5" fill="#FFB703"/>
  </g>

  <!-- Forward/Upward Launch Sparkles (Symbolizing "上市" - hitting the market / stock exchange debut) -->
  <g transform="translate(0, 0)">
    <!-- Top Right Sparkle -->
    <path d="M185 55 L187 65 L197 67 L187 69 L185 79 L183 69 L173 67 L183 65 Z" fill="#FFB703"/>
    <!-- Top Left Accent Sparkle -->
    <path d="M55 85 L56 90 L61 91 L56 92 L55 97 L54 92 L49 91 L54 90 Z" fill="#06D6A0" opacity="0.8"/>
  </g>
</svg>