<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow/surface -->
  <ellipse cx="120" cy="185" rx="75" ry="15" fill="#111318" opacity="0.8"/>

  <!-- Serving Tray / Table Surface -->
  <path d="M50 170 L190 170 L200 185 L40 185 Z" fill="#252A34"/>
  <ellipse cx="120" cy="170" rx="70" ry="12" fill="#2E3544"/>

  <!-- Dish 1 (Bowl of Soup/Stew - top left) -->
  <g transform="translate(75, 135)">
    <ellipse cx="0" cy="5" rx="22" ry="8" fill="#3E4656"/>
    <path d="M-22 5 C-22 18, 22 18, 22 5 Z" fill="#4F5D73"/>
    <ellipse cx="0" cy="5" rx="20" ry="6" fill="#FF8C42"/>
    <!-- Garnish -->
    <circle cx="-4" cy="4" r="2" fill="#2ECC71"/>
    <circle cx="5" cy="6" r="1.5" fill="#2ECC71"/>
  </g>

  <!-- Dish 2 (Plate with steamed fish/main dish - top right) -->
  <g transform="translate(160, 140)">
    <ellipse cx="0" cy="5" rx="28" ry="9" fill="#E2E8F0"/>
    <ellipse cx="0" cy="4" rx="25" ry="7" fill="#CBD5E1"/>
    <!-- Food item: Fish/Delicacy -->
    <path d="M-15 4 C-5 0, 5 0, 15 4 C 15 7, -15 7, -15 4 Z" fill="#E06D53"/>
    <path d="M-8 3 C-2 1, 2 1, 8 3" stroke="#F6AD55" stroke-width="1.5" fill="none"/>
    <circle cx="-10" cy="4" r="1" fill="#2ECC71"/>
    <circle cx="8" cy="5" r="1" fill="#2ECC71"/>
  </g>

  <!-- Dish 3 (Dim Sum Basket / Small bowl - center front) -->
  <g transform="translate(120, 150)">
    <!-- Bamboo steamer container -->
    <ellipse cx="0" cy="8" rx="20" ry="7" fill="#D97706"/>
    <path d="M-20 8 L-18 2 C-18 -2, 18 -2, 18 2 L20 8 Z" fill="#F59E0B"/>
    <ellipse cx="0" cy="2" rx="18" ry="5" fill="#FEF3C7"/>
    <!-- Dumplings inside -->
    <circle cx="-6" cy="2" r="4" fill="#FFFFFF"/>
    <circle cx="6" cy="2" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="-1" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Dish 4 (Stir-fry vegetable plate - middle left) -->
  <g transform="translate(75, 110)">
    <ellipse cx="0" cy="5" rx="24" ry="8" fill="#3B82F6"/>
    <ellipse cx="0" cy="4" rx="21" ry="6" fill="#1E3A8A"/>
    <!-- Veggies (Broccoli/Greens) -->
    <circle cx="-7" cy="3" r="5" fill="#10B981"/>
    <circle cx="2" cy="2" r="6" fill="#059669"/>
    <circle cx="8" cy="4" r="4" fill="#34D399"/>
  </g>

  <!-- Dish 5 (Red braised meat/delicacy plate - middle right) -->
  <g transform="translate(155, 115)">
    <ellipse cx="0" cy="5" rx="24" ry="8" fill="#EF4444"/>
    <ellipse cx="0" cy="4" rx="21" ry="6" fill="#991B1B"/>
    <!-- Chunks -->
    <rect x="-10" y="-1" width="7" height="6" rx="2" fill="#B45309"/>
    <rect x="1" y="0" width="8" height="6" rx="2" fill="#92400E"/>
    <circle cx="6" cy="3" r="1.5" fill="#34D399"/>
  </g>

  <!-- Main Central Focal Dish (Grand bowl representing 'Variety' / 'Type' - 样) -->
  <g transform="translate(120, 95)">
    <!-- Bowl Base & Rim -->
    <ellipse cx="0" cy="10" rx="34" ry="12" fill="#E2E8F0"/>
    <path d="M-34 10 C-32 32, 32 32, 34 10 Z" fill="#CBD5E1"/>
    <ellipse cx="0" cy="10" rx="30" ry="10" fill="#1E293B"/>
    
    <!-- Rich colorful contents (Multiple varieties/types of ingredients) -->
    <!-- Orange accent component -->
    <path d="M-15 8 C-10 2, -2 4, 2 9 C -5 12, -12 12, -15 8 Z" fill="#F97316"/>
    <!-- Green component -->
    <circle cx="10" cy="8" r="7" fill="#10B981"/>
    <!-- Red component -->
    <path d="M-4 5 C 2 2, 12 5, 8 11 C 0 12, -6 9, -4 5 Z" fill="#EF4444"/>
    <!-- Yellow garnish -->
    <circle cx="-2" cy="7" r="3" fill="#FACC15"/>
    
    <!-- Steam wisps representing freshness / variety -->
    <path d="M-5 -2 C -8 -10, 2 -12, -2 -20" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M8 0 C 11 -8, 5 -14, 10 -22" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Floating indicator accents (representing distinct "types" or "varieties" - 样) -->
  <g transform="translate(120, 32)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#252A34" stroke="#F59E0B" stroke-width="2"/>
    <!-- Stylized category dots representing multiple distinct dishes/types -->
    <circle cx="-24" cy="0" r="4" fill="#EF4444"/>
    <circle cx="-12" cy="0" r="4" fill="#F97316"/>
    <circle cx="0" cy="0" r="4" fill="#FACC15"/>
    <circle cx="12" cy="0" r="4" fill="#10B981"/>
    <circle cx="24" cy="0" r="4" fill="#3B82F6"/>
  </g>
</svg>