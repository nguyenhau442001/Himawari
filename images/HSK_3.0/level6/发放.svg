<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background accent glow representing official distribution -->
  <circle cx="120" cy="120" r="70" fill="#252D3D" opacity="0.6"/>

  <!-- Official Distribution Concept: Government relief fund / aid distribution (发放) -->
  <!-- Official / Government Building silhouette background element -->
  <path d="M90 100 L120 75 L150 100 Z" fill="#2D3748"/>
  <rect x="98" y="100" width="44" height="45" fill="#2D3748"/>
  <rect x="110" y="115" width="20" height="30" fill="#1A1D24"/>

  <!-- Secure Aid Box / Relief Package (Physical Object representing the distributed item) -->
  <!-- Box body -->
  <rect x="80" y="135" width="80" height="50" rx="4" fill="#D97706"/>
  <!-- Box lid -->
  <path d="M74 130 H166 V138 H74 Z" fill="#F59E0B"/>
  <!-- Ribbon / Official seal band -->
  <rect x="112" y="130" width="16" height="55" fill="#FBBF24"/>

  <!-- Golden Relief Coins / Funds being distributed -->
  <!-- Coin 1 -->
  <circle cx="100" cy="110" r="10" fill="#FCD34D"/>
  <circle cx="100" cy="110" r="7" fill="#F59E0B"/>
  
  <!-- Coin 2 -->
  <circle cx="140" cy="110" r="10" fill="#FCD34D"/>
  <circle cx="140" cy="110" r="7" fill="#F59E0B"/>

  <!-- Motion / Distribution Arrows indicating 'fāfàng' (dispensing outward) -->
  <!-- Left downward disbursement arrow -->
  <path d="M75 95 L60 110 L68 110 L68 120 L82 120 L82 110 L90 110 Z" fill="#3B82F6" opacity="0.9" transform="rotate(-45 75 105)"/>
  
  <!-- Right downward disbursement arrow -->
  <path d="M165 95 L150 110 L158 110 L158 120 L172 120 L172 110 L180 110 Z" fill="#3B82F6" opacity="0.9" transform="scale(-1 1) translate(-330, 0) rotate(-45 165 105)"/>

  <!-- Central Hand / Official Dispensing Gesture from above -->
  <path d="M105 55 C105 45 135 45 135 55 L130 75 H110 Z" fill="#E2E8F0"/>
  <!-- Cuff -->
  <rect x="108" y="75" width="24" height="15" rx="2" fill="#1E40AF"/>

</svg>