<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background elements / Office Architecture -->
  <!-- Window frame showing night city lights -->
  <path d="M150 30 L210 30 L210 110 L150 110 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="30" x2="180" y2="110" stroke="#334155" stroke-width="1.5"/>
  <line x1="150" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="1.5"/>
  <!-- City lights through window -->
  <circle cx="165" cy="50" r="1.5" fill="#f59e0b"/>
  <circle cx="170" cy="90" r="2" fill="#38bdf8"/>
  <circle cx="195" cy="45" r="1.5" fill="#10b981"/>
  <circle cx="200" cy="85" r="2.5" fill="#f59e0b"/>
  <rect x="155" y="100" width="50" height="4" fill="#475569" rx="2"/>

  <!-- Warm ambient light circle -->
  <circle cx="120" cy="90" r="70" fill="url(#amberGlow)" filter="url(#glow)"/>

  <!-- Bookshelf in background -->
  <rect x="25" y="40" width="45" height="80" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="65" x2="70" y2="65" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="95" x2="70" y2="95" stroke="#334155" stroke-width="1.5"/>
  <!-- Colorful books -->
  <rect x="30" y="48" width="6" height="17" fill="#38bdf8" rx="1"/>
  <rect x="38" y="45" width="8" height="20" fill="#ec4899" rx="1"/>
  <rect x="48" y="50" width="5" height="15" fill="#f59e0b" rx="1"/>
  <rect x="30" y="75" width="10" height="20" fill="#10b981" rx="1"/>
  <rect x="42" y="78" width="7" height="17" fill="#6366f1" rx="1"/>

  <!-- Foreground Desk Surface -->
  <path d="M15 160 L225 160 L235 210 L5 210 Z" fill="url(#deskGrad)"/>
  <path d="M15 160 L225 160" stroke="#475569" stroke-width="2"/>

  <!-- Desk lamp -->
  <path d="M195 160 L205 110 L215 110 L225 160 Z" fill="#64748b"/>
  <path d="M190 110 C190 95, 215 95, 215 110 Z" fill="#f59e0b"/>
  <path d="M200 110 L180 135" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Management Documents / Charts (The "System / Chế độ quản lý") -->
  <!-- Clipboard / Document Stack on Desk -->
  <g transform="translate(60, 135)">
    <!-- Base paper -->
    <rect x="0" y="0" width="45" height="55" rx="3" fill="url(#paperGrad)" transform="rotate(-8 22 27)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Top paper with checkmarks (system being perfected) -->
    <rect x="10" y="-10" width="45" height="55" rx="3" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Clip -->
    <rect x="25" y="-14" width="15" height="6" rx="2" fill="#64748b"/>
    <!-- Document lines and checkmarks (representing structure/rules) -->
    <path d="M18 5 L22 9 L32 -1" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38" y1="4" x2="47" y2="4" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    
    <path d="M18 18 L22 22 L32 12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38" y1="17" x2="47" y2="17" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    
    <path d="M18 31 L22 35 L32 25" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38" y1="30" x2="47" y2="30" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Adding final finishing touch mark (completing the system) -->
    <circle cx="45" cy="42" r="6" fill="#10b981"/>
    <path d="M42 42 L44 44 L48 39" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Secondary Folder -->
  <path d="M115 155 L155 145 L160 175 L120 185 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M120 150 L135 150 L140 155 L150 155" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Characters Collaborating (Teamwork / "Chúng ta") -->
  <!-- Character 1 (Left - Professional Planner) -->
  <g transform="translate(25, 95)">
    <!-- Body / Torso -->
    <path d="M25 50 C25 35, 45 35, 45 50 L55 90 C55 95, 45 100, 35 100 L15 100 C5 100, 5 95, 15 90 Z" fill="#38bdf8"/>
    <!-- Collar / Shirt detail -->
    <path d="M30 35 L35 48 L40 35" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Head -->
    <circle cx="35" cy="22" r="14" fill="#fbcfe8"/>
    <!-- Hair (Dark modern style) -->
    <path d="M21 20 C21 10, 49 10, 49 20 C49 25, 45 28, 45 28 C45 28, 43 18, 35 16 C27 16, 25 28, 25 28 C25 28, 21 25, 21 20 Z" fill="#0f172a"/>
    <!-- Face profile/expression (Focused, smiling) -->
    <circle cx="41" cy="23" r="1.5" fill="#1e293b"/>
    <path d="M41 28 Q44 30 46 27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Active Arm pointing / holding pen -->
    <path d="M42 50 L62 65" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand with stylus/pen -->
    <circle cx="64" cy="67" r="4" fill="#fbcfe8"/>
    <line x1="64" y1="67" x2="74" y2="77" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Right - Manager / Reviewer) -->
  <g transform="translate(130, 85)">
    <!-- Body / Torso (Blazer) -->
    <path d="M35 50 C35 35, 60 35, 60 50 L75 105 L20 105 Z" fill="#6366f1"/>
    <!-- Inner shirt -->
    <path d="M40 50 L47 70 L55 50" fill="#f8fafc"/>
    <!-- Tie -->
    <polygon points="45,55 49,55 51,75 47,82 43,75" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="47" cy="22" r="14" fill="#fdbf6f"/>
    <!-- Hair (Neat parted hair) -->
    <path d="M33 20 C33 11, 61 11, 61 20 C61 22, 58 24, 58 24 C58 24, 53 15, 47 15 C41 15, 36 24, 36 24 C36 24, 33 22, 33 20 Z" fill="#334155"/>
    <!-- Glasses -->
    <rect x="38" y="18" width="8" height="5" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="48" y="18" width="8" height="5" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="46" y1="20" x2="48" y2="20" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Smile -->
    <path d="M43 28 Q47 32 51 28" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm resting approvingly -->
    <path d="M35 55 L15 75 L25 85" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23" cy="87" r="4" fill="#fdbf6f"/>
  </g>

  <!-- Sparkling / Improvement Action Icons (Hoàn thiện - Enhancing / Upgrading) -->
  <!-- Floating polish/upgrade stars and checkmarks around the document -->
  <g transform="translate(100, 110)">
    <!-- Star 1 -->
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#f59e0b" transform="scale(0.8)"/>
    <!-- Star 2 -->
    <path d="M30 -25 L31.5 -21 L35.5 -19.5 L31.5 -18 L30 -14 L28.5 -18 L24.5 -19.5 L28.5 -21 Z" fill="#38bdf8" transform="scale(0.9)"/>
    <!-- Glowing check symbol floating above -->
    <circle cx="-15" cy="-25" r="10" fill="#10b981" opacity="0.9" filter="url(#glow)"/>
    <path d="M-20 -25 L-17 -22 L-10 -30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Additional Modern UI Accent Glow on Desk (Bottom Left) -->
  <circle cx="45" cy="190" r="30" fill="url(#accentGlow)" filter="url(#glow)"/>

  <!-- Coffee Cup / Practical Office Detail -->
  <g transform="translate(170, 140)">
    <path d="M0 5 L16 5 L14 25 C14 28, 11 30, 8 30 C5 30, 2 28, 2 25 Z" fill="#f8fafc"/>
    <path d="M14 10 C18 10, 20 13, 20 16 C20 19, 18 22, 14 22" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M6 -2 C6 -5, 9 -5, 9 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M11 -4 C11 -7, 14 -7, 14 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>