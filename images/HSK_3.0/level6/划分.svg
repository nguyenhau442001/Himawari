<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Illustration for 划分 (Urban Grid / Boundary Demarcation) -->
  <g transform="translate(20, 25)">
    <!-- Base Map/District Area -->
    <rect x="10" y="10" width="180" height="180" rx="16" fill="#222730" stroke="#2F3642" stroke-width="2"/>

    <!-- City Blocks (Sub-divisions / 划分) -->
    <!-- District 1 -->
    <rect x="24" y="24" width="70" height="70" rx="8" fill="#2A313C"/>
    <circle cx="59" cy="59" r="12" fill="#3A4454"/>
    <rect x="53" y="53" width="12" height="12" rx="2" fill="#F39C12" opacity="0.8"/>

    <!-- District 2 -->
    <rect x="106" y="24" width="70" height="70" rx="8" fill="#2A313C"/>
    <circle cx="141" cy="59" r="12" fill="#3A4454"/>
    <path d="M135 63L141 51L147 63H135Z" fill="#3498DB" opacity="0.9"/>

    <!-- District 3 -->
    <rect x="24" y="106" width="70" height="70" rx="8" fill="#2A313C"/>
    <circle cx="59" cy="141" r="12" fill="#3A4454"/>
    <rect x="51" y="137" width="16" height="8" rx="2" fill="#2ECC71" opacity="0.9"/>

    <!-- District 4 -->
    <rect x="106" y="106" width="70" height="70" rx="8" fill="#2A313C"/>
    <circle cx="141" cy="141" r="12" fill="#3A4454"/>
    <circle cx="141" cy="141" r="6" fill="#E74C3C" opacity="0.9"/>

    <!-- Precision Dividing Lines (Grid Borders / Demarcation) -->
    <!-- Vertical Divider -->
    <line x1="100" y1="20" x2="100" y2="180" stroke="#F39C12" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
    
    <!-- Horizontal Divider -->
    <line x1="20" y1="100" x2="180" y2="100" stroke="#F39C12" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>

    <!-- Central Intersection Focus (Boundary Node) -->
    <circle cx="100" cy="100" r="8" fill="#1A1D24" stroke="#F39C12" stroke-width="3"/>
    <circle cx="100" cy="100" r="3" fill="#F39C12"/>

    <!-- Measurement / Compass Indicator Accents -->
    <path d="M94 14H106" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
    <path d="M94 186H106" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 94V106" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
    <path d="M186 94V106" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>