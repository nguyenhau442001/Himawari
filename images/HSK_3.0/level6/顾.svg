<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle floor line -->
  <path d="M40 180 L200 180" stroke="#2D343E" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Adult figure (The Caretaker) -->
  <g transform="translate(80, 80)">
    <circle cx="20" cy="20" r="12" fill="#FFB86C"/> <!-- Head -->
    <path d="M8 35 C8 30, 32 30, 32 35 L35 80 L5 80 Z" fill="#6272A4"/> <!-- Torso -->
    <path d="M10 40 L0 70" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/> <!-- Arm reaching out -->
  </g>
  
  <!-- Child figure (The one being cared for) -->
  <g transform="translate(130, 110)">
    <circle cx="15" cy="15" r="8" fill="#F8F8F2"/> <!-- Head -->
    <path d="M7 25 C7 20, 23 20, 23 25 L25 50 L5 50 Z" fill="#8BE9FD"/> <!-- Torso -->
  </g>
  
  <!-- Action: Hand gently resting on shoulder (The act of '顾' - looking after/caring) -->
  <g transform="translate(115, 115)">
    <path d="M0 0 C5 -5, 15 -5, 20 0" stroke="#FFB86C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="4" fill="#FFB86C"/>
  </g>
  
  <!-- Subtle directional gaze indicator (The 'ngoảnh lại' aspect) -->
  <path d="M95 95 Q110 85 125 95" stroke="#44475A" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>