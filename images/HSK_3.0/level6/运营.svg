<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subway Train Body -->
  <rect x="50" y="100" width="140" height="50" rx="6" fill="#FFB800"/>
  
  <!-- Windows -->
  <rect x="65" y="110" width="20" height="20" rx="2" fill="#1A1D24"/>
  <rect x="95" y="110" width="20" height="20" rx="2" fill="#1A1D24"/>
  <rect x="125" y="110" width="20" height="20" rx="2" fill="#1A1D24"/>
  <rect x="155" y="110" width="20" height="20" rx="2" fill="#1A1D24"/>
  
  <!-- Wheels -->
  <circle cx="80" cy="160" r="10" fill="#7D8590"/>
  <circle cx="160" cy="160" r="10" fill="#7D8590"/>
  
  <!-- Track -->
  <rect x="40" y="165" width="160" height="6" rx="2" fill="#4A5568"/>
  <rect x="40" y="175" width="160" height="6" rx="2" fill="#4A5568"/>
  
  <!-- Connection/Support Beam -->
  <path d="M 120 100 L 120 70" stroke="#FFB800" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="70" r="8" fill="#FFB800"/>
</svg>