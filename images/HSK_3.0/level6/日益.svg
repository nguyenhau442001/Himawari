<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm City Glow -->
    <radialGradient id="cityGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Frame Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Indoor Room Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#wallGrad)" />

  <!-- OUTDOOR CITY VIEW THROUGH WINDOW (Background layer) -->
  <g id="outdoor-scene">
    <!-- Sky & Atmosphere -->
    <rect x="25" y="25" width="130" height="135" fill="url(#skyGrad)" />
    <rect x="25" y="25" width="130" height="135" fill="url(#cityGlow)" />

    <!-- Distant Clean City Skyline -->
    <path d="M25 140 L35 110 L45 115 L60 90 L75 95 L90 80 L105 100 L120 75 L135 90 L155 160 Z" fill="#334155" opacity="0.6" />
    <path d="M40 160 L50 125 L65 130 L80 105 L95 115 L110 95 L130 110 L155 160 Z" fill="#475569" opacity="0.8" />

    <!-- Modern Eco-Friendly Towers & Lights -->
    <rect x="55" y="115" width="14" height="45" fill="#334155" />
    <rect x="58" y="120" width="8" height="35" fill="#f59e0b" opacity="0.6" />

    <rect x="95" y="90" width="18" height="70" fill="#475569" />
    <!-- Glowing eco-windows -->
    <rect x="98" y="98" width="4" height="6" fill="#38bdf8" />
    <rect x="106" y="98" width="4" height="6" fill="#38bdf8" />
    <rect x="98" y="112" width="4" height="6" fill="#10b981" />
    <rect x="106" y="112" width="4" height="6" fill="#10b981" />

    <!-- Lush Green Urban Park (Showing "Improved Environment") -->
    <!-- Park Hills -->
    <path d="M25 160 Q 60 140 100 155 Q 130 148 155 160 Z" fill="#059669" />
    <path d="M50 160 Q 90 145 140 160 Z" fill="#10b981" />

    <!-- Vibrant Eco Trees -->
    <!-- Tree 1 -->
    <circle cx="50" cy="142" r="10" fill="#34d399" />
    <rect x="48" y="148" width="4" height="12" fill="#78350f" />
    <!-- Tree 2 -->
    <circle cx="70" cy="138" r="12" fill="#059669" />
    <rect x="68" y="145" width="4" height="15" fill="#78350f" />
    <!-- Tree 3 -->
    <circle cx="115" cy="144" r="11" fill="#34d399" />
    <rect x="113" y="150" width="4" height="10" fill="#78350f" />
    <circle cx="125" cy="146" r="9" fill="#10b981" />

    <!-- Clean Blue River flowing through city -->
    <path d="M25 155 Q 60 148 90 158 Q 120 168 155 156 L155 160 L25 160 Z" fill="#38bdf8" opacity="0.7" />
    <!-- Little white renewable windmill in distance -->
    <line x1="138" y1="125" x2="138" y2="140" stroke="#f8fafc" stroke-width="1.5" />
    <circle cx="138" cy="125" r="1.5" fill="#f8fafc" />
    <path d="M138 125 L133 121 M138 125 L143 128 M138 125 L136 130" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- WINDOW FRAME (Foreground framing element) -->
  <g id="window-frame">
    <!-- Glass pane tint -->
    <rect x="25" y="25" width="130" height="135" fill="url(#glassGrad)" />

    <!-- Window Sill & Inner Frame (Deep slate/wood style) -->
    <rect x="20" y="20" width="140" height="145" fill="none" stroke="#475569" stroke-width="6" rx="2" />
    <!-- Window Cross Bars -->
    <line x1="90" y1="20" x2="90" y2="165" stroke="#475569" stroke-width="4" />
    <line x1="20" y1="92" x2="160" y2="92" stroke="#475569" stroke-width="4" />

    <!-- Window Sill (extends out) -->
    <rect x="16" y="163" width="148" height="10" rx="2" fill="#64748b" filter="url(#softShadow)" />
    <rect x="14" y="171" width="152" height="4" rx="1" fill="#475569" />
  </g>

  <!-- INDOOR ENVIRONMENT & PROPS ON SILL -->
  <g id="indoor-sill-props">
    <!-- Potted Plant (Fresh green leaves symbolizing thriving urban ecology) -->
    <path d="M 35 163 L 41 150 L 51 150 L 57 163 Z" fill="#fb923c" />
    <ellipse cx="46" cy="150" rx="5" ry="2" fill="#fdba74" />
    <!-- Plant foliage -->
    <circle cx="41" cy="142" r="6" fill="#10b981" />
    <circle cx="51" cy="141" r="7" fill="#34d399" />
    <circle cx="46" cy="135" r="8" fill="#059669" />

    <!-- Coffee Mug -->
    <rect x="130" y="148" width="12" height="15" rx="2" fill="#cbd5e1" />
    <path d="M 142 151 C 146 151 146 159 142 161" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 134 143 Q 136 139 134 135" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- MAIN CHARACTER (Observing the improving environment with satisfaction) -->
  <g id="character-observer" transform="translate(145, 60)">
    <!-- Body / Torso (leaning forward) -->
    <path d="M 35 70 C 25 70 15 80 15 105 L 75 105 C 75 85 60 70 45 70 Z" fill="#3b82f6" filter="url(#softShadow)" />
    <!-- Collar / Shirt Detail -->
    <path d="M 38 70 L 45 80 L 52 70 Z" fill="#f8fafc" />

    <!-- Neck -->
    <rect x="41" y="58" width="8" height="15" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="45" cy="46" r="16" fill="#fbcfe8" />
    <!-- Friendly Face & Expression (Delighted / Impressed) -->
    <!-- Smiling Happy Eyes -->
    <path d="M 38 43 Q 41 46 44 43" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 48 43 Q 51 46 54 43" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M 42 51 Q 45 55 48 51" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
    <!-- Cute Rosy Cheeks -->
    <circle cx="37" cy="48" r="3" fill="#fda4af" opacity="0.6" />
    <circle cx="53" cy="48" r="3" fill="#fda4af" opacity="0.6" />

    <!-- Stylish Modern Hair (Dark Teal/Slate) -->
    <path d="M 29 46 C 28 32 37 28 45 28 C 55 28 62 34 61 46 C 61 46 58 35 45 34 C 32 33 29 46 29 46 Z" fill="#0f172a" />

    <!-- Arm resting on window sill / pointing or relaxed -->
    <path d="M 18 85 C 5 90 -5 100 -15 103" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <circle cx="-16" cy="103" r="4" fill="#fbcfe8" />
  </g>

  <!-- INTERIOR FOREGROUND DETAILS (Desk and ambient light) -->
  <!-- Desk surface -->
  <rect x="110" y="170" width="120" height="70" fill="#334155" />
  <rect x="110" y="170" width="120" height="6" fill="#475569" />

  <!-- Open eco-friendly book / design blueprints on desk (representing planning/progress) -->
  <g transform="translate(160, 185) rotate(-5)">
    <polygon points="0,15 25,5 50,15 50,40 25,30 0,40" fill="#f8fafc" />
    <polygon points="25,5 25,30 50,40 50,15" fill="#e2e8f0" />
    <!-- Colorful charts inside book indicating positive growth -->
    <line x1="8" y1="22" x2="18" y2="18" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="18" x2="42" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="37" cy="22" r="3" fill="#f59e0b" />
  </g>

  <!-- Warm ambient light beam cutting across room -->
  <polygon points="80,20 170,170 230,170 230,120" fill="#f59e0b" opacity="0.06" style="mix-blend-mode: screen;" />

</svg>