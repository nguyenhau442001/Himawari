<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg_grad)" />
  <circle cx="120" cy="100" r="80" fill="url(#spotlight)" />

  <!-- Stage/Podium -->
  <path d="M40 220 Q120 210 200 220 L210 240 H30 Z" fill="#334155" />
  <rect x="60" y="195" width="120" height="25" rx="4" fill="#475569" />

  <!-- Character -->
  <!-- Legs/Body -->
  <path d="M105 195 L110 150 L130 150 L135 195" fill="#1e293b" />
  <path d="M105 155 Q120 145 135 155 L140 110 Q120 100 100 110 Z" fill="#38bdf8" />
  
  <!-- Arms raised in victory -->
  <path d="M100 120 L80 90 M140 120 L160 90" stroke="#fde047" stroke-width="8" stroke-linecap="round" />
  
  <!-- Head -->
  <circle cx="120" cy="95" r="15" fill="#fde047" />
  <!-- Face expression (joy) -->
  <path d="M115 95 Q120 100 125 95" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M113 90 Q115 88 117 90 M123 90 Q125 88 127 90" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- Three Trophies (The "接连三次" - Three times in a row) -->
  <!-- Trophy 1 (Left) -->
  <g transform="translate(75, 175) scale(0.7)">
    <path d="M10 5 Q10 0 20 0 Q30 0 30 5 L28 15 Q20 20 12 15 Z" fill="#fbbf24" />
    <path d="M12 15 L15 25 H25 L28 15" fill="#f59e0b" />
    <rect x="12" y="25" width="16" height="3" fill="#d97706" />
    <path d="M8 5 Q5 5 5 10 Q5 15 10 15 M32 5 Q35 5 35 10 Q35 15 30 15" fill="none" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Trophy 2 (Middle) -->
  <g transform="translate(105, 170) scale(0.8)">
    <path d="M10 5 Q10 0 20 0 Q30 0 30 5 L28 15 Q20 20 12 15 Z" fill="#fbbf24" />
    <path d="M12 15 L15 25 H25 L28 15" fill="#f59e0b" />
    <rect x="12" y="25" width="16" height="3" fill="#d97706" />
    <path d="M8 5 Q5 5 5 10 Q5 15 10 15 M32 5 Q35 5 35 10 Q35 15 30 15" fill="none" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Trophy 3 (Right) -->
  <g transform="translate(135, 175) scale(0.7)">
    <path d="M10 5 Q10 0 20 0 Q30 0 30 5 L28 15 Q20 20 12 15 Z" fill="#fbbf24" />
    <path d="M12 15 L15 25 H25 L28 15" fill="#f59e0b" />
    <rect x="12" y="25" width="16" height="3" fill="#d97706" />
    <path d="M8 5 Q5 5 5 10 Q5 15 10 15 M32 5 Q35 5 35 10 Q35 15 30 15" fill="none" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Confetti/Celebration -->
  <circle cx="50" cy="60" r="2" fill="#ec4899" />
  <rect x="180" y="70" width="4" height="4" rx="1" fill="#10b981" transform="rotate(45 182 72)" />
  <circle cx="200" cy="110" r="2.5" fill="#fb923c" />
  <rect x="40" y="120" width="3" height="5" rx="1" fill="#38bdf8" transform="rotate(-20 41.5 122.5)" />
  <circle cx="70" cy="40" r="2" fill="#fbbf24" />
  <rect x="160" y="45" width="5" height="2" rx="1" fill="#ec4899" />
  <circle cx="210" cy="160" r="2" fill="#10b981" />
  <rect x="30" y="170" width="4" height="4" rx="1" fill="#fb923c" />

  <!-- Subtle Glow on Trophies -->
  <circle cx="120" cy="180" r="15" fill="#fbbf24" fill-opacity="0.2" />
</svg>