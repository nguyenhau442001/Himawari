<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person looking back at a framed achievement -->
  <g transform="translate(40, 60)">
    <!-- The Achievement Frame (The "Past") -->
    <rect x="90" y="20" width="70" height="50" rx="4" fill="#2D343E" stroke="#FFB800" stroke-width="2"/>
    <path d="M100 40h50M100 50h30M100 60h40" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
    
    <!-- The Person (The "Observer") -->
    <g transform="translate(20, 20)">
      <circle cx="30" cy="30" r="25" fill="#4A5568"/>
      <path d="M30 60v40M15 100l10-20M45 100l-10-20" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
      <circle cx="30" cy="25" r="12" fill="#E2E8F0"/>
      <!-- Looking back gesture -->
      <path d="M42 30c10 0 20 10 20 20" stroke="#E2E8F0" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Visual connection line -->
    <path d="M75 50h20" stroke="#FFB800" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>