<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow representing vital atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#00D2FF" opacity="0.05"/>
  <circle cx="120" cy="115" r="45" fill="#00D2FF" opacity="0.08"/>

  <!-- Oxygen Molecule (O2) Graphic -->
  <!-- Atom 1 (Left) -->
  <circle cx="90" cy="115" r="28" fill="#FF5E62"/>
  <circle cx="82" cy="107" r="8" fill="#FFA1A5" opacity="0.6"/>
  <text x="90" y="123" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">O</text>

  <!-- Atom 2 (Right) -->
  <circle cx="150" cy="115" r="28" fill="#FF5E62"/>
  <circle cx="142" cy="107" r="8" fill="#FFA1A5" opacity="0.6"/>
  <text x="150" y="123" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">O</text>

  <!-- Chemical Bond (Double Bond) -->
  <line x1="110" y1="108" x2="130" y2="108" stroke="#00D2FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="122" x2="130" y2="122" stroke="#00D2FF" stroke-width="4" stroke-linecap="round"/>

  <!-- Dynamic Sparkles / Life bubbles floating upward -->
  <circle cx="70" cy="65" r="4" fill="#00D2FF" opacity="0.8"/>
  <circle cx="170" cy="75" r="3" fill="#00D2FF" opacity="0.6"/>
  <circle cx="130" cy="50" r="5" fill="#00D2FF" opacity="0.9"/>
  <circle cx="105" cy="175" r="3" fill="#00D2FF" opacity="0.5"/>
  <circle cx="155" cy="165" r="4.5" fill="#00D2FF" opacity="0.7"/>

  <!-- Modern base line / pedestal for the physical object icon look -->
  <path d="M 85 175 L 155 175" stroke="#3A3F4B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 95 183 L 145 183" stroke="#2C323D" stroke-width="3" stroke-linecap="round"/>
</svg>