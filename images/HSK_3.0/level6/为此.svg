<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background glow representing "focus" / "this specific matter" -->
  <circle cx="120" cy="120" r="70" fill="#2D323F" opacity="0.6"/>
  <circle cx="120" cy="120" r="45" fill="#3A4150" opacity="0.4"/>

  <!-- Conceptual Physical Object for "为此" (This matter / Focused objective entity) -->
  <!-- Sleek, modern glowing dossier/core document representing "the matter at hand" -->
  <g transform="translate(0, 0)">
    <!-- Document shadow/base -->
    <path d="M85 70 L155 70 C160 70 165 75 165 80 L165 170 C165 175 160 180 155 180 L85 180 C80 180 75 175 75 170 L75 80 C75 75 80 70 85 70 Z" fill="#252A36" stroke="#3A4150" stroke-width="2"/>
    
    <!-- Document main body -->
    <rect x="85" y="80" width="70" height="90" rx="6" fill="#2E3646"/>
    
    <!-- Accent folder tab -->
    <path d="M85 80 L110 80 L118 70 L85 70 Z" fill="#F39C12" opacity="0.8"/>
    
    <!-- Content lines representing details of "the matter" -->
    <rect x="97" y="100" width="46" height="6" rx="3" fill="#4E5D6C"/>
    <rect x="97" y="116" width="32" height="6" rx="3" fill="#4E5D6C"/>
    
    <!-- Glowing target / focus checkmark emphasizing the specific point ("此") -->
    <circle cx="120" cy="147" r="16" fill="#F39C12"/>
    <path d="M112 147 L117 152 L128 141" fill="none" stroke="#1A1D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pointing indicator framing the focal point ("pointing to this") -->
  <!-- Sleek modern accent cursor/marker pointing directly to the object -->
  <g transform="translate(120, 120)">
    <!-- Top-left subtle bracket -->
    <path d="M -75 -65 L -85 -65 L -85 -55" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Bottom-right subtle bracket -->
    <path d="M 75 65 L 85 65 L 85 55" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>