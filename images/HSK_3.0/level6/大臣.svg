<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Golden Palace Glow -->
    <radialGradient id="palace-glow" cx="50%" cy="40%" r="65%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Pillar Gradient -->
    <linearGradient id="pillar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Imperial Gold Accent -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Environment & Palace Architecture -->
  <g id="palace-interior">
    <!-- Ambient Light Cone -->
    <circle cx="120" cy="90" r="110" fill="url(#palace-glow)"/>

    <!-- Floor / Marble Base -->
    <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#0f172a"/>
    <path d="M0 190 L240 190 L220 240 L20 240 Z" fill="#334155" opacity="0.3"/>
    <!-- Floor Tiles Perspective Lines -->
    <line x1="120" y1="190" x2="120" y2="240" stroke="#475569" stroke-width="1" opacity="0.4"/>
    <line x1="120" y1="190" x2="40" y2="240" stroke="#475569" stroke-width="1" opacity="0.4"/>
    <line x1="120" y1="190" x2="200" y2="240" stroke="#475569" stroke-width="1" opacity="0.4"/>

    <!-- Back Wall & Traditional Screen (Pingfeng) -->
    <rect x="60" y="55" width="120" height="135" rx="4" fill="#451a03" stroke="#78350f" stroke-width="2"/>
    <rect x="68" y="63" width="104" height="119" fill="#1e1b4b" rx="2"/>
    <!-- Screen Mountain Art Motif -->
    <path d="M68 150 L95 110 L115 130 L145 95 L172 150 Z" fill="#312e81" opacity="0.8"/>
    <path d="M85 150 L110 120 L130 140 L160 115 L172 150 Z" fill="#4338ca" opacity="0.6"/>
    <circle cx="120" cy="80" r="12" fill="url(#gold-grad)" opacity="0.9"/>

    <!-- Architectural Pillars (Left and Right) -->
    <rect x="15" y="20" width="22" height="175" fill="url(#pillar-grad)" filter="url(#shadow)"/>
    <rect x="203" y="20" width="22" height="175" fill="url(#pillar-grad)" filter="url(#shadow)"/>
    <!-- Pillar Capitals -->
    <rect x="12" y="20" width="28" height="10" fill="url(#gold-grad)"/>
    <rect x="200" y="20" width="28" height="10" fill="url(#gold-grad)"/>

    <!-- Hanging Imperial Lanterns -->
    <path d="M45 20 L45 50" stroke="#b45309" stroke-width="2"/>
    <path d="M195 20 L195 50" stroke="#b45309" stroke-width="2"/>
    <!-- Left Lantern -->
    <g transform="translate(45, 50)">
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="url(#gold-grad)"/>
      <path d="M-10 0 C-15 15, -15 25, 0 30 C15 25, 15 15, 10 0 Z" fill="#dc2626" stroke="#fef08a" stroke-width="1.5"/>
      <ellipse cx="0" cy="30" rx="8" ry="3" fill="url(#gold-grad)"/>
      <line x1="0" y1="33" x2="0" y2="42" stroke="#fef08a" stroke-width="1.5"/>
    </g>
    <!-- Right Lantern -->
    <g transform="translate(195, 50)">
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="url(#gold-grad)"/>
      <path d="M-10 0 C-15 15, -15 25, 0 30 C15 25, 15 15, 10 0 Z" fill="#dc2626" stroke="#fef08a" stroke-width="1.5"/>
      <ellipse cx="0" cy="30" rx="8" ry="3" fill="url(#gold-grad)"/>
      <line x1="0" y1="33" x2="0" y2="42" stroke="#fef08a" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Characters (The Emperor and Ministers) -->
  <g id="characters" filter="url(#shadow)">
    
    <!-- LEFT MINISTER (大臣 - Da Chen 1) -->
    <g transform="translate(68, 115)">
      <!-- Body/Robes (Deep Blue/Teal official robes) -->
      <path d="M-12 35 L-22 75 L18 75 L12 35 Z" fill="#0f766e"/>
      <!-- Sleeves folded / holding hud tablet -->
      <path d="M-25 40 C-25 30, -5 30, -5 45 L-15 70 Z" fill="#115e59"/>
      <path d="M15 40 C15 30, -5 30, -5 45 L5 70 Z" fill="#115e59"/>
      <!-- Court Tablet (Hud) -->
      <rect x="-8" y="32" width="6" height="22" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Head & Facial Expression -->
      <circle cx="-5" cy="20" r="10" fill="#fde68a"/>
      <!-- Black Official Hat (Futou with wings) -->
      <path d="M-17 14 L7 14 L5 8 C5 8, -5 6, -17 14 Z" fill="#0f172a"/>
      <line x1="-25" y1="12" x2="15" y2="10" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <!-- Facial features: respectful, attentive look -->
      <path d="M-7 19 Q-5 17 -3 19" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <circle cx="-2" cy="22" r="1" fill="#334155"/>
      <path d="M-8 25 Q-5 27 -2 25" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Subtle beard -->
      <path d="M-7 27 Q-5 31 -3 27" fill="#334155"/>
    </g>

    <!-- RIGHT MINISTER (大臣 - Da Chen 2) -->
    <g transform="translate(172, 115)">
      <!-- Body/Robes (Deep Plum/Burgundy official robes) -->
      <path d="M-12 35 L-18 75 L22 75 L12 35 Z" fill="#831843"/>
      <!-- Sleeves and Arms -->
      <path d="M-15 40 C-15 30, 5 30, 5 45 L-5 70 Z" fill="#9d174d"/>
      <path d="M25 40 C25 30, 5 30, 5 45 L15 70 Z" fill="#9d174d"/>
      <!-- Court Tablet (Hud) -->
      <rect x="2" y="32" width="6" height="22" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Head & Facial Expression -->
      <circle cx="5" cy="20" r="10" fill="#fde68a"/>
      <!-- Official Hat -->
      <path d="M-7 14 L17 14 L15 8 C15 8, 5 6, -7 14 Z" fill="#0f172a"/>
      <line x1="-5" y1="11" x2="35" y2="13" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <!-- Facial features: wise, engaged -->
      <path d="M3 19 Q5 17 7 19" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <circle cx="6" cy="22" r="1" fill="#334155"/>
      <path d="M2 25 Q5 27 8 25" stroke="#701a75" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- CENTER: THE EMPEROR (皇帝 - Huangdi) -->
    <g transform="translate(120, 100)">
      <!-- Raised Imperial Throne (Dragon Chair Base) -->
      <rect x="-35" y="55" width="70" height="40" fill="#78350f" rx="3"/>
      <rect x="-40" y="90" width="80" height="12" fill="#92400e" rx="2"/>
      <path d="M-30 55 L-35 25 L35 25 L30 55 Z" fill="#451a03"/>
      <circle cx="0" cy="40" r="12" fill="url(#gold-grad)"/>

      <!-- Emperor's Body (Imperial Yellow Robes) -->
      <path d="M-18 45 L-28 90 L28 90 L18 45 Z" fill="#b45309"/>
      <path d="M-15 45 L0 60 L15 45 Z" fill="#fef08a"/> <!-- Dragon chest emblem vestment -->
      
      <!-- Sleeves -->
      <path d="M-32 50 C-35 40, -15 35, -15 50 L-25 85 Z" fill="#d97706"/>
      <path d="M32 50 C35 40, 15 35, 15 50 L25 85 Z" fill="#d97706"/>

      <!-- Head & Imperial Crown (Mianfu with beads) -->
      <circle cx="0" cy="28" r="11" fill="#fde68a"/>
      
      <!-- Crown Board & Hanging Beads -->
      <rect x="-16" y="14" width="32" height="4" fill="#0f172a" rx="1"/>
      <rect x="-14" y="10" width="28" height="4" fill="url(#gold-grad)" rx="1"/>
      <!-- Hanging Pearl Strings -->
      <line x1="-12" y1="18" x2="-12" y2="26" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="1,2"/>
      <line x1="-4" y1="18" x2="-4" y2="26" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="1,2"/>
      <line x1="4" y1="18" x2="4" y2="26" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="1,2"/>
      <line x1="12" y1="18" x2="12" y2="26" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="1,2"/>

      <!-- Facial Expression: Regal, commanding yet calm -->
      <circle cx="-3" cy="30" r="1" fill="#1e293b"/>
      <circle cx="3" cy="30" r="1" fill="#1e293b"/>
      <path d="M-3 36 Q0 38 3 36" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

  </g>

  <!-- Foreground Atmospheric Elements & Architectural Polish -->
  <g id="foreground-details">
    <!-- Incense Burner / Traditional Urn on the side (Adding depth) -->
    <g transform="translate(190, 175)">
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="url(#gold-grad)"/>
      <path d="M-10 0 L-7 16 C-7 18, 7 18, 7 16 L10 0 Z" fill="#b45309"/>
      <path d="M-4 16 L-2 22 L2 22 L4 16 Z" fill="#78350f"/>
      <!-- Wisps of Smoke -->
      <path d="M0 -4 C-5 -10, 5 -16, 0 -22" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
      <path d="M3 -6 C8 -12, -2 -18, 3 -25" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.3"/>
    </g>

    <!-- Additional background Minister silhouette for depth ("many" ministers context) -->
    <g transform="translate(42, 125)" opacity="0.5">
      <path d="M-10 30 L-16 75 L16 75 L10 30 Z" fill="#0f766e"/>
      <circle cx="0" cy="18" r="9" fill="#fde68a"/>
      <path d="M-12 12 L10 12 L8 7 C8 7, 0 5, -12 12 Z" fill="#0f172a"/>
    </g>
    <g transform="translate(198, 125)" opacity="0.5">
      <path d="M-10 30 L-16 75 L16 75 L10 30 Z" fill="#831843"/>
      <circle cx="0" cy="18" r="9" fill="#fde68a"/>
      <path d="M-8 12 L14 12 L12 7 C12 7, 4 5, -8 12 Z" fill="#0f172a"/>
    </g>
  </g>

  <!-- Clean Border / Frame Inset to tie the vector piece together -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>