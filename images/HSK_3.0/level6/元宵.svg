<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for warmth -->
  <circle cx="120" cy="130" r="70" fill="#FFB703" opacity="0.06" filter="blur(15px)"/>

  <!-- Spoon/Ladle Handle extending from top right -->
  <path d="M165 45 L195 25 C200 21 207 27 203 32 L175 62 Z" fill="#4A5568"/>
  <circle cx="198" cy="28" r="4" fill="#718096"/>

  <!-- Ceramic Bowl (Dark mode styled, elegant curve) -->
  <path d="M60 120 C60 165 80 185 120 185 C160 185 180 165 180 120 Z" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
  <!-- Bowl Rim -->
  <ellipse cx="120" cy="120" rx="60" ry="14" fill="#323F4B" stroke="#718096" stroke-width="2"/>
  <!-- Bowl Inner Shadow -->
  <ellipse cx="120" cy="122" rx="52" ry="10" fill="#1A1D24"/>

  <!-- Sweet Tangyuan (Yuanxiao) - White glutinous rice balls floating in warm translucent syrup -->
  <!-- Syrup level -->
  <ellipse cx="120" cy="124" rx="48" ry="8" fill="#F6AD55" opacity="0.25"/>

  <!-- Tangyuan 1 (Back Left) -->
  <circle cx="95" cy="115" r="18" fill="#EDF2F7"/>
  <circle cx="91" cy="111" r="16" fill="#F7FAFC"/>
  <!-- Highlight 1 -->
  <circle cx="89" cy="107" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- Tangyuan 2 (Back Right) -->
  <circle cx="145" cy="112" r="17" fill="#EDF2F7"/>
  <circle cx="148" cy="109" r="15" fill="#F7FAFC"/>
  <!-- Highlight 2 -->
  <circle cx="143" cy="104" r="3.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Tangyuan 3 (Front Center - Prominent) -->
  <circle cx="120" cy="130" r="21" fill="#CBD5E0"/>
  <circle cx="118" cy="127" r="19" fill="#EDF2F7"/>
  <circle cx="116" cy="124" r="17" fill="#FFFFFF"/>
  <!-- Highlight 3 -->
  <circle cx="111" cy="116" r="4.5" fill="#FFFFFF"/>

  <!-- Steam / Heat Wisps (Representing hot festive dessert) -->
  <path d="M105 85 C100 75 110 65 105 55" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M125 80 C130 70 120 60 125 48" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M142 88 C147 78 139 68 144 58" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Festive Glowing Sparks (Lantern festival atmosphere) -->
  <circle cx="70" cy="75" r="2" fill="#FFB703" opacity="0.8"/>
  <circle cx="170" cy="90" r="1.5" fill="#FFB703" opacity="0.6"/>
  <circle cx="155" cy="50" r="2.5" fill="#FFB703" opacity="0.9"/>
  <circle cx="85" cy="155" r="1.5" fill="#FFB703" opacity="0.5"/>
</svg>