<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Kitchen Counter -->
  <rect x="20" y="160" width="200" height="80" rx="8" fill="#334155"/>
  
  <!-- Character: Person looking concerned -->
  <g transform="translate(40, 60)">
    <path d="M20 100 Q 20 60 40 60 T 60 100" fill="#fb923c"/>
    <circle cx="40" cy="45" r="25" fill="#fde68a"/>
    <path d="M30 40 L35 45 M45 40 L50 45" stroke="#1e293b" stroke-width="2"/>
    <path d="M35 55 Q40 50 45 55" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- The Spoiled Food (The focus) -->
  <g transform="translate(130, 120)">
    <!-- Bowl -->
    <path d="M10 20 L70 20 L60 50 L20 50 Z" fill="#64748b"/>
    <!-- Spoiled contents with green mold accents -->
    <circle cx="40" cy="25" r="22" fill="#fbbf24"/>
    <circle cx="30" cy="20" r="8" fill="#10b981"/>
    <circle cx="50" cy="30" r="6" fill="#10b981"/>
    <path d="M25 15 Q30 5 40 15 T 55 15" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
  </g>
  
  <!-- Steam/Stench lines -->
  <path d="M150 100 Q160 80 150 60" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M165 105 Q175 85 165 65" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Kitchen window background detail -->
  <rect x="180" y="30" width="40" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="200" y1="30" x2="200" y2="70" stroke="#334155" stroke-width="2"/>
</svg>