<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%\" stop-color="#090d16" />
    </linearGradient>

    <!-- Factory Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Toxic Cloud Gradient -->
    <linearGradient id="toxicCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Sun/Haze Gradient -->
    <radialGradient id="sunGlow" cx="75%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>

    <!-- Factory Wall Gradient -->
    <linearGradient id="factoryWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Sun Glow -->
  <circle cx="180" cy="60" r="70" fill="url(#sunGlow)" />

  <!-- Distant Hills / Horizon -->
  <path d="M0 160 Q 60 145, 120 155 T 240 150 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.8" />

  <!-- Environment: Factory Background Elements -->
  <!-- Smaller Back Factory -->
  <rect x="25" y="110" width="45" height="50" fill="#1e293b" />
  <polygon points="20,110 47,90 75,110" fill="#334155" />
  <!-- Smokestack 1 -->
  <rect x="35" y="75" width="8" height="35" fill="#475569" />
  <!-- Smokestack 2 -->
  <rect x="55" y="80" width="8" height="30" fill="#475569" />

  <!-- Main Factory Building -->
  <path d="M 80 160 L 80 115 L 140 115 L 140 160 Z" fill="url(#factoryWall)" />
  <!-- Sawtooth Roofs -->
  <polygon points="80,115 100,95 120,115" fill="url(#roofGrad)" />
  <polygon points="120,115 140,95 160,115" fill="url(#roofGrad)" />
  <rect x="130" y="115" width="40" height="45" fill="#334155" />
  
  <!-- Factory Windows (Lit up warm) -->
  <rect x="90" y="125" width="8" height="10" rx="1" fill="#fbbf24" opacity="0.8" />
  <rect x="105" y="125" width="8" height="10" rx="1" fill="#fbbf24" opacity="0.8" />
  <rect x="120" y="125" width="8" height="10" rx="1" fill="#fbbf24" opacity="0.8" />
  <rect x="90" y="142" width="8" height="10" rx="1" fill="#fbbf24" opacity="0.8" />
  <rect x="105" y="142" width="8" height="10" rx="1" fill="#fbbf24" opacity="0.8" />
  <rect x="120" y="142" width="8" height="10" rx="1" fill="#fbbf24" opacity="0.8" />

  <!-- INDUSTRIAL PIPES & VALVES (Visualizing "排放" - Emissions / Discharge) -->
  <!-- Main Discharge Pipe coming out of Factory -->
  <rect x="150" y="130" width="35" height="12" rx="2" fill="#64748b" />
  <rect x="180" y="125" width="8" height="22" rx="2" fill="#475569" />
  <circle cx="184" cy="136" r="5" fill="#f43f5e" /> <!-- Warning Valve -->

  <!-- Giant Smokestack (Primary Emission Point) -->
  <rect x="195" y="85" width="16" height="75" fill="#475569" />
  <rect x="192" y="80" width="22" height="7" rx="2" fill="#334155" />
  <!-- Warning Stripes on Stack -->
  <rect x="195" y="100" width="16" height="5" fill="#f59e0b" />
  <rect x="195" y="125" width="16" height="5" fill="#f59e0b" />

  <!-- HEAVY SMOKE & POLLUTION PLUMES (Illustrating toxic exhaust filling air) -->
  <path d="M 39 75 Q 30 50, 20 40 Q 10 30, 25 15 Q 40 0, 60 15 Q 80 30, 70 50 Q 60 70, 39 75" fill="url(#smokeGrad)" />
  <path d="M 59 80 Q 50 60, 45 45 Q 40 30, 55 20 Q 70 10, 85 25 Q 100 40, 90 60 Q 80 80, 59 80" fill="url(#smokeGrad)" opacity="0.7" />

  <!-- Main Industrial Exhaust from Smokestack -->
  <path d="M 203 80 Q 200 50, 175 40 Q 150 30, 130 45 Q 110 60, 120 80 Q 130 100, 160 85 Q 190 70, 203 80" fill="url(#smokeGrad)" />
  <!-- Expanding Toxic Cloud over the Sky -->
  <path d="M 160 50 Q 130 10, 90 20 Q 50 30, 60 60 Q 70 90, 110 70 Q 150 50, 160 50" fill="url(#toxicCloud)" />
  <path d="M 140 35 Q 110 -5, 75 10 Q 40 25, 50 45 Q 60 65, 95 50 Q 130 35, 140 35" fill="url(#smokeGrad)" opacity="0.6" />

  <!-- Foreground Ground Layer -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" />
  <path d="M 0 180 Q 120 170, 240 180 L 240 240 L 0 240 Z" fill="#1e293b" />
  <!-- Small Hill / Sidewalk in Foreground -->
  <path d="M -10 200 Q 60 185, 150 195 T 250 190 L 250 240 L -10 240 Z" fill="#0f172a" />

  <!-- Lonely Tree (Affected by Pollution) -->
  <path d="M 35 195 L 37 170" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <circle cx="37" cy="165" r="12" fill="#475569" opacity="0.5" />
  <circle cx="30" cy="160" r="10" fill="#64748b" opacity="0.4" />

  <!-- HUMAN ELEMENT: Concerned Citizen / Character reacting to the polluted air -->
  <!-- Character positioning (Bottom Left, looking up/towards the factory smog) -->
  <g transform="translate(70, 160)">
    <!-- Body / Jacket -->
    <path d="M 15 35 Q 15 20, 25 15 L 35 20 Q 45 25, 45 35 L 40 55 L 15 55 Z" fill="url(#jacketGrad)" />
    <!-- Scarf (protecting against pollution) -->
    <path d="M 22 15 Q 30 18, 38 15 L 42 22 Q 30 25, 18 22 Z" fill="#ec4899" />
    <path d="M 36 20 L 42 35 L 36 38 Z" fill="#ec4899" /> <!-- Scarf tail -->

    <!-- Neck & Head -->
    <rect x="26" y="8" width="8" height="8" fill="#cbd5e1" />
    <circle cx="30" cy="6" r="10" fill="#fbcfe8" /> <!-- Face -->
    
    <!-- Hair -->
    <path d="M 20 4 Q 30 -2, 40 4 Q 38 10, 35 8 Q 30 4, 25 8 Z" fill="#334155" />

    <!-- Anti-Pollution Mask (Crucial context prop for air pollution) -->
    <path d="M 24 6 Q 30 12, 36 6 Q 33 13, 27 13 Z" fill="#f8fafc" />
    <line x1="22" y1="8" x2="25" y2="9" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="38" y1="8" x2="35" y2="9" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Concerned Eyes looking up at smog -->
    <circle cx="27" cy="4" r="1.5" fill="#0f172a" />
    <circle cx="33" cy="4" r="1.5" fill="#0f172a" />
    <!-- Worried Eyebrows -->
    <line x1="25" y1="2" x2="29" y2="3" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
    <line x1="31" y1="3" x2="35" y2="2" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />

    <!-- Arms: One shielding face/pointing at sky -->
    <path d="M 15 22 Q 5 25, 2 18" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" />
    <path d="M 45 22 Q 55 20, 60 28" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" />

    <!-- Legs -->
    <rect x="19" y="52" width="6" height="18" fill="url(#pantsGrad)" />
    <rect x="33" y="52" width="6" height="18" fill="url(#pantsGrad)" />
    <!-- Shoes -->
    <ellipse cx="21" cy="70" rx="5" ry="2" fill="#0f172a" />
    <ellipse cx="37" cy="70" rx="5" ry="2" fill="#0f172a" />
  </g>

  <!-- Environmental Details: Floating particles / smog wisps in foreground -->
  <circle cx="110" cy="140" r="3" fill="#94a3b8" opacity="0.5" />
  <circle cx="125" cy="155" r="2" fill="#cbd5e1" opacity="0.4" />
  <circle cx="150" cy="130" r="4" fill="#94a3b8" opacity="0.3" />
  <circle cx="130" cy="115" r="5" fill="#64748b" opacity="0.4" />
  
  <!-- Subtle Lighting Highlights -->
  <path d="M 0 0 L 240 0 L 240 5 L 0 5 Z" fill="#38bdf8" opacity="0.2" />
</svg>