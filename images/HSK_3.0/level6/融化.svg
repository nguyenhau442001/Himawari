<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="75%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Ice/Snow Gradient -->
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop/Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Background Environment / Distant Hills -->
  <path d="M 0 140 Q 60 110 120 130 T 240 125 L 240 180 L 0 180 Z" fill="#334155" opacity="0.4" />
  <path d="M 0 150 Q 80 125 160 145 T 240 140 L 240 180 L 0 180 Z" fill="#475569" opacity="0.5" />

  <!-- Warm Sun -->
  <circle cx="180" cy="55" r="20" fill="#fbbf24" opacity="0.9" />
  <circle cx="180" cy="55" r="26" fill="#f59e0b" opacity="0.2" />

  <!-- Spring Tree (Sign of melting/changing season) -->
  <g id="tree">
    <path d="M 40 160 L 40 100 Q 40 90 50 85 Q 35 75 30 65 Q 25 75 20 85 Q 30 90 30 100 L 30 160 Z" fill="#78350f" />
    <!-- Tree branches with budding green leaves -->
    <circle cx="30" cy="60" r="12" fill="#10b981" opacity="0.8" />
    <circle cx="50" cy="70" r="14" fill="#059669" opacity="0.85" />
    <circle cx="20" cy="75" r="10" fill="#34d399" opacity="0.8" />
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="165" width="240" height="75" fill="url(#groundGrad)" />

  <!-- MAIN SCENARIO: Melting Snowman & Snowdrift -->
  <!-- Snowdrift / Base -->
  <path d="M 10 180 Q 40 155 90 165 T 200 160 Q 230 162 240 170 L 240 190 L 10 190 Z" fill="url(#snowGrad)" />

  <!-- Melting Snowman (Slumping, losing shape) -->
  <g id="snowman">
    <!-- Bottom body (melted flat/wide) -->
    <ellipse cx="140" cy="168" rx="35" ry="14" fill="url(#snowGrad)" />
    <!-- Middle body (slumping down) -->
    <ellipse cx="140" cy="142" rx="27" ry="18" fill="url(#snowGrad)" />
    <!-- Head (tilting to the side sadly/comically) -->
    <circle cx="132" cy="116" r="18" fill="url(#snowGrad)" />

    <!-- Carrot nose pointing down as it melts -->
    <path d="M 125 118 Q 112 125 110 130 Q 118 126 125 120 Z" fill="#fb923c" />

    <!-- Coal eyes (drooping) -->
    <circle cx="126" cy="112" r="2" fill="#0f172a" />
    <circle cx="138" cy="113" r="2" fill="#0f172a" />

    <!-- Coal smile (melting out of alignment) -->
    <path d="M 125 122 Q 131 126 137 121" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Twig arms (one dropping down) -->
    <path d="M 113 140 Q 95 135 88 145" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 167 140 Q 185 155 190 168" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Red Scarf (slipping off) -->
    <path d="M 118 128 Q 132 135 146 128 Q 140 138 124 138 Z" fill="#ef4444" />
    <path d="M 135 133 Q 145 150 142 165" stroke="#ef4444" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Puddles and Dripping Water (Visualizing 'Tan Chảy') -->
  <!-- Water puddle under snowman -->
  <ellipse cx="145" cy="178" rx="45" ry="6" fill="#0284c7" opacity="0.6" />
  <ellipse cx="100" cy="182" rx="25" ry="4" fill="#38bdf8" opacity="0.5" />

  <!-- Active Water Droplets falling/dripping -->
  <g id="droplets">
    <!-- Drop from brim -->
    <path d="M 118 133 Q 116 142 118 145 Q 120 142 118 133 Z" fill="url(#waterGrad)" />
    <!-- Drop mid-air -->
    <path d="M 155 150 Q 154 156 155 158 Q 156 156 155 150 Z" fill="url(#waterGrad)" />
    <circle cx="130" cy="162" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="165" cy="165" r="1.5" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Foreground Character: Curious Child observing the melting snow -->
  <g id="child">
    <!-- Child Body & Coat -->
    <path d="M 75 190 Q 72 165 85 150 L 98 150 Q 110 165 108 190 Z" fill="#38bdf8" />
    <!-- Yellow boots -->
    <rect x="79" y="187" rx="3" width="10" height="8" fill="#f59e0b" />
    <rect x="94" y="187" rx="3" width="10" height="8" fill="#f59e0b" />

    <!-- Head & Scarf -->
    <circle cx="91" cy="135" r="13" fill="#fed7aa" />
    <!-- Cute knit cap -->
    <path d="M 78 133 Q 91 120 104 133 Z" fill="#ec4899" />
    <circle cx="91" cy="119" r="4" fill="#fbbf24" />

    <!-- Face profile looking down at snowman -->
    <circle cx="98" cy="136" r="1.5" fill="#1e293b" />
    <path d="M 98 141 Q 102 143 105 140" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arms pointing at snowman -->
    <path d="M 80 160 Q 105 158 112 153" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="112" cy="153" r="3" fill="#fed7aa" />
  </g>

  <!-- Spring Flowers starting to bloom out of melting snow -->
  <g id="spring-flowers">
    <!-- Flower 1 -->
    <path d="M 60 175 Q 60 168 57 163" stroke="#10b981" stroke-width="2" fill="none" />
    <circle cx="57" cy="162" r="3" fill="#ec4899" />
    <circle cx="57" cy="162" r="1" fill="#f59e0b" />

    <!-- Flower 2 -->
    <path d="M 195 178 Q 198 170 203 165" stroke="#10b981" stroke-width="2" fill="none" />
    <circle cx="203" cy="164" r="3.5" fill="#f43f5e" />
    <circle cx="203" cy="164" r="1.2" fill="#fef08a" />
  </g>

  <!-- Sparkling sunshine/warmth effects -->
  <g id="sparkles" opacity="0.8">
    <path d="M 150 95 L 150 105 M 145 100 L 155 100" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 110 85 L 110 91 M 107 88 L 113 88" stroke="#fef08a" stroke-width="1" stroke-linecap="round" />
    <path d="M 205 105 L 205 111 M 202 108 L 208 108" stroke="#fef08a" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>