<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Street Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Floor Light -->
    <linearGradient id="floorLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Motion Blur Gradient -->
    <linearGradient id="motionFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Distant City Skyline Silhouette -->
  <path d="M0 160 L20 160 L20 130 L40 130 L40 160 L70 160 L70 110 L95 110 L95 160 L130 160 L130 140 L150 140 L150 160 L190 160 L190 120 L210 120 L210 160 L240 160 L240 185 L0 185 Z" fill="#172033" />
  <path d="M30 160 L30 140 L35 140 L35 160 Z M80 160 L80 125 L85 125 L85 160 Z M200 160 L200 135 L205 135 L205 160 Z" fill="#1e293b" opacity="0.6" />

  <!-- Warm City Glow / Windows -->
  <rect x="25" y="135" width="3" height="4" fill="#fbbf24" opacity="0.6" />
  <rect x="32" y="145" width="3" height="4" fill="#38bdf8" opacity="0.6" />
  <rect x="75" y="115" width="4" height="6" fill="#fbbf24" opacity="0.8" />
  <rect x="85" y="120" width="4" height="6" fill="#fbbf24" opacity="0.5" />
  <rect x="195" y="125" width="4" height="5" fill="#ec4899" opacity="0.7" />

  <!-- Street Lamp Pole & Light Beam -->
  <path d="M200 40 L200 185" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <path d="M190 40 L210 40 L215 50 L185 50 Z" fill="#334155" />
  <circle cx="200" cy="52" r="6" fill="#fbbf24" />
  <circle cx="200" cy="52" r="50" fill="url(#lampGlow)" />
  <polygon points="200,52 140,185 240,185" fill="#fbbf24" opacity="0.04" />

  <!-- Ground Plane & Pavement -->
  <rect x="0" y="180" width="240" height="60" fill="#0b1120" />
  <!-- Pavement Tiles -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" />
  <line x1="20" y1="180" x2="0" y2="240" stroke="#1e293b" stroke-width="1" />
  <line x1="90" y1="180" x2="60" y2="240" stroke="#1e293b" stroke-width="1" />
  <line x1="160" y1="180" x2="140" y2="240" stroke="#1e293b" stroke-width="1" />
  <line x1="220" y1="180" x2="210" y2="240" stroke="#1e293b" stroke-width="1" />

  <!-- Dynamic Ground Light Reflection (Stressing the 'Big Step / 迈') -->
  <ellipse cx="120" cy="185" rx="80" ry="8" fill="url(#floorLight)" />

  <!-- MAIN CHARACTER: Sponsoring the Action "迈着大步" (Taking a long, confident stride) -->
  <g id="walking-character">
    <!-- Motion Lines / Speed Trails -->
    <path d="M60 125 L95 125" stroke="url(#motionFade)" stroke-width="2" stroke-linecap="round" />
    <path d="M70 145 L110 145" stroke="url(#motionFade)" stroke-width="3" stroke-linecap="round" />
    <path d="M50 170 L90 170" stroke="url(#motionFade)" stroke-width="2" stroke-linecap="round" />

    <!-- Back Leg (Stretching Backward) -->
    <!-- Shoe back -->
    <path d="M65 178 L45 183 L50 188 L70 183 Z" fill="#0f172a" />
    <!-- Pant leg back -->
    <path d="M75 145 L65 180 L80 180 L88 150 Z" fill="#1e3a8a" />

    <!-- Torso & Coat (Dynamic Forward Lean) -->
    <!-- Trench Coat / Jacket Flowing Backwards -->
    <path d="M100 100 Q120 110 135 130 L115 175 L85 175 L95 130 Z" fill="#3b82f6" />
    <!-- Coat Lapels & Inner Shirt -->
    <path d="M108 105 L120 130 L105 145 Z" fill="#60a5fa" />
    <path d="M112 103 L126 120" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Back Arm (Swinging Backward) -->
    <path d="M105 112 L85 135 L92 140 L112 120 Z" fill="#2563eb" />
    <!-- Hand back -->
    <circle cx="82" cy="142" r="5" fill="#fcd34d" />

    <!-- Front Arm (Swinging Forward balancing the long stride) -->
    <path d="M125 110 L145 130 L152 125 L132 105 Z" fill="#3b82f6" />
    <!-- Hand front -->
    <circle cx="148" cy="127" r="5" fill="#fcd34d" />

    <!-- Neck & Head (Determined, confident expression) -->
    <path d="M118 95 L124 105 L114 107 Z" fill="#fcd34d" />
    <!-- Head Circle -->
    <circle cx="125" cy="85" r="16" fill="#fcd34d" />
    <!-- Hair (Stylized modern sweep) -->
    <path d="M110 82 Q115 65 135 72 Q145 75 142 88 Q135 80 120 80 Z" fill="#0f172a" />
    <!-- Facial Features (Profile-ish forward looking) -->
    <!-- Confident Eye -->
    <path d="M132 82 Q136 84 133 87" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Determined Smile -->
    <path d="M133 91 Q137 93 140 91" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Cute Rosy Cheek -->
    <circle cx="130" cy="88" r="3" fill="#f87171" opacity="0.6" />

    <!-- Front Leg (The massive forward step / 迈) -->
    <!-- Pant leg front -->
    <path d="M125 130 L160 165 L175 160 L140 120 Z" fill="#1d4ed8" />
    <!-- Lower leg stretching forward -->
    <path d="M160 165 L188 178 L193 170 L168 157 Z" fill="#2563eb" />
    <!-- Stylish Shoe making contact/stepping forward -->
    <path d="M185 177 L212 181 L214 189 L180 187 Z" fill="#0f172a" />
    <!-- Shoe Sole Accent -->
    <path d="M185 187 L213 189 L212 191 L184 189 Z" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND ATMOSPHERE (Depth Elements) -->
  <!-- Floating light particles / dust catching the street lamp -->
  <circle cx="180" cy="90" r="1.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="160" cy="110" r="1" fill="#fbbf24" opacity="0.5" />
  <circle cx="210" cy="130" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="135" cy="65" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="90" cy="95" r="1" fill="#38bdf8" opacity="0.4" />
</svg>