<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative tech circles -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A313C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="55" fill="none" stroke="#2A313C" stroke-width="1"/>

  <!-- Central Physical Object: Modern Smartphone (Telecommunication Device) -->
  <!-- Phone Body Shadow -->
  <rect x="88" y="48" width="64" height="144" rx="12" fill="#0E1015"/>
  <!-- Phone Outer Frame -->
  <rect x="86" y="46" width="68" height="148" rx="14" fill="#343B48" stroke="#4A5568" stroke-width="2"/>
  <!-- Phone Screen -->
  <rect x="91" y="54" width="58" height="132" rx="8" fill="#12161F"/>

  <!-- Screen Content: Communication / Signal Waves -->
  <!-- Top speaker notch -->
  <rect x="110" y="50" width="20" height="3" rx="1.5" fill="#4A5568"/>

  <!-- Signal Emission Waves (Orange/Gold Accent) -->
  <path d="M 100 85 A 25 25 0 0 1 140 85" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 106 93 A 18 18 0 0 1 134 93" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 112 101 A 10 10 0 0 1 128 101" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="110" r="3" fill="#F59E0B"/>

  <!-- Data Grid / Nodes on screen -->
  <rect x="101" y="126" width="12" height="12" rx="3" fill="#2563EB"/>
  <rect x="127" y="126" width="12" height="12" rx="3" fill="#06B6D4"/>
  <rect x="101" y="144" width="12" height="12" rx="3" fill="#10B981"/>
  <rect x="127" y="144" width="12" height="12" rx="3" fill="#6366F1"/>
  
  <!-- Connection lines inside screen -->
  <line x1="113" y1="132" x2="127" y2="132" stroke="#4A5568" stroke-width="2"/>
  <line x1="113" y1="150" x2="127" y2="150" stroke="#4A5568" stroke-width="2"/>
  <line x1="120" y1="113" x2="120" y2="126" stroke="#F59E0B" stroke-width="2"/>

  <!-- External Communication Signals (Wi-Fi / Telecom Waves radiating outwards) -->
  <!-- Left Wave -->
  <path d="M 68 80 C 55 95 55 125 68 140" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 58 70 C 40 92 40 128 58 150" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Right Wave -->
  <path d="M 172 80 C 185 95 185 125 172 140" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 182 70 C 200 92 200 128 182 150" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating Data Nodes / Packets -->
  <circle cx="45" cy="110" r="4" fill="#06B6D4"/>
  <circle cx="195" cy="110" r="4" fill="#06B6D4"/>
  <circle cx="60" cy="165" r="3" fill="#F59E0B"/>
  <circle cx="180" cy="165" r="3" fill="#F59E0B"/>
</svg>