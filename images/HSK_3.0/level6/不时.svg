<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background Timeline / Progression Axis representing time flow -->
    <path d="M 40 120 L 200 120" stroke="#2A313C" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>
    
    <!-- Escalation / Intermittent recurrence markers (pulsing visual metaphor for "chốc chốc / thỉnh thoảng") -->
    <!-- Point 1 (Past) -->
    <circle cx="70" cy="120" r="6" fill="#384356"/>
    <circle cx="70" cy="120" r="12" fill="none" stroke="#384356" stroke-width="1.5" opacity="0.5"/>

    <!-- Point 2 (Active burst - Escalation step) -->
    <g transform="translate(120, 120)">
      <!-- Upward energy burst / sound wave metaphor from context "tiếng cười" -->
      <path d="M 0 0 L 0 -45" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-45" r="8" fill="#FF9F43"/>
      
      <!-- Concentric ripple waves representing intermittent recurring sounds/actions -->
      <path d="M -12 -35 C -20 -30, -20 -15, -12 -10" stroke="#FF9F43" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M 12 -35 C 20 -30, 20 -15, 12 -10" stroke="#FF9F43" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M -18 -45 C -28 -38, -28 -20, -18 -12" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
      <path d="M 18 -45 C 28 -38, 28 -20, 18 -12" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Point 3 (Future / Next occurrence) -->
    <circle cx="170" cy="120" r="6" fill="#384356"/>
    <circle cx="170" cy="120" r="12" fill="none" stroke="#384356" stroke-width="1.5" opacity="0.5"/>

    <!-- Secondary subtle recurrence indicator -->
    <g transform="translate(170, 120)">
      <path d="M 0 0 L 0 -25" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-25" r="5" fill="#546E7A"/>
    </g>

    <!-- Base anchor platform -->
    <path d="M 50 160 L 190 160" stroke="#2E3846" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Stepped progression blocks showing temporal intervals -->
    <rect x="62" y="145" width="16" height="15" rx="3" fill="#2E3846"/>
    <rect x="112" y="130" width="16" height="30" rx="3" fill="#FF9F43" opacity="0.85"/>
    <rect x="162" y="140" width="16" height="20" rx="3" fill="#2E3846"/>
  </g>
</svg>