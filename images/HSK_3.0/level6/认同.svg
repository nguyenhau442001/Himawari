<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Group representing consensus/agreement (认同) -->
  <g transform="translate(40, 60)">
    <!-- Person 1: Speaker/Presenter -->
    <g transform="translate(0, 20)">
      <circle cx="30" cy="30" r="12" fill="#FFB84D"/>
      <path d="M18 70 Q30 50 42 70 L42 110 L18 110 Z" fill="#FFB84D"/>
    </g>
    
    <!-- Person 2: Expert/Listener nodding in agreement -->
    <g transform="translate(100, 0)">
      <circle cx="30" cy="30" r="12" fill="#FFFFFF"/>
      <path d="M18 70 Q30 50 42 70 L42 110 L18 110 Z" fill="#FFFFFF"/>
      <!-- Nodding gesture/Head tilt -->
      <path d="M25 25 L35 35 M35 25 L25 35" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Person 3: Expert/Listener nodding in agreement -->
    <g transform="translate(140, 20)">
      <circle cx="30" cy="30" r="12" fill="#FFFFFF"/>
      <path d="M18 70 Q30 50 42 70 L42 110 L18 110 Z" fill="#FFFFFF"/>
      <!-- Nodding gesture/Head tilt -->
      <path d="M25 25 L35 35 M35 25 L25 35" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Shared Concept/Idea Board -->
    <rect x="70" y="20" width="40" height="30" rx="4" fill="#FFB84D"/>
    <path d="M75 30 L105 30 M75 40 L95 40" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>