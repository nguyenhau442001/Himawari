<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Recognition/Appreciation -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="window-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Certificate Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Spotlight & Window Light Beam -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />
  <polygon points="120,0 200,0 240,240 100,240" fill="url(#window-beam)" />

  <!-- BACKGROUND ENVIRONMENT: Office / Meeting Room -->
  <!-- Wall panels & Window Frame -->
  <path d="M0,170 L240,170" stroke="#334155" stroke-width="2" />
  <rect x="150" y="20" width="70" height="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="185" y1="20" x2="185" y2="120" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="70" x2="220" y2="70" stroke="#334155" stroke-width="2" />

  <!-- Plant on bookshelf/ledge -->
  <path d="M25,170 L45,170 L40,140 L30,140 Z" fill="#475569" />
  <circle cx="35" cy="130" r="12" fill="#10b981" />
  <circle cx="27" cy="135" r="8" fill="#059669" />
  <circle cx="43" cy="135" r="9" fill="#059669" />

  <!-- Office Desk -->
  <path d="M40,195 L200,195 L210,240 L30,240 Z" fill="#334155" />
  <rect x="35" y="185" width="170" height="10" rx="2" fill="#475569" />
  <!-- Laptop on Desk -->
  <path d="M70,185 L110,185 L115,168 L65,168 Z" fill="#64748b" />
  <path d="M55,185 L125,185 L130,188 L50,188 Z" fill="#94a3b8" />

  <!-- MID-GROUND: Colleagues Applauding (Left & Right background characters) -->
  <!-- Colleague 1 (Left background) -->
  <circle cx="55" cy="120" r="14" fill="#cbd5e1" />
  <path d="M40,160 C40,135 70,135 70,160 Z" fill="#0284c7" />
  <!-- Hands clapping for colleague 1 -->
  <circle cx="50" cy="140" r="4" fill="#fbcfe8" />
  <circle cx="60" cy="140" r="4" fill="#fbcfe8" />

  <!-- Colleague 2 (Right background) -->
  <circle cx="185" cy="125" r="14" fill="#cbd5e1" />
  <path d="M170,165 C170,140 200,140 200,165 Z" fill="#7c3aed" />
  <!-- Hands clapping for colleague 2 -->
  <circle cx="178" cy="145" r="4" fill="#fbcfe8" />
  <circle cx="192" cy="145" r="4" fill="#fbcfe8" />


  <!-- FOREGROUND / MAIN SUBJECT: THE RECOGNIZED INDIVIDUAL -->
  <g filter="url(#shadow)">
    <!-- Main Character Body & Suit -->
    <!-- Shoulders / Torso -->
    <path d="M90,210 C90,175 150,175 150,210 Z" fill="#0f172a" />
    <!-- Shirt collar & Tie -->
    <polygon points="120,172 112,185 128,185" fill="#f8fafc" />
    <polygon points="118,183 122,183 124,205 120,210 116,205" fill="#ef4444" />

    <!-- Neck & Head -->
    <rect x="113" y="160" width="14" height="15" fill="#ffd166" />
    <circle cx="120" cy="135" r="22" fill="#ffd166" />

    <!-- Hair (Modern styled dark hair) -->
    <path d="M98,130 C98,110 142,110 142,130 C142,135 140,140 138,140 C135,130 105,130 102,140 C100,140 98,135 98,130 Z" fill="#1e293b" />
    <path d="M100,130 C105,115 135,115 140,130 C138,122 130,118 120,118 C110,118 102,122 100,130 Z" fill="#1e293b" />

    <!-- Happy Confident Facial Expression -->
    <!-- Smiling Eyes -->
    <path d="M110,132 Q114,128 118,132" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M122,132 Q126,128 130,132" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Warm Confident Smile -->
    <path d="M114,142 Q120,148 126,142" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Blush) -->
    <circle cx="108" cy="140" r="4" fill="#f43f5e" opacity="0.4" />
    <circle cx="132" cy="140" r="4" fill="#f43f5e" opacity="0.4" />

    <!-- Raised Arms holding Achievement / Certificate proudly -->
    <!-- Left Arm holding certificate corner -->
    <path d="M95,180 L80,150 L95,145" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="95" cy="145" r="5" fill="#ffd166" />

    <!-- Right Arm holding certificate corner -->
    <path d="M145,180 L160,150 L145,145" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="145" cy="145" r="5" fill="#ffd166" />
  </g>

  <!-- THE CERTIFICATE / AWARD (Symbol of "Rènkě" / Recognition) -->
  <g filter="url(#shadow)" transform="translate(0, -5)">
    <!-- Certificate Board / Scroll -->
    <rect x="85" y="105" width="70" height="50" rx="4" fill="#f8fafc" stroke="url(#gold-grad)" stroke-width="3" />
    <!-- Gold Seal / Badge -->
    <circle cx="120" cy="135" r="10" fill="url(#gold-grad)" />
    <circle cx="120" cy="135" r="7" fill="#b45309" />
    <!-- Ribbon hanging from seal -->
    <polygon points="117,145 120,155 123,145" fill="#ef4444" />
    <!-- Abstract achievement lines (No real text) -->
    <line x1="95" y1="117" x2="145" y2="117" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="125" x2="140" y2="125" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- CELEBRATORY SPARKLES / APPROVAL STARS -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M75,90 L78,98 L86,100 L78,102 L75,110 L72,102 L64,100 L72,98 Z" />
    <!-- Star 2 -->
    <path d="M165,80 L167,85 L172,87 L167,89 L165,94 L163,89 L158,87 L163,85 Z" />
    <!-- Star 3 (Cyan accent for modern pop) -->
    <path d="M140,75 L142,80 L147,82 L142,84 L140,89 L138,84 L133,82 L138,80 Z" fill="#38bdf8" />
    <!-- Small confetti dots -->
    <circle cx="95" cy="80" r="2.5" fill="#10b981" />
    <circle cx="150" cy="100" r="2" fill="#ec4899" />
    <circle cx="60" cy="115" r="2" fill="#38bdf8" />
    <circle cx="180" cy="110" r="3" fill="#fb923c" />
  </g>

</svg>