<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ocean Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Island Sand Gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Water Reflection -->
    <linearGradient id="reflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Stars & Sky Details -->
  <circle cx="40" cy="35" r="1" fill="#cbd5e1" opacity="0.8" />
  <circle cx="75" cy="20" r="1.5" fill="#fef08a" opacity="0.9" />
  <circle cx="120" cy="30" r="1" fill="#cbd5e1" opacity="0.6" />
  <circle cx="180" cy="25" r="1.2" fill="#cbd5e1" opacity="0.7" />
  <circle cx="210" cy="45" r="1" fill="#fef08a" opacity="0.9" />

  <!-- Glowing Sunset / Rising Sun -->
  <circle cx="170" cy="70" r="35" fill="url(#sunGlow)" />
  <circle cx="170" cy="70" r="14" fill="#fbbf24" />

  <!-- Ocean Layer -->
  <path d="M 0,110 Q 60,102 120,110 T 240,110 L 240,240 L 0,240 Z" fill="url(#seaGrad)" />
  
  <!-- Gentle Waves -->
  <path d="M 0,125 Q 30,120 60,125 T 120,125 T 180,125 T 240,125" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <path d="M 0,140 Q 40,135 80,140 T 160,140 T 240,140" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Water Reflection of Sun -->
  <ellipse cx="170" cy="150" rx="15" ry="35" fill="url(#reflection)" />

  <!-- THE ISLAND (Central Subject: 岛) -->
  <!-- Island Base & Sand -->
  <path d="M 50,130 C 50,110 190,110 190,130 C 190,150 50,150 50,130 Z" fill="url(#sandGrad)" />
  <path d="M 60,130 C 70,118 170,118 180,130 C 160,145 80,145 60,130 Z" fill="#ca8a04" opacity="0.4" />

  <!-- Lush Tropical Vegetation (Green Hills on Island) -->
  <path d="M 80,130 Q 100,95 120,130 Z" fill="#10b981" />
  <path d="M 110,130 Q 135,85 160,130 Z" fill="#059669" />
  <path d="M 70,130 Q 85,105 105,130 Z" fill="#34d399" />

  <!-- Palm Tree Left -->
  <path d="M 85,128 Q 80,100 70,90" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" />
  <!-- Palm Leaves Left -->
  <path d="M 70,90 Q 55,80 50,95 Q 65,95 70,90 Z" fill="#10b981" />
  <path d="M 70,90 Q 60,70 75,75 Q 70,85 70,90 Z" fill="#059669" />
  <path d="M 70,90 Q 85,75 80,92 Q 73,90 70,90 Z" fill="#34d399" />

  <!-- Palm Tree Right -->
  <path d="M 145,128 Q 155,95 165,85" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" />
  <!-- Palm Leaves Right -->
  <path d="M 165,85 Q 185,80 185,95 Q 170,95 165,85 Z" fill="#10b981" />
  <path d="M 165,85 Q 180,65 165,75 Q 168,82 165,85 Z" fill="#059669" />
  <path d="M 165,85 Q 150,70 155,90 Q 160,88 165,85 Z" fill="#34d399" />

  <!-- Cozy Beach Hut / Bungalow on Island -->
  <polygon points="105,128 125,112 145,128" fill="#b45309" />
  <rect x="110" y="128" width="30" height="15" fill="#fef3c7" />
  <rect x="120" y="133" width="10" height="10" fill="#78350f" />

  <!-- Foreground Context: Characters on a boat admiring the island -->
  <!-- Wooden Boat -->
  <path d="M 60,185 L 180,185 C 195,185 200,205 185,205 L 55,205 C 40,205 45,185 60,185 Z" fill="#92400e" />
  <path d="M 62,187 L 178,187 C 188,187 192,202 178,202 L 62,202 C 48,202 52,187 62,187 Z" fill="#b45309" />
  <!-- Boat rim highlight -->
  <line x1="58" y1="185" x2="182" y2="185" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- Character 1 (Sitting, pointing excitedly) -->
  <!-- Body / Torso -->
  <path d="M 85,175 C 85,160 95,155 105,165 L 110,185 L 80,185 Z" fill="#ec4899" />
  <!-- Head -->
  <circle cx="95" cy="148" r="10" fill="#fbcfe8" />
  <!-- Hair -->
  <path d="M 85,145 C 85,138 105,138 105,145 C 105,142 95,140 85,145 Z" fill="#451a03" />
  <!-- Arm pointing towards island -->
  <path d="M 100,165 Q 120,155 130,150" fill="none" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" />

  <!-- Character 2 (Sitting, holding camera/binoculars) -->
  <!-- Body / Torso -->
  <path d="M 135,175 C 135,160 145,155 155,165 L 160,185 L 130,185 Z" fill="#38bdf8" />
  <!-- Head -->
  <circle cx="145" cy="148" r="10" fill="#fed7aa" />
  <!-- Hair -->
  <path d="M 135,145 Q 145,135 155,145 Z" fill="#1e293b" />
  <!-- Arms holding binoculars -->
  <path d="M 140,165 L 148,160 L 155,165" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" />
  <!-- Binoculars / Camera Prop -->
  <rect x="144" y="156" width="10" height="6" rx="2" fill="#334155" />

  <!-- Sparkles / Aesthetic UI Accents (app scene flavor) -->
  <path d="M 45,95 Q 50,90 55,95 Q 50,100 45,95 Z" fill="#fde047" opacity="0.9" />
  <path d="M 195,115 Q 200,110 205,115 Q 200,120 195,115 Z" fill="#38bdf8" opacity="0.9" />
  <circle cx="115" cy="80" r="1.5" fill="#fef08a" />
  <circle cx="135" cy="75" r="2" fill="#fef08a" />

  <!-- Foreground Water Ripples around Boat -->
  <path d="M 40,210 Q 55,206 70,210" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M 170,212 Q 185,208 200,212" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
</svg>