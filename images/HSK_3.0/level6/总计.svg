<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for depth -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.6"/>
  <circle cx="120" cy="120" r="95" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 8" fill="none"/>
  
  <!-- Central Physical Object: A sleek modern calculator / financial ledger device representing "总计" (Total/Sum) -->
  <g transform="translate(65, 45)">
    <!-- Main Device Body -->
    <rect x="0" y="0" width="110" height="150" rx="16" fill="#283044" stroke="#3A445C" stroke-width="2"/>
    
    <!-- Screen Area -->
    <rect x="12" y="16" width="86" height="38" rx="8" fill="#141820"/>
    
    <!-- Glowing Total Result Text Representation (Abstract clean digital segments/bars) -->
    <rect x="22" y="26" width="12" height="18" rx="3" fill="#F59E0B"/>
    <rect x="38" y="26" width="12" height="18" rx="3" fill="#F59E0B"/>
    <rect x="54" y="26" width="12" height="18" rx="3" fill="#F59E0B"/>
    <circle cx="78" cy="40" r="3" fill="#F59E0B"/>
    <rect x="84" y="32" width="6" height="12" rx="2" fill="#F59E0B"/>
    
    <!-- Keypad Grid (Representing data input and accumulation) -->
    <!-- Row 1 -->
    <rect x="16" y="68" width="18" height="14" rx="4" fill="#364156"/>
    <rect x="42" y="68" width="18" height="14" rx="4" fill="#364156"/>
    <rect x="68" y="68" width="26" height="14" rx="4" fill="#3A445C"/>
    
    <!-- Row 2 -->
    <rect x="16" y="90" width="18" height="14" rx="4" fill="#364156"/>
    <rect x="42" y="90" width="18" height="14" rx="4" fill="#364156"/>
    <rect x="68" y="90" width="26" height="14" rx="4" fill="#3A445C"/>
    
    <!-- Row 3 (The Grand Total '=' Key highlighted in Gold/Orange) -->
    <rect x="16" y="112" width="18" height="22" rx="4" fill="#364156"/>
    <rect x="42" y="112" width="18" height="22" rx="4" fill="#364156"/>
    <rect x="68" y="112" width="26" height="22" rx="6" fill="#F59E0B"/>
    <!-- Equals sign on the total button -->
    <rect x="75" y="119" width="12" height="3" rx="1.5" fill="#1A1D24"/>
    <rect x="75" y="125" width="12" height="3" rx="1.5" fill="#1A1D24"/>
  </g>

  <!-- Floating Coins / Accumulation Elements (symbolizing collected funds/donations) -->
  <g transform="translate(0, 0)">
    <!-- Top-left coin -->
    <circle cx="48" cy="72" r="12" fill="#F59E0B"/>
    <circle cx="48" cy="72" r="8" fill="#D97706"/>
    <path d="M48 66v12M42 72h12" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bottom-right coin pile indicator -->
    <circle cx="192" cy="168" r="16" fill="#F59E0B"/>
    <circle cx="192" cy="168" r="11" fill="#D97706"/>
    <path d="M192 160v16M184 168h16" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Small accent sparkle -->
    <path d="M185 60l3-6 3 6 6 3-6 3-3 6-3-6-6-3z" fill="#38BDF8" opacity="0.8"/>
  </g>
</svg>