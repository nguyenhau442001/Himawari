<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Soil base -->
  <path d="M40 180 C 40 170, 200 170, 200 180 L 200 200 L 40 200 Z" fill="#3E2723"/>
  
  <!-- Crops (Zhuangjia) -->
  <!-- Left stalk -->
  <path d="M70 180 L 70 100" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 100 L 60 90 M70 105 L 80 95" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="70" cy="120" rx="6" ry="10" fill="#FFC107"/>
  
  <!-- Center stalk (tall) -->
  <path d="M120 180 L 120 80" stroke="#FFC107" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 80 L 110 70 M120 85 L 130 75" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="120" cy="100" rx="8" ry="14" fill="#FFC107"/>
  <ellipse cx="120" cy="130" rx="8" ry="14" fill="#FFC107"/>
  
  <!-- Right stalk -->
  <path d="M170 180 L 170 110" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 110 L 160 100 M170 115 L 180 105" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="170" cy="130" rx="6" ry="10" fill="#FFC107"/>
  
  <!-- Raindrops -->
  <path d="M80 40 Q 80 50 85 55 Q 90 50 90 40 Z" fill="#4FC3F7" opacity="0.6"/>
  <path d="M130 30 Q 130 40 135 45 Q 140 40 140 30 Z" fill="#4FC3F7" opacity="0.8"/>
  <path d="M180 50 Q 180 60 185 65 Q 190 60 190 50 Z" fill="#4FC3F7" opacity="0.7"/>
</svg>