<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Coffee cup representing the object of the action -->
  <g transform="translate(120, 120)">
    <path d="M-30 20 L30 20 L25 80 L-25 80 Z" fill="#FFB347"/>
    <path d="M-35 20 L35 20 A5 5 0 0 1 35 30 L-35 30 A5 5 0 0 1 -35 20" fill="#FFA000"/>
    <path d="M25 35 L45 35 A15 15 0 0 1 45 65 L25 65" fill="none" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Visual representation of "frequency/count" using distinct tally marks -->
  <g stroke="#E0E0E0" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="160" x2="60" y2="200"/>
    <line x1="90" y1="160" x2="90" y2="200"/>
    <line x1="120" y1="160" x2="120" y2="200"/>
    <line x1="150" y1="160" x2="150" y2="200"/>
    <line x1="180" y1="160" x2="180" y2="200"/>
  </g>
  
  <!-- Accent highlight for the concept of 'count' -->
  <circle cx="120" cy="180" r="8" fill="#FFB347"/>
</svg>