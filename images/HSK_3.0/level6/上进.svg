<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>

    <!-- Character & Stair Gradient (Energetic Orange/Gold) -->
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <!-- Ambient Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Ambient Glow behind the upward path -->
  <path d="M70,180 L170,80 L170,180 Z" fill="#FF8A00" opacity="0.05" filter="url(#glow)"/>

  <!-- Decorative Grid / Horizon Lines for Modern UI aesthetic -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="192" x2="190" y2="192" stroke="#222632" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Conceptual Object: Ascending Staircase -->
  <g id="staircase">
    <!-- Step 1 -->
    <path d="M60,180 L90,180 L90,165 L60,165 Z" fill="#2E3648"/>
    <path d="M60,165 L90,165 L90,162 L60,162 Z" fill="#404B63"/>

    <!-- Step 2 -->
    <path d="M90,180 L120,180 L120,145 L90,145 Z" fill="#2E3648"/>
    <path d="M90,145 L120,145 L120,142 L90,142 Z" fill="#404B63"/>

    <!-- Step 3 -->
    <path d="M120,180 L150,180 L120,125 Z" fill="none"/> <!-- spacer anchor -->
    <path d="M120,180 L150,180 L150,125 L120,125 Z" fill="#2E3648"/>
    <path d="M120,125 L150,125 L150,122 L120,122 Z" fill="#404B63"/>

    <!-- Step 4 (Highest) -->
    <path d="M150,180 L180,180 L180,105 L150,105 Z" fill="#353F54"/>
    <path d="M150,105 L180,105 L180,102 L150,102 Z" fill="#4A5773"/>
  </g>

  <!-- Glowing Arrow / Progress Path -->
  <g filter="url(#subtle-glow)">
    <path d="M 75,165 Q 110,165 110,142 T 140,122 T 165,102" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
  </g>

  <!-- Focal Character / Object Representing "Cầu tiến" (Ambitious person moving up) -->
  <g id="character" transform="translate(0, -2)">
    <!-- Character Shadow on Step -->
    <ellipse cx="165" cy="106" rx="8" ry="3" fill="#111318" opacity="0.6"/>

    <!-- Body / Torso (Dynamic leaning forward) -->
    <path d="M160,102 L168,85 L175,93 L170,102 Z" fill="url(#gold-grad)"/>

    <!-- Head -->
    <circle cx="171" cy="74" r="7" fill="url(#gold-grad)"/>

    <!-- Action Lines / Motion (Trailing behind the climber) -->
    <path d="M155,115 L148,118" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M158,128 L150,132" stroke="#FF8A00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Reaching Arm -->
    <path d="M168,88 L182,80" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Legs in motion -->
    <path d="M163,102 L156,105" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M168,102 L174,105" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Destination Star / Pinnacle Achievement Icon -->
  <g id="summit-star" transform="translate(165, 55)" filter="url(#glow)">
    <path d="M0,-10 L2.5,-3 L9,-3 L3.5,1 L5.5,8 L0,4 L-5.5,8 L-3.5,1 L-9,-3 L-2.5,-3 Z" fill="#FFD600"/>
  </g>
  <!-- Small floating accent particles -->
  <circle cx="150" cy="65" r="1.5" fill="#FFD600" opacity="0.8"/>
  <circle cx="182" cy="70" r="1" fill="#FF8A00" opacity="0.6"/>
  <circle cx="135" cy="95" r="1.5" fill="#FFD600" opacity="0.4"/>
</svg>