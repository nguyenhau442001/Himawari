<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background Elements (Open grassland & horizon) -->
  <path d="M0 160 Q 60 145, 120 155 T 240 150 L 240 240 L 0 240 Z" fill="#222A35"/>
  <path d="M0 180 Q 80 170, 160 175 T 240 170 L 240 240 L 0 240 Z" fill="#1E2530"/>

  <!-- Motion lines / Speed trails -->
  <g opacity="0.4">
    <line x1="20" y1="130" x2="80" y2="130" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 15"/>
    <line x1="10" y1="150" x2="90" y2="150" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="25 15"/>
    <line x1="30" y1="170" x2="110" y2="170" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 10"/>
  </g>

  <!-- Majestic Horse Galloping (representing 奔跑 - bēnpǎo) -->
  <g transform="translate(30, 45)">
    <!-- Dynamic Dust / Ground particles -->
    <circle cx="20" cy="115" r="3" fill="#3A4454"/>
    <circle cx="35" cy="120" r="2" fill="#3A4454"/>
    <path d="M15 110 Q 30 115, 45 105" stroke="#3A4454" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Flowing Tail -->
    <path d="M120 45 Q 140 55, 155 75 Q 140 70, 125 60 Z" fill="#D97706"/>

    <!-- Hind Legs (Extended back) -->
    <path d="M110 75 L 140 100 L 155 95" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M100 70 L 80 110 L 65 105" stroke="#D97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Horse Body (Torso) -->
    <path d="M70 50 C 90 40, 110 50, 120 70 C 125 80, 110 90, 95 85 C 80 80, 65 70, 70 50 Z" fill="#F59E0B"/>

    <!-- Forelegs (Extended forward dynamically) -->
    <path d="M80 75 L 45 95 L 30 85" stroke="#D97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M75 70 L 60 115 L 75 120" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Neck & Head -->
    <path d="M75 55 L 55 30 L 40 32 L 60 60 Z" fill="#F59E0B"/>
    <!-- Head / Muzzle -->
    <path d="M45 28 L 30 22 L 35 32 Z" fill="#D97706"/>
    <!-- Mane -->
    <path d="M70 45 Q 60 35, 50 38" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60 40 Q 52 28, 42 30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Accent forward motion flash -->
  <path d="M185 100 L 210 100" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <path d="M195 90 L 225 90" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <path d="M190 110 L 215 110" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
</svg>