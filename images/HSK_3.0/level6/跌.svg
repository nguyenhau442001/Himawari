<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Monitor Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Red downward trend gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient lighting / window reflection -->
  <path d="M 0 0 L 120 0 L 0 120 Z" fill="#ffffff" opacity="0.02"/>

  <!-- Interior Background Elements -->
  <!-- Bookshelf / Wall details -->
  <rect x="20" y="30" width="40" height="6" rx="3" fill="#334155" opacity="0.4"/>
  <rect x="70" y="24" width="25" height="12" rx="2" fill="#475569" opacity="0.3"/>
  <rect x="100" y="20" width="18" height="16" rx="2" fill="#38bdf8" opacity="0.2"/>

  <!-- Wall Clock -->
  <circle cx="205" cy="45" r="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="205" y1="45" x2="205" y2="37" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="205" y1="45" x2="212" y2="48" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Desk Surface -->
  <path d="M 10 180 L 230 180 L 235 220 L 5 220 Z" fill="#0f172a"/>
  <rect x="10" y="176" width="220" height="6" rx="3" fill="#334155"/>

  <!-- Desk Lamp -->
  <circle cx="195" cy="115" r="40" fill="url(#lampGlow)"/>
  <path d="M 195 176 L 195 140 L 180 125 L 205 125 Z" fill="#475569"/>
  <ellipse cx="192" cy="125" rx="16" ry="6" fill="#f8fafc"/>

  <!-- Computer Setup (Main Context for Stock Drop) -->
  <!-- Monitor Stand -->
  <rect x="100" y="155" width="20" height="21" fill="#334155"/>
  <ellipse cx="110" cy="176" rx="25" ry="4" fill="#475569"/>
  
  <!-- Monitor Outer Frame -->
  <rect x="45" y="65" width="130" height="95" rx="8" fill="#334155"/>
  <!-- Monitor Inner Screen -->
  <rect x="49" y="69" width="122" height="87" rx="5" fill="url(#screenGrad)"/>

  <!-- UI Elements on Screen: Stock Chart Showing Dramatic Fall -->
  <!-- Grid lines -->
  <line x1="59" y1="90" x2="161" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="59" y1="115" x2="161" y2="115" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="59" y1="140" x2="161" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Drop Area Fill -->
  <polygon points="59,85 75,90 95,98 115,95 135,135 155,142 155,150 59,150" fill="url(#dropGrad)"/>

  <!-- Stock Trend Line (Sudden Drop) -->
  <polyline points="59,85 75,90 95,98 115,95 135,135 155,142" 
            fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trend Data Points -->
  <circle cx="135" cy="135" r="3" fill="#ef4444"/>
  <circle cx="155" cy="142" r="3.5" fill="#ef4444"/>

  <!-- Downward Arrow Icon on Screen -->
  <path d="M 145 95 L 153 105 L 137 105 Z" fill="#ef4444"/>
  <rect x="143" y="87" width="4" height="10" fill="#ef4444"/>

  <!-- Coffee Mug -->
  <rect x="25" y="152" width="14" height="18" rx="3" fill="#f1f5f9"/>
  <path d="M 39 156 C 44 156 44 166 39 166" stroke="#f1f5f9" stroke-width="2" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M 29 146 Q 31 142 29 138" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Character (Shocked/Surprised expression experiencing the market drop) -->
  <!-- Chair back -->
  <path d="M 90 180 L 95 110 C 95 105 100 100 105 100 L 115 100 C 120 100 125 105 125 110 L 130 180 Z" fill="#334155" opacity="0.6"/>

  <!-- Character Body / Shoulders -->
  <path d="M 75 185 C 75 160 85 150 105 150 L 125 150 C 145 150 155 160 155 185 Z" fill="url(#shirtGrad)"/>

  <!-- Character Neck -->
  <rect x="103" y="136" width="14" height="18" fill="#fcd34d"/>

  <!-- Character Head -->
  <circle cx="110" cy="120" r="20" fill="#fcd34d"/>

  <!-- Hair Style -->
  <path d="M 90 120 C 90 105 100 98 112 98 C 124 98 130 108 130 120 C 127 116 122 112 110 112 C 98 112 93 116 90 120 Z" fill="#1e293b"/>

  <!-- Expressive Face (Shocked: wide eyes, open mouth) -->
  <!-- Eyes (Wide open with fear/surprise) -->
  <circle cx="103" cy="118" r="4.5" fill="#ffffff"/>
  <circle cx="117" cy="118" r="4.5" fill="#ffffff"/>
  <circle cx="104" cy="118" r="2" fill="#0f172a"/>
  <circle cx="116" cy="118" r="2" fill="#0f172a"/>

  <!-- Eyebrows (Arched high in shock) -->
  <path d="M 98 110 Q 103 107 108 111" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 112 111 Q 117 107 122 110" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Open Shocked Mouth (O shape) -->
  <ellipse cx="110" cy="128" rx="3.5" ry="5" fill="#0f172a"/>

  <!-- Sweat Drop (Classic cartoon detail for stress/panic) -->
  <path d="M 125 112 C 125 112 129 118 129 121 C 129 123.2 127.2 125 125 125 C 122.8 125 121 123.2 121 121 C 121 118 125 112 125 112 Z" fill="#38bdf8"/>

  <!-- Hands / Arms reacting in shock near face/desk -->
  <!-- Left arm -->
  <path d="M 78 165 C 70 155 75 140 85 135" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="86" cy="133" r="5" fill="#fcd34d"/>

  <!-- Right arm holding head -->
  <path d="M 142 165 C 150 150 135 125 120 122" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="118" cy="122" r="5" fill="#fcd34d"/>

  <!-- Foreground Atmospheric Particles (Subtle financial sparks/dust) -->
  <circle cx="170" cy="80" r="1.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="160" cy="65" r="2" fill="#ef4444" opacity="0.6"/>
  <circle cx="180" cy="95" r="1" fill="#ef4444" opacity="0.5"/>
</svg>