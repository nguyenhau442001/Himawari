<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "国情" (National Conditions / State of the Nation) -->
  <!-- Combining a stylized geographic contour map/terrain with overlapping essential infrastructure pillars (economy, people, resources) in a sleek flat modern vector design. -->

  <!-- Subtle grid/coordinate background lines for structure -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="40" y1="60" x2="200" y2="60"/>
    <line x1="40" y1="120" x2="200" y2="120"/>
    <line x1="40" y1="180" x2="200" y2="180"/>
    <line x1="60" y1="40" x2="60" y2="200"/>
    <line x1="120" y1="40" x2="120" y2="200"/>
    <line x1="180" y1="40" x2="180" y2="200"/>
  </g>

  <!-- Central Geographic Silhouette / Map Base (representing the physical country) -->
  <path d="M 75 145 C 65 130 70 100 90 90 C 110 80 130 95 150 90 C 170 85 185 115 175 140 C 165 165 130 180 95 170 C 80 165 80 155 75 145 Z" fill="#222B38" stroke="#3A4D6B" stroke-width="2"/>

  <!-- Layer 1: Natural Topography / Environment (Mountains & Rivers) -->
  <path d="M 85 140 L 105 110 L 125 140 Z" fill="#2E4057"/>
  <path d="M 115 130 L 135 95 L 160 135 Z" fill="#354A66"/>
  <path d="M 95 140 C 110 155 130 150 155 135" fill="none" stroke="#4C72B0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Layer 2: Socio-Economic Infrastructure & Pillars (Gold/Orange Accent for Focus) -->
  <!-- Industrial / Economic Pillar -->
  <rect x="95" y="115" width="12" height="35" rx="2" fill="#E5A93B"/>
  <polygon points="90,115 101,102 112,115" fill="#F4C458"/>

  <!-- Population / Human Resource Pillar -->
  <circle cx="132" cy="115" r="7" fill="#E5A93B"/>
  <path d="M 122 135 C 122 127 127 125 132 125 C 137 125 142 127 142 135 Z" fill="#E5A93B"/>

  <!-- Technological / Modernization Pillar -->
  <rect x="150" y="105" width="10" height="45" rx="2" fill="#F4C458"/>
  <circle cx="155" cy="98" r="4" fill="#FFFFFF"/>
  <line x1="155" y1="94" x2="155" y2="88" stroke="#F4C458" stroke-width="2"/>

  <!-- Interconnecting Data Nodes / Holistic System Grid -->
  <circle cx="101" cy="102" r="3" fill="#FFFFFF"/>
  <circle cx="132" cy="125" r="3" fill="#FFFFFF"/>
  <circle cx="155" cy="105" r="3" fill="#FFFFFF"/>
  
  <line x1="101" y1="102" x2="132" y2="125" stroke="#E5A93B" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="132" y1="125" x2="155" y2="105" stroke="#E5A93B" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Foreground Base Ring / Anchor representing the solid foundation of "Basic National Conditions" -->
  <ellipse cx="120" cy="175" rx="65" ry="16" fill="none" stroke="#E5A93B" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="120" cy="175" rx="55" ry="12" fill="none" stroke="#3A4D6B" stroke-width="1.5"/>

  <!-- Accent indicator dots on the base ring -->
  <circle cx="120" cy="159" r="3" fill="#E5A93B"/>
  <circle cx="65" cy="175" r="2.5" fill="#4C72B0"/>
  <circle cx="175" cy="175" r="2.5" fill="#4C72B0"/>
</svg>