<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark mode container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative atmosphere representing spring rain and fertile ground -->
  <g opacity="0.3">
    <!-- Gentle rain streaks -->
    <line x1="60" y1="30" x2="50" y2="60" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="180" y1="40" x2="170" y2="70" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="120" y1="20" x2="110" y2="50" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Central Visual Representation for "肥" (Noun/Object/Place context: fertile black earth / rich soil) -->
  <g transform="translate(0, 15)">
    <!-- Deep Rich Black Earth Base (黑土地) -->
    <path d="M 40 130 Q 120 115 200 130 L 210 185 Q 120 205 30 185 Z" fill="#2D231E"/>
    <!-- Top Fertile Layer with rich dark brown-black tone -->
    <path d="M 35 130 Q 120 110 205 130 Q 220 145 210 155 Q 120 145 30 155 Q 20 145 35 130 Z" fill="#3D3028"/>

    <!-- Organic Soil Texture details (Nutrient-rich clumps) -->
    <ellipse cx="80" cy="140" rx="12" ry="5" fill="#241B17"/>
    <ellipse cx="150" cy="145" rx="15" ry="6" fill="#241B17"/>
    <ellipse cx="115" cy="135" rx="8" ry="4" fill="#241B17"/>

    <!-- Moisture/Shine highlights on the fertile soil (湿润) -->
    <path d="M 65 138 Q 75 136 85 138" stroke="#634B3E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 135 142 Q 145 140 155 142" stroke="#634B3E" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Vibrant Sprout signifying fertility, life, and growth (Màu mỡ) -->
    <!-- Stem -->
    <path d="M 120 130 Q 118 95 105 80" stroke="#10B981" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Left Leaf (lush and healthy) -->
    <path d="M 113 105 C 95 100 80 110 75 125 C 90 125 105 118 113 105 Z" fill="#34D399"/>
    <!-- Right Leaf (lush and healthy) -->
    <path d="M 115 95 C 135 85 150 95 155 110 C 140 115 125 110 115 95 Z" fill="#059669"/>
    <!-- Top budding leaf -->
    <path d="M 105 80 C 100 65 110 55 120 50 C 120 65 112 75 105 80 Z" fill="#34D399"/>

    <!-- Golden Accent / Nutrient Glow (Focus on fertility/richness) -->
    <circle cx="120" cy="165" r="3" fill="#FBBF24" opacity="0.8"/>
    <circle cx="85" cy="175" r="2" fill="#FBBF24" opacity="0.6"/>
    <circle cx="160" cy="170" r="2.5" fill="#FBBF24" opacity="0.7"/>
    <path d="M 100 160 Q 120 155 140 160" stroke="#FBBF24" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
</svg>