<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Wood Logs Group -->
  <g transform="translate(45, 85)">
    <!-- Log 1 (Back Right) -->
    <path d="M40 20 L120 20 L120 50 L40 50 Z" fill="#4E342E"/>
    <ellipse cx="120" cy="35" rx="12" ry="15" fill="#5D4037"/>
    <ellipse cx="40" cy="35" rx="12" ry="15" fill="#8D6E63"/>
    <circle cx="40" cy="35" r="8" fill="none" stroke="#5D4037" stroke-width="1.5" opacity="0.6"/>
    <circle cx="40" cy="35" r="4" fill="none" stroke="#5D4037" stroke-width="1" opacity="0.6"/>

    <!-- Log 2 (Back Left) -->
    <path d="M20 50 L100 50 L100 80 L20 80 Z" fill="#4E342E"/>
    <ellipse cx="100" cy="65" rx="12" ry="15" fill="#5D4037"/>
    <ellipse cx="20" cy="65" rx="12" ry="15" fill="#8D6E63"/>
    <circle cx="20" cy="65" r="8" fill="none" stroke="#5D4037" stroke-width="1.5" opacity="0.6"/>
    <circle cx="20" cy="65" r="4" fill="none" stroke="#5D4037" stroke-width="1" opacity="0.6"/>

    <!-- Log 3 (Front Center) -->
    <path d="M50 65 L130 65 L130 95 L50 95 Z" fill="#5D4037"/>
    <ellipse cx="130" cy="80" rx="12" ry="15" fill="#6D4C41"/>
    <ellipse cx="50" cy="80" rx="12" ry="15" fill="#A1887F"/>
    <circle cx="50" cy="80" r="8" fill="none" stroke="#6D4C41" stroke-width="1.5" opacity="0.6"/>
    <circle cx="50" cy="80" r="4" fill="none" stroke="#6D4C41" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Metal Ingots Group -->
  <g transform="translate(115, 145)">
    <!-- Ingot 1 (Bottom) -->
    <path d="M10 30 L70 30 L80 55 L0 55 Z" fill="#E65100"/>
    <path d="M10 30 L70 30 L65 20 L15 20 Z" fill="#FFB74D"/>
    <path d="M70 30 L80 55 L75 45 L65 20 Z" fill="#FB8C00"/>
    
    <!-- Ingot 2 (Top) -->
    <path d="M25 10 L65 10 L72 28 L18 28 Z" fill="#EF6C00"/>
    <path d="M25 10 L65 10 L62 2 L28 2 Z" fill="#FFCC80"/>
    <path d="M65 10 L72 28 L69 20 L62 2 Z" fill="#FFA726"/>
    
    <!-- Shine/Glint -->
    <circle cx="35" cy="8" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="20" cy="40" r="2" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Steel Beam/Plate (Bottom Left) -->
  <g transform="translate(40, 175)">
    <rect width="60" height="8" fill="#455A64"/>
    <rect y="12" width="60" height="8" fill="#455A64"/>
    <rect y="6" width="60" height="2" fill="#37474F"/>
    <rect y="18" width="60" height="2" fill="#37474F"/>
  </g>
</svg>