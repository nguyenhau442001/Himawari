<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road -->
  <rect x="0" y="160" width="240" height="40" fill="#2D3436"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#4A5568" stroke-width="2" stroke-dasharray="10,10"/>
  
  <!-- Bus Body -->
  <path d="M50 160 L190 160 L195 130 L185 110 L55 110 L45 130 Z" fill="#F39C12"/>
  
  <!-- Windows -->
  <rect x="60" y="115" width="25" height="25" fill="#1A1D24" rx="2"/>
