  <rect x="120" y="115" width="25" height="25" fill="#1A1D24" rx="2"/>
  <rect x="150" y="115" width="25" height="25" fill="#1A1D24" rx="2"/>
  
  <!-- Windshield -->
  <path d="M50 130 L55 115 L70 115 L70 145 L50 145 Z" fill="#34495E"/>
  
  <!-- Wheels -->
  <circle cx="75" cy="170" r="12" fill="#2D3436" stroke="#F39C12" stroke-width="3"/>
  <circle cx="165" cy="170" r="12" fill="#2D3436" stroke="#F39C12" stroke-width="3"/>
  
  <!-- Decorative stripe -->
