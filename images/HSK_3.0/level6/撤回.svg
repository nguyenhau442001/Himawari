<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow to focus on center object -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Smartphone / Device Frame representing messaging context -->
  <g transform="translate(65, 30)">
    <!-- Phone body -->
    <rect x="0" y="0" width="110" height="180" rx="16" fill="#2D333B" stroke="#4A5568" stroke-width="2"/>
    <!-- Screen area -->
    <rect x="8" y="14" width="94" height="152" rx="8" fill="#161B22"/>

    <!-- Chat Bubbles -->
    <!-- Older message (normal) -->
    <rect x="16" y="26" width="60" height="24" rx="6" fill="#30363D"/>
    <rect x="22" y="34" width="35" height="4" rx="2" fill="#8B949E"/>
    <rect x="22" y="42" width="20" height="4" rx="2" fill="#8B949E"/>

    <!-- Sent mistaken message (Target of "撤回") -->
    <!-- Faded/Retracting effect with dashed outline or distinctive warning style -->
    <g transform="translate(14, 64)">
      <!-- Background bubble being recalled -->
      <rect x="0" y="0" width="80" height="32" rx="8" fill="#D29922" fill-opacity="0.15" stroke="#D29922" stroke-width="1.5" stroke-dasharray="3 2"/>
      <rect x="10" y="10" width="45" height="4" rx="2" fill="#F0B732"/>
      <rect x="10" y="18" width="25" height="4" rx="2" fill="#F0B732" opacity="0.7"/>
    </g>
  </g>

  <!-- Central Physical Object / Action Symbol: The Retrieval / Recall Arrow & Message Object -->
  <g transform="translate(120, 120)">
    <!-- Pulsing action circle container -->
    <circle cx="0" cy="0" r="38" fill="#1F242C" stroke="#D29922" stroke-width="2.5"/>

    <!-- Dynamic Curved Retraction Arrow (Visualizing "pulling back") -->
    <path d="M 14 10 C 14 18, 6 22, -2 22 C -12 22, -20 14, -20 4 C -20 -6, -12 -14, -2 -14 C 4 -14, 9 -11, 13 -7" 
          fill="none" stroke="#F0B732" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Arrowhead pointing backward along the curve -->
    <path d="M 8 -15 L 14 -7 L 5 -5" fill="none" stroke="#F0B732" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating retracted message fragment -->
    <rect x="-8" y="-5" width="16" height="12" rx="3" fill="#D29922"/>
  </g>
</svg>