<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Before state (Chaotic, convoluted, heavy, low contrast) -->
    <g transform="translate(30, 45)">
      <!-- Background card for 'Before' -->
      <rect x="0" y="0" width="75" height="110" rx="12" fill="#222630" stroke="#2F3542" stroke-width="1.5"/>
      <text x="37.5" y="18" fill="#747D8C" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">BEFORE</text>
      
      <!-- Tangled messy path/algorithm lines -->
      <path d="M 15 45 Q 30 25 45 55 T 60 75 T 30 95" fill="none" stroke="#FF4757" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 60 40 Q 45 60 20 65 T 50 90" fill="none" stroke="#FFA502" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
      
      <!-- Cluttered nodes -->
      <circle cx="20" cy="45" r="4" fill="#FF4757"/>
      <circle cx="55" cy="55" r="5" fill="#FF4757"/>
      <circle cx="35" cy="80" r="4.5" fill="#FF4757"/>
      <circle cx="60" cy="90" r="3.5" fill="#FF4757"/>
      
      <!-- Heavy/Slow indicator badge -->
      <rect x="18" y="96" width="39" height="10" rx="3" fill="#3A252A"/>
      <circle cx="24" cy="101" r="2.5" fill="#FF4757"/>
      <rect x="29" y="99" width="22" height="3" rx="1.5" fill="#FF4757" opacity="0.6"/>
    </g>

    <!-- Transition / Optimization Arrow with dynamic energy -->
    <g transform="translate(112, 85)">
      <path d="M 0 15 L 16 15 M 10 9 L 16 15 L 10 21" fill="none" stroke="#FFA502" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="15" r="14" fill="none" stroke="#FFA502" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
    </g>

    <!-- After state (Streamlined, precise, fast, optimized - Adjective visual contrast) -->
    <g transform="translate(135, 45)">
      <!-- Background card for 'After' with glowing accent -->
      <rect x="0" y="0" width="75" height="110" rx="12" fill="#222630" stroke="#FFA502" stroke-width="2"/>
      <text x="37.5" y="18" fill="#FFA502" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">OPTIMIZED</text>
      
      <!-- Clean, sleek, direct path/algorithm -->
      <path d="M 18 45 L 37 45 L 37 75 L 57 75" fill="none" stroke="#2ED573" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Precise aligned nodes -->
      <circle cx="18" cy="45" r="5" fill="#2ED573"/>
      <circle cx="37" cy="60" r="4" fill="#2ED573"/>
      <circle cx="57" cy="75" r="6" fill="#2ED573"/>
      
      <!-- Speed/Efficiency sparkle accents -->
      <path d="M 52 32 L 54 36 L 58 38 L 54 40 L 52 44 L 50 40 L 46 38 L 50 36 Z" fill="#FFA502" opacity="0.9"/>
      <path d="M 22 80 L 23 82 L 25 83 L 23 84 L 22 86 L 21 84 L 19 83 L 21 82 Z" fill="#FFA502" opacity="0.7"/>

      <!-- Fast/Efficient indicator badge -->
      <rect x="18" y="96" width="39" height="10" rx="3" fill="#1D382B"/>
      <circle cx="24" cy="101" r="2.5" fill="#2ED573"/>
      <rect x="29" y="99" width="22" height="3" rx="1.5" fill="#2ED573"/>
    </g>

    <!-- Contextual UI/System Graphic Foundation Below -->
    <g transform="translate(30, 168)">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#222630" stroke="#2F3542" stroke-width="1"/>
      <!-- Server / Core system nodes represented cleanly -->
      <circle cx="22" cy="16" r="6" fill="#3742FA"/>
      <rect x="36" y="13" width="55" height="6" rx="3" fill="#747D8C" opacity="0.5"/>
      
      <!-- Performance metrics: Before vs After bars -->
      <!-- Low bar -->
      <rect x="105" y="10" width="30" height="4" rx="2" fill="#FF4757" opacity="0.8"/>
      <!-- High optimized bar -->
      <rect x="105" y="18" width="60" height="4" rx="2" fill="#2ED573"/>
    </g>
  </g>
</svg>