<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/particles for festivity context -->
  <circle cx="120" cy="120" r="70" fill="#FF5722" opacity="0.06"/>
  <circle cx="70" cy="80" r="2" fill="#FFD700" opacity="0.4"/>
  <circle cx="170" cy="70" r="1.5" fill="#FFD700" opacity="0.5"/>
  <circle cx="180" cy="160" r="2" fill="#FFD700" opacity="0.3"/>
  <circle cx="60" cy="150" r="1.5" fill="#FFD700" opacity="0.4"/>

  <!-- Central Object: Candy (糖果) -->
  <g transform="translate(120, 120)">
    
    <!-- Left Wrapper Twist -->
    <path d="M -25 0 L -65 -22 L -50 0 L -65 22 Z" fill="#E64A19"/>
    <path d="M -25 0 L -55 -15 L -40 0 L -55 15 Z" fill="#FF7043"/>

    <!-- Right Wrapper Twist -->
    <path d="M 25 0 L 65 -22 L 50 0 L 65 22 Z" fill="#E64A19"/>
    <path d="M 25 0 L 55 -15 L 40 0 L 55 15 Z" fill="#FF7043"/>

    <!-- Main Candy Body (Round / Spherical wrapped candy or classic striped oval) -->
    <!-- Shadow for depth -->
    <ellipse cx="0" cy="35" rx="32" ry="8" fill="#0D0F12" opacity="0.4"/>

    <!-- Candy Base (Golden/Orange festive theme) -->
    <circle cx="0" cy="0" r="35" fill="#FF8F00"/>
    
    <!-- Candy Swirl / Highlight Details -->
    <path d="M -22 -15 C -10 -28 15 -25 25 -10 C 15 -5 -10 0 -22 -15 Z" fill="#FFC107"/>
    <path d="M -28 10 C -15 25 15 20 28 5 C 18 10 -5 18 -28 10 Z" fill="#FFC107"/>
    
    <!-- Glossy Highlight -->
    <path d="M -20 -18 C -10 -28 5 -28 15 -22 C 5 -25 -10 -20 -20 -18 Z" fill="#FFFFFF" opacity="0.6" stroke-linecap="round"/>
    
    <!-- Decorative Wrapper Ends (Ribbon details) -->
    <path d="M -25 -8 C -28 -3 -28 3 -25 8" stroke="#FFC107" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 25 -8 C 28 -3 28 3 25 8" stroke="#FFC107" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
  </g>
</svg>