<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Glow from Desk Lamp -->
  <circle cx="150" cy="110" r="80" fill="#3b82f6" opacity="0.1"/>
  <circle cx="100" cy="150" r="70" fill="#f59e0b" opacity="0.08"/>

  <!-- Interior Wall & Window Background -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b"/>
  <!-- Window Showing Night City / Future Growth -->
  <path d="M 160 35 L 205 35 L 205 95 L 160 95 Z" fill="#0f172a"/>
  <!-- City Skyline Silhouette through Window -->
  <path d="M 165 95 L 165 75 L 173 75 L 173 95 L 178 95 L 178 60 L 186 60 L 186 95 L 193 95 L 193 70 L 200 70 L 200 95 Z" fill="#334155" opacity="0.5"/>
  <!-- Window Frame Lines -->
  <path d="M 160 35 L 205 35 L 205 95 L 160 95 Z" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="182" y1="35" x2="182" y2="95" stroke="#475569" stroke-width="1.5"/>
  <line x1="160" y1="65" x2="205" y2="65" stroke="#475569" stroke-width="1.5"/>

  <!-- Bookshelf / Plant Prop -->
  <rect x="30" y="45" width="40" height="8" rx="2" fill="#334155"/>
  <path d="M 38 45 L 38 35 C 38 32 42 32 42 35 L 42 45 Z" fill="#10b981"/> <!-- Small plant leaf -->
  <path d="M 45 45 L 45 33 C 45 30 50 30 50 33 L 50 45 Z" fill="#059669"/>

  <!-- Wooden Desk Surface -->
  <path d="M 15 170 L 225 170 L 215 210 L 25 210 Z" fill="#334155"/>
  <path d="M 15 170 L 225 170 L 225 174 L 15 174 Z" fill="#475569"/>

  <!-- Desk Items: Laptop with Financial Growth Chart -->
  <path d="M 75 140 L 135 140 L 145 170 L 65 170 Z" fill="#64748b"/>
  <!-- Laptop Screen -->
  <rect x="78" y="102" width="54" height="39" rx="3" fill="#0f172a"/>
  <!-- Chart Line on Screen (Education Fund Growth & Graduation Icon representation) -->
  <path d="M 85 130 L 98 120 L 110 124 L 125 108" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Graduation Cap Icon on Screen representing 'Education' -->
  <path d="M 100 112 L 105 110 L 110 112 L 105 114 Z" fill="#fbbf24"/>
  <path d="M 102 113.5 L 102 116 C 102 117 108 117 108 116 L 108 113.5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Piggy Bank / Fund Jar Prop with Gold Coins -->
  <ellipse cx="175" cy="155" rx="16" ry="14" fill="#f59e0b"/>
  <path d="M 167 143 C 167 138 183 138 183 143" fill="none" stroke="#d97706" stroke-width="2"/>
  <circle cx="173" cy="153" r="2" fill="#78350f"/>
  <!-- Coin slot & coin going in -->
  <line x1="171" y1="142" x2="179" y2="142" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="175" cy="134" r="4" fill="#fbbf24"/>

  <!-- Desk Lamp -->
  <path d="M 140 170 L 145 140 L 150 140 L 155 170 Z" fill="#475569"/>
  <path d="M 147 140 L 135 105 L 155 105 Z" fill="#3b82f6"/>
  <path d="M 130 95 L 160 95 L 150 105 L 140 105 Z" fill="#60a5fa"/>

  <!-- Main Character (Father / Investor smiling, looking at laptop & fund) -->
  <!-- Torso & Shirt -->
  <path d="M 60 210 L 60 175 C 60 160 85 160 85 175 L 85 210 Z" fill="#3b82f6"/>
  <path d="M 62 175 L 83 175 L 72.5 190 Z" fill="#ffffff"/> <!-- Collar -->

  <!-- Neck & Head -->
  <rect x="67" y="152" width="11" height="15" fill="#fbcfe8"/>
  <circle cx="72.5" cy="142" r="16" fill="#fbcfe8"/>
  
  <!-- Hair (Neat, modern dark hair) -->
  <path d="M 57 140 C 57 127 88 127 88 140 C 88 144 85 142 83 138 C 78 132 67 132 62 138 C 59 142 57 144 57 140 Z" fill="#1e293b"/>

  <!-- Face Details -->
  <!-- Friendly Smiling Eyes -->
  <path d="M 65 140 Q 68 136 71 140" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 74 140 Q 77 136 80 140" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Gentle Smile -->
  <path d="M 69 147 Q 72.5 151 76 147" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="66" cy="145" r="2.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="79" cy="145" r="2.5" fill="#f43f5e" opacity="0.4"/>

  <!-- Active Arms / Hands interacting -->
  <!-- Right Arm (Clicking/Working) -->
  <path d="M 83 175 L 98 165 L 90 155" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="89" cy="154" r="5" fill="#fbcfe8"/> <!-- Hand -->

  <!-- Left Arm (Resting on lap/desk) -->
  <path d="M 62 175 L 50 190 L 60 198" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="61" cy="200" r="5" fill="#fbcfe8"/>

  <!-- Floating Visual Metaphor: Secure Educational Investment Sparkles -->
  <g transform="translate(110, 80)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2"/>
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(145, 60)">
    <circle cx="0" cy="0" r="10" fill="#34d399" opacity="0.2"/>
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#34d399"/>
  </g>

</svg>