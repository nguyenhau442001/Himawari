<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ground line -->
  <line x1="60" y1="185" x2="180" y2="185" stroke="#323846" stroke-width="3" stroke-linecap="round"/>

  <!-- Vertical motion / directional hint lines -->
  <g stroke="#FFA726" stroke-width="2" stroke-dasharray="4 4" opacity="0.4" stroke-linecap="round">
    <line x1="95" y1="130" x2="95" y2="70"/>
    <line x1="145" y1="130" x2="145" y2="70"/>
  </g>

  <!-- Upward directional arrows indicating "dựng đứng" (vertical positioning) -->
  <g fill="#FFA726" opacity="0.8">
    <polygon points="120,48 114,60 126,60"/>
    <line x1="120" y1="60" x2="120" y2="85" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ladder object representing the physical object being made vertical (bật thang / cái thang) -->
  <g transform="translate(100, 55)">
    <!-- Left rail -->
    <rect x="0" y="0" width="8" height="130" rx="4" fill="#4FC3F7"/>
    <!-- Right rail -->
    <rect x="32" y="0" width="8" height="130" rx="4" fill="#4FC3F7"/>
    <!-- Rungs -->
    <rect x="8" y="20" width="24" height="6" rx="3" fill="#B3E5FC"/>
    <rect x="8" y="45" width="24" height="6" rx="3" fill="#B3E5FC"/>
    <rect x="8" y="70" width="24" height="6" rx="3" fill="#B3E5FC"/>
    <rect x="8" y="95" width="24" height="6" rx="3" fill="#B3E5FC"/>
  </g>

  <!-- Base shadow/contact point for grounding the physical object -->
  <ellipse cx="120" cy="185" rx="22" ry="4" fill="#111318" opacity="0.6"/>
</svg>