<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow from Hospital Desk Lamp -->
  <circle cx="120" cy="110" r="70" fill="#253245" opacity="0.4"/>

  <!-- Background Wall & Window hinting at Night/New Year Eve -->
  <path d="M40 50 H200 V170 H40 Z" fill="#212630"/>
  <!-- Window silhouette showing night sky and subtle moon/stars -->
  <rect x="160" y="65" width="30" height="45" rx="4" fill="#15181E"/>
  <circle cx="175" cy="80" r="6" fill="#F1F5F9" opacity="0.15"/>

  <!-- Desk Surface -->
  <path d="M30 170 H210 L220 200 H20 Z" fill="#2D3748"/>
  <path d="M30 170 H210 V174 H30 Z" fill="#4A5568"/>

  <!-- Computer Monitor showing vital signs / medical shift tracker -->
  <rect x="75" y="90" width="90" height="60" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <path d="M85 110 H125 M85 125 H105" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- EKG Waveform on screen -->
  <path d="M130 120 L135 120 L138 110 L142 130 L145 115 L148 125 L152 120 L165 120" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor Stand -->
  <path d="M115 150 H125 V165 H115 Z" fill="#64748B"/>
  <path d="M100 165 H140 V168 H100 Z" fill="#64748B"/>

  <!-- Desk Lamp on the side -->
  <path d="M50 170 L55 130 H65 L70 170 Z" fill="#475569"/>
  <path d="M48 125 C48 115 62 115 62 125 Z" fill="#F59E0B"/>
  <path d="M50 128 L60 160" stroke="#FBBF24" stroke-width="8" opacity="0.15"/>

  <!-- Medical Character: Doctor on Night Shift (值班) -->
  <!-- Body/Scrubs (Dark Teal / Navy Blue for medical professional) -->
  <path d="M95 150 Q120 140 145 150 L155 195 H85 Z" fill="#0EA5E9"/>
  
  <!-- White Lab Coat / Uniform Overcoat -->
  <path d="M92 148 L105 195 H80 L88 155 Z" fill="#F8FAFC"/>
  <path d="M148 148 L135 195 H160 L152 155 Z" fill="#F8FAFC"/>
  
  <!-- Stethoscope around neck -->
  <path d="M110 132 C105 135 105 145 112 150 C118 154 122 154 128 150 C135 145 135 135 130 132" stroke="#94A3B8" stroke-width="2.5" fill="none"/>
  <circle cx="120" cy="156" r="3" fill="#94A3B8"/>

  <!-- Head & Face (Focused, dedicated expression) -->
  <circle cx="120" cy="118" r="16" fill="#FBCFE8"/>
  <path d="M104 116 C104 106 136 106 136 116 C136 122 104 122 104 116 Z" fill="#334155"/> <!-- Hair -->

  <!-- Medical Scrub Cap (Blue) -->
  <path d="M104 114 C104 102 136 102 136 114 Z" fill="#0284C7"/>

  <!-- Focused Eyes & Glasses -->
  <rect x="111" y="114" width="7" height="4" rx="1" fill="#334155"/>
  <rect x="122" y="114" width="7" height="4" rx="1" fill="#334155"/>
  <line x1="118" y1="116" x2="122" y2="116" stroke="#334155" stroke-width="1.5"/>

  <!-- Hands actively working / writing or resting on desk -->
  <circle cx="102" cy="170" r="5" fill="#FBCFE8"/>
  <circle cx="138" cy="170" r="5" fill="#FBCFE8"/>

  <!-- Subtle Clock on desk/wall showing late hours (e.g. 00:00) -->
  <circle cx="195" cy="120" r="12" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <line x1="195" y1="113" x2="195" y2="120" stroke="#F1F5F9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="195" y1="120" x2="201" y2="120" stroke="#F1F5F9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Focal Accent: Warm desk light pool on hands and paperwork -->
  <ellipse cx="120" cy="172" rx="45" ry="10" fill="#FBBF24" opacity="0.12"/>
</svg>