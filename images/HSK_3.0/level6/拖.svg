<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Floor Surface -->
  <rect x="20" y="180" width="200" height="40" fill="#2D343E" rx="4"/>
  
  <!-- Mop Handle -->
  <rect x="140" y="60" width="6" height="120" fill="#F39C12" rx="2"/>
  
  <!-- Mop Head (Dragging action) -->
  <path d="M100 170 L180 170 L170 195 L90 195 Z" fill="#BDC3C7"/>
  
  <!-- Motion lines indicating dragging -->
  <path d="M70 180 L50 180" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 190 L40 190" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Person's hands holding the mop -->
  <circle cx="143" cy="90" r="8" fill="#E67E22"/>
  <circle cx="143" cy="110" r="8" fill="#E67E22"/>
  
  <!-- Simple silhouette of person (upper body) -->
  <path d="M150 50 C160 30 180 30 190 50 L190 80 L150 80 Z" fill="#3498DB"/>
</svg>