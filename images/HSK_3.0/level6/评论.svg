<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Notification Pop Gradient -->
    <linearGradient id="pop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow for device screen -->
  <circle cx="120" cy="115" r="80" fill="url(#screen-glow)" />

  <!-- Background Environment: Cozy room desk setting -->
  <!-- Desk surface -->
  <path d="M 20 200 L 220 200 L 230 225 L 10 225 Z" fill="#090d16" />
  <!-- Desk rim light -->
  <path d="M 20 200 L 220 200" stroke="#334155" stroke-width="1.5" />

  <!-- Background Plant on Desk -->
  <path d="M 35 200 C 35 180 45 175 45 165 C 45 175 55 180 55 200 Z" fill="#059669" />
  <ellipse cx="45" cy="165" rx="3" ry="8" fill="#10b981" />
  <path d="M 40 200 L 50 200 L 48 185 L 42 185 Z" fill="#64748b" />

  <!-- Coffee Mug -->
  <rect x="185" y="178" width="16" height="22" rx="3" fill="#cbd5e1" />
  <path d="M 201 184 C 208 184 208 194 201 194" stroke="#cbd5e1" stroke-width="2.5" fill="none" />
  <path d="M 188 178 C 193 175 198 175 201 178 Z" fill="#94a3b8" />

  <!-- MAIN OBJECT: Smartphone / Tablet with Article -->
  <!-- Phone body / stand -->
  <rect x="75" y="65" width="90" height="120" rx="12" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <!-- Screen Area -->
  <rect x="81" y="73" width="78" height="104" rx="6" fill="#1e293b" />

  <!-- Article Content on Screen -->
  <!-- Article Header bar -->
  <rect x="90" y="83" width="45" height="6" rx="3" fill="#f59e0b" />
  <!-- Article text lines -->
  <rect x="90" y="96" width="60" height="4" rx="2" fill="#64748b" />
  <rect x="90" y="104" width="50" height="4" rx="2" fill="#64748b" />
  <rect x="90" y="112" width="55" height="4" rx="2" fill="#64748b" />

  <!-- Divider line -->
  <line x1="90" y1="124" x2="150" y2="124" stroke="#334155" stroke-width="1.5" />

  <!-- FLOOD OF COMMENTS / NOTIFICATION BUBBLES (Visualizing "引起了很多评论" / Causing many comments) -->
  
  <!-- Comment Bubble 1 (Top Left) -->
  <g transform="translate(42, 70)">
    <rect x="0" y="0" width="36" height="24" rx="6" fill="url(#pop-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="12" cy="12" r="3" fill="#38bdf8" />
    <rect x="18" y="10" width="12" height="3" rx="1.5" fill="#e2e8f0" />
    <!-- Tail -->
    <path d="M 25 24 L 28 30 L 31 24 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Comment Bubble 2 (Top Right - Heart/Love comment) -->
  <g transform="translate(162, 58)">
    <rect x="0" y="0" width="38" height="26" rx="6" fill="url(#pop-grad)" stroke="#ec4899" stroke-width="1.5" />
    <path d="M 12 14 C 10 11 10 8 13 8 C 15 8 16 10 16 10 C 16 10 17 8 19 8 C 22 8 22 11 20 14 L 16 17 Z" fill="#ec4899" />
    <rect x="22" y="11" width="10" height="3" rx="1.5" fill="#e2e8f0" />
    <!-- Tail -->
    <path d="M 10 26 L 8 32 L 14 26 Z" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
  </g>

  <!-- Comment Bubble 3 (Mid Right - Fire/Hot comment) -->
  <g transform="translate(170, 110)">
    <rect x="0" y="0" width="40" height="26" rx="6" fill="url(#pop-grad)" stroke="#fb923c" stroke-width="1.5" />
    <path d="M 11 16 C 9 14 9 11 12 9 C 12 12 14 13 15 11 C 15 14 17 16 15 18 C 13 20 12 18 11 16 Z" fill="#fb923c" />
    <rect x="20" y="11" width="14" height="3" rx="1.5" fill="#e2e8f0" />
    <!-- Tail -->
    <path d="M 8 12 L 2 9 L 8 6 Z" fill="#1e293b" stroke="#fb923c" stroke-width="1" />
  </g>

  <!-- Comment Bubble 4 (Lower Left - Thumb up comment) -->
  <g transform="translate(30, 125)">
    <rect x="0" y="0" width="42" height="26" rx="6" fill="url(#pop-grad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="14" cy="13" r="5" fill="#10b981" />
    <path d="M 12 15 L 12 11 L 16 12 L 15 14 Z" fill="#0f172a" />
    <rect x="22" y="11" width="14" height="3" rx="1.5" fill="#e2e8f0" />
    <!-- Tail -->
    <path d="M 34 26 L 38 31 L 30 26 Z" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  </g>

  <!-- Comment Bubble 5 (Floating top center-right) -->
  <g transform="translate(130, 32)">
    <rect x="0" y="0" width="34" height="22" rx="5" fill="url(#pop-grad)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="10" cy="11" r="3" fill="#a855f7" />
    <rect x="16" y="9.5" width="12" height="3" rx="1.5" fill="#e2e8f0" />
    <!-- Tail -->
    <path d="M 10 22 L 7 27 L 14 22 Z" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
  </g>

  <!-- CHARACTER: Surprised / Engaged user reacting to the comments -->
  <!-- Character Head & Shoulders popping up from bottom or side -->
  <!-- Let's place an expressive character on the left leaning in -->
  <g transform="translate(15, 115)">
    <!-- Shoulders / Hoodie -->
    <path d="M -10 85 C -10 60 20 50 40 50 C 60 50 90 60 90 85 Z" fill="#3b82f6" />
    <path d="M 15 52 C 25 55 35 55 45 52 L 40 75 L 20 75 Z" fill="#60a5fa" /> <!-- Collar/Hood -->

    <!-- Neck -->
    <rect x="28" y="38" width="24" height="20" rx="6" fill="#fbcfe8" />

    <!-- Head -->
    <ellipse cx="40" cy="30" rx="22" ry="25" fill="#fbcfe8" />

    <!-- Hair (Stylized modern dark hair) -->
    <path d="M 18 25 C 18 10 30 5 42 6 C 56 7 62 18 62 30 C 62 30 62 33 60 33 C 58 33 58 28 55 22 C 50 12 35 12 25 18 C 21 21 18 25 18 25 Z" fill="#1e293b" />

    <!-- Facial Expression: Wide eyes, open mouth of surprise/excitement -->
    <!-- Eyebrows raised -->
    <path d="M 26 18 Q 31 15 36 18" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 44 18 Q 49 15 54 18" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Eyes (Big, expressive) -->
    <circle cx="31" cy="24" r="3.5" fill="#0f172a" />
    <circle cx="49" cy="24" r="3.5" fill="#0f172a" />
    <circle cx="32" cy="23" r="1" fill="#ffffff" />
    <circle cx="50" cy="23" r="1" fill="#ffffff" />

    <!-- Cheeks (Excited blush) -->
    <ellipse cx="28" cy="31" rx="4" ry="2" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="52" cy="31" rx="4" ry="2" fill="#f43f5e" opacity="0.4" />

    <!-- Open surprised/happy mouth -->
    <path d="M 37 36 C 37 40 43 40 43 36 Z" fill="#0f172a" />
  </g>

  <!-- Interactive Sparkles / Notification indicator on screen -->
  <circle cx="120" cy="150" r="16" fill="#f59e0b" opacity="0.2" />
  <circle cx="120" cy="150" r="10" fill="#f59e0b" opacity="0.4" />
  <!-- Notification Counter Badge -->
  <circle cx="120" cy="150" r="7" fill="#ef4444" />
  <path d="M 117 150 L 123 150 M 120 147 L 120 153" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

</svg>