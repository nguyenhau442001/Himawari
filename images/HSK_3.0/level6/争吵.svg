<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Left Character -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-40" r="25" fill="#FF9F1C"/>
    <path d="M-15 -35 L-5 -35 M5 -35 L15 -35" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -20 Q0 -10 10 -20" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-20 0 L-40 40 L-20 40 L-10 10" fill="#FF9F1C"/>
    <path d="M-10 10 L0 40 L20 40 L10 10" fill="#FF9F1C"/>
  </g>

  <!-- Right Character -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="-40" r="25" fill="#FFD700"/>
    <path d="M-15 -35 L-5 -35 M5 -35 L15 -35" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -20 Q0 -10 10 -20" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M20 0 L40 40 L20 40 L10 10" fill="#FFD700"/>
    <path d="M10 10 L0 40 L-20 40 L-10 10" fill="#FFD700"/>
  </g>

  <!-- Visual representation of conflict (Exclamation marks) -->
  <g transform="translate(120, 80)">
    <path d="M0 -20 L0 10 M0 20 L0 25" stroke="#FF4D4D" stroke-width="6" stroke-linecap="round"/>
    <path d="M-20 -20 L-20 10 M-20 20 L-20 25" stroke="#FF4D4D" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 -20 L20 10 M20 20 L20 25" stroke="#FF4D4D" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>