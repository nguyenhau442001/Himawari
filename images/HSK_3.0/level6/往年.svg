<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow & Past Years Timeline Representation -->
  <g opacity="0.35" transform="translate(0, 10)">
    <!-- Faded older calendar / timeline silhouettes moving into the past -->
    <rect x="40" y="70" width="48" height="56" rx="6" fill="#2E3544"/>
    <rect x="52" y="62" width="24" height="10" rx="3" fill="#3A4456"/>
    <circle cx="56" cy="92" r="3" fill="#4E5D78"/>
    <circle cx="68" cy="92" r="3" fill="#4E5D78"/>
    <circle cx="80" cy="92" r="3" fill="#4E5D78"/>
    <circle cx="56" cy="106" r="3" fill="#4E5D78"/>
    <circle cx="68" cy="106" r="3" fill="#4E5D78"/>

    <rect x="96" y="60" width="48" height="56" rx="6" fill="#363F52"/>
    <rect x="108" y="52" width="24" height="10" rx="3" fill="#48556D"/>
    <circle cx="112" cy="82" r="3" fill="#64779A"/>
    <circle cx="124" cy="82" r="3" fill="#64779A"/>
    <circle cx="136" cy="82" r="3" fill="#64779A"/>
    <circle cx="112" cy="96" r="3" fill="#64779A"/>
    <circle cx="124" cy="96" r="3" fill="#64779A"/>
    <circle cx="136" cy="96" r="3" fill="#64779A"/>

    <!-- Connecting dashed timeline path pointing backward -->
    <path d="M 120 135 C 100 135, 75 130, 60 120" fill="none" stroke="#48556D" stroke-width="2.5" stroke-dasharray="4 4"/>
    <path d="M 64 114 L 56 122 L 68 124" fill="none" stroke="#48556D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Iconic Object: Main Detailed Historical Calendar / Past Year Record -->
  <g transform="translate(0, 5)">
    <!-- Calendar Shadow -->
    <rect x="74" y="54" width="92" height="112" rx="12" fill="#0E1015"/>

    <!-- Calendar Base -->
    <rect x="70" y="48" width="92" height="112" rx="12" fill="#252D3D"/>

    <!-- Header Banner (Past / Historical Theme) -->
    <path d="M 70 60 C 70 53.3726 75.3726 48 82 48 L 150 48 C 156.627 48 162 53.3726 162 60 L 162 84 L 70 84 Z" fill="#E67E22"/>

    <!-- Binding Rings -->
    <rect x="92" y="38" width="8" height="18" rx="4" fill="#8899A6"/>
    <rect x="140" y="38" width="8" height="18" rx="4" fill="#8899A6"/>

    <!-- Clock / History Icon on Header Banner -->
    <circle cx="116" cy="66" r="10" fill="#FFFFFF" opacity="0.2"/>
    <polyline points="116,60 116,66 121,66" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Calendar Grid / Past Days (Muted to signify previous years) -->
    <g transform="translate(84, 98)">
      <!-- Week 1 -->
      <rect x="0" y="0" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="16" y="0" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="32" y="0" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="48" y="0" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="64" y="0" width="10" height="10" rx="3" fill="#3A4456"/>

      <!-- Week 2 -->
      <rect x="0" y="18" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="16" y="18" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="32" y="18" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="48" y="18" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="64" y="18" width="10" height="10" rx="3" fill="#3A4456"/>

      <!-- Week 3 -->
      <rect x="0" y="36" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="16" y="36" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="32" y="36" width="10" height="10" rx="3" fill="#E67E22" opacity="0.8"/> <!-- Highlighted past timeframe marker -->
      <rect x="48" y="36" width="10" height="10" rx="3" fill="#3A4456"/>
      <rect x="64" y="36" width="10" height="10" rx="3" fill="#3A4456"/>
    </g>
  </g>

  <!-- Sleek Accent Retrograde Arrow (Indicating looking back into previous years) -->
  <g transform="translate(0, 0)">
    <path d="M 155 165 C 175 145, 175 105, 155 85" fill="none" stroke="#F1C40F" stroke-width="4" stroke-linecap="round"/>
    <!-- Arrowhead pointing backwards/left -->
    <path d="M 145 155 L 155 165 L 167 158" fill="none" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle Spark / Focus Star -->
  <path d="M 55 55 L 58 64 L 67 67 L 58 70 L 55 79 L 52 70 L 43 67 L 52 64 Z" fill="#F1C40F" opacity="0.9"/>
</svg>