<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow/accents for focus -->
  <circle cx="120" cy="120" r="70" fill="#2A313C" opacity="0.4"/>

  <!-- Back Card (Fan effect for depth) -->
  <g transform="rotate(-15, 120, 120)">
    <rect x="85" y="65" width="70" height="95" rx="8" fill="#3B4252" stroke="#4C566A" stroke-width="2"/>
    <!-- Abstract design on back card -->
    <rect x="97" y="80" width="46" height="8" rx="4" fill="#4C566A"/>
    <circle cx="120" cy="120" r="14" fill="#4C566A"/>
  </g>

  <!-- Middle Card (Colorful flashcard reference) -->
  <g transform="rotate(8, 120, 120)">
    <rect x="83" y="62" width="74" height="100" rx="8" fill="#2E3440" stroke="#D08770" stroke-width="2"/>
    <!-- Flashcard inner area -->
    <rect x="91" y="70" width="58" height="60" rx="4" fill="#3B4252"/>
    <!-- Symbolic character illustration on flashcard (stylized tree/learning symbol) -->
    <path d="M120 85 L110 105 L130 105 Z" fill="#A3BE8C"/>
    <rect x="117" y="105" width="6" height="12" fill="#D08770"/>
    <!-- Card text lines placeholder -->
    <rect x="95" y="140" width="40" height="6" rx="3" fill="#D08770" opacity="0.8"/>
    <rect x="105" y="150" width="20" height="4" rx="2" fill="#4C566A"/>
  </g>

  <!-- Foreground Main Card (Crisp, iconic focus) -->
  <g>
    <!-- Card Shadow -->
    <rect x="79" y="68" width="82" height="110" rx="10" fill="#111317" opacity="0.6"/>
    <!-- Main Card Body -->
    <rect x="77" y="65" width="82" height="110" rx="10" fill="#ECEFF4" stroke="#D08770" stroke-width="3"/>
    
    <!-- Top accent header on the card -->
    <path d="M 77 75 A 10 10 0 0 1 87 65 L 149 65 A 10 10 0 0 1 159 75 L 159 88 L 77 88 Z" fill="#EBCB8B"/>

    <!-- Educational graphic/icon on the card face -->
    <circle cx="118" cy="118" r="18" fill="#88C0D0" opacity="0.2"/>
    <!-- Star/Sparkle icon representing learning/flashcard -->
    <path d="M118 100 L121.5 111.5 L133 115 L121.5 118.5 L118 130 L114.5 118.5 L103 115 L114.5 111.5 Z" fill="#5E81AC"/>

    <!-- Bottom content lines representing text on card -->
    <rect x="92" y="145" width="52" height="6" rx="3" fill="#4C566A"/>
    <rect x="92" y="157" width="34" height="5" rx="2.5" fill="#999999"/>

    <!-- Highlight accent corner fold or tag -->
    <path d="M 147 65 L 159 77 L 159 65 Z" fill="#D08770" opacity="0.7"/>
  </g>

  <!-- Sparkles / Educational focus elements -->
  <path d="M 60 90 L 63 97 L 70 100 L 63 103 L 60 110 L 57 103 L 50 100 L 57 97 Z" fill="#EBCB8B" opacity="0.8"/>
  <path d="M 185 130 L 187 135 L 192 137 L 187 139 L 185 144 L 183 139 L 178 137 L 183 135 Z" fill="#EBCB8B" opacity="0.6"/>
</svg>