<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow / Background Details -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>
  <path d="M 60 170 L 180 170" stroke="#323846" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Motion lines indicating the "start" / stepping forward action -->
  <g opacity="0.6">
    <path d="M 60 145 C 75 130, 95 130, 110 145" fill="none" stroke="#FFA116" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5"/>
    <path d="M 85 115 C 100 100, 120 100, 135 115" fill="none" stroke="#FFA116" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arrow tip for motion -->
    <path d="M 130 112 L 136 115 L 131 120" fill="none" stroke="#FFA116" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ground Line -->
  <path d="M 50 170 L 190 170" stroke="#4F5D73" stroke-width="3" stroke-linecap="round"/>

  <!-- Starting block / Threshold element (Visualizing "Beginning / 开头") -->
  <rect x="75" y="162" width="25" height="8" rx="2" fill="#FFA116"/>
  <path d="M 80 162 L 80 155 L 95 155 L 95 162" fill="none" stroke="#FFA116" stroke-width="2"/>

  <!-- Human Character (Dynamic Action - Stepping forward into the beginning) -->
  <g>
    <!-- Back Leg (stationary/pushing off) -->
    <path d="M 95 140 L 85 170" stroke="#8A99AD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso -->
    <path d="M 100 115 L 95 145" stroke="#4DA3FF" stroke-width="8" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="103" cy="98" r="9" fill="#FFD166"/>

    <!-- Front Leg (Stepping forward / First step - "迈出第一步") -->
    <path d="M 95 145 L 125 155 L 135 170" fill="none" stroke="#4DA3FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Shoe / Foot stepping over the start -->
    <path d="M 128 170 L 142 170" stroke="#FFA116" stroke-width="4" stroke-linecap="round"/>

    <!-- Arms (Swinging with action) -->
    <!-- Back arm -->
    <path d="M 98 120 L 80 135" fill="none" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round"/>
    <!-- Front arm -->
    <path d="M 102 120 L 122 130" fill="none" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Destination / Horizon marker (Success ahead) -->
  <circle cx="180" cy="115" r="4" fill="#06D6A0" opacity="0.8"/>
  <circle cx="180" cy="115" r="8" fill="none" stroke="#06D6A0" stroke-width="1.5" opacity="0.4"/>
  <path d="M 175 140 L 185 140" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 180 135 L 180 145" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Subtle accent dots/particles for modern flat UI feel -->
  <circle cx="150" cy="85" r="2" fill="#FFA116" opacity="0.7"/>
  <circle cx="65" cy="100" r="1.5" fill="#4DA3FF" opacity="0.5"/>
</svg>