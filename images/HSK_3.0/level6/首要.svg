<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Glow filter for the primary element -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Shield Icon Symbol -->
    <g id="shield">
      <path d="M0 -12 L10 -7 V3 C10 10 4 15 0 17 C-4 15 -10 10 -10 3 V-7 Z" />
    </g>
  </defs>

  <!-- Background decorative concentric rings representing priority waves -->
  <circle cx="120" cy="115" r="75" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="120" cy="115" r="55" fill="none" stroke="#2A2F3D" stroke-width="1.5" opacity="0.8"/>

  <!-- Secondary/Background Elements (Smaller, less important factors) -->
  <!-- Top Left Secondary Factor -->
  <g transform="translate(70, 75) scale(0.6)" opacity="0.4">
    <circle cx="0" cy="0" r="18" fill="#2E364F"/>
    <path d="M-6 -2 h12 M-6 4 h8" stroke="#8A99AD" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Right Secondary Factor -->
  <g transform="translate(170, 145) scale(0.5)" opacity="0.4">
    <circle cx="0" cy="0" r="18" fill="#2E364F"/>
    <path d="M-6 -2 h12 M-6 4 h8" stroke="#8A99AD" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Left Secondary Factor -->
  <g transform="translate(75, 155) scale(0.55)" opacity="0.4">
    <circle cx="0" cy="0" r="18" fill="#2E364F"/>
    <path d="M-6 -2 h12 M-6 4 h8" stroke="#8A99AD" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Connecting dashed priority lines pointing to the center -->
  <path d="M 83 85 L 100 100" stroke="#3A445C" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 155 135 L 138 120" stroke="#3A445C" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 88 145 L 105 125" stroke="#3A445C" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- PRIMARY ELEMENT (Scale exaggerated, vibrant color, glowing) -->
  <!-- Outer pulse ring -->
  <circle cx="120" cy="115" r="38" fill="#FF9F0A" opacity="0.15"/>
  
  <!-- Main focal node background -->
  <circle cx="120" cy="115" r="30" fill="#1A1D24" stroke="#FF9F0A" stroke-width="3" filter="url(#glow)"/>

  <!-- Central Security/Priority Icon (Shield + Checkmark) -->
  <g transform="translate(120, 113) scale(1.6)">
    <!-- Shield Base -->
    <path d="M0 -14 L12 -8 V3 C12 11 5 17 0 20 C-5 17 -12 11 -12 3 V-8 Z" fill="#FF9F0A"/>
    <!-- Shield Inner Dark Area -->
    <path d="M0 -11 L9 -6 V3 C9 9 4 14 0 16 C-4 14 -9 9 -9 3 V-6 Z" fill="#1A1D24"/>
    <!-- Checkmark -->
    <path d="M-4 1 L-1 4 L5 -3" fill="none" stroke="#FF9F0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Priority Crown / Focus Indicator -->
  <path d="M 120 73 L 124 81 L 132 82 L 126 88 L 128 96 L 120 92 L 112 96 L 114 88 L 108 82 L 116 81 Z" fill="#FFD60A" filter="url(#glow)"/>

  <!-- UI Base/Platform representing structural foundation -->
  <path d="M 80 190 Q 120 180 160 190 Q 120 200 80 190 Z" fill="#2E364F" opacity="0.5"/>
  <ellipse cx="120" cy="189" rx="35" ry="4" fill="#3A445C" opacity="0.8"/>
  <ellipse cx="120" cy="189" rx="20" ry="2" fill="#FF9F0A" opacity="0.5"/>
</svg>