<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ground line -->
  <path d="M20 180 L220 180" stroke="#2A2F3A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Motion blur lines (dust/speed trails behind the runner) -->
  <g opacity="0.4" stroke-linecap="round">
    <line x1="45" y1="165" x2="25" y2="165" stroke="#FF9F43" stroke-width="4"/>
    <line x1="35" y1="145" x2="15" y2="145" stroke="#E2E8F0" stroke-width="3"/>
    <line x1="55" y1="130" x2="30" y2="130" stroke="#FF9F43" stroke-width="2"/>
  </g>
  
  <!-- Dynamic fleeing character (Thief in dark burglar style, dramatic forward lean) -->
  <g transform="translate(70, 60)">
    <!-- Back leg (extended backward) -->
    <path d="M 45 90 L 15 115 L 5 110" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back foot -->
    <path d="M 5 110 L -2 112" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>

    <!-- Body / Torso (hunched forward at high speed) -->
    <path d="M 40 50 C 45 70, 45 80, 40 95 L 55 95 C 60 80, 65 65, 70 50 Z" fill="#3B82F6"/>

    <!-- Front leg (pushing off forward) -->
    <path d="M 40 95 L 65 115 L 85 110" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Back arm (swinging back) -->
    <path d="M 55 55 L 85 70" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>

    <!-- Head with beanie/cap looking back in panic -->
    <circle cx="50" cy="30" r="14" fill="#FDB022"/>
    <!-- Burglar mask / face detail -->
    <path d="M 40 28 L 60 28" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <!-- Cap -->
    <path d="M 35 24 Q 50 14 65 24 Z" fill="#2C3E50"/>

    <!-- Front arm (swinging forward with momentum) -->
    <path d="M 45 52 L 20 65" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Police siren / flashing light beam threatening from behind/above -->
  <g transform="translate(190, 40)">
    <!-- Siren dome -->
    <path d="M -12 15 C -12 0, 12 0, 12 15 Z" fill="#EF4444"/>
    <rect x="-15" y="15" width="30" height="6" rx="2" fill="#475569"/>
    <!-- Flashing light beam directed toward the runner -->
    <path d="M -15 20 L -120 120 L -90 140 Z" fill="#EF4444" opacity="0.15"/>
    <path d="M -15 25 L -70 100 L -50 110 Z" fill="#EF4444" opacity="0.25"/>
  </g>

  <!-- Speed lines indicating intense rapid movement -->
  <path d="M 140 100 L 170 90" stroke="#FF9F43" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
  <path d="M 120 130 L 150 120" stroke="#FF9F43" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>

</svg>