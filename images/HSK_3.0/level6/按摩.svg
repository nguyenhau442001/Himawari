<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk/Workplace context -->
  <rect x="20" y="140" width="100" height="10" rx="2" fill="#334155"/>
  <rect x="25" y="150" width="10" height="40" fill="#475569"/>
  <rect x="105" y="150" width="10" height="40" fill="#475569"/>
  <path d="M30 130 L50 100 L90 100 L110 130 Z" fill="#475569"/>
  
  <!-- Massage Scene -->
  <!-- Massage table -->
  <rect x="130" y="160" width="90" height="20" rx="5" fill="#334155"/>
  <rect x="140" y="180" width="10" height="30" fill="#475569"/>
  <rect x="200" y="180" width="10" height="30" fill="#475569"/>
  
  <!-- Person receiving massage -->
  <path d="M140 160 Q185 150 220 160" fill="#fb923c" stroke="#1e293b" stroke-width="2"/>
  <circle cx="210" cy="155" r="10" fill="#fb923c"/>
  
  <!-- Masseur -->
  <g transform="translate(150, 130)">
    <circle cx="10" cy="10" r="12" fill="#38bdf8"/>
    <path d="M5 25 L15 60 M25 35 L5 45" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="10" cy="35" r="5" fill="#f59e0b"/>
  </g>
  
  <!-- Mood/Environment -->
  <circle cx="200" cy="50" r="30" fill="#f59e0b" opacity="0.1"/>
  <circle cx="200" cy="50" r="15" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Exhaustion indicator (floating above desk) -->
  <path d="M60 90 Q70 80 80 90 T100 90" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
