<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window/Display Glow -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gold Accent Gradient for Currency -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Banknote Green Gradient -->
    <linearGradient id="noteGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- ENVIRONMENT / SCENERY: Travel Exchange Counter & China Theme -->
  <!-- Back Wall -->
  <rect x="20" y="30" width="200" height="130" rx="12" fill="#334155" opacity="0.4"/>
  
  <!-- Stylized Iconic Window / Map of China outline reference or Lantern decor -->
  <path d="M120 45 C135 45 145 55 145 70 C145 85 130 95 120 110 C110 95 95 85 95 70 C95 55 105 45 120 45 Z" fill="#ef4444" opacity="0.15" filter="url(#shadow)"/>
  <circle cx="120" cy="70" r="15" fill="#f59e0b" opacity="0.2"/>

  <!-- Counter Desk Surface -->
  <path d="M10 170 L230 170 L220 210 L20 210 Z" fill="#475569" filter="url(#shadow)"/>
  <rect x="15" y="165" width="210" height="10" rx="4" fill="#64748b"/>

  <!-- Desk Lamp -->
  <path d="M190 170 L195 120 L205 120 L210 170 Z" fill="#94a3b8" opacity="0.8"/>
  <path d="M185 115 C185 105 215 105 215 115 Z" fill="#fbbf24"/>
  <path d="M180 115 L220 115 L215 125 L185 125 Z" fill="#f59e0b"/>
  <!-- Lamp Light Cone -->
  <polygon points="200,125 150,210 230,210" fill="#fef08a" opacity="0.08"/>

  <!-- CHARACTERS -->
  <!-- Bank / Exchange Clerk (Left) -->
  <g transform="translate(45, 100)">
    <!-- Body -->
    <path d="M10 70 C10 50 30 45 40 45 C50 45 70 50 70 70 L75 110 L5 110 Z" fill="#0284c7"/>
    <!-- Collar / Tie -->
    <polygon points="35,45 45,45 42,65 38,65" fill="#e2e8f0"/>
    <polygon points="40,55 43,68 40,75 37,68" fill="#ef4444"/>
    <!-- Head -->
    <circle cx="40" cy="25" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M24 22 C24 12 32 10 40 10 C48 10 56 12 56 22 C56 25 50 20 40 18 C30 20 24 25 24 22 Z" fill="#334155"/>
    <!-- Friendly Face -->
    <circle cx="35" cy="25" r="1.5" fill="#1e293b"/>
    <circle cx="45" cy="25" r="1.5" fill="#1e293b"/>
    <path d="M38 30 Q40 33 42 30" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Customer / Traveler (Right) -->
  <g transform="translate(135, 95)">
    <!-- Body -->
    <path d="M10 75 C10 55 30 50 40 50 C50 50 70 55 70 75 L80 115 L0 115 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="40" cy="26" r="16" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M24 25 C24 14 30 10 40 10 C50 10 56 14 56 25 C52 20 48 18 40 18 C32 18 28 20 24 25 Z" fill="#451a03"/>
    <!-- Face & Expression (Looking down at currency) -->
    <circle cx="35" cy="27" r="1.5" fill="#1e293b"/>
    <circle cx="45" cy="27" r="1.5" fill="#1e293b"/>
    <path d="M38 33 Q40 35 42 33" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- THE CENTRAL FOCUS: "货币" (Banknotes and Coins representing Chinese currency) -->
  <g transform="translate(85, 140)" filter="url(#shadow)">
    <!-- Banknote Stack Background (RMB style hues - Reddish/Pinkish & Green) -->
    <!-- Note 1 -->
    <rect x="-10" y="10" width="65" height="36" rx="4" transform="rotate(-15 22 28)" fill="#f43f5e" opacity="0.9"/>
    <rect x="-5" y="15" width="55" height="26" rx="2" transform="rotate(-15 22 28)" fill="#fda4af"/>
    <circle cx="22" cy="28" r="7" transform="rotate(-15 22 28)" fill="#f43f5e" opacity="0.4"/>

    <!-- Note 2 (Main foreground banknote) -->
    <rect x="5" y="0" width="70" height="40" rx="4" transform="rotate(8 40 20)" fill="url(#noteGreen)" stroke="#065f46" stroke-width="1.5"/>
    <!-- Inner detail on banknote -->
    <rect x="12" y="6" width="56" height="28" rx="2" fill="#6ee7b7" opacity="0.5" transform="rotate(8 40 20)"/>
    <!-- Portrait placeholder oval -->
    <circle cx="40" cy="20" r="8" fill="#047857" opacity="0.8" transform="rotate(8 40 20)"/>
    <circle cx="40" cy="18" r="4" fill="#a7f3d0" transform="rotate(8 40 20)"/>
    <path d="M35 24 C35 22 37 21 40 21 C43 21 45 22 45 24" fill="#a7f3d0" transform="rotate(8 40 20)"/>

    <!-- Shiny Gold Coins -->
    <g transform="translate(55, 25)">
      <circle cx="0" cy="0" r="12" fill="url(#gold)" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#fbbf24" stroke-width="1"/>
      <rect x="-3" y="-3" width="6" height="6" fill="#b45309"/>
    </g>
    <g transform="translate(15, 35)">
      <circle cx="0" cy="0" r="10" fill="url(#gold)" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#fbbf24" stroke-width="1"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#b45309"/>
    </g>
    <g transform="translate(40, 42)">
      <circle cx="0" cy="0" r="9" fill="url(#gold)" stroke="#b45309" stroke-width="1.5"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#b45309"/>
    </g>
  </g>

  <!-- Sparkles / Emphasis on Currency value -->
  <path d="M75 130 L78 135 L83 138 L78 141 L75 146 L72 141 L67 138 L72 135 Z" fill="#fef08a"/>
  <path d="M165 145 L167 148 L171 150 L167 152 L165 155 L163 152 L159 150 L163 148 Z" fill="#fef08a"/>
</svg>