<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Shockwaves / Explosion lines -->
    <path d="M-65 -65 L-45 -45" stroke="#FF5722" stroke-width="4" stroke-linecap="round"/>
    <path d="M65 -65 L45 -45" stroke="#FF5722" stroke-width="4" stroke-linecap="round"/>
    <path d="M-65 65 L-45 45" stroke="#FF5722" stroke-width="4" stroke-linecap="round"/>
    <path d="M65 65 L45 45" stroke="#FF5722" stroke-width="4" stroke-linecap="round"/>
    
    <path d="M0 -75 L0 -50" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 75 L0 50" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
    <path d="M-75 0 L-50 0" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
    <path d="M75 0 L50 0" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>

    <!-- Outer orange burst petals -->
    <path d="M 0 -60 Q 20 -20 60 0 Q 20 20 0 60 Q -20 20 -60 0 Q -20 -20 0 -60 Z" fill="#FF5722" opacity="0.8"/>
    
    <!-- Inner golden burst petals (rotated) -->
    <g transform="rotate(45)">
      <path d="M 0 -50 Q 15 -15 50 0 Q 15 15 0 50 Q -15 15 -50 0 Q -15 -15 0 -50 Z" fill="#FFC107"/>
    </g>

    <!-- Central core bright flash -->
    <circle cx="0" cy="0" r="22" fill="#FFF3E0"/>
    <circle cx="0" cy="0" r="12" fill="#FFC107"/>
  </g>
</svg>