<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Target/Goal representation -->
  <circle cx="180" cy="120" r="30" fill="none" stroke="#FFB84D" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="180" cy="120" r="15" fill="#FFB84D"/>
  
  <!-- Character -->
  <g transform="translate(40, 120)">
    <!-- Body -->
    <path d="M20 100 L20 60 Q20 40 40 40 L60 40 Q80 40 80 60 L80 100" fill="#64748B"/>
    <!-- Head -->
    <circle cx="50" cy="30" r="20" fill="#E2E8F0"/>
    <!-- Arm reaching out -->
    <path d="M70 60 L140 90" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>
    <!-- Motion lines for action -->
    <path d="M120 70 L145 80" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
    <path d="M125 60 L150 70" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Arrow indicating trajectory towards target -->
  <path d="M110 150 Q145 130 170 125" fill="none" stroke="#FFB84D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 125 L160 135 M170 125 L165 115" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
</svg>