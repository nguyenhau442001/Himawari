<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Diving platform tower structure (Right side) -->
  <rect x="180" y="70" width="30" height="130" fill="#2E3440" rx="4"/>
  <rect x="140" y="110" width="40" height="12" fill="#3B4252" rx="2"/>
  
  <!-- Diving springboard (extending left) -->
  <path d="M 100 110 L 180 110" stroke="#E5C07B" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Water pool (Bottom) -->
  <rect x="0" y="180" width="240" height="60" fill="#21262D"/>
  <path d="M 0 185 Q 30 175 60 185 T 120 185 T 180 185 T 240 185" fill="none" stroke="#61AFEF" stroke-width="3" opacity="0.8"/>
  <path d="M 0 195 Q 40 205 80 195 T 160 195 T 240 195" fill="none" stroke="#61AFEF" stroke-width="2" opacity="0.4"/>

  <!-- Diver in mid-air (Dynamic diving posture: tucked/somersault) -->
  <g transform="translate(100, 135) rotate(-35)">
    <!-- Head with swim cap -->
    <circle cx="0" cy="-25" r="8" fill="#E5C07B"/>
    <!-- Torso -->
    <path d="M -5 -15 L 5 -15 L 8 10 L -8 10 Z" fill="#61AFEF"/>
    <!-- Bent arms -->
    <path d="M -5 -12 L -15 -5 L -8 5" fill="none" stroke="#E5C07B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bent legs (Tuck position) -->
    <path d="M -5 10 L -12 25 L 2 28" fill="none" stroke="#61AFEF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Motion lines / Dive trajectory -->
  <path d="M 120 105 Q 80 110 90 140 T 80 175" fill="none" stroke="#ABB2BF" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Splash effect at water entry -->
  <path d="M 70 185 L 60 160 L 80 160 Z" fill="#61AFEF" opacity="0.8"/>
  <path d="M 90 185 L 100 165 L 85 170 Z" fill="#61AFEF" opacity="0.6"/>
  <circle cx="80" cy="183" r="15" fill="none" stroke="#61AFEF" stroke-width="2" opacity="0.7"/>
</svg>