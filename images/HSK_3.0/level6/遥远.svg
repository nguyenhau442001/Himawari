<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: starry night sky representing vast distance -->
  <circle cx="45" cy="50" r="1" fill="#4A5568" opacity="0.6"/>
  <circle cx="85" cy="35" r="1.5" fill="#E2E8F0" opacity="0.8"/>
  <circle cx="130" cy="65" r="1" fill="#4A5568" opacity="0.5"/>
  <circle cx="185" cy="40" r="1.2" fill="#E2E8F0" opacity="0.7"/>
  <circle cx="210" cy="75" r="1.5" fill="#4A5568" opacity="0.4"/>
  <circle cx="25" cy="95" r="1" fill="#E2E8F0" opacity="0.5"/>

  <!-- Distant celestial body / moon / distant star glow -->
  <circle cx="195" cy="60" r="14" fill="#F6AD55" opacity="0.15"/>
  <circle cx="195" cy="60" r="8" fill="#F6AD55" opacity="0.3"/>
  <circle cx="195" cy="60" r="4" fill="#F6AD55"/>

  <!-- Ground layers creating depth and vast distance (Adjective: scale exaggeration & spatial separation) -->
  <!-- Far background layer -->
  <path d="M 0 160 Q 60 145, 120 155 T 240 148 L 240 190 L 0 190 Z" fill="#2D3748" opacity="0.5"/>
  
  <!-- Mid background layer -->
  <path d="M 0 170 Q 70 160, 140 168 T 240 165 L 240 190 L 0 190 Z" fill="#323F4B" opacity="0.8"/>

  <!-- Foreground ground layer -->
  <path d="M 0 185 Q 90 175, 160 182 T 240 180 L 240 215 L 0 215 Z" fill="#242B35"/>
  
  <!-- Horizon line glowing accent -->
  <path d="M 0 185 Q 90 175, 160 182 T 240 180" fill="none" stroke="#F6AD55" stroke-width="1" opacity="0.4"/>

  <!-- TRAVELLER ON THE LEFT (Origin / Departure point) -->
  <!-- Tiny scaled figure to emphasize extreme distance -->
  <g transform="translate(45, 162)">
    <!-- Shadow -->
    <ellipse cx="4" cy="18" rx="6" ry="2" fill="#0D1117" opacity="0.6"/>
    <!-- Body -->
    <path d="M2 8 L6 8 L7 17 L1 17 Z" fill="#CBD5E0"/>
    <!-- Head -->
    <circle cx="4" cy="4" r="3" fill="#E2E8F0"/>
    <!-- Backpack -->
    <rect x="-1" y="9" rx="1" width="3" height="6" fill="#F6AD55"/>
    <!-- Walking stick / posture -->
    <line x1="7" y1="12" x2="11" y2="17" stroke="#CBD5E0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- DESTINATION / HOME ON THE RIGHT -->
  <!-- Larger, detailed silhouette signifying the distant goal -->
  <g transform="translate(170, 125)">
    <!-- Shadow -->
    <ellipse cx="22" cy="57" rx="24" ry="5" fill="#0D1117" opacity="0.6"/>
    <!-- House structure -->
    <polygon points="22,15 42,32 42,55 2,55 2,32" fill="#2D3748"/>
    <!-- Warm glowing window (Target point) -->
    <rect x="14" y="38" width="16" height="17" rx="2" fill="#1A1D24"/>
    <rect x="16" y="40" width="12" height="13" rx="1" fill="#F6AD55"/>
    <line x1="22" y1="40" x2="22" y2="53" stroke="#1A1D24" stroke-width="1.5"/>
    <line x1="16" y1="46" x2="28" y2="46" stroke="#1A1D24" stroke-width="1.5"/>
    <!-- Roof -->
    <polygon points="22,6 46,28 -2,28" fill="#F6AD55"/>
    <polygon points="22,8 44,27 0,27" fill="#DD6B20"/>
  </g>

  <!-- VISUAL PATH OF VAST SEPARATION (Dotted trajectory arc across the dark expanse) -->
  <path d="M 52 172 Q 115 110, 175 145" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-dasharray="5,6" stroke-linecap="round" opacity="0.8"/>

  <!-- Compass / Distance marker elements to reinforce 'far away' semantic -->
  <!-- Subtle directional arrow near the path center -->
  <g transform="translate(112, 128) rotate(25)">
    <polygon points="0,-4 6,0 0,4" fill="#F6AD55" opacity="0.9"/>
  </g>
</svg>