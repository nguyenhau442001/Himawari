<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Excellence Golden Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Hologram/Energy Cyan Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Lab Flask Liquid Gradient -->
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Golden Award Medal Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Dark Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Spotlight Emission -->
  <circle cx="120" cy="100" r="110" fill="url(#spotlight)"/>

  <!-- Background Scientific Grid & Diagrams -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1" fill="none">
    <!-- Geometric Science Grid/Curves -->
    <circle cx="120" cy="90" r="75" stroke-dasharray="4 4"/>
    <circle cx="120" cy="90" r="55" stroke-dasharray="2 4"/>
    <path d="M 40,90 Q 120,40 200,90"/>
    <path d="M 40,90 Q 120,140 200,90"/>
    
    <!-- Floating Sparkles / Achievements -->
    <path d="M 45,55 L 47,62 L 54,64 L 47,66 L 45,73 L 43,66 L 36,64 L 43,62 Z" fill="#fbbf24" stroke="none" opacity="0.7"/>
    <path d="M 195,45 L 196,50 L 201,51 L 196,52 L 195,57 L 194,52 L 189,51 L 194,50 Z" fill="#38bdf8" stroke="none" opacity="0.8"/>
    <path d="M 180,115 L 181,118 L 184,119 L 181,120 L 180,123 L 179,120 L 176,119 L 179,118 Z" fill="#fbbf24" stroke="none" opacity="0.6"/>
  </g>

  <!-- Wall Framed Certificate of Excellence (Left Background) -->
  <g transform="translate(18, 45)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="3" y="3" width="24" height="34" rx="1" fill="#0f172a"/>
    <!-- Certificate Ribbon/Seal -->
    <circle cx="15" cy="22" r="5" fill="url(#goldGrad)"/>
    <polygon points="12,25 15,32 18,25" fill="#f59e0b"/>
    <line x1="7" y1="9" x2="23" y2="9" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="13" x2="21" y2="13" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Glowing Molecule / DNA Hologram (Right Background) -->
  <g transform="translate(175, 60)">
    <circle cx="20" cy="20" r="25" fill="url(#cyanGlow)"/>
    <!-- Atom / Molecule Structure -->
    <ellipse cx="20" cy="20" rx="18" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(30, 20, 20)"/>
    <ellipse cx="20" cy="20" rx="18" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(-30, 20, 20)"/>
    <circle cx="20" cy="20" r="4" fill="#38bdf8"/>
    <circle cx="34" cy="13" r="2.5" fill="#fbbf24"/>
    <circle cx="6" cy="27" r="2.5" fill="#38bdf8"/>
    <circle cx="28" cy="32" r="2" fill="#34d399"/>
  </g>

  <!-- SCIENTIST CHARACTER (Middle Ground) -->
  <g id="scientist">
    <!-- Back Hair -->
    <path d="M 102,72 C 102,50 138,50 138,72 C 138,78 135,85 135,85 L 105,85 C 105,85 102,78 102,72 Z" fill="#0f172a"/>

    <!-- Head & Neck -->
    <rect x="114" y="82" width="12" height="14" fill="#fdba74" rx="3"/>
    <path d="M 106,66 C 106,55 112,48 120,48 C 128,48 134,55 134,66 C 134,76 128,84 120,84 C 112,84 106,76 106,66 Z" fill="#ffedd5"/>

    <!-- Hair Front (Stylized Smart Hair cut) -->
    <path d="M 105,62 C 107,52 115,46 122,46 C 130,46 135,50 135,58 C 135,61 132,60 130,57 C 127,53 121,52 117,55 C 114,57 111,57 108,60 C 106,62 105,62 105,62 Z" fill="#1e293b"/>

    <!-- Ears -->
    <circle cx="106" cy="67" r="3" fill="#ffedd5"/>
    <circle cx="134" cy="67" r="3" fill="#ffedd5"/>

    <!-- Glasses (Smart / Distinguished look) -->
    <rect x="110" y="62" width="8" height="6" rx="1.5" fill="none" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="122" y="62" width="8" height="6" rx="1.5" fill="none" stroke="#0284c7" stroke-width="1.2"/>
    <line x1="118" y1="65" x2="122" y2="65" stroke="#0284c7" stroke-width="1.2"/>
    <line x1="106" y1="64" x2="110" y2="64" stroke="#0284c7" stroke-width="1"/>
    <line x1="130" y1="64" x2="134" y2="64" stroke="#0284c7" stroke-width="1"/>

    <!-- Eyes (Confident, friendly) -->
    <circle cx="114" cy="65" r="1" fill="#0f172a"/>
    <circle cx="126" cy="65" r="1" fill="#0f172a"/>

    <!-- Eyebrows -->
    <path d="M 110,60 Q 114,58 117,60" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
    <path d="M 123,60 Q 126,58 130,60" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 116,74 Q 120,78 124,74" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Body / Torso -->
    <!-- Inner Shirt & Tie -->
    <path d="M 113,94 L 120,110 L 127,94 Z" fill="#f8fafc"/>
    <polygon points="119,94 121,94 122,106 120,109 118,106" fill="#0284c7"/>

    <!-- White Lab Coat (Distinguished Scientist Attire) -->
    <path d="M 100,94 C 108,92 132,92 140,94 L 145,155 L 95,155 Z" fill="#f1f5f9"/>
    <!-- Coat Lapels -->
    <path d="M 100,94 L 112,112 L 112,145 L 102,142 Z" fill="#e2e8f0"/>
    <path d="M 140,94 L 128,112 L 128,145 L 138,142 Z" fill="#cbd5e1"/>

    <!-- Coat Pocket with Pens -->
    <rect x="103" y="120" width="8" height="10" rx="1" fill="#cbd5e1"/>
    <line x1="105" y1="116" x2="105" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="108" y1="114" x2="108" y2="120" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Golden Outstanding Ribbon/Medal on Lapel -->
    <circle cx="132" cy="122" r="3.5" fill="url(#goldGrad)"/>
    <polygon points="130,125 132,130 134,125" fill="#dc2626"/>

    <!-- Left Arm - Holding Glowing Scientific Flask -->
    <path d="M 100,96 L 85,115 L 92,125 L 102,108 Z" fill="#e2e8f0"/>
    <!-- Left Hand -->
    <circle cx="91" cy="126" r="3.5" fill="#ffedd5"/>

    <!-- Right Arm - Gesturing Proudly / Presenting -->
    <path d="M 140,96 L 158,110 L 152,122 L 136,106 Z" fill="#f1f5f9"/>
    <!-- Right Hand -->
    <circle cx="156" cy="120" r="3.5" fill="#ffedd5"/>
  </g>

  <!-- Foreground Lab Equipment & Bench -->
  <!-- Main Workbench -->
  <path d="M 10,160 L 230,160 L 240,240 L 0,240 Z" fill="url(#deskGrad)"/>
  <line x1="10" y1="160" x2="230" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="0" y1="163" x2="240" y2="163" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>

  <!-- Left Prop: Outstanding Golden Trophy / Award -->
  <g transform="translate(30, 122)">
    <!-- Base -->
    <rect x="8" y="32" width="16" height="7" rx="1" fill="#78350f"/>
    <rect x="10" y="29" width="12" height="3" fill="#b45309"/>
    <!-- Cup Stem -->
    <path d="M 14,22 L 18,22 L 17,29 L 15,29 Z" fill="url(#goldGrad)"/>
    <!-- Cup Body -->
    <path d="M 10,10 C 10,20 22,20 22,10 L 24,8 L 8,8 Z" fill="url(#goldGrad)"/>
    <!-- Handles -->
    <path d="M 8,10 C 5,10 5,16 10,16" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <path d="M 24,10 C 27,10 27,16 22,16" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <!-- Star on Trophy -->
    <polygon points="16,10 17,12 19,12 17.5,13.5 18,15.5 16,14 14,15.5 14.5,13.5 13,12 15,12" fill="#ffffff"/>
  </g>

  <!-- Center-Left Prop: Glowing Flask held by scientist/on desk -->
  <g transform="translate(75, 115)">
    <!-- Flask Aura -->
    <circle cx="15" cy="25" r="18" fill="url(#cyanGlow)"/>
    <!-- Glass Flask Body -->
    <path d="M 12,10 L 18,10 L 18,18 L 26,30 C 28,33 25,36 21,36 L 9,36 C 5,36 2,33 4,30 L 12,18 Z" fill="url(#glassGrad)" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Liquid inside -->
    <path d="M 7,27 Q 15,24 23,27 L 24,31 C 23,34 20,35 16,35 L 12,35 C 7,35 5,33 6,31 Z" fill="url(#flaskLiquid)"/>
    <!-- Bubbles & Energy Sparks -->
    <circle cx="13" cy="22" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="17" cy="16" r="1" fill="#ffffff" opacity="0.9"/>
    <circle cx="11" cy="14" r="2" fill="#38bdf8" opacity="0.6"/>
    <!-- Rising Sparkle -->
    <path d="M 15,2 L 16,5 L 19,6 L 16,7 L 15,10 L 14,7 L 11,6 L 14,5 Z" fill="#fbbf24"/>
  </g>

  <!-- Right Prop: High-Tech Microscope -->
  <g transform="translate(170, 120)">
    <!-- Base -->
    <rect x="10" y="35" width="22" height="5" rx="1.5" fill="#475569"/>
    <!-- Stand Arm -->
    <path d="M 26,35 L 26,18 C 26,12 20,10 15,10 L 12,10" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Body / Eyepiece -->
    <rect x="8" y="6" width="6" height="12" rx="1" fill="#94a3b8" transform="rotate(25, 11, 12)"/>
    <!-- Lens Tube -->
    <rect x="14" y="18" width="5" height="8" fill="#38bdf8"/>
    <!-- Stage -->
    <rect x="8" y="27" width="14" height="2" fill="#0f172a"/>
    <path d="M 15,27 L 15,31" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Sample Glow -->
    <ellipse cx="15" cy="27" rx="3" ry="1" fill="#fbbf24"/>
  </g>

  <!-- Foreground Excellence Sparkles / Light Reflections -->
  <g>
    <!-- Big Golden Star Burst symbolizing "Outstanding" -->
    <g transform="translate(120, 30)">
      <path d="M 0,-10 L 2.5,-3 L 9.5,-2.5 L 4.2,2 C 5.5,9 5.5,9 0,5.5 C -5.5,9 -5.5,9 -4.2,2 L -9.5,-2.5 L -2.5,-3 Z" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="12" fill="url(#spotlight)"/>
    </g>
    <!-- Accent spark dots -->
    <circle cx="65" cy="80" r="1.5" fill="#fef08a" opacity="0.8"/>
    <circle cx="170" cy="100" r="2" fill="#38bdf8" opacity="0.9"/>
    <circle cx="110" cy="25" r="1" fill="#ffffff"/>
    <circle cx="135" cy="38" r="1.5" fill="#fbfb24"/>
  </g>
</svg>