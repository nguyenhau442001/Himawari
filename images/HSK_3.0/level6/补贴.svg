<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Field Background -->
  <path d="M0 160 Q120 140 240 160 L240 240 L0 240 Z" fill="#064e3b" opacity="0.6"/>
  <rect x="20" y="180" width="40" height="40" rx="4" fill="#fb923c"/>
  <rect x="80" y="190" width="40" height="30" rx="4" fill="#fb923c"/>
  
  <!-- Government Official -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <rect x="5" y="35" width="30" height="50" rx="5" fill="#38bdf8"/>
    <path d="M10 50 L0 70 M30 50 L40 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="45" width="20" height="10" fill="#fbbf24"/>
  </g>
  
  <!-- Farmer -->
  <g transform="translate(40, 120)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <path d="M5 35 L35 35 L30 90 L10 90 Z" fill="#10b981"/>
    <rect x="10" y="30" width="20" height="10" fill="#ec4899"/>
  </g>
  
  <!-- Money/Subsidy Envelope -->
  <g transform="translate(90, 100)">
    <rect width="40" height="30" rx="4" fill="#f59e0b"/>
    <path d="M0 0 L20 15 L40 0" stroke="#b45309" stroke-width="2" fill="none"/>
    <circle cx="20" cy="15" r="5" fill="#fff" opacity="0.3"/>
  </g>
  
  <!-- Sun/Atmosphere -->
  <circle cx="200" cy="40" r="25" fill="#fbbf24" opacity="0.2"/>
  <circle cx="200" cy="40" r="15" fill="#fbbf24"/>
</svg>