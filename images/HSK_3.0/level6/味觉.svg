<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Central Illustration for 味觉 (Sense of Taste) -->
  <g transform="translate(0, 0)">
    <!-- Subtle glow/backdrop circle -->
    <circle cx="120" cy="120" r="64" fill="#252A35" />

    <!-- Stylized Open Mouth Profile & Taste Perception -->
    <!-- Head / Jaw Silhouette -->
    <path d="M 75 100 C 75 75, 95 65, 120 65 C 150 65, 160 85, 160 110 C 160 130, 150 145, 135 155 L 125 175 C 122 180, 115 180, 112 175 L 100 150 C 85 140, 75 125, 75 100 Z" fill="#2E3544" />
    
    <!-- Inner Mouth Cavity -->
    <path d="M 95 105 C 95 95, 110 90, 125 95 C 135 98, 142 108, 140 120 C 138 132, 125 140, 115 138 C 102 135, 95 120, 95 105 Z" fill="#14171E" />

    <!-- Distinctive Stylized Tongue -->
    <path d="M 102 125 C 102 118, 112 112, 122 115 C 130 118, 135 125, 133 133 C 130 142, 118 150, 110 145 C 105 142, 102 132, 102 125 Z" fill="#FF79C6" />
    <path d="M 112 120 C 114 120, 118 122, 119 128 C 120 134, 114 138, 112 138 C 110 138, 106 134, 107 128 C 108 122, 110 120, 112 120 Z" fill="#FF92D0" opacity="0.6" />

    <!-- Sensory Taste Receptor Waves / Sparkles (Representing "Taste" perception) -->
    <!-- Sweet / Golden Accent -->
    <path d="M 148 95 Q 160 90, 172 95 Q 160 100, 148 95 Z" fill="#FFB86C" />
    <circle cx="178" cy="92" r="3" fill="#FFB86C" />

    <!-- Umami / Citrus Accent -->
    <path d="M 152 120 Q 168 115, 180 125 Q 168 135, 152 120 Z" fill="#FF5555" />
    <circle cx="186" cy="128" r="2.5" fill="#FF5555" />

    <!-- Salty / Fresh Accent -->
    <path d="M 142 145 Q 155 152, 168 145 Q 155 138, 142 145 Z" fill="#50FA7B" />
    <circle cx="174" cy="150" r="3" fill="#50FA7B" />

    <!-- Floating flavor nodes entering the palate -->
    <circle cx="75" cy="115" r="4" fill="#FFB86C" opacity="0.8" />
    <path d="M 62 105 Q 68 102, 74 108" stroke="#FF5555" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="68" cy="130" r="3" fill="#50FA7B" opacity="0.8" />

    <!-- Dynamic connection arc symbolizing sensory neural pathway -->
    <path d="M 120 65 C 120 40, 165 40, 165 65 C 165 85, 185 85, 185 110" stroke="#FFB86C" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>
</svg>