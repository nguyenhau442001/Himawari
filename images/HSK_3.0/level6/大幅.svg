<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Large Scale/Significant Change Visualization: A massive, heavy stone block being lifted by a sturdy, professional mechanical pulley system, representing the 'large amplitude' or 'significant' nature of the word -->
  
  <!-- Mechanical Arm/Support -->
  <path d="M60 200 L180 200 L170 180 L70 180 Z" fill="#4A5568"/>
  <path d="M120 180 L120 80" stroke="#718096" stroke-width="8" stroke-linecap="round"/>
  
  <!-- The 'Large' Object (The Block) -->
  <rect x="80" y="80" width="80" height="80" rx="4" fill="#F6AD55"/>
  <rect x="85" y="85" width="70" height="70" rx="2" fill="#DD6B20"/>
  
  <!-- Significant drop/movement indicator: A clean, sharp downward motion line -->
  <path d="M190 60 L190 160" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <path d="M180 150 L190 165 L200 150" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Structural stability -->
  <circle cx="120" cy="80" r="6" fill="#A0AEC0"/>
</svg>