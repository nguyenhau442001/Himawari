<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to create atmosphere of "凶恶" (fierce/wild) -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="115" r="55" fill="#2D1B18" opacity="0.4"/>

  <!-- Wolf Head Illustration Group -->
  <g transform="translate(0, 5)">
    <!-- Neck / Shoulders -->
    <path d="M75 160 L95 195 L145 195 L165 160 L140 145 L100 145 Z" fill="#2C3240"/>
    
    <!-- Main Body / Mane (Fur tufts) -->
    <path d="M70 120 C 65 140, 80 170, 95 195 C 105 170, 110 150, 120 160 C 130 150, 135 170, 145 195 C 160 170, 175 140, 170 120 Z" fill="#3B4252"/>
    <path d="M85 110 C 75 130, 85 160, 100 180 C 110 160, 115 145, 120 155 C 125 145, 130 160, 140 180 C 155 160, 165 130, 155 110 Z" fill="#4C566A"/>

    <!-- Ears -->
    <!-- Left Ear Background -->
    <polygon points="75,85 60,35 100,60" fill="#3B4252"/>
    <!-- Left Ear Inner -->
    <polygon points="78,75 70,45 93,60" fill="#BF616A" opacity="0.8"/>

    <!-- Right Ear Background -->
    <polygon points="165,85 180,35 140,60" fill="#3B4252"/>
    <!-- Right Ear Inner -->
    <polygon points="162,75 170,45 147,60" fill="#BF616A" opacity="0.8"/>

    <!-- Head Base (Muzzle and Cranium) -->
    <!-- Cranium -->
    <path d="M75 85 C 75 55, 95 45, 120 45 C 145 45, 165 55, 165 85 C 165 110, 150 130, 120 130 C 90 130, 75 110, 75 85 Z" fill="#4C566A"/>
    
    <!-- Brow ridge shadow (creates fierce expression) -->
    <path d="M78 78 L 120 100 L 162 78 L 155 65 L 120 80 L 85 65 Z" fill="#3B4252"/>

    <!-- Snout / Muzzle -->
    <path d="M95 100 L 145 100 L 135 145 C 130 152, 110 152, 105 145 Z" fill="#D8DEE9"/>
    
    <!-- Nose Bridge Highlights -->
    <polygon points="110,100 130,100 125,130 115,130" fill="#ECEFF4"/>

    <!-- Nose / Truffle -->
    <path d="M108 128 L 132 128 L 125 142 L 115 142 Z" fill="#2E3440"/>
    <path d="M117 132 H 123 V 137 H 117 Z" fill="#4C566A" opacity="0.5"/> <!-- Nose highlight -->

    <!-- Mouth Line / Snarl -->
    <path d="M120 142 L 120 150" stroke="#2E3440" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M95 138 C 105 147, 115 147, 120 150 C 125 147, 135 147, 145 138" fill="none" stroke="#2E3440" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Fierce Fangs (Sharp teeth showing "凶恶") -->
    <!-- Left Fang -->
    <polygon points="102,143 108,143 105,153" fill="#FFFFFF"/>
    <!-- Right Fang -->
    <polygon points="138,143 132,143 135,153" fill="#FFFFFF"/>

    <!-- Eyes (Aggressive, angled, glowing amber/gold for high contrast and focus) -->
    <!-- Left Eye background socket -->
    <polygon points="78,78 105,82 95,95" fill="#2E3440"/>
    <!-- Right Eye background socket -->
    <polygon points="162,78 135,82 145,95" fill="#2E3440"/>

    <!-- Left Glowing Iris -->
    <polygon points="86,83 103,87 93,92" fill="#EBCB8B"/>
    <!-- Left Slit Pupil -->
    <polygon points="94,84 96,84 95,91 93,91" fill="#2E3440"/>

    <!-- Right Glowing Iris -->
    <polygon points="154,83 137,87 147,92" fill="#EBCB8B"/>
    <!-- Right Slit Pupil -->
    <polygon points="146,84 144,84 145,91 147,91" fill="#2E3440"/>

    <!-- Fierce Brow Furrows (Angled lines above eyes) -->
    <line x1="82" y1="75" x2="105" y2="82" stroke="#2E3440" stroke-width="3" stroke-linecap="round"/>
    <line x1="158" y1="75" x2="135" y2="82" stroke="#2E3440" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative modern accent details (Minimalist framing corners to fit modern UI/Flashcard aesthetic) -->
  <path d="M20 36 V 24 C 24 24, 24 24, 36 24" fill="none" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M220 36 V 24 C 216 24, 216 24, 204 24" fill="none" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M20 204 V 216 C 24 216, 24 216, 36 216" fill="none" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M220 204 V 216 C 216 216, 216 216, 204 216" fill="none" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>