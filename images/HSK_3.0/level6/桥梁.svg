<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="bridge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="glow-beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="speech-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="speech-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Ambient lighting -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" opacity="0.6"/>
  <ellipse cx="120" cy="180" rx="80" ry="25" fill="url(#glow-beam)"/>

  <!-- Environment Elements: Cozy Interior / Global connection vibe -->
  <!-- Window framing back -->
  <path d="M70 70 L170 70 L170 140 L70 140 Z" fill="#090d16" opacity="0.4"/>
  <!-- Stars/City lights outside window -->
  <circle cx="90" cy="90" r="1" fill="#f59e0b" opacity="0.8"/>
  <circle cx="140" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="155" cy="110" r="1" fill="#f43f5e" opacity="0.8"/>
  <circle cx="85" cy="120" r="1.2" fill="#10b981" opacity="0.8"/>

  <!-- THE BRIDGE (Metaphorical & Visual Bridge connecting both sides) -->
  <g filter="url( #soft-glow )">
    <!-- Bridge Arch -->
    <path d="M 60 155 Q 120 115 180 155" fill="none" stroke="url(#bridge-grad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Bridge Deck / Pathway -->
    <path d="M 50 160 C 90 145, 150 145, 190 160" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <!-- Suspension cables / light threads -->
    <line x1="80" y1="147" x2="80" y2="160" stroke="#bfdbfe" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="135" x2="100" y2="157" stroke="#bfdbfe" stroke-width="1.5" opacity="0.6"/>
    <line x1="120" y1="130" x2="120" y2="156" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    <line x1="140" y1="135" x2="140" y2="157" stroke="#bfdbfe" stroke-width="1.5" opacity="0.6"/>
    <line x1="160" y1="147" x2="160" y2="160" stroke="#bfdbfe" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Glowing Connection Pulse on the Bridge -->
  <circle cx="120" cy="143" r="5" fill="#fbbf24" filter="url(#soft-glow)"/>
  <circle cx="120" cy="143" r="2" fill="#ffffff"/>

  <!-- Characters interacting across the bridge -->
  <!-- Character Left (Person A) -->
  <g transform="translate(15, 0)">
    <!-- Body/Torso -->
    <path d="M 45 180 C 45 165, 55 160, 65 160 C 75 160, 85 165, 85 180 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="65" cy="142" r="11" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 54 142 C 54 133, 76 133, 76 142 C 76 139, 70 136, 65 136 C 60 136, 54 139, 54 142 Z" fill="#475569"/>
    <!-- Gesturing Arm -->
    <path d="M 60 165 L 75 152 L 80 156" fill="none" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Speech bubble rising toward the bridge -->
    <path d="M 75 130 C 75 118, 95 118, 95 130 C 95 138, 85 142, 80 146 C 78 142, 75 138, 75 130 Z" fill="url(#speech-left)" opacity="0.9"/>
    <!-- Abstract communication wave inside bubble -->
    <path d="M 82 126 C 85 128, 85 132, 82 134" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Character Right (Person B) -->
  <g transform="translate(135, 0)">
    <!-- Body/Torso -->
    <path d="M 45 180 C 45 165, 55 160, 65 160 C 75 160, 85 165, 85 180 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="65" cy="142" r="11" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 54 142 C 54 133, 76 133, 76 142 C 72 135, 58 135, 54 142 Z" fill="#1e293b"/>
    <!-- Gesturing Arm -->
    <path d="M 70 165 L 55 152 L 50 156" fill="none" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Speech bubble rising toward the bridge -->
    <path d="M 55 130 C 55 118, 35 118, 35 130 C 35 138, 45 142, 50 146 C 52 142, 55 138, 55 130 Z" fill="url(#speech-right)" opacity="0.9"/>
    <!-- Abstract communication wave inside bubble -->
    <path d="M 48 126 C 45 128, 45 132, 48 134" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating dialogue icons forming the upper arch of the bridge (Language/Communication metaphor) -->
  <g transform="translate(120, 85)" filter="url(#soft-glow)">
    <circle cx="-35" cy="10" r="8" fill="#38bdf8" opacity="0.2"/>
    <path d="M -38 10 C -38 7, -32 7, -32 10 C -32 12, -36 14, -36 15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="35" cy="10" r="8" fill="#fb7185" opacity="0.2"/>
    <path d="M 32 10 C 32 7, 38 7, 38 10 C 38 12, 34 14, 34 15" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Central golden spark of understanding -->
    <circle cx="0" cy="-2" r="10" fill="#f59e0b" opacity="0.25"/>
    <path d="M 0 -8 L 2 -3 L 7 -2 L 2 -1 L 0 4 L -2 -1 L -7 -2 L -2 -3 Z" fill="#fbbf24"/>
  </g>

  <!-- Foreground Floor / Desk surface to ground the scene -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#0b0f19"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- Context Props on surface (Books / Global communication elements) -->
  <g transform="translate(30, 205)">
    <rect x="0" y="5" width="25" height="8" rx="2" fill="#64748b"/>
    <rect x="2" y="2" width="23" height="8" rx="2" fill="#38bdf8"/>
    <rect x="4" y="-1" width="21" height="8" rx="2" fill="#f43f5e"/>
  </g>

  <g transform="translate(180, 208)">
    <rect x="0" y="0" width="30" height="12" rx="3" fill="#334155"/>
    <circle cx="15" cy="6" r="3" fill="#10b981"/>
  </g>
</svg>