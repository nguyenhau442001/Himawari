<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "业" (Industry / Enterprise / Profession) -->
  <!-- We represent this as a sleek, modern commercial/service building complex with a stylized modern service desk/hub -->

  <g transform="translate(0, 10)">
    <!-- Subtle architectural background grid / structure -->
    <path d="M70 145 L120 120 L170 145 L170 185 L120 210 L70 185 Z" fill="#222730" stroke="#2A313C" stroke-width="2"/>
    <path d="M120 120 L120 210" stroke="#2A313C" stroke-width="2"/>
    
    <!-- Central Modern Commercial / Service Tower (Representing "Industry" / "Enterprise") -->
    <!-- Main Tower Structure -->
    <path d="M95 50 L145 50 L145 160 L95 160 Z" fill="#28303D"/>
    
    <!-- Glass panels / windows facade -->
    <rect x="103" y="60" width="12" height="16" rx="2" fill="#3A4454"/>
    <rect x="125" y="60" width="12" height="16" rx="2" fill="#FFB703" opacity="0.8"/>
    
    <rect x="103" y="84" width="12" height="16" rx="2" fill="#FFB703" opacity="0.9"/>
    <rect x="125" y="84" width="12" height="16" rx="2" fill="#3A4454"/>
    
    <rect x="103" y="108" width="12" height="16" rx="2" fill="#3A4454"/>
    <rect x="125" y="108" width="12" height="16" rx="2" fill="#3A4454"/>
    
    <rect x="103" y="132" width="12" height="16" rx="2" fill="#FFB703" opacity="0.6"/>
    <rect x="125" y="132" width="12" height="16" rx="2" fill="#3A4454"/>

    <!-- Left Wing (Modern Service Architecture) -->
    <path d="M60 85 L95 70 L95 160 L60 160 Z" fill="#222934"/>
    <rect x="68" y="95" width="19" height="12" rx="1.5" fill="#323B4A"/>
    <rect x="68" y="115" width="19" height="12" rx="1.5" fill="#323B4A"/>
    <rect x="68" y="135" width="19" height="12" rx="1.5" fill="#FFB703" opacity="0.7"/>

    <!-- Right Wing (Modern Service Architecture) -->
    <path d="M145 70 L180 85 L180 160 L145 160 Z" fill="#222934"/>
    <rect x="153" y="95" width="19" height="12" rx="1.5" fill="#FFB703" opacity="0.8"/>
    <rect x="153" y="115" width="19" height="12" rx="1.5" fill="#323B4A"/>
    <rect x="153" y="135" width="19" height="12" rx="1.5" fill="#323B4A"/>

    <!-- Base / Foundation representing structural economy -->
    <path d="M45 160 L195 160 L205 175 L35 175 Z" fill="#323B4A"/>
    <rect x="90" y="175" width="60" height="8" fill="#FFB703" rx="2"/>

    <!-- Foreground Professional / Enterprise Elements (Modern Service/Business Hub) -->
    <!-- Stylized connection nodes / global service network vectors -->
    <circle cx="120" cy="35" r="8" fill="#FFB703"/>
    <circle cx="120" cy="35" r="14" fill="none" stroke="#FFB703" stroke-width="2" opacity="0.4"/>
    
    <line x1="120" y1="50" x2="120" y2="43" stroke="#FFB703" stroke-width="3"/>
    
    <!-- Orbital connection arcs representing industry sectors & services -->
    <path d="M75 35 Q120 15 165 35" fill="none" stroke="#3A4454" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Left satellite node -->
    <circle cx="70" cy="65" r="5" fill="#3A4454"/>
    <line x1="70" y1="65" x2="95" y2="70" stroke="#3A4454" stroke-width="2"/>

    <!-- Right satellite node -->
    <circle cx="170" cy="65" r="5" fill="#3A4454"/>
    <line x1="170" y1="65" x2="145" y2="70" stroke="#3A4454" stroke-width="2"/>
  </g>
</svg>