<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: Modern Cinema Ticket / Screening Pass representing "场次" (Suất chiếu / Su suất diễn) -->
  <g transform="translate(0, 0)">
    <!-- Ticket Shadow -->
    <rect x="52" y="57" width="136" height="126" rx="14" fill="#0D0E12" opacity="0.6"/>
    
    <!-- Main Ticket Body -->
    <rect x="50" y="55" width="136" height="126" rx="14" fill="#262B35"/>
    
    <!-- Gold/Orange Accent Strip (Left stub) -->
    <path d="M 50 69 A 14 14 0 0 1 50 167 L 50 55 Z" fill="#F59E0B"/>
    
    <!-- Dashed Tear-off Line -->
    <line x1="84" y1="55" x2="84" y2="181" stroke="#1A1D24" stroke-width="2.5" stroke-dasharray="4,4"/>
    
    <!-- Cinema Icon (Film strip & play symbol on ticket body) -->
    <circle cx="145" cy="95" r="18" fill="#1F242D"/>
    <polygon points="140,86 153,95 140,104" fill="#38BDF8"/>
    
    <!-- Ticket Details (Abstract Lines representing screening schedule info: time, seat, screen) -->
    <!-- Row 1: Title placeholder -->
    <rect x="100" y="125" width="65" height="8" rx="4" fill="#E2E8F0"/>
    
    <!-- Row 2: Time/Session slots (Visualizing multiple screening times/场次) -->
    <rect x="100" y="143" width="30" height="6" rx="3" fill="#64748B"/>
    <rect x="135" y="143" width="35" height="6" rx="3" fill="#F59E0B"/>
    
    <!-- Perforated Notches on Ticket Edges -->
    <circle cx="50" cy="62" r="5" fill="#1A1D24"/>
    <circle cx="50" cy="174" r="5" fill="#1A1D24"/>
    <circle cx="186" cy="62" r="5" fill="#1A1D24"/>
    <circle cx="186" cy="174" r="5" fill="#1A1D24"/>
  </g>
</svg>