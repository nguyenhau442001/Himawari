<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Motion & Rain Context (Due to rain) -->
  <g opacity="0.3" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
    <line x1="45" y1="50" x2="35" y2="70" />
    <line x1="75" y1="40" x2="65" y2="60" />
    <line x1="105" y1="55" x2="95" y2="75" />
  </g>

  <!-- Weather & Match Elements (Cloud and Sports Field outline) -->
  <!-- Cloud -->
  <path d="M45 65 C40 65 35 70 35 76 C35 82 40 85 46 85 L75 85 C81 85 85 81 85 75 C85 69 80 65 74 65 C72 58 65 54 58 56 C52 52 46 58 45 65 Z" fill="#334155"/>
  
  <!-- Calendar / Match Rescheduling Action -->
  <!-- Calendar Base -->
  <rect x="70" y="85" width="100" height="90" rx="10" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
  <path d="M70 95 L170 95" stroke="#4A5568" stroke-width="2"/>
  <!-- Calendar Rings -->
  <rect x="92" y="78" width="8" height="12" rx="4" fill="#64748B"/>
  <rect x="140" y="78" width="8" height="12" rx="4" fill="#64748B"/>

  <!-- Calendar Grid / Date -->
  <rect x="85" y="115" width="15" height="15" rx="3" fill="#4A5568"/>
  <rect x="112" y="115" width="15" height="15" rx="3" fill="#4A5568"/>
  <rect x="139" y="115" width="15" height="15" rx="3" fill="#4A5568"/>
  <rect x="85" y="140" width="15" height="15" rx="3" fill="#4A5568"/>
  <rect x="112" y="140" width="15" height="15" rx="3" fill="#E2E8F0"/>
  <rect x="139" y="140" width="15" height="15" rx="3" fill="#4A5568"/>

  <!-- Dynamic Action: Hand pushing/moving the date (Postponing) -->
  <g>
    <!-- Motion curved arrow indicating delay/shift forward -->
    <path d="M 125 50 C 150 40, 185 70, 180 105" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"/>
    <polygon points="183,115 172,103 186,100" fill="#F59E0B"/>

    <!-- Hand Character Interaction -->
    <!-- Arm -->
    <path d="M 210 180 L 175 145" stroke="#CBD5E1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cuff -->
    <path d="M 175 145 L 165 135" stroke="#3B82F6" stroke-width="16" stroke-linecap="round"/>
    <!-- Hand Palm & Fingers pushing the calendar edge -->
    <circle cx="160" cy="130" r="10" fill="#FBD38D"/>
    <path d="M 165 125 L 172 135 L 162 142 Z" fill="#FBD38D"/>
  </g>

  <!-- Soccer Ball motif in corner to contextualize "比赛" (Match) -->
  <circle cx="50" cy="170" r="16" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
  <path d="M 45 160 L 52 165 L 48 173 L 42 170 Z" fill="#334155"/>
  <path d="M 55 175 L 60 168 L 57 160 Z" fill="#334155" opacity="0.8"/>

</svg>