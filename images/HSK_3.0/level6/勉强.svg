<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lamp-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environment / Office Interior -->
  <!-- Window / Night City Background -->
  <rect x="150" y="25" width="65" height="75" rx="4" fill="#090d16" />
  <rect x="156" y="32" width="22" height="28" rx="2" fill="#1e293b" opacity="0.6" />
  <rect x="186" y="32" width="22" height="28" rx="2" fill="#1e293b" opacity="0.6" />
  <rect x="156" y="66" width="22" height="28" rx="2" fill="#1e293b" opacity="0.6" />
  <rect x="186" y="66" width="22" height="28" rx="2" fill="#1e293b" opacity="0.6" />

  <!-- Bookshelf Background Elements -->
  <rect x="25" y="30" width="40" height="6" rx="2" fill="#334155" />
  <rect x="30" y="15" width="8" height="15" rx="1" fill="#ec4899" />
  <rect x="40" y="12" width="10" height="18" rx="1" fill="#38bdf8" />
  <rect x="52" y="18" width="7" height="12" rx="1" fill="#10b981" />

  <!-- Desk Surface -->
  <path d="M 10 180 L 230 180 L 220 215 L 20 215 Z" fill="url(#desk-grad)" />
  <rect x="10" y="176" width="220" height="6" rx="3" fill="#475569" />

  <!-- Desk Lamp -->
  <path d="M 195 180 L 205 180 L 200 130 Z" fill="#64748b" />
  <path d="M 180 100 C 180 90, 210 90, 210 100 L 215 110 L 175 110 Z" fill="#fb923c" />
  <polygon points="175,115 215,115 225,180 165,180" fill="url(#lamp-glow)" opacity="0.4" />

  <!-- Character 2: The Requester (Standing, leaning forward eagerly) -->
  <g transform="translate(145, 100)">
    <!-- Body & Clothes -->
    <path d="M 35 45 C 35 30, 45 20, 55 20 C 65 20, 75 30, 75 45 L 75 80 L 35 80 Z" fill="#38bdf8" />
    <!-- Head & Face -->
    <circle cx="55" cy="15" r="12" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 43 12 C 43 5, 50 2, 55 2 C 63 2, 67 8, 67 15 Z" fill="#475569" />
    <!-- Pointing / Requesting Arm -->
    <path d="M 35 35 L 5 45 L 35 55 Z" fill="#38bdf8" />
    <circle cx="2" cy="46" r="3.5" fill="#fbcfe8" />
    <!-- Eager Expression -->
    <circle cx="59" cy="14" r="1.5" fill="#1e293b" />
    <path d="M 57 20 Q 60 23 63 20" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Character 1: The Reluctant Acceptor (Sitting, slumped, hesitating) -->
  <g transform="translate(40, 95)">
    <!-- Chair Back -->
    <rect x="-10" y="10" width="12" height="75" rx="4" fill="#334155" />
    
    <!-- Body (Slumped forward slightly) -->
    <path d="M 5 35 C 5 20, 20 15, 35 25 C 50 35, 55 50, 50 85 L 5 85 Z" fill="#10b981" />
    
    <!-- Head (Slightly tilted down, hesitant expression) -->
    <path d="M 32 10 C 26 10, 22 15, 24 22 C 26 28, 32 30, 38 25 C 44 20, 40 10, 32 10 Z" fill="#fbcfe8" />
    
    <!-- Hair -->
    <path d="M 23 15 C 23 7, 30 4, 38 6 C 44 8, 43 15, 43 15 Z" fill="#1e293b" />

    <!-- Hesitant Face (Worried/Reluctant) -->
    <circle cx="34" cy="18" r="1.5" fill="#1e293b" />
    <!-- Slight frown / straight tight-lipped mouth showing reluctance -->
    <path d="M 30 25 Q 34 23 38 25" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Furrowed brow -->
    <line x1="31" y1="15" x2="36" y2="16" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms: One hand scratching head or hesitating, one hand touching the desk stiffly -->
    <!-- Arm resting on desk / forced agreement gesture -->
    <path d="M 35 45 L 75 70 L 65 80 L 25 60 Z" fill="#10b981" />
    <circle cx="77" cy="72" r="4" fill="#fbcfe8" />
  </g>

  <!-- Desk Props: Document / Request Paper being pointed at -->
  <g transform="translate(85, 150) rotate(-10)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#f8fafc" />
    <!-- Simulated text lines (abstracted, no real letters) -->
    <line x1="6" y1="8" x2="25" y2="8" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="15" x2="29" y2="15" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="22" x2="18" y2="22" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <!-- Reluctant Checkmark / Stamp -->
    <circle cx="25" cy="33" r="6" fill="#fbbf24" opacity="0.8" />
    <path d="M 22 33 L 24 35 L 29 30" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Coffee Mug for Office Setting -->
  <rect x="130" y="160" width="14" height="18" rx="2" fill="#ef4444" />
  <path d="M 144 164 C 148 164, 148 174, 144 174" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Steam from coffee -->
  <path d="M 134 153 Q 137 148 134 143" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" />
</svg>