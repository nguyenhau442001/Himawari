<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Fire Background -->
  <path d="M120 180 C 150 150, 180 120, 160 80 C 140 40, 100 30, 80 70 C 60 110, 90 150, 120 180 Z" fill="#fb923c" opacity="0.6"/>
  <path d="M130 190 C 160 160, 190 130, 170 90 C 150 50, 110 40, 90 80 C 70 120, 100 160, 130 190 Z" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Smoke -->
  <circle cx="180" cy="50" r="20" fill="#475569" opacity="0.3"/>
  <circle cx="200" cy="70" r="15" fill="#475569" opacity="0.2"/>
  
  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Body -->
    <path d="M40 120 L80 120 L75 60 L45 60 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="45" r="15" fill="#fde68a"/>
    <!-- Arm reaching forward -->
    <path d="M75 70 L110 50 L115 60 L80 80 Z" fill="#38bdf8"/>
    <!-- Leg -->
    <path d="M45 120 L40 140 L55 140 L60 120 Z" fill="#0ea5e9"/>
    <path d="M65 120 L70 140 L85 140 L80 120 Z" fill="#0ea5e9"/>
    <!-- Helmet -->
    <path d="M45 40 A 15 15 0 0 1 75 40 L 70 35 L 50 35 Z" fill="#ec4899"/>
  </g>
  
  <!-- Debris/Sparks -->
  <circle cx="150" cy="100" r="2" fill="#fbbf24"/>
  <circle cx="160" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="140" cy="120" r="2" fill="#fbbf24"/>
  
  <!-- Foreground Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
</svg>