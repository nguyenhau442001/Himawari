<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/spotlight for central object -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Golden 5-star emblem/crest representing the nation (Guo) -->
  <g transform="translate(120, 75)">
    <!-- Main large star -->
    <polygon points="0,-16 4.7,-4.9 16.9,-4.9 7.1,2.3 10.8,13.6 0,6.7 -10.8,13.6 -7.1,2.3 -16.9,-4.9 -4.7,-4.9" fill="#FFC107"/>
  </g>

  <!-- Musical Staff Lines (Ge - Song/Anthem) -->
  <g stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="55" y1="105" x2="185" y2="105"/>
    <line x1="55" y1="115" x2="185" y2="115"/>
    <line x1="55" y1="125" x2="185" y2="125"/>
    <line x1="55" y1="135" x2="185" y2="135"/>
    <line x1="55" y1="145" x2="185" y2="145"/>
  </g>

  <!-- Treble Clef Symbol representing music/anthem -->
  <g transform="translate(68, 92) scale(0.9)" fill="#00E5FF">
    <path d="M11.5,45.5 C5.5,45.5 2,41 2,36 C2,31 6.5,27.5 11,26.5 C12.5,26.1 13.5,25.5 13.5,24 C13.5,22.5 12,21 10,21 C7,21 4.5,23 3.5,25 L1,22.5 C2.5,19.5 6,17 11,17 C16,17 19.5,20.5 19.5,25 C19.5,28 17.5,31 14.5,32.5 C13,33.2 12,34 12,35.5 C12,37 13.5,38 15.5,38 C18.5,38 21,35.5 22,32.5 L24.5,35 C23,39 18.5,45.5 11.5,45.5 Z M12.5,17 C12.5,10.5 8,4 8,1 C8,0.4 8.5,0 9.1,0 C12,0 16,3 16,8.5 C16,11.5 14.5,14.5 12.5,17 Z M10.5,53 C7.5,53 5.5,51 5.5,48.5 C5.5,46 7.5,44 10.5,44 C13.5,44 15.5,46 15.5,48.5 C15.5,51 13.5,53 10.5,53 Z"/>
  </g>

  <!-- Musical Notes (representing singing/anthem melody) -->
  <g fill="#00E5FF">
    <!-- Note 1 -->
    <ellipse cx="115" cy="120" rx="5" ry="3.5" transform="rotate(-20 115 120)"/>
    <path d="M118.5,120 L118.5,98 C118.5,96.9 119.4,96 120.5,96 L121,96 L121,120 Z"/>
    
    <!-- Note 2 -->
    <ellipse cx="145" cy="110" rx="5" ry="3.5" transform="rotate(-20 145 110)"/>
    <path d="M148.5,110 L148.5,88 C148.5,86.9 149.4,86 150.5,86 L151,86 L151,110 Z"/>

    <!-- Connecting beam for notes -->
    <polygon points="118.5,98 151,88 151,93 118.5,103"/>
  </g>

  <!-- Additional floating decorative music note -->
  <g fill="#FFC107" opacity="0.8" transform="translate(165, 125) scale(0.7)">
    <ellipse cx="6" cy="12" rx="4" ry="3" transform="rotate(-20 6 12)"/>
    <path d="M9.5,12 L9.5,2 C9.5,1.4 10,1 10.6,1 L11,1 L11,12 Z"/>
  </g>

  <!-- Microphone base / Stand symbolizing performance/singing -->
  <path d="M120,155 L120,185" stroke="#8A99AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M102,185 L138,185" stroke="#8A99AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M112,175 L128,175" stroke="#8A99AD" stroke-width="3" stroke-linecap="round"/>

</svg>