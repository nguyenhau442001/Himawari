<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient for Expectations/Future -->
    <radialGradient id="glow-grad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Golden Glow (representing high hopes / future) -->
  <circle cx="120" cy="90" r="100" fill="url(#glow-grad)"/>

  <!-- Background Environment: Cozy Study Room -->
  <!-- Wallpaper / Wall texture lines -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" opacity="0.6"/>

  <!-- Bookshelf in Background -->
  <rect x="25" y="70" width="40" height="100" rx="2" fill="#1b263b" opacity="0.7"/>
  <line x1="25" y1="95" x2="65" y2="95" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="125" x2="65" y2="125" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="150" x2="65" y2="150" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="30" y="78" width="8" height="17" rx="1" fill="#f43f5e" opacity="0.8"/>
  <rect x="40" y="75" width="10" height="20" rx="1" fill="#38bdf8" opacity="0.8"/>
  <rect x="52" y="80" width="7" height="15" rx="1" fill="#10b981" opacity="0.8"/>
  <rect x="30" y="105" width="12" height="20" rx="1" fill="#fbbf24" opacity="0.8"/>
  <rect x="44" y="108" width="9" height="17" rx="1" fill="#a855f7" opacity="0.8"/>

  <!-- Window with glowing sky/stars representing future goals -->
  <path d="M 175 45 L 215 45 L 215 130 L 175 130 Z" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <path d="M 175 45 L 215 45 L 215 130 L 175 130 Z" fill="url(#light-beam)"/>
  <!-- Window crossbars -->
  <line x1="195" y1="45" x2="195" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="87" x2="215" y2="87" stroke="#334155" stroke-width="2"/>
  <!-- Distant City/Stars glowing outside -->
  <circle cx="185" cy="60" r="1.5" fill="#fbbf24"/>
  <circle cx="205" cy="70" r="1" fill="#38bdf8"/>
  <circle cx="190" cy="100" r="1.5" fill="#f43f5e"/>

  <!-- Study Desk -->
  <rect x="65" y="145" width="115" height="10" rx="2" fill="#334155" filter="url(#shadow)"/>
  <rect x="75" y="155" width="10" height="25" fill="#1e293b"/>
  <rect x="160" y="155" width="10" height="25" fill="#1e293b"/>

  <!-- Desk Props: Lamp, Globe/Trophy representing aspirations, Open Notebook -->
  <!-- Desk Lamp -->
  <path d="M 150 145 L 155 120 L 165 120 L 170 145 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 147 115 Q 160 100 173 115 Z" fill="#f59e0b"/>
  <line x1="160" y1="145" x2="160" y2="120" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Globe / Trophy of achievement -->
  <circle cx="90" cy="125" r="12" fill="#38bdf8" opacity="0.8"/>
  <path d="M 78 125 Q 90 132 102 125" stroke="#bae6fd" stroke-width="2" fill="none"/>
  <path d="M 90 113 L 90 137" stroke="#bae6fd" stroke-width="2"/>
  <path d="M 86 137 L 94 137" stroke="#94a3b8" stroke-width="3"/>

  <!-- Open Notebook with glowing star/chart (symbolizing high expectations) -->
  <path d="M 110 148 L 135 142 L 140 160 L 115 166 Z" fill="#f8fafc"/>
  <path d="M 116 150 L 132 146" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 117 154 L 130 151" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Mini star mark in notebook -->
  <path d="M 125 156 L 126 158 L 128 158 L 127 159 L 127 161 L 125 160 L 123 161 L 123 159 L 122 158 L 124 158 Z" fill="#f59e0b"/>


  <!-- MAIN CHARACTERS: Father, Mother, and Child -->

  <!-- Father (Standing behind, supportive hand, warm expression) -->
  <g transform="translate(10, 0)">
    <!-- Father Body -->
    <path d="M 90 130 Q 95 105 110 105 Q 125 105 130 130 Z" fill="#3b82f6" filter="url(#shadow)"/>
    <!-- Father Head -->
    <circle cx="110" cy="90" r="16" fill="#fbcfe8"/>
    <!-- Father Hair -->
    <path d="M 95 88 Q 110 70 125 88 Q 120 78 110 78 Q 100 78 95 88 Z" fill="#334155"/>
    <!-- Father Glasses / Kind Eyes -->
    <circle cx="105" cy="91" r="3.5" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="115" cy="91" r="3.5" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="108.5" y1="91" x2="111.5" y2="91" stroke="#334155" stroke-width="1.5"/>
    <path d="M 107 97 Q 110 100 113 97" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Father Arm reaching forward, supporting -->
    <path d="M 100 110 Q 115 115 125 125" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="127" cy="126" r="4.5" fill="#fbcfe8"/>
  </g>

  <!-- Mother (Standing beside, gentle, encouraging gesture pointing toward the future/notebook) -->
  <g transform="translate(-10, 0)">
    <!-- Mother Body -->
    <path d="M 140 135 Q 145 110 157 110 Q 169 110 174 135 Z" fill="#ec4899" filter="url(#shadow)"/>
    <!-- Mother Head -->
    <circle cx="157" cy="95" r="15" fill="#fbcfe8"/>
    <!-- Mother Hair (Bob style) -->
    <path d="M 142 92 Q 157 78 172 92 Q 175 105 170 115 Q 157 105 144 115 Z" fill="#1e293b"/>
    <!-- Mother Face Details -->
    <circle cx="153" cy="96" r="1.5" fill="#334155"/>
    <circle cx="161" cy="96" r="1.5" fill="#334155"/>
    <path d="M 155 101 Q 157 103 159 101" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Mother Hand pointing / gesturing encouragingly -->
    <path d="M 150 120 Q 138 125 132 133" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <circle cx="130" cy="134" r="3.5" fill="#fbcfe8"/>
  </g>

  <!-- Child (Sitting at the desk, focused, studying hard to meet expectations) -->
  <g transform="translate(0, 5)">
    <!-- Child Body / Hoodie -->
    <path d="M 105 135 Q 120 125 135 135 L 142 170 L 98 170 Z" fill="#10b981" filter="url(#shadow)"/>
    <!-- Hoodie Pocket / Details -->
    <path d="M 112 155 L 128 155 L 125 167 L 115 167 Z" fill="#047857" opacity="0.5"/>
    <path d="M 120 135 L 115 145" stroke="#047857" stroke-width="2"/>
    <path d="M 120 135 L 125 145" stroke="#047857" stroke-width="2"/>

    <!-- Child Head -->
    <circle cx="120" cy="115" r="17" fill="#fbcfe8"/>
    
    <!-- Child Hair (Spiky / energetic student hair) -->
    <path d="M 103 112 Q 106 95 120 98 Q 134 95 137 112 Q 130 102 120 102 Q 110 102 103 112 Z" fill="#334155"/>

    <!-- Child Face (Diligent & Motivated expression) -->
    <circle cx="114" cy="116" r="2" fill="#334155"/>
    <circle cx="126" cy="116" r="2" fill="#334155"/>
    <!-- Focused slight smile -->
    <path d="M 118 122 Q 120 124 122 122" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy cheeks showing effort/warmth -->
    <circle cx="112" cy="119" r="2.5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="128" cy="119" r="2.5" fill="#f43f5e" opacity="0.3"/>

    <!-- Child Arms resting on desk / holding pencil -->
    <path d="M 105 140 Q 115 148 125 145" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <path d="M 135 140 Q 127 148 120 145" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <!-- Pencil -->
    <line x1="123" y1="146" x2="135" y2="152" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Symbolic Visual Metaphor: Floating Golden Stars & Ascending Sparkles (Representing "High Expectations") -->
  <g transform="translate(0, -5)">
    <!-- Star 1 (Bright) -->
    <path d="M 120 40 L 122.5 46 L 129 47 L 124 51.5 L 125.5 58 L 120 54.5 L 114.5 58 L 116 51.5 L 111 47 L 117.5 46 Z" fill="#fbbf24" filter="url(#shadow)"/>
    <!-- Star 2 (Medium) -->
    <path d="M 85 55 L 86.5 59 L 91 60 L 87.5 63 L 88.5 67 L 85 65 L 81.5 67 L 82.5 63 L 79 60 L 83.5 59 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- Star 3 (Small) -->
    <path d="M 155 60 L 156 63 L 159 63.5 L 156.5 65.5 L 157.5 68.5 L 155 67 L 152.5 68.5 L 153.5 65.5 L 151 63.5 L 154 63 Z" fill="#fbbf24" opacity="0.8"/>

    <!-- Subtle upward glowing trajectory particles -->
    <circle cx="102" cy="75" r="2" fill="#fbbf24" opacity="0.6"/>
    <circle cx="138" cy="70" r="1.5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="120" cy="78" r="1" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Foreground Vignette Framing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
</svg>