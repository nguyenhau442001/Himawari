<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow and Background Elements -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Liver (Noun representation for "肝") -->
  <g transform="translate(42, 55)">
    <!-- Main Liver Lobe (Back/Darker tone) -->
    <path d="M 65 30 C 95 25, 125 45, 135 75 C 145 105, 120 135, 90 140 C 65 144, 40 130, 30 110 C 20 90, 35 35, 65 30 Z" fill="#992D30"/>

    <!-- Main Liver Shape (Front/Primary tone) -->
    <path d="M 60 25 C 95 20, 130 40, 142 72 C 154 104, 125 138, 92 142 C 60 146, 35 130, 24 108 C 12 85, 30 30, 60 25 Z" fill="#D33F49"/>

    <!-- Anatomical Details & Highlights -->
    <!-- Gallbladder (Anatomical accent in gold/yellow-green) -->
    <path d="M 85 115 C 80 125, 75 135, 80 145 C 84 150, 92 148, 93 140 C 94 132, 90 120, 85 115 Z" fill="#E5C158"/>
    <path d="M 87 118 C 84 125, 81 133, 84 140" stroke="#C49F38" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Surface texture / highlight -->
    <path d="M 45 55 C 65 45, 95 50, 115 70" stroke="#F16B75" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Blood vessels / Vein system subtle details -->
    <path d="M 95 80 C 105 85, 115 95, 122 110" stroke="#A82830" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 95 80 C 85 85, 70 82, 60 90" stroke="#A82830" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Focus / Medical indicator (Clean minimalist bracket framing, no text) -->
  <path d="M 45 45 L 35 45 L 35 55" stroke="#E5C158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 195 45 L 205 45 L 205 55" stroke="#E5C158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 45 195 L 35 195 L 35 185" stroke="#E5C158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 195 195 L 205 195 L 205 185" stroke="#E5C158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>