<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmospheric background glow for forest ground depth -->
  <ellipse cx="120" cy="190" rx="90" ry="25" fill="#2D2318" opacity="0.6"/>
  
  <!-- Subtle silhouette tree trunks in background to provide context -->
  <g opacity="0.25">
    <rect x="50" y="90" width="10" height="90" rx="3" fill="#6C7A89"/>
    <rect x="110" y="70" width="14" height="110" rx="4" fill="#6C7A89"/>
    <rect x="180" y="100" width="8" height="80" rx="2" fill="#6C7A89"/>
  </g>

  <!-- Ground Plane representing "地" (Ground / Everywhere) -->
  <path d="M 25 185 Q 120 170 215 185 L 225 210 Q 120 225 15 210 Z" fill="#252A34"/>

  <!-- Fallen golden leaves scattered everywhere ("遍地" - covering the ground densely) -->
  <g fill-rule="evenodd">
    <!-- Deep background scattered leaves -->
    <path d="M 50 175 Q 55 170 60 174 Q 55 180 50 175 Z" fill="#D35400" transform="rotate(15 55 175)"/>
    <path d="M 85 180 Q 90 175 95 180 Q 90 185 85 180 Z" fill="#E67E22" transform="rotate(-30 90 180)"/>
    <path d="M 130 172 Q 136 168 140 175 Q 134 180 130 172 Z" fill="#F39C12" transform="rotate(45 135 175)"/>
    <path d="M 175 178 Q 181 174 185 181 Q 179 185 175 178 Z" fill="#D35400" transform="rotate(-15 180 180)"/>
    
    <!-- Midground dense carpet of golden leaves -->
    <path d="M 35 190 Q 42 183 48 192 Q 40 197 35 190 Z" fill="#F1C40F" transform="rotate(20 40 190)"/>
    <path d="M 65 187 Q 73 181 78 190 Q 70 195 65 187 Z" fill="#F39C12" transform="rotate(-40 70 190)"/>
    <path d="M 98 185 Q 106 178 112 187 Q 104 192 98 185 Z" fill="#F1C40F" transform="rotate(10 105 185)"/>
    <path d="M 145 186 Q 152 180 158 189 Q 150 194 145 186 Z" fill="#E67E22" transform="rotate(-25 150 185)"/>
    <path d="M 185 191 Q 192 184 198 193 Q 190 198 185 191 Z" fill="#F39C12" transform="rotate(35 190 190)"/>

    <!-- Foreground overlapping and prominent leaves (creating the "everywhere / full of" effect) -->
    <g>
      <!-- Leaf 1 (Left) -->
      <path d="M 45 200 Q 55 190 62 202 Q 52 210 45 200 Z" fill="#F1C40F"/>
      <path d="M 53 194 L 53 207" stroke="#D35400" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Leaf 2 (Center-Left) -->
      <path d="M 75 198 Q 87 192 92 204 Q 80 210 75 198 Z" fill="#E67E22" transform="rotate(-15 84 201)"/>
      <path d="M 84 195 L 83 207" stroke="#A04000" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Leaf 3 (Center) -->
      <path d="M 112 195 Q 124 188 130 201 Q 118 208 112 195 Z" fill="#F39C12" transform="rotate(12 121 198)"/>
      <path d="M 121 192 L 121 205" stroke="#D35400" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Leaf 4 (Center-Right) -->
      <path d="M 148 197 Q 160 190 166 203 Q 154 210 148 197 Z" fill="#F1C40F" transform="rotate(25 157 200)"/>
      <path d="M 157 194 L 156 207" stroke="#D35400" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Leaf 5 (Right) -->
      <path d="M 178 199 Q 188 192 195 204 Q 185 211 178 199 Z" fill="#E67E22" transform="rotate(-20 186 201)"/>
      <path d="M 186 195 L 185 208" stroke="#A04000" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Additional scattered small leaves for richness -->
    <path d="M 25 195 Q 30 191 34 196 Q 29 200 25 195 Z" fill="#D35400" transform="rotate(50 30 195)"/>
    <path d="M 110 205 Q 115 200 120 206 Q 114 211 110 205 Z" fill="#F1C40F" transform="rotate(-10 115 205)"/>
    <path d="M 205 197 Q 210 193 214 199 Q 209 203 205 197 Z" fill="#F39C12" transform="rotate(40 210 197)"/>
  </g>

  <!-- Gentle falling motion lines and floating leaves from above -->
  <g opacity="0.8">
    <!-- Floating leaf 1 -->
    <path d="M 75 75 Q 82 70 86 78 Q 79 82 75 75 Z" fill="#F1C40F" transform="rotate(45 80 76)"/>
    <path d="M 80 72 L 81 80" stroke="#D35400" stroke-width="1" stroke-linecap="round"/>
    <path d="M 70 65 Q 75 72 78 75" stroke="#E67E22" stroke-width="1.5" fill="none" stroke-dasharray="2 3"/>

    <!-- Floating leaf 2 -->
    <path d="M 155 95 Q 163 88 168 97 Q 160 102 155 95 Z" fill="#E67E22" transform="rotate(-20 161 95)"/>
    <path d="M 161 91 L 160 100" stroke="#A04000" stroke-width="1" stroke-linecap="round"/>
    <path d="M 150 85 Q 155 92 158 95" stroke="#F39C12" stroke-width="1.5" fill="none" stroke-dasharray="2 3"/>

    <!-- Floating leaf 3 -->
    <path d="M 110 50 Q 116 45 120 52 Q 114 56 110 50 Z" fill="#F39C12" transform="rotate(15 115 51)"/>
    <path d="M 105 40 Q 110 48 112 51" stroke="#D35400" stroke-width="1.5" fill="none" stroke-dasharray="2 3"/>
  </g>
</svg>