<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient lighting/glow for refreshing theme -->
  <circle cx="120" cy="120" r="70" fill="#00D2FF" opacity="0.08"/>

  <!-- Soda Can (罐) Graphic -->
  <g transform="translate(0, 5)">
    <!-- Can Shadow -->
    <ellipse cx="120" cy="205" rx="32" ry="8" fill="#0D0F12" opacity="0.6"/>

    <!-- Main Can Body -->
    <path d="M 90,65 L 90,175 C 90,188 102,198 120,198 C 138,198 150,188 150,175 L 150,65 Z" fill="#2E4057"/>
    <path d="M 90,65 L 90,175 C 90,188 102,198 120,198 C 138,198 150,188 150,175 L 150,65 Z" fill="url(#canGradient)" opacity="0.9"/>

    <!-- Can Highlights (Metallic Sheen) -->
    <path d="M 96,75 L 96,165 C 96,165 104,170 108,170 C 110,170 110,75 110,75 Z" fill="#FFFFFF" opacity="0.15"/>
    <path d="M 134,75 L 134,165 C 134,165 138,168 142,165 C 144,160 144,75 144,75 Z" fill="#FFFFFF" opacity="0.08"/>

    <!-- Dynamic Graphic Accent on Can (representing refreshing beverage) -->
    <path d="M 90,105 Q 120,120 150,105 L 150,135 Q 120,150 90,135 Z" fill="#FF5E62" opacity="0.8"/>
    <path d="M 105,112 C 115,115 125,115 135,112" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Can Top Rim / Neck -->
    <path d="M 92,65 L 148,65 L 145,55 L 95,55 Z" fill="#788896"/>
    <ellipse cx="120" cy="55" rx="26" ry="6" fill="#8FA1B3"/>

    <!-- Can Lid Top Surface -->
    <ellipse cx="120" cy="53" rx="24" ry="5" fill="#B0C4DE"/>
    <ellipse cx="120" cy="53" rx="20" ry="3.8" fill="#9FB2C6"/>

    <!-- Pull Tab -->
    <path d="M 116,50 L 124,50 L 126,54 C 126,56 122,57 120,57 C 118,57 114,56 114,54 Z" fill="#DFE6ED"/>
    <circle cx="120" cy="51.5" r="1.5" fill="#788896"/>

    <!-- Condensation Droplets (Indicating "冰镇" - chilled) -->
    <g fill="#00D2FF" opacity="0.85">
      <!-- Left side drops -->
      <circle cx="86" cy="90" r="2.5"/>
      <circle cx="88" cy="115" r="3"/>
      <path d="M 87,140 C 85,142 85,145 87,146 C 89,145 89,142 87,140 Z"/>
      <circle cx="91" cy="165" r="2"/>

      <!-- Right side drops -->
      <circle cx="154" cy="95" r="3"/>
      <circle cx="152" cy="125" r="2.5"/>
      <circle cx="155" cy="155" r="3.5"/>
      <path d="M 152,175 C 150,177 150,180 152,181 C 154,180 154,177 152,175 Z"/>
    </g>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="canGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="25%" stop-color="#34495E"/>
      <stop offset="50%" stop-color="#5C768D"/>
      <stop offset="75%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>
</svg>