<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk / Counter Surface -->
  <path d="M48 180H192C195.314 180 198 182.686 198 186V192C198 195.314 195.314 198 192 198H48C44.6863 198 42 195.314 42 192V186C42 182.686 44.6863 180 48 180Z" fill="#2D333B"/>
  <rect x="54" y="168" width="132" height="12" rx="3" fill="#3A424E"/>
  
  <!-- Acceptance / Registration Folder & Document (The Physical Object representing Admissions) -->
  <g transform="translate(75, 95)">
    <!-- Folder Back -->
    <path d="M0 12C0 8.68629 2.68629 6 6 6H38L52 20H84C87.3137 20 90 22.6863 90 26V74C90 77.3137 87.3137 80 84 80H6C2.68629 80 0 77.3137 0 74V12Z" fill="#2E4057"/>
    
    <!-- Document inside -->
    <rect x="12" y="24" width="66" height="72" rx="4" fill="#F0F3F6"/>
    
    <!-- Document Lines -->
    <rect x="22" y="38" width="46" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="22" y="50" width="34" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="22" y="60" width="40" height="4" rx="2" fill="#E2E8F0"/>
    
    <!-- Folder Front Pocket -->
    <path d="M0 32C0 28.6863 2.68629 26 6 66H84C87.3137 26 90 28.6863 90 32V74C90 77.3137 87.3137 80 84 80H6C2.68629 80 0 77.3137 0 74V32Z" fill="#3D5A80"/>
    
    <!-- Gold Admission Seal / Badge -->
    <circle cx="68" cy="56" r="14" fill="#FFB703"/>
    <circle cx="68" cy="56" r="10" fill="#FB8500"/>
    <!-- Checkmark on seal -->
    <path d="M62 56L66 60L75 51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stylized Enrollment / Student Representative (Person) -->
  <g transform="translate(130, 85)">
    <!-- Head -->
    <circle cx="35" cy="25" r="15" fill="#E0A96D"/>
    <!-- Hair -->
    <path d="M22 23C22 15 28 10 35 10C42 10 48 15 48 23C48 25 47 22 47 18C47 13 42 11 35 11C28 11 23 13 23 18C23 22 22 23 22 23Z" fill="#2B2D42"/>
    <!-- Torso / Clothes -->
    <path d="M15 65C15 48 24 45 35 45C46 45 55 48 55 65V70H15V65Z" fill="#00B4D8"/>
    <!-- Raised Hand / Welcoming Gesture -->
    <circle cx="56" cy="42" r="6" fill="#E0A96D"/>
  </g>

  <!-- Ambient Educational Icons / Accents -->
  <g fill="#FFB703" opacity="0.8">
    <!-- Star / Merit Symbol -->
    <path d="M35 50L38.09 56.26L45 57.27L40 62.14L41.18 69L35 65.76L28.82 69L30 62.14L25 57.27L31.91 56.26L35 50Z" transform="translate(5, 10) scale(0.6)"/>
  </g>

</svg>