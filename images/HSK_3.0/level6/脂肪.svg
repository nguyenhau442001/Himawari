<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background effect to emphasize the object -->
  <circle cx="120" cy="120" r="70" fill="#2D323F" opacity="0.4"/>

  <!-- Fat Tissue / Adipose Cell Icon (Scientific yet friendly flat vector) -->
  <g transform="translate(0, 0)">
    <!-- Main large fat cell (adipocyte) with wavy organic outline -->
    <path d="M120 55 C145 50, 165 70, 175 90 C195 105, 190 135, 175 155 C160 175, 135 185, 110 180 C85 185, 65 170, 55 150 C40 130, 45 100, 60 80 C75 60, 95 60, 120 55 Z" 
          fill="#3B2E2B" 
          stroke="#FF9F43" 
          stroke-width="4" 
          stroke-linejoin="round"/>

    <!-- Large central lipid droplet (golden yellow, iconic for fat/lipid) -->
    <path d="M120 70 C140 68, 155 83, 162 100 C172 118, 165 142, 150 158 C135 172, 110 172, 95 160 C80 148, 75 125, 82 105 C89 85, 100 72, 120 70 Z" 
          fill="#F39C12"/>

    <!-- Highlight on lipid droplet for 3D glossy flat look -->
    <path d="M100 90 C108 85, 122 86, 130 92 C122 90, 108 95, 100 90 Z" 
          fill="#FDE3A7" 
          opacity="0.6"/>

    <!-- Displaced nucleus at the edge (characteristic of adipocytes) -->
    <circle cx="148" cy="142" r="14" fill="#E74C3C" stroke="#2D323F" stroke-width="3"/>
    <circle cx="144" cy="138" r="4" fill="#FADBD8" opacity="0.8"/>

    <!-- Secondary smaller lipid droplets / vesicles floating inside -->
    <circle cx="88" cy="120" r="10" fill="#F1C40F" opacity="0.9"/>
    <circle cx="115" cy="148" r="7" fill="#F1C40F" opacity="0.9"/>
    <circle cx="130" cy="85" r="8" fill="#F1C40F" opacity="0.9"/>

    <!-- Mitochondria indicators (small pill shapes) -->
    <g fill="#9B59B6">
      <rect x="72" y="95" width="10" height="5" rx="2.5" transform="rotate(35 77 97)"/>
      <rect x="155" y="115" width="12" height="6" rx="3" transform="rotate(-25 161 118)"/>
    </g>
  </g>
</svg>