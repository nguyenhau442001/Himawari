<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient theater curtain background -->
  <path d="M0 0H240V240H0Z" fill="#1A1D24"/>
  <path d="M0 0H35L20 240H0V0Z" fill="#222630" opacity="0.5"/>
  <path d="M240 0H205L220 240H240V0Z" fill="#222630" opacity="0.5"/>

  <!-- Classical Theater Masks (Tragedy and Comedy representing "Bi kịch" / Tragedy) -->
  <!-- Comedy Mask (Subdued/Background for contrast) -->
  <g transform="translate(145, 80) rotate(12)">
    <!-- Mask Base -->
    <path d="M35 10C50 10 60 22 60 40C60 60 48 78 35 85C22 78 10 60 10 40C10 22 20 10 35 10Z" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    <!-- Smiling Eyes -->
    <path d="M22 35C22 35 25 31 29 35" stroke="#4C566A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M41 35C41 35 44 31 48 35" stroke="#4C566A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Big Smile -->
    <path d="M24 50C28 60 42 60 46 50" stroke="#4C566A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Tragedy Mask (Main Heroic Object - Center) -->
  <g transform="translate(65, 65) rotate(-8)">
    <!-- Dramatic shadow/glow -->
    <path d="M35 8C52 8 64 22 64 42C64 64 50 84 35 92C20 84 6 64 6 42C6 22 18 8 35 8Z" fill="#111318"/>
    
    <!-- Mask Base - Sleek Modern Flat Style with Gold Accent -->
    <path d="M35 10C50 10 61 24 61 43C61 63 48 81 35 88C22 81 9 63 9 43C9 24 20 10 35 10Z" fill="#D08770" stroke="#EBCB8B" stroke-width="2.5"/>
    
    <!-- Elegant Sad/Crying Eyes (Drooping downward) -->
    <path d="M20 36C23 33 28 33 31 36" stroke="#2E3440" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M40 36C43 33 48 33 51 36" stroke="#2E3440" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Tear Dropping (Symbol of Tragedy) -->
    <path d="M25 42C25 42 22 47 22 49C22 51 23.5 52 25 52C26.5 52 28 51 28 49C28 47 25 42 25 42Z" fill="#88C0D0"/>
    
    <!-- Downturned Sad Mouth -->
    <path d="M23 60C28 53 42 53 47 60" stroke="#2E3440" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ground Stage Line -->
  <line x1="50" y1="185" x2="190" y2="185" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M70 192H170" stroke="#D08770" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>