<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glowing background gradient representing global/environmental focus -->
  <circle cx="120" cy="115" r="70" fill="#FF5722" opacity="0.08"/>
  <circle cx="120" cy="115" r="45" fill="#FF5722" opacity="0.12"/>

  <!-- Globe representing the global context (环保与可持续发展) -->
  <g opacity="0.85">
    <circle cx="120" cy="115" r="50" fill="none" stroke="#2A323D" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="120" cy="115" r="42" fill="#222730" stroke="#3A4454" stroke-width="2"/>
    
    <!-- Simplified continents / eco leaves on globe -->
    <path d="M98 105 C105 95, 115 100, 122 110 C128 118, 120 128, 112 125 C104 122, 92 115, 98 105 Z" fill="#2E3846"/>
    <path d="M132 100 C140 92, 150 98, 145 108 C140 118, 130 112, 132 100 Z" fill="#2E3846"/>
    <path d="M105 130 C115 128, 125 135, 120 142 C115 148, 100 142, 105 130 Z" fill="#2E3846"/>
  </g>

  <!-- Central "Hotspot" (点 nóng / 焦点): High-contrast orange/gold focal point over the globe -->
  <g>
    <!-- Outer radar/focus pulse ring -->
    <circle cx="120" cy="115" r="26" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
    
    <!-- Main glowing hotspot core -->
    <circle cx="120" cy="115" r="18" fill="#FF5722" opacity="0.3"/>
    <circle cx="120" cy="115" r="12" fill="#FF9800"/>
    
    <!-- Inner bright center representing high focus/attention -->
    <circle cx="120" cy="115" r="6" fill="#FFF3E0"/>
  </g>

  <!-- Focused pinpoint markers/brackets around the hotspot -->
  <g stroke="#FF9800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Left -->
    <path d="M96 95 L96 91 L100 91"/>
    <!-- Top Right -->
    <path d="M144 95 L144 91 L140 91"/>
    <!-- Bottom Left -->
    <path d="M96 135 L96 139 L100 139"/>
    <!-- Bottom Right -->
    <path d="M144 135 L144 139 L140 139"/>
  </g>

  <!-- Educational UI Flashcard Label Area -->
  <rect x="55" y="185" width="130" height="28" rx="6" fill="#222831" stroke="#323B49" stroke-width="1.5"/>
  <circle cx="71" cy="199" r="4" fill="#FF9800"/>
  <rect x="83" y="196" width="84" height="6" rx="3" fill="#8892B0" opacity="0.6"/>
</svg>