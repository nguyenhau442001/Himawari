      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table -->
  <rect x="30" y="150" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="50" y="165" width="10" height="60" fill="#334155"/>
  <rect x="180" y="165" width="10" height="60" fill="#334155"/>
  
  <!-- Paper Plan -->
  <path d="M70 140 L170 140 L160 80 L80 80 Z" fill="#f8fafc"/>
  <path d="M70 140 L120 110 L170 140" fill="#e2e8f0"/>
  
