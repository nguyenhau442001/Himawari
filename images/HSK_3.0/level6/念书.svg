<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Motion and Action Lines for Dynamic Studying -->
    <path d="M 85 95 Q 120 70 155 95" fill="none" stroke="#FFA726" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M 120 45 L 120 30" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 95 50 L 85 40" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 145 50 L 155 40" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Wooden Desk / Surface -->
    <path d="M 60 165 L 180 165 L 195 190 L 45 190 Z" fill="#2C3440"/>
    <rect x="50" y="190" width="140" height="8" rx="2" fill="#3B4654"/>
    <rect x="65" y="198" width="12" height="22" fill="#242B35"/>
    <rect x="163" y="198" width="12" height="22" fill="#242B35"/>

    <!-- Open Book (The Core Object of 念书) -->
    <g transform="translate(85, 125)">
      <!-- Book Shadow -->
      <ellipse cx="35" cy="32" rx="38" ry="8" fill="#111317" opacity="0.5"/>
      <!-- Book Base / Pages -->
      <path d="M 0 30 Q 35 15 70 30 L 70 15 Q 35 0 0 15 Z" fill="#ECEFF1"/>
      <!-- Left Page -->
      <path d="M 0 15 Q 35 0 35 25 L 35 40 Q 0 25 0 15 Z" fill="#CFD8DC"/>
      <!-- Right Page -->
      <path d="M 35 25 Q 35 0 70 15 L 70 40 Q 35 25 35 25 Z" fill="#FFFFFF"/>
      
      <!-- Text Lines on Book -->
      <line x1="8" y1="20" x2="27" y2="28" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="26" x2="24" y2="34" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>
      <line x1="43" y1="20" x2="62" y2="28" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
      <line x1="43" y1="26" x2="59" y2="34" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>
      <line x1="43" y1="32" x2="55" y2="39" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Character (Student Actively Learning) -->
    <g transform="translate(30, 60)">
      <!-- Chair Back -->
      <rect x="10" y="45" width="20" height="65" rx="6" fill="#37474F"/>

      <!-- Body / Torso -->
      <path d="M 25 90 C 25 70 50 65 70 85 L 75 110 L 25 110 Z" fill="#42A5F5"/>

      <!-- Head & Hair -->
      <circle cx="50" cy="45" r="18" fill="#FFCCBC"/>
      <path d="M 32 45 C 32 25 68 25 68 45 C 68 48 65 48 65 45 C 65 30 35 30 35 45 Z" fill="#37474F"/>

      <!-- Focused Face / Glasses -->
      <rect x="52" y="39" width="9" height="5" rx="1" fill="#37474F"/>
      <line x1="48" y1="41" x2="52" y2="41" stroke="#37474F" stroke-width="1.5"/>

      <!-- Active Arms (Reading / Interacting with Book) -->
      <!-- Left Arm -->
      <path d="M 30 85 Q 45 95 65 85" fill="none" stroke="#42A5F5" stroke-width="10" stroke-linecap="round"/>
      <!-- Right Arm Reaching Forward -->
      <path d="M 65 80 Q 80 85 92 75" fill="none" stroke="#1E88E5" stroke-width="10" stroke-linecap="round"/>
      <!-- Hand pointing / holding place -->
      <circle cx="95" cy="73" r="4" fill="#FFCCBC"/>
    </g>

    <!-- Floating Knowledge Elements (Lightbulb / Idea) -->
    <g transform="translate(145, 45)">
      <circle cx="0" cy="0" r="14" fill="#FFA726" opacity="0.15"/>
      <path d="M -5 3 C -5 -3 5 -3 5 3 C 5 7 2 9 2 12 L -2 12 C -2 9 -5 7 -5 3 Z" fill="#FFA726"/>
      <rect x="-3.5" y="13" width="7" height="3" rx="1.5" fill="#B0BEC5"/>
      <line x1="-6" y1="-7" x2="-9" y2="-10" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="-7" x2="9" y2="-10" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="1" x2="12" y2="1" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>