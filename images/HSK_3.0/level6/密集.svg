<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background City Silhouette (Context: Downtown traffic) -->
  <path d="M30 190 L30 110 L50 110 L50 190 Z" fill="#252A34" opacity="0.6"/>
  <path d="M55 190 L55 80 L85 80 L85 190 Z" fill="#252A34" opacity="0.6"/>
  <path d="M90 190 L90 130 L115 130 L115 190 Z" fill="#252A34" opacity="0.6"/>
  <path d="M125 190 L125 70 L155 70 L155 190 Z" fill="#252A34" opacity="0.6"/>
  <path d="M160 190 L160 95 L190 95 L190 190 Z" fill="#252A34" opacity="0.6"/>
  <path d="M195 190 L195 120 L215 120 L215 190 Z" fill="#252A34" opacity="0.6"/>

  <!-- Road / Ground -->
  <rect x="0" y="190" width="240" height="20" fill="#121418"/>
  <!-- Road markings -->
  <line x1="20" y1="200" x2="60" y2="200" stroke="#FFD166" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="80" y1="200" x2="120" y2="200" stroke="#FFD166" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="140" y1="200" x2="180" y2="200" stroke="#FFD166" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="200" y1="200" x2="220" y2="200" stroke="#FFD166" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Dense Traffic Stream (密集 - Dày đặc, tập trung) -->
  <!-- Car 1 (Orange/Gold accent) -->
  <g transform="translate(35, 172)">
    <rect x="0" y="0" width="38" height="16" rx="4" fill="#FF9F1C"/>
    <path d="M8 0 L14 -6 L26 -6 L32 0 Z" fill="#E68A00"/>
    <circle cx="9" cy="16" r="4" fill="#121418"/>
    <circle cx="29" cy="16" r="4" fill="#121418"/>
  </g>

  <!-- Car 2 -->
  <g transform="translate(78, 170)">
    <rect x="0" y="0" width="36" height="16" rx="4" fill="#E71D36"/>
    <path d="M8 0 L13 -6 L25 -6 L30 0 Z" fill="#BD1228"/>
    <circle cx="8" cy="16" r="4" fill="#121418"/>
    <circle cx="28" cy="16" r="4" fill="#121418"/>
  </g>

  <!-- Car 3 (Overlapping closely to emphasize 'dense') -->
  <g transform="translate(110, 172)">
    <rect x="0" y="0" width="38" height="16" rx="4" fill="#2EC4B6"/>
    <path d="M10 0 L15 -6 L27 -6 L32 0 Z" fill="#209B8F"/>
    <circle cx="9" cy="16" r="4" fill="#121418"/>
    <circle cx="29" cy="16" r="4" fill="#121418"/>
  </g>

  <!-- Car 4 -->
  <g transform="translate(152, 170)">
    <rect x="0" y="0" width="36" height="16" rx="4" fill="#FFD166"/>
    <path d="M8 0 L13 -6 L23 -6 L28 0 Z" fill="#E5B849"/>
    <circle cx="8" cy="16" r="4" fill="#121418"/>
    <circle cx="28" cy="16" r="4" fill="#121418"/>
  </g>

  <!-- Car 5 (Front bumper touching) -->
  <g transform="translate(185, 172)">
    <rect x="0" y="0" width="38" height="16" rx="4" fill="#7209B7"/>
    <path d="M10 0 L15 -6 L25 -6 L30 0 Z" fill="#560792"/>
    <circle cx="9" cy="16" r="4" fill="#121418"/>
    <circle cx="29" cy="16" r="4" fill="#121418"/>
  </g>

  <!-- Second lane slightly staggered for high density impression -->
  <g transform="translate(55, 153)">
    <rect x="0" y="0" width="35" height="15" rx="4" fill="#4EA8DE"/>
    <path d="M7 0 L12 -5 L24 -5 L29 0 Z" fill="#3A86B2"/>
    <circle cx="8" cy="15" r="3.5" fill="#121418"/>
    <circle cx="27" cy="15" r="3.5" fill="#121418"/>
  </g>

  <g transform="translate(95, 153)">
    <rect x="0" y="0" width="36" height="15" rx="4" fill="#F77F00"/>
    <path d="M8 0 L13 -5 L23 -5 L28 0 Z" fill="#D66D00"/>
    <circle cx="8" cy="15" r="3.5" fill="#121418"/>
    <circle cx="28" cy="15" r="3.5" fill="#121418"/>
  </g>

  <g transform="translate(135, 153)">
    <rect x="0" y="0" width="35" height="15" rx="4" fill="#E71D36"/>
    <path d="M7 0 L12 -5 L23 -5 L28 0 Z" fill="#BD1228"/>
    <circle cx="8" cy="15" r="3.5" fill="#121418"/>
    <circle cx="27" cy="15" r="3.5" fill="#121418"/>
  </g>
</svg>