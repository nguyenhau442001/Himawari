<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.3"/>

  <!-- Ancient Pine Tree representing Longevity (Chángshòu) in Chinese culture -->
  <!-- Ground / Roots -->
  <path d="M70 190 Q120 180 170 190 L180 205 Q120 215 60 205 Z" fill="#2A4365"/>
  
  <!-- Trunk -->
  <path d="M110 190 C105 160 115 130 100 110 C95 100 90 90 95 80" stroke="#718096" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M115 150 C125 140 135 120 130 100" stroke="#718096" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Pine Foliage Clusters (Layered vibrant teal and gold accents for modern vector look) -->
