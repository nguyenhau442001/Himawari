  <circle cx="95" cy="70" r="26" fill="#319795"/>
  
  <circle cx="135" cy="90" r="28" fill="#285E61"/>
  <circle cx="135" cy="85" r="22" fill="#38B2AC"/>

  <circle cx="80" cy="105" r="24" fill="#22543D"/>
  <circle cx="80" cy="100" r="18" fill="#48BB78"/>

  <circle cx="145" cy="125" r="22" fill="#22543D"/>
  <circle cx="145" cy="120" r="16" fill="#38A169"/>

