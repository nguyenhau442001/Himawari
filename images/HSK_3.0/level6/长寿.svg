  <circle cx="120" cy="55" r="12" fill="#D69E2E"/>
  <path d="M120 40 Q125 33 122 30 Q117 33 120 40" fill="#48BB78"/>

  <!-- Crane silhouette / subtle life element soaring gently -->
  <path d="M165 75 Q175 70 185 78 Q175 76 165 75 Z" fill="#E2E8F0"/>
