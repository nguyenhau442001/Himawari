<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow to highlight the object -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Wall Switch Plate (Outer Casing) -->
  <rect x="75" y="60" width="90" height="120" rx="12" fill="#2D3340" stroke="#3A4254" stroke-width="3"/>
  <rect x="83" y="68" width="74" height="104" rx="8" fill="#222732"/>

  <!-- Toggle Switch Base / Recessed Area -->
  <rect x="100" y="85" width="40" height="70" rx="6" fill="#1A1D24"/>

  <!-- Toggle Lever (Set to "ON" position - angled upwards with gold/orange accent) -->
  <g transform="rotate(-18, 120, 120)">
    <!-- Switch Body -->
    <rect x="104" y="90" width="32" height="60" rx="4" fill="#3A4254"/>
    <!-- Metal/Glossy highlight -->
    <rect x="108" y="94" width="24" height="52" rx="2" fill="#F39C12"/>
    <!-- Center ridge -->
    <line x1="120" y1="94" x2="120" y2="146" stroke="#D68910" stroke-width="2"/>
  </g>

  <!-- Indicator Light (Small glowing orange/gold dot representing power status) -->
  <circle cx="120" cy="76" r="4" fill="#F1C40F"/>
  <circle cx="120" cy="76" r="7" fill="#F1C40F" opacity="0.3"/>

  <!-- Corner mounting screws -->
  <circle cx="90" cy="75" r="3" fill="#3A4254"/>
  <line x1="88.5" y1="73.5" x2="91.5" y2="76.5" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="88.5" y1="76.5" x2="91.5" y2="73.5" stroke="#1A1D24" stroke-width="1.5"/>

  <circle cx="150" cy="75" r="3" fill="#3A4254"/>
  <line x1="148.5" y1="73.5" x2="151.5" y2="76.5" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="148.5" y1="76.5" x2="151.5" y2="73.5" stroke="#1A1D24" stroke-width="1.5"/>

  <circle cx="90" cy="165" r="3" fill="#3A4254"/>
  <line x1="88.5" y1="163.5" x2="91.5" y2="166.5" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="88.5" y1="166.5" x2="91.5" y2="163.5" stroke="#1A1D24" stroke-width="1.5"/>

  <circle cx="150" cy="165" r="3" fill="#3A4254"/>
  <line x1="148.5" y1="163.5" x2="151.5" y2="166.5" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="148.5" y1="166.5" x2="151.5" y2="163.5" stroke="#1A1D24" stroke-width="1.5"/>

  <!-- Energy / Activation Sparkles (Focusing on the function of the switch) -->
  <path d="M 120,40 L 123,48 L 131,51 L 123,54 L 120,62 L 117,54 L 109,51 L 117,48 Z" fill="#F1C40F" opacity="0.8"/>
  <path d="M 155,95 L 157,100 L 162,102 L 157,104 L 155,109 L 153,104 L 148,102 L 153,100 Z" fill="#F39C12" opacity="0.6"/>
</svg>