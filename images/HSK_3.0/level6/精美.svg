<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow representing refinement and spotlight -->
  <circle cx="120" cy="120" r="85" fill="#242B38" opacity="0.6"/>

  <!-- Embroidery Hoop (Outer Ring) -->
  <circle cx="120" cy="120" r="76" fill="none" stroke="#8A6434" stroke-width="6"/>
  <!-- Embroidery Hoop (Inner Shadow/Ring) -->
  <circle cx="120" cy="120" r="71" fill="none" stroke="#5C4220" stroke-width="2"/>
  
  <!-- Hoop Adjustment Screw at the Top -->
  <rect x="115" y="38" width="10" height="10" fill="#A67C37" rx="2"/>
  <rect x="112" y="34" width="16" height="6" fill="#D4AF37" rx="1"/>
  <line x1="112" y1="37" x2="128" y2="37" stroke="#8A6434" stroke-width="1.5"/>

  <!-- Fabric Background inside Hoop -->
  <circle cx="120" cy="120" r="70" fill="#283244"/>

  <!-- Cross-stitch / Embroidery Texture grid pattern (subtle) -->
  <g opacity="0.15" stroke="#4A5568" stroke-width="0.5">
    <line x1="60" y1="90" x2="180" y2="90"/>
    <line x1="60" y1="110" x2="180" y2="110"/>
    <line x1="60" y1="130" x2="180" y2="130"/>
    <line x1="60" y1="150" x2="180" y2="150"/>
    <line x1="90" y1="60" x2="90" y2="180"/>
    <line x1="110" y1="60" x2="110" y2="180"/>
    <line x1="130" y1="60" x2="130" y2="180"/>
    <line x1="150" y1="60" x2="150" y2="180"/>
  </g>

  <!-- Exquisite Hand-Crafted Embroidery Motif (Plum Blossom / Botanical Art) -->
  <g>
    <!-- Branches (Sophisticated curved embroidery stitches) -->
    <path d="M 90 160 Q 110 130 120 120 T 150 85" fill="none" stroke="#8C6D53" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120 120 Q 140 130 155 125" fill="none" stroke="#8C6D53" stroke-width="2" stroke-linecap="round"/>
    <path d="M 105 140 Q 95 135 85 145" fill="none" stroke="#8C6D53" stroke-width="2" stroke-linecap="round"/>

    <!-- Delicate Embroidered Blossoms (Jīngměi - Exquisite detail) -->
    <!-- Flower 1 (Top Right) -->
    <g transform="translate(150, 85)">
      <circle cx="0" cy="-8" r="5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="7" cy="-3" r="5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="5" cy="5" r="5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="-5" cy="5" r="5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="-7" cy="-3" r="5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFE082"/>
    </g>

    <!-- Flower 2 (Bottom Right) -->
    <g transform="translate(155, 125)">
      <circle cx="0" cy="-7" r="4.5" fill="#FF8A65" opacity="0.9"/>
      <circle cx="6" cy="-2" r="4.5" fill="#FF8A65" opacity="0.9"/>
      <circle cx="4" cy="5" r="4.5" fill="#FF8A65" opacity="0.9"/>
      <circle cx="-4" cy="5" r="4.5" fill="#FF8A65" opacity="0.9"/>
      <circle cx="-6" cy="-2" r="4.5" fill="#FF8A65" opacity="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#FFCCBC"/>
    </g>

    <!-- Flower 3 (Left) -->
    <g transform="translate(85, 145)">
      <circle cx="0" cy="-7" r="4.5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="6" cy="-2" r="4.5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="4" cy="5" r="4.5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="-4" cy="5" r="4.5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="-6" cy="-2" r="4.5" fill="#FFB74D" opacity="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#FFE082"/>
    </g>

    <!-- Flower 4 (Center anchor) -->
    <g transform="translate(120, 120)">
      <circle cx="0" cy="-9" r="5.5" fill="#FFD54F" opacity="0.95"/>
      <circle cx="8" cy="-3" r="5.5" fill="#FFD54F" opacity="0.95"/>
      <circle cx="5" cy="7" r="5.5" fill="#FFD54F" opacity="0.95"/>
      <circle cx="-5" cy="7" r="5.5" fill="#FFD54F" opacity="0.95"/>
      <circle cx="-8" cy="-3" r="5.5" fill="#FFD54F" opacity="0.95"/>
      <circle cx="0" cy="0" r="3" fill="#FFF59D"/>
      <!-- Tiny intricate stitch dots -->
      <circle cx="0" cy="-3" r="0.75" fill="#5D4037"/>
      <circle cx="2" cy="1" r="0.75" fill="#5D4037"/>
      <circle cx="-2" cy="1" r="0.75" fill="#5D4037"/>
    </g>
  </g>

  <!-- Decorative Needle and Thread resting on the hoop indicating craftsmanship -->
  <g transform="rotate(25, 170, 150)">
    <!-- Golden Thread -->
    <path d="M 140 170 Q 155 160 170 150 T 200 130" fill="none" stroke="#F1C40F" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Silver Needle -->
    <line x1="165" y1="154" x2="135" y2="174" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="136" cy="173" r="1" fill="#2C3E50"/>
  </g>
</svg>