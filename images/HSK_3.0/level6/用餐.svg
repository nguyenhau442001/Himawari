<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background restaurant ambiance elements -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 6"/>
  
  <!-- Glowing warm highlight behind the main meal object -->
  <circle cx="120" cy="125" r="55" fill="#FFB703" opacity="0.08"/>

  <!-- Dining Table Surface -->
  <ellipse cx="120" cy="175" rx="85" ry="24" fill="#222733"/>
  <ellipse cx="120" cy="173" rx="80" ry="20" fill="#2C3342"/>

  <!-- Main Plate -->
  <ellipse cx="120" cy="125" rx="58" ry="32" fill="#3A4254"/>
  <ellipse cx="120" cy="123" rx="52" ry="27" fill="#F0F3F9"/>
  <ellipse cx="120" cy="125" rx="42" ry="21" fill="#E2E7EE"/>

  <!-- Delicious Hot Meal (Noodles / Bowl contents) -->
  <ellipse cx="120" cy="124" rx="34" ry="16" fill="#D97706"/>
  <!-- Food details - Noodles and toppings -->
  <path d="M96 124 C 104 116, 112 132, 120 124 C 128 116, 136 132, 144 124" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 120 C 108 128, 116 112, 124 120 C 132 128, 140 112, 148 120" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Food garnish / egg halves -->
  <ellipse cx="106" cy="120" rx="6" ry="4" fill="#FFFFFF"/>
  <ellipse cx="106" cy="120" rx="3" ry="2" fill="#F97316"/>
  <ellipse cx="134" cy="127" rx="6" ry="4" fill="#FFFFFF"/>
  <ellipse cx="134" cy="127" rx="3" ry="2" fill="#F97316"/>
  <path d="M114 128 Q 120 122 126 128" fill="#10B981" opacity="0.8"/>

  <!-- Steam rising (representing fresh, hot food being enjoyed) -->
  <path d="M110 98 Q 106 88, 114 78 Q 122 68, 118 58" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M130 96 Q 134 86, 126 76 Q 118 66, 122 56" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Cutlery: Fork (Left) -->
  <g transform="translate(42, 105)">
    <!-- Fork handle -->
    <rect x="0" y="0" width="4" height="55" rx="2" fill="#94A3B8"/>
    <!-- Fork head -->
    <path d="M-2 -12 L6 -12 C 6 -4, 2 -2, 2 0 L2 12 L0 12 L0 0 C 0 -2, -2 -4, -2 -12 Z" fill="#CBD5E1"/>
    <line x1="2" y1="-12" x2="2" y2="4" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- Cutlery: Chopsticks (Right side, diagonal) -->
  <g transform="translate(182, 90) rotate(15)">
    <rect x="0" y="0" width="4" height="75" rx="2" fill="#E2E8F0"/>
    <rect x="6" y="-5" width="4" height="75" rx="2" fill="#CBD5E1"/>
    <!-- Chopstick tips resting -->
    <circle cx="2" cy="72" rx="1.5" ry="0.8" fill="#D97706"/>
    <circle cx="8" cy="67" rx="1.5" ry="0.8" fill="#D97706"/>
  </g>

</svg>