<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Background stand / table surface -->
  <path d="M 70 190 L 170 190 C 175 190 178 193 178 196 C 178 199 175 202 170 202 L 70 202 C 65 202 62 199 62 196 C 62 193 65 190 70 190 Z" fill="#2F3643"/>
  <ellipse cx="120" cy="190" rx="55" ry="5" fill="#3A4252"/>

  <!-- Porcelain Vase (瓷器 - cíqì) -->
  <g transform="translate(0, 5)">
    <!-- Shadow / Base highlight -->
    <ellipse cx="120" cy="186" rx="30" ry="4" fill="#111317" opacity="0.5"/>

    <!-- Main Vase Body -->
    <path d="M 104 55 
             L 136 55 
             C 137 55, 139 58, 138 60
             C 136 65, 130 70, 130 75
             C 130 78, 134 82, 138 88
             C 152 110, 162 130, 162 152
             C 162 174, 144 185, 120 185
             C 96 185, 78 174, 78 152
             C 78 130, 88 110, 102 88
             C 106 82, 110 78, 110 75
             C 110 70, 104 65, 102 60
             C 101 58, 103 55, 104 55 Z" 
          fill="#F0F3F8"/>

    <!-- Left side shading for 3D curved ceramic look -->
    <path d="M 104 55 
             L 102 60
             C 101 58, 103 55, 104 55 Z" 
          fill="#D0D7DE"/>
    <path d="M 78 152 
             C 78 130, 88 110, 102 88
             C 106 82, 110 78, 110 75
             C 110 70, 104 65, 102 60
             C 97 68, 90 78, 85 92
             C 74 116, 70 135, 71 155
             C 71 166, 74 175, 78 181
             C 78 175, 78 162, 78 152 Z" 
          fill="#D9E1EC" opacity="0.7"/>

    <!-- Right side highlight for glossy ceramic sheen -->
    <path d="M 148 95 
             C 155 115, 158 132, 157 150
             C 157 168, 145 178, 130 182
             C 138 175, 148 162, 149 148
             C 150 130, 144 112, 138 98
             Z" 
          fill="#FFFFFF" opacity="0.6"/>

    <!-- Elegant Cobalt Blue / Indigo Traditional Ceramic Patterns -->
    <!-- Neck band -->
    <path d="M 108 72 C 114 74, 126 74, 132 72" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 106 76 C 114 78, 126 78, 134 76" stroke="#2563EB" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Shoulder wave motif -->
    <path d="M 94 98 Q 107 110 120 98 Q 133 110 146 98" stroke="#1D4ED8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Central body floral/cloud medallion elements (Traditional Ming/Qing style hint) -->
    <circle cx="120" cy="138" r="14" stroke="#1D4ED8" stroke-width="2.5" fill="none"/>
    <circle cx="120" cy="138" r="6" fill="#3B82F6"/>
    <path d="M 120 118 L 120 124" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 120 152 L 120 158" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 100 138 L 106 138" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 134 138 L 140 138" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>

    <!-- Base band -->
    <path d="M 85 175 C 98 179, 142 179, 155 175" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Glossy Specular Highlight (Main Glassy Reflection) -->
    <path d="M 112 68 
             C 112 68, 107 105, 114 130 
             C 116 137, 120 135, 118 128 
             C 113 105, 118 75, 118 68 Z" 
          fill="#FFFFFF" opacity="0.6" rx="2"/>
    <ellipse cx="115" cy="64" rx="2" ry="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Accent Golden / Orange Sparkles representing "精湛工艺" (Exquisite craftsmanship) -->
  <g fill="#F59E0B">
    <!-- Top right sparkle -->
    <path d="M 172 75 L 175 85 L 185 88 L 175 91 L 172 101 L 169 91 L 159 88 L 169 85 Z" opacity="0.9"/>
    <circle cx="172" cy="88" r="5" fill="#FBBF24" opacity="0.3"/>

    <!-- Lower left subtle sparkle -->
    <path d="M 62 135 L 64 141 L 70 143 L 64 145 L 62 151 L 60 145 L 54 143 L 60 141 Z" opacity="0.7"/>
  </g>
</svg>