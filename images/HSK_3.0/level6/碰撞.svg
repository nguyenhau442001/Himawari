<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ground line representing the intersection road -->
  <path d="M 30,175 L 210,175" stroke="#2D323E" stroke-width="4" stroke-linecap="round"/>
  <path d="M 115,160 L 125,160" stroke="#F59E0B" stroke-width="3" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Impact/Collision shockwave lines and dynamic aura (Background layer) -->
  <g transform="translate(120, 115)">
    <!-- Shockwave circles -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.3" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.2"/>
    
    <!-- Impact spark rays -->
    <path d="M -18,-18 L -32,-32" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 18,-18 L 32,-32" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M -20,10 L -36,18" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 20,10 L 36,18" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0,-24 L 0,-42" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Central Collision Point: Car and Electric Scooter (Bumping into each other) -->
  <g id="collision-objects">
    <!-- Compact Car (Left side moving right, slightly tilted/bounced) -->
    <g transform="translate(98, 115) rotate(-6)">
      <!-- Car Body -->
      <path d="M -32,15 L -26,-2 L -12,-14 L 14,-14 L 24,-2 L 28,15 Z" fill="#3B82F6"/>
      <!-- Car Roof / Windows -->
      <path d="M -20,-2 L -12,-12 L 10,-12 L 18,-2 Z" fill="#93C5FD"/>
      <!-- Headlight & Grille -->
      <path d="M 24,0 L 28,3 L 24,6 Z" fill="#FBBF24"/>
      <!-- Wheels -->
      <circle cx="-18" cy="16" r="6" fill="#111827"/>
      <circle cx="-18" cy="16" r="2.5" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
      <circle cx="18" cy="16" r="6" fill="#111827"/>
      <circle cx="18" cy="16" r="2.5" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Electric Scooter / E-bike (Right side moving left, impacted) -->
    <g transform="translate(142, 115) rotate(12)">
      <!-- Scooter Base / Deck -->
      <path d="M -16,16 L 14,12 L 18,16 Z" fill="#10B981"/>
      <!-- Vertical Handlebar Stem -->
      <path d="M -12,14 L -8,-12" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
      <!-- Handlebars -->
      <path d="M -16,-12 L -2,-14" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
      <!-- Scooter Wheels -->
      <circle cx="-14" cy="17" r="5" fill="#111827"/>
      <circle cx="14" cy="15" r="5" fill="#111827"/>
      <!-- Rider silhouette (falling/impacted forward) -->
      <path d="M -6,2 L -2,-6 L 6,-2 L 0,8 Z" fill="#F59E0B"/>
      <circle cx="-3" cy="-10" r="3.5" fill="#F59E0B"/>
    </g>

    <!-- Center Crash Sparks / Starburst -->
    <polygon points="120,95 125,108 138,105 127,114 133,127 120,118 107,127 113,114 102,105 115,108" fill="#FBBF24"/>
    <circle cx="120" cy="112" r="4" fill="#FFFFFF"/>
  </g>
</svg>