<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow / ambient glow -->
  <ellipse cx="120" cy="195" rx="60" ry="8" fill="#111318"/>
  <ellipse cx="120" cy="180" rx="75" ry="3" fill="#2A303C" opacity="0.4"/>

  <!-- Gymnastics Ribbon & Flowing Motion Elements -->
  <path d="M 60 160 C 90 120, 70 80, 110 90 C 150 100, 130 140, 170 110 C 195 90, 180 60, 180 50" 
        fill="none" stroke="#FF9F43" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  
  <path d="M 50 170 C 85 130, 75 75, 120 85 C 165 95, 140 135, 185 95 C 205 75, 190 55, 190 45" 
        fill="none" stroke="#FF5252" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Gymnastic Ribbon (Primary Vibrant Sweep) -->
  <path d="M 70 150 C 95 110, 85 70, 125 75 C 165 80, 145 120, 185 85 C 200 70, 185 45, 175 35" 
        fill="none" stroke="#FF9F43" stroke-width="8" stroke-linecap="round"/>

  <!-- Stylized Gymnast Character in Mid-Air Leap / Balance Pose -->
  <!-- Left/Back Leg -->
  <path d="M 105 110 L 80 135" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right/Front Leg (Extended) -->
  <path d="M 115 115 L 155 130" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Torso -->
  <path d="M 100 95 L 120 115" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round"/>

  <!-- Left/Back Arm (Extended backward) -->
