  <!-- Right/Front Arm (Extended forward/up) -->
  <path d="M 115 105 L 140 80" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="95" cy="85" r="7" fill="#F1F5F9"/>

  <!-- Focus / Motion Star Accents -->
  <path d="M 175 35 L 178 42 L 185 45 L 178 48 L 175 55 L 172 48 L 165 45 L 172 42 Z" fill="#FFD700"/>
  <path d="M 65 145 L 67 150 L 72 152 L 67 154 L 65 159 L 63 154 L 58 152 L 63 150 Z" fill="#FFD700" opacity="0.8"/>

</svg>