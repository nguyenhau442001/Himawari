<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm spotlight/ambient glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character gradients -->
    <linearGradient id="shirtMan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="shirtWoman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Plant Gradient -->
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / INTERIOR CONTEXT -->
  <!-- Back Wall & Floor Line -->
  <line x1="20" y1="180" x2="220" y2="180" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  
  <!-- Wall Decor: Window with city/night ambient -->
  <rect x="25" y="35" width="50" height="70" rx="6" fill="#090d16" stroke="#334155" stroke-width="2" />
  <line x1="50" y1="35" x2="50" y2="105" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="70" x2="75" y2="70" stroke="#334155" stroke-width="1.5" />
  <!-- Window glow -->
  <circle cx="38" cy="50" r="4" fill="#fbbf24" opacity="0.6" />
  <circle cx="62" cy="85" r="3" fill="#38bdf8" opacity="0.5" />

  <!-- Potted Plant in Corner (adds life & context) -->
  <path d="M 195 180 L 205 150 L 215 180 Z" fill="#64748b" />
  <path d="M 205 150 Q 190 120 180 110" stroke="url(#plantGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="178" cy="108" r="8" fill="#10b981" />
  <path d="M 205 150 Q 215 125 225 115" stroke="url(#plantGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="227" cy="113" r="7" fill="#34d399" />
  <path d="M 205 150 Q 205 120 205 100" stroke="url(#plantGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="205" cy="96" r="9" fill="#059669" />

  <!-- Low Coffee Table in Center (Grounding the scene) -->
  <rect x="85" y="165" width="70" height="25" rx="4" fill="#475569" filter="url(#softShadow)" />
  <rect x="95" y="155" width="20" height="12" rx="2" fill="#94a3b8" /> <!-- Teacup -->
  <path d="M 135 160 Q 140 160 140 165 Q 140 170 135 170" fill="none" stroke="#94a3b8" stroke-width="1.5" /> <!-- Handle -->


  <!-- MAIN CHARACTERS (Awkward Social/Work Situation) -->
  
  <!-- CHARACTER 1: Man on the Left (Scratching head, looking away nervously) -->
  <g transform="translate(15, 0)">
    <!-- Body & Legs -->
    <path d="M 50 180 L 45 135 L 75 135 L 70 180 Z" fill="#1e293b" />
    <rect x="52" y="130" width="18" height="55" rx="6" fill="url(#shirtMan)" />
    
    <!-- Shoes -->
    <ellipse cx="48" cy="182" rx="8" ry="4" fill="#0f172a" />
    <ellipse cx="72" cy="182" rx="8" ry="4" fill="#0f172a" />

    <!-- Head & Hair -->
    <circle cx="62" cy="105" r="16" fill="#f8fafc" /> <!-- Skin base -->
    <path d="M 46 105 Q 46 90 62 90 Q 78 90 78 105 Q 75 96 62 95 Q 49 96 46 105 Z" fill="#334155" /> <!-- Hair -->

    <!-- Facial Expression: Nervous, eyes looking away (right), sweat drop -->
    <!-- Eyes (looking sideways) -->
    <circle cx="68" cy="104" r="1.5" fill="#0f172a" />
    <circle cx="73" cy="104" r="1.5" fill="#0f172a" />
    <!-- Awkward smile (small wavy/flat line) -->
    <path d="M 66 112 Q 70 110 74 112" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Sweat Drop (Classic awkward indicator) -->
    <path d="M 78 96 C 78 96 82 101 82 104 C 82 106 80 108 78 108 C 76 108 74 106 74 104 C 74 101 78 96 78 96 Z" fill="#38bdf8" opacity="0.8" />

    <!-- Arms: Left arm down, Right arm raised scratching back of head -->
    <path d="M 52 135 L 42 160" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <path d="M 68 135 L 75 105 L 68 98" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>


  <!-- CHARACTER 2: Woman on the Right (Staring awkwardly, holding hands stiffly) -->
  <g transform="translate(135, 0)">
    <!-- Body & Legs -->
    <path d="M 35 180 L 30 135 L 60 135 L 55 180 Z" fill="#831843" />
    <rect x="33" y="130" width="20" height="55" rx="6" fill="url(#shirtWoman)" />

    <!-- Shoes -->
    <ellipse cx="37" cy="182" rx="7" ry="4" fill="#0f172a" />
    <ellipse cx="57" cy="182" rx="7" ry="4" fill="#0f172a" />

    <!-- Head & Hair (Ponytail or bob) -->
    <circle cx="45" cy="105" r="16" fill="#fed7aa" /> <!-- Skin -->
    <path d="M 29 105 Q 29 88 45 88 Q 61 88 61 105 Q 61 115 57 120 L 63 115 Q 61 100 55 92 Z" fill="#78350f" /> <!-- Hair -->

    <!-- Facial Expression: Stiff smile, wide eyes looking straight -->
    <circle cx="41" cy="104" r="1.5" fill="#0f172a" />
    <circle cx="49" cy="104" r="1.5" fill="#0f172a" />
    <!-- Awkward tight smile -->
    <path d="M 40 112 Q 45 115 50 112" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Slight blush of embarrassment -->
    <circle cx="38" cy="108" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="52" cy="108" r="3" fill="#f43f5e" opacity="0.4" />

    <!-- Arms: Both hands clasped awkwardly in front -->
    <path d="M 38 135 L 30 150 L 42 155" stroke="#db2777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 52 135 L 60 150 L 46 155" stroke="#db2777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- ATMOSPHERIC "AWKWARDNESS" VISUAL CUES -->
  <!-- Floating abstract silence dots / sweat marks between them -->
  <g transform="translate(112, 85)" opacity="0.7">
    <circle cx="0" cy="0" r="2.5" fill="#94a3b8" />
    <circle cx="8" cy="-6" r="3.5" fill="#94a3b8" />
    <circle cx="16" cy="-14" r="4.5" fill="#94a3b8" />
  </g>
  
</svg>