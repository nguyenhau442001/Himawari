<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#2D333F" opacity="0.4"/>

  <!-- Conceptual illustration: A physical, iconic juice bottle representing "tiānjiā" (adding ingredients) -->
  <g transform="translate(0, 0)">
    <!-- Droplet/Addition elements floating in -->
    <g transform="translate(0, -5)">
      <!-- Drop 1 (Amber/Gold accent) -->
      <path d="M 120 45 C 120 45, 127 55, 127 61 C 127 65, 123 68, 120 68 C 117 68, 113 65, 113 61 C 113 55, 120 45, 120 45 Z" fill="#FFB703"/>
      <!-- Plus motion lines -->
      <path d="M 104 53 L 112 53" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 108 49 L 108 57" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Glass Bottle Body -->
    <rect x="95" y="85" width="50" height="110" rx="10" fill="#2E384D" stroke="#4C5D7A" stroke-width="3"/>
    
    <!-- Bottle Neck & Cap -->
    <rect x="105" y="70" width="30" height="15" rx="3" fill="#3B4861"/>
    <rect x="101" y="60" width="38" height="12" rx="4" fill="#FFB703"/>

    <!-- Juice Liquid Inside (Natural Fruit Juice Context) -->
    <path d="M 98 120 L 98 182 C 98 187, 102 192, 107 192 L 133 192 C 138 192, 142 187, 142 182 L 142 120 Z" fill="#FF7849"/>

    <!-- Leaf icon on bottle (Natural product) -->
    <path d="M 120 100 C 120 100, 128 102, 129 110 C 130 115, 125 120, 120 120 C 115 120, 110 115, 111 110 C 112 102, 120 100, 120 100 Z" fill="#2EC4B6" opacity="0.9"/>
    <path d="M 120 110 L 120 120" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Large prominent Plus Icon overlaying the addition concept -->
    <circle cx="155" cy="115" r="18" fill="#1A1D24" stroke="#FFB703" stroke-width="3"/>
    <path d="M 147 115 L 163 115" stroke="#FFB703" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 155 107 L 155 123" stroke="#FFB703" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>