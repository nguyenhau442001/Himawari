<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Cityscape silhouette -->
  <path d="M20 180 L80 140 L140 180 Z" fill="#334155"/>
  <path d="M160 190 L220 150 L240 240 L140 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- The Chart/Data representation -->
  <rect x="30" y="60" width="180" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- The "Service Industry" growth visual (The "比重" concept) -->
  <!-- Pie chart segment growing -->
  <path d="M120 120 L180 120 A60 60 0 0 1 120 180 Z" fill="#10b981"/>
  <path d="M120 120 L120 60 A60 60 0 0 1 180 120 Z" fill="#38bdf8"/>
  <path d="M120 120 L60 150 A60 60 0 0 0 120 180 Z" fill="#fb923c"/>
  
  <!-- Character: Professional pointing at the growth -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M5 40 Q20 35 35 40 L30 80 M10 80 L20 60 L30 80" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Arm pointing -->
    <path d="M35 25 L60 10" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Growth Arrow -->
  <path d="M190 70 L210 50 L210 90 M210 50 L170 90" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="180" r="4" fill="#fbbf24"/>
  <circle cx="40" cy="200" r="3" fill="#38bdf8"/>
</svg>