<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative motion lines representing high speed -->
  <g opacity="0.3">
    <line x1="20" y1="90" x2="100" y2="90" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="20 10"/>
    <line x1="40" y1="150" x2="140" y2="150" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 15"/>
    <line x1="10" y1="120" x2="80" y2="120" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="15 8"/>
  </g>

  <!-- Speed lines (trailing effect) -->
  <path d="M 20 110 L 80 110" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
  <path d="M 10 135 L 70 135" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.15"/>
  <path d="M 30 85 L 90 85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>

  <!-- High-Speed Bullet Train (Physical Object representing Shísù / Speed) -->
  <g transform="translate(30, 75)">
    <!-- Train Body (Sleek Modern Design) -->
    <path d="M 0 45 C 30 45, 80 38, 120 32 C 150 28, 175 22, 190 20 C 195 19, 198 22, 196 26 C 190 38, 175 48, 150 50 C 90 53, 30 52, 0 51 Z" fill="#F0F4F8"/>
    
    <!-- Train Underbelly / Chassis -->
    <path d="M 15 51 L 180 50 L 175 58 L 20 58 Z" fill="#334155"/>

    <!-- Accent Red/Orange Stripe (High Speed Theme) -->
    <path d="M 5 46 C 40 46, 110 40, 155 35 C 170 33, 185 30, 192 28 C 193 30, 191 33, 188 35 C 172 40, 150 44, 125 46 C 70 49, 25 49, 5 49 Z" fill="#FF5722"/>

    <!-- Windscreen / Driver Cabin Windows -->
    <path d="M 175 25 C 182 23, 188 22, 192 24 C 191 27, 187 31, 178 33 C 175 30, 174 27, 175 25 Z" fill="#0F172A"/>
    <path d="M 140 33 C 155 31, 165 30, 170 30 C 170 34, 165 36, 140 38 Z" fill="#0F172A"/>
    <path d="M 110 36 C 125 35, 130 35, 135 35 C 135 39, 130 40, 110 41 Z" fill="#0F172A"/>
    <path d="M 80 39 C 95 38, 100 38, 105 38 C 105 42, 100 43, 80 43 Z" fill="#0F172A"/>

    <!-- Nose Cone Detail -->
    <path d="M 190 20 C 196 19, 198 22, 196 26 C 194 28, 192 28, 190 27 Z" fill="#E2E8F0"/>
  </g>

  <!-- Dynamic Motion / Speed Effect Rays (Right side) -->
  <g stroke="#00E5FF" stroke-width="2" stroke-linecap="round">
    <line x1="215" y1="95" x2="230" y2="95"/>
    <line x1="220" y1="110" x2="235" y2="110"/>
    <line x1="210" y1="125" x2="225" y2="125"/>
  </g>

  <!-- Sleek Minimalist Ground Track -->
  <rect x="20" y="145" width="200" height="3" rx="1.5" fill="#475569"/>
  <rect x="35" y="150" width="170" height="2" rx="1" fill="#334155"/>
  
  <!-- Track ties / sleepers -->
  <g fill="#64748B" opacity="0.6">
    <rect x="50" y="148" width="4" height="6" rx="1"/>
    <rect x="75" y="148" width="4" height="6" rx="1"/>
    <rect x="100" y="148" width="4" height="6" rx="1"/>
    <rect x="125" y="148" width="4" height="6" rx="1"/>
    <rect x="150" y="148" width="4" height="6" rx="1"/>
    <rect x="175" y="148" width="4" height="6" rx="1"/>
  </g>
</svg>