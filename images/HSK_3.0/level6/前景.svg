<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="hologramGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Background Environment / Modern Office Interior -->
  <g id="interior">
    <!-- Large Panoramic Window -->
    <path d="M45,20 L195,20 L195,145 L45,145 Z" fill="url(#windowGlow)" stroke="#334155" stroke-width="2"/>
    
    <!-- Cityscape Silhouette Outside -->
    <path d="M45,115 L55,100 L60,100 L65,115 L75,90 L85,90 L90,120 L105,80 L115,80 L120,105 L135,95 L145,110 L155,75 L170,75 L175,95 L185,85 L195,115 L195,145 L45,145 Z" fill="#0f172a" opacity="0.6"/>

    <!-- Rising Sun / Bright Future Horizon -->
    <circle cx="120" cy="115" r="22" fill="#f59e0b" opacity="0.8" filter="url(#glow)"/>
    <path d="M70,115 L170,115" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Window Pane Dividers -->
    <line x1="120" y1="20" x2="120" y2="145" stroke="#334155" stroke-width="2"/>
    <line x1="45" y1="85" x2="195" y2="85" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Holographic Growth Chart (Foreground / Symbol of 'Qianjing' - Future/Prospects) -->
  <g id="hologram-chart" transform="translate(120, 105)">
    <!-- Base Projector Emitter -->
    <ellipse cx="0" cy="40" rx="28" ry="7" fill="#0284c7" opacity="0.6"/>
    <ellipse cx="0" cy="40" rx="20" ry="4" fill="#38bdf8" filter="url(#glow)"/>
    
    <!-- Upward Growth Light Beams -->
    <polygon points="-20,40 -35,-15 35,-15 20,40" fill="url(#hologramGrad)"/>

    <!-- Growth Graph Line & Nodes -->
    <path d="M-25,25 L-12,12 L2,18 L18,-5 L30,-22" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Data Points on Chart -->
    <circle cx="-25" cy="25" r="3" fill="#ffffff"/>
    <circle cx="-12" cy="12" r="3" fill="#ffffff"/>
    <circle cx="2" cy="18" r="3" fill="#ffffff"/>
    <circle cx="18" cy="-5" r="3.5" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="30" cy="-22" r="4" fill="#10b981" filter="url(#glow)"/>

    <!-- Floating Upward Trend Arrow -->
    <path d="M22,-30 L32,-30 L32,-20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="-26" x2="31" y2="-29" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Desk Surface -->
  <rect x="20" y="185" width="200" height="40" rx="4" fill="url(#deskGrad)"/>
  <rect x="20" y="185" width="200" height="3" fill="#475569"/>

  <!-- Context Props on Desk -->
  <g id="desk-props">
    <!-- Laptop -->
    <path d="M50,185 L78,185 L84,172 L44,172 Z" fill="#64748b"/>
    <path d="M40,185 L88,185 L92,187 L36,187 Z" fill="#94a3b8"/>
    <!-- Laptop screen glow -->
    <path d="M47,174 L75,174 L73,157 L49,157 Z" fill="#0f172a"/>
    <path d="M51,160 L71,160 L70,171 L52,171 Z" fill="#38bdf8" opacity="0.3"/>

    <!-- Coffee Mug -->
    <rect x="185" y="168" width="12" height="17" rx="2" fill="#f43f5e"/>
    <path d="M197,172 C201,172 201,180 197,180" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <!-- Steam from coffee -->
    <path d="M189,162 C191,159 188,156 191,152" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Main Character (Confident Professional leaning forward, looking at prospects) -->
  <g id="character" transform="translate(0, 5)">
    <!-- Body / Torso -->
    <path d="M92,160 C92,145 105,135 120,135 C135,135 148,145 148,160 L155,190 L85,190 Z" fill="#0284c7"/>
    <!-- Suit Jacket Lapels / Shirt -->
    <path d="M120,135 L112,165 L128,165 Z" fill="#ffffff"/>
    <path d="M106,140 L112,165 L98,162 Z" fill="#0369a1"/>
    <path d="M134,140 L128,165 L142,162 Z" fill="#0369a1"/>

    <!-- Neck -->
    <rect x="114" y="126" width="12" height="14" fill="#fbcfe8" rx="4"/>

    <!-- Head -->
    <circle cx="120" cy="108" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish dark modern cut) -->
    <path d="M102,108 C102,96 110,90 120,90 C130,90 138,96 138,108 C138,110 137,112 136,112 C134,102 128,95 120,94 C112,95 106,102 104,112 C103,112 102,110 102,108 Z" fill="#334155"/>

    <!-- Facial Expressions (Confident, smiling, optimistic) -->
    <!-- Eyes (happy curves) -->
    <path d="M112,106 C114,108 116,108 118,106" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M122,106 C124,108 126,108 128,106" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Gentle Smile -->
    <path d="M116,114 C118,117 122,117 124,114" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="111" cy="112" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="129" cy="112" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Arms & Gestures -->
    <!-- Left Arm (resting on desk) -->
    <path d="M96,148 L75,165 L82,175" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="175" r="6" fill="#fbcfe8"/>

    <!-- Right Arm (pointing / presenting forward excitedly) -->
    <path d="M144,148 L165,155 L160,140" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="160" cy="140" r="6" fill="#fbcfe8"/>
  </g>

  <!-- Secondary Ambient Lighting / Vignette -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>