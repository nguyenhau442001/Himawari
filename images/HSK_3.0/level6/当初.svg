<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Amber Glow for "Then / Memory" feel -->
    <radialGradient id="memoryGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients (Left - Blue theme) -->
    <linearGradient id="jacketLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradients (Right - Coral/Orange theme) -->
    <linearGradient id="jacketRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Cafe Warmth Accent -->
    <linearGradient id="windowWarmth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Memory Glow -->
  <circle cx="120" cy="110" r="100" fill="url(#memoryGlow)"/>

  <!-- ENVIRONMENT / CONTEXT: Cozy Cafe / Park Bench Setting -->
  <!-- Background Wall / Architecture -->
  <rect x="20" y="30" width="200" height="150" rx="12" fill="#1e293b" opacity="0.4"/>
  
  <!-- Window Grid casting warm light -->
  <rect x="35" y="45" width="70" height="90" rx="4" fill="url(#windowWarmth)" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="45" x2="70" y2="135" stroke="#334155" stroke-width="2"/>
  <line x1="35" y1="90" x2="105" y2="90" stroke="#334155" stroke-width="2"/>

  <!-- Second Window / Interior Prop -->
  <rect x="135" y="45" width="70" height="90" rx="4" fill="url(#windowWarmth)" stroke="#334155" stroke-width="2"/>
  <line x1="170" y1="45" x2="170" y2="135" stroke="#334155" stroke-width="2"/>
  <line x1="135" y1="90" x2="205" y2="90" stroke="#334155" stroke-width="2"/>

  <!-- Indoor Ambient Details (Potted Plant on Shelf) -->
  <path d="M105,65 L135,65 L130,75 L110,75 Z" fill="#64748b"/>
  <path d="M120,65 C115,55 110,45 120,40 C130,45 125,55 120,65 Z" fill="#10b981"/>
  <path d="M115,65 C105,60 100,50 110,45 C115,50 115,60 115,65 Z" fill="#059669"/>

  <!-- Floor / Ground Plane -->
  <path d="M0,180 L240,180 L240,240 L0,240 Z" fill="#090d16"/>
  <ellipse cx="120" cy="180" rx="110" ry="10" fill="#020617"/>

  <!-- Central Bench / Seating -->
  <rect x="60" y="155" width="120" height="8" rx="3" fill="#475569"/>
  <rect x="75" y="163" width="10" height="25" rx="2" fill="#334155"/>
  <rect x="155" y="163" width="10" height="25" rx="2" fill="#334155"/>

  <!-- CHARACTER 1 (Left): Looking away, uninterested / unaware ("did not know each other") -->
  <g transform="translate(0, 0)">
    <!-- Body / Torso -->
    <path d="M 70,185 C 65,160 85,145 95,135 L 105,155 C 105,170 100,185 95,185 Z" fill="url(#jacketLeft)"/>
    <!-- Head -->
    <circle cx="85" cy="120" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 70,118 C 72,100 98,100 100,118 C 95,110 75,110 70,118 Z" fill="#0f172a"/>
    <!-- Face Profile (Looking LEFT, completely away from other character) -->
    <path d="M 73,120 Q 70,123 74,126" stroke="#f43f5e" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- Neutral closed eye -->
    <!-- Headphones around neck (Context prop) -->
    <path d="M 75,133 C 85,140 95,133 95,133" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="75" cy="133" r="4" fill="#0f172a"/>
    <circle cx="95" cy="133" r="4" fill="#0f172a"/>
    <!-- Posture lines (Cold shoulder / distance) -->
    <path d="M 85,145 L 75,160" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2 (Right): Looking away in the opposite direction -->
  <g transform="translate(0, 0)">
    <!-- Body / Torso -->
    <path d="M 170,185 C 175,160 155,145 145,135 L 135,155 C 135,170 140,185 145,185 Z" fill="url(#jacketRight)"/>
    <!-- Head -->
    <circle cx="155" cy="120" r="15" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 140,118 C 142,98 168,98 170,118 C 165,108 145,108 140,118 Z" fill="#78350f"/>
    <!-- Face Profile (Looking RIGHT, complete estrangement) -->
    <path d="M 167,120 Q 170,123 166,126" stroke="#c2410c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Scarf (Context prop for weather/mood) -->
    <path d="M 143,132 C 150,140 160,140 167,132 L 163,145 C 155,148 148,145 143,145 Z" fill="#ec4899"/>
    <!-- Posture lines -->
    <path d="M 155,145 L 165,160" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- SYMBOLIC VISUAL SEPARATION / DISTANCE -->
  <!-- Dotted spatial gap line emphasizing "did not know each other / far apart" -->
  <line x1="120" y1="100" x2="120" y2="160" stroke="#64748b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Context Props: Coffee cups on the bench edges representing individual, disconnected lives -->
  <!-- Left cup -->
  <rect x="52" y="165" width="10" height="15" rx="2" fill="#f8fafc"/>
  <path d="M 62,168 C 66,168 66,175 62,175" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M 52,165 L 62,165" stroke="#38bdf8" stroke-width="2"/>

  <!-- Right cup -->
  <rect x="178" y="165" width="10" height="15" rx="2" fill="#f8fafc"/>
  <path d="M 178,168 C 174,168 174,175 178,175" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M 178,165 L 188,165" stroke="#ea580c" stroke-width="2"/>

  <!-- Foreground Atmospheric Particles (Subtle floating dust catching the warm glow) -->
  <circle cx="90" cy="80" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="150" cy="70" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="110" cy="95" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="135" cy="85" r="1.5" fill="#fbbf24" opacity="0.7"/>

</svg>