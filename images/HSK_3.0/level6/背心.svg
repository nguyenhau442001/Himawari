<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to highlight the object -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Main Object Group: "背心" (Áo ba lỗ / Áo may ô) -->
  <g transform="translate(120, 120)">
    <!-- Tank top (Áo ba lỗ) body shape -->
    <!-- Using a clean, symmetric flat vector design with vibrant contrasting colors -->
    <path d="M -36 -68 
             C -36 -68, -26 -74, 0 -74 
             C 26 -74, 36 -68, 36 -68
             C 42 -45, 48 -15, 52 20
             C 55 50, 48 76, 42 82
             C 36 88, -36 88, -42 82
             C -48 76, -55 50, -52 20
             C -48 -15, -42 -45, -36 -68 Z" 
          fill="#3B82F6" />
          
    <!-- Neckline cutout (Scoop neck front) -->
    <path d="M -22 -72 
             C -22 -52, 22 -52, 22 -72 
             C 12 -76, -12 -76, -22 -72 Z" 
          fill="#1A1D24" />

    <!-- Left Armhole cutout -->
    <path d="M -38 -55 
             C -38 -40, -54 -25, -48 5
             C -52 -10, -48 -35, -34 -58 Z" 
          fill="#1A1D24" />

    <!-- Right Armhole cutout -->
    <path d="M 38 -55 
             C 38 -40, 54 -25, 48 5
             C 52 -10, 48 -35, 34 -58 Z" 
          fill="#1A1D24" />

    <!-- Ribbing / Seam details (Collar trim) -->
    <path d="M -22 -72 C -22 -52, 22 -52, 22 -72" 
          stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          
    <!-- Left armhole trim -->
    <path d="M -36 -52 C -42 -35, -48 -15, -46 10" 
          stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Right armhole trim -->
    <path d="M 36 -52 C 42 -35, 48 -15, 46 10" 
          stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Dynamic fabric fold lines for flat-design depth -->
    <path d="M -15 -10 C -5 -5, 5 -5, 12 -10" 
          stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M -20 20 C -5 25, 10 25, 22 18" 
          stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M -25 50 C -8 55, 10 55, 28 48" 
          stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Modern accent graphic (Subtle chest icon or stripe to elevate flat design) -->
    <g transform="translate(0, -15)" opacity="0.8">
      <circle cx="0" cy="0" r="12" fill="#F59E0B" />
      <path d="M -5 0 L -1 4 L 6 -3" stroke="#1A1D24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Decorative floating breeze/motion lines indicating lightness/summer context ("夏天...凉快") -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none">
    <path d="M 45 90 Q 55 95 45 100"/>
    <path d="M 35 110 Q 42 115 35 120"/>
    <path d="M 195 90 Q 185 95 195 100"/>
    <path d="M 205 110 Q 198 115 205 120"/>
  </g>
</svg>