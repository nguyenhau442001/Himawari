<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="40" y="150" width="160" height="10" rx="2" fill="#475569"/>
  <rect x="50" y="160" width="10" height="60" rx="2" fill="#334155"/>
  <rect x="180" y="160" width="10" height="60" rx="2" fill="#334155"/>
  
  <!-- Broken Vase (The Error) -->
  <g transform="translate(70, 135)">
    <path d="M0 0 L20 0 L15 15 L5 15 Z" fill="#ec4899" opacity="0.6"/>
    <path d="M22 5 L25 10 L20 12 Z" fill="#ec4899" opacity="0.6"/>
  </g>
  
  <!-- Character: The Person fixing -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <circle cx="0" cy="40" r="25" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-15 -20 A 20 20 0 0 1 15 -20" fill="#fb923c"/>
    <!-- Arms working -->
    <path d="M-20 30 L-40 50" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 30 L40 50" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Hands holding glue/tool -->
    <circle cx="-45" cy="55" r="6" fill="#fbbf24"/>
    <circle cx="45" cy="55" r="6" fill="#fbbf24"/>
  </g>
  
  <!-- Glue Bottle -->
  <rect x="150" y="130" width="15" height="20" rx="2" fill="#10b981"/>
  <rect x="155" y="125" width="5" height="5" fill="#10b981"/>
  
  <!-- Ambient light/glow -->
  <circle cx="120" cy="140" r="40" fill="#fbbf24" opacity="0.05"/>
</svg>