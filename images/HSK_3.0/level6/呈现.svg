<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Cityscape Background -->
  <path d="M20 180 L80 120 L140 160 L200 110 L220 240 Z" fill="#334155"/>
  <rect x="40" y="140" width="20" height="60" fill="#475569"/>
  <rect x="160" y="130" width="30" height="80" fill="#475569"/>
  
  <!-- Modern Building Facade (The "New Look") -->
  <rect x="70" y="80" width="100" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="85" y="95" width="30" height="30" fill="#fbbf24" opacity="0.8"/>
  <rect x="125" y="95" width="30" height="30" fill="#fbbf24" opacity="0.8"/>
  <rect x="85" y="140" width="30" height="40" fill="#38bdf8" opacity="0.6"/>
  <rect x="125" y="140" width="30" height="40" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Character: Person pointing at the new city -->
  <g transform="translate(40, 150)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <path d="M20 35 L20 70 M20 45 L5 60 M20 45 L35 60 M5 80 L20 70 L35 80" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <path d="M35 40 L60 20" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="190" cy="50" r="4" fill="#ec4899"/>
  <circle cx="210" cy="70" r="3" fill="#10b981"/>
  <path d="M180 30 Q200 20 220 40" stroke="#fb923c" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Ground -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a"/>
</svg>