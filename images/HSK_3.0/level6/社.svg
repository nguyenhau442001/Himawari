<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background subtle warmth for community/clubhouse -->
    <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>
    
    <!-- Club / Building Structure (Tòa soạn / Câu lạc bộ) -->
    <!-- Main building body -->
    <path d="M 80,100 L 160,100 L 160,180 L 80,180 Z" fill="#2E364F"/>
    
    <!-- Roof / Architectural accent (representing community center/office) -->
    <path d="M 70,100 L 120,65 L 170,100 Z" fill="#FF8C42"/>
    <path d="M 120,65 L 170,100 L 160,100 L 120,72 Z" fill="#E6732B" opacity="0.5"/>

    <!-- Glass door / Entrance -->
    <path d="M 106,140 L 134,140 L 134,180 L 106,180 Z" fill="#1A1D24"/>
    <rect x="112" y="148" width="16" height="24" rx="2" fill="#4ECCA3" opacity="0.8"/>

    <!-- Windows (representing rooms/offices in a club or organization) -->
    <rect x="92" y="112" width="14" height="18" rx="2" fill="#FFD166"/>
    <rect x="134" y="112" width="14" height="18" rx="2" fill="#FFD166"/>

    <!-- Photography Club elements (camera symbolizing the context: photography club / 摄影社) -->
    <!-- Tripod -->
    <path d="M 120,135 L 95,195" stroke="#A0AABF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120,135 L 145,195" stroke="#A0AABF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120,135 L 120,198" stroke="#A0AABF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Camera Body mounted on tripod in front of the club -->
    <rect x="105" y="122" width="30" height="20" rx="4" fill="#E0E6ED"/>
    <circle cx="120" cy="132" r="7" fill="#1A1D24"/>
    <circle cx="120" cy="132" r="4" fill="#4ECCA3"/>
    <rect x="112" y="118" width="6" height="4" rx="1" fill="#E0E6ED"/>

    <!-- People silhouettes gathered outside/inside the club (representing group/association/ đoàn thể) -->
    <!-- Person 1 -->
    <circle cx="68" cy="165" r="7" fill="#FF8C42"/>
    <path d="M 58,185 C 58,175 78,175 78,185 Z" fill="#FF8C42"/>

    <!-- Person 2 -->
    <circle cx="172" cy="165" r="7" fill="#4ECCA3"/>
    <path d="M 162,185 C 162,175 182,175 182,185 Z" fill="#4ECCA3"/>

    <!-- Decorative connection nodes floating above to signify organization/society -->
    <circle cx="120" cy="45" r="4" fill="#FFD166"/>
    <circle cx="95" cy="52" r="3" fill="#4ECCA3" opacity="0.7"/>
    <circle cx="145" cy="52" r="3" fill="#FF8C42" opacity="0.7"/>
    <line x1="120" y1="45" x2="95" y2="52" stroke="#A0AABF" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="120" y1="45" x2="145" y2="52" stroke="#A0AABF" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
</svg>