<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "成" (Result / Completion / Formation of a new entity/trend) -->
  <!-- We visualize a structured, completed modern sculpture or digital monument rising and solidifying, representing a completed achievement/trend -->
  
  <g transform="translate(0, 10)">
    <!-- Floor/Platform representing the foundation -->
    <ellipse cx="120" cy="180" rx="70" ry="14" fill="#252A34"/>
    <ellipse cx="120" cy="180" rx="50" ry="9" fill="#2E3646"/>

    <!-- Emerging 3D Geometric Structured Pillar (Symbolizing "becoming" or "formation") -->
    <!-- Base blocks -->
    <path d="M90 160 L120 170 L150 160 L150 145 L120 155 L90 145 Z" fill="#3A4454"/>
    <path d="M90 145 L120 155 L120 125 L90 115 Z" fill="#4E5D73"/>
    <path d="M120 155 L150 145 L150 115 L120 125 Z" fill="#2E3846"/>

    <!-- Upper blocks (Rising into a finished state) -->
    <path d="M95 115 L120 123 L145 115 L145 100 L120 108 L95 100 Z" fill="#F59E0B"/>
    <path d="M95 100 L120 108 L120 78 L95 70 Z" fill="#FBBF24"/>
    <path d="M120 108 L145 100 L145 70 L120 78 Z" fill="#D97706"/>

    <!-- Peak glowing star / completion symbol -->
    <polygon points="120,45 127,62 145,65 131,78 135,95 120,86 105,95 109,78 95,65 113,62" fill="#FDE68A"/>
    
    <!-- Accent aura / success rays -->
    <circle cx="120" cy="70" r="45" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5"/>
  </g>
</svg>