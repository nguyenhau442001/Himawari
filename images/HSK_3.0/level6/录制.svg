<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for studio atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Recording Studio Microphone (Physical Object representing "录制") -->
  <!-- Shock mount outer ring -->
  <circle cx="120" cy="115" r="52" fill="none" stroke="#3A4252" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="120" cy="115" r="46" fill="none" stroke="#FF9F43" stroke-width="1.5" opacity="0.4"/>

  <!-- Stand and base mount -->
  <rect x="116" y="155" width="8" height="40" rx="4" fill="#2C3240"/>
  <path d="M95 195 L145 195 L140 205 L100 205 Z" fill="#3A4252" rx="2"/>
  <circle cx="120" cy="155" r="7" fill="#FF9F43"/>

  <!-- Microphone Body -->
  <rect x="104" y="70" width="32" height="65" rx="16" fill="#2C3240" stroke="#4F5D73" stroke-width="2"/>
  
  <!-- Metallic grille texture -->
  <rect x="108" y="76" width="24" height="40" rx="8" fill="none" stroke="#FF9F43" stroke-width="2"/>
  <line x1="108" y1="86" x2="132" y2="86" stroke="#4F5D73" stroke-width="1.5"/>
  <line x1="108" y1="96" x2="132" y2="96" stroke="#4F5D73" stroke-width="1.5"/>
  <line x1="108" y1="106" x2="132" y2="106" stroke="#4F5D73" stroke-width="1.5"/>

  <!-- Microphone connection cable -->
  <path d="M120 135 C 120 155, 150 160, 155 185" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>

  <!-- Recording active indicator light (Red dot) -->
  <circle cx="120" cy="124" r="3" fill="#FF5252"/>
  <circle cx="120" cy="124" r="6" fill="#FF5252" opacity="0.4"/>

  <!-- Sound waves / broadcast aura -->
  <path d="M60 95 C 50 105, 50 135, 60 145" fill="none" stroke="#00D2D3" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M48 85 C 34 100, 34 140, 48 155" fill="none" stroke="#00D2D3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <path d="M180 95 C 190 105, 190 135, 180 145" fill="none" stroke="#00D2D3" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M192 85 C 206 100, 206 140, 192 155" fill="none" stroke="#00D2D3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Floating musical notes representing audio capture/production -->
  <g fill="#FF9F43">
    <!-- Note 1 -->
    <circle cx="75" cy="65" r="4"/>
    <path d="M79 65 L79 45 L90 42 L90 48" stroke="#FF9F43" stroke-width="2" fill="none"/>
    <circle cx="86" cy="48" r="4"/>
    
    <!-- Note 2 -->
    <circle cx="155" cy="55" r="3.5"/>
    <path d="M158.5 55 L158.5 38 L168 35 L168 40" stroke="#FF9F43" stroke-width="2" fill="none"/>
    <circle cx="164.5" cy="40" r="3.5"/>
  </g>
</svg>