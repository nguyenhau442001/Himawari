<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window frame showing distance -->
  <rect x="20" y="20" width="200" height="120" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M120 20 L120 140" stroke="#475569" stroke-width="2"/>
  
  <!-- Distant city/travel scene through window -->
  <path d="M30 100 L50 70 L70 90 L90 60 L110 100 Z" fill="#475569"/>
  <circle cx="180" cy="50" r="15" fill="#f59e0b"/>
  
  <!-- Desk and Workspace -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Character (The worker) -->
  <g transform="translate(140, 130)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <path d="M8 35 Q20 50 32 35 L30 70 L10 70 Z" fill="#38bdf8"/>
    <rect x="15" y="70" width="4" height="20" fill="#38bdf8"/>
    <rect x="21" y="70" width="4" height="20" fill="#38bdf8"/>
  </g>
  
  <!-- Work props -->
  <rect x="40" y="160" width="60" height="40" rx="2" fill="#fbbf24"/>
  <path d="M45 170 L95 170 M45 180 L95 180 M45 190 L80 190" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Suitcase (Symbolizing "away from home") -->
  <rect x="160" y="170" width="40" height="30" rx="4" fill="#ec4899"/>
  <rect x="170" y="165" width="20" height="5" rx="1" fill="#ec4899"/>
  
  <!-- Coffee mug -->
  <circle cx="115" cy="185" r="8" fill="#10b981"/>
  <path d="M123 180 Q130 180 130 185" stroke="#10b981" stroke-width="3" fill="none"/>
  
  <!-- Calendar/Time indicator (abstract) -->
  <rect x="20" y="30" width="15" height="20" rx="1" fill="#fb923c"/>
  <rect x="20" y="55" width="15" height="20" rx="1" fill="#fb923c"/>
  <rect x="20" y="80" width="15" height="20" rx="1" fill="#fb923c"/>
</svg>