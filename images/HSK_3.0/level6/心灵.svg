<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glowing aura for music/purification concept -->
  <circle cx="120" cy="115" r="70" fill="#252D3D" opacity="0.6"/>
  <circle cx="120" cy="115" r="50" fill="#313E54" opacity="0.4"/>

  <!-- Musical Note (Symbolizing Music in "音乐能净化人的心灵") -->
  <g transform="translate(0, 5)">
    <!-- Note head left -->
    <ellipse cx="98" cy="135" rx="10" ry="7" transform="rotate(-25 98 135)" fill="#F39C12"/>
    <!-- Note head right -->
    <ellipse cx="142" cy="123" rx="10" ry="7" transform="rotate(-25 142 123)" fill="#F39C12"/>
    
    <!-- Stems -->
    <rect x="104" y="80" width="4" height="58" rx="2" fill="#F39C12"/>
    <rect x="148" y="68" width="4" height="58" rx="2" fill="#F39C12"/>
    
    <!-- Beam -->
    <path d="M 104 80 L 152 68 L 152 78 L 104 90 Z" fill="#F39C12"/>
  </g>

  <!-- Sound / Purification Waves (Upward expanding arcs) -->
  <path d="M 85 85 C 75 75 75 55 85 45" stroke="#3498DB" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 155 75 C 165 65 165 45 155 35" stroke="#3498DB" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 70 100 C 55 80 55 50 70 30" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none"/>
  <path d="M 170 90 C 185 70 185 40 170 20" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none"/>

  <!-- Sparkling / Cleansing Effect Elements -->
  <circle cx="95" cy="55" r="2.5" fill="#EAEAEA"/>
  <circle cx="148" cy="45" r="2" fill="#EAEAEA"/>
  <circle cx="120" cy="32" r="3" fill="#F1C40F"/>
  <circle cx="65" cy="130" r="2" fill="#3498DB"/>
  <circle cx="175" cy="115" r="2.5" fill="#3498DB"/>

  <!-- Human Silhouette Head and Shoulders (Representing "人" / Inner Person) -->
  <path d="M 80 200 C 80 170 98 155 120 155 C 142 155 160 170 160 200 Z" fill="#2E384D"/>
  <circle cx="120" cy="132" r="16" fill="#2E384D"/>

  <!-- Inner Mind / Spirit Glow (The core "心灵" essence inside the person) -->
  <circle cx="120" cy="135" r="8" fill="#F1C40F" opacity="0.9"/>
  <circle cx="120" cy="135" r="13" fill="#F39C12" opacity="0.4"/>
</svg>