<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Layer: Dark, deep underground texture representation -->
  <path d="M0 130 C60 120, 120 140, 240 125 L240 240 L0 240 Z" fill="#14161B"/>
  
  <!-- Subtle strata lines in the underground -->
  <path d="M0 160 Q80 150 240 170" stroke="#222630" stroke-width="2" fill="none"/>
  <path d="M0 195 Q120 185 240 205" stroke="#222630" stroke-width="2" fill="none"/>

  <!-- Visual Contrast & Scale Exaggeration: The buried dark rough state vs Glowing brilliance -->
  <!-- Ambient upward radiating glow from the gold nugget -->
  <circle cx="120" cy="165" r="55" fill="#F5A623" opacity="0.15" filter="blur(8px)"/>
  <circle cx="120" cy="165" r="30" fill="#FFC107" opacity="0.3" filter="blur(4px)"/>

  <!-- Rays of light breaking through the soil upward (representing "无论埋藏多深总会发光的") -->
  <polygon points="120,135 105,60 135,60" fill="url(#lightRay)" opacity="0.25"/>
  <polygon points="120,135 75,70 95,65" fill="url(#lightRay)" opacity="0.18"/>
  <polygon points="120,135 145,65 165,70" fill="url(#lightRay)" opacity="0.18"/>

  <defs>
    <linearGradient id="lightRay" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D48806"/>
    </linearGradient>
  </defs>

  <!-- The True Gold (金子) - High contrast, brilliant faceted golden nuggets emerging from the dark -->
  <!-- Left smaller nugget -->
  <path d="M90 175 L102 165 L112 178 L100 188 Z" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1.5"/>
  <!-- Right smaller nugget -->
  <path d="M130 172 L145 168 L152 182 L138 185 Z" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1.5"/>
  
  <!-- Main central brilliant gold nugget (Scale Exaggeration for Adjective/Quality) -->
  <path d="M105 150 
           L122 138 
           L142 148 
           L150 168 
           L138 190 
           L108 192 
           L95 170 Z" 
        fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>

  <!-- Facet lines for crystal/pure gold brilliance -->
  <path d="M122 138 L122 165 L138 190" stroke="#FFE082" stroke-width="1.5" fill="none"/>
  <path d="M105 150 L122 165 L95 170" stroke="#E69500" stroke-width="1.5" fill="none"/>
  <path d="M142 148 L122 165 L150 168" stroke="#E69500" stroke-width="1.5" fill="none"/>
  <path d="M122 165 L108 192" stroke="#FFE082" stroke-width="1.5" fill="none"/>

  <!-- Sparkling star accents representing inherent luminosity ("总会发光的") -->
  <g transform="translate(120, 75)">
    <path d="M0 -14 C1 -4, 4 -1, 14 0 C4 1, 1 4, 0 14 C-1 4, -4 1, -14 0 C-4 -1, -1 -4, 0 -14 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="3" fill="#FFF"/>
  </g>
  <g transform="translate(72, 100) scale(0.6)">
    <path d="M0 -14 C1 -4, 4 -1, 14 0 C4 1, 1 4, 0 14 C-1 4, -4 1, -14 0 C-4 -1, -1 -4, 0 -14 Z" fill="#FFE082"/>
  </g>
  <g transform="translate(168, 95) scale(0.7)">
    <path d="M0 -14 C1 -4, 4 -1, 14 0 C4 1, 1 4, 0 14 C-1 4, -4 1, -14 0 C-4 -1, -1 -4, 0 -14 Z" fill="#FFE082"/>
  </g>

  <!-- Top atmosphere / upper ground split line -->
  <line x1="0" y1="130" x2="240" y2="130" stroke="#2C313C" stroke-width="2" stroke-dasharray="6 4"/>
</svg>