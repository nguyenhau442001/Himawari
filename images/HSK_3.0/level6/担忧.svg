<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle atmosphere & motion lines indicating anxiety/worry -->
  <g opacity="0.3" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M70 70 Q 80 60 90 70" />
    <path d="M150 65 Q 160 55 170 65" />
    <path d="M60 110 Q 75 100 90 110" stroke-dasharray="3 3"/>
  </g>

  <!-- Distant thought/imagery bubble representing the child far away -->
  <g opacity="0.85">
    <!-- Thought bubble cloud outline -->
    <path d="M 140,75 C 145,65 160,65 168,74 C 176,68 188,76 186,86 C 194,92 192,104 184,110 C 180,118 168,118 162,112 C 154,118 142,112 142,102 C 134,98 134,84 140,75 Z" fill="#262B36" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Mini traveler/student icon inside thought bubble -->
    <!-- Backpack -->
    <rect x="157" y="88" width="8" height="12" rx="2" fill="#3B82F6"/>
    <!-- Head & body -->
    <circle cx="165" cy="85" r="4" fill="#E2E8F0"/>
    <path d="M 160,99 L 160,92 C 160,90 170,90 170,92 L 170,99" fill="#E2E8F0"/>
    <!-- Travel path / distance indicator -->
    <path d="M 125,120 Q 145,105 155,98" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  </g>

  <!-- Main Character: Mother expressing "担忧" (worry/concern) -->
  <g>
    <!-- Body / Torso with warm tone -->
    <path d="M 70,195 C 70,165 85,150 110,150 C 135,150 150,165 150,195 Z" fill="#374151"/>
    <!-- Collar / Clothing detail -->
    <path d="M 95,150 C 100,160 120,160 125,150" fill="none" stroke="#4B5563" stroke-width="2"/>

    <!-- Head -->
    <circle cx="110" cy="115" r="22" fill="#E2E8F0"/>
    
    <!-- Hair style -->
    <path d="M 88,115 C 88,95 132,95 132,115 C 132,122 130,135 125,140 C 120,132 115,130 110,130 C 105,130 100,132 95,140 C 90,135 88,122 88,115 Z" fill="#4B5563"/>

    <!-- Face expression of worry (furrowed brow, tense mouth) -->
    <!-- Eyebrows tilted inward/down -->
    <line x1="100" y1="109" x2="108" y2="112" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="112" x2="128" y2="109" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (closed/concentrated or gently looking far away) -->
    <path d="M 101,116 Q 105,118 109,116" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 121,116 Q 125,118 129,116" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Tense/concerned mouth -->
    <path d="M 107,126 Q 110,124 113,126" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Dynamic Hands on cheek / chin showing deep contemplation and anxiety -->
    <!-- Arm and hand touching face -->
    <path d="M 90,160 C 85,145 95,125 105,125" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="104" cy="122" r="5" fill="#E2E8F0"/>
    
    <!-- Opposite arm supporting -->
    <path d="M 130,160 C 135,145 125,135 115,135" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Accent focal highlight (Golden/Orange accent for emotional weight) -->
  <circle cx="110" cy="115" r="42" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
</svg>