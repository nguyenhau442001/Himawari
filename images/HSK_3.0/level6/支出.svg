<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow/ambiance -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Noun Object: Physical Cash/Money Outflow (Wallet & Coins/Banknotes emerging/dispensing) -->
  <g transform="translate(0, 5)">
    <!-- Wallet Base (Open/Active expense look) -->
    <rect x="65" y="100" width="110" height="75" rx="12" fill="#2C3440"/>
    <path d="M65 115 H175 V165 C175 171.075 170.075 176 164 176 H76 C69.9249 176 65 171.075 65 165 Z" fill="#222831"/>
    
    <!-- Wallet Pocket / Flap shadow -->
    <path d="M65 115 C65 106.716 71.7157 100 80 100 H160 C168.284 100 175 106.716 175 115 V125 H65 V115 Z" fill="#3A4454"/>
    
    <!-- Wallet Clasp / Strap -->
    <rect x="105" y="125" width="30" height="20" rx="6" fill="#F39C12"/>
    <circle cx="120" cy="135" r="4" fill="#1A1D24"/>

    <!-- Outflowing Banknote (Ascending/Leaving) -->
    <g transform="translate(0, -15)">
      <rect x="85" y="65" width="70" height="42" rx="4" fill="#27AE60" transform="rotate(-12 120 86)"/>
      <rect x="91" y="71" width="58" height="30" rx="2" fill="#2ECC71" transform="rotate(-12 120 86)"/>
      <!-- Bill details -->
      <circle cx="120" cy="86" r="8" fill="#27AE60" transform="rotate(-12 120 86)"/>
      <circle cx="120" cy="86" r="4" fill="#1E8449" transform="rotate(-12 120 86)"/>
    </g>

    <!-- Outflowing Coins (Dynamic upward/outward motion from wallet) -->
    <!-- Coin 1 (Left) -->
    <circle cx="78" cy="82" r="11" fill="#D4AC0D"/>
    <circle cx="78" cy="82" r="8" fill="#F1C40F"/>
    <text x="75" y="86" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#7D6608">$</text>

    <!-- Coin 2 (Right Top) -->
    <circle cx="162" cy="70" r="13" fill="#D4AC0D"/>
    <circle cx="162" cy="70" r="10" fill="#F1C40F"/>
    <text x="159" y="74" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#7D6608">$</text>

    <!-- Coin 3 (Far Right Mid) -->
    <circle cx="178" cy="98" r="9" fill="#D4AC0D"/>
    <circle cx="178" cy="98" r="6.5" fill="#F1C40F"/>

    <!-- Motion / Directional Outflow Arrows (Sleek Orange Accents) -->
    <g fill="none" stroke="#F39C12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left upward curve arrow -->
      <path d="M 68 95 C 55 90 48 75 52 60"/>
      <polyline points="48,65 52,57 59,62"/>

      <!-- Right upward curve arrow -->
      <path d="M 172 95 C 185 85 190 70 185 55"/>
      <polyline points="189,60 185,52 178,57"/>
    </g>
  </g>
</svg>