<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Inner Glow Gradient for "Fragile/Inner Heart" visual metaphor -->
    <radialGradient id="innerHeartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background Elements -->
  <!-- Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="1.5" />

  <!-- Window Frame in Background -->
  <rect x="150" y="30" width="60" height="90" rx="4" fill="#111827" stroke="#334155" stroke-width="2" />
  <line x1="180" y1="30" x2="180" y2="120" stroke="#334155" stroke-width="1.5" />
  <line x1="150" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="1.5" />
  <!-- Window light projection on floor/wall -->
  <polygon points="150,120 210,120 235,190 120,190" fill="url(#windowLight)" />

  <!-- Bookshelf / Books in background for cozy room context -->
  <rect x="20" y="50" width="40" height="140" fill="#111827" opacity="0.6" />
  <rect x="25" y="80" width="30" height="8" rx="2" fill="#334155" />
  <rect x="25" y="110" width="30" height="8" rx="2" fill="#475569" />
  <rect x="25" y="140" width="30" height="8" rx="2" fill="#334155" />

  <!-- Potted Plant on Floor -->
  <path d="M 65 170 L 75 190 L 55 190 Z" fill="#64748b" />
  <path d="M 60 170 Q 65 165 70 170 Z" fill="#94a3b8" />
  <!-- Plant Leaves -->
  <path d="M 65 170 Q 50 150 45 135 Q 60 150 65 170 Z" fill="#10b981" />
  <path d="M 65 170 Q 75 145 85 130 Q 75 155 65 170 Z" fill="#059669" />
  <path d="M 65 170 Q 65 140 60 125 Q 65 145 65 170 Z" fill="#34d399" />

  <!-- Wooden Chair / Stool -->
  <g transform="translate(95, 125)">
    <!-- Seat -->
    <rect x="0" y="25" width="55" height="6" rx="2" fill="#b45309" />
    <!-- Legs -->
    <line x1="8" y1="31" x2="3" y2="65" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <line x1="47" y1="31" x2="52" y2="65" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <line x1="15" y1="31" x2="12" y2="65" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- INNER HEART METAPHOR GLOW (Visualizing "Nội tâm" / Inner vulnerability) -->
  <circle cx="120" cy="115" r="45" fill="url(#innerHeartGlow)" />

  <!-- Subtle Glass-like protective dome or aura lines indicating fragility -->
  <path d="M 90 90 Q 120 70 150 90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <path d="M 85 110 Q 120 90 155 110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3" />

  <!-- MAIN CHARACTER: Sitting, hugging knees, vulnerable pose -->
  <g transform="translate(100, 100)">
    <!-- Shadow beneath character -->
    <ellipse cx="20" cy="90" rx="30" ry="6" fill="#020617" opacity="0.6" />

    <!-- Legs folded / knees pulled up -->
    <!-- Pants / Lower Body -->
    <path d="M 10 55 Q -5 55 5 75 Q 15 85 30 75 Q 40 65 35 55 Z" fill="#3b82f6" />

    <!-- Shoes -->
    <ellipse cx="-2" cy="78" rx="6" ry="4" fill="#cbd5e1" />
    <ellipse cx="38" cy="76" rx="6" ry="4" fill="#cbd5e1" />

    <!-- Arms wrapped around knees -->
    <path d="M 15 45 Q -5 45 2 65 Q 12 70 25 65 Q 35 60 30 45 Z" fill="#60a5fa" />
    <!-- Hands clasped -->
    <circle cx="18" cy="63" r="5" fill="#fcd34d" />

    <!-- Torso (slumped posture) -->
    <path d="M 10 30 Q 30 30 25 60 Q 10 60 5 40 Z" fill="#60a5fa" />

    <!-- Head bowed down -->
    <!-- Hair back -->
    <path d="M 12 12 Q 35 12 30 35 Q 20 40 10 30 Z" fill="#1e1b4b" />
    <!-- Face / Skin -->
    <circle cx="18" cy="24" r="11" fill="#fde68a" />
    <!-- Hair front / bangs -->
    <path d="M 10 15 Q 22 15 26 25 Q 15 28 8 20 Z" fill="#312e81" />

    <!-- Closed sad/vulnerable eyes (simple arc) -->
    <path d="M 20 24 Q 22 26 24 24" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" />

    <!-- Subtle teardrop -->
    <path d="M 25 27 Q 26 30 25 31 Q 24 30 25 27 Z" fill="#38bdf8" />
  </g>

  <!-- Foreground details (Warm tea cup on a tiny side table to ground the interior setting) -->
  <g transform="translate(65, 155)">
    <!-- Small Table -->
    <rect x="0" y="20" width="25" height="4" rx="1" fill="#92400e" />
    <line x1="4" y1="24" x2="4" y2="35" stroke="#78350f" stroke-width="2" />
    <line x1="21" y1="24" x2="21" y2="35" stroke="#78350f" stroke-width="2" />
    <!-- Teacup -->
    <path d="M 8 10 L 17 10 L 16 20 L 9 20 Z" fill="#f8fafc" />
    <!-- Steam -->
    <path d="M 11 6 Q 13 3 11 1" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Ambient lighting highlights -->
  <circle cx="190" cy="50" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="205" cy="85" r="1.5" fill="#fbbf24" opacity="0.6" />
</svg>