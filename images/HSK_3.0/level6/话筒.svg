<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative concentric soundwaves -->
  <path d="M75 90 C75 70, 95 55, 120 55 C145 55, 165 70, 165 90" fill="none" stroke="#2A303C" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M60 90 C60 55, 85 35, 120 35 C155 35, 180 55, 180 90" fill="none" stroke="#2A303C" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Microphone illustration (话筒) -->
  <g transform="translate(0, 5)">
    <!-- Base / Stand holder -->
    <path d="M106 170 L134 170 L140 185 L100 185 Z" fill="#64748B"/>
    <rect x="114" y="145" width="12" height="30" fill="#475569" rx="2"/>

    <!-- U-shaped metal bracket -->
    <path d="M92 80 C92 125, 148 125, 148 80" fill="none" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

    <!-- Microphone body/handle -->
    <rect x="108" y="105" width="24" height="48" rx="12" fill="#334155"/>
    <rect x="114" y="115" width="12" height="24" rx="4" fill="#1E293B"/>

    <!-- Microphone head (Mesh capsule) -->
    <path d="M96 72 C96 52, 144 52, 144 72 L144 88 C144 104, 96 104, 96 88 Z" fill="#F8FAFC"/>
    
    <!-- Microphone grill details (Horizontal lines) -->
    <line x1="97" y1="68" x2="143" y2="68" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="96" y1="76" x2="144" y2="76" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="97" y1="84" x2="143" y2="84" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="98" y1="92" x2="142" y2="92" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Gold Accent Ring -->
    <rect x="96" y="98" width="48" height="6" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Sound/Speech Emission Accent (Focus) -->
  <circle cx="120" cy="20" r="3" fill="#F59E0B"/>
  <circle cx="95" cy="30" r="2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="145" cy="30" r="2" fill="#F59E0B" opacity="0.8"/>
  
  <!-- Active signal wave below head -->
  <path d="M90 205 L150 205" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M105 213 L135 213" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>