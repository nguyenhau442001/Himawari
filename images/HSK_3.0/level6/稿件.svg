<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#F59E0B" opacity="0.05" filter="blur(20px)"/>

  <!-- Manuscript / Article pages (稿件) -->
  <!-- Back paper layer -->
  <path d="M75 55 L155 55 L175 75 L175 190 L75 190 Z" fill="#2D3748" rx="4"/>
  <path d="M155 55 L155 75 L175 75 Z" fill="#4A5568"/>

  <!-- Middle paper layer -->
  <path d="M70 65 L150 65 L170 85 L170 200 L70 200 Z" fill="#3B4252" rx="4"/>
  <path d="M150 65 L150 85 L170 85 Z" fill="#4C566A"/>

  <!-- Main front paper layer -->
  <path d="M65 75 L145 75 L165 95 L165 210 L65 210 Z" fill="#FFFFFF" rx="4"/>
  <path d="M145 75 L145 95 L165 95 Z" fill="#E2E8F0"/>

  <!-- Document Header / Title bar -->
  <rect x="85" y="95" width="60" height="8" rx="4" fill="#F59E0B"/>

  <!-- Text lines representing the manuscript article -->
  <rect x="85" y="115" width="60" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="85" y="127" width="50" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="85" y="139" width="55" height="4" rx="2" fill="#CBD5E1"/>
  
  <rect x="85" y="157" width="60" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="85" y="169" width="45" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="85" y="181" width="55" height="4" rx="2" fill="#CBD5E1"/>

  <!-- Editorial review / Submission accent elements (Red correction stamp/mark) -->
  <circle cx="140" cy="180" r="14" fill="none" stroke="#EF4444" stroke-width="2.5" opacity="0.85"/>
  <path d="M133 180 L138 185 L149 173" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Pen / Quill representing writing/submission -->
  <g transform="translate(145, 30) rotate(45)">
    <!-- Pen body -->
    <path d="M0 0 L12 0 L8 60 L4 60 Z" fill="#38BDF8"/>
    <!-- Pen nib -->
    <path d="M4 60 L8 68 L12 60 Z" fill="#94A3B8"/>
    <!-- Pen cap/clip -->
    <rect x="4" y="-6" width="4" height="8" fill="#0284C7" rx="1"/>
  </g>
</svg>