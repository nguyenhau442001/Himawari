<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Suitcase body (Open travel suitcase viewed from top-ish isometric/flat angle) -->
    <!-- Suitcase outer shell -->
    <rect x="52" y="75" width="136" height="110" rx="12" fill="#2D333B" stroke="#4F5D73" stroke-width="3"/>
    
    <!-- Suitcase inner compartment -->
    <rect x="60" y="83" width="120" height="94" rx="8" fill="#14161B"/>
    
    <!-- Suitcase handle & zippers/details -->
    <path d="M100 75 L100 64 C100 60 104 56 110 56 L130 56 C136 56 140 60 140 64 L140 75" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Clothes being stuffed / crammed in (Representing "塞" - cramming/stuffing into a container) -->
    <!-- Overflowing clothes pile 1 (Blue shirt) -->
    <path d="M 75 110 Q 90 90 120 100 Q 150 110 165 95 Q 170 125 155 135 Q 120 140 85 130 Z" fill="#3B82F6" opacity="0.9"/>
    
    <!-- Overflowing clothes pile 2 (Orange sweater/fabric overlapping dynamically) -->
    <path d="M 85 145 Q 110 125 145 130 Q 175 135 165 155 Q 135 170 100 155 Q 80 160 85 145 Z" fill="#F59E0B" opacity="0.95"/>
    
    <!-- Fold lines for clothing texture -->
    <path d="M 95 108 Q 115 115 135 105" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 110 140 Q 130 148 150 138" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>

    <!-- Dynamic pushing hands / motion lines indicating the action of "stuffing/cramming" (塞) -->
    <!-- Left Hand pushing -->
    <g transform="translate(35, 120)">
      <path d="M 15 10 C 15 5 22 2 28 8 L 38 18 C 42 22 40 30 35 32 L 20 35 C 15 35 10 30 12 22 Z" fill="#E5E7EB"/>
      <path d="M 28 8 L 45 5 C 50 4 54 8 52 13 L 40 20" fill="#E5E7EB"/>
      <path d="M 22 25 L 38 22" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 20 30 L 35 27" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Right Hand pushing -->
    <g transform="translate(185, 120) scale(-1, 1)">
      <path d="M 15 10 C 15 5 22 2 28 8 L 38 18 C 42 22 40 30 35 32 L 20 35 C 15 35 10 30 12 22 Z" fill="#E5E7EB"/>
      <path d="M 28 8 L 45 5 C 50 4 54 8 52 13 L 40 20" fill="#E5E7EB"/>
      <path d="M 22 25 L 38 22" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 20 30 L 35 27" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Action motion arrows indicating force into the suitcase -->
    <path d="M 45 105 L 65 112" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M 195 105 L 175 112" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
  </g>
</svg>