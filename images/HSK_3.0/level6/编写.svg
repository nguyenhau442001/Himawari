<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Collaborative Authoring / Compiling (编写) Concept Illustration -->
  <g transform="translate(0, 0)">
    <!-- Central Book (The compiled textbook) -->
    <path d="M70,140 C70,135 75,130 85,130 L155,130 C165,130 170,135 170,140 L170,190 C170,195 165,200 155,200 L85,200 C75,200 70,195 70,190 Z" fill="#2D333B"/>
    <!-- Book pages / depth -->
    <path d="M75,145 C75,140 80,136 88,136 L152,136 C160,136 165,140 165,145 L165,192 C165,197 160,200 152,200 L88,200 C80,200 75,197 75,192 Z" fill="#F0F3F6"/>
    <!-- Book spine / center fold shadow -->
    <path d="M118,136 L122,136 L122,200 L118,200 Z" fill="#D0D7DE"/>
    
    <!-- Left page content (lines representing text) -->
    <rect x="88" y="150" width="22" height="3" rx="1.5" fill="#57606A"/>
    <rect x="88" y="158" width="18" height="3" rx="1.5" fill="#8C959F"/>
    <rect x="88" y="166" width="20" height="3" rx="1.5" fill="#57606A"/>
    <rect x="88" y="174" width="15" height="3" rx="1.5" fill="#8C959F"/>

    <!-- Right page content -->
    <rect x="130" y="150" width="22" height="3" rx="1.5" fill="#57606A"/>
    <rect x="130" y="158" width="16" height="3" rx="1.5" fill="#8C959F"/>
    <rect x="130" y="166" width="20" height="3" rx="1.5" fill="#57606A"/>

    <!-- Book Cover Accent (Gold/Orange theme for focus) -->
    <path d="M70,130 L170,130 L170,140 L70,140 Z" fill="#F59E0B"/>
    <path d="M70,190 L170,190 L170,200 L70,200 Z" fill="#D97706"/>

    <!-- Collaborative Editing Elements (Multiple hands/pens symbolizing joint compilation "共同编写") -->
    
    <!-- Hand 1 (Top Left, writing) -->
    <g transform="translate(65, 80)">
      <!-- Arm / Cuff -->
      <path d="M-10,40 L10,20 L25,35 L5,55 Z" fill="#3B82F6"/>
      <!-- Hand holding pen -->
      <circle cx="20" cy="25" r="8" fill="#FBBF24"/>
      <!-- Pen angled towards book -->
      <path d="M15,20 L35,0 L40,5 L20,25 Z" fill="#94A3B8"/>
      <path d="M35,0 L40,5 L38,7 L33,2 Z" fill="#EF4444"/> <!-- Pen tip -->
    </g>

    <!-- Hand 2 (Top Right, writing/editing) -->
    <g transform="translate(175, 80) scale(-1, 1)">
      <!-- Arm / Cuff -->
      <path d="M-10,40 L10,20 L25,35 L5,55 Z" fill="#10B981"/>
      <!-- Hand holding pen -->
      <circle cx="20" cy="25" r="8" fill="#FBBF24"/>
      <!-- Pen angled towards book -->
      <path d="M15,20 L35,0 L40,5 L20,25 Z" fill="#94A3B8"/>
      <path d="M35,0 L40,5 L38,7 L33,2 Z" fill="#3B82F6"/> <!-- Pen tip -->
    </g>

    <!-- Floating organized elements/nodes symbolizing structure and compilation -->
    <circle cx="120" cy="70" r="16" fill="#1F2937" stroke="#3B82F6" stroke-width="3"/>
    <!-- Document icon inside center node -->
    <rect x="114" y="63" width="12" height="14" rx="1" fill="#F3F4F6"/>
    <rect x="116" y="66" width="8" height="2" fill="#3B82F6"/>
    <rect x="116" y="70" width="6" height="2" fill="#9CA3AF"/>

    <!-- Connecting lines from node to writers -->
    <path d="M108,78 L85,95" stroke="#4B5563" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M132,78 L155,95" stroke="#4B5563" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M120,86 L120,130" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Floating Sparkles / Creation details -->
    <path d="M95,50 L98,58 L106,61 L98,64 L95,72 L92,64 L84,61 L92,58 Z" fill="#F59E0B" opacity="0.8"/>
    <path d="M150,45 L152,50 L157,52 L152,54 L150,59 L148,54 L143,52 L148,50 Z" fill="#3B82F6" opacity="0.8"/>
  </g>
</svg>