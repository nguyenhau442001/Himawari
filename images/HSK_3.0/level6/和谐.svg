<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Environment -->
  <!-- Floor -->
  <path d="M0,170 L240,170 L240,240 L0,240 Z" fill="url(#floorGrad)" />
  <!-- Wall/Balcony partition -->
  <rect x="0" y="50" width="240" height="120" fill="url(#wallGrad)" />
  
  <!-- Architectural details: Balcony railing & warm ambient background light -->
  <circle cx="120" cy="110" r="70" fill="url(#warmGlow)" />
  
  <!-- Outdoor greenery seen over railing -->
  <path d="M40,120 Q50,90 70,120 Q90,80 110,120 Q140,85 160,120 Q180,95 200,120 Z" fill="#065f46" opacity="0.6" />
  <circle cx="70" cy="95" r="12" fill="#059669" opacity="0.5" />
  <circle cx="130" cy="90" r="15" fill="#059669" opacity="0.5" />

  <!-- Balcony Railing -->
  <rect x="0" y="160" width="240" height="10" fill="#475569" />
  <line x1="30" y1="130" x2="30" y2="160" stroke="#64748b" stroke-width="4" />
  <line x1="90" y1="130" x2="90" y2="160" stroke="#64748b" stroke-width="4" />
  <line x1="150" y1="130" x2="150" y2="160" stroke="#64748b" stroke-width="4" />
  <line x1="210" y1="130" x2="210" y2="160" stroke="#64748b" stroke-width="4" />
  <rect x="0" y="126" width="240" height="6" rx="3" fill="#64748b" />

  <!-- Potted plant on railing (nature element) -->
  <path d="M105,116 L125,116 L122,126 L108,126 Z" fill="#f97316" />
  <circle cx="115" cy="110" r="10" fill="#10b981" />
  <circle cx="110" cy="103" r="7" fill="#34d399" />
  <circle cx="120" cy="103" r="8" fill="#059669" />

  <!-- CHARACTER 1 (Left Neighbor): Friendly waving woman -->
  <g transform="translate(55, 65)">
    <!-- Body/Torso -->
    <path d="M15,65 Q15,45 25,45 L45,45 Q55,45 55,65 L60,105 L10,105 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="35" cy="30" r="14" fill="#fde047" />
    <!-- Hair -->
    <path d="M21,30 Q21,15 35,16 Q49,15 49,30 Q51,40 45,45 L25,45 Q19,40 21,30 Z" fill="#475569" />
    <path d="M21,30 Q21,45 27,55 L23,35 Z" fill="#475569" />
    <!-- Face Expression (Happy) -->
    <circle cx="31" cy="29" r="1.5" fill="#1e293b" />
    <circle cx="39" cy="29" r="1.5" fill="#1e293b" />
    <path d="M33,33 Q35,36 37,33" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Left Arm (Waving) -->
    <path d="M18,50 Q5,45 2,35" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="2" cy="33" r="3.5" fill="#fde047" />
    <!-- Right Arm (Resting) -->
    <path d="M52,50 Q58,60 52,70" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 2 (Right Neighbor): Friendly man sharing fruit basket -->
  <g transform="translate(130, 60)">
    <!-- Body/Torso -->
    <path d="M15,70 Q15,50 25,50 L45,50 Q55,50 55,70 L60,110 L10,110 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="35" cy="32" r="14" fill="#fde047" />
    <!-- Hair/Cap -->
    <path d="M21,32 Q21,18 35,18 Q49,18 49,32 L51,26 Q45,20 35,20 Q25,20 19,26 Z" fill="#1e293b" />
    <!-- Face Expression (Smiling) -->
    <circle cx="31" cy="31" r="1.5" fill="#1e293b" />
    <circle cx="39" cy="31" r="1.5" fill="#1e293b" />
    <path d="M33,35 Q35,38 37,35" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arms holding basket -->
    <path d="M18,65 Q8,65 15,75" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
    <path d="M52,65 Q62,65 50,75" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
    
    <!-- Gift/Fruit Basket Prop -->
    <rect x="22" y="70" width="26" height="16" rx="3" fill="#d97706" />
    <path d="M22,70 Q35,63 48,70" fill="none" stroke="#b45309" stroke-width="2" />
    <!-- Fruits inside basket -->
    <circle cx="28" cy="67" r="5" fill="#ef4444" />
    <circle cx="35" cy="65" r="5.5" fill="#22c55e" />
    <circle cx="42" cy="67" r="5" fill="#f59e0b" />
  </g>

  <!-- Harmony / Warm connection aura (Heart/Sparkles floating subtly above) -->
  <g transform="translate(112, 45)">
    <path d="M8,4 C5,-1 0,2 0,7 C0,12 8,17 8,17 C8,17 16,12 16,7 C16,2 11,-1 8,4 Z" fill="#f43f5e" opacity="0.9" transform="scale(0.8)" />
  </g>
  
  <g transform="translate(90, 30)">
    <path d="M6,3 C4,-0.5 0,1.5 0,5.5 C0,9.5 6,13 6,13 C6,13 12,9.5 12,5.5 C12,1.5 8,-0.5 6,3 Z" fill="#fb7185" opacity="0.7" transform="scale(0.5)" />
  </g>

  <!-- Additional Atmospheric Lighting Details (Warm soft glows on characters) -->
  <circle cx="95" cy="100" r="30" fill="url(#warmGlow)" style="mix-blend-mode: overlay;" />

</svg>