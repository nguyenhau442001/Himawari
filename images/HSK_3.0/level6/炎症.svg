<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle medical cross backdrop pattern / glow -->
  <circle cx="120" cy="120" r="70" fill="#242B38" />

  <!-- Skin tissue cross-section layer (representing a wound/local area) -->
  <path d="M 60,150 Q 120,130 180,150 L 180,185 Q 120,195 60,185 Z" fill="#2D3748" rx="8"/>
  <path d="M 60,135 Q 120,115 180,135 L 180,150 Q 120,130 60,150 Z" fill="#3A475C" rx="8"/>

  <!-- Wound cut / incision -->
  <path d="M 100,140 Q 120,155 140,140 Q 120,130 100,140 Z" fill="#141820" />

  <!-- Inflammation indicator: Heat/swelling glow aura -->
  <circle cx="120" cy="138" r="42" fill="#FF5252" opacity="0.15" />
  <circle cx="120" cy="138" r="28" fill="#FF5252" opacity="0.25" />

  <!-- Swelling dome (local edema) -->
  <ellipse cx="120" cy="138" rx="35" ry="16" fill="#FF6B6B" opacity="0.3" />

  <!-- White blood cells / immune reaction (representing inflammation response) -->
  <g fill="#4CD964">
    <circle cx="105" cy="135" r="5" />
    <circle cx="132" cy="132" r="6" />
    <circle cx="120" cy="124" r="5" />
    <circle cx="114" cy="144" r="5.5" />
    <circle cx="135" cy="142" r="4.5" />
  </g>

  <!-- Heat radiation waves (inflammation symptom: red, swollen, hot, painful) -->
  <path d="M 102,96 Q 120,86 138,96" stroke="#FF5252" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 110,84 Q 120,78 130,84" stroke="#FF5252" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Medical diagnostic magnifier focusing on the inflammation zone -->
  <g transform="translate(15, 10)">
    <!-- Magnifier glass circle (lens) -->
    <circle cx="115" cy="95" r="38" fill="none" stroke="#64B5F6" stroke-width="5" opacity="0.9" />
    <circle cx="115" cy="95" r="35" fill="#1E88E5" opacity="0.1" />

    <!-- Magnifier handle -->
    <path d="M 142,122 L 170,150" stroke="#90CAF9" stroke-width="7" stroke-linecap="round" />
    <path d="M 142,122 L 170,150" stroke="#42A5F5" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>