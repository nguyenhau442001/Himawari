<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120) rotate(-45)">
    <!-- Syringe Body -->
    <rect x="-10" y="-80" width="20" height="90" rx="3" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    
    <!-- Measurement markings -->
    <line x1="-10" y1="-60" x2="-5" y2="-60" stroke="#D8DEE9" stroke-width="1.5"/>
    <line x1="-10" y1="-45" x2="-2" y2="-45" stroke="#D8DEE9" stroke-width="1.5"/>
    <line x1="-10" y1="-30" x2="-5" y2="-30" stroke="#D8DEE9" stroke-width="1.5"/>
    <line x1="-10" y1="-15" x2="-2" y2="-15" stroke="#D8DEE9" stroke-width="1.5"/>

    <!-- Inner Plunger / Liquid -->
    <rect x="-8" y="-75" width="16" height="50" rx="1" fill="#FFB86C" opacity="0.8"/>

    <!-- Plunger Rod & Thumb Rest -->
    <rect x="-6" y="-115" width="12" height="40" rx="2" fill="#E5E9F0"/>
    <rect x="-18" y="-115" width="36" height="6" rx="2" fill="#4C566A"/>

    <!-- Syringe Finger Flanges -->
    <rect x="-22" y="5" width="44" height="6" rx="2" fill="#4C566A"/>

    <!-- Needle Hub -->
    <polygon points="-6,11 6,11 3,25 -3,25" fill="#E5E9F0"/>

    <!-- The Needle (针) - Highlighting focus with gold/orange accent -->
    <line x1="0" y1="25" x2="0" y2="75" stroke="#FFB86C" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Needle Tip Light Glint -->
    <circle cx="0" cy="72" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>