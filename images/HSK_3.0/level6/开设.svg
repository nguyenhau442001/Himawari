<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient / Classroom Board Outline -->
  <rect x="30" y="30" width="180" height="115" rx="8" fill="#222733" stroke="#2F3646" stroke-width="2"/>
  
  <!-- Stylized UI Course Window Header -->
  <line x1="45" y1="52" x2="105" y2="52" stroke="#4F5D75" stroke-width="4" stroke-linecap="round"/>
  <line x1="45" y1="65" x2="80" y2="65" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing/Active Course Cards appearing inside/expanding out to represent "Opening/Establishing" -->
  <g transform="translate(115, 75)">
    <!-- Card background -->
    <rect x="0" y="0" width="95" height="55" rx="6" fill="#2E384D" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Card content icons -->
    <circle cx="20" cy="27" r="8" fill="#F59E0B" opacity="0.8"/>
    <line x1="38" y1="23" x2="78" y2="23" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="33" x2="65" y2="33" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Motion lines indicating "Opening/Launching" -->
  <path d="M 100 85 Q 108 95 113 102" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 100 115 Q 108 105 113 98" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Dynamic Character Action (Instructor setting up/opening new courses) -->
  <!-- Character Body / Torso -->
  <path d="M 50 195 L 50 165 C 50 150, 65 140, 80 140 C 95 140, 110 150, 110 165 L 110 195 Z" fill="#3B82F6"/>
  <!-- Character Head -->
  <circle cx="80" cy="122" r="14" fill="#FDE047"/>
  <!-- Character Hair -->
  <path d="M 68 118 C 70 110, 90 110, 92 118 C 85 113, 75 113, 68 118 Z" fill="#1E293B"/>

  <!-- Active Arm gesturing/pointing outward to "establish" -->
  <path d="M 95 155 Q 115 150 128 135" fill="none" stroke="#FDE047" stroke-width="7" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="130" cy="132" r="4.5" fill="#FDE047"/>

  <!-- Second static arm -->
  <path d="M 65 155 L 52 175" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>

  <!-- Desk / Surface -->
  <path d="M 20 195 L 220 195" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparkle / New indicator emphasizing the "New/Opening" aspect -->
  <path d="M 200 45 L 203 55 L 213 58 L 203 61 L 200 71 L 197 61 L 187 58 L 197 55 Z" fill="#F59E0B"/>
  <path d="M 135 40 L 137 45 L 142 47 L 137 49 L 135 54 L 133 49 L 128 47 L 133 45 Z" fill="#60A5FA"/>

</svg>