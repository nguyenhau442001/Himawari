<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration representing "后期" (Post-production editing suite / film editing monitor) -->
  <g transform="translate(0, 0)">
    <!-- Desk surface -->
    <path d="M 40 185 L 200 185 L 210 195 L 30 195 Z" fill="#2A2F3B"/>

    <!-- Main Editing Monitor -->
    <!-- Monitor stand -->
    <rect x="110" y="165" width="20" height="22" fill="#3A4252" rx="2"/>
    <ellipse cx="120" cy="189" rx="30" ry="4" fill="#3A4252"/>

    <!-- Monitor frame -->
    <rect x="50" y="55" width="140" height="112" rx="8" fill="#2E3644"/>
    <!-- Inner screen border -->
    <rect x="56" y="61" width="128" height="100" rx="4" fill="#0F1115"/>

    <!-- Timeline / Video Editing Interface on Screen -->
    <!-- Video preview area -->
    <rect x="66" y="71" width="108" height="52" rx="3" fill="#1E232E"/>
    <!-- Abstract film frame elements -->
    <path d="M 76 87 L 116 87 L 116 107 L 76 107 Z" fill="#3B465E"/>
    <polygon points="90,92 90,102 102,97" fill="#F59E0B"/> <!-- Play icon -->
    
    <!-- Waveform / Visual Effects element -->
    <rect x="124" y="71" width="40" height="52" rx="3" fill="#252A37"/>
    <path d="M 130 97 L 134 85 L 138 109 L 142 91 L 146 103 L 150 94 L 154 100 L 158 97" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Timeline tracks (post-production editing process) -->
    <rect x="66" y="129" width="108" height="6" rx="2" fill="#252A37"/>
    <rect x="66" y="139" width="108" height="6" rx="2" fill="#252A37"/>
    <rect x="66" y="149" width="108" height="6" rx="2" fill="#252A37"/>

    <!-- Timeline clips (colored segments showing editing/cutting) -->
    <rect x="70" y="129" width="30" height="6" rx="1.5" fill="#F59E0B"/>
    <rect x="104" y="129" width="45" height="6" rx="1.5" fill="#10B981"/>
    <rect x="153" y="129" width="18" height="6" rx="1.5" fill="#6366F1"/>

    <rect x="70" y="139" width="60" height="6" rx="1.5" fill="#38BDF8"/>
    <rect x="134" y="139" width="35" height="6" rx="1.5" fill="#EC4899"/>

    <rect x="85" y="149" width="50" height="6" rx="1.5" fill="#A855F7"/>

    <!-- Playhead / scrubber line -->
    <line x1="115" y1="125" x2="115" y2="159" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <polygon points="115,123 112,126 118,126" fill="#EF4444"/>

    <!-- Clapperboard accent (representing film production/post-production) -->
    <g transform="translate(170, 42) rotate(15)">
      <!-- Clapperboard body -->
      <rect x="0" y="12" width="32" height="26" rx="2" fill="#1E232E"/>
      <!-- Clapper stripes -->
      <path d="M 0 6 L 32 0 L 32 6 L 0 12 Z" fill="#F3F4F6"/>
      <path d="M 8 3 L 14 2 L 14 8 L 8 9 Z" fill="#1E232E"/>
      <path d="M 20 1 L 26 0 L 26 6 L 20 7 Z" fill="#1E232E"/>
      <!-- Lens gear accent -->
      <circle cx="16" cy="25" r="7" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="16" cy="25" r="3" fill="#F59E0B"/>
    </g>
  </g>
</svg>