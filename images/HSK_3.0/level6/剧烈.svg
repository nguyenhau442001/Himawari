<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle dynamic force lines -->
  <g opacity="0.15" stroke="#FF9F43" stroke-width="2" stroke-linecap="round">
    <path d="M40 70 L80 70" />
    <path d="M20 120 L70 120" />
    <path d="M45 170 L95 170" />
    <path d="M160 50 L200 50" />
    <path d="M150 190 L195 190" />
  </g>

  <!-- Ground Track Line -->
  <path d="M30 185 L210 185" stroke="#2D323F" stroke-width="4" stroke-linecap="round"/>

  <!-- High-Intensity Action/Motion Streaks (Background Layer) -->
  <g opacity="0.3" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round">
    <path d="M60 100 C80 90 100 110 120 100" />
    <path d="M80 125 C110 115 130 135 160 125" />
    <path d="M50 150 C90 140 120 160 150 150" />
  </g>

  <!-- Dynamic Runner Character (Representing 剧烈 physical exertion) -->
  <g transform="translate(10, 0)">
    <!-- Speed Lines behind Runner -->
    <g opacity="0.5" stroke="#FFA502" stroke-width="2" stroke-linecap="round">
      <line x1="55" y1="95" x2="35" y2="90" />
      <line x1="45" y1="125" x2="20" y2="120" />
      <line x1="60" y1="155" x2="30" y2="150" />
    </g>

    <!-- Back Leg (Extended) -->
    <path d="M105 130 L85 170 L70 165" fill="none" stroke="#FFA502" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Back Arm (Swung back) -->
    <path d="M115 95 L90 85 L75 100" fill="none" stroke="#FFA502" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Torso (Leaning forward aggressively for intense effort) -->
    <path d="M120 80 L105 135" fill="none" stroke="#FFA502" stroke-width="14" stroke-linecap="round"/>

    <!-- Head with sweat/motion drop -->
    <circle cx="130" cy="65" r="11" fill="#FFA502"/>
    <!-- Sweat droplet -->
    <path d="M140 60 C143 63 143 68 140 68 C137 68 137 63 140 60 Z" fill="#00D2D3"/>

    <!-- Front Arm (Bent sharply, intense pump) -->
    <path d="M120 80 L145 95 L135 120" fill="none" stroke="#FFA502" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front Leg (Lifting high in rapid stride) -->
    <path d="M105 135 L125 155 L155 140" fill="none" stroke="#FFA502" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Intense Energy / Force Shockwave Elements (Right side focus) -->
  <g transform="translate(180, 110)">
    <path d="M 0 -35 C 15 -20 15 20 0 35" fill="none" stroke="#FF4757" stroke-width="4" stroke-linecap="round"/>
    <path d="M 10 -20 C 20 -10 20 10 10 20" fill="none" stroke="#FF4757" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 20 -8 C 25 -3 25 3 20 8" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Impact Sparks -->
  <circle cx="150" cy="180" r="3" fill="#FF4757"/>
  <path d="M145 185 L155 175" stroke="#FFA502" stroke-width="2" stroke-linecap="round"/>
  <path d="M152 187 L158 178" stroke="#FFA502" stroke-width="2" stroke-linecap="round"/>
</svg>