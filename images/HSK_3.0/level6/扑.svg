<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Canvas Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Floor Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Motion Blur / Action Line Gradients -->
    <linearGradient id="pounceStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background Elements -->
  <!-- Wooden Floor Panels -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#182232" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#0f172a" stroke-width="2" />
  <line x1="0" y1="205" x2="240" y2="205" stroke="#0f172a" stroke-width="2" />
  <line x1="80" y1="160" x2="60" y2="240" stroke="#0f172a" stroke-width="2" />
  <line x1="170" y1="160" x2="190" y2="240" stroke="#0f172a" stroke-width="2" />

  <!-- Cozy Rug -->
  <ellipse cx="120" cy="195" rx="75" ry="25" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="195" rx="65" ry="20" fill="#475569" opacity="0.4" />

  <!-- Background Furniture / Living Room Props -->
  <!-- Bookshelf -->
  <rect x="195" y="60" width="35" height="110" rx="4" fill="#0f172a" />
  <rect x="200" y="80" width="25" height="6" fill="#334155" />
  <rect x="200" y="110" width="25" height="6" fill="#334155" />
  <rect x="200" y="140" width="25" height="6" fill="#334155" />
  <!-- Colorful books on shelf -->
  <rect x="203" y="68" width="6" height="12" fill="#f43f5e" rx="1" />
  <rect x="210" y="66" width="8" height="14" fill="#38bdf8" rx="1" />
  <rect x="203" y="95" width="12" height="15" fill="#fbbf24" rx="1" />

  <!-- Houseplant in Corner -->
  <path d="M22 135 C20 120 28 110 32 100 C36 110 44 120 42 135 Z" fill="#10b981" />
  <path d="M15 142 C10 130 18 120 24 112 C25 124 28 134 35 142 Z" fill="#059669" />
  <path d="M38 140 C45 128 52 122 58 115 C54 127 48 135 45 142 Z" fill="#34d399" />
  <path d="M25 140 L37 140 L34 165 L28 165 Z" fill="#94a3b8" rx="2" />

  <!-- Sofa Edge & Cushion -->
  <path d="M0 120 L40 120 C50 120 55 125 55 135 L55 170 L0 170 Z" fill="#3b82f6" opacity="0.8" />
  <path d="M0 110 L35 110 C42 110 46 114 46 122 L46 160 L0 160 Z" fill="#60a5fa" opacity="0.9" />

  <!-- Floor Lamp Glow -->
  <circle cx="210" cy="30" r="90" fill="url(#lampGlow)" />

  <!-- SCENE ACTION: "猫一下子扑向了老鼠" (The cat pounces on the mouse) -->

  <!-- Action / Motion Streaks for the Pounce -->
  <path d="M 120 125 Q 140 105 165 120" stroke="url(#pounceStreak)" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 115 135 Q 140 115 160 135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Target: The Mouse (Fleeing / Surprised) -->
  <g transform="translate(175, 135)">
    <!-- Mouse Body -->
    <ellipse cx="15" cy="15" rx="12" ry="8" fill="#94a3b8" />
    <!-- Mouse Head -->
    <circle cx="23" cy="12" r="7" fill="#94a3b8" />
    <!-- Big Mouse Ear -->
    <circle cx="25" cy="6" r="4" fill="#cbd5e1" />
    <circle cx="25" cy="6" r="2" fill="#f43f5e" opacity="0.6" />
    <!-- Mouse Snout & Whiskers -->
    <circle cx="29" cy="13" r="1.5" fill="#334155" />
    <line x1="29" y1="14" x2="33" y2="13" stroke="#475569" stroke-width="1" />
    <line x1="29" y1="15" x2="33" y2="16" stroke="#475569" stroke-width="1" />
    <!-- Long Curving Tail -->
    <path d="M 4 17 C -2 15 -6 22 -10 18" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Tiny frightened legs running -->
    <line x1="12" y1="23" x2="8" y2="27" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="23" x2="22" y2="27" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <!-- Motion lines behind mouse -->
    <line x1="-3" y1="12" x2="-8" y2="10" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-2" y1="17" x2="-7" y2="17" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Subject: The Cat in Mid-Air Pounce (扑 - pū) -->
  <g transform="translate(85, 95)">
    <!-- Tail (Dynamic Swish) -->
    <path d="M -12 15 C -25 20 -25 5 -32 -2" stroke="#fb923c" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M -28 -2 C -33 -7 -30 -12 -25 -10" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" fill="none" /> <!-- White tip -->

    <!-- Cat Body (Stretched in Flight) -->
    <ellipse cx="0" cy="8" rx="22" ry="14" fill="#fb923c" transform="rotate(15)" />
    <!-- Tiger Stripes on Body -->
    <path d="M -5 -2 L -2 6" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 4 0 L 7 8" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />

    <!-- Back Paws (Tucked/Reaching) -->
    <circle cx="-16" cy="18" r="4" fill="#fb923c" />
    <circle cx="-10" cy="20" r="4" fill="#fb923c" />

    <!-- Cat Head (Eager, Focused Expression) -->
    <g transform="translate(16, -2)">
      <!-- Head Base -->
      <circle cx="0" cy="0" r="14" fill="#fb923c" />
      
      <!-- Ears (Forward, Aggressive/Playful stance) -->
      <polygon points="-11,-10 -15,-20 -4,-13" fill="#fb923c" />
      <polygon points="-10,-12 -13,-17 -6,-12" fill="#fbcfe8" />
      
      <polygon points="5,-11 12,-21 11,-12" fill="#fb923c" />
      <polygon points="6,-12 10,-18 9,-13" fill="#fbcfe8" />

      <!-- Big Focused Eyes -->
      <circle cx="-4" cy="-2" r="4.5" fill="#fef08a" />
      <circle cx="5" cy="-2" r="4.5" fill="#fef08a" />
      <ellipse cx="-4" cy="-2" rx="2" ry="3.5" fill="#0f172a" />
      <ellipse cx="5" cy="-2" rx="2" ry="3.5" fill="#0f172a" />
      <!-- Eye Sparkles -->
      <circle cx="-5" cy="-4" rx="1" ry="1.5" fill="#ffffff" />
      <circle cx="4" cy="-4" rx="1" ry="1.5" fill="#ffffff" />

      <!-- Cute Pink Nose & Confident Smile -->
      <polygon points="0.5,3 3,3 1.7,5" fill="#f43f5e" />
      <path d="M 0.5 5 Q 1.7 8 3 5" stroke="#334155" stroke-width="1.2" fill="none" stroke-linecap="round" />

      <!-- Whiskers -->
      <line x1="-7" y1="4" x2="-14" y2="2" stroke="#fed7aa" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-7" y1="7" x2="-14" y2="8" stroke="#fed7aa" stroke-width="1.2" stroke-linecap="round" />
      <line x1="9" y1="4" x2="16" y2="2" stroke="#fed7aa" stroke-width="1.2" stroke-linecap="round" />
      <line x1="9" y1="7" x2="16" y2="8" stroke="#fed7aa" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Front Paws (Reaching Out to Pounce / Grab) -->
    <g transform="translate(22, 10)">
      <path d="M 0 0 C 8 2 14 6 18 12" stroke="#fb923c" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Paws / Claws Out -->
      <circle cx="18" cy="13" r="4" fill="#f1f5f9" />
      <circle cx="21" cy="10" r="1.5" fill="#cbd5e1" />
      <circle cx="22" cy="14" r="1.5" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Dust Motes in Light) -->
  <circle cx="150" cy="100" r="1.5" fill="#fef08a" opacity="0.6" />
  <circle cx="165" cy="85" r="1" fill="#fef08a" opacity="0.8" />
  <circle cx="135" cy="115" r="2" fill="#fef08a" opacity="0.4" />
  <circle cx="100" cy="75" r="1" fill="#fef08a" opacity="0.5" />
</svg>