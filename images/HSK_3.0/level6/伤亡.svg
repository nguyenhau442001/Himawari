<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle hazard floor indicator -->
  <path d="M60 170 L180 170" stroke="#2A2F3D" stroke-width="4" stroke-linecap="round"/>

  <!-- Stylized modern building/structure symbol representing disaster context -->
  <path d="M80 140 L80 90 L120 70 L160 90 L160 140" fill="none" stroke="#3A4254" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 110 L140 110" stroke="#3A4254" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Central physical subject: Medical stretcher/cot representing casualties (shāngwáng) -->
  <!-- Stretcher legs -->
  <path d="M85 160 L75 185" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M155 160 L165 185" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="185" x2="172" y2="185" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <!-- Stretcher canvas base -->
  <path d="M70 145 L170 145 L165 162 L75 162 Z" fill="#334155"/>

  <!-- Emergency medical blanket / contour (representing injured/casualties) -->
  <path d="M85 145 C85 130 110 120 135 125 C150 128 160 140 160 145 Z" fill="#F59E0B"/>

  <!-- Patient head indicator -->
  <circle cx="95" cy="136" r="8" fill="#FDE68A"/>

  <!-- Medical cross badge denoting casualty / medical response -->
  <circle cx="120" cy="100" r="16" fill="#1E293B" stroke="#EF4444" stroke-width="3"/>
  <path d="M120 90 L120 110 M110 100 L130 100" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
</svg>