<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment / Background Elements -->
  <!-- Large window showing city lights outside -->
  <path d="M 140 30 L 210 30 L 210 110 L 140 110 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="30" x2="175" y2="110" stroke="#334155" stroke-width="1.5"/>
  <line x1="140" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="1.5"/>
  <!-- City building lights outside -->
  <rect x="148" y="45" width="6" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="158" y="50" width="8" height="15" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="185" y="40" width="7" height="12" rx="1" fill="#f59e0b" opacity="0.4"/>
  <rect x="195" y="60" width="5" height="10" rx="1" fill="#10b981" opacity="0.5"/>

  <!-- Bookshelf & Plant in background -->
  <rect x="20" y="40" width="35" height="70" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="20" y1="65" x2="55" y2="65" stroke="#334155" stroke-width="1.5"/>
  <line x1="20" y1="90" x2="55" y2="90" stroke="#334155" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="25" y="48" width="5" height="17" fill="#fb923c" rx="1"/>
  <rect x="31" y="45" width="6" height="20" fill="#38bdf8" rx="1"/>
  <rect x="38" y="50" width="4" height="15" fill="#ec4899" rx="1"/>

  <!-- Ambient light glow on desk -->
  <ellipse cx="110" cy="190" rx="90" ry="30" fill="url(#glowGrad)"/>

  <!-- Office Desk -->
  <rect x="20" y="155" width="200" height="12" rx="3" fill="#334155"/>
  <rect x="35" y="167" width="12" height="50" fill="#1e293b"/>
  <rect x="193" y="167" width="12" height="50" fill="#1e293b"/>

  <!-- Project Architecture Hologram / Model Display (The Project) -->
  <g transform="translate(130, 95)">
    <!-- Hologram pedestal -->
    <ellipse cx="25" cy="68" rx="25" ry="8" fill="#38bdf8" opacity="0.3"/>
    <path d="M 10 68 L 25 50 L 40 68 Z" fill="#38bdf8" opacity="0.2"/>
    
    <!-- Floating Project Model (Building / Blueprint graphics) -->
    <path d="M 15 50 L 25 30 L 35 50 Z" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="17" y="50" width="16" height="15" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Analytics Data Lines / Assessment markers -->
    <path d="M -5 35 L 10 45" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-5" cy="35" r="3" fill="#10b981"/>
    <path d="M 55 30 L 40 42" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="55" cy="30" r="3" fill="#f59e0b"/>
    
    <line x1="25" y1="20" x2="25" y2="30" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Laptop / Secondary Monitor -->
  <path d="M 75 145 L 115 145 L 120 155 L 70 155 Z" fill="#64748b"/>
  <rect x="73" y="115" width="44" height="32" rx="2" fill="url(#screenGrad)" stroke="#475569" stroke-width="1.5"/>
  <!-- Screen Data (Evaluation Charts) -->
  <polyline points="79,138 86,132 93,135 101,123 110,126" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="101" cy="123" r="2.5" fill="#10b981"/>
  <rect x="78" y="120" width="15" height="3" rx="1" fill="#38bdf8" opacity="0.8"/>

  <!-- Coffee Cup -->
  <rect x="122" y="138" width="12" height="17" rx="2" fill="#f8fafc"/>
  <path d="M 134 142 C 138 142 138 150 134 150" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- Expert Character (Evaluating the project) -->
  <g transform="translate(15, 60)">
    <!-- Body / Torso (Professional Blazer) -->
    <path d="M 35 75 C 35 65 50 65 55 65 C 60 65 75 65 75 75 L 82 105 L 28 105 Z" fill="#2563eb"/>
    <!-- Shirt collar & Tie -->
    <polygon points="50,65 55,77 60,65" fill="#f8fafc"/>
    <polygon points="53,75 57,75 56,92 54,92" fill="#ef4444"/>

    <!-- Head & Face -->
    <circle cx="55" cy="45" r="16" fill="#fbcfe8"/>
    <!-- Hair (Smart, professional styling) -->
    <path d="M 39 45 C 39 30 50 28 55 28 C 65 28 71 35 71 45 C 71 42 68 33 55 33 C 42 33 39 42 39 45 Z" fill="#334155"/>
    
    <!-- Glasses (Expert look) -->
    <rect x="44" y="40" width="10" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="56" y="40" width="10" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="54" y1="43" x2="56" y2="43" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Concentrated expression / thoughtful mouth -->
    <path d="M 52 56 Q 55 59 58 56" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms & Hands posing (Pointing/Evaluating gesture) -->
    <!-- Back Arm -->
    <path d="M 35 72 L 20 85 L 28 92" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Arm (Gesture pointing towards the holographic project) -->
    <path d="M 75 72 C 85 75 95 82 105 82" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand pointing -->
    <circle cx="108" cy="82" r="4.5" fill="#fbcfe8"/>
    <path d="M 110 80 L 117 78" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Foreground Assessment / Checkmark Graphic (Subtle UI accent floating) -->
  <g transform="translate(180, 110)">
    <circle cx="15" cy="15" r="14" fill="#10b981" opacity="0.9"/>
    <path d="M 9 15 L 13 19 L 21 10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>