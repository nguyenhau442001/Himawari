<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Ambient lighting & background interior elements -->
  <circle cx="120" cy="90" r="80" fill="url(#glow)" />
  
  <!-- Hanging display lights -->
  <path d="M80 0 L80 45" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <circle cx="80" cy="45" r="10" fill="#fbbf24" />
  <path d="M160 0 L160 35" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <circle cx="160" cy="35" r="8" fill="#fbbf24" />

  <!-- Wall shelf with new products / jars -->
  <rect x="50" y="55" width="140" height="6" rx="3" fill="#475569" />
  <!-- Jars on shelf -->
  <rect x="65" y="38" width="16" height="17" rx="3" fill="#38bdf8" opacity="0.8" />
  <path d="M70 38 L75 35 L81 35 L86 38 Z" fill="#94a3b8" />
  <rect x="90" y="33" width="20" height="22" rx="4" fill="#ec4899" opacity="0.8" />
  <path d="M96 33 L100 30 L104 30 L108 33 Z" fill="#94a3b8" />
  <rect x="130" y="36" width="18" height="19" rx="4" fill="#10b981" opacity="0.8" />
  
  <!-- Back wall decor / window frame silhouette -->
  <rect x="105" y="65" width="30" height="40" rx="2" fill="#0f172a" opacity="0.6" />

  <!-- Tasting Counter / Table -->
  <path d="M20 165 L220 165 L210 215 L30 215 Z" fill="url(#woodTable)" />
  <rect x="25" y="158" width="190" height="9" rx="4" fill="#f59e0b" />

  <!-- Foreground / Character interactions -->
  <!-- Host presenting (Left) -->
  <g transform="translate(15, 95)">
    <!-- Body -->
    <path d="M25 75 Q25 50 40 50 Q55 50 55 75 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="40" cy="35" r="14" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M28 32 Q40 18 52 30 Q52 24 40 22 Q28 24 28 32 Z" fill="#1e293b" />
    <!-- Apron -->
    <path d="M30 48 L50 48 L55 75 L25 75 Z" fill="#f8fafc" />
    <circle cx="40" cy="55" r="3" fill="#10b981" />
    <!-- Welcoming gesture arm -->
    <path d="M50 55 Q68 50 62 38" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Smiling face hints -->
    <circle cx="36" cy="34" r="1.5" fill="#1e293b" />
    <circle cx="44" cy="34" r="1.5" fill="#1e293b" />
    <path d="M38 40 Q40 43 42 40" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Customer / Taster tasting (Right) -->
  <g transform="translate(150, 90)">
    <!-- Body -->
    <path d="M20 80 Q20 55 35 55 Q50 55 50 80 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="35" cy="40" r="14" fill="#ffedd5" />
    <!-- Hair bun -->
    <circle cx="35" cy="22" r="6" fill="#475569" />
    <path d="M23 38 Q35 24 47 38 Q47 32 35 28 Q23 32 23 38 Z" fill="#475569" />
    <!-- Arm holding tasting cup up to mouth -->
    <path d="M25 58 Q12 48 20 40" stroke="#ffedd5" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Happy closed eyes (enjoying flavor) -->
    <path d="M30 38 Q33 36 36 38" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M36 38 Q39 36 42 38" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M34 44 Q36 46 38 44" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Central Tasting Tray / New Product Setup on Counter -->
  <!-- Elegant serving board -->
  <ellipse cx="120" cy="165" rx="45" ry="12" fill="#cbd5e1" />
  <ellipse cx="120" cy="163" rx="42" ry="10" fill="#f1f5f9" />

  <!-- Sample Cups & New Product items -->
  <!-- Cup 1 (Being tasted) -->
  <path d="M18 132 L26 132 L24 148 L20 148 Z" fill="#38bdf8" opacity="0.9" />
  <ellipse cx="22" cy="132" rx="4" ry="1.5" fill="#bae6fd" />
  <path d="M13 132 L31 132" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Product Display (New item: Decorated cake slice / dessert) -->
  <path d="M105 150 L135 150 L125 125 L115 125 Z" fill="#f43f5e" />
  <polygon points="110,150 130,150 120,127" fill="#fb7185" />
  <ellipse cx="120" cy="127" rx="5" ry="2" fill="#fda4af" />
  <!-- Cream topping & cherry -->
  <circle cx="120" cy="124" r="4" fill="#ffffff" />
  <circle cx="120" cy="121" r="3.5" fill="#dc2626" />

  <!-- Small sample glasses on tray -->
  <path d="M90 155 L98 155 L96 168 L92 168 Z" fill="#38bdf8" opacity="0.7" />
  <path d="M142 155 L150 155 L148 168 L144 168 Z" fill="#38bdf8" opacity="0.7" />
  
  <!-- Flavor / Delight sparkles to emphasize 'pǐncháng' experience -->
  <g fill="#fbbf24">
    <path d="M120 110 L122 115 L127 117 L122 119 L120 124 L118 119 L113 117 L118 115 Z" />
    <path d="M148 135 L149 138 L152 139 L149 140 L148 143 L147 140 L144 139 L147 138 Z" transform="scale(0.7) translate(70, 40)" />
    <path d="M85 130 L86 133 L89 134 L86 135 L85 138 L84 135 L81 134 L84 133 Z" transform="scale(0.8) translate(10, 10)" />
  </g>

</svg>