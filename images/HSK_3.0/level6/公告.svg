<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bulletin Board Frame -->
  <rect x="60" y="50" width="120" height="140" rx="8" fill="#2D343E" stroke="#4A5568" stroke-width="4"/>
  
  <!-- Bulletin Board Surface -->
  <rect x="70" y="60" width="100" height="120" rx="4" fill="#E2E8F0"/>
  
  <!-- Paper Documents (The Announcement) -->
  <rect x="85" y="75" width="70" height="20" rx="2" fill="#CBD5E0"/>
  <rect x="85" y="105" width="70" height="20" rx="2" fill="#CBD5E0"/>
  <rect x="85" y="135" width="70" height="20" rx="2" fill="#CBD5E0"/>
  
  <!-- Decorative Push Pin -->
  <circle cx="120" cy="65" r="5" fill="#F6AD55"/>
  
  <!-- Accent Lines on Papers -->
  <line x1="90" y1="82" x2="145" y2="82" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="112" x2="145" y2="112" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="142" x2="145" y2="142" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Notification Bell Icon (Top Right) -->
  <path d="M180 40 L180 50 L190 50 L190 40 Z" fill="#F6AD55"/>
  <path d="M185 35 C182 35 180 37 180 40 L190 40 C190 37 188 35 185 35" fill="#F6AD55"/>
  <circle cx="185" cy="52" r="2" fill="#F6AD55"/>
</svg>