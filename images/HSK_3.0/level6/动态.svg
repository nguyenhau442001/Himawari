<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Warm Desk Light -->
    <radialGradient id="desk-light" cx="65%" cy="30%" r="70%" fx="65%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Chart Line Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Window City View Mask -->
    <clipPath id="window-clip">
      <path d="M0,0 h180 v120 h-180 z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Layer -->
  <circle cx="160" cy="80" r="120" fill="url(#desk-light)" />

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- City Window Background (Market Context) -->
  <g transform="translate(145, 18)" opacity="0.4">
    <!-- Window Frame -->
    <rect x="0" y="0" width="70" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Distant Cityscape Silhouette -->
    <path d="M8,90 V50 h12 v40 M24,90 V35 h15 v55 M42,90 V60 h10 v30 M54,90 V42 h10 v48" fill="#1e293b"/>
    <!-- Rising Market Trend in Window -->
    <path d="M14,70 L30,50 L45,60 L60,35" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Bookshelf / Office Wall Details -->
  <path d="M15,50 h45 v4 h-45 z" fill="#334155" opacity="0.6"/>
  <rect x="22" y="32" width="6" height="18" rx="1" fill="#ec4899" opacity="0.7"/>
  <rect x="30" y="28" width="8" height="22" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="40" y="35" width="5" height="15" rx="1" fill="#f59e0b" opacity="0.7"/>

  <!-- Plant Prop (Life context) -->
  <path d="M25,145 c0,-10 10,-12 10,-22 c0,10 10,12 10,22 z" fill="#10b981" opacity="0.8"/>
  <path d="M30,135 c-5,-5 -10,-3 -15,-8 c6,5 10,2 15,8 z" fill="#059669" opacity="0.8"/>
  <path d="M35,138 c6,-4 10,-1 15,-5 c-5,4 -9,2 -15,5 z" fill="#34d399" opacity="0.8"/>
  <path d="M30,145 h10 v12 h-10 z" fill="#64748b" rx="2"/>

  <!-- Desk Surface -->
  <path d="M0,175 h240 v65 h-240 z" fill="#0f172a" />
  <path d="M0,175 h240 v3 h-240 z" fill="#334155" />

  <!-- MAIN MONITORS & MARKET CHARTS (Market Dynamics Representation) -->
  <!-- Left Auxiliary Monitor (Data Feeds) -->
  <g transform="translate(18, 95)">
    <rect x="0" y="0" width="45" height="65" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="3" y="3" width="39" height="45" fill="url(#screen-glow)"/>
    <!-- Mini bar charts -->
    <rect x="8" y="30" width="4" height="12" rx="1" fill="#38bdf8"/>
    <rect x="15" y="22" width="4" height="20" rx="1" fill="#10b981"/>
    <rect x="22" y="26" width="4" height="16" rx="1" fill="#fb923c"/>
    <rect x="29" y="15" width="4" height="27" rx="1" fill="#10b981"/>
    <!-- Monitor Stand -->
    <path d="M18,65 v10 h9 v-10 z" fill="#475569"/>
    <ellipse cx="22" cy="75" rx="10" ry="2" fill="#334155"/>
  </g>

  <!-- Center Main Monitor (Dynamic Market Trends) -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="105" height="85" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="4" y="4" width="97" height="63" fill="#090d16"/>
    <rect x="4" y="4" width="97" height="63" fill="url(#screen-glow)"/>

    <!-- UI Grid Lines -->
    <line x1="4" y1="20" x2="101" y2="20" stroke="#1e293b" stroke-width="1"/>
    <line x1="4" y1="40" x2="101" y2="40" stroke="#1e293b" stroke-width="1"/>
    <line x1="30" y1="4" x2="30" y2="67" stroke="#1e293b" stroke-width="1"/>
    <line x1="65" y1="4" x2="65" y2="67" stroke="#1e293b" stroke-width="1"/>

    <!-- Candlestick Charts & Dynamic Wave -->
    <!-- Candlesticks -->
    <path d="M15,45 v15 M13,48 h4 v10 h-4 z" fill="#ef4444" stroke="#ef4444" stroke-width="1"/>
    <path d="M28,30 v25 M26,35 h4 v15 h-4 z" fill="#10b981" stroke="#10b981" stroke-width="1"/>
    <path d="M42,38 v22 M40,42 h4 v12 h-4 z" fill="#ef4444" stroke="#ef4444" stroke-width="1"/>
    <path d="M55,18 v30 M53,22 h4 v18 h-4 z" fill="#10b981" stroke="#10b981" stroke-width="1"/>
    <path d="M70,25 v28 M68,28 h4 v15 h-4 z" fill="#10b981" stroke="#10b981" stroke-width="1"/>
    <path d="M85,12 v35 M83,16 h4 v20 h-4 z" fill="#10b981" stroke="#10b981" stroke-width="1"/>

    <!-- Glowing Trend Line overlay -->
    <path d="M15,50 L28,40 L42,48 L55,25 L70,35 L85,20 L95,15" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Upward Arrow Indicator Icon -->
    <circle cx="88" cy="20" r="4" fill="#10b981" opacity="0.3"/>
    <path d="M86,21 l2,-3 l2,3" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Monitor Stand -->
    <path d="M46,85 v12 h13 v-12 z" fill="#475569"/>
    <path d="M30,97 h45 c2,0 3,2 2,3 h-49 c-1,-1 0,-3 2,-3 z" fill="#334155"/>
  </g>

  <!-- FRONT DESK PROPS -->
  <!-- Coffee Mug -->
  <path d="M190,150 c0,-3 2,-5 5,-5 h12 c3,0 5,2 5,5 v12 c0,5 -3,8 -8,8 h-6 c-5,0 -8,-3 -8,-8 z" fill="#f8fafc"/>
  <path d="M212,153 c3,0 5,2 5,4 c0,2 -2,4 -5,4" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <path d="M198,138 c-1,-3 2,-6 5,-5 c3,1 4,4 2,6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Notebook & Pen -->
  <g transform="translate(145, 160) rotate(-5)">
    <polygon points="0,5 35,0 38,25 3,30" fill="#38bdf8"/>
    <polygon points="3,30 38,25 38,28 3,33" fill="#0284c7"/>
    <line x1="10" y1="8" x2="28" y2="6" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>
    <line x1="10" y1="14" x2="30" y2="12" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>
    <line x1="10" y1="20" x2="25" y2="18" stroke="#0f172a" stroke-width="1.5" opacity="0.4"/>
  </g>
  <line x1="135" y1="180" x2="160" y2="170" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- CHARACTER (Focused Analyst observing market dynamics) -->
  <g transform="translate(90, 110)">
    <!-- Body / Torso leaning slightly forward -->
    <path d="M25,50 c-5,10 -15,20 -25,30 h55 c-5,-10 -10,-20 -15,-30 z" fill="#1e3a8a"/> <!-- Dark blue suit jacket -->
    <path d="M18,50 l7,15 l7,-15 z" fill="#f8fafc"/> <!-- Shirt collar -->
    <polygon points="22,58 28,58 25,72" fill="#ef4444"/> <!-- Red tie -->

    <!-- Head & Face profile/3-quarter -->
    <g transform="translate(15, 12)">
      <!-- Neck -->
      <path d="M7,30 h8 v12 h-8 z" fill="#fbcfe8" />
      
      <!-- Head Base -->
      <circle cx="11" cy="16" r="15" fill="#fbcfe8"/>
      
      <!-- Hair (Modern styled dark hair) -->
      <path d="M-2,12 c1,-10 8,-16 18,-15 c7,1 12,6 13,14 c-2,2 -4,-1 -6,-2 c-4,-2 -8,-1 -11,2 c-3,2 -6,2 -10,1 z" fill="#0f172a"/>
      
      <!-- Focused Expressive Eye looking intently at the monitor -->
      <path d="M12,14 c2,0 4,1 5,3" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Eyebrow raised slightly in deep concentration -->
      <path d="M11,10 c2,-2 5,-1 6,0" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Ear -->
      <path d="M-3,17 c-2,0 -2,4 0,5" fill="none" stroke="#e0a7cb" stroke-width="2"/>

      <!-- Hand on chin / thoughtful gesture (Observing dynamics) -->
      <g transform="translate(12, 24)">
        <path d="M0,0 c3,2 6,6 4,10 c-1,2 -4,3 -6,1 c-2,-2 -2,-6 2,-11 z" fill="#fbcfe8"/>
        <path d="M-2,4 c-4,2 -8,6 -12,12 l4,3 c3,-5 7,-10 10,-14 z" fill="#1e3a8a"/>
      </g>
    </g>

    <!-- Arms & Hands -->
    <!-- Supporting Arm -->
    <path d="M35,60 c10,5 15,15 15,25 h-12 c-2,-7 -6,-15 -12,-20 z" fill="#1e3a8a"/>
  </g>

  <!-- Ambient Front lighting overlay for depth -->
  <linearGradient id="front-glow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
  </linearGradient>
  <rect width="240" height="240" rx="24" fill="url(#front-glow)" pointer-events="none"/>
</svg>