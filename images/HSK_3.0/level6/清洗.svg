<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Sink / Basin Structure -->
  <path d="M 60,110 L 180,110 L 170,175 C 170,183 163,190 155,190 L 85,190 C 77,190 70,183 70,175 Z" fill="#2B303C"/>
  <path d="M 65,110 L 175,110 L 175,118 L 65,118 Z" fill="#3A4252"/>
  <!-- Drain -->
  <ellipse cx="120" cy="180" rx="14" ry="5" fill="#1A1D24"/>
  <ellipse cx="120" cy="179" rx="8" ry="2.5" fill="#2B303C"/>

  <!-- Faucet -->
  <path d="M 110,50 L 110,80 C 110,88 118,92 125,92 L 135,92" fill="none" stroke="#8C9BAE" stroke-width="8" stroke-linecap="round"/>
  <!-- Faucet Nozzle -->
  <rect x="130" y="88" width="12" height="6" rx="2" fill="#A0AFBF"/>

  <!-- Flowing Water (Curved streaming action for 清洗) -->
  <path d="M 134,94 C 134,115 122,125 120,145" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 137,94 C 137,120 125,130 123,155" fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Water Splashes / Droplets -->
  <circle cx="115" cy="158" r="3" fill="#38BDF8" opacity="0.8"/>
  <circle cx="128" cy="162" r="2" fill="#7DD3FC" opacity="0.9"/>
  <circle cx="120" cy="166" r="2.5" fill="#38BDF8" opacity="0.7"/>

  <!-- Object being washed (Fresh shiny red Apple) -->
  <path d="M 120,132 C 112,132 106,140 106,150 C 106,162 116,168 120,172 C 124,168 134,162 134,150 C 134,140 128,132 120,132 Z" fill="#F43F5E"/>
  <!-- Apple Highlight -->
  <path d="M 113,142 C 113,140 115,137 117,136" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Apple Stem & Leaf -->
  <path d="M 120,132 C 120,127 123,124 126,123" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 123,126 C 127,124 130,126 132,129 C 130,131 126,131 123,126 Z" fill="#4ADE80"/>

  <!-- Dynamic Motion / Action Lines (indicating scrubbing/washing motion) -->
  <path d="M 96,142 Q 102,148 96,154" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 144,142 Q 138,148 144,154" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Sparkles showing clean results -->
  <path d="M 98,126 L 100,130 L 104,132 L 100,134 L 98,138 L 96,134 L 92,132 L 96,130 Z" fill="#FBBF24"/>
  <path d="M 145,120 L 146,123 L 149,124 L 146,125 L 145,128 L 144,125 L 141,124 L 144,123 Z" fill="#FBBF24" transform="scale(0.8) translate(40, 20)"/>

  <!-- Hands gently holding/washing the fruit -->
  <!-- Left Hand -->
  <path d="M 85,170 C 85,160 92,152 100,154 C 104,155 106,158 106,162 L 106,175 C 106,180 100,185 92,185 C 88,185 85,180 85,170 Z" fill="#FFDBAC"/>
  <!-- Right Hand -->
  <path d="M 155,170 C 155,160 148,152 140,154 C 136,155 134,158 134,162 L 134,175 C 134,180 140,185 148,185 C 152,185 155,180 155,170 Z" fill="#FFDBAC"/>

</svg>