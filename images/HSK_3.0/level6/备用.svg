<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambience for modern dark mode UI -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Main Object: Backup Battery Pack (Power Bank) representing "备用" (dự phòng) -->
  <!-- Primary active/main battery (slightly recessed or background) -->
  <g transform="translate(75, 60)">
    <!-- Main Battery Body -->
    <rect x="0" y="20" width="50" height="90" rx="8" fill="#2E384D"/>
    <!-- Terminal top -->
    <rect x="17" y="13" width="16" height="7" rx="3" fill="#4B5563"/>
    <!-- LED Indicator (Cyan - active) -->
    <circle cx="25" cy="40" r="3" fill="#38BDF8"/>
    <!-- Battery Level Lines -->
    <rect x="12" y="60" width="26" height="4" rx="2" fill="#4B5563"/>
    <rect x="12" y="72" width="26" height="4" rx="2" fill="#4B5563"/>
    <rect x="12" y="84" width="26" height="4" rx="2" fill="#4B5563"/>
  </g>

  <!-- Secondary/Backup Battery (Prominent, High-contrast Accent Color for "备用" / Backup) -->
  <g transform="translate(115, 75)">
    <!-- Drop Shadow / Depth -->
    <rect x="4" y="4" width="56" height="100" rx="10" fill="#0F172A" opacity="0.4"/>
    
    <!-- Backup Battery Body -->
    <rect x="0" y="0" width="56" height="100" rx="10" fill="#1E293B"/>
    <rect x="3" y="3" width="50" height="94" rx="8" fill="#334155"/>
    
    <!-- Terminal top -->
    <rect x="18" y="-7" width="20" height="7" rx="3.5" fill="#F59E0B"/>
    
    <!-- Power/Energy Core Symbol (Lightning Bolt) in Warm Gold Accent -->
    <path d="M30 32L20 52H30L26 68L40 46H30L36 32H30Z" fill="#F59E0B"/>
    
    <!-- Status LED (Ready/Backup indicator) -->
    <circle cx="28" cy="84" r="4" fill="#10B981"/>
    
    <!-- Subtle grip lines -->
    <line x1="14" y1="18" x2="42" y2="18" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="24" x2="42" y2="24" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small protective icon overlay / readiness cue (Shield outline representing preparedness) -->
  <path d="M45 155 C45 135 60 120 75 115 C90 120 105 135 105 155 C105 175 90 190 75 195 C60 190 45 175 45 155 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
  
  <!-- Checkmark for readiness/reliability -->
  <path d="M68 155L73 161L84 148" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>