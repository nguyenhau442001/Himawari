  <path d="M105 205 Q 95 170 80 150" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M135 205 Q 145 165 160 140" stroke="#22C55E" stroke-width="4" stroke-linecap="round" fill="none"/>
