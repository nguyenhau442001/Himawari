  <path d="M0 200 Q 80 185 140 195 T 240 185 L 240 240 L 0 240 Z" fill="#243D2F"/>
  
  <!-- Central Physical Object: Wild Sprouts and Grass (Cỏ dại / 野草) representing the noun physical entity -->
  <!-- Central vibrant green wild grass clump -->
  <path d="M120 205 C120 205 110 160 95 135 C88 123 75 105 60 95 C75 105 90 120 100 145 C108 165 115 185 120 205 Z" fill="#4ADE80" opacity="0.9"/>
  <path d="M120 205 C120 205 130 150 145 120 C155 102 170 85 185 75 C170 90 155 115 145 140 C135 165 125 185 120 205 Z" fill="#22C55E" opacity="0.95"/>
  <path d="M120 205 L120 110 C120 110 120 90 120 70 C120 90 120 110 120 205 Z" fill="#86EFAC"/>
  
