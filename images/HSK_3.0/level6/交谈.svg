<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Tea Table -->
  <path d="M60 180 L180 180 L170 160 L70 160 Z" fill="#4A5568"/>
  <ellipse cx="120" cy="160" rx="50" ry="10" fill="#2D3748"/>
  
  <!-- Tea Cups -->
  <circle cx="100" cy="155" r="8" fill="#F6AD55"/>
  <circle cx="140" cy="155" r="8" fill="#F6AD55"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#CBD5E0"/>
    <path d="M5 40 Q20 60 35 40" stroke="#CBD5E0" stroke-width="4" fill="none"/>
    <path d="M10 70 L30 70 L25 120 L15 120 Z" fill="#718096"/>
    <!-- Motion lines for talking -->
    <path d="M45 20 Q55 15 65 20 M45 25 Q55 20 65 25" stroke="#F6AD55" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#A0AEC0"/>
    <path d="M5 40 Q20 60 35 40" stroke="#A0AEC0" stroke-width="4" fill="none"/>
    <path d="M10 70 L30 70 L25 120 L15 120 Z" fill="#4A5568"/>
    <!-- Motion lines for listening/responding -->
    <path d="M-5 20 Q-15 15 -25 20 M-5 25 Q-15 20 -25 25" stroke="#F6AD55" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Decorative steam/atmosphere -->
  <path d="M100 140 Q105 120 100 100" stroke="#F6AD55" stroke-opacity="0.5" stroke-width="2" fill="none"/>
  <path d="M140 140 Q135 120 140 100" stroke="#F6AD55" stroke-opacity="0.5" stroke-width="2" fill="none"/>
</svg>