<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: Cherry blossom branch and ambient glow -->
  <g opacity="0.35">
    <!-- Branch -->
    <path d="M20 50 Q 80 45, 120 70 T 220 60" stroke="#3A4454" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M90 62 Q 110 90, 105 110" stroke="#3A4454" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M160 65 Q 180 90, 195 105" stroke="#3A4454" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Cherry blossoms (pink petals) -->
    <circle cx="75" cy="52" r="5" fill="#FFB7C5"/>
    <circle cx="105" cy="110" r="4" fill="#FFB7C5"/>
    <circle cx="140" cy="65" r="5" fill="#FFB7C5"/>
    <circle cx="195" cy="105" r="4.5" fill="#FFB7C5"/>
    <circle cx="50" cy="48" r="3.5" fill="#FFB7C5"/>
  </g>

  <!-- Ground Line -->
  <path d="M 40 195 L 200 195" stroke="#2C3544" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Character (Tourist / 游人) -->
  <g transform="translate(15, 0)">
    <!-- Body / Jacket -->
    <path d="M95 135 L125 135 L132 185 C132 191, 127 195, 121 195 L99 195 C93 195, 88 191, 88 185 Z" fill="#3B82F6"/>
    <path d="M110 135 L110 195" stroke="#2563EB" stroke-width="2"/>

    <!-- Backpack (Traveler/Tourist hallmark) -->
    <rect x="79" y="125" width="22" height="40" rx="6" fill="#F59E0B"/>
    <rect x="83" y="130" width="14" height="22" rx="3" fill="#D97706"/>
    <!-- Backpack straps -->
    <path d="M85 125 C85 115, 100 115, 100 125" stroke="#D97706" stroke-width="3" fill="none"/>

    <!-- Neck -->
    <rect x="104" y="118" width="12" height="18" fill="#FBBF24"/>

    <!-- Head -->
    <circle cx="110" cy="102" r="16" fill="#FBBF24"/>

    <!-- Hair (Stylish Traveler) -->
    <path d="M94 100 C94 88, 102 85, 110 85 C120 85, 126 92, 126 102 C124 102, 122 95, 110 94 C98 93, 95 98, 94 100 Z" fill="#1E293B"/>

    <!-- Camera (Tourist hallmark accessory held in hand) -->
    <!-- Arm holding camera -->
    <path d="M125 145 C135 145, 142 135, 145 130" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Camera Body -->
    <rect x="133" y="120" width="24" height="18" rx="3" fill="#94A3B8"/>
    <!-- Camera Lens -->
    <circle cx="145" cy="129" r="6" fill="#334155"/>
    <circle cx="145" cy="129" r="3" fill="#60A5FA"/>
    <!-- Camera Top Flash/Viewfinder -->
    <rect x="139" y="117" width="8" height="4" rx="1" fill="#64748B"/>

    <!-- Other Arm (Relaxed) -->
    <path d="M95 140 L85 165" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>

    <!-- Legs & Shoes -->
    <path d="M102 195 L102 215 C102 218, 98 218, 98 215 L98 195" fill="#1E293B"/>
    <path d="M118 195 L118 215 C118 218, 122 218, 122 215 L122 195" fill="#1E293B"/>
    <!-- Sneakers -->
    <rect x="90" y="213" width="14" height="6" rx="3" fill="#F8FAFC"/>
    <rect x="116" y="213" width="14" height="6" rx="3" fill="#F8FAFC"/>
  </g>

  <!-- Foreground Cherry Blossom Floating Petals (Adding context of sightseeing) -->
  <g opacity="0.8">
    <path d="M45 100 Q 50 105, 55 100 Q 60 95, 50 90 Z" fill="#FFB7C5" transform="rotate(15 50 100)"/>
    <path d="M185 140 Q 190 145, 195 140 Q 200 135, 190 130 Z" fill="#FFB7C5" transform="rotate(-30 190 140)"/>
    <path d="M170 80 Q 174 84, 178 80 Q 182 76, 174 72 Z" fill="#FFB7C5" transform="rotate(45 174 80)"/>
  </g>
</svg>