<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/atmosphere representing the forest context -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Botanical element / Thorn branch (荆棘) -->
  <path d="M70,170 Q110,130 170,90" fill="none" stroke="#3E4C59" stroke-width="6" stroke-linecap="round"/>
  <!-- Leaf 1 -->
  <path d="M100,145 Q90,130 105,125 Q115,140 100,145" fill="#2E4A3E"/>
  <!-- Leaf 2 -->
  <path d="M140,115 Q130,100 145,95 Q155,110 140,115" fill="#2E4A3E"/>

  <!-- Sharp Thorns (刺) -->
  <polygon points="115,135 125,120 123,138" fill="#8899A6"/>
  <polygon points="145,108 160,92 150,112" fill="#8899A6"/>

  <!-- The main action: Finger being pricked (扎) -->
  <!-- Fingertip coming down -->
  <path d="M105,75 C105,65 115,55 125,55 C135,55 145,65 145,75 L145,115 C145,120 135,125 125,125 C115,125 105,120 105,115 Z" fill="#E0AC9D"/>
  
  <!-- Fingernail -->
  <path d="M115,62 C115,60 120,58 125,58 C130,58 135,60 135,66 C135,70 130,73 125,73 C120,73 115,70 115,62 Z" fill="#F0C2B8" opacity="0.8"/>

  <!-- Main sharp thorn piercing the finger (Focus accent color: Orange/Gold) -->
  <polygon points="125,120 120,95 130,95" fill="#F59E0B"/>
  
  <!-- Point of impact / Tiny drop of blood -->
  <circle cx="125,92" cy="88" r="3.5" fill="#EF4444"/>
  <!-- Pain/Impact radiating sparks (Focus/Action indicator) -->
  <path d="M115,82 L110,78" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M135,82 L140,78" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M125,78 L125,72" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>