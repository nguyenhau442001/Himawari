<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Base -->
  <path d="M40 190 H200" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Human Character (The "Law" or "Constraint" agent) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="12" fill="#FBD38D"/>
    <path d="M20 32 L20 70 M20 45 L5 60 M20 45 L35 60 M5 90 L20 70 L35 90" stroke="#FBD38D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- The "Action" - Restraining/Guiding the behavior -->
  <g transform="translate(120, 120)">
    <!-- The "Behavior" (a smaller character or object moving forward) -->
    <circle cx="40" cy="40" r="8" fill="#63B3ED"/>
    <path d="M40 48 L40 70" stroke="#63B3ED" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Motion lines showing forward intent -->
    <path d="M55 40 L70 40 M52 30 L62 30" stroke="#63B3ED" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- The constraint (a firm, guiding hand gesture) -->
    <path d="M20 40 L0 40" stroke="#FBD38D" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 30 L10 50" stroke="#FBD38D" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Visualizing the "Constraint" effect: A boundary line -->
  <path d="M110 80 L110 180" stroke="#E53E3E" stroke-width="4" stroke-dasharray="8 8"/>
</svg>