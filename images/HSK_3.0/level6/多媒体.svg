<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object representing "多媒体" (Multimedia: Monitor / Display with media elements) -->
  <g transform="translate(0, 0)">
    <!-- Stand / Base -->
    <path d="M95 180 L145 180 L155 190 L85 190 Z" fill="#4B5563"/>
    <rect x="112" y="150" width="16" height="32" fill="#374151"/>
    
    <!-- Monitor Outer Bezel -->
    <rect x="44" y="60" width="152" height="100" rx="10" fill="#111827" stroke="#374151" stroke-width="3"/>
    
    <!-- Screen Inner Area -->
    <rect x="52" y="68" width="136" height="84" rx="6" fill="#0F172A"/>
    
    <!-- Multimedia Content Visualizations on Screen -->
    <!-- Video / Play Icon (Center) -->
    <circle cx="120" cy="110" r="22" fill="#F59E0B" opacity="0.9"/>
    <polygon points="113,99 131,110 113,121" fill="#111827"/>
    
    <!-- Image / Landscape Graphic (Top Left) -->
    <rect x="62" y="78" width="36" height="26" rx="3" fill="#1E293B"/>
    <circle cx="72" cy="86" r="4" fill="#38BDF8"/>
    <path d="M62 98 L72 88 L84 100 L98 90 L98 102 L62 102 Z" fill="#0EA5E9" opacity="0.6"/>
    
    <!-- Audio Waveform / Music (Top Right) -->
    <rect x="142" y="78" width="36" height="26" rx="3" fill="#1E293B"/>
    <rect x="150" y="88" width="3" height="10" rx="1.5" fill="#EC4899"/>
    <rect x="156" y="84" width="3" height="18" rx="1.5" fill="#EC4899"/>
    <rect x="162" y="87" width="3" height="12" rx="1.5" fill="#EC4899"/>
    <rect x="168" y="83" width="3" height="20" rx="1.5" fill="#EC4899"/>
    
    <!-- Text Document Lines (Bottom Left) -->
    <rect x="62" y="118" width="36" height="26" rx="3" fill="#1E293B"/>
    <rect x="68" y="124" width="20" height="3" rx="1" fill="#10B981"/>
    <rect x="68" y="131" width="24" height="2" rx="1" fill="#64748B"/>
    <rect x="68" y="137" width="14" height="2" rx="1" fill="#64748B"/>

    <!-- Interactive Elements / Floating Nodes (Bottom Right) -->
    <rect x="142" y="118" width="36" height="26" rx="3" fill="#1E293B"/>
    <circle cx="153" cy="131" r="4" fill="#8B5CF6"/>
    <circle cx="167" cy="125" r="3" fill="#38BDF8"/>
    <circle cx="167" cy="137" r="3" fill="#F59E0B"/>
    <line x1="156" y1="129" x2="164" y2="127" stroke="#64748B" stroke-width="1.5"/>
    <line x1="156" y1="133" x2="164" y2="135" stroke="#64748B" stroke-width="1.5"/>
  </g>
</svg>