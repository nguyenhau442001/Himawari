<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Interior Environment: Convenience Store / Lottery Counter -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <!-- Counter furniture -->
  <rect x="20" y="140" width="200" height="90" rx="6" fill="#334155" filter="url(#shadow)"/>
  <path d="M 30 140 L 210 140 L 220 160 L 20 160 Z" fill="#475569" opacity="0.5"/>
  <!-- Glowing Lottery Display Screen / Poster in background -->
  <rect x="50" y="45" width="140" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="77" r="20" fill="#fef08a" opacity="0.2"/>
  
  <!-- Giant Lottery Tumbler Machine on Counter -->
  <g transform="translate(160, 100)" filter="url(#shadow)">
    <!-- Stand -->
    <rect x="-8" y="30" width="16" height="15" fill="#64748b"/>
    <ellipse cx="0" cy="45" rx="16" ry="6" fill="#475569"/>
    <!-- Glass Sphere -->
    <circle cx="0" cy="0" r="26" fill="#94a3b8" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="2.5"/>
    <path d="M -15 -18 A 18 18 0 0 1 15 -18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Tiny lottery balls inside -->
    <circle cx="-6" cy="-4" r="5" fill="#f59e0b"/>
    <circle cx="8" cy="6" r="5" fill="#ef4444"/>
    <circle cx="2" cy="-10" r="5" fill="#3b82f6"/>
  </g>

  <!-- Disappointed Character (Customer holding losing tickets) -->
  <g transform="translate(75, 105)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M -25 70 C -25 45 -15 35 0 35 C 15 35 25 45 25 70 Z" fill="#0ea5e9"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="18" fill="#fbcfe8"/>
    <!-- Sad/Confused Face Expression -->
    <path d="M -6 7 Q 0 13 6 7" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/> <!-- Frown -->
    <circle cx="-6" cy="5" r="1.5" fill="#334155"/>
    <circle cx="6" cy="5" r="1.5" fill="#334155"/>
    <!-- Hair -->
    <path d="M -18 2 C -15 -8 15 -8 18 2 C 12 -4 -12 -4 -18 2 Z" fill="#334155"/>
    <!-- Drooping Posture/Shoulders -->
    <path d="M -25 45 Q -35 55 -30 65" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <path d="M 25 45 Q 35 55 30 65" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Scraped Lottery Tickets / Debris falling or held -->
  <g transform="translate(50, 140) rotate(-15)">
    <rect x="0" y="0" width="30" height="18" rx="2" fill="url(#ticket-grad)"/>
    <rect x="4" y="4" width="14" height="4" rx="1" fill="#ffffff" opacity="0.7"/>
    <circle cx="23" cy="9" r="3" fill="#fbbf24"/>
  </g>
  <g transform="translate(100, 150) rotate(22)">
    <rect x="0" y="0" width="28" height="16" rx="2" fill="#38bdf8"/>
    <rect x="3" y="3" width="12" height="3" rx="1" fill="#ffffff" opacity="0.7"/>
    <circle cx="21" cy="8" r="2.5" fill="#f43f5e"/>
  </g>

  <!-- Visual Metaphor for "Low Probability" (Scattered missed icons / fading small stars or cross marks) -->
  <g opacity="0.8">
    <!-- Red X marks indicating misses -->
    <path d="M 45 60 L 55 70 M 55 60 L 45 70" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M 185 50 L 193 58 M 193 50 L 185 58" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 110 35 L 116 41 M 116 35 L 110 41" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Single tiny glowing star way off representing the rare win -->
    <g transform="translate(135, 30)">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="url(#glow-gold)" filter="url(#shadow)"/>
    </g>
  </g>

  <!-- Atmospheric Foreground Details / Cashier Counter Edge -->
  <rect x="0" y="210" width="240" height="30" fill="#090d16" opacity="0.6"/>
</svg>