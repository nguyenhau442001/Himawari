<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Night sky background with distant stars -->
  <circle cx="50" cy="50" r="1" fill="#4A5568"/>
  <circle cx="190" cy="40" r="1.5" fill="#4A5568"/>
  <circle cx="210" cy="90" r="1" fill="#4A5568"/>
  <circle cx="40" cy="90" r="1" fill="#4A5568"/>
  
  <!-- Glowing Moon -->
  <circle cx="190" cy="65" r="22" fill="#2D3748"/>
  <path d="M190 43 A22 22 0 0 1 212 65 A22 22 0 0 1 190 87 A22 22 0 0 1 190 43 Z" fill="#F6AD55" opacity="0.9"/>
  <circle cx="185" cy="58" r="3" fill="#DD6B20" opacity="0.3"/>
  <circle cx="198" cy="73" r="4" fill="#DD6B20" opacity="0.3"/>

  <!-- Distant mountain range -->
  <polygon points="20,150 70,100 130,150" fill="#252D3D"/>
  <polygon points="100,150 160,85 220,150" fill="#202836"/>

  <!-- Rolling hills (Wilderness ground) -->
  <path d="M0 150 Q 80 120, 150 145 T 240 135 L 240 240 L 0 240 Z" fill="#2B4C3F"/>
  <path d="M0 170 Q 110 140, 240 165 L 240 240 L 0 240 Z" fill="#1E382E"/>

  <!-- Pine trees in the wilderness -->
  <!-- Tree group left -->
  <polygon points="35,115 20,140 50,140" fill="#142821"/>
  <polygon points="35,100 25,120 45,120" fill="#1B382D"/>
  <rect x="33" y="140" width="4" height="15" fill="#2D3748"/>

  <polygon points="65,125 52,150 78,150" fill="#142821"/>
  <polygon points="65,110 55,130 75,130" fill="#1B382D"/>
  <rect x="63" y="150" width="4" height="15" fill="#2D3748"/>

  <!-- Tree group right -->
  <polygon points="200,120 185,145 215,145" fill="#142821"/>
  <polygon points="200,105 190,125 210,125" fill="#1B382D"/>
  <rect x="198" y="145" width="4" height="15" fill="#2D3748"/>

  <!-- Central Animal: Wolf representing "survival in the wild" (野外) -->
  <!-- Wolf Body -->
  <ellipse cx="120" cy="175" rx="28" ry="16" fill="#718096"/>
  
  <!-- Wolf Hind Leg -->
  <path d="M 98 175 Q 92 195, 88 205 L 96 205 Q 100 190, 106 178 Z" fill="#4A5568"/>
  <!-- Wolf Fore Leg -->
  <path d="M 138 175 Q 142 195, 146 205 L 154 205 Q 150 190, 144 178 Z" fill="#4A5568"/>

  <!-- Wolf Neck & Head -->
  <path d="M 105 168 L 125 150 L 138 172 Z" fill="#718096"/>
  <polygon points="120,135 130,158 112,155" fill="#718096"/>
  
  <!-- Wolf Ears -->
  <polygon points="112,138 106,120 120,132" fill="#4A5568"/>
  <polygon points="125,135 134,118 130,135" fill="#4A5568"/>

  <!-- Wolf Muzzle -->
  <polygon points="128,145 142,148 130,156" fill="#A0AEC0"/>
  <circle cx="140" cy="147" r="2" fill="#1A1D24"/>

  <!-- Wolf Glowing Alert Eye -->
  <circle cx="127" cy="142" r="2" fill="#F6AD55"/>

  <!-- Wolf Tail (Alert, horizontal/slightly curved) -->
  <path d="M 94 170 Q 70 160, 60 145 Q 75 158, 96 172 Z" fill="#4A5568"/>

  <!-- Foreground Grass Tufts -->
  <path d="M 20 205 L 25 190 L 30 205" stroke="#319795" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 26 205 L 30 195 L 35 205" stroke="#319795" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <path d="M 210 210 L 214 198 L 218 210" stroke="#319795" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 215 210 L 220 200 L 225 210" stroke="#319795" stroke-width="2" stroke-linecap="round" fill="none"/>

  <path d="M 100 210 L 104 197 L 108 210" stroke="#2B6CB0" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>