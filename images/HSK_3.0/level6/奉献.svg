<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lampLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="clothingTeacher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Wallpaper & Classroom Interior -->
  <g id="environment">
    <!-- Back wall grid / bookshelf backing -->
    <rect x="20" y="20" width="200" height="150" fill="#172033" rx="4"/>
    
    <!-- Large arched classroom window with night sky outside -->
    <path d="M 160 30 L 200 30 L 200 130 L 160 130 Z" fill="url(#windowGlow)"/>
    <path d="M 180 35 L 180 125" stroke="#334155" stroke-width="1.5"/>
    <path d="M 160 70 L 200 70" stroke="#334155" stroke-width="1.5"/>
    <!-- Stars outside -->
    <circle cx="170" cy="45" r="1" fill="#cbd5e1" opacity="0.8"/>
    <circle cx="190" cy="55" r="1.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="175" cy="95" r="1" fill="#cbd5e1" opacity="0.6"/>
    <circle cx="192" cy="110" r="1.2" fill="#38bdf8" opacity="0.8"/>

    <!-- Bookshelf stacked with books (representing education/career) -->
    <rect x="25" y="40" width="35" height="90" fill="#0f172a" rx="2"/>
    <line x1="25" y1="70" x2="60" y2="70" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="100" x2="60" y2="100" stroke="#334155" stroke-width="2"/>
    <!-- Colored book spines -->
    <rect x="28" y="45" width="6" height="22" fill="#ef4444" rx="1"/>
    <rect x="36" y="48" width="8" height="19" fill="#10b981" rx="1"/>
    <rect x="46" y="43" width="7" height="24" fill="#f59e0b" rx="1"/>
    <rect x="28" y="75" width="9" height="22" fill="#8b5cf6" rx="1"/>
    <rect x="39" y="78" width="6" height="19" fill="#ec4899" rx="1"/>
    <rect x="48" y="73" width="8" height="24" fill="#06b6d4" rx="1"/>

    <!-- Blackboard with educational sketches (math formulas / geometric shapes) -->
    <rect x="68" y="35" width="80" height="55" fill="#064e3b" stroke="#334155" stroke-width="2" rx="2"/>
    <!-- Chalk strokes -->
    <path d="M 78 50 Q 85 45 92 52" stroke="#a7f3d0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="115" cy="50" r="8" stroke="#a7f3d0" stroke-width="1.2" fill="none"/>
    <text x="132" y="55" font-family="sans-serif" font-size="10" fill="#a7f3d0">∑</text>
    <path d="M 78 70 L 90 62 L 102 70 Z" stroke="#a7f3d0" stroke-width="1.2" fill="none"/>
    <path d="M 115 65 L 135 75" stroke="#a7f3d0" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- Desk Surface -->
    <rect x="15" y="160" width="210" height="12" fill="url(#deskWood)" rx="2"/>
    <rect x="10" y="172" width="220" height="6" fill="#92400e" rx="1"/>
    <!-- Desk support legs -->
    <rect x="35" y="178" width="8" height="45" fill="#334155"/>
    <rect x="195" y="178" width="8" height="45" fill="#334155"/>
  </g>

  <!-- Foreground Props on Desk -->
  <g id="desk-props">
    <!-- Stack of graded papers / test sheets -->
    <polygon points="40,160 75,155 78,160 43,165" fill="#f8fafc"/>
    <polygon points="38,157 73,152 76,157 41,162" fill="#e2e8f0"/>
    <polygon points="35,154 70,149 73,154 38,159" fill="#ffffff"/>
    <!-- Red correction marks on paper -->
    <path d="M 45 153 Q 48 150 51 154" stroke="#ef4444" stroke-width="1.5" fill="none"/>
    <circle cx="58" cy="151" r="2.5" fill="#ef4444"/>

    <!-- Globe of the world (symbolizing lifelong dedication to teaching/world) -->
    <circle cx="185" cy="135" r="18" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <!-- Continents silhouette -->
    <path d="M 175 125 Q 182 120 188 128 Q 192 135 185 142 Q 178 145 174 138 Z" fill="#10b981"/>
    <path d="M 180 148 Q 185 145 190 150 Z" fill="#10b981"/>
    <!-- Globe stand -->
    <path d="M 185 153 L 185 160" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 173 135 A 15 15 0 0 0 197 135" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <ellipse cx="185" cy="160" rx="8" ry="3" fill="#475569"/>

    <!-- Desk Lamp providing warm downward focus -->
    <path d="M 115 160 L 115 130 L 125 110" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 113 107 L 132 107 L 138 116 L 107 116 Z" fill="#f59e0b"/>
    <!-- Lamp light cone projection -->
    <polygon points="120,116 85,165 155,165" fill="url(#lampLight)" style="mix-blend-mode: screen;"/>
    <!-- Ink pot & fountain pen -->
    <ellipse cx="90" cy="158" rx="6" ry="4" fill="#334155"/>
    <path d="M 95 156 L 110 150" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Character: Dedicated Older Teacher working late at night -->
  <g id="teacher-character">
    <!-- Teacher Body / Torso (leaning forward attentively) -->
    <path d="M 95 160 C 90 135 105 120 120 120 C 135 120 145 135 145 160 Z" fill="url(#clothingTeacher)"/>
    <!-- White shirt collar & tie -->
    <polygon points="112,122 120,132 128,122" fill="#ffffff"/>
    <polygon points="118,132 120,148 122,132" fill="#ef4444"/>

    <!-- Teacher Head & Face (wise, serene, warm expression) -->
    <g id="head">
      <!-- Neck -->
      <rect x="114" y="110" width="12" height="15" fill="#fcd34d" rx="4"/>
      <!-- Face base -->
      <circle cx="120" cy="100" r="18" fill="#fcd34d"/>
      <!-- Graying hair (showing a lifetime of service/aging gracefully) -->
      <path d="M 102 100 C 102 85 110 80 120 80 C 130 80 138 85 138 100 C 138 102 136 102 136 98 C 136 88 129 83 120 83 C 111 83 104 88 104 98 C 104 102 102 102 102 100 Z" fill="#94a3b8"/>
      <path d="M 104 97 C 105 90 110 85 120 85 C 130 85 135 90 136 97 C 132 94 126 93 120 93 C 114 93 108 94 104 97 Z" fill="#64748b"/>
      
      <!-- Gentle friendly eyes looking down at work -->
      <path d="M 110 98 Q 114 101 118 98" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 122 98 Q 126 101 130 98" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Round intellectual glasses -->
      <circle cx="114" cy="98" r="6" stroke="#475569" stroke-width="1.5" fill="none"/>
      <circle cx="126" cy="98" r="6" stroke="#475569" stroke-width="1.5" fill="none"/>
      <line x1="120" y1="98" x2="120" y2="97" stroke="#475569" stroke-width="1.5"/>

      <!-- Warm smile -->
      <path d="M 116 108 Q 120 112 124 108" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Rosy cheeks showing warmth/dedication -->
      <circle cx="109" cy="104" r="3" fill="#f87171" opacity="0.4"/>
      <circle cx="131" cy="104" r="3" fill="#f87171" opacity="0.4"/>
    </g>

    <!-- Arms & Hands (actively writing/grading papers) -->
    <!-- Right arm reaching down to desk -->
    <path d="M 135 135 C 145 140 148 150 140 156" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right hand holding pen -->
    <circle cx="138" cy="158" r="4" fill="#fcd34d"/>
    <line x1="138" y1="158" x2="130" y2="162" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left arm resting gently -->
    <path d="M 105 135 C 95 142 98 155 105 160" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="106" cy="162" r="4" fill="#fcd34d"/>
  </g>

  <!-- Atmospheric Glow & Sparkles representing "Dedication / Passion" (奉献) -->
  <g id="sparkles" opacity="0.8">
    <path d="M 85 95 L 87 100 L 92 102 L 87 104 L 85 109 L 83 104 L 78 102 L 83 100 Z" fill="#fbbf24" transform="scale(0.6) translate(60, 40)"/>
    <path d="M 155 75 L 156 78 L 159 79 L 156 80 L 155 83 L 154 80 L 151 79 L 154 78 Z" fill="#38bdf8" transform="scale(0.8) translate(40, -10)"/>
    <path d="M 65 125 L 66 128 L 69 129 L 66 130 L 65 133 L 64 130 L 61 129 L 64 128 Z" fill="#f43f5e" transform="scale(0.7) translate(30, 40)"/>
  </g>
</svg>