<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Window Frame & Glow -->
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows / Soft Shading -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Window showing dark rainy/night city outside (representing life's unpredictable hurdles) -->
  <g transform="translate(145, 25)">
    <rect width="70" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    <!-- Night Sky inside window -->
    <rect x="3" y="3" width="64" height="84" fill="url(#nightSky)" />
    <!-- Window pane crosses -->
    <line x1="35" y1="3" x2="35" y2="87" stroke="#334155" stroke-width="2" />
    <line x1="3" y1="45" x2="67" y2="45" stroke="#334155" stroke-width="2" />
    <!-- Raindrops outside -->
    <line x1="15" y1="15" x2="12" y2="25" stroke="#64748b" stroke-width="1" opacity="0.6" />
    <line x1="45" y1="20" x2="42" y2="30" stroke="#64748b" stroke-width="1" opacity="0.6" />
    <line x1="25" y1="55" x2="22" y2="65" stroke="#64748b" stroke-width="1" opacity="0.6" />
    <line x1="55" y1="60" x2="52" y2="70" stroke="#64748b" stroke-width="1" opacity="0.6" />
    <!-- City silhouette in window distance -->
    <polygon points="5,87 5,70 12,70 12,87" fill="#1e293b" />
    <polygon points="12,87 12,60 22,60 22,87" fill="#1e293b" />
    <polygon points="22,87 22,65 30,65 30,87" fill="#1e293b" />
    <polygon points="38,87 38,55 50,55 50,87" fill="#1e293b" />
    <polygon points="50,87 50,68 62,68 62,87" fill="#1e293b" />
  </g>

  <!-- Bookshelf / Wall Props -->
  <g transform="translate(25, 30)">
    <rect x="0" y="0" width="50" height="8" rx="2" fill="#334155" />
    <!-- Books stacked & tilted (representing stress / chaos of challenges) -->
    <rect x="8" y="-18" width="6" height="18" rx="1" fill="#ec4899" transform="rotate(-10 8 -18)" />
    <rect x="15" y="-19" width="7" height="19" rx="1" fill="#38bdf8" />
    <rect x="23" y="-15" width="5" height="15" rx="1" fill="#10b981" transform="rotate(15 23 -15)" />
    <rect x="30" y="-16" width="6" height="16" rx="1" fill="#fbbf24" />
  </g>

  <!-- Wall Clock showing late hours -->
  <g transform="translate(95, 35)">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="0" cy="0" r="1" fill="#f8fafc" />
    <!-- Clock hands pointing late -->
    <line x1="0" y1="0" x2="4" y2="-5" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-5" y2="-2" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Desk Surface -->
  <rect x="15" y="180" width="210" height="10" fill="#334155" rx="3" />
  <rect x="25" y="190" width="190" height="30" fill="#1e293b" rx="2" />

  <!-- Desk Lamp -->
  <g transform="translate(180, 180)">
    <path d="M-5 0 L5 0 L2 -40 L-2 -40 Z" fill="#64748b" />
    <path d="M-15 -45 C-15 -60 15 -60 15 -45 L20 -40 L-20 -40 Z" fill="#f59e0b" />
    <!-- Light cone covering the desk -->
    <path d="M-12 -40 L-45 0 L45 0 L12 -40 Z" fill="url(#lampGlow)" opacity="0.6" style="mix-blend-mode: screen;" />
  </g>

  <!-- WORKSPACE PROPS (The "Setbacks / Challenges" Theme) -->
  <!-- Laptop showing red error / complex chart (Setback visualization) -->
  <g transform="translate(100, 140)">
    <!-- Laptop Base -->
    <path d="M-25 40 L35 40 L45 45 L-35 45 Z" fill="#64748b" />
    <!-- Laptop Screen -->
    <rect x="-30" y="5" width="60" height="37" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Code/Chart elements on screen (complicated work/obstacle) -->
    <line x1="-24" y1="12" x2="-5" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="-24" y1="18" x2="-10" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Red error graph line plummeting down -->
    <polyline points="-24,32 -10,26 0,34 10,24 24,36" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Warning exclamation mark badge on screen -->
    <circle cx="18" cy="14" r="5" fill="#ef4444" />
    <text x="18" y="17" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">!</text>
  </g>

  <!-- Messy Papers & Crumpled Paper Balls (Frustration/Setbacks) -->
  <g transform="translate(55, 172)">
    <!-- Flat paper sheet -->
    <polygon points="0,0 25,-2 28,15 2,12" fill="#f8fafc" opacity="0.9" />
    <line x1="5" y1="4" x2="20" y2="3" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="5" y1="8" x2="16" y2="7" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Crumpled Paper Ball 1 -->
    <circle cx="-22" cy="5" r="7" fill="#cbd5e1" filter="url(#shadow)" />
    <path d="M-27 3 Q-22 -2 -18 3 T-22 10 Z" fill="#94a3b8" />

    <!-- Crumpled Paper Ball 2 -->
    <circle cx="-12" cy="12" r="6" fill="#cbd5e1" filter="url(#shadow)" />
    <path d="M-15 9 Q-10 7 -8 13 T-15 15 Z" fill="#94a3b8" />
  </g>

  <!-- Coffee Mug with Steam -->
  <g transform="translate(145, 168)">
    <rect x="0" y="0" width="14" height="16" rx="2" fill="#f8fafc" />
    <path d="M14 3 C18 3 18 11 14 11" fill="none" stroke="#f8fafc" stroke-width="2" />
    <!-- Steam wisps -->
    <path d="M4 -3 C6 -6 2 -9 5 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M10 -2 C12 -5 8 -8 11 -11" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- MAIN CHARACTER: Stressed/Overwhelmed yet resilient person experiencing a setback -->
  <g transform="translate(90, 95)" filter="url(#shadow)">
    <!-- Chair Back -->
    <path d="M-10 65 L-10 15 C-10 5 -2 -2 15 -2 C32 -2 40 5 40 15 L40 65" fill="#334155" rx="5" />
    <path d="M-5 25 L35 25" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <path d="M-5 45 L35 45" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Body / Torso (Leaning forward, elbows on desk, head in hands - classic fatigue/setback pose) -->
    <path d="M5 35 Q25 30 35 65 L-5 65 Q-15 45 5 35 Z" fill="#3b82f6" /> <!-- Blue Hoodie -->
    
    <!-- Hoodie Hood behind head -->
    <path d="M-2 12 C-8 12 -12 20 -8 32 C-5 40 5 40 8 35 Z" fill="#2563eb" />

    <!-- Arms resting on desk / hands holding head -->
    <!-- Left Arm -->
    <path d="M-5 40 C-20 45 -35 55 -38 75" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M25 45 C35 50 48 58 45 75" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />

    <!-- Hands clutching head / temples -->
    <circle cx="-38" cy="72" r="5" fill="#fcd34d" />
    <circle cx="43" cy="72" r="5" fill="#fcd34d" />

    <!-- Head & Face (Exhausted, eyes closed in deep thought/frustration over setback) -->
    <g transform="translate(2, 22)">
      <!-- Hair -->
      <path d="M-15 0 C-15 -12 5 -15 15 -10 C22 -7 25 2 22 10 C18 6 12 2 2 2 C-8 2 -12 6 -15 0 Z" fill="#1e293b" />

      <!-- Face Base -->
      <ellipse cx="2" cy="6" rx="13" ry="15" fill="#fcd34d" />

      <!-- Eyebrows (Tilted downward in distress/worry) -->
      <line x1="-5" y1="2" x2="-1" y2="4" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
      <line x1="5" y1="4" x2="9" y2="2" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

      <!-- Closed Eyes (Exhausted/Overwhelmed expression) -->
      <path d="M-6 7 C-4 9 -2 9 0 7" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
      <path d="M4 7 C6 9 8 9 10 7" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

      <!-- Slight frown / pursed lips -->
      <path d="M0 15 C2 14 4 14 5 15" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

      <!-- Sweat drop (classic sign of stress/setback pressure) -->
      <path d="M14 2 C16 5 16 9 14 9 C12 9 12 5 14 2 Z" fill="#38bdf8" opacity="0.8" />
    </g>
  </g>

</svg>