<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow representing the adhesive application area -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Back Sheet of Paper (Tilted) -->
  <g transform="rotate(-12 120 120)">
    <rect x="75" y="60" width="90" height="115" rx="4" fill="#2E384D" />
    <!-- Paper texture lines -->
    <line x1="90" y1="80" x2="150" y2="80" stroke="#3E4C66" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="98" x2="140" y2="98" stroke="#3E4C66" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="116" x2="130" y2="116" stroke="#3E4C66" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Glowing Adhesive / Glue Layer in between -->
  <path d="M 85,95 Q 120,115 155,95 Q 165,130 145,155 Q 110,165 95,145 Z" fill="#F59E0B" opacity="0.25" filter="blur(4px)"/>
  
  <!-- Adhesive application streak -->
  <path d="M 90,105 Q 120,130 140,110" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Front Sheet of Paper (Overlapping, stuck together) -->
  <g transform="rotate(8 120 120)">
    <rect x="70" y="70" width="90" height="115" rx="4" fill="#E2E8F0" />
    <!-- Paper content lines -->
    <line x1="88" y1="92" x2="142" y2="92" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="110" x2="135" y2="110" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="128" x2="125" y2="128" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- High-contrast Accent: Glue Brush / Applicator Tool -->
  <g transform="translate(135, 45) rotate(45)">
    <!-- Brush Handle -->
    <rect x="-4" y="-35" width="8" height="40" rx="3" fill="#F59E0B"/>
    <!-- Ferrule -->
    <rect x="-5" y="5" width="10" height="8" rx="1" fill="#64748B"/>
    <!-- Brush Bristles with adhesive drop -->
    <path d="M-5,13 L5,13 L3,22 C3,22 0,25 -3,22 Z" fill="#E2E8F0"/>
    <circle cx="0" cy="25" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Dynamic connecting bond indicators (showing the physical sticking action) -->
  <path d="M 72,110 C 65,115 65,125 72,130" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 162,100 C 169,105 169,115 162,120" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

</svg>