<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mirrorGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Interior Room Context -->
  <!-- Floor -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16"/>
  
  <!-- Background Wall Decor & Wardrobe -->
  <rect x="25" y="30" width="70" height="150" rx="6" fill="#334155" opacity="0.4"/>
  <line x1="60" y1="30" x2="60" y2="180" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Hanging clothes rack in background -->
  <path d="M160 50 L210 50" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 50 L175 75" stroke="#64748b" stroke-width="2"/>
  <path d="M200 50 L195 75" stroke="#64748b" stroke-width="2"/>
  <path d="M165 75 Q185 85 205 75" fill="#f43f5e" opacity="0.6"/>
  <path d="M172 75 Q185 83 198 75" fill="#0ea5e9" opacity="0.6"/>

  <!-- Large Vanity Mirror in Center-Left -->
  <!-- Mirror Stand -->
  <ellipse cx="90" cy="195" rx="25" ry="6" fill="#0f172a" opacity="0.8"/>
  <path d="M90 189 L90 55" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Mirror Oval Frame -->
  <ellipse cx="90" cy="115" rx="36" ry="65" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <ellipse cx="90" cy="115" rx="32" ry="60" fill="url(#mirrorGlow)"/>
  <path d="M70 95 Q90 85 105 100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Character (Standing in front of mirror, holding/checking clothes matching) -->
  <!-- Character Body / Torso -->
  <path d="M145 125 C145 110 165 110 165 125 L170 180 C170 185 165 190 160 190 L150 190 C145 190 140 185 140 180 Z" fill="#38bdf8"/>
  
  <!-- Character Head & Hair -->
  <circle cx="155" cy="88" rx="16" ry="17" fill="#fed7aa"/>
  <!-- Stylish hair -->
  <path d="M138 88 C138 72 172 72 172 88 C172 82 165 70 155 70 C145 70 138 82 138 88 Z" fill="#334155"/>
  <path d="M140 85 Q145 92 152 87" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Arms holding the matching garments -->
  <!-- Left arm -->
  <path d="M143 125 Q130 140 135 155" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M167 125 Q185 135 175 155" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- The Outfit Elements Being Paused/Matched (Jacket and Pants) -->
  <!-- Jacket (Held up) -->
  <path d="M125 140 L145 135 L155 135 L175 140 L170 170 L160 170 L160 155 L140 155 L140 170 L130 170 Z" fill="#fbbf24" filter="url(#glow)"/>
  <!-- Pants (Held alongside) -->
  <path d="M145 155 L165 155 L168 188 L158 188 L156 168 L154 168 L152 188 L142 188 Z" fill="#10b981" filter="url(#glow)"/>

  <!-- Sparkles / Match Indicator (Visualizing "harmonious/matching" concept) -->
  <g transform="translate(115, 95)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#f59e0b"/>
  </g>
  <g transform="translate(195, 120) scale(0.7)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(180, 75) scale(0.8)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#ec4899"/>
  </g>

  <!-- Floor Light Reflection & Details -->
  <ellipse cx="155" cy="192" rx="20" ry="4" fill="#000000" opacity="0.4"/>
  
  <!-- Cute little stool or prop -->
  <circle cx="210" cy="175" r="14" fill="#475569"/>
  <circle cx="210" cy="175" r="10" fill="#64748b"/>
</svg>