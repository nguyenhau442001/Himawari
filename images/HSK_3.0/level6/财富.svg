<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Left side: Wealth (Gold/Coins/Chest) -->
  <g transform="translate(40, 140)">
    <path d="M0 60 L60 60 L55 20 L5 20 Z" fill="#f59e0b"/>
    <path d="M5 20 L55 20 L60 0 L0 0 Z" fill="#fbbf24"/>
    <circle cx="30" cy="10" r="6" fill="#fef3c7"/>
    <rect x="25" y="30" width="10" height="20" fill="#d97706"/>
  </g>

  <!-- Right side: Health (Person jogging/active) -->
  <g transform="translate(140, 100)">
    <circle cx="30" cy="30" r="25" fill="#38bdf8"/>
    <path d="M20 50 L25 80 L35 80 L30 50 Z" fill="#38bdf8"/>
    <path d="M15 40 L45 40" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="20" r="10" fill="#fef3c7"/>
  </g>

  <!-- Comparison Scale/Balance -->
  <path d="M30 130 L210 130" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 130 L120 180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Emphasis on Health (Higher) -->
  <path d="M180 130 L180 90" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="180" cy="90" r="8" fill="#10b981"/>
  
  <!-- Emphasis on Wealth (Lower) -->
  <path d="M60 130 L60 150" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="60" cy="150" r="8" fill="#fb923c"/>

  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#ec4899"/>
  <circle cx="40" cy="50" r="2" fill="#38bdf8"/>
</svg>