<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambient background for the pediatric clinic scene -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Medical Cross / Clinic Symbol subtly integrated in background -->
  <g transform="translate(120, 105)" opacity="0.15">
    <rect x="-16" y="-48" width="32" height="96" rx="6" fill="#00E5FF"/>
    <rect x="-48" y="-16" width="96" height="32" rx="6" fill="#00E5FF"/>
  </g>

  <!-- Hospital / Clinic Wall Element & Window Frame -->
  <path d="M 40 180 L 200 180" stroke="#2F3643" stroke-width="4" stroke-linecap="round"/>

  <!-- Pediatrician Character (Caring, professional, smiling) -->
  <g id="pediatrician">
    <!-- Doctor Body / White Coat -->
    <path d="M 75 180 L 75 145 C 75 130 90 120 105 120 L 135 120 C 150 120 165 130 165 145 L 165 180 Z" fill="#E2E8F0"/>
    <!-- Stethoscope -->
    <path d="M 105 120 C 105 135 135 135 135 120" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="142" r="5" fill="#00E5FF"/>
    
    <!-- Doctor Head & Face -->
    <circle cx="120" cy="95" r="22" fill="#FCE7C8"/>
    <!-- Friendly Hair -->
    <path d="M 98 95 C 98 80 105 72 120 72 C 135 72 142 80 142 90 L 142 96 C 130 93 110 93 98 96 Z" fill="#475569"/>
    <!-- Gentle Eyes & Smile -->
    <circle cx="112" cy="95" r="2" fill="#1E293B"/>
    <circle cx="128" cy="95" r="2" fill="#1E293B"/>
    <path d="M 116 103 Q 120 107 124 103" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Happy Baby / Child Patient Character (Representing Pediatrics) -->
  <g id="baby-patient">
    <!-- Baby Body -->
    <circle cx="120" cy="155" r="18" fill="#FFB703"/>
    
    <!-- Baby Head -->
    <circle cx="120" cy="132" r="16" fill="#FCE7C8"/>
    
    <!-- Cute Cap / Beanie (Pediatric motif) -->
    <path d="M 104 130 C 104 116 136 116 136 130 Z" fill="#FF5722"/>
    <circle cx="120" cy="113" r="4" fill="#FFFFFF"/>

    <!-- Happy Eyes & Smile -->
    <path d="M 113 133 Q 115 131 117 133" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 123 133 Q 125 131 127 133" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="120" cy="137" r="1.5" fill="#FF5722" opacity="0.6"/>

    <!-- Small Toy / Rattle held by baby (Pediatric contextual detail) -->
    <circle cx="102" cy="152" r="6" fill="#00E5FF"/>
    <line x1="98" y1="156" x2="94" y2="160" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Warm, Focus Lighting Element (Gold/Orange accent representing specialized care) -->
  <circle cx="120" cy="120" r="65" fill="none" stroke="#FFB703" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
</svg>