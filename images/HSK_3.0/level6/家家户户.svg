<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Starry / Festive Night Sky Background -->
  <g fill="#2D3342" opacity="0.6">
    <circle cx="35" cy="45" r="1.5" />
    <circle cx="205" cy="35" r="1.5" />
    <circle cx="120" cy="25" r="1" />
    <circle cx="25" cy="95" r="1" />
    <circle cx="215" cy="105" r="2" />
  </g>

  <!-- Row of Modern/Traditional Houses representing "家家户户" (Every household / Muôn nhà) -->
  <!-- House 1 (Left) -->
  <g transform="translate(18, 105)">
    <!-- Roof -->
    <polygon points="26,10 4,35 48,35" fill="#3B4252"/>
    <polygon points="26,12 8,35 44,35" fill="#4C566A"/>
    <!-- Body -->
    <rect x="10" y="35" width="32" height="60" fill="#2E3440"/>
    <!-- Warm Glowing Windows -->
    <rect x="16" y="45" width="8" height="12" rx="1" fill="#FFB86C"/>
    <line x1="20" y1="45" x2="20" y2="57" stroke="#2E3440" stroke-width="1.5"/>
    <line x1="16" y1="51" x2="24" y2="51" stroke="#2E3440" stroke-width="1.5"/>
    
    <rect x="28" y="45" width="8" height="12" rx="1" fill="#FFB86C"/>
    <line x1="32" y1="45" x2="32" y2="57" stroke="#2E3440" stroke-width="1.5"/>
    <line x1="28" y1="51" x2="36" y2="51" stroke="#2E3440" stroke-width="1.5"/>
    <!-- Door -->
    <rect x="19" y="73" width="14" height="22" rx="1" fill="#4C566A"/>
    <circle cx="30" cy="85" r="1" fill="#FFB86C"/>
  </g>

  <!-- House 2 (Center-Left) -->
  <g transform="translate(70, 90)">
    <!-- Roof -->
    <polygon points="30,5 6,30 54,30" fill="#4C566A"/>
    <polygon points="30,7 10,30 50,30" fill="#5E6779"/>
    <!-- Body -->
    <rect x="12" y="30" width="36" height="75" fill="#2E3440"/>
    <!-- Warm Glowing Windows -->
    <rect x="18" y="42" width="9" height="14" rx="1" fill="#FFB86C"/>
    <line x1="22.5" y1="42" x2="22.5" y2="56" stroke="#2E3440" stroke-width="1.5"/>
    <line x1="18" y1="49" x2="27" y2="49" stroke="#2E3440" stroke-width="1.5"/>

    <rect x="33" y="42" width="9" height="14" rx="1" fill="#FFB86C"/>
    <line x1="37.5" y1="42" x2="37.5" y2="56" stroke="#2E3440" stroke-width="1.5"/>
    <line x1="33" y1="49" x2="42" y2="49" stroke="#2E3440" stroke-width="1.5"/>

    <!-- Balcony / Mid Window -->
    <rect x="18" y="66" width="24" height="15" rx="1" fill="#FFB86C"/>
    <line x1="30" y1="66" x2="30" y2="81" stroke="#2E3440" stroke-width="1.5"/>
    <line x1="18" y1="73.5" x2="42" y2="73.5" stroke="#2E3440" stroke-width="1.5"/>

    <!-- Door -->
    <rect x="23" y="90" width="14" height="15" rx="1" fill="#4C566A"/>
  </g>

  <!-- House 3 (Center-Right - Tallest) -->
  <g transform="translate(122, 70)">
    <!-- Roof -->
    <polygon points="28,2 4,28 52,28" fill="#3B4252"/>
    <!-- Body -->
    <rect x="10" y="28" width="36" height="95" fill="#242933"/>
    <!-- Warm Glowing Windows Stack -->
    <rect x="16" y="38" width="8" height="12" rx="1" fill="#FFB86C"/>
    <rect x="28" y="38" width="8" height="12" rx="1" fill="#FFB86C"/>

    <rect x="16" y="58" width="8" height="12" rx="1" fill="#FFB86C"/>
    <rect x="28" y="58" width="8" height="12" rx="1" fill="#FFB86C"/>

    <rect x="16" y="78" width="8" height="12" rx="1" fill="#FFB86C"/>
    <rect x="28" y="78" width="8" height="12" rx="1" fill="#FFB86C"/>

    <!-- Door -->
    <rect x="19" y="103" width="14" height="20" rx="1" fill="#4C566A"/>
  </g>

  <!-- House 4 (Right) -->
  <g transform="translate(174, 100)">
    <!-- Roof -->
    <polygon points="25,8 2,32 48,32" fill="#4C566A"/>
    <!-- Body -->
    <rect x="8" y="32" width="34" height="68" fill="#2E3440"/>
    <!-- Warm Glowing Windows -->
    <rect x="14" y="44" width="10" height="14" rx="1" fill="#FFB86C"/>
    <line x1="19" y1="44" x2="19" y2="58" stroke="#2E3440" stroke-width="1.5"/>
    <line x1="14" y1="51" x2="24" y2="51" stroke="#2E3440" stroke-width="1.5"/>

    <!-- Door -->
    <rect x="18" y="76" width="14" height="24" rx="1" fill="#4C566A"/>
    <circle cx="28" cy="89" r="1" fill="#FFB86C"/>
  </g>

  <!-- Festive Glowing Atmosphere / Lanterns & Warm Lights overlay -->
  <g opacity="0.9">
    <!-- Lantern 1 -->
    <line x1="45" y1="105" x2="45" y2="120" stroke="#D08770" stroke-width="1.5"/>
    <circle cx="45" cy="126" r="6" fill="#FF5555"/>
    <path d="M 42 120 L 48 120 L 50 132 L 40 132 Z" fill="#FF5555"/>
    <line x1="45" y1="132" x2="45" y2="137" stroke="#D08770" stroke-width="1.5"/>

    <!-- Lantern 2 -->
    <line x1="110" y1="85" x2="110" y2="100" stroke="#D08770" stroke-width="1.5"/>
    <circle cx="110" cy="106" r="7" fill="#FF5555"/>
    <path d="M 106 100 L 114 100 L 116 114 L 104 114 Z" fill="#FF5555"/>
    <line x1="110" y1="114" x2="110" y2="120" stroke="#D08770" stroke-width="1.5"/>

    <!-- Lantern 3 -->
    <line x1="195" y1="95" x2="195" y2="110" stroke="#D08770" stroke-width="1.5"/>
    <circle cx="195" cy="116" r="6" fill="#FF5555"/>
    <path d="M 192 110 L 198 110 L 200 122 L 190 122 Z" fill="#FF5555"/>
    <line x1="195" y1="122" x2="195" y2="127" stroke="#D08770" stroke-width="1.5"/>
  </g>

  <!-- Ground / Horizon Base -->
  <rect x="0" y="200" width="240" height="40" fill="#14161B"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#FFB86C" stroke-width="2" opacity="0.4"/>

  <!-- Glowing warm horizon gradients simulating lights spilling from multiple households -->
  <ellipse cx="120" cy="200" rx="100" ry="15" fill="#FFB86C" opacity="0.15"/>
</svg>