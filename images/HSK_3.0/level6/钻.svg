<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration: A physical drill (钻 - tool/object representing the action of drilling/boring into depth) -->
  <g transform="translate(120, 120)">
    <!-- Glow/Focus effect behind the drill bit -->
    <circle cx="0" cy="15" r="45" fill="#F59E0B" opacity="0.15"/>

    <!-- Spark particles indicating action -->
    <circle cx="-35" cy="45" r="2.5" fill="#FBBF24"/>
    <circle cx="38" cy="50" r="2" fill="#FBBF24"/>
    <circle cx="-25" cy="65" r="1.5" fill="#FBBF24"/>
    <circle cx="28" cy="70" r="2" fill="#F59E0B"/>
    <path d="M-45 35 L-35 40" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <path d="M45 40 L35 45" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>

    <!-- Drill Body / Handle (Modern Power Drill) -->
    <!-- Main Motor Housing -->
    <path d="M-22 -55 C-22 -65 -12 -72 0 -72 C12 -72 22 -65 22 -55 L22 -15 C22 -5 15 5 0 5 C-15 5 -22 -5 -22 -15 Z" fill="#3B82F6"/>
    <path d="M12 -55 L12 -15 C12 -1 8 2 0 2 C-8 2 -12 -1 -12 -15 L-12 -55 Z" fill="#60A5FA"/>

    <!-- Upper housing accent -->
    <path d="M-20 -40 L20 -40 L20 -30 L-20 -30 Z" fill="#1D4ED8"/>

    <!-- Handle (Grip) -->
    <path d="M-15 5 C-15 5 -18 35 -25 50 C-30 60 -25 68 -15 65 C-5 62 0 45 5 30 L10 5 Z" fill="#1F2937"/>
    <path d="M-13 15 C-13 15 -16 38 -21 48 C-25 55 -21 58 -15 57 C-10 55 -6 40 -2 25 Z" fill="#374151"/>

    <!-- Trigger -->
    <path d="M-12 10 L-5 13 L-12 18 Z" fill="#F59E0B"/>

    <!-- Battery Pack / Base -->
    <path d="M-30 62 C-30 58 -25 55 -15 55 L5 55 C15 55 20 58 20 62 L18 78 C18 82 12 85 0 85 C-12 85 -18 82 -18 78 Z" fill="#1F2937"/>
    <rect x="-12" y="65" width="24" height="6" rx="2" fill="#F59E0B"/>

    <!-- Chuck (Metal collar holding the bit) -->
    <rect x="-10" y="5" width="20" height="15" rx="3" fill="#9CA3AF"/>
    <rect x="-8" y="8" width="16" height="9" rx="1" fill="#4B5563"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Drill Bit (Helical Flute - representing "zuân" / drilling deep) -->
    <!-- Bit shaft -->
    <polygon points="-5,20 5,20 3,85 -3,85" fill="#D1D5DB"/>
    
    <!-- Flutes / Spirals on the bit -->
    <path d="M-3 25 Q3 32 -3 39 Q3 46 -3 53 Q3 60 -3 67 Q3 74 -3 81" stroke="#9CA3AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0 22 Q5 29 0 36 Q5 43 0 50 Q5 57 0 64 Q5 71 0 78" stroke="#E5E7EB" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Sharp Tip -->
    <polygon points="-3,85 0,98 3,85" fill="#9CA3AF"/>
  </g>
</svg>