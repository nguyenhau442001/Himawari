<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#121b2f" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Cloud Glow Gradient -->
    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Data Stream Glow -->
    <linearGradient id="dataBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9" />
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Room Details (Desk, Wall) -->
  <!-- Wall / Window frame background ambient light -->
  <path d="M120,10 L230,10 L230,160 L120,160 Z" fill="#1b253b" opacity="0.3" />
  <path d="M20,165 L220,165 L220,168 L20,168 Z" fill="#0f172a" />
  
  <!-- Desk Surface -->
  <path d="M10,168 L230,168 L240,210 L0,210 Z" fill="#334155" />
  <path d="M10,168 L230,168 L235,174 L5,174 Z" fill="#475569" />
  
  <!-- Desk Edge Highlight -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" />

  <!-- CLOUD IN THE SKY / CLOUD STORAGE (Center Top) -->
  <g transform="translate(120, 52)">
    <!-- Cloud Glow Base -->
    <circle cx="0" cy="-10" r="45" fill="url(#cloudGlow)" />
    
    <!-- Cloud Shape -->
    <path d="M -25,5 
             C -38,5 -45,-5 -40,-18 
             C -45,-30 -30,-40 -15,-38 
             C -5,-48 15,-45 22,-32 
             C 38,-35 48,-20 42,-5 
             C 48,5 38,15 22,15 
             Z" 
          fill="#f8fafc" filter="url(#softShadow)" />
          
    <!-- Cloud Inner Shading / Detail -->
    <path d="M -15,8 
             C -28,8 -32,0 -28,-10 
             C -32,-20 -20,-28 -8,-26 
             C -2,-34 10,-32 15,-22 
             C 26,-25 34,-15 30,-5 
             C 34,2 26,8 15,8 
             Z" 
          fill="#e2e8f0" opacity="0.6" />

    <!-- Data Circuit Lines inside Cloud -->
    <path d="M-10,-10 L0,-5 L10,-15" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <circle cx="-10" cy="-10" r="2" fill="#38bdf8"/>
    <circle cx="0" cy="-5" r="2" fill="#38bdf8"/>
    <circle cx="10" cy="-15" r="2" fill="#38bdf8"/>
    <circle cx="0" cy="-18" r="3" fill="#fbbf24" filter="url(#softShadow)" />
  </g>

  <!-- DATA UPLOADING BEAMS (Connecting Laptop to Cloud) -->
  <g opacity="0.8">
    <path d="M105,115 L112,65" stroke="url(#dataBeam)" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" />
    <path d="M120,110 L120,60" stroke="url(#dataBeam)" stroke-width="4" stroke-linecap="round" />
    <path d="M135,115 L128,65" stroke="url(#dataBeam)" stroke-width="3" stroke-dasharray="6 3" stroke-linecap="round" />
    
    <!-- Floating Data Packets / Binary Dots ascending -->
    <circle cx="115" cy="90" r="2" fill="#38bdf8" />
    <circle cx="125" cy="75" r="3" fill="#e0f2fe" />
    <circle cx="110" cy="55" r="2.5" fill="#38bdf8" />
  </g>

  <!-- LAPTOP (Center Foreground) -->
  <g transform="translate(95, 115)">
    <!-- Laptop Base / Keyboard deck -->
    <path d="M-15,35 L45,35 L55,48 L-25,48 Z" fill="#64748b" filter="url(#softShadow)" />
    <path d="M-22,46 L52,46 L50,47 L-20,47 Z" fill="#94a3b8" />
    
    <!-- Laptop Screen Back -->
    <rect x="-17" y="-2" width="60" height="38" rx="4" fill="#334155" />
    <!-- Laptop Screen (Glowing Display) -->
    <rect x="-13" y="2" width="52" height="30" rx="2" fill="#0f172a" />
    
    <!-- UI elements on screen: Folder sending data -->
    <rect x="-5" y="10" width="12" height="9" rx="1" fill="#fbbf24" />
    <path d="M-3,10 L-3,8 L1,8 L3,10 Z" fill="#f59e0b" />
    
    <!-- Arrow pointing up from folder -->
    <path d="M1,20 L1,15 M-1,17 L1,14 L3,17" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Screen Ambient Glow -->
    <circle cx="13" cy="17" r="20" fill="url(#screenGlow)" style="mix-blend-mode: screen;" />
  </g>

  <!-- COFFEE MUG (Right Context Prop) -->
  <g transform="translate(170, 160)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#f1f5f9" filter="url(#softShadow)" />
    <!-- Mug Handle -->
    <path d="M16,4 C22,4 22,14 16,16" fill="none" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" />
    <!-- Coffee liquid -->
    <ellipse cx="8" cy="3" rx="7" ry="2" fill="#78350f" />
    <!-- Steam -->
    <path d="M5,-3 C5,-7 8,-6 8,-10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- POTTED DESK PLANT (Left Context Prop) -->
  <g transform="translate(30, 155)">
    <!-- Pot -->
    <path d="M4,13 L16,13 L19,25 L1,25 Z" fill="#e2e8f0" filter="url(#softShadow)" />
    <!-- Soil -->
    <ellipse cx="10" cy="13" rx="6" ry="2" fill="#475569" />
    <!-- Leaves -->
    <path d="M10,13 C10,5 0,0 2,-8 C8,-2 10,13 10,13 Z" fill="#10b981" />
    <path d="M10,13 C12,3 22,-2 20,-10 C15,-4 10,13 10,13 Z" fill="#059669" />
    <path d="M10,13 C8,2 14,-5 10,-14 C7,-5 10,13 10,13 Z" fill="#34d399" />
  </g>

  <!-- CHARACTER: Eager/Focused Professional (Left side, interacting) -->
  <g transform="translate(55, 105)">
    <!-- Body / Torso (leaning forward) -->
    <path d="M25,25 C25,15 35,5 45,5 C55,5 65,15 65,25 L60,65 L20,65 Z" fill="url(#sweaterGrad)" filter="url(#softShadow)" />
    
    <!-- Collar -->
    <path d="M38,5 C42,10 48,10 52,5 C48,8 42,8 38,5 Z" fill="#e0e7ff" />

    <!-- Head & Hair -->
    <g transform="translate(42, -10)">
      <!-- Hair Back/Base -->
      <circle cx="0" cy="0" r="16" fill="#1e1b4b" />
      
      <!-- Face Skin -->
      <circle cx="4" cy="4" r="14" fill="#fcd34d" />
      
      <!-- Hair Top Styling / Bangs -->
      <path d="M-10,-4 C-5,-14 10,-12 16,-2 C16,-2 12,-16 -2,-14 C-10,-12 -12,-8 -10,-4 Z" fill="#1e1b4b" />
      
      <!-- Facial Expression (Happy/Engaged) -->
      <!-- Eye -->
      <circle cx="8" cy="3" r="1.5" fill="#1e1b4b" />
      <!-- Smile / Cheeks -->
      <path d="M7,8 C9,10 12,10 14,8" fill="none" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="13" cy="6" r="2" fill="#f87171" opacity="0.4" />
    </g>

    <!-- Arms & Hands -->
    <!-- Right Arm reaching to type/interact with laptop -->
    <path d="M55,30 C65,35 70,45 75,50" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="76" cy="52" r="3.5" fill="#fcd34d" />

    <!-- Left Arm resting -->
    <path d="M30,30 C20,35 15,45 15,55" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <circle cx="15" cy="57" r="3.5" fill="#fcd34d" />
  </g>

  <!-- FOREGROUND ACCENTS & VIBRANT PARTICLES -->
  <g opacity="0.7">
    <circle cx="80" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="160" cy="190" r="2" fill="#fbbf24" />
    <circle cx="150" cy="45" r="1.5" fill="#38bdf8" />
    <circle cx="90" cy="35" r="2" fill="#10b981" />
  </g>

</svg>