<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background: Distant city silhouette -->
  <path d="M20 180 L80 180 L80 140 L100 130 L120 150 L140 140 L160 160 L220 160 L220 240 L20 240 Z" fill="#2D343E"/>
  
  <!-- Foreground: The Suburbs (郊外) -->
  <!-- Green Rolling Hills -->
  <path d="M0 240 C 40 180, 100 170, 150 200 C 200 230, 240 220, 240 240 Z" fill="#2E7D32"/>
  <path d="M0 240 C 60 200, 120 190, 240 240 Z" fill="#388E3C"/>
  
  <!-- Tree representing nature -->
  <circle cx="180" cy="120" r="35" fill="#4CAF50"/>
  <rect x="175" y="140" width="10" height="40" fill="#5D4037"/>
  
  <!-- Family silhouettes (representing the context) -->
  <g transform="translate(60, 160)">
    <!-- Adult -->
    <circle cx="20" cy="20" r="8" fill="#FFB300"/>
    <path d="M20 28 L20 55 M20 35 L10 45 M20 35 L30 45 M20 55 L15 75 M20 55 L25 75" stroke="#FFB300" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Child -->
    <circle cx="50" cy="35" r="6" fill="#FFB300"/>
    <path d="M50 41 L50 60 M50 48 L42 58 M50 48 L58 58 M50 60 L46 75 M50 60 L54 75" stroke="#FFB300" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Sun/Light accent -->
  <circle cx="200" cy="40" r="20" fill="#FFB300" opacity="0.8"/>
</svg>