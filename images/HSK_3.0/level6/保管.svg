<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Counter/Desk -->
  <rect x="20" y="140" width="200" height="100" rx="8" fill="#334155"/>
  <rect x="30" y="150" width="180" height="10" fill="#475569"/>
  
  <!-- The Box -->
  <g transform="translate(130, 160)">
    <rect x="0" y="0" width="60" height="50" rx="4" fill="#fb923c"/>
    <rect x="5" y="5" width="50" height="40" rx="2" fill="#f59e0b"/>
    <path d="M0 15 L60 15 M30 0 L30 50" stroke="#92400e" stroke-width="2"/>
  </g>
  
  <!-- Character 1: The requester -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 25 Q20 35 30 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="5" y="45" width="30" height="80" rx="5" fill="#38bdf8"/>
    <path d="M5 50 L-10 80 M35 50 L50 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: The keeper -->
  <g transform="translate(160, 80)">
    <circle cx="20" cy="20" r="20" fill="#10b981"/>
    <path d="M10 25 Q20 30 30 25" stroke="#064e3b" stroke-width="2" fill="none"/>
    <rect x="5" y="45" width="30" height="80" rx="5" fill="#ec4899"/>
    <path d="M35 60 L50 40" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Interaction indicator -->
  <path d="M90 120 L130 120" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="110" cy="120" r="4" fill="#fbbf24"/>
</svg>