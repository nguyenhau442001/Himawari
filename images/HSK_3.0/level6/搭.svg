<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with dark mode gradient -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="tentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="tentYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="campfireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Sky & Stars -->
    <rect width="240" height="240" fill="url(#nightSky)" />
    
    <!-- Stars -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="30" cy="35" r="1" />
      <circle cx="65" cy="20" r="1.5" opacity="0.5" />
      <circle cx="95" cy="45" r="1" />
      <circle cx="130" cy="25" r="2" opacity="0.9" />
      <circle cx="165" cy="50" r="1" />
      <circle cx="205" cy="30" r="1.5" />
      <circle cx="220" cy="70" r="1" opacity="0.6" />
      <circle cx="45" cy="75" r="1.2" />
      <circle cx="180" cy="85" r="1.5" opacity="0.4" />
    </g>

    <!-- Moon -->
    <circle cx="195" cy="45" r="14" fill="#fef08a" opacity="0.9" />
    <circle cx="190" cy="41" r="12" fill="#090d16" />

    <!-- Distant Pine Trees / Mountains -->
    <path d="M0 145 L20 115 L40 145 L65 110 L95 145 L130 100 L165 145 L195 118 L240 145 Z" fill="#0f172a" />
    <path d="M0 155 L35 125 L75 155 L120 115 L170 155 L210 130 L240 155 Z" fill="#132238" />

    <!-- Ground / Campsite Floor -->
    <path d="M0 150 Q120 140 240 150 L240 240 L0 240 Z" fill="url(#groundGrad)" />
    
    <!-- Campfire Ambient Glow -->
    <circle cx="120" cy="180" r="50" fill="url(#campfireGlow)" />

    <!-- Background Environment Props (Trees, Backpacks) -->
    <!-- Backpack -->
    <g transform="translate(35, 155)">
      <rect x="0" y="5" width="16" height="20" rx="4" fill="#3b82f6" />
      <path d="M3 5 Q8 -2 13 5" fill="none" stroke="#1d4ed8" stroke-width="2" />
      <rect x="2" y="10" width="12" height="8" rx="2" fill="#2563eb" />
      <circle cx="8" cy="14" r="2" fill="#93c5fd" />
    </g>
    <!-- Pine Tree Foreground Left -->
    <path d="M15 155 L5 175 L25 175 L12 195 L28 195 L18 215 L35 215 L22 235 L38 235 L0 235 L0 155 Z" fill="#042f2e" opacity="0.7" />

    <!-- THE TENT BEING BUILT (搭帐篷) -->
    <!-- Tent Poles & Structure in progress -->
    <!-- Left Pole -->
    <line x1="85" y1="130" x2="70" y2="190" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Right Pole -->
    <line x1="155" y1="130" x2="170" y2="190" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Ridge Pole -->
    <line x1="85" y1="130" x2="155" y2="130" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Tent Back Wall -->
    <polygon points="85,130 155,130 170,190 70,190" fill="#c2410c" opacity="0.6" />

    <!-- Tent Flaps/Fabric being pulled and secured -->
    <!-- Left Flap (Orange) -->
    <path d="M120 115 L70 190 L120 200 Z" fill="url(#tentOrange)" />
    <!-- Right Flap (Yellow/Gold) -->
    <path d="M120 115 L170 190 L120 200 Z" fill="url(#tentYellow)" />
    
    <!-- Tent Open Entrance Cutout -->
    <path d="M120 145 L100 200 L140 200 Z" fill="#062e2c" />
    <!-- Tent Peg Guy Lines -->
    <line x1="70" y1="190" x2="50" y2="210" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="170" y1="190" x2="190" y2="210" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2 2" />
    <!-- Stakes -->
    <rect x="48" y="208" width="4" height="6" fill="#cbd5e1" />
    <rect x="188" y="208" width="4" height="6" fill="#cbd5e1" />

    <!-- CHARACTER 1 (Left): Pulling/Securing the Tent Fabric -->
    <g transform="translate(45, 140)">
      <!-- Body/Torso (Hoodie) -->
      <path d="M15 25 Q25 20 32 35 L28 55 Q20 58 10 50 Z" fill="#ec4899" />
      <!-- Head & Hair -->
      <circle cx="22" cy="14" r="9" fill="#fcd34d" />
      <path d="M13 12 Q20 3 31 10 Q28 17 25 17 Z" fill="#854d0e" /> <!-- Hair -->
      <!-- Face profile -->
      <circle cx="26" cy="14" r="1.5" fill="#451a03" />
      <!-- Left Arm stretching to tent -->
      <path d="M18 28 L35 38 L45 35" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Hand holding rope -->
      <circle cx="46" cy="35" r="2.5" fill="#fcd34d" />
      <!-- Right Arm pushing/bracing -->
      <path d="M28 32 L15 42 L8 40" fill="none" stroke="#db2777" stroke-width="5" stroke-linecap="round" />
      <!-- Legs kneeling -->
      <path d="M15 52 L5 65 L0 67" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />
      <path d="M25 54 L20 68 L15 70" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- CHARACTER 2 (Right): Raising/Fixing the Central Pole -->
    <g transform="translate(145, 120)">
      <!-- Body/Torso -->
      <path d="M20 25 Q12 22 5 35 L12 55 Q20 58 28 50 Z" fill="#38bdf8" />
      <!-- Head & Cap -->
      <circle cx="14" cy="13" r="9" fill="#fcd34d" />
      <path d="M5 11 Q15 2 23 10 Z" fill="#0284c7" />
      <path d="M19 9 L25 11" stroke="#0284c7" stroke-width="2" stroke-linecap="round" /> <!-- Cap brim -->
      <!-- Face -->
      <circle cx="10" cy="13" r="1.5" fill="#451a03" />
      <!-- Arms pushing upward towards tent pole -->
      <path d="M18 28 L2 18 L-5 12" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-6" cy="11" r="2.5" fill="#fcd34d" />
      <!-- Legs in action stance -->
      <path d="M12 54 L22 68 L30 72" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />
      <path d="M22 52 L10 65 L2 68" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- CAMPFIRE (Foreground Element for cozy real-world atmosphere) -->
    <g transform="translate(120, 195)">
      <!-- Logs -->
      <rect x="-12" y="5" width="24" height="6" rx="3" fill="#78350f" transform="rotate(-15)" />
      <rect x="-12" y="3" width="24" height="6" rx="3" fill="#92400e" transform="rotate(20)" />
      <!-- Stones ring -->
      <circle cx="-16" cy="8" r="3" fill="#64748b" />
      <circle cx="-10" cy="11" r="3.5" fill="#475569" />
      <circle cx="12" cy="9" r="3" fill="#64748b" />
      <circle cx="6" cy="12" r="3.5" fill="#94a3b8" />
      <circle cx="0" cy="13" r="3" fill="#475569" />
      <!-- Flames -->
      <path d="M0 5 Q -6 -5 0 -14 Q 6 -5 0 5 Z" fill="#ef4444" />
      <path d="M0 2 Q -4 -3 0 -10 Q 4 -3 0 2 Z" fill="#f97316" />
      <path d="M0 0 Q -2 -2 0 -6 Q 2 -2 0 0 Z" fill="#fbbf24" />
      <!-- Sparks -->
      <circle cx="-4" cy="-18" r="1" fill="#fef08a" />
      <circle cx="5" cy="-22" r="1.5" fill="#fef08a" />
      <circle cx="-2" cy="-28" r="1" fill="#f97316" />
    </g>

    <!-- Additional Real-world Props: Tool box & Mallet on ground -->
    <g transform="translate(175, 185)">
      <!-- Toolkit Box -->
      <rect x="0" y="10" width="18" height="12" rx="2" fill="#ef4444" />
      <rect x="2" y="7" width="14" height="4" rx="1" fill="#b91c1c" />
      <path d="M6 7 L6 5 L12 5 L12 7" fill="none" stroke="#f87171" stroke-width="2" />
      <!-- Tent Mallet -->
      <rect x="22" y="14" width="10" height="4" rx="1" fill="#475569" />
      <rect x="18" y="15" width="12" height="2" fill="#334155" />
    </g>

    <!-- Soft Vignette / Lighting Overlay -->
    <circle cx="120" cy="120" r="130" fill="none" stroke="#000000" stroke-width="16" opacity="0.3" />
  </g>
</svg>