<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Grid / Contrast layout for Adjective/Descriptive quality (Quality/Source vs Mass Distribution) -->
  <!-- Subtle background glow/field -->
  <circle cx="120" cy="120" r="90" fill="#252A34" opacity="0.6"/>

  <!-- Left/Natural Side: Raw Agricultural Origin (Scale exaggeration of freshness/natural state) -->
  <g transform="translate(15, 0)">
    <!-- Fresh Leaf and Organic Sprout Base -->
    <path d="M 60 140 C 40 140, 30 110, 45 90 C 60 70, 85 80, 85 105 C 85 125, 75 140, 60 140 Z" fill="#2ECC71" opacity="0.2"/>
    <path d="M 50 145 C 35 145, 25 120, 38 100 C 50 80, 72 90, 70 112 C 68 130, 60 145, 50 145 Z" fill="#2ECC71" opacity="0.4"/>

    <!-- Large Organic Produce (Exaggerated scale contrast) -->
    <!-- Crisp Red Apple -->
    <circle cx="55" cy="115" r="24" fill="#E74C3C"/>
    <!-- Apple Highlight -->
    <circle cx="48" cy="105" r="5" fill="#FF6B6B" opacity="0.8"/>
    <!-- Apple Stem -->
    <path d="M 55 91 C 55 86, 58 83, 61 82" stroke="#8D6E63" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 59 84 C 64 82, 67 85, 65 89" fill="#2ECC71"/>

    <!-- Plump Golden Orange/Citrus nested beside -->
    <circle cx="82" cy="130" r="20" fill="#F39C12"/>
    <circle cx="77" cy="122" r="3" fill="#F1C40F" opacity="0.8"/>
    <path d="M 82 110 C 82 107, 84 105, 86 104" stroke="#27AE60" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Dynamic Expansion / Stream Vector (Representing live-stream distribution / commercial reach) -->
  <g>
    <!-- Flowing connection paths -->
    <path d="M 105 110 C 120 90, 135 90, 150 110" stroke="#3498DB" stroke-width="3" stroke-dasharray="4,4" fill="none" opacity="0.8"/>
    <path d="M 115 130 C 130 115, 145 115, 160 130" stroke="#F1C40F" stroke-width="3" stroke-dasharray="4,4" fill="none" opacity="0.8"/>

    <!-- Signal / Live Broadcast / Market Reach Waves -->
    <path d="M 125 70 C 135 60, 155 60, 165 70" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 115 60 C 130 45, 160 45, 175 60" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Right Side: Structured Modern Distribution / Market Delivery Box -->
  <g transform="translate(135, 85)">
    <!-- Modern Delivery/Market Container (Flat vector style) -->
    <rect x="15" y="25" width="55" height="45" rx="6" fill="#34495E" stroke="#5D6D7E" stroke-width="2"/>
    <!-- Box Flaps Open -->
    <path d="M 15 25 L 30 10 L 55 10 L 70 25 Z" fill="#2C3E50" stroke="#5D6D7E" stroke-width="2"/>
    <!-- Accent seal / quality badge on package -->
    <circle cx="42" cy="45" r="8" fill="#F39C12"/>
    <path d="M 38 45 L 41 48 L 47 41" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Small fresh sprout emerging from packaged distribution (highlighting high-quality farm produce attribute) -->
    <path d="M 42 10 C 42 2, 36 -2, 30 -5" stroke="#2ECC71" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 30 -5 C 25 -8, 25 -2, 30 2 C 35 6, 40 2, 42 10 Z" fill="#2ECC71"/>
  </g>

  <!-- Foreground emphasis: Quality indicator glow lines underneath -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="180" r="4" fill="#F39C12"/>
</svg>