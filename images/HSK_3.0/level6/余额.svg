<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing ambient light behind the main object -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.08"/>

  <!-- Physical Object: Modern Transit Smart Card representing "余额" (Balance in card) -->
  <g transform="translate(45, 68)">
    <!-- Card Shadow -->
    <rect x="4" y="6" width="140" height="92" rx="12" fill="#000000" opacity="0.4"/>
    
    <!-- Card Body -->
    <rect width="140" height="92" rx="12" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    
    <!-- Card Top Accent Bar -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 128 0 A 12 12 0 0 1 140 12 L 140 26 L 0 26 Z" fill="#2F363D"/>

    <!-- NFC / Contactless Wave Symbol (Top Right) -->
    <path d="M 112 10 A 8 8 0 0 1 118 16" stroke="#8B949E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 112 6 A 13 13 0 0 1 122 16" stroke="#8B949E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 112 2 A 18 18 0 0 1 126 16" stroke="#8B949E" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Smart Chip Icon -->
    <rect x="18" y="38" width="22" height="17" rx="3" fill="#D29922" opacity="0.9"/>
    <rect x="22" y="38" width="14" height="17" fill="none" stroke="#9E6A03" stroke-width="1.5"/>
    <line x1="18" y1="46" x2="40" y2="46" stroke="#9E6A03" stroke-width="1.5"/>

    <!-- Digital Display Screen Window on Card -->
    <rect x="48" y="62" width="74" height="20" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

    <!-- Currency Symbol & Numbers Inside Screen (Abstracted Clean Digits/Amount) -->
    <text x="56" y="77" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFB703">¥</text>
    <!-- Digital segment style dots/dashes representing remaining balance -->
    <rect x="68" y="70" width="8" height="3" rx="1" fill="#FFB703"/>
    <rect x="78" y="70" width="8" height="3" rx="1" fill="#FFB703"/>
    <circle cx="91" cy="71" r="1.5" fill="#FFB703"/>
    <rect x="95" y="70" width="8" height="3" rx="1" fill="#FFB703"/>
    <rect x="105" y="70" width="8" height="3" rx="1" fill="#FFB703"/>
  </g>

  <!-- Accent Sparkles indicating active readable balance state -->
  <path d="M 185 65 L 187 72 L 194 74 L 187 76 L 185 83 L 183 76 L 176 74 L 183 72 Z" fill="#FFB703" opacity="0.8"/>
  <path d="M 60 160 L 61 165 L 66 166 L 61 167 L 60 172 L 59 167 L 54 166 L 59 165 Z" fill="#FFB703" opacity="0.5"/>
</svg>