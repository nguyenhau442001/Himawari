<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (subtle growth rings / multiplying vectors) -->
  <circle cx="120" cy="130" r="70" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="120" cy="130" r="50" fill="none" stroke="#2A2F3D" stroke-width="1.5" opacity="0.6"/>

  <!-- Main Object representing "倍增" (Multiplication/Exponential Growth - Physical representation: A blooming multi-layered crystal/flower structure representing manifold increase) -->
  
  <!-- Outer aura / glow -->
  <circle cx="120" cy="120" r="36" fill="#F59E0B" opacity="0.15"/>

  <!-- Base / Platform -->
  <ellipse cx="120" cy="180" rx="32" ry="8" fill="#111318"/>
  <path d="M 100 176 L 140 176 L 132 166 L 108 166 Z" fill="#334155"/>

  <!-- Central core (Origin of multiplication) -->
  <circle cx="120" cy="130" r="14" fill="#3B82F6"/>
  <circle cx="120" cy="130" r="8" fill="#60A5FA"/>

  <!-- Multiplying layers / petals / units expanding outward -->
  <!-- Top tier -->
  <path d="M 120 90 C 112 104 112 112 120 120 C 128 112 128 104 120 90 Z" fill="#F59E0B"/>
  
  <!-- Bottom-left tier -->
  <path d="M 85 150 C 95 144 102 144 110 152 C 102 158 95 158 85 150 Z" fill="#F59E0B" transform="rotate(-30 110 150)"/>

  <!-- Bottom-right tier -->
  <path d="M 155 150 C 145 144 138 144 130 152 C 138 158 145 158 155 150 Z" fill="#F59E0B" transform="rotate(30 130 150)"/>

  <!-- Secondary cascading multiplier elements (representing "many times over") -->
  <!-- Top Left Small Node -->
  <circle cx="85" cy="95" r="8" fill="#38BDF8"/>
  <path d="M 104 116 L 91 102" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Right Small Node -->
  <circle cx="155" cy="95" r="8" fill="#38BDF8"/>
  <path d="M 136 116 L 149 102" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Far Left Small Node -->
  <circle cx="72" cy="130" r="8" fill="#FBBF24"/>
  <path d="M 106 130 L 82 130" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Far Right Small Node -->
  <circle cx="168" cy="130" r="8" fill="#FBBF24"/>
  <path d="M 134 130 L 158 130" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom Small Node Left -->
  <circle cx="95" cy="165" r="6" fill="#60A5FA"/>
  <path d="M 111 142 L 100 157" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom Small Node Right -->
  <circle cx="145" cy="165" r="6" fill="#60A5FA"/>
  <path d="M 129 142 L 140 157" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Center highlight sparkling element -->
  <path d="M 120 114 L 122 124 L 132 126 L 122 128 L 120 138 L 118 128 L 108 126 L 118 124 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 85 85 L 86 90 L 91 91 L 86 92 L 85 97 L 84 92 L 79 91 L 84 90 Z" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 155 85 L 156 90 L 161 91 L 156 92 L 155 97 L 154 92 L 149 91 L 154 90 Z" fill="#FFFFFF" opacity="0.7"/>

</svg>