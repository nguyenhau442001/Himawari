<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Drop Shadow for Goban -->
  <ellipse cx="120" cy="180" rx="75" ry="16" fill="#0D0F13" opacity="0.6"/>

  <!-- Goban (Go Board) - Isometric/Perspective Flat View -->
  <g transform="translate(120, 115)">
    <!-- Board Base (Wood/Slate tone optimized for dark mode) -->
    <path d="M-85,-35 L85,-35 L105,45 L-105,45 Z" fill="#2C231D" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M-80,-30 L80,-30 L98,40 L-98,40 Z" fill="#E6C687" stroke="#3D3028" stroke-width="0.75"/>

    <!-- Board Grid Lines (Perspective adjusted) -->
    <!-- Horizontal lines -->
    <line x1="-72" y1="-21" x2="88" y2="-21" stroke="#3D3028" stroke-width="1"/>
    <line x1="-64" y1="-12" x2="79" y2="-12" stroke="#3D3028" stroke-width="1"/>
    <line x1="-56" y1="-3" x2="70" y2="-3" stroke="#3D3028" stroke-width="1"/>
    <line x1="-48" y1="6" x2="61" y2="6" stroke="#3D3028" stroke-width="1"/>
    <line x1="-40" y1="15" x2="53" y2="15" stroke="#3D3028" stroke-width="1"/>
    <line x1="-32" y1="24" x2="44" y2="24" stroke="#3D3028" stroke-width="1"/>
    <line x1="-24" y1="33" x2="35" y2="33" stroke="#3D3028" stroke-width="1"/>

    <!-- Vertical lines -->
    <line x1="-56" y1="-3" x2="-24" y2="33" stroke="#3D3028" stroke-width="1"/>
    <line x1="-32" y1="-12" x2="0" y2="24" stroke="#3D3028" stroke-width="1"/>
    <line x1="-8" y1="-21" x2="24" y2="15" stroke="#3D3028" stroke-width="1"/>
    <line x1="16" y1="-30" x2="48" y2="6" stroke="#3D3028" stroke-width="1"/>
    <line x1="40" y1="-39" x2="72" y2="-3" stroke="#3D3028" stroke-width="1"/>
    
    <line x1="-68" y1="-17" x2="4" y2="-32" stroke="#3D3028" stroke-width="1"/>
    <line x1="-44" y1="-8" x2="28" y2="-23" stroke="#3D3028" stroke-width="1"/>
    <line x1="-20" y1="1" x2="52" y2="-14" stroke="#3D3028" stroke-width="1"/>
    <line x1="4" y1="10" x2="76" y2="-5" stroke="#3D3028" stroke-width="1"/>
    <line x1="28" y1="19" x2="100" y2="4" stroke="#3D3028" stroke-width="1"/>

    <!-- Star Points (Hoshi) -->
    <circle cx="-16" cy="-4" r="1.5" fill="#3D3028"/>
    <circle cx="32" cy="-14" r="1.5" fill="#3D3028"/>
    <circle cx="-36" cy="11" r="1.5" fill="#3D3028"/>
    <circle cx="12" cy="1" r="1.5" fill="#3D3028"/>

    <!-- Go Stones (Weiqi / Baduk pieces) -->
    <!-- White Stone 1 -->
    <ellipse cx="-16" cy="-4" rx="6" ry="3.5" fill="#F0F2F5" stroke="#D1D5DB" stroke-width="0.5"/>
    <ellipse cx="-17" cy="-5" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Black Stone 1 (Focus Accent Gold ring/highlight) -->
    <ellipse cx="32" cy="-14" rx="6" ry="3.5" fill="#111318" stroke="#D4AF37" stroke-width="1.25"/>
    <ellipse cx="31" cy="-15" rx="3" ry="1.5" fill="#3A414E" opacity="0.8"/>

    <!-- White Stone 2 -->
    <ellipse cx="-36" cy="11" rx="6" ry="3.5" fill="#F0F2F5" stroke="#D1D5DB" stroke-width="0.5"/>
    <ellipse cx="-37" cy="10" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Black Stone 2 (The winning/placement move with glowing gold indicator) -->
    <g transform="translate(12, 1)">
      <!-- Subtle tactical glow -->
      <ellipse cx="0" cy="0" rx="9" ry="5" fill="#D4AF37" opacity="0.3"/>
      <ellipse cx="0" cy="0" rx="6" ry="3.5" fill="#111318" stroke="#D4AF37" stroke-width="1.5"/>
      <ellipse cx="-1" cy="-1" rx="3" ry="1.5" fill="#4B5563" opacity="0.9"/>
    </g>

    <!-- Additional background stones for depth -->
    <ellipse cx="-52" cy="-8" rx="6" ry="3.5" fill="#111318" stroke="#333" stroke-width="0.5"/>
    <ellipse cx="56" cy="-5" rx="6" ry="3.5" fill="#F0F2F5" stroke="#D1D5DB" stroke-width="0.5"/>
  </g>

  <!-- Decorative modern accent ring in corner -->
  <circle cx="205" cy="35" r="18" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.15"/>
  <circle cx="35" cy="205" r="18" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.15"/>
</svg>