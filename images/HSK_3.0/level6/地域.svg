<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Stylized Geographical/Territorial Region Icon (Physical Object Representation) -->
  <g transform="translate(0, 0)">
    <!-- Base platform / terrain layer -->
    <path d="M 60 145 L 120 170 L 180 145 L 180 160 L 120 185 L 60 160 Z" fill="#2D3748" opacity="0.7"/>
    <path d="M 60 130 L 120 155 L 180 130 L 180 145 L 120 170 L 60 145 Z" fill="#3E4C59" opacity="0.8"/>

    <!-- Main 3D isometric-style section representing a distinct region/territory -->
    <path d="M 60 115 L 120 140 L 180 115 L 120 90 Z" fill="#2E4372"/>
    <path d="M 60 115 L 60 130 L 120 155 L 120 140 Z" fill="#1B2A4A"/>
    <path d="M 180 115 L 180 130 L 120 155 L 120 140 Z" fill="#1E335E"/>

    <!-- Top surface / land boundaries (Accent color gold/orange for regional focus) -->
    <path d="M 65 117 L 120 139 L 175 117 L 120 95 Z" fill="#314E84"/>

    <!-- Distinct regional divisions / borders (lines on terrain) -->
    <path d="M 120 95 L 120 139" stroke="#E6B325" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
    <path d="M 90 106 L 150 128" stroke="#E6B325" stroke-width="2" opacity="0.6"/>

    <!-- Geographic features: Stylized mountain range representing physical environment -->
    <polygon points="90,115 105,90 120,112" fill="#4A5568"/>
    <polygon points="100,119 110,102 122,118" fill="#718096"/>
    <polygon points="135,105 147,85 160,110" fill="#4A5568"/>
    <polygon points="130,108 140,92 150,112" fill="#A0AEC0"/>

    <!-- Geographic features: Stylized pine trees / vegetation (representing local culture/ecosystem) -->
    <circle cx="85" cy="122" r="6" fill="#48BB78"/>
    <circle cx="160" cy="120" r="5" fill="#38A169"/>
    <circle cx="155" cy="127" r="4" fill="#48BB78"/>

    <!-- Floating Location Pin (marking the specific territory/region) -->
    <g transform="translate(0, -10)">
      <!-- Pin shadow -->
      <ellipse cx="120" cy="93" rx="4" ry="2" fill="#000000" opacity="0.4"/>
      
      <!-- Pin body -->
      <path d="M 120 65 C 111.7 65 105 71.7 105 80 C 105 91 120 102 120 102 C 120 102 135 91 135 80 C 135 71.7 128.3 65 120 65 Z" fill="#F6AD55"/>
      
      <!-- Pin inner core -->
      <circle cx="120" cy="80" r="4.5" fill="#1A1D24"/>
    </g>
  </g>
</svg>