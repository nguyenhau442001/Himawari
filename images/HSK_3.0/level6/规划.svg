<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="0.5">
    <line x1="30" y1="0" x2="30" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="90" y1="0" x2="90" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="240"/>
    
    <line x1="0" y1="30" x2="240" y2="30"/>
    <line x1="0" y1="60" x2="240" y2="60"/>
    <line x1="0" y1="90" x2="240" y2="90"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="150" x2="240" y2="150"/>
    <line x1="0" y1="180" x2="240" y2="180"/>
    <line x1="0" y1="210" x2="240" y2="210"/>
  </g>

  <!-- Drafting Table / Base Surface -->
  <path d="M40 185 L200 185 L215 205 L25 205 Z" fill="#252A34" stroke="#333B48" stroke-width="2"/>
  
  <!-- Blueprint Sheet (The Plan/Qui Hoach) -->
  <g transform="rotate(-6 120 120)">
    <!-- Paper Background -->
    <rect x="55" y="45" width="130" height="130" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Inner Blueprint Grid -->
    <path d="M75 45 V175 M105 45 V175 M135 45 V175 M165 45 V175 M55 65 H185 M55 95 H185 M55 125 H185 M55 155 H185" stroke="#1E293B" stroke-width="1"/>

    <!-- Master Plan Graphics (City Layout & Infrastructure) -->
    <!-- Green Zone / Park -->
    <rect x="68" y="138" width="37" height="24" rx="3" fill="#065F46" opacity="0.6"/>
    <circle cx="80" cy="150" r="6" fill="#10B981" opacity="0.8"/>
    <circle cx="95" cy="150" r="8" fill="#10B981" opacity="0.8"/>

    <!-- Building Block 1 (Commercial High-rise) -->
    <rect x="68" y="75" width="30" height="45" rx="2" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="74" y1="85" x2="92" y2="85" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>
    <line x1="74" y1="95" x2="92" y2="95" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>
    <line x1="74" y1="105" x2="92" y2="105" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>

    <!-- Building Block 2 (Residential Complex) -->
    <rect x="115" y="65" width="55" height="35" rx="2" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="125" y1="75" x2="160" y2="75" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>
    <line x1="125" y1="85" x2="160" y2="85" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>

    <!-- Infrastructure Roads / Circulation -->
    <path d="M105 55 V165 M60 125 H180" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="105" cy="125" r="4" fill="#F59E0B"/>

    <!-- Zoning / Expansion Indicator (Dashed lines) -->
    <rect x="115" y="115" width="55" height="45" rx="2" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Architectural Drafting Tools (Emphasizing Planning & Design) -->
  <!-- Compass / Divider -->
  <g transform="translate(155, 110) rotate(18)">
    <line x1="0" y1="0" x2="-15" y2="75" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="75" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#F59E0B" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Compass adjustment wheel -->
    <circle cx="0" cy="20" r="3" fill="#F59E0B"/>
  </g>

  <!-- Modern Triangle Ruler (Set Square) with Gold/Amber Accent -->
  <g transform="translate(35, 120) rotate(-15)">
    <polygon points="0,60 70,60 0,0" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Ruler interior cut-out -->
    <polygon points="10,45 45,45 10,10" fill="#1A1D24" opacity="0.9"/>
    <!-- Tick marks -->
    <line x1="10" y1="60" x2="10" y2="55" stroke="#F59E0B" stroke-width="1"/>
    <line x1="20" y1="60" x2="20" y2="57" stroke="#F59E0B" stroke-width="1"/>
    <line x1="30" y1="60" x2="30" y2="55" stroke="#F59E0B" stroke-width="1"/>
    <line x1="40" y1="60" x2="40" y2="57" stroke="#F59E0B" stroke-width="1"/>
    <line x1="50" y1="60" x2="50" y2="55" stroke="#F59E0B" stroke-width="1"/>
  </g>

  <!-- Strategic Marker Pen / Stylus pointing to the plan -->
  <g transform="translate(180, 50) rotate(45)">
    <rect x="-4" y="-35" width="8" height="40" rx="2" fill="#38BDF8"/>
    <polygon points="-4,5 4,5 0,18" fill="#F43F5E"/>
    <rect x="-3" y="-30" width="6" height="6" rx="1" fill="#1E293B"/>
  </g>
</svg>