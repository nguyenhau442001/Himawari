<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Cloud -->
  <path d="M70 90 C70 70, 90 60, 110 60 C120 60, 130 65, 140 60 C160 60, 180 70, 180 90 C180 100, 170 110, 160 110 L80 110 C70 110, 70 100, 70 90 Z" fill="#7D8A99"/>
  
  <!-- Rain streaks (The "阵" aspect - sudden, concentrated) -->
  <g stroke="#FFB84D" stroke-width="3" stroke-linecap="round">
    <line x1="90" y1="120" x2="85" y2="150"/>
    <line x1="110" y1="125" x2="105" y2="165"/>
    <line x1="130" y1="120" x2="125" y2="155"/>
    <line x1="150" y1="125" x2="145" y2="160"/>
    <line x1="170" y1="120" x2="165" y2="145"/>
  </g>
  
  <!-- Ground impact splashes -->
  <g fill="#FFB84D">
    <ellipse cx="85" cy="165" rx="6" ry="2"/>
    <ellipse cx="105" cy="180" rx="6" ry="2"/>
    <ellipse cx="125" cy="170" rx="6" ry="2"/>
    <ellipse cx="145" cy="175" rx="6" ry="2"/>
    <ellipse cx="165" cy="160" rx="6" ry="2"/>
  </g>
</svg>