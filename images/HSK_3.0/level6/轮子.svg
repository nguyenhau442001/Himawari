<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Suitcase corner housing / bottom structure representing the context -->
    <path d="M40,150 L60,80 L140,80 L160,150 Z" fill="#2E3440" opacity="0.6"/>
    <rect x="50" y="145" width="100" height="12" rx="4" fill="#3B4252"/>
    
    <!-- Motion / Smoothness indicator lines (matching the context "灵活顺畅") -->
    <path d="M25,185 Q40,170 55,185" fill="none" stroke="#61AFEF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M15,195 Q35,175 55,195" fill="none" stroke="#61AFEF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Swivel Caster Wheel (万向轮子) - Main Noun Subject -->
    <!-- Top mounting plate -->
    <rect x="85" y="152" width="30" height="8" rx="2" fill="#D8DEE9"/>
    <circle cx="100" cy="156" r="2" fill="#4C566A"/>
    
    <!-- Vertical swivel fork stem -->
    <rect x="96" y="160" width="8" height="12" fill="#E5C07B"/>
    
    <!-- Fork bracket holding the wheel -->
    <path d="M92,168 L108,168 L112,192 C112,195 109,198 106,198 L94,198 C91,198 88,195 88,192 Z" fill="#9DA9B8"/>
    
    <!-- Axle pin -->
    <circle cx="100" cy="186" r="4" fill="#4C566A"/>
    
    <!-- The Wheel (Bánh xe) - High-contrast accent color -->
    <circle cx="100" cy="186" r="26" fill="none" stroke="#E5C07B" stroke-width="8"/>
    <circle cx="100" cy="186" r="22" fill="#2E3440"/>
    <circle cx="100" cy="186" r="8" fill="#E5C07B"/>
    <circle cx="100" cy="186" r="3" fill="#1A1D24"/>
    
    <!-- Rotation / flexibility directional indicators -->
    <path d="M 68,175 A 32,32 0 0,1 78,155" fill="none" stroke="#98C379" stroke-width="3" stroke-linecap="round"/>
    <polygon points="78,151 74,158 82,158" fill="#98C379"/>
    
    <path d="M 132,175 A 32,32 0 0,0 122,155" fill="none" stroke="#98C379" stroke-width="3" stroke-linecap="round"/>
    <polygon points="122,151 118,158 126,158" fill="#98C379"/>
  </g>
</svg>