<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Floor line / street surface -->
  <path d="M 40 185 L 200 185" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>

  <!-- Dust / Debris particles being swept away -->
  <g fill="#FFA726" opacity="0.9">
    <circle cx="155" cy="172" r="3"/>
    <circle cx="168" cy="177" r="2"/>
    <circle cx="145" cy="179" r="2.5"/>
    <circle cx="178" cy="170" r="1.5"/>
  </g>

  <!-- Broom / Cleaning tool representing 清扫 -->
  <g transform="translate(120, 120) rotate(-25)">
    <!-- Handle extending up and right -->
    <line x1="-30" y1="50" x2="60" y2="-75" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Broom head connector/ferrule -->
    <rect x="35" y="-62" width="18" height="12" rx="3" fill="#B0BEC5"/>

    <!-- Bright Orange/Gold Bristles (Action focus) -->
    <path d="M 20 -50 L 70 -50 L 80 -30 L 15 -30 Z" fill="#FFA726"/>
    <!-- Bristle texture lines -->
    <line x1="28" y1="-50" x2="25" y2="-30" stroke="#EF6C00" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="-50" x2="40" y2="-30" stroke="#EF6C00" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="-50" x2="55" y2="-30" stroke="#EF6C00" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="-50" x2="70" y2="-30" stroke="#EF6C00" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Motion lines indicating sweeping action -->
  <g stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 120 158 Q 135 150 150 160"/>
    <path d="M 105 168 Q 125 160 140 170"/>
  </g>

  <!-- Sparkle/Cleanliness indicator -->
  <g transform="translate(75, 95)" fill="#4DB6AC">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z"/>
  </g>
  <g transform="translate(160, 80) scale(0.6)" fill="#4DB6AC">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z"/>
  </g>
</svg>