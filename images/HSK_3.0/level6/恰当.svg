<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Spotlight/Success -->
    <radialGradient id="spotlight" cx="65%" cy="30%" r="60%" fx="65%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Presentation Board Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / CONTEXT PROPS -->
  <!-- Modern Office / Presentation Room Backdrop -->
  <g id="environment">
    <!-- Window with City Silhouette -->
    <path d="M25 45 H85 V125 H25 Z" fill="#090d16" opacity="0.6" />
    <!-- City lights minimal -->
    <rect x="35" y="60" width="6" height="10" fill="#fbbf24" opacity="0.3" rx="1" />
    <rect x="47" y="55" width="8" height="15" fill="#38bdf8" opacity="0.2" rx="1" />
    <rect x="65" y="70" width="10" height="20" fill="#fbbf24" opacity="0.2" rx="1" />
    <rect x="35" y="85" width="8" height="12" fill="#38bdf8" opacity="0.3" rx="1" />
    <!-- Window frame -->
    <path d="M25 45 H85 V125 H25 Z" fill="none" stroke="#334155" stroke-width="2" />

    <!-- Presentation Display Board on Wall -->
    <rect x="135" y="35" width="80" height="65" rx="6" fill="url(#board-grad)" stroke="#475569" stroke-width="1.5" filter="url(#soft-shadow)" />
    <!-- Graphic on Board (Abstract chart showing correct answer/success) -->
    <path d="M148 75 L163 60 L178 70 L203 48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="203" cy="48" r="4" fill="#38bdf8" />
    <!-- Subtle bar charts on board -->
    <rect x="147" y="82" width="10" height="10" rx="2" fill="#64748b" opacity="0.5" />
    <rect x="163" y="78" width="10" height="14" rx="2" fill="#64748b" opacity="0.5" />
    <rect x="179" y="72" width="10" height="20" rx="2" fill="#10b981" opacity="0.8" />

    <!-- Office Plant in Corner -->
    <path d="M205 170 Q215 150 210 130 Q225 145 220 170 Z" fill="#10b981" opacity="0.8" />
    <path d="M212 175 Q195 160 190 145 Q205 160 215 175 Z" fill="#059669" opacity="0.8" />
    <path d="M200 195 H224 V175 H200 Z" rx="3" fill="#cbd5e1" />
  </g>

  <!-- INTERACTION DESK & PROPS -->
  <g id="desk-and-props">
    <!-- Main Desk Surface -->
    <path d="M15 195 H225 V208 H15 Z" fill="#334155" filter="url(#soft-shadow)" />
    <path d="M15 190 H225 V195 H15 Z" fill="#475569" />
    <!-- Desk legs -->
    <rect x="35" y="208" width="8" height="20" fill="#1e293b" />
    <rect x="195" y="208" width="8" height="20" fill="#1e293b" />

    <!-- Microphone (representing speaking / answering a question) -->
    <rect x="117" y="165" width="6" height="30" rx="3" fill="#64748b" />
    <circle cx="120" cy="162" r="7" fill="#94a3b8" />
    <path d="M115 158 A5 5 0 0 1 125 158" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="114" y="193" width="12" height="3" rx="1.5" fill="#475569" />

    <!-- Open Notepad / Document on Desk -->
    <path d="M60 180 L85 175 L95 192 L70 197 Z" fill="#f1f5f9" />
    <path d="M78 177 L88 194" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M67 180 L79 187" stroke="#cbd5e1" stroke-width="1" />
    <path d="M72 181 L84 188" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- MAIN CHARACTER: Confident Speaker / Employee answering correctly -->
  <g id="main-character" filter="url(#soft-shadow)">
    <!-- Character Body / Suit Jacket -->
    <path d="M100 150 Q100 135 120 135 Q140 135 140 150 L155 195 H85 Z" fill="#2563eb" /> <!-- Blue blazer -->
    <!-- Inner Shirt & Collar -->
    <path d="M110 135 L120 150 L130 135 Z" fill="#ffffff" />
    <!-- Tie / Accent -->
    <path d="M118 145 L122 145 L120 170 Z" fill="#fbbf24" />

    <!-- Neck -->
    <rect x="113" y="123" width="14" height="15" fill="#fcd34d" /> <!-- Skin tone base -->
    <path d="M113 125 C113 123 127 123 127 125 L127 133 C127 133 113 133 113 133 Z" fill="#e2b034" opacity="0.3" /> <!-- Neck shadow -->

    <!-- Head -->
    <circle cx="120" cy="105" r="22" fill="#fcd34d" />

    <!-- Hair (Modern styled dark hair) -->
    <path d="M98 105 C98 90 105 82 120 82 C135 82 143 90 143 105 C143 108 141 100 138 95 C130 85 110 85 102 95 C99 100 98 105 98 105 Z" fill="#1e293b" />
    <path d="M115 84 Q125 80 135 88 Z" fill="#334155" />

    <!-- Facial Expression: Confident, articulate, smiling -->
    <!-- Eyes (Happy / Confident crescent arcs) -->
    <path d="M110 102 Q114 98 118 102" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M122 102 Q126 98 130 102" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Eyebrows (Upbeat) -->
    <path d="M108 97 Q114 94 118 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M122 97 Q126 94 132 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Friendly Open Smile -->
    <path d="M113 112 Q120 118 127 112" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M115 113 Q120 116 125 113 Z" fill="#ef4444" /> <!-- Tongue peek -->
    <!-- Rosy Cheeks -->
    <circle cx="107" cy="108" r="3.5" fill="#f87171" opacity="0.4" />
    <circle cx="133" cy="108" r="3.5" fill="#f87171" opacity="0.4" />

    <!-- Arms & Gestures (Expressive communicating pose) -->
    <!-- Left arm (reaching forward gracefully to emphasize the point) -->
    <path d="M95 145 Q75 140 70 155 Q65 170 80 175" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand -->
    <circle cx="80" cy="177" r="6" fill="#fcd34d" />

    <!-- Right arm (gesturing upward/outward, explaining precisely) -->
    <path d="M145 145 Q165 130 160 115 Q155 100 145 105" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Hand -->
    <circle cx="142" cy="103" r="6" fill="#fcd34d" />
  </g>

  <!-- SECONDARY CHARACTER / AUDIENCE (Listening attentively, impressed) -->
  <g id="listener-character" opacity="0.9">
    <!-- Colleague body -->
    <path d="M30 195 L30 160 Q30 145 45 145 Q60 145 60 160 L60 195 Z" fill="#0d9488" />
    <!-- Head -->
    <circle cx="45" cy="125" r="16" fill="#fcd34d" />
    <!-- Hair (Bob style) -->
    <path d="M30 125 C30 110 38 105 45 105 C52 105 60 110 60 125 L58 135 C58 135 55 120 45 120 C35 120 32 135 32 135 Z" fill="#0f172a" />
    <!-- Eyes (Looking attentively towards speaker) -->
    <circle cx="49" cy="122" r="1.5" fill="#1e293b" />
    <!-- Pleased/Approving Smile -->
    <path d="M45 130 Q49 134 52 130" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- CONCEPTUAL OVERLAY / VISUAL ACCENT (Symbolizing "Apt / Perfect Fit") -->
  <!-- Floating Green Checkmark & Sparkles (Representing correctness, appropriateness, "qiàdàng") -->
  <g id="success-indicators" transform="translate(170, 95)">
    <!-- Glowing background circle -->
    <circle cx="0" cy="0" r="18" fill="#10b981" opacity="0.2" />
    <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.9" filter="url(#soft-shadow)" />
    <!-- Checkmark icon -->
    <path d="M-5 -1 L-2 3 L6 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Sparkles around the checkmark -->
    <path d="M-22 -15 L-20 -18 L-18 -15 L-20 -12 Z" fill="#fbbf24" />
    <path d="M18 -10 L21 -14 L24 -10 L21 -6 Z" fill="#38bdf8" />
    <circle cx="-16" cy="12" r="2" fill="#34d399" />
    <circle cx="18" cy="12" r="3" fill="#fbbf24" />
  </g>

</svg>