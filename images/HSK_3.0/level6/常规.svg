<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Clipboard / Routine Medical Checkup Object (Physical Noun representing 常规 / Routine) -->
  <g transform="translate(68, 36)">
    <!-- Clipboard Shadow/Back Layer -->
    <rect x="8" y="12" width="88" height="136" rx="8" fill="#111318"/>
    
    <!-- Main Clipboard Body -->
    <rect x="4" y="8" width="88" height="136" rx="8" fill="#2D333F"/>
    
    <!-- Clip at the Top -->
    <rect x="28" y="2" width="40" height="16" rx="4" fill="#E5A93B"/>
    <rect x="36" y="6" width="24" height="8" rx="2" fill="#1A1D24"/>
    
    <!-- Paper Sheet -->
    <rect x="12" y="24" width="72" height="112" rx="4" fill="#F0F2F5"/>
    
    <!-- Checklist items representing routine standard procedure -->
    <!-- Item 1: Checked -->
    <circle cx="26" cy="46" r="6" fill="#3B82F6"/>
    <path d="M23 46L25 48L30 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="43" width="36" height="6" rx="3" fill="#D1D5DB"/>
    
    <!-- Item 2: Checked -->
    <circle cx="26" cy="70" r="6" fill="#3B82F6"/>
    <path d="M23 70L25 72L30 67" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="67" width="28" height="6" rx="3" fill="#D1D5DB"/>
    
    <!-- Item 3: Checked -->
    <circle cx="26" cy="94" r="6" fill="#3B82F6"/>
    <path d="M23 94L25 96L30 91" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="91" width="32" height="6" rx="3" fill="#D1D5DB"/>
    
    <!-- Item 4: Standard Check line -->
    <circle cx="26" cy="118" r="6" fill="#E5A93B"/>
    <rect x="38" y="115" width="20" height="6" rx="3" fill="#9CA3AF"/>
  </g>
  
  <!-- Accent Medical Cross/Standard Indicator Floating -->
  <g transform="translate(160, 140)">
    <circle cx="16" cy="16" r="24" fill="#222733"/>
    <rect x="13" y="6" width="6" height="20" rx="3" fill="#E5A93B"/>
    <rect x="6" y="13" width="20" height="6" rx="3" fill="#E5A93B"/>
  </g>
</svg>