<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Trophy & Highlight Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Pillar / Foundation Gradient (Symbolizing 'Consolidation') -->
    <linearGradient id="pillar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="0" r="140" fill="url(#spotlight)"/>

  <!-- ENVIRONMENTAL CONTEXT: Studio / Exhibition Stage -->
  <!-- Floor / Base Platform -->
  <ellipse cx="120" cy="205" rx="90" ry="25" fill="#090d16" opacity="0.6"/>
  <path d="M 40,195 Q 120,210 200,195 L 210,215 Q 120,235 30,215 Z" fill="#334155" opacity="0.8"/>
  <path d="M 50,195 Q 120,208 190,195 L 185,185 Q 120,198 55,185 Z" fill="#475569"/>

  <!-- THE FOUNDATION / PILLARS (Visualizing "Consolidation/gǒnggù" of achievements) -->
  <!-- Left Pillar -->
  <rect x="65" y="140" width="22" height="50" rx="4" fill="url(#pillar-grad)" filter="url(#shadow)"/>
  <path d="M 60,135 H 92 V 142 H 60 Z" fill="#7dd3fc" rx="2"/>
  <path d="M 62,190 H 90 V 194 H 62 Z" fill="#0369a1"/>

  <!-- Right Pillar -->
  <rect x="153" y="140" width="22" height="50" rx="4" fill="url(#pillar-grad)" filter="url(#shadow)"/>
  <path d="M 148,135 H 180 V 142 H 148 Z" fill="#7dd3fc" rx="2"/>
  <path d="M 150,190 H 178 V 194 H 150 Z" fill="#0369a1"/>

  <!-- Central Connection Beam (Reinforcing Structure) -->
  <rect x="80" y="160" width="80" height="12" rx="3" fill="#0ea5e9" opacity="0.9"/>
  <circle cx="120" cy="166" r="4" fill="#fef3c7"/>

  <!-- ACHIEVEMENTS (The "Existing Achievements" / 成果 displayed safely on top) -->
  <!-- Left Achievement Frame (Project graphic) -->
  <rect x="55" y="85" width="42" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="76" cy="102" r="8" fill="#10b981"/>
  <path d="M 66,118 Q 76,110 86,118" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Achievement Frame (Data chart graphic) -->
  <rect x="143" y="85" width="42" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M 153,115 L 161,105 L 169,110 L 175,97" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Trophy (Main Existing Achievement) -->
  <g filter="url(#shadow)">
    <!-- Trophy Handles -->
    <path d="M 106,88 C 98,88 98,102 106,105" fill="none" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 134,88 C 142,88 142,102 134,105" fill="none" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Trophy Cup -->
    <path d="M 108,80 H 132 L 128,110 C 128,115 112,115 112,110 Z" fill="url(#gold-light)"/>
    <!-- Trophy Base -->
    <rect x="114" y="114" width="12" height="8" fill="url(#gold-grad)"/>
    <rect x="108" y="122" width="24" height="6" rx="2" fill="#b45309"/>
    <!-- Star on Trophy -->
    <path d="M 120,90 L 122,95 H 127 L 123,98 L 125,103 L 120,100 L 115,103 L 117,98 L 113,95 H 118 Z" fill="#fff" opacity="0.9"/>
  </g>

  <!-- CHARACTERS (Team actively reinforcing/securing the platform and achievements) -->
  <!-- Character 1 (Left: Worker/Architect tightening/securing) -->
  <g transform="translate(18, 115)" filter="url(#shadow)">
    <!-- Body & Torso -->
    <path d="M 28,45 L 38,75 H 22 L 18,45 Z" fill="#f97316"/>
    <!-- Head -->
    <circle cx="28" cy="30" r="10" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 18,28 Q 28,18 38,28 Q 38,22 28,20 Q 18,22 18,28 Z" fill="#1e293b"/>
    <!-- Hard Hat -->
    <path d="M 16,24 Q 28,16 40,24 Z" fill="#f59e0b"/>
    <rect x="14" y="23" width="28" height="3" rx="1.5" fill="#d97706"/>
    <!-- Arms working -->
    <path d="M 33,50 L 46,58" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <!-- Wrench/Tool -->
    <path d="M 44,58 L 52,63" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="53" cy="64" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Character 2 (Right: Partner/Colleague supporting and checking) -->
  <g transform="translate(162, 115)" filter="url(#shadow)">
    <!-- Body & Torso -->
    <path d="M 22,45 L 12,75 H 28 L 32,45 Z" fill="#06b6d4"/>
    <!-- Head -->
    <circle cx="22" cy="30" r="10" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 12,28 Q 22,16 32,26 Q 28,20 22,20 Q 14,20 12,28 Z" fill="#334155"/>
    <!-- Arms pointing/supporting -->
    <path d="M 18,48 L 4,52" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="3" cy="52" r="3" fill="#fed7aa"/>
  </g>

  <!-- Sparkles / Success Highlights -->
  <path d="M 45,70 L 47,75 L 52,77 L 47,79 L 45,84 L 43,79 L 38,77 L 43,75 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 195,75 L 196,78 L 199,79 L 196,80 L 195,83 L 194,80 L 191,79 L 194,78 Z" fill="#38bdf8" opacity="0.9"/>
  <circle cx="120" cy="55" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="100" cy="65" r="1.5" fill="#fef3c7" opacity="0.6"/>
  <circle cx="140" cy="62" r="2" fill="#fef3c7" opacity="0.7"/>
</svg>