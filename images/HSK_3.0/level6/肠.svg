<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Steam / Sizzle lines for grilled sausage context -->
    <path d="M-30 -75 C-25 -90, -35 -100, -30 -110" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M30 -75 C35 -90, 25 -100, 30 -110" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M0 -80 C-5 -95, 5 -105, 0 -115" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Grilled Sausage (Xúc xích / 肠) main body -->
    <g transform="rotate(-25)">
      <!-- Sausage shadow/depth -->
      <rect x="-85" y="-28" width="170" height="56" rx="28" fill="#D84315"/>
      <!-- Main sausage fill -->
      <rect x="-85" y="-32" width="170" height="56" rx="28" fill="#F4511E"/>
      
      <!-- Highlight sheen -->
      <path d="M-60 -18 L60 -18" stroke="#FF8A65" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

      <!-- Grill marks -->
      <path d="M-40 -32 L-30 -4" stroke="#BF360C" stroke-width="5" stroke-linecap="round"/>
      <path d="M-10 -32 L0 -4" stroke="#BF360C" stroke-width="5" stroke-linecap="round"/>
      <path d="M20 -32 L30 -4" stroke="#BF360C" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 -32 L60 -4" stroke="#BF360C" stroke-width="5" stroke-linecap="round"/>

      <!-- Tied ends / Casing twists -->
      <!-- Left end twist -->
      <path d="M-95 -12 L-85 -4 L-85 4 L-95 12 Z" fill="#D84315"/>
      <circle cx="-95" cy="0" r="4" fill="#BF360C"/>
      
      <!-- Right end twist -->
      <path d="M95 -12 L85 -4 L85 4 L95 12 Z" fill="#D84315"/>
      <circle cx="95" cy="0" r="4" fill="#BF360C"/>
    </g>
  </g>
</svg>