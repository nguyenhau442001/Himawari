<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative timeline/milestone line -->
  <line x1="40" y1="140" x2="200" y2="140" stroke="#2D323F" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Completed path segment -->
  <line x1="40" y1="140" x2="150" y2="140" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>

  <!-- Past milestone nodes -->
  <circle cx="70" cy="140" r="6" fill="#F59E0B"/>
  <circle cx="110" cy="140" r="6" fill="#F59E0B"/>

  <!-- Central physical object representing the boundary/endpoint ("为止" - physical marker post / boundary monolith) -->
  <!-- Base platform -->
  <path d="M125 170H175V176H125Z" fill="#3B82F6"/>
  
  <!-- Monolith / Stopping Post -->
  <rect x="140" y="95" width="20" height="75" rx="4" fill="#60A5FA"/>
  
  <!-- Glowing top cap symbolizing "Current limit / Up to this point" -->
  <path d="M136 95H164V103H136Z" fill="#F59E0B"/>
  <circle cx="150" cy="84" r="8" fill="#F59E0B"/>

  <!-- Pulsing arrival/boundary marker rings -->
  <circle cx="150" cy="140" r="28" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- Supporting iconographic context: A classic checkpoint flag planted at the stopping point -->
  <path d="M150 95L185 110L150 125Z" fill="#EF4444"/>
  <rect x="147" y="95" width="4" height="45" fill="#9CA3AF"/>

</svg>