<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle lighting gradient / backdrop effect -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Radiating "Effect" / Ripple Waves -->
  <path d="M 120,60 A 55,55 0 0,1 175,115" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 120,40 A 75,75 0 0,1 195,115" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  <path d="M 120,80 A 35,35 0 0,1 155,115" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <path d="M 120,60 A 55,55 0 0,0 65,115" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 120,40 A 75,75 0 0,0 45,115" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  <path d="M 120,80 A 35,35 0 0,0 85,115" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Energy / Chain Reaction Sparks (Gold/Orange accents) -->
  <circle cx="175" cy="85" r="3" fill="#F59E0B"/>
  <circle cx="190" cy="130" r="2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="65" cy="85" r="3" fill="#F59E0B"/>
  <circle cx="50" cy="130" r="2" fill="#F59E0B" opacity="0.8"/>
  <polygon points="120,25 123,32 130,35 123,38 120,45 117,38 110,35 117,32" fill="#F59E0B"/>
  <polygon points="185,60 187,64 191,65 187,66 185,70 183,66 179,65 183,64" fill="#F59E0B" opacity="0.7"/>
  <polygon points="55,60 57,64 61,65 57,66 55,70 53,66 49,65 53,64" fill="#F59E0B" opacity="0.7"/>

  <!-- Central Iconic Subject: A sleek glowing premium object / Star representing the source of the "Effect" -->
  <!-- Podium / Base -->
  <path d="M 90,165 L 150,165 L 160,180 L 80,180 Z" fill="#2B313F"/>
  <rect x="85" y="178" width="70" height="4" rx="2" fill="#F59E0B"/>

  <!-- Central Star / Core Representation -->
  <path d="M 120,70 L 129,93 L 154,95 L 135,111 L 141,136 L 120,122 L 99,136 L 105,111 L 86,95 L 111,93 Z" fill="url(#starGrad)" stroke="#FBBF24" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="starGrad" x1="120" y1="70" x2="120" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Dynamic Highlight / Glow Effect inside the Star -->
  <path d="M 120,80 L 125,95 L 140,96 L 128,106 L 132,120 L 120,111 L 108,120 L 112,106 L 100,96 L 115,95 Z" fill="#FEF08A" opacity="0.4"/>

  <!-- Base Floor Reflection -->
  <ellipse cx="120" cy="190" rx="45" ry="6" fill="#0F1115" opacity="0.8"/>
</svg>