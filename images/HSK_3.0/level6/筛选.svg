<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office Environment & Window background -->
  <path d="M40 30 L200 30 L200 130 L40 130 Z" fill="#1e293b" opacity="0.6"/>
  <rect x="50" y="40" width="45" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Window city silhouettes outside -->
  <path d="M55 70 L62 70 L62 110 L55 110 Z M68 60 L78 60 L78 110 L68 110 Z M83 80 L90 80 L90 110 L83 110 Z" fill="#334155" opacity="0.5"/>

  <!-- Office Plant -->
  <path d="M205 110 C205 95 215 90 215 90 C215 90 225 95 225 110 L220 135 L210 135 Z" fill="#475569"/>
  <path d="M215 90 C215 70 200 60 190 55 C205 65 210 80 215 90 Z" fill="#10b981"/>
  <path d="M215 90 C225 70 240 65 245 60 C235 75 220 85 215 90 Z" fill="#059669"/>

  <!-- Main Desk Surface -->
  <path d="M20 165 C20 160 24 156 30 156 L210 156 C216 156 220 160 220 165 L220 170 C220 175 216 179 210 179 L30 179 C24 179 20 175 20 170 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="1"/>
  <rect x="35" y="179" width="12" height="40" rx="3" fill="#0f172a"/>
  <rect x="193" y="179" width="12" height="40" rx="3" fill="#0f172a"/>

  <!-- Computer Monitor (Displaying Resumes & Filtering Action) -->
  <rect x="85" y="70" width="70" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="90" y="75" width="60" height="40" rx="2" fill="url(#screenGrad)"/>
  <path d="M110 120 L130 120 L133 140 L107 140 Z" fill="#475569"/>
  <rect x="100" y="140" width="40" height="5" rx="2" fill="#64748b"/>

  <!-- Resumes on Screen (Filtering concept: some accepted, some rejected) -->
  <!-- Accepted Resume (Green check/glow) -->
  <rect x="95" y="80" width="24" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="101" cy="87" r="3" fill="#38bdf8"/>
  <line x1="107" y1="85" x2="115" y2="85" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="107" y1="89" x2="113" y2="89" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="115" cy="91" r="3" fill="#10b981"/>
  <path d="M114 91 L115.5 92.5 L117.5 89.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rejected Resume (Red cross/dimmed) -->
  <rect x="123" y="80" width="24" height="14" rx="2" fill="#1e293b" opacity="0.8" stroke="#ef4444" stroke-width="1"/>
  <circle cx="129" cy="87" r="3" fill="#64748b"/>
  <line x1="135" y1="85" x2="143" y2="85" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="135" y1="89" x2="141" y2="89" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="143" cy="91" r="3" fill="#ef4444"/>
  <path d="M141.5 89.5 L144.5 92.5 M144.5 89.5 L141.5 92.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

  <!-- Another Accepted Resume -->
  <rect x="95" y="97" width="24" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="101" cy="104" r="3" fill="#38bdf8"/>
  <line x1="107" y1="102" x2="115" y2="102" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="107" y1="106" x2="113" y2="106" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="115" cy="108" r="3" fill="#10b981"/>
  <path d="M114 108 L115.5 109.5 L117.5 106.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Digital Sifting/Filter Graphic Effect -->
  <path d="M135 98 L150 98 L142 110 Z" fill="#f59e0b" opacity="0.8" filter="url(#glow)"/>
  <circle cx="142" cy="104" r="1.5" fill="#ffffff"/>

  <!-- Physical resumes stacked on the desk -->
  <g transform="translate(160, 135)">
    <rect x="0" y="10" width="30" height="18" rx="2" fill="#cbd5e1" transform="rotate(-10 15 19)"/>
    <rect x="5" y="5" width="28" height="18" rx="2" fill="#f1f5f9" transform="rotate(5 19 14)"/>
    <rect x="2" y="0" width="30" height="18" rx="2" fill="#ffffff"/>
    <line x1="8" y1="5" x2="22" y2="5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="9" x2="25" y2="9" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="13" x2="18" y2="13" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug on desk -->
  <rect x="55" y="135" width="16" height="20" rx="3" fill="#fb923c"/>
  <path d="M71 140 C76 140 76 150 71 150" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M59 132 C60 128 64 128 65 132" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- HR Recruiter Character (Focused, Professional) -->
  <!-- Torso & Shoulders -->
  <path d="M55 175 C55 145 85 145 85 145 C85 145 115 145 115 175 L110 200 L60 200 Z" fill="#3b82f6"/>
  <!-- Shirt collar -->
  <path d="M75 145 L85 162 L95 145 L90 142 L85 152 L80 142 Z" fill="#ffffff"/>
  <!-- Tie -->
  <path d="M83 152 L87 152 L89 175 L85 182 L81 175 Z" fill="#ef4444"/>

  <!-- Neck & Head -->
  <rect x="78" y="130" width="14" height="20" fill="#fbcfe8"/>
  <path d="M72 110 C70 95 80 85 85 85 C90 85 100 95 98 110 C100 125 70 125 72 110 Z" fill="#fbcfe8"/>
  
  <!-- Hair (Stylish professional cut) -->
  <path d="M72 105 C70 90 80 82 86 82 C92 82 101 90 99 105 C98 100 90 86 85 86 C80 86 73 100 72 105 Z" fill="#334155"/>
  <path d="M73 103 C76 92 83 88 88 88 C82 92 78 98 73 103 Z" fill="#475569"/>

  <!-- Face features (Concentrated expression) -->
  <!-- Glasses -->
  <rect x="75" y="100" width="9" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="86" y="100" width="9" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="84" y1="103" x2="86" y2="103" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="79.5" cy="103.5" r="1" fill="#1e293b"/>
  <circle cx="90.5" cy="103.5" r="1" fill="#1e293b"/>
  <!-- Eyebrows (Focused angle) -->
  <line x1="75" y1="97" x2="81" y2="99" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="84" y1="99" x2="90" y2="97" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mouth (Determined line) -->
  <line x1="83" y1="113" x2="87" y2="113" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms and Hands (Interacting with mouse/keyboard, pointing at screen) -->
  <!-- Right arm resting, clicking mouse -->
  <path d="M105 155 L120 160 L115 170" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="115" cy="172" r="5" fill="#fbcfe8"/>
  <!-- Computer Mouse -->
  <ellipse cx="125" cy="175" rx="5" ry="7" fill="#cbd5e1"/>

  <!-- Left arm raised slightly, hand reviewing -->
  <path d="M65 155 L55 140 L65 135" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="67" cy="132" r="5" fill="#fbcfe8"/>

  <!-- Decorative Sparkles/Accents for "Selection/Filtering" Concept -->
  <path d="M45 75 L48 82 L55 85 L48 88 L45 95 L42 88 L35 85 L42 82 Z" fill="#38bdf8" opacity="0.6" filter="url(#glow)"/>
  <path d="M190 70 L192 75 L197 77 L192 79 L190 84 L188 79 L183 77 L188 75 Z" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <circle cx="175" cy="115" r="3" fill="#10b981" opacity="0.7"/>
  <circle cx="65" cy="65" r="2" fill="#38bdf8" opacity="0.8"/>
</svg>