<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="15" rx="4" fill="#334155"/>
  <rect x="50" y="165" width="10" height="60" fill="#475569"/>
  <rect x="180" y="165" width="10" height="60" fill="#475569"/>
  
  <!-- Laptop -->
  <path d="M70 150 L170 150 L185 120 L55 120 Z" fill="#64748b"/>
  <path d="M60 120 L180 120 L175 110 L65 110 Z" fill="#94a3b8"/>
  <rect x="75" y="125" width="90" height="20" rx="2" fill="#0f172a"/>
  
  <!-- Screen Content (Abstract Forum UI) -->
  <rect x="80" y="128" width="80" height="3" rx="1" fill="#38bdf8"/>
  <rect x="80" y="134" width="60" height="2" rx="1" fill="#f1f5f9"/>
  <rect x="80" y="138" width="70" height="2" rx="1" fill="#f1f5f9"/>
  <circle cx="165" cy="140" r="3" fill="#fb923c"/>
  
  <!-- Character -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 80 C-30 50, 30 50, 30 80 L20 120 L-20 120 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 30 C-25 5, 0 -5, 25 30 C25 20, 10 5, 0 5 C-10 5, -25 20, -25 30" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="-15" y="25" width="12" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="3" y="25" width="12" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="-3" y1="29" x2="3" y2="29" stroke="#0f172a" stroke-width="2"/>
    <!-- Expression -->
    <path d="M-10 45 Q0 52 10 45" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Ambient Light/Decor -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
  <circle cx="200" cy="40" r="15" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Floating UI elements (Abstract) -->
  <circle cx="190" cy="80" r="4" fill="#ec4899"/>
  <rect x="40" y="70" width="10" height="10" rx="2" fill="#10b981" transform="rotate(20)"/>
</svg>