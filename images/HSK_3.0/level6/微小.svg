<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative scientific grid / glow -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="55" fill="none" stroke="#262B35" stroke-width="1"/>
  
  <!-- Subtle light beam from electron microscope lens above -->
  <path d="M90 35 L150 35 L170 85 L70 85 Z" fill="#2E384D" opacity="0.4"/>
  <path d="M105 35 L135 35 L145 70 L95 70 Z" fill="#3B465E" opacity="0.6"/>

  <!-- Scientific Electron Microscope Lens & Mount (Top framing context) -->
  <rect x="95" y="20" width="50" height="15" rx="3" fill="#4A5568"/>
  <rect x="100" y="35" width="40" height="25" rx="2" fill="#718096"/>
  <rect x="108" y="60" width="24" height="12" rx="1" fill="#E2E8F0"/>
  <path d="M85 72 H155 L165 85 H75 Z" fill="#2D3748"/>

  <!-- Glowing focal point / microscopic field circle -->
  <circle cx="120" cy="130" r="58" fill="#111418" stroke="#3182CE" stroke-width="2.5"/>

  <!-- Microscopic view grid lines -->
  <line x1="120" y1="74" x2="120" y2="186" stroke="#1E293B" stroke-width="1"/>
  <line x1="64" y1="130" x2="176" y2="130" stroke="#1E293B" stroke-width="1"/>
  <circle cx="120" cy="130" r="30" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Main Object: Extremely small bacterium / microorganism structure (Focus noun representing 微小) -->
  <g transform="translate(120, 130)">
    <!-- Outer glow for high visibility -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#DD6B20" opacity="0.25"/>
    
    <!-- Bacterium body -->
    <ellipse cx="0" cy="0" rx="18" ry="11" fill="#ED8936" transform="rotate(-15)"/>
    <ellipse cx="-4" cy="-2" rx="12" ry="7" fill="#F6AD55" transform="rotate(-15)"/>

    <!-- Cellular details (organelles / ribosomes) -->
    <circle cx="-6" cy="-3" r="2" fill="#9C4221"/>
    <circle cx="3" cy="2" r="1.5" fill="#9C4221"/>
    <circle cx="7" cy="-2" r="1.2" fill="#9C4221"/>
    <circle cx="-2" cy="4" r="1" fill="#9C4221"/>

    <!-- Flagella / cilia (microscopic hair-like structures) -->
    <path d="M 17 -3 Q 23 -8 28 -5 Q 33 -2 38 -7" fill="none" stroke="#F6AD55" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -17 3 Q -22 8 -27 5 Q -32 2 -37 7" fill="none" stroke="#F6AD55" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Scale indicator brackets / scientific framing -->
  <path d="M 68 105 L 64 105 L 64 120" fill="none" stroke="#4A5568" stroke-width="1.5"/>
  <path d="M 172 105 L 176 105 L 176 120" fill="none" stroke="#4A5568" stroke-width="1.5"/>
  <path d="M 68 155 L 64 155 L 64 140" fill="none" stroke="#4A5568" stroke-width="1.5"/>
  <path d="M 172 155 L 176 155 L 176 140" fill="none" stroke="#4A5568" stroke-width="1.5"/>

  <!-- Magnification pointer/indicator -->
  <circle cx="152" cy="98" r="4" fill="#3182CE"/>
  <path d="M 152 98 L 168 82" stroke="#3182CE" stroke-width="1.5"/>
  <circle cx="168" cy="82" r="2" fill="#3182CE"/>
</svg>