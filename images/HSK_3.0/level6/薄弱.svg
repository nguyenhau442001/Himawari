<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The Character -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-30 40 Q-30 0 0 0 Q30 0 30 40 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#fde68a"/>
    <!-- Frustrated Expression -->
    <path d="M-10 -25 L-5 -20 M5 -25 L10 -20" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 -10 Q0 -5 8 -10" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>

  <!-- The "Weak Foundation" metaphor: Toppling books -->
  <g transform="translate(60, 160)">
    <rect x="0" y="-80" width="40" height="15" rx="2" fill="#fb923c"/>
    <rect x="5" y="-65" width="30" height="15" rx="2" fill="#fb923c"/>
    <rect x="10" y="-50" width="20" height="15" rx="2" fill="#fb923c"/>
    <!-- The leaning effect -->
    <rect x="15" y="-35" width="10" height="35" rx="2" fill="#ec4899" transform="rotate(-20 20 -35)"/>
  </g>

  <!-- Floating Academic Icons (Abstracted as simple shapes) -->
  <circle cx="180" cy="60" r="8" fill="#38bdf8" opacity="0.6"/>
  <rect x="170" y="80" width="20" height="4" rx="2" fill="#10b981" opacity="0.6"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" opacity="0.2"/>
</svg>