<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Musical Soundwave / Aura effect -->
  <path d="M40 120 Q 70 80, 120 120 T 200 120" fill="none" stroke="#2D3340" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 140 Q 90 100, 120 140 T 180 140" fill="none" stroke="#2D3340" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing Sound Burst / Awe Element -->
  <g fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M120 45 L120 30"/>
    <path d="M165 60 L177 48"/>
    <path d="M75 60 L63 48"/>
    <circle cx="120" cy="40" r="2" fill="#F59E0B"/>
  </g>

  <!-- Grand Piano Body (Perspective) -->
  <path d="M 60 130 L 180 130 L 195 185 L 45 185 Z" fill="#2E384D"/>
  <path d="M 50 130 L 190 130 L 185 120 L 55 120 Z" fill="#3B4659"/>
  <!-- Piano Keyboard Area -->
  <rect x="65" y="133" width="110" height="22" fill="#FFFFFF" rx="2"/>
  <!-- Black Keys Pattern -->
  <rect x="75" y="133" width="6" height="14" fill="#1A1D24"/>
  <rect x="88" y="133" width="6" height="14" fill="#1A1D24"/>
  <rect x="110" y="133" width="6" height="14" fill="#1A1D24"/>
  <rect x="123" y="133" width="6" height="14" fill="#1A1D24"/>
  <rect x="136" y="133" width="6" height="14" fill="#1A1D24"/>
  <rect x="158" y="133" width="6" height="14" fill="#1A1D24"/>
  
  <!-- Piano Legs -->
  <rect x="58" y="185" width="8" height="30" fill="#1F2937"/>
  <rect x="174" y="185" width="8" height="30" fill="#1F2937"/>

  <!-- Prodigy Character (Child at Piano) -->
  <!-- Torso & Head -->
  <circle cx="120" cy="92" r="16" fill="#F6AD55"/>
  <!-- Hair -->
  <path d="M 104 90 C 104 76, 136 76, 136 90 C 130 84, 110 84, 104 90 Z" fill="#4A5568"/>
  <path d="M 112 108 L 128 108 L 132 135 L 108 135 Z" fill="#3182CE"/>

  <!-- Small Arms Reaching Energetically for Keys -->
  <path d="M 112 115 L 90 132" stroke="#F6AD55" stroke-width="5" stroke-linecap="round"/>
  <path d="M 128 115 L 150 132" stroke="#F6AD55" stroke-width="5" stroke-linecap="round"/>

  <!-- Spark / Talent Aura Effect (Gold Accent) -->
  <path d="M 120 20 L 124 32 L 136 36 L 124 40 L 120 52 L 116 40 L 104 36 L 116 32 Z" fill="#F59E0B"/>
  <path d="M 90 40 L 92 46 L 98 48 L 92 50 L 90 56 L 88 50 L 82 48 L 88 46 Z" fill="#F59E0B" opacity="0.7"/>
  <path d="M 150 40 L 152 46 L 158 48 L 152 50 L 150 56 L 148 50 L 142 48 L 148 46 Z" fill="#F59E0B" opacity="0.7"/>

</svg>