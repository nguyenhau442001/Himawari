<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Scale base -->
    <path d="M-15 65 L15 65 L20 75 L-20 75 Z" fill="#4A5568"/>
    <rect x="-4" y="25" width="8" height="42" fill="#718096" rx="2"/>
    <circle cx="0" cy="25" r="8" fill="#E2E8F0"/>

    <!-- Beam & Pivot -->
    <path d="M-65 20 L65 20 L60 28 L-60 28 Z" fill="#E2E8F0"/>
    <circle cx="0" cy="24" r="6" fill="#F6AD55"/>

    <!-- Left Pan (Emotion/Chaos - represented by dynamic abstract sparks inside container, but strictly physical object: a tilted bowl with glowing dynamic fragments) -->
    <line x1="-60" y1="24" x2="-75" y2="70" stroke="#CBD5E0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-60" y1="24" x2="-45" y2="70" stroke="#CBD5E0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-85 70 C-85 85 -45 85 -45 70 Z" fill="#2D3748" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Disturbed element -->
    <circle cx="-65" cy="72" r="4" fill="#FC8181"/>
    <circle cx="-55" cy="76" r="3" fill="#F6AD55"/>
    <circle cx="-72" cy="78" r="3.5" fill="#FAF089"/>
    <path d="M-78 63 Q-65 52 -52 63" fill="none" stroke="#FC8181" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Pan (Reason/Order - represented by a calm, structured geometric stack, perfectly balanced) -->
    <line x1="60" y1="24" x2="45" y2="70" stroke="#CBD5E0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="24" x2="75" y2="70" stroke="#CBD5E0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M35 70 C35 85 75 85 75 70 Z" fill="#2D3748" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Ordered element: neatly stacked clean blocks -->
    <rect x="50" y="66" width="20" height="6" fill="#63B3ED" rx="1"/>
    <rect x="53" y="58" width="14" height="6" fill="#4FD1C5" rx="1"/>
    <rect x="56" y="50" width="8" height="6" fill="#68D391" rx="1"/>

    <!-- Central Brain/Mind Core Symbol (Physical Object Representation: A sleek, glowing metallic silhouette of a human profile with organized gear/light inside) -->
    <path d="M0 -55 C-30 -55 -45 -35 -45 -10 C-45 10 -30 20 -20 25 L-20 35 L20 35 L20 25 C30 20 45 10 45 -10 C45 -35 30 -55 0 -55 Z" fill="#2A4365" stroke="#63B3ED" stroke-width="2"/>
    
    <!-- Clear internal structure representing clarity and logic -->
    <circle cx="0" cy="-20" r="14" fill="#1A202C" stroke="#F6AD55" stroke-width="2"/>
    <path d="M0 -28 L0 -12 M-8 -20 L8 -20" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="4" fill="#F6AD55"/>

    <!-- Balanced accent markers -->
    <path d="M-15 10 L15 10" stroke="#48BB78" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>