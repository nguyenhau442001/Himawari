<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Environment - Night Outdoor / Park / City Exploration Theme (GPS / Navigation / Positioning concept) -->
  <circle cx="120" cy="120" r="95" fill="#1e293b" opacity="0.6"/>
  
  <!-- Subtle Grid lines / Radar rings for "Positioning" (方位) concept -->
  <circle cx="120" cy="130" r="70" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="130" r="45" fill="none" stroke="#334155" stroke-width="1" opacity="0.7"/>
  <line x1="120" y1="55" x2="120" y2="205" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="45" y1="130" x2="195" y2="130" stroke="#334155" stroke-width="1" opacity="0.5"/>
  
  <!-- Ground / Pathway -->
  <path d="M 40 210 Q 120 180 200 210 L 220 240 L 20 240 Z" fill="#334155" opacity="0.8"/>
  
  <!-- Distant stylized trees / buildings -->
  <path d="M 30 170 L 45 130 L 60 170 Z" fill="#475569" opacity="0.5"/>
  <path d="M 180 165 L 195 125 L 210 165 Z" fill="#475569" opacity="0.5"/>
  
  <!-- Glowing Destination Pin / Compass Accent (Indicating 'Direction/Location') -->
  <g transform="translate(120, 85)">
    <ellipse cx="0" cy="40" rx="12" ry="4" fill="#000000" opacity="0.3"/>
    <!-- Pin body -->
    <path d="M 0 0 C -8 0 -14 6 -14 14 C -14 24 0 38 0 38 C 0 38 14 24 14 14 C 14 6 8 0 0 0 Z" fill="#f43f5e"/>
    <circle cx="0" cy="13" r="5" fill="#ffffff"/>
  </g>

  <!-- Pulsing Directional Waves -->
  <path d="M 102 75 A 25 25 0 0 1 138 75" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 94 65 A 35 35 0 0 1 146 65" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Character (Hiker / Traveler trying to locate position) -->
  <g transform="translate(120, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="72" rx="18" ry="6" fill="#000000" opacity="0.4"/>
    
    <!-- Legs -->
    <rect x="-8" y="45" width="6" height="30" rx="3" fill="#334155"/>
    <rect x="2" y="45" width="6" height="30" rx="3" fill="#1e293b"/>
    <path d="M -11 73 L -7 73 L -7 77 L -11 77 Z" fill="#0f172a"/>
    <path d="M 5 73 L 9 73 L 9 77 L 5 77 Z" fill="#0f172a"/>

    <!-- Body / Jacket -->
    <path d="M -14 15 L 14 15 L 18 48 L -18 48 Z" fill="#38bdf8"/>
    <!-- Backpack -->
    <path d="M -17 18 L -10 18 L -10 42 L -17 42 Z" fill="#fb923c" rx="3"/>

    <!-- Head -->
    <circle cx="0" cy="3" r="12" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M -11 -2 C -5 -8 5 -8 11 -2 C 12 3 10 3 8 1 C 4 -3 -4 -3 -8 1 C -10 3 -11 1 -11 -2 Z" fill="#1e293b"/>
    <!-- Cap -->
    <path d="M -13 0 C -13 -6 13 -6 13 0 L 16 2 L -15 2 Z" fill="#fbbf24"/>

    <!-- Arms & Smartphone/Compass interaction -->
    <!-- Left Arm holding map/phone -->
    <path d="M -14 20 L -25 35 L -18 40" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Arm pointing up towards the pin/direction -->
    <path d="M 14 20 L 25 5 L 28 -2" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand pointing -->
    <circle cx="29" cy="-5" r="3.5" fill="#fed7aa"/>

    <!-- Smartphone / Device emitting UI glow -->
    <g transform="translate(-28, 38) rotate(-15)">
      <rect x="0" y="0" width="14" height="20" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="7" cy="8" r="4" fill="#10b981"/>
      <path d="M 7 5 L 7 11 M 4 8 L 10 8" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>

  <!-- Ambient lighting effects -->
  <circle cx="120" cy="75" r="30" fill="#fbbf24" opacity="0.15" filter="blur(8px)"/>
  <circle cx="90" cy="170" r="25" fill="#38bdf8" opacity="0.1" filter="blur(10px)"/>
</svg>