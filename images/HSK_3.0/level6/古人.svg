<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ancient Scholar Figure -->
  <g transform="translate(120, 120)">
    <!-- Robe -->
    <path d="M-40 20 C-40 60, -20 90, 0 90 C20 90, 40 60, 40 20 L20 20 L0 0 L-20 20 Z" fill="#34495E"/>
    <path d="M-40 20 L-50 40 L-30 50 L-20 20 Z" fill="#2C3E50"/>
    <path d="M40 20 L50 40 L30 50 L20 20 Z" fill="#2C3E50"/>
    
    <!-- Head and Hat -->
    <circle cx="0" cy="-20" r="25" fill="#F39C12"/>
    <path d="M-30 -35 L30 -35 L25 -50 L-25 -50 Z" fill="#D35400"/>
    <path d="M-10 -50 L-10 -60 L10 -60 L10 -50 Z" fill="#D35400"/>
    
    <!-- Facial Features -->
    <path d="M-10 -20 L-5 -20 M5 -20 L10 -20" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 -10 Q0 -5 5 -10" stroke="#1A1D24" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Scroll -->
    <rect x="-15" y="30" width="30" height="45" rx="2" fill="#E67E22"/>
    <rect x="-17" y="32" width="34" height="5" rx="1" fill="#D35400"/>
    <rect x="-17" y="68" width="34" height="5" rx="1" fill="#D35400"/>
    <path d="M-12 35 L12 35 M-12 40 L12 40 M-12 45 L12 45 M-12 50 L12 50 M-12 55 L12 55 M-12 60 L12 60 M-12 65 L12 65" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
  </g>
</svg>