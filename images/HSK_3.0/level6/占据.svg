<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle grid/market platform floor to ground the object -->
  <path d="M 60 185 L 180 185 L 205 210 L 35 210 Z" fill="#252A34" opacity="0.8"/>
  <ellipse cx="120" cy="185" rx="60" ry="12" fill="#2E3544"/>

  <!-- Glowing focal marker / crown platform representing "领先地位" (Leading Position) -->
  <ellipse cx="120" cy="140" rx="40" ry="16" fill="#00D2FF" opacity="0.15"/>
  <ellipse cx="120" cy="140" rx="28" ry="11" fill="#00D2FF" opacity="0.25"/>

  <!-- Central iconic physical object: A majestic golden crown resting firmly and occupying the center -->
  <!-- Crown Base -->
  <path d="M 92 140 L 148 140 L 154 150 L 86 150 Z" fill="#FFB800"/>
  <rect x="89" y="146" width="62" height="4" rx="2" fill="#FFE169"/>

  <!-- Crown Body -->
  <path d="M 88 140 L 95 105 L 120 125 L 145 105 L 152 140 Z" fill="#FF9F0A"/>

  <!-- Crown Jewels / Highlights -->
  <circle cx="120" cy="115" r="4" fill="#FFFFFF"/>
  <circle cx="95" cy="105" r="4" fill="#FF4D4F"/>
  <circle cx="145" cy="105" r="4" fill="#FF4D4F"/>
  <circle cx="120" cy="140" r="3" fill="#FFE169"/>
  <circle cx="102" cy="140" r="2.5" fill="#FFE169"/>
  <circle cx="138" cy="140" r="2.5" fill="#FFE169"/>

  <!-- Dominant Territory / Capture Markers (Showing "占据" - occupation/seizing the top space) -->
  <path d="M 120 75 L 128 95 L 112 95 Z" fill="#FFB800"/>
  <circle cx="120" cy="70" r="3" fill="#FF4D4F"/>

  <!-- Dynamic outward control/expansion rings representing full occupation of the market -->
  <circle cx="120" cy="140" rx="55" ry="22" fill="none" stroke="#00D2FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="120" cy="140" rx="72" ry="28" fill="none" stroke="#FFB800" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Focus directional arrows pointing inward/downward, solidifying the claim ("占据") -->
  <path d="M 65 110 L 75 118 L 72 108 Z" fill="#00D2FF"/>
  <path d="M 175 110 L 165 118 L 168 108 Z" fill="#00D2FF"/>
  <line x1="70" y1="113" x2="90" y2="125" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="113" x2="150" y2="125" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
</svg>