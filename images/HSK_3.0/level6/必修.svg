<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Modern academic/structured feel) -->
  <path d="M40 70 L200 70" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M40 170 L200 170" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Open Book / Curriculum Symbol (Object of action) -->
  <path d="M70 95 C90 85, 120 95, 120 120 L120 175 C120 175, 95 165, 70 175 Z" fill="#2E3544"/>
  <path d="M170 95 C150 85, 120 95, 120 120 L120 175 C120 175, 145 165, 170 175 Z" fill="#2E3544"/>
  <path d="M120 120 L120 175" stroke="#1A1D24" stroke-width="3"/>
  <!-- Book pages accent -->
  <path d="M80 105 C95 98, 112 105, 118 115" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M160 105 C145 98, 128 105, 122 115" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Dynamic Human Character Action (Verb / Mandatory requirement interaction) -->
  <!-- Reaching / Placing hand firmly on the required subject (Action: Required/Commitment) -->
  
  <!-- Arm & Hand interacting with the book -->
  <path d="M35 130 C60 125, 90 135, 105 142" stroke="#E2E8F0" stroke-width="14" stroke-linecap="round" fill="none"/>
  
  <!-- Focus / Mandatory Indicator (Gold/Orange accent highlighting the core action) -->
  <circle cx="120" cy="120" r="45" fill="none" stroke="#F6AD55" stroke-width="4" stroke-dasharray="6 6" opacity="0.8"/>
  <circle cx="120" cy="120" r="55" fill="none" stroke="#ED8936" stroke-width="2" opacity="0.4"/>

  <!-- Motion lines emphasizing deliberate, required action -->
  <path d="M50 110 L65 118" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 125 L55 131" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>

  <!-- Character Head / Upper torso element entering from the left -->
  <circle cx="35" cy="115" r="16" fill="#CBD5E0"/>
  <path d="M20 155 C20 135, 30 135, 45 135 C60 135, 65 145, 65 155 Z" fill="#CBD5E0"/>

  <!-- Checkmark badge denoting requirement fulfillment / mandatory status -->
  <circle cx="185" cy="75" r="18" fill="#2B6CB0"/>
  <path d="M176 75 L182 81 L195 67" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>