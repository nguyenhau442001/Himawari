<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Subtle Elements -->
  <circle cx="120" cy="115" r="70" fill="#2D3342" opacity="0.4"/>
  
  <!-- Sound Waves / Listening Action Lines (Orange/Gold accent) -->
  <path d="M 68 85 C 55 95 55 125 68 135" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 56 72 C 38 90 38 130 56 148" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 172 85 C 185 95 185 125 172 135" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Document / Report (The "Report" being listened to/considered) -->
  <g transform="translate(138, 90)">
    <!-- Paper background -->
    <rect x="0" y="0" width="46" height="60" rx="4" fill="#E2E8F0"/>
    <!-- Folded corner -->
    <path d="M 34 0 L 46 12 L 46 60 L 0 60 L 0 0 Z" fill="#CBD5E1"/>
    <path d="M 34 0 L 34 12 L 46 12 Z" fill="#94A3B8"/>
    <!-- Document lines -->
    <rect x="8" y="12" width="22" height="4" rx="2" fill="#64748B"/>
    <rect x="8" y="24" width="30" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="8" y="32" width="24" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="8" y="40" width="28" height="3" rx="1.5" fill="#94A3B8"/>
    <!-- Accent check mark / suggestion highlight -->
    <circle cx="33" cy="48" r="8" fill="#F59E0B"/>
    <path d="M 29.5 48 L 32 50.5 L 37 45.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Modern Professional / Leader (Listening attentively) -->
  <g transform="translate(60, 75)">
    <!-- Torso / Suit jacket -->
    <path d="M 30 90 L 15 125 L 65 125 L 50 90 Z" fill="#3B82F6"/>
    <!-- Shirt inner -->
    <polygon points="40,90 30,110 50,110" fill="#F8FAFC"/>
    <!-- Tie -->
    <polygon points="38,92 42,92 44,108 40,114 36,108" fill="#F59E0B"/>
    
    <!-- Neck -->
    <rect x="34" y="74" width="12" height="18" fill="#E2B291"/>
    
    <!-- Head -->
    <circle cx="40" cy="54" r="22" fill="#E2B291"/>
    
    <!-- Hair (Modern sleek dark hair) -->
    <path d="M 20 54 C 20 38 30 32 42 32 C 54 32 60 42 60 52 C 60 52 56 42 42 40 C 28 38 22 48 20 54 Z" fill="#1E293B"/>
    
    <!-- Ear (Attentive, emphasized for listening) -->
    <path d="M 59 50 C 64 50 64 60 59 60" stroke="#E2B291" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Facial profile / Eye looking attentively towards the report -->
    <circle cx="51" cy="52" r="2" fill="#1E293B"/>
    <!-- Focused eyebrow -->
    <path d="M 47 47 C 51 46 54 48 55 49" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Calm, receptive mouth line -->
    <path d="M 49 62 C 52 63 53 63 55 61" stroke="#C28E69" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sound wave / Communication bridge from report to ear -->
  <path d="M 125 105 C 110 95 95 90 85 90" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" fill="none"/>

  <!-- Base platform line for grounded, professional feel -->
  <rect x="60" y="202" width="120" height="4" rx="2" fill="#334155"/>
</svg>