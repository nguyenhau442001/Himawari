<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Design for "材质" (Material/Texture) -->
  <!-- Contextual reference: High-end solid wood chair material -->
  
  <g transform="translate(0, 0)">
    <!-- Polished wood grain pattern layers (Background reference card/swatch) -->
    <rect x="50" y="45" width="140" height="150" rx="12" fill="#262C38" stroke="#3A4456" stroke-width="2"/>
    
    <!-- Material Swatch / Cross-section Disk representing Wood -->
    <g transform="translate(120, 105)">
      <!-- Outer shadow/depth -->
      <circle cx="0" cy="4" r="52" fill="#111318"/>
      <!-- Wood base color -->
      <circle cx="0" cy="0" r="52" fill="#D97736"/>
      
      <!-- Wood rings and grain structure -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#C25E22" stroke-width="4" opacity="0.8"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#B04F18" stroke-width="3" opacity="0.7"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#A03F10" stroke-width="2" opacity="0.8"/>
      <ellipse cx="-8" cy="-5" rx="6" ry="4" fill="#E68A4C" opacity="0.6"/>

      <!-- Highlight for polished surface -->
      <path d="M-36 -24 C -20 -38, 20 -38, 36 -24" fill="none" stroke="#FFA96B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Mini Chair Icon representing the Contextual Object (Solid Wood Chair) -->
    <g transform="translate(120, 168)">
      <!-- Chair Backrest -->
      <rect x="-14" y="-36" width="28" height="22" rx="4" fill="#E68A4C" stroke="#1A1D24" stroke-width="2"/>
      <line x1="-8" y1="-30" x2="8" y2="-30" stroke="#B04F18" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="-22" x2="8" y2="-22" stroke="#B04F18" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Chair Seat -->
      <rect x="-18" y="-12" width="36" height="8" rx="2" fill="#F49552" stroke="#1A1D24" stroke-width="2"/>
      
      <!-- Chair Legs -->
      <line x1="-12" y1="-4" x2="-16" y2="16" stroke="#C25E22" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="-4" x2="16" y2="16" stroke="#C25E22" stroke-width="3" stroke-linecap="round"/>
      <line x1="-6" y1="-4" x2="-4" y2="14" stroke="#A03F10" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="6" y1="-4" x2="4" y2="14" stroke="#A03F10" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Sleek Magnifying Glass / Texture Inspector -->
    <g transform="translate(85, 85)">
      <!-- Glass Ring & Lens -->
      <circle cx="0" cy="0" r="28" fill="#1A1D24" fill-opacity="0.3" stroke="#4DA3FF" stroke-width="4"/>
      <!-- Handle -->
      <path d="M18 18 L36 36" stroke="#4DA3FF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="3" fill="#4DA3FF"/>
    </g>

    <!-- Focus/Accent detail: Gold/Orange glowing particle dots for modern design language -->
    <circle cx="172" cy="70" r="4" fill="#FFA96B"/>
    <circle cx="68" cy="140" r="3" fill="#4DA3FF"/>
  </g>
</svg>