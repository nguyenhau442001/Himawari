<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Podium Glass Gradient -->
    <linearGradient id="podiumGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Warm Amber Glow for Spotlight -->
    <radialGradient id="amberGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting Layer -->
  <circle cx="120" cy="80" r="120" fill="url(#amberGlow)"/>

  <!-- ARCHITECTURAL BACKGROUND (Government/Public Hall Interior) -->
  <!-- Back Wall & Pillars -->
  <rect x="20" y="30" width="200" height="150" fill="#1e293b" rx="4"/>
  
  <!-- Large Arched Windows in Background -->
  <path d="M 70,40 L 70,110 A 25,25 0 0,1 120,110 L 120,40 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M 135,40 L 135,110 A 25,25 0 0,1 185,110 L 185,40 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Light Beams from Windows -->
  <polygon points="70,40 120,40 140,180 50,180" fill="url(#lightBeam)"/>

  <!-- Floor -->
  <polygon points="0,180 240,180 240,240 0,240" fill="#090d16"/>
  <!-- Floor reflection/lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="240" x2="100" y2="180" stroke="#1e293b" stroke-width="2"/>
  <line x1="200" y1="240" x2="160" y2="180" stroke="#1e293b" stroke-width="2"/>

  <!-- GOVERNMENT OFFICIAL (On Stage / Behind Podium) -->
  <g id="official">
    <!-- Official Body/Suit -->
    <path d="M 105,145 L 135,145 L 140,180 L 100,180 Z" fill="#0284c7"/>
    <!-- Shirt & Tie -->
    <polygon points="120,145 125,165 115,165" fill="#f8fafc"/>
    <polygon points="120,150 122,175 120,178 118,175" fill="#ef4444"/>
    <!-- Official Head & Hair -->
    <circle cx="120" cy="122" r="14" fill="#fbcfe8"/>
    <path d="M 106,120 C 106,110 134,110 134,120 C 134,124 126,122 120,122 C 114,122 106,124 106,120 Z" fill="#334155"/>
    <!-- Nervous/Sweat Detail -->
    <path d="M 129,118 Q 132,120 130,123" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- OFFICIAL PODIUM -->
  <path d="M 100,155 L 140,155 L 145,185 L 95,185 Z" fill="url(#podiumGlass)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="105" y="162" width="30" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>

  <!-- THE PUBLIC / CITIZEN OVERVIEW (Foreground Observer - "Supervising") -->
  <!-- Citizen (Active Observer in Foreground Right) -->
  <g id="citizen-observer" transform="translate(30, 20)">
    <!-- Body/Hoodie -->
    <path d="M 35,160 Q 35,135 55,135 Q 75,135 75,160 L 85,210 L 25,210 Z" fill="#10b981"/>
    <!-- Raised Arm pointing/scrutinizing -->
    <path d="M 65,140 L 95,120 L 100,125 L 75,150 Z" fill="#10b981"/>
    <!-- Hand -->
    <circle cx="98" cy="122" r="5" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="55" cy="115" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 41,113 C 41,100 69,100 69,113 C 65,107 45,107 41,113 Z" fill="#0f172a"/>
    <!-- Focused Eye / Glasses -->
    <circle cx="61" cy="115" r="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="57" y1="115" x2="52" y2="115" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- SECOND CITIZEN (Left Foreground - Group representation for "Public") -->
  <g id="citizen-group" transform="translate(-10, 35)">
    <!-- Body -->
    <path d="M 30,150 Q 30,130 45,130 Q 60,130 60,150 L 65,195 L 25,195 Z" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="45" cy="112" r="12" fill="#fbcfe8"/>
    <!-- Hair (Ponytail) -->
    <path d="M 33,110 C 33,102 57,102 57,110 Z" fill="#78350f"/>
    <circle cx="58" cy="108" r="4" fill="#78350f"/>
    <!-- Tablet / Document prop being held, symbolizing checking facts/transparency -->
    <rect x="35" y="130" width="22" height="30" rx="3" fill="#f8fafc" transform="rotate(-15 35 130)"/>
    <line x1="40" y1="138" x2="50" y2="138" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="144" x2="52" y2="144" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="150" x2="46" y2="150" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- MAGNIFYING / SCRUTINY VISUAL CUE (Subtle UI/Vector element representing oversight/supervision) -->
  <g transform="translate(115, 85)">
    <!-- Lens Ring -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
    <!-- Lens Glass Reflection -->
    <path d="M -10,-10 Q 0,-15 10,-10" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Handle -->
    <line x1="12" y1="12" x2="25" y2="25" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Focus Reticle inside lens -->
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- VIGNETTE / FRAME ACCENT -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>