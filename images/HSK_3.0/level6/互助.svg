<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment: Classroom / Study Room -->
  <!-- Window with night sky / warm ambient glow -->
  <path d="M175 30 H215 V110 H175 Z" fill="#0f172a" stroke="#334155" stroke-width="3" rx="4"/>
  <path d="M185 45 A 8 8 0 0 1 205 45" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="195" cy="80" r="2" fill="#cbd5e1" opacity="0.8"/>
  <circle cx="205" cy="65" r="1.5" fill="#cbd5e1" opacity="0.5"/>
  <circle cx="183" cy="95" r="1.5" fill="#cbd5e1" opacity="0.6"/>

  <!-- Bookshelf in background -->
  <rect x="20" y="35" width="50" height="85" fill="#1e293b" rx="2"/>
  <line x1="20" y1="65" x2="70" y2="65" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="95" x2="70" y2="95" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <path d="M26 65 V45 H33 V65 Z" fill="#38bdf8" opacity="0.7"/>
  <path d="M35 65 V50 H42 V65 Z" fill="#ec4899" opacity="0.7"/>
  <path d="M48 65 V42 H56 V65 Z" fill="#10b981" opacity="0.7"/>
  <path d="M25 95 V75 H31 V95 Z" fill="#fb923c" opacity="0.7"/>
  <path d="M55 95 V70 H63 V95 Z" fill="#38bdf8" opacity="0.5"/>

  <!-- Warm ambient study lamp light cone -->
  <polygon points="120,0 20,200 220,200" fill="url(#warmLight)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Hanging Lamp -->
  <line x1="120" y1="0" x2="120" y2="30" stroke="#64748b" stroke-width="2"/>
  <path d="M105 30 H135 L140 40 H100 Z" fill="#f59e0b"/>
  <circle cx="120" cy="40" r="12" fill="#fbbf24" filter="url(#glow)" opacity="0.9"/>

  <!-- Study Desk -->
  <rect x="15" y="165" width="210" height="60" rx="4" fill="url(#deskGrad)"/>
  <rect x="15" y="160" width="210" height="8" rx="2" fill="#475569"/>

  <!-- Desk Props: Laptop, Open Notebook, Pens -->
  <!-- Laptop -->
  <path d="M135 150 H185 V160 H135 Z" fill="#94a3b8" rx="2"/>
  <path d="M130 160 H190 V163 H130 Z" fill="#64748b" rx="1"/>
  <path d="M140 120 H180 V150 H140 Z" fill="#cbd5e1" rx="2"/>
  <path d="M144 125 H176 V145 H144 Z" fill="#38bdf8" opacity="0.2"/>

  <!-- Open Notebook in Center -->
  <path d="M90 145 Q120 135 150 145 L150 165 Q120 155 90 165 Z" fill="#f8fafc"/>
  <line x1="120" y1="140" x2="120" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="98" y1="150" x2="112" y2="152" stroke="#94a3b8" stroke-width="1"/>
  <line x1="98" y1="155" x2="110" y2="157" stroke="#94a3b8" stroke-width="1"/>
  <line x1="128" y1="150" x2="142" y2="148" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="128" y1="155" x2="140" y2="153" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Coffee Mug -->
  <rect x="65" y="145" width="14" height="18" rx="3" fill="#ec4899"/>
  <path d="M79 150 C84 150 84 158 79 158" stroke="#ec4899" stroke-width="2" fill="none"/>

  <!-- CHARACTER 1: Student Left (Explaining / Pointing with a pencil) -->
  <!-- Body / Torso -->
  <path d="M55 185 C55 160 75 155 85 155 C95 155 110 160 115 185 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="85" cy="125" r="18" fill="#ffedd5"/>
  <!-- Hair (Dark modern crop) -->
  <path d="M68 123 C68 110 80 105 92 108 C102 110 103 122 103 122 C103 122 96 114 85 115 C74 116 68 123 68 123 Z" fill="#1e293b"/>
  <!-- Face expression: Warm smile, engaged -->
  <circle cx="92" cy="125" r="1.5" fill="#1e293b"/>
  <path d="M90 132 Q93 136 96 132" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Arm pointing to notebook -->
  <path d="M70 165 Q85 160 100 148" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="102" cy="147" r="5" fill="#ffedd5"/>
  <!-- Pencil in hand -->
  <line x1="102" y1="147" x2="114" y2="137" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <polygon points="114,137 118,133 115,139" fill="#1e293b"/>

  <!-- CHARACTER 2: Student Right (Listening attentively, taking notes / leaning in) -->
  <!-- Body / Torso -->
  <path d="M125 185 C130 160 145 155 155 155 C165 155 185 160 190 185 Z" fill="#10b981"/>
  <!-- Head -->
  <circle cx="155" cy="122" r="18" fill="#ffedd5"/>
  <!-- Hair (Warm brown messy/curly style) -->
  <path d="M138 120 C138 105 155 102 168 108 C175 111 174 125 174 125 C174 125 168 114 156 114 C145 114 138 120 138 120 Z" fill="#78350f"/>
  <!-- Face expression: Curious, happy realization -->
  <circle cx="152" cy="122" r="1.5" fill="#1e293b"/>
  <circle cx="160" cy="122" r="1.5" fill="#1e293b"/>
  <path d="M154 129 Q156 133 159 129" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Arm resting on desk holding a pen -->
  <path d="M145 168 Q135 155 125 148" stroke="#10b981" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="123" cy="147" r="5" fill="#ffedd5"/>
  <!-- Pen in hand -->
  <line x1="123" y1="147" x2="115" y2="157" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Mutual Cooperation Spark (Floating glowing accent symbolizing 'hùzhù' / teamwork) -->
  <g transform="translate(120, 105)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2" filter="url(#glow)"/>
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fbbf24"/>
    <path d="M8 -10 L9 -6 L13 -5 L9 -4 L8 0 L7 -4 L3 -5 L7 -6 Z" fill="#38bdf8"/>
    <path d="M-9 6 L-8 9 L-5 10 L-8 11 L-9 14 L-10 11 L-13 10 L-10 9 Z" fill="#10b981"/>
  </g>

</svg>