<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glowing aura for autumnal atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#FF8C00" opacity="0.08"/>

  <!-- Viewing Frame / Traditional Window silhouette (representing '观赏' - contemplating/admiring scenery) -->
  <path d="M70 50 L170 50 A10 10 0 0 1 180 60 L180 170 A10 10 0 0 1 170 180 L70 180 A10 10 0 0 1 60 170 L60 60 A10 10 0 0 1 70 50 Z" fill="#252A34" stroke="#3A4252" stroke-width="3"/>
  
  <!-- Window Sill -->
  <rect x="52" y="178" width="136" height="8" rx="3" fill="#2F3644"/>

  <!-- Autumn Maple Tree Branch & Vibrant Red Leaves (Subject of admiration: 红叶) -->
  <path d="M60 75 Q90 65 120 85 T180 70" fill="none" stroke="#5C4033" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Glowing Red/Orange Autumn Leaves -->
  <!-- Leaf 1 -->
  <path d="M100 80 C105 70 115 72 110 82 C115 88 108 95 100 90 C92 95 85 88 90 82 C85 72 95 70 100 80 Z" fill="#FF4757"/>
  <!-- Leaf 2 -->
  <path d="M135 65 C140 55 150 57 145 67 C150 73 143 80 135 75 C127 80 120 73 125 67 C120 57 130 55 135 65 Z" fill="#FF6B35"/>
  <!-- Leaf 3 (Falling/Floating) -->
  <path d="M80 115 C83 108 90 110 87 118 C91 123 85 128 80 124 C75 128 69 123 73 118 C70 110 77 108 80 115 Z" fill="#FFA502" transform="rotate(25 80 118)"/>
  <!-- Leaf 4 -->
  <path d="M155 95 C160 85 170 87 165 97 C170 103 163 110 155 105 C147 110 140 103 145 97 C140 87 150 85 155 95 Z" fill="#FF4757"/>

  <!-- Distant Mountain/Scenery backdrop inside window -->
  <path d="M60 140 L90 105 L120 130 L150 110 L180 145 L180 170 L60 170 Z" fill="#1E232E"/>
  <path d="M90 105 L120 130 L150 110 L180 145 L180 170 L60 170 L60 140 Z" fill="#222733" opacity="0.5"/>

  <!-- Binoculars / Magnifying Focus Element representing the act of close observation/admiration -->
  <g transform="translate(120, 160)">
    <!-- Sleek modern viewfinder element overlay -->
    <path d="M-45 -25 L-25 -25 C-20 -25 -15 -20 -15 -15 L-15 15 C-15 20 -20 25 -25 25 L-45 25 C-50 25 -55 20 -55 15 L-55 -15 C-55 -20 -50 -25 -45 -25 Z" fill="#FF8C00" opacity="0.9"/>
    <circle cx="-35" cy="0" r="8" fill="#1A1D24"/>
    
    <path d="M25 -25 L45 -25 C50 -25 55 -20 55 -15 L55 15 C55 20 50 25 45 25 L25 25 C20 25 15 20 15 15 L15 -15 C15 -20 20 -25 25 -25 Z" fill="#FF8C00" opacity="0.9"/>
    <circle cx="35" cy="0" r="8" fill="#1A1D24"/>
    
    <!-- Connecting bridge -->
    <rect x="-15" y="-5" width="30" height="10" rx="3" fill="#E67E22"/>
  </g>

</svg>