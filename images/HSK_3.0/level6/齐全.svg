<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Shop Lighting Gradient -->
    <radialGradient id="shop-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Shelf Metal Gradient -->
    <linearGradient id="shelf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="wood-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#shop-glow)" />

  <!-- SHOP INTERIOR BACKGROUND -->
  <!-- Back Wall Paneling / Wallpaper stripes -->
  <line x1="60" y1="30" x2="60" y2="180" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="120" y1="30" x2="120" y2="180" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="180" y1="30" x2="180" y2="180" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />

  <!-- Warm Overhead Ceiling Light Beams -->
  <polygon points="120,20 70,180 170,180" fill="#fbbf24" opacity="0.05" />
  
  <!-- STORE SHELVING SYSTEM (Showing variety: "齐全") -->
  <!-- Top Shelf -->
  <rect x="25" y="70" width="190" height="6" rx="3" fill="url(#shelf-grad)" filter="url(#shadow)" />
  <rect x="25" y="76" width="190" height="2" fill="#0f172a" />

  <!-- Middle Shelf -->
  <rect x="25" y="125" width="190" height="6" rx="3" fill="url(#shelf-grad)" filter="url(#shadow)" />
  <rect x="25" y="131" width="190" height="2" fill="#0f172a" />

  <!-- Bottom Shelf / Counter Base -->
  <rect x="20" y="180" width="200" height="10" rx="4" fill="url(#wood-base)" filter="url(#shadow)" />

  <!-- GOODS & PRODUCTS (Densely stocked to represent "qíquán" - complete variety) -->
  <!-- TOP SHELF ITEMS (Electronics & Gadgets) -->
  <!-- Box 1 -->
  <rect x="35" y="45" width="16" height="25" rx="2" fill="#ec4899" />
  <circle cx="43" cy="53" r="4" fill="#fbcfe8" />
  <!-- Box 2 -->
  <rect x="55" y="40" width="20" height="30" rx="3" fill="#38bdf8" />
  <path d="M60,50 L70,50 M65,45 L65,55" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
  <!-- Round Container/Canister -->
  <rect x="80" y="48" width="14" height="22" rx="2" fill="#10b981" />
  <path d="M80,55 Q87,58 94,55" fill="none" stroke="#d1fae5" stroke-width="2" />
  <!-- Gadget stack -->
  <rect x="100" y="55" width="22" height="15" rx="2" fill="#f59e0b" />
  <rect x="104" y="47" width="14" height="8" rx="1" fill="#fb923c" />
  <!-- Book / Folder Set -->
  <path d="M128,70 L128,48 L142,44 L142,70 Z" fill="#6366f1" />
  <path d="M140,70 L140,44 L152,47 L152,70 Z" fill="#8b5cf6" />
  <path d="M150,70 L150,47 L162,50 L162,70 Z" fill="#a855f7" />
  <!-- More items right -->
  <rect x="170" y="42" width="18" height="28" rx="3" fill="#ef4444" />
  <circle cx="179" cy="52" r="5" fill="#fee2e2" />
  <rect x="193" y="50" width="14" height="20" rx="2" fill="#14b8a6" />

  <!-- MIDDLE SHELF ITEMS (Groceries, bottles, jars, household goods) -->
  <!-- Jars with lids -->
  <path d="M32,125 L32,100 C32,96 36,94 40,94 L46,94 C50,94 54,96 54,100 L54,125 Z" fill="#fbbf24" opacity="0.9" />
  <rect x="39" y="90" width="8" height="4" rx="1" fill="#b45309" />
  
  <path d="M58,125 L58,97 C58,94 61,92 64,92 L70,92 C73,92 76,94 76,97 L76,125 Z" fill="#f43f5e" opacity="0.9" />
  <rect x="63" y="88" width="8" height="4" rx="1" fill="#9f1239" />

  <!-- Bottles (Wine/Juice) -->
  <path d="M85,125 L85,102 L81,96 L81,90 L91,90 L91,96 L87,102 L87,125 Z" fill="#10b981" />
  <path d="M95,125 L95,98 L91,92 L91,87 L101,87 L101,92 L97,98 L97,125 Z" fill="#0284c7" />

  <!-- Boxed goods stack -->
  <rect x="108" y="100" width="24" height="25" rx="2" fill="#a855f7" />
  <circle cx="120" cy="112" r="7" fill="#f3e8ff" />
  
  <rect x="136" y="105" width="18" height="20" rx="2" fill="#f97316" />
  
  <!-- Green plant in pot on shelf -->
  <path d="M162,125 L166,105 L182,105 L186,125 Z" fill="#e2e8f0" />
  <path d="M174,105 C174,90 162,85 160,80 C170,82 178,92 174,105 Z" fill="#22c55e" />
  <path d="M174,105 C178,88 190,85 194,82 C186,86 178,94 174,105 Z" fill="#16a34a" />
  <path d="M174,105 C174,95 168,90 164,88 C170,90 174,96 174,105 Z" fill="#4ade80" />

  <!-- Yellow box -->
  <rect x="192" y="98" width="18" height="27" rx="3" fill="#eab308" />

  <!-- MAIN CHARACTER - SHOPKEEPER / CUSTOMER APPRECIATING THE FULL ASSORTMENT -->
  <g id="character" transform="translate(0, 5)">
    <!-- Character Body / Torso -->
    <path d="M105,175 C105,155 115,145 130,145 C145,145 155,155 155,175 L160,185 L100,185 Z" fill="#0ea5e9" filter="url(#shadow)" />
    <!-- Apron / Vest details -->
    <path d="M112,150 L148,150 L152,185 L108,185 Z" fill="#f8fafc" />
    <circle cx="130" cy="162" r="3" fill="#0ea5e9" />
    <circle cx="130" cy="174" r="3" fill="#0ea5e9" />

    <!-- Neck -->
    <rect x="123" y="134" width="14" height="14" rx="4" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="130" cy="118" r="18" fill="#fcd34d" filter="url(#shadow)" />

    <!-- Hair -->
    <path d="M112,118 C112,104 120,100 130,100 C140,100 148,104 148,118 C148,120 146,114 144,110 C139,104 121,104 116,110 C114,114 112,120 112,118 Z" fill="#334155" />

    <!-- Facial Expression: Amazed, happy, impressed ("齐全" - everything is there!) -->
    <!-- Eyes (Happy arcs) -->
    <path d="M121,116 Q124,112 127,116" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M133,116 Q136,112 139,116" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks (Blush) -->
    <circle cx="120" cy="120" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="140" cy="120" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Open Smile (Delighted) -->
    <path d="M125,124 Q130,132 135,124" fill="#991b1b" />

    <!-- Arms & Gestures -->
    <!-- Left arm pointing / gesturing to shelves -->
    <path d="M107,150 C95,145 80,150 72,140" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" />
    <!-- Left Hand -->
    <circle cx="69" cy="138" r="4" fill="#fcd34d" />

    <!-- Right arm bent in amazement (hand near chin or thumbs up) -->
    <path d="M153,150 C165,148 168,135 162,128" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" />
    <!-- Right Hand -->
    <circle cx="160" cy="124" r="4" fill="#fcd34d" />
  </g>

  <!-- FOREGROUND COUNTER & PROPS -->
  <!-- Checkout Counter Top -->
  <path d="M10,185 L230,185 L230,225 C230,230 226,234 220,234 L20,234 C14,234 10,230 10,225 Z" fill="#334155" />
  <path d="M10,185 L230,185 L230,192 L10,192 Z" fill="#475569" />

  <!-- Cash Register / POS on Counter -->
  <rect x="25" y="165" width="30" height="20" rx="3" fill="#cbd5e1" filter="url(#shadow)" />
  <path d="M30,165 L35,155 L45,155 L50,165 Z" fill="#94a3b8" />
  <rect x="32" y="168" width="16" height="8" rx="1" fill="#0f172a" />
  <!-- Cash drawer -->
  <rect x="27" y="179" width="26" height="4" rx="1" fill="#64748b" />

  <!-- Shopping Basket filled with various goods (showing completed collection ready to buy) -->
  <g transform="translate(170, 175)" filter="url(#shadow)">
    <!-- Basket body -->
    <path d="M5,10 L15,35 C15,38 18,40 22,40 L48,40 C52,40 55,38 55,35 L65,10 Z" fill="#f59e0b" />
    <path d="M3,10 L67,10 L63,6 L7,6 Z" fill="#d97706" />
    <!-- Basket handle -->
    <path d="M15,8 C15,-5 55,-5 55,8" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
    <!-- Items poking out of basket -->
    <circle cx="25" cy="5" r="8" fill="#10b981" />
    <rect x="35" y="-2" width="12" height="12" rx="2" fill="#ef4444" />
    <path d="M48,5 L58,2 L55,12 Z" fill="#3b82f6" />
  </g>

  <!-- Sparkles / Highlight indicators emphasizing "Complete / Comprehensive" variety -->
  <g fill="#fbbf24">
    <!-- Sparkle 1 (Top Left) -->
    <path d="M30,30 Q30,20 20,20 Q30,20 30,10 Q30,20 40,20 Q30,20 30,30" opacity="0.8" />
    <!-- Sparkle 2 (Top Right) -->
    <path d="M210,35 Q210,27 202,27 Q210,27 210,19 Q210,27 218,27 Q210,27 210,35" opacity="0.9" />
    <!-- Sparkle 3 (Near character expression) -->
    <path d="M100,95 Q100,90 95,90 Q100,90 100,85 Q100,90 105,90 Q100,90 100,95" opacity="0.7" />
  </g>

  <!-- Small accent dots floating -->
  <circle cx="50" cy="100" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="190" cy="85" r="2" fill="#ec4899" opacity="0.6" />
  <circle cx="15" cy="150" r="2" fill="#10b981" opacity="0.5" />

</svg>