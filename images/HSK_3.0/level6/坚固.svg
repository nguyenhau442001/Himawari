<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: Airplane Wing Section representing "坚固" (Sturdy/Solid) -->
  <g transform="translate(0, 0)">
    <!-- Structural grid/blueprint subtle background lines representing engineering strength -->
    <path d="M40 180 L200 180" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M40 60 L200 60" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Heavy-duty mounting base -->
    <path d="M80 180 L160 180 L150 160 L90 160 Z" fill="#3B4252"/>
    <rect x="100" y="150" width="40" height="10" fill="#4C566A" rx="2"/>
    
    <!-- Airplane Wing Cross-Section (Airfoil) - Main Body -->
    <!-- Sleek, robust aerodynamic shape -->
    <path d="M 60 120 
             C 60 120, 80 80, 110 80 
             C 140 80, 185 100, 200 120 
             C 185 130, 140 135, 110 135 
             C 80 135, 60 120, 60 120 Z" 
          fill="#434C5E"/>
          
    <!-- Highlighting the upper aerodynamic contour -->
    <path d="M 60 120 
             C 60 120, 80 80, 110 80 
             C 140 80, 185 100, 200 120" 
          fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>

    <!-- Internal Ribs / Spars (Visualizing Structural Strength & Solidness) -->
    <!-- Spar 1 -->
    <rect x="95" y="86" width="6" height="44" rx="1" fill="#5E81AC"/>
    <circle cx="98" cy="108" r="1.5" fill="#1A1D24"/>
    
    <!-- Spar 2 -->
    <rect x="135" y="93" width="6" height="34" rx="1" fill="#5E81AC"/>
    <circle cx="138" cy="110" r="1.5" fill="#1A1D24"/>

    <!-- Structural truss reinforcement lines inside wing -->
    <line x1="101" y1="95" x2="135" y2="105" stroke="#4C566A" stroke-width="2"/>
    <line x1="101" y1="120" x2="135" y2="110" stroke="#4C566A" stroke-width="2"/>
    <line x1="65" y1="120" x2="95" y2="105" stroke="#4C566A" stroke-width="2"/>
    <line x1="141" y1="105" x2="190" y2="120" stroke="#4C566A" stroke-width="2"/>

    <!-- Rivets along the leading edge indicating metallic sturdiness -->
    <circle cx="68" cy="115" r="1" fill="#D8DEE9"/>
    <circle cx="73" cy="105" r="1" fill="#D8DEE9"/>
    <circle cx="82" cy="94" r="1" fill="#D8DEE9"/>
    <circle cx="93" cy="88" r="1" fill="#D8DEE9"/>

    <!-- Force/Stress Resistance Indicators (Gold/Orange accents showing durability under load) -->
    <!-- Upward stress arrows blocked/resisted by the solid structure -->
    <g stroke="#E5C07B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left upward force -->
      <path d="M 85 160 L 85 142"/>
      <path d="M 80 147 L 85 142 L 90 147"/>
      
      <!-- Center upward force -->
      <path d="M 120 165 L 120 145"/>
      <path d="M 115 150 L 120 145 L 125 150"/>

      <!-- Right upward force -->
      <path d="M 155 160 L 155 142"/>
      <path d="M 150 147 L 155 142 L 160 147"/>
    </g>

    <!-- Shield/Solidification Sparkles at key stress points to emphasize "坚固" (sturdy) -->
    <path d="M 110 70 L 112 75 L 117 77 L 112 79 L 110 84 L 108 79 L 103 77 L 108 75 Z" fill="#E5C07B"/>
    <path d="M 165 95 L 166.5 98 L 169.5 99 L 166.5 100 L 165 103 L 163.5 100 L 160.5 99 L 163.5 98 Z" fill="#E5C07B" transform="scale(0.8) translate(50, 10)"/>
  </g>
</svg>