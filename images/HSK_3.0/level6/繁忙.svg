<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lamp-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Coffee Steam Gradient -->
    <linearGradient id="steam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Wall Details -->
  <!-- Bookshelf / Window Frame backdrop -->
  <rect x="25" y="30" width="190" height="110" rx="6" fill="#111827" opacity="0.6" />
  <rect x="35" y="40" width="50" height="35" rx="4" fill="#334155" opacity="0.3" />
  <rect x="90" y="40" width="50" height="35" rx="4" fill="#334155" opacity="0.3" />
  <rect x="145" y="40" width="60" height="35" rx="4" fill="#334155" opacity="0.3" />
  <rect x="35" y="85" width="170" height="45" rx="4" fill="#1e293b" opacity="0.5" />

  <!-- City Skyline through Window (top left accent) -->
  <path d="M 38 65 L 42 50 L 48 50 L 52 65 Z" fill="#475569" opacity="0.4" />
  <path d="M 54 65 L 59 45 L 67 45 L 72 65 Z" fill="#64748b" opacity="0.4" />
  <path d="M 75 65 L 78 55 L 82 55 L 85 65 Z" fill="#475569" opacity="0.4" />

  <!-- Desk Surface -->
  <rect x="10" y="170" width="220" height="40" rx="4" fill="#0f172a" />
  <path d="M 10 170 L 230 170 L 230 176 L 10 176 Z" fill="#334155" />
  <rect x="20" y="210" width="200" height="8" rx="2" fill="#090d16" opacity="0.5" />

  <!-- Lamp Light Cone -->
  <polygon points="175,45 140,170 210,170" fill="url(#lamp-light)" />

  <!-- Stack of Documents / Folders (Left Side - signifying workload) -->
  <rect x="25" y="150" width="45" height="22" rx="3" fill="#cbd5e1" />
  <rect x="23" y="156" width="45" height="22" rx="3" fill="#f8fafc" />
  <rect x="27" y="162" width="45" height="22" rx="3" fill="#e2e8f0" />
  <!-- Folder Tab & Clip -->
  <path d="M 33 150 L 45 150 L 45 154 L 33 154 Z" fill="#3b82f6" />
  <circle cx="55" cy="173" r="3" fill="#ef4444" />

  <!-- Laptop (Center-Right) -->
  <path d="M 85 140 L 155 140 C 158 140 160 142 160 145 L 165 170 L 75 170 L 80 145 C 80 142 82 140 85 140 Z" fill="#475569" />
  <!-- Laptop Screen -->
  <rect x="88" y="90" width="74" height="52" rx="3" fill="#090d16" />
  <rect x="91" y="93" width="68" height="46" rx="2" fill="url(#screen-glow)" />
  <!-- UI Code/Chart Lines on Screen -->
  <line x1="97" y1="102" x2="125" y2="102" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="97" y1="112" x2="145" y2="112" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="97" y1="120" x2="135" y2="120" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="97" y1="128" x2="115" y2="128" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  <!-- Video Call Avatar / Active Window on screen -->
  <circle cx="143" cy="106" r="6" fill="#f59e0b" />
  
  <!-- Coffee Mug (Bottom Right) -->
  <path d="M 185 150 L 205 150 C 208 150 210 152 210 155 L 208 170 C 208 172 206 174 204 174 L 187 174 C 185 174 183 172 183 170 L 181 155 C 181 152 183 150 185 150 Z" fill="#f8fafc" />
  <path d="M 210 156 C 215 156 217 160 215 165 C 213 168 210 168 210 168" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <!-- Coffee Steam -->
  <path d="M 191 144 C 193 140 193 136 191 132" fill="none" stroke="url(#steam-grad)" stroke-width="2" stroke-linecap="round" />
  <path d="M 199 146 C 197 142 197 138 199 134" fill="none" stroke="url(#steam-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Desk Lamp (Right Background) -->
  <path d="M 175 60 L 175 145" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <path d="M 160 50 L 190 50 L 185 65 L 165 65 Z" fill="#fbbf24" />
  <ellipse cx="175" cy="145" rx="12" ry="4" fill="#64748b" />

  <!-- Floating Work Icons (Busy Metaphor: Notifications/Clocks/Charts) -->
  <!-- Clock Icon Top Left -->
  <g transform="translate(45, 80)">
    <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="-5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="4" y2="2" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>
  <!-- Notification / Alert Top Right -->
  <g transform="translate(195, 95)">
    <circle cx="0" cy="0" r="12" fill="#ef4444" opacity="0.9" />
    <!-- Exclamation mark -->
    <line x1="0" y1="-5" x2="0" y2="2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="6" r="1.5" fill="#ffffff" />
  </g>

  <!-- CHARACTER: Man working intensely ("他") -->
  <!-- Torso & Shirt -->
  <path d="M 100 180 C 100 155 110 145 130 145 C 150 145 160 155 160 180 Z" fill="#3b82f6" />
  <!-- Shirt Collar & Tie -->
  <path d="M 120 145 L 130 156 L 140 145 Z" fill="#f8fafc" />
  <polygon points="128,153 132,153 134,175 126,175" fill="#1d4ed8" />

  <!-- Arms / Hands Typing/Working -->
  <!-- Left Arm -->
  <path d="M 105 155 L 90 165 L 100 172" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Arm -->
  <path d="M 155 155 L 168 165 L 158 172" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hands -->
  <circle cx="98" cy="173" r="6" fill="#fbcfe8" />
  <circle cx="162" cy="173" r="6" fill="#fbcfe8" />

  <!-- Neck -->
  <rect x="122" y="135" width="16" height="15" fill="#fbcfe8" />

  <!-- Head & Face (Expressive, intensely focused, slightly stressed/busy brow) -->
  <circle cx="130" cy="115" r="22" fill="#fbcfe8" />
  <!-- Hair (Neat modern styling) -->
  <path d="M 108 115 C 108 100 115 93 130 93 C 145 93 152 100 152 115 C 152 105 145 96 130 96 C 115 96 108 105 108 115 Z" fill="#1e293b" />
  <path d="M 110 110 L 122 98 L 135 100 L 148 110 Z" fill="#1e293b" />

  <!-- Eyebrows (Tilted downward in concentration/busy mode) -->
  <line x1="115" y1="110" x2="125" y2="113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="135" y1="113" x2="145" y2="110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes (Focused, looking down at screen) -->
  <circle cx="120" cy="118" r="2.5" fill="#1e293b" />
  <circle cx="140" cy="118" r="2.5" fill="#1e293b" />

  <!-- Glasses (Adding professional look) -->
  <rect x="113" y="112" width="14" height="10" rx="2" fill="none" stroke="#475569" stroke-width="1.5" />
  <rect x="133" y="112" width="14" height="10" rx="2" fill="none" stroke="#475569" stroke-width="1.5" />
  <line x1="127" y1="116" x2="133" y2="116" stroke="#475569" stroke-width="1.5" />

  <!-- Mouth (Determined / slightly pressed) -->
  <path d="M 126 128 Q 130 131 134 128" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Sweat Drop (Classic busy/hard work indicator) -->
  <path d="M 148 102 C 148 102 154 108 154 112 C 154 115 151 117 148 117 C 145 117 142 115 142 112 C 142 108 148 102 148 102 Z" fill="#38bdf8" opacity="0.85" />
</svg>