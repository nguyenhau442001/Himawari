<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Lake Surface -->
  <path d="M0 160 C 80 140, 160 140, 240 160 L 240 240 L 0 240 Z" fill="#2C3E50" opacity="0.8"/>
  
  <!-- Mountain Silhouette -->
  <path d="M0 160 L 40 100 L 80 130 L 120 80 L 160 120 L 200 90 L 240 160 Z" fill="#252932"/>
  
  <!-- Moon -->
  <circle cx="180" cy="60" r="30" fill="#F1C40F"/>
  
  <!-- Moonlight Beam -->
  <path d="M180 90 L 150 240 L 210 240 Z" fill="url(#grad1)" opacity="0.3"/>
  
  <!-- Reflection on Water -->
  <ellipse cx="180" cy="180" rx="20" ry="5" fill="#F1C40F" opacity="0.4"/>
  <ellipse cx="180" cy="200" rx="15" ry="4" fill="#F1C40F" opacity="0.2"/>
  
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#F1C40F;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#F1C40F;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>