<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Scam Glow / Spotlight -->
    <radialGradient id="scamGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 (Con artist) Jacket Gradient -->
    <linearGradient id="conJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Victim) Sweater Gradient -->
    <linearGradient id="victimSweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Interior Details -->
  <!-- Ambient Spotlight representing the trap/scheme -->
  <circle cx="130" cy="110" r="110" fill="url(#scamGlow)" />

  <!-- Window Frame in Background -->
  <g opacity="0.15">
    <rect x="25" y="30" width="50" height="70" rx="4" fill="none" stroke="#94a3b8" stroke-width="2" />
    <line x1="50" y1="30" x2="50" y2="100" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="25" y1="65" x2="75" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <!-- City Skyline silhouette outside -->
    <path d="M25 90 L32 75 L38 82 L45 70 L52 85 L60 78 L75 90 Z" fill="#94a3b8" />
  </g>

  <!-- Bookshelf / Prop in background -->
  <g opacity="0.3">
    <rect x="195" y="45" width="25" height="85" fill="#334155" rx="2" />
    <line x1="195" y1="70" x2="220" y2="70" stroke="#0f172a" stroke-width="2" />
    <line x1="195" y1="95" x2="220" y2="95" stroke="#0f172a" stroke-width="2" />
    <rect x="200" y="52" width="6" height="15" fill="#f59e0b" rx="1" />
    <rect x="208" y="55" width="5" height="12" fill="#38bdf8" rx="1" />
    <rect x="201" y="78" width="12" height="15" fill="#f43f5e" rx="1" />
  </g>

  <!-- Floor Line -->
  <rect x="0" y="195" width="240" height="45" fill="url(#floorGrad)" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2" />

  <!-- Coffee Table / Desk -->
  <path d="M 60 170 L 180 170 L 190 195 L 50 195 Z" fill="url(#deskGrad)" />
  <rect x="55" y="165" width="130" height="7" rx="3.5" fill="#475569" />
  <!-- Table Legs -->
  <rect x="70" y="195" width="6" height="25" fill="#0f172a" />
  <rect x="164" y="195" width="6" height="25" fill="#0f172a" />

  <!-- Props on Desk: Fake Contract & Glowing Gold Coin / Treasure Box -->
  <!-- Fake Document / Golden Opportunity Scam Paper -->
  <g transform="rotate(-10 100 168)">
    <rect x="85" y="152" width="30" height="22" rx="1" fill="#f8fafc" />
    <line x1="89" y1="157" x2="111" y2="157" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="89" y1="162" x2="105" y2="162" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="89" y1="167" x2="108" y2="167" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <!-- Fake Gold Seal Stamp -->
    <circle cx="107" cy="168" r="4" fill="#eab308" />
  </g>

  <!-- Shiny Treasure Chest / Money Bag being handed over -->
  <g transform="translate(115, 150)">
    <!-- Bag base -->
    <path d="M 12 18 C 8 18 5 12 8 8 C 10 5 14 3 16 3 C 18 3 22 5 24 8 C 27 12 24 18 20 18 Z" fill="#d97706" />
    <path d="M 13 3 C 13 1 19 1 19 3" fill="none" stroke="#f59e0b" stroke-width="2" />
    <!-- Gold coins spilling out -->
    <circle cx="12" cy="7" r="3.5" fill="url(#goldCoin)" />
    <circle cx="18" cy="6" r="3" fill="url(#goldCoin)" />
    <circle cx="15" cy="11" r="3.5" fill="url(#goldCoin)" />
    <!-- Sparkles on gold -->
    <path d="M 12 5 L 12 9 M 10 7 L 14 7" stroke="#fff" stroke-width="0.8" />
  </g>


  <!-- CHARACTER 1: THE CON ARTIST (欺骗者 - Slick, persuasive, smiling deceitfully) -->
  <g id="conArtist" transform="translate(135, 75)">
    <!-- Body / Torso -->
    <path d="M 25 60 C 25 50 35 45 45 45 L 65 45 C 75 45 85 50 85 60 L 90 120 L 20 120 Z" fill="url(#conJacket)" />
    <!-- Shirt collar -->
    <polygon points="45,45 55,60 65,45" fill="#f8fafc" />
    <!-- Red tie -->
    <polygon points="53,50 57,50 56,75 54,75" fill="#ef4444" />
    <!-- Jacket lapels -->
    <path d="M 45 45 L 53 70 L 38 90" fill="none" stroke="#0284c7" stroke-width="2" />
    <path d="M 65 45 L 57 70 L 72 90" fill="none" stroke="#0284c7" stroke-width="2" />

    <!-- Back Arm (Holding out the deal) -->
    <path d="M 75 55 L 100 65 L 115 60" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Con-artist Hand -->
    <circle cx="117" cy="59" r="6" fill="#fbcfe8" />

    <!-- Head & Neck -->
    <rect x="48" y="32" width="14" height="15" fill="#fbcfe8" />
    <path d="M 38 25 C 38 12 48 8 55 8 C 62 8 72 12 72 25 C 72 38 38 38 38 25 Z" fill="#1e293b" /> <!-- Slick dark hair -->
    <!-- Smug Face -->
    <circle cx="55" cy="27" r="13" fill="#fbcfe8" />
    <!-- Sly Eye (Squinted / Winking or cunning curve) -->
    <path d="M 58 24 C 61 22 64 25 62 27" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <!-- Smug confident smirk -->
    <path d="M 56 32 C 60 34 63 32 64 30" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" />
    <!-- Eyebrow raised high -->
    <path d="M 58 20 C 61 18 64 21 65 20" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Front Arm pointing forward persuasively -->
    <path d="M 35 55 L 15 75 L 5 70" fill="none" stroke="url(#conJacket)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="3" cy="69" r="6" fill="#fbcfe8" />
  </g>


  <!-- CHARACTER 2: THE VICTIM (被骗的人 - Naive, trusting, handing over money) -->
  <g id="victim" transform="translate(15, 70)">
    <!-- Body / Torso -->
    <path d="M 25 65 C 25 55 35 50 45 50 L 65 50 C 75 50 85 55 85 65 L 90 125 L 20 125 Z" fill="url(#victimSweater)" />
    <!-- Sweater collar -->
    <path d="M 42 50 C 42 58 68 58 68 50" fill="none" stroke="#fff" stroke-width="3" />

    <!-- Back arm (taking or giving) -->
    <path d="M 30 65 L 15 85 L 25 95" fill="none" stroke="#be123c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Head & Neck -->
    <rect x="48" y="34" width="14" height="18" fill="#ffedd5" />
    <!-- Innocent Hair Style (Soft brown messy/friendly hair) -->
    <path d="M 38 28 C 38 12 48 8 55 8 C 65 8 72 15 72 28 C 72 32 70 35 70 35 L 40 35 Z" fill="#78350f" />
    <!-- Face -->
    <circle cx="55" cy="28" r="13" fill="#ffedd5" />
    
    <!-- Wide Trusting Eye -->
    <circle cx="60" cy="27" r="3" fill="#1e293b" />
    <circle cx="61" cy="26" r="1" fill="#ffffff" /> <!-- highlight -->
    <!-- Worried / Naive Eyebrow tilted up -->
    <path d="M 57 21 C 60 20 63 22 63 22" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <!-- Open naive mouth (slightly smiling, unaware) -->
    <path d="M 58 33 C 59 36 62 36 63 33" fill="#78350f" />

    <!-- Front Arm actively handing over the money bag -->
    <path d="M 75 60 L 98 80 L 108 78" fill="none" stroke="url(#victimSweater)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand holding money -->
    <circle cx="110" cy="77" r="6" fill="#ffedd5" />
  </g>

  <!-- SCENARIO FX / NARRATIVE HINTS -->
  <!-- Floating question mark or subtle trap indicator (non-textual, purely emotional design) -->
  <g transform="translate(100, 25)" opacity="0.8">
    <path d="M 12 12 C 12 6 22 6 22 12 C 22 17 12 18 12 25" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="12" cy="32" r="2" fill="#f59e0b" />
  </g>

  <!-- Sparkle of fake illusion -->
  <g transform="translate(85, 38)" opacity="0.6">
    <path d="M 6 0 L 6 12 M 0 6 L 12 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="translate(145, 45)" opacity="0.6">
    <path d="M 5 0 L 5 10 M 0 5 L 10 5" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>