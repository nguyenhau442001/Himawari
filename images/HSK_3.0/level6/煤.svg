<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to create contrast for the dark theme -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Coal lumps illustration -->
  <g transform="translate(0, 5)">
    <!-- Back/Bottom Coal Lumps -->
    <path d="M 80,140 L 105,120 L 135,130 L 155,150 L 130,170 L 90,165 Z" fill="#2F3640"/>
    
    <!-- Left Coal Lump -->
    <path d="M 60,135 C 55,120 70,105 85,115 C 95,100 115,110 110,125 C 120,135 110,155 95,150 C 75,160 60,150 60,135 Z" fill="#353B48"/>
    <!-- Left Coal Facets / Highlights -->
    <path d="M 85,115 L 95,130 L 80,140 Z" fill="#4B6584" opacity="0.4"/>
    <path d="M 60,135 L 75,130 L 85,145 Z" fill="#718093" opacity="0.3"/>

    <!-- Main Central Coal Lump -->
    <path d="M 90,95 C 105,80 135,85 145,105 C 165,110 170,135 155,150 C 135,160 115,155 105,135 C 85,135 80,110 90,95 Z" fill="#2C3539"/>
    
    <!-- Facets & Texture for Main Coal (giving it the irregular crystalline/matte look) -->
    <path d="M 105,95 L 130,100 L 120,125 Z" fill="#4A5568"/>
    <path d="M 130,100 L 155,120 L 140,140 Z" fill="#718093" opacity="0.5"/>
    <path d="M 105,135 L 120,125 L 140,140 L 125,155 Z" fill="#1E272C"/>

    <!-- Right Coal Lump -->
    <path d="M 140,115 C 155,105 175,120 170,140 C 185,150 170,175 150,165 C 135,170 130,150 140,115 Z" fill="#3F474F"/>
    <path d="M 140,115 L 155,130 L 165,125 Z" fill="#718093" opacity="0.4"/>

    <!-- Glowing Embers/Heat Accent (representing coal's energy/warming property) -->
    <path d="M 115,110 Q 125,105 130,115 Q 120,120 115,110 Z" fill="#FF6B6B" opacity="0.9"/>
    <path d="M 138,128 Q 145,122 150,132 Q 142,138 138,128 Z" fill="#FF9F43" opacity="0.8"/>
    <path d="M 95,125 Q 102,120 108,128 Q 100,135 95,125 Z" fill="#FF6B6B" opacity="0.7"/>

    <!-- Rising Heat/Energy Sparks -->
    <circle cx="120" cy="85" r="2.5" fill="#FF9F43"/>
    <circle cx="100" cy="75" r="1.5" fill="#FF6B6B"/>
    <circle cx="145" cy="80" r="2" fill="#FFA502"/>
    
    <path d="M 120,78 Q 122,70 118,65" stroke="#FF9F43" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 102,70 Q 104,62 100,58" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 140,73 Q 138,65 144,60" stroke="#FFA502" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>