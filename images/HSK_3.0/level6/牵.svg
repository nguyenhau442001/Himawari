<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Streetlamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradient (Mother) -->
    <linearGradient id="momCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradient (Child) -->
    <linearGradient id="childHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND CONTEXT: Urban Street Scene -->
  <!-- Distant Buildings & Windows -->
  <g opacity="0.4">
    <rect x="20" y="50" width="45" height="130" fill="#1e293b"/>
    <rect x="30" y="65" width="8" height="12" rx="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="45" y="65" width="8" height="12" rx="2" fill="#38bdf8" opacity="0.2"/>
    <rect x="30" y="90" width="8" height="12" rx="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="45" y="90" width="8" height="12" rx="2" fill="#38bdf8" opacity="0.6"/>

    <rect x="175" y="40" width="50" height="140" fill="#1e293b"/>
    <rect x="190" y="55" width="8" height="12" rx="2" fill="#f59e0b" opacity="0.4"/>
    <rect x="205" y="55" width="8" height="12" rx="2" fill="#f59e0b" opacity="0.8"/>
    <rect x="190" y="80" width="8" height="12" rx="2" fill="#f59e0b" opacity="0.6"/>
    <rect x="205" y="80" width="8" height="12" rx="2" fill="#f59e0b" opacity="0.2"/>
  </g>

  <!-- Streetlamp Pole and Glow -->
  <circle cx="195" cy="85" r="50" fill="url(#lampGlow)"/>
  <path d="M190 35 L200 35 L202 180 L188 180 Z" fill="#334155"/>
  <path d="M185 30 L205 30 L200 38 L190 38 Z" fill="#475569"/>
  <circle cx="195" cy="38" r="6" fill="#fef08a" filter="url(#softShadow)"/>

  <!-- Road & Crosswalk Surface -->
  <rect x="0" y="165" width="240" height="75" fill="#0f172a"/>
  
  <!-- Zebra Crossing Stripes -->
  <g fill="#cbd5e1" opacity="0.85">
    <polygon points="40,165 70,165 65,240 30,240"/>
    <polygon points="90,165 120,165 115,240 80,240"/>
    <polygon points="140,165 170,165 165,240 130,240"/>
  </g>

  <!-- Traffic Light Pole in background -->
  <rect x="25" y="70" width="4" height="110" fill="#334155"/>
  <rect x="18" y="75" width="18" height="36" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="27" cy="84" r="3.5" fill="#ef4444"/> <!-- Red light on -->
  <circle cx="27" cy="93" r="3.5" fill="#334155"/>
  <circle cx="27" cy="102" r="3.5" fill="#334155"/>

  <!-- MAIN CHARACTERS: Mother and Child crossing the street -->
  <!-- Shadow on road -->
  <ellipse cx="120" cy="210" rx="45" ry="10" fill="#000000" opacity="0.5"/>

  <!-- MOTHER -->
  <g id="mother" filter="url(#softShadow)">
    <!-- Legs in walking motion -->
    <path d="M100 170 L95 205 L103 207 L108 175 Z" fill="#1e293b"/>
    <path d="M115 170 L125 202 L133 199 L120 170 Z" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="98" cy="208" rx="7" ry="3" fill="#0f172a"/>
    <ellipse cx="128" cy="201" rx="7" ry="3" fill="#0f172a"/>

    <!-- Torso / Coat -->
    <path d="M92 120 L132 120 L138 175 L90 175 Z" fill="url(#momCoat)"/>
    <path d="M112 120 L112 175" stroke="#0284c7" stroke-width="2"/>
    <!-- Scarf -->
    <path d="M98 112 C105 118 115 118 122 112 L125 125 C115 128 105 128 95 125 Z" fill="#ec4899"/>
    <path d="M118 122 L124 150 L116 152 Z" fill="#ec4899"/>

    <!-- Left Arm (Holding Hand) -->
    <path d="M95 125 L75 145" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <circle cx="110" cy="95" r="15" fill="#fde047"/> <!-- face placeholder/skin -->
    <path d="M95 90 C95 75 125 75 125 90 C125 105 120 115 120 115 L100 115 C100 115 95 105 95 90 Z" fill="#334155"/> <!-- Hair -->
    <!-- Gentle facial expression (profile/semi-profile looking down at child) -->
    <circle cx="104" cy="95" r="1.5" fill="#1e293b"/>
    <path d="M107 100 Q110 103 113 100" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- CHILD -->
  <g id="child" filter="url(#softShadow)">
    <!-- Legs in step -->
    <path d="M55 175 L50 200 L58 202 L62 178 Z" fill="#334155"/>
    <path d="M70 175 L75 198 L83 195 L75 175 Z" fill="#1e293b"/>
    <!-- Shoes -->
    <ellipse cx="53" cy="202" rx="6" ry="2.5" fill="#f8fafc"/>
    <ellipse cx="79" cy="197" rx="6" ry="2.5" fill="#f8fafc"/>

    <!-- Torso / Hoodie -->
    <path d="M52 135 L82 135 L86 180 L48 180 Z" fill="url(#childHoodie)"/>
    
    <!-- Right Arm (Reaching up to hold mother's hand) -->
    <path d="M78 140 L95 145" stroke="#ea580c" stroke-width="9" stroke-linecap="round"/>

    <!-- Head & Hoodie Hair -->
    <circle cx="67" cy="118" r="13" fill="#fde047"/>
    <!-- Hood shape behind head -->
    <path d="M54 110 C54 98 80 98 80 110 L78 125 L56 125 Z" fill="#f97316"/>
    <!-- Cute face looking up -->
    <circle cx="72" cy="118" r="1.5" fill="#1e293b"/>
    <path d="M74 123 Q77 125 79 122" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- THE INTERLOCKING HANDS (FOCAL POINT OF '牵') -->
  <g id="holding-hands" filter="url(#softShadow)">
    <circle cx="86" cy="144" r="5" fill="#fde047"/>
    <circle cx="89" cy="146" r="4.5" fill="#fde047"/>
    <!-- Warm connection glow ring around the hands -->
    <circle cx="87" cy="145" r="12" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2" opacity="0.8"/>
  </g>

</svg>