<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person representing the subject -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-40" r="15" fill="#FFC107"/>
    <path d="M-25 0 L25 0 L20 40 L-20 40 Z" fill="#FFC107"/>
    <path d="M-10 40 L-10 70 L-20 70 L-20 45 Z" fill="#FFC107"/>
    <path d="M10 40 L10 70 L20 70 L20 45 Z" fill="#FFC107"/>
  </g>

  <!-- The path of life represented as a continuous, winding golden ribbon/path -->
  <path d="M40 180 C 80 180, 80 60, 120 60 C 160 60, 160 180, 200 180" stroke="#FFC107" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Book representing the learning aspect -->
  <g transform="translate(120, 50)">
    <path d="M-20 -10 L20 -10 L25 10 L-25 10 Z" fill="#FFFFFF"/>
    <path d="M-20 -10 L0 -20 L20 -10" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <line x1="0" y1="-20" x2="0" y2="10" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Stars representing the passage of time/constancy -->
  <path d="M30 50 L33 56 L40 57 L35 62 L36 69 L30 65 L24 69 L25 62 L20 57 L27 56 Z" fill="#FFC107" opacity="0.6"/>
  <path d="M210 50 L213 56 L220 57 L215 62 L216 69 L210 65 L204 69 L205 62 L200 57 L207 56 Z" fill="#FFC107" opacity="0.6"/>
</svg>