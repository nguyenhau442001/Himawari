<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Rain effect -->
  <g stroke="#5D6D7E" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="0" x2="20" y2="20"/>
    <line x1="70" y1="0" x2="60" y2="20"/>
    <line x1="110" y1="0" x2="100" y2="20"/>
    <line x1="150" y1="0" x2="140" y2="20"/>
    <line x1="190" y1="0" x2="180" y2="20"/>
    <line x1="230" y1="0" x2="220" y2="20"/>
    
    <line x1="10" y1="40" x2="0" y2="60"/>
    <line x1="50" y1="40" x2="40" y2="60"/>
    <line x1="90" y1="40" x2="80" y2="60"/>
    <line x1="130" y1="40" x2="120" y2="60"/>
    <line x1="170" y1="40" x2="160" y2="60"/>
    <line x1="210" y1="40" x2="200" y2="60"/>
  </g>

  <!-- Roof Eave -->
  <path d="M0 60 L240 60 L240 80 L20 80 L0 100 Z" fill="#34495E"/>
  <rect x="0" y="60" width="240" height="10" fill="#2C3E50"/>

  <!-- Person standing under eave -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-20 60 L-20 20 Q-20 0 0 0 Q20 0 20 20 L20 60 Z" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="15" fill="#F39C12"/>
    <!-- Legs -->
    <rect x="-15" y="60" width="10" height="20" fill="#F39C12"/>
    <rect x="5" y="60" width="10" height="20" fill="#F39C12"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="230" width="240" height="10" fill="#2C3E50"/>
</svg>