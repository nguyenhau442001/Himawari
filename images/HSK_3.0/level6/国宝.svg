<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for treasure/national treasure theme -->
  <circle cx="120" cy="120" r="70" fill="#FFC107" opacity="0.08"/>

  <!-- Giant Panda (Guóbǎo / National Treasure) - Centered iconic physical character -->
  <g transform="translate(0, 5)">
    <!-- Panda Body / Sitting base -->
    <path d="M 80 150 C 80 120, 160 120, 160 150 C 160 185, 145 195, 120 195 C 95 195, 80 185, 80 150 Z" fill="#2B303C"/>
    
    <!-- Panda Left Arm -->
    <ellipse cx="88" cy="140" rx="14" ry="22" fill="#2B303C" transform="rotate(25 88 140)"/>
    <!-- Panda Right Arm -->
    <ellipse cx="152" cy="140" rx="14" ry="22" fill="#2B303C" transform="rotate(-25 152 140)"/>

    <!-- Panda Left Leg -->
    <ellipse cx="95" cy="185" rx="16" ry="12" fill="#2B303C"/>
    <!-- Panda Right Leg -->
    <ellipse cx="145" cy="185" rx="16" ry="12" fill="#2B303C"/>

    <!-- Panda Head -->
    <circle cx="120" cy="105" r="46" fill="#F4F5F6"/>

    <!-- Panda Left Ear -->
    <circle cx="86" cy="72" r="14" fill="#2B303C"/>
    <!-- Panda Right Ear -->
    <circle cx="154" cy="72" r="14" fill="#2B303C"/>

    <!-- Panda Left Eye Patch -->
    <ellipse cx="101" cy="100" rx="13" ry="16" fill="#2B303C" transform="rotate(15 101 100)"/>
    <!-- Panda Right Eye Patch -->
    <ellipse cx="139" cy="100" rx="13" ry="16" fill="#2B303C" transform="rotate(-15 139 100)"/>

    <!-- Panda Left Eye (White Highlight) -->
    <circle cx="103" cy="97" r="4" fill="#F4F5F6"/>
    <circle cx="105" cy="95" r="1.5" fill="#2B303C"/>
    <!-- Panda Right Eye (White Highlight) -->
    <circle cx="137" cy="97" r="4" fill="#F4F5F6"/>
    <circle cx="135" cy="95" r="1.5" fill="#2B303C"/>

    <!-- Panda Nose & Muzzle -->
    <ellipse cx="120" cy="112" rx="7" ry="5" fill="#2B303C"/>
    <path d="M 120 117 Q 120 125 113 121" fill="none" stroke="#2B303C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120 117 Q 120 125 127 121" fill="none" stroke="#2B303C" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bamboo Leaves (Contextual element for the Panda) -->
  <!-- Top Right Bamboo Branch -->
  <path d="M 175 45 Q 155 65 140 90" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <path d="M 160 58 Q 175 52 170 42 Q 155 48 160 58 Z" fill="#66BB6A"/>
  <path d="M 148 75 Q 133 72 138 60 Q 150 67 148 75 Z" fill="#81C784"/>

  <!-- Bottom Left Bamboo Branch -->
  <path d="M 65 180 Q 75 160 90 135" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <path d="M 75 165 Q 60 168 63 178 Q 78 175 75 165 Z" fill="#66BB6A"/>

  <!-- Golden Treasure Frame / Accents (Representing "Bao" / Treasure) -->
  <!-- Top-left corner bracket -->
  <path d="M 36 50 L 36 36 L 50 36" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Top-right corner bracket -->
  <path d="M 204 50 L 204 36 L 190 36" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Bottom-left corner bracket -->
  <path d="M 36 190 L 36 204 L 50 204" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Bottom-right corner bracket -->
  <path d="M 204 190 L 204 204 L 190 204" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>