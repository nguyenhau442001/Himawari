<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Printing Press / Publishing Desk -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="boxGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment (Publishing House / Studio Interior) -->
  <!-- Bookshelf / Window Grid -->
  <g opacity="0.3">
    <rect x="25" y="30" width="40" height="60" rx="4" fill="#334155"/>
    <line x1="25" y1="50" x2="65" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="25" y1="70" x2="65" y2="70" stroke="#1e293b" stroke-width="2"/>
    
    <rect x="175" y="25" width="45" height="70" rx="4" fill="#334155"/>
    <line x1="175" y1="45" x2="220" y2="45" stroke="#1e293b" stroke-width="2"/>
    <line x1="175" y1="70" x2="220" y2="70" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Hanging Lamp illuminating the scene -->
  <path d="M120 0 L120 35" stroke="#64748b" stroke-width="2"/>
  <path d="M100 35 L140 35 L145 42 L95 42 Z" fill="#475569"/>
  <path d="M95 42 L145 42 L135 48 L105 48 Z" fill="#334155"/>
  <polygon points="105,48 135,48 170,120 70,120" fill="#fbbf24" opacity="0.08"/>

  <!-- Back Desk / Counter -->
  <rect x="30" y="115" width="180" height="8" rx="2" fill="#475569"/>
  <rect x="40" y="123" width="160" height="75" fill="#334155" opacity="0.8"/>

  <!-- STACK OF NEW BOOKS READY FOR RELEASE ("即将发行") -->
  <!-- Box 1 (Lower shipping box) -->
  <g filter="url(#shadow)">
    <path d="M130 145 L190 145 L205 175 L145 175 Z" fill="#64748b"/>
    <path d="M130 130 L190 130 L190 145 L130 145 Z" fill="#475569"/>
    <path d="M190 130 L205 140 L205 175 L190 145 Z" fill="#334155"/>
  </g>

  <!-- Stack of fresh books -->
  <g filter="url(#shadow)">
    <!-- Book 3 (Bottom) -->
    <path d="M45 155 L115 140 L125 155 L55 170 Z" fill="#0284c7"/>
    <path d="M115 140 L125 155 L125 158 L115 143 Z" fill="#0369a1"/>
    <!-- Book 2 (Middle) -->
    <path d="M48 142 L118 127 L126 142 L56 157 Z" fill="#10b981"/>
    <path d="M118 127 L126 142 L126 145 L118 130 Z" fill="#047857"/>
    <!-- Book 1 (Top - Featured Release) -->
    <path d="M50 128 L120 113 L128 128 L58 143 Z" fill="url(#bookCover)"/>
    <path d="M120 113 L128 128 L128 131 L120 116 Z" fill="#d97706"/>
    <!-- Book Pages Edge -->
    <path d="M56 141 L58 143 L128 128 L126 126 Z" fill="#f8fafc"/>
  </g>

  <!-- MAIN CHARACTER: Proud Editor / Author presenting the new release -->
  <g id="character" filter="url(#shadow)">
    <!-- Body / Torso (leaning forward over the desk) -->
    <path d="M75 198 C75 165 95 155 110 155 C125 155 145 165 145 198 Z" fill="#38bdf8"/>
    <!-- Collar / Tie Details -->
    <polygon points="105,155 115,155 112,170 108,170" fill="#f8fafc"/>
    <polygon points="109,165 111,165 113,185 107,185" fill="#f43f5e"/>

    <!-- Head and Neck -->
    <path d="M103 140 L117 140 L118 158 L102 158 Z" fill="#fed7aa"/>
    <!-- Face Shape -->
    <circle cx="110" cy="122" r="18" fill="#fed7aa"/>
    
    <!-- Hair (Modern Stylized) -->
    <path d="M93 118 C93 105 102 102 110 102 C119 102 128 106 128 118 C128 123 126 120 126 114 C126 108 119 105 110 105 C101 105 95 108 95 115 C95 120 93 118 93 118 Z" fill="#1e293b"/>
    <path d="M96 116 C98 110 103 108 110 108 C117 108 122 110 124 116 Z" fill="#1e293b"/>

    <!-- Facial Expression (Excited, Ready to Release) -->
    <!-- Smiling Eyes -->
    <path d="M102 122 Q105 118 108 122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M112 122 Q115 118 118 122" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Happy Smile -->
    <path d="M106 130 Q110 135 114 130" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="100" cy="126" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="120" cy="126" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Arms / Hands pointing at the newly released book -->
    <!-- Back Arm -->
    <path d="M80 160 L65 170 L75 180" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm pointing enthusiastically -->
    <path d="M138 165 L155 150 L145 140" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="145" cy="140" r="5" fill="#fed7aa"/>
  </g>

  <!-- FOREGROUND ACCENTS & MAGICAL DRAFT / RELEASE SPARKLES -->
  <!-- Floating Sparkles / Release Energy representing "即将发行" (Upcoming launch/release) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M165 95 Q165 105 175 105 Q165 105 165 115 Q165 105 155 105 Q165 105 165 95" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M140 75 Q140 82 147 82 Q140 82 140 89 Q140 82 133 82 Q140 82 140 75" opacity="0.7"/>
    <!-- Star 3 -->
    <path d="M185 115 Q185 120 190 120 Q185 120 185 125 Q185 120 180 120 Q185 120 185 115" opacity="0.6"/>
    <!-- Glowing Spark dots -->
    <circle cx="150" cy="120" r="3" opacity="0.8"/>
    <circle cx="175" cy="135" r="2" opacity="0.5"/>
    <circle cx="130" cy="100" r="2.5" opacity="0.9"/>
  </g>

  <!-- Rocket / Arrow motif subtly integrated as a launch/release symbol -->
  <g transform="translate(195, 60) rotate(45)" opacity="0.9">
    <path d="M0 15 L5 0 L10 15 L5 12 Z" fill="#f43f5e" filter="url(#shadow)"/>
    <path d="M3 12 L7 12 L7 20 L3 20 Z" fill="#94a3b8"/>
    <path d="M2 18 L5 24 L8 18 Z" fill="#fb923c"/>
  </g>

  <!-- Foreground Frame / Desk Edge -->
  <rect x="0" y="198" width="240" height="42" fill="#0f172a"/>
  <!-- Decorative front panel line -->
  <line x1="20" y1="198" x2="220" y2="198" stroke="#334155" stroke-width="2"/>

  <!-- Additional cozy background details: Coffee cup on desk -->
  <g transform="translate(45, 175)" filter="url(#shadow)">
    <rect x="0" y="5" width="14" height="16" rx="2" fill="#f8fafc"/>
    <path d="M14 8 C18 8 18 16 14 16" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M4 2 L6 0 M8 2 L10 0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>