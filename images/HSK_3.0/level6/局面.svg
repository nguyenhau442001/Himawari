<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  
  <!-- Character: Frustrated Project Manager -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <path d="M-10 -5 L-5 -5 M5 -5 L10 -5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 10 Q0 15 8 10" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="-30" y="25" width="60" height="60" rx="10" fill="#64748b"/>
  </g>

  <!-- Complex Situation Props: Tangled wires and charts -->
  <path d="M40 180 Q60 150 80 180 T120 180" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M160 190 L180 160 L200 190" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="160" r="4" fill="#ec4899"/>
  
  <!-- Floating Data/Charts -->
  <rect x="30" y="60" width="40" height="30" rx="4" fill="#10b981" opacity="0.8"/>
  <rect x="170" y="50" width="40" height="40" rx="4" fill="#fbbf24" opacity="0.8"/>
  <line x1="180" y1="60" x2="200" y2="80" stroke="#0f172a" stroke-width="2"/>
  <line x1="180" y1="80" x2="200" y2="60" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
</svg>