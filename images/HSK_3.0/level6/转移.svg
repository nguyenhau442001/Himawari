<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Coastal area -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#2D3436"/>
  
  <!-- Evacuation Path (Dashed line) -->
  <path d="M40 160 Q120 100 200 160" stroke="#FF9F43" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Person being evacuated -->
  <g transform="translate(40, 140)">
    <circle cx="10" cy="10" r="8" fill="#FFD32A"/>
    <path d="M10 18 L10 40 M10 25 L2 35 M10 25 L18 35 M10 40 L5 55 M10 40 L15 55" stroke="#FFD32A" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Rescuer/Officer helping -->
  <g transform="translate(180, 140)">
    <circle cx="10" cy="10" r="8" fill="#54A0FF"/>
    <path d="M10 18 L10 40 M10 25 L2 35 M10 25 L18 35 M10 40 L5 55 M10 40 L15 55" stroke="#54A0FF" stroke-width="3" stroke-linecap="round"/>
    <!-- Guiding hand gesture -->
    <path d="M-5 20 L-15 15" stroke="#54A0FF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Arrow indicating movement -->
  <path d="M80 135 L160 135 L155 130 M160 135 L155 140" stroke="#FF9F43" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>