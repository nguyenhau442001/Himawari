<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground line -->
  <path d="M40 180 L200 180" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Rising object: A stylized bicycle representing the industry -->
  <g transform="translate(120, 140)">
    <!-- Rear wheel -->
    <circle cx="-35" cy="0" r="20" fill="none" stroke="#FFB800" stroke-width="4"/>
    <!-- Front wheel -->
    <circle cx="35" cy="0" r="20" fill="none" stroke="#FFB800" stroke-width="4"/>
    <!-- Frame -->
    <path d="M-35 0 L0 -30 L35 0 M-10 -20 L20 -20 L0 -30" stroke="#FFB800" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Handlebar -->
    <path d="M20 -20 L25 -35" stroke="#FFB800" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Upward motion lines indicating "rising/emerging" -->
  <g stroke="#FFB800" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M120 100 L120 70 M110 80 L120 70 L130 80"/>
    <path d="M80 120 L80 90 M70 100 L80 90 L90 100"/>
    <path d="M160 120 L160 90 M150 100 L160 90 L170 100"/>
  </g>
</svg>