<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Main Object: Running shoe / runner with bold red prohibition representing "not suitable / not recommended" -->
    <!-- Circular background badge representing the context (food and running) -->
    <circle cx="0" cy="0" r="76" fill="#242833"/>
    
    <!-- Subtle bowl of rice / food icon silhouette in background to represent 'just finished eating' -->
    <path d="M-30,40 C-30,55 30,55 30,40 Z" fill="#2F3542"/>
    <path d="M-40,36 L40,36 C40,36 35,32 30,32 L-30,32 C-35,32 -40,36 -40,36 Z" fill="#3A4150"/>
    
    <!-- Running Figure (Dynamic flat vector) -->
    <g transform="translate(-10, -5) scale(0.9)">
      <!-- Head -->
      <circle cx="10" cy="-35" r="12" fill="#E2E8F0"/>
      <!-- Torso (leaning forward) -->
      <path d="M5,-20 C2,-10 -5,5 -15,15" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
      <!-- Back Leg -->
      <path d="M-15,15 L-30,35 L-45,30" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front Leg (running stride) -->
      <path d="M-15,15 C-5,25 15,20 25,5" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Back Arm -->
      <path d="M0,-15 L15,-5 L30,-15" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front Arm -->
      <path d="M0,-15 L-15,-5 L-5,10" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Bold Red Prohibition Sign (Overlay emphasizing "不宜" - not suitable/recommended right now) -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#EF4444" stroke-width="12"/>
    <line x1="-51" y1="-51" x2="51" y2="51" stroke="#EF4444" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>