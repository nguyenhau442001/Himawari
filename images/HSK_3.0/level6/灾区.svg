<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Debris area -->
  <path d="M40 190 L200 190 L180 160 L150 175 L120 150 L90 170 L60 155 L40 190 Z" fill="#3E4451"/>
  
  <!-- Ruined structure -->
  <path d="M70 180 L70 120 L100 100 L130 120 L130 180 Z" fill="#5D6778"/>
  <rect x="80" y="130" width="15" height="20" fill="#2D323B"/>
  <rect x="105" y="130" width="15" height="20" fill="#2D323B"/>
  
  <!-- Cracked ground effect -->
  <path d="M50 190 L70 175 M100 190 L110 170 M150 190 L140 170" stroke="#8A95A8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Relief supply crate (The focus object) -->
  <rect x="140" y="150" width="40" height="40" rx="4" fill="#F39C12"/>
  <rect x="140" y="150" width="40" height="40" rx="4" stroke="#D35400" stroke-width="2" fill="none"/>
  <line x1="140" y1="150" x2="180" y2="190" stroke="#D35400" stroke-width="2"/>
  <line x1="180" y1="150" x2="140" y2="190" stroke="#D35400" stroke-width="2"/>
  
  <!-- Secondary supply crate -->
  <rect x="160" y="170" width="30" height="20" rx="2" fill="#E67E22"/>
  
  <!-- Dust/Atmosphere -->
  <circle cx="90" cy="110" r="2" fill="#8A95A8" opacity="0.6"/>
  <circle cx="110" cy="90" r="3" fill="#8A95A8" opacity="0.4"/>
  <circle cx="150" cy="100" r="2" fill="#8A95A8" opacity="0.5"/>
</svg>