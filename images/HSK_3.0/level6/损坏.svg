<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative tech grid/dots -->
  <circle cx="40" cy="50" r="1.5" fill="#2E3440" />
  <circle cx="200" cy="40" r="1.5" fill="#2E3440" />
  <circle cx="210" cy="180" r="1.5" fill="#2E3440" />
  <circle cx="50" cy="200" r="1.5" fill="#2E3440" />

  <!-- Sparks / Damage effects (Action indicators) -->
  <!-- Spark 1 -->
  <path d="M 125 90 L 135 75" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spark 2 -->
  <path d="M 140 100 L 155 95" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spark 3 -->
  <path d="M 130 115 L 145 125" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="132" cy="100" r="2" fill="#FFE082"/>

  <!-- Motion lines for hammering/striking action -->
  <path d="M 160 55 C 150 70 140 85 130 95" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
  <path d="M 175 65 C 165 80 150 95 138 105" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>

  <!-- Machine / Device (Target object being damaged) -->
  <!-- Machine Body -->
  <rect x="70" y="90" width="70" height="85" rx="8" fill="#334155"/>
  <!-- Machine Screen / Interface -->
  <rect x="80" y="100" width="50" height="35" rx="4" fill="#1E293B"/>
  <!-- Cracked Screen Graphic -->
  <path d="M 95 110 L 115 125 M 115 110 L 95 125 M 105 110 L 105 125" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Machine Base/Stand -->
  <path d="M 90 175 L 120 175 L 125 185 L 85 185 Z" fill="#1E293B"/>
  <!-- Machine detail buttons -->
  <circle cx="90" cy="150" r="4" fill="#64748B"/>
  <circle cx="105" cy="150" r="4" fill="#64748B"/>
  <rect x="115" y="147" width="15" height="6" rx="3" fill="#EF4444"/>

  <!-- Human Character (Action cause) -->
  <!-- Torso & Arm -->
  <path d="M 170 140 C 160 120 150 110 135 105" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Head -->
  <circle cx="185" cy="120" r="10" fill="#CBD5E1"/>
  <!-- Body/Shoulder -->
  <path d="M 165 175 C 170 150 185 140 195 175" fill="#0284C7"/>

  <!-- Wrench / Tool being used to cause damage -->
  <g transform="translate(130, 80) rotate(-45)">
    <!-- Tool handle -->
    <rect x="0" y="0" width="8" height="40" rx="3" fill="#FFA726"/>
    <!-- Tool head -->
    <path d="M -4 0 L 12 0 L 8 -12 L -0 -12 Z" fill="#FB8C00"/>
  </g>

  <!-- Impact / Crack focal point -->
  <circle cx="130" cy="105" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="130" cy="105" r="12" stroke="#EF4444" stroke-width="1.5" fill="none" opacity="0.6"/>

</svg>