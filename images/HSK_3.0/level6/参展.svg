<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow / Background Exhibition Stand Elements -->
  <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <rect x="50" y="100" width="140" height="80" rx="4" fill="#222733" opacity="0.6"/>
  <path d="M70 100 L70 70 L170 70 L170 100" fill="none" stroke="#3A4255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Spotlight effect illuminating the exhibition booth -->
  <path d="M90 70 L120 20 L150 70 Z" fill="#F39C12" opacity="0.08"/>

  <!-- Exhibition Display Stand / Counter -->
  <rect x="75" y="140" width="90" height="40" rx="4" fill="#2D3545"/>
  <path d="M70 140 H170 V148 H70 Z" fill="#F39C12"/>

  <!-- Graphic Display / Poster on the Backwall (Abstract Vector Art representing "Exhibition") -->
  <rect x="90" y="85" width="60" height="45" rx="3" fill="#1E2330"/>
  <circle cx="120" cy="102" r="12" fill="#3498DB" opacity="0.8"/>
  <path d="M98 120 L112 108 L124 116 L142 98" fill="none" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Human Character Action (Verb: 参展 - Participating/Presenting at an exhibition) -->
  <!-- Character Body -->
  <path d="M120 125 C110 125 102 135 102 148 V180 H138 V148 C138 135 130 125 120 125 Z" fill="#3498DB"/>
  
  <!-- Character Head -->
  <circle cx="120" cy="105" r="12" fill="#F5CBA7"/>
  <path d="M110 102 C110 95 130 95 130 102 Z" fill="#E67E22"/> <!-- Hair -->

  <!-- Arms interacting / pointing proudly at the exhibition booth/display -->
  <!-- Back Arm -->
  <path d="M110 135 L95 150" fill="none" stroke="#2980B9" stroke-width="8" stroke-linecap="round"/>
  <!-- Front Arm gesturing forward with enthusiasm -->
  <path d="M130 135 L155 130" fill="none" stroke="#3498DB" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="158" cy="129" r="4" fill="#F5CBA7"/>

  <!-- Dynamic Motion Lines emphasizing active participation/engagement -->
  <path d="M168 115 C173 122 173 132 168 140" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M174 119 C177 124 177 130 174 136" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Accent Focus Badge / Tag (Modern UI detail, no text) -->
  <circle cx="185" cy="65" r="12" fill="#F39C12" opacity="0.2"/>
  <circle cx="185" cy="65" r="6" fill="#F39C12"/>
</svg>