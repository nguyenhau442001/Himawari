<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glows / subtle lighting to enhance modern flat dark mode -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Sharp pencil tip illustration representing "尖" (jiān - point, sharp tip) -->
  <g transform="translate(120, 120) rotate(-45)">
    <!-- Pencil body (Hexagonal wooden section) -->
    <path d="M-14,80 L14,80 L18,20 L-18,20 Z" fill="#FFA726"/>
    <!-- Pencil stripes for 3D/flat shading -->
    <path d="M-6,80 L-6,20 L0,20 L0,80 Z" fill="#FB8C00" opacity="0.4"/>
    <path d="M6,80 L6,20 L12,20 L12,80 Z" fill="#FB8C00" opacity="0.2"/>
    <path d="M-18,20 L18,20 L14,10 L-14,10 Z" fill="#F57C00"/>

    <!-- Wood shaved cone section -->
    <path d="M-14,10 L14,10 L0,-45 Z" fill="#FFE0B2"/>
    <!-- Wood shading grain -->
    <path d="M0,10 L0,-45 L5,-20 Z" fill="#FFCC80" opacity="0.5"/>

    <!-- Graphite core (the extremely sharp tip) -->
    <path d="M-3, -35 L3, -35 L0, -75 Z" fill="#37474F"/>
    
    <!-- Focus highlight lines emphasizing the ultra-sharp point -->
    <g opacity="0.8">
      <line x1="20" y1="-85" x2="6" y2="-70" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
      <line x1="-20" y1="-85" x2="-6" y2="-70" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="-92" x2="0" y2="-78" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Precision focus ring/sparkles highlighting the sharp tip -->
  <g transform="translate(120, 50)" opacity="0.9">
    <polygon points="0,-4 2,0 6,2 2,4 0,8 -2,4 -6,2 -2,0" fill="#FFD54F"/>
  </g>
  <g transform="translate(75, 95)" opacity="0.6">
    <polygon points="0,-3 1.5,0 4.5,1.5 1.5,3 0,6 -1.5,3 -4.5,1.5 -1.5,0" fill="#FFD54F"/>
  </g>
</svg>