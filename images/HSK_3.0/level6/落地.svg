<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Glow & Runway Background -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#242B38"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB703" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="240" height="240" fill="url(#skyGrad)"/>

  <!-- Subtle Horizon Glow -->
  <ellipse cx="120" cy="180" rx="100" ry="20" fill="url(#glowGrad)"/>

  <!-- Runway / Ground Surface -->
  <path d="M 40 180 L 200 180 L 220 220 L 20 220 Z" fill="#12151B"/>
  
  <!-- Runway Centerline Dashes -->
  <polygon points="117,185 123,185 122,195 118,195" fill="#FFB703"/>
  <polygon points="116,202 124,202 123,212 117,212" fill="#FFB703"/>

  <!-- Touchdown Motion / Impact Sparks / Focus Accent -->
  <g opacity="0.8">
    <path d="M 90 180 L 75 175" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
    <path d="M 150 180 L 165 175" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
    <circle cx="85" cy="180" r="1.5" fill="#FFB703"/>
    <circle cx="155" cy="180" r="1.5" fill="#FFB703"/>
  </g>

  <!-- Modern Commercial Airplane (Landing / Touchdown pose) -->
  <g transform="translate(0, -5)">
    <!-- Main Fuselage -->
    <path d="M 70 120 C 70 115 110 110 155 115 C 185 118 200 123 205 128 C 200 133 185 138 155 141 C 110 146 70 141 70 136 Z" fill="#E2E8F0"/>
    
    <!-- Fuselage Shadow/Underside -->
    <path d="M 70 136 C 70 141 110 146 155 141 C 185 138 200 133 205 128 C 200 128 185 133 155 135 C 110 138 70 136 70 136 Z" fill="#CBD5E1"/>

    <!-- Cockpit Windows -->
    <path d="M 195 126 C 198 126 201 127 203 129 C 201 129 198 129 195 128 Z" fill="#1A1D24"/>

    <!-- Tail Fin (Vertical Stabilizer) -->
    <path d="M 72 122 L 85 92 L 102 92 L 95 120 Z" fill="#3B82F6"/>

    <!-- Horizontal Stabilizer -->
    <path d="M 75 124 L 88 112 L 98 112 L 87 125 Z" fill="#60A5FA"/>

    <!-- Main Wing (Perspective View) -->
    <path d="M 115 128 L 140 80 L 160 80 L 135 133 Z" fill="#CBD5E1"/>
    <!-- Wing Engine Nacelle -->
    <ellipse cx="138" cy="110" rx="5" ry="3" fill="#94A3B8" transform="rotate(-15 138 110)"/>

    <!-- Landing Gear (Wheels touching ground - Emphasizing "落地") -->
    <!-- Nose Gear -->
    <line x1="185" y1="135" x2="187" y2="178" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="187" cy="179" r="3.5" fill="#1E293B" stroke="#F8FAFC" stroke-width="1"/>

    <!-- Main Gear -->
    <line x1="130" y1="138" x2="128" y2="177" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="128" cy="178" r="4.5" fill="#1E293B" stroke="#F8FAFC" stroke-width="1"/>
    <circle cx="135" cy="178" r="4.5" fill="#1E293B" stroke="#F8FAFC" stroke-width="1"/>
  </g>

  <!-- Subtle ground contact puff / smoke ring -->
  <ellipse cx="131" cy="180" rx="12" ry="4" fill="#F8FAFC" opacity="0.4"/>
  <ellipse cx="187" cy="180" rx="9" ry="3" fill="#F8FAFC" opacity="0.4"/>

</svg>