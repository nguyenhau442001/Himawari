<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid representing technical comparison / evaluation -->
  <g opacity="0.15" stroke="#4A5568" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="60" x2="200" y2="60"/>
    <line x1="40" y1="120" x2="200" y2="120"/>
    <line x1="40" y1="180" x2="200" y2="180"/>
    <line x1="80" y1="40" x2="80" y2="200"/>
    <line x1="160" y1="40" x2="160" y2="200"/>
  </g>

  <!-- Base comparison platform / physical object base -->
  <path d="M50 185 L190 185 L175 160 L65 160 Z" fill="#2D3748"/>
  <rect x="75" y="150" width="90" height="12" rx="3" fill="#4A5568"/>

  <!-- Standard comparison items (muted grey/blue) -->
  <!-- Item 1 (Left) -->
  <rect x="70" y="110" width="28" height="40" rx="4" fill="#4A5568"/>
  <rect x="76" y="120" width="16" height="6" rx="2" fill="#718096"/>
  
  <!-- Item 2 (Middle) -->
  <rect x="106" y="95" width="28" height="55" rx="4" fill="#4A5568"/>
  <rect x="112" y="105" width="16" height="6" rx="2" fill="#718096"/>

  <!-- The "Jiàowéi / Quite / Notably prominent" standout physical object (Right, highlighted with orange/gold accent) -->
  <g transform="translate(138, 65)">
    <!-- Glow effect for emphasis -->
    <circle cx="20" cy="45" r="30" fill="#D69E2E" opacity="0.15"/>
    
    <!-- Main prominent mechanical object -->
    <rect x="0" y="15" width="40" height="75" rx="6" fill="#2B6CB0"/>
    <!-- Highlight accent frame -->
    <rect x="-2" y="13" width="44" height="79" rx="8" fill="none" stroke="#ED8936" stroke-width="3"/>
    
    <!-- Object details (tech device / premium unit) -->
    <path d="M12 15 L28 15 L32 25 L8 25 Z" fill="#4299E1"/>
    <rect x="8" y="33" width="24" height="35" rx="3" fill="#1A202C"/>
    <!-- Glowing indicator representing high performance/value -->
    <circle cx="20" cy="50" r="6" fill="#ED8936"/>
    <circle cx="20" cy="50" r="3" fill="#F6AD55"/>
    
    <!-- Base feet -->
    <rect x="6" y="90" width="8" height="6" rx="2" fill="#CBD5E0"/>
    <rect x="26" y="90" width="8" height="6" rx="2" fill="#CBD5E0"/>
  </g>

  <!-- Dynamic evaluation bracket / comparison indicator -->
  <path d="M68 95 L68 85 L145 85 L145 95" fill="none" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
  <circle cx="106.5" cy="85" r="3" fill="#718096"/>

  <!-- Prominent focus indicator above the standout object -->
  <g transform="translate(158, 45)">
    <polygon points="0,10 12,10 6,0" fill="#ED8936"/>
  </g>
</svg>