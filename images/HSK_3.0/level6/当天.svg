<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow representing a timeline or current day boundary -->
  <circle cx="120" cy="120" r="76" fill="none" stroke="#262B36" stroke-width="2"/>
  <circle cx="120" cy="120" r="76" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="480" stroke-dashoffset="120" opacity="0.3"/>

  <!-- Calendar Base (Representing "The Day") -->
  <rect x="75" y="65" width="90" height="100" rx="12" fill="#222733" stroke="#323846" stroke-width="3"/>
  
  <!-- Calendar Top Header -->
  <path d="M 75 77 A 12 12 0 0 1 87 65 L 153 65 A 12 12 0 0 1 165 77 L 165 95 L 75 95 Z" fill="#F59E0B"/>
  
  <!-- Binding Rings -->
  <rect x="94" y="57" width="8" height="14" rx="4" fill="#64748B"/>
  <rect x="138" y="57" width="8" height="14" rx="4" fill="#64748B"/>
  
  <!-- Calendar Grid Lines / Dots -->
  <circle cx="98" cy="118" r="5" fill="#3B4252"/>
  <circle cx="120" cy="118" r="5" fill="#3B4252"/>
  <circle cx="142" cy="118" r="5" fill="#3B4252"/>

  <circle cx="98" cy="142" r="5" fill="#3B4252"/>
  <circle cx="120" cy="142" r="5" fill="#3B4252"/>
  <circle cx="142" cy="142" r="5" fill="#3B4252"/>

  <!-- Focal Point: Distinct checkmark/highlight for "The Exact Day" (当天) -->
  <circle cx="120" cy="130" r="32" fill="#1A1D24" stroke="#F59E0B" stroke-width="4"/>
  <path d="M 106 130 L 115 139 L 135 117" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Express delivery indicator rays / Motion accents representing same-day swiftness -->
  <path d="M 46 80 L 60 90" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 120 L 58 120" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 194 80 L 180 90" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200 120 L 182 120" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

  <!-- Sun/Time indicator badge top right corner -->
  <circle cx="178" cy="74" r="14" fill="#1A1D24" stroke="#323846" stroke-width="2"/>
  <circle cx="178" cy="74" r="6" fill="#F59E0B"/>
  <path d="M 178 62 L 178 65" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 178 83 L 178 86" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 166 74 L 169 74" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 187 74 L 190 74" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>