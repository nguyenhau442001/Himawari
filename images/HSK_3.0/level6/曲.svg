<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Sound Waves (Echoing in the tranquil hall) -->
  <path d="M 50 120 Q 75 90 75 120 Q 75 150 50 120" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 35 120 Q 70 70 70 120 Q 70 170 35 120" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M 190 120 Q 165 90 165 120 Q 165 150 190 120" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 205 120 Q 170 70 170 120 Q 170 170 205 120" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Melodic Sound Waves (Resonating outward from the center) -->
  <path d="M 85 120 Q 100 95 100 120 Q 100 145 85 120" fill="none" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  <path d="M 155 120 Q 140 95 140 120 Q 140 145 155 120" fill="none" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>

  <!-- Musical Staff Lines (Subtle background context) -->
  <line x1="60" y1="95" x2="180" y2="95" stroke="#252A34" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="107" x2="180" y2="107" stroke="#252A34" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="120" x2="180" y2="120" stroke="#252A34" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="133" x2="180" y2="133" stroke="#252A34" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="145" x2="180" y2="145" stroke="#252A34" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Physical Object: Musical Notes / Melodic Tune (Giai điệu / Bài hát) -->
  <!-- Note 1 (Left) -->
  <ellipse cx="100" cy="135" rx="8" ry="6" fill="#F6AD55" transform="rotate(-15 100 135)"/>
  <path d="M 106 133 L 106 95" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>

  <!-- Note 2 (Right) -->
  <ellipse cx="140" cy="125" rx="8" ry="6" fill="#F6AD55" transform="rotate(-15 140 125)"/>
  <path d="M 146 123 L 146 85" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>

  <!-- Connecting Beam -->
  <path d="M 105 95 L 146 85 L 146 93 L 105 103 Z" fill="#F6AD55"/>

  <!-- Floating Eighth Note (Adding a sense of flowing, meandering melody "宛转悠扬") -->
  <g transform="translate(15, -10)">
    <ellipse cx="155" cy="95" rx="5" ry="4" fill="#ED8936" transform="rotate(-15 155 95)"/>
    <path d="M 159 93 L 159 70" fill="none" stroke="#ED8936" stroke-width="2" stroke-linecap="round"/>
    <path d="M 159 70 C 165 70 168 76 172 78" fill="none" stroke="#ED8936" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>