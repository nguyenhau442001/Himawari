<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="coffeeFluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="alarmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle Warning Alarm Glow in background (representing the "disaster/accident" context) -->
  <circle cx="120" cy="110" r="90" fill="url(#alarmGlow)"/>

  <!-- Background Elements: Office wall, window with night city / indoor shelf -->
  <g opacity="0.4">
    <!-- Window frame -->
    <rect x="25" y="30" width="50" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="65" x2="75" y2="65" stroke="#475569" stroke-width="2"/>
    <!-- City lights outside window -->
    <rect x="33" y="45" width="8" height="12" fill="#f59e0b"/>
    <rect x="47" y="75" width="10" height="15" fill="#38bdf8"/>
    <rect x="61" y="50" width="8" height="20" fill="#f59e0b"/>

    <!-- Bookshelf in background -->
    <rect x="175" y="25" width="40" height="90" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="55" x2="215" y2="55" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="85" x2="215" y2="85" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="182" y="35" width="6" height="20" fill="#38bdf8"/>
    <rect x="190" y="38" width="8" height="17" fill="#ef4444"/>
    <rect x="200" y="33" width="5" height="22" fill="#10b981"/>
    <rect x="182" y="65" width="10" height="20" fill="#f59e0b"/>
    <rect x="194" y="68" width="7" height="17" fill="#a855f7"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M 10 170 L 230 170 L 220 210 L 20 210 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <!-- Desk front edge highlight -->
  <path d="M 10 170 L 230 170" stroke="#475569" stroke-width="2"/>

  <!-- Props on Desk -->
  <!-- Laptop showing error/crash screen (the mini-disaster) -->
  <g transform="translate(140, 115)">
    <!-- Laptop Base -->
    <path d="M -15 55 L 45 55 L 55 63 L -25 63 Z" fill="#64748b"/>
    <!-- Laptop Screen Back -->
    <rect x="-20" y="5" width="65" height="52" rx="4" fill="#475569"/>
    <!-- Screen Display -->
    <rect x="-16" y="9" width="57" height="44" fill="#0f172a"/>
    <!-- Error graphics on screen -->
    <circle cx="12" cy="25" r="10" fill="#ef4444" opacity="0.2"/>
    <path d="M 8 21 L 16 29 M 16 21 L 8 29" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <rect x="-10" y="38" width="30" height="4" rx="2" fill="#38bdf8"/>
    <rect x="-10" y="45" width="20" height="3" rx="1.5" fill="#64748b"/>
  </g>

  <!-- Spilled Coffee Cup (The "human-made" accident/disaster trigger) -->
  <g transform="translate(95, 145)">
    <!-- Spill puddle -->
    <path d="M -20 15 C -20 22, 25 25, 35 18 C 45 12, 35 2, 20 -2 C 5 -5, -20 8, -20 15 Z" fill="#b45309" opacity="0.85"/>
    <ellipse cx="28" cy="12" rx="4" ry="2" fill="#d97706" opacity="0.9"/>
    <!-- Toppled Cup -->
    <g transform="rotate(-75) translate(-10, -5)">
      <path d="M 0 0 L 14 0 L 12 18 L 2 18 Z" fill="#f8fafc" filter="url(#shadow)"/>
      <!-- Coffee inside tipped cup -->
      <ellipse cx="7" cy="9" rx="5" ry="5" fill="url(#coffeeFluid)"/>
      <!-- Handle -->
      <path d="M 12 4 C 18 4, 18 14, 12 14" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Main Character (Worried worker realizing it was human error) -->
  <g transform="translate(60, 80)">
    <!-- Character Body / Torso (Blue shirt) -->
    <path d="M 15 45 C 10 45, 0 55, -8 90 L 52 90 C 45 55, 30 45, 25 45 Z" fill="#38bdf8" filter="url(#shadow)"/>
    <!-- Collar / Tie -->
    <path d="M 13 45 L 20 45 L 22 58 L 16 62 L 11 58 Z" fill="#ffffff"/>
    <polygon points="15,58 18,58 16.5,75" fill="#ef4444"/>

    <!-- Head & Face -->
    <g transform="translate(16, 22)">
      <!-- Neck -->
      <rect x="1" y="16" width="10" height="8" fill="#fcd34d"/>
      <!-- Head shape -->
      <circle cx="6" cy="2" r="18" fill="#fcd34d" filter="url(#shadow)"/>
      <!-- Hair (Dark brown/black neat styled hair) -->
      <path d="M -11 2 C -11 -9, -3 -16, 8 -16 C 18 -16, 22 -6, 23 4 C 23 4, 21 -2, 16 -6 C 10 -10, 2 -8, -3 -4 C -8 0, -11 2, -11 2 Z" fill="#1e293b"/>

      <!-- Shocked Expression / Eyes Wide -->
      <circle cx="0" cy="1" r="3" fill="#1e293b"/>
      <circle cx="12" cy="1" r="3" fill="#1e293b"/>
      <!-- Eyebrows raised high in realization/surprise -->
      <path d="M -3 -6 C -1 -8, 3 -8, 5 -6" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 9 -6 C 11 -8, 15 -8, 17 -6" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Open shocked mouth ("O" shape) -->
      <ellipse cx="6" cy="11" rx="4" ry="5" fill="#78350f"/>

      <!-- Sweat drop (classic sign of stress/mistake) -->
      <path d="M 21 -3 C 21 -3, 25 2, 25 5 C 25 7, 23 9, 21 9 C 19 9, 17 7, 17 5 C 17 2, 21 -3, 21 -3 Z" fill="#38bdf8" opacity="0.9"/>
    </g>

    <!-- Arms & Hands expressing realization (Hands holding head in regret) -->
    <!-- Left arm -->
    <path d="M -5 50 C -25 50, -15 25, 3 20" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="3" cy="20" r="5" fill="#fcd34d"/>
    <!-- Right arm -->
    <path d="M 37 50 C 57 50, 45 25, 27 20" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="27" cy="20" r="5" fill="#fcd34d"/>
  </g>

  <!-- Magnifying glass examining the spill/error (Action metaphor for investigating the cause) -->
  <g transform="translate(130, 155)">
    <!-- Handle -->
    <path d="M 0 0 L -18 18" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Glass Rim -->
    <circle cx="15" cy="-15" r="14" fill="none" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="15" cy="-15" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <!-- Highlight on lens -->
    <path d="M 7 -22 C 10 -25, 16 -25, 20 -22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Foreground Atmospheric Particles / Dust motes floating (adds depth) -->
  <circle cx="40" cy="120" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="190" cy="130" r="2" fill="#94a3b8" opacity="0.4"/>
  <circle cx="110" cy="70" r="1" fill="#94a3b8" opacity="0.7"/>
  <circle cx="205" cy="190" r="1.5" fill="#94a3b8" opacity="0.5"/>
</svg>