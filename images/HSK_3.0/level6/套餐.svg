<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow -->
  <circle cx="120" cy="120" r="80" fill="#FF9F43" opacity="0.05" filter="blur(20px)"/>

  <!-- Tray / Base of the Set Meal -->
  <g transform="translate(0, 15)">
    <!-- Main Tray Shadow -->
    <rect x="36" y="65" width="168" height="120" rx="16" fill="#101216" opacity="0.5"/>
    
    <!-- Main Tray Body -->
    <rect x="40" y="60" width="160" height="120" rx="14" fill="#2D323B" stroke="#3A404D" stroke-width="2"/>
    
    <!-- Tray Inner Compartment Area -->
    <rect x="52" y="72" width="136" height="96" rx="8" fill="#22262E"/>

    <!-- COMPONENT 1: Main Dish (Burger representing the fast-food set) -->
    <g transform="translate(68, 86)">
      <!-- Burger Shadow -->
      <ellipse cx="28" cy="46" rx="20" ry="6" fill="#15181D"/>
      
      <!-- Bottom Bun -->
      <path d="M 10 40 Q 10 48 28 48 Q 46 48 46 40 Z" fill="#E67E22"/>
      
      <!-- Patty -->
      <rect x="8" y="34" width="40" height="7" rx="3.5" fill="#8E44AD"/>
      
      <!-- Cheese Slice (Yellow accent) -->
      <polygon points="10,34 46,34 40,39 16,39" fill="#F1C40F"/>
      
      <!-- Lettuce -->
      <path d="M 8 31 C 12 34 16 30 20 33 C 24 36 28 30 32 33 C 36 36 40 31 44 33 L 44 31 L 8 31 Z" fill="#2ECC71"/>
      
      <!-- Top Bun -->
      <path d="M 10 31 Q 10 16 28 16 Q 46 16 46 31 Z" fill="#E67E22"/>
      
      <!-- Sesame Seeds -->
      <circle cx="20" cy="22" r="1.2" fill="#FDE3A7"/>
      <circle cx="28" cy="19" r="1.2" fill="#FDE3A7"/>
      <circle cx="36" cy="23" r="1.2" fill="#FDE3A7"/>
    </g>

    <!-- COMPONENT 2: Drink Cup with Straw -->
    <g transform="translate(142, 86)">
      <!-- Cup Shadow -->
      <ellipse cx="18" cy="62" rx="12" ry="4" fill="#15181D"/>
      
      <!-- Cup Body -->
      <path d="M 8 18 L 11 60 C 11 62 13 64 15 64 L 21 64 C 23 64 25 62 25 60 L 28 18 Z" fill="#3498DB"/>
      
      <!-- Cup Lid -->
      <ellipse cx="18" cy="18" rx="10" ry="3" fill="#ECF0F1"/>
      
      <!-- Straw -->
      <path d="M 18 15 L 23 4 L 27 2" fill="none" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Drink Strip Accent -->
      <path d="M 12 28 L 24 28" stroke="#2980B9" stroke-width="3" opacity="0.6"/>
      <path d="M 11 40 L 25 40" stroke="#2980B9" stroke-width="3" opacity="0.6"/>
    </g>

    <!-- COMPONENT 3: Side Dish / Fries in container -->
    <g transform="translate(68, 142)">
      <!-- Fries Container -->
      <path d="M 14 6 L 10 34 C 10 36 12 38 14 38 L 26 38 C 28 38 30 36 30 34 L 26 6 Z" fill="#E74C3C"/>
      
      <!-- Fries (Sticks) -->
      <rect x="13" y="0" width="3" height="12" rx="1.5" fill="#F1C40F"/>
      <rect x="17" y="-4" width="3" height="16" rx="1.5" fill="#F1C40F"/>
      <rect x="21" y="-2" width="3" height="14" rx="1.5" fill="#F39C12"/>
      <rect x="24" y="2" width="3" height="10" rx="1.5" fill="#F1C40F"/>
      
      <!-- Container Stripe -->
      <path d="M 12 18 L 28 18" stroke="#C0392B" stroke-width="4"/>
    </g>

    <!-- COMPONENT 4: Small Sauce / Dip Container (Balancing the tray) -->
    <g transform="translate(112, 142)">
      <ellipse cx="14" cy="20" rx="12" ry="8" fill="#BDC3C7"/>
      <ellipse cx="14" cy="18" rx="10" ry="6" fill="#E74C3C"/>
      <ellipse cx="14" cy="18" rx="6" ry="3.5" fill="#C0392B"/>
    </g>
  </g>

  <!-- Accent Focus / Value Indicator (Gold Tag on top corner) -->
  <g transform="translate(170, 28)">
    <circle cx="16" cy="16" r="16" fill="#FF9F43"/>
    <!-- Check / Star / Bundle Icon inside badge -->
    <path d="M 10 16 L 14 20 L 22 11" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>