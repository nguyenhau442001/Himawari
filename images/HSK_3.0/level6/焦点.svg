<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlightGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric background glow -->
  <circle cx="120" cy="90" r="90" fill="url(#spotlightGlow)"/>

  <!-- Background Environment: Press conference / Presentation backdrop -->
  <g opacity="0.4">
    <rect x="40" y="45" width="160" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Abstract graphical presentation elements on screen -->
    <rect x="55" y="60" width="40" height="25" rx="3" fill="#38bdf8"/>
    <rect x="105" y="65" width="80" height="6" rx="3" fill="#64748b"/>
    <rect x="105" y="78" width="50" height="6" rx="3" fill="#64748b"/>
    <line x1="55" y1="105" x2="185" y2="105" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Stage Floor & Podium -->
  <path d="M 20 190 L 220 190 L 235 225 L 5 225 Z" fill="url(#stageGrad)"/>
  <ellipse cx="120" cy="190" rx="100" ry="8" fill="#0f172a"/>

  <!-- Speaker's Podium -->
  <path d="M 95 140 L 145 140 L 155 195 L 85 195 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <rect x="100" y="145" width="40" height="25" rx="4" fill="#1e293b"/>
  <circle cx="120" cy="157" r="6" fill="#10b981"/>

  <!-- Central Focus Subject (Speaker at Podium) -->
  <g>
    <!-- Body / Suit -->
    <path d="M 95 160 C 95 150, 145 150, 145 160 L 150 195 L 90 195 Z" fill="#0ea5e9"/>
    <!-- Shirt collar & tie -->
    <polygon points="120,158 112,148 128,148" fill="#f8fafc"/>
    <polygon points="120,158 117,175 123,175" fill="#f43f5e"/>
    
    <!-- Head & Face -->
    <circle cx="120" cy="122" r="18" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 102 122 C 102 106, 138 106, 138 122 C 138 112, 102 112, 102 122 Z" fill="#334155"/>
    <!-- Expressive confident face features -->
    <circle cx="113" cy="120" r="2" fill="#1e293b"/>
    <circle cx="127" cy="120" r="2" fill="#1e293b"/>
    <path d="M 116 128 Q 120 132 124 128" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Gesturing Arm -->
    <path d="M 100 155 C 85 160, 80 145, 90 140" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
    <circle cx="89" cy="138" r="5" fill="#fed7aa"/>
  </g>

  <!-- Focused Audience / Reporters in the Foreground (Silhouette/Semi-detailed) -->
  <g>
    <!-- Left Audience Member -->
    <path d="M 25 225 C 25 205, 45 200, 55 225 Z" fill="#334155"/>
    <circle cx="40" cy="195" r="11" fill="#cbd5e1"/>
    <!-- Camera/Phone held up -->
    <rect x="45" y="180" width="12" height="8" rx="2" fill="#94a3b8"/>
    <line x1="57" y1="184" x2="63" y2="182" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="51" cy="184" r="3" fill="#38bdf8"/>

    <!-- Right Audience Member -->
    <path d="M 215 225 C 215 205, 195 200, 185 225 Z" fill="#334155"/>
    <circle cx="200" cy="195" r="11" fill="#94a3b8"/>
    <!-- Notepad/Recording device -->
    <rect x="180" y="195" width="14" height="10" rx="1" fill="#f8fafc"/>
    <line x1="183" y1="198" x2="191" y2="198" stroke="#64748b" stroke-width="1.5"/>
    <line x1="183" y1="202" x2="189" y2="202" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Dramatic Overhead Spotlight Cone (Emphasizing 'Focus' / Tiêu điểm) -->
  <polygon points="120,0 60,240 180,240" fill="url(#spotlightGlow)" style="mix-blend-mode: overlay;"/>

  <!-- Golden Target / Focus Ring Graphic floating subtly over the speaker to visually represent 'Tiêu điểm' -->
  <g transform="translate(120, 115)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    <!-- Focus crosshairs -->
    <line x1="-42" y1="0" x2="-34" y2="0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="0" x2="42" y2="0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-42" x2="0" y2="-34" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="34" x2="0" y2="42" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>