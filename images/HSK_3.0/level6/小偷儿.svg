<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subway pole suggestion -->
  <rect x="180" y="0" width="12" height="240" fill="#2D343E"/>
  
  <!-- The Thief Character -->
  <g transform="translate(60, 60)">
    <!-- Hoodie -->
    <path d="M60 20 C40 20 20 40 20 80 L20 140 L100 140 L100 80 C100 40 80 20 60 20 Z" fill="#3D4552"/>
    <!-- Face Shadow -->
    <path d="M60 30 C45 30 35 40 35 60 L85 60 C85 40 75 30 60 30 Z" fill="#1A1D24"/>
    <!-- Eyes (Sly/Hidden) -->
    <rect x="45" y="45" width="8" height="4" rx="2" fill="#FFB84D"/>
    <rect x="67" y="45" width="8" height="4" rx="2" fill="#FFB84D"/>
    
    <!-- Hand reaching into pocket -->
    <path d="M85 100 C95 100 105 110 105 120 L105 130 C105 135 100 140 95 140 L80 140 Z" fill="#5D6778"/>
    <circle cx="95" cy="125" r="15" fill="#FFB84D" opacity="0.2"/>
  </g>
  
  <!-- The Target (Wallet) -->
  <rect x="130" y="140" width="40" height="25" rx="4" fill="#FFB84D"/>
  <rect x="130" y="145" width="40" height="5" fill="#E69E2D"/>
  
  <!-- Motion/Stealth lines -->
  <path d="M110 130 L130 140" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4"/>
</svg>