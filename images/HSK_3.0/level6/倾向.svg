<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Workspace Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Glow -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Window -->
  <g id="environment">
    <!-- Window Frame in Background -->
    <rect x="25" y="30" width="60" height="75" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="35" width="23" height="32" rx="2" fill="url(#windowGlow)"/>
    <rect x="57" y="35" width="23" height="32" rx="2" fill="url(#windowGlow)"/>
    <rect x="30" y="70" width="23" height="30" rx="2" fill="url(#windowGlow)"/>
    <rect x="57" y="70" width="23" height="30" rx="2" fill="url(#windowGlow)"/>

    <!-- Bookshelf / Prop on wall -->
    <rect x="175" y="45" width="40" height="6" rx="2" fill="#475569"/>
    <path d="M185 45 L185 30 L193 30 L193 45 Z" fill="#f43f5e"/>
    <path d="M196 45 L196 26 L204 26 L204 45 Z" fill="#10b981"/>
    <path d="M207 45 L207 33 L212 33 L212 45 Z" fill="#f59e0b"/>

    <!-- Desk Surface -->
    <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
    <rect x="0" y="165" width="240" height="5" fill="#475569" />
  </g>

  <!-- Desk Props & Complex Tangled Problem Node -->
  <g id="desk-props">
    <!-- Complex Scribble Paper / Tangled Problem (Symbolizing the complicated problem) -->
    <path d="M 50 165 C 45 155, 60 145, 52 135 C 46 127, 35 135, 40 125 C 45 115, 60 120, 65 110" 
          fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2"/>
    <circle cx="58" cy="120" r="12" fill="#cbd5e1" opacity="0.9"/>
    <!-- Red tangled lines on paper -->
    <path d="M 52 114 C 55 125, 62 115, 64 126" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <path d="M 50 120 C 58 116, 52 124, 60 120" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Laptop Computer showing simplification (Complex graph turning into simple clean bar) -->
    <rect x="135" y="125" width="60" height="38" rx="3" fill="#64748b"/>
    <rect x="138" y="128" width="54" height="30" rx="2" fill="#0f172a"/>
    <!-- Screen content: arrow pointing from chaotic nodes to a single clean block -->
    <path d="M 148 148 L 158 140 L 168 145 L 178 135" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="176" y="138" width="10" height="15" rx="1.5" fill="#10b981"/> <!-- Clean result -->
    <!-- Laptop Base -->
    <path d="M 125 163 L 205 163 L 210 167 L 120 167 Z" fill="#94a3b8"/>

    <!-- Coffee Mug -->
    <rect x="105" y="145" width="14" height="18" rx="2" fill="#f8fafc"/>
    <path d="M 119 149 C 124 149, 124 159, 119 159" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam -->
    <path d="M 109 140 C 111 135, 107 130, 109 125" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Main Character (Smart, decisive professional actively simplifying) -->
  <g id="main-character">
    <!-- Character Body & Chair -->
    <rect x="80" y="115" width="35" height="55" rx="8" fill="#3b82f6"/> <!-- Blue Shirt -->
    <path d="M 75 140 L 90 125 L 105 140 Z" fill="#1e293b"/> <!-- Collar / Necktie area -->
    
    <!-- Arms actively gesturing / sliding to simplify -->
    <!-- Back arm (holding or resting) -->
    <path d="M 95 125 L 75 145 L 85 155" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Head -->
    <circle cx="95" cy="85" r="18" fill="#fbcfe8"/> <!-- Face skin -->
    
    <!-- Hair (Trendy modern dark hair) -->
    <path d="M 78 85 C 77 70, 90 65, 105 72 C 112 75, 114 85, 112 90 L 112 85 C 112 75, 100 70, 90 73 C 83 75, 79 80, 78 85 Z" fill="#334155"/>

    <!-- Facial Expression: Confident, focused, smiling with clarity -->
    <circle cx="89" cy="83" r="2" fill="#1e293b"/>
    <circle cx="101" cy="83" r="2" fill="#1e293b"/>
    <!-- Confident smile -->
    <path d="M 92 92 C 94 95, 98 95, 100 92" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Glasses for intellectual look -->
    <rect x="86" y="79" width="7" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="97" y="79" width="7" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="93" y1="82" x2="97" y2="82" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Front Arm reaching forward to touch / organize / simplify -->
    <path d="M 105 130 C 115 135, 125 140, 135 138" fill="none" stroke="#3b82f6" stroke-width="11" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="138" cy="137" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Visual Metaphor for "Simplifying" (Transforming chaotic tangled elements into a neat sorted structure) -->
  <g id="simplification-metaphor">
    <!-- Floating visual action lines showing transition from complex to simple -->
    <!-- Complex cloud on the left -->
    <g transform="translate(45, 80)" opacity="0.8">
      <path d="M 10 15 C 5 15, 2 10, 5 5 C 8 0, 15 2, 18 6 C 22 2, 28 5, 26 10 C 30 12, 28 18, 24 18 Z" fill="#cbd5e1"/>
      <path d="M 8 10 L 20 12" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <path d="M 12 7 L 16 15" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Glowing Arrow of "Tendency / Direction" (倾向) -->
    <path d="M 80 85 C 100 70, 120 70, 135 80" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
    <path d="M 130 75 L 138 81 L 130 87" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Clean organized blocks on the right (The Simplified Result) -->
    <g transform="translate(155, 75)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#10b981"/>
      <path d="M 4 8 L 7 11 L 12 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="20" y="4" width="16" height="16" rx="3" fill="#38bdf8"/>
      <circle cx="28" cy="12" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Foreground Lighting & Atmosphere Accents -->
  <circle cx="190" cy="190" r="40" fill="#38bdf8" opacity="0.05" filter="blur(20px)"/>
  <circle cx="60" cy="50" r="30" fill="#f59e0b" opacity="0.05" filter="blur(15px)"/>
</svg>