<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Accent Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment & Interior Setup -->
  <!-- Bookshelf / Office Wall Elements -->
  <rect x="25" y="40" width="70" height="90" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="35" y="60" width="50" height="8" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="35" y="85" width="40" height="8" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="35" y="110" width="45" height="8" rx="2" fill="#475569" opacity="0.6"/>

  <!-- Warm Hanging Lamp -->
  <circle cx="120" cy="30" r="45" fill="url(#lamp-glow)"/>
  <path d="M115 0 L125 0 L128 25 L112 25 Z" fill="#64748b"/>
  <circle cx="120" cy="25" r="16" fill="#fbbf24" filter="url(#shadow)"/>

  <!-- Window Frame showing night city / stars -->
  <rect x="150" y="35" width="60" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <line x1="180" y1="35" x2="180" y2="120" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="77" x2="210" y2="77" stroke="#334155" stroke-width="2"/>
  <!-- Tiny glowing windows in distance -->
  <rect x="160" y="45" width="8" height="12" fill="#fbbf24" opacity="0.7"/>
  <rect x="190" y="90" width="10" height="15" fill="#38bdf8" opacity="0.5"/>
  <rect x="165" y="95" width="6" height="8" fill="#fbbf24" opacity="0.6"/>

  <!-- Desk Surface -->
  <path d="M 10 180 L 230 180 L 220 210 L 20 210 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="176" width="210" height="6" rx="3" fill="#475569"/>

  <!-- Desk Props: Laptop, Coffee Mug, Plant -->
  <!-- Laptop -->
  <path d="M 50 178 L 90 178 L 95 160 L 45 160 Z" fill="#64748b"/>
  <rect x="42" y="177" width="56" height="3" rx="1.5" fill="#94a3b8"/>
  <path d="M 48 130 L 87 130 C 89 130 90 131 90 133 L 87 160 C 87 161 86 162 85 162 L 50 162 C 49 162 48 161 48 160 L 45 133 C 45 131 46 130 48 130 Z" fill="#1e293b"/>
  <rect x="51" y="135" width="33" height="22" rx="1" fill="#38bdf8" opacity="0.85"/>
  
  <!-- Coffee Mug -->
  <rect x="185" y="152" width="16" height="20" rx="3" fill="#f43f5e"/>
  <path d="M 201 157 C 206 157 207 165 201 167" stroke="#f43f5e" stroke-width="2.5" fill="none"/>
  <!-- Steam lines indicating fresh coffee -->
  <path d="M 190 144 Q 193 140 190 136" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 195 146 Q 198 142 195 138" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Main Character (Decisive, prompt agreement action) -->
  <g transform="translate(100, 70)" filter="url(#shadow)">
    <!-- Character Body / Torso -->
    <path d="M 25 70 L 65 70 C 72 70 78 76 78 83 L 78 110 L 12 110 L 12 83 C 12 76 18 70 25 70 Z" fill="url(#shirt-grad)"/>
    
    <!-- Collar & Tie Detail -->
    <polygon points="32,70 45,85 58,70" fill="#ffffff"/>
    <polygon points="41,83 45,100 49,83" fill="#f43f5e"/>

    <!-- Head & Face -->
    <path d="M 30 35 C 30 20 42 15 45 15 C 48 15 60 20 60 35 C 60 50 48 55 45 55 C 42 55 30 50 30 35 Z" fill="#ffedd5"/>
    
    <!-- Hair -->
    <path d="M 30 32 C 30 18 40 13 46 13 C 56 13 60 22 61 32 C 61 32 55 25 45 25 C 35 25 30 32 30 32 Z" fill="#334155"/>

    <!-- Determined Expression & Forward Lean -->
    <!-- Confident Eyes -->
    <circle cx="39" cy="35" r="2.5" fill="#1e293b"/>
    <circle cx="51" cy="35" r="2.5" fill="#1e293b"/>
    <!-- Determined Eyebrows (Slanted down sharply) -->
    <line x1="36" y1="30" x2="43" y2="32" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="47" y1="32" x2="54" y2="30" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Confident Smile -->
    <path d="M 41 45 Q 45 49 49 45" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Arms: Energetically pointing/touching screen to agree immediately (毫不犹豫 - No hesitation) -->
    <!-- Back Arm -->
    <path d="M 20 75 Q 5 80 15 100" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Front Arm reaching forward decisively, tapping the contract/screen -->
    <path d="M 70 75 Q 95 80 100 85" stroke="url(#shirt-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Hand pressing down instantly -->
    <circle cx="103" cy="86" r="6" fill="#ffedd5"/>
  </g>

  <!-- Contract / Agreement Document Floating / Placed on Desk -->
  <g transform="translate(85, 135) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="55" height="45" rx="3" fill="#ffffff"/>
    <!-- Text lines mockup -->
    <rect x="8" y="8" width="30" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="8" y="16" width="39" height="3" rx="1.5" fill="#e2e8f0"/>
    <rect x="8" y="23" width="25" height="3" rx="1.5" fill="#e2e8f0"/>
    <!-- Big energetic checkmark stamp of immediate agreement -->
    <circle cx="38" cy="32" r="9" fill="#10b981"/>
    <path d="M 33 32 L 36 35 L 44 27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Visual Action Sparkles (Representing lightning-fast decision / 毫不 hesitation-free action) -->
  <g transform="translate(180, 75)">
    <path d="M 0 0 L -6 10 L 2 12 L -4 22 L 8 8 L 1 6 Z" fill="#fbbf24" filter="url(#shadow)"/>
  </g>
  <g transform="translate(50, 60) scale(0.6)">
    <path d="M 0 0 L -6 10 L 2 12 L -4 22 L 8 8 L 1 6 Z" fill="#38bdf8" filter="url(#shadow)"/>
  </g>
</svg>