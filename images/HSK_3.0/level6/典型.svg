<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Board Glow -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Highlight Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT / CLASSROOM OR STUDIO BACKGROUND -->
  <!-- Ambient interior lines -->
  <line x1="20" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Large Presentation Board (The "Example" Display) -->
  <rect x="50" y="35" width="140" height="95" rx="8" fill="url(#boardGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="58" y="43" width="124" height="79" rx="4" fill="#0f172a"/>

  <!-- Board Content: Illustrating a "Typical Case" (Graph + Target Star) -->
  <!-- Subtle Grid lines -->
  <line x1="75" y1="100" x2="165" y2="100" stroke="#1e293b" stroke-width="1"/>
  <line x1="75" y1="80" x2="165" y2="80" stroke="#1e293b" stroke-width="1"/>
  <line x1="75" y1="60" x2="165" y2="60" stroke="#1e293b" stroke-width="1"/>

  <!-- Bar Chart representing data points -->
  <rect x="83" y="75" width="14" height="25" rx="2" fill="#334155"/>
  <rect x="103" y="65" width="14" height="35" rx="2" fill="#334155"/>
  
  <!-- THE TYPICAL/EXEMPLARY CASE (Highlighted distinctively with golden accent) -->
  <rect x="123" y="48" width="14" height="52" rx="2" fill="#f59e0b"/>
  <!-- Glow behind the exemplary bar -->
  <circle cx="130" cy="74" r="22" fill="url(#goldGlow)"/>

  <rect x="143" y="85" width="14" height="15" rx="2" fill="#334155"/>

  <!-- Connecting pointer/check graphic above the typical case -->
  <path d="M 130 42 L 135 32 L 125 32 Z" fill="#fbbf24"/>
  
  <!-- Desk Surface -->
  <path d="M 30 205 L 210 205 L 220 220 L 20 220 Z" fill="#334155" opacity="0.6"/>
  <rect x="20" y="200" width="200" height="6" rx="3" fill="#64748b"/>

  <!-- Props on desk -->
  <!-- Laptop -->
  <path d="M 45 200 L 75 200 L 78 203 L 42 203 Z" fill="#94a3b8"/>
  <rect x="48" y="185" width="24" height="15" rx="2" fill="#cbd5e1" transform="skewX(-10)"/>

  <!-- Coffee Mug -->
  <rect x="175" y="188" width="12" height="14" rx="2" fill="#ec4899"/>
  <path d="M 187 191 C 192 191 192 199 187 199" stroke="#ec4899" stroke-width="2" fill="none"/>

  <!-- MAIN CHARACTER (Teacher/Presenter explaining the typical example) -->
  <!-- Character Body / Torso -->
  <path d="M 100 220 C 100 185 140 185 140 220 Z" fill="#38bdf8"/>
  <!-- Collar / Shirt details -->
  <polygon points="120,190 126,202 114,202" fill="#f8fafc"/>

  <!-- Character Neck & Head -->
  <rect x="115" y="156" width="10" height="14" fill="#fbcfe8"/>
  <circle cx="120" cy="142" r="18" fill="#fbcfe8"/>

  <!-- Hair -->
  <path d="M 102 140 C 102 126 138 126 138 140 C 138 146 134 150 134 150 C 134 150 128 136 120 136 C 112 136 106 148 106 148 C 106 148 102 144 102 140 Z" fill="#0f172a"/>

  <!-- Face expression: Confident, engaging smile -->
  <circle cx="114" cy="140" r="1.5" fill="#0f172a"/>
  <circle cx="126" cy="140" r="1.5" fill="#0f172a"/>
  <path d="M 117 148 Q 120 152 123 148" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Gesture / Pointing Arm directing attention to the exemplary bar chart -->
  <!-- Upper Arm -->
  <path d="M 130 190 Q 148 175 155 160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Forearm & Pointer Finger -->
  <path d="M 155 160 L 175 140" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
  <!-- Pointer Stick -->
  <path d="M 172 142 L 195 120" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="195" cy="120" r="3" fill="#fbbf24"/>

  <!-- Left Arm (resting naturally) -->
  <path d="M 110 195 Q 100 205 105 215" stroke="#0284c7" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Foreground Atmospheric Particles / Sparkles for "Key/Exemplary" emphasis -->
  <circle cx="130" cy="25" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="90" cy="45" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="160" cy="35" r="2.5" fill="#fbbf24" opacity="0.9"/>
  <path d="M 158 95 L 162 95 L 160 93 Z" fill="#fbbf24"/>
</svg>