<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <clipPath id="emblemClip">
      <circle cx="120" cy="95" r="32" />
    </clipPath>
  </defs>

  <!-- Background and Ambient Glow -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" fill="url(#spotlight)" />

  <!-- Architecture & Interior Environment (Museum / Design Gallery) -->
  <!-- Back Wall & Floor Line -->
  <line x1="20" y1="180" x2="220" y2="180" stroke="#334155" stroke-width="2" />
  <!-- Display Pedestal / Gallery Stand -->
  <path d="M 90,180 L 150,180 L 140,210 L 100,210 Z" fill="#334155" />
  <polygon points="90,180 150,180 155,185 85,185" fill="#475569" />
  <polygon points="100,210 140,210 145,218 95,218" fill="#1e293b" />

  <!-- Track Lighting Beam pointing down to the Famous Brand/Trademark Emblem -->
  <polygon points="120,40 80,180 160,180" fill="url(#beam)" />
  <circle cx="120" cy="40" r="4" fill="#94a3b8" />

  <!-- THE FAMOUS TRADEMARK / EMBLEM DISPLAYED ON PEDESTAL -->
  <!-- Golden Glowing Backdrop Circle -->
  <circle cx="120" cy="95" r="38" fill="#f59e0b" opacity="0.25" />
  <circle cx="120" cy="95" r="34" fill="#1e293b" stroke="#fbbf24" stroke-width="3" />
  
  <!-- Stylized Famous Trademark Graphic (Abstract Crown / Rising Star motif) -->
  <g clip-path="url(#emblemClip)">
    <circle cx="120" cy="95" r="30" fill="#0f172a" />
    <!-- Rays / Sparkles behind -->
    <path d="M120,65 L120,125 M90,95 L150,95 M98,73 L142,117 M98,117 L142,73" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" />
    <!-- Central Crown/Shield Trademark Shape -->
    <path d="M 105,108 L 105,85 L 120,73 L 135,85 L 135,108 Z" fill="#fbbf24" />
    <path d="M 112,108 L 112,90 L 120,83 L 128,90 L 128,108 Z" fill="#f59e0b" />
    <!-- Glowing Star atop the Trademark -->
    <polygon points="120,60 122,66 128,66 123,70 125,76 120,72 115,76 117,70 112,66 118,66" fill="#ffffff" />
  </g>
  <!-- Metallic Pin/Mount connecting emblem to pedestal/wall -->
  <rect x="117" y="127" width="6" height="15" fill="#94a3b8" rx="2" />

  <!-- Supporting Characters (Art Director and Visitor admiring the famous trademark) -->
  <!-- Character 1: Woman on the left pointing/presenting -->
  <g transform="translate(35, 120)">
    <!-- Body / Jacket -->
    <path d="M 25,60 C 25,45 35,40 45,40 C 55,40 65,45 65,60 L 60,90 L 30,90 Z" fill="#38bdf8" />
    <!-- Head & Hair -->
    <circle cx="45" cy="24" r="14" fill="#fcd34d" />
    <path d="M 31,24 C 31,12 59,12 59,24 C 59,32 55,34 55,34 L 35,34 C 35,34 31,32 31,24 Z" fill="#1e293b" />
    <!-- Arm pointing towards the trademark -->
    <path d="M 55,45 L 75,55 L 70,62 L 50,52 Z" fill="#38bdf8" />
    <!-- Skirt / Lower body -->
    <path d="M 30,90 L 60,90 L 65,115 L 25,115 Z" fill="#0f172a" />
    <!-- Legs -->
    <rect x="34" y="115" width="6" height="25" fill="#334155" />
    <rect x="50" y="115" width="6" height="25" fill="#334155" />
  </g>

  <!-- Character 2: Man on the right taking notes / observing -->
  <g transform="translate(145, 115)">
    <!-- Body / Sweater -->
    <path d="M 25,45 C 25,35 35,30 45,30 C 55,30 65,35 65,45 L 60,95 L 30,95 Z" fill="#ec4899" />
    <!-- Head & Hair -->
    <circle cx="45" cy="18" r="13" fill="#fcd34d" />
    <path d="M 32,16 C 33,6 57,6 58,16 C 58,18 52,14 45,14 C 38,14 32,16 32,16 Z" fill="#475569" />
    <!-- Glasses -->
    <circle cx="41" cy="18" r="3.5" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="50" cy="18" r="3.5" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <!-- Arms & Notepad -->
    <path d="M 32,48 L 18,58 L 24,66 L 38,54 Z" fill="#ec4899" />
    <!-- Notepad prop -->
    <rect x="14" y="56" width="14" height="18" rx="2" fill="#f8fafc" />
    <line x1="17" y1="61" x2="25" y2="61" stroke="#cbd5e1" stroke-width="1" />
    <line x1="17" y1="66" x2="23" y2="66" stroke="#cbd5e1" stroke-width="1" />
    <!-- Legs -->
    <rect x="34" y="95" width="7" height="30" fill="#334155" />
    <rect x="49" y="95" width="7" height="30" fill="#334155" />
  </g>

  <!-- Foreground Atmospheric Elements (Subtle bokeh / lighting particles) -->
  <circle cx="80" cy="80" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="160" cy="70" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="100" cy="140" r="1" fill="#38bdf8" opacity="0.7" />
  <circle cx="145" cy="150" r="2" fill="#38bdf8" opacity="0.4" />
</svg>