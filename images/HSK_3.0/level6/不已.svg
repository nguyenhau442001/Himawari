<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Sound Waves / Continuous Ripples radiating from center -->
    <circle cx="120" cy="115" r="75" fill="none" stroke="#2D3340" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
    <circle cx="120" cy="115" r="55" fill="none" stroke="#3A4254" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="115" r="35" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
    
    <!-- Outer Glow for Emotion / Endless impact -->
    <circle cx="120" cy="115" r="28" fill="#F59E0B" opacity="0.15"/>

    <!-- Megaphone / Communication Object representing the News (捷报) -->
    <g transform="translate(120, 115) rotate(-35)">
      <!-- Megaphone Body -->
      <path d="M-15 -10 L15 -22 L15 22 L-15 10 Z" fill="#3B82F6"/>
      <!-- Megaphone Opening / Cone -->
      <ellipse cx="15" cy="0" rx="6" ry="22" fill="#60A5FA"/>
      <!-- Handle -->
      <rect x="-12" y="10" width="6" height="14" rx="3" fill="#1E40AF"/>
      <!-- Small Sound Lines Emitting -->
      <path d="M 24 -10 C 28 -5, 28 5, 24 10" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M 30 -16 C 36 -8, 36 8, 30 16" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Pulsing emotional energy stars / continuous action -->
    <path d="M 75 70 L 78 78 L 86 81 L 78 84 L 75 92 L 72 84 L 64 81 L 72 78 Z" fill="#F59E0B"/>
    <path d="M 165 140 L 167 145 L 172 147 L 167 149 L 165 154 L 163 149 L 158 147 L 163 145 Z" fill="#F59E0B"/>
    
    <!-- Infinity loop subtly integrated as glowing sparks representing 'Endless/Bu Yi' -->
    <path d="M 100 165 C 110 175, 130 175, 140 165 C 150 155, 150 140, 140 130 L 120 110 C 110 100, 90 100, 80 110 C 70 120, 70 135, 80 145 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>