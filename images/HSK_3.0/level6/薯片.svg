<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow behind the chips -->
  <circle cx="120" cy="125" r="70" fill="#FFB703" opacity="0.08" filter="blur(15px)"/>

  <!-- Open Snack Bag / Container base -->
  <path d="M 85 180 L 70 95 L 170 95 L 155 180 Q 120 190 85 180 Z" fill="#2B303C"/>
  
  <!-- Bag Inner Darkness -->
  <ellipse cx="120" cy="95" rx="50" ry="12" fill="#15171D"/>

  <!-- Bag Front Design (Modern Flat Style) -->
  <path d="M 87 110 L 73 175 Q 120 185 153 175 L 133 110 Z" fill="#D90429"/>
  <path d="M 100 110 L 90 178 Q 120 185 150 175 L 133 110 Z" fill="#EF233C" opacity="0.7"/>
  
  <!-- Bag Accents / Stripes -->
  <path d="M 80 135 L 160 135" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="148" r="10" fill="#FFB703"/>

  <!-- Wrinkled Top of Bag (Opened) -->
  <path d="M 70 95 Q 85 88 100 95 Q 120 88 140 95 Q 155 88 170 95 L 168 105 L 72 105 Z" fill="#EF233C"/>

  <!-- Falling / Floating Crispy Potato Chips (薯片) -->
  
  <!-- Chip 1 (Main Central Floating) -->
  <g transform="translate(120, 65) rotate(-15)">
    <path d="M -25 -20 Q -5 -35 20 -20 Q 35 0 20 25 Q -5 35 -25 20 Q -35 0 -25 -20 Z" fill="#F4D35E"/>
    <!-- Ridges / Texture Lines -->
    <path d="M -15 -10 Q 0 -5 10 -15" stroke="#E9C46A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M -18 5 Q 0 10 12 0" stroke="#E9C46A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M -10 15 Q 0 18 8 10" stroke="#E9C46A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Highlight -->
    <ellipse cx="-8" cy="-5" rx="4" ry="2" fill="#FFF" opacity="0.4" transform="rotate(-30 -8 -5)"/>
  </g>

  <!-- Chip 2 (Left Floating) -->
  <g transform="translate(65, 80) rotate(25)">
    <path d="M -20 -15 Q 0 -25 18 -12 Q 25 5 15 20 Q -5 25 -18 15 Q -25 0 -20 -15 Z" fill="#EE9B00"/>
    <path d="M -10 -8 Q 0 -2 8 -8" stroke="#CA6702" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -12 5 Q 0 8 10 2" stroke="#CA6702" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Chip 3 (Right Floating) -->
  <g transform="translate(175, 75) rotate(-40)">
    <path d="M -18 -15 Q 5 -22 18 -10 Q 22 8 12 18 Q -8 22 -16 12 Q -22 -2 -18 -15 Z" fill="#E9C46A"/>
    <path d="M -10 -5 Q 2 0 10 -8" stroke="#D4A373" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M -8 8 Q 2 12 8 4" stroke="#D4A373" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Chip 4 (Slightly overlapping bag rim, center-right) -->
  <g transform="translate(145, 90) rotate(10)">
    <path d="M -15 -12 Q 0 -18 15 -10 Q 18 10 8 15 Q -10 18 -15 8 Q -18 -2 -15 -12 Z" fill="#F4D35E"/>
    <path d="M -8 -6 Q 0 -2 6 -8" stroke="#E9C46A" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Extra Flavor/Crunch Sparks (Modern minimal accents) -->
  <circle cx="95" cy="50" r="2.5" fill="#FFB703"/>
  <circle cx="155" cy="45" r="2" fill="#F4D35E"/>
  <circle cx="185" cy="115" r="1.5" fill="#FFB703"/>
  <circle cx="55" cy="120" r="2" fill="#F4D35E"/>

</svg>