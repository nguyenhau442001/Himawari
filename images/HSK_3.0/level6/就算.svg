<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stormy weather contrast element -->
  <g transform="translate(40, 60)">
    <path d="M20 20 Q40 0 60 20 T100 20" stroke="#5D6D7E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M25 35 Q45 15 65 35 T105 35" stroke="#5D6D7E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="50" r="3" fill="#5D6D7E"/>
    <circle cx="70" cy="50" r="3" fill="#5D6D7E"/>
  </g>

  <!-- The "Even if" pivot point: A heavy stone block acting as a base -->
  <rect x="80" y="140" width="80" height="30" rx="4" fill="#34495E"/>
  
  <!-- The "Unchanged Plan" element: A sturdy, upright sapling in a pot -->
  <g transform="translate(120, 140)">
    <rect x="-15" y="-40" width="30" height="30" fill="#2C3E50"/>
    <path d="M0 -40 L-5 -60 L5 -60 Z" fill="#F39C12"/>
    <path d="M0 -60 L0 -85 M0 -70 L-10 -80 M0 -70 L10 -80" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The "Contrast/Escalation" indicator: A bold, unyielding arrow pointing straight up -->
  <path d="M120 180 L120 210 M110 190 L120 180 L130 190" stroke="#F39C12" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Visual Metaphor: The sapling remains upright despite the stormy lines above, 
       emphasizing the "Even if" (concession) and "Unchanged" (result) -->
  <rect x="40" y="170" width="160" height="4" rx="2" fill="#F39C12"/>
</svg>