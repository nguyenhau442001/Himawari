<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a" />
  
  <!-- Ambient lighting & interior setting -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" />
  
  <!-- Window view background -->
  <rect x="80" y="30" width="80" height="90" rx="4" fill="#090d16" />
  <rect x="86" y="36" width="68" height="78" rx="2" fill="#1e293b" opacity="0.5" />
  <!-- City skyline silhouette outside -->
  <path d="M92 108 L92 80 L100 80 L100 108 L110 108 L110 65 L118 65 L118 108 L130 108 L130 50 L142 50 L142 108 L148 108 L148 70 L154 70 L154 108 Z" fill="#334155" opacity="0.6" />
  
  <!-- Warm hanging pendant light casting down -->
  <path d="M120 0 L120 30" stroke="#475569" stroke-width="2" />
  <path d="M105 30 L135 30 L140 40 L100 40 Z" fill="#fbbf24" opacity="0.9" />
  <polygon points="120,40 60,180 180,180" fill="#fbbf24" opacity="0.08" />

  <!-- Wooden Meeting Desk -->
  <path d="M40 150 L200 150 L210 180 L30 180 Z" fill="#334155" />
  <path d="M45 150 L195 150 L190 146 L50 146 Z" fill="#475569" />
  <!-- Desk Legs -->
  <rect x="55" y="180" width="12" height="40" fill="#1e293b" />
  <rect x="173" y="180" width="12" height="40" fill="#1e293b" />

  <!-- Props on Desk: Documents/Blueprints & Coffee Mug -->
  <rect x="95" y="153" width="50" height="18" rx="2" fill="#f8fafc" />
  <line x1="100" y1="159" x2="135" y2="159" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="100" y1="165" x2="125" y2="165" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Coffee mug -->
  <rect x="155" y="150" width="12" height="15" rx="2" fill="#38bdf8" />
  <path d="M167 153 C172 153 172 161 167 161" stroke="#38bdf8" stroke-width="1.5" fill="none" />

  <!-- Character Left (Colleague A - Explaining/Speaking Directly) -->
  <g transform="translate(15, 0)">
    <!-- Body & Torso -->
    <path d="M50 160 C50 135 70 130 85 130 C100 130 120 135 120 160 Z" fill="#38bdf8" />
    <!-- Collar & Tie -->
    <polygon points="75,130 95,130 85,145" fill="#f8fafc" />
    <polygon points="82,142 88,142 85,160" fill="#f43f5e" />
    <!-- Head & Face Profile -->
    <circle cx="85" cy="105" r="18" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M68 105 C68 90 80 87 95 92 C95 92 90 98 88 102 C80 98 72 102 68 105 Z" fill="#334155" />
    <!-- Expressive Eye & Direct Gaze -->
    <circle cx="93" cy="104" r="2" fill="#1e293b" />
    <!-- Eyebrow showing emphasis -->
    <path d="M89 98 C92 96 97 97 97 97" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Mouth open talking -->
    <path d="M93 112 C96 112 97 110 95 109 Z" fill="#e11d48" />
    <!-- Active Gesturing Arm pointing forward face-to-face -->
    <path d="M60 135 L45 125 L75 115 Z" fill="#0284c7" />
    <!-- Hand -->
    <circle cx="43" cy="124" r="5" fill="#ffedd5" />
  </g>

  <!-- Character Right (Colleague B - Listening attentively face-to-face) -->
  <g transform="translate(115, 0)">
    <!-- Body & Torso -->
    <path d="M50 160 C50 135 70 130 85 130 C100 130 120 135 120 160 Z" fill="#10b981" />
    <!-- Collar -->
    <polygon points="75,130 95,130 85,145" fill="#f8fafc" />
    <!-- Head & Face Profile -->
    <circle cx="85" cy="105" r="18" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M72 92 C85 88 102 92 102 105 C98 102 90 99 82 100 C76 100 73 95 72 92 Z" fill="#475569" />
    <!-- Eye looking back directly -->
    <circle cx="77" cy="104" r="2" fill="#1e293b" />
    <!-- Serious/Understanding Eyebrow -->
    <path d="M73 99 C76 98 80 99 81 100" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Neutral listening mouth -->
    <path d="M76 112 L80 112" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arms crossed / resting attentively -->
    <path d="M65 135 L90 125 L105 145 Z" fill="#059669" />
    <!-- Hand resting -->
    <circle cx="95" cy="127" r="5" fill="#ffedd5" />
  </g>

  <!-- Direct face-to-face communication vector indicators (Clean, non-textual graphic flow) -->
  <path d="M88 85 Q110 70 132 85" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="4,4" opacity="0.8" />
  <polygon points="134,84 127,81 129,88" fill="#fbbf24" opacity="0.8" />
</svg>