<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Environmental Lighting Effect -->
  <circle cx="120" cy="80" r="100" fill="url(#lampGlow)"/>

  <!-- Background Interior Elements: Window and Bookshelf -->
  <g opacity="0.6">
    <!-- Window Frame -->
    <rect x="25" y="40" width="45" height="65" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="45" width="16" height="55" fill="#1e293b"/>
    <rect x="49" y="45" width="16" height="55" fill="#1e293b"/>
    <!-- Bookshelf -->
    <rect x="170" y="30" width="45" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="170" y1="60" x2="215" y2="60" stroke="#334155" stroke-width="2"/>
    <line x1="170" y1="90" x2="215" y2="90" stroke="#334155" stroke-width="2"/>
    <!-- Books on shelf -->
    <path d="M178 60L178 48H185L185 60Z" fill="#38bdf8"/>
    <path d="M188 60L188 42H196L196 60Z" fill="#10b981"/>
    <path d="M199 60L199 50H208L208 60Z" fill="#fb923c"/>
  </g>

  <!-- Hanging Lamp -->
  <path d="M120 0V35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 35H140L145 45H95Z" fill="#fbbf24"/>
  <ellipse cx="120" cy="45" rx="25" ry="4" fill="#f59e0b"/>

  <!-- Meeting Desk -->
  <path d="M35 155H205L195 205H45Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="2"/>
  <!-- Desk Highlight Edge -->
  <path d="M35 155H205L200 160H40Z" fill="#64748b"/>

  <!-- Context Props on Desk -->
  <!-- Blueprints / Contract (The "Collaboration" element) -->
  <rect x="95" y="165" width="50" height="30" rx="2" fill="#f8fafc" transform="rotate(-5 120 180)"/>
  <line x1="102" y1="174" x2="135" y2="171" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="103" y1="182" x2="130" y2="179" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="104" y1="190" x2="120" y2="188" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Coffee Mug -->
  <rect x="155" y="170" width="12" height="15" rx="2" fill="#ec4899"/>
  <path d="M167 173C170 173 170 180 167 182" stroke="#ec4899" stroke-width="2" fill="none"/>

  <!-- Character 1 (Left - Handshake / Trust Initiator) -->
  <g>
    <!-- Body & Torso -->
    <path d="M65 170C65 145 80 135 95 135C110 135 115 150 115 170Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="90" cy="115" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M74 115C74 105 85 100 95 102C102 103 106 109 106 115Z" fill="#334155"/>
    <!-- Hand reaching out for handshake/trust -->
    <path d="M105 155L132 155" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    <!-- Expression (Friendly & Honest Smile) -->
    <path d="M85 118C87 121 93 121 95 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="85" cy="113" r="1.5" fill="#1e293b"/>
    <circle cx="95" cy="113" r="1.5" fill="#1e293b"/>
  </g>

  <!-- Character 2 (Right - Partner receiving trust/foundation) -->
  <g>
    <!-- Body & Torso -->
    <path d="M175 170C175 145 160 135 145 135C130 135 125 150 125 170Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="150" cy="115" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M136 112C138 102 150 100 160 105C164 107 166 112 166 115Z" fill="#475569"/>
    <!-- Hand meeting the handshake -->
    <path d="M135 155L148 155" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    <!-- Expression (Nodding/Agreeing) -->
    <path d="M145 118C147 121 153 121 155 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="113" r="1.5" fill="#1e293b"/>
    <circle cx="155" cy="113" r="1.5" fill="#1e293b"/>
  </g>

  <!-- The "Key / Foundation" Visual Metaphor (Glowing Trust Symbol floating above handshake) -->
  <g transform="translate(120, 115)">
    <!-- Glowing Aura -->
    <circle cx="0" cy="0" r="18" fill="#fbbf24" opacity="0.3"/>
    <!-- Golden Shield / Foundation Emblem (Representing 'Premise / Base') -->
    <path d="M0 -12L10 -6V4C10 11 4 15 0 18C-4 15 -10 11 -10 4V-6L0 -12Z" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
    <!-- Checkmark inside Shield (Representing Truth/Honesty as the premise) -->
    <path d="M-4 1L-1 4L5 -3" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>