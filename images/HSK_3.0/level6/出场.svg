<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Floor/Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#2D343E"/>
  
  <!-- Spotlight Beam -->
  <path d="M120 0 L180 180 L60 180 Z" fill="#FFD700" opacity="0.15"/>
  
  <!-- Character (The Superstar) -->
  <g transform="translate(120, 180)">
    <!-- Legs -->
    <rect x="-15" y="-60" width="10" height="60" fill="#E0E0E0"/>
    <rect x="5" y="-60" width="10" height="60" fill="#E0E0E0"/>
    
    <!-- Torso -->
    <rect x="-20" y="-110" width="40" height="50" rx="5" fill="#FF9F1C"/>
    
    <!-- Arms (Waving) -->
    <rect x="-35" y="-105" width="15" height="40" rx="5" fill="#FF9F1C" transform="rotate(-20 -35 -105)"/>
    <rect x="20" y="-105" width="15" height="40" rx="5" fill="#FF9F1C" transform="rotate(20 35 -105)"/>
    
    <!-- Head -->
    <circle cx="0" cy="-135" r="25" fill="#FFD700"/>
    
    <!-- Hair -->
    <path d="M-20 -145 C-20 -165 20 -165 20 -145" fill="#2D343E"/>
  </g>
  
  <!-- Entrance/Threshold Arch -->
  <path d="M40 180 L40 60 C40 40 200 40 200 60 L200 180" stroke="#4A5568" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Crowd Silhouettes (Bottom) -->
  <circle cx="20" cy="220" r="15" fill="#4A5568"/>
  <circle cx="60" cy="225" r="18" fill="#4A5568"/>
  <circle cx="180" cy="225" r="18" fill="#4A5568"/>
  <circle cx="220" cy="220" r="15" fill="#4A5568"/>
</svg>