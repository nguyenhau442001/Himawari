<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Terminal Window / Building Glow -->
    <linearGradient id="terminalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Runway / Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Light Beam from Terminal -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGradient)" />

  <!-- Stars & Night Atmosphere -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="30" cy="35" r="1" />
    <circle cx="70" cy="20" r="1.5" />
    <circle cx="110" cy="45" r="1" />
    <circle cx="195" cy="25" r="1.2" />
    <circle cx="215" cy="55" r="1" />
  </g>

  <!-- Airport Control Tower in background (Silhouette) -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
    <path d="M 185,90 L 190,140 L 205,140 L 210,90 Z" />
    <rect x="180" y="75" width="35" height="15" rx="3" fill="#334155" />
    <!-- Tower light -->
    <circle cx="197" cy="82" r="2" fill="#ef4444" />
  </g>

  <!-- Airport Terminal Building with Large Glass Windows -->
  <rect x="0" y="110" width="240" height="90" fill="#0f172a" />
  
  <!-- Terminal Roof curve -->
  <path d="M -10,115 Q 120,95 250,115 L 250,125 L -10,125 Z" fill="#334155" />

  <!-- Terminal Interior Warm Glow & Window Grid -->
  <rect x="15" y="125" width="210" height="60" fill="url(#terminalGlow)" />
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.4">
    <!-- Vertical window frames -->
    <line x1="35" y1="125" x2="35" y2="185" />
    <line x1="55" y1="125" x2="55" y2="185" />
    <line x1="75" y1="125" x2="75" y2="185" />
    <line x1="95" y1="125" x2="95" y2="185" />
    <line x1="115" y1="125" x2="115" y2="185" />
    <line x1="135" y1="125" x2="135" y2="185" />
    <line x1="155" y1="125" x2="155" y2="185" />
    <line x1="175" y1="125" x2="175" y2="185" />
    <line x1="195" y1="125" x2="195" y2="185" />
    <!-- Horizontal frames -->
    <line x1="15" y1="145" x2="225" y2="145" />
    <line x1="15" y1="165" x2="225" y2="165" />
  </g>

  <!-- Ground / Tarmac -->
  <rect x="0" y="180" width="240" height="60" fill="url(#groundGrad)" />
  <!-- Runway Lights / Markings -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10, 8" opacity="0.8" />
  <line x1="0" y1="220" x2="240" y2="220" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6, 12" opacity="0.7" />

  <!-- The Landing Airplane (Arriving context) -->
  <g transform="translate(110, 75) rotate(-12)">
    <!-- Motion trails -->
    <path d="M -80,10 L -40,15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <path d="M -70,22 L -35,25" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

    <!-- Airplane Body -->
    <ellipse cx="0" cy="15" rx="42" ry="11" fill="#f8fafc" />
    <!-- Nosecone -->
    <path d="M 30,15 C 42,15 45,18 48,22 C 45,23 30,22 30,15 Z" fill="#e2e8f0" />
    <!-- Cockpit Windows -->
    <path d="M 32,13 C 36,13 39,15 40,17 C 37,17 33,16 32,13 Z" fill="#0f172a" />
    
    <!-- Main Wing (Perspective) -->
    <path d="M -5,16 L 15,16 L 5,38 L -15,38 Z" fill="#cbd5e1" />
    <!-- Wing Engine -->
    <ellipse cx="2" cy="27" rx="3" ry="5" fill="#94a3b8" />

    <!-- Tail Fin -->
    <path d="M -32,14 L -40,1 L -30,2 L -25,14 Z" fill="#3b82f6" />
    
    <!-- Fuselage Stripe -->
    <path d="M -40,17 L 35,17" stroke="#3b82f6" stroke-width="2" fill="none" />

    <!-- Landing Gear (Deployed for arrival) -->
    <circle cx="15" cy="43" r="2.5" fill="#334155" />
    <line x1="15" y1="38" x2="15" y2="43" stroke="#64748b" stroke-width="1.5" />
    
    <circle cx="-15" cy="43" r="2.5" fill="#334155" />
    <line x1="-15" y1="38" x2="-15" y2="43" stroke="#64748b" stroke-width="1.5" />

    <!-- Jet Engine Glow (Soft landing thrust) -->
    <ellipse cx="-43" cy="15" rx="3" ry="6" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Foreground Characters Greeting / Welcoming (The Human Element) -->
  <g transform="translate(0, 15)">
    <!-- Character 1 (Waiting Greeter with Welcome Sign/Phone) -->
    <g transform="translate(75, 155)">
      <!-- Shadow -->
      <ellipse cx="0" cy="31" rx="12" ry="3" fill="#090d16" opacity="0.5" />
      <!-- Body / Coat -->
      <path d="M -7,8 L 7,8 L 10,24 L -10,24 Z" fill="#ec4899" />
      <!-- Legs -->
      <rect x="-6" y="24" width="4" height="8" rx="2" fill="#334155" />
      <rect x="2" y="24" width="4" height="8" rx="2" fill="#334155" />
      <!-- Head -->
      <circle cx="0" cy="1" r="7" fill="#fcd34d" />
      <!-- Hair -->
      <path d="M -7,-1 C -7,-5 7,-5 7,-1 C 5,-4 -5,-4 -7,-1 Z" fill="#1e293b" />
      <!-- Raised arm waving -->
      <path d="M 7,10 L 16,3" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
      <!-- Smiling Face expression (implied by posture/joy) -->
    </g>

    <!-- Character 2 (Excited Traveler with luggage cart / backpack) -->
    <g transform="translate(135, 150)">
      <!-- Shadow -->
      <ellipse cx="0" cy="36" rx="14" ry="3" fill="#090d16" opacity="0.5" />
      <!-- Backpack -->
      <rect x="-12" y="10" width="8" height="15" rx="3" fill="#10b981" />
      <!-- Jacket -->
      <path d="M -8,10 L 8,10 L 11,29 L -11,29 Z" fill="#3b82f6" />
      <!-- Legs -->
      <rect x="-7" y="29" width="5" height="7" rx="2" fill="#1e293b" />
      <rect x="2" y="29" width="5" height="7" rx="2" fill="#1e293b" />
      <!-- Head -->
      <circle cx="0" cy="3" r="7.5" fill="#fcd34d" />
      <!-- Hair / Cap -->
      <path d="M -8,1 C -2,-3 6,-1 8,2 C 4,1 -4,1 -8,1 Z" fill="#f59e0b" />
      <!-- Arms outstretched happily -->
      <path d="M -8,14 L -16,8" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
      <path d="M 8,14 L 16,8" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
      
      <!-- Rolling Suitcase beside character -->
      <g transform="translate(20, 18)">
        <rect x="0" y="0" width="12" height="16" rx="3" fill="#8b5cf6" />
        <path d="M 4,0 L 4,-3 L 8,-3 L 8,0" stroke="#64748b" stroke-width="1.5" fill="none" />
        <circle cx="3" cy="18" r="1.5" fill="#334155" />
        <circle cx="9" cy="18" r="1.5" fill="#334155" />
        <!-- Suitcase stripes for detail -->
        <line x1="0" y1="6" x2="12" y2="6" stroke="#7c3aed" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- Ambient lighting highlights -->
  <circle cx="150" cy="150" r="80" fill="url(#lightBeam)" style="mix-blend-mode: overlay;" />

  <!-- Outer Frame / Border Stroke for Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>