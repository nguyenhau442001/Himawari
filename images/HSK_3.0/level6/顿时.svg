<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Sudden Shock Aura Gradient -->
    <radialGradient id="shockAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Cityscape Light -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Background Room Wall & Window -->
  <rect x="130" y="30" width="80" height="90" rx="6" fill="url(#windowLight)" stroke="#334155" stroke-width="2"/>
  <!-- Window Panes Grid -->
  <line x1="170" y1="30" x2="170" y2="120" stroke="#334155" stroke-width="1.5"/>
  <line x1="130" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="1.5"/>
  <!-- Distant City Lights Outside Window -->
  <circle cx="145" cy="50" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="155" cy="65" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="195" cy="45" r="1.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="185" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>

  <!-- Bookshelf / Plants in Background -->
  <rect x="25" y="40" width="40" height="85" rx="4" fill="#334155" opacity="0.4"/>
  <line x1="25" y1="70" x2="65" y2="70" stroke="#1e293b" stroke-width="2"/>
  <line x1="25" y1="100" x2="65" y2="100" stroke="#1e293b" stroke-width="2"/>
  <!-- Small Potted Plant on Shelf -->
  <path d="M38 70 L42 60 L52 60 L56 70 Z" fill="#10b981"/>
  <path d="M47 60 Q44 50 38 48 Q47 52 47 60 Z" fill="#34d399"/>
  <path d="M47 60 Q52 48 58 46 Q50 53 47 60 Z" fill="#059669"/>

  <!-- Wooden Desk Surface -->
  <rect x="10" y="165" width="220" height="15" rx="3" fill="#b45309"/>
  <rect x="15" y="180" width="210" height="40" fill="#92400e"/>
  <!-- Desk Edge Highlight -->
  <rect x="10" y="165" width="220" height="4" fill="#d97706" rx="2"/>

  <!-- Desk Props -->
  <!-- Laptop Open -->
  <path d="M140 165 L155 140 L205 140 L220 165 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M145 163 L158 143 L202 143 L215 163 Z" fill="#0f172a"/>
  <!-- Laptop Screen Glow (News / Message flash) -->
  <rect x="162" y="147" width="36" height="12" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="165" y="150" width="20" height="2" rx="1" fill="#ffffff" opacity="0.9"/>
  <rect x="165" y="154" width="30" height="2" rx="1" fill="#94a3b8" opacity="0.7"/>

  <!-- Coffee Mug -->
  <rect x="45" y="148" width="16" height="18" rx="3" fill="#f8fafc"/>
  <path d="M61 153 C67 153 67 161 61 161" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rising Steam -->
  <path d="M50 142 Q53 137 50 132" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Desk Lamp & Cone of Light -->
  <path d="M100 165 L106 120 L118 120 L124 165 Z" fill="#334155"/>
  <path d="M112 120 L112 90" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Lamp Shade -->
  <path d="M96 90 L128 90 L136 76 L88 76 Z" fill="#f59e0b"/>
  <!-- Light Beam Overlay -->
  <polygon points="112,90 20,240 210,240" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- SUDDEN SHOCK EFFECT (Visual Metaphor for "顿时" / Instantly Frozen) -->
  <circle cx="105" cy="95" r="55" fill="url(#shockAura)"/>
  <!-- Speed lines / Sudden impact sparks -->
  <path d="M65 85 L50 75" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M145 80 L160 70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M60 120 L40 120" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M150 115 L170 110" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- MAIN CHARACTER: "He" (Frozen in shock, phone dropped mid-air) -->
  <!-- Chair Back -->
  <rect x="85" y="105" width="40" height="65" rx="8" fill="#475569"/>

  <!-- Character Torso & Hoodie -->
  <path d="M78 175 L80 135 C80 122 92 115 105 115 C118 115 130 122 130 135 L132 175 Z" fill="#0284c7"/>
  <!-- Hoodie Pocket & Strings -->
  <path d="M92 155 L118 155 L115 172 L95 172 Z" fill="#0369a1"/>
  <path d="M98 125 L94 142" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 125 L116 142" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

  <!-- Character Neck -->
  <rect x="96" y="106" width="18" height="15" rx="6" fill="#fbcfe8"/>

  <!-- Character Head (Eyes wide open, mouth open in sudden shock/freeze) -->
  <circle cx="105" cy="95" r="22" fill="#fbcfe8"/>

  <!-- Hair (Messy/Stylish dark hair) -->
  <path d="M83 95 C83 75 127 75 127 95 C127 95 125 84 116 80 C107 76 97 80 93 82 C89 84 83 95 83 95 Z" fill="#1e293b"/>

  <!-- Expressive Facial Features (Shocked & Frozen) -->
  <!-- Eyebrows raised high -->
  <path d="M91 87 Q96 83 101 87" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M109 87 Q114 83 119 87" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wide Open Eyes (White circles + tiny pupils for shock) -->
  <circle cx="96" cy="95" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="96" cy="95" r="1.5" fill="#0f172a"/>
  
  <circle cx="114" cy="95" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="114" cy="95" r="1.5" fill="#0f172a"/>

  <!-- Shocked Open Mouth ('O' shape) -->
  <ellipse cx="105" cy="108" rx="4.5" ry="6" fill="#0f172a"/>

  <!-- Arms & Hands (Rigidly paused mid-action) -->
  <!-- Left Arm (Reaching towards laptop) -->
  <path d="M82 125 L60 135 L68 145" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Hand -->
  <circle cx="68" cy="147" r="5" fill="#fbcfe8"/>

  <!-- Right Arm (Holding phone that is slipping/frozen mid-air) -->
  <path d="M128 125 L145 130 L138 145" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Hand -->
  <circle cx="136" cy="147" r="5" fill="#fbcfe8"/>

  <!-- Dropping Smartphone (suspended in air due to "顿时" moment) -->
  <g transform="translate(142, 132) rotate(25)">
    <rect x="0" y="0" width="12" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="1.5" y="2" width="9" height="14" rx="1" fill="#38bdf8" opacity="0.8"/>
  </g>
  <!-- Motion Lines for Dropping Phone -->
  <path d="M148 128 L152 120" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <path d="M138 152 L134 158" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>

</svg>