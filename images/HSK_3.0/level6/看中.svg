<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Shelf structure representing "琳琅满目的货架" -->
  <!-- Top shelf -->
  <rect x="30" y="50" width="180" height="8" rx="3" fill="#2E3440"/>
  <!-- Middle shelf -->
  <rect x="30" y="115" width="180" height="8" rx="3" fill="#2E3440"/>
  <!-- Bottom shelf -->
  <rect x="30" y="180" width="180" height="8" rx="3" fill="#2E3440"/>

  <!-- Various background items on shelves (muted colors) -->
  <!-- Top shelf items -->
  <rect x="45" y="24" width="16" height="26" rx="4" fill="#4C566A"/>
  <circle cx="85" cy="37" r="12" fill="#4C566A"/>
  <rect x="175" y="20" width="22" height="30" rx="3" fill="#4C566A"/>

  <!-- Middle shelf items -->
  <path d="M45,115 L50,85 L70,85 L75,115 Z" fill="#4C566A"/>
  <rect x="145" y="80" width="20" height="35" rx="3" fill="#4C566A"/>

  <!-- Bottom shelf items -->
  <circle cx="60" cy="155" r="15" fill="#4C566A"/>
  <rect x="160" y="140" width="25" height="40" rx="4" fill="#4C566A"/>

  <!-- The Chosen Object: Elegant Sky Blue Long Dress ("那件天蓝色的长裙") on Middle Shelf -->
  <!-- Hanger -->
  <path d="M100,74 L110,67 L120,74" fill="none" stroke="#D8DEE9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="66" r="2" fill="#D8DEE9"/>

  <!-- Dress Body -->
  <!-- Bodice -->
  <path d="M101,74 L119,74 L117,95 L103,95 Z" fill="#88C0D0"/>
  <!-- Flowing Skirt -->
  <path d="M103,95 L117,95 L125,160 L95,160 Z" fill="#88C0D0"/>

  <!-- Visual Focus: Glowing Target/Highlight indicating "看中" (chấm, ưng ý, vừa mắt) -->
  <!-- Spotlight beam -->
  <polygon points="110,12 80,185 140,185" fill="#EBCB8B" opacity="0.08"/>
  
  <!-- Outer Focus Ring (Golden Accent) -->
  <circle cx="110" cy="115" r="42" fill="none" stroke="#EBCB8B" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
  
  <!-- Corner targeting brackets for precision -->
  <!-- Top Left -->
  <path d="M 64 90 L 64 82 L 72 82" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top Right -->
  <path d="M 156 90 L 156 82 L 148 82" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom Left -->
  <path d="M 64 140 L 64 148 L 72 148" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom Right -->
  <path d="M 156 140 L 156 148 L 148 148" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle effect representing eye-catching realization / "一眼就看中" -->
  <path d="M 148 70 L 150 75 L 155 77 L 150 79 L 148 84 L 146 79 L 141 77 L 146 75 Z" fill="#EBCB8B"/>
  <path d="M 72 125 L 73 128 L 76 129 L 73 130 L 72 133 L 71 130 L 68 129 L 71 128 Z" fill="#EBCB8B"/>

</svg>