<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="30" y="150" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="165" width="10" height="60" fill="#475569"/>
  <rect x="190" y="165" width="10" height="60" fill="#475569"/>
  
  <!-- Characters -->
  <!-- Person 1 (Pointing) -->
  <circle cx="70" cy="110" r="15" fill="#fde68a"/>
  <path d="M55 125 Q55 150 60 180" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 125 L90 100" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Person 2 (Listening/Thinking) -->
  <circle cx="170" cy="110" r="15" fill="#bae6fd"/>
  <path d="M185 125 Q185 150 180 180" stroke="#bae6fd" stroke-width="8" stroke-linecap="round"/>
  <path d="M170 125 L150 135" stroke="#bae6fd" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Strategy Board/Paper -->
  <rect x="85" y="60" width="70" height="80" rx="5" fill="#f8fafc"/>
  <line x1="95" y1="80" x2="145" y2="80" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="100" x2="120" y2="100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="135" cy="100" r="4" fill="#10b981"/>
  <path d="M95 120 L145 120" stroke="#94a3b8" stroke-width="2"/>
  <path d="M95 130 L130 130" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Coffee Mug -->
  <rect x="160" y="135" width="20" height="20" rx="2" fill="#ec4899"/>
  <path d="M180 140 Q190 140 190 150" stroke="#ec4899" stroke-width="3" fill="none"/>
  
  <!-- Light bulb glow -->
  <circle cx="120" cy="40" r="8" fill="#fbbf24" opacity="0.6"/>
  <circle cx="120" cy="40" r="4" fill="#f59e0b"/>
</svg>