<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Magical Glow Effect behind the book -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.1" filter="blur(10px)"/>

  <!-- Floating Magic Elements / Stars -->
  <path d="M70,80 L72,85 L77,87 L72,89 L70,94 L68,89 L63,87 L68,85 Z" fill="#FFB703" opacity="0.8"/>
  <path d="M170,70 L171.5,73.5 L175,75 L171.5,76.5 L170,80 L168.5,76.5 L165,75 L168.5,73.5 Z" fill="#219EBC" opacity="0.9"/>
  <path d="M175,150 L176,152 L178,153 L176,154 L175,156 L174,154 L172,153 L174,152 Z" fill="#FFB703" opacity="0.7"/>
  <path d="M65,155 L66,157 L68,158 L66,159 L65,161 L64,159 L62,158 L64,157 Z" fill="#8ECAE6" opacity="0.8"/>

  <!-- Open Fairy Tale Book -->
  <g transform="translate(0, 15)">
    <!-- Book Shadow -->
    <path d="M60,145 Q120,165 180,145 L175,155 Q120,175 65,155 Z" fill="#0D1117" opacity="0.5"/>

    <!-- Left Cover/Pages -->
    <path d="M60,110 C60,110 85,100 120,110 L120,150 C85,140 60,150 60,150 Z" fill="#219EBC"/>
    <path d="M63,113 C63,113 86,104 117,113 L117,146 C86,137 63,146 63,146 Z" fill="#F8F9FA"/>

    <!-- Right Cover/Pages -->
    <path d="M180,110 C180,110 155,100 120,110 L120,150 C155,140 180,150 180,150 Z" fill="#219EBC"/>
    <path d="M177,113 C177,113 154,104 123,113 L123,146 C154,137 177,146 177,146 Z" fill="#F8F9FA"/>

    <!-- Book Spine -->
    <path d="M117,110 L123,110 L123,150 L117,150 Z" fill="#023047"/>

    <!-- Abstract Page Lines (Left) -->
    <line x1="75" y1="123" x2="105" y2="120" stroke="#E9ECEF" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="131" x2="100" y2="128" stroke="#E9ECEF" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="139" x2="95" y2="136" stroke="#E9ECEF" stroke-width="3" stroke-linecap="round"/>

    <!-- Abstract Castle Pop-up from Pages (Right) -->
    <!-- Castle Base -->
    <rect x="135" y="115" width="25" height="25" fill="#FFB703"/>
    <!-- Castle Towers -->
    <rect x="130" y="105" width="8" height="35" fill="#FB8500"/>
    <rect x="157" y="105" width="8" height="35" fill="#FB8500"/>
    <!-- Castle Roofs (Cones) -->
    <polygon points="127,105 134,90 141,105" fill="#E63946"/>
    <polygon points="154,105 161,90 168,105" fill="#E63946"/>
    <polygon points="132,115 147.5,95 163,115" fill="#D90429"/>
    <!-- Castle Door & Windows -->
    <path d="M144,130 Q147.5,125 151,130 L151,140 L144,140 Z" fill="#023047"/>
    <circle cx="134" cy="112" r="2" fill="#F8F9FA"/>
    <circle cx="161" cy="112" r="2" fill="#F8F9FA"/>
    <rect x="144" y="118" width="7" height="7" fill="#F8F9FA" rx="1"/>
  </g>

  <!-- Magical Wand / Sparkle Trail coming from the book -->
  <path d="M120,110 Q140,70 185,55" fill="none" stroke="#FFB703" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="185,45 188,52 195,55 188,58 185,65 182,58 175,55 182,52" fill="#FFB703"/>
</svg>