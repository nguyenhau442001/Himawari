<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 场地 (Sports field / venue) -->
  <g transform="translate(0, 0)">
    <!-- Ground / Field base (Isometric-inspired flat perspective) -->
    <path d="M 40 140 L 120 100 L 200 140 L 120 180 Z" fill="#22303C" stroke="#2E4053" stroke-width="2"/>
    
    <!-- Playing Field Surface -->
    <path d="M 55 132.5 L 120 100 L 185 132.5 L 120 165 Z" fill="#2ECC71" opacity="0.15"/>
    <path d="M 55 132.5 L 120 100 L 185 132.5 L 120 165 Z" stroke="#2ECC71" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

    <!-- Field Markings (Running track curves) -->
    <!-- Outer Track -->
    <path d="M 30 145 L 120 100 L 210 145 L 120 190 Z" fill="none" stroke="#F1C40F" stroke-width="2" opacity="0.6"/>
    <!-- Center Line / Midfield -->
    <line x1="120" y1="116" x2="120" y2="150" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5"/>
    <ellipse cx="120" cy="133" rx="12" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Running Track Lanes (Red/Orange accent for high contrast and stadium feel) -->
    <path d="M 20 150 L 120 100 L 220 150" fill="none" stroke="#E74C3C" stroke-width="2"/>
    <path d="M 20 150 L 120 200 L 220 150" fill="none" stroke="#E74C3C" stroke-width="2"/>

    <!-- Stadium Floodlights / Pylons (Representing a proper event venue) -->
    <!-- Left Pylon -->
    <line x1="45" y1="120" x2="45" y2="70" stroke="#7F8C8D" stroke-width="3" stroke-linecap="round"/>
    <rect x="37" y="65" width="16" height="8" rx="2" fill="#F1C40F"/>
    <path d="M 45 73 L 45 95" stroke="#F1C40F" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Right Pylon -->
    <line x1="195" y1="120" x2="195" y2="70" stroke="#7F8C8D" stroke-width="3" stroke-linecap="round"/>
    <rect x="187" y="65" width="16" height="8" rx="2" fill="#F1C40F"/>
    <path d="M 195 73 L 195 95" stroke="#F1C40F" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Goal Posts (Soccer / Sports venue indicator) -->
    <!-- Back Goal -->
    <path d="M 105 108 L 110 105 L 110 115" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Front Goal -->
    <path d="M 135 123 L 130 120 L 130 130" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Floating Focus Element (Golden Badge / Icon Frame hinting at organized space) -->
    <circle cx="120" cy="55" r="22" fill="#1A1D24" stroke="#F1C40F" stroke-width="3"/>
    <!-- Venue Pin Icon inside badge -->
    <path d="M 120 44 C 115 44 111 48 111 53 C 111 59 120 66 120 66 C 120 66 129 59 129 53 C 129 48 125 44 120 44 Z" fill="#F1C40F"/>
    <circle cx="120" cy="52" r="2.5" fill="#1A1D24"/>
  </g>
</svg>