<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow/particles to suggest dispersion/dissolving (tản ra) -->
  <g opacity="0.3" fill="#38BDF8">
    <circle cx="70" cy="110" r="2"/>
    <circle cx="55" cy="130" r="1.5"/>
    <circle cx="40" cy="95" r="2.5"/>
    <circle cx="170" cy="100" r="2"/>
    <circle cx="185" cy="125" r="1.5"/>
    <circle cx="200" cy="90" r="2.5"/>
    <circle cx="120" cy="45" r="2"/>
    <circle cx="100" cy="35" r="1.5"/>
    <circle cx="140" cy="30" r="2"/>
  </g>

  <!-- Central Visual Representation: Meeting room dissolving / dispersing (会议解散) -->
  <!-- Represents the context: 会议终于在下午五点准时散了 (The meeting finally dispersed right at 5 PM) -->
  <g transform="translate(0, 5)">
    <!-- Central Conference Table (Modern Flat Style) -->
    <!-- Table shadow/base -->
    <ellipse cx="120" cy="155" rx="55" ry="18" fill="#111318"/>
    <!-- Table top -->
    <ellipse cx="120" cy="150" rx="55" ry="18" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    <!-- Table reflection/highlight -->
    <ellipse cx="120" cy="148" rx="45" ry="12" fill="none" stroke="#4A5568" stroke-width="1" opacity="0.5"/>

    <!-- Documents / Laptops on table (meeting elements) -->
    <rect x="105" y="142" width="18" height="12" rx="1" fill="#E2E8F0"/>
    <rect x="115" y="146" width="16" height="10" rx="1" fill="#CBD5E1"/>
    <circle cx="90" cy="148" r="4" fill="#F59E0B"/>
    <circle cx="150" cy="148" r="4" fill="#38BDF8"/>

    <!-- Chair Left (moving away) -->
    <g transform="translate(60, 135) rotate(-25)">
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#475569"/>
      <path d="M-10 8 L-6 16 L-2 16 L-2 8 Z" fill="#334155"/>
      <path d="M6 8 L2 16 L6 16 L10 8 Z" fill="#334155"/>
    </g>

    <!-- Chair Right (moving away) -->
    <g transform="translate(180, 135) rotate(25)">
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#475569"/>
      <path d="M-10 8 L-6 16 L-2 16 L-2 8 Z" fill="#334155"/>
      <path d="M6 8 L2 16 L6 16 L10 8 Z" fill="#334155"/>
    </g>

    <!-- Chair Top -->
    <rect x="112" y="120" width="16" height="14" rx="3" fill="#475569"/>

    <!-- Chair Bottom -->
    <rect x="112" y="170" width="16" height="14" rx="3" fill="#475569"/>

    <!-- Dispersing Figures (People walking away / tản ra) -->
    <!-- Person 1 (Walking Left & Up) -->
    <g transform="translate(75, 100)">
      <!-- Head -->
      <circle cx="0" cy="-14" r="6" fill="#FBBF24"/>
      <!-- Body/Torso -->
      <path d="M-5 -6 C-5 -8 5 -8 5 -6 L6 12 C6 14 4 16 2 16 L-2 16 C-4 16 -6 14 -6 12 Z" fill="#38BDF8"/>
      <!-- Motion lines / Dissolving effect -->
      <path d="M 12 0 L 22 -5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M 15 8 L 25 5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Person 2 (Walking Right & Up) -->
    <g transform="translate(165, 95)">
      <!-- Head -->
      <circle cx="0" cy="-14" r="6" fill="#FBBF24"/>
      <!-- Body/Torso -->
      <path d="M-5 -6 C-5 -8 5 -8 5 -6 L6 12 C6 14 4 16 2 16 L-2 16 C-4 16 -6 14 -6 12 Z" fill="#F43F5E"/>
      <!-- Motion lines / Dissolving effect -->
      <path d="M -12 -2 L -22 -7" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M -15 6 L -25 3" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Person 3 (Walking Out/Down-Left) -->
    <g transform="translate(90, 185)">
      <!-- Head -->
      <circle cx="0" cy="-14" r="6" fill="#FBBF24"/>
      <!-- Body/Torso -->
      <path d="M-5 -6 C-5 -8 5 -8 5 -6 L6 12 C6 14 4 16 2 16 L-2 16 C-4 16 -6 14 -6 12 Z" fill="#A855F7"/>
      <!-- Motion trail -->
      <circle cx="15" cy="-5" r="2" fill="#A855F7" opacity="0.6"/>
      <circle cx="24" cy="-10" r="1.5" fill="#A855F7" opacity="0.3"/>
    </g>

    <!-- Person 4 (Walking Out/Down-Right) -->
    <g transform="translate(150, 185)">
      <!-- Head -->
      <circle cx="0" cy="-14" r="6" fill="#FBBF24"/>
      <!-- Body/Torso -->
      <path d="M-5 -6 C-5 -8 5 -8 5 -6 L6 12 C6 14 4 16 2 16 L-2 16 C-4 16 -6 14 -6 12 Z" fill="#10B981"/>
      <!-- Motion trail -->
      <circle cx="-15" cy="-5" r="2" fill="#10B981" opacity="0.6"/>
      <circle cx="-24" cy="-10" r="1.5" fill="#10B981" opacity="0.3"/>
    </g>

    <!-- Clock Icon floating top center indicating "5 o'clock / meeting end" -->
    <g transform="translate(120, 32)">
      <circle cx="0" cy="0" r="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
      <!-- Clock hands pointing to 5:00 -->
      <line x1="0" y1="0" x2="0" y2="-5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="4" y2="3" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Dispersion directional arrows emanating outward (semantic meaning: tản ra, tan) -->
    <path d="M 105 75 L 85 55 M 85 55 L 92 55 M 85 55 L 85 62" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M 135 75 L 155 55 M 155 55 L 148 55 M 155 55 L 155 62" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>