<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Startup Vibe -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Office Interior -->
  <!-- City Window view in background -->
  <path d="M 160 35 L 205 35 L 205 110 L 160 110 Z" fill="url(#windowLight)" />
  <!-- Cityscape silhouettes outside -->
  <path d="M 165 110 L 165 70 L 175 70 L 175 110 L 180 110 L 180 55 L 190 55 L 190 110 L 195 110 L 195 85 L 200 85 L 200 110 Z" fill="#334155" opacity="0.4" />
  <!-- Window frame -->
  <path d="M 160 35 L 205 35 L 205 110 L 160 110 Z" fill="none" stroke="#475569" stroke-width="2" />
  <line x1="182" y1="35" x2="182" y2="110" stroke="#475569" stroke-width="1.5" />
  <line x1="160" y1="72" x2="205" y2="72" stroke="#475569" stroke-width="1.5" />

  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="45" width="40" height="70" rx="2" fill="#334155" opacity="0.6" />
  <line x1="25" y1="68" x2="65" y2="68" stroke="#475569" stroke-width="2" />
  <line x1="25" y1="92" x2="65" y2="92" stroke="#475569" stroke-width="2" />
  <!-- Colorful books on shelf -->
  <rect x="30" y="52" width="6" height="16" rx="1" fill="#ec4899" />
  <rect x="38" y="50" width="8" height="18" rx="1" fill="#38bdf8" />
  <rect x="48" y="54" width="5" height="14" rx="1" fill="#10b981" />
  <rect x="30" y="75" width="7" height="17" rx="1" fill="#f59e0b" />
  <rect x="39" y="77" width="5" height="15" rx="1" fill="#6366f1" />

  <!-- Hanging Pendant Lamp with Golden Glow -->
  <circle cx="120" cy="55" r="45" fill="url(#lampGlow)" />
  <path d="M 120 0 L 120 30" stroke="#64748b" stroke-width="2" />
  <path d="M 102 30 L 138 30 L 144 38 L 96 38 Z" fill="#fbbf24" />
  <circle cx="120" cy="40" r="3" fill="#fef08a" />

  <!-- Main Desk Surface -->
  <rect x="40" y="155" width="160" height="8" rx="3" fill="#475569" />
  <!-- Desk Legs -->
  <path d="M 55 163 L 55 205" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <path d="M 185 163 L 185 205" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- Office Props on Desk -->
  <!-- Laptop -->
  <path d="M 125 145 L 165 145 L 172 155 L 118 155 Z" fill="#94a3b8" />
  <path d="M 127 128 L 163 128 L 163 145 L 127 145 Z" fill="#cbd5e1" rx="1" />
  <path d="M 130 131 L 160 131 L 160 142 L 130 142 Z" fill="#0f172a" />
  <!-- Coffee Mug -->
  <rect x="175" y="135" width="10" height="14" rx="2" fill="#f43f5e" />
  <path d="M 185 139 C 189 139 189 145 185 145" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  <!-- Small Plant Pot -->
  <path d="M 55 145 L 67 145 L 64 155 L 58 155 Z" fill="#cbd5e1" />
  <!-- Plant leaves (Greenery) -->
  <path d="M 61 145 C 61 138 53 135 53 135 C 53 135 57 142 61 145 Z" fill="#10b981" />
  <path d="M 61 145 C 61 135 69 132 69 132 C 69 132 65 141 61 145 Z" fill="#34d399" />
  <path d="M 61 145 C 57 138 58 130 58 130 C 58 130 60 140 61 145 Z" fill="#059669" />

  <!-- Blueprint / Architectural Plan on Desk (Signifying 'Founding' / Creation) -->
  <path d="M 75 142 L 112 136 L 115 152 L 78 158 Z" fill="#e0f2fe" opacity="0.9" />
  <path d="M 82 144 L 95 142" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2 1" />
  <path d="M 80 150 L 105 146" stroke="#0284c7" stroke-width="1.5" />
  <circle cx="102" cy="148" r="2.5" fill="#f59e0b" />

  <!-- Main Character: The Founder (Proudly pointing/gesturing to his newly created enterprise/blueprint) -->
  <!-- Body/Torso (Dark Blue Stylish Jacket with Warm Orange Accent Shirt) -->
  <path d="M 85 125 C 85 110 105 105 115 105 C 125 105 145 110 145 125 L 140 160 L 90 160 Z" fill="#1e293b" />
  <path d="M 105 108 L 125 108 L 122 135 L 108 135 Z" fill="#fb923c" />
  <path d="M 115 112 L 115 130" stroke="#ea580c" stroke-width="2" />

  <!-- Head & Face -->
  <circle cx="115" cy="85" r="16" fill="#ffedd5" />
  <!-- Hair (Modern styled dark hair) -->
  <path d="M 99 85 C 99 73 105 70 115 70 C 127 70 132 75 132 87 C 132 87 128 80 119 80 C 110 80 103 84 99 85 Z" fill="#0f172a" />
  <!-- Expressive Confident Smile & Eyes -->
  <path d="M 108 85 Q 111 88 114 85" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M 120 85 Q 123 88 126 85" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M 113 93 Q 116 97 119 93" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

  <!-- Left Arm (Resting on desk) -->
  <path d="M 92 115 L 78 138 L 92 142" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="91" cy="143" r="5" fill="#ffedd5" />

  <!-- Right Arm (Active Gesture pointing to the enterprise/blueprint) -->
  <path d="M 138 115 L 155 130 L 148 142" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand pointing forward -->
  <circle cx="147" cy="144" r="5" fill="#ffedd5" />
  <path d="M 148 142 L 154 146" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Sparkles / Concept Elements (Representing creation, innovation, success) -->
  <!-- Golden Star 1 -->
  <path d="M 195 75 L 198 83 L 206 86 L 198 89 L 195 97 L 192 89 L 184 86 L 192 83 Z" fill="#fbbf24" />
  <!-- Golden Star 2 (Smaller) -->
  <path d="M 72 65 L 74 70 L 79 72 L 74 74 L 72 79 L 70 74 L 65 72 L 70 70 Z" fill="#f59e0b" opacity="0.8" />
  <!-- Vibrant Accent Floating Bubble (Innovation/Growth) -->
  <circle cx="178" cy="95" r="8" fill="#10b981" opacity="0.85" />
  <path d="M 175 95 L 177 98 L 182 92" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Second Character (Co-founder / Supporter applauding/celebrating) -->
  <!-- Body -->
  <path d="M 25 140 C 25 125 40 120 50 120 C 60 120 75 125 75 140 L 70 180 L 30 180 Z" fill="#38bdf8" />
  <!-- Head -->
  <circle cx="50" cy="102" r="14" fill="#fde68a" />
  <!-- Hair (Stylized bob) -->
  <path d="M 36 100 C 36 88 44 86 50 86 C 58 86 64 90 64 102 C 64 102 61 96 55 96 C 49 96 38 102 36 100 Z" fill="#78350f" />
  <!-- Face Expression (Joyful, smiling) -->
  <path d="M 45 102 Q 47 104 49 102" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 53 102 Q 55 104 57 102" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 48 109 Q 51 112 54 109" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linecap="round" />

  <!-- Hands clapping / cheering -->
  <path d="M 40 130 C 45 130 52 135 55 145" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round" />
</svg>