<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration: "外来" (Wàilái - incoming/from the outside, applied to talent/people/objects) -->
  <!-- We visualize a sleek architectural portal/gateway representing a boundary, with a stylized professional newcomer silhouette stepping inward from the outside into a glowing city/space, emphasizing "from outside in". -->

  <!-- Background decorative elements (the destination space) -->
  <circle cx="150" cy="120" r="60" fill="#222831" opacity="0.6"/>
  <path d="M120 160 L180 160 L165 90 L135 90 Z" fill="#2E3944" opacity="0.4"/>

  <!-- Portal / Gateway frame (representing the boundary between outside and inside) -->
  <path d="M70 50 L90 50 L90 190 L70 190 Z" fill="#3A4750"/>
  <path d="M60 50 L100 50 L100 56 L60 56 Z" fill="#00ADB5"/>
  <rect x="65" y="180" width="35" height="10" fill="#00ADB5" rx="2"/>

  <!-- Incoming path / Directional indicator arrows showing movement from outside (left) to inside (right) -->
  <path d="M30 120 L65 120" stroke="#FF5722" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M55 112 L67 120 L55 128" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The arriving person/talent (representing "外来人才/事物") stepping through the portal -->
  <g transform="translate(100, 75)">
    <!-- Briefcase (symbolizing professional talent/skilled worker) -->
    <rect x="32" y="55" width="14" height="10" rx="2" fill="#FFA500"/>
    <path d="M36 55 V52 C36 51 37 50 38 50 H40 C41 50 42 51 42 52 V55" fill="none" stroke="#FFA500" stroke-width="1.5"/>

    <!-- Person Body & Suit -->
    <path d="M20 70 L30 45 L40 70 L38 95 L22 95 Z" fill="#393E46"/>
    <!-- Shirt collar -->
    <path d="M27 45 L33 45 L35 52 L25 52 Z" fill="#EEEEEE"/>
    
    <!-- Head -->
    <circle cx="30" cy="30" r="9" fill="#FFD3B6"/>
    <!-- Hair -->
    <path d="M21 28 C21 23 25 21 30 21 C35 21 39 23 39 28 Z" fill="#393E46"/>

    <!-- Legs walking -->
    <path d="M24 95 L20 120 L26 122 L30 98 Z" fill="#222831"/>
    <path d="M36 95 L42 118 L36 120 L32 98 Z" fill="#222831"/>

    <!-- Arms -->
    <path d="M18 48 L26 70" stroke="#393E46" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 48 L36 60" stroke="#393E46" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Accent glow for the destination/arrival point -->
  <circle cx="160" cy="120" r="3" fill="#00ADB5"/>
  <circle cx="180" cy="95" r="2" fill="#FFA500"/>
  <circle cx="175" cy="155" r="2" fill="#00ADB5"/>
</svg>