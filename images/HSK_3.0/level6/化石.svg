<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="spotlight" cx="65%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Cave Wall / Environment Backdrops -->
  <path d="M0 0 L90 0 L70 90 L0 120 Z" fill="#1e293b" opacity="0.4" />
  <path d="M180 0 L240 0 L240 150 L160 110 Z" fill="#1e293b" opacity="0.6" />

  <!-- Ground / Dig Site Floor -->
  <path d="M0 160 Q 80 150, 240 170 L 240 240 L 0 240 Z" fill="url(#groundGrad)" />
  
  <!-- Exposed Rock Layer with Fossil Embedded -->
  <path d="M110 165 C 130 160, 160 170, 180 190 C 200 210, 190 230, 160 235 C 130 240, 100 220, 95 195 C 90 170, 95 170, 110 165 Z" fill="#475569" stroke="#64748b" stroke-width="2" />

  <!-- Dinosaur Fossil (T-Rex skull and spine embedded in rock) -->
  <g transform="translate(115, 175) rotate(-15)">
    <!-- Spine -->
    <path d="M 0 30 Q 15 20, 30 25 T 60 20" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="10" cy="27" r="3" fill="#fbbf24" />
    <circle cx="25" cy="22" r="3" fill="#fbbf24" />
    <circle cx="45" cy="22" r="3" fill="#fbbf24" />
    <circle cx="58" cy="18" r="2.5" fill="#fbbf24" />

    <!-- Skull & Jaw -->
    <path d="M 50 10 L 75 5 L 85 20 L 70 35 L 50 25 Z" fill="#f59e0b" />
    <!-- Eye socket -->
    <circle cx="68" cy="15" r="4" fill="#334155" />
    <!-- Teeth -->
    <path d="M 60 27 L 64 33 L 68 27 L 72 34 L 76 28" stroke="#fef3c7" stroke-width="2" fill="none" />
  </g>

  <!-- Excavation Tools: Rock Pick / Hammer on Ground -->
  <g transform="translate(60, 190) rotate(25)">
    <rect x="0" y="0" width="25" height="4" rx="2" fill="#94a3b8" />
    <path d="M 20 -6 L 32 2 L 20 10 Z" fill="#cbd5e1" />
  </g>

  <!-- Excavation Brush -->
  <g transform="translate(180, 200) rotate(-45)">
    <rect x="0" y="0" width="30" height="3" rx="1.5" fill="#b45309" />
    <rect x="25" y="-2" width="8" height="7" rx="1" fill="#d97706" />
    <path d="M 33 0 L 40 -3 L 40 10 L 33 7 Z" fill="#fef3c7" />
  </g>

  <!-- Scientist Character (Excited Discovery Pose) -->
  <g transform="translate(25, 95)">
    <!-- Back Arm holding magnifying glass/brush -->
    <path d="M 45 40 Q 60 30, 75 45" stroke="#f97316" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Body / Vest & Shirt -->
    <path d="M 30 35 L 60 35 L 65 85 L 25 85 Z" fill="#e2e8f0" />
    <!-- Explorer Vest -->
    <path d="M 28 35 L 42 35 L 45 85 L 25 85 Z" fill="#0284c7" />
    <path d="M 48 35 L 62 35 L 65 85 L 48 85 Z" fill="#0284c7" />
    <!-- Belt -->
    <rect x="25" y="80" width="40" height="6" fill="#334155" />
    <rect x="40" y="80" width="10" height="6" fill="#fbbf24" />

    <!-- Head & Face -->
    <circle cx="45" cy="18" r="14" fill="#fbcfe8" />
    <path d="M 31 15 Q 45 2, 59 15 Z" fill="#b45309" /> <!-- Hair / Hat base -->
    
    <!-- Safari Hat -->
    <ellipse cx="45" cy="9" rx="18" ry="5" fill="#fde047" />
    <path d="M 32 7 Q 45 -4, 58 7 Z" fill="#eab308" />

    <!-- Excited Expression (Wide eyes, open mouth smile) -->
    <circle cx="40" cy="16" r="2" fill="#0f172a" />
    <circle cx="50" cy="16" r="2" fill="#0f172a" />
    <path d="M 42 22 Q 45 27, 48 22 Z" fill="#e11d48" /> <!-- Smile -->

    <!-- Rosy Cheeks -->
    <circle cx="37" cy="19" r="2.5" fill="#f43f5e" opacity="0.4" />
    <circle cx="53" cy="19" r="2.5" fill="#f43f5e" opacity="0.4" />

    <!-- Legs -->
    <rect x="32" y="85" width="10" height="40" rx="3" fill="#334155" />
    <rect x="48" y="85" width="10" height="40" rx="3" fill="#334155" />
    <!-- Boots -->
    <path d="M 28 120 L 42 120 L 42 127 L 28 127 Z" fill="#78350f" />
    <path d="M 46 120 L 60 120 L 60 127 L 46 127 Z" fill="#78350f" />

    <!-- Front Arm (Pointing / Amazed gesture) -->
    <path d="M 58 40 Q 75 35, 85 55" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="55" r="4" fill="#fbcfe8" />
  </g>

  <!-- Scientific Clipboard / Notes Floating / Context Prop -->
  <g transform="translate(160, 45) rotate(12)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="10" y="-4" width="10" height="6" rx="1" fill="#64748b" />
    <!-- Abstract notes lines -->
    <line x1="6" y1="10" x2="20" y2="10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="18" x2="24" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="26" x2="16" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Mini dino sketch icon -->
    <circle cx="21" cy="32" r="3" fill="#f59e0b" />
  </g>

  <!-- Sparkles / Discovery Glow Effect -->
  <g transform="translate(130, 160)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fef08a" />
  </g>
  <g transform="translate(175, 185)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#38bdf8" />
  </g>
</svg>