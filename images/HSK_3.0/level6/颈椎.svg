      <rect x="12" y="45" width="36" height="12" rx="2" fill="#FFB347"/>
      <rect x="12" y="60" width="36" height="12" rx="2" fill="#FFB347"/>
      <rect x="10" y="75" width="40" height="12" rx="2" fill="#FFB347"/>
      <rect x="10" y="90" width="40" height="12" rx="2" fill="#FFB347"/>
      <rect x="8" y="105" width="44" height="12" rx="2" fill="#FFB347"/>
      <rect x="8" y="120" width="44" height="12" rx="2" fill="#FFB347"/>
      
      <!-- Intervertebral discs -->
      <rect x="15" y="42" width="30" height="3" fill="#A0A0A0"/>
      <rect x="12" y="57" width="36" height="3" fill="#A0A0A0"/>
      <rect x="12" y="72" width="36" height="3" fill="#A0A0A0"/>
      <rect x="10" y="87" width="40" height="3" fill="#A0A0A0"/>
