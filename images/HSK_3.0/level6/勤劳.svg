<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Plant Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall & Background Details -->
  <!-- Wallpaper subtle paneling lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>

  <!-- Window Frame in Background -->
  <g transform="translate(160, 25)">
    <rect x="0" y="0" width="55" height="90" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <rect x="4" y="4" width="47" height="82" rx="4" fill="url(#moonlight)"/>
    <!-- Window Panes -->
    <line x1="27" y1="4" x2="27" y2="86" stroke="#334155" stroke-width="1.5"/>
    <line x1="4" y1="45" x2="51" y2="45" stroke="#334155" stroke-width="1.5"/>
    <!-- Tiny Stars Outside -->
    <circle cx="12" cy="15" r="1" fill="#e2e8f0"/>
    <circle cx="40" cy="28" r="1.2" fill="#e2e8f0"/>
    <circle cx="20" cy="70" r="0.8" fill="#e2e8f0"/>
  </g>

  <!-- Shelf with Books & Plant -->
  <g transform="translate(25, 40)">
    <rect x="0" y="0" width="90" height="6" rx="2" fill="#475569"/>
    <!-- Potted Plant -->
    <path d="M12 0 L16 -12 L24 -12 L28 0 Z" fill="#cbd5e1"/>
    <path d="M14 -12 Q20 -24 16 -30 Q10 -20 14 -12 Z" fill="url(#leaf-grad)"/>
    <path d="M22 -12 Q30 -22 28 -28 Q20 -20 22 -12 Z" fill="url(#leaf-grad)"/>
    <path d="M18 -12 Q14 -26 20 -32 Q24 -22 18 -12 Z" fill="url(#leaf-grad)"/>
    <!-- Stack of Books -->
    <rect x="50" y="-14" width="26" height="14" rx="1" fill="#38bdf8"/>
    <rect x="48" y="-28" width="30" height="14" rx="1" fill="#f43f5e"/>
    <rect x="52" y="-40" width="22" height="12" rx="1" fill="#f59e0b"/>
  </g>

  <!-- Hanging Lamp Glow & Fixture -->
  <path d="M80 0 L80 40" stroke="#475569" stroke-width="2"/>
  <path d="M65 40 L95 40 L100 50 L60 50 Z" fill="#334155"/>
  <circle cx="80" cy="50" r="80" fill="url(#lamp-glow)" style="mix-blend-mode: screen;"/>

  <!-- Work Desk -->
  <g transform="translate(20, 160)">
    <!-- Main Desk Surface -->
    <rect x="0" y="0" num="1" width="160" height="12" rx="3" fill="#64748b"/>
    <!-- Desk Front Face -->
    <rect x="0" y="12" width="160" height="8" fill="#475569"/>
    <!-- Desk Legs -->
    <rect x="15" y="20" width="8" height="50" fill="#334155"/>
    <rect x="137" y="20" width="8" height="50" fill="#334155"/>
  </g>

  <!-- Desk Props (Stitcher, Fabric Rolls, Scissors, Threads) -->
  <g transform="translate(30, 135)">
    <!-- Fabric Basket / Pile -->
    <path d="M0 25 Q10 10 35 15 Q40 25 30 35 L5 35 Z" fill="#ec4899"/>
    <path d="M15 18 Q25 8 45 15 L40 30 Q25 25 15 18 Z" fill="#fb923c"/>
    <!-- Spools of Thread -->
    <rect x="115" y="15" width="10" height="15" rx="2" fill="#38bdf8"/>
    <rect x="113" y="13" width="14" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="113" y="28" width="14" height="3" rx="1" fill="#e2e8f0"/>

    <rect x="132" y="18" width="10" height="15" rx="2" fill="#f59e0b"/>
    <rect x="130" y="16" width="14" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="130" y="31" width="14" height="3" rx="1" fill="#e2e8f0"/>

    <!-- Sewing Machine / Detailed Craft Tool -->
    <g transform="translate(65, -5)">
      <path d="M0 30 L35 30 L35 10 L15 10 L15 5 L30 5 L30 0 L5 0 L0 25 Z" fill="#94a3b8"/>
      <circle cx="22" cy="15" r="3" fill="#334155"/>
      <line x1="30" y1="20" x2="30" y2="30" stroke="#cbd5e1" stroke-width="2"/>
    </g>
  </g>

  <!-- Hardworking Woman Character -->
  <g transform="translate(75, 75)">
    <!-- Torso (leaning forward attentively) -->
    <path d="M35 55 Q20 40 10 75 L45 85 L60 65 Z" fill="url(#shirt-grad)"/>
    
    <!-- Apron -->
    <path d="M25 55 L50 60 L45 95 L20 90 Z" fill="#f8fafc"/>
    <!-- Apron Pocket -->
    <rect x="28" y="72" width="14" height="12" rx="2" fill="#e2e8f0"/>
    <line x1="31" y1="78" x2="39" y2="78" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Head & Hair (Focused Expression) -->
    <g transform="translate(15, 10)">
      <!-- Hair Back/Bun -->
      <circle cx="-12" cy="15" r="10" fill="#0f172a"/>
      <!-- Head Base -->
      <circle cx="0" cy="15" r="16" fill="#fbcfe8"/>
      <!-- Hair Top -->
      <path d="M-15 12 Q-5 -2 12 5 Q18 12 16 22 Q5 10 -15 12 Z" fill="#0f172a"/>
      
      <!-- Face Details -->
      <!-- Eyebrows (slanted in focus/concentration) -->
      <line x1="-3" y1="11" x2="4" y2="13" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="6" y1="13" x2="12" y2="11" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Eyes (closed in concentration or focused downward) -->
      <path d="M-2 16 Q1 19 4 16" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M7 16 Q10 19 13 16" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Gentle Dedicated Smile -->
      <path d="M3 23 Q6 26 9 23" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Rosy Cheeks -->
      <circle cx="-1" cy="20" r="3.5" fill="#f43f5e" opacity="0.3"/>
      <circle cx="12" cy="20" r="3.5" fill="#f43f5e" opacity="0.3"/>
    </g>

    <!-- Arms & Hands Working -->
    <!-- Left Arm (Holding fabric) -->
    <path d="M30 50 Q10 55 5 70" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Left Hand -->
    <circle cx="3" cy="72" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (Reaching forward to craft) -->
    <path d="M50 50 Q65 60 70 72" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right Hand -->
    <circle cx="72" cy="75" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Fabric Piece being worked on across the table -->
  <path d="M60 150 Q90 142 130 148 L125 162 Q90 156 55 162 Z" fill="#38bdf8"/>
  <path d="M75 145 Q95 142 110 146" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- Warm ambient sparkles indicating dedication / industriousness -->
  <g transform="translate(130, 90)">
    <path d="M0 0 L2 5 L7 7 L2 9 L0 14 L-2 9 L-7 7 L-2 5 Z" fill="#fbbf24" opacity="0.8"/>
  </g>
  <g transform="translate(50, 115)">
    <path d="M0 0 L1.5 3.5 L5 5 L1.5 6.5 L0 10 L-1.5 6.5 L-5 5 L-1.5 3.5 Z" fill="#fbbf24" opacity="0.6"/>
  </g>
  <g transform="translate(100, 60)">
    <path d="M0 0 L1 2.5 L3.5 3.5 L1 4.5 L0 7 L-1 4.5 L-3.5 3.5 L-1 2.5 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

</svg>