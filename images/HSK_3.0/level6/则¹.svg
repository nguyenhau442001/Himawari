<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid lines for modern interface feel -->
  <line x1="30" y1="180" x2="210" y2="180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Step 1: Baseline / Initial State (Academic / Study) -->
  <g transform="translate(45, 110)">
    <!-- Base block representing baseline -->
    <rect x="0" y="30" width="50" height="40" rx="6" fill="#2E364F"/>
    <!-- Document/Book icon on baseline -->
    <rect x="12" y="10" width="26" height="26" rx="4" fill="#4B556B"/>
    <line x1="17" y1="17" x2="33" y2="17" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="17" y1="23" x2="27" y2="23" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Escalation / Transition Arrow (Visualizing "则" - then / consequently / even stronger) -->
  <g transform="translate(105, 125)">
    <path d="M 0 15 Q 15 -5 30 15" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="26,10 33,15 26,20" fill="#F59E0B"/>
  </g>

  <!-- Step 2: Escalated / Higher State (Work Capability / Stronger Output) -->
  <g transform="translate(145, 80)">
    <!-- Taller stacked blocks representing heightened output/capability -->
    <rect x="0" y="10" width="50" height="90" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Dynamic ascending chart / peak bars inside the upper block -->
    <rect x="10" y="30" width="8" height="50" rx="3" fill="#3B82F6"/>
    <rect x="21" y="20" width="8" height="60" rx="3" fill="#60A5FA"/>
    <rect x="32" y="10" width="8" height="70" rx="3" fill="#F59E0B"/>
    
    <!-- Peak achievement star/spark above -->
    <path d="M 36 -5 L 38 -12 L 45 -14 L 38 -16 L 36 -23 L 34 -16 L 27 -14 L 34 -12 Z" fill="#FBBF24"/>
  </g>
</svg>