<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Visual Metaphor: Progression / Origin Trace (Zooming back to pure, organic baseline) -->
  <g transform="translate(0, 0)">
    <!-- Atmospheric glow representing pure, pristine baseline -->
    <circle cx="120" cy="115" r="70" fill="#222733" opacity="0.6"/>
    <circle cx="120" cy="115" r="50" fill="#2A3142" opacity="0.4"/>

    <!-- Progression path / causality curve -->
    <path d="M 60 160 Q 90 120, 120 115 T 180 70" fill="none" stroke="#3A445C" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- Step 1: Processed / Synthetic artifact (Left) -->
    <g transform="translate(65, 135)">
      <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#2C3548" stroke="#4A5568" stroke-width="2"/>
      <path d="M -8 -8 L 8 8 M -8 8 L 8 -8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Transition indicator arrow -->
    <path d="M 98 123 L 106 118 L 98 113" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 2: Refining / Tracing back (Center) -->
    <g transform="translate(120, 115)">
      <circle cx="0" cy="0" r="18" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <!-- Magnifying / discovering pure origin lens -->
      <path d="M -5 -2 C -5 -5, 0 -7, 3 -4 C 5 -2, 4 3, 1 5" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="2" cy="1" r="1.5" fill="#10B981"/>
    </g>

    <!-- Transition indicator arrow -->
    <path d="M 134 107 L 142 102 L 134 97" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 3: Pure Natural Origin - Sprout / Organic baseline (Right / Peak) -->
    <g transform="translate(165, 75)">
      <!-- Ground / Soil line -->
      <path d="M -16 12 Q 0 16, 16 12" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Vibrant organic sprout (Core focus) -->
      <path d="M 0 12 C 0 5, -8 0, -10 -6 C -12 -12, -4 -14, 0 -10 C 4 -14, 12 -12, 10 -6 C 8 0, 0 5, 0 12 Z" fill="#10B981"/>
      <path d="M 0 12 L 0 0" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Contextual Product representation at the base (Connecting to "这个产品的成分很天然") -->
  <g transform="translate(120, 192)">
    <!-- Sleek container base representing product formulation -->
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#222B38" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Clean organic ingredient indicators on the product -->
    <circle cx="-25" cy="0" r="4" fill="#10B981"/>
    <circle cx="-13" cy="0" r="4" fill="#10B981"/>
    <circle cx="-1" cy="0" r="4" fill="#10B981"/>

    <!-- High-contrast focus accent mark (Gold/Orange) -->
    <path d="M 16 -4 L 22 2 L 32 -6" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>