<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric winter background elements -->
  <!-- Subtle night/winter sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#242B38"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D333B"/>
      <stop offset="100%" stop-color="#1F232A"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73B9FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E1F0FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="240" height="130" fill="url(#skyGrad)"/>

  <!-- Distant cold winter mountains / horizon silhouette -->
  <path d="M0 130 L40 105 L75 120 L120 90 L165 115 L210 95 L240 110 L240 130 Z" fill="#222831" opacity="0.6"/>

  <!-- Falling snow flakes (static vector elements) -->
  <g fill="#A6B9D0" opacity="0.6">
    <circle cx="35" cy="30" r="1.5"/>
    <circle cx="65" cy="70" r="2"/>
    <circle cx="105" cy="25" r="1"/>
    <circle cx="145" cy="55" r="1.5"/>
    <circle cx="185" cy="35" r="2"/>
    <circle cx="215" cy="85" r="1"/>
    <circle cx="20" cy="90" r="1.5"/>
    <circle cx="90" cy="100" r="1.5"/>
    <circle cx="160" cy="90" r="2"/>
  </g>

  <!-- THE ROAD SURFACE (路面) - Perspective view (Physical Object / Infrastructure) -->
  <g>
    <!-- Road base (asphalt) -->
    <path d="M40 130 L200 130 L220 220 L20 220 Z" fill="url(#roadGrad)" stroke="#39424E" stroke-width="2"/>

    <!-- Road texture / asphalt speckles -->
    <g fill="#3E4756" opacity="0.4">
      <circle cx="90" cy="150" r="1"/>
      <circle cx="150" cy="145" r="1.5"/>
      <circle cx="110" cy="170" r="1"/>
      <circle cx="135" cy="190" r="1.5"/>
      <circle cx="80" cy="205" r="1"/>
      <circle cx="160" cy="210" r="1"/>
    </g>

    <!-- Center lane markings (dashed yellow/orange lines fading into perspective) -->
    <path d="M118 135 L122 135 L123 148 L117 148 Z" fill="#F6AD55"/>
    <path d="M116 155 L124 155 L126 172 L114 172 Z" fill="#F6AD55"/>
    <path d="M113 180 L127 180 L130 202 L110 202 Z" fill="#F6AD55"/>
    <path d="M108 210 L132 210 L136 235 L104 235 Z" fill="#F6AD55"/>

    <!-- Slick Ice Layer on Asphalt (Visualizing winter freezing rain / "结薄冰") -->
    <path d="M55 145 C90 140, 160 140, 185 148 C210 155, 215 190, 200 210 C185 230, 60 225, 45 200 C30 175, 30 150, 55 145 Z" fill="url(#iceGrad)" stroke="#BCE0FD" stroke-width="1" stroke-dasharray="4,2"/>
    
    <!-- Ice surface highlights / gloss -->
    <path d="M70 155 C90 152, 140 153, 160 160" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M60 185 C90 180, 140 183, 175 195" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M90 210 C120 205, 150 208, 180 215" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Tiny ice crystal sparkle markers -->
    <g fill="#FFFFFF" opacity="0.8">
      <path d="M130 160 L132 165 L137 167 L132 169 L130 174 L128 169 L123 167 L128 165 Z" transform="scale(0.5) translate(130, 80)"/>
      <path d="M170 190 L171.5 194 L175 195.5 L171.5 197 L170 201 L168.5 197 L165 195.5 L168.5 194 Z" transform="scale(0.4) translate(220, 130)"/>
      <path d="M85 180 L86.5 184 L90 185.5 L86.5 187 L85 191 L83.5 187 L80 185.5 L83.5 184 Z" transform="scale(0.4) translate(90, 90)"/>
    </g>
  </g>

  <!-- Safety Warning / Focal Accent (Low Speed / Caution Indicator context) -->
  <!-- Sleek modern marker floating gently above road to anchor semantic focus -->
  <g filter="url(#glow)">
    <circle cx="120" cy="115" r="14" fill="#1A1D24" stroke="#F6AD55" stroke-width="3"/>
    <!-- Snowflake symbol inside warning badge -->
    <path d="M120 107 L120 123 M113 111 L127 119 M113 119 L127 111" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>