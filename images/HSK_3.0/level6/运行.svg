<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow for operational energy -->
  <circle cx="120" cy="120" r="80" fill="#0E2433" opacity="0.6"/>

  <!-- Motion Trails / Flow Lines -->
  <g fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.4">
    <path d="M 60 165 C 80 175, 110 175, 130 165" />
    <path d="M 50 180 C 75 192, 110 192, 135 180" />
  </g>

  <!-- Machine / Industrial Unit (Dynamic State) -->
  <!-- Base structure -->
  <path d="M 65 140 L 175 140 L 165 180 L 75 180 Z" fill="#334155" />
  <path d="M 75 105 L 165 105 L 175 140 L 65 140 Z" fill="#475569" />

  <!-- Control Panel & Status Light (Green = Normal Operation) -->
  <rect x="90" y="118" width="60" height="15" rx="3" fill="#1E293B"/>
  <circle cx="102" cy="125" r="4" fill="#22C55E"/> <!-- Active Normal Status Indicator -->
  <line x1="115" y1="125" x2="140" y2="125" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

  <!-- Dynamic Rotating Gears (Symbolizing "运行" - Operation/Running) -->
  <!-- Large Gear (Left) -->
  <g transform="translate(95, 75)">
    <circle cx="0" cy="0" r="22" fill="#0EA5E9" />
    <circle cx="0" cy="0" r="10" fill="#475569" />
    <!-- Gear teeth representation -->
    <rect x="-4" y="-27" width="8" height="6" rx="2" fill="#0EA5E9"/>
    <rect x="-4" y="21" width="8" height="6" rx="2" fill="#0EA5E9"/>
    <rect x="-27" y="-4" width="6" height="8" rx="2" fill="#0EA5E9"/>
    <rect x="21" y="-4" width="6" height="8" rx="2" fill="#0EA5E9"/>
    <rect x="-18" y="-21" width="6" height="8" rx="2" fill="#0EA5E9" transform="rotate(45)"/>
    <rect x="12" y="-21" width="6" height="8" rx="2" fill="#0EA5E9" transform="rotate(45)"/>
    <rect x="-18" y="13" width="6" height="8" rx="2" fill="#0EA5E9" transform="rotate(45)"/>
    <rect x="12" y="13" width="6" height="8" rx="2" fill="#0EA5E9" transform="rotate(45)"/>
  </g>

  <!-- Small Gear (Right, meshing) -->
  <g transform="translate(142, 60)">
    <circle cx="0" cy="0" r="14" fill="#38BDF8" />
    <circle cx="0" cy="0" r="6" fill="#475569" />
    <!-- Small gear teeth -->
    <rect x="-3" y="-18" width="6" height="4" rx="1" fill="#38BDF8"/>
    <rect x="-3" y="14" width="6" height="4" rx="1" fill="#38BDF8"/>
    <rect x="-18" y="-3" width="4" height="6" rx="1" fill="#38BDF8"/>
    <rect x="14" y="-3" width="4" height="6" rx="1" fill="#38BDF8"/>
  </g>

  <!-- Human Operator / Mechanic Action (Direct interaction showing cause and effect) -->
  <!-- Upper body and arm -->
  <path d="M 155 200 C 150 175, 175 160, 195 165" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
  <circle cx="195" cy="165" r="6" fill="#F59E0B" /> <!-- Hand adjusting/monitoring -->
  
  <!-- Body/Torso -->
  <path d="M 145 210 L 175 210 L 180 240 L 140 240 Z" fill="#D97706"/>
  <!-- Head -->
  <circle cx="165" cy="188" r="10" fill="#FBBF24"/>

  <!-- Energy Spark / Smooth Flow Indicator (Accent) -->
  <path d="M 115 50 Q 120 40 125 50 T 135 50" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="35" r="2" fill="#F59E0B" />
  <circle cx="135" cy="38" r="1.5" fill="#38BDF8" />

  <!-- Action Motion Lines (indicating smooth, normal mechanical rotation) -->
  <path d="M 72 50 C 78 44, 88 44, 94 50" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 150 42 C 154 38, 160 38, 164 42" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
</svg>