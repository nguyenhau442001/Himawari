<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Window Glow Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Warm Lamp Light -->
    <radialGradient id="lamp-light" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Hillside Gradient -->
    <linearGradient id="hill-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hill-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE: Cozy interior of a small town house overlooking rolling hills -->
  <g id="scenery-outside" clip-path="url(#window-clip)">
    <!-- Defs for window clipping or structure -->
  </g>

  <!-- Distant Small Town & Hills Outside Window -->
  <path d="M 0 160 Q 40 130 90 150 T 180 140 T 240 150 L 240 240 L 0 240 Z" fill="url(#hill-grad-1)"/>
  <!-- Distant tiny houses/roofs silhouette -->
  <path d="M 45 147 L 50 140 L 55 147 Z M 70 153 L 74 148 L 78 153 Z M 130 143 L 135 137 L 140 143 Z" fill="#1e293b"/>
  
  <!-- Closer Hill -->
  <path d="M 0 180 Q 70 160 140 185 T 240 175 L 240 240 L 0 240 Z" fill="url(#hill-grad-2)"/>
  <!-- Warm glowing lights from distant small town cabins -->
  <circle cx="52" cy="155" r="1.5" fill="#fde047"/>
  <circle cx="75" cy="158" r="1.5" fill="#fde047"/>
  <circle cx="137" cy="148" r="1.5" fill="#fde047"/>
  <circle cx="190" cy="165" r="1.5" fill="#fde047"/>

  <!-- Interior Room Background: Cozy Cozy Cottage Wall -->
  <rect x="15" y="15" width="210" height="175" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Wooden floor -->
  <polygon points="15,190 225,190 235,225 5,225" fill="#334155"/>
  <line x1="55" y1="190" x2="35" y2="225" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="115" y1="190" x2="105" y2="225" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="175" y1="190" x2="175" y2="225" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Large Feature Window showing the small town landscape -->
  <rect x="120" y="35" width="85" height="110" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="123" y="38" width="79" height="104" fill="url(#window-glow)"/>
  <!-- Window Panes Grid -->
  <line x1="162.5" y1="38" x2="162.5" y2="142" stroke="#475569" stroke-width="2"/>
  <line x1="123" y1="90" x2="202" y2="90" stroke="#475569" stroke-width="2"/>
  <!-- Curtains -->
  <path d="M 120 35 Q 125 70 123 145 L 120 145 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M 205 35 Q 200 70 202 145 L 205 145 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- Hanging Pendant Lamp casting warm light -->
  <line x1="75" y1="15" x2="75" y2="45" stroke="#64748b" stroke-width="2"/>
  <path d="M 60 45 L 90 45 L 82 55 L 68 55 Z" fill="#cbd5e1"/>
  <circle cx="75" cy="57" r="4" fill="#fbbf24"/>
  <!-- Ambient Lamp Cone Gradient Overlay -->
  <circle cx="75" cy="115" r="70" fill="url(#lamp-light)" style="mix-blend-mode: screen;"/>

  <!-- Bookshelf on back wall with props -->
  <rect x="25" y="45" width="45" height="70" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="68" x2="70" y2="68" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="92" x2="70" y2="92" stroke="#334155" stroke-width="2"/>
  <!-- Books -->
  <rect x="29" y="52" width="6" height="16" fill="#ef4444" rx="1"/>
  <rect x="36" y="50" width="8" height="18" fill="#38bdf8" rx="1"/>
  <rect x="45" y="54" width="5" height="14" fill="#10b981" rx="1"/>
  <rect x="30" y="75" width="7" height="17" fill="#fb923c" rx="1"/>
  <rect x="38" y="78" width="10" height="14" fill="#a855f7" rx="1"/>
  <!-- Potted Plant on shelf -->
  <path d="M 52 89 L 63 89 L 61 76 L 54 76 Z" fill="#f8fafc"/>
  <circle cx="57.5" cy="73" r="5" fill="#10b981"/>
  <circle cx="54" cy="74" r="4" fill="#059669"/>
  <circle cx="61" cy="74" r="4" fill="#059669"/>

  <!-- MAIN CHARACTER: Sitting comfortably at a cozy wooden desk, looking out the window/smiling, representing timeless familiarity ("仍旧") -->
  <g id="main-character">
    <!-- Wooden Desk -->
    <rect x="50" y="130" width="75" height="60" rx="3" fill="#b45309"/>
    <rect x="48" y="125" width="79" height="6" rx="2" fill="#d97706"/>
    <!-- Desk legs -->
    <rect x="55" y="190" width="6" height="30" fill="#78350f"/>
    <rect x="113" y="190" width="6" height="30" fill="#78350f"/>

    <!-- Chair -->
    <rect x="70" y="145" width="30" height="40" rx="4" fill="#92400e" transform="rotate(-5 85 165)"/>
    <rect x="65" y="175" width="35" height="8" rx="2" fill="#b45309"/>
    <line x1="72" y1="183" x2="68" y2="215" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <line x1="93" y1="183" x2="97" y2="215" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>

    <!-- Character Body (Sitting) -->
    <!-- Torso (Cozy sweater) -->
    <path d="M 68 125 C 65 140 68 165 72 175 L 98 175 C 102 165 105 140 102 125 Z" fill="#0284c7"/>
    <!-- Collar -->
    <path d="M 78 123 Q 85 129 92 123 Z" fill="#bae6fd"/>

    <!-- Left Arm (resting on desk, holding a warm mug) -->
    <path d="M 70 130 C 60 135 55 145 60 155 L 75 155" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hands -->
    <circle cx="62" cy="155" r="5" fill="#fbcfe8"/>

    <!-- Mug of warm tea/coffee -->
    <rect x="57" y="142" width="10" height="13" rx="2" fill="#f8fafc"/>
    <path d="M 57 145 C 53 145 53 151 57 151" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam wisps -->
    <path d="M 60 138 Q 62 134 60 130" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 64 139 Q 66 135 64 131" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Right Arm (relaxed or resting) -->
    <path d="M 100 130 C 108 140 105 155 98 165" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>

    <!-- Head & Face -->
    <!-- Neck -->
    <rect x="80" y="114" width="10" height="14" fill="#fbcfe8"/>
    <!-- Head Circle -->
    <circle cx="85" cy="100" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish, warm brown) -->
    <path d="M 67 100 C 67 85 80 81 85 81 C 95 81 103 88 103 100 C 103 100 101 93 96 90 C 90 86 80 87 74 91 C 69 94 67 100 67 100 Z" fill="#78350f"/>
    <path d="M 70 95 Q 75 88 84 87" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>

    <!-- Facial Expression: Warm, gentle smile looking towards the window -->
    <!-- Eyes (happy, peaceful crescent curves) -->
    <path d="M 78 98 Q 81 101 84 98" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 88 98 Q 91 101 94 98" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Gentle Smile -->
    <path d="M 83 106 Q 86 109 89 106" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="77" cy="103" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="95" cy="103" r="3" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- Foreground Props on Desk -->
  <!-- Open Sketchbook / Journal -->
  <path d="M 75 160 L 105 153 L 105 175 L 75 180 Z" fill="#f8fafc"/>
  <path d="M 90 156 L 105 153 L 105 175 L 90 178 Z" fill="#e2e8f0"/>
  <line x1="90" y1="156" x2="90" y2="178" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Pen -->
  <line x1="100" y1="150" x2="115" y2="165" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Cozy indoor details: Small plant on desk -->
  <path d="M 112 145 L 120 145 L 118 135 L 114 135 Z" fill="#ec4899"/>
  <circle cx="116" cy="132" r="4" fill="#10b981"/>

  <!-- Interior Floor Rug -->
  <ellipse cx="100" cy="205" rx="55" ry="15" fill="#334155" opacity="0.7"/>
  <ellipse cx="100" cy="205" rx="45" ry="11" fill="#475569" opacity="0.5"/>
</svg>