<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Tech Pattern -->
  <g opacity="0.1" stroke="#00E5FF" stroke-width="0.5">
    <line x1="30" y1="0" x2="30" y2="240"/>
    <line x1="90" y1="0" x2="90" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="240"/>
    <line x1="0" y1="60" x2="240" y2="60"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="180" x2="240" y2="180"/>
  </g>

  <!-- Scanner Device / Camera Frame (Action Context) -->
  <g transform="translate(40, 35)">
    <!-- Device Body -->
    <rect x="10" y="10" width="140" height="110" rx="16" fill="#2D323A" stroke="#4A5260" stroke-width="2"/>
    <rect x="22" y="22" width="116" height="86" rx="8" fill="#15181E"/>

    <!-- Dynamic Scanning Grid Inside Screen -->
    <path d="M 32 40 L 32 32 L 40 32" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 128 40 L 128 32 L 120 32" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 32 94 L 32 102 L 40 102" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 128 94 L 128 102 L 120 102" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Target / Human Silhouette Inside Screen -->
    <circle cx="80" cy="58" r="16" fill="#4A5260"/>
    <path d="M 54 90 C 54 78 66 74 80 74 C 94 74 106 78 106 90 Z" fill="#4A5260"/>

    <!-- Active Scanning Laser / Recognition Wave -->
    <line x1="32" y1="67" x2="128" y2="67" stroke="#FFB703" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="80" cy="67" r="26" fill="none" stroke="#FFB703" stroke-width="1.5" opacity="0.8"/>

    <!-- Biometric Recognition Nodes (Differentiation / Distinguishing) -->
    <circle cx="72" cy="54" r="2" fill="#00E5FF"/>
    <circle cx="88" cy="54" r="2" fill="#00E5FF"/>
    <circle cx="80" cy="64" r="2" fill="#00E5FF"/>
    <polyline points="72,54 80,64 88,54" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.7"/>

    <!-- Success / Identification Indicator -->
    <circle cx="120" cy="22" r="4" fill="#00E5FF"/>
  </g>

  <!-- Human Hand / Action Element (Verb representation) -->
  <g transform="translate(110, 120)">
    <!-- Motion lines showing action / pointing toward device -->
    <path d="M 15 45 C 30 35 45 25 60 15" stroke="#FFB703" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" fill="none"/>
    
    <!-- Stylized Hand interaction -->
    <path d="M 45 60 L 75 40 C 80 37 86 42 83 48 L 65 72 C 60 78 50 75 45 60 Z" fill="#FFB703" opacity="0.9"/>
    <circle cx="78" cy="43" r="6" fill="#FFA500"/>
  </g>

  <!-- Distinctive Output UI / Data Split (Visualizing "辨别" - Distinguishing/Identifying) -->
  <g transform="translate(35, 170)">
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#232730" stroke="#3A424E" stroke-width="1.5"/>
    
    <!-- Data classification icons/bars -->
    <circle cx="22" cy="18" r="8" fill="#00E5FF" opacity="0.2"/>
    <circle cx="22" cy="18" r="4" fill="#00E5FF"/>
    
    <rect x="38" y="12" width="45" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="38" y="21" width="30" height="4" rx="2" fill="#64748B"/>

    <!-- Match Verified Badge -->
    <g transform="translate(115, 10)">
      <rect x="0" y="0" width="45" height="16" rx="8" fill="#00E5FF" opacity="0.15"/>
      <path d="M 12 8 L 17 13 L 28 4" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34" cy="8" r="3" fill="#00E5FF"/>
    </g>
  </g>
</svg>