<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Window & City Glow Outside -->
  <path d="M 140 30 L 210 30 L 210 160 L 140 160 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Cityscape Silhouette -->
  <rect x="150" y="80" width="12" height="80" fill="#0f172a" opacity="0.4"/>
  <rect x="165" y="60" width="18" height="100" fill="#0f172a" opacity="0.5"/>
  <rect x="187" y="90" width="14" height="70" fill="#0f172a" opacity="0.4"/>
  <circle cx="200" cy="45" r="8" fill="#fbbf24" opacity="0.2"/>

  <!-- Office / Cozy Room Interior Background -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <!-- Floorboard lines -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#0f172a" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#0f172a" stroke-width="2" opacity="0.5"/>

  <!-- Bookshelf / Environment Props on Left -->
  <rect x="15" y="70" width="35" height="90" fill="#334155" rx="3"/>
  <rect x="20" y="85" width="25" height="6" fill="#64748b"/>
  <rect x="20" y="115" width="25" height="6" fill="#64748b"/>
  <!-- Colorful books -->
  <rect x="22" y="95" width="6" height="20" fill="#38bdf8"/>
  <rect x="30" y="93" width="8" height="22" fill="#ec4899"/>
  <rect x="22" y="125" width="10" height="20" fill="#10b981"/>

  <!-- Modern Desk -->
  <path d="M 70 145 L 230 145 L 220 190 L 60 190 Z" fill="#334155"/>
  <rect x="65" y="145" width="165" height="8" fill="#475569" rx="2"/>
  <!-- Desk Legs -->
  <rect x="80" y="153" width="6" height="37" fill="#1e293b"/>
  <rect x="205" y="153" width="6" height="37" fill="#1e293b"/>

  <!-- Desk Props (Laptop, Lamp, Coffee Mug) -->
  <!-- Laptop -->
  <path d="M 100 135 L 140 135 L 145 147 L 95 147 Z" fill="#cbd5e1"/>
  <path d="M 85 110 L 155 110 L 155 137 L 85 137 Z" fill="#94a3b8" rx="2"/>
  <path d="M 90 115 L 150 115 L 150 132 L 90 132 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Warm Desk Lamp -->
  <path d="M 185 145 L 195 145 L 190 110 Z" fill="#64748b"/>
  <path d="M 175 100 L 205 100 L 200 112 L 180 112 Z" fill="#fbbf24"/>
  <!-- Lamp glow cone -->
  <path d="M 160 145 L 190 112 L 220 145 Z" fill="#fbbf24" opacity="0.1"/>

  <!-- Coffee Mug & Plant -->
  <rect x="68" y="132" width="12" height="15" rx="3" fill="#f43f5e"/>
  <path d="M 80 136 C 84 136, 84 143, 80 143" stroke="#f43f5e" stroke-width="2" fill="none"/>
  
  <ellipse cx="180" cy="140" rx="8" ry="6" fill="#10b981"/>
  <path d="M 180 146 L 180 138" stroke="#334155" stroke-width="2"/>

  <!-- MAIN CHARACTER: FRIENDLY WOMAN WAVING ("Wait a moment, I'll be right back") -->
  <!-- Body / Torso -->
  <path d="M 90 140 C 90 120, 110 120, 115 140 L 120 180 L 85 180 Z" fill="#ec4899"/>
  <!-- Collar -->
  <path d="M 98 120 L 107 120 L 105 130 L 100 130 Z" fill="#fbcfe8"/>

  <!-- Head & Hair -->
  <circle cx="102" cy="95" r="18" fill="#f5d0b1"/>
  <!-- Hair Back/Top -->
  <path d="M 84 95 C 84 75, 120 75, 120 95 C 120 105, 118 115, 115 125 L 89 125 C 86 115, 84 105, 84 95 Z" fill="#332924"/>
  <!-- Hair Bangs -->
  <path d="M 87 90 C 95 82, 110 82, 117 90 C 112 85, 92 85, 87 90 Z" fill="#332924"/>

  <!-- Facial Expression: Smiling friendly eyes and warm expression -->
  <circle cx="96" cy="94" r="1.5" fill="#1e293b"/>
  <circle cx="108" cy="94" r="1.5" fill="#1e293b"/>
  <path d="M 100 100 Q 102 103 105 100" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="93" cy="98" r="3" fill="#f43f5e" opacity="0.3"/>
  <circle cx="111" cy="98" r="3" fill="#f43f5e" opacity="0.3"/>

  <!-- Left Arm (Resting on Desk/Hip) -->
  <path d="M 90 130 L 78 150 L 88 155" stroke="#ec4899" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right Arm (Raised gesturing "Wait a moment" / Waving palm open) -->
  <path d="M 114 130 C 125 120, 135 100, 130 85" stroke="#ec4899" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Hand Palm Facing Forward -->
  <circle cx="129" cy="80" r="6" fill="#f5d0b1"/>

  <!-- TIME / MOMENT SYMBOLISM: Floating abstract glowing hourglass/clock particles indicating "A short moment / 片刻" -->
  <g transform="translate(130, 40)" opacity="0.85">
    <!-- Hourglass shape -->
    <path d="M -6 -10 L 6 -10 L 2 -2 L 6 6 L -6 6 L -2 -2 Z" fill="#fbbf24" opacity="0.9"/>
    <!-- Glowing aura -->
    <circle cx="0" cy="-2" r="14" fill="#fbbf24" opacity="0.15"/>
    <!-- Tiny sparkle dots -->
    <circle cx="15" cy="-8" r="2" fill="#38bdf8"/>
    <circle cx="18" cy="8" r="1.5" fill="#fbbf24"/>
    <circle cx="-14" cy="4" r="2" fill="#38bdf8"/>
  </g>

  <!-- Foreground Atmospheric Lighting Accent -->
  <circle cx="120" cy="120" r="80" fill="#38bdf8" opacity="0.03"/>
</svg>