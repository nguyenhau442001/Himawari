<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Design: Garment/Clothing Silhouette representing 款式 (Style/Model/Design) -->
  <g transform="translate(0, 0)">
    <!-- Ambient glow / design canvas background -->
    <circle cx="120" cy="120" r="75" fill="#252A34" opacity="0.6"/>

    <!-- Hanger representation -->
    <path d="M120 52 C120 47 124 43 129 43 C134 43 138 47 138 52 C138 56 134 60 129 63 L129 72" 
          fill="none" stroke="#8E99A8" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M72 90 L120 72 L168 90" 
          fill="none" stroke="#8E99A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Main Jacket / Coat Silhouette (Emphasizing "款式" - fashion design/cut) -->
    <path d="M120 72 
             L148 84 
             L176 112 
             L164 122 
             L164 184 
             L76 184 
             L76 122 
             L64 112 
             L92 84 
             Z" 
          fill="#2C3440"/>

    <!-- Garment Inner Layer / Lining Accent -->
    <path d="M120 72 L120 184" stroke="#1A1D24" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Lapels / Design Lines (Highlighting 'style/cut') -->
    <path d="M120 72 L102 120 L112 128" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 72 L138 120 L128 128" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylish Buttons -->
    <circle cx="120" cy="142" r="3" fill="#F5A623"/>
    <circle cx="120" cy="162" r="3" fill="#F5A623"/>

    <!-- Design Pattern / Geometric Accents on the garment (representing modern design variety) -->
    <path d="M84 135 L96 135" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M84 145 L100 145" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M156 135 L144 135" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M156 145 L140 145" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Focus / Design Tool Indicator (Stylized drafting pen/ruler accent) -->
    <g transform="translate(162, 70) rotate(45)">
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#F5A623"/>
      <polygon points="0,32 3,40 6,32" fill="#F5A623"/>
    </g>
  </g>
</svg>