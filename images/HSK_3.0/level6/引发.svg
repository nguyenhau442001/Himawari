<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Cold Weather Element (Blue Snowflake/Frost lines top left) -->
    <g transform="translate(65, 75)">
      <circle cx="0" cy="0" r="22" fill="#243044" opacity="0.6"/>
      <path d="M-12 0 H12 M0 -12 V12 M-8 -8 L8 8 M-8 8 L8 -8" stroke="#4DA6FF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-28 -15 L-18 -5" stroke="#4DA6FF" stroke-width="2" stroke-linecap="round"/>
      <path d="M-22 20 L-12 10" stroke="#4DA6FF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Trigger Mechanism / Spark (Orange/Gold Accent) representing 引发 -->
    <g transform="translate(110, 105)">
      <circle cx="0" cy="0" r="18" fill="#2E251E"/>
      <!-- Sparks radiating -->
      <path d="M 0 -24 V -32 M 0 24 V 32 M -24 0 H -32 M 24 0 H 32 M -17 -17 L -23 -23 M 17 17 L 23 23 M -17 17 L -23 23 M 17 -17 L 23 -23" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Core spark -->
      <circle cx="0" cy="0" r="10" fill="#FF9F43"/>
      <path d="M-4 0 H4 M0 -4 V4" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Human Respiratory System Silhouette (Object representing the medical condition) -->
    <g transform="translate(155, 95)">
      <!-- Lungs container background -->
      <rect x="-25" y="-15" width="70" height="90" rx="12" fill="#242B38"/>
      
      <!-- Trachea -->
      <path d="M10 -5 V15" stroke="#E6EDF5" stroke-width="3" stroke-linecap="round"/>
      <path d="M6 0 V10 M10 0 V10 M14 0 V10" stroke="#E6EDF5" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Left Lung (Right side of image) -->
      <path d="M10 15 C 10 15, 30 18, 32 35 C 34 52, 20 62, 10 55 C 3 50, 4 30, 10 15 Z" fill="#E6EDF5" opacity="0.9"/>
      
      <!-- Right Lung (Left side of image) -->
      <path d="M10 15 C 10 15, -10 18, -12 35 C -14 52, 0 62, 10 55 C 17 50, 16 30, 10 15 Z" fill="#E6EDF5" opacity="0.9"/>
      
      <!-- Inflammation/Illness indicator (Orange/Red pulse dots inside lungs) -->
      <circle cx="18" cy="38" r="3.5" fill="#FF5252"/>
      <circle cx="2" cy="40" r="3" fill="#FF5252"/>
    </g>

    <!-- Connecting Action Flow Lines -->
    <path d="M 88 85 Q 98 80 102 92" fill="none" stroke="#4DA6FF" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 128 102 Q 138 95 145 105" fill="none" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>