<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: Heavy storm rain & rising water symbolizing "受灾" (suffering disaster/flood) -->
  <g opacity="0.3">
    <line x1="40" y1="30" x2="25" y2="70" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="20" x2="65" y2="60" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="35" x2="105" y2="75" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="25" x2="145" y2="65" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="30" x2="185" y2="70" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flood waters rising at the bottom -->
  <path d="M0 190 Q 60 180, 120 190 T 240 190 L 240 240 L 0 240 Z" fill="#1E3A8A" opacity="0.7"/>
  <path d="M0 200 Q 60 192, 120 200 T 240 200 L 240 240 L 0 240 Z" fill="#2563EB" opacity="0.6"/>

  <!-- Main dynamic visual: A human character caught in disaster/seeking shelter / affected by flood -->
  <!-- House structure leaning / impacted by flood -->
  <g>
    <!-- Roof -->
    <polygon points="120,70 50,120 190,120" fill="#EF4444"/>
    <!-- House body -->
    <rect x="70" y="120" width="100" height="70" fill="#374151"/>
    <!-- Flooded base of the house -->
    <rect x="70" y="150" width="100" height="40" fill="#1D4ED8" opacity="0.5"/>
    <!-- Door and Window -->
    <rect x="105" y="140" width="30" height="50" fill="#111827"/>
    <rect x="80" y="130" width="20" height="20" fill="#F59E0B"/>
  </g>

  <!-- Distressed / affected human character dynamic action (Action/Verb: 遭受灾害) -->
  <g transform="translate(10, 10)">
    <!-- Motion lines indicating sudden impact or urgency -->
    <path d="M35 110 L50 115" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 130 L45 133" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Character body leaning/shielding -->
    <circle cx="65" cy="110" r="10" fill="#FBBF24"/>
    <!-- Torso and arms gesturing protection/distress -->
    <path d="M65 120 L55 150 L75 150 Z" fill="#E0E7FF"/>
    <!-- Raised arms defending against elements -->
    <path d="M60 130 L45 120" stroke="#E0E7FF" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 130 L85 115" stroke="#E0E7FF" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs planted in rising water/ground -->
    <line x1="60" y1="150" x2="50" y2="180" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="150" x2="75" y2="180" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Foreground heavy rain drops emphasizing the active verb aspect (shòuzāi) -->
  <g>
    <line x1="20" y1="80" x2="10" y2="110" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="220" y1="90" x2="210" y2="120" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="140" x2="35" y2="170" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>