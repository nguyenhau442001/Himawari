<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Office Context -->
  <!-- Large Office Window showing evening city/sky -->
  <rect x="130" y="30" width="80" height="110" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M170 30 V140 M130 85 H210" stroke="#334155" stroke-width="2"/>
  <!-- City silhouette outside -->
  <path d="M135 140 V105 H145 V140 M150 140 V90 H165 V140 M175 140 V115 H185 V140 M190 140 V95 H205 V140" fill="#1e293b"/>
  <!-- Ambient window light beam -->
  <polygon points="130,85 210,85 230,195 90,195" fill="url(#warmLight)"/>

  <!-- Abandoned Office Desk -->
  <rect x="25" y="145" width="130" height="10" rx="2" fill="#475569" filter="url(#shadow)"/>
  <rect x="35" y="155" width="12" height="40" fill="#334155"/>
  <rect x="133" y="155" width="12" height="40" fill="#334155"/>
  <rect x="75" y="165" width="30" height="30" fill="#334155" rx="2"/> <!-- Office drawer unit -->

  <!-- Props on Desk: Packing Up / Bankrupt Elements -->
  <!-- Cardboard Box for packing belongings -->
  <path d="M40 120 L55 110 H95 L110 120 V145 H40 Z" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <path d="M55 110 V145 M95 110 V145" stroke="#92400e" stroke-width="2"/>
  <path d="M40 120 L75 130 L110 120" fill="none" stroke="#b45309" stroke-width="2"/>
  <!-- Rolled up blueprints / company posters sticking out of box -->
  <path d="M60 110 L50 85 M65 110 L55 83" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <path d="M75 112 L80 90" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  
  <!-- "FOR RENT / CLOSED" Sign leaning on desk -->
  <g transform="translate(100, 115) rotate(12)">
    <rect x="0" y="0" width="32" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Abstract closed sign graphic (no text) -->
    <circle cx="16" cy="12" r="8" fill="#ef4444" opacity="0.2"/>
    <path d="M11 7 L21 17 M21 7 L11 17" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug & Scattered Papers -->
  <rect x="125" y="132" width="12" height="13" rx="2" fill="#cbd5e1"/>
  <path d="M137 136 C141 136 141 141 137 143" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M115 142 L130 144 L128 141 Z" fill="#94a3b8"/> <!-- crumpled paper -->

  <!-- Expressive Character (Employee packing up, looking sad/defeated) -->
  <g transform="translate(155, 95)">
    <!-- Body / Torso (slumped shoulders) -->
    <path d="M25 45 C20 45 10 55 5 70 L45 85 L55 55 C45 48 35 45 25 45 Z" fill="#3b82f6"/>
    <path d="M12 55 L35 48" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Arms (reaching into box) -->
    <path d="M35 55 L15 70" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="12" cy="72" r="5" fill="#fde047"/> <!-- Hand -->

    <!-- Neck & Head -->
    <path d="M22 36 C22 32 28 32 28 36 Z" fill="#fde047"/>
    <circle cx="25" cy="22" r="14" fill="#fde047" filter="url(#shadow)"/>
    
    <!-- Hair -->
    <path d="M11 20 C11 10 20 8 28 10 C36 12 39 18 39 25 C39 25 35 16 26 15 C17 14 13 18 11 20 Z" fill="#334155"/>

    <!-- Sad Facial Expression (Downward gaze, downturned eyes/brows) -->
    <path d="M19 21 L23 23" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M27 23 L31 21" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M23 29 Q25 27 27 29" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Drooping posture indicator / sweat drop -->
    <path d="M35 18 C35 18 38 22 36 24 C34 26 32 23 35 18 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Floor & Details -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>
  
  <!-- Plant pot knocked over / withered plant (Symbol of failed business/abandonment) -->
  <g transform="translate(20, 175)">
    <path d="M15 15 L22 25 H8 Z" fill="#ef4444" transform="rotate(-40 15 15)" filter="url(#shadow)"/>
    <path d="M10 25 C5 20 2 10 0 0 C10 5 15 15 10 25 Z" fill="#64748b" transform="rotate(-30 10 25)"/>
    <path d="M12 25 C15 18 20 10 28 5 C22 12 18 18 12 25 Z" fill="#475569" transform="rotate(-10 12 25)"/>
  </g>

  <!-- Notice board or empty frame on the wall -->
  <rect x="60" y="35" width="45" height="35" rx="2" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M65 45 H95 M65 52 H85 M65 59 H90" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Crooked hanging string -->
  <path d="M82.5 20 L82.5 35" stroke="#64748b" stroke-width="1"/>
  <polygon points="80,20 85,20 82.5,15" fill="#64748b"/>

  <!-- Ambient lighting atmosphere overlay -->
  <circle cx="200" cy="50" r="1.5" fill="#cbd5e1" opacity="0.5"/>
  <circle cx="180" cy="40" r="1" fill="#cbd5e1" opacity="0.3"/>
  <circle cx="215" cy="70" r="2" fill="#cbd5e1" opacity="0.4"/>
</svg>