<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#2d3a4b"/>

  <!-- Wall -->
  <rect x="0" y="0" width="240" height="180" fill="#36455a"/>

  <!-- Window on the wall -->
  <rect x="160" y="40" width="60" height="80" rx="8" fill="#5a6f8a"/>
  <rect x="165" y="45" width="50" height="70" rx="5" fill="#a0d8f7"/>
  <rect x="190" y="45" width="5" height="70" fill="#5a6f8a"/>
  <rect x="165" y="75" width="50" height="5" fill="#5a6f8a"/>

  <!-- Clock on the wall -->
  <circle cx="50" cy="60" r="20" fill="#5a6f8a"/>
  <circle cx="50" cy="60" r="18" fill="#f0f0f0"/>
  <line x1="50" y1="60" x2="50" y2="48" stroke="#36455a" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="60" y2="60" stroke="#36455a" stroke-width="2" stroke-linecap="round"/>

  <!-- Teacher's Desk -->
  <rect x="20" y="140" width="80" height="40" rx="8" fill="#6b4c3b"/>
  <rect x="25" y="135" width="70" height="10" rx="4" fill="#8d6e5c"/>
  <rect x="30" y="180" width="10" height="20" fill="#6b4c3b"/>
  <rect x="70" y="180" width="10" height="20" fill="#6b4c3b"/>

  <!-- Books on desk -->
  <rect x="35" y="125" width="20" height="10" rx="2" fill="#4a7c59"/>
  <rect x="40" y="120" width="20" height="10" rx="2" fill="#38bdf8"/>

  <!-- Teacher Character -->
  <g id="teacher">
    <!-- Body -->
    <rect x="40" y="100" width="40" height="70" rx="10" fill="#5a6f8a"/>
    <!-- Head -->
    <circle cx="60" cy="85" r="20" fill="#fcd7b6"/>
    <!-- Hair -->
    <path d="M45 70 C40 60, 50 55, 60 55 C70 55, 80 60, 75 70 L75 85 C75 95, 45 95, 45 85 Z" fill="#4a3b2e"/>
    <!-- Eyes -->
    <circle cx="52" cy="82" r="2" fill="#36455a"/>
    <circle cx="68" cy="82" r="2" fill="#36455a"/>
    <!-- Mouth (serious expression) -->
    <path d="M55 90 Q60 88, 65 90" stroke="#36455a" stroke-width="1.5" fill="none"/>
    <!-- Arm 1 (pointing) -->
    <rect x="70" y="110" width="30" height="10" rx="5" fill="#5a6f8a" transform="rotate(15 70 110)"/>
    <rect x="90" y="105" width="15" height="8" rx="4" fill="#fcd7b6" transform="rotate(15 90 105)"/>
    <circle cx="100" cy="108" r="3" fill="#fcd7b6"/> <!-- Finger tip -->
    <!-- Arm 2 (relaxed) -->
    <rect x="30" y="110" width="30" height="10" rx="5" fill="#5a6f8a" transform="rotate(-10 30 110)"/>
    <rect x="25" y="115" width="15" height="8" rx="4" fill="#fcd7b6" transform="rotate(-10 25 115)"/>
  </g>

  <!-- Student Character -->
  <g id="student">
    <!-- Body -->
    <rect x="120" y="120" width="35" height="60" rx="8" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="138" cy="105" r="18" fill="#fcd7b6"/>
    <!-- Hair -->
    <path d="M128 95 C125 88, 135 85, 138 85 C141 85, 150 88, 147 95 L147 105 C147 110, 128 110, 128 105 Z" fill="#4a3b2e"/>
    <!-- Eyes (looking down slightly) -->
    <circle cx="133" cy="102" r="1.5" fill="#36455a"/>
    <circle cx="143" cy="102" r="1.5" fill="#36455a"/>
    <!-- Mouth (slight frown/apologetic) -->
    <path d="M135 108 Q138 109, 141 108" stroke="#36455a" stroke-width="1.5" fill="none"/>
    <!-- Backpack -->
    <rect x="115" y="125" width="10" height="30" rx="5" fill="#4a7c59"/>
    <!-- Arm 1 (down) -->
    <rect x="115" y="135" width="20" height="8" rx="4" fill="#38bdf8" transform="rotate(10 115 135)"/>
    <rect x="125" y="140" width="10" height="6" rx="3" fill="#fcd7b6" transform="rotate(10 125 140)"/>
    <!-- Arm 2 (down) -->
    <rect x="145" y="135" width="20" height="8" rx="4" fill="#38bdf8" transform="rotate(-10 145 135)"/>
    <rect x="148" y="140" width="10" height="6" rx="3" fill="#fcd7b6" transform="rotate(-10 148 140)"/>
  </g>
</svg>