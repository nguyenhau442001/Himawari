<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative map grid/glow effects -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="85" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="105" fill="none" stroke="#38BDF8" stroke-width="0.75" opacity="0.5"/>
  </g>

  <!-- South America Continent Silhouette -->
  <!-- Stylized modern flat vector representation of the South American landmass -->
  <g transform="translate(120, 120)">
    <!-- Glow/Shadow layer behind continent -->
    <path d="M -15,-75 C 10,-70 25,-40 30,-15 C 35,10 42,30 25,60 C 10,85 -2,95 -15,105 C -25,95 -30,70 -25,45 C -20,20 -35,-10 -30,-40 C -28,-60 -20,-70 -15,-75 Z" fill="#0EA5E9" opacity="0.2"/>
    
    <!-- Main Continent Shape -->
    <path d="M -15,-72 C -5,-70 12,-55 22,-30 C 32,-5 36,15 28,45 C 20,70 8,88 -1,98 C -12,88 -22,65 -20,38 C -18,12 -30,-8 -26,-35 C -24,-52 -18,-68 -15,-72 Z" fill="#10B981"/>
    
    <!-- Secondary geographical detailing / Amazon basin indication -->
    <path d="M -20,-10 C -10,-5 0,-15 15,-5 C 20,-2 25,5 20,12 C 10,15 -5,5 -20,-10 Z" fill="#059669" opacity="0.6"/>

    <!-- Andes mountains ridge highlight -->
    <path d="M -22,-35 C -26,-15 -20,10 -25,40" fill="none" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/>

    <!-- Equator line reference / Focal point accent -->
    <line x1="-50" y1="-30" x2="50" y2="-30" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
    
    <!-- Tropic of Capricorn reference -->
    <line x1="-50" y1="45" x2="50" y2="45" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>

    <!-- Highlight marker for Amazon Rainforest context -->
    <circle cx="2" cy="-10" r="5" fill="#F59E0B"/>
    <circle cx="2" cy="-10" r="9" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="6;14;6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Frame border accent -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>