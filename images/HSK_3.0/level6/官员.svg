  <path d="M85 190 L85 165 C85 150 95 140 120 140 C145 140 155 150 155 165 L155 190 Z" fill="#2D3748"/>
  
  <!-- Crisp White Shirt Collar -->
  <polygon points="105,140 120,158 135,140" fill="#E2E8F0"/>
  
  <!-- Formal Tie with Gold Accent (representing official status/authority) -->
