  <rect x="122" y="96" width="12" height="8" rx="2" fill="none" stroke="#D69E2E" stroke-width="1.5"/>
  <line x1="118" y1="100" x2="122" y2="100" stroke="#D69E2E" stroke-width="1.5"/>

  <!-- Official Badge / Lapel Pin (Golden star/crest symbolizing official duty) -->
