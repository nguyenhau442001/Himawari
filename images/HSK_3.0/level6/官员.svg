  <polygon points="102,154 103.5,157 106.5,157.5 104.2,159.5 105,162.5 102,161 99,162.5 99.8,159.5 97.5,157.5 100.5,157" fill="#FEFCBF" transform="scale(0.5) translate(103, 310)"/>

