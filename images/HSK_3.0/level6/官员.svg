  <!-- Hair (neat, professional parted hairstyle) -->
  <path d="M98 105 C98 90 105 83 120 83 C135 83 142 90 142 105 C142 110 140 103 138 98 C135 91 128 88 120 88 C112 88 105 91 102 98 C100 103 98 110 98 105 Z" fill="#2D3748"/>

