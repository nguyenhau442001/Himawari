<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Map Glow -->
    <radialGradient id="map-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- General Soft Shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Warm Light Cone -->
    <linearGradient id="light-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Container / Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light from Lamp -->
  <polygon points="120,40 50,220 190,220" fill="url(#light-cone)"/>

  <!-- Room Interior / Environment Elements -->
  <!-- Bookshelf / Background Wall -->
  <rect x="25" y="90" width="35" height="110" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="30" y="110" width="25" height="6" fill="#475569"/>
  <rect x="30" y="140" width="25" height="6" fill="#475569"/>
  <rect x="30" y="170" width="25" height="6" fill="#475569"/>

  <rect x="180" y="80" width="35" height="120" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="185" y="100" width="25" height="6" fill="#475569"/>
  <rect x="185" y="130" width="25" height="6" fill="#475569"/>
  <rect x="185" y="160" width="25" height="6" fill="#475569"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M120,0 L120,40" stroke="#64748b" stroke-width="2"/>
  <path d="M100,40 L140,40 L145,55 L95,55 Z" fill="#cbd5e1" filter="url(#soft-shadow)"/>
  <circle cx="120" cy="55" r="8" fill="#fde047"/>

  <!-- Large Study Table -->
  <rect x="40" y="185" width="160" height="15" rx="3" fill="#475569" filter="url(#soft-shadow)"/>
  <rect x="55" y="200" width="12" height="35" fill="#334155"/>
  <rect x="173" y="200" width="12" height="35" fill="#334155"/>

  <!-- Historical Map (The 'War' Context) on the Table -->
  <ellipse cx="120" cy="188" r="55" fill="url(#map-glow)"/>
  <g transform="translate(80, 160) rotate(-5)">
    <!-- Old Scroll Base -->
    <rect x="0" y="0" width="80" height="45" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <!-- Map Details: Rivers / Contours -->
    <path d="M10,10 Q30,30 40,15 T70,35" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M10,35 Q25,10 50,30 T75,10" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <!-- Miniature Strategic Markers (Armies/Castles representing "打仗") -->
    <!-- Red Army Piece -->
    <polygon points="25,25 22,32 28,32" fill="#ef4444"/>
    <circle cx="25" cy="23" r="2" fill="#ef4444"/>
    <!-- Blue Army Piece -->
    <polygon points="55,20 52,27 58,27" fill="#3b82f6"/>
    <circle cx="55" cy="18" r="2" fill="#3b82f6"/>
    <!-- Crossed Swords Icon on Map (representing past conflict) -->
    <line x1="38" y1="20" x2="48" y2="28" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="20" x2="38" y2="28" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass held over map -->
  <g transform="translate(130, 150) rotate(15)" filter="url(#soft-shadow)">
    <line x1="0" y1="0" x2="-25" y2="-25" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="18" fill="none" stroke="#334155" stroke-width="4"/>
    <circle cx="15" cy="15" r="16" fill="#bfdbfe" fill-opacity="0.3"/>
  </g>

  <!-- Researcher / Historian Character (Curious & Engaged) -->
  <g transform="translate(100, 100)" filter="url(#soft-shadow)">
    <!-- Character Body / Torso (leaning forward) -->
    <path d="M10,65 C10,45 25,40 40,40 C55,40 70,45 70,65 L75,85 L5,85 Z" fill="#0284c7"/>
    <!-- Collar / Shirt -->
    <polygon points="30,40 40,55 50,40" fill="#f8fafc"/>

    <!-- Head and Hair -->
    <circle cx="40" cy="22" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M24,20 C24,10 32,6 40,6 C48,6 56,10 56,20 C56,24 54,22 52,18 C48,12 32,12 28,18 C26,22 24,24 24,20 Z" fill="#334155"/>

    <!-- Round Glasses -->
    <circle cx="34" cy="23" r="5" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="46" cy="23" r="5" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <line x1="39" y1="23" x2="41" y2="23" stroke="#d97706" stroke-width="1.5"/>

    <!-- Thoughtful Face Expression (Eyebrows) -->
    <line x1="31" y1="17" x2="37" y2="19" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="43" y1="19" x2="49" y2="17" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms reaching down to the map -->
    <!-- Left Arm -->
    <path d="M15,55 Q5,65 15,75" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="15" cy="77" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (Holding magnifying glass handle implicitly) -->
    <path d="M65,55 Q75,65 65,75" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="65" cy="77" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Secondary Historical Artefact on Table (Globe / Helmet hinting at past wars) -->
  <g transform="translate(48, 155)" filter="url(#soft-shadow)">
    <!-- Ancient Helmet / Ornament -->
    <path d="M10,25 C10,12 20,5 30,5 C40,5 50,12 50,25 Z" fill="#64748b"/>
    <path d="M5,22 C5,22 30,18 55,22 L50,28 C50,28 30,24 10,28 Z" fill="#475569"/>
    <circle cx="30" cy="5" r="3" fill="#cbd5e1"/>
    <!-- Stand -->
    <rect x="27" y="28" width="6" height="12" fill="#334155"/>
    <rect x="17" y="40" width="26" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- Floating Dust / Atmosphere Particles (Warm golden motes) -->
  <circle cx="70" cy="90" r="1.5" fill="#fde047" opacity="0.6"/>
  <circle cx="150" cy="80" r="2" fill="#fde047" opacity="0.4"/>
  <circle cx="100" cy="70" r="1" fill="#fde047" opacity="0.8"/>
  <circle cx="170" cy="120" r="1.5" fill="#fde047" opacity="0.5"/>
  <circle cx="60" cy="130" r="2" fill="#fde047" opacity="0.3"/>
</svg>