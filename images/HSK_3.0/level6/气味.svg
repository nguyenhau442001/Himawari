<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Kitchen Environment -->
  <!-- Kitchen Wall & Backsplash -->
  <rect x="16" y="24" width="208" height="130" rx="12" fill="#1e293b"/>
  <path d="M16 114h208v40H16z" fill="#0f172a" opacity="0.4"/>
  <!-- Tiles lines -->
  <path d="M16 54h208M16 84h208M60 24v90M120 24v90M180 24v90" stroke="#334155" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Hanging Shelf -->
  <rect x="36" y="44" width="80" height="6" rx="3" fill="#64748b"/>
  <rect x="46" y="28" width="16" height="16" rx="3" fill="#cbd5e1" opacity="0.8"/>
  <rect x="70" y="24" width="18" height="20" rx="4" fill="#38bdf8" opacity="0.7"/>

  <!-- Kitchen Counter -->
  <rect x="16" y="154" width="208" height="62" rx="6" fill="#334155"/>
  <rect x="16" y="150" width="208" height="10" rx="3" fill="#475569"/>

  <!-- Stove / Pot Area -->
  <!-- Stove Top -->
  <ellipse cx="140" cy="165" rx="30" ry="8" fill="#1e293b"/>
  <!-- Glowing Burner Ring -->
  <ellipse cx="140" cy="165" rx="20" ry="5" fill="#f59e0b" opacity="0.8"/>

  <!-- Cooking Pot -->
  <path d="M115 135h50l-6 25h-38z" fill="#cbd5e1"/>
  <path d="M112 130h56v6h-56z" fill="#94a3b8"/>
  <circle cx="140" cy="123" r="6" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <!-- Pot Handles -->
  <path d="M102 140c-6 0-8-4-8-4s2-6 8-4" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M178 140c6 0 8-4 8-4s-2-6-8-4" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Aromatic Steam / Fragrance Waves (气味 visual representation) -->
  <g fill="none" stroke-linecap="round">
    <!-- Wavy ascending aroma lines -->
    <path d="M132 110C125 98 145 92 135 78C128 68 142 58 135 45" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
    <path d="M152 118C145 106 165 100 155 86C148 76 162 66 155 53" stroke="#f43f5e" stroke-width="2.5" opacity="0.6"/>
    <path d="M120 115C112 103 130 95 122 82" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    
    <!-- Floating fragrant scent curls / floral-like wisps -->
    <path d="M125 40c-6-4-4-10 2-10s8 6 2 10" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
    <path d="M150 32c5-3 4-8-1-9s-7 5-2 9" stroke="#f43f5e" stroke-width="2" opacity="0.7"/>
    <path d="M135 20c3-3 2-6-1-7s-5 4-2 7" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Chef / Character Reacting to Aroma -->
  <!-- Character Body / Apron -->
  <path d="M45 205c0-18 12-25 25-25s25 7 25 25v11H45z" fill="#f8fafc"/>
  <!-- Red Chef Scarf -->
  <path d="M57 172c6 4 14 4 20 0l4 8c-8 6-20 6-28 0z" fill="#ef4444"/>

  <!-- Character Head & Face -->
  <circle cx="67" cy="148" r="18" fill="#fbcfe8"/>
  <!-- Chef Hat (Toque) -->
  <path d="M54 134c-4-10 6-18 13-14c4-7 15-7 18 2c6 0 10 7 6 14z" fill="#ffffff"/>
  <rect x="53" y="132" width="28" height="6" rx="2" fill="#e2e8f0"/>

  <!-- Expression: Blissful / Delighted sniffing aroma -->
  <path d="M60 148c2 2 6 2 8 0" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M74 148c2 2 6 2 8 0" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Blushing Cheeks -->
  <circle cx="59" cy="153" r="3" fill="#f43f5e" opacity="0.5"/>
  <circle cx="79" cy="153" r="3" fill="#f43f5e" opacity="0.5"/>
  <!-- Smiling open mouth -->
  <path d="M66 157c3 2 7 2 10 0z" fill="#be123c"/>
  
  <!-- Content Context Props on Counter -->
  <plate cx="75" cy="180" rx="14" ry="4" fill="#e2e8f0"/>
  <!-- Spoon -->
  <path d="M185 165l15-5" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Foreground Atmospheric Glow (Warm lighting from kitchen stove) -->
  <circle cx="140" cy="150" r="45" fill="#f59e0b" opacity="0.12" style="mix-blend-mode: screen;" pointer-events="none"/>
</svg>