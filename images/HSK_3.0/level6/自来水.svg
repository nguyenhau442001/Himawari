<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glass of Water -->
  <path d="M85 155 L115 155 L111 200 C110.5 205 108 208 100 208 C92 208 89.5 205 89 200 Z" fill="#FFFFFF" fill-opacity="0.1" stroke="#94A3B8" stroke-width="2"/>
  <path d="M88 175 L112 175 L111 200 C110.5 205 108 208 100 208 C92 208 89.5 205 90 200 Z" fill="#38BDF8" fill-opacity="0.4"/>
  
  <!-- Water Stream -->
  <path d="M100 105 V170" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 10" opacity="0.3"/>
  <path d="M100 105 V172" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Modern Faucet (Tap) -->
  <path d="M170 200 V110 C170 80 145 70 125 70 H100 V105" fill="none" stroke="#CBD5E1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Faucet Spout Detail -->
