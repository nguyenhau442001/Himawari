  <!-- Faucet Handle (Accent Color) -->
  <rect x="174" y="120" width="12" height="30" rx="6" fill="#F59E0B"/>
  <circle cx="170" cy="135" r="4" fill="#F59E0B"/>
  
  <!-- Decorative Water Droplets -->
  <circle cx="100" cy="178" r="2" fill="#7DD3FC"/>
  <circle cx="108" cy="185" r="1.5" fill="#7DD3FC" opacity="0.6"/>
  <circle cx="94" cy="192" r="1.2" fill="#7DD3FC" opacity="0.4"/>
  
  <!-- Faucet Base -->
  <rect x="155" y="195" width="30" height="8" rx="2" fill="#94A3B8"/>
</svg>