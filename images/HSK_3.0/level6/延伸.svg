<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain Background -->
  <path d="M40 200 L120 100 L200 200 Z" fill="#2D343E"/>
  
  <!-- Road -->
  <path d="M120 100 L120 240" stroke="#FFB84D" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Human Character -->
  <g transform="translate(80, 180)">
    <!-- Body -->
    <path d="M20 0 L20 40 M20 10 L10 30 M20 10 L30 30" stroke="#E0E6ED" stroke-width="4" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="20" cy="-5" r="8" fill="#E0E6ED"/>
    <!-- Arm reaching out -->
    <path d="M20 10 L40 5" stroke="#E0E6ED" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Motion Lines indicating extension -->
  <g stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4">
    <path d="M125 110 L135 120"/>
    <path d="M125 130 L135 140"/>
    <path d="M125 150 L135 160"/>
  </g>
  
  <!-- Ground/Foreground -->
  <path d="M0 200 L240 200" stroke="#374151" stroke-width="2"/>
</svg>