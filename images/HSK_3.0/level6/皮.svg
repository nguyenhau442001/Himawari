<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Apple Body -->
    <path d="M-30,-20 C-60,-20 -60,20 -30,40 C0,60 60,60 90,40 C120,20 120,-20 90,-20 C60,-20 60,20 30,20 C0,20 0,-20 -30,-20" fill="#FF5722"/>
    <!-- Apple Stem -->
    <path d="M10,-20 L10,-40 M10,-40 L25,-50" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
    <!-- The Peel (皮) being removed -->
    <path d="M-30,-20 C-40,-40 -10,-60 10,-50 C30,-40 50,-60 70,-40 C90,-20 80,0 60,0 C40,-20 20,0 0,0 C-20,-20 -40,0 -30,-20" fill="none" stroke="#FFCC80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Knife -->
    <path d="M-50,10 L-20,30 L-10,20 L-40,0 Z" fill="#B0BEC5"/>
    <path d="M-60,20 L-50,10" stroke="#455A64" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>