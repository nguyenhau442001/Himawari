<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines for action -->
  <path d="M110 80 L130 60 M100 90 L120 70" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- The Object being built (High-quality structure/house) -->
  <path d="M70 180 L170 180 L170 140 L120 100 L70 140 Z" fill="#2D3436" stroke="#FFB84D" stroke-width="3"/>
  <rect x="90" y="140" width="20" height="40" fill="#3D454A"/>
  <rect x="130" y="140" width="20" height="20" fill="#FFB84D"/>
  
  <!-- Human Character (Action: Building/Crafting) -->
  <g transform="translate(40, 60)">
    <!-- Arm -->
    <path d="M60 100 L90 120" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="95" cy="125" r="8" fill="#FFB84D"/>
    <!-- Body -->
    <path d="M40 120 L60 180 L20 180 Z" fill="#5D6D7E"/>
    <!-- Head -->
    <circle cx="40" cy="100" r="15" fill="#FFB84D"/>
  </g>
  
  <!-- Construction Tool (Hammer) -->
  <g transform="translate(100, 100) rotate(45)">
    <rect x="0" y="0" width="30" height="8" fill="#BDC3C7"/>
    <rect x="10" y="-15" width="10" height="40" fill="#7F8C8D"/>
  </g>
</svg>