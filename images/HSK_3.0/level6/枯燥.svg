<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk and Chair -->
  <rect x="60" y="150" width="120" height="10" rx="2" fill="#4A5568"/>
  <rect x="70" y="160" width="10" height="40" rx="2" fill="#4A5568"/>
  <rect x="160" y="160" width="10" height="40" rx="2" fill="#4A5568"/>
  
  <!-- The "Dry/Boring" Subject: A stack of identical, grey, lifeless books -->
  <rect x="90" y="110" width="60" height="40" rx="2" fill="#718096"/>
  <rect x="92" y="112" width="56" height="36" rx="1" fill="#4A5568"/>
  <rect x="94" y="114" width="52" height="32" rx="1" fill="#2D3748"/>
  
  <!-- The Student: Representing the state of "枯燥" (boredom/dryness) -->
  <!-- Head -->
  <circle cx="120" cy="80" r="25" fill="#A0AEC0"/>
  <!-- Eyes: Closed/Dull/Flat lines -->
  <line x1="108" y1="75" x2="116" y2="75" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="75" x2="132" y2="75" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth: Flat/Straight line indicating lack of interest -->
  <line x1="110" y1="92" x2="130" y2="92" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Body -->
  <path d="M95 105 C95 105 100 140 120 140 C140 140 145 105 145 105 Z" fill="#4A5568"/>
  
  <!-- Visual Contrast: A single, withered, grey plant in a pot to emphasize "dryness" -->
  <rect x="170" y="130" width="30" height="20" rx="2" fill="#4A5568"/>
  <path d="M185 130 L185 100 M185 100 L175 90 M185 100 L195 90" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Accent: A small dull grey dust particle/symbol to emphasize the "dry/stagnant" atmosphere -->
  <circle cx="190" cy="70" r="3" fill="#4A5568"/>
  <circle cx="205" cy="85" r="2" fill="#4A5568"/>
</svg>