<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm vs Cool lighting gradients -->
    <radialGradient id="warmLight" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolLight" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Caution/Red Glow for 'Extreme' -->
    <radialGradient id="extremeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Peaceful/Balanced Glow for 'Alternative' -->
    <radialGradient id="balancedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Room Interior Background -->
  <rect x="0" y="0" width="240" height="240" fill="url(#wallGrad)"/>
  <rect x="0" y="0" width="240" height="240" fill="url(#warmLight)"/>
  <rect x="0" y="0" width="240" height="240" fill="url(#coolLight)"/>

  <!-- Window with city background -->
  <g transform="translate(145, 25)">
    <rect x="0" y="0" width="65" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- City silhouette -->
    <rect x="8" y="45" width="10" height="40" fill="#1e293b"/>
    <rect x="22" y="30" width="14" height="55" fill="#1e293b"/>
    <rect x="40" y="50" width="16" height="35" fill="#1e293b"/>
    <!-- Window pane grid -->
    <line x1="32.5" y1="0" x2="32.5" y2="85" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="42.5" x2="65" y2="42.5" stroke="#334155" stroke-width="1.5"/>
    <!-- Night sky star -->
    <circle cx="15" cy="15" r="1" fill="#cbd5e1"/>
    <circle cx="50" cy="20" r="1.5" fill="#cbd5e1"/>
  </g>

  <!-- Shelves with props -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="60" height="4" rx="2" fill="#475569"/>
    <!-- Plant pot -->
    <path d="M15 0 L18 -12 L28 -12 L31 0 Z" fill="#64748b"/>
    <circle cx="23" cy="-16" r="8" fill="#10b981"/>
    <circle cx="18" cy="-13" r="6" fill="#059669"/>
    <!-- Books -->
    <rect x="40" y="-12" width="6" height="12" fill="#f59e0b" rx="1"/>
    <rect x="47" y="-14" width="7" height="14" fill="#38bdf8" rx="1"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M10 185 L230 185 L220 220 L20 220 Z" fill="url(#deskGrad)"/>
  <rect x="10" y="179" width="220" height="6" rx="3" fill="#64748b"/>

  <!-- SCENE CONTEXT: The "Extreme" choice vs. "Balanced" choice dilemma -->
  <!-- Left Side: Extreme/Aggressive action option (Red Tint) -->
  <g transform="translate(60, 115)">
    <!-- Choice A visual indicator circle -->
    <circle cx="0" cy="20" r="28" fill="url(#extremeGlow)"/>
    <circle cx="0" cy="20" r="24" fill="#1e293b" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Dramatic hammer / smash icon representing extreme measure -->
    <path d="M-8 8 L8 32" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <path d="M-14 2 L-2 14 L4 8 L-8 -4 Z" fill="#ef4444"/>
    <!-- Warning cross -->
    <path d="M -6 12 L 6 28 M 6 12 L -6 28" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right Side: Balanced/Thoughtful choice option (Green Tint) -->
  <g transform="translate(180, 115)">
    <!-- Choice B visual indicator circle -->
    <circle cx="0" cy="20" r="28" fill="url(#balancedGlow)"/>
    <circle cx="0" cy="20" r="24" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Balanced scales / checkmark representing calm, measured approach -->
    <path d="M-10 22 L-3 29 L12 11" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Character: Stressed/Hesitant decision maker -->
  <g transform="translate(120, 115)">
    <!-- Character Shadow -->
    <ellipse cx="0" cy="74" rx="35" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Torso & Clothing (Modern Casual) -->
    <path d="M-22 45 L22 45 L28 75 L-28 75 Z" fill="#334155"/>
    <path d="M-12 45 L0 60 L12 45 Z" fill="#f8fafc"/> <!-- Shirt collar -->
    <path d="M0 45 L0 75" stroke="#1e293b" stroke-width="2"/> <!-- Jacket opening -->

    <!-- Arms & Hands showing hesitation (hands touching head/hair) -->
    <!-- Left Arm -->
    <path d="M-20 48 C-35 45 -40 25 -25 15" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <!-- Right Arm -->
    <path d="M20 48 C35 45 40 25 25 15" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-6" y="32" width="12" height="15" fill="#fca5a5" rx="4"/>

    <!-- Head & Face -->
    <circle cx="0" cy="20" r="22" fill="#fdd5b4"/>

    <!-- Hair (Messy, stressed style) -->
    <path d="M-22 18 C-24 5 -10 -2 0 -2 C10 -2 24 5 22 18 C22 10 15 2 0 2 C-15 2 -22 10 -22 18 Z" fill="#334155"/>

    <!-- Facial Expressions (Thoughtful, worried, stopping oneself) -->
    <!-- Eyebrows (slanted inward with stress) -->
    <path d="M-10 12 L-4 15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 12 L4 15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes (Focused downward/sideways, hesitant) -->
    <circle cx="-7" cy="18" r="2" fill="#1e293b"/>
    <circle cx="7" cy="18" r="2" fill="#1e293b"/>

    <!-- Mouth (Wavy/Tight line showing dilemma) -->
    <path d="M-5 28 Q0 25 5 28" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Sweat drop of stress -->
    <path d="M18 12 C18 12 22 18 22 20 C22 22 20 23 18 23 C16 23 14 22 14 20 C14 18 18 12 18 12 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Props on Desk -->
  <!-- Laptop/Computer showing chaotic chart vs calm line -->
  <g transform="translate(90, 160)">
    <!-- Laptop Base -->
    <path d="M-25 15 L25 15 L30 22 L-30 22 Z" fill="#94a3b8"/>
    <!-- Laptop Screen -->
    <rect x="-22" y="-12" width="44" height="27" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Screen content: sharp erratic red spike turning into stable green wave -->
    <path d="M-16 5 L-8 -2 L-2 8 L4 -5 L10 2 L16 -3" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M-16 2 C-10 2 -4 6 2 2 C8 -2 12 0 16 -1" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(165, 165)">
    <rect x="-8" y="0" width="16" height="18" rx="3" fill="#f8fafc"/>
    <path d="M8 3 C12 3 12 12 8 12" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M-2 -3 C-2 -6 2 -8 2 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Ambient lighting highlights -->
  <circle cx="120" cy="20" r="1" fill="#ffffff" opacity="0.5"/>
</svg>