<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Coffee Machine Gradient -->
    <linearGradient id="machine-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="error-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Kitchen / Breakroom Elements -->
  <!-- Wall tile lines -->
  <path d="M 0 140 L 240 140 M 0 100 L 240 100 M 0 60 L 240 60" stroke="#334155" stroke-width="1" opacity="0.4" />
  <path d="M 60 60 L 60 140 M 120 60 L 120 140 M 180 60 L 180 140" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- Wall Shelf -->
  <rect x="25" y="45" width="90" height="6" rx="3" fill="#475569" />
  <circle cx="45" cy="37" r="8" fill="#ec4899" />
  <path d="M 53 37 Q 60 37 60 45 L 30 45 Q 30 37 37 37 Z" fill="#ec4899" opacity="0.5" />
  <rect x="75" y="33" width="12" height="12" rx="2" fill="#10b981" />

  <!-- Countertop -->
  <rect x="10" y="170" width="220" height="50" rx="6" fill="#0f172a" />
  <rect x="10" y="170" width="220" height="8" rx="2" fill="#334155" />

  <!-- BROKEN MACHINE (机器出现故障) -->
  <g transform="translate(65, 80)">
    <!-- Machine Base Shadow -->
    <ellipse cx="55" cy="94" rx="50" ry="6" fill="#000000" opacity="0.4" />

    <!-- Machine Main Body -->
    <rect x="15" y="15" width="80" height="80" rx="12" fill="url(#machine-body)" />
    <!-- Metallic Panel Accent -->
    <rect x="25" y="25" width="60" height="35" rx="6" fill="#0f172a" opacity="0.6" />

    <!-- Glitchy Error Screen -->
    <rect x="33" y="32" width="44" height="20" rx="4" fill="#1e293b" />
    <!-- Warning symbol / Error bars on screen -->
    <path d="M 43 42 L 55 42 M 60 42 L 67 42" stroke="#ef4444" stroke-width="3" stroke-linecap="round" filter="url(#error-glow)" />
    <path d="M 37 37 L 41 37" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

    <!-- Machine Buttons & Dials -->
    <circle cx="35" cy="73" r="5" fill="#f1f5f9" />
    <circle cx="55" cy="73" r="7" fill="#ef4444" />
    <!-- Status Indicator Light (Flashing Red) -->
    <circle cx="75" cy="73" r="4" fill="#ef4444" filter="url(#error-glow)" />

    <!-- Spout & Cup area -->
    <rect x="45" y="60" width="20" height="10" fill="#334155" />
    <!-- NO liquid coming out, showing malfunction -->

    <!-- ERROR SPARKS / GLITCH EFFECTS (故障 visual cues) -->
    <path d="M 85 10 L 93 4" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" filter="url(#error-glow)" />
    <path d="M 10 25 L 3 20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" filter="url(#error-glow)" />
    <circle cx="95" cy="22" r="2" fill="#38bdf8" />
    <circle cx="5" cy="40" r="1.5" fill="#ef4444" />

    <!-- Smoke / Steam puffing erratically from side -->
    <path d="M 12 35 Q 5 30 8 22 Q 12 15 6 10" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Coffee Cup on Counter -->
  <g transform="translate(110, 165)">
    <path d="M 10 5 L 20 5 L 22 18 C 22 21 19 23 16 23 L 14 23 C 11 23 8 21 8 18 Z" fill="#f8fafc" />
    <path d="M 21 9 C 24 9 26 11 26 13 C 26 15 24 17 21 17" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- FRUSTRATED CHARACTER (Office Worker reacting to the malfunction) -->
  <g transform="translate(15, 95)">
    <!-- Body / Torso -->
    <path d="M 35 75 C 35 60 45 55 55 55 C 65 55 75 60 75 75 L 85 125 L 25 125 Z" fill="#6366f1" />
    <!-- Shirt Collar -->
    <path d="M 45 55 L 55 65 L 65 55" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round" />
    <path d="M 55 65 L 55 85" stroke="#f8fafc" stroke-width="2" />

    <!-- Head -->
    <circle cx="55" cy="38" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 39 35 C 39 24 46 21 55 21 C 64 21 71 24 71 35 C 71 38 69 33 67 30 C 63 26 57 26 55 26 C 53 26 47 26 43 30 C 41 33 39 38 39 35 Z" fill="#334155" />

    <!-- Face Expression (Baffled / Annoyed) -->
    <!-- Eyebrows angled in confusion/frustration -->
    <path d="M 46 33 L 51 35" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 59 35 L 64 33" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (closed or squinting in disbelief) -->
    <path d="M 47 38 L 51 38" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 59 38 L 63 38" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Open wavy mouth of dismay -->
    <path d="M 53 45 Q 55 42 57 45 Q 59 48 55 49 Z" fill="#1e293b" />

    <!-- Raised Hands in "What happened?" gesture -->
    <!-- Left Arm -->
    <path d="M 35 65 Q 20 60 15 45" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <circle cx="13" cy="42" r="5" fill="#fbcfe8" />

    <!-- Right Arm (bent, hand gesturing toward broken machine) -->
    <path d="M 75 65 Q 88 55 82 40" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <circle cx="80" cy="36" r="5" fill="#fbcfe8" />
  </g>

  <!-- Droplet / Sweat drop of annoyance near character's head -->
  <path d="M 105 115 C 105 112 108 108 108 108 C 108 108 111 112 111 115 C 111 117 109 119 108 119 C 107 119 105 117 105 115 Z" fill="#38bdf8" opacity="0.8" />
</svg>