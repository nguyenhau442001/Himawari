<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative soft glow representing warmth/affection -->
  <circle cx="120" cy="110" r="70" fill="#FFB703" opacity="0.06"/>

  <!-- Toy Race Car (the cherished object from context) -->
  <g transform="translate(145, 145)">
    <!-- Motion lines showing it's precious/dynamic -->
    <path d="M-15,12 L-22,12" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M-13,18 L-20,18" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Car body (sleek orange flat design) -->
    <path d="M -10,8 L 10,8 C 14,8 16,12 14,15 L -14,15 C -16,12 -14,8 -10,8 Z" fill="#E63946"/>
    <path d="M -6,3 L 6,3 C 8,3 9,8 9,8 L -9,8 C -9,8 -8,3 -6,3 Z" fill="#E63946"/>
    <path d="M-4,4 L4,4 L6,8 L-6,8 Z" fill="#A8DADC" opacity="0.8"/>
    
    <!-- Wheels -->
    <circle cx="-9" cy="15" r="4" fill="#2B2D42"/>
    <circle cx="-9" cy="15" r="1.5" fill="#8D99AE"/>
    <circle cx="9" cy="15" r="4" fill="#2B2D42"/>
    <circle cx="9" cy="15" r="1.5" fill="#8D99AE"/>
    
    <!-- Sparkle/Highlight for "cherished" value -->
    <path d="M12,-2 L13.5,-5 L16.5,-6.5 L13.5,-8 L12,-11 L10.5,-8 L7.5,-6.5 L10.5,-5 Z" fill="#FFB703"/>
  </g>

  <!-- Tender Human Character Action (Child gently holding/protecting their favorite toy close) -->
  <g transform="translate(100, 110)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="18" fill="#FFD166"/>
    <!-- Hair -->
    <path d="M -18,-45 C -15,-58 10,-58 17,-44 C 12,-52 -10,-50 -18,-45 Z" fill="#2B2D42"/>

    <!-- Body / Torso (leaning forward protectively) -->
    <path d="M -15,-15 C -20,-30 20,-30 15,-15 L 18,25 L -18,25 Z" fill="#457B9D"/>

    <!-- Arms hugging/cradling the toy close to the chest (Action: xīn'ài - cherishing deeply) -->
    <!-- Back arm -->
    <path d="M -12,-20 C -25,-15 -20,5 -5,10" fill="none" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Chest / Hug area indicator (Warm ambient golden focus light) -->
    <circle cx="-2" cy="5" r="14" fill="#FFB703" opacity="0.2"/>

    <!-- Front arm gently cradling -->
    <path d="M 12,-22 C 22,-15 15,12 0,12" fill="none" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-3" cy="12" r="4" fill="#FFD166"/>
  </g>

  <!-- Focus / Action Motion Arcs showing tender care and emotional attachment -->
  <path d="M 70,85 C 60,105 70,135 90,145" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-dasharray="4,4" stroke-linecap="round"/>
  <path d="M 140,80 C 150,95 150,120 135,135" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floor ground line -->
  <line x1="40" y1="175" x2="200" y2="175" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
</svg>