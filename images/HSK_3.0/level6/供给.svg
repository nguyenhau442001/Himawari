<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark slate container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Ambient lighting / Factory Interior background -->
  <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#1e293b"/>
  <!-- Factory beams and structure -->
  <rect x="30" y="70" width="180" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="70" x2="80" y2="180" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="70" x2="160" y2="180" stroke="#334155" stroke-width="2"/>
  
  <!-- Factory Window with warm amber glow (supplying energy/materials metaphor) -->
  <path d="M90 85 L150 85 L150 135 L90 135 Z" fill="#334155"/>
  <path d="M95 90 L145 90 L145 130 L95 130 Z" fill="#fef08a" opacity="0.2"/>
  <line x1="120" y1="85" x2="120" y2="135" stroke="#1e293b" stroke-width="2"/>
  <line x1="90" y1="110" x2="150" y2="110" stroke="#1e293b" stroke-width="2"/>

  <!-- Conveyor Belt System -->
  <rect x="25" y="165" width="190" height="20" rx="10" fill="#334155"/>
  <!-- Conveyor rollers -->
  <circle cx="45" cy="175" r="6" fill="#64748b"/>
  <circle cx="75" cy="175" r="6" fill="#64748b"/>
  <circle cx="105" cy="175" r="6" fill="#64748b"/>
  <circle cx="135" cy="175" r="6" fill="#64748b"/>
  <circle cx="165" cy="175" r="6" fill="#64748b"/>
  <circle cx="195" cy="175" r="6" fill="#64748b"/>
  
  <!-- Raw Materials (Crates / Timber / Metal Bars moving along) -->
  <!-- Crate 1 (Supplied goods) -->
  <g transform="translate(130, 138)">
    <rect width="32" height="28" rx="4" fill="#fb923c"/>
    <path d="M0 0 L16 14 L32 0" fill="none" stroke="#ea580c" stroke-width="2"/>
    <path d="M0 28 L16 14 L32 28" fill="none" stroke="#ea580c" stroke-width="2"/>
  </g>

  <!-- Raw Materials (Metal Rolls) -->
  <g transform="translate(60, 142)">
    <circle cx="12" cy="12" r="12" fill="#38bdf8"/>
    <circle cx="12" cy="12" r="6" fill="#0284c7"/>
    <rect x="24" y="4" width="8" height="16" rx="2" fill="#0ea5e9"/>
  </g>

  <!-- Factory Worker (Subject fulfilling the supply action) -->
  <g transform="translate(10, 80)">
    <!-- Worker Body -->
    <path d="M35 60 C35 45 45 40 55 40 C65 40 75 45 75 60 L80 100 L30 100 Z" fill="#0284c7"/>
    <!-- Safety Vest -->
    <path d="M40 45 L55 45 L52 85 L43 85 Z" fill="#fbbf24"/>
    <path d="M70 45 L55 45 L58 85 L67 85 Z" fill="#fbbf24"/>
    <!-- Head & Hard Hat -->
    <circle cx="55" cy="28" r="11" fill="#fcd34d"/>
    <path d="M40 24 C40 18 70 18 70 24 Z" fill="#f59e0b"/>
    <rect x="38" y="23" width="34" height="4" rx="2" fill="#d97706"/>
    <!-- Arm reaching out to control / supply -->
    <path d="M70 50 L95 65" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="95" cy="65" r="5" fill="#fcd34d"/>
  </g>

  <!-- Second Worker / Receiving end (Balanced composition) -->
  <g transform="translate(170, 85)">
    <path d="M30 55 C30 40 40 35 50 35 C60 35 70 40 70 55 L75 95 L25 95 Z" fill="#10b981"/>
    <circle cx="50" cy="23" r="10" fill="#fcd34d"/>
    <!-- Arm gesturing towards the materials -->
    <path d="M30 45 L10 55" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <circle cx="10" cy="55" r="4" fill="#fcd34d"/>
  </g>

  <!-- Industrial Machinery / Crane Arm from ceiling -->
  <path d="M120 40 L120 70" stroke="#64748b" stroke-width="6"/>
  <rect x="110" y="35" width="20" height="8" rx="2" fill="#475569"/>
  <path d="M115 70 L125 70 L130 90 L110 90 Z" fill="#334155"/>
  <!-- Glowing indicator light on machine (Active supply state) -->
  <circle cx="120" cy="80" r="3" fill="#ef4444"/>
  <circle cx="120" cy="80" r="6" fill="#ef4444" opacity="0.4"/>

  <!-- Foreground details: Floor shadow and sparks of productivity -->
  <ellipse cx="120" cy="200" rx="90" ry="6" fill="#090d16" opacity="0.6"/>
  
  <!-- Dynamic accent particles denoting active manufacturing/supplying -->
  <circle cx="155" cy="130" r="2" fill="#f59e0b"/>
  <circle cx="165" cy="125" r="1.5" fill="#fef08a"/>
  <circle cx="150" cy="115" r="2" fill="#38bdf8"/>
</svg>