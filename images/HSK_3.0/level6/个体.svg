<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow / base platform -->
  <ellipse cx="120" cy="190" rx="60" ry="12" fill="#111318"/>
  
  <!-- Central Character / Physical Individual (representing 个体 - cá thể, cá nhân) -->
  <g transform="translate(0, 0)">
    <!-- Body / Torso -->
    <path d="M 85 180 C 85 150 98 140 120 140 C 142 140 155 150 155 180 Z" fill="#2E3544"/>
    
    <!-- Outer jacket / vest accent representing self-employed individual / business owner context -->
    <path d="M 92 180 L 92 155 C 102 148 112 145 120 145 C 128 145 138 148 148 155 L 148 180 Z" fill="#3B445B"/>
    <path d="M 120 145 L 120 180" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Neck -->
    <rect x="112" y="124" width="16" height="22" rx="6" fill="#F2C59D"/>
    
    <!-- Head -->
    <circle cx="120" cy="98" r="26" fill="#F2C59D"/>
    
    <!-- Hair -->
    <path d="M 94 98 C 94 80 104 70 120 70 C 136 70 146 80 146 98 C 146 102 144 100 144 92 C 144 78 134 74 120 74 C 106 74 96 78 96 92 C 96 100 94 102 94 98 Z" fill="#3D322C"/>
    <circle cx="120" cy="68" r="8" fill="#3D322C"/>

    <!-- Confident, focused facial expression (Warm smile, professional) -->
    <circle cx="111" cy="95" r="2.5" fill="#2E231D"/>
    <circle cx="129" cy="95" r="2.5" fill="#2E231D"/>
    <path d="M 115 107 Q 120 112 125 107" fill="none" stroke="#2E231D" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Focus Accent: Spotlight/Halo effect behind the central figure to emphasize "Unique/Individual" (个体) -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#F6AD55" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Floating distinct entity node indicator (minimalist geometric highlight floating above, denoting distinct entity) -->
  <circle cx="120" cy="40" r="12" fill="#F6AD55" opacity="0.2"/>
  <circle cx="120" cy="40" r="6" fill="#F6AD55"/>
  <path d="M 120 48 L 120 56" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
</svg>