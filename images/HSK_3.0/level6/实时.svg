<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- GPS Navigation Pin/Device representing real-time traffic context -->
  <g transform="translate(0, 0)">
    <!-- Map grid lines background -->
    <path d="M60 40 L60 200 M120 40 L120 200 M180 40 L180 200 M40 80 L200 80 M40 140 L200 140" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    
    <!-- Winding Route/Road -->
    <path d="M50 190 C 80 190, 90 130, 120 130 C 150 130, 160 70, 190 50" stroke="#2D3748" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M50 190 C 80 190, 90 130, 120 130 C 150 130, 160 70, 190 50" stroke="#3B82F6" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/>

    <!-- Traffic Congestion Indicator Segments (Real-time data) -->
    <path d="M100 135 C 120 135, 135 110, 145 90" stroke="#EF4444" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Live Pulse / Real-time wave rings -->
    <circle cx="120" cy="115" r="32" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.3"/>
    <circle cx="120" cy="115" r="24" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.6"/>

    <!-- Central Location Pin (Physical Object representing the precise real-time point) -->
    <path d="M120 75 C 103.4 75, 90 88.4, 90 105 C 90 127.5, 120 155, 120 155 C 120 155, 150 127.5, 150 105 C 150 88.4, 136.6 75, 120 75 Z" fill="#F59E0B"/>
    
    <!-- Inner white dot of the pin -->
    <circle cx="120" cy="103" r="8" fill="#1A1D24"/>
    
    <!-- Live Clock / Sync indicator overlapping top right of pin -->
    <circle cx="148" cy="82" r="16" fill="#10B981" stroke="#1A1D24" stroke-width="3"/>
    <path d="M148 73 V 82 H 155" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>