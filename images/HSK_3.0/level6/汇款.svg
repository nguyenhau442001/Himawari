<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="windowNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Window framing a cozy night city vibe -->
  <path d="M 160 20 L 220 20 L 220 130 L 160 130 Z" fill="url(#windowNight)"/>
  <!-- Window Frame Grid -->
  <path d="M 160 20 L 220 20 L 220 130 L 160 130 Z" fill="none" stroke="#334155" stroke-width="4"/>
  <line x1="190" y1="20" x2="190" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="75" x2="220" y2="75" stroke="#334155" stroke-width="2"/>
  
  <!-- Distant City Lights through Window -->
  <circle cx="175" cy="45" r="1.5" fill="#fde047"/>
  <circle cx="205" cy="60" r="1.5" fill="#38bdf8"/>
  <circle cx="180" cy="100" r="1" fill="#f43f5e"/>
  <circle cx="200" cy="115" r="1.5" fill="#fde047"/>

  <!-- Indoor Wall Shelf with Family Photo & Plant -->
  <rect x="25" y="35" width="70" height="6" rx="3" fill="#475569"/>
  <!-- Potted Plant on Shelf -->
  <path d="M 35 35 L 45 35 L 43 25 L 37 25 Z" fill="#cbd5e1"/>
  <circle cx="40" cy="22" r="8" fill="#10b981"/>
  <circle cx="34" cy="20" r="6" fill="#059669"/>
  <circle cx="45" cy="18" r="6" fill="#34d399"/>
  
  <!-- Family Photo Frame on Shelf (Representing '家人' / Family) -->
  <rect x="62" y="15" width="22" height="20" rx="2" fill="#334155"/>
  <rect x="65" y="18" width="16" height="14" fill="#f8fafc"/>
  <!-- Abstract happy family silhouettes inside photo -->
  <circle cx="70" cy="23" r="2.5" fill="#475569"/>
  <path d="M 66 29 C 66 27 68 26 70 26 C 72 26 74 27 74 29 Z" fill="#475569"/>
  <circle cx="78" cy="24" r="2" fill="#475569"/>
  <path d="M 75 29 C 75 28 76.5 27 78 27 C 79.5 27 81 28 81 29 Z" fill="#475569"/>

  <!-- Warm Wall Lamp -->
  <circle cx="130" cy="45" r="30" fill="url(#lampGlow)"/>
  <path d="M 125 20 L 135 20 L 138 30 L 122 30 Z" fill="#64748b"/>
  <path d="M 130 30 L 130 38" stroke="#64748b" stroke-width="2"/>
  <circle cx="130" cy="39" r="4" fill="#fbbf24"/>

  <!-- Desk Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <path d="M 0 180 L 240 180" stroke="#334155" stroke-width="3"/>
  <rect x="15" y="195" width="80" height="25" rx="4" fill="#334155" opacity="0.4"/>

  <!-- CHARACTER: Young professional/worker sending remittance -->
  <!-- Chair Backrest -->
  <rect x="35" y="115" width="28" height="70" rx="6" fill="#334155"/>
  <rect x="41" y="125" width="16" height="50" rx="4" fill="#1e293b"/>

  <!-- Body / Torso (Cozy orange/coral sweater matching modern app palette) -->
  <path d="M 60 145 C 60 135 75 130 85 130 C 95 130 110 135 110 145 L 115 190 L 55 190 Z" fill="#f97316"/>
  <!-- Collar -->
  <path d="M 75 130 C 75 137 95 137 95 130 Z" fill="#ea580c"/>

  <!-- Head & Face Profile / Angle -->
  <!-- Neck -->
  <rect x="80" y="118" width="10" height="15" fill="#fbcfe8"/>
  <!-- Head -->
  <circle cx="85" cy="105" r="18" fill="#fbcfe8"/>
  <!-- Hair (Stylish dark bob/short cut) -->
  <path d="M 68 105 C 68 90 85 87 100 95 C 102 98 103 103 102 108 C 102 108 98 95 85 93 C 72 91 70 102 68 105 Z" fill="#1e293b"/>
  
  <!-- Happy/Focused Facial Expression -->
  <!-- Gentle smiling eye -->
  <path d="M 88 102 Q 91 106 94 102" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rosy cheek -->
  <circle cx="93" cy="108" r="3" fill="#fda4af" opacity="0.6"/>
  <!-- Smile -->
  <path d="M 90 113 Q 93 116 96 113" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left Arm (Holding phone/device steady) -->
  <path d="M 65 145 Q 55 155 65 170" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <!-- Left Hand -->
  <circle cx="67" cy="173" r="5" fill="#fbcfe8"/>

  <!-- Right Arm (Interacting with laptop / tapping screen) -->
  <path d="M 105 145 Q 115 155 105 165" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Hand -->
  <circle cx="102" cy="167" r="5" fill="#fbcfe8"/>


  <!-- PROPS: Laptop & Financial Transfer Animation UI -->
  <!-- Laptop Base -->
  <path d="M 80 185 L 150 185 L 160 195 L 70 195 Z" fill="#64748b" filter="url(#shadow)"/>
  <!-- Laptop Screen Lid -->
  <path d="M 85 130 L 145 130 L 150 185 L 80 185 Z" fill="#334155"/>
  <!-- Laptop Screen Display -->
  <rect x="90" y="136" width="50" height="43" rx="3" fill="url(#screenGrad)"/>

  <!-- UI Elements inside Laptop screen representing Remittance app -->
  <!-- Mini recipient avatar card -->
  <rect x="95" y="142" width="40" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="101" cy="148" r="3.5" fill="#f43f5e"/>
  <line x1="108" y1="147" x2="128" y2="147" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Success Transfer Checkmark Button in App -->
  <rect x="95" y="159" width="40" height="14" rx="4" fill="#10b981"/>
  <path d="M 108 166 L 113 170 L 123 162" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>


  <!-- DYNAMIC REMITTANCE VISUALIZATION (Coins & Transfer Flow) -->
  <!-- Glowing stream flowing upward/outward from laptop toward family (representing sending money home) -->
  <path d="M 115 135 Q 135 90 170 80" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 125 140 Q 145 95 180 85" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Floating Golden Coins (Huìkuǎn / Remittance concept) -->
  <g filter="url(#shadow)">
    <!-- Coin 1 -->
    <circle cx="120" cy="115" r="9" fill="url(#coinGrad)"/>
    <circle cx="120" cy="115" r="6" fill="none" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Coin 2 -->
    <circle cx="145" cy="95" r="11" fill="url(#coinGrad)"/>
    <circle cx="145" cy="95" r="7.5" fill="none" stroke="#d97706" stroke-width="1.5"/>

    <!-- Coin 3 (Higher up near window) -->
    <circle cx="168" cy="70" r="8" fill="url(#coinGrad)"/>
    <circle cx="168" cy="70" r="5" fill="none" stroke="#d97706" stroke-width="1.2"/>
  </g>

  <!-- Sparkles / Success indicators -->
  <path d="M 135 80 L 137 85 L 142 87 L 137 89 L 135 94 L 133 89 L 128 87 L 133 85 Z" fill="#fef08a"/>
  <path d="M 158 112 L 159.5 115 L 163 116.5 L 159.5 118 L 158 121 L 156.5 118 L 153 116.5 L 156.5 115 Z" fill="#fef08a"/>

</svg>