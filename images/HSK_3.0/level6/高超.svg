<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Magic Craft Glow -->
    <radialGradient id="magic-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="90" r="110" fill="url(#spotlight)" />

  <!-- Background Workshop Environment / Woodworking Workbench -->
  <!-- Back Wall Panel -->
  <rect x="20" y="30" width="200" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Tool Racks on Wall -->
  <line x1="40" y1="50" x2="100" y2="50" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <!-- Hanging Tools -->
  <path d="M50 50 L50 70 M47 70 L53 70" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <path d="M70 50 L65 75 L75 75 Z" fill="#64748b" />
  <path d="M90 50 L90 75" stroke="#94a3b8" stroke-width="2" />

  <!-- Workbench Surface -->
  <rect x="15" y="150" width="210" height="16" rx="4" fill="#334155" filter="url(#shadow)" />
  <rect x="25" y="166" width="15" height="40" fill="#1e293b" />
  <rect x="200" y="166" width="15" height="40" fill="#1e293b" />

  <!-- Detailed Wood Carving Project (A Masterpiece Sculpture in Progress) -->
  <g filter="url(#shadow)">
    <!-- Wooden Base -->
    <rect x="95" y="130" width="50" height="20" rx="3" fill="#92400e" />
    <!-- Intricate Sculpted Animal/Dragon/Bird shape (showing elite skill) -->
    <path d="M120 100 Q 135 110, 130 130 Q 110 135, 105 120 Q 115 110, 120 100 Z" fill="#d97706" />
    <path d="M120 100 C 120 80, 140 70, 145 85 C 150 100, 135 115, 130 130 Z" fill="#b45309" />
    <!-- Fine Details -->
    <path d="M140 80 Q 155 75, 150 90" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Magic Sparkles & Precision Aura (Representing 'Gāochāo' / Masterful Skill) -->
  <circle cx="130" cy="85" r="35" fill="url(#magic-glow)" />
  <!-- Sparkle Stars -->
  <path d="M150 65 L152 72 L159 74 L152 76 L150 83 L148 76 L141 74 L148 72 Z" fill="#38bdf8" />
  <path d="M95 95 L96 99 L100 100 L96 101 L95 105 L94 101 L90 100 L94 99 Z" fill="#fbbf24" />
  <path d="M135 115 L136 118 L139 119 L136 120 L135 123 L134 120 L131 119 L134 118 Z" fill="#38bdf8" />

  <!-- Master Artisan Character -->
  <!-- Body & Apron -->
  <path d="M 85 206 C 85 180, 155 180, 155 206 Z" fill="#3b82f6" />
  <rect x="95" y="155" width="50" height="55" rx="8" fill="#e2e8f0" filter="url(#shadow)" />
  <!-- Leather Straps -->
  <path d="M 105 155 L 115 185 M 135 155 L 125 185" stroke="#78350f" stroke-width="3" />
  <rect x="105" y="175" width="30" height="25" rx="4" fill="#cbd5e1" />

  <!-- Neck & Head -->
  <rect x="112" y="138" width="16" height="20" fill="#fbcfe8" />
  <circle cx="120" cy="125" r="18" fill="#fbcfe8" />

  <!-- Hair & Expression (Focused, Confident Master) -->
  <path d="M 102 120 C 102 105, 138 105, 138 120 C 138 125, 135 125, 135 120 C 135 110, 105 110, 105 120 Z" fill="#334155" />
  <!-- Focused Eyes & Smile -->
  <path d="M 113 124 Q 116 127 119 124" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 121 124 Q 124 127 127 124" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 118 131 Q 120 133 122 131" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Stylish Glasses -->
  <rect x="110" y="120" width="9" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <rect x="121" y="120" width="9" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <line x1="119" y1="123" x2="121" y2="123" stroke="#0f172a" stroke-width="1.5" />

  <!-- Artful Hands & Precision Tool -->
  <!-- Right Hand holding Chisel -->
  <path d="M 135 145 C 145 148, 148 138, 142 135" fill="#fbcfe8" />
  <!-- Chisel Tool -->
  <g transform="rotate(-30 135 130)">
    <rect x="133" y="105" width="4" height="30" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    <polygon points="133,105 137,105 135,98" fill="#94a3b8" />
    <rect x="131" y="132" width="8" height="6" rx="2" fill="#78350f" />
  </g>

  <!-- Left Hand gently stabilizing -->
  <path d="M 95 142 C 90 145, 95 152, 102 148" fill="#fbcfe8" />

  <!-- Floating Wood Shavings / Craft Details adding motion and excellence -->
  <path d="M 145 110 Q 155 100, 150 90" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 95 115 Q 85 105, 90 95" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Foreground Lighting Accent (Bottom Vignette) -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a" opacity="0.6" />
</svg>