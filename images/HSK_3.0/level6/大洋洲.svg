<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ocean Background with Subtle Waves/Gradients -->
  <circle cx="120" cy="120" r="82" fill="#22304A" opacity="0.6"/>
  <circle cx="120" cy="120" r="76" fill="#1E3A5F"/>

  <!-- Stylized Oceania Landmasses (Australia, New Zealand, Papua New Guinea, Pacific Islands) -->
  <!-- Australia (Main landmass) -->
  <path d="M75 105 C75 95, 90 85, 110 88 C130 90, 155 100, 160 115 C165 130, 155 150, 140 155 C125 160, 100 155, 90 145 C80 135, 75 115, 75 105 Z" fill="#2E7D32"/>
  
  <!-- Tasmania -->
  <path d="M115 167 C115 163, 122 163, 123 167 C124 171, 116 172, 115 167 Z" fill="#2E7D32"/>
  
  <!-- Papua New Guinea -->
  <path d="M85 70 C95 68, 108 73, 112 77 C116 81, 105 84, 95 82 C85 80, 80 73, 85 70 Z" fill="#388E3C"/>
  
  <!-- New Zealand (North & South Islands) -->
  <path d="M165 155 C167 150, 172 153, 171 159 C170 165, 163 167, 165 155 Z" fill="#2E7D32"/>
  <path d="M163 168 C164 165, 168 165, 167 175 C166 185, 160 180, 163 168 Z" fill="#2E7D32"/>

  <!-- Pacific Islands (Polynesia, Micronesia, Melanesia dots) -->
  <circle cx="140" cy="75" r="2.5" fill="#4CAF50"/>
  <circle cx="155" cy="82" r="2" fill="#4CAF50"/>
  <circle cx="172" cy="100" r="2" fill="#4CAF50"/>
  <circle cx="180" cy="120" r="2.5" fill="#4CAF50"/>
  <circle cx="165" cy="135" r="2" fill="#4CAF50"/>
  <circle cx="95" cy="120" r="2" fill="#4CAF50"/>
  <circle cx="65" cy="130" r="2" fill="#4CAF50"/>

  <!-- Compass / Focus Accent (Gold/Orange ring and marker) -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8"/>
  
  <!-- North Arrow Marker -->
  <polygon points="120,26 116,36 124,36" fill="#F59E0B"/>

  <!-- Subtle Latitude/Longitude Grid Lines -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="120" x2="208" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="120" y1="32" x2="120" y2="208" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
</svg>