<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements for context (Money vs Health binary choice representation) -->
  <g opacity="0.3">
    <!-- First option (Left): Money/Coins (Faded/De-emphasized to represent "前者") -->
    <circle cx="65" cy="120" r="28" fill="none" stroke="#64748B" stroke-dasharray="4 4" stroke-width="2"/>
    <text x="65" y="125" font-family="sans-serif" font-size="20" font-weight="bold" fill="#64748B" text-anchor="middle">$</text>
  </g>

  <!-- Connection / Choice Arrow -->
  <path d="M 98 120 L 132 120" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  <polygon points="135,120 128,116 128,124" fill="#475569"/>

  <!-- Second option (Right/Center): Health/Heart with Vitality (Highlighted to represent "后者" - The Latter) -->
  <g transform="translate(145, 80)">
    <!-- Glow/Focus ring for the chosen "latter" option -->
    <circle cx="35" cy="40" r="42" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Solid base container for the icon -->
    <circle cx="35" cy="40" r="34" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Medical Cross & Heart symbol representing Health (the chosen latter entity) -->
    <path d="M 35 21 
             C 27 13, 14 15, 14 26 
             C 14 37, 35 53, 35 53 
             C 35 53, 56 37, 56 26 
             C 56 15, 43 13, 35 21 Z" 
          fill="#F59E0B" />
          
    <!-- White medical cross detail inside for clarity -->
    <rect x="32" y="24" width="6" height="14" rx="1" fill="#1E293B"/>
    <rect x="28" y="28" width="14" height="6" rx="1" fill="#1E293B"/>
  </g>

  <!-- Focus Indicator / Checkmark badge firmly highlighting the "Latter" (后者) -->
  <g transform="translate(170, 130)">
    <circle cx="15" cy="15" r="14" fill="#10B981" stroke="#1A1D24" stroke-width="3"/>
    <path d="M 9 15 L 13 19 L 21 10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Left option label placeholder graphic (Dimmed stack of coins) -->
  <g transform="translate(45, 95)" opacity="0.4">
    <ellipse cx="20" cy="35" rx="18" ry="7" fill="#64748B"/>
    <path d="M 2 35 v 10 c 0 4, 8 7, 18 7 c 10 0, 18 -3, 18 -7 v -10" fill="#64748B"/>
    <ellipse cx="20" cy="25" rx="18" ry="7" fill="#94A3B8"/>
    <path d="M 2 25 v 10 c 0 4, 8 7, 18 7 c 10 0, 18 -3, 18 -7 v -10" fill="#94A3B8"/>
    <ellipse cx="20" cy="15" rx="18" ry="7" fill="#CBD5E1"/>
  </g>

</svg>