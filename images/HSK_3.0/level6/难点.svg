<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle chalkboard background hint -->
  <rect x="24" y="24" width="192" height="152" rx="8" fill="#222730" stroke="#2F3642" stroke-width="2"/>
  
  <!-- Chalkboard border/tray -->
  <rect x="20" y="184" width="200" height="6" rx="3" fill="#3A4250"/>
  
  <!-- Chalk lines representing grammar notes/formulas on the board -->
  <line x1="40" y1="50" x2="100" y2="50" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="65" x2="80" y2="65" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Central Physical Object: A stylized 3D puzzle block/cube representing a "difficult problem/point" (难点) being solved -->
  <g transform="translate(120, 105)">
    <!-- Shadow for depth -->
    <ellipse cx="0" cy="55" rx="35" ry="12" fill="#111317" opacity="0.6"/>
    
    <!-- Puzzle Cube Body (Isometric style) -->
    <!-- Back/Darker Faces -->
    <path d="M0 -30 L35 -10 L35 30 L0 10 Z" fill="#D97706"/>
    <path d="M-35 -10 L0 -30 L0 10 L-35 30 Z" fill="#B45309"/>
    <!-- Top Face -->
    <path d="M0 -50 L35 -30 L0 -10 L-35 -30 Z" fill="#F59E0B"/>
    
    <!-- The "Knotted/Complex" core or interlocking part representing the difficulty -->
    <circle cx="0" cy="-30" r="6" fill="#FDE68A"/>
    <path d="M-12 -5 Q0 -25 12 -5" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Exclamation mark / Focal point in bright gold/orange -->
    <circle cx="0" cy="-5" r="4" fill="#FFFFFF"/>
    <path d="M-2 -22 L2 -22 L1.5 -12 L-1.5 -12 Z" fill="#FFFFFF"/>
    
    <!-- Magnifying glass inspecting the difficulty -->
    <g transform="translate(45, 10)">
      <!-- Glass circle -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#38BDF8" stroke-width="5"/>
      <circle cx="0" cy="0" r="22" fill="#38BDF8" fill-opacity="0.15"/>
      <!-- Handle -->
      <line x1="15" y1="15" x2="32" y2="32" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
      <!-- Highlight reflection -->
      <path d="M-12 -10 A 14 14 0 0 1 2 -18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Teacher's pointer / Chalk piece resting on tray -->
  <rect x="40" y="176" width="40" height="4" rx="2" fill="#E2E8F0"/>
  <circle cx="82" cy="178" r="3" fill="#F59E0B"/>
</svg>