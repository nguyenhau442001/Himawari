<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Lighting Gradient -->
    <radialGradient id="warmLight" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing Heart Soft Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Warm Ambient Glow from Lamp -->
  <circle cx="150" cy="110" r="90" fill="url(#warmLight)"/>

  <!-- Back Wall & Window Frame -->
  <rect x="20" y="25" width="85" height="110" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="25" y="30" width="75" height="100" rx="2" fill="url(#moonlight)"/>
  <!-- Window Pane Crossbars -->
  <line x1="62" y1="30" x2="62" y2="130" stroke="#1e293b" stroke-width="3"/>
  <line x1="25" y1="80" x2="100" y2="80" stroke="#1e293b" stroke-width="3"/>
  <!-- Outside Night Stars -->
  <circle cx="40" cy="45" r="1.5" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="85" cy="55" r="1" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="50" cy="100" r="1.5" fill="#e2e8f0" opacity="0.5"/>

  <!-- Bookshelf Background -->
  <rect x="180" y="40" width="40" height="140" fill="#0f172a" opacity="0.5"/>
  <line x1="180" y1="80" x2="220" y2="80" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="130" x2="220" y2="130" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <rect x="185" y="60" width="8" height="20" rx="1" fill="#fb923c"/>
  <rect x="195" y="55" width="6" height="25" rx="1" fill="#38bdf8"/>
  <rect x="203" y="58" width="10" height="22" rx="1" fill="#10b981"/>
  <rect x="186" y="105" width="12" height="25" rx="1" fill="#ec4899"/>
  <rect x="200" y="110" width="8" height="20" rx="1" fill="#fbbf24"/>

  <!-- Wooden Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.8"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Cozy Rug -->
  <ellipse cx="130" cy="205" rx="70" ry="15" fill="#334155" opacity="0.7"/>
  <ellipse cx="130" cy="205" rx="55" ry="11" fill="#475569" opacity="0.6"/>

  <!-- FURNITURE & PROPS -->
  <!-- Sofa / Couch -->
  <path d="M 75 125 C 75 110, 95 105, 120 105 C 160 105, 185 115, 185 135 L 185 185 C 185 190, 180 195, 175 195 L 85 195 C 80 195, 75 190, 75 185 Z" fill="#334155"/>
  <!-- Sofa Cushions Back -->
  <path d="M 80 130 C 80 118, 95 112, 118 112 C 145 112, 180 118, 180 130 L 180 175 C 180 178, 177 180, 174 180 L 86 180 C 83 180, 80 178, 80 175 Z" fill="#475569"/>
  <!-- Sofa Armrests -->
  <ellipse cx="78" cy="155" rx="8" ry="30" fill="#64748b"/>
  <ellipse cx="182" cy="155" rx="8" ry="30" fill="#64748b"/>
  <!-- Throw Pillows -->
  <rect x="88" y="140" width="22" height="25" rx="6" fill="#fb923c" transform="rotate(-10 99 1525)"/>
  <rect x="150" y="142" width="22" height="24" rx="6" fill="#38bdf8" transform="rotate(15 161 154)"/>

  <!-- Coffee Table -->
  <ellipse cx="130" cy="190" rx="35" ry="12" fill="#64748b"/>
  <ellipse cx="130" cy="187" rx="33" ry="11" fill="#94a3b8"/>
  <!-- Teapot and Teacups on Table -->
  <circle cx="120" cy="182" r="6" fill="#f8fafc"/>
  <path d="M 126 182 C 128 182, 129 180, 129 178 C 129 176, 126 175, 125 175" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="135" y="180" width="5" height="4" rx="1" fill="#f8fafc"/>
  <rect x="145" y="181" width="5" height="4" rx="1" fill="#f8fafc"/>

  <!-- Floor Lamp -->
  <line x1="195" y1="190" x2="195" y2="70" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 180 75 L 210 75 L 200 50 L 190 50 Z" fill="#fbbf24"/>

  <!-- CHARACTERS (The Ordinary, Happy Couple) -->
  <!-- Male Character (Sitting on Left of Sofa) -->
  <!-- Head & Hair -->
  <circle cx="108" cy="122" r="10" fill="#fbcfe8"/>
  <path d="M 98 122 C 98 114, 104 112, 112 112 C 119 112, 118 120, 118 124 L 98 124 Z" fill="#334155"/>
  <!-- Body (Sweater) -->
  <path d="M 94 133 C 94 128, 100 126, 108 126 C 116 126, 122 128, 122 133 L 124 165 L 92 165 Z" fill="#3b82f6"/>
  <!-- Arm around partner -->
  <path d="M 112 135 C 118 135, 128 140, 136 145" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="138" cy="146" r="3.5" fill="#fbcfe8"/>

  <!-- Female Character (Sitting, Leaning on Partner) -->
  <!-- Head & Hair -->
  <circle cx="138" cy="120" r="10" fill="#fbcfe8"/>
  <!-- Ponytail/Hair bun -->
  <circle cx="146" cy="116" r="5" fill="#475569"/>
  <path d="M 128 118 C 128 112, 136 110, 144 114 C 148 116, 148 124, 144 128 L 128 128 Z" fill="#475569"/>
  <!-- Body (Cozy Sweater) -->
  <path d="M 126 132 C 126 128, 132 126, 140 126 C 148 126, 154 128, 154 132 L 156 165 L 124 165 Z" fill="#ec4899"/>
  <!-- Relaxed Hand holding teacup -->
  <circle cx="132" cy="155" r="3.5" fill="#fbcfe8"/>
  <path d="M 130 157 L 134 157" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

  <!-- EMOTIONAL CONTEXT & DETAILS (Happiness in simplicity) -->
  <!-- Glowing Heart floating softly between them -->
  <g filter="url(#glow)">
    <path d="M 123 105 C 123 101, 127 98, 131 101 C 133 103, 133 107, 123 113 C 113 107, 113 103, 115 101 C 119 98, 123 101, 123 105 Z" fill="#f43f5e" transform="translate(0, -5) scale(0.9)"/>
  </g>

  <!-- Potted Plant on Window Sill (Adding cozy domestic life) -->
  <rect x="75" y="118" width="14" height="12" rx="2" fill="#f8fafc"/>
  <path d="M 82 118 C 76 110, 78 100, 82 95 C 86 100, 88 110, 82 118 Z" fill="#10b981"/>
  <path d="M 82 118 C 79 112, 75 107, 72 105 C 76 103, 80 108, 82 118 Z" fill="#34d399"/>
  <path d="M 82 118 C 85 112, 89 107, 92 105 C 88 103, 84 108, 82 118 Z" fill="#34d399"/>

  <!-- Cute Cat Sleeping on the Floor Rug -->
  <ellipse cx="155" cy="208" rx="14" ry="9" fill="#fb923c"/>
  <circle cx="165" cy="204" r="6" fill="#fb923c"/>
  <!-- Cat Ears -->
  <polygon points="163,199 166,195 169,200" fill="#ea580c"/>
  <polygon points="167,200 170,196 172,201" fill="#ea580c"/>
  <!-- Cat Tail -->
  <path d="M 142 208 C 138 206, 136 212, 140 214" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>

  <!-- Soft vignette framing the warm moment -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.3"/>
</svg>