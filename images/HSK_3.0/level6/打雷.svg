<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filter for lightning and flashes -->
    <filter id="electric-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Cloud gradient -->
    <linearGradient id="storm-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A5568" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>

    <!-- Cloud backdrop gradient -->
    <linearGradient id="back-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <!-- Lightning gradient -->
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5" />
      <stop offset="30%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#DD6B20" />
    </linearGradient>
  </defs>

  <!-- Ambient lighting/flash aura -->
  <circle cx="120" cy="110" r="70" fill="#F6E05E" opacity="0.04" filter="blur(10px)" />

  <!-- Background distant clouds -->
  <path d="M 65 95 
           C 60 80, 80 65, 95 75 
           C 105 60, 135 60, 145 75 
           C 165 65, 185 85, 175 105 
           Z" 
        fill="url(#back-cloud)" />

  <!-- Main Storm Cloud (Foreground) -->
  <path d="M 70 115 
           C 55 115, 45 100, 55 85 
           C 55 70, 75 60, 90 70 
           C 105 50, 140 50, 155 70 
           C 175 65, 190 85, 180 105 
           C 195 115, 185 135, 165 135 
           L 75 135 
           C 60 135, 60 115, 70 115 Z" 
        fill="url(#storm-cloud)" />

  <!-- Rain drops -->
  <g fill="#63B3ED" opacity="0.6">
    <line x1="85" y1="145" x2="75" y2="165" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" />
    <line x1="110" y1="150" x2="100" y2="170" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" />
    <line x1="135" y1="145" x2="125" y2="165" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" />
    <line x1="160" y1="150" x2="150" y2="170" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Central Dynamic Lightning Bolt (打雷 - Thunder/Lightning Strike) -->
  <polygon points="135,90 100,140 125,140 105,195 155,130 125,130" 
           fill="url(#bolt-grad)" 
           filter="url(#electric-glow)" />

  <!-- Electric sparks / secondary bolts for energy -->
  <polyline points="110,115 95,125 105,130" 
            fill="none" 
            stroke="#F6E05E" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.8" />
            
  <polyline points="145,125 160,135 150,140" 
            fill="none" 
            stroke="#F6E05E" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.8" />

</svg>