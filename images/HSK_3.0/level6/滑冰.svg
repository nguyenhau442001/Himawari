<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ice Rink Floor (Perspective Ellipse/Shape) -->
  <path d="M 30,170 C 30,140 210,140 210,170 C 210,200 30,200 30,170 Z" fill="#253342" stroke="#3A506B" stroke-width="2"/>
  <ellipse cx="120" cy="170" rx="90" ry="25" fill="#2C3E50" opacity="0.6"/>
  
  <!-- Ice Reflection Lines -->
  <path d="M 60,165 Q 100,160 140,172" fill="none" stroke="#4A6572" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 90,178 Q 130,172 170,180" fill="none" stroke="#4A6572" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Motion lines / Gliding trails -->
  <path d="M 55,185 Q 90,175 130,188" fill="none" stroke="#E9C46A" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
  <path d="M 75,195 Q 110,185 150,198" fill="none" stroke="#E9C46A" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>

  <!-- Skater Character (Dynamic Ice Skating Pose) -->
  <!-- Torso & Head -->
  <circle cx="120" cy="75" r="14" fill="#E76F51"/> <!-- Head/Helmet -->
  <path d="M 112,89 Q 120,85 128,89 L 135,130 Q 120,135 105,130 Z" fill="#264653"/> <!-- Jacket -->

  <!-- Back Leg (Gliding) -->
  <path d="M 110,125 L 80,155 L 60,162" fill="none" stroke="#264653" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Front Leg (Bending) -->
  <path d="M 125,125 L 140,150 L 165,153" fill="none" stroke="#264653" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ice Skates & Blades -->
  <!-- Back Skate Blade -->
  <path d="M 50,164 L 75,164" stroke="#E9C46A" stroke-width="3" stroke-linecap="round"/>
  <!-- Front Skate Blade -->
  <path d="M 155,155 L 180,155" stroke="#E9C46A" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms in Motion (Balance) -->
  <!-- Back Arm -->
  <path d="M 112,95 L 90,110 L 80,105" fill="none" stroke="#264653" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Arm -->
  <path d="M 125,95 L 150,110 L 165,100" fill="none" stroke="#264653" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Atmospheric snowflake accents (Minimalist & Clean) -->
  <g fill="#4A6572" opacity="0.5">
    <circle cx="50" cy="60" r="2"/>
    <circle cx="190" cy="50" r="1.5"/>
    <circle cx="205" cy="110" r="2"/>
    <circle cx="35" cy="115" r="1.5"/>
    <circle cx="100" cy="40" r="1"/>
  </g>
</svg>