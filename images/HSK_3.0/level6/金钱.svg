<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/particles representing matter/substance -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.8"/>
  
  <!-- Physical Object: Stack of Gold Coins (representing material wealth / 金钱) -->
  <g transform="translate(0, 10)">
    <!-- Back Coin 1 -->
    <ellipse cx="120" cy="85" rx="36" ry="14" fill="#D97706"/>
    <path d="M 84 85 v 10 c 0 7.7 16.1 14 36 14 s 36 -6.3 36 -14 v -10 c 0 7.7 -16.1 14 -36 14 s -36 -6.3 -36 -14 z" fill="#B45309"/>

    <!-- Back Coin 2 -->
    <ellipse cx="120" cy="110" rx="38" ry="15" fill="#F59E0B"/>
    <path d="M 82 110 v 12 c 0 8.3 17 15 38 15 s 38 -6.7 38 -15 v -12 c 0 8.3 -17 15 -38 15 s -38 -6.7 -38 -15 z" fill="#D97706"/>

    <!-- Middle Coin -->
    <ellipse cx="120" cy="138" rx="40" ry="16" fill="#FBBF24"/>
    <path d="M 80 138 v 14 c 0 8.8 17.9 16 40 16 s 40 -7.2 40 -16 v -14 c 0 8.8 -17.9 16 -40 16 s -40 -7.2 -40 -16 z" fill="#D97706"/>

    <!-- Front/Top Main Coin -->
    <ellipse cx="120" cy="165" rx="42" ry="17" fill="#FCD34D"/>
    <!-- Inner rim for realism -->
    <ellipse cx="120" cy="165" rx="33" ry="13" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <!-- Center Square Hole (Traditional Chinese coin aesthetic) -->
    <path d="M 115 160 h 10 v 10 h -10 z" fill="#B45309"/>
    <path d="M 116 161 h 8 v 8 h -8 z" fill="#FCD34D"/>
  </g>

  <!-- Floating accent sparkles -->
  <path d="M 60 70 L 63 76 L 69 79 L 63 82 L 60 88 L 57 82 L 51 79 L 57 76 Z" fill="#FBBF24" opacity="0.6"/>
  <path d="M 180 90 L 182 94 L 186 96 L 182 98 L 180 102 L 178 98 L 174 96 L 178 94 Z" fill="#FCD34D" opacity="0.8"/>
  <path d="M 75 145 L 76.5 148 L 79.5 149.5 L 76.5 151 L 75 154 L 73.5 151 L 70.5 149.5 L 73.5 148 Z" fill="#F59E0B" opacity="0.5"/>
</svg>