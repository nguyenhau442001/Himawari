<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ground/environment contour -->
  <path d="M 30,195 Q 120,180 210,195 L 210,215 L 30,215 Z" fill="#252A34" opacity="0.6"/>

  <!-- Mud Puddle / Layer (The exact semantic object: "泥" - bùn, đất bùn) -->
  <path d="M 50,165 C 50,150 75,140 100,145 C 130,135 170,145 190,160 C 205,172 200,200 170,205 C 130,210 80,212 60,200 C 45,190 50,175 50,165 Z" fill="#6E5034"/>
  
  <!-- Wet sheen / Gloss highlights on mud -->
  <path d="M 75,160 Q 95,153 115,160 Q 95,167 75,160 Z" fill="#916B45" opacity="0.7"/>
  <path d="M 140,175 Q 165,168 180,180 Q 160,187 140,175 Z" fill="#916B45" opacity="0.6"/>
  <path d="M 90,185 Q 110,180 125,188 Q 110,193 90,185 Z" fill="#A47B53" opacity="0.5"/>

  <!-- Splatters / Droplets indicating wet texture ("稀泥") -->
  <circle cx="85" cy="132" r="4" fill="#6E5034"/>
  <circle cx="155" cy="138" r="3" fill="#6E5034"/>
  <circle cx="170" cy="130" r="2" fill="#6E5034"/>

  <!-- Raindrops falling (Contextual reference: "暴雨过后") -->
  <g stroke="#61AFEF" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="70" y1="60" x2="62" y2="80"/>
    <line x1="110" y1="45" x2="102" y2="65"/>
    <line x1="150" y1="55" x2="142" y2="75"/>
    <line x1="190" y1="70" x2="182" y2="90"/>
    <line x1="90" y1="95" x2="82" y2="115"/>
    <line x1="130" y1="80" x2="122" y2="100"/>
    <line x1="170" y1="105" x2="162" y2="125"/>
  </g>

  <!-- Focus/Accent element: A small green sprout emerging from the mud to show natural context -->
  <path d="M 120,155 Q 120,130 105,115" fill="none" stroke="#98C379" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120,140 Q 135,130 142,118 Q 130,120 120,140 Z" fill="#98C379"/>
  <path d="M 115,130 Q 100,120 95,110 Q 105,118 115,130 Z" fill="#98C379"/>

</svg>