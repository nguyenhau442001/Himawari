<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Ambient glow for neutral room temperature -->
    <circle cx="0" cy="10" r="65" fill="#2D3748" opacity="0.4"/>
    
    <!-- Wooden Shelf/Base representing indoor room environment -->
    <path d="M-80,85 L80,85 L70,95 L-70,95 Z" fill="#4A5568"/>
    <rect x="-90" y="95" width="180" height="6" rx="3" fill="#718096"/>

    <!-- Medicine/Pharma Bottle representing the contextual sentence -->
    <!-- Bottle Body -->
    <rect x="-24" y="-15" width="48" height="85" rx="8" fill="#2B6CB0"/>
    <path d="M-24,20 L24,20 L24,70 C24,74.4 20.4,78 16,78 L-16,78 C-20.4,78 -24,74.4 -24,70 Z" fill="#3182CE"/>
    
    <!-- Bottle Label -->
    <rect x="-18" y="25" width="36" height="40" rx="4" fill="#EDF2F7"/>
    <!-- Cross Symbol on Label -->
    <rect x="-3" y="37" width="6" height="16" rx="1" fill="#E53E3E"/>
    <rect x="-9" y="43" width="18" height="6" rx="1" fill="#E53E3E"/>

    <!-- Bottle Cap -->
    <rect x="-16" y="-30" width="32" height="18" rx="4" fill="#CBD5E0"/>
    <rect x="-18" y="-20" width="36" height="6" rx="2" fill="#A0AEC0"/>

    <!-- Room Temperature Icon Floating beside: Standard Thermometer showing moderate/ambient level -->
    <g transform="translate(52, -25)">
      <!-- Thermometer Outline -->
      <rect x="-10" y="-40" width="20" height="70" rx="10" fill="#2D3748" stroke="#CBD5E0" stroke-width="3"/>
      <!-- Thermometer Bulb -->
      <circle cx="0" cy="35" r="12" fill="#E53E3E" stroke="#CBD5E0" stroke-width="3"/>
      <!-- Mercury Level (Moderate - Room Temp) -->
      <rect x="-4" y="-10" width="8" height="45" rx="4" fill="#E53E3E"/>
      <!-- Temperature Scale Marks -->
      <line x1="-6" y1="-25" x2="-2" y2="-25" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
      <line x1="-6" y1="-10" x2="-2" y2="-10" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
      <line x1="-6" y1="5" x2="-2" y2="5" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Gentle Ambient Air/Environment Waves indicating stable normal room conditions -->
    <path d="M-65,-10 C-55,-15 -55,-5 -45,-10" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-72,15 C-62,10 -62,20 -52,15" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>