<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window Glow / Moonlight Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Thought Bubble Gradient (Introspection/Reflection) -->
    <linearGradient id="thought-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>

    <!-- Desk Lamp Cone -->
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. FULL BLEED BACKGROUND CONTAINER -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- 2. ROOM ENVIRONMENT & PROPS -->
  <!-- Back Wall Details -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" />
  
  <!-- Window showing night/evening city atmosphere -->
  <g transform="translate(150, 25)">
    <rect width="65" height="90" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <path d="M32.5 0 L32.5 90 M0 45 L65 45" stroke="#475569" stroke-width="1.5" />
    <!-- City lights through window -->
    <rect x="10" y="55" width="8" height="12" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="22" y="65" width="6" height="15" rx="1" fill="#38bdf8" opacity="0.5" />
    <rect x="45" y="50" width="10" height="25" rx="1" fill="#ec4899" opacity="0.4" />
    <rect x="15" y="20" width="7" height="10" rx="1" fill="#fbbf24" opacity="0.7" />
    <!-- Window Soft Glow Overlay -->
    <rect width="65" height="90" rx="4" fill="url(#window-glow)" />
  </g>

  <!-- Bookshelf / Books in background -->
  <g transform="translate(20, 40)">
    <rect x="0" y="0" width="40" height="6" rx="2" fill="#475569" />
    <path d="M5 -20 L9 0 M13 -18 L17 0 M21 -22 L25 0 M29 -15 L33 0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <rect x="3" y="-25" width="30" height="3" rx="1" fill="#64748b" />
  </g>

  <!-- Desk & Lamp setup -->
  <!-- Desk Surface -->
  <path d="M10 185 L230 185 L210 215 L30 215 Z" fill="#334155" />
  <path d="M10 180 L230 180 L230 185 L10 185 Z" fill="#475569" />

  <!-- Desk Lamp Beam & Base -->
  <path d="M195 180 L210 110 L220 110 L205 180 Z" fill="url(#lamp-cone)" />
  <circle cx="200" cy="181" r="8" fill="#64748b" />
  <path d="M198 181 L190 120 L210 115 L203 181 Z" fill="#475569" />
  <ellipse cx="200" cy="118" rx="8" ry="4" fill="#fbbf24" />

  <!-- Open Journal / Notebook on Desk (The context of reviewing/reflecting) -->
  <g transform="translate(130, 185) rotate(-5)">
    <path d="M0 0 L35 -8 L50 15 L15 23 Z" fill="#f8fafc" />
    <path d="M35 -8 L70 0 L55 23 L20 15 Z" fill="#f1f5f9" />
    <path d="M35 -8 L35 15" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Mock handwritten lines -->
    <path d="M8 3 L25 -1 M6 7 L23 3 M10 12 L22 8" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <path d="M42 -3 L60 1 M40 2 L58 6 M45 8 L55 10" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(45, 175)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#cbd5e1" />
    <path d="M16 4 C22 4, 22 14, 16 14" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Steam -->
    <path d="M5 -3 Q8 -8, 5 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M11 -5 Q14 -10, 11 -15" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 3. MAIN SUBJECT & INTROSPECTION GRAPHICS (反思 - Suy ngẫm lại) -->
  <!-- Thought / Reflection Cloud Network (Visualizing "Reflection" without text) -->
  <g opacity="0.85">
    <!-- Connecting Thought Lines -->
    <path d="M95 85 Q75 60, 55 75" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
    <path d="M110 80 Q120 50, 140 40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
    <path d="M115 95 Q150 80, 165 105" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />

    <!-- Thought Bubble 1: Past Action (Clock/Timeline memory) -->
    <g transform="translate(30, 60)" filter="url(#soft-shadow)">
      <circle cx="20" cy="20" r="18" fill="url(#thought-grad)" stroke="#fbbf24" stroke-width="1.5" />
      <!-- Clock icon inside -->
      <circle cx="20" cy="20" r="10" fill="none" stroke="#fbbf24" stroke-width="1.5" />
      <path d="M20 14 L20 20 L24 22" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <path d="M16 9 L24 9" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Thought Bubble 2: Insight/Lightbulb moment -->
    <g transform="translate(130, 20)" filter="url(#soft-shadow)">
      <circle cx="20" cy="20" r="22" fill="url(#thought-grad)" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Lightbulb icon inside -->
      <path d="M15 22 L25 22 M16 25 L24 25 M17 14 C17 10, 23 10, 23 14 C23 17, 20 18, 20 20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <path d="M12 15 Q10 10, 15 8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <path d="M28 15 Q30 10, 25 8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Thought Bubble 3: Growth / Positive Future Action -->
    <g transform="translate(160, 95)" filter="url(#soft-shadow)">
      <circle cx="18" cy="18" r="16" fill="url(#thought-grad)" stroke="#10b981" stroke-width="1.5" />
      <!-- Checkmark / Growth sprout icon inside -->
      <path d="M11 18 L16 22 L25 12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Character: Sitting at desk, resting chin on hand in deep contemplation -->
  <g transform="translate(75, 95)" filter="url(#soft-shadow)">
    <!-- Chair Back -->
    <rect x="-15" y="-10" width="22" height="90" rx="8" fill="#475569" />

    <!-- Torso (Hoodie / Casual Sweater - Warm Indigo/Slate) -->
    <path d="M-10 40 Q25 35, 45 80 L-15 85 Z" fill="#3b82f6" />
    <path d="M-5 40 Q20 38, 38 75 L0 75 Z" fill="#2563eb" opacity="0.3" /> <!-- Sweater shading -->

    <!-- Neck -->
    <rect x="12" y="22" width="14" height="20" rx="6" fill="#fed7aa" />

    <!-- Head & Face (Profile/Three-quarters tilted upward in thought) -->
    <g transform="translate(15, 0)">
      <!-- Hair (Modern styled dark hair) -->
      <path d="M -5 18 C -5 -2, 35 -2, 38 18 C 38 25, 30 25, 25 20 C 15 10, 5 15, -5 18 Z" fill="#1e293b" />
      
      <!-- Face Base -->
      <path d="M-2 15 C-2 32, 22 35, 28 18 C30 10, 25 2, 10 2 C2 2, -2 8, -2 15 Z" fill="#fed7aa" />

      <!-- Closed/Contemplative Eyes (Reflective mood) -->
      <path d="M 12 14 Q 16 17, 20 14" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

      <!-- Gentle Eyebrow tilted in thoughtfulness -->
      <path d="M 10 10 Q 16 7, 21 10" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />

      <!-- Calm/Neutral Mouth Line -->
      <path d="M 16 25 Q 19 27, 22 25" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" />

      <!-- Cute Round Blush -->
      <circle cx="22" cy="20" r="3" fill="#fb7185" opacity="0.4" />
    </g>

    <!-- Arms & Hands (The classic "thinking pose": hand supporting chin) -->
    <!-- Back Arm -->
    <path d="M 0 45 L 20 55 L 10 75" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Arm & Hand supporting chin -->
    <path d="M 35 60 Q 25 50, 27 33" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
    <!-- Hand on Chin -->
    <circle cx="27" cy="30" r="8" fill="#fed7aa" />
    <!-- Fingers curled softly near cheek -->
    <path d="M 23 26 C 28 24, 30 28, 26 33" fill="#fdba74" />
  </g>

  <!-- Ambient Light Accents (Warm, soft highlights) -->
  <circle cx="120" cy="100" r="70" fill="url(#thought-grad)" style="mix-blend-mode: overlay;" pointer-events="none" />
</svg>