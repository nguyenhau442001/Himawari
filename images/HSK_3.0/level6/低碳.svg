<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing subtle background aura for focus -->
  <circle cx="120" cy="120" r="70" fill="#2E4033" opacity="0.4"/>

  <!-- Ground / Soil line representing the environment -->
  <path d="M 70 175 Q 120 165 170 175" stroke="#374151" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Stylized physical object representing Low Carbon (dītàn): A vibrant sprouting green plant growing out of a sleek, minimalist dark carbon token/seed base -->
  <!-- Carbon base / core -->
  <ellipse cx="120" cy="170" rx="35" ry="12" fill="#374151"/>
  <ellipse cx="120" cy="167" rx="30" ry="9" fill="#1F2937"/>
  <path d="M 90 170 C 90 185 150 185 150 170" fill="#1F2937"/>

  <!-- Plant Stem -->
  <path d="M 120 167 C 120 145 115 125 120 100" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Fresh Green Leaves (symbolizing clean life/nature) -->
  <!-- Left Leaf -->
  <path d="M 117 135 C 95 125 90 100 110 105 C 118 107 119 120 117 135 Z" fill="#34D399"/>
  <!-- Right Leaf -->
  <path d="M 121 120 C 143 110 152 88 132 95 C 124 98 122 110 121 120 Z" fill="#059669"/>
  <!-- Top Leaf Bud -->
  <path d="M 120 100 C 120 85 130 80 130 90 C 130 98 120 100 120 100 Z" fill="#6EE7B7"/>

  <!-- Floating accent sparkles/dots (modern flat design detail) -->
  <circle cx="85" cy="105" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="155" cy="135" r="2.5" fill="#10B981" opacity="0.8"/>
  <circle cx="140" cy="75" r="2" fill="#F59E0B" opacity="0.7"/>
</svg>