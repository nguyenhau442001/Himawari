<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 40)">
    <!-- Background terrain layers -->
    <!-- Distant mountain -->
    <polygon points="60,90 120,40 180,90" fill="#2D3748" />
    <polygon points="120,40 180,90 140,90" fill="#252D3A" />

    <!-- Main mountain ranges (地形 - Topography/Terrain) -->
    <!-- Back mountain range -->
    <polygon points="20,110 90,50 160,110" fill="#3B4758" />
    <polygon points="90,50 160,110 125,110" fill="#323D4D" />
    
    <!-- Foreground rugged mountain -->
    <polygon points="50,130 110,75 180,130" fill="#4A5A6D" />
    <polygon points="110,75 180,130 145,130" fill="#3E4C5D" />

    <!-- Contour lines / Topographical elevation lines (orange/gold accent) -->
    <path d="M 35 120 Q 60 100 85 115 T 135 105 T 165 125" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 50 105 Q 75 85 100 100 T 145 90" fill="none" stroke="#F6AD55" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 75 90 Q 95 75 115 85" fill="none" stroke="#F6AD55" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

    <!-- Ground / Base platform -->
    <path d="M 10 130 L 170 130" stroke="#718096" stroke-width="3" stroke-linecap="round" />
    <path d="M 15 136 L 165 136" stroke="#4A5A6D" stroke-width="2" stroke-linecap="round" />

    <!-- Winding road representing the engineering challenge (contextual reference) -->
    <path d="M 25,128 Q 50,110 75,125 T 120,100 T 155,126" fill="none" stroke="#ED8936" stroke-width="3" stroke-dasharray="4 2" />
  </g>
</svg>