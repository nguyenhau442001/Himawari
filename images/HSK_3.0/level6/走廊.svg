<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Architectural perspective lines for school corridor (走廊) -->
  <g>
    <!-- Ceiling and floor vanishing point lines -->
    <polygon points="0,30 240,30 240,210 0,210" fill="#1E232F"/>
    
    <!-- Floor perspective grid -->
    <polygon points="40,210 200,210 220,240 20,240" fill="#252B38"/>
    <line x1="90" y1="210" x2="60" y2="240" stroke="#1A1D24" stroke-width="2"/>
    <line x1="150" y1="210" x2="180" y2="240" stroke="#1A1D24" stroke-width="2"/>

    <!-- Ceiling perspective -->
    <polygon points="40,30 200,30 220,0 20,0" fill="#161922"/>

    <!-- Left wall with lockers/windows -->
    <polygon points="0,30 40,30 40,210 0,210" fill="#2A3140"/>
    <rect x="10" y="50" width="20" height="60" rx="2" fill="#323B4D"/>
    <rect x="10" y="130" width="20" height="60" rx="2" fill="#323B4D"/>

    <!-- Right wall with large bright windows (宽敞明亮) -->
    <polygon points="200,30 240,30 240,210 200,210" fill="#2A3140"/>
    <!-- Window panes letting in bright warm light -->
    <polygon points="210,50 240,60 240,180 210,170" fill="#3A465C"/>
    <polygon points="215,60 240,68 240,172 215,162" fill="#E2E8F0" opacity="0.15"/>
    <line x1="240" y1="110" x2="212" y2="105" stroke="#1A1D24" stroke-width="3"/>
    
    <!-- Warm natural light cast on floor -->
    <polygon points="120,210 200,210 240,240 160,240" fill="#F59E0B" opacity="0.08"/>
  </g>

  <!-- Students chatting in groups during recess (同学们三五成群地在...走廊里聊天) -->
  <g transform="translate(0, 10)">
    <!-- Student group 1 (Left) -->
    <!-- Student A -->
    <circle cx="85" cy="130" r="9" fill="#FBBF24"/>
    <path d="M75,160 C75,145 80,142 85,142 C90,142 95,145 95,160 Z" fill="#3B82F6"/>
    <rect x="80" y="155" width="10" height="25" fill="#1E293B"/>

    <!-- Student B (facing A, gesturing) -->
    <circle cx="110" cy="125" r="9" fill="#FBBF24"/>
    <path d="M102,155 C102,142 107,140 110,140 C113,140 118,142 118,155 Z" fill="#EF4444"/>
    <rect x="105" y="152" width="10" height="28" fill="#1E293B"/>
    <!-- Friendly conversational arm gesture -->
    <line x1="110" y1="148" x2="98" y2="142" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Student group 2 (Right, leaning on railing) -->
    <!-- Corridor Safety Railing -->
    <line x1="140" y1="175" x2="200" y2="175" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="175" x2="150" y2="195" stroke="#475569" stroke-width="3"/>
    <line x1="190" y1="175" x2="190" y2="195" stroke="#475569" stroke-width="3"/>

    <!-- Student C leaning -->
    <circle cx="170" cy="120" r="9" fill="#FBBF24"/>
    <path d="M161,150 C160,138 167,135 170,135 C173,135 180,138 179,150 Z" fill="#10B981"/>
    <rect x="165" y="148" width="10" height="28" fill="#1E293B"/>
  </g>

  <!-- Modern UI Focus Accent / Frame Elements -->
  <rect x="12" y="12" width="216" height="216" rx="16" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>