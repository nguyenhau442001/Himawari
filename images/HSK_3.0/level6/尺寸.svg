<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Tailor's Tape Measure -->
  <g transform="translate(120, 120)">
    <!-- Main tape body (coiled) -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Tape extending out -->
    <path d="M 45 0 L 90 0" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Measurement markings on tape -->
    <line x1="50" y1="-10" x2="50" y2="10" stroke="#1A1D24" stroke-width="2"/>
    <line x1="60" y1="-10" x2="60" y2="10" stroke="#1A1D24" stroke-width="2"/>
    <line x1="70" y1="-10" x2="70" y2="10" stroke="#1A1D24" stroke-width="2"/>
    <line x1="80" y1="-10" x2="80" y2="10" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Metal tip of tape -->
    <rect x="85" y="-15" width="10" height="30" rx="2" fill="#E0E0E0"/>
    
    <!-- Stylized garment outline in background to provide context -->
    <path d="M -60 -40 L -30 -40 L -20 -60 L 20 -60 L 30 -40 L 60 -40 L 50 40 L -50 40 Z" fill="#2D343E" stroke="#4A5568" stroke-width="2"/>
  </g>
</svg>