<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background & Distant Mountains -->
  <path d="M20 160 Q 60 130, 100 150 T 180 140 T 220 155 L 220 210 L 20 210 Z" fill="#242933"/>
  <path d="M20 175 Q 70 145, 120 165 T 220 155 L 220 210 L 20 210 Z" fill="#2D3440"/>
  <path d="M0 190 Q 50 170, 110 185 T 240 175 L 240 240 L 0 240 Z" fill="#363E4D"/>

  <!-- High Tower / Observation Deck Structure -->
  <!-- Tower base/body -->
  <polygon points="105,210 112,95 128,95 135,210" fill="#3D4654"/>
  <!-- Tower vertical accent lines -->
  <line x1="117" y1="95" x2="117" y2="210" stroke="#2D3440" stroke-width="2"/>
  <line x1="123" y1="95" x2="123" y2="210" stroke="#2D3440" stroke-width="2"/>

  <!-- Tower Observation Platform (Top) -->
  <path d="M 95,95 L 145,95 L 140,85 L 100,85 Z" fill="#4F5D73"/>
  <!-- Roof / Canopy -->
  <path d="M 120,65 L 155,85 L 85,85 Z" fill="#F59E0B"/>
  <rect x="117" y="60" width="6" height="8" fill="#D97706" rx="2"/>

  <!-- Character / Person standing on top gazing into distance -->
  <!-- Body -->
  <path d="M 113,85 C 113,78 127,78 127,85 Z" fill="#E2E8F0"/>
  <!-- Head -->
  <circle cx="120" cy="73" r="5" fill="#E2E8F0"/>
  <!-- Pointing / Gazing Arm gesture -->
  <path d="M 120,78 L 135,74" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

  <!-- Focus / Line of Sight (Dotted Arc representing looking far into mountains) -->
  <path d="M 127,72 Q 170,50 205,90" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="205" cy="90" r="3" fill="#F59E0B"/>
</svg>