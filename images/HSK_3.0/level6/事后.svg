<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for investigation context -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- File / Document Base (The aftermath investigation report) -->
  <g transform="translate(70, 55)">
    <!-- Document background shadow -->
    <rect x="0" y="0" width="100" height="120" rx="6" fill="#14171E" opacity="0.6"/>
    <!-- Document main sheet -->
    <rect x="-4" y="-4" width="100" height="120" rx="6" fill="#222733"/>
    
    <!-- Document header bar -->
    <rect x="12" y="12" width="50" height="8" rx="4" fill="#3E4759"/>
    
    <!-- Document text lines representing data/report -->
    <rect x="12" y="32" width="76" height="4" rx="2" fill="#2E3442"/>
    <rect x="12" y="44" width="60" height="4" rx="2" fill="#2E3442"/>
    <rect x="12" y="56" width="68" height="4" rx="2" fill="#2E3442"/>
  </g>

  <!-- Clock / Timeline Overlay indicating "Afterward / 后" -->
  <g transform="translate(145, 65)">
    <!-- Clock body -->
    <circle cx="20" cy="20" r="26" fill="#1A1D24" stroke="#F59E0B" stroke-width="4"/>
    <!-- Clock hands pointing to a later time -->
    <line x1="20" y1="20" x2="20" y2="8" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="30" y2="20" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <!-- Center pin -->
    <circle cx="20" cy="20" r="3" fill="#F59E0B"/>
  </g>

  <!-- Magnifying Glass (Investigation / Discovery in aftermath) -->
  <g transform="translate(85, 95)">
    <!-- Glass shadow -->
    <circle cx="36" cy="36" r="30" fill="#000000" opacity="0.3"/>
    
    <!-- Handle -->
    <rect x="52" y="52" width="36" height="12" rx="6" fill="#3E4759" transform="rotate(45 52 52)"/>
    <rect x="54" y="54" width="32" height="8" rx="4" fill="#222733" transform="rotate(45 54 54)"/>
    
    <!-- Lens Rim -->
    <circle cx="36" cy="36" r="30" fill="#14171E" stroke="#38BDF8" stroke-width="6"/>
    
    <!-- Lens Glass Reflection -->
    <path d="M 18 24 A 20 20 0 0 1 48 18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    
    <!-- Evidence Checkmark / Finding discovered "afterward" -->
    <polyline points="24,36 33,45 50,26" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small accent decorative points (Analysis data points) -->
  <circle cx="65" cy="155" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="175" cy="140" r="4" fill="#F59E0B" opacity="0.6"/>
  <circle cx="160" cy="175" r="2.5" fill="#38BDF8" opacity="0.4"/>
</svg>