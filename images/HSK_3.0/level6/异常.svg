<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background atmospheric glow/snow flakes representing freezing cold context -->
  <g opacity="0.3">
    <!-- Subtle frosty ground line -->
    <path d="M 40 180 L 200 180" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Normal subtle snowflakes in background -->
    <circle cx="60" cy="70" r="1.5" fill="#A0AEC0"/>
    <circle cx="180" cy="50" r="1.5" fill="#A0AEC0"/>
    <circle cx="90" cy="110" r="1" fill="#A0AEC0"/>
    <circle cx="150" cy="120" r="1.5" fill="#A0AEC0"/>
  </g>

  <!-- Left/Center: Normal/Standard state (muted, baseline reference) -->
  <g transform="translate(65, 110)">
    <!-- Baseline thermometer showing normal cold -->
    <rect x="-10" y="-30" width="8" height="50" rx="4" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    <circle cx="-6" cy="24" r="5" fill="#4299E1"/>
    <rect x="-8" y="-5" width="4" height="25" fill="#4299E1"/>
    <!-- Normal snowflake icon next to it -->
    <path d="M 20 -15 L 20 5 M 10 -5 L 30 -5 M 13 -12 L 27 2 M 13 2 L 27 -12" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right/Dominant: "异常" (Abnormal / Exceptionally intense state) -->
  <g transform="translate(155, 95)">
    <!-- Scale exaggeration: Large, vivid, glowing thermometer breaking past normal bounds -->
    <rect x="-16" y="-60" width="16" height="90" rx="8" fill="#2D3748" stroke="#F6AD55" stroke-width="3"/>
    <!-- Liquid shooting up exceptionally high with high-contrast accent color -->
    <circle cx="-8" cy="20" r="9" fill="#ED8936"/>
    <rect x="-12" y="-45" width="8" height="70" fill="#ED8936" rx="2"/>
    
    <!-- Frost/Energy burst radiating outward to show extreme deviation (异常) -->
    <!-- Crisp, high-contrast visual contrast for "abnormal/unusual" -->
    <g stroke="#F6AD55" stroke-width="3" stroke-linecap="round">
      <!-- Top spike -->
      <line x1="-8" y1="-75" x2="-8" y2="-65"/>
      <!-- Side dynamic crystal spikes -->
      <line x1="12" y1="-40" x2="26" y2="-45"/>
      <line x1="12" y1="-10" x2="30" y2="-10"/>
      <line x1="12" y1="20" x2="24" y2="28"/>
      
      <!-- Left counter spikes -->
      <line x1="-28" y1="-40" x2="-38" y2="-45"/>
      <line x1="-28" y1="-10" x2="-42" y2="-10"/>
    </g>

    <!-- Floating crystal fragments emphasizing intense anomaly/extremeness -->
    <polygon points="32,-25 36,-20 32,-15 28,-20" fill="#F6AD55"/>
    <polygon points="-36,5 -32,10 -36,15 -40,10" fill="#F6AD55"/>
    <polygon points="20,-60 23,-56 20,-52 17,-56" fill="#F6AD55" opacity="0.8"/>
  </g>

  <!-- Ground frost accumulation showing severity -->
  <path d="M 120 180 Q 155 174 190 180" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Clear semantic vector division / baseline anchor -->
  <line x1="110" y1="70" x2="110" y2="150" stroke="#2D3748" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

</svg>