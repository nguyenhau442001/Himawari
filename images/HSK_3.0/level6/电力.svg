<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/grid elements representing industrial power supply context -->
  <g opacity="0.15">
    <line x1="40" y1="200" x2="200" y2="200" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="120" y1="40" x2="120" y2="200" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
  </g>

  <!-- Central Noun Illustration: Power Pylon (Electric Tower) combined with a Power Plug & Lightning Bolt (representing "电力" / Electric Power / Power Supply) -->
  <g transform="translate(0, 5)">
    <!-- Electric Power Transmission Pylon Silhouette -->
    <path d="M100 185 L108 115 L90 95 L80 95 L72 185 Z" fill="#334155"/>
    <path d="M140 185 L132 115 L150 95 L160 95 L168 185 Z" fill="#334155"/>
    
    <!-- Pylon Crossbars -->
    <rect x="75" y="105" width="90" height="8" rx="2" fill="#475569"/>
    <rect x="65" y="130" width="110" height="8" rx="2" fill="#475569"/>
    <rect x="55" y="160" width="130" height="8" rx="2" fill="#475569"/>
    
    <!-- Insulators on Crossbars -->
    <rect x="80" y="113" width="6" height="12" rx="2" fill="#94A3B8"/>
    <rect x="154" y="113" width="6" height="12" rx="2" fill="#94A3B8"/>
    <rect x="70" y="138" width="6" height="12" rx="2" fill="#94A3B8"/>
    <rect x="164" y="138" width="6" height="12" rx="2" fill="#94A3B8"/>

    <!-- Central Glowing Energy / Lightning Bolt Symbol (Focus/Accent) -->
    <polygon points="125,50 100,105 120,105 110,165 150,100 130,100" fill="#F59E0B"/>
    <polygon points="124,56 106,102 122,102 113,155 143,100 128,100" fill="#FBBF24"/>

    <!-- Energy Pulse Rings / Power Waves -->
    <path d="M 85 80 C 70 95 70 125 85 140" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 155 80 C 170 95 170 125 155 140" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Sparkles / Power Dots -->
    <circle cx="75" cy="70" r="3" fill="#60A5FA"/>
    <circle cx="165" cy="75" r="2" fill="#FBBF24"/>
    <circle cx="95" cy="190" r="2.5" fill="#60A5FA"/>
    <circle cx="145" cy="185" r="2" fill="#FBBF24"/>
  </g>
</svg>