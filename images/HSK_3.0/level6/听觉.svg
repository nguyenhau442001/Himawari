<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Sound wave accents (High contrast orange/gold) -->
  <path d="M 68 85 C 55 100 55 140 68 155" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 52 70 C 35 95 35 145 52 170" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.2"/>

  <!-- Audio source sound waves on the right -->
  <path d="M 172 95 C 182 107 182 133 172 145" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 186 80 C 200 98 200 142 186 160" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Sleek Modern Over-Ear Headphone (Physical Noun Object) -->
  <!-- Headband outer arc -->
  <path d="M 72 110 C 72 55 168 55 168 110" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <!-- Headband inner padding -->
  <path d="M 80 112 C 80 65 160 65 160 112" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Ear Cup Assembly -->
  <!-- Connecting arm -->
  <path d="M 72 110 L 72 125" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <!-- Ear cup body (tilted slightly for ergonomic look) -->
  <g transform="translate(72, 135) rotate(-15)">
    <rect x="-16" y="-30" width="32" height="60" rx="16" fill="#38BDF8"/>
    <rect x="-10" y="-22" width="20" height="44" rx="10" fill="#0F172A"/>
    <path d="M -6 -12 L -6 12" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Right Ear Cup Assembly -->
  <!-- Connecting arm -->
  <path d="M 168 110 L 168 125" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <!-- Ear cup body -->
  <g transform="translate(168, 135) rotate(15)">
    <rect x="-16" y="-30" width="32" height="60" rx="16" fill="#38BDF8"/>
    <rect x="-10" y="-22" width="20" height="44" rx="10" fill="#0F172A"/>
    <path d="M 6 -12 L 6 12" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Sound propagation convergence dots -->
  <circle cx="102" cy="130" r="2" fill="#F59E0B"/>
  <circle cx="114" cy="138" r="3" fill="#F59E0B"/>
  <circle cx="126" cy="130" r="2" fill="#F59E0B"/>
</svg>