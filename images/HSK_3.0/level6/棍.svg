<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle mountain contour for contextual reference -->
  <path d="M20 200 L90 140 L160 175 L220 120 L220 200 Z" fill="#222732" opacity="0.6"/>

  <!-- Ground path / Mountain path -->
  <path d="M 20 205 Q 100 195 220 215" fill="none" stroke="#2C3342" stroke-width="6" stroke-linecap="round"/>

  <!-- Wooden Staff / Stick (棍) as the central physical object -->
  <g transform="rotate(-25 120 120)">
    <!-- Main shaft of the wooden stick -->
    <rect x="114" y="55" width="12" height="135" rx="6" fill="#A06634"/>
    <!-- Wood grain / texture highlights -->
    <path d="M117 65 C118 90 116 120 118 150" fill="none" stroke="#C28246" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M121 80 C120 110 122 140 121 170" fill="none" stroke="#804D24" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Natural knots / rings -->
    <ellipse cx="120" cy="85" rx="6" ry="2" fill="#804D24" opacity="0.8"/>
    <ellipse cx="120" cy="130" rx="5" ry="1.5" fill="#804D24" opacity="0.8"/>
    <ellipse cx="120" cy="165" rx="5.5" ry="2" fill="#804D24" opacity="0.8"/>
    <!-- Top rounded cap -->
    <ellipse cx="120" cy="55" rx="6" ry="3" fill="#C28246"/>
    <!-- Bottom grounded tip -->
    <ellipse cx="120" cy="190" rx="6" ry="3" fill="#6B3F1E"/>
  </g>

  <!-- High-contrast focus accent glow/sparkles around the object -->
  <circle cx="105" cy="85" r="3" fill="#FFB74D" opacity="0.9"/>
  <circle cx="145" cy="140" r="2" fill="#FFB74D" opacity="0.7"/>
  <path d="M 105 75 L 107 81 L 113 83 L 107 85 L 105 91 L 103 85 L 97 83 L 103 81 Z" fill="#FFB74D" opacity="0.8" transform="scale(0.5) translate(120, 90)"/>
</svg>