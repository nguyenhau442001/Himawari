<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Podium -->
    <path d="M-60 60 L60 60 L45 95 L-45 95 Z" fill="#2A2F3D" />
    <path d="M-45 95 L45 95 L40 100 L-40 100 Z" fill="#3A4254" />
    <!-- Number 1 on podium -->
    <text x="0" y="85" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#F5A623" text-anchor="middle">1</text>
    
    <!-- Winner Character (Torso and Head visible) -->
    <!-- Arms raised in triumph -->
    <path d="M-25 25 L-45 -10 L-35 -20 L-15 10 Z" fill="#4A90E2" />
    <path d="M25 25 L45 -10 L35 -20 L15 10 Z" fill="#4A90E2" />
    
    <!-- Body / Suit -->
    <path d="M-25 15 C-25 5 -15 0 0 0 C15 0 25 5 25 15 L30 60 L-30 60 Z" fill="#357ABD" />
    <!-- Suit collar / Tie -->
    <polygon points="0,10 -8,30 8,30" fill="#FFFFFF" />
    <polygon points="0,20 -3,45 0,55 3,45" fill="#E74C3C" />

    <!-- Head -->
    <circle cx="0" cy="-15" r="15" fill="#F5D0B1" />
    <!-- Hair -->
    <path d="M-15 -18 C-15 -28 15 -28 15 -18 C15 -15 12 -22 0 -23 C-12 -22 -15 -15 -15 -18 Z" fill="#2C3E50" />
    
    <!-- Happy / Proud facial expression -->
    <path d="M-5 -13 Q0 -10 5 -13" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M-4 -7 Q0 -3 4 -7" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Gold Medal around neck -->
    <path d="M-10 0 L0 30 L10 0" fill="none" stroke="#F5A623" stroke-width="3" />
    <circle cx="0" cy="32" r="8" fill="#F5A623" />
    <circle cx="0" cy="32" r="6" fill="#F7CA44" />

    <!-- Glowing "Present Moment" / Stopwatch & Time Starburst Overlay -->
    <g transform="translate(0, -65)">
      <!-- Radiating beams representing "This exact moment" -->
      <line x1="0" y1="-22" x2="0" y2="-28" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
      <line x1="-15" y1="-15" x2="-20" y2="-20" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
      <line x1="15" y1="-15" x2="20" y2="-20" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
      <line x1="-22" y1="0" x2="-28" y2="0" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
      <line x1="22" y1="0" x2="28" y2="0" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />

      <!-- Stopwatch / Clock icon -->
      <circle cx="0" cy="0" r="18" fill="#1A1D24" stroke="#F5A623" stroke-width="4" />
      <!-- Stopwatch top button -->
      <rect x="-3" y="-22" width="6" height="5" fill="#F5A623" rx="1" />
      <line x1="0" y1="-17" x2="0" y2="-22" stroke="#F5A623" stroke-width="2" />
      <!-- Clock Hands pointing to the precise moment -->
      <line x1="0" y1="0" x2="0" y2="-8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="0" x2="8" y2="3" stroke="#F5A623" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    
    <!-- Floating Sparkles / Celebration particles -->
    <path d="M-65 -40 L-62 -46 L-56 -49 L-62 -52 L-65 -58 L-68 -52 L-74 -49 L-68 -46 Z" fill="#F7CA44" opacity="0.9" />
    <path d="M65 -30 L67 -34 L71 -36 L67 -38 L65 -42 L63 -38 L59 -36 L63 -34 Z" fill="#F7CA44" opacity="0.9" />
    <circle cx="-55" cy="-10" r="2.5" fill="#F5A623" />
    <circle cx="55" cy="-5" r="3" fill="#F5A623" />
  </g>
</svg>