<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Stream Water Path / Background Elements -->
  <path d="M 20,150 Q 80,130 140,155 T 220,140" fill="none" stroke="#26354A" stroke-width="32" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Gentle Water Ripples / Flow Lines -->
  <path d="M 40,145 Q 60,140 80,148" fill="none" stroke="#3A506B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 120,153 Q 140,148 160,156" fill="none" stroke="#3A506B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 80,180 Q 110,172 140,183" fill="none" stroke="#26354A" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  <path d="M 170,110 Q 190,105 210,113" fill="none" stroke="#3A506B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Motion / Drift Trails -->
  <path d="M 70,125 Q 95,115 125,122" fill="none" stroke="#5271FF" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 105,95 Q 120,88 140,93" fill="none" stroke="#5271FF" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.5"/>

  <!-- Colorful Floating Leaves (Representing "漂" - drifting/floating objects) -->
  
  <!-- Leaf 1 (Small teal leaf in background) -->
  <g transform="translate(60, 100) rotate(-15)">
    <path d="M 0,10 C -6,5 -8,-5 0,-12 C 8,-5 6,5 0,10 Z" fill="#00D2FF" opacity="0.8"/>
    <path d="M 0,-12 L 0,10" fill="none" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Leaf 2 (Amber/Orange leaf - mid distance) -->
  <g transform="translate(95, 115) rotate(25)">
    <path d="M 0,14 C -8,7 -10,-7 0,-16 C 10,-7 8,7 0,14 Z" fill="#FF9F43"/>
    <path d="M 0,-16 L 0,14" fill="none" stroke="#1A1D24" stroke-width="1.5" opacity="0.3"/>
    <path d="M 0,-6 L -4,-2" fill="none" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
    <path d="M 0,2 L 5,6" fill="none" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Leaf 3 (Main Focal Point: Vibrant Coral/Red Leaf, beautifully floating on water) -->
  <g transform="translate(145, 135) rotate(-10)">
    <!-- Water reflection / ripple underneath -->
    <ellipse cx="0" cy="8" rx="16" ry="6" fill="#00D2FF" opacity="0.2"/>
    <!-- Leaf Blade -->
    <path d="M 0,18 C -12,9 -14,-9 0,-22 C 14,-9 12,9 0,18 Z" fill="#FF5252"/>
    <!-- Leaf Stem -->
    <path d="M 0,22 L 0,16" fill="none" stroke="#FF5252" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaf Vein (Central) -->
    <path d="M 0,-20 L 0,15" fill="none" stroke="#FFA8A8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Leaf Veins (Lateral) -->
    <path d="M 0,-12 L -6,-6" fill="none" stroke="#FFA8A8" stroke-width="1" stroke-linecap="round"/>
    <path d="M 0,-4 L 7,2" fill="none" stroke="#FFA8A8" stroke-width="1" stroke-linecap="round"/>
    <path d="M 0,4 L -5,9" fill="none" stroke="#FFA8A8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Leaf 4 (Gold leaf floating further away) -->
  <g transform="translate(180, 95) rotate(40)">
    <path d="M 0,10 C -5,5 -7,-4 0,-10 C 7,-4 5,5 0,10 Z" fill="#FFD32A" opacity="0.9"/>
    <path d="M 0,-10 L 0,10" fill="none" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
  </g>

</svg>