<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow behind author -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window City Glow -->
    <linearGradient id="cityGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- ==================== BACKGROUND ENVIRONMENT ==================== -->
  <!-- Modern Bookshelf with colorful book spines -->
  <g opacity="0.85">
    <!-- Shelf backdrop -->
    <rect x="25" y="40" width="70" height="110" rx="4" fill="#334155" />
    <rect x="30" y="45" width="60" height="30" fill="#1e293b" />
    <rect x="30" y="85" width="60" height="30" fill="#1e293b" />
    <rect x="30" y="125" width="60" height="20" fill="#1e293b" />
    
    <!-- Bookshelf 1 -->
    <path d="M35 75 L38 50 L44 50 L42 75 Z" fill="#38bdf8" />
    <path d="M46 75 L48 53 L54 53 L53 75 Z" fill="#ec4899" />
    <path d="M56 75 L60 48 L67 48 L64 75 Z" fill="#fbbf24" />
    <path d="M68 75 L70 55 L76 55 L75 75 Z" fill="#10b981" />
    <path d="M78 75 L82 52 L88 52 L85 75 Z" fill="#818cf8" />

    <!-- Bookshelf 2 -->
    <rect x="34" y="95" width="8" height="18" rx="2" fill="#f43f5e" />
    <rect x="44" y="92" width="6" height="21" rx="2" fill="#38bdf8" />
    <rect x="52" y="90" width="10" height="23" rx="2" fill="#fb923c" />
    <rect x="64" y="94" width="7" height="19" rx="2" fill="#34d399" />
    <rect x="73" y="96" width="12" height="17" rx="2" fill="#a78bfa" />
  </g>

  <!-- Large Modern Window showing Contemporary Cityscape (NIGHT) -->
  <g>
    <!-- Window Frame -->
    <rect x="145" y="30" width="70" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="150" y="35" width="60" height="90" fill="#1e293b" />
    <rect x="150" y="35" width="60" height="90" fill="url(#cityGlow)" />
    
    <!-- City Skyscrapers outside -->
    <path d="M158 125 L158 75 L168 75 L168 125 Z" fill="#334155" opacity="0.7"/>
    <rect x="161" y="80" width="3" height="4" fill="#fbbf24" opacity="0.8"/>
    <rect x="161" y="90" width="3" height="4" fill="#fbbf24" opacity="0.4"/>
    
    <path d="M172 125 L172 55 L188 55 L188 125 Z" fill="#1e293b" opacity="0.9"/>
    <rect x="176" y="65" width="3" height="5" fill="#38bdf8" opacity="0.7"/>
    <rect x="181" y="75" width="3" height="5" fill="#fbbf24" opacity="0.9"/>
    <rect x="176" y="90" width="3" height="5" fill="#38bdf8" opacity="0.6"/>

    <path d="M190 125 L190 85 L204 85 L204 125 Z" fill="#334155" opacity="0.7"/>
    <rect x="194" y="95" width="3" height="4" fill="#fbbf24" opacity="0.5"/>

    <!-- Window crossbars -->
    <line x1="180" y1="35" x2="180" y2="125" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="80" x2="210" y2="80" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Houseplant for real-world coziness -->
  <path d="M210 160 Q215 150 225 155 Q235 160 230 175 Q220 185 210 160 Z" fill="#10b981" />
  <path d="M200 170 Q195 155 205 150 Q215 145 220 165 Q210 180 200 170 Z" fill="#34d399" />
  <path d="M215 185 L225 185 L220 205 L210 205 Z" fill="#64748b" />

  <!-- ==================== FOREGROUND WORKSPACE ==================== -->
  <!-- Wooden Desk Surface -->
  <path d="M10 190 L230 190 L240 215 L0 215 Z" fill="#b45309" filter="url(#shadow)" />
  <path d="M10 190 L230 190 L230 195 L10 195 Z" fill="#d97706" />

  <!-- Modern Desk Lamp (Warm Glow) -->
  <path d="M40 190 L50 140 L55 140 L45 190 Z" fill="#cbd5e1" />
  <ellipse cx="47.5" cy="140" rx="8" ry="4" fill="#94a3b8" />
  <!-- Lamp Shade & Beam -->
  <path d="M35 130 L60 130 L53 115 L42 115 Z" fill="#f59e0b" />
  <polygon points="20,215 47,130 75,215" fill="#f59e0b" opacity="0.12" />

  <!-- Modern Laptop (Open, glowing screen) -->
  <path d="M70 185 L110 185 L118 165 L62 165 Z" fill="#475569" />
  <path d="M73 168 L107 168 L105 182 L75 182 Z" fill="#0f172a" />
  <!-- Laptop UI code/lines -->
  <line x1="78" y1="173" x2="90" y2="173" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="178" x2="98" y2="178" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <!-- Laptop Base -->
  <path d="M55 188 L125 188 L130 192 L50 192 Z" fill="#94a3b8" />
  <rect x="85" y="189" width="20" height="2" rx="1" fill="#cbd5e1" />

  <!-- Stack of Published Books / Manuscripts (Representing 'Famous Writer') -->
  <g transform="translate(170, 160)">
    <rect x="0" y="20" width="35" height="8" rx="2" fill="#3b82f6" />
    <rect x="-2" y="12" width="38" height="8" rx="2" fill="#ef4444" />
    <rect x="2" y="4" width="32" height="8" rx="2" fill="#10b981" />
    <rect x="0" y="-4" width="36" height="8" rx="2" fill="#f59e0b" />
    <!-- Award / Star badge on top book -->
    <circle cx="18" cy="0" r="2.5" fill="#fef08a" />
  </g>

  <!-- Coffee Mug -->
  <rect x="135" y="172" width="14" height="16" rx="3" fill="#f8fafc" />
  <path d="M149 176 C154 176 154 184 149 184" fill="none" stroke="#f8fafc" stroke-width="2" />
  <path d="M138 175 L146 175" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Steam from coffee -->
  <path d="M139 166 Q142 160 139 154" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M145 168 Q148 162 145 156" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>


  <!-- ==================== MAIN CHARACTER (CONTEMPORARY WRITER) ==================== -->
  <g id="writer">
    <!-- Character Torso & Shirt (Modern Casual Smart: Collared shirt & sweater) -->
    <path d="M95 130 L145 130 L155 190 L85 190 Z" fill="#3b82f6" filter="url(#shadow)" />
    <!-- Sweater V-neck or Layer -->
    <path d="M105 130 L135 130 L140 175 L100 175 Z" fill="#1e3a8a" />
    <!-- Shirt Collar & Tie/Accent -->
    <path d="M112 130 L120 145 L128 130 Z" fill="#f8fafc" />
    <polygon points="118,135 122,135 120,155" fill="#f43f5e" />

    <!-- Left Arm (Typing on laptop) -->
    <path d="M95 135 L75 160 L85 170 L102 145 Z" fill="#3b82f6" />
    <!-- Left Hand -->
    <circle cx="80" cy="172" r="6" fill="#fcd34d" />

    <!-- Right Arm (Thoughtfully resting near chin / holding stylus/pen) -->
    <path d="M145 135 Q160 145 150 165 L135 155 Z" fill="#1e3a8a" />
    <path d="M150 165 L142 178 L134 172 L140 155 Z" fill="#3b82f6" />
    <!-- Right Hand near face -->
    <circle cx="140" cy="180" r="6" fill="#fcd34d" />
    <!-- Pen in hand -->
    <line x1="135" y1="188" x2="148" y2="170" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="110" y="118" width="20" height="18" fill="#fcd34d" />
    <path d="M110 128 Q120 135 130 128 Z" fill="#f59e0b" opacity="0.3" />

    <!-- Head & Face -->
    <ellipse cx="120" cy="95" rx="22" ry="26" fill="#fcd34d" />

    <!-- Stylish Contemporary Haircut (Undercut style, dark brown/black) -->
    <path d="M98 90 C96 70 110 65 125 65 C142 65 146 80 146 95 C146 95 142 80 130 75 C118 70 102 75 98 90 Z" fill="#0f172a" />
    <!-- Sharp modern fringe / side sweep -->
    <path d="M100 90 Q110 75 125 72 Q110 80 105 95 Z" fill="#0f172a" />

    <!-- Glasses (Modern smart round/intellectual frames) -->
    <circle cx="111" cy="94" r="8" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="131" cy="94" r="8" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <line x1="119" y1="94" x2="123" y2="94" stroke="#0f172a" stroke-width="2.5" />
    <!-- Glasses reflection accents -->
    <circle cx="109" cy="92" r="2" fill="#38bdf8" opacity="0.7" />
    <circle cx="129" cy="92" r="2" fill="#38bdf8" opacity="0.7" />

    <!-- Facial Expression (Calm, inspired, confident writer smile) -->
    <path d="M116 108 Q120 112 126 108" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
    <!-- Gentle Eyebrows showing focus and creativity -->
    <path d="M104 83 Q111 80 117 84" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M125 84 Q131 80 138 83" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    
    <!-- Rosy cheeks for friendly cartoon warmth -->
    <circle cx="103" cy="102" r="4" fill="#f43f5e" opacity="0.3" />
    <circle cx="137" cy="102" r="4" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Floating Creative Sparkles / Inspiration Elements -->
  <g fill="#fbbf24" opacity="0.8">
    <path d="M 65 95 Q 68 90 73 90 Q 68 90 68 85 Q 68 90 63 90 Q 68 90 65 95 Z" transform="scale(0.8) translate(20, 20)" />
    <path d="M 185 105 Q 187 100 192 100 Q 187 100 187 95 Q 187 100 182 100 Q 187 100 185 105 Z" transform="scale(0.6) translate(110, 30)" />
    <circle cx="170" cy="115" r="2" fill="#38bdf8" />
    <circle cx="75" cy="110" r="1.5" fill="#ec4899" />
  </g>
</svg>