<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="cityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Piggy Bank Pink Gradient -->
    <linearGradient id="piggyPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Interior -->
  <g id="room-interior">
    <!-- Wallpaper / Wall -->
    <rect x="20" y="20" width="200" height="150" rx="4" fill="#1e293b"/>
    <!-- Subtle Wall Panels -->
    <line x1="20" y1="90" x2="220" y2="90" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,8"/>

    <!-- Window to show "every month / recurring time" (night sky/city) -->
    <rect x="145" y="35" width="55" height="65" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="40" width="45" height="55" rx="4" fill="url(#cityGrad)"/>
    <!-- City lights through window -->
    <rect x="155" y="75" width="8" height="15" fill="#fde047" opacity="0.6"/>
    <rect x="168" y="65" width="8" height="25" fill="#38bdf8" opacity="0.5"/>
    <rect x="181" y="80" width="8" height="10" fill="#fde047" opacity="0.7"/>
    <window-frame>
      <line x1="172" y1="40" x2="172" y2="95" stroke="#475569" stroke-width="2"/>
      <line x1="150" y1="67" x2="195" y2="67" stroke="#475569" stroke-width="2"/>
    </window-frame>

    <!-- Calendar on wall (representing monthly habit) -->
    <g transform="translate(35, 38)">
      <rect x="0" y="0" width="32" height="38" rx="4" fill="#f8fafc"/>
      <rect x="0" y="0" width="32" height="10" rx="4" fill="#ef4444"/>
      <circle cx="8" cy="5" r="2" fill="#cbd5e1"/>
      <circle cx="24" cy="5" r="2" fill="#cbd5e1"/>
      <!-- Grid dots for days -->
      <circle cx="8" cy="18" r="1.5" fill="#64748b"/>
      <circle cx="16" cy="18" r="1.5" fill="#64748b"/>
      <circle cx="24" cy="18" r="1.5" fill="#64748b"/>
      <circle cx="8" cy="25" r="1.5" fill="#64748b"/>
      <circle cx="16" cy="25" r="1.5" fill="#ef4444"/> <!-- Highlighted save day -->
      <circle cx="24" cy="25" r="1.5" fill="#64748b"/>
      <circle cx="8" cy="32" r="1.5" fill="#64748b"/>
      <circle cx="16" cy="32" r="1.5" fill="#64748b"/>
      <circle cx="24" cy="32" r="1.5" fill="#64748b"/>
    </g>

    <!-- Bookshelf / Storage prop -->
    <rect x="25" y="100" width="35" height="4" fill="#475569" rx="1"/>
    <path d="M28 100 L31 82 L38 82 L36 100 Z" fill="#38bdf8"/>
    <path d="M38 100 L40 85 L47 85 L45 100 Z" fill="#f43f5e"/>

    <!-- Ambient Lamp Glow -->
    <circle cx="115" cy="50" r="70" fill="url(#lampGlow)"/>
  </g>

  <!-- Wooden Desk Surface -->
  <rect x="10" y="165" width="220" height="12" rx="4" fill="url(#woodDesk)"/>
  <rect x="20" y="177" width="200" height="45" fill="#5c2c16"/>
  <!-- Desk front shadow -->
  <rect x="20" y="177" width="200" height="6" fill="#000000" opacity="0.2"/>

  <!-- Foreground Elements: Character & Savings Props -->
  <g id="character-and-savings">
    <!-- PIGGY BANK (Central focal point of saving) -->
    <g transform="translate(130, 115)">
      <!-- Pig Body -->
      <ellipse cx="35" cy="30" rx="24" ry="20" fill="url(#piggyPink)"/>
      <!-- Pig Head/Snout area -->
      <ellipse cx="50" cy="33" rx="12" ry="11" fill="#ec4899"/>
      <ellipse cx="56" cy="34" rx="4" ry="3" fill="#be185d"/>
      <circle cx="55" cy="33" r="0.8" fill="#fda4af"/>
      <circle cx="57" cy="33" r="0.8" fill="#fda4af"/>
      <!-- Pig Ear -->
      <path d="M25 14 C23 8, 28 6, 31 12 Z" fill="#db2777"/>
      <!-- Pig Eye -->
      <circle cx="48" cy="27" r="1.5" fill="#ffffff"/>
      <circle cx="48.5" cy="27" r="0.8" fill="#1e293b"/>
      <!-- Curly Tail -->
      <path d="M11 25 C7 24, 7 29, 10 28" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
      <!-- Pig Legs -->
      <rect x="20" y="46" width="5" height="8" rx="2.5" fill="#be185d"/>
      <rect x="42" y="46" width="5" height="8" rx="2.5" fill="#be185d"/>
      <!-- Coin Slot on back -->
      <rect x="32" y="10" width="10" height="2.5" rx="1" fill="#831843"/>
    </g>

    <!-- Pile of Coins on Desk -->
    <g transform="translate(95, 155)">
      <ellipse cx="15" cy="10" rx="10" ry="4" fill="url(#goldCoin)"/>
      <ellipse cx="15" cy="7" rx="10" ry="4" fill="url(#goldCoin)"/>
      <ellipse cx="15" cy="4" rx="10" ry="4" fill="url(#goldCoin)"/>
      <!-- Stack 2 -->
      <ellipse cx="32" cy="11" rx="8" ry="3.5" fill="url(#goldCoin)"/>
      <ellipse cx="32" cy="8" rx="8" ry="3.5" fill="url(#goldCoin)"/>
      <!-- Single scattered coin -->
      <ellipse cx="5" cy="13" rx="7" ry="3" fill="url(#goldCoin)" transform="rotate(-15 5 13)"/>
    </g>

    <!-- CHARACTER (Young man happily depositing money / habituated saver) -->
    <g id="character" transform="translate(15, 80)">
      <!-- Body & Torso (Blue casual shirt / cozy cardigan) -->
      <path d="M35 70 C35 55, 45 45, 60 45 C75 45, 85 55, 85 70 L95 95 L25 95 Z" fill="#38bdf8"/>
      <!-- Collar -->
      <path d="M50 45 L60 58 L70 45 Z" fill="#f8fafc"/>
      
      <!-- Head & Face -->
      <circle cx="60" cy="30" r="16" fill="#fbcfe8" /> <!-- Face base -->
      <path d="M44 26 C44 17, 52 13, 60 13 C68 13, 76 17, 76 26 C76 30, 74 32, 74 32 L46 32 C46 32, 44 30, 44 26 Z" fill="#451a03"/> <!-- Hair -->
      <path d="M43 24 C43 20, 47 16, 52 18 Z" fill="#451a03"/> <!-- Hair tuft -->
      
      <!-- Friendly Expression -->
      <!-- Happy smiling eyes -->
      <path d="M51 28 Q54 25 57 28" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M63 28 Q66 25 69 28" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Warm Smile -->
      <path d="M55 35 Q60 40 65 35" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
      <!-- Rosy Cheeks -->
      <circle cx="50" cy="34" r="3" fill="#f43f5e" opacity="0.3"/>
      <circle cx="70" cy="34" r="3" fill="#f43f5e" opacity="0.3"/>

      <!-- Right Arm holding and inserting Coin -->
      <g id="active-arm">
        <!-- Upper arm and forearm reaching towards piggy bank -->
        <path d="M78 52 C90 50, 105 55, 115 65" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
        <!-- Hand -->
        <circle cx="117" cy="67" r="5" fill="#fbcfe8"/>
      </g>

      <!-- The Coin being inserted into the slot -->
      <g transform="translate(118, 55) rotate(-25)">
        <ellipse cx="0" cy="0" rx="8" ry="3.5" fill="url(#goldCoin)" stroke="#fef08a" stroke-width="1"/>
      </g>
    </g>

    <!-- Savings Growth Sparkles / Success indicators -->
    <g transform="translate(170, 100)">
      <path d="M0 0 L3 6 L9 9 L3 12 L0 18 L-3 12 L-9 9 L-3 6 Z" fill="#fde047" transform="scale(0.6)"/>
    </g>
    <g transform="translate(120, 90)">
      <path d="M0 0 L2 4 L6 6 L2 8 L0 12 L-2 8 L-6 6 L-2 4 Z" fill="#38bdf8" transform="scale(0.5)"/>
    </g>
  </g>

  <!-- Ambient Front Lighting / Vignette Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>