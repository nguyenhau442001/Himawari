<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Base Platform / Track -->
    <path d="M-90 40 L90 40 L100 65 L-100 65 Z" fill="#2A2F3D"/>
    <ellipse cx="0" cy="40" rx="90" ry="12" fill="#363C4E"/>
    
    <!-- Left Object: Human Hand / Worker Representative (Stepping aside) -->
    <g transform="translate(-48, -15)">
      <!-- Worker / Human silhouette icon -->
      <circle cx="0" cy="-25" r="14" fill="#64748B"/>
      <path d="M-18 5 C-18 -8 18 -8 18 5 L22 38 L-22 38 Z" fill="#64748B"/>
      <!-- Outward arrow showing replacement/stepping back -->
      <path d="M-25 15 L-40 15 M-35 10 L-40 15 L-35 20" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Right Object: Advanced Robotic Arm / Automated Machine (Stepping into place) -->
    <g transform="translate(45, -20)">
      <!-- Machine Base mount -->
      <rect x="-18" y="35" width="36" height="15" rx="3" fill="#3B82F6"/>
      
      <!-- Articulated robotic arm segments -->
      <path d="M-5 35 L-15 0 L15 -25" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Joint circles -->
      <circle cx="-15" cy="0" r="5" fill="#60A5FA"/>
      <circle cx="15" cy="-25" r="5" fill="#60A5FA"/>

      <!-- Robotic claw / gripper -->
      <path d="M12 -25 L25 -38 M18 -25 L32 -28" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <circle cx="15" cy="-25" r="3" fill="#F59E0B"/>

      <!-- Inward/Taking over arrow -->
      <path d="M-28 -5 L-12 -5 M-17 -10 L-12 -5 L-17 0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    
    <!-- Central Action Indicator (Seamless transition / Swap concept) -->
    <path d="M-15 -35 C 0 -45, 0 -45, 15 -35" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
  </g>
</svg>