<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Ambient lighting & interior backdrop -->
  <path d="M0 0h240v190H0z" fill="#1e293b"/>
  <rect x="20" y="25" width="200" height="120" rx="6" fill="#334155" opacity="0.4"/>

  <!-- Large structural presentation board / screen -->
  <rect x="50" y="35" width="140" height="85" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  
  <!-- Abstract visual graph representing 'new development direction' (确立方向) -->
  <path d="M70 95 L95 75 L120 85 L155 55" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Target / Arrow indicator at the peak of the chart -->
  <circle cx="155" cy="55" r="5" fill="#fb923c"/>
  <circle cx="155" cy="55" r="9" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>

  <!-- Conference table -->
  <path d="M30 155 L210 155 L190 195 L50 195 Z" fill="#475569" opacity="0.8"/>
  <path d="M40 160 L200 160 L185 190 L55 190 Z" fill="#64748b"/>

  <!-- Character 1: Presenter / Leader pointing at the new direction -->
  <g transform="translate(115, 80)">
    <!-- Body & Suit -->
    <path d="M15 50 L35 50 L40 90 L10 90 Z" fill="#0ea5e9"/>
    <!-- Head -->
    <circle cx="25" cy="25" r="12" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M13 22 C13 13 22 13 37 18 C37 25 35 25 35 25 C35 25 25 15 15 22 Z" fill="#334155"/>
    <!-- Arm pointing -->
    <path d="M30 45 L52 35" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 45 L52 35" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 2"/>
  </g>

  <!-- Character 2: Colleague seated, nodding/approving -->
  <g transform="translate(45, 115)">
    <!-- Torso -->
    <path d="M10 50 L35 50 L40 85 L5 85 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="22" cy="22" r="10" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M12 18 C15 10 30 10 32 18 Z" fill="#1e293b"/>
    <!-- Arm resting on table -->
    <path d="M25 50 L10 65" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Character 3: Colleague taking notes -->
  <g transform="translate(160, 115)">
    <!-- Torso -->
    <path d="M5 50 L30 50 L35 85 L0 85 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="18" cy="22" r="10" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M10 16 C12 10 26 10 28 16 C25 22 12 22 10 16 Z" fill="#334155"/>
    <!-- Arm & Notepad -->
    <path d="M15 55 L25 65" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <rect x="18" y="60" width="12" height="10" fill="#f8fafc" rx="1"/>
  </g>

  <!-- Table props: Coffee cups and laptop -->
  <rect x="80" y="150" width="16" height="10" rx="2" fill="#cbd5e1"/>
  <path d="M135 152 h10 a3 3 0 0 1 3 3 v1 a3 3 0 0 1-3 3 h-10 a3 3 0 0 1-3-3 v-1 a3 3 0 0 1 3-3 z" fill="#f1f5f9"/>

  <!-- Foreground Floor / Base Gradient -->
  <rect x="0" y="195" width="240" height="45" fill="#090d16"/>
  
  <!-- Warm accent glow representing successful breakthrough/establishment -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.15"/>
</svg>