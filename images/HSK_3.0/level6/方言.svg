<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Gradient -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Map/Scroll Gradient -->
    <linearGradient id="map-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- UI Speech Bubble Gradient -->
    <linearGradient id="bubble-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bubble-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bubble-grad-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- Background Environment: Cozy Study Room / Cultural Exchange -->
  <!-- Bookshelf -->
  <g fill="#334155" opacity="0.6">
    <rect x="20" y="40" width="45" height="85" rx="4" />
    <rect x="25" y="60" width="35" height="6" rx="2" fill="#475569" />
    <rect x="25" y="85" width="35" height="6" rx="2" fill="#475569" />
    <rect x="25" y="110" width="35" height="6" rx="2" fill="#475569" />
    <!-- Books on shelf -->
    <path d="M28 55h6v-5h-6z" fill="#f59e0b" />
    <path d="M35 57h8v-7h-8z" fill="#38bdf8" />
    <path d="M45 54h5v-4h-5z" fill="#ec4899" />
    <path d="M28 80h7v-5h-7z" fill="#10b981" />
    <path d="M37 82h5v-7h-5z" fill="#fb923c" />
  </g>

  <!-- Wall Map Depicting Different Regions -->
  <g transform="translate(130, 25)">
    <rect x="0" y="0" width="85" height="65" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Stylized regional map contours -->
    <path d="M15 15 Q 35 10, 50 25 T 70 45" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M25 45 Q 45 55, 60 30" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <!-- Regional Pins / Nodes representing different localities -->
    <circle cx="25" cy="20" r="4" fill="#38bdf8" />
    <circle cx="55" cy="20" r="4" fill="#10b981" />
    <circle cx="40" cy="50" r="4" fill="#f43f5e" />
    <!-- Connecting dashed lines -->
    <line x1="25" y1="20" x2="40" y2="50" stroke="#475569" stroke-dasharray="2 2" stroke-width="1.5" />
    <line x1="55" y1="20" x2="40" y2="50" stroke="#475569" stroke-dasharray="2 2" stroke-width="1.5" />
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M100 0h40v12h-40z" fill="#64748b" />
  <line x1="120" y1="12" x2="120" y2="40" stroke="#475569" stroke-width="2" />
  <path d="M105 40h30l10 18h-50z" fill="#fbbf24" opacity="0.9" />

  <!-- Wooden Table / Desk Surface -->
  <path d="M10 175h220v35c0 4-3 8-8 8H18c-5 0-8-4-8-8z" fill="#b45309" />
  <path d="M10 175h220v6H10z" fill="#d97706" />

  <!-- Centerpiece: Open Map / Cultural Booklet on Table -->
  <path d="M85 155 l35 -15 l35 15 l-35 15 z" fill="url(#map-grad)" stroke="#d1d5db" stroke-width="1" />
  <path d="M120 140v30" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Mini icons on map -->
  <circle cx="100" cy="150" r="2.5" fill="#38bdf8" />
  <circle cx="135" cy="160" r="2.5" fill="#10b981" />

  <!-- Character 1: Left (Speaking Local Dialect A) -->
  <g transform="translate(45, 95)">
    <!-- Body / Torso -->
    <path d="M15 80 c-5 0,-15 10,-20 30 h55 c-5 -20,-15 -30,-20 -30 z" fill="#38bdf8" />
    <!-- Collar / Shirt Detail -->
    <path d="M5 85 l10 10 l10 -10" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />
    <!-- Head & Hair -->
    <circle cx="15" cy="45" r="18" fill="#fcd34d" /> <!-- Face base -->
    <!-- Hair style -->
    <path d="M-2 42 c2 -15, 12 -20, 25 -18 c10 2, 16 10, 16 18 c0 0,-10 -6,-20 -5 c-10 1,-18 5,-21 5 z" fill="#1e293b" />
    <!-- Facial Features: Expressive, friendly -->
    <circle cx="10" cy="43" r="2" fill="#334155" />
    <circle cx="22" cy="43" r="2" fill="#334155" />
    <!-- Cheeks -->
    <circle cx="8" cy="48" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="24" cy="48" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Open Happy Mouth -->
    <path d="M13 50 q3 4, 6 0 z" fill="#b91c1c" />
  </g>

  <!-- Character 2: Right (Speaking Local Dialect B) -->
  <g transform="translate(140, 95)">
    <!-- Body / Torso -->
    <path d="M15 80 c-5 0,-15 10,-20 30 h55 c-5 -20,-15 -30,-20 -30 z" fill="#10b981" />
    <!-- Collar -->
    <path d="M5 85 l10 10 l10 -10" fill="none" stroke="#d1fae5" stroke-width="3" stroke-linecap="round" />
    <!-- Head & Hair -->
    <circle cx="15" cy="45" r="18" fill="#fcd34d" />
    <!-- Hair style - Ponytail / shorter cut -->
    <path d="M-2 44 c0 -14, 10 -22, 22 -20 c8 2, 14 8, 16 16 c4 -2, 8 -1, 10 3 c2 5, -2 8, -4 6 c-6 -5,-14 -5,-20 -5 c-10 0,-18 5,-24 0 z" fill="#451a03" />
    <!-- Facial Features -->
    <circle cx="10" cy="43" r="2" fill="#334155" />
    <circle cx="22" cy="43" r="2" fill="#334155" />
    <!-- Cheeks -->
    <circle cx="8" cy="48" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="24" cy="48" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Talking Smile -->
    <path d="M13 50 q3 4, 6 0 z" fill="#b91c1c" />
  </g>

  <!-- Dynamic Speech Bubbles Illustrating "Different Dialects/方言" -->
  <!-- Left Speech Bubble (Blue tone, regional flavor A) -->
  <g transform="translate(18, 55)">
    <path d="M0 15 c0 -10, 10 -15, 25 -15 h25 c15 0, 25 5, 25 15 c0 8,-10 15,-25 15 h-10 l-10 8 l-2 -8 c-10 0,-18 -5,-18 -15 z" fill="url(#bubble-grad-1)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.2))" />
    <!-- Abstract wavy phonetics / sound wave lines inside bubble representing speech -->
    <path d="M15 15 q 6 -6, 12 0 t 12 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="48" cy="15" r="2.5" fill="#ffffff" />
  </g>

  <!-- Right Speech Bubble (Green tone, regional flavor B) -->
  <g transform="translate(150, 55)">
    <path d="M0 15 c0 -10, 10 -15, 25 -15 h25 c15 0, 25 5, 25 15 c0 8,-10 15,-25 15 h-15 l-3 8 l-2 -8 c-10 0,-15 -5,-15 -15 z" fill="url(#bubble-grad-2)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.2))" />
    <!-- Different phonetic wave symbol inside -->
    <path d="M15 12 q 6 6, 12 0 t 12 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="18" r="2.5" fill="#ffffff" />
  </g>

  <!-- Top Center Floating Bubble (Representing a third regional variant/diversity) -->
  <g transform="translate(90, 15)">
    <path d="M0 10 c0 -6, 6 -10, 16 -10 h16 c10 0, 16 4, 16 10 c0 5,-6 10,-16 10 h-6 l-5 6 l-2 -6 c-5 0,-8 -3,-8 -10 z" fill="url(#bubble-grad-3)" opacity="0.95" filter="drop-shadow(0px 3px 4px rgba(0,0,0,0.15))" />
    <circle cx="15" cy="10" r="1.5" fill="#ffffff" />
    <circle cx="24" cy="10" r="1.5" fill="#ffffff" />
    <circle cx="33" cy="10" r="1.5" fill="#ffffff" />
  </g>

  <!-- Extra Props: Coffee / Tea Mugs on Desk for Realism -->
  <g transform="translate(185, 155)">
    <rect x="0" y="5" width="14" height="16" rx="3" fill="#e2e8f0" />
    <path d="M14 9 c3 0, 5 1, 5 3 c0 2,-2 3,-5 3" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M4 1 q 2 -3, 0 -6" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  </g>

</svg>