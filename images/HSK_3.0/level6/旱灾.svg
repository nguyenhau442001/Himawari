<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Cracked Earth Ground -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#4A3728"/>
  <path d="M60 180 L70 200 M100 180 L90 205 M140 180 L150 205 M180 180 L170 200" stroke="#2D2118" stroke-width="2"/>
  
  <!-- Withered Crop -->
  <g fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round">
    <path d="M120 180 L120 120 M120 130 L100 110 M120 130 L140 110"/>
    <path d="M100 180 L90 140 M140 180 L150 140"/>
  </g>
  
  <!-- Harsh Sun -->
  <circle cx="190" cy="50" r="25" fill="#F59E0B"/>
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round">
    <line x1="190" y1="15" x2="190" y2="5"/>
    <line x1="190" y1="85" x2="190" y2="95"/>
    <line x1="155" y1="50" x2="145" y2="50"/>
    <line x1="225" y1="50" x2="235" y2="50"/>
    <line x1="165" y1="25" x2="158" y2="18"/>
    <line x1="215" y1="75" x2="222" y2="82"/>
  </g>
  
  <!-- Heat Haze/Distortion -->
  <path d="M50 160 Q70 150 90 160 T130 160" stroke="#374151" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M60 170 Q80 160 100 170 T140 170" stroke="#374151" stroke-width="2" fill="none" opacity="0.4"/>
</svg>