<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(40, 40)">
    <!-- Ground -->
    <path d="M0 140 L160 140 L150 160 L10 160 Z" fill="#374151"/>
    <!-- Cracked Earth -->
    <path d="M20 140 L40 120 L60 140 L80 120 L100 140 L120 120 L140 140" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Collapsed Structure -->
    <path d="M40 140 L40 80 L80 80 L80 100 L110 100 L110 140" fill="#4B5563"/>
    <path d="M80 80 L100 60 L120 80" fill="#6B7280"/>
    <!-- Debris -->
    <rect x="30" y="130" width="15" height="10" fill="#9CA3AF"/>
    <rect x="120" y="135" width="20" height="5" fill="#9CA3AF"/>
    <!-- Smoke/Dust -->
    <circle cx="100" cy="70" r="15" fill="#374151" opacity="0.6"/>
    <circle cx="120" cy="60" r="20" fill="#374151" opacity="0.4"/>
    <!-- Fire/Accent -->
    <path d="M70 100 Q80 80 90 100 Q80 90 70 100" fill="#F59E0B"/>
  </g>
</svg>