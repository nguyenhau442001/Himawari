<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing mastery/genius -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.06"/>

  <!-- Chessboard platform / table -->
  <path d="M50 160 L190 160 L210 185 L30 185 Z" fill="#2D333B"/>
  <path d="M60 160 L180 160 L190 172 L50 172 Z" fill="#3A424D"/>

  <!-- Scale exaggeration: The "Cao Shou" (Master) - Elevated, glowing figure on the right -->
  <!-- Master Silhouette/Body -->
  <circle cx="155" cy="95" r="18" fill="#FFB703"/>
  <path d="M135 145 C135 122 175 122 175 145 Z" fill="#FFB703"/>
  
  <!-- Master's Hand placing a glowing chess piece with precision -->
  <circle cx="132" cy="118" r="5" fill="#FFB703"/>
  
  <!-- Master's crown/halo representing supreme skill -->
  <path d="M140 68 L155 58 L170 68 L162 64 L155 70 L148 64 Z" fill="#FFB703"/>

  <!-- The "Folk/Ordinary" opponent - Smaller, lower, humbled on the left -->
  <!-- Opponent Body -->
  <circle cx="85" cy="115" r="14" fill="#6C757D"/>
  <path d="M70 155 C70 138 100 138 100 155 Z" fill="#6C757D"/>
  
  <!-- Opponent's hand in a thinking/surrendered gesture -->
  <circle cx="102" cy="132" r="4" fill="#6C757D"/>

  <!-- Giant Xiangqi (Chinese Chess) Board Grid on table surface in perspective -->
  <line x1="75" y1="168" x2="165" y2="168" stroke="#4F5D75" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="85" y1="176" x2="155" y2="176" stroke="#4F5D75" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Master's winning game piece (Glowing Gold) -->
  <circle cx="130" cy="125" r="9" fill="#1A1D24" stroke="#FFB703" stroke-width="2.5"/>
  <circle cx="130" cy="125" r="5" fill="#FFB703"/>

  <!-- Opponent's defeated/neutral game piece -->
  <circle cx="105" cy="135" r="7" fill="#1A1D24" stroke="#6C757D" stroke-width="1.5"/>

  <!-- Visual Contrast Elements: Floating Sparkles of brilliance around the Master -->
  <path d="M185 85 L188 92 L195 95 L188 98 L185 105 L182 98 L175 95 L182 92 Z" fill="#FFB703" opacity="0.9"/>
  <path d="M125 55 L127 60 L132 62 L127 64 L125 69 L123 64 L118 62 L123 60 Z" fill="#FFB703" opacity="0.6"/>

  <!-- Dynamic energy flow line showing absolute dominance/mastery -->
  <path d="M95 130 Q 115 95 145 105" fill="none" stroke="#FFB703" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Decorative baseline element -->
  <rect x="70" y="198" width="100" height="3" rx="1.5" fill="#3A424D"/>
</svg>