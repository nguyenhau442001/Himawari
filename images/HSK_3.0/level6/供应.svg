<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" fill="url(#lightGlow)" />

  <!-- Supermarket / Market Background Environment -->
  <!-- Back Wall & Display Shelves -->
  <rect x="20" y="45" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Shelf 1 (Top) -->
  <rect x="25" y="75" width="190" height="8" rx="4" fill="url(#shelfGrad)" />
  <!-- Abundant Products on Shelf 1 -->
  <circle cx="45" cy="65" r="8" fill="#ef4444" />
  <circle cx="65" cy="65" r="8" fill="#f59e0b" />
  <circle cx="85" cy="63" r="10" fill="#10b981" />
  <rect x="105" y="55" width="16" height="20" rx="3" fill="#38bdf8" />
  <rect x="127" y="55" width="16" height="20" rx="3" fill="#ec4899" />
  <circle cx="157" cy="65" r="9" fill="#f59e0b" />
  <circle cx="177" cy="63" r="10" fill="#ef4444" />
  <circle cx="197" cy="65" r="8" fill="#10b981" />

  <!-- Shelf 2 (Middle) -->
  <rect x="25" y="115" width="190" height="8" rx="4" fill="url(#shelfGrad)" />
  <!-- Abundant Products on Shelf 2 -->
  <rect x="40" y="93" width="18" height="22" rx="3" fill="#a855f7" />
  <rect x="63" y="93" width="18" height="22" rx="3" fill="#38bdf8" />
  <circle cx="98" cy="103" r="11" fill="#ef4444" />
  <circle cx="122" cy="103" r="11" fill="#f59e0b" />
  <rect x="142" y="93" width="16" height="22" rx="3" fill="#10b981" />
  <rect x="164" y="93" width="16" height="22" rx="3" fill="#ec4899" />
  <circle cx="194" cy="103" r="10" fill="#38bdf8" />

  <!-- Shelf 3 (Bottom) -->
  <rect x="25" y="155" width="190" height="8" rx="4" fill="url(#shelfGrad)" />
  <!-- Abundant Products on Shelf 3 -->
  <circle cx="45" cy="142" r="11" fill="#f59e0b" />
  <circle cx="70" cy="140" r="12" fill="#10b981" />
  <rect x="92" y="133" width="20" height="22" rx="4" fill="#38bdf8" />
  <rect x="118" y="133" width="20" height="22" rx="4" fill="#ef4444" />
  <circle cx="155" cy="142" r="11" fill="#a855f7" />
  <circle cx="182" cy="140" r="12" fill="#f59e0b" />

  <!-- Foreground Counter / Checkout Desk -->
  <path d="M 10 185 L 230 185 L 220 225 L 20 225 Z" fill="#334155" />
  <path d="M 10 185 L 230 185 L 230 193 L 10 193 Z" fill="#475569" />

  <!-- Foreground Character (Shopper / Customer looking pleased at abundant supply) -->
  <!-- Body/Torso -->
  <path d="M 160 225 C 160 200, 180 195, 195 195 C 210 195, 230 200, 230 225 Z" fill="#10b981" />
  
  <!-- Neck & Head -->
  <rect x="186" y="175" width="18" height="22" rx="6" fill="#fbcfe8" />
  <circle cx="195" cy="165" r="18" fill="#fbcfe8" />
  
  <!-- Hair -->
  <path d="M 177 162 C 177 150, 185 145, 195 145 C 208 145, 214 153, 213 168 C 205 165, 200 155, 185 158 Z" fill="#475569" />

  <!-- Happy Facial Expression -->
  <!-- Eyes (closed happy arches) -->
  <path d="M 188 163 Q 192 167 196 163" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 199 163 Q 203 167 207 163" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Smile -->
  <path d="M 192 171 Q 195 175 198 171" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Rosy Cheeks -->
  <circle cx="186" cy="169" r="3" fill="#f43f5e" opacity="0.4" />
  <circle cx="204" cy="169" r="3" fill="#f43f5e" opacity="0.4" />

  <!-- Shopping Basket filled with goods -->
  <g transform="translate(110, 175)">
    <!-- Basket Body -->
    <path d="M 10 10 L 45 10 L 40 40 L 15 40 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" stroke-linejoin="round" />
    <!-- Handle -->
    <path d="M 14 10 C 14 -3, 41 -3, 41 10" stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Goods sticking out -->
    <circle cx="22" cy="5" r="7" fill="#ef4444" />
    <circle cx="33" cy="4" r="8" fill="#10b981" />
    <rect x="22" y="12" width="10" height="15" rx="2" fill="#38bdf8" />
  </g>

  <!-- Interactive hand gesturing satisfaction/abundance -->
  <path d="M 175 195 C 168 190, 165 180, 172 175 C 177 172, 182 177, 180 185 Z" fill="#fbcfe8" />

  <!-- Ambient lighting/sparkles representing "sufficiency/abundance" -->
  <g fill="#fbbf24">
    <path d="M 50 35 L 52 40 L 57 42 L 52 44 L 50 49 L 48 44 L 43 42 L 48 40 Z" opacity="0.8" />
    <path d="M 130 25 L 131 28 L 134 29 L 131 30 L 130 33 L 129 30 L 126 29 L 129 28 Z" opacity="0.6" />
    <path d="M 190 40 L 191.5 43.5 L 195 45 L 191.5 46.5 L 190 50 L 188.5 46.5 L 185 45 L 188.5 43.5 Z" opacity="0.9" />
  </g>

</svg>