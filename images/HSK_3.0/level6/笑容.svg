<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle warm glow representing "温暖" (warmth) -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.08"/>

  <!-- Central Character / Face representation for "笑容" (Smile) -->
  <g transform="translate(120, 115)">
    <!-- Head / Face base -->
    <circle cx="0" cy="0" r="62" fill="#2A2F3D"/>

    <!-- Soft inner shading for depth -->
    <circle cx="0" cy="4" r="54" fill="#242935"/>

    <!-- Closed happy/smiling eyes (curved arcs facing down, classic warm expression) -->
    <path d="M -30 -12 C -24 -20 -12 -20 -6 -12" stroke="#FFB703" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 6 -12 C 12 -20 24 -20 30 -12" stroke="#FFB703" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Rosy warm cheeks -->
    <circle cx="-32" cy="8" r="10" fill="#FF7043" opacity="0.4"/>
    <circle cx="32" cy="8" r="10" fill="#FF7043" opacity="0.4"/>

    <!-- Radiant, genuine warm smile (open crescent) -->
    <path d="M -24 14 C -24 35 24 35 24 14 Z" fill="#FFB703"/>
    <!-- Smile inner shadow / tongue detail -->
    <path d="M -14 21 C -8 28 8 28 14 21 Z" fill="#FF7043"/>
  </g>

  <!-- Radiating warmth lines / accent rays (representing "很温暖") -->
  <g stroke="#FFB703" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="26" x2="120" y2="16" />
    <line x1="184" y1="65" x2="192" y2="59" />
    <line x1="194" y1="120" x2="204" y2="120" />
    <line x1="56" y1="65" x2="48" y2="59" />
    <line x1="46" y1="120" x2="36" y2="120" />
  </g>
</svg>