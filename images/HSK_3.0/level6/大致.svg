<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradient (Explaining) -->
    <linearGradient id="sweaterA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradient (Understanding) -->
    <linearGradient id="sweaterB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Idea Lightbulb Glow -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Background Environment & Props -->
  <!-- Bookshelf / Wall details -->
  <path d="M20 50 H90 V53 H20 Z" fill="#334155" opacity="0.6"/>
  <rect x="25" y="30" width="8" height="20" rx="2" fill="#f43f5e" opacity="0.6"/>
  <rect x="35" y="25" width="10" height="25" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="47" y="35" width="7" height="15" rx="1" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Window showing cozy night city -->
  <rect x="165" y="30" width="50" height="65" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <line x1="190" y1="30" x2="190" y2="95" stroke="#334155" stroke-width="2"/>
  <line x1="165" y1="62" x2="215" y2="62" stroke="#334155" stroke-width="2"/>
  <circle cx="178" cy="45" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="202" cy="78" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="180" cy="85" r="1" fill="#f43f5e" opacity="0.8"/>

  <!-- Warm Desk Lamp hanging from top -->
  <path d="M100 0 V30 H120 V0" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M90 30 L105 50 H125 L140 30 Z" fill="#fbbf24"/>
  <ellipse cx="115" cy="50" rx="15" ry="4" fill="#f59e0b"/>

  <!-- Wooden Desk Surface -->
  <path d="M0 185 H240 V240 H0 Z" fill="#334155"/>
  <path d="M0 185 H240 V191 H0 Z" fill="#475569"/>

  <!-- Desk Props: Laptop, Sketchpad, Mug -->
  <!-- Laptop -->
  <path d="M75 160 L95 135 H155 L175 160 Z" fill="#64748b"/>
  <path d="M70 163 H180 V168 H70 Z" fill="#475569" rx="2"/>
  <polygon points="98,138 152,138 168,157 82,157" fill="#0f172a"/>
  <!-- Complex sketch / blueprint lines on laptop screen representing 'ideas' -->
  <path d="M95 145 H130 M95 151 H115 M135 145 L145 151" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="52" y="152" width="14" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M66 156 C72 156 72 166 66 166" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- CHARACTER 1 (Left: Explaining/Presenting) -->
  <g transform="translate(15, 60)">
    <!-- Body & Sweater -->
    <path d="M45 100 C45 80 60 75 75 75 C90 75 105 80 105 100 V125 H45 Z" fill="url(#sweaterA)"/>
    <!-- Head & Face -->
    <circle cx="75" cy="52" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M57 52 C57 38 75 35 93 45 C90 35 75 32 60 38 Z" fill="#334155"/>
    <!-- Expressive Eye & Smile -->
    <circle cx="81" cy="50" r="2" fill="#1e293b"/>
    <path d="M78 58 Q82 62 86 58" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Gesture Arm pointing forward -->
    <path d="M95 85 Q115 90 125 80" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="127" cy="78" r="5" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER 2 (Right: Understanding / "大致明白") -->
  <g transform="translate(110, 60)">
    <!-- Body & Sweater -->
    <path d="M45 100 C45 80 60 75 75 75 C90 75 105 80 105 100 V125 H45 Z" fill="url(#sweaterB)"/>
    <!-- Head & Face -->
    <circle cx="75" cy="52" r="18" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M57 48 C60 36 90 36 93 48 C85 40 65 40 57 48 Z" fill="#78350f"/>
    <!-- Expressive Eye (Confident / Nodding look) -->
    <path d="M66 49 Q69 46 72 49" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M70 57 Q75 62 80 57" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hand on chin / thoughtful realization pose -->
    <path d="M55 90 Q60 75 70 70" fill="none" stroke="#047857" stroke-width="9" stroke-linecap="round"/>
    <circle cx="71" cy="67" r="5" fill="#fed7aa"/>
  </g>

  <!-- VISUAL METAPHOR FOR "大致明白" (Partial/Soft lightbulb / Glowing concept cloud) -->
  <g transform="translate(140, 25)">
    <!-- Soft glowing aura -->
    <circle cx="15" cy="15" r="22" fill="url(#bulbGlow)"/>
    <!-- Lightbulb Icon (representing 'idea' / 'understanding') -->
    <path d="M10 20 C10 12 15 8 20 8 C25 8 30 12 30 20 C30 25 26 28 25 31 H15 C14 28 10 25 10 20 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <rect x="17" y="31" width="6" height="4" fill="#94a3b8" rx="1"/>
    <!-- Sparkles around indicating "Ah, roughly got it!" -->
    <path d="M3 8 L7 11" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <path d="M33 8 L29 11" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 2 L18 6" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtle 'Roughly/Approximation' visual cue (floating balanced dots/nodes connected smoothly) -->
  <g transform="translate(95, 75)" opacity="0.8">
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    <path d="M3 0 C15 -10 25 -10 38 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="41" cy="0" r="5" fill="#10b981"/>
  </g>
</svg>