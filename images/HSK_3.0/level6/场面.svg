<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Decorations -->
  <circle cx="120" cy="80" r="60" fill="#fbbf24" opacity="0.1"/>
  <path d="M40 180 Q120 140 200 180 L200 240 L40 240 Z" fill="#334155" opacity="0.4"/>
  
  <!-- Confetti/Atmosphere -->
  <circle cx="50" cy="60" r="2" fill="#ec4899"/>
  <circle cx="190" cy="70" r="2" fill="#38bdf8"/>
  <circle cx="120" cy="40" r="2" fill="#fb923c"/>
  <circle cx="80" cy="100" r="2" fill="#10b981"/>
  
  <!-- Groom -->
  <g transform="translate(70, 120)">
    <rect x="-10" y="20" width="20" height="60" rx="4" fill="#334155"/>
    <circle cx="0" cy="10" r="15" fill="#fde68a"/>
    <path d="M-5 15 L5 15 L0 25 Z" fill="#1e293b"/>
  </g>
  
  <!-- Bride -->
  <g transform="translate(170, 120)">
    <path d="M-15 20 L15 20 L10 80 L-10 80 Z" fill="#f8fafc"/>
    <circle cx="0" cy="10" r="15" fill="#fde68a"/>
    <path d="M-10 0 L10 0 L0 -15 Z" fill="#ec4899"/>
  </g>
  
  <!-- Guest/Crowd -->
  <g transform="translate(120, 150)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24"/>
    <rect x="-8" y="10" width="16" height="40" rx="4" fill="#64748b"/>
  </g>
  <g transform="translate(40, 160)">
    <circle cx="0" cy="0" r="10" fill="#fb923c"/>
    <rect x="-6" y="8" width="12" height="35" rx="3" fill="#475569"/>
  </g>
  <g transform="translate(200, 160)">
    <circle cx="0" cy="0" r="10" fill="#38bdf8"/>
    <rect x="-6" y="8" width="12" height="35" rx="3" fill="#475569"/>
  </g>
  
  <!-- Wedding Arch/Decor -->
  <path d="M60 180 C60 80, 180 80, 180 180" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="60" cy="180" r="8" fill="#ec4899"/>
  <circle cx="180" cy="180" r="8" fill="#ec4899"/>
</svg>