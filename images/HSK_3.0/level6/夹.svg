<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow / Atmosphere -->
  <circle cx="120" cy="120" r="70" fill="#2D323E" opacity="0.4"/>

  <!-- Thick Book (representing "厚厚的读物") -->
  <g transform="translate(48, 55)">
    <!-- Book Back Cover / Thickness -->
    <path d="M 12 120 L 132 120 L 132 135 L 12 135 Z" fill="#2A313C"/>
    <path d="M 12 110 L 132 110 L 132 120 L 12 120 Z" fill="#323B49"/>

    <!-- Book Pages Stack -->
    <path d="M 10 20 L 130 20 L 130 110 L 10 110 Z" fill="#E2E8F0"/>
    <path d="M 12 23 L 128 23 L 128 107 L 12 107 Z" fill="#F8FAFC"/>
    
    <!-- Page lines (inner details) -->
    <line x1="25" y1="40" x2="115" y2="40" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="55" x2="100" y2="55" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="70" x2="110" y2="70" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="85" x2="90" y2="85" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Book Spine (Left side) -->
    <path d="M 10 20 C 5 20, 2 23, 2 27 L 2 103 C 2 107, 5 110, 10 110 Z" fill="#3B82F6"/>
  </g>

  <!-- Leaf Vein Bookmark ("雅致的叶脉书签") - The 'Jiā' (Kẹp) Element -->
  <g transform="translate(100, 30) rotate(15)">
    <!-- Bookmark stem -->
    <path d="M 35 115 L 35 135" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Leaf Body -->
    <path d="M 35 30 C 55 50, 55 85, 35 115 C 15 85, 15 50, 35 30 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5" opacity="0.95"/>
    
    <!-- Leaf Veins -->
    <path d="M 35 35 L 35 110" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 50 L 45 40" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 50 L 25 40" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 65 L 48 55" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 65 L 22 55" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 80 L 46 72" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 80 L 24 72" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 95 L 42 90" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <path d="M 35 95 L 28 90" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Focus / Insertion Indicator (subtle glowing accent to highlight the 'clamped/sandwiched' action) -->
  <circle cx="123" cy="95" r="4" fill="#F59E0B"/>
</svg>