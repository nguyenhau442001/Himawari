<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Calendar Icon representing "shàngxún" (First 10 days of the month) -->
  <g transform="translate(45, 35)">
    <!-- Calendar Body -->
    <rect x="10" y="20" width="130" height="130" rx="16" fill="#252A34" stroke="#3A4252" stroke-width="3"/>
    
    <!-- Header banner (Orange/Gold accent for focus) -->
    <path d="M 26 20 L 124 20 A 16 16 0 0 1 140 36 L 140 55 L 10 55 L 10 36 A 16 16 0 0 1 26 20 Z" fill="#F59E0B"/>
    
    <!-- Binding Rings -->
    <rect x="42" y="10" width="12" height="18" rx="6" fill="#6B7280"/>
    <rect x="96" y="10" width="12" height="18" rx="6" fill="#6B7280"/>
    
    <!-- Grid representing the 30-day month, with the first row (1-10) highlighted -->
    <!-- Week 1: Days 1 to 7 (Highlighted) -->
    <rect x="22" y="68" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="44" y="68" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="66" y="68" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="88" y="68" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="110" y="68" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    
    <!-- Week 2: Days 8 to 14 (Days 8-10 highlighted, 11-14 muted) -->
    <rect x="22" y="90" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="44" y="90" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="66" y="90" width="16" height="16" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="88" y="90" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="110" y="90" width="16" height="16" rx="4" fill="#3A4252"/>
    
    <!-- Week 3: Days 15-21 (Muted) -->
    <rect x="22" y="112" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="44" y="112" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="66" y="112" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="88" y="112" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="110" y="112" width="16" height="16" rx="4" fill="#3A4252"/>
    
    <!-- Week 4: Days 22-28 (Muted) -->
    <rect x="22" y="134" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="44" y="134" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="66" y="134" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="88" y="134" width="16" height="16" rx="4" fill="#3A4252"/>
    <rect x="110" y="134" width="16" height="16" rx="4" fill="#3A4252"/>

    <!-- Magnifying Glass indicating the focus on the initial period -->
    <g transform="translate(70, 75)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.95"/>
      <line x1="45" y1="45" x2="65" y2="65" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>