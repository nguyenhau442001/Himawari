<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements representing passing time/flow -->
  <g opacity="0.15" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
    <circle cx="120" cy="120" r="75"/>
    <circle cx="120" cy="120" r="95"/>
  </g>

  <!-- Central Physical Object: Vintage/Modern Hourglass (representing "时光" - physical manifestation of time passing) -->
  <g transform="translate(120, 120)">
    <!-- Outer Glow / Accent Aura -->
    <circle cx="0" cy="0" r="60" fill="#F5A623" opacity="0.08"/>

    <!-- Hourglass Frame -->
    <!-- Top wooden/metal cap -->
    <rect x="-32" y="-70" width="64" height="12" rx="3" fill="#2E3542"/>
    <rect x="-24" y="-58" width="48" height="4" rx="1" fill="#F5A623"/>

    <!-- Bottom wooden/metal cap -->
    <rect x="-32" y="58" width="64" height="12" rx="3" fill="#2E3542"/>
    <rect x="-24" y="54" width="48" height="4" rx="1" fill="#F5A623"/>

    <!-- Connecting pillars -->
    <rect x="-28" y="-58" width="6" height="116" rx="2" fill="#2E3542"/>
    <rect x="22" y="-58" width="6" height="116" rx="2" fill="#2E3542"/>

    <!-- Glass bulb container -->
    <path d="M -22 -54 
             C -22 -20, -2 -10, -2 0 
             C -2 10, -22 20, -22 54 
             L 22 54 
             C 22 20, 2 10, 2 0 
             C 2 -10, 22 -20, 22 -54 
             Z" 
          fill="#3B4252" opacity="0.4"/>

    <!-- Top Sand (decreasing) -->
    <path d="M -18 -48 
             C -18 -20, -3 -10, 0 0
             C 3 -10, 18 -20, 18 -48 
             Z" 
          fill="#F5A623"/>

    <!-- Falling Sand Stream -->
    <line x1="0" y1="0" x2="0" y2="35" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5"/>

    <!-- Bottom Sand Pile (accumulating, forming a cone) -->
    <path d="M -19 48 
             L 19 48 
             C 12 36, 6 28, 0 24 
             C -6 28, -12 36, -19 48 
             Z" 
          fill="#F5A623"/>

    <!-- Sparkle / Highlight indicating precious "good times" (美好的时光) -->
    <g transform="translate(45, -40)" fill="#F5A623">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" opacity="0.9"/>
    </g>
    <g transform="translate(-50, 25)" fill="#F5A623">
      <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" opacity="0.6"/>
    </g>

    <!-- Motion trails indicating fast passing ("过得很快") -->
    <path d="M 40 -15 C 50 -10, 55 0, 50 10" stroke="#F5A623" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 46 -5 C 53 0, 56 8, 52 16" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
</svg>