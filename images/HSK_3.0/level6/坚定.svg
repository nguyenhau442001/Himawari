<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Foundation -->
  <path d="M40 190 L200 190" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The Character (The person standing firm) -->
  <g transform="translate(120, 185)">
    <!-- Legs -->
    <path d="M-15 0 L-15 -40 M15 0 L15 -40" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
    <!-- Torso -->
    <path d="M0 -40 L0 -110" stroke="#FFB800" stroke-width="10" stroke-linecap="round"/>
    <!-- Arms (Arms crossed firmly) -->
    <path d="M-25 -90 L0 -70 L25 -90" stroke="#FFB800" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head -->
    <circle cx="0" cy="-130" r="20" fill="#FFB800"/>
    <!-- Stance indicator (The "firm" aspect) -->
    <path d="M-30 0 L-40 -10 M30 0 L40 -10" stroke="#FFB800" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wind/Obstacle lines (Representing the "twisting/rough road" context) -->
  <path d="M20 60 L60 60 M20 80 L50 80 M20 100 L40 100" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 60 L220 60 M190 80 L220 80 M200 100 L220 100" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
</svg>