<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Background subtle glow representing vitality/health -->
    <circle cx="120" cy="115" r="55" fill="#252A34" opacity="0.6"/>
    
    <!-- Torso and Muscular Physique (Cường tráng / Khỏe mạnh) -->
    <!-- Shoulders, chest, and arms in a confident, strong posture -->
    <path d="M 85,90 
             Q 120,70 155,90 
             Q 175,100 170,125 
             Q 165,150 150,185 
             Q 140,205 120,205 
             Q 100,205 90,185 
             Q 75,150 70,125 
             Q 65,100 85,90 Z" 
          fill="#2D3343"/>
          
    <!-- Defined Chest and Pectorals -->
    <path d="M 92,105 
             Q 120,115 120,135 
             Q 120,115 148,105 
             Q 158,125 150,145 
             Q 120,165 90,145 
             Q 82,125 92,105 Z" 
          fill="#3B4256"/>

    <!-- Center Abdominal Definition (Six-pack / Core strength) -->
    <line x1="120" y1="140" x2="120" y2="185" stroke="#252A34" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="152" x2="135" y2="152" stroke="#252A34" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="103" y1="168" x2="137" y2="168" stroke="#252A34" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Powerful Arms flexing on sides -->
    <!-- Left Arm -->
    <path d="M 75,95 
             Q 55,105 52,125 
             Q 50,145 62,155 
             Q 75,145 80,120 Z" 
          fill="#3B4256"/>
    <!-- Left Bicep Highlight -->
    <circle cx="62" cy="125" r="10" fill="#475069"/>

    <!-- Right Arm -->
    <path d="M 165,95 
             Q 185,105 188,125 
             Q 190,145 178,155 
             Q 165,145 160,120 Z" 
          fill="#3B4256"/>
    <!-- Right Bicep Highlight -->
    <circle cx="178" cy="125" r="10" fill="#475069"/>

    <!-- Neck and Head silhouette -->
    <path d="M 105,80 L 108,55 Q 120,50 132,55 L 135,80 Z" fill="#3B4256"/>
    <circle cx="120" cy="42" r="14" fill="#3B4256"/>

    <!-- Accent Energy/Strength Elements (Gold/Orange focus) -->
    <!-- Dynamic energy pulse arcs framing the powerful physique -->
    <path d="M 68,75 Q 50,95 50,125" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 172,75 Q 190,95 190,125" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Spark indicators of peak physical fitness -->
    <circle cx="48" cy="125" r="3" fill="#F59E0B"/>
    <circle cx="192" cy="125" r="3" fill="#F59E0B"/>
    <circle cx="120" cy="30" r="3.5" fill="#F59E0B"/>
  </g>
</svg>