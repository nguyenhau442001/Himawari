<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle cold night glow / winter atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#222B38" opacity="0.6"/>
  
  <!-- Plum blossom branch (Meihua) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main branch -->
    <path d="M40 170 C70 170, 95 130, 115 110 C135 90, 160 85, 200 70" stroke="#4A3B32" stroke-width="6"/>
    <!-- Side branching twig -->
    <path d="M115 110 C100 95, 80 80, 65 75" stroke="#4A3B32" stroke-width="3.5"/>
    <path d="M145 95 C165 70, 160 50, 155 40" stroke="#4A3B32" stroke-width="3"/>
    <path d="M175 77 C190 60, 185 45, 180 35" stroke="#4A3B32" stroke-width="2.5"/>
  </g>

  <!-- Plum Blossoms (Meihua - 5 petals, characteristic vibrant warm gold/amber-orange accent) -->
  <!-- Flower 1 (Top right) -->
  <g transform="translate(175, 55)">
    <circle cx="0" cy="-10" r="8" fill="#F4A261"/>
    <circle cx="9" cy="-3" r="8" fill="#F4A261"/>
    <circle cx="6" cy="8" r="8" fill="#F4A261"/>
    <circle cx="-6" cy="8" r="8" fill="#F4A261"/>
    <circle cx="-9" cy="-3" r="8" fill="#F4A261"/>
    <circle cx="0" cy="0" r="3.5" fill="#E76F51"/>
    <!-- Stamens -->
    <line x1="0" y1="0" x2="0" y2="-6" stroke="#FFE3A8" stroke-width="1"/>
    <line x1="0" y1="0" x2="5" y2="-2" stroke="#FFE3A8" stroke-width="1"/>
    <line x1="0" y1="0" x2="-5" y2="-2" stroke="#FFE3A8" stroke-width="1"/>
  </g>

  <!-- Flower 2 (Center main) -->
  <g transform="translate(115, 110)">
    <circle cx="0" cy="-10.5" r="9" fill="#F4A261"/>
    <circle cx="10" cy="-3.5" r="9" fill="#F4A261"/>
    <circle cx="6.5" cy="8.5" r="9" fill="#F4A261"/>
    <circle cx="-6.5" cy="8.5" r="9" fill="#F4A261"/>
    <circle cx="-10" cy="-3.5" r="9" fill="#F4A261"/>
    <circle cx="0" cy="0" r="4" fill="#E76F51"/>
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#FFE3A8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="6" y2="-3" stroke="#FFE3A8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-6" y2="-3" stroke="#FFE3A8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="4" y2="5" stroke="#FFE3A8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-4" y2="5" stroke="#FFE3A8" stroke-width="1.2"/>
  </g>

  <!-- Flower 3 (Upper left branch) -->
  <g transform="translate(65, 75)">
    <circle cx="0" cy="-9" r="7.5" fill="#F4A261"/>
    <circle cx="8" cy="-2.5" r="7.5" fill="#F4A261"/>
    <circle cx="5" cy="7" r="7.5" fill="#F4A261"/>
    <circle cx="-5" cy="7" r="7.5" fill="#F4A261"/>
    <circle cx="-8" cy="-2.5" r="7.5" fill="#F4A261"/>
    <circle cx="0" cy="0" r="3" fill="#E76F51"/>
    <line x1="0" y1="0" x2="0" y2="-5" stroke="#FFE3A8" stroke-width="1"/>
    <line x1="0" y1="0" x2="4" y2="3" stroke="#FFE3A8" stroke-width="1"/>
    <line x1="0" y1="0" x2="-4" y2="3" stroke="#FFE3A8" stroke-width="1"/>
  </g>

  <!-- Flower 4 (Lower right) -->
  <g transform="translate(150, 85)">
    <circle cx="0" cy="-8" r="7" fill="#F4A261"/>
    <circle cx="7" cy="-2" r="7" fill="#F4A261"/>
    <circle cx="4" cy="6" r="7" fill="#F4A261"/>
    <circle cx="-4" cy="6" r="7" fill="#F4A261"/>
    <circle cx="-7" cy="-2" r="7" fill="#F4A261"/>
    <circle cx="0" cy="0" r="2.5" fill="#E76F51"/>
  </g>

  <!-- Bud (Unopened) -->
  <g transform="translate(155, 38)">
    <path d="M0 0 C-3 -3, -3 -7, 0 -9 C3 -7, 3 -3, 0 0 Z" fill="#E76F51"/>
    <path d="M-1 -1 L-2 -4" stroke="#4A3B32" stroke-width="1"/>
  </g>

  <!-- Small falling petals representing winter breeze -->
  <path d="M85 130 Q88 135 84 138 Q80 135 85 130 Z" fill="#F4A261" opacity="0.8"/>
  <path d="M135 65 Q138 68 135 71 Q132 68 135 65 Z" fill="#F4A261" opacity="0.8"/>
  
  <!-- Subtle minimalist falling snow dots for winter context -->
  <circle cx="70" cy="45" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="110" cy="40" r="1" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="45" cy="115" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="195" cy="125" r="1" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="165" cy="155" r="2" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="85" cy="195" r="1.5" fill="#FFFFFF" opacity="0.4"/>
</svg>