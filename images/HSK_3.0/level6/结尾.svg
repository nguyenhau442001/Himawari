<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow/gradient to enhance cinematic dark mode feel -->
  <circle cx="120" cy="110" r="80" fill="#2D323E" opacity="0.4"/>

  <!-- Movie Screen / Frame (representing "这部电影" - the movie) -->
  <rect x="36" y="55" width="168" height="105" rx="8" fill="#121418" stroke="#3A4150" stroke-width="2"/>
  
  <!-- Film perforations left/right -->
  <rect x="42" y="65" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="42" y="85" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="42" y="105" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="42" y="125" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="42" y="145" width="5" height="8" rx="1.5" fill="#3A4150"/>

  <rect x="193" y="65" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="193" y="85" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="193" y="105" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="193" y="125" width="5" height="8" rx="1.5" fill="#3A4150"/>
  <rect x="193" y="145" width="5" height="8" rx="1.5" fill="#3A4150"/>

  <!-- Inside Screen Content: Fading out scene with dynamic character action (Verb/Action aspect) -->
  <!-- Scene landscape -->
  <path d="M52 135 L90 100 L125 125 L160 95 L188 135 Z" fill="#252A34"/>
  <circle cx="165" cy="80" r="12" fill="#E59838" opacity="0.8"/> <!-- Sun setting / ending theme -->

  <!-- Dynamic Character walking towards the edge/ending -->
  <!-- Motion lines showing movement to the final point -->
  <line x1="110" y1="120" x2="95" y2="120" stroke="#E59838" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="105" y1="125" x2="90" y2="125" stroke="#E59838" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Character silhouette/flat vector -->
  <circle cx="122" cy="108" r="6" fill="#F0F2F5"/>
  <path d="M122 114 L122 127 L116 138" stroke="#F0F2F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 118 L130 128 L126 138" stroke="#F0F2F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 116 L128 114" stroke="#F0F2F5" stroke-width="3" stroke-linecap="round"/>

  <!-- THE END / FIN indicator overlay representing "结尾" (Conclusion/Ending) -->
  <!-- Sleek modern marker/curtain closing or film strip end -->
  <rect x="52" y="148" width="136" height="4" fill="#E59838"/>
  
  <!-- Clapperboard / Action symbol integrated cleanly at the bottom focal point -->
  <g transform="translate(85, 172)">
    <!-- Clapper top angled -->
    <path d="M0 8 L70 8 L65 0 L-5 0 Z" fill="#E59838"/>
    <!-- Stripes on clapper -->
    <line x1="10" y1="8" x2="5" y2="0" stroke="#1A1D24" stroke-width="4"/>
    <line x1="30" y1="8" x2="25" y2="0" stroke="#1A1D24" stroke-width="4"/>
    <line x1="50" y1="8" x2="45" y2="0" stroke="#1A1D24" stroke-width="4"/>
    
    <!-- Clapper body -->
    <rect x="0" y="9" width="70" height="35" rx="3" fill="#2D323E" stroke="#E59838" stroke-width="2"/>
    
    <!-- Focus detail: subtle play/stop indicator lines -->
    <line x1="14" y1="20" x2="56" y2="20" stroke="#A6ACB8" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="30" x2="40" y2="30" stroke="#A6ACB8" stroke-width="3" stroke-linecap="round"/>
  </g>

</svg>