<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow for Focus -->
  <circle cx="120" cy="130" r="70" fill="#2D333F" opacity="0.5"/>

  <!-- Thermometer / Illness Symbol representing Condition -->
  <g transform="translate(0, 5)">
    <!-- Thermometer Body -->
    <rect x="180" y="70" width="12" height="60" rx="6" fill="#2E3544"/>
    <rect x="182" y="90" width="8" height="40" rx="4" fill="#FF5C5C"/>
    <circle cx="186" cy="124" r="9" fill="#FF5C5C"/>
    <!-- Heat/Fever Waves -->
    <path d="M198 85 C202 85, 202 95, 198 95" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M198 105 C202 105, 202 115, 198 115" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Human Character (Upper Body, slouched/sick posture) -->
  <g transform="translate(0, 10)">
    <!-- Body/Torso -->
    <path d="M 75 160 C 75 135, 95 125, 120 125 C 145 125, 165 135, 165 160 Z" fill="#3A4454"/>
    
    <!-- Shoulders / Clothes -->
    <path d="M 65 160 Q 120 135 175 160" fill="none" stroke="#525F75" stroke-width="4" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="120" cy="95" r="22" fill="#FFD1A9"/>
    
    <!-- Drooped Head / Closed Eyes (Sick expression) -->
    <path d="M 110 94 Q 113 97 116 94" stroke="#5C4033" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 124 94 Q 127 97 130 94" stroke="#5C4033" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Frown / Sad mouth -->
    <path d="M 116 107 Q 120 104 124 107" stroke="#5C4033" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- The "Adding Weight / Worsening" Action: A heavy weight pressing down onto the character's shoulders -->
  <g transform="translate(0, 0)">
    <!-- Downward Motion / Heavy Pressure Lines -->
    <path d="M 100 55 L 100 75" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120 45 L 120 75" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>
    <path d="M 140 55 L 140 75" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    
    <polygon points="120,83 113,72 127,72" fill="#FFA726"/>

    <!-- Heavy Weight Object (Stylized block with weight indicator) -->
    <rect x="95" y="32" width="50" height="22" rx="6" fill="#FFA726"/>
    <!-- Weight Handle -->
    <path d="M 107 32 V 26 C 107 23, 133 23, 133 26 V 32" fill="none" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>
    <!-- Plus / Increase Indicator on Weight (Semantic meaning: jiā - add/increase) -->
    <path d="M 120 38 V 48 M 115 43 H 125" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  </g>

</svg>