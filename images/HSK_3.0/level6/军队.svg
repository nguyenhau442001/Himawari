<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Training Obstacles -->
  <rect x="20" y="150" width="40" height="30" rx="4" fill="#fb923c"/>
  <rect x="180" y="140" width="40" height="40" rx="4" fill="#fb923c"/>
  
  <!-- Soldier 1 (Running) -->
  <g transform="translate(60, 130)">
    <circle cx="15" cy="15" r="10" fill="#f59e0b"/>
    <path d="M5 30 L10 50 L20 50 L25 30 Z" fill="#10b981"/>
    <path d="M10 50 L5 70 M20 50 L25 70" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 30 L5 40 M15 30 L25 40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Soldier 2 (Crouching/Aiming) -->
  <g transform="translate(120, 140)">
    <circle cx="15" cy="15" r="10" fill="#f59e0b"/>
    <path d="M5 30 L25 30 L20 50 L10 50 Z" fill="#38bdf8"/>
    <rect x="20" y="35" width="20" height="6" fill="#ec4899"/>
    <path d="M10 50 L5 70 M20 50 L25 70" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Soldier 3 (Jumping) -->
  <g transform="translate(180, 100)">
    <circle cx="15" cy="15" r="10" fill="#f59e0b"/>
    <path d="M5 30 L25 30 L20 50 L10 50 Z" fill="#10b981"/>
    <path d="M10 50 L5 60 M20 50 L25 60" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 30 L5 20 M15 30 L25 20" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="30" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="30" cy="50" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>