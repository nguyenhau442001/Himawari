<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow for contrast -->
  <circle cx="120" cy="120" r="80" fill="#2563EB" opacity="0.08" filter="blur(20px)"/>

  <!-- Visual Concept for "崭新" (Brand New / Pristine):
       Applying Adjective/Describing Word rule: Scale exaggeration and visual contrast.
       We contrast a worn-out, dull, faded old backpack (small, desaturated, bottom/background) 
       with a massive, hyper-vibrant, glowing-with-freshness "brand new" backpack (large, crisp, center stage) 
       emanating fresh sparkles to emphasize pristine condition. -->

  <!-- Faded/Old Backpack (Contrast element - smaller, muted colors) -->
  <g opacity="0.4" transform="translate(45, 110) scale(0.45)">
    <!-- Old backpack body -->
    <path d="M 40 40 Q 40 15 70 15 Q 100 15 100 40 L 105 100 Q 105 115 90 115 L 50 115 Q 35 115 35 100 Z" fill="#4B5563"/>
    <!-- Worn out patch/tear detail -->
    <path d="M 55 50 L 85 50 L 80 85 L 60 85 Z" fill="#374151"/>
    <!-- Dull straps -->
    <path d="M 45 15 L 30 100" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
    <path d="M 95 15 L 110 100" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Freshness indicators around the new backpack -->
  <g fill="#FBBF24">
    <!-- Top left sparkle -->
    <path d="M 65 65 Q 70 65 70 60 Q 70 65 75 65 Q 70 65 70 70 Q 70 65 65 65 Z" opacity="0.9"/>
    <!-- Top right sparkle -->
    <path d="M 175 55 Q 180 55 180 50 Q 180 55 185 55 Q 180 55 180 60 Q 180 55 175 55 Z" opacity="0.9"/>
    <!-- Sparkle dot -->
    <circle cx="160" cy="90" r="2.5" opacity="0.7"/>
    <circle cx="80" cy="115" r="2" opacity="0.6"/>
  </g>

  <!-- Brand New Backpack (Main Focus - Large scale, vibrant, crisp flat vector design) -->
  <g transform="translate(75, 45)">
    <!-- Hanging loop -->
    <path d="M 35 12 Q 45 2 55 12" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Main Backpack Body -->
    <path d="M 22 25 Q 22 10 45 10 Q 68 10 68 25 L 75 105 Q 75 120 58 120 L 32 120 Q 15 120 15 105 Z" fill="#3B82F6"/>
    
    <!-- Front Pocket -->
    <path d="M 23 60 L 67 60 L 64 105 Q 64 112 55 112 L 35 112 Q 26 112 26 105 Z" fill="#2563EB"/>
    
    <!-- Zipper details (Gold/Orange accent for high-contrast focus) -->
    <path d="M 25 38 L 65 38" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 28 80 L 62 80" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Zipper pulls -->
    <circle cx="45" cy="38" r="3.5" fill="#FBBF24"/>
    <circle cx="45" cy="80" r="3" fill="#FBBF24"/>

    <!-- Left Strap -->
    <path d="M 30 10 L 12 110" fill="none" stroke="#1D4ED8" stroke-width="10" stroke-linecap="round"/>
    <path d="M 30 10 L 12 110" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Strap -->
    <path d="M 60 10 L 78 110" fill="none" stroke="#1D4ED8" stroke-width="10" stroke-linecap="round"/>
    <path d="M 60 10 L 78 110" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Crisp highlight/gloss stripe on the body -->
    <path d="M 26 25 L 30 55" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Dynamic energy aura / Freshness rays under the main backpack -->
  <ellipse cx="120" cy="180" rx="45" ry="8" fill="#3B82F6" opacity="0.3"/>
  <ellipse cx="120" cy="183" rx="25" ry="4" fill="#60A5FA" opacity="0.5"/>

</svg>