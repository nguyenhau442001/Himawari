<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle tech grid background -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="30" x2="200" y2="30"/>
    <line x1="40" y1="70" x2="200" y2="70"/>
    <line x1="40" y1="110" x2="200" y2="110"/>
    <line x1="40" y1="150" x2="200" y2="150"/>
    <line x1="40" y1="190" x2="200" y2="190"/>
    <line x1="40" y1="30" x2="40" y2="190"/>
    <line x1="80" y1="30" x2="80" y2="190"/>
    <line x1="120" y1="30" x2="120" y2="190"/>
    <line x1="160" y1="30" x2="160" y2="190"/>
    <line x1="200" y1="30" x2="200" y2="190"/>
  </g>

  <!-- Central Physical Object: Advanced Microchip / High-Tech Processor (representing "高新技术" as a concrete physical core technology) -->
  <g transform="translate(120, 120)">
    <!-- Outer Glow / Halo -->
    <circle r="72" fill="#0EA5E9" opacity="0.1"/>
    <circle r="56" fill="#38BDF8" opacity="0.15"/>

    <!-- Circuit board traces background -->
    <path d="M-60 -30 L-30 -30 L-20 -20 L-20 -50" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <path d="M60 30 L30 30 L20 20 L20 50" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <path d="M-30 60 L-30 30 L-20 20 L-50 20" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <path d="M30 -60 L30 -30 L20 -20 L50 -20" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

    <!-- Chip Pins (Left & Right) -->
    <rect x="-50" y="-22" width="10" height="6" fill="#94A3B8" rx="1"/>
    <rect x="-50" y="-6" width="10" height="6" fill="#94A3B8" rx="1"/>
    <rect x="-50" y="10" width="10" height="6" fill="#94A3B8" rx="1"/>
    <rect x="-50" y="26" width="10" height="6" fill="#94A3B8" rx="1"/>

    <rect x="40" y="-22" width="10" height="6" fill="#94A3B8" rx="1"/>
    <rect x="40" y="-6" width="10" height="6" fill="#94A3B8" rx="1"/>
    <rect x="40" y="10" width="10" height="6" fill="#94A3B8" rx="1"/>
    <rect x="40" y="26" width="10" height="6" fill="#94A3B8" rx="1"/>

    <!-- Chip Pins (Top & Bottom) -->
    <rect x="-22" y="-50" width="6" height="10" fill="#94A3B8" rx="1"/>
    <rect x="-6" y="-50" width="6" height="10" fill="#94A3B8" rx="1"/>
    <rect x="10" y="-50" width="6" height="10" fill="#94A3B8" rx="1"/>
    <rect x="26" y="-50" width="6" height="10" fill="#94A3B8" rx="1"/>

    <rect x="-22" y="40" width="6" height="10" fill="#94A3B8" rx="1"/>
    <rect x="-6" y="40" width="6" height="10" fill="#94A3B8" rx="1"/>
    <rect x="10" y="40" width="6" height="10" fill="#94A3B8" rx="1"/>
    <rect x="26" y="40" width="6" height="10" fill="#94A3B8" rx="1"/>

    <!-- Main Chip Body -->
    <rect x="-40" y="-40" width="80" height="80" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>

    <!-- Inner Substrate Layer -->
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.5"/>

    <!-- Quantum / Core Processor Unit (Gold Accent for High-Tech) -->
    <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#111827" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#F59E0B"/>

    <!-- Circuit Paths inside Chip -->
    <path d="M-16 0 L-30 0" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M16 0 L30 0" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 -16 L0 -30" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 16 L0 30" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Accent Energy Nodes -->
    <circle cx="-30" cy="0" r="2" fill="#38BDF8"/>
    <circle cx="30" cy="0" r="2" fill="#38BDF8"/>
    <circle cx="0" cy="-30" r="2" fill="#38BDF8"/>
    <circle cx="0" cy="30" r="2" fill="#38BDF8"/>
  </g>
</svg>