<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric background details: Soft glowing clouds & dynamic sky -->
  <g opacity="0.3">
    <!-- Moon/Sky glow -->
    <circle cx="190" cy="60" r="30" fill="#38BDF8" opacity="0.15"/>
    
    <!-- Distant cloud shapes -->
    <path d="M30,70 Q40,60 55,70 Q70,60 85,75 Q95,70 100,85 L30,85 Z" fill="#334155" opacity="0.4"/>
    <path d="M150,180 Q160,170 175,180 Q190,170 205,185 L145,185 Z" fill="#334155" opacity="0.3"/>
  </g>

  <!-- Motion lines indicating upward/forward flight -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M60,150 L40,140"/>
    <path d="M80,175 L55,162"/>
    <path d="M45,120 L25,110"/>
  </g>

  <!-- Flock of birds (Pigeons in dynamic flying poses) translating the contextual sentence -->
  <!-- Bird 1 (Large foreground bird) -->
  <g transform="translate(110, 85) scale(1.2)">
    <!-- Wings up/gliding pose -->
    <path d="M 0,10 C -15,-10 -35,-20 -50,-15 C -35,-5 -20,5 0,15 C 20,5 35,-5 50,-15 C 35,-20 15,-10 0,10 Z" fill="#F8FAFC"/>
    <!-- Head & Tail -->
    <circle cx="0" cy="14" r="3.5" fill="#F8FAFC"/>
    <path d="M0,17 L0,26" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bird 2 (Medium upper right) -->
  <g transform="translate(170, 50) scale(0.8) rotate(15)">
    <path d="M 0,10 C -15,-10 -35,-20 -50,-15 C -35,-5 -20,5 0,15 C 20,5 35,-5 50,-15 C 35,-20 15,-10 0,10 Z" fill="#E2E8F0"/>
    <circle cx="0" cy="14" r="3.5" fill="#E2E8F0"/>
    <path d="M0,17 L0,25" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bird 3 (Small left background) -->
  <g transform="translate(65, 55) scale(0.6) rotate(-10)">
    <path d="M 0,10 C -15,-10 -35,-20 -50,-15 C -35,-5 -20,5 0,15 C 20,5 35,-5 50,-15 C 35,-20 15,-10 0,10 Z" fill="#94A3B8"/>
    <circle cx="0" cy="14" r="3.5" fill="#94A3B8"/>
  </g>

  <!-- Bird 4 (Lower background) -->
  <g transform="translate(145, 130) scale(0.7) rotate(5)">
    <path d="M 0,10 C -15,-10 -35,-20 -50,-15 C -35,-5 -20,5 0,15 C 20,5 35,-5 50,-15 C 35,-20 15,-10 0,10 Z" fill="#CBD5E1"/>
    <circle cx="0" cy="14" r="3.5" fill="#CBD5E1"/>
  </g>

  <!-- Central Dynamic Action Subject: A stylized paper plane / soaring motif emphasizing the verb "飞" (to fly / soar) with high-contrast accent color -->
  <g transform="translate(120, 140) rotate(-25)">
    <!-- Main wing -->
    <polygon points="0,-35 40,25 0,15" fill="#F59E0B"/>
    <!-- Shadow wing -->
    <polygon points="0,-35 -30,15 0,15" fill="#D97706"/>
    <!-- Fuselage center fold -->
    <polygon points="0,-35 0,35 0,15" fill="#FBBF24"/>
    
    <!-- Action/speed trail particles emanating from the soaring shape -->
    <circle cx="-25" cy="45" r="2" fill="#F59E0B" opacity="0.8"/>
    <circle cx="-40" cy="60" r="1.5" fill="#F59E0B" opacity="0.5"/>
  </g>

  <!-- Ground silhouette / Horizon hints (mountains or low hills) to anchor the open sky concept -->
  <path d="M0,220 Q60,205 120,215 Q180,225 240,210 L240,240 L0,240 Z" fill="#0F172A"/>

</svg>