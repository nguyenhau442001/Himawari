<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Train Track Lines (Perspective) -->
  <g opacity="0.3">
    <line x1="120" y1="110" x2="40" y2="210" stroke="#6272A4" stroke-width="2"/>
    <line x1="120" y1="110" x2="200" y2="210" stroke="#6272A4" stroke-width="2"/>
    <line x1="75" y1="160" x2="165" y2="160" stroke="#6272A4" stroke-width="2"/>
    <line x1="92" y1="185" x2="148" y2="185" stroke="#6272A4" stroke-width="2"/>
  </g>

  <!-- Platform Base -->
  <rect x="20" y="195" width="200" height="15" rx="4" fill="#4B5563"/>
  <!-- Platform Edge Highlight -->
  <rect x="20" y="195" width="200" height="4" rx="2" fill="#F59E0B"/>

  <!-- Modern Train Station Shelter Structure -->
  <!-- Support Pillars -->
  <rect x="35" y="80" width="10" height="115" rx="3" fill="#9CA3AF"/>
  <rect x="195" y="80" width="10" height="115" rx="3" fill="#9CA3AF"/>

  <!-- Curved Roof / Canopy -->
  <path d="M 20 85 Q 120 50 220 85 L 210 70 Q 120 40 30 70 Z" fill="#3B82F6"/>
  <path d="M 30 70 Q 120 40 210 70 L 210 80 Q 120 50 30 80 Z" fill="#60A5FA"/>

  <!-- Station Sign / Display Board (representing "站" - stop/station) -->
  <rect x="90" y="85" width="60" height="30" rx="4" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
  <!-- Icon on Sign: Train front silhouette -->
  <path d="M 110 95 L 130 95 L 133 105 L 107 105 Z" fill="#F59E0B"/>
  <circle cx="114" cy="109" r="2" fill="#F59E0B"/>
  <circle cx="126" cy="109" r="2" fill="#F59E0B"/>

  <!-- Waiting Passenger (Person standing at the station) -->
  <g transform="translate(105, 125)">
    <!-- Head -->
    <circle cx="15" cy="12" r="8" fill="#FBBF24"/>
    <!-- Body / Coat -->
    <path d="M 8 24 Q 15 22 22 24 L 25 50 L 5 50 Z" fill="#EC4899"/>
    <!-- Legs -->
    <rect x="9" y="50" width="4" height="20" rx="2" fill="#1F2937"/>
    <rect x="17" y="50" width="4" height="20" rx="2" fill="#1F2937"/>
  </g>

  <!-- Secondary Passenger for depth -->
  <g transform="translate(150, 135)" opacity="0.7">
    <!-- Head -->
    <circle cx="12" cy="10" r="7" fill="#93C5FD"/>
    <!-- Body -->
    <path d="M 6 20 Q 12 18 18 20 L 20 45 L 4 45 Z" fill="#6366F1"/>
    <!-- Legs -->
    <rect x="8" y="45" width="3" height="15" rx="1.5" fill="#1F2937"/>
    <rect x="13" y="45" width="3" height="15" rx="1.5" fill="#1F2937"/>
  </g>

  <!-- Ambient Accent Lighting / Glow on Platform -->
  <circle cx="120" cy="195" r="40" fill="#F59E0B" opacity="0.15" filter="blur(8px)"/>
</svg>