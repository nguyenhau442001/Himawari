<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main ticket body -->
  <rect x="40" y="70" width="160" height="100" rx="8" fill="#F0F0F0"/>
  
  <!-- Perforation line (dashed) -->
  <line x1="140" y1="70" x2="140" y2="170" stroke="#FFB74D" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Left side (larger part of ticket) -->
  <!-- Abstract barcode lines -->
  <rect x="55" y="85" width="60" height="4" fill="#333333"/>
  <rect x="55" y="95" width="50" height="4" fill="#333333"/>
  <rect x="55" y="105" width="65" height="4" fill="#333333"/>
  <rect x="55" y="115" width="55" height="4" fill="#333333"/>
  <rect x="55" y="125" width="60" height="4" fill="#333333"/>
  <rect x="55" y="135" width="50" height="4" fill="#333333"/>
  <rect x="55" y="145" width="65" height="4" fill="#333333"/>
  
  <!-- Right side (stub part) -->
  <!-- Abstract event/venue placeholder (a simple star) -->
  <path d="M170 110 L175 120 L165 120 L170 110 Z" fill="#FFA000"/>
  <path d="M170 110 L165 100 L175 100 L170 110 Z" fill="#FFA000"/>
  <path d="M170 110 L160 105 L180 105 L170 110 Z" fill="#FFA000"/>
  
  <!-- Abstract ticket number placeholder -->
  <rect x="155" y="135" width="30" height="4" fill="#333333"/>
  <rect x="155" y="145" width="20" height="4" fill="#333333"/>
</svg>