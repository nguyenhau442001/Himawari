<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Soft glow filter for the causal spark -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient lighting/atmosphere representing a rainy dark context -->
  <g opacity="0.3">
    <!-- Subtle rain streaks in background -->
    <line x1="40" y1="30" x2="30" y2="70" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="90" y1="20" x2="80" y2="60" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="40" x2="150" y2="80" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="210" y1="25" x2="200" y2="65" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Visual Metaphor for Causality / "Because of..." (因为) -->
  <!-- We use a balanced, elegant domino/block progression and a central focal energy link -->
  
  <!-- Ground plane line -->
  <line x1="36" y1="180" x2="204" y2="180" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>

  <!-- EFFECT BLOCK (Right side: "we didn't go out") -->
  <g transform="translate(145, 120)">
    <!-- Shadow -->
    <ellipse cx="20" cy="62" rx="22" ry="5" fill="#111318"/>
    <!-- Main Block falling/tilted slightly to show consequence -->
    <rect x="0" y="10" width="40" height="50" rx="6" fill="#3B82F6"/>
    <!-- Inner detail: stylized indoor shelter / house roof symbol -->
    <path d="M10 32 L20 22 L30 32" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="14" y="32" width="12" height="20" fill="#93C5FD" rx="2"/>
  </g>

  <!-- CAUSE BLOCK (Left side: "it's raining") -->
  <g transform="translate(55, 110)">
    <!-- Shadow -->
    <ellipse cx="20" cy="72" rx="22" ry="5" fill="#111318"/>
    <!-- Main Block standing firm -->
    <rect x="0" y="20" width="40" height="50" rx="6" fill="#F59E0B"/>
    <!-- Inner detail: stylized cloud & rain symbol -->
    <path d="M12 42 C12 38 16 35 20 35 C24 35 28 38 28 42" stroke="#FEF3C7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <line x1="16" y1="47" x2="14" y2="53" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="47" x2="22" y2="53" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CAUSAL LINK / TRIGGER BRIDGE (The "Because -> Therefore" mechanism) -->
  <!-- Sleek modern curve connecting cause to effect with a glowing transition point -->
  <path d="M 95 140 Q 120 100 145 140" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Central Focal Energy / Spark (The semantic core of "Because") -->
  <g transform="translate(120, 115)" filter="url(#glow)">
    <!-- Outer accent ring -->
    <circle cx="0" cy="0" r="16" fill="#F59E0B" opacity="0.2"/>
    <!-- Inner bright node -->
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
    <!-- Core dot -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    
    <!-- Directional Energy Arrows pointing forward (Causality flow) -->
    <path d="M -4 -1 L 2 -1 L -1 -4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating particles emphasizing abstract grammatical connection -->
  <circle cx="95" cy="85" r="3" fill="#3B82F6" opacity="0.8"/>
  <circle cx="145" cy="85" r="2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="120" cy="70" r="2.5" fill="#10B981" opacity="0.8"/>

</svg>