<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bookshelf structure representing "书架" -->
  <g>
    <!-- Shelf Back Panel / Shadow -->
    <rect x="36" y="50" width="168" height="140" rx="4" fill="#222730"/>
    
    <!-- Shelf Boards (Top, Middle, Bottom) -->
    <rect x="30" y="45" width="180" height="8" rx="2" fill="#384152"/>
    <rect x="30" y="115" width="180" height="8" rx="2" fill="#384152"/>
    <rect x="30" y="185" width="180" height="8" rx="2" fill="#384152"/>
  </g>

  <!-- Books on Middle and Bottom Shelves (Context) -->
  <g opacity="0.5">
    <!-- Middle Shelf Books -->
    <rect x="46" y="70" width="14" height="45" rx="2" fill="#4F5D75"/>
    <rect x="62" y="65" width="18" height="50" rx="2" fill="#2E6930"/>
    <rect x="82" y="75" width="12" height="40" rx="2" fill="#8C3F3F"/>
    
    <!-- Bottom Shelf Books -->
    <rect x="46" y="140" width="16" height="45" rx="2" fill="#D97706"/>
    <rect x="64" y="135" width="22" height="50" rx="2" fill="#1D4ED8"/>
    <rect x="88" y="145" width="14" height="40" rx="2" fill="#6B21A8"/>
    <rect x="156" y="140" width="18" height="45" rx="2" fill="#047857"/>
    <rect x="176" y="148" width="14" height="37" rx="2" fill="#B91C1C"/>
  </g>

  <!-- FOCUS TARGET: "上面" - Prominently highlighted classic literary books precisely placed ON TOP OF the top shelf -->
  <g>
    <!-- Drop shadow for books on top -->
    <ellipse cx="120" cy="45" rx="55" ry="4" fill="#000000" opacity="0.4"/>

    <!-- Book 1 (Standing upright, classic red/gold theme) -->
    <rect x="95" y="12" width="20" height="33" rx="2" fill="#EF4444"/>
    <rect x="98" y="16" width="14" height="3" rx="1" fill="#FBBF24"/>
    <rect x="98" y="22" width="14" height="18" rx="1" fill="#991B1B"/>

    <!-- Book 2 (Leaning slightly against Book 1, deep blue/gold theme) -->
    <path d="M 115 15 L 133 15 L 133 45 L 115 45 Z" fill="#3B82F6"/>
    <rect x="119" y="19" width="10" height="3" rx="1" fill="#FBBF24"/>
    <rect x="119" y="25" width="10" height="15" rx="1" fill="#1E3A8A"/>

    <!-- Book 3 (Laying flat at the base of the standing books) -->
    <rect x="135" y="37" width="36" height="8" rx="2" fill="#10B981"/>
    <rect x="138" y="39" width="6" height="4" rx="1" fill="#FBBF24"/>
  </g>

  <!-- Visual Indicator (Orange/Gold focus accents pointing to the EXACT position: "上面") -->
  <g>
    <!-- Top bracket indicator -->
    <path d="M 75 22 L 68 22 L 68 38 L 75 38" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 22 L 172 22 L 172 38 L 165 38" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Upward directional indicator arrows showing "shàng" (above/on top) -->
    <path d="M 120 7 L 120 2" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 117 5 L 120 1 L 123 5" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>