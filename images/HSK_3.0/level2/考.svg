<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="80" fill="#2563EB" opacity="0.1" filter="blur(20px)"/>

  <!-- Central Physical Object: Examination Paper / Test Sheet with Pencil (Noun representation of 考 / Thi, kiểm tra) -->
  <g transform="translate(0, 5)">
    <!-- Clipboard / Base board -->
    <rect x="68" y="38" width="104" height="136" rx="8" fill="#334155" />
    
    <!-- Metal Clip at Top -->
    <rect x="96" y="32" width="48" height="14" rx="4" fill="#94A3B8" />
    <rect x="104" y="36" width="32" height="6" rx="2" fill="#64748B" />

    <!-- Exam Paper Sheet -->
    <rect x="76" y="52" width="88" height="114" rx="4" fill="#F8FAFC" />

    <!-- Header lines / Title simulation -->
    <rect x="92" y="66" width="56" height="6" rx="3" fill="#CBD5E1" />

    <!-- Question lines -->
    <!-- Q1 -->
    <circle cx="88" cy="88" r="3" fill="#EF4444" />
    <rect x="96" y="86" width="44" height="4" rx="2" fill="#E2E8F0" />
    <!-- Options (Radio buttons) -->
    <circle cx="92" cy="102" r="3.5" fill="none" stroke="#94A3B8" stroke-width="2" />
    <circle cx="92" cy="102" r="1.5" fill="#2563EB" /> <!-- Selected answer -->
    <rect x="102" y="100" width="36" height="4" rx="2" fill="#E2E8F0" />

    <circle cx="92" cy="116" r="3.5" fill="none" stroke="#94A3B8" stroke-width="2" />
    <rect x="102" y="114" width="28" height="4" rx="2" fill="#E2E8F0" />

    <!-- Q2 -->
    <circle cx="88" cy="136" r="3" fill="#EF4444" />
    <rect x="96" y="134" width="52" height="4" rx="2" fill="#E2E8F0" />
    
    <circle cx="92" cy="150" r="3.5" fill="none" stroke="#94A3B8" stroke-width="2" />
    <rect x="102" y="148" width="40" height="4" rx="2" fill="#E2E8F0" />

    <!-- Red Grade Stamp (Badge of Evaluation / Score) -->
    <g transform="translate(132, 110) rotate(-12)">
      <circle cx="16" cy="16" r="16" fill="none" stroke="#DC2626" stroke-width="3" />
      <text x="16" y="22" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#DC2626" text-anchor="middle">A+</text>
    </g>

    <!-- Professional Modern Pencil resting on the paper -->
    <g transform="translate(130, 115) rotate(45)">
      <!-- Eraser metal band -->
      <rect x="-4" y="-55" width="24" height="8" rx="2" fill="#94A3B8" />
      <!-- Pink Eraser -->
      <rect x="-4" y="-65" width="24" height="10" rx="3" fill="#F472B6" />
      <!-- Pencil Body (Hexagonal look represented with split tones) -->
      <rect x="-4" y="-47" width="12" height="70" fill="#FBBF24" />
      <rect x="8" y="-47" width="12" height="70" fill="#F59E0B" />
      <!-- Wooden Tip -->
      <polygon points="-4,23 20,23 8,37" fill="#FDE68A" />
      <!-- Graphite Lead -->
      <polygon points="5,33 11,33 8,39" fill="#334155" />
    </g>
  </g>
</svg>