<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative steam lines (representing hot noodles) -->
  <path d="M96 64 C92 56, 100 48, 96 40" stroke="#4A5568" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M120 60 C124 52, 116 44, 120 36" stroke="#4A5568" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M144 64 C140 56, 148 48, 144 40" stroke="#4A5568" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Chopsticks -->
  <g transform="rotate(-15 170 85)">
    <line x1="170" y1="45" x2="170" y2="135" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="170" cy="45" r="1.75" fill="#F6AD55"/>
  </g>
  <g transform="rotate(10 155 90)">
    <line x1="155" y1="50" x2="155" y2="140" stroke="#CBD5E0" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="155" cy="50" r="1.75" fill="#F6AD55"/>
  </g>

  <!-- Bowl Outer Shadow / Base -->
  <ellipse cx="120" cy="180" rx="60" ry="12" fill="#111318"/>

  <!-- Bowl Back Rim (Interior) -->
  <ellipse cx="120" cy="115" rx="75" ry="22" fill="#2D3748"/>

  <!-- Bowl Body -->
  <path d="M 45 115 C 45 155, 75 180, 120 180 C 165 180, 195 155, 195 115 Z" fill="#E2E8F0"/>
  <path d="M 48 115 C 48 152, 77 177, 120 177 C 163 177, 192 152, 192 115 Z" fill="#EDF2F7"/>

  <!-- Bowl Front Rim (Thickness) -->
  <path d="M 45 115 C 45 125, 75 137, 120 137 C 165 137, 195 125, 195 115 C 195 105, 165 93, 120 93 C 75 93, 45 105, 45 115 Z" fill="#CBD5E0"/>

  <!-- Bowl Inner Soup/Broth -->
  <ellipse cx="120" cy="118" rx="70" ry="18" fill="#DD6B20"/>
  <ellipse cx="120" cy="118" rx="66" ry="16" fill="#ED8936"/>

  <!-- Noodles (Wavy strands inside bowl) -->
  <path d="M 75 116 Q 85 105, 95 118 T 115 116 T 135 118 T 155 116 T 165 118" stroke="#F6AD55" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 80 122 Q 92 112, 104 124 T 128 122 T 152 124" stroke="#FEEBC8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 70 120 Q 82 130, 94 118 T 118 120 T 142 118 T 166 120" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Toppings: Green onions / Scallions -->
  <circle cx="100" cy="112" r="3" fill="#48BB78"/>
  <circle cx="105" cy="115" r="2.5" fill="#38A169"/>
  <circle cx="140" cy="114" r="3" fill="#48BB78"/>
  <circle cx="145" cy="118" r="2.5" fill="#38A169"/>
  <circle cx="125" cy="122" r="3" fill="#48BB78"/>

  <!-- Toppings: Halved Boiled Egg -->
  <g transform="translate(110, 102)">
    <!-- Egg White -->
    <ellipse cx="15" cy="12" rx="14" ry="10" fill="#FFFFFF"/>
    <ellipse cx="15" cy="12" rx="14" ry="10" stroke="#E2E8F0" stroke-width="1" fill="none"/>
    <!-- Egg Yolk -->
    <circle cx="15" cy="12" r="6" fill="#ECC94B"/>
    <circle cx="14" cy="11" r="2" fill="#FAF089"/>
  </g>
</svg>