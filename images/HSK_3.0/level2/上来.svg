<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural environment: Two-level building interior/exterior section -->
  <!-- Ground floor / background elements -->
  <rect x="30" y="190" width="180" height="8" rx="4" fill="#2E3440"/>
  
  <!-- Second floor platform -->
  <path d="M 30 115 L 210 115 L 210 125 L 30 125 Z" fill="#2E3440"/>
  <rect x="30" y="110" width="180" height="5" rx="2.5" fill="#3B4252"/>
  
  <!-- Stairs leading from ground to second floor -->
  <g fill="#434C5E">
    <polygon points="40,190 70,190 70,182 40,190"/>
    <rect x="40" y="182" width="30" height="6" fill="#4C566A"/>
    <rect x="45" y="176" width="30" height="6" fill="#434C5E"/>
    <rect x="50" y="170" width="30" height="6" fill="#4C566A"/>
    <rect x="55" y="164" width="30" height="6" fill="#434C5E"/>
    <rect x="60" y="158" width="30" height="6" fill="#4C566A"/>
    <rect x="65" y="152" width="30" height="6" fill="#434C5E"/>
    <rect x="70" y="146" width="30" height="6" fill="#4C566A"/>
    <rect x="75" y="140" width="30" height="6" fill="#434C5E"/>
    <rect x="80" y="134" width="30" height="6" fill="#4C566A"/>
    <rect x="85" y="128" width="30" height="6" fill="#434C5E"/>
    <rect x="90" y="122" width="30" height="6" fill="#4C566A"/>
  </g>

  <!-- Motion trajectory arc showing upward movement onto the second floor (上来) -->
  <path d="M 55 170 Q 75 130 110 95" fill="none" stroke="#EBCB8B" stroke-width="3" stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Arrowhead pointing up and onto the second floor -->
  <path d="M 102 92 L 113 93 L 109 104 Z" fill="#EBCB8B"/>

  <!-- Teacher on the second floor, waving -->
  <g transform="translate(145, 60)">
    <!-- Teacher body -->
    <rect x="15" y="25" width="20" height="30" rx="6" fill="#5E81AC"/>
    <!-- Teacher head -->
    <circle cx="25" cy="15" r="9" fill="#ECEFF4"/>
    <!-- Teacher hair -->
    <path d="M 16 14 Q 25 5 34 14 Z" fill="#D08770"/>
    <!-- Teacher waving arm -->
    <path d="M 25 30 L 38 18" stroke="#ECEFF4" stroke-width="4" stroke-linecap="round"/>
    <!-- Waving hand -->
    <circle cx="41" cy="16" r="3.5" fill="#ECEFF4"/>
    <!-- Other arm -->
    <path d="M 25 30 L 15 42" stroke="#ECEFF4" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="18" y="53" width="5" height="15" rx="2.5" fill="#2E3440"/>
    <rect x="27" y="53" width="5" height="15" rx="2.5" fill="#2E3440"/>
  </g>

  <!-- Character moving up the stairs (上来 - coming up) -->
  <g transform="translate(68, 112)">
    <!-- Character body leaning forward slightly for climbing -->
    <rect x="10" y="12" width="18" height="26" rx="5" fill="#D08770" transform="rotate(-15 19 25)"/>
    <!-- Head -->
    <circle cx="12" cy="4" r="8" fill="#ECEFF4"/>
    <!-- Hair -->
    <path d="M 5 4 Q 12 -4 18 4 Z" fill="#81A1C1"/>
    <!-- Front arm reaching upward -->
    <path d="M 20 20 L 30 12" stroke="#ECEFF4" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Back arm -->
    <path d="M 12 22 L 5 30" stroke="#ECEFF4" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Legs climbing steps -->
    <path d="M 14 36 L 22 46" stroke="#4C566A" stroke-width="4" stroke-linecap="round"/>
    <path d="M 18 36 L 10 44" stroke="#4C566A" stroke-width="4" stroke-linecap="round"/>
  </g>

</svg>