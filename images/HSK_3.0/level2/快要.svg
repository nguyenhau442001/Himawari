  <!-- Main physical object: An iconic, unmistakable yellow weather umbrella (umbrella as a noun/item about to be used) -->
  <g>
    <!-- Umbrella Canopy -->
    <path d="M 120 80 C 170 80 200 120 205 135 C 190 132 150 128 120 128 C 90 128 50 132 35 135 C 40 120 70 80 120 80 Z" fill="#F39C12"/>
    
    <!-- Umbrella panels shading for depth -->
    <path d="M 120 80 C 140 80 165 100 172 133 C 150 129 130 128 120 128 Z" fill="#D68910" opacity="0.4"/>
    <path d="M 120 80 C 100 80 75 100 68 133 C 90 129 110 128 120 128 Z" fill="#F1C40F" opacity="0.3"/>

    <!-- Umbrella Shaft -->
    <rect x="118" y="128" width="4" height="62" rx="2" fill="#BDC3C7"/>

    <!-- Umbrella Handle -->
    <path d="M 120 190 C 120 198 112 198 112 190 L 112 185" fill="none" stroke="#BDC3C7" stroke-width="4" stroke-linecap="round"/>

    <!-- Raindrops starting to fall (imminent downpour - "快要下大雨了") -->
    <g fill="#3498DB">
      <path d="M 75 145 C 75 145 72 152 72 155 C 72 157 74 159 76 159 C 78 159 80 157 80 155 C 80 152 75 145 75 145 Z"/>
      <path d="M 165 155 C 165 155 162 162 162 165 C 162 167 164 169 166 169 C 168 169 170 167 170 165 C 170 162 165 155 165 155 Z"/>
      <path d="M 95 175 C 95 175 92 182 92 185 C 92 187 94 189 96 189 C 98 189 100 187 100 185 C 100 182 95 175 95 175 Z"/>
      <path d="M 145 180 C 145 180 142 187 142 190 C 142 192 144 194 146 194 C 148 194 150 192 150 190 C 150 187 145 180 145 180 Z"/>
    </g>
  </g>
</svg>