<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Dark atmospheric background elements representing stormy sky (乌云密布) -->
  <g opacity="0.6">
    <path d="M 50 75 C 50 64 59 55 70 55 C 75 55 80 57 84 60 C 90 52 100 48 110 50 C 121 52 129 61 130 72 C 135 72 140 76 142 81 C 145 80 148 80 150 82 C 158 82 165 89 165 97 C 165 105 158 112 150 112 L 50 112 C 41 112 35 105 35 97 C 35 89 41 82 50 75 Z" fill="#2C3545"/>
    <path d="M 120 90 C 120 81 127 74 136 74 C 140 74 144 76 148 78 C 153 71 161 68 170 70 C 179 72 185 80 186 89 C 190 89 195 92 197 96 C 199 95 202 95 204 97 C 210 97 215 103 215 110 C 215 117 210 123 204 123 L 120 123 C 113 123 108 117 108 110 C 108 103 113 97 120 90 Z" fill="#242B38"/>
