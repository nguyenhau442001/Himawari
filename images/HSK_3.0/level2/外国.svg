<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Globe representing the world -->
  <circle cx="120" cy="120" r="60" fill="#2C3E50" stroke="#FFB84D" stroke-width="2"/>
  <path d="M60 120 C 60 86.86 86.86 60 120 60 C 153.14 60 180 86.86 180 120 C 180 153.14 153.14 180 120 180 C 86.86 180 60 153.14 60 120" fill="none" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Stylized Continent/Landmass -->
  <path d="M100 90 C 110 80, 130 80, 140 100 C 150 120, 130 130, 120 140 C 110 130, 90 110, 100 90 Z" fill="#FFB84D"/>
  
  <!-- Person representing the "Foreigner" (Client) -->
  <g transform="translate(120, 120)">
    <circle cx="40" cy="-40" r="15" fill="#FFB84D"/>
    <path d="M25 -25 L55 -25 C 55 -10, 25 -10, 25 -25" fill="#FFB84D"/>
    <path d="M30 -10 L30 10 M50 -10 L50 10" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Interaction: Handshake icon representing business/contact -->
  <path d="M90 150 L110 130" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 140 L120 120" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="115" cy="125" r="5" fill="#FFFFFF"/>
  <circle cx="95" cy="145" r="5" fill="#FFFFFF"/>
</svg>