<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines indicating movement towards the viewer -->
  <path d="M180 160 C 160 140, 140 130, 120 130" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  <path d="M190 170 C 170 150, 150 140, 130 140" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
  
  <!-- Character body -->
  <g transform="translate(140, 120)">
    <circle cx="20" cy="20" r="12" fill="#E0E0E0"/>
    <path d="M20 32 L20 70 M20 40 L5 55 M20 40 L35 55" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Arms holding the tray -->
    <path d="M10 45 L-10 55" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 45 L50 55" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Tray -->
    <rect x="-15" y="52" width="40" height="4" rx="2" fill="#A0A0A0"/>
    
    <!-- Fruit on tray -->
    <circle cx="-5" cy="45" r="5" fill="#FF6B6B"/>
    <circle cx="5" cy="45" r="5" fill="#FFD93D"/>
    <circle cx="15" cy="45" r="5" fill="#6BCB77"/>
  </g>
  
  <!-- Perspective floor line -->
  <path d="M0 190 L240 190" stroke="#343A46" stroke-width="2"/>
</svg>