<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Background Grid / Contrast Path Elements -->
  <path d="M40 120 L120 120 L200 120" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Left Path (Rain / Obstacle - Dimmed / Gray tone) -->
  <g opacity="0.4">
    <!-- Rain drops -->
    <line x1="60" y1="75" x2="55" y2="90" stroke="#636E85" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="70" x2="80" y2="85" stroke="#636E85" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Cloud -->
    <path d="M50 75 C50 67 57 60 65 60 C70 60 74 63 77 67 C80 65 85 66 88 70 C92 70 95 73 95 77 C95 81 92 84 88 84 L52 84 C50 84 50 80 50 75 Z" fill="#636E85"/>
  </g>

  <!-- Central Pivot / Divergence Point -->
  <circle cx="120" cy="120" r="16" fill="#252A37" stroke="#3A4255" stroke-width="2"/>
  
  <!-- Contrast / Pivot Icon (The "Turn" / "However" junction) -->
  <path d="M112 120 L128 120 M120 112 L128 120 L120 128" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Path (Action / Continuation - Vibrant Gold/Orange Accent) -->
  <g>
    <!-- Motion / Forward Path Line -->
    <path d="M136 120 C160 120, 170 90, 195 90" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Walking Character / Continuing Journey Symbol -->
    <!-- Head -->
    <circle cx="195" cy="74" r="7" fill="#F59E0B"/>
    
    <!-- Body & Limbs in motion -->
    <path d="M195 81 L193 98 M193 88 L184 95 M193 88 L202 93 M193 98 L188 110 M193 98 L200 108" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Small bright destination marker / goal -->
    <circle cx="210" cy="90" r="3" fill="#10B981"/>
    <path d="M208 90 L210 92 L213 88" fill="none" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left Side Origin Character (Stopped or Under Rain) -->
  <g opacity="0.5">
    <!-- Umbrella -->
    <path d="M55 95 C55 85 75 85 75 95 Z" fill="#3B82F6"/>
    <path d="M65 95 L65 110" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <!-- Person -->
    <circle cx="65" cy="102" r="5" fill="#8B9BB4"/>
    <path d="M65 107 L65 120 M65 112 L58 118 M65 112 L72 118 M65 120 L61 132 M65 120 L69 132" stroke="#8B9BB4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Semantic Contrast Balance Scales or Dynamic Shift Visual Indicator at Top Center -->
  <path d="M105 50 L120 40 L135 50" fill="none" stroke="#636E85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>