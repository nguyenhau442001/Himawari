<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Stadium field lines subtle glow) -->
  <path d="M40 190 L200 190" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="140" r="70" fill="none" stroke="#252A34" stroke-width="1.5" opacity="0.6"/>

  <!-- Motion lines for the kick -->
  <path d="M70 150 Q90 135 110 130" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M75 165 Q95 150 115 145" fill="none" stroke="#FFA726" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M145 105 Q170 70 195 50" fill="none" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Soccer Ball -->
  <g transform="translate(130, 115)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF"/>
    <!-- Central pentagon -->
    <polygon points="0,-7 6,-3 4,4 -4,4 -6,-3" fill="#263238"/>
    <!-- Connecting lines/panels -->
    <line x1="0" y1="-7" x2="0" y2="-22" stroke="#263238" stroke-width="2.5"/>
    <line x1="6" y1="-3" x2="18" y2="-10" stroke="#263238" stroke-width="2.5"/>
    <line x1="4" y1="4" x2="15" y2="14" stroke="#263238" stroke-width="2.5"/>
    <line x1="-4" y1="4" x2="-15" y2="14" stroke="#263238" stroke-width="2.5"/>
    <line x1="-6" y1="-3" x2="-18" y2="-10" stroke="#263238" stroke-width="2.5"/>
    <!-- Ball shadow/glow -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#E0E0E0" stroke-width="1"/>
  </g>

  <!-- Kicking Foot & Leg -->
  <g>
    <!-- Lower leg / shin (angled upward-right for the kick) -->
    <path d="M75 160 L115 125" stroke="#FFA726" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Foot (shoe dynamically striking the ball) -->
    <path d="M105 125 C115 118 135 118 142 125 C146 129 143 138 135 142 C120 148 110 142 105 125 Z" fill="#FF7043"/>
    
    <!-- Shoe sole accent -->
    <path d="M110 133 L135 133" stroke="#D84315" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ground Shadow under player stance -->
  <ellipse cx="75" cy="190" rx="25" ry="6" fill="#111317" opacity="0.6"/>
</svg>