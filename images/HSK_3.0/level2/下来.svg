<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Window Frame -->
  <rect x="60" y="40" width="120" height="160" rx="4" fill="#2D343E" stroke="#4A5568" stroke-width="2"/>
  <line x1="120" y1="40" x2="120" y2="200" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Curtain (Partially lowered) -->
  <rect x="62" y="42" width="116" height="80" rx="2" fill="#FFB347"/>
  
  <!-- Motion lines for downward action -->
  <path d="M120 130 L120 150 M120 155 L120 165" stroke="#FFB347" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Human Hand interacting with curtain -->
  <g>
    <path d="M110 120 L130 120 L125 135 L115 135 Z" fill="#FFD700"/>
    <circle cx="120" cy="115" r="8" fill="#FFD700"/>
  </g>
  
  <!-- Arm reaching up -->
  <rect x="115" y="135" width="10" height="40" rx="2" fill="#FFD700"/>
</svg>