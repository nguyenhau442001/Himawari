<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing/Focus Backdrop -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.8"/>

  <!-- Broken Egg Illustration representing "里面" (Inside the eggshell) -->
  <g transform="translate(0, 5)">
    <!-- Back Egg Shell (Outer) -->
    <path d="M 75 100 
             C 75 70, 95 60, 120 60 
             C 145 60, 165 70, 165 100 
             L 165 155 
             C 165 175, 145 180, 120 180 
             C 95 180, 75 175, 75 155 Z" 
          fill="#323846"/>

    <!-- Egg Yolk (Inside) -->
    <circle cx="120" cy="130" r="28" fill="#F59E0B"/>
    <circle cx="112" cy="122" r="8" fill="#FBBF24" opacity="0.6"/>

    <!-- The Membrane ("里面有一层膜") - glowing delicate inner layer -->
    <path d="M 80 105 
             C 80 80, 98 70, 120 70 
             C 142 70, 160 80, 160 105 
             L 160 150 
             C 160 168, 142 172, 120 172 
             C 98 172, 80 168, 80 150 Z" 
          fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.9" stroke-dasharray="4 2"/>

    <!-- Front Egg Shell (Cut away / Cracked open effect) -->
    <path d="M 70 120 
             L 85 135 
             L 100 125 
             L 115 140 
             L 135 125 
             L 150 140 
             L 170 120 
             L 170 165 
             C 170 185, 150 190, 120 190 
             C 90 190, 70 185, 70 165 Z" 
          fill="#475569"/>

    <!-- Focus / Magnifying indicator lines pointing inward -->
    <path d="M 120 40 L 120 52" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="35" r="3" fill="#F59E0B"/>
  </g>
</svg>