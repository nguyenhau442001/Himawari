<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle dynamic streaks representing haste/motion -->
  <g opacity="0.15" stroke="#FFA726" stroke-linecap="round" stroke-width="2">
    <line x1="30" y1="90" x2="90" y2="90" />
    <line x1="20" y1="120" x2="110" y2="120" />
    <line x1="40" y1="150" x2="80" y2="150" />
  </g>

  <!-- Speed/Motion lines following the runner -->
  <g opacity="0.3" stroke="#FFF" stroke-linecap="round" stroke-width="2">
    <path d="M 60 100 L 30 105" />
    <path d="M 50 130 L 15 138" />
    <path d="M 70 160 L 40 168" />
  </g>

  <!-- Ground Line -->
  <line x1="30" y1="185" x2="210" y2="185" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Running Character (Flat Modern Vector Style) -->
  <g transform="translate(25, 0)">
    <!-- Back Leg (extended backward) -->
    <path d="M 95 130 L 60 165 L 45 155" fill="none" stroke="#FFA726" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back Foot -->
    <path d="M 45 155 L 35 158" fill="none" stroke="#FFA726" stroke-width="6" stroke-linecap="round"/>

    <!-- Back Arm (swinging back) -->
    <path d="M 105 95 L 75 110" fill="none" stroke="#F68B1E" stroke-width="7" stroke-linecap="round"/>

    <!-- Torso (leaning forward dynamically) -->
    <path d="M 90 85 L 110 135" fill="none" stroke="#FFB74D" stroke-width="14" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="125" cy="70" r="14" fill="#FFE0B2"/>
    <!-- Hair / motion hair strand -->
    <path d="M 115 63 C 115 58 122 55 130 58" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

    <!-- Front Arm (swinging forward, bent) -->
    <path d="M 110 90 L 135 105 L 125 125" fill="none" stroke="#FFA726" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front Leg (lifting up forward) -->
    <path d="M 105 130 L 135 150 L 155 135" fill="none" stroke="#FFB74D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Foot -->
    <path d="M 155 135 L 168 132" fill="none" stroke="#FFB74D" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Additional forward wind/motion gusts -->
  <path d="M 170 80 C 185 80 190 75 200 75" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 185 115 C 195 115 205 110 215 110" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 160 145 C 175 145 185 140 195 140" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

</svg>