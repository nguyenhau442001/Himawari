<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow -->
  <circle cx="120" cy="120" r="70" fill="#FF7800" opacity="0.08"/>

  <!-- Basketball Vector Illustration -->
  <g transform="translate(120, 120)">
    <!-- Ball Base (Orange Circle) -->
    <circle cx="0" cy="0" r="64" fill="#FF6B00"/>
    
    <!-- Ball Shading / Depth (Clip path for inner ball details) -->
    <clipPath id="ball-clip">
      <circle cx="0" cy="0" r="64"/>
    </clipPath>
    
    <g clip-path="url(#ball-clip)">
      <!-- Right shadow gradient/overlay for depth -->
      <path d="M 0,-64 A 64,64 0 0,1 64,0 A 64,64 0 0,1 0,64 Z" fill="#E05500" opacity="0.35"/>
      
      <!-- Basketball Seams (Black/Dark Brown Curved Lines) -->
      <!-- Center vertical line -->
      <path d="M 0,-64 C 0,-20 0,20 0,64" fill="none" stroke="#1A1D24" stroke-width="4.5" stroke-linecap="round"/>
      
      <!-- Center horizontal line -->
      <path d="M -64,0 C -20,0 20,0 64,0" fill="none" stroke="#1A1D24" stroke-width="4.5" stroke-linecap="round"/>
      
      <!-- Left curved seam -->
      <path d="M -32,-55 C -5,-20 -5,20 -32,55" fill="none" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Right curved seam -->
      <path d="M 32,-55 C 5,-20 5,20 32,55" fill="none" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Glossy Highlight / Reflection -->
    <path d="M -35,-35 C -20,-50 0,-52 25,-45 C 10,-58 -20,-55 -35,-35 Z" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>