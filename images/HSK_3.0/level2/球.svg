<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Sloped mountain / hill silhouette in the background -->
    <path d="M 20 180 L 120 110 L 220 200 L 20 200 Z" fill="#252A34"/>
    <path d="M 100 130 L 160 90 L 220 150 L 220 200 L 100 200 Z" fill="#2E3440"/>
    
    <!-- Motion / rolling trail lines -->
    <path d="M 75 125 Q 100 140 120 155" stroke="#3B4252" stroke-width="3" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
    <path d="M 95 145 Q 115 160 135 170" stroke="#3B4252" stroke-width="3" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>

    <!-- The Ball (球) - Central Physical Object -->
    <!-- Positioned dynamically to show motion/rolling down the slope -->
    <g transform="translate(110, 140) rotate(25)">
      <!-- Main sphere body -->
      <circle cx="0" cy="0" r="36" fill="#FF7043"/>
      
      <!-- Dynamic pattern on the ball (classic soccer/sport ball motif for instant recognition) -->
      <path d="M -12 -12 L 0 -22 L 12 -12 L 8 6 L -8 6 Z" fill="#F4511E"/>
      <!-- Curved segments -->
      <path d="M -36 0 C -30 -15 -18 -20 -12 -12 L -8 6 C -20 12 -30 6 -36 0 Z" fill="#FF8A65"/>
      <path d="M 36 0 C 30 15 18 20 12 12 L 8 -6 C 20 -12 30 -6 36 0 Z" fill="#FF8A65"/>
      <path d="M -12 12 C -20 20 -15 32 0 36 C 15 32 20 20 12 12 L 8 6 L -8 6 Z" fill="#FF8A65"/>
      
      <!-- Ball highlight for 3D/glossy flat look -->
      <path d="M -22 -16 C -14 -28 4 -28 16 -22 C 8 -30 -12 -28 -22 -16 Z" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- Motion dust particles at the base of the ball -->
    <circle cx="145" cy="175" r="4" fill="#4C566A" opacity="0.6"/>
    <circle cx="155" cy="180" r="2.5" fill="#4C566A" opacity="0.4"/>
    <circle cx="138" cy="170" r="2" fill="#4C566A" opacity="0.5"/>
  </g>
</svg>