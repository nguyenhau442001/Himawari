<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural Portal / Entrance representing the destination of "进去" -->
  <g id="doorway" transform="translate(0, 0)">
    <!-- Door frame outer glow/structure -->
    <rect x="85" y="45" width="70" height="155" rx="6" fill="#252A34" stroke="#3A4252" stroke-width="2"/>
    <!-- Inner dark interior -->
    <rect x="93" y="55" width="54" height="145" fill="#111318"/>
    <!-- Warm welcoming light spilling from inside -->
    <path d="M 93 110 L 147 110 L 155 200 L 85 200 Z" fill="#F5A623" opacity="0.12"/>
    <!-- Door open panels -->
    <path d="M 60 55 L 85 45 L 85 200 L 60 190 Z" fill="#2D3446"/>
    <path d="M 180 55 L 155 45 L 155 200 L 180 190 Z" fill="#2D3446"/>
  </g>

  <!-- Floor plane and queue perspective lines -->
  <g id="floor-elements">
    <ellipse cx="120" cy="200" rx="90" ry="15" fill="#1E232D"/>
    <!-- Queue path guide markers -->
    <path d="M 50 215 Q 120 190 120 180" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
  </g>

  <!-- Motion and Dynamic Action Lines -->
  <g id="motion-lines" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 55 140 C 70 135, 80 135, 95 130" fill="none"/>
    <path d="M 45 155 C 60 150, 75 145, 88 142" fill="none"/>
    <!-- Arrow indicating direction "in" -->
    <path d="M 85 136 L 95 142 L 85 148" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Human Character actively walking/stepping "进去" (Into) -->
  <g id="character-action" transform="translate(-10, 5)">
    <!-- Back leg (stepping forward) -->
    <path d="M 85 160 L 95 185 L 108 185" fill="none" stroke="#4A90E2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso -->
    <path d="M 75 115 L 85 160 L 65 155 Z" fill="#50E3C2"/>
    
    <!-- Head -->
    <circle cx="72" cy="98" r="12" fill="#FFE0B2"/>
    
    <!-- Front arm (reaching forward toward the door) -->
    <path d="M 78 122 L 105 135" fill="none" stroke="#50E3C2" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Back arm -->
    <path d="M 72 120 L 60 140" fill="none" stroke="#357ABD" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Front leg (pushing off) -->
    <path d="M 70 155 L 55 180 L 45 180" fill="none" stroke="#4A90E2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Secondary Queue Character (waiting in line, contextualizing "排队" and order) -->
  <g id="waiting-character" transform="translate(-45, 15) scale(0.85)" opacity="0.6">
    <!-- Standing body -->
    <path d="M 50 120 L 55 170 L 45 170 Z" fill="#3A4252"/>
    <circle cx="48" cy="105" r="10" fill="#D7CCC8"/>
    <!-- Legs -->
    <line x1="48" y1="170" x2="48" y2="195" stroke="#252A34" stroke-width="6" stroke-linecap="round"/>
    <line x1="53" y1="170" x2="58" y2="195" stroke="#252A34" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Focus Accent Indicator (Gold/Orange ring highlighting the action threshold) -->
  <circle cx="120" cy="140" r="45" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.3"/>
</svg>