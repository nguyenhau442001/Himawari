<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background effect for internet connection -->
  <circle cx="120" cy="115" r="70" fill="#2563EB" opacity="0.08"/>
  
  <!-- Central Physical Object: Modern Tablet / E-Commerce Device representing "The Net" / Online Space -->
  <!-- Tablet Body -->
  <rect x="65" y="55" width="110" height="130" rx="12" fill="#2D3748" stroke="#4A5568" stroke-width="3"/>
  <rect x="75" y="65" width="90" height="98" rx="6" fill="#0F172A"/>
  
  <!-- Tablet Home Indicator / Camera -->
  <circle cx="120" cy="177" r="3" fill="#4A5568"/>
  <circle cx="120" cy="60" r="1.5" fill="#4A5568"/>

  <!-- Screen Content: Online Shopping / Web Interface (Visualizing "网上购物") -->
  <!-- Header Bar -->
  <rect x="83" y="73" width="74" height="10" rx="3" fill="#1E293B"/>
  <circle cx="89" cy="78" r="2" fill="#F59E0B"/>
  <circle cx="95" cy="78" r="2" fill="#3B82F6"/>

  <!-- Web Content Grid / Cards -->
  <!-- Product Card 1 -->
  <rect x="83" y="89" width="34" height="42" rx="4" fill="#1E293B"/>
  <circle cx="100" cy="103" r="8" fill="#F59E0B" opacity="0.2"/>
  <path d="M96 103 L100 99 L104 103" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="87" y="117" width="22" height="4" rx="2" fill="#334155"/>
  <rect x="87" y="123" width="14" height="3" rx="1.5" fill="#F59E0B"/>

  <!-- Product Card 2 (Highlighted Shopping Item) -->
  <rect x="123" y="89" width="34" height="42" rx="4" fill="#1E293B"/>
  <rect x="123" y="89" width="34" height="42" rx="4" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Shopping Bag Icon inside screen -->
  <path d="M136 101 H144 V99 C144 97.5 142.5 96 140 96 C137.5 96 136 97.5 136 99 V101 Z" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  <path d="M133 101 H147 V123 C147 124 146 125 145 125 H135 C134 125 133 124 133 123 V101 Z" fill="#F59E0B" opacity="0.2"/>
  <path d="M133 101 H147 V123 C147 124 146 125 145 125 H135 C134 125 133 124 133 123 V101 Z" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  
  <!-- Checkout Button -->
  <rect x="83" y="137" width="74" height="18" rx="4" fill="#F59E0B"/>
  <rect x="105" y="144" width="30" height="4" rx="2" fill="#1A1D24"/>

  <!-- Glowing Network Nodes / Connection Waves Floating Around the Device (Representing "网" - Web/Network) -->
  <!-- Top Left Node -->
  <circle cx="45" cy="85" r="4" fill="#3B82F6"/>
  <circle cx="45" cy="85" r="8" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M49 85 Q 57 75 65 72" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Top Right Node -->
  <circle cx="195" cy="85" r="4" fill="#F59E0B"/>
  <circle cx="195" cy="85" r="8" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M191 85 Q 183 75 175 72" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Bottom Right Node -->
  <circle cx="185" cy="165" r="3" fill="#3B82F6"/>
  <path d="M182 163 Q 176 155 175 145" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Bottom Left Node -->
  <circle cx="55" cy="155" r="3" fill="#F59E0B"/>
  <path d="M58 153 Q 64 148 65 140" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Floating Connection Waves (Upper Arch) -->
  <path d="M90 42 C100 32 140 32 150 42" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M78 30 C95 16 145 16 162 30" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>