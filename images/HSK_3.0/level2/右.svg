<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road Path -->
  <path d="M120 240 L120 120 L240 120" stroke="#374151" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Directional Indicator (The Right Turn) -->
  <g transform="translate(180, 60)">
    <path d="M0 0 L0 40 L30 40" stroke="#FFB800" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 25 L30 40 L40 25" stroke="#FFB800" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Building (Hospital) -->
  <g transform="translate(160, 140)">
    <rect x="0" y="0" width="60" height="80" rx="4" fill="#4B5563"/>
    <rect x="15" y="15" width="30" height="20" fill="#1A1D24"/>
    <rect x="25" y="55" width="10" height="25" fill="#374151"/>
    <!-- Cross symbol -->
    <rect x="27" y="20" width="6" height="10" fill="#FFB800"/>
    <rect x="25" y="22" width="10" height="6" fill="#FFB800"/>
  </g>
  
  <!-- Person at intersection -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="-30" r="10" fill="#E5E7EB"/>
    <path d="M0 -20 L0 10 M0 0 L-15 10 M0 0 L15 10 M0 10 L-5 30 M0 10 L5 30" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>