<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Interior wall/frame -->
  <path d="M0 0h240v240H0z" fill="#1A1D24"/>
  <rect x="20" y="20" width="200" height="200" rx="10" fill="#2D343E" stroke="#4A5568" stroke-width="4"/>
  
  <!-- Window frame -->
  <rect x="40" y="40" width="160" height="160" rx="4" fill="#252A34"/>
  <line x1="120" y1="40" x2="120" y2="200" stroke="#4A5568" stroke-width="4"/>
  
  <!-- Rain effect outside -->
  <g stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="60" x2="55" y2="80"/>
    <line x1="90" y1="50" x2="85" y2="70"/>
    <line x1="140" y1="70" x2="135" y2="90"/>
    <line x1="170" y1="55" x2="165" y2="75"/>
    <line x1="50" y1="120" x2="45" y2="140"/>
    <line x1="180" y1="130" x2="175" y2="150"/>
    <line x1="70" y1="160" x2="65" y2="180"/>
    <line x1="150" y1="150" x2="145" y2="170"/>
  </g>
  
  <!-- Outside landscape (simplified) -->
  <path d="M40 160 Q 80 140 120 160 T 200 160 V 200 H 40 Z" fill="#374151"/>
  
  <!-- Focus accent: A small tree outside -->
  <path d="M150 160 L150 140 M150 140 L140 120 M150 140 L160 120" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="140" cy="120" r="8" fill="#F59E0B"/>
  <circle cx="160" cy="120" r="8" fill="#F59E0B"/>
  <circle cx="150" cy="110" r="8" fill="#F59E0B"/>
</svg>