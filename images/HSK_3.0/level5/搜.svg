<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="150" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="165" width="10" height="75" fill="#1e293b"/>
  <rect x="190" y="165" width="10" height="75" fill="#1e293b"/>
  
  <!-- Laptop -->
  <path d="M70 150 L170 150 L185 110 L55 110 Z" fill="#475569"/>
  <path d="M75 115 L165 115 L160 145 L80 145 Z" fill="#0f172a"/>
  
  <!-- Screen Content (Abstract search interface) -->
  <circle cx="120" cy="130" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="126" y1="136" x2="132" y2="142" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <rect x="95" y="128" width="15" height="4" rx="1" fill="#38bdf8"/>
  
  <!-- Character -->
  <g transform="translate(100, 80)">
    <!-- Head -->
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M5 20 Q 20 0 35 20 Q 35 10 20 5 Z" fill="#78350f"/>
    <!-- Eyes -->
    <circle cx="12" cy="18" r="2" fill="#1e293b"/>
    <circle cx="28" cy="18" r="2" fill="#1e293b"/>
    <!-- Smile -->
    <path d="M12 25 Q 20 30 28 25" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Coffee Mug -->
  <rect x="180" y="125" width="20" height="25" rx="3" fill="#ec4899"/>
  <path d="M200 130 Q 210 130 210 135 Q 210 140 200 140" stroke="#ec4899" stroke-width="3" fill="none"/>
  
  <!-- Ambient Light/Glow -->
  <circle cx="120" cy="130" r="40" fill="#f59e0b" opacity="0.05"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="60" r="3" fill="#10b981"/>
  <circle cx="200" cy="50" r="2" fill="#fb923c"/>
</svg>