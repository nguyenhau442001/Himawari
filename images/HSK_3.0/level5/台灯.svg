      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Books and Paper -->
  <rect x="80" y="145" width="90" height="15" rx="2" fill="#e2e8f0"/>
  <rect x="85" y="150" width="80" height="5" rx="1" fill="#cbd5e1"/>
  <rect x="85" y="157" width="60" height="2" rx="1" fill="#94a3b8"/>
  
  <!-- Character (Upper Body) -->
  <path d="M60 160 L180 160 L170 100 L70 100 Z" fill="#38bdf8"/>
