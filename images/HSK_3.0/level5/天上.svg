<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  
  <!-- Stars -->
  <circle cx="40" cy="30" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="80" cy="20" r="2" fill="#f59e0b" opacity="0.9"/>
  <circle cx="150" cy="40" r="1.2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="200" cy="25" r="2.5" fill="#fbbf24" opacity="1"/>
  <circle cx="180" cy="70" r="1.8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="50" cy="80" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="120" cy="10" r="2" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Hill/Ground -->
  <path d="M0 240 C 60 180, 180 180, 240 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Character: Girl sitting on a blanket looking up -->
  <g transform="translate(100, 160)">
    <path d="M20 60 L 60 60 L 55 40 L 25 40 Z" fill="#38bdf8"/> <!-- Blanket -->
    <circle cx="40" cy="25" r="12" fill="#fde68a"/> <!-- Head -->
    <path d="M30 35 L 50 35" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/> <!-- Mouth -->
    <path d="M32 22 L 36 26 M 44 22 L 40 26" stroke="#0f172a" stroke-width="1.5"/> <!-- Eyes looking up -->
    <path d="M25 40 L 20 60 M 55 40 L 60 60" fill="#ec4899"/> <!-- Body/Arms -->
  </g>
  
  <!-- Telescope -->
  <g transform="translate(160, 180)">
    <rect x="0" y="-10" width="40" height="8" rx="2" fill="#94a3b8"/>
    <path d="M-5 -15 L 5 -5 L 0 0 L -10 -10 Z" fill="#475569"/>
    <line x1="20" y1="-10" x2="20" y2="20" stroke="#64748b" stroke-width="4"/>
  </g>
  
  <!-- Moon Glow -->
  <circle cx="210" cy="40" r="15" fill="#f59e0b" opacity="0.15"/>
  <circle cx="210" cy="40" r="10" fill="#fef3c7" opacity="0.8"/>
</svg>