<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background Context -->
  <rect x="40" y="40" width="160" height="100" rx="8" fill="#334155" opacity="0.5"/>
  <circle cx="170" cy="70" r="15" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 C 20 140, 10 120, 10 100 L 110 100 C 110 120, 100 140, 80 140 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="60" r="30" fill="#fbbf24"/>
    <!-- Hair -->
    <path d="M35 55 C 35 30, 85 30, 85 55 L 85 70 L 35 70 Z" fill="#1e293b"/>
    <!-- Eyes -->
    <ellipse cx="48" cy="55" rx="3" ry="4" fill="#1e293b"/>
    <ellipse cx="72" cy="55" rx="3" ry="4" fill="#1e293b"/>
    <!-- Mouth -->
    <path d="M50 75 Q 60 82, 70 75" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Tears (The Focus) -->
    <path d="M48 62 Q 45 75, 48 85 Q 51 75, 48 62" fill="#38bdf8" opacity="0.9"/>
    <path d="M72 62 Q 69 75, 72 85 Q 75 75, 72 62" fill="#38bdf8" opacity="0.9"/>
    <circle cx="48" cy="90" r="2" fill="#38bdf8"/>
    <circle cx="72" cy="90" r="2" fill="#38bdf8"/>
  </g>

  <!-- Props: Opened Letter/Gift -->
  <rect x="150" y="150" width="50" height="40" rx="4" fill="#ec4899"/>
  <path d="M150 150 L 175 170 L 200 150" fill="#db2777"/>
  <path d="M160 160 L 190 160 M160 170 L 190 170" stroke="#fce7f3" stroke-width="2"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.1"/>
</svg>