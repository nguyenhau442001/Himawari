<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- School Building Silhouette -->
  <path d="M40 200 L40 120 L80 100 L120 120 L120 200 Z" fill="#334155"/>
  <rect x="55" y="130" width="20" height="30" fill="#1e293b"/>
  <rect x="85" y="130" width="20" height="30" fill="#1e293b"/>
  
  <!-- Sun/Morning Glow -->
  <circle cx="200" cy="40" r="25" fill="#f59e0b" opacity="0.8"/>
  <path d="M200 10 L200 5 M220 20 L225 15 M230 40 L235 40 M220 60 L225 65" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Student 1 (Walking) -->
  <g transform="translate(140, 160)">
    <circle cx="0" cy="-40" r="10" fill="#fde68a"/>
    <path d="M-5 -35 L5 -35 L0 -25 Z" fill="#ec4899"/>
    <rect x="-8" y="-25" width="16" height="20" rx="2" fill="#38bdf8"/>
    <path d="M-8 -15 L-12 0 M8 -15 L12 0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-4 0 L-4 15 M4 0 L4 15" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Student 2 (Waving) -->
  <g transform="translate(180, 150)">
    <circle cx="0" cy="-40" r="10" fill="#fde68a"/>
    <path d="M-5 -35 L5 -35 L0 -25 Z" fill="#10b981"/>
    <rect x="-8" y="-25" width="16" height="20" rx="2" fill="#fb923c"/>
    <path d="M-8 -15 L-15 -25" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <path d="M8 -15 L12 0" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <path d="M-4 0 L-4 15 M4 0 L4 15" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ground -->
  <path d="M0 200 Q 120 190 240 200 L240 240 L0 240 Z" fill="#334155"/>
  <ellipse cx="160" cy="210" rx="30" ry="5" fill="#0f172a" opacity="0.3"/>
  <ellipse cx="200" cy="205" rx="30" ry="5" fill="#0f172a" opacity="0.3"/>
</svg>