<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Elements -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="10"/>
  <circle cx="180" cy="80" r="30" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M60 160 C60 130, 80 120, 100 120 C120 120, 140 130, 140 160 L140 180 L60 180 Z" fill="#475569"/>
    <!-- Head -->
    <circle cx="100" cy="100" r="35" fill="#fde68a"/>
    <!-- Face details -->
    <path d="M85 95 Q90 90 95 95 M105 95 Q110 90 115 95" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M90 110 Q100 105 110 110" stroke="#ec4899" stroke-width="2" fill="none"/>
    
    <!-- Cigarette and Smoke -->
    <rect x="115" y="105" width="25" height="4" fill="#fb923c" rx="2"/>
    <circle cx="145" cy="107" r="3" fill="#fbbf24"/>
    
    <!-- Smoke trails -->
    <path d="M145 100 C155 80, 140 60, 160 40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M148 95 C165 70, 150 50, 175 30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Health Indicator (Visualizing Damage) -->
  <g transform="translate(160, 60)">
    <path d="M20 0 L40 0 L40 80 L20 80 Z" fill="#334155"/>
    <rect x="22" y="50" width="16" height="28" fill="#ec4899"/>
    <path d="M30 40 L40 30 L30 20 L20 30 Z" fill="#ec4899"/>
  </g>
  
  <!-- Decorative accents -->
  <circle cx="30" cy="40" r="4" fill="#38bdf8"/>
  <circle cx="210" cy="190" r="6" fill="#10b981"/>
</svg>