<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window Frame -->
  <rect x="30" y="30" width="180" height="180" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Outside Scene: Unpredictable Weather -->
  <path d="M40 40h160v160H40z" fill="#1e293b"/>
  
  <!-- Sun/Cloud Mix -->
  <circle cx="160" cy="80" r="20" fill="#fbbf24"/>
  <path d="M120 90c-10 0-15 5-15 15s5 15 15 15h40c10 0 15-5 15-15s-5-15-15-15z" fill="#94a3b8"/>
  <path d="M140 110c-10 0-15 5-15 15s5 15 15 15h30c10 0 15-5 15-15s-5-15-15-15z" fill="#64748b"/>
  
  <!-- Rain streaks -->
  <line x1="100" y1="130" x2="95" y2="150" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="140" x2="110" y2="160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Desk and Character -->
  <rect x="40" y="160" width="160" height="50" fill="#0f172a"/>
  <path d="M60 170h120v10H60z" fill="#334155"/>
  
  <!-- Character: Looking confused at a tablet -->
  <circle cx="100" cy="140" r="15" fill="#fde68a"/>
  <path d="M90 145h20v5h-20z" fill="#fb923c"/>
  <rect x="120" y="130" width="40" height="30" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Chart on screen -->
  <polyline points="125 150 135 135 145 145 155 130" fill="none" stroke="#ec4899" stroke-width="2"/>
  
  <!-- Question mark gesture -->
  <path d="M170 120c5-10 15-10 15 0s-10 10-10 15" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="175" cy="140" r="2" fill="#fbbf24"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#fb923c"/>
  <circle cx="200" cy="190" r="2" fill="#10b981"/>
</svg>