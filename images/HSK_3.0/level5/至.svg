<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Throne Platform -->
  <path d="M40 200 L200 200 L190 220 L50 220 Z" fill="#334155"/>
  <path d="M60 200 L180 200 L170 180 L70 180 Z" fill="#475569"/>
  
  <!-- Emperor Character -->
  <g transform="translate(120, 160)">
    <!-- Robes -->
    <path d="M-30 0 C-30 -40, 30 -40, 30 0 L20 40 L-20 40 Z" fill="#991b1b"/>
    <path d="M-20 40 L-30 60 L30 60 L20 40 Z" fill="#7f1d1d"/>
    <!-- Sleeves -->
    <path d="M-30 -10 L-50 20 L-30 30 Z" fill="#b91c1c"/>
    <path d="M30 -10 L50 20 L30 30 Z" fill="#b91c1c"/>
    <!-- Head -->
    <circle cx="0" cy="-45" r="18" fill="#fde68a"/>
    <!-- Crown -->
    <path d="M-15 -60 L15 -60 L12 -75 L-12 -75 Z" fill="#f59e0b"/>
    <rect x="-18" y="-62" width="36" height="5" fill="#d97706"/>
  </g>
  
  <!-- Symbolic Power Elements (Golden Glow) -->
  <circle cx="120" cy="80" r="40" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M120 50 L125 65 L140 65 L128 75 L132 90 L120 80 L108 90 L112 75 L100 65 L115 65 Z" fill="#fbbf24"/>
  
  <!-- Architectural Details -->
  <rect x="80" y="100" width="80" height="5" fill="#fb923c"/>
  <path d="M20 180 L40 180 L40 150 L20 150 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M220 180 L200 180 L200 150 L220 150 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Decorative Accents -->
  <circle cx="40" cy="40" r="3" fill="#10b981"/>
  <circle cx="200" cy="40" r="3" fill="#ec4899"/>
  <circle cx="120" cy="20" r="2" fill="#f59e0b"/>
</svg>