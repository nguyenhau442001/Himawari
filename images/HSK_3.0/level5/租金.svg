<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Cityscape Background -->
  <path d="M30 180 L30 100 L60 80 L90 110 L120 70 L150 100 L180 90 L210 120 L210 180 Z" fill="#334155"/>
  <rect x="40" y="110" width="15" height="20" fill="#475569"/>
  <rect x="130" y="90" width="15" height="25" fill="#475569"/>
  <rect x="190" y="130" width="15" height="20" fill="#475569"/>

  <!-- Character -->
  <g transform="translate(60, 120)">
    <circle cx="30" cy="30" r="15" fill="#fde68a"/> <!-- Head -->
    <path d="M15 45 Q30 60 45 45 L40 100 L20 100 Z" fill="#38bdf8"/> <!-- Shirt -->
    <rect x="25" y="100" width="10" height="30" fill="#1e293b"/> <!-- Legs -->
    <path d="M20 50 L10 70" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/> <!-- Arm -->
  </g>

  <!-- Interaction: Holding a document/bill -->
  <rect x="110" y="140" width="50" height="60" rx="4" fill="#f8fafc"/>
  <line x1="120" y1="155" x2="150" y2="155" stroke="#94a3b8" stroke-width="4"/>
  <line x1="120" y1="170" x2="140" y2="170" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="145" cy="185" r="8" fill="#ec4899"/> <!-- Price tag indicator -->
  
  <!-- "High" indicator -->
  <path d="M170 120 L185 100 L200 120" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="185" y1="120" x2="185" y2="140" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Floor -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
</svg>