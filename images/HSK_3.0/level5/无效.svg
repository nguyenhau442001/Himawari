<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Counter Desk -->
  <rect x="20" y="140" width="200" height="100" rx="10" fill="#334155"/>
  <rect x="30" y="150" width="180" height="20" rx="5" fill="#475569"/>
  
  <!-- Cashier Character -->
  <circle cx="180" cy="120" r="25" fill="#fde68a"/>
  <path d="M165 145h30v40h-30z" fill="#38bdf8"/>
  <path d="M160 145h40v10h-40z" fill="#0ea5e9"/>
  
  <!-- Customer Character -->
  <circle cx="70" cy="120" r="25" fill="#fde68a"/>
  <path d="M55 145h30v40h-30z" fill="#fb923c"/>
  
  <!-- The Expired Coupon -->
  <rect x="95" y="155" width="50" height="30" rx="2" fill="#e2e8f0"/>
  <line x1="100" y1="165" x2="140" y2="175" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="165" x2="100" y2="175" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Visual Indicators of Invalidity -->
  <circle cx="120" cy="170" r="22" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 4"/>
  
  <!-- Cashier Gesture -->
  <path d="M160 130 l-20 10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Environment Details -->
  <rect x="190" y="80" width="30" height="50" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="205" cy="105" r="8" fill="#fbbf24"/>
  <rect x="20" y="80" width="40" height="60" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="25" y="85" width="30" height="10" rx="2" fill="#38bdf8"/>
  <rect x="25" y="100" width="30" height="10" rx="2" fill="#10b981"/>
</svg>