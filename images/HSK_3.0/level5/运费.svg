<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- Character: Customer pointing at a tablet -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M5 40 Q20 35 35 40 L30 80 L10 80 Z" fill="#38bdf8"/>
    <path d="M25 45 L40 60" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Tablet Device -->
  <rect x="60" y="120" width="80" height="60" fill="#f8fafc" rx="4"/>
  <rect x="65" y="125" width="70" height="40" fill="#cbd5e1" rx="2"/>
  <circle cx="100" cy="150" r="8" fill="#fb923c"/>
  
  <!-- Package Box -->
  <g transform="translate(30, 130)">
    <rect width="40" height="40" fill="#fbbf24" rx="2"/>
    <rect x="10" y="10" width="20" height="20" fill="#f59e0b" rx="1"/>
    <path d="M0 10 L40 10 M20 0 L20 40" stroke="#f59e0b" stroke-width="2"/>
  </g>
  
  <!-- Floating Price Tag/Icon representation (Abstracted as a glowing checkmark) -->
  <path d="M180 60 L190 70 L210 50" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="195" cy="60" r="25" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Decorative background elements -->
  <circle cx="200" cy="30" r="3" fill="#ec4899"/>
  <circle cx="40" cy="50" r="2" fill="#38bdf8"/>
</svg>