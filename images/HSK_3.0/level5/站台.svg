<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Train Tracks/Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <rect x="0" y="160" width="240" height="10" fill="#475569"/>
  
  <!-- Train Body (Entering) -->
  <rect x="-20" y="80" width="100" height="80" rx="8" fill="#38bdf8"/>
  <rect x="0" y="100" width="20" height="40" rx="4" fill="#0f172a" opacity="0.3"/>
  <circle cx="20" cy="120" r="8" fill="#fbbf24"/>
  
  <!-- Platform Edge -->
  <rect x="80" y="150" width="160" height="10" fill="#94a3b8"/>
  
  <!-- Passengers -->
  <g transform="translate(100, 100)">
    <!-- Person 1 -->
    <path d="M20 60 L20 30 Q20 20 30 20 L40 20 Q50 20 50 30 L50 60" fill="#ec4899"/>
    <circle cx="35" cy="15" r="8" fill="#fde68a"/>
    
    <!-- Person 2 -->
    <path d="M60 60 L60 35 Q60 25 70 25 L80 25 Q90 25 90 35 L90 60" fill="#fb923c"/>
    <circle cx="75" cy="20" r="8" fill="#fde68a"/>
    
    <!-- Person 3 -->
    <path d="M100 60 L100 40 Q100 30 110 30 L120 30 Q130 30 130 40 L130 60" fill="#10b981"/>
    <circle cx="115" cy="25" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Platform Details -->
  <rect x="180" y="140" width="4" height="20" fill="#fbbf24"/>
  <rect x="210" y="140" width="4" height="20" fill="#fbbf24"/>
  
  <!-- Lighting/Atmosphere -->
  <circle cx="120" cy="50" r="40" fill="#f59e0b" opacity="0.05"/>
</svg>