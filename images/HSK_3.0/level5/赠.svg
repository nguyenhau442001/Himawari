<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Store Counter -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  <rect x="25" y="165" width="190" height="10" fill="#475569"/>
  
  <!-- Character: Customer -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35 Q20 45 30 35" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="5" y="50" width="30" height="60" rx="5" fill="#38bdf8"/>
    <rect x="0" y="55" width="10" height="40" rx="3" fill="#38bdf8"/>
    <rect x="30" y="55" width="10" height="40" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Big Bottle -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="30" height="70" rx="5" fill="#10b981"/>
    <rect x="8" y="-10" width="14" height="10" rx="2" fill="#10b981"/>
    <rect x="5" y="15" width="20" height="5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Small Bottle (The Gift) -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="15" height="35" rx="3" fill="#ec4899"/>
    <rect x="4" y="-5" width="7" height="5" rx="1" fill="#ec4899"/>
    <circle cx="7.5" cy="17" r="3" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Action lines/Sparkle for "Gift" -->
  <path d="M115 120 L125 110 M120 125 L130 115" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="135" cy="105" r="3" fill="#fbbf24"/>
  
  <!-- Shelf background -->
  <rect x="30" y="60" width="180" height="5" rx="2" fill="#475569"/>
  <rect x="30" y="90" width="180" height="5" rx="2" fill="#475569"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="30" r="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M190 30 L210 30 M200 20 L200 40" stroke="#334155" stroke-width="4"/>
</svg>