  </g>
  
  <!-- Connection Lines -->
  <path d="M75 115 Q120 80 165 115" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Coffee Mug -->
  <rect x="180" y="140" width="20" height="20" rx="2" fill="#fb923c"/>
  <path d="M200 145 h5 a3 3 0 0 1 0 6 h-5" fill="none" stroke="#fb923c" stroke-width="3"/>
  
