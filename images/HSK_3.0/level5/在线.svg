  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Laptop Screen -->
  <rect x="70" y="80" width="100" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="120" cy="115" r="15" fill="#fbbf24" opacity="0.8"/>
  <path d="M105 115 L135 115 M120 100 L120 130" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <rect x="10" y="40" width="20" height="40" rx="5" fill="#38bdf8"/>
    <circle cx="15" cy="18" r="2" fill="#1e293b"/>
    <circle cx="25" cy="18" r="2" fill="#1e293b"/>
  </g>
  
  <!-- Character 2 (Right) -->
