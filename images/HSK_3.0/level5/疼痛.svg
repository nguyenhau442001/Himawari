<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Room Wall & Floor Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Medical Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Pain Indicator Glow -->
    <radialGradient id="painGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- CLINIC INTERIOR BACKGROUND -->
  <!-- Back wall -->
  <rect x="15" y="15" width="210" height="155" fill="url(#wallGrad)" rx="4"/>
  <!-- Floor -->
  <path d="M15 170 L225 170 L235 225 L5 225 Z" fill="url(#floorGrad)" />
  <!-- Baseboard line -->
  <line x1="15" y1="170" x2="225" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Background Props: Medical Poster on Wall -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="35" height="45" fill="#f8fafc" rx="2" filter="url(#softShadow)" />
    <!-- Abstract skeleton/anatomy outline -->
    <circle cx="17.5" cy="12" r="5" fill="none" stroke="#64748b" stroke-width="1.5" />
    <line x1="17.5" y1="17" x2="17.5" y2="32" stroke="#64748b" stroke-width="2" />
    <line x1="12" y1="22" x2="23" y2="22" stroke="#64748b" stroke-width="1.5" />
    <!-- Red dot on poster emphasizing location/pain concept -->
    <circle cx="17.5" cy="22" r="3" fill="#ef4444" />
  </g>

  <!-- Background Props: Medical Cabinet with supplies -->
  <g transform="translate(170, 40)">
    <rect x="0" y="0" width="40" height="120" fill="#334155" rx="2" />
    <rect x="4" y="6" width="32" height="50" fill="#475569" rx="1" />
    <rect x="4" y="60" width="32" height="54" fill="#475569" rx="1" />
    <line x1="20" y1="6" x2="20" y2="56" stroke="#1e293b" stroke-width="1" />
    <line x1="20" y1="60" x2="20" y2="114" stroke="#1e293b" stroke-width="1" />
    <!-- Cross symbol -->
    <rect x="17" y="25" width="6" height="2" fill="#ef4444" />
    <rect x="19" y="23" width="2" height="6" fill="#ef4444" />
  </g>

  <!-- Exam Bed / Chair -->
  <g transform="translate(75, 130)">
    <!-- Bed base / mattress -->
    <path d="M 0 20 L 120 20 L 130 50 L -10 50 Z" fill="#64748b" />
    <path d="M -10 15 L 125 15 L 120 20 L -5 20 Z" fill="#94a3b8" />
    <!-- Metal legs -->
    <line x1="10" y1="50" x2="5" y2="80" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="50" x2="105" y2="80" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Ceiling Examination Lamp -->
  <g transform="translate(120, 0)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#64748b" stroke-width="2" />
    <!-- Lamp head -->
    <path d="M -15 45 L 15 45 L 20 60 L -20 60 Z" fill="#cbd5e1" />
    <ellipse cx="0" cy="60" rx="20" ry="6" fill="#94a3b8" />
    <!-- Light Cone Glow -->
    <path d="M -5 60 L -45 150 L 45 150 L 5 60 Z" fill="url(#lampGlow)" opacity="0.7" />
  </g>

  <!-- FOREGROUND CHARACTERS: DOCTOR & PATIENT -->

  <!-- DOCTOR (Standing on the right, pointing/asking) -->
  <g transform="translate(145, 80)">
    <!-- Doctor Shadow -->
    <ellipse cx="20" cy="95" rx="15" ry="5" fill="#0f172a" opacity="0.4" />

    <!-- Legs & Shoes -->
    <rect x="10" y="65" width="8" height="30" fill="#334155" />
    <rect x="22" y="65" width="8" height="30" fill="#334155" />
    <ellipse cx="14" cy="95" rx="5" ry="3" fill="#0f172a" />
    <ellipse cx="26" cy="95" rx="5" ry="3" fill="#0f172a" />

    <!-- White Coat Body -->
    <path d="M 8 20 L 32 20 L 38 70 L 2 70 Z" fill="#f8fafc" />
    <!-- Coat opening & shirt -->
    <line x1="20" y1="20" x2="20" y2="70" stroke="#e2e8f0" stroke-width="2" />
    <polygon points="20,20 15,35 25,35" fill="#38bdf8" /> <!-- Blue scrub shirt collar -->

    <!-- Stethoscope -->
    <path d="M 20 28 C 15 28 12 35 15 42" fill="none" stroke="#334155" stroke-width="2" />
    <circle cx="15" cy="43" r="3" fill="#94a3b8" />

    <!-- Doctor Left Arm (Pointing towards patient) -->
    <path d="M 32 25 C 45 28 50 35 55 35" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <circle cx="56" cy="35" r="4" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Doctor Head & Hair -->
    <circle cx="20" cy="12" r="10" fill="#fbcfe8" />
    <path d="M 10 12 C 10 4 30 4 30 12 C 30 14 28 12 20 8 C 12 12 10 14 10 12 Z" fill="#334155" /> <!-- Hair -->

    <!-- Friendly / Attentive Facial Expression -->
    <circle cx="17" cy="11" r="1" fill="#1e293b" />
    <circle cx="23" cy="11" r="1" fill="#1e293b" />
    <path d="M 18 15 Q 20 17 22 15" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round" />
  </g>


  <!-- PATIENT (Sitting on exam table, pointing to pain spot on abdomen/chest) -->
  <g transform="translate(65, 75)">
    <!-- Patient Shadow on bed -->
    <ellipse cx="25" cy="100" rx="20" ry="6" fill="#0f172a" opacity="0.3" />

    <!-- Legs dangling from exam table -->
    <rect x="15" y="75" width="8" height="30" fill="#38bdf8" />
    <rect x="28" y="75" width="8" height="30" fill="#38bdf8" />
    <ellipse cx="19" cy="105" rx="4" ry="3" fill="#1e293b" />
    <ellipse cx="32" cy="105" rx="4" ry="3" fill="#1e293b" />

    <!-- Patient Torso (Wearing casual hoodie/shirt) -->
    <path d="M 10 25 L 40 25 L 45 75 L 5 75 Z" fill="#fb923c" />
    <!-- Hoodie pocket & details -->
    <path d="M 20 55 L 30 55 L 32 70 L 18 70 Z" fill="#ea580c" opacity="0.5" />

    <!-- PAIN AREA & GESTURE (The core semantic focus) -->
    <!-- Glowing indicator spot on side of torso -->
    <circle cx="32" cy="48" r="12" fill="url(#painGlow)" />
    <circle cx="32" cy="48" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="32" cy="48" r="2" fill="#fef2f2" />

    <!-- Patient Hand pointing directly at pain spot -->
    <!-- Right Arm & Hand -->
    <path d="M 12 30 C 20 30 35 40 34 46" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" />
    <!-- Index finger touching the spot -->
    <circle cx="33" cy="47" r="4" fill="#fbcfe8" />
    <path d="M 33 46 L 33 48" stroke="#be185d" stroke-width="2" stroke-linecap="round" /> <!-- Finger detail -->

    <!-- Patient Head & Facial Expression (Grimacing slightly in discomfort) -->
    <circle cx="25" cy="12" r="10" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 15 10 C 15 2 35 2 35 10 C 32 6 18 6 15 10 Z" fill="#1e293b" />

    <!-- Pain Facial Expression: Tight eyes, slight frown/grimace -->
    <!-- Left Eye (Tearful/Squinted) -->
    <path d="M 20 10 Q 22 12 24 10" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Right Eye -->
    <path d="M 26 10 Q 28 12 30 10" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Worried Eyebrows (slanted) -->
    <line x1="19" y1="8" x2="24" y2="9" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="26" y1="9" x2="31" y2="8" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Mouth grimacing -->
    <path d="M 22 16 Q 25 14 28 16" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Medical Clipboard / Props on a small table -->
  <g transform="translate(15, 125)">
    <!-- Small bedside table -->
    <rect x="0" y="25" width="30" height="35" fill="#475569" rx="2" />
    <rect x="-5" y="20" width="40" height="6" fill="#64748b" rx="1" />
    <!-- Clipboard on top -->
    <rect x="5" y="8" width="18" height="14" fill="#f8fafc" rx="1" transform="rotate(-10 5 8)" />
    <rect x="11" y="5" width="6" height="4" fill="#94a3b8" rx="1" transform="rotate(-10 5 8)" />
    <!-- Red cross on clipboard paper -->
    <circle cx="14" cy="13" r="2" fill="#ef4444" />
  </g>

  <!-- Ambient lighting highlights -->
  <circle cx="120" cy="60" r="80" fill="#38bdf8" opacity="0.03" pointer-events="none" />
</svg>