<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Urban Street Scene -->
  <path d="M0 180h240v60H0z" fill="#334155"/>
  <path d="M20 180h200v5H20z" fill="#475569"/>
  
  <!-- Trash Can (Public Order/Civic Duty) -->
  <rect x="180" y="140" width="30" height="40" rx="2" fill="#fb923c"/>
  <rect x="185" y="135" width="20" height="5" rx="1" fill="#f59e0b"/>
  
  <!-- Character: Person putting trash in bin -->
  <g transform="translate(140, 100)">
    <!-- Body -->
    <path d="M10 40h20v40H10z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="20" cy="30" r="12" fill="#fde68a"/>
    <!-- Arm reaching -->
    <path d="M30 50l20-10" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="12" y="80" width="6" height="20" fill="#38bdf8"/>
    <rect x="22" y="80" width="6" height="20" fill="#38bdf8"/>
  </g>

  <!-- Character: Person holding door for elderly -->
  <g transform="translate(40, 90)">
    <!-- Person 1 (Holding door) -->
    <rect x="0" y="50" width="10" height="40" fill="#10b981"/>
    <circle cx="5" cy="40" r="10" fill="#fde68a"/>
    <path d="M10 60l15-10" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Person 2 (Elderly) -->
    <rect x="40" y="60" width="12" height="30" fill="#ec4899"/>
    <circle cx="46" cy="50" r="8" fill="#fde68a"/>
    <path d="M52 75l10 5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Background elements -->
  <rect x="10" y="50" width="60" height="130" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="60" width="40" height="30" fill="#0f172a"/>
  <rect x="20" y="100" width="40" height="30" fill="#0f172a"/>
  
  <!-- Decorative light -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24" opacity="0.2"/>
  <circle cx="200" cy="40" r="10" fill="#fbbf24" opacity="0.4"/>
</svg>