<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="8"/>
  
  <!-- The "Disposable" items (The focus) -->
  <g transform="translate(140, 130)">
    <path d="M0 0 L40 0 L35 40 L5 40 Z" fill="#fb923c" opacity="0.8"/>
    <rect x="10" y="-15" width="20" height="15" fill="#fb923c" rx="2"/>
    <path d="M10 5 L30 5" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Reusable items (The solution) -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="30" height="50" fill="#10b981" rx="4"/>
    <path d="M5 10 L25 10 M5 20 L25 20 M5 30 L25 30" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Character: Person gesturing to stop/reduce -->
  <g transform="translate(100, 60)">
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <path d="M5 35 Q20 45 35 35" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <!-- Hand gesture -->
    <path d="M40 50 L60 30" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="65" cy="25" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Environmental context: Plant -->
  <path d="M210 200 Q210 150 220 120 M210 160 L230 150 M210 140 L230 130" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Light accent -->
  <circle cx="180" cy="50" r="30" fill="#f59e0b" opacity="0.05"/>
</svg>