<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk/Work Environment -->
  <rect x="20" y="120" width="200" height="8" rx="2" fill="#334155"/>
  <rect x="40" y="128" width="10" height="80" fill="#475569"/>
  <rect x="190" y="128" width="10" height="80" fill="#475569"/>
  
  <!-- Cluttered Desk Items -->
  <rect x="50" y="90" width="60" height="30" rx="4" fill="#fb923c"/>
  <circle cx="130" cy="105" r="12" fill="#38bdf8"/>
  <rect x="150" y="100" width="40" height="20" rx="2" fill="#10b981"/>
  
  <!-- Character (Busy) -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="40" width="20" height="40" rx="4" fill="#ec4899"/>
    <rect x="5" y="45" width="10" height="30" rx="2" fill="#ec4899" transform="rotate(-20 10 45)"/>
    <rect x="25" y="45" width="10" height="30" rx="2" fill="#ec4899" transform="rotate(20 35 45)"/>
    <circle cx="15" cy="18" r="2" fill="#1e293b"/>
    <circle cx="25" cy="18" r="2" fill="#1e293b"/>
  </g>
  
  <!-- The "Future" Thought/Window -->
  <rect x="30" y="150" width="180" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M60 170 L90 170 L75 195 Z" fill="#fbbf24"/>
  <circle cx="150" cy="185" r="15" fill="#f59e0b"/>
  <path d="M140 185 L160 185 M150 175 L150 195" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Clock on wall -->
  <circle cx="200" cy="40" r="15" fill="#334155"/>
  <line x1="200" y1="40" x2="200" y2="30" stroke="#f8fafc" stroke-width="2"/>
  <line x1="200" y1="40" x2="210" y2="40" stroke="#f8fafc" stroke-width="2"/>
</svg>