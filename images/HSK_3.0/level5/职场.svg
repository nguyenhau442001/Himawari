<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="170" width="180" height="60" fill="#1e293b"/>
  
  <!-- Character: Professional Person -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-40 100 L40 100 L30 40 L-30 40 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 10 C-25 -15 25 -15 25 10 C25 20 15 25 0 25 C-15 25 -25 20 -25 10" fill="#475569"/>
    <!-- Glasses -->
    <rect x="-15" y="0" width="12" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="2"/>
    <rect x="3" y="0" width="12" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Props: Learning/Work -->
  <!-- Open Book/Tablet -->
  <path d="M60 140 L180 140 L170 180 L50 180 Z" fill="#f1f5f9"/>
  <path d="M65 145 L175 145 L165 175 L55 175 Z" fill="#cbd5e1"/>
  
  <!-- Coffee Mug -->
  <circle cx="190" cy="150" r="12" fill="#fb923c"/>
  <rect x="202" y="145" width="6" height="8" rx="2" fill="none" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Floating Knowledge Icons (Abstract shapes representing growth/learning) -->
  <path d="M40 80 L50 60 L60 80 Z" fill="#10b981"/>
  <circle cx="190" cy="70" r="8" fill="#ec4899"/>
  <path d="M180 100 L190 90 L200 100 L190 110 Z" fill="#fbbf24"/>
  
  <!-- Ambient Light/Window -->
  <rect x="80" y="30" width="80" height="5" rx="2" fill="#334155" opacity="0.5"/>
  <rect x="90" y="20" width="60" height="5" rx="2" fill="#334155" opacity="0.5"/>
</svg>