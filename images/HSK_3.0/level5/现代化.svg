<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Hospital Background Wall -->
  <rect x="20" y="40" width="200" height="160" rx="8" fill="#334155"/>
  <rect x="30" y="50" width="180" height="140" rx="4" fill="#1e293b"/>
  
  <!-- High-tech Medical Monitor -->
  <rect x="40" y="60" width="70" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <path d="M45 85 L60 70 L75 90 L90 65 L105 80" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Doctor Character -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="15" y="35" width="10" height="40" fill="#f8fafc"/>
    <path d="M5 40 L35 40 L30 80 L10 80 Z" fill="#f8fafc"/>
    <rect x="12" y="35" width="16" height="10" fill="#fb923c"/>
    <circle cx="15" cy="18" r="2" fill="#1e293b"/>
    <circle cx="25" cy="18" r="2" fill="#1e293b"/>
  </g>
  
  <!-- Robotic/Modern Medical Arm -->
  <path d="M110 110 L130 110 L135 140" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="135" cy="140" r="8" fill="#fbbf24"/>
  
  <!-- Floor/Base -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  
  <!-- Ambient Glows -->
  <circle cx="180" cy="70" r="20" fill="#ec4899" opacity="0.15" filter="blur(10px)"/>
  <circle cx="60" cy="170" r="30" fill="#38bdf8" opacity="0.1" filter="blur(10px)"/>
</svg>