    <circle cx="12" cy="12" r="3" fill="#1e293b"/>
    <circle cx="28" cy="12" r="3" fill="#1e293b"/>
  </g>

  <!-- Cultural Prop: Unique ceremonial drum -->
  <ellipse cx="110" cy="180" rx="25" ry="15" fill="#fb923c"/>
  <ellipse cx="110" cy="180" rx="20" ry="10" fill="#f59e0b"/>
  <path d="M95 180 L85 190 M125 180 L135 190" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Decorative accents -->
