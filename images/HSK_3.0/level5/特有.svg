      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Traditional architecture silhouette -->
  <path d="M20 240 L20 160 L50 130 L80 160 L80 240 Z" fill="#334155"/>
  <path d="M160 240 L160 140 L200 110 L240 140 L240 240 Z" fill="#334155"/>
  
  <!-- Lanterns -->
  <circle cx="60" cy="100" r="12" fill="#fb923c"/>
  <rect x="58" y="112" width="4" height="8" fill="#fb923c"/>
  <circle cx="190" cy="80" r="15" fill="#ec4899"/>
  <rect x="188" y="95" width="4" height="10" fill="#ec4899"/>

  <!-- Characters: Representing the ethnic minority group -->
  <!-- Character 1 -->
  <g transform="translate(70, 140)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M5 40 Q20 35 35 40 L30 80 L10 80 Z" fill="#fbbf24"/>
