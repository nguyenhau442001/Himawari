    <circle cx="15" cy="15" r="2" fill="#1e293b"/>
    <circle cx="25" cy="15" r="2" fill="#1e293b"/>
  </g>

  <!-- Character 2 -->
  <g transform="translate(130, 130)">
    <circle cx="20" cy="20" r="18" fill="#fde68a"/>
    <path d="M0 40 Q20 30 40 40 L35 90 L5 90 Z" fill="#38bdf8"/>
