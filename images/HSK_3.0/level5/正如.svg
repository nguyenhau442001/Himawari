<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Podium -->
  <rect x="60" y="160" width="120" height="40" rx="4" fill="#334155"/>
  <rect x="85" y="140" width="70" height="20" rx="4" fill="#475569"/>
  
  <!-- Trophy -->
  <path d="M120 120 L135 120 L130 140 L110 140 Z" fill="#fbbf24"/>
  <circle cx="120" cy="115" r="8" fill="#fbbf24"/>
  <rect x="118" y="140" width="4" height="5" fill="#f59e0b"/>
  
  <!-- Characters (Winners) -->
  <g transform="translate(100, 130)">
    <circle cx="10" cy="10" r="12" fill="#fde68a"/>
    <path d="M5 15 Q10 20 15 15" stroke="#92400e" stroke-width="2" fill="none"/>
    <rect x="2" y="25" width="16" height="30" rx="4" fill="#38bdf8"/>
  </g>
  
  <!-- Crowd (The "Everyone" predicting) -->
  <g opacity="0.8">
    <circle cx="40" cy="180" r="8" fill="#94a3b8"/>
    <circle cx="60" cy="190" r="8" fill="#94a3b8"/>
    <circle cx="180" cy="190" r="8" fill="#94a3b8"/>
    <circle cx="200" cy="180" r="8" fill="#94a3b8"/>
  </g>
  
  <!-- Confetti/Celebration -->
  <circle cx="50" cy="80" r="2" fill="#ec4899"/>
  <circle cx="190" cy="70" r="2" fill="#10b981"/>
  <circle cx="120" cy="60" r="3" fill="#fb923c"/>
  <circle cx="80" cy="90" r="2" fill="#38bdf8"/>
  
  <!-- Spotlight effect -->
  <path d="M0 0 L240 0 L120 240 Z" fill="#ffffff" opacity="0.05"/>
</svg>