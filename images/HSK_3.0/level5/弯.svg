<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road Surface -->
  <path d="M0 160 C 80 160, 120 100, 240 100" fill="none" stroke="#334155" stroke-width="40" stroke-linecap="round"/>
  <path d="M0 160 C 80 160, 120 100, 240 100" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Sharp Turn Sign -->
  <path d="M140 80 L160 80 L150 60 Z" fill="#fb923c"/>
  <path d="M150 90 L150 100" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Character -->
  <g transform="translate(60, 140)">
    <!-- Body -->
    <path d="M0 0 L10 0 L8 30 L-2 30 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="4" cy="-10" r="8" fill="#fde68a"/>
    <!-- Arm pointing -->
    <path d="M8 5 L20 15" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M0 30 L-5 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M8 30 L13 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Background Elements -->
  <circle cx="200" cy="40" r="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M30 40 L50 20 L70 40" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 60 L40 40 L60 60" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Street Lamp -->
  <rect x="220" y="100" width="4" height="100" fill="#475569"/>
  <circle cx="222" cy="90" r="8" fill="#fbbf24" opacity="0.3"/>
</svg>