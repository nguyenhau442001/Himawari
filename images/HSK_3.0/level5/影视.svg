<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Architecture/Academy Background -->
  <path d="M40 180 L40 80 L120 50 L200 80 L200 180 Z" fill="#334155"/>
  <rect x="60" y="100" width="40" height="60" fill="#1e293b"/>
  <rect x="140" y="100" width="40" height="60" fill="#1e293b"/>
  
  <!-- Film Equipment -->
  <circle cx="180" cy="190" r="25" fill="#f59e0b" opacity="0.2"/>
  <path d="M170 180 L190 180 L195 200 L165 200 Z" fill="#fb923c"/>
  <rect x="175" y="170" width="10" height="10" fill="#fb923c"/>
  
  <!-- Character: Graduate -->
  <g transform="translate(80, 110)">
    <!-- Body -->
    <path d="M20 130 C20 100, 60 100, 60 130 L60 180 L20 180 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="40" cy="80" r="25" fill="#fde68a"/>
    <!-- Graduation Cap -->
    <path d="M15 70 L65 70 L55 50 L25 50 Z" fill="#1e293b"/>
    <rect x="35" y="45" width="10" height="15" fill="#1e293b"/>
    <path d="M45 55 L55 40" stroke="#ec4899" stroke-width="2"/>
    <!-- Diploma -->
    <rect x="60" y="140" width="40" height="10" rx="2" fill="#f1f5f9"/>
    <rect x="75" y="138" width="10" height="14" fill="#fb923c"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="30" cy="50" r="3" fill="#10b981"/>
  <circle cx="210" cy="40" r="4" fill="#38bdf8"/>
  <path d="M180 60 L190 50 L200 60" stroke="#fbbf24" stroke-width="2" fill="none"/>
</svg>