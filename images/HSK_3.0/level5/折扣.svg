<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Store Window Frame -->
  <rect x="20" y="40" width="200" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Sale Signage Shape (Abstract geometric representation of a sale tag) -->
  <path d="M180 50 L210 50 L220 60 L210 70 L180 70 Z" fill="#ec4899"/>
  <circle cx="185" cy="60" r="3" fill="#fff"/>
  
  <!-- Character 1: Excited Shopper -->
  <g transform="translate(60, 100)">
    <path d="M20 100 Q20 60 40 60 L60 60 Q80 60 80 100" fill="#38bdf8"/>
    <circle cx="50" cy="45" r="15" fill="#fde68a"/>
    <path d="M40 40 L45 45 M55 40 L50 45" stroke="#1e293b" stroke-width="2"/>
    <path d="M45 52 Q50 55 55 52" stroke="#1e293b" stroke-width="2" fill="none"/>
    <rect x="35" y="60" width="30" height="10" fill="#f59e0b" rx="2"/>
  </g>
  
  <!-- Character 2: Holding Shopping Bags -->
  <g transform="translate(120, 110)">
    <path d="M10 90 L10 50 Q10 40 25 40 L35 40 Q50 40 50 50 L50 90" fill="#fb923c"/>
    <circle cx="30" cy="30" r="12" fill="#fde68a"/>
    <rect x="50" y="60" width="15" height="25" fill="#10b981" rx="2"/>
    <rect x="5" y="60" width="15" height="25" fill="#10b981" rx="2"/>
    <path d="M25 25 L27 28 M33 25 L31 28" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Decorative Sale Accents -->
  <circle cx="40" cy="70" r="5" fill="#fbbf24"/>
  <circle cx="190" cy="180" r="8" fill="#fbbf24"/>
  <path d="M190 170 L190 190 M180 180 L200 180" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Floor/Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
</svg>