<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Clinic Wall -->
  <rect x="20" y="40" width="200" height="140" rx="8" fill="#334155"/>
  <rect x="30" y="50" width="180" height="120" rx="4" fill="#1e293b"/>
  
  <!-- Medical Equipment (The "Investment" aspect) -->
  <path d="M50 130 h40 v40 h-40 z" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="150" r="12" fill="#f59e0b"/>
  <rect x="68" y="142" width="4" height="16" fill="#0f172a"/>
  <rect x="62" y="148" width="16" height="4" fill="#0f172a"/>
  
  <!-- Doctor Character -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L30 40 L35 90 L5 90 Z" fill="#38bdf8"/>
    <rect x="15" y="35" width="10" height="10" fill="#fbbf24"/>
  </g>
  
  <!-- Patient Character -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="12" fill="#ec4899"/>
    <path d="M5 35 L35 35 L30 80 L10 80 Z" fill="#94a3b8"/>
  </g>
  
  <!-- Modern Medical Monitor -->
  <rect x="160" y="60" width="40" height="30" rx="4" fill="#10b981"/>
  <path d="M165 75 L175 65 L185 80 L195 70" stroke="#fff" stroke-width="2" fill="none"/>
  
  <!-- Floor/Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <path d="M0 180 L240 180 L230 240 L10 240 Z" fill="#334155"/>
  
  <!-- Decorative Light Accents -->
  <circle cx="200" cy="30" r="3" fill="#fb923c"/>
  <circle cx="220" cy="50" r="2" fill="#fb923c"/>
</svg>