<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="150" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Bowl of Rice -->
  <path d="M60 150 Q60 175 85 175 Q110 175 110 150 Z" fill="#e2e8f0"/>
  <path d="M65 145 Q85 135 105 145 Z" fill="#f8fafc"/>
  <circle cx="75" cy="148" r="3" fill="#cbd5e1"/>
  <circle cx="95" cy="147" r="2" fill="#cbd5e1"/>
  
  <!-- Bowl of Noodles -->
  <path d="M130 150 Q130 175 155 175 Q180 175 180 150 Z" fill="#f59e0b"/>
  <path d="M135 140 Q150 130 165 140 Q175 135 175 130 Q155 120 135 130 Z" fill="#fbbf24"/>
  <path d="M140 135 Q155 125 170 135" stroke="#fb923c" stroke-width="2" fill="none"/>
  
  <!-- Character: Person sitting -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 20 Q-40 60 0 60 Q40 60 40 20 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -15 Q-25 -40 0 -40 Q25 -40 25 -15 Z" fill="#1e293b"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-15" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-15" r="3" fill="#0f172a"/>
    <!-- Hands -->
    <rect x="-35" y="30" width="10" height="20" rx="5" fill="#fde68a"/>
    <rect x="25" y="30" width="10" height="20" rx="5" fill="#fde68a"/>
  </g>
  
  <!-- Decorative steam/atmosphere -->
  <circle cx="155" cy="110" r="2" fill="#fb923c" opacity="0.6"/>
  <circle cx="160" cy="105" r="3" fill="#fb923c" opacity="0.4"/>
  <circle cx="165" cy="100" r="2" fill="#fb923c" opacity="0.2"/>
</svg>