<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table -->
  <path d="M20 180 L220 180 L210 210 L30 210 Z" fill="#475569"/>
  <path d="M20 180 L220 180 L225 190 L15 190 Z" fill="#64748b"/>
  
  <!-- Person (Upper body) -->
  <circle cx="120" cy="110" r="35" fill="#fde68a"/>
  <path d="M90 140 C90 170, 150 170, 150 140 L140 120 L100 120 Z" fill="#38bdf8"/>
  
  <!-- Bowl of Soy Milk -->
  <ellipse cx="80" cy="190" rx="25" ry="15" fill="#f1f5f9"/>
  <ellipse cx="80" cy="185" rx="20" ry="10" fill="#e2e8f0"/>
  
  <!-- Youtiao (Quẩy) -->
  <g transform="rotate(-20 160 170)">
    <path d="M140 160 Q160 150 180 160 Q200 170 180 180 Q160 190 140 180 Z" fill="#fbbf24"/>
    <path d="M142 165 Q160 155 178 165" stroke="#d97706" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Steam/Atmosphere -->
  <circle cx="80" cy="160" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="75" cy="150" r="2" fill="#ffffff" opacity="0.3"/>
  
  <!-- Background elements -->
  <rect x="30" y="60" width="40" height="80" rx="5" fill="#334155"/>
  <rect x="170" y="70" width="40" height="60" rx="5" fill="#334155"/>
  <circle cx="200" cy="50" r="15" fill="#fb923c"/>
</svg>