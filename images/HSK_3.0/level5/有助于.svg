      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Cafe Scene -->
  <path d="M0 180h240v60H0z" fill="#334155"/>
  <path d="M20 180h200v10H20z" fill="#475569"/>
  
  <!-- Table -->
  <path d="M70 160h100v10H70z" fill="#fb923c"/>
  <path d="M80 170l-10 40h10l10-40z" fill="#94a3b8"/>
  <path d="M160 170l10 40h-10l-10-40z" fill="#94a3b8"/>
  
  <!-- Character 1 (Local) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <path d="M10 25h20" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <rect x="5" y="40" width="30" height="60" rx="5" fill="#38bdf8"/>
    <path d="M5 50h30" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Character 2 (Learner) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#fcd34d"/>
    <path d="M10 25h20" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <rect x="5" y="40" width="30" height="60" rx="5" fill="#ec4899"/>
    <path d="M5 50h30" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Speech Bubbles (Abstract representation of conversation) -->
  <ellipse cx="110" cy="70" rx="20" ry="15" fill="#10b981" opacity="0.8"/>
  <ellipse cx="130" cy="60" rx="15" ry="10" fill="#10b981" opacity="0.6"/>
  
  <!-- Coffee Cups -->
  <circle cx="90" cy="155" r="8" fill="#fbbf24"/>
  <circle cx="150" cy="155" r="8" fill="#fbbf24"/>
  
  <!-- Background Details -->
