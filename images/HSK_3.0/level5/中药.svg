<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- The Medicine Bowl -->
  <path d="M80 160 C80 185, 160 185, 160 160 Z" fill="#78350f"/>
  <path d="M85 165 C85 180, 155 180, 155 165 Z" fill="#451a03"/>
  <path d="M120 150 L120 165" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character: Person drinking -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M20 120 C20 90, 80 90, 80 120" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="70" r="25" fill="#fde68a"/>
    <!-- Expression: Bitter face -->
    <path d="M40 75 Q50 85 60 75" stroke="#451a03" stroke-width="2" fill="none"/>
    <circle cx="42" cy="65" r="2" fill="#451a03"/>
    <circle cx="58" cy="65" r="2" fill="#451a03"/>
    <!-- Hand holding bowl -->
    <path d="M70 100 L90 140" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Health/Effect Symbolism (Positive) -->
  <g transform="translate(160, 80)">
    <path d="M0 0 L10 20 L30 0 L10 40 Z" fill="#10b981"/>
    <circle cx="15" cy="10" r="5" fill="#ec4899"/>
  </g>
  
  <!-- Background Details -->
  <rect x="170" y="40" width="40" height="60" fill="#1e293b" stroke="#475569" stroke-width="2" rx="4"/>
  <circle cx="190" cy="60" r="10" fill="#fb923c"/>
  <rect x="185" y="75" width="10" height="20" fill="#fb923c"/>
  
  <!-- Steam/Vapor -->
  <path d="M120 140 Q130 120, 120 100" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M130 140 Q140 120, 130 100" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.3"/>
</svg>