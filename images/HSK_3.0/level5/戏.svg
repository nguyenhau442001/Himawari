<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#475569"/>
  <rect x="50" y="175" width="10" height="65" fill="#334155"/>
  <rect x="180" y="175" width="10" height="65" fill="#334155"/>
  
  <!-- Radio -->
  <rect x="120" y="110" width="60" height="50" rx="6" fill="#fbbf24"/>
  <rect x="130" y="120" width="40" height="20" rx="2" fill="#0f172a"/>
  <circle cx="150" cy="150" r="5" fill="#1e293b"/>
  <rect x="170" y="115" width="5" height="10" rx="1" fill="#f59e0b"/>
  
  <!-- Grandfather -->
  <g transform="translate(40, 80)">
    <!-- Body -->
    <path d="M20 140 C20 100, 80 100, 80 140 L80 160 L20 160 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="80" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M30 75 Q50 50 70 75" fill="#cbd5e1"/>
    <!-- Glasses -->
    <circle cx="40" cy="80" r="5" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="60" cy="80" r="5" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="45" y1="80" x2="55" y2="80" stroke="#1e293b" stroke-width="1"/>
    <!-- Arm -->
    <path d="M75 110 L95 130" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Sound waves -->
  <path d="M185 120 Q195 110 205 120" stroke="#fb923c" stroke-width="2" fill="none"/>
  <path d="M185 130 Q205 110 225 130" stroke="#fb923c" stroke-width="2" fill="none"/>
  
  <!-- Decor -->
  <circle cx="200" cy="50" r="20" fill="#10b981" opacity="0.3"/>
  <rect x="20" y="40" width="30" height="40" rx="4" fill="#ec4899" opacity="0.2"/>
</svg>