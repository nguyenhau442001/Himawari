<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Market Stall Counter -->
  <path d="M30 180 L210 180 L200 220 L40 220 Z" fill="#334155"/>
  <rect x="30" y="170" width="180" height="15" fill="#475569"/>
  
  <!-- Price Tags -->
  <rect x="50" y="140" width="40" height="25" rx="4" fill="#fbbf24"/>
  <rect x="150" y="140" width="40" height="25" rx="4" fill="#fbbf24"/>
  
  <!-- Upward Arrows indicating price rise -->
  <path d="M60 155 L70 145 L80 155" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M160 155 L170 145 L180 155" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Character: Shopper -->
  <g transform="translate(140, 90)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35 Q20 50 30 35" stroke="#fde68a" stroke-width="3" fill="none"/>
    <rect x="5" y="50" width="30" height="60" rx="5" fill="#38bdf8"/>
    <path d="M5 60 L-10 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M35 60 L50 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Character: Shopkeeper -->
  <g transform="translate(40, 90)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 25 L30 25" stroke="#0f172a" stroke-width="2"/>
    <rect x="5" y="50" width="30" height="60" rx="5" fill="#ec4899"/>
    <path d="M20 50 L20 100" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Floating Price Icons -->
  <circle cx="120" cy="60" r="12" fill="#fb923c"/>
  <path d="M120 55 L120 65 M115 60 L125 60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  
  <circle cx="180" cy="40" r="8" fill="#10b981"/>
  <path d="M180 37 L180 43 M177 40 L183 40" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>