<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- The Advanced Equipment (Large futuristic machine) -->
  <g transform="translate(130, 100)">
    <rect x="0" y="0" width="70" height="90" rx="4" fill="#334155"/>
    <rect x="10" y="15" width="50" height="40" rx="2" fill="#1e293b"/>
    <circle cx="35" cy="35" r="12" fill="#38bdf8" opacity="0.3"/>
    <circle cx="35" cy="35" r="6" fill="#f59e0b"/>
    <rect x="15" y="65" width="40" height="10" rx="1" fill="#475569"/>
    <rect x="20" y="75" width="30" height="5" rx="1" fill="#fb923c"/>
  </g>
  
  <!-- Shipping Crate (Open) -->
  <path d="M110 190 L180 190 L190 170 L120 170 Z" fill="#475569"/>
  <path d="M110 190 L120 170 L120 130 L110 150 Z" fill="#334155"/>
  
  <!-- Character 1 (Pointing/Directing) -->
  <g transform="translate(40, 110)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <path d="M20 35 L20 70 M20 45 L5 60 M20 45 L35 55" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 55 L50 45" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (Holding Clipboard/Checking) -->
  <g transform="translate(80, 130)">
    <circle cx="20" cy="20" r="12" fill="#cbd5e1"/>
    <rect x="15" y="35" width="10" height="30" fill="#cbd5e1"/>
    <rect x="30" y="40" width="15" height="20" rx="2" fill="#f59e0b"/>
  </g>
  
  <!-- Ambient Light/Glows -->
  <circle cx="165" cy="135" r="40" fill="#38bdf8" opacity="0.05"/>
  <circle cx="50" cy="150" r="30" fill="#fb923c" opacity="0.05"/>
</svg>