<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Wooden Table -->
  <rect x="20" y="160" width="200" height="15" rx="2" fill="#78350f"/>
  <rect x="30" y="175" width="10" height="50" fill="#92400e"/>
  <rect x="200" y="175" width="10" height="50" fill="#92400e"/>
  
  <!-- Traditional Cabinet Background -->
  <rect x="140" y="40" width="80" height="120" rx="4" fill="#451a03"/>
  <g fill="#f59e0b">
    <rect x="145" y="45" width="35" height="25" rx="1"/>
    <rect x="185" y="45" width="30" height="25" rx="1"/>
    <rect x="145" y="75" width="35" height="25" rx="1"/>
    <rect x="185" y="75" width="30" height="25" rx="1"/>
    <rect x="145" y="105" width="35" height="25" rx="1"/>
    <rect x="185" y="105" width="30" height="25" rx="1"/>
  </g>
  
  <!-- Grandfather -->
  <g transform="translate(130, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 25 Q20 35 30 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="60" rx="5" fill="#1e40af"/>
    <rect x="15" y="100" width="5" height="30" fill="#1e40af"/>
    <rect x="25" y="100" width="5" height="30" fill="#1e40af"/>
  </g>
  
  <!-- Child -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="50" rx="5" fill="#ec4899"/>
    <rect x="12" y="85" width="6" height="30" fill="#ec4899"/>
    <rect x="22" y="85" width="6" height="30" fill="#ec4899"/>
  </g>
  
  <!-- Props: Herbs and Book -->
  <path d="M60 150 L100 150 L95 160 L65 160 Z" fill="#fb923c"/>
  <rect x="70" y="140" width="20" height="10" fill="#fbbf24"/>
  <rect x="100" y="145" width="30" height="15" rx="2" fill="#f8fafc"/>
  <path d="M105 148 L125 148 M105 152 L125 152" stroke="#334155" stroke-width="1"/>
  
  <!-- Acupuncture Needle/Tool -->
  <line x1="110" y1="130" x2="110" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="110" cy="128" r="2" fill="#fbbf24"/>
  
  <!-- Decorative Window Light -->
  <rect x="20" y="20" width="60" height="60" rx="10" stroke="#334155" stroke-width="2" fill="none"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#334155" stroke-width="2"/>
</svg>