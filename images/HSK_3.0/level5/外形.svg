<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Garden Table -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#475569"/>
  <rect x="60" y="175" width="10" height="50" fill="#334155"/>
  <rect x="170" y="175" width="10" height="50" fill="#334155"/>
  
  <!-- The Plant (The subject) -->
  <g transform="translate(120, 155)">
    <!-- Stem -->
    <rect x="-4" y="-60" width="8" height="60" fill="#10b981"/>
    <!-- Umbrella-shaped leaves -->
    <path d="M-50,-60 C-50,-100 50,-100 50,-60 L 0,-60 Z" fill="#38bdf8" opacity="0.9"/>
    <path d="M-50,-60 L-30,-75 L-10,-60 L10,-75 L30,-60 L50,-75 L50,-60 Z" fill="#0ea5e9"/>
  </g>
  
  <!-- Character: A curious person pointing at the plant -->
  <g transform="translate(60, 120)">
    <!-- Body -->
    <path d="M0,100 C0,80 40,80 40,100 L40,120 L0,120 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="20" cy="70" r="20" fill="#fde68a"/>
    <!-- Arm pointing -->
    <path d="M35,90 L60,70 L65,75" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="28" cy="65" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="190" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="40" r="2" fill="#fbbf24"/>
  <circle cx="30" cy="40" r="4" fill="#fbbf24"/>
  <path d="M180,100 Q200,80 220,100" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>