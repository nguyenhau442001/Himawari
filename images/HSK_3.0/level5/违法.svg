      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Street Environment -->
  <path d="M0 180h240v60H0z" fill="#334155"/>
  <path d="M0 180h240v4H0z" fill="#475569"/>
  <path d="M20 200h40v4H20zM100 200h40v4H100zM180 200h40v4H180z" fill="#fbbf24"/>
  
