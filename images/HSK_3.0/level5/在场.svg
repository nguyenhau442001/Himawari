<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 L240 180" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Accident Context (Car) -->
  <g transform="translate(140, 150)">
    <rect x="0" y="0" width="60" height="30" rx="4" fill="#ec4899"/>
    <circle cx="15" cy="30" r="8" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="45" cy="30" r="8" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <rect x="10" y="5" width="20" height="15" fill="#f8fafc" opacity="0.3"/>
  </g>

  <!-- Crowd (The people "at the scene") -->
  <!-- Person 1 -->
  <g transform="translate(30, 160)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M2 25 L18 25 L15 60 L5 60 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(60, 155)">
    <circle cx="10" cy="10" r="8" fill="#fb923c"/>
    <path d="M2 25 L18 25 L15 65 L5 65 Z" fill="#10b981"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(90, 165)">
    <circle cx="10" cy="10" r="8" fill="#f59e0b"/>
    <path d="M2 25 L18 25 L15 55 L5 55 Z" fill="#ec4899"/>
  </g>

  <!-- Person 4 (Pointing) -->
  <g transform="translate(115, 150)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M2 25 L18 25 L15 70 L5 70 Z" fill="#38bdf8"/>
    <path d="M15 25 L30 15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Street Lamp/Atmosphere -->
  <rect x="200" y="50" width="4" height="130" fill="#94a3b8"/>
  <circle cx="202" cy="50" r="12" fill="#fbbf24" opacity="0.2"/>
  <circle cx="202" cy="50" r="6" fill="#fef3c7"/>
</svg>