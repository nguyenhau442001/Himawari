<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Checklist/Board -->
  <rect x="150" y="40" width="60" height="100" rx="4" fill="#f8fafc"/>
  <rect x="160" y="50" width="40" height="8" rx="2" fill="#10b981"/>
  <rect x="160" y="70" width="40" height="8" rx="2" fill="#10b981"/>
  <rect x="160" y="90" width="30" height="8" rx="2" fill="#fb923c"/>
  <rect x="160" y="110" width="20" height="8" rx="2" fill="#38bdf8"/>
  
  <!-- Character -->
  <g transform="translate(40, 80)">
    <circle cx="40" cy="40" r="30" fill="#fbbf24"/>
    <path d="M25 40 Q40 55 55 40" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="30" cy="35" r="3" fill="#0f172a"/>
    <circle cx="50" cy="35" r="3" fill="#0f172a"/>
    <rect x="20" y="80" width="40" height="90" rx="10" fill="#38bdf8"/>
