<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Doorway Frame -->
  <path d="M70 40 L170 40 L170 210 L70 210 Z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="80" y="50" width="80" height="160" fill="#0f172a"/>
  
  <!-- Host (Standing at door) -->
  <g transform="translate(100, 80)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M15 22 Q20 28 25 22" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="10" y="35" width="20" height="40" rx="4" fill="#38bdf8"/>
    <rect x="5" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
    <rect x="25" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
    <rect x="12" y="75" width="6" height="40" fill="#475569"/>
    <rect x="22" y="75" width="6" height="40" fill="#475569"/>
  </g>
  
  <!-- Guest (Entering) -->
  <g transform="translate(160, 100)">
    <circle cx="20" cy="20" r="10" fill="#fb923c"/>
    <rect x="10" y="35" width="20" height="50" rx="4" fill="#ec4899"/>
    <rect x="12" y="85" width="6" height="30" fill="#475569"/>
    <rect x="22" y="85" width="6" height="30" fill="#475569"/>
    <path d="M25 45 L40 55 L25 60" fill="#ec4899"/>
  </g>
  
  <!-- Interior Details -->
  <circle cx="200" cy="180" r="20" fill="#10b981" opacity="0.3"/>
  <rect x="180" y="160" width="40" height="80" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Floor -->
  <rect x="0" y="210" width="240" height="30" fill="#1e293b"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2"/>
</svg>