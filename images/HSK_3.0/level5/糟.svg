<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Doorway Area -->
  <rect x="80" y="40" width="80" height="160" rx="8" fill="#334155"/>
  <rect x="85" y="45" width="70" height="150" rx="4" fill="#0f172a"/>
  <circle cx="140" cy="120" r="4" fill="#fb923c"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 L40 100 C40 80 80 80 80 100 L80 140 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="75" r="20" fill="#fde68a"/>
    <!-- Shocked Expression -->
    <path d="M50 70 Q55 65 60 70 T70 70" stroke="#1e293b" stroke-width="2" fill="none"/>
    <circle cx="53" cy="72" r="2" fill="#1e293b"/>
    <circle cx="67" cy="72" r="2" fill="#1e293b"/>
    <ellipse cx="60" cy="82" rx="4" ry="6" fill="#1e293b"/>
    <!-- Arms -->
    <path d="M40 105 L20 120" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 105 L100 120" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Floating "Forgot" indicator -->
  <g transform="translate(160, 60)">
    <path d="M10 0 L30 0 L30 20 L10 20 Z" fill="#ec4899" opacity="0.8"/>
    <circle cx="20" cy="10" r="6" fill="#1e293b"/>
    <rect x="18" y="2" width="4" height="8" fill="#1e293b"/>
  </g>
  
  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#1e293b"/>
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="2"/>
</svg>