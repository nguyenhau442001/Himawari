  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Beijing Skyline Silhouette -->
  <path d="M20 180 L60 140 L80 160 L110 130 L140 150 L180 120 L220 180 Z" fill="#334155"/>
  <circle cx="190" cy="80" r="15" fill="#f59e0b" opacity="0.3"/>
  
