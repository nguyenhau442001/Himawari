<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Glow for Love/Care -->
    <radialGradient id="loveGlow" cx="120" cy="130" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk & Interior Gradients -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="lampLight" x1="75" y1="45" x2="60" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Heart Shape -->
    <path id="tinyHeart" d="M0,3 C-3,-1 -6,1 -6,4 C-6,7 -2,10 0,13 C2,10 6,7 6,4 C6,1 3,-1 0,3 Z" fill="#fb7185"/>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Background Context -->
  <g id="environment">
    <!-- Window with night city silhouette -->
    <rect x="156" y="25" width="58" height="65" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <path d="M166,45 L172,45 L172,90 L166,90 Z M184,35 L192,35 L192,90 L184,90 Z" fill="#1e293b" opacity="0.5"/>
    <!-- City lights outside window -->
    <circle cx="164" cy="55" r="1" fill="#fde047" opacity="0.6"/>
    <circle cx="198" cy="48" r="1" fill="#38bdf8" opacity="0.6"/>
    <circle cx="204" cy="70" r="1.5" fill="#f43f5e" opacity="0.6"/>

    <!-- Bookshelf / Warm Ambient Light -->
    <rect x="24" y="35" width="45" height="50" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="30" y="50" width="10" height="25" rx="1" fill="#f97316" opacity="0.7"/>
    <rect x="42" y="47" width="8" height="28" rx="1" fill="#0ea5e9" opacity="0.7"/>
    <rect x="52" y="53" width="12" height="22" rx="1" fill="#10b981" opacity="0.7"/>
    <rect x="28" y="75" width="37" height="3" fill="#334155"/>

    <!-- Ambient Glow from Parent's care -->
    <circle cx="120" cy="130" r="100" fill="url(#loveGlow)"/>
  </g>

  <!-- Desk & Study Props -->
  <g id="desk-and-props">
    <!-- Desk surface -->
    <rect x="15" y="165" width="210" height="55" rx="4" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Desk Lamp -->
    <path d="M75,165 L75,115 L65,95" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M52,85 C52,80 60,75 70,75 C80,75 88,80 88,85 L80,95 L60,95 Z" fill="#cbd5e1"/>
    <!-- Lamp Light Cone -->
    <polygon points="70,95 25,185 115,185" fill="url(#lampLight)"/>

    <!-- Open Notebook / Textbook on Desk -->
    <path d="M95,158 C105,152 120,152 130,158 L130,188 C120,182 105,182 95,188 Z" fill="#f8fafc"/>
    <path d="M112,154 L112,185" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Notebook lines -->
    <line x1="100" y1="165" x2="108" y2="167" stroke="#94a3b8" stroke-width="1"/>
    <line x1="100" y1="172" x2="108" y2="174" stroke="#94a3b8" stroke-width="1"/>
    <line x1="117" y1="165" x2="125" y2="167" stroke="#94a3b8" stroke-width="1"/>
    <line x1="117" y1="172" x2="125" y2="174" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Pencil holder & mug -->
    <rect x="145" y="145" width="16" height="22" rx="3" fill="#38bdf8"/>
    <path d="M149,145 L149,138" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M157,145 L157,136" stroke="#f43f5e" stroke-width="2"/>
    
    <!-- Warm Mug of Milk / Tea for the Child -->
    <rect x="75" y="152" width="14" height="16" rx="2" fill="#fb923c"/>
    <path d="M89,155 C93,155 93,163 89,163" fill="none" stroke="#fb923c" stroke-width="2"/>
    <!-- Steam wisps -->
    <path d="M80,145 C82,142 78,138 80,135" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Characters: Child (Zǐnǚ) studying & Parent (Fùmǔ) lovingly caring -->
  <g id="characters">
    
    <!-- CHILD (Daughter/Son - 子女) sitting at desk -->
    <g id="child">
      <!-- Chair back -->
      <rect x="102" y="115" width="22" height="55" rx="6" fill="#475569"/>
      <!-- Body / Hoodie -->
      <path d="M102,145 C102,130 115,125 125,125 C135,125 148,130 148,145 L152,185 C152,188 148,190 145,190 L105,190 C102,190 98,188 98,185 Z" fill="#0284c7"/>
      <!-- Hoodie pocket & drawstring -->
      <path d="M115,170 L135,170 L133,185 L117,185 Z" fill="#0369a1"/>
      <line x1="120" y1="135" x2="118" y2="150" stroke="#bae6fd" stroke-width="1.5"/>
      <line x1="130" y1="135" x2="132" y2="150" stroke="#bae6fd" stroke-width="1.5"/>

      <!-- Arms bent resting on desk -->
      <path d="M105,145 L95,165 L112,168" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M145,145 L155,165 L135,168" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Hands -->
      <circle cx="112" cy="168" r="4" fill="#ffedd5"/>
      <circle cx="135" cy="168" r="4" fill="#ffedd5"/>

      <!-- Neck & Head -->
      <rect x="118" y="115" width="14" height="15" fill="#ffedd5"/>
      <!-- Head -->
      <circle cx="125" cy="105" r="16" fill="#ffedd5"/>
      <!-- Hair (Friendly stylized student hair) -->
      <path d="M109,105 C109,92 118,90 125,90 C132,90 141,92 141,105 C141,112 138,110 135,115 L115,115 C112,110 109,112 109,105 Z" fill="#334155"/>
      <path d="M113,100 C116,95 125,94 133,97" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

      <!-- Focused, happy facial expression -->
      <!-- Eyes (concentrated/smiling arcs) -->
      <path d="M118,105 Q121,102 124,105" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <path d="M126,105 Q129,102 132,105" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <!-- Gentle smile -->
      <path d="M123,111 Q125,113 127,111" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Cute blush -->
      <circle cx="117" cy="109" r="2.5" fill="#f43f5e" opacity="0.3"/>
      <circle cx="133" cy="109" r="2.5" fill="#f43f5e" opacity="0.3"/>
    </g>

    <!-- PARENT (Mother/Father - 父母) standing behind, gently placing a cozy blanket or adjusting lighting with devotion -->
    <g id="parent">
      <!-- Body / Cardigan -->
      <path d="M150,110 C150,95 165,90 178,90 C191,90 206,95 206,110 L212,200 C212,205 208,208 202,208 L154,208 C148,208 144,205 144,200 Z" fill="#0d9488"/>
      <!-- Cardigan lapels / inner shirt -->
      <path d="M178,90 L165,130 L191,130 Z" fill="#f8fafc"/>
      <path d="M165,130 L165,208" stroke="#0f766e" stroke-width="3"/>
      <path d="M191,130 L191,208" stroke="#0f766e" stroke-width="3"/>

      <!-- Loving Arm reaching forward to place a warm knitted blanket over child -->
      <path d="M165,115 C150,115 135,125 120,135" fill="none" stroke="#0d9488" stroke-width="14" stroke-linecap="round"/>
      <!-- Soft Warm Blanket / Shawl held in hand -->
      <path d="M100,120 C110,115 125,120 135,135 C125,145 110,140 100,120 Z" fill="#f59e0b"/>
      <path d="M105,125 C112,122 120,126 126,133" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="3,2"/>
      
      <!-- Parent Hand -->
      <circle cx="118" cy="136" r="5" fill="#ffedd5"/>

      <!-- Neck & Head -->
      <rect x="171" y="78" width="14" height="15" fill="#ffedd5"/>
      <!-- Head -->
      <circle cx="178" cy="68" r="15" fill="#ffedd5"/>
      <!-- Parent Hair (Gentle, warm wavy hair) -->
      <path d="M163,68 C163,53 172,50 178,50 C184,50 193,53 193,68 C193,75 190,72 188,78 L168,78 C166,72 163,75 163,68 Z" fill="#475569"/>
      
      <!-- Expressive Loving Face turned towards the child -->
      <!-- Soft smiling eyes -->
      <path d="M172,66 Q175,63 178,66" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M180,66 Q183,63 186,66" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Warm tender smile -->
      <path d="M176,73 Q179,76 182,73" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Warm affectionate blush -->
      <circle cx="170" cy="71" r="2" fill="#f43f5e" opacity="0.25"/>
    </g>

  </g>

  <!-- Floating Symbolic Elements of Pure Devoted Love (Care / 关爱 / 默默倾注) -->
  <g id="floating-love-symbols" transform="translate(0, -5)">
    <use href="#tinyHeart" x="140" y="90" transform="scale(1.2)" />
    <use href="#tinyHeart" x="155" y="75" transform="scale(0.8)" opacity="0.8" />
    <use href="#tinyHeart" x="130" y="70" transform="scale(1)" opacity="0.6" />
    
    <!-- Sparkles of silent warmth & dedication -->
    <path d="M110,85 L112,90 L117,92 L112,94 L110,99 L108,94 L103,92 L108,90 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M175,115 L176,118 L179,119 L176,120 L175,123 L174,120 L171,119 L174,118 Z" fill="#fbbf24" opacity="0.6"/>
  </g>

</svg>