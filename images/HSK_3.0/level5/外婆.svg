    <path d="M20 45 L35 60" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Props: Tea and Fruit -->
  <circle cx="150" cy="170" r="8" fill="#10b981"/>
  <rect x="170" y="175" width="15" height="10" rx="2" fill="#fbbf24"/>
  
  <!-- Summer Vibe -->
  <path d="M40 50 Q50 30 60 50 T80 50" stroke="#fbbf24" stroke-width="2" fill="none"/>
</svg>