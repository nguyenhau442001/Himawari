<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window/Background -->
  <rect x="30" y="30" width="180" height="100" rx="10" fill="#334155"/>
  <path d="M120 30 L120 130 M30 80 L210 80" stroke="#1e293b" stroke-width="4"/>
  <circle cx="180" cy="60" r="15" fill="#f59e0b"/>
  
  <!-- Interior Elements -->
  <path d="M40 180 L200 180 L190 240 L50 240 Z" fill="#475569"/>
  <rect x="60" y="140" width="40" height="60" rx="5" fill="#fb923c"/>
  
  <!-- Grandmother (外婆) -->
  <g transform="translate(140, 130)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40 L30 40 L35 90 L5 90 Z" fill="#ec4899"/>
    <path d="M15 90 L15 110 M25 90 L25 110" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Child -->
  <g transform="translate(60, 150)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M5 35 L35 35 L30 80 L10 80 Z" fill="#38bdf8"/>
