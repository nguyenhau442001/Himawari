<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Forum Stage -->
  <rect x="20" y="150" width="200" height="60" rx="4" fill="#334155"/>
  <path d="M40 150 L60 120 L180 120 L200 150 Z" fill="#475569"/>
  <circle cx="120" cy="100" r="30" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Scholars -->
  <!-- Scholar 1 (Left) -->
  <g transform="translate(40, 140)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <rect x="10" y="32" width="20" height="40" rx="4" fill="#38bdf8"/>
    <path d="M10 40 L5 60 M30 40 L35 60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Scholar 2 (Center) -->
  <g transform="translate(100, 130)">
    <circle cx="20" cy="20" r="14" fill="#f59e0b"/>
    <rect x="8" y="34" width="24" height="50" rx="4" fill="#ec4899"/>
    <rect x="15" y="40" width="10" height="5" fill="#fff" opacity="0.3"/>
  </g>
  
  <!-- Scholar 3 (Right) -->
  <g transform="translate(160, 140)">
    <circle cx="20" cy="20" r="12" fill="#10b981"/>
    <rect x="10" y="32" width="20" height="40" rx="4" fill="#fbbf24"/>
    <path d="M15 35 L25 35" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Decorative Lighting/Atmosphere -->
  <circle cx="50" cy="50" r="2" fill="#fbbf24"/>
  <circle cx="190" cy="60" r="3" fill="#38bdf8"/>
  <circle cx="120" cy="30" r="2" fill="#ec4899"/>
  
  <!-- Podium -->
  <rect x="100" y="170" width="40" height="40" fill="#64748b"/>
  <rect x="105" y="175" width="30" height="10" fill="#94a3b8"/>
</svg>