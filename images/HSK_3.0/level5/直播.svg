<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- TV Screen -->
  <rect x="40" y="50" width="160" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="120" cy="95" r="20" fill="#fb923c" opacity="0.2"/>
  <path d="M105 85 L135 95 L105 105 Z" fill="#f59e0b"/>
  <circle cx="120" cy="95" r="5" fill="#fff"/>
  
  <!-- TV Stand/Table -->
  <rect x="30" y="140" width="180" height="10" fill="#334155" rx="2"/>
  
  <!-- Living Room Elements -->
  <path d="M20 180 Q60 150 100 180 T180 180" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Characters -->
  <g transform="translate(60, 150)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <rect x="10" y="32" width="20" height="30" rx="4" fill="#ec4899"/>
    <path d="M10 40 L0 60 M30 40 L40 60" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(140, 155)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <rect x="10" y="32" width="20" height="30" rx="4" fill="#10b981"/>
    <path d="M10 40 L5 70 M30 40 L35 70" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Broadcast Indicator -->
  <circle cx="190" cy="60" r="4" fill="#ef4444"/>
  <circle cx="190" cy="60" r="6" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  
  <!-- Ambient Light -->
  <ellipse cx="120" cy="140" rx="80" ry="20" fill="#38bdf8" opacity="0.05"/>
