<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Store Shelf -->
  <rect x="30" y="60" width="180" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="110" width="180" height="10" rx="2" fill="#334155"/>
  
  <!-- Gift Items -->
  <circle cx="60" cy="45" r="12" fill="#fb923c"/>
  <rect x="100" y="35" width="20" height="20" rx="4" fill="#ec4899"/>
  <path d="M150 50 L160 30 L170 50 Z" fill="#10b981"/>
  <rect x="50" y="90" width="25" height="15" rx="2" fill="#38bdf8"/>
  <circle cx="110" cy="95" r="10" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(140, 130)">
    <!-- Body -->
    <path d="M-20 80 Q0 100 20 80 L15 30 L-15 30 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="18" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-18 15 Q-20 -5 0 -5 Q20 -5 18 15 Z" fill="#475569"/>
    <!-- Arm reaching -->
    <path d="M15 40 L40 55" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="45" cy="58" r="6" fill="#fde68a"/>
  </g>
  
  <!-- Focus Item (The gift being selected) -->
  <rect x="170" y="170" width="30" height="30" rx="6" fill="#f59e0b"/>
  <path d="M175 175 L195 195 M195 175 L175 195" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Spotlight Effect -->
  <ellipse cx="185" cy="185" rx="40" ry="40" fill="#fbbf24" fill-opacity="0.15"/>
</svg>