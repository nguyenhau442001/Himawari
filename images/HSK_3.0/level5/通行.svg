<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Snowing background -->
  <circle cx="40" cy="30" r="1.5" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="120" cy="50" r="2" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="200" cy="20" r="1" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="180" cy="80" r="1.5" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="60" cy="90" r="2" fill="#e2e8f0" opacity="0.4"/>

  <!-- Roadblock / Barrier -->
  <rect x="80" y="140" width="80" height="10" rx="2" fill="#fb923c"/>
  <rect x="85" y="150" width="5" height="40" fill="#475569"/>
  <rect x="150" y="150" width="5" height="40" fill="#475569"/>
  <path d="M90 140 L100 130 L110 140 Z" fill="#f59e0b"/>
  <path d="M130 140 L140 130 L150 140 Z" fill="#f59e0b"/>

  <!-- Snow drift -->
  <path d="M0 240 L0 180 Q60 160 120 180 T240 180 L240 240 Z" fill="#334155"/>
  
  <!-- Car -->
  <g transform="translate(20, 160)">
    <rect x="0" y="10" width="50" height="20" rx="4" fill="#38bdf8"/>
    <rect x="5" y="0" width="35" height="15" rx="3" fill="#38bdf8"/>
    <circle cx="12" cy="30" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="40" cy="30" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="10" y="5" width="12" height="8" fill="#e0f2fe" opacity="0.8"/>
  </g>

  <!-- Driver character -->
  <g transform="translate(35, 155)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24"/>
    <rect x="-6" y="8" width="12" height="10" fill="#ec4899"/>
    <rect x="-8" y="18" width="16" height="4" fill="#ec4899"/>
  </g>

  <!-- Warning Light -->
  <circle cx="200" cy="130" r="12" fill="#ef4444" opacity="0.3"/>
  <circle cx="200" cy="130" r="6" fill="#ef4444"/>
  <circle cx="200" cy="130" r="3" fill="#fecaca"/>
</svg>