<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Sick character (left) -->
  <g transform="translate(40, 120)">
    <circle cx="20" cy="20" r="18" fill="#fb923c"/>
    <rect x="10" y="45" width="20" height="50" rx="5" fill="#f1f5f9"/>
    <path d="M15 45 L5 80 M25 45 L35 80" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
    <path d="M12 28 Q20 22 28 28" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="5" y="38" width="30" height="8" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Meeting room table -->
  <path d="M80 180 L220 180 L200 220 L60 220 Z" fill="#334155"/>
  <ellipse cx="140" cy="180" rx="80" ry="15" fill="#475569"/>

  <!-- Active character (right) -->
  <g transform="translate(150, 90)">
    <circle cx="20" cy="20" r="18" fill="#38bdf8"/>
    <rect x="10" y="45" width="20" height="60" rx="5" fill="#e2e8f0"/>
    <path d="M15 50 L5 90 M25 50 L35 90" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
    <path d="M12 28 Q20 32 28 28" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="15" y="60" width="10" height="30" fill="#10b981"/>
  </g>

  <!-- Props: Laptop and papers -->
  <rect x="110" y="150" width="40" height="30" rx="2" fill="#f59e0b"/>
  <rect x="115" y="155" width="30" height="20" fill="#0f172a"/>
  <rect x="160" y="160" width="20" height="25" rx="1" fill="#f8fafc"/>
  <line x1="165" y1="165" x2="175" y2="165" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="165" y1="172" x2="175" y2="172" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Background elements -->
  <rect x="180" y="40" width="40" height="60" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="70" r="10" fill="#fbbf24"/>
</svg>