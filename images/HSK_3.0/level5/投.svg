<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Area -->
  <rect x="20" y="140" width="120" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="150" width="10" height="90" fill="#334155"/>
  
  <!-- Trash Can -->
  <path d="M160 160 L210 160 L205 220 L165 220 Z" fill="#475569"/>
  <ellipse cx="185" cy="160" rx="25" ry="6" fill="#64748b"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M20 80 Q20 120 60 120 L60 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="40" cy="50" r="25" fill="#fde68a"/>
    <!-- Arm reaching -->
    <path d="M60 85 L110 60" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand holding paper -->
    <circle cx="115" cy="55" r="8" fill="#f1f5f9"/>
  </g>
  
  <!-- Paper in mid-air -->
  <path d="M130 65 Q145 60 160 80" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 6"/>
  <circle cx="165" cy="90" r="6" fill="#f1f5f9"/>
  
  <!-- Environment Details -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="210" cy="30" r="2" fill="#fbbf24"/>
  <rect x="180" y="20" width="4" height="15" rx="2" fill="#fb923c" opacity="0.5"/>
  
  <!-- Floor shadow -->
  <ellipse cx="185" cy="225" rx="30" ry="5" fill="#0f172a" opacity="0.3"/>
</svg>