<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>

  <!-- Detective/Researcher Character -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="30" r="25" fill="#fde68a"/>
    <path d="M15 35 Q30 45 45 35" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#1e293b"/>
    <circle cx="40" cy="25" r="3" fill="#1e293b"/>
    <path d="M10 70 L50 70 L45 120 L15 120 Z" fill="#38bdf8"/>
    <rect x="25" y="60" width="10" height="15" fill="#fde68a"/>
  </g>

  <!-- Evidence Papers -->
  <rect x="130" y="110" width="60" height="40" rx="2" fill="#f1f5f9"/>
  <line x1="140" y1="120" x2="180" y2="120" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="140" y1="130" x2="160" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Magnifying Glass -->
  <g transform="translate(150, 90)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <rect x="10" y="10" width="20" height="4" rx="2" fill="#fbbf24" transform="rotate(45 10 10)"/>
  </g>

  <!-- Empty/Missing Evidence Indicator -->
  <g transform="translate(160, 150)">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#ec4899" stroke-width="3"/>
    <path d="M-6 -6 L6 6 M-6 6 L6 -6" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ambient light glow -->
  <circle cx="180" cy="60" r="40" fill="#fb923c" opacity="0.05"/>
</svg>