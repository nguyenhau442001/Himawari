<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#334155"/>
  <rect x="50" y="175" width="10" height="65" fill="#1e293b"/>
  <rect x="180" y="175" width="10" height="65" fill="#1e293b"/>
  
  <!-- Papers and Laptop -->
  <rect x="60" y="145" width="70" height="15" rx="2" fill="#cbd5e1"/>
  <rect x="140" y="130" width="50" height="30" rx="4" fill="#64748b"/>
  <rect x="145" y="135" width="40" height="20" rx="2" fill="#0f172a"/>
  
  <!-- Character Body -->
  <path d="M80 180 Q120 180 120 240 H40 V180 Z" fill="#38bdf8"/>
  
  <!-- Head and Neck -->
  <circle cx="80" cy="120" r="25" fill="#fde68a"/>
  <rect x="75" y="140" width="10" height="20" fill="#fde68a"/>
  
  <!-- Hair -->
  <path d="M60 110 C60 90 100 90 100 110 C100 100 90 100 85 105 C80 95 70 95 65 105 Z" fill="#1e293b"/>
  
  <!-- The Glance (Action) -->
  <g transform="translate(80, 120)">
    <ellipse cx="-8" cy="-5" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="8" cy="-5" rx="3" ry="4" fill="#0f172a"/>
    <path d="M-10 5 Q0 10 10 5" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- The "Other" person (The one being looked at) -->
  <circle cx="180" cy="100" r="15" fill="#ec4899" opacity="0.8"/>
  <path d="M170 115 L190 115 L185 160 L175 160 Z" fill="#ec4899" opacity="0.6"/>
  
  <!-- Desk Lamp Glow -->
  <circle cx="150" cy="120" r="30" fill="#fbbf24" opacity="0.1"/>
  <path d="M140 130 L160 130 L170 100 L130 100 Z" fill="#fb923c" opacity="0.3"/>
</svg>