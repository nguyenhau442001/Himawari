<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Sand pit -->
  <path d="M20 180 Q 120 160 220 180 L 220 220 L 20 220 Z" fill="#fb923c" opacity="0.6"/>
  <ellipse cx="160" cy="190" rx="30" ry="10" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Track line -->
  <rect x="0" y="170" width="80" height="10" fill="#38bdf8"/>
  
  <!-- Character (The younger sister) -->
  <g transform="translate(80, 120)">
    <!-- Body -->
    <path d="M10 20 L 30 60 L 10 60 Z" fill="#ec4899"/>
    <!-- Legs -->
    <path d="M15 60 L 5 80 M25 60 L 35 80" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M10 30 L -10 50 M30 30 L 50 40" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="20" cy="15" r="15" fill="#fde68a"/>
    <circle cx="15" cy="12" r="2" fill="#1e293b"/>
    <circle cx="25" cy="12" r="2" fill="#1e293b"/>
    <path d="M15 20 Q 20 24 25 20" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Scoreboard/Indicator -->
  <rect x="180" y="40" width="40" height="30" rx="4" fill="#10b981"/>
  <path d="M190 55 L 200 65 L 215 45" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Background elements -->
  <circle cx="200" cy="30" r="10" fill="#fbbf24" opacity="0.3"/>
  <path d="M0 170 L 240 170" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
</svg>