<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light/Window reflection in background -->
  <path d="M 160 30 L 210 30 L 190 120 L 140 120 Z" fill="#334155" opacity="0.15"/>
  <circle cx="120" cy="90" r="70" fill="url(#lampGlow)"/>

  <!-- Bookshelf / Environment details -->
  <rect x="25" y="45" width="40" height="8" rx="2" fill="#475569"/>
  <rect x="30" y="25" width="8" height="20" rx="1" fill="#ec4899"/>
  <rect x="40" y="22" width="10" height="23" rx="1" fill="#38bdf8"/>
  <rect x="52" y="28" width="8" height="17" rx="1" fill="#10b981"/>

  <!-- Desk Surface -->
  <path d="M 20 185 L 220 185 L 230 220 L 10 220 Z" fill="url(#deskGrad)"/>
  <rect x="15" y="180" width="210" height="7" rx="3" fill="#64748b"/>

  <!-- Magnifying Glass (Symbolizing "Facts/Evidence") -->
  <g transform="translate(145, 130) rotate(-15)">
    <!-- Glass shadow -->
    <circle cx="0" cy="0" r="26" fill="#000" opacity="0.3"/>
    <!-- Glass rim -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#fbbf24" stroke-width="5"/>
    <!-- Glass inner reflection -->
    <circle cx="0" cy="0" r="21" fill="#38bdf8" opacity="0.2"/>
    <path d="M -12 -12 Q 0 -20 12 -12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Handle -->
    <rect x="-5" y="20" width="10" height="32" rx="4" fill="#d97706"/>
    <circle cx="0" cy="48" r="5" fill="#b45309"/>
  </g>

  <!-- Document / Folder ("Facts" base) -->
  <g transform="translate(60, 150)">
    <polygon points="0,35 12,10 75,10 87,35" fill="#cbd5e1"/>
    <rect x="5" y="30" width="90" height="45" rx="4" fill="#f8fafc"/>
    <!-- Abstract data lines representing facts -->
    <rect x="15" y="40" width="45" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="15" y="52" width="65" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="15" y="62" width="35" height="4" rx="2" fill="#cbd5e1"/>
    <!-- Checkmark badge (Verified fact) -->
    <circle cx="75" cy="55" r="8" fill="#10b981"/>
    <path d="M 71 55 L 74 58 L 80 51" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Secondary Document (Comparison) -->
  <g transform="translate(35, 165) rotate(-8)">
    <rect x="0" y="0" width="50" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="8" y="8" width="25" height="4" rx="2" fill="#94a3b8"/>
    <rect x="8" y="16" width="34" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="8" y="23" width="20" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>

  <!-- Character: Analyst / Decision Maker -->
  <g transform="translate(100, 75)">
    <!-- Body / Torso -->
    <path d="M 15 85 C 15 65 35 60 55 60 C 75 60 95 65 95 85 L 110 120 C 110 120 85 125 55 125 C 25 125 0 120 0 120 Z" fill="#2563eb"/>
    <!-- Collar / Shirt -->
    <polygon points="45,60 55,75 65,60" fill="#f8fafc"/>
    <polygon points="51,60 55,68 59,60" fill="#dc2626"/>

    <!-- Neck -->
    <rect x="45" y="48" width="20" height="18" fill="#fcd34d" rx="4"/>

    <!-- Head -->
    <circle cx="55" cy="35" r="24" fill="#fcd34d"/>

    <!-- Hair -->
    <path d="M 31 35 C 31 18 43 12 55 12 C 67 12 79 18 79 35 C 79 38 78 40 77 40 C 70 30 50 25 33 40 C 32 38 31 36 31 35 Z" fill="#334155"/>

    <!-- Glasses -->
    <rect x="39" y="26" width="14" height="10" rx="3" fill="none" stroke="#1e293b" stroke-width="2"/>
    <rect x="57" y="26" width="14" height="10" rx="3" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="53" y1="30" x2="57" y2="30" stroke="#1e293b" stroke-width="2"/>

    <!-- Confident Expression / Eyebrows -->
    <line x1="41" y1="23" x2="51" y2="24" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="59" y1="24" x2="69" y2="23" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 48 44 Q 55 49 62 44" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm (Reaching out, pointing/holding) -->
    <path d="M 15 75 C 5 85 -5 100 -10 115" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-12" cy="118" r="6" fill="#fcd34d"/>

    <!-- Right Arm (Hand supporting chin - thoughtful pose) -->
    <path d="M 90 80 C 105 85 100 105 85 110" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <circle cx="82" cy="112" r="6" fill="#fcd34d"/>
  </g>

  <!-- Decision / Lightbulb or Checkmark concept floating above -->
  <g transform="translate(155, 60)">
    <circle cx="0" cy="0" r="16" fill="#fbbf24" opacity="0.2"/>
    <!-- Glowing checkmark representing final judgment/conclusion -->
    <circle cx="0" cy="0" r="12" fill="#10b981"/>
    <path d="M -5 0 L -1 4 L 6 -3" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>