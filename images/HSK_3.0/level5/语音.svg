<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm ambient glow for the room -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Chat Bubble Gradient -->
    <linearGradient id="bubble-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="phone-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Lighting Effect -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- Room Interior Elements -->
  <!-- Window / Night City Vibe in background -->
  <path d="M160 40 L210 40 L210 110 L160 110 Z" fill="#1e293b" stroke="#334155" stroke-width="2" rx="4"/>
  <rect x="170" y="50" width="12" height="18" rx="2" fill="#38bdf8" opacity="0.3"/>
  <rect x="190" y="70" width="12" height="25" rx="2" fill="#fbbf24" opacity="0.2"/>
  <line x1="185" y1="40" x2="185" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="2"/>

  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="60" width="45" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="75" width="35" height="4" fill="#334155"/>
  <rect x="30" y="95" width="35" height="4" fill="#334155"/>
  <rect x="35" y="68" width="8" height="7" rx="1" fill="#ec4899"/>
  <rect x="45" y="65" width="6" height="10" rx="1" fill="#38bdf8"/>

  <!-- Desk Surface -->
  <path d="M 10 175 L 230 175 L 220 210 L 20 210 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="170" width="240" height="8" fill="#334155" rx="2"/>

  <!-- Desk Lamp -->
  <path d="M 200 170 L 200 110 L 210 110 L 210 170 Z" fill="#475569"/>
  <path d="M 180 100 C 180 90 200 85 215 95 C 225 102 225 110 225 110 L 175 110 C 175 110 175 105 180 100 Z" fill="#fbbf24"/>

  <!-- Coffee Mug -->
  <rect x="35" y="150" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M 51 154 C 57 154 57 166 51 166" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>

  <!-- Main Character (Relaxed, smiling, listening to voice message) -->
  <g transform="translate(60, 70)">
    <!-- Body / Torso -->
    <path d="M 25 80 C 25 65 45 60 70 60 C 95 60 115 65 115 80 L 125 110 L 15 110 Z" fill="#38bdf8"/>
    <path d="M 70 60 L 70 110" stroke="#0f172a" stroke-width="1.5" opacity="0.2"/>
    <collar>
      <path d="M 55 60 L 70 75 L 85 60 Z" fill="#f8fafc"/>
    </collar>

    <!-- Neck -->
    <rect x="58" y="48" width="24" height="15" rx="6" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="70" cy="38" r="22" fill="#fbcfe8"/>

    <!-- Hair (Stylish modern cut) -->
    <path d="M 48 35 C 48 20 60 14 72 14 C 88 14 94 24 94 38 C 94 38 92 42 88 40 C 80 35 75 42 65 40 C 55 38 48 35 48 35 Z" fill="#1e293b"/>

    <!-- Face details -->
    <!-- Smiling closed eyes (happy listening) -->
    <path d="M 60 36 C 62 39 65 39 67 36" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 75 36 C 77 39 80 39 82 36" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="58" cy="42" r="4" fill="#fb7185" opacity="0.5"/>
    <circle cx="84" cy="42" r="4" fill="#fb7185" opacity="0.5"/>
    <!-- Gentle Smile -->
    <path d="M 67 44 C 70 47 73 47 75 44" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Ear & Earphone / AirPod style -->
    <circle cx="48" cy="38" r="3" fill="#fbcfe8"/>
    <circle cx="46" cy="37" r="2" fill="#ffffff"/>

    <!-- Arm & Hand holding phone -->
    <path d="M 30 75 C 20 85 20 100 35 105" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="38" cy="107" r="7" fill="#fbcfe8"/>

    <!-- Smartphone -->
    <g transform="translate(15, 80) rotate(-15)">
      <rect x="0" y="0" width="30" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <rect x="3" y="4" width="24" height="42" rx="3" fill="url(#phone-screen)"/>
      
      <!-- Voice message play interface inside screen -->
      <circle cx="15" cy="18" r="6" fill="#10b981"/>
      <polygon points="13,15 13,21 18,18" fill="#ffffff"/>
      <!-- Audio wave lines inside mini screen -->
      <rect x="7" y="28" width="2" height="6" rx="1" fill="#38bdf8"/>
      <rect x="11" y="26" width="2" height="10" rx="1" fill="#38bdf8"/>
      <rect x="15" y="24" width="2" height="14" rx="1" fill="#38bdf8"/>
      <rect x="19" y="27" width="2" height="8" rx="1" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Floating Voice Message Visual (Representing "语音" / Voice Message Action) -->
  <g transform="translate(130, 45)">
    <!-- Chat Bubble Body -->
    <path d="M 10 10 
             C 10 2, 18 2, 26 2 
             L 64 2 
             C 72 2, 80 2, 80 10 
             L 80 34 
             C 80 42, 72 42, 64 42 
             L 30 42 
             L 15 55 
             L 18 42 
             C 10 42, 10 42, 10 34 Z" 
          fill="url(#bubble-grad)" 
          filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.3))"/>

    <!-- Play button icon inside bubble -->
    <circle cx="28" cy="22" r="10" fill="#ffffff" opacity="0.9"/>
    <polygon points="25,18 25,26 32,22" fill="#059669"/>

    <!-- Sound Wave Bars inside bubble -->
    <rect x="43" y="17" width="3" height="10" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="48" y="13" width="3" height="18" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="53" y="15" width="3" height="14" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="58" y="19" width="3" height="6" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="63" y="16" width="3" height="12" rx="1.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Extra decorative audio wave particles floating -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="115" cy="40" r="3"/>
    <circle cx="225" cy="85" r="2"/>
    <circle cx="215" cy="70" r="4"/>
    <path d="M 120 70 Q 125 65 130 70" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 210 135 Q 215 130 220 135" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>