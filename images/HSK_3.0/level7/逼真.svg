<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Easel -->
  <path d="M70 190 L110 190 L100 160 L80 160 Z" fill="#4A5568"/>
  <path d="M90 190 L90 80" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 210 L90 190 L120 210" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Canvas Frame -->
  <rect x="70" y="60" width="100" height="100" rx="4" fill="#2D3748" stroke="#A0AEC0" stroke-width="2"/>
  
  <!-- The Realistic Bird (The subject of "逼真") -->
  <!-- Body -->
  <ellipse cx="120" cy="110" rx="25" ry="15" fill="#F6AD55"/>
  <!-- Wing -->
  <path d="M110 115 Q100 130 125 130 Q115 120 110 115" fill="#DD6B20"/>
  <!-- Head -->
  <circle cx="140" cy="100" r="12" fill="#F6AD55"/>
  <!-- Eye -->
  <circle cx="145" cy="98" r="2" fill="#1A1D24"/>
  <!-- Beak -->
  <path d="M150 100 L158 103 L150 106 Z" fill="#ECC94B"/>
  
  <!-- Artistic brush stroke effect indicating realism -->
  <path d="M80 70 L160 150" stroke="#ECC94B" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Detail: Bird perched on a branch inside the painting -->
  <path d="M80 130 Q100 135 120 130" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
</svg>