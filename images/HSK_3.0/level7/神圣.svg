<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background aura for "shénshèng" (divine/sacred) concept -->
  <circle cx="120" cy="115" r="70" fill="#FFC107" opacity="0.08"/>
  <circle cx="120" cy="115" r="50" fill="#FFC107" opacity="0.12"/>

  <!-- Halo / Divine Light Rays -->
  <g opacity="0.85">
    <path d="M120 45 L120 25" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <path d="M165 60 L180 45" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 60 L60 45" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <path d="M185 105 L205 105" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <path d="M55 105 L35 105" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Golden Laurel Wreath (Representing Honor, Sacred Duty, Citizenship) -->
  <g fill="none" stroke="#E0A96D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left branch -->
    <path d="M95 160 C70 150 60 120 65 95 C70 75 90 65 90 65"/>
    <path d="M75 110 C65 105 60 90 70 85"/>
    <path d="M85 135 C70 130 65 115 75 105"/>
    <path d="M70 85 C80 80 90 90 90 90"/>
    
    <!-- Right branch -->
    <path d="M145 160 C170 150 180 120 175 95 C170 75 150 65 150 65"/>
    <path d="M165 110 C175 105 180 90 170 85"/>
    <path d="M155 135 C170 130 175 115 165 105"/>
    <path d="M170 85 C160 80 150 90 150 90"/>
  </g>

  <!-- Central Iconic Sacred Object / Monument (Pillar of Responsibility & Honor) -->
  <g>
    <!-- Base -->
    <rect x="85" y="165" width="70" height="12" rx="3" fill="#3A4252"/>
    <rect x="92" y="157" width="56" height="8" rx="2" fill="#4E5D6C"/>

    <!-- Pillar Body (Modern Flat Style) -->
    <path d="M98 85 L142 85 L145 157 L95 157 Z" fill="#2E3846"/>
    
    <!-- Pillar fluting / highlights -->
    <path d="M112 85 L112 157" stroke="#3A4252" stroke-width="3"/>
    <path d="M128 85 L128 157" stroke="#3A4252" stroke-width="3"/>

    <!-- Capital (Top of Pillar) -->
    <rect x="92" y="77" width="56" height="8" rx="2" fill="#4E5D6C"/>
    <rect x="88" y="70" width="64" height="7" rx="2" fill="#3A4252"/>

    <!-- Radiant Star / Sacred Core Emblem -->
    <circle cx="120" cy="115" r="18" fill="#1A1D24"/>
    <circle cx="120" cy="115" r="14" fill="#FFC107"/>
    
    <!-- Star Shape inside emblem -->
    <polygon points="120,103 123,111 131,111 125,116 127,124 120,119 113,124 115,116 109,111 117,111" fill="#FFFFFF"/>
  </g>

  <!-- Floating Sparkles / Sacred Dust -->
  <g fill="#FFC107">
    <circle cx="85" cy="80" r="2" opacity="0.8"/>
    <circle cx="155" cy="75" r="2.5" opacity="0.9"/>
    <circle cx="170" cy="130" r="1.5" opacity="0.7"/>
    <circle cx="70" cy="135" r="2" opacity="0.8"/>
    <circle cx="105" cy="45" r="1.5" opacity="0.9"/>
    <circle cx="135" cy="50" r="2" opacity="0.6"/>
  </g>
</svg>