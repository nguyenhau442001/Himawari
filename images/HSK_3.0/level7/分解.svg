<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow & Soft Gradients -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Ambient lighting window frame in background -->
  <g opacity="0.15">
    <rect x="25" y="25" width="50" height="70" rx="4" fill="#38bdf8"/>
    <line x1="50" y1="25" x2="50" y2="95" stroke="#ffffff" stroke-width="2"/>
    <line x1="25" y1="60" x2="75" y2="60" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Office Plant -->
  <path d="M205 200 C205 180, 215 160, 215 145 C215 160, 225 180, 225 200 Z" fill="#10b981" opacity="0.8"/>
  <path d="M195 200 C195 185, 205 170, 210 155 C205 175, 200 185, 185 200 Z" fill="#34d399" opacity="0.8"/>
  <path d="M210 200 C210 170, 230 160, 235 150 C225 170, 220 185, 220 200 Z" fill="#059669" opacity="0.8"/>
  <path d="M190 200 L230 200 L223 218 C222 220, 220 222, 217 222 L203 222 C200 222, 198 220, 197 218 Z" fill="#64748b"/>

  <!-- Desk and Main Board Structure -->
  <!-- Wooden/Modern Desk Surface -->
  <path d="M10 220 L230 220 L240 235 L0 235 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="10" y1="220" x2="230" y2="220" stroke="#334155" stroke-width="2"/>

  <!-- Large Complex Problem Card (Top Center - Main Node) -->
  <g filter="url(#shadow)">
    <rect x="80" y="20" width="80" height="42" rx="8" fill="url(#boardGrad)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Abstract complex puzzle icon on main card -->
    <circle cx="100" cy="41" r="8" fill="#ef4444" opacity="0.8"/>
    <path d="M116 35 L136 35 M116 41 L132 41 M116 47 L126 47" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- DECOMPOSITION / SPLITTING LINES (The "Phân Giải" action) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.8">
    <path d="M120 62 L60 95"/>
    <path d="M120 62 L120 95"/>
    <path d="M120 62 L180 95"/>
  </g>

  <!-- Sparkles/Energy dots indicating the act of splitting -->
  <circle cx="95" cy="74" r="2.5" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="145" cy="74" r="2.5" fill="#fbbf24" filter="url(#glow)"/>

  <!-- STEP CARDS (The "Vài bước" / Several steps breakdown) -->
  <!-- Step 1 Card -->
  <g filter="url(#shadow)" transform="translate(15, 95)">
    <rect width="60" height="38" rx="6" fill="url(#cardGrad1)"/>
    <circle cx="16" cy="19" r="6" fill="#ffffff" opacity="0.3"/>
    <!-- Number 1 visual cue -->
    <text x="16" y="23" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
    <line x1="28" y1="15" x2="48" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="28" y1="23" x2="42" y2="23" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Step 2 Card -->
  <g filter="url(#shadow)" transform="translate(90, 95)">
    <rect width="60" height="38" rx="6" fill="url(#cardGrad2)"/>
    <circle cx="16" cy="19" r="6" fill="#ffffff" opacity="0.3"/>
    <text x="16" y="23" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">2</text>
    <line x1="28" y1="15" x2="48" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="28" y1="23" x2="40" y2="23" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Step 3 Card -->
  <g filter="url(#shadow)" transform="translate(165, 95)">
    <rect width="60" height="38" rx="6" fill="url(#cardGrad3)"/>
    <circle cx="16" cy="19" r="6" fill="#ffffff" opacity="0.3"/>
    <text x="16" y="23" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">3</text>
    <line x1="28" y1="15" x2="48" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="28" y1="23" x2="46" y2="23" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>


  <!-- CHARACTER INTERACTING (Analyzing / Decomposing) -->
  <g transform="translate(0, 15)">
    <!-- Character Torso & Shoulders -->
    <path d="M95 195 C95 175, 110 165, 120 165 C130 165, 145 175, 145 195 Z" fill="#3b82f6" filter="url(#shadow)"/>
    
    <!-- Collar & Tie/Accents -->
    <path d="M110 165 L120 178 L130 165 Z" fill="#ffffff"/>

    <!-- Neck -->
    <rect x="113" y="153" width="14" height="15" rx="4" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="120" cy="138" r="18" fill="#fbcfe8" filter="url(#shadow)"/>

    <!-- Hair (Stylized modern neat cut) -->
    <path d="M102 138 C102 124, 110 120, 120 120 C130 120, 138 124, 138 138 C138 132, 134 122, 120 122 C106 122, 102 132, 102 138 Z" fill="#1e293b"/>

    <!-- Confident, focused facial expression -->
    <!-- Eyes -->
    <circle cx="114" cy="137" r="2" fill="#0f172a"/>
    <circle cx="126" cy="137" r="2" fill="#0f172a"/>
    <!-- Gentle confident smile -->
    <path d="M117 145 Q120 148 123 145" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Active Arms & Hands pointing / organizing the steps -->
    <!-- Left arm pointing to step 1 -->
    <path d="M102 175 L75 160 L68 152" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68" cy="152" r="4" fill="#fbcfe8"/>

    <!-- Right arm gesturing towards step 3 -->
    <path d="M138 175 L165 160 L172 152" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="172" cy="152" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Foreground decorative elements for depth (Desk items) -->
  <g opacity="0.7">
    <!-- Coffee Mug -->
    <rect x="35" y="200" width="14" height="18" rx="3" fill="#cbd5e1"/>
    <path d="M49 204 C53 204, 53 214, 49 214" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    
    <!-- Pen / Stylus -->
    <line x1="180" y1="210" x2="205" y2="205" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>