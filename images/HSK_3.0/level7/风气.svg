<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="warmGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#warmGlow)"/>

  <!-- ==================== ENVIRONMENT & PROPS ==================== -->
  
  <!-- Back Wall & Architecture Details -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Floor line -->
  <line x1="20" y1="170" x2="220" y2="170" stroke="#334155" stroke-width="2"/>
  <path d="M20 170 L0 210 L240 210 L220 170 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Community Window showing a bright, harmonious neighborhood outside (symbolizing positive social atmosphere) -->
  <g>
    <!-- Window frame -->
    <rect x="145" y="35" width="60" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="40" width="50" height="75" fill="url(#windowLight)"/>
    <!-- Window Crossbars -->
    <line x1="175" y1="40" x2="175" y2="115" stroke="#475569" stroke-width="1.5"/>
    <line x1="150" y1="77" x2="200" y2="77" stroke="#475569" stroke-width="1.5"/>
    <!-- Outside elements (park trees & sun) -->
    <circle cx="165" cy="55" r="8" fill="#fbbf24" opacity="0.8"/>
    <path d="M160 85 Q165 70 170 85 Z" fill="#10b981" opacity="0.7"/>
    <path d="M180 88 Q185 72 190 88 Z" fill="#34d399" opacity="0.7"/>
    <rect x="163" y="85" width="4" height="12" fill="#78350f" opacity="0.6"/>
    <rect x="183" y="88" width="4" height="9" fill="#78350f" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Community Center Decor -->
  <g opacity="0.7">
    <rect x="35" y="45" width="30" height="60" rx="2" fill="#334155"/>
    <line x1="35" y1="65" x2="65" y2="65" stroke="#1e293b" stroke-width="2"/>
    <line x1="35" y1="85" x2="65" y2="85" stroke="#1e293b" stroke-width="2"/>
    <!-- Books -->
    <rect x="39" y="50" width="5" height="13" fill="#f43f5e" rx="1"/>
    <rect x="46" y="48" width="6" height="15" fill="#38bdf8" rx="1"/>
    <rect x="54" y="52" width="4" height="11" fill="#fbbf24" rx="1"/>
    <rect x="40" y="70" width="7" height="13" fill="#a855f7" rx="1"/>
    <rect x="49" y="72" width="5" height="11" fill="#10b981" rx="1"/>
  </g>

  <!-- Indoor Potted Plant (Adding life and warmth) -->
  <g>
    <path d="M 75 140 L 85 170 L 65 170 Z" fill="#cbd5e1"/>
    <ellipse cx="75" cy="140" rx="10" ry="3" fill="#94a3b8"/>
    <!-- Plant Stems & Leaves -->
    <path d="M75 137 Q60 110 50 115" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 137 Q90 100 105 105" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 137 Q75 100 75 95" fill="none" stroke="url(#plantGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="115" r="7" fill="#34d399"/>
    <circle cx="105" cy="105" r="8" fill="#10b981"/>
    <circle cx="75" cy="95" r="9" fill="#059669"/>
  </g>

  <!-- Community Notice Board / Collaboration Desk -->
  <g>
    <!-- Wooden Table -->
    <rect x="90" y="150" width="110" height="10" rx="2" fill="#d97706"/>
    <rect x="100" y="160" width="12" height="30" fill="#b45309"/>
    <rect x="178" y="160" width="12" height="30" fill="#b45309"/>
    <!-- Helpful community items on table: blueprints/notes and a small warm lamp -->
    <rect x="110" y="138" width="25" height="14" rx="1" fill="#f8fafc" transform="rotate(-5 110 138)"/>
    <rect x="140" y="140" width="20" height="12" rx="1" fill="#e2e8f0" transform="rotate(8 140 140)"/>
    <!-- Small desk lamp -->
    <path d="M185 150 L187 135 L193 135 L195 150 Z" fill="#fbbf24"/>
    <path d="M182 135 C182 125 198 125 198 135 Z" fill="#f59e0b"/>
  </g>

  <!-- ==================== CHARACTERS (Interacting & Helping - depicting positive social conduct) ==================== -->

  <!-- Character 1: Older Citizen / Mentor sitting or leaning -->
  <g id="character-elder">
    <!-- Body / Torso -->
    <path d="M 60 145 Q 65 120 85 120 Q 105 120 110 145 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="85" cy="102" r="14" fill="#fbcfe8"/>
    <!-- Hair (Gray/White) -->
    <path d="M 71 102 C 71 90 99 90 99 102 C 99 96 95 93 85 93 C 75 93 71 96 71 102 Z" fill="#94a3b8"/>
    <!-- Friendly Smiling Face -->
    <path d="M 81 105 Q 85 109 89 105" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="81" cy="101" r="1.5" fill="#334155"/>
    <circle cx="89" cy="101" r="1.5" fill="#334155"/>
    <!-- Arm gesturing warmly toward the young person -->
    <path d="M 100 128 Q 115 130 125 120" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="126" cy="118" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: Young Person / Volunteer actively participating -->
  <g id="character-youth">
    <!-- Body / Torso -->
    <path d="M 125 150 Q 130 122 148 122 Q 165 122 170 150 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="148" cy="100" r="14" fill="#fed7aa"/>
    <!-- Hair (Modern dark neat haircut) -->
    <path d="M 135 98 C 135 88 161 88 161 98 C 158 91 138 91 135 98 Z" fill="#1e293b"/>
    <!-- Engaged, Happy Expression -->
    <path d="M 144 104 Q 148 108 152 104" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="144" cy="99" r="1.5" fill="#334155"/>
    <circle cx="152" cy="99" r="1.5" fill="#334155"/>
    <!-- Arm reaching out / cooperating -->
    <path d="M 133 130 Q 120 135 110 125" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="108" cy="123" r="4" fill="#fed7aa"/>
  </g>

  <!-- Symbolic Interactive Object between them (A box of community donations or shared project symbolizing mutual aid) -->
  <g transform="translate(103, 128)">
    <rect x="0" y="0" width="22" height="16" rx="2" fill="#fb923c"/>
    <path d="M 0 5 L 22 5" stroke="#ea580c" stroke-width="2"/>
    <path d="M 11 0 L 11 16" stroke="#ea580c" stroke-width="2"/>
    <!-- Heart icon on the box representing care and good social morals/atmosphere -->
    <path d="M 11 8 C 10 7 8 7 8 9 C 8 11 11 13 11 13 C 11 13 14 11 14 9 C 14 7 12 7 11 8 Z" fill="#f43f5e"/>
  </g>

  <!-- Floating Sparkles / Warm Atmosphere Effects -->
  <g fill="#fbbf24">
    <circle cx="115" cy="85" r="2" opacity="0.9"/>
    <circle cx="125" cy="70" r="3" opacity="0.7"/>
    <circle cx="100" cy="78" r="1.5" opacity="0.8"/>
    <!-- Sparkle star shape -->
    <path d="M 165 70 L 167 75 L 172 77 L 167 79 L 165 84 L 163 79 L 158 77 L 163 75 Z" fill="#38bdf8" opacity="0.7"/>
    <path d="M 95 55 L 96 58 L 99 59 L 96 60 L 95 63 L 94 60 L 91 59 L 94 58 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Foreground Frame/Border subtle accent -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
</svg>