<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle network background nodes representing "cyberspace" -->
  <g opacity="0.3">
    <circle cx="50" cy="50" r="2" fill="#64748B"/>
    <circle cx="190" cy="60" r="2" fill="#64748B"/>
    <circle cx="40" cy="180" r="2" fill="#64748B"/>
    <circle cx="200" cy="170" r="2" fill="#64748B"/>
    <line x1="50" y1="50" x2="90" y2="90" stroke="#334155" stroke-width="1"/>
    <line x1="190" y1="60" x2="150" y2="100" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="180" x2="80" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="200" y1="170" x2="160" y2="130" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Central Physical Object: A sleek modern computer monitor overflowing/bursting with glowing fake info documents (representing "充斥") -->
  <!-- Monitor Stand -->
  <path d="M100 185H140V195H100Z" fill="#475569"/>
  <path d="M112 165H128V185H112Z" fill="#334155"/>
  <rect x="76" y="195" width="88" height="6" rx="3" fill="#64748B"/>

  <!-- Monitor Frame -->
  <rect x="44" y="55" width="152" height="112" rx="10" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  
  <!-- Screen Background -->
  <rect x="52" y="63" width="136" height="96" rx="4" fill="#1E293B"/>

  <!-- Overflowing items (Fake info papers bursting out) -->
  <!-- Back overflow papers -->
  <g transform="translate(0, -10)">
    <rect x="70" y="40" width="40" height="30" rx="3" fill="#EF4444" transform="rotate(-15 90 55)"/>
    <rect x="78" y="48" width="24" height="4" rx="2" fill="#FCA5A5" transform="rotate(-15 90 55)"/>
    <rect x="78" y="56" width="16" height="4" rx="2" fill="#FCA5A5" transform="rotate(-15 90 55)"/>
    
    <rect x="130" y="35" width="45" height="35" rx="3" fill="#F59E0B" transform="rotate(20 152 52)"/>
    <rect x="138" y="43" width="28" height="4" rx="2" fill="#FDE68A" transform="rotate(20 152 52)"/>
    <rect x="138" y="51" width="20" height="4" rx="2" fill="#FDE68A" transform="rotate(20 152 52)"/>
  </g>

  <!-- Center overflow papers (bursting upward) -->
  <g transform="translate(0, -15)">
    <!-- Main central warning document -->
    <rect x="95" y="25" width="50" height="40" rx="4" fill="#EF4444" stroke="#FECACA" stroke-width="2" transform="rotate(5 120 45)"/>
    <!-- Warning exclamation icon on paper -->
    <circle cx="120" cy="39" r="6" fill="#FEF2F2"/>
    <path d="M120 36V40M120 42H120.01" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <rect x="105" y="49" width="30" height="4" rx="2" fill="#FECACA"/>
    <rect x="105" y="57" width="20" height="4" rx="2" fill="#FECACA"/>
  </g>

  <!-- More chaotic flying bits (Overflowing completely) -->
  <rect x="55" y="85" width="32" height="24" rx="2" fill="#EF4444" opacity="0.9" transform="rotate(-30 71 97)"/>
  <path d="M63 93H79M63 99H73" stroke="#FEF2F2" stroke-width="2" stroke-linecap="round" transform="rotate(-30 71 97)"/>

  <rect x="155" y="80" width="34" height="26" rx="2" fill="#F59E0B" opacity="0.9" transform="rotate(25 172 93)"/>
  <path d="M163 88H179M163 94H173" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" transform="rotate(25 172 93)"/>

  <rect x="65" y="125" width="28" height="22" rx="2" fill="#EF4444" opacity="0.9" transform="rotate(-10 79 136)"/>
  <rect x="148" y="120" width="30" height="24" rx="2" fill="#EF4444" opacity="0.9" transform="rotate(15 163 132)"/>

  <!-- Screen interface elements getting buried -->
  <rect x="64" y="105" width="112" height="8" rx="4" fill="#334155"/>
  <rect x="64" y="119" width="80" height="8" rx="4" fill="#334155"/>

  <!-- Focus / Accent glow on the spill -->
  <circle cx="120" cy="70" r="40" fill="#EF4444" opacity="0.15" filter="blur(8px)"/>
</svg>