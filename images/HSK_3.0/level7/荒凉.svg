<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    
    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Dune Shadow -->
    <linearGradient id="duneShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Elements (Distant Hills / Mountains) -->
  <path d="M0 130 Q 60 110, 120 125 T 240 120 L 240 150 L 0 150 Z" fill="#334155" opacity="0.7"/>

  <!-- Pale Sun -->
  <circle cx="180" cy="70" r="50" fill="url(#sunGlow)"/>
  <circle cx="180" cy="70" r="18" fill="#fef08a" opacity="0.9"/>

  <!-- Cracked Barren Ground / Rolling Wasteland -->
  <path d="M0 140 Q 80 130, 140 145 T 240 135 L 240 240 L 0 240 Z" fill="url(#groundGrad)"/>
  <path d="M0 170 Q 90 160, 160 175 T 240 165 L 240 240 L 0 240 Z" fill="#1c1917" opacity="0.6"/>

  <!-- Ground Details (Cracks in wasteland) -->
  <path d="M30 170 L 45 178 M45 178 L 40 185 M45 178 L 55 182" stroke="#44403c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M120 190 L 135 195 M135 195 L 145 192 M135 195 L 130 205" stroke="#44403c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M190 175 L 205 180 M205 180 L 215 185" stroke="#44403c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dead Tree / Withered Branch Structure -->
  <g transform="translate(45, 110)">
    <!-- Main Trunk -->
    <path d="M15 50 Q 12 30, 20 10 Q 22 5, 25 0 Q 23 15, 18 30 Q 25 20, 32 10 Q 27 25, 20 45 Z" fill="#292524"/>
    <!-- Branches -->
    <path d="M18 20 Q 8 15, 2 8 M5 12 L 0 14" stroke="#292524" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M22 12 Q 32 5, 38 2 M35 7 L 42 5" stroke="#292524" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Small Dead Bush / Tumbleweed Element -->
  <path d="M150 160 Q 155 155, 160 162 Q 165 158, 168 164" stroke="#57534e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M155 163 Q 158 159, 163 163" stroke="#57534e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Traveler Character (Expressive & Detailed) -->
  <g transform="translate(100, 115)">
    <!-- Shadow -->
    <ellipse cx="20" cy="58" rx="16" ry="4" fill="#0f172a" opacity="0.6"/>

    <!-- Backpack -->
    <rect x="8" y="20" c-rx="4" width="12" height="18" rx="3" fill="#b45309"/>
    <path d="M14 20 L 14 38" stroke="#78350f" stroke-width="1.5"/>

    <!-- Legs -->
    <!-- Back Leg -->
    <path d="M15 45 L 12 56" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <!-- Front Leg (Stepping) -->
    <path d="M22 45 L 28 55" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M26 55 L 31 55" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Torso (Traveler leaning slightly forward against the wind/vastness) -->
    <path d="M12 18 C 12 18, 14 35, 18 45 C 24 45, 26 35, 26 18 Z" fill="#0284c7"/>

    <!-- Scarf / Cloak detail (Windblown) -->
    <path d="M18 16 Q 28 18, 35 14 Q 30 19, 20 20 Z" fill="#f43f5e"/>

    <!-- Head & Hat -->
    <circle cx="20" cy="11" r="7" fill="#fcd34d"/>
    <!-- Wide Brim Traveller Hat -->
    <ellipse cx="20" cy="6" rx="11" ry="3.5" fill="#d97706"/>
    <path d="M13 5 Q 20 1, 27 5 Q 20 8, 13 5 Z" fill="#b45309"/>

    <!-- Arms & Walking Stick / Staff -->
    <!-- Back Arm holding staff -->
    <path d="M16 22 L 6 32 L 2 54" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M16 22 L 10 30" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Front Arm (Hand up shading eyes or holding strap) -->
    <path d="M22 22 L 26 30" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Face Expression (Wandering/Awe/Desolation) -->
    <circle cx="22" cy="10" r="1" fill="#1e293b"/>
    <path d="M24 13 Q 25 14, 26 13" stroke="#1e293b" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Distant Ruin / Broken Pillar (Adds to 'desolate/barren' narrative) -->
  <g transform="translate(195, 125)">
    <rect x="0" y="0" width="8" height="25" rx="1" fill="#78716c"/>
    <path d="M0 0 L 8 4 L 4 0 Z" fill="#57534e"/>
    <rect x="2" y="8" width="4" height="6" fill="#44403c" opacity="0.5"/>
    <!-- Fallen block -->
    <rect x="9" y="18" width="6" height="7" rx="1" fill="#78716c" transform="rotate(15 9 18)"/>
  </g>

  <!-- Flying Bird / Vulture (Silhouette in distance for atmosphere) -->
  <path d="M 75 45 Q 80 40, 85 45 Q 90 40, 95 45 Q 85 48, 75 45 Z" fill="#475569" transform="scale(0.7) translate(30, 10)"/>
</svg>