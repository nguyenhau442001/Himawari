<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/ambient glow to denote tech/modern flat theme -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Dynamic Flow Waves (Representing "滔滔" - surging, continuous flow) -->
  <path d="M 30,170 Q 75,140 120,170 T 210,170" fill="none" stroke="#FFA116" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M 40,190 Q 85,160 130,190 T 220,190" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.2"/>

  <!-- Speech/Action Stream (Representing continuous talking "不绝" - unending) -->
  <!-- Swirling continuous stream of words/speech bubbles emerging from the mouth -->
  <g transform="translate(0, 0)">
    <!-- Stream path line -->
    <path d="M 105,108 C 130,90 170,80 190,55 C 200,42 195,25 180,25 C 165,25 155,40 160,55 C 165,70 190,85 205,110" 
          fill="none" stroke="#FFA116" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="50;0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Floating abstract communication nodes / continuous flow icons -->
    <!-- Node 1 -->
    <circle cx="145" cy="85" r="10" fill="#2E3544" stroke="#FFA116" stroke-width="3"/>
    <path d="M 142,85 L 148,85 M 145,82 L 145,88" stroke="#FFA116" stroke-width="2" stroke-linecap="round"/>

    <!-- Node 2 -->
    <circle cx="185" cy="65" r="14" fill="#FFA116"/>
    <!-- Tiny chat bubble icon inside node -->
    <path d="M 180,61 H 190 C 192,61 193,62 193,64 V 68 C 193,70 192,71 190,71 H 186 L 183,73 V 71 H 180 C 178,71 177,70 177,68 V 64 C 177,62 178,61 180,61 Z" fill="#1A1D24"/>

    <!-- Node 3 (Highest) -->
    <circle cx="165" cy="35" r="8" fill="#FF5722"/>
  </g>

  <!-- Human Character (Upper Body, Dynamic Action) -->
  <g transform="translate(0, 5)">
    <!-- Body / Torso -->
    <path d="M 70,185 C 70,150 85,135 110,135 H 120 C 145,135 160,150 160,185 Z" fill="#2E3544"/>
    
    <!-- Dynamic Arm gesturing forward (Action line support) -->
    <path d="M 125,140 Q 140,120 125,100" fill="none" stroke="#3E4859" stroke-width="12" stroke-linecap="round"/>
    <circle cx="125" cy="98" r="6" fill="#FFA116"/>

    <!-- Neck -->
    <rect x="100" y="118" width="20" height="25" fill="#E0AC69"/>

    <!-- Head profile facing right -->
    <path d="M 90,95 C 90,75 105,65 125,75 C 135,80 145,95 140,115 C 135,130 115,130 100,120 Z" fill="#E0AC69"/>

    <!-- Hair (Modern flat style) -->
    <path d="M 90,95 C 90,75 105,65 125,65 C 135,65 142,72 142,80 C 135,78 125,76 115,82 C 105,88 95,90 90,95 Z" fill="#3E4859"/>

    <!-- Open Mouth (Actively speaking, cause of the flow) -->
    <path d="M 134,105 Q 142,108 138,113 C 134,115 130,112 134,105 Z" fill="#A3331C"/>
    
    <!-- Focused, expressive eye -->
    <circle cx="125" cy="88" r="3" fill="#1A1D24"/>
    <path d="M 120,83 C 123,82 128,82 131,84" fill="none" stroke="#3E4859" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Action Motion Lines near head/mouth to emphasize continuous verbal output -->
  <path d="M 148,98 Q 158,102 148,106" fill="none" stroke="#FFA116" stroke-width="3" stroke-linecap="round"/>
  <path d="M 153,92 Q 166,97 153,102" fill="none" stroke="#FFA116" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Focus/Energy Accent Dot -->
  <circle cx="35" cy="50" r="4" fill="#FFA116" opacity="0.8"/>
  <circle cx="205" cy="180" r="3" fill="#FF5722" opacity="0.5"/>
</svg>