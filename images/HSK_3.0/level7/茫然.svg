<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="90" fill="#334155"/>
  <rect x="180" y="150" width="10" height="90" fill="#334155"/>
  
  <!-- Laptop Screen (The source of the news) -->
  <rect x="80" y="80" width="80" height="60" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="85" y="85" width="70" height="40" rx="2" fill="#0f172a"/>
  <circle cx="120" cy="110" r="8" fill="#fb923c" opacity="0.6"/>
  
  <!-- Character -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-30 60 C-30 30, -20 20, 0 20 C20 20, 30 30, 30 60 L30 80 L-30 80 Z" fill="#475569"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#fde68a"/>
    <!-- Expression (茫然 - Blank/Dazed) -->
    <ellipse cx="-8" cy="-15" rx="3" ry="4" fill="#1e293b"/>
    <ellipse cx="8" cy="-15" rx="3" ry="4" fill="#1e293b"/>
    <path d="M-10 5 Q0 0 10 5" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Hair -->
    <path d="M-25 -15 C-25 -35, 25 -35, 25 -15 C25 -20, 10 -25, 0 -25 C-10 -25, -25 -20, -25 -15" fill="#334155"/>
  </g>
  
  <!-- Floating notification icon (Abstract) -->
  <circle cx="170" cy="70" r="12" fill="#ec4899"/>
  <path d="M170 65 L170 72 M170 75 L170 76" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <rect x="45" y="120" width="20" height="20" rx="2" fill="#fbbf24"/>
  <path d="M65 125 C70 125, 70 135, 65 135" stroke="#fbbf24" stroke-width="3" fill="none"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="100" r="40" fill="#f59e0b" opacity="0.05"/>
</svg>