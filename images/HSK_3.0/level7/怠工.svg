<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Factory Floor Background Elements -->
  <rect x="40" y="180" width="160" height="10" fill="#2D343E"/>
  <rect x="60" y="140" width="20" height="40" fill="#2D343E"/>
  <rect x="160" y="140" width="20" height="40" fill="#2D343E"/>
  
  <!-- The Worker (Character) -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 60 L-20 20 L20 20 L20 60 Z" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#E67E22"/>
    <!-- Eyes (Closed/Sluggish) -->
    <path d="M-12 -5 L-4 -5 M4 -5 L12 -5" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <!-- Arms (Slumped) -->
    <path d="M-20 30 L-45 30" stroke="#F39C12" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 30 L45 30" stroke="#F39C12" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- The Idle Machine/Tool -->
  <g transform="translate(60, 150)">
    <rect x="-15" y="-30" width="30" height="30" fill="#7F8C8D"/>
    <rect x="-5" y="-40" width="10" height="10" fill="#95A5A6"/>
  </g>
  
  <!-- Crossed out tool/work symbol to indicate "Slowdown/Stoppage" -->
  <g transform="translate(180, 80)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#E74C3C" stroke-width="4"/>
    <path d="M-12 -12 L12 12" stroke="#E74C3C" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 0 L10 0" fill="#E74C3C"/>
  </g>
</svg>