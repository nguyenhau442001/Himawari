<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <defs>
    <!-- Wall/Room Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Ambient Room Background -->
  <rect x="0" y="0" width="240" height="240" fill="url(#wallGrad)"/>

  <!-- Wallpaper accent lines -->
  <line x1="60" y1="0" x2="60" y2="160" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="180" y1="0" x2="180" y2="160" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="80" x2="240" y2="80" stroke="#334155" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Bookshelf on wall with books -->
  <rect x="25" y="45" width="70" height="6" rx="3" fill="#475569"/>
  <path d="M33 45 L33 25 L43 25 L43 45 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M46 45 L46 28 L56 28 L56 45 Z" fill="#10b981" opacity="0.8"/>
  <path d="M59 45 L59 22 L71 22 L71 45 Z" fill="#f59e0b" opacity="0.8"/>
  <path d="M74 45 L74 30 L84 30 L84 45 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Wall Shelf holding the shining Trophy -->
  <rect x="145" y="65" width="70" height="6" rx="3" fill="#475569"/>
  <!-- Trophy shadow -->
  <ellipse cx="180" cy="73" rx="12" ry="3" fill="#000000" opacity="0.4"/>
  <!-- Trophy -->
  <path d="M172 71 L188 71 L186 52 C186 46 174 46 174 52 Z" fill="url(#goldGrad)"/>
  <path d="M180 71 L180 63" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="180" cy="74" rx="10" ry="3" fill="url(#goldGrad)"/>
  <path d="M172 50 C167 50 167 58 172 58" fill="none" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M188 50 C193 50 193 58 188 58" fill="none" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Trophy Star shine -->
  <circle cx="180" cy="54" r="2" fill="#fff" opacity="0.8"/>

  <!-- Window with soft night sky -->
  <rect x="160" y="90" width="55" height="65" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <line x1="187" y1="90" x2="187" y2="155" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="122" x2="215" y2="122" stroke="#334155" stroke-width="2"/>
  <!-- Tiny stars outside -->
  <circle cx="172" cy="102" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="202" cy="142" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="198" cy="108" r="1" fill="#fff" opacity="0.5"/>

  <!-- Window Curtain -->
  <path d="M160 90 Q168 120 162 155 L160 155 Z" fill="#3b82f6" opacity="0.25"/>

  <!-- Desk Surface -->
  <rect x="10" y="155" width="220" height="12" rx="3" fill="#334155"/>
  <rect x="25" y="167" width="190" height="50" fill="#1e293b"/>
  <!-- Desk leg supports -->
  <rect x="35" y="167" width="10" height="70" fill="#0f172a" opacity="0.5"/>
  <rect x="195" y="167" width="10" height="70" fill="#0f172a" opacity="0.5"/>

  <!-- Desk Props: Laptop & Notebook & Pencil Holder -->
  <!-- Laptop -->
  <path d="M60 155 L115 155 L122 143 L53 143 Z" fill="#64748b"/>
  <path d="M51 143 L124 143 L124 141 L51 141 Z" fill="#94a3b8"/>
  <rect x="68" y="125" width="40" height="18" rx="2" fill="#0f172a"/>
  <!-- Laptop screen glow -->
  <rect x="70" y="127" width="36" height="14" rx="1" fill="#38bdf8" opacity="0.2"/>
  
  <!-- Notebook / Papers -->
  <rect x="135" y="147" width="35" height="15" rx="1" fill="#f8fafc" transform="rotate(-6 135 147)"/>
  <line x1="140" y1="151" x2="162" y2="149" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="140" y1="155" x2="160" y2="153" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Coffee Mug -->
  <rect x="180" y="142" width="12" height="14" rx="2" fill="#f43f5e"/>
  <path d="M192 145 C196 145 196 153 192 153" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <!-- Steam -->
  <path d="M184 138 C184 135 188 135 188 132" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Lamp overhead lighting gradient overlay -->
  <circle cx="110" cy="110" r="80" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Main Character: Sitting at desk, showing "谦逊" (modest, humble posture: slightly bowed head, gentle smile, hand scratching head or placed on chest modestly) -->
  <!-- Character Body & Chair -->
  <rect x="95" y="160" width="30" height="40" rx="6" fill="#475569"/> <!-- Chair back -->
  
  <!-- Torso -->
  <path d="M85 165 C85 150 125 150 125 165 L130 200 C130 205 80 205 80 200 Z" fill="url(#shirtGrad)"/>
  
  <!-- Collar -->
  <path d="M100 152 L105 162 L110 152 Z" fill="#f8fafc"/>

  <!-- Head & Hair -->
  <!-- Neck -->
  <rect x="100" y="142" width="10" height="14" fill="#fed7aa"/>
  
  <!-- Head base -->
  <circle cx="105" cy="122" r="18" fill="#fed7aa"/>

  <!-- Hair Style -->
  <path d="M87 122 C87 105 123 105 123 122 C123 126 121 126 121 118 C121 108 89 108 89 118 C89 126 87 126 87 122 Z" fill="url(#hairGrad)"/>
  <path d="M89 116 C95 110 115 110 121 116 C117 110 93 110 89 116 Z" fill="url(#hairGrad)"/>

  <!-- Facial Expression: Humble, gentle, slightly shy smile with closed happy eyes -->
  <!-- Eyebrows (relaxed, slightly curved up in friendly humility) -->
  <path d="M95 118 Q99 115 103 118" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M107 118 Q111 115 115 118" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Eyes (Happy curved lines indicating sincere modesty, not arrogant) -->
  <path d="M96 123 Q99 126 102 123" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M108 123 Q111 126 114 123" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Cute Blush / Rosy Cheeks indicating mild shyness regarding achievements -->
  <circle cx="95" cy="128" r="3.5" fill="#f43f5e" opacity="0.35"/>
  <circle cx="115" cy="128" r="3.5" fill="#f43f5e" opacity="0.35"/>

  <!-- Gentle Smile -->
  <path d="M101 133 Q105 137 109 133" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Arms/Hands enacting modesty: One hand touching back of head/neck shyly (classic humble gesture), other resting on desk -->
  <!-- Left arm & hand touching the head shyly -->
  <path d="M88 160 C80 155 75 135 90 125" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand at back of head -->
  <circle cx="91" cy="123" r="5" fill="#fed7aa"/>

  <!-- Right arm resting on desk -->
  <path d="M120 162 C130 162 135 155 138 148" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
  <circle cx="139" cy="146" r="4.5" fill="#fed7aa"/>

  <!-- Floating Gentle Sparkles / Embellishments for Atmosphere (Warmth, Positive character trait) -->
  <path d="M45 100 Q45 110 55 110 Q45 110 45 120 Q45 110 35 110 Q45 110 45 100 Z" fill="#fbbf24" opacity="0.7"/>
  <path d="M205 60 Q205 66 211 66 Q205 66 205 72 Q205 66 199 66 Q205 66 205 60 Z" fill="#fbbf24" opacity="0.5"/>
  <circle cx="140" cy="95" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="65" cy="80" r="1.5" fill="#f43f5e" opacity="0.8"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="115" cy="210" rx="55" ry="6" fill="#000000" opacity="0.3"/>
</svg>