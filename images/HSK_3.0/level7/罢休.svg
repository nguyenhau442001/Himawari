<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: A solid, indestructible iron anchor holding firm against an invisible relentless current (representing relentless perseverance and refusal to quit "罢休") -->
  <g transform="translate(120, 115)">
    <!-- Heavy Chain extending upwards -->
    <path d="M 0,-65 L 0,-45" stroke="#627D98" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="0" cy="-35" rx="8" ry="6" fill="none" stroke="#627D98" stroke-width="6"/>

    <!-- Anchor Ring -->
    <circle cx="0" cy="-22" r="10" fill="none" stroke="#F0B429" stroke-width="6"/>

    <!-- Anchor Shank -->
    <path d="M 0,-12 L 0,45" stroke="#F0B429" stroke-width="10" stroke-linecap="round"/>

    <!-- Anchor Stock (Crossbar at top) -->
    <path d="M -30,-10 L 30,-10" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-30" cy="-10" r="4" fill="#E2E8F0"/>
    <circle cx="30" cy="-10" r="4" fill="#E2E8F0"/>

    <!-- Anchor Crown & Flukes (Curved bottom with sharp gripping arms) -->
    <path d="M -45,45 C -35,55 -15,58 0,55 C 15,58 35,55 45,45" fill="none" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Left Fluke Tip (Arrowhead shape) -->
    <path d="M -42,35 L -48,50 L -33,47 Z" fill="#F0B429"/>
    
    <!-- Right Fluke Tip (Arrowhead shape) -->
    <path d="M 42,35 L 48,50 L 33,47 Z" fill="#F0B429"/>

    <!-- Central point/ball at bottom of crown -->
    <circle cx="0" cy="55" r="5" fill="#E2E8F0"/>
  </g>

  <!-- Subtle glow/focus rays behind the anchor to emphasize unwavering determination -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#F0B429" stroke-width="1.5" opacity="0.15" stroke-dasharray="6 6"/>
</svg>