<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>

    <!-- Warm House Glow -->
    <radialGradient id="houseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="1"/>
      <stop offset="60%" stop-color="#F4A261" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E76F51" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22333B"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="mountNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Starry Night & Distant Isolation Vibe -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="30" cy="35" r="1" />
    <circle cx="75" cy="20" r="1.5" />
    <circle cx="120" cy="45" r="1" />
    <circle cx="180" cy="25" r="1.2" />
    <circle cx="215" cy="55" r="1" />
    <circle cx="50" cy="70" r="0.8" />
  </g>

  <!-- Distant Mountains (Layers showing remoteness) -->
  <path d="M-10 160 L40 100 L90 140 L150 80 L210 130 L250 100 L250 240 L-10 240 Z" fill="url(#mountFar)"/>
  
  <!-- Closer Mountain / Hills with winding path -->
  <path d="M-10 190 Q50 150 110 175 T250 160 L250 240 L-10 240 Z" fill="url(#mountNear)"/>
  
  <!-- Winding Dirt Path hinting at deep isolation -->
  <path d="M120 200 Q130 210 150 240 L180 240 Q150 215 135 205 Z" fill="#52796F" opacity="0.6"/>

  <!-- Small Remote Village House -->
  <g transform="translate(110, 130)">
    <!-- House Light Glow Background -->
    <circle cx="25" cy="30" r="60" fill="url(#houseGlow)"/>

    <!-- Stone/Wood Walls -->
    <rect x="5" y="20" width="40" height="35" fill="#C8966E" rx="2"/>
    
    <!-- Warm Lit Window -->
    <rect x="10" y="28" width="12" height="15" fill="#FFE066" rx="1"/>
    <line x1="16" y1="28" x2="16" y2="43" stroke="#B07D62" stroke-width="1.5"/>
    <line x1="10" y1="35.5" x2="22" y2="35.5" stroke="#B07D62" stroke-width="1.5"/>

    <!-- Wooden Roof -->
    <polygon points="0,20 25,2 50,20" fill="#7F4F24"/>
    <polygon points="2,20 25,5 48,20" fill="#936639"/>

    <!-- Chimney & Smoke -->
    <rect x="35" y="8" width="6" height="10" fill="#582F0E"/>
    <path d="M38 5 Q42 0 37 -6 T36 -16" fill="none" stroke="#E0FBFC" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Surrounding Nature (Pine trees for mountain ambiance) -->
  <!-- Left Tree Cluster -->
  <polygon points="35,170 20,190 50,190" fill="#1B4332"/>
  <polygon points="35,150 25,175 45,175" fill="#2D6A4F"/>
  <rect x="33" y="190" width="4" height="10" fill="#3A5A40"/>

  <polygon points="65,185 55,205 75,205" fill="#1B4332"/>
  <polygon points="65,165 57,188 73,188" fill="#2D6A4F"/>
  <rect x="63" y="205" width="4" height="10" fill="#3A5A40"/>

  <!-- Right Tree Cluster -->
  <polygon points="205,175 190,195 220,195" fill="#1B4332"/>
  <polygon points="205,155 195,180 215,180" fill="#2D6A4F"/>
  <rect x="203" y="195" width="4" height="12" fill="#3A5A40"/>

  <!-- MAIN CHARACTER (Standing outside the remote house, looking at nature/stars) -->
  <g transform="translate(85, 150)">
    <!-- Character Shadow -->
    <ellipse cx="12" cy="74" rx="10" ry="3" fill="#070B19" opacity="0.5"/>

    <!-- Legs/Pants -->
    <rect x="8" y="55" width="4" height="18" fill="#2B2D42" rx="2"/>
    <rect x="14" y="55" width="4" height="18" fill="#2B2D42" rx="2"/>

    <!-- Torso/Jacket (Warm winter coat suited for mountain night) -->
    <path d="M6 32 C6 30 14 28 20 32 C26 28 34 30 34 32 L32 56 C32 58 26 58 20 58 C14 58 8 58 8 56 Z" fill="#E07A5F"/>
    
    <!-- Scarf -->
    <path d="M12 28 C16 32 24 32 28 28 C30 32 26 36 20 36 C14 36 10 32 12 28 Z" fill="#F4F1DE"/>
    <path d="M24 34 L26 48 L22 48 Z" fill="#F4F1DE"/>

    <!-- Head & Face (Profile view, looking outwards into the serene night) -->
    <circle cx="20" cy="18" r="9" fill="#F3C68F"/>
    
    <!-- Hair -->
    <path d="M11 18 C11 11 16 9 22 11 C28 13 29 19 29 22 C24 20 16 20 11 18 Z" fill="#2B2D42"/>

    <!-- Gentle expression / Looking ahead -->
    <circle cx="24" cy="17" r="1" fill="#2B2D42"/>

    <!-- Raised Hand holding a warm cup of tea/coffee -->
    <path d="M10 36 L3 32 L8 28 Z" fill="#E07A5F"/>
    <circle cx="3" cy="31" r="3" fill="#F3C68F"/>
    
    <!-- Mug -->
    <rect x="1" y="27" width="5" height="6" fill="#F4F1DE" rx="1"/>
    <!-- Steam -->
    <path d="M2 25 Q3 22 2 20" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Foreground Atmospheric Elements (Soft glowing fireflies/motes floating to enhance tranquil, remote ambiance) -->
  <g fill="#FFD166" opacity="0.6">
    <circle cx="65" cy="130" r="1.5" />
    <circle cx="55" cy="115" r="1" />
    <circle cx="95" cy="105" r="2" />
    <circle cx="155" cy="120" r="1" />
    <circle cx="170" cy="100" r="1.5" />
  </g>

  <!-- Framing Vignette / Rounded Corner Mask helper (Optional subtle border for polish) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
</svg>