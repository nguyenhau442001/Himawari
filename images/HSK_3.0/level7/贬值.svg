<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background subtle grid / market trend lines -->
    <path d="M40 180 L80 140 L120 160 L160 100 L200 120" stroke="#2A303C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 190 L80 150 L120 170 L160 110 L200 130" stroke="#252A34" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

    <!-- Physical Object: A glossy gold coin / currency token being compressed / losing value -->
    <!-- Main Coin Body (Slanted/Perspective or flattened cylinder to show object-ness) -->
    <ellipse cx="120" cy="130" rx="55" ry="25" fill="#C7922EA0"/>
    <path d="M65 130 V155 C65 168.8 89.6 180 120 180 C150.4 180 175 168.8 175 155 V130 C175 142.8 150.4 155 120 155 C89.6 155 65 142.8 65 130 Z" fill="#D99B26"/>
    <ellipse cx="120" cy="130" rx="55" ry="25" fill="#F1C40F"/>
    
    <!-- Inner Coin Rim -->
    <ellipse cx="120" cy="130" rx="45" ry="19" fill="none" stroke="#D99B26" stroke-width="2.5"/>
    
    <!-- Currency Symbol on Coin (Generic abstract shape, clean vector) -->
    <path d="M115 117 V143 M110 121 H126 M110 139 H126" stroke="#C7922E" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Cracks / Fractures on the Coin (Visualizing loss of value / depreciation) -->
    <path d="M120 111 L115 125 L125 133 L118 149" stroke="#9A6B1A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 125 L132 131" stroke="#9A6B1A" stroke-width="2" stroke-linecap="round"/>
    <path d="M100 135 L108 138" stroke="#9A6B1A" stroke-width="2" stroke-linecap="round"/>

    <!-- Falling / Downward red trend arrow piercing/hovering over the coin -->
    <path d="M150 55 L180 85 M180 85 H160 M180 85 V65" stroke="#FF5252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Crumbled/Falling gold dust / shards peeling off -->
    <circle cx="85" cy="115" r="3" fill="#E67E22"/>
    <circle cx="155" cy="140" r="2.5" fill="#E67E22"/>
    <circle cx="135" cy="160" r="2" fill="#E67E22"/>
    <path d="M75 125 L80 130" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
    <path d="M162 118 L168 124" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>

    <!-- Sharp downward vector swoosh -->
    <path d="M60 70 Q90 110 110 135" stroke="#FF5252" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M103 130 L111 137 L105 143" fill="#FF5252"/>
  </g>
</svg>