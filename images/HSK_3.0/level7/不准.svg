<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Gas Pump Body -->
  <rect x="85" y="80" width="70" height="100" rx="8" fill="#4A5568"/>
  <rect x="95" y="95" width="50" height="30" rx="4" fill="#2D3748"/>
  
  <!-- Hose -->
  <path d="M155 130 C 180 130, 180 160, 160 170" stroke="#F6AD55" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Prohibition Sign (The "No" element) -->
  <circle cx="120" cy="120" r="70" stroke="#E53E3E" stroke-width="12" fill="none" opacity="0.9"/>
  <line x1="75" y1="165" x2="165" y2="75" stroke="#E53E3E" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Flame Icon (The forbidden object) -->
  <path d="M120 60 C 135 60, 145 75, 145 85 C 145 95, 135 100, 120 100 C 105 100, 95 95, 95 85 C 95 75, 105 60, 120 60 Z" fill="#F6AD55"/>
  
  <!-- Phone Icon (The forbidden object) -->
  <rect x="160" y="150" width="20" height="35" rx="3" fill="#E2E8F0"/>
  <rect x="164" y="155" width="12" height="20" fill="#2D3748"/>
</svg>