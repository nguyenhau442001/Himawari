<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="desk-lamp" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Warm ambient light from desk lamp -->
  <circle cx="150" cy="70" r="100" fill="url(#desk-lamp)"/>

  <!-- Background Environment: Room Interior & Bookshelf -->
  <!-- Bookshelf structure -->
  <rect x="25" y="40" width="60" height="90" rx="4" fill="#1b263b"/>
  <rect x="30" y="65" width="50" height="4" fill="#334155"/>
  <rect x="30" y="90" width="50" height="4" fill="#334155"/>
  <!-- Books on shelf -->
  <rect x="33" y="48" width="8" height="17" rx="1" fill="#38bdf8"/>
  <rect x="43" y="45" width="10" height="20" rx="1" fill="#ec4899"/>
  <rect x="55" y="50" width="6" height="15" rx="1" fill="#10b981"/>
  <rect x="64" y="47" width="12" height="18" rx="1" fill="#fb923c"/>
  
  <rect x="33" y="73" width="7" height="17" rx="1" fill="#fbbf24"/>
  <rect x="42" y="70" width="14" height="20" rx="1" fill="#38bdf8"/>
  <rect x="58" y="75" width="9" height="15" rx="1" fill="#f43f5e"/>

  <!-- Window with night cityscape -->
  <rect x="175" y="35" width="40" height="55" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <line x1="195" y1="35" x2="195" y2="90" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="62" x2="215" y2="62" stroke="#334155" stroke-width="2"/>
  <!-- City lights through window -->
  <rect x="180" y="45" width="4" height="8" fill="#fbbf24" opacity="0.6"/>
  <rect x="187" y="50" width="3" height="10" fill="#38bdf8" opacity="0.5"/>
  <rect x="202" y="42" width="5" height="15" fill="#fbbf24" opacity="0.4"/>
  <rect x="208" y="55" width="4" height="6" fill="#10b981" opacity="0.5"/>

  <!-- Wall clock showing late hour -->
  <circle cx="120" cy="40" r="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="40" r="1" fill="#f8fafc"/>
  <line x1="120" y1="40" x2="120" y2="32" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="40" x2="127" y2="43" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Desk Surface -->
  <rect x="10" y="170" width="220" height="40" rx="4" fill="url(#wood-desk)" filter="url(#soft-shadow)"/>
  <rect x="10" y="170" width="220" height="6" rx="2" fill="#64748b" opacity="0.4"/>

  <!-- Desk Accessories / Context Props -->
  <!-- Laptop in background -->
  <path d="M 60,165 L 90,165 L 95,150 L 55,150 Z" fill="#64748b"/>
  <rect x="52" y="164" width="46" height="4" rx="2" fill="#94a3b8"/>
  <rect x="62" y="152" width="26" height="12" rx="1" fill="#0f172a"/>

  <!-- Desk Lamp Fixture -->
  <path d="M 170,170 C 170,120 160,80 150,70" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 135,60 C 135,50 155,50 165,65 L 160,75 C 150,70 140,70 135,60 Z" fill="#475569"/>
  <!-- Lamp Base -->
  <ellipse cx="170" cy="170" rx="12" ry="4" fill="#475569"/>

  <!-- Coffee Mug with steam -->
  <rect x="195" y="145" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M 211,150 C 217,150 217,160 211,162" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M 200,138 C 202,134 198,130 200,126" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 206,140 C 208,136 204,132 206,128" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- The Main Subject: The "Jiantao" (Self-Criticism / Written Apology Paper) -->
  <g id="document-paper" filter="url(#soft-shadow)">
    <!-- Paper sheet on desk -->
    <polygon points="90,140 145,135 150,175 95,180" fill="#f8fafc"/>
    <!-- Fold / curl effect at corner -->
    <polygon points="140,173 150,175 145,165" fill="#e2e8f0"/>
    
    <!-- Abstract handwritten lines representing the written self-reflection/report -->
    <!-- Title underline / header -->
    <line x1="100" y1="148" x2="125" y2="147" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Text lines -->
    <line x1="98" y1="155" x2="138" y2="153" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="97" y1="161" x2="130" y2="159" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="97" y1="167" x2="135" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="96" y1="173" x2="120" y2="171" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Pen actively writing -->
  <g id="pen">
    <path d="M 125,120 L 132,127 L 115,148 L 109,145 Z" fill="#38bdf8"/>
    <polygon points="115,148 109,145 112,151" fill="#0f172a"/>
    <!-- Pen cap accent -->
    <rect x="123" y="121" width="8" height="4" rx="1" transform="rotate(45 127 123)" fill="#0f172a"/>
  </g>

  <!-- Expressive Character: Writing the "Jiantao" with a serious/thoughtful, regretful expression -->
  <g id="character">
    <!-- Body & Hoodie/Shirt -->
    <path d="M 65,210 C 65,185 80,165 110,165 C 140,165 155,185 155,210 Z" fill="#3b82f6"/>
    <!-- Collar -->
    <path d="M 95,165 C 105,175 115,175 125,165 C 115,160 105,160 95,165 Z" fill="#f8fafc"/>
    <!-- Hood strings -->
    <path d="M 100,172 C 100,185 102,190 102,195" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M 120,172 C 120,185 118,190 118,195" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="102" y="150" width="16" height="20" fill="#fed7aa"/>

    <!-- Head / Face -->
    <g id="head" transform="translate(110, 130)">
      <!-- Ears -->
      <circle cx="-16" cy="2" r="5" fill="#fed7aa"/>
      <circle cx="16" cy="2" r="5" fill="#fed7aa"/>

      <!-- Base Face shape -->
      <rect x="-14" y="-12" width="28" height="32" rx="14" fill="#fed7aa"/>

      <!-- Hair (Messy, stressed hair style matching deep concentration/remorse) -->
      <path d="M -15,-4 C -18,-15 0,-20 12,-15 C 18,-12 16,-5 16,-5 C 16,-5 12,-18 -2,-18 C -12,-18 -15,-10 -15,-4 Z" fill="#1e293b"/>
      <path d="M 5,-16 C 12,-16 17,-10 16,-5 C 14,-10 10,-12 5,-16 Z" fill="#334155"/>

      <!-- Thoughtful / Regretful Eyebrows (tilted inwards) -->
      <line x1="-9" y1="-3" x2="-3" y2="-1" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="3" y1="-1" x2="9" y2="-3" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Closed or focused downcast eyes -->
      <path d="M -8,3 Q -6,6 -4,3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 4,3 Q 6,6 8,3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Pouty / Serious Mouth (expressing solemn reflection) -->
      <path d="M -3,12 Q 0,10 3,12" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Subtle blush / emotion marks on cheeks -->
      <ellipse cx="-9" cy="8" r="3" fill="#fca5a5" opacity="0.5"/>
      <ellipse cx="9" cy="8" r="3" fill="#fca5a5" opacity="0.5"/>
    </g>

    <!-- Arms and Hands actively engaged in writing -->
    <!-- Left arm resting on desk -->
    <path d="M 75,180 C 75,160 85,155 95,165" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="165" r="6" fill="#fed7aa"/>

    <!-- Right arm holding pen and writing -->
    <path d="M 145,180 C 145,165 130,150 115,145" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right hand holding the pen -->
    <circle cx="115" cy="145" r="6" fill="#fed7aa"/>
  </g>

  <!-- Subtle ambient lighting overlays to unify scene depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>