<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="15" rx="4" fill="#343A46"/>
  <rect x="60" y="165" width="10" height="30" fill="#2A2F3A"/>
  <rect x="170" y="165" width="10" height="30" fill="#2A2F3A"/>
  
  <!-- Character (Upper body) -->
  <circle cx="120" cy="100" r="25" fill="#E0E0E0"/>
  <path d="M95 100 Q120 130 145 100" fill="#A0A0A0"/>
  <rect x="80" y="125" width="80" height="40" rx="10" fill="#4A90E2"/>
  
  <!-- Focused eyes/glasses -->
  <ellipse cx="110" cy="95" rx="6" ry="4" fill="#1A1D24"/>
  <ellipse cx="130" cy="95" rx="6" ry="4" fill="#1A1D24"/>
  
  <!-- Neglected Food (Cold bowl) -->
  <path d="M170 140 Q170 150 185 150 Q200 150 200 140 Z" fill="#5D6D7E"/>
  <rect x="175" y="135" width="20" height="5" fill="#7F8C8D"/>
  
  <!-- Work items (Papers/Tech) -->
  <rect x="70" y="135" width="50" height="15" rx="2" fill="#F39C12"/>
  <rect x="75" y="140" width="40" height="2" fill="#FFFFFF" opacity="0.3"/>
  <rect x="75" y="145" width="30" height="2" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Clock on wall indicating late night -->
  <circle cx="200" cy="40" r="20" fill="#2A2F3A"/>
  <line x1="200" y1="40" x2="200" y2="25" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="40" x2="215" y2="40" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Moonlight/Window effect -->
  <path d="M30 30 L70 30 L50 70 Z" fill="#F1C40F" opacity="0.1"/>
</svg>