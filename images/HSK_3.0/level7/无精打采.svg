<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Character representing "无精打采" (wújīngdǎcǎi) - listless, dispirited, downcast -->
  <g transform="translate(120, 140)"> <!-- Center the character, adjust Y for a sitting, slumped pose -->

    <!-- Legs/Pants - bent, forming a base for sitting -->
    <path d="M -70 0 C -75 40 -40 60 0 60 C 40 60 75 40 70 0 L 70 -20 C 65 -35 40 -40 0 -40 C -40 -40 -65 -35 -70 -20 Z" fill="#5C7A8F"/>

    <!-- Slumped upper body (shirt) -->
    <path d="M -60 -40 C -70 -100 -50 -130 0 -130 C 50 -130 70 -100 60 -40 Z" fill="#4A657C"/>

    <!-- Head (skin part) - positioned low and forward, conveying dejection -->
    <circle cx="0" cy="-110" r="25" fill="#F0D9B5"/>
    <!-- Hair -->
    <path d="M-25 -120 C -35 -130 -15 -135 0 -135 C 15 -135 35 -130 25 -120 L 0 -110 Z" fill="#3A3F47"/>

    <!-- Face features - downturned, tired, consistent with a dispirited mood -->
    <circle cx="-8" cy="-115" r="2.5" fill="#3A3F47"/> <!-- Left eye -->
    <circle cx="8" cy="-115" r="2.5" fill="#3A3F47"/> <!-- Right eye -->
    <path d="M -8 -105 Q 0 -102 8 -105" stroke="#3A3F47" stroke-width="2" fill="none"/> <!-- Downturned mouth -->

    <!-- Arms (sleeves) wrapped around legs, emphasizing the slumped posture -->
    <!-- Left arm -->
    <path d="M -45 -10 Q -55 10 -45 30 Q -35 40 -25 30 L -25 0 Z" fill="#4A657C"/>
    <!-- Right arm -->
    <path d="M 45 -10 Q 55 10 45 30 Q 35 40 25 30 L 25 0 Z" fill="#4A657C"/>

    <!-- Hands - simple circles, resting on legs/knees -->
    <circle cx="-30" cy="35" r="10" fill="#F0D9B5"/> <!-- Left hand -->
    <circle cx="30" cy="35" r="10" fill="#F0D9B5"/> <!-- Right hand -->
  </g>
</svg>