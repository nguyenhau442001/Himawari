<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Lamp Cone Light Gradient -->
    <linearGradient id="light-cone" x1="120" y1="80" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fef08a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Discarded Paper Glow -->
    <radialGradient id="paper-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment & Interior Details -->
  <!-- Bookshelf / Wall partition -->
  <path d="M160 40 H210 V180 H160 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="170" y="60" width="30" height="10" rx="2" fill="#475569"/>
  <rect x="175" y="90" width="25" height="10" rx="2" fill="#64748b"/>
  <rect x="168" y="120" width="32" height="10" rx="2" fill="#475569"/>

  <!-- Window with Night City Silhouette -->
  <path d="M25 45 H95 V130 H25 Z" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <!-- City buildings outside -->
  <rect x="32" y="80" width="12" height="50" fill="#1e293b"/>
  <rect x="48" y="65" width="16" height="65" fill="#1e293b"/>
  <rect x="70" y="90" width="18" height="40" fill="#1e293b"/>
  <!-- Window Grid -->
  <line x1="60" y1="45" x2="60" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="87" x2="95" y2="87" stroke="#334155" stroke-width="2"/>

  <!-- Warm Desk Lamp hanging/standing -->
  <path d="M120 15 V60" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M95 60 H145 L135 80 H105 Z" fill="#f59e0b"/>
  <circle cx="120" cy="80" r="4" fill="#fef08a"/>

  <!-- Light Cone Projection -->
  <polygon points="120,80 40,210 200,210" fill="url(#light-cone)"/>

  <!-- Wooden Desk Surface -->
  <path d="M15 190 H225 V215 H15 Z" fill="#334155"/>
  <path d="M10 185 H230 V192 H10 Z" fill="#475569"/>

  <!-- Props on Desk -->
  <!-- Laptop base -->
  <path d="M135 180 L185 180 L195 190 L125 190 Z" fill="#64748b"/>
  <!-- Laptop screen (tilted back) -->
  <path d="M140 145 H180 L185 180 H135 Z" fill="#94a3b8"/>
  
  <!-- Coffee Mug -->
  <rect x="70" y="165" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M86 170 C92 170 92 180 86 182" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- Trash Can (Filled with discarded crumpled paper ideas) -->
  <path d="M190 150 L200 200 H220 L230 150 Z" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="210" cy="150" rx="20" ry="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Crumpled papers inside/spilling -->
  <circle cx="205" cy="148" r="7" fill="#f8fafc"/>
  <circle cx="215" cy="144" r="6" fill="#e2e8f0"/>
  <circle cx="210" cy="138" r="8" fill="#f1f5f9"/>

  <!-- Main Character (Thoughtful, tossing/dropping idea paper) -->
  <!-- Character Body / Torso -->
  <path d="M90 190 C90 150 110 140 110 140 C110 140 130 150 130 190 Z" fill="#3b82f6"/>
  
  <!-- Character Neck & Head -->
  <rect x="105" y="125" width="10" height="20" fill="#fbcfe8"/>
  <circle cx="110" cy="115" r="18" fill="#fbcfe8"/>

  <!-- Character Hair (Stylized modern neat cut) -->
  <path d="M93 110 C93 95 127 95 127 110 C127 115 125 120 120 120 H100 C95 120 93 115 93 110 Z" fill="#1e293b"/>

  <!-- Facial expression: Pensive / Decisive brow -->
  <line x1="102" y1="110" x2="108" y2="112" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="114" y1="112" x2="120" y2="110" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="105" cy="116" r="2" fill="#1e293b"/>
  <circle cx="117" cy="116" r="2" fill="#1e293b"/>
  <!-- Serious mouth line -->
  <path d="M108 123 Q111 121 114 123" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Left Arm (resting/support) -->
  <path d="M95 160 L80 185 L90 190" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="80" cy="185" r="6" fill="#fbcfe8"/>

  <!-- Right Arm (Actively dropping/discarding the idea blueprint) -->
  <path d="M125 160 L145 155 L160 165" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="160" cy="165" r="6" fill="#fbcfe8"/>

  <!-- The "Original Idea" Blueprint / Paper being abandoned -->
  <g transform="translate(150, 140) rotate(-25)">
    <!-- Paper sheet glow -->
    <circle cx="15" cy="15" r="25" fill="url(#paper-glow)"/>
    <!-- Paper rectangle -->
    <rect x="0" y="0" width="30" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Abstract layout drawing on the paper (representing the old plan/idea) -->
    <line x1="5" y1="8" x2="25" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <rect x="5" y="13" width="12" height="10" fill="#cbd5e1"/>
    <line x1="5" y1="28" x2="20" y2="28" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="33" x2="15" y2="33" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Motion lines showing it is falling/being thrown away -->
    <path d="M-10 15 L-20 20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <path d="M-8 25 L-18 33" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  </g>

  <!-- Ambient highlights on character shoulder -->
  <path d="M96 150 C100 144 110 142 118 143" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>