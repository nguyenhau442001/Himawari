<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: "当机立断" (Decisive action cutting through a crisis/problem) -->
  <g transform="translate(120, 120)">
    <!-- Glow effect behind the central action -->
    <circle cx="0" cy="0" r="70" fill="#242B38" />

    <!-- Abstract representation of a sudden knot/tangle/problem (Crisis) -->
    <path d="M -45 -15 C -25 -45, 25 -45, 45 -15 C 65 15, 25 45, 0 15 C -25 -15, -65 15, -45 45" 
          fill="none" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    
    <path d="M -30 -30 C -10 -50, 40 -20, 20 10 C 0 40, -40 20, -20 -10" 
          fill="none" stroke="#FF5C5C" stroke-width="5" stroke-linecap="round" opacity="0.3"/>

    <!-- Sharp, decisive blade slicing straight down (Instant decision/action) -->
    <g transform="rotate(-35)">
      <!-- Blade Motion Trails -->
      <path d="M -2 -90 L -2 -40" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.3"/>
      <path d="M 2 -90 L 2 -40" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.3"/>

      <!-- Modern Cleaver / Blade -->
      <!-- Handle -->
      <rect x="-6" y="-105" width="12" height="35" rx="3" fill="#2E384D"/>
      <circle cx="0" cy="-95" r="2.5" fill="#FFB800"/>
      <circle cx="0" cy="-80" r="2.5" fill="#FFB800"/>

      <!-- Blade Body -->
      <path d="M -8 -70 L 8 -70 L 8 45 C 8 65, -8 65, -8 45 Z" fill="#E2E8F0"/>
      
      <!-- Cutting Edge Highlight -->
      <path d="M -8 -70 L -8 45 C -8 60, -5 62, -2 58 L 8 -70 Z" fill="#F8FAFC"/>
      
      <!-- Motion/Impact Spark at the tip -->
      <path d="M 0 70 L -10 85 L -2 75 L 0 90 L 2 75 L 10 85 Z" fill="#FFB800"/>
    </g>

    <!-- Clean Cut/Split visual indicators -->
    <circle cx="-50" cy="-10" r="4" fill="#4ADE80"/>
    <path d="M -58 -10 L -42 -10" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="55" cy="15" r="4" fill="#4ADE80"/>
    <path d="M 47 15 L 63 15" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>