<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Warning Glow behind the scene -->
  <circle cx="120" cy="110" r="90" fill="url(#glowGrad)" />

  <!-- ENVIRONMENT: COURTROOM / OFFICE INTERIOR -->
  <!-- Back Wall / Wooden Panel Detail -->
  <rect x="24" y="40" width="192" height="150" rx="4" fill="#1b263b" stroke="#334155" stroke-width="2" />
  <line x1="24" y1="140" x2="216" y2="140" stroke="#334155" stroke-width="2" />

  <!-- Scales of Justice (Background Context) -->
  <g transform="translate(120, 58)" opacity="0.85">
    <!-- Stand -->
    <rect x="-3" y="0" width="6" height="50" fill="#fbbf24" rx="1"/>
    <path d="M-15,50 L15,50 L10,46 L-10,46 Z" fill="#d97706" />
    <!-- Beam -->
    <path d="M-30,5 L30,5 L25,0 L-25,0 Z" fill="#fbbf24" />
    <circle cx="0" cy="3" r="4" fill="#f59e0b" />
    <!-- Left Pan -->
    <path d="M-30,5 L-40,25 L-20,25 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M-42,26 C-42,24 -20,24 -18,26 C-18,28 -42,28 -42,26 Z" fill="#fbbf24" />
    <!-- Right Pan -->
    <path d="M30,5 L20,25 L40,25 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M18,26 C18,24 40,24 42,26 C42,28 18,28 18,26 Z" fill="#fbbf24" />
  </g>

  <!-- Wooden Legal Document / Law Book Stand -->
  <rect x="60" y="145" width="120" height="12" fill="#475569" rx="2" />
  <rect x="75" y="157" width="90" height="25" fill="#334155" rx="1" />

  <!-- Opened Law Document with Red Prohibition / Violation Stamp -->
  <g transform="translate(95, 115) rotate(-5)" filter="url(#shadow)">
    <!-- Paper -->
    <rect x="0" y="0" width="50" height="40" fill="url(#paperGrad)" rx="2" />
    <!-- Fake text lines -->
    <line x1="8" y1="8" x2="35" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="14" x2="42" y2="14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="20" x2="28" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="26" x2="38" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    
    <!-- BIG BOLD RED STAMP (Violation / Breaking Law) -->
    <g transform="translate(12, 10) rotate(-15)">
      <rect x="0" y="0" width="28" height="20" fill="none" stroke="#dc2626" stroke-width="3" rx="2" opacity="0.9" />
      <line x1="3" y1="3" x2="25" y2="17" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.9" />
      <line x1="25" y1="3" x2="3" y2="17" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>

  <!-- FOREGROUND CHARACTER: The Offender / Defendant -->
  <!-- Concerned / Shocked Expression reacting to breaking the law -->
  <g transform="translate(0, 10)" filter="url(#shadow)">
    <!-- Body / Suit Jacket -->
    <path d="M85,185 L95,135 C95,130 145,130 145,135 L155,185 Z" fill="#1e3a8a" />
    <!-- Shirt collar & Tie -->
    <polygon points="120,135 110,148 130,148" fill="#f8fafc" />
    <polygon points="117,148 123,148 125,180 115,180" fill="#ef4444" />

    <!-- Neck -->
    <rect x="113" y="122" width="14" height="16" fill="#fbcfe8" rx="4" />

    <!-- Head -->
    <circle cx="120" cy="105" r="22" fill="#fbcfe8" />

    <!-- Hair (Dark, stylized flat vector) -->
    <path d="M98,105 C98,90 108,82 120,82 C132,82 142,90 142,105 C142,108 140,105 140,98 C140,88 132,84 120,84 C108,84 100,88 100,98 C100,105 98,108 98,105 Z" fill="#0f172a" />

    <!-- Surprised/Guilty Eyebrows (Angled down center) -->
    <line x1="108" y1="98" x2="116" y2="101" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="124" y1="101" x2="132" y2="98" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Wide with shock/worry) -->
    <circle cx="112" cy="106" r="3.5" fill="#0f172a" />
    <circle cx="128" cy="106" r="3.5" fill="#0f172a" />
    <circle cx="113" cy="105" r="1" fill="#ffffff" />
    <circle cx="129" cy="105" r="1" fill="#ffffff" />

    <!-- Sweat Drop (Classic sign of trouble/panic) -->
    <path d="M138,98 C138,98 144,106 144,110 C144,113 141,115 138,115 C135,115 132,113 132,110 C132,106 138,98 138,98 Z" fill="#38bdf8" opacity="0.85" />

    <!-- Open "O" Mouth of shock/realization -->
    <ellipse cx="120" cy="116" rx="4" ry="5" fill="#991b1b" />

    <!-- Hands raised defensively / guiltily -->
    <!-- Left Hand -->
    <circle cx="95" cy="138" r="7" fill="#fbcfe8" />
    <!-- Right Hand -->
    <circle cx="145" cy="138" r="7" fill="#fbcfe8" />
  </g>

  <!-- Accent Lighting / Rim Light -->
  <path d="M24,24 L216,24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.3" />
</svg>