<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="speechGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Office Details -->
  <!-- Window Grid -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="170" y1="30" x2="220" y2="30"/>
    <line x1="170" y1="60" x2="220" y2="60"/>
    <line x1="195" y1="15" x2="195" y2="75"/>
  </g>
  <rect x="165" y="25" width="60" height="55" rx="4" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>

  <!-- Bookshelf / Plants in background -->
  <rect x="25" y="30" width="35" height="60" rx="2" fill="#1e293b" stroke="#334155"/>
  <line x1="25" y1="50" x2="60" y2="50" stroke="#334155"/>
  <line x1="25" y1="70" x2="60" y2="70" stroke="#334155"/>
  <!-- Plant pot -->
  <path d="M150,85 L160,85 L158,100 L152,100 Z" fill="#64748b"/>
  <path d="M155,85 Q145,70 140,65 Q155,75 155,85 Z" fill="#10b981"/>
  <path d="M155,85 Q165,72 172,68 Q158,77 155,85 Z" fill="#34d399"/>

  <!-- Meeting Table & Props -->
  <ellipse cx="120" cy="180" rx="95" ry="35" fill="url(#tableGrad)" stroke="#475569" stroke-width="2"/>
  <ellipse cx="120" cy="177" rx="85" ry="28" fill="#0f172a" opacity="0.6"/>

  <!-- Papers, Laptops and Coffee Cups on Table -->
  <!-- Laptop 1 -->
  <path d="M70,165 L95,155 L105,170 L80,180 Z" fill="#64748b"/>
  <path d="M73,150 L92,143 L94,157 L75,164 Z" fill="#94a3b8"/>
  <!-- Papers scattered -->
  <rect x="135" y="165" width="22" height="16" rx="1" fill="#f8fafc" transform="rotate(-15 135 165)"/>
  <line x1="138" y1="170" x2="152" y2="167" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-15 135 165)"/>
  <line x1="138" y1="175" x2="148" y2="172" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-15 135 165)"/>
  <rect x="110" y="180" width="20" height="15" rx="1" fill="#f8fafc" transform="rotate(10 110 180)"/>
  <!-- Coffee Cup -->
  <path d="M165,160 L175,160 L173,175 L167,175 Z" fill="#e2e8f0"/>
  <path d="M175,163 Q180,163 180,167 Q180,171 175,171" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- THE SPEAKER (Left): Confident, talking -->
  <g>
    <!-- Body & Torso -->
    <path d="M30,200 Q30,160 55,150 L75,185 L75,210 Z" fill="#3b82f6"/>
    <!-- Collar & Tie -->
    <polygon points="50,150 60,165 70,150" fill="#f8fafc"/>
    <polygon points="58,162 62,162 64,185 60,195 56,185" fill="#ef4444"/>
    <!-- Head & Neck -->
    <path d="M52,145 L58,130 L66,130 L72,145 Z" fill="#fed7aa"/>
    <circle cx="62" cy="118" r="16" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M48,120 Q50,105 62,104 Q76,104 75,120 Q70,112 62,112 Q53,112 48,120 Z" fill="#1e293b"/>
    <!-- Face expression (Talking, open smile/mouth) -->
    <path d="M66,122 Q70,122 72,125" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="68" cy="116" r="1.5" fill="#1e293b"/>
    <!-- Arm gesturing -->
    <path d="M40,165 Q60,155 75,165" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="75" cy="165" r="5" fill="#fed7aa"/>
  </g>

  <!-- THE "Rǎoluàn" EFFECT: Speech bubble with chaotic/confusing zigzag symbols & radiating glow -->
  <circle cx="120" cy="100" r="45" fill="url(#speechGlow)" filter="url(#glow)"/>
  <!-- Speech Bubble Container -->
  <path d="M75,90 Q75,65 120,65 Q165,65 165,90 Q165,115 120,115 L100,125 L105,112 Q75,112 75,90 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Chaotic Thought/Speech Elements Inside Bubble (Visualizing "Disrupted Thoughts") -->
  <!-- Tangled question mark & zigzags representing confusion -->
  <path d="M98,90 Q105,75 115,90 T132,90" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <path d="M110,100 Q120,80 130,95 T145,85" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <path d="M125,75 Q135,100 142,80" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="108" cy="85" r="2" fill="#ef4444"/>
  <circle cx="138" cy="98" r="2" fill="#8b5cf6"/>

  <!-- LISTENERS / PARTICIPANTS (Right): Overwhelmed, confused, dizzy -->
  <!-- Listener 1 (Center-Right, holding head in confusion) -->
  <g>
    <!-- Torso -->
    <path d="M115,200 Q115,165 135,155 L155,190 L145,210 Z" fill="#10b981"/>
    <!-- Head & Neck -->
    <path d="M126,148 L132,135 L140,135 L146,148 Z" fill="#fbcfe8"/>
    <circle cx="136" cy="122" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M122,122 Q126,110 136,110 Q148,110 150,125 Q145,116 136,116 Q128,116 122,122 Z" fill="#9a3412"/>
    <!-- Dizzy / Confused Face (Spiral eyes or crossed eyes, wavy mouth) -->
    <path d="M131,120 Q133,118 135,120" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M137,120 Q139,118 141,120" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Wavy confused mouth -->
    <path d="M133,128 Q136,125 139,128" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hand holding head (confused gesture) -->
    <path d="M120,135 Q125,120 132,125" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="135" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Listener 2 (Far Right, leaning back, stunned/blank) -->
  <g>
    <!-- Torso -->
    <path d="M175,205 Q175,170 195,165 L215,195 L205,215 Z" fill="#8b5cf6"/>
    <!-- Head & Neck -->
    <path d="M188,155 L194,142 L202,142 L208,155 Z" fill="#fed7aa"/>
    <circle cx="198" cy="130" r="15" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M185,130 Q190,118 198,118 Q210,118 212,132 Q205,122 198,122 Q190,122 185,130 Z" fill="#334155"/>
    <!-- Surprised/Blank Face -->
    <circle cx="195" cy="128" r="2" fill="#1e293b"/>
    <circle cx="203" cy="128" r="2" fill="#1e293b"/>
    <!-- Open O mouth of shock -->
    <ellipse cx="199" cy="136" rx="3" ry="4" fill="#1e293b"/>
    <!-- Hand scratching head -->
    <path d="M208,135 Q215,125 208,120" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <circle cx="208,120" r="3" fill="#fed7aa"/>
  </g>

  <!-- Floating Question Marks / Confusion Marks around the room -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Confused floating elements -->
    <path d="M90,45 Q95,35 102,42 Q107,47 102,52 L102,57" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <circle cx="102" cy="63" r="1.5" fill="#38bdf8" opacity="0.8"/>

    <path d="M185,95 Q188,88 193,93 Q197,97 193,101 L193,105" stroke="#f43f5e" stroke-width="2" opacity="0.8"/>
    <circle cx="193" cy="110" r="1" fill="#f43f5e" opacity="0.8"/>

    <!-- Little dizzy sparkles -->
    <path d="M150,45 L155,50 M155,45 L150,50" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
    <path d="M75,135 L79,139 M79,135 L75,139" stroke="#34d399" stroke-width="2" opacity="0.7"/>
  </g>

</svg>