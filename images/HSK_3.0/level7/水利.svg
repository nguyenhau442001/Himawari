<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Dam Structure -->
    <!-- Base concrete/mountain abutment -->
    <path d="M40 180 L80 100 L120 100 L160 180 Z" fill="#3A4454" />
    
    <!-- Main Dam Wall -->
    <path d="M70 100 L170 100 L190 180 L50 180 Z" fill="#525E75" />
    
    <!-- Dam Top Road/Edge -->
    <rect x="60" y="90" width="120" height="10" rx="3" fill="#6B7B96" />
    
    <!-- Spillway Gates / Control Tower -->
    <rect x="90" y="80" width="60" height="20" rx="2" fill="#3A4454" />
    <rect x="100" y="72" width="10" height="10" fill="#FFB703" />
    <rect x="130" y="72" width="10" height="10" fill="#FFB703" />
    
    <!-- Water Reservoir (Back, Left) -->
    <path d="M15 130 Q 40 120 70 120 L 70 180 L 15 180 Z" fill="#0077B6" opacity="0.6"/>
    <path d="M10 145 Q 35 135 70 135 L 70 180 L 10 180 Z" fill="#00B4D8" opacity="0.8"/>
    
    <!-- Flowing Water & Spillway (Front, Right) -->
    <!-- Rushing water from spillway -->
    <path d="M115 100 C 115 130, 140 150, 150 180 L 185 180 C 175 140, 145 120, 145 100 Z" fill="#00B4D8" />
    <path d="M125 100 C 125 125, 145 140, 155 180 L 175 180 C 165 140, 145 125, 135 100 Z" fill="#90E0EF" opacity="0.8"/>
    
    <!-- Water Waves downstream -->
    <path d="M150 180 Q 175 170 200 180 Q 225 190 230 180" fill="none" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" />
    <path d="M165 195 Q 185 185 210 195" fill="none" stroke="#90E0EF" stroke-width="3" stroke-linecap="round" />
    
    <!-- Hydroelectric/Engineering Tech Accents (Golden/Orange high contrast focal points) -->
    <circle cx="105" cy="140" r="6" fill="#FFB703" />
    <path d="M105 130 L105 150 M95 140 L115 140" stroke="#1A1D24" stroke-width="2" />
    
    <!-- Energy / Water drop symbol hovering -->
    <path d="M120 38 C 120 38, 105 55, 105 65 C 105 73.28 111.72 80 120 80 C 128.28 80, 135 73.28, 135 65 C 135 55, 120 38, 120 38 Z" fill="#FFB703" />
    
    <!-- Sun/Environment element in background -->
    <circle cx="195" cy="55" r="16" fill="#FFB703" opacity="0.2" />
    
    <!-- Technical grid overlay accents (Subtle) -->
    <line x1="40" y1="180" x2="200" y2="180" stroke="#6B7B96" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>