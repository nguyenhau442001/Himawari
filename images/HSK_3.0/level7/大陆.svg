<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 45)">
    <!-- Ocean background shape -->
    <path d="M 10 95 C 30 85, 70 85, 90 95 C 110 105, 130 105, 150 95 C 170 85, 175 90, 180 100 C 180 120, 170 145, 90 145 C 20 145, 5 120, 10 95 Z" fill="#243b55" opacity="0.6"/>
    
    <!-- Wave lines -->
    <path d="M 25 120 C 35 117, 45 117, 55 120" stroke="#38ef7d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
    <path d="M 125 110 C 135 107, 145 107, 155 110" stroke="#38ef7d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
    <path d="M 75 130 C 85 127, 95 127, 105 130" stroke="#38ef7d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Main Landmass (大陆) -->
    <path d="M 35 75 
             C 45 55, 60 45, 85 45 
             C 110 45, 125 35, 145 50 
             C 165 65, 175 85, 165 110 
             C 155 135, 120 140, 95 135 
             C 70 130, 45 135, 30 115 
             C 15 95, 25 95, 35 75 Z" 
          fill="#2d3748" stroke="#4a5568" stroke-width="3" stroke-linejoin="round"/>

    <!-- Terrain / Inner continent details (High contrast flat design) -->
    <!-- Plateau / Highlands -->
    <path d="M 50 85 C 60 70, 80 65, 95 75 C 105 85, 95 100, 75 105 C 55 110, 45 95, 50 85 Z" fill="#4a5568" opacity="0.5"/>
    
    <!-- Mountain ranges (Iconic peaks) -->
    <polygon points="120,65 128,50 136,65" fill="#718096"/>
    <polygon points="112,72 120,58 126,72" fill="#a0aec0"/>
    <polygon points="128,70 135,58 142,70" fill="#a0aec0"/>
    
    <polygon points="75,95 82,80 89,95" fill="#718096"/>
    <polygon points="68,100 75,88 81,100" fill="#a0aec0"/>

    <!-- Vibrant accent trees/forest patches representing vast land -->
    <circle cx="95" cy="115" r="4" fill="#38ef7d"/>
    <circle cx="105" cy="118" r="3" fill="#11998e"/>
    <circle cx="85" cy="122" r="3.5" fill="#38ef7d"/>
    <circle cx="140" cy="95" r="4" fill="#11998e"/>
    <circle cx="148" cy="98" r="3" fill="#38ef7d"/>

    <!-- Focus marker (Orange/Gold pin or focal element matching strict rules) -->
    <g transform="translate(95, 82)">
      <circle cx="0" cy="0" r="10" fill="#F6AD55" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#DD6B20"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEEBC8"/>
    </g>
  </g>
</svg>