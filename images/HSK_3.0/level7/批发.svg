<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Warehouse Light Gradient -->
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Counter Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light / Warehouse Atmosphere -->
  <polygon points="0,0 240,0 200,240 40,240" fill="url(#lightBeam)" />

  <!-- Background Shelves & Boxes (Wholesale Warehouse Setting) -->
  <g opacity="0.6">
    <!-- Metal Racks -->
    <rect x="20" y="40" width="8" height="150" fill="#475569" rx="2" />
    <rect x="90" y="40" width="8" height="150" fill="#475569" rx="2" />
    <rect x="15" y="70" width="90" height="4" fill="#64748b" />
    <rect x="15" y="110" width="90" height="4" fill="#64748b" />
    <rect x="15" y="150" width="90" height="4" fill="#64748b" />

    <!-- Background Stacks of Goods -->
    <rect x="30" y="80" width="25" height="30" fill="#0284c7" rx="2" />
    <rect x="60" y="75" width="25" height="35" fill="#10b981" rx="2" />
    <rect x="35" y="120" width="50" height="30" fill="#f43f5e" rx="2" />
  </g>

  <!-- Foreground Stock: Large Bulk Cargo Boxes (Wholesale representation) -->
  <!-- Box Stack Left (Lower Bulk) -->
  <g transform="translate(15, 140)">
    <!-- Back Box Side -->
    <path d="M 0,-30 L 25,-40 L 25,0 L 0,10 Z" fill="url(#boxSide)" />
    <!-- Back Box Top -->
    <path d="M 0,-30 L 20,-45 L 45,-35 L 25,-20 Z" fill="url(#boxTop)" />
    <!-- Back Box Front -->
    <path d="M 25,-40 L 50,-30 L 50,10 L 25,0 Z" fill="url(#boxFront)" />

    <!-- Main Stack Box 1 -->
    <path d="M 15,20 L 55,5 L 55,60 L 15,75 Z" fill="url(#boxFront)" />
    <path d="M 55,5 L 85,20 L 85,75 L 55,60 Z" fill="url(#boxSide)" />
    <path d="M 15,20 L 45,5 L 85,20 L 55,35 Z" fill="url(#boxTop)" />
    <!-- Tape detail -->
    <line x1="50" y1="12" x2="50" y2="48" stroke="#fef3c7" stroke-width="3" opacity="0.4" />
  </g>

  <!-- Character 1: Wholesale Merchant / Clerk (Pointing proudly at bulk stock) -->
  <g transform="translate(170, 95)">
    <!-- Body / Apron -->
    <path d="M -15,45 L 15,45 L 20,95 L -20,95 Z" fill="#0284c7" />
    <path d="M -12,50 L 12,50 L 15,95 L -15,95 Z" fill="#e2e8f0" /> <!-- Apron -->
    
    <!-- Head & Hair -->
    <circle cx="0" cy="15" r="15" fill="#fbcfe8" /> <!-- Skin -->
    <path d="M -15,10 C -15,0 15,0 15,10 L 15,15 L -15,15 Z" fill="#334155" /> <!-- Hair -->
    
    <!-- Friendly Face -->
    <circle cx="-5" cy="14" r="1.5" fill="#1e293b" />
    <circle cx="5" cy="14" r="1.5" fill="#1e293b" />
    <path d="M -3,20 Q 0,24 3,20" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Pointing Arm (Indicates bulk boxes) -->
    <path d="M -12,35 C -25,35 -35,25 -45,20" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <circle cx="-47" cy="19" r="3" fill="#fbcfe8" />
  </g>

  <!-- Character 2: Retail Buyer / Customer (Comparing, holding a single small retail item) -->
  <g transform="translate(95, 110)">
    <!-- Body -->
    <path d="M -12,30 L 12,30 L 18,85 L -18,85 Z" fill="#10b981" />
    
    <!-- Head & Hair -->
    <circle cx="0" cy="0" r="14" fill="#fbcfe8" />
    <path d="M -14,-5 C -14,-15 14,-15 14,-5 L 14,2 L -14,2 Z" fill="#b45309" />
    
    <!-- Face (Thoughtful / Impressed) -->
    <circle cx="-4" cy="-1" r="1.5" fill="#1e293b" />
    <circle cx="4" cy="-1" r="1.5" fill="#1e293b" />
    <path d="M -2,6 Q 0,4 2,6" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm holding single retail item -->
    <path d="M 10,25 C 20,25 25,35 20,42" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    
    <!-- Single Small Retail Item (Contrasting bulk) -->
    <rect x="16" y="38" width="10" height="14" rx="2" fill="#ec4899" />
    <rect x="18" y="41" width="6" height="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Counter / Desk Surface -->
  <path d="M 0,185 L 240,185 L 240,240 L 0,240 Z" fill="url(#counterGrad)" />
  <line x1="0" y1="185" x2="240" y2="185" stroke="#64748b" stroke-width="3" />

  <!-- Foreground Props on Counter: Price Tag Comparison Visualizing "Cheap vs Expensive" -->
  <g transform="translate(55, 155)">
    <!-- Wholesale Price Tag (Low Price / Green Accent) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="36" height="24" rx="4" fill="#10b981" />
      <circle cx="6" cy="12" r="2.5" fill="#0f172a" />
      <!-- Stylized Downward Trend / Low Price Bars -->
      <rect x="12" y="14" width="4" height="6" rx="1" fill="#ffffff" />
      <rect x="18" y="10" width="4" height="10" rx="1" fill="#ffffff" />
      <rect x="24" y="6" width="4" height="14" rx="1" fill="#ffffff" />
    </g>

    <!-- VS / Comparison Divider -->
    <circle cx="48" cy="12" r="8" fill="#334155" />
    <path d="M 44,9 L 52,15 M 52,9 L 44,15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Retail Price Tag (Higher Price / Orange-Red Accent) -->
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="36" height="24" rx="4" fill="#f43f5e" opacity="0.8" />
      <circle cx="6" cy="12" r="2.5" fill="#0f172a" />
      <!-- Stylized Higher Stack Bars -->
      <rect x="12" y="4" width="4" height="16" rx="1" fill="#ffffff" opacity="0.6" />
      <rect x="18" y="4" width="4" height="16" rx="1" fill="#ffffff" opacity="0.6" />
      <rect x="24" y="4" width="4" height="16" rx="1" fill="#ffffff" opacity="0.6" />
      <!-- Cross out line representing "more expensive" -->
      <line x1="10" y1="20" x2="30" y2="4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

</svg>