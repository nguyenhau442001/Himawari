<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glows / ambient light -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>

  <!-- Floating fresh ingredients / cause icons (representing vegetarian food context) -->
  <g opacity="0.85">
    <!-- Leaf 1 -->
    <path d="M55 75 C45 65 50 50 65 50 C70 50 75 55 75 60 C75 70 65 75 55 75 Z" fill="#2ECC71"/>
    <path d="M58 71 C62 65 65 60 71 58" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Carrot / Orange element -->
    <path d="M185 70 L195 90 L180 95 Z" fill="#E67E22"/>
    <path d="M190 92 L198 102" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"/>

    <!-- Tomato / Red element -->
    <circle cx="170" cy="140" r="12" fill="#E74C3C"/>
    <path d="M167 128 C170 125 173 125 176 128" stroke="#2ECC71" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bowl / Table setup -->
  <!-- Bowl Base Shadow -->
  <ellipse cx="120" cy="175" rx="55" ry="10" fill="#111318"/>
  
  <!-- Bowl Outer -->
  <path d="M70 145 C70 180 170 180 170 145 Z" fill="#3A4454"/>
  <!-- Bowl Rim -->
  <ellipse cx="120" cy="145" rx="50" ry="12" fill="#4E5D73"/>
  <!-- Bowl Inner -->
  <ellipse cx="120" cy="147" rx="44" ry="9" fill="#242B38"/>

  <!-- Fresh vegetables inside the bowl -->
  <circle cx="110" cy="146" r="10" fill="#2ECC71"/>
  <circle cx="130" cy="145" r="9" fill="#E67E22"/>
  <circle cx="120" cy="149" r="8" fill="#F1C40F"/>
  <path d="M98 147 C100 142 105 142 107 147 Z" fill="#27AE60"/>
  <path d="M135 147 C138 143 143 145 142 149 Z" fill="#2ECC71"/>

  <!-- Action: Chopsticks moving downward towards the bowl (Verb/Action representation) -->
  <!-- Motion lines indicating downward action -->
  <g opacity="0.6" stroke="#F1C40F" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4">
    <line x1="95" y1="85" x2="105" y2="115"/>
    <line x1="105" y1="80" x2="115" y2="110"/>
  </g>

  <!-- Chopstick 1 -->
  <line x1="75" y1="50" x2="115" y2="140" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
  <!-- Chopstick 2 -->
  <line x1="85" y1="45" x2="119" y2="138" stroke="#D35400" stroke-width="4" stroke-linecap="round"/>

  <!-- Focus accent ring (Gold/Orange) highlighting the eating action -->
  <circle cx="120" cy="146" r="54" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8"/>
  
  <!-- Sparkles / Vitality indicators -->
  <path d="M145 105 L148 112 L155 115 L148 118 L145 125 L142 118 L135 115 L142 112 Z" fill="#F1C40F" opacity="0.9"/>
  <path d="M90 120 L91.5 124 L95 125.5 L91.5 127 L90 131 L88.5 127 L85 125.5 L88.5 124 Z" fill="#2ECC71" opacity="0.9"/>

</svg>