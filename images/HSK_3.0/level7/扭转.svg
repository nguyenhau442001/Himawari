<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="170" width="180" height="50" fill="#1e293b"/>
  
  <!-- Chart showing a downward trend turning upward -->
  <path d="M50 140 L80 150 L110 120 L140 80" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 80 L170 60 L190 40" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Characters -->
  <!-- Character 1 (The Leader) -->
  <circle cx="90" cy="100" r="15" fill="#fbbf24"/>
  <path d="M75 120 Q90 140 105 120" fill="#fbbf24"/>
  <rect x="80" y="115" width="20" height="40" rx="5" fill="#38bdf8"/>
  
  <!-- Character 2 (The Teammate) -->
  <circle cx="150" cy="110" r="15" fill="#f59e0b"/>
  <path d="M135 130 Q150 150 165 130" fill="#f59e0b"/>
  <rect x="140" y="125" width="20" height="35" rx="5" fill="#fb923c"/>
  
  <!-- Action: Hand turning a large dial/knob to change the situation -->
  <circle cx="180" cy="180" r="25" fill="#334155" stroke="#fbbf24" stroke-width="3"/>
  <rect x="177" y="160" width="6" height="20" rx="2" fill="#fbbf24"/>
  <path d="M165 180 L150 170" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Ambient details -->
  <circle cx="210" cy="40" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="30" cy="50" r="2" fill="#38bdf8" opacity="0.5"/>
  <path d="M40 190 L200 190" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
</svg>