<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Visualizing "打倒" (dǎdǎo - to overthrow, knock down, defeat) -->
  <!-- We depict a central physical metaphor: a monumental, sturdy warrior figure firmly standing (representing the true warrior from the sentence), and a falling, overthrown heavy metallic column or opponent structure being tipped over, capturing the exact physical meaning of "quật ngã / đánh đổ". -->

  <!-- Dynamic impact/motion lines for the overthrow action -->
  <g stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="140" y1="90" x2="165" y2="70" />
    <line x1="150" y1="110" x2="180" y2="95" />
    <line x1="135" y1="130" x2="160" y2="140" />
  </g>

  <!-- Ground plane -->
  <line x1="40" y1="190" x2="200" y2="190" stroke="#2C313C" stroke-width="4" stroke-linecap="round"/>

  <!-- The Toppling/Defeated Structure/Opponent (Angular geometric obstacle being knocked down) -->
  <g transform="rotate(-30 150 160)">
    <rect x="130" y="110" width="40" height="80" rx="4" fill="#3E4452"/>
    <!-- Details on the falling pillar -->
    <rect x="138" y="120" width="24" height="12" rx="2" fill="#2C313C"/>
    <rect x="138" y="145" width="24" height="12" rx="2" fill="#2C313C"/>
    <rect x="138" y="170" width="24" height="12" rx="2" fill="#2C313C"/>
  </g>

  <!-- Impact dust particles -->
  <circle cx="170" cy="180" r="4" fill="#E5C07B" opacity="0.8"/>
  <circle cx="185" cy="175" r="2.5" fill="#E5C07B" opacity="0.6"/>
  <circle cx="155" cy="185" r="3" fill="#E5C07B" opacity="0.7"/>

  <!-- The Unyielding Victorious Warrior (Central physical character standing firm against adversity) -->
  <g id="warrior">
    <!-- Legs in a solid, wide stance -->
    <path d="M 85 190 L 95 145 L 105 145 L 115 190 Z" fill="#61AFEF"/>
    <path d="M 105 190 L 115 145 L 125 145 L 130 190 Z" fill="#4B88C4"/>

    <!-- Torso -->
    <path d="M 85 105 L 135 105 L 125 150 L 95 150 Z" fill="#61AFEF"/>

    <!-- Belt/Core -->
    <rect x="92" y="145" width="36" height="8" rx="2" fill="#E5C07B"/>

    <!-- Head -->
    <circle cx="110" cy="85" r="14" fill="#E5C07B"/>
    <!-- Headband / Warrior detail -->
    <path d="M 96 82 Q 110 78 124 82" stroke="#D19A66" stroke-width="4" stroke-linecap="round"/>

    <!-- Forward Arms delivering the forceful push/strike -->
    <!-- Back arm -->
    <path d="M 95 110 L 70 125 L 80 135 Z" fill="#4B88C4"/>
    <!-- Front arm pushing strongly forward -->
    <path d="M 125 110 L 155 125 L 145 138 Z" fill="#61AFEF"/>
    <!-- Solid fist contacting -->
    <circle cx="152" cy="125" r="7" fill="#E5C07B"/>
  </g>

  <!-- Accent Focus Glow behind the central action -->
  <circle cx="110" cy="130" r="50" fill="#61AFEF" opacity="0.08" style="mix-blend-mode: screen;"/>
</svg>