<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Character: Person sitting at table -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-40" r="25" fill="#fbbf24"/>
    <path d="M-10 -35 Q0 -25 10 -35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-45" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-45" r="3" fill="#0f172a"/>
    <path d="M-30 0 L30 0 L20 60 L-20 60 Z" fill="#38bdf8"/>
  </g>

  <!-- Balanced Plate (The core concept) -->
  <g transform="translate(120, 180)">
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="#f1f5f9"/>
    
    <!-- Food items representing balance -->
    <circle cx="-30" cy="-5" r="12" fill="#10b981"/> <!-- Vegetable -->
    <circle cx="0" cy="-8" r="15" fill="#ec4899"/>   <!-- Protein -->
    <circle cx="30" cy="-5" r="10" fill="#fb923c"/>  <!-- Grain -->
    
    <!-- Fork and Knife -->
    <path d="M-60 10 L-50 -20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 10 L50 -20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="40" cy="60" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="200" cy="40" r="6" fill="#38bdf8" opacity="0.3"/>
  <path d="M180 100 Q200 80 220 100" stroke="#fb923c" stroke-width="2" fill="none" opacity="0.6"/>
</svg>