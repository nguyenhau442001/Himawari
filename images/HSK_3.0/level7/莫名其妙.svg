<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="170" width="10" height="60" fill="#475569"/>
  <rect x="190" y="170" width="10" height="60" fill="#475569"/>
  
  <!-- The Angry Person -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="25" fill="#fb923c"/>
    <path d="M5 15 Q10 5 20 5 T35 15" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M10 35 Q20 45 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="0" y="50" width="40" height="80" rx="10" fill="#fb923c"/>
    <path d="M5 60 L-10 90" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M35 60 L50 90" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Angry gesture -->
    <circle cx="20" cy="-10" r="5" fill="#ec4899"/>
    <path d="M20 -5 L20 10" stroke="#ec4899" stroke-width="3"/>
  </g>
  
  <!-- The Confused Person -->
  <g transform="translate(40, 100)">
    <circle cx="30" cy="30" r="25" fill="#38bdf8"/>
    <ellipse cx="20" cy="25" rx="3" ry="5" fill="#0f172a"/>
    <ellipse cx="40" cy="25" rx="3" ry="5" fill="#0f172a"/>
    <path d="M15 45 Q30 55 45 45" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Question mark shape -->
    <path d="M50 5 Q60 -5 70 5 T60 25 L60 35" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="45" r="3" fill="#f59e0b"/>
    <rect x="10" y="60" width="40" height="80" rx="10" fill="#38bdf8"/>
  </g>
  
  <!-- Context Props -->
  <rect x="150" y="130" width="30" height="30" rx="4" fill="#64748b"/>
  <circle cx="165" cy="145" r="8" fill="#1e293b"/>
  <rect x="60" y="140" width="20" height="20" rx="2" fill="#10b981"/>
</svg>