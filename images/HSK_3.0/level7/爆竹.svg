<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Sparkles and festive atmosphere background dots -->
    <circle cx="-60" cy="-70" r="2" fill="#F39C12" opacity="0.6"/>
    <circle cx="70" cy="-50" r="3" fill="#F1C40F" opacity="0.8"/>
    <circle cx="-50" cy="60" r="2.5" fill="#E74C3C" opacity="0.7"/>
    <circle cx="65" cy="50" r="2" fill="#F39C12" opacity="0.5"/>
    <circle cx="0" cy="-90" r="3" fill="#F1C40F" opacity="0.9"/>

    <!-- Explosion / Firecracker Sparks at Top -->
    <g transform="translate(0, -50)">
      <path d="M0,0 L0,-35" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,0 L-25,-25" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,0 L25,-25" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,0 L-35,0" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,0 L35,0" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,0 L-18,-35" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0,0 L18,-35" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Center burst glow -->
      <circle cx="0" cy="0" r="12" fill="#F1C40F"/>
      <circle cx="0" cy="0" r="6" fill="#FFF"/>
    </g>

    <!-- Hanging String at Top -->
    <path d="M0,-85 L0,-50" stroke="#D35400" stroke-width="3" stroke-linecap="round"/>

    <!-- String of Firecrackers (爆竹/Bàozhú) -->
    <!-- Firecracker 1 (Top) -->
    <g transform="translate(0, -35)">
      <rect x="-18" y="0" width="36" height="22" rx="4" fill="#C0392B"/>
      <rect x="-18" y="4" width="36" height="4" fill="#E74C3C"/>
      <rect x="-18" y="14" width="36" height="4" fill="#E74C3C"/>
      <rect x="-15" y="0" width="30" height="22" fill="none" stroke="#D35400" stroke-width="1" rx="3"/>
      <!-- Gold bands -->
      <rect x="-18" y="0" width="4" height="22" fill="#F1C40F"/>
      <rect x="14" y="0" width="4" height="22" fill="#F1C40F"/>
    </g>

    <!-- Connector String 1-2 -->
    <path d="M0,13 C-10,13 -12,21 0,25" fill="none" stroke="#D35400" stroke-width="2"/>

    <!-- Firecracker 2 -->
    <g transform="translate(0, 15)">
      <rect x="-18" y="0" width="36" height="22" rx="4" fill="#C0392B"/>
      <rect x="-18" y="4" width="36" height="4" fill="#E74C3C"/>
      <rect x="-18" y="14" width="36" height="4" fill="#E74C3C"/>
      <rect x="-15" y="0" width="30" height="22" fill="none" stroke="#D35400" stroke-width="1" rx="3"/>
      <rect x="-18" y="0" width="4" height="22" fill="#F1C40F"/>
      <rect x="14" y="0" width="4" height="22" fill="#F1C40F"/>
    </g>

    <!-- Connector String 2-3 -->
    <path d="M0,63 C10,63 12,71 0,75" fill="none" stroke="#D35400" stroke-width="2"/>

    <!-- Firecracker 3 -->
    <g transform="translate(0, 65)">
      <rect x="-18" y="0" width="36" height="22" rx="4" fill="#C0392B"/>
      <rect x="-18" y="4" width="36" height="4" fill="#E74C3C"/>
      <rect x="-18" y="14" width="36" height="4" fill="#E74C3C"/>
      <rect x="-15" y="0" width="30" height="22" fill="none" stroke="#D35400" stroke-width="1" rx="3"/>
      <rect x="-18" y="0" width="4" height="22" fill="#F1C40F"/>
      <rect x="14" y="0" width="4" height="22" fill="#F1C40F"/>
    </g>

    <!-- Connector String 3-4 -->
    <path d="M0,113 C-10,113 -12,121 0,125" fill="none" stroke="#D35400" stroke-width="2"/>

    <!-- Firecracker 4 (Bottom) -->
    <g transform="translate(0, 115)">
      <rect x="-18" y="0" width="36" height="22" rx="4" fill="#C0392B"/>
      <rect x="-18" y="4" width="36" height="4" fill="#E74C3C"/>
      <rect x="-18" y="14" width="36" height="4" fill="#E74C3C"/>
      <rect x="-15" y="0" width="30" height="22" fill="none" stroke="#D35400" stroke-width="1" rx="3"/>
      <rect x="-18" y="0" width="4" height="22" fill="#F1C40F"/>
      <rect x="14" y="0" width="4" height="22" fill="#F1C40F"/>
    </g>

    <!-- Bottom Tassel / Tail -->
    <path d="M0,137 L0,155" stroke="#D35400" stroke-width="3"/>
    <path d="M-6,155 L6,155 L4,175 L-4,175 Z" fill="#F1C40F"/>
  </g>
</svg>