<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Contextual setting: Door frame and threshold -->
  <g transform="translate(40, 30)">
    <!-- Outer door frame shadow/depth -->
    <rect x="0" y="0" width="160" height="180" rx="4" fill="#252A34" />
    
    <!-- Door opening background (dark interior room) -->
    <rect x="10" y="10" width="140" height="160" fill="#111318" />

    <!-- Broken/impacted door panel flying open (perspective view) -->
    <path d="M 10 10 L 90 25 L 90 155 L 10 170 Z" fill="#3A4454" />
    <!-- Door handle on flying panel -->
    <circle cx="75" cy="90" r="4" fill="#FF9F43" />

    <!-- Splinter effect / Impact lines at the lock area -->
    <path d="M 90 85 L 105 82 M 90 95 L 108 98 M 92 90 L 115 90" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" />

    <!-- Action motion lines of the kick -->
    <path d="M 125 125 L 100 100 M 135 110 L 105 85 M 120 140 L 90 115" stroke="#FF9F43" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" opacity="0.7" />

    <!-- The Kicking Foot/Leg (Dynamic and forceful, highlighting 踹) -->
    <g>
      <!-- Pant leg -->
      <path d="M 130 160 L 175 130 L 160 110 L 115 140 Z" fill="#4B6584" />
      
      <!-- Shoe / Sneaker making impact -->
      <g transform="translate(90, 85)">
        <!-- Sole -->
        <path d="M 0 10 L 35 0 L 40 15 L 5 25 Z" fill="#222F3E" />
        <!-- Upper shoe body -->
        <path d="M 5 12 L 35 2 L 30 -15 L -5 -5 Z" fill="#FF4757" />
        <!-- Accent stripe on shoe -->
        <path d="M 10 5 L 25 -2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Floor line -->
    <line x1="0" y1="170" x2="160" y2="170" stroke="#2D3436" stroke-width="3" />
  </g>
</svg>