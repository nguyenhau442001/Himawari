<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Water Surface Gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Warm Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leafAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="leafYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Ripples SVG Filter/Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & BACKGROUND -->
  <!-- Night Sky/Park elements: distant bamboo/reeds silhouette -->
  <path d="M15 130 L15 90 Q15 85 18 85 Q21 85 21 90 L21 130" fill="#334155" opacity="0.6"/>
  <path d="M28 130 L28 80 Q28 75 31 75 Q34 75 34 80 L34 130" fill="#334155" opacity="0.7"/>
  <path d="M220 130 L220 85 Q220 80 223 80 Q226 80 226 85 L226 130" fill="#334155" opacity="0.6"/>
  <path d="M208 130 L208 75 Q208 70 211 70 Q214 70 214 75 L214 130" fill="#334155" opacity="0.7"/>

  <!-- Glowing Garden Lantern casting light on the scene -->
  <circle cx="215" cy="50" r="35" fill="url(#lanternGlow)"/>
  <path d="M210 25 L220 25 L223 45 L207 45 Z" fill="#475569"/>
  <path d="M205 45 L225 45 L222 65 L208 65 Z" fill="#f59e0b"/>
  <line x1="215" y1="10" x2="215" y2="25" stroke="#475569" stroke-width="2"/>

  <!-- Stone Bank / Shoreline at bottom/sides -->
  <path d="M 0 145 Q 40 135 80 142 T 160 140 T 240 145 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <path d="M 0 150 Q 50 140 100 148 T 240 146 L 240 240 L 0 240 Z" fill="#0f172a"/>
  
  <!-- Mossy rocks on the bank -->
  <ellipse cx="45" cy="148" rx="22" ry="10" fill="#334155"/>
  <path d="M35 145 Q40 138 55 142 Z" fill="#10b981" opacity="0.7"/>
  <ellipse cx="195" cy="152" rx="28" ry="12" fill="#334155"/>
  <path d="M185 148 Q200 143 210 149 Z" fill="#10b981" opacity="0.6"/>

  <!-- WATER SURFACE (Main Context) -->
  <path d="M 0 135 Q 60 125 120 135 T 240 135 L 240 220 Q 180 230 120 220 T 0 220 Z" fill="url(#waterGrad)"/>

  <!-- Water Ripples / Caustics -->
  <path d="M 50 160 Q 70 157 90 160" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 140 180 Q 160 176 180 180" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 80 200 Q 100 196 120 200" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- FALLEN LEAVES "漂浮" (TRÔI NỔI, LỮNG LỜ) ON WATER -->
  
  <!-- Leaf 1 (Amber, upper left of water) -->
  <g transform="translate(65, 148) rotate(-15)">
    <ellipse cx="0" cy="0" rx="10" ry="5" fill="url(#leafAmber)" filter="url(#softGlow)"/>
    <!-- Leaf stem & veins -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#7c2d12" stroke-width="0.75"/>
    <path d="M -2 0 L -5 -3 M 2 0 L 0 -3" stroke="#7c2d12" stroke-width="0.5"/>
    <!-- Water ripple under leaf -->
    <ellipse cx="0" cy="3" rx="12" ry="3" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Leaf 2 (Yellow, center water - main focus) -->
  <g transform="translate(125, 172) rotate(25)">
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="url(#leafYellow)" filter="url(#softGlow)"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#854d0e" stroke-width="1"/>
    <path d="M -4 0 L -8 -4 M 3 0 L 0 -4 M 7 0 L 5 3" stroke="#854d0e" stroke-width="0.75"/>
    <!-- Water ripple under leaf -->
    <ellipse cx="0" cy="5" rx="16" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Leaf 3 (Small reddish-orange, lower right) -->
  <g transform="translate(170, 205) rotate(-40)">
    <ellipse cx="0" cy="0" rx="9" ry="4.5" fill="url(#leafAmber)" filter="url(#softGlow)"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#7c2d12" stroke-width="0.75"/>
    <ellipse cx="0" cy="3" rx="11" ry="2.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Leaf 4 (Tiny accent leaf drifting near edge) -->
  <g transform="translate(95, 190) rotate(10)">
    <ellipse cx="0" cy="0" rx="7" ry="3.5" fill="#facc15" opacity="0.9"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#854d0e" stroke-width="0.5"/>
    <ellipse cx="0" cy="2" rx="8" ry="2" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.4"/>
  </g>


  <!-- FOREGROUND CHARACTER (Human element observing the scene to make it concrete and relatable) -->
  <!-- Character leaning over the rock/bank, pointing or watching the floating leaves -->
  
  <!-- Body/Torso in warm winter coat -->
  <path d="M 25 150 Q 25 130 40 125 L 55 135 L 50 160 Z" fill="#0284c7"/>
  
  <!-- Head & Hair -->
  <circle cx="35" cy="112" r="12" fill="#fed7aa"/>
  <path d="M 23 110 Q 32 98 45 105 Q 48 110 47 115 L 23 115 Z" fill="#334155"/> <!-- Hair -->
  
  <!-- Arm pointing down towards the water -->
  <path d="M 45 130 Q 55 135 65 145 L 70 143 Q 60 130 48 126 Z" fill="#0284c7"/>
  <!-- Hand -->
  <circle cx="72" cy="142" r="3.5" fill="#fed7aa"/>

  <!-- Warm Scarf -->
  <path d="M 28 118 Q 36 125 45 118 L 47 124 Q 36 130 27 124 Z" fill="#ec4899"/>
  <path d="M 42 121 L 46 140 L 40 142 L 38 123 Z" fill="#ec4899"/> <!-- Scarf tail -->

  <!-- Atmospheric glowing particles floating in the air (fireflies/dust motes matching the peaceful mood) -->
  <circle cx="70" cy="100" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="110" cy="90" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="150" cy="110" r="1" fill="#fde047" opacity="0.9"/>
  <circle cx="180" cy="85" r="2.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="90" cy="120" r="1.2" fill="#fde047" opacity="0.7"/>

</svg>