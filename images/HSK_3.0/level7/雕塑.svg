<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Statue Golden Glow Gradient -->
    <linearGradient id="statueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Base Gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Ground / Plaza Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)"/>

  <!-- DISTANT URBAN BUILDINGS & NIGHT SKY -->
  <!-- City skyline silhouetted -->
  <path d="M 0 145 L 20 145 L 20 100 L 35 100 L 35 145 L 55 145 L 55 85 L 75 85 L 75 145 L 95 145 L 95 115 L 110 115 L 110 145 L 130 145 L 130 90 L 150 90 L 150 145 L 175 145 L 175 110 L 195 110 L 195 145 L 215 145 L 215 95 L 240 95 L 240 160 L 0 160 Z" fill="#1e293b" opacity="0.6"/>
  
  <!-- Warm window lights in distance -->
  <rect x="25" y="110" width="4" height="6" fill="#fbbf24" opacity="0.7"/>
  <rect x="60" y="95" width="5" height="8" fill="#38bdf8" opacity="0.5"/>
  <rect x="135" y="100" width="6" height="6" fill="#fbbf24" opacity="0.6"/>
  <rect x="180" y="120" width="4" height="10" fill="#fbbf24" opacity="0.8"/>

  <!-- Plaza Ground / Perspective Floor -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#groundGrad)"/>
  
  <!-- Plaza Floor Tile Lines (Perspective towards center) -->
  <line x1="120" y1="160" x2="30" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="160" x2="90" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="160" x2="150" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="160" x2="210" y2="240" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="120" cy="180" rx="70" ry="15" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <ellipse cx="120" cy="205" rx="100" ry="22" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- CENTRAL SCULPTURE & PEDESTAL (雕塑 - diāosù) -->
  <!-- Circular multi-tier Fountain/Pedestal Base -->
  <ellipse cx="120" cy="165" rx="42" ry="12" fill="#475569"/>
  <path d="M 78 165 L 78 175 C 78 181, 162 181, 162 175 L 162 165 Z" fill="url(#baseGrad)"/>
  
  <ellipse cx="120" cy="153" rx="28" ry="8" fill="#64748b"/>
  <path d="M 92 153 L 92 165 C 92 169, 148 169, 148 165 L 148 153 Z" fill="url(#baseGrad)"/>

  <!-- Pillar Plinth -->
  <rect x="104" y="130" width="32" height="23" fill="#cbd5e1" rx="2"/>
  <rect x="107" y="133" width="26" height="17" fill="#94a3b8" rx="1"/>

  <!-- The Statue Itself (Abstract dynamic heroic/artistic figure) -->
  <!-- Statue Shadow/Backplate glow -->
  <circle cx="120" cy="95" r="30" fill="#fef08a" opacity="0.15"/>

  <!-- Artistic Dynamic Figure (Golden/Bronze Statue) -->
  <!-- Torso & Flowing Garments/Abstract form -->
  <path d="M 120 130 C 110 120, 108 105, 112 90 C 115 80, 110 70, 100 65 C 112 60, 125 70, 128 85 C 135 70, 148 60, 155 68 C 145 75, 138 85, 140 100 C 143 115, 130 122, 120 130 Z" fill="url(#statueGrad)"/>
  
  <!-- Statue Head / Crown element -->
  <circle cx="120" cy="62" r="8" fill="url(#statueGrad)"/>
  <path d="M 114 54 C 120 48, 126 54, 126 54 L 120 50 Z" fill="#fef08a"/>

  <!-- Statue Extended Arms holding a star/sphere -->
  <path d="M 112 90 C 95 92, 85 82, 80 75" fill="none" stroke="url(#statueGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 128 85 C 145 92, 155 82, 160 75" fill="none" stroke="url(#statueGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Glowing Sphere element on Statue -->
  <circle cx="80" cy="73" r="5" fill="#ffffff" filter="drop-shadow(0 0 4px #fbbf24)"/>
  <circle cx="160" cy="73" r="5" fill="#ffffff" filter="drop-shadow(0 0 4px #fbbf24)"/>

  <!-- FOREGROUND ENVIRONMENT & CHARACTERS -->
  <!-- Ambient Lanterns / Street Lamps -->
  <!-- Left Lamp Post -->
  <rect x="35" y="115" width="4" height="75" fill="#334155"/>
  <circle cx="37" cy="112" r="7" fill="#fbbf24" filter="drop-shadow(0 0 6px #f59e0b)"/>
  <path d="M 33 118 L 41 118 L 39 123 L 35 123 Z" fill="#64748b"/>

  <!-- Right Lamp Post -->
  <rect x="201" y="115" width="4" height="75" fill="#334155"/>
  <circle cx="203" cy="112" r="7" fill="#fbbf24" filter="drop-shadow(0 0 6px #f59e0b)"/>
  <path d="M 199 118 L 207 118 L 205 123 L 201 123 Z" fill="#64748b"/>

  <!-- CHARACTER 1: Person walking a cute dog near the plaza -->
  <!-- Person (Walking, looking at statue) -->
  <!-- Legs -->
  <path d="M 68 200 L 73 225" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 76 198 L 82 223" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <!-- Body / Jacket -->
  <path d="M 66 175 C 64 165, 75 160, 80 175 L 82 200 L 68 200 Z" fill="#f43f5e"/>
  <!-- Head & Hair -->
  <circle cx="74" cy="155" r="7" fill="#fbcfe8"/>
  <path d="M 67 154 C 67 147, 81 147, 81 154 Z" fill="#475569"/>
  <!-- Arm pointing at statue -->
  <path d="M 78 172 L 95 165" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>

  <!-- Cute Dog looking up at the sculpture -->
  <ellipse cx="50" cy="210" rx="9" ry="6" fill="#d97706"/>
  <circle cx="43" cy="206" r="5" fill="#d97706"/>
  <path d="M 40 203 L 43 207 L 39 207 Z" fill="#b45309"/> <!-- ear -->
  <path d="M 55 212 L 53 223" stroke="#d97706" stroke-width="3" stroke-linecap="round"/> <!-- leg -->
  <path d="M 46 212 L 45 223" stroke="#d97706" stroke-width="3" stroke-linecap="round"/> <!-- leg -->
  <path d="M 59 208 C 62 205, 63 210, 60 212" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/> <!-- tail -->

  <!-- Leash -->
  <path d="M 68 175 C 60 185, 55 195, 45 205" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- CHARACTER 2: Sitting on a curved bench, enjoying the view -->
  <!-- Curved Bench -->
  <path d="M 145 190 C 160 185, 185 185, 200 195" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  <rect x="150" y="195" width="6" height="15" fill="#451a03"/>
  <rect x="190" y="195" width="6" height="15" fill="#451a03"/>

  <!-- Sitting Person -->
  <path d="M 165 178 L 163 195 L 178 195 L 178 182 Z" fill="#10b981"/> <!-- Torso -->
  <circle cx="171" cy="166" r="7" fill="#fbcfe8"/> <!-- Head -->
  <path d="M 164 164 C 164 158, 178 158, 178 164 Z" fill="#334155"/> <!-- Hair -->
  <!-- Legs sitting -->
  <path d="M 178 192 L 188 192 L 188 202" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Floating Sparkles / Ambient Magic around the Statue -->
  <circle cx="100" cy="105" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="140" cy="115" r="2" fill="#fef08a" opacity="0.9"/>
  <circle cx="130" cy="55" r="1.5" fill="#fef08a" opacity="0.7"/>
  <circle cx="105" cy="80" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- Soft Vignette / Edge Shadow for polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="6" opacity="0.5"/>
</svg>