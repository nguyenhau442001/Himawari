<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing spotlight background effect for "exclusive" focus -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.08"/>

  <!-- Physical Object representing "独家" (Exclusive Scoop / Newspaper Report) -->
  <!-- Newspaper Base -->
  <g transform="translate(60, 48)">
    <!-- Back page shadow/layer -->
    <rect x="12" y="12" width="96" height="120" rx="4" fill="#2A2F3D"/>
    <!-- Main newspaper sheet -->
    <rect x="6" y="6" width="96" height="120" rx="4" fill="#3A4154"/>
    <rect x="0" y="0" width="96" height="120" rx="4" fill="#F4F5F7"/>

    <!-- Newspaper header / Masthead -->
    <rect x="12" y="14" width="72" height="6" rx="2" fill="#1A1D24"/>
    <line x1="12" y1="26" x2="84" y2="26" stroke="#D0D5DD" stroke-width="1.5"/>

    <!-- Article layout mock -->
    <!-- Main headline block -->
    <rect x="12" y="34" width="50" height="12" rx="2" fill="#1A1D24"/>
    
    <!-- Thumbnail image placeholder -->
    <rect x="12" y="52" width="40" height="36" rx="2" fill="#D0D5DD"/>
    <circle cx="32" cy="70" r="8" fill="#98A2B3"/>

    <!-- Text lines -->
    <line x1="58" y1="54" x2="84" y2="54" stroke="#98A2B3" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="62" x2="84" y2="62" stroke="#98A2B3" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="70" x2="80" y2="70" stroke="#98A2B3" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="78" x2="84" y2="78" stroke="#98A2B3" stroke-width="2" stroke-linecap="round"/>

    <!-- More body text lines -->
    <line x1="12" y1="96" x2="84" y2="96" stroke="#D0D5DD" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="104" x2="72" y2="104" stroke="#D0D5DD" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- "EXCLUSIVE" (独家) Badge / Stamp overlay -->
  <g transform="translate(120, 135)">
    <!-- Badge background with sleek flat style -->
    <circle cx="0" cy="0" r="34" fill="#1A1D24" stroke="#FB8500" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="#FFB703"/>

    <!-- Star / Key icon representing premium/exclusive value -->
    <path d="M0 -14 L3.5 -4.5 L13.5 -4.5 L5.5 1.5 L8.5 11.5 L0 5.5 L-8.5 11.5 L-5.5 1.5 L-13.5 -4.5 L-3.5 -4.5 Z" fill="#1A1D24" transform="scale(0.9)"/>
  </g>

  <!-- Magnifying glass highlighting the exclusive scoop -->
  <g transform="translate(145, 65)">
    <!-- Handle -->
    <rect x="0" y="0" width="8" height="30" rx="4" fill="#FB8500" transform="rotate(45 0 0)"/>
    <!-- Glass Rim -->
    <circle cx="-15" cy="-15" r="20" fill="none" stroke="#FFB703" stroke-width="5"/>
    <!-- Glass Reflection -->
    <path d="M-26 -20 A 12 12 0 0 1 -10 -26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>