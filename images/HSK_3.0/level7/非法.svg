<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & shadows (Back alley / shady indoor deal setting) -->
  <path d="M0 0h240v240H0z" fill="url(#bg-gradient)"/>
  <circle cx="180" cy="70" r="80" fill="#38bdf8" opacity="0.05"/>
  <circle cx="60" cy="180" r="90" fill="#f59e0b" opacity="0.06"/>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="desk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="glow-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Environment / Office Wall & Window / Blinds -->
  <g opacity="0.4">
    <!-- Brick/Panel lines -->
    <path d="M0 60h240M0 100h240" stroke="#334155" stroke-width="0.5" stroke-dasharray="8 4"/>
    <!-- Shady Venetian Blinds at top -->
    <rect x="20" y="10" width="200" height="8" rx="2" fill="#475569"/>
    <rect x="20" y="22" width="200" height="8" rx="2" fill="#475569"/>
    <rect x="20" y="34" width="200" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- Desk Surface -->
  <path d="M20 160h200l-15 50H35z" fill="url(#desk-grad)"/>
  <path d="M20 160h200v4H20z" fill="#475569"/> <!-- Desk rim highlight -->

  <!-- CONTEXT PROPS: Briefcase with glowing contraband / cash / transaction items -->
  <g transform="translate(70, 130)">
    <!-- Briefcase open -->
    <path d="M10 20h80l10 25H0z" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <path d="M5 25h90v20H5z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Glowing stacks inside -->
    <rect x="15" y="28" width="25" height="12" rx="2" fill="#10b981" opacity="0.9"/>
    <rect x="45" y="28" width="25" height="12" rx="2" fill="#10b981" opacity="0.9"/>
    <!-- Suspicious light effect -->
    <ellipse cx="50" cy="35" rx="35" ry="15" fill="#10b981" opacity="0.2" filter="blur(4px)"/>
  </g>

  <!-- CHARACTER 1: Shady Seller (Left, handing over / pointing) -->
  <g transform="translate(15, 65)">
    <!-- Body / Jacket -->
    <path d="M35 55c-5 10-15 25-25 40h75c-10-15-20-30-25-40z" fill="#334155"/>
    <!-- Head & Hat (Fedora style for shady look) -->
    <circle cx="40" cy="30" r="14" fill="#cbd5e1"/>
    <!-- Hat -->
    <ellipse cx="40" cy="20" rx="18" ry="5" fill="#1e293b"/>
    <path d="M26 18c3-8 25-8 28 0z" fill="#1e293b"/>
    <!-- Face expression: scheming smirk -->
    <path d="M44 32c-2 2-6 2-8 0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Arm reaching across -->
    <path d="M45 50l40 15-5 10-35-15z" fill="#334155"/>
    <circle cx="82" cy="73" r="5" fill="#cbd5e1"/> <!-- Hand -->
  </g>

  <!-- CHARACTER 2: Buyer / Receiving (Right, leaning in with suspicion) -->
  <g transform="translate(130, 60)">
    <!-- Body / Trench coat -->
    <path d="M45 60c5 10 15 25 25 35H10c10-10 18-25 23-35z" fill="#1e293b"/>
    <path d="M35 60l15 35h15L45 60z" fill="#0f172a"/>
    <!-- Head -->
    <circle cx="45" cy="33" r="14" fill="#cbd5e1"/>
    <!-- Hair -->
    <path d="M32 28c2-8 22-8 26 0-3-4-23-4-26 0z" fill="#475569"/>
    <!-- Serious eyes / worried brow -->
    <path d="M40 33l6-2" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M48 33l6-2" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm leaning on desk -->
    <path d="M30 55l-25 15 5 8 22-12z" fill="#1e293b"/>
    <circle cx="7" cy="74" r="5" fill="#cbd5e1"/> <!-- Hand -->
  </g>

  <!-- ALERT / WARNING VIBE: Subtle Red Prohibition / Illegal Indicator (Abstract graphic representing illicit nature without text) -->
  <g transform="translate(120, 20)">
    <!-- Glowing red warning aura -->
    <circle cx="0" cy="0" r="18" fill="url(#glow-red)"/>
    <!-- Cross/Forbidden outline element -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
    <path d="M-8 -8l16 16" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Secondary props on desk (magnifying glass or scanner hinting at investigation/transaction) -->
  <g transform="translate(170, 150)">
    <line x1="0" y1="20" x2="15" y2="5" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="5" cy="25" r="10" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="5" cy="25" r="8" fill="#38bdf8" opacity="0.2"/>
  </g>

  <!-- Foreground shadow accents for depth -->
  <path d="M0 240h240v-10H0z" fill="#020617"/>
</svg>