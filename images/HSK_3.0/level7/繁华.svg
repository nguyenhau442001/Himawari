<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background sky gradient representing a bustling evening in Shanghai -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing effect for city lights -->
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Tower glass gradient -->
    <linearGradient id="towerGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Ambient background glows -->
  <circle cx="120" cy="110" r="80" fill="url(#glowAmber)" />
  <circle cx="60" cy="140" r="60" fill="url(#glowPink)" />
  <circle cx="180" cy="130" r="60" fill="url(#glowBlue)" />

  <!-- BACKGROUND: Distant skyline -->
  <path d="M 0 170 L 0 240 L 240 240 L 240 170 Z" fill="#090d16" />
  <g fill="#111827" opacity="0.8">
    <rect x="15" y="140" width="18" height="100" />
    <rect x="35" y="125" width="22" height="115" />
    <rect x="60" y="150" width="14" height="90" />
    <rect x="165" y="130" width="25" height="110" />
    <rect x="195" y="145" width="16" height="95" />
    <rect x="215" y="120" width="20" height="120" />
  </g>

  <!-- MIDGROUND: Iconic Shanghai-inspired architecture (The Bund / Lujiazui stylized) -->
  <!-- Oriental Pearl / TV Tower stylized profile in background center-left -->
  <g opacity="0.9">
    <line x1="95" y1="60" x2="95" y2="170" stroke="#334155" stroke-width="2" />
    <circle cx="95" cy="85" r="9" fill="#db2777" />
    <circle cx="95" cy="115" r="6" fill="#db2777" />
    <ellipse cx="95" cy="70" rx="5" ry="3" fill="#f43f5e" />
  </g>

  <!-- Futuristic Supertall Skyscraper (Center-Right) -->
  <polygon points="135,170 142,40 148,40 155,170" fill="url(#towerGlass)" />
  <!-- Skyscraper neon glowing strips -->
  <line x1="145" y1="40" x2="145" y2="170" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
  <line x1="142" y1="70" x2="148" y2="70" stroke="#fbbf24" stroke-width="1" />
  <line x1="142" y1="100" x2="148" y2="100" stroke="#fbbf24" stroke-width="1" />
  <line x1="142" y1="130" x2="148" y2="130" stroke="#fbbf24" stroke-width="1" />

  <!-- Classic Historic Bund Building (Left) -->
  <path d="M 10 170 L 10 135 L 25 130 L 40 135 L 40 170 Z" fill="#334155" />
  <rect x="22" y="120" width="6" height="10" fill="#475569" />
  <!-- Warm window grid on historic building -->
  <rect x="15" y="145" width="5" height="6" fill="#fbbf24" opacity="0.8" />
  <rect x="25" y="145" width="5" height="6" fill="#fbbf24" opacity="0.8" />
  <rect x="15" y="158" width="5" height="6" fill="#fbbf24" opacity="0.8" />
  <rect x="25" y="158" width="5" height="6" fill="#fbbf24" opacity="0.8" />

  <!-- Huangpu River water surface reflection area -->
  <path d="M 0 170 Q 60 166 120 170 Q 180 174 240 170 L 240 195 L 0 195 Z" fill="#0f172a" />
  <!-- City light reflections in water -->
  <ellipse cx="95" cy="180" rx="12" ry="2" fill="#ec4899" opacity="0.6" />
  <ellipse cx="145" cy="182" rx="8" ry="1.5" fill="#38bdf8" opacity="0.6" />
  <ellipse cx="30" cy="179" rx="15" ry="2" fill="#fbbf24" opacity="0.5" />
  <ellipse cx="190" cy="181" rx="10" ry="2" fill="#fbbf24" opacity="0.4" />

  <!-- FOREGROUND: Elevated Riverside Promenade / Viewing Deck with Characters -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#090d16" />
  <!-- Promenade floor texture/edge -->
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2" />
  <line x1="0" y1="202" x2="240" y2="202" stroke="#1e293b" stroke-width="1" />

  <!-- Modern Glass Railing -->
  <line x1="0" y1="195" x2="240" y2="195" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  <line x1="20" y1="195" x2="20" y2="205" stroke="#64748b" stroke-width="1.5" />
  <line x1="80" y1="195" x2="80" y2="205" stroke="#64748b" stroke-width="1.5" />
  <line x1="140" y1="195" x2="140" y2="205" stroke="#64748b" stroke-width="1.5" />
  <line x1="200" y1="195" x2="200" y2="205" stroke="#64748b" stroke-width="1.5" />

  <!-- CHARACTER 1: Young woman taking a photo/enjoying the view -->
  <g transform="translate(70, 168)">
    <!-- Body & Coat -->
    <path d="M 10 27 L 18 55 L 4 55 Z" fill="#0284c7" />
    <path d="M 8 26 Q 14 24 20 27 L 22 55 L 6 55 Z" fill="#0369a1" />
    <!-- Head & Hair -->
    <circle cx="14" cy="16" r="6" fill="#fbcfe8" />
    <path d="M 8 15 Q 14 8 20 15 Q 21 23 18 25 Q 14 22 10 25 Q 7 23 8 15 Z" fill="#334155" />
    <!-- Arm holding smartphone up -->
    <path d="M 16 28 L 24 20 L 27 22" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Smartphone with glowing screen -->
    <rect x="25" y="18" width="5" height="7" rx="1" fill="#38bdf8" />
    <!-- Scarf -->
    <path d="M 9 24 Q 14 27 19 24 L 21 28 Q 14 31 7 28 Z" fill="#f43f5e" />
  </g>

  <!-- CHARACTER 2: Young man pointing enthusiastically at the bustling skyline -->
  <g transform="translate(110, 163)">
    <!-- Body & Jacket -->
    <path d="M 8 32 L 18 60 L 2 60 Z" fill="#475569" />
    <path d="M 12 32 Q 18 30 24 32 L 22 60 L 10 60 Z" fill="#334155" />
    <!-- Head & Hair -->
    <circle cx="16" cy="20" r="6" fill="#fde68a" />
    <path d="M 10 18 Q 16 10 22 18 Q 20 22 16 21 Q 12 22 10 18 Z" fill="#1e293b" />
    <!-- Pointing Arm reaching out towards the view -->
    <path d="M 20 34 L 32 26 L 36 25" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Casual pants -->
    <path d="M 5 60 L 5 77 L 10 77 L 10 60 Z" fill="#0f172a" />
    <path d="M 14 60 L 14 77 L 19 77 L 19 60 Z" fill="#0f172a" />
    <!-- Yellow stylish backpack strap hint -->
    <path d="M 10 32 L 6 45" fill="none" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- FOREGROUND PROPS: Modern Streetlamp casting warm golden light -->
  <g transform="translate(195, 130)">
    <!-- Lamp Pole -->
    <line x1="0" y1="15" x2="0" y2="80" stroke="#334155" stroke-width="3" />
    <!-- Light Fixture -->
    <path d="M -8 15 Q 0 8 8 15 Z" fill="#1e293b" />
    <!-- Warm Glow from Lamp -->
    <circle cx="0" cy="20" r="15" fill="url(#glowAmber)" />
  </g>

  <!-- Floating decorative particle lights (City ambiance) -->
  <circle cx="50" cy="90" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="75" cy="70" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="125" cy="55" r="1.5" fill="#f43f5e" opacity="0.9" />
  <circle cx="170" cy="85" r="2" fill="#fbbf24" opacity="0.7" />
  <circle cx="210" cy="65" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="40" cy="115" r="1" fill="#ec4899" opacity="0.8" />
</svg>