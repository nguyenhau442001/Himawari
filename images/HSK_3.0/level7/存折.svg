<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bankbook (存折) -->
  <g transform="translate(60, 70)">
    <!-- Main body of the bankbook -->
    <rect x="0" y="0" width="120" height="100" rx="4" fill="#2D343E" stroke="#FFB84D" stroke-width="2"/>
    <rect x="4" y="4" width="112" height="92" rx="2" fill="#3B4452"/>
    
    <!-- Spine -->
    <rect x="-6" y="0" width="6" height="100" rx="2" fill="#FFB84D"/>
    
    <!-- Internal lines representing pages/entries -->
    <line x1="15" y1="20" x2="105" y2="20" stroke="#7D8696" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="35" x2="105" y2="35" stroke="#7D8696" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="50" x2="105" y2="50" stroke="#7D8696" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="65" x2="105" y2="65" stroke="#7D8696" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="80" x2="60" y2="80" stroke="#7D8696" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Decorative accent -->
    <circle cx="100" cy="80" r="6" fill="#FFB84D"/>
  </g>
</svg>