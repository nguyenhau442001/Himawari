<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Canvas Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Danger/Alert Glow -->
    <radialGradient id="alertGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Environment: Bank/Office Room -->
  <!-- Floor -->
  <polygon points="0,170 240,170 240,240 0,240" fill="#0f172a"/>
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b"/>
  <!-- Baseboard Trim -->
  <rect x="0" y="164" width="240" height="6" fill="#0f172a"/>

  <!-- Background Props: Large Security Window with Blinds -->
  <rect x="130" y="30" width="80" height="110" fill="#090d16" stroke="#334155" stroke-width="4"/>
  <!-- Window Glass -->
  <rect x="134" y="34" width="72" height="102" fill="#1e293b"/>
  <!-- Window Bars / Grid -->
  <line x1="170" y1="34" x2="170" y2="136" stroke="#334155" stroke-width="3"/>
  <!-- Light Beam from Window -->
  <polygon points="134,34 206,34 240,170 170,170" fill="url(#lightBeam)"/>

  <!-- Desk & Office Props -->
  <!-- Overturned/Displaced Office Desk -->
  <rect x="20" y="140" width="85" height="12" fill="#b45309" rx="2"/>
  <!-- Desk Legs -->
  <rect x="28" y="152" width="6" height="25" fill="#78350f"/>
  <rect x="91" y="152" width="6" height="25" fill="#78350f"/>
  <!-- Scattered Papers on Floor -->
  <path d="M 50,175 L 62,172 L 67,184 L 55,187 Z" fill="#f8fafc" opacity="0.9"/>
  <path d="M 75,180 L 88,177 L 91,189 L 78,192 Z" fill="#cbd5e1" opacity="0.8"/>

  <!-- AMBIENT DRAMATIC LIGHTING -->
  <circle cx="160" cy="100" r="80" fill="url(#alertGlow)"/>

  <!-- CHARACTER GROUP 1: Hostiles / Tên cướp (The Robber/Captor) -->
  <g id="captor">
    <!-- Robber Body & Jacket -->
    <path d="M 195,115 L 220,120 L 225,175 L 180,175 L 185,130 Z" fill="#0f172a"/>
    <!-- Robber Arm holding weapon/threatening -->
    <path d="M 185,120 Q 165,125 155,110" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <!-- Robber Head & Mask/Cap -->
    <circle cx="210" cy="95" r="16" fill="#fbcfe8"/>
    <!-- Dark Cap -->
    <path d="M 194,92 Q 210,75 226,92 L 222,96 L 198,96 Z" fill="#334155"/>
    <!-- Menacing Expression / Eye Mask -->
    <rect x="202" y="90" width="16" height="6" fill="#0f172a" rx="2"/>
    <path d="M 206,102 Q 210,106 214,102" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER GROUP 2: Hostages / Con tin (The Hostages) -->
  <!-- Hostage 1 (Scared, hands up, crouching near center) -->
  <g id="hostage-one">
    <!-- Body & Clothes (Orange/Yellow prisoner-style or office uniform) -->
    <path d="M 110,125 L 135,130 L 140,175 L 105,175 L 105,135 Z" fill="#fb923c"/>
    <!-- Arms raised in surrender -->
    <path d="M 110,130 Q 95,110 90,95" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 130,130 Q 140,115 145,100" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="88" cy="92" r="5" fill="#fde68a"/>
    <circle cx="147" cy="97" r="5" fill="#fde68a"/>
    <!-- Head -->
    <circle cx="120" cy="105" r="14" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M 107,100 Q 120,90 133,100 L 133,105 L 107,105 Z" fill="#78350f"/>
    <!-- Worried Face (Wide eyes, open mouth) -->
    <circle cx="115" cy="104" r="2" fill="#1e293b"/>
    <circle cx="125" cy="104" r="2" fill="#1e293b"/>
    <ellipse cx="120" cy="112" rx="3" ry="4" fill="#1e293b"/>
  </g>

  <!-- Hostage 2 (Huddled beside Hostage 1, comforting/fearful) -->
  <g id="hostage-two">
    <!-- Body -->
    <path d="M 75,135 L 100,140 L 105,175 L 70,175 Z" fill="#38bdf8"/>
    <!-- Arms wrapped / cowering -->
    <path d="M 85,145 Q 95,150 100,140" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Head (Lower down) -->
    <circle cx="85" cy="118" r="13" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M 73,115 Q 85,104 97,115 L 97,120 L 73,120 Z" fill="#1e293b"/>
    <!-- Eyes closed in fear (X or curved lines) -->
    <path d="M 80,118 L 84,121" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 86,121 L 90,118" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 83,126 Q 85,124 87,126" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Elements (Vignette & Tension lines) -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="#0f172a" stroke-width="12" opacity="0.6"/>
</svg>