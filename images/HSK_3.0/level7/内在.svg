<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="175" width="10" height="50" rx="2" fill="#334155"/>
  <rect x="190" y="175" width="10" height="50" rx="2" fill="#334155"/>
  
  <!-- Clockwork Mechanism (The "Inner" complexity) -->
  <circle cx="120" cy="110" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="110" r="30" fill="#0f172a"/>
  
  <!-- Gears -->
  <path d="M120 85 L125 95 L135 95 L127 102 L130 112 L120 106 L110 112 L113 102 L105 95 L115 95 Z" fill="#fbbf24"/>
  <circle cx="120" cy="110" r="8" fill="#f59e0b"/>
  
  <!-- Character: Researcher -->
  <g transform="translate(40, 80)">
    <path d="M20 120 Q20 80 40 80 T60 120" fill="#fb923c"/>
    <circle cx="40" cy="70" r="15" fill="#fde68a"/>
    <rect x="35" y="85" width="10" height="35" fill="#fb923c"/>
    <!-- Magnifying Glass -->
    <circle cx="60" cy="60" r="12" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="68" y1="68" x2="85" y2="85" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Floating Data Points/Connections -->
  <circle cx="160" cy="90" r="3" fill="#10b981"/>
  <circle cx="175" cy="120" r="4" fill="#ec4899"/>
  <path d="M160 90 L175 120" stroke="#475569" stroke-width="1"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="110" r="60" fill="none" stroke="#fbbf24" stroke-opacity="0.1" stroke-width="1"/>
</svg>