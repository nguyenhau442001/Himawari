<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Main body of the ancient pottery vase -->
    <path d="M40 10 C 20 10, 10 30, 10 60 L 10 100 C 10 115, 25 120, 60 120 L 60 120 C 95 120, 110 115, 110 100 L 110 60 C 110 30, 100 10, 80 10 Z" fill="#D4AF37" fill-opacity="0.8"/>
    
    <!-- The "cánquē" (chipped/broken) section: A jagged missing piece on the rim -->
    <path d="M40 10 L 55 10 L 60 25 L 45 25 Z" fill="#1A1D24"/>
    
    <!-- Decorative ancient pattern lines -->
    <path d="M25 40 L 95 40" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 80 L 100 80" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Crack lines on the surface -->
    <path d="M30 60 L 40 80" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M80 50 L 90 70" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>