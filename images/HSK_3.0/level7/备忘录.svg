<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient background glow -->
  <circle cx="120" cy="120" r="70" fill="#2563EB" opacity="0.1" filter="blur(20px)"/>

  <!-- Main Document / Memorandum Board -->
  <g transform="translate(60, 40)">
    <!-- Clipboard Backing -->
    <rect x="0" y="0" width="120" height="160" rx="12" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Metal Clip -->
    <rect x="42" y="-6" width="36" height="16" rx="4" fill="#E2E8F0"/>
    <rect x="48" y="-2" width="24" height="8" rx="2" fill="#A0AEC0"/>

    <!-- Paper Sheet -->
    <rect x="10" y="20" width="100" height="130" rx="4" fill="#FFFFFF"/>

    <!-- Header line / Title indicator -->
    <rect x="25" y="36" width="50" height="6" rx="3" fill="#3B82F6"/>

    <!-- Content Lines representing text / terms -->
    <rect x="25" y="54" width="70" height="4" rx="2" fill="#CBD5E0"/>
    <rect x="25" y="66" width="60" height="4" rx="2" fill="#CBD5E0"/>
    <rect x="25" y="78" width="65" height="4" rx="2" fill="#CBD5E0"/>

    <!-- Bullet points / Checklist items -->
    <circle cx="18" cy="98" r="3" fill="#10B981"/>
    <rect x="25" y="96" width="50" height="4" rx="2" fill="#E2E8F0"/>

    <circle cx="18" cy="112" r="3" fill="#10B981"/>
    <rect x="25" y="110" width="55" height="4" rx="2" fill="#E2E8F0"/>

    <!-- Official Seal / Signature Stamp (representing agreement/memo) -->
    <circle cx="85" cy="125" r="14" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M78 125 L83 130 L93 118" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Pen / Stylus emphasizing action of recording/memo -->
  <g transform="translate(145, 120) rotate(-25)">
    <!-- Pen Body -->
    <path d="M0 0 L10 0 L15 60 L-5 60 Z" fill="#F59E0B"/>
    <!-- Pen Tip -->
    <path d="M-5 60 L5 60 L0 72 Z" fill="#1E293B"/>
    <!-- Pen Cap/Accent -->
    <rect x="0" y="0" width="10" height="15" fill="#D97706"/>
  </g>

  <!-- Highlight Sparkles (Focus / Attention) -->
  <path d="M45 80 L48 85 L53 88 L48 91 L45 96 L42 91 L37 88 L42 85 Z" fill="#FBBF24" opacity="0.8"/>
  <path d="M190 70 L192 73 L195 75 L192 77 L190 80 L188 77 L185 75 L188 73 Z" fill="#60A5FA" opacity="0.8"/>
</svg>