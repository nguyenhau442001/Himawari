<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="path-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="blueprint-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="peak-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background Elements (Distant Mountains & Rising Sun) -->
  <g id="background-scenery">
    <!-- Distant Peak 1 -->
    <polygon points="10,180 90,90 170,180" fill="#1e293b" opacity="0.6"/>
    <!-- Distant Peak 2 -->
    <polygon points="100,180 160,70 230,180" fill="#0f172a" opacity="0.8"/>
    
    <!-- Horizon Sun / Dawn Glow -->
    <circle cx="160" cy="110" r="28" fill="url(#sun-grad)" opacity="0.9"/>
    <circle cx="160" cy="110" r="38" fill="#f59e0b" opacity="0.15"/>
    
    <!-- Winding Long Path (Symbolizing "Yuan" - Long Journey Ahead) -->
    <path d="M 20,210 Q 70,190 100,205 T 160,195 Q 190,185 210,165" fill="none" stroke="url(#path-glow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" />
  </g>

  <!-- Foreground Environment: Architectural Studio / Workspace Desk -->
  <!-- Drafting Table surface -->
  <path d="M 10,185 L 230,185 L 220,215 L 20,215 Z" fill="#334155" filter="url(#shadow)" />
  <path d="M 15,185 L 225,185 L 217,190 L 23,190 Z" fill="#475569" /> <!-- Table rim highlight -->

  <!-- Environment Props: Tools of a Grand Long-term Enterprise (Blueprints, Compass, Model) -->
  <!-- Architectural Blueprint Scroll / Map -->
  <g transform="translate(140, 155) rotate(-10)">
    <rect x="0" y="0" width="55" height="35" rx="3" fill="#0284c7" opacity="0.85" filter="url(#shadow)"/>
    <rect x="4" y="4" width="47" height="27" rx="1" fill="url(#blueprint-glow)" />
    <!-- Blueprint architectural lines -->
    <line x1="10" y1="10" x2="25" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="10" y1="15" x2="35" y2="15" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="10" y1="20" x2="20" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="42" cy="18" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Drafting Compass / Divider -->
  <g transform="translate(185, 145) rotate(15)">
    <line x1="10" y1="0" x2="0" y2="35" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="35" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="5" cy="2" r="3" fill="#f59e0b" />
  </g>

  <!-- Coffee Mug (Long hours prop) -->
  <g transform="translate(35, 160)">
    <rect x="0" y="0" width="16" height="22" rx="3" fill="#ec4899" filter="url(#shadow)" />
    <path d="M 16,5 C 21,5 21,15 16,16" fill="none" stroke="#ec4899" stroke-width="2.5" />
    <!-- Steam -->
    <path d="M 5,-3 Q 8,-7 5,-11" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <path d="M 11,-4 Q 13,-8 11,-12" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Main Characters: Two partners/colleagues looking forward together at the distant goal -->
  <g id="characters" filter="url(#shadow)">
    <!-- Character 1 (Left - Focused & Thoughtful) -->
    <g transform="translate(65, 105)">
      <!-- Body / Torso -->
      <path d="M 0,65 L 30,65 L 35,85 L -5,85 Z" fill="#0284c7" />
      <path d="M 12,65 L 18,65 L 20,85 L 10,85 Z" fill="#0369a1" /> <!-- Shirt placket -->
      
      <!-- Head & Hair -->
      <circle cx="15" cy="28" r="13" fill="#fbcfe8" /> <!-- Skin tone -->
      <!-- Hair -->
      <path d="M 2,28 C 2,15 28,15 28,28 C 28,32 25,24 22,22 C 18,18 10,18 6,22 C 3,24 2,26 2,28 Z" fill="#334155" />
      
      <!-- Arm pointing forward / looking out -->
      <path d="M 25,50 Q 38,45 45,55" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="46" cy="56" r="3.5" fill="#fbcfe8" />
      
      <!-- Resting arm -->
      <path d="M 5,50 L 15,68" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Character 2 (Right - Resolute & Determined, embodying "Ren Zhong" / Heavy Burden & Long Commitment) -->
    <g transform="translate(100, 95)">
      <!-- Body / Torso -->
      <path d="M 0,75 L 35,75 L 42,95 L -7,95 Z" fill="#10b981" />
      <path d="M 15,75 L 25,75 L 28,95 L 12,95 Z" fill="#059669" />
      
      <!-- Head & Hair -->
      <circle cx="18" cy="24" r="14" fill="#fbcfe8" />
      <!-- Hair (tied back / neat bun) -->
      <path d="M 4,24 C 4,12 32,12 32,24 C 32,28 28,22 24,20 C 18,17 10,17 6,20 C 4,22 4,23 4,24 Z" fill="#1e293b" />
      <circle cx="30" cy="18" r="4" fill="#1e293b" /> <!-- Bun -->

      <!-- Focused posture - arms crossed confidently over chest (representing resolve) -->
      <path d="M 2,45 L 28,52" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" />
      <path d="M 8,55 L 32,48" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" />
      <!-- Hands resting -->
      <circle cx="30" cy="50" r="3.5" fill="#fbcfe8" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements / Glowing Ambience -->
  <!-- Ambient light rays / particles floating -->
  <circle cx="85" cy="70" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="125" cy="55" r="2" fill="#f59e0b" opacity="0.8" />
  <circle cx="150" cy="85" r="1" fill="#38bdf8" opacity="0.5" />
  <circle cx="50" cy="115" r="2" fill="#fb923c" opacity="0.4" />
  
  <!-- Subtle Vignette Frame Border to lock composition -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" />
</svg>