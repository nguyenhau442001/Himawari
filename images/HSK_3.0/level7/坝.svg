<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Deep background water level (upstream reservoir) -->
    <path d="M 30 110 L 105 110 L 105 160 L 30 160 Z" fill="#1E3A5F" opacity="0.4"/>
    
    <!-- Upstream Water Body -->
    <path d="M 20 100 Q 60 95 105 100 L 105 175 L 20 175 Z" fill="#2E5B88"/>
    <!-- Upstream Water Surface Shimmer -->
    <path d="M 35 108 Q 50 105 65 108" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 75 115 Q 85 113 95 115" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Downstream Water Body (Lower Level) -->
    <path d="M 135 145 Q 180 143 220 145 L 220 175 L 135 175 Z" fill="#1E3A5F"/>
    
    <!-- Rushing Water / Tailrace / Spillway flow -->
    <path d="M 135 130 C 145 130, 150 145, 170 145 C 190 145, 200 143, 220 145" stroke="#4A90E2" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 138 138 C 150 138, 160 150, 185 150 C 200 150, 210 148, 220 150" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Foam / Waves at base -->
    <circle cx="145" cy="144" r="3" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="165" cy="146" r="2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="190" cy="145" r="3.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- The Dam Structure (Concrete gravity dam profile: wide base, vertical/stepped back, sloping front) -->
    <!-- Main concrete body -->
    <path d="M 105 75 L 135 75 L 135 175 L 105 175 Z" fill="#6C7A89"/>
    <!-- Sloping downstream face -->
    <path d="M 135 75 L 165 175 L 135 175 Z" fill="#5A6573"/>
    
    <!-- Dam Wall Highlights & Texture (Modern architectural feel) -->
    <!-- Crest road / top surface -->
    <rect x="102" y="70" width="36" height="6" rx="1.5" fill="#88929B"/>
    <!-- Guardrails on top -->
    <line x1="105" y1="67" x2="105" y2="70" stroke="#A0AAB2" stroke-width="1.5"/>
    <line x1="118" y1="67" x2="118" y2="70" stroke="#A0AAB2" stroke-width="1.5"/>
    <line x1="132" y1="67" x2="132" y2="70" stroke="#A0AAB2" stroke-width="1.5"/>
    <line x1="105" y1="67" x2="135" y2="67" stroke="#A0AAB2" stroke-width="1.5"/>

    <!-- Spillway Gates / Sluice Sections on the Dam -->
    <rect x="112" y="90" width="8" height="15" rx="1" fill="#3E4C59"/>
    <rect x="124" y="90" width="8" height="15" rx="1" fill="#3E4C59"/>
    <!-- Control House / Infrastructure on top -->
    <rect x="110" y="54" width="18" height="16" rx="2" fill="#FFA726"/>
    <rect x="114" y="58" width="4" height="6" fill="#1A1D24"/>
    <rect x="120" y="58" width="4" height="6" fill="#1A1D24"/>

    <!-- Concrete block joint lines for scale and realism -->
    <line x1="135" y1="90" x2="143" y2="120" stroke="#48535C" stroke-width="1"/>
    <line x1="135" y1="120" x2="150" y2="150" stroke="#48535C" stroke-width="1"/>
    <line x1="135" y1="150" x2="158" y2="175" stroke="#48535C" stroke-width="1"/>

    <!-- Terrain Foundation (Bedrock underneath the dam) -->
    <path d="M 20 175 L 220 175 L 220 185 L 20 185 Z" fill="#2C3E50"/>
    <path d="M 10 175 L 230 175" stroke="#34495E" stroke-width="3"/>

    <!-- Directional Water Flow Arrow (Subtle accent highlighting function) -->
    <path d="M 65 130 L 90 130" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 82 125 L 90 130 L 82 135" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>