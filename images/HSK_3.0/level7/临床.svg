<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="160" width="10" height="80" fill="#475569"/>
  <rect x="180" y="160" width="10" height="80" fill="#475569"/>

  <!-- Doctor Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#f8fafc"/>
    <path d="M10 40 L0 60 M40 40 L50 60" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <circle cx="15" cy="18" r="2" fill="#1e293b"/>
    <circle cx="25" cy="18" r="2" fill="#1e293b"/>
  </g>

  <!-- Clipboard / Results -->
  <rect x="70" y="90" width="60" height="80" rx="4" fill="#f1f5f9"/>
  <line x1="80" y1="105" x2="120" y2="105" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="120" y2="120" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="135" x2="100" y2="135" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="90" r="3" fill="#94a3b8"/>
  
  <!-- Chart/Graph Element -->
  <path d="M80 160 L95 150 L110 155 L125 145" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Patient/Observer -->
  <g transform="translate(30, 100)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <rect x="10" y="32" width="20" height="50" rx="5" fill="#38bdf8"/>
  </g>

  <!-- Ambient light/glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.1"/>
  <circle cx="100" cy="100" r="2" fill="#fbbf24"/>
</svg>