<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for atmosphere of momentum -->
  <circle cx="120" cy="120" r="70" fill="#FF8C00" opacity="0.08" filter="blur(10px)"/>
  
  <g transform="translate(120, 115)">
    <!-- Expanding Shockwaves / Momentum Waves representing "Shēng" (Sound/Voice) and "Shì" (Power/Influence) -->
    <path d="M -45 -15 A 50 50 0 0 1 -45 15" fill="none" stroke="#2A313C" stroke-width="4" stroke-linecap="round"/>
    <path d="M -60 -30 A 70 70 0 0 1 -60 30" fill="none" stroke="#2A313C" stroke-width="3" stroke-linecap="round"/>
    <path d="M -75 -45 A 90 90 0 0 1 -75 45" fill="none" stroke="#2A313C" stroke-width="2" stroke-linecap="round"/>

    <path d="M 45 -15 A 50 50 0 0 0 45 15" fill="none" stroke="#FF8C00" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 60 -30 A 70 70 0 0 0 60 30" fill="none" stroke="#FF8C00" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 75 -45 A 90 90 0 0 0 75 45" fill="none" stroke="#FF8C00" stroke-width="3" stroke-linecap="round"/>

    <!-- Central Megaphone / Acoustic Horn representing impactful voice and grand momentum -->
    <g transform="rotate(-30)">
      <!-- Megaphone Body -->
      <path d="M -30 -18 L 10 -32 L 10 32 L -30 18 Z" fill="#2E3748"/>
      <!-- Megaphone Rim -->
      <ellipse cx="10" cy="0" rx="6" ry="32" fill="#FF8C00"/>
      <!-- Megaphone Handle -->
      <path d="M -22 18 L -26 35 C -27 38 -24 40 -20 39 L -12 36" fill="none" stroke="#2E3748" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Base attachment -->
      <rect x="-34" y="-8" width="6" height="16" rx="2" fill="#FF8C00"/>
    </g>

    <!-- Dynamic Energy Sparks / Accent Nodes -->
    <circle cx="75" cy="-35" r="4" fill="#FF8C00"/>
    <circle cx="95" cy="-5" r="3" fill="#FF8C00" opacity="0.7"/>
    <circle cx="85" cy="30" r="5" fill="#FF8C00"/>
    
    <circle cx="-75" cy="-35" r="3" fill="#3E4A61"/>
    <circle cx="-85" cy="20" r="4" fill="#3E4A61"/>
  </g>
</svg>