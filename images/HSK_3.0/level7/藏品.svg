<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative museum display pedestal/beam glow -->
  <path d="M70 180 L170 180 L185 200 L55 200 Z" fill="#2A313C"/>
  <rect x="85" y="172" width="70" height="8" rx="2" fill="#3A4454"/>
  <ellipse cx="120" cy="176" rx="35" ry="3" fill="#D4AF37" opacity="0.3"/>

  <!-- Glass Museum Display Case (Curved Dome) -->
  <path d="M80 172 L80 90 C80 65 160 65 160 90 L160 172 Z" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Glass case reflection highlight -->
  <path d="M92 95 C92 78 120 78 125 75" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- The "藏品" (Collection Artifact: Ancient Chinese Bronze Ritual Vessel / Ding) -->
  <!-- Base feet -->
  <rect x="100" y="156" width="8" height="16" rx="2" fill="#D4AF37"/>
  <rect x="132" y="156" width="8" height="16" rx="2" fill="#D4AF37"/>
  <rect x="116" y="158" width="8" height="16" rx="2" fill="#C59B27"/>

  <!-- Main Vessel Body (Ding) -->
  <path d="M92 120 C92 105 148 105 148 120 C148 140 138 158 120 158 C102 158 92 140 92 120 Z" fill="#E5C158"/>
  
  <!-- Vessel Rim -->
  <ellipse cx="120" cy="120" rx="28" ry="6" fill="#FACC15"/>
  <ellipse cx="120" cy="119" rx="24" ry="4" fill="#B45309"/>

  <!-- Handles -->
  <path d="M92 114 C84 114 84 126 92 126" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M148 114 C156 114 156 126 148 126" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Ancient Relief Pattern on Vessel -->
  <path d="M106 132 Q120 144 134 132" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="128" r="3" fill="#B45309"/>
  <circle cx="108" cy="125" r="2" fill="#B45309"/>
  <circle cx="132" cy="125" r="2" fill="#B45309"/>

  <!-- Museum Spotlights / Accent Focus Glow -->
  <circle cx="120" cy="40" r="1" fill="#FFFFFF" opacity="0.8"/>
  <path d="M120 40 L85 100 L155 100 Z" fill="#FACC15" opacity="0.06"/>
  
  <!-- Spotlight focus ring on artifact -->
  <ellipse cx="120" cy="130" rx="45" ry="18" stroke="#FACC15" stroke-width="1.5" stroke-opacity="0.3" fill="none" stroke-dasharray="4 4"/>
</svg>