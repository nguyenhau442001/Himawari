<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain landscape representing the source/origin -->
  <path d="M40 180 L120 80 L200 180 Z" fill="#2C3E50"/>
  <path d="M80 180 L120 130 L160 180 Z" fill="#34495E"/>
  
  <!-- The River (The "Source" / 发源地) -->
  <path d="M120 130 C 130 140, 140 150, 130 180 C 120 200, 150 210, 180 200" stroke="#F39C12" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- The "Cradle" / Origin point -->
  <circle cx="120" cy="130" r="12" fill="#F1C40F"/>
  <circle cx="120" cy="130" r="6" fill="#F39C12"/>
  
  <!-- Decorative ground/terrain lines -->
  <path d="M40 180 H200" stroke="#34495E" stroke-width="4"/>
  <path d="M60 195 H180" stroke="#2C3E50" stroke-width="4"/>
</svg>