<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glow effect for sparks -->
  <circle cx="120" cy="120" r="40" fill="#FF9F43" opacity="0.1" filter="blur(8px)"/>
  
  <!-- Electric Wire (Diagonal) -->
  <path d="M40 70 L200 170" stroke="#3A3F4B" stroke-width="12" stroke-linecap="round"/>
  <path d="M40 70 L200 170" stroke="#F1C40F" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Sparks and electrical discharge at the center -->
  <g transform="translate(120, 120)">
    <!-- Spark lines/bursts -->
    <path d="M0 0 L-15 -35" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 0 L25 -25" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0 0 L35 15" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 0 L-25 25" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0 L-30 -5" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 0 L10 35" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Lightning bolt core -->
    <path d="M-6 -12 L4 -4 L-2 2 L8 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Glowing Spark Dots -->
    <circle cx="-15" cy="-35" r="2.5" fill="#FFEAA7"/>
    <circle cx="25" cy="-25" r="3" fill="#FFEAA7"/>
    <circle cx="35" cy="15" r="2" fill="#FFEAA7"/>
    <circle cx="-25" cy="25" r="3.5" fill="#FFEAA7"/>
    <circle cx="10" cy="35" r="2" fill="#FFEAA7"/>
  </g>
</svg>