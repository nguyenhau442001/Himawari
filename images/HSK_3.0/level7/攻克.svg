<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow Gradient for Breakthrough/Solution -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    
    <!-- Warm Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Laboratory Details -->
  <!-- Ambient light glow behind the desk -->
  <circle cx="120" cy="110" r="80" fill="url(#glowGrad)"/>

  <!-- Lab Shelf in Background -->
  <rect x="40" y="45" width="60" height="4" rx="2" fill="#334155"/>
  <!-- Beaker on shelf -->
  <path d="M55 35 L65 35 L63 45 L57 45 Z" fill="#38bdf8" opacity="0.6"/>
  <rect x="75" y="32" width="12" height="13" rx="2" fill="#10b981" opacity="0.7"/>

  <!-- Window with Night City Silhouette -->
  <rect x="150" y="30" width="55" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M160 70 L160 100 M175 60 L175 100 M190 80 L190 100" stroke="#1e293b" stroke-width="2"/>
  <!-- City Lights in Window -->
  <rect x="154" y="85" width="4" height="4" fill="#fbbf24" opacity="0.8"/>
  <rect x="165" y="75" width="4" height="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="182" y="88" width="4" height="4" fill="#fbbf24" opacity="0.6"/>

  <!-- Workbench / Desk -->
  <rect x="20" y="180" width="200" height="12" rx="4" fill="#334155"/>
  <rect x="35" y="192" width="12" height="28" rx="2" fill="#1e293b"/>
  <rect x="193" y="192" width="12" height="28" rx="2" fill="#1e293b"/>

  <!-- Large Holographic / Monitor Screen showing "Solved Puzzle" -->
  <rect x="65" y="60" width="110" height="75" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="70" y="65" width="100" height="65" rx="4" fill="url(#screenGrad)"/>
  
  <!-- Complex Equations / Data Nodes on Screen (Abstract visual of "Hard Problem") -->
  <path d="M85 85 L105 105 M105 85 L85 105" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="95" cy="95" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M125 80 L155 80 M125 95 L145 95 M125 110 L150 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Checkmark / Breakthrough Symbol on Screen -->
  <circle cx="150" cy="95" r="14" fill="#10b981"/>
  <path d="M143 95 L148 100 L158 89" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monitor Stand -->
  <path d="M110 135 L130 135 L135 150 L105 150 Z" fill="#334155"/>
  <rect x="95" y="150" width="50" height="4" rx="2" fill="#475569"/>

  <!-- Foreground Props on Desk -->
  <!-- Coffee Mug -->
  <rect x="180" y="160" width="14" height="20" rx="3" fill="#f43f5e"/>
  <path d="M194 165 C 198 165, 198 175, 194 177" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Notebook / Papers -->
  <polygon points="45,175 75,168 80,185 50,192" fill="#f8fafc"/>
  <line x1="52" y1="179" x2="70" y2="175" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="54" y1="184" x2="72" y2="180" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- SCIENTIST CHARACTER (Left/Center) -->
  <!-- Body / Lab Coat -->
  <path d="M75 160 C75 145, 95 140, 105 140 C115 140, 135 145, 135 160 L140 190 L70 190 Z" fill="#ffffff"/>
  <!-- Lab coat lapels -->
  <path d="M105 140 L95 170 L115 170 Z" fill="#e2e8f0"/>
  <!-- Inner Shirt (Dark Blue) -->
  <path d="M98 145 L112 145 L110 170 L100 170 Z" fill="#1e293b"/>
  
  <!-- Head & Face -->
  <circle cx="105" cy="115" r="16" fill="#fbcfe8"/> <!-- Skin tone -->
  <!-- Hair -->
  <path d="M89 115 C89 102, 101 97, 105 97 C115 97, 121 103, 121 115 C121 112, 115 102, 105 102 C95 102, 89 112, 89 115 Z" fill="#334155"/>
  <!-- Friendly/Confident Expression -->
  <path d="M98 118 Q105 125 112 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Glasses -->
  <rect x="95" y="110" width="10" height="7" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="107" y="110" width="10" height="7" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="105" y1="113" x2="107" y2="113" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Arms / Gesturing Triumph ("Conquering/Overcoming") -->
  <!-- Left Arm (bent, fist raised in victory) -->
  <path d="M78 145 C65 140, 60 120, 70 110" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="70" cy="107" r="5" fill="#fbcfe8"/>
  <!-- Right Arm (pointing towards the screen solution) -->
  <path d="M132 145 L150 130" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="152" cy="128" r="5" fill="#fbcfe8"/>

  <!-- Dynamic Sparkles / Breakthrough Effect -->
  <path d="M125 50 L128 58 L136 61 L128 64 L125 72 L122 64 L114 61 L122 58 Z" fill="url(#amberGrad)"/>
  <path d="M60 70 L62 75 L67 77 L62 79 L60 84 L58 79 L53 77 L58 75 Z" fill="#38bdf8"/>
  <path d="M185 110 L187 114 L191 116 L187 118 L185 122 L183 118 L179 116 L183 114 Z" fill="url(#amberGrad)"/>

  <!-- Ambient Front Lighting Overlay for depth -->
  <circle cx="105" cy="115" r="2" fill="#ffffff" opacity="0.4"/>
</svg>