<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements: flight route arc -->
  <path d="M 60,140 Q 120,70 180,140" fill="none" stroke="#2A323D" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Central Physical Object Group: Official State Visit / Diplomacy (出访) -->
  <!-- Stylized Modern Airplane (Representing State Visit / Travel) -->
  <g transform="translate(120, 110)">
    <!-- Airplane Body -->
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="#E2E8F0" transform="rotate(-30)"/>
    
    <!-- Airplane Wings (Swept-back modern jet) -->
    <path d="M -10,-5 L 15,-35 L 25,-32 L 0,5 Z" fill="#CBD5E1" transform="rotate(-30)"/>
    <path d="M 5,5 L -15,35 L -25,32 L 0,-5 Z" fill="#94A3B8" transform="rotate(-30)"/>
    
    <!-- Tail Fin -->
    <path d="M -30,-2 L -42,-15 L -35,-15 L -25,0 Z" fill="#F59E0B" transform="rotate(-30)"/>
    
    <!-- Jet Engine / Accent Detail -->
    <circle cx="-5" cy="-8" r="3" fill="#F59E0B" transform="rotate(-30)"/>
  </g>

  <!-- Diplomacy & State Elements below: Stylized podium / handshake / official brief case representing state affairs -->
  <g transform="translate(120, 185)">
    <!-- Briefcase (Symbol of official state visit / diplomacy) -->
    <rect x="-24" y="-12" width="48" height="32" rx="4" fill="#3B82F6"/>
    <path d="M -12,-12 V -17 C -12,-20 12,-20 12,-17 V -12" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <rect x="-6" y="-3" width="12" height="8" rx="2" fill="#F59E0B"/>
    <!-- Metal latches -->
    <circle cx="-16" cy="4" r="2" fill="#93C5FD"/>
    <circle cx="16" cy="4" r="2" fill="#93C5FD"/>
  </g>

  <!-- Focus/Action Highlighting Elements -->
  <!-- Location Pin / Destination Marker hovering above -->
  <g transform="translate(120, 52)">
    <path d="M 0,-14 C -8,-14 -14,-8 -14,0 C -14,10 0,22 0,22 C 0,22 14,10 14,0 C 14,-8 8,-14 0,-14 Z" fill="#F59E0B"/>
    <circle cx="0" cy="-2" r="5" fill="#1A1D24"/>
  </g>

  <!-- Subtle glow aura behind destination pin -->
  <circle cx="120" cy="50" r="16" fill="#F59E0B" opacity="0.15"/>
</svg>