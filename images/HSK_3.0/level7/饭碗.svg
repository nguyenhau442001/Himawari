<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Soft background glow representing stability/livelihood -->
    <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.8"/>
    
    <!-- Steam / Warmth lines representing fresh food/sustenance -->
    <path d="M105 60 C100 50, 110 40, 105 30" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M120 55 C125 45, 115 35, 120 25" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M135 60 C140 50, 130 40, 135 30" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Rice mound inside the bowl -->
    <path d="M 75 105 Q 120 85 165 105 Z" fill="#F5F5F5"/>
    <ellipse cx="120" cy="105" rx="45" ry="12" fill="#E0E0E0"/>
    
    <!-- Chopsticks resting atop -->
    <line x1="60" y1="90" x2="190" y2="105" stroke="#D7CCC8" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="83" x2="185" y2="98" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>

    <!-- Main Bowl Body (饭碗) -->
    <path d="M 65 105 C 65 155, 175 155, 175 105 Z" fill="#37474F" stroke="#FFB74D" stroke-width="3"/>
    
    <!-- Bowl Rim / Upper lip -->
    <ellipse cx="120" cy="105" rx="55" ry="14" fill="none" stroke="#FFB74D" stroke-width="3"/>
    
    <!-- Decorative pattern on the bowl -->
    <path d="M 85 125 Q 120 145 155 125" fill="none" stroke="#FFA726" stroke-width="2" opacity="0.6"/>
    
    <!-- Bowl Base / Foot -->
    <path d="M 100 152 L 140 152 L 136 162 L 104 162 Z" fill="#263238" stroke="#FFB74D" stroke-width="2"/>
    
    <!-- Ground shadow representing stability and solid footing (端稳) -->
    <ellipse cx="120" cy="175" rx="50" ry="6" fill="#111318"/>
  </g>
</svg>