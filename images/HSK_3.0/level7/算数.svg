<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed Dark Mode Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background grid/glow -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Conceptual Representation for "算数" (keeping a promise / word holds value / binding commitment) -->
  <g transform="translate(0, 0)">
    <!-- Golden Shield / Seal representing value and reliability -->
    <path d="M120 45 L165 65 V115 C165 145 145 170 120 185 C95 170 75 145 75 115 V65 Z" fill="#222831" stroke="#F6C90E" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner glowing badge -->
    <path d="M120 55 L155 71 V112 C155 137 138 158 120 171 C102 158 85 137 85 112 V71 Z" fill="#1A1D24"/>

    <!-- Handshake silhouette inside the shield (symbolizing keeping one's word / agreement) -->
    <g transform="translate(120, 115) scale(0.9)" fill="none" stroke="#F6C90E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Arm & Hand -->
      <path d="M-55 15 L-20 0 L0 10"/>
      <!-- Right Arm & Hand -->
      <path d="M55 15 L20 0 L0 10"/>
      <!-- Interlocked hands center accent -->
      <path d="M-10 5 L0 15 L10 5" fill="#F6C90E"/>
    </g>

    <!-- Floating checkmark accent above shield indicating validity/truth ("counts") -->
    <circle cx="120" cy="35" r="16" fill="#F6C90E"/>
    <path d="M112 35 L118 41 L130 27" fill="none" stroke="#1A1D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sparkles/Stars for emphasis on "value/counts" -->
    <path d="M60 85 L63 93 L71 96 L63 99 L60 107 L57 99 L49 96 L57 93 Z" fill="#F6C90E" opacity="0.8"/>
    <path d="M180 85 L183 93 L191 96 L183 99 L180 107 L177 99 L169 96 L177 93 Z" fill="#F6C90E" opacity="0.8"/>
  </g>
</svg>