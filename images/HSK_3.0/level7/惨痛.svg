<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptualizing "惨痛" (Painful/Tragic Lesson) via a shattered, irreparable object -->
  <!-- A broken, fragmented ceramic vessel representing a shattered life/family -->
  
  <g transform="translate(120, 120)">
    <!-- Main broken vessel body -->
    <path d="M-40,-60 L-30,60 L30,60 L40,-60 Z" fill="#4A5568" stroke="#E53E3E" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Large crack/shatter lines -->
    <path d="M-35,-20 L0,0 L35,-40" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,0 L10,50" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,0 L-20,30" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Fragmented piece slightly separated -->
    <path d="M45,-50 L60,-40 L50,10 L35,-20 Z" fill="#2D3748" stroke="#E53E3E" stroke-width="2"/>
    
    <!-- Shadow/Grounding -->
    <ellipse cx="0" cy="75" rx="50" ry="10" fill="#000000" opacity="0.3"/>
  </g>
</svg>