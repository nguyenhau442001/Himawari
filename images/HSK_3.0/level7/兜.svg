<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="jacket-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Background Details (Night street vibe) -->
  <circle cx="190" cy="70" r="40" fill="url(#warm-glow)"/>
  <rect x="25" y="140" width="12" height="60" rx="4" fill="#334155"/>
  <rect x="200" y="120" width="16" height="80" rx="4" fill="#334155"/>
  <circle cx="208" cy="115" r="8" fill="#fde047" opacity="0.8"/>
  <path d="M208 123 L208 200" stroke="#fde047" stroke-width="1" opacity="0.2"/>

  <!-- Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <ellipse cx="120" cy="205" rx="90" ry="8" fill="#020617" opacity="0.6"/>

  <!-- Character Setup -->
  <!-- Legs / Pants -->
  <rect x="100" y="160" width="18" height="44" rx="6" fill="#475569"/>
  <rect x="122" y="160" width="18" height="44" rx="6" fill="#475569"/>
  <ellipse cx="109" cy="204" rx="10" ry="5" fill="#0f172a"/>
  <ellipse cx="131" cy="204" rx="10" ry="5" fill="#0f172a"/>

  <!-- Torso & Jacket -->
  <path d="M90 100 L150 100 L156 165 L84 165 Z" fill="url(#jacket-grad)"/>
  <!-- Inner shirt -->
  <path d="M105 100 L135 100 L130 135 L110 135 Z" fill="#e2e8f0"/>

  <!-- Jacket Details & Pockets (Visualizing '兜' - pouch/pocket) -->
  <!-- Left Pocket sagging with coins -->
  <path d="M92 135 C92 130 96 128 102 128 L114 128 C120 128 124 130 124 135 L122 158 C122 163 118 165 114 165 L102 165 C96 165 92 163 92 158 Z" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
  <!-- Pocket bulge/sag effect lines -->
  <path d="M95 140 C100 152 116 152 121 140" fill="#0369a1" opacity="0.6"/>

  <!-- Sticking out coins from the pocket -->
  <circle cx="102" cy="126" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="112" cy="122" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="118" cy="127" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>

  <!-- Right Pocket -->
  <path d="M116 135 C116 130 120 128 126 128 L138 128 C144 128 148 130 148 135 L146 158 C146 163 144 165 138 165 L126 165 C120 165 116 163 116 158 Z" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>

  <!-- Jacket Zipper / Collar -->
  <line x1="120" y1="100" x2="120" y2="165" stroke="#0369a1" stroke-width="2"/>
  <path d="M102 100 L120 115 L138 100" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms interacting with pockets -->
  <!-- Left Arm (Hand touching heavy pocket) -->
  <path d="M92 105 C75 115 80 135 90 145" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round"/>
  <circle cx="93" cy="147" r="8" fill="#fbcfe8"/>

  <!-- Right Arm (Relaxed) -->
  <path d="M148 105 C162 120 160 140 155 155" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round"/>
  <circle cx="154" cy="157" r="8" fill="#fbcfe8"/>

  <!-- Neck & Head -->
  <rect x="112" y="88" width="16" height="15" fill="#fbcfe8"/>
  <circle cx="120" cy="72" r="22" fill="#fbcfe8"/>

  <!-- Hair (Stylish neat cut) -->
  <path d="M98 70 C98 52 142 52 142 70 C142 76 138 78 138 78 C138 78 134 62 120 62 C106 62 102 78 102 78 C102 78 98 76 98 70 Z" fill="#334155"/>

  <!-- Facial Features (Friendly, smiling expression) -->
  <path d="M112 72 Q115 69 118 72" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M122 72 Q125 69 128 72" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M115 80 Q120 86 125 80" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="111" cy="78" r="4" fill="#fda4af" opacity="0.6"/>
  <circle cx="129" cy="78" r="4" fill="#fda4af" opacity="0.6"/>

  <!-- Floating Coin sparkles/details (emphasizing '零钱' - loose change) -->
  <circle cx="70" cy="130" r="4" fill="#fbbf24"/>
  <circle cx="170" cy="110" r="5" fill="#fbbf24"/>
  <path d="M170 100 L172 105 L177 107 L172 109 L170 114 L168 109 L163 107 L168 105 Z" fill="#fde047" opacity="0.8"/>
  <path d="M72 122 L73 125 L76 126 L73 127 L72 130 L71 127 L68 126 L71 125 Z" fill="#fde047" opacity="0.8"/>
</svg>