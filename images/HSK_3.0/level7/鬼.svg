<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Lamplight Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Hologram/Story Glow -->
    <radialGradient id="storyGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Clip path for window view -->
    <clipPath id="windowClip">
      <path d="M15,15 Q30,12 45,15 L45,80 L15,80 Z" />
    </clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT & PROPS: Room Interior -->
  <!-- Back Wall & Corner -->
  <path d="M120,20 L220,50 L220,220 L20,220 L20,50 Z" fill="#1e293b" />
  <path d="M20,50 L120,20 L220,50 L120,80 Z" fill="#334155" opacity="0.4" />
  
  <!-- Bookshelf Background -->
  <g fill="#0f172a" opacity="0.6">
    <rect x="170" y="70" width="35" height="10" rx="2" />
    <rect x="175" y="85" width="30" height="10" rx="2" />
    <rect x="165" y="100" width="40" height="10" rx="2" />
  </g>

  <!-- Window showing night sky and moon -->
  <g transform="translate(15, 30)">
    <rect x="0" y="0" width="50" height="70" rx="4" fill="#0b0f19" stroke="#475569" stroke-width="3" />
    <!-- Moon -->
    <circle cx="35" cy="20" r="8" fill="#fde047" opacity="0.8" />
    <!-- Clouds outside -->
    <path d="M5,50 Q15,40 25,50 Q35,45 45,55 L45,70 L5,70 Z" fill="#1e293b" opacity="0.8" />
    <!-- Window pane cross -->
    <path d="M25,0 L25,70 M0,35 L50,35" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Table/Desk -->
  <path d="M10,170 L230,170 L210,210 L30,210 Z" fill="#334155" />
  <path d="M20,170 L220,170 L220,175 L20,175 Z" fill="#475569" />
  <!-- Desk legs -->
  <rect x="40" y="210" width="12" height="30" fill="#1e293b" />
  <rect x="188" y="210" width="12" height="30" fill="#1e293b" />

  <!-- Glowing Desk Lamp -->
  <circle cx="195" cy="140" r="35" fill="url(#lampGlow)" />
  <path d="M195,135 L195,170" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M180,135 C180,125 210,125 210,135 Z" fill="#f59e0b" />
  <ellipse cx="195" cy="135" rx="15" ry="5" fill="#d97706" />

  <!-- Open Storybook on Desk -->
  <g transform="translate(90, 150)">
    <!-- Book shadow -->
    <ellipse cx="30" cy="25" rx="35" ry="10" fill="#000000" opacity="0.4" />
    <!-- Left page -->
    <path d="M30,20 C15,18 0,22 -10,25 L-10,5 C0,2 15,-2 30,0 Z" fill="#f8fafc" />
    <!-- Right page -->
    <path d="M30,20 C45,18 60,22 70,25 L70,5 C60,2 45,-2 30,0 Z" fill="#f8fafc" />
    <!-- Spine -->
    <line x1="30" y1="0" x2="30" y2="20" stroke="#cbd5e1" stroke-width="2" />
    <!-- Abstract text lines -->
    <line x1="-5" y1="8" x2="15" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-7" y1="13" x2="10" y2="11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-5" y1="18" x2="12" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- MYTHICAL STORY ELEMENT: The Legend/Ghost Projection rising from the book -->
  <circle cx="120" cy="115" r="45" fill="url(#storyGlow)" />
  
  <g transform="translate(120, 105)">
    <!-- Floating magical sparkles / legend aura -->
    <circle cx="-30" cy="-20" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="35" cy="-10" r="3" fill="#fbbf24" opacity="0.8" />
    <circle cx="-25" cy="15" r="1.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="25" cy="20" r="2.5" fill="#ec4899" opacity="0.7" />

    <!-- Playful/Stylized Folklore Ghost Character (representing '鬼' - legend style) -->
    <g>
      <!-- Ghost body floating with wispy tail -->
      <path d="M-15,-10 C-15,-30 15,-30 15,-10 C20,0 15,10 10,20 C5,10 2,25 -2,25 C-6,25 -8,10 -12,20 C-17,10 -20,0 -15,-10 Z" 
            fill="#f1f5f9" opacity="0.9" stroke="#38bdf8" stroke-width="2" />
      
      <!-- Ghost glowing inner aura -->
      <path d="M-10,-8 C-10,-22 10,-22 10,-8 C12,0 8,10 6,15 C3,8 1,18 -1,18 C-3,18 -5,8 -6,15 C-8,10 -12,0 -10,-8 Z" 
            fill="#38bdf8" opacity="0.3" />

      <!-- Cute/Mysterious Ghost Face -->
      <!-- Eyes (curved happily or mysteriously) -->
      <path d="M-7,-12 Q-4,-15 -2,-12" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M2,-12 Q5,-15 7,-12" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Mouth (playful 'O' shape) -->
      <circle cx="0" cy="-5" r="2.5" fill="#0f172a" />
      
      <!-- Floating mythical flame / wisps above head -->
      <path d="M0,-35 C-3,-42 3,-45 0,-50 C3,-45 3,-42 0,-35 Z" fill="#38bdf8" />
    </g>
  </g>

  <!-- MAIN CHARACTER: Storyteller / Listener reacting to the legend -->
  <g transform="translate(60, 110)">
    <!-- Character Body / Torso -->
    <path d="M15,90 C10,70 20,50 35,50 C50,50 60,70 55,90 Z" fill="#10b981" /> <!-- Green cozy sweater -->
    <path d="M20,90 L50,90 L55,100 L15,100 Z" fill="#047857" />

    <!-- Head & Face -->
    <circle cx="35" cy="30" r="22" fill="#ffedd5" /> <!-- Skin tone -->
    
    <!-- Hair -->
    <path d="M13,30 C13,10 57,10 57,30 C57,35 55,40 50,38 C45,20 25,20 20,38 C15,40 13,35 13,30 Z" fill="#1e293b" />
    <circle cx="35" cy="15" r="14" fill="#1e293b" />

    <!-- Facial Expression: Fascinated / Amazed -->
    <!-- Eyes wide open -->
    <circle cx="27" cy="28" r="3.5" fill="#1e293b" />
    <circle cx="43" cy="28" r="3.5" fill="#1e293b" />
    <circle cx="28" cy="27" r="1" fill="#ffffff" />
    <circle cx="44" cy="27" r="1" fill="#ffffff" />
    <!-- Eyebrows raised high in suspense -->
    <path d="M23,21 Q27,18 31,21" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M39,21 Q43,18 47,21" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Surprised open mouth -->
    <ellipse cx="35" cy="38" rx="3" ry="4.5" fill="#b91c1c" />

    <!-- Arms gesturing towards the book/legend -->
    <!-- Back arm -->
    <path d="M18,60 C5,65 0,75 5,80" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Front arm leaning on table -->
    <path d="M52,65 C65,70 70,85 75,90" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="75" cy="90" r="4" fill="#ffedd5" /> <!-- Hand -->
  </g>

  <!-- Foreground details for depth -->
  <g fill="#475569" opacity="0.3">
    <circle cx="205" cy="200" r="1.5" />
    <circle cx="15" cy="180" r="2" />
  </g>

</svg>