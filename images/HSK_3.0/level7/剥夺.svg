<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Hand reaching to take -->
    <path d="M100 40 L100 80 C100 90 90 100 80 100 L60 100 C50 100 40 90 40 80 L40 40" fill="#FFB347"/>
    <path d="M40 40 L60 40 L60 20 L80 20 L80 40 L100 40" fill="#FFB347"/>
    
    <!-- Object being taken (a stylized document/right) -->
    <rect x="20" y="80" width="80" height="10" rx="2" fill="#E0E0E0"/>
    <rect x="30" y="95" width="60" height="10" rx="2" fill="#E0E0E0"/>
    <rect x="40" y="110" width="40" height="10" rx="2" fill="#E0E0E0"/>
    
    <!-- Forceful removal motion lines -->
    <path d="M70 30 L70 0" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 20 L110 0" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 20 L30 0" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>