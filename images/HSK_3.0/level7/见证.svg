<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing twilight/dusk over a modern city -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- DISTANT CITY BACKGROUND (Old vs New evolution) -->
  <g opacity="0.35">
    <!-- Old low-rise buildings on left -->
    <rect x="20" y="110" width="30" height="30" fill="#64748b"/>
    <polygon points="20,110 35,95 50,110" fill="#475569"/>
    <rect x="55" y="105" width="25" height="35" fill="#64748b"/>
    <!-- Modern skyscrapers rising on right -->
    <rect x="150" y="70" width="22" height="70" fill="#38bdf8"/>
    <rect x="178" y="50" width="28" height="90" fill="#818cf8"/>
    <rect x="210" y="80" width="18" height="60" fill="#38bdf8"/>
    <!-- Glowing windows in city -->
    <rect x="156" y="80" width="3" height="4" fill="#fef08a"/>
    <rect x="163" y="80" width="3" height="4" fill="#fef08a"/>
    <rect x="156" y="90" width="3" height="4" fill="#fef08a"/>
    <rect x="185" y="60" width="4" height="6" fill="#fef08a"/>
    <rect x="195" y="60" width="4" height="6" fill="#fef08a"/>
    <rect x="185" y="75" width="4" height="6" fill="#fef08a"/>
    <rect x="195" y="75" width="4" height="6" fill="#fef08a"/>
  </g>

  <!-- RIVER -->
  <rect x="0" y="140" width="240" height="100" fill="url(#waterGrad)"/>
  <!-- River reflections -->
  <ellipse cx="80" cy="160" rx="30" ry="2" fill="#38bdf8" opacity="0.2"/>
  <ellipse cx="160" cy="180" rx="40" ry="3" fill="#f59e0b" opacity="0.15"/>
  <ellipse cx="120" cy="205" rx="50" ry="2" fill="#38bdf8" opacity="0.1"/>

  <!-- THE ICONIC BRIDGE (The "Witness") -->
  <!-- Bridge deck -->
  <path d="M 10 140 Q 120 110 230 140" stroke="#b45309" stroke-width="6" fill="none"/>
  <path d="M 10 143 Q 120 113 230 143" stroke="#f59e0b" stroke-width="2" fill="none"/>

  <!-- Suspension cables (Golden arches & ropes) -->
  <path d="M 50 140 Q 75 80 120 95 Q 165 80 190 140" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <!-- Vertical suspension wires -->
  <line x1="70" y1="99" x2="70" y2="141" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="90" y1="92" x2="90" y2="141" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="120" y1="95" x2="120" y2="141" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="150" y1="92" x2="150" y2="141" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="170" y1="99" x2="170" y2="141" stroke="#fef08a" stroke-width="1.5"/>

  <!-- Bridge Towers / Piers -->
  <rect x="67" y="110" width="6" height="32" fill="#d97706"/>
  <rect x="167" y="110" width="6" height="32" fill="#d97706"/>

  <!-- FOREGROUND CHARACTERS (Grandfather and Child experiencing/witnessing the city) -->
  <g transform="translate(100, 112)">
    <!-- Grandfather -->
    <!-- Body -->
    <path d="M 25 15 Q 30 10 35 28 L 42 48 L 8 48 L 15 28 Z" fill="#334155"/>
    <!-- Head -->
    <circle cx="30" cy="9" r="6" fill="#fde047"/>
    <!-- Hair (grey) -->
    <path d="M 24 8 Q 30 3 36 8" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <!-- Arm pointing forward toward city -->
    <path d="M 33 20 L 50 15" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <circle cx="51" cy="14" r="2.5" fill="#fde047"/>
    <!-- Cane -->
    <line x1="20" y1="22" x2="15" y2="48" stroke="#78350f" stroke-width="2"/>

    <!-- Child -->
    <g transform="translate(35, 10)">
      <!-- Body -->
      <path d="M 12 18 Q 15 12 18 25 L 22 38 L 4 38 L 8 25 Z" fill="#ec4899"/>
      <!-- Head -->
      <circle cx="13" cy="9" r="5" fill="#fde047"/>
      <!-- Pigtails -->
      <path d="M 9 7 L 5 9" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <path d="M 17 7 L 21 9" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <!-- Arm pointing out in awe -->
      <path d="M 16 18 L 26 14" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
      <circle cx="27" cy="13" r="2" fill="#fde047"/>
    </g>
  </g>

  <!-- AMBIENT LIGHTING & ATMOSPHERE -->
  <!-- Warm glowing lights along the bridge deck -->
  <circle cx="30" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="50" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="70" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="90" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="110" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="130" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="150" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="170" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="190" cy="141" r="1.5" fill="#fef08a"/>
  <circle cx="210" cy="141" r="1.5" fill="#fef08a"/>

  <!-- Glowing sunset/horizon aura behind modern skyline -->
  <circle cx="180" cy="100" r="40" fill="#f59e0b" opacity="0.15" filter="blur(10px)"/>
  <circle cx="60" cy="110" r="30" fill="#38bdf8" opacity="0.1" filter="blur(8px)"/>

  <!-- Subtle framing border / vignette -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>