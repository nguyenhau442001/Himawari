<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Aura of calm (concentric soft waves) -->
    <circle cx="120" cy="115" r="75" fill="none" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="120" cy="115" r="60" fill="none" stroke="#323F4B" stroke-width="1.5" opacity="0.8"/>

    <!-- Dynamic incoming questioning arrows (fading out smoothly, representing external chaos handled with ease) -->
    <path d="M 45 75 L 75 90" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <polygon points="75,90 67,86 70,81" fill="#FF6B6B" opacity="0.4"/>

    <path d="M 40 135 L 70 120" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <polygon points="70,120 62,125 66,130" fill="#FF6B6B" opacity="0.4"/>

    <path d="M 195 75 L 165 90" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <polygon points="165,90 170,81 173,86" fill="#FF6B6B" opacity="0.4"/>

    <!-- Shoulders and torso (Professional attire) -->
    <path d="M 75 185 C 75 155 95 145 120 145 C 145 145 165 155 165 185 Z" fill="#2563EB"/>
    <path d="M 95 145 L 120 170 L 145 145 L 135 145 L 120 160 L 105 145 Z" fill="#F8FAFC"/>

    <!-- Neck -->
    <rect x="110" y="125" width="20" height="25" rx="6" fill="#FED7AA"/>

    <!-- Head & Face (Serene expression, looking directly ahead, poised) -->
    <circle cx="120" cy="105" r="32" fill="#FED7AA"/>

    <!-- Hair (Sleek, modern styling) -->
    <path d="M 88 105 C 88 85 102 75 120 75 C 138 75 152 85 152 105 C 152 110 150 102 150 96 C 150 84 137 72 120 72 C 103 72 90 84 90 96 C 90 102 88 110 88 105 Z" fill="#1E293B"/>
    <path d="M 100 78 C 110 74 130 74 142 80 C 142 80 135 76 120 76 C 105 76 100 78 100 78 Z" fill="#334155"/>

    <!-- Calm Eyes (Closed/Half-closed in supreme confidence/tranquility, small upward curve indicating inner peace) -->
    <path d="M 104 103 C 108 106 112 106 116 103" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 124 103 C 128 106 132 106 136 103" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Gentle confident smile -->
    <path d="M 112 118 C 116 121 124 121 128 118" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Glowing focal accent (Warm gold aura representing composure and mastery) -->
    <circle cx="120" cy="115" r="50" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.85"/>
  </g>
</svg>