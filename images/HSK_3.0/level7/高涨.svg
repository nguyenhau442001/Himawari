<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Stage Light Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character 1 Gradient (Active Speaker) -->
    <linearGradient id="shirtGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Gradient (Cheering Peer) -->
    <linearGradient id="shirtGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Character 3 Gradient (Engaged Colleague) -->
    <linearGradient id="shirtGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Flipchart Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting / Spotlight -->
  <polygon points="40,0 200,0 220,240 20,240" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / CONTEXT: Creative Workshop Interior -->
  <!-- Wall Grid / Details -->
  <line x1="40" y1="50" x2="80" y2="50" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="40" y1="60" x2="65" y2="60" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Sticky Notes Board in Background -->
  <rect x="25" y="45" width="55" height="45" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="32" y="52" width="16" height="12" rx="2" fill="#fbbf24" opacity="0.8"/>
  <rect x="53" y="52" width="16" height="12" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="32" y="69" width="16" height="12" rx="2" fill="#ec4899" opacity="0.8"/>
  <rect x="53" y="69" width="16" height="12" rx="2" fill="#10b981" opacity="0.8"/>

  <!-- Presentation Flipchart / Whiteboard on Stand -->
  <path d="M165,115 L215,115 L210,195 L170,195 Z" fill="#475569" opacity="0.4"/>
  <rect x="150" y="70" width="75" height="110" rx="6" fill="url(#boardGrad)" stroke="#475569" stroke-width="2"/>
  <path d="M165,85 L210,95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M165,105 L200,115" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M165,125 L190,132" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Upward Trend Chart Lines on Board -->
  <polyline points="162,165 178,150 192,158 212,128" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="212" cy="128" r="4" fill="#fbbf24"/>
  
  <!-- Stand Legs -->
  <line x1="165" y1="180" x2="150" y2="225" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="180" x2="220" y2="225" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="180" x2="185" y2="222" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Floor line -->
  <line x1="0" y1="222" x2="240" y2="222" stroke="#334155" stroke-width="2"/>

  <!-- CHARACTERS SHOWING "GAOZHANG" (High Spirits / Enthusiasm) -->
  
  <!-- Character 3 (Right, Seated/Leaning Forward, Extremely Excited) -->
  <g transform="translate(100, 125)">
    <!-- Body / Torso -->
    <path d="M25,50 C25,35 35,25 45,25 C55,25 65,35 65,50 L75,95 L15,95 Z" fill="url(#shirtGrad3)"/>
    <!-- Head & Hair -->
    <circle cx="45" cy="14" r="14" fill="#fcd34d"/>
    <path d="M31,12 C32,5 40,2 48,3 C56,4 58,10 59,15 C52,11 38,11 31,12 Z" fill="#0f172a"/>
    <!-- Face (Excited Expression) -->
    <path d="M39,15 Q45,21 51,15" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/> <!-- Big Smile -->
    <!-- Raising Arms in Celebration -->
    <path d="M28,32 L5,12" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    <path d="M62,32 L85,15" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Left, Leaning Back, Cheering with Fist) -->
  <g transform="translate(15, 130)">
    <!-- Body / Torso -->
    <path d="M20,50 C20,35 30,25 40,25 C50,25 60,35 60,50 L70,95 L10,95 Z" fill="url(#shirtGrad2)"/>
    <!-- Head & Hair -->
    <circle cx="40" cy="14" r="13" fill="#fcd34d"/>
    <path d="M27,10 C30,3 42,2 50,6 C53,8 53,13 53,13 C45,9 35,11 27,10 Z" fill="#334155"/>
    <!-- Face -->
    <path d="M34,15 Q40,20 46,15" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Fist Pumping Up -->
    <path d="M22,35 L5,15" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    <circle cx="3" cy="13" r="4" fill="#fcd34d"/>
    <!-- Other Arm -->
    <path d="M58,35 L75,50" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Character 1 (Center Front, The Speaker / Leader, Arms Wide Open, Dynamic Posture) -->
  <g transform="translate(58, 105)">
    <!-- Shadow beneath -->
    <ellipse cx="32" cy="121" rx="22" ry="5" fill="#0f172a" opacity="0.6"/>

    <!-- Torso -->
    <path d="M12,45 C12,30 22,22 32,22 C42,22 52,30 52,45 L58,110 L6,110 Z" fill="url(#shirtGrad1)"/>
    
    <!-- Neck & Head -->
    <rect x="28" y="14" width="8" height="12" fill="#fcd34d"/>
    <circle cx="32" cy="10" r="15" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M17,8 C18,1 30,-2 39,2 C46,5 47,10 47,10 C40,6 24,5 17,8 Z" fill="#1e293b"/>

    <!-- Face: Joyful, Enthusiastic Expression -->
    <!-- Eyes (happy curves) -->
    <path d="M24,7 Q27,4 30,7" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M34,7 Q37,4 40,7" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Open Mouth Laughing -->
    <path d="M27,12 Q32,18 37,12 Z" fill="#0f172a"/>

    <!-- Arms: Energetically Spread Wide / High -->
    <!-- Left Arm Raised High -->
    <path d="M15,35 Q-5,20 -12,8" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-14" cy="6" r="4.5" fill="#fcd34d"/>

    <!-- Right Arm Raised High -->
    <path d="M49,35 Q69,20 76,8" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="78" cy="6" r="4.5" fill="#fcd34d"/>

    <!-- Legs -->
    <path d="M20,110 L16,120" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M44,110 L48,120" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ENERGETIC SPARKLES & EMOTIONAL ACCENTS (Visualizing "High Spirits / Dâng cao") -->
  <!-- Sparkle 1 (Top Left) -->
  <path d="M30,35 Q30,25 40,25 Q30,25 30,15 Q30,25 20,25 Q30,25 30,35 Z" fill="#fbbf24" opacity="0.9"/>
  <!-- Sparkle 2 (Top Center-Right) -->
  <path d="M125,25 Q125,18 132,18 Q125,18 125,11 Q125,18 118,18 Q125,18 125,25 Z" fill="#38bdf8" opacity="0.9"/>
  <!-- Sparkle 3 (Near Board) -->
  <path d="M140,95 Q140,90 145,90 Q140,90 140,85 Q140,90 135,90 Q140,90 140,95 Z" fill="#ec4899" opacity="0.8"/>
  <!-- Additional Floating Energy Dots / Confetti -->
  <circle cx="95" cy="55" r="3" fill="#10b981" opacity="0.8"/>
  <circle cx="110" cy="40" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="25" cy="100" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="145" cy="140" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="15" cy="180" r="3" fill="#ec4899" opacity="0.6"/>

  <!-- Foreground Props / Desk Edge -->
  <path d="M0,225 L240,225" stroke="#475569" stroke-width="4"/>
  <rect x="75" y="218" width="30" height="7" rx="2" fill="#64748b"/>
  <path d="M85,218 L88,210 L97,210 L100,218 Z" fill="#38bdf8" opacity="0.8"/> <!-- Coffee mug -->
</svg>