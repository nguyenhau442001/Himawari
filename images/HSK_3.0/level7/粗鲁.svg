<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Café Interior Gradients -->
    <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="table-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Speech Bubble Pop -->
    <linearGradient id="bubble-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment (Cozy Café / Restaurant Setting) -->
  <rect x="0" y="0" width="240" height="150" fill="url(#wall-grad)" />
  <!-- Ambient Wall Accents / Shelves -->
  <rect x="20" y="30" width="60" height="4" rx="2" fill="#475569" />
  <circle cx="35" cy="22" r="6" fill="#0284c7" />
  <path d="M55 18 L65 30 L45 30 Z" fill="#10b981" />

  <rect x="160" y="45" width="60" height="4" rx="2" fill="#475569" />
  <rect x="180" y="25" width="12" height="20" rx="3" fill="#f59e0b" />

  <!-- Warm Hanging Light -->
  <line x1="120" y1="0" x2="120" y2="35" stroke="#64748b" stroke-width="2" />
  <path d="M 105 35 L 135 35 L 142 45 L 98 45 Z" fill="#f59e0b" />
  <circle cx="120" cy="46" r="4" fill="#fef08a" />
  <!-- Light Cone Glow -->
  <path d="M 120 46 L 40 160 L 200 160 Z" fill="#f59e0b" opacity="0.08" />

  <!-- Table Surface -->
  <rect x="0" y="150" width="240" height="90" fill="url(#table-grad)" />
  <rect x="0" y="150" width="240" height="8" fill="#92400e" opacity="0.6" />

  <!-- Props on Table -->
  <!-- Coffee Cups -->
  <path d="M 35 135 L 45 135 L 43 155 L 37 155 Z" fill="#f8fafc" />
  <path d="M 45 138 C 50 138 50 148 44 150" stroke="#f8fafc" stroke-width="2" fill="none" />
  <ellipse cx="40" cy="135" rx="5" ry="2" fill="#cbd5e1" />

  <path d="M 195 140 L 205 140 L 203 155 L 197 155 Z" fill="#f8fafc" />
  <ellipse cx="200" cy="140" rx="4" ry="1.5" fill="#cbd5e1" />

  <!-- CHARACTER 1: Rude Man (Left) -->
  <g id="rude-man">
    <!-- Body / Torso -->
    <path d="M 50 200 L 75 160 L 105 175 L 95 240 L 45 240 Z" fill="#1e293b" />
    <!-- Shirt / Collar -->
    <path d="M 72 160 L 85 175 L 75 185 Z" fill="#cbd5e1" />
    <path d="M 78 160 L 68 175 L 78 185 Z" fill="#cbd5e1" />
    <circle cx="78" cy="190" r="2" fill="#475569" />
    <circle cx="78" cy="205" r="2" fill="#475569" />

    <!-- Neck -->
    <rect x="68" y="145" width="18" height="20" rx="6" fill="#fcd34d" />

    <!-- Head (Leaning forward aggressively) -->
    <circle cx="78" cy="130" r="22" fill="#fbbf24" />
    
    <!-- Hair (Messy, spiky) -->
    <path d="M 58 125 C 55 110 70 105 78 108 C 86 105 100 110 96 125 C 92 118 84 115 78 116 C 72 115 64 118 58 125 Z" fill="#334155" />

    <!-- Aggressive Facial Expression -->
    <!-- Angry Eyebrows (Slanted heavily down and in) -->
    <path d="M 65 122 L 77 127" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 91 122 L 79 127" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />

    <!-- Eyes (Squinted, intense) -->
    <circle cx="71" cy="130" r="2.5" fill="#1e293b" />
    <circle cx="85" cy="130" r="2.5" fill="#1e293b" />

    <!-- Angry Open Mouth (Yelling / Rude behavior) -->
    <path d="M 72 140 Q 78 147 84 140 Z" fill="#7f1d1d" />

    <!-- Pointing / Rude Gesturing Arm -->
    <!-- Upper arm -->
    <path d="M 90 170 C 110 165 125 155 135 145" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Forearm & Pointing Index Finger -->
    <path d="M 135 145 L 155 135" stroke="#fbbf24" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 155 135 L 165 132" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" fill="none" /> <!-- finger -->
  </g>


  <!-- CHARACTER 2: Shocked/Upset Person (Right) -->
  <g id="shocked-person">
    <!-- Body / Torso (Reclining away) -->
    <path d="M 145 240 L 155 190 L 185 170 L 205 240 Z" fill="#0284c7" />
    <!-- Collar -->
    <path d="M 165 190 L 175 175 L 185 190 Z" fill="#e2e8f0" />

    <!-- Neck -->
    <rect x="170" y="160" width="16" height="20" rx="5" fill="#f87171" opacity="0.2" />
    <rect x="170" y="160" width="16" height="20" rx="5" fill="#fbcfe8" />

    <!-- Head (Recoiling back in shock) -->
    <circle cx="178" cy="142" r="20" fill="#fbcfe8" />

    <!-- Hair (Bob style) -->
    <path d="M 158 135 C 158 120 172 118 178 118 C 188 118 198 125 198 142 L 198 150 L 190 140 C 185 145 170 145 165 140 Z" fill="#475569" />

    <!-- Shocked Facial Expression -->
    <!-- Raised Eyebrows -->
    <path d="M 170 133 Q 174 130 178 133" stroke="#475569" stroke-width="2" fill="none" />
    <path d="M 182 133 Q 186 130 190 133" stroke="#475569" stroke-width="2" fill="none" />

    <!-- Wide Eyes -->
    <circle cx="174" cy="138" r="3.5" fill="#ffffff" />
    <circle cx="174" cy="138" r="1.5" fill="#0f172a" />
    <circle cx="186" cy="138" r="3.5" fill="#ffffff" />
    <circle cx="186" cy="138" r="1.5" fill="#0f172a" />

    <!-- Shocked O-Mouth -->
    <ellipse cx="180" cy="150" rx="3.5" ry="5" fill="#450a0a" />

    <!-- Defend / Hurt Gesture (Hands up or clutching chest) -->
    <path d="M 165 185 C 160 175 168 168 175 175" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- VISUAL CUE: Rude/Harsh Speech Representation (Abstract spikes/anger lines, strictly NO text) -->
  <g id="harsh-speech-indicators">
    <!-- Speech Bubble Container coming from the rude man -->
    <path d="M 115 110 C 115 95 135 95 145 105 C 155 95 175 95 175 110 C 175 125 145 135 145 135 C 145 135 115 125 115 110 Z" fill="url(#bubble-grad)" stroke="#ef4444" stroke-width="2" />
    <!-- Jagged angry lightning bolt inside bubble to denote harsh/rude words -->
    <path d="M 140 100 L 150 110 L 142 110 L 148 120 L 138 108 L 144 108 Z" fill="#ef4444" />
    
    <!-- Action lines / shock waves near pointing finger -->
    <path d="M 168 125 L 176 122" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 170 135 L 179 136" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 167 142 L 175 148" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Extra Atmospheric Polish (Soft vignette / frame overlay) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>