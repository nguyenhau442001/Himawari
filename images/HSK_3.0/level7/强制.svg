<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Background Office Interior & Law Bookcase Context -->
  <g id="environment">
    <!-- Window with legal light / blinds -->
    <rect x="28" y="30" width="60" height="80" rx="4" fill="#334155" opacity="0.4"/>
    <line x1="58" y1="30" x2="58" y2="110" stroke="#475569" stroke-width="2"/>
    <line x1="28" y1="70" x2="88" y2="70" stroke="#475569" stroke-width="2"/>

    <!-- Law books on shelf in background -->
    <rect x="150" y="45" width="62" height="65" fill="none"/>
    <path d="M150 110 h62 v-55 h-62 z" fill="#334155" opacity="0.6"/>
    <!-- Books -->
    <rect x="156" y="65" width="8" height="35" rx="1" fill="#38bdf8"/>
    <rect x="166" y="60" width="10" height="40" rx="1" fill="#f59e0b"/>
    <rect x="178" y="68" width="7" height="32" rx="1" fill="#10b981"/>
    <rect x="187" y="58" width="12" height="42" rx="1" fill="#ec4899"/>
    <!-- Legal Scales Symbol (Wall Art/Deco) -->
    <circle cx="180" cy="30" r="12" fill="#475569" opacity="0.3"/>
    <path d="M174 30 h12 M180 24 v8 M173 34 l3 4 h8 l3 -4" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ambient Light Cone -->
  <path d="M120 0 L60 200 H180 Z" fill="url(#glow)" pointer-events="none"/>

  <!-- Desk Surface -->
  <path d="M 20 180 L 220 180 L 230 220 L 10 220 Z" fill="url(#desk)"/>
  <rect x="10" y="175" width="220" height="6" rx="3" fill="#475569"/>

  <!-- Legal Document / Contract Prop -->
  <g id="document" transform="translate(75, 135) rotate(-5)">
    <rect x="0" y="0" width="75" height="55" rx="3" fill="#f8fafc"/>
    <!-- Document lines representing official text -->
    <line x1="10" y1="12" x2="45" y2="12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="60" y2="22" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="32" x2="50" y2="32" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Red Official Mandatory Compliance Stamp -->
    <g transform="translate(42, 25)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="url(#stamp)" stroke-width="2.5" stroke-dasharray="4 2"/>
      <circle cx="15" cy="15" r="10" fill="none" stroke="url(#stamp)" stroke-width="1.5"/>
      <!-- Inner star icon representing strict regulation -->
      <polygon points="15,8 17,12 21,12 18,15 19,19 15,17 11,19 12,15 9,12 13,12" fill="url(#stamp)"/>
    </g>
  </g>

  <!-- Official / Authority Figure (Left) -->
  <g id="official-character">
    <!-- Body & Suit -->
    <path d="M 40 200 L 40 160 Q 40 145 55 145 L 75 145 Q 90 145 90 160 L 90 200 Z" fill="#1e293b"/>
    <!-- Shirt collar & Tie -->
    <polygon points="65,145 55,160 75,160" fill="#f8fafc"/>
    <polygon points="63,158 67,158 69,185 65,190 61,185" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="65" cy="120" r="18" fill="#fbcfe8"/>
    <path d="M 49 120 Q 50 100 65 102 Q 81 100 81 120 Z" fill="#334155"/>
    <!-- Serious Expression & Glasses -->
    <circle cx="60" cy="120" r="4" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="72" cy="120" r="4" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="64" y1="120" x2="68" y2="120" stroke="#334155" stroke-width="1.5"/>
    <path d="M 62 132 Q 65 135 68 132" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Pointing Arm emphasizing the rule -->
    <path d="M 75 155 Q 100 150 115 135" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand pointing firmly forward -->
    <circle cx="117" cy="133" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Citizen / Reluctant Subject (Right) -->
  <g id="subject-character">
    <!-- Body & Jacket -->
    <path d="M 150 200 L 150 165 Q 150 150 165 150 L 195 150 Q 210 150 210 165 L 210 200 Z" fill="#f59e0b"/>
    <!-- Inner Shirt -->
    <path d="M 170 150 L 180 170 L 190 150 Z" fill="#ffffff"/>
    <!-- Head & Hair -->
    <circle cx="180" cy="125" r="17" fill="#fed7aa"/>
    <path d="M 163 125 Q 180 103 197 125 Q 190 112 180 112 Q 170 112 163 125 Z" fill="#78350f"/>
    <!-- Surprised/Resigned Face -->
    <circle cx="174" cy="125" r="2" fill="#451a03"/>
    <circle cx="186" cy="125" r="2" fill="#451a03"/>
    <!-- Surprised open mouth -->
    <ellipse cx="180" cy="136" rx="4" ry="5" fill="#451a03"/>
    <!-- Raised hands in helpless compliance -->
    <path d="M 155 160 Q 140 150 135 135" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="133" cy="132" r="4.5" fill="#fed7aa"/>
  </g>

  <!-- Mandatory Law Scale / Gavel Accent Icon floating subtly -->
  <g transform="translate(112, 45)" opacity="0.8">
    <circle cx="8" cy="8" r="16" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
    <!-- Mini Gavel -->
    <path d="M 2 10 L 14 10 M 8 6 L 12 10 L 8 14 Z" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

</svg>