<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle laboratory floor/stand shadow -->
  <ellipse cx="120" cy="195" rx="70" ry="12" fill="#111318"/>

  <!-- Scientific Instrument Stand & Base -->
  <rect x="108" y="145" width="24" height="45" rx="4" fill="#2C313C"/>
  <rect x="85" y="190" width="70" height="8" rx="3" fill="#3E4553"/>
  <circle cx="120" cy="194" r="5" fill="#525B6D"/>

  <!-- Articulated Mechanical Arm holding the probe -->
  <path d="M120 145 L120 110 L145 90" stroke="#525B6D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="120" cy="145" r="6" fill="#3E4553"/>
  <circle cx="120" cy="110" r="6" fill="#3E4553"/>

  <!-- High-Precision Electronic Probe / Sensor -->
  <rect x="135" y="80" width="30" height="50" rx="6" fill="#2A3447" stroke="#38B6FF" stroke-width="2"/>
  <!-- Probe Screen / Interface -->
  <rect x="141" y="88" width="18" height="14" rx="2" fill="#1A1D24"/>
  <polyline points="144,98 147,93 151,96 154,92" fill="none" stroke="#00FFCC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Probe Tip in Liquid -->
  <path d="M145 130 L155 130 L158 150 L142 150 Z" fill="#7C8B9F"/>
  <circle cx="150" cy="151" r="2" fill="#00FFCC"/>

  <!-- Glass Beaker / Container -->
  <path d="M85,115 L80,180 C80,185 84,188 90,188 L150,188 C156,188 160,185 160,180 L155,115 Z" fill="#242B38" opacity="0.8" stroke="#525B6D" stroke-width="3"/>
  <!-- Beaker Rim -->
  <ellipse cx="120" cy="115" rx="35" ry="7" fill="none" stroke="#7C8B9F" stroke-width="3"/>

  <!-- Groundwater Sample inside Beaker -->
  <path d="M83,140 C100,135 140,145 157,140 L159,178 C159,183 155,185 150,185 L90,185 C85,185 81,183 81,178 Z" fill="#123548" opacity="0.85"/>
  <!-- Liquid Surface Wave -->
  <path d="M83,140 C105,145 135,135 157,140" fill="none" stroke="#38B6FF" stroke-width="2" opacity="0.8"/>

  <!-- Chemical Reaction / Analysis Bubbles & Precision Data Points -->
  <circle cx="110" cy="165" r="4" fill="#38B6FF" opacity="0.7"/>
  <circle cx="125" cy="155" r="2.5" fill="#00FFCC" opacity="0.8"/>
  <circle cx="138" cy="170" r="3" fill="#38B6FF" opacity="0.6"/>

  <!-- Precision Targeting / Measurement Reticle overlaying the sample -->
  <circle cx="120" cy="160" r="22" fill="none" stroke="#FFA726" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="120" y1="133" x2="120" y2="143" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="177" x2="120" y2="187" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
  <line x1="93" y1="160" x2="103" y2="160" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
  <line x1="137" y1="160" x2="147" y2="160" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Analytical Data Readout Icon (Focus Accent) -->
  <g transform="translate(170, 60)">
    <rect x="0" y="0" width="45" height="32" rx="6" fill="#242B38" stroke="#FFA726" stroke-width="2"/>
    <polyline points="8,22 16,14 24,18 37,8" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="8" r="3" fill="#FFA726"/>
  </g>
</svg>