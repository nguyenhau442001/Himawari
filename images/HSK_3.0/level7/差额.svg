<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for modern UI look -->
  <g opacity="0.3">
    <line x1="40" y1="120" x2="200" y2="120" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Concept: "差额" (Difference/Discrepancy in Quantity - e.g., Candidates vs Selected Seats) -->
  <g transform="translate(0, 5)">
    <!-- Equal Baseline Platform / Scale Base -->
    <path d="M 60 175 L 180 175 C 185 175, 185 185, 180 185 L 60 185 C 55 185, 55 175, 60 175 Z" fill="#2E3648"/>
    <rect x="110" y="150" width="20" height="25" fill="#3A445C" rx="2"/>

    <!-- Left Group: Total Available/Applicants (Taller Stack - e.g., 5 icons) representing the larger pool -->
    <g transform="translate(75, 75)">
      <!-- Background Pillar / Holder -->
      <rect x="0" y="15" width="30" height="65" rx="4" fill="#242B38" stroke="#3A445C" stroke-width="2"/>
      
      <!-- Individual Item Tokens (representing candidates) -->
      <!-- Item 1 (Bottom) -->
      <circle cx="15" cy="65" r="8" fill="#4ECCA3"/>
      <path d="M 12 65 L 14 67 L 18 63" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Item 2 -->
      <circle cx="15" cy="45" r="8" fill="#4ECCA3"/>
      <path d="M 12 45 L 14 47 L 18 43" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Item 3 -->
      <circle cx="15" cy="25" r="8" fill="#4ECCA3"/>
      <path d="M 12 25 L 14 27 L 18 23" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Label / Height Indicator Top -->
      <text x="15" y="5" font-family="sans-serif" font-size="10" fill="#8892B0" text-anchor="middle" font-weight="bold">5</text>
    </g>

    <!-- Right Group: Required Slots / Selected (Shorter Stack - e.g., 3 icons) representing the target quota -->
    <g transform="translate(135, 95)">
      <!-- Background Pillar / Holder -->
      <rect x="0" y="15" width="30" height="45" rx="4" fill="#242B38" stroke="#3A445C" stroke-width="2"/>
      
      <!-- Item 1 (Bottom) -->
      <circle cx="15" cy="45" r="8" fill="#F0A500"/>
      <path d="M 12 45 L 14 47 L 18 43" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Item 2 -->
      <circle cx="15" cy="25" r="8" fill="#F0A500"/>
      <path d="M 12 25 L 14 27 L 18 23" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Label Top -->
      <text x="15" y="5" font-family="sans-serif" font-size="10" fill="#8892B0" text-anchor="middle" font-weight="bold">3</text>
    </g>

    <!-- Highlighted Difference (The "差额" / Gap Zone) -->
    <g transform="translate(135, 75)">
      <!-- Floating difference indicator box hovering above the shorter stack -->
      <rect x="-2" y="-12" width="34" height="26" rx="6" fill="#F0A500" fill-opacity="0.15" stroke="#F0A500" stroke-width="1.5" stroke-dasharray="2 2"/>
      
      <!-- Plus/Difference Icon representing surplus/margin -->
      <text x="15" y="6" font-family="sans-serif" font-size="14" fill="#F0A500" text-anchor="middle" font-weight="bold">Δ2</text>
    </g>

    <!-- Connecting Dimension / Gap Bracket showing the difference cleanly -->
    <g stroke="#F0A500" stroke-width="2" stroke-linecap="round" fill="none">
      <!-- Vertical span of the difference -->
      <line x1="120" y1="90" x2="120" y2="110"/>
      <!-- Top tick -->
      <line x1="117" y1="90" x2="123" y2="90"/>
      <!-- Bottom tick -->
      <line x1="117" y1="110" x2="123" y2="110"/>
      
      <!-- Dotted guide to left stack -->
      <path d="M 106 90 L 115 90" stroke="#8892B0" stroke-dasharray="2 2"/>
    </g>
  </g>
</svg>