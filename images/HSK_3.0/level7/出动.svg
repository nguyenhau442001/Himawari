<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road/Ground Path -->
  <path d="M0 180 L240 180" stroke="#374151" stroke-width="4" stroke-dasharray="10 10"/>
  
  <!-- Tactical Vehicle (Simplified Flat Design) -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="80" height="40" rx="4" fill="#F59E0B"/>
    <rect x="10" y="5" width="25" height="15" fill="#1A1D24"/>
    <rect x="45" y="5" width="25" height="15" fill="#1A1D24"/>
    <circle cx="20" cy="45" r="10" fill="#374151"/>
    <circle cx="60" cy="45" r="10" fill="#374151"/>
    <!-- Emergency Light -->
    <rect x="35" y="-10" width="10" height="10" fill="#EF4444"/>
  </g>
  
  <!-- Tactical Personnel (Representing the "Deployment" action) -->
  <g transform="translate(140, 120)">
    <!-- Body -->
    <path d="M10 70 L40 70 L35 30 L15 30 Z" fill="#F59E0B"/>
    <!-- Head -->
    <circle cx="25" cy="20" r="12" fill="#F59E0B"/>
    <!-- Tactical Gear/Vest Detail -->
    <rect x="15" y="35" width="20" height="5" fill="#1A1D24"/>
    <!-- Arm in motion -->
    <path d="M40 40 L60 50" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M160 100 L180 90" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 120 L190 110" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
</svg>