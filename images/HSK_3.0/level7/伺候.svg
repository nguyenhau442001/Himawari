<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm bedside light gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window moonlight gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Hospital Room Wall -->
  <rect x="15" y="15" width="210" height="175" rx="8" fill="#1b2a4a" />
  
  <!-- Window to the night outside -->
  <path d="M 160 30 L 205 30 L 205 105 L 160 105 Z" fill="url(#moonlight)" stroke="#334155" stroke-width="2" />
  <path d="M 182 30 L 182 105 M 160 67 L 205 67" stroke="#334155" stroke-width="1.5" />
  <!-- Moon -->
  <circle cx="192" cy="45" r="8" fill="#fef08a" opacity="0.8" />

  <!-- Medical Equipment & Interior Props -->
  <!-- IV Pole -->
  <line x1="45" y1="35" x2="45" y2="175" stroke="#64748b" stroke-width="2.5" />
  <path d="M 38 35 L 52 35" stroke="#64748b" stroke-width="2" />
  <!-- IV Bag -->
  <rect x="40" y="45" width="10" height="18" rx="3" fill="#38bdf8" opacity="0.7" />
  <!-- IV Tube -->
  <path d="M 45 63 C 45 75, 75 70, 85 85" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

  <!-- Bedside Table -->
  <rect x="135" y="115" width="55" height="65" rx="4" fill="#334155" />
  <line x1="135" y1="130" x2="190" y2="130" stroke="#1e293b" stroke-width="2" />
  <!-- Table Lamp -->
  <path d="M 155 115 L 175 115 L 170 95 L 160 95 Z" fill="#fb923c" />
  <line x1="165" y1="115" x2="165" y2="125" stroke="#64748b" stroke-width="2" />
  <!-- Lamp Glow Effect -->
  <circle cx="165" cy="105" r="35" fill="url(#lamp-glow)" />
  <!-- Medicine Bottle on Table -->
  <rect x="142" y="110" width="8" height="15" rx="2" fill="#10b981" />

  <!-- Floor -->
  <rect x="15" y="190" width="210" height="35" fill="#0f172a" />

  <!-- HOSPITAL BED & PATIENT (Character 2) -->
  <!-- Bed Frame -->
  <path d="M 65 140 L 135 140 L 135 185 L 65 185 Z" fill="#475569" rx="4" />
  <!-- Pillow -->
  <ellipse cx="85" cy="138" rx="12" ry="7" fill="#f8fafc" />
  
  <!-- Patient Body (Under blanket) -->
  <path d="M 75 145 C 80 135, 115 135, 125 155 L 135 185 L 70 185 Z" fill="#38bdf8" opacity="0.9" />
  
  <!-- Patient Head -->
  <circle cx="82" cy="138" r="9" fill="#fbcfe8" />
  <!-- Patient closed eyes (resting) -->
  <path d="M 79 137 L 82 139" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Patient blanket fold -->
  <path d="M 75 148 Q 100 142 125 155" fill="none" stroke="#bae6fd" stroke-width="3" />

  <!-- CAREGIVER / NURSE or FAMILY MEMBER (Character 1 - Active "Hầu hạ / Phục vụ") -->
  <!-- Caregiver Body / Torso -->
  <path d="M 105 160 C 100 145, 120 130, 130 145 L 135 190 L 105 190 Z" fill="#ec4899" />
  <!-- Caregiver Apron / Uniform detail -->
  <path d="M 112 150 L 128 150 L 133 190 L 108 190 Z" fill="#f43f5e" opacity="0.6" />

  <!-- Caregiver Head & Hair -->
  <circle cx="120" cy="118" r="11" fill="#fbcfe8" />
  <path d="M 109 118 C 108 105, 132 105, 131 118 C 128 112, 112 112, 109 118 Z" fill="#0f172a" />
  <!-- Gentle caring facial expression -->
  <circle cx="124" cy="117" r="1" fill="#0f172a" />
  <path d="M 126 122 C 127 124, 129 124, 131 122" fill="none" stroke="#e11d48" stroke-width="1" stroke-linecap="round" />

  <!-- Caregiver Arms & Hands (Serving action: holding a bowl/warm towel) -->
  <!-- Right Arm reaching out -->
  <path d="M 125 145 C 135 150, 140 145, 145 138" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
  <!-- Left Arm supporting -->
  <path d="M 115 150 C 125 155, 135 150, 142 142" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" />

  <!-- PROP: Bowl of warm soup / medicine being offered -->
  <ellipse cx="145" cy="138" rx="8" ry="4" fill="#fbbf24" />
  <path d="M 137 138 C 137 144, 153 144, 153 138 Z" fill="#f59e0b" />
  <!-- Steam rising from the warm bowl -->
  <path d="M 143 130 Q 140 124, 146 118 Q 150 112, 143 106" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Foreground Atmospheric Elements -->
  <!-- Soft ambient light overlay from bottom left -->
  <circle cx="20" cy="220" r="80" fill="#38bdf8" opacity="0.05" />

  <!-- Frame Border / Clean Edge -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>