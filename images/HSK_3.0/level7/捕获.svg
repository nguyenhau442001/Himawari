<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Deep sea environment -->
  <path d="M0 180 Q120 220 240 180 L240 240 L0 240 Z" fill="#12151A"/>
  
  <!-- Submarine robotic arm mechanism -->
  <g fill="#FFB800">
    <rect x="180" y="80" width="60" height="12" rx="2"/>
    <rect x="160" y="70" width="20" height="32" rx="4"/>
    <!-- Claw pincers -->
    <path d="M160 70 L140 50 L145 45 L160 60 Z" fill="#FFB800"/>
    <path d="M160 102 L140 122 L145 127 L160 112 Z" fill="#FFB800"/>
  </g>
  
  <!-- The bioluminescent creature being captured -->
  <g>
    <ellipse cx="110" cy="86" rx="25" ry="15" fill="#00E5FF" opacity="0.8"/>
    <circle cx="120" cy="82" r="4" fill="#FFFFFF"/>
    <path d="M90 86 Q80 70 70 86 T50 86" stroke="#00E5FF" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Motion lines indicating capture action -->
  <g stroke="#FFB800" stroke-width="2" stroke-linecap="round">
    <line x1="190" y1="60" x2="170" y2="70"/>
    <line x1="190" y1="112" x2="170" y2="102"/>
    <line x1="200" y1="86" x2="170" y2="86"/>
  </g>
  
  <!-- Subtle sea particles -->
  <circle cx="40" cy="40" r="1" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="200" cy="150" r="1.5" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="60" cy="180" r="1" fill="#FFFFFF" opacity="0.4"/>
</svg>