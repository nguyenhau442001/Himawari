<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 (Speaker - Village Artisan) Skin & Clothes -->
    <linearGradient id="artisanShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Listener) Skin & Clothes -->
    <linearGradient id="listenerShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Plant Glow -->
    <linearGradient id="plantGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light from Lantern/Window -->
  <circle cx="120" cy="110" r="100" fill="url(#warmGlow)"/>

  <!-- SCENE CONTEXT: Workshop Interior -->
  <!-- Wooden Wall Planks / Background Shelf -->
  <rect x="24" y="30" width="192" height="12" rx="4" fill="#334155" opacity="0.6"/>
  <!-- Simple Pottery / Tools on Shelf -->
  <path d="M40 30 L46 18 L58 18 L64 30 Z" fill="#64748b"/>
  <circle cx="85" cy="24" r="6" fill="#f59e0b"/>
  <rect x="170" y="20" width="25" height="10" rx="3" fill="#475569"/>

  <!-- Warm Hanging Lamp -->
  <path d="M120 0 L120 25" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M105 25 L135 25 L140 38 L100 38 Z" fill="#cbd5e1"/>
  <circle cx="120" cy="42" r="6" fill="#fef08a"/>
  
  <!-- Wooden Table / Workbench -->
  <path d="M20 180 L220 180 L210 215 L30 215 Z" fill="#451a03"/>
  <path d="M20 180 L220 180 L225 186 L15 186 Z" fill="#78350f"/>
  <!-- Table Legs -->
  <rect x="40" y="215" width="12" height="25" fill="#292524"/>
  <rect x="188" y="215" width="12" height="25" fill="#292524"/>

  <!-- Props on Table: Teapot & Teacups (Representing rustic hospitality) -->
  <path d="M75 168 C75 162 83 160 88 168 Z" fill="#e2e8f0"/>
  <ellipse cx="81.5" cy="168" rx="8" ry="4" fill="#cbd5e1"/>
  <path d="M70 172 C70 167 75 166 77 170" stroke="#cbd5e1" stroke-width="2" fill="none"/> <!-- spout -->
  <ellipse cx="102" cy="175" rx="5" ry="3" fill="#f8fafc"/>
  <ellipse cx="116" cy="174" rx="5" ry="3" fill="#f8fafc"/>

  <!-- CHARACTER 1: The Speaker (Left, leaning forward, sincere expression) -->
  <!-- Torso -->
  <path d="M60 210 L68 140 L105 145 L105 210 Z" fill="url(#artisanShirt)"/>
  <!-- Collar -->
  <path d="M78 140 L88 155 L98 140 Z" fill="#e0f2fe"/>
  <!-- Head & Neck -->
  <path d="M82 135 L86 122 L98 122 L102 135 Z" fill="#fbcfe8" opacity="0.3"/> <!-- neck shadow -->
  <circle cx="92" cy="105" r="20" fill="#fed7aa"/>
  <!-- Friendly Eyes (Crescent / Warm) -->
  <path d="M83 103 C86 107 89 107 92 103" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M97 103 C100 107 103 107 106 103" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Warm Smile -->
  <path d="M88 114 Q94 120 100 114" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="82" cy="111" r="4" fill="#fca5a5" opacity="0.6"/>
  <circle cx="107" cy="111" r="4" fill="#fca5a5" opacity="0.6"/>
  <!-- Hair -->
  <path d="M73 105 C73 90 85 85 93 85 C105 85 111 92 112 105 C108 100 98 95 90 98 C82 101 75 103 73 105 Z" fill="#451a03"/>
  <!-- Hand gesturing sincerely toward heart/chest -->
  <path d="M85 160 C75 165 72 175 78 180 C84 185 92 170 95 165 Z" fill="#fed7aa"/>
  <!-- Arm -->
  <path d="M68 145 L85 160 L95 150 L80 138 Z" fill="#0284c7"/>


  <!-- CHARACTER 2: The Listener (Right, attentive, smiling warmly) -->
  <!-- Torso -->
  <path d="M150 210 L145 145 L180 140 L185 210 Z" fill="url(#listenerShirt)"/>
  <!-- Collar -->
  <path d="M157 142 L164 154 L172 142 Z" fill="#ffedd5"/>
  <!-- Head & Neck -->
  <circle cx="164" cy="108" r="19" fill="#fed7aa"/>
  <!-- Attentive Eyes (Looking left towards speaker) -->
  <circle cx="157" cy="106" r="2.5" fill="#78350f"/>
  <circle cx="169" cy="106" r="2.5" fill="#78350f"/>
  <!-- Gentle Smile -->
  <path d="M160 116 Q165 121 170 116" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Hair (Pigtails or Short styled hair) -->
  <path d="M148 108 C148 93 158 88 166 88 C178 88 182 96 182 108 C178 102 170 98 164 98 C158 98 152 102 148 108 Z" fill="#38bdf8"/>
  <circle cx="145" cy="108" r="5" fill="#38bdf8"/>
  <circle cx="183" cy="108" r="5" fill="#38bdf8"/>
  <!-- Arm resting on table -->
  <path d="M145 155 L165 175 L185 165" stroke="#ea580c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="185" cy="165" r="7" fill="#fed7aa"/>


  <!-- CONTEXT DETAILS: Potted Greenery for "Chất phác" (Natural, earthy feel) -->
  <path d="M15 195 L25 195 L22 215 L18 215 Z" fill="#94a3b8"/>
  <path d="M20 195 C15 185 25 180 20 170 C28 175 28 185 20 195 Z" fill="url(#plantGrad)"/>
  <path d="M17 192 C10 183 15 175 12 168 C18 172 20 182 17 192 Z" fill="#10b981"/>


  <!-- EMOTIONAL / DIALOGUE VISUAL CUES (Abstract floating warmth, NO text) -->
  <!-- Floating Heart / Warmth bubble (representing "sincere/真诚") -->
  <g transform="translate(122, 70)">
    <path d="M0 -5 C-6 -15 -15 -5 0 8 C15 -5 6 -15 0 -5 Z" fill="#f43f5e" opacity="0.85"/>
    <animate attributeName="transform" type="translate" values="122,75; 122,65; 122,75" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <!-- Subtle Sparkles of Warm Connection -->
  <circle cx="108" cy="90" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="138" cy="85" r="1.5" fill="#fef08a" opacity="0.6"/>
  <path d="M130 98 L133 95 M133 98 L130 95" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

</svg>