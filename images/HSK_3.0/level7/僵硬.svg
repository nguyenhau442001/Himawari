<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Vibe Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND ENVIRONMENT & PROPS -->
  <g id="environment">
    <!-- Wall shelf with books -->
    <rect x="25" y="45" width="70" height="4" rx="2" fill="#334155"/>
    <rect x="32" y="27" width="12" height="18" rx="2" fill="#ef4444"/>
    <rect x="46" y="22" width="10" height="23" rx="2" fill="#38bdf8"/>
    <rect x="58" y="30" width="14" height="15" rx="2" fill="#10b981"/>
    <rect x="74" y="25" width="12" height="20" rx="2" fill="#f59e0b"/>

    <!-- Window with night city view -->
    <rect x="155" y="30" width="55" height="70" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="163" y="40" width="15" height="22" rx="2" fill="#334155" opacity="0.5"/>
    <rect x="183" y="55" width="18" height="35" rx="2" fill="#f59e0b" opacity="0.3"/>
    <rect x="163" y="68" width="15" height="22" rx="2" fill="#38bdf8" opacity="0.4"/>
    <!-- Window pane lines -->
    <line x1="182" y1="30" x2="182" y2="100" stroke="#334155" stroke-width="2"/>
    <line x1="155" y1="65" x2="210" y2="65" stroke="#334155" stroke-width="2"/>

    <!-- Desk Surface -->
    <rect x="15" y="170" width="210" height="12" rx="3" fill="#475569"/>
    <rect x="30" y="182" width="180" height="45" fill="#334155"/>

    <!-- Desk Lamp (Ambient light source) -->
    <path d="M 195 170 L 180 110 L 195 100 L 210 110 Z" fill="#64748b"/>
    <ellipse cx="195" cy="100" rx="18" ry="8" fill="#f59e0b"/>
    <circle cx="195" cy="100" r="80" fill="url(#lampGlow)"/>

    <!-- Laptop & Office Props -->
    <path d="M 100 170 L 140 170 L 148 160 L 92 160 Z" fill="#94a3b8"/>
    <rect x="95" y="130" width="50" height="32" rx="4" fill="#64748b"/>
    <rect x="98" y="133" width="44" height="26" rx="2" fill="#0f172a"/>
    <!-- Code lines on screen -->
    <line x1="103" y1="139" x2="120" y2="139" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="103" y1="145" x2="132" y2="145" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="103" y1="151" x2="115" y2="151" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

    <!-- Coffee Mug -->
    <rect x="55" y="150" width="16" height="20" rx="3" fill="#cbd5e1"/>
    <path d="M 71 155 C 77 155, 77 165, 71 167" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 60 142 C 63 138, 59 134, 62 130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN SUBJECT: Character experiencing stiff neck ("僵硬") -->
  <g id="character">
    <!-- Office Chair Backrest -->
    <rect x="92" y="80" width="56" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    
    <!-- Character Torso & Hoodie -->
    <path d="M 85 182 C 85 145, 155 145, 155 182 Z" fill="#3b82f6"/>
    <!-- Hoodie Strings -->
    <line x1="112" y1="155" x2="112" y2="170" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="128" y1="155" x2="128" y2="170" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Stiff Neck & Head Assembly (Tilted rigidly) -->
    <!-- The neck is thick, rigid, showing strain lines -->
    <rect x="110" y="118" width="20" height="28" rx="4" fill="#fbcfe8"/>
    <!-- Neck strain lines (showing tension/stiffness) -->
    <line x1="116" y1="124" x2="116" y2="136" stroke="#db2777" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="124" y1="124" x2="124" y2="136" stroke="#db2777" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Head (Tilted awkwardly to the side, eyes closed in discomfort) -->
    <g transform="translate(120, 105) rotate(18) translate(-120, -105)">
      <!-- Head shape -->
      <circle cx="120" cy="98" r="24" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M 97 100 C 97 75, 143 75, 143 100 C 143 100, 138 90, 130 85 C 120 80, 108 85, 100 90 Z" fill="#334155"/>
      
      <!-- Closed/Strained Eyes (showing discomfort) -->
      <path d="M 112 96 Q 116 100 120 96" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Wrinkled brow / Pain expression -->
      <line x1="110" y1="91" x2="118" y2="93" stroke="#db2777" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Grimacing mouth -->
      <path d="M 113 110 Q 118 107 123 110" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Rosy cheek -->
      <circle cx="112" cy="105" r="4" fill="#f43f5e" opacity="0.3"/>
    </g>

    <!-- Hands/Arms holding/massaging the stiff neck -->
    <!-- Right Arm / Hand gripping the back of the neck -->
    <path d="M 140 150 C 145 135, 135 120, 125 118" fill="none" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round"/>
    <path d="M 125 118 C 122 117, 118 122, 120 125" fill="#fbcfe8"/> <!-- Hand fingers -->
    <!-- Hoodie sleeve -->
    <path d="M 140 150 L 152 165" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>

    <!-- Left Arm resting on desk -->
    <path d="M 90 160 L 70 175 L 85 182" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- UI & VISUAL ACCENTS (Contextualizing the pain/stiffness visually without text) -->
  <g id="fx-indicators">
    <!-- Stiffness / Pulsing Pain Glow around the neck -->
    <circle cx="120" cy="126" r="18" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 120 126;360 120 126" dur="12s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Action lines / Stiffness vibration indicators near neck -->
    <path d="M 98 120 L 105 124" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 96 132 L 104 130" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>