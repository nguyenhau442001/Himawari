<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background River/Earth Curve representing 长江/黄河 source context -->
  <path d="M 20 180 Q 90 140 120 180 T 220 160" fill="none" stroke="#252D3D" stroke-width="24" stroke-linecap="round"/>
  <path d="M 10 210 Q 80 170 130 210 T 230 190" fill="none" stroke="#1E2633" stroke-width="16" stroke-linecap="round"/>

  <!-- Nurturing Hands (Cupped protection/feeding gesture) -->
  <!-- Back hand -->
  <path d="M 70 150 C 70 150 90 175 120 175 C 150 175 170 150 170 150" fill="none" stroke="#3A465B" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Flowing water nourishing streams (哺育 symbols - fluid dynamic vector) -->
  <path d="M 100 130 C 100 110 115 100 120 85 C 125 100 140 110 140 130" fill="none" stroke="#E68A2E" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 110 135 C 110 120 118 112 120 100 C 122 112 130 120 130 135" fill="none" stroke="#FFAC42" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Physical Object: Blooming Sprout / Nourished Life (ươm mầm) -->
  <g transform="translate(120, 115)">
    <!-- Soil mound -->
    <ellipse cx="0" cy="40" rx="35" ry="12" fill="#252D3D"/>
    
    <!-- Stem -->
    <path d="M 0 35 C 0 15 -5 0 -2 -20" fill="none" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M -2 0 C -25 -5 -35 25 -2 30 C -15 20 -10 5 -2 0 Z" fill="#66BB6A"/>
    
    <!-- Right Leaf -->
    <path d="M -4 -5 C 20 -15 35 10 0 25 C 15 15 10 0 -4 -5 Z" fill="#81C784"/>
    
    <!-- Top glowing vital bud (Nourished & Flourishing) -->
    <circle cx="-2" cy="-24" r="9" fill="#FFAC42"/>
    <circle cx="-2" cy="-24" r="5" fill="#FFE082"/>
  </g>

  <!-- Front Hands (Cupped embracing/nurturing hands) -->
  <path d="M 65 155 C 65 155 85 190 120 190 C 155 190 175 155 175 155" fill="none" stroke="#FFAC42" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Accent nurturing droplets/sparkles -->
  <circle cx="90" cy="70" r="3" fill="#FFAC42" opacity="0.7"/>
  <circle cx="150" cy="75" r="2.5" fill="#FFAC42" opacity="0.5"/>
  <circle cx="120" cy="55" r="4" fill="#FFAC42" opacity="0.9"/>
  <circle cx="135" cy="45" r="2" fill="#FFE082" opacity="0.6"/>
</svg>