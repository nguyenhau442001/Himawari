<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Masterpiece Glow Gradient -->
    <radialGradient id="master-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment: Cozy Library/Study Room -->
  <g id="environment">
    <!-- Bookshelf backdrop -->
    <rect x="24" y="40" width="192" height="110" rx="4" fill="#334155" opacity="0.4"/>
    <line x1="24" y1="76" x2="216" y2="76" stroke="#475569" stroke-width="3" opacity="0.5"/>
    <line x1="24" y1="114" x2="216" y2="114" stroke="#475569" stroke-width="3" opacity="0.5"/>
    
    <!-- Mini books on shelves -->
    <rect x="35" y="55" width="8" height="21" rx="1" fill="#f43f5e" opacity="0.7"/>
    <rect x="45" y="52" width="10" height="24" rx="1" fill="#3b82f6" opacity="0.7"/>
    <rect x="57" y="57" width="6" height="19" rx="1" fill="#10b981" opacity="0.7"/>
    <rect x="175" y="50" width="12" height="26" rx="1" fill="#f59e0b" opacity="0.7"/>
    <rect x="190" y="54" width="8" height="22" rx="1" fill="#ec4899" opacity="0.7"/>

    <rect x="35" y="90" width="10" height="24" rx="1" fill="#8b5cf6" opacity="0.7"/>
    <rect x="47" y="93" width="7" height="21" rx="1" fill="#14b8a6" opacity="0.7"/>
    <rect x="160" y="88" width="14" height="26" rx="1" fill="#ef4444" opacity="0.7"/>

    <!-- Desk Surface -->
    <path d="M12 185C12 181.686 14.6863 179 18 179H222C225.314 179 228 181.686 228 185V195C228 198.314 225.314 201 222 201H18C14.6863 201 12 198.314 12 195V185Z" fill="#334155"/>
    <rect x="20" y="201" width="200" height="8" rx="2" fill="#1e293b"/>
  </g>

  <!-- Lighting & Ambiance -->
  <circle cx="120" cy="90" r="80" fill="url(#lamp-glow)"/>

  <!-- CENTRAL SUBJECT: The Gathering of Masterpieces (汇集) -->
  <g id="gathering-scene">
    
    <!-- Floating / Converging Masterpiece Artifacts (Representing diverse classic works) -->
    <!-- Art piece 1: Landscape painting scroll glowing -->
    <g transform="translate(65, 95) rotate(-12)">
      <rect x="-16" y="-12" width="32" height="24" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <path d="M-10 4 L-4 -4 L1 -1 L6 -8 L10 6" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="6" cy="-4" r="2" fill="#38bdf8"/>
    </g>

    <!-- Art piece 2: Classical poetry manuscript/scroll -->
    <g transform="translate(175, 95) rotate(15)">
      <rect x="-14" y="-16" width="28" height="32" rx="3" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
      <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="-2" x2="6" y2="-2" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="4" x2="4" y2="4" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="10" x2="7" y2="10" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Art piece 3: Symphony / Musical score -->
    <g transform="translate(90, 65) rotate(-5)">
      <rect x="-15" y="-10" width="30" height="20" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <path d="M-9 -3 L9 -3 M-9 1 L9 1 M-9 5 L9 5" stroke="#10b981" stroke-width="1"/>
      <circle cx="-4" cy="1" r="2" fill="#10b981"/>
      <circle cx="4" cy="-3" r="2" fill="#10b981"/>
    </g>

    <!-- Art piece 4: Philosophical treatise / Classic book -->
    <g transform="translate(150, 68) rotate(8)">
      <rect x="-13" y="-14" width="26" height="28" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <path d="M-6 -6 H6 M-6 0 H6 M-6 6 H2" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Motion Converging Energy Lines (Pointing inward to the main book) -->
    <path d="M75 95 C 90 105, 100 115, 110 125" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
    <path d="M165 95 C 150 105, 140 115, 130 125" stroke="#ec4899" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
    <path d="M98 75 C 105 90, 112 110, 118 125" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
    <path d="M142 78 C 135 90, 128 110, 122 125" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.8"/>

    <!-- THE ANCHOR: The Magnificent Central Anthology/Book ("这本书") -->
    <g transform="translate(120, 142)">
      <!-- Masterpiece Glow behind book -->
      <circle cx="0" cy="-5" r="45" fill="url(#master-glow)"/>

      <!-- Book Open Shadow -->
      <ellipse cx="0" cy="22" rx="38" ry="6" fill="#090d16" opacity="0.6"/>

      <!-- Open Book Cover (Deep Indigo & Gold trim) -->
      <path d="M-40 10 C-40 4, -20 0, 0 4 C20 0, 40 4, 40 10 L36 24 C36 28, 20 30, 0 27 C-20 30, -36 28, -36 24 Z" fill="#1e1b4b"/>
      
      <!-- Open Pages (The grand collection) -->
      <path d="M-38 8 C-38 2, -18 -2, 0 2 C-18 2, -38 8, -38 8 Z" fill="#e2e8f0"/>
      <path d="M38 8 C38 2, 18 -2, 0 2 C18 2, 38 8, 38 8 Z" fill="#e2e8f0"/>
      <path d="M-38 8 C-20 4, -2 6, 0 2 C-2 6, -20 4, -38 8 L-36 22 C-20 18, -2 20, 0 25 C-2 20, -20 18, -36 22 Z" fill="#f8fafc"/>
      <path d="M38 8 C20 4, 2 6, 0 2 C2 6, 20 4, 38 8 L36 22 C20 18, 2 20, 0 25 C2 20, 20 18, 36 22 Z" fill="#f8fafc"/>

      <!-- Colorful abstract text lines & illustrations inside the book symbolizing "diverse masterpieces" -->
      <!-- Left Page lines & colorful tiny icons -->
      <line x1="-28" y1="10" x2="-10" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="-28" y1="14" x2="-14" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="-28" y1="18" x2="-8" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-22" cy="10" r="1.5" fill="#f59e0b"/>
      <circle cx="-18" cy="14" r="1.5" fill="#10b981"/>

      <!-- Right Page lines & colorful tiny icons -->
      <line x1="10" y1="10" x2="28" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="14" x2="28" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="18" x2="28" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="20" cy="10" r="1.5" fill="#38bdf8"/>
      <circle cx="22" cy="14" r="1.5" fill="#ec4899"/>

      <!-- Golden Bookmark Ribbon hanging out -->
      <path d="M0 25 C0 32, -4 35, -6 38 C-8 35, -12 32, -12 25 Z" fill="#fbbf24"/>
    </g>
  </g>

  <!-- CHARACTER / FOREGROUND CONTEXT: Curator / Reader admiring the collection -->
  <g id="character">
    <!-- Character Head and Torso peeking from bottom right or left -->
    <!-- Let's place a curious, delighted reader on the right side pointing at the book -->
    <g transform="translate(195, 145)">
      <!-- Body / Hoodie -->
      <path d="M-15 45 C-15 30, -5 25, 10 25 C25 25, 35 30, 35 45 L30 55 H-10 Z" fill="#3b82f6"/>
      <path d="M2 28 L10 38 L18 28" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Neck -->
      <rect x="2" y="18" width="12" height="10" rx="4" fill="#fcd34d"/>

      <!-- Head -->
      <circle cx="8" cy="8" r="14" fill="#fcd34d"/>

      <!-- Hair (Stylized neat dark hair) -->
      <path d="M -6 5 C -6 -4, 4 -8, 16 -3 C 20 3, 20 8, 20 8 C 20 8, 14 3, 8 2 C 2 1, -2 4, -6 5 Z" fill="#1e293b"/>

      <!-- Expressive Face (Smiling, eyes wide with wonder) -->
      <!-- Glasses -->
      <circle cx="4" cy="9" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="14" cy="9" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="8.5" y1="9" x2="9.5" y2="9" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Smile -->
      <path d="M7 14 C9 16, 11 16, 13 14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

      <!-- Hand pointing admiringly towards the center book -->
      <path d="M-15 32 C-22 30, -28 24, -32 20 C-34 18, -32 15, -29 17 C-25 20, -20 24, -15 27 Z" fill="#fcd34d"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Particles (Sparkles of brilliance) -->
  <g id="sparkles" fill="#fbbf24">
    <circle cx="70" cy="140" r="1.5" opacity="0.8"/>
    <circle cx="170" cy="130" r="2" opacity="0.9"/>
    <circle cx="105" cy="50" r="1" opacity="0.7"/>
    <circle cx="145" cy="45" r="2" opacity="0.8"/>
    <polygon points="50,120 52,125 57,127 52,129 50,134 48,129 43,127 48,125" fill="#f59e0b" opacity="0.6"/>
    <polygon points="190,110 191.5,113.5 195,115 191.5,116.5 190,120 188.5,116.5 185,115 188.5,113.5" fill="#38bdf8" opacity="0.7"/>
  </g>
</svg>