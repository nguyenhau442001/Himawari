<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background waves/wind gusts -->
  <path d="M30 70 Q70 50 110 70 T190 70" fill="none" stroke="#2A303C" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M50 170 Q90 150 130 170 T210 170" fill="none" stroke="#2A303C" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Wind currents (Fēng) -->
  <path d="M20 95 C60 95, 70 80, 100 95 C130 110, 140 90, 180 95" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 140 C80 140, 90 125, 120 140 C150 155, 160 135, 200 140" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

  <!-- Waves (Bō) - Deep ocean base -->
  <path d="M20 190 C60 170, 90 210, 140 190 C190 170, 210 200, 230 190" fill="none" stroke="#1E293B" stroke-width="16" stroke-linecap="round"/>

  <!-- Main turbulent waves -->
  <path d="M30 185 C60 160, 90 200, 130 180 C170 160, 200 190, 220 175" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  
  <path d="M50 165 C80 145, 100 175, 140 155 C180 135, 200 160, 210 150" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>

  <!-- Central dramatic splashing wave/storm peak (Focus) -->
  <g transform="translate(120, 125)">
    <!-- Water Splash Droplets -->
    <circle cx="-35" cy="-25" r="3.5" fill="#38BDF8"/>
    <circle cx="-25" cy="-45" r="2.5" fill="#38BDF8"/>
    <circle cx="0" cy="-55" r="4" fill="#38BDF8"/>
    <circle cx="30" cy="-35" r="3" fill="#38BDF8"/>
    <circle cx="45" cy="-15" r="2" fill="#38BDF8"/>

    <!-- Central Wave Crest with Gold/Orange Accent representing the "Incident/Storm" (风波) -->
    <path d="M-50 20 C-40 -10, -20 -35, 0 -45 C25 -35, 40 -15, 55 20 C35 5, 15 -10, 0 0 C-15 10, -35 15, -50 20 Z" fill="#0284C7"/>
    
    <!-- Dynamic high-contrast accent wave crest (Golden-Orange for focus/conflict) -->
    <path d="M-25 10 C-15 -10, -5 -25, 15 -35 C30 -25, 40 -5, 45 15 C30 5, 10 -5, -5 5 C-12 9, -20 10, -25 10 Z" fill="#F59E0B"/>
    
    <!-- Foam details -->
    <path d="M-15 -35 C-5 -45, 10 -45, 20 -35" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Additional wind swirling accents -->
  <path d="M160 55 C175 55, 185 45, 180 35 C175 25, 160 30, 155 40" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M70 75 C60 65, 65 50, 75 45 C85 40, 90 55, 80 65" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
</svg>