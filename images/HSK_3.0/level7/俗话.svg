<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (soft subtle glow/orbit) -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Central Physical Object: Vintage Speech Scroll / Traditional Slips representing "Súhuà" (Proverb / Folk Saying) -->
  <g transform="translate(0, 5)">
    <!-- Bamboo slip / Scroll backing -->
    <path d="M75 70 C75 60, 165 60, 165 70 L165 150 C165 160, 75 160, 75 150 Z" fill="#252B38"/>
    
    <!-- Left scroll rod -->
    <rect x="68" y="65" width="10" height="90" rx="4" fill="#E59E38"/>
    <!-- Right scroll rod -->
    <rect x="162" y="65" width="10" height="90" rx="4" fill="#E59E38"/>
    
    <!-- Main scroll paper -->
    <rect x="75" y="70" width="90" height="80" fill="#323A4D" rx="2"/>
    
    <!-- Abstract text lines representing traditional folk wisdom / sayings -->
    <g fill="#E59E38">
      <!-- Line 1 -->
      <rect x="90" y="86" width="35" height="6" rx="3"/>
      <rect x="130" y="86" width="20" height="6" rx="3"/>
      
      <!-- Line 2 -->
      <rect x="90" y="102" width="20" height="6" rx="3"/>
      <rect x="115" y="102" width="35" height="6" rx="3"/>
      
      <!-- Line 3 -->
      <rect x="90" y="118" width="45" height="6" rx="3"/>
    </g>

    <!-- Speech bubble accent (floating above, signifying spoken folk tradition) -->
    <path d="M 120 42 
             C 142 42, 160 56, 160 74 
             C 160 92, 142 106, 120 106 
             C 113 106, 107 104, 101 101 
             L 88 108 
             L 93 96 
             C 86 89, 80 82, 80 74 
             C 80 56, 98 42, 120 42 Z" 
          fill="none" stroke="#E59E38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sparkle / Wisdom highlight -->
    <path d="M 172 52 L 175 60 L 183 63 L 175 66 L 172 74 L 169 66 L 161 63 L 169 60 Z" fill="#F4B942"/>
    <path d="M 68 122 L 70 127 L 75 129 L 70 131 L 68 136 L 66 131 L 61 129 L 66 127 Z" fill="#F4B942" opacity="0.7"/>
  </g>
</svg>