<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle kitchen environment ambient glow hinting at the food context -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Fly Illustration (Noun: 苍蝇 / Housefly) -->
  <g transform="translate(120, 120)">
    <!-- Wings (Translucent cyan/white flat layers) -->
    <ellipse cx="-22" cy="-28" rx="22" ry="36" fill="#A4B9D2" opacity="0.65" transform="rotate(-30 -22 -28)"/>
    <ellipse cx="22" cy="-28" rx="22" ry="36" fill="#A4B9D2" opacity="0.65" transform="rotate(30 22 -28)"/>
    
    <!-- Wing shine details -->
    <ellipse cx="-24" cy="-30" rx="12" ry="24" fill="#E2EDF8" opacity="0.5" transform="rotate(-30 -24 -30)"/>
    <ellipse cx="24" cy="-30" rx="12" ry="24" fill="#E2EDF8" opacity="0.5" transform="rotate(30 24 -30)"/>

    <!-- Legs (Jointed dark strokes) -->
    <path d="M -10 10 L -28 22 L -38 34" stroke="#0F1318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M -6 14 L -22 30 L -28 44" stroke="#0F1318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 10 10 L 28 22 L 38 34" stroke="#0F1318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 6 14 L 22 30 L 28 44" stroke="#0F1318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M -4 16 L -10 34 L -8 48" stroke="#0F1318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 4 16 L 10 34 L 8 48" stroke="#0F1318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Abdomen (Segmented dark body with warm accent highlights matching app palette) -->
    <path d="M -16 12 C -16 32, 16 32, 16 12 Z" fill="#2C3543"/>
    <path d="M -14 16 C -14 28, 14 28, 14 16 Z" fill="#E6A15C"/>
    <path d="M -12 20 C -12 24, 12 24, 12 20 Z" fill="#2C3543"/>

    <!-- Thorax (Middle segment with subtle vertical stripes) -->
    <ellipse cx="0" cy="-2" rx="15" ry="18" fill="#3A4454"/>
    <line x1="-5" y1="-14" x2="-5" y2="10" stroke="#222831" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5" y1="-14" x2="5" y2="10" stroke="#222831" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="0" cy="-22" r="12" fill="#222831"/>

    <!-- Compound Red/Amber Eyes (Iconic flat design feature) -->
    <ellipse cx="-8" cy="-23" rx="6" ry="9" fill="#E65C5C" transform="rotate(-15 -8 -23)"/>
    <ellipse cx="8" cy="-23" rx="6" ry="9" fill="#E65C5C" transform="rotate(15 8 -23)"/>
    
    <!-- Eye highlights -->
    <ellipse cx="-9" cy="-25" rx="2" ry="4" fill="#FFA3A3" transform="rotate(-15 -9 -25)"/>
    <ellipse cx="9" cy="-25" rx="2" ry="4" fill="#FFA3A3" transform="rotate(15 9 -25)"/>
  </g>
</svg>