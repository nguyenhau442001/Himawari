<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hormoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="glandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Background laboratory details (context props) -->
  <path d="M40 180 L200 180" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  
  <!-- Microscope / Lab Equipment background hints -->
  <path d="M190 120 L210 120 L210 180 L190 180 Z" fill="#334155" opacity="0.4" rx="2" />
  <circle cx="200" cy="110" r="10" fill="#475569" opacity="0.6" />
  
  <!-- Ambient background glow for scientific focus -->
  <circle cx="120" cy="110" r="70" fill="url(#glowGrad)" />

  <!-- The Endocrine Gland (Tuyến nội tiết) -->
  <g transform="translate(120, 105)">
    <!-- Gland body (Organic stylized shape) -->
    <path d="M-25,-15 C-40,-30 -50,10 -30,25 C-15,35 15,35 30,25 C50,10 40,-30 25,-15 C15,-5 -15,-5 -25,-15 Z" 
          fill="url(#glandGrad)" filter="url(#glow)" />
    
    <!-- Inner details of gland (cellular texture) -->
    <circle cx="-10" cy="5" r="4" fill="#065f46" opacity="0.4" />
    <circle cx="12" cy="8" r="5" fill="#065f46" opacity="0.4" />
    <circle cx="2" cy="-2" r="3" fill="#065f46" opacity="0.4" />

    <!-- Active Secretion Action: Hormones releasing (Tiết ra hormone) -->
    <!-- Flow streams -->
    <path d="M-5,25 Q-15,45 -30,60" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M0,28 Q5,50 15,65" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
    <path d="M10,25 Q25,40 40,55" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Released Hormone Molecules / Droplets -->
    <!-- Droplet 1 -->
    <g transform="translate(-35, 65)">
      <path d="M0,-6 C4,-2 6,2 6,5 C6,9 3,11 0,11 C-3,11 -6,9 -6,5 C-6,2 -4,-2 0,-6 Z" fill="url(#hormoneGrad)" />
      <circle cx="-2" cy="4" r="1.5" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Droplet 2 (Main falling) -->
    <g transform="translate(18, 72)">
      <path d="M0,-8 C5,-3 8,3 8,7 C8,12 5,14 0,14 C-5,14 -8,12 -8,7 C-8,3 -5,-3 0,-8 Z" fill="url(#hormoneGrad)" filter="url(#glow)" />
      <circle cx="-2.5" cy="5" r="2" fill="#ffffff" opacity="0.7" />
    </g>

    <!-- Droplet 3 -->
    <g transform="translate(45, 60)">
      <path d="M0,-5 C3,-1 4,2 4,4 C4,7 2,8 0,8 C-2,8 -4,7 -4,4 C-4,2 -3,-1 0,-5 Z" fill="url(#hormoneGrad)" />
    </g>

    <!-- Small floating chemical particles representing secretion activity -->
    <circle cx="-20" cy="35" r="2.5" fill="#fb923c" />
    <circle cx="30" cy="42" r="2" fill="#38bdf8" />
    <circle cx="-8" cy="52" r="1.5" fill="#fb7185" />
    <circle cx="5" cy="60" r="2" fill="#facc15" />
  </g>

  <!-- Scientific Beaker / Container below collecting the secretion -->
  <g transform="translate(100, 155)">
    <!-- Liquid inside beaker -->
    <path d="M7,20 L33,20 C35,20 37,22 36,24 L30,33 C29,34 27,35 25,35 L15,35 C13,35 11,34 10,33 L4,24 C3,22 5,20 7,20 Z" fill="#f43f5e" opacity="0.4" />
    
    <!-- Beaker Glass Outline -->
    <path d="M5,10 L35,10 L31,36 C31,38 29,40 27,40 L13,40 C11,40 9,38 9,36 L5,10 Z" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Beaker Rim -->
    <path d="M2,10 L38,10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Glass Highlight -->
    <path d="M8,14 L11,34" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Scientific Grid Lines & Accents for Professional Context (No Text) -->
  <g opacity="0.2">
    <line x1="30" y1="50" x2="50" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="40" x2="40" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    
    <line x1="190" y1="180" x2="210" y2="180" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <circle cx="200" cy="180" r="6" fill="none" stroke="#10b981" stroke-width="1.5" />
  </g>
</svg>