<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Basin Mountain Gradient (Sichuan Basin context) -->
    <linearGradient id="mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="mountain-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#044e3b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Mist Gradient -->
    <linearGradient id="mist-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Bamboo Green Gradient -->
    <linearGradient id="bamboo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Rain / Humidity Drops -->
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE: Sichuan Basin (盆地) with humid atmosphere and lush green nature -->
  <g id="basin-scene">
    <!-- Distant Mountains (Rim of the Basin) -->
    <path d="M 0 140 Q 60 70 120 100 Q 180 70 240 140 L 240 240 L 0 240 Z" fill="url(#mountain-back)"/>
    
    <!-- Closer Mountain Ridges (Basin Slopes) -->
    <path d="M -10 160 Q 70 90 140 130 Q 200 100 250 160 L 250 240 L -10 240 Z" fill="url(#mountain-grad)"/>

    <!-- Basin Floor (Flat lowland cradled by mountains) -->
    <path d="M 30 180 Q 120 160 210 180 L 230 220 Q 120 230 10 220 Z" fill="#047857"/>

    <!-- Rich Terraced Fields / Paddy elements (symbolizing wet agriculture in Sichuan Basin) -->
    <path d="M 50 190 Q 120 175 190 190 L 180 205 Q 120 190 60 205 Z" fill="#059669" opacity="0.8"/>
    <path d="M 70 207 Q 120 195 170 207 L 165 217 Q 120 205 75 217 Z" fill="#047857" opacity="0.9"/>

    <!-- Bamboo Clumps (Context Props - iconic to Sichuan) -->
    <g id="bamboo-grove">
      <!-- Bamboo stalks left -->
      <line x1="25" y1="210" x2="25" y2="130" stroke="url(#bamboo-grad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="215" x2="33" y2="140" stroke="url(#bamboo-grad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="18" y1="205" x2="16" y2="150" stroke="url(#bamboo-grad)" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Bamboo leaves -->
      <path d="M 25 140 Q 15 135 10 140 Q 18 145 25 140 Z" fill="#34d399"/>
      <path d="M 25 155 Q 35 150 40 157 Q 32 160 25 155 Z" fill="#10b981"/>
      <path d="M 33 160 Q 23 155 20 162 Q 28 167 33 160 Z" fill="#34d399"/>

      <!-- Bamboo stalks right -->
      <line x1="215" y1="210" x2="218" y2="135" stroke="url(#bamboo-grad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="223" y1="215" x2="227" y2="145" stroke="url(#bamboo-grad)" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Bamboo leaves right -->
      <path d="M 218 145 Q 228 140 233 147 Q 225 152 218 145 Z" fill="#34d399"/>
      <path d="M 218 165 Q 208 160 203 167 Q 210 172 218 165 Z" fill="#10b981"/>
    </g>

    <!-- Traditional Sichuan House (Low-slung architecture nestled in the basin) -->
    <g id="basin-house" transform="translate(95, 140)">
      <!-- Walls -->
      <rect x="10" y="25" width="35" height="25" fill="#f8fafc" rx="2"/>
      <!-- Wooden pillars -->
      <rect x="15" y="25" width="3" height="25" fill="#78350f"/>
      <rect x="37" y="25" width="3" height="25" fill="#78350f"/>
      <!-- Roof (Traditional tile curve) -->
      <path d="M 5 25 Q 27 12 50 25 L 45 20 Q 27 10 9 20 Z" fill="#b45309"/>
      <path d="M 2 25 L 53 25 L 50 21 L 5 21 Z" fill="#d97706"/>
      <!-- Warm window light -->
      <rect x="20" y="32" width="15" height="15" fill="#fbbf24" rx="1"/>
      <line x1="27" y1="32" x2="27" y2="47" stroke="#78350f" stroke-width="1.5"/>
      <line x1="20" y1="39" x2="35" y2="39" stroke="#78350f" stroke-width="1.5"/>
    </g>

    <!-- ATMOSPHERIC HUMIDITY / MIST (Visualizing '气候湿润' - Humid Climate) -->
    <!-- Low-hanging basin fog swathing the landscape -->
    <path d="M 0 150 Q 60 135 120 155 Q 180 135 240 150 L 240 190 Q 180 205 120 185 Q 60 205 0 190 Z" fill="url(#mist-grad)"/>
    <path d="M 20 130 Q 90 115 150 135 Q 210 115 230 130 L 230 160 Q 210 170 150 150 Q 90 170 20 160 Z" fill="url(#mist-grad)"/>

    <!-- Floating Mist Wisps -->
    <ellipse cx="70" cy="140" rx="35" ry="8" fill="#cbd5e1" opacity="0.25" filter="blur(4px)"/>
    <ellipse cx="160" cy="145" rx="45" ry="10" fill="#cbd5e1" opacity="0.3" filter="blur(4px)"/>
    <ellipse cx="110" cy="120" rx="55" ry="12" fill="#cbd5e1" opacity="0.2" filter="blur(5px)"/>

    <!-- Gentle Dew Drops / Fine Mist Particles floating in the humid air -->
    <circle cx="50" cy="100" r="1.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="85" cy="85" r="2" fill="#38bdf8" opacity="0.5"/>
    <circle cx="130" cy="95" r="1" fill="#38bdf8" opacity="0.8"/>
    <circle cx="175" cy="80" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="205" cy="105" r="1.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="95" cy="115" r="1" fill="#38bdf8" opacity="0.9"/>
    <circle cx="150" cy="110" r="2.5" fill="#38bdf8" opacity="0.4"/>

    <!-- Character Experiencing the Humid Basin Climate -->
    <!-- A friendly traveler/local holding a broad leaf or umbrella under the misty basin atmosphere -->
    <g id="character" transform="translate(130, 155)">
      <!-- Body / Jacket -->
      <path d="M 0 35 Q -10 20 -15 10 L 15 10 Q 10 20 0 35 Z" fill="#0284c7"/>
      <rect x="-12" y="10" width="24" height="30" rx="6" fill="#0284c7"/>
      
      <!-- Head -->
      <circle cx="0" cy="0" r="11" fill="#fed7aa"/>
      
      <!-- Cheeks showing relaxed, comfortable expression in lush nature -->
      <circle cx="-5" cy="2" r="2" fill="#f43f5e" opacity="0.4"/>
      <circle cx="5" cy="2" r="2" fill="#f43f5e" opacity="0.4"/>
      
      <!-- Face Expression (Smiling eyes & happy mouth) -->
      <path d="M -5 -2 Q -3 -4 -1 -2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M 1 -2 Q 3 -4 5 -2" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M -3 4 Q 0 7 3 4" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

      <!-- Hair -->
      <path d="M -11 -3 Q 0 -14 11 -3 Q 8 -10 0 -11 Q -8 -10 -11 -3 Z" fill="#334155"/>

      <!-- Arm holding a large tropical taro leaf / lotus leaf as a natural umbrella against the mist -->
      <path d="M 10 15 Q 25 15 30 5" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" fill="none"/>
      
      <!-- Large Green Leaf (Context Prop representing high humidity / lush vegetation) -->
      <g transform="translate(30, -5)">
        <path d="M 0 10 Q 25 -15 45 -10 Q 30 15 0 10 Z" fill="#10b981"/>
        <path d="M 0 10 Q 20 5 45 -10" stroke="#059669" stroke-width="1.5" fill="none"/>
        <path d="M 15 2 Q 22 -2 30 -6" stroke="#059669" stroke-width="1" fill="none"/>
        <path d="M 8 6 Q 14 3 20 -1" stroke="#059669" stroke-width="1" fill="none"/>
      </g>
    </g>

    <!-- Potted Plant / Dew-kissed foliage in foreground (framing the bottom edge) -->
    <g transform="translate(25, 200)">
      <path d="M -5 20 Q 0 5 15 15 Q 25 5 35 20 Z" fill="#047857"/>
      <!-- Dew drops on leaves -->
      <circle cx="10" cy="12" r="2" fill="#e0f2fe" opacity="0.8"/>
      <circle cx="22" cy="14" r="1.5" fill="#e0f2fe" opacity="0.9"/>
    </g>
    <g transform="translate(180, 205)">
      <path d="M -10 15 Q 5 -2 20 10 Q 30 0 40 15 Z" fill="#059669"/>
      <!-- Dew drops on leaves -->
      <circle cx="5" cy="8" r="2" fill="#e0f2fe" opacity="0.8"/>
      <circle cx="28" cy="8" r="1.5" fill="#e0f2fe" opacity="0.9"/>
    </g>
  </g>
</svg>