<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Window/Light -->
  <rect x="160" y="40" width="40" height="60" rx="4" fill="#334155"/>
  <path d="M180 40v60M160 70h40" stroke="#0f172a" stroke-width="4"/>
  <circle cx="180" cy="70" r="15" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Room Details -->
  <rect x="20" y="160" width="200" height="10" fill="#334155"/>
  <rect x="40" y="170" width="10" height="30" fill="#475569"/>
  <rect x="190" y="170" width="10" height="30" fill="#475569"/>
  
  <!-- The Subject (Sitting on chair) -->
  <g transform="translate(120, 150)">
    <!-- Chair -->
    <rect x="-30" y="0" width="60" height="10" fill="#fb923c"/>
    <rect x="-25" y="10" width="10" height="30" fill="#f59e0b"/>
    <rect x="15" y="10" width="10" height="30" fill="#f59e0b"/>
    
    <!-- Body -->
    <path d="M-20 0h40v-40c0-20-40-20-40 0z" fill="#38bdf8"/>
    <circle cx="0" cy="-55" r="20" fill="#fde68a"/>
    
    <!-- Arms/Laptop -->
    <rect x="-35" y="-30" width="70" height="40" rx="5" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="-30" y="-25" width="60" height="25" rx="2" fill="#0f172a"/>
    <rect x="-10" y="-20" width="20" height="3" fill="#38bdf8"/>
  </g>
  
  <!-- Clock on wall -->
  <circle cx="50" cy="60" r="15" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="50" y1="60" x2="50" y2="50" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="60" y2="60" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <rect x="180" y="145" width="20" height="25" rx="3" fill="#ec4899"/>
  <path d="M200 150h5a3 3 0 0 1 0 6h-5" fill="none" stroke="#ec4899" stroke-width="3"/>
</svg>