<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M40 190 L200 190" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Falling Debris/Impact representation -->
  <path d="M180 60 L160 100" stroke="#E53E3E" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M190 70 L170 110" stroke="#E53E3E" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Human Character (Stumbling/Falling due to impact) -->
  <g transform="translate(100, 140)">
    <!-- Body -->
    <path d="M0 0 L-10 40 M0 0 L10 40" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="12" fill="#CBD5E0"/>
    <!-- Arms (Flailing) -->
    <path d="M-5 -5 L-25 10" stroke="#CBD5E0" stroke-width="5" stroke-linecap="round"/>
    <path d="M5 -5 L25 15" stroke="#CBD5E0" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs (Stumbling) -->
    <path d="M-10 40 L-20 50" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 40 L20 45" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Motion lines indicating sudden force/impact -->
  <path d="M150 80 L130 110" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  <path d="M140 90 L120 120" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Debris on ground -->
  <circle cx="160" cy="185" r="4" fill="#718096"/>
  <circle cx="175" cy="188" r="3" fill="#718096"/>
</svg>