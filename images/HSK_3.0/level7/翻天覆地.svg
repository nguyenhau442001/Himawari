<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Definitions & Glows -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="120" cy="120" r="90" fill="#29B6F6" opacity="0.05" filter="url(#glow)"/>
  <circle cx="120" cy="120" r="60" fill="#FFB300" opacity="0.05" filter="url(#glow)"/>

  <!-- Conceptual Representation: "翻天覆地" (Turning heaven and earth upside down / Cataclysmic dramatic transformation of a physical landscape) -->
  
  <!-- Lower Hemisphere (Flipped Earth/Ground - Modernizing Cityscape & Landscape) -->
  <g transform="translate(120, 120)">
    <!-- Rotating transformation arc indicators -->
    <path d="M -85 0 A 85 85 0 0 1 85 0" fill="none" stroke="#FFC107" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6"/>
    <path d="M 85 0 A 85 85 0 0 1 -85 0" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6"/>

    <!-- Dynamic transformation arrows -->
    <path d="M -92 -15 L -85 0 L -78 -15" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 92 15 L 85 0 L 78 15" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Terrestrial Globe Section (Rising/Transforming) -->
    <g transform="translate(0, 15)">
      <!-- Base terrain arch -->
      <path d="M -75,25 Q 0,-15 75,25 L 75,50 Q 0,70 -75,50 Z" fill="#0D47A1" opacity="0.5"/>
      <path d="M -65,15 Q 0,-20 65,15 L 65,45 Q 0,60 -65,45 Z" fill="#1565C0"/>
      
      <!-- Modern Skyline rising from ground -->
      <rect x="-45" y="-15" width="16" height="45" rx="2" fill="#90CAF9"/>
      <rect x="-25" y="-30" width="18" height="60" rx="2" fill="#E3F2FD"/>
      <rect x="-3" y="-45" width="22" height="75" rx="2" fill="#FFFFFF"/>
      <rect x="21" y="-25" width="16" height="55" rx="2" fill="#90CAF9"/>
      <rect x="40" y="-10" width="14" height="40" rx="2" fill="#64B5F6"/>

      <!-- Glowing windows/lights on buildings -->
      <rect x="-41" y="-8" width="3" height="4" fill="#FFC107" opacity="0.8"/>
      <rect x="-35" y="-8" width="3" height="4" fill="#FFC107" opacity="0.8"/>
      <rect x="-41" y="2" width="3" height="4" fill="#FFC107" opacity="0.8"/>
      <rect x="-35" y="2" width="3" height="4" fill="#FFC107" opacity="0.8"/>
      
      <rect x="-21" y="-20" width="3" height="5" fill="#FFC107"/>
      <rect x="-14" y="-20" width="3" height="5" fill="#FFC107"/>
      <rect x="-21" y="-5" width="3" height="5" fill="#FFC107"/>
      <rect x="-14" y="-5" width="3" height="5" fill="#FFC107"/>

      <rect x="1" y="-35" width="4" height="6" fill="#FFC107"/>
      <rect x="8" y="-35" width="4" height="6" fill="#FFC107"/>
      <rect x="1" y="-20" width="4" height="6" fill="#FFC107"/>
      <rect x="8" y="-20" width="4" height="6" fill="#FFC107"/>

      <!-- Roads/Infrastructure lines -->
      <path d="M -65,30 Q 0,45 65,30" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Upper Celestial/Heavenly Section (Flipped/Overturned) -->
    <g transform="translate(0, -25)">
      <!-- Heavenly Arch / Canopy -->
      <path d="M -75,-25 Q 0,15 75,-25 L 75,-45 Q 0,-70 -75,-45 Z" fill="url(#skyGrad)" opacity="0.9"/>
      
      <!-- Stars & Dynamic energetic celestial elements -->
      <path d="M -40,-35 L -37,-42 L -30,-45 L -37,-48 L -40,-55 L -43,-48 L -50,-45 L -43,-42 Z" fill="#FFE082"/>
      <path d="M 45,-30 L 47,-35 L 52,-37 L 47,-39 L 45,-44 L 43,-39 L 38,-37 L 43,-35 Z" fill="#FFE082"/>
      <circle cx="0" cy="-45" r="3" fill="#FFF"/>
      <circle cx="-20" cy="-30" r="2" fill="#FFE082"/>
      <circle cx="25" cy="-35" r="2" fill="#FFE082"/>

      <!-- Orbit rings representing cosmic scale change -->
      <ellipse cx="0" cy="-25" rx="55" ry="12" fill="none" stroke="#FF5722" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="0" cy="-25" rx="35" ry="8" fill="none" stroke="#FFC107" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Central Impact / Core Transformation Energy Flare -->
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#FF5722"/>
  </g>

  <!-- Minimalist framing border to maintain sleek modern card aesthetic -->
  <rect x="12" y="12" width="216" height="216" rx="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
</svg>