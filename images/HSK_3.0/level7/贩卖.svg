<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stall Wood Gradient -->
    <linearGradient id="stallWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Box Gradient -->
    <linearGradient id="cardboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Alley Lighting / Atmosphere -->
  <circle cx="120" cy="50" r="90" fill="url(#lampGlow)"/>

  <!-- Hanging Street Bulb -->
  <path d="M120 0 L120 35" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="35" r="8" fill="#475569"/>
  <circle cx="120" cy="38" r="5" fill="#fef08a"/>

  <!-- Background Alley Walls & Shadows -->
  <path d="M0 240 L0 100 L40 90 L40 240 Z" fill="#090d16"/>
  <path d="M240 240 L240 110 L190 95 L190 240 Z" fill="#090d16"/>

  <!-- Merchant Stall Structure (The '贩卖' Counter) -->
  <!-- Back wall of the stall -->
  <rect x="40" y="80" width="160" height="90" fill="#334155" rx="4"/>
  <!-- Accordion security gate pattern in background -->
  <path d="M50 90 L70 160 M70 90 L90 160 M90 90 L110 160 M110 90 L130 160 M130 90 L150 160 M150 90 L170 160 M170 90 L190 160" stroke="#1e293b" stroke-width="3" opacity="0.5"/>

  <!-- Counter / Table Top -->
  <rect x="30" y="150" width="180" height="14" fill="url(#stallWood)" rx="2"/>
  <rect x="25" y="164" width="190" height="6" fill="#451a03" rx="1"/>

  <!-- PROP LAYER: Counter Goods & Fake Items (假冒商品) -->
  <!-- Cardboard Box with Fake Luxury Handbags/Goods -->
  <path d="M45 130 L75 125 L75 150 L45 155 Z" fill="url(#cardboard)"/>
  <path d="M75 125 L105 130 L105 155 L75 150 Z" fill="#b45309"/>
  <path d="M45 130 L75 125 L105 130 L75 135 Z" fill="#f59e0b"/>

  <!-- Suspicious "Luxury" Handbag spilling out (Fake Brand item) -->
  <path d="M85 115 C80 105 100 100 105 110 C110 120 90 130 85 115 Z" fill="#ec4899"/>
  <circle cx="95" cy="112" r="3" fill="#facc15"/> <!-- Fake shiny logo badge -->

  <!-- Countertop item stack (Fake smartwatches / boxes) -->
  <rect x="130" y="135" width="25" height="15" fill="#0f172a" rx="2"/>
  <rect x="133" y="138" width="19" height="3" fill="#38bdf8"/>
  <rect x="130" y="123" width="25" height="15" fill="#1e293b" rx="2"/>
  <circle cx="142" cy="130" r="4" fill="#ef4444"/> <!-- Red warning-like fake seal -->

  <!-- Shady Character: Merchant (Selling fake goods) -->
  <g id="merchant">
    <!-- Body / Torso -->
    <path d="M145 160 C145 150 175 150 175 160 L185 210 L135 210 Z" fill="#1e293b"/>
    <!-- Hoodie/Jacket zipper accent -->
    <line x1="160" y1="155" x2="160" y2="200" stroke="#64748b" stroke-width="2"/>

    <!-- Head & Cap (Shady posture, leaning in) -->
    <circle cx="160" cy="132" r="14" fill="#fed7aa"/>
    <!-- Baseball cap pulled low -->
    <path d="M144 128 C144 120 176 120 176 128 L176 132 L144 132 Z" fill="#0f172a"/>
    <path d="M160 126 L185 129 L180 132 L160 130 Z" fill="#0f172a"/> <!-- Cap brim casting shadow -->

    <!-- Smug, scheming facial expression -->
    <path d="M165 135 Q170 138 175 134" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Smirk -->
    <path d="M152 130 L157 131" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/> <!-- Narrowed sly eye -->

    <!-- Arm gesturing towards the goods -->
    <path d="M145 160 L120 145 L125 140 L150 155 Z" fill="#1e293b"/>
    <circle cx="118" cy="142" r="5" fill="#fed7aa"/> <!-- Hand pointing -->
  </g>

  <!-- Shady Character 2: Accomplice / Look-out or Customer -->
  <g id="accomplice">
    <!-- Body -->
    <path d="M70 170 C70 160 95 160 95 170 L105 220 L60 220 Z" fill="#334155"/>
    <!-- Head -->
    <circle cx="82" cy="145" r="13" fill="#fbcfe8"/>
    <!-- Hooded sweatshirt -->
    <path d="M66 140 C66 130 98 130 98 140 L102 155 C90 160 74 160 62 155 Z" fill="#475569"/>
    <!-- Collar shadow -->
    <path d="M75 145 Q82 152 89 145" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <!-- Face profile -->
    <circle cx="87" cy="147" r="1.5" fill="#1e293b"/>
    <path d="M85 152 Q88 154 91 151" stroke="#1e293b" stroke-width="1" fill="none"/> <!-- Nervous mouth -->
  </g>

  <!-- Foreground Floor / Street Edge -->
  <path d="M0 215 Q120 210 240 215 L240 240 L0 240 Z" fill="#090d16"/>
  
  <!-- Subtle warning / contraband details on ground (e.g., discarded fake tags) -->
  <rect x="100" y="222" width="12" height="8" fill="#f8fafc" rx="1" transform="rotate(15 106 226)"/>
  <rect x="180" y="225" width="10" height="6" fill="#ef4444" rx="1" transform="rotate(-30 185 228)"/>

  <!-- Dramatic overhead lighting vignettes (Dark vignette framing) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#000000" stroke-width="8" opacity="0.3"/>
</svg>