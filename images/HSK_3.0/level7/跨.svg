<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- River -->
  <path d="M0 180 C 80 160, 160 200, 240 180 L 240 240 L 0 240 Z" fill="#0ea5e9" opacity="0.6"/>
  <path d="M0 190 C 80 170, 160 210, 240 190" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Stepping Stones -->
  <ellipse cx="60" cy="195" rx="15" ry="8" fill="#475569"/>
  <ellipse cx="180" cy="195" rx="15" ry="8" fill="#475569"/>
  
  <!-- Character -->
  <g transform="translate(100, 120)">
    <!-- Legs in motion -->
    <path d="M10 60 L 20 40 L 30 60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-10 60 L -5 30 L 0 60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <rect x="-15" y="-10" width="30" height="45" rx="5" fill="#fbbf24"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="15" fill="#fbbf24"/>
    <!-- Arms -->
    <path d="M-20 0 L -35 20" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 0 L 35 20" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Nature Details -->
  <path d="M20 180 L 20 140 M30 180 L 30 150" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="135" r="5" fill="#ec4899"/>
  <circle cx="30" cy="145" r="4" fill="#ec4899"/>
  
  <path d="M210 180 L 210 150 M220 180 L 220 140" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="210" cy="145" r="4" fill="#ec4899"/>
  <circle cx="220" cy="135" r="5" fill="#ec4899"/>
  
  <!-- Moon/Light -->
  <circle cx="200" cy="40" r="20" fill="#fb923c" opacity="0.3"/>
  <circle cx="200" cy="40" r="12" fill="#f59e0b"/>
</svg>