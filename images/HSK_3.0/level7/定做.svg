  <!-- Tailor's Tape Measure -->
  <path d="M70 120 C 70 90, 100 70, 130 70 C 160 70, 190 90, 190 120 C 190 150, 160 170, 130 170 C 100 170, 70 150, 70 120 Z" fill="#2D343E" stroke="#FFB84D" stroke-width="3"/>
  
  <!-- Suit Jacket (The "Dingzuo" Object) -->
