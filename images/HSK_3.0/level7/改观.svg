<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow and shadow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Linear gradients -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    
    <linearGradient id="healthyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#22543D"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6AD55"/>
      <stop offset="100%" stop-color="#DD6B20"/>
    </linearGradient>
  </defs>

  <!-- Split Viewport representing Transformation / 改观 (Before & After concept unified in a physical landscape) -->
  <!-- Left Side: Barren/Before state (subdued tones) -->
  <path d="M 30 160 Q 75 160 120 160 L 120 200 L 30 200 Z" fill="#252A34" opacity="0.5"/>
  <path d="M 45 160 L 45 130 L 48 130 L 48 160 Z" fill="#4A5568"/>
  <path d="M 75 160 L 70 125 L 74 125 L 79 160 Z" fill="#4A5568"/>
  <path d="M 100 160 L 105 135 L 108 135 L 103 160 Z" fill="#4A5568"/>

  <!-- Right Side: Thriving/After state (vibrant eco-environment) -->
  <path d="M 120 160 Q 165 160 210 160 L 210 200 L 120 200 Z" fill="url(#groundGrad)"/>
  
  <!-- Central Physical Object representing "The Transformed Landscape / Ecosystem" (改观) -->
  <!-- A large, lush, vibrant ecological terrarium/dome structure representing the visible positive change -->
  <g transform="translate(0, 5)">
    <!-- Terrarium Glass Base / Container -->
    <path d="M 75 180 C 75 185 85 190 120 190 C 155 190 165 185 165 180 L 175 125 C 175 100 150 80 120 80 C 90 80 65 100 65 125 Z" fill="#2D3748" stroke="#4A5568" stroke-width="3" opacity="0.6"/>
    
    <!-- Terrarium Interior Soil -->
    <ellipse cx="120" cy="165" rx="42" ry="12" fill="#2C221E"/>

    <!-- Flourishing Ecosystem Inside (Positive Transformation) -->
    <!-- Large healthy central tree -->
    <path d="M 120 165 C 120 150 117 135 110 120 C 125 115 135 125 130 145 C 128 155 124 162 120 165 Z" fill="#718096"/>
    <!-- Tree Canopy (Vibrant Green) -->
    <circle cx="110" cy="115" r="22" fill="#48BB78"/>
    <circle cx="128" cy="105" r="26" fill="#38A169"/>
    <circle cx="138" cy="122" r="18" fill="#68D391"/>

    <!-- Small flowers / plants -->
    <circle cx="95" cy="160" r="4" fill="#F6AD55"/>
    <path d="M 95 160 L 95 168" stroke="#48BB78" stroke-width="2"/>
    
    <circle cx="145" cy="158" r="4" fill="#ED64A6"/>
    <path d="M 145 158 L 145 167" stroke="#48BB78" stroke-width="2"/>

    <!-- Glass Highlight / Reflection -->
    <path d="M 80 120 C 80 105 95 90 110 85" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 72 150 C 70 140 72 130 76 120" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

    <!-- Terrarium Metal Rim & Stand -->
    <ellipse cx="120" cy="80" rx="18" ry="5" fill="none" stroke="#CBD5E0" stroke-width="3"/>
    <path d="M 105 80 L 135 80" stroke="#CBD5E0" stroke-width="2"/>
  </g>

  <!-- Transformation Indicator Arrows (Dynamic Positive Shift) -->
  <!-- Sweeping gold/orange curved arrow indicating positive change/evolution -->
  <path d="M 60 100 Q 90 60 125 65" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="130,62 120,58 123,68" fill="#F6AD55"/>

  <!-- Sparkles / Accent highlights showing improvement and clarity -->
  <g fill="#F6AD55">
    <!-- Star 1 -->
    <path d="M 175 80 Q 175 90 185 90 Q 175 90 175 100 Q 175 90 165 90 Q 175 90 175 80" />
    <!-- Star 2 -->
    <path d="M 55 130 Q 55 136 61 136 Q 55 136 55 142 Q 55 136 49 136 Q 55 136 55 130" transform="scale(0.7) translate(30, 40)"/>
    <!-- Star 3 (Top right vibrant indicator) -->
    <path d="M 195 125 Q 195 131 201 131 Q 195 131 195 137 Q 195 131 189 131 Q 195 131 195 125" />
  </g>

  <!-- Ground reflection line -->
  <line x1="40" y1="200" x2="200" y2="200" stroke="#4A5568" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>