<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Soil Gradient (Rich improved dark soil) -->
    <linearGradient id="soil-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38220f" />
      <stop offset="100%" stop-color="#241407" />
    </linearGradient>

    <!-- Compost/Nutrient Layer Gradient -->
    <linearGradient id="compost-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <!-- Sky/Sun Glow -->
    <radialGradient id="sun-glow" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#sun-glow)" />

  <!-- SCENE ELEMENTS: FAR BACKGROUND -->
  <!-- Distant Hills -->
  <path d="M 0 140 Q 60 110 120 135 T 240 125 L 240 180 L 0 180 Z" fill="#334155" opacity="0.4" />
  
  <!-- Gentle Sun/Light Source -->
  <circle cx="190" cy="50" r="18" fill="#fde047" opacity="0.8" />
  <circle cx="190" cy="50" r="28" fill="#f59e0b" opacity="0.2" />

  <!-- MAIN GROUND & SOIL (Context for "改良土壤" - Improving soil) -->
  <!-- Base Soil Area -->
  <path d="M 0 150 Q 80 140 240 155 L 240 240 L 0 240 Z" fill="url(#soil-grad)" />
  
  <!-- Soil Richness Texture / Compost Being Mixed In -->
  <path d="M 20 170 Q 70 160 140 175 Q 200 185 240 170 L 240 220 Q 150 230 60 210 Z" fill="url(#compost-grad)" opacity="0.85" />

  <!-- Little Green Sprouts showing successful soil improvement -->
  <!-- Sprout 1 -->
  <path d="M 35 168 Q 30 155 22 152" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 35 168 Q 42 155 50 153" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="20" cy="151" rx="4" ry="2" fill="#22c55e" transform="rotate(-30 20 151)" />
  <ellipse cx="52" cy="152" rx="4" ry="2" fill="#22c55e" transform="rotate(30 52 152)" />

  <!-- Sprout 2 -->
  <path d="M 205 180 Q 200 170 195 168" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
  <path d="M 205 180 Q 210 170 215 168" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
  <circle cx="194" cy="167" r="2" fill="#22c55e" />
  <circle cx="216" cy="167" r="2" fill="#22c55e" />


  <!-- CHARACTER: FARMER (农民 - Nông dân) -->
  <g id="farmer">
    <!-- Straw Hat / Hat Brim -->
    <ellipse cx="125" cy="84" rx="30" ry="8" fill="#fbbf24" />
    <path d="M 105 84 Q 125 70 145 84 Z" fill="#f59e0b" />

    <!-- Head & Face -->
    <circle cx="125" cy="91" rx="14" ry="15" fill="#fde68a" />
    <!-- Friendly smiling eye -->
    <path d="M 120 90 Q 123 93 126 90" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <!-- Rosy cheek -->
    <circle cx="132" cy="94" rx="3" ry="2" fill="#f43f5e" opacity="0.4" />

    <!-- Torso / Blue Shirt -->
    <path d="M 105 110 C 105 103 145 103 145 110 L 152 155 C 152 158 148 160 145 160 L 105 160 C 102 160 98 158 98 155 Z" fill="#0ea5e9" />
    <!-- Collar -->
    <path d="M 115 107 L 125 115 L 135 107" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />

    <!-- Arms & Gardening Tool (Shovel / Hoe - 铁锹/锄头) -->
    <!-- Left Arm -->
    <path d="M 108 112 L 85 135" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
    
    <!-- Right Arm reaching forward -->
    <path d="M 142 112 L 165 140" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />

    <!-- Wooden Handle of Hoe -->
    <path d="M 70 155 L 175 125" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" />

    <!-- Hoe Blade / Tool Head -->
    <path d="M 165 115 L 185 120 L 178 135 Z" fill="#64748b" stroke="#475569" stroke-linejoin="round" stroke-width="1.5" />

    <!-- Hands -->
    <circle cx="83" cy="138" rx="4" ry="4" fill="#fde68a" />
    <circle cx="163" cy="138" rx="4" ry="4" fill="#fde68a" />

    <!-- Legs & Boots -->
    <path d="M 112 158 L 110 195 L 122 195 L 124 158 Z" fill="#334155" />
    <path d="M 136 158 L 138 195 L 150 195 L 146 158 Z" fill="#334155" />
    <!-- Boots -->
    <path d="M 104 193 L 122 193 C 125 193 125 198 122 198 L 102 198 C 99 198 101 193 104 193 Z" fill="#1e293b" />
    <path d="M 136 193 L 154 193 C 157 193 159 198 156 198 L 136 198 C 133 198 133 193 136 193 Z" fill="#1e293b" />
  </g>

  <!-- CONTEXT PROPS (Enhancing "改良土壤" - soil enhancement tools & details) -->
  <!-- Bucket of Organic Fertilizer / Nutrient Mix -->
  <g id="fertilizer-bucket">
    <!-- Bucket Body -->
    <path d="M 60 180 L 70 215 C 70 218 73 220 76 220 L 94 220 C 97 220 100 218 100 215 L 110 180 Z" fill="#ef4444" />
    <!-- Bucket Rim -->
    <ellipse cx="85" cy="180" rx="25" ry="5" fill="#f87171" />
    <!-- Nutrient contents visible -->
    <ellipse cx="85" cy="182" rx="22" ry="4" fill="#713f12" />
    <!-- Bucket Handle -->
    <path d="M 65 180 Q 85 155 105 180" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Flying particles / soil improvement action sparkles -->
  <circle cx="140" cy="145" r="2.5" fill="#fbbf24" opacity="0.9" />
  <circle cx="155" cy="130" r="1.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="125" cy="155" r="2" fill="#34d399" opacity="0.8" />
  <circle cx="100" cy="165" r="1.5" fill="#fbbf24" opacity="0.6" />

  <!-- Foreground Atmospheric Frame Accents -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>