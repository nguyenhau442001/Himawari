<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient background glow for warmth and celebration of payday -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.8"/>
  <circle cx="120" cy="110" r="60" fill="#3b82f6" opacity="0.08"/>

  <!-- Interior Office/Workspace Environment Context -->
  <!-- Desk surface -->
  <path d="M 30,195 L 210,195 L 220,225 L 20,225 Z" fill="#334155"/>
  <path d="M 30,195 L 210,195 L 210,198 L 30,198 Z" fill="#475569"/>

  <!-- Background Office Details -->
  <!-- Window showing night/evening cityscape -->
  <rect x="150" y="35" href="#" width="60" height="85" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="158" y="43" width="20" height="30" rx="2" fill="#38bdf8" opacity="0.2"/>
  <rect x="182" y="43" width="20" height="45" rx="2" fill="#f59e0b" opacity="0.2"/>
  <rect x="158" y="78" width="20" height="34" rx="2" fill="#38bdf8" opacity="0.15"/>
  
  <!-- Desk Plant -->
  <rect x="180" y="165" width="20" height="25" rx="4" fill="#64748b"/>
  <circle cx="190" cy="158" r="14" fill="#10b981"/>
  <circle cx="183" cy="152" r="10" fill="#34d399"/>
  <circle cx="197" cy="154" r="10" fill="#059669"/>

  <!-- Character: Office Worker / Employee receiving salary -->
  <!-- Torso & Body -->
  <path d="M 85,210 C 85,175 100,160 120,160 C 140,160 155,175 155,210 Z" fill="#38bdf8"/>
  <!-- Collar & Tie -->
  <path d="M 110,160 L 120,180 L 130,160 Z" fill="#f8fafc"/>
  <polygon points="117,175 123,175 125,200 120,208 115,200" fill="#ef4444"/>

  <!-- Head & Face -->
  <circle cx="120" cy="130" r="22" fill="#ffedd5"/>
  <!-- Hair -->
  <path d="M 98,125 C 98,108 110,105 120,105 C 132,105 142,110 142,125 C 142,130 138,122 135,118 C 128,112 112,112 105,118 C 101,122 98,125 98,125 Z" fill="#334155"/>
  <!-- Happy Expression -->
  <path d="M 112,134 Q 120,142 128,134" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="112" cy="128" r="2" fill="#b45309"/>
  <circle cx="128" cy="128" r="2" fill="#b45309"/>
  <!-- Cheeks -->
  <circle cx="108" cy="136" r="4" fill="#fca5a5" opacity="0.6"/>
  <circle cx="132" cy="136" r="4" fill="#fca5a5" opacity="0.6"/>

  <!-- Hands holding the salary / bonus items -->
  <circle cx="95" cy="185" r="8" fill="#ffedd5"/>
  <circle cx="145" cy="185" r="8" fill="#ffedd5"/>

  <!-- MAIN ILLUSTRATION OF "连同" (Salary TOGETHER WITH Bonus -> Total 5000) -->
  <!-- Salary Envelope (Base salary) -->
  <g transform="translate(75, 135) rotate(-10)">
    <rect width="55" height="40" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
    <path d="M 0,0 L 27.5,22 L 55,0" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
    <!-- Golden Seal / Gold accent -->
    <circle cx="27.5" cy="20" r="8" fill="#fbbf24"/>
    <circle cx="27.5" cy="20" r="5" fill="#f59e0b"/>
  </g>

  <!-- Bonus Envelope (Stacked/Combined "连同" concept) -->
  <g transform="translate(110, 125) rotate(8)">
    <rect width="55" height="40" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <path d="M 0,0 L 27.5,22 L 55,0" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <!-- Red Seal representing bonus -->
    <circle cx="27.5" cy="20" r="8" fill="#ef4444"/>
    <circle cx="27.5" cy="20" r="5" fill="#dc2626"/>
  </g>

  <!-- Floating Golden Coins / Value representation (5000 yuan visual cue) -->
  <g transform="translate(0, -5)">
    <!-- Coin 1 -->
    <circle cx="65" cy="115" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <circle cx="65" cy="115" r="5" fill="none" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Coin 2 -->
    <circle cx="175" cy="125" r="12" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <circle cx="175" cy="125" r="6" fill="none" stroke="#d97706" stroke-width="1.5"/>

    <!-- Coin 3 (Sparkling / Top) -->
    <circle cx="120" cy="90" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <circle cx="120" cy="90" r="7" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <!-- Sparkles -->
    <path d="M 120,70 L 120,76 M 120,104 L 120,110 M 100,90 L 106,90 M 134,90 L 140,90" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkle details -->
  <path d="M 50,80 L 52,85 L 57,87 L 52,89 L 50,94 L 48,89 L 43,87 L 48,85 Z" fill="#fef08a" opacity="0.8"/>
  <path d="M 190,85 L 191,88 L 194,89 L 191,90 L 190,93 L 189,90 L 186,89 L 189,88 Z" fill="#fef08a" opacity="0.8"/>

</svg>