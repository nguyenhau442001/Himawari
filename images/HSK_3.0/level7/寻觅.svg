<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Atmospheric background glow / paths of searching -->
    <path d="M 60 180 Q 90 120 130 110 T 180 80" fill="none" stroke="#2D3748" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 75 190 Q 115 130 155 120 T 195 90" fill="none" stroke="#2D3748" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Focus spotlight beam -->
    <path d="M 125 75 L 50 195 L 180 195 Z" fill="url(#searchBeam)" opacity="0.15"/>
    
    <defs>
      <linearGradient id="searchBeam" x1="125" y1="75" x2="115" y2="195" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F6AD55" stop-opacity="1"/>
        <stop offset="100%" stop-color="#F6AD55" stop-opacity="0"/>
      </linearGradient>
      
      <linearGradient id="characterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4A5568"/>
        <stop offset="100%" stop-color="#2D3748"/>
      </linearGradient>
    </defs>

    <!-- Abstract elements representing the "meaning of life" being searched for (spark/star) -->
    <g transform="translate(160, 75)">
      <circle cx="0" cy="0" r="16" fill="#F6AD55" opacity="0.15"/>
      <circle cx="0" cy="0" r="8" fill="#F6AD55" opacity="0.3"/>
      <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#F6AD55"/>
    </g>

    <g transform="translate(130, 95)">
      <circle cx="0" cy="0" r="4" fill="#F6AD55"/>
    </g>

    <!-- Dynamic Human Character (Action: Searching / Looking forward) -->
    <g id="character">
      <!-- Legs walking/stepping forward -->
      <path d="M 105 155 L 90 190 L 102 195 L 115 160 Z" fill="#2D3748"/>
      <path d="M 115 155 L 135 185 L 145 180 L 125 150 Z" fill="#4A5568"/>

      <!-- Body / Torso leaning slightly forward in motion -->
      <path d="M 95 110 L 125 115 L 120 160 L 95 155 Z" fill="#3182CE"/>

      <!-- Head with thoughtful posture -->
      <circle cx="115" cy="85" r="14" fill="#CBD5E0"/>
      <!-- Hair -->
      <path d="M 102 82 Q 110 70 125 78 Q 128 85 125 88 L 102 82 Z" fill="#4A5568"/>

      <!-- Arm holding magnifying glass / reaching forward -->
      <!-- Back arm -->
      <path d="M 105 115 L 90 140 L 100 145 Z" fill="#2D3748"/>
      
      <!-- Front arm raised holding the glass -->
      <path d="M 120 118 L 140 100 L 150 110 L 130 130 Z" fill="#3182CE"/>
      <circle cx="145" cy="105" r="5" fill="#CBD5E0"/>
    </g>

    <!-- Large Sleek Magnifying Glass (Symbol of "寻觅" - searching/seeking) -->
    <g transform="translate(135, 95)">
      <!-- Glass Lens Glow -->
      <circle cx="0" cy="0" r="32" fill="#1A1D24" opacity="0.8"/>
      <circle cx="0" cy="0" r="32" fill="#F6AD55" opacity="0.1"/>
      
      <!-- Glass Rim -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#F6AD55" stroke-width="5"/>
      
      <!-- Lens reflection accent -->
      <path d="M -22 -12 A 26 26 0 0 1 12 -22" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

      <!-- Handle -->
      <path d="M 22 22 L 45 45" fill="none" stroke="#F6AD55" stroke-width="7" stroke-linecap="round"/>
      <path d="M 22 22 L 45 45" fill="none" stroke="#DD6B20" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Motion lines to emphasize active seeking action -->
    <path d="M 75 70 L 90 75" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 65 90 L 82 93" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 72 110 L 85 112" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>