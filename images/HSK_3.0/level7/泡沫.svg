<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ocean Gradient Sky / Background -->
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" fill="url(#oceanBg)"/>

  <!-- Distant Horizon & Soft Glow -->
  <circle cx="180" cy="90" r="25" fill="#fef08a" opacity="0.15"/>

  <!-- Wet Sand Shoreline (Bottom Area) -->
  <path d="M 0 170 Q 70 160 140 175 T 240 165 L 240 240 L 0 240 Z" fill="url(#sandGrad)"/>

  <!-- Wet sand reflection layer -->
  <path d="M 0 175 Q 80 167 160 180 T 240 170 L 240 185 Q 120 195 0 185 Z" fill="#92400e" opacity="0.4"/>

  <!-- Rolling Wave Backing -->
  <path d="M -10 130 Q 60 115 130 135 T 250 120 L 250 175 L -10 175 Z" fill="#0369a1"/>

  <!-- Incoming Wave Break -->
  <path d="M 0 140 Q 70 120 140 145 T 240 130 L 240 175 Q 120 180 0 165 Z" fill="#38bdf8"/>

  <!-- WHITE FOAM LAYER (Target Concept: 泡沫) -->
  <g id="white-foam-layer">
    <!-- Organic frothy bubbles left by the receding/hitting wave -->
    <path d="M 15 168 Q 25 158 40 165 Q 55 155 75 167 Q 95 158 115 166 Q 135 157 155 168 Q 175 156 195 166 Q 215 158 230 167 L 235 178 Q 120 190 5 178 Z" fill="url(#foamGrad)"/>
    
    <!-- Detailed Foam Clusters / Bubbly texture -->
    <circle cx="30" cy="163" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="42" cy="160" r="8" fill="#ffffff" opacity="0.95"/>
    <circle cx="55" cy="164" r="5" fill="#ffffff" opacity="0.8"/>
    
    <circle cx="85" cy="161" r="9" fill="#ffffff" opacity="0.95"/>
    <circle cx="98" cy="159" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="110" cy="163" r="7" fill="#ffffff" opacity="0.95"/>
    
    <circle cx="145" cy="162" r="10" fill="#ffffff" opacity="0.95"/>
    <circle cx="160" cy="160" r="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="172" cy="165" r="5" fill="#ffffff" opacity="0.85"/>
    
    <circle cx="205" cy="162" r="8" fill="#ffffff" opacity="0.95"/>
    <circle cx="218" cy="165" r="5" fill="#ffffff" opacity="0.8"/>

    <!-- Floating individual bubbles / spray -->
    <circle cx="68" cy="150" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="75" cy="144" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="130" cy="148" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="185" cy="146" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="192" cy="140" r="2" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Character: Tourist / Beachgoer enjoying the scenery -->
  <g id="character">
    <!-- Legs in water / sand -->
    <rect x="110" y="160" width="8" height="25" rx="4" fill="#fde68a"/>
    <rect x="126" y="160" width="8" height="25" rx="4" fill="#fde68a"/>

    <!-- Shorts -->
    <path d="M 106 155 L 138 155 L 134 170 L 110 170 Z" fill="#0284c7"/>

    <!-- Torso -->
    <path d="M 108 125 Q 120 120 132 125 L 136 155 Q 120 158 104 155 Z" fill="#f43f5e"/>

    <!-- Striped shirt detail -->
    <path d="M 107 133 L 133 133" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 105 143 L 135 143" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Head & Face -->
    <circle cx="120" cy="105" r="14" fill="#fde68a"/>
    
    <!-- Hair -->
    <path d="M 106 103 Q 112 90 125 93 Q 134 95 134 105 L 132 98 Q 120 90 108 98 Z" fill="#334155"/>

    <!-- Arms - Pointing excitedly down at the foam -->
    <path d="M 108 130 Q 95 135 90 148" fill="none" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M 132 130 Q 145 135 152 145" fill="none" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Props: Beach sandals left on higher dry sand -->
  <g id="props-sandals" transform="translate(60, 185)">
    <!-- Sandal 1 -->
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="#fb923c"/>
    <path d="M -4 -1 Q 0 -3 4 -1" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Sandal 2 -->
    <ellipse cx="12" cy="6" rx="6" ry="3" fill="#fb923c"/>
    <path d="M 8 5 Q 12 3 16 5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Atmospheric Seagulls in distance -->
  <path d="M 40 60 Q 45 55 50 60 Q 55 55 60 60" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 180 40 Q 184 36 188 40 Q 192 36 196 40" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>