<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Slip/Impact Effect Gradient -->
    <radialGradient id="impactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / INTERIOR CONTEXT -->
  <!-- Back Wall Details / Bookshelf & Plant -->
  <g opacity="0.6">
    <!-- Bookshelf structure -->
    <rect x="25" y="40" width="70" height="110" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="75" x2="95" y2="75" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="110" x2="95" y2="110" stroke="#475569" stroke-width="2"/>
    
    <!-- Books on shelf -->
    <rect x="33" y="52" width="10" height="23" fill="#f43f5e" rx="1"/>
    <rect x="45" y="48" width="14" height="27" fill="#10b981" rx="1"/>
    <rect x="62" y="55" width="8" height="20" fill="#fbbf24" rx="1"/>
    <rect x="33" y="85" width="12" height="25" fill="#38bdf8" rx="1"/>
    <rect x="47" y="88" width="18" height="22" fill="#a855f7" rx="1"/>

    <!-- House Plant on top shelf -->
    <path d="M 180 65 Q 185 50 195 45 Q 205 50 210 65 Z" fill="#334155"/>
    <path d="M 195 45 Q 190 30 180 25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 195 45 Q 205 25 215 20" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 195 45 Q 200 28 195 15" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Window with Night City View -->
  <g>
    <rect x="140" y="30" width="70" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <line x1="175" y1="30" x2="175" y2="115" stroke="#475569" stroke-width="2"/>
    <line x1="140" y1="72" x2="210" y2="72" stroke="#475569" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="148" y="85" width="6" height="15" fill="#fbbf24" opacity="0.6"/>
    <rect x="158" y="50" width="8" height="40" fill="#38bdf8" opacity="0.5"/>
    <rect x="185" y="60" width="10" height="30" fill="#f43f5e" opacity="0.4"/>
    <rect x="198" y="80" width="6" height="18" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Floor Surface & Rug -->
  <rect x="0" y="160" width="240" height="80" fill="url(#floorGrad)" />
  <!-- Cozy Round Rug -->
  <ellipse cx="110" cy="190" rx="75" ry="22" fill="#334155" stroke="#475569" stroke-dasharray="4 4" stroke-width="2"/>

  <!-- PROP: The Fallen Banana Peel (The Culprit) -->
  <g transform="translate(85, 185) rotate(-15)">
    <path d="M 0 0 C -5 -10 -15 -5 -18 2 C -10 5 -5 8 0 0 Z" fill="#fde047"/>
    <path d="M 0 0 C 5 -12 15 -8 18 0 C 10 3 5 5 0 0 Z" fill="#facc15"/>
    <path d="M 0 0 C 0 10 5 15 12 18 C 10 10 5 5 0 0 Z" fill="#eab308"/>
  </g>

  <!-- IMPACT / ACTION EFFECTS -->
  <!-- Dust cloud and impact stars on the floor around the hips -->
  <circle cx="105" cy="175" r="30" fill="url(#impactGlow)" />
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="70" cy="175" r="3" />
    <circle cx="60" cy="182" r="2" />
    <circle cx="135" cy="170" r="4" />
    <circle cx="145" cy="180" r="2" />
    <!-- Action speed lines -->
    <path d="M 50 130 Q 75 150 95 165" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M 120 120 Q 130 145 110 170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>

  <!-- MAIN CHARACTER: Falling / Landed directly on his bottom ("屁股") -->
  <g id="character">
    <!-- Legs in motion (Scrambled in the air / forward) -->
    <!-- Leg 1 (Left) -->
    <path d="M 115 150 Q 140 160 155 140" fill="none" stroke="url(#pantsGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Shoe 1 -->
    <ellipse cx="160" cy="135" rx="7" ry="5" fill="#1e293b" transform="rotate(30 160 135)"/>

    <!-- Leg 2 (Right) -->
    <path d="M 110 155 Q 135 180 150 170" fill="none" stroke="url(#pantsGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Shoe 2 -->
    <ellipse cx="155" cy="173" rx="7" ry="5" fill="#1e293b" transform="rotate(-10 155 173)"/>

    <!-- THE TARGET ZONE: Distinctive padded landing directly on the bottom/hips -->
    <g transform="translate(95, 155)">
      <!-- Rounded lower body / bottom impact area -->
      <path d="M -15 -10 C -25 5 -15 20 0 20 C 15 20 25 5 15 -10 Z" fill="url(#pantsGrad)" stroke="#c2410c" stroke-width="2"/>
      <!-- Motion lines on bottom -->
      <path d="M -10 15 Q 0 25 10 15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Torso (Leaning backward/upward from impact) -->
    <path d="M 85 130 Q 105 145 115 155 L 95 115 Q 80 110 70 120 Z" fill="url(#shirtGrad)" stroke="#0284c7" stroke-width="2"/>

    <!-- Arms Flailing in Surprise -->
    <!-- Left Arm (Back) -->
    <path d="M 80 120 Q 55 110 45 125" fill="none" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
    <circle cx="43" cy="128" r="5" fill="#f97316"/> <!-- Hand -->

    <!-- Right Arm (Front) -->
    <path d="M 95 125 Q 115 110 130 120" fill="none" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
    <circle cx="133" cy="122" r="5" fill="#f97316"/> <!-- Hand -->

    <!-- Head & Face (Expressive Shock/Dizziness) -->
    <g transform="translate(65, 95)">
      <!-- Neck -->
      <rect x="15" y="18" width="8" height="12" fill="#fed7aa" rx="3"/>
      
      <!-- Head Circle -->
      <circle cx="19" cy="10" r="15" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>

      <!-- Hair -->
      <path d="M 4 8 Q 10 -2 22 -3 Q 32 -1 33 9 Q 28 3 19 3 Q 10 3 4 8 Z" fill="#1e293b"/>

      <!-- Shocked Expression / Dizzy Eyes / Open Mouth -->
      <!-- Crossed eyes (dizzy from fall) -->
      <path d="M 10 7 L 15 12 M 15 7 L 10 12" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 22 7 L 27 12 M 27 7 L 22 12" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Open O-shaped mouth -->
      <ellipse cx="18" cy="17" rx="3" ry="4" fill="#1e293b"/>

      <!-- Rosy Cheeks -->
      <circle cx="8" cy="13" r="3" fill="#f43f5e" opacity="0.5"/>
      <circle cx="29" cy="13" r="3" fill="#f43f5e" opacity="0.5"/>
    </g>

    <!-- Dropped Coffee Cup Prop (Adding realistic everyday context) -->
    <g transform="translate(130, 150) rotate(45)">
      <path d="M 0 0 L 4 15 C 4 17 2 18 0 18 C -2 18 -4 17 -4 15 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="4" ry="2" fill="#78350f"/>
      <!-- Splashing coffee drops -->
      <circle cx="15" cy="5" r="2.5" fill="#78350f"/>
      <circle cx="22" cy="12" r="1.5" fill="#78350f"/>
      <path d="M 4 2 Q 10 0 15 5" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- FOREGROUND ACCENTS (Depth of Field) -->
  <g opacity="0.4">
    <circle cx="20" cy="210" r="2" fill="#94a3b8"/>
    <circle cx="220" cy="220" r="3" fill="#94a3b8"/>
    <circle cx="210" cy="190" r="1.5" fill="#94a3b8"/>
  </g>
</svg>