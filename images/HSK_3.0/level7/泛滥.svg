<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floodwater Gradient -->
    <linearGradient id="floodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Raindrop pattern/gradient -->
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Background Environment: Distant houses and trees under dark stormy sky -->
  <g opacity="0.4">
    <!-- Distant hills/banks -->
    <path d="M0 130 Q60 120 120 135 T240 125 L240 150 L0 150 Z" fill="#334155"/>
    <!-- Distant small house -->
    <polygon points="170,120 190,105 210,120" fill="#475569"/>
    <rect x="175" y="120" width="30" height="25" fill="#334155"/>
  </g>

  <!-- Heavy Rain Streaks -->
  <g stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="20" x2="10" y2="70"/>
    <line x1="70" y1="10" x2="50" y2="60"/>
    <line x1="110" y1="30" x2="90" y2="80"/>
    <line x1="150" y1="15" x2="130" y2="65"/>
    <line x1="190" y1="25" x2="170" y2="75"/>
    <line x1="220" y1="10" x2="200" y2="60"/>

    <line x1="50" y1="70" x2="30" y2="120"/>
    <line x1="90" y1="65" x2="70" y2="115"/>
    <line x1="130" y1="80" x2="110" y2="130"/>
    <line x1="170" y1="60" x2="150" y2="110"/>
    <line x1="210" y1="75" x2="190" y2="125"/>
  </g>

  <!-- River Bank (Lower Left) -->
  <path d="M-10 240 L-10 170 Q30 165 70 175 T150 190 L240 185 L240 240 Z" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <path d="M0 180 Q40 173 80 183 T160 198 L240 193 L240 240 L0 240 Z" fill="#0f172a"/>

  <!-- Overflowing River / Floodwater (泛滥) covering the lower midground -->
  <path d="M0 160 Q60 150 120 165 T240 155 L240 240 L0 240 Z" fill="url(#floodGrad)"/>

  <!-- Water Surface Waves / Ripples -->
  <path d="M20 175 Q40 170 60 175 T100 175 T140 180 T180 175 T220 180" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M40 195 Q70 190 100 195 T160 192 T200 198" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating debris / driftwood showing flood chaos -->
  <g transform="translate(140, 195) rotate(-15)">
    <rect x="0" y="0" width="28" height="8" rx="3" fill="#78350f" stroke="#92400e" stroke-width="1"/>
    <path d="M6 0 L10 8 M18 0 L22 8" stroke="#92400e" stroke-width="1"/>
  </g>
  <g transform="translate(60, 210) rotate(8)">
    <rect x="0" y="0" width="20" height="6" rx="2" fill="#78350f"/>
  </g>

  <!-- Rural House Partially Flooded -->
  <g transform="translate(25, 115)">
    <!-- House walls -->
    <rect x="0" y="30" width="60" height="40" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Roof -->
    <polygon points="-5,30 30,5 65,30" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <!-- Window with warm light -->
    <rect x="35" y="42" width="16" height="16" rx="2" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
    <line x1="43" y1="42" x2="43" y2="58" stroke="#b45309" stroke-width="1"/>
    <line x1="35" y1="50" x2="51" y2="50" stroke="#b45309" stroke-width="1"/>
    <!-- Door half submerged -->
    <rect x="10" y="45" width="16" height="25" fill="#78350f"/>
    <!-- Water cutting across the lower part of the house -->
    <rect x="-10" y="55" width="80" height="25" fill="url(#floodGrad)" opacity="0.9"/>
  </g>

  <!-- Warning Sign / Road Post partially submerged -->
  <g transform="translate(185, 155)">
    <rect x="8" y="0" width="4" height="50" fill="#64748b"/>
    <!-- Triangular Warning Sign -->
    <polygon points="10,-22 -6,5 26,5" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <!-- Exclamation mark inside sign -->
    <rect x="8" y="-7" width="4" height="10" rx="1" fill="#1e293b"/>
    <circle cx="10" cy="8" r="2" fill="#1e293b"/>
    <!-- Water level covering lower post -->
    <path d="M-10 35 Q10 30 30 35 L30 50 L-10 50 Z" fill="url(#floodGrad)" opacity="0.95"/>
  </g>

  <!-- Distant rescue boat / person silhouette for narrative depth -->
  <g transform="translate(100, 175)">
    <path d="M0 10 Q15 0 35 10 L30 18 Q15 15 5 18 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Person in boat holding oar -->
    <circle cx="18" cy="3" r="4" fill="#fde047"/>
    <path d="M18 7 L18 12" stroke="#451a03" stroke-width="2"/>
    <line x1="12" y1="8" x2="26" y2="4" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Rain Drops (Large) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="35" y1="130" x2="20" y2="165"/>
    <line x1="115" y1="120" x2="100" y2="155"/>
    <line x1="205" y1="110" x2="190" y2="145"/>
  </g>
</svg>