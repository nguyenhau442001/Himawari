<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Rumor Packet Gradient (Amber/Orange Warning) -->
    <linearGradient id="rumor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="city-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: Room Interior & Window -->
  <g id="environment">
    <!-- Window backdrop showing dark night city -->
    <rect x="150" y="25" width="65" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <rect x="155" y="30" width="55" height="75" fill="url(#city-glow)" />
    <!-- City lights through window -->
    <rect x="162" y="50" width="8" height="12" fill="#f59e0b" opacity="0.6" />
    <rect x="175" y="40" width="10" height="20" fill="#38bdf8" opacity="0.4" />
    <rect x="190" y="65" width="12" height="15" fill="#f59e0b" opacity="0.3" />
    <rect x="165" y="75" width="15" height="25" fill="#38bdf8" opacity="0.5" />
    <!-- Window frame crossbars -->
    <line x1="155" y1="67" x2="210" y2="67" stroke="#334155" stroke-width="2" />
    <line x1="182" y1="30" x2="182" y2="105" stroke="#334155" stroke-width="2" />

    <!-- Wall Shelf with Prop (Plant) -->
    <rect x="20" y="35" width="50" height="4" rx="2" fill="#475569" />
    <!-- Plant pot -->
    <path d="M35 35 L38 25 L52 25 L55 35 Z" fill="#64748b" />
    <!-- Plant leaves -->
    <path d="M45 25 C45 15, 35 15, 40 25 Z" fill="#10b981" />
    <path d="M45 25 C55 12, 60 20, 48 25 Z" fill="#059669" />
    <path d="M45 25 C38 18, 30 22, 42 25 Z" fill="#34d399" />

    <!-- Desk / Table Surface -->
    <rect x="15" y="165" width="210" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <path d="M15 165 L225 165 L215 155 L25 155 Z" fill="#334155" opacity="0.4" />
    <!-- Desk lamp base & arm -->
    <ellipse cx="195" cy="155" rx="12" ry="4" fill="#64748b" />
    <path d="M195 155 L180 120 L170 120" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M165 110 L180 125 L173 128 L158 113 Z" fill="#94a3b8" />
    <!-- Lamp light cone on desk -->
    <polygon points="168,125 120,200 200,200" fill="#fef08a" opacity="0.08" />
  </g>

  <!-- Digital Equipment (Computer Setup) -->
  <g id="computer-setup" filter="url(#soft-shadow)">
    <!-- Monitor Stand -->
    <rect x="90" y="140" width="20" height="18" fill="#475569" />
    <ellipse cx="100" cy="158" rx="22" ry="4" fill="#334155" />
    
    <!-- Monitor Body -->
    <rect x="45" y="70" width="110" height="72" rx="6" fill="#1e293b" stroke="#475569" stroke-width="3" />
    <!-- Screen Surface -->
    <rect x="50" y="75" width="100" height="62" rx="3" fill="url(#screen-glow)" />
    
    <!-- UI elements on screen (Network Nodes / Rumor Spread Visualization) -->
    <g opacity="0.8">
      <!-- Central node (Source) -->
      <circle cx="100" cy="106" r="6" fill="#f43f5e" filter="url(#glow)" />
      <!-- Spreading waves / network lines -->
      <circle cx="100" cy="106" r="16" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="100" cy="106" r="26" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.7" />
      
      <!-- Connected satellite nodes (spreading out) -->
      <line x1="100" y1="106" x2="70" y2="88" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="70" cy="88" r="4" fill="#fbbf24" />
      
      <line x1="100" y1="106" x2="135" y2="90" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="135" cy="90" r="4" fill="#fbbf24" />

      <line x1="100" y1="106" x2="125" y2="125" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="125" cy="125" r="4" fill="#fbbf24" />

      <line x1="100" y1="106" x2="75" y2="120" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="75" cy="120" r="4" fill="#fbbf24" />
    </dict>

    <!-- Keyboard -->
    <rect x="75" y="162" width="50" height="14" rx="2" fill="#475569" />
    <line x1="80" y1="166" x2="120" y2="166" stroke="#1e293b" stroke-width="1" />
    <line x1="80" y1="170" x2="120" y2="170" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Flying Rumor Packets / Information Particles (Visualizing "散布" - spreading) -->
  <g id="rumor-particles" filter="url(#glow)">
    <!-- Packet 1 (Near monitor to air) -->
    <g transform="translate(130, 75) rotate(15)">
      <rect width="18" height="12" rx="2" fill="url(#rumor-grad)" />
      <path d="M2 3 L9 8 L16 3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Packet 2 (Floating higher towards window) -->
    <g transform="translate(160, 50) rotate(-25)">
      <rect width="14" height="10" rx="2" fill="url(#rumor-grad)" opacity="0.9" />
      <path d="M2 2.5 L7 6.5 L12 2.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Packet 3 (Floating far right upper corner) -->
    <g transform="translate(200, 35) rotate(10) scale(0.8)">
      <rect width="14" height="10" rx="2" fill="url(#rumor-grad)" opacity="0.7" />
      <path d="M2 2.5 L7 6.5 L12 2.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Packet 4 (Emanating from keyboard/hands) -->
    <g transform="translate(105, 135) rotate(-10) scale(0.7)">
      <rect width="14" height="10" rx="2" fill="url(#rumor-grad)" opacity="0.8" />
      <path d="M2 2.5 L7 6.5 L12 2.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Main Character (The person spreading rumors online) -->
  <g id="character" filter="url(#soft-shadow)">
    <!-- Torso & Shoulders -->
    <path d="M70 210 C70 175, 120 175, 120 210 Z" fill="url(#shirt-grad)" />
    
    <!-- Neck -->
    <rect x="91" y="145" width="18" height="20" fill="#fcd34d" />
    
    <!-- Head -->
    <circle cx="100" cy="125" r="22" fill="#fcd34d" />
    
    <!-- Hair (Dark, stylized modern haircut) -->
    <path d="M78 120 C78 102, 122 102, 122 120 C122 125, 120 122, 118 115 C112 108, 88 108, 82 115 C80 122, 78 125, 78 120 Z" fill="#1e293b" />
    <path d="M80 115 L86 128 L92 116 Z" fill="#1e293b" />

    <!-- Facial Expression (Shifty/focused, typing with intent) -->
    <!-- Eyes (Focused to the front/slightly down) -->
    <circle cx="92" cy="124" r="2.5" fill="#1e293b" />
    <circle cx="108" cy="124" r="2.5" fill="#1e293b" />
    <!-- Eyebrows (Slightly slanted scheming/intense look) -->
    <line x1="88" y1="119" x2="96" y2="121" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="104" y1="121" x2="112" y2="119" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Smirk / Mouth -->
    <path d="M94.5 133 Q100 137 105.5 133" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arms & Hands typing -->
    <!-- Left Arm -->
    <path d="M75 185 C65 175, 75 160, 85 155" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
    <!-- Right Arm (Reaching forward actively) -->
    <path d="M115 185 C125 175, 115 155, 105 150" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="85" cy="155" r="5" fill="#fcd34d" />
    <circle cx="105" cy="150" r="5" fill="#fcd34d" />
  </g>

  <!-- Foreground Atmospheric Elements (Subtle depth overlay) -->
  <g id="foreground-accents" opacity="0.3">
    <circle cx="25" cy="200" r="2" fill="#38bdf8" />
    <circle cx="220" cy="190" r="3" fill="#f59e0b" />
    <circle cx="210" cy="220" r="1.5" fill="#38bdf8" />
  </g>
</svg>