<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#2D343E"/>
  
  <!-- Student Character (Upper body) -->
  <g>
    <!-- Arms/Action -->
    <path d="M70 160 L90 120 L110 140" stroke="#FFB84D" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M170 160 L150 120 L130 140" stroke="#FFB84D" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Body -->
    <path d="M80 240 Q120 150 160 240" fill="#4A5568"/>
    
    <!-- Head -->
    <circle cx="120" cy="110" r="25" fill="#FFD1A9"/>
    
    <!-- Hair -->
    <path d="M95 110 Q120 80 145 110" fill="#2D343E"/>
    
    <!-- Focused Eyes -->
    <line x1="108" y1="105" x2="114" y2="105" stroke="#1A1D24" stroke-width="2"/>
    <line x1="126" y1="105" x2="132" y2="105" stroke="#1A1D24" stroke-width="2"/>
  </g>
  
  <!-- Study Materials (The "Preparation" aspect) -->
  <g>
    <!-- Open Book -->
    <path d="M90 140 L150 140 L160 160 L80 160 Z" fill="#E2E8F0"/>
    <line x1="120" y1="140" x2="120" y2="160" stroke="#CBD5E0" stroke-width="2"/>
    
    <!-- Pen/Pencil -->
    <rect x="135" y="130" width="20" height="4" rx="2" fill="#FFB84D" transform="rotate(-20 145 132)"/>
  </g>
  
  <!-- Motion/Focus Lines -->
  <path d="M120 70 L120 85" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 90 L160 80" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 90 L80 80" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
</svg>