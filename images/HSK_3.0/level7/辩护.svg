<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Courtroom Bench/Table -->
  <rect x="20" y="150" width="200" height="60" rx="4" fill="#334155"/>
  <rect x="25" y="155" width="190" height="10" fill="#475569"/>
  
  <!-- Lawyer -->
  <g transform="translate(140, 80)">
    <path d="M20 20 C20 10 30 5 40 5 C50 5 60 10 60 20 L60 50 L20 50 Z" fill="#f59e0b"/>
    <rect x="25" y="50" width="30" height="70" fill="#f59e0b"/>
    <circle cx="40" cy="15" r="15" fill="#fde68a"/>
    <path d="M30 60 L10 90 M50 60 L70 90" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Defendant -->
  <g transform="translate(40, 100)">
    <rect x="10" y="50" width="40" height="60" rx="5" fill="#94a3b8"/>
    <circle cx="30" cy="35" r="15" fill="#cbd5e1"/>
    <path d="M25 30 L27 32 M33 30 L35 32" stroke="#475569" stroke-width="2"/>
    <path d="M25 40 Q30 43 35 40" stroke="#475569" stroke-width="2" fill="none"/>
  </g>

  <!-- Legal Documents -->
  <rect x="150" y="160" width="30" height="40" fill="#f1f5f9" rx="2"/>
  <path d="M155 170 H175 M155 180 H170" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Gavel -->
  <rect x="190" y="165" width="20" height="5" fill="#fb923c"/>
  <rect x="197" y="155" width="6" height="25" fill="#fb923c"/>
  
  <!-- Ambient lighting/accents -->
  <circle cx="200" cy="40" r="30" fill="#38bdf8" opacity="0.05"/>
  <path d="M100 140 L130 110" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
