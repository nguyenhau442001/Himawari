<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="speechBubble1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="speechBubble2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior & Environment Elements -->
  <!-- Window & Cityscape Silhouette -->
  <path d="M150 25 L210 25 L210 95 L150 95 Z" fill="#090d16" />
  <rect x="155" y="30" width="23" height="60" fill="url(#windowGlow)" />
  <rect x="182" y="30" width="23" height="60" fill="url(#windowGlow)" />
  <!-- City building outside -->
  <rect x="160" y="60" width="8" height="35" fill="#1e293b" opacity="0.6" />
  <rect x="172" y="50" width="10" height="45" fill="#1e293b" opacity="0.6" />
  <rect x="188" y="70" width="12" height="25" fill="#1e293b" opacity="0.6" />
  
  <!-- Bookshelf Background -->
  <rect x="20" y="35" width="40" height="70" fill="#111827" rx="2" />
  <rect x="23" y="50" width="34" height="2" fill="#334155" />
  <rect x="23" y="70" width="34" height="2" fill="#334155" />
  <rect x="26" y="42" width="6" height="8" fill="#f43f5e" rx="1" />
  <rect x="34" y="40" width="5" height="10" fill="#38bdf8" rx="1" />
  <rect x="41" y="43" width="8" height="7" fill="#fbbf24" rx="1" />
  <rect x="26" y="60" width="10" height="10" fill="#10b981" rx="1" />
  <rect x="38" y="58" width="5" height="12" fill="#ec4899" rx="1" />

  <!-- Meeting Room Table -->
  <path d="M10 175 L230 175 L215 210 L25 210 Z" fill="url(#deskGrad)" />
  <!-- Desk highlight line -->
  <path d="M15 175 L225 175" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
  <!-- Tabletop props: Laptop, papers, coffee mug -->
  <path d="M100 170 L140 170 L145 185 L95 185 Z" fill="#64748b" />
  <path d="M105 160 L135 160 L140 170 L100 170 Z" fill="#94a3b8" />
  <rect x="112" y="163" width="16" height="6" fill="#0f172a" rx="1" />
  <!-- Coffee Mug -->
  <rect x="75" y="165" width="10" height="13" fill="#f8fafc" rx="2" />
  <path d="M85 168 C88 168 89 171 89 173 C89 175 88 176 85 176" fill="none" stroke="#f8fafc" stroke-width="1.5" />
  <!-- Open Paper/Document -->
  <path d="M155 172 L185 168 L188 182 L158 186 Z" fill="#f1f5f9" />
  <path d="M162 175 L178 173" stroke="#cbd5e1" stroke-width="1" />
  <path d="M162 179 L175 177" stroke="#cbd5e1" stroke-width="1" />

  <!-- Character 1: Opponent / Presenter (Left Side) -->
  <g transform="translate(45, 95)">
    <!-- Body & Torso -->
    <path d="M25 45 C25 30 45 30 55 45 L70 85 L5 85 Z" fill="#3b82f6" />
    <path d="M30 40 L50 40 L45 55 L35 55 Z" fill="#f8fafc" /> <!-- Collar/Shirt -->
    <!-- Head & Face (Profile turned right, speaking) -->
    <circle cx="40" cy="20" r="14" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M26 18 C26 10 34 8 42 10 C50 12 54 18 54 18 C54 18 48 12 40 12 C32 12 28 15 26 18 Z" fill="#1e293b" />
    <!-- Facial features (Expression: Confident / Gesturing point) -->
    <circle cx="46" cy="18" r="1.5" fill="#1e293b" />
    <!-- Open talking mouth -->
    <path d="M46 25 C48 25 49 26 48 27 C47 28 45 27 46 25 Z" fill="#b91c1c" />
    <!-- Raised Arm / Hand pointing gesture -->
    <path d="M55 45 L75 35 L70 30 L50 48 Z" fill="#3b82f6" />
    <circle cx="76" cy="32" r="3.5" fill="#fcd34d" />
  </g>

  <!-- Character 2: The Subject "Ta" - Definitively Rebutting (Right Side) -->
  <g transform="translate(130, 85)">
    <!-- Torso (Lean forward, dynamic) -->
    <path d="M25 55 C25 35 50 35 60 55 L75 95 L10 95 Z" fill="#ef4444" />
    <path d="M32 48 L52 48 L48 60 L36 60 Z" fill="#1e293b" /> <!-- Dark collar/shirt -->
    <!-- Head & Face (Facing left, determined, fierce rebuttal) -->
    <circle cx="40" cy="22" r="14" fill="#ffedd5" />
    <!-- Dynamic Hair (Flying back slightly from intense action) -->
    <path d="M24 20 C24 10 32 8 44 10 C52 12 56 18 56 22 C52 16 44 13 36 14 C30 15 26 18 24 20 Z" fill="#0f172a" />
    <!-- Determined Eyebrow and Eye -->
    <path d="M30 18 L38 20" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <circle cx="34" cy="22" r="1.5" fill="#0f172a" />
    <!-- Firm, decisive mouth -->
    <path d="M30 29 L38 28" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    
    <!-- Active Rebuttal Arm Gesture (Firmly chopping/stopping hand) -->
    <!-- Upper arm -->
    <path d="M15 50 C5 50 0 65 5 75" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" />
    <!-- Forearm striking forward / blocking -->
    <path d="M5 75 L-15 65" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round" />
    <!-- Hand / Palm open pushing back -->
    <circle cx="-17" cy="63" r="4" fill="#ffedd5" />
  </g>

  <!-- Visualizing the Rebuttal (Speech Bubbles & Clash Elements) -->
  <!-- Left Bubble (Initial claim) -->
  <g transform="translate(75, 45)">
    <path d="M 0 15 Q 0 0 15 0 L 55 0 Q 70 0 70 15 L 70 35 Q 70 50 55 50 L 25 50 L 15 62 L 18 50 L 15 50 Q 0 50 0 35 Z" fill="url(#speechBubble1)" filter="url(#glow)" />
    <!-- Abstract debate line icons inside speech bubble (no text) -->
    <path d="M15 18 L45 18" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <path d="M15 28 L35 28" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <circle cx="55" cy="23" r="4" fill="#38bdf8" />
  </g>

  <!-- Right Bubble (The Sharp Rebuttal / Counter-argument - "Fǎnbó") -->
  <g transform="translate(130, 20)">
    <path d="M 15 0 Q 30 0 30 15 L 30 35 Q 30 50 15 50 L -45 50 Q -60 50 -60 35 L -60 15 Q -60 0 -45 0 Z" fill="url(#speechBubble2)" filter="url(#glow)" />
    <!-- Exclamation / Strike icon inside rebuttal bubble -->
    <path d="M-30 15 L-20 35 L-40 35 Z" fill="#f8fafc" />
    <circle cx="-30" cy="42" r="2.5" fill="#f8fafc" />
    <path d="M-10 15 L-2 35" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    <path d="M-2 15 L-10 35" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Impact / Energy Spark between the characters representing direct contradiction -->
  <g transform="translate(115, 80)" filter="url(#glow)">
    <path d="M 0 0 L 10 -15 L 5 -5 L 18 -10 L 8 5 L 20 10 L 5 12 L 0 25 L -5 12 L -20 10 L -8 5 L -18 -10 L -5 -5 L -10 -15 Z" fill="#fbbf24" opacity="0.9" />
    <circle cx="0" cy="0" r="6" fill="#f43f5e" />
  </g>

</svg>