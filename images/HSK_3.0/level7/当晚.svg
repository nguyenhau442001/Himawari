<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Layer: Dark Modern Theme with subtle stage/event ambiance -->
  <g>
    <!-- Deep night window / atmosphere -->
    <path d="M40 50 C40 44.4772 44.4772 40 50 40 L190 40 C195.523 40 200 44.4772 200 50 L200 170 C200 175.523 195.523 180 190 180 L50 180 C44.4772 180 40 175.523 40 170 Z" fill="#222733"/>
    
    <!-- Subtle warm glow from event/banquet lighting inside -->
    <path d="M70 180 L120 100 L170 180 Z" fill="#FFB703" opacity="0.06"/>

    <!-- Scale Contrast Adjective Representation: 
         Contrast between the vast, passing daytime and the precisely focused, specific illuminated night ("that exact night") -->
    <!-- Left side: Faded daytime element (small, muted) -->
    <g opacity="0.3" transform="translate(60, 85)">
      <circle cx="0" cy="0" r="10" fill="#8E9AAF"/>
      <path d="M0 -14 L0 -18 M0 14 L0 18 M-14 0 L-18 0 M14 0 L18 0" stroke="#8E9AAF" stroke-width="2" stroke-linecap="round"/>
      <line x1="-25" y1="25" x2="25" y2="25" stroke="#8E9AAF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Arrow or transition showing the focal shift -->
    <path d="M85 85 Q105 85 115 85" stroke="#FFB703" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.5"/>

    <!-- Right side / Main Focus: "That exact night" (当晚) - Large, prominent, glowing lunar/night event symbol with clock/temporal precision -->
    <g transform="translate(150, 85)">
      <!-- Outer scale exaggeration: Large glowing moon representing the specific night -->
      <circle cx="0" cy="0" r="32" fill="#3A445D"/>
      <path d="M 0 -32 A 32 32 0 1 1 -22.627 22.627 Z" fill="#FFB703" opacity="0.9"/>
      <!-- Soft aura of precision/that specific moment -->
      <circle cx="0" cy="0" r="40" stroke="#FFB703" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.4"/>
    </g>
  </g>

  <!-- Foreground Context: Event Banquet / Celebration setting symbolizing "演出结束的当晚" -->
  <g transform="translate(0, 15)">
    <!-- Stage / Banquet Table silhouette -->
    <path d="M60 160 L180 160 C185.523 160 190 164.477 190 170 L190 174 C190 179.523 185.523 184 180 184 L60 184 C54.4772 184 50 179.523 50 174 L50 170 C50 164.477 54.4772 160 60 160 Z" fill="#2D3748"/>
    
    <!-- Wine glasses / Celebration elements indicating the banquet on that night -->
    <g fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Glass 1 -->
      <path d="M95 138 L105 138 M100 138 L100 152 M94 152 L106 152 M96 130 C96 135 104 135 104 130 Z"/>
      <!-- Glass 2 -->
      <path d="M135 138 L145 138 M140 138 L140 152 M134 152 L146 152 M136 130 C136 135 144 135 144 130 Z"/>
      <!-- Sparkle of celebration -->
      <path d="M120 120 L120 130 M115 125 L125 125" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Temporal / Adjective marker: Clean geometric bracket focusing strictly on the night moment -->
  <g transform="translate(120, 205)">
    <path d="M -70 -10 L -80 -10 L -80 0 L -85 0" stroke="#8E9AAF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 70 -10 L 80 -10 L 80 0 L 85 0" stroke="#8E9AAF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-60" y="-14" width="120" height="8" rx="4" fill="#2D3748"/>
    <circle cx="0" cy="-10" r="3" fill="#FFB703"/>
  </g>
</svg>