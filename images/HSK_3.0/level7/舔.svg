<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Glow filter for the focal action -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB380"/>
      <stop offset="100%" stop-color="#E08B55"/>
    </linearGradient>

    <linearGradient id="dogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
  </defs>

  <!-- Background decorative elements / Flashcard grid accents -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#262B36" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Human Hand (The Object being licked) -->
  <g transform="translate(45, 110) rotate(-15)">
    <!-- Palm & wrist -->
    <path d="M40 70 L90 70 C95 70 100 65 100 60 L100 35 C100 30 95 25 90 25 L80 25 L80 15 C80 10 75 5 70 5 C65 5 60 10 60 15 L60 25 L50 25 L50 10 C50 5 45 0 40 0 C35 0 30 5 30 10 L30 30 L20 30 C15 30 10 35 10 40 L10 55 C10 60 15 65 20 65 Z" fill="url(#handGrad)"/>
    <!-- Fingers anatomical details (subtle knuckles) -->
    <path d="M50 25 L50 45 M60 25 L60 50 M80 25 L80 55" stroke="#D0743E" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Dog Muzzle / Tongue action (Representing "舔" - To lick) -->
  <g transform="translate(100, 75)">
    <!-- Dog snout profile -->
    <path d="M30 35 C20 35 10 45 10 55 C10 65 20 75 35 75 C50 75 70 65 75 50 C80 35 65 25 50 25 Z" fill="url(#dogGrad)"/>
    
    <!-- Dog nose -->
    <ellipse cx="20" cy="48" rx="8" ry="6" fill="#1A1D24"/>
    <ellipse cx="18" cy="46" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>

    <!-- Happy curved eye -->
    <path d="M40 22 C43 17 50 17 53 22" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

    <!-- The Tongue (Focal Point with gold accent) -->
    <g filter="url(#glow)">
      <path d="M15 58 C-5 63 -25 75 -35 90 C-40 98 -25 105 -15 95 C2 78 12 68 18 63 Z" fill="#FF5964"/>
      <!-- Tongue highlight -->
      <path d="M0 75 C-10 82 -20 89 -28 96" fill="none" stroke="#FFA69E" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Saliva / Interaction sparkle effect (modern UI touch) -->
  <g transform="translate(65, 125)">
    <circle cx="0" cy="0" r="4" fill="#FFD166" filter="url(#glow)"/>
    <path d="M-6 8 C -2 6, 2 6, 6 8" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(85, 140)">
    <circle cx="0" cy="0" r="2.5" fill="#FFD166"/>
  </g>
</svg>