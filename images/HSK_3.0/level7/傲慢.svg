<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Character illustrating 傲慢 (Arrogance/Haughtiness) -->
  <g transform="translate(0, 5)">
    <!-- Elevated figure standing proudly, chin up -->
    <!-- Head tilted slightly upward -->
    <circle cx="120" cy="72" r="22" fill="#E2E8F0" />
    <!-- Hair -->
    <path d="M 98 68 Q 120 44 142 68 Q 140 54 120 50 Q 100 54 98 68 Z" fill="#F59E0B" />
    
    <!-- Face features: Closed confident/arrogant eyes (slanted lines indicating looking down on others) -->
    <path d="M 110 70 L 118 72" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 122 72 L 130 70" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 116 82 Q 120 85 124 82" stroke="#1A1D24" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Neck & Shoulders (Tailored suit with high collar) -->
    <path d="M 112 94 L 128 94 L 134 130 L 106 130 Z" fill="#3B82F6" />
    
    <!-- Suit Jacket -->
    <path d="M 70 200 L 95 125 L 120 145 L 145 125 L 170 200 Z" fill="#1E293B" />
    
    <!-- Inner Shirt & Gold Tie -->
    <polygon points="120,132 113,125 127,125" fill="#FFFFFF" />
    <polygon points="120,132 117,138 120,175 123,138" fill="#F59E0B" />

    <!-- Crossed Arms (Classic posture of superiority/dismissal) -->
    <!-- Left Arm -->
    <path d="M 95 125 Q 75 145 100 165 L 125 150 Z" fill="#1E293B" />
    <circle cx="100" cy="163" r="10" fill="#E2E8F0" />
    
    <!-- Right Arm -->
    <path d="M 145 125 Q 165 145 140 165 L 115 150 Z" fill="#334155" />
    <circle cx="140" cy="163" r="10" fill="#CBD5E1" />
  </g>

  <!-- Accent elements representing "Looking down on others" (Downward angled geometric perspective lines) -->
  <line x1="50" y1="190" x2="190" y2="190" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
</svg>