<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Scale representing the balance of praise and criticism -->
  <!-- Base -->
  <path d="M120 190 L120 160 M90 190 L150 190" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Beam -->
  <path d="M70 100 L170 100" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Left side (Praise - Gold/Upward) -->
  <path d="M70 100 L50 70" stroke="#E2E8F0" stroke-width="3"/>
  <circle cx="50" cy="70" r="15" fill="#F6AD55"/>
  <path d="M45 65 L55 75 M55 65 L45 75" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right side (Criticism - Slate/Downward) -->
  <path d="M170 100 L190 130" stroke="#E2E8F0" stroke-width="3"/>
  <circle cx="190" cy="130" r="15" fill="#718096"/>
  <path d="M185 125 L195 135 M195 125 L185 135" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Central Pivot -->
  <circle cx="120" cy="100" r="6" fill="#E2E8F0"/>
</svg>