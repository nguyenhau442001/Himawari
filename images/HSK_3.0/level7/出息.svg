<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Spotlight -->
  <circle cx="120" cy="90" r="110" fill="url(#spotlight)" />

  <!-- Room Interior Background -->
  <!-- Wallpaper / Back wall -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" />
  <!-- Window Frame in Background -->
  <rect x="35" y="35" width="45" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- Window Light -->
  <polygon points="37,37 78,37 78,93 37,93" fill="url(#windowLight)" />
  <!-- Window Crossbars -->
  <line x1="57" y1="37" x2="57" y2="93" stroke="#334155" stroke-width="1.5" />
  <line x1="37" y1="65" x2="78" y2="65" stroke="#334155" stroke-width="1.5" />

  <!-- Bookshelf / Props on Wall -->
  <rect x="150" y="40" width="55" height="8" rx="2" fill="#475569" />
  <!-- Colorful books -->
  <rect x="156" y="22" width="8" height="18" rx="1" fill="#ec4899" />
  <rect x="165" y="20" width="10" height="20" rx="1" fill="#38bdf8" />
  <rect x="176" y="25" width="7" height="15" rx="1" fill="#10b981" />

  <!-- Cork board with drawings/certificates -->
  <rect x="90" y="35" width="45" height="35" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="96" y="41" width="14" height="10" rx="1" fill="#f8fafc" />
  <circle cx="103" cy="46" r="3" fill="#ef4444" />
  <rect x="114" y="43" width="15" height="18" rx="1" fill="#fef08a" />
  <!-- Pin -->
  <circle cx="121" cy="41" r="1.5" fill="#f43f5e" />

  <!-- Wooden Study Desk -->
  <path d="M 20 170 L 220 170 L 210 205 L 30 205 Z" fill="url(#woodGrad)" />
  <rect x="25" y="165" width="190" height="7" rx="2" fill="#475569" />

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M 140 167 L 180 167 L 185 171 L 135 171 Z" fill="#64748b" />
  <path d="M 142 145 L 178 145 L 180 167 L 140 167 Z" fill="#94a3b8" />
  <rect x="146" y="149" width="28" height="14" rx="1" fill="#0f172a" />
  <circle cx="160" cy="156" r="3" fill="#38bdf8" opacity="0.6" />

  <!-- Glowing Trophy (Symbol of Future Success / 出息) -->
  <g transform="translate(100, 115)">
    <!-- Trophy Glow -->
    <circle cx="10" cy="20" r="22" fill="#fbbf24" opacity="0.15" />
    <!-- Base -->
    <rect x="2" y="42" width="16" height="5" rx="1" fill="#334155" />
    <path d="M 5 36 L 15 36 L 14 42 L 6 42 Z" fill="#64748b" />
    <!-- Cup Body -->
    <path d="M 3 15 C 3 32, 17 32, 17 15 Z" fill="url(#goldGrad)" />
    <!-- Handles -->
    <path d="M 3 18 C -2 18, -2 27, 3 27" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 17 18 C 22 18, 22 27, 17 27" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Star on Trophy -->
    <polygon points="10,20 11.5,23.5 15,24 12.5,26.5 13,30 10,28.2 7,30 7.5,26.5 5,24 8.5,23.5" fill="#fff" opacity="0.9" />
  </g>

  <!-- Stack of books on desk -->
  <rect x="45" y="157" width="30" height="4" rx="1" fill="#38bdf8" />
  <rect x="43" y="161" width="34" height="4" rx="1" fill="#ec4899" />
  <rect x="46" y="165" width="28" height="4" rx="1" fill="#10b981" />

  <!-- Main Character: Ambitious Young Student/Child -->
  <g transform="translate(0, 5)">
    <!-- Body & Hoodie -->
    <!-- Torso -->
    <path d="M 75 140 C 75 125, 105 125, 105 140 L 115 175 C 115 175, 90 180, 65 175 Z" fill="#10b981" />
    <!-- Hoodie Pocket -->
    <path d="M 80 155 L 100 155 L 98 170 L 82 170 Z" fill="#059669" />
    <!-- Hoodie Strings -->
    <line x1="85" y1="133" x2="85" y2="145" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
    <line x1="95" y1="133" x2="95" y2="145" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms / Hands -->
    <!-- Left arm resting on desk -->
    <path d="M 75 135 L 55 155 L 60 162 L 78 145 Z" fill="#10b981" />
    <circle cx="56" cy="160" r="5" fill="#fbcfe8" />

    <!-- Right arm raised excitedly pointing at trophy -->
    <path d="M 105 135 L 122 115 L 130 120 L 112 145 Z" fill="#10b981" />
    <circle cx="125" cy="112" r="5" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="85" y="118" width="20" height="12" fill="#fbcfe8" />

    <!-- Head & Face -->
    <circle cx="95" cy="100" r="22" fill="#fbcfe8" />

    <!-- Hair (Stylish dark anime/cartoon hair) -->
    <path d="M 73 95 C 73 75, 117 75, 117 95 C 117 100, 112 95, 110 88 C 105 78, 85 78, 80 88 C 76 95, 73 95, 73 95 Z" fill="#334155" />
    <path d="M 74 95 L 70 102 L 77 101 Z" fill="#334155" />
    <path d="M 116 95 L 121 101 L 115 103 Z" fill="#334155" />

    <!-- Facial Expression: Big Confident Smile & Sparkling Eyes -->
    <!-- Eyes (Happy arcs with sparkles) -->
    <circle cx="87" cy="98" r="3" fill="#1e293b" />
    <circle cx="103" cy="98" r="3" fill="#1e293b" />
    <!-- Eye highlights -->
    <circle cx="88" cy="97" r="1" fill="#ffffff" />
    <circle cx="104" cy="97" r="1" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <circle cx="84" cy="104" r="3.5" fill="#fb7185" opacity="0.5" />
    <circle cx="106" cy="104" r="3.5" fill="#fb7185" opacity="0.5" />

    <!-- Big Ambitious Open Smile -->
    <path d="M 89 105 Q 95 113 101 105" fill="#1e293b" />
    <path d="M 91 107 Q 95 111 99 107" fill="#f43f5e" />
  </g>

  <!-- Proud Parent / Mentor Figure standing behind -->
  <g transform="translate(0, 0)">
    <!-- Body / Suit Jacket -->
    <path d="M 145 140 C 145 115, 185 115, 185 140 L 195 210 L 135 210 Z" fill="#3b82f6" />
    <!-- Inner Shirt & Tie -->
    <path d="M 160 125 L 170 125 L 173 150 L 157 150 Z" fill="#f8fafc" />
    <polygon points="165,130 162,155 168,155" fill="#ef4444" />
    <!-- Jacket lapels -->
    <path d="M 160 125 L 145 155 L 155 155 Z" fill="#2563eb" />
    <path d="M 170 125 L 185 155 L 175 155 Z" fill="#2563eb" />

    <!-- Supporting Hand on Child's Shoulder -->
    <circle cx="120" cy="132" r="6" fill="#fde047" />

    <!-- Neck -->
    <rect x="157" y="105" width="16" height="22" fill="#fde047" />

    <!-- Head -->
    <circle cx="165" cy="90" r="18" fill="#fde047" />

    <!-- Parent Hair (Gentle neat hair) -->
    <path d="M 148 90 C 148 72, 182 72, 182 90 C 182 92, 178 88, 175 84 C 168 76, 162 76, 155 84 C 150 88, 148 90, 148 90 Z" fill="#1e293b" />

    <!-- Warm Proud Expression (Glasses and Smiling Eyes) -->
    <!-- Glasses -->
    <rect x="154" y="85" width="10" height="7" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="166" y="85" width="10" height="7" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="164" y1="88" x2="166" y2="88" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Smiling closed eyes (Proud look) -->
    <path d="M 156 87 Q 159 90 162 87" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 168 87 Q 171 90 174 87" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Gentle Warm Smile -->
    <path d="M 160 97 Q 165 102 170 97" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Sparkle details indicating bright future / potential ("出息") -->
  <g fill="#fbbf24">
    <path d="M 125 70 Q 125 78 133 78 Q 125 78 125 86 Q 125 78 117 78 Q 125 78 125 70" />
    <path d="M 185 55 Q 185 60 190 60 Q 185 60 185 65 Q 185 60 180 60 Q 185 60 185 55" />
    <path d="M 60 110 Q 60 114 64 114 Q 60 114 60 118 Q 60 114 56 114 Q 60 114 60 110" />
  </g>
</svg>