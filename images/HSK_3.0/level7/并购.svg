<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glowing merge background effect -->
  <circle cx="120" cy="120" r="70" fill="#2D323E" opacity="0.6"/>

  <!-- Motion lines indicating integration and merging action -->
  <g stroke="#3A4252" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-linecap="round">
    <path d="M 65 90 Q 90 90 105 105"/>
    <path d="M 175 150 Q 150 150 135 135"/>
  </g>

  <!-- Left Entity Block (Company A - Professional / Tech) -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="55" height="70" rx="6" fill="#252A34" stroke="#4F5D75" stroke-width="2"/>
    <!-- Abstract server/tech node graphics inside entity A -->
    <circle cx="18" cy="20" r="6" fill="#4F5D75"/>
    <rect x="30" y="16" width="15" height="8" rx="2" fill="#4F5D75"/>
    <rect x="12" y="38" width="31" height="6" rx="2" fill="#3A4252"/>
    <rect x="12" y="50" width="20" height="6" rx="2" fill="#3A4252"/>
  </g>

  <!-- Right Entity Block (Company B - Being acquired/merged) -->
  <g transform="translate(140, 80)">
    <rect x="0" y="0" width="55" height="70" rx="6" fill="#252A34" stroke="#4F5D75" stroke-width="2"/>
    <!-- Abstract tech node graphics inside entity B -->
    <circle cx="37" cy="20" r="6" fill="#4F5D75"/>
    <rect x="10" y="16" width="15" height="8" rx="2" fill="#4F5D75"/>
    <rect x="12" y="38" width="31" height="6" rx="2" fill="#3A4252"/>
    <rect x="23" y="50" width="20" height="6" rx="2" fill="#3A4252"/>
  </g>

  <!-- Dynamic Central Action: Merging & Acquisition (Gold/Orange accent for M&A focus) -->
  <g transform="translate(120, 115)">
    <!-- Central expanding connection core -->
    <circle cx="0" cy="0" r="26" fill="#1A1D24" stroke="#F6AD55" stroke-width="3"/>
    
    <!-- Dynamic converging arrows (Action / Verb) -->
    <path d="M -38 -12 L -20 -12 L -20 -20 L -6 0 L -20 20 L -20 12 L -38 12 Z" fill="#F6AD55" transform="scale(0.65)"/>
    <path d="M 38 12 L 20 12 L 20 20 L 6 0 L 20 -20 L 20 -12 L 38 -12 Z" fill="#F6AD55" transform="scale(0.65)"/>
  </g>

  <!-- Human Hand Interaction (Active Action / Business personnel executing the M&A deal) -->
  <g transform="translate(120, 185)">
    <!-- Cuffs & arms -->
    <path d="M -35 15 L -20 -5 L 20 -5 L 35 15 Z" fill="#2D323E"/>
    <!-- Left Hand placing/joining -->
    <path d="M -22 -5 C -25 -15 -18 -22 -10 -20 C -2 -18 0 -10 -5 -2 Z" fill="#E2E8F0"/>
    <!-- Right Hand completing the handshake/integration -->
    <path d="M 22 -5 C 25 -15 18 -22 10 -20 C 2 -18 0 -10 5 -2 Z" fill="#CBD5E1"/>
    <!-- Secure handshake core icon overlay -->
    <circle cx="0" cy="-12" r="6" fill="#F6AD55"/>
  </g>

  <!-- Sparkle/Success indicators for successful transaction -->
  <g fill="#F6AD55">
    <path d="M 120 42 L 122 48 L 128 50 L 122 52 L 120 58 L 118 52 L 112 50 L 118 48 Z"/>
    <path d="M 75 55 L 76 58 L 79 59 L 76 60 L 75 63 L 74 60 L 71 59 L 74 58 Z" opacity="0.7"/>
    <path d="M 165 55 L 166 58 L 169 59 L 166 60 L 165 63 L 164 60 L 161 59 L 164 58 Z" opacity="0.7"/>
  </g>
</svg>