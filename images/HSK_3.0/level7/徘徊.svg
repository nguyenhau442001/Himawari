<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Streetlamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Store Window Glow -->
    <linearGradient id="storeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Neon Sign Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Distant City Skyline / Buildings -->
  <path d="M0 150 L30 150 L30 110 L50 110 L50 150 L80 150 L80 90 L110 90 L110 150 L140 150 L140 100 L170 100 L170 150 L210 150 L210 120 L240 120 L240 210 L0 210 Z" fill="#090d16" opacity="0.7"/>
  
  <!-- Windows on background buildings (lit) -->
  <rect x="36" y="120" width="8" height="10" rx="1" fill="#fbbf24" opacity="0.4"/>
  <rect x="90" y="105" width="8" height="12" rx="1" fill="#38bdf8" opacity="0.3"/>
  <rect x="102" y="105" width="8" height="12" rx="1" fill="#38bdf8" opacity="0.3"/>
  <rect x="150" y="115" width="10" height="14" rx="1" fill="#fbbf24" opacity="0.3"/>

  <!-- Store / Cafe on Corner (Left) -->
  <rect x="0" y="130" width="75" height="80" fill="#1e1b4b"/>
  <!-- Store Window -->
  <rect x="10" y="145" width="55" height="50" rx="2" fill="url(#storeGlow)" stroke="#312e81" stroke-width="2"/>
  <path d="M37 145 L37 195" stroke="#312e81" stroke-width="2"/>
  <!-- Awning -->
  <path d="M-5 135 L80 135 L75 145 L-5 145 Z" fill="#f43f5e"/>
  <path d="M10 145 L15 135 M25 145 L30 135 M40 145 L45 135 M55 145 L60 135" stroke="#ffe4e6" stroke-width="2"/>

  <!-- Building on Right -->
  <rect x="165" y="120" width="75" height="90" fill="#0f172a"/>
  <rect x="180" y="135" width="16" height="22" rx="2" fill="#38bdf8" opacity="0.2"/>
  <rect x="205" y="135" width="16" height="22" rx="2" fill="#38bdf8" opacity="0.2"/>
  <rect x="180" y="170" width="16" height="22" rx="2" fill="#fbbf24" opacity="0.2"/>
  <rect x="205" y="170" width="16" height="22" rx="2" fill="#fbbf24" opacity="0.2"/>

  <!-- Street Intersection Ground & Sidewalks -->
  <!-- Asphalt Roads -->
  <path d="M0 185 L240 185 L240 240 L0 240 Z" fill="#111827"/>
  <path d="M95 185 L115 130 L135 130 L155 185 Z" fill="#1f2937"/>
  <!-- Vertical Crossroad path -->
  <path d="M95 185 L80 240 L170 240 L155 185 Z" fill="#111827"/>

  <!-- Sidewalk Corners -->
  <path d="M0 185 L75 185 L75 210 L0 225 Z" fill="#334155" stroke="#475569" stroke-width="1"/>
  <path d="M240 185 L165 185 L165 210 L240 225 Z" fill="#334155" stroke="#475569" stroke-width="1"/>

  <!-- Crosswalk Stripes -->
  <g fill="#e2e8f0" opacity="0.7">
    <polygon points="105,190 110,185 125,185 120,190"/>
    <polygon points="112,200 118,195 133,195 127,200"/>
    <polygon points="120,210 126,205 141,205 135,210"/>
    <polygon points="128,220 134,215 149,215 143,220"/>
  </g>

  <!-- Traffic Light Pole & Light -->
  <rect x="155" y="105" width="4" height="85" fill="#475569"/>
  <rect x="150" y="110" width="14" height="30" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <circle cx="157" cy="117" r="3.5" fill="#ef4444" filter="url(#neonGlow)"/>
  <circle cx="157" cy="125" r="3.5" fill="#334155"/>
  <circle cx="157" cy="133" r="3.5" fill="#334155"/>

  <!-- Street Lamp (Left) -->
  <path d="M40 185 L40 110 L50 100" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="100" r="8" fill="#fef08a" filter="url(#neonGlow)"/>
  <!-- Streetlamp Light Cone Overlay -->
  <circle cx="50" cy="100" r="50" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Motion Trails / Pacing Footsteps (Indicating "wandering back and forth" / 徘徊) -->
  <path d="M 95 205 Q 110 200 125 205" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M 125 210 Q 110 215 95 210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Main Subject / Character (Walking back and forth, looking hesitant/pensive) -->
  <g transform="translate(100, 165)">
    <!-- Shadow -->
    <ellipse cx="12" cy="42" rx="14" ry="4" fill="#000000" opacity="0.5"/>

    <!-- Left Leg (stepping back) -->
    <path d="M 8 26 L 4 39" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 4 39 L 1 41" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Leg (planted / forward) -->
    <path d="M 16 26 L 20 38" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 20 38 L 24 40" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Coat / Torso (Pensive traveler silhouette) -->
    <path d="M 8 10 L 20 10 L 24 28 L 4 28 Z" fill="#3b82f6"/>
    <!-- Coat Tails / Fold -->
    <path d="M 6 28 L 22 28 L 19 38 L 9 38 Z" fill="#2563eb"/>
    <!-- Scarf -->
    <path d="M 10 9 C 14 12 18 9 20 7 L 19 13 C 15 15 11 14 9 12 Z" fill="#f43f5e"/>
    <path d="M 17 12 L 18 24" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <circle cx="14" cy="3" r="6" fill="#fde68a"/>
    <path d="M 8 2 C 10 -1 18 -1 20 3 C 20 4 18 2 14 2 C 10 2 8 2 8 2 Z" fill="#475569"/>

    <!-- Arms crossed / hands in pockets (expressing hesitation/wandering) -->
    <!-- Left arm -->
    <path d="M 10 12 L 6 18 L 12 21" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right arm -->
    <path d="M 18 12 L 22 18 L 16 21" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pensive Thought / Question elements subtly implied via mood -->
  <!-- Glowing Street Ambient Sparkles / Dust in light cone -->
  <circle cx="65" cy="120" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="45" cy="135" r="1" fill="#fef08a" opacity="0.6"/>
  <circle cx="75" cy="140" r="1.2" fill="#fef08a" opacity="0.7"/>
  <circle cx="35" cy="110" r="1" fill="#fef08a" opacity="0.5"/>

</svg>