<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Silhouette of a soldier figure representing armed forces -->
  <g transform="translate(70, 50)">
    <!-- Helmet -->
    <path d="M40 10 C20 10, 10 25, 10 45 L70 45 C70 25, 60 10, 40 10 Z" fill="#FFB84D"/>
    <!-- Body/Vest -->
    <path d="M15 50 L65 50 L75 110 L5 110 Z" fill="#FFB84D"/>
    <!-- Gear details -->
    <rect x="25" y="60" width="30" height="10" rx="2" fill="#1A1D24"/>
    <rect x="25" y="75" width="30" height="10" rx="2" fill="#1A1D24"/>
    <!-- Rifle silhouette -->
    <path d="M85 70 L110 70 L110 75 L95 75 L95 100 L85 100 Z" fill="#FFB84D"/>
    <!-- Shoulder detail -->
    <rect x="5" y="50" width="10" height="20" rx="2" fill="#D9963D"/>
    <rect x="65" y="50" width="10" height="20" rx="2" fill="#D9963D"/>
  </g>
</svg>