<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="path-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Environment & Background Elements -->
  <!-- Night Sky & Stars -->
  <circle cx="40" cy="50" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="85" cy="30" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="160" cy="45" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="205" cy="25" r="2" fill="#f8fafc" opacity="0.9"/>
  <circle cx="120" cy="70" r="1" fill="#94a3b8" opacity="0.4"/>

  <!-- Stylized Mountains / Hills -->
  <path d="M-10 160 Q 60 110, 140 140 T 250 130 L 250 240 L -10 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M-10 180 Q 90 130, 200 170 T 250 160 L 250 240 L -10 240 Z" fill="#0f172a"/>

  <!-- Pine Trees / Foliage Context -->
  <path d="M25 150 L35 130 L45 150 Z" fill="#065f46"/>
  <path d="M25 140 L35 120 L45 140 Z" fill="#047857"/>
  <path d="M205 165 L215 145 L225 165 Z" fill="#065f46"/>
  <path d="M210 155 L218 135 L226 155 Z" fill="#047857"/>
  <circle cx="185" cy="175" r="12" fill="#065f46"/>
  <circle cx="55" cy="165" r="10" fill="#047857"/>

  <!-- THE WINDING PATH (曲折 - Qūzhé) -->
  <!-- Subtle Glow under the path -->
  <path d="M 30 220 Q 90 200, 70 160 T 170 120 T 140 70 T 210 50" 
        fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Main Path Surface -->
  <path d="M 30 220 Q 90 200, 70 160 T 170 120 T 140 70 T 210 50" 
        fill="none" stroke="url(#path-grad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Path Stone Details / Texture -->
  <circle cx="65" cy="195" r="1.5" fill="#d97706" opacity="0.8"/>
  <circle cx="75" cy="155" r="1.5" fill="#d97706" opacity="0.8"/>
  <circle cx="110" cy="135" r="1.5" fill="#d97706" opacity="0.8"/>
  <circle cx="160" cy="100" r="1.5" fill="#d97706" opacity="0.8"/>
  <circle cx="145" cy="75" r="1.5" fill="#d97706" opacity="0.8"/>
  <circle cx="185" cy="55" r="1.5" fill="#d97706" opacity="0.8"/>

  <!-- Lantern Pole and Warm Light -->
  <path d="M 50 170 L 50 140" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M 45 140 L 55 140" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 47 140 L 50 135 L 53 140 Z" fill="#fbbf24"/>
  <circle cx="50" cy="143" r="8" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>

  <!-- Traveler / Character Walking the Winding Path -->
  <!-- Character position situated on the lower curve of the path -->
  <g transform="translate(68, 172)">
    <!-- Backpack -->
    <rect x="-7" y="-12" width="6" height="10" rx="2" fill="#38bdf8"/>
    <!-- Body / Jacket -->
    <path d="M-5 -14 L4 -12 L6 0 L-4 0 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="0" cy="-19" r="5" fill="#fcd34d"/>
    <!-- Hat -->
    <path d="M-6 -21 Q0 -25, 6 -21 L5 -20 L-5 -20 Z" fill="#f59e0b"/>
    <!-- Legs walking -->
    <path d="M-3 0 L-6 8" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2 0 L5 7" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arms holding walking stick -->
    <path d="M-4 -10 L-9 -4" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <path d="M-9 -4 L-11 12" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Elements (Depth) -->
  <path d="M0 240 L0 220 Q 20 210, 40 225 T 90 230 L 90 240 Z" fill="#0b0f19" opacity="0.5"/>
  <path d="M180 240 Q 200 220, 240 230 L 240 240 Z" fill="#0b0f19" opacity="0.7"/>

</svg>