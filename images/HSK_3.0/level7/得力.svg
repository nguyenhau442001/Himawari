<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="amberLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Environmental Background Details: Modern Office Interior -->
  <!-- Wallpaper accent lines -->
  <line x1="0" y1="50" x2="240" y2="50" stroke="#334155" stroke-width="2" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="4" />
  
  <!-- Large Office Window in Background with Cityscape Silhouette -->
  <rect x="130" y="30" width="80" height="110" rx="4" fill="url(#windowGlow)" stroke="#475569" stroke-width="2" />
  <!-- Window Panes -->
  <line x1="170" y1="30" x2="170" y2="140" stroke="#475569" stroke-width="1.5" />
  <line x1="130" y1="85" x2="210" y2="85" stroke="#475569" stroke-width="1.5" />
  <!-- City Skyline Silhouette outside window -->
  <path d="M135 140 L135 115 L142 115 L142 140 L150 140 L150 95 L158 95 L158 140 L165 140 L165 105 L175 105 L175 140 L185 140 L185 85 L195 85 L195 140 L205 140 L205 100 L208 100 L208 140 Z" fill="#1e293b" opacity="0.7" />

  <!-- Bookshelf on left -->
  <rect x="15" y="45" width="35" height="95" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="2" />
  <line x1="15" y1="75" x2="50" y2="75" stroke="#334155" stroke-width="1.5" />
  <line x1="15" y1="105" x2="50" y2="105" stroke="#334155" stroke-width="1.5" />
  <!-- Colored books on shelf -->
  <rect x="19" y="55" width="6" height="20" fill="#38bdf8" rx="1" />
  <rect x="27" y="53" width="8" height="22" fill="#ec4899" rx="1" />
  <rect x="37" y="58" width="5" height="17" fill="#fbbf24" rx="1" />
  <rect x="19" y="85" width="7" height="20" fill="#10b981" rx="1" />
  <rect x="28" y="88" width="6" height="17" fill="#fb923c" rx="1" />

  <!-- Hanging Pendant Light with Warm Glow -->
  <path d="M90 0 L90 25" stroke="#64748b" stroke-width="2" />
  <path d="M75 25 L105 25 L100 35 L80 35 Z" fill="#64748b" />
  <polygon points="60,200 120,40 180,200" fill="url(#amberLight)" />
  <circle cx="90" cy="35" r="5" fill="#fbbf24" />

  <!-- Office Desk -->
  <path d="M20 160 L220 160 L210 205 L30 205 Z" fill="url(#deskGrad)" filter="url(#softShadow)" />
  <!-- Desk front panel for 3D depth -->
  <rect x="30" y="205" width="180" height="15" fill="#334155" rx="2" />

  <!-- Props on Desk: Laptop, Documents, Coffee Mug, Plant -->
  <!-- Laptop base & screen -->
  <path d="M145 155 L195 155 L205 170 L135 170 Z" fill="#94a3b8" />
  <path d="M140 135 L190 135 L195 156 L135 156 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
  <!-- Screen content simulation (charts/graphs) -->
  <rect x="144" y="140" width="42" height="12" fill="#0f172a" rx="1" />
  <polyline points="147,149 153,144 159,147 165,142 171,146 177,141" fill="none" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Stack of Documents / Charts with colorful graphs -->
  <rect x="75" y="162" width="35" height="25" fill="#f8fafc" rx="1" transform="rotate(-5 75 162)" filter="url(#softShadow)" />
  <line x1="80" y1="170" x2="100" y2="167" stroke="#38bdf8" stroke-width="2" />
  <line x1="80" y1="176" x2="95" y2="173" stroke="#10b981" stroke-width="2" />

  <!-- Coffee Mug -->
  <rect x="50" y="160" width="14" height="18" fill="#ec4899" rx="2" />
  <path d="M64 164 C68 164 68 172 64 174" fill="none" stroke="#ec4899" stroke-width="2" />

  <!-- Small Desk Plant in Pot -->
  <path d="M200 150 C200 145 208 145 208 150 Z" fill="#10b981" />
  <path d="M203 145 C200 138 206 135 204 130 C208 135 210 142 206 145 Z" fill="#10b981" />
  <rect x="198" y="150" width="14" height="15" fill="#f1f5f9" rx="2" />


  <!-- CHARACTER 1: The Boss / Manager (Standing in background/side, gesturing appreciatively) -->
  <g transform="translate(15, 75)">
    <!-- Body / Suit -->
    <path d="M35 50 L55 50 L60 85 L30 85 Z" fill="#1e293b" />
    <path d="M40 50 L45 75 L50 50 Z" fill="#f8fafc" /> <!-- Shirt V -->
    <!-- Tie -->
    <polygon points="45,52 47,65 45,70 43,65" fill="#ef4444" />
    
    <!-- Head & Hair -->
    <circle cx="45" cy="30" r="14" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M31 30 C31 18 59 18 59 30 C55 24 35 24 31 30 Z" fill="#334155" /> <!-- Hair -->
    <!-- Facial expression: Smiling approvingly -->
    <path d="M41 33 Q45 37 49 33" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="41" cy="28" r="1.5" fill="#1e293b" />
    <circle cx="49" cy="28" r="1.5" fill="#1e293b" />

    <!-- Arm gesturing towards the main assistant -->
    <path d="M55 55 L75 45" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <circle cx="75" cy="45" r="5" fill="#fbcfe8" />
  </g>


  <!-- CHARACTER 2: The Capable Assistant (得力助手) - Main Subject -->
  <g transform="translate(85, 70)" filter="url(#softShadow)">
    <!-- Torso (Professional vest / smart casual blazer) -->
    <path d="M30 60 L70 60 L80 120 L20 120 Z" fill="#0284c7" /> <!-- Professional Blue Blazer -->
    <path d="M40 60 L50 85 L60 60 Z" fill="#f8fafc" /> <!-- Inner white blouse -->
    <!-- Dynamic posture leaning forward slightly, showing competence & readiness -->

    <!-- Head & Hair -->
    <circle cx="50" cy="32" r="16" fill="#fbcfe8" />
    <!-- Modern stylish hair tied back or bob cut -->
    <path d="M34 30 C34 14 66 14 66 30 C66 35 62 48 58 48 C54 48 50 38 50 38 C50 38 46 48 42 48 C38 48 34 35 34 30 Z" fill="#0f172a" />
    
    <!-- Facial expression: Confident, bright, smiling, energetic eyes -->
    <circle cx="44" cy="30" r="2" fill="#0f172a" />
    <circle cx="56" cy="30" r="2" fill="#0f172a" />
    <path d="M44 37 Q50 43 56 37" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="41" cy="34" r="3" fill="#fda4af" opacity="0.6" />
    <circle cx="59" cy="34" r="3" fill="#fda4af" opacity="0.6" />

    <!-- Arms & Active Hands -->
    <!-- Left Arm holding a stylish stylus / pen pointing at tablet/document -->
    <path d="M25 70 Q10 90 25 110" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="25" cy="110" r="5" fill="#fbcfe8" />
    
    <!-- Right Arm actively typing or organizing -->
    <path d="M75 70 Q90 95 75 115" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="75" cy="115" r="5" fill="#fbcfe8" />
  </g>

  <!-- Floating Sparkles / Success Indicators (Highlighting 'capable / 得力' achievement) -->
  <g transform="translate(115, 55)">
    <path d="M0 10 L5 5 L10 10 L5 15 Z" fill="#fbbf24" />
    <path d="M25 0 L28 -3 L31 0 L28 3 Z" fill="#38bdf8" />
    <path d="M20 25 L23 22 L26 25 L23 28 Z" fill="#10b981" />
  </g>
  <g transform="translate(45, 95)">
    <path d="M0 0 L4 -4 L8 0 L4 4 Z" fill="#fbbf24" />
  </g>
</svg>