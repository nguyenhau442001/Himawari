<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (subtle sci-fi lab rays/glow representing scientific excellence) -->
  <circle cx="120" cy="115" r="70" fill="#252D3D" opacity="0.5"/>
  <path d="M120 40 L120 190 M45 115 L195 115" stroke="#2D3748" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Glowing halo / stage spotlight behind the award -->
  <circle cx="120" cy="115" r="50" fill="url(#goldGlow)" opacity="0.3"/>

  <!-- Definitions for gradients -->
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>

  <!-- Scientific Laurel Wreath (representing achievement & research) -->
  <g transform="translate(120, 115)">
    <!-- Left Leaves -->
    <path d="M -30 25 C -50 15 -60 -10 -50 -35 C -45 -45 -35 -55 -20 -60" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
    <path d="M-38 -5 C-50 -10 -55 -25 -50 -35 C-42 -25 -40 -12 -38 -5Z" fill="#66BB6A"/>
    <path d="M-30 20 C-45 15 -52 0 -48 -12 C-40 -5 -35 10 -30 20Z" fill="#66BB6A"/>
    <path d="M-20 45 C-35 45 -45 30 -42 18 C-35 25 -25 35 -20 45Z" fill="#66BB6A"/>

    <!-- Right Leaves -->
    <path d="M 30 25 C 50 15 60 -10 50 -35 C 45 -45 35 -55 20 -60" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 -5 C50 -10 55 -25 50 -35 C42 -25 40 -12 38 -5Z" fill="#66BB6A"/>
    <path d="M30 20 C45 15 52 0 48 -12 C40 -5 35 10 30 20Z" fill="#66BB6A"/>
    <path d="M20 45 C35 45 45 30 42 18 C35 25 25 35 20 45Z" fill="#66BB6A"/>
  </g>

  <!-- Trophy / Award Object (Centerpiece representing 当之无愧 - well-deserved highest award) -->
  <g transform="translate(120, 105)">
    <!-- Base -->
    <path d="M-22 55 L22 55 L18 68 L-18 68 Z" fill="#374151"/>
    <rect x="-28" y="68" width="56" height="8" rx="2" fill="#4B5563"/>

    <!-- Stem -->
    <rect x="-6" y="32" width="12" height="23" fill="url(#goldGrad)"/>

    <!-- Handles -->
    <path d="M-18 0 C-32 0 -32 28 -14 26" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 0 C32 0 32 28 14 26" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Cup Body -->
    <path d="M-20 -20 L20 -20 C22 15 15 35 0 38 C-15 35 -22 15 -20 -20 Z" fill="url(#cupGrad)"/>
    <!-- Inner Cup Shade -->
    <path d="M-17 -20 L17 -20 C18 10 12 28 0 30 C-12 28 -18 10 -17 -20 Z" fill="#FFA000" opacity="0.3"/>

    <!-- Scientific Atom Symbol on Trophy (indicating National Science & Tech Award) -->
    <g transform="translate(0, 5) scale(0.6)">
      <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" transform="rotate(30)" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" transform="rotate(-30)" opacity="0.9"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Star on top of Trophy -->
    <path d="M0 -36 L3 -27 L12 -27 L5 -22 L8 -13 L0 -18 L-8 -13 L-5 -22 L-12 -27 L-3 -27 Z" fill="#FFFFFF"/>
  </g>

  <!-- Red Honor Ribbon cascading down the trophy base -->
  <g transform="translate(120, 135)">
    <path d="M-6 0 C-15 10 -20 25 -25 38 L-15 42 C-10 30 -5 20 0 15 Z" fill="url(#ribbonGrad)"/>
    <path d="M6 0 C15 10 20 25 25 38 L15 42 C10 30 5 20 0 15 Z" fill="#D32F2F"/>
  </g>

  <!-- Sparkles / Excellence indicators -->
  <g fill="#FFD700">
    <path d="M 65 75 Q 65 65 55 65 Q 65 65 65 55 Q 65 65 75 65 Q 65 65 65 75 Z"/>
    <path d="M 175 75 Q 175 65 185 65 Q 175 65 175 55 Q 175 65 165 65 Q 175 65 175 75 Z"/>
    <circle cx="85" cy="140" r="2.5" opacity="0.8"/>
    <circle cx="155" cy="140" r="2.5" opacity="0.8"/>
    <circle cx="100" cy="45" r="2" opacity="0.9"/>
    <circle cx="140" cy="45" r="1.5" opacity="0.7"/>
  </g>

</svg>