<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle lighting focus -->
  <circle cx="120" cy="120" r="80" fill="#222732"/>

  <!-- Hands representing the person (小心翼翼 - extremely careful handling) -->
  <!-- Left Hand -->
  <path d="M70,150 C65,145 60,135 65,125 C68,118 75,115 80,120 L95,135 Z" fill="#E8B4A2" stroke="#1A1D24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80,120 L95,135 L85,155 Z" fill="#D49B86"/>

  <!-- Right Hand -->
  <path d="M170,150 C175,145 180,135 175,125 C172,118 165,115 160,120 L145,135 Z" fill="#E8B4A2" stroke="#1A1D24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M160,120 L145,135 L155,155 Z" fill="#D49B86"/>

  <!-- Fingers gently lifting/holding the vase from below -->
  <path d="M90,140 C95,135 105,133 112,135 C115,136 115,140 110,142 C102,145 95,146 90,140 Z" fill="#D49B86"/>
  <path d="M150,140 C145,135 135,133 128,135 C125,136 125,140 130,142 C138,145 145,146 150,140 Z" fill="#D49B86"/>

  <!-- The Precious Vase (Object of care) -->
  <!-- Vase Shadow/Glow -->
  <ellipse cx="120" cy="182" rx="22" ry="6" fill="#111418"/>

  <!-- Vase Body -->
  <path d="M108,70 L132,70 C134,70 135,72 134,74 L129,85 C127,90 131,95 136,100 C144,107 151,118 147,135 C142,157 132,175 120,178 C108,175 98,157 93,135 C89,118 96,107 104,100 C109,95 113,90 111,85 L106,74 C105,72 106,70 108,70 Z" fill="#3B82F6" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>

  <!-- Vase Neck Highlight -->
  <path d="M110,73 L130,73 L127,82 L113,82 Z" fill="#60A5FA" opacity="0.4"/>

  <!-- Vase Decorative Pattern / Accent -->
  <path d="M98,125 C110,132 130,132 142,125 C145,138 138,155 120,165 C102,155 95,138 98,125 Z" fill="#2563EB" opacity="0.6"/>

  <!-- Vase Specular Highlight (Glass sheen) -->
  <path d="M103,105 C100,112 100,125 104,138 C105,141 103,143 101,141 C96,126 96,112 100,103 C101,101 104,102 103,105 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Delicate Flower inside the Vase -->
  <!-- Stem -->
  <path d="M120,70 L120,45" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Leaves -->
  <path d="M120,60 C113,58 108,62 108,65 C108,68 115,68 120,60 Z" fill="#10B981"/>
  <path d="M120,53 C127,51 132,55 132,58 C132,61 125,61 120,53 Z" fill="#10B981"/>

  <!-- Flower Blossom (Gold/Orange Accent for Focus) -->
  <circle cx="120" cy="40" r="4" fill="#F59E0B"/>
  <path d="M120,31 C117,35 117,45 120,49 C123,45 123,35 120,31 Z" fill="#FBBF24"/>
  <path d="M111,40 C115,37 125,37 129,40 C125,43 115,43 111,40 Z" fill="#FBBF24"/>
  <path d="M114,34 C117,37 123,43 126,46 C123,43 117,37 114,34 Z" fill="#F59E0B"/>
  <path d="M126,34 C123,37 117,43 114,46 C117,43 123,37 126,34 Z" fill="#F59E0B"/>

  <!-- Motion/Caution indicator: Concentric subtle arcs showing extreme care & precision -->
  <path d="M85,95 C75,108 75,128 85,142" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
  <path d="M155,95 C165,108 165,128 155,142" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
</svg>