<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Stage & Office Presentation Context -->
  <!-- Spotlight cone -->
  <polygon points="120,0 60,220 180,220" fill="url(#spotlight)"/>
  
  <!-- Presentation Screen / Whiteboard in background -->
  <rect x="70" y="35" width="100" height="65" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="80" y="45" width="40" height="6" rx="2" fill="#38bdf8"/>
  <rect x="80" y="58" width="80" height="4" rx="2" fill="#64748b"/>
  <rect x="80" y="66" width="60" height="4" rx="2" fill="#64748b"/>
  <!-- Chart lines on screen -->
  <polyline points="85,85 100,75 115,80 135,70 150,75" fill="none" stroke="#10b981" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
  <polyline points="85,85 100,75 115,80 135,70 150,75" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Podium Desk -->
  <path d="M90,170 L150,170 L160,220 L80,220 Z" fill="#334155"/>
  <path d="M85,170 L155,170 L155,176 L85,176 Z" fill="#475569"/>

  <!-- Character: Showing eagerness ("急于表现自己" - Overly eager to present, hand raised too high, leaning forward) -->
  
  <!-- Body / Torso leaning forward -->
  <g transform="translate(120, 160) rotate(10)">
    <!-- Suit Jacket -->
    <path d="M-25,-30 L25,-30 L30,15 L-30,15 Z" fill="#1e293b"/>
    <!-- Shirt collar & tie -->
    <polygon points="0,-25 -8,-15 8,-15" fill="#f8fafc"/>
    <polygon points="0,-15 -3,10 3,10" fill="#ec4899"/>
    
    <!-- Neck -->
    <rect x="-6" y="-36" width="12" height="12" rx="4" fill="#fbcfe8"/>
    
    <!-- Head with eager expression -->
    <circle cx="0" cy="-48" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M-17,-55 C-15,-65 15,-65 17,-55 C12,-62 -12,-62 -17,-55 Z" fill="#0f172a"/>
    
    <!-- Face features (Wide anxious/eager eyes, open mouth talking fast) -->
    <circle cx="-6" cy="-50" r="2.5" fill="#0f172a"/>
    <circle cx="6" cy="-50" r="2.5" fill="#0f172a"/>
    <!-- Eyebrows raised high -->
    <path d="M-9,-57 L-3,-55" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M3,-55 L9,-57" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Open eager mouth -->
    <ellipse cx="0" cy="-42" rx="4" ry="5" fill="#0f172a"/>

    <!-- Left Arm waving/pointing enthusiastically up -->
    <path d="M-22,-20 C-40,-30 -50,-60 -55,-80" fill="none" stroke="url(#armGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand pointing up -->
    <circle cx="-55" cy="-83" r="5" fill="#fbcfe8"/>
    
    <!-- Motion lines showing fast, eager movement -->
    <path d="M-62,-70 C-65,-60 -60,-50 -50,-40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
    <path d="M-45,-85 C-50,-90 -45,-95 -40,-98" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right Arm leaning on podium -->
    <path d="M22,-20 C35,-10 45,5 50,15" fill="none" stroke="url(#armGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="52" cy="18" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Laser pointer / Documents props on podium -->
  <rect x="95" y="165" width="25" height="8" rx="2" fill="#cbd5e1" transform="rotate(-10 107 169)"/>
  <circle cx="107" cy="169" r="3" fill="#ef4444"/> <!-- Red laser beam dot on screen -->
  <circle cx="135" cy="70" r="6" fill="#ef4444" opacity="0.8"/>
  <path d="M107,169 L135,70" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Ambient lighting/sparkles emphasizing "showing off / eager performance" -->
  <g fill="#fbbf24">
    <circle cx="45" cy="100" r="2" opacity="0.8"/>
    <circle cx="195" cy="90" r="3" opacity="0.9"/>
    <circle cx="180" cy="140" r="1.5" opacity="0.7"/>
    <circle cx="60" cy="160" r="2.5" opacity="0.6"/>
  </g>
</svg>