<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Decorative background elements representing joyful activity/energy -->
  <g opacity="0.3">
    <circle cx="50" cy="60" r="2" fill="#F59E0B"/>
    <circle cx="190" cy="50" r="3" fill="#3B82F6"/>
    <circle cx="205" cy="160" r="2" fill="#10B981"/>
    <circle cx="40" cy="180" r="2.5" fill="#F43F5E"/>
    <!-- Motion lines -->
    <path d="M25 90 C 35 90, 35 100, 45 100" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M200 100 C 210 100, 215 90, 225 90" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Central Character 1 (Left - Jumping/Playing) -->
  <g transform="translate(65, 95)">
    <!-- Motion lines upward -->
    <path d="M-10 -15 L-15 -25" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10 -15 L15 -25" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-5" r="14" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M-14 -8 C-14 -16, 14 -16, 14 -8 C10 -12, -10 -12, -14 -8Z" fill="#334155"/>
    <!-- Body (Hoodie/Sweater) -->
    <path d="M-14 9 C-14 4, 14 4, 14 9 L18 40 C18 43, 14 45, 10 45 L-10 45 C-14 45, -18 43, -18 40 Z" fill="#3B82F6"/>
    <!-- Arms raised in excitement -->
    <path d="M-14 12 L-28 -2" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 12 L28 -2" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <!-- Bent legs (jumping) -->
    <path d="M-8 45 L-16 62 L-8 66" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M8 45 L16 62 L8 66" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Central Character 2 (Right - Cheering/Engaged) -->
  <g transform="translate(175, 105)">
    <!-- Motion lines -->
    <path d="M0 -25 L0 -35" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-5" r="14" fill="#E2E8F0"/>
    <!-- Hair (Ponytail) -->
    <path d="M-14 -6 C-10 -15, 10 -15, 14 -6 C8 -10, -8 -10, -14 -6Z" fill="#F59E0B"/>
    <path d="M12 -8 C18 -5, 22 -12, 20 -16" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <path d="M-14 9 C-14 4, 14 4, 14 9 L18 42 C18 45, 14 47, 10 47 L-10 47 C-14 47, -18 45, -18 42 Z" fill="#10B981"/>
    <!-- Arms waving/gesturing -->
    <path d="M-14 14 L-30 10" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 14 L28 -4" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs (Dynamic stance) -->
    <path d="M-6 47 L-10 68" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M6 47 L18 64" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Center Character 3 (Main focus - Absorbed in extreme joy/play) -->
  <g transform="translate(120, 85)">
    <!-- Big joyful expression indicators -->
    <path d="M-22 -30 C-15 -42, 15 -42, 22 -30" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-25" cy="-25" r="4" fill="#F59E0B"/>
    <circle cx="25" cy="-25" r="4" fill="#F59E0B"/>
    
    <!-- Head -->
    <circle cx="0" cy="-5" r="16" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M-16 -10 C-16 -20, 16 -20, 16 -10 C12 -16, -12 -16, -16 -10Z" fill="#F43F5E"/>
    
    <!-- Body (Leaning forward in excitement) -->
    <path d="M-12 11 C-12 6, 12 6, 12 11 L16 46 C16 49, 12 51, 8 51 L-8 51 C-12 51, -16 49, -16 46 Z" fill="#F43F5E" transform="rotate(10 0 20)"/>
    
    <!-- Arms out wide, fully absorbed -->
    <path d="M-12 15 L-32 30" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M12 15 L32 25" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Legs in motion -->
    <path d="M-4 50 L-14 70 L-4 74" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M6 48 L18 66 L26 62" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Ground plane -->
  <path d="M30 185 L210 185" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Interactive toy/play items bouncing around to show "mải mê tíu tít" -->
  <g transform="translate(120, 150)">
    <!-- Paper airplane or toy soaring -->
    <path d="M-50 -10 L-30 -20 L-35 0 Z" fill="#3B82F6"/>
    <path d="M-30 -20 L-42 -12 L-35 0 Z" fill="#60A5FA"/>
    
    <!-- Flying ball / Shuttlecock -->
    <circle cx="55" cy="-25" r="8" fill="#F59E0B"/>
    <path d="M47 -33 L63 -17" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M63 -33 L47 -17" stroke="#E2E8F0" stroke-width="2"/>
  </g>

</svg>