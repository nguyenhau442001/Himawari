<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmospheric background glow for spring weather transition -->
  <circle cx="120" cy="115" r="70" fill="#2D3748" opacity="0.4"/>

  <!-- Conceptual Object: A classic mechanical weather vane / unpredictable shifting weather compass -->
  <!-- Base Stand -->
  <path d="M100 195 L140 195 L130 155 L110 155 Z" fill="#4A5568"/>
  <rect x="114" y="110" width="12" height="50" fill="#718096" rx="2"/>

  <!-- Central Pivot -->
  <circle cx="120" cy="110" r="10" fill="#E2E8F0"/>

  <!-- Rotating Indicator (Dynamic Weather Arrow representing "búdìng" / uncertainty) -->
  <g transform="rotate(-35 120 110)">
    <!-- Arrow Head (Rain/Storm side) -->
    <path d="M120 45 L135 85 L120 75 L105 85 Z" fill="#FC8181"/>
    <!-- Arrow Tail (Sun/Clear side) -->
    <path d="M120 175 L135 135 L120 145 L105 135 Z" fill="#F6AD55"/>
    <!-- Central Bar -->
    <rect x="117" y="70" width="6" height="80" fill="#CBD5E0" rx="3"/>
  </g>

  <!-- Directional Cardinal Markers (N, E, S, W subtle indicators) -->
  <circle cx="120" cy="40" r="3" fill="#A0AEC0"/>
  <circle cx="200" cy="110" r="3" fill="#A0AEC0"/>
  <circle cx="120" cy="180" r="3" fill="#A0AEC0"/>
  <circle cx="40" cy="110" r="3" fill="#A0AEC0"/>

  <!-- Floating Weather Elements depicting rapid change (sun half, cloud, raindrops) -->
  <!-- Sun symbol (top left) -->
  <circle cx="65" cy="70" r="12" fill="#F6AD55" opacity="0.9"/>
  <path d="M65 50 L65 54 M65 86 L65 90 M45 70 L49 70 M81 70 L85 70" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rain cloud symbol (top right) -->
  <path d="M175 75 C185 75 192 68 192 60 C192 52 185 46 175 46 C171 46 167 48 165 51 C161 48 156 50 154 54 C151 54 148 57 148 61 C148 66 152 70 157 70 Z" fill="#63B3ED" opacity="0.9"/>
  <line x1="163" y1="76" x2="160" y2="84" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="173" y1="76" x2="170" y2="84" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="183" y1="76" x2="180" y2="84" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round"/>
</svg>