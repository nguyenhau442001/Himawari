<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Map Tabletop Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Warm Amber Glow for Unity -->
    <radialGradient id="unityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Architectural Background Elements -->
  <!-- Back Wall Panel -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Large Window showing stylized skyline / mountains -->
  <path d="M 70 35 L 170 35 L 170 100 L 70 100 Z" fill="#0f172a" />
  <path d="M 70 85 L 95 65 L 115 80 L 145 55 L 170 80 L 170 100 L 70 100 Z" fill="#334155" opacity="0.6" />
  <circle cx="145" cy="50" r="8" fill="#fbbf24" opacity="0.8" />
  <!-- Window frame lines -->
  <line x1="120" y1="35" x2="120" y2="100" stroke="#475569" stroke-width="2" />
  <line x1="70" y1="67" x2="170" y2="67" stroke="#475569" stroke-width="2" />

  <!-- Ambient Unity Glow behind the central model -->
  <circle cx="120" cy="130" r="60" fill="url(#unityGlow)" />

  <!-- Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="3" />

  <!-- Room Interior Props -->
  <!-- Bookshelf on left -->
  <rect x="25" y="60" width="30" height="95" rx="4" fill="#334155" />
  <line x1="25" y1="90" x2="55" y2="90" stroke="#1e293b" stroke-width="3" />
  <line x1="25" y1="120" x2="55" y2="120" stroke="#1e293b" stroke-width="3" />
  <!-- Books -->
  <rect x="29" y="70" width="6" height="18" fill="#38bdf8" rx="1" />
  <rect x="37" y="68" width="8" height="20" fill="#ec4899" rx="1" />
  <rect x="30" y="100" width="7" height="18" fill="#10b981" rx="1" />

  <!-- Conference / Map Table -->
  <path d="M 60 165 L 180 165 L 195 195 L 45 195 Z" fill="url(#tableGrad)" filter="url(#shadow)" />
  <path d="M 60 165 L 180 165 L 180 172 L 60 172 Z" fill="#334155" />

  <!-- Central Focus: The Puzzle Map / Country Model (Solid, United) -->
  <g filter="url(#shadow)">
    <!-- Main Map Piece Assembly -->
    <path d="M 105 130 Q 120 120 135 130 Q 145 145 135 160 Q 120 170 105 160 Q 95 145 105 130 Z" fill="#38bdf8" />
    <!-- Inner details representing regions seamlessly connected -->
    <path d="M 120 125 L 120 165" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M 100 145 L 140 145" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <!-- Golden highlight on map representing strength and wholeness -->
    <circle cx="120" cy="145" r="4" fill="#fbbf24" />
  </g>

  <!-- Left Character (Protective/United Stance) -->
  <g transform="translate(55, 115)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 15 30 L 30 30 L 35 60 L 10 60 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="22" cy="16" r="10" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 12 14 Q 22 4 32 14 Q 22 10 12 14 Z" fill="#b45309" />
    <!-- Arm reaching out firmly to hold/protect the center -->
    <path d="M 28 35 Q 45 40 48 45" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="48" cy="45" r="4" fill="#fcd34d" />
    <!-- Face profile -->
    <circle cx="26" cy="17" r="1.5" fill="#1e293b" />
  </g>

  <!-- Right Character (Protective/United Stance) -->
  <g transform="translate(155, 115)" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 10 30 L 25 30 L 30 60 L 5 60 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="18" cy="16" r="10" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 8 14 Q 18 4 28 14 Q 18 10 8 14 Z" fill="#1e293b" />
    <!-- Arm reaching out firmly to hold/protect the center -->
    <path d="M 12 35 Q -5 40 -8 45" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="-8" cy="45" r="4" fill="#fcd34d" />
    <!-- Face profile -->
    <circle cx="14" cy="17" r="1.5" fill="#1e293b" />
  </g>

  <!-- Floating Golden Shield / Barrier Icon above the map (symbolizing unbreakable unity) -->
  <g transform="translate(120, 95)" filter="url(#shadow)">
    <path d="M 0 -14 L 10 -8 L 10 4 Q 10 12 0 16 Q -10 12 -10 4 L -10 -8 Z" fill="#fbbf24" />
    <path d="M -3 0 L -1 3 L 5 -3" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Decorative Foreground Plants for depth -->
  <!-- Plant Pot Left -->
  <path d="M 190 180 L 210 180 L 215 210 L 185 210 Z" fill="#cbd5e1" />
  <path d="M 185 180 L 215 180 L 217 185 L 183 185 Z" fill="#94a3b8" />
  <!-- Stems and Leaves -->
  <path d="M 200 180 Q 200 160 190 150" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M 200 180 Q 205 155 215 145" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="190" cy="148" rx="8" ry="4" fill="#34d399" transform="rotate(-30 190 148)" />
  <ellipse cx="215" cy="143" rx="8" ry="4" fill="#10b981" transform="rotate(30 215 143)" />

</svg>