<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient background lighting / workshop glow -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <path d="M 60,180 L 180,180 L 200,210 L 40,210 Z" fill="#1e293b" opacity="0.4"/>
  
  <!-- Desk/Workbench Surface -->
  <path d="M 30,170 L 210,170 L 220,205 L 20,205 Z" fill="#334155"/>
  <path d="M 30,170 L 210,170 L 215,176 L 25,176 Z" fill="#475569"/>
  
  <!-- Drafting Lamp / Light beam representing "The Beginning / Spark" -->
  <path d="M 170,40 L 140,80 L 155,90 L 185,50 Z" fill="#64748b"/>
  <circle cx="147" cy="85" r="8" fill="#475569"/>
  <path d="M 120,95 Q 140,110 148,135" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Light Beam Cone -->
  <polygon points="135,90 40,170 170,170" fill="#fbbf24" opacity="0.12"/>

  <!-- Character: Young inventor/creator leaning back with an encouraging, optimistic smile (It's just the beginning) -->
  <!-- Chair Back -->
  <rect x="75" y="110" width="18" height="75" rx="6" fill="#475569"/>
  <rect x="80" y="125" width="8" height="45" rx="3" fill="#334155"/>

  <!-- Character Body & Hoodie -->
  <path d="M 75,150 Q 75,130 95,130 L 125,130 Q 145,130 145,150 L 155,190 L 65,190 Z" fill="#38bdf8"/>
  <path d="M 110,130 L 110,170 M 95,135 Q 110,150 125,135" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none"/> <!-- Hoodie strings & zipper -->

  <!-- Character Neck & Head -->
  <rect x="100" y="112" width="20" height="22" rx="8" fill="#fbcfe8"/>
  <!-- Head Base -->
  <circle cx="110" cy="98" r="24" fill="#fbcfe8"/>

  <!-- Hair (Messy, creative style) -->
  <path d="M 86,95 Q 85,75 110,74 Q 135,74 136,95 Q 140,85 130,80 Q 120,70 100,78 Q 88,85 86,95 Z" fill="#334155"/>

  <!-- Facial Expression: Calm, visionary confidence ("just the beginning") -->
  <!-- Eyes (closed happily / curving upwards) -->
  <path d="M 98,96 Q 102,92 106,96" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 114,96 Q 118,92 122,96" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Gentle Smile -->
  <path d="M 106,106 Q 110,111 114,106" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="97" cy="103" r="3" fill="#fda4af" opacity="0.6"/>
  <circle cx="123" cy="103" r="3" fill="#fda4af" opacity="0.6"/>

  <!-- Arms and Hand Gestures -->
  <!-- Left arm holding blueprint -->
  <path d="M 80,140 Q 60,150 70,175" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Right hand gesturing forward/up (signaling "small step / beginning") -->
  <path d="M 135,140 Q 155,145 145,165" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="145" cy="168" r="6" fill="#fbcfe8"/>

  <!-- Context Props on Desk: Represents a project in early phase (blueprint, miniature model, glowing prototype) -->
  <!-- Blueprint Paper -->
  <polygon points="50,170 95,160 110,185 65,190" fill="#f8fafc"/>
  <path d="M 60,170 L 85,165 M 70,180 L 95,175" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Miniature Prototype / Robot Toy (The "Beginning" creation) -->
  <rect x="155" y="150" width="22" height="22" rx="4" fill="#10b981"/>
  <circle cx="166" cy="143" r="8" fill="#34d399"/> <!-- Robot head -->
  <circle cx="163" cy="142" r="1.5" fill="#0f172a"/>
  <circle cx="169" cy="142" r="1.5" fill="#0f172a"/>
  <line x1="166" y1="135" x2="166" y2="131" stroke="#34d399" stroke-width="2"/>
  <circle cx="166" cy="130" r="2.5" fill="#f59e0b"/> <!-- Little antenna light -->

  <!-- Small Glowing Particle Spark (Visual metaphor for ignition/start) -->
  <path d="M 185,130 L 187,137 L 194,139 L 187,141 L 185,148 L 183,141 L 176,139 L 183,137 Z" fill="#fbbf24"/>
  <path d="M 140,120 L 141,123 L 144,124 L 141,125 L 140,128 L 139,125 L 136,124 L 139,123 Z" fill="#fbbf24" opacity="0.7"/>

  <!-- Coffee Mug for late-night work -->
  <rect x="190" y="155" width="14" height="18" rx="2" fill="#cbd5e1"/>
  <path d="M 204,160 Q 210,160 210,164 Q 210,168 204,168" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <path d="M 194,152 Q 196,146 193,142" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>