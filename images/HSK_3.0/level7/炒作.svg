<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambience (Hype / Spotlight Effect) -->
  <path d="M120 20 L200 190 H40 Z" fill="#F59E0B" opacity="0.08"/>
  <path d="M120 40 L170 190 H70 Z" fill="#F59E0B" opacity="0.12"/>

  <!-- Megaphone (Central Iconic Physical Object for "炒作" / Hype / Media Amplification) -->
  <g transform="translate(120, 115)">
    <!-- Sound Waves / Amplification Lines -->
    <path d="M-62 -45 C-75 -30 -75 30 -62 45" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M-74 -60 C-92 -40 -92 40 -74 60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M-86 -75 C-110 -50 -110 50 -86 75" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"/>

    <!-- Megaphone Body (Sleek Flat Design) -->
    <!-- Handle -->
    <path d="M-15 35 L-25 70 C-27 75 -22 80 -17 78 L-5 72 Z" fill="#3B82F6"/>
    <rect x="-18" y="32" width="16" height="8" rx="3" fill="#60A5FA"/>

    <!-- Main Cone -->
    <path d="M-15 -25 L45 -55 C52 -58 60 -52 60 -44 L60 44 C60 52 52 58 45 55 L-15 25 Z" fill="#2563EB"/>
    <path d="M-15 -25 L45 -55 C52 -58 60 -52 60 -44 L60 0 L-15 0 Z" fill="#3B82F6" opacity="0.5"/>

    <!-- Megaphone Back/Casing -->
    <path d="M-20 -30 C-25 -30 -30 -20 -30 0 C-30 20 -25 30 -20 30 L-15 25 L-15 -25 Z" fill="#1D4ED8"/>
    <ellipse cx="-20" cy="0" rx="6" ry="30" fill="#60A5FA"/>

    <!-- Megaphone Rim (Front Opening) -->
    <ellipse cx="60" cy="0" rx="8" ry="44" fill="#93C5FD"/>

    <!-- Highlight Reflection on Body -->
    <path d="M0 -22 L35 -40 C40 -42 45 -38 45 -33 L25 -10 Z" fill="#93C5FD" opacity="0.4"/>
  </g>

  <!-- Sparkles / Exaggeration Accents (Representing "Thổi phồng / Lăng xê") -->
  <!-- Top Right Sparkle -->
  <g transform="translate(180, 55)">
    <path d="M0 -14 C2 -5 5 -2 14 0 C5 2 2 5 0 14 C-2 5 -5 2 -14 0 C-5 -2 -2 -5 0 -14 Z" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="23" fill="#F59E0B" opacity="0.15"/>
  </g>

  <!-- Bottom Left Sparkle -->
  <g transform="translate(60, 170)">
    <path d="M0 -10 C1.5 -3.5 3.5 -1.5 10 0 C3.5 1.5 1.5 3.5 0 10 C-1.5 3.5 -3.5 1.5 -10 0 C-3.5 -1.5 -1.5 -3.5 0 -10 Z" fill="#F59E0B"/>
  </g>

  <!-- Top Left Small Sparkle -->
  <g transform="translate(75, 65)">
    <path d="M0 -7 C1 -2.5 2.5 -1 7 0 C2.5 1 1 2.5 0 7 C-1 2.5 -2.5 1 -7 0 C-2.5 -1 -1 -2.5 0 -7 Z" fill="#60A5FA"/>
  </g>
</svg>