<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 160 L240 160" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- The Pit (坑) -->
  <ellipse cx="120" cy="185" rx="35" ry="20" fill="#0f172a"/>
  <ellipse cx="120" cy="180" rx="30" ry="15" fill="#1e293b"/>
  
  <!-- Character -->
  <g transform="translate(60, 110)">
    <!-- Legs -->
    <rect x="15" y="40" width="6" height="20" rx="2" fill="#fb923c"/>
    <rect x="28" y="40" width="6" height="20" rx="2" fill="#fb923c"/>
    <!-- Body -->
    <rect x="12" y="15" width="25" height="30" rx="5" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="24.5" cy="10" r="12" fill="#fde68a"/>
    <!-- Expression (Surprise) -->
    <circle cx="20" cy="8" r="1.5" fill="#0f172a"/>
    <circle cx="29" cy="8" r="1.5" fill="#0f172a"/>
    <path d="M22 14 Q24.5 17 27 14" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Background Details -->
  <rect x="180" y="80" width="40" height="80" rx="4" fill="#475569"/>
  <rect x="190" y="90" width="20" height="20" fill="#fbbf24"/>
  <rect x="190" y="120" width="20" height="20" fill="#fbbf24"/>
  
  <circle cx="40" cy="50" r="20" fill="#fbbf24" opacity="0.2"/>
  <circle cx="40" cy="50" r="10" fill="#fbbf24" opacity="0.4"/>
</svg>