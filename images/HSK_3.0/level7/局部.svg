<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  
  <!-- Large Blueprint/Map on Desk -->
  <rect x="40" y="150" width="160" height="60" rx="4" fill="#e2e8f0"/>
  
  <!-- The "Problem" Area (Highlighted) -->
  <rect x="140" y="165" width="40" height="30" rx="2" fill="#fb923c" fill-opacity="0.6"/>
  <path d="M140 165 L180 165 L180 195 L140 195 Z" stroke="#fb923c" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
  
  <!-- Character: Project Manager/Engineer -->
  <!-- Body -->
  <path d="M70 180 C70 160, 90 150, 100 150 C110 150, 130 160, 130 180 L130 220 L70 220 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="100" cy="140" r="20" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M85 135 C85 120, 115 120, 115 135 C115 130, 110 125, 100 125 C90 125, 85 130, 85 135" fill="#475569"/>
  
  <!-- Gesture: Pointing at the specific spot -->
  <path d="M125 155 L145 175" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="145" cy="175" r="4" fill="#fde68a"/>
  
  <!-- Secondary Character: Observing -->
  <circle cx="180" cy="150" r="15" fill="#fde68a"/>
  <path d="M170 165 L170 220 L190 220 L190 165" fill="#ec4899"/>
  
  <!-- Desk Lamp -->
  <path d="M50 150 L50 100 L80 100" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="100" r="10" fill="#fbbf24"/>
  
  <!-- Coffee Mug -->
  <rect x="200" y="160" width="20" height="25" rx="2" fill="#10b981"/>
  <path d="M220 165 L225 165 L225 175 L220 175" stroke="#10b981" stroke-width="3" fill="none"/>
</svg>