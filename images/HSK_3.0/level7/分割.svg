<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for context -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A2E39" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- The Central Object representing physical division/separation (分割) -->
  <g transform="translate(120, 120)">
    <!-- Left Landmass / Object Segment -->
    <g transform="translate(-2, 0)">
      <path d="M-60,-40 C-45,-45 -25,-35 -15,-50 C-5,-65 10,-45 20,-30 C30,-15 15,10 25,30 C35,50 10,65 -10,60 C-30,55 -55,45 -65,25 C-75,5 -75,-35 -60,-40 Z" fill="#2E4A62" stroke="#4F8AC9" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Inner land detail -->
      <path d="M-40,-20 C-30,-25 -20,-15 -25,0 C-30,15 -50,15 -45,-5 Z" fill="#223646" opacity="0.6"/>
    </g>

    <!-- Right Landmass / Object Segment -->
    <g transform="translate(2, 0)">
      <path d="M60,40 C45,45 25,35 15,50 C5,65 -10,45 -20,30 C-30,15 -15,10 -25,30 C-35,50 -10,65 10,60 C30,55 55,45 65,25 C75,5 75,-35 60,-40 Z" fill="#2E4A62" stroke="#4F8AC9" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Inner land detail -->
      <path d="M40,20 C30,25 20,15 25,0 C30,-15 50,-15 45,5 Z" fill="#223646" opacity="0.6"/>
    </g>

    <!-- Glowing, clean cut line / Separation gap (Orange/Gold accent for focus) -->
    <g>
      <!-- Dashed cutting trajectory indicating split -->
      <line x1="-15" y1="-85" x2="15" y2="85" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
      
      <!-- Precision laser / split indicator arrows -->
      <path d="M0,-95 L-5,-80 L5,-80 Z" fill="#F39C12"/>
      <path d="M0,95 L-5,80 L5,80 Z" fill="#F39C12"/>
      
      <!-- Dynamic floating sparks from the division -->
      <circle cx="-12" cy="-25" r="2.5" fill="#F39C12"/>
      <circle cx="15" cy="20" r="2" fill="#F39C12"/>
      <circle cx="8" cy="-45" r="1.5" fill="#E67E22"/>
      <circle cx="-8" cy="40" r="2" fill="#E67E22"/>
    </g>
  </g>
</svg>