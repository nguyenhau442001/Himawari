<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Path indicating direction -->
  <path d="M40 180 L180 60" stroke="#333D4A" stroke-width="8" stroke-dasharray="12 12" fill="none"/>
  
  <!-- Hospital Building Icon -->
  <rect x="150" y="40" width="50" height="60" rx="4" fill="#2D343E"/>
  <rect x="165" y="55" width="20" height="30" rx="2" fill="#FFB84D"/>
  <rect x="172" y="62" width="6" height="16" fill="#1A1D24"/>
  <rect x="165" y="69" width="20" height="2" fill="#1A1D24"/>
  
  <!-- Person running towards the hospital -->
  <g transform="translate(40, 140)">
    <!-- Body -->
    <path d="M20 10 L35 40 L25 60" stroke="#FFB84D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arms -->
    <path d="M20 20 L5 35 M20 20 L35 25" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <path d="M35 40 L45 65 M35 40 L25 65" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="20" cy="10" r="8" fill="#FFB84D"/>
  </g>
  
  <!-- Motion lines -->
  <path d="M10 150 L30 130 M5 160 L25 140" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
</svg>