<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="desk-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Hologram/Artifact Glow -->
    <linearGradient id="holo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="beam-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background elements / Room interior -->
  <g id="environment">
    <!-- Window backdrop -->
    <rect x="150" y="25" width="65" height="85" rx="6" fill="#1e1b4b" stroke="#334155" stroke-width="1.5" />
    <!-- City lights outside -->
    <circle cx="165" cy="45" r="1.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="185" cy="55" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="170" cy="75" r="1.5" fill="#ec4899" opacity="0.6" />
    <circle cx="195" cy="85" r="2" fill="#10b981" opacity="0.7" />
    <path d="M150 67.5 L215 67.5 M182.5 25 L182.5 110" stroke="#334155" stroke-width="1" />

    <!-- Bookshelf on back wall -->
    <rect x="25" y="30" width="45" height="75" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="50" x2="70" y2="50" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="75" x2="70" y2="75" stroke="#334155" stroke-width="1.5" />
    <!-- Books -->
    <path d="M32 50 L32 38 L38 38 L38 50 Z" fill="#ef4444" opacity="0.8" />
    <path d="M40 50 L40 40 L46 40 L46 50 Z" fill="#3b82f6" opacity="0.8" />
    <path d="M50 50 L56 35 L62 38 L56 50 Z" fill="#f59e0b" opacity="0.8" />
    <path d="M33 75 L33 60 L41 60 L41 75 Z" fill="#10b981" opacity="0.8" />
    <path d="M43 75 L43 63 L49 63 L49 75 Z" fill="#a855f7" opacity="0.8" />

    <!-- Ambient Desk Glow -->
    <circle cx="120" cy="170" r="80" fill="url(#desk-glow)" />

    <!-- Desk Surface -->
    <path d="M 20 185 L 220 185 L 230 215 L 10 215 Z" fill="#334155" filter="url(#soft-shadow)" />
    <path d="M 20 185 L 220 185 L 223 192 L 17 192 Z" fill="#475569" />
  </g>

  <!-- Central Sci-Fi / Investigator Artifact Setup ("Truth" projection being questioned) -->
  <g id="artifact-projection" transform="translate(120, 135)">
    <!-- Light beam from emitter -->
    <path d="M -15 25 L 15 25 L 35 50 L -35 50 Z" fill="url(#beam-grad)" />

    <!-- Emitter Base -->
    <path d="M-22 50 L22 50 L18 60 L-18 60 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <ellipse cx="0" cy="50" rx="22" ry="5" fill="#475569" />
    <ellipse cx="0" cy="50" rx="12" ry="2.5" fill="#38bdf8" />

    <!-- Holographic Diamond/Gem (representing "The Truth") -->
    <g filter="url(#soft-shadow)">
      <!-- Pulsing/Floating Diamond -->
      <path d="M0 -15 L16 5 L0 32 L-16 5 Z" fill="url(#holo-grad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" opacity="0.95" />
      <path d="M0 -15 L16 5 L0 10 Z" fill="#ffffff" opacity="0.4" />
      <path d="M0 -15 L-16 5 L0 10 Z" fill="#ffffff" opacity="0.2" />
      
      <!-- Question Marks / Uncertainty ripples orbiting the object -->
      <path d="M -24 -5 A 28 28 0 0 1 -10 -28" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
      <path d="M 24 5 A 28 28 0 0 1 10 28" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
      
      <!-- Floating sparkling nodes -->
      <circle cx="-22" cy="-12" r="2.5" fill="#f59e0b" />
      <circle cx="22" cy="15" r="2" fill="#38bdf8" />
      <circle cx="5" cy="-25" r="1.5" fill="#ec4899" />
    </g>
  </g>

  <!-- Main Character (Curious/Hesitant Analyst / Thinker) -->
  <g id="character" transform="translate(120, 125)">
    <!-- Body & Lab coat/Jacket -->
    <path d="M -30 65 Q -40 30 -20 15 L 20 15 Q 40 30 30 65 Z" fill="#0284c7" />
    <path d="M -22 15 L 0 45 L 22 15 Z" fill="#f8fafc" /> <!-- Inner shirt -->
    <path d="M -15 15 L 0 35 L 15 15 Z" fill="#e2e8f0" />

    <!-- Shoulders & Neck -->
    <path d="M -10 12 L 10 12 L 12 20 L -12 20 Z" fill="#fbcfe8" />
    
    <!-- Head -->
    <circle cx="0" cy="-6" r="22" fill="#fbcfe8" />
    
    <!-- Hair (Expressive, neat yet slightly tousled from deep thought) -->
    <path d="M -21 -12 Q -24 -26 0 -28 Q 24 -26 22 -12 Q 22 -2 15 -18 Q 0 -22 -15 -18 Q -22 -2 -21 -12 Z" fill="#334155" />

    <!-- Facial Expression: Doubt / Contemplation -->
    <!-- Eyebrows (Asymmetrical: one raised in skepticism) -->
    <path d="M -10 -13 Q -5 -17 0 -13" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 4 -15 Q 9 -12 14 -15" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes (Focused on the hologram) -->
    <circle cx="-6" cy="-8" r="2.5" fill="#1e293b" />
    <circle cx="8" cy="-8" r="2.5" fill="#1e293b" />
    <circle cx="-5" cy="-9" r="1" fill="#ffffff" />
    <circle cx="9" cy="-9" r="1" fill="#ffffff" />

    <!-- Nose & Mouth (Hesitant, slight frown / thoughtful purse) -->
    <path d="M 0 -4 L 2 1 L -1 1" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -4 6 Q 0 4 5 7" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arms & Hands in "Indecisive / Hesitant" Pose -->
    <!-- Left Arm (Chin scratch / pondering) -->
    <path d="M -25 25 Q -45 10 -35 -5 Q -32 -10 -27 -5" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand near chin -->
    <circle cx="-27" cy="-7" r="5" fill="#fbcfe8" />
    <path d="M -29 -5 Q -27 -9 -24 -8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Arm (Raised palm outward, gesturing "Wait, can't be sure") -->
    <path d="M 25 25 Q 45 15 40 -5" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Hand open, stopping gesture -->
    <path d="M 36 -12 C 40 -12 44 -8 42 -4 C 41 -2 38 -2 37 -5" fill="#fbcfe8" />
    <circle cx="39" cy="-9" r="5" fill="#fbcfe8" />
  </g>

  <!-- Foreground Desk Props for Rich Context -->
  <g id="foreground-props">
    <!-- Magnifying glass on desk (Investigative tool) -->
    <g transform="translate(60, 195) rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <circle cx="0" cy="-12" r="12" fill="none" stroke="#94a3b8" stroke-width="3" />
      <circle cx="0" cy="-12" r="10" fill="#38bdf8" opacity="0.2" />
    </g>

    <!-- Open file / documents -->
    <g transform="translate(165, 190) rotate(10)">
      <polygon points="-15,10 15,0 25,18 -5,28" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <polygon points="-5,5 20,-3 30,15 5,23" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <!-- Dummy lines of text on papers -->
      <line x1="0" y1="2" x2="10" y2="-1" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-2" y1="7" x2="12" y2="2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="2" y1="12" x2="16" y2="7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Coffee mug -->
    <g transform="translate(195, 175)">
      <rect x="-8" y="0" width="16" height="20" rx="3" fill="#cbd5e1" />
      <path d="M 8 4 C 13 4 13 14 8 14" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <!-- Steam -->
      <path d="M -3 -4 Q -6 -9 -2 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
      <path d="M 3 -6 Q 6 -11 2 -16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>
</svg>