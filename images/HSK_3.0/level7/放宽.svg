<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Gate/Entryway structure representing the policy threshold -->
  <g transform="translate(60, 80)">
    <!-- Left pillar -->
    <rect x="0" y="0" width="12" height="80" rx="2" fill="#4A5568"/>
    <!-- Right pillar -->
    <rect x="108" y="0" width="12" height="80" rx="2" fill="#4A5568"/>
    
    <!-- The "Widening" action: A gate that is being pulled open wide -->
    <!-- Left door panel being pulled outward -->
    <path d="M 12 10 L 40 20 L 40 70 L 12 80 Z" fill="#F6AD55"/>
    <!-- Right door panel being pulled outward -->
    <path d="M 108 10 L 80 20 L 80 70 L 108 80 Z" fill="#F6AD55"/>
    
    <!-- Person silhouette walking through the widened space -->
    <circle cx="60" cy="30" r="10" fill="#E2E8F0"/>
    <path d="M 60 40 L 60 70 M 60 45 L 45 60 M 60 45 L 75 60 M 60 70 L 50 90 M 60 70 L 70 90" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative accent indicating movement/expansion -->
  <path d="M 40 100 Q 20 120 40 140" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 80 100 Q 100 120 80 140" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>