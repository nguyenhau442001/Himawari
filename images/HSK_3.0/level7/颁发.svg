<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Stage Background -->
  <rect x="20" y="180" width="200" height="10" fill="#334155" rx="2"/>
  <circle cx="120" cy="80" r="60" fill="#1e293b" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Principal -->
  <g transform="translate(70, 90)">
    <path d="M20 120h40v-60c0-15-10-25-20-25s-20 10-20 25z" fill="#38bdf8"/>
    <circle cx="20" cy="30" r="15" fill="#fde68a"/>
    <rect x="15" y="45" width="10" height="5" fill="#fb923c"/>
  </g>
  
  <!-- Student -->
  <g transform="translate(130, 90)">
    <path d="M20 120h40v-50c0-10-5-15-15-15s-15 5-15 15z" fill="#ec4899"/>
    <circle cx="20" cy="40" r="12" fill="#fde68a"/>
  </g>
  
  <!-- The Certificate (The Action) -->
  <rect x="95" y="110" width="50" height="35" fill="#f59e0b" rx="2"/>
  <rect x="100" y="115" width="40" height="5" fill="#fff" opacity="0.3"/>
  <rect x="100" y="125" width="40" height="5" fill="#fff" opacity="0.3"/>
  <rect x="100" y="135" width="20" height="5" fill="#fff" opacity="0.3"/>
  
  <!-- Decorative Stage Lights -->
  <circle cx="40" cy="40" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="40" r="5" fill="#fbbf24" opacity="0.6"/>
  <path d="M40 45l-20 80M200 45l20 80" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>
</svg>