<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background glow representing prosperity/warmth -->
  <circle cx="120" cy="120" r="80" fill="#F5A623" opacity="0.08"/>

  <!-- Main Object: A stylized, modern, abundant basket overflowing with golden grain/harvest (representing 丰衣足食 / 富足) -->
  <g transform="translate(0, 10)">
    <!-- Overflowing Harvest / Grains (Glowing Gold) -->
    <ellipse cx="120" cy="95" rx="55" ry="25" fill="#F5A623"/>
    <path d="M65 95 C 75 75, 105 70, 120 75 C 135 70, 165 75, 175 95 Z" fill="#F7B538"/>
    
    <!-- Individual golden stalks/coins/harvest elements -->
    <circle cx="95" cy="85" r="8" fill="#FCD162"/>
    <circle cx="120" cy="78" r="9" fill="#FCD162"/>
    <circle cx="145" cy="85" r="8" fill="#FCD162"/>
    <circle cx="80" cy="98" r="7" fill="#FCD162"/>
    <circle cx="160" cy="98" r="7" fill="#FCD162"/>
    <circle cx="108" cy="90" r="7" fill="#FFC53D"/>
    <circle cx="132" cy="90" r="7" fill="#FFC53D"/>

    <!-- Traditional yet modern woven basket -->
    <!-- Basket rim -->
    <path d="M 60 100 Q 120 110 180 100 L 175 130 Q 120 145 65 130 Z" fill="#3E4C59"/>
    <ellipse cx="120" cy="100" rx="60" ry="12" fill="#4E5D6C"/>
    
    <!-- Basket body -->
    <path d="M 65 130 C 70 170, 90 185, 120 185 C 150 185, 170 170, 175 130 Z" fill="#333F48"/>
    
    <!-- Basket weave pattern (clean geometric lines) -->
    <path d="M 75 135 Q 120 150 165 135" stroke="#222B32" stroke-width="2" fill="none"/>
    <path d="M 82 150 Q 120 165 158 150" stroke="#222B32" stroke-width="2" fill="none"/>
    <path d="M 90 165 Q 120 178 150 165" stroke="#222B32" stroke-width="2" fill="none"/>
    
    <line x1="100" y1="110" x2="95" y2="175" stroke="#222B32" stroke-width="2"/>
    <line x1="140" y1="110" x2="145" y2="175" stroke="#222B32" stroke-width="2"/>
    <line x1="120" y1="110" x2="120" y2="182" stroke="#222B32" stroke-width="2"/>
  </g>

  <!-- Sparkles of abundance -->
  <path d="M 50 70 L 53 78 L 61 81 L 53 84 L 50 92 L 47 84 L 39 81 L 47 78 Z" fill="#F5A623" opacity="0.8"/>
  <path d="M 190 80 L 192 85 L 197 87 L 192 89 L 190 94 L 188 89 L 183 87 L 188 85 Z" fill="#F5A623" opacity="0.9"/>
  <path d="M 170 45 L 171 49 L 175 50 L 171 51 L 170 55 L 169 51 L 165 50 L 169 49 Z" fill="#FCD162" opacity="0.6"/>
</svg>