<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filter for the trigger/spark and final domino -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background grid lines for modern abstract aesthetic -->
  <path d="M40 180 H200" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M40 120 H200" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M40 60 H200" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Causality & Escalation Visual Metaphor: Domino Effect with Sharp Progression -->
  <!-- Base track/path -->
  <path d="M 40 170 Q 110 170, 140 140 T 200 90" fill="none" stroke="#3A4255" stroke-width="3" stroke-linecap="round"/>

  <!-- Progression Arrow Head indicating inevitability -->
  <path d="M 185 85 L 202 88 L 195 105" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Domino 1 (Initial Action - Small, Slate) -->
  <g transform="translate(55, 135) rotate(-15)">
    <rect x="0" y="0" width="14" height="35" rx="3" fill="#64748B"/>
  </g>

  <!-- Domino 2 (Tipping/Progression - Medium, Blue-Gray) -->
  <g transform="translate(90, 115) rotate(-35)">
    <rect x="0" y="0" width="16" height="42" rx="3" fill="#38BDF8"/>
  </g>

  <!-- Domino 3 (Inevitable Escalation - Large, Bright Orange/Gold representing '势必' certainty & impact) -->
  <g transform="translate(138, 72) rotate(-65)">
    <!-- Glow behind the final heavy impact -->
    <rect x="-3" y="-3" width="22" height="56" rx="4" fill="#F59E0B" opacity="0.3" filter="url(#glow)"/>
    <rect x="0" y="0" width="18" height="50" rx="3" fill="#F59E0B"/>
  </g>

  <!-- Impact / Shockwave / Controversy Metaphor Burst at the end -->
  <g transform="translate(185, 75)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.2"/>
    <!-- Energy sparks -->
    <path d="M -8 -18 L -14 -26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 10 -16 L 18 -24" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 16 2 L 26 4" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Small floating nodes showing exact causality logic (Cause -> Inevitable Effect) -->
  <circle cx="62" cy="170" r="4" fill="#64748B"/>
  <circle cx="195" cy="170" r="6" fill="#F59E0B" filter="url(#glow)"/>
  <path d="M 70 170 H 185" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" opacity="0.5"/>
</svg>