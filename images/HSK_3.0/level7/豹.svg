<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Background Speed Lines & Terrain (representing 猎豹 context) -->
  <g opacity="0.3">
    <!-- Ground plane -->
    <path d="M 20 180 L 220 180" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Dynamic speed streaks -->
    <path d="M 40 100 L 90 100" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 20 120 L 110 120" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 50 140 L 130 140" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 10 160 L 100 160" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Leopard (Con báo) Silhouette / Vector Illustration in Full Sprint -->
  <g transform="translate(15, 30)">
    <!-- Main Body in Sleek Modern Flat Style (Golden/Orange Accent) -->
    <!-- Tail -->
    <path d="M 45 80 Q 20 75 10 60" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <path d="M 10 60 Q 5 55 8 50" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

    <!-- Hind Legs (Extended back) -->
    <path d="M 55 95 L 30 125 L 15 120" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Body Torso -->
    <path d="M 45 80 C 50 65, 80 65, 105 75 C 130 85, 145 90, 160 85" fill="none" stroke="#F59E0B" stroke-width="22" stroke-linecap="round"/>

    <!-- Fore Legs (Extended forward for running stride) -->
    <path d="M 145 85 L 175 120 L 195 115" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 135 85 L 150 125 L 170 130" fill="none" stroke="#E68A00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head and Neck -->
    <path d="M 150 75 Q 175 60 185 70" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
    <!-- Head Shape -->
    <circle cx="185" cy="65" r="14" fill="#F59E0B"/>
    <!-- Ears -->
    <polygon points="175,55 180,48 185,55" fill="#F59E0B"/>
    <polygon points="187,55 192,48 196,55" fill="#F59E0B"/>

    <!-- Characteristic Leopard Spots (Rosettes / Marks) -->
    <!-- Dark minimalist spots for contrast -->
    <circle cx="65" cy="73" r="2.5" fill="#1A1D24"/>
    <circle cx="85" cy="70" r="2" fill="#1A1D24"/>
    <circle cx="100" cy="80" r="2.5" fill="#1A1D24"/>
    <circle cx="120" cy="75" r="3" fill="#1A1D24"/>
    <circle cx="140" cy="82" r="2" fill="#1A1D24"/>
    <circle cx="75" cy="85" r="2" fill="#1A1D24"/>
    <circle cx="95" cy="88" r="2.5" fill="#1A1D24"/>
    <circle cx="115" cy="86" r="2" fill="#1A1D24"/>
    <!-- Tear mark on face (specific to cheetah) -->
    <path d="M 185 62 L 183 72" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Speed Lines for Depth -->
  <g opacity="0.8">
    <path d="M 130 195 L 210 195" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 160 205 L 230 205" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>