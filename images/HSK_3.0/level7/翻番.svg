<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Base Platform / Financial podium -->
    <path d="M 60 170 L 180 170 L 195 200 L 45 200 Z" fill="#2A303C"/>
    <path d="M 45 200 L 195 200 L 190 206 L 50 206 Z" fill="#3A4252"/>
    
    <!-- FIRST OBJECT (Single State - Left) -->
    <g transform="translate(60, 110)">
      <!-- Financial Bar Chart Pillar 1 -->
      <rect x="0" y="0" width="36" height="60" rx="4" fill="#2E384D"/>
      <rect x="4" y="6" width="28" height="48" rx="2" fill="#3B4863"/>
      <!-- Growth Node (Top of bar 1) -->
      <circle cx="18" cy="30" r="6" fill="#F39C12" opacity="0.6"/>
    </g>

    <!-- MULTIPLICATION / TRANSITION ARROW -->
    <g transform="translate(105, 125)">
      <path d="M 5 15 L 25 15 M 18 8 L 25 15 L 18 22" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="15" cy="15" r="14" fill="#2A303C" stroke="#F39C12" stroke-width="2"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#F39C12" text-anchor="middle">2×</text>
    </g>

    <!-- SECOND OBJECT (Doubled State - Right) -->
    <g transform="translate(144, 50)">
      <!-- Financial Bar Chart Pillar 2 (Double Height) -->
      <rect x="0" y="0" width="36" height="120" rx="4" fill="#D35400"/>
      <rect x="4" y="6" width="28" height="108" rx="2" fill="#E67E22"/>
      <!-- Internal segment lines representing growth -->
      <line x1="8" y1="36" x2="28" y2="36" stroke="#D35400" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="72" x2="28" y2="72" stroke="#D35400" stroke-width="3" stroke-linecap="round"/>
      <!-- Glowing Peak Star/Node -->
      <circle cx="18" cy="20" r="8" fill="#FFF" opacity="0.9"/>
      <circle cx="18" cy="20" r="4" fill="#F39C12"/>
    </g>

    <!-- Trend Line connecting the two states -->
    <path d="M 78 120 Q 120 100 162 70" fill="none" stroke="#F39C12" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
    
    <!-- Upward Arrowhead at peak -->
    <path d="M 152 68 L 163 70 L 158 80" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>