<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#222732" opacity="0.5"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#2F3748" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Wanted Poster (Center Object) -->
  <g transform="translate(65, 35)">
    <!-- Poster paper base -->
    <rect x="0" y="0" width="110" height="150" rx="4" fill="#E2D6B5"/>
    <rect x="6" y="6" width="98" height="138" fill="#F4EEDC"/>
    
    <!-- Bold Wanted Header Representation (Abstract lines) -->
    <rect x="25" y="16" width="60" height="8" rx="2" fill="#C93B2B"/>
    <rect x="35" y="28" width="40" height="4" rx="1" fill="#4A453A"/>

    <!-- Target Silhouette (Head and Shoulders) -->
    <circle cx="55" cy="65" r="18" fill="#36322A"/>
    <path d="M 27 108 C 27 88, 83 88, 83 108 Z" fill="#36322A"/>

    <!-- Crosshair / Target Overlay on the portrait -->
    <circle cx="55" cy="72" r="28" fill="none" stroke="#E54B4B" stroke-width="3"/>
    <!-- Crosshairs extending outside -->
    <line x1="55" y1="38" x2="55" y2="46" stroke="#E54B4B" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="98" x2="55" y2="106" stroke="#E54B4B" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="72" x2="29" y2="72" stroke="#E54B4B" stroke-width="3" stroke-linecap="round"/>
    <line x1="81" y1="72" x2="89" y2="72" stroke="#E54B4B" stroke-width="3" stroke-linecap="round"/>

    <!-- Abstract text lines representing poster details -->
    <rect x="20" y="120" width="70" height="4" rx="1" fill="#C2B8A3"/>
    <rect x="30" y="130" width="50" height="4" rx="1" fill="#C2B8A3"/>
  </g>

  <!-- Magnifying glass / Investigation accent overlapping the poster -->
  <g transform="translate(125, 115)">
    <!-- Glass body -->
    <circle cx="35" cy="35" r="28" fill="#1A1D24" fill-opacity="0.2" stroke="#F5A623" stroke-width="6"/>
    <circle cx="35" cy="35" r="24" fill="#38BDF8" fill-opacity="0.15"/>
    
    <!-- Handle -->
    <path d="M 53 53 L 78 78" stroke="#F5A623" stroke-width="7" stroke-linecap="round"/>
    <path d="M 53 53 L 78 78" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Glass reflection highlight -->
    <path d="M 18 20 A 24 24 0 0 1 45 15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Modern Accent Badge / Stamp -->
  <g transform="translate(30, 140)">
    <circle cx="20" cy="20" r="18" fill="#C93B2B"/>
    <path d="M 12 20 L 17 25 L 28 14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>