<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow behind the medical record -->
  <circle cx="120" cy="120" r="70" fill="#2563EB" opacity="0.12" filter="blur(16px)"/>

  <!-- Physical Object (Noun): Medical Record / 病历 -->
  <g transform="translate(62, 38)">
    <!-- Clipboard / Folder Base -->
    <rect x="0" y="0" width="116" height="164" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Folder Tab -->
    <path d="M 0 16 C 0 10, 6 6, 12 6 L 44 6 C 48 6, 52 8, 55 12 L 61 20 C 64 24, 68 26, 72 26 L 104 26 C 110 26, 116 30, 116 36 L 116 164 C 116 168, 112 172, 108 172 L 8 172 C 4 172, 0 168, 0 164 Z" fill="#334155"/>

    <!-- Document Pages (Stacked Effect) -->
    <rect x="12" y="24" width="92" height="132" rx="4" fill="#F8FAFC"/>
    
    <!-- Metal Clipboard Clip at Top -->
    <path d="M 42 12 C 42 8, 45 6, 48 6 L 68 6 C 71 6, 74 8, 74 12 L 74 22 C 74 24, 72 26, 70 26 L 46 26 C 44 26, 42 24, 42 22 Z" fill="#94A3B8"/>
    <rect x="48" y="10" width="20" height="8" rx="2" fill="#CBD5E1"/>

    <!-- Medical Header (Red Cross / Hospital Symbol Accent) -->
    <circle cx="28" cy="44" r="8" fill="#EF4444" opacity="0.15"/>
    <rect x="25" y="41" width="6" height="2" rx="1" fill="#EF4444"/>
    <rect x="27" y="39" width="2" height="6" rx="1" fill="#EF4444"/>

    <!-- Document Lines (Patient Info & Notes) -->
    <rect x="42" y="41" width="48" height="6" rx="3" fill="#E2E8F0"/>
    
    <line x1="24" y1="64" x2="92" y2="64" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Vital Chart / EKG Graph Graphic on Record -->
    <rect x="20" y="76" width="76" height="38" rx="4" fill="#F1F5F9"/>
    <path d="M 26 95 L 42 95 L 48 85 L 54 105 L 60 90 L 66 95 L 86 95" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Text / Note Lines mimicking medical history details -->
    <rect x="24" y="126" width="68" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="24" y="136" width="52" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="24" y="146" width="60" height="4" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- High-Contrast Focal Accent: Medical Examiner Stethoscope / Pointer -->
  <g transform="translate(136, 130)">
    <!-- Stethoscope tubing wrapping bottom right -->
    <path d="M 30 -10 C 20 10, 10 30, -10 36" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <!-- Stethoscope Chestpiece -->
    <circle cx="-14" cy="40" r="12" fill="#1E293B" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="-14" cy="40" r="5" fill="#F59E0B"/>
  </g>
</svg>