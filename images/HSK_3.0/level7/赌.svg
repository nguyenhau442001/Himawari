<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: A high-stakes gaming/betting chip combined with a rising startup chart arrow (visualizing the context: betting all savings on a startup) -->
  
  <!-- Subtle background glow/pedestal -->
  <ellipse cx="120" cy="180" rx="60" ry="16" fill="#252A34" opacity="0.8"/>
  <ellipse cx="120" cy="180" rx="40" ry="10" fill="#FF9F0A" opacity="0.15"/>

  <!-- Main Chip Body (Outer Rim) -->
  <circle cx="120" cy="115" r="54" fill="#2D3748" stroke="#4A5568" stroke-width="3"/>
  
  <!-- Inner Ring -->
  <circle cx="120" cy="115" r="42" fill="#1A1D24" stroke="#FF9F0A" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Chip Edge Notches (Classic casino/betting motif) -->
  <rect x="117" y="58" width="6" height="10" rx="2" fill="#FF9F0A"/>
  <rect x="117" y="162" width="6" height="10" rx="2" fill="#FF9F0A"/>
  <rect x="58" y="112" width="10" height="6" rx="2" fill="#FF9F0A"/>
  <rect x="172" y="112" width="10" height="6" rx="2" fill="#FF9F0A"/>

  <rect x="78" y="73" width="7" height="9" rx="2" transform="rotate(45 81.5 77.5)" fill="#FF9F0A"/>
  <rect x="155" y="148" width="7" height="9" rx="2" transform="rotate(45 158.5 152.5)" fill="#FF9F0A"/>
  <rect x="148" y="73" width="9" height="7" rx="2" transform="rotate(-45 152.5 76.5)" fill="#FF9F0A"/>
  <rect x="75" y="148" width="9" height="7" rx="2" transform="rotate(-45 79.5 151.5)" fill="#FF9F0A"/>

  <!-- Center Motif: Rising growth arrow piercing through the chip, representing the "all-in startup investment" context -->
  <path d="M 95 130 L 125 100 L 145 120 L 170 90" fill="none" stroke="#FF9F0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow Head -->
  <path d="M 152 90 L 170 90 L 170 108" fill="none" stroke="#FF9F0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coin/Value Stack resting inside the chip -->
  <ellipse cx="105" cy="135" rx="18" ry="7" fill="#D69E2E"/>
  <path d="M 87 135 L 87 142 C 87 146 105 149 123 142 L 123 135 C 105 142 87 142 87 135 Z" fill="#B7791F"/>
  
  <ellipse cx="105" cy="126" rx="18" ry="7" fill="#ECC94B"/>
  <path d="M 87 126 L 87 133 C 87 137 105 140 123 133 L 123 126 C 105 133 87 133 87 126 Z" fill="#D69E2E"/>

  <ellipse cx="105" cy="117" rx="18" ry="7" fill="#FEEBC8"/>
  <path d="M 87 117 L 87 124 C 87 128 105 131 123 124 L 123 117 C 105 124 87 124 87 117 Z" fill="#ECC94B"/>

  <!-- Sparkle/Success Indicator -->
  <path d="M 160 65 Q 160 75 170 75 Q 160 75 160 85 Q 160 75 150 75 Q 160 75 160 65 Z" fill="#FFD700"/>
  <path d="M 80 85 Q 80 90 85 90 Q 80 90 80 95 Q 80 90 75 90 Q 80 90 80 85 Z" fill="#FFD700" opacity="0.7"/>

</svg>