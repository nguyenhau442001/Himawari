<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Construction Site Context -->
  <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#334155"/>
  <rect x="180" y="80" width="40" height="100" fill="#475569"/>
  <rect x="190" y="90" width="20" height="80" fill="#334155"/>
  
  <!-- Danger Element: Unstable Load -->
  <path d="M160 60 L200 60 L190 100 L170 100 Z" fill="#fb923c"/>
  <path d="M180 100 L180 140" stroke="#94a3b8" stroke-width="4" stroke-dasharray="4 4"/>
  
  <!-- Character: The one being 'mábì' (distracted/careless) -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 15 Q15 10 20 15 Q25 10 30 15" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#38bdf8"/>
    <rect x="5" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
    <rect x="25" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
    <!-- Distraction: Phone -->
    <rect x="35" y="45" width="15" height="25" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Character: The one pointing out danger -->
  <g transform="translate(120, 130)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 25 Q20 35 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="10" y="40" width="20" height="50" rx="5" fill="#10b981"/>
    <!-- Pointing arm -->
    <path d="M30 50 L50 40" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="40" r="4" fill="#fbbf24"/>
  </g>
  
  <!-- Warning Sign -->
  <path d="M120 20 L140 60 L100 60 Z" fill="#ef4444"/>
  <rect x="118" y="30" width="4" height="15" rx="2" fill="#ffffff"/>
  <circle cx="120" cy="50" r="2" fill="#ffffff"/>
</svg>