<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/ambient circle -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Physical Credit Card representing the physical object "hạn mức/mức trần" -->
  <g transform="translate(45, 65)">
    <!-- Card Shadow -->
    <rect x="0" y="8" width="150" height="96" rx="12" fill="#0D0F13" opacity="0.6"/>
    <!-- Card Body -->
    <rect x="0" y="0" width="150" height="96" rx="12" fill="#2D3748"/>
    <!-- Card Top Gloss / Gradient effect -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H138C144.627 0 150 5.37258 150 12V48H0V12Z" fill="#3B4758"/>
    
    <!-- Chip -->
    <rect x="18" y="32" width="22" height="16" rx="3" fill="#E2E8F0" opacity="0.9"/>
    <rect x="22" y="35" width="14" height="10" rx="1" fill="#CBD5E0" opacity="0.5"/>

    <!-- Contactless Icon -->
    <path d="M124 35C125.5 37 125.5 39 124 41" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
    <path d="M127 33C129.5 36 129.5 40 127 43" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Card Number Lines -->
    <rect x="18" y="60" width="30" height="4" rx="2" fill="#718096"/>
    <rect x="54" y="60" width="30" height="4" rx="2" fill="#718096"/>
    <rect x="90" y="60" width="30" height="4" rx="2" fill="#718096"/>

    <!-- Cardholder Name & Expiry -->
    <rect x="18" y="74" width="45" height="3" rx="1.5" fill="#718096"/>
    <rect x="110" y="74" width="22" height="3" rx="1.5" fill="#718096"/>
  </g>

  <!-- Golden Accent Shield / Limit Cap Overlay representing "trần" (limit/maximum quota) -->
  <g transform="translate(120, 52)">
    <!-- Shield Shadow -->
    <path d="M0 -22C14 -22 28 -25 38 -32V10C38 24 24 36 0 46C-24 36 -38 24 -38 10V-32C-28 -25 -14 -22 0 -22Z" fill="#0D0F13" opacity="0.4"/>
    
    <!-- Shield Base -->
    <path d="M0 -25C15 -25 30 -28 40 -35V8C40 24 23 37 0 48C-23 37 -40 24 -40 8V-35C-30 -28 -15 -25 0 -25Z" fill="#1A202C" stroke="#D69E2E" stroke-width="3"/>
    
    <!-- Inner Shield Accent (Gold) -->
    <path d="M0 -20C13 -20 25 -22.5 33 -28.5V6C33 19.5 19 31 0 40C-19 31 -33 19.5 -33 6V-28.5C-25 -22.5 -13 -20 0 -20Z" fill="#D69E2E" opacity="0.15"/>

    <!-- Upward Limit Arrow (representing limit increase / quota enhancement) -->
    <path d="M0 14V-10M0 -10L-10 0M0 -10L10 0" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle details indicating premium status / approved credit limit -->
  <g fill="#F6AD55">
    <path d="M40 50L42 55L47 57L42 59L40 64L38 59L33 57L38 55L40 50Z"/>
    <path d="M200 110L201 113L204 114L201 115L200 118L199 115L196 114L199 113L200 110Z" opacity="0.7"/>
    <path d="M55 160L56 163L59 164L56 165L55 168L54 165L51 164L54 163L55 160Z" opacity="0.8"/>
  </g>
</svg>