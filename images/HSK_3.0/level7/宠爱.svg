<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle floor line -->
  <path d="M40 190 L200 190" stroke="#333842" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Grandmother character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M30 110 L10 110 C5 110 0 105 0 100 L0 60 C0 40 15 30 30 30 C45 30 60 40 60 60 L60 100 C60 105 55 110 50 110 L30 110" fill="#FFB74D"/>
    <!-- Head -->
    <circle cx="30" cy="30" r="25" fill="#FFCC80"/>
    <!-- Hair -->
    <path d="M10 30 A20 20 0 0 1 50 30" fill="#CFD8DC" stroke="#B0BEC5" stroke-width="4"/>
    <!-- Arm reaching out -->
    <path d="M55 60 L80 80" stroke="#FFB74D" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Grandchild character -->
  <g transform="translate(130, 110)">
    <!-- Body -->
    <path d="M20 80 L5 80 C2 80 0 78 0 75 L0 50 C0 35 10 25 20 25 C30 25 40 35 40 50 L40 75 C40 78 38 80 35 80 L20 80" fill="#4FC3F7"/>
    <!-- Head -->
    <circle cx="20" cy="25" r="18" fill="#FFCC80"/>
    <!-- Hair -->
    <path d="M5 20 C5 10 15 5 20 5 C25 5 35 10 35 20" fill="#5D4037"/>
  </g>
  
  <!-- Interaction: Grandmother patting child's head -->
  <g transform="translate(140, 90)">
    <path d="M0 0 C-10 -10 -20 -10 -30 0" stroke="#FFB74D" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Motion lines -->
    <path d="M-15 -15 L-10 -20" stroke="#FFB74D" stroke-width="2" stroke-linecap="round"/>
    <path d="M-25 -15 L-20 -20" stroke="#FFB74D" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Object: Toy being offered -->
  <g transform="translate(90, 140)">
    <rect x="0" y="0" width="20" height="20" rx="4" fill="#FFD54F"/>
    <circle cx="10" cy="10" r="5" fill="#FFF9C4"/>
  </g>
</svg>