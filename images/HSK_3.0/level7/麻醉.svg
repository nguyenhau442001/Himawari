<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Hospital Bed -->
  <path d="M40 180 L200 180 L190 210 L50 210 Z" fill="#334155"/>
  <rect x="50" y="150" width="140" height="30" rx="5" fill="#e2e8f0"/>
  
  <!-- Patient -->
  <path d="M70 150 C70 120 90 110 110 110 C130 110 150 120 150 150" fill="#fde68a"/>
  <circle cx="110" cy="100" r="15" fill="#fde68a"/>
  <path d="M100 95 L105 100 L100 105 M115 95 L120 100 L115 105" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Doctor -->
  <g transform="translate(150, 80)">
    <rect x="-10" y="0" width="20" height="60" rx="5" fill="#38bdf8"/>
    <circle cx="0" cy="-10" r="15" fill="#fde68a"/>
    <rect x="-15" y="-5" width="30" height="10" fill="#38bdf8"/>
    <path d="M-5 -15 L5 -15" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Syringe Action -->
  <g transform="translate(140, 130) rotate(-20)">
    <rect x="0" y="-2" width="40" height="4" fill="#94a3b8"/>
    <rect x="35" y="-5" width="5" height="10" fill="#ec4899"/>
    <path d="M40 0 L50 0" stroke="#ec4899" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#cbd5e1"/>
  </g>
  
  <!-- Medical Monitor -->
  <rect x="170" y="40" width="50" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <path d="M175 60 L185 50 L195 65 L205 45 L215 55" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="40" r="80" fill="#fb923c" opacity="0.05"/>
</svg>