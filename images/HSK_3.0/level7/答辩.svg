<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="65%" cy="30%" r="70%" fx="65%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Projector Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT: Lecture Hall / Defense Room -->
  <!-- Back Wall / Wooden Paneling Accent -->
  <path d="M 0,165 L 240,165 L 240,240 L 0,240 Z" fill="#0f172a" />
  <line x1="0" y1="165" x2="240" y2="165" stroke="#334155" stroke-width="2" />

  <!-- Window with subtle night city lights -->
  <g opacity="0.3">
    <rect x="15" y="30" width="35" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="38" width="10" height="20" fill="#38bdf8" opacity="0.5"/>
    <rect x="35" y="38" width="10" height="20" fill="#f59e0b" opacity="0.4"/>
    <rect x="20" y="68" width="25" height="15" fill="#f59e0b" opacity="0.3"/>
  </g>

  <!-- Projection Screen (Showing Thesis Diagram) -->
  <g transform="translate(110, 20)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="115" height="70" rx="3" fill="url(#screenGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Abstract Presentation Graphics (Charts & Flow) -->
    <!-- Bar Chart -->
    <rect x="12" y="38" width="8" height="20" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="23" y="28" width="8" height="30" rx="1" fill="#10b981" opacity="0.8"/>
    <rect x="34" y="20" width="8" height="38" rx="1" fill="#f59e0b" opacity="0.9"/>
    
    <!-- Pie/Line Chart Graphic -->
    <path d="M 60,45 Q 75,20 95,30" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="60" cy="45" r="2.5" fill="#ec4899"/>
    <circle cx="95" cy="30" r="2.5" fill="#ec4899"/>
    
    <!-- Title placeholder lines -->
    <line x1="12" y1="12" x2="60" y2="12" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Projector Stand / Pole -->
  <line x1="167" y1="10" x2="167" y2="20" stroke="#64748b" stroke-width="2"/>
  <polygon points="160,0 174,0 170,10 164,10" fill="#475569"/>

  <!-- FURNITURE: Professor Panel Desk -->
  <g transform="translate(115, 140)">
    <!-- Desk Base -->
    <path d="M 0,15 L 115,15 L 110,50 L 5,50 Z" fill="#334155"/>
    <path d="M -5,0 L 120,0 L 115,15 L 0,15 Z" fill="#475569"/>
    
    <!-- Panelists (Silhouetted/Simplified Figures behind desk) -->
    <!-- Professor 1 (Left) -->
    <circle cx="30" cy="-12" r="9" fill="#1e293b"/>
    <path d="M 12,5 Q 30,-5 48,5 Z" fill="#0ea5e9" opacity="0.8"/>
    <!-- Professor 2 (Center) -->
    <circle cx="60" cy="-15" r="9.5" fill="#1e293b"/>
    <path d="M 42,5 Q 60,-8 78,5 Z" fill="#f43f5e" opacity="0.8"/>
    <!-- Professor 3 (Right) -->
    <circle cx="90" cy="-12" r="9" fill="#1e293b"/>
    <path d="M 72,5 Q 90,-5 108,5 Z" fill="#10b981" opacity="0.8"/>

    <!-- Desk Props: Laptops, Folders, Mugs -->
    <rect x="22" y="3" width="14" height="8" rx="1" fill="#cbd5e1"/>
    <rect x="52" y="2" width="16" height="9" rx="1" fill="#94a3b8"/>
    <circle cx="85" cy="6" r="3.5" fill="#fb923c"/>
    <rect x="75" y="4" width="8" height="6" rx="1" fill="#e2e8f0"/>
  </g>

  <!-- MAIN CHARACTER: The Presenter / Student Defending Thesis -->
  <g transform="translate(30, 80)">
    <!-- Shadow -->
    <ellipse cx="32" cy="88" rx="22" ry="6" fill="#020617" opacity="0.6"/>

    <!-- Laser Pointer Beam (Pointing towards Screen) -->
    <path d="M 52,18 L 100,-15" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>

    <!-- Body / Suit -->
    <!-- Legs -->
    <rect x="22" y="55" width="8" height="34" rx="3" fill="#0f172a"/>
    <rect x="36" y="55" width="8" height="34" rx="3" fill="#0f172a"/>
    <!-- Shoes -->
    <path d="M 18,87 L 27,87 A 3,3 0 0 1 30,90 L 20,90 A 2,2 0 0 1 18,87 Z" fill="#020617"/>
    <path d="M 32,87 L 41,87 A 2,2 0 0 1 43,90 L 33,90 A 3,3 0 0 1 32,87 Z" fill="#020617"/>

    <!-- Torso (Smart Casual Blazer & White Shirt) -->
    <path d="M 20,25 L 48,25 L 52,58 L 16,58 Z" fill="#1e293b"/>
    <!-- Inner Shirt & Tie -->
    <polygon points="34,25 30,42 38,42" fill="#f8fafc"/>
    <polygon points="34,30 32,45 36,45" fill="#ef4444"/>
    <!-- Blazer Lapels -->
    <path d="M 34,25 L 26,48 L 20,42 Z" fill="#0f172a"/>
    <path d="M 34,25 L 42,48 L 48,42 Z" fill="#0f172a"/>

    <!-- Head & Face -->
    <circle cx="34" cy="12" r="11" fill="url(#skin)"/>
    <!-- Hair (Neat stylish cut) -->
    <path d="M 23,12 Q 24,1 35,2 Q 46,3 45,13 Q 40,8 34,7 Q 27,7 23,12 Z" fill="#0f0f10"/>
    <!-- Glasses -->
    <rect x="27" y="8" width="6" height="4" rx="1" fill="none" stroke="#334155" stroke-width="1.2"/>
    <rect x="35" y="8" width="6" height="4" rx="1" fill="none" stroke="#334155" stroke-width="1.2"/>
    <line x1="33" y1="10" x2="35" y2="10" stroke="#334155" stroke-width="1.2"/>
    <!-- Confident Expression / Talking Mouth -->
    <path d="M 32,17 Q 34,19 36,17" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms & Gestures -->
    <!-- Left Arm (Holding Notes/Folder down by side) -->
    <path d="M 18,28 L 12,45 L 16,47" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Folder in hand -->
    <rect x="8" y="42" width="10" height="13" rx="1" fill="#f8fafc" transform="rotate(-15 8 42)"/>
    <line x1="10" y1="46" x2="15" y2="46" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="49" x2="14" y2="49" stroke="#94a3b8" stroke-width="1"/>

    <!-- Right Arm (Raised, pointing forward with laser pointer) -->
    <path d="M 50,28 L 56,18 L 52,15" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pointer Pen -->
    <rect x="50" y="13" width="6" height="2" rx="0.5" fill="#f59e0b" transform="rotate(-30 50 13)"/>
  </g>

  <!-- FOREGROUND DETAILS / DEPTH -->
  <!-- Ambient floor gradient/shadows -->
  <path d="M 0,210 Q 120,200 240,210 L 240,240 L 0,240 Z" fill="#090d16" opacity="0.4"/>

  <!-- Podium / Lectern (Foreground Left) -->
  <g transform="translate(70, 150)">
    <!-- Lectern Stand -->
    <polygon points="15,0 35,0 40,55 10,55" fill="#334155"/>
    <rect x="5" y="55" width="40" height="6" rx="2" fill="#1e293b"/>
    <!-- Top Slanted Surface -->
    <polygon points="5,-5 45,-5 40,3 10,3" fill="#475569"/>
    <!-- Open Notes on Lectern -->
    <rect x="15" y="-8" width="20" height="10" rx="1" fill="#f8fafc" transform="rotate(-5 15 -8)"/>
    <line x1="18" y1="-5" x2="28" y2="-6" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="18" y1="-2" x2="25" y2="-3" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Microphone -->
    <path d="M 25,-5 L 25,-18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="25" cy="-20" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Warm accent rim light on presenter from screen/spotlight -->
  <path d="M 73,95 L 82,105 L 78,145" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>