<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Guard Uniform Gradient -->
    <linearGradient id="uniform-guard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Traveler Outfit Gradient -->
    <linearGradient id="outfit-traveler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT: Airport / Border Control Interior -->
  <!-- Floor Grid & Perspective Lines -->
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="2" />
  <path d="M0 215 L240 215" stroke="#1e293b" stroke-width="4" />
  
  <!-- Architectural Backdrop: Large Glass Window showing departure/outside night -->
  <rect x="20" y="30" width="200" height="130" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- Outside Runway / City Lights -->
  <circle cx="60" cy="70" r="2" fill="#ef4444" />
  <circle cx="80" cy="85" r="2" fill="#38bdf8" />
  <circle cx="100" cy="65" r="3" fill="#fbbf24" />
  <circle cx="180" cy="90" r="2" fill="#ef4444" />
  <path d="M20 140 L220 140" stroke="#1e293b" stroke-width="3" />

  <!-- Digital Exit Sign / Boarding Gate Frame -->
  <rect x="140" y="20" width="70" height="25" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
  <!-- Abstract Departure Arrow Icon -->
  <path d="M165 32 L185 32 M177 26 L185 32 L177 38" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Barrier Stanchion / Queue Post -->
  <g filter="url(#shadow)">
    <rect x="25" y="110" width="8" height="85" rx="2" fill="#94a3b8" />
    <circle cx="29" cy="110" r="6" fill="#cbd5e1" />
    <path d="M29 125 L130 150" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 1: Border Security / Guard (Directing Out) -->
  <g id="security-guard" transform="translate(10, 0)" filter="url(#shadow)">
    <!-- Guard Shadow -->
    <ellipse cx="65" cy="190" rx="15" ry="5" fill="#020617" opacity="0.5" />
    
    <!-- Guard Legs -->
    <rect x="58" y="150" width="7" height="42" rx="3.5" fill="#0f172a" />
    <rect x="67" y="150" width="7" height="42" rx="3.5" fill="#0f172a" />
    <path d="M56 190 L63 190 L63 194 L56 194 Z" fill="#334155" />
    <path d="M66 190 L73 190 L73 194 L66 194 Z" fill="#334155" />

    <!-- Guard Torso & Uniform -->
    <path d="M50 115 L82 115 L88 152 L44 152 Z" fill="url(#uniform-guard)" />
    <!-- Belt -->
    <rect x="44" y="145" width="44" height="6" fill="#0f172a" />
    <rect x="60" y="145" width="12" height="6" fill="#fbbf24" rx="1" />

    <!-- Guard Head & Cap -->
    <circle cx="66" cy="95" r="13" fill="#fcd34d" />
    <!-- Guard Cap -->
    <path d="M52 90 L80 90 L77 82 L55 82 Z" fill="#0369a1" />
    <rect x="51" y="88" width="30" height="3" rx="1" fill="#0284c7" />
    <ellipse cx="66" cy="89" rx="12" ry="3" fill="#0f172a" />

    <!-- Pointing Arm (Authoritative gesture) -->
    <path d="M80 120 L105 110" stroke="#0284c7" stroke-width="9" stroke-linecap="round" />
    <circle cx="107" cy="109" r="5" fill="#fcd34d" />
  </g>

  <!-- CHARACTER 2: The Deported Traveler (Leaving, carrying luggage, distressed/resigned) -->
  <g id="traveler" transform="translate(15, 0)" filter="url(#shadow)">
    <!-- Traveler Shadow -->
    <ellipse cx="120" cy="192" rx="16" ry="5" fill="#020617" opacity="0.6" />

    <!-- Rolling Suitcase (Prop) -->
    <g transform="translate(145, 155)">
      <rect x="0" y="0" width="22" height="32" rx="4" fill="#38bdf8" />
      <rect x="3" y="4" width="16" height="8" rx="2" fill="#0284c7" />
      <path d="M11 0 L11 -8" stroke="#94a3b8" stroke-width="2" />
      <path d="M7 -8 L15 -8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <circle cx="6" cy="34" r="3" fill="#334155" />
      <circle cx="16" cy="34" r="3" fill="#334155" />
    </g>

    <!-- Traveler Legs (Walking pose away) -->
    <path d="M110 150 L104 190" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <path d="M125 150 L132 188" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <ellipse cx="101" cy="191" rx="5" ry="2.5" fill="#334155" />
    <ellipse cx="134" cy="190" rx="5" ry="2.5" fill="#334155" />

    <!-- Traveler Torso & Backpack -->
    <!-- Backpack -->
    <path d="M98 115 L114 118 L112 145 L96 142 Z" fill="#475569" />
    <!-- Body -->
    <path d="M106 112 L132 118 L126 152 L100 148 Z" fill="url(#outfit-traveler)" />

    <!-- Traveler Head & Hair (Slumped forward slightly) -->
    <circle cx="122" cy="92" r="12" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M110 92 C110 82, 130 82, 132 90 C128 87, 116 87, 110 92 Z" fill="#78350f" />
    <!-- Sad/Resigned Facial Expression (Profile-ish hint) -->
    <path d="M128 94 Q131 97 129 99" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Traveler Arms -->
    <!-- Arm pulling suitcase -->
    <path d="M124 125 L145 150" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <circle cx="146" cy="152" r="4" fill="#fcd34d" />
  </g>

  <!-- FOREGROUND ELEMENTS: Subtle depth blur/vignette -->
  <!-- Floor edge highlight -->
  <path d="M0 190 L240 190" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
</svg>