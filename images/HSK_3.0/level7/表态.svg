<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Meeting Room Table -->
  <rect x="20" y="140" width="200" height="60" rx="8" fill="#334155"/>
  <ellipse cx="120" cy="140" rx="100" ry="20" fill="#475569"/>
  
  <!-- The Leader (Subject) -->
  <g transform="translate(120, 80)">
    <circle cx="0" cy="0" r="25" fill="#f1f5f9"/>
    <path d="M-10 -5 h20 M-5 10 q5 5 10 0" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="-30" y="25" width="60" height="40" rx="5" fill="#fbbf24"/>
    <rect x="-35" y="25" width="70" height="10" rx="2" fill="#f59e0b"/>
  </g>
  
  <!-- Employees (Waiting) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="0" r="18" fill="#94a3b8"/>
    <rect x="-20" y="18" width="40" height="30" rx="5" fill="#38bdf8"/>
  </g>
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="18" fill="#94a3b8"/>
    <rect x="-20" y="18" width="40" height="30" rx="5" fill="#ec4899"/>
  </g>
  
  <!-- Context Props: Documents/Charts -->
  <rect x="40" y="150" width="30" height="40" rx="2" fill="#e2e8f0"/>
  <rect x="170" y="150" width="30" height="40" rx="2" fill="#e2e8f0"/>
  <line x1="45" y1="160" x2="65" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="160" x2="195" y2="160" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Suspense/Waiting Indicator -->
  <g transform="translate(120, 60)">
    <circle cx="0" cy="0" r="4" fill="#fb923c">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="0" r="4" fill="#fb923c">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="0" r="4" fill="#fb923c">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>