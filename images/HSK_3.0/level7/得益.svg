<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mentor figure (The source of benefit) -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="25" r="15" fill="#FFB86C"/>
    <path d="M15 50 Q30 40 45 50 L40 90 L20 90 Z" fill="#44475A"/>
    <path d="M25 60 L35 60" stroke="#1A1D24" stroke-width="2"/>
    <path d="M30 50 L30 70" stroke="#FFB86C" stroke-width="2"/>
  </g>

  <!-- Student figure (The recipient) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="12" fill="#8BE9FD"/>
    <path d="M8 40 Q20 30 32 40 L28 80 L12 80 Z" fill="#6272A4"/>
    <path d="M15 50 L25 50" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- The "Benefit/Knowledge" transfer: A glowing book/document -->
  <g transform="translate(95, 110)">
    <rect x="0" y="0" width="40" height="30" rx="2" fill="#F8F8F2"/>
    <path d="M5 5 L35 5 M5 10 L35 10 M5 15 L35 15" stroke="#1A1D24" stroke-width="2"/>
    <path d="M20 0 L20 30" stroke="#1A1D24" stroke-width="1"/>
  </g>

  <!-- Connecting gesture -->
  <path d="M90 100 Q110 80 130 100" stroke="#FFB86C" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
</svg>