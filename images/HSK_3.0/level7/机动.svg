<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Planning Desk -->
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Projector / Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & BACKGROUND DETAILS -->
  <!-- Ambient Wall Accents -->
  <path d="M 0,0 L 240,0 L 240,240 L 0,240 Z" fill="none"/>
  
  <!-- Window Frame in Background (Flexibility / Future view) -->
  <rect x="150" y="25" width="60" height="85" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="154" y="29" width="52" height="77" rx="2" fill="url(#windowLight)"/>
  <line x1="180" y1="29" x2="180" y2="106" stroke="#1e293b" stroke-width="2"/>
  <line x1="154" y1="67" x2="206" y2="67" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Hanging Plant (Life/Organic touch) -->
  <path d="M 35,10 Q 40,0 45,10" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="40" cy="10" r="10" fill="#334155"/>
  <path d="M 33,12 Q 30,22 36,28 Q 40,20 33,12 Z" fill="#10b981"/>
  <path d="M 47,12 Q 52,24 44,30 Q 40,20 47,12 Z" fill="#34d399"/>
  <path d="M 40,14 Q 40,28 40,35 Q 40,28 40,14 Z" fill="#059669"/>

  <!-- Wall Shelf with Books & Clock -->
  <rect x="25" y="45" width="70" height="4" rx="2" fill="#475569"/>
  <rect x="35" y="25" width="12" height="20" rx="2" fill="#ef4444"/>
  <rect x="49" y="28" width="10" height="17" rx="2" fill="#3b82f6"/>
  <rect x="61" y="22" width="14" height="23" rx="2" fill="#10b981"/>
  <!-- Circular Wall Clock showing "buffer time" -->
  <circle cx="85" cy="32" r="8" fill="#f8fafc"/>
  <circle cx="85" cy="32" r="1" fill="#0f172a"/>
  <line x1="85" y1="32" x2="85" y2="28" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="85" y1="32" x2="89" y2="34" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- WORKSPACE DESK & LIGHTING -->
  <circle cx="115" cy="165" r="70" fill="url(#deskGlow)"/>
  
  <!-- Desk Surface -->
  <path d="M 20,175 L 220,175 L 205,210 L 35,210 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M 20,175 L 220,175 L 220,181 L 20,181 Z" fill="#475569"/> <!-- Desk Edge -->

  <!-- CHAIR BACK -->
  <path d="M 85,150 L 145,150 L 150,195 L 80,195 Z" fill="#1e293b" opacity="0.6"/>

  <!-- MAIN CHARACTER: Planner / Designer -->
  <!-- Body / Torso (Warm Orange Hoodie / Professional Casual) -->
  <path d="M 90,165 Q 115,145 140,165 L 145,210 L 85,210 Z" fill="#fb923c" filter="url(#shadow)"/>
  <path d="M 115,155 L 115,185" stroke="#ea580c" stroke-width="2"/> <!-- Hoodie zipper line -->
  
  <!-- Neck & Head -->
  <rect x="107" y="125" width="16" height="25" rx="8" fill="#fdba74"/>
  <path d="M 98,115 Q 115,95 132,115 Q 138,135 115,138 Q 92,135 98,115 Z" fill="#3b2f2f"/> <!-- Hair -->

  <!-- Expressive Face (Thoughtful, creative focus) -->
  <circle cx="111" cy="128" r="2" fill="#1e293b"/>
  <circle cx="119" cy="128" r="2" fill="#1e293b"/>
  <!-- Gentle smile / concentrated -->
  <path d="M 113,135 Q 115,137 117,135" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glasses -->
  <rect x="108" y="124" width="7" height="5" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="116" y="124" width="7" height="5" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="115" y1="126" x2="116" y2="126" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Arms & Hands -->
  <!-- Left arm holding pen -->
  <path d="M 95,160 Q 80,170 85,185" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="85" cy="186" r="5" fill="#fdba74"/>
  <!-- Right arm gesturing flexibility -->
  <path d="M 135,160 Q 155,165 145,185" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="145" cy="186" r="5" fill="#fdba74"/>


  <!-- PROPS: THE "FLEXIBLE PLAN" (机动余地 concept visualization) -->
  
  <!-- Large Project Plan / Sticky Notes Board on Desk -->
  <g transform="translate(65, 135)">
    <!-- Base Paper / Timeline -->
    <rect x="15" y="15" width="70" height="45" rx="3" fill="#f8fafc" transform="rotate(-5 50 35)" filter="url(#shadow)"/>
    
    <!-- Timeline bars (Rigid schedule block) -->
    <rect x="23" y="24" width="22" height="10" rx="2" fill="#cbd5e1" transform="rotate(-5 50 35)"/>
    <rect x="48" y="24" width="18" height="10" rx="2" fill="#cbd5e1" transform="rotate(-5 50 35)"/>
    
    <!-- THE "MOBILITY / BUFFER" SPACE: Highlighted Empty Space with Expansion Arrows -->
    <rect x="69" y="24" width="12" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="2 1" stroke-width="1" transform="rotate(-5 50 35)"/>
    
    <!-- Expansion / Flexibility indicator arrows over the gap -->
    <path d="M 85,25 L 89,29 L 85,33" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 93,25 L 89,29 L 93,33" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sub-tasks lines -->
    <line x1="23" y1="40" x2="65" y2="39" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" transform="rotate(-5 50 35)"/>
    <line x1="23" y1="48" x2="55" y2="47" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" transform="rotate(-5 50 35)"/>
  </g>

  <!-- Laptop on Desk displaying dynamic schedule -->
  <g transform="translate(135, 140)">
    <!-- Laptop Base -->
    <path d="M -5,35 L 45,35 L 50,42 L -10,42 Z" fill="#64748b"/>
    <rect x="15" y="37" width="10" height="3" rx="1.5" fill="#475569"/>
    <!-- Laptop Screen -->
    <path d="M 0,0 L 40,0 L 40,36 L 0,36 Z" fill="#1e293b" rx="2"/>
    <rect x="3" y="3" width="34" height="30" rx="1" fill="url(#screenGlow)"/>
    
    <!-- UI Elements inside screen: Flexible graph -->
    <polyline points="6,28 14,22 22,25 34,12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flexible buffer zone highlighted on chart -->
    <rect x="22" y="10" width="14" height="18" fill="#38bdf8" opacity="0.15" rx="1"/>
    <circle cx="34" cy="12" r="2.5" fill="#10b981"/>
  </g>

  <!-- Coffee Mug (Cozy productivity prop) -->
  <g transform="translate(40, 160)">
    <rect x="0" y="5" width="12" height="15" rx="3" fill="#f8fafc"/>
    <path d="M 12,8 Q 16,8 16,12 Q 16,16 12,16" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam -->
    <path d="M 3,1 Q 5,-2 3,-5" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 8,2 Q 10,-1 8,-4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Pen in Hand -->
  <path d="M 80,188 L 65,198" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 65,198 L 62,201" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

</svg>