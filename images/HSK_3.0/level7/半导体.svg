<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative circuit traces -->
  <g stroke="#262B36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <path d="M30 120 h40 l20 -20 h30"/>
    <path d="M210 120 h-40 l-20 20 h-30"/>
    <path d="M120 30 v40 l20 20 v30"/>
    <path d="M120 210 v-40 l-20 -20 v-30"/>
    <circle cx="90" cy="100" r="3" fill="#262B36"/>
    <circle cx="150" cy="140" r="3" fill="#262B36"/>
  </g>

  <!-- Central Semiconductor (Silicon Die + Microchip representation) -->
  <g transform="translate(120, 120)">
    <!-- Outer Chip Package / Pins -->
    <!-- Top Pins -->
    <rect x="-35" y="-56" width="6" height="12" rx="1" fill="#4F5D75"/>
    <rect x="-15" y="-56" width="6" height="12" rx="1" fill="#4F5D75"/>
    <rect x="5" y="-56" width="6" height="12" rx="1" fill="#4F5D75"/>
    <rect x="25" y="-56" width="6" height="12" rx="1" fill="#4F5D75"/>
    
    <!-- Bottom Pins -->
    <rect x="-35" y="44" width="6" height="12" rx="1" fill="#4F5D75"/>
    <rect x="-15" y="44" width="6" height="12" rx="1" fill="#4F5D75"/>
    <rect x="5" y="44" width="6" height="12" rx="1" fill="#4F5D75"/>
    <rect x="25" y="44" width="6" height="12" rx="1" fill="#4F5D75"/>

    <!-- Left Pins -->
    <rect x="-56" y="-35" width="12" height="6" rx="1" fill="#4F5D75"/>
    <rect x="-56" y="-15" width="12" height="6" rx="1" fill="#4F5D75"/>
    <rect x="-56" y="5" width="12" height="6" rx="1" fill="#4F5D75"/>
    <rect x="-56" y="25" width="12" height="6" rx="1" fill="#4F5D75"/>

    <!-- Right Pins -->
    <rect x="44" y="-35" width="12" height="6" rx="1" fill="#4F5D75"/>
    <rect x="44" y="-15" width="12" height="6" rx="1" fill="#4F5D75"/>
    <rect x="44" y="5" width="12" height="6" rx="1" fill="#4F5D75"/>
    <rect x="44" y="25" width="12" height="6" rx="1" fill="#4F5D75"/>

    <!-- Main Chip Body -->
    <rect x="-44" y="-44" width="88" height="88" rx="8" fill="#111418" stroke="#323846" stroke-width="3"/>
    
    <!-- Notch / Orientation Marker -->
    <circle cx="0" cy="-34" r="3" fill="#2A303C"/>

    <!-- Inner Silicon Substrate / "Half" visual metaphor -->
    <rect x="-30" y="-30" width="60" height="60" rx="4" fill="#1E232D" stroke="#3A4454" stroke-width="1.5"/>

    <!-- Split Concept Design: Left side insulating/dark, Right side conductive/glowing gold -->
    <!-- Left Half (Insulator/Control side - Slate Blue) -->
    <path d="M-30 -30 h30 v60 h-30 z" fill="#222834"/>
    
    <!-- Right Half (Conductor/Active side - Vibrant Gold/Orange accent) -->
    <path d="M0 -30 h30 a4 4 0 0 1 4 4 v52 a4 4 0 0 1 -4 4 h-30 z" fill="#FFB703" fill-opacity="0.15"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#FFB703" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Microchip Circuitry Inner Details -->
    <g stroke="#FFB703" stroke-width="1.5" stroke-linecap="round" fill="none">
      <!-- Right Side active traces -->
      <path d="M8 -15 h10 v30 h-10"/>
      <circle cx="18" cy="0" r="2.5" fill="#FFB703"/>
      <path d="M0 15 h8 v-8"/>
      <path d="M0 -15 h8 v8"/>
    </g>

    <g stroke="#566573" stroke-width="1.5" stroke-linecap="round" fill="none">
      <!-- Left Side passive traces -->
      <path d="M-8 -15 h-10 v30 h10"/>
      <circle cx="-18" cy="0" r="2" fill="#566573"/>
      <path d="M0 15 h-8 v-8"/>
      <path d="M0 -15 h-8 v8"/>
    </g>

    <!-- Center Core Node -->
    <circle cx="0" cy="0" r="6" fill="#111418" stroke="#FFB703" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#FFB703"/>
  </g>
</svg>