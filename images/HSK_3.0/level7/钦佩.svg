<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient for Hero -->
    <radialGradient id="spotlight" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- UI Glow Gradient -->
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting & Spotlight -->
  <circle cx="150" cy="110" r="100" fill="url(#spotlight)" />

  <!-- Background Environment / Rescue / Mountain Rescue Control Center -->
  <!-- Back Wall & Architecture -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#111827" />
  <rect x="0" y="166" width="240" height="4" fill="#334155" />
  
  <!-- Large Observation Window showing steep cliff/mountain outside -->
  <g opacity="0.8">
    <rect x="25" y="45" width="80" height="105" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <!-- Mountain Peak Silhouette outside -->
    <path d="M25 150 L50 90 L70 115 L95 75 L105 150 Z" fill="#1e293b" />
    <!-- Light Beam coming through window -->
    <polygon points="25,45 105,45 140,170 25,170" fill="url(#lightBeam)" />
    <!-- Rain / Elements outside -->
    <line x1="40" y1="60" x2="35" y2="80" stroke="#94a3b8" stroke-width="1" opacity="0.4" />
    <line x1="65" y1="50" x2="60" y2="75" stroke="#94a3b8" stroke-width="1" opacity="0.4" />
    <line x1="85" y1="70" x2="80" y2="95" stroke="#94a3b8" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Control Desk / Technical Props -->
  <rect x="110" y="145" width="115" height="35" rx="3" fill="#334155" />
  <rect x="115" y="152" width="45" height="22" rx="2" fill="#0f172a" />
  <!-- Screen Waveform (Bravery / Rescue Monitor) -->
  <path d="M120 163 L126 163 L130 156 L134 170 L138 160 L142 163 L150 163" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Coffee Mug -->
  <rect x="175" y="152" width="12" height="15" rx="2" fill="#cbd5e1" />
  <path d="M187 156 C191 156, 191 163, 187 163" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Hanging Gear / Rescue Rope Coil on Wall -->
  <circle cx="150" cy="85" r="14" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 3" />

  <!-- CHARACTER 2: The Brave Explorer / Climber (Hero in Photo on Desk / Projected or Standing) -->
  <!-- Let's feature the admired person on a digital holographic display or framed portrait on the desk representing their courageous act -->
  <g transform="translate(195, 115)">
    <!-- Hologram/Photo Frame base -->
    <rect x="-18" y="-5" width="36" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <rect x="-14" y="0" width="28" height="28" rx="2" fill="#0f172a" />
    <!-- Climber silhouette with red jacket (Courage) -->
    <path d="M0 8 L5 18 L-5 18 Z" fill="#ef4444" />
    <circle cx="0" cy="4" r="3.5" fill="#f8fafc" />
    <path d="M-6 22 L6 22" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- CHARACTER 1: The Observer (Expressing deep admiration / 钦佩) -->
  <g transform="translate(100, 105)">
    <!-- Body & Torso (Leaning slightly forward in awe/respect) -->
    <path d="M20 65 C20 48, 30 38, 48 38 C66 38, 76 48, 76 65 L72 105 L24 105 Z" fill="#0284c7" />
    
    <!-- Arm Gestures (Hand placed over heart / chest showing sincerity and deep respect) -->
    <!-- Left arm resting on desk -->
    <path d="M24 55 L5 75 L-15 75" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right arm bent with hand touching chest (欽佩 gesture) -->
    <path d="M68 52 C55 52, 45 58, 48 68" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="48" cy="68" r="5" fill="#fbcfe8" /> <!-- Hand on chest -->

    <!-- Neck -->
    <rect x="42" y="30" width="12" height="12" rx="3" fill="#fbcfe8" />

    <!-- Head (Slightly tilted up, warm expression, looking at the achievement/hero) -->
    <circle cx="48" cy="20" r="16" fill="#fbcfe8" />
    
    <!-- Hair (Neat, friendly dark hair) -->
    <path d="M32 20 C32 10, 40 4, 48 4 C56 4, 64 10, 64 20 C64 22, 63 15, 60 11 C55 6, 41 6, 36 11 C33 15, 32 20, 32 20 Z" fill="#334155" />

    <!-- Facial Expression (Eyes wide with admiration, subtle gentle smile) -->
    <!-- Eyes (curved happily looking up-right) -->
    <path d="M41 19 Q44 16 47 19" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M51 19 Q54 16 57 19" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Gentle Smile -->
    <path d="M45 25 Q48 28 51 25" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Warm Emotional Sparks / Glow representing respect and awe -->
    <g transform="translate(62, 5)">
      <path d="M0 6 L3 3 L0 0 L-3 3 Z" fill="#fbbf24" opacity="0.9" />
    </g>
    <g transform="translate(30, 2)">
      <path d="M0 4 L2 2 L0 0 L-2 2 Z" fill="#fbbf24" opacity="0.7" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Depth of field) -->
  <!-- Desk Edge Highlight -->
  <rect x="0" y="176" width="240" height="64" fill="#0f172a" />
  <rect x="0" y="176" width="240" height="3" fill="#475569" />

  <!-- Floating Golden Sparkles / Aura of Admiration -->
  <circle cx="115" cy="85" r="2.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="135" cy="70" r="1.5" fill="#f59e0b" opacity="0.9" />
  <circle cx="95" cy="95" r="2" fill="#fbbf24" opacity="0.6" />
  <path d="M125,50 Q128,45 131,50 Q128,55 125,50 Z" fill="#fbbf24" opacity="0.7" />

  <!-- Vignette / Frame border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>