<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" fill="url(#lampGlow)" />

  <!-- Background Environment: Cozy Bedroom / Home Desk at night -->
  <!-- Bookshelf / Wall details -->
  <rect x="25" y="40" width="45" height="8" rx="4" fill="#334155" />
  <rect x="35" y="22" width="25" height="18" rx="2" fill="#475569" />
  <rect x="32" y="48" width="51" height="6" rx="3" fill="#1e293b" />
  <!-- Warm soft ambient window light or night lamp -->
  <circle cx="195" cy="55" r="22" fill="#334155" opacity="0.4" />
  <path d="M190 35 L200 35 L202 75 L188 75 Z" fill="#475569" opacity="0.3" />
  <path d="M180 75 L210 75 L215 80 L175 80 Z" fill="#64748b" opacity="0.4" />

  <!-- Desk Surface -->
  <path d="M10 190 L230 190 L235 210 L5 210 Z" fill="#090d16" />
  <rect x="0" y="186" width="240" height="6" rx="3" fill="#334155" />

  <!-- Context Props on Desk -->
  <!-- Hot Tea Mug with steam -->
  <path d="M180 160 L205 160 C208 160 210 162 210 165 L207 184 C207 187 205 189 202 189 L183 189 C180 189 178 187 178 184 L175 165 C175 162 177 160 180 160 Z" fill="url(#cupGrad)" />
  <path d="M210 168 C215 168 218 171 218 175 C218 179 215 182 210 182" stroke="#fb7185" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Steam wisps -->
  <path d="M187 152 C185 146 193 142 191 136" stroke="url(#steamGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M197 155 C195 150 201 146 199 140" stroke="url(#steamGrad)" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Medicine bottle / box -->
  <rect x="145" y="165" width="20" height="24" rx="3" fill="#e2e8f0" />
  <rect x="148" y="171" width="14" height="12" rx="1" fill="#0ea5e9" />
  <rect x="150" y="157" width="10" height="8" rx="2" fill="#cbd5e1" />

  <!-- MAIN CHARACTER -->
  <!-- Chair back -->
  <path d="M75 105 L95 105 L95 190 L75 190 Z" fill="#334155" rx="4" opacity="0.6"/>

  <!-- Body / Hoodie / Sweater -->
  <path d="M75 155 C75 135 95 125 120 125 C145 125 165 135 165 155 L175 190 C175 190 150 192 120 192 C90 192 65 190 65 190 Z" fill="#38bdf8" />
  <path d="M95 135 C95 135 105 145 120 145 C135 145 145 135 145 135" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="110" y="112" width="20" height="20" fill="#fed7aa" />

  <!-- Head -->
  <circle cx="120" cy="95" r="32" fill="#fed7aa" />

  <!-- Hair Style (Stylized modern fringe) -->
  <path d="M89 90 C88 70 102 62 120 62 C142 62 153 74 153 92 C153 95 152 98 152 98 C152 98 145 80 123 80 C101 80 91 94 89 90 Z" fill="#334155" />

  <!-- Facial Expressions (Showing discomfort/throat pain) -->
  <!-- Closed eyes / strained expression (angled eyebrows) -->
  <path d="M102 92 L112 95" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M128 95 L138 92" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M104 88 L111 91" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <path d="M136 91 L129 88" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Flush cheeks due to fever/pain -->
  <circle cx="103" cy="103" r="6" fill="#f43f5e" opacity="0.3" />
  <circle cx="137" cy="103" r="6" fill="#f43f5e" opacity="0.3" />

  <!-- Open grimacing/hurting mouth -->
  <path d="M115 110 C115 108 125 108 125 110 C125 114 115 114 115 110 Z" fill="#991b1b" />

  <!-- HANDS ACTIVELY TOUCHING/GRABBING THE THROAT (CRUCIAL VISUAL CUE) -->
  <path d="M100 135 C100 120 110 115 120 115 C130 115 140 120 140 135 L135 135 C135 125 128 120 120 120 C112 120 105 125 105 135 Z" fill="#fed7aa" />
  <!-- Fingers gripping the neck -->
  <circle cx="112" cy="120" r="4" fill="#fed7aa" />
  <circle cx="128" cy="120" r="4" fill="#fed7aa" />
  <path d="M108 116 L114 122" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" />
  <path d="M132 116 L126 122" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" />

  <!-- Pain Indicator / Spark / Glow effects near neck -->
  <path d="M100 105 C95 100 97 95 92 90" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M140 105 C145 100 143 95 148 90" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <circle cx="120" cy="100" r="1.5" fill="#ef4444" />
</svg>