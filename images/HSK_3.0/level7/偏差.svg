<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- UI Glow & Accents -->
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="rose-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Desk & Furniture Gradients -->
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Office / Lab Interior Details -->
  <!-- Window / City Skyline View -->
  <g opacity="0.15">
    <rect x="160" y="30" width="50" height="70" rx="4" fill="#38bdf8" />
    <rect x="170" y="40" width="12" height="20" fill="#0f172a" />
    <rect x="190" y="40" width="12" height="20" fill="#0f172a" />
    <rect x="170" y="70" width="12" height="20" fill="#0f172a" />
    <rect x="190" y="70" width="12" height="20" fill="#0f172a" />
  </g>

  <!-- Bookshelf / Lab Props in Background -->
  <rect x="25" y="40" width="40" height="60" rx="2" fill="#334155" opacity="0.4" />
  <rect x="30" y="50" width="30" height="4" fill="#64748b" opacity="0.5" />
  <rect x="30" y="65" width="30" height="4" fill="#38bdf8" opacity="0.5" />
  <rect x="30" y="80" width="30" height="4" fill="#f59e0b" opacity="0.5" />

  <!-- Ambient Light Cone -->
  <polygon points="120,0 20,200 220,200" fill="#38bdf8" opacity="0.03" />

  <!-- Work Desk -->
  <rect x="20" y="175" width="200" height="35" rx="4" fill="url(#wood-desk)" filter="url(#shadow)" />
  <rect x="20" y="175" width="200" height="6" fill="#475569" opacity="0.6" />

  <!-- Office Chair Backrest -->
  <path d="M 170,110 C 170,95 195,95 195,110 L 195,175 L 170,175 Z" fill="#334155" />

  <!-- CHARACTER -->
  <!-- Character Body / Torso -->
  <path d="M 125,180 C 125,155 145,145 160,145 C 175,145 195,155 195,180 Z" fill="#0ea5e9" />
  <!-- Collar / Shirt Detail -->
  <polygon points="152,145 160,158 168,145" fill="#f8fafc" />

  <!-- Character Neck & Head -->
  <rect x="153" y="128" width="14" height="22" rx="7" fill="#fcd34d" />
  <circle cx="160" cy="115" r="18" fill="#fcd34d" />
  
  <!-- Hair -->
  <path d="M 142,112 C 142,98 155,95 160,95 C 168,95 178,100 180,112 C 180,112 178,104 168,102 C 158,100 144,106 142,112 Z" fill="#334155" />

  <!-- Concerned Facial Expression / Eyebrows tilted -->
  <line x1="150" y1="110" x2="156" y2="112" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <line x1="164" y1="112" x2="170" y2="110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="153" cy="116" r="1.5" fill="#1e293b" />
  <circle cx="167" cy="116" r="1.5" fill="#1e293b" />
  <!-- Mouth (Slight frown/concerned) -->
  <path d="M 157,123 Q 160,120 163,123" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms / Hands -->
  <!-- Right Arm reaching toward keyboard/desk -->
  <path d="M 145,155 Q 135,165 125,160" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" />
  <circle cx="123" cy="159" r="4" fill="#fcd34d" />

  <!-- Desktop Computer Setup (Main Context Prop) -->
  <!-- Monitor Stand -->
  <rect x="85" y="145" width="16" height="30" fill="#475569" />
  <ellipse cx="93" cy="175" rx="22" ry="4" fill="#64748b" />

  <!-- Monitor Frame -->
  <rect x="45" y="70" width="96" height="78" rx="8" fill="#334155" filter="url(#shadow)" />
  <rect x="49" y="74" width="88" height="70" rx="4" fill="url(#screen-glow)" />

  <!-- DATA VISUALIZATION ON SCREEN (Crucial for "偏差" / Deviation concept) -->
  <!-- Grid lines inside screen -->
  <line x1="57" y1="130" x2="129" y2="130" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="57" y1="110" x2="129" y2="110" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="57" y1="90" x2="129" y2="90" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="65" y1="78" x2="65" y2="136" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Ideal Target Line (Dashed Smooth Curve) -->
  <path d="M 65,120 Q 85,100 105,100 T 125,95" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" stroke-dasharray="3 3" />

  <!-- Actual Measured Data Line (Showing Deviation / 偏差) -->
  <path d="M 65,122 Q 83,115 102,82 T 125,78" fill="none" stroke="url(#amber-glow)" stroke-width="3" stroke-linecap="round" />

  <!-- Data Point Indicators -->
  <circle cx="102" cy="100" r="3" fill="#38bdf8" />
  <circle cx="102" cy="82" r="4" fill="#f59e0b" />
  <circle cx="125" cy="78" r="4.5" fill="#f43f5e" />

  <!-- Explicit Deviation Gap Visual Indicator (Double Arrow / Bracket showing gap) -->
  <line x1="102" y1="100" x2="102" y2="82" stroke="url(#rose-glow)" stroke-width="2" stroke-dasharray="1 1" />
  <!-- Small indicator bracket showing the "Gap / 偏差" -->
  <path d="M 98,91 L 96,91 L 96,86 L 98,86" fill="none" stroke="#f43f5e" stroke-width="1.5" />
  <path d="M 106,91 L 108,91 L 108,86 L 106,86" fill="none" stroke="#f43f5e" stroke-width="1.5" />

  <!-- Foreground Props on Desk -->
  <!-- Coffee Mug -->
  <rect x="28" y="155" width="14" height="20" rx="3" fill="#cbd5e1" />
  <path d="M 42,160 C 47,160 47,170 42,170" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 32,150 Q 35,145 38,150" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6" />

  <!-- Keyboard -->
  <rect x="75" y="182" width="60" height="14" rx="2" fill="#475569" />
  <line x1="80" y1="186" x2="130" y2="186" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2" />
  <line x1="80" y1="190" x2="125" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Floating Analytical Alert Badge (Graphic representation of data checking) -->
  <g transform="translate(115, 38)" filter="url(#shadow)">
    <rect x="0" y="0" width="55" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Warning Icon / Exclamation inside badge -->
    <circle cx="12" cy="12" r="6" fill="#f59e0b" opacity="0.2" />
    <circle cx="12" cy="12" r="2.5" fill="#f59e0b" />
    <!-- Mini zigzag trend line icon -->
    <polyline points="24,15 28,9 33,13 39,8 45,14" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>