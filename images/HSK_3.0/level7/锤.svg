<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Rock Gradient -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="rockInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Hammer Head Gradient -->
    <linearGradient id="hammerHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Hammer Handle Gradient -->
    <linearGradient id="hammerHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow/Impact Gradient -->
    <radialGradient id="impactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground Shadow -->
    <ellipse id="shadow" cx="0" cy="0" rx="1" ry="1" fill="#020617" opacity="0.5"/>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Cave Details -->
  <g fill="#1e293b" opacity="0.6">
    <path d="M 20 220 L 20 180 Q 40 160 50 180 Q 70 150 90 180 L 220 180 L 220 220 Z"/>
    <circle cx="190" cy="70" r="30" fill="#334155" opacity="0.3"/>
    <circle cx="40" cy="90" r="15" fill="#334155" opacity="0.2"/>
  </g>

  <!-- Ground plane -->
  <ellipse cx="130" cy="210" rx="90" ry="15" fill="#090d16"/>

  <!-- Falling Debris / Dust Particles -->
  <g fill="#cbd5e1" opacity="0.8">
    <circle cx="105" cy="180" r="3" />
    <circle cx="155" cy="175" r="4" />
    <circle cx="95" cy="190" r="2" />
    <circle cx="165" cy="185" r="2.5" />
    <circle cx="130" cy="165" r="3.5" />
  </g>

  <!-- Impact Flash / Sparks -->
  <g transform="translate(125, 175)">
    <circle cx="0" cy="0" r="25" fill="url(#impactGlow)"/>
    <path d="M -15 -15 L 15 15 M -15 15 L 15 -15 M 0 -22 L 0 22 M -22 0 L 22 0" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- THE STONE (Split open) -->
  <g>
    <!-- Stone Base Shadow -->
    <ellipse cx="130" cy="195" rx="55" ry="12" fill="#090d16" opacity="0.4"/>
    
    <!-- Left Half of Stone -->
    <path d="M 125 190 L 80 185 C 70 185 65 170 75 160 C 80 155 90 145 105 150 C 115 153 122 170 125 190 Z" fill="url(#rockGrad)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left Inner Crystal/Crack Face -->
    <path d="M 125 190 C 122 170 115 153 105 150 C 100 165 110 180 125 190 Z" fill="url(#rockInnerGrad)" opacity="0.9"/>
    
    <!-- Right Half of Stone (Pushed slightly away by impact) -->
    <path d="M 130 190 L 175 188 C 185 188 192 172 182 162 C 175 155 160 145 145 152 C 135 156 130 170 130 190 Z" fill="url(#rockGrad)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right Inner Crystal/Crack Face -->
    <path d="M 130 190 C 130 170 135 156 145 152 C 150 165 140 180 130 190 Z" fill="url(#rockInnerGrad)" opacity="0.9"/>

    <!-- Glowing Gem/Crystal inside the broken rock -->
    <polygon points="122,172 133,168 135,178 123,180" fill="#38bdf8" filter="drop-shadow(0px 0px 4px #38bdf8)"/>
  </g>

  <!-- CHARACTER -->
  <g>
    <!-- Character Shadow -->
    <ellipse cx="85" cy="212" rx="35" ry="8" fill="#090d16" opacity="0.6"/>

    <!-- Legs & Boots -->
    <g stroke="#1e293b" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
      <!-- Back Leg (Kneeling/Bracing) -->
      <path d="M 75 185 L 60 195 L 45 195" fill="none"/>
      <path d="M 45 195 L 40 205 L 55 208" fill="#475569"/>
      
      <!-- Front Leg -->
      <path d="M 95 185 L 105 198 L 100 210" fill="none"/>
      <path d="M 100 210 L 115 210 L 110 198" fill="#475569"/>
    </g>

    <!-- Torso (Leaning forward with dynamic force) -->
    <path d="M 65 150 C 70 135 90 130 100 145 L 105 185 C 105 190 70 190 65 175 Z" fill="url(#shirtGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>

    <!-- Safety Vest / Details -->
    <path d="M 75 142 L 85 144 L 88 182 L 78 182 Z" fill="#fbbf24" opacity="0.9"/>

    <!-- Head & Face -->
    <g>
      <!-- Neck -->
      <path d="M 85 133 L 93 133 L 92 145 L 84 145 Z" fill="#fbcfe8"/>
      
      <!-- Head Shape -->
      <circle cx="88" cy="118" r="16" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5"/>
      
      <!-- Hair -->
      <path d="M 72 118 C 72 102 95 100 104 112 C 104 112 100 108 92 108 C 82 108 75 112 72 118 Z" fill="#334155"/>

      <!-- Determined Eye / Expression -->
      <path d="M 92 116 L 98 118" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Focused Brow -->
      <path d="M 90 113 L 99 115" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Sweat Drop (Effort) -->
      <path d="M 102 115 Q 104 120 102 122 Q 100 120 102 115 Z" fill="#38bdf8"/>
    </g>

    <!-- Arms & Hammer (Dynamic Swing Pose) -->
    <g>
      <!-- Back Arm (Supporting) -->
      <path d="M 70 142 L 55 155 L 70 165" fill="none" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Front Arm (Swinging downward, gripping the hammer) -->
      <!-- Shoulder to elbow -->
      <path d="M 98 140 L 120 125" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
      <!-- Forearm to hands -->
      <path d="M 120 125 L 128 165" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Hands Gripping Handle -->
      <circle cx="128" cy="160" r="5" fill="#f59e0b"/>

      <!-- THE HAMMER (CHUÍ) - Positioned crashing into the rock -->
      <!-- Handle -->
      <path d="M 115 95 L 132 170" stroke="url(#hammerHandle)" stroke-width="7" stroke-linecap="round"/>
      <!-- Handle Grip wrap lines -->
      <path d="M 121 125 L 127 127 M 123 135 L 129 137 M 125 145 L 131 147" stroke="#b45309" stroke-width="2"/>
      
      <!-- Hammer Head (Heavy Metal Head) -->
      <g transform="translate(103, 83) rotate(-15)">
        <!-- Main Head Block -->
        <rect x="0" y="0" width="36" height="18" rx="3" fill="url(#hammerHead)" stroke="#334155" stroke-width="1.5"/>
        <!-- Striking Face (Facing down/right towards the rock) -->
        <rect x="32" y="1" width="6" height="16" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
        <!-- Eye (handle socket) -->
        <rect x="14" y="4" width="8" height="10" rx="2" fill="#1e293b"/>
      </g>
    </g>
  </g>

  <!-- Motion Lines for Hammer Swing -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 105 70 C 120 70 135 90 140 110" stroke-dasharray="4 4"/>
    <path d="M 90 75 C 105 85 120 100 130 125" stroke-dasharray="4 4"/>
  </g>

  <!-- Sparkles / Details around impact -->
  <circle cx="115" cy="168" r="2" fill="#ffffff"/>
  <circle cx="140" cy="172" r="1.5" fill="#ffffff"/>
  <circle cx="132" cy="182" r="2" fill="#fbbf24"/>
  <path d="M 148 160 L 154 156" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 108 162 L 102 158" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
</svg>