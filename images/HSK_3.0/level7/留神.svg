<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Street Pavement Gradient -->
    <linearGradient id="pavementGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Streetlight Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Motion Glow / Alert Aura -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Urban Elements (Night City) -->
  <g id="cityscape" opacity="0.4">
    <!-- Distant buildings -->
    <rect x="20" y="60" width="30" height="100" fill="#334155" rx="2" />
    <rect x="55" y="40" width="40" height="120" fill="#475569" rx="2" />
    <rect x="150" y="50" width="35" height="110" fill="#334155" rx="2" />
    <rect x="190" y="70" width="35" height="90" fill="#475569" rx="2" />
    
    <!-- Building Windows (Glowing yellow/cyan) -->
    <rect x="26" y="70" width="6" height="8" fill="#fbbf24" opacity="0.6" rx="1" />
    <rect x="38" y="70" width="6" height="8" fill="#38bdf8" opacity="0.6" rx="1" />
    <rect x="26" y="90" width="6" height="8" fill="#38bdf8" opacity="0.6" rx="1" />
    <rect x="38" y="90" width="6" height="8" fill="#fbbf24" opacity="0.6" rx="1" />

    <rect x="65" y="55" width="8" height="10" fill="#fbbf24" opacity="0.8" rx="1" />
    <rect x="79" y="55" width="8" height="10" fill="#fbbf24" opacity="0.4" rx="1" />
    <rect x="65" y="75" width="8" height="10" fill="#38bdf8" opacity="0.7" rx="1" />
    <rect x="79" y="75" width="8" height="10" fill="#fbbf24" opacity="0.7" rx="1" />

    <rect x="160" y="65" width="7" height="9" fill="#38bdf8" opacity="0.5" rx="1" />
    <rect x="172" y="65" width="7" height="9" fill="#fbbf24" opacity="0.8" rx="1" />
  </g>

  <!-- Streetlight Pole & Fixture -->
  <g id="streetlight">
    <rect x="205" y="30" width="4" height="150" fill="#64748b" rx="1" />
    <path d="M 207 30 L 180 20 L 180 25 L 207 35 Z" fill="#64748b" />
    <!-- Lamp Light Source -->
    <circle cx="180" cy="27" r="6" fill="#fef08a" />
    <circle cx="180" cy="27" r="50" fill="url(#lampGlow)" />
  </g>

  <!-- Traffic Light Pole & Signal -->
  <g id="traffic-light">
    <!-- Pole -->
    <rect x="30" y="50" width="5" height="120" fill="#64748b" rx="1" />
    <!-- Housing -->
    <rect x="22" y="55" width="21" height="50" fill="#1e293b" stroke="#475569" stroke-width="2" rx="4" />
    <!-- Red Light (ON / Glowing) -->
    <circle cx="32.5" cy="67" r="5" fill="#ef4444" />
    <circle cx="32.5" cy="67" r="7" fill="#ef4444" opacity="0.4" />
    <!-- Yellow Light (OFF) -->
    <circle cx="32.5" cy="80" r="5" fill="#334155" />
    <!-- Green Light (OFF) -->
    <circle cx="32.5" cy="93" r="5" fill="#334155" />
  </g>

  <!-- Street Ground / Pavement Area -->
  <rect x="0" y="165" width="240" height="75" fill="url(#pavementGrad)" />
  
  <!-- Zebra Crossing (Crosswalk Stripes) Perspective -->
  <g id="zebra-crossing" fill="#f8fafc" opacity="0.9">
    <polygon points="80,165 95,165 85,230 65,230" />
    <polygon points="105,165 120,165 115,230 95,230" />
    <polygon points="130,165 145,165 145,230 125,230" />
    <polygon points="155,165 170,165 175,230 155,230" />
  </g>

  <!-- Road Curb Line -->
  <rect x="0" y="165" width="240" height="4" fill="#cbd5e1" />

  <!-- Action Focus Glow / Alert Vibe around the characters -->
  <circle cx="125" cy="155" r="45" fill="url(#alertGlow)" />

  <!-- Characters: Adult guiding a child (Crucial for "liúshén" - vigilance/caution) -->
  <g id="characters">
    <!-- Parent (Adult) -->
    <g id="parent">
      <!-- Shadow -->
      <ellipse cx="95" cy="215" rx="16" ry="5" fill="#020617" opacity="0.6" />
      
      <!-- Legs/Boots -->
      <rect x="86" y="185" width="7" height="30" fill="#3b82f6" rx="3" />
      <rect x="98" y="180" width="7" height="35" fill="#1d4ed8" rx="3" />
      
      <!-- Body / Coat -->
      <path d="M 82 135 L 112 135 L 118 185 L 80 185 Z" fill="#0ea5e9" rx="4" />
      <path d="M 97 135 L 97 185" stroke="#0284c7" stroke-width="2" /> <!-- Coat opening -->

      <!-- Head & Face -->
      <circle cx="97" cy="118" r="13" fill="#fed7aa" />
      <!-- Hair -->
      <path d="M 84 118 C 84 105, 110 105, 110 118 C 105 114, 90 114, 84 118 Z" fill="#334155" />
      <!-- Expression: Alert/Observant eyes looking left -->
      <circle cx="92" cy="117" r="1.5" fill="#1e293b" />
      <circle cx="102" cy="117" r="1.5" fill="#1e293b" />
      <path d="M 90 123 Q 97 127 104 123" stroke="#c2410c" stroke-width="1.5" fill="none" stroke-linecap="round" />

      <!-- Parent Arm holding child (protective gesture) -->
      <path d="M 105 145 Q 120 140 125 150" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" fill="none" />
      <circle cx="125" cy="150" r="4" fill="#fed7aa" />
    </g>

    <!-- Child (Stepping forward carefully onto the street) -->
    <g id="child">
      <!-- Shadow -->
      <ellipse cx="140" cy="218" rx="12" ry="4" fill="#020617" opacity="0.6" />

      <!-- Legs in motion (One leg stepping down carefully) -->
      <path d="M 132 185 L 126 212" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
      <path d="M 144 185 L 152 205" stroke="#e11d48" stroke-width="6" stroke-linecap="round" />

      <!-- Body / Colorful Hoodie -->
      <path d="M 130 145 L 150 145 L 154 185 L 128 185 Z" fill="#10b981" rx="4" />

      <!-- Backpack -->
      <rect x="148" y="150" width="10" height="25" fill="#f59e0b" rx="3" />

      <!-- Head & Face -->
      <circle cx="140" cy="130" r="11" fill="#fed7aa" />
      <!-- Hood / Hair -->
      <path d="M 128 130 C 128 118, 152 118, 152 130 Z" fill="#059669" />
      <!-- Expression: Wide watchful eyes (showing attention/cautiousness) -->
      <circle cx="136" cy="129" r="2" fill="#1e293b" />
      <circle cx="144" cy="129" r="2" fill="#1e293b" />
      <circle cx="136.5" cy="128.5" r="0.7" fill="#ffffff" />
      <circle cx="144.5" cy="128.5" r="0.7" fill="#ffffff" />
      <!-- Slight tense mouth -->
      <path d="M 138 135 Q 140 137 142 135" stroke="#9a3412" stroke-width="1.2" fill="none" stroke-linecap="round" />

      <!-- Child Arm reaching out safely -->
      <path d="M 132 152 L 123 150" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Environmental Accents: Floating glowing attention sparkles/indicators (Visual cues for "liúshén") -->
  <g id="alert-indicators">
    <!-- Star sparkle 1 -->
    <path d="M 125 95 L 127 102 L 134 104 L 127 106 L 125 113 L 123 106 L 116 104 L 123 102 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Star sparkle 2 (smaller) -->
    <path d="M 160 115 L 161 119 L 165 120 L 161 121 L 160 125 L 159 121 L 155 120 L 159 119 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Subtle attention rings near the foot stepping down -->
    <ellipse cx="126" cy="214" rx="8" ry="3" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <ellipse cx="126" cy="214" rx="14" ry="5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Foreground Atmospheric Lighting/Vignette Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>