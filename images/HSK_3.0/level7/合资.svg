<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Interior Lighting / Window glow representing a modern office -->
  <path d="M 60 30 L 180 30 L 180 180 L 60 180 Z" fill="#1e293b"/>
  
  <!-- Large Office Glass Wall / Window looking out to city lights -->
  <rect x="70" y="40" width="100" height="85" rx="4" fill="#334155" opacity="0.4"/>
  <line x1="120" y1="40" x2="120" y2="125" stroke="#475569" stroke-width="2"/>
  <line x1="70" y1="82" x2="170" y2="82" stroke="#475569" stroke-width="2"/>
  
  <!-- City skyline outside window -->
  <rect x="80" y="70" width="15" height="55" fill="#475569" opacity="0.6"/>
  <rect x="100" y="55" width="18" height="70" fill="#64748b" opacity="0.6"/>
  <rect x="130" y="65" width="22" height="60" fill="#475569" opacity="0.6"/>
  <circle cx="87" cy="62" r="1.5" fill="#fbbf24"/>
  <circle cx="109" cy="48" r="1.5" fill="#38bdf8"/>
  <circle cx="141" cy="58" r="1.5" fill="#fbbf24"/>

  <!-- Office Meeting Table (Curved / Modern) -->
  <path d="M 40 160 C 40 145, 200 145, 200 160 C 200 175, 40 175, 40 160 Z" fill="#334155"/>
  <path d="M 50 160 C 50 150, 190 150, 190 160 C 190 170, 50 170, 50 160 Z" fill="#475569"/>

  <!-- Centerpiece / Shared Work Items on Table -->
  <!-- Laptop showing financial charts / partnership icons -->
  <rect x="100" y="140" width="40" height="22" rx="2" fill="#94a3b8"/>
  <rect x="104" y="143" width="32" height="15" fill="#0f172a"/>
  <!-- Chart lines -->
  <polyline points="108,154 115,148 122,152 132,145" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="108,154 115,148 122,152 132,145 132,157 108,157" fill="#10b981" opacity="0.2"/>
  <!-- Laptop Base -->
  <path d="M 96 162 L 144 162 L 147 165 L 93 165 Z" fill="#cbd5e1"/>

  <!-- Coffee Cups -->
  <rect x="70" y="148" width="10" height="12" rx="2" fill="#f8fafc"/>
  <path d="M 80 151 C 83 151, 83 157, 80 157" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  
  <rect x="160" y="148" width="10" height="12" rx="2" fill="#f8fafc"/>
  <path d="M 160 151 C 157 151, 157 157, 160 157" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- Character 1 (Left - Asian Business Professional / Partner A) -->
  <!-- Body/Suit -->
  <path d="M 60 210 L 60 180 C 60 170, 75 165, 85 175 L 90 210 Z" fill="#1e293b"/>
  <!-- Shirt & Tie -->
  <polygon points="70,178 80,178 75,195" fill="#f8fafc"/>
  <polygon points="74,180 76,180 77,192 73,192" fill="#ef4444"/>
  <!-- Head & Face -->
  <circle cx="75" cy="155" r="14" fill="#fed7aa"/>
  <!-- Hair (Dark, neat professional style) -->
  <path d="M 61 153 C 61 142, 89 142, 89 153 C 89 156, 85 150, 75 148 C 65 150, 61 156, 61 153 Z" fill="#1e293b"/>
  <!-- Expressive Pose / Hand gesturing collaboratively -->
  <path d="M 85 180 C 95 180, 100 170, 105 165" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>

  <!-- Character 2 (Right - Western / Global Partner B) -->
  <!-- Body/Suit -->
  <path d="M 150 210 L 150 180 C 150 170, 165 165, 175 175 L 180 210 Z" fill="#0f172a"/>
  <!-- Shirt & Tie -->
  <polygon points="160,178 170,178 165,195" fill="#f8fafc"/>
  <polygon points="164,180 166,180 167,192 163,192" fill="#3b82f6"/>
  <!-- Head & Face -->
  <circle cx="165" cy="155" r="14" fill="#ffedd5"/>
  <!-- Hair (Blonde/Brown side-part) -->
  <path d="M 151 154 C 151 142, 179 142, 179 154 C 179 156, 170 148, 162 148 C 155 148, 151 156, 151 154 Z" fill="#b45309"/>
  <!-- Expressive Pose / Hand shaking or pointing towards agreement -->
  <path d="M 155 180 C 145 180, 140 170, 135 165" fill="none" stroke="#ffedd5" stroke-width="5" stroke-linecap="round"/>

  <!-- Interaction / Handshake overlap in center -->
  <circle cx="120" cy="162" r="5" fill="#fed7aa"/>

  <!-- Joint Venture Symbol / Accent Glow (Representing "Joint Venture / 合资" synergy) -->
  <g transform="translate(120, 95)">
    <!-- Interlocking rings or dynamic handshake spark -->
    <circle cx="-12" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
    <circle cx="12" cy="0" r="10" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
    <!-- Center synergy sparkle -->
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#10b981"/>
  </g>

  <!-- Warm ambient lighting highlights on frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>