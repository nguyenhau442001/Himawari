<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ground shadow / track line -->
  <path d="M50 185 L190 185" stroke="#2B303B" stroke-width="4" stroke-linecap="round"/>

  <!-- Character upper body leaning forward, completely exhausted -->
  <!-- Upper body tilted -->
  <g transform="translate(120, 155)">
    
    <!-- Heavy breathing chest expansion lines / air waves (focusing on 喘 - panting) -->
    <g opacity="0.8">
      <path d="M-32 -55 C-38 -62 -38 -75 -25 -82" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M-42 -45 C-50 -55 -50 -70 -35 -82" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M-52 -35 C-62 -45 -62 -65 -45 -82" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
    </g>

    <!-- Knees / Legs bent and planted on the ground -->
    <path d="M-25 15 L-35 30 L-10 30" stroke="#4A90E2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M15 15 L30 30 L55 30" stroke="#4A90E2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Feet -->
    <path d="M-22 30 L-2 30" stroke="#E0E6ED" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 30 L62 30" stroke="#E0E6ED" stroke-width="6" stroke-linecap="round"/>

    <!-- Arms braced on knees for support -->
    <path d="M-15 -30 L-30 15" stroke="#E0E6ED" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 -30 L30 15" stroke="#E0E6ED" stroke-width="8" stroke-linecap="round"/>

    <!-- Torso (leaning forward) -->
    <path d="M-20 -40 C-20 -50 0 -60 15 -45 C25 -35 20 -20 10 -10 C-5 5 -15 -20 -20 -40 Z" fill="#4A90E2"/>

    <!-- Head hanging down in exhaustion -->
    <circle cx="28" cy="-32" r="14" fill="#E0E6ED"/>
    <!-- Messy hair / sweat drop indication -->
    <path d="M35 -44 L38 -38" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 -46 L20 -40" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>

    <!-- Panting face profile details (open mouth gasping) -->
    <path d="M36 -34 C39 -34 41 -31 39 -29" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="-30" r="3" fill="#FF5252"/> <!-- Gasping open mouth -->

  </g>

  <!-- Sweat droplets flying off to emphasize strenuous physical exertion -->
  <g fill="#4A90E2">
    <circle cx="165" cy="110" r="3" />
    <path d="M172 95 C172 95 175 99 175 101 C175 103 173 104 172 104 C171 104 169 103 169 101 C169 99 172 95 172 95 Z" />
    <circle cx="75" cy="100" r="2.5" />
    <path d="M68 88 C68 88 66 91 66 93 C66 95 67 96 68 96 C69 96 70 95 70 93 C70 91 68 88 68 88 Z" />
  </g>

  <!-- Visual heat / exhaustion shimmer waves rising from the figure -->
  <path d="M100 80 Q105 70 100 60 T100 40" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M130 75 Q125 65 130 55 T130 35" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

</svg>