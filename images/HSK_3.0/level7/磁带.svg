<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing a cozy, dimly lit vintage room interior -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lampGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric background window and shelf -->
  <g opacity="0.6">
    <!-- Window showing night/evening -->
    <rect x="160" y="25" width="50" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <line x1="185" y1="25" x2="185" y2="95" stroke="#334155" stroke-width="1.5"/>
    <line x1="160" y1="60" x2="210" y2="60" stroke="#334155" stroke-width="1.5"/>
    <!-- Tiny star/lights outside -->
    <circle cx="175" cy="40" r="1" fill="#94a3b8" />
    <circle cx="195" cy="48" r="1.5" fill="#94a3b8" />
    
    <!-- Wooden Shelf with retro items -->
    <rect x="20" y="35" width="90" height="6" rx="2" fill="#475569" />
    <!-- Plant pot on shelf -->
    <path d="M40 35 L45 25 L55 25 L60 35 Z" fill="#10b981" />
    <circle cx="50" cy="22" r="8" fill="#059669" />
    <!-- Small books -->
    <rect x="70" y="15" width="8" height="20" rx="1" fill="#ec4899" />
    <rect x="79" y="18" width="6" height="17" rx="1" fill="#38bdf8" />
  </g>

  <!-- Warm lamp light cone -->
  <polygon points="50,0 0,240 140,240" fill="url(#lampGlow)" pointer-events="none" />

  <!-- Wooden Desk Surface -->
  <rect x="0" y="185" width="240" height="55" fill="url(#deskGrad)" />
  <line x1="0" y1="185" x2="240" y2="185" stroke="#475569" stroke-width="2" />

  <!-- Desk Lamp (left side) -->
  <g>
    <path d="M45 185 L55 185 L52 140 L48 140 Z" fill="#64748b" />
    <path d="M35 120 C35 105 65 105 65 120 Z" fill="#fbbf24" filter="url(#glow)" />
    <path d="M35 120 C35 105 65 105 65 120 Z" fill="#f59e0b" />
    <!-- Lamp base -->
    <ellipse cx="50" cy="185" rx="14" ry="4" fill="#475569" />
  </g>

  <!-- Vintage Cassette Player (Boombox / Deck) in the background -->
  <g transform="translate(130, 115)">
    <!-- Main body -->
    <rect x="0" y="20" width="80" height="50" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <!-- Speaker grills -->
    <circle cx="15" cy="45" r="10" fill="#1e293b" />
    <circle cx="15" cy="45" r="7" fill="#0f172a" />
    <circle cx="65" cy="45" r="10" fill="#1e293b" />
    <circle cx="65" cy="45" r="7" fill="#0f172a" />
    <!-- Cassette door slot -->
    <rect x="28" y="30" width="24" height="28" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <!-- Control buttons -->
    <rect x="32" y="62" width="6" height="5" rx="1" fill="#fb923c" />
    <rect x="41" y="62" width="6" height="5" rx="1" fill="#38bdf8" />
    <rect x="50" y="62" width="6" height="5" rx="1" fill="#10b981" />
  </g>

  <!-- THE MAIN HERO OBJECT: The Old Cassette (磁带) held in hands/centered on desk -->
  <!-- We display it prominently angled slightly with warm highlights to show "old" texture (warm yellowed plastic, vintage label) -->
  <g transform="translate(75, 125)">
    <!-- Drop shadow for cassette -->
    <rect x="2" y="14" width="86" height="52" rx="6" fill="#000000" opacity="0.4" />
    
    <!-- Cassette Outer Shell (Vintage beige/cream old plastic look) -->
    <rect x="0" y="10" width="86" height="52" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Top indented area -->
    <path d="M12 10 L16 4 L70 4 L74 10 Z" fill="#cbd5e1" />
    
    <!-- Vintage Label (slightly aged amber/cream tint) -->
    <rect x="6" y="15" width="74" height="34" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    
    <!-- Label decorative stripe (retro 80s aesthetic) -->
    <path d="M6 21 H80" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 2" />
    
    <!-- Center window showing magnetic tape reels -->
    <rect x="26" y="24" width="34" height="18" rx="4" fill="#0f172a" opacity="0.85" />
    <rect x="28" y="26" width="30" height="14" rx="2" fill="#1e293b" />
    
    <!-- Left Reel (With visible dark magnetic tape wound around) -->
    <circle cx="36" cy="33" r="6" fill="#475569" />
    <circle cx="36" cy="33" r="3" fill="#0f172a" />
    <!-- Tape strip graphic -->
    <path d="M36 27 C30 27 30 39 36 39" fill="none" stroke="#0f172a" stroke-width="2" />

    <!-- Right Reel -->
    <circle cx="50" cy="33" r="8" fill="#334155" />
    <circle cx="50" cy="33" r="3" fill="#0f172a" />
    <path d="M50 25 C58 25 58 41 50 41" fill="none" stroke="#0f172a" stroke-width="3" />

    <!-- Screw holes corners -->
    <circle cx="10" cy="18" r="1" fill="#94a3b8" />
    <circle cx="76" cy="18" r="1" fill="#94a3b8" />
    <circle cx="10" cy="54" r="1" fill="#94a3b8" />
    <circle cx="76" cy="54" r="1" fill="#94a3b8" />
    
    <!-- Bottom tape access groove -->
    <path d="M30 62 L34 52 L52 52 L56 62 Z" fill="#cbd5e1" />
  </g>

  <!-- Expressive Character Hands holding or gesturing toward the old cassette -->
  <g>
    <!-- Left Hand -->
    <path d="M65 160 C60 155 58 145 68 140 C72 138 78 145 76 150 Z" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />
    <!-- Right Hand -->
    <path d="M170 155 C175 150 178 142 168 138 C163 136 158 142 160 148 Z" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />
  </g>

  <!-- Character Character (Upper body of a curious person examining the cassette) -->
  <g transform="translate(15, 60)">
    <!-- Torso & Hoody -->
    <path d="M25 130 C25 105 45 95 65 95 C85 95 105 105 105 130 L115 150 L15 150 Z" fill="#38bdf8" />
    <!-- Collar / Zipper detail -->
    <path d="M65 95 L65 125" fill="none" stroke="#0284c7" stroke-width="2.5" />
    <path d="M55 105 L75 105" stroke="#0284c7" stroke-width="2" />
    
    <!-- Head & Face (Looking down lovingly at the cassette) -->
    <circle cx="65" cy="75" r="22" fill="#fcd34d" />
    
    <!-- Hair (Stylized modern neat hair) -->
    <path d="M45 75 C43 55 60 50 75 55 C85 58 87 70 87 70 C87 70 80 60 65 60 C50 60 46 70 45 75 Z" fill="#1e293b" />

    <!-- Cute facial expression: warm smiling eyes looking down -->
    <!-- Left eye (curved happy arc) -->
    <path d="M55 72 C57 75 60 75 62 72" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Right eye -->
    <path d="M68 72 C70 75 73 75 75 72" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    
    <!-- Rosy cheek -->
    <circle cx="60" cy="78" r="4" fill="#fb7185" opacity="0.6" />
    
    <!-- Gentle smile -->
    <path d="M63 82 C65 85 68 85 70 82" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sparkles / Nostalgia magic dust around the old cassette -->
  <g fill="#fbbf24">
    <path d="M 65 110 Q 67 115 72 117 Q 67 119 65 124 Q 63 119 58 117 Q 63 115 65 110 Z" opacity="0.9" />
    <path d="M 155 120 Q 156 123 159 124 Q 156 125 155 128 Q 154 125 151 124 Q 154 123 155 120 Z" opacity="0.7" />
    <circle cx="130" cy="110" r="1.5" opacity="0.8" />
    <circle cx="165" cy="150" r="2" opacity="0.6" />
  </g>
</svg>