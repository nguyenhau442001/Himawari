<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Tree Trunk -->
  <path d="M100 240 Q 100 120 120 40 L 140 40 Q 120 120 120 240 Z" fill="#475569"/>
  <path d="M110 240 Q 110 120 130 50 L 150 50 Q 130 120 130 240 Z" fill="#334155"/>
  
  <!-- Vines (缠绕) -->
  <path d="M110 200 C 80 180 90 140 120 130 C 150 120 140 90 110 80 C 80 70 90 40 120 30" 
        stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M130 220 C 160 200 150 160 120 150 C 90 140 100 110 130 100 C 160 90 150 60 120 50" 
        stroke="#34d399" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Leaves -->
  <ellipse cx="110" cy="160" rx="6" ry="10" fill="#10b981" transform="rotate(20 110 160)"/>
  <ellipse cx="135" cy="120" rx="6" ry="10" fill="#10b981" transform="rotate(-30 135 120)"/>
  <ellipse cx="115" cy="80" rx="6" ry="10" fill="#10b981" transform="rotate(10 115 80)"/>
  <ellipse cx="145" cy="60" rx="6" ry="10" fill="#10b981" transform="rotate(-20 145 60)"/>
  
  <!-- Character (Gardener observing) -->
  <g transform="translate(170, 150)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L 30 40 L 25 80 L 15 80 Z" fill="#38bdf8"/>
    <path d="M10 40 L 5 70 L 15 65 Z" fill="#38bdf8"/>
    <path d="M30 40 L 35 70 L 25 65 Z" fill="#38bdf8"/>
    <circle cx="15" cy="15" r="2" fill="#0f172a"/>
    <circle cx="25" cy="15" r="2" fill="#0f172a"/>
    <path d="M15 25 Q 20 28 25 25" stroke="#0f172a" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#fb923c" stroke-width="0.5" opacity="0.1"/>
</svg>