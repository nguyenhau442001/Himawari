<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow representing awakening/recovery -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.8"/>
  <circle cx="120" cy="115" r="50" fill="#2D3545" opacity="0.5"/>

  <!-- Patient/Character Head (Resting/Recovering state) -->
  <!-- Hospital bed headrest / pillow -->
  <path d="M 75 140 C 75 110, 95 95, 120 95 C 145 95, 165 110, 165 140 Z" fill="#3A4454"/>
  <rect x="70" y="135" width="100" height="25" rx="8" fill="#4E5D78"/>

  <!-- Character Shoulders/Body -->
  <path d="M 80 185 C 80 160, 98 150, 120 150 C 142 150, 160 160, 160 185 Z" fill="#3D5A80"/>
  
  <!-- Hospital Blanket edge -->
  <path d="M 70 170 Q 120 160 170 170 L 175 195 L 65 195 Z" fill="#64748B" opacity="0.3"/>

  <!-- Head/Face -->
  <circle cx="120" cy="120" r="26" fill="#F1F5F9"/>

  <!-- Closed/Opening Eyes: Representing the transition of waking up (one eye winking/opening, one open) -->
  <!-- Left eye (open, glowing/vitality) -->
  <circle cx="111" cy="118" r="3.5" fill="#1A1D24"/>
  <circle cx="112" cy="117" r="1" fill="#FFFFFF"/>

  <!-- Right eye (opening/blinking arc) -->
  <path d="M 125 116 Q 129 121, 133 116" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Gentle smile (recovery) -->
  <path d="M 115 130 Q 120 134, 125 130" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rosy cheeks -->
  <circle cx="106" cy="126" r="3" fill="#F43F5E" opacity="0.4"/>
  <circle cx="134" cy="126" r="3" fill="#F43F5E" opacity="0.4"/>

  <!-- Vitality / Awakening Sparkles & Rising Energy (Orange/Gold Accent) -->
  <!-- Sparkle 1 (Top Right) -->
  <path d="M 160 80 L 163 90 L 173 93 L 163 96 L 160 106 L 157 96 L 147 93 L 157 90 Z" fill="#F59E0B"/>
  
  <!-- Sparkle 2 (Top Left) -->
  <path d="M 80 85 L 82 91 L 88 93 L 82 95 L 80 101 L 78 95 L 72 93 L 78 91 Z" fill="#FBBF24" transform="scale(0.8) translate(20, 10)"/>

  <!-- Small rising energy particles -->
  <circle cx="100" cy="70" r="2.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="140" cy="65" r="3.5" fill="#FBBF24"/>
  <circle cx="120" cy="55" r="2" fill="#F59E0B" opacity="0.9"/>

  <!-- Heartbeat / Vitality Line floating above -->
  <path d="M 90 40 L 105 40 L 110 30 L 115 50 L 122 35 L 127 43 L 132 40 L 150 40" 
        stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>