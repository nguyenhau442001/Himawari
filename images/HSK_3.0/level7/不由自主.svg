<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="205" rx="55" ry="8" fill="#111318"/>
  
  <!-- Action lines radiating for spontaneous upward burst -->
  <g opacity="0.3" stroke="#F5A623" stroke-width="2" stroke-linecap="round">
    <line x1="75" y1="110" x2="60" y2="95" />
    <line x1="165" y1="110" x2="180" y2="95" />
    <line x1="120" y1="90" x2="120" y2="70" />
    <line x1="90" y1="100" x2="78" y2="85" />
    <line x1="150" y1="100" x2="162" y2="85" />
  </g>

  <!-- Character / Person depicting "bùyóuzìzhǔ" (spontaneous, uncontrollable joyful reaction) -->
  <g id="spontaneous-person">
    <!-- Dynamic arched body (mid-air jump / leap) -->
    <!-- Torso -->
    <path d="M100 135 C105 115 115 110 125 112 C135 115 140 130 138 150 L102 155 Z" fill="#3B82F6"/>
    
    <!-- Head tilted back in spontaneous cheer -->
    <circle cx="123" cy="92" r="15" fill="#FFD166"/>
    <!-- Joyful expression: closed happy eyes & wide open mouth -->
    <path d="M117 90 L121 93 M125 90 L129 93" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M120 98 C121 103 125 103 127 98 Z" fill="#1A1D24"/>

    <!-- Left Arm - Thrown up high uncontrollably -->
    <path d="M104 122 L82 85 C80 82 82 78 86 80 L108 105 Z" fill="#FFD166" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Right Arm - Thrown up high uncontrollably -->
    <path d="M136 122 L158 85 C160 82 158 78 154 80 L132 105 Z" fill="#FFD166" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round"/>

    <!-- Left Leg - Bent up backwards dynamically -->
    <path d="M106 152 L82 165 C78 167 76 173 80 176 L102 185 Z" fill="#1A1D24"/>
    
    <!-- Right Leg - Bent up backwards dynamically -->
    <path d="M134 152 L158 165 C162 167 164 173 160 176 L138 185 Z" fill="#1A1D24"/>

    <!-- Clothing details (modern sportswear fit) -->
    <path d="M102 138 L138 138 L136 150 L104 150 Z" fill="#2563EB"/>
  </g>

  <!-- Golden accent bursts / sparkles representing sudden involuntary joy/energy -->
  <g fill="#F5A623">
    <!-- Top center star -->
    <path d="M120 45 L123 55 L133 58 L123 61 L120 71 L117 61 L107 58 L117 55 Z"/>
    <!-- Left star -->
    <path d="M65 80 L67 85 L72 87 L67 89 L65 94 L63 89 L58 87 L63 85 Z"/>
    <!-- Right star -->
    <path d="M175 80 L177 85 L182 87 L177 89 L175 94 L173 89 L168 87 L173 85 Z"/>
  </g>

  <!-- Floating confetti dots accent -->
  <circle cx="85" cy="120" r="3" fill="#EF4444"/>
  <circle cx="155" cy="120" r="3" fill="#10B981"/>
  <circle cx="95" cy="65" r="2.5" fill="#3B82F6"/>
  <circle cx="145" cy="65" r="2.5" fill="#F5A623"/>
</svg>