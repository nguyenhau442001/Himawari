<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Blueprint Paper Texture Gradient -->
    <linearGradient id="blueprintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Background Context -->
  <!-- Warm ambient light from a side window -->
  <path d="M0 0 L100 0 L150 160 L0 160 Z" fill="#38bdf8" opacity="0.04"/>
  
  <!-- Bookshelf / Studio Details in Background -->
  <rect x="25" y="45" width="35" height="4" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="30" y="30" width="8" height="15" rx="1" fill="#fb923c" opacity="0.6"/>
  <rect x="40" y="27" width="10" height="18" rx="1" fill="#38bdf8" opacity="0.6"/>

  <!-- Pendant Lamp -->
  <path d="M120 0 L120 35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 35 L140 35 L145 45 L95 45 Z" fill="#475569"/>
  <path d="M95 45 L145 45 L150 48 L90 48 Z" fill="#94a3b8"/>
  <!-- Light Cone -->
  <polygon points="120,48 50,180 190,180" fill="#fbbf24" opacity="0.07"/>
  <!-- Lamp Bulb Glow -->
  <circle cx="120" cy="46" r="4" fill="#fef08a" filter="url(#glow)"/>

  <!-- Large Designer Desk (Surface) -->
  <path d="M10 165 C10 160, 15 155, 20 155 L220 155 C225 155, 230 160, 230 165 L235 220 C235 225, 230 230, 225 230 L15 230 C10 230, 5 225, 5 220 Z" fill="url(#deskGrad)"/>
  <rect x="5" y="155" width="230" height="8" rx="2" fill="#475569"/>

  <!-- Ambient Props on Desk -->
  <!-- Coffee Mug -->
  <rect x="195" y="160" width="14" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M209 165 C215 165, 215 174, 209 174" stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Steaming Coffee -->
  <path d="M199 154 C199 151, 203 151, 203 148" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- MAIN SCENARIO FOCUS: THE "PINGMIAN" (2D Design / Architectural Blueprint) -->
  <g transform="translate(45, 95)">
    <!-- Blueprint Sheet Shadow -->
    <rect x="2" y="2" width="90" height="65" rx="3" fill="#0f172a" opacity="0.5"/>
    
    <!-- Blueprint Base -->
    <rect x="0" y="0" width="90" height="65" rx="3" fill="url(#blueprintGrad)"/>
    
    <!-- Blueprint Grid Lines (Showing "Flat/Planar" layout nature) -->
    <line x1="0" y1="15" x2="90" y2="15" stroke="#93c5fd" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="30" x2="90" y2="30" stroke="#93c5fd" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="45" x2="90" y2="45" stroke="#93c5fd" stroke-width="0.5" opacity="0.3"/>
    <line x1="22" y1="0" x2="22" y2="65" stroke="#93c5fd" stroke-width="0.5" opacity="0.3"/>
    <line x1="45" y1="0" x2="45" y2="65" stroke="#93c5fd" stroke-width="0.5" opacity="0.3"/>
    <line x1="67" y1="0" x2="67" y2="65" stroke="#93c5fd" stroke-width="0.5" opacity="0.3"/>

    <!-- 2D Floor Plan / Flat Design Vectors on Paper -->
    <rect x="12" y="12" width="28" height="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="44" y="12" width="34" height="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="12" y="38" width="66" height="16" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Interior Architectural Details -->
    <path d="M12 24 L22 24" stroke="#ffffff" stroke-width="1"/>
    <circle cx="61" cy="46" r="5" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <!-- Dimension lines -->
    <path d="M10 8 L40 8" stroke="#f59e0b" stroke-width="1" stroke-linecap="round"/>
    <path d="M10 6 L10 10 M40 6 L40 10" stroke="#f59e0b" stroke-width="1"/>
  </g>

  <!-- Creative Designer Character (Upper Body / Leaning over the 2D Plan) -->
  <g transform="translate(115, 80)">
    <!-- Character Body / Torso -->
    <path d="M30 95 C25 80, 25 65, 30 55 L65 55 C70 65, 70 80, 65 95 Z" fill="#38bdf8"/>
    <!-- Collar / Shirt Detail -->
    <path d="M40 55 L47 64 L54 55 Z" fill="#f8fafc"/>
    
    <!-- Arms reaching down to point at the blueprint -->
    <path d="M25 65 C15 70, 5 75, 2 85" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Left Hand Pointing -->
    <circle cx="1" cy="86" r="4" fill="#fcd34d"/>

    <path d="M70 65 C80 72, 90 80, 95 85" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right Hand resting -->
    <circle cx="96" cy="86" r="4" fill="#fcd34d"/>

    <!-- Neck -->
    <rect x="42" y="44" width="11" height="13" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="47" cy="32" r="17" fill="#fcd34d"/>

    <!-- Stylish Hair (Dark & Modern) -->
    <path d="M30 32 C30 18, 40 15, 48 15 C58 15, 64 22, 64 32 C64 34, 62 33, 62 28 C60 20, 52 18, 47 18 C37 18, 33 24, 32 30 Z" fill="#0f172a"/>

    <!-- Expressive Face (Engaged/Focused expression) -->
    <!-- Eyebrows (focused angle) -->
    <path d="M38 27 L43 28" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M51 28 L56 27" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="41" cy="31" r="2" fill="#0f172a"/>
    <circle cx="53" cy="31" r="2" fill="#0f172a"/>
    <!-- Glasses (Designer touch) -->
    <rect x="38" y="27" width="7" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1.2"/>
    <rect x="50" y="27" width="7" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1.2"/>
    <path d="M45 30 L50 30" stroke="#64748b" stroke-width="1.2"/>
    <!-- Smile / Concentrated mouth -->
    <path d="M45 39 C47 41, 49 41, 51 39" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="38" cy="36" r="3" fill="#f87171" opacity="0.4"/>
    <circle cx="57" cy="36" r="3" fill="#f87171" opacity="0.4"/>
  </g>

  <!-- Secondary Tools on Desk (Adding context depth) -->
  <!-- Ruler / Triangle Tool -->
  <polygon points="15,185 45,210 15,210" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
  
  <!-- Modern Pen/Stylus -->
  <path d="M150 170 L170 195" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M148 168 L151 171" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

</svg>