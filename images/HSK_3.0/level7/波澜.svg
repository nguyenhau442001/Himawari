<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Decorative Elements (Subtle night atmosphere for turbulent waters) -->
  <circle cx="120" cy="120" r="90" fill="#242B38" opacity="0.5"/>

  <!-- Distant dramatic horizon / wind lines representing "风雨与动荡" -->
  <path d="M50 75 L80 70 M130 65 L170 72" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 95 L75 88 M160 85 L195 90" stroke="#3A4454" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Layered Waves / Physical Water Body representing "波澜" (Waves, turbulence, twists and turns) -->
  
  <!-- Back wave layer (Darker teal/slate blue) -->
  <path d="M20 155 C 60 135, 90 175, 140 145 C 180 120, 210 150, 220 140 L 220 200 L 20 200 Z" fill="#263859"/>

  <!-- Mid wave layer -->
  <path d="M20 170 C 50 145, 95 190, 140 160 C 185 130, 210 165, 220 155 L 220 200 L 20 200 Z" fill="#1E5F74"/>

  <!-- Foreground dynamic crest wave with golden accent representing "壮阔" (magnificent scale) -->
  <path d="M15 185 C 50 160, 75 195, 120 170 C 165 145, 195 180, 225 160 L 225 210 L 15 210 Z" fill="#0F4C75"/>

  <!-- Dramatic central wave crest (The iconic physical object representing the noun 'wave/turbulence') -->
  <path d="M 75 160 Q 115 100, 150 70 Q 170 55, 185 70 Q 195 85, 175 115 Q 155 140, 125 165 Z" fill="#3282B8"/>
  
  <!-- Wave foam and dynamic splash highlights -->
  <path d="M145 75 Q 165 55, 185 70 Q 175 95, 150 110 Z" fill="#BBE1FA"/>
  <circle cx="160" cy="58" r="4" fill="#FFD700" opacity="0.9"/>
  <circle cx="185" cy="50" r="2.5" fill="#FFD700" opacity="0.8"/>
  <circle cx="198" cy="70" r="2" fill="#BBE1FA" opacity="0.7"/>

  <!-- Secondary smaller crest for dynamic contrast -->
  <path d="M 45 185 Q 70 140, 95 120 Q 110 110, 120 125 Q 125 145, 95 175 Z" fill="#286FA1"/>
  <path d="M85 125 Q 105 112, 120 125 Q 105 140, 85 125 Z" fill="#BBE1FA" opacity="0.8"/>
  <circle cx="110" cy="112" r="3" fill="#FFD700" opacity="0.85"/>

  <!-- Water droplets / mist floating above waves -->
  <circle cx="138" cy="95" r="2" fill="#BBE1FA" opacity="0.7"/>
  <circle cx="128" cy="85" r="1.5" fill="#FFD700" opacity="0.9"/>
  <circle cx="80" cy="100" r="2" fill="#BBE1FA" opacity="0.6"/>

</svg>