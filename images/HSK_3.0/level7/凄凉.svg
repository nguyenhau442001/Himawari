<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Distant Background Mountains / Hills (Desolate) -->
  <path d="M0 150 Q40 130 90 145 T190 135 Q220 140 240 148 L240 180 L0 180 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Ground -->
  <path d="M0 170 Q60 160 120 165 T240 168 L240 240 L0 240 Z" fill="url(#groundGrad)"/>
  
  <!-- Cracked earth lines -->
  <path d="M30 190 L50 198 M45 194 L60 205 M180 185 L195 195 M190 190 L210 200" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- DEAD TREE (Left side) -->
  <g fill="#0f172a">
    <!-- Trunk -->
    <path d="M40 175 Q35 140 25 110 L33 108 Q42 135 48 172 Z"/>
    <!-- Branches -->
    <path d="M30 130 Q15 110 8 115 M15 110 L4 102 M15 110 L10 95" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M35 120 Q50 95 62 90 M52 95 L68 85 M52 95 L58 80" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ABANDONED HOUSE RUIN (Right side) -->
  <!-- Back Wall / Shadow -->
  <path d="M130 170 L130 110 L210 95 L210 170 Z" fill="#1e293b"/>
  <!-- Broken Roof Structure -->
  <path d="M120 115 L170 80 L220 100 L210 108 L170 89 L130 122 Z" fill="#334155"/>
  <path d="M170 80 L175 75 L182 78 L170 80" fill="#475569"/> <!-- Missing roof tile gap -->
  <!-- Collapsed Wall Section -->
  <path d="M130 110 L130 170 L185 170 L185 130 Z" fill="#475569"/>
  <!-- Wooden Planks / Ruined Doorway -->
  <rect x="145" y="125" width="25" height="45" fill="#1e293b"/>
  <line x1="145" y1="135" x2="170" y2="155" stroke="#334155" stroke-width="2"/>
  <line x1="145" y1="155" x2="170" y2="135" stroke="#334155" stroke-width="2"/>
  <!-- Broken Window Frame -->
  <rect x="185" y="115" width="16" height="20" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <line x1="193" y1="115" x2="190" y2="135" stroke="#334155" stroke-width="1.5"/>

  <!-- WEEDS AND OVERGROWTH -->
  <path d="M125 170 Q128 160 133 170 M130 170 Q135 158 140 170 M180 170 Q185 155 190 170 M185 170 Q190 162 196 170" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none"/>

  <!-- TRAVELER / OBSERVER CHARACTER (Center-Left, looking at the scene with a melancholic mood) -->
  <g transform="translate(85, 125)">
    <!-- Shadow -->
    <ellipse cx="15" cy="48" rx="10" ry="3" fill="#090d16" opacity="0.6"/>
    
    <!-- Traveler Body / Coat (Muted Blue/Slate) -->
    <path d="M10 22 L22 22 L26 48 L4 48 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Scarf (Warm amber for contrast) -->
    <path d="M8 18 Q15 22 22 18 L20 24 Q15 26 10 24 Z" fill="#f59e0b"/>
    <path d="M18 22 L16 38" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

    <!-- Head & Hat -->
    <circle cx="15" cy="11" r="6" fill="#fbcfe8"/> <!-- Face -->
    <path d="M8 9 Q15 3 22 9 L23 12 Q15 7 7 12 Z" fill="#64748b"/> <!-- Winter hat -->
    <circle cx="21" cy="9" r="2" fill="#94a3b8"/> <!-- Pom-pom -->

    <!-- Umbrella / Walking Stick held by Traveler -->
    <line x1="26" y1="18" x2="32" y2="48" stroke="#64748b" stroke-width="2"/>
    <path d="M26 18 Q23 15 20 18" stroke="#64748b" stroke-width="2" fill="none"/>
  </g>

  <!-- FOREGROUND DETAILS (Enhancing Desolation & Atmosphere) -->
  <!-- Broken Wooden Fence Post -->
  <path d="M65 175 L68 150 L74 152 L71 175 Z" fill="#475569"/>
  <path d="M71 162 L90 158" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M72 168 L85 165" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating autumn leaf / dust motes for atmospheric depth -->
  <path d="M55 100 Q58 103 56 106 Q53 104 55 100" fill="#fb923c" opacity="0.7"/>
  <path d="M105 80 Q108 82 106 85 Q103 83 105 80" fill="#fb923c" opacity="0.5"/>

  <!-- AMBIENT LIGHTING / MOOD -->
  <!-- Pale cold moon in the sky -->
  <circle cx="190" cy="45" r="14" fill="#cbd5e1" opacity="0.2"/>
  <circle cx="186" cy="41" r="14" fill="#0f172a" opacity="0.5"/> <!-- Crescent shadow effect -->

</svg>