<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Industrial context: A simplified, inefficient production line -->
  <!-- Left side: A robust, modern, high-functioning machine part (Gold) -->
  <rect x="40" y="80" width="60" height="80" rx="4" fill="#FFB800" opacity="0.8"/>
  <rect x="50" y="90" width="40" height="20" rx="2" fill="#1A1D24"/>
  <circle cx="70" cy="130" r="15" fill="#1A1D24"/>
  
  <!-- Right side: A broken, sagging, inefficient machine part (Slate/Grey) -->
  <!-- Representing '低下' (low/inferior) through drooping, broken geometry -->
  <rect x="140" y="120" width="60" height="40" rx="4" fill="#64748B"/>
  <path d="M140 160 L200 160 L190 180 L150 180 Z" fill="#475569"/>
  <circle cx="170" cy="140" r="8" fill="#1A1D24"/>
  
  <!-- Visual contrast: The 'Low' state is physically lower and sagging -->
  <line x1="30" y1="190" x2="210" y2="190" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Conveying 'inefficiency' through a broken gear/cog mechanism -->
  <path d="M170 100 L175 90 L185 90 L190 100 L185 110 L175 110 Z" fill="#94A3B8"/>
  <circle cx="180" cy="100" r="4" fill="#1A1D24"/>
  <path d="M170 100 L160 100" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
</svg>