<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  <rect x="30" y="150" width="180" height="10" rx="2" fill="#475569"/>
  
  <!-- Laptop Screen (The Reveal) -->
  <rect x="60" y="70" width="120" height="80" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="65" y="75" width="110" height="70" rx="2" fill="#1e293b"/>
  
  <!-- Glowing Data/Chart on Screen -->
  <path d="M75 120 L95 90 L115 110 L135 85 L155 100" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="155" cy="100" r="4" fill="#fb923c"/>
  
  <!-- Spotlight Effect -->
  <path d="M120 70 L180 0 L60 0 Z" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Character: Shocked Person -->
  <g transform="translate(160, 130)">
    <circle cx="0" cy="-40" r="15" fill="#fcd34d"/>
    <path d="M-5 -45 L-2 -42 M5 -45 L2 -42" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="0" cy="-35" rx="3" ry="5" fill="#0f172a"/>
    <path d="M-15 0 L-20 40 L-5 40 L-5 10 L5 10 L5 40 L20 40 L15 0 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Character: Pointing Person -->
  <g transform="translate(60, 130)">
    <circle cx="0" cy="-40" r="15" fill="#fcd34d"/>
    <path d="M-5 -45 L-2 -42 M5 -45 L2 -42" stroke="#0f172a" stroke-width="2"/>
    <path d="M-3 -35 L3 -35" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M-15 0 L-20 40 L-5 40 L-5 10 L5 10 L5 40 L20 40 L15 0 Z" fill="#ec4899"/>
    <path d="M15 -10 L30 -30" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Floating Alert/Exclamation -->
  <path d="M200 40 L200 60 M200 65 L200 67" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="30" r="3" fill="#10b981"/>
</svg>