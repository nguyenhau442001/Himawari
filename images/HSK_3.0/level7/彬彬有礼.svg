<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="120" cy="120" r="65" fill="#222733"/>

  <!-- Character / Polite Service Representative representing "彬彬有礼" -->
  <g>
    <!-- Uniform Collar / Shoulders -->
    <path d="M75 190 C75 165 95 150 120 150 C145 150 165 165 165 190 Z" fill="#2E384D"/>
    <!-- Vest / Jacket lapels -->
    <path d="M95 150 L120 175 L145 150 L155 190 L125 190 Z" fill="#3B465C"/>
    <!-- White shirt collar / Tie -->
    <polygon points="120,150 110,165 130,165" fill="#E2E8F0"/>
    <polygon points="117,165 123,165 125,190 115,190" fill="#F59E0B"/>

    <!-- Neck -->
    <rect x="110" y="125" width="20" height="30" rx="6" fill="#F3D1C1"/>

    <!-- Head & Face -->
    <circle cx="120" cy="100" r="32" fill="#F3D1C1"/>

    <!-- Hair -->
    <path d="M88 100 C88 78 100 70 120 70 C140 70 152 78 152 100 C152 106 150 112 150 112 C150 112 145 92 120 90 C95 92 90 112 90 112 C90 112 88 106 88 100 Z" fill="#262626"/>

    <!-- Warm Polite Smile Eyes -->
    <path d="M106 96 Q110 92 114 96" fill="none" stroke="#262626" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M126 96 Q130 92 134 96" fill="none" stroke="#262626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Gentle Friendly Smile -->
    <path d="M112 110 Q120 117 128 110" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="103" cy="106" r="5" fill="#F87171" opacity="0.4"/>
    <circle cx="137" cy="106" r="5" fill="#F87171" opacity="0.4"/>

    <!-- Polite Bowing / Welcoming Hand Gesture -->
    <!-- Arm 1 (bent gracefully across chest in traditional respectful posture) -->
    <path d="M90 160 C90 160 105 130 120 135 C135 140 145 155 145 155" fill="none" stroke="#3B465C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand placed neatly over chest -->
    <circle cx="120" cy="135" r="7" fill="#F3D1C1"/>

    <!-- Sparkles / Aura of elegance and courtesy -->
    <g fill="#F59E0B">
      <path d="M70 80 L72 86 L78 88 L72 90 L70 96 L68 90 L62 88 L68 86 Z"/>
      <path d="M170 80 L171.5 84 L176 85.5 L171.5 87 L170 91.5 L168.5 87 L164 85.5 L168.5 84 Z" transform="scale(0.8) translate(50, 10)"/>
      <circle cx="155" cy="130" r="2.5"/>
      <circle cx="85" cy="130" r="2.5"/>
    </g>
  </g>
</svg>