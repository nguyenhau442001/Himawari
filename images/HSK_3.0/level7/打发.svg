<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background elements representing waiting/time passage -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="120" cy="120" r="75" fill="none" stroke="#60A5FA" stroke-width="1"/>
  </g>

  <!-- Central physical object: Vintage-modern analog pocket watch / travel clock representing passing time -->
  <g transform="translate(120, 115)">
    <!-- Outer Casing / Ring -->
    <circle cx="0" cy="-5" r="56" fill="none" stroke="#334155" stroke-width="6"/>
    <circle cx="0" cy="-5" r="52" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Winding Crown on top -->
    <rect x="-6" y="-68" width="12" height="10" rx="2" fill="#F59E0B"/>
    <circle cx="0" cy="-71" r="5" fill="none" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Clock Face / Dial ticks -->
    <circle cx="0" cy="-5" r="44" fill="#1E293B"/>
    <circle cx="0" cy="-5" r="2" fill="#64748B"/>
    
    <!-- Hour/Minute markers -->
    <line x1="0" y1="-45" x2="0" y2="-40" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="35" x2="0" y2="30" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-40" y1="-5" x2="-35" y2="-5" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="-5" x2="40" y2="-5" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dynamic Clock Hands (Showing movement/killing time) -->
    <line x1="0" y1="-5" x2="0" y2="-28" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="22" y2="12" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-5" r="4" fill="#F59E0B"/>
  </g>

  <!-- Flowing wave elements crossing the clock, symbolizing "killing time" / passing tedious hours smoothly -->
  <g opacity="0.9">
    <!-- Musical notes and book pages integrated as minimal flat vector symbols passing through -->
    <!-- Music note -->
    <path d="M 68 155 Q 72 153 72 147 L 72 118 Q 72 112 78 110 L 86 107 Q 90 105 90 110 L 90 135" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="64" cy="155" r="5" fill="#38BDF8"/>
    <circle cx="86" cy="138" r="5" fill="#38BDF8"/>

    <!-- Open book representing reading to pass time -->
    <g transform="translate(142, 130) scale(0.7)">
      <path d="M 0 25 C 15 15, 30 20, 45 25 L 45 55 C 30 50, 15 45, 0 55 Z" fill="#F8FAFC"/>
      <path d="M 90 25 C 75 15, 60 20, 45 25 L 45 55 C 60 50, 75 45, 90 55 Z" fill="#F8FAFC"/>
      <path d="M 45 25 L 45 55" stroke="#CBD5E1" stroke-width="2"/>
    </g>
  </g>

</svg>