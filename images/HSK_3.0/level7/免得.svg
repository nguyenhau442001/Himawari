<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Hour Glow -->
    <radialGradient id="sunGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Distant Building Silhouette -->
  <path d="M140 140 L170 110 L200 110 L220 140 Z" fill="#334155" opacity="0.5"/>
  <rect x="175" y="120" width="8" height="12" fill="#475569" opacity="0.4"/>
  <rect x="190" y="125" width="8" height="15" fill="#475569" opacity="0.4"/>

  <!-- Modern Apartment / Doorway Frame -->
  <path d="M20 180 L20 70 C20 60 28 52 38 52 L90 52 L90 180 Z" fill="#334155" opacity="0.6"/>
  <!-- Door Mat -->
  <ellipse cx="65" cy="182" rx="30" ry="8" fill="#475569"/>

  <!-- Wall Plant (Pothos) for rich context -->
  <path d="M35 70 Q30 90 38 105" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M35 75 Q45 85 42 100" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="36" cy="107" r="4" fill="#059669"/>
  <circle cx="43" cy="102" r="3.5" fill="#10b981"/>
  <!-- Pot -->
  <path d="M25 65 L45 65 L42 75 L28 75 Z" fill="#cbd5e1"/>

  <!-- CLOCK ICON SHOWING EARLY MORNING (e.g., 7:00 instead of rushing 8:30) -->
  <g transform="translate(180, 50)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19" fill="#f8fafc"/>
    <!-- Clock Hands: pointing calmly to 7:00 -->
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="-4" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="2" fill="#f59e0b"/>
    <!-- Sun icon next to clock indicating early morning daylight -->
    <circle cx="24" cy="-12" r="6" fill="#fbbf24"/>
  </g>

  <!-- STREET / SIDEWALK -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <!-- Pavement lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
  <path d="M0 195 Q 60 193 120 195 T 240 195" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- MAIN CHARACTER (Rushing out early, smiling, well-prepared) -->
  <g transform="translate(85, 95)" filter="url(#shadow)">
    <!-- Motion / Speed lines (Gentle, forward movement, not panicked) -->
    <line x1="-30" y1="40" x2="-10" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-35" y1="60" x2="-15" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Back Leg -->
    <path d="M0 65 L-12 95 L-5 98 L5 70" fill="#1e293b"/>
    <!-- Front Leg (Stepping forward actively) -->
    <path d="M10 65 L25 92 L32 89 L18 63" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="-8" cy="98" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="29" cy="91" rx="7" ry="3.5" fill="#0f172a"/>

    <!-- Torso with stylish coat -->
    <path d="M-8 25 L18 25 L22 70 L-4 70 Z" fill="url(#coatGrad)"/>
    <!-- Coat lapels / details -->
    <path d="M5 25 L12 45 L5 45 Z" fill="#0284c7"/>

    <!-- Backpack (Ready for the day) -->
    <path d="M-15 30 Q-25 35 -22 55 Q-20 62 -10 60 L-8 32 Z" fill="url(#bagGrad)"/>
    <path d="M-18 38 L-8 35" stroke="#7c2d12" stroke-width="2"/>

    <!-- Back Arm (Holding coffee cup or bag strap) -->
    <path d="M-5 30 L-15 45 L-10 48" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front Arm (Swinging happily) -->
    <path d="M18 30 L32 45" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="33" cy="47" r="4" fill="#fde047"/> <!-- Hand / Glove -->

    <!-- Neck -->
    <rect x="3" y="18" width="8" height="10" fill="#fde047"/>

    <!-- Head -->
    <circle cx="8" cy="5" r="16" fill="#fde047"/>

    <!-- Hair (Styled neatly, blowing back slightly) -->
    <path d="M-6 -3 C-8 -10 2 -14 12 -10 C18 -8 22 0 20 6 C10 4 2 0 -6 -3 Z" fill="#1e293b"/>

    <!-- Face Profile (Smiling, confident, calm) -->
    <path d="M18 4 Q19 7 16 9" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Eye -->
    <path d="M14 12 Q17 15 20 13" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Smile -->
    <circle cx="12" cy="9" r="2" fill="#fb7185" opacity="0.6"/> <!-- Rosy cheek -->
  </g>

  <!-- ENVIRONMENTAL PROPS: Coffee To-Go Cup on a small ledge/mailbox to show daily routine -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="18" height="22" rx="3" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M-2 0 L20 0 L16 -4 L2 -4 Z" fill="#cbd5e1"/>
    <path d="M3 8 L15 8" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Lighting overlay / Sparkles for positive mood & morning energy -->
  <g fill="#fbbf24">
    <circle cx="110" cy="70" r="2" opacity="0.8"/>
    <circle cx="130" cy="50" r="1.5" opacity="0.6"/>
    <circle cx="70" cy="60" r="2.5" opacity="0.9"/>
    <path d="M115 40 L117 45 L122 47 L117 49 L115 54 L113 49 L108 47 L113 45 Z" opacity="0.7" transform="scale(0.5) translate(120, 30)"/>
  </g>
</svg>