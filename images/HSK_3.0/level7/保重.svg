    <circle cx="20" cy="50" r="18" fill="#fde68a"/>
    <path d="M15 45h2M25 45h2M20 60c5 5 10 5 15 0" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Hand gesture -->
