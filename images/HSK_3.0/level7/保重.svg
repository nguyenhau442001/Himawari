<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background Context -->
  <rect x="30" y="40" width="180" height="100" rx="4" fill="#334155" opacity="0.3"/>
  <circle cx="180" cy="70" r="20" fill="#fbbf24"/>
  
  <!-- Character: The one leaving/living alone -->
  <g transform="translate(140, 100)">
