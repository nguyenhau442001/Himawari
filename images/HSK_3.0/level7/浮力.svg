<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 15)">
    <!-- Water background depth -->
    <path d="M 24 135 L 216 135 L 216 200 C 216 211 207 220 196 220 L 44 220 C 33 220 24 211 24 200 Z" fill="#132238"/>
    
    <!-- Underwater glow/currents -->
    <path d="M 40 160 Q 90 170 140 155 T 200 165" fill="none" stroke="#253852" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 190 Q 110 180 160 195 T 210 185" fill="none" stroke="#253852" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Buoyancy Upward Force Arrows (The core semantic visual for 浮力) -->
    <!-- Left Arrow -->
    <g transform="translate(75, 115)">
      <path d="M 0 35 L 0 5" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M -6 12 L 0 3 L 6 12" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Center Arrow (Main) -->
    <g transform="translate(120, 105)">
      <path d="M 0 55 L 0 5" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round"/>
      <path d="M -8 15 L 0 3 L 8 15" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Right Arrow -->
    <g transform="translate(165, 115)">
      <path d="M 0 35 L 0 5" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M -6 12 L 0 3 L 6 12" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Cargo Ship Hull (Lower part submerged) -->
    <path d="M 54 135 L 70 175 C 74 184 82 190 92 190 L 148 190 C 158 190 166 184 170 175 L 186 135 Z" fill="#D32F2F"/>
    
    <!-- Water Line (Surface) -->
    <path d="M 20 135 Q 60 128 120 135 T 220 135" fill="none" stroke="#00BCD4" stroke-width="4" stroke-linecap="round"/>
    <path d="M 20 139 Q 60 132 120 139 T 220 139" fill="none" stroke="#4DD0E1" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Cargo Ship Upper Structure -->
    <!-- Main deck / Hull top -->
    <rect x="50" y="125" width="140" height="10" fill="#E0E0E0" rx="2"/>
    
    <!-- Containers -->
    <rect x="70" y="97" width="30" height="28" fill="#FFC107" rx="2"/>
    <line x1="70" y1="107" x2="100" y2="107" stroke="#FFA000" stroke-width="1"/>
    <line x1="70" y1="117" x2="100" y2="117" stroke="#FFA000" stroke-width="1"/>
    
    <rect x="105" y="97" width="30" height="28" fill="#4CAF50" rx="2"/>
    <line x1="105" y1="107" x2="135" y2="107" stroke="#388E3C" stroke-width="1"/>
    <line x1="105" y1="117" x2="135" y2="117" stroke="#388E3C" stroke-width="1"/>
    
    <rect x="140" y="102" width="28" height="23" fill="#2196F3" rx="2"/>
    
    <!-- Bridge / Control Tower -->
    <rect x="145" y="70" width="22" height="32" fill="#CFD8DC" rx="2"/>
    <rect x="151" y="75" width="10" height="8" fill="#263238" rx="1"/>
    <rect x="153" y="62" width="6" height="8" fill="#90A4AE"/>
    <line x1="156" y1="52" x2="156" y2="62" stroke="#90A4AE" stroke-width="2"/>
  </g>
</svg>