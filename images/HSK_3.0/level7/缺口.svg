<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Coin / Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Warning / Deficit Red Gradient -->
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Screen Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Office Interior Details -->
  <!-- Window & Cityscape Silhouette -->
  <path d="M165 30 L210 30 L210 110 L165 110 Z" fill="url(#window-glow)" />
  <path d="M170 35 L180 35 L180 105 L170 105 Z M185 45 L200 45 L200 105 L185 105 Z" fill="#334155" opacity="0.4" />
  <!-- Window Frame -->
  <path d="M165 30 L210 30 L210 110 L165 110 Z" fill="none" stroke="#475569" stroke-width="2" />
  <line x1="165" y1="70" x2="210" y2="70" stroke="#475569" stroke-width="1.5" />
  <line x1="187" y1="30" x2="187" y2="110" stroke="#475569" stroke-width="1.5" />

  <!-- Bookshelf / Prop in Background -->
  <rect x="25" y="40" width="35" height="70" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="65" x2="60" y2="65" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="90" x2="60" y2="90" stroke="#334155" stroke-width="1.5" />
  <!-- Colorful books -->
  <rect x="30" y="48" width="6" height="17" rx="1" fill="#38bdf8" />
  <rect x="38" y="45" width="8" height="20" rx="1" fill="#f43f5e" />
  <rect x="48" y="52" width="7" height="13" rx="1" fill="#10b981" />

  <!-- Office Desk Surface -->
  <path d="M15 170 L225 170 L235 210 L5 210 Z" fill="url(#desk-grad)" />
  <path d="M15 170 L225 170" stroke="#475569" stroke-width="2" />

  <!-- Giant Financial Tablet / Analytics Screen Showing a Huge Deficit Gap -->
  <g transform="translate(65, 95)">
    <!-- Tablet Stand -->
    <path d="M45 75 L55 75 L60 90 L40 90 Z" fill="#64748b" />
    <rect x="35" y="90" width="30" height="4" rx="2" fill="#475569" />

    <!-- Tablet Body -->
    <rect x="5" y="5" width="90" height="72" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
    
    <!-- Screen Header -->
    <rect x="12" y="11" width="76" height="12" rx="3" fill="#1e293b" />
    <circle cx="18" cy="17" r="2.5" fill="#ef4444" />
    <circle cx="26" cy="17" r="2.5" fill="#f59e0b" />
    <circle cx="34" cy="17" r="2.5" fill="#10b981" />

    <!-- Chart Graphics inside Tablet -->
    <!-- Grid lines -->
    <line x1="15" y1="58" x2="85" y2="58" stroke="#334155" stroke-width="1" />
    <line x1="15" y1="42" x2="85" y2="42" stroke="#334155" stroke-width="1" />
    <line x1="15" y1="26" x2="85" y2="26" stroke="#334155" stroke-width="1" />

    <!-- Bar Chart with a MASSIVE GAP (缺口) -->
    <!-- Bar 1 (High) -->
    <rect x="20" y="32" width="10" height="26" rx="2" fill="#38bdf8" />
    <!-- Bar 2 (Medium) -->
    <rect x="34" y="38" width="10" height="20" rx="2" fill="#38bdf8" />
    
    <!-- MISSING GAP AREA (The core conceptual visualization of 缺口) -->
    <g filter="url(#glow)">
      <!-- Bar 3 (Dangerously low / Broken down into a hollow gap outline) -->
      <rect x="48" y="54" width="10" height="4" rx="1" fill="url(#red-grad)" />
      <!-- Floating warning indicators over the gap -->
      <path d="M53 30 L59 42 L47 42 Z" fill="#f87171" opacity="0.9" />
      <text x="53" y="40" font-size="8" fill="#0f172a" font-weight="bold" text-anchor="middle">!</text>
    </g>

    <!-- Bar 4 (Recovering slightly but disconnected) -->
    <rect x="62" y="40" width="10" height="18" rx="2" fill="#38bdf8" />
    <rect x="76" y="35" width="6" height="23" rx="2" fill="#10b981" />

    <!-- Trend line showing drop -->
    <path d="M25 30 L39 35 L53 50 L67 38 L79 33" fill="none" stroke="url(#red-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Office Chair Backrest -->
  <rect x="175" y="105" width="28" height="65" rx="8" fill="#334155" />
  <rect x="181" y="112" width="16" height="50" rx="4" fill="#1e293b" opacity="0.6" />

  <!-- Expressive Character (Worried Corporate Worker / Manager) -->
  <g transform="translate(130, 95)">
    <!-- Body / Torso (Blue Suit jacket) -->
    <path d="M25 55 C25 45 45 45 55 45 C65 45 85 45 85 55 L95 85 L15 85 Z" fill="#3b82f6" />
    <!-- Inner White Shirt & Tie -->
    <polygon points="55,45 45,60 65,60" fill="#f8fafc" />
    <polygon points="53,58 57,58 55,75" fill="#ef4444" />

    <!-- Neck -->
    <rect x="48" y="36" width="14" height="12" fill="#fdba74" />

    <!-- Head -->
    <circle cx="55" cy="26" r="18" fill="#fdba74" />
    
    <!-- Hair (Neat modern haircut) -->
    <path d="M37 24 C37 14 45 12 55 12 C65 12 73 14 73 24 C73 26 71 22 69 19 C64 15 46 15 41 19 C39 22 37 26 37 24 Z" fill="#334155" />

    <!-- Worried Facial Expressions -->
    <!-- Eyebrows (Tilted inward for stress) -->
    <line x1="44" y1="21" x2="50" y2="24" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="66" y1="21" x2="60" y2="24" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Eyes (Wide, stressed) -->
    <circle cx="47" cy="27" r="2.5" fill="#1e293b" />
    <circle cx="63" cy="27" r="2.5" fill="#1e293b" />

    <!-- Open Worried Mouth (O-shape) -->
    <ellipse cx="55" cy="35" rx="3.5" ry="4.5" fill="#1e293b" />

    <!-- Arms & Hands expressing shock/worry -->
    <!-- Left Arm & Hand touching head -->
    <path d="M25 55 C15 50 20 30 35 32" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
    <circle cx="36" cy="31" r="5" fill="#fdba74" />

    <!-- Right Arm & Hand pointing or resting on desk -->
    <path d="M85 55 C95 60 90 75 75 78" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
    <circle cx="73" cy="79" r="5" fill="#fdba74" />
  </g>

  <!-- Desk Props: Financial Documents, Calculator, and Coins (Symbolizing funds/money being checked) -->
  <!-- Scattered Papers / Files -->
  <g transform="translate(25, 150) rotate(-8)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="6" y1="8" x2="25" y2="8" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="16" x2="29" y2="16" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="24" x2="20" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="32" x2="26" y2="32" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Calculator -->
  <g transform="translate(145, 160) rotate(5)">
    <rect x="0" y="0" width="32" height="42" rx="4" fill="#475569" />
    <rect x="4" y="5" width="24" height="10" rx="2" fill="#94a3b8" />
    <!-- Calculator buttons -->
    <circle cx="9" cy="21" r="2" fill="#cbd5e1" />
    <circle cx="16" cy="21" r="2" fill="#cbd5e1" />
    <circle cx="23" cy="21" r="2" fill="#ef4444" />

    <circle cx="9" cy="28" r="2" fill="#cbd5e1" />
    <circle cx="16" cy="28" r="2" fill="#cbd5e1" />
    <circle cx="23" cy="28" r="2" fill="#cbd5e1" />

    <circle cx="9" cy="35" r="2" fill="#cbd5e1" />
    <circle cx="16" cy="35" r="2" fill="#cbd5e1" />
    <circle cx="23" cy="35" r="2" fill="#f59e0b" />
  </g>

  <!-- Piggy Bank / Coin Stacks (Representing Company Funds / 资金) -->
  <g transform="translate(100, 165)">
    <!-- Stack of Gold Coins -->
    <ellipse cx="12" cy="20" rx="10" ry="4" fill="url(#gold-grad)" />
    <path d="M2 20 L2 24 C2 26 7 28 12 28 C17 28 22 26 22 24 L22 20" fill="url(#gold-grad)" />
    
    <ellipse cx="12" cy="12" rx="10" ry="4" fill="url(#gold-grad)" />
    <path d="M2 12 L2 16 C2 18 7 20 12 20 C17 20 22 18 22 16 L22 12" fill="url(#gold-grad)" />

    <ellipse cx="12" cy="4" rx="10" ry="4" fill="url(#gold-grad)" />
    
    <!-- A single coin rolling away (symbolizing draining funds) -->
    <ellipse cx="32" cy="22" rx="3" ry="6" fill="url(#gold-grad)" transform="rotate(35 32 22)" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(185, 145)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M16 4 C21 4 21 14 16 16" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M5 -3 C6 -6 3 -8 5 -11" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M11 -2 C12 -5 10 -7 12 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

</svg>