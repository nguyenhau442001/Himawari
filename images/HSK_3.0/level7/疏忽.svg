<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow/halo to focus on the central object -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Central Noun: Physical Object representing "Sơ suất" (A slip/oversight - symbolized here as an unstable, wobbling mechanical document/clipboard with a missing crucial piece, or a ticking stopwatch left unattended, or a slipping gear). Let's use a stylized magnifying glass over a document where a key piece is missing/sliding off, representing oversight.
       Or even clearer: A mechanical bolt/screw slipping out of alignment with motion lines (oversight/lapse in attention).
       Let's depict a classic "Slipping Document / Unchecked File Folder" with a loose dropping pen and a warning glow, representing human error/oversight ("sơ suất"). -->

  <!-- Glow effect for the alert/error aspect -->
  <circle cx="120" cy="115" r="45" fill="#FFB703" opacity="0.12"/>

  <!-- Document/Clipboard Body -->
  <g transform="translate(75, 55)">
    <!-- Main Paper -->
    <rect x="10" y="15" width="70" height="90" rx="6" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Paper lines (Simulating text) -->
    <rect x="22" y="32" width="35" height="5" rx="2" fill="#718096"/>
    <rect x="22" y="47" width="45" height="5" rx="2" fill="#718096"/>
    <rect x="22" y="62" width="28" height="5" rx="2" fill="#718096"/>
    <rect x="22" y="77" width="40" height="5" rx="2" fill="#718096"/>

    <!-- Clipboard Clip at Top -->
    <path d="M30 15H60V22C60 25.3137 57.3137 28 54 28H36C32.6863 28 30 25.3137 30 22V15Z" fill="#E2E8F0"/>
    <rect x="38" y="12" width="14" height="6" rx="2" fill="#CBD5E0"/>

    <!-- The "Slip / Oversight" Element: A red warning stamp or detached piece sliding off awkwardly -->
    <!-- Red Accent Stamp/Marker indicating a missed error -->
    <g transform="translate(35, 45) rotate(-15)">
      <rect x="0" y="0" width="42" height="32" rx="4" fill="#EF4444" opacity="0.9"/>
      <!-- Exclamation mark icon inside stamp -->
      <path d="M21 8V18M21 22H21.01" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating / Slipping Pen accent (reinforcing "temporary lapse/slip") -->
  <g transform="translate(155, 140) rotate(35)">
    <!-- Pen body -->
    <rect x="0" y="0" width="8" height="45" rx="3" fill="#FFB703"/>
    <!-- Pen tip -->
    <path d="M0 45L4 53L8 45H0Z" fill="#E2E8F0"/>
    <!-- Pen cap end -->
    <rect x="2" y="-4" width="4" height="4" rx="1" fill="#D97706"/>
  </g>

  <!-- Motion / slip trail lines -->
  <path d="M165 130C160 120 150 110 135 105" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5" opacity="0.8"/>

  <!-- Small accent dots for clean flat modern UI look -->
  <circle cx="50" cy="180" r="3" fill="#4A5568"/>
  <circle cx="195" cy="70" r="4" fill="#FFB703" opacity="0.5"/>
  <circle cx="60" cy="70" r="2" fill="#4A5568"/>

</svg>