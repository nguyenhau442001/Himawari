<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main Document (The Business Application) -->
  <rect x="60" y="40" width="120" height="160" rx="4" fill="#2D343E" stroke="#4A5568" stroke-width="2"/>
  <rect x="75" y="60" width="90" height="8" rx="2" fill="#4A5568"/>
  <rect x="75" y="80" width="90" height="8" rx="2" fill="#4A5568"/>
  <rect x="75" y="100" width="60" height="8" rx="2" fill="#4A5568"/>
  
  <!-- The Attached Document (The "Fu" - 附) -->
  <g transform="translate(110, 120)">
    <rect x="0" y="0" width="80" height="100" rx="4" fill="#F6AD55"/>
    <rect x="10" y="15" width="60" height="6" rx="2" fill="#2D343E"/>
    <rect x="10" y="30" width="60" height="6" rx="2" fill="#2D343E"/>
    <rect x="10" y="45" width="40" height="6" rx="2" fill="#2D343E"/>
    
    <!-- Paperclip attachment -->
    <path d="M 20 -10 C 20 -25, 40 -25, 40 -10 L 40 10 C 40 20, 20 20, 20 10" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle shadow for depth -->
  <rect x="110" y="120" width="80" height="100" rx="4" fill="black" fill-opacity="0.2"/>
</svg>