<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="room-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Gift Box 1 Gradient (Emerald) -->
    <linearGradient id="box1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gift Box 2 Gradient (Pink) -->
    <linearGradient id="box2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Ribbon Gradient (Gold) -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#room-glow)" />

  <!-- Background Environment & Interior Details -->
  <!-- Floor -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Wallpaper Stars/Deco -->
  <g fill="#334155" opacity="0.4">
    <circle cx="30" cy="50" r="1.5" />
    <circle cx="210" cy="40" r="2" />
    <circle cx="190" cy="90" r="1" />
    <circle cx="50" cy="110" r="1.5" />
  </g>

  <!-- Shelf with Toys in background -->
  <rect x="25" y="75" rel="" width="60" height="6" rx="3" fill="#334155" />
  <circle cx="45" cy="67" r="8" fill="#38bdf8" />
  <path d="M65 75 L75 62 L85 75 Z" fill="#fb923c" />

  <!-- Coffee Table / Floor Surface for Gifts -->
  <ellipse cx="120" cy="195" rx="100" ry="15" fill="#1e293b" opacity="0.6" />

  <!-- ==================== CHILD 1 (LEFT) ==================== -->
  <g id="child-left" filter="url(#shadow)">
    <!-- Legs/Body -->
    <path d="M60 170 L75 195 L90 190" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Torso -->
    <path d="M50 135 C50 115 85 115 85 135 L85 175 L50 175 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="67" cy="95" r="18" fill="#fed7aa" />
    <!-- Hair (Messy/Excited) -->
    <path d="M48 95 C48 80 75 75 85 88 C80 82 60 82 55 90 Z" fill="#b45309" />
    <path d="M62 78 C65 72 72 73 75 79 Z" fill="#b45309" />
    <!-- Excited Eyes (Wide, shiny arcs) -->
    <path d="M60 94 Q64 90 68 94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M72 94 Q76 90 80 94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Open Happy Mouth -->
    <path d="M66 102 Q70 110 74 102 Z" fill="#e11d48" />
    <!-- Arms Reaching Out to Open Gift -->
    <path d="M50 135 C35 135 30 150 45 155" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hands tearing wrapping -->
    <circle cx="45" cy="155" r="5" fill="#fed7aa" />
  </g>

  <!-- ==================== CHILD 2 (RIGHT) ==================== -->
  <g id="child-right" filter="url(#shadow)">
    <!-- Legs/Body -->
    <path d="M150 175 L165 198 L180 190" stroke="#ec4899" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Torso -->
    <path d="M150 135 C150 115 185 115 185 135 L185 180 L150 180 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="168" cy="95" r="18" fill="#fed7aa" />
    <!-- Hair (Pigtails) -->
    <path d="M150 92 C150 75 185 75 185 92 C180 85 155 85 150 92 Z" fill="#7c2d12" />
    <circle cx="145" cy="88" r="5" fill="#f43f5e" />
    <circle cx="190" cy="88" r="5" fill="#f43f5e" />
    <!-- Excited Eyes -->
    <path d="M160 94 Q164 90 168 94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M172 94 Q176 90 180 94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Open Happy Mouth -->
    <path d="M166 102 Q170 110 174 102 Z" fill="#e11d48" />
    <!-- Arms Reaching Down to Gift -->
    <path d="M180 135 C195 140 200 155 190 165" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="190" cy="165" r="5" fill="#fed7aa" />
  </g>

  <!-- ==================== CENTRAL GIFT BOX (BEING OPENED) ==================== -->
  <g id="central-gift" filter="url(#shadow)">
    <!-- Box Base -->
    <rect x="95" y="150" width="50" height="40" rx="4" fill="url(#box1-grad)" />
    
    <!-- Vertical Ribbon -->
    <rect x="115" y="150" width="10" height="40" fill="url(#ribbon-grad)" />
    <!-- Horizontal Ribbon -->
    <rect x="95" y="165" width="50" height="10" fill="url(#ribbon-grad)" />

    <!-- Exploding / Flying Lid (Showing "pòbùjídài" - eagerly ripping open) -->
    <g transform="translate(110, 115) rotate(-25)">
      <rect x="-30" y="-10" width="60" height="15" rx="3" fill="url(#box1-grad)" />
      <rect x="-5" y="-10" width="10" height="15" fill="url(#ribbon-grad)" />
      <!-- Bow on Lid -->
      <path d="M-10 -15 C-20 -25 -5 -30 0 -10 C5 -30 20 -25 10 -15 Z" fill="url(#ribbon-grad)" />
    </g>

    <!-- Magic Sparkles / Energy Burst from Opening -->
    <g fill="#fbbf24">
      <path d="M120 135 L123 143 L131 140 L125 146 L130 152 L121 149 L118 156 L117 148 L110 145 L117 142 Z" />
      <circle cx="95" cy="130" r="3" />
      <circle cx="150" cy="135" r="2" />
      <circle cx="135" cy="115" r="2.5" />
    </g>
    <g fill="#f43f5e">
      <circle cx="105" cy="120" r="2" />
      <circle cx="145" cy="125" r="3" />
    </g>
  </g>

  <!-- ==================== SECONDARY GIFT BOX (LEFT) ==================== -->
  <g id="secondary-gift" filter="url(#shadow)">
    <rect x="35" y="165" width="35" height="25" rx="3" fill="url(#box2-grad)" />
    <rect x="48" y="165" width="9" height="25" fill="url(#ribbon-grad)" />
    <rect x="35" y="173" width="35" height="8" fill="url(#ribbon-grad)" />
    <!-- Small Bow -->
    <path d="M48 165 C40 155 50 150 52 165 C55 150 65 155 57 165 Z" fill="url(#ribbon-grad)" />
  </g>

</svg>