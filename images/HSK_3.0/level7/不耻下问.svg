<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Senior Scholar (The Teacher/Learner) -->
  <g transform="translate(130, 100)">
    <circle cx="0" cy="0" r="25" fill="#FFB84D"/>
    <path d="M-15 -10 Q 0 -20 15 -10" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <rect x="-30" y="25" width="60" height="80" rx="10" fill="#FFB84D"/>
    <path d="M-30 40 L-50 80 M30 40 L50 80" stroke="#FFB84D" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Junior Learner (The Source of Knowledge) -->
  <g transform="translate(80, 140)">
    <circle cx="0" cy="0" r="20" fill="#4D94FF"/>
    <rect x="-20" y="20" width="40" height="60" rx="8" fill="#4D94FF"/>
    <path d="M-20 30 L-35 60 M20 30 L35 60" stroke="#4D94FF" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Interaction: Scholar bowing slightly to listen -->
  <path d="M105 90 L125 110" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Book representing the exchange of knowledge -->
  <path d="M100 160 L140 160 L135 185 L95 185 Z" fill="#E0E0E0"/>
  <path d="M120 160 L120 185" stroke="#1A1D24" stroke-width="2"/>
  
  <!-- Ground line -->
  <path d="M40 200 L200 200" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
</svg>