<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Glow effect behind the main card -->
    <ellipse cx="120" cy="125" rx="70" ry="45" fill="#3B82F6" opacity="0.15" filter="blur(8px)"/>

    <!-- Background Card (Slightly tilted for depth) -->
    <g transform="translate(120, 115) rotate(12) translate(-120, -115)">
      <rect x="75" y="75" width="90" height="60" rx="8" fill="#2563EB" opacity="0.4"/>
      <rect x="75" y="90" width="90" height="12" fill="#1E40AF" opacity="0.5"/>
    </g>

    <!-- Main Bank Card (Central Focus) -->
    <g transform="translate(120, 125) rotate(-8) translate(-120, -125)">
      <!-- Card Body -->
      <rect x="65" y="80" width="110" height="72" rx="10" fill="#2563EB"/>
      <rect x="65" y="80" width="110" height="72" rx="10" fill="url(#cardGradient)" opacity="0.9"/>
      
      <!-- Magnetic Stripe -->
      <rect x="65" y="94" width="110" height="14" fill="#0F172A"/>
      
      <!-- EMV Chip -->
      <rect x="80" y="118" width="16" height="12" rx="2" fill="#F59E0B"/>
      <line x1="88" y1="118" x2="88" y2="130" stroke="#B45309" stroke-width="1"/>
      <line x1="80" y1="124" x2="96" y2="124" stroke="#B45309" stroke-width="1"/>

      <!-- Contactless Icon / Waves -->
      <path d="M158 120 C161 122, 161 126, 158 128" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M162 117 C166 121, 166 127, 162 131" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Stylized Card Numbers -->
      <circle cx="106" cy="124" r="2" fill="#93C5FD"/>
      <circle cx="113" cy="124" r="2" fill="#93C5FD"/>
      <circle cx="120" cy="124" r="2" fill="#93C5FD"/>
      <circle cx="127" cy="124" r="2" fill="#93C5FD"/>

      <!-- Card Brand Circles (Simulated Chip/Logo) -->
      <circle cx="148" cy="138" r="7" fill="#EF4444" opacity="0.8"/>
      <circle cx="156" cy="138" r="7" fill="#F59E0B" opacity="0.8"/>
    </g>

    <!-- Sparkles / High-contrast Focus Accents -->
    <path d="M165 75 L168 85 L178 88 L168 91 L165 101 L162 91 L152 88 L162 85 Z" fill="#F59E0B" opacity="0.9"/>
    <path d="M80 155 L82 161 L88 163 L82 165 L80 171 L78 165 L72 163 L78 161 Z" fill="#60A5FA" opacity="0.8"/>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="cardGradient" x1="65" y1="80" x2="175" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
</svg>