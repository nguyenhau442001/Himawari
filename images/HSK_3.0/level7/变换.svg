<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle stage floor and background ambiance representing the contextual reference -->
  <ellipse cx="120" cy="180" rx="70" ry="20" fill="#252A34" opacity="0.6"/>
  
  <!-- Dynamic lighting beams emitting from above -->
  <polygon points="120,40 50,180 90,180" fill="#FF5722" opacity="0.15"/>
  <polygon points="120,40 100,180 140,180" fill="#00E5FF" opacity="0.15"/>
  <polygon points="120,40 150,180 190,180" fill="#FFEB3B" opacity="0.15"/>

  <!-- Central Physical Object representing "变换" (The Stage Spotlight Fixture / Dynamic Color Light) -->
  <!-- Spotlight casing mounted/hovering centrally -->
  <g transform="translate(120, 85)">
    <!-- Hanging mount / bracket -->
    <path d="M-15,-25 L15,-25 L10,-10 L-10,-10 Z" fill="#3A3F4B"/>
    <rect x="-3" y="-35" width="6" height="10" fill="#2C303B"/>

    <!-- Main cylindrical light housing -->
    <rect x="-24" y="-10" width="48" height="55" rx="8" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    
    <!-- Cooling fins detail -->
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#4C566A" stroke-width="2"/>
    <line x1="-22" y1="10" x2="22" y2="10" stroke="#4C566A" stroke-width="2"/>
    <line x1="-20" y1="18" x2="20" y2="18" stroke="#4C566A" stroke-width="2"/>

    <!-- Lens bezel (faceted for transformation/shift) -->
    <ellipse cx="0" cy="45" rx="24" ry="10" fill="#3B4252" stroke="#4C566A" stroke-width="2"/>
  </g>

  <!-- Multi-colored dynamic beams shifting/transforming downwards -->
  <!-- Left beam (Cyan) -->
  <path d="M102,130 L40,210 L80,210 L110,130 Z" fill="#00E5FF" opacity="0.8"/>
  <!-- Center beam (Gold/Orange - focus accent) -->
  <path d="M115,130 L95,210 L145,210 L125,130 Z" fill="#FF9800" opacity="0.9"/>
  <!-- Right beam (Magenta/Pink) -->
  <path d="M138,130 L160,210 L200,210 L148,130 Z" fill="#E91E63" opacity="0.8"/>

  <!-- Fluid geometric transformation particles/shapes floating at the base -->
  <circle cx="65" cy="195" r="5" fill="#00E5FF" opacity="0.9"/>
  <rect x="105" y="200" width="8" height="8" rx="2" fill="#FF9800" transform="rotate(45 109 204)"/>
  <polygon points="175,190 182,202 168,202" fill="#E91E63" opacity="0.9"/>
  <circle cx="135" cy="185" r="3" fill="#FFEB3B"/>

</svg>