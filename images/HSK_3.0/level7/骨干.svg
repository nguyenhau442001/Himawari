<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Backbone Glow (symbolizing "cốt cán") -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <circle cx="140" cy="100" r="120" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT: Modern Office Background Elements -->
  <!-- Large Office Window showing city silhouette & lights -->
  <g opacity="0.3">
    <!-- Window frame -->
    <rect x="24" y="24" width="70" height="95" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <line x1="59" y1="24" x2="59" y2="119" stroke="#475569" stroke-width="1"/>
    <line x1="24" y1="70" x2="94" y2="70" stroke="#475569" stroke-width="1"/>
    <!-- City lights through window -->
    <rect x="30" y="32" width="10" height="15" fill="#f59e0b" rx="1"/>
    <rect x="45" y="40" width="10" height="22" fill="#38bdf8" rx="1"/>
    <rect x="65" y="35" width="12" height="18" fill="#f59e0b" rx="1"/>
    <rect x="30" y="80" width="12" height="25" fill="#38bdf8" rx="1"/>
    <rect x="75" y="78" width="10" height="15" fill="#ec4899" rx="1"/>
  </g>

  <!-- Bookshelf & Plant on background wall -->
  <rect x="185" y="30" width="30" height="8" rx="2" fill="#475569"/>
  <rect x="190" y="15" width="20" height="15" rx="2" fill="#10b981"/> <!-- Plant pot -->
  <path d="M195,15 Q190,5 185,10 Q192,2 200,8 Q208,2 215,10 Q210,5 205,15" fill="#34d399"/> <!-- Plant leaves -->

  <!-- Office Desk -->
  <path d="M20,185 L220,185 L210,210 L30,210 Z" fill="#0f172a" opacity="0.9"/>
  <rect x="25" y="180" width="190" height="8" rx="3" fill="#334155"/>
  <rect x="40" y="145" width="35" height="35" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/> <!-- Drawer unit -->

  <!-- Desk Props: Laptop & Analytics charts -->
  <path d="M140,165 L180,165 L185,180 L135,180 Z" fill="#64748b"/> <!-- Laptop base -->
  <path d="M142,130 L178,130 C180,130 181,131 181,133 L181,165 L139,165 L139,133 C139,131 140,130 142,130 Z" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/> <!-- Laptop screen -->
  <!-- Screen Data Visualization -->
  <polyline points="145,155 152,148 160,152 170,138 175,145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="170" cy="138" r="2.5" fill="#f59e0b"/>

  <!-- Coffee Mug -->
  <rect x="110" y="162" width="12" height="16" rx="2" fill="#e2e8f0"/>
  <path d="M122,166 C126,166 126,174 122,174" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN SUBJECT: The Core Pillar / Backbone Employee ("骨干") -->
  <!-- He is standing confidently guiding team members, acting as the structural pillar of the company -->

  <!-- Character 1 (Central Leader / Backbone - Male with rolled-up sleeves & tie) -->
  <g transform="translate(105, 75)">
    <!-- Shadow beneath feet -->
    <ellipse cx="15" cy="108" rx="25" ry="6" fill="#000000" opacity="0.4"/>

    <!-- Legs & Shoes -->
    <rect x="3" y="70" width="9" height="38" rx="4" fill="#334155"/>
    <rect x="18" y="70" width="9" height="38" rx="4" fill="#334155"/>
    <path d="M0,105 L11,105 C13,105 13,108 11,109 L-1,109 C-3,109 -3,107 -1,105 Z" fill="#0f172a"/>
    <path d="M15,105 L26,105 C28,105 28,108 26,109 L14,109 C12,109 12,107 14,105 Z" fill="#0f172a"/>

    <!-- Torso with Golden 'Backbone' structural glow subtly hinted through styling -->
    <path d="M4,25 L26,25 C31,25 33,30 31,45 L27,72 C27,74 25,75 23,75 L7,75 C5,75 3,74 3,72 L-1,45 C-3,30 -1,25 4,25 Z" fill="#2563eb"/> <!-- Crisp blue shirt -->
    
    <!-- Subtle Golden Tie (Symbolizing Core/Backbone identity) -->
    <polygon points="13,27 17,27 19,55 15,62 11,55" fill="url(#coreGlow)"/>

    <!-- Arms & Gestures (Confident pointing/explaining pose) -->
    <!-- Left arm resting on hip -->
    <path d="M-1,28 C-8,35 -10,50 -5,60" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <!-- Right arm gesturing forward dynamically -->
    <path d="M29,28 C38,35 44,45 42,50" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="43" cy="51" r="4" fill="#fbcfe8"/>

    <!-- Neck & Head -->
    <rect x="11" y="16" width="8" height="12" fill="#fbcfe8"/>
    <circle cx="15" cy="11" r="11" fill="#fbcfe8"/>

    <!-- Hair (Stylish modern dark hair) -->
    <path d="M4,11 C4,3 12,2 17,4 C23,6 25,12 26,15 C26,15 22,13 20,10 C16,6 10,7 6,11 Z" fill="#0f172a"/>

    <!-- Confident facial expression -->
    <path d="M19,11 Q21,12 22,14" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/> <!-- Eye -->
    <path d="M10,13 Q11,14 12,13" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/> <!-- Smile -->
  </g>

  <!-- Character 2 (Colleague listening and learning from the backbone) -->
  <g transform="translate(60, 95)">
    <!-- Shadow -->
    <ellipse cx="12" cy="88" rx="20" ry="5" fill="#000000" opacity="0.3"/>
    
    <!-- Body & Legs -->
    <rect x="4" y="55" width="7" height="32" rx="3" fill="#475569"/>
    <rect x="14" y="55" width="7" height="32" rx="3" fill="#475569"/>
    <path d="M2,22 L23,22 C26,22 27,25 26,38 L22,58 C22,59 21,60 20,60 L6,60 C5,60 4,59 4,58 L0,38 C-1,25 0,22 2,22 Z" fill="#0ea5e9"/> <!-- Teal blouse -->

    <!-- Neck & Head -->
    <rect x="10" y="14" width="6" height="10" fill="#fbcfe8"/>
    <circle cx="13" cy="9" r="9.5" fill="#fbcfe8"/>

    <!-- Hair (Ponytail) -->
    <path d="M6,7 C5,1 10,1 15,2 C21,3 23,8 24,12 C24,12 27,7 23,3 C19,-1 11,-1 6,7 Z" fill="#334155"/>
    <circle cx="25" cy="11" r="3.5" fill="#334155"/> <!-- Ponytail bun -->

    <!-- Attentive pose (arms folded/holding notepad) -->
    <path d="M2,26 C10,32 15,35 22,28" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Foreground Floating Architectural/Structural Node Overlay (Subtly emphasizing framework/core strength concept without text) -->
  <g transform="translate(145, 45)">
    <rect x="0" y="0" width="55" height="40" rx="8" fill="url(#cardBg)" stroke="#475569" stroke-width="1"/>
    <!-- Connection lines graph inside card representing pillar stability -->
    <circle cx="15" cy="20" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="12" r="3" fill="#38bdf8"/>
    <circle cx="40" cy="28" r="3" fill="#10b981"/>
    <line x1="18" y1="18" x2="37" y2="13" stroke="#f59e0b" stroke-width="2"/>
    <line x1="18" y1="22" x2="37" y2="27" stroke="#10b981" stroke-width="2"/>
    <!-- Central node pulse ring -->
    <circle cx="15" cy="20" r="8" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Ambient lighting sparkles (warm golden core vibe) -->
  <circle cx="115" cy="65" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="135" cy="50" r="1.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="100" cy="45" r="2.5" fill="#fbbf24" opacity="0.6"/>

  <!-- Framing Inner Border -->
  <rect x="8" y="8" width="224" height="224" rx="18" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
</svg>