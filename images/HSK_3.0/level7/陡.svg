<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric background glow / depth elements -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>

  <!-- Conceptual Illustration for "陡" (Steep slope / Cliffside road) -->
  <g transform="translate(0, 0)">
    <!-- Cliff / Steep Mountain Background -->
    <path d="M 40 200 L 40 100 L 200 200 Z" fill="#282E3D"/>
    
    <!-- Mountain Face Texture Lines (Flat style) -->
    <path d="M 60 170 L 90 140 L 80 190 Z" fill="#202530" opacity="0.7"/>
    <path d="M 110 145 L 150 110 L 140 180 Z" fill="#202530" opacity="0.5"/>

    <!-- The Steep Road Surface (Angled sharply upward) -->
    <!-- Road base/thickness -->
    <path d="M 35 205 L 205 135 L 205 145 L 45 205 Z" fill="#3A4256"/>
    <!-- Main road surface -->
    <path d="M 40 200 L 200 130 L 200 138 L 40 208 Z" fill="#4E5970"/>

    <!-- Road center dashes (perspectively scaled) -->
    <line x1="70" y1="188" x2="85" y2="182" stroke="#F6C90E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="110" y1="172" x2="135" y2="162" stroke="#F6C90E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="152" x2="185" y2="142" stroke="#F6C90E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cyclist struggling up the steep slope (Context: 骑车要小心) -->
    <g transform="translate(115, 148) rotate(-23)">
      <!-- Bicycle Shadow -->
      <ellipse cx="0" cy="16" rx="14" ry="3" fill="#111318" opacity="0.4"/>

      <!-- Rear Wheel -->
      <circle cx="-14" cy="8" r="9" fill="none" stroke="#A6B0C3" stroke-width="3"/>
      <circle cx="-14" cy="8" r="3" fill="#F6C90E"/>

      <!-- Front Wheel -->
      <circle cx="14" cy="8" r="9" fill="none" stroke="#A6B0C3" stroke-width="3"/>
      <circle cx="14" cy="8" r="3" fill="#F6C90E"/>

      <!-- Bike Frame -->
      <polyline points="-14,8 0,3 14,8" fill="none" stroke="#F6C90E" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="0,3 -4,-12 8,-12" fill="none" stroke="#F6C90E" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="-4,-12 -9,8" fill="none" stroke="#F6C90E" stroke-width="3" stroke-linejoin="round"/>

      <!-- Cyclist Body (Leaning forward significantly due to steepness) -->
      <!-- Legs (Pedaling) -->
      <path d="M -4,-12 L -9,2 L -14,8" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -4,-12 L 2,6 L 14,8" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Torso & Head -->
      <path d="M -4,-12 C -6,-20 2,-24 8,-20" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
      <!-- Helmet -->
      <circle cx="10" cy="-23" r="5" fill="#FF5722"/>
      <!-- Arms gripping handlebars -->
      <path d="M 5,-18 L 8,-12" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Steepness Angle Indicator / Aesthetic accent (Subtle angle bracket matching flat vector rules) -->
    <g transform="translate(180, 85)" opacity="0.8">
      <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#F6C90E" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="5" y="20" fill="#F6C90E" font-family="sans-serif" font-weight="bold" font-size="12"></text>
    </g>
  </g>
</svg>