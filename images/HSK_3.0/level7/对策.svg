<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Glow -->
    <radialGradient id="window-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Lamp Light -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    
    <!-- Board Glow (Strategy/Idea) -->
    <radialGradient id="board-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Details: Window & Night Cityscape (Context) -->
  <circle cx="120" cy="120" r="120" fill="url(#window-glow)" />
  <rect x="150" y="30" width="60" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- City buildings outside window -->
  <rect x="158" y="70" width="12" height="50" fill="#334155" opacity="0.6" />
  <rect x="174" y="50" width="15" height="70" fill="#475569" opacity="0.6" />
  <rect x="193" y="80" width="10" height="40" fill="#334155" opacity="0.6" />
  <circle cx="164" cy="75" r="1" fill="#fbbf24" />
  <circle cx="181" cy="60" r="1" fill="#38bdf8" />
  <circle cx="181" cy="70" r="1" fill="#fbbf24" />

  <!-- Wall Elements: Strategy Whiteboard / Corkboard -->
  <rect x="25" y="35" width="95" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3" />
  <rect x="25" y="35" width="95" height="75" rx="6" fill="url(#board-glow)" />
  <!-- Charts & Sticky notes on board (Representing 'strategy' / 对策) -->
  <line x1="38" y1="52" x2="65" y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="38" y1="63" x2="55" y2="63" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <!-- Sticky note 1 (Orange) -->
  <rect x="75" y="45" width="18" height="18" rx="2" fill="#fb923c" />
  <line x1="79" y1="50" x2="89" y2="50" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="79" y1="55" x2="86" y2="55" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
  <!-- Sticky note 2 (Green) -->
  <rect x="96" y="55" width="18" height="18" rx="2" fill="#10b981" />
  <circle cx="105" cy="64" r="4" fill="#065f46" />
  <!-- Flowchart arrows / nodes -->
  <circle cx="45" cy="85" r="4" fill="#fbbf24" />
  <path d="M 49 85 L 65 85" stroke="#64748b" stroke-width="2" stroke-dasharray="2 2" />
  <circle cx="69" cy="85" r="4" fill="#38bdf8" />
  <path d="M 73 85 L 89 85" stroke="#64748b" stroke-width="2" stroke-dasharray="2 2" />
  <circle cx="93" cy="85" r="5" fill="#ec4899" />

  <!-- Desk & Office Props -->
  <rect x="15" y="195" width="210" height="15" rx="3" fill="#334155" />
  <rect x="25" y="165" width="190" height="30" rx="4" fill="#475569" />
  <path d="M 35 195 L 35 225" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <path d="M 205 195 L 205 225" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- Laptop on Desk -->
  <path d="M 140 180 L 180 180 L 185 168 L 135 168 Z" fill="#64748b" />
  <rect x="133" y="145" width="54" height="25" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
  <!-- Laptop screen content (abstract data) -->
  <line x1="139" y1="152" x2="155" y2="152" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="139" y1="159" x2="168" y2="159" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Coffee Mug -->
  <rect x="195" y="153" width="14" height="16" rx="2" fill="#cbd5e1" />
  <path d="M 209 157 C 213 157, 213 164, 209 164" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <!-- Lamp -->
  <ellipse cx="60" cy="165" rx="8" ry="3" fill="#94a3b8" />
  <path d="M 60 165 L 50 125" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M 50 125 L 65 115" fill="#fbbf24" />
  <path d="M 45 125 C 45 120, 55 120, 55 125 Z" fill="#f59e0b" />
  <circle cx="50" cy="125" r="15" fill="url(#lamp-glow)" />

  <!-- CHARACTER 1: Left (Pondering / Thinking of a countermeasure) -->
  <!-- Body & Torso -->
  <path d="M 60 210 L 60 165 C 60 150, 75 145, 85 155 L 95 210 Z" fill="#3b82f6" />
  <!-- Head -->
  <circle cx="78" cy="130" r="16" fill="#fbcfe8" />
  <!-- Hair (Dark modern style) -->
  <path d="M 62 130 C 62 118, 80 115, 93 125 C 93 130, 90 135, 90 135 C 90 135, 82 120, 70 122 C 64 123, 62 127, 62 130 Z" fill="#1e293b" />
  <!-- Glasses (Smart look) -->
  <rect x="71" y="125" width="7" height="5" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="80" y="125" width="7" height="5" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="78" y1="127" x2="80" y2="127" stroke="#1e293b" stroke-width="1.5" />
  <!-- Arm & Thinking pose (hand on chin) -->
  <path d="M 70 160 L 60 180 L 75 185" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="76" cy="178" r="4" fill="#fbcfe8" /> <!-- Hand on chin -->

  <!-- CHARACTER 2: Right (Collaborating / Pointing at board or discussing plan) -->
  <!-- Body & Torso -->
  <path d="M 125 210 L 125 160 C 125 145, 145 145, 150 160 L 155 210 Z" fill="#10b981" />
  <!-- Head -->
  <circle cx="138" cy="125" r="16" fill="#fbcfe8" />
  <!-- Hair (Ponytail/Bun style) -->
  <path d="M 122 122 C 122 112, 140 110, 152 120 C 155 125, 152 132, 152 132 C 152 132, 142 118, 132 118 C 126 118, 122 120, 122 122 Z" fill="#b45309" />
  <circle cx="154" cy="118" r="4" fill="#b45309" />
  <!-- Face expression: engaged/talking -->
  <path d="M 135 131 Q 138 135 142 131" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round" />
  <!-- Arm pointing up/forward towards the board plan -->
  <path d="M 145 155 L 165 135" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
  <circle cx="168" cy="132" r="4" fill="#fbcfe8" /> <!-- Pointing hand -->

  <!-- IDEA / STRATEGY SPARKLE (Visualizing "对策" - The breakthrough idea) -->
  <g transform="translate(100, 75)">
    <!-- Glowing lightbulb representing solution/strategy -->
    <path d="M 0 0 C -8 -8, -8 -18, 0 -22 C 8 -18, 8 -8, 0 0 Z" fill="#fbbf24" />
    <rect x="-3" y="1" width="6" height="4" rx="1" fill="#94a3b8" />
    <path d="M -2 7 L 2 7" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Sparkle rays -->
    <path d="M -15 -11 L -10 -9" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <path d="M 15 -11 L 10 -9" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <path d="M 0 -28 L 0 -24" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>