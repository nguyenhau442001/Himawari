<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptualizing "Intention/Aim" (意图) as a person planning a path -->
  <!-- Character -->
  <g transform="translate(60, 120)">
    <circle cx="40" cy="-30" r="12" fill="#FFB84D"/>
    <path d="M30 0h20c10 0 15 10 15 20v40H25V0z" fill="#FFB84D"/>
    <path d="M35 60v30h10v-30z" fill="#FFB84D"/>
    <path d="M55 60v30h10v-30z" fill="#FFB84D"/>
  </g>

  <!-- The "Intention" - A clear, focused path towards a goal -->
  <g stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Motion lines indicating focus/direction -->
    <path d="M110 90 L180 60" stroke-dasharray="6 6"/>
    <path d="M110 80 L190 40" stroke-dasharray="6 6"/>
    
    <!-- The Goal/Target Object -->
    <circle cx="200" cy="40" r="15" stroke="#FFB84D" fill="none"/>
    <circle cx="200" cy="40" r="5" fill="#FFB84D"/>
  </g>

  <!-- Hand gesture pointing to the goal -->
  <g transform="translate(90, 80)">
    <path d="M0 0 L25 -25" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="25" cy="-25" r="4" fill="#FFB84D"/>
  </g>
</svg>