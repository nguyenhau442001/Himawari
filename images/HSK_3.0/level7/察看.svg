<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background architectural structure (Bridge pier under inspection) -->
  <path d="M70 180 L85 80 L155 80 L170 180 Z" fill="#2A2F3B"/>
  <!-- Concrete texture lines -->
  <line x1="90" y1="100" x2="150" y2="100" stroke="#363C4A" stroke-width="2"/>
  <line x1="85" y1="130" x2="155" y2="130" stroke="#363C4A" stroke-width="2"/>
  <line x1="80" y1="160" x2="160" y2="160" stroke="#363C4A" stroke-width="2"/>

  <!-- Ground -->
  <rect x="40" y="180" width="160" height="10" rx="2" fill="#363C4A"/>

  <!-- Chief Engineer Character Inspecting -->
  <!-- Body/Coat -->
  <path d="M120 120 C110 120 100 135 95 150 L95 185 L145 185 L145 150 C140 135 130 120 120 120 Z" fill="#1E3A8A"/>
  <!-- Hard hat (Safety helmet - high contrast orange accent) -->
  <path d="M102 102 C102 92 110 88 120 88 C130 88 138 92 138 102 Z" fill="#F97316"/>
  <rect x="98" y="101" width="44" height="4" rx="2" fill="#EA580C"/>

  <!-- Head/Face profile -->
  <circle cx="120" cy="108" r="8" fill="#FDE047"/>

  <!-- Magnifying / Observing Gesture & Focus Beam -->
  <!-- Inspection cone/light beam representing '察看' (close careful observation) -->
  <polygon points="120,130 85,165 110,165" fill="#38BDF8" opacity="0.15"/>
  <polygon points="120,130 95,165 105,165" fill="#38BDF8" opacity="0.3"/>

  <!-- Magnifying glass symbolizing careful inspection -->
  <g transform="translate(95, 145)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#F8FAFC" stroke-width="4"/>
    <circle cx="0" cy="0" r="12" fill="#38BDF8" opacity="0.3"/>
    <line x1="10" y1="10" x2="22" y2="22" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Highlight accent point on the concrete surface being inspected -->
  <circle cx="102" cy="155" r="4" fill="#F97316"/>
  <circle cx="102" cy="155" r="8" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.8"/>
</svg>