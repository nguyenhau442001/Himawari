<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Office Environment Hints (Subtle) -->
  <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <rect x="70" y="90" width="100" height="60" rx="4" fill="#222632" opacity="0.5"/>

  <!-- Warning Aura / Ominous Shadow Base -->
  <ellipse cx="120" cy="180" rx="40" ry="12" fill="#E65C00" opacity="0.15"/>

  <!-- Character / Boss Figure Silhouette (Severe, Ominous) -->
  <g transform="translate(0, 0)">
    <!-- Body / Suit -->
    <path d="M 95 180 L 95 140 C 95 125, 145 125, 145 140 L 145 180 Z" fill="#2E3548"/>
    <path d="M 120 135 L 105 160 L 135 160 Z" fill="#E2E8F0"/> <!-- Tie -->
    
    <!-- Shoulders / Suit jacket -->
    <path d="M 80 180 L 85 142 C 95 138, 145 138, 155 142 L 160 180 Z" fill="#3B4256"/>

    <!-- Head / Face (Stern, Dark shadow cast from top) -->
    <circle cx="120" cy="110" r="16" fill="#F1C27D"/>
    <!-- Shadow over upper face -->
    <path d="M 104 100 C 104 90, 136 90, 136 100 L 136 112 C 136 112, 104 112, 104 112 Z" fill="#1A1D24" opacity="0.6"/>
    <!-- Stern Mouth -->
    <path d="M 113 118 L 127 118" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dramatic Red/Orange Warning Elements (不妙 / "Uh-Oh" Situation) -->
  <!-- Sweating Drop / Anxiety Indicator -->
  <path d="M 135 106 C 135 106, 141 112, 141 116 C 141 120, 137 122, 135 122 C 133 122, 129 120, 129 116 C 129 112, 135 106, 135 106 Z" fill="#00D2FF" opacity="0.8"/>

  <!-- Ominous Floating Warning Exclamation / Accent Marks -->
  <g transform="translate(0, -5)">
    <!-- High Contrast Warning Triangles / Spark -->
    <path d="M 120 55 L 128 72 L 112 72 Z" fill="#FFB703"/>
    <circle cx="120" cy="80" r="2.5" fill="#FFB703"/>
  </g>

  <!-- Dramatic Glowing Vignette / Alert Frame Effect -->
  <rect x="16" y="16" width="208" height="208" rx="18" fill="none" stroke="#FF5400" stroke-width="2" opacity="0.4"/>
</svg>