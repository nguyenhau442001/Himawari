<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="30" r="15" fill="#fbbf24"/>
    <path d="M15 60 L25 110 M45 60 L35 110" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 60 L45 60" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 110 L20 140 M40 110 L40 140" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Box -->
  <g transform="translate(120, 110)">
    <rect x="0" y="0" width="70" height="70" rx="4" fill="#fb923c"/>
    <path d="M0 20 L70 20 M35 0 L35 70" stroke="#1e293b" stroke-width="3" opacity="0.3"/>
    <rect x="10" y="10" width="50" height="50" rx="2" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Scale Platform -->
  <rect x="110" y="180" width="90" height="10" rx="2" fill="#38bdf8"/>
  
  <!-- Floating Indicator -->
  <g transform="translate(130, 70)">
    <rect x="0" y="0" width="50" height="25" rx="4" fill="#10b981"/>
    <circle cx="12" cy="12" r="4" fill="#f8fafc"/>
    <circle cx="25" cy="12" r="4" fill="#f8fafc"/>
    <circle cx="38" cy="12" r="4" fill="#f8fafc"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#ec4899"/>
  <circle cx="30" cy="30" r="2" fill="#38bdf8"/>
</svg>