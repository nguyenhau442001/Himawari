<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Visualizing "迎面" (yíngmiàn) - Head-on/Direct encounter -->
  <!-- Using a progression/causality metaphor: A path leading to a direct impact point -->
  
  <!-- The Path/Progression -->
  <path d="M40 180 L200 180" stroke="#374151" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- The "Head-on" Force/Wind Metaphor -->
  <!-- Representing the "breeze" or "force" coming directly toward the viewer/subject -->
  <g transform="translate(120, 120)">
    <!-- Central focus point -->
    <circle cx="0" cy="0" r="12" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Kinetic lines showing direct approach (Progression/Causality) -->
    <path d="M-60 -40 L-20 0 L-60 40" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-80 -20 L-40 0 L-80 20" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
    
    <!-- The "Head-on" impact lines -->
    <line x1="20" y1="-30" x2="60" y2="0" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="60" y2="0" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="-15" x2="80" y2="0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="15" x2="80" y2="0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Ground plane for perspective -->
  <path d="M20 200 L220 200" stroke="#4B5563" stroke-width="2"/>
</svg>