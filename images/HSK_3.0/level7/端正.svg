<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light Cone -->
    <linearGradient id="lightCone" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Room Interior / Background Details -->
  <!-- Wallpaper Grid / Accent Line -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#334155" stroke-width="2"/>
  
  <!-- Bookshelf Background -->
  <rect x="25" y="40" width="45" height="100" rx="4" fill="#1b263b" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="70" x2="70" y2="70" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="105" x2="70" y2="105" stroke="#334155" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="30" y="52" width="8" height="18" rx="1" fill="#38bdf8"/>
  <rect x="40" y="48" width="10" height="22" rx="1" fill="#fb923c"/>
  <rect x="53" y="55" width="12" height="15" rx="1" fill="#10b981"/>
  
  <rect x="30" y="85" width="14" height="20" rx="1" fill="#ec4899"/>
  <rect x="47" y="88" width="8" height="17" rx="1" fill="#fbbf24"/>

  <!-- Window with Night City Silhouette -->
  <rect x="165" y="30" width="50" height="85" rx="6" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="30" x2="190" y2="115" stroke="#475569" stroke-width="1.5"/>
  <line x1="165" y1="72" x2="215" y2="72" stroke="#475569" stroke-width="1.5"/>
  <!-- Tiny City Lights -->
  <rect x="172" y="50" width="4" height="6" fill="#fbbf24" opacity="0.6"/>
  <rect x="180" y="90" width="5" height="8" fill="#38bdf8" opacity="0.5"/>
  <rect x="200" y="60" width="4" height="12" fill="#fbbf24" opacity="0.4"/>
  <rect x="198" y="95" width="6" height="10" fill="#ec4899" opacity="0.5"/>

  <!-- Desk Lamp -->
  <path d="M 175 145 L 185 105 L 195 145 Z" fill="#64748b"/>
  <path d="M 160 120 Q 185 90 205 130" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="163" cy="122" r="6" fill="#cbd5e1"/>
  <!-- Light Beam projecting down to desk -->
  <polygon points="157,125 40,200 210,200" fill="url(#lightCone)" style="mix-blend-mode: screen;"/>

  <!-- Wall Clock showing upright order -->
  <circle cx="115" cy="45" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <line x1="115" y1="45" x2="115" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="45" x2="122" y2="48" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="115" cy="45" r="1.5" fill="#fbbf24"/>

  <!-- Plant on Desk Corner -->
  <path d="M 195 140 Q 200 130 205 140 Z" fill="#10b981"/>
  <path d="M 200 140 Q 208 125 215 135" fill="#34d399"/>
  <rect x="190" y="140" width="20" height="18" rx="4" fill="#cbd5e1"/>

  <!-- Desk Surface -->
  <path d="M 10 155 L 230 155 L 240 215 L 0 215 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="15" y="165" width="35" height="25" rx="3" fill="#ffffff" opacity="0.9"/> <!-- Notebook -->
  <line x1="22" y1="173" x2="43" y2="173" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="22" y1="180" x2="40" y2="180" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="22" y1="187" x2="37" y2="187" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="42" cy="170" r="3" fill="#ef4444"/> <!-- Pen -->

  <!-- CHAIR & CHARACTER (Showing 端正 - Upright, Straight, Correct Posture) -->
  <!-- Chair Backrest -->
  <rect x="90" y="85" width="40" height="75" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="98" y="95" width="24" height="55" rx="4" fill="#1e293b"/>
  <!-- Chair Seat -->
  <rect x="80" y="152" width="60" height="12" rx="4" fill="#475569"/>

  <!-- Character Legs (seated firmly) -->
  <!-- Left Leg -->
  <path d="M 95 160 L 95 195 L 115 195" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Leg -->
  <path d="M 125 160 L 125 195 L 145 195" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="115" cy="198" rx="8" ry="4" fill="#0f172a"/>
  <ellipse cx="145" cy="198" rx="8" ry="4" fill="#0f172a"/>

  <!-- Character Torso (Upright / Straight Posture - 端正) -->
  <!-- Spine aligned perfectly straight vertically -->
  <rect x="96" y="105" width="28" height="55" rx="8" fill="#38bdf8"/>
  <!-- Collar / Neck -->
  <path d="M 105 105 L 110 98 L 115 105 Z" fill="#fbcfe8"/>

  <!-- Arms resting neatly on desk -->
  <!-- Left Arm -->
  <path d="M 96 115 L 75 140 L 45 148" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm -->
  <path d="M 124 115 L 145 140 L 175 145" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands -->
  <circle cx="43" cy="150" r="5" fill="#fbcfe8"/>
  <circle cx="177" cy="146" r="5" fill="#fbcfe8"/>

  <!-- Head & Facial Expression (Focused, calm, erect) -->
  <circle cx="110" cy="85" r="16" fill="#fbcfe8"/>
  <!-- Hair (neat style) -->
  <path d="M 94 85 Q 94 68 110 68 Q 126 68 126 85 Q 120 74 110 74 Q 100 74 94 85 Z" fill="#1e293b"/>
  <!-- Face Details -->
  <!-- Focused eyes looking forward -->
  <circle cx="104" cy="85" r="2" fill="#0f172a"/>
  <circle cx="116" cy="85" r="2" fill="#0f172a"/>
  <!-- Gentle confident smile -->
  <path d="M 108 91 Q 110 93 112 91" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="102" cy="89" r="3" fill="#f43f5e" opacity="0.3"/>
  <circle cx="118" cy="89" r="3" fill="#f43f5e" opacity="0.3"/>

  <!-- Posture Alignment Guide Marker (Subtle artistic framing accent, no text) -->
  <!-- Perfectly vertical dashed reference line emphasizing the 'Straight/Upright' meaning -->
  <line x1="110" y1="60" x2="110" y2="200" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.25"/>

</svg>