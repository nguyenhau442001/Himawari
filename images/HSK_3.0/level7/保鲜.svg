<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for freshness -->
  <circle cx="120" cy="120" r="75" fill="#22303c" opacity="0.6"/>
  
  <!-- Refrigerator Crisper Drawer / Container base -->
  <path d="M 68,140 L 80,185 L 160,185 L 172,140 Z" fill="#2d3748" stroke="#4a5568" stroke-width="2" stroke-linejoin="round"/>
  <!-- Crisper handle -->
  <rect x="105" y="160" width="30" height="6" rx="3" fill="#718096"/>

  <!-- Fresh Fruits inside the container -->
  <!-- Crisp Green Apple -->
  <circle cx="100" cy="135" r="22" fill="#48bb78"/>
  <path d="M 100,113 Q 103,107 108,111" fill="none" stroke="#276749" stroke-width="3" stroke-linecap="round"/>
  <path d="M 105,110 Q 112,108 111,114 Z" fill="#38a169"/>
  <!-- Juicy Orange / Citrus -->
  <circle cx="145" cy="140" r="24" fill="#ed8936"/>
  <circle cx="145" cy="140" r="18" fill="#dd6b20" opacity="0.4"/>
  <circle cx="145" cy="140" r="3" fill="#c05621"/>

  <!-- Transparent Plastic Wrap (保鲜膜) covering the top with glossy highlights -->
  <path d="M 55,120 Q 120,105 185,120 L 172,140 Q 120,125 68,140 Z" fill="#e2e8f0" opacity="0.25"/>
  <!-- Glossy Sheen Lines on Wrap -->
  <path d="M 85,123 Q 120,115 155,123" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 95,130 Q 120,123 145,130" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Freshness / Cool air sparkles -->
  <path d="M 75,85 L 77,93 L 85,95 L 77,97 L 75,105 L 73,97 L 65,95 L 73,93 Z" fill="#63b3ed" opacity="0.9"/>
  <path d="M 170,95 L 171,99 L 175,100 L 171,101 L 170,105 L 169,101 L 165,100 L 169,99 Z" fill="#63b3ed" opacity="0.8"/>
  <path d="M 125,75 L 126,79 L 130,80 L 126,81 L 125,85 L 124,81 L 120,80 L 124,79 Z" fill="#63b3ed" opacity="0.7"/>

  <!-- Crisp Vapor / Cooling Waves -->
  <path d="M 90,65 Q 105,60 120,68 T 150,68" fill="none" stroke="#63b3ed" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 75,75 Q 90,70 105,78 T 135,78" fill="none" stroke="#63b3ed" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Focus / Accent Ring -->
  <circle cx="120" cy="130" r="68" fill="none" stroke="#ed8936" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8"/>
</svg>