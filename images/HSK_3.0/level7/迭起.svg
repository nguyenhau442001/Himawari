<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "迭起" (Successive surges / cascading peaks of performance/climax) -->
  <!-- Contextual reference: Acrobatic/magic evening gala climaxes surging continuously, drawing inspiration from ascending wave/peak structures -->
  
  <!-- Background subtle atmosphere lines representing stages/waves -->
  <path d="M40 180 C 80 140, 120 180, 160 140 C 180 120, 210 130, 220 120" stroke="#2A303C" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M20 200 C 70 160, 110 200, 170 150 C 190 130, 215 140, 230 135" stroke="#2A303C" stroke-width="2" fill="none"/>

  <!-- Cascading Peaks / Surging Waves (Representing multiple consecutive climaxes rising one after another) -->
  <!-- Peak 1 (First surge, receding slightly) -->
  <path d="M40 170 L80 110 L120 170 Z" fill="#252D3D"/>
  
  <!-- Peak 2 (Second higher surge) -->
  <path d="M80 150 L130 75 L180 150 Z" fill="#2E384D"/>

  <!-- Peak 3 (Main towering climax surge - Golden/Orange accent for high focus) -->
  <path d="M120 130 L175 45 L230 130 Z" fill="#1E2533"/>
  <path d="M120 130 L175 45 L175 130 Z" fill="#FF9F43" opacity="0.15"/>
  <polygon points="175,45 175,130 230,130" fill="#FF9F43" opacity="0.08"/>

  <!-- Dynamic rising magic/acrobatic energy elements (Sparkles & ascending rhythmic bursts) -->
  <!-- Burst 1 -->
  <circle cx="80" cy="110" r="3" fill="#FF9F43"/>
  <path d="M80 102 L80 94 M80 118 L80 126 M72 110 L64 110 M88 110 L96 110" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>

  <!-- Burst 2 -->
  <circle cx="130" cy="75" r="4" fill="#FF9F43"/>
  <path d="M130 65 L130 55 M130 85 L130 95 M120 75 L110 75 M140 75 L150 75" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>

  <!-- Primary Climax Burst (Top peak) -->
  <circle cx="175" cy="45" r="5" fill="#FF9F43"/>
  <path d="M175 33 L175 21 M175 57 L175 69 M163 45 L151 45 M187 45 L199 45" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M166 36 L158 28 M184 36 L192 28 M166 54 L158 62 M184 54 L192 62" stroke="#FF9F43" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stage Platform (Grounded foundation for the performance) -->
  <rect x="25" y="170" width="190" height="8" rx="4" fill="#3A4454"/>
  <rect x="35" y="182" width="170" height="4" rx="2" fill="#2A3342"/>
  
  <!-- Continuous rising rhythmic indicator arrows (subtle, integrated) -->
  <path d="M50 150 L60 135 L70 150" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  <path d="M95 130 L105 110 L115 130" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <path d="M140 100 L152 75 L164 100" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>