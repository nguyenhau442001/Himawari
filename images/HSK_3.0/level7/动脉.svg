<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="arteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light/Glow from Monitors -->
  <circle cx="120" cy="110" r="80" fill="#0ea5e9" opacity="0.08" filter="url(#glow)"/>
  <circle cx="170" cy="140" r="40" fill="#ef4444" opacity="0.1" filter="url(#glow)"/>

  <!-- Background Environment: Medical Office / Cardiology Lab -->
  <!-- Desk/Counter -->
  <rect x="20" y="170" width="200" height="40" rx="6" fill="#334155"/>
  <rect x="15" y="165" width="210" height="8" rx="3" fill="#475569"/>
  <!-- Medical Equipment / Desk Props -->
  <rect x="25" y="145" width="18" height="25" rx="3" fill="#64748b"/>
  <path d="M 28 150 L 40 150 M 28 155 L 38 155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Microscope / Diagnostic Prop -->
  <path d="M 205 130 L 215 130 L 215 165 L 205 165 Z" fill="#64748b"/>
  <path d="M 195 155 L 215 155" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="205" cy="140" r="6" fill="#cbd5e1"/>

  <!-- Main Diagnostic Monitor -->
  <!-- Stand -->
  <rect x="105" y="145" width="30" height="25" fill="#475569" rx="2"/>
  <path d="M 90 170 L 150 170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Screen Frame -->
  <rect x="65" y="60" width="110" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <!-- Inner Screen -->
  <rect x="71" y="66" width="98" height="73" rx="4" fill="url(#screenGrad)"/>

  <!-- UI Graphics on Screen: Artery Visualization -->
  <!-- Heart and Artery Diagram -->
  <path d="M 105 100 C 105 90, 115 85, 120 92 C 125 85, 135 90, 135 100 C 135 112, 120 120, 120 125 C 120 120, 105 112, 105 100 Z" fill="#ef4444" opacity="0.9"/>
  <!-- Main Aorta/Artery (动脉) -->
  <path d="M 120 92 C 120 80, 132 75, 135 70" fill="none" stroke="url(#arteryGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 135 70 L 142 65" fill="none" stroke="url(#arteryGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 135 70 L 128 65" fill="none" stroke="url(#arteryGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Vital Signs / Pulse Graph Overlay -->
  <path d="M 76 125 L 90 125 L 95 110 L 100 135 L 106 120 L 110 125 L 158 125" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Attention / Importance Indicator (Glow Ring & Sparkles matching "很重要") -->
  <circle cx="135" cy="70" r="10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 135 70" to="360 135 70" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- Sparkle accents for importance -->
  <path d="M 148 60 L 150 65 L 155 67 L 150 69 L 148 74 L 146 69 L 141 67 L 146 65 Z" fill="#fbbf24"/>
  <path d="M 90 75 L 91 78 L 94 79 L 91 80 L 90 83 L 89 80 L 86 79 L 89 78 Z" fill="#fbbf24"/>

  <!-- Character: Doctor / Medical Professional Pointing at the Artery -->
  <!-- Body / Coat -->
  <path d="M 30 185 L 50 130 L 75 130 L 95 185 Z" fill="#f8fafc"/>
  <!-- Inner Shirt / Tie -->
  <path d="M 58 130 L 67 150 L 76 130 Z" fill="#0ea5e9"/>
  <path d="M 67 148 L 65 170 L 69 170 Z" fill="#dc2626"/>
  <!-- Lab Coat Collar -->
  <path d="M 50 130 L 58 150 L 50 160" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 75 130 L 67 150 L 75 160" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Character Head & Hair -->
  <circle cx="63" cy="108" r="16" fill="#fbcfe8"/> <!-- Face skin tone -->
  <!-- Hair (Dark, neat professional style) -->
  <path d="M 48 108 C 48 95, 55 90, 65 90 C 75 90, 80 98, 79 110 C 74 105, 52 105, 48 108 Z" fill="#334155"/>
  <!-- Friendly Professional Expression -->
  <circle cx="58" cy="107" r="1.5" fill="#1e293b"/>
  <circle cx="68" cy="107" r="1.5" fill="#1e293b"/>
  <!-- Smiling mouth -->
  <path d="M 61 115 Q 63 118 66 115" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Stethoscope around neck -->
  <path d="M 55 120 C 58 135, 75 135, 78 120" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="55" cy="120" r="3" fill="#94a3b8"/>
  <circle cx="78" cy="120" r="3" fill="#94a3b8"/>

  <!-- Doctor's Arm & Hand Pointing directly at the Screen / Artery -->
  <path d="M 75 140 C 90 135, 105 130, 118 120" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand / Pointing Finger -->
  <circle cx="121" cy="118" r="5" fill="#fbcfe8"/>
  <path d="M 124 116 L 132 113 L 126 119 Z" fill="#fbcfe8"/>

  <!-- Foreground details: Table edge reflection/highlight -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" opacity="0.3"/>
</svg>