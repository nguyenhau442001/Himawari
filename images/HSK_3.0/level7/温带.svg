<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Globe Base -->
  <circle cx="120" cy="120" r="75" fill="#2A2E37" />
  
  <!-- Simplified Continents -->
  <path d="M 85 75 Q 95 65 110 70 T 130 85 T 115 110 T 90 100 Z" fill="#3F4756" />
  <path d="M 140 100 Q 160 90 175 110 T 160 140 T 130 130 Z" fill="#3F4756" />
  <path d="M 90 135 Q 105 130 115 150 T 100 175 T 80 160 Z" fill="#3F4756" />
  
  <!-- Equator (Subtle Reference) -->
  <line x1="45" y1="120" x2="195" y2="120" stroke="#4A5568" stroke-width="1" stroke-dasharray="4 2" />
  
  <!-- North Temperate Zone Highlight -->
  <path d="M 52 98 Q 120 78 188 98" fill="none" stroke="#FFD700" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  
  <!-- South Temperate Zone Highlight -->
  <path d="M 52 142 Q 120 162 188 142" fill="none" stroke="#FFD700" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  
  <!-- Climate Indicators (Visualizing the "Temperate" balance) -->
  <!-- Sun (Warmth) -->
  <circle cx="120" cy="120" r="8" fill="#FFD700" opacity="0.2" />
  
  <!-- Leaf (Spring/Autumn - Temperate characteristic) -->
  <path d="M 205 90 Q 215 90 215 100 Q 205 110 195 100 Q 195 90 205 90 Z" fill="#FFD700" />
  <line x1="205" y1="100" x2="205" y2="108" stroke="#FFD700" stroke-width="1.5" />
  
  <!-- Snowflake (Winter - Temperate characteristic) -->
  <g transform="translate(30, 95) scale(0.6)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#FFD700" stroke-width="2" />
    <line x1="-8.6" y1="-5" x2="8.6" y2="5" stroke="#FFD700" stroke-width="2" />
    <line x1="-8.6" y1="5" x2="8.6" y2="-5" stroke="#FFD700" stroke-width="2" />
  </g>
  
  <!-- Decorative Orbit/Atmosphere -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.3" />
</svg>