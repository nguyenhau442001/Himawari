<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Glow for Real Estate Context -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>
  <path d="M70 140 L120 100 L170 140" stroke="#2D3446" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- House Document / Contract Base -->
  <g transform="translate(65, 55)">
    <!-- Document background -->
    <rect x="0" y="0" width="110" height="135" rx="8" fill="#283042" stroke="#3A445D" stroke-width="2"/>
    
    <!-- House icon at top of document -->
    <path d="M55 20 L30 40 V65 H80 V40 Z" fill="#3B82F6" opacity="0.2"/>
    <path d="M55 14 L25 38 H33 V60 H77 V38 H85 Z" fill="#3B82F6"/>
    <rect x="47" y="42" width="16" height="18" fill="#283042"/>

    <!-- Document text lines -->
    <rect x="20" y="76" width="70" height="6" rx="3" fill="#475569"/>
    <rect x="20" y="92" width="50" height="6" rx="3" fill="#475569"/>
    <rect x="20" y="108" width="60" height="6" rx="3" fill="#475569"/>
  </g>

  <!-- Golden Security Deposit / "Dingjin" Stack & Coin (Focal Point) -->
  <g transform="translate(120, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="35" rx="36" ry="12" fill="#0D0F13" opacity="0.6"/>

    <!-- Bottom Stack Layer -->
    <path d="M-30 20 C-30 28, 30 28, 30 20 V30 C30 38, -30 38, -30 30 Z" fill="#D97706"/>
    <path d="M-30 10 C-30 18, 30 18, 30 10 V20 C30 28, -30 28, -30 20 Z" fill="#F59E0B"/>

    <!-- Main Gold Coin Body -->
    <ellipse cx="0" cy="0" rx="34" ry="16" fill="#FBBF24"/>
    <ellipse cx="0" cy="0" rx="27" ry="12" fill="#F59E0B"/>
    
    <!-- Inner Coin Rim -->
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="#FBBF24" stroke-width="1.5"/>

    <!-- Lock/Keyhole Symbol representing 'Binding Contract / Deposit' -->
    <path d="M-3 -2 A 4 4 0 1 1 3 -2 V 1 C 3 3, 5 4, 5 4 H -5 C -5 4, -3 3, -3 1 Z" fill="#D97706"/>
    <circle cx="0" cy="-2" r="1.5" fill="#FEF3C7"/>
    <rect x="-0.8" y="1" width="1.6" height="3" fill="#FEF3C7"/>

    <!-- Sparkle Accents for High-Value Focus -->
    <path d="M32 -18 L34 -25 L36 -18 L43 -16 L36 -14 L34 -7 L32 -14 L25 -16 Z" fill="#FDE047"/>
    <path d="M-36 6 L-35 1 L-34 6 L-39 7 L-34 8 L-35 13 L-36 8 L-41 7 Z" fill="#FDE047" transform="scale(0.7) translate(-20, -10)"/>
  </g>

  <!-- Premium Accent Ring -->
  <circle cx="120" cy="120" r="106" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
</svg>