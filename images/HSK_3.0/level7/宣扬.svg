<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character representing the subject -->
  <g transform="translate(60, 120)">
    <circle cx="30" cy="-30" r="15" fill="#FFB84D"/>
    <path d="M15 -15 L45 -15 C45 -5, 15 -5, 15 -15 Z" fill="#FFB84D"/>
    <path d="M20 0 L40 0 L35 40 L25 40 Z" fill="#FFB84D"/>
    <path d="M5 10 L25 25 L20 50" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M45 10 L65 30 L60 55" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Megaphone representing the action of "spreading/broadcasting" -->
  <g transform="translate(120, 90) rotate(-20)">
    <path d="M0 0 L40 -20 L40 20 Z" fill="#FFB84D"/>
    <rect x="-15" y="-5" width="15" height="10" fill="#FFB84D"/>
    <path d="M45 -30 L55 -40 M45 0 L60 0 M45 30 L55 40" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Motion/Sound waves -->
  <g stroke="#FFB84D" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M180 60 C195 75, 195 105, 180 120"/>
    <path d="M195 45 C215 70, 215 110, 195 135"/>
    <path d="M210 30 C235 65, 235 115, 210 150"/>
  </g>

  <!-- Representing the "achievement" being spread -->
  <g transform="translate(140, 160)">
    <path d="M0 0 L20 -30 L40 0 L20 10 Z" fill="#FFB84D"/>
    <circle cx="20" cy="-10" r="5" fill="#1A1D24"/>
  </g>
</svg>