<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/accent elements for modern flat UI feel -->
  <path d="M40 180 L200 180" stroke="#2A2F3A" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Conceptual Illustration for "压制" (Suppress / Hold down / Restrain) -->
  <!-- We show a dynamic human action applying downward force, representing suppression/restraint. -->
  
  <g transform="translate(0, 10)">
    <!-- Floor/Base platform -->
    <rect x="60" y="150" width="120" height="6" rx="3" fill="#3A4252" />
    
    <!-- The compressed/restrained element (symbolizing speech bubble or free expression being pressed down) -->
    <g transform="translate(120, 135)">
      <!-- Motion compression indicator lines -->
      <path d="M-30 -25 L-20 -15" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M30 -25 L20 -15" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Compressed speech bubble / concept object -->
      <ellipse cx="0" cy="0" rx="32" ry="16" fill="#2C3545" stroke="#E67E22" stroke-width="2.5"/>
      <path d="M-8 16 L0 26 L8 16 Z" fill="#2C3545" stroke="#E67E22" stroke-width="2.5" stroke-linejoin="round"/>
      
      <!-- Inner lines representing squeezed content -->
      <line x1="-16" y1="-3" x2="16" y2="-3" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="5" x2="10" y2="5" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Character applying downward pressure (Upper body, authoritative/suppressive posture) -->
    <!-- Torso and Shoulders -->
    <path d="M85 130 C85 105 155 105 155 130 Z" fill="#3B82F6" />
    
    <!-- Head -->
    <circle cx="120" cy="80" r="15" fill="#E5E7EB" />
    <!-- Hair / Hat (Authoritarian sleek flat shape) -->
    <path d="M105 78 C105 68 135 68 135 78 Z" fill="#1F2937" />

    <!-- Arms pushing down with force -->
    <!-- Left Arm -->
    <path d="M95 115 L65 135" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" />
    <!-- Left Hand pressing down -->
    <circle cx="58" cy="138" r="6" fill="#E5E7EB" />

    <!-- Right Arm -->
    <path d="M145 115 L175 135" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" />
    <!-- Right Hand pressing down -->
    <circle cx="182" cy="138" r="6" fill="#E5E7EB" />

    <!-- Dynamic downward force arrows (Action motion lines) -->
    <g stroke="#E67E22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M120 40 L120 65" />
      <path d="M112 55 L120 65 L128 55" />
      
      <path d="M75 80 L65 95" />
      <path d="M66 89 L65 95 L72 96" />

      <path d="M165 80 L175 95" />
      <path d="M168 96 L175 95 L174 89" />
    </g>
  </g>
</svg>