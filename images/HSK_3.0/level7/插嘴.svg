<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (conversation atmosphere) -->
  <g opacity="0.15">
    <path d="M40 70 L90 70 C95 70 100 75 100 80 L100 95 C100 100 95 105 90 105 L70 105 L50 120 L55 105 L40 105 C35 105 30 100 30 95 L30 80 C30 75 35 70 40 70 Z" fill="#64748B"/>
    <path d="M150 90 L200 90 C205 90 210 95 210 100 L210 115 C210 120 205 125 200 125 L180 125 L160 140 L165 125 L150 125 C145 125 140 120 140 115 L140 100 C140 95 145 90 150 90 Z" fill="#64748B"/>
  </g>

  <!-- Person A (Senior/Speaker 1 - Calm, talking) -->
  <g transform="translate(10, 0)">
    <!-- Body/Shoulders -->
    <path d="M50 190 C50 165 70 145 95 145 C120 145 140 165 140 190 Z" fill="#334155"/>
    <!-- Head/Face profile looking right -->
    <circle cx="95" cy="115" r="22" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M75 110 C75 95 85 93 95 93 C105 93 115 95 115 110 C115 115 113 110 113 105 C113 98 105 96 95 96 C85 96 77 98 77 105 C77 110 75 115 75 110 Z" fill="#64748B"/>
    <!-- Calm expression / speech wave -->
    <path d="M113 118 Q 119 116 122 114" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Speech bubble coming from Speaker 1 -->
    <path d="M125 95 L160 95 C165 95 170 100 170 105 L170 115 C170 120 165 125 160 125 L145 125 L135 135 L138 125 L125 125 C120 125 115 120 115 115 L115 105 C115 100 120 95 125 95 Z" fill="#38BDF8" opacity="0.3"/>
  </g>

  <!-- Person B (Interrupter - Dynamic, rushing in to interrupt) -->
  <g transform="translate(0, 0)">
    <!-- Body leaning forward -->
    <path d="M110 200 C110 170 130 150 155 145 C180 140 205 160 215 190 Z" fill="#0F766E"/>
    <!-- Head -->
    <circle cx="165" cy="115" r="22" fill="#F1F5F9"/>
    <!-- Hair -->
    <path d="M145 110 C145 95 155 92 168 92 C182 92 188 98 188 112 C188 112 180 105 168 105 C155 105 147 110 145 110 Z" fill="#0D9488"/>
    
    <!-- Action Arm / Hand cutting through (Motion lines & direct gesture) -->
    <!-- Arm extending sharply forward to block/interrupt -->
    <path d="M150 145 L135 125 L120 130" stroke="#0F766E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Hand gesturing closely near mouth level -->
    <circle cx="120" cy="130" r="7" fill="#F1F5F9"/>

    <!-- Motion lines showing sudden intrusion -->
    <path d="M100 125 L115 123" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M105 133 L118 130" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M103 141 L114 137" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Interrupter's aggressive/sudden speech element (Orange accent for focus) -->
    <path d="M140 85 L180 85 C186 85 190 89 190 95 L190 105 C190 111 186 115 180 115 L170 115 L165 125 L160 115 L140 115 C134 115 130 111 130 105 L130 95 C130 89 134 85 140 85 Z" fill="#F59E0B"/>
    <path d="M148 100 L172 100" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M155 93 L165 107" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Focus/Alert Accent Graphic: Warning slash across the interruption point -->
  <g transform="translate(115, 105)">
    <circle cx="10" cy="10" r="16" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="75 25"/>
    <line x1="2" y1="2" x2="18" y2="18" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>