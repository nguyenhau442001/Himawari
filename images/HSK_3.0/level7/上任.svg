<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Elements -->
  <circle cx="120" cy="120" r="80" fill="#222834" opacity="0.6"/>
  
  <!-- Office Desk/Podium representing "Nhiệm sở" (Office/Post) -->
  <path d="M70 180 L170 180 L160 150 L80 150 Z" fill="#2D3748"/>
  <rect x="95" y="140" width="50" height="12" rx="3" fill="#4A5568"/>
  <path d="M105 140 L135 140 L140 125 L100 125 Z" fill="#718096"/>
  
  <!-- Motion lines / upward action representing "Lên" (Up/Ascend) -->
  <g stroke="#F6AD55" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M75 100 L75 80" />
    <path d="M165 100 L165 80" />
    <path d="M120 85 L120 60" />
    <polyline points="112,68 120,58 128,68" fill="none"/>
  </g>
  
  <!-- Dynamic Human Character taking office (Verb/Action) -->
  <!-- Body/Suit -->
  <path d="M105 140 C105 125 135 125 135 140 L145 180 L95 180 Z" fill="#3182CE"/>
  <!-- Shirt & Tie -->
  <polygon points="120,128 115,145 125,145" fill="#EDF2F7"/>
  <polygon points="120,135 118,160 120,165 122,160" fill="#E53E3E"/>
  
  <!-- Head & Hair -->
  <circle cx="120" cy="105" r="15" fill="#FBD38D"/>
  <path d="M105 100 C105 90 135 90 135 100 Z" fill="#2D3748"/>
  
  <!-- Arms in action (taking position / stepping up) -->
  <!-- Left arm reaching forward/down to the desk -->
  <path d="M105 130 L85 145" stroke="#3182CE" stroke-width="8" stroke-linecap="round"/>
  <circle cx="83" cy="147" r="5" fill="#FBD38D"/>
  
  <!-- Right arm raised confidently -->
  <path d="M135 130 L155 110" stroke="#3182CE" stroke-width="8" stroke-linecap="round"/>
  <circle cx="157" cy="108" r="5" fill="#FBD38D"/>
  
  <!-- Accent Badge / Official Authority Symbol floating above -->
  <circle cx="120" cy="40" r="14" fill="#D69E2E"/>
  <polygon points="120,31 123,38 130,39 125,44 127,51 120,47 113,51 115,44 110,39 117,38" fill="#FFFFFF"/>
</svg>