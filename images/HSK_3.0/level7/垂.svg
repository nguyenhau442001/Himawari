<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Elements: Night Lake & Horizon -->
  <path d="M 0 160 Q 60 155, 120 160 T 240 160 L 240 240 L 0 240 Z" fill="#152238"/>
  <path d="M 0 160 Q 60 155, 120 160 T 240 160" fill="none" stroke="#23395B" stroke-width="2"/>
  <path d="M 40 180 Q 140 175, 200 185" fill="none" stroke="#2D4A77" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 60 205 Q 120 200, 180 208" fill="none" stroke="#2D4A77" stroke-width="1" opacity="0.4"/>

  <!-- Distant Background Tree Trunk/Branch (Right side base) -->
  <path d="M 180 60 Q 185 100, 175 160" fill="none" stroke="#2F3E46" stroke-width="12" stroke-linecap="round"/>

  <!-- Hanging Willow Branches (垂 - Chuí / Drooping downwards) -->
  <!-- Main cascading branch 1 (Center-Left) -->
  <path d="M 90 40 Q 70 80, 85 120 T 75 170" fill="none" stroke="#4E8752" stroke-width="3" stroke-linecap="round"/>
  <!-- Main cascading branch 2 (Center-Right) -->
  <path d="M 150 50 Q 170 90, 155 130 T 165 165" fill="none" stroke="#588C60" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Main cascading branch 3 (Foreground Right) -->
  <path d="M 175 60 Q 195 100, 180 145 T 190 175" fill="none" stroke="#68A571" stroke-width="4" stroke-linecap="round"/>

  <!-- Willow Leaves (Drooping delicately) -->
  <!-- Left branch leaves -->
  <path d="M 83 90 C 75 95, 72 100, 78 105 C 84 100, 86 95, 83 90" fill="#7AC182"/>
  <path d="M 86 115 C 78 120, 75 125, 81 130 C 87 125, 89 120, 86 115" fill="#68A571"/>
  <path d="M 78 140 C 70 145, 67 150, 73 155 C 79 150, 81 145, 78 140" fill="#88D491"/>
  
  <!-- Right branch leaves -->
  <path d="M 160 100 C 168 105, 171 110, 165 115 C 159 110, 157 105, 160 100" fill="#88D491"/>
  <path d="M 157 125 C 165 130, 168 135, 162 140 C 156 135, 154 130, 157 125" fill="#7AC182"/>
  <path d="M 163 150 C 171 155, 174 160, 168 165 C 162 160, 160 155, 163 150" fill="#588C60"/>

  <!-- Foreground branch leaves -->
  <path d="M 183 115 C 193 118, 197 124, 190 130 C 183 124, 179 118, 183 115" fill="#A2E3AC"/>
  <path d="M 181 140 C 191 143, 195 149, 188 155 C 181 149, 177 143, 181 140" fill="#88D491"/>
  <path d="M 186 165 C 196 168, 200 174, 193 180 C 186 174, 182 168, 186 165" fill="#7AC182"/>

  <!-- Water Surface Ripples where branches touch/droop -->
  <ellipse cx="75" cy="170" rx="6" ry="2" fill="none" stroke="#68A571" stroke-width="1" opacity="0.7"/>
  <ellipse cx="165" cy="165" rx="8" ry="2.5" fill="none" stroke="#7AC182" stroke-width="1" opacity="0.7"/>
  <ellipse cx="190" cy="175" rx="10" ry="3" fill="none" stroke="#88D491" stroke-width="1.2" opacity="0.8"/>

  <!-- Focus / Accent Glow (Golden light catching the drooping tips, emphasizing '垂') -->
  <circle cx="190" cy="175" r="16" fill="#F4D06F" opacity="0.15"/>
  <circle cx="190" cy="175" r="4" fill="#F4D06F" opacity="0.8"/>
  <circle cx="75" cy="170" r="3" fill="#F4D06F" opacity="0.6"/>
  <circle cx="165" cy="165" r="3" fill="#F4D06F" opacity="0.6"/>

  <!-- Directional Indicator: Subtle downward glowing arrow hinting at 'chuí' (drooping down) -->
  <path d="M 120 85 L 120 125" fill="none" stroke="#F4D06F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 115 120 L 120 127 L 125 120" fill="none" stroke="#F4D06F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

</svg>