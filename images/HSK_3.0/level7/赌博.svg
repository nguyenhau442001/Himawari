<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Glowing Screen/Neon Gradient representing addiction/focus -->
    <radialGradient id="glowG" cx="50%=" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment (Room Details) -->
  <!-- Window with night city glow -->
  <path d="M170 30 L210 30 L210 90 L170 90 Z" fill="#334155" opacity="0.4" rx="4"/>
  <path d="M175 35 L205 35 L205 85 L175 85 Z" fill="#0f172a"/>
  <!-- City lights outside window -->
  <circle cx="185" cy="50" r="1.5" fill="#38bdf8" />
  <circle cx="195" cy="65" r="1.5" fill="#f43f5e" />
  <circle cx="188" cy="75" r="1" fill="#fbbf24" />

  <!-- Wall shelf and subtle props -->
  <rect x="25" y="45" width="60" height="4" rx="2" fill="#334155" />
  <circle cx="45" cy="40" r="5" fill="#64748b" />
  <rect x="65" y="36" width="10" height="9" rx="1" fill="#475569" />

  <!-- Ambient glow behind character (addiction focus) -->
  <circle cx="120" cy="130" r="70" fill="url(#glowG)" />

  <!-- Gambling Table -->
  <path d="M40 160 L200 160 L215 210 L25 210 Z" fill="url(#tableGrad)" filter="url(#shadow)" />
  <!-- Table Wood Rim / Edge -->
  <path d="M35 155 L205 155 L200 160 L40 160 Z" fill="#047857" />
  <!-- Table Felt Inner Line -->
  <path d="M55 170 L185 170 L195 200 L45 200 Z" fill="#064e3b" opacity="0.6" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Casino Props on Table -->
  <!-- Poker Chips Stack 1 -->
  <rect x="65" y="175" width="16" height="5" rx="2" fill="#ef4444" />
  <rect x="65" y="171" width="16" height="5" rx="2" fill="#ffffff" />
  <rect x="65" y="167" width="16" height="5" rx="2" fill="#3b82f6" />
  <!-- Poker Chips Stack 2 -->
  <rect x="85" y="180" width="16" height="5" rx="2" fill="#fbbf24" />
  <rect x="85" y="176" width="16" height="5" rx="2" fill="#ffffff" />

  <!-- Playing Cards Fanned Out -->
  <g transform="translate(130, 165) rotate(15)">
    <rect x="0" y="0" width="18" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="9" cy="13" r="4" fill="#ef4444" />
  </g>
  <g transform="translate(142, 163) rotate(-10)">
    <rect x="0" y="0" width="18" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="5" y="16" font-size="10" fill="#0f172a" font-weight="bold">♠</text>
  </g>

  <!-- Glowing/Floating Action Elements (Represents the "hook" / trance) -->
  <path d="M 120 100 Q 135 80 150 95 T 160 80" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 110 110 Q 95 90 80 105" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="155" cy="85" r="3" fill="#f59e0b" />
  <circle cx="78" cy="100" r="2" fill="#fbbf24" />

  <!-- Character: Obsessed / Intense Gambler -->
  <!-- Chair Back -->
  <path d="M95 100 L145 100 L150 200 L90 200 Z" fill="#1e293b" />
  <rect x="100" y="105" width="40" height="85" rx="6" fill="#334155" />

  <!-- Character Body / Hoodie -->
  <path d="M80 220 L85 155 Q 120 140 155 155 L160 220 Z" fill="#475569" filter="url(#shadow)" />
  <!-- Hoodie Pocket & Details -->
  <path d="M100 190 L140 190 L145 220 L95 220 Z" fill="#334155" />
  <path d="M105 155 L100 180 L140 180 L135 155 Z" fill="#334155" />
  <!-- Hoodie Strings -->
  <line x1="110" y1="155" x2="110" y2="175" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="155" x2="130" y2="175" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Character Neck -->
  <rect x="112" y="135" width="16" height="25" fill="#fca5a5" />

  <!-- Character Head -->
  <circle cx="120" cy="115" r="26" fill="#fca5a5" filter="url(#shadow)" />

  <!-- Messy Hair (Stressed/Late night look) -->
  <path d="M95 115 C95 90 145 90 145 115 C145 105 135 95 120 95 C105 95 95 105 95 115 Z" fill="#1e293b" />
  <path d="M110 96 L115 88 L122 95 L130 89 L138 97 Z" fill="#1e293b" />

  <!-- Intense/Hypnotized Eyes with golden reflection (addiction effect) -->
  <circle cx="110" cy="116" r="5" fill="#ffffff" />
  <circle cx="130" cy="116" r="5" fill="#ffffff" />
  <!-- Pupils dilated with amber glow -->
  <circle cx="111" cy="116" r="2.5" fill="#b45309" />
  <circle cx="131" cy="116" r="2.5" fill="#b45309" />
  <circle cx="112" cy="115" r="1" fill="#fef08a" />
  <circle cx="132" cy="115" r="1" fill="#fef08a" />

  <!-- Heavy dark circles under eyes (exhaustion/obsession) -->
  <path d="M104 122 Q 110 126 116 122" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M124 122 Q 130 126 136 122" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Intense Focused Eyebrows (tilted down angrily/fixatedly) -->
  <path d="M104 110 L116 113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M136 110 L124 113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Fixed, tense mouth -->
  <path d="M114 132 Q 120 129 126 132" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round" />

  <!-- Arms Reaching Out / Grasping Edge of Table -->
  <!-- Left Arm -->
  <path d="M85 160 L60 175 L70 185 L95 170 Z" fill="#475569" />
  <!-- Left Hand -->
  <circle cx="60" cy="180" r="7" fill="#fca5a5" />

  <!-- Right Arm -->
  <path d="M155 160 L180 175 L170 185 L145 170 Z" fill="#475569" />
  <!-- Right Hand -->
  <circle cx="180" cy="180" r="7" fill="#fca5a5" />

</svg>