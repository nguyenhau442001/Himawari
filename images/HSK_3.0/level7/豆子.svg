<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow/reflection for glass container -->
  <circle cx="120" cy="120" r="70" fill="#222831" opacity="0.5"/>

  <!-- Glass Bowl (representing soaking context "把豆子浸泡一晚") -->
  <!-- Bowl Back Rim -->
  <ellipse cx="120" cy="100" rx="72" ry="18" fill="none" stroke="#4A5568" stroke-width="3" opacity="0.4"/>
  
  <!-- Water Level / Liquid Surface -->
  <ellipse cx="120" cy="115" rx="66" ry="15" fill="#3B82F6" opacity="0.35"/>
  <ellipse cx="120" cy="115" rx="66" ry="15" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.6"/>

  <!-- Submerged Beans (豆子) -->
  <!-- Bean 1 (Center) -->
  <ellipse cx="105" cy="125" rx="14" ry="10" fill="#F59E0B" transform="rotate(-15 105 125)"/>
  <path d="M100 120 Q105 125 110 120" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" transform="rotate(-15 105 125)"/>

  <!-- Bean 2 (Right) -->
  <ellipse cx="140" cy="130" rx="13" ry="9" fill="#FBBF24" transform="rotate(25 140 130)"/>
  <path d="M135 126 Q140 130 145 125" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" transform="rotate(25 140 130)"/>

  <!-- Bean 3 (Left) -->
  <ellipse cx="85" cy="135" rx="12" ry="9" fill="#D97706" transform="rotate(-40 85 135)"/>
  <path d="M81 131 Q85 135 89 130" stroke="#92400E" stroke-width="1.5" fill="none" stroke-linecap="round" transform="rotate(-40 85 135)"/>

  <!-- Bean 4 (Foreground center-right) -->
  <ellipse cx="125" cy="142" rx="15" ry="10" fill="#F59E0B" transform="rotate(10 125 142)"/>
  <path d="M119 138 Q125 142 131 137" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" transform="rotate(10 125 142)"/>

  <!-- Bean 5 (Foreground left) -->
  <ellipse cx="100" cy="145" rx="13" ry="9" fill="#FBBF24" transform="rotate(-10 100 145)"/>
  <path d="M95 141 Q100 145 105 140" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" transform="rotate(-10 100 145)"/>

  <!-- Tiny bubbles indicating soaking/freshness -->
  <circle cx="115" cy="108" r="2" fill="#E2E8F0" opacity="0.8"/>
  <circle cx="135" cy="112" r="1.5" fill="#E2E8F0" opacity="0.6"/>
  <circle cx="95" cy="110" r="1" fill="#E2E8F0" opacity="0.7"/>

  <!-- Bowl Body / Front -->
  <path d="M 48 100 C 48 155, 60 172, 120 172 C 180 172, 192 155, 192 100" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Bowl Base -->
  <path d="M 90 172 L 150 172" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <!-- Glass Highlights on Bowl -->
  <path d="M 58 115 C 54 130, 58 150, 70 160" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 182 115 C 186 130, 182 150, 170 160" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>
</svg>