<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle atmosphere (artistic studio/room setting representing the creative life context) -->
  <g opacity="0.3">
    <!-- Easel outline in background -->
    <line x1="120" y1="50" x2="80" y2="190" stroke="#6272A4" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="50" x2="160" y2="190" stroke="#6272A4" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="120" x2="140" y2="120" stroke="#6272A4" stroke-width="2" stroke-linecap="round"/>
    <!-- Canvas frame -->
    <rect x="75" y="70" width="90" height="70" rx="2" fill="none" stroke="#6272A4" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Character representing "独身" (Single person, independent individual focused on art/freedom) -->
  <g transform="translate(0, 5)">
    <!-- Shadow beneath character -->
    <ellipse cx="120" cy="195" rx="35" ry="6" fill="#111318"/>

    <!-- Body / Torso (Relaxed, confident posture) -->
    <path d="M 95 150 C 95 130, 145 130, 145 150 L 155 190 C 155 193, 150 195, 145 195 L 95 195 C 90 195, 85 193, 85 190 Z" fill="#3B4252"/>
    
    <!-- Outfit collar/shirt accent -->
    <path d="M 105 150 L 120 165 L 135 150" fill="none" stroke="#E5C07B" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="112" y="125" width="16" height="30" rx="6" fill="#E5B584"/>

    <!-- Head -->
    <circle cx="120" cy="100" r="26" fill="#E5B584"/>

    <!-- Artistic/Stylish Hair (representing the free-spirited artist context) -->
    <path d="M 94 98 C 92 75, 110 70, 122 70 C 138 70, 148 85, 148 105 C 148 112, 145 115, 142 110 C 138 90, 120 82, 102 92 C 96 95, 94 98, 94 98 Z" fill="#4C566A"/>

    <!-- Calm, content facial expression -->
    <!-- Glasses (intellectual/artistic flair) -->
    <rect x="106" y="92" width="12" height="8" rx="2" fill="none" stroke="#E5C07B" stroke-width="1.5"/>
    <rect x="122" y="92" width="12" height="8" rx="2" fill="none" stroke="#E5C07B" stroke-width="1.5"/>
    <line x1="118" y1="95" x2="122" y2="95" stroke="#E5C07B" stroke-width="1.5"/>

    <!-- Smile / Face details -->
    <path d="M 116 112 C 118 114, 122 114, 124 112" fill="none" stroke="#8FBCBB" stroke-width="2" stroke-linecap="round"/>

    <!-- Single standalone figure emphasis: Left arm holding a paintbrush, right arm resting freely (symbolizing independence and freedom) -->
    <!-- Left arm (holding brush) -->
    <path d="M 95 140 C 80 145, 75 160, 80 170" fill="none" stroke="#3B4252" stroke-width="10" stroke-linecap="round"/>
    <circle cx="80" cy="172" r="5" fill="#E5B584"/>
    
    <!-- Paintbrush in hand -->
    <line x1="75" y1="185" x2="88" y2="160" stroke="#D08770" stroke-width="3" stroke-linecap="round"/>
    <path d="M 73 188 C 74 186, 76 184, 78 185 C 77 187, 75 189, 73 188 Z" fill="#88C0D0"/>

    <!-- Right arm (independent posture) -->
    <path d="M 145 140 C 160 145, 165 160, 160 175" fill="none" stroke="#3B4252" stroke-width="10" stroke-linecap="round"/>
    <circle cx="160" cy="177" r="5" fill="#E5B584"/>
  </g>

  <!-- Accent graphic: Solo star/sparkle representing uniqueness, autonomy, and individuality (No hearts, no text) -->
  <g transform="translate(185, 55)" fill="#E5C07B">
    <path d="M 0 10 C 5 10, 10 5, 10 0 C 10 5, 15 10, 20 10 C 15 10, 10 15, 10 20 C 10 15, 5 10, 0 10 Z"/>
  </g>
  <g transform="translate(45, 85) scale(0.6)" fill="#88C0D0">
    <path d="M 0 10 C 5 10, 10 5, 10 0 C 10 5, 15 10, 20 10 C 15 10, 10 15, 10 20 C 10 15, 5 10, 0 10 Z"/>
  </g>
</svg>