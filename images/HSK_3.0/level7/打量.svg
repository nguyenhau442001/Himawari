<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lighting Gradient (Tailor shop / fitting room ambiance) -->
    <radialGradient id="spotlight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="inspector-coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Filter for Focus -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT / CONTEXT PROPS -->
  <!-- Floor line and parquet pattern -->
  <path d="M0 195 L240 195" stroke="#334155" stroke-width="2"/>
  <path d="M40 195 L20 240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <path d="M120 195 L110 240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <path d="M190 195 L210 240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Background wall decor: Boutique shelf / mirror frame -->
  <rect x="25" y="30" width="70" height="140" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Mirror glass reflection -->
  <rect x="31" y="36" width="58" height="128" rx="4" fill="#0f172a"/>
  <path d="M35 50 Q60 40 85 60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.3"/>

  <!-- Clothing rack in background -->
  <path d="M150 50 L210 50" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="50" x2="160" y2="90" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="50" x2="200" y2="90" stroke="#475569" stroke-width="2"/>
  <!-- Hangers & Clothes -->
  <path d="M170 50 L173 65 H167 Z" fill="#64748b"/>
  <rect x="165" y="65" width="10" height="70" rx="3" fill="#ec4899" opacity="0.8"/>
  <path d="M190 50 L193 65 H187 Z" fill="#64748b"/>
  <rect x="185" y="65" width="12" height="75" rx="3" fill="#10b981" opacity="0.8"/>

  <!-- Potted plant for organic life -->
  <path d="M210 165 L225 195 H195 Z" fill="#475569"/>
  <path d="M210 165 C200 140 220 120 210 100 C220 130 230 150 210 165 Z" fill="#10b981"/>
  <path d="M205 160 C190 145 195 125 185 110 C195 130 200 145 205 160 Z" fill="#34d399"/>

  <!-- MAIN CHARACTERS (The Scene: "他上下打量了一番" - Evaluating from top to bottom) -->

  <!-- Character A: The person being evaluated (Standing straight, slightly posing) -->
  <g id="subject-person" transform="translate(70, 45)">
    <!-- Shadow -->
    <ellipse cx="25" cy="150" rx="18" ry="5" fill="#020617" opacity="0.6"/>
    
    <!-- Shoes -->
    <path d="M14 147 C14 143 20 142 24 142 C30 142 34 145 34 148 Z" fill="#334155"/>
    <path d="M28 147 C28 143 34 142 38 142 C44 142 48 145 48 148 Z" fill="#334155"/>

    <!-- Legs & Pants -->
    <rect x="18" y="110" width="10" height="35" rx="3" fill="#334155"/>
    <rect x="32" y="110" width="10" height="35" rx="3" fill="#334155"/>

    <!-- Torso (Jacket) -->
    <path d="M14 55 H46 L50 115 H10 Z" fill="url(#coat-grad)"/>
    <!-- Jacket lapels & zipper line -->
    <line x1="30" y1="55" x2="30" y2="115" stroke="#0284c7" stroke-width="2"/>
    <path d="M22 55 L30 75 L38 55" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms -->
    <path d="M12 60 L5 95 C5 98 8 100 11 98 L16 85" fill="#0284c7" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
    <path d="M48 60 L55 95 C55 98 52 100 49 98 L44 85" fill="#0284c7" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
    <!-- Hands -->
    <circle cx="10" cy="100" r="4" fill="#fbcfe8"/>
    <circle cx="50" cy="100" r="4" fill="#fbcfe8"/>

    <!-- Neck & Head -->
    <rect x="25" y="45" width="10" height="12" fill="#fbcfe8"/>
    <circle cx="30" cy="32" r="14" fill="#fbcfe8"/>
    
    <!-- Hair -->
    <path d="M16 30 C16 18 24 16 30 16 C38 16 44 20 44 32 C40 28 35 25 30 25 C25 25 20 27 16 30 Z" fill="#0f172a"/>
    
    <!-- Face expression (Confident/Curious smile) -->
    <circle cx="35" cy="30" r="1.5" fill="#1e293b"/>
    <path d="M33 36 Q36 39 39 36" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- Character B: The Evaluator (打量 - Leaning slightly, stroking chin, eyes scanning top to bottom) -->
  <g id="evaluator-person" transform="translate(130, 40)">
    <!-- Shadow -->
    <ellipse cx="30" cy="155" rx="20" ry="6" fill="#020617" opacity="0.6"/>

    <!-- Shoes -->
    <path d="M18 152 C18 148 24 147 28 147 C34 147 38 150 38 153 Z" fill="#0f172a"/>
    <path d="M32 152 C32 148 38 147 42 147 C48 147 52 150 52 153 Z" fill="#0f172a"/>

    <!-- Legs / Trousers -->
    <rect x="20" y="115" width="12" height="38" rx="3" fill="#1e293b"/>
    <rect x="34" y="115" width="12" height="38" rx="3" fill="#1e293b"/>

    <!-- Torso (Stylish coat/jacket - Evaluator) -->
    <path d="M15 60 H51 L55 120 H11 Z" fill="url(#inspector-coat)"/>
    <path d="M22 60 L33 80 L44 60" fill="none" stroke="#b45309" stroke-width="2"/>
    <line x1="33" y1="60" x2="33" y2="120" stroke="#b45309" stroke-width="2"/>

    <!-- Back arm (resting casually) -->
    <path d="M15 65 L5 90 C3 93 6 96 9 94 L18 80" fill="#d97706" stroke="#d97706" stroke-width="3"/>
    <circle cx="7" cy="95" r="4" fill="#fde047"/>

    <!-- Front arm (Hand on chin gesturing the "daliang" / evaluating pose) -->
    <path d="M47 65 L58 85 C60 88 57 91 54 90 L42 78" fill="#d97706" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
    <!-- Hand stroking chin -->
    <circle cx="58" cy="85" r="4.5" fill="#fde047"/>

    <!-- Neck & Head (Tilted forward/down slightly to look up and down) -->
    <rect x="27" y="48" width="12" height="14" fill="#fde047"/>
    <circle cx="33" cy="35" r="15" fill="#fde047"/>

    <!-- Hair (Smart, neat swept hair) -->
    <path d="M18 32 C18 20 26 18 33 18 C42 18 48 22 48 35 C44 28 38 26 33 26 C28 26 22 28 18 32 Z" fill="#334155"/>

    <!-- Face Profile / Expression (Intentional studying gaze) -->
    <!-- Glasses for professional/observant look -->
    <rect x="33" y="29" width="10" height="7" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="28" y1="32" x2="33" y2="32" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Focused Eye inside glasses -->
    <circle cx="38" cy="32.5" r="1.5" fill="#0f172a"/>
    <!-- Thoughtful curved mouth -->
    <path d="M37 40 Q40 42 43 39" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- VISUAL ACTION CUES ("上下" - Top-to-bottom scanning arcs) -->
  <!-- Subtle glowing curved arrows showing the "scanning/evaluating from head to toe" action -->
  <g filter="url(#glow)" opacity="0.8">
    <!-- Top-to-bottom scan arc -->
    <path d="M60 70 Q45 105 60 145" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,4"/>
    <!-- Arrow tip pointing down -->
    <path d="M55 137 L60 147 L65 139" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sparkles of appraisal/judgment -->
    <path d="M110 75 L113 82 L120 85 L113 88 L110 95 L107 88 L100 85 L107 82 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M52 110 L53.5 114 L57 115.5 L53.5 117 L52 121 L50.5 117 L47 115.5 L50.5 114 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Ambient Foreground Elements / Frame Polish -->
  <!-- Vignette overlay for depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>