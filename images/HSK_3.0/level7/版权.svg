<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow behind the focal object -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.06"/>

  <!-- Main Object: Open Book (representing copyrighted literary/cinematic work) -->
  <g transform="translate(0, 5)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="175" rx="65" ry="12" fill="#111318"/>
    
    <!-- Book Pages Base -->
    <path d="M 60 135 C 80 130, 110 135, 120 145 C 130 135, 160 130, 180 135 L 180 165 C 160 160, 130 165, 120 172 C 110 165, 80 160, 60 165 Z" fill="#2D333B"/>
    
    <!-- Left Page -->
    <path d="M 60 75 C 80 70, 110 75, 120 85 L 120 145 C 110 135, 80 130, 60 135 Z" fill="#E6EDF3"/>
    
    <!-- Right Page -->
    <path d="M 180 75 C 160 70, 130 75, 120 85 L 120 145 C 130 135, 160 130, 180 135 Z" fill="#D0D7DE"/>
    
    <!-- Page Lines (Abstract text representation) -->
    <line x1="72" y1="92" x2="104" y2="92" stroke="#8C959F" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="106" x2="108" y2="106" stroke="#8C959F" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="120" x2="96" y2="120" stroke="#8C959F" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="132" y1="92" x2="168" y2="92" stroke="#8C959F" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="106" x2="160" y2="106" stroke="#8C959F" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="120" x2="164" y2="120" stroke="#8C959F" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Book Spine -->
    <path d="M 116 80 L 124 80 L 124 168 L 116 165 Z" fill="#1F2328"/>
  </g>

  <!-- Overlay Focal Element: Modern Shield with Copyright Symbol (Representing Rights & Legal Protection) -->
  <g transform="translate(0, -2)">
    <!-- Shield Drop Shadow -->
    <path d="M 120 52 C 144 52, 162 44, 162 44 C 162 76, 156 102, 120 120 C 84 102, 78 76, 78 44 C 78 44, 96 52, 120 52 Z" fill="#0D1117" opacity="0.4" transform="translate(0, 4)"/>
    
    <!-- Shield Outer Body -->
    <path d="M 120 48 C 144 48, 162 40, 162 40 C 162 72, 156 98, 120 116 C 84 98, 78 72, 78 40 C 78 40, 96 48, 120 48 Z" fill="#1A1D24" stroke="#FFB703" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Shield Inner Fill -->
    <path d="M 120 53 C 141 53, 157 46, 157 46 C 157 73, 152 95, 120 111 C 88 95, 83 73, 83 46 C 83 46, 99 53, 120 53 Z" fill="#21262D"/>

    <!-- Copyright Symbol 'C' -->
    <path d="M 129 68 C 124 64, 116 63, 110 67 C 103 71, 101 80, 105 87 C 109 94, 117 96, 124 93" fill="none" stroke="#FFB703" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Inner detail of Copyright symbol (Vertical bar or serif abstraction) -->
    <path d="M 124 74 L 124 86" fill="none" stroke="#FFB703" stroke-width="5" stroke-linecap="round" opacity="0"/> <!-- Balanced spacing -->
  </g>
</svg>