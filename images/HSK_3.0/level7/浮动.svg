<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Water surface / support level background waves -->
    <path d="M40 140 C80 130, 120 150, 160 135 C200 120, 220 135, 220 135 L220 180 L20 180 Z" fill="#252B3B" opacity="0.6"/>
    <path d="M20 155 C70 145, 110 165, 150 150 C190 135, 210 150, 220 155 L220 180 L20 180 Z" fill="#2A344A" opacity="0.8"/>

    <!-- Dynamic fluctuation wave trails (Thả nổi / Biến động) -->
    <path d="M45 110 C75 90, 105 130, 135 100 C165 70, 195 110, 205 95" fill="none" stroke="#3A4660" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Buoyant Object (Physical object representing 'vật thể thả nổi' / floating asset) -->
    <g transform="translate(120, 105)">
      <!-- Subtle reflection under the buoy -->
      <ellipse cx="0" cy="38" rx="25" ry="6" fill="#11151C" opacity="0.5"/>
      
      <!-- Main floating sphere / marker representing financial/asset float -->
      <circle cx="0" cy="0" r="32" fill="#222B3D"/>
      
      <!-- Inner core structure -->
      <circle cx="0" cy="0" r="24" fill="#2E3A52"/>
      
      <!-- High-contrast accent band (Orange/Gold focus) -->
      <path d="M -22.6 -8 A 24 24 0 0 1 22.6 -8 L 26.2 -15 A 28 28 0 0 0 -26.2 -15 Z" fill="#F59E0B"/>
      <path d="M -22.6 8 A 24 24 0 0 0 22.6 8 L 26.2 15 A 28 28 0 0 0 -26.2 15 Z" fill="#F59E0B" opacity="0.8"/>
      
      <!-- Center Core Detail -->
      <circle cx="0" cy="0" r="8" fill="#1A1D24"/>
      <circle cx="0" cy="0" r="4" fill="#F59E0B"/>
      
      <!-- Top anchor loop -->
      <path d="M -6 -32 L -6 -38 C -6 -41, 6 -41, 6 -38 L 6 -32" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Up/Down Fluctuation Motion Indicators (Biến động) -->
    <!-- Up Arrow -->
    <g transform="translate(65, 65)">
      <circle cx="0" cy="0" r="14" fill="#252B3B" stroke="#333D52" stroke-width="2"/>
      <path d="M0 5 L0 -3 M-3 0 L0 -4 L3 0" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Down Arrow -->
    <g transform="translate(175, 135)">
      <circle cx="0" cy="0" r="14" fill="#252B3B" stroke="#333D52" stroke-width="2"/>
      <path d="M0 -5 L0 3 M-3 0 L0 4 L3 0" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>