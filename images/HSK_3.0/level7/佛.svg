<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Glow for Temple Altar -->
    <radialGradient id="altarGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Buddha Golden Gradient -->
    <linearGradient id="buddhaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Incense Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Temple Architecture Background (Interior Pillars & Roof Beams) -->
  <g opacity="0.3">
    <!-- Wooden Beams -->
    <rect x="0" y="20" width="240" height="12" fill="#78350f"/>
    <rect x="0" y="32" width="240" height="4" fill="#451a03"/>
    
    <!-- Left Pillar -->
    <rect x="15" y="36" width="18" height="204" fill="#78350f"/>
    <rect x="12" y="36" width="24" height="8" fill="#451a03"/>
    
    <!-- Right Pillar -->
    <rect x="207" y="36" width="18" height="204" fill="#78350f"/>
    <rect x="204" y="36" width="24" height="8" fill="#451a03"/>

    <!-- Hanging Lanterns Outline -->
    <path d="M45 36 L45 70 M195 36 L195 70" stroke="#b45309" stroke-width="2"/>
    <circle cx="45" cy="75" r="10" fill="#dc2626" opacity="0.5"/>
    <circle cx="195" cy="75" r="10" fill="#dc2626" opacity="0.5"/>
  </g>

  <!-- Ambient Golden Glow behind Buddha -->
  <circle cx="120" cy="115" r="75" fill="url(#altarGlow)"/>

  <!-- Altar Structure -->
  <g>
    <!-- Altar Base/Table -->
    <rect x="70" y="155" width="100" height="45" rx="4" fill="#78350f"/>
    <rect x="65" y="150" width="110" height="10" rx="2" fill="#b45309"/>
    <!-- Altar Red Cloth / Runner -->
    <path d="M85 160 L155 160 L160 190 L80 190 Z" fill="#991b1b"/>
    <path d="M80 190 L160 190 L165 200 L75 200 Z" fill="#7f1d1d"/>
  </g>

  <!-- Offerings (Fruit bowl & Incense burner) -->
  <g>
    <!-- Incense Burner -->
    <path d="M105 155 Q120 145 135 155 L130 162 C120 165 120 165 110 162 Z" fill="#64748b"/>
    <ellipse cx="120" cy="155" rx="15" ry="3" fill="#94a3b8"/>
    
    <!-- Incense Sticks & Smoke -->
    <line x1="117" y1="155" x2="115" y2="140" stroke="#78350f" stroke-width="1.5"/>
    <line x1="123" y1="155" x2="125" y2="140" stroke="#78350f" stroke-width="1.5"/>
    <!-- Gentle Smoke Swirl -->
    <path d="M115 138 Q110 120 120 110 Q130 100 120 85" fill="none" stroke="url(#smokeGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Fruit Plate (Left of burner) -->
    <ellipse cx="88" cy="157" rx="12" ry="4" fill="#cbd5e1"/>
    <circle cx="85" cy="152" r="5" fill="#f97316"/>
    <circle cx="92" cy="152" r="4" fill="#eab308"/>
  </g>

  <!-- THE STATUE (Fó / Buddha Statue) -->
  <g id="buddha-statue">
    <!-- Halo / Mandorla behind Buddha -->
    <circle cx="120" cy="95" r="32" fill="url(#buddhaGrad)" opacity="0.8"/>
    <circle cx="120" cy="95" r="28" fill="#1e293b" opacity="0.1"/>

    <!-- Lotus Throne (Padmasana base) -->
    <path d="M95 140 Q120 125 145 140 Q150 150 120 150 Q90 150 95 140 Z" fill="#d97706"/>
    <path d="M100 142 Q120 132 140 142 Q143 148 120 148 Q97 148 100 142 Z" fill="#fbbf24"/>

    <!-- Buddha Body (Seated Meditating Figure) -->
    <!-- Robe / Torso -->
    <path d="M100 135 C95 120 105 105 120 105 C135 105 145 120 140 135 Z" fill="url(#buddhaGrad)"/>
    <!-- Crossed Legs -->
    <ellipse cx="120" cy="138" rx="22" ry="9" fill="url(#buddhaGrad)"/>
    <!-- Hands in Dhyana Mudra (Meditation) -->
    <ellipse cx="120" cy="125" rx="10" ry="5" fill="#fbbf24"/>

    <!-- Buddha Head & Ushnisha -->
    <circle cx="120" cy="95" r="16" fill="url(#buddhaGrad)"/>
    <!-- Ushnisha (Topknot of wisdom) -->
    <circle cx="120" cy="76" r="5" fill="url(#buddhaGrad)"/>
    <!-- Serene Face Features (Minimalist peaceful style) -->
    <path d="M115 93 Q120 96 125 93" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="115" cy="90" r="1" fill="#b45309"/>
    <circle cx="125" cy="90" r="1" fill="#b45309"/>
    <circle cx="120" cy="86" r="1.5" fill="#b45309"/> <!-- Urna / Dot on forehead -->
  </g>

  <!-- Foreground Human Visitor (Devotee / Worshiper showing real-world context) -->
  <g id="visitor">
    <!-- Visitor's Body (Back view, slightly turned, bowing respectfully) -->
    <path d="M100 240 L105 205 C110 195 130 195 135 205 L140 240 Z" fill="#3b82f6"/>
    <!-- Visitor's Head -->
    <circle cx="120" cy="188" r="11" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M109 188 C109 180 131 180 131 188 C131 184 109 184 109 188 Z" fill="#1e293b"/>

    <!-- Hands folded in prayer (Anjali Mudra) raised toward the Buddha -->
    <path d="M116 202 Q120 196 124 202 L122 210 Q120 212 118 210 Z" fill="#fcd34d"/>
  </g>

  <!-- Atmospheric Lighting & Temple Details -->
  <!-- Warm soft vertical beam of light highlighting the altar and worshiper -->
  <path d="M90 0 L150 0 L170 240 L70 240 Z" fill="#fbbf24" opacity="0.04" style="mix-blend-mode: screen;"/>

  <!-- Foreground framing elements (Temple arch silhouette bottom corners) -->
  <path d="M0 240 L0 220 Q20 210 40 240 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M240 240 L240 220 Q220 210 200 240 Z" fill="#0f172a" opacity="0.8"/>

</svg>