<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Scene: Laboratory/Workshop -->

  <!-- Floor/Desk base -->
  <rect x="0" y="160" width="240" height="80" fill="#2d3a4b"/>
  <rect x="0" y="155" width="240" height="5" fill="#3a475b"/> <!-- Desk surface highlight -->

  <!-- Character: Scientist/Engineer -->
  <g id="character">
    <!-- Body -->
    <rect x="100" y="100" width="40" height="60" fill="#e0e7ff" rx="5"/> <!-- Lab coat body -->
    <rect x="95" y="105" width="10" height="40" fill="#e0e7ff" rx="3"/> <!-- Left arm -->
    <rect x="135" y="105" width="10" height="40" fill="#e0e7ff" rx="3"/> <!-- Right arm -->
    <!-- Head -->
    <circle cx="120" cy="90" r="18" fill="#fdd8c5"/> <!-- Skin -->
    <rect x="108" y="75" width="24" height="10" fill="#6b7280" rx="3"/> <!-- Hair -->
    <!-- Glasses -->
    <path d="M110 90 Q112 88 114 90 M126 90 Q128 88 130 90" stroke="#334155" stroke-width="2" fill="none"/>
    <circle cx="112" cy="90" r="5" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="128" cy="90" r="5" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- Hand holding tool -->
    <circle cx="140" cy="140" r="6" fill="#fdd8c5"/>
    <rect x="138" y="130" width="4" height="15" fill="#6b7280" rx="1"/> <!-- Tool (tweezers/screwdriver) -->
  </g>

  <!-- Sophisticated Instrument -->
  <g id="instrument">
    <rect x="50" y="110" width="140" height="45" fill="#475569" rx="8"/> <!-- Main body -->
    <rect x="55" y="115" width="130" height="35" fill="#334155" rx="5"/> <!-- Inner panel -->

    <!-- Display screen on instrument -->
    <rect x="65" y="120" width="40" height="25" fill="#10b981" rx="3"/>
    <circle cx="75" cy="132" r="2" fill="#e0e7ff"/>
    <circle cx="85" cy="128" r="2" fill="#e0e7ff"/>
    <circle cx="95" cy="135" r="2" fill="#e0e7ff"/>

    <!-- Dials and buttons -->
    <circle cx="120" cy="130" r="8" fill="#fbbf24"/> <!-- Large glowing dial -->
    <path d="M120 122 L120 130 L124 126 Z" fill="#f59e0b"/> <!-- Dial indicator -->

    <rect x="135" y="120" width="10" height="10" fill="#38bdf8" rx="2"/> <!-- Blue button -->
    <rect x="135" y="135" width="10" height="10" fill="#ec4899" rx="2"/> <!-- Pink button -->

    <!-- Intricate components / wires -->
    <rect x="150" y="120" width="30" height="25" fill="#526278" rx="3"/>
    <path d="M155 125 L160 125 L160 130 L155 130 Z" fill="#f59e0b"/>
    <path d="M165 125 L170 125 L170 130 L165 130 Z" fill="#f59e0b"/>
    <path d="M155 135 L160 135 L160 140 L155 140 Z" fill="#fbbf24"/>

    <!-- Small magnifying lens/scope attached to instrument -->
    <circle cx="180" cy="105" r="10" fill="#334155" stroke="#6b7280" stroke-width="2"/>
    <circle cx="180" cy="105" r="6" fill="#a0c4ff" opacity="0.7"/> <!-- Lens effect -->
    <rect x="175" y="100" width="10" height="15" fill="#6b7280" rx="2"/> <!-- Arm for scope -->
    <rect x="178" y="90" width="4" height="10" fill="#6b7280"/> <!-- Scope connection -->
  </g>

  <!-- Computer monitor in background -->
  <g id="monitor">
    <rect x="20" y="70" width="60" height="60" fill="#334155" rx="5"/> <!-- Monitor body -->
    <rect x="25" y="75" width="50" height="50" fill="#1e293b" rx="3"/> <!-- Screen off -->
    <rect x="25" y="75" width="50" height="50" fill="#10b981" rx="3" opacity="0.8"/> <!-- Screen on, showing data -->
    <!-- Abstract data lines -->
    <path d="M30 90 Q40 80 50 90 Q60 100 70 90" stroke="#e0e7ff" stroke-width="1.5" fill="none"/>
    <path d="M30 105 Q45 95 60 105 Q70 110 70 100" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <rect x="45" y="125" width="10" height="3" fill="#e0e7ff"/>
    <rect x="60" y="125" width="5" height="3" fill="#e0e7ff"/>
    <rect x="30" y="125" width="8" height="3" fill="#e0e7ff"/>
    <rect x="45" y="115" width="10" height="3" fill="#fbbf24"/>
    <rect x="60" y="115" width="5" height="3" fill="#fbbf24"/>
    <rect x="30" y="115" width="8" height="3" fill="#fbbf24"/>
    
    <rect x="40" y="130" width="20" height="5" fill="#475569" rx="2"/> <!-- Monitor stand -->
    <rect x="35" y="135" width="30" height="5" fill="#475569" rx="2"/> <!-- Monitor base -->
  </g>

  <!-- Overhead light / ambiance -->
  <circle cx="120" cy="50" r="20" fill="#fbbf24" opacity="0.2"/>
  <path d="M120 70 L110 155 H130 L120 70 Z" fill="#fbbf24" opacity="0.1"/> <!-- Light beam -->

  <!-- Shelf in background -->
  <rect x="170" y="60" width="50" height="10" fill="#475569" rx="3"/>
  <rect x="175" y="75" width="15" height="20" fill="#334155" rx="3"/> <!-- Item on shelf -->
  <rect x="195" y="70" width="15" height="25" fill="#334155" rx="3"/> <!-- Another item -->

</svg>