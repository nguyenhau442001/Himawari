<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Streetlight Gradient -->
    <radialGradient id="streetLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Streetlight Cone -->
  <polygon points="120,0 20,240 220,240" fill="url(#streetLight)" />

  <!-- URBAN ENVIRONMENT (Street Context) -->
  <g id="environment">
    <!-- Far Building -->
    <rect x="20" y="70" width="60" height="170" fill="#1b263b" rx="2" />
    <!-- Building Windows (Far) -->
    <rect x="30" y="90" width="14" height="20" fill="#334155" rx="1" />
    <rect x="56" y="90" width="14" height="20" fill="#334155" rx="1" />
    <rect x="30" y="125" width="14" height="20" fill="url(#windowGlow)" rx="1" />
    <rect x="56" y="125" width="14" height="20" fill="#334155" rx="1" />
    <rect x="30" y="160" width="14" height="20" fill="#334155" rx="1" />
    <rect x="56" y="160" width="14" height="20" fill="url(#windowGlow)" rx="1" />

    <!-- Near Building (Right) -->
    <rect x="160" y="50" width="65" height="190" fill="#1b263b" rx="3" />
    <!-- Storefront / Shop Window -->
    <path d="M 170,180 L 215,180 L 215,240 L 170,240 Z" fill="#0f172a" />
    <path d="M 175,190 L 210,190 L 210,240 L 175,240 Z" fill="url(#windowGlow)" />
    <!-- Awning -->
    <path d="M 160,170 Q 187,162 225,170 L 220,180 L 160,180 Z" fill="#f43f5e" />
    <path d="M 170,170 L 175,180 M 185,167 L 192,180 M 200,167 L 208,180" stroke="#fda4af" stroke-width="3" />

    <!-- Street Pole & Signage -->
    <rect x="105" y="30" width="6" height="210" fill="#475569" />
    <circle cx="108" cy="30" r="8" fill="#fbbf24" />

    <!-- Ground / Pavement -->
    <rect x="0" y="215" width="240" height="25" fill="#090d16" />
    <line x1="0" y1="215" x2="240" y2="215" stroke="#334155" stroke-width="2" />
  </g>

  <!-- MAIN CHARACTERS (Distributing Flyers) -->
  <g id="characters">
    <!-- CHARACTER 1: The Distributor (Promoter) -->
    <g id="distributor">
      <!-- Body/Torso -->
      <path d="M 75,140 L 95,140 L 100,185 L 70,185 Z" fill="#3b82f6" />
      <!-- Head & Hair -->
      <circle cx="85" cy="115" r="14" fill="#fcd34d" />
      <path d="M 71,113 C 71,100 99,100 99,113 C 95,107 75,107 71,113 Z" fill="#1e293b" />
      <!-- Face Expression (Friendly Smile) -->
      <circle cx="81" cy="114" r="1.5" fill="#1e293b" />
      <circle cx="89" cy="114" r="1.5" fill="#1e293b" />
      <path d="M 83,119 Q 85,122 87,119" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Back Arm (Holding Stack) -->
      <path d="M 78,145 L 65,160 L 72,165 Z" fill="#2563eb" />
      <!-- Stack of Flyers in Hand -->
      <rect x="58" y="152" width="16" height="12" rx="1" fill="#f8fafc" transform="rotate(-15 58 152)" />
      <rect x="57" y="150" width="16" height="12" rx="1" fill="#e2e8f0" transform="rotate(-15 57 150)" />

      <!-- Front Arm (Actively handing out flyer) -->
      <path d="M 92,145 L 118,155" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
      
      <!-- Legs -->
      <path d="M 76,185 L 74,220 L 82,220 L 84,185 Z" fill="#1e293b" />
      <path d="M 90,185 L 94,220 L 102,220 L 96,185 Z" fill="#1e293b" />
      <!-- Shoes -->
      <ellipse cx="78" cy="220" rx="6" ry="3" fill="#cbd5e1" />
      <ellipse cx="98" cy="220" rx="6" ry="3" fill="#cbd5e1" />
    </g>

    <!-- THE TARGET OBJECT: TỜ RƠI (FLYER IN MOTION) -->
    <g id="flying-flyers">
      <!-- Single Flyer being handed / floating -->
      <g transform="translate(115, 142) rotate(15)">
        <rect x="0" y="0" width="18" height="24" rx="1.5" fill="#ffffff" />
        <!-- Abstract content lines on flyer -->
        <line x1="3" y1="5" x2="12" y2="5" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
        <line x1="3" y1="10" x2="15" y2="10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="3" y1="14" x2="12" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <rect x="3" y="17" width="8" height="4" rx="1" fill="#38bdf8" />
      </g>
      <!-- Another tiny floating flyer for motion effect -->
      <rect x="138" y="130" width="12" height="16" rx="1" fill="#f8fafc" transform="rotate(45 138 130)" />
    </g>

    <!-- CHARACTER 2: The Pedestrian / Passerby (Receiving) -->
    <g id="pedestrian">
      <!-- Body/Torso -->
      <path d="M 140,145 L 160,145 L 155,185 L 135,185 Z" fill="#10b981" />
      <!-- Head & Hair -->
      <circle cx="147" cy="118" r="13" fill="#fed7aa" />
      <path d="M 135,115 C 135,103 159,103 159,115 C 153,110 141,110 135,115 Z" fill="#78350f" />
      <!-- Face Expression (Curious / Accepting) -->
      <circle cx="152" cy="117" r="1.5" fill="#1e293b" />
      <path d="M 148,123 Q 152,126 155,123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Front Arm (Reaching out to take flyer) -->
      <path d="M 138,150 L 128,153" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="125" cy="153" r="3" fill="#fed7aa" />

      <!-- Legs -->
      <path d="M 140,185 L 138,220 L 146,220 L 146,185 Z" fill="#334155" />
      <path d="M 152,185 L 156,220 L 164,220 L 158,185 Z" fill="#334155" />
      <!-- Shoes -->
      <ellipse cx="142" cy="220" rx="6" ry="3" fill="#1e293b" />
      <ellipse cx="160" cy="220" rx="6" ry="3" fill="#1e293b" />

      <!-- Shopping Bag / Prop -->
      <path d="M 160,165 L 170,165 L 168,205 L 162,205 Z" fill="#f59e0b" />
      <path d="M 163,165 C 163,160 167,160 167,165" stroke="#b45309" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Foreground Atmospheric Details -->
  <circle cx="40" cy="100" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="200" cy="80" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="215" cy="120" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="25" cy="180" r="1.5" fill="#ffffff" opacity="0.3" />
</svg>