  <path d="M105 95 Q120 105 135 95" stroke="#78350f" stroke-width="2" fill="none"/>
  <circle cx="112" cy="85" r="3" fill="#78350f"/>
  <circle cx="128" cy="85" r="3" fill="#78350f"/>
  
  <!-- Arm gesturing to data -->
  <path d="M140 100 L180 90" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Floating data nodes -->
  <circle cx="180" cy="70" r="4" fill="#38bdf8"/>
  <circle cx="200" cy="60" r="3" fill="#fb923c"/>
  <circle cx="220" cy="70" r="2" fill="#10b981"/>
  
  <!-- Paperwork -->
