      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="40" fill="#334155"/>
  <rect x="190" y="175" width="10" height="40" fill="#334155"/>

  <!-- Laptop -->
  <path d="M70 160 L170 160 L185 130 L55 130 Z" fill="#475569"/>
  <rect x="65" y="135" width="110" height="20" rx="2" fill="#94a3b8"/>
  
  <!-- Data Visualization (The "Proof") -->
  <path d="M190 80 L220 80 L220 120 L190 120 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="195" y="105" width="6" height="10" fill="#fb923c"/>
  <rect x="204" y="90" width="6" height="25" fill="#10b981"/>
  <rect x="213" y="98" width="6" height="17" fill="#ec4899"/>
  
  <!-- Character -->
