  <rect x="42" y="148" width="16" height="2" fill="#94a3b8"/>
  <rect x="42" y="153" width="16" height="2" fill="#94a3b8"/>
  <rect x="42" y="158" width="10" height="2" fill="#94a3b8"/>
</svg>