<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient lighting & interior details -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>
  
  <!-- Window view showing gentle night stars/bokeh -->
  <g fill="#334155" opacity="0.6">
    <circle cx="45" cy="50" r="1.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="28" cy="75" r="1" fill="#f8fafc" opacity="0.5"/>
    <circle cx="65" cy="85" r="1.5" fill="#f8fafc" opacity="0.7"/>
    <path d="M 20 110 Q 50 100 80 110 L 80 130 L 20 130 Z" fill="#1e293b"/>
  </g>
  <!-- Window Frame -->
  <rect x="20" y="35" width="60" height="95" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="50" y1="35" x2="50" y2="130" stroke="#475569" stroke-width="1.5"/>
  <line x1="20" y1="80" x2="80" y2="80" stroke="#475569" stroke-width="1.5"/>
  <path d="M 15 130 L 85 130 L 90 135 L 10 135 Z" fill="#334155"/>

  <!-- Warm background string lights -->
  <path d="M 0 20 Q 60 45 120 20 Q 180 45 240 20" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="40" cy="30" r="2.5" fill="#fef08a"/>
  <circle cx="90" cy="27" r="2.5" fill="#fca5a5"/>
  <circle cx="150" cy="27" r="2.5" fill="#93c5fd"/>
  <circle cx="200" cy="30" r="2.5" fill="#fef08a"/>

  <!-- Bookshelf / Home Decor in background -->
  <rect x="160" y="55" width="60" height="70" fill="#0f172a" opacity="0.5"/>
  <rect x="170" y="75" width="12" height="18" rx="2" fill="#3b82f6"/>
  <rect x="185" y="72" width="10" height="21" rx="2" fill="#ec4899"/>
  <rect x="198" y="78" width="14" height="15" rx="2" fill="#10b981"/>
  <line x1="160" y1="95" x2="220" y2="95" stroke="#334155" stroke-width="2"/>
  <!-- Small potted plant on shelf -->
  <path d="M 180 90 L 190 90 L 188 95 L 182 95 Z" fill="#f8fafc"/>
  <circle cx="185" cy="87" r="5" fill="#10b981"/>

  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="1.5"/>

  <!-- Rug under table -->
  <ellipse cx="120" cy="210" rx="75" ry="18" fill="#334155" opacity="0.4"/>
  <ellipse cx="120" cy="210" rx="65" ry="13" fill="#1e293b"/>

  <!-- Dining Table Setup representing a warm celebration/anniversary/wedding home scene -->
  <rect x="80" y="160" width="80" height="8" rx="2" fill="#64748b"/>
  <rect x="92" y="168" width="8" height="35" fill="#475569"/>
  <rect x="140" y="168" width="8" height="35" fill="#475569"/>

  <!-- Tablecloth -->
  <path d="M 75 160 L 165 160 L 170 175 Q 120 185 70 175 Z" fill="#f8fafc"/>
  
  <!-- Table Props: Cake with candles & Wine Glasses -->
  <path d="M 110 150 L 130 150 L 132 160 L 108 160 Z" fill="#ec4899"/>
  <path d="M 107 160 L 133 160 L 135 163 L 105 163 Z" fill="#f43f5e"/>
  <!-- Candle -->
  <rect x="118" y="140" width="4" height="10" fill="#fef08a"/>
  <ellipse cx="120" cy="138" rx="2" ry="3" fill="#fb923c"/>

  <!-- Wine glasses clinking/toast -->
  <path d="M 98 148 L 104 148 L 102 158 L 100 158 Z" fill="#94a3b8" opacity="0.8"/>
  <line x1="101" y1="158" x2="101" y2="162" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="101" cy="162" rx="4" ry="1" fill="#94a3b8"/>

  <path d="M 136 148 L 142 148 L 140 158 L 138 158 Z" fill="#94a3b8" opacity="0.8"/>
  <line x1="139" y1="158" x2="139" y2="162" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="139" cy="162" rx="4" ry="1" fill="#94a3b8"/>

  <!-- Character 1 (Left: Wife/Partner in cozy home attire) -->
  <g transform="translate(65, 105)">
    <!-- Chair -->
    <rect x="-10" y="30" width="22" height="68" rx="4" fill="#334155"/>
    <path d="M -15 35 L 5 35 L 5 95 L -10 95 Z" fill="#1e293b" opacity="0.3"/>

    <!-- Body / Torso (leaning slightly right, joyful) -->
    <path d="M 5 35 Q 25 35 30 65 L 10 75 Q 0 55 2 35 Z" fill="#f43f5e"/> <!-- Red/Pink festive sweater -->
    <!-- Collar -->
    <path d="M 8 35 Q 16 42 22 35" fill="none" stroke="#ffe4e6" stroke-width="2"/>

    <!-- Head & Hair -->
    <circle cx="16" cy="20" r="13" fill="#fbcfe8"/> <!-- face -->
    <path d="M 3 16 Q 16 -5 29 16 Q 28 28 26 30 Q 16 26 6 30 Q 3 24 3 16 Z" fill="#0f172a"/> <!-- Dark hair -->
    <circle cx="21" cy="21" r="1.5" fill="#0f172a"/> <!-- smiling eye -->
    <path d="M 23 25 Q 26 27 28 24" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/> <!-- smile -->
    <circle cx="26" cy="23" r="2.5" fill="#fda4af" opacity="0.6"/> <!-- blush -->

    <!-- Arms reaching out to toast / embrace -->
    <path d="M 18 45 Q 35 40 45 48" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="46" cy="49" r="4" fill="#fbcfe8"/> <!-- hand -->

    <!-- Legs sitting -->
    <rect x="5" y="70" width="14" height="25" rx="3" fill="#3b82f6"/>
    <rect x="14" y="90" width="12" height="6" rx="2" fill="#0f172a"/>
  </g>

  <!-- Character 2 (Right: Husband/Partner celebrating harmoniously) -->
  <g transform="translate(135, 105)">
    <!-- Chair -->
    <rect x="8" y="30" width="22" height="68" rx="4" fill="#334155"/>

    <!-- Body / Torso -->
    <path d="M 15 35 Q -5 35 -10 65 L 10 75 Q 20 55 18 35 Z" fill="#3b82f6"/> <!-- Blue sweater -->
    <!-- Collar -->
    <path d="M 12 35 Q 4 42 -2 35" fill="none" stroke="#bfdbfe" stroke-width="2"/>

    <!-- Head & Hair -->
    <circle cx="4" cy="20" r="13" fill="#fed7aa"/> <!-- face -->
    <path d="M -7 18 Q 4 2 15 16 Q 13 24 13 25 Q 4 21 -4 25 Q -6 21 -7 18 Z" fill="#1e293b"/> <!-- hair -->
    <circle cx="-1" cy="21" r="1.5" fill="#1e293b"/> <!-- eye -->
    <path d="M -4 25 Q -1 27 2 24" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/> <!-- smile -->
    <circle cx="-3" cy="23" r="2.5" fill="#fed7aa" opacity="0.6"/> <!-- blush -->

    <!-- Arms -->
    <path d="M 2 45 Q -15 40 -23 48" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-24" cy="49" r="4" fill="#fed7aa"/> <!-- hand -->

    <!-- Legs sitting -->
    <rect x="-1" y="70" width="14" height="25" rx="3" fill="#1e293b"/>
    <rect x="-6" y="90" width="12" height="6" rx="2" fill="#0f172a"/>
  </g>

  <!-- Floating warm celebratory sparkles / heart accents (symbolizing 'měimǎn' bliss & fulfillment) -->
  <g fill="#f59e0b">
    <path d="M 120 95 Q 120 90 125 90 Q 130 90 130 95 Q 130 101 125 105 Q 120 101 120 95 Z" fill="#fb7185" opacity="0.8"/>
    <path d="M 95 80 Q 95 76 99 76 Q 103 76 103 80 Q 103 85 99 88 Q 95 85 95 80 Z" fill="#f43f5e" opacity="0.9" transform="scale(0.8) translate(30, 15)"/>
    
    <!-- Sparkles -->
    <path d="M 120 65 L 122 70 L 127 72 L 122 74 L 120 79 L 118 74 L 113 72 L 118 70 Z" fill="#fef08a"/>
    <path d="M 155 90 L 156 93 L 159 94 L 156 95 L 155 98 L 154 95 L 151 94 L 154 93 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="M 85 100 L 86 102 L 88 103 L 86 104 L 85 106 L 84 104 L 82 103 L 84 102 Z" fill="#fbbf24" opacity="0.7"/>
  </g>

</svg>