<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Golden Hour Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- Distant Stars / City Lights -->
  <circle cx="30" cy="40" r="1" fill="#fde047" opacity="0.8"/>
  <circle cx="75" cy="25" r="1.5" fill="#fde047" opacity="0.6"/>
  <circle cx="120" cy="50" r="1" fill="#fde047" opacity="0.5"/>
  <circle cx="15" cy="80" r="1" fill="#fde047" opacity="0.7"/>

  <!-- Background Mountains -->
  <path d="M-20 160 L60 80 L140 150 L200 90 L260 160 Z" fill="url(#mountainBack)"/>
  
  <!-- Foreground Mountain Peak (Summit) -->
  <path d="M40 220 L130 95 L220 220 Z" fill="url(#mountainFront)"/>
  
  <!-- Mountain Snow Cap / Highlights -->
  <path d="M130 95 L148 120 L139 125 L130 115 L118 128 L108 118 Z" fill="#cbd5e1" opacity="0.9"/>
  <path d="M130 95 L148 120 L130 115 L118 128 Z" fill="#94a3b8"/>

  <!-- Miniature Cityscape in the Valley (Below) -->
  <!-- City Glow Background -->
  <ellipse cx="130" cy="180" rx="70" ry="25" fill="#f59e0b" opacity="0.15"/>

  <!-- Tiny Buildings & Grid -->
  <!-- Block 1 -->
  <rect x="95" y="170" width="8" height="25" fill="#38bdf8" opacity="0.8"/>
  <rect x="105" y="165" width="12" height="30" fill="#fb923c" opacity="0.8"/>
  <rect x="120" y="175" width="10" height="20" fill="#38bdf8" opacity="0.7"/>
  <!-- Block 2 -->
  <rect x="133" y="168" width="14" height="27" fill="#fbbf24" opacity="0.9"/>
  <rect x="150" y="173" width="9" height="22" fill="#ec4899" opacity="0.7"/>
  <rect x="162" y="166" width="11" height="29" fill="#38bdf8" opacity="0.8"/>
  <!-- Block 3 (Back) -->
  <rect x="110" y="185" width="15" height="15" fill="#10b981" opacity="0.8"/>
  <rect x="128" y="183" width="12" height="17" fill="#ec4899" opacity="0.8"/>

  <!-- Tiny Roads / Lights -->
  <path d="M85 190 Q120 175 180 195" stroke="#fde047" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M95 198 Q140 185 175 190" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Wooden Observation Deck / Railing on Summit -->
  <!-- Support beams -->
  <rect x="115" y="135" width="4" height="35" fill="#78350f"/>
  <rect x="145" y="130" width="4" height="35" fill="#78350f"/>
  <!-- Platform floor -->
  <polygon points="90,135 170,125 185,140 105,150" fill="#92400e"/>
  <polygon points="90,135 170,125 170,129 90,139" fill="#b45309"/>
  <!-- Railing -->
  <line x1="95" y1="125" x2="175" y2="115" stroke="#78350f" stroke-width="3"/>
  <line x1="102" y1="133" x2="102" y2="120" stroke="#78350f" stroke-width="2"/>
  <line x1="135" y1="129" x2="135" y2="116" stroke="#78350f" stroke-width="2"/>
  <line x1="168" y1="124" x2="168" y2="112" stroke="#78350f" stroke-width="2"/>

  <!-- Main Character (Hiker/Traveler looking down) -->
  <!-- Backpack -->
  <rect x="112" y="112" width="14" height="18" rx="4" fill="#047857"/>
  <path d="M115 112 L123 112 L123 125 L115 125 Z" fill="#065f46"/>

  <!-- Body (Sitting/Leaning posture overlooking) -->
  <!-- Legs -->
  <path d="M123 128 L135 125 L138 132 L125 133 Z" fill="#1e3a8a"/>
  <!-- Torso -->
  <path d="M115 110 L126 110 L128 128 L113 128 Z" fill="#f43f5e"/>
  <!-- Scarf -->
  <path d="M114 108 C120 110 125 107 130 111 L127 114 C123 110 118 112 114 111 Z" fill="#fbbf24"/>

  <!-- Head & Hair -->
  <circle cx="120" cy="102" r="7" fill="#fbcfe8"/>
  <path d="M113 101 C113 97 122 96 126 100 C127 102 124 105 124 105 C124 105 116 106 113 101 Z" fill="#451a03"/>

  <!-- Arm pointing/resting on railing -->
  <path d="M124 115 L138 120 L136 123 L122 118 Z" fill="#f43f5e"/>
  <circle cx="138" cy="121" r="2.5" fill="#fbcfe8"/>

  <!-- Companion Character (Standing, pointing down at the city) -->
  <!-- Body -->
  <path d="M150 102 L160 100 L163 122 L148 124 Z" fill="#0284c7"/>
  <!-- Head -->
  <circle cx="157" cy="93" r="6.5" fill="#fbcfe8"/>
  <path d="M150 92 C150 88 163 88 164 93 C160 92 153 92 150 92 Z" fill="#1e293b"/>
  <!-- Legs -->
  <path d="M152 122 L152 136 L156 136 L157 122 Z" fill="#334155"/>
  <path d="M158 123 L163 135 L167 134 L161 122 Z" fill="#334155"/>
  <!-- Arm pointing down towards the city -->
  <path d="M158 105 L175 115 L173 118 L156 108 Z" fill="#0284c7"/>
  <circle cx="176" cy="116" r="2" fill="#fbcfe8"/>

  <!-- Binoculars resting on railing -->
  <rect x="135" y="117" width="10" height="6" rx="2" fill="#334155"/>
  <circle cx="137" cy="120" r="2.5" fill="#94a3b8"/>
  <circle cx="143" cy="120" r="2.5" fill="#94a3b8"/>

  <!-- Foreground Atmospheric Elements (Clouds passing below summit) -->
  <path d="M0 145 Q20 140 45 148 T95 142 T145 150 T200 143 T240 148 L240 160 L0 160 Z" fill="#ffffff" opacity="0.1"/>
  <path d="M30 165 Q60 158 90 168 T160 162 T220 166 L240 180 L0 180 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Tiny Birds in the sky (Giving scale) -->
  <path d="M70 70 Q75 65 80 70 Q85 65 90 70 Q85 73 80 69 Q75 73 70 70 Z" fill="#94a3b8" opacity="0.7" transform="scale(0.6) translate(50, 20)"/>
  <path d="M70 70 Q75 65 80 70 Q85 65 90 70 Q85 73 80 69 Q75 73 70 70 Z" fill="#94a3b8" opacity="0.7" transform="scale(0.4) translate(140, 50)"/>
</svg>