<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Night Sky & Stars (Holiday atmosphere) -->
  <circle cx="40" cy="50" r="1.5" fill="#cbd5e1" opacity="0.6"/>
  <circle cx="80" cy="30" r="1" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="190" cy="40" r="1.5" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="210" cy="70" r="1" fill="#cbd5e1" opacity="0.5"/>
  <circle cx="20" cy="90" r="1" fill="#cbd5e1" opacity="0.4"/>

  <!-- Festive lanterns hanging -->
  <g>
    <!-- Left lantern -->
    <line x1="45" y1="20" x2="45" y2="40" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="45" cy="50" rx="10" ry="12" fill="#ef4444"/>
    <path d="M 40 40 Q 45 38 50 40 L 50 60 Q 45 62 40 60 Z" fill="#dc2626"/>
    <line x1="45" y1="62" x2="45" y2="70" stroke="#f59e0b" stroke-width="1"/>
    
    <!-- Right lantern -->
    <line x1="195" y1="20" x2="195" y2="40" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="195" cy="50" rx="10" ry="12" fill="#ef4444"/>
    <path d="M 190 40 Q 195 38 200 40 L 200 60 Q 195 62 190 60 Z" fill="#dc2626"/>
    <line x1="195" y1="62" x2="195" y2="70" stroke="#f59e0b" stroke-width="1"/>
  </g>

  <!-- Environment: Cozy House Exterior (Homecoming Scene) -->
  <g id="house">
    <!-- Ground / Pathway -->
    <path d="M 0 210 Q 120 190 240 210 L 240 240 L 0 240 Z" fill="#0f172a"/>
    <path d="M 80 240 Q 110 200 120 170 L 150 170 Q 160 200 190 240 Z" fill="#334155" opacity="0.6"/>

    <!-- House Walls -->
    <rect x="70" y="90" width="100" height="90" fill="url(#wallGrad)" rx="4"/>
    
    <!-- House Roof -->
    <path d="M 60 90 L 120 45 L 180 90 Z" fill="url(#roofGrad)"/>
    <path d="M 65 85 L 120 42 L 175 85 L 175 92 L 120 49 L 65 92 Z" fill="#fb7185" opacity="0.3"/>

    <!-- Warm Glowing Window -->
    <rect x="110" y="110" width="40" height="50" rx="6" fill="#78350f"/>
    <rect x="114" y="114" width="32" height="42" rx="4" fill="url(#windowGlow)"/>
    <!-- Window pane crosses -->
    <line x1="130" y1="114" x2="130" y2="156" stroke="#78350f" stroke-width="2"/>
    <line x1="114" y1="135" x2="146" y2="135" stroke="#78350f" stroke-width="2"/>

    <!-- Warm light spill on ground from door/window -->
    <path d="M 100 180 L 140 180 L 180 240 L 60 240 Z" fill="url(#warmLight)"/>

    <!-- Wooden Door (closed or welcomingly lit) -->
    <rect x="95" y="130" width="20" height="50" fill="#78350f" rx="2"/>
  </g>

  <!-- Foreground: Returning Traveler (Character arriving home for the holidays) -->
  <g id="traveler">
    <!-- Shadow beneath character -->
    <ellipse cx="140" cy="222" rx="22" ry="6" fill="#000000" opacity="0.4"/>

    <!-- Luggage / Suitcase -->
    <rect x="155" y="195" width="22" height="26" rx="4" fill="#64748b"/>
    <rect x="157" y="199" width="18" height="20" rx="2" fill="#475569"/>
    <path d="M 163 195 C 163 191 171 191 171 195" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="161" cy="223" r="2" fill="#1e293b"/>
    <circle cx="173" cy="223" r="2" fill="#1e293b"/>

    <!-- Character Legs -->
    <path d="M 130 180 L 128 220" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <path d="M 142 180 L 145 220" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="126" cy="222" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="147" cy="222" rx="6" ry="3" fill="#0f172a"/>

    <!-- Character Body / Coat -->
    <path d="M 125 140 Q 115 170 120 190 L 150 190 Q 155 170 145 140 Z" fill="url(#coatGrad)"/>
    <!-- Scarf (holiday winter vibe) -->
    <path d="M 130 132 Q 135 140 142 135 L 145 155 L 138 155 Z" fill="#ef4444"/>
    <path d="M 125 132 Q 135 138 140 132" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

    <!-- Arms -->
    <!-- Left arm holding suitcase handle -->
    <path d="M 125 145 Q 140 160 156 198" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <!-- Right arm waving happily -->
    <path d="M 145 145 Q 165 140 160 125" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="162" cy="122" r="5" fill="#fde047"/> <!-- Hand -->

    <!-- Head & Face -->
    <circle cx="138" cy="115" r="14" fill="#fde047"/>
    <!-- Hair -->
    <path d="M 124 112 Q 135 100 152 110 Q 150 120 148 115 Z" fill="#334155"/>
    <!-- Happy Expression (Smiling eyes & big smile) -->
    <path d="M 132 113 Q 135 116 138 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 142 113 Q 145 116 148 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 136 120 Q 140 124 144 120" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Lighting & Polish -->
  <!-- Soft vignette / overlay glow on the homecoming scene -->
  <circle cx="140" cy="150" r="90" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.15"/>
</svg>