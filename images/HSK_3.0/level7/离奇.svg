<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Room Environment -->
  <path d="M40 180h160v40H40z" fill="#0f172a" opacity="0.5"/>
  <circle cx="180" cy="60" r="30" fill="#f59e0b" opacity="0.2"/>
  
  <!-- The Storyteller (Grandpa) -->
  <g transform="translate(60, 120)">
    <path d="M20 80h20v20H20z" fill="#38bdf8"/>
    <ellipse cx="30" cy="30" rx="15" ry="18" fill="#fbbf24"/>
    <path d="M25 25h2m8 0h2m-9 5s2 2 4 0" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M20 45h20" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- The Listener (Child) -->
  <g transform="translate(140, 130)">
    <path d="M10 70h20v30H10z" fill="#ec4899"/>
    <circle cx="20" cy="30" r="12" fill="#fbbf24"/>
    <path d="M15 25h2m6 0h2m-7 5c1 2 3 2 4 0" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M10 40h20" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- The "Bizarre" Story Element (Floating glowing book/creature) -->
  <g transform="translate(110, 80)">
    <path d="M0 0l20-10 20 10-20 10z" fill="#10b981"/>
    <path d="M10 0l20 10M10 0l20-10" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="20" cy="0" r="4" fill="#f59e0b"/>
  </g>
  
  <!-- Floating Bizarre Sparkles -->
  <circle cx="160" cy="70" r="2" fill="#38bdf8"/>
  <circle cx="170" cy="90" r="3" fill="#ec4899"/>
  <circle cx="90" cy="60" r="2" fill="#10b981"/>
  <path d="M100 100l5-5M105 100l-5-5" stroke="#fbbf24" stroke-width="2"/>
</svg>