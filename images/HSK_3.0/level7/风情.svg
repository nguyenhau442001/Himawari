<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "风情" (Mediterranean charm/vibe) -->
  <!-- Contextual reference: Mediterranean ancient town street, distinctive architecture, arches, terracotta roof, potted plant, warm coastal ambiance -->
  
  <g transform="translate(0, 0)">
    <!-- Background warm coastal glow / sky gradient -->
    <circle cx="120" cy="110" r="75" fill="#242B38" />

    <!-- Distant arched wall / architecture backdrop -->
    <path d="M 70 150 L 70 100 A 50 50 0 0 1 170 100 L 170 150 Z" fill="#2E3748" />
    <path d="M 90 150 L 90 105 A 30 30 0 0 1 150 105 L 150 150 Z" fill="#1A1D24" />

    <!-- Terracotta tiled roof detail -->
    <path d="M 60 95 L 180 95 L 170 80 L 70 80 Z" fill="#D96B43" />
    <path d="M 65 80 L 175 80 L 170 72 L 70 72 Z" fill="#C25934" />

    <!-- Classic Mediterranean window shutters (Teal/Blue accent) -->
    <rect x="98" y="112" width="12" height="28" rx="2" fill="#3B82F6" />
    <rect x="130" y="112" width="12" height="28" rx="2" fill="#3B82F6" />
    <line x1="104" y1="112" x2="104" y2="140" stroke="#1A1D24" stroke-width="1.5" />
    <line x1="136" y1="112" x2="136" y2="140" stroke="#1A1D24" stroke-width="1.5" />

    <!-- Cobblestone street / balcony foreground -->
    <path d="M 50 165 C 50 155, 190 155, 190 165 L 195 190 C 195 195, 45 195, 45 190 Z" fill="#374151" />
    <!-- Street detail lines -->
    <path d="M 70 172 Q 120 178 170 172" stroke="#2E3748" stroke-width="2" fill="none" />
    <path d="M 60 182 Q 120 188 180 182" stroke="#2E3748" stroke-width="2" fill="none" />

    <!-- Terracotta pot with vibrant green foliage and flowers (Representing local charm/ambiance) -->
    <path d="M 105 165 L 135 165 L 130 148 L 110 148 Z" fill="#E07A5F" /> <!-- Pot base -->
    <ellipse cx="120" cy="148" rx="10" ry="3" fill="#F4A261" /> <!-- Pot rim -->

    <!-- Lush plant leaves and flowers -->
    <circle cx="120" cy="132" r="16" fill="#10B981" />
    <circle cx="110" cy="138" r="12" fill="#059669" />
    <circle cx="130" cy="138" r="12" fill="#059669" />
    <circle cx="120" cy="120" r="10" fill="#34D399" />
    <!-- Colorful bougainvillea blossoms (Focus accent) -->
    <circle cx="113" cy="125" r="4" fill="#F43F5E" />
    <circle cx="127" cy="130" r="4.5" fill="#F43F5E" />
    <circle cx="122" cy="115" r="4" fill="#FB7185" />
    <circle cx="113" cy="137" r="3.5" fill="#FB7185" />

    <!-- Warm ambient glow points (Golden hour atmosphere) -->
    <circle cx="75" cy="70" r="2" fill="#FBBF24" opacity="0.8" />
    <circle cx="165" cy="65" r="3" fill="#FBBF24" opacity="0.6" />
    <circle cx="150" cy="55" r="1.5" fill="#FBBF24" opacity="0.9" />

    <!-- Sleek architectural hanging lantern -->
    <path d="M 120 45 L 120 55" stroke="#9CA3AF" stroke-width="2" />
    <path d="M 112 55 L 128 55 L 125 70 L 115 70 Z" fill="#FBBF24" />
    <polygon points="120,53 126,58 114,58" fill="#4B5563" />
  </g>
</svg>