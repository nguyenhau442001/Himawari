<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground Plane -->
  <path d="M40 180 L200 180" stroke="#343A46" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Center Point (Community Center) -->
  <circle cx="120" cy="180" r="6" fill="#FFB86C"/>
  <rect x="112" y="150" width="16" height="30" fill="#6272A4"/>
  <path d="M112 150 L120 140 L128 150 Z" fill="#FFB86C"/>
  
  <!-- The Radius Action: A person measuring/defining the distance -->
  <g>
    <!-- Person -->
    <circle cx="120" cy="110" r="10" fill="#F8F8F2"/>
    <path d="M120 120 L120 150 M120 130 L105 145 M120 130 L135 145 M120 150 L110 170 M120 150 L130 170" stroke="#F8F8F2" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Measuring Action: Arm extending to show the span -->
    <path d="M120 120 L180 120" stroke="#FFB86C" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="180" cy="120" r="4" fill="#FFB86C"/>
    
    <!-- Motion/Action lines for defining the area -->
    <path d="M120 180 A 60 60 0 0 1 180 120" fill="none" stroke="#FFB86C" stroke-width="2" stroke-linecap="round"/>
    <path d="M175 125 L180 120 L175 115" stroke="#FFB86C" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Surroundings (Simplified context) -->
  <rect x="50" y="160" width="20" height="20" fill="#44475A"/>
  <rect x="160" y="165" width="15" height="15" fill="#44475A"/>
</svg>