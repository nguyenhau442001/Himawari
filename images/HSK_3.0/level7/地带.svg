<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background grid / topography lines to establish "地" (land/region) -->
  <path d="M 30 180 Q 120 160 210 180" stroke="#2A313C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 30 195 Q 120 175 210 195" stroke="#2A313C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 20 70 Q 120 90 220 70" stroke="#2A313C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Left territory / zone A -->
  <path d="M 20 70 L 80 70 L 95 180 L 20 195 Z" fill="#242B35" opacity="0.8"/>
  <line x1="80" y1="70" x2="95" y2="180" stroke="#3E4856" stroke-width="2"/>

  <!-- Right territory / zone B -->
  <path d="M 220 70 L 160 70 L 145 180 L 220 195 Z" fill="#242B35" opacity="0.8"/>
  <line x1="160" y1="70" x2="145" y2="180" stroke="#3E4856" stroke-width="2"/>

  <!-- THE CENTRAL BUFFER ZONE (地带 / dídài) - Highlighted with gold/orange accent -->
  <path d="M 80 70 L 160 70 L 145 180 L 95 180 Z" fill="#2E2822" opacity="0.9"/>
  
  <!-- Ground pattern inside the buffer zone -->
  <line x1="102" y1="130" x2="138" y2="130" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <line x1="107" y1="150" x2="133" y2="150" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- Border checkpoint barrier / security post elements -->
  <!-- Left post -->
  <rect x="75" y="105" width="8" height="45" rx="2" fill="#64748B"/>
  <circle cx="79" cy="100" r="4" fill="#EF4444"/>

  <!-- Right post -->
  <rect x="157" y="105" width="8" height="45" rx="2" fill="#64748B"/>
  <circle cx="161" cy="100" r="4" fill="#EF4444"/>

  <!-- Security Gate Arm crossing the buffer zone -->
  <g transform="rotate(-15 83 115)">
    <rect x="80" y="112" width="82" height="6" rx="3" fill="#F59E0B"/>
    <rect x="92" y="112" width="14" height="6" fill="#1A1D24"/>
    <rect x="120" y="112" width="14" height="6" fill="#1A1D24"/>
    <rect x="148" y="112" width="14" height="6" fill="#1A1D24"/>
  </g>

  <!-- Security Checkpoint Station (Iconic Physical Object in Center) -->
  <g transform="translate(100, 75)">
    <rect x="10" y="5" width="20" height="25" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="13" y="9" width="14" height="10" rx="1" fill="#38BDF8" opacity="0.7"/>
    <!-- Roof -->
    <path d="M 5 5 L 20 -3 L 35 5 Z" fill="#64748B"/>
  </g>

  <!-- Ground boundary lines -->
  <line x1="20" y1="195" x2="220" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
</svg>