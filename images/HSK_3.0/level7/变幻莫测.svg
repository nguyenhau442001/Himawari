<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Mountain Peak representing "变幻莫测" (Unpredictable/Mutable Alpine Weather) -->
  <g transform="translate(0, 15)">
    <!-- Background glowing dynamic atmospheric swirls (unpredictable shifts) -->
    <path d="M50 130 C70 100, 90 140, 120 110 C150 80, 170 130, 190 100" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
    <path d="M40 150 C70 130, 100 160, 140 130 C170 100, 200 140, 210 120" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,3" fill="none" opacity="0.4"/>

    <!-- Mountain Base / Stable Physical Object (Noun requirement) -->
    <polygon points="120,45 45,175 195,175" fill="#283044"/>
    
    <!-- Shaded side of the mountain -->
    <polygon points="120,45 120,175 195,175" fill="#1E2533"/>
    
    <!-- Snow cap with jagged, unpredictable weather boundary -->
    <path d="M120,45 L135,75 L125,85 L145,105 L130,115 L105,90 L115,75 Z" fill="#E2E8F0"/>

    <!-- Split Weather Phenomenon overlay (Half storm/lightning, half radiant sun) -->
    <!-- Left side: Storm cloud & lightning -->
    <g transform="translate(65, 80)">
      <path d="M25 20 C15 20, 10 30, 12 40 C6 42, 5 50, 12 55 L40 55 C48 50, 45 40, 38 38 C42 28, 33 20, 25 20 Z" fill="#64748B"/>
      <!-- Glowing amber/gold lightning bolt cutting through -->
      <polygon points="24,45 16,65 24,65 20,85 34,60 26,60" fill="#F59E0B"/>
    </g>

    <!-- Right side: Bright sun & warm rays breaking through -->
    <g transform="translate(145, 75)">
      <circle cx="20" cy="20" r="14" fill="#FBBF24"/>
      <!-- Sun rays -->
      <line x1="20" y1="0" x2="20" y2="-6" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
      <line x1="36" y1="20" x2="42" y2="20" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
      <line x1="31" y1="9" x2="36" y2="4" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Mountain Climber Silhouettes (Contextual reference: 登山队员) for scale and tangible physical setting -->
    <g fill="#94A3B8" transform="translate(90, 130)">
      <!-- Climber 1 -->
      <circle cx="15" cy="10" r="3"/>
      <path d="M15 13 L12 25 L8 35" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 16 L22 22 L20 30" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Ice axe -->
      <line x1="22" y1="22" x2="26" y2="15" stroke="#38BDF8" stroke-width="2"/>
    </g>
    
    <g fill="#94A3B8" transform="translate(115, 120)">
      <!-- Climber 2 -->
      <circle cx="15" cy="10" r="3"/>
      <path d="M15 13 L18 24 L22 34" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 16 L10 22 L12 30" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Ground / Foothills -->
    <path d="M30 175 Q120 165 210 175 L215 190 Q120 195 25 190 Z" fill="#334155"/>
  </g>
</svg>