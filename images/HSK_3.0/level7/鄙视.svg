<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The "Superior" Character (The one looking down) -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="20" fill="#FFC107"/>
    <path d="M10 35 Q20 45 30 35" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <rect x="5" y="50" width="30" height="80" rx="5" fill="#E0E0E0"/>
    <path d="M35 60 L60 50" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <path d="M5 60 L-20 50" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The "Laborer" Character (The one being looked down upon) -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="20" fill="#546E7A"/>
    <path d="M10 35 Q20 30 30 35" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <rect x="10" y="40" width="20" height="60" rx="2" fill="#78909C"/>
    <path d="M10 50 L-5 70" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 50 L45 70" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Visual indicator of "looking down" (The gaze/angle) -->
  <line x1="150" y1="90" x2="90" y2="130" stroke="#FFC107" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Ground line -->
  <line x1="40" y1="200" x2="200" y2="200" stroke="#37474F" stroke-width="2"/>
</svg>