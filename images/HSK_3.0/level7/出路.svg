<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Beam Gradient -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Desk Glow -->
    <radialGradient id="desk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Office / Studio Interior -->
  <!-- Back Wall & Corner -->
  <path d="M0 0 H240 V180 H0 Z" fill="#1e293b" />
  <path d="M0 180 H240 V240 H0 Z" fill="#0f172a" />
  <line x1="180" y1="0" x2="180" y2="180" stroke="#090d16" stroke-width="2" opacity="0.5" />

  <!-- Window Frame casting light (representing "的出路" - finding a way out/solution) -->
  <g transform="translate(185, 25)">
    <rect x="0" y="0" width="40" height="110" rx="4" fill="#0b1329" stroke="#334155" stroke-width="2" />
    <!-- Window Panes -->
    <rect x="5" y="5" width="13" height="47" rx="2" fill="#38bdf8" opacity="0.15" />
    <rect x="22" y="5" width="13" height="47" rx="2" fill="#38bdf8" opacity="0.15" />
    <rect x="5" y="58" width="13" height="47" rx="2" fill="#38bdf8" opacity="0.15" />
    <rect x="22" y="58" width="13" height="47" rx="2" fill="#38bdf8" opacity="0.15" />
  </g>

  <!-- Light Beam projecting onto the scene -->
  <polygon points="185,45 80,210 200,210" fill="url(#light-beam)" />

  <!-- Bookshelf / Prop in background -->
  <g transform="translate(15, 40)" opacity="0.6">
    <rect x="0" y="0" width="35" height="90" fill="#090d16" rx="2" />
    <line x1="0" y1="30" x2="35" y2="30" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="60" x2="35" y2="60" stroke="#334155" stroke-width="2" />
    <!-- Colorful books -->
    <rect x="5" y="10" width="6" height="20" rx="1" fill="#ec4899" />
    <rect x="13" y="12" width="5" height="18" rx="1" fill="#38bdf8" />
    <rect x="6" y="40" width="8" height="20" rx="1" fill="#10b981" />
    <rect x="16" y="38" width="7" height="22" rx="1" fill="#fbbf24" />
  </g>

  <!-- Desk Surface -->
  <path d="M40 170 L200 170 L210 215 L30 215 Z" fill="#334155" filter="url(#soft-shadow)" />
  <path d="M40 170 H200 L210 177 H30 Z" fill="#475569" />

  <!-- PROPS: Messy papers turned into a breakthrough solution -->
  <!-- Scattered blueprints / notes -->
  <g transform="translate(60, 178) rotate(-10)">
    <rect x="0" y="0" width="35" height="25" rx="1" fill="#f8fafc" />
    <line x1="5" y1="6" x2="25" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="12" x2="30" y2="12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="18" x2="15" y2="18" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Successful Blueprint / Corrected Document with Glowing Checkmark / Path -->
  <g transform="translate(120, 168) rotate(8)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="45" height="38" rx="2" fill="#f8fafc" />
    <!-- Diagram lines showing a "way out" or maze solved -->
    <path d="M8 10 H22 V28 H37" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="37" cy="28" r="4" fill="#10b981" />
    <!-- Glowing Accent Star representing "solution/out" -->
    <path d="M25 6 L26.5 9 L29.5 9.5 L27.2 11.5 L27.8 14.5 L25 13 L22.2 14.5 L22.8 11.5 L20.5 9.5 L23.5 9 Z" fill="#fbbf24" />
  </g>

  <!-- Coffee Mug -->
  <rect x="175" y="175" width="14" height="18" rx="3" fill="#cbd5e1" />
  <path d="M189 179 C194 179, 194 189, 189 189" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

  <!-- CHARACTER: Frustrated yet suddenly enlightened professional finding the 'chūlù' -->
  <g transform="translate(85, 80)">
    <!-- Body / Torso -->
    <path d="M30 65 C30 50, 45 45, 60 45 C75 45, 90 50, 90 65 L95 95 C95 95, 60 100, 25 95 Z" fill="#0284c7" />
    <!-- Collar & Tie -->
    <polygon points="50,45 60,60 70,45" fill="#f8fafc" />
    <polygon points="57,55 60,75 63,55" fill="#f43f5e" />

    <!-- Neck -->
    <rect x="52" y="36" width="16" height="14" fill="#fcd34d" rx="4" />

    <!-- Head -->
    <circle cx="60" cy="25" r="22" fill="#fcd34d" />

    <!-- Hair -->
    <path d="M38 22 C38 10, 50 8, 60 8 C72 8, 82 12, 82 25 C82 28, 80 25, 78 20 C74 12, 65 12, 60 12 C48 12, 42 16, 38 22 Z" fill="#334155" />

    <!-- Facial Expression: Relief / Realization of the "way out" -->
    <!-- Eyes (Happy / Relieved arc closed or focused with hope) -->
    <path d="M50 24 Q53 20 56 24" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M64 24 Q67 20 70 24" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Eyebrows raised in hopeful realization -->
    <path d="M49 18 Q53 16 57 19" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M63 19 Q67 16 71 18" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Smiling Mouth -->
    <path d="M53 30 Q60 36 67 30" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Arms & Hands gesturing "Eureka! There's a way out!" -->
    <!-- Right Arm (Pointing at the document/solution) -->
    <path d="M85 60 C95 65, 105 75, 110 85" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="112" cy="87" r="6" fill="#fcd34d" /> <!-- Hand -->

    <!-- Left Arm (Hand on chin / thoughtful pose transitioning to joy) -->
    <path d="M35 60 C25 65, 25 80, 40 85" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="42" cy="87" r="6" fill="#fcd34d" />
  </g>

  <!-- Ambient Lighting Glow on Desk & Character -->
  <circle cx="140" cy="180" r="40" fill="url(#desk-glow)" style="mix-blend-mode: screen;" />

  <!-- Visual Metaphor Element: Subtle glowing conceptual exit/path floating above desk (No text, pure visual vector storytelling) -->
  <g transform="translate(142, 105)" filter="url(#soft-shadow)">
    <!-- Glowing light bulb / idea / breakthrough symbol -->
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.9" />
    <path d="M-6 8 H6 V13 C6 14, 5 15, 4 15 H-4 C-5 15, -6 14, -6 13 Z" fill="#94a3b8" />
    <line x1="-3" y1="17" x2="3" y2="17" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Rays of light -->
    <path d="M0 -18 V-23" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M-12 -12 L-16 -16" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M12 -12 L16 -16" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M-18 0 H-23" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M18 0 H23" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

</svg>