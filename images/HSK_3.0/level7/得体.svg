<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle grid for professional context -->
  <path d="M0 120h240M120 0v240" stroke="#2D343E" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Character representing the professional, composed individual -->
  <!-- Torso/Suit -->
  <path d="M80 140h80v60c0 10-10 20-20 20h-40c-10 0-20-10-20-20v-60z" fill="#3D4A5D"/>
  <!-- Head -->
  <circle cx="120" cy="100" r="25" fill="#E0E6ED"/>
  <!-- Hair -->
  <path d="M95 100c0-15 10-25 25-25s25 10 25 25" fill="#2D343E"/>
  
  <!-- Gesture: The "De-ti" (Appropriate/Polite) hand gesture: A calm, open palm gesture at chest level -->
  <path d="M145 130c5 0 10 5 10 10s-5 10-10 10" fill="#E0E6ED"/>
  <path d="M155 135l15-5 5 10-15 5z" fill="#E0E6ED"/>
  
  <!-- Visual Contrast: Representing "Appropriateness" via balance -->
  <!-- Left side: Chaotic/Disorganized (Small, scattered dots) -->
  <circle cx="40" cy="180" r="3" fill="#4A5568"/>
  <circle cx="50" cy="195" r="2" fill="#4A5568"/>
  <circle cx="35" cy="200" r="4" fill="#4A5568"/>
  
  <!-- Right side: Orderly/Appropriate (Aligned, golden geometric shapes) -->
  <rect x="180" y="170" width="10" height="10" rx="2" fill="#FFB84D"/>
  <rect x="195" y="170" width="10" height="10" rx="2" fill="#FFB84D"/>
  <rect x="210" y="170" width="10" height="10" rx="2" fill="#FFB84D"/>
  
  <!-- Focus element: A golden arc indicating poise and measured movement -->
  <path d="M90 70 C 70 70, 60 100, 60 130" stroke="#FFB84D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M150 70 C 170 70, 180 100, 180 130" stroke="#FFB84D" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>