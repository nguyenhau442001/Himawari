<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="140" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="155" width="10" height="60" fill="#475569"/>
  <rect x="190" y="155" width="10" height="60" fill="#475569"/>
  
  <!-- Paperwork/Clutter (The '弊端') -->
  <path d="M60 130 L100 130 L105 140 L55 140 Z" fill="#fb923c" opacity="0.8"/>
  <path d="M70 120 L110 120 L115 130 L65 130 Z" fill="#fb923c" opacity="0.6"/>
  <path d="M80 110 L120 110 L125 120 L75 120 Z" fill="#fb923c" opacity="0.4"/>
  
  <!-- Manager Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#38bdf8"/>
    <path d="M15 40 L5 60 M25 40 L35 60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Correcting Action -->
    <path d="M30 45 L50 30" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="52" cy="28" r="4" fill="#fbbf24"/>
  </g>
  
  <!-- Employee Character -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#10b981"/>
    <path d="M15 40 L5 60 M25 40 L35 60" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Correction Marker/Pen -->
  <path d="M145 70 L160 55 L165 60 L150 75 Z" fill="#ec4899"/>
  
  <!-- Ambient Light -->
  <circle cx="180" cy="60" r="30" fill="#f59e0b" opacity="0.1" filter="blur(10px)"/>
</svg>