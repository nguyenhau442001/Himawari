<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle grid/ambient background lines representing digital control room / grid -->
  <path d="M40 190 L200 190" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M40 50 L200 50" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Background glow for the central power transmission -->
  <circle cx="120" cy="120" r="70" fill="#222B38" opacity="0.6"/>

  <!-- Power Transmission Network (电网 - Diànwǎng) Graphic elements -->
  <!-- Transmission Tower (Pylon) -->
  <g>
    <!-- Tower Base Foundation -->
    <path d="M105 185 L135 185 L128 150 L112 150 Z" fill="#4B5563"/>
    
    <!-- Main Tower Structure (Truss design) -->
    <polygon points="112,150 128,150 123,90 117,90" fill="#6B7280"/>
    <polygon points="117,90 123,90 121,60 119,60" fill="#9CA3AF"/>
    
    <!-- Tower Crossarms (Horizontal arms for high voltage lines) -->
    <path d="M90 100 L150 100" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 125 L140 125" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/>
    <path d="M105 75 L135 75" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>

    <!-- Insulators on Crossarms -->
    <circle cx="95" cy="100" r="3" fill="#D1D5DB"/>
    <circle cx="145" cy="100" r="3" fill="#D1D5DB"/>
    <circle cx="105" cy="125" r="3" fill="#D1D5DB"/>
    <circle cx="135" cy="125" r="3" fill="#D1D5DB"/>
    <circle cx="110" cy="75" r="2.5" fill="#D1D5DB"/>
    <circle cx="130" cy="75" r="2.5" fill="#D1D5DB"/>

    <!-- Tower Peak -->
    <line x1="120" y1="60" x2="120" y2="45" stroke="#9CA3AF" stroke-width="3"/>
    <circle cx="120" cy="43" r="2" fill="#F59E0B"/>
  </g>

  <!-- Power Lines / Grid Connections (Curved cabled network) -->
  <path d="M35 110 Q 75 130 95 100" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.8"/>
  <path d="M145 100 Q 165 130 205 110" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.8"/>
  <path d="M30 135 Q 70 150 105 125" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>
  <path d="M135 125 Q 170 150 210 135" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>

  <!-- Stylized Mountain Silhouette representing remote regions / countryside (农村特高压) -->
  <path d="M30 190 L75 140 L110 190 Z" fill="#1F2937" opacity="0.8"/>
  <path d="M125 190 L165 155 L215 190 Z" fill="#1F2937" opacity="0.8"/>

  <!-- Glowing Electrical Nodes / Energy Pulses (Highlighting ultra-high voltage power flow) -->
  <circle cx="95" cy="100" r="4" fill="#F59E0B"/>
  <circle cx="95" cy="100" r="8" fill="#F59E0B" opacity="0.3"/>

  <circle cx="145" cy="100" r="4" fill="#F59E0B"/>
  <circle cx="145" cy="100" r="8" fill="#F59E0B" opacity="0.3"/>

  <!-- Center Energy Spark / Focus Accent -->
  <path d="M120 70 L115 85 L125 85 L120 100" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 70 L115 85 L125 85 L120 100" fill="#F59E0B" opacity="0.4"/>
</svg>