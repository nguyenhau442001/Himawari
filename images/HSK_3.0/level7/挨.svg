<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Environment: Dilapidated room -->
  <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#334155"/>
  <path d="M40 80 L80 80 L80 180 L40 180 Z" fill="#475569"/>
  <circle cx="60" cy="130" r="15" fill="#1e293b"/>
  
  <!-- Character: Young boy working hard (carrying heavy sack) -->
  <g transform="translate(100, 100)">
    <!-- Body -->
    <path d="M20 120 L50 120 L45 70 L25 70 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="35" cy="55" r="15" fill="#fde68a"/>
    <!-- Sack -->
    <path d="M50 40 L90 40 L95 90 L55 90 Z" fill="#94a3b8"/>
    <path d="M55 40 L55 30 L85 30 L85 40" fill="none" stroke="#64748b" stroke-width="4"/>
    <!-- Arms -->
    <path d="M25 80 L10 100" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 80 L60 60" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M25 120 L20 160" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 120 L50 160" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Symbolic representation of hardship/effort -->
  <path d="M160 140 Q170 120 180 140 T200 140" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="180" cy="110" r="3" fill="#f59e0b"/>
  <circle cx="190" cy="105" r="2" fill="#f59e0b"/>
  
  <!-- Floor details -->
  <rect x="20" y="210" width="200" height="5" fill="#10b981" opacity="0.3"/>
</svg>