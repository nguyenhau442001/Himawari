<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with full bleed -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- Hospital Room Environment -->
  <!-- Window with night city glow -->
  <path d="M170 30 L210 30 L210 90 L170 90 Z" fill="#334155" opacity="0.4"/>
  <path d="M174 34 L206 34 L206 86 L174 86 Z" fill="#0f172a"/>
  <!-- City lights outside -->
  <circle cx="184" cy="50" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="196" cy="65" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="188" cy="78" r="2" fill="#ef4444" opacity="0.5"/>

  <!-- Medical Equipment: IV Pole & Bag -->
  <line x1="45" y1="40" x2="45" y2="180" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35 40 L55 40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- IV Bag -->
  <rect x="38" y="50" width="14" height="24" rx="4" fill="#e2e8f0" opacity="0.8"/>
  <path d="M45 74 L45 95" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M30 45 L45 40" stroke="#64748b" stroke-width="2"/>

  <!-- Heart Monitor Machine -->
  <g transform="translate(150, 110)">
    <!-- Monitor Body -->
    <rect x="0" y="0" width="55" height="42" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Screen -->
    <rect x="5" y="5" width="45" height="28" rx="3" fill="#020617"/>
    <!-- EKG Wave Line -->
    <path d="M8 19 L18 19 L22 10 L26 26 L30 14 L34 19 L47 19" fill="none" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)"/>
    <!-- Status LED -->
    <circle cx="10" cy="37" r="1.5" fill="#10b981"/>
    <circle cx="16" cy="37" r="1.5" fill="#64748b"/>
  </g>

  <!-- Hospital Bed & Patient -->
  <!-- Bed frame & Mattress -->
  <path d="M50 175 L190 175 L200 205 L40 205 Z" fill="#334155"/>
  <rect x="45" y="150" width="150" height="30" rx="6" fill="#f8fafc"/>
  <path d="M45 150 L85 150 L85 180 L45 180 Z" fill="#e2e8f0"/> <!-- Pillow area -->

  <!-- Patient Character (Unconscious / 昏迷) -->
  <g transform="translate(70, 125)">
    <!-- Blanket covering body -->
    <path d="M10 35 Q60 25 110 35 L120 55 L0 55 Z" fill="#38bdf8" opacity="0.9"/>
    <path d="M10 35 Q60 25 110 35 L115 50 L5 50 Z" fill="#bae6fd"/>

    <!-- Head & Face (Sleeping peacefully, eyes closed) -->
    <circle cx="25" cy="20" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M12 18 Q15 5 28 8 Q38 10 38 20 L33 20 Q33 12 25 11 Q17 11 15 20 Z" fill="#334155"/>
    <!-- Closed Eyes (peaceful arcs representing unconsciousness) -->
    <path d="M19 21 Q22 24 25 21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M28 21 Q31 24 34 21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Soft cheek flush -->
    <circle cx="23" cy="25" r="2.5" fill="#fca5a5" opacity="0.6"/>

    <!-- Arm connected to IV -->
    <path d="M38 30 L48 38 L44 42" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- IV Tube connection -->
    <path d="M-25 -30 Q 15 0 45 38" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Attending Doctor / Medical Staff checking on patient -->
  <g transform="translate(115, 95)">
    <!-- Body / White Coat -->
    <path d="M20 30 L45 30 L55 95 L10 95 Z" fill="#f8fafc"/>
    <!-- Coat lapels -->
    <path d="M28 30 L37 60 L45 30" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Stethoscope -->
    <path d="M32 30 Q32 38 27 45 Q22 52 25 58" fill="none" stroke="#475569" stroke-width="2"/>
    <circle cx="25" cy="59" r="3" fill="#94a3b8"/>

    <!-- Head -->
    <circle cx="32" cy="18" r="11" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M21 16 Q32 2 43 16 Q32 9 21 16 Z" fill="#475569"/>
    <!-- Concerned/Focused Expression -->
    <circle cx="28" cy="18" r="1" fill="#334155"/>
    <circle cx="36" cy="18" r="1" fill="#334155"/>
    <path d="M30 24 Q32 22 34 24" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Clipboard in hand -->
    <rect x="42" y="45" width="16" height="22" rx="2" fill="#94a3b8"/>
    <rect x="44" y="48" width="12" height="16" fill="#f8fafc"/>
    <line x1="47" y1="52" x2="53" y2="52" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="47" y1="56" x2="51" y2="56" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Floor and Ambient Lighting Details -->
  <path d="M0 205 L240 205 L240 240 L0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="205" x2="240" y2="205" stroke="#334155" stroke-width="2"/>

  <!-- Subtle ambient glow highlights -->
  <circle cx="160" cy="130" r="30" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>
</svg>