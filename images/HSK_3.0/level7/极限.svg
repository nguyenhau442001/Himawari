<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="trackGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Stadium / Running Track Environment -->
  <!-- Background Stadium Lights & Bleachers -->
  <path d="M 20 120 L 220 120 L 230 150 L 10 150 Z" fill="#1b263b" opacity="0.6"/>
  <!-- Light beam -->
  <polygon points="120,20 60,120 180,120" fill="url(#glowGrad)"/>
  <circle cx="120" cy="18" r="8" fill="#fbbf24" opacity="0.9"/>

  <!-- Running Track Surface -->
  <rect x="0" y="150" width="240" height="90" fill="#090d16"/>
  <!-- Track lane lines -->
  <path d="M 0 170 Q 120 160 240 170" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="8 4"/>
  <path d="M 0 195 Q 120 185 240 195" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 0 220 Q 120 210 240 220" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="8 4"/>

  <!-- Exhaustion / Speed Lines (Contextual) -->
  <line x1="160" y1="140" x2="130" y2="140" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="170" y1="155" x2="140" y2="155" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="170" x2="125" y2="170" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Main Subject: Exhausted Runner Reaching Physical Limit -->
  <g transform="translate(10, 0)">
    <!-- Sweat drops flying off -->
    <circle cx="95" cy="120" r="2" fill="#38bdf8"/>
    <circle cx="85" cy="128" r="3" fill="#38bdf8"/>
    <circle cx="78" cy="122" r="1.5" fill="#38bdf8"/>

    <!-- Back Leg (Stretching back) -->
    <path d="M 105 165 L 80 205 L 65 210" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Back Shoe -->
    <path d="M 60 210 L 70 215 L 75 210 Z" fill="#ef4444"/>

    <!-- Body Torso (Leaning heavily forward, showing extreme fatigue) -->
    <path d="M 100 130 L 125 170 L 105 180 L 85 145 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Runner Number Tag on Shirt -->
    <rect x="98" y="152" width="16" height="12" rx="2" fill="#f8fafc"/>

    <!-- Front Leg (Heavy step forward) -->
    <path d="M 115 175 L 140 195 L 155 208" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front Shoe -->
    <path d="M 150 206 L 165 212 L 162 202 Z" fill="#ef4444"/>

    <!-- Back Arm (Pumping backward) -->
    <path d="M 100 135 L 75 155 L 70 170" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="70" cy="172" r="3.5" fill="#fca5a5"/>

    <!-- Front Arm (Reaching forward, palms open, drained of energy) -->
    <path d="M 120 138 L 145 150 L 158 150" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="160" cy="150" r="3.5" fill="#fca5a5"/>

    <!-- Head & Face (Heavy panting, closed/strained eyes, dropping sweat) -->
    <path d="M 115 115 C 110 110 115 100 125 102 C 132 103 138 110 135 118 Z" fill="#fca5a5"/>
    <!-- Hair -->
    <path d="M 113 110 C 112 103 120 98 128 100 C 122 103 120 108 123 114 Z" fill="#334155"/>
    <!-- Strained / Closed Eyes (X or angled lines for exhaustion) -->
    <line x1="124" y1="108" x2="130" y2="111" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Panting Open Mouth -->
    <path d="M 131 114 C 133 114 135 116 133 118 C 131 120 128 118 131 114 Z" fill="#7f1d1d"/>
  </g>

  <!-- Finish Line Ribbon (Symbolizing the breaking point / limit) -->
  <g transform="translate(160, 110)">
    <!-- Vertical support pole -->
    <rect x="0" y="10" width="6" height="60" fill="#94a3b8"/>
    <!-- Snapped or tight finish ribbon -->
    <path d="M -90 35 C -50 32 -20 38 0 35" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Ribbon texture/shadow -->
    <path d="M -90 37 C -50 34 -20 40 0 37" stroke="#d97706" stroke-width="3" fill="none"/>
  </g>

  <!-- Visual indicator of Maximum / Limit state -->
  <!-- Subtle glowing pulse around the runner to emphasize the climax/limit -->
  <circle cx="120" cy="150" r="65" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.3"/>
</svg>