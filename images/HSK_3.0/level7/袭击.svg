<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion Trails (Speed/Suddenness) -->
  <path d="M40 110 L90 105 L85 115 Z" fill="#F59E0B" opacity="0.6"/>
  <path d="M35 135 L95 125 L90 140 Z" fill="#F59E0B" opacity="0.8"/>
  <path d="M50 160 L100 145 L95 155 Z" fill="#F59E0B" opacity="0.4"/>

  <!-- Victim (The one being attacked) -->
  <g transform="translate(165, 100)">
    <!-- Head -->
    <circle cx="20" cy="0" r="10" fill="#94A3B8"/>
    <!-- Body (Leaning back in surprise) -->
    <path d="M20 12 Q25 40 35 70" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <!-- Arms (Raised in shock) -->
    <path d="M15 25 L-5 5" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 25 L45 10" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M35 70 L50 100" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <path d="M35 70 L20 100" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Attacker (The one performing 袭击) -->
  <g transform="translate(60, 90)">
    <!-- Head (Leaning forward) -->
    <circle cx="55" cy="5" r="10" fill="#475569"/>
    <!-- Body (Dynamic lunging pose) -->
    <path d="M55 15 L20 45 L-10 85" stroke="#475569" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Arms (Reaching forward/striking) -->
    <path d="M45 25 L95 20" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <path d="M45 35 L85 45" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <!-- Front Leg -->
    <path d="M20 45 L50 85" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Impact/Surprise Flash -->
  <path d="M145 100 L155 85 L165 100 L180 105 L165 110 L155 125 L145 110 L130 105 Z" fill="#F59E0B"/>
  
  <!-- Additional Sharp Motion Accents -->
  <line x1="100" y1="110" x2="135" y2="105" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="130" x2="130" y2="125" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
</svg>