<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="curtainLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701a2e"/>
      <stop offset="70%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <linearGradient id="curtainRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#701a2e"/>
      <stop offset="70%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <linearGradient id="carpetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Architecture & Spotlight -->
  <circle cx="120" cy="100" r="90" fill="url(#spotlight)"/>

  <!-- Pillars -->
  <rect x="22" y="20" width="16" height="135" fill="#334155" opacity="0.5" rx="2"/>
  <rect x="202" y="20" width="16" height="135" fill="#334155" opacity="0.5" rx="2"/>
  <path d="M20,20 H40 M20,25 H40 M202,20 H222 M202,25 H222" stroke="#475569" stroke-width="1.5"/>

  <!-- Diplomatic Crest on Back Wall -->
  <g transform="translate(120, 52)" opacity="0.4">
    <circle r="18" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 1.5"/>
    <circle r="14" fill="none" stroke="#fbbf24" stroke-width="0.8"/>
    <!-- Laurel Wreath -->
    <path d="M-10,6 C-14,0 -10,-8 -3,-11 M10,6 C14,0 10,-8 3,-11" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Star -->
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" fill="#fbbf24"/>
  </g>

  <!-- Background Flags -->
  <!-- Left Flag (Host Country) -->
  <line x1="58" y1="45" x2="58" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58,48 C48,52 42,50 34,54 V90 C42,86 48,88 58,84 Z" fill="#1e3a8a" opacity="0.8"/>
  <circle cx="58" cy="45" r="2.5" fill="url(#goldAccent)"/>
  
  <!-- Right Flag (Visiting Country) -->
  <line x1="182" y1="45" x2="182" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M182,48 C192,52 198,50 206,54 V90 C198,86 192,88 182,84 Z" fill="#047857" opacity="0.8"/>
  <circle cx="182" cy="45" r="2.5" fill="url(#goldAccent)"/>

  <!-- Grand Drapes / Curtains -->
  <path d="M0,0 Q30,15 22,90 Q15,130 0,140 Z" fill="url(#curtainLeft)"/>
  <path d="M0,0 L35,0 Q25,45 0,65 Z" fill="#4c0519" opacity="0.6"/>
  <!-- Tassel Left -->
  <path d="M18,90 C22,92 25,98 22,102" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <path d="M240,0 Q210,15 218,90 Q225,130 240,140 Z" fill="url(#curtainRight)"/>
  <path d="M240,0 L205,0 Q215,45 240,65 Z" fill="#4c0519" opacity="0.6"/>
  <!-- Tassel Right -->
  <path d="M222,90 C218,92 215,98 218,102" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Floor & Red Carpet -->
  <polygon points="0,150 240,150 240,240 0,240" fill="#0f172a"/>
  <!-- Wooden Floor Perspective Lines -->
  <line x1="20" y1="150" x2="0" y2="210" stroke="#1e293b" stroke-width="1"/>
  <line x1="220" y1="150" x2="240" y2="210" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Red Carpet Runner -->
  <polygon points="75,150 165,150 185,240 55,240" fill="url(#carpetGrad)"/>
  <polygon points="75,150 78,150 59,240 55,240" fill="#fbbf24"/>
  <polygon points="165,150 162,150 181,240 185,240" fill="#fbbf24"/>

  <!-- Character Shadows -->
  <ellipse cx="80" cy="216" rx="18" ry="5" fill="#020617" opacity="0.6"/>
  <ellipse cx="138" cy="216" rx="16" ry="5" fill="#020617" opacity="0.6"/>
  <ellipse cx="178" cy="212" rx="14" ry="4" fill="#020617" opacity="0.5"/>

  <!-- ================= CHARACTERS ================= -->

  <!-- 1. DELEGATION MEMBER (Far Right Background) -->
  <g id="delegate-member" filter="url(#dropShadow)">
    <!-- Body/Suit -->
    <path d="M166,140 L190,140 L194,210 L163,210 Z" fill="#1e293b"/>
    <!-- Suit Jacket -->
    <path d="M166,140 C173,138 183,138 190,140 L192,180 L164,180 Z" fill="#334155"/>
    <path d="M175,140 L179,165 L183,140" fill="#f8fafc"/>
    <path d="M178,145 L180,165" fill="#0284c7" stroke="#0284c7" stroke-width="1.5"/> <!-- Tie -->
    <!-- Head -->
    <circle cx="178" cy="126" r="7.5" fill="#f87171"/>
    <!-- Hair -->
    <path d="M170,125 C170,118 186,118 186,125 C186,121 170,121 170,125 Z" fill="#0f172a"/>
    <!-- Portfolio held -->
    <rect x="162" y="160" width="12" height="16" rx="1.5" fill="#78350f" transform="rotate(15 162 160)"/>
    <rect x="163" y="161" width="10" height="3" fill="#fbbf24" transform="rotate(15 162 160)"/>
  </g>

  <!-- 2. FOREIGN DELEGATE LEADER (Center Right) -->
  <g id="foreign-leader" filter="url(#dropShadow)">
    <!-- Legs -->
    <path d="M128,175 L136,216 H143 L136,175 Z" fill="#0f172a"/>
    <path d="M140,175 L147,216 H154 L146,175 Z" fill="#1e293b"/>
    <!-- Shoes -->
    <ellipse cx="138" cy="216" rx="5" ry="2" fill="#020617"/>
    <ellipse cx="150" cy="216" rx="5" ry="2" fill="#020617"/>
    
    <!-- Torso & Jacket -->
    <path d="M128,128 C138,124 154,126 158,130 L153,178 L126,175 Z" fill="#1e3a8a"/>
    <!-- Shirt & Golden Tie -->
    <polygon points="136,127 142,127 144,150 138,150" fill="#f8fafc"/>
    <polygon points="139,130 142,130 143,148 140,148" fill="#f59e0b"/>
    <!-- Jacket Lapels -->
    <path d="M129,128 L138,155 L142,127" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    
    <!-- Head -->
    <circle cx="140" cy="113" r="8.5" fill="#fbcfe8"/> <!-- Skin tone -->
    <!-- Hair (Neat dark hair) -->
    <path d="M131,112 C131,103 149,103 149,110 C145,106 135,106 131,112 Z" fill="#1e1b4b"/>
    <!-- Face Profile / Smile -->
    <path d="M134,115 Q132,116 134,118" fill="none" stroke="#9d174d" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Left Arm (Reaching for Handshake) -->
    <path d="M130,134 L114,144 L106,143" fill="none" stroke="#1e3a8a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <path d="M106,143 L100,142" fill="none" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 3. THE PRESIDENT (Left) -->
  <g id="president" filter="url(#dropShadow)">
    <!-- Legs -->
    <path d="M72,175 L70,216 H77 L81,175 Z" fill="#0f172a"/>
    <path d="M83,175 L84,216 H91 L88,175 Z" fill="#1e293b"/>
    <!-- Shoes -->
    <ellipse cx="73" cy="216" rx="5" ry="2" fill="#020617"/>
    <ellipse cx="88" cy="216" rx="5" ry="2" fill="#020617"/>

    <!-- Torso & Elegant Dark Suit -->
    <path d="M68,126 C74,122 92,124 98,130 L94,178 L68,175 Z" fill="#0f172a"/>
    <!-- White Shirt & Red Diplomatic Tie -->
    <polygon points="78,125 84,125 85,152 79,152" fill="#ffffff"/>
    <polygon points="80,128 83,128 84,150 81,150" fill="#be123c"/>
    <!-- Presidential Lapel & Gold Pin -->
    <path d="M69,126 L79,155 L83,125" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="73" cy="140" r="1" fill="#fbbf24"/> <!-- Lapel Pin -->

    <!-- Head -->
    <circle cx="81" cy="111" r="8.5" fill="#fed7aa"/> <!-- Skin tone -->
    <!-- Hair (Distinguished Graying Hair) -->
    <path d="M72,111 C72,101 90,101 90,109 C86,104 75,104 72,111 Z" fill="#64748b"/>
    <path d="M72,111 C73,107 77,105 80,105" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <!-- Eye & Friendly Smile -->
    <circle cx="84" cy="110" r="0.8" fill="#431407"/>
    <path d="M83,115 Q86,117 87,114" fill="none" stroke="#431407" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Right Arm Extended for Handshake -->
    <path d="M88,132 L98,141 L104,142" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88,132 L98,141 L104,142" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <path d="M104,142 L108,142" fill="none" stroke="#fed7aa" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Left Arm Behind Back (Dignified Pose) -->
    <path d="M70,132 L63,150 L68,155" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- HANDSHAKE CLASP & GLOW DETAIL -->
  <!-- Clasp Overlay -->
  <path d="M101,140 C103,138 107,138 109,141 C107,144 103,145 101,140 Z" fill="#fed7aa"/>
  
  <!-- Warm Flash / Golden Sparkle (Symbolizing Agreement/Warm Welcome) -->
  <g transform="translate(105, 140)">
    <circle r="6" fill="#fbbf24" opacity="0.3"/>
    <path d="M-8,0 L8,0 M0,-8 L0,8 M-5,-5 L5,5 M-5,5 L5,-5" stroke="#fff" stroke-width="0.8" opacity="0.9"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- Foreground Ambient Framing -->
  <!-- Subtle Vignette Edge -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
</svg>