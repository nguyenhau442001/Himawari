<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mountains in distance -->
  <path d="M0 160 L40 100 L80 140 L120 90 L160 130 L200 80 L240 120 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Border Fence -->
  <rect x="0" y="150" width="240" height="4" fill="#64748b"/>
  <rect x="20" y="140" width="4" height="30" fill="#94a3b8"/>
  <rect x="80" y="140" width="4" height="30" fill="#94a3b8"/>
  <rect x="140" y="140" width="4" height="30" fill="#94a3b8"/>
  <rect x="200" y="140" width="4" height="30" fill="#94a3b8"/>
  
  <!-- Guard Booth -->
  <rect x="160" y="130" width="50" height="60" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="165" y="135" width="40" height="20" fill="#38bdf8" fill-opacity="0.3"/>
  
  <!-- Character -->
  <g transform="translate(185, 150)">
    <!-- Body -->
    <rect x="-10" y="0" width="20" height="35" rx="4" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="12" fill="#fde68a"/>
    <!-- Arm -->
    <path d="M-10 10 L-25 20" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Clipboard -->
    <rect x="-35" y="15" width="15" height="20" fill="#e2e8f0"/>
  </g>
  
  <!-- Ground/Foreground -->
  <path d="M0 240 L240 240 L240 180 L0 180 Z" fill="#0f172a"/>
  
  <!-- Spotlight/Atmosphere -->
  <circle cx="185" cy="160" r="40" fill="#fbbf24" fill-opacity="0.05"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="2" fill="#f8fafc"/>
  <circle cx="100" cy="30" r="3" fill="#f8fafc"/>
  <circle cx="200" cy="60" r="2" fill="#f8fafc"/>
</svg>