<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="curtainLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <linearGradient id="curtainRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#500724" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stage Lighting & Background Environment -->
  <circle cx="120" cy="90" r="90" fill="url(#stageGlow)" />
  <polygon points="120,20 20,200 60,200" fill="url(#beam1)" />
  <polygon points="120,20 180,200 220,200" fill="url(#beam1)" />

  <!-- Stage Curtains -->
  <path d="M0,0 L35,0 C25,60 45,120 20,180 L0,200 Z" fill="url(#curtainLeft)" />
  <path d="M240,0 L205,0 C215,60 195,120 220,180 L240,200 Z" fill="url(#curtainRight)" />

  <!-- Wooden Stage Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" />
  <path d="M0,180 L240,180 L240,195 L0,195 Z" fill="#334155" />
  <line x1="0" y1="187" x2="240" y2="187" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Wooden Stage Planks Lines -->
  <line x1="60" y1="195" x2="40" y2="240" stroke="#0f172a" stroke-width="2" />
  <line x1="150" y1="195" x2="170" y2="240" stroke="#0f172a" stroke-width="2" />
  <line x1="200" y1="195" x2="230" y2="240" stroke="#0f172a" stroke-width="2" />

  <!-- Microphone Stand -->
  <path d="M120,190 L120,95" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <circle cx="120" cy="92" r="5" fill="#cbd5e1" />
  <path d="M105,210 C105,200 135,200 135,210" fill="#64748b" />
  <ellipse cx="120" cy="210" rx="16" ry="4" fill="#475569" />

  <!-- Nervous Character (Main Subject) -->
  <g transform="translate(0, 5)">
    <!-- Shadow beneath feet -->
    <ellipse cx="120" cy="183" rx="22" ry="5" fill="#020617" opacity="0.6" />

    <!-- Body / Suit / Torso -->
    <path d="M104,130 L136,130 L142,178 L98,178 Z" fill="#3b82f6" />
    <!-- White shirt collar -->
    <polygon points="120,130 112,142 128,142" fill="#f8fafc" />
    <!-- Red tie -->
    <polygon points="120,142 117,165 120,172 123,165" fill="#ef4444" />

    <!-- Shaking / Nervous Posture: Slightly hunched shoulders -->
    <path d="M98,132 C92,132 85,145 92,155" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M142,132 C148,132 155,145 148,155" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Hands clasped nervously in front -->
    <circle cx="120" cy="158" r="8" fill="#fbcfe8" />
    <path d="M113,156 Q120,165 127,156" stroke="#db2777" stroke-width="2" fill="none" />

    <!-- Legs -->
    <rect x="108" y="175" width="8" height="12" fill="#1e293b" />
    <rect x="124" y="175" width="8" height="12" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="106" cy="187" rx="7" ry="3" fill="#0f172a" />
    <ellipse cx="134" cy="187" rx="7" ry="3" fill="#0f172a" />

    <!-- Head & Face (Timids expression) -->
    <circle cx="120" cy="105" r="20" fill="#fbcfe8" />
    
    <!-- Hair -->
    <path d="M100,105 C100,90 110,83 120,83 C130,83 140,90 140,105 C135,97 125,95 120,96 C115,95 105,97 100,105 Z" fill="#334155" />

    <!-- Sweaty Drop (Anxiety indicator) -->
    <path d="M136,98 C136,98 141,104 141,107 C141,110 138,112 136,112 C134,112 131,110 131,107 C131,104 136,98 136,98 Z" fill="#38bdf8" opacity="0.8" />

    <!-- Wide, fearful eyes -->
    <circle cx="112" cy="105" r="3.5" fill="#ffffff" />
    <circle cx="128" cy="105" r="3.5" fill="#ffffff" />
    <circle cx="113" cy="105" r="1.5" fill="#0f172a" />
    <circle cx="127" cy="105" r="1.5" fill="#0f172a" />

    <!-- Worried Eyebrows -->
    <line x1="108" y1="99" x2="116" y2="101" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="124" y1="101" x2="132" y2="99" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Nervous Mouth (slight wobble/small open mouth) -->
    <path d="M117,114 Q120,111 123,114" stroke="#9f1239" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Blushing Cheeks -->
    <circle cx="108" cy="110" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="132" cy="110" r="3" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Floating atmosphere dust/sparkles -->
  <circle cx="70" cy="80" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="170" cy="70" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="95" cy="50" r="1" fill="#fbbf24" opacity="0.7" />
  <circle cx="150" cy="110" r="1.5" fill="#fbbf24" opacity="0.5" />
</svg>