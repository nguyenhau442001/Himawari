<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow behind the nail and wood -->
  <circle cx="120" cy="120" r="70" fill="#3A4454" opacity="0.2" filter="blur(10px)"/>

  <!-- Wooden Plank Background (Context reference) -->
  <g transform="rotate(-15, 120, 120)">
    <!-- Main wood body -->
    <rect x="70" y="50" width="100" height="140" rx="6" fill="#8B5A2B" stroke="#5C3A21" stroke-width="3"/>
    <!-- Wood grain / texture lines -->
    <path d="M85 70 Q 110 90, 85 110" stroke="#704722" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M150 120 Q 120 145, 150 170" stroke="#704722" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M95 150 Q 130 160, 110 190" stroke="#704722" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M130 60 Q 150 80, 135 100" stroke="#704722" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- The Nail (钉子 - Dīngzi) embedded at an angle matching the wood -->
  <g transform="rotate(-15, 120, 120)">
    <!-- Nail shaft going into the wood (darker lower part for depth) -->
    <path d="M116 110 L124 110 L122 155 L118 155 Z" fill="#687385"/>

    <!-- Main Nail Shaft -->
    <rect x="116" y="65" width="8" height="60" fill="#9AA4B2" rx="1"/>
    
    <!-- Nail Shaft Highlight (Metallic sheen) -->
    <rect x="117.5" y="65" width="2" height="60" fill="#CFD7E6" opacity="0.8"/>

    <!-- Sharp Tip -->
    <path d="M116 125 L124 125 L120 148 Z" fill="#818C99"/>
    <path d="M120.5" fill="#B0BEC5"/>

    <!-- Nail Head (Flat, wide cap viewed in perspective) -->
    <ellipse cx="120" cy="63" rx="14" ry="5" fill="#B0BEC5" stroke="#687385" stroke-width="1"/>
    <ellipse cx="120" cy="62" rx="12" ry="3.5" fill="#CFD7E6"/>
    <!-- Highlight on nail head -->
    <ellipse cx="117" cy="61.5" rx="5" ry="1.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Focus accent spark / modern vector polish -->
  <g transform="translate(132, 68)">
    <path d="M0 4 L8 4 M4 0 L4 8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="4" cy="4" r="5" fill="#F59E0B" opacity="0.3" filter="blur(2px)"/>
  </g>
</svg>