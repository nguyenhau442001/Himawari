<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" fill="url(#lampGlow)" />

  <!-- Background Environment / Living Room Setting -->
  <!-- Wallpaper subtle paneling -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2" />
  
  <!-- Bookshelf in background -->
  <rect x="25" y="60" width="45" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="95" x2="70" y2="95" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="130" x2="70" y2="130" stroke="#334155" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="32" y="75" width="8" height="20" rx="1" fill="#f59e0b" />
  <rect x="42" y="72" width="6" height="23" rx="1" fill="#38bdf8" />
  <rect x="50" y="78" width="12" height="17" rx="1" fill="#10b981" />
  <rect x="33" y="105" width="10" height="25" rx="1" fill="#ec4899" />
  <rect x="45" y="110" width="14" height="20" rx="1" fill="#fb923c" />

  <!-- House Plant -->
  <path d="M195,170 L205,170 L202,135 L198,135 Z" fill="#64748b" />
  <path d="M200,135 C180,120 180,95 200,85 C220,95 220,120 200,135 Z" fill="#10b981" />
  <path d="M200,135 C175,140 165,120 185,105 C185,125 195,133 200,135 Z" fill="#059669" />

  <!-- Floor / Rug -->
  <ellipse cx="120" cy="190" rx="90" ry="25" fill="#334155" opacity="0.5" />

  <!-- Furniture: Sofa / Armchair back -->
  <path d="M75,115 Q120,105 165,115 L170,175 Q120,185 70,175 Z" fill="#475569" />

  <!-- CHARACTER 1: Sitting on armchair (The one being lectured / who left without saying anything) -->
  <!-- Body/Torso -->
  <path d="M85,130 Q100,125 115,130 L110,165 Q100,170 90,165 Z" fill="#38bdf8" />
  <!-- Head -->
  <circle cx="100" cy="110" r="14" fill="#fed7aa" />
  <!-- Hair (Messy/Casual) -->
  <path d="M88,105 Q95,94 112,102 Q108,110 100,108 Z" fill="#1e293b" />
  <!-- Posture / Expression: looking slightly down, apologetic -->
  <circle cx="95" cy="108" r="1.5" fill="#1e293b" />
  <!-- Mouth: small concerned line -->
  <path d="M96,116 Q99,114 102,116" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- CHARACTER 2: Standing (The speaker, gesturing "You should have at least said something") -->
  <g filter="url(#softShadow)">
    <!-- Standing Body (Torso in orange-red accent sweater) -->
    <path d="M130,95 Q145,90 160,95 L165,170 L135,170 Z" fill="#f43f5e" />
    
    <!-- Head -->
    <circle cx="145" cy="72" r="15" fill="#fed7aa" />
    
    <!-- Hair (Neat, expressive side part) -->
    <path d="M132,70 Q140,55 158,65 Q158,72 155,75 Q140,65 132,70 Z" fill="#334155" />

    <!-- Face Expression: Serious, firm, explaining/reminding -->
    <!-- Eyebrows (slightly angled down for emphasis) -->
    <line x1="138" y1="68" x2="145" y2="70" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="150" y1="70" x2="157" y2="68" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="141" cy="73" r="1.5" fill="#1e293b" />
    <circle cx="152" cy="73" r="1.5" fill="#1e293b" />
    <!-- Mouth: speaking/open slightly -->
    <path d="M144,80 Q147,84 150,80" fill="#1e293b" />

    <!-- Arms & Gestures (Crucial for "should have told me" action) -->
    <!-- Left arm akimbo / hand on hip -->
    <path d="M132,100 L120,125 L132,130" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="120" cy="125" r="5" fill="#fed7aa" />

    <!-- Right arm gesturing forward/pointing index finger to emphasize "At least..." -->
    <path d="M158,98 Q175,100 185,115" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hand pointing/gesturing open palm or finger -->
    <circle cx="185" cy="115" r="5.5" fill="#fed7aa" />
    <!-- Pointing index finger -->
    <path d="M188,113 L197,110" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" />

    <!-- Legs (Standing) -->
    <path d="M140,170 L140,205" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <path d="M158,170 L158,205" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="138" cy="208" rx="7" ry="3" fill="#0f172a" />
    <ellipse cx="160" cy="208" rx="7" ry="3" fill="#0f172a" />
  </g>

  <!-- Context Prop: Table with coffee/tea cups and an open notebook (showing communication/discussion) -->
  <path d="M85,155 L165,155 L175,185 L75,185 Z" fill="#cbd5e1" opacity="0.9" />
  <!-- Table legs -->
  <line x1="85" y1="185" x2="80" y2="210" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="165" y1="185" x2="170" y2="210" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

  <!-- Coffee Mug on Table -->
  <rect x="105" y="160" width="12" height="14" rx="2" fill="#ffffff" />
  <path d="M117,163 C121,163 121,171 117,171" stroke="#ffffff" stroke-width="2" fill="none" />
  <!-- Steam lines rising gently -->
  <path d="M109,155 Q111,150 109,145" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Open notebook on table -->
  <polygon points="130,165 155,163 158,175 133,178" fill="#ffffff" />
  <line x1="143" y1="164" x2="145" y2="176" stroke="#cbd5e1" stroke-width="1" />
  <line x1="135" y1="169" x2="150" y2="167" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
  <line x1="136" y1="173" x2="148" y2="171" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

  <!-- Ambient light accent (top right) -->
  <circle cx="210" cy="40" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="195" cy="55" r="1.5" fill="#fbbf24" opacity="0.4" />
</svg>