<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 40 L-35 80 M20 40 L35 80" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
    <path d="M-25 0 L25 0 L20 40 L-20 40 Z" fill="#FFB800"/>
    
    <!-- Head -->
    <circle cx="0" cy="-30" r="35" fill="#FFB800"/>
    
    <!-- Hair (Wild/Crazy style) -->
    <path d="M-30 -50 C-40 -80 -10 -90 0 -80 C10 -90 40 -80 30 -50" fill="none" stroke="#FFB800" stroke-width="6" stroke-linecap="round"/>
    <path d="M-20 -60 C-30 -90 0 -100 10 -90" fill="none" stroke="#FFB800" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Eyes (Wide/Crazy) -->
    <circle cx="-12" cy="-35" r="6" fill="#1A1D24"/>
    <circle cx="12" cy="-35" r="6" fill="#1A1D24"/>
    
    <!-- Mouth (Wide open) -->
    <ellipse cx="0" cy="-15" rx="8" ry="12" fill="#1A1D24"/>
    
    <!-- Arms (Raised in excitement) -->
    <path d="M-25 -10 L-50 -40" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 -10 L50 -40" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Motion lines -->
    <path d="M-60 -50 Q-70 -30 -60 -10" stroke="#FFB800" stroke-width="3" fill="none"/>
    <path d="M60 -50 Q70 -30 60 -10" stroke="#FFB800" stroke-width="3" fill="none"/>
  </g>
</svg>