<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Interior Wall & Background Props -->
  <g id="environment">
    <!-- Window with night city view -->
    <rect x="145" y="25" width="65" height="85" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="30" width="55" height="75" fill="url(#windowGlow)"/>
    <!-- City silhouettes outside -->
    <path d="M150 95 L150 75 L160 75 L160 95 Z M165 95 L165 55 L178 55 L178 95 Z M182 95 L182 65 L195 65 L195 95 Z" fill="#334155" opacity="0.6"/>
    <!-- Window pane lines -->
    <line x1="177" y1="30" x2="177" y2="105" stroke="#475569" stroke-width="1.5"/>
    <line x1="150" y1="67" x2="205" y2="67" stroke="#475569" stroke-width="1.5"/>

    <!-- Bookshelf on back wall -->
    <rect x="25" y="30" width="45" height="60" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="50" x2="70" y2="50" stroke="#334155" stroke-width="2"/>
    <line x1="25" y1="75" x2="70" y2="75" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="30" y="38" width="6" height="12" fill="#f43f5e" rx="1"/>
    <rect x="38" y="35" width="8" height="15" fill="#38bdf8" rx="1"/>
    <rect x="48" y="40" width="5" height="10" fill="#fbbf24" rx="1"/>
    <rect x="30" y="60" width="7" height="15" fill="#10b981" rx="1"/>
    <rect x="39" y="62" width="6" height="13" fill="#a855f7" rx="1"/>

    <!-- Hanging lamp casting warm light -->
    <path d="M95 10 L105 10 L102 25 L98 25 Z" fill="#64748b"/>
    <path d="M85 25 L115 25 L125 45 L75 45 Z" fill="#475569"/>
    <!-- Light cone -->
    <polygon points="100,45 40,160 160,160" fill="url(#lightCone)" pointer-events="none"/>
  </g>

  <!-- Office Desk -->
  <g id="desk" filter="url(#shadow)">
    <!-- Desk surface -->
    <path d="M15 130 L225 130 L210 165 L30 165 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Desk front panel -->
    <rect x="30" y="165" width="180" height="45" fill="#0f172a" opacity="0.8"/>
    
    <!-- Props on desk: Messy papers, file folders (representing "responsibility/tasks") -->
    <!-- Folder 1: Open / chaotic -->
    <path d="M45 145 L75 138 L80 152 L50 159 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="52" y1="147" x2="68" y2="143" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="53" y1="151" x2="65" y2="147" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/> <!-- Red warning mark -->

    <!-- Folder 2: Stacked with red exclamation/problem tag -->
    <path d="M175 140 L205 135 L210 148 L180 153 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="185" y="139" width="12" height="8" fill="#ef4444" rx="1"/>
    
    <!-- Coffee mug -->
    <rect x="135" y="138" width="14" height="16" rx="2" fill="#38bdf8"/>
    <path d="M149 142 C154 142 154 150 149 152" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Characters (Two colleagues conspiring to sneak away / shirk duty) -->
  <g id="characters" filter="url(#shadow)">
    <!-- Character 1 (Left - Sneaky/Planning, whispering/pointing away) -->
    <g id="character-left">
      <!-- Body / Torso -->
      <path d="M65 135 L90 135 L95 180 L60 180 Z" fill="#2563eb"/> <!-- Blue shirt -->
      <!-- Head -->
      <circle cx="75" cy="110" r="15" fill="#fcd34d"/>
      <!-- Hair -->
      <path d="M60 110 C60 95 90 95 90 110 C85 105 65 105 60 110 Z" fill="#1e293b"/>
      <!-- Expression: Sly smile, sideways glance -->
      <path d="M78 114 Q83 117 86 113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <circle cx="73" cy="110" r="2" fill="#1e293b"/>
      <circle cx="83" cy="110" r="2" fill="#1e293b"/>
      <!-- Left arm sliding away / gesturing towards exit -->
      <path d="M65 140 L45 130 L40 135" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Hand pointing left (away from responsibility) -->
      <circle cx="38" cy="136" r="4" fill="#fcd34d"/>
      <!-- Right arm bent conspiratorially -->
      <path d="M85 140 L95 150 L85 155" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Character 2 (Right - Looking back nervously while backing away) -->
    <g id="character-right">
      <!-- Body / Torso -->
      <path d="M130 130 L155 135 L150 180 L120 175 Z" fill="#059669"/> <!-- Green blazer -->
      <!-- Head (turned back over shoulder) -->
      <circle cx="145" cy="105" r="14" fill="#ffedd5"/>
      <!-- Hair -->
      <path d="M133 100 C135 90 157 90 157 100 C155 98 135 98 133 100 Z" fill="#475569"/>
      <!-- Expression: Guilty / Anxious sideways glance -->
      <circle cx="142" cy="103" r="1.5" fill="#1e293b"/>
      <circle cx="150" cy="103" r="1.5" fill="#1e293b"/>
      <path d="M144 112 Q147 110 150 112" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Arm slipping behind back to hide escape -->
      <path d="M135 140 L120 155 L130 160" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Foreground details: Plant adding spatial depth -->
  <g id="foreground-plant">
    <!-- Pot -->
    <path d="M10 190 L26 190 L23 220 L13 220 Z" fill="#cbd5e1"/>
    <!-- Leaves -->
    <path d="M18 190 Q5 170 2 150 Q12 170 18 190 Z" fill="#10b981"/>
    <path d="M20 190 Q30 165 40 145 Q30 170 20 190 Z" fill="#059669"/>
    <path d="M15 190 Q5 180 -5 175 Q5 185 15 190 Z" fill="#34d399"/>
  </g>

  <!-- Subtle dramatic shadow casting over floor -->
  <path d="M30 165 L210 165 L225 240 L15 240 Z" fill="#000000" opacity="0.25" pointer-events="none"/>
</svg>