<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Window Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.03" />
    </linearGradient>

    <!-- Character 1 (Leader) Outfit Gradient -->
    <linearGradient id="leader-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Employee) Outfit Gradient -->
    <linearGradient id="emp-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Task Folder/Document Gradient -->
    <linearGradient id="folder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT & BACKGROUND DETAILS -->
  <!-- Office Wall / Window frame -->
  <rect x="25" y="20" width="80" height="70" rx="4" fill="url(#window-glow)" stroke="#334155" stroke-width="2" />
  <!-- Window Panes Grid -->
  <line x1="65" y1="20" x2="65" y2="90" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="55" x2="105" y2="55" stroke="#334155" stroke-width="2" />
  <!-- City silhouette outside window -->
  <path d="M30 90 L30 75 L38 75 L38 90 L45 90 L45 65 L55 65 L55 90 L68 90 L68 70 L78 70 L78 90 L90 90 L90 60 L100 60 L100 90 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Bookshelf in background -->
  <g opacity="0.4">
    <rect x="180" y="30" width="35" height="110" fill="#0f172a" rx="2" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="65" x2="215" y2="65" stroke="#334155" stroke-width="2" />
    <line x1="180" y1="100" x2="215" y2="100" stroke="#334155" stroke-width="2" />
    <!-- Books -->
    <rect x="185" y="45" width="6" height="20" fill="#38bdf8" rx="1"/>
    <rect x="193" y="42" width="5" height="23" fill="#fb923c" rx="1"/>
    <rect x="200" y="48" width="8" height="17" fill="#10b981" rx="1"/>
    <rect x="186" y="80" width="7" height="20" fill="#ec4899" rx="1"/>
    <rect x="195" y="82" width="10" height="18" fill="#facc15" rx="1"/>
  </g>

  <!-- Wall Clock -->
  <circle cx="140" cy="35" r="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <line x1="140" y1="35" x2="140" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="35" x2="147" y2="38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Desk Lamp & Light Effect -->
  <circle cx="190" cy="120" r="45" fill="url(#lamp-glow)" />
  <path d="M190 110 L175 145 L205 145 Z" fill="#475569" />
  <path d="M180 145 L200 145 L205 185 L175 185 Z" fill="#334155" />
  <path d="M185 105 C185 90 205 90 205 105" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

  <!-- MAIN DESK -->
  <rect x="20" y="175" width="200" height="12" rx="3" fill="#334155" filter="url(#shadow)" />
  <rect x="35" y="187" width="15" height="40" fill="#1e293b" />
  <rect x="190" y="187" width="15" height="40" fill="#1e293b" />

  <!-- Desk Props (Laptop, Coffee cup, Plant) -->
  <!-- Laptop -->
  <path d="M140 175 L180 175 L185 170 L135 170 Z" fill="#64748b" />
  <rect x="142" y="145" width="36" height="26" rx="2" fill="#475569" />
  <rect x="145" y="148" width="30" height="20" fill="#0f172a" />
  <!-- Coffee Cup -->
  <rect x="115" y="160" width="12" height="15" rx="2" fill="#cbd5e1" />
  <path d="M127 163 C131 163 131 170 127 172" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Small Desk Plant -->
  <rect x="45" y="162" width="10" height="13" rx="2" fill="#f43f5e" />
  <path d="M50 162 C45 150 35 150 40 140 C50 145 50 162 50 162 Z" fill="#10b981" />
  <path d="M50 162 C55 148 65 145 62 138 C52 143 50 162 50 162 Z" fill="#34d399" />


  <!-- CHARACTERS INTERACTION (Leader assigning task to Employee) -->

  <!-- CHARACTER 1: LEADER (Standing/Leaning, pointing to task folder) -->
  <g transform="translate(15, 0)">
    <!-- Body / Torso -->
    <path d="M65 110 C65 95 85 95 85 110 L90 160 L60 160 Z" fill="url(#leader-suit)" filter="url(#shadow)" />
    <!-- Shirt collar & tie -->
    <path d="M72 105 L75 118 L78 105 Z" fill="#ffffff" />
    <path d="M75 115 L74 135 L76 135 Z" fill="#ef4444" />
    <!-- Head & Hair -->
    <circle cx="75" cy="80" r="15" fill="#fbcfe8" /> <!-- Face base / skin -->
    <!-- Hair (Stylish modern neat cut) -->
    <path d="M60 80 C60 65 90 65 90 80 C90 83 88 80 85 75 C80 68 70 68 65 75 C62 79 60 80 60 80 Z" fill="#1e293b" />
    <!-- Facial expression: Confident, friendly smile -->
    <path d="M71 83 C73 86 77 86 79 83" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="70" cy="78" r="1.5" fill="#1e293b" />
    <circle cx="80" cy="78" r="1.5" fill="#1e293b" />
    <!-- Back Arm -->
    <path d="M62 110 L45 130 L50 135" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Arm (Pointing/Explaining gesture) -->
    <path d="M85 110 L105 125 L115 120" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="117" cy="119" r="4.5" fill="#fbcfe8" />
  </g>


  <!-- CHARACTER 2: EMPLOYEE (Sitting attentively, receiving task) -->
  <g transform="translate(10, 0)">
    <!-- Office Chair Back -->
    <rect x="95" y="105" width="24" height="65" rx="6" fill="#334155" />
    <!-- Chair Seat & Base -->
    <path d="M90 165 L128 165 L135 175 L83 175 Z" fill="#1e293b" />
    <line x1="108" y1="175" x2="108" y2="195" stroke="#475569" stroke-width="4" />
    <path d="M95 195 L121 195" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Body / Torso (Sitting) -->
    <path d="M90 120 C90 105 120 105 120 120 L125 168 L85 168 Z" fill="url(#emp-shirt)" filter="url(#shadow)" />
    <!-- Collar -->
    <path d="M100 115 L105 128 L110 115 Z" fill="#ffffff" />

    <!-- Head & Hair -->
    <circle cx="105" cy="85" r="14" fill="#fed7aa" />
    <!-- Hair (Wavy/Neat bob) -->
    <path d="M91 85 C91 68 119 68 119 85 C119 90 117 95 115 90 C110 80 100 80 95 90 C93 94 91 85 91 85 Z" fill="#7c2d12" />
    <!-- Facial expression: Attentive, focused, listening carefully -->
    <path d="M102 88 C104 90 108 90 110 88" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" />
    <circle cx="100" cy="83" r="1.5" fill="#7c2d12" />
    <circle cx="110" cy="83" r="1.5" fill="#7c2d12" />

    <!-- Front Arms resting on desk / holding document -->
    <path d="M95 130 L115 145 L130 145" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="132" cy="144" r="4" fill="#fed7aa" />
  </g>


  <!-- CENTRAL PROP: THE TASK (Folder & Documents being handed over) -->
  <g transform="translate(110, 130) rotate(-10)">
    <!-- Folder Base -->
    <rect x="0" y="0" width="36" height="28" rx="2" fill="url(#folder-grad)" filter="url(#shadow)" />
    <path d="M0 4 L12 4 L16 8 L36 8 L36 28 L0 28 Z" fill="#eab308" opacity="0.4" />
    <!-- Papers sticking out with mockup text lines (abstract representation of tasks) -->
    <rect x="4" y="-6" width="28" height="10" rx="1" fill="#ffffff" />
    <line x1="7" y1="-2" x2="22" y2="-2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="7" y1="2" x2="17" y2="2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Checkmark icon on document to signify "Task / Mission" -->
    <circle cx="26" cy="-1" r="3" fill="#10b981" />
    <path d="M24.5 -1 L25.5 0 L28.5 -3" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>