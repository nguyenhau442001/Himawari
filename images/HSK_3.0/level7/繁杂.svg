<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: Tangled, Overwhelming Bureaucratic Paperwork File / Folder System (representing "繁杂" - rườm rà phức tạp, bộn bề) -->
  <g transform="translate(0, 0)">
    <!-- Back chaotic floating papers/documents -->
    <g opacity="0.4" transform="rotate(-15 80 120)">
      <rect x="50" y="80" width="60" height="75" rx="4" fill="#2B313C"/>
      <line x1="60" y1="95" x2="90" y2="95" stroke="#6C7A9C" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="110" x2="100" y2="110" stroke="#6C7A9C" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="125" x2="80" y2="125" stroke="#6C7A9C" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g opacity="0.5" transform="rotate(20 160 110)">
      <rect x="130" y="70" width="60" height="75" rx="4" fill="#2B313C"/>
      <line x1="140" y1="85" x2="175" y2="85" stroke="#6C7A9C" stroke-width="4" stroke-linecap="round"/>
      <line x1="140" y1="100" x2="170" y2="100" stroke="#6C7A9C" stroke-width="4" stroke-linecap="round"/>
      <line x1="140" y1="115" x2="180" y2="115" stroke="#6C7A9C" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Overlapping messy folders -->
    <path d="M 65 95 L 95 95 L 105 105 L 175 105 C 180 105, 185 110, 185 115 L 185 185 C 185 190, 180 195, 175 195 L 65 195 C 60 195, 55 190, 55 185 L 55 105 C 55 100, 60 95, 65 95 Z" fill="#242B38" stroke="#3A4458" stroke-width="2"/>

    <!-- Main Central Tangled Bureaucracy Dossier / Folder Stack -->
    <!-- Document 2 (Middle layer) -->
    <g transform="rotate(-8 120 130)">
      <rect x="75" y="75" width="90" height="110" rx="6" fill="#2E3846"/>
      <path d="M 75 88 L 105 88 L 115 98 L 165 98" stroke="#48566E" stroke-width="3" fill="none"/>
      <!-- Text lines -->
      <line x1="90" y1="115" x2="150" y2="115" stroke="#6C7A9C" stroke-width="5" stroke-linecap="round"/>
      <line x1="90" y1="135" x2="135" y2="135" stroke="#6C7A9C" stroke-width="5" stroke-linecap="round"/>
      <line x1="90" y1="155" x2="145" y2="155" stroke="#6C7A9C" stroke-width="5" stroke-linecap="round"/>
      <!-- Red bureaucratic stamps indicating complexity -->
      <circle cx="135" cy="140" r="14" fill="none" stroke="#E05656" stroke-width="2.5" opacity="0.8"/>
      <line x1="126" y1="133" x2="144" y2="147" stroke="#E05656" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Document 1 (Top chaotic layer with bright focus accent gold/orange) -->
    <g transform="rotate(6 120 130)">
      <rect x="70" y="65" width="100" height="120" rx="6" fill="#354256" stroke="#4A5A75" stroke-width="2"/>
      <path d="M 70 80 L 100 80 L 110 90 L 170 90" stroke="#5D6F8C" stroke-width="3" fill="none"/>
      
      <!-- Tangled flow lines / administrative loops -->
      <path d="M 85 110 C 110 110, 110 140, 135 140 C 160 140, 160 110, 185 110" fill="none" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <path d="M 85 130 C 105 130, 120 160, 145 160 C 160 160, 165 140, 175 140" fill="none" stroke="#E28743" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

      <!-- Document lines -->
      <line x1="85" y1="180" x2="125" y2="180" stroke="#7A8BABA" stroke-width="4" stroke-linecap="round"/>

      <!-- Stamp -->
      <rect x="130" y="155" width="28" height="20" rx="3" fill="none" stroke="#E05656" stroke-width="2" transform="rotate(-12 144 165)"/>
      <line x1="133" y1="160" x2="155" y2="170" stroke="#E05656" stroke-width="2" transform="rotate(-12 144 165)"/>
    </g>

    <!-- Messy floating stamps & paperclips / red tape representing "rườm rà" -->
    <!-- Paperclip 1 -->
    <path d="M 165 55 C 165 50, 175 50, 175 55 L 175 75 C 175 80, 165 80, 165 75 Z" fill="none" stroke="#F6AD55" stroke-width="3" transform="rotate(35 170 65)"/>
    
    <!-- Red Tape / Ribbon tangled around -->
    <path d="M 45 140 Q 60 120, 75 135 T 105 150 T 135 125 T 170 145 T 200 130" fill="none" stroke="#E05656" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 50 155 Q 75 170, 95 145 T 145 165 T 190 150" fill="none" stroke="#E05656" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Additional scattered small notes/cards emphasizing "bộn bề" -->
    <rect x="45" y="115" width="22" height="28" rx="2" fill="#2B3444" transform="rotate(-25 56 129)" stroke="#43526A" stroke-width="1.5"/>
    <rect x="172" y="95" width="24" height="30" rx="2" fill="#2B3444" transform="rotate(18 184 110)" stroke="#43526A" stroke-width="1.5"/>
  </g>
</svg>