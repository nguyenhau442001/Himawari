<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Window with soft moonlight -->
  <rect x="160" y="40" width="50" height="80" rx="4" fill="#334155" opacity="0.5"/>
  <path d="M185 40 L185 120 M160 80 L210 80" stroke="#475569" stroke-width="2"/>
  
  <!-- Old Man Character -->
  <!-- Shoulders/Coat -->
  <path d="M60 220 C60 180, 180 180, 180 220" fill="#475569"/>
  
  <!-- Face: Emphasizing wrinkles and expression -->
  <circle cx="120" cy="110" r="50" fill="#cbd5e1"/>
  
  <!-- Deep wrinkles (The core of "饱经沧桑") -->
  <path d="M90 100 Q120 90 150 100" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M85 120 Q120 110 155 120" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M100 135 Q120 130 140 135" stroke="#64748b" stroke-width="2" fill="none"/>
  
  <!-- Eyes (Closed/Reflective) -->
  <path d="M95 105 Q105 100 115 105" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M125 105 Q135 100 145 105" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Mouth (Gentle, weary smile) -->
  <path d="M100 150 Q120 160 140 150" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Hair (White/Grey) -->
  <path d="M80 90 C80 50, 160 50, 160 90" fill="#f1f5f9"/>
  
  <!-- Warm Accent: A small lantern or candle light reflection on his face -->
  <circle cx="120" cy="110" r="60" fill="url(#glow)" opacity="0.2"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Props: A worn wooden walking stick leaning beside -->
  <rect x="50" y="140" width="6" height="100" rx="3" fill="#92400e"/>
  <circle cx="53" cy="140" r="8" fill="#92400e"/>
</svg>