<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Icon: Theater Props (道具 - Dàojù) - A stylized theatrical mask and a vintage spyglass/prop sword arranged harmoniously -->
  <g transform="translate(120, 120)">
    <!-- Subtle spotlight glow behind the props -->
    <circle cx="0" cy="-5" r="70" fill="#252A34" opacity="0.8"/>
    
    <!-- Theater Mask (Comedy/Tragedy elements) -->
    <g transform="translate(-35, -15)">
      <!-- Mask Base -->
      <path d="M-30,-30 C-30,-45 0,-50 20,-35 C35,-25 40,0 25,25 C10,40 -20,35 -30,15 Z" fill="#2D3343" stroke="#FFB800" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Eyes -->
      <path d="M-15,-15 Q-5,-25 0,-10 Q-10,-5 -15,-15 Z" fill="#FFB800"/>
      <path d="M5,-10 Q12,-20 18,-5 Q8,0 5,-10 Z" fill="#FFB800"/>
      <!-- Smile / Expression -->
      <path d="M-15,5 Q0,25 15,10" fill="none" stroke="#FFB800" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Ribbon/Stick -->
      <path d="M25,20 L45,40" fill="none" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Prop Sword / Dagger crossing behind -->
    <g transform="rotate(-35) translate(0, -10)">
      <!-- Blade -->
      <path d="M0,-65 L5,-20 L-5,-20 Z" fill="#E2E8F0" opacity="0.9"/>
      <line x1="0" y1="-65" x2="0" y2="-20" stroke="#94A3B8" stroke-width="1"/>
      <!-- Hilt & Guard -->
      <rect x="-3" y="-20" width="6" height="15" rx="1" fill="#FFB800"/>
      <path d="M-15,-20 L15,-20" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-5" r="5" fill="#FFB800"/>
    </g>

    <!-- Vintage Spyglass / Telescope prop -->
    <g transform="translate(30, 20) rotate(25)">
      <rect x="-35" y="-8" width="55" height="16" rx="3" fill="#3B82F6"/>
      <rect x="-42" y="-10" width="10" height="20" rx="2" fill="#FFB800"/>
      <rect x="15" y="-6" width="20" height="12" rx="2" fill="#FFB800"/>
      <!-- Highlights on spyglass -->
      <line x1="-25" y1="-4" x2="5" y2="-4" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Glowing accent stars / magic dust representing performance/props -->
    <path d="M-65,-45 L-62,-52 L-55,-55 L-62,-58 L-65,-65 L-68,-58 L-75,-55 L-68,-52 Z" fill="#FFB800" opacity="0.8"/>
    <path d="M60,-55 L62,-59 L66,-61 L62,-63 L60,-67 L58,-63 L54,-61 L58,-59 Z" fill="#3B82F6" opacity="0.9"/>
    <path d="M55,55 L57.5,59.5 L62,62 L57.5,64.5 L55,69 L52.5,64.5 L48,62 L52.5,59.5 Z" fill="#FFB800" opacity="0.7"/>
  </g>
</svg>