<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Glowing background accent representing authority/status -->
    <circle cx="0" cy="0" r="70" fill="#252A34" opacity="0.8"/>
    <circle cx="0" cy="0" r="50" fill="#2E3646" opacity="0.5"/>

    <!-- Giant Tree (Cây đại thụ - Grand Tree representing "Đẩu/C thụ") -->
    <!-- Roots spreading -->
    <path d="M-30 60 C-10 65, 10 65, 30 60 C40 65, 35 72, 45 75 C30 73, 15 76, 0 78 C-15 76, -30 73, -45 75 C-35 72, -40 65, -30 60 Z" fill="#D4AF37" opacity="0.5"/>
    
    <!-- Massive Trunk -->
    <path d="M-18 60 C-15 30, -12 10, -22 -15 C-25 -22, -18 -35, -28 -45 C-12 -38, -5 -25, -2 -5 C1 -25, 8 -38, 28 -45 C18 -35, 25 -22, 22 -15 C12 10, 15 30, 18 60 Z" fill="#D4AF37"/>
    <path d="M-2 60 C-1 30, 0 10, 0 -5 C0 10, 1 30, 2 60 Z" fill="#AA8C2C"/>

    <!-- Majestic Canopy (Layered geometric pine/banyan style representing stature) -->
    <circle cx="0" cy="-60" r="45" fill="#F1C40F"/>
    <circle cx="-25" cy="-45" r="30" fill="#E1B12C"/>
    <circle cx="25" cy="-45" r="30" fill="#E1B12C"/>
    <circle cx="0" cy="-35" r="35" fill="#F39C12"/>

    <!-- Crown / Star motif integrated into the tree top (representing "Đẩu" - Peak/Leader) -->
    <path d="M0 -90 L8 -70 L30 -70 L12 -55 L18 -35 L0 -48 L-18 -35 L-12 -55 L-30 -70 L-8 -70 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Medical Cross subtle accent on trunk to hint at the "Y học giới" context -->
    <rect x="-6" y="15" width="12" height="4" rx="2" fill="#1A1D24"/>
    <rect x="-2" y="11" width="4" height="12" rx="2" fill="#1A1D24"/>
  </g>
</svg>