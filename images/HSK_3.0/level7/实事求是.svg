    <!-- Magnifying glass symbolizing seeking/examining truth -->
    <circle cx="5" cy="-5" r="32" fill="none" stroke="#F59E0B" stroke-width="7"/>
    <!-- Glass reflection -->
    <path d="M -13 -17 A 18 18 0 0 1 1 -23" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Handle -->
