<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <circle cx="120" cy="120" r="80" fill="#222632" opacity="0.6"/>
  <g transform="translate(120, 110)">
    <!-- Document/Fact representation (Solid Base) -->
    <rect x="-45" y="-35" width="90" height="70" rx="6" fill="#2A303C"/>
    <rect x="-30" y="-15" width="60" height="6" rx="3" fill="#4B5563"/>
