<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Light Glow -->
    <radialGradient id="indoor-glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 & 2 Gradients -->
    <linearGradient id="mom-dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="teacher-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="child-outfit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#indoor-glow)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Classroom / Kindergarten interior -->
  <!-- Warm wooden floor / baseboard -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />
  
  <!-- Background wall decor: colorful shapes / learning board -->
  <rect x="30" y="30" width="70" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="50" cy="55" r="12" fill="#fbbf24" opacity="0.8" />
  <polygon points="75,45 85,65 65,65" fill="#38bdf8" opacity="0.8" />

  <!-- Window with soft night/evening light -->
  <rect x="150" y="25" width="60" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="3" />
  <line x1="180" y1="25" x2="180" y2="95" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="60" x2="210" y2="60" stroke="#334155" stroke-width="2" />
  <!-- Plant on window sill -->
  <rect x="165" y="80" width="30" height="15" rx="3" fill="#f97316" />
  <path d="M 172 80 Q 180 65 180 60 Q 180 65 188 80 Z" fill="#10b981" />
  <circle cx="170" cy="72" r="6" fill="#34d399" />
  <circle cx="190" cy="70" r="7" fill="#34d399" />

  <!-- Bookshelf in background -->
  <rect x="15" y="100" width="45" height="90" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="15" y1="130" x2="60" y2="130" stroke="#334155" stroke-width="2" />
  <line x1="15" y1="160" x2="60" y2="160" stroke="#334155" stroke-width="2" />
  <!-- Books -->
  <rect x="20" y="112" width="8" height="18" fill="#f43f5e" rx="1" />
  <rect x="30" y="110" width="6" height="20" fill="#38bdf8" rx="1" />
  <rect x="38" y="114" width="12" height="16" fill="#fbbf24" rx="1" />
  <rect x="22" y="142" width="10" height="18" fill="#10b981" rx="1" />
  <rect x="34" y="140" width="8" height="20" fill="#a855f7" rx="1" />

  <!-- MAIN CHARACTERS -->
  <g filter="url(#soft-shadow)">
    <!-- 1. TEACHER (Right, welcoming posture, gentle expression) -->
    <g transform="translate(155, 95)">
      <!-- Body / Teacher Cardigan -->
      <path d="M 15 45 C 10 50 5 70 0 95 L 45 95 C 40 70 35 50 30 45 Z" fill="url(#teacher-card)" />
      <!-- Head -->
      <circle cx="22" cy="22" r="16" fill="#ffedd5" />
      <!-- Hair (Teacher - Neat bob) -->
      <path d="M 8 22 C 8 10 16 6 22 6 C 30 6 36 12 36 24 C 36 28 35 32 35 32 C 35 32 30 28 22 28 C 14 28 8 24 8 22 Z" fill="#334155" />
      <!-- Face details (smiling eyes, gentle warm smile) -->
      <path d="M 16 20 Q 18 17 20 20" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 24 20 Q 26 17 28 20" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 20 24 Q 22 26 24 24" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Arms welcoming / gesture of assurance -->
      <path d="M 5 50 C -5 55 -10 65 -5 70" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" fill="none" />
      <!-- Hands -->
      <circle cx="-6" cy="72" r="5" fill="#ffedd5" />
    </g>

    <!-- 2. CHILD (Middle, holding backpack, slightly shy/happy) -->
    <g transform="translate(100, 105)">
      <!-- Small Backpack -->
      <rect x="18" y="20" width="14" height="18" rx="4" fill="#fb923c" />
      <!-- Body -->
      <path d="M 10 35 C 5 45 0 75 0 85 L 30 85 C 30 75 25 45 20 35 Z" fill="url(#child-outfit)" />
      <!-- Head -->
      <circle cx="15" cy="16" r="14" fill="#ffedd5" />
      <!-- Hair -->
      <path d="M 3 14 C 3 6 9 2 15 2 C 21 2 27 6 27 14 C 27 18 25 20 25 20 C 25 20 20 16 15 16 C 10 16 3 14 3 14 Z" fill="#1e293b" />
      <!-- Face -->
      <circle cx="11" cy="15" r="1.5" fill="#1e293b" />
      <circle cx="19" cy="15" r="1.5" fill="#1e293b" />
      <!-- Rosy Cheeks -->
      <circle cx="9" cy="18" r="3" fill="#f43f5e" opacity="0.4" />
      <circle cx="21" cy="18" r="3" fill="#f43f5e" opacity="0.4" />
      <!-- Smile -->
      <path d="M 13 19 Q 15 21 17 19" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Little arms holding school bag straps -->
      <path d="M 5 45 Q 2 55 8 60" stroke="#34d399" stroke-width="6" stroke-linecap="round" fill="none" />
    </g>

    <!-- 3. MOTHER / PARENT (Left, gesturing hand toward child, speaking / entrusting) -->
    <g transform="translate(35, 90)">
      <!-- Body / Elegant Outfit -->
      <path d="M 15 50 C 15 60 10 80 5 105 L 45 105 C 40 80 35 60 35 50 Z" fill="url(#mom-dress)" />
      <!-- Head -->
      <circle cx="25" cy="22" r="16" fill="#ffedd5" />
      <!-- Hair (Stylish ponytail updo) -->
      <path d="M 12 22 C 12 10 18 6 25 6 C 34 6 38 14 38 22 C 38 26 36 32 36 32 C 36 32 30 28 25 28 C 18 28 12 24 12 22 Z" fill="#0f172a" />
      <circle cx="36" cy="14" r="6" fill="#0f172a" />
      <!-- Face (Caring profile look) -->
      <circle cx="31" cy="21" r="1.5" fill="#1e293b" />
      <path d="M 26 25 Q 29 27 32 25" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Outstretched Arm pointing/entrusting towards child & teacher -->
      <path d="M 35 55 C 45 58 55 62 65 60" stroke="#0284c7" stroke-width="9" stroke-linecap="round" fill="none" />
      <!-- Hand pointing open -->
      <circle cx="68" cy="60" r="5" fill="#ffedd5" />
    </g>
  </g>

  <!-- FOREGROUND PROPS -->
  <!-- Low wooden table / desk corner with a flower pot -->
  <path d="M 190 190 L 240 175 L 240 240 L 190 240 Z" fill="#334155" opacity="0.4" />
  <rect x="205" y="155" width="22" height="25" rx="3" fill="#e2e8f0" />
  <!-- Small indoor plant on desk -->
  <path d="M 216 155 Q 205 135 210 120 Q 220 135 216 155 Z" fill="#10b981" />
  <path d="M 216 155 Q 227 135 222 120 Q 212 135 216 155 Z" fill="#34d399" />

  <!-- Atmospheric subtle warm floating sparkles representing care/trust -->
  <circle cx="130" cy="80" r="3" fill="#fbbf24" opacity="0.7" />
  <circle cx="140" cy="115" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="115" cy="65" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="85" cy="95" r="2.5" fill="#f43f5e" opacity="0.6" />

</svg>