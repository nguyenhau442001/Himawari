<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow representing the melody/wind context -->
  <circle cx="120" cy="120" r="70" fill="#F59E0B" opacity="0.08"/>
  
  <g transform="translate(120, 120) rotate(-25)">
    <!-- Main Bamboo Body (Dízi) -->
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#E2B773" stroke="#C29B56" stroke-width="2"/>
    
    <!-- Bamboo Segments (Nodes) -->
    <line x1="-50" y1="-12" x2="-50" y2="12" stroke="#C29B56" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#C29B56" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="-12" x2="50" y2="12" stroke="#C29B56" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Blowing Hole (Mókǒng) -->
    <ellipse cx="-68" cy="0" rx="3.5" ry="5" fill="#1A1D24"/>
    
    <!-- Membrane Hole (Mófēng) with a subtle protective hint -->
    <ellipse cx="-35" cy="0" rx="3" ry="4.5" fill="#2E3440"/>
    
    <!-- Finger Holes (Dǐokǒng) - neatly aligned -->
    <circle cx="-10" cy="0" r="3" fill="#1A1D24"/>
    <circle cx="10" cy="0" r="3" fill="#1A1D24"/>
    <circle cx="30" cy="0" r="3" fill="#1A1D24"/>
    <circle cx="50" cy="0" r="3" fill="#1A1D24"/>
    <circle cx="70" cy="0" r="3" fill="#1A1D24"/>
    
    <!-- Traditional Chinese Red Tassel / Decorative Knot hanging from the end -->
    <path d="M 90 0 C 105 0, 110 15, 120 25" fill="none" stroke="#E53E3E" stroke-width="2" stroke-linecap="round"/>
    <polygon points="120,25 112,45 128,45" fill="#E53E3E"/>
    <rect x="114" y="23" width="12" height="4" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Musical Notes / Melodic Flow (representing "悠扬婉转的乐声") -->
  <g fill="#F59E0B" opacity="0.85">
    <!-- Note 1 -->
    <path d="M 60 70 Q 65 62 70 70 T 80 70" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="62" cy="72" r="3.5"/>
    <circle cx="78" cy="72" r="3.5"/>
    <path d="M 65.5 72 L 65.5 58 L 81.5 55 L 81.5 72" fill="#F59E0B"/>
    
    <!-- Note 2 (Smaller, floating higher) -->
    <circle cx="168" cy="85" r="3"/>
    <path d="M 171 85 L 171 70 L 180 72 L 180 87" fill="#F59E0B"/>
    
    <!-- Sound/Wind Waves -->
    <path d="M 155 130 C 165 135, 175 135, 185 125" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 162 145 C 175 152, 190 150, 202 138" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    
    <path d="M 85 110 C 75 105, 65 105, 55 115" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 78 95 C 65 88, 50 90, 38 102" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>