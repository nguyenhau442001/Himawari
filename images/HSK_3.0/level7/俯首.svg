<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle spotlight effect representing interrogation room atmosphere -->
  <circle cx="120" cy="110" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Character / Physical Object representing "俯首" (cúi đầu - bowing head in defeat/admission) -->
  <g transform="translate(0, 10)">
    <!-- Interrogation Chair Backrest -->
    <path d="M90 140 L90 75 C90 65, 98 57, 108 57 L132 57 C142 57, 150 65, 150 75 L150 140" fill="none" stroke="#3A4252" stroke-width="6" stroke-linecap="round"/>
    <line x1="102" y1="80" x2="138" y2="80" stroke="#3A4252" stroke-width="4" stroke-linecap="round"/>
    <line x1="102" y1="100" x2="138" y2="100" stroke="#3A4252" stroke-width="4" stroke-linecap="round"/>

    <!-- Person's Body (Seated, slumped forward slightly) -->
    <!-- Shoulders & Torso -->
    <path d="M85 160 C85 140, 100 130, 120 130 C140 130, 155 140, 155 160 L160 195 C160 198, 157 200, 154 200 L86 200 C83 200, 80 198, 80 195 Z" fill="#2E384D"/>

    <!-- Folded/Resting Arms on Table or Lap -->
    <path d="M92 165 C105 160, 135 160, 148 165" fill="none" stroke="#2E384D" stroke-width="12" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M110 115 L110 128 L130 128 L130 115 Z" fill="#D4AF93"/>

    <!-- Head Bowed Down (The core visual of 俯首) -->
    <!-- Head shape angled downward -->
    <circle cx="120" cy="105" r="20" fill="#E0BC9D"/>
    
    <!-- Hair (Dark, sleek flat style) -->
    <path d="M101 102 C101 92, 108 86, 120 86 C132 86, 139 92, 139 102 C139 107, 138 112, 138 112 L102 112 C102 112, 101 107, 101 102 Z" fill="#11141B"/>
    <path d="M100 102 C100 95, 105 90, 112 88 L112 108 L100 108 Z" fill="#11141B"/>

    <!-- Interrogation Table Edge (Golden/Orange accent for high-contrast focus) -->
    <rect x="50" y="180" width="140" height="12" rx="4" fill="#F39C12"/>
    <rect x="65" y="192" width="12" height="25" fill="#C27D09"/>
    <rect x="163" y="192" width="12" height="25" fill="#C27D09"/>

    <!-- Evidence Folder on Table (Contextual reference to "铁证如山") -->
    <path d="M135 174 L175 174 L170 180 L130 180 Z" fill="#ECF0F1" opacity="0.9"/>
    <rect x="142" y="171" width="18" height="4" rx="1" fill="#E74C3C"/>
  </g>
</svg>