<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Main Object (Smart Home Device / Vacuum Robot - Primary Purchase) -->
    <g transform="translate(70, 75)">
      <!-- Robot Vacuum Body -->
      <circle cx="50" cy="50" r="42" fill="#2E3440" stroke="#4C566A" stroke-width="3"/>
      <!-- Inner Ring -->
      <circle cx="50" cy="50" r="30" fill="#3B4252"/>
      <!-- Sensor Dome -->
      <circle cx="50" cy="50" r="10" fill="#88C0D0"/>
      <!-- Bumper Detail -->
      <path d="M 22 50 A 28 28 0 0 1 78 50" fill="none" stroke="#E5C07B" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- Status Light -->
      <circle cx="50" cy="42" r="3" fill="#A3BE8C"/>
    </g>

    <!-- Attached Bonus Object (Warranty Card / Shield Tag - representing "附带" / bonus included item) -->
    <g transform="translate(130, 45)">
      <!-- Connecting Flow/Tag line -->
      <path d="M -15 35 C -5 20, 10 10, 25 15" fill="none" stroke="#E5C07B" stroke-width="2.5" stroke-dasharray="3 3"/>
      
      <!-- Bonus Card/Document Base -->
      <rect x="20" y="10" width="60" height="46" rx="6" fill="#2E3440" stroke="#E5C07B" stroke-width="2"/>
      <!-- Card Header Accent -->
      <path d="M 20 16 L 80 16 L 80 24 L 20 24 Z" fill="#E5C07B" opacity="0.2"/>
      
      <!-- Shield / Warranty Symbol on Card -->
      <path d="M 50 26 L 60 30 L 60 38 C 60 44 50 48 50 48 C 50 48 40 44 40 38 L 40 30 Z" fill="#E5C07B"/>
      <!-- Checkmark inside Shield -->
      <path d="M 45 37 L 48 40 L 55 33" fill="none" stroke="#2E3440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Miniature decorative "+ / plus" badge indicating "addon/included" -->
      <circle cx="20" cy="10" r="10" fill="#E5C07B"/>
      <path d="M 15 10 L 25 10 M 20 5 L 20 15" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Floor Shadow for depth -->
    <ellipse cx="120" cy="180" rx="65" ry="10" fill="#111317"/>
  </g>
</svg>