<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient background glows representing immersive digital trap -->
  <circle cx="120" cy="115" r="70" fill="#251F36" opacity="0.8"/>
  <circle cx="120" cy="115" r="50" fill="#3D2045" opacity="0.6"/>

  <!-- Glowing digital web / grid lines pulling inward -->
  <g stroke="#9333EA" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="120" y1="115" x2="60" y2="55"/>
    <line x1="120" y1="115" x2="180" y2="55"/>
    <line x1="120" y1="115" x2="50" y2="120"/>
    <line x1="120" y1="115" x2="190" y2="120"/>
    <line x1="120" y1="115" x2="70" y2="175"/>
    <line x1="120" y1="115" x2="170" y2="175"/>
  </g>

  <!-- Digital Depth Rings -->
  <ellipse cx="120" cy="115" rx="55" ry="25" fill="none" stroke="#C084FC" stroke-width="2" opacity="0.3"/>
  <ellipse cx="120" cy="115" rx="35" ry="16" fill="none" stroke="#E879F9" stroke-width="2" opacity="0.5"/>

  <!-- Floating Abstract Game/Screen Elements (Captivation/Trance) -->
  <polygon points="90,45 105,40 100,55" fill="#38BDF8" opacity="0.6"/>
  <polygon points="150,60 165,55 155,75" fill="#F43F5E" opacity="0.6"/>
  <circle cx="75" cy="90" r="4" fill="#FACC15" opacity="0.8"/>
  <circle cx="165" cy="100" r="5" fill="#38BDF8" opacity="0.8"/>
  <rect x="65" y="130" width="10" height="10" rx="2" fill="#F43F5E" opacity="0.5" transform="rotate(15 70 135)"/>
  <rect x="160" y="140" width="12" height="12" rx="3" fill="#34D399" opacity="0.5" transform="rotate(-20 166 146)"/>

  <!-- Central Physical Object: The Youth / Person completely absorbed, hunched over device -->
  <g id="immersed-character">
    <!-- Seat/Chair back -->
    <path d="M 85,150 L 95,80 C 95,75 100,70 105,70 L 135,70 C 140,70 145,75 145,80 L 155,150 Z" fill="#2D3748"/>
    
    <!-- Body (Slouched / Drawn In) -->
    <path d="M 90,175 C 90,145 100,130 120,130 C 140,130 150,145 150,175 Z" fill="#3B82F6"/>

    <!-- Hood / Shoulders -->
    <path d="M 85,135 C 80,120 95,100 120,100 C 145,100 160,120 155,135 Z" fill="#1E293B"/>

    <!-- Head (Bent Forward, looking down intently) -->
    <circle cx="120" cy="100" r="18" fill="#FBCFE8"/>

    <!-- Hair -->
    <path d="M 102,98 C 102,85 112,82 120,82 C 128,82 138,85 138,98 C 138,103 135,103 133,96 C 130,88 125,86 120,86 C 115,86 110,88 107,96 C 105,103 102,103 102,98 Z" fill="#475569"/>

    <!-- Arms pulling inward toward device -->
    <path d="M 95,125 C 100,135 110,135 115,125" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
    <path d="M 145,125 C 140,135 130,135 125,125" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- The Glowing Device / Screen (Source of the Trance) -->
  <g id="glowing-device">
    <!-- Hands holding device -->
    <circle cx="112" cy="123" r="5" fill="#FBCFE8"/>
    <circle cx="128" cy="123" r="5" fill="#FBCFE8"/>

    <!-- Smartphone/Device glowing fiercely -->
    <rect x="106" y="112" width="28" height="18" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Intense screen glow -->
    <rect x="109" y="115" width="22" height="12" rx="1" fill="#38BDF8"/>
    <!-- Screen light reflection onto face/hands -->
    <path d="M 112,112 L 120,100 L 128,112 Z" fill="#38BDF8" opacity="0.4"/>
  </g>

  <!-- Hypnotic Swirl / Captivation Rings around head -->
  <path d="M 105,85 C 110,75 130,75 135,88 C 138,95 128,102 120,98" fill="none" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 132,92 C 138,88 142,98 135,105" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Focused Accent Glow on the floor/base -->
  <ellipse cx="120" cy="180" rx="30" ry="6" fill="#38BDF8" opacity="0.2"/>
</svg>