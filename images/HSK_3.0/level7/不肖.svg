<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elderly father figure (symbolizing the source of disappointment) -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="-30" r="15" fill="#7D8590"/>
    <path d="M5 0h30v40H5z" fill="#4A5568"/>
    <path d="M10 40h20v40H10z" fill="#2D3748"/>
    <!-- Sad/Disappointed expression -->
    <path d="M15 -35h10M15 -25h10" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- The "Buxiao" (unworthy descendant) figure -->
  <g transform="translate(140, 100)">
    <!-- Slouching posture -->
    <path d="M0 0l10 40" stroke="#F6AD55" stroke-width="8" stroke-linecap="round"/>
    <circle cx="5" cy="-10" r="18" fill="#F6AD55"/>
    <!-- Disheveled hair/hat -->
    <path d="M-10 -25h30" stroke="#ED8936" stroke-width="4"/>
    <!-- Holding a bottle (symbolizing vice/alcohol) -->
    <rect x="25" y="10" width="10" height="25" rx="2" fill="#A0AEC0"/>
    <path d="M30 5v5" stroke="#A0AEC0" stroke-width="4"/>
    <!-- Dismissive gesture: hand in pocket -->
    <path d="M-5 30h10" stroke="#F6AD55" stroke-width="6"/>
  </g>

  <!-- Visual indicator of broken connection/disappointment -->
  <path d="M90 110 L130 90" stroke="#E53E3E" stroke-width="4" stroke-dasharray="6 6"/>
  
  <!-- Shadow/Ground -->
  <ellipse cx="120" cy="210" rx="80" ry="10" fill="#000" opacity="0.2"/>
</svg>