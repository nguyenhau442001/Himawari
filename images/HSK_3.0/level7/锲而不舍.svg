<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Environment / Workshop Interior -->
  <!-- Back Wall & Window with Night Sky showing persistence (moonlit crafting) -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b"/>
  <circle cx="180" cy="55" r="16" fill="#fef08a" opacity="0.8"/>
  <!-- Stars -->
  <circle cx="130" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="65" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="110" cy="60" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Workbench -->
  <rect x="30" y="150" width="180" height="14" rx="4" fill="#334155"/>
  <rect x="45" y="164" width="16" height="56" rx="2" fill="#1e293b"/>
  <rect x="179" y="164" width="16" height="56" rx="2" fill="#1e293b"/>

  <!-- Desk Props (Tools of perseverance/crafting a wooden sculpture) -->
  <!-- Wood shavings -->
  <path d="M 120 150 Q 125 146 130 150 T 140 150" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 135 152 Q 138 148 145 151" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Lamp casting warm golden light -->
  <path d="M 60 150 L 65 100 L 75 100 L 80 150 Z" fill="#475569"/>
  <path d="M 55 95 C 55 85 80 85 80 95 Z" fill="#f59e0b"/>
  <polygon points="50,150 85,150 95,95 40,95" fill="#fbbf24" opacity="0.15"/>
  
  <!-- The Sculpted Object / Art Piece on Stand -->
  <rect x="135" y="130" width="30" height="20" rx="2" fill="#b45309"/>
  <path d="M 142 130 L 145 95 C 145 90 155 90 157 95 L 160 130 Z" fill="#d97706"/>
  <!-- Glowing success sparks emerging from the craft -->
  <circle cx="150" cy="85" r="3" fill="#38bdf8"/>
  <circle cx="140" cy="78" r="2" fill="#fbbf24"/>
  <circle cx="162" cy="80" r="2.5" fill="#10b981"/>

  <!-- Character (The Artisan carving intently, embodying 锲而不舍 - unyielding perseverance) -->
  <!-- Body/Torso -->
  <path d="M 75 160 C 75 135 115 135 115 160 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="95" cy="115" r="16" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M 80 112 C 80 98 110 98 110 112 C 105 106 85 106 80 112 Z" fill="#334155"/>
  <!-- Focused Eyes / Expression -->
  <path d="M 90 116 L 96 116" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 116 L 106 116" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Determined brow -->
  <path d="M 89 113 L 97 114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 99 114 L 107 113" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arm holding chisel actively carving -->
  <path d="M 90 130 L 125 135" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="127" cy="136" r="4" fill="#fbcfe8"/>
  <!-- Chisel Tool -->
  <line x1="124" y1="135" x2="142" y2="137" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <polygon points="142,135 147,137 142,139" fill="#94a3b8"/>

  <!-- Other arm resting/supporting -->
  <path d="M 100 135 L 115 150" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>

  <!-- Ambient Success Glow / Aura representing the achievement of success (成功) -->
  <path d="M 150 70 Q 170 50 190 70 Q 170 90 150 70" fill="#f59e0b" opacity="0.3"/>
  <path d="M 130 80 Q 145 60 160 80" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>