<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object representing "按理" (According to reason / logic / standard expectation): A sleek, glowing logical balance scale / rule mechanism -->
  
  <!-- Background Glow & Grid Accents -->
  <circle cx="120" cy="115" r="55" fill="#3B82F6" fill-opacity="0.08"/>
  <circle cx="120" cy="115" r="35" fill="#3B82F6" fill-opacity="0.05"/>
  
  <!-- Base Stand -->
  <path d="M95 185H145" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 185V130" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="125" r="8" fill="#F59E0B"/>

  <!-- Beam (Balanced / Logical) -->
  <g transform="rotate(-5, 120, 85)">
    <rect x="60" y="81" width="120" height="8" rx="4" fill="#E2E8F0"/>
    
    <!-- Left Pan (Expected outcome / time marker) -->
    <path d="M60 85L45 130H75L60 85Z" fill="#334155" fill-opacity="0.5"/>
    <path d="M40 132H80" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Clock / Time icon representing schedule / "should have arrived" -->
    <circle cx="60" cy="115" r="14" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
    <path d="M60 108V115H65" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Pan (Actual logical weight / standard) -->
    <path d="M180 85L165 130H195L180 85Z" fill="#334155" fill-opacity="0.5"/>
    <path d="M160 132H200" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Checkmark icon representing logical certainty / rule -->
    <circle cx="180" cy="115" r="14" fill="#1E293B" stroke="#10B981" stroke-width="3"/>
    <path d="M173 115L178 120L188 109" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Floating Logical Spark / Focal Point -->
  <path d="M120 52C120 44 125 40 125 40C125 40 130 44 130 52C130 60 120 60 120 60C120 60 110 60 110 52C110 44 120 40 120 40Z" fill="#F59E0B"/>
  <circle cx="120" cy="35" r="3" fill="#F59E0B"/>

  <!-- Subtle Accent Dots for Modern Flat UI feel -->
  <circle cx="75" cy="55" r="2" fill="#334155"/>
  <circle cx="165" cy="55" r="2" fill="#334155"/>
  <circle cx="45" cy="160" r="3" fill="#334155"/>
  <circle cx="195" cy="160" r="3" fill="#334155"/>
</svg>