<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Rain effect -->
  <g stroke="#5D6D7E" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="20" x2="30" y2="60"/>
    <line x1="80" y1="10" x2="70" y2="50"/>
    <line x1="120" y1="30" x2="110" y2="70"/>
    <line x1="160" y1="15" x2="150" y2="55"/>
    <line x1="200" y1="25" x2="190" y2="65"/>
    <line x1="20" y1="80" x2="10" y2="120"/>
    <line x1="220" y1="90" x2="210" y2="130"/>
  </g>

  <!-- Person character: Surprised/Caught off guard -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-30 80 L30 80 L25 20 L-25 20 Z" fill="#F39C12"/>
    
    <!-- Head -->
    <circle cx="0" cy="-15" r="25" fill="#F1C40F"/>
    
    <!-- Surprised Face -->
    <circle cx="-8" cy="-20" r="3" fill="#1A1D24"/>
    <circle cx="8" cy="-20" r="3" fill="#1A1D24"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#1A1D24"/>
    
    <!-- Arms raised in surprise -->
    <path d="M-25 30 L-50 10" stroke="#F39C12" stroke-width="12" stroke-linecap="round"/>
    <path d="M25 30 L50 10" stroke="#F39C12" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Puddle -->
  <ellipse cx="120" cy="220" rx="80" ry="15" fill="#2C3E50"/>
</svg>