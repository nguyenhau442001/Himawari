<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/accent representing neatness/refreshment -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>
  <circle cx="120" cy="115" r="50" fill="#2E384A" opacity="0.4"/>

  <!-- Character Silhouette / Shoulders -->
  <path d="M 75 195 C 75 165, 95 155, 120 155 C 145 155, 165 165, 165 195 Z" fill="#2E384A"/>
  
  <!-- Neck -->
  <rect x="106" y="135" width="28" height="30" fill="#E8B89D" rx="4"/>
  
  <!-- Head Base (Skin) -->
  <circle cx="120" cy="105" r="38" fill="#E8B89D"/>
  
  <!-- Ears -->
  <circle cx="80" cy="108" r="6" fill="#D8A588"/>
  <circle cx="160" cy="108" r="6" fill="#D8A588"/>

  <!-- Facial features (Minimalist, clean) -->
  <!-- Eyebrows (neat, confident) -->
  <path d="M 102 96 Q 110 93 116 97" stroke="#3D2314" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 124 97 Q 130 93 138 96" stroke="#3D2314" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="110" cy="104" r="3" fill="#3D2314"/>
  <circle cx="130" cy="104" r="3" fill="#3D2314"/>
  
  <!-- Smile -->
  <path d="M 112 120 Q 120 126 128 120" stroke="#3D2314" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- HAIR STYLE (发型 - Short, clean, modern cropped vector hair in stylish dark slate/charcoal with warm amber accent highlights) -->
  <g id="hairstyle">
    <!-- Back/base hair volume -->
    <path d="M 83 95 C 80 70, 95 62, 120 62 C 145 62, 160 70, 157 95 Z" fill="#2C313C"/>
    
    <!-- Main neat short haircut shape -->
    <path d="M 82 100 C 80 80, 92 65, 120 65 C 148 65, 160 80, 158 100 
             C 158 100, 153 82, 140 74 
             C 125 67, 110 70, 98 76 
             C 87 82, 82 100, 82 100 Z" fill="#1E222B"/>

    <!-- Stylish front fringe / textured crop top -->
    <path d="M 85 98 C 88 78, 105 70, 124 72 C 143 74, 155 82, 155 98 
             C 152 85, 138 76, 120 76 C 102 76, 88 85, 85 98 Z" fill="#384152"/>

    <!-- Sharp textured spikes / clean modern crop strands -->
    <path d="M 92 84 L 98 73 L 108 80 L 116 71 L 126 78 L 136 71 L 144 80 L 150 75" 
          stroke="#4F5D73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Clean sideburns & neat edge-up contour -->
    <path d="M 83 95 L 86 108 L 89 104" fill="#1E222B"/>
    <path d="M 157 95 L 154 108 L 151 104" fill="#1E222B"/>
  </g>

  <!-- Focus / Style indicators (Gold/Orange accents matching app theme guidelines) -->
  <!-- Sleek framing/styling guides indicating haircut design -->
  <path d="M 68 75 L 60 75 L 60 115 L 68 115" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <path d="M 172 75 L 180 75 L 180 115 L 172 115" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  
  <!-- Tiny aesthetic precision dots -->
  <circle cx="60" cy="95" r="2" fill="#F59E0B"/>
  <circle cx="180" cy="95" r="2" fill="#F59E0B"/>
</svg>