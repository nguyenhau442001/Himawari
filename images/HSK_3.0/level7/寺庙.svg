<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Mountain Background Silhouette -->
  <path d="M 30 190 L 95 110 L 130 145 L 180 90 L 210 190 Z" fill="#242832" />
  
  <!-- Atmospheric Glow for Temple -->
  <circle cx="120" cy="135" r="55" fill="#FFB703" opacity="0.08" filter="blur(8px)"/>

  <!-- Temple (寺庙) Illustration -->
  <g transform="translate(0, 5)">
    <!-- Base Mountain Ridge Detail -->
    <path d="M 85 190 L 120 150 L 155 190 Z" fill="#2C323E"/>

    <!-- Temple Foundation/Stairs -->
    <rect x="95" y="170" width="50" height="12" rx="2" fill="#3A4252"/>
    <rect x="100" y="166" width="40" height="4" fill="#485265"/>

    <!-- Main Temple Walls -->
    <rect x="102" y="130" width="36" height="36" fill="#D94E34"/>
    <!-- Pillar Accents -->
    <rect x="106" y="130" width="3" height="36" fill="#A83721"/>
    <rect x="131" y="130" width="3" height="36" fill="#A83721"/>
    
    <!-- Temple Doors/Windows -->
    <rect x="113" y="142" width="14" height="24" rx="7" fill="#1A1D24"/>
    
    <!-- Lower Roof (Back/Underhang) -->
    <path d="M 94 130 L 146 130 L 142 124 L 98 124 Z" fill="#B33F24"/>

    <!-- Main Roof (Curved Traditional Chinese Style) -->
    <path d="M 90 120 
             Q 120 114 150 120 
             Q 156 122 153 126 
             L 138 126 
             L 102 126 
             L 87 126 
             Q 84 122 90 120 Z" fill="#FFB703"/>
    
    <!-- Roof Ridge & Ornament -->
    <rect x="114" y="106" width="12" height="6" rx="1" fill="#E59E00"/>
    <path d="M 106 112 Q 120 108 134 112 L 138 116 L 102 116 Z" fill="#E59E00"/>

    <!-- Glowing Lanterns (Adding atmosphere) -->
    <circle cx="98" cy="138" r="3" fill="#FF7700"/>
    <circle cx="142" cy="138" r="3" fill="#FF7700"/>
    <line x1="98" y1="130" x2="98" y2="135" stroke="#E59E00" stroke-width="1.5"/>
    <line x1="142" y1="130" x2="142" y2="135" stroke="#E59E00" stroke-width="1.5"/>
  </g>

  <!-- Floating Nature Elements (Stylized Pine/Tree) -->
  <g transform="translate(155, 140)">
    <path d="M 10 30 L 10 50" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
    <path d="M 10 30 Q 5 20 10 15 Q 15 20 10 30 Z" fill="#3B5343"/>
    <path d="M 5 38 Q -2 28 5 22 Q 12 28 5 38 Z" fill="#4B6B56"/>
    <path d="M 15 42 Q 8 32 15 26 Q 22 32 15 42 Z" fill="#4B6B56"/>
  </g>

  <!-- Small Ambient Accent Dots (Modern UI Feel) -->
  <circle cx="50" cy="70" r="1.5" fill="#485265"/>
  <circle cx="190" cy="60" r="2" fill="#485265"/>
  <circle cx="205" cy="75" r="1" fill="#485265"/>
  <circle cx="40" cy="120" r="1" fill="#485265"/>
</svg>