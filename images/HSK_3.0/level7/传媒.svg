<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative tech waves/signals (subtle) -->
  <path d="M 120 50 C 145 50, 165 70, 165 95 C 165 120, 145 140, 120 140" fill="none" stroke="#2A303C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M 120 35 C 160 35, 190 65, 190 105 C 190 145, 160 175, 120 175" fill="none" stroke="#2A303C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M 120 20 C 175 20, 215 60, 215 115 C 215 170, 175 210, 120 210" fill="none" stroke="#2A303C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Central Physical Object: Modern Broadcasting & Digital Media Tower / Hub -->
  <!-- Base platform -->
  <path d="M 90 190 L 150 190 L 160 205 L 80 205 Z" fill="#2E3548"/>
  <rect x="105" y="165" width="30" height="25" fill="#3B445B"/>

  <!-- Main Tower Structure -->
  <polygon points="120,60 102,165 138,165" fill="#475569"/>
  <!-- Tower inner geometric cutouts for tech feel -->
  <polygon points="120,70 108,135 132,135" fill="#1A1D24"/>
  <polygon points="120,140 111,162 129,162" fill="#1A1D24"/>

  <!-- Central core beam -->
  <rect x="117" y="55" width="6" height="115" fill="#64748B"/>

  <!-- Broadcasting Rings / Signal Emitters -->
  <ellipse cx="120" cy="80" rx="28" ry="8" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <ellipse cx="120" cy="110" rx="42" ry="12" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <ellipse cx="120" cy="145" rx="58" ry="16" fill="none" stroke="#F59E0B" stroke-width="3"/>

  <!-- Top transmitter dish / beacon -->
  <circle cx="120" cy="48" r="9" fill="#F59E0B"/>
  <circle cx="120" cy="48" r="4" fill="#FFFFFF"/>

  <!-- Floating Digital Media Elements (Icons representing mass communication forms) -->
  <!-- Video/Screen top-left -->
  <g transform="translate(52, 70)">
    <rect x="-16" y="-12" width="32" height="22" rx="3" fill="#0EA5E9"/>
    <polygon points="2,-2 10,2 2,6" fill="#FFFFFF"/>
    <path d="M -12 -18 L -6 -12 M 12 -18 L 6 -12" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Audio/Sound top-right -->
  <g transform="translate(188, 70)">
    <circle cx="0" cy="0" r="14" fill="#10B981"/>
    <path d="M -4 -5 L 4 -2 L 4 6 M 1 6 C -1 7 -4 7 -6 5 C -8 3 -7 0 -5 -1" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Article/Print bottom-left -->
  <g transform="translate(55, 145)">
    <rect x="-12" y="-15" width="24" height="30" rx="2" fill="#8B5CF6"/>
    <rect x="-8" y="-9" width="16" height="3" rx="1.5" fill="#FFFFFF"/>
    <rect x="-8" y="-3" width="16" height="3" rx="1.5" fill="#FFFFFF"/>
    <rect x="-8" y="3" width="10" height="3" rx="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Globe/Global Network bottom-right -->
  <g transform="translate(185, 145)">
    <circle cx="0" cy="0" r="14" fill="#EC4899"/>
    <path d="M -12 0 L 12 0 M 0 -12 C -4 -4, -4 4, 0 12 C 4 4, 4 -4, 0 -12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Connection Data Particles / Glowing Nodes -->
  <circle cx="85" cy="78" r="3" fill="#F59E0B"/>
  <circle cx="155" cy="78" r="3" fill="#F59E0B"/>
  <circle cx="72" cy="118" r="3.5" fill="#0EA5E9"/>
  <circle cx="168" cy="118" r="3.5" fill="#10B981"/>
</svg>