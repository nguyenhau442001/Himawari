<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background elements representing media spotlight and noise -->
  <g opacity="0.15">
    <path d="M120 30 L180 90 L60 90 Z" fill="#E06C75"/>
    <circle cx="120" cy="110" r="70" stroke="#E06C75" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
  </g>

  <!-- Dynamic human action: Whispering / Gossip spreading vs Targeted action -->
  <!-- Gossip / Rumor network (Pinkish-red tinted shapes, whispering silhouettes) -->
  <g transform="translate(0, 5)">
    <!-- Person 1 (Speaker/Rumor starter) -->
    <path d="M50 145 C50 130 65 125 75 135 C82 142 85 155 85 170 L50 170 Z" fill="#ABB2BF" opacity="0.6"/>
    <circle cx="67" cy="112" r="14" fill="#ABB2BF" opacity="0.6"/>
    
    <!-- Sound/Whisper waves connecting -->
    <path d="M 85 110 Q 100 100 115 110" stroke="#E06C75" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
    <path d="M 90 120 Q 102 112 110 120" stroke="#E06C75" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Person 2 (Receiver/Spreader) -->
    <transform>
      <path d="M150 145 C150 130 135 125 125 135 C118 142 115 155 115 170 L150 170 Z" fill="#ABB2BF" opacity="0.6"/>
      <circle cx="133" cy="112" r="14" fill="#ABB2BF" opacity="0.6"/>
    </transform>

    <!-- Floating scandalous tabloid / speech bubble with dynamic motion lines -->
    <g transform="translate(145, 75)">
      <!-- Tabloid paper shape -->
      <rect x="0" y="0" width="48" height="36" rx="4" fill="#E5C07B"/>
      <!-- Mock text lines -->
      <line x1="8" y1="10" x2="40" y2="10" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="18" x2="32" y2="18" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="26" x2="24" y2="26" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <!-- Highlight accent (pink gossip heart/star) -->
      <path d="M38 26 L41 29 L38 32 L35 29 Z" fill="#E06C75"/>
    </g>

    <!-- Motion trails indicating spreading rumor -->
    <path d="M 175 70 Q 190 55 180 40" stroke="#E06C75" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 190 85 Q 210 75 200 55" stroke="#E06C75" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Central "Action" / Focus: Red slash / Cross-out or dynamic interaction representing "绯闻" (Scandal / Gossip) -->
  <!-- Camera lens / Spotlight framing the gossip -->
  <circle cx="120" cy="110" r="55" stroke="#E5C07B" stroke-width="3" fill="none" opacity="0.8"/>
  
  <!-- Camera flash / shutter blades -->
  <path d="M120 50 L120 62" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 158 L120 170" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 110 L72 110" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  <path d="M168 110 L180 110" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>

  <!-- Base Label Area / Graphic Anchor -->
  <rect x="70" y="195" width="100" height="6" rx="3" fill="#3E4451"/>
  <rect x="95" y="185" width="50" height="4" rx="2" fill="#5C6370"/>
</svg>