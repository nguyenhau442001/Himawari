<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Lighting Gradient -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="momShirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="child1Shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="child2Shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Glow -->
  <circle cx="120" cy="50" r="140" fill="url(#lampGlow)" />

  <!-- ROOM ENVIRONMENT & PROPS -->
  <!-- Wallpaper and Wall Details -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#334155" stroke-width="3" />
  <rect x="0" y="185" width="240" height="55" fill="#090d16" />
  <line x1="0" y1="188" x2="240" y2="188" stroke="#0f172a" stroke-width="1" />

  <!-- Window on the back wall -->
  <g transform="translate(165, 35)">
    <rect x="0" y="0" width="50" height="75" rx="4" fill="url(#nightSky)" stroke="#475569" stroke-width="2"/>
    <line x1="25" y1="0" x2="25" y2="75" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="37" x2="50" y2="37" stroke="#475569" stroke-width="1.5"/>
    <!-- Tiny stars outside -->
    <circle cx="10" cy="12" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="38" cy="22" r="1.2" fill="#fde047" opacity="0.9"/>
    <circle cx="15" cy="55" r="0.8" fill="#fff" opacity="0.7"/>
    <!-- Window sill plant -->
    <rect x="-4" y="70" width="58" height="5" rx="1.5" fill="#64748b"/>
    <path d="M10 70 C10 62, 16 60, 20 58 C24 60, 30 62, 30 70 Z" fill="#10b981"/>
    <circle cx="17" cy="63" r="3" fill="#059669"/>
    <circle cx="23" cy="65" r="2.5" fill="#059669"/>
  </g>

  <!-- Bookshelf / Toys Shelf on Wall -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="55" height="4" rx="1" fill="#475569"/>
    <!-- Books -->
    <rect x="8" y="-12" width="6" height="12" rx="1" fill="#ec4899"/>
    <rect x="15" y="-15" width="7" height="15" rx="1" fill="#3b82f6"/>
    <rect x="23" y="-10" width="5" height="10" rx="1" fill="#eab308"/>
    <!-- Teddy bear toy on shelf -->
    <circle cx="42" cy="-6" r="6" fill="#b45309"/>
    <circle cx="39" cy="-11" r="2.5" fill="#b45309"/>
    <circle cx="45" cy="-11" r="2.5" fill="#b45309"/>
    <circle cx="42" cy="-5" r="2" fill="#fef3c7"/>
  </g>

  <!-- Warm Wall Lamp -->
  <g transform="translate(120, 15)">
    <path d="M115 0 L125 0 L122 15 L118 15 Z" fill="#64748b"/>
    <path d="M110 15 C110 12, 130 12, 130 15 L135 25 C135 27, 133 28, 130 28 L110 28 C107 28, 105 27, 105 25 Z" fill="#f59e0b"/>
  </g>

  <!-- Rug on Floor -->
  <ellipse cx="105" cy="205" rx="75" ry="12" fill="#334155" opacity="0.6"/>
  <ellipse cx="105" cy="205" rx="65" ry="9" fill="#1e293b" />

  <!-- CENTRAL CHARACTERS: MOTHER AND TWO CHILDREN -->

  <!-- Left Child (Sitting, doing homework/drawing) -->
  <g transform="translate(55, 145)">
    <!-- Small Chair -->
    <rect x="-10" y="15" width="22" height="25" rx="3" fill="#64748b"/>
    <rect x="-12" y="5" width="26" height="12" rx="2" fill="#475569"/>
    
    <!-- Child Body & Legs -->
    <rect x="-6" y="20" width="14" height="20" rx="4" fill="url(#child1Shirt)"/>
    <path d="M-4 38 L-8 58 L-2 58 L1 45 Z" fill="#475569"/>
    <path d="M4 38 L8 58 L14 58 L8 45 Z" fill="#475569"/>

    <!-- Head & Hair -->
    <circle cx="0" cy="8" r="11" rx="11" fill="#fcd34d"/>
    <path d="M-11 5 C-11 -3, 11 -3, 11 5 C11 9, 8 10, 5 7 C2 10, -2 10, -5 7 C-8 10, -11 9, -11 5 Z" fill="#b45309"/>
    <!-- Face Expression (Happy, focused) -->
    <circle cx="-3" cy="7" r="1.2" fill="#1e293b"/>
    <circle cx="3" cy="7" r="1.2" fill="#1e293b"/>
    <path d="M-1 11 Q0 13 2 11" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Arms & Hand holding crayon -->
    <path d="M-6 22 L-14 30 L-9 35" fill="none" stroke="url(#child1Shirt)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-10" cy="35" r="2.5" fill="#fcd34d"/>
  </g>

  <!-- Small Desk with Drawing/Books -->
  <g transform="translate(68, 160)">
    <rect x="-20" y="0" width="45" height="6" rx="2" fill="#94a3b8"/>
    <rect x="-15" y="6" width="6" height="28" fill="#64748b"/>
    <rect x="19" y="6" width="6" height="28" fill="#64748b"/>
    <!-- Open notebook -->
    <path d="M-8 0 L5 -3 L12 0 L-2 3 Z" fill="#f8fafc"/>
    <!-- Crayon -->
    <rect x="2" y="-5" width="4" height="2" rx="1" fill="#ef4444" transform="rotate(30 2 -5)"/>
  </g>

  <!-- Mother (Standing centrally, gently embracing/tending to the children) -->
  <g transform="translate(120, 115)">
    <!-- Mother Body & Apron -->
    <path d="M-14 30 C-14 20, 14 20, 14 30 L18 70 C18 73, 15 75, 12 75 L-12 75 C-15 75, -18 73, -18 70 Z" fill="url(#momShirt)"/>
    <!-- Apron -->
    <path d="M-10 38 L10 38 L12 75 L-12 75 Z" fill="#f8fafc" opacity="0.9"/>
    <circle cx="0" cy="45" r="2" fill="#0284c7"/>
    <circle cx="0" cy="55" r="2" fill="#0284c7"/>

    <!-- Mother Legs -->
    <rect x="-10" y="73" width="7" height="35" rx="3.5" fill="#334155"/>
    <rect x="3" y="73" width="7" height="35" rx="3.5" fill="#334155"/>
    <!-- Slippers -->
    <ellipse cx="-6.5" cy="110" rx="5" ry="2.5" fill="#f43f5e"/>
    <ellipse cx="6.5" cy="110" rx="5" ry="2.5" fill="#f43f5e"/>

    <!-- Mother Head & Hair (Gentle, warm expression) -->
    <circle cx="0" cy="6" r="13" fill="#fcd34d"/>
    <!-- Hair bun & strands -->
    <circle cx="0" cy="-9" r="6" fill="#1e293b"/>
    <path d="M-13 4 C-15 -4, -5 -12, 0 -12 C8 -12, 14 -4, 13 4 C10 2, 6 1, 0 3 C-6 1, -10 2, -13 4 Z" fill="#1e293b"/>
    
    <!-- Face Expression (Loving smile) -->
    <circle cx="-4" cy="5" r="1.3" fill="#1e293b"/>
    <circle cx="4" cy="5" r="1.3" fill="#1e293b"/>
    <!-- Gentle curved smile -->
    <path d="M-2 9 Q0 11 2 9" stroke="#1e293b" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <circle cx="-7" cy="8" r="2" fill="#fb7185" opacity="0.5"/>
    <circle cx="7" cy="8" r="2" fill="#fb7185" opacity="0.5"/>

    <!-- Mother Arms (Hugging/Guiding the children) -->
    <!-- Left arm reaching out to younger child -->
    <path d="M-12 34 C-25 35, -35 45, -40 50" fill="none" stroke="url(#momShirt)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-41" cy="51" r="3.5" fill="#fcd34d"/>

    <!-- Right arm resting gently on older child's shoulder -->
    <path d="M12 34 C25 35, 32 42, 38 45" fill="none" stroke="url(#momShirt)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="39" cy="46" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Right Child (Standing/leaning near mother, looking happy) -->
  <g transform="translate(175, 135)">
    <!-- Child Body & Legs -->
    <rect x="-8" y="20" width="16" height="35" rx="5" fill="url(#child2Shirt)"/>
    <rect x="-7" y="55" width="5" height="23" rx="2.5" fill="#475569"/>
    <rect x="2" y="55" width="5" height="23" rx="2.5" fill="#475569"/>
    <!-- Shoes -->
    <ellipse cx="-4.5" cy="79" rx="4.5" ry="2" fill="#3b82f6"/>
    <ellipse cx="4.5" cy="79" rx="4.5" ry="2" fill="#3b82f6"/>

    <!-- Head & Hair (Pigtails) -->
    <circle cx="0" cy="6" r="11" fill="#fcd34d"/>
    <path d="M-11 3 C-11 -4, 11 -4, 11 3 C11 7, 7 8, 4 5 C1 8, -1 8, -4 5 C-7 8, -11 7, -11 3 Z" fill="#9a3412"/>
    <!-- Pigtail buns -->
    <circle cx="-13" cy="2" r="3.5" fill="#9a3412"/>
    <circle cx="13" cy="2" r="3.5" fill="#9a3412"/>

    <!-- Face Expression (Joyful, smiling) -->
    <circle cx="-3" cy="5" r="1.2" fill="#1e293b"/>
    <circle cx="3" cy="5" r="1.2" fill="#1e293b"/>
    <path d="M-2 9 Q0 12 2 9" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <circle cx="-6" cy="7" r="1.8" fill="#fb7185" opacity="0.6"/>
    <circle cx="6" cy="7" r="1.8" fill="#fb7185" opacity="0.6"/>

    <!-- Arms -->
    <path d="M-8 25 C-15 28, -18 35, -15 42" fill="none" stroke="url(#child2Shirt)" stroke-width="5" stroke-linecap="round"/>
    <path d="M8 25 C15 28, 12 38, 8 42" fill="none" stroke="url(#child2Shirt)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND INTERIOR PROPS (Adding rich depth and framing) -->
  <!-- Houseplant on floor (Left side) -->
  <g transform="translate(18, 185)">
    <path d="M5 25 L15 45 C15 45, 20 48, 25 45 L35 25 Z" fill="#475569"/>
    <ellipse cx="20" cy="25" rx="15" ry="4" fill="#64748b"/>
    <!-- Plant leaves bursting up -->
    <path d="M20 23 Q10 0, -5 5" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 23 Q25 -10, 40 -2" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 23 Q35 5, 45 20" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 23 Q5 10, 0 25" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Toy blocks on floor near kids -->
  <g transform="translate(100, 210)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#ef4444"/>
    <rect x="14" y="-4" width="14" height="16" rx="2" fill="#3b82f6"/>
    <rect x="25" y="2" width="10" height="10" rx="2" fill="#eab308"/>
  </g>
</svg>