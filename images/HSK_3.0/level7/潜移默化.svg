<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Light Cone -->
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Plant Growth Glow -->
    <radialGradient id="plantGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Wallpaper subtle paneling -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="1.5" opacity="0.5" />
  
  <!-- Window Frame on Left (Environment factor) -->
  <rect x="18" y="30" width="44" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="22" y="34" width="17" height="37" fill="url(#moonlight)" />
  <rect x="41" y="34" width="17" height="37" fill="url(#moonlight)" />
  <rect x="22" y="74" width="17" height="37" fill="url(#moonlight)" />
  <rect x="41" y="74" width="17" height="37" fill="url(#moonlight)" />
  <!-- Window outside foliage hint -->
  <circle cx="30" cy="50" r="8" fill="#059669" opacity="0.6" />
  <circle cx="50" cy="95" r="12" fill="#047857" opacity="0.5" />

  <!-- Ambient Light Cone from Desk Lamp -->
  <polygon points="120,40 50,200 190,200" fill="url(#lightCone)" />

  <!-- Bookshelf Background (Environment) -->
  <g transform="translate(160, 25)">
    <rect x="0" y="0" width="60" height="110" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="2" />
    <line x1="0" y1="35" x2="60" y2="35" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="72" x2="60" y2="72" stroke="#334155" stroke-width="1.5" />
    
    <!-- Books on shelves -->
    <rect x="8" y="15" width="6" height="20" fill="#ec4899" rx="1" />
    <rect x="16" y="12" width="8" height="23" fill="#38bdf8" rx="1" />
    <rect x="26" y="17" width="5" height="18" fill="#fb923c" rx="1" />
    <rect x="35" y="10" width="10" height="25" fill="#10b981" rx="1" />
    
    <rect x="10" y="48" width="7" height="24" fill="#fbbf24" rx="1" />
    <rect x="19" y="52" width="6" height="20" fill="#ec4899" rx="1" />
    <rect x="27" y="45" width="12" height="27" fill="#6366f1" rx="1" />
  </g>

  <!-- Study Desk -->
  <rect x="65" y="160" width="135" height="10" fill="#334155" rx="2" />
  <rect x="75" y="170" width="10" height="35" fill="#1e293b" />
  <rect x="180" y="170" width="10" height="35" fill="#1e293b" />

  <!-- PROPS ON DESK -->
  <!-- Stack of books (Learning environment) -->
  <g transform="translate(80, 142)">
    <rect x="0" y="12" width="28" height="6" fill="#38bdf8" rx="1" />
    <rect x="-2" y="7" width="32" height="6" fill="#10b981" rx="1" />
    <rect x="1" y="2" width="26" height="6" fill="#fbbf24" rx="1" />
    <path d="M8 2 L8 8" stroke="#0f172a" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Potted Plant (Symbolizing gradual, quiet growth / '潜移默化') -->
  <g transform="translate(160, 130)">
    <circle cx="12" cy="12" r="18" fill="url(#plantGlow)" />
    <!-- Pot -->
    <path d="M5 18 L19 18 L16 30 L8 30 Z" fill="#fb923c" />
    <!-- Soil -->
    <ellipse cx="12" cy="18" rx="7" ry="2" fill="#78350f" />
    <!-- Growing stems & leaves (gradual development) -->
    <path d="M12 18 Q12 10 7 5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="6" cy="4" r="3" fill="#34d399" />
    <path d="M12 18 Q14 8 20 6" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="21" cy="5" r="3.5" fill="#10b981" />
    <path d="M12 18 Q8 12 11 9" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(110, 115)">
    <path d="M10 45 L20 45 L15 25 Z" fill="#64748b" />
    <path d="M5 25 L25 25 L20 12 L10 12 Z" fill="#fbbf24" />
    <!-- Lamp arm -->
    <path d="M15 12 L15 0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <path d="M15 0 L35 0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: CHARACTER (Engaged in quiet, immersive study) -->
  <g transform="translate(85, 85)">
    <!-- Chair back -->
    <rect x="-12" y="20" width="10" height="55" rx="3" fill="#334155" />

    <!-- Torso (leaning slightly forward, absorbed) -->
    <path d="M-2 42 C-2 30 15 25 25 35 C32 42 35 60 35 75 L-2 75 Z" fill="#38bdf8" />
    
    <!-- Character Head & Hair -->
    <!-- Hair back/base -->
    <circle cx="16" cy="12" r="14" fill="#0f172a" />
    <!-- Face profile/skin -->
    <circle cx="20" cy="15" r="11" fill="#fbcfe8" />
    <!-- Cute stylized facial expression (Focused, calm eyes closed or looking down at book) -->
    <path d="M22 15 Q26 17 28 15" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Gentle happy blush -->
    <circle cx="25" cy="18" r="3" fill="#fb7185" opacity="0.4" />
    <!-- Hair top styling -->
    <path d="M6 10 C10 2 24 2 28 10 C24 6 12 6 6 10 Z" fill="#0f172a" />

    <!-- Arms resting on desk / holding open book -->
    <!-- Back arm -->
    <path d="M5 45 C10 45 20 50 25 60" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    
    <!-- Open Book in Hands -->
    <g transform="translate(25, 52)">
      <path d="M0 10 L18 0 L36 10 L36 22 L18 15 L0 22 Z" fill="#f8fafc" />
      <path d="M18 0 L18 15" stroke="#cbd5e1" stroke-width="1" />
      <!-- Tiny readable lines on book -->
      <line x1="4" y1="6" x2="14" y2="4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="4" y1="10" x2="12" y2="8" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="22" y1="5" x2="32" y2="7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="22" y1="9" x2="30" y2="11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Front Arm -->
    <path d="M10 42 C20 45 32 52 35 62" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="35" cy="63" r="3.5" fill="#fbcfe8" />
  </g>

  <!-- FLOATING ATMOSPHERIC PARTICLES (Visualizing subtle, silent influence/absorption of environment) -->
  <g opacity="0.7">
    <!-- Glowing knowledge / environment particles floating upward gently -->
    <circle cx="135" cy="95" r="2.5" fill="#fbbf24" />
    <circle cx="145" cy="75" r="1.5" fill="#38bdf8" />
    <circle cx="120" cy="65" r="2" fill="#10b981" />
    <circle cx="155" cy="110" r="1" fill="#fbbf24" />
    <circle cx="110" cy="85" r="2" fill="#ec4899" opacity="0.6" />
    
    <!-- Gentle curved flow lines representing silent, continuous environmental impact -->
    <path d="M130 110 Q140 90 150 70" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />
    <path d="M145 125 Q155 105 165 85" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  </g>
</svg>