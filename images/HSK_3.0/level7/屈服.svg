<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Amber Glow for Determination -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Boulder / Difficulty Gradient -->
    <linearGradient id="boulder-grad" x1="20%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="shirt-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="ground-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment Elements (Atmospheric Mountain/Rocks silhouette) -->
  <path d="M0 190 L60 140 L110 170 L180 120 L240 160 L240 240 L0 240 Z" fill="#111827" opacity="0.6"/>

  <!-- Ambient Golden Resolve Glow behind Characters -->
  <circle cx="120" cy="140" r="80" fill="url(#amber-glow)"/>

  <!-- Ground Plane -->
  <rect x="0" y="195" width="240" height="45" fill="url(#ground-grad)"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2"/>

  <!-- HUGE SYMBOLIC BOULDER (Representing "Difficulty / 困难") -->
  <g filter="url(#soft-shadow)">
    <!-- Main Boulder Body -->
    <path d="M 60,195 
             C 50,150 70,110 110,100 
             C 140,90 180,110 195,145 
             C 210,180 195,200 190,200 
             Z" 
          fill="url(#boulder-grad)" />
    
    <!-- Boulder Texture & Cracks (Stylized vector fissures) -->
    <path d="M 110,100 L 125,135 L 105,160" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 180,120 L 155,145 L 165,180" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 75,145 L 100,155" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Highlight on Boulder -->
    <path d="M 90,115 C 105,110 130,115 140,125" stroke="#64748b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- CHARACTERS (Two united figures pushing firmly against the massive boulder, showing refusal to yield / 绝不屈服) -->

  <!-- Character 1 (Left - Blue shirt, pushing upward with grit) -->
  <g id="character-1" filter="url(#soft-shadow)">
    <!-- Legs in stance -->
    <path d="M 65,195 L 50,175 L 40,195" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 65,195 L 50,175 L 40,195" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Torso leaning forward at an angle -->
    <path d="M 60,180 L 85,150" stroke="url(#shirt-grad-1)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Head with determined expression & tilted forward -->
    <circle cx="95" cy="138" r="11" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 85,138 C 86,130 95,127 103,132 C 100,136 98,142 95,142 Z" fill="#334155"/>
    <!-- Determined brow/eyes -->
    <line x1="93" y1="137" x2="98" y2="139" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms pushing against boulder -->
    <path d="M 75,160 L 105,142" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Hands bracing -->
    <circle cx="107" cy="141" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Character 2 (Right - Pink/Magenta shirt, supporting strongly) -->
  <g id="character-2" filter="url(#soft-shadow)">
    <!-- Legs braced -->
    <path d="M 125,195 L 140,175 L 150,195" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 125,195 L 140,175 L 150,195" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Torso leaning forward -->
    <path d="M 125,180 L 105,150" stroke="url(#shirt-grad-2)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Head with intense focus -->
    <circle cx="98" cy="137" r="11" fill="#fed7aa"/>
    <!-- Hair bun / ponytail -->
    <circle cx="92" cy="126" r="5" fill="#1e293b"/>
    <path d="M 90,132 C 95,128 102,130 106,136" fill="#1e293b"/>
    <!-- Determined brow -->
    <line x1="97" y1="136" x2="102" y2="138" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms bracing against boulder surface -->
    <path d="M 112,158 L 122,145" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <!-- Hands bracing -->
    <circle cx="124" cy="143" r="4" fill="#fed7aa"/>
  </g>

  <!-- Dynamic Energy Sparks / Resolve Indicators (Showing active struggle and resistance, NO text) -->
  <g stroke-linecap="round" stroke-width="2">
    <line x1="115" y1="120" x2="125" y2="110" stroke="#fbbf24"/>
    <line x1="135" y1="130" x2="147" y2="122" stroke="#f59e0b"/>
    <line x1="100" y1="110" x2="105" y2="98" stroke="#fbbf24"/>
    <circle cx="130" cy="115" r="2" fill="#fbbf24"/>
    <circle cx="108" cy="103" r="1.5" fill="#f59e0b"/>
  </g>

  <!-- Foreground details: Pebbles and dust at base -->
  <circle cx="55" cy="197" r="3" fill="#475569"/>
  <circle cx="115" cy="198" r="4" fill="#334155"/>
  <circle cx="165" cy="196" r="2.5" fill="#64748b"/>
  <circle cx="185" cy="199" r="3.5" fill="#475569"/>

</svg>