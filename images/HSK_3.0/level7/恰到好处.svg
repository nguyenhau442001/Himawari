<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="120" cy="115" r="75"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="115" r="110" fill="url(#lampGlow)"/>
  <rect x="15" y="15" width="210" height="210" rx="16" fill="url(#accentGlow)"/>

  <!-- Background Environment & Props (Cozy Writer's Study / Studio) -->
  <!-- Bookshelf Background -->
  <g fill="#334155" opacity="0.6">
    <rect x="35" y="50" width="25" height="40" rx="2"/>
    <rect x="63" y="45" width="20" height="45" rx="2"/>
    <rect x="155" y="55" width="22" height="35" rx="2"/>
    <rect x="180" y="48" width="28" height="42" rx="2"/>
    <line x1="30" y1="92" x2="210" y2="92" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M120 15 L120 45" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M105 45 L135 45 L140 52 L100 52 Z" fill="#94a3b8"/>
  <path d="M120 52 L120 62" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>

  <!-- Wooden Desk Surface -->
  <path d="M20 185 L220 185 L200 215 L40 215 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M15 180 L225 180 L220 186 L20 186 Z" fill="#334155"/>

  <!-- Desk Props (Coffee cup, notebook, plant) -->
  <rect x="45" y="162" width="20" height="20" rx="4" fill="#38bdf8"/>
  <path d="M65 168 C72 168 72 178 65 178" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Little Plant Pot -->
  <path d="M185 165 L205 165 L200 182 L190 182 Z" fill="#64748b"/>
  <path d="M195 165 C190 150 180 145 175 140 C185 145 190 155 195 165 Z" fill="#10b981"/>
  <path d="M195 165 C200 150 210 145 215 140 C205 145 200 155 195 165 Z" fill="#34d399"/>

  <!-- CENTRAL SCENARIO FOCUS: The Metaphor / The Perfect Stroke (Writer at work) -->
  <!-- Manuscript Paper with Metaphor Sketch -->
  <g transform="translate(75, 115)">
    <!-- Paper sheet -->
    <rect x="-35" y="-15" width="70" height="75" rx="3" fill="#f8fafc" transform="rotate(-5)" />
    <!-- Lines of text on paper -->
    <line x1="-25" y1="2" x2="15" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" transform="rotate(-5)"/>
    <line x1="-25" y1="12" x2="25" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" transform="rotate(-5)"/>
    <line x1="-25" y1="22" x2="5" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" transform="rotate(-5)"/>
    
    <!-- Vivid Metaphor Illustration on Paper: A glowing golden bird taking flight from a pen stroke -->
    <path d="M-15 45 C0 35 15 25 25 30 C15 35 5 45 -15 45 Z" fill="#fbbf24" transform="rotate(-5)"/>
    <circle cx="27" cy="27" r="3" fill="#f59e0b" transform="rotate(-5)"/>
  </g>

  <!-- Character: Thoughtful, inspired writer/artist -->
  <g transform="translate(120, 110)">
    <!-- Body / Torso -->
    <path d="M-30 65 L30 65 L40 100 L-40 100 Z" fill="#475569"/>
    <path d="M-15 65 L15 65 L20 100 L-20 100 Z" fill="#334155"/> <!-- Collar / Inner shirt -->
    
    <!-- Neck -->
    <rect x="-8" y="38" width="16" height="15" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="0" cy="18" r="26" fill="#fbcfe8"/>
    
    <!-- Hair (Stylish, modern dark hair) -->
    <path d="M-26 15 C-26 -2 -10 -8 0 -8 C10 -8 26 -2 26 15 C26 22 22 15 20 8 C15 -2 5 -4 0 -4 C-5 -4 -15 -2 -20 8 C-22 15 -26 22 -26 15 Z" fill="#0f172a"/>

    <!-- Face Profile / Expression (Focused, inspired smile, realizing the "just right" metaphor) -->
    <!-- Glasses -->
    <circle cx="-9" cy="16" r="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="9" cy="16" r="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="-1" y1="16" x2="1" y2="16" stroke="#fbbf24" stroke-width="2"/>

    <!-- Eyes (Happy closed-lid crescent or focused dots - let's do warm focused eyes) -->
    <circle cx="-9" cy="16" r="2" fill="#0f172a"/>
    <circle cx="9" cy="16" r="2" fill="#0f172a"/>

    <!-- Gentle Smile of realization -->
    <path d="M-4 26 Q0 30 4 26" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Cheeks (Warm blush) -->
    <circle cx="-16" cy="22" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="16" cy="22" r="4" fill="#fda4af" opacity="0.6"/>

    <!-- Arms & Hands Gesturing (The "Aha!" moment gesture holding a fountain pen) -->
    <!-- Right Arm holding pen gracefully -->
    <path d="M25 60 C35 60 45 45 35 35" stroke="#475569" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="35" cy="30" r="6" fill="#fbcfe8"/>
    <!-- Fountain Pen pointing precisely to paper -->
    <path d="M38 25 L50 10 L52 12 L40 27 Z" fill="#38bdf8"/>
    <path d="M48 13 L51 16" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Left Arm resting -->
    <path d="M-25 60 C-35 65 -40 75 -35 90" stroke="#475569" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="-35" cy="92" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Sparkles / Metaphor Resonance (Visualizing "Just Right" accuracy and brilliance) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M150 60 Q150 70 160 70 Q150 70 150 80 Q150 70 140 70 Q150 70 150 60 Z"/>
    <!-- Star 2 -->
    <path d="M75 85 Q75 90 80 90 Q75 90 75 95 Q75 90 70 90 Q75 90 75 85 Z"/>
    <!-- Star 3 (Cyan accent for balance) -->
    <path d="M165 110 Q165 115 170 115 Q165 115 165 120 Q165 115 160 115 Q165 115 165 110 Z" fill="#38bdf8"/>
  </g>
</svg>