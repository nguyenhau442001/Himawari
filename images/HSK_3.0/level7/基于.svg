<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  
  <!-- Bookshelf in background with colorful books -->
  <g opacity="0.7">
    <rect x="35" y="45" width="45" height="60" fill="#334155" rx="2" />
    <!-- Shelf boards -->
    <rect x="30" y="70" width="55" height="3" fill="#475569" />
    <rect x="30" y="95" width="55" height="3" fill="#475569" />
    <!-- Mini books -->
    <rect x="38" y="52" width="8" height="18" fill="#f43f5e" rx="1" />
    <rect x="48" y="50" width="6" height="20" fill="#38bdf8" rx="1" />
    <rect x="56" y="54" width="10" height="16" fill="#10b981" rx="1" />
    <rect x="38" y="77" width="12" height="18" fill="#fbbf24" rx="1" />
    <rect x="52" y="75" width="7" height="20" fill="#a855f7" rx="1" />
  </g>

  <!-- Window with city silhouette / night sky -->
  <rect x="155" y="35" width="50" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M155 70 L205 70 M180 35 L180 105" stroke="#334155" stroke-width="2" />
  <!-- Window light beam projection -->
  <polygon points="155,35 205,35 230,170 120,170" fill="url(#window-light)" />

  <!-- Plant Decor -->
  <circle cx="130" cy="92" r="8" fill="#10b981" />
  <path d="M125 100 Q130 90 135 100 Z" fill="#059669" />
  <path d="M120 96 Q130 85 133 100 Z" fill="#34d399" />
  <rect x="122" y="100" width="16" height="14" rx="3" fill="#cbd5e1" />

  <!-- Desk Surface -->
  <path d="M15 165 L225 165 L215 185 L25 185 Z" fill="#334155" filter="url(#shadow)" />
  <rect x="10" y="160" width="220" height="7" rx="2" fill="#475569" />

  <!-- PROPS ON DESK -->
  <!-- Laptop -->
  <path d="M70 155 L115 155 L120 162 L65 162 Z" fill="#94a3b8" />
  <rect x="75" y="132" width="35" height="24" rx="2" fill="#cbd5e1" />
  <rect x="78" y="135" width="29" height="18" fill="#0f172a" />
  <!-- UI abstraction on laptop screen (Charts showing reasons/data) -->
  <polyline points="82,148 88,143 94,146 102,138" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="102" cy="138" r="2" fill="#f43f5e" />

  <!-- Coffee Mug -->
  <rect x="145" y="145" width="12" height="16" rx="2" fill="#f8fafc" />
  <path d="M157 148 C162 148 162 156 157 156" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <!-- Steam lines -->
  <path d="M149 140 Q151 135 149 130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M153 141 Q155 136 153 131" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- RESIGNATION LETTER & PEN (The core "based on reasons, I resign" visual anchor) -->
  <g transform="translate(95, 138) rotate(-10)">
    <!-- Paper -->
    <rect x="0" y="0" width="30" height="38" rx="1" fill="#f8fafc" filter="url(#shadow)" />
    <!-- Abstract text lines on paper -->
    <line x1="5" y1="8" x2="25" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="14" x2="20" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="20" x2="22" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Red Signature / Seal -->
    <circle cx="22" cy="30" r="4" fill="#ef4444" />
  </g>
  
  <!-- Pen resting near paper -->
  <line x1="85" y1="160" x2="120" y2="152" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" filter="url(#shadow)" />
  <polygon points="120,152 124,151 121,154" fill="#1e293b" />

  <!-- MAIN CHARACTER -->
  <!-- Chair Back -->
  <path d="M175 95 L195 95 L200 170 L170 170 Z" fill="#1e293b" rx="4" />
  <rect x="172" y="90" width="26" height="10" rx="3" fill="#334155" />

  <!-- Character Body & Pose (Thoughtful, decisive leaning back or leaning forward) -->
  <g id="character">
    <!-- Torso (Professional attire, dark blue blazer over mustard yellow shirt) -->
    <path d="M140 120 C140 105 165 105 168 120 L175 165 L135 165 Z" fill="#1e293b" />
    <path d="M148 115 L160 115 L157 145 L151 145 Z" fill="#fbbf24" /> <!-- Shirt front -->
    <path d="M151 115 L154 125 L157 115 Z" fill="#0f172a" /> <!-- Tie / Collar -->

    <!-- Head & Face (Expressive, calm, resolute expression) -->
    <circle cx="154" cy="85" r="16" fill="#fcd34d" />
    <!-- Hair (Stylized modern dark hair) -->
    <path d="M138 85 C138 70 168 70 170 85 C170 85 165 75 154 75 C143 75 138 85 138 85 Z" fill="#0f172a" />
    
    <!-- Gentle determined eyes (brows slightly slanted in contemplation/decision) -->
    <line x1="147" y1="84" x2="153" y2="86" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="157" y1="86" x2="163" y2="84" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    
    <!-- Calm, firm mouth -->
    <path d="M152 94 Q154 96 158 94" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arm reaching forward, hand placing/finishing the resignation letter -->
    <path d="M140 115 C130 125 115 135 105 142" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="102" cy="144" r="5" fill="#fcd34d" />

    <!-- Other Arm resting naturally -->
    <path d="M168 120 C178 130 180 145 175 155" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
    <circle cx="174" cy="157" r="5" fill="#fcd34d" />
  </g>

  <!-- FOREGROUND ACCENTS & LIGHTING -->
  <!-- Warm Ambient Glow from Desk Lamp (Top Right off-screen concept) -->
  <circle cx="180" cy="50" r="70" fill="url(#lamp-glow)" />

  <!-- Floating "Decision / Reason" conceptual graphic elements (Subtle nodes, abstract structural dots representing "Based on reasons") -->
  <g opacity="0.6">
    <line x1="50" y1="100" x2="70" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="50" cy="100" r="3" fill="#38bdf8" />
    <circle cx="70" cy="120" r="4" fill="#38bdf8" />
    
    <line x1="70" y1="120" x2="95" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="95" cy="110" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Clean Border Stroke for Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>