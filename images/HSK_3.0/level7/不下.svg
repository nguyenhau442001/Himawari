<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Modern sleek booth / exhibition entrance structure -->
  <path d="M 60 70 L 180 70 L 195 90 L 45 90 Z" fill="#2E3440"/>
  <rect x="55" y="90" width="130" height="110" rx="4" fill="#242B35"/>
  
