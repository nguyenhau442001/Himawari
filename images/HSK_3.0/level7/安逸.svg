<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Shapes (Subtle, minimalist interior/room atmosphere) -->
  <path d="M40 180 L200 180" stroke="#2A2F3B" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Warm soft light glow representing comfort/ease -->
  <circle cx="120" cy="115" r="70" fill="#252A38" opacity="0.6"/>

  <!-- Central Character embodying "安逸" (Anyi - Leisurely/Comfortable repose) -->
  <!-- Reclining/Relaxed Person in an armchair -->
  
  <!-- Modern Armchair Base & Legs -->
  <path d="M95 170 L90 195 M145 170 L150 195" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Armchair Body (Deep Comfort Teal/Slate Blue) -->
  <path d="M75 110 C75 95 85 85 100 85 L140 85 C155 85 165 95 165 110 L165 165 C165 173 158 180 150 180 L90 180 C82 180 75 173 75 165 Z" fill="#2B3748"/>
  
  <!-- Armchair Cushions (Soft gold/orange contrast accent for comfort) -->
  <rect x="85" y="100" width="70" height="75" rx="12" fill="#E0A96D"/>
  <rect x="90" y="110" width="60" height="60" rx="8" fill="#F4B87E"/>

  <!-- Relaxed Person (Calm posture, reclining gently) -->
  <!-- Head -->
  <circle cx="105" cy="95" r="14" fill="#E2B494"/>
  <!-- Hair (Dark, neat) -->
  <path d="M91 95 C91 85 99 81 106 81 C114 81 119 86 119 95 Z" fill="#2D3748"/>

  <!-- Body / Torso leaning back -->
  <path d="M95 105 C100 105 115 115 125 130 L145 155 L125 165 L100 135 C90 120 90 110 95 105 Z" fill="#4C6EF5"/>

  <!-- Arms relaxed -->
  <path d="M115 125 L135 140 L145 135" stroke="#E2B494" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Legs resting casually -->
  <path d="M135 158 L170 162 L185 160" stroke="#4C6EF5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Feet/Slippers -->
  <path d="M180 157 L192 159 C195 159 196 162 194 164 L185 165 Z" fill="#E0A96D"/>

  <!-- Floating Gentle Zzz / Peaceful aura indicators (Minimal, clean flat style) -->
  <g fill="#F4B87E" opacity="0.8">
    <path d="M130 55 L145 55 L133 70 L148 70" stroke="#F4B87E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M152 40 L161 40 L154 49 L163 49" stroke="#F4B87E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Warm floor lamp providing cozy atmosphere on the side -->
  <path d="M45 180 L45 80" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 80 L60 80 L52 60 L38 60 Z" fill="#E0A96D"/>
</svg>