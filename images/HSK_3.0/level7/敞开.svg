<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  
  <!-- Gate Structure -->
  <path d="M40 50 L100 50 L100 200 L40 200 Z" fill="#475569"/>
  <path d="M140 50 L200 50 L200 200 L140 200 Z" fill="#475569"/>
  
  <!-- Gate Details (Open) -->
  <path d="M40 50 L10 80 L10 200 L40 200 Z" fill="#64748b"/>
  <path d="M200 50 L230 80 L230 200 L200 200 Z" fill="#64748b"/>
  
  <!-- Warm Light from inside -->
  <path d="M100 50 L140 50 L140 200 L100 200 Z" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Character -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-30" r="15" fill="#fde68a"/>
    <path d="M-15 -15 L15 -15 L10 20 L-10 20 Z" fill="#38bdf8"/>
    <rect x="-12" y="20" width="8" height="30" fill="#fb923c"/>
    <rect x="4" y="20" width="8" height="30" fill="#fb923c"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="210" cy="40" r="3" fill="#fbbf24"/>
  <path d="M100 50 L140 50" stroke="#f59e0b" stroke-width="2"/>
</svg>