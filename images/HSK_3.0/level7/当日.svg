<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sun representing the specific day -->
  <circle cx="120" cy="80" r="35" fill="#FFB84D"/>
  
  <!-- Calendar page representing "Day" -->
  <rect x="80" y="120" width="80" height="80" rx="8" fill="#2D343E" stroke="#FFB84D" stroke-width="3"/>
  <rect x="80" y="120" width="80" height="20" rx="8" fill="#FFB84D"/>
  
  <!-- Clock hands indicating within the day -->
  <line x1="120" y1="160" x2="120" y2="140" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="160" x2="140" y2="160" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Delivery package icon -->
  <rect x="170" y="170" width="40" height="40" rx="4" fill="#4D94FF"/>
  <path d="M170 180 L210 180" stroke="#1A1D24" stroke-width="2"/>
  <path d="M190 170 L190 210" stroke="#1A1D24" stroke-width="2"/>
  
  <!-- Motion lines for delivery -->
  <path d="M160 190 L130 190" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  <path d="M155 180 L135 180" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
</svg>