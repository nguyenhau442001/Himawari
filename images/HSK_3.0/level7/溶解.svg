<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Table / Surface Gradient -->
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Beaker Glass & Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>
    
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Spoon Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Glow behind scene -->
  <circle cx="120" cy="120" r="80" fill="#38bdf8" opacity="0.07" filter="blur(20px)" />

  <!-- Background Environment (Kitchen / Science Lab Corner) -->
  <!-- Shelf -->
  <rect x="40" y="50" width="160" height="6" rx="3" fill="#475569" />
  
  <!-- Decorative Bottle on Shelf -->
  <path d="M 65 50 L 65 35 C 65 33 67 32 69 32 L 71 32 C 73 32 75 33 75 35 L 75 50 Z" fill="#10b981" opacity="0.8" />
  <rect x="62" y="30" width="12" height="4" rx="1" fill="#047857" />
  
  <!-- Decorative Bottle 2 -->
  <circle cx="170" cy="38" r="10" fill="#f59e0b" opacity="0.8" />
  <rect x="167" y="24" width="6" height="5" fill="#d97706" />

  <!-- Window Frame showing night/evening sky -->
  <rect x="140" y="65" width="65" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="172" y1="65" x2="172" y2="135" stroke="#334155" stroke-width="2" />
  <line x1="140" y1="100" x2="205" y2="100" stroke="#334155" stroke-width="2" />
  <!-- Stars outside -->
  <circle cx="155" cy="80" r="1" fill="#fbbf24" />
  <circle cx="190" cy="85" r="1.5" fill="#fbbf24" />
  <circle cx="160" cy="115" r="1" fill="#fbbf24" />

  <!-- Table Surface -->
  <path d="M 20 180 L 220 180 L 230 220 L 10 220 Z" fill="url(#surfaceGrad)" />
  <!-- Table Top Edge highlight -->
  <rect x="15" y="175" width="210" height="6" rx="3" fill="#475569" />

  <!-- MAIN SCENE: THE BEAKER / GLASS OF WATER -->
  <!-- Beaker Body -->
  <path d="M 95 110 L 90 170 C 90 173 93 175 96 175 L 144 175 C 147 175 150 173 150 170 L 145 110 Z" fill="url(#glassGrad)" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Liquid Inside Beaker -->
  <path d="M 92 125 L 90.5 170 C 90.5 172 92 173.5 94 173.5 L 146 173.5 C 148 173.5 149.5 172 149.5 170 L 148 125 Z" fill="url(#waterGrad)" />

  <!-- Dissolving Process Visuals: Swirling magical/scientific gradient streams representing salt dissolving -->
  <path d="M 115 130 Q 125 140 115 155 Q 105 165 120 170" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M 128 135 Q 118 148 130 160 Q 138 165 125 172" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Little glowing sparkling dissolved particles -->
  <circle cx="110" cy="140" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="132" cy="150" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="120" cy="162" r="2.5" fill="#ffffff" opacity="0.7" />
  <circle cx="138" cy="138" r="1" fill="#ffffff" opacity="0.9" />

  <!-- Falling salt grains from spoon -->
  <circle cx="102" cy="115" r="1.5" fill="#ffffff" />
  <circle cx="106" cy="118" r="1" fill="#ffffff" />
  <circle cx="100" cy="122" r="1.5" fill="#ffffff" />

  <!-- Spoon stirring / holding salt over beaker -->
  <g transform="rotate(-25 120 110)">
    <!-- Spoon Handle -->
    <rect x="117" y="70" width="6" height="50" rx="3" fill="url(#metalGrad)" />
    <!-- Spoon Bowl -->
    <ellipse cx="120" cy="123" rx="8" ry="5" fill="url(#metalGrad)" />
    <!-- Salt mound on spoon -->
    <ellipse cx="120" cy="121" rx="6" ry="3" fill="#ffffff" />
  </g>

  <!-- CHARACTER: Curious, happy experimenter leaning over the table -->
  <g id="character">
    <!-- Torso / Apron / Shirt -->
    <!-- Shoulders & Body -->
    <path d="M 50 200 C 50 175 65 165 85 165 L 115 165 C 135 165 150 175 150 200 Z" fill="url(#shirtGrad)" />
    <!-- Blue Apron -->
    <path d="M 65 172 L 70 200 L 130 200 L 135 172 Z" fill="url(#apronGrad)" />
    <!-- Apron Neck Strap -->
    <path d="M 85 165 Q 100 155 115 165" fill="none" stroke="#0284c7" stroke-width="3" />

    <!-- Head & Face -->
    <g transform="translate(90, 130)">
      <!-- Neck -->
      <rect x="15" y="20" width="10" height="15" fill="#fbcfe8" />
      
      <!-- Head Base -->
      <circle cx="20" cy="5" r="22" fill="#fcd34d" /> <!-- Warm skin tone -->
      <!-- Hair style -->
      <path d="M -2 -2 C -2 -15 10 -22 25 -20 C 40 -18 44 -2 42 10 C 42 10 38 4 30 2 C 22 0 10 3 -2 -2 Z" fill="#334155" />

      <!-- Expressive Happy / Focused Eyes -->
      <circle cx="12" cy="2" r="3" fill="#1e293b" />
      <circle cx="28" cy="2" r="3" fill="#1e293b" />
      <!-- Eye shine -->
      <circle cx="13" cy="1" r="1" fill="#ffffff" />
      <circle cx="29" cy="1" r="1" fill="#ffffff" />

      <!-- Cheeks (Excited pink blush) -->
      <circle cx="8" cy="8" r="4" fill="#f43f5e" opacity="0.3" />
      <circle cx="32" cy="8" r="4" fill="#f43f5e" opacity="0.3" />

      <!-- Cute smiling mouth -->
      <path d="M 16 11 Q 20 16 24 11" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Arms & Hands -->
    <!-- Left arm holding beaker base steady -->
    <path d="M 70 175 Q 80 185 92 170" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" />
    <circle cx="92" cy="170" r="5" fill="#fcd34d" />

    <!-- Right arm reaching forward to pour/hold spoon -->
    <path d="M 130 170 Q 130 135 118 120" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" />
    <circle cx="118" cy="120" r="5" fill="#fcd34d" />
  </g>

  <!-- Foreground Props: Extra Salt Cellar / Bowl on Table -->
  <g transform="translate(45, 175)">
    <ellipse cx="20" cy="15" rx="16" ry="8" fill="#cbd5e1" />
    <ellipse cx="20" cy="13" rx="14" ry="6" fill="#ffffff" />
    <path d="M 4 15 C 4 25 36 25 36 15 Z" fill="#94a3b8" />
  </g>

  <!-- Action Sparkles / Focus Highlights -->
  <path d="M 140 105 L 143 112 L 150 115 L 143 118 L 140 125 L 137 118 L 130 115 L 137 112 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 85 95 L 87 99 L 91 100 L 87 101 L 85 105 L 83 101 L 79 100 L 83 99 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Subtle Rim Light on Beaker Top -->
  <ellipse cx="120" cy="110" rx="25" ry="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
</svg>