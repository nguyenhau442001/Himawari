<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: High-altitude plateau mountain silhouette & harsh cold elements -->
  <path d="M 0,180 L 70,130 L 130,165 L 180,120 L 240,150 L 240,240 L 0,240 Z" fill="#222733"/>
  <path d="M 40,180 L 90,145 L 150,175 L 200,135 L 240,160 L 240,240 L 0,240 Z" fill="#282E3D"/>

  <!-- Frost/Snow caps on mountains -->
  <path d="M 180,120 L 195,135 L 210,128 L 225,142 L 200,135 Z" fill="#434D66" opacity="0.6"/>
  <path d="M 70,130 L 82,143 L 100,133 L 130,165 Z" fill="#434D66" opacity="0.4"/>

  <!-- Environmental harshness: subtle wind/frost lines -->
  <path d="M 30,70 Q 70,60 110,75" stroke="#3A435B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 120,50 Q 160,40 200,60" stroke="#3A435B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 50,95 Q 90,85 130,100" stroke="#3A435B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Focal Object: A resilient, vibrant cold-resistant plant (surviving/thriving in harsh conditions) -->
  <g transform="translate(120, 160)">
    <!-- Soil mound / rocky plateau ground -->
    <ellipse cx="0" cy="15" rx="45" ry="12" fill="#323A4D"/>
    <path d="M -30,15 C -25,22 25,22 30,15 C 20,28 -20,28 -30,15 Z" fill="#222836"/>

    <!-- Plant stem -->
    <path d="M 0,15 Q -2,-5 -5,-25" stroke="#34A853" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 0,15 Q 3,-2 8,-20" stroke="#34A853" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Resilient leaves (Pine/Succulent style rugged vitality) -->
    <!-- Left lower leaf -->
    <path d="M -4,2 Q -22,0 -32,-12 C -22,-8 -12,-5 -4,-2 Z" fill="#4CD964"/>
    <!-- Right lower leaf -->
    <path d="M 2,5 C 18,3 28,-7 35,-18 C 25,-12 12,-8 2,5 Z" fill="#4CD964"/>
    <!-- Left upper leaf -->
    <path d="M -5,-12 C -18,-20 -22,-35 -28,-42 C -18,-32 -10,-22 -5,-12 Z" fill="#34A853"/>
    <!-- Right upper leaf -->
    <path d="M 5,-10 C 18,-18 28,-32 32,-40 C 22,-30 12,-20 5,-10 Z" fill="#34A853"/>
    <!-- Center thriving bud (Golden/Warm accent for focus and life energy) -->
    <path d="M 0,-25 C -5,-35 0,-50 0,-55 C 0,-50 5,-35 0,-25 Z" fill="#FBC02D"/>
    <path d="M -3,-30 C -8,-38 -3,-48 0,-52 C -3,-45 -6,-35 -3,-30 Z" fill="#FFD54F"/>
  </g>

  <!-- Glowing aura of life/survival (subtle warm backlight behind the plant) -->
  <circle cx="120" cy="130" r="35" fill="#FBC02D" opacity="0.08" filter="blur(8px)"/>
</svg>