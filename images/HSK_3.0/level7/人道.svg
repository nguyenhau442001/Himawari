<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1a2e3b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Background Environment (Relief Tent Interior / Aid Station) -->
  <path d="M20 220 L60 90 L180 90 L220 220 Z" fill="#334155" opacity="0.4"/>
  <!-- Tent Poles / Support Structure -->
  <path d="M60 90 L30 220" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 90 L210 220" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 70 L120 220" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

  <!-- Hanging Aid Light / Lantern -->
  <path d="M120 70 L120 95" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="120" cy="100" r="10" fill="#fbbf24" filter="url(#softShadow)"/>
  <path d="M112 100 Q120 120 128 100 Z" fill="#f59e0b"/>

  <!-- Wooden Supply Pallet on Floor -->
  <rect x="25" y="195" width="90" height="15" rx="3" fill="#78350f" filter="url(#softShadow)"/>
  <rect x="30" y="185" width="80" height="12" rx="2" fill="#92400e"/>
  
  <!-- Stack of Humanitarian Aid Boxes -->
  <rect x="35" y="140" width="35" height="45" rx="4" fill="url(#boxGrad)" filter="url(#softShadow)"/>
  <rect x="75" y="145" width="32" height="40" rx="4" fill="url(#boxGrad)" filter="url(#softShadow)"/>
  <!-- Medical Cross Symbol on Box (Stylized vector shape, no text) -->
  <path d="M48 155 L56 155 L56 148 L62 148 L62 155 L70 155 L70 161 L62 161 L62 168 L56 168 L56 161 L48 161 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M87 160 L93 160 L93 155 L97 155 L97 160 L103 160 L103 164 L97 164 L97 169 L93 169 L93 164 L87 164 Z" fill="#ffffff" opacity="0.9"/>

  <!-- CHARACTER 1: Refugee / Recipient (Seated, wrapped in warm blue blanket) -->
  <!-- Chair / Stool -->
  <ellipse cx="140" cy="190" rx="22" ry="6" fill="#475569"/>
  <path d="M125 190 L120 215 M155 190 L160 215" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Body & Blanket -->
  <path d="M125 160 Q120 190 145 195 Q165 190 160 160 Z" fill="url(#blanketGrad)" filter="url(#softShadow)"/>
  <!-- Head & Face (Refugee - expressive warm relief) -->
  <circle cx="140" cy="135" r="14" fill="#f87171"/> <!-- skin tone -->
  <path d="M128 132 Q134 126 140 132" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/> <!-- closed gentle eye -->
  <path d="M136 142 Q140 146 144 142" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/> <!-- gentle smile -->
  <!-- Hair -->
  <path d="M126 132 C126 120 154 120 154 132 C150 127 130 127 126 132 Z" fill="#451a03"/>
  <!-- Blanket wrap over shoulders -->
  <path d="M122 150 Q140 165 158 150 Q162 175 140 180 Q118 175 122 150 Z" fill="url(#blanketGrad)"/>

  <!-- CHARACTER 2: Aid Worker / Volunteer (Standing, handing over warm supplies) -->
  <!-- Worker Legs -->
  <path d="M175 180 L173 220 M187 180 L189 220" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Worker Torso (Vibrant vest / uniform) -->
  <path d="M165 130 L195 135 L190 185 L165 180 Z" fill="#10b981" filter="url(#softShadow)"/>
  <!-- Volunteer Arm (Extended holding supplies/package) -->
  <path d="M170 145 Q150 150 135 155" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
  <path d="M175 140 Q150 130 125 145" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Worker Head -->
  <circle cx="182" cy="110" r="13" fill="#f87171"/>
  <!-- Hair & Cap -->
  <path d="M169 110 C169 100 195 100 195 110 Z" fill="#1e3a8a"/>
  <path d="M167 108 L188 104 L192 110 L167 110 Z" fill="#3b82f6"/> <!-- Cap brim -->
  <!-- Friendly Facial Expression -->
  <circle cx="187" cy="110" r="1.5" fill="#451a03"/>
  <path d="M185 116 Q188 119 191 116" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Relief Item Being Handed Over (Warm food box / package with ribbon) -->
  <g transform="translate(122, 138)">
    <rect x="0" y="0" width="22" height="18" rx="3" fill="#f59e0b" filter="url(#softShadow)"/>
    <rect x="9" y="0" width="4" height="18" fill="#ef4444"/>
    <rect x="0" y="7" width="22" height="4" fill="#ef4444"/>
  </g>

  <!-- Foreground Atmospheric Elements (Soft glowing particles / warmth) -->
  <circle cx="100" cy="120" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="155" cy="100" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="80" cy="105" r="2.5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="130" cy="85" r="1.5" fill="#fef08a" opacity="0.7"/>

  <!-- Outer Frame Stroke for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>