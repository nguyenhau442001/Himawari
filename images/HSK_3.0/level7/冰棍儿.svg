<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Subtle frosty aura / background glow representing coolness -->
    <circle cx="0" cy="0" r="70" fill="#2E384D" opacity="0.5"/>
    
    <!-- Wooden stick -->
    <rect x="-6" y="25" width="12" height="70" rx="6" fill="#D29034"/>
    <rect x="-4" y="25" width="4" height="70" fill="#E6A84C" opacity="0.6"/>

    <!-- Ice pop main body (White sugar popsicle with frosty bite) -->
    <path d="M -30 -60 
             L 30 -60 
             C 41 -60 50 -51 50 -40
             L 50 30
             C 50 38 43 45 35 45
             L -35 45
             C -43 45 -50 38 -50 30
             L -50 -40
             C -50 -51 -41 -60 -30 -60 Z" 
          fill="#F5F7FA"/>

    <!-- Inner texture / frozen highlights -->
    <path d="M -35 -48 L 35 -48" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M -25 -32 L 25 -32" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Frost crystals / sparkles -->
    <path d="M -38 -10 L -34 -10 L -36 -12 L -36 -8 Z" fill="#94A3B8" opacity="0.8"/>
    <path d="M 36 10 L 40 10 L 38 8 L 38 12 Z" fill="#94A3B8" opacity="0.8"/>
    <path d="M -25 20 L -21 20 L -23 18 L -23 22 Z" fill="#94A3B8" opacity="0.7"/>

    <!-- A cute bite taken out of the corner -->
    <path d="M 30 -60 C 40 -60 48 -52 50 -42 C 45 -40 40 -45 35 -40 C 30 -35 25 -42 20 -48 C 22 -55 25 -60 30 -60 Z" fill="#1A1D24"/>
    
    <!-- Highlight on the bite edge (frost effect) -->
    <path d="M 50 -42 C 47 -38 42 -43 37 -38" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Cool vapor lines / refreshing vibe -->
    <path d="M -65 -20 C -70 -25 -70 -35 -65 -40" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 62 0 C 68 -5 68 -15 62 -20" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M -60 15 C -66 10 -66 0 -60 -5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>