<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20) scale(0.833)">
    <!-- Architectural / Engineering Blueprint Background Grid (Subtle) -->
    <path d="M0 60 H200 M0 120 H200 M0 180 H200 M60 0 V200 M120 0 V200 M180 0 V200" stroke="#252A34" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Track/Path 1 (Top / Design Route) -->
    <path d="M 20 70 L 180 70" stroke="#3A435E" stroke-width="8" stroke-linecap="round"/>
    <path d="M 20 70 L 180 70" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/>

    <!-- Track/Path 2 (Bottom / Survey Route - perfectly parallel, synchronized movement) -->
    <path d="M 20 130 L 180 130" stroke="#3A435E" stroke-width="8" stroke-linecap="round"/>
    <path d="M 20 130 L 180 130" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/>

    <!-- Alignment / Synchronization Indicator (Dotted vertical line showing exact parallel step) -->
    <line x1="110" y1="45" x2="110" y2="155" stroke="#FFAB00" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Physical Object 1: Drafting Triangle / Design Tool (Top Object) -->
    <g transform="translate(90, 45)">
      <polygon points="0,50 40,50 0,10" fill="#2E3748" stroke="#FFAB00" stroke-width="3" stroke-linejoin="round"/>
      <!-- Inner cutout detail -->
      <polygon points="8,38 28,38 8,18" fill="#1A1D24"/>
      <!-- Design blueprint lines on icon -->
      <line x1="15" y1="33" x2="25" y2="33" stroke="#00E5FF" stroke-width="2"/>
      <line x1="15" y1="28" x2="20" y2="28" stroke="#00E5FF" stroke-width="2"/>
    </g>

    <!-- Physical Object 2: Surveying Theodolite / Transit Instrument (Bottom Object) -->
    <g transform="translate(95, 105)">
      <!-- Tripod base legs -->
      <line x1="15" y1="25" x2="5" y2="50" stroke="#2E3748" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="25" x2="25" y2="50" stroke="#2E3748" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="25" x2="15" y2="50" stroke="#2E3748" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Instrument body -->
      <circle cx="15" cy="20" r="10" fill="#2E3748" stroke="#FFAB00" stroke-width="3"/>
      <!-- Lens barrel -->
      <rect x="5" y="16" loc="" width="16" height="8" rx="2" fill="#00E5FF" transform="rotate(-15 13 20)"/>
      <!-- Center pivot -->
      <circle cx="15" cy="20" r="3" fill="#FFAB00"/>
    </g>

    <!-- Synchronized Motion Direction Arrows (Rightward) -->
    <g fill="none" stroke="#FFAB00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 165 65 L 175 70 L 165 75"/>
      <path d="M 165 125 L 175 130 L 165 135"/>
    </g>

    <!-- Modern UI Accent Pins (indicating dual simultaneous focus) -->
    <circle cx="110" cy="70" r="4" fill="#FFAB00"/>
    <circle cx="110" cy="130" r="4" fill="#FFAB00"/>

    <!-- Base platform line representing infrastructure construction foundation -->
    <rect x="10" y="175" width="180" height="6" rx="3" fill="#3A435E"/>
    <rect x="20" y="185" width="160" height="4" rx="2" fill="#252A34"/>
  </g>
</svg>