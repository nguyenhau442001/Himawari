<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual illustration for "罢了" (just a minor thing / nothing much / a modest, everyday object representing insignificance/ordinary exam slip) -->
  <!-- We visualize a simple, neat school desk with a routine test paper showing a minor score, brushed aside gently, emphasizing "that's all / nothing serious" -->
  
  <!-- Desk surface -->
  <path d="M40 165 L200 165 L215 190 L25 190 Z" fill="#2D323E"/>
  <path d="M40 165 L200 165 L200 170 L40 170 Z" fill="#3A4150"/>

  <!-- Test Paper (The object representing "普通测验罢了") -->
  <g transform="rotate(-8 120 120)">
    <!-- Paper sheet -->
    <rect x="80" y="70" width="80" height="100" rx="4" fill="#F4F5F7"/>
    <!-- Paper header line -->
    <line x1="92" y1="88" x2="120" y2="88" stroke="#D0D5DD" stroke-width="3" stroke-linecap="round"/>
    <!-- Answer lines -->
    <line x1="92" y1="104" x2="148" y2="104" stroke="#E4E7EC" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="120" x2="140" y2="120" stroke="#E4E7EC" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="136" x2="130" y2="136" stroke="#E4E7EC" stroke-width="2" stroke-linecap="round"/>
    <!-- Ordinary grade mark (not terrible, just average/ordinary) -->
    <circle cx="142" cy="90" r="10" fill="none" stroke="#F05252" stroke-width="2.5"/>
    <path d="M137 90 L141 94 L148 86" fill="none" stroke="#F05252" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hand gently pushing it aside (illustrating dismissal/insignificance: "mà thôi, vậy thôi") -->
  <g transform="translate(15, 10)">
    <!-- Arm / Sleeve -->
    <path d="M160 150 C150 135 140 125 125 115 L140 100 C155 112 170 125 182 145 Z" fill="#3B82F6"/>
    <!-- Hand -->
    <path d="M125 115 C120 112 112 110 106 113 C102 115 100 118 102 122 C104 125 110 126 115 128 C120 130 125 127 125 115 Z" fill="#F7B2A8"/>
    <!-- Fingers resting casually -->
    <path d="M106 113 C102 112 98 114 96 117 C95 120 97 122 101 123" fill="none" stroke="#F7B2A8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Soft floating minimalist motion/dismissal particles (representing "nothing to worry about, just that") -->
  <g fill="#9CA3AF" opacity="0.7">
    <circle cx="65" cy="85" r="3"/>
    <circle cx="55" cy="105" r="2"/>
    <circle cx="75" cy="65" r="1.5"/>
  </g>

  <!-- Accent highlight indicating clarity/reassurance -->
  <path d="M185 65 L193 73 M193 65 L185 73" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>