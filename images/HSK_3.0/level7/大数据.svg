<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 115)">
    <!-- Central E-commerce Shopping Cart Object representing Big Data application context -->
    <path d="M-36 -32 L-24 -32 L-12 16 L28 16 L40 -16 L-20 -16" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-8" cy="28" r="4" fill="#6366F1"/>
    <circle cx="24" cy="28" r="4" fill="#6366F1"/>
    
    <!-- Dynamic Target/Recommendation crosshair overlay -->
    <circle cx="8" cy="-8" r="22" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="8" cy="-8" r="4" fill="#F59E0B"/>

    <!-- Data streams / Analytics nodes swirling into the center -->
    <path d="M-64 -60 C-40 -50 -30 -30 -24 -20" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-64" cy="-60" r="3" fill="#38BDF8"/>
    <circle cx="-24" cy="-20" r="3" fill="#38BDF8"/>

    <path d="M64 -50 C45 -40 30 -25 20 -15" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="64" cy="-50" r="3" fill="#38BDF8"/>

    <path d="M-56 40 C-35 30 -25 15 -12 8" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-56" cy="40" r="3" fill="#38BDF8"/>

    <path d="M60 45 C40 35 25 25 18 16" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="45" r="3" fill="#38BDF8"/>

    <!-- Precise recommendation items floating -->
    <rect x="-8" y="-56" width="16" height="12" rx="2" fill="#F59E0B" transform="rotate(15)"/>
    <rect x="36" y="-8" width="14" height="10" rx="2" fill="#10B981" transform="rotate(-10)"/>
    <rect x="-42" y="2" width="12" height="12" rx="2" fill="#EC4899" transform="rotate(25)"/>
  </g>
</svg>