<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Field boundary / outer structure -->
    <rect x="40" y="50" width="160" height="140" rx="12" fill="#242B38" stroke="#3A4456" stroke-width="3"/>
    
    <!-- Red card representing elimination/chūjú -->
    <g transform="translate(120, 120)">
      <!-- Drop shadow for the card -->
      <rect x="-35" y="-50" width="70" height="100" rx="6" fill="#000000" opacity="0.3" transform="translate(4, 6)"/>
      <!-- Red Card Object -->
      <rect x="-35" y="-50" width="70" height="100" rx="6" fill="#FF4D4D" stroke="#FF8080" stroke-width="2"/>
      <!-- Subtle internal graphic on the card mimicking referee card detail -->
      <rect x="-23" y="-38" width="46" height="76" rx="3" fill="none" stroke="#FF8080" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- Visual motion/exit indicator -->
    <path d="M 175 90 L 195 70 M 195 70 L 182 70 M 195 70 L 195 83" stroke="#FFB800" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>