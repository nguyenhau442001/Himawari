<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Clinic Wall Soft Glow -->
    <radialGradient id="wallGlow" x1="70%" y1="30%" x2="70%" y2="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Labcoat Shadow -->
    <linearGradient id="coatShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Clinic Interior Background -->
  <rect width="240" height="240" rx="24" fill="url(#wallGlow)"/>

  <!-- Background Props: Medical Cabinet & Chart -->
  <!-- Wall Shelf -->
  <rect x="25" y="45" width="60" height="4" rx="2" fill="#334155"/>
  <!-- Medical Folders / Books on Shelf -->
  <path d="M35 45L35 30H42L42 45Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M44 45L44 26H53L53 45Z" fill="#10b981" opacity="0.8"/>
  <path d="M55 45L55 33H63L63 45Z" fill="#f59e0b" opacity="0.8"/>

  <!-- Medical Wall Chart (Heartbeat / Cross) -->
  <rect x="165" y="30" width="45" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M175 50L180 50L183 40L187 60L190 48L193 52L198 50L201 50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="187.5" cy="20" r="0" fill="none"/> <!-- spacer -->
  <!-- Tiny medical cross on chart -->
  <rect x="183" y="35" width="9" height="3" fill="#ef4444" rx="1"/>
  <rect x="186" y="32" width="3" height="9" fill="#ef4444" rx="1"/>

  <!-- Clinic Desk -->
  <rect x="10" y="170" width="220" height="60" rx="6" fill="#0f172a"/>
  <path d="M10 170H230V178H10Z" fill="#334155"/>

  <!-- Desk Props: Stethoscope & Clipboard -->
  <!-- Clipboard -->
  <rect x="165" y="150" width="35" height="45" rx="3" fill="#cbd5e1" transform="rotate(-10 165 150)"/>
  <rect x="170" y="155" width="25" height="35" rx="1" fill="#f8fafc" transform="rotate(-10 165 150)"/>
  <line x1="175" y1="165" x2="190" y2="162" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="175" y1="173" x2="187" y2="170" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="175" y1="181" x2="184" y2="178" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <rect x="175" y="145" width="12" height="6" rx="2" fill="#64748b" transform="rotate(-10 165 150)"/>

  <!-- Stethoscope coiled on desk -->
  <path d="M45 185C45 175 60 175 65 185C70 195 85 190 90 180" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="45" cy="185" r="5" fill="#94a3b8"/>
  <circle cx="90" cy="180" r="7" fill="#cbd5e1"/>

  <!-- MAIN CHARACTER: Sǎozi (Chị dâu - Female Doctor) -->
  <g transform="translate(95, 60)">
    <!-- Body / Lab Coat Base -->
    <!-- Torso & Coat -->
    <path d="M15 75L25 140H65L75 75C75 60 55 55 45 55C35 55 15 60 15 75Z" fill="url(#coatShadow)"/>
    
    <!-- Inner Blue Scrub Top -->
    <path d="M30 75L35 110H55L60 75C60 68 53 65 45 65C37 65 30 68 30 75Z" fill="#0ea5e9"/>
    <path d="M40 65L45 75L50 65Z" fill="#f8fafc"/> <!-- Scrub V-neck inner -->

    <!-- Lab Coat Lapels -->
    <path d="M30 75L38 140H43L36 75Z" fill="#e2e8f0"/>
    <path d="M60 75L52 140H47L54 75Z" fill="#e2e8f0"/>

    <!-- Stethoscope Around Neck -->
    <path d="M33 55C33 55 40 70 45 75C50 70 57 55 57 55" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="76" r="4" fill="#94a3b8"/>

    <!-- Arms & Hands -->
    <!-- Left Arm (Holding clipboard or resting) -->
    <path d="M18 78C10 95 12 120 12 120" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <circle cx="12" cy="123" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (Friendly welcoming gesture) -->
    <path d="M72 78C82 90 85 110 80 115" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <circle cx="78" cy="118" r="5" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="40" y="45" width="10" height="15" rx="3" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <!-- Hair Back/Base -->
    <circle cx="45" cy="38" r="22" fill="#0f172a"/>

    <!-- Face Skin -->
    <circle cx="45" cy="38" r="18" fill="#fbcfe8"/>

    <!-- Friendly Eyes (Happy, gentle curves) -->
    <path d="M37 36C39 38 41 38 43 36" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M47 36C49 38 51 38 53 36" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Gentle Smile -->
    <path d="M41 44C43 47 47 47 49 44" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="36" cy="41" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="54" cy="41" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Stylish Professional Hair (Short bob with side fringe) -->
    <path d="M27 32C25 20 35 15 45 16C55 15 65 20 63 35C63 35 60 50 58 52C56 54 50 48 45 48C40 48 31 54 29 50C27 46 28 38 27 32Z" fill="#1e293b"/>
    <!-- Hair highlight / shine -->
    <path d="M33 22C38 18 48 18 53 22C51 20 42 19 33 22Z" fill="#334155" opacity="0.8"/>

    <!-- Medical Head Mirror / Professional Accent (Subtle headband) -->
    <path d="M28 33C35 28 55 28 62 33" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="58" cy="30" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Foreground Elements / Depth (Medical Plant in Pot) -->
  <rect x="15" y="195" width="22" height="25" rx="3" fill="#334155"/>
  <ellipse cx="26" cy="195" rx="11" ry="4" fill="#475569"/>
  <!-- Plant Leaves -->
  <path d="M26 191C26 175 10 170 10 160C10 170 20 180 26 191Z" fill="#10b981"/>
  <path d="M26 191C26 170 42 165 42 155C42 168 32 178 26 191Z" fill="#059669"/>
  <path d="M26 191C26 180 20 160 28 150C27 165 26 180 26 191Z" fill="#34d399"/>

  <!-- Soft Vignette / Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>