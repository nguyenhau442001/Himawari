<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "不当" (Inappropriate/Improper Management/Physical Object representation) -->
  <!-- We represent this as a physical object: A crooked, faulty mechanical gear/cog mechanism stuck or improperly fitted, symbolizing structural and functional failure/impropriety -->
  
  <g transform="translate(120, 115)">
    <!-- Background glow/shadow -->
    <circle cx="0" cy="0" r="70" fill="#252A34" opacity="0.6"/>
    
    <!-- Broken/Improperly matched structural components (Faulty Machine Part / Gear) -->
    <!-- Large misaligned outer gear -->
    <g transform="rotate(15)">
      <path d="M-45,-20 L-55,-25 L-60,-10 L-50,-2 L-60,6 L-55,21 L-45,16 L-38,28 L-45,40 L-30,45 L-22,35 L-10,43 L-5,58 L10,60 L18,48 L32,55 L40,43 L28,35 L35,21 L50,22 L55,8 L42,0 L52,-12 L45,-26 L30,-22 L22,-35 L8,-28 L2,-42 L-12,-40 L-18,-27 Z" 
            fill="#3A4252" stroke="#E65F2B" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Center warning core (Mismatch / Error indicator) -->
    <circle cx="0" cy="0" r="28" fill="#1A1D24" stroke="#E65F2B" stroke-width="4"/>
    
    <!-- Crossed error mark inside the mechanical core representing "不当" (Improper/Wrong fit) -->
    <path d="M-12,-12 L12,12 M12,-12 L-12,12" stroke="#FF4D4D" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Loose bolts/pins flying off (symbolizing malfunction due to improper management) -->
    <circle cx="-55" cy="-50" r="6" fill="#E65F2B"/>
    <path d="M-60,-55 L-50,-45" stroke="#1A1D24" stroke-width="2"/>
    
    <circle cx="65" cy="40" r="5" fill="#E65F2B"/>
    <path d="M61,36 L69,44" stroke="#1A1D24" stroke-width="2"/>
    
    <circle cx="50" cy="-45" r="7" fill="#3A4252" stroke="#E65F2B" stroke-width="2"/>
  </g>
  
  <!-- Subtle accent base grounding the object -->
  <rect x="70" y="200" width="100" height="4" rx="2" fill="#2A303C"/>
</svg>