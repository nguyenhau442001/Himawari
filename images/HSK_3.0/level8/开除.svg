<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#475569"/>
  <rect x="50" y="150" width="10" height="60" fill="#334155"/>
  <rect x="180" y="150" width="10" height="60" fill="#334155"/>
  
  <!-- The Subject (Employee) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 25 Q20 35 30 25" stroke="#92400e" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="50" rx="5" fill="#38bdf8"/>
    <rect x="0" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
    <rect x="30" y="40" width="10" height="30" rx="2" fill="#38bdf8"/>
  </g>
  
  <!-- The Manager -->
  <g transform="translate(40, 70)">
    <circle cx="20" cy="20" r="15" fill="#fecaca"/>
    <rect x="5" y="40" width="30" height="60" rx="5" fill="#fb923c"/>
    <path d="M10 30 L30 30" stroke="#991b1b" stroke-width="2"/>
  </g>
  
  <!-- The Violation (Paper with Red X) -->
  <rect x="80" y="110" width="40" height="50" rx="2" fill="#f1f5f9"/>
  <path d="M85 115 L115 145 M115 115 L85 145" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The Exit Door -->
  <rect x="180" y="60" width="40" height="120" rx="5" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="190" cy="120" r="3" fill="#fbbf24"/>
  
  <!-- Personal Belongings Box -->
  <rect x="140" y="160" width="30" height="25" rx="2" fill="#d97706"/>
  <rect x="142" y="162" width="26" height="21" rx="1" fill="#f59e0b"/>
  <path d="M145 165 L165 165 M145 170 L165 170" stroke="#92400e" stroke-width="2"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="220" rx="100" ry="10" fill="#000" opacity="0.2"/>
</svg>