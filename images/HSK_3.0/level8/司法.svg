<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Base Platform / Stand -->
    <path d="M95 185 H145 V195 H95 Z" fill="#3A4454" rx="2"/>
    <rect x="114" y="90" width="12" height="95" fill="#3A4454" rx="2"/>
    
    <!-- Central Pillar Top Ring -->
    <circle cx="120" cy="90" r="10" fill="#E5A93B"/>

    <!-- Balance Beam -->
    <path d="M70 78 L170 82 L170 86 L70 82 Z" fill="#E5A93B"/>
    <circle cx="120" cy="82" r="6" fill="#F4D06F"/>

    <!-- Left Scale Pan and Chains -->
    <!-- Chains -->
    <line x1="72" y1="83" x2="52" y2="125" stroke="#E5A93B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="84" x2="108" y2="125" stroke="#E5A93B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pan Bowl -->
    <path d="M42 125 Q80 145 118 125 Z" fill="none" stroke="#E5A93B" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Scale Pan and Chains -->
    <!-- Chains -->
    <line x1="148" y1="85" x2="132" y2="125" stroke="#E5A93B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="168" y1="86" x2="188" y2="125" stroke="#E5A93B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pan Bowl -->
    <path d="M122 125 Q160 145 198 125 Z" fill="none" stroke="#E5A93B" stroke-width="3" stroke-linecap="round"/>

    <!-- Legal Gavel (Symbol of Process/Authority) placed neatly behind/integrated -->
    <g transform="translate(120, 50) rotate(-35)">
      <!-- Gavel Handle -->
      <rect x="-4" y="-25" width="8" height="50" rx="3" fill="#8C6239"/>
      <!-- Gavel Head -->
      <rect x="-18" y="-35" width="36" height="18" rx="4" fill="#A87642"/>
      <!-- Gold accent ring on gavel -->
      <rect x="-14" y="-35" width="4" height="18" fill="#E5A93B"/>
      <rect x="10" y="-35" width="4" height="18" fill="#E5A93B"/>
    </g>
    
    <!-- Glowing Accent Dot (Focus Point) -->
    <circle cx="120" cy="82" r="3" fill="#FFFFFF"/>
  </g>
</svg>