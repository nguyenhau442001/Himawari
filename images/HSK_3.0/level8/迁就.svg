<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Core Principle -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Architectural Background (Office / Meeting Room) -->
  <!-- Back Wall Accent Panel -->
  <rect x="30" y="30" width="180" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Window Grid -->
  <line x1="70" y1="30" x2="70" y2="140" stroke="#334155" stroke-width="1"/>
  <line x1="170" y1="30" x2="170" y2="140" stroke="#334155" stroke-width="1"/>
  <line x1="30" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Hanging Architectural Blueprint / Principle Chart (Symbolizes 'Rules/Principles') -->
  <rect x="90" y="45" width="60" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <line x1="100" y1="57" x2="140" y2="57" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="70" x2="130" y2="70" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="120" y2="80" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="135" cy="80" r="3" fill="#10b981"/>

  <!-- Large Professional Desk -->
  <path d="M 20 185 L 220 185 L 210 155 L 30 155 Z" fill="url(#deskGrad)" stroke="#475569" stroke-width="1.5"/>
  <rect x="25" y="185" width="190" height="8" rx="2" fill="#0f172a"/>

  <!-- Context Props on Desk -->
  <!-- Laptop -->
  <path d="M 100 155 L 140 155 L 145 162 L 95 162 Z" fill="#64748b"/>
  <rect x="103" y="140" width="34" height="15" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Coffee Mug -->
  <rect x="175" y="145" width="12" height="14" rx="2" fill="#38bdf8"/>
  <path d="M 187 148 C 192 148, 192 155, 187 155" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

  <!-- Blueprint / Contract Document (The Core Issue) -->
  <g transform="translate(65, 142) rotate(-6)">
    <rect width="32" height="22" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="5" y1="6" x2="20" y2="6" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="11" x2="27" y2="11" stroke="#64748b" stroke-width="1"/>
    <line x1="5" y1="16" x2="18" y2="16" stroke="#64748b" stroke-width="1"/>
    <circle cx="25" cy="16" r="3" fill="#ef4444"/>
  </g>

  <!-- CHARACTER 1: Firm Professional (Left - Holding Ground / No Compromise) -->
  <g id="character-firm">
    <!-- Body & Torso -->
    <path d="M 45 190 L 45 150 C 45 135, 60 135, 65 150 L 70 190 Z" fill="#1e293b"/>
    <!-- Suit Jacket -->
    <path d="M 46 150 L 58 135 L 70 150 L 63 190 L 53 190 Z" fill="#3b82f6"/>
    <path d="M 58 135 L 53 165 L 58 190 L 63 165 Z" fill="#1d4ed8"/>
    <!-- Shirt collar & tie -->
    <polygon points="55,135 58,142 61,135" fill="#f8fafc"/>
    <polygon points="57,142 59,142 60,158 58,162 56,158" fill="#ef4444"/>

    <!-- Head & Hair -->
    <circle cx="58" cy="115" r="14" fill="#fed7aa"/>
    <!-- Neat Short Hair -->
    <path d="M 44 116 C 44 105, 52 100, 62 101 C 72 102, 72 112, 72 116 Z" fill="#334155"/>

    <!-- Serious Expression -->
    <line x1="52" y1="112" x2="57" y2="114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="114" x2="65" y2="112" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Firm Straight Mouth -->
    <line x1="55" y1="122" x2="62" y2="122" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Firm Arm Gesture (Pointing down firmly to document/principle) -->
    <path d="M 68 142 L 85 155 L 78 162" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="162" r="5" fill="#fed7aa"/>
  </g>

  <!-- CHARACTER 2: Pressuring / Persuading Individual (Right - Asking for Compromise) -->
  <g id="character-pleading">
    <!-- Body & Torso -->
    <path d="M 170 190 L 175 150 C 175 138, 190 138, 195 150 L 200 190 Z" fill="#334155"/>
    <!-- Orange/Amber Shirt -->
    <path d="M 173 150 L 185 133 L 197 150 L 192 190 L 178 190 Z" fill="#f59e0b"/>
    <path d="M 185 133 L 181 165 L 185 190 L 189 165 Z" fill="#d97706"/>

    <!-- Head & Hair -->
    <circle cx="185" cy="113" r="14" fill="#fbcfe8"/>
    <!-- Wavy Styled Hair -->
    <path d="M 171 113 C 171 100, 185 98, 199 105 C 199 110, 197 116, 197 116 C 197 116, 185 106, 171 113 Z" fill="#475569"/>

    <!-- Persuading Expression (Eyebrows raised, pleading smile) -->
    <path d="M 178 109 Q 181 107 184 110" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 187 110 Q 190 107 193 109" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Slightly Open Beseeching Mouth -->
    <path d="M 182 120 Q 186 124 190 120" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Persuading Hands (Open palms pushing gently towards the center, asking to bend rules) -->
    <path d="M 175 150 C 160 152, 150 148, 142 145" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="140" cy="144" r="4.5" fill="#fbcfe8"/>
  </g>

  <!-- VISUAL EMPHASIS: Barrier / Principle Line (Showing "Cannot Cross") -->
  <g transform="translate(112, 105)">
    <!-- Shield / Checkmark / Stop Accent representing Principles -->
    <circle cx="8" cy="20" r="16" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
    <!-- Bold 'X' or Exclamation inside to show firm boundary -->
    <line x1="4" y1="14" x2="12" y2="26" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="4" y2="26" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ambient highlights for glossy app-icon polish -->
  <path d="M 24 24 L 216 24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" stroke-linecap="round"/>
</svg>