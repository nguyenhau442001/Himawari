<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Police Light Beam Gradient Red -->
    <linearGradient id="red-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>

    <!-- Police Light Beam Gradient Blue -->
    <linearGradient id="blue-light" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall & Floor Setup -->
  <path d="M0 0 H240 V160 H0 Z" fill="#1e293b"/>
  <path d="M0 160 H240 V240 H0 Z" fill="url(#floor-grad)"/>
  
  <!-- Baseboard detail -->
  <rect x="0" y="152" width="240" height="8" fill="#0f172a" opacity="0.8"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2"/>

  <!-- Background Context: Display Case / Museum pedestal (Target of theft) -->
  <rect x="150" y="80" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Glass cover (broken/open) -->
  <path d="M150 80 L160 50 H200 L210 80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <!-- Stolen item pedestal glow -->
  <ellipse cx="180" cy="120" rx="18" ry="6" fill="#fbbf24" opacity="0.3"/>
  <circle cx="180" cy="110" r="10" fill="#fbbf24"/>
  <!-- Empty sign/frame -->
  <rect x="165" y="135" width="30" height="15" rx="2" fill="#334155"/>

  <!-- Dramatic Lighting from Police Car / Sirens outside -->
  <polygon points="120,0 240,240 180,240" fill="url(#blue-light)" />
  <polygon points="120,0 0,240 60,240" fill="url(#red-light)" />

  <!-- Character 1: Suspect being arrested (In handcuffs, looking caught) -->
  <g transform="translate(85, 90)">
    <!-- Shadow -->
    <ellipse cx="20" cy="130" rx="22" ry="8" fill="#000000" opacity="0.4"/>

    <!-- Body / Jacket (Orange/Prison or dark casual streetwear) -->
    <path d="M10 50 L30 50 L38 90 L8 90 Z" fill="#f97316"/>
    <!-- Suspect Arms cuffed in front -->
    <path d="M15 55 L35 70 L25 80" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Steel Handcuffs -->
    <circle cx="28" cy="74" r="5" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="25" y1="74" x2="31" y2="74" stroke="#94a3b8" stroke-width="2"/>

    <!-- Legs / Pants -->
    <rect x="12" y="88" width="10" height="42" rx="3" fill="#334155"/>
    <rect x="24" y="88" width="10" height="42" rx="3" fill="#334155"/>
    <!-- Shoes -->
    <path d="M7 126 H15 V132 H7 Z" fill="#0f172a"/>
    <path d="M25 126 H33 V132 H25 Z" fill="#0f172a"/>

    <!-- Head & Face (Shocked, caught expression) -->
    <circle cx="24" cy="30" rx="16" ry="17" fill="#fbcfe8"/>
    <!-- Hair (Messy dark hair) -->
    <path d="M8 26 C10 12, 38 12, 40 26 C36 20, 12 20, 8 26 Z" fill="#0f172a"/>
    <!-- Surprised Eyes -->
    <circle cx="19" cy="28" r="2.5" fill="#0f172a"/>
    <circle cx="29" cy="28" r="2.5" fill="#0f172a"/>
    <!-- Open "O" Mouth of disbelief -->
    <ellipse cx="24" cy="38" rx="3.5" ry="5" fill="#0f172a"/>
    <!-- Sweat drop -->
    <path d="M38 24 C38 24, 43 30, 38 33 C35 33, 35 29, 38 24 Z" fill="#38bdf8"/>
  </g>

  <!-- Character 2: Police Officer (Restraining the suspect) -->
  <g transform="translate(30, 80)">
    <!-- Shadow -->
    <ellipse cx="25" cy="140" rx="20" ry="8" fill="#000000" opacity="0.4"/>

    <!-- Police Uniform Body (Dark Blue) -->
    <path d="M12 50 L38 50 L42 100 L10 100 Z" fill="#1e3a8a"/>
    <!-- Police Badge/Details -->
    <rect x="22" y="60" width="6" height="8" rx="1" fill="#fbbf24"/>
    <line x1="12" y1="50" x2="25" y2="70" stroke="#3b82f6" stroke-width="2"/>
    <line x1="38" y1="50" x2="25" y2="70" stroke="#3b82f6" stroke-width="2"/>

    <!-- Arms -->
    <!-- Arm holding suspect -->
    <path d="M35 55 L60 65" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="62" cy="65" r="5" fill="#fbcfe8"/>

    <!-- Legs -->
    <rect x="14" y="98" width="10" height="42" rx="3" fill="#0f172a"/>
    <rect x="28" y="98" width="10" height="42" rx="3" fill="#0f172a"/>
    <!-- Boots -->
    <path d="M9 136 H17 V142 H9 Z" fill="#020617"/>
    <path d="M25 136 H33 V142 H25 Z" fill="#020617"/>

    <!-- Head & Police Cap -->
    <circle cx="26" cy="30" rx="15" ry="16" fill="#fbcfe8"/>
    <!-- Police Cap -->
    <path d="M10 20 C10 10, 42 10, 42 20 Z" fill="#1e3a8a"/>
    <rect x="8" y="20" width="36" height="5" rx="2" fill="#0f172a"/>
    <!-- Visor -->
    <path d="M12 25 Q26 30 40 25 L38 27 Q26 32 14 27 Z" fill="#0f172a"/>

    <!-- Officer Face (Authoritative, calm) -->
    <circle cx="29" cy="30" r="2" fill="#0f172a"/>
    <path d="M25 38 Q29 41 33 38" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Props / Stolen Loot dropped on floor -->
  <g transform="translate(100, 180)">
    <!-- Dropped necklace/jewel -->
    <path d="M0 10 Q15 -5 30 15" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="15" cy="5" r="6" fill="#ef4444" stroke="#fbbf24" stroke-width="2"/>
    <!-- Small sack of loot -->
    <path d="M50 30 C45 10, 75 10, 70 30 C75 45, 45 45, 50 30 Z" fill="#94a3b8"/>
    <path d="M55 12 Q60 5 65 12" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="58" cy="22" r="3" fill="#334155"/>
  </g>

  <!-- Flashing Emergency Light on top/corner casting ambient glow -->
  <path d="M210 20 L225 40 H195 Z" fill="#ef4444" opacity="0.9"/>
  <ellipse cx="210" cy="40" rx="18" ry="6" fill="#ef4444" opacity="0.5"/>
  <path d="M190 15 L205 35 H175 Z" fill="#38bdf8" opacity="0.9"/>
  <ellipse cx="190" cy="35" rx="18" ry="6" fill="#38bdf8" opacity="0.5"/>

  <!-- Vignette / Frame overlay for polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>