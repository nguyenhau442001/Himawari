<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Warm Light Gradient -->
    <radialGradient id="desk-light" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Folder Glow -->
    <filter id="folder-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Window Light Beam -->
    <linearGradient id="window-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Canvas Container & Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment (Office / Study Room) -->
  <!-- Bookshelf & Back Wall -->
  <rect x="24" y="30" width="192" height="110" fill="#111827" rx="8" />
  <rect x="36" y="42" width="40" height="42" fill="#1f2937" rx="4" />
  <rect x="42" y="50" width="8" height="28" fill="#3b82f6" opacity="0.6" rx="2" />
  <rect x="52" y="55" width="6" height="23" fill="#10b981" opacity="0.6" rx="2" />
  <rect x="60" y="48" width="10" height="30" fill="#f59e0b" opacity="0.6" rx="2" />

  <rect x="82" y="42" width="124" height="42" fill="#1f2937" rx="4" />
  <!-- Plant on shelf -->
  <path d="M 94 72 Q 94 62 102 62 Q 110 62 110 72 Z" fill="#10b981" />
  <path d="M 102 62 Q 98 52 94 56" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 102 62 Q 106 50 112 54" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Window with city silhouette / night atmosphere -->
  <rect x="140" y="38" width="56" height="74" fill="#0b0f19" rx="4" />
  <polygon points="140,112 140,80 196,65 196,112" fill="url(#window-beam)" />
  <rect x="146" y="90" width="8" height="22" fill="#f59e0b" opacity="0.4" />
  <rect x="158" y="75" width="10" height="37" fill="#38bdf8" opacity="0.3" />
  <rect x="172" y="85" width="12" height="27" fill="#f59e0b" opacity="0.5" />

  <!-- Ambient Desk Light Overlay -->
  <circle cx="120" cy="140" r="100" fill="url(#desk-light)" />

  <!-- Wooden Desk Surface -->
  <path d="M 16 160 L 224 160 L 210 205 L 30 205 Z" fill="#334155" />
  <path d="M 16 160 L 224 160 L 224 165 L 16 165 Z" fill="#475569" />

  <!-- Foreground Props: Coffee Mug -->
  <rect x="180" y="145" width="16" height="20" rx="3" fill="#cbd5e1" />
  <path d="M 196 150 C 202 150, 202 160, 196 160" stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 184 140 Q 186 133 182 128" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Central Focus: The Problem File / Document Folder to be "handled" (处置) -->
  <g transform="translate(100, 135)">
    <!-- Folder shadow -->
    <ellipse cx="20" cy="32" rx="28" ry="8" fill="#000000" opacity="0.4" />
    
    <!-- Open Folder Back -->
    <path d="M 0 10 L 15 0 L 35 0 L 50 10 Z" fill="#d97706" />
    
    <!-- Papers inside needing processing -->
    <rect x="8" y="2" width="34" height="24" fill="#f8fafc" rx="1" transform="rotate(-5 25 14)" />
    <!-- Abstract wavy lines representing complex text/issues -->
    <path d="M 12 8 L 30 6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 12 13 L 26 11" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 12 18 L 22 16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Exclamation mark badge hovering above, indicating a decision/handling needed -->
    <circle cx="25" cy="-12" r="9" fill="#ef4444" filter="url(#folder-glow)" />
    <path d="M 25 -16 L 25 -10 M 25 -7 L 25 -6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Folder Front Cover -->
    <path d="M -4 10 L 54 10 L 48 30 L 2 30 Z" fill="#fbbf24" />
  </g>

  <!-- Main Character: Concerned Professional pondering how to handle the situation -->
  <g transform="translate(65, 85)">
    <!-- Character Body / Torso -->
    <path d="M 20 65 C 20 50, 35 45, 55 45 C 75 45, 90 50, 90 65 L 105 105 L 5 105 Z" fill="#2563eb" />
    <!-- Collar / Shirt -->
    <path d="M 43 45 L 55 60 L 67 45 L 55 40 Z" fill="#f8fafc" />
    <path d="M 55 60 L 55 75" stroke="#1d4ed8" stroke-width="2" />

    <!-- Character Neck -->
    <rect x="47" y="32" width="16" height="15" fill="#fcd34d" />

    <!-- Character Head -->
    <circle cx="55" cy="24" r="18" fill="#fcd34d" />

    <!-- Hair -->
    <path d="M 37 24 C 37 12, 47 8, 55 8 C 63 8, 73 12, 73 24 C 73 28, 71 22, 69 16 C 65 10, 57 11, 55 11 C 53 11, 45 10, 41 16 C 39 22, 37 28, 37 24 Z" fill="#334155" />

    <!-- Thoughtful Face Expression -->
    <!-- Eyebrows (furrowed, concerned/thinking) -->
    <path d="M 45 19 Q 50 16 53 20" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 57 20 Q 60 16 65 19" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Eyes (focused downward at the document) -->
    <circle cx="49" cy="23" r="2" fill="#1e293b" />
    <circle cx="61" cy="23" r="2" fill="#1e293b" />

    <!-- Thoughtful Mouth (slight downward curve/pout, pondering) -->
    <path d="M 52 31 Q 55 29 58 31" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Hand 1: Chin resting (classic thinking pose) -->
    <path d="M 45 42 C 40 45, 38 35, 43 31 C 46 29, 49 32, 47 35" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />
    <path d="M 42 34 L 50 34" stroke="#d97706" stroke-width="1" />

    <!-- Arm & Hand 2 resting on desk, pointing or hovering near the document -->
    <path d="M 85 60 C 95 70, 95 85, 85 90" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <circle cx="82" cy="92" r="6" fill="#fcd34d" />
  </g>

  <!-- Lighting & Spark Accents for Problem-Solving / Decision Concept -->
  <g transform="translate(165, 75)">
    <!-- Floating question / dilemma sparks -->
    <path d="M 0 10 Q 5 0, 15 5 Q 25 10, 20 20 Q 15 25, 10 22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="12" cy="28" r="1.5" fill="#38bdf8" opacity="0.6" />
  </g>
</svg>