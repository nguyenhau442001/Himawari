<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Truck Body -->
  <rect x="40" y="120" width="120" height="50" rx="8" fill="#fb923c"/>
  <rect x="160" y="135" width="40" height="35" rx="4" fill="#fb923c"/>
  <circle cx="70" cy="185" r="15" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <circle cx="150" cy="185" r="15" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  
  <!-- Fueling Action -->
  <path d="M180 135 L180 110 L210 110 L210 160" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="210" cy="160" r="8" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(190, 100)">
    <circle cx="10" cy="10" r="12" fill="#fbbf24"/>
    <path d="M0 25 L20 25 L15 50 L5 50 Z" fill="#38bdf8"/>
    <path d="M5 30 L0 45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 30 L20 45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Fuel Pump Station -->
  <rect x="200" y="80" width="30" height="110" rx="4" fill="#64748b"/>
  <rect x="205" y="90" width="20" height="30" rx="2" fill="#10b981"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="50" cy="30" r="2" fill="#fbbf24" opacity="0.4"/>
  <path d="M10 150 L20 140" stroke="#475569" stroke-width="2"/>
</svg>