<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="cityGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lamp Glow -->
  <circle cx="160" cy="80" r="100" fill="url(#lampGlow)"/>

  <!-- Background Office Details -->
  <!-- Window Frame -->
  <path d="M 25,35 L 95,35 L 95,130 L 25,130 Z" fill="url(#cityGlow)" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="35" x2="60" y2="130" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="82" x2="95" y2="82" stroke="#334155" stroke-width="1.5"/>
  <!-- City Skyline Silhouette Outside -->
  <path d="M 30,130 L 30,105 L 40,105 L 40,130 L 50,130 L 50,90 L 65,90 L 65,130 L 75,130 L 75,100 L 90,100 L 90,130 Z" fill="#1e1b4b"/>
  <circle cx="45" cy="98" r="1" fill="#fbbf24"/>
  <circle cx="58" cy="84" r="1" fill="#fbbf24"/>
  <circle cx="82" cy="93" r="1" fill="#fbbf24"/>

  <!-- Bookshelf Background -->
  <rect x="180" y="40" width="35" height="90" fill="#0f172a" rx="2"/>
  <line x1="180" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="100" x2="215" y2="100" stroke="#334155" stroke-width="2"/>
  <!-- Books -->
  <rect x="185" y="52" width="6" height="18" fill="#38bdf8" rx="1"/>
  <rect x="193" y="48" width="8" height="22" fill="#ec4899" rx="1"/>
  <rect x="186" y="78" width="12" height="22" fill="#10b981" rx="1"/>
  <rect x="201" y="82" width="7" height="18" fill="#f59e0b" rx="1"/>

  <!-- Plant Prop -->
  <path d="M 210,135 Q 210,125 215,120 Q 220,125 220,135 Z" fill="#10b981"/>
  <ellipse cx="215" cy="135" rx="8" ry="4" fill="#64748b"/>

  <!-- Office Desk -->
  <rect x="15" y="145" width="210" height="12" fill="#334155" rx="3"/>
  <rect x="30" y="157" width="12" height="60" fill="#1e293b"/>
  <rect x="198" y="157" width="12" height="60" fill="#1e293b"/>

  <!-- Desk Props: Laptop & Charts -->
  <!-- Laptop -->
  <path d="M 115,145 L 155,145 L 163,125 L 107,125 Z" fill="#64748b"/>
  <path d="M 110,145 L 160,145 L 164,148 L 106,148 Z" fill="#475569" rx="1"/>
  <!-- Screen Content (Upward business chart) -->
  <path d="M 112,128 L 150,128 L 146,142 L 116,142 Z" fill="url(#screenGrad)"/>
  <polyline points="118,139 125,136 132,137 141,130 146,129" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coffee Mug -->
  <rect x="85" y="132" width="12" height="13" fill="#cbd5e1" rx="2"/>
  <path d="M 97,135 C 101,135 101,141 97,141" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Wealth / Success Props: Treasure Chest / Gold Coins & Growth -->
  <!-- Open Treasure Box on Desk -->
  <path d="M 45,135 L 75,135 L 72,145 L 48,145 Z" fill="#92400e"/>
  <path d="M 43,132 L 77,132 L 75,136 L 45,136 Z" fill="#b45309"/>
  <path d="M 46,123 L 74,123 L 77,132 L 43,132 Z" fill="#78350f"/>
  <rect x="57" y="132" width="6" height="4" fill="#fbbf24"/>
  
  <!-- Overflowing Gold Coins & Rising Stack -->
  <circle cx="53" cy="130" r="4" fill="url(#goldCoin)"/>
  <circle cx="58" cy="128" r="4.5" fill="url(#goldCoin)"/>
  <circle cx="64" cy="129" r="4" fill="url(#goldCoin)"/>
  <circle cx="69" cy="131" r="3.5" fill="url(#goldCoin)"/>
  <circle cx="56" cy="124" r="4" fill="url(#goldCoin)"/>
  <circle cx="62" cy="124" r="4.5" fill="url(#goldCoin)"/>
  <circle cx="59" cy="119" r="4" fill="url(#goldCoin)"/>

  <!-- Rising Growth Arrow / Success Indicator floating -->
  <path d="M 185,115 L 205,95 L 205,103 M 205,95 L 197,95" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 165,130 Q 175,115 190,105" fill="none" stroke="#fbbf24" stroke-dasharray="3,3" stroke-width="2"/>

  <!-- Main Character: Successful Entrepreneur / Business Man -->
  <!-- Chair Back -->
  <rect x="100" y="80" width="26" height="70" fill="#334155" rx="6"/>
  
  <!-- Character Torso (leaning back happily with arms raised) -->
  <path d="M 92,120 L 124,120 L 132,160 L 84,160 Z" fill="#2563eb"/> <!-- Suit Jacket -->
  <path d="M 100,120 L 108,145 L 116,120 Z" fill="#f8fafc"/> <!-- Shirt & Tie V -->
  <polygon points="108,130 106,145 110,145" fill="#ef4444"/> <!-- Red Tie -->

  <!-- Character Arms Raised in Celebration -->
  <!-- Left Arm -->
  <path d="M 90,122 L 72,105 L 64,112 L 82,130 Z" fill="#2563eb"/>
  <circle cx="62" cy="110" r="6" fill="#fbcfe8"/> <!-- Left Hand -->
  
  <!-- Right Arm -->
  <path d="M 126,122 L 144,102 L 152,110 L 134,130 Z" fill="#2563eb"/>
  <circle cx="154" cy="108" r="6" fill="#fbcfe8"/> <!-- Right Hand -->

  <!-- Character Neck -->
  <rect x="103" y="112" width="10" height="10" fill="#fbcfe8"/>

  <!-- Character Head (Joyful Expression) -->
  <circle cx="108" cy="94" r="16" fill="#fbcfe8"/>
  
  <!-- Hair (Stylish modern cut) -->
  <path d="M 92,94 C 92,80 124,80 124,94 C 122,88 116,84 108,84 C 100,84 94,88 92,94 Z" fill="#0f172a"/>

  <!-- Face Details: Happy closed smiling eyes (^ ^) and big open smile -->
  <path d="M 100,92 Q 104,88 107,92" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 110,92 Q 113,88 117,92" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Glasses (Smart entrepreneur look) -->
  <rect x="97" y="88" width="10" height="7" rx="1" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <rect x="109" y="88" width="10" height="7" rx="1" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <line x1="107" y1="91" x2="109" y2="91" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- Big Smile -->
  <path d="M 102,99 Q 108,105 114,99" fill="#ef4444" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Floating Sparkles / Celebration Effects -->
  <path d="M 75,85 L 78,92 L 85,95 L 78,98 L 75,105 L 72,98 L 65,95 L 72,92 Z" fill="#fbbf24"/>
  <path d="M 140,75 L 142,80 L 147,82 L 142,84 L 140,89 L 138,84 L 133,82 L 138,80 Z" fill="#fbbf24"/>
  <circle cx="145" cy="65" r="3" fill="#38bdf8"/>
  <circle cx="70" cy="70" r="2.5" fill="#10b981"/>

  <!-- Desk Lamp in Foreground Right -->
  <path d="M 185,145 L 195,145 L 193,110 L 187,110 Z" fill="#64748b"/>
  <path d="M 175,105 L 205,105 L 200,92 L 180,92 Z" fill="#f59e0b"/>
</svg>