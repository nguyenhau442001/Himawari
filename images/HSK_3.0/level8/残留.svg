<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="175" width="10" height="50" fill="#334155"/>
  <rect x="190" y="175" width="10" height="50" fill="#334155"/>
  
  <!-- Fruit Bowl -->
  <path d="M60 160 Q60 190 100 190 Q140 190 140 160" fill="#fb923c" opacity="0.8"/>
  
  <!-- Apple -->
  <circle cx="85" cy="145" r="25" fill="#ef4444"/>
  <path d="M85 120 L88 110 M85 120 L82 110" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pesticide Spray Bottle -->
  <rect x="160" y="100" width="30" height="60" rx="4" fill="#38bdf8"/>
  <rect x="165" y="85" width="20" height="15" rx="2" fill="#38bdf8"/>
  <rect x="172" y="75" width="6" height="10" fill="#94a3b8"/>
  
  <!-- Residue Particles (The "残留") -->
  <circle cx="95" cy="130" r="3" fill="#fbbf24"/>
  <circle cx="105" cy="140" r="2" fill="#fbbf24"/>
  <circle cx="75" cy="135" r="2" fill="#fbbf24"/>
  <circle cx="85" cy="125" r="3" fill="#fbbf24"/>
  
  <!-- Character: Concerned Person -->
  <g transform="translate(150, 140)">
    <circle cx="20" cy="20" r="25" fill="#fde68a"/>
    <path d="M10 15 Q15 10 20 15 M30 15 Q35 10 40 15" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M15 30 Q25 35 35 30" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="5" y="45" width="30" height="50" rx="10" fill="#38bdf8"/>
    <rect x="0" y="50" width="10" height="30" rx="3" fill="#fde68a"/>
    <rect x="30" y="50" width="10" height="30" rx="3" fill="#fde68a"/>
  </g>
  
  <!-- Magnifying Glass -->
  <circle cx="100" cy="140" r="15" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  <rect x="110" y="150" width="25" height="5" rx="2" fill="#e2e8f0" transform="rotate(45 110 150)"/>
