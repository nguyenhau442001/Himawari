<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow for price tag focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="120" r="50" fill="#2D3446" opacity="0.4"/>

  <!-- Price Tag Body -->
  <path d="M 85,75 
           L 180,75 
           C 185,75 190,80 190,85 
           L 190,155 
           C 190,160 185,165 180,165 
           L 85,165 
           C 80,165 60,125 60,120 
           C 60,115 85,75 85,75 Z" 
        fill="#FF9F43"/>

  <!-- Price Tag Hole Ring -->
  <circle cx="165" cy="120" r="10" fill="#1A1D24"/>
  <circle cx="165" cy="120" r="6" fill="#FF9F43"/>

  <!-- Unit Indicator / Singular Focus Icon (Single item / '1' representation) -->
  <!-- Box/Item graphic inside the tag -->
  <rect x="85" y="100" width="40" height="40" rx="6" fill="#FFFFFF" opacity="0.15"/>
  
  <!-- Sleek minimalist currency & unit symbol lines (Abstract representation of single-unit pricing) -->
  <!-- Currency symbol '¥' stylized cleanly -->
  <path d="M 98,98 L 112,122 M 126,98 L 112,122 M 102,122 L 122,122 M 102,134 L 122,134" 
        stroke="#1A1D24" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Accent dot highlighting "Unit/Single" concept -->
  <circle cx="145" cy="120" r="5" fill="#1A1D24"/>

  <!-- Shadow details for depth -->
  <path d="M 85,166 C 80,166 61,126 61,120 C 61,120 62,122 65,126 C 72,135 85,165 85,165 Z" fill="#D35400" opacity="0.5"/>
</svg>