<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: Dense grass tufts in dark theme -->
  <g fill="#252D3D" opacity="0.8">
    <path d="M20 240 L35 150 L50 240 Z"/>
    <path d="M45 240 L65 130 L85 240 Z"/>
    <path d="M160 240 L180 140 L200 240 Z"/>
    <path d="M185 240 L205 160 L225 240 Z"/>
  </g>

  <!-- Ground layer -->
  <path d="M0 200 Q 120 185 240 200 L 240 240 L 0 240 Z" fill="#14171E"/>

  <!-- The Hidden Cave (Safe 'Cangshen' location) -->
  <path d="M80 200 C80 140 100 120 120 120 C140 120 160 140 160 200 Z" fill="#0D0F12"/>
  <path d="M95 200 C95 155 107 140 120 140 C133 140 145 155 145 200 Z" fill="#090A0D"/>

  <!-- Foreground lush grass blades (overlapping the cave entrance contextually) -->
  <g fill="#2C3648">
    <path d="M10 240 Q 20 170 30 240 Z"/>
    <path d="M25 240 Q 40 155 55 240 Z"/>
    <path d="M15 240 Q 30 180 40 240 Z"/>
    
    <path d="M200 240 Q 210 160 220 240 Z"/>
    <path d="M215 240 Q 225 175 235 240 Z"/>
    <path d="M185 240 Q 195 150 205 240 Z"/>
  </g>

  <!-- Detailed bright grass tips catching the ambient light -->
  <g fill="#3B4A62">
    <path d="M50 240 Q 60 160 70 240 Z"/>
    <path d="M170 240 Q 180 155 190 240 Z"/>
  </g>

  <!-- The Small Cute Animal (Safe inside its hiding spot, focused subject) -->
  <!-- Body/Fur (warm amber/gold accent for contrast against dark theme) -->
  <ellipse cx="120" cy="180" rx="18" ry="15" fill="#E6953C"/>
  <!-- Head -->
  <circle cx="120" cy="162" rx="13" fill="#E6953C"/>
  <!-- Ears -->
  <polygon points="110,152 113,140 118,153" fill="#E6953C"/>
  <polygon points="130,152 127,140 122,153" fill="#E6953C"/>
  <polygon points="112,151 114,143 117,152" fill="#F4B063"/>
  <polygon points="128,151 126,143 123,152" fill="#F4B063"/>
  <!-- Cute tucked paws -->
  <circle cx="112" cy="190" r="4" fill="#D2822B"/>
  <circle cx="128" cy="190" r="4" fill="#D2822B"/>
  <!-- Closed happy/safe eyes (curved lines) -->
  <path d="M115 161 Q 117 159 119 161" stroke="#221C16" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M121 161 Q 123 159 125 161" stroke="#221C16" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Tiny nose & smile -->
  <circle cx="120" cy="164" r="1.5" fill="#221C16"/>
  
  <!-- Soft warm glow highlighting the safe shelter space -->
  <circle cx="120" cy="170" r="35" fill="#E6953C" opacity="0.12" style="mix-blend-mode: screen;"/>
</svg>