<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Warm Desk Lamp Cone -->
    <linearGradient id="lampCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Table Top Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Document/Contract Gradients -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- BACKGROUND ARCHITECTURE & ENVIRONMENT -->
  <!-- Office Back Wall -->
  <rect x="20" y="20" width="200" height="125" rx="6" fill="#131c31" />

  <!-- Accent Wall Panel -->
  <rect x="35" y="30" width="100" height="95" rx="4" fill="#1a2744" opacity="0.6"/>

  <!-- Large Window (Cityscape Night View) -->
  <rect x="145" y="30" width="65" height="90" rx="4" fill="url(#windowGrad)" />
  <!-- Window Grid Lines -->
  <line x1="177" y1="30" x2="177" y2="120" stroke="#0f172a" stroke-width="2" />
  <line x1="145" y1="75" x2="210" y2="75" stroke="#0f172a" stroke-width="2" />
  <!-- Tiny City Lights outside window -->
  <rect x="153" y="90" width="6" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="165" y="85" width="8" height="20" rx="1" fill="#fbbf24" opacity="0.5"/>
  <rect x="185" y="95" width="5" height="15" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="195" y="82" width="7" height="25" rx="1" fill="#f43f5e" opacity="0.5"/>

  <!-- Indoor Ambient Plant -->
  <circle cx="50" cy="115" r="10" fill="#065f46" />
  <circle cx="45" cy="107" r="8" fill="#047857" />
  <circle cx="55" cy="108" r="9" fill="#10b981" />
  <!-- Pot -->
  <path d="M42 120 L58 120 L55 132 L45 132 Z" fill="#64748b" />

  <!-- Ceiling Light Fixture / Pendant -->
  <line x1="120" y1="20" x2="120" y2="45" stroke="#475569" stroke-width="2"/>
  <path d="M105 45 L135 45 L140 52 L100 52 Z" fill="#38bdf8" />
  <polygon points="90,145 150,145 170,220 70,220" fill="url(#lampCone)" />

  <!-- DESK & PROPS LAYER -->
  <!-- Main Conference Table -->
  <path d="M25 145 L215 145 L225 165 L15 165 Z" fill="url(#deskGrad)" />
  <!-- Table Highlight Edge -->
  <path d="M15 165 L225 165 L225 168 L15 168 Z" fill="#475569" />

  <!-- Central Negotiation Props: Blueprints, Documents, Folders & Pen -->
  <!-- Folder 1 -->
  <path d="M85 150 L125 148 L130 162 L90 164 Z" fill="#3b82f6" />
  <!-- Contract Document with abstract detail lines -->
  <path d="M100 142 L145 140 L148 158 L103 160 Z" fill="url(#docGrad)" />
  <line x1="108" y1="147" x2="135" y2="146" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="151" x2="130" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="155" x2="120" y2="154" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Red Seal/Stamp on document -->
  <circle cx="138" cy="153" r="4" fill="#ef4444" opacity="0.8"/>

  <!-- Coffee Cup -->
  <rect x="72" y="146" width="10" height="13" rx="2" fill="#f8fafc" />
  <path d="M82 149 C85 149 85 155 82 156" fill="none" stroke="#f8fafc" stroke-width="1.5" />
  <ellipse cx="77" cy="146" rx="5" ry="1.5" fill="#78350f" />

  <!-- Laptop Open -->
  <path d="M150 140 L180 140 L185 158 L145 158 Z" fill="#cbd5e1" />
  <path d="M140 158 L190 158 L195 162 L135 162 Z" fill="#64748b" />
  <rect x="152" y="142" width="26" height="14" rx="1" fill="#0f172a" />

  <!-- CHARACTERS LAYER (TWO PARTIES NEGOTIATING) -->
  
  <!-- LEFT CHARACTER (Professional in Teal/Navy) -->
  <!-- Chair Back -->
  <path d="M30 115 L50 115 L55 160 L25 160 Z" fill="#1e293b" />
  <!-- Body/Torso -->
  <path d="M32 135 C32 120 48 120 52 135 L58 155 L26 155 Z" fill="#0d9488" />
  <!-- Collar & Neck -->
  <path d="M40 123 L44 130 L48 123 Z" fill="#f8fafc" />
  <rect x="40" y="116" width="8" height="8" rx="3" fill="#fed7aa" />
  <!-- Head -->
  <circle cx="44" cy="106" r="13" fill="#fed7aa" />
  <!-- Hair (Neat dark brown styled hair) -->
  <path d="M32 105 C32 95 56 95 56 105 C56 102 54 98 44 98 C34 98 32 102 32 105 Z" fill="#292524" />
  <!-- Facial expression: Focused, friendly engagement -->
  <circle cx="48" cy="106" r="1.5" fill="#1c1917" />
  <!-- Gentle smile / talking gesture -->
  <path d="M47 111 C48 113 50 113 51 111" fill="none" stroke="#1c1917" stroke-width="1" stroke-linecap="round"/>
  <!-- Glasses -->
  <rect x="45" y="103" width="5" height="4" rx="1" fill="none" stroke="#0f172a" stroke-width="1"/>

  <!-- Left Arm gesturing actively towards documents (磋商 - negotiation gesture) -->
  <path d="M42 133 C42 133 60 135 72 144" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="74" cy="145" r="3.5" fill="#fed7aa" />


  <!-- RIGHT CHARACTER (Professional in Amber/Warm Suit) -->
  <!-- Chair Back -->
  <path d="M190 115 L210 115 L215 160 L185 160 Z" fill="#1e293b" />
  <!-- Body/Torso -->
  <path d="M188 135 C188 120 204 120 208 135 L214 155 L182 155 Z" fill="#d97706" />
  <!-- Inner shirt & tie -->
  <path d="M196 123 L200 130 L204 123 Z" fill="#f8fafc" />
  <polygon points="199,127 201,127 202,135 200,138 198,135" fill="#b91c1c" />
  <rect x="196" y="116" width="8" height="8" rx="3" fill="#fde047" />
  <!-- Head -->
  <circle cx="200" cy="106" r="13" fill="#fde047" />
  <!-- Hair (Short modern swept-back hair) -->
  <path d="M188 106 C188 96 212 96 212 106 C212 100 208 97 200 97 C192 97 188 100 188 106 Z" fill="#451a03" />
  <!-- Facial expression: Pondering / agreeing / listening closely -->
  <circle cx="195" cy="106" r="1.5" fill="#1c1917" />
  <!-- Subtle thoughtful expression line -->
  <path d="M194 112 C197 114 200 114 203 112" fill="none" stroke="#1c1917" stroke-width="1" stroke-linecap="round"/>

  <!-- Right Arm resting / pointing slightly on desk (Active collaboration) -->
  <path d="M202 133 C202 133 185 138 165 146" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="162" cy="147" r="3.5" fill="#fde047" />

  <!-- FOREGROUND VECTORS & ATMOSPHERE -->
  <!-- Ambient glowing particles representing active ideas/discussion -->
  <circle cx="115" cy="125" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="130" cy="115" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="123" cy="135" r="1" fill="#ec4899" opacity="0.7"/>

  <!-- Subtle bottom vignette shadow for depth -->
  <rect x="0" y="225" width="240" height="15" fill="#090d16" opacity="0.5"/>
</svg>