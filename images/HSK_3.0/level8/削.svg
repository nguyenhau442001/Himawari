<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/vignette behind the action -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Motion lines representing the peeling action -->
  <path d="M 85 85 C 70 80, 55 90, 45 110" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8" fill="none"/>
  <path d="M 90 95 C 75 90, 62 100, 52 120" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- The Apple being peeled -->
  <g id="apple">
    <!-- Apple Body -->
    <path d="M 120 95 C 135 90, 150 105, 145 125 C 140 145, 125 155, 120 155 C 115 155, 100 145, 95 125 C 90 105, 105 90, 120 95 Z" fill="#FF5252"/>
    <!-- Apple Highlight -->
    <path d="M 110 105 C 115 102, 122 105, 120 115 C 118 112, 112 110, 110 105 Z" fill="#FF8A80" opacity="0.6"/>
    <!-- Apple Stem -->
    <path d="M 120 95 Q 124 85, 130 82" stroke="#8D6E63" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Apple Leaf -->
    <path d="M 124 88 C 132 84, 138 90, 134 96 C 130 96, 126 92, 124 88 Z" fill="#4CAF50"/>
  </g>

  <!-- Peeling Ribbon (The Action Effect: 削) -->
  <path d="M 135 110 C 150 115, 165 130, 150 145 C 135 160, 100 160, 85 145" stroke="#FFE082" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Character Hand holding Knife and Peeling -->
  <g id="character-hand-and-knife">
    <!-- Knife Blade -->
    <path d="M 130 110 L 165 125 L 138 120 Z" fill="#E0E0E0"/>
    <!-- Knife Edge highlight -->
    <path d="M 130 110 L 165 125" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    <!-- Knife Handle -->
    <path d="M 120 105 L 132 112 L 128 116 L 116 109 Z" fill="#424242"/>

    <!-- Hand holding knife -->
    <!-- Fingers wrapped around handle -->
    <path d="M 115 115 C 118 110, 124 112, 126 117 C 128 122, 122 126, 118 124 Z" fill="#FFCCBC"/>
    <circle cx="114" cy="118" r="4" fill="#FFCCBC"/>
    <path d="M 112 122 C 114 125, 118 124, 120 121" stroke="#E57373" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Sleeve / Arm -->
    <path d="M 110 130 L 90 160 L 110 170 L 130 140 Z" fill="#5C6BC0"/>
  </g>

  <!-- Other Hand holding the Apple -->
  <g id="supporting-hand">
    <path d="M 95 130 C 85 135, 80 145, 85 155 C 90 165, 105 165, 115 155" fill="#FFCCBC"/>
    <path d="M 105 150 L 120 155 L 115 162 L 100 158 Z" fill="#FFCCBC"/>
    <!-- Sleeve -->
    <path d="M 75 160 L 95 185 L 115 175 L 95 150 Z" fill="#5C6BC0"/>
  </g>

</svg>