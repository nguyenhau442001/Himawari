<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background with atmospheric dusk/ruins gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="dustGlow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric background glow -->
  <circle cx="170" cy="80" r="100" fill="url(#dustGlow)"/>

  <!-- Distant skyline silhouettes of ruined city structures -->
  <path d="M15 190 L15 150 L35 150 L35 190 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M30 190 L30 110 L55 125 L55 190 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M185 190 L185 130 L210 120 L210 190 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M205 190 L205 100 L230 110 L230 190 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Ground plane & debris base -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a"/>

  <!-- THE RUINS (Foreground and midground collapsed architecture) -->
  <!-- Broken wall left -->
  <path d="M0 190 L0 80 L35 95 L25 140 L45 190 Z" fill="url(#wallGrad)"/>
  <!-- Wall cracks & details -->
  <path d="M15 95 L22 120 L18 150" stroke="#1e293b" stroke-width="2" fill="none"/>
  <!-- Broken window frame hanging -->
  <rect x="10" y="105" width="15" height="25" rx="2" fill="none" stroke="#64748b" stroke-width="2" transform="rotate(15 17 117)"/>

  <!-- Massive collapsed pillar / concrete slabs -->
  <polygon points="50,190 95,140 120,155 75,205" fill="#64748b"/>
  <polygon points="95,140 110,120 135,135 120,155" fill="#475569"/>
  <!-- Exposed rebars (metal rods) -->
  <path d="M110,120 L125,105 M115,123 L133,112 M107,125 L120,115" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Rubble piles & broken bricks -->
  <circle cx="60" cy="185" r="7" fill="#ef4444" opacity="0.8"/>
  <rect x="75" y="180" width="14" height="9" rx="1" fill="#dc2626" transform="rotate(-15 82 184)"/>
  <rect x="135" y="182" width="12" height="8" rx="1" fill="#b91c1c" transform="rotate(25 141 186)"/>
  <circle cx="155" cy="188" r="6" fill="#991b1b"/>
  <rect x="170" y="178" width="16" height="10" rx="1" fill="#ef4444" transform="rotate(-10 178 183)"/>
  <polygon points="190,190 215,165 230,190" fill="#475569"/>

  <!-- Dangling steel beam -->
  <path d="M160,50 L200,125" stroke="url(#beamGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="50" r="4" fill="#334155"/>

  <!-- Environmental dust particles / glowing embers -->
  <circle cx="95" cy="95" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="130" cy="70" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="110" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="70" cy="130" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="145" cy="155" r="2" fill="#fbbf24" opacity="0.9"/>

  <!-- CHARACTER: Explorer / Observer witnessing the ruins -->
  <g transform="translate(95, 105)">
    <!-- Shadow -->
    <ellipse cx="25" cy="86" rx="14" ry="4" fill="#0f172a" opacity="0.6"/>

    <!-- Backpack -->
    <rect x="12" y="32" width="12" height="20" rx="4" fill="#d97706"/>
    <path d="M15 32 L15 50" stroke="#b45309" stroke-width="2"/>

    <!-- Legs -->
    <path d="M21 60 L18 83 L14 85" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29 60 L32 82 L36 84" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Boots -->
    <path d="M10 84 L16 85 L16 88 L10 88 Z" fill="#334155"/>
    <path d="M34 83 L40 84 L40 87 L34 87 Z" fill="#334155"/>

    <!-- Torso (jacket) -->
    <path d="M16 28 L34 28 L38 60 L12 60 Z" fill="#3b82f6"/>
    <!-- Jacket collar & zipper line -->
    <path d="M25 28 L25 55" stroke="#1d4ed8" stroke-width="2"/>
    <path d="M18 28 L25 35 L32 28" fill="#2563eb"/>

    <!-- Head & Cap -->
    <circle cx="25" cy="20" r="9" fill="#fde047"/>
    <!-- Cap/Helmet -->
    <path d="M15 16 C15 10 35 10 35 16 Z" fill="#f59e0b"/>
    <path d="M13 16 L37 16 L35 19 L15 19 Z" fill="#d97706"/>

    <!-- Arms (holding binoculars / hands up in astonishment) -->
    <!-- Back arm -->
    <path d="M16 32 L7 42 L12 46" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front arm holding binoculars to eyes -->
    <path d="M34 32 L40 40 L35 44" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Binoculars -->
    <rect x="36" y="41" width="10" height="6" rx="2" fill="#1e293b" transform="rotate(-20 41 44)"/>
  </g>

  <!-- Nature reclaiming the ruins (Vines/leaves) -->
  <path d="M0 190 Q 15 160, 10 130 T 25 95" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="8" cy="150" r="3" fill="#34d399"/>
  <circle cx="14" cy="120" r="2.5" fill="#34d399"/>
  
  <path d="M240 190 Q 220 160, 225 140 T 215 110" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="222" cy="155" r="3" fill="#34d399"/>

  <!-- Foreground atmospheric dust motes -->
  <circle cx="110" cy="120" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="135" cy="100" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="85" cy="140" r="1" fill="#ffffff" opacity="0.5"/>
</svg>