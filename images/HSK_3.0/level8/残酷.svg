<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Ruins -->
  <path d="M40 200 L40 120 L70 90 L100 130 L130 80 L160 110 L190 70 L210 100 L210 200 Z" fill="#334155"/>
  <rect x="50" y="140" width="30" height="40" fill="#475569"/>
  <rect x="150" y="120" width="40" height="60" fill="#475569"/>
  
  <!-- Smoke/Dust -->
  <circle cx="120" cy="100" r="25" fill="#475569" opacity="0.6"/>
  <circle cx="150" cy="80" r="20" fill="#475569" opacity="0.4"/>
  
  <!-- Character: Soldier looking at a broken toy -->
  <g transform="translate(80, 130)">
    <!-- Body -->
    <path d="M20 100 L20 60 Q20 40 40 40 L60 40 Q80 40 80 60 L80 100" fill="#64748b"/>
    <!-- Head -->
    <circle cx="50" cy="35" r="15" fill="#fde68a"/>
    <!-- Helmet -->
    <path d="M35 30 Q50 15 65 30 L65 35 L35 35 Z" fill="#475569"/>
    <!-- Arms -->
    <path d="M25 60 L10 80" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M75 60 L90 80" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Holding Toy -->
    <rect x="85" y="75" width="15" height="15" fill="#fb923c" rx="2"/>
  </g>
  
  <!-- Debris/Ground -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="210" width="20" height="5" fill="#475569" rx="2"/>
  <rect x="180" y="220" width="30" height="5" fill="#475569" rx="2"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="120" r="120" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>