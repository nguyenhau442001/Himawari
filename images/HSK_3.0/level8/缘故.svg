<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Gears representing cause, mechanism, reason behind an action -->
    <g transform="translate(120, 100)">
      <!-- Large background gear -->
      <path d="M 0 -55 L 8 -52 L 14 -42 L 24 -43 L 30 -52 L 39 -48 L 41 -37 L 50 -36 L 52 -25 L 61 -22 L 59 -12 L 67 -5 L 63 4 L 70 12 L 63 20 L 68 29 L 59 35 L 62 45 L 52 50 L 52 61 L 41 61 L 38 71 L 28 68 L 23 77 L 13 72 L 9 81 L -1 75 L -4 84 L -14 78 L -16 87 L -26 80 L -27 89 L -37 81 L -37 90 L -47 81 L -45 68 L -55 60 L -51 51 L -61 41 L -55 33 L -63 24 L -56 16 L -63 8 L -56 0 L -62 -8 L -55 -16 L -61 -25 L -52 -31 L -56 -41 L -46 -46 L -48 -56 L -38 -58 L -38 -68 L -28 -68 L -25 -77 L -15 -74 L -10 -83 L 0 -77 Z" fill="#2A303C" opacity="0.6"/>
      
      <!-- Medium Accent Gear (Gold/Orange for focus) -->
      <g transform="translate(-15, -10) rotate(15)">
        <circle cx="0" cy="0" r="32" fill="#1A1D24"/>
        <path d="M0 -42 L 7 -40 L 12 -31 L 21 -33 L 26 -25 L 34 -24 L 35 -15 L 42 -12 L 40 -3 L 47 0 L 40 8 L 44 16 L 37 22 L 39 30 L 31 35 L 30 43 L 22 45 L 18 53 L 9 52 L 3 59 L -6 56 L -10 63 L -19 58 L -21 65 L -30 58 L -30 49 L -39 45 L -37 36 L -45 30 L -41 21 L -48 14 L -43 6 L -48 -2 L -41 -9 L -45 -18 L -37 -23 L -39 -32 L -30 -35 L -29 -44 L -20 -45 L -16 -54 L -7 -52 Z" fill="#F59E0B"/>
        <circle cx="0" cy="0" r="14" fill="#1A1D24"/>
        <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
      </g>

      <!-- Smaller Interlocking Gear -->
      <g transform="translate(35, 25) rotate(-20)">
        <circle cx="0" cy="0" r="22" fill="#1A1D24"/>
        <path d="M0 -30 L 5 -28 L 9 -21 L 15 -23 L 18 -17 L 24 -16 L 25 -10 L 30 -6 L 28 -1 L 33 3 L 28 8 L 31 13 L 26 17 L 27 22 L 21 24 L 20 30 L 14 31 L 11 36 L 5 34 L 2 39 L -4 37 L -6 42 L -12 39 L -13 44 L -19 40 L -20 34 L -26 31 L -24 26 L -30 22 L -27 16 L -32 12 L -28 7 L -32 2 L -27 -3 L -30 -8 L -24 -12 L -25 -17 L -19 -19 L -18 -25 L -12 -26 L -9 -31 L -3 -29 Z" fill="#3B82F6"/>
        <circle cx="0" cy="0" r="9" fill="#1A1D24"/>
      </g>
    </g>

    <!-- Question mark / inquiry symbol gracefully integrated into the center of cause/reason -->
    <g transform="translate(105, 90)">
      <path d="M 0 -8 C 0 -18 12 -22 18 -12 C 22 -5 13 -2 13 5 L 13 10" fill="none" stroke="#F3F4F6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="13" cy="18" r="2.5" fill="#F3F4F6"/>
    </g>

    <!-- Base platform / subtle floor line representing foundation of the reason -->
    <path d="M 70 185 L 170 185" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <path d="M 90 192 L 150 192" stroke="#2A303C" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>