<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual representation of "粉碎" (Crushing/Shattering) -->
  <!-- A solid, heavy object being shattered into fragments -->
  
  <g transform="translate(120, 120)">
    <!-- Central impact point -->
    <circle cx="0" cy="0" r="8" fill="#FFB84D"/>
    
    <!-- Fragments of the object -->
    <path d="M-10 -10 L-40 -40 L-15 -25 Z" fill="#E0E0E0"/>
    <path d="M10 -10 L40 -40 L15 -25 Z" fill="#BDBDBD"/>
    <path d="M10 10 L40 40 L15 25 Z" fill="#E0E0E0"/>
    <path d="M-10 10 L-40 40 L-15 25 Z" fill="#BDBDBD"/>
    <path d="M-20 0 L-60 0 L-30 15 Z" fill="#9E9E9E"/>
    <path d="M20 0 L60 0 L30 -15 Z" fill="#9E9E9E"/>
    <path d="M0 -20 L0 -60 L15 -30 Z" fill="#757575"/>
    <path d="M0 20 L0 60 L-15 30 Z" fill="#757575"/>
    
    <!-- Impact force lines -->
    <path d="M-50 -50 L-20 -20" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 -50 L20 -20" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 50 L20 20" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <path d="M-50 50 L-20 20" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>