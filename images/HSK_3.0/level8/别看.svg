<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize central focus -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Character / Object Group: Visualizing "Don't judge by appearances - hidden strength" -->
  <!-- Sleek modern flat vector style -->
  <g transform="translate(0, 10)">
    
    <!-- Silhouette / Outline representing fragile/slim build -->
    <!-- Head -->
    <circle cx="120" cy="72" r="16" fill="#64748B"/>
    
    <!-- Slim Torso and arms (wearing a simple modern fitted tunic/shirt) -->
    <path d="M 104 94 Q 120 90 136 94 L 140 145 Q 120 150 100 145 Z" fill="#3B82F6" opacity="0.8"/>
    
    <!-- Slim arms holding a massive heavy agricultural load/tool or lifting dynamically -->
    <!-- Left arm -->
    <path d="M 105 98 L 85 125 L 92 130 L 108 106 Z" fill="#64748B"/>
    <!-- Right arm -->
    <path d="M 135 98 L 155 125 L 148 130 L 132 106 Z" fill="#64748B"/>
    
    <!-- Legs -->
    <path d="M 108 145 L 105 185 L 115 185 L 118 145 Z" fill="#475569"/>
    <path d="M 132 145 L 135 185 L 125 185 L 122 145 Z" fill="#475569"/>

    <!-- Contrast Element: Massive glowing golden weighted tool/bale representing immense strength/output -->
    <!-- Placed dynamically to show power overcoming appearance -->
    <rect x="70" y="155" width="100" height="36" rx="8" fill="#F59E0B" />
    <path d="M 90 155 L 120 135 L 150 155 Z" fill="#D97706"/>
    
    <!-- Energy/Strength Accent Lines (Modern flat style, high contrast gold/orange) -->
    <path d="M 60 115 Q 45 130 60 145" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M 180 115 Q 195 130 180 145" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    
    <circle cx="52" cy="130" r="3" fill="#F59E0B"/>
    <circle cx="188" cy="130" r="3" fill="#F59E0B"/>
  </g>

</svg>