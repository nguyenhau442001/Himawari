<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="box-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="shelf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Warehouse Background Elements -->
  <!-- Industrial Window with Warm Light -->
  <g opacity="0.4">
    <rect x="30" y="25" width="50" height="70" rx="4" fill="#334155" />
    <rect x="35" y="30" width="18" height="28" fill="#f59e0b" opacity="0.6" />
    <rect x="57" y="30" width="18" height="28" fill="#f59e0b" opacity="0.6" />
    <rect x="35" y="62" width="18" height="28" fill="#f59e0b" opacity="0.6" />
    <rect x="57" y="62" width="18" height="28" fill="#f59e0b" opacity="0.6" />
  </g>

  <!-- Steel Shelving Unit in Background -->
  <path d="M165 40 L210 50 L210 200 L165 190 Z" fill="#334155" opacity="0.5" />
  <line x1="168" y1="80" x2="207" y2="88" stroke="#475569" stroke-width="3" />
  <line x1="168" y1="120" x2="207" y2="128" stroke="#475569" stroke-width="3" />
  <line x1="168" y1="160" x2="207" y2="168" stroke="#475569" stroke-width="3" />

  <!-- Foreground Worktable / Counter -->
  <rect x="15" y="180" width="210" height="40" rx="6" fill="#334155" />
  <rect x="10" y="175" width="220" height="10" rx="3" fill="#475569" />

  <!-- Boxes and Cargo (The Batch) -->
  <!-- Box 1 (Background stack) -->
  <path d="M125 130 L165 115 L165 175 L125 190 Z" fill="#cbd5e1" />
  <path d="M90 145 L125 130 L125 190 L90 200 Z" fill="#94a3b8" />
  <path d="M90 145 L125 130 L165 115 L130 130 Z" fill="#e2e8f0" />

  <!-- Main Inspection Open Cargo Box on Table -->
  <g transform="translate(25, 110)">
    <!-- Box Outer Shell -->
    <path d="M 0 35 L 35 20 L 95 35 L 60 50 Z" fill="#64748b" />
    <path d="M 0 35 L 60 50 L 60 90 L 0 75 Z" fill="#475569" />
    <path d="M 60 50 L 95 35 L 95 75 L 60 90 Z" fill="#334155" />
    <!-- Box Inner Contents Base -->
    <path d="M 8 42 L 55 54 L 88 42 L 45 32 Z" fill="#1e293b" />
  </g>

  <!-- Defective Items (次品) inside and around the box -->
  <!-- Item 1: Dented Mug / Broken ceramic (Glowing error indicator) -->
  <g transform="translate(55, 135)">
    <ellipse cx="12" cy="12" rx="10" ry="6" fill="#f87171" opacity="0.3" filter="url(#glow)" />
    <!-- Mug body -->
    <path d="M 6 6 L 18 6 L 16 22 L 8 22 Z" fill="#e2e8f0" />
    <!-- Dent/Crack mark -->
    <path d="M 12 10 L 16 14 L 12 18" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Handle hanging off -->
    <path d="M 6 10 C 2 10 2 18 6 18" stroke="#cbd5e1" stroke-width="2" fill="none" />
  </g>

  <!-- Item 2: Defective gear/part with missing tooth -->
  <g transform="translate(90, 125)">
    <circle cx="10" cy="10" r="9" fill="#fb923c" />
    <circle cx="10" cy="10" r="4" fill="#334155" />
    <!-- Missing chunk / X mark -->
    <line x1="5" y1="5" x2="15" y2="15" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <line x1="15" y1="5" x2="5" y2="15" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Item 3: Warped/Bent metal plate -->
  <g transform="translate(45, 155)">
    <path d="M 0 10 Q 10 0 20 10 T 40 10" stroke="#94a3b8" stroke-width="4" fill="none" />
    <!-- Warning exclamation badge over the defective parts -->
    <circle cx="20" cy="-5" r="7" fill="#ef4444" />
    <path d="M 20 -8 L 20 -3 M 20 -1 L 20 0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Inspector Character (Warehouse Worker / QC) -->
  <g transform="translate(125, 65)">
    <!-- Body / Torso (Blue Uniform) -->
    <path d="M 25 80 L 65 80 L 75 140 L 15 140 Z" fill="#0284c7" />
    <!-- Collar and Vest details -->
    <path d="M 35 80 L 45 100 L 55 80 Z" fill="#e2e8f0" />
    <path d="M 25 80 L 35 140" stroke="#0369a1" stroke-width="3" />
    <path d="M 65 80 L 55 140" stroke="#0369a1" stroke-width="3" />

    <!-- Head & Face Profile / Expression (Concerned, Inspecting) -->
    <circle cx="45" cy="45" r="20" fill="#fcd34d" />
    <!-- Hair (Dark cap or hair) -->
    <path d="M 25 45 C 25 25 65 25 65 45 C 65 48 60 40 45 38 C 30 40 25 48 25 45 Z" fill="#334155" />
    <!-- Cap Brim -->
    <path d="M 25 42 L 55 40 L 52 35 L 28 37 Z" fill="#1e293b" />

    <!-- Focused Eyes & Eyebrow (Worried/Disappointed look at defect) -->
    <circle cx="50" cy="45" r="2.5" fill="#1e293b" />
    <path d="M 44 41 Q 50 38 56 42" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Frown mouth -->
    <path d="M 45 55 Q 50 52 55 55" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Arms & Hands Inspecting -->
    <!-- Back arm holding clipboard -->
    <path d="M 25 90 L 5 110 L 15 125" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Clipboard in hand -->
    <g transform="translate(-10, 105) rotate(-15)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#e2e8f0" />
      <rect x="6" y="-3" width="10" height="5" rx="1" fill="#64748b" />
      <line x1="4" y1="6" x2="18" y2="6" stroke="#cbd5e1" stroke-width="2" />
      <line x1="4" y1="11" x2="15" y2="11" stroke="#cbd5e1" stroke-width="2" />
      <!-- Red Cross mark on checklist indicating defects found -->
      <path d="M 12 16 L 18 22 M 18 16 L 12 22" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Front Arm pointing at defective item -->
    <path d="M 65 95 L 90 115 L 75 120" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hand / Finger pointing -->
    <circle cx="73" cy="122" r="4" fill="#fcd34d" />
    <path d="M 73 122 L 65 128" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ambient lighting / Accent Glows for realism -->
  <circle cx="80" cy="150" r="30" fill="#ef4444" opacity="0.1" filter="url(#glow)" />
  <circle cx="190" cy="80" r="40" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
</svg>