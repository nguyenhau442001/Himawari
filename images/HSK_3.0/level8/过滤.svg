<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="filtered-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Kitchen Counter & Environment background -->
  <rect x="20" y="195" width="200" height="45" fill="#334155" rx="6"/>
  <rect x="25" y="190" width="190" height="8" fill="#475569" rx="3"/>
  <circle cx="190" cy="160" r="15" fill="#1e293b" opacity="0.5"/>
  <path d="M185 150 Q195 160 185 170" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Character (Partial: arms & hands pouring water) -->
  <path d="M10 200 Q20 130 50 120" stroke="#f43f5e" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Pouring Hand -->
  <circle cx="50" cy="118" r="8" fill="#fbcfe8"/>

  <!-- Unfiltered Water Pitcher (Tilting) -->
  <g transform="translate(45, 95) rotate(-35)">
    <path d="M0 0 L25 0 L20 40 L5 40 Z" fill="#94a3b8" opacity="0.8"/>
    <!-- Water inside tilting pitcher -->
    <path d="M3 5 L22 5 L18 35 L7 35 Z" fill="url(#water-grad)"/>
    <!-- Spout stream -->
    <path d="M-2 -2 C -10 5, -5 20, 20 45" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
  </g>

  <!-- Water Filtration Apparatus / Funnel Setup -->
  <!-- Stand / Holder Ring -->
  <path d="M85 130 L155 130" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 130 L90 195" stroke="#64748b" stroke-width="4"/>
  <path d="M140 130 L150 195" stroke="#64748b" stroke-width="4"/>

  <!-- Glass Funnel / Filter Top -->
  <path d="M90 100 L150 100 L125 145 L115 145 Z" fill="#cbd5e1" opacity="0.4" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Filter Paper Inside (White Cone) -->
  <path d="M95 102 L145 102 L121 142 Z" fill="#f8fafc" opacity="0.9"/>
  <!-- Coffee/Particle residue trapped at top -->
  <path d="M105 102 L135 102 L120 115 Z" fill="#78350f" opacity="0.8"/>

  <!-- Water dripping through filter -->
  <circle cx="120" cy="150" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="120" cy="162" r="2.5" fill="#38bdf8"/>

  <!-- Receiving Glass Container / Carafe below -->
  <path d="M100 165 L140 165 L145 195 L95 195 Z" fill="#e2e8f0" opacity="0.3" stroke="#f8fafc" stroke-width="2"/>
  <!-- Filtered Pure Water Pool Inside Carafe -->
  <path d="M98 175 L142 175 L144 193 L96 193 Z" fill="url(#filtered-water)"/>
  <!-- Bubbles in pure water -->
  <circle cx="110" cy="184" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="125" cy="188" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="130" cy="180" r="1.2" fill="#ffffff" opacity="0.7"/>

  <!-- Glowing Aura / Accent representing clean readiness -->
  <circle cx="120" cy="180" r="35" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Happy Character Head (Observing the filtered water) -->
  <g transform="translate(180, 110)">
    <!-- Face / Skin -->
    <circle cx="0" cy="0" r="22" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M-20 -5 Q -5 -25 15 -15 Q 22 5 18 10 Q 0 -5 -20 -5 Z" fill="#b45309"/>
    <!-- Eye (Happy squint) -->
    <path d="M-8 -2 Q -4 -7 0 -2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M6 -2 Q 10 -7 14 -2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks (Blush) -->
    <circle cx="-6" cy="4" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="12" cy="4" r="4" fill="#fb7185" opacity="0.6"/>
    <!-- Smile -->
    <path d="M2 6 Q 5 10 8 6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Steam / Pure Freshness indicators -->
  <path d="M172 80 C 168 70, 178 60, 172 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M185 85 C 181 75, 191 65, 185 55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>