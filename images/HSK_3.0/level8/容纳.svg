<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background with dark theme gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <radialGradient id="stadiumGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#stadiumGlow)" />

  <!-- Stadium Architecture & Structural Riffs -->
  <!-- Outer stadium curve (bowl structure) -->
  <ellipse cx="120" cy="140" rx="95" ry="55" fill="#334155" />
  <ellipse cx="120" cy="137" rx="88" ry="48" fill="#1e293b" />
  
  <!-- Stadium Inner Field (Grass) -->
  <ellipse cx="120" cy="140" rx="65" ry="30" fill="url(#pitchGrad)" />
  <!-- Pitch markings -->
  <ellipse cx="120" cy="140" rx="20" ry="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="130" x2="120" y2="150" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>

  <!-- Tiered Seating & Packed Crowds (representing 50,000 capacity) -->
  <!-- Upper tier stands -->
  <ellipse cx="120" cy="115" rx="82" ry="42" fill="none" stroke="#475569" stroke-width="8" opacity="0.5"/>
  <ellipse cx="120" cy="125" rx="75" ry="38" fill="none" stroke="#475569" stroke-width="8" opacity="0.7"/>

  <!-- Crowd Dots / Colorful Spectators Pattern representing massive capacity -->
  <!-- Upper Tier Crowd Arc -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="55" cy="105" r="2.5" />
    <circle cx="65" cy="100" r="2.5" />
    <circle cx="75" cy="97" r="2.5" />
    <circle cx="85" cy="95" r="2.5" />
    <circle cx="95" cy="94" r="2.5" />
    <circle cx="105" cy="93.5" r="2.5" />
    <circle cx="115" cy="93.5" r="2.5" />
    <circle cx="125" cy="94" r="2.5" />
    <circle cx="135" cy="95" r="2.5" />
    <circle cx="145" cy="97" r="2.5" />
    <circle cx="155" cy="100" r="2.5" />
    <circle cx="165" cy="105" r="2.5" />
  </g>
  <g fill="#ec4899" opacity="0.8">
    <circle cx="50" cy="112" r="2.5" />
    <circle cx="60" cy="107" r="2.5" />
    <circle cx="70" cy="103" r="2.5" />
    <circle cx="80" cy="100" r="2.5" />
    <circle cx="90" cy="98" r="2.5" />
    <circle cx="100" cy="97" r="2.5" />
    <circle cx="110" cy="97" r="2.5" />
    <circle cx="120" cy="97" r="2.5" />
    <circle cx="130" cy="98" r="2.5" />
    <circle cx="140" cy="100" r="2.5" />
    <circle cx="150" cy="103" r="2.5" />
    <circle cx="160" cy="107" r="2.5" />
    <circle cx="170" cy="112" r="2.5" />
  </g>
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="45" cy="120" r="2.5" />
    <circle cx="55" cy="115" r="2.5" />
    <circle cx="65" cy="110" r="2.5" />
    <circle cx="75" cy="106" r="2.5" />
    <circle cx="85" cy="103" r="2.5" />
    <circle cx="95" cy="101" r="2.5" />
    <circle cx="105" cy="100" r="2.5" />
    <circle cx="115" cy="100" r="2.5" />
    <circle cx="125" cy="101" r="2.5" />
    <circle cx="135" cy="103" r="2.5" />
    <circle cx="145" cy="106" r="2.5" />
    <circle cx="155" cy="110" r="2.5" />
    <circle cx="165" cy="115" r="2.5" />
    <circle cx="175" cy="120" r="2.5" />
  </g>

  <!-- Stadium Floodlights & Architectural Pillars -->
  <!-- Left Floodlight Tower -->
  <line x1="45" y1="90" x2="40" y2="45" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="33" y="38" width="14" height="8" rx="2" fill="#fbbf24" />
  <line x1="48" y1="95" x2="48" y2="50" stroke="#64748b" stroke-width="1.5" />
  <!-- Right Floodlight Tower -->
  <line x1="195" y1="90" x2="200" y2="45" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="193" y="38" width="14" height="8" rx="2" fill="#fbbf24" />
  <line x1="192" y1="95" x2="192" y2="50" stroke="#64748b" stroke-width="1.5" />

  <!-- Stadium Roof Canopy Outline (Modern Architecture) -->
  <path d="M 25 110 Q 120 70 215 110 Q 120 85 25 110 Z" fill="#475569" opacity="0.6"/>

  <!-- Foreground / Main Subject: Enthusiastic Spectator Character showcasing capacity/scale -->
  <g transform="translate(0, 10)">
    <!-- Stadium Wall Foreground Rim -->
    <path d="M 30 160 Q 120 195 210 160" fill="none" stroke="#334155" stroke-width="6"/>

    <!-- Excited Character in Foreground (Cheering capacity) -->
    <!-- Torso & Arms Raised -->
    <path d="M 105 165 C 105 150 110 145 115 140 L 125 140 C 130 145 135 150 135 165 Z" fill="#ec4899" />
    <!-- Raised Arms -->
    <path d="M 110 145 L 95 125" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" />
    <path d="M 130 145 L 145 125" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="93" cy="123" r="3" fill="#fbcfe8" />
    <circle cx="147" cy="123" r="3" fill="#fbcfe8" />

    <!-- Head & Cheering Expression -->
    <circle cx="120" cy="132" r="10" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 110 130 C 110 123 120 121 130 126 C 128 123 115 123 110 130 Z" fill="#1e293b" />
    <!-- Cheering face details (happy open smile) -->
    <path d="M 117 135 Q 120 139 123 135" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Companion Character Pointing at the stadium scale -->
    <path d="M 140 170 C 140 158 145 154 150 150 L 158 150 C 163 154 168 158 168 170 Z" fill="#38bdf8" />
    <!-- Pointing Arm -->
    <path d="M 145 155 L 125 148" stroke="#bae6fd" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="123" cy="147" r="2.5" fill="#bae6fd" />
    <!-- Head -->
    <circle cx="154" cy="142" r="9" fill="#bae6fd" />
    <!-- Hair -->
    <path d="M 145 140 C 145 135 155 133 163 138 C 158 135 148 136 145 140 Z" fill="#1e293b" />
  </g>

  <!-- Ambient Light Effects (Stadium Glow / Sparkles) -->
  <circle cx="120" cy="42" r="2" fill="#fff" opacity="0.9" />
  <circle cx="42" cy="40" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="198" cy="40" r="1.5" fill="#fbbf24" opacity="0.8" />
</svg>