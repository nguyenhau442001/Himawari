<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background: Distant hills and soft moon -->
  <path d="M0 180 Q60 150 120 180 T240 180 V240 H0 Z" fill="#1e293b" opacity="0.8"/>
  <circle cx="190" cy="50" r="15" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Town Houses -->
  <path d="M20 240 V160 L50 130 L80 160 V240 Z" fill="#334155"/>
  <path d="M90 240 V170 L120 150 L150 170 V240 Z" fill="#475569"/>
  <rect x="35" y="180" width="20" height="30" fill="#fb923c" rx="2"/>
  <rect x="105" y="190" width="20" height="20" fill="#fb923c" rx="2"/>
  
  <!-- Foreground: Elderly person sitting on a bench with a cat -->
  <g transform="translate(140, 170)">
    <path d="M0 60 L40 60 L40 50 L0 50 Z" fill="#94a3b8"/>
    <path d="M10 50 L10 20 L20 20 L20 50" fill="#ec4899" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="8" fill="#fde68a"/>
    <path d="M15 25 L15 40" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Cat -->
