    <ellipse cx="10" cy="10" rx="8" ry="6" fill="#fb923c"/>
    <circle cx="15" cy="8" r="3" fill="#fb923c"/>
  </g>
  
  <!-- Nature elements -->
  <path d="M10 240 C10 180 30 180 30 240" fill="#10b981" opacity="0.6"/>
  <path d="M220 240 C220 190 235 190 235 240" fill="#10b981" opacity="0.6"/>
  
  <!-- Stars -->
  <circle cx="40" cy="30" r="1" fill="#f8fafc"/>
  <circle cx="80" cy="50" r="1.5" fill="#f8fafc"/>
  <circle cx="120" cy="20" r="1" fill="#f8fafc"/>
  <circle cx="160" cy="80" r="1.2" fill="#f8fafc"/>
</svg>