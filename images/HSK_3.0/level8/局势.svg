  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="30" y="140" width="180" height="60" rx="4" fill="#334155"/>
  <rect x="40" y="150" width="160" height="40" rx="2" fill="#1e293b"/>
  
