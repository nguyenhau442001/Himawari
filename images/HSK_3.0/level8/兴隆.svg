<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Light Spill from the Shop (Ground Glow) -->
  <path d="M60 180 L180 180 L210 220 L30 220 Z" fill="#FFA500" opacity="0.15"/>
  
  <!-- Storefront Structure -->
  <rect x="50" y="60" width="140" height="120" rx="4" fill="#2D333D"/>
  <rect x="60" y="85" width="120" height="95" rx="2" fill="#FFD700" opacity="0.1"/>
  
  <!-- Main Entrance (Glowing Interior) -->
  <rect x="85" y="100" width="70" height="80" rx="2" fill="#FFD700"/>
  
  <!-- Shop Awning/Roof Detail -->
  <path d="M45 60 L195 60 L200 85 L40 85 Z" fill="#FF8C00"/>
  <line x1="70" y1="60" x2="65" y2="85" stroke="#E67E22" stroke-width="2"/>
  <line x1="100" y1="60" x2="100" y2="85" stroke="#E67E22" stroke-width="2"/>
  <line x1="140" y1="60" x2="140" y2="85" stroke="#E67E22" stroke-width="2"/>
  <line x1="170" y1="60" x2="175" y2="85" stroke="#E67E22" stroke-width="2"/>

  <!-- Prosperity Symbols: Flourishing Potted Plants -->
  <rect x="60" y="165" width="15" height="15" fill="#8D6E63"/>
  <circle cx="67.5" cy="155" r="10" fill="#4CAF50"/>
  <circle cx="62" cy="150" r="7" fill="#66BB6A"/>
  <circle cx="73" cy="150" r="7" fill="#66BB6A"/>
  
  <rect x="165" y="165" width="15" height="15" fill="#8D6E63"/>
  <circle cx="172.5" cy="155" r="10" fill="#4CAF50"/>
  <circle cx="167" cy="150" r="7" fill="#66BB6A"/>
  <circle cx="178" cy="150" r="7" fill="#66BB6A"/>

  <!-- Customers (Dynamic Movement) -->
  <!-- Customer 1: Entering -->
  <circle cx="110" cy="145" r="8" fill="#E0E0E0"/>
  <path d="M100 180 Q110 155 120 180" fill="#E0E0E0"/>
  
  <!-- Customer 2: Leaving with many bags (Prosperity) -->
  <circle cx="195" cy="155" r="8" fill="#FFFFFF"/>
  <path d="M185 190 Q195 165 205 190" fill="#FFFFFF"/>
  <!-- Shopping Bags -->
  <rect x="175" y="175" width="12" height="15" rx="1" fill="#FFD700"/>
  <path d="M177 175 Q181 170 185 175" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  <rect x="205" y="170" width="12" height="15" rx="1" fill="#FFD700"/>
  <path d="M207 170 Q211 165 215 170" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  <rect x="212" y="178" width="12" height="15" rx="1" fill="#FFA500"/>
  <path d="M214 178 Q218 173 222 178" fill="none" stroke="#B8860B" stroke-width="1.5"/>

  <!-- Customer 3: Approaching -->
  <circle cx="35" cy="165" r="8" fill="#B0BEC5"/>
  <path d="M25 200 Q35 175 45 200" fill="#B0BEC5"/>
  
  <!-- Interior Detail: Shelves showing abundance -->
  <line x1="95" y1="120" x2="115" y2="120" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="135" x2="145" y2="135" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="150" x2="115" y2="150" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
</svg>