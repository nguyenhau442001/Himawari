  <rect x="90" y="70" width="60" height="90" rx="4" fill="#3D4754"/>
  
  <!-- Magazine/Content representation on screen -->
  <rect x="98" y="80" width="44" height="8" rx="2" fill="#F39C12"/>
  <rect x="98" y="95" width="44" height="4" rx="1" fill="#718096"/>
  <rect x="98" y="105" width="30" height="4" rx="1" fill="#718096"/>
  
  <!-- Hand Action -->
  <g>
    <path d="M150 140 C 155 135, 165 130, 175 135 L 185 150 L 170 165 L 160 155 Z" fill="#FFD700"/>
    <path d="M175 135 L 182 125 L 190 130 L 185 140" fill="#FFD700"/>
