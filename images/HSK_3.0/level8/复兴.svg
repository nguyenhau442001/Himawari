<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient for "Renaissance / Cultural Awakening" -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Canvas / Easel Lighting -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="warmGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light / Spotlight representing "Movement / Awakening" -->
  <circle cx="120" cy="90" r="110" fill="url(#spotlight)" />

  <!-- BACKGROUND ENVIRONMENT: Art Studio / Cultural Center -->
  <!-- Back Wall & Archway (Classic Renaissance motif) -->
  <path d="M60,190 L60,80 C60,45 90,30 120,30 C150,30 180,45 180,80 L180,190" fill="#1b263b" opacity="0.6" />
  <path d="M70,190 L70,85 C70,55 95,40 120,40 C145,40 170,55 170,85 L170,190" fill="#0f172a" opacity="0.8" />

  <!-- Background Cultural Artifacts / Sculpture silhouette -->
  <path d="M90,140 C90,125 95,115 105,115 C108,115 110,118 110,122 L110,140 Z" fill="#334155" opacity="0.7" />
  <circle cx="105" cy="105" r="7" fill="#334155" opacity="0.7" />
  <rect x="95" y="140" width="20" height="40" rx="2" fill="#334155" opacity="0.7" />

  <!-- Architectural Columns -->
  <rect x="25" y="60" width="16" height="130" rx="2" fill="#1e293b" opacity="0.9" />
  <rect x="23" y="60" width="20" height="10" rx="1" fill="#334155" />
  <rect x="23" y="180" width="20" height="10" rx="1" fill="#334155" />

  <rect x="199" y="60" width="16" height="130" rx="2" fill="#1e293b" opacity="0.9" />
  <rect x="197" y="60" width="20" height="10" rx="1" fill="#334155" />
  <rect x="197" y="180" width="20" height="10" rx="1" fill="#334155" />

  <!-- Studio Floor -->
  <path d="M0,190 L240,190 L240,240 L0,240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- EASEL & CANVAS (Central Element of Cultural Revival/Creation) -->
  <!-- Easel Legs -->
  <line x1="120" y1="65" x2="85" y2="210" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="120" y1="65" x2="165" y2="210" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <line x1="120" y1="60" x2="120" y2="215" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  
  <!-- Canvas Shelf -->
  <rect x="75" y="165" width="90" height="6" rx="3" fill="#64748b" filter="url(#softShadow)" />

  <!-- Canvas Board -->
  <rect x="82" y="75" width="76" height="92" rx="4" fill="url(#canvasGrad)" filter="url(#softShadow)" />
  
  <!-- Artwork on Canvas: Abstract Classic/Modern Cultural Fusion (Revival Motif) -->
  <circle cx="120" cy="115" r="24" fill="#fb923c" opacity="0.85" />
  <path d="M95,140 Q120,90 145,140 Z" fill="#38bdf8" opacity="0.75" />
  <path d="M102,125 Q120,100 138,125 Z" fill="#f43f5e" opacity="0.8" />
  <!-- Golden brush stroke symbolizing renewal -->
  <path d="M90,95 Q120,130 150,105" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

  <!-- FOREGROUND CHARACTER: Young Artist / Cultural Restorer actively painting -->
  <g filter="url(#softShadow)">
    <!-- Character Body & Apron -->
    <!-- Torso -->
    <path d="M135,160 C130,150 145,130 160,135 L175,175 C165,190 140,190 130,185 Z" fill="#3b82f6" />
    <!-- Creative Apron -->
    <path d="M138,155 C138,155 148,140 160,142 L168,185 C155,188 142,185 138,175 Z" fill="#f8fafc" />
    <!-- Apron paint stains -->
    <circle cx="148" cy="165" r="3" fill="#fbbf24" />
    <circle cx="158" cy="175" r="2.5" fill="#ec4899" />
    <circle cx="152" cy="155" r="2" fill="#38bdf8" />

    <!-- Head & Hair -->
    <circle cx="168" cy="115" r="14" fill="#fbcfe8" />
    <!-- Stylized hair -->
    <path d="M154,115 C154,102 165,98 178,105 C182,107 182,115 178,122 C172,125 160,122 154,115 Z" fill="#0f172a" />
    <path d="M165,100 C170,95 180,98 183,105 C180,103 172,101 165,100 Z" fill="#0f172a" />

    <!-- Focused Face Expression (Profile/Three-quarters) -->
    <circle cx="175" cy="116" r="2" fill="#0f172a" />
    <path d="M178,122 Q174,125 170,123" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm & Hand Holding Brush (Dynamic Action) -->
    <!-- Upper arm & forearm reaching toward canvas -->
    <path d="M155,140 Q135,145 125,128" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    <path d="M125,128 L116,122" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" />
    
    <!-- Paintbrush -->
    <line x1="116" y1="122" x2="108" y2="117" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <!-- Brush Tip with glowing paint -->
    <circle cx="107" cy="116" r="3" fill="#fbbf24" filter="url(#softShadow)" />

    <!-- Other Arm resting / holding palette -->
    <path d="M150,165 Q165,160 160,145" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- SECONDARY CHARACTER / OBSERVER (Adding depth to the "Movement / Community" aspect of revival) -->
  <g opacity="0.95">
    <!-- Body -->
    <path d="M60,185 C60,165 75,155 88,160 L102,205 C92,215 70,215 60,205 Z" fill="#065f46" />
    <!-- Head -->
    <circle cx="78" cy="142" r="12" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M66,140 C66,128 78,125 88,132 C92,136 90,145 88,148 C80,148 70,145 66,140 Z" fill="#7c2d12" />
    <!-- Curious Face looking at canvas -->
    <circle cx="83" cy="143" r="1.5" fill="#1e293b" />
    <path d="M85,148 Q82,151 79,149" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Arm leaning forward with wonder -->
    <path d="M85,165 Q95,165 105,155" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- PROPS: Paint Palette & Stool on the Floor -->
  <!-- Wooden Palette -->
  <ellipse cx="65" cy="195" rx="14" ry="9" fill="#d97706" transform="rotate(-15 65 195)" filter="url(#softShadow)" />
  <!-- Blobs of paint on palette -->
  <circle cx="58" cy="193" r="2.5" fill="#ef4444" />
  <circle cx="65" cy="190" r="2.5" fill="#3b82f6" />
  <circle cx="72" cy="194" r="2.5" fill="#10b981" />
  <circle cx="68" cy="200" r="2.5" fill="#fbbf24" />

  <!-- Studio Stool -->
  <ellipse cx="185" cy="180" rx="16" ry="6" fill="#475569" />
  <line x1="175" y1="184" x2="168" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="195" y1="184" x2="202" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="185" y1="186" x2="185" y2="218" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- MAGICAL / CULTURAL SPARKLES (Symbolizing 'Awakening / Beginning') -->
  <g fill="#fbbf24">
    <path d="M120,55 Q120,65 110,65 Q120,65 120,75 Q120,65 130,65 Q120,65 120,55 Z" opacity="0.9" />
    <path d="M150,75 Q150,81 144,81 Q150,81 150,87 Q150,81 156,81 Q150,81 150,75 Z" opacity="0.7" />
    <path d="M92,85 Q92,90 87,90 Q92,90 92,95 Q92,90 97,90 Q92,90 92,85 Z" opacity="0.8" />
  </g>
  <circle cx="138" cy="50" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="102" cy="62" r="1.5" fill="#f43f5e" opacity="0.9" />
  <circle cx="165" cy="90" r="2" fill="#fbbf24" opacity="0.8" />
</svg>