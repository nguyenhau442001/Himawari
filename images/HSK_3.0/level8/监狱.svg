<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background wall gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cell floor gradient -->
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow for the bulb -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- ENVIRONMENT: Prison Cell Interior -->
  <!-- Back Wall Texture / Shadow -->
  <rect x="20" y="20" width="200" height="150" fill="#162235" rx="4"/>
  
  <!-- Floor -->
  <path d="M20 170 L220 170 L230 220 L10 220 Z" fill="url(#floorGradient)"/>
  
  <!-- Floor Tile Line Perspective -->
  <line x1="120" y1="170" x2="120" y2="220" stroke="#0a0f1d" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="170" x2="40" y2="220" stroke="#0a0f1d" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="170" x2="200" y2="220" stroke="#0a0f1d" stroke-width="1.5" opacity="0.3"/>

  <!-- High Prison Window with Bars -->
  <g transform="translate(155, 35)">
    <!-- Window recess -->
    <rect x="0" y="0" width="35" height="45" rx="3" fill="#090d16"/>
    <!-- Window glow background -->
    <rect x="2" y="2" width="31" height="41" rx="2" fill="#1e3a8a" opacity="0.6"/>
    <!-- Bars -->
    <line x1="11" y1="0" x2="11" y2="45" stroke="#0f172a" stroke-width="3"/>
    <line x1="24" y1="0" x2="24" y2="45" stroke="#0f172a" stroke-width="3"/>
    <!-- Horizontal bar -->
    <line x1="0" y1="22" x2="35" y2="22" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Dramatic Light Beam from Window casting across the cell -->
  <polygon points="155,35 190,35 230,220 70,220" fill="url(#lightBeam)"/>

  <!-- Hanging Ceiling Light -->
  <line x1="75" y1="20" x2="75" y2="55" stroke="#334155" stroke-width="2"/>
  <circle cx="75" cy="55" r="6" fill="#475569"/>
  <circle cx="75" cy="58" r="4" fill="#fbbf24"/>
  <circle cx="75" cy="58" r="14" fill="url(#bulbGlow)" style="mix-blend-mode: screen;"/>

  <!-- MAIN FOREGROUND ELEMENT: Heavy Iron Prison Bars (Foreground frame) -->
  <g id="prison_bars">
    <!-- Left bar -->
    <rect x="25" y="0" width="10" height="240" fill="#0a0f1d"/>
    <rect x="28" y="0" width="3" height="240" fill="#334155" opacity="0.6"/>
    <!-- Right bar -->
    <rect x="205" y="0" width="10" height="240" fill="#0a0f1d"/>
    <rect x="208" y="0" width="3" height="240" fill="#334155" opacity="0.6"/>
    <!-- Center-Right bar -->
    <rect x="145" y="0" width="8" height="240" fill="#0a0f1d"/>
    <rect x="147" y="0" width="2" height="240" fill="#334155" opacity="0.6"/>
    
    <!-- Horizontal reinforcing bars -->
    <rect x="0" y="60" width="240" height="6" fill="#0a0f1d"/>
    <rect x="0" y="160" width="240" height="6" fill="#0a0f1d"/>
  </g>

  <!-- CHARACTER: "Anh ta" (He) inside the cell, looking dejected/locked up -->
  <g id="character_prisoner" transform="translate(90, 95)">
    <!-- Drop Shadow on floor -->
    <ellipse cx="25" cy="85" rx="22" ry="7" fill="#05080f" opacity="0.7"/>

    <!-- Prisoner Outfit (Orange/Brown striped or solid muted jumpsuit typical for dramatic illustration) -->
    <!-- Body / Torso slouched forward -->
    <path d="M12 45 C12 35, 25 30, 38 35 C48 38, 52 55, 48 70 L15 70 Z" fill="#c2410c"/>
    <!-- Collar -->
    <path d="M25 33 L32 33 L35 38 L22 38 Z" fill="#9a3412"/>

    <!-- Head / Face (Downcast, sad expression) -->
    <circle cx="33" cy="22" r="13" fill="#fed7aa"/>
    
    <!-- Hair (Messy dark hair) -->
    <path d="M20 20 C20 12, 30 10, 43 14 C40 10, 26 8, 20 15 Z" fill="#1e293b"/>
    <path d="M42 15 C45 18, 44 24, 46 26 C43 23, 43 19, 40 16 Z" fill="#1e293b"/>

    <!-- Closed / Sad Eyes (Simple clean arcs) -->
    <path d="M28 22 Q31 24 34 21" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M36 22 Q39 24 42 21" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Frown / Sad Mouth -->
    <path d="M33 28 Q35 26 38 28" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Arms crossed dejectedly or holding knees -->
    <!-- Left Arm -->
    <path d="M18 45 C10 48, 8 60, 18 65 C24 68, 30 60, 28 55" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
    <!-- Hands clasped / near knees -->
    <circle cx="28" cy="62" r="4" fill="#fed7aa"/>

    <!-- Seated Legs / Knees pulled up -->
    <path d="M15 65 C10 65, 5 75, 15 80 L45 80 C50 78, 48 68, 40 65 Z" fill="#9a3412"/>
    <!-- Shoes -->
    <ellipse cx="12" cy="83" rx="8" ry="4" fill="#0f172a"/>
    <ellipse cx="42" cy="83" rx="8" ry="4" fill="#0f172a"/>
  </g>

  <!-- Additional Environmental Details (Prop: Metal cup on the floor) -->
  <g transform="translate(60, 162)">
    <ellipse cx="8" cy="12" rx="6" ry="3" fill="#334155"/>
    <path d="M2 5 L4 12 C4 14, 12 14, 14 12 L16 5 Z" fill="#64748b"/>
    <ellipse cx="9" cy="5" rx="7" ry="2.5" fill="#94a3b8"/>
    <!-- Cup handle -->
    <path d="M2 7 C-1 7, -1 11, 2 12" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Prison Wall Texture / Cracks (Subtle narrative detail) -->
  <path d="M100 30 L105 45 L102 50" stroke="#0f172a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M180 100 L185 110" stroke="#0f172a" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Atmospheric Dust Particles in Light Beam -->
  <circle cx="160" cy="80" r="1.5" fill="#fde047" opacity="0.6"/>
  <circle cx="180" cy="120" r="1" fill="#fde047" opacity="0.4"/>
  <circle cx="140" cy="140" r="2" fill="#fde047" opacity="0.5"/>
  <circle cx="195" cy="170" r="1.5" fill="#fde047" opacity="0.3"/>
</svg>