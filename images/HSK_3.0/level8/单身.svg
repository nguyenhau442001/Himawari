<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Conceptual Illustration: Single Person (单身 - Noun/Person) -->
  <!-- Represents independence, individuality, and freedom in modern urban life -->
  
  <g id="single-person-concept">
    <!-- Drop shadow / floor element -->
    <ellipse cx="120" cy="182" rx="42" ry="7" fill="#12151B"/>

    <!-- Body & Coat -->
    <!-- Collar & lapels -->
    <path d="M102 135 L120 148 L138 135 L144 165 C144 175, 136 180, 120 180 C104 180, 96 175, 96 165 Z" fill="#2E384D"/>
    <!-- Inner shirt / sweater -->
    <path d="M110 135 L120 145 L130 135 L135 165 L105 165 Z" fill="#E2E8F0"/>
    <!-- Outer jacket / trench coat (modern urban white-collar style) -->
    <path d="M85 140 C85 130, 95 125, 105 125 L135 125 C145 125, 155 130, 155 140 L160 178 C160 182, 155 185, 150 185 L90 185 C85 185, 80 182, 80 178 Z" fill="#3B82F6"/>
    <!-- Jacket lapel fold lines -->
    <path d="M105 125 L112 155" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <path d="M135 125 L128 155" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="112" y="112" width="16" height="18" rx="4" fill="#FDE0AC"/>

    <!-- Head & Face -->
    <circle cx="120" cy="92" r="22" fill="#FDE0AC"/>
    
    <!-- Facial Features (Confident, calm, independent expression) -->
    <!-- Eyes (closed in a serene, peaceful smile) -->
    <path d="M110 90 Q114 94 118 90" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M122 90 Q126 94 130 90" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Smile -->
    <path d="M115 101 Q120 106 125 101" stroke="#4A5568" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Modern Stylish Hair -->
    <path d="M98 92 C96 75, 108 65, 122 66 C136 67, 145 76, 144 92 C144 92, 140 82, 130 78 C120 74, 105 78, 98 92 Z" fill="#2D3748"/>
    <path d="M100 88 C102 78, 112 72, 124 72 C132 72, 140 78, 142 88 C135 80, 120 79, 100 88 Z" fill="#4A5568"/>

    <!-- Raised confident hand / holding a coffee cup or casual stance representing "freedom" -->
    <!-- Left arm relaxed -->
    <path d="M85 140 L72 165 C70 170, 74 174, 79 172 L86 160" fill="#3B82F6"/>
    <circle cx="75" cy="172" r="5" fill="#FDE0AC"/>

    <!-- Right arm slightly raised in a relaxed, free gesture -->
    <path d="M155 140 L170 125 C175 120, 180 125, 178 131 L168 155" fill="#3B82F6"/>
    <circle cx="173" cy="122" r="5" fill="#FDE0AC"/>
  </g>

  <!-- Accent graphic elements (Modern flat design minimalist sparkles denoting independence/freedom, NO hearts) -->
  <g id="accents" fill="#F59E0B">
    <!-- Top left sparkle -->
    <path d="M55 70 L58 78 L66 81 L58 84 L55 92 L52 84 L44 81 L52 78 Z"/>
    <!-- Top right sparkle (smaller) -->
    <path d="M185 85 L187 90 L192 92 L187 94 L185 99 L183 94 L178 92 L183 90 Z"/>
    <!-- Lower right accent -->
    <path d="M180 155 L182 160 L187 162 L182 164 L180 169 L178 164 L173 162 L178 160 Z"/>
  </g>
</svg>