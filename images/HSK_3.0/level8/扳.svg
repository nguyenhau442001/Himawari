<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "扳" (lever/switch mechanism representing flipping a situation/score) -->
  <g transform="translate(0, 0)">
    <!-- Base mount / Fulcrum bracket -->
    <path d="M95,170 L145,170 L130,190 L110,190 Z" fill="#2E3440" />
    <rect x="85" y="190" width="70" height="10" rx="3" fill="#4C566A" />

    <!-- Pivot joint (Circular base) -->
    <circle cx="120" cy="140" r="22" fill="#3B4252" />
    <circle cx="120" cy="140" r="14" fill="#434C5E" />

    <!-- The Lever Arm (Slanted/Flipped to represent 'bān' - turning the tide) -->
    <g transform="rotate(-35, 120, 140)">
      <!-- Lever Rod -->
      <rect x="111" y="55" width="18" height="95" rx="9" fill="#E59866" />
      <rect x="115" y="55" width="5" height="95" rx="2.5" fill="#F39C12" opacity="0.4" />
      
      <!-- Top Handle Knob -->
      <circle cx="120" cy="45" r="16" fill="#F39C12" />
      <circle cx="120" cy="45" r="10" fill="#F7DC6F" />
    </g>

    <!-- Dynamic action motion lines (Flipping / Pivoting effect) -->
    <path d="M 85,90 A 55,55 0 0,1 155,90" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,6" opacity="0.8"/>
    
    <!-- Arrowhead indicating direction of the pivot/flip -->
    <path d="M 152,80 L 160,92 L 146,95 Z" fill="#F39C12" transform="rotate(25, 153, 90)" />

    <!-- Spark / Impact accent representing turning the tide/reversing situation -->
    <path d="M 175,70 L 180,82 L 192,87 L 180,92 L 175,104 L 170,92 L 158,87 L 170,82 Z" fill="#F1C40F" opacity="0.9" transform="scale(0.6) translate(130, 20)" />
    <path d="M 65,110 L 68,117 L 75,120 L 68,123 L 65,130 L 62,123 L 55,120 L 62,117 Z" fill="#E67E22" opacity="0.7" />
  </g>
</svg>