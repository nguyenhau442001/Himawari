<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Light for Main Character -->
    <radialGradient id="desk-light" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Office Interior -->
  <g id="environment">
    <!-- Wall paneling line -->
    <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" />
    
    <!-- Window with City View -->
    <path d="M 28 40 L 92 40 L 92 130 L 28 130 Z" fill="#1e293b" stroke="#475569" stroke-width="2" rx="4"/>
    <!-- City silhouettes outside -->
    <path d="M 36 130 L 36 90 L 44 90 L 44 130 Z M 48 130 L 48 70 L 60 70 L 60 130 Z M 64 130 L 64 100 L 72 100 L 72 130 Z M 76 130 L 76 80 L 84 80 L 84 130 Z" fill="#334155"/>
    <!-- Window Crossbars -->
    <line x1="60" y1="40" x2="60" y2="130" stroke="#475569" stroke-width="1.5"/>
    <line x1="28" y1="85" x2="92" y2="85" stroke="#475569" stroke-width="1.5"/>

    <!-- Bookshelf in background -->
    <rect x="190" y="50" width="35" height="110" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="2"/>
    <line x1="190" y1="80" x2="225" y2="80" stroke="#334155" stroke-width="1.5"/>
    <line x1="190" y1="110" x2="225" y2="110" stroke="#334155" stroke-width="1.5"/>
    <line x1="190" y1="140" x2="225" y2="140" stroke="#334155" stroke-width="1.5"/>
    <!-- Books on shelf -->
    <rect x="195" y="65" width="6" height="15" fill="#f59e0b" rx="1"/>
    <rect x="203" y="62" width="8" height="18" fill="#38bdf8" rx="1"/>
    <rect x="196" y="95" width="12" height="15" fill="#ec4899" rx="1"/>
    <rect x="210" y="92" width="7" height="18" fill="#10b981" rx="1"/>

    <!-- Office Desk -->
    <path d="M 20 160 L 220 160 L 210 205 L 30 205 Z" fill="#334155" filter="url(#shadow)"/>
    <rect x="25" y="155" width="190" height="8" fill="#475569" rx="2"/>

    <!-- Desk Props -->
    <!-- Laptop -->
    <path d="M 140 155 L 185 155 L 195 140 L 130 140 Z" fill="#94a3b8"/>
    <path d="M 132 140 L 193 140 L 193 142 L 132 142 Z" fill="#cbd5e1"/>
    <!-- Lamp -->
    <path d="M 110 160 L 115 130 L 125 130 L 130 160 Z" fill="#cbd5e1"/>
    <path d="M 105 130 C 105 115 135 115 135 130 Z" fill="#fbbf24"/>
    <ellipse cx="120" cy="130" rx="15" ry="4" fill="#f59e0b"/>
  </g>

  <!-- Ambient Light Cone -->
  <path d="M 120 130 L 60 205 L 170 205 Z" fill="url(#desk-light)" style="mix-blend-mode: screen;"/>

  <!-- Character 1: The Manager / Person explaining unreasonable action (Left) -->
  <g id="manager-character" transform="translate(15, 45)">
    <!-- Body & Suit -->
    <path d="M 45 115 L 75 115 L 70 160 L 35 160 Z" fill="#1e293b"/>
    <path d="M 45 115 L 60 135 L 75 115 Z" fill="#ffffff"/> <!-- Shirt collar -->
    <polygon points="57,125 60,150 63,125" fill="#ef4444"/> <!-- Red Tie -->
    
    <!-- Head & Face -->
    <circle cx="60" cy="90" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 43 90 C 43 75 77 75 77 90 C 77 82 70 78 60 78 C 50 78 43 82 43 90 Z" fill="#334155"/>
    
    <!-- Expressive Face: Skeptical/Unreasonable -->
    <!-- Eyebrows (tilted sharply) -->
    <line x1="50" y1="84" x2="58" y2="87" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="62" y1="87" x2="70" y2="84" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="54" cy="91" r="2" fill="#1e293b"/>
    <circle cx="66" cy="91" r="2" fill="#1e293b"/>
    <!-- Mouth: smug/stubborn flat line -->
    <path d="M 54 100 Q 60 97 66 100" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms & Gesture (Dismissive / Unyielding) -->
    <path d="M 45 120 L 25 135 L 40 145" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 75 120 L 95 110" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <circle cx="97" cy="108" r="5" fill="#fbcfe8"/> <!-- Hand pointing outward -->
  </g>

  <!-- Character 2: The Colleague / Observer reacting to "Buhe Qingli" (Right) -->
  <g id="observer-character" transform="translate(115, 35)">
    <!-- Body & Casual Sweater -->
    <path d="M 45 125 L 75 125 L 80 170 L 40 170 Z" fill="#38bdf8"/>
    <path d="M 45 125 C 50 135 70 135 75 125 C 65 120 55 120 45 125 Z" fill="#bae6fd"/> <!-- Collar -->

    <!-- Head & Face -->
    <circle cx="60" cy="100" r="18" fill="#fed7aa"/>
    <!-- Hair (Messy/Surprised) -->
    <path d="M 43 100 C 42 80 78 80 77 100 C 82 95 80 85 73 82 C 73 75 47 75 47 85 C 40 88 38 96 43 100 Z" fill="#b45309"/>

    <!-- Expressive Face: Shocked / Disbelieving ("Not making sense!") -->
    <!-- Raised Eyebrows -->
    <path d="M 50 90 Q 54 86 58 90" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 62 90 Q 66 86 70 90" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Wide Eyes -->
    <circle cx="54" cy="96" r="3.5" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="54" cy="96" r="1.5" fill="#1e293b"/>
    <circle cx="66" cy="96" r="3.5" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="66" cy="96" r="1.5" fill="#1e293b"/>
    <!-- Open Mouth (Shocked 'O') -->
    <ellipse cx="60" cy="108" rx="4" ry="6" fill="#78350f"/>

    <!-- Arms & Shocked Gesture (Hands on head/face in disbelief) -->
    <!-- Left arm raised to head -->
    <path d="M 45 130 C 35 120 30 105 40 100" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="41" cy="97" r="5" fill="#fed7aa"/>
    <!-- Right arm bent -->
    <path d="M 75 130 L 90 145 L 80 155" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Abstract Visual Metaphor / Unreasonable Scale Element floating on desk -->
  <g id="balance-scale-metaphor" transform="translate(100, 115)">
    <!-- Small desk plant to anchor props -->
    <path d="M -25 45 L -5 45 L -8 25 L -22 25 Z" fill="#10b981" rx="2"/>
    <ellipse cx="-15" cy="23" rx="12" ry="4" fill="#047857"/>
    <circle cx="-22" cy="15" r="8" fill="#34d399"/>
    <circle cx="-12" cy="10" r="10" fill="#10b981"/>
    <circle cx="-5" cy="16" r="7" fill="#059669"/>

    <!-- Tilted Unbalanced Scale (Representing "Buhe Qingli" - illogical / unfair tilt) -->
    <path d="M 20 40 L 40 40 L 30 10 Z" fill="#64748b"/>
    <!-- Tilted Beam -->
    <line x1="5" y1="15" x2="55" y2="25" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="18" r="4" fill="#d97706"/>
    
    <!-- Left Pan (Heavy / Down) -->
    <line x1="5" y1="15" x2="0" y2="35" stroke="#94a3b8" stroke-width="2"/>
    <line x1="5" y1="15" x2="15" y2="35" stroke="#94a3b8" stroke-width="2"/>
    <path d="M -3 35 Q 7 43 17 35 Z" fill="#fbbf24"/>
    
    <!-- Right Pan (High / Unbalanced) -->
    <line x1="55" y1="25" x2="45" y2="10" stroke="#94a3b8" stroke-width="2"/>
    <line x1="55" y1="25" x2="65" y2="10" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 43 10 Q 53 18 63 10 Z" fill="#fbbf24"/>
  </g>

  <!-- Foreground Frame Highlights -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>