<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="indoorGlow" cx="120" cy="110" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="woodGrad" x1="40" y1="160" x2="200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glows -->
  <circle cx="120" cy="120" r="110" fill="url(#indoorGlow)"/>

  <!-- Background Room Elements -->
  <!-- Wallpaper / Wall Divider -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#334155" stroke-width="2"/>
  <rect x="25" y="40" width="50" height="70" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="45" width="40" height="60" fill="#1e293b" opacity="0.6"/>
  <!-- Simple framed family picture silhouette inside -->
  <circle cx="50" cy="65" r="8" fill="#64748b"/>
  <path d="M38 85 Q50 72 62 85 Z" fill="#64748b"/>

  <!-- Warm Hanging Lamp -->
  <path d="M120 0 L120 45" stroke="#64748b" stroke-width="3"/>
  <path d="M100 45 L140 45 L145 55 L95 55 Z" fill="#475569"/>
  <circle cx="120" cy="55" r="10" fill="#fbbf24"/>

  <!-- Cozy Bookshelf in Background -->
  <rect x="175" y="50" width="35" height="90" fill="#334155" opacity="0.5"/>
  <line x1="175" y1="75" x2="210" y2="75" stroke="#1e293b" stroke-width="2"/>
  <line x1="175" y1="105" x2="210" y2="105" stroke="#1e293b" stroke-width="2"/>
  <!-- Books -->
  <rect x="180" y="60" width="6" height="15" fill="#f87171"/>
  <rect x="188" y="58" width="5" height="17" fill="#38bdf8"/>
  <rect x="195" y="62" width="8" height="13" fill="#34d399"/>
  <rect x="180" y="90" width="7" height="15" fill="#fb923c"/>
  <rect x="189" y="88" width="6" height="17" fill="#a78bfa"/>

  <!-- Ordinary Wooden Table -->
  <path d="M35 155 L205 155 L200 170 L40 170 Z" fill="url(#woodGrad)"/>
  <rect x="50" y="170" width="12" height="50" fill="#78350f"/>
  <rect x="178" y="170" width="12" height="50" fill="#78350f"/>

  <!-- Tabletop Props: Teapot, Teacup, Simple Desk Lamp -->
  <path d="M75 145 C75 138 85 138 85 145 Z" fill="#cbd5e1"/>
  <ellipse cx="80" cy="145" rx="8" ry="4" fill="#94a3b8"/>
  <path d="M72 148 Q67 148 68 152 Q72 155 77 151" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="65" y="151" width="30" height="4" rx="2" fill="#e2e8f0"/>
  <!-- Teacup -->
  <path d="M155 146 L167 146 C167 154 155 154 155 146 Z" fill="#e2e8f0"/>
  <path d="M167 148 C171 148 171 152 167 152" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Main Character: Young person in ordinary, comfortable everyday home attire -->
  <!-- Torso & Arms -->
  <path d="M95 160 C95 135 145 135 145 160 Z" fill="#38bdf8"/> <!-- Simple blue sweater -->
  <path d="M120 137 L120 155" stroke="#0284c7" stroke-width="1.5"/>
  
  <!-- Sleeves & Hands leaning on table -->
  <path d="M95 145 Q80 150 75 145" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="72" cy="145" r="5" fill="#fcd34d"/> <!-- Hand -->

  <path d="M145 145 Q160 150 165 145" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="168" cy="145" r="5" fill="#fcd34d"/> <!-- Hand -->

  <!-- Neck -->
  <rect x="113" y="122" width="14" height="18" fill="#fcd34d"/>

  <!-- Head & Face (Friendly, humble, focused expression) -->
  <circle cx="120" cy="112" r="22" fill="#fcd34d"/>
  
  <!-- Hair (Neat, humble black/dark-slate haircut) -->
  <path d="M99 112 C99 95 141 95 141 112 C141 106 138 98 120 97 C102 98 99 106 99 112 Z" fill="#1e293b"/>
  <path d="M100 110 Q110 102 122 107" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Facial Features -->
  <!-- Gentle Smiling Eyes -->
  <path d="M110 110 Q114 107 118 110" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M122 110 Q126 107 130 110" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M116 120 Q120 124 124 120" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="108" cy="115" r="3" fill="#f87171" opacity="0.4"/>
  <circle cx="132" cy="115" r="3" fill="#f87171" opacity="0.4"/>

  <!-- Foreground Floor Line -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a"/>
  
  <!-- Subtle warm accent light hitting floor -->
  <ellipse cx="120" cy="220" rx="70" ry="4" fill="#fbbf24" opacity="0.2"/>
</svg>