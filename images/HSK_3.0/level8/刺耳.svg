<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow for "Harsh/Sharp" Sound -->
  <circle cx="120" cy="115" r="70" fill="#FF4757" opacity="0.08"/>

  <g transform="translate(0, 0)">
    <!-- Shockwaves / Harsh sound waves radiating outwards -->
    <!-- Inner sharp jagged sound wave -->
    <path d="M 65 115 L 85 95 L 95 135 L 115 90 L 125 140 L 145 95 L 155 130 L 175 115" 
          fill="none" stroke="#FF4757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
          
    <!-- Outer sharp wave 1 -->
    <path d="M 50 115 L 75 80 L 90 150 L 120 70 L 135 155 L 165 85 L 190 115" 
          fill="none" stroke="#FF4757" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Outer sharp wave 2 (wider) -->
    <path d="M 35 115 L 65 65 L 85 165 L 120 50 L 140 170 L 175 75 L 205 115" 
          fill="none" stroke="#FFA502" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>

    <!-- Central Physical Object: Brake Disc & Brake Caliper (representing the context: "刹车片...刺耳的声音") -->
    <!-- Outer rotor disc -->
    <circle cx="120" cy="115" r="42" fill="none" stroke="#4A5568" stroke-width="6"/>
    
    <!-- Inner rotor slots / details -->
    <circle cx="120" cy="115" r="30" fill="none" stroke="#2D3748" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="120" cy="115" r="18" fill="#2D3748"/>
    <circle cx="120" cy="115" r="8" fill="#1A1D24"/>

    <!-- Brake Caliper clamping the top of the disc -->
    <path d="M 104 70 L 136 70 C 142 70, 146 74, 146 80 L 146 95 C 146 98, 143 100, 140 100 L 100 100 C 97 100, 94 98, 94 95 L 94 80 C 94 74, 98 70, 104 70 Z" fill="#E74C3C"/>
    
    <!-- Caliper detail / bolt -->
    <circle cx="120" cy="85" r="5" fill="#C0392B"/>

    <!-- Friction sparks flying off (indicating the harsh screeching) -->
    <path d="M 142 90 L 162 78" stroke="#FFA502" stroke-width="3" stroke-linecap="round"/>
    <path d="M 148 102 L 172 102" stroke="#FFA502" stroke-width="3" stroke-linecap="round"/>
    <path d="M 142 112 L 165 125" stroke="#FFA502" stroke-width="3" stroke-linecap="round"/>

    <!-- Tiny spark dots -->
    <circle cx="168" cy="88" r="2" fill="#FFA502"/>
    <circle cx="178" cy="112" r="1.5" fill="#FF4757"/>
    <circle cx="158" cy="135" r="2" fill="#FFA502"/>
  </g>
</svg>