<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Room background - wall -->
  <rect x="0" y="0" width="240" height="180" fill="#2d3a4b"/>

  <!-- Window in background -->
  <rect x="160" y="40" width="60" height="80" rx="8" fill="#38bdf8" opacity="0.2"/>
  <path d="M160 40 L220 40 L220 120 L160 120 Z" fill="#1e293b" opacity="0.1"/>
  <circle cx="190" cy="80" r="20" fill="#fbbf24" opacity="0.15"/>
  <path d="M190 40 L190 120 M160 80 L220 80" stroke="#1e293b" stroke-width="2" opacity="0.2"/>

  <!-- Bookshelf -->
  <rect x="20" y="30" width="40" height="120" rx="4" fill="#3a475a"/>
  <rect x="25" y="35" width="30" height="20" fill="#4d5b6f"/>
  <rect x="25" y="60" width="30" height="20" fill="#606f83"/>
  <rect x="25" y="85" width="30" height="20" fill="#4d5b6f"/>
  <rect x="25" y="110" width="30" height="20" fill="#606f83"/>

  <!-- Desk -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#3a475a"/>
  <path d="M0 160 L240 160 L240 180 L0 180 Z" fill="#4d5b6f"/>
  <path d="M20 160 C30 150 210 150 220 160 L220 180 C210 170 30 170 20 180 Z" fill="#606f83"/>

  <!-- Chair -->
  <rect x="80" y="100" width="80" height="80" rx="10" fill="#38bdf8" opacity="0.3"/>
  <path d="M80 100 C70 120 70 160 80 180 L160 180 C170 160 170 120 160 100 Z" fill="#38bdf8" opacity="0.4"/>

  <!-- Character (seated, reading) -->
  <!-- Body -->
  <path d="M120 100 C100 110 100 150 120 160 L120 160 C140 150 140 110 120 100 Z" fill="#606f83"/>
  <!-- Head -->
  <circle cx="120" cy="90" r="15" fill="#fbbf24" opacity="0.8"/>
  <!-- Hair -->
  <path d="M105 80 C100 75 100 95 105 100 L135 100 C140 95 140 75 135 80 Z" fill="#4d5b6f"/>
  <!-- Glasses -->
  <path d="M112 88 C115 85 125 85 128 88 M115 88 L125 88" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Nose -->
  <path d="M120 92 L118 94 L120 96" stroke="#1e293b" stroke-width="1" fill="none"/>
  <!-- Mouth (slight smile) -->
  <path d="M116 98 C118 99 122 99 124 98" stroke="#1e293b" stroke-width="1" fill="none"/>
  <!-- Hands holding book -->
  <path d="M100 140 C95 135 95 125 100 120 L110 120 C115 125 115 135 110 140 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M140 140 C145 135 145 125 140 120 L130 120 C125 125 125 135 130 140 Z" fill="#fbbf24" opacity="0.8"/>

  <!-- The Book -->
  <rect x="105" y="125" width="30" height="40" rx="3" fill="#606f83"/>
  <rect x="108" y="127" width="24" height="36" fill="#f0f0f0"/>
  <path d="M108 127 L115 127 L115 163 L108 163 Z" fill="#e0e0e0"/>
  <path d="M115 127 L122 127 L122 163 L115 163 Z" fill="#d0d0d0"/>
  <path d="M122 127 L129 127 L129 163 L122 163 Z" fill="#e0e0e0"/>

  <!-- Essence (精华) emanating from the book -->
  <circle cx="115" cy="120" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="125" cy="115" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="110" cy="110" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="130" cy="105" r="3.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="120" cy="100" r="2.8" fill="#fbbf24" opacity="0.75"/>
  <circle cx="118" cy="95" r="2.2" fill="#fbbf24" opacity="0.65"/>
  <circle cx="122" cy="90" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="110" cy="95" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="130" cy="95" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="120" cy="85" r="2.5" fill="#fbbf24" opacity="0.7"/>

  <!-- Desk Lamp -->
  <rect x="70" y="150" width="10" height="20" fill="#4d5b6f"/>
  <path d="M65 150 C60 140 70 130 75 130 C80 130 90 140 85 150 Z" fill="#fbbf24"/>
  <circle cx="75" cy="140" r="8" fill="#f59e0b" opacity="0.7"/>

  <!-- Pen -->
  <rect x="80" y="170" width="2" height="15" fill="#4d5b6f" transform="rotate(-30 80 170)"/>

  <!-- Mug -->
  <rect x="150" y="165" width="15" height="15" rx="4" fill="#606f83"/>
  <path d="M165 170 C168 170 168 175 165 175 C162 175 162 170 165 170 Z" fill="#606f83"/>
</svg>