<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Cushion Gradient (The star of the illustration: 垫) -->
    <linearGradient id="cushionGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Wood Chair Gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment Lighting -->
  <circle cx="120" cy="100" r="120" fill="url(#lampGlow)"/>

  <!-- Interior Background Elements -->
  <!-- Wall art / Window frame suggestion -->
  <path d="M160 40 L200 40 L200 90 L160 90 Z" fill="#334155" opacity="0.4" rx="4"/>
  <path d="M170 50 L190 50 L190 80 L170 80 Z" fill="#475569" opacity="0.3"/>

  <!-- House Plant on a small shelf -->
  <rect x="35" y="80" width="30" height="6" fill="#475569" rx="2"/>
  <path d="M42 80 L45 70 L55 70 L58 80 Z" fill="#cbd5e1"/>
  <circle cx="50" cy="64" r="8" fill="#10b981"/>
  <circle cx="43" cy="67" r="6" fill="#059669"/>
  <circle cx="56" cy="66" r="7" fill="#059669"/>

  <!-- Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- CHAIR & CUSHION (Focus of Sentence: 椅子上放了一个垫子) -->
  <g filter="url(#softShadow)">
    <!-- Chair Backrest Legs (Rear) -->
    <rect x="92" y="80" width="6" height="50" fill="#b45309" rx="3"/>
    <rect x="122" y="80" width="6" height="50" fill="#b45309" rx="3"/>

    <!-- Chair Backrest -->
    <path d="M88 85 L132 85 C136 85, 138 88, 138 92 L138 135 C138 138, 136 140, 132 140 L88 140 C84 140, 82 138, 82 135 L82 92 C82 88, 84 85, 88 85 Z" fill="url(#woodGrad)"/>
    <!-- Backrest cutouts for style -->
    <rect x="93" y="93" width="12" height="34" rx="6" fill="#0f172a" opacity="0.15"/>
    <rect x="115" y="93" width="12" height="34" rx="6" fill="#0f172a" opacity="0.15"/>

    <!-- Chair Seat Base -->
    <path d="M72 145 L152 145 C156 145, 158 148, 156 152 L150 162 C149 164, 146 166, 143 166 L79 166 C76 166, 73 164, 72 162 L66 152 C64 148, 66 145, 72 145 Z" fill="url(#woodGrad)"/>

    <!-- Chair Front Legs -->
    <rect x="76" y="162" width="6" height="36" fill="#b45309" rx="3"/>
    <rect x="138" y="162" width="6" height="36" fill="#b45309" rx="3"/>
    <!-- Rear Left Leg -->
    <rect x="88" y="162" width="5" height="28" fill="#92400e" rx="2"/>

    <!-- THE CUSHION / DIAN (垫) - Centered & Placed neatly on the chair seat -->
    <g transform="translate(0, 2)">
      <!-- Cushion Drop Shadow -->
      <ellipse cx="112" cy="148" rx="32" ry="10" fill="#000000" opacity="0.25"/>
      
      <!-- Main Cushion Body -->
      <path d="M80 142 C80 134, 94 130, 112 130 C130 130, 144 134, 144 142 C144 150, 130 154, 112 154 C94 154, 80 150, 80 142 Z" fill="url(#cushionGrad)"/>
      
      <!-- Cushion Top Highlight & Detail (Plump texture) -->
      <path d="M84 142 C84 136, 96 133, 112 133 C128 133, 140 136, 140 142 C140 148, 128 151, 112 151 C96 151, 84 148, 84 142 Z" fill="#f472b6" opacity="0.5"/>
      
      <!-- Tufting buttons on cushion -->
      <circle cx="102" cy="142" r="2.5" fill="#831843"/>
      <circle cx="122" cy="142" r="2.5" fill="#831843"/>
      
      <!-- Soft playful creases -->
      <path d="M96 137 Q102 140 108 137" stroke="#831843" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
      <path d="M116 137 Q122 140 128 137" stroke="#831843" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Cozy Props -->
  <!-- Small side table -->
  <rect x="175" y="145" width="40" height="8" fill="#334155" rx="3"/>
  <rect x="183" y="153" width="5" height="37" fill="#1e293b"/>
  <rect x="202" y="153" width="5" height="37" fill="#1e293b"/>
  
  <!-- Coffee mug on side table -->
  <rect x="187" y="130" width="14" height="15" fill="#38bdf8" rx="3"/>
  <path d="M201 134 C205 134, 206 140, 201 143" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Steam from mug -->
  <path d="M192 124 Q194 120 192 116" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Warm ambient hanging lamp casting light downwards -->
  <path d="M105 15 L135 15 L125 35 L115 35 Z" fill="#475569"/>
  <line x1="120" y1="0" x2="120" y2="15" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="37" r="6" fill="#fbbf24"/>

  <!-- Cute indoor cat resting near the chair (adds living space context) -->
  <g transform="translate(145, 175)">
    <!-- Cat body -->
    <ellipse cx="18" cy="12" rx="14" ry="10" fill="#fb923c"/>
    <!-- Cat head -->
    <circle cx="8" cy="8" r="9" fill="#fb923c"/>
    <!-- Ears -->
    <polygon points="2,4 5,0 8,5" fill="#f97316"/>
    <polygon points="10,3 13,-1 15,4" fill="#f97316"/>
    <!-- Tail -->
    <path d="M28 12 C34 12, 36 6, 34 3" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Sleeping eye -->
    <path d="M6 8 Q8 10 10 8" stroke="#7c2d12" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating particles / dust motes in warm light -->
  <circle cx="95" cy="70" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="55" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="110" cy="100" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="115" r="1.5" fill="#fbbf24" opacity="0.5"/>
</svg>