<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Boss/Manager area -->
    <radialGradient id="spotlight" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for window view -->
    <clipPath id="windowClip">
      <rect x="175" y="30" width="45" height="60" rx="4"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" fill="url(#spotlight)"/>

  <!-- Background Office Interior -->
  <!-- Wall panels & lines -->
  <line x1="0" y1="110" x2="240" y2="110" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="60" height="50" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <path d="M35 45 L75 45 M35 55 L65 55" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Window with Cityscape Silhouette -->
  <rect x="170" y="25" width="55" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <g clip-path="url(#windowClip)">
    <rect x="180" y="50" width="10" height="45" fill="#1e293b"/>
    <rect x="195" y="40" width="12" height="55" fill="#1e293b"/>
    <rect x="212" y="60" width="10" height="35" fill="#1e293b"/>
    <!-- City lights -->
    <circle cx="185" cy="55" r="1" fill="#fbbf24"/>
    <circle cx="200" cy="45" r="1" fill="#fbbf24"/>
    <circle cx="204" cy="52" r="1" fill="#38bdf8"/>
  </g>

  <!-- Bookshelf / Plants in background -->
  <rect x="100" y="35" width="50" height="65" fill="#1e293b" rx="2"/>
  <line x1="100" y1="55" x2="150" y2="55" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="75" x2="150" y2="75" stroke="#334155" stroke-width="2"/>
  <!-- Plant pot -->
  <path d="M112 55 L118 75 H106 Z" fill="#64748b"/>
  <path d="M106 53 C106 48 114 48 114 53" fill="#10b981"/>
  <path d="M110 52 C108 45 116 44 115 52" fill="#059669"/>

  <!-- Office Desk Surface -->
  <path d="M0 150 L240 150 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
  <path d="M0 150 L240 150" stroke="#475569" stroke-width="3"/>

  <!-- Props on Desk -->
  <!-- Laptop -->
  <path d="M125 155 L175 155 L185 178 L115 178 Z" fill="#64748b"/>
  <path d="M110 178 L190 178 L195 182 L105 182 Z" fill="#94a3b8" rx="2"/>
  <!-- Glowing laptop screen -->
  <path d="M130 120 L170 120 L175 155 L125 155 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <path d="M135 128 L165 128 M135 136 L155 136 M135 144 L160 144" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="85" y="155" width="14" height="18" rx="3" fill="#f8fafc"/>
  <path d="M99 159 C104 159 104 169 99 169" stroke="#f8fafc" stroke-width="2" fill="none"/>

  <!-- Documents / Folder Stamp of "Decision" -->
  <rect x="35" y="160" width="40" height="28" rx="2" fill="#f8fafc" transform="rotate(-5 35 160)"/>
  <line x1="42" y1="168" x2="65" y2="166" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="176" x2="60" y2="174" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Red "Approved/Action" Stamp icon -->
  <circle cx="62" cy="175" r="7" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M58 175 L61 178 L67 172" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- MAIN CHARACTER: The Employee making the bold unilateral move -->
  <g id="employee">
    <!-- Body / Torso -->
    <path d="M45 220 C45 190 60 175 80 175 C100 175 115 190 115 220 Z" fill="#3b82f6"/>
    <!-- Shirt collar -->
    <path d="M70 175 L80 190 L90 175 Z" fill="#f8fafc"/>
    <path d="M75 175 L80 182 L85 175 Z" fill="#ef4444"/> <!-- Red tie -->

    <!-- Head & Face -->
    <circle cx="80" cy="135" r="22" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M58 135 C58 115 102 115 102 135 C102 140 98 132 95 125 C85 118 75 118 65 125 C62 132 58 140 58 135 Z" fill="#1e293b"/>
    <!-- Confident / Daring Expression -->
    <!-- Determined Eyebrows -->
    <path d="M68 128 L78 131" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M92 128 L82 131" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes (focused) -->
    <circle cx="73" cy="135" r="2.5" fill="#1e293b"/>
    <circle cx="87" cy="135" r="2.5" fill="#1e293b"/>
    <!-- Smirk / Grin -->
    <path d="M74 145 Q80 150 87 144" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms & Hands in decisive gesture -->
    <!-- Back arm (resting/balancing) -->
    <path d="M55 190 L40 210 L50 215" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front arm slamming/pointing down decisively onto desk -->
    <path d="M100 185 L125 160 L140 160" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="140" cy="160" r="6" fill="#fbcfe8"/>
  </g>

  <!-- SECONDARY CHARACTER: Shocked Manager/Colleague observing from background (off-balance reaction) -->
  <g id="manager" transform="translate(140, 20)">
    <!-- Body leaning back in shock -->
    <path d="M30 160 C35 140 50 130 65 135 C80 140 85 160 85 190 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="55" cy="100" r="18" fill="#fbcfe8"/>
    <!-- Hair (neat manager style) -->
    <path d="M38 100 C38 85 72 85 72 100 C72 103 68 97 65 92 C55 88 55 88 45 92 C42 97 38 103 38 100 Z" fill="#475569"/>
    
    <!-- Shocked Expression -->
    <!-- Raised arched eyebrows -->
    <path d="M45 92 Q48 88 52 92" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M58 92 Q62 88 65 92" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Wide eyes -->
    <circle cx="48" cy="98" r="3.5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="48" cy="98" r="1.5" fill="#1e293b"/>
    <circle cx="62" cy="98" r="3.5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="62" cy="98" r="1.5" fill="#1e293b"/>
    <!-- Open "O" mouth of astonishment -->
    <ellipse cx="55" cy="111" rx="4" ry="6" fill="#1e293b"/>

    <!-- Hands up in disbelief/surprise gesture -->
    <path d="M35 140 L20 125" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="17" cy="122" r="4.5" fill="#fbcfe8"/>
    <path d="M75 145 L90 130" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="93" cy="127" r="4.5" fill="#fbcfe8"/>
  </g>

  <!-- Action/Energy Visual Cues (Impact lines / exclamation styling representing "unilateral/sudden decision") -->
  <g transform="translate(130, 140)">
    <path d="M 0 0 L 12 -8" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 5 15 L 20 10" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M -5 10 L -18 5" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

</svg>