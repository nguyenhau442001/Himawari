<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Design for "次日" (The next day / Following morning) -->
  <!-- Background transition elements: Night fading into Sunrise -->
  
  <!-- Subtle background landscape representing the passing of time -->
  <path d="M30 180 Q 90 150, 150 170 T 210 160 L 210 200 L 30 200 Z" fill="#222733"/>
  <path d="M40 190 Q 100 160, 180 180 L 210 185 L 210 200 L 30 200 Z" fill="#1E232D"/>

  <!-- Calendar Page Icon representing "Day / Date transition" -->
  <!-- Back/Previous Day Page (Darker tint) -->
  <rect x="75" y="65" width="90" height="105" rx="12" fill="#2A303C" opacity="0.6"/>

  <!-- Front/Next Day Page (Main focus) -->
  <rect x="70" y="75" width="100" height="110" rx="12" fill="#252D3D" stroke="#3A445A" stroke-width="2"/>
  
  <!-- Calendar Header Red/Gold accent for sunrise/morning -->
  <path d="M 70 87 A 12 12 0 0 1 82 75 L 158 75 A 12 12 0 0 1 170 87 L 170 105 L 70 105 Z" fill="#D97706"/>

  <!-- Binding Rings -->
  <rect x="95" y="68" width="8" height="14" rx="4" fill="#64748B"/>
  <rect x="137" y="68" width="8" height="14" rx="4" fill="#64748B"/>

  <!-- Morning Sun emerging from calendar / representing "次日" (Next day's dawn) -->
  <circle cx="120" cy="135" r="26" fill="#F59E0B"/>
  
  <!-- Sun rays / Morning light -->
  <path d="M120 95 L120 103" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 120 L96 122" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <path d="M152 120 L144 122" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 150 L102 144" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <path d="M144 150 L138 144" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>

  <!-- Horizon line inside sun symbol representing morning -->
  <rect x="94" y="133" width="52" height="4" rx="2" fill="#FEF3C7"/>

  <!-- Transition Arrow indicating forward movement in time (Next Day) -->
  <path d="M 175 125 C 190 125, 200 135, 200 150 C 200 165, 190 175, 175 175" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
  <polygon points="175,168 165,175 178,181" fill="#3B82F6"/>

  <!-- Small stars fading out on the left (night ending) -->
  <circle cx="45" cy="85" r="1.5" fill="#94A3B8" opacity="0.5"/>
  <circle cx="55" cy="110" r="1" fill="#94A3B8" opacity="0.3"/>
  <circle cx="35" cy="130" r="2" fill="#94A3B8" opacity="0.4"/>

</svg>