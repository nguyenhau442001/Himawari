<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Sky Gradient (Evening/Sunset) -->
    <linearGradient id="skyGrad" x1="120" y1="20" x2="120" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E222B"/>
      <stop offset="60%" stop-color="#2D2A32"/>
      <stop offset="100%" stop-color="#4E3536"/>
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="120" y1="40" x2="120" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF5E36"/>
    </linearGradient>

    <!-- Distant Sea Gradient -->
    <linearGradient id="seaGrad" x1="120" y1="120" x2="120" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F4259"/>
      <stop offset="100%" stop-color="#132B3C"/>
    </linearGradient>

    <!-- Rising Tide Wave Gradient (Foreground - Focus) -->
    <linearGradient id="tideWaveGrad" x1="120" y1="140" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    
    <!-- Secondary Wave Layer -->
    <linearGradient id="backWaveGrad" x1="120" y1="130" x2="120" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#005C8A"/>
    </linearGradient>
  </defs>

  <!-- Sky and Horizon -->
  <rect x="20" y="20" width="200" height="130" rx="12" fill="url(#skyGrad)"/>

  <!-- Sunset / Evening Sun -->
  <circle cx="120" cy="85" r="24" fill="url(#sunGrad)"/>

  <!-- Distant Mountains/Shoreline Silhouette -->
  <path d="M20 135 L50 120 L85 130 L130 115 L165 125 L200 110 L220 118 L220 150 L20 150 Z" fill="#15181E"/>

  <!-- Distant Sea -->
  <rect x="20" y="140" width="200" height="20" fill="url(#seaGrad)"/>

  <!-- Sandy Beach / Shore -->
  <path d="M20 185 Q 90 175, 220 195 L 220 220 L 20 220 Z" fill="#2E2822"/>
  
  <!-- Wet sand sheen near water -->
  <path d="M20 178 Q 110 170, 220 185 L 220 190 Q 110 175, 20 183 Z" fill="#3D342B" opacity="0.8"/>

  <!-- Back Water Wave (Rising) -->
  <path d="M20 170 C 70 155, 140 160, 220 150 L 220 185 C 140 195, 70 190, 20 185 Z" fill="url(#backWaveGrad)" opacity="0.7"/>

  <!-- MAIN FOCUS: The Rising Tide Wave (Tide coming in, "潮水") -->
  <!-- Sleek, dynamic flat vector wave curling forward onto the shore -->
  <path d="M15 190 
           C 50 165, 80 150, 110 135 
           C 125 128, 140 130, 145 138 
           C 150 146, 135 155, 120 158 
           C 105 161, 85 160, 75 168
           C 65 176, 90 185, 130 185
           C 170 185, 195 175, 220 165
           L 220 215 
           L 20 215 Z" 
        fill="url(#tideWaveGrad)"/>

  <!-- Foam / White Crest on the Advancing Tide -->
  <path d="M110 135 
           C 122 128, 138 130, 145 138 
           C 140 142, 128 140, 115 142 
           C 112 143, 110 138, 110 135 Z" 
        fill="#FFFFFF" opacity="0.9"/>
        
  <!-- Secondary Foam Splashes / Ripples indicating movement upward -->
  <path d="M68 165 C 75 162, 82 165, 80 169 C 78 173, 70 173, 68 165 Z" fill="#FFFFFF" opacity="0.7"/>
  <path d="M155 160 C 165 156, 175 160, 172 166 C 169 172, 158 170, 155 160 Z" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Subtle water highlights -->
  <path d="M50 190 C 80 180, 120 178, 160 185" stroke="#80EAFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Atmospheric Glow from Sunset on Water Edge -->
  <path d="M100 148 Q 120 142, 140 147" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

</svg>