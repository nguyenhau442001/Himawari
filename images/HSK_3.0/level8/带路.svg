<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain landscape background elements -->
  <path d="M20 240 L80 120 L140 240 Z" fill="#2C3440"/>
  <path d="M100 240 L160 100 L220 240 Z" fill="#252B36"/>
  
  <!-- Trail path -->
  <path d="M120 240 C120 180 180 180 180 120" stroke="#3A4454" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Guide character -->
  <g transform="translate(160, 100)">
    <!-- Body -->
    <path d="M0 0 L-10 40 L10 40 Z" fill="#FFB84D"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="12" fill="#FFB84D"/>
    <!-- Arm gesturing forward -->
    <path d="M5 5 L20 -5" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Following group (simplified) -->
  <g transform="translate(100, 160)">
    <circle cx="0" cy="-10" r="8" fill="#A0AEC0"/>
    <path d="M-5 0 L5 0" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="-5" r="7" fill="#718096"/>
    <path d="M15 5 L25 5" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>