<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Mountain Gradient (Distant) -->
    <linearGradient id="mountDistant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Mountain Gradient (Main Everest) -->
    <linearGradient id="mountMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Glacier/Snow Shadow Gradient -->
    <linearGradient id="snowShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Sunset/Dawn Glow on Peak -->
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Stars / Cosmos detail -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="30" cy="30" r="1" />
    <circle cx="70" cy="20" r="1.5" opacity="0.8" />
    <circle cx="120" cy="40" r="1" />
    <circle cx="170" cy="15" r="1.2" />
    <circle cx="210" cy="35" r="1.5" />
    <circle cx="45" cy="75" r="0.8" />
    <circle cx="195" cy="65" r="1" />
  </g>

  <!-- Sun / Dawn light bleeding from top right -->
  <circle cx="210" cy="40" r="60" fill="#f59e0b" opacity="0.15" filter="blur(15px)" />
  <path d="M 0,100 Q 120,40 240,80 L 240,240 L 0,240 Z" fill="url(#sunGlow)" opacity="0.4" />

  <!-- Distant Mountain Ranges -->
  <polygon points="-10,240 30,140 90,200 160,120 250,190 250,240" fill="url(#mountDistant)" opacity="0.7" />

  <!-- Main Mount Everest Silhouette & Facets -->
  <polygon points="100,240 140,80 148,83 180,240" fill="url(#mountMain)" />
  
  <!-- Snow Cap and Ridges -->
  <path d="M 140,80 L 175,130 L 155,145 L 138,125 L 120,150 L 105,135 Z" fill="url(#snowShadow)" />
  
  <!-- Rock Faces & Shadows (Polygon facets for low-poly/flat vector look) -->
  <polygon points="140,80 148,83 165,130 140,110" fill="#e2e8f0" />
  <polygon points="140,110 165,130 180,240 130,240" fill="#475569" opacity="0.5" />
  <polygon points="110,135 138,125 130,240 90,240" fill="#334155" opacity="0.6" />

  <!-- Summit Marker / Flag (Victory symbol) -->
  <g transform="translate(140, 75)">
    <line x1="0" y1="5" x2="0" y2="-12" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 0,-12 L 12,-8 L 0,-4 Z" fill="#ef4444" />
    <path d="M 0,-10 L 8,-7 L 0,-4 Z" fill="#dc2626" opacity="0.8" />
  </g>

  <!-- CLIMBER 1 (Leader standing triumphantly on ridge) -->
  <g transform="translate(148, 120)" filter="url(#softShadow)">
    <!-- Ice Axe held up -->
    <path d="M 8,-15 L 18,-30 M 14,-26 L 20,-24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    
    <!-- Backpack -->
    <rect x="-8" y="-5" width="8" height="12" rx="3" fill="#ea580c" />
    
    <!-- Body (Bent in triumph / stable stance) -->
    <path d="M -2,8 L -5,-3 L 4,-8 L 10,-15" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Head with Helmet & Goggles -->
    <circle cx="5" cy="-14" r="5" fill="#fde047" />
    <rect x="4" y="-16" width="5" height="3" rx="1.5" fill="#0f172a" />
    
    <!-- Legs in Snow -->
    <path d="M -2,8 L -6,22 M -2,8 L 4,20" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- CLIMBER 2 (Second climber catching up / reaching the ridge) -->
  <g transform="translate(122, 155)" filter="url(#softShadow)">
    <!-- Backpack -->
    <rect x="-10" y="-3" width="7" height="11" rx="2" fill="#16a34a" />
    
    <!-- Body (Leaning forward, climbing action) -->
    <path d="M -4,10 L 0,2 L 8,-2 L 12,-8" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Arms with trekking poles -->
    <path d="M 4,2 L 14,14 M 0,2 L -8,18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    
    <!-- Head with Helmet -->
    <circle cx="10" cy="-10" r="4.5" fill="#fde047" />
    
    <!-- Legs -->
    <path d="M -4,10 L -8,22 M -4,10 L 2,24" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Foreground Snowy Slopes & Texture -->
  <path d="M 0,200 Q 60,180 120,210 T 240,195 L 240,240 L 0,240 Z" fill="#f8fafc" />
  
  <!-- Crevasse / Ice shadows in foreground -->
  <path d="M 40,215 Q 70,210 95,225" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 150,220 Q 180,210 210,230" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Floating snow crystals/particles for atmospheric depth -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="90" cy="110" r="1.5" />
    <circle cx="110" cy="95" r="1" />
    <circle cx="170" cy="140" r="1.2" />
    <circle cx="130" cy="180" r="1.5" />
    <circle cx="75" cy="165" r="1" />
  </g>

  <!-- Subtle App Vignette Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
</svg>