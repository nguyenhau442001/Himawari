<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing atmospheric aura representing warmth & happiness -->
  <circle cx="120" cy="130" r="70" fill="#FFB703" opacity="0.08" filter="blur(10px)"/>
  <circle cx="120" cy="120" r="45" fill="#FFB703" opacity="0.15" filter="blur(6px)"/>

  <!-- ADJECTIVE CONTRAST / STATE VISUALIZATION:
       Representing generational warmth and harmonious family joy (tiānlúnzhīlè)
       using scale contrast and emotional bonding:
       - Central glowing connection point (Orange/Gold accent)
       - Stylized multi-generational figures embracing/together -->

  <!-- Outer ambient decorative elements (sparkles/joy motifs) -->
  <path d="M 60 70 L 63 76 L 69 79 L 63 82 L 60 88 L 57 82 L 51 79 L 57 76 Z" fill="#FFB703" opacity="0.4"/>
  <path d="M 180 85 L 182 89 L 186 91 L 182 93 L 180 97 L 178 93 L 174 91 L 178 89 Z" fill="#FFB703" opacity="0.5"/>
  <circle cx="85" cy="55" r="2" fill="#FB8500" opacity="0.6"/>
  <circle cx="160" cy="65" r="2.5" fill="#FFB703" opacity="0.6"/>

  <!-- Senior Figure (Left, supportive, large presence) -->
  <g id="senior-figure">
    <!-- Body/Shoulders -->
    <path d="M 70 170 C 70 145 95 140 105 140 C 115 140 125 150 125 170 Z" fill="#219EBC" opacity="0.9"/>
    <!-- Head -->
    <circle cx="95" cy="118" r="16" fill="#FFB703" opacity="0.9"/>
    <!-- Hair (Silver/White modern flat representation) -->
    <path d="M 80 116 C 80 108 88 102 96 102 C 104 102 110 108 110 114 C 105 112 100 112 95 114 Z" fill="#E0FBFC" opacity="0.8"/>
    <!-- Gentle smiling expression implied via posture/shape -->
    <path d="M 98 123 Q 101 126 104 123" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Junior / Child Figure (Right, smaller, elevated in joy / contrast) -->
  <g id="child-figure">
    <!-- Body/Shoulders -->
    <path d="M 135 165 C 135 150 148 145 155 145 C 162 145 170 152 170 165 Z" fill="#FB8500" opacity="0.9"/>
    <!-- Head -->
    <circle cx="152" cy="125" r="12" fill="#FFB703" opacity="0.9"/>
    <!-- Hair -->
    <path d="M 143 121 C 143 116 148 113 153 113 C 158 113 161 116 161 120 Z" fill="#219EBC" opacity="0.7"/>
    <!-- Joyful upward tilt -->
  </g>

  <!-- Central Core Symbol of Warmth / Heart-bond (Scale exaggeration for the abstract emotion) -->
  <g id="bonding-heart">
    <path d="M 120 100 
             C 105 85, 95 105, 120 125 
             C 145 105, 135 85, 120 100 Z" 
          fill="#FB8500"/>
    <path d="M 120 108 
             C 112 98, 107 108, 120 118 
             C 133 108, 128 98, 120 108 Z" 
          fill="#FFB703" opacity="0.8"/>
  </g>

  <!-- Connecting Embrace Arms -->
  <path d="M 105 150 C 115 135 125 135 135 150" stroke="#FFB703" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Additional structural baseline for grounding the flat vector composition -->
  <rect x="60" y="175" width="120" height="4" rx="2" fill="#2A2E39"/>
</svg>