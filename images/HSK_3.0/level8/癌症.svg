<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Doctor and Patient Scene -->
  <g transform="translate(20, 40)">
    <!-- Desk -->
    <rect x="0" y="120" width="200" height="10" fill="#334155" rx="2"/>
    <rect x="20" y="130" width="10" height="40" fill="#475569"/>
    <rect x="170" y="130" width="10" height="40" fill="#475569"/>
    
    <!-- Doctor -->
    <g transform="translate(130, 20)">
      <circle cx="20" cy="20" r="15" fill="#fde68a"/>
      <path d="M10 35h20v40h-20z" fill="#38bdf8"/>
      <rect x="12" y="35" width="16" height="10" fill="#e2e8f0"/>
    </g>
    
    <!-- Patient -->
    <g transform="translate(30, 30)">
      <circle cx="20" cy="20" r="15" fill="#fde68a"/>
      <path d="M5 40h30v50h-30z" fill="#94a3b8"/>
    </g>
    
    <!-- Medical Report/Screen -->
    <rect x="70" y="50" width="60" height="50" rx="4" fill="#f1f5f9"/>
    <rect x="80" y="60" width="40" height="6" rx="2" fill="#ec4899"/>
    <rect x="80" y="72" width="25" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="80" y="82" width="35" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Magnifying Glass -->
    <g transform="translate(100, 40)">
      <circle cx="10" cy="10" r="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <line x1="18" y1="18" x2="30" y2="30" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Clock on wall -->
    <circle cx="180" cy="10" r="12" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="180" y1="10" x2="180" y2="4" stroke="#fb923c" stroke-width="2"/>
    <line x1="180" y1="10" x2="186" y2="10" stroke="#fb923c" stroke-width="2"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="210" cy="210" r="40" fill="#10b981" opacity="0.1"/>
  <circle cx="30" cy="210" r="20" fill="#38bdf8" opacity="0.1"/>
</svg>