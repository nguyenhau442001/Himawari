<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (subtle ancient rock layers/erosion lines) -->
  <path d="M40 190 Q120 180 200 190" stroke="#252A34" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M50 205 Q120 195 190 205" stroke="#252A34" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Main Rock Mass (Dark Slate Grey with texture tones) -->
  <path d="M 45 130 
           C 60 128, 90 128, 120 142 
           C 150 155, 180 130, 195 135 
           L 205 185 
           L 35 185 
           Z" 
        fill="#2D3340" />

  <!-- Rock Top Surface Highlight -->
  <path d="M 45 130 
           C 60 128, 90 128, 120 142 
           C 150 155, 180 130, 195 135
           L 193 138
           C 178 133, 150 157, 120 144
           C 90 130, 60 130, 47 132
           Z" 
        fill="#3E4556" />

  <!-- THE INDENTATION (凹 - Depression / Pothole) -->
  <ellipse cx="120" cy="144" rx="35" ry="12" fill="#1A1D24" />
  
  <!-- Inner shadow of the depression for depth -->
  <path d="M 85 144 C 85 156, 155 156, 155 144 C 155 152, 85 152, 85 144 Z" fill="#20242E" />

  <!-- Rainwater pooling inside the depression (representing the contextual reference of rain washing the rock) -->
  <ellipse cx="120" cy="146" rx="28" ry="8" fill="#3B82F6" opacity="0.8" />
  <ellipse cx="116" cy="145" rx="20" ry="5" fill="#60A5FA" opacity="0.6" />

  <!-- Raindrops falling toward the indentation (Accent Gold/Orange and Light Blue) -->
  <g opacity="0.85">
    <!-- Droplet 1 -->
    <path d="M 85 95 Q 83 105 85 110 A 3 3 0 0 0 91 110 Q 93 105 91 95 Z" fill="#F59E0B" />
    <circle cx="88" cy="113" r="1.5" fill="#F59E0B" opacity="0.7"/>

    <!-- Droplet 2 -->
    <path d="M 120 75 Q 118 85 120 90 A 3 3 0 0 0 126 90 Q 128 85 126 75 Z" fill="#3B82F6" />
    
    <!-- Droplet 3 -->
    <path d="M 155 90 Q 153 100 155 105 A 3 3 0 0 0 161 105 Q 163 100 161 90 Z" fill="#F59E0B" />
    <circle cx="158" cy="108" r="1.5" fill="#F59E0B" opacity="0.7"/>

    <!-- Ripple effect inside the water pool -->
    <ellipse cx="120" cy="146" rx="12" ry="3" fill="none" stroke="#93C5FD" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="120" cy="146" rx="6" ry="1.5" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.9"/>
  </g>

  <!-- Side water splash drops upon impact -->
  <circle cx="95" cy="138" r="2" fill="#60A5FA" opacity="0.9"/>
  <circle cx="145" cy="138" r="1.5" fill="#60A5FA" opacity="0.9"/>

</svg>