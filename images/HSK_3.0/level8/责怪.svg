<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to create depth for dark mode -->
  <circle cx="120" cy="120" r="90" fill="#252A34" opacity="0.5"/>

  <!-- Character 1 (The Accuser / Blamer) -->
  <g id="blaming-character" transform="translate(10, 0)">
    <!-- Body & Shoulders -->
    <path d="M 65 180 C 65 155 75 140 95 140 C 115 140 125 155 125 180 Z" fill="#2F3542"/>
    <!-- Head -->
    <circle cx="95" cy="115" r="16" fill="#D1D5DB"/>
    <!-- Hair -->
    <path d="M 79 113 C 79 100 87 97 95 97 C 103 97 111 100 111 113 C 111 117 109 116 109 111 C 105 103 95 103 89 111 C 81 116 79 113 79 113 Z" fill="#4B5563"/>
    
    <!-- Pointing Arm (Dynamic Action) -->
    <!-- Upper arm & Forearm gesturing forward -->
    <path d="M 105 150 L 135 130 L 155 130" fill="none" stroke="#2F3542" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pointing Hand & Finger -->
    <circle cx="157" cy="130" r="5" fill="#D1D5DB"/>
    <path d="M 157 130 L 170 130" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Motion/Direction Lines indicating scolding/blaming dynamic -->
  <g id="motion-lines" opacity="0.8">
    <path d="M 140 115 L 155 115" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 145 122 L 163 122" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 137 129 L 150 129" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (The Accused / Receiving Blame - showing defense/regret) -->
  <g id="accused-character" transform="translate(15, 0)">
    <!-- Body & Shoulders (slightly cowering/withdrawn) -->
    <path d="M 140 180 C 140 158 150 145 165 145 C 180 145 190 158 190 180 Z" fill="#374151"/>
    <!-- Head (tilted down/back slightly) -->
    <circle cx="165" cy="120" r="15" fill="#9CA3AF"/>
    <!-- Hair -->
    <path d="M 151 118 C 151 107 158 103 165 103 C 172 103 179 107 179 118 C 179 121 177 120 177 116 C 173 108 165 108 161 116 C 153 120 151 118 151 118 Z" fill="#1F2937"/>
    
    <!-- Defensive / Surrendered Arms (Crossing/Pulling back in defense) -->
    <path d="M 155 155 L 140 165 L 150 175" fill="none" stroke="#374151" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="148" cy="177" r="4" fill="#9CA3AF"/>
  </g>

  <!-- Focus Accent: Subtle glowing ring on the interaction zone -->
  <ellipse cx="145" cy="130" rx="12" ry="25" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

</svg>