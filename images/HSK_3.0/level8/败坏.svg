<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Scene Background -->
  <path d="M0 160h240v80H0z" fill="#334155"/>
  <rect x="20" y="100" width="40" height="60" fill="#475569"/>
  <rect x="80" y="80" width="50" height="80" fill="#475569"/>
  <rect x="150" y="90" width="60" height="70" fill="#475569"/>
  
  <!-- Litter and Decay Elements -->
  <path d="M40 155l10 5-5 5z" fill="#fb923c"/>
  <path d="M180 150l15 10-10 10z" fill="#fb923c"/>
  <circle cx="120" cy="158" r="4" fill="#fb923c"/>
  
  <!-- Main Character (The one causing the disruption) -->
  <g transform="translate(140, 110)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M10 40l5 30M30 40l5 30" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 50l-15 10M35 50l15 10" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 15h2M25 15h2" stroke="#0f172a" stroke-width="2"/>
    <path d="M15 25q5 5 10 0" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Observing/Concerned Citizens -->
  <g transform="translate(40, 120)">
    <circle cx="10" cy="10" r="10" fill="#38bdf8"/>
    <path d="M10 20v20M5 30h10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="5" r="2" fill="#0f172a"/>
  </g>
  
  <g transform="translate(70, 125)">
    <circle cx="10" cy="10" r="10" fill="#10b981"/>
    <path d="M10 20v20M5 30h10" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="5" r="2" fill="#0f172a"/>
  </g>

  <!-- Symbolic "Social Fabric" tearing -->
  <path d="M20 180h200" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M100 170l20 20" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 170l-20 20" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
</svg>