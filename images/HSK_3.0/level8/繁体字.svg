<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Lamp Warm Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Book/Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Room Context -->
  <!-- Bookshelf & Books -->
  <g fill="#334155" opacity="0.6">
    <rect x="20" y="30" width="80" height="8" rx="2" />
    <rect x="30" y="14" width="10" height="16" rx="2" fill="#38bdf8" />
    <rect x="43" y="10" width="12" height="20" rx="2" fill="#ec4899" />
    <rect x="58" y="18" width="8" height="12" rx="1" fill="#10b981" />
    <rect x="70" y="12" width="14" height="18" rx="2" fill="#fb923c" />
  </g>

  <!-- Ambient Lamp Light Cone -->
  <circle cx="160" cy="50" r="90" fill="url(#lamp-glow)" />

  <!-- Wooden Desk Surface -->
  <path d="M10 180 L230 180 L230 220 L10 220 Z" fill="#0f172a" />
  <path d="M10 174 L230 174 L230 180 L10 180 Z" fill="#475569" />
  
  <!-- Desk Lamp Fixture -->
  <path d="M150 40 L170 45 L165 55 L145 50 Z" fill="#64748b" />
  <path d="M157 52 L157 174" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M140 174 L180 174" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- Open Old Book / Scroll on Desk -->
  <g filter="url(#shadow)">
    <!-- Book Cover/Base -->
    <path d="M50 160 Q 110 145 170 160 L160 195 Q 110 180 60 195 Z" fill="#0284c7" />
    <!-- Left Page -->
    <path d="M62 155 Q 110 142 112 188 Q 64 198 62 155 Z" fill="url(#paper-grad)" />
    <!-- Right Page -->
    <path d="M118 188 Q 120 142 168 155 Q 166 198 118 188 Z" fill="url(#paper-grad)" />
    
    <!-- Abstract Complex Glyph Illustrations (Representing intricate traditional characters) -->
    <!-- Left Page Glyphs (dense traditional style strokes using vector paths, NO actual letters) -->
    <path d="M75 165 C 75 160, 85 160, 85 165 C 85 170, 75 170, 75 175 M70 172 L90 172 M80 162 L80 182" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M95 163 L105 163 M100 163 L100 180 M93 172 L107 172 M95 180 L105 180" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Right Page Glyphs -->
    <path d="M125 165 L135 165 M130 162 L130 182 M123 172 L137 172 M125 180 L135 180" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M145 162 C 155 162, 155 182, 145 182 M150 162 L150 182" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Magnifying Glass (Showing 'recognition/reading' action) -->
  <g filter="url(#shadow)" transform="translate(20, -10)">
    <!-- Glass Rim -->
    <circle cx="130" cy="140" r="18" fill="none" stroke="#fbbf24" stroke-width="4" />
    <circle cx="130" cy="140" r="16" fill="#38bdf8" fill-opacity="0.15" />
    <!-- Glass Highlight -->
    <path d="M118 130 A 16 16 0 0 1 138 123" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Handle -->
    <path d="M143 153 L160 170" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Main Subject: Curious Character (Smart, expressive human leaning forward) -->
  <!-- Body / Torso -->
  <path d="M65 180 C 65 140, 95 130, 110 130 C 125 130, 155 140, 155 180 Z" fill="#3b82f6" />
  
  <!-- Collar / Shirt Detail -->
  <path d="M95 130 L110 145 L125 130 Z" fill="#f8fafc" />
  <path d="M102 133 L110 140 L118 133" stroke="#cbd5e1" stroke-width="2" fill="none" />

  <!-- Arms / Shoulders leaning over desk -->
  <!-- Left Arm -->
  <path d="M70 145 C 50 150, 45 170, 55 185" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" fill="none" />
  <circle cx="55" cy="185" r="7" fill="#f1c27d" /> <!-- Left Hand -->

  <!-- Right Arm (holding/pointing near book) -->
  <path d="M150 145 C 170 155, 165 175, 145 175" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" fill="none" />
  <circle cx="140" cy="175" r="7" fill="#f1c27d" /> <!-- Right Hand -->

  <!-- Neck -->
  <rect x="100" y="115" width="20" height="20" rx="6" fill="#f1c27d" />

  <!-- Head -->
  <circle cx="110" cy="95" r="28" fill="#f1c27d" filter="url(#shadow)" />

  <!-- Hair (Stylish, modern layered cut) -->
  <path d="M82 95 C 82 70, 138 70, 138 95 C 138 100, 135 95, 130 85 C 120 72, 100 72, 90 85 C 85 95, 82 95, 82 95 Z" fill="#1e293b" />
  <path d="M83 92 C 80 105, 85 115, 90 120" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M137 92 C 140 100, 136 110, 130 115" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Facial Expression: Focused, Intelligent, Recognizing & Understanding -->
  <!-- Eyebrows (Thoughtful / Confident arch) -->
  <path d="M96 88 Q 102 84 108 88" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M112 88 Q 118 84 124 88" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Eyes (Warm, engaged dots with sparkle) -->
  <circle cx="102" cy="94" r="3.5" fill="#0f172a" />
  <circle cx="118" cy="94" r="3.5" fill="#0f172a" />
  <circle cx="103" cy="93" r="1" fill="#ffffff" />
  <circle cx="119" cy="93" r="1" fill="#ffffff" />

  <!-- Glasses (Intellectual touch) -->
  <rect x="96" y="88" width="14" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <rect x="110" y="88" width="14" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <line x1="110" y1="94" x2="110" y2="94" stroke="#94a3b8" stroke-width="2" />

  <!-- Nose -->
  <path d="M110 98 Q 113 103 108 105" stroke="#d9a066" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Smile (Pleasant expression of recognizing and reading complex text easily) -->
  <path d="M103 110 Q 110 117 117 110" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Sparkle / Insight Effect (Floating clean accents indicating comprehension) -->
  <g fill="#38bdf8">
    <path d="M 180 80 Q 185 80 185 75 Q 185 80 190 80 Q 185 80 185 85 Q 185 80 180 80 Z" opacity="0.8" />
    <path d="M 45 90 Q 48 90 48 87 Q 48 90 51 90 Q 48 90 48 93 Q 48 90 45 90 Z" opacity="0.6" />
  </g>
  <g fill="#fbbf24">
    <path d="M 170 100 Q 173 100 173 97 Q 173 100 176 100 Q 173 100 173 103 Q 173 100 170 100 Z" opacity="0.9" />
  </g>
</svg>