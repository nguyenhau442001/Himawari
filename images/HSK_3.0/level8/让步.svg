<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Tabletop Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow Gradient for Tension -->
    <radialGradient id="tensionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Office/Meeting Room) -->
  <g id="environment">
    <!-- Window with city night lights -->
    <rect x="70" y="20" width="100" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="20" x2="120" y2="90" stroke="#334155" stroke-width="2"/>
    <!-- City lights background -->
    <rect x="80" y="40" width="12" height="18" rx="1" fill="#f59e0b" opacity="0.4"/>
    <rect x="98" y="50" width="14" height="25" rx="1" fill="#38bdf8" opacity="0.3"/>
    <rect x="130" y="35" width="10" height="30" rx="1" fill="#f59e0b" opacity="0.5"/>
    <rect x="148" y="45" width="12" height="20" rx="1" fill="#38bdf8" opacity="0.4"/>

    <!-- Ambient lighting / Tension glow in the center -->
    <circle cx="120" cy="130" r="80" fill="url(#tensionGlow)"/>

    <!-- Meeting Table -->
    <path d="M 40 160 L 200 160 L 220 200 L 20 200 Z" fill="url(#tableGrad)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="120" cy="160" rx="80" ry="12" fill="#475569"/>

    <!-- Desk Props: Blueprints / Documents in the middle -->
    <rect x="95" y="150" width="50" height="30" rx="2" fill="#cbd5e1" transform="rotate(-5 120 165)"/>
    <line x1="102" y1="158" x2="135" y2="155" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="102" y1="166" x2="130" y2="163" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Characters -->
  <!-- Character Left (Stubborn, leaning back, arms crossed) -->
  <g id="character-left">
    <!-- Body & Torso -->
    <path d="M 50 160 L 70 110 L 95 120 L 85 160 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="72" cy="95" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 58 92 C 58 80, 80 80, 86 92 Z" fill="#1e293b"/>
    <!-- Crossed Arm (Left) -->
    <path d="M 65 125 L 90 135 L 75 148 L 58 135 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <!-- Face: Stubborn Expression -->
    <path d="M 78 92 L 85 95" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Angry eyebrow -->
    <circle cx="81" cy="98" r="2" fill="#1e293b"/> <!-- Eye -->
    <path d="M 80 106 L 86 104" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Frown -->
  </g>

  <!-- Character Right (Stubborn, leaning back, arms crossed, turning away) -->
  <g id="character-right">
    <!-- Body & Torso -->
    <path d="M 190 160 L 170 110 L 145 120 L 155 160 Z" fill="#ef4444"/>
    <!-- Head -->
    <circle cx="168" cy="95" r="16" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 154 90 C 160 78, 182 82, 180 94 Z" fill="#78350f"/>
    <!-- Crossed Arm (Right) -->
    <path d="M 175 125 L 150 135 L 165 148 L 182 135 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
    <!-- Face: Stubborn Expression -->
    <path d="M 159 92 L 152 95" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Angry eyebrow -->
    <circle cx="157" cy="98" r="2" fill="#1e293b"/> <!-- Eye -->
    <path d="M 158 106 L 152 104" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Frown -->
  </g>

  <!-- Dramatic Tension Lines / Conflict Effect between them -->
  <g id="tension-indicators" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
    <line x1="110" y1="115" x2="115" y2="105"/>
    <line x1="120" y1="110" x2="120" y2="100"/>
    <line x1="130" y1="115" x2="125" y2="105"/>
  </g>
</svg>