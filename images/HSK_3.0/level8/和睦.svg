<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="110" r="110" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Background Details / Room Environment -->
  <!-- Wall & Floor -->
  <rect x="20" y="30" width="200" height="130" fill="#1e293b" rx="4"/>
  <rect x="20" y="160" width="200" height="50" fill="#0f172a"/>
  <!-- Floor line -->
  <line x1="20" y1="160" x2="220" y2="160" stroke="#334155" stroke-width="2"/>

  <!-- Window with night view -->
  <rect x="35" y="45" width="45" height="65" rx="4" fill="#334155"/>
  <rect x="38" y="48" width="39" height="59" rx="2" fill="url(#nightSky)"/>
  <circle cx="50" cy="60" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="65" cy="75" r="1" fill="#f8fafc" opacity="0.6"/>
  <!-- Window frame cross -->
  <line x1="57" y1="48" x2="57" y2="107" stroke="#334155" stroke-width="2"/>
  <line x1="38" y1="77" x2="77" y2="77" stroke="#334155" stroke-width="2"/>
  <!-- Curtain -->
  <path d="M35 45 Q42 80 38 110 L35 110 Z" fill="#64748b" opacity="0.6"/>

  <!-- Hanging Wall Picture Frame -->
  <rect x="160" y="50" width="35" height="25" rx="2" fill="#475569"/>
  <rect x="163" y="53" width="29" height="19" fill="#94a3b8"/>
  <circle cx="177.5" cy="60" r="4" fill="#fb923c"/>
  <path d="M165 67 L173 60 L180 65 L187 58 L189 67 Z" fill="#10b981"/>

  <!-- Warm Hanging Ceiling Lamp -->
  <line x1="120" y1="20" x2="120" y2="50" stroke="#64748b" stroke-width="2"/>
  <path d="M105 50 L135 50 L140 60 L100 60 Z" fill="#fbbf24"/>
  <ellipse cx="120" cy="60" rx="20" ry="6" fill="#f59e0b"/>

  <!-- Living Room Sofa -->
  <path d="M45 125 C45 115 55 110 70 110 L170 110 C185 110 195 115 195 125 L195 165 C195 170 190 175 185 175 L55 175 C50 175 45 170 45 165 Z" fill="#38bdf8"/>
  <path d="M40 120 C40 110 50 105 65 105 L175 105 C190 105 200 110 200 120 L200 155 C200 160 195 165 190 165 L50 165 C45 165 40 160 40 155 Z" fill="#0ea5e9"/>
  <!-- Sofa Cushions / Backrest Texture -->
  <line x1="90" y1="105" x2="90" y2="155" stroke="#0284c7" stroke-width="2" opacity="0.5"/>
  <line x1="150" y1="105" x2="150" y2="155" stroke="#0284c7" stroke-width="2" opacity="0.5"/>

  <!-- Center Coffee Table -->
  <rect x="85" y="165" width="70" height="20" rx="3" fill="#cbd5e1"/>
  <rect x="90" y="160" width="60" height="5" rx="1" fill="#f1f5f9"/>
  <rect x="95" y="185" width="6" height="15" fill="#94a3b8"/>
  <rect x="139" y="185" width="6" height="15" fill="#94a3b8"/>
  <!-- Teapot & Cups on Table -->
  <path d="M115 152 Q120 145 125 152 Z" fill="#ef4444"/>
  <circle cx="120" cy="150" r="7" fill="#ef4444"/>
  <path d="M102 155 L108 155 L106 160 L104 160 Z" fill="#f8fafc"/>
  <path d="M132 155 L138 155 L136 160 L134 160 Z" fill="#f8fafc"/>

  <!-- FAMILY CHARACTERS (Grandpa, Mother, Father, Child sitting together harmoniously) -->

  <!-- 1. Grandpa (Left side, smiling warmly) -->
  <g transform="translate(52, 105)">
    <!-- Body / Clothes -->
    <path d="M10 25 C10 15 20 10 32 10 C44 10 54 15 54 25 L54 60 L10 60 Z" fill="#475569"/>
    <!-- Head -->
    <circle cx="32" cy="0" r="13" fill="#fed7aa"/>
    <!-- Hair / Glasses -->
    <path d="M19 0 C19 -8 45 -8 45 0 Z" fill="#e2e8f0"/>
    <rect x="23" y="-3" width="9" height="5" rx="1" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <rect x="32" y="-3" width="9" height="5" rx="1" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="31" y1="-1" x2="33" y2="-1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Gentle Smile -->
    <path d="M29 4 Q32 7 35 4" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm around Mother / Relaxed -->
    <path d="M12 25 Q20 30 28 25" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 2. Mother (Left-Center, leaning in happily) -->
  <g transform="translate(85, 90)">
    <!-- Body -->
    <path d="M8 25 C8 15 20 10 32 10 C44 10 56 15 56 25 L56 75 L8 75 Z" fill="#ec4899"/>
    <!-- Hair -->
    <path d="M18 -5 C16 -12 48 -12 46 -5 C50 15 48 30 48 30 L16 30 C16 30 14 15 18 -5 Z" fill="#334155"/>
    <!-- Head -->
    <circle cx="32" cy="0" r="12" fill="#fed7aa"/>
    <!-- Face Expressions: Warm & Happy Eyes -->
    <circle cx="28" cy="-1" r="1.5" fill="#451a03"/>
    <circle cx="36" cy="-1" r="1.5" fill="#451a03"/>
    <path d="M29 5 Q32 8 35 5" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="26" cy="3" r="2.5" fill="#fda4af" opacity="0.6"/>
    <circle cx="38" cy="3" r="2.5" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- 3. Child (Center foreground, hugging a toy or holding hands, cheerful) -->
  <g transform="translate(112, 108)">
    <!-- Body -->
    <path d="M8 20 C8 12 16 8 26 8 C36 8 44 12 44 20 L44 57 L8 57 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="26" cy="-2" r="11" fill="#fed7aa"/>
    <!-- Hair Style (Buns) -->
    <circle cx="18" cy="-10" r="4" fill="#1e293b"/>
    <circle cx="34" cy="-10" r="4" fill="#1e293b"/>
    <path d="M16 -5 C20 -9 32 -9 36 -5 Z" fill="#1e293b"/>
    <!-- Big joyful smile -->
    <circle cx="22" cy="-3" r="1.5" fill="#1e293b"/>
    <circle cx="30" cy="-3" r="1.5" fill="#1e293b"/>
    <path d="M23 2 Q26 6 29 2" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="19" cy="0" r="2" fill="#fbcfe8" opacity="0.7"/>
    <circle cx="33" cy="0" r="2" fill="#fbcfe8" opacity="0.7"/>
    <!-- Arms raised happily -->
    <path d="M6 25 Q0 15 8 10" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <path d="M46 25 Q52 15 44 10" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 4. Father (Right side, smiling, arm around child/wife) -->
  <g transform="translate(145, 95)">
    <!-- Body -->
    <path d="M10 25 C10 15 20 10 32 10 C44 10 54 15 54 25 L54 70 L10 70 Z" fill="#3b82f6"/>
    <!-- Hair -->
    <path d="M18 -2 C18 -9 46 -9 46 -2 C46 3 44 6 44 6 L20 6 C20 6 18 3 18 -2 Z" fill="#0f172a"/>
    <!-- Head -->
    <circle cx="32" cy="0" r="12" fill="#fed7aa"/>
    <!-- Eyes & Smile -->
    <circle cx="28" cy="-1" r="1.5" fill="#1e293b"/>
    <circle cx="36" cy="-1" r="1.5" fill="#1e293b"/>
    <path d="M29 4 Q32 7 35 4" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Elements (Heart/Warmth accents subtly floating, purely visual, no text) -->
  <path d="M120 85 C120 80 126 75 129 80 C132 75 138 80 138 85 C138 91 129 96 129 96 C129 96 120 91 120 85 Z" fill="#f43f5e" opacity="0.85" transform="scale(0.8) translate(30, 20)"/>
  <path d="M40 75 C40 72 44 68 46 72 C48 68 52 72 52 75 C52 79 46 83 46 83 C46 83 40 79 40 75 Z" fill="#fb7185" opacity="0.7" transform="scale(0.7) translate(10, 10)"/>

  <!-- Little Pet (Cat sitting happily on the floor near the sofa, adding to harmony) -->
  <g transform="translate(170, 160)">
    <!-- Cat body -->
    <ellipse cx="15" cy="15" rx="12" ry="10" fill="#f97316"/>
    <!-- Cat head -->
    <circle cx="10" cy="5" r="8" fill="#f97316"/>
    <!-- Ears -->
    <polygon points="4,0 7,-6 10,-1" fill="#ea580c"/>
    <polygon points="12,-1 15,-6 18,0" fill="#ea580c"/>
    <!-- Tail -->
    <path d="M25 18 Q32 18 30 10" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <!-- Happy closed eyes ^ ^ -->
    <path d="M7 3 L9 5 L11 3" fill="none" stroke="#7c2d12" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Potted Plant in the corner for life and environment context -->
  <g transform="translate(15, 140)">
    <path d="M5 25 L15 25 L18 40 L2 40 Z" fill="#cbd5e1"/>
    <ellipse cx="10" cy="40" rx="8" ry="3" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M10 25 Q0 15 5 5 Q10 15 10 25 Z" fill="#22c55e"/>
    <path d="M10 25 Q15 10 22 2 Q18 15 10 25 Z" fill="#16a34a"/>
    <path d="M10 25 Q20 20 25 12 Q15 20 10 25 Z" fill="#4ade80"/>
  </g>
</svg>