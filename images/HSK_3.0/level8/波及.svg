<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Village Icon -->
  <g transform="translate(60, 80)">
    <path d="M60 20 L10 60 L110 60 Z" fill="#4A5568"/>
    <rect x="20" y="60" width="80" height="50" fill="#718096"/>
    <rect x="45" y="80" width="20" height="30" fill="#2D3748"/>
  </g>

  <!-- Spreading Fire/Impact Effect -->
  <path d="M140 100 C 160 80, 180 120, 200 100 C 210 130, 230 130, 230 160 C 210 150, 190 170, 170 150" fill="none" stroke="#ED8936" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Fire Flames -->
  <path d="M170 150 L180 120 L190 150 Z" fill="#DD6B20"/>
  <path d="M190 130 L200 100 L210 130 Z" fill="#F6AD55"/>
  <path d="M210 140 L220 110 L230 140 Z" fill="#DD6B20"/>

  <!-- Ground/Landscape -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#2D3748"/>
  
  <!-- Impact ripples/lines -->
  <circle cx="140" cy="130" r="4" fill="#ED8936"/>
  <circle cx="160" cy="140" r="6" fill="#ED8936"/>
</svg>