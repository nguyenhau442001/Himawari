<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%25" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="snow-road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="snow-pile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="orange-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Night city / winter evening) -->
  <g opacity="0.3">
    <!-- Buildings in distance -->
    <rect x="20" y="50" width="30" height="90" fill="#0f172a" rx="2"/>
    <rect x="60" y="30" width="45" height="110" fill="#0f172a" rx="2"/>
    <rect x="180" y="40" width="40" height="100" fill="#0f172a" rx="2"/>
    
    <!-- Warm window lights in background buildings -->
    <rect x="28" y="60" width="6" height="8" fill="#fbbf24" rx="1"/>
    <rect x="38" y="60" width="6" height="8" fill="#fbbf24" rx="1"/>
    <rect x="28" y="80" width="6" height="8" fill="#fbbf24" rx="1"/>
    
    <rect x="70" y="45" width="8" height="12" fill="#fbbf24" rx="1"/>
    <rect x="85" y="45" width="8" height="12" fill="#fbbf24" rx="1"/>
    <rect x="70" y="70" width="8" height="12" fill="#fbbf24" rx="1"/>
    <rect x="85" y="70" width="8" height="12" fill="#fbbf24" rx="1"/>
  </g>

  <!-- Glowing Street Lamp -->
  <path d="M 200 140 L 200 40 L 208 40 L 208 140 Z" fill="#64748b"/>
  <circle cx="204" cy="38" r="6" fill="#f59e0b"/>
  <!-- Streetlamp light cone -->
  <path d="M 204 44 L 140 180 L 230 180 Z" fill="#f59e0b" opacity="0.12"/>

  <!-- Road Surface (Perspective Plane) -->
  <path d="M 0 130 L 240 130 L 240 220 L 0 220 Z" fill="url(#snow-road)"/>

  <!-- Sidewalk curb -->
  <path d="M 0 130 L 240 130 L 240 138 L 0 138 Z" fill="#64748b"/>

  <!-- Uncleared Snow Banks on the sides -->
  <path d="M 0 130 Q 30 115 60 132 Q 90 120 120 135 Q 180 120 240 132 L 240 145 L 0 145 Z" fill="url(#snow-pile)"/>

  <!-- Action Scene: Worker clearing snow (Worker 1 - Shoveling) -->
  <g transform="translate(10, 0)">
    <!-- Worker Legs (Winter boots & pants) -->
    <path d="M 85 165 L 85 195 L 98 195 L 95 165 Z" fill="#334155"/>
    <path d="M 105 160 L 115 195 L 128 195 L 115 160 Z" fill="#334155"/>
    <rect x="83" y="193" width="18" height="5" rx="2" fill="#0f172a"/>
    <rect x="112" y="193" width="18" height="5" rx="2" fill="#0f172a"/>

    <!-- Worker Torso (High-vis orange jacket) -->
    <path d="M 85 125 C 80 125 75 145 80 165 L 120 165 C 125 145 120 125 115 125 Z" fill="url(#orange-suit)"/>
    <!-- Reflective stripe -->
    <path d="M 81 142 L 119 142 L 118 150 L 82 150 Z" fill="#facc15" opacity="0.9"/>

    <!-- Worker Head & Beanie -->
    <circle cx="100" cy="112" r="13" fill="#fde047"/>
    <!-- Cute friendly face profile (looking down-right at snow) -->
    <circle cx="107" cy="112" r="2.5" fill="#1e293b"/>
    <path d="M 108 118 Q 112 120 114 117" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 85 105 Q 100 90 115 105 Z" fill="#ef4444"/> <!-- Red Winter Beanie -->
    <circle cx="100" cy="98" r="4" fill="#ffffff"/> <!-- Pom pom -->

    <!-- Arms & Snow Shovel Action -->
    <!-- Back arm -->
    <path d="M 90 130 L 60 115" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <!-- Front arm pushing shovel -->
    <path d="M 105 135 L 135 155" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>

    <!-- Shovel handle and large scoop clearing snow -->
    <path d="M 50 100 L 160 170" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Shovel Blade lifting snow -->
    <path d="M 135 155 L 165 168 L 175 155 L 145 142 Z" fill="#64748b"/>
    
    <!-- Flying Snow particles (effect of clearing/cleaning) -->
    <circle cx="160" cy="140" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="170" cy="130" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="185" cy="125" r="3.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="175" cy="115" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Secondary Context: Cleaned Road Path vs Uncleaned Snow -->
  <!-- Dark asphalt path freshly cleared -->
  <path d="M 0 150 Q 80 145 240 160 L 240 210 Q 80 190 0 200 Z" fill="#334155" opacity="0.8"/>

  <!-- Sparkles / Cleared effect indicators -->
  <g fill="#38bdf8">
    <path d="M 70 175 L 72 180 L 77 182 L 72 184 L 70 189 L 68 184 L 63 182 L 68 180 Z" transform="scale(0.6) translate(60, 90)" />
    <path d="M 130 190 L 132 195 L 137 197 L 132 199 L 130 204 L 128 199 L 123 197 L 128 195 Z" transform="scale(0.8) translate(40, 30)" />
    <path d="M 190 160 L 191 163 L 194 164 L 191 165 L 190 168 L 189 165 L 186 164 L 189 163 Z" transform="scale(0.7) translate(80, 20)" />
  </g>

  <!-- Foreground snow drifts framing the bottom corners -->
  <path d="M 0 200 Q 50 180 90 220 L 0 240 Z" fill="url(#snow-pile)" opacity="0.9"/>
  <path d="M 240 190 Q 200 175 160 220 L 240 220 Z" fill="url(#snow-pile)" opacity="0.9"/>

  <!-- Snowy texture flecks in foreground -->
  <circle cx="40" cy="210" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="65" cy="225" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="205" cy="205" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="180" cy="215" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Border Frame Accent -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
</svg>