<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall Room Structure -->
  <rect x="20" y="20" width="200" height="170" fill="#1e293b" rx="4"/>
  
  <!-- Floor -->
  <path d="M 20 190 L 220 190 L 230 220 L 10 220 Z" fill="#090d16"/>
  <line x1="20" y1="190" x2="220" y2="190" stroke="#0f172a" stroke-width="2"/>

  <!-- Window showing dark rainy/difficult night outside -->
  <rect x="145" y="35" width="55" height="75" rx="4" fill="#0b1329" stroke="#334155" stroke-width="2"/>
  <path d="M 145 35 L 200 35 L 200 110 L 145 110 Z" fill="url(#moonlight)"/>
  <!-- Raindrops on window -->
  <line x1="155" y1="45" x2="153" y2="55" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="175" y1="65" x2="173" y2="78" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="188" y1="48" x2="186" y2="58" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="162" y1="85" x2="160" y2="95" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Window Frame Cross -->
  <line x1="172" y1="35" x2="172" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="145" y1="72" x2="200" y2="72" stroke="#334155" stroke-width="2"/>

  <!-- Shelves with messy, piled-up bills/documents (symbolizing pressure/difficulty) -->
  <rect x="35" y="45" width="75" height="6" rx="2" fill="#475569"/>
  <!-- Stack of red past-due notices / bills -->
  <path d="M 45 45 L 65 45 L 63 32 L 43 32 Z" fill="#ef4444" opacity="0.85"/>
  <path d="M 52 45 L 75 45 L 72 28 L 50 28 Z" fill="#f87171" opacity="0.9"/>
  <path d="M 68 45 L 92 45 L 90 35 L 66 35 Z" fill="#ef4444" opacity="0.75"/>
  <circle cx="85" cy="40" r="3" fill="#fb923c"/> <!-- warning icon dot -->

  <!-- Desk Surface -->
  <path d="M 25 155 L 215 155 L 220 190 L 20 190 Z" fill="#334155"/>
  <rect x="20" y="150" width="200" height="8" rx="2" fill="#475569"/>

  <!-- Desk Props: Laptop open showing complex data/charts -->
  <path d="M 95 150 L 145 150 L 152 132 L 88 132 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="94" y="150" width="53" height="4" rx="1" fill="#64748b"/>
  <!-- Screen Content: Red downward trend chart -->
  <path d="M 95 135 L 140 135 L 140 148 L 95 148 Z" fill="#0f172a"/>
  <polyline points="100,138 112,142 124,140 137,146" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="137" cy="146" r="2" fill="#ef4444"/>

  <!-- Coffee Mug (Empty / Overturned or steaming faintly) -->
  <rect x="65" y="136" width="14" height="16" rx="2" fill="#cbd5e1"/>
  <path d="M 79 140 C 83 140 83 148 79 148" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <!-- Steam lines -->
  <path d="M 70 128 C 72 125 68 122 70 118" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Desk Lamp (Providing dramatic downward lighting) -->
  <circle cx="180" cy="115" r="35" fill="url(#lampGlow)"/>
  <path d="M 180 120 L 175 150 L 185 150 Z" fill="#475569"/> <!-- Lamp base -->
  <path d="M 170 120 L 190 120 L 185 110 L 175 110 Z" fill="#fbbf24"/> <!-- Lamp shade -->
  <line x1="180" y1="120" x2="180" y2="135" stroke="#334155" stroke-width="3"/> <!-- arm -->

  <!-- CHARACTER (Stressed, overwhelmed man at desk) -->
  <!-- Body leaning forward -->
  <g transform="translate(0, 5)">
    <!-- Back / Shoulders -->
    <path d="M 105 155 C 105 135 120 125 135 128 C 150 131 155 145 155 155 Z" fill="url(#shirtGrad)"/>
    
    <!-- Head in Hands / Face in Palms Pose (Classic expression of difficult predicament) -->
    <!-- Arms crossed supporting head -->
    <path d="M 112 142 C 120 132 140 132 148 142 C 152 148 145 155 138 152 C 130 148 125 148 118 152 C 112 155 108 148 112 142 Z" fill="#334155"/>
    
    <!-- Hands clasping forehead -->
    <circle cx="125" cy="132" r="7" fill="#fbcfe8"/>
    <circle cx="135" cy="132" r="7" fill="#fbcfe8"/>

    <!-- Head / Hair slumped down -->
    <ellipse cx="130" cy="122" rx="14" ry="13" fill="#fbcfe8"/>
    <!-- Messy dark hair -->
    <path d="M 116 122 C 115 112 124 108 132 108 C 142 108 145 116 144 125 C 140 120 135 112 128 113 C 120 114 118 118 116 122 Z" fill="#1e293b"/>

    <!-- Slumped Back / Spine contour -->
    <path d="M 115 130 C 110 140 110 148 115 155" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Atmospheric Lighting Overlay & Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="70%" stop-color="#0f172a" stop-opacity="0"/>
    <stop offset="100%" stop-color="#090d16" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#vignette)" pointer-events="none"/>
</svg>