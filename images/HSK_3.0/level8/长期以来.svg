<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "Long-term/Time-honored" through a sturdy, ancient stone bridge connecting two landmasses, symbolizing enduring connection over time -->
  
  <!-- Background water/depth -->
  <path d="M0 160 Q120 190 240 160 L240 240 L0 240 Z" fill="#252A33"/>
  
  <!-- Bridge Structure -->
  <path d="M40 150 L200 150 L190 170 L50 170 Z" fill="#4A5568"/>
  <path d="M60 150 L60 130 L80 130 L80 150 Z" fill="#718096"/>
  <path d="M110 150 L110 130 L130 130 L130 150 Z" fill="#718096"/>
  <path d="M160 150 L160 130 L180 130 L180 150 Z" fill="#718096"/>
  
  <!-- The "Long-term" aspect: An hourglass shape integrated into the bridge's central pillar, showing sand flowing, representing the passage of time -->
  <g transform="translate(120, 110)">
    <path d="M-15 -20 L15 -20 L5 0 L15 20 L-15 20 L-5 0 Z" fill="#D69E2E"/>
    <circle cx="0" cy="0" r="2" fill="#F6E05E"/>
  </g>
  
  <!-- Connection/Cooperation: Two hands shaking firmly above the bridge, representing the "Close Cooperation" mentioned in the context -->
  <g transform="translate(120, 80)">
    <path d="M-30 0 C-40 0 -40 20 -20 20 L0 10 L10 20 L20 10 L0 0 Z" fill="#ECC94B"/>
    <path d="M30 0 C40 0 40 20 20 20 L0 10 L-10 20 L-20 10 L0 0 Z" fill="#D69E2E"/>
  </g>
  
  <!-- Decorative elements representing stability -->
  <rect x="40" y="170" width="20" height="10" fill="#2D3748"/>
  <rect x="180" y="170" width="20" height="10" fill="#2D3748"/>
</svg>