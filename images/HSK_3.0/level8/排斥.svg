<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="150" y="25" width="65" height="75" rx="4"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Interior Office Environment -->
  <!-- Back Wall -->
  <rect x="15" y="15" width="210" height="155" fill="#1e293b"/>
  <!-- Floor -->
  <path d="M15 170 L225 170 L240 225 L0 225 Z" fill="#0f172a"/>
  <!-- Floor tile lines for depth -->
  <line x1="60" y1="170" x2="30" y2="225" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="120" y1="170" x2="110" y2="225" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="180" y1="170" x2="190" y2="225" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Window & Cityscape outside -->
  <rect x="148" y="23" width="69" height="79" rx="6" fill="#0b0f19"/>
  <rect x="150" y="25" width="65" height="75" rx="4" fill="#111827"/>
  <g clip-path="url(#windowClip)">
    <rect x="158" y="55" width="12" height="45" fill="#1f2937"/>
    <rect x="176" y="40" width="14" height="60" fill="#1f2937"/>
    <rect x="196" y="65" width="10" height="35" fill="#1f2937"/>
    <!-- Window soft gradient -->
    <rect x="150" y="25" width="65" height="75" fill="url(#windowLight)"/>
  </g>
  <!-- Window Frame Divider -->
  <line x1="182" y1="25" x2="182" y2="100" stroke="#0b0f19" stroke-width="2"/>
  <line x1="150" y1="62" x2="215" y2="62" stroke="#0b0f19" stroke-width="2"/>

  <!-- Office Plant in background -->
  <path d="M25 145 C25 130 35 125 35 110 C35 125 45 130 45 145 Z" fill="#10b981"/>
  <path d="M20 152 C20 140 28 135 28 122 C28 135 36 140 36 152 Z" fill="#059669" transform="rotate(-15 28 152)"/>
  <path d="M30 155 C30 142 38 137 38 125 C38 137 46 142 46 155 Z" fill="#34d399" transform="rotate(15 38 155)"/>
  <path d="M28 155 L40 155 L37 172 L31 172 Z" fill="#64748b"/>

  <!-- Office Desks -->
  <!-- Left Desk (Colleagues) -->
  <rect x="15" y="115" width="85" height="60" rx="3" fill="#334155"/>
  <rect x="15" y="110" width="85" height="8" rx="2" fill="#475569"/>
  <!-- Right Desk (Isolated Guy) -->
  <rect x="135" y="125" width="80" height="55" rx="3" fill="#334155"/>
  <rect x="135" y="120" width="80" height="8" rx="2" fill="#475569"/>

  <!-- Desk Props (Colleagues' side) -->
  <rect x="25" y="95" width="22" height="18" rx="2" fill="#64748b"/>
  <rect x="27" y="97" width="18" height="12" fill="#38bdf8"/>
  <path d="M65 98 C65 93 75 93 75 98 C75 103 65 103 65 98 Z" fill="#fb923c" opacity="0.8"/> <!-- Coffee mug -->
  <rect x="55" y="102" width="12" height="10" fill="#cbd5e1"/> <!-- Papers -->

  <!-- Desk Props (Isolated guy's side) -->
  <rect x="150" y="103" width="24" height="20" rx="2" fill="#64748b"/>
  <rect x="152" y="105" width="20" height="14" fill="#0ea5e9"/>
  <line x1="185" y1="112" x2="200" y2="112" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="185" y1="116" x2="195" y2="116" stroke="#cbd5e1" stroke-width="2"/>

  <!-- COLLEAGUES GROUP (Left/Center, interacting, laughing/chatting) -->
  <!-- Colleague 1 (Female) -->
  <g transform="translate(45, 95)">
    <!-- Body -->
    <path d="M0 45 L20 45 L25 75 L-5 75 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="10" cy="22" r="11" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M-1 15 C-1 10 10 8 20 14 C23 20 22 30 18 32 C10 32 1 25 -1 15 Z" fill="#831843"/>
    <!-- Arm gesturing -->
    <path d="M18 45 L32 35 L30 30 L22 38 Z" fill="#ec4899"/>
    <circle cx="32" cy="28" r="3.5" fill="#fbcfe8"/>
    <!-- Face happy expression -->
    <path d="M7 23 Q10 27 13 23" stroke="#831843" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Colleague 2 (Male leaning in) -->
  <g transform="translate(75, 90)">
    <!-- Body -->
    <path d="M0 50 L25 50 L20 80 L-5 80 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="10" cy="18" r="10" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M1 12 C3 6 18 6 19 13 C14 11 5 11 1 12 Z" fill="#1e293b"/>
    <!-- Arm pointing/laughing -->
    <path d="M5 45 L-10 35 L-8 30 L3 40 Z" fill="#3b82f6"/>
    <circle cx="-12" cy="32" r="3" fill="#fed7aa"/>
    <!-- Face laughing -->
    <circle cx="13" cy="18" r="1.5" fill="#1e293b"/>
    <path d="M8 21 Q11 25 14 21" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ISOLATED SUBJECT ("他" - Left out, sitting alone at his desk) -->
  <g transform="translate(150, 100)">
    <!-- Chair back -->
    <rect x="20" y="15" width="16" height="40" rx="4" fill="#475569"/>
    <!-- Body slumped/withdrawn -->
    <path d="M12 35 C12 25 25 25 32 40 L35 75 L10 75 Z" fill="#64748b"/>
    <!-- Head resting slightly down -->
    <circle cx="20" cy="16" r="11" fill="#fed7aa"/>
    <!-- Hair neat but drooping -->
    <path d="M10 12 C10 5 28 5 30 14 C25 10 15 10 10 12 Z" fill="#334155"/>
    
    <!-- Downcast / Sad Face Expression -->
    <line x1="16" y1="15" x2="19" y2="16" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="16" x2="25" y2="15" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M17 22 Q20 20 23 22" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Arms crossed / lowered defensively -->
    <path d="M15 45 L32 48 L28 58 L14 52 Z" fill="#475569"/>
    <circle cx="32" cy="50" r="3" fill="#fed7aa"/>
  </g>

  <!-- SOCIAL GAP / BARRIER EFFECT -->
  <!-- Subtle warm pool of light over the colleagues showing their exclusive bubble -->
  <ellipse cx="65" cy="120" rx="45" ry="25" fill="url(#warmGlow)"/>

  <!-- Empty visual space / physical gap between groups emphasizing "排斥" (exclusion) -->
  <line x1="120" y1="110" x2="120" y2="175" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Additional interior details: Ceiling lamp -->
  <path d="M105 15 L135 15 L125 0 L115 0 Z" fill="#475569"/>
  <line x1="120" y1="0" x2="120" y2="15" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="120" cy="15" rx="15" ry="4" fill="#64748b"/>
</svg>