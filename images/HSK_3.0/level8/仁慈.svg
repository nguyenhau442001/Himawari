<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Warm Hearth/Window Glow -->
    <radialGradient id="window-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Ambient Light for Woman (Merciful Aura) -->
    <radialGradient id="aura" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Cat Fur Gradients -->
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Dark Mode Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Environment / Cozy Room Context -->
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a"/>
  
  <!-- Back Wall & Window -->
  <rect x="25" y="35" width="90" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Window Panes & Night View -->
  <rect x="35" y="45" width="33" height="48" rx="4" fill="#090d16"/>
  <rect x="73" y="45" width="33" height="48" rx="4" fill="#090d16"/>
  <rect x="35" y="98" width="33" height="42" rx="4" fill="#090d16"/>
  <rect x="73" y="98" width="33" height="42" rx="4" fill="#090d16"/>
  
  <!-- Snowy night outside window (relates to kindness: taking in a cold stray) -->
  <circle cx="45" cy="60" r="1.5" fill="#94a3b8" opacity="0.8"/>
  <circle cx="85" cy="75" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="95" cy="115" r="1.5" fill="#94a3b8" opacity="0.9"/>
  <circle cx="50" cy="120" r="1" fill="#94a3b8" opacity="0.7"/>

  <!-- Window Glow Effect -->
  <circle cx="80" cy="95" r="70" fill="url(#window-glow)"/>

  <!-- Cozy Bookshelf Background Element -->
  <rect x="180" y="55" width="45" height="125" rx="4" fill="#172033" stroke="#283548" stroke-width="1.5"/>
  <line x1="180" y1="90" x2="225" y2="90" stroke="#283548" stroke-width="1.5"/>
  <line x1="180" y1="130" x2="225" y2="130" stroke="#283548" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="188" y="70" width="8" height="20" rx="1" fill="#38bdf8"/>
  <rect x="198" y="67" width="6" height="23" rx="1" fill="#ec4899"/>
  <rect x="206" y="72" width="10" height="18" rx="1" fill="#f59e0b"/>
  <rect x="187" y="105" width="12" height="25" rx="1" fill="#10b981"/>
  <rect x="201" y="108" width="7" height="22" rx="1" fill="#6366f1"/>

  <!-- Potted Plant (Adds warmth & life) -->
  <path d="M210 180 L225 180 L220 200 L215 200 Z" fill="#64748b"/>
  <path d="M205 180 H230 V183 H205 Z" fill="#94a3b8"/>
  <path d="M217 180 C210 160 190 155 190 155 C190 155 205 170 217 180 Z" fill="#10b981"/>
  <path d="M217 180 C225 155 240 160 240 160 C240 160 225 175 217 180 Z" fill="#059669"/>

  <!-- Cozy Armchair -->
  <path d="M100 120 C100 105 115 95 135 95 L165 95 C185 95 200 105 200 120 L200 185 C200 190 195 195 190 195 L110 195 C105 195 100 190 100 185 Z" fill="#3b82f6"/>
  <!-- Armchair Seat Cushion & Inner Shadow -->
  <path d="M105 140 L195 140 L195 180 C195 185 190 188 185 188 L115 188 C110 188 105 185 105 180 Z" fill="#2563eb"/>
  <path d="M115 115 L185 115 L190 145 L110 145 Z" fill="#1d4ed8"/>

  <!-- MERCIFUL WOMAN CHARACTER -->
  <!-- Gentle Aura Around Her -->
  <circle cx="130" cy="120" r="50" fill="url(#aura)"/>

  <!-- Body / Torso (leaning forward gently) -->
  <path d="M110 135 C110 125 125 120 135 135 L145 165 C145 170 140 175 135 175 L115 175 C110 175 108 170 110 165 Z" fill="#ec4899"/>
  
  <!-- Soft Warm Scarf (signifying care and warmth) -->
  <path d="M125 125 C135 125 145 130 145 138 C145 142 140 145 135 145 C130 145 128 142 125 138 Z" fill="#f43f5e"/>
  <path d="M135 142 L138 168 C138 170 135 172 133 172 C131 172 129 170 130 168 L134 142" fill="#f43f5e"/>

  <!-- Neck & Head -->
  <path d="M125 118 L133 118 L133 125 L125 125 Z" fill="#fbcfe8"/>
  <circle cx="129" cy="105" r="16" fill="#fbcfe8"/>
  
  <!-- Hair (Warm Brown, Gentle Styling) -->
  <path d="M113 105 C113 93 121 90 129 90 C137 90 145 93 145 105 C145 112 143 120 143 120 L140 120 C140 120 141 110 137 105 C133 100 125 100 121 105 C117 110 115 120 115 120 L113 120 C113 120 113 112 113 105 Z" fill="#78350f"/>

  <!-- Gentle Facial Expression (Kind Eyes, Soft Smile) -->
  <!-- Closed happy/compassionate eye (curved line) -->
  <path d="M124 104 C126 106 128 106 130 104" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="123" cy="108" r="3" fill="#fda4af" opacity="0.7"/>
  <!-- Gentle Smile -->
  <path d="M127 112 C129 114 131 114 133 112" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Arms reaching out gently to hold the rescued cat -->
  <!-- Left Arm -->
  <path d="M120 132 C120 132 105 138 95 135 C90 133 88 135 90 138 C93 143 102 145 112 140 Z" fill="#ec4899"/>
  <!-- Right Arm & Hand -->
  <path d="M138 132 C138 132 148 140 155 145 C158 147 156 150 153 148 C145 142 135 138 135 138 Z" fill="#ec4899"/>
  <circle cx="156" cy="147" r="3.5" fill="#fbcfe8"/> <!-- Hand -->

  <!-- RESCUED STRAY CAT (The object of her mercy) -->
  <g transform="translate(138, 138)">
    <!-- Cat Body (Safe & Warm in her arms) -->
    <ellipse cx="12" cy="12" rx="14" ry="10" fill="url(#cat-grad)"/>
    <!-- Cat Head -->
    <circle cx="2" cy="8" r="8" fill="url(#cat-grad)"/>
    <!-- Cat Ears -->
    <polygon points="-3,1 0,-4 3,0" fill="#c2410c"/>
    <polygon points="3,1 6,-3 9,1" fill="#c2410c"/>
    <!-- Cat Closed Happy Eyes (safe/content) -->
    <path d="M-1 7 C0 8 1 8 2 7" stroke="#7c2d12" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- Cat Tail curling happily -->
    <path d="M22 14 C27 14 28 8 25 6" stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Little paws tucked -->
    <circle cx="8" cy="19" r="2.5" fill="#ea580c"/>
    <circle cx="16" cy="18" r="2.5" fill="#ea580c"/>
  </g>

  <!-- Cozy Floor Lamp on Left -->
  <path d="M45 180 L45 70" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M35 180 L55 180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Lamp Shade -->
  <path d="M30 70 L60 70 L52 45 L38 45 Z" fill="#f59e0b"/>
  <!-- Lamp Light Cone / Glow -->
  <polygon points="38,45 52,45 70,140 20,140" fill="#f59e0b" opacity="0.12"/>

  <!-- Small Rug under chair and person -->
  <ellipse cx="140" cy="192" r="65" rx="65" ry="15" fill="#334155" opacity="0.6"/>

  <!-- Additional Narrative Detail: Warm tea cup on a small side table -->
  <path d="M75 165 L95 165 L93 180 L77 180 Z" fill="#475569"/> <!-- Table -->
  <rect x="70" y="163" width="30" height="3" rx="1.5" fill="#64748b"/>
  <!-- Tea Cup -->
  <rect x="80" y="152" width="10" height="11" rx="2" fill="#e2e8f0"/>
  <path d="M90 154 C93 154 93 159 90 160" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <!-- Steam from tea (Signifying warmth & comfort) -->
  <path d="M83 148 C84 146 82 144 83 142" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M87 149 C88 147 86 145 87 143" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

</svg>