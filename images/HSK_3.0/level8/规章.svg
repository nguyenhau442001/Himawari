<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <defs>
    <!-- Wall & Interior Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="documentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Environment: Office Interior -->
  <rect x="0" y="0" width="240" height="240" fill="url(#wallGrad)"/>

  <!-- Window with City Silhouette in Background -->
  <path d="M 160 30 L 210 30 L 210 110 L 160 110 Z" fill="url(#windowGrad)" stroke="#334155" stroke-width="2"/>
  <path d="M 185 30 L 185 110 M 160 70 L 210 70" stroke="#334155" stroke-width="1.5"/>
  <!-- City Skyline through Window -->
  <path d="M 165 110 L 165 90 L 172 90 L 172 110 L 180 110 L 180 75 L 190 75 L 190 110 L 200 110 L 200 85 L 206 85 L 206 110 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Hanging Wall Clock / Accent -->
  <circle cx="80" cy="50" r="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="42" x2="80" y2="50" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="86" y2="54" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Office Bookshelf / Props in background -->
  <rect x="25" y="45" width="35" height="70" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="70" x2="60" y2="70" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="95" x2="60" y2="95" stroke="#334155" stroke-width="1.5"/>
  <!-- Books -->
  <rect x="30" y="52" width="6" height="18" fill="#3b82f6" rx="1"/>
  <rect x="38" y="50" width="8" height="20" fill="#10b981" rx="1"/>
  <rect x="48" y="55" width="5" height="15" fill="#f59e0b" rx="1"/>

  <!-- Main Desk Surface -->
  <path d="M 20 160 L 220 160 L 230 200 L 10 200 Z" fill="url(#deskGrad)"/>
  <path d="M 10 160 L 230 160" stroke="#475569" stroke-width="2"/>

  <!-- Laptop on Desk -->
  <path d="M 140 140 L 190 140 L 200 162 L 130 162 Z" fill="#64748b"/>
  <path d="M 145 115 L 185 115 L 190 140 L 140 140 Z" fill="#475569"/>
  <!-- Laptop Screen Glow -->
  <path d="M 148 118 L 182 118 L 186 137 L 144 137 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- Character 1: Office Worker / Manager pointing at the document -->
  <!-- Body/Torso -->
  <path d="M 85 145 C 85 125 105 120 115 145 Z" fill="#3b82f6"/>
  <path d="M 95 130 L 105 130 L 108 145 L 92 145 Z" fill="#cbd5e1"/> <!-- Shirt collar/tie hint -->
  <!-- Head -->
  <circle cx="100" cy="100" r="16" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 84 96 C 84 85 116 85 116 96 C 112 90 88 90 84 96 Z" fill="#1e293b"/>
  <!-- Arm pointing to document -->
  <path d="M 105 135 C 115 130 135 125 142 120" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Hand -->
  <circle cx="145" cy="119" r="4" fill="#fcd34d"/>

  <!-- Character 2: Employee listening attentively -->
  <!-- Body/Torso -->
  <path d="M 35 155 C 35 130 55 125 65 155 Z" fill="#10b981"/>
  <path d="M 45 138 L 55 138 L 58 155 L 42 155 Z" fill="#f8fafc"/>
  <!-- Head -->
  <circle cx="50" cy="108" r="15" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 36 104 C 36 94 64 94 64 104 C 60 98 40 98 36 104 Z" fill="#475569"/>
  <!-- Arm resting -->
  <path d="M 45 145 C 50 145 65 150 75 165" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- CENTRAL PROP: The Company Regulation Document (规章制度) -->
  <!-- Floating/Planted prominently on the desk between them -->
  <g transform="translate(85, 125)">
    <!-- Document shadow -->
    <rect x="3" y="3" width="45" height="55" rx="3" fill="#0f172a" opacity="0.5"/>
    <!-- Main Paper -->
    <rect x="0" y="0" width="45" height="55" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header Accent Bar -->
    <rect x="6" y="8" width="20" height="5" rx="1.5" fill="#ef4444"/>
    <!-- Text Lines Representation -->
    <line x1="6" y1="18" x2="39" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="33" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="30" x2="36" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="36" x2="28" y2="36" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Official Red Seal Stamp (Company Rule Emblem) -->
    <circle cx="32" cy="43" r="8" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="32" cy="43" r="5" fill="#ef4444" opacity="0.2"/>
    <path d="M 29 43 L 31 45 L 35 41" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Coffee Mug for workplace realism -->
  <rect x="200" y="145" width="12" height="16" rx="2" fill="#ec4899"/>
  <path d="M 212 148 C 216 148 216 156 212 156" stroke="#ec4899" stroke-width="2" fill="none"/>

  <!-- Atmospheric Lighting & Polish -->
  <circle cx="107" cy="140" r="25" fill="#fbbf24" opacity="0.1" filter="blur(8px)"/>
</svg>