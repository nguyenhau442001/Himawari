  <!-- Land Plot Layer (Representing 土地) -->
  <path d="M65 180 L90 155 L150 155 L175 180 Z" fill="#2E3846" stroke="#46546A" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- House Structure (Representing 房屋) -->
  <!-- Walls -->
  <rect x="85" y="105" width="70" height="50" fill="#2F3947" stroke="#F39C12" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Door -->
  <rect x="110" y="125" width="20" height="30" fill="#1A1D24" stroke="#F39C12" stroke-width="1.5"/>
  
  <!-- Windows -->
  <rect x="95" y="115" width="12" height="12" fill="#3B82F6" opacity="0.8" rx="2"/>
  <rect x="133" y="115" width="12" height="12" fill="#3B82F6" opacity="0.8" rx="2"/>

  <!-- Roof -->
  <path d="M75 105 L120 70 L165 105 Z" fill="#E67E22" stroke="#F39C12" stroke-width="2" stroke-linejoin="round"/>

  <!-- Legal Protection / Security Checkmark Badge (Subtle, sleek accent) -->
