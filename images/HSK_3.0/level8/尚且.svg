<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Grid lines for modern abstract aesthetic -->
  <line x1="30" y1="180" x2="210" y2="180" stroke="#2A2F3A" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="30" y1="120" x2="210" y2="120" stroke="#2A2F3A" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="30" y1="60" x2="210" y2="60" stroke="#2A2F3A" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Escalation / Contrast Metaphor: Stepped Platform representing "Even X, let alone Y" -->
  <!-- Base Level 1 (Adult / High baseline) -->
  <path d="M 45 180 L 105 180 L 105 140 L 45 140 Z" fill="#252A34"/>
  <rect x="55" y="150" width="40" height="8" rx="4" fill="#4E5D6C"/>

  <!-- Level 2 (Child / Extreme escalation limit) -->
  <path d="M 125 180 L 195 180 L 195 100 L 125 100 Z" fill="#252A34"/>
  <rect x="140" y="115" width="40" height="8" rx="4" fill="#4E5D6C"/>

  <!-- Weight / Load Icon 1 (Moderate load on base level) -->
  <circle cx="75" cy="115" r="14" fill="none" stroke="#F6AD55" stroke-width="4"/>
  <path d="M 75 101 L 75 129" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>

  <!-- Weight / Load Icon 2 (Overwhelming/Amplified load on higher level, indicating "even more impossible") -->
  <circle cx="160" cy="70" r="20" fill="none" stroke="#ED8936" stroke-width="5"/>
  <path d="M 160 50 L 160 90 M 140 70 L 180 70" stroke="#ED8936" stroke-width="5" stroke-linecap="round"/>

  <!-- Dynamic Progression / Contrast Arrow (Curved overarching leap symbolizing "shàngqiě" transition) -->
  <path d="M 85 100 C 100 50, 135 50, 150 45" fill="none" stroke="#F6AD55" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
  <!-- Arrowhead pointing to the extreme end -->
  <path d="M 142 38 L 153 44 L 144 52" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent Focus Nodes -->
  <circle cx="75" cy="140" r="4" fill="#F6AD55"/>
  <circle cx="160" cy="100" r="5" fill="#ED8936"/>

  <!-- Framing details for clean flat vector UI look -->
  <circle cx="210" cy="30" r="2" fill="#4E5D6C"/>
  <circle cx="30" cy="210" r="2" fill="#4E5D6C"/>
</svg>