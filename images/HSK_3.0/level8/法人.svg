<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Golden Seal/Stamp Gradient -->
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glowing Independence Indicator Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Office Window Architecture showing independent enterprise building outside -->
  <path d="M 40 25 L 200 25 L 200 135 L 40 135 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Glass & Cityscape Silhouette -->
  <path d="M 44 29 L 196 29 L 196 131 L 44 131 Z" fill="url(#windowGlow)"/>
  <path d="M 60 131 L 60 90 L 80 80 L 80 131 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M 85 131 L 85 60 L 115 50 L 115 131 Z" fill="#0f172a" opacity="0.7"/>
  <path d="M 125 131 L 125 75 L 155 65 L 155 131 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M 160 131 L 160 100 L 180 90 L 180 131 Z" fill="#0f172a" opacity="0.7"/>
  
  <!-- Independent Enterprise Building Holographic/Energy Accent (Symbolizing "法人的独立性") -->
  <circle cx="120" cy="55" r="18" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8" filter="url(#glow)"/>
  <path d="M 112 55 L 118 61 L 130 49" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Interior Wall & Bookshelf/Decor -->
  <rect x="25" y="135" width="190" height="8" fill="#475569" rx="2"/>
  <rect x="180" y="85" width="22" height="50" fill="#334155" rx="2"/>
  <rect x="184" y="90" width="14" height="4" fill="#fb923c"/>
  <rect x="184" y="98" width="14" height="4" fill="#38bdf8"/>

  <!-- DESK & FOREGROUND -->
  <path d="M 10 195 C 10 190, 15 185, 22 185 L 218 185 C 225 185, 230 190, 230 195 L 235 235 C 235 238, 232 240, 228 240 L 12 240 C 8 240, 5 238, 5 235 Z" fill="url(#deskGrad)"/>
  <!-- Desk rim highlight -->
  <path d="M 10 185 L 230 185" stroke="#64748b" stroke-width="2"/>

  <!-- OFFICE CHAIR BACKREST (Behind Character) -->
  <path d="M 95 105 L 145 105 C 153 105, 160 112, 160 120 L 160 175 C 160 180, 155 185, 150 185 L 90 185 C 85 185, 80 180, 80 175 L 80 120 C 80 112, 87 105, 95 105 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- MAIN CHARACTER (Business Professional / Legal Entity Representative) -->
  <!-- Body / Torso (Crisp navy suit jacket) -->
  <path d="M 95 150 L 145 150 L 155 195 L 85 195 Z" fill="#3b82f6"/>
  <!-- Shirt & Tie -->
  <polygon points="120,150 127,175 113,175" fill="#f8fafc"/>
  <polygon points="120,158 123,178 120,188 117,178" fill="#ef4444"/>
  <!-- Suit Lapels -->
  <path d="M 112 150 L 120 170 L 110 195" fill="#1d4ed8"/>
  <path d="M 128 150 L 120 170 L 130 195" fill="#1d4ed8"/>

  <!-- Neck -->
  <rect x="113" y="135" width="14" height="18" fill="#fbcfe8"/>

  <!-- Head & Face -->
  <circle cx="120" cy="115" r="18" fill="#fbcfe8"/>
  <!-- Hair (Neat professional dark hair) -->
  <path d="M 102 115 C 102 100, 110 97, 120 97 C 130 97, 138 100, 138 115 C 138 120, 134 118, 134 112 C 134 104, 128 101, 120 101 C 112 101, 106 104, 106 112 C 106 118, 102 120, 102 115 Z" fill="#0f172a"/>
  <!-- Glasses -->
  <rect x="109" y="110" width="10" height="7" rx="1" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="121" y="110" width="10" height="7" rx="1" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="119" y1="113" x2="121" y2="113" stroke="#64748b" stroke-width="1.5"/>
  <!-- Confident Smile -->
  <path d="M 115 125 Q 120 129 125 125" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms & Hands Interacting with Documents -->
  <!-- Left Arm -->
  <path d="M 98 155 L 75 175 L 85 185" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm (Writing / Stamping Action) -->
  <path d="M 142 155 L 165 170 L 155 185" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="158" cy="183" r="4" fill="#fbcfe8"/>

  <!-- PROPS: INDEPENDENT LEGAL DOCUMENTS & OFFICIAL STAMP -->
  <!-- Official Company Legal Document Folder / Paperwork -->
  <g transform="translate(65, 160) rotate(-8)">
    <!-- Base Paper -->
    <rect x="0" y="0" width="60" height="50" rx="3" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Abstract text lines representing legal articles -->
    <line x1="8" y1="10" x2="42" y2="10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="52" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="24" x2="45" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="30" x2="35" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Red Corporate Legal Seal / Stamp (法人印章 - Corporate Seal) -->
    <circle cx="45" cy="38" r="10" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="45" cy="38" r="7" fill="none" stroke="#ef4444" stroke-width="1"/>
    <path d="M 42 38 L 48 38 M 45 35 L 45 41" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Golden Corporate Seal / Standalone Asset (Highlighting "独立法人" status badge motif) -->
  <g transform="translate(145, 170)">
    <!-- Stamp Handle -->
    <path d="M 10 5 L 15 5 L 17 15 L 8 15 Z" fill="#b45309"/>
    <ellipse cx="12.5" cy="5" rx="2.5" ry="1" fill="#f59e0b"/>
    <!-- Stamp Base Cylinder -->
    <rect x="5" y="15" width="15" height="6" rx="2" fill="url(#sealGrad)" stroke="#b45309" stroke-width="1"/>
    <!-- Golden Glow / Aura around the Seal to indicate autonomy and official legal status -->
    <circle cx="12.5" cy="18" r="14" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- Secondary Stack of Folders (Showing Enterprise Asset Depth) -->
  <g transform="translate(170, 185) rotate(5)">
    <rect x="0" y="0" width="45" height="15" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
    <rect x="3" y="-3" width="45" height="15" rx="2" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>
    <rect x="25" y="3" width="15" height="4" rx="1" fill="#f8fafc" opacity="0.8"/>
  </g>

  <!-- Dynamic Accent Sparks (Representing clear official authorization & independence) -->
  <path d="M 175 145 L 178 152 L 185 155 L 178 158 L 175 165 L 172 158 L 165 155 L 172 152 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 55 145 L 57 150 L 62 152 L 57 154 L 55 159 L 53 154 L 48 152 L 53 150 Z" fill="#38bdf8" opacity="0.7"/>
</svg>