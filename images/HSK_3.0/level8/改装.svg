<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Blueprint grid) -->
  <g opacity="0.15">
    <line x1="30" y1="180" x2="210" y2="180" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="30" y1="60" x2="210" y2="60" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="30" x2="60" y2="210" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="180" y1="30" x2="180" y2="210" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Transformation Action Effect / Sparks & Tools -->
  <g>
    <!-- Wrench/Modification tool indicator -->
    <path d="M155 75 L175 55 M170 50 L180 60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="152" cy="78" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Blueprint / Transformation Sparkle -->
    <path d="M75 80 L80 65 L95 60 L80 55 L75 40 L70 55 L55 60 L70 65 Z" fill="#38BDF8" opacity="0.8"/>
    <path d="M175 140 L178 130 L188 127 L178 124 L175 114 L172 124 L162 127 L172 130 Z" fill="#F59E0B" opacity="0.9"/>
  </g>

  <!-- The "Old Truck / Transformed Mobile Cafe" Object -->
  <g transform="translate(0, 10)">
    <!-- Wheels -->
    <circle cx="75" cy="155" r="16" fill="#334155"/>
    <circle cx="75" cy="155" r="8" fill="#94A3B8"/>
    <circle cx="175" cy="155" r="16" fill="#334155"/>
    <circle cx="175" cy="155" r="8" fill="#94A3B8"/>

    <!-- Truck Base Chassis -->
    <path d="M50 140 L190 140 L190 148 L50 148 Z" fill="#64748B"/>

    <!-- Vehicle Body - Lower Part -->
    <path d="M50 110 L50 140 L190 140 L190 110 Z" fill="#475569"/>

    <!-- Vehicle Body - Transformed Upper Part (Cafe Counter / Awning) -->
    <!-- Awning (Orange/Warm accent for Cafe conversion) -->
    <path d="M55 75 L185 75 L195 95 L45 95 Z" fill="#F59E0B"/>
    <path d="M45 95 L195 95 L195 110 L45 110 Z" fill="#38BDF8"/>
    <path d="M55 75 L75 95 M85 75 L105 95 M115 75 L135 95 M145 75 L165 95 M175 75 L195 95" stroke="#D97706" stroke-width="2"/>

    <!-- Cafe Service Window (The Custom Modification) -->
    <rect x="85" y="105" width="70" height="35" rx="4" fill="#0F172A"/>
    <!-- Coffee Cup Icon on Counter -->
    <path d="M115 125 C115 120 125 120 125 125 Z" fill="#FFFFFF"/>
    <rect x="113" y="125" width="14" height="12" rx="2" fill="#F1F5F9"/>
    <path d="M127 127 C130 127 130 132 127 132" stroke="#F1F5F9" stroke-width="1.5" fill="none"/>

    <!-- Driver Cab (Front) -->
    <path d="M165 95 L185 95 L190 110 L165 110 Z" fill="#334155"/>
    <!-- Windshield -->
    <path d="M170 98 L183 98 L186 108 L170 108 Z" fill="#93C5FD"/>

    <!-- Headlight -->
    <circle cx="192" cy="115" r="3" fill="#FDE047"/>
    <!-- Door seam -->
    <line x1="160" y1="95" x2="160" y2="140" stroke="#1E293B" stroke-width="2"/>

    <!-- Conversion / Construction Dotted Arrow (Indicating 'Gǎizhuāng' process) -->
    <path d="M 60 45 Q 120 20 180 45" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,6"/>
    <polygon points="180,40 190,48 178,52" fill="#38BDF8"/>
  </g>
</svg>