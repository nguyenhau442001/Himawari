<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Table Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Motion/Agility Trail Gradients -->
    <linearGradient id="motion-trail-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="motion-trail-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.6" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Cup Gradient -->
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Interior -->
  <!-- Back Wall and Floor separator -->
  <rect x="0" y="160" width="240" height="80" fill="#090d16" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" />
  
  <!-- Window view showing evening urban lights -->
  <g opacity="0.6">
    <rect x="165" y="30" width="50" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="175" y="40" width="12" height="25" rx="2" fill="#38bdf8" opacity="0.4" />
    <rect x="195" y="40" width="12" height="40" rx="2" fill="#fbbf24" opacity="0.4" />
    <rect x="175" y="75" width="12" height="25" rx="2" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Bookshelf & Books on the left -->
  <rect x="15" y="70" width="35" height="90" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="15" y1="105" x2="50" y2="105" stroke="#334155" stroke-width="1.5" />
  <line x1="15" y1="135" x2="50" y2="135" stroke="#334155" stroke-width="1.5" />
  <!-- Colored books -->
  <rect x="19" y="80" width="7" height="25" rx="1" fill="#10b981" />
  <rect x="28" y="83" width="6" height="22" rx="1" fill="#f59e0b" />
  <rect x="36" y="78" width="10" height="27" rx="1" fill="#ec4899" />
  <rect x="20" y="112" width="8" height="23" rx="1" fill="#38bdf8" />
  <rect x="30" y="115" width="12" height="20" rx="1" fill="#8b5cf6" />

  <!-- Desk & Lamp in background -->
  <circle cx="120" cy="50" r="60" fill="url(#lamp-glow)" />
  <path d="M110 30 L130 30 L135 60 L105 60 Z" fill="#475569" /> <!-- Lamp shade -->
  <path d="M120 60 L120 120" stroke="#475569" stroke-width="3" stroke-linecap="round" /> <!-- Lamp arm -->
  
  <rect x="70" y="120" width="100" height="40" rx="4" fill="#334155" />
  <rect x="65" y="115" width="110" height="6" rx="2" fill="#475569" />
  
  <!-- Laptop on Desk -->
  <path d="M125 125 L155 125 L160 140 L120 140 Z" fill="#64748b" />
  <path d="M115 140 L165 140 L170 143 L110 143 Z" fill="#94a3b8" />
  <rect x="130" y="105" width="26" height="20" rx="2" fill="#0284c7" />

  <!-- MAIN SCENE: Quick Reflex Action (Catching a falling cup) -->
  
  <!-- Motion Blur / Agility Trails for Hand & Arm -->
  <path d="M100 100 C110 95, 125 90, 140 100" fill="none" stroke="url(#motion-trail-2)" stroke-width="12" stroke-linecap="round" />
  <path d="M105 110 C115 105, 130 100, 145 108" fill="none" stroke="url(#motion-trail-1)" stroke-width="8" stroke-linecap="round" />

  <!-- Falling Coffee Cup (The Trigger) -->
  <g transform="translate(145, 95) rotate(-25)">
    <path d="M0 0 L12 0 L10 18 L2 18 Z" fill="url(#cup-grad)" />
    <path d="M11 3 C15 3, 15 12, 11 14" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />
    <!-- Splashing drops -->
    <circle cx="-5" cy="-8" r="2" fill="#38bdf8" />
    <circle cx="-10" cy="-2" r="1.5" fill="#38bdf8" />
    <path d="M-2 -5 Q 2 -15, 6 -5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Character: Alert Office Worker reacting with extreme agility -->
  <g id="character">
    <!-- Body / Torso (Dynamic leaning forward posture) -->
    <path d="M85 160 C80 135, 90 120, 110 115 L120 155 Z" fill="url(#shirt-grad)" />
    
    <!-- Office Chair -->
    <path d="M75 125 L95 125 L100 165 L70 165 Z" fill="#1e293b" />
    <circle cx="85" cy="165" r="18" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Head & Face (Focused expression) -->
    <g transform="translate(95, 88)">
      <!-- Hair -->
      <path d="M-12 -5 C-12 -18, 5 -20, 14 -12 C18 -8, 16 0, 14 5 C8 3, 0 4, -5 2 Z" fill="#0f172a" />
      
      <!-- Face base -->
      <circle cx="0" cy="0" r="13" fill="#fed7aa" />
      
      <!-- Focused Eyes (Wide, alert) -->
      <circle cx="5" cy="-2" r="2.5" fill="#0f172a" />
      <circle cx="6" cy="-3" r="1" fill="#ffffff" /> <!-- highlight -->
      <path d="M 2 -6 Q 6 -8, 9 -5" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" /> <!-- Determined eyebrow -->

      <!-- Mouth (Slight tension/open in surprise-reflex) -->
      <circle cx="6" cy="6" r="2" fill="#c2410c" />
      
      <!-- Ear -->
      <path d="M-11 0 C-14 -1, -14 4, -11 5" fill="#fed7aa" />
    </g>

    <!-- Back Arm (Stabilizing) -->
    <path d="M90 130 L75 145 L70 160" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Arm & Hand (Lightning-fast catch, accurately meeting the cup) -->
    <path d="M110 120 C125 110, 135 105, 143 104" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Hand catching the cup precisely -->
    <circle cx="146" cy="103" r="6" fill="#fed7aa" />
    <path d="M142 107 C148 108, 151 104, 149 98" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Speed lines emphasizing sharp reaction time -->
  <path d="M158 92 L172 88" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M155 108 L170 108" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M152 80 L160 73" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Foreground details: Desk items to anchor depth -->
  <rect x="75" y="138" width="18" height="12" rx="2" fill="#cbd5e1" /> <!-- Notepad -->
  <circle cx="105" cy="135" r="5" fill="#f59e0b" /> <!-- Pen holder base -->
  <line x1="105" y1="135" x2="108" y2="120" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <line x1="105" y1="135" x2="101" y2="122" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />

  <!-- Floor contact shadow -->
  <ellipse cx="85" cy="182" rx="25" ry="6" fill="#020617" opacity="0.5" />
</svg>