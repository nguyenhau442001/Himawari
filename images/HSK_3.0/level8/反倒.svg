<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Anger Glow -->
    <radialGradient id="angerGlow" cx="0.75" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Path for Card Container -->
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" fill="#1e293b"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bg)"/>

    <!-- Environmental Context: Room Interior -->
    <!-- Wallpaper / Wall pattern -->
    <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Floor -->
    <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#090d16"/>
    <path d="M0 180 L240 180" stroke="#1e293b" stroke-width="3"/>

    <!-- Background Window & Cityscape Silhouette -->
    <rect x="30" y="30" width="60" height="90" rx="4" fill="#111827" stroke="#334155" stroke-width="2"/>
    <path d="M40 70 L50 60 L60 80 L70 50 L80 90 L80 120 L40 120 Z" fill="#1f2937"/>
    <circle cx="150" cy="50" r="80" fill="url(#lampGlow)"/>
    <circle cx="180" cy="110" r="80" fill="url(#angerGlow)"/>

    <!-- Desk & Office Props -->
    <rect x="20" y="145" width="200" height="15" rx="3" fill="#334155"/>
    <rect x="40" y="160" width="12" height="60" fill="#1e293b"/>
    <rect x="188" y="160" width="12" height="60" fill="#1e293b"/>

    <!-- Broken Laptop / Papers (The favor gone wrong) -->
    <rect x="90" y="125" width="45" height="25" rx="2" fill="#64748b" transform="rotate(-10 90 125)"/>
    <rect x="85" y="148" width="55" height="4" rx="2" fill="#94a3b8"/>
    <!-- Scattered Papers -->
    <polygon points="65,140 85,135 80,150 60,155" fill="#f8fafc" opacity="0.9"/>
    <polygon points="135,130 155,140 145,155 125,145" fill="#e2e8f0" opacity="0.9"/>

    <!-- CHARACTER 1 (The Helper - Left) -->
    <g transform="translate(15, 60)">
      <!-- Body / Torso -->
      <path d="M40 85 C40 70 55 65 65 65 C75 65 90 70 90 85 L90 100 L40 100 Z" fill="#38bdf8"/>
      <!-- Head -->
      <circle cx="65" cy="45" r="16" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M49 45 C49 32 60 28 65 28 C75 28 81 35 81 48 L75 48 C75 38 65 35 55 38 L49 45 Z" fill="#334155"/>
      <!-- Helpful / Surprised Facial Expression (Trying to offer help, pointing at the laptop) -->
      <circle cx="60" cy="44" r="1.5" fill="#1e293b"/>
      <circle cx="70" cy="44" r="1.5" fill="#1e293b"/>
      <path d="M63 51 Q65 54 67 51" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Raised Arm offering assistance -->
      <path d="M85 75 Q95 70 95 85" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Hand gesturing towards the other -->
      <circle cx="95" cy="87" r="4" fill="#fbcfe8"/>
    </g>

    <!-- CHARACTER 2 (The Angry Recipient - Right) -->
    <g transform="translate(125, 45)">
      <!-- Dramatic Anger Aura lines -->
      <path d="M15 25 L5 15 M75 25 L85 15 M10 60 L0 60" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Body / Torso (Stiff, tense posture) -->
      <path d="M30 100 C30 85 45 80 55 80 C65 80 80 85 80 100 L85 115 L25 115 Z" fill="#f43f5e"/>
      
      <!-- Head (Tilted back in anger) -->
      <circle cx="55" cy="60" r="17" fill="#fbcfe8"/>
      
      <!-- Spiky Angry Hair -->
      <path d="M38 58 C38 45 48 40 55 40 C65 40 72 45 72 58 L68 50 C62 45 52 45 46 52 Z" fill="#1e293b"/>
      <path d="M50 42 L53 32 L58 41" fill="#1e293b"/>
      <path d="M58 41 L64 34 L65 43" fill="#1e293b"/>

      <!-- Angry Facial Expression -->
      <!-- Heavy furrowed brow -->
      <path d="M46 53 L53 56" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M64 53 L57 56" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Eyes -->
      <circle cx="49" cy="59" r="1.5" fill="#1e293b"/>
      <circle cx="61" cy="59" r="1.5" fill="#1e293b"/>
      <!-- Shouting / Angry Mouth -->
      <path d="M52 66 Q55 74 58 66 Z" fill="#7f1d1d"/>

      <!-- Crossed / Tense Arms -->
      <path d="M32 95 Q55 85 78 95" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M35 102 Q55 92 75 102" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Hands clenched -->
      <circle cx="34" cy="98" r="4" fill="#fbcfe8"/>
      <circle cx="76" cy="98" r="4" fill="#fbcfe8"/>
    </g>

    <!-- Contrast / Directional Indicator (Subtle visual storytelling of 'fǎndào' - twist/reverse) -->
    <g transform="translate(112, 100)" opacity="0.8">
      <path d="M 0 10 Q 10 -5 20 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="17,5 23,12 14,14" fill="#38bdf8"/>
    </g>
  </g>
</svg>