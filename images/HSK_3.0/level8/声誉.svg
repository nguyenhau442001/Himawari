<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Background Glow/Circle -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual Illustration for "声誉" (Reputation / Good Name) -->
  <!-- Combining a Shield (Protection/Trust/Establishment) with a Trophy/Star (Excellence/Good Standing) -->
  <g transform="translate(0, 5)">
    <!-- Shield Outer Path -->
    <path d="M120 45 C155 45 180 55 180 55 C180 110 160 160 120 185 C80 160 60 110 60 55 C60 55 85 45 120 45 Z" 
          fill="#1E2330" 
          stroke="#343D52" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Shield Inner Accent -->
    <path d="M120 57 C148 57 168 65 168 65 C168 107 151 147 120 170 C89 147 72 107 72 65 C72 65 92 57 120 57 Z" 
          fill="#161A23" 
          opacity="0.8"/>

    <!-- Glowing Rim/Border on Shield -->
    <path d="M120 48 C152 48 176 57 176 57" 
          fill="none" 
          stroke="#4F5D75" 
          stroke-width="2" 
          stroke-linecap="round" 
          opacity="0.5"/>

    <!-- Central Gold Star (Excellence, High Rating, Good Reputation) -->
    <polygon points="120,78 128,96 148,98 133,112 137,131 120,121 103,131 107,112 92,98 112,96" 
             fill="#F59E0B"/>
    
    <!-- Star Inner Highlight -->
    <polygon points="120,85 125,97 138,98 128,107 131,120 120,113 109,120 112,107 102,98 115,97" 
             fill="#FBBF24"/>

    <!-- Laurel Wreath (Signifying Honor, Achievement, Corporate/Personal Standing) -->
    <!-- Left Branch -->
    <path d="M92 125 C82 125 76 135 78 145 C80 152 88 158 98 155" 
          fill="none" 
          stroke="#10B981" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <path d="M85 130 C80 128 77 132 78 135 C79 138 83 139 86 137" fill="#10B981"/>
    <path d="M90 142 C85 142 83 146 85 149 C87 151 92 151 93 147" fill="#10B981"/>

    <!-- Right Branch -->
    <path d="M148 125 C158 125 164 135 162 145 C160 152 152 158 142 155" 
          fill="none" 
          stroke="#10B981" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <path d="M155 130 C160 128 163 132 162 135 C161 138 157 139 154 137" fill="#10B981"/>
    <path d="M150 142 C155 142 157 146 155 149 C153 151 148 151 147 147" fill="#10B981"/>

    <!-- Ribbon/Base under Wreath -->
    <path d="M106 156 C114 163 126 163 134 156 C128 165 112 165 106 156 Z" fill="#059669"/>
  </g>
</svg>