<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle industrial floor grid / shadow line -->
  <line x1="50" y1="185" x2="190" y2="185" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>

  <!-- Industrial Waste Barrel (Phế thải công nghiệp) -->
  <g transform="translate(70, 65)">
    <!-- Barrel Shadow -->
    <ellipse cx="50" cy="122" rx="42" ry="10" fill="#111318"/>

    <!-- Barrel Body Back/Base -->
    <path d="M 12 25 L 12 110 C 12 121, 88 121, 88 110 L 88 25 Z" fill="#2E3648"/>

    <!-- Barrel Ribs / Bands -->
    <path d="M 10 40 Q 50 48 90 40" stroke="#1A1D24" stroke-width="4" fill="none"/>
    <path d="M 8 75 Q 50 83 92 75" stroke="#1A1D24" stroke-width="4" fill="none"/>

    <!-- Main Barrel Shell -->
    <path d="M 15 20 C 15 10, 85 10, 85 20 L 88 110 C 88 118, 12 118, 12 110 Z" fill="#3B4459"/>

    <!-- Barrel Top Rim -->
    <ellipse cx="50" cy="20" rx="35" ry="9" fill="#4E5A73"/>
    <ellipse cx="50" cy="20" rx="29" ry="6" fill="#252A36"/>

    <!-- Biohazard / Hazardous Waste Warning Symbol -->
    <g transform="translate(50, 65) scale(0.65)">
      <circle cx="0" cy="0" r="28" fill="#F59E0B" opacity="0.15"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <!-- Hazard rings/circles -->
      <circle cx="0" cy="-10" r="9" fill="#1A1D24"/>
      <circle cx="9" cy="6" r="9" fill="#1A1D24"/>
      <circle cx="-9" cy="6" r="9" fill="#1A1D24"/>
      <!-- Inner cutout to form standard hazard trifoil -->
      <circle cx="0" cy="-10" r="6" fill="#F59E0B"/>
      <circle cx="9" cy="6" r="6" fill="#F59E0B"/>
      <circle cx="-9" cy="6" r="6" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="4" fill="#1A1D24"/>
    </g>
  </g>

  <!-- Spilling toxic waste / industrial runoff -->
  <g transform="translate(145, 125)">
    <!-- Puddle on ground -->
    <ellipse cx="15" cy="50" rx="25" ry="8" fill="#10B981" opacity="0.8"/>
    <!-- Drip stream -->
    <path d="M -15 -10 C -15 15, 20 20, 15 45 C 10 52, 20 52, 20 45 C 20 20, -10 15, -10 -10 Z" fill="#10B981"/>
    <!-- Droplet -->
    <circle cx="-15" cy="-18" r="4" fill="#10B981"/>
  </g>

  <!-- Industrial pipe emitting the waste -->
  <g transform="translate(130, 45)">
    <rect x="0" y="0" width="45" height="18" rx="3" fill="#64748B"/>
    <!-- Pipe flange/rim -->
    <rect x="35" y="-3" width="8" height="24" rx="2" fill="#94A3B8"/>
    <!-- Pipe opening -->
    <ellipse cx="43" cy="9" rx="3" ry="9" fill="#334155"/>
  </g>
</svg>