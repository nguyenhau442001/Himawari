  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Legal Document / Contract (Physical Object representing the Law) -->
  <g transform="translate(70, 50)">
    <!-- Document Base -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H88C94.6274 0 100 5.37258 100 12V128C100 134.627 94.6274 140 88 120H12C5.37258 140 0 134.627 0 128V12Z" fill="#E2E8F0"/>
    
