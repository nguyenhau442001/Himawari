    <path d="M0 12C0 5.37258 5.37258 0 12 0H88C94.6274 0 100 5.37258 100 12V32H0V12Z" fill="#CBD5E1"/>

    <!-- Document Lines (Text representations) -->
    <rect x="20" y="48" width="50" height="6" rx="3" fill="#94A3B8"/>
    <rect x="20" y="66" width="60" height="6" rx="3" fill="#94A3B8"/>
    <rect x="20" y="84" width="40" height="6" rx="3" fill="#94A3B8"/>

