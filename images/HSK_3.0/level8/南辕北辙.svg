<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(20, 40)">
    <!-- Goal Signpost pointing Right -->
    <path d="M180 30 L200 50 L180 70" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="140" y="45" width="40" height="10" fill="#f59e0b" rx="2"/>
    <rect x="180" y="48" width="20" height="4" fill="#f59e0b"/>
    
    <!-- Character walking Left -->
    <g transform="translate(80, 100)">
      <circle cx="0" cy="-30" r="15" fill="#fb923c"/>
      <path d="M-10 -20 L-20 -5 L-10 0 M10 -20 L20 -5 L10 0" stroke="#fb923c" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M-5 0 L-15 30 M5 0 L15 30" stroke="#fb923c" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M-20 10 L-40 10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Path markers -->
    <path d="M20 140 L200 140" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Decorative elements -->
    <circle cx="30" cy="30" r="3" fill="#10b981"/>
    <circle cx="190" cy="120" r="4" fill="#ec4899"/>
    <path d="M160 150 L170 160 L160 170" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>
</svg>