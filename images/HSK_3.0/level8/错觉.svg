<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mirror Frame -->
  <rect x="80" y="50" width="80" height="140" rx="4" fill="#2C313C" stroke="#FFB84D" stroke-width="3"/>
  
  <!-- Mirror Surface -->
  <rect x="86" y="56" width="68" height="128" fill="#3D4454"/>
  
  <!-- Reflection Illusion: A small room appearing larger -->
  <!-- Back wall of the reflected room -->
  <rect x="95" y="70" width="50" height="100" fill="#2C313C"/>
  
  <!-- Perspective lines for the "illusion" of depth -->
  <path d="M86 56 L95 70 M154 56 L145 70 M86 184 L95 170 M154 184 L145 170" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- A simple object (a chair) inside the mirror to show scale -->
  <rect x="110" y="140" width="20" height="30" fill="#FFB84D" rx="2"/>
  <rect x="110" y="130" width="20" height="5" fill="#FFB84D" rx="1"/>
  
  <!-- The real object in front of the mirror (a larger version of the same chair) -->
  <rect x="40" y="120" width="30" height="45" fill="#FFB84D" rx="3"/>
  <rect x="40" y="105" width="30" height="8" fill="#FFB84D" rx="2"/>
  
  <!-- Visual cue for "illusion" - a slight distortion effect -->
  <ellipse cx="120" cy="120" rx="50" ry="80" fill="none" stroke="#FFB84D" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
</svg>