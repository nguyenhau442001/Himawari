<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmospheric background glow -->
  <circle cx="120" cy="110" r="70" fill="#1E293B" opacity="0.6"/>

  <!-- Rain elements (contextual reference: rainy season) -->
  <g opacity="0.4" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="40" x2="52" y2="60"/>
    <line x1="90" y1="30" x2="82" y2="50"/>
    <line x1="150" y1="35" x2="142" y2="55"/>
    <line x1="180" y1="45" x2="172" y2="65"/>
  </g>

  <!-- Dam / Reservoir Structure (Physical object representing 防汛) -->
  <g>
    <!-- Reservoir water body (behind/rising) -->
    <path d="M 60 115 Q 120 120 180 115 L 180 150 L 60 150 Z" fill="#3B82F6" opacity="0.4"/>
    <path d="M 60 110 Q 120 115 180 110" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Concrete Dam Wall -->
    <path d="M 75 80 L 165 80 L 185 180 L 55 180 Z" fill="#475569"/>
    <!-- Dam wall top road/path -->
    <rect x="70" y="72" width="100" height="8" rx="2" fill="#64748B"/>

    <!-- Floodgates / Sluice Structure -->
    <rect x="95" y="95" width="50" height="65" rx="4" fill="#334155"/>
    <!-- Metal reinforcement beams on gates -->
    <line x1="120" y1="95" x2="120" y2="160" stroke="#1E293B" stroke-width="4"/>
    <line x1="95" y1="127" x2="145" y2="127" stroke="#1E293B" stroke-width="4"/>
    <!-- Control wheel on top of gate -->
    <circle cx="120" cy="87" r="5" fill="#F59E0B"/>
    <line x1="115" y1="87" x2="125" y2="87" stroke="#1E293B" stroke-width="2"/>

    <!-- Controlled Water Flow (Discharge) -->
    <path d="M 105 155 C 105 175, 135 175, 135 195 L 125 195 C 125 180, 115 180, 115 155 Z" fill="#38BDF8" opacity="0.8"/>
    <!-- Water spray at base -->
    <ellipse cx="120" cy="198" rx="15" ry="4" fill="#93C5FD" opacity="0.6"/>
  </g>

  <!-- Sandbags (Iconic physical flood defense objects deployed neatly at the base) -->
  <g>
    <!-- Left stack of sandbags -->
    <ellipse cx="65" cy="180" rx="14" ry="7" fill="#D97706"/>
    <ellipse cx="60" cy="174" rx="12" ry="6" fill="#F59E0B"/>
    <ellipse cx="68" cy="168" rx="10" ry="5" fill="#D97706"/>

    <!-- Right stack of sandbags -->
    <ellipse cx="175" cy="180" rx="14" ry="7" fill="#D97706"/>
    <ellipse cx="180" cy="174" rx="12" ry="6" fill="#F59E0B"/>
    <ellipse cx="172" cy="168" rx="10" ry="5" fill="#D97706"/>
  </g>

  <!-- High-contrast professional focus accent (Amber/Gold protective glow/ring) -->
  <circle cx="120" cy="130" r="85" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
</svg>