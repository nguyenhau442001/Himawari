<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Imperial Chinese Palace Gate / Hall Structure (Symbolizing Feudal Monarchy/System) -->
    <!-- Base Platform -->
    <path d="M-80 50 L80 50 L95 70 L-95 70 Z" fill="#2C3240" stroke="#3E4758" stroke-width="2"/>
    <line x1="-80" y1="60" x2="80" y2="60" stroke="#3E4758" stroke-width="1.5"/>

    <!-- Pillars -->
    <rect x="-65" y="-10" width="12" height="60" fill="#E05638"/>
    <rect x="-35" y="-10" width="12" height="60" fill="#E05638"/>
    <rect x="23" y="-10" width="12" height="60" fill="#E05638"/>
    <rect x="53" y="-10" width="12" height="60" fill="#E05638"/>

    <!-- Wall behind pillars -->
    <rect x="-55" y="-5" width="110" height="55" fill="#8B261F"/>
    
    <!-- Central Palace Doors / Accents -->
    <rect x="-18" y="10" width="36" height="40" rx="2" fill="#4A120F" stroke="#E2B75B" stroke-width="2"/>

    <!-- Traditional Eaves / Roof (Tier 1) -->
    <path d="M-90 -10 Q0 -22 90 -10 L75 -30 Q0 -38 -75 -30 Z" fill="#E05638" stroke="#E2B75B" stroke-width="2"/>
    <path d="M-85 -10 L-95 -18 M85 -10 L95 -18" stroke="#E2B75B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Main Upper Roof (Traditional Curved Chinese Roof) -->
    <path d="M-75 -30 Q0 -42 75 -30 L60 -65 Q0 -75 -60 -65 Z" fill="#C23B22" stroke="#E2B75B" stroke-width="2.5"/>
    <path d="M-70 -30 L-85 -42 M70 -30 L85 -42" stroke="#E2B75B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Ridge Decors / Finials -->
    <path d="M-60 -65 Q0 -72 60 -65 L50 -72 Q0 -78 -50 -72 Z" fill="#E2B75B"/>

    <!-- Imperial Throne Silhouette / Hierarchy accent inside -->
    <path d="M-10 15 L10 15 L12 28 L-12 28 Z" fill="#E2B75B"/>
    
    <!-- Symbolic Chain / Seal overlay indicating historical structural constraint ("封" - enfeoffment/bound system) -->
    <circle cx="0" cy="5" r="28" fill="none" stroke="#E2B75B" stroke-dasharray="6,4" stroke-width="3"/>
  </g>
</svg>