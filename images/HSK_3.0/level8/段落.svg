<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Main Concept: Paragraphs / Document Structure (段落) -->
  <g transform="translate(36, 44)">
    <!-- Document Background Panel -->
    <rect x="0" y="0" width="168" height="152" rx="12" fill="#222730" stroke="#2F3642" stroke-width="2"/>
    
    <!-- Top Document Header Lines -->
    <line x1="20" y1="20" x2="68" y2="20" stroke="#4B5563" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="92" y2="32" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

    <!-- Paragraph 1 (Inactive/Secondary) -->
    <g transform="translate(20, 52)">
      <line x1="0" y1="0" x2="112" y2="0" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="128" y2="10" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Paragraph 2 (Highlighted/Focus: 段落) -->
    <g transform="translate(20, 80)">
      <!-- Highlight Background for Active Paragraph -->
      <rect x="-8" y="-6" width="144" height="42" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5"/>
      <!-- Active Paragraph Content -->
      <line x1="0" y1="4" x2="120" y2="4" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="0" y1="15" x2="128" y2="15" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="80" y2="26" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Section Indicator Node / Bullet -->
      <circle cx="-16" cy="15" r="3.5" fill="#F59E0B"/>
    </g>

    <!-- Paragraph 3 (Inactive/Secondary) -->
    <g transform="translate(20, 134)">
      <line x1="0" y1="0" x2="96" y2="0" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>