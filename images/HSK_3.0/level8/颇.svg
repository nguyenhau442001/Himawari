<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="desk-light" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Hologram/Complexity Glow Gradient -->
    <linearGradient id="holo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- UI/Panel Glow -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="110" r="100" fill="url(#desk-light)"/>

  <!-- Background Environment: Office / Detective Desk & Pinned Clues -->
  <!-- Corkboard Wall behind -->
  <rect x="30" y="25" width="180" height="95" rx="6" fill="#334155" opacity="0.4"/>
  
  <!-- Pinned "Complex" Notes & Connections on Wall -->
  <line x1="60" y1="45" x2="100" y2="70" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="100" y1="70" x2="150" y2="40" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="150" y1="40" x2="180" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="100" y1="70" x2="130" y2="95" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  
  <rect x="50" y="38" width="22" height="18" rx="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="61" cy="38" r="2" fill="#ef4444"/>
  <rect x="90" y="60" width="24" height="22" rx="2" fill="#f43f5e" opacity="0.8"/>
  <circle cx="102" cy="60" r="2" fill="#f59e0b"/>
  <rect x="140" y="32" width="26" height="20" rx="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="153" cy="32" r="2" fill="#ffffff"/>
  <rect x="168" y="72" width="20" height="22" rx="2" fill="#a855f7" opacity="0.8"/>
  <circle cx="178" cy="72" r="2" fill="#38bdf8"/>
  <rect x="120" y="85" width="22" height="20" rx="2" fill="#10b981" opacity="0.8"/>
  <circle cx="131" cy="85" r="2" fill="#fef08a"/>

  <!-- Bookshelf / Plant detail in background -->
  <rect x="195" y="95" width="25" height="40" rx="2" fill="#1e293b" opacity="0.7"/>
  <path d="M200 130 C200 120 207 115 207 115 C207 115 214 120 214 130 Z" fill="#10b981" opacity="0.8"/>

  <!-- Desk Surface -->
  <path d="M15 190 L225 190 L210 210 L30 210 Z" fill="#0f172a"/>
  <rect x="15" y="185" width="210" height="8" rx="3" fill="#334155"/>

  <!-- Complex 3D Holographic Puzzle / Intersecting Gears floating above desk (Representing "Complex Matter/Situation") -->
  <g filter="url(#shadow)" transform="translate(0, -5)">
    <!-- Central Hologram Projector base -->
    <ellipse cx="120" cy="180" rx="35" ry="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="120" cy="180" rx="20" ry="4" fill="#38bdf8" opacity="0.5"/>

    <!-- Floating Complex Construct -->
    <!-- Outer rotating ring -->
    <circle cx="120" cy="135" r="32" fill="none" stroke="url(#holo-glow)" stroke-width="2.5" stroke-dasharray="8, 6" opacity="0.8"/>
    <circle cx="120" cy="135" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4, 4" opacity="0.6"/>
    
    <!-- Interlocking intricate geometric nodes (Interconnected problem) -->
    <polygon points="120,110 135,125 125,145 105,145 95,125" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
    <circle cx="120" cy="135" r="6" fill="#ec4899" opacity="0.9"/>
    
    <!-- Floating nodes & data particles -->
    <circle cx="85" cy="115" r="3" fill="#38bdf8"/>
    <circle cx="155" cy="120" r="4" fill="#fbbf24"/>
    <circle cx="140" cy="155" r="3.5" fill="#10b981"/>
    <circle cx="100" cy="150" r="2.5" fill="#ec4899"/>
    
    <!-- Connecting energy beams -->
    <line x1="120" y1="135" x2="85" y2="115" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="135" x2="155" y2="120" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="135" x2="140" y2="155" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Foreground Character: Concerned/Thoughtful Professional analyzing the complex situation -->
  <g filter="url(#shadow)">
    <!-- Character Chair -->
    <path d="M75 160 L95 160 L100 205 L70 205 Z" fill="#334155" opacity="0.9"/>

    <!-- Character Body / Torso (leaning forward) -->
    <path d="M75 155 C70 135 90 125 110 135 L125 175 L85 185 Z" fill="#2563eb"/> <!-- Blue Shirt -->
    <!-- Collar & Tie -->
    <path d="M98 133 L105 145 L112 133 Z" fill="#ffffff"/>
    <path d="M104 144 L106 165 L108 144 Z" fill="#ef4444"/>

    <!-- Character Back arm resting on desk -->
    <path d="M85 145 C70 150 65 170 65 185 L85 188 C85 188 88 170 95 160 Z" fill="#1d4ed8"/>
    <!-- Hand -->
    <circle cx="63" cy="188" r="7" fill="#fcd34d"/>

    <!-- Character Neck -->
    <rect x="98" y="122" width="14" height="15" fill="#fcd34d"/>

    <!-- Character Head (Thoughtful/Puzzled expression) -->
    <g transform="translate(105, 105)">
      <!-- Hair -->
      <path d="M -18 -5 C -18 -20 5 -22 15 -10 C 22 -3 20 12 20 12 C 20 12 10 15 -5 12 C -18 9 -18 -5 -18 -5 Z" fill="#1e293b"/>
      
      <!-- Head Base -->
      <path d="M -15 -2 C -15 15 15 15 15 -2 C 15 -15 -15 -15 -15 -2 Z" fill="#fcd34d"/>

      <!-- Ear -->
      <path d="M 14 2 C 18 2 18 8 14 10 Z" fill="#f59e0b"/>

      <!-- Thoughtful / Perplexed Eyebrows (Slanted up in middle) -->
      <path d="M -10 -5 L -2 -8" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 2 -8 L 10 -5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Eyes (Focused on the hologram) -->
      <circle cx="-6" cy="-2" r="2.5" fill="#1e293b"/>
      <circle cx="6" cy="-2" r="2.5" fill="#1e293b"/>
      
      <!-- Thoughtful / Slightly open mouth (Hmm expression) -->
      <path d="M -2 7 C 0 9 3 9 4 7" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Hand on chin (Classic thinking pose) -->
      <g transform="translate(0, 10)">
        <path d="M -8 2 C -12 2 -15 6 -12 10 C -10 12 -4 14 2 10 C 6 8 8 3 5 0 Z" fill="#fcd34d"/>
        <!-- Fingers curled near chin -->
        <circle cx="-6" cy="6" r="2" fill="#f59e0b"/>
        <circle cx="-2" cy="8" r="2" fill="#f59e0b"/>
      </g>
    </g>

    <!-- Character Front Arm (Supporting the thinking pose) -->
    <path d="M95 160 C90 170 93 185 105 188 L115 175 Z" fill="#2563eb"/>
  </g>

  <!-- Desk Props: Coffee Mug with Steam, Notepad, Pen -->
  <!-- Coffee Mug -->
  <rect x="175" y="170" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M191 174 C196 174 196 182 191 184" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M179 165 C180 160 178 155 182 150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M185 166 C186 161 184 156 188 151" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Notepad & Pen on Desk -->
  <g transform="translate(35, 175)">
    <rect x="0" y="0" width="30" height="22" rx="2" fill="#f8fafc" transform="rotate(-10 0 0)"/>
    <line x1="5" y1="5" x2="22" y2="2" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="20" y2="7" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="5" y1="15" x2="18" y2="12" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Pen -->
    <rect x="-8" y="10" width="18" height="3" rx="1" fill="#ef4444" transform="rotate(25 0 0)"/>
  </g>

  <!-- Ambient glowing particles floating around the scene to add rich visual depth -->
  <circle cx="45" cy="100" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="70" cy="80" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="185" cy="110" r="1.5" fill="#ec4899" opacity="0.8"/>
  <circle cx="165" cy="145" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="135" r="1" fill="#10b981" opacity="0.9"/>
  <circle cx="130" cy="85" r="1.5" fill="#f59e0b" opacity="0.7"/>
</svg>