<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="150" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="165" width="10" height="75" fill="#1e293b" opacity="0.5"/>
  <rect x="200" y="165" width="10" height="75" fill="#1e293b" opacity="0.5"/>
  
  <!-- Cluttered Desk Items -->
  <circle cx="180" cy="135" r="12" fill="#fb923c"/>
  <rect x="40" y="130" width="30" height="20" rx="2" fill="#475569"/>
  <path d="M50 130 L50 110 L70 110 L70 130" fill="none" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Character: Exhausted Man -->
  <!-- Head -->
  <ellipse cx="120" cy="110" rx="25" ry="30" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M95 100 Q120 70 145 100" fill="#78350f"/>
  <!-- Closed Eyes (Exhaustion) -->
  <path d="M105 105 L115 105 M125 105 L135 105" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
  <!-- Slumped Shoulders -->
  <path d="M95 130 Q120 125 145 130" stroke="#fde68a" stroke-width="15" stroke-linecap="round"/>
  <!-- Arms slumped on desk -->
  <path d="M95 135 L60 150" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  <path d="M145 135 L180 150" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Environment: Window with city lights -->
  <rect x="160" y="30" width="50" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="175" cy="45" r="3" fill="#fbbf24"/>
  <circle cx="195" cy="70" r="2" fill="#fbbf24"/>
  
  <!-- Exhaustion Effect -->
  <path d="M130 90 Q140 80 150 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M135 85 Q145 75 155 85" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  
  <!-- Coffee Mug -->
  <rect x="170" y="130" width="20" height="20" rx="2" fill="#ec4899"/>
  <path d="M190 135 Q200 135 200 145" fill="none" stroke="#ec4899" stroke-width="3"/>
