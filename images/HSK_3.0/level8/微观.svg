<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Microscope Base -->
  <rect x="70" y="190" width="100" height="12" rx="4" fill="#4A5568"/>
  <rect x="85" y="182" width="70" height="8" rx="2" fill="#2D3748"/>
  
  <!-- Microscope Arm -->
  <path d="M 145 182 C 185 182 185 80 130 80" fill="none" stroke="#718096" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Microscope Head & Eyepiece -->
  <rect x="95" y="72" width="45" height="16" rx="4" fill="#A0AEC0"/>
  <path d="M 100 72 L 80 48" stroke="#718096" stroke-width="10" stroke-linecap="round"/>
  <rect x="74" y="40" width="14" height="10" rx="2" transform="rotate(-50 74 40)" fill="#4A5568"/>
  
  <!-- Objective Lens -->
  <rect x="108" y="88" width="14" height="24" rx="2" fill="#CBD5E0"/>
  <rect x="110" y="112" width="10" height="6" rx="1" fill="#4A5568"/>
  
  <!-- Stage -->
  <rect x="80" y="145" width="65" height="6" rx="2" fill="#4A5568"/>
  
  <!-- Specimen Slide -->
  <rect x="95" y="142" width="35" height="3" rx="1" fill="#A0AEC0" opacity="0.5"/>
  
  <!-- The "Micro" Focus (Glowing Specimen) -->
  <circle cx="113" cy="143" r="5" fill="#F6AD55">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="113" cy="143" r="10" fill="#F6AD55" opacity="0.2"/>
  
  <!-- Stylized Microscopic Detail (Magnified View Circle) -->
  <circle cx="60" cy="115" r="32" fill="#2D3748" stroke="#F6AD55" stroke-width="2"/>
  <!-- Stylized Cell/Atom inside the magnified view -->
  <circle cx="60" cy="115" r="8" fill="#F6AD55" fill-opacity="0.8"/>
  <circle cx="48" cy="105" r="4" fill="#F6AD55" fill-opacity="0.4"/>
  <circle cx="75" cy="125" r="5" fill="#F6AD55" fill-opacity="0.4"/>
  <circle cx="72" cy="100" r="3" fill="#F6AD55" fill-opacity="0.4"/>
  
  <!-- Connecting Line from Lens to Magnified View -->
  <path d="M 108 115 L 88 115" stroke="#F6AD55" stroke-width="1" stroke-dasharray="4 2" opacity="0.5"/>
</svg>