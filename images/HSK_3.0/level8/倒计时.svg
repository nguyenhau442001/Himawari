<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (night sky stars) -->
  <circle cx="50" cy="50" r="1.5" fill="#4A5568"/>
  <circle cx="190" cy="45" r="1" fill="#4A5568"/>
  <circle cx="205" cy="140" r="1.5" fill="#4A5568"/>
  <circle cx="35" cy="170" r="1" fill="#4A5568"/>
  <circle cx="120" cy="35" r="1" fill="#4A5568"/>

  <!-- Stylized Fireworks in upper background (referencing context) -->
  <g opacity="0.35">
    <!-- Left Firework -->
    <path d="M 60 70 L 60 40 M 60 70 L 40 50 M 60 70 L 80 50 M 60 70 L 35 70 M 60 70 L 85 70" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="60" cy="70" r="2" fill="#F59E0B"/>
    
    <!-- Right Firework -->
    <path d="M 180 80 L 180 55 M 180 80 L 160 65 M 180 80 L 200 65 M 180 80 L 158 85 M 180 80 L 202 85" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="180" cy="80" r="2" fill="#EC4899"/>
  </g>

  <!-- Central Countdown Clock / Physical Device Object -->
  <!-- Outer Glow / Ring -->
  <circle cx="120" cy="125" r="62" fill="none" stroke="#2D3748" stroke-width="6"/>

  <!-- Countdown Progress Arc (nearly at zero) -->
  <circle cx="120" cy="125" r="62" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="390" stroke-dashoffset="370" stroke-linecap="round" transform="rotate(-90 120 125)"/>

  <!-- Clock Body Base -->
  <circle cx="120" cy="125" r="54" fill="#21262D"/>
  <circle cx="120" cy="125" r="50" fill="#161B22"/>

  <!-- Clock Stand / Feet -->
  <path d="M 98 175 L 85 190 M 142 175 L 155 190" stroke="#484F58" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Clock Bells / Top Accents -->
  <path d="M 95 79 L 80 64 M 145 79 L 160 64" stroke="#484F58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="69" r="6" fill="#F59E0B"/>

  <!-- Clock Tick Marks -->
  <line x1="120" y1="78" x2="120" y2="82" stroke="#484F58" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="168" x2="120" y2="172" stroke="#484F58" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="125" x2="77" y2="125" stroke="#484F58" stroke-width="2" stroke-linecap="round"/>
  <line x1="163" y1="125" x2="167" y2="125" stroke="#484F58" stroke-width="2" stroke-linecap="round"/>

  <!-- Digital / Analog Hybrid Center Display (Showing '00' or final zero countdown) -->
  <!-- Minimalist glowing digital readout window -->
  <rect x="92" y="107" width="56" height="36" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  
  <!-- Large Zeroes signifying '0' / Zero countdown completion -->
  <!-- Left Zero -->
  <rect x="100" y="115" width="14" height="20" rx="3" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <!-- Right Zero -->
  <rect x="126" y="115" width="14" height="20" rx="3" fill="none" stroke="#F59E0B" stroke-width="3"/>

  <!-- Clock Hands (frozen at zero position pointing straight up) -->
  <line x1="120" y1="125" x2="120" y2="98" stroke="#F85149" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="125" x2="138" y2="125" stroke="#C9D1D9" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="125" r="3.5" fill="#F59E0B"/>
</svg>