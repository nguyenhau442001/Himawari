<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (subtle concentric waves or spotlight) -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>
  <circle cx="120" cy="120" r="50" fill="#2A303C" opacity="0.4"/>

  <!-- Surrender Flag (Physical Object) -->
  <g transform="translate(0, 5)">
    <!-- Flagpole -->
    <rect x="75" y="45" width="8" height="150" rx="4" fill="#8C95A5"/>
    <circle cx="79" cy="45" r="7" fill="#F39C12"/>
    <circle cx="79" cy="195" r="6" fill="#525B6C"/>

    <!-- White Flag (Cloth dropping/surrendering) -->
    <path d="M 83 55 
             C 110 50, 140 65, 165 55
             C 155 80, 160 105, 165 125
             C 135 135, 110 115, 83 125 
             Z" 
          fill="#E6EDF5"/>
          
    <!-- Flag folds/shadows for depth -->
    <path d="M 83 75 C 110 70, 130 85, 155 78" stroke="#CFD8DC" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 83 100 C 105 95, 130 110, 162 102" stroke="#CFD8DC" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ground / Base platform -->
  <rect x="60" y="195" width="120" height="8" rx="4" fill="#3A4252"/>
</svg>