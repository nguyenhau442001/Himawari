<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to enhance the revival/rebirth theme -->
  <circle cx="120" cy="130" r="70" fill="#FFB703" opacity="0.08" filter="blur(15px)"/>

  <!-- Conceptual illustration for "复苏" (revival/recovery of life/nature): 
       A stylized, sturdy ceramic pot with a fresh, vibrant green plant sprouting, 
       surrounded by warm glowing golden rays symbolizing rejuvenation and active growth. -->

  <!-- Sunburst / Revival Rays -->
  <g stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="45" x2="120" y2="30" />
    <line x1="85" y1="55" x2="74" y2="44" />
    <line x1="155" y1="55" x2="166" y2="44" />
    <line x1="65" y1="85" x2="50" y2="80" />
    <line x1="175" y1="85" x2="190" y2="80" />
  </g>

  <!-- Flower Pot Shadow / Ground Base -->
  <ellipse cx="120" cy="188" rx="42" ry="7" fill="#111318" />

  <!-- The Flower Pot (Modern Sleek Flat Design) -->
  <g>
    <!-- Pot Rim -->
    <path d="M 82 142 L 158 142 L 152 154 L 88 154 Z" fill="#E0E6ED" />
    <!-- Pot Body -->
    <path d="M 90 158 L 150 158 L 140 184 C 138 187 134 189 130 189 L 110 189 C 106 189 102 187 100 184 Z" fill="#3B82F6" />
    <!-- Pot Highlight / Detail -->
    <path d="M 95 162 L 145 162 L 142 170 L 98 170 Z" fill="#60A5FA" opacity="0.4" />
  </g>

  <!-- Soil inside Pot -->
  <ellipse cx="120" cy="156" rx="30" ry="5" fill="#4B5563" />

  <!-- Vibrant Sprout / Plant (Symbolizing "复苏" / Revival and Growth) -->
  <g>
    <!-- Main Stem -->
    <path d="M 120 154 C 118 130 120 110 118 92" stroke="#10B981" stroke-width="4" stroke-linecap="round" fill="none" />
    
    <!-- Left Leaf -->
    <path d="M 119 122 C 105 120 92 108 94 96 C 96 84 110 88 119 108 Z" fill="#34D399" />
    <path d="M 119 122 C 110 112 103 104 100 98" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Right Leaf (Larger, thriving) -->
    <path d="M 118 105 C 135 102 148 88 144 74 C 140 60 124 66 118 88 Z" fill="#10B981" />
    <path d="M 118 105 C 130 94 138 84 141 78" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Top New Bud -->
    <path d="M 118 92 C 116 84 120 74 125 70 C 130 74 126 86 118 92 Z" fill="#6EE7B7" />
  </g>

  <!-- Floating Sparkles / Energy Dots (Visualizing vitality and positive momentum) -->
  <g fill="#FFB703">
    <circle cx="85" cy="115" r="2.5" opacity="0.9" />
    <circle cx="155" cy="110" r="3" opacity="0.8" />
    <circle cx="140" cy="55" r="2" opacity="0.7" />
    <circle cx="100" cy="65" r="2.5" opacity="0.9" />
  </g>
</svg>