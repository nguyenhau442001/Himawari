<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Window Cityscape Glow -->
    <linearGradient id="cityGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Spotlight -->
  <circle cx="120" cy="0" r="150" fill="url(#spotlight)" />

  <!-- ENVIRONMENT: Luxury Office / Mansion Interior -->
  <!-- Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />
  
  <!-- Massive Floor-to-Ceiling Windows (Showing Local Cityscape View) -->
  <rect x="25" y="35" width="105" height="155" rx="4" fill="url(#cityGlow)" stroke="#334155" stroke-width="2" />
  
  <!-- City Skyline Silhouette Outside Window -->
  <path d="M 35 190 L 35 140 L 45 140 L 45 190 
           L 55 190 L 55 110 L 70 110 L 70 190 
           L 80 190 L 80 125 L 95 125 L 95 190 
           L 105 190 L 105 95 L 120 95 L 120 190 Z" fill="#1e1b4b" opacity="0.8" />
  <!-- City Window Lights -->
  <rect x="58" y="120" width="3" height="4" fill="#fbbf24" opacity="0.6" />
  <rect x="64" y="130" width="3" height="4" fill="#fbbf24" opacity="0.8" />
  <rect x="85" y="140" width="3" height="4" fill="#38bdf8" opacity="0.7" />
  <rect x="108" y="105" width="4" height="6" fill="#fbbf24" opacity="0.9" />
  <rect x="110" y="120" width="4" height="6" fill="#fbbf24" opacity="0.5" />

  <!-- Window Frame Divider -->
  <line x1="77" y1="35" x2="77" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Luxury Bookshelf / Decor Panel on Right -->
  <rect x="150" y="40" width="65" height="150" fill="#1e293b" opacity="0.5" />
  <line x1="150" y1="90" x2="215" y2="90" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="140" x2="215" y2="140" stroke="#334155" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="160" y="65" width="8" height="25" rx="1" fill="#f59e0b" />
  <rect x="170" y="60" width="12" height="30" rx="1" fill="#38bdf8" />
  <rect x="184" y="70" width="6" height="20" rx="1" fill="#ec4899" />
  <rect x="160" y="110" width="10" height="30" rx="1" fill="#10b981" />
  <rect x="172" y="115" width="14" height="25" rx="1" fill="#fb923c" />

  <!-- Classic Globe / Wealth Prop -->
  <circle cx="195" cy="120" r="12" fill="url(#goldLight)" />
  <path d="M 188 116 Q 195 110 202 120" stroke="#0f172a" stroke-width="1.5" fill="none" />
  <path d="M 191 124 Q 197 128 200 120" stroke="#0f172a" stroke-width="1.5" fill="none" />
  <path d="M 195 108 L 195 132" stroke="#64748b" stroke-width="2" />
  <path d="M 190 132 L 200 132" stroke="#64748b" stroke-width="2" />

  <!-- THE ELITE MILLIONAIRE CHARACTER (富翁) -->
  <!-- Character Body / Suit -->
  <!-- Legs -->
  <path d="M 115 150 L 115 190 L 130 190 L 130 150 Z" fill="#0f172a" />
  <path d="M 135 150 L 135 190 L 150 190 L 150 150 Z" fill="#0f172a" />
  <!-- Shoes (Shiny Leather) -->
  <ellipse cx="122" cy="191" rx="9" ry="3" fill="#000" />
  <ellipse cx="143" cy="191" rx="9" ry="3" fill="#000" />
  <path d="M 113 190 L 128 190 L 126 187 L 115 187 Z" fill="#334155" />
  <path d="M 133 190 L 148 190 L 146 187 L 135 187 Z" fill="#334155" />

  <!-- Torso & Suit Jacket -->
  <path d="M 112 105 L 152 105 L 158 150 L 106 150 Z" fill="url(#suitGrad)" />
  
  <!-- Crisp White Shirt & Golden Silk Tie -->
  <polygon points="132,105 125,125 139,125" fill="#f8fafc" />
  <polygon points="130,122 134,122 136,145 132,150 128,145" fill="url(#goldGrad)" />

  <!-- Lapels -->
  <path d="M 132 105 L 122 135 L 128 135 Z" fill="#1e293b" />
  <path d="M 132 105 L 142 135 L 136 135 Z" fill="#1e293b" />

  <!-- Arms / Pose (Confident, Hands in Pockets or holding luxury accessory) -->
  <!-- Left Arm (Relaxed at side) -->
  <path d="M 108 110 L 98 145 L 106 148 L 112 120 Z" fill="url(#suitGrad)" />
  <circle cx="102" cy="150" r="4" fill="#fbcfe8" /> <!-- Hand -->

  <!-- Right Arm (Slightly bent, holding high-end tablet / financial portfolio with gold accents) -->
  <path d="M 156 110 L 170 135 L 164 140 L 150 120 Z" fill="url(#suitGrad)" />
  <circle cx="170" cy="138" r="4" fill="#fbcfe8" /> <!-- Hand holding device -->

  <!-- Luxury Gold Tablet / Portfolio -->
  <rect x="155" y="125" width="22" height="28" rx="2" transform="rotate(15 155 125)" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Screen Chart (Showing massive wealth growth) -->
  <path d="M 160 145 L 165 140 L 170 142 L 175 133" stroke="#10b981" stroke-width="2" fill="none" transform="rotate(15 155 125)" />

  <!-- Neck & Head -->
  <rect x="127" y="98" width="10" height="12" fill="#fbcfe8" />
  
  <!-- Confident Smiling Face -->
  <circle cx="132" cy="88" r="14" fill="#fbcfe8" />
  
  <!-- Stylish Hair (Silver/Black distinguished look of a successful tycoon) -->
  <path d="M 118 85 Q 118 72 132 72 Q 146 72 146 85 Q 144 80 132 78 Q 120 80 118 85 Z" fill="#334155" />
  <path d="M 118 85 Q 116 92 120 95" fill="#334155" stroke="#334155" stroke-width="3" />

  <!-- Distinguished Mustache / Smile -->
  <path d="M 127 92 Q 132 96 137 92" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Friendly Confident Eyes -->
  <path d="M 125 85 Q 128 82 131 85" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 133 85 Q 136 82 139 85" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Subtle Glasses / Monocle hint or classy frames -->
  <rect x="123" y="82" width="9" height="7" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  <rect x="132" y="82" width="9" height="7" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  <line x1="131" y1="85" x2="132" y2="85" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- FOREGROUND PROPS & WEALTH SYMBOLS -->
  <!-- Luxury Desk Edge on the left -->
  <path d="M 0 170 L 60 170 L 75 190 L 0 190 Z" fill="#1e293b" />
  <path d="M 0 170 L 60 170 L 60 174 L 0 174 Z" fill="#334155" />

  <!-- Golden Trophy / Success Award on Desk -->
  <path d="M 30 170 L 34 145 L 38 170 Z" fill="url(#goldGrad)" />
  <ellipse cx="34" cy="170" rx="6" ry="2" fill="#d97706" />
  <path d="M 28 147 Q 34 142 40 147 Q 44 153 38 157 Q 34 153 30 157 Q 24 153 28 147 Z" fill="url(#goldLight)" />
  <path d="M 26 146 C 22 146 22 153 27 155" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
  <path d="M 42 146 C 46 146 46 153 41 155" stroke="url(#goldGrad)" stroke-width="2" fill="none" />

  <!-- Stack of Golden Coins -->
  <ellipse cx="55" cy="168" rx="8" ry="3" fill="#d97706" />
  <path d="M 47 165 L 47 168 A 8 3 0 0 0 63 168 L 63 165 Z" fill="url(#goldGrad)" />
  <ellipse cx="55" cy="165" rx="8" ry="3" fill="#fbbf24" />
  <path d="M 47 162 L 47 165 A 8 3 0 0 0 63 165 L 63 162 Z" fill="url(#goldGrad)" />
  <ellipse cx="55" cy="162" rx="8" ry="3" fill="#fef3c7" />

  <!-- Sparkles / Success Highlights -->
  <path d="M 90 60 L 93 68 L 101 71 L 93 74 L 90 82 L 87 74 L 79 71 L 87 68 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 150 50 L 152 55 L 157 57 L 152 59 L 150 64 L 148 59 L 143 57 L 148 55 Z" fill="#fbbf24" opacity="0.6" />
  <circle cx="70" cy="100" r="2" fill="#fef3c7" opacity="0.9" />
  <circle cx="160" cy="100" r="1.5" fill="#fef3c7" opacity="0.7" />

  <!-- Ambient Floor Shadow beneath Character -->
  <ellipse cx="135" cy="191" rx="25" ry="5" fill="#000000" opacity="0.4" />
</svg>