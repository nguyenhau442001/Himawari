<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Chart Line Gradient -->
    <linearGradient id="chartLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- UI Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Warm Light -->
    <radialGradient id="deskLamp" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Room Elements -->
  <!-- City Window view (representing 'National' context) -->
  <path d="M 140 25 L 210 25 L 210 115 L 140 115 Z" fill="url(#windowGlow)" stroke="#475569" stroke-width="1.5" rx="2"/>
  <!-- City Skyline Silhouette outside window -->
  <path d="M 145 115 L 145 90 L 153 90 L 153 115 L 160 115 L 160 75 L 170 75 L 170 115 L 180 115 L 180 60 L 192 60 L 192 115 L 200 115 L 200 85 L 205 85 L 205 115 Z" fill="#334155"/>
  <circle cx="176" cy="45" r="4" fill="#fbbf24" opacity="0.8"/>

  <!-- Window Frame Divider -->
  <line x1="175" y1="25" x2="175" y2="115" stroke="#475569" stroke-width="1.5"/>
  <line x1="140" y1="70" x2="210" y2="70" stroke="#475569" stroke-width="1.5"/>

  <!-- Indoor Environment: Bookshelf / Plants -->
  <rect x="20" y="30" width="35" height="85" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <line x1="20" y1="55" x2="55" y2="55" stroke="#334155" stroke-width="1"/>
  <line x1="20" y1="80" x2="55" y2="80" stroke="#334155" stroke-width="1"/>
  <!-- Books on shelf -->
  <rect x="25" y="42" width="6" height="13" rx="1" fill="#f43f5e"/>
  <rect x="32" y="39" width="5" height="16" rx="1" fill="#38bdf8"/>
  <rect x="38" y="43" width="8" height="12" rx="1" fill="#fbbf24"/>
  <!-- Plant on shelf -->
  <path d="M 28 75 Q 30 65 35 62 Q 40 65 42 75 Z" fill="#10b981"/>
  <path d="M 35 80 L 35 68" stroke="#10b981" stroke-width="1.5"/>

  <!-- Wall Decor / Certificate -->
  <rect x="75" y="30" width="30" height="22" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
  <rect x="79" y="34" width="22" height="14" rx="1" fill="#f8fafc"/>
  <line x1="83" y1="38" x2="97" y2="38" stroke="#64748b" stroke-width="1"/>
  <line x1="83" y1="42" x2="93" y2="42" stroke="#64748b" stroke-width="1"/>

  <!-- Ambient Light Cone -->
  <polygon points="90,0 20,180 160,180" fill="url(#deskLamp)"/>

  <!-- Desk Surface -->
  <rect x="10" y="175" width="220" height="8" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <path d="M 25 183 L 35 225 L 205 225 L 215 183 Z" fill="#1e293b"/>

  <!-- Floating Analytics Screen / Dashboard (Growth Chart - '经济持续增长') -->
  <g transform="translate(110, 100)">
    <rect x="0" y="0" width="105" height="75" rx="6" fill="url(#panelGrad)" stroke="#475569" stroke-width="1"/>
    
    <!-- Dashboard header dots -->
    <circle cx="12" cy="10" r="2" fill="#f43f5e"/>
    <circle cx="19" cy="10" r="2" fill="#fbbf24"/>
    <circle cx="26" cy="10" r="2" fill="#10b981"/>

    <!-- Chart Area -->
    <path d="M 12 58 L 30 45 L 48 50 L 66 32 L 84 18" fill="none" stroke="url(#chartLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 12 58 L 30 45 L 48 50 L 66 32 L 84 18 L 84 62 L 12 62 Z" fill="url(#chartFill)"/>
    
    <!-- Rising data points -->
    <circle cx="30" cy="45" r="2.5" fill="#38bdf8"/>
    <circle cx="48" cy="50" r="2.5" fill="#38bdf8"/>
    <circle cx="66" cy="32" r="2.5" fill="#38bdf8"/>
    <circle cx="84" cy="18" r="3.5" fill="#10b981"/>

    <!-- Upward Trend Arrow Icon inside UI -->
    <path d="M 80 40 L 92 28 L 92 36" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 92 28 L 84 28" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Laptop on Desk -->
  <path d="M 75 160 L 125 160 L 135 178 L 65 178 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
  <rect x="70" y="125" width="50" height="35" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="73" y="128" width="44" height="29" rx="1" fill="#0f172a"/>
  <!-- Mini chart on laptop screen -->
  <path d="M 78 150 L 86 142 L 94 146 L 102 135 L 110 130" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="52" y="160" width="12" height="16" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 64 163 Q 69 163 69 168 Q 69 173 64 173" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Steam from coffee -->
  <path d="M 55 154 Q 57 150 55 146" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Character (The '国民' / Citizen / Analyst actively working) -->
  <!-- Torso & Shoulders -->
  <path d="M 35 180 Q 35 150 55 145 L 85 145 Q 105 150 105 180 Z" fill="#3b82f6"/>
  <!-- Shirt Collar -->
  <path d="M 58 145 L 70 160 L 82 145 Z" fill="#f8fafc"/>
  <path d="M 66 150 L 70 165 L 74 150 Z" fill="#ef4444"/>

  <!-- Head & Face -->
  <circle cx="70" cy="115" r="18" fill="#ffedd5"/>
  <!-- Hair -->
  <path d="M 52 115 Q 53 95 70 95 Q 88 95 88 115 Q 85 105 70 102 Q 55 105 52 115 Z" fill="#1e293b"/>
  <!-- Friendly, confident expression -->
  <circle cx="64" cy="113" r="1.5" fill="#1e293b"/>
  <circle cx="76" cy="113" r="1.5" fill="#1e293b"/>
  <!-- Glasses -->
  <rect x="60" y="108" width="8" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="72" y="108" width="8" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="68" y1="111" x2="72" y2="111" stroke="#1e293b" stroke-width="1.2"/>
  <!-- Smile -->
  <path d="M 67 121 Q 70 124 73 121" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Arms / Gesturing towards the growth chart -->
  <!-- Left Arm (resting/typing) -->
  <path d="M 40 155 Q 50 170 65 168" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <!-- Right Arm (pointing enthusiastically upward at the rising statistics) -->
  <path d="M 95 150 Q 115 135 125 115" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="127" cy="110" r="4" fill="#ffedd5"/>

  <!-- Foreground plant element for depth -->
  <path d="M 0 240 L 0 210 Q 15 200 25 240 Z" fill="#065f46" opacity="0.8"/>
  <path d="M 15 240 Q 25 195 45 205 Q 35 225 30 240 Z" fill="#10b981" opacity="0.9"/>
</svg>