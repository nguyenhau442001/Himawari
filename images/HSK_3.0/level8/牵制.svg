<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Tactical Map -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Blue Hologram Glow -->
    <radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 (Defender - Blue) Gradients -->
    <linearGradient id="defender-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Character 2 (Pinned Enemy - Orange/Red) Gradients -->
    <linearGradient id="enemy-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: COMMAND ROOM / TACTICAL OPERATIONS CENTER -->
  <!-- Subtle Wall Grid & Horizon Line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" />
  <path d="M0 130 L90 180 M240 130 L150 180" stroke="#334155" stroke-width="0.75" opacity="0.4" />
  
  <!-- Server / Control Panel Racks in Background -->
  <rect x="18" y="70" width="35" height="110" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="24" y="80" width="23" height="12" rx="2" fill="#1e293b" />
  <circle cx="30" cy="86" r="2" fill="#ef4444" />
  <circle cx="38" cy="86" r="2" fill="#10b981" />
  <rect x="24" y="100" width="23" height="35" rx="2" fill="#1e293b" />
  <!-- Screen wave on server -->
  <path d="M28 115 Q35 105 43 115 T58 115" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="24" y="145" width="23" height="25" rx="2" fill="#1e293b" />
  <line x1="28" y1="155" x2="43" y2="155" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <rect x="187" y="70" width="35" height="110" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="193" y="80" width="23" height="12" rx="2" fill="#1e293b" />
  <circle cx="199" cy="86" r="2" fill="#10b981" />
  <circle cx="207" cy="86" r="2" fill="#10b981" />
  <rect x="193" y="100" width="23" height="70" rx="2" fill="#1e293b" />
  <line x1="197" y1="115" x2="212" y2="115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="197" y1="130" x2="212" y2="130" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="197" y1="145" x2="208" y2="145" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- CENTRAL HOLOGRAPHIC TACTICAL TABLE -->
  <ellipse cx="120" cy="185" rx="75" ry="25" fill="#0f172a" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
  <ellipse cx="120" cy="182" rx="65" ry="20" fill="#1e293b" />
  <!-- Hologram projection base light -->
  <ellipse cx="120" cy="182" rx="50" ry="15" fill="url(#amber-glow)" filter="url(#glow)" />
  
  <!-- Holographic Grid Lines & Elements on Table -->
  <ellipse cx="120" cy="165" rx="40" ry="12" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
  <ellipse cx="120" cy="155" rx="25" ry="8" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.9" />
  <!-- Holographic Marker (Enemy pinned) -->
  <circle cx="120" cy="155" r="5" fill="#ef4444" filter="url(#glow)" />
  <path d="M120 140 L120 170 M105 155 L135 155" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />

  <!-- CHARACTER 1: DEFENDER / STRATEGIST (LEFT) -->
  <g transform="translate(65, 105)" filter="url(#shadow)">
    <!-- Chair / Stool Base -->
    <path d="M-15 75 L15 75 L20 85 L-20 85 Z" fill="#334155" />
    <line x1="-12" y1="75" x2="-18" y2="85" stroke="#475569" stroke-width="2" />
    <line x1="12" y1="75" x2="18" y2="85" stroke="#475569" stroke-width="2" />

    <!-- Body / Torso -->
    <path d="M-14 30 C-14 15 14 15 14 30 L18 70 C18 73 15 75 12 75 L-12 75 C-15 75 -18 73 -18 70 Z" fill="url(#defender-suit)" />
    <!-- Collar & Details -->
    <path d="M-6 24 L0 32 L6 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <rect x="-3" y="32" width="6" height="25" fill="#0284c7" />

    <!-- Left Arm (Reaching forward to control panel/hologram) -->
    <path d="M-12 35 C-22 40 -35 50 -38 55" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="-39" cy="56" r="4" fill="#fde68a" />

    <!-- Right Arm (Resting on table / pointing) -->
    <path d="M12 35 C20 45 25 55 22 65" fill="none" stroke="#0369a1" stroke-width="8" stroke-linecap="round" />
    <circle cx="21" cy="67" r="4" fill="#fde68a" />

    <!-- Head & Hair -->
    <circle cx="0" cy="10" r="14" fill="#fde68a" />
    <!-- Hair (Dark, neat) -->
    <path d="M-13 6 C-14 -2 -5 -6 0 -6 C6 -6 14 -2 13 6 C12 8 10 3 0 3 C-10 3 -12 8 -13 6 Z" fill="#334155" />
    <!-- Confident facial expression (focused eyes, slight smile) -->
    <line x1="-5" y1="8" x2="-2" y2="9" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="2" y1="9" x2="5" y2="8" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M-2 15 Q0 18 2 15" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Headset/Mic -->
    <path d="M-10 10 C-10 -2 10 -2 10 10" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M8 8 L12 16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 2: PINNED/RESTRAINED OPPONENT/ENEMY (RIGHT) -->
  <!-- Represents the "牵制" (held in check / contained) state -->
  <g transform="translate(170, 95)" filter="url(#shadow)">
    <!-- Pinned Stance: Leaning back, hands up/resisting futilely, trapped in energy bonds -->
    <!-- Chair Base -->
    <path d="M-12 80 L12 80 L16 90 L-16 90 Z" fill="#334155" />

    <!-- Body / Torso (Struggling posture, angled back) -->
    <path d="M-10 35 C-5 18 12 22 8 38 L14 75 C14 78 11 80 8 80 L-8 80 C-11 80 -14 78 -13 75 Z" fill="url(#enemy-suit)" />
    <!-- Vest / Tactical gear accent -->
    <path d="M-6 38 L6 42 L4 75 L-4 75 Z" fill="#9a3412" opacity="0.6" />

    <!-- Left Arm (Pushed back/up in frustration) -->
    <path d="M-10 40 C-22 35 -28 25 -25 18" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />
    <circle cx="-25" cy="16" r="4" fill="#fde68a" />

    <!-- Right Arm (Struggling against barrier) -->
    <path d="M8 42 C18 40 28 32 30 25" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round" />
    <circle cx="31" cy="23" r="4" fill="#fde68a" />

    <!-- Head & Hair (Frustrated expression) -->
    <circle cx="0" cy="12" r="14" fill="#fde68a" />
    <!-- Messy Hair (Orange/Brown) -->
    <path d="M-14 8 C-15 -2 -6 -8 1 -7 C9 -6 15 -1 14 9 C10 4 6 5 1 2 C-4 5 -10 4 -14 8 Z" fill="#7c2d12" />
    <!-- Frustrated Eyebrows & Mouth -->
    <line x1="-5" y1="10" x2="-2" y2="12" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
    <line x1="2" y1="12" x2="5" y2="10" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
    <path d="M-3 18 Q0 15 3 18" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- RESTRAINT / "KIỀM CHẾ" VISUAL EFFECT (CONFINEMENT BARRIER) -->
  <!-- Glowing containment field enclosing the opponent and tactical map node -->
  <g transform="translate(170, 95)" filter="url(#glow)">
    <!-- Forcefield Dome / Shield Effect trapping the opponent -->
    <path d="M-35 -10 C-45 20 -40 60 -25 80 C-10 95 15 95 30 80 C45 60 40 20 30 -10 C20 -25 -20 -25 -35 -10 Z" 
          fill="url(#blue-glow)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.85" />
    
    <!-- Energy lock nodes around the shield -->
    <circle cx="-35" cy="35" r="3" fill="#38bdf8" />
    <circle cx="33" cy="35" r="3" fill="#38bdf8" />
    <circle cx="0" cy="-18" r="3" fill="#38bdf8" />
  </g>

  <!-- ACTION VECTORS / LOCK-ON LASERS (Connecting Defender to Pinned Enemy) -->
  <g filter="url(#glow)">
    <!-- Beam 1 -->
    <path d="M85 145 C110 135 130 135 145 115" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 2" />
    <!-- Beam 2 (Curving overhead tactical constraint) -->
    <path d="M85 140 C105 110 130 100 145 105" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.9" />
    <!-- Small targeting reticles along the path -->
    <circle cx="115" cy="125" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="130" cy="115" r="3" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND PROPS / DETAILS -->
  <!-- Floating Tactical Interface Elements (Clean vector UI) -->
  <g transform="translate(100, 35)">
    <!-- Small radar screen floating -->
    <rect x="-25" y="0" width="50" height="25" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="12" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="0" y1="12" x2="6" y2="8" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="4" cy="9" r="1.5" fill="#ef4444" />
    <path d="M-18 6 L-10 6 M-18 10 L-13 10" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Floating status graph (top right) -->
  <g transform="translate(180, 25)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <polyline points="6,22 14,16 22,19 32,8" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="32" cy="8" r="2.5" fill="#10b981" />
  </g>

  <!-- Left Side Ambient Panel / Window outline -->
  <path d="M15 35 L45 35 L45 60 L15 50 Z" fill="#1e293b" opacity="0.4" />

  <!-- Dynamic Energy Sparks / Sparkles representing successful control/containment -->
  <g fill="#38bdf8" filter="url(#glow)">
    <path d="M135 95 L137 100 L142 102 L137 104 L135 109 L133 104 L128 102 L133 100 Z" transform="scale(0.6) translate(110, 30)" />
    <path d="M135 95 L137 100 L142 102 L137 104 L135 109 L133 104 L128 102 L133 100 Z" transform="scale(0.5) translate(220, 140)" fill="#f59e0b" />
  </g>
</svg>