<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Market Stall Structure -->
  <path d="M40 180 L200 180 L190 120 L50 120 Z" fill="#334155"/>
  <path d="M40 120 L120 80 L200 120 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Overcrowded Products -->
  <rect x="50" y="130" width="30" height="40" fill="#fb923c" rx="2"/>
  <rect x="85" y="130" width="30" height="40" fill="#10b981" rx="2"/>
  <rect x="120" y="130" width="30" height="40" fill="#38bdf8" rx="2"/>
  <rect x="155" y="130" width="30" height="40" fill="#ec4899" rx="2"/>
  
  <!-- Piles of boxes overflowing -->
  <rect x="45" y="170" width="35" height="10" fill="#f59e0b" rx="1"/>
  <rect x="160" y="170" width="35" height="10" fill="#f59e0b" rx="1"/>
  
  <!-- Shopkeeper Character -->
  <g transform="translate(120, 150)">
    <circle cx="0" cy="-40" r="15" fill="#fde68a"/>
    <path d="M-5 -35 L-2 -32 M5 -35 L2 -32" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 -28 Q0 -25 5 -28" stroke="#1e293b" stroke-width="2" fill="none"/>
    <rect x="-15" y="-25" width="30" height="25" rx="5" fill="#38bdf8"/>
    <path d="M-20 -20 L-30 -10 M20 -20 L30 -10" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Expression of frustration/fullness -->
  <path d="M145 110 Q160 90 180 100" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="185" cy="100" r="3" fill="#fbbf24"/>
  
  <!-- Floating "Full" indicators -->
  <rect x="20" y="60" width="40" height="10" rx="5" fill="#fb923c" opacity="0.6"/>
  <rect x="180" y="60" width="40" height="10" rx="5" fill="#fb923c" opacity="0.6"/>
  <rect x="100" y="40" width="40" height="10" rx="5" fill="#fb923c" opacity="0.6"/>
</svg>