<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Mountain (The Big Picture/Goal) -->
  <path d="M40 200 L120 60 L200 200 Z" fill="#2D3748" />
  <path d="M100 200 L160 110 L220 200 Z" fill="#374151" opacity="0.6" />
  
  <!-- Ground Line -->
  <rect x="20" y="200" width="200" height="2" rx="1" fill="#4B5563"/>
  
  <!-- The "Insignificant" Object (Tiny Pebble) -->
  <circle cx="80" cy="198" r="1.5" fill="#F59E0B">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Magnifying Glass / Focus Element -->
  <g transform="translate(80, 198)">
    <!-- Connection Line -->
    <line x1="0" y1="0" x2="30" y2="-40" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2,2" />
    
    <!-- Zoom Circle -->
    <g transform="translate(45, -60)">
      <circle r="25" fill="#1A1D24" stroke="#9CA3AF" stroke-width="1.5" />
      <!-- The object inside the zoom is still tiny to emphasize insignificance -->
      <path d="M-3 2 L0 -4 L3 2 Z" fill="#F59E0B" />
      <!-- Subtle lens reflection -->
      <path d="M-15 -10 A 20 20 0 0 1 -5 -18" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.2" />
    </g>
  </g>
  
  <!-- Scale Reference (Tiny Human Silhouette) -->
  <path d="M140 190 Q140 188 142 188 Q144 188 144 190 L144 196 L145 200 M143 200 L142 196 L141 200" stroke="#9CA3AF" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <circle cx="142.5" cy="186" r="1.5" fill="#9CA3AF" />
</svg>