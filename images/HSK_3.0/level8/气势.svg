<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151c2c"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glass Building Shading Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Majestic Golden Hour Glow -->
    <linearGradient id="skyGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Sky & Glowing Backdrop -->
  <rect x="0" y="0" width="240" height="150" fill="url(#skyGlow)"/>

  <!-- Stylized Clouds/Mist behind Building -->
  <path d="M 15 70 Q 30 60 50 75 Q 70 65 90 70 L 90 90 L 15 90 Z" fill="#38bdf8" opacity="0.08"/>
  <path d="M 150 85 Q 170 75 190 90 Q 210 80 230 95 L 230 110 L 150 110 Z" fill="#38bdf8" opacity="0.06"/>

  <!-- ==================== MAIN SCENERY: MAGNIFICENT SKYSCRAPER (这座大楼气势雄伟) ==================== -->
  
  <!-- Skyscraper Base / Plaza Ground -->
  <path d="M 20 200 L 220 200 L 210 215 L 30 215 Z" fill="#334155"/>
  <rect x="50" y="215" width="140" height="5" fill="#475569" rx="2"/>

  <!-- Side Architectural Wing (Left) -->
  <polygon points="50,110 80,95 80,200 50,200" fill="#1e293b" opacity="0.9"/>
  <!-- Side Wing Windows -->
  <g fill="#38bdf8" opacity="0.4">
    <rect x="56" y="105" width="6" height="85" rx="1"/>
    <rect x="66" y="100" width="6" height="90" rx="1"/>
  </g>

  <!-- Side Architectural Wing (Right) -->
  <polygon points="160,95 190,110 190,200 160,200" fill="#0f172a" opacity="0.9"/>
  <!-- Side Wing Windows -->
  <g fill="#38bdf8" opacity="0.3">
    <rect x="168" y="100" width="6" height="90" rx="1"/>
    <rect x="178" y="105" width="6" height="85" rx="1"/>
  </g>

  <!-- Central Majestic Tower Body (Tapering Upwards for "Grandeur/气势") -->
  <polygon points="80,200 80,60 160,60 160,200" fill="url(#glassGrad)"/>
  
  <!-- Tower Central Pinnacle/Crown -->
  <polygon points="120,25 100,60 140,60" fill="#0284c7"/>
  <rect x="117" y="10" width="6" height="20" fill="#fbbf24" rx="2"/>
  <circle cx="120" cy="10" r="3" fill="#f59e0b"/>

  <!-- Vertical Architectural Ribs / Facade Details -->
  <line x1="100" y1="60" x2="100" y2="200" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="60" x2="120" y2="200" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <line x1="140" y1="60" x2="140" y2="200" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>

  <!-- Horizontal Glass Floor Grid Lines -->
  <g stroke="#e2e8f0" stroke-width="0.75" opacity="0.4">
    <line x1="82" y1="75" x2="158" y2="75"/>
    <line x1="82" y1="90" x2="158" y2="90"/>
    <line x1="82" y1="105" x2="158" y2="105"/>
    <line x1="82" y1="120" x2="158" y2="120"/>
    <line x1="82" y1="135" x2="158" y2="135"/>
    <line x1="82" y1="150" x2="158" y2="150"/>
    <line x1="82" y1="165" x2="158" y2="165"/>
    <line x1="82" y1="180" x2="158" y2="180"/>
    <line x1="82" y1="195" x2="158" y2="195"/>
  </g>

  <!-- Glowing Architectural Accent Lights (Adding Majestic Vibe) -->
  <rect x="116" y="65" width="8" height="130" fill="#fbbf24" opacity="0.3"/>
  <circle cx="120" cy="130" r="35" fill="#38bdf8" opacity="0.15" filter="blur(4px)"/>

  <!-- ==================== FOREGROUND & OBSERVERS ==================== -->
  
  <!-- Low Wall / Viewing Platform Edge -->
  <rect x="0" y="215" width="240" height="25" fill="#0f172a"/>
  <rect x="0" y="215" width="240" height="4" fill="#334155"/>

  <!-- Character 1 (Tourist/Observer pointing in awe at the majestic building) -->
  <g transform="translate(45, 175)">
    <!-- Body & Jacket -->
    <path d="M 12 40 L 22 40 L 25 65 L 8 65 Z" fill="url(#jacketGrad)"/>
    <!-- Head -->
    <circle cx="16" cy="22" r="8" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 9 20 C 10 14, 22 14, 23 20 Z" fill="#1e293b"/>
    <!-- Raised Arm pointing upward -->
    <path d="M 22 42 L 32 30 L 35 34 L 25 46 Z" fill="#6366f1"/>
    <!-- Hand pointing -->
    <circle cx="33.5" cy="31.5" r="2.5" fill="#fcd34d"/>
    <!-- Legs -->
    <rect x="11" y="65" width="4" height="20" fill="#334155"/>
    <rect x="19" y="65" width="4" height="20" fill="#334155"/>
  </g>

  <!-- Character 2 (Companion looking up with arms crossed in admiration) -->
  <g transform="translate(85, 185)">
    <!-- Body -->
    <path d="M 10 30 L 24 30 L 27 55 L 7 55 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="17" cy="17" r="7.5" fill="#fed7aa"/>
    <!-- Ponytail Hair -->
    <path d="M 10 13 C 12 8, 22 10, 24 16 C 26 22, 27 20, 29 23 C 27 24, 23 18, 12 16 Z" fill="#0f172a"/>
    <!-- Crossed Arms -->
    <path d="M 8 35 L 26 35 L 24 42 L 10 42 Z" fill="#db2777"/>
    <!-- Legs -->
    <rect x="10" y="55" width="4" height="15" fill="#1e293b"/>
    <rect x="18" y="55" width="4" height="15" fill="#1e293b"/>
  </g>

  <!-- Environmental Scale Props (Modern Street Light / Bollard on the left) -->
  <rect x="15" y="180" width="3" height="40" fill="#64748b" rx="1"/>
  <circle cx="16.5" cy="178" r="4" fill="#fbbf24"/>
  <circle cx="16.5" cy="178" r="6" fill="#fbbf24" opacity="0.3" filter="blur(2px)"/>

  <!-- Ambient Light Sparks / Energy particles around the grand building -->
  <circle cx="95" cy="110" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="145" cy="95" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="130" cy="150" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="105" cy="165" r="2" fill="#38bdf8" opacity="0.8"/>
</svg>