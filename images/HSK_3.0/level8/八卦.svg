<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements to give context of discussion/news -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="50" y="40" width="30" height="20" rx="4" fill="#94A3B8"/>
    <rect x="160" y="180" width="35" height="20" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Central Iconographic Representation of "Bāguà" (Gossip / Tabloid Rumors) -->
  <!-- 1. The Bagua Symbol (representing the literal root/shape) -->
  <g transform="translate(120, 105)">
    <!-- Outer Ring / Octagon or Circle -->
    <circle cx="0" cy="0" r="64" fill="#262B36" stroke="#38BDF8" stroke-width="3"/>
    
    <!-- Bagua Trigram/Yin-Yang aesthetic simplified -->
    <path d="M 0,-52 A 52,52 0 0,1 0,52 A 26,26 0 0,1 0,0 A 26,26 0 0,0 0,-52" fill="#38BDF8" opacity="0.8"/>
    <circle cx="0" cy="-26" r="8" fill="#1A1D24"/>
    <circle cx="0" cy="26" r="8" fill="#38BDF8"/>
  </g>

  <!-- 2. Overlay of "Gossip / Whispering / Media Bubbles" (representing the modern semantic meaning: tabloid news, chatter) -->
  <!-- Speech / Chat Bubbles overlapping the Bagua symbol -->
  <!-- Left Gossip Bubble (Pinkish/Red accent for entertainment/tabloid vibe) -->
  <g transform="translate(65, 80)">
    <rect x="-24" y="-18" width="48" height="32" rx="10" fill="#F43F5E"/>
    <path d="M -10,14 L -4,24 L 2,14 Z" fill="#F43F5E"/>
    <!-- Three little dots inside bubble indicating whispering/chatting -->
    <circle cx="-10" cy="-2" r="3" fill="#FFFFFF"/>
    <circle cx="0" cy="-2" r="3" fill="#FFFFFF"/>
    <circle cx="10" cy="-2" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Right/Top Gossip Bubble (Amber/Gold accent for juicy news) -->
  <g transform="translate(170, 95)">
    <rect x="-26" y="-18" width="52" height="32" rx="10" fill="#F59E0B"/>
    <path d="M 10,14 L 16,24 L 22,14 Z" fill="#F59E0B"/>
    <!-- Exclamation / Sparkle inside second bubble -->
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Media/Sparkle Elements (Highlighting the "entertainment news" aspect) -->
  <g transform="translate(120, 185)">
    <!-- Mini tabloid paper / news icon base -->
    <rect x="-35" y="-14" width="70" height="28" rx="6" fill="#334155" stroke="#64748B" stroke-width="2"/>
    <line x1="-23" y1="-5" x2="-3" y2="-5" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
    <line x1="-23" y1="3" x2="15" y2="3" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Starburst on the paper -->
    <path d="M 22,-4 L 24,0 L 28,2 L 24,4 L 22,8 L 20,4 L 16,2 L 20,0 Z" fill="#FBBF24"/>
  </g>

</svg>