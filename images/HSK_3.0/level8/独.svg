<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Falling snowflakes in the background -->
  <g fill="#A6B4C9" opacity="0.4">
    <circle cx="50" cy="50" r="1.5"/>
    <circle cx="90" cy="30" r="2"/>
    <circle cx="180" cy="70" r="1.5"/>
    <circle cx="200" cy="40" r="2.5"/>
    <circle cx="30" cy="110" r="1.5"/>
    <circle cx="70" cy="150" r="2"/>
    <circle cx="210" cy="130" r="1.5"/>
    <circle cx="40" cy="190" r="2"/>
    <circle cx="190" cy="200" r="1.5"/>
  </g>
  
  <!-- Subtle ground/snowdrift -->
  <path d="M 20 200 Q 120 190 220 200 L 220 215 L 20 215 Z" fill="#283040"/>
  
  <!-- Faded/wilted branches in the background (representing "满园繁花已经凋落殆尽") -->
  <g stroke="#3A465C" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4">
    <!-- Left faded branch -->
    <path d="M 70 200 C 60 170, 50 150, 30 130"/>
    <path d="M 50 160 C 40 155, 35 150, 25 145"/>
    <path d="M 58 145 C 50 140, 45 130, 40 120"/>
    <!-- Right faded branch -->
    <path d="M 170 200 C 180 170, 190 145, 215 125"/>
    <path d="M 185 150 C 195 145, 205 140, 215 135"/>
  </g>
  
  <!-- Central Plum Blossom Tree (寒梅 - representing "独有几株寒梅在凛冽风雪中傲然绽放") -->
  <!-- Main Trunk & Branches -->
  <g stroke="#4E5D78" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roots / Base -->
    <path d="M 110 202 L 130 202 L 126 185 L 114 185 Z" fill="#4E5D78" stroke="none"/>
    <!-- Main Trunk -->
    <path d="M 116 185 C 118 150, 112 120, 120 90" stroke-width="6" fill="none"/>
    <!-- Left Major Bough -->
    <path d="M 117 135 C 100 120, 85 110, 65 105" stroke-width="4" fill="none"/>
    <!-- Right Major Bough -->
    <path d="M 118 110 C 135 95, 150 90, 175 95" stroke-width="4" fill="none"/>
    <!-- Upper Twigs -->
    <path d="M 120 90 C 122 75, 115 65, 105 55" stroke-width="2.5" fill="none"/>
    <path d="M 120 90 C 125 75, 135 65, 145 55" stroke-width="2.5" fill="none"/>
    <path d="M 65 105 C 55 100, 50 90, 45 80" stroke-width="2" fill="none"/>
    <path d="M 175 95 C 185 90, 190 80, 195 70" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Plum Blossoms (傲然绽放 - Vibrant Gold/Amber contrasting against dark background and snow) -->
  <!-- Flower group 1 (Top center) -->
  <g transform="translate(105, 55)">
    <circle cx="0" cy="-5" r="4" fill="#F5A623"/>
    <circle cx="4" cy="-2" r="4" fill="#F5A623"/>
    <circle cx="3" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-3" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-4" cy="-2" r="4" fill="#F5A623"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Flower group 2 (Top right) -->
  <g transform="translate(145, 55)">
    <circle cx="0" cy="-5" r="4.5" fill="#F5A623"/>
    <circle cx="4.5" cy="0" r="4.5" fill="#F5A623"/>
    <circle cx="2" cy="4" r="4.5" fill="#F5A623"/>
    <circle cx="-3" cy="3" r="4.5" fill="#F5A623"/>
    <circle cx="-4" cy="-2" r="4.5" fill="#F5A623"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Flower group 3 (Far left) -->
  <g transform="translate(45, 80)">
    <circle cx="0" cy="-4" r="4" fill="#F5A623"/>
    <circle cx="4" cy="-1" r="4" fill="#F5A623"/>
    <circle cx="2" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-3" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-3" cy="-2" r="4" fill="#F5A623"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Flower group 4 (Far right) -->
  <g transform="translate(195, 70)">
    <circle cx="0" cy="-5" r="4" fill="#F5A623"/>
    <circle cx="4" cy="-2" r="4" fill="#F5A623"/>
    <circle cx="3" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-3" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-4" cy="-2" r="4" fill="#F5A623"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Flower group 5 (Center main bough) -->
  <g transform="translate(117, 110)">
    <circle cx="0" cy="-5" r="4.5" fill="#F5A623"/>
    <circle cx="4.5" cy="-1" r="4.5" fill="#F5A623"/>
    <circle cx="3" cy="4" r="4.5" fill="#F5A623"/>
    <circle cx="-3" cy="4" r="4.5" fill="#F5A623"/>
    <circle cx="-4" cy="-1" r="4.5" fill="#F5A623"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Flower group 6 (Left mid) -->
  <g transform="translate(65, 105)">
    <circle cx="0" cy="-4" r="4" fill="#F5A623"/>
    <circle cx="4" cy="-1" r="4" fill="#F5A623"/>
    <circle cx="2" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-2" cy="3" r="4" fill="#F5A623"/>
    <circle cx="-3" cy="-1" r="4" fill="#F5A623"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Active falling prominent snow flakes over the solitary tree -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="118" cy="40" r="2.5"/>
    <circle cx="85" cy="70" r="2"/>
    <circle cx="160" cy="65" r="2"/>
    <circle cx="135" cy="45" r="1.5"/>
    <circle cx="95" cy="95" r="2.5"/>
    <circle cx="150" cy="115" r="2"/>
    <circle cx="60" cy="130" r="2"/>
  </g>
</svg>