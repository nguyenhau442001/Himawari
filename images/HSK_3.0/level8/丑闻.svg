<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow representing exposure/light shining on a secret -->
  <circle cx="120" cy="115" r="75" fill="#252A34" opacity="0.8"/>
  <path d="M 60 40 L 120 115 L 180 40 Z" fill="#F39C12" opacity="0.08"/>

  <!-- Newspaper / Media Document symbolizing "Scandal" (丑闻) being exposed -->
  <!-- Newspaper background/body -->
  <g transform="translate(65, 55)">
    <rect x="0" y="0" width="110" height="130" rx="6" fill="#2C3440" stroke="#3E4A59" stroke-width="2"/>
    
    <!-- Giant revealing spotlight beam across the document -->
    <path d="M 10 0 L 110 0 L 90 130 L -10 130 Z" fill="#F39C12" opacity="0.05"/>

    <!-- Document Header / Headline placeholder lines -->
    <rect x="15" y="18" width="80" height="10" rx="3" fill="#E6EDF3" opacity="0.9"/>
    
    <!-- Scandal imagery element on paper: A silhouetted person with a red warning/shame marker -->
    <circle cx="55" cy="58" r="16" fill="#3E4A59"/>
    <path d="M 31 92 C 31 78 41 74 55 74 C 69 74 79 78 79 92 Z" fill="#3E4A59"/>
    
    <!-- Scandal/Exposure Stamp / Exclamation Stamp in Accent Gold/Orange -->
    <circle cx="82" cy="45" r="14" fill="#E74C3C"/>
    <!-- Exclamation mark inside stamp -->
    <rect x="80" y="37" width="4" height="10" rx="2" fill="#FFFFFF"/>
    <circle cx="82" cy="52" r="2" fill="#FFFFFF"/>

    <!-- Body text lines -->
    <rect x="15" y="105" width="65" height="5" rx="2.5" fill="#6C7A89"/>
    <rect x="15" y="117" width="45" height="5" rx="2.5" fill="#6C7A89"/>
  </g>

  <!-- Magnifying glass symbolizing "Exposure" (曝光) inspecting the scandal -->
  <g transform="translate(95, 95)">
    <!-- Glass lens circle with high-contrast border -->
    <circle cx="50" cy="50" r="34" fill="#1A1D24" fill-opacity="0.6" stroke="#F39C12" stroke-width="5"/>
    <circle cx="50" cy="50" r="30" fill="#3498DB" fill-opacity="0.15"/>
    
    <!-- Lens reflection highlight -->
    <path d="M 28 35 A 30 30 0 0 1 65 25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Magnifying glass handle -->
    <path d="M 26 74 L 5 95" stroke="#F39C12" stroke-width="7" stroke-linecap="round"/>
    <circle cx="3.5" cy="96.5" r="3.5" fill="#E67E22"/>
  </g>
</svg>