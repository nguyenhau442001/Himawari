<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Stage spotlight glow -->
    <path d="M-60 -85 L60 -85 L90 75 L-90 75 Z" fill="#F59E0B" opacity="0.08"/>
    
    <!-- Theater curtains framing the top -->
    <path d="M-110 -85 C-90 -65 -70 -85 -50 -85 C-30 -85 -10 -65 10 -85 C30 -85 50 -65 70 -85 C90 -85 110 -65 110 -85 L110 -95 L-110 -95 Z" fill="#334155"/>

    <!-- Dynamic Jester / Comedian Character (Performing exaggerated comedy) -->
    <!-- Head tilted dramatically -->
    <g transform="rotate(-15) translate(5, -20)">
      <!-- Jester Hat / Comedy Prop -->
      <path d="M -15 -35 C -30 -60 -60 -55 -45 -35 C -35 -20 -15 -25 -15 -35 Z" fill="#F59E0B"/>
      <circle cx="-52" cy="-40" r="5" fill="#38BDF8"/>
      
      <path d="M 10 -35 C 25 -60 55 -55 40 -35 C 30 -20 10 -25 10 -35 Z" fill="#38BDF8"/>
      <circle cx="47" cy="-40" r="5" fill="#F59E0B"/>

      <path d="M -20 -30 C 0 -45 20 -45 20 -30 C 10 -25 -10 -25 -20 -30 Z" fill="#EC4899"/>
      <circle cx="0" cy="-38" r="5" fill="#FBBF24"/>

      <!-- Face -->
      <circle cx="0" cy="-10" r="22" fill="#FDE047"/>
      
      <!-- Hilarious Laughing Face / Wide Open Grin & Closed Happy Eyes -->
      <path d="M -9 -14 Q -5 -19 -1 -14" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 3 -14 Q 7 -19 11 -14" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Big open laughing mouth -->
      <path d="M -8 -3 Q 0 8 8 -3 Z" fill="#E11D48"/>
      <path d="M -6 -2 Q 0 4 6 -2 Z" fill="#FFFFFF"/>

      <!-- Rosy Cheeks -->
      <circle cx="-12" cy="-6" r="4" fill="#FB7185" opacity="0.6"/>
      <circle cx="12" cy="-6" r="4" fill="#FB7185" opacity="0.6"/>
    </g>

    <!-- Exaggerated Body & Costume (Funny pose) -->
    <g transform="translate(0, 15)">
      <!-- Torso / Jester Costume -->
      <path d="M -25 0 L 25 0 L 30 35 L -30 35 Z" fill="#8B5CF6"/>
      <!-- Collar ruffs -->
      <path d="M -28 -2 C -35 -12 -15 -10 -20 -2 Z" fill="#FFFFFF"/>
      <path d="M 28 -2 C 35 -12 15 -10 20 -2 Z" fill="#FFFFFF"/>
      <path d="M -5 -2 C 0 -15 10 -15 5 -2 Z" fill="#38BDF8"/>

      <!-- Wacky Arms -->
      <!-- Left arm pointing up enthusiastically -->
      <path d="M -25 5 C -45 -5 -60 -25 -50 -35" stroke="#FDE047" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="-50" cy="-35" r="5" fill="#FDE047"/>

      <!-- Right arm akimbo / dynamic wave -->
      <path d="M 25 5 C 45 10 50 -10 40 -20" stroke="#FDE047" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="40" cy="-20" r="5" fill="#FDE047"/>

      <!-- Legs in a funny dance stance -->
      <path d="M -15 35 L -30 65" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
      <path d="M 15 35 L 25 60 L 35 60" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- Shoes -->
      <ellipse cx="-33" cy="67" rx="8" ry="5" fill="#EC4899"/>
      <ellipse cx="38" cy="62" rx="8" ry="5" fill="#EC4899"/>
    </g>

    <!-- Comedy Sound/Energy Sparks (Visualizing "gǎoxiào" vibe) -->
    <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <!-- Left spark -->
      <line x1="-75" y1="-30" x2="-63" y2="-25"/>
      <line x1="-70" y1="-45" x2="-60" y2="-38"/>
      <!-- Right spark -->
      <line x1="63" y1="-10" x2="75" y2="-5"/>
      <line x1="60" y1="-30" x2="72" y2="-25"/>
      <!-- Top spark -->
      <line x1="5" y1="-65" x2="8" y2="-53"/>
    </g>

    <!-- Floating Comic Laugh Bubbles / Symbols -->
    <g transform="translate(0, 0)">
      <path d="M-65, -5 C-65, -15 -45, -15 -45, -5 C-45, 5 -65, 5 -65, -5 Z" fill="#334155" opacity="0.8"/>
      <circle cx="-55" cy="-5" r="2" fill="#F9FAFB"/>
      <circle cx="-48" cy="1" r="1.5" fill="#F9FAFB"/>
      
      <path d="M60, 20 C60, 10 80, 10 80, 20 C80, 30 60, 30 60, 20 Z" fill="#334155" opacity="0.8"/>
      <circle cx="70" cy="20" r="2" fill="#F9FAFB"/>
    </g>
  </g>
</svg>