<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="50" y="55" width="140" height="85" rx="6" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Studio Walls -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" />
  <!-- Shelf in background -->
  <rect x="30" y="30" width="60" height="6" rx="3" fill="#475569" />
  <circle cx="45" cy="24" r="6" fill="#f43f5e" />
  <path d="M65 15 L75 30 L55 30 Z" fill="#38bdf8" />

  <!-- Window with High-Contrast Day/Night or Black/White motif outside -->
  <rect x="175" y="25" width="35" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- High contrast window scenery (Black and White/Dark and Bright) -->
  <path d="M175 25 L210 50 L175 75 Z" fill="#f8fafc" opacity="0.9" />
  <path d="M210 25 L210 75 L175 75 Z" fill="#090d16" />

  <!-- Desk Surface -->
  <path d="M10 165 L230 165 L240 210 L0 210 Z" fill="url(#deskGrad)" />
  <path d="M0 165 L240 165" stroke="#64748b" stroke-width="2" />

  <!-- Designer Desk Setup (Black & White high contrast theme) -->
  <!-- Monitor Stand -->
  <rect x="110" y="140" width="20" height="25" fill="#475569" />
  <ellipse cx="120" cy="165" rx="25" ry="5" fill="#334155" />

  <!-- Monitor Frame -->
  <rect x="46" y="51" width="148" height="93" rx="10" fill="#0f172a" stroke="#475569" stroke-width="3" />
  
  <!-- Screen Content: "Hei Bai Fen Ming" Concept - Stark Black and White Contrast UI -->
  <g clip-path="url(#screenClip)">
    <rect x="50" y="55" width="140" height="85" fill="#f8fafc" />
    <!-- Left Half: Pitch Black -->
    <path d="M50 55 L120 55 L100 140 L50 140 Z" fill="#090d16" />
    <!-- Right Half: Pure White with geometric crisp vectors -->
    <circle cx="155" cy="97" r="22" fill="#090d16" />
    <circle cx="80" cy="97" r="14" fill="#f8fafc" />
    <!-- Sharp dividing line representing 'fen ming' (clear distinction) -->
    <path d="M123 55 L103 140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Desk Accessories -->
  <!-- Coffee Mug (Black & White split design) -->
  <path d="M35 150 C35 142 45 142 45 150 L45 175 C45 180 35 180 35 175 Z" fill="#f8fafc" />
  <path d="M40 142 L45 142 L45 175 L40 175 Z" fill="#090d16" />
  <path d="M45 150 C52 150 52 165 45 165" fill="none" stroke="#f8fafc" stroke-width="2.5" />

  <!-- Desk Lamp -->
  <path d="M210 165 L210 90" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M190 75 L230 75 L220 90 L200 90 Z" fill="#334155" />
  <circle cx="210" cy="90" r="15" fill="url(#lampGlow)" />

  <!-- Character (Art Director / Illustrator at Work) -->
  <!-- Body/Torso -->
  <path d="M95 190 C95 170 110 160 120 160 C130 160 145 170 145 190 L150 225 L90 225 Z" fill="#0284c7" />
  <!-- Collar / Shirt Detail -->
  <path d="M110 160 L120 175 L130 160" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- Neck & Head -->
  <rect x="113" y="140" width="14" height="25" fill="#fbcfe8" />
  <circle cx="120" cy="125" r="22" fill="#fbcfe8" />
  
  <!-- Hair (Stylish modern dark hair) -->
  <path d="M98 120 C98 105 110 100 120 100 C132 100 142 108 142 125 C142 130 140 135 140 135 C140 135 135 120 120 115 C105 120 100 132 100 132 Z" fill="#1e293b" />

  <!-- Expressive Focused Face & Glasses -->
  <path d="M107 124 L133 124" stroke="#1e293b" stroke-width="2" />
  <circle cx="113" cy="124" r="6" fill="none" stroke="#334155" stroke-width="2" />
  <circle cx="127" cy="124" r="6" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M120 132 Q120 136 123 135" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

  <!-- Hands / Arms actively designing -->
  <path d="M95 180 C80 185 75 165 85 155" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" />
  <path d="M145 180 C160 185 165 165 155 155" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" />

  <!-- Graphic Tablet in front -->
  <rect x="85" y="180" width="70" height="35" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <rect x="95" y="188" width="50" height="20" rx="3" fill="#0f172a" />
  <!-- Stylus Pen -->
  <path d="M120 170 L140 195" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

  <!-- Foreground ambiance highlights -->
  <circle cx="20" cy="40" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="220" cy="120" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="15" cy="140" r="2.5" fill="#f43f5e" opacity="0.5" />
</svg>