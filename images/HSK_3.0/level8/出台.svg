<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements representing official policy implementation/document origin -->
  <g opacity="0.15">
    <rect x="40" y="45" width="160" height="150" rx="12" fill="#38BDF8"/>
    <line x1="70" y1="75" x2="130" y2="75" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="95" x2="170" y2="95" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="115" x2="140" y2="115" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Stage / Podium structure representing "台" (tái) -->
  <path d="M50 185 L190 185 L175 205 L65 205 Z" fill="#334155"/>
  <rect x="60" y="175" width="120" height="12" rx="4" fill="#64748B"/>
  <rect x="75" y="145" width="90" height="32" rx="2" fill="#475569"/>

  <!-- Official document / Policy decree emerging (出 chū) -->
  <g transform="translate(0, -5)">
    <!-- Motion lines indicating outward/upward action -->
    <path d="M120 70 L120 40" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M100 80 L85 60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M140 80 L155 60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- The official policy document rising up -->
    <rect x="90" y="70" width="60" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Document header seal/emblem -->
    <circle cx="120" cy="90" r="10" fill="#F59E0B"/>
    <!-- Document lines (content) -->
    <rect x="102" y="110" width="36" height="5" rx="2.5" fill="#64748B"/>
    <rect x="102" y="122" width="28" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="102" y="134" width="32" height="5" rx="2.5" fill="#94A3B8"/>
  </g>

  <!-- Foreground hands presenting the policy -->
  <!-- Left hand -->
  <path d="M55 190 C65 170 75 160 85 160 C90 160 95 165 95 170 C95 175 90 180 85 185 L70 205 Z" fill="#FDBA74"/>
  <!-- Right hand -->
  <path d="M185 190 C175 170 165 160 155 160 C150 160 145 165 145 170 C145 175 150 180 155 185 L170 205 Z" fill="#FDBA74"/>

  <!-- Focal highlight glow behind the emerging policy -->
  <circle cx="120" cy="115" r="45" fill="#F59E0B" opacity="0.12" filter="blur(8px)"/>
</svg>