<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a" />

  <!-- Ambient Warm Window Glow & Stars -->
  <circle cx="180" cy="50" r="1.5" fill="#64748b" opacity="0.5" />
  <circle cx="210" cy="70" r="1" fill="#64748b" opacity="0.4" />
  <circle cx="150" cy="40" r="1" fill="#64748b" opacity="0.3" />

  <!-- Window Frame & Warm Interior Light -->
  <rect x="130" y="55" width="80" height="95" rx="4" fill="#1e293b" />
  <path d="M135 60 L205 60 L205 145 L135 145 Z" fill="#f59e0b" opacity="0.12" />
  <!-- Window Panes -->
  <line x1="170" y1="60" x2="170" y2="145" stroke="#334155" stroke-width="2" />
  <line x1="135" y1="102" x2="205" y2="102" stroke="#334155" stroke-width="2" />
  <!-- Warm glow overlay on window sill -->
  <path d="M130 145 H210 V150 H130 Z" fill="#334155" />

  <!-- Room Interior Elements -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" />
  <!-- Wooden Floor -->
  <path d="M10 170 L230 170 L235 220 L5 220 Z" fill="#334155" />
  <path d="M20 185 L220 185" stroke="#1e293b" stroke-width="1.5" opacity="0.7" />
  <path d="M15 202 L225 202" stroke="#1e293b" stroke-width="1.5" opacity="0.7" />

  <!-- Cozy Bookshelf with Books in Background -->
  <rect x="25" y="70" width="35" height="80" rx="2" fill="#334155" />
  <line x1="25" y1="95" x2="60" y2="95" stroke="#1e293b" stroke-width="2" />
  <line x1="25" y1="125" x2="60" y2="125" stroke="#1e293b" stroke-width="2" />
  <!-- Books -->
  <rect x="28" y="78" width="6" height="15" rx="1" fill="#f59e0b" />
  <rect x="36" y="76" width="5" height="17" rx="1" fill="#38bdf8" />
  <rect x="43" y="79" width="8" height="14" rx="1" fill="#ec4899" />
  <rect x="29" y="105" width="7" height="18" rx="1" fill="#10b981" />
  <rect x="38" y="108" width="6" height="15" rx="1" fill="#fb923c" />

  <!-- Wall Picture Frame -->
  <rect x="80" y="50" width="28" height="36" rx="2" fill="#334155" />
  <rect x="83" y="53" width="22" height="30" rx="1" fill="#0f172a" />
  <circle cx="94" cy="65" r="5" fill="#f59e0b" opacity="0.8" />
  <path d="M85 75 Q94 68 103 75 V81 H85 Z" fill="#10b981" opacity="0.8" />

  <!-- Floor Lamp casting warm light -->
  <line x1="200" y1="170" x2="200" y2="100" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M190 100 L210 100 L215 115 L185 115 Z" fill="#f59e0b" />
  <!-- Lamp light cone projection -->
  <path d="M188 115 L140 200 L230 200 Z" fill="#f59e0b" opacity="0.08" />

  <!-- Cozy Armchair -->
  <path d="M70 120 Q65 110 75 105 Q90 95 115 105 Q125 110 120 120 Z" fill="#38bdf8" opacity="0.2" />
  <rect x="75" y="120" width="45" height="50" rx="8" fill="#334155" />
  <path d="M68 125 C68 115 75 112 82 115 L82 160 C75 160 68 150 68 140 Z" fill="#1e293b" />
  <path d="M122 125 C122 115 115 112 108 115 L108 160 C115 160 122 150 122 140 Z" fill="#1e293b" />
  <rect x="70" y="155" width="55" height="15" rx="4" fill="#475569" />

  <!-- MAIN CHARACTER (Traveler returned home, relieved and embraced) -->
  <!-- Body/Torso leaning into home -->
  <g transform="translate(105, 115)">
    <!-- Legs seated/resting -->
    <rect x="-12" y="32" width="14" height="25" rx="6" fill="#1e293b" />
    <rect x="2" y="32" width="14" height="25" rx="6" fill="#1e293b" />

    <!-- Torso (Wearing a cozy winter sweater) -->
    <path d="M-16 5 C-16 -5 -5 -10 0 -10 C5 -10 16 -5 16 5 L18 35 L-18 35 Z" fill="#fb923c" />
    
    <!-- Scarf wrapped around neck (symbolizing journey/weather outside vs warmth inside) -->
    <path d="M-10 -7 C-5 -13 5 -13 10 -7 C12 -4 8 2 0 2 C-8 2 -12 -4 -10 -7 Z" fill="#ec4899" />
    <path d="M5 0 Q12 15 8 28" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />

    <!-- Head and Face (relaxed, eyes closed in relief/peace) -->
    <circle cx="0" cy="-22" r="11" fill="#fbcfe8" />
    
    <!-- Hair -->
    <path d="M-11 -24 C-12 -33 0 -35 11 -27 C12 -23 10 -19 10 -19 C5 -22 -5 -22 -11 -24 Z" fill="#0f172a" />

    <!-- Peaceful Closed Eyes (Arcs) -->
    <path d="M-5 -21 Q-3 -19 -1 -21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M1 -21 Q3 -19 5 -21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Gentle Smile -->
    <path d="M-2 -15 Q0 -13 2 -15" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms relaxed, holding a warm mug -->
    <path d="M-16 10 Q-24 15 -14 25" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />
    <path d="M16 10 Q24 18 12 24" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />

    <!-- Warm Mug in Hands -->
    <rect x="8" y="20" width="8" height="10" rx="2" fill="#38bdf8" />
    <!-- Steam rising from mug -->
    <path d="M10 17 Q12 13 10 10" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Luggage / Suitcase neatly placed by the door (signifying journey ended, arrived at final destination) -->
  <g transform="translate(165, 140)">
    <!-- Main suitcase body -->
    <rect x="0" y="10" width="24" height="30" rx="4" fill="#38bdf8" />
    <!-- Suitcase straps/details -->
    <rect x="4" y="10" width="3" height="30" fill="#0f172a" opacity="0.2" />
    <rect x="17" y="10" width="3" height="30" fill="#0f172a" opacity="0.2" />
    <rect x="8" y="20" width="8" height="2" fill="#0f172a" opacity="0.2" />
    <!-- Handle -->
    <path d="M7 10 V6 C7 4 9 4 12 4 C15 4 17 4 17 6 V10" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Wheels -->
    <circle cx="6" cy="42" r="2" fill="#1e293b" />
    <circle cx="18" cy="42" r="2" fill="#1e293b" />
  </g>

  <!-- Cozy indoor plant on small stool for life/warmth detail -->
  <g transform="translate(45, 135)">
    <rect x="0" y="20" width="16" height="15" rx="2" fill="#fb923c" />
    <ellipse cx="8" cy="20" rx="9" ry="3" fill="#ea580c" />
    <!-- Plant Leaves -->
    <path d="M8 17 Q0 5 4 -2" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <path d="M8 17 Q14 2 20 8" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <path d="M8 17 Q8 0 12 -5" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Lighting/Vignette -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.05" />
</svg>