<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15" />
    </linearGradient>

    <!-- Wheat Field Gradient -->
    <linearGradient id="field-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- SCENE GRAPHICS: Vast North China Plain (HuaBei PingYuan) with modern agricultural productivity -->
  
  <!-- Sky Background -->
  <rect x="0" y="0" width="240" height="130" fill="url(#sky-grad)" rx="24" />
  
  <!-- Radiant Sun -->
  <circle cx="180" cy="50" r="28" fill="url(#sun-glow)" />
  <circle cx="180" cy="50" r="14" fill="#fef08a" />

  <!-- Distant Wind Turbines & Flat Horizon representing the vast Plain -->
  <g opacity="0.6">
    <!-- Horizon Line -->
    <line x1="0" y1="110" x2="240" y2="110" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Wind Turbines -->
    <path d="M60 110 L60 70 M60 70 L50 62 M60 70 L70 65 M60 70 L62 80" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M120 110 L120 75 M120 75 L110 68 M120 75 L130 70 M120 75 L122 85" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Rolling/Flat Farmland Layers (PingYuan) -->
  <!-- Layer 1: Far background fields -->
  <path d="M0 110 Q 80 100, 240 112 L 240 135 L 0 135 Z" fill="#047857" opacity="0.6" />

  <!-- Layer 2: Mid-ground crops and rows -->
  <path d="M0 130 Q 120 120, 240 132 L 240 170 L 0 170 Z" fill="#10b981" />
  <!-- Crop row lines -->
  <path d="M20 170 L60 132 M80 170 L110 132 M140 170 L160 132 M200 170 L210 132" stroke="#059669" stroke-width="1.5" opacity="0.5" />

  <!-- Layer 3: Foreground Rich Agricultural Zone (Wheat Field) -->
  <path d="M0 160 Q 120 145, 240 162 L 240 240 L 0 240 Z" fill="url(#field-grad)" />
  
  <!-- Wheat Stalk Patterns / Texture -->
  <g stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="15" y1="180" x2="15" y2="165" />
    <line x1="25" y1="190" x2="25" y2="175" />
    <line x1="35" y1="175" x2="35" y2="160" />
    <line x1="55" y1="195" x2="55" y2="180" />
    <line x1="70" y1="185" x2="70" y2="170" />
    <line x1="185" y1="190" x2="185" y2="175" />
    <line x1="200" y1="180" x2="200" y2="165" />
    <line x1="215" y1="195" x2="215" y2="180" />
    <line x1="225" y1="185" x2="225" y2="170" />
  </g>

  <!-- Modern Agricultural Tech: Smart Autonomous Farming Drone flying above -->
  <g transform="translate(95, 75)">
    <!-- Drone Body -->
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="#38bdf8" />
    <circle cx="0" cy="0" r="3" fill="#f43f5e" />
    <!-- Rotors & Arms -->
    <line x1="-10" y1="-3" x2="-18" y2="-8" stroke="#64748b" stroke-width="2" />
    <line x1="10" y1="-3" x2="18" y2="-8" stroke="#64748b" stroke-width="2" />
    <line x1="-10" y1="3" x2="-18" y2="8" stroke="#64748b" stroke-width="2" />
    <line x1="10" y1="3" x2="18" y2="8" stroke="#64748b" stroke-width="2" />
    <ellipse cx="-18" cy="-8" rx="8" ry="1.5" fill="#94a3b8" opacity="0.8" />
    <ellipse cx="18" cy="-8" rx="8" ry="1.5" fill="#94a3b8" opacity="0.8" />
    <ellipse cx="-18" cy="8" rx="8" ry="1.5" fill="#94a3b8" opacity="0.8" />
    <ellipse cx="18" cy="8" rx="8" ry="1.5" fill="#94a3b8" opacity="0.8" />
    <!-- Scanning Light Beam -->
    <polygon points="-4,3 4,3 15,45 -15,45" fill="#38bdf8" opacity="0.2" />
  </g>

  <!-- CHARACTER: Proud Modern Farmer Inspecting the Abundant Harvest -->
  <g transform="translate(130, 140)">
    <!-- Farmer Shadow -->
    <ellipse cx="-15" cy="82" rx="25" ry="6" fill="#0f172a" opacity="0.4" />

    <!-- Body / Torso (Blue Overalls / Jacket) -->
    <path d="M -30 45 L -5 45 L -2 75 L -32 75 Z" fill="#2563eb" />
    <rect x="-26" y="48" width="16" height="18" rx="3" fill="#60a5fa" /> <!-- Overalls pocket -->

    <!-- Head & Cap -->
    <circle cx="-16" cy="22" r="11" fill="#fde047" /> <!-- Face -->
    <!-- Cap -->
    <path d="M -30 18 C -30 12, -2 12, -2 18 Z" fill="#1d4ed8" />
    <path d="M -32 18 L -4 18 L 2 21 L -30 21 Z" fill="#1e40af" /> <!-- Visor -->

    <!-- Smiling Expression -->
    <path d="M -20 25 Q -16 28, -12 25" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <circle cx="-19" cy="22" r="1.2" fill="#b45309" />
    <circle cx="-13" cy="22" r="1.2" fill="#b45309" />

    <!-- Arms & Interactive Gesture (Holding tablet/scanner showing field data) -->
    <!-- Back Arm -->
    <path d="M -28 48 L -40 60 L -35 65" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Front Arm holding digital tablet -->
    <path d="M -8 48 L 8 58" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    
    <!-- Tablet Device -->
    <g transform="translate(5, 52) rotate(15)">
      <rect x="0" y="0" width="18" height="12" rx="2" fill="#0f172a" />
      <rect x="2" y="2" width="14" height="8" rx="1" fill="#38bdf8" />
      <!-- Data graph lines on screen -->
      <polyline points="4,8 7,5 10,7 14,4" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" />
    </g>

    <!-- Legs -->
    <rect x="-26" y="75" width="8" height="22" rx="3" fill="#1e293b" />
    <rect x="-12" y="75" width="8" height="22" rx="3" fill="#1e293b" />
  </g>

  <!-- Context Prop: Basket of Golden Wheat / Harvest Yield in Foreground -->
  <g transform="translate(45, 185)">
    <!-- Basket Shadow -->
    <ellipse cx="20" cy="22" rx="18" ry="5" fill="#0f172a" opacity="0.3" />
    <!-- Woven Basket -->
    <path d="M 5 5 L 35 5 L 30 22 C 30 22, 20 25, 10 22 Z" fill="#b45309" />
    <path d="M 8 10 L 32 10" stroke="#78350f" stroke-width="1.5" />
    <path d="M 10 16 L 30 16" stroke="#78350f" stroke-width="1.5" />
    <!-- Wheat bundles overflowing -->
    <circle cx="20" cy="2" r="12" fill="#f59e0b" />
    <circle cx="12" cy="0" r="8" fill="#fbbf24" />
    <circle cx="28" cy="1" r="9" fill="#d97706" />
    <!-- Stems sticking out -->
    <line x1="15" y1="-8" x2="12" y2="-15" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="-9" x2="25" y2="-17" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="-8" x2="19" y2="-18" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Decorative environmental highlights (Birds in the sky) -->
  <path d="M 50 40 Q 55 35, 60 40 Q 65 35, 70 40" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" />
  <path d="M 68 50 Q 72 46, 76 50 Q 80 46, 84 50" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5" />

  <!-- Outer Frame Stroke for clean container look -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" />
</svg>