<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Chair for the elderly person -->
  <path d="M60,160 L60,110 Q60,100 70,100 L110,100 Q120,100 120,110 L120,160" fill="#2D333B" />
  <rect x="55" y="155" width="80" height="15" rx="4" fill="#2D333B"/>
  
  <!-- Elderly Person (Sitting) -->
  <circle cx="90" cy="85" r="12" fill="#FBD38D"/> <!-- Head -->
  <path d="M90,73 Q80,73 78,85 Q78,95 90,95 Q102,95 102,85 Q100,73 90,73" fill="#E2E8F0"/> <!-- Hair -->
  <path d="M75,97 Q90,97 105,97 L115,155 L65,155 Z" fill="#4A5568"/> <!-- Torso -->
  
  <!-- The Blanket (The focal point of care) -->
  <path d="M65,135 Q95,125 125,135 L135,185 Q100,195 65,185 Z" fill="#F6AD55"/> <!-- Main blanket -->
  <path d="M65,135 Q95,125 125,135 L128,145 Q95,135 65,145 Z" fill="#DD6B20" opacity="0.3"/> <!-- Fold detail -->

  <!-- Caregiver (Standing and leaning in) -->
  <circle cx="155" cy="75" r="12" fill="#FBD38D"/> <!-- Head -->
  <path d="M155,63 Q145,63 143,75 Q143,85 155,85 Q167,85 167,75 Q165,63 155,63" fill="#2D3748"/> <!-- Hair -->
  <path d="M155,87 Q175,87 185,110 L170,180 L140,180 L135,110 Z" fill="#4FD1C5"/> <!-- Torso leaning -->
  
  <!-- Caregiver's Arms and Hands (Performing the meticulous action) -->
  <path d="M145,105 Q125,115 115,132" stroke="#FBD38D" stroke-width="6" fill="none" stroke-linecap="round"/> <!-- Left arm -->
  <path d="M155,105 Q140,120 130,135" stroke="#FBD38D" stroke-width="6" fill="none" stroke-linecap="round"/> <!-- Right arm -->
  
  <!-- Hands tucking the blanket edge -->
  <circle cx="115" cy="132" r="4" fill="#FBD38D"/>
  <circle cx="130" cy="135" r="4" fill="#FBD38D"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="205" rx="70" ry="8" fill="#000000" opacity="0.2"/>
</svg>