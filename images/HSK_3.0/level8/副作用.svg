<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main Pill Object -->
  <g transform="translate(120, 120)">
    <!-- Primary Effect (Main Pill) -->
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#FFB84D"/>
    <rect x="-60" y="-20" width="60" height="40" rx="20" fill="#FF9F1A"/>
    
    <!-- Side Effect (Smaller secondary pill/fragment) -->
    <g transform="translate(40, 50)">
      <circle cx="0" cy="0" r="12" fill="#FF5252"/>
      <circle cx="0" cy="0" r="6" fill="#FF8A80"/>
    </g>
    
    <!-- Connection/Trajectory lines -->
    <path d="M 20 0 Q 30 20 40 40" stroke="#FF5252" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
    
    <!-- Subtle body silhouette outline for context -->
    <path d="M -80 80 Q -40 120 0 80 Q 40 120 80 80" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>