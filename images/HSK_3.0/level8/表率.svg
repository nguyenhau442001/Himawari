<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle lighting glow behind central character -->
  <circle cx="120" cy="125" r="75" fill="#2D323E" opacity="0.4"/>

  <!-- Leader / Role Model Figure (Center) -->
  <!-- Body/Suit -->
  <path d="M90 180 L90 150 C90 135 102 125 120 125 C138 125 150 135 150 150 L150 180 Z" fill="#2E4057"/>
  <!-- Shirt collar & tie -->
  <path d="M110 125 L120 145 L130 125 Z" fill="#E2E8F0"/>
  <polygon points="117,138 123,138 122,165 118,165" fill="#F59E0B"/>
  
  <!-- Head -->
  <circle cx="120" cy="100" r="18" fill="#FBBF24"/>
  <!-- Hair -->
  <path d="M102 98 C102 85 110 82 120 82 C130 82 138 85 138 98 Z" fill="#1E293B"/>

  <!-- Confident outstretched arm leading the way -->
  <path d="M145 135 L180 115 L185 125 L155 148 Z" fill="#FBBF24"/>
  
  <!-- Directional Forward Motion Indicators (Golden Arrow/Path) -->
  <path d="M 60 170 Q 120 195 190 170" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  
  <!-- Following Figures (Younger Comrades/Observers) to the left, smaller & looking up to the leader -->
  <!-- Follower 1 -->
  <circle cx="65" cy="115" r="12" fill="#94A3B8"/>
  <path d="M50 155 L50 135 C50 127 57 122 65 122 C73 122 80 127 80 135 L80 155 Z" fill="#334155"/>

  <!-- Follower 2 -->
  <circle cx="38" cy="130" r="10" fill="#64748B"/>
  <path d="M26 165 L26 148 C26 142 32 138 38 138 C44 138 50 142 50 148 L50 165 Z" fill="#1E293B"/>

  <!-- Spotlight/Beacon Beam symbolizing "Leading the way / Role Model" -->
  <path d="M120 40 L80 185 L160 185 Z" fill="#F59E0B" opacity="0.08"/>
  
  <!-- Bright Beacon Star at top (Symbol of exemplary standard) -->
  <path d="M120 45 L124 55 L134 57 L126 64 L128 74 L120 69 L112 74 L114 64 L106 57 L116 55 Z" fill="#F59E0B"/>
</svg>