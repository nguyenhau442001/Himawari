<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing balance/harmony -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.05"/>
  
  <!-- Scale / Balance Beam Base -->
  <path d="M100 190 L140 190 L130 160 L110 160 Z" fill="#4A5568"/>
  <rect x="116" y="105" width="8" height="65" rx="2" fill="#718096"/>
  
  <!-- Fulcrum (Pivot point) -->
  <circle cx="120" cy="105" r="10" fill="#FFB703"/>
  <circle cx="120" cy="105" r="4" fill="#1A1D24"/>
  
  <!-- Balance Beam (Tilted slightly to show active balancing action) -->
  <g transform="rotate(-6 120 105)">
    <rect x="50" y="101" width="140" height="8" rx="3" fill="#E2E8F0"/>
    
    <!-- Left Chain & Pan -->
    <path d="M 60 109 L 60 145" stroke="#718096" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M 90 109 L 90 145" stroke="#718096" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M 50 145 Q 75 165 100 145 Z" fill="#CBD5E0"/>
    <!-- Left Element (Representing one side of a conflict/contradiction) -->
    <circle cx="75" cy="138" r="12" fill="#EF4444" opacity="0.85"/>
    <path d="M69 132 L81 144 M81 132 L69 144" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Chain & Pan -->
    <path d="M 150 109 L 150 145" stroke="#718096" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M 180 109 L 180 145" stroke="#718096" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M 140 145 Q 165 165 190 145 Z" fill="#CBD5E0"/>
    <!-- Right Element (Representing the opposing side) -->
    <rect x="157" y="126" width="18" height="18" rx="3" fill="#3B82F6" opacity="0.85"/>
    <path d="M162 135 L172 135" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Central Harmonizing Element (The "调和" mediator/agent object floating above) -->
  <g transform="translate(120, 65)">
    <!-- Glowing aura -->
    <circle cx="0" cy="0" r="22" fill="#FFB703" opacity="0.2"/>
    <!-- Core Mediation Token / Harmonizer -->
    <circle cx="0" cy="0" r="16" fill="#FFB703"/>
    <!-- Check / Harmony Icon -->
    <path d="M-6 0 L-2 4 L7 -5" fill="none" stroke="#1A1D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle connecting wave lines representing resolution and blending -->
  <path d="M 85 85 Q 120 50 155 85" fill="none" stroke="#FFB703" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
</svg>