<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Book / Cover Graphic Representation -->
  <!-- Back cover / pages depth -->
  <path d="M75 75 L155 65 L155 175 L75 185 Z" fill="#2D323E" rx="4"/>
  <path d="M79 81 L151 71 L151 169 L79 179 Z" fill="#363C4A"/>

  <!-- Main Front Cover (The "封面") -->
  <g>
    <!-- Cover shadow for depth -->
    <path d="M65 70 L145 55 L145 180 L65 195 Z" fill="#0E1015" opacity="0.3"/>
    
    <!-- Cover Base -->
    <path d="M63 68 L143 53 L143 182 L63 197 Z" fill="#2E4A78" stroke="#41629B" stroke-width="1.5"/>
    
    <!-- Spine highlight / gradient effect -->
    <path d="M63 68 L73 66 L73 195 L63 197 Z" fill="#1F3456"/>

    <!-- Artistic Design Elements on the Cover (representing exquisite book cover design) -->
    <!-- Golden Accent Geometric Art -->
    <circle cx="103" cy="110" r="22" fill="none" stroke="#F4B942" stroke-width="2.5"/>
    <path d="M103 82 L103 138 M75 110 L131 110" stroke="#F4B942" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Abstract layout blocks on cover -->
    <rect x="85" y="145" width="36" height="5" rx="2" fill="#E2E8F0"/>
    <rect x="92" y="154" width="22" height="3" rx="1" fill="#8E9CAA"/>

    <!-- Star / Sparkle accent (attracting attention) -->
    <path d="M128 78 L131 87 L140 90 L131 93 L128 102 L125 93 L116 90 L125 87 Z" fill="#F4B942"/>
  </g>

  <!-- Interactive/Focus Elements (Highlighting the "front") -->
  <!-- Subtle framing or pointer indicating "Front Cover" -->
  <path d="M50 132 C 55 120, 55 100, 63 80" fill="none" stroke="#F4B942" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>
  <polygon points="63,75 58,84 68,84" fill="#F4B942"/>
</svg>