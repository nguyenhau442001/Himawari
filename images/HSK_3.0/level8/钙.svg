<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background aura for calcium/bone focus -->
  <circle cx="120" cy="120" r="70" fill="#3A4A6B" opacity="0.15" filter="blur(10px)"/>

  <!-- Stylized Modern Bone Structure (Representing Calcium) -->
  <g transform="translate(120, 115)">
    <!-- Bone Shadow / Depth -->
    <path d="M -45,-35 C -65,-35 -75,-20 -75,0 C -75,20 -65,35 -45,35 L 45,35 C 65,35 75,20 75,0 C 75,-20 65,-35 45,-35 Z" fill="#252A34" transform="translate(0, 4)"/>
    
    <!-- Main Bone Body -->
    <path d="M -45,-35 C -65,-35 -75,-20 -75,0 C -75,20 -65,35 -45,35 L 45,35 C 65,35 75,20 75,0 C 75,-20 65,-35 45,-35 Z" fill="#EAEFF8"/>
    
    <!-- Bone Inner Hollow/Core (Stylized clean cutout) -->
    <path d="M -30,-18 C -40,-18 -45,-10 -45,0 C -45,10 -40,18 -30,18 L 30,18 C 40,18 45,10 45,0 C 45,-10 40,-18 30,-18 Z" fill="#1A1D24"/>
  </g>

  <!-- Golden Accent Sparkles / Atomic Structure cues (Representing Mineralization / Strength) -->
  <g fill="#F39C12">
    <!-- Top-Right Sparkle -->
    <path d="M 165,65 Q 175,65 175,55 Q 175,65 185,65 Q 175,65 175,75 Q 175,65 165,65 Z"/>
    
    <!-- Bottom-Left Sparkle -->
    <path d="M 55,165 Q 65,165 65,155 Q 65,165 75,165 Q 65,165 65,175 Q 65,165 55,165 Z"/>
    
    <!-- Small Accent Dot -->
    <circle cx="155" cy="145" r="3" opacity="0.8"/>
    <circle cx="85" cy="85" r="2" opacity="0.6"/>
  </g>

  <!-- Modern Chemical Hexagon Ring Overlay (Subtle, professional science motif) -->
  <path d="M 120,45 L 146,60 L 146,90 L 120,105 L 94,90 L 94,60 Z" fill="none" stroke="#3A4A6B" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.4"/>
</svg>