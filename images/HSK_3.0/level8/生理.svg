<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle glow/ring -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Central Icon Graphic representing 生理 (Biological/Physiological system: abstract human torso with heartbeat/DNA or vital life symbol) -->
  
  <!-- Outer pulse ring -->
  <circle cx="120" cy="120" r="54" fill="#252B3B"/>

  <!-- Human Silhouette (Minimalist, sleek, neutral) -->
  <path d="M120 78 C112 78 106 84 106 92 C106 100 112 106 120 106 C128 106 134 100 134 92 C134 84 128 78 120 78 Z" fill="#4B5563"/>
  <path d="M96 148 C96 126 106 116 120 116 C134 116 144 126 144 148 L144 162 L96 162 Z" fill="#4B5563"/>

  <!-- Vital organs / Heart / DNA helix accent (representing biological life) -->
  <circle cx="120" cy="138" r="16" fill="#1A1D24"/>
  
  <!-- Heartbeat ECG line in glowing orange/gold -->
  <path d="M96 138 H110 L115 126 L121 150 L126 134 L131 138 H144" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating biological / medical nodes (flat modern vector dots) -->
  <circle cx="82" cy="95" r="4" fill="#3B82F6"/>
  <circle cx="158" cy="95" r="4" fill="#10B981"/>
  <circle cx="150" cy="160" r="3" fill="#F59E0B"/>
  <circle cx="90" cy="160" r="3" fill="#3B82F6"/>

  <!-- Connection lines -->
  <path d="M86 95 H106" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M134 95 H154" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>