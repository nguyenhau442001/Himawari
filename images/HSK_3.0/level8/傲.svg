<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="205" rx="55" ry="10" fill="#111317" opacity="0.6"/>

  <!-- Character representing "Ao" (Arrogance/Prideful posture) -->
  <g transform="translate(0, 10)">
    <!-- Back leg (bent slightly, planted firmly) -->
    <path d="M 105 140 L 95 185 L 110 188 L 120 145 Z" fill="#3E4451"/>
    
    <!-- Front leg (stepped forward, confident stance) -->
    <path d="M 125 140 L 140 185 L 155 182 L 138 140 Z" fill="#4F5666"/>
    
    <!-- Shoes -->
    <path d="M 92 187 C 90 185, 95 183, 112 185 L 112 190 L 92 190 Z" fill="#FFB454"/>
    <path d="M 138 183 C 150 182, 158 184, 158 188 L 138 188 Z" fill="#FFB454"/>

    <!-- Torso (leaning slightly back with haughty posture) -->
    <path d="M 98 90 L 145 95 L 135 145 L 102 140 Z" fill="#2E323D"/>
    
    <!-- Stylish Jacket / Collar details with high-contrast accent -->
    <path d="M 115 92 L 130 93 L 125 125 L 115 120 Z" fill="#FFB454" opacity="0.9"/>
    <path d="M 108 91 L 118 92 L 120 115 L 110 110 Z" fill="#FFA114"/>

    <!-- Head (tilted upward to symbolize looking down on others) -->
    <circle cx="125" cy="65" r="22" fill="#F0C6A5"/>
    
    <!-- Hair (modern, swept up/back) -->
    <path d="M 105 60 C 105 45, 120 42, 135 48 C 145 52, 148 62, 148 62 C 148 62, 140 50, 125 48 C 112 46, 105 55, 105 60 Z" fill="#FFA114"/>

    <!-- Facial expression: Smug, eyes closed or half-closed looking down, smirk -->
    <!-- Smug smirk line -->
    <path d="M 128 73 C 132 73, 135 75, 137 78" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Closed haughty eye (curved upward) -->
    <path d="M 130 62 C 133 60, 137 60, 140 63" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Nose bridge -->
    <path d="M 134 62 L 138 68 L 135 70" stroke="#E2B196" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Crossed Arms (Classic defensive/superiority body language) -->
    <!-- Back arm -->
    <path d="M 110 95 C 100 100, 95 115, 115 125 L 135 110 Z" fill="#3E4451"/>
    <!-- Front arm (crossed securely) -->
    <path d="M 142 98 C 145 110, 135 125, 110 120 L 105 110 C 125 112, 135 105, 132 95 Z" fill="#4F5666"/>
    <!-- Hand tucked under elbow -->
    <circle cx="107" cy="115" r="7" fill="#F0C6A5"/>
  </g>

  <!-- Golden accent halo / abstract structural lines to emphasize the elevated ego -->
  <path d="M 80 45 L 90 35" stroke="#FFA114" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 160 45 L 150 35" stroke="#FFA114" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="125" cy="40" r="2" fill="#FFA114" opacity="0.8"/>
  
  <!-- Subtle upward geometric vector rays framing the subject -->
  <path d="M 75 120 L 60 110" stroke="#FFA114" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M 175 120 L 190 110" stroke="#FFA114" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>