<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central complex knot structure representing entanglement -->
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <!-- Main tangled paths -->
    <path d="M60 180 C 80 180, 90 150, 120 120 C 150 90, 160 60, 180 60" stroke="#FFB84D" fill="none"/>
    <path d="M180 180 C 160 180, 150 150, 120 120 C 90 90, 80 60, 60 60" stroke="#4D94FF" fill="none"/>
    <path d="M60 60 C 100 60, 120 100, 120 120 C 120 140, 140 180, 180 180" stroke="#FF6B6B" stroke-dasharray="8 8" fill="none"/>
    <path d="M180 60 C 140 60, 120 100, 120 120 C 120 140, 100 180, 60 180" stroke="#84FF4D" stroke-dasharray="8 8" fill="none"/>
  </g>

  <!-- Nodes representing the "many parties/interests" involved -->
  <circle cx="60" cy="60" r="8" fill="#FFB84D"/>
  <circle cx="180" cy="60" r="8" fill="#4D94FF"/>
  <circle cx="60" cy="180" r="8" fill="#FF6B6B"/>
  <circle cx="180" cy="180" r="8" fill="#84FF4D"/>
  
  <!-- Central point of complexity -->
  <circle cx="120" cy="120" r="12" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="120" cy="120" r="6" fill="#FFFFFF"/>
</svg>