<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Bonus Glow / Envelope Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / OFFICE INTERIOR -->
  <!-- Wall panels & architecture -->
  <rect x="20" y="20" width="200" height="135" rx="4" fill="#1b263b" />
  
  <!-- Window showing winter/end-of-year cityscape silhouette -->
  <path d="M 160 35 L 205 35 L 205 110 L 160 110 Z" fill="url(#window-glow)" />
  <rect x="160" y="35" width="45" height="75" fill="none" stroke="#334155" stroke-width="2" />
  <!-- City skyline through window -->
  <rect x="168" y="70" width="8" height="40" fill="#283548" />
  <rect x="178" y="55" width="10" height="55" fill="#283548" />
  <rect x="190" y="80" width="11" height="30" fill="#283548" />
  <circle cx="172" cy="62" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="182" cy="48" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="195" cy="72" r="1.5" fill="#fde047" opacity="0.8" />

  <!-- Wall Calendar (showing December / End of Year) -->
  <rect x="35" y="35" width="30" height="35" rx="3" fill="#cbd5e1" />
  <rect x="35" y="35" width="30" height="10" rx="3" fill="#ef4444" />
  <circle cx="43" cy="33" r="2" fill="#94a3b8" />
  <circle cx="57" cy="33" r="2" fill="#94a3b8" />
  <!-- Mini calendar grid dots -->
  <circle cx="42" cy="52" r="1.5" fill="#64748b" />
  <circle cx="50" cy="52" r="1.5" fill="#64748b" />
  <circle cx="58" cy="52" r="1.5" fill="#ef4444" />
  <circle cx="42" cy="60" r="1.5" fill="#64748b" />
  <circle cx="50" cy="60" r="1.5" fill="#64748b" />
  <circle cx="58" cy="60" r="1.5" fill="#64748b" />

  <!-- Office Plant -->
  <path d="M 215 135 C 215 120 225 110 225 110 C 225 110 235 120 235 135 Z" fill="#10b981" />
  <path d="M 220 135 C 210 125 210 115 210 115 C 210 115 215 125 220 135 Z" fill="#34d399" />
  <path d="M 230 135 C 240 125 240 115 240 115 C 240 115 235 125 230 135 Z" fill="#059669" />
  <path d="M 218 135 L 232 135 L 230 150 L 220 150 Z" fill="#b45309" rx="2" />

  <!-- Bookshelf / Folders in background -->
  <rect x="75" y="45" width="12" height="25" rx="2" fill="#3b82f6" />
  <rect x="89" y="42" width="12" height="28" rx="2" fill="#10b981" />
  <rect x="103" y="48" width="10" height="22" rx="2" fill="#f59e0b" />

  <!-- MAIN DESK -->
  <rect x="10" y="150" width="220" height="12" rx="3" fill="url(#desk-grad)" />
  <rect x="25" y="162" width="15" height="58" fill="#0f172a" />
  <rect x="200" y="162" width="15" height="58" fill="#0f172a" />

  <!-- DESK PROPS -->
  <!-- Laptop -->
  <path d="M 125 150 L 165 150 L 170 135 L 120 135 Z" fill="#64748b" />
  <rect x="122" y="132" width="46" height="2" fill="#94a3b8" rx="1" />
  <!-- Laptop Screen Graphic (Pie chart showing company profits) -->
  <rect x="125" y="105" width="40" height="30" rx="2" fill="#0f172a" />
  <circle cx="145" cy="120" r="9" fill="#38bdf8" />
  <path d="M 145 120 L 152 113 A 10 10 0 0 1 154 125 Z" fill="#f59e0b" />
  <path d="M 145 120 L 154 125 A 10 10 0 0 1 138 127 Z" fill="#10b981" />

  <!-- Coffee Mug -->
  <rect x="185" y="133" width="12" height="17" rx="2" fill="#f8fafc" />
  <path d="M 197 137 C 202 137 202 145 197 147" stroke="#f8fafc" stroke-width="2" fill="none" />

  <!-- MAIN CHARACTERS (Boss and Employee sharing profit bonus) -->

  <!-- BOSS (Standing, handing over the bonus) -->
  <!-- Boss Body / Suit -->
  <path d="M 65 110 L 95 110 L 100 150 L 60 150 Z" fill="#1e3a8a" />
  <!-- Boss Shirt & Tie -->
  <path d="M 75 110 L 85 110 L 83 135 L 77 135 Z" fill="#ffffff" />
  <polygon points="80,118 82,130 78,130" fill="#ef4444" />
  <!-- Boss Head & Hair -->
  <circle cx="80" cy="85" r="14" fill="#fbcfe8" />
  <path d="M 67 83 C 67 73 93 73 93 83 C 90 78 70 78 67 83 Z" fill="#334155" />
  <!-- Boss Face Expression (Smiling proudly) -->
  <path d="M 75 88 Q 80 93 85 88" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="75" cy="83" r="1.5" fill="#334155" />
  <circle cx="85" cy="83" r="1.5" fill="#334155" />

  <!-- Boss Arms & Hand holding Red Packet / Bonus -->
  <path d="M 68 115 L 105 130 L 102 138 L 70 123 Z" fill="#1e3a8a" />
  <circle cx="107" cy="132" r="5" fill="#fbcfe8" />

  <!-- EMPLOYEE (Seated, receiving the profit bonus with joy) -->
  <!-- Employee Body -->
  <path d="M 135 115 L 165 115 L 170 150 L 130 150 Z" fill="#0d9488" />
  <path d="M 145 115 L 155 115 L 153 135 L 147 135 Z" fill="#f8fafc" />
  <!-- Employee Head & Hair -->
  <circle cx="150" cy="90" r="14" fill="#fed7aa" />
  <path d="M 136 88 C 136 76 164 76 164 88 C 160 80 140 80 136 88 Z" fill="#78350f" />
  <!-- Employee Expression (Excited/Happy) -->
  <path d="M 144 92 Q 150 98 156 92" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="144" cy="88" r="1.5" fill="#78350f" />
  <circle cx="156" cy="88" r="1.5" fill="#78350f" />
  <path d="M 142 84 C 144 82 147 84 147 84" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 153 84 C 155 82 158 84 158 84" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />

  <!-- Employee Arms reaching out -->
  <path d="M 138 120 L 115 132 L 118 140 L 142 128 Z" fill="#0d9488" />
  <circle cx="113" cy="134" r="5" fill="#fed7aa" />

  <!-- CENTRAL FOCUS: THE PROFIT SHARING BONUS (Red Envelope & Gold Coins) -->
  <!-- Red Envelope (Bao Xi / Bonus Packet) -->
  <g transform="translate(100, 120) rotate(-15)">
    <rect x="0" y="0" width="22" height="32" rx="3" fill="#dc2626" stroke="#b91c1c" stroke-width="1" />
    <!-- Gold accent on envelope -->
    <rect x="3" y="10" width="16" height="12" rx="1" fill="#f59e0b" opacity="0.8" />
    <circle cx="11" cy="16" r="3" fill="#fef08a" />
  </g>

  <!-- Sparkling Gold Coins Bursting Out (Representing "Fenhong" / Dividend Distribution) -->
  <circle cx="115" cy="115" r="7" fill="url(#coin-grad)" stroke="#b45309" stroke-width="1" />
  <text x="115" y="118" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>

  <circle cx="95" cy="105" r="5" fill="url(#coin-grad)" stroke="#b45309" stroke-width="1" />
  <circle cx="125" cy="98" r="6" fill="url(#coin-grad)" stroke="#b45309" stroke-width="1" />
  <circle cx="105" cy="92" r="4.5" fill="url(#coin-grad)" stroke="#b45309" stroke-width="1" />

  <!-- Sparkle Effects / Celebration Stars -->
  <path d="M 90 85 L 93 90 L 98 90 L 94 93 L 95 98 L 90 95 L 85 98 L 86 93 L 82 90 L 87 90 Z" fill="#fde047" opacity="0.9" transform="scale(0.5) translate(100, 130)" />
  <path d="M 130 100 L 132 104 L 136 104 L 133 106 L 134 110 L 130 108 L 126 110 L 127 106 L 124 104 L 128 104 Z" fill="#fde047" opacity="0.9" transform="scale(0.6) translate(80, 50)" />
</svg>