<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Main head and neck shape -->
  <path d="M 120 195 L 95 195 C 80 190 70 170 70 150 C 70 100 80 70 120 55 C 160 70 170 100 170 150 C 170 170 160 190 145 195 L 120 195 Z" fill="#FFDAB9"/>

  <!-- Ears -->
  <rect x="60" y="105" width="10" height="30" rx="5" fill="#FFDAB9"/>
  <rect x="170" y="105" width="10" height="30" rx="5" fill="#FFDAB9"/>

  <!-- Facial features -->
  <circle cx="105" cy="105" r="5" fill="#333333"/> <!-- Left eye -->
  <circle cx="135" cy="105" r="5" fill="#333333"/> <!-- Right eye -->
  <path d="M 110 145 Q 120 155 130 145" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round"/> <!-- Mouth -->

  <!-- Subtle highlight on bald head -->
