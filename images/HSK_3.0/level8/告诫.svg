<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Accent Warm Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Teacher Coat Gradient -->
    <linearGradient id="teacherCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Blackboard Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Classroom Interior Background -->
  <!-- Back Wall -->
  <rect x="15" y="15" width="210" height="160" rx="4" fill="#1e293b"/>
  
  <!-- Blackboard with wooden frame -->
  <rect x="70" y="30" width="140" height="75" rx="3" fill="#b45309"/>
  <rect x="73" y="33" width="134" height="69" rx="2" fill="url(#boardGrad)"/>
  <!-- Abstract chalk drawings/diagrams (math/science curves, no letters) -->
  <path d="M 85 75 Q 95 50 110 75 T 135 65" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="160" cy="55" r="12" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <line x1="150" y1="75" x2="170" y2="75" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>

  <!-- Bookshelf on the left wall -->
  <rect x="25" y="35" width="32" height="85" fill="#334155" rx="2"/>
  <line x1="25" y1="60" x2="57" y2="60" stroke="#1e293b" stroke-width="2"/>
  <line x1="25" y1="85" x2="57" y2="85" stroke="#1e293b" stroke-width="2"/>
  <line x1="25" y1="110" x2="57" y2="110" stroke="#1e293b" stroke-width="2"/>
  <!-- Colorful books -->
  <rect x="29" y="42" width="6" height="18" fill="#f59e0b" rx="1"/>
  <rect x="37" y="40" width="7" height="20" fill="#38bdf8" rx="1"/>
  <rect x="47" y="44" width="6" height="16" fill="#ec4899" rx="1"/>
  <rect x="30" y="68" width="8" height="17" fill="#10b981" rx="1"/>
  <rect x="40" y="66" width="6" height="19" fill="#fb923c" rx="1"/>

  <!-- Floor -->
  <polygon points="15,175 225,175 235,225 5,225" fill="#0f172a"/>
  <!-- Floor wood plank lines -->
  <line x1="40" y1="175" x2="20" y2="225" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="175" x2="80" y2="225" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="175" x2="160" y2="225" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="175" x2="215" y2="225" stroke="#1e293b" stroke-width="1" opacity="0.5"/>

  <!-- Warm Lamp Light Effect from above -->
  <circle cx="140" cy="15" r="70" fill="url(#lampGlow)"/>

  <!-- Student Desk & Student Character (Foreground Right) -->
  <!-- Wooden Desk -->
  <path d="M 140,155 L 210,155 L 220,185 L 135,185 Z" fill="#b45309"/>
  <path d="M 137,155 L 213,155 L 213,160 L 137,160 Z" fill="#d97706"/>
  <rect x="145" y="185" width="8" height="35" fill="#78350f"/>
  <rect x="200" y="185" width="8" height="35" fill="#78350f"/>
  <!-- Props on Student Desk: Open Notebook & Pencil -->
  <rect x="160" y="162" width="35" height="22" rx="2" fill="#f8fafc"/>
  <line x1="165" y1="168" x2="185" y2="168" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="165" y1="173" x2="190" y2="173" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="165" y1="178" x2="180" y2="178" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="195" y1="165" x2="205" y2="178" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Student Character (Sitting, attentive, looking at teacher) -->
  <!-- Body/Hoodie -->
  <path d="M 155,145 C 155,130 168,120 185,120 C 202,120 215,130 215,145 L 215,180 L 155,180 Z" fill="#38bdf8"/>
  <path d="M 185,125 C 175,125 170,132 170,140 L 200,140 C 200,132 195,125 185,125 Z" fill="#0284c7"/>
  <!-- Head & Hair -->
  <circle cx="185" cy="105" r="16" fill="#fbcfe8"/>
  <path d="M 169,105 C 169,94 178,90 185,90 C 195,90 202,96 201,108 C 195,103 190,103 182,107 C 177,110 171,108 169,105 Z" fill="#334155"/>
  <!-- Attentive Face (Profile/Semi-profile looking left) -->
  <circle cx="178" cy="106" r="1.5" fill="#1e293b"/>
  <!-- Hand resting on chin/desk showing earnest listening -->
  <path d="M 165,145 Q 160,135 170,130 Q 175,135 172,145 Z" fill="#fbcfe8"/>

  <!-- Teacher Character (Standing Left, gesturing thoughtfully/authoritatively - "告诫") -->
  <!-- Teacher Legs & Shoes -->
  <rect x="75" y="165" width="10" height="55" fill="#1e293b"/>
  <rect x="95" y="165" width="10" height="55" fill="#1e293b"/>
  <ellipse cx="80" cy="220" rx="8" ry="3" fill="#0f172a"/>
  <ellipse cx="100" cy="220" rx="8" ry="3" fill="#0f172a"/>

  <!-- Teacher Torso / Suit & Tie -->
  <path d="M 65,115 L 115,115 L 120,170 L 60,170 Z" fill="url(#teacherCoat)"/>
  <!-- Inner shirt & Red/Dark Tie -->
  <polygon points="82,115 98,115 90,135" fill="#f8fafc"/>
  <polygon points="88,122 92,122 93,145 90,152 87,145" fill="#ef4444"/>
  <!-- Coat Lapels -->
  <path d="M 82,115 L 70,145 L 82,145 Z" fill="#334155"/>
  <path d="M 98,115 L 110,145 L 98,145 Z" fill="#334155"/>

  <!-- Teacher Head & Hair -->
  <circle cx="90" cy="85" r="17" fill="#fde047"/> <!-- warm skin tone base -->
  <path d="M 73,85 C 73,73 80,68 90,68 C 102,68 108,74 107,88 C 102,84 97,84 90,86 C 81,89 75,87 73,85 Z" fill="#475569"/> <!-- neat educator hair -->
  
  <!-- Wise, Expressive Face (Speaking / Warning expression) -->
  <!-- Glasses -->
  <rect x="79" y="80" width="10" height="7" rx="1" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
  <rect x="91" y="80" width="10" height="7" rx="1" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
  <line x1="89" y1="83" x2="91" y2="83" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Focused Serious Eyes -->
  <circle cx="84" cy="83.5" r="1.2" fill="#1e293b"/>
  <circle cx="96" cy="83.5" r="1.2" fill="#1e293b"/>
  <!-- Earnest/Talking Mouth -->
  <path d="M 87,93 Q 90,96 93,93" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Teacher Arms & Gestures (Crucial for "告诫" / Warning / Advising pose) -->
  <!-- Left Arm (Raised, pointing index finger forward with emphasis) -->
  <path d="M 68,120 Q 50,110 45,95 Q 43,90 47,88 Q 51,87 54,93 Q 60,105 75,118 Z" fill="#475569"/>
  <!-- Pointing Finger Hand -->
  <circle cx="43" cy="89" r="4" fill="#fde047"/>
  <path d="M 40,89 L 34,87 L 40,85 Z" fill="#fde047"/>

  <!-- Right Arm (Bent naturally at waist, holding a book or gesturing open) -->
  <path d="M 112,120 Q 125,130 120,145 Q 115,155 108,150 Q 105,145 110,135 Z" fill="#334155"/>
  <circle cx="120" cy="148" r="4" fill="#fde047"/>

  <!-- Visual emphasis lines / advisory aura (subtle golden warm particles near teacher's hand to signify earnest advice) -->
  <circle cx="30" cy="85" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="36" cy="75" r="1.5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="24" cy="95" r="1" fill="#fbbf24" opacity="0.6"/>

  <!-- Teacher's Desk / Lectern on the left side with a stack of textbooks -->
  <rect x="35" y="155" width="55" height="30" rx="2" fill="#b45309"/>
  <rect x="30" y="150" width="65" height="7" rx="1" fill="#d97706"/>
  <!-- Textbooks on lectern -->
  <rect x="42" y="138" width="30" height="12" rx="1" fill="#10b981"/>
  <rect x="40" y="142" width="34" height="10" rx="1" fill="#3b82f6"/>
  <rect x="44" y="134" width="26" height="8" rx="1" fill="#ec4899"/>
</svg>