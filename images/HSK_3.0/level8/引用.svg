<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Document background -->
  <rect x="60" y="50" width="120" height="140" rx="8" fill="#2D343E"/>
  
  <!-- Lines representing text -->
  <rect x="75" y="70" width="90" height="6" rx="2" fill="#4A5568"/>
  <rect x="75" y="85" width="90" height="6" rx="2" fill="#4A5568"/>
  <rect x="75" y="100" width="60" height="6" rx="2" fill="#4A5568"/>
  
  <!-- Highlighted section in the document -->
  <rect x="75" y="120" width="90" height="20" rx="4" fill="#F6AD55" fill-opacity="0.2"/>
  <rect x="80" y="125" width="80" height="3" rx="1.5" fill="#F6AD55"/>
  <rect x="80" y="133" width="50" height="3" rx="1.5" fill="#F6AD55"/>
  
  <!-- Hand moving to extract/quote -->
  <g transform="translate(130, 130)">
    <path d="M20 20 C 20 10, 30 5, 35 5 C 40 5, 50 10, 50 20 L 50 40 L 40 40 L 40 25 L 35 25 L 35 40 L 25 40 L 25 25 L 20 25 Z" fill="#E2E8F0"/>
    <path d="M35 5 C 35 0, 40 -5, 45 -5 C 50 -5, 55 0, 55 5" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Motion lines indicating extraction -->
  <path d="M160 120 L 180 100" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M165 115 L 185 95" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- The extracted quote block -->
  <rect x="160" y="40" width="60" height="40" rx="6" fill="#2D343E" stroke="#F6AD55" stroke-width="2"/>
  <rect x="170" y="55" width="40" height="4" rx="2" fill="#F6AD55"/>
  <rect x="170" y="65" width="25" height="4" rx="2" fill="#F6AD55"/>
</svg>