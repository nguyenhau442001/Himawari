<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Calm Confidence -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment: Office/Workspace Context for "Facing Difficulties" -->
  <!-- Ambient Glow Behind Subject -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)"/>

  <!-- Wall & Window Grid (Modern Office) -->
  <!-- Window Frame showing abstract storm/difficulty outside with cool blue tones -->
  <g opacity="0.4">
    <rect x="25" y="25" width="70" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Abstract rain/lightning elements representing "difficulties" outside -->
    <line x1="45" y1="45" x2="40" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="70" y1="40" x2="62" y2="75" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M55 45 L50 60 L58 60 L53 75" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Office Props -->
  <rect x="155" y="40" width="60" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="155" y1="65" x2="215" y2="65" stroke="#334155" stroke-width="1.5"/>
  <line x1="155" y1="90" x2="215" y2="90" stroke="#334155" stroke-width="1.5"/>
  <!-- Colorful books -->
  <rect x="163" y="47" width="8" height="18" rx="2" fill="#38bdf8"/>
  <rect x="173" y="45" width="12" height="20" rx="2" fill="#ef4444"/>
  <rect x="193" y="48" width="10" height="17" rx="2" fill="#10b981"/>
  <rect x="163" y="72" width="14" height="18" rx="2" fill="#f59e0b"/>
  <rect x="180" y="70" width="9" height="20" rx="2" fill="#8b5cf6"/>

  <!-- Large Office Desk -->
  <path d="M20 185 L220 185 L210 155 L30 155 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="25" y="185" width="190" height="8" rx="2" fill="#475569"/>
  <!-- Desk legs -->
  <rect x="45" y="193" width="8" height="30" fill="#1e293b"/>
  <rect x="187" y="193" width="8" height="30" fill="#1e293b"/>

  <!-- Complex Work Props on Desk (Representing Difficult Task/Error logs) -->
  <!-- Laptop with Code/Charts -->
  <g transform="translate(135, 125)">
    <!-- Laptop Base -->
    <path d="M-5 32 L55 32 L62 38 L-12 38 Z" fill="#64748b"/>
    <!-- Laptop Screen -->
    <rect x="0" y="0" width="50" height="34" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- Code lines with an error indicator (Red cross/warning representing difficulty) -->
    <line x1="6" y1="8" x2="25" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="35" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="18" y2="20" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <circle cx="40" cy="20" r="4" fill="#ef4444"/>
    <path d="M38.5 18.5 L41.5 21.5 M41.5 18.5 L38.5 21.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug with Steam (Sign of relaxed posture) -->
  <g transform="translate(45, 138)">
    <rect x="0" y="4" width="14" height="16" rx="3" fill="#cbd5e1"/>
    <path d="M14 8 C18 8, 18 16, 14 16" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Steam -->
    <path d="M4 0 C4 -3, 8 -3, 8 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M10 2 C10 -1, 14 -1, 14 -4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- MAIN CHARACTER: Calm & Collected Professional Facing Difficulty ("从容不迫") -->
  <g transform="translate(90, 85)">
    <!-- Body / Torso (Relaxed lean back posture) -->
    <!-- Chair Backrest -->
    <rect x="-15" y="10" width="46" height="65" rx="8" fill="#334155"/>
    <rect x="-10" y="15" width="36" height="55" rx="4" fill="#1e293b"/>

    <!-- Person's Torso (Professional Shirt & Vest) -->
    <path d="M-8 30 C-8 25, 20 25, 24 32 L20 70 C10 72, -4 72, -12 70 Z" fill="#3b82f6"/>
    <!-- Collar & Tie -->
    <path d="M2 30 L8 42 L2 45 L-4 42 Z" fill="#ffffff"/>
    <polygon points="2,43 5,60 2,65 -1,60" fill="#ef4444"/>

    <!-- Arms in a Calm, Confident Gesture (One hand resting comfortably, chin propped lightly or fingers steepled) -->
    <!-- Left Arm (Resting on chair/desk) -->
    <path d="M-8 35 C-25 38, -35 55, -28 65" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="-28" cy="67" r="5" fill="#fcd34d"/>

    <!-- Right Arm (Raised calmly touching chin/glasses - symbol of thoughtful composure) -->
    <path d="M20 35 C35 38, 25 55, 12 50" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <!-- Right Hand near Chin -->
    <circle cx="10" cy="46" r="5" fill="#fcd34d"/>

    <!-- Head and Face (EXPRESSING CALM / SMILING SERENELY AMIDST TROUBLE) -->
    <g transform="translate(6, 4)">
      <!-- Hair Base -->
      <path d="M-12 5 C-12 -12, 18 -12, 18 5 C18 12, 16 15, 12 16 C8 10, -2 10, -8 16 C-12 15, -12 10, -12 5 Z" fill="#1e293b"/>

      <!-- Face Skin -->
      <circle cx="2" cy="12" r="14" fill="#fcd34d"/>

      <!-- Ears -->
      <circle cx="-12" cy="13" r="3" fill="#fcd34d"/>
      <circle cx="16" cy="13" r="3" fill="#fcd34d"/>

      <!-- Glasses (Smart/Focused look) -->
      <rect x="-7" y="7" width="9" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="4" y="7" width="9" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="2" y1="10" x2="4" y2="10" stroke="#0f172a" stroke-width="1.5"/>

      <!-- Calm, Confident Eyes (Curved happily/peacefully, not stressed) -->
      <path d="M-5 10 Q-2.5 8 0 10" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M7 10 Q9.5 8 12 10" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Gentle Confident Smile (暗示从容不迫) -->
      <path d="M1 17 Q4 20 7 17" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Rosy Cheeks for warmth -->
      <circle cx="-4" cy="15" r="2.5" fill="#f87171" opacity="0.4"/>
      <circle cx="12" cy="15" r="2.5" fill="#f87171" opacity="0.4"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Subtle warm sparkles highlighting calm focus) -->
  <g fill="#fbbf24">
    <circle cx="50" cy="95" r="2" opacity="0.8"/>
    <circle cx="185" cy="105" r="1.5" opacity="0.6"/>
    <circle cx="165" cy="140" r="2.5" opacity="0.9"/>
    <!-- Star sparkle -->
    <path d="M 175 75 Q 175 80 170 80 Q 175 80 175 85 Q 175 80 180 80 Q 175 80 175 75 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M 65 60 Q 65 64 61 64 Q 65 64 65 68 Q 65 64 69 64 Q 65 64 65 60 Z" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>