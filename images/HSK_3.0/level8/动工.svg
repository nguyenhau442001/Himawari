<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background bridge structure outline indicating upcoming construction -->
  <path d="M40 140 L100 140 L120 110 L200 110" stroke="#2D333B" stroke-width="4" stroke-dasharray="6 4" fill="none"/>

  <!-- Ground foundation -->
  <path d="M20 180 L220 180 L220 195 L20 195 Z" fill="#252A33"/>
  <rect x="30" y="165" width="60" height="15" rx="3" fill="#323842"/>

  <!-- Construction Crane Structure (Physical Object representing "动工" - breaking ground / construction) -->
  <!-- Tower base & vertical mast -->
  <rect x="50" y="70" width="12" height="95" fill="#3E4451"/>
  <!-- Crane vertical truss lines -->
  <line x1="56" y1="70" x2="56" y2="165" stroke="#282C34" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Crane Jib (Boom) extending right -->
  <polygon points="56,70 200,95 200,105 56,80" fill="#F6A83B"/>
  <line x1="60" y1="75" x2="190" y2="98" stroke="#D18320" stroke-width="2"/>

  <!-- Counter-jib extending left -->
  <polygon points="50,75 25,85 25,92 50,82" fill="#E58B2E"/>
  <!-- Counterweight -->
  <rect x="20" y="85" width="12" height="18" rx="2" fill="#4F5665"/>

  <!-- Operator Cabin -->
  <rect x="58" y="82" width="14" height="14" rx="2" fill="#61AFEF"/>
  <rect x="61" y="85" width="8" height="6" fill="#1A1D24"/>

  <!-- Cable and Hook dropping down -->
  <line x1="160" y1="100" x2="160" y2="145" stroke="#ABB2BF" stroke-width="2"/>
  <path d="M154 145 C154 152 166 152 166 145" fill="none" stroke="#E06C75" stroke-width="3" stroke-linecap="round"/>

  <!-- Action element: Hard hat & Foundation beam being lifted (Commencement vibe) -->
  <!-- Steel beam hanging from hook -->
  <rect x="135" y="145" width="50" height="12" rx="2" fill="#E5C07B"/>
  <rect x="145" y="140" width="30" height="5" rx="1" fill="#DA9833"/>

  <!-- Safety Hard Hat resting near the ground (iconic symbol of starting work) -->
  <path d="M85 162 C85 152 105 152 105 162 Z" fill="#F6A83B"/>
  <path d="M80 162 C80 160 110 160 110 162 L112 165 C112 166 108 167 95 167 C82 167 78 166 78 165 Z" fill="#D18320"/>

  <!-- Ground breaking spark / accent dots -->
  <circle cx="115" cy="172" r="2.5" fill="#61AFEF"/>
  <circle cx="125" cy="168" r="2" fill="#98C379"/>
  <circle cx="108" cy="175" r="1.5" fill="#E5C07B"/>
</svg>