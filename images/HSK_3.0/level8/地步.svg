<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Elements (Environment & Context) -->
  <!-- Back wall panels / architectural depth -->
  <path d="M 0 160 L 240 160" stroke="#334155" stroke-width="2" />
  <rect x="170" y="30" width="40" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M 190 30 L 190 100" stroke="#334155" stroke-width="1.5" />
  <path d="M 170 65 L 210 65" stroke="#334155" stroke-width="1.5" />

  <!-- Bookshelf in background -->
  <rect x="25" y="40" width="50" height="110" fill="#162032" />
  <rect x="30" y="65" width="40" height="4" fill="#334155" />
  <rect x="30" y="95" width="40" height="4" fill="#334155" />
  <rect x="30" y="125" width="40" height="4" fill="#334155" />
  <!-- Colorful books on shelf -->
  <rect x="33" y="50" width="6" height="15" rx="1" fill="#38bdf8" />
  <rect x="41" y="47" width="8" height="18" rx="1" fill="#ec4899" />
  <rect x="51" y="52" width="5" height="13" rx="1" fill="#10b981" />
  <rect x="33" y="75" width="10" height="20" rx="1" fill="#fb923c" />
  <rect x="45" y="78" width="7" height="17" rx="1" fill="#38bdf8" />

  <!-- Floor -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />

  <!-- Office Desk -->
  <rect x="40" y="145" width="160" height="12" rx="3" fill="url(#deskGrad)" filter="url(#shadow)" />
  <path d="M 55 157 L 50 215" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <path d="M 185 157 L 190 215" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

  <!-- Desk Props representing "The Situation / Getting out of hand" -->
  <!-- Laptop showing critical red/orange alert (situation escalation) -->
  <path d="M 135 145 L 175 145 L 180 120 L 130 120 Z" fill="#334155" />
  <rect x="133" y="120" width="44" height="25" rx="3" fill="#0f172a" />
  <!-- Alert chart on screen -->
  <path d="M 139 138 L 146 132 L 153 135 L 163 126 L 170 129" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Glowing warning aura from laptop -->
  <circle cx="155" cy="132" r="15" fill="#ef4444" opacity="0.15" />

  <!-- Messy stack of paper reports (Chaos / Escalating state) -->
  <g transform="translate(75, 130) rotate(-8)">
    <rect x="0" y="0" width="35" height="18" rx="1" fill="url(#paperGrad)" filter="url(#shadow)" />
    <path d="M 5 5 L 25 5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 5 9 L 20 9" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <g transform="translate(68, 138) rotate(4)">
    <rect x="0" y="0" width="38" height="20" rx="1" fill="url(#paperGrad)" filter="url(#shadow)" />
    <path d="M 5 6 L 30 6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 5 11 L 22 11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Coffee cup knocked over spilling drops (Symbol of loss of control) -->
  <path d="M 112 140 C 112 135 118 135 118 140 L 116 148 C 116 150 114 150 114 148 Z" fill="#fbbf24" />
  <path d="M 118 142 L 123 144" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <!-- Spilled liquid drop -->
  <circle cx="126" cy="147" r="2" fill="#b45309" />
  <circle cx="131" cy="149" r="1.5" fill="#b45309" />

  <!-- MAIN CHARACTER: Stressed professional in a complex situation -->
  <!-- Chair back -->
  <rect x="100" y="95" width="35" height="65" rx="8" fill="#334155" />
  <rect x="106" y="102" width="23" height="51" rx="4" fill="#1e293b" />

  <!-- Character Body / Torso -->
  <path d="M 95 180 C 92 155 105 135 120 135 C 135 135 148 155 145 180 Z" fill="#3b82f6" filter="url(#shadow)" />
  <!-- Shirt collar & tie -->
  <path d="M 112 135 L 120 148 L 128 135 Z" fill="#f8fafc" />
  <path d="M 118 145 L 120 165 L 122 145 Z" fill="#ef4444" />

  <!-- Head & Face (Expression of profound shock, realization of "this state") -->
  <circle cx="120" cy="108" r="18" fill="#fbcfe8" />
  <!-- Hair -->
  <path d="M 102 108 C 102 92 110 88 120 88 C 132 88 138 95 138 110 C 134 105 126 102 120 102 C 110 102 104 105 102 108 Z" fill="#0f172a" />

  <!-- Expressive Eyes (Wide, shocked) -->
  <circle cx="113" cy="108" r="3.5" fill="#ffffff" />
  <circle cx="114" cy="108" r="1.5" fill="#0f172a" />
  <circle cx="127" cy="108" r="3.5" fill="#ffffff" />
  <circle cx="128" cy="108" r="1.5" fill="#0f172a" />

  <!-- Worried Eyebrows (tilted sharply) -->
  <path d="M 109 101 L 117 104" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <path d="M 131 101 L 123 104" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

  <!-- Open O-shaped mouth (shocked realization) -->
  <ellipse cx="120" cy="118" rx="3.5" ry="5" fill="#0f172a" />

  <!-- Hands clutching head in disbelief/stress -->
  <!-- Left hand -->
  <path d="M 102 104 C 95 105 92 112 96 118 C 98 120 103 118 105 113 Z" fill="#fbcfe8" filter="url(#shadow)" />
  <path d="M 98 106 L 94 109" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 101 109 L 97 113" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right hand -->
  <path d="M 138 104 C 145 105 148 112 144 118 C 142 120 137 118 135 113 Z" fill="#fbcfe8" filter="url(#shadow)" />
  <path d="M 142 106 L 146 109" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 139 109 L 143 113" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms leading to head -->
  <path d="M 105 138 C 96 130 96 118 96 118" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
  <path d="M 135 138 C 144 130 144 118 144 118" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />

  <!-- Sweat drop (Stress indicator) -->
  <path d="M 136 95 C 136 95 141 101 141 104 C 141 106.5 138.8 108.5 136 108.5 C 133.2 108.5 131 106.5 131 104 C 131 101 136 95 136 95 Z" fill="#38bdf8" opacity="0.85" />

</svg>