<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing Spotlight Background Effect -->
  <circle cx="120" cy="110" r="75" fill="#252A36" opacity="0.6"/>
  <path d="M70 185 L120 45 L170 185 Z" fill="url(#lightBeam)" opacity="0.15"/>
  
  <defs>
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Giant Ancient Chinese Tripod (鼎 - Dǐng) representing "鼎鼎" (Renowned/Famous) -->
  <g transform="translate(0, 10)">
    <!-- Tripod Base / Feet -->
    <path d="M90 160 L75 190 L92 195 L102 165 Z" fill="url(#bronzeGrad)" />
    <path d="M150 160 L165 190 L148 195 L138 165 Z" fill="url(#bronzeGrad)" />
    <path d="M120 165 L120 198 L130 198 L130 165 Z" fill="url(#bronzeGrad)" />

    <!-- Tripod Belly (Main Bowl) -->
    <path d="M75 110 C75 155, 165 155, 165 110 C165 95, 150 90, 120 90 C90 90, 75 95, 75 110 Z" fill="url(#goldGrad)" />
    <!-- Inner shadow/depth for the vessel -->
    <ellipse cx="120" cy="100" rx="38" ry="8" fill="#78350F" opacity="0.6"/>

    <!-- Handles (耳) on sides -->
    <path d="M68 98 C55 98, 55 118, 70 120" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M172 98 C185 98, 185 118, 170 120" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Decorative Engraving / Ancient Motif on Tripod -->
    <path d="M100 120 L120 135 L140 120" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <circle cx="120" cy="115" r="4" fill="#78350F" opacity="0.5"/>
  </g>

  <!-- Glowing Halo / Starburst behind name plaque representing "大名" (Great Name/Reputation) -->
  <g transform="translate(120, 55)">
    <polygon points="0,-18 4,-6 16,-6 7,2 10,14 0,7 -10,14 -7,2 -16,-6 -4,-6" fill="#FDE047" opacity="0.9"/>
  </g>

  <!-- Prestige Ribbon / Plaque floating above -->
  <g transform="translate(120, 48)">
    <!-- Ribbon tails -->
    <path d="M-45 10 L-65 25 L-50 35 L-30 20 Z" fill="#D97706"/>
    <path d="M45 10 L65 25 L50 35 L30 20 Z" fill="#D97706"/>
    
    <!-- Main Badge Background -->
    <rect x="-42" y="-12" width="84" height="28" rx="14" fill="#F59E0B" stroke="#FEF08A" stroke-width="2"/>
    
    <!-- Laurel Wreath Details inside plaque area -->
    <path d="M-28 2 C-20 6, -10 6, -4 2" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 2 C20 6, 10 6, 4 2" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Center Star in Plaque -->
    <circle cx="0" cy="2" r="6" fill="#FEF08A"/>
  </g>

  <!-- Floating Sparkles / Fame Indicators -->
  <circle cx="55" cy="85" r="3" fill="#FDE047" opacity="0.8"/>
  <path d="M55 77 L55 93 M47 85 L63 85" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <circle cx="185" cy="85" r="2" fill="#FDE047" opacity="0.8"/>
  <path d="M185 79 L185 91 M179 85 L191 85" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <circle cx="85" cy="155" r="2.5" fill="#FDE047" opacity="0.6"/>
  <circle cx="155" cy="155" r="2" fill="#FDE047" opacity="0.6"/>
</svg>