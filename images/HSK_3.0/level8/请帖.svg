<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Room Lighting & Wallpaper Elements -->
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="240" height="240" fill="url(#wallGrad)"/>

  <!-- Window with Night City View / Atmosphere -->
  <path d="M165 30 L210 30 L210 95 L165 95 Z" fill="#334155" opacity="0.4"/>
  <rect x="170" y="35" width="35" height="55" rx="2" fill="#0f172a"/>
  <circle cx="187" cy="50" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="198" cy="70" r="1.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="178" cy="75" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <!-- Window Frame -->
  <path d="M167 33 L208 33 L208 93 L167 93 Z" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="187.5" y1="33" x2="187.5" y2="93" stroke="#475569" stroke-width="1.5"/>
  <line x1="167" y1="63" x2="208" y2="63" stroke="#475569" stroke-width="1.5"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M95 0 L95 35" stroke="#64748b" stroke-width="2"/>
  <path d="M75 35 L115 35 L120 45 L70 45 Z" fill="#f59e0b" filter="url(#shadow)"/>
  <polygon points="70,45 120,45 120,50 70,50" fill="#d97706"/>
  <!-- Light Cone / Glow -->
  <polygon points="95,48 20,200 170,200" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Bookshelf / Prop Background -->
  <rect x="25" y="40" width="50" height="6" rx="1" fill="#475569"/>
  <path d="M32 20 L40 40 L30 40 Z" fill="#ec4899"/>
  <path d="M44 18 L54 40 L42 40 Z" fill="#38bdf8"/>
  <path d="M57 25 L65 40 L55 40 Z" fill="#10b981"/>

  <!-- Wooden Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
  <!-- Desk Edge Highlight -->
  <path d="M0 160 L240 160" stroke="#64748b" stroke-width="3"/>
  <path d="M0 163 L240 163" stroke="#0f172a" stroke-width="2"/>

  <!-- Foreground Props on Desk -->
  <!-- Pen Holder / Extra Stationery -->
  <rect x="195" y="130" width="16" height="30" rx="3" fill="#475569" filter="url(#shadow)"/>
  <line x1="200" y1="130" x2="195" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="205" y1="130" x2="208" y2="110" stroke="#ec4899" stroke-width="2"/>
  <line x1="208" y1="130" x2="215" y2="118" stroke="#38bdf8" stroke-width="2"/>

  <!-- Coffee Mug -->
  <rect x="160" y="140" width="20" height="22" rx="4" fill="#f8fafc" filter="url(#shadow)"/>
  <path d="M180 145 C188 145, 188 157, 180 157" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <ellipse cx="170" cy="140" rx="10" ry="3" fill="#cbd5e1"/>
  <path d="M165 140 Q170 142 175 140" fill="#78350f"/>

  <!-- CHARACTER: Man Writing (Upper Body) -->
  <!-- Chair Back -->
  <path d="M50 100 L70 100 L75 170 L45 170 Z" fill="#334155" filter="url(#shadow)"/>

  <!-- Torso & Clothing (Blue Casual Shirt) -->
  <path d="M60 165 C60 130, 85 125, 110 135 L125 180 L55 180 Z" fill="#2563eb" filter="url(#shadow)"/>
  <!-- Shirt Collar -->
  <path d="M85 125 L95 145 L80 145 Z" fill="#1d4ed8"/>
  <path d="M100 128 L95 145 L110 142 Z" fill="#1d4ed8"/>

  <!-- Head & Face Profile / Angle -->
  <!-- Neck -->
  <path d="M85 115 L95 130 L105 125 L100 115 Z" fill="#fbcfe8"/>
  <!-- Head Base -->
  <circle cx="95" cy="100" r="22" fill="#fbcfe8" filter="url(#shadow)"/>
  <!-- Hair (Dark, Neat modern haircut) -->
  <path d="M73 100 C73 80, 110 78, 118 95 C118 95, 115 105, 112 103 C108 88, 85 85, 78 103 Z" fill="#0f172a"/>
  <path d="M74 98 C78 85, 105 85, 115 95 C115 95, 110 90, 95 88 C80 86, 75 95, 74 98 Z" fill="#1e293b"/>
  <!-- Ear -->
  <path d="M112 98 C116 98, 116 106, 112 108" fill="#fbcfe8"/>
  <!-- Facial expression: focused eyes, gentle smile looking down at card -->
  <path d="M98 102 Q105 103 110 100" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Subtle nose -->
  <path d="M114 105 Q117 108 114 111" stroke="#f472b6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Gentle smile -->
  <path d="M104 116 Q108 119 113 115" stroke="#be185d" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms & Hands Actively Writing -->
  <!-- Left Arm (resting/steadying) -->
  <path d="M65 155 Q80 170 90 155" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/>
  <!-- Right Arm (Writing motion) -->
  <path d="M110 138 Q130 145 125 158" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/>
  <!-- Right Hand -->
  <circle cx="125" cy="160" r="8" fill="#fbcfe8" filter="url(#shadow)"/>
  <!-- Fountain Pen / Stylus in Hand -->
  <path d="M115 170 L135 150" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <path d="M112 173 L117 168" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- THE CENTRAL OBJECT: "请帖" (The Elegant Invitation Card being crafted "亲手写") -->
  <g transform="translate(100, 140) rotate(-8)" filter="url(#shadow)">
    <!-- Base Card -->
    <rect x="0" y="0" width="75" height="55" rx="3" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    
    <!-- Gold Foil Border Pattern (Elegant framing) -->
    <rect x="5" y="5" width="65" height="45" rx="2" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- Decorative Ribbon / Seal Motif (Abstract luxury invite design) -->
    <path d="M37.5 12 L43 22 L32 22 Z" fill="#e11d48"/>
    <circle cx="37.5" cy="22" r="5" fill="url(#goldAcc)" filter="url(#shadow)"/>
    
    <!-- Elegant Handwritten Calligraphy Simulation (Abstract strokes representing 'writing' without real text) -->
    <path d="M18 32 C25 30, 30 35, 38 32" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 32 C48 30, 50 35, 58 33" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 41 C35 38, 45 43, 55 40" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Fresh Ink Drop/Sparkle on the card showing "custom handmade" care -->
    <circle cx="28" cy="32" r="1.5" fill="#e11d48"/>
  </g>

  <!-- Additional Envelope & Wax Seal Props beside the card -->
  <g transform="translate(65, 175) rotate(12)" filter="url(#shadow)">
    <!-- Open Envelope -->
    <path d="M0 10 L25 35 L50 10 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M0 10 L25 25 L50 10 L50 40 L0 40 Z" fill="#e2e8f0"/>
    <!-- Wax Seal Accent -->
    <circle cx="25" cy="25" r="5" fill="#e11d48"/>
    <circle cx="25" cy="25" r="3" fill="#fbbf24"/>
  </g>

  <!-- Atmospheric Lighting Sparkles / Warm Glow Particles -->
  <circle cx="130" cy="115" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="85" cy="75" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="150" cy="95" r="1" fill="#f59e0b" opacity="0.9"/>
  <path d="M128 113 L132 117 M132 113 L128 117" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>

</svg>