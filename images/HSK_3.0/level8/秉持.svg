<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Subtle ambient glow representing steadfastness and principles -->
    <circle cx="120" cy="115" r="55" fill="#3B4252" opacity="0.4"/>
    <circle cx="120" cy="115" r="40" fill="#EBCB8B" opacity="0.08"/>

    <!-- Pillar / Monument base representing principles/foundations (Five Principles context) -->
    <rect x="95" y="165" width="50" height="10" rx="2" fill="#4C566A"/>
    <rect x="100" y="157" width="40" height="8" rx="1" fill="#D8DEE9"/>

    <!-- Hands upholding the core symbol (Firmly grasping / upholding principle) -->
    <!-- Lower/Back Hand -->
    <path d="M90 145 C 95 130, 110 120, 120 120 C 130 120, 145 130, 150 145 Z" fill="#D08770"/>
    
    <!-- Central Upholding Object: Glowing Pillar of Principle (A classic upright monolithic column with engraved lines) -->
    <rect x="106" y="60" width="28" height="100" rx="3" fill="#ECEFF4"/>
    <!-- Pillar details / fluting -->
    <line x1="113" y1="65" x2="113" y2="155" stroke="#D8DEE9" stroke-width="2"/>
    <line x1="127" y1="65" x2="127" y2="155" stroke="#D8DEE9" stroke-width="2"/>
    
    <!-- Top accent of the pillar (capitol) -->
    <rect x="102" y="52" width="36" height="10" rx="2" fill="#EBCB8B"/>
    <rect x="100" y="47" width="40" height="6" rx="2" fill="#F49A32"/>

    <!-- Front Upholding Hands firmly grasping the pillar -->
    <!-- Left Hand -->
    <path d="M75 130 C 85 130, 95 135, 105 145 C 105 152, 95 158, 85 155 C 75 152, 70 140, 75 130 Z" fill="#E5C07B"/>
    <!-- Right Hand -->
    <path d="M165 130 C 155 130, 145 135, 135 145 C 135 152, 145 158, 155 155 C 165 152, 170 140, 165 130 Z" fill="#E5C07B"/>

    <!-- Star / Focus Emblem at the top symbolizing core values and steadfast adherence -->
    <polygon points="120,22 123,30 131,30 125,35 127,43 120,38 113,43 115,35 109,30 117,30" fill="#F49A32"/>
  </g>
</svg>