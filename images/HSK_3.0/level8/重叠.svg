<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Overlap Highlight Gradient -->
    <linearGradient id="overlapGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND CONTEXT -->
  <!-- Back Wall & Shelf -->
  <rect x="30" y="30" width="180" height="110" rx="6" fill="#1e293b" opacity="0.6" />
  <rect x="45" y="45" width="60" height="6" rx="3" fill="#334155" />
  <rect x="135" y="45" width="40" height="6" rx="3" fill="#334155" />
  <!-- Small plant on shelf -->
  <path d="M55 45 C55 35 65 35 65 45 Z" fill="#10b981" />
  <rect x="58" y="41" width="4" height="4" fill="#334155" />

  <!-- Window with Night City View -->
  <g transform="translate(145, 55)">
    <rect x="0" y="0" width="55" height="55" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="8" y="15" width="10" height="40" fill="#334155" opacity="0.5" />
    <rect x="23" y="25" width="12" height="30" fill="#334155" opacity="0.5" />
    <rect x="38" y="10" width="10" height="45" fill="#334155" opacity="0.5" />
    <!-- City lights -->
    <circle cx="12" cy="20" r="1" fill="#fbbf24" />
    <circle cx="15" cy="35" r="1" fill="#38bdf8" />
    <circle cx="27" cy="30" r="1" fill="#fbbf24" />
    <circle cx="42" cy="18" r="1" fill="#38bdf8" />
  </g>

  <!-- Wall Clock showing time conflict -->
  <circle cx="65" cy="75" r="16" fill="#334155" stroke="#475569" stroke-width="2" />
  <circle cx="65" cy="75" r="13" fill="#0f172a" />
  <!-- Clock hands -->
  <line x1="65" y1="75" x2="72" y2="70" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <line x1="65" y1="75" x2="60" y2="65" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
  <circle cx="65" cy="75" r="1.5" stroke="#f8fafc" stroke-width="1" fill="#f8fafc" />

  <!-- Desk Surface -->
  <rect x="15" y="175" width="210" height="35" rx="4" fill="#334155" filter="url(#shadow)" />
  <rect x="15" y="170" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Lamp -->
  <path d="M190 170 L195 120 L205 120 L210 170 Z" fill="#475569" />
  <path d="M185 115 C185 105 215 105 215 115 Z" fill="#f59e0b" />
  <circle cx="200" cy="115" r="50" fill="url(#lampGlow)" pointer-events="none" />

  <!-- CHARACTER -->
  <g id="character">
    <!-- Body & Hoodie -->
    <path d="M75 190 C75 160 85 145 100 145 C115 145 125 160 125 190 Z" fill="#38bdf8" />
    <!-- Collar/Hood -->
    <path d="M85 145 C90 155 110 155 115 145 C110 140 90 140 85 145 Z" fill="#0284c7" />
    
    <!-- Head & Face -->
    <circle cx="100" cy="125" r="18" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M82 125 C82 110 90 105 100 105 C115 105 118 115 118 130 C110 125 95 128 82 125 Z" fill="#334155" />
    <path d="M85 120 C90 112 100 110 110 115 C105 112 95 112 85 120 Z" fill="#475569" />

    <!-- Concerned Expression / Eyebrows tilted -->
    <line x1="90" y1="120" x2="96" y2="122" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <line x1="104" y1="122" x2="110" y2="120" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="93" cy="125" r="1.5" fill="#334155" />
    <circle cx="107" cy="125" r="1.5" fill="#334155" />
    <!-- Slightly open mouth (worry) -->
    <ellipse cx="100" cy="133" rx="2" ry="1.5" fill="#334155" />

    <!-- Arms & Hands holding pens/pointing -->
    <path d="M75 160 C65 170 70 185 80 185" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <circle cx="82" cy="186" r="4" fill="#fbcfe8" />
    
    <path d="M125 160 C135 165 130 180 120 185" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <circle cx="118" cy="186" r="4" fill="#fbcfe8" />
  </g>

  <!-- THE CORE SCENARIO: TWO OVERLAPPING SCHEDULE PLANS (重叠 -óngdié) -->
  <g id="schedule-plans" transform="translate(75, 140)" filter="url(#shadow)">
    
    <!-- Plan Document 1 (Blue/Cyan - e.g., Project A) -->
    <g transform="rotate(-12, 40, 20)">
      <rect x="0" y="0" width="55" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <!-- Header Bar -->
      <rect x="6" y="6" width="25" height="5" rx="1.5" fill="#38bdf8" />
      <!-- Timeline Bars / Schedule items -->
      <rect x="6" y="16" width="43" height="6" rx="2" fill="#bae6fd" />
      <rect x="6" y="26" width="30" height="5" rx="2" fill="#e2e8f0" />
      <!-- Red highlight marker on the time slot -->
      <rect x="18" y="16" width="18" height="6" rx="2" fill="#f43f5e" opacity="0.85" />
    </g>

    <!-- Plan Document 2 (Amber/Orange - e.g., Project B) -->
    <g transform="rotate(15, 45, 25)">
      <rect x="22" y="10" width="55" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <!-- Header Bar -->
      <rect x="28" y="16" width="25" height="5" rx="1.5" fill="#fbbf24" />
      <!-- Timeline Bars / Schedule items -->
      <rect x="28" y="26" width="43" height="6" rx="2" fill="#fef3c7" />
      <rect x="28" y="36" width="25" height="5" rx="2" fill="#e2e8f0" />
      <!-- Red highlight marker on the matching time slot -->
      <rect x="40" y="26" width="18" height="6" rx="2" fill="#f43f5e" opacity="0.85" />
    </g>

    <!-- OVERLAP HIGHLIGHT EFFECT (Visualizing "Chóngdié" / Overlap area) -->
    <!-- Glowing intersection indicator pulse bubble -->
    <g transform="translate(42, 22)">
      <rect x="0" y="0" width="22" height="16" rx="4" fill="url(#overlapGlow)" filter="url(#shadow)" />
      <!-- Tiny clock icon inside overlap indicator -->
      <circle cx="11" cy="8" r="5" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <line x1="11" y1="5" x2="11" y2="8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <line x1="11" y1="8" x2="13" y2="9.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Exclamation / Alert marker floating above the overlap -->
    <path d="M53 -2 L56 -9 L59 -2 Z" fill="#f43f5e" />
    <circle cx="56" cy="1" r="1.5" fill="#f43f5e" />
  </g>

  <!-- Foreground Desk Items (Coffee mug, notepad) -->
  <!-- Coffee Mug -->
  <g transform="translate(170, 160)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#f43f5e" />
    <path d="M16 8 C20 8 20 18 16 18" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="8" cy="5" rx="8" ry="2" fill="#fda4af" />
    <!-- Steam -->
    <path d="M5 -1 C3 -4 7 -6 5 -9" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Small Sticky Note on Desk -->
  <rect x="35" y="180" width="22" height="18" rx="1" fill="#fef08a" transform="rotate(-5, 46, 189)" />
  <line x1="39" y1="185" x2="51" y2="185" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" transform="rotate(-5, 46, 189)" />
  <line x1="39" y1="190" x2="48" y2="190" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" transform="rotate(-5, 46, 189)" />

</svg>