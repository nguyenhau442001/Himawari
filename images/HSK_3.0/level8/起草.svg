<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Architecture & Environment -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="160" fill="#1e293b" />
  
  <!-- Wooden Floor / Desk Surface boundary -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#0f172a" />
  <rect x="0" y="156" width="240" height="4" fill="#334155" />

  <!-- Bookshelf Background Details -->
  <rect x="25" y="40" width="35" height="90" fill="#1b263b" rx="2" />
  <rect x="30" y="50" width="25" height="4" fill="#334155" />
  <rect x="30" y="75" width="25" height="4" fill="#334155" />
  <rect x="30" y="100" width="25" height="4" fill="#334155" />
  <!-- Colorful book spines -->
  <rect x="32" y="58" width="6" height="15" fill="#38bdf8" rx="1" />
  <rect x="40" y="56" width="8" height="17" fill="#f59e0b" rx="1" />
  <rect x="32" y="82" width="7" height="15" fill="#10b981" rx="1" />
  <rect x="42" y="80" width="5" height="17" fill="#ec4899" rx="1" />

  <!-- Window with City Silhouette outside -->
  <g transform="translate(165, 30)">
    <rect x="0" y="0" width="50" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <!-- Window pane grid -->
    <line x1="25" y1="0" x2="25" y2="85" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="42.5" x2="50" y2="42.5" stroke="#334155" stroke-width="1.5" />
    <!-- City lights glow -->
    <rect x="8" y="50" width="6" height="8" fill="#fbbf24" opacity="0.6" rx="1" />
    <rect x="16" y="60" width="5" height="12" fill="#38bdf8" opacity="0.5" rx="1" />
    <rect x="32" y="45" width="7" height="20" fill="#fbbf24" opacity="0.4" rx="1" />
  </g>

  <!-- Ambient Light from Window -->
  <polygon points="165,30 215,30 240,160 120,160" fill="url(#windowLight)" />

  <!-- Office Desk -->
  <g filter="url(#shadow)">
    <!-- Main Desk Top -->
    <path d="M20 160 L220 160 L205 185 L35 185 Z" fill="#475569" />
    <path d="M20 160 L220 160 L220 164 L20 164 Z" fill="#64748b" />
    <!-- Desk Legs -->
    <rect x="40" y="185" width="12" height="40" fill="#1e293b" />
    <rect x="188" y="185" width="12" height="40" fill="#1e293b" />
  </g>

  <!-- Desk Lamp -->
  <g>
    <!-- Base -->
    <ellipse cx="190" cy="155" rx="12" ry="4" fill="#64748b" />
    <!-- Arm -->
    <path d="M190 155 L180 125 L160 115" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shade -->
    <path d="M148 108 L172 108 L165 120 L155 120 Z" fill="#38bdf8" />
    <!-- Light cone overlay -->
    <polygon points="152,120 178,120 205,175 125,175" fill="url(#lampGlow)" />
  </g>

  <!-- Props: Contract, Scale, Pen, Laptop -->
  <!-- Laptop -->
  <g transform="translate(125, 140)">
    <!-- Base / Keyboard area -->
    <path d="M-25 20 L35 20 L45 32 L-35 32 Z" fill="#94a3b8" />
    <path d="M-22 22 L32 22 L38 29 L-28 29 Z" fill="#334155" />
    <!-- Screen -->
    <path d="M-30 -12 L30 -12 L35 20 L-35 20 Z" fill="#64748b" />
    <path d="M-27 -9 L27 -9 L32 17 L-32 17 Z" fill="#0f172a" />
    <!-- Code/Text lines on screen -->
    <line x1="-20" y1="-3" x2="5" y2="-3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="-20" y1="3" x2="15" y2="3" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-20" y1="9" x2="-2" y2="9" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Scale of Justice (Legal Symbolism) -->
  <g transform="translate(195, 115) scale(0.7)">
    <rect x="-2" y="0" width="4" height="40" fill="#fbbf24" />
    <circle cx="0" cy="0" r="5" fill="#f59e0b" />
    <path d="M-20 10 L20 10" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <!-- Left pan -->
    <path d="M-20 10 L-25 22 L-15 22 Z" fill="#fbbf24" />
    <path d="M-28 22 L-12 22 C-12 27 -28 27 -28 22 Z" fill="#f59e0b" />
    <!-- Right pan -->
    <path d="M20 10 L15 22 L25 22 Z" fill="#fbbf24" />
    <path d="M12 22 L28 22 C28 27 12 27 12 22 Z" fill="#f59e0b" />
  </g>

  <!-- Contract Document / Draft Papers (Main Subject Focus) -->
  <g transform="translate(75, 145) rotate(-5)" filter="url(#shadow)">
    <!-- Base paper sheet -->
    <rect x="0" y="0" width="55" height="40" rx="2" fill="#f8fafc" />
    <!-- Red official stamp / seal (Draft/Contract vibe) -->
    <circle cx="42" cy="28" r="7" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8" />
    <circle cx="42" cy="28" r="5" fill="none" stroke="#ef4444" stroke-width="0.75" opacity="0.8" />
    <!-- Header line -->
    <rect x="8" y="6" width="25" height="4" fill="#cbd5e1" rx="1" />
    <!-- Text lines simulating legal draft clauses -->
    <line x1="8" y1="15" x2="45" y2="15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="21" x2="35" y2="21" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="27" x2="40" y2="27" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="33" x2="25" y2="33" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Stacked papers underneath -->
    <rect x="-3" y="3" width="55" height="40" rx="2" fill="#e2e8f0" style="mix-blend-mode: multiply;" />
  </g>

  <!-- The Lawyer Character -->
  <g id="lawyer-character">
    <!-- Body / Torso (Professional Suit) -->
    <!-- Inner Shirt & Tie -->
    <path d="M75 140 L95 140 L100 175 L70 175 Z" fill="#ffffff" />
    <polygon points="85,140 90,140 88,165" fill="#1e293b" /> <!-- Tie -->
    <!-- Suit Jacket -->
    <path d="M55 145 C55 125 115 125 115 145 L110 190 L60 190 Z" fill="#1e3a8a" />
    <!-- Lapels -->
    <path d="M75 140 L85 170 L65 170 Z" fill="#1e293b" />
    <path d="M95 140 L85 170 L105 170 Z" fill="#1e293b" />

    <!-- Neck -->
    <rect x="80" y="118" width="12" height="15" fill="#fbcfe8" />

    <!-- Head & Face -->
    <g transform="translate(86, 105)">
      <!-- Ears -->
      <circle cx="-13" cy="2" r="3.5" fill="#fbcfe8" />
      <circle cx="13" cy="2" r="3.5" fill="#fbcfe8" />
      
      <!-- Head Base -->
      <ellipse cx="0" cy="2" rx="13" ry="15" fill="#fbcfe8" />

      <!-- Professional Hair (Neat dark hair) -->
      <path d="M-13 2 C-13 -8 13 -8 13 2 C13 -3 10 -10 0 -10 C-10 -10 -13 -3 -13 2 Z" fill="#0f172a" />

      <!-- Serious, focused Expression / Eyes -->
      <circle cx="-5" cy="1" r="1.5" fill="#0f172a" />
      <circle cx="5" cy="1" r="1.5" fill="#0f172a" />
      <!-- Glasses (Smart professional look) -->
      <rect x="-9" y="-2" width="7" height="5" rx="1" fill="none" stroke="#38bdf8" stroke-width="1.2" />
      <rect x="2" y="-2" width="7" height="5" rx="1" fill="none" stroke="#38bdf8" stroke-width="1.2" />
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#38bdf8" stroke-width="1.2" />

      <!-- Confident, thoughtful mouth -->
      <path d="M-3 8 C-1 9 1 9 3 8" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Arms & Active Drafting Pose -->
    <!-- Left Arm (Holding down document) -->
    <path d="M60 140 L50 155 L65 160" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="65" cy="160" r="4" fill="#fbcfe8" />

    <!-- Right Arm (Actively writing / drafting with pen) -->
    <path d="M110 140 L125 155 L105 168" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="105" cy="168" r="4" fill="#fbcfe8" />

    <!-- Pen Tool in hand -->
    <g transform="translate(100, 165) rotate(-35)">
      <rect x="0" y="0" width="12" height="2.5" rx="1" fill="#f59e0b" />
      <polygon points="12,0 16,1.25 12,2.5" fill="#0f172a" />
    </g>
  </g>

  <!-- Foreground Atmospheric Details & Polish -->
  <!-- Coffee Mug for late-night drafting vibe -->
  <g transform="translate(45, 155)">
    <rect x="0" y="0" width="14" height="16" rx="2" fill="#ec4899" />
    <path d="M14 3 C18 3 18 11 14 11" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam wisps -->
    <path d="M4 -3 C5 -6 3 -8 4 -11" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M10 -2 C11 -5 9 -7 10 -10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

</svg>