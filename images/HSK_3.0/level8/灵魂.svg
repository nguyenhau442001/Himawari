<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Library/School Setting -->
  <rect x="30" y="60" width="180" height="120" rx="4" fill="#334155" opacity="0.4"/>
  <path d="M40 70 L80 70 L80 170 L40 170 Z" fill="#475569"/>
  <path d="M90 70 L130 70 L130 170 L90 170 Z" fill="#475569"/>
  <path d="M140 70 L180 70 L180 170 L140 170 Z" fill="#475569"/>
  
  <!-- Central Subject: Teacher and Student -->
  <!-- Teacher -->
  <circle cx="160" cy="130" r="15" fill="#f59e0b"/>
  <path d="M145 145 H175 L170 200 H150 Z" fill="#38bdf8"/>
  <path d="M150 150 L140 180" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M170 150 L185 170" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Student -->
  <circle cx="80" cy="150" r="12" fill="#fbbf24"/>
  <path d="M70 162 H90 L88 200 H72 Z" fill="#ec4899"/>
  
  <!-- The "Soul" / Glowing Book Concept -->
  <rect x="110" y="140" width="30" height="40" rx="2" fill="#fb923c"/>
  <path d="M115 145 H135 M115 155 H135 M115 165 H135" stroke="#fff" stroke-width="2"/>
  
  <!-- Glowing Aura around the book -->
  <circle cx="125" cy="160" r="25" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="3" fill="#10b981"/>
  <circle cx="40" cy="40" r="2" fill="#38bdf8"/>
</svg>