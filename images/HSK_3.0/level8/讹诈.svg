<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow behind the extortion scene -->
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#FF5722" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#bgGlow)"/>

  <!-- Conceptual Object: A digital device (tablet/phone) displaying personal data, with a shadowy coercing hand holding a demand/blackmail note with a coin icon, representing extortion/blackmail (讹诈) -->
  
  <!-- Shadow casting on background -->
  <ellipse cx="120" cy="190" rx="70" ry="12" fill="#111318"/>

  <!-- Target Victim's Device (Leaking Data) -->
  <g id="device">
    <!-- Tablet body -->
    <rect x="55" y="70" width="130" height="95" rx="8" fill="#2D333B" stroke="#3E4857" stroke-width="2"/>
    <!-- Screen -->
    <rect x="63" y="78" width="114" height="79" rx="4" fill="#161B22"/>
    
    <!-- Exposed Personal Data Icons on Screen -->
    <!-- ID Card / Profile Graphic -->
    <rect x="73" y="88" width="30" height="22" rx="3" fill="#3E4857"/>
    <circle cx="83" cy="95" r="5" fill="#6CB5FF"/>
    <rect x="91" y="93" width="8" height="2" rx="1" fill="#8B949E"/>
    <rect x="91" y="98" width="10" height="2" rx="1" fill="#8B949E"/>

    <!-- Location/Lock Data Graphic -->
    <rect x="111" y="88" width="56" height="22" rx="3" fill="#3E4857"/>
    <circle cx="120" cy="99" r="4" fill="#FF5722"/>
    <path d="M129 96h25M129 102h18" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>

    <!-- Data lines background -->
    <path d="M73 122h94M73 132h70M73 142h85" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Coercion element: Shadowy / Threatening Hand holding an Extortion Demand -->
  <g id="extortion-hand">
    <!-- Dark sleeve coming from the right -->
    <path d="M210 180c-15-10-35-25-50-45l20-20c15 20 35 35 50 45v20z" fill="#1F242C"/>
    
    <!-- Arm/Hand reaching in -->
    <path d="M165 140c-10-12-22-25-35-38l12-12c13 13 25 26 35 38l-12 12z" fill="#E0A96D"/>

    <!-- The Extortion Note / Demand Card -->
    <g transform="rotate(-12 110 95)">
      <!-- Note background -->
      <rect x="80" y="55" width="70" height="85" rx="4" fill="#F0F6FC" stroke="#C9D1D9" stroke-width="1.5"/>
      
      <!-- Warning Red Banner -->
      <path d="M80 55h70v18h-70z" fill="#FF5722"/>
      <!-- Exclamation mark icon on banner -->
      <circle cx="115" cy="64" r="5" fill="#FFFFFF"/>
      <path d="M115 61v4M115 67v1" stroke="#FF5722" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Demand lines / Ransom text simulation -->
      <rect x="90" y="82" width="50" height="4" rx="2" fill="#D03D3D"/>
      <rect x="90" y="93" width="40" height="3" rx="1.5" fill="#8B949E"/>
      <rect x="90" y="101" width="45" height="3" rx="1.5" fill="#8B949E"/>
      <rect x="90" y="109" width="30" height="3" rx="1.5" fill="#8B949E"/>

      <!-- Golden Coin / Payment Demand Symbol -->
      <circle cx="115" cy="123" r="9" fill="#F2CC60" stroke="#D4A72C" stroke-width="1.5"/>
      <text x="115" y="126" font-family="sans-serif" font-weight="bold" font-size="10" fill="#7A5D10" text-anchor="middle">$</text>
    </g>

    <!-- Fingers gripping the note -->
    <path d="M130 95c-3-2-7-1-9 2s-1 7 2 9l7-11z" fill="#D49B5A"/>
    <path d="M142 85c-3-2-7-1-9 2s-1 7 2 9l7-11z" fill="#E0A96D"/>
  </g>

  <!-- Warning / Threat Indicators (Accent) -->
  <g id="warning-accents">
    <!-- Glowing red warning aura around the breach -->
    <circle cx="120" cy="117.5" r="45" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  </g>
</svg>