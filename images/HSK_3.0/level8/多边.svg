<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 多边 (Multilateral/Polygon object representing international cooperation) -->
  <g transform="translate(120, 115)">
    <!-- Outer connection lines representing multilateral cooperation/network -->
    <line x1="0" y1="-70" x2="-60" y2="35" stroke="#3A4454" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="0" y1="-70" x2="60" y2="35" stroke="#3A4454" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="-60" y1="35" x2="60" y2="35" stroke="#3A4454" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="-60" y1="35" x2="0" y2="-70" stroke="#3A4454" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Central 3D Hexagon / Multilateral Object representing structural stability & partnership -->
    <!-- Back faces / depth -->
    <polygon points="0,-45 50,-20 50,30 0,55 -50,30 -50,-20" fill="#252A34" />

    <!-- Main Hexagon Faces (faceted for 3D geometric look) -->
    <!-- Top Face -->
    <polygon points="0,-45 50,-20 0,-15 -50,-20" fill="#2F3848" />
    <!-- Right Face -->
    <polygon points="50,-20 50,30 0,55 0,-15" fill="#4B6584" />
    <!-- Left Face -->
    <polygon points="-50,-20 -50,30 0,55 0,-15" fill="#38ada8" />

    <!-- Core highlight / focal point representing unity/cooperation -->
    <circle cx="0" cy="15" r="10" fill="#FFC312" opacity="0.9" />
    <circle cx="0" cy="15" r="4" fill="#FFFFFF" />

    <!-- Orbital nodes representing multiple parties (multilateralism) -->
    <!-- Node 1 (Top) -->
    <circle cx="0" cy="-70" r="12" fill="#2F3848" stroke="#FFC312" stroke-width="3" />
    <circle cx="0" cy="-70" r="4" fill="#FFC312" />

    <!-- Node 2 (Bottom Left) -->
    <circle cx="-60" cy="35" r="12" fill="#2F3848" stroke="#38ada8" stroke-width="3" />
    <circle cx="-60" cy="35" r="4" fill="#38ada8" />

    <!-- Node 3 (Bottom Right) -->
    <circle cx="60" cy="35" r="12" fill="#2F3848" stroke="#4B6584" stroke-width="3" />
    <circle cx="60" cy="35" r="4" fill="#67B7D1" />
  </g>

  <!-- Decorative subtle grid background -->
  <circle cx="120" cy="115" r="90" fill="none" stroke="#252A34" stroke-width="1" stroke-dasharray="2 6" />
</svg>