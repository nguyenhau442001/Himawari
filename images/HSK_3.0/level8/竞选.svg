<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Podium -->
  <path d="M70 180 L170 180 L160 220 L80 220 Z" fill="#334155"/>
  <path d="M75 185 L165 185 L158 215 L82 215 Z" fill="#475569"/>
  
  <!-- Character -->
  <g transform="translate(120, 100)">
    <!-- Suit -->
    <path d="M-30 20 L30 20 L25 80 L-25 80 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-25 20 L-10 40 L-25 50 Z" fill="#334155"/>
    <path d="M25 20 L10 40 L25 50 Z" fill="#334155"/>
    <!-- Shirt/Tie -->
    <path d="M-5 20 L5 20 L0 50 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-20 -15 C-20 -35 20 -35 20 -15 C 20 -25 10 -30 0 -30 C -10 -30 -20 -25 -20 -15" fill="#475569"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-10" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-10" r="3" fill="#0f172a"/>
    <!-- Mouth -->
    <path d="M-8 5 Q0 12 8 5" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Microphone -->
  <path d="M120 100 L120 160" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="120" cy="95" r="8" fill="#fbbf24"/>
  
  <!-- Background Elements (Flags/Banners) -->
  <rect x="30" y="40" width="40" height="80" rx="4" fill="#10b981" opacity="0.6"/>
  <rect x="170" y="40" width="40" height="80" rx="4" fill="#ec4899" opacity="0.6"/>
  
  <!-- Spotlight Glow -->
  <path d="M120 0 L200 240 L40 240 Z" fill="url(#lightGrad)" opacity="0.15"/>
  <defs>
    <linearGradient id="lightGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>