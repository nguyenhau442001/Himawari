<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mtnBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mtnFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Car Body Gradient -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="headlightGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>

    <!-- Motion Lines Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Stars / Night Sky details -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="30" cy="40" r="1" />
    <circle cx="70" cy="25" r="1.5" />
    <circle cx="120" cy="35" r="1" />
    <circle cx="180" cy="20" r="1.2" />
    <circle cx="215" cy="50" r="1" />
  </g>

  <!-- Distant Mountains -->
  <path d="M-10 160 L40 100 L110 150 L170 90 L250 140 L250 200 L-10 200 Z" fill="url(#mtnBack)" />

  <!-- Closer Mountains -->
  <path d="M-10 180 Q50 120 90 150 T200 130 Q230 150 250 170 L250 220 L-10 220 Z" fill="url(#mtnFront)" />

  <!-- Winding Mountain Road -->
  <path d="M 20 230 Q 70 190 120 200 T 220 160" fill="none" stroke="url(#roadGrad)" stroke-width="26" stroke-linecap="round" />
  <!-- Road Center Dashes -->
  <path d="M 25 228 Q 70 191 118 199 T 215 162" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Motion Impact Lines (Vertical shaking lines for '颠簸') -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="85" y1="125" x2="80" y2="135" />
    <line x1="145" y1="115" x2="150" y2="105" />
    <line x1="115" y1="140" x2="110" y2="150" />
    <line x1="100" y1="100" x2="102" y2="90" />
  </g>

  <!-- Main Scene: The Car on the Mountain Road (Tilted to show bumping/shaking) -->
  <g transform="translate(110, 140) rotate(-14)">
    
    <!-- Headlight Beam (Cone of light pointing down-right) -->
    <path d="M 45 10 L 110 0 L 120 25 L 45 18 Z" fill="url(#headlightGlow)" />

    <!-- Car Shadow on Road -->
    <ellipse cx="0" cy="22" rx="36" ry="6" fill="#0f172a" opacity="0.5" />

    <!-- Suspension / Bounce Indicator Arcs -->
    <path d="M-28 12 Q-22 22 -15 15" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2" />
    <path d="M15 12 Q22 22 28 15" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Car Body Lower -->
    <path d="M -38 2 
             Q -38 -8 -28 -8 
             L 24 -8 
             Q 36 -8 38 2 
             L 38 12 
             Q 38 16 34 16 
             L -34 16 
             Q -38 16 -38 12 Z" 
          fill="url(#carBody)" />

    <!-- Car Roof & Windows (Cabin) -->
    <path d="M -18 -8 
             L -10 -22 
             L 12 -22 
             L 22 -8 Z" 
          fill="#334155" />
    
    <!-- Windows Cutout -->
    <path d="M -16 -9 
             L -9 -20 
             L 5 -20 
             L 10 -9 Z" 
          fill="#38bdf8" opacity="0.8" />

    <!-- Driver Character (Bouncing, expressive face) -->
    <g transform="translate(-2, -14)">
      <!-- Driver Body/Shirt -->
      <path d="M-6 4 L6 4 L8 10 L-8 10 Z" fill="#fb923c" />
      <!-- Head -->
      <circle cx="0" cy="-2" r="5.5" fill="#fcd34d" />
      <!-- Surprised/Bumping Expression (eyes wide, mouth open slightly) -->
      <circle cx="-1.5" cy="-3" r="0.8" fill="#1e293b" />
      <circle cx="1.5" cy="-3" r="0.8" fill="#1e293b" />
      <path d="M-1 0 Q0 1.5 1 0" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" />
      <!-- Hair flying up due to bump -->
      <path d="M-4 -6 Q-2 -9 1 -7 Q3 -9 5 -6" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Passenger Character (Head tilting sideways from the shake) -->
    <g transform="translate(13, -13)">
      <!-- Passenger Shirt -->
      <path d="M-5 4 L5 4 L7 10 L-7 10 Z" fill="#10b981" />
      <!-- Head (Tilted) -->
      <circle cx="2" cy="-2" r="5.5" fill="#fcd34d" />
      <!-- Eyes closed tightly in reaction to bump -->
      <path d="M0 -3 L2 -2" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" />
      <path d="M3 -3 L5 -2" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" />
      <!-- Hair bouncing -->
      <path d="M-2 -6 Q1 -10 6 -6" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Steering Wheel -->
    <path d="M -5 -9 Q -9 -14 -4 -16" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Wheels (Bouncing off ground slightly or compressed) -->
    <!-- Back Wheel -->
    <circle cx="-22" cy="16" r="9" fill="#0f172a" />
    <circle cx="-22" cy="16" r="4" fill="#94a3b8" />
    <line x1="-26" y1="16" x2="-18" y2="16" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-22" y1="12" x2="-22" y2="20" stroke="#0f172a" stroke-width="1.5" />

    <!-- Front Wheel -->
    <circle cx="22" cy="16" r="9" fill="#0f172a" />
    <circle cx="22" cy="16" r="4" fill="#94a3b8" />
    <line x1="18" y1="16" x2="26" y2="16" stroke="#0f172a" stroke-width="1.5" />
    <line x1="22" y1="12" x2="22" y2="20" stroke="#0f172a" stroke-width="1.5" />

    <!-- Headlight (Bright yellow circle on front) -->
    <circle cx="36" cy="6" r="2.5" fill="#fef08a" filter="url(#glow)" />
    <!-- Rear light -->
    <circle cx="-36" cy="2" r="2" fill="#ef4444" />

    <!-- Bumper / Mud guards -->
    <path d="M-38 12 L-34 16" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M38 12 L34 16" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground details: Small rocks flying/bouncing up from wheels -->
  <g fill="#64748b">
    <circle cx="75" cy="165" r="2.5" />
    <circle cx="68" cy="155" r="1.5" />
    <circle cx="165" cy="130" r="2" />
  </g>
  <g fill="#94a3b8">
    <circle cx="78" cy="160" r="1" />
    <circle cx="160" cy="125" r="1.2" />
  </g>

  <!-- Atmospheric tree silhouettes on roadside -->
  <g fill="#0f172a" opacity="0.8">
    <!-- Left side trees -->
    <path d="M 10 210 L 15 180 L 20 210 Z" />
    <path d="M 5 215 L 9 190 L 13 215 Z" />
    <path d="M 25 205 L 30 170 L 35 205 Z" />
    
    <!-- Right side distant pines -->
    <path d="M 210 160 L 215 130 L 220 160 Z" />
    <path d="M 222 155 L 226 120 L 230 155 Z" />
  </g>

  <!-- Frame border subtle overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>