    <path d="M20 65 L60 65 L55 120 L25 120 Z" fill="#ec4899"/>
    <rect x="25" y="60" width="30" height="10" fill="#ec4899" rx="2"/>
  </g>
  
  <!-- Floating Icons (Data Transfer) -->
  <g fill="#10b981">
    <circle cx="150" cy="110" r="4"/>
