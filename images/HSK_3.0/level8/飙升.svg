<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="30" y="30" width="180" height="180" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- Cityscape Silhouette -->
  <path d="M30 150 L60 150 L60 210 L30 210 Z" fill="#1e293b"/>
  <path d="M70 120 L100 120 L100 210 L70 210 Z" fill="#1e293b"/>
  <path d="M110 160 L140 160 L140 210 L110 210 Z" fill="#1e293b"/>
  <path d="M150 130 L180 130 L180 210 L150 210 Z" fill="#1e293b"/>
  <path d="M190 170 L210 170 L210 210 L190 210 Z" fill="#1e293b"/>

  <!-- Character: Young couple looking at a tablet -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M15 25 Q20 30 25 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="10" y="35" width="20" height="30" rx="5" fill="#38bdf8"/>
    
    <circle cx="60" cy="20" r="12" fill="#fde68a"/>
    <path d="M55 25 Q60 30 65 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="50" y="35" width="20" height="30" rx="5" fill="#ec4899"/>
  </g>

  <!-- Floating Chart/Graph showing spike -->
  <g transform="translate(140, 60)">
    <rect x="0" y="0" width="70" height="50" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <path d="M10 40 L25 35 L40 10 L60 5" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="5" r="4" fill="#fb923c"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="40" cy="60" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="190" r="2" fill="#38bdf8" opacity="0.6"/>
</svg>