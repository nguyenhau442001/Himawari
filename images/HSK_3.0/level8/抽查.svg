<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Grid Subtle Accents -->
  <path d="M40 60 H200 M40 100 H200 M40 140 H200 M40 180 H200" stroke="#252A34" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Central Physical Object: A cardboard box representing market goods (food/items) -->
  <g transform="translate(60, 90)">
    <!-- Box Body -->
    <path d="M0 30 L60 10 L120 30 L120 90 L60 115 L0 90 Z" fill="#3E3224"/>
    <path d="M0 30 L60 55 L120 30" fill="none" stroke="#2D241A" stroke-width="2"/>
    <path d="M60 55 L60 115" fill="none" stroke="#2D241A" stroke-width="2"/>
    
    <!-- Box Flaps Open -->
    <path d="M0 30 L20 5 L60 20 L40 45 Z" fill="#4E4030"/>
    <path d="M120 30 L100 5 L60 20 L80 45 Z" fill="#5E4E3A"/>
    
    <!-- Quality Check Stamp / Tag attached representing "抽查" (Random Spot Check) -->
    <path d="M60 45 L95 65 L95 95 L60 110 L25 95 L25 65 Z" fill="#2E3944" opacity="0.9"/>
    <path d="M60 50 L90 67 L90 93 L60 105 L30 93 L30 67 Z" fill="#242B33"/>
    
    <!-- Checked Item / Apple inside box -->
    <circle cx="60" cy="75" r="14" fill="#FF5722"/>
    <path d="M60 61 Q64 56 68 60" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Random Probabilistic Selection / Magnifying Glass & Laser Scan Effect -->
  <g transform="translate(100, 50)">
    <!-- Scanning beam cone -->
    <path d="M20 10 L-30 80 L70 80 Z" fill="#FFC107" opacity="0.1"/>
    
    <!-- Magnifying Glass (Inspection Tool) -->
    <circle cx="20" cy="20" r="28" fill="none" stroke="#FFC107" stroke-width="5"/>
    <circle cx="20" cy="20" r="25" fill="#1A1D24" opacity="0.5"/>
    <!-- Glass Handle -->
    <path d="M38 38 L65 65" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Target crosshair inside lens -->
    <path d="M20 8 V32 M8 20 H32" stroke="#FF5722" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Randomizer Probability Dots (representing "随机" / random sampling) -->
  <circle cx="45" cy="80" r="4" fill="#FFC107"/>
  <circle cx="185" cy="70" r="5" fill="#4CAF50"/>
  <circle cx="195" cy="150" r="3" fill="#FF5722"/>
  <circle cx="35" cy="170" r="4" fill="#FFC107"/>
  
  <!-- Checkmark Badge for Inspection Pass -->
  <circle cx="180" cy="180" r="18" fill="#4CAF50"/>
  <path d="M172 180 L178 186 L190 172" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>