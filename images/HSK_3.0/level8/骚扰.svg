<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with dark modern theme -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="copGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Environment / Room Interior -->
  <rect x="0" y="0" width="240" height="240" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Window with urban night view & police light reflection -->
  <path d="M140 30 L210 30 L210 110 L140 110 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M175 30 L175 110" stroke="#334155" stroke-width="1"/>
  <path d="M140 70 L210 70" stroke="#334155" stroke-width="1"/>
  <!-- City building silhouettes outside -->
  <path d="M145 110 L145 85 L155 85 L155 110 Z M160 110 L160 60 L170 60 L170 110 Z M185 110 L185 75 L200 75 L200 110 Z" fill="#1e293b"/>
  <!-- Police flashing light effect on wall -->
  <path d="M0 0 L140 0 L100 240 L0 240 Z" fill="url(#copGlow)"/>

  <!-- Interior Wall & Desk Setup -->
  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="45" width="35" height="65" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <line x1="25" y1="65" x2="60" y2="65" stroke="#334155" stroke-width="1"/>
  <line x1="25" y1="85" x2="60" y2="85" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="50" width="8" height="15" fill="#f59e0b" opacity="0.8"/>
  <rect x="40" y="53" width="6" height="12" fill="#38bdf8" opacity="0.8"/>
  
  <!-- Desk Surface -->
  <path d="M10 170 L230 170 L220 210 L20 210 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <rect x="10" y="165" width="220" height="6" rx="2" fill="#475569"/>

  <!-- Context Props on Desk -->
  <!-- Desk Lamp -->
  <path d="M45 165 L55 130 L65 165 Z" fill="#475569"/>
  <path d="M40 120 L70 120 L60 135 L50 135 Z" fill="#fbbf24"/>
  <path d="M55 135 L55 165" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="55" cy="170" rx="15" ry="3" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Coffee Mug -->
  <rect x="190" y="145" width="14" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M204 149 C210 149, 210 159, 204 159" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- MAIN CHARACTER: Distressed woman reporting harassment -->
  <g transform="translate(80, 75)">
    <!-- Body / Torso with anxious posture -->
    <path d="M40 70 C40 55, 60 50, 70 65 L85 95 L25 95 Z" fill="#ec4899" filter="url(#shadow)"/>
    
    <!-- Neck -->
    <path d="M50 45 L58 45 L58 55 L50 55 Z" fill="#fed7aa"/>

    <!-- Head showing distress/tension -->
    <circle cx="54" cy="32" r="18" fill="#fed7aa"/>
    
    <!-- Hair (Bob cut, slightly disheveled) -->
    <path d="M36 28 C36 15, 72 15, 72 28 C72 45, 68 50, 68 50 L64 35 C60 30, 48 30, 44 35 L40 50 C40 50, 36 40, 36 28 Z" fill="#334155"/>

    <!-- Facial Expression: Worried, calling police -->
    <path d="M46 28 Q50 25 54 28" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M58 28 Q62 25 66 28" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Worried Eyes -->
    <circle cx="50" cy="32" r="1.5" fill="#1e293b"/>
    <circle cx="62" cy="32" r="1.5" fill="#1e293b"/>
    <!-- Tense/Sad Eyebrows -->
    <path d="M48 25 L53 27" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M64 25 L59 27" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Open worried mouth -->
    <ellipse cx="56" cy="40" rx="3" ry="2" fill="#991b1b"/>

    <!-- Arms -->
    <!-- Left arm holding phone tightly to ear -->
    <path d="M42 60 L30 45 L42 35" stroke="#ec4899" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="45" r="5" fill="#fed7aa"/>

    <!-- Right arm tensed on desk -->
    <path d="M68 65 L85 85 L70 95" stroke="#ec4899" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="70" cy="95" r="5" fill="#fed7aa"/>

    <!-- Phone Device being held to ear -->
    <rect x="23" y="28" width="10" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-15 28 37)"/>
  </g>

  <!-- SECONDARY ELEMENT: Holographic / Visual representation of police call context -->
  <!-- Floating emergency alert glow near phone -->
  <circle cx="95" cy="85" r="25" fill="url(#phoneGlow)" filter="url(#shadow)"/>
  
  <!-- Stylized Emergency / Police shield indicator floating subtly -->
  <g transform="translate(140, 110)">
    <path d="M0 -15 L12 -22 L24 -15 L24 0 C24 12, 12 20, 12 22 C12 20, 0 12, 0 0 Z" fill="#ef4444" opacity="0.9" filter="url(#shadow)"/>
    <!-- Cross / Emergency symbol inside shield -->
    <rect x="10" y="-8" width="4" height="14" fill="#ffffff" rx="1"/>
    <rect x="5" y="-3" width="14" height="4" fill="#ffffff" rx="1"/>
  </g>

  <!-- Sound wave / call activity lines (representing reporting/talking to police) -->
  <path d="M115 90 Q125 95 115 100" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 85 Q132 95 120 105" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Foreground Atmospheric Details -->
  <!-- Small glowing particles for rich vector feel -->
  <circle cx="190" cy="190" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="140" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="110" cy="40" r="1.5" fill="#f43f5e" opacity="0.5"/>
</svg>