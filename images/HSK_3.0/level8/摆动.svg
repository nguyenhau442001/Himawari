<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Wall surface indication) -->
  <path d="M40 40H200" stroke="#262B35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M40 200H200" stroke="#262B35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Motion trajectory arcs showing "摆动" (swinging left and right) -->
  <path d="M 85 105 A 75 75 0 0 0 155 105" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.4"/>
  <path d="M 75 120 A 90 90 0 0 0 165 120" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 6" opacity="0.25"/>

  <!-- Wall Clock / Pendulum Clock body (Upper section hanging on wall) -->
  <circle cx="120" cy="55" r="32" fill="#2A303C" stroke="#374151" stroke-width="3"/>
  <!-- Clock face inner details -->
  <circle cx="120" cy="55" r="26" fill="#1A1D24"/>
  <!-- Clock hands -->
  <line x1="120" y1="55" x2="120" y2="42" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="55" x2="130" y2="58" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center pin -->
  <circle cx="120" cy="55" r="3" stroke="#F59E0B" stroke-width="1.5" fill="#2A303C"/>

  <!-- Suspension mount -->
  <rect x="116" y="83" width="8" height="6" rx="1" fill="#4B5563"/>

  <!-- SWINGING PENDULUM GROUP (Tilted to the left to capture action) -->
  <g transform="rotate(-18, 120, 89)">
    <!-- Rod -->
    <line x1="120" y1="89" x2="120" y2="165" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Highlight on rod for sleek flat design -->
    <line x1="119" y1="89" x2="119" y2="165" stroke="#FDE68A" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Golden Pendulum Bob (Noun object representing 摆动) -->
    <g transform="translate(120, 175)">
      <!-- Outer glow ring -->
      <circle cx="0" cy="0" r="18" fill="#F59E0B" opacity="0.15"/>
      <!-- Main golden bob -->
      <circle cx="0" cy="0" r="14" fill="#F59E0B"/>
      <!-- Inner reflective facet for depth -->
      <circle cx="-3" cy="-3" r="10" fill="#FBBF24"/>
      <circle cx="-5" cy="-5" r="4" fill="#FEF3C7" opacity="0.8"/>
      <!-- Center jewel / screw -->
      <circle cx="0" cy="0" r="4" fill="#D97706"/>
    </g>
  </g>

  <!-- Motion lines / wind trail on the right (emphasizing dynamic swing) -->
  <path d="M 148 135 C 153 145 155 155 152 165" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 156 142 C 160 150 161 158 159 166" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

</svg>