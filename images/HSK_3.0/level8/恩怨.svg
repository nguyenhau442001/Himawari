<svg width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping paths -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background Environment / Café Interior -->
  <g id="environment">
    <!-- Warm background light glow symbolizing peace/openness -->
    <circle cx="120" cy="110" r="90" fill="url(#warmLight)" filter="url(#softGlow)" />

    <!-- Window frame showing a soft evening city skyline or abstract warm bokeh -->
    <rect x="70" y="30" width="100" height="65" rx="8" fill="#0f172a" opacity="0.6" stroke="#475569" stroke-width="1.5" />
    <line x1="120" y1="30" x2="120" y2="95" stroke="#475569" stroke-width="1.5" />
    
    <!-- Soft glowing lights outside -->
    <circle cx="90" cy="55" r="3" fill="#fbbf24" opacity="0.5" />
    <circle cx="150" cy="70" r="2" fill="#38bdf8" opacity="0.4" />
    <circle cx="135" cy="45" r="2.5" fill="#f43f5e" opacity="0.4" />

    <!-- Indoor Plant for cozy atmosphere -->
    <path d="M 25 120 Q 20 100 30 85 Q 40 100 35 120 Z" fill="#10b981" opacity="0.8" />
    <path d="M 20 115 Q 10 105 18 90 Q 28 102 25 118 Z" fill="#059669" opacity="0.8" />
    <path d="M 32 118 Q 42 105 38 92 Q 28 105 34 120 Z" fill="#34d399" opacity="0.8" />
    <rect x="22" y="120" width="14" height="16" rx="3" fill="#cbd5e1" />

    <!-- Coffee Shop Table Surface -->
    <path d="M 30 160 L 210 160 L 195 205 L 45 205 Z" fill="url(#tableGrad)" />
    <ellipse cx="120" cy="160" rx="90" ry="10" fill="#64748b" opacity="0.4" />

    <!-- Central Table Props: Teacups and shared plate -->
    <ellipse cx="120" cy="170" rx="14" ry="6" fill="#cbd5e1" />
    <ellipse cx="120" cy="169" rx="11" ry="4" fill="url(#teaGrad)" />
    
    <ellipse cx="85" cy="175" rx="12" ry="5" fill="#e2e8f0" />
    <path d="M 93 173 C 98 173 98 178 93 178" stroke="#cbd5e1" stroke-width="1.5" fill="none" />

    <ellipse cx="155" cy="175" rx="12" ry="5" fill="#e2e8f0" />
    <path d="M 147 173 C 142 173 142 178 147 178" stroke="#cbd5e1" stroke-width="1.5" fill="none" />
  </g>

  <!-- Characters (Person Left & Person Right sharing a relaxed, open posture) -->
  <g id="characters">
    <!-- CHARACTER LEFT (Friendly pose, open gesture, smiling) -->
    <g id="character_left">
      <!-- Torso / Outfit -->
      <path d="M 55 185 L 75 140 L 95 185 Z" fill="#38bdf8" />
      <path d="M 68 140 L 82 140 L 85 160 L 65 160 Z" fill="#f8fafc" /> <!-- Collar -->
      
      <!-- Head & Neck -->
      <path d="M 72 135 L 78 135 L 80 142 L 70 142 Z" fill="#fdba74" />
      <circle cx="75" cy="118" r="16" fill="#fed7aa" />
      
      <!-- Hair (Stylized modern neat cut) -->
      <path d="M 59 118 C 59 104 69 101 78 102 C 87 103 91 110 91 118 C 88 112 80 110 75 110 C 69 110 62 112 59 118 Z" fill="#334155" />
      
      <!-- Facial Expression: Open, calm, smiling eyes, friendly mouth -->
      <!-- Eye (friendly arc) -->
      <path d="M 77 116 Q 81 113 85 116" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Smile -->
      <path d="M 78 124 Q 82 127 86 124" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <circle cx="88" cy="122" r="2.5" fill="#fb7185" opacity="0.4" /> <!-- Rosy cheek -->

      <!-- Relaxed Left Arm gesturing openly toward the center -->
      <path d="M 62 145 Q 52 155 58 165 Q 64 172 70 168" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="70" cy="168" r="3.5" fill="#fdba74" />
    </g>

    <!-- CHARACTER RIGHT (Friendly pose, nodding/relaxed, open expression) -->
    <g id="character_right">
      <!-- Torso / Outfit -->
      <path d="M 145 185 L 165 140 L 185 185 Z" fill="#fb923c" />
      <path d="M 158 140 L 172 140 L 175 160 L 155 160 Z" fill="#f8fafc" /> <!-- Collar -->
      
      <!-- Head & Neck -->
      <path d="M 162 135 L 168 135 L 170 142 L 160 142 Z" fill="#fbcfe8" />
      <circle cx="165" cy="118" r="16" fill="#fde68a" />
      
      <!-- Hair (Friendly wavy bob) -->
      <path d="M 148 116 C 148 102 158 100 166 100 C 178 100 182 110 182 122 C 182 122 178 128 174 120 C 170 112 165 112 160 115 C 153 118 148 120 148 116 Z" fill="#78350f" />
      
      <!-- Facial Expression: Warm, relaxed, receptive -->
      <!-- Eye -->
      <path d="M 155 116 Q 159 113 163 116" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Smile -->
      <path d="M 154 124 Q 158 127 162 124" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <circle cx="152" cy="122" r="2.5" fill="#fb7185" opacity="0.4" /> <!-- Rosy cheek -->

      <!-- Right Arm leaning comfortably on table -->
      <path d="M 178 145 Q 188 155 182 168 Q 176 175 168 172" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="168" cy="172" r="3.5" fill="#fde68a" />
    </g>

    <!-- Visual Metaphor for Peace / Harmony (Floating subtle warm sparkle, NO TEXT) -->
    <g id="harmony_sparkles" transform="translate(120, 100)">
      <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#fcd34d" opacity="0.8" transform="scale(0.6)" />
      <path d="M 25 -25 L 27 -20 L 32 -18 L 27 -16 L 25 -11 L 23 -16 L 18 -18 L 23 -20 Z" fill="#38bdf8" opacity="0.7" transform="scale(0.5)" />
      <path d="M -25 -20 L -23 -15 L -18 -13 L -23 -11 L -25 -6 L -27 -11 L -32 -13 L -27 -15 Z" fill="#10b981" opacity="0.7" transform="scale(0.5)" />
    </g>
  </g>
</svg>