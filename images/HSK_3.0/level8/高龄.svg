<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elderly Professor Character -->
  <g transform="translate(120, 180)">
    <!-- Body/Clothes -->
    <path d="M-40,0 L40,0 L30,-60 L-30,-60 Z" fill="#34495E"/>
    <path d="M-30,-60 L0,-90 L30,-60 Z" fill="#2C3E50"/>
    
    <!-- Neck -->
    <rect x="-8" y="-95" width="16" height="15" fill="#E6B8A2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-120" r="25" fill="#E6B8A2"/>
    
    <!-- Hair (White/Grey for "High Age") -->
    <path d="M-25,-120 A25,25 0 0,1 25,-120 L25,-135 A25,25 0 0,0 -25,-135 Z" fill="#BDC3C7"/>
    
    <!-- Glasses -->
    <circle cx="-10" cy="-125" r="6" fill="none" stroke="#F1C40F" stroke-width="2"/>
    <circle cx="10" cy="-125" r="6" fill="none" stroke="#F1C40F" stroke-width="2"/>
    <line x1="-4" y1="-125" x2="4" y2="-125" stroke="#F1C40F" stroke-width="2"/>
    
    <!-- Beard (Visual cue for advanced age) -->
    <path d="M-10,-110 Q0,-100 10,-110 L0,-95 Z" fill="#BDC3C7"/>
  </g>
  
  <!-- Walking Cane (Iconic symbol of advanced age) -->
  <path d="M160,180 L160,100 A15,15 0 0,0 130,100" fill="none" stroke="#E67E22" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Book (Contextual reference to "reading/writing") -->
  <rect x="50" y="150" width="40" height="30" rx="2" fill="#F39C12"/>
  <line x1="55" y1="160" x2="85" y2="160" stroke="#1A1D24" stroke-width="2"/>
  <line x1="55" y1="170" x2="85" y2="170" stroke="#1A1D24" stroke-width="2"/>
</svg>