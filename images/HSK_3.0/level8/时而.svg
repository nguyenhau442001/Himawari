<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Left Side: Sunny (时而晴朗) -->
  <g transform="translate(65, 120)">
    <!-- Sun Ray Glow/Background -->
    <circle cx="0" cy="0" r="32" fill="#FFB703" opacity="0.15"/>
    
    <!-- Sun Rays -->
    <g stroke="#FFB703" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-42" x2="0" y2="-34"/>
      <line x1="0" y1="34" x2="0" y2="42"/>
      <line x1="-42" y1="0" x2="-34" y2="0"/>
      <line x1="34" y1="0" x2="42" y2="0"/>
      <line x1="-30" y1="-30" x2="-24" y2="-24"/>
      <line x1="24" y1="24" x2="30" y2="30"/>
      <line x1="30" y1="-30" x2="24" y2="-24"/>
      <line x1="-30" y1="30" x2="-24" y2="24"/>
    </g>

    <!-- Sun Core -->
    <circle cx="0" cy="0" r="24" fill="#FFB703"/>
    <circle cx="-6" cy="-6" r="4" fill="#FFE169" opacity="0.6"/>
  </g>

  <!-- Divider / Alternation Indicator -->
  <g transform="translate(120, 120)">
    <path d="M -8 -20 C 15 -10, 15 10, -8 20" fill="none" stroke="#E0E6ED" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <polygon points="-4,-22 4,-18 -4,-14" fill="#E0E6ED" opacity="0.4"/>
    <polygon points="-4,14 4,18 -4,22" fill="#E0E6ED" opacity="0.4"/>
  </g>

  <!-- Right Side: Cloudy (时而多云) -->
  <g transform="translate(175, 120)">
    <!-- Cloud Background Glow -->
    <circle cx="0" cy="0" r="35" fill="#3A86EF" opacity="0.1"/>

    <!-- Cloud Graphic -->
    <path d="M -22 10 
             L 20 10 
             C 28 10, 32 4, 28 -2 
             C 32 -10, 24 -18, 14 -16 
             C 10 -24, -2 -22, -6 -16 
             C -16 -18, -26 -10, -22 -2 
             C -28 0, -28 8, -22 10 Z" 
          fill="#E0E6ED"/>
          
    <!-- Secondary overlapping smaller cloud for depth -->
    <path d="M 4 16 
             L 28 16 
             C 32 16, 35 12, 32 8 
             C 35 4, 29 0, 23 2 
             C 19 -2, 10 0, 8 6 
             C 3 4, -1 9, 4 16 Z" 
          fill="#8E9AAF" opacity="0.8"/>
  </g>

  <!-- Accent Focus Frame / Boundary -->
  <rect x="24" y="24" width="192" height="192" rx="16" fill="none" stroke="#3A86EF" stroke-width="1.5" opacity="0.3"/>
</svg>