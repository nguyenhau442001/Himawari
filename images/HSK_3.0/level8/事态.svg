<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for modern UI feel -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>
  <path d="M60 160 Q 120 160 180 120" stroke="#2F3646" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Central Physical/Tactile Object representing "Situation/Event Object" (事态) evolving positively -->
  <!-- Base platform/nodes representing the situation -->
  <g transform="translate(0, 10)">
    <!-- Upward rising trajectory line -->
    <path d="M 68 140 C 90 140, 100 110, 120 95 C 140 80, 150 65, 172 50" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Glow under trajectory -->
    <path d="M 68 140 C 90 140, 100 110, 120 95 C 140 80, 150 65, 172 50" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" opacity="0.15"/>

    <!-- Milestone nodes representing unfolding state/situation -->
    <!-- Node 1 (Past/Start) -->
    <circle cx="68" cy="140" r="6" fill="#3B82F6"/>
    <circle cx="68" cy="140" r="10" fill="#3B82F6" opacity="0.3"/>

    <!-- Node 2 (Middle) -->
    <circle cx="120" cy="95" r="8" fill="#3B82F6"/>
    <circle cx="120" cy="95" r="14" fill="#3B82F6" opacity="0.3"/>

    <!-- Node 3 (Peak/Good direction - Golden Accent) -->
    <circle cx="172" cy="50" r="10" fill="#F59E0B"/>
    <circle cx="172" cy="50" r="18" fill="#F59E0B" opacity="0.3"/>
    <circle cx="172" cy="50" r="4" fill="#FFFFFF"/>

    <!-- Central physical conceptual object: A floating layered holographic artifact / dossier box unfolding positively -->
    <g transform="translate(100, 100)">
      <!-- Main body (isometric-ish flat card) -->
      <polygon points="0,25 30,10 60,25 30,40" fill="#3B82F6" opacity="0.8"/>
      <polygon points="0,25 0,45 30,60 30,40" fill="#1D4ED8" opacity="0.8"/>
      <polygon points="60,25 60,45 30,60 30,40" fill="#2563EB" opacity="0.8"/>
      
      <!-- Floating positive element emerging from the situation -->
      <g transform="translate(15, -15)">
        <polygon points="15,0 30,15 15,30 0,15" fill="#F59E0B"/>
        <!-- Star highlight inside -->
        <path d="M15 8 L17 13 L22 15 L17 17 L15 22 L13 17 L8 15 L13 13 Z" fill="#FFFFFF" opacity="0.9"/>
      </g>
    </g>

    <!-- Additional supporting floating UI elements (clean, abstract representation of status tracking) -->
    <rect x="52" y="170" width="136" height="6" rx="3" fill="#2F3646"/>
    <rect x="52" y="170" width="95" height="6" rx="3" fill="#10B981"/>
  </g>
</svg>