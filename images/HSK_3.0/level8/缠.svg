<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Definition for "chán" (quấn quanh, quấn chặt / ivy wrapped around a wooden pillar) -->
  <g transform="translate(0, 0)">
    <!-- Wooden Pillar (Vertical element) -->
    <rect x="104" y="36" width="32" height="168" rx="4" fill="#3E2723"/>
    <!-- Pillar Wood Grain / Highlights -->
    <rect x="110" y="36" width="4" height="168" fill="#5D4037" opacity="0.6"/>
    <rect x="126" y="36" width="6" height="168" fill="#2E1A17" opacity="0.7"/>
    <!-- Pillar Metal Caps (Top and Bottom) -->
    <rect x="100" y="32" width="40" height="8" rx="2" fill="#78909C"/>
    <rect x="100" y="200" width="40" height="8" rx="2" fill="#78909C"/>

    <!-- Ivy Vines (纏绕 - Tight wrapping, dynamic curves) -->
    <!-- Vine Layer Behind or Intertwined -->
    <path d="M 120 48 Q 150 70 120 92 Q 90 114 120 136 Q 150 158 120 180" fill="none" stroke="#2E7D32" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Primary Vibrant Green Vines Wrapping Tightly -->
    <path d="M 120 38 Q 80 60 120 82 Q 160 104 120 126 Q 80 148 120 170 Q 160 192 120 204" fill="none" stroke="#4CAF50" stroke-width="9" stroke-linecap="round"/>

    <!-- Accent Highlights on Vines -->
    <path d="M 120 38 Q 80 60 120 82" fill="none" stroke="#81C784" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 120 126 Q 80 148 120 170" fill="none" stroke="#81C784" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Lush Ivy Leaves (Heart-shaped, characteristic of ivy) -->
    <!-- Leaf 1 (Top Left) -->
    <g transform="translate(78, 55) rotate(-25)">
      <path d="M 0 0 C -12 -12, -16 12, 0 20 C 16 12, 12 -12, 0 0 Z" fill="#66BB6A"/>
      <path d="M 0 4 L 0 16" stroke="#2E7D32" stroke-width="1.5"/>
    </g>

    <!-- Leaf 2 (Mid Right) -->
    <g transform="translate(162, 95) rotate(35)">
      <path d="M 0 0 C -14 -14, -18 14, 0 22 C 18 14, 14 -14, 0 0 Z" fill="#4CAF50"/>
      <path d="M 0 4 L 0 18" stroke="#1B5E20" stroke-width="1.5"/>
    </g>

    <!-- Leaf 3 (Lower Left) -->
    <g transform="translate(74, 135) rotate(-40)">
      <path d="M 0 0 C -14 -14, -18 14, 0 22 C 18 14, 14 -14, 0 0 Z" fill="#81C784"/>
      <path d="M 0 4 L 0 18" stroke="#2E7D32" stroke-width="1.5"/>
    </g>

    <!-- Leaf 4 (Bottom Right) -->
    <g transform="translate(158, 175) rotate(20)">
      <path d="M 0 0 C -12 -12, -16 12, 0 20 C 16 12, 12 -12, 0 0 Z" fill="#66BB6A"/>
      <path d="M 0 4 L 0 16" stroke="#1B5E20" stroke-width="1.5"/>
    </g>

    <!-- Leaf 5 (Top Center Accent - Gold/Orange high contrast focus as per rules) -->
    <g transform="translate(122, 22) rotate(10)">
      <path d="M 0 0 C -10 -10, -12 10, 0 16 C 12 10, 10 -10, 0 0 Z" fill="#FFB300"/>
      <path d="M 0 3 L 0 13" stroke="#E65100" stroke-width="1.5"/>
    </g>
  </g>
</svg>