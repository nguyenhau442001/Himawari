<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Lake Water Gradient (Clear / Transparent look) -->
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Sunbeam Gradient -->
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Clip Path for Lake Surface -->
    <clipPath id="lakeClip">
      <path d="M 0 110 Q 60 100, 120 110 Q 180 120, 240 110 L 240 220 Q 120 235, 0 220 Z"/>
    </clipPath>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- DISTANT ENVIRONMENT (Background Mountains & Trees) -->
  <path d="M 0 115 L 40 85 L 85 115 L 140 80 L 190 112 L 240 88 L 240 120 L 0 120 Z" fill="#334155" opacity="0.6"/>
  <!-- Pine trees on distant shore -->
  <path d="M 35 115 L 40 95 L 45 115 Z" fill="#1e293b"/>
  <path d="M 80 115 L 85 90 L 90 115 Z" fill="#1e293b"/>
  <path d="M 185 115 L 190 92 L 195 115 Z" fill="#1e293b"/>

  <!-- SUN & SKY DETAILS -->
  <circle cx="190" cy="50" r="18" fill="#fbbf24" opacity="0.9"/>
  <circle cx="190" cy="50" r="26" fill="#f59e0b" opacity="0.3"/>

  <!-- WOODEN DOCK / PIER (Foreground Context) -->
  <rect x="0" y="115" width="110" height="15" fill="#78350f" rx="2"/>
  <line x1="20" y1="115" x2="20" y2="130" stroke="#451a03" stroke-width="3"/>
  <line x1="60" y1="115" x2="60" y2="130" stroke="#451a03" stroke-width="3"/>
  <line x1="100" y1="115" x2="100" y2="130" stroke="#451a03" stroke-width="3"/>
  <!-- Dock planks detail -->
  <line x1="30" y1="115" x2="30" y2="130" stroke="#92400e" stroke-width="1"/>
  <line x1="75" y1="115" x2="75" y2="130" stroke="#92400e" stroke-width="1"/>

  <!-- CHARACTER CROUCHING ON DOCK (Looking into the clear water) -->
  <!-- Torso & Head -->
  <path d="M 65 115 C 60 100, 75 90, 85 95 C 95 100, 95 115, 95 115 Z" fill="#ec4899"/> <!-- Hoodie/Shirt -->
  <circle cx="92" cy="85" r="9" fill="#fbcfe8"/> <!-- Head -->
  <!-- Hair -->
  <path d="M 83 83 C 85 76, 98 78, 99 87 C 95 85, 87 85, 83 83 Z" fill="#78350f"/>
  <!-- Arm pointing down into water -->
  <path d="M 80 105 L 105 118" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs crouching -->
  <path d="M 68 112 C 60 115, 55 120, 68 122 C 75 123, 80 118, 80 115" fill="#1e293b"/>

  <!-- LAKE SURFACE & UNDERWATER WORLD (CLIPPED) -->
  <g clip-path="url(#lakeClip)">
    <!-- Deep Water Background -->
    <rect x="0" y="100" width="240" height="140" fill="url(#lakeWater)"/>

    <!-- Sunbeams piercing through clear water -->
    <polygon points="80,110 110,110 160,220 120,220" fill="url(#sunbeam)"/>
    <polygon points="120,110 140,110 200,220 170,220" fill="url(#sunbeam)"/>

    <!-- LAKEBED (Visibly seen because water is "Qīngchè") -->
    <!-- Sandy bottom mounds -->
    <path d="M -10 220 Q 50 195, 120 210 Q 190 225, 250 205 L 250 240 L -10 240 Z" fill="#b45309" opacity="0.85"/>
    <path d="M 60 220 Q 110 205, 180 215 Q 230 220, 260 210 L 260 240 L 60 240 Z" fill="#d97706" opacity="0.7"/>

    <!-- Lakebed Details: Smooth Colorful Pebbles -->
    <circle cx="40" cy="215" r="7" fill="#cbd5e1"/>
    <circle cx="55" cy="220" r="5" fill="#f8fafc"/>
    <circle cx="95" cy="212" r="8" fill="#94a3b8"/>
    <circle cx="108" cy="218" r="6" fill="#e2e8f0"/>
    <circle cx="150" cy="216" r="9" fill="#cbd5e1"/>
    <circle cx="168" cy="222" r="5" fill="#f1f5f9"/>
    <circle cx="205" cy="214" r="7" fill="#94a3b8"/>
    <circle cx="218" cy="219" r="4" fill="#e2e8f0"/>
    <circle cx="25" cy="222" r="5" fill="#64748b"/>

    <!-- Aquatic Plants rooted in the bottom -->
    <path d="M 30 215 Q 25 180, 35 150" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 35 190 Q 28 175, 22 165" fill="#34d399"/>
    <path d="M 35 180 Q 42 165, 48 155" fill="#34d399"/>

    <path d="M 180 218 Q 185 185, 175 155" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 178 195 Q 168 180, 160 170" fill="#10b981"/>
    <path d="M 179 180 Q 189 165, 198 155" fill="#10b981"/>

    <!-- Happy Fish Swimming Clearly Visible -->
    <!-- Fish 1 (Orange/Gold) -->
    <g transform="translate(110, 160)">
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#fb923c"/>
      <polygon points="-12,0 -20,-6 -16,0 -20,6" fill="#fb923c"/>
      <circle cx="6" cy="-2" r="1.5" fill="#0f172a"/>
      <path d="M 0 -8 Q 4 -12, 8 -8" stroke="#ea580c" stroke-width="2" fill="none"/>
    </g>

    <!-- Fish 2 (Teal/Cyan) -->
    <g transform="translate(70, 190) scale(0.7)">
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#38bdf8"/>
      <polygon points="-12,0 -22,-7 -16,0 -22,7" fill="#38bdf8"/>
      <circle cx="6" cy="-2" r="1.5" fill="#0f172a"/>
    </g>

    <!-- Fish 3 (Pink) -->
    <g transform="translate(160, 185) scale(0.8)">
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#f43f5e"/>
      <polygon points="-12,0 -20,-6 -16,0 -20,6" fill="#f43f5e"/>
      <circle cx="6" cy="-2" r="1.5" fill="#0f172a"/>
    </g>

    <!-- Tiny Bubbles rising -->
    <circle cx="115" cy="140" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="118" cy="130" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="116" cy="122" r="1" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- FOREGROUND / WATER SURFACE RIPPLES -->
  <path d="M 0 110 Q 60 102, 120 110 Q 180 118, 240 110" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 40 114 Q 90 107, 150 114" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 120 112 Q 170 106, 220 112" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Ripple rings around where the character points -->
  <ellipse cx="105" cy="118" rx="8" ry="3" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="105" cy="118" rx="15" ry="6" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

  <!-- LILY PADS ON SURFACE -->
  <g transform="translate(195, 120)">
    <path d="M 0 0 C 10 -5, 12 5, 0 8 C -10 5, -8 -5, 0 0 Z" fill="#059669"/>
    <circle cx="3" cy="2" r="3" fill="#fda4af"/> <!-- Tiny flower -->
  </g>
  <g transform="translate(25, 125) scale(0.7)">
    <path d="M 0 0 C 10 -5, 12 5, 0 8 C -10 5, -8 -5, 0 0 Z" fill="#047857"/>
  </g>

  <!-- BORDER / FRAME OVERLAY (Modern Rounded Card Style) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
</svg>