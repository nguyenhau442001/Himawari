<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing the concept of care and support for an AIDS patient -->
  <!-- Two figures: one standing, one seated, representing support and dignity -->
  
  <!-- Seated figure (Patient) -->
  <path d="M80 180c0-20 15-35 35-35s35 15 35 35v40H80v-40z" fill="#5D6D7E"/>
  <circle cx="115" cy="140" r="15" fill="#BDC3C7"/>
  
  <!-- Standing figure (Supporter/Caregiver) -->
  <path d="M160 190c0-25 20-45 45-45s45 20 45 45v30h-90v-30z" fill="#34495E"/>
  <circle cx="205" cy="135" r="18" fill="#E67E22"/>
  
  <!-- Interaction: Hand on shoulder representing care and non-discrimination -->
  <path d="M175 155c-5 0-10 5-10 10s5 10 10 10 10-5 10-10-5-10-10-10z" fill="#E67E22"/>
  <path d="M165 165l-15 10" stroke="#E67E22" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Ground line -->
  <path d="M40 220h160" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
</svg>