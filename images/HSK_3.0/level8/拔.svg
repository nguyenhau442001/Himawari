<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Soil layer / Field ground -->
  <path d="M 40,150 L 200,150 C 200,150 210,200 200,210 C 190,220 50,220 40,210 C 30,200 40,150 40,150 Z" fill="#2C2421" />
  <path d="M 45,150 C 70,145 170,145 195,150 C 205,170 205,200 195,210 C 180,220 60,220 45,210 C 35,200 35,170 45,150 Z" fill="#3E322C" />
  
  <!-- Action motion lines / upward force -->
  <g opacity="0.4">
    <path d="M 120,95 L 120,65" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    <path d="M 100,105 L 90,85" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />
    <path d="M 140,105 L 150,85" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />
  </g>

  <!-- Radish / White Turnip being pulled (Centerpiece) -->
  <g transform="translate(120, 115)">
    <!-- Radish body (fresh white & pinkish bottom) -->
    <path d="M -18,-15 C -22,10 -15,35 0,55 C 15,35 22,10 18,-15 Z" fill="#F5F5F7" />
    <path d="M -10,35 C 0,50 5,55 0,55 C -5,55 -8,45 -10,35 Z" fill="#FF8A65" opacity="0.8" />
    
    <!-- Radish texture lines -->
    <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#E0E0E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-15" y1="10" x2="15" y2="10" stroke="#E0E0E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-10" y1="25" x2="10" y2="25" stroke="#E0E0E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Radish leafy green top -->
    <path d="M 0,-15 C -15,-35 -30,-45 -40,-45 C -25,-25 -10,-20 0,-15 Z" fill="#66BB6A" />
    <path d="M 0,-15 C -10,-40 -15,-55 -25,-60 C -10,-45 -5,-30 0,-15 Z" fill="#81C784" />
    <path d="M 0,-15 C 10,-40 15,-55 25,-60 C 10,-45 5,-30 0,-15 Z" fill="#81C784" />
    <path d="M 0,-15 C 15,-35 30,-45 40,-45 C 25,-25 10,-20 0,-15 Z" fill="#66BB6A" />
    <path d="M 0,-15 C 0,-45 0,-65 0,-70 C 0,-55 -2,-30 0,-15 Z" fill="#A5D6A7" />
  </g>

  <!-- Soil particles flying up -->
  <circle cx="105" cy="130" r="3" fill="#5D4037" />
  <circle cx="138" cy="125" r="2.5" fill="#5D4037" />
  <circle cx="112" cy="140" r="2" fill="#5D4037" />
  <circle cx="130" cy="138" r="3.5" fill="#4E342E" />

  <!-- Hands pulling upward (Representing the act of "bá" - pulling out) -->
  <g>
    <!-- Left Hand -->
    <path d="M 85,135 C 80,120 90,105 105,100 L 115,115 C 105,120 100,130 100,140 Z" fill="#FFCCBC" />
    <path d="M 92,108 C 97,106 102,108 105,112 C 102,114 97,113 92,108 Z" fill="#FFAB91" />
    <!-- Left sleeve -->
    <path d="M 75,140 L 90,130 L 98,145 L 83,155 Z" fill="#42A5F5" />
    
    <!-- Right Hand -->
    <path d="M 155,135 C 160,120 150,105 135,100 L 125,115 C 135,120 140,130 140,140 Z" fill="#FFCCBC" />
    <path d="M 148,108 C 143,106 138,108 135,112 C 138,114 143,113 148,108 Z" fill="#FFAB91" />
    <!-- Right sleeve -->
    <path d="M 165,140 L 150,130 L 142,145 L 157,155 Z" fill="#42A5F5" />
  </g>

  <!-- Morning dew / freshness accent -->
  <circle cx="100" cy="55" r="3" fill="#80D8FF" opacity="0.8" />
  <circle cx="145" cy="50" r="2" fill="#80D8FF" opacity="0.8" />
  <circle cx="120" cy="40" r="2.5" fill="#80D8FF" opacity="0.8" />
</svg>