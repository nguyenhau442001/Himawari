<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Sky gradient representing an expansive open sky at golden hour/dusk -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="75%" stop-color="#3b3a60" />
      <stop offset="100%" stop-color="#6d4c41" />
    </linearGradient>

    <!-- Warm sun/glow gradient -->
    <radialGradient id="sunGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain range gradients for depth -->
    <linearGradient id="mountainsFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mountainsNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Eagle gradient -->
    <linearGradient id="eagleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Eagle head gradient (white feather cap) -->
    <linearGradient id="eagleHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Full bleed background container -->
  <rect width="240" height="240" rx="24" fill="#0f172a" />

  <!-- Sky background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Atmospheric clouds (stylized sweeping vectors) -->
  <path d="M-20 110 Q 20 95, 60 105 Q 90 90, 130 100 Q 180 85, 230 110 L 240 130 L -20 130 Z" fill="#ffffff" fill-opacity="0.04" />
  <path d="M 40 70 Q 70 55, 110 65 Q 150 50, 190 65 Q 220 58, 250 70 L 250 90 L 30 90 Z" fill="#ffffff" fill-opacity="0.06" />

  <!-- Distant mountain layer -->
  <path d="M-10 180 L 35 130 L 80 170 L 140 120 L 200 175 L 250 140 L 250 200 L -10 200 Z" fill="url(#mountainsFar)" />

  <!-- Closer mountain/hill layer with pine trees silhouettes -->
  <path d="M-10 190 L 50 150 L 95 185 L 160 145 L 210 180 L 250 160 L 250 220 L -10 220 Z" fill="url(#mountainsNear)" />
  
  <!-- Tiny pine tree silhouettes on ridges for rich context and scale -->
  <path d="M 45 150 L 50 140 L 55 150 Z M 52 153 L 55 144 L 58 153 Z M 155 145 L 160 133 L 165 145 Z M 162 147 L 165 137 L 168 147 Z" fill="#0f172a" />

  <!-- Majestic Eagle soaring in the sky (Central Subject representing 飞翔 - fēixiáng) -->
  <g transform="translate(15, -5)">
    <!-- Dynamic gliding wings with stylized feather layering -->
    <!-- Left Wing (Viewer's left, Eagle's right) -->
    <path d="M 115 95 C 95 85, 60 70, 30 50 C 15 40, 10 45, 18 58 C 30 75, 65 105, 95 115 Z" fill="#78350f" />
    <path d="M 115 95 C 90 90, 60 80, 35 68 C 25 63, 22 68, 30 75 C 50 90, 80 112, 105 118 Z" fill="#451a03" />

    <!-- Right Wing (Viewer's right, Eagle's left - swept back grandly) -->
    <path d="M 135 95 C 160 80, 200 55, 220 35 C 230 25, 235 32, 225 45 C 205 65, 175 100, 145 118 Z" fill="#92400e" />
    <path d="M 135 95 C 160 88, 190 70, 215 52 C 223 45, 225 50, 218 58 C 195 78, 170 102, 145 118 Z" fill="#78350f" />

    <!-- Eagle Body and Tail -->
    <path d="M 110 90 Q 125 80, 140 90 Q 155 110, 150 135 Q 140 155, 130 165 Q 120 155, 115 135 Q 110 110, 110 90 Z" fill="url(#eagleBody)" />
    <!-- Tail feathers fan -->
    <path d="M 120 150 L 115 175 L 125 168 L 135 175 L 130 150 Z" fill="#291102" />

    <!-- Eagle Head & Sharp Beak -->
    <path d="M 125 75 C 120 70, 118 62, 125 58 C 135 55, 145 62, 142 72 Z" fill="url(#eagleHead)" />
    <!-- Yellow sharp hooked beak -->
    <path d="M 142 66 L 155 70 L 145 76 Z" fill="#f59e0b" />
    <!-- Fierce eye -->
    <circle cx="136" cy="65" r="2.5" fill="#0f172a" />
    <circle cx="137" cy="64.5" r="0.8" fill="#ffffff" />
  </g>

  <!-- Soaring wind currents / motion lines to emphasize flight (飞翔 action) -->
  <path d="M 20 110 Q 50 118, 70 112" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M 175 90 Q 195 95, 210 88" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M 15 115 Q 30 120, 45 116" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- Foreground ambient floating particles / dust catching golden light -->
  <circle cx="50" cy="140" r="1.5" fill="#fde047" opacity="0.7" />
  <circle cx="90" cy="120" r="1" fill="#fde047" opacity="0.5" />
  <circle cx="180" cy="135" r="2" fill="#fde047" opacity="0.8" />
  <circle cx="205" cy="115" r="1" fill="#fde047" opacity="0.6" />
  <circle cx="80" cy="70" r="1.5" fill="#fde047" opacity="0.4" />

  <!-- Bottom atmospheric ground silhouette/horizon to anchor the expansive sky scene -->
  <path d="M 0 220 L 240 220 L 240 240 L 0 240 Z" fill="#090d16" />
  <path d="M 0 220 Q 80 215, 240 222 L 240 240 L 0 240 Z" fill="#0f172a" />

  <!-- Decorative clean inset border matching dark-mode aesthetic -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
</svg>