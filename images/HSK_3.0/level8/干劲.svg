<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="energyGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Energy Glow Effect behind team -->
  <ellipse cx="120" cy="140" rx="90" ry="60" fill="url(#energyGlow)"/>

  <!-- Background Office Environment / Context Props -->
  <!-- Window showing night/evening city lights -->
  <rect x="25" y="35" width="45" height="65" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="31" y="41" width="15" height="25" fill="#38bdf8" opacity="0.2"/>
  <rect x="50" y="41" width="15" height="25" fill="#f59e0b" opacity="0.2"/>
  <rect x="31" y="69" width="15" height="25" fill="#f59e0b" opacity="0.2"/>
  <rect x="50" y="69" width="15" height="25" fill="#38bdf8" opacity="0.2"/>

  <!-- Whiteboard / Design board with colorful post-its & charts -->
  <rect x="85" y="30" width="130" height="70" rx="6" fill="#334155" opacity="0.4"/>
  <!-- Chart lines -->
  <polyline points="95,85 110,70 125,75 145,55 165,60 190,45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="145" cy="55" r="3" fill="#10b981"/>
  <circle cx="190" cy="45" r="3" fill="#10b981"/>
  <!-- Sticky notes -->
  <rect x="195" y="40" width="14" height="14" rx="2" fill="#fbbf24" opacity="0.8"/>
  <rect x="175" y="75" width="14" height="14" rx="2" fill="#ec4899" opacity="0.8"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M120,0 L120,35" stroke="#64748b" stroke-width="2"/>
  <path d="M100,35 L140,35 L145,45 L95,45 Z" fill="#fbbf24"/>
  <!-- Lamp light cone -->
  <polygon points="120,45 60,180 180,180" fill="#fbbf24" opacity="0.06"/>

  <!-- Main Work Desk Surface -->
  <path d="M15,170 L225,170 L210,215 L30,215 Z" fill="url(#deskGrad)"/>
  <rect x="15" y="165" width="210" height="7" rx="3" fill="#475569"/>

  <!-- Desk Props (Laptops, Coffee Mugs, Papers) -->
  <!-- Laptop Left -->
  <path d="M35,160 L65,160 L70,172 L30,172 Z" fill="#94a3b8"/>
  <path d="M40,140 L60,140 L65,160 L35,160 Z" fill="#cbd5e1"/>
  <rect x="43" y="143" width="17" height="15" rx="1" fill="#0f172a"/>
  <!-- Coffee Mug -->
  <rect x="195" y="152" width="12" height="16" rx="2" fill="#ec4899"/>
  <path d="M207,155 C212,155 212,165 207,165" fill="none" stroke="#ec4899" stroke-width="2"/>
  <path d="M198,148 C199,145 201,145 202,148" fill="none" stroke="#f1f5f9" stroke-width="1.5" opacity="0.6"/>

  <!-- Character 1 (Left - Woman typing enthusiastically with bright expression) -->
  <g transform="translate(45, 105)">
    <!-- Body & Torso -->
    <path d="M15,35 Q25,20 40,25 L50,65 L5,65 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="30" cy="12" r="13" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M17,10 Q20,-2 32,2 Q44,6 43,18 L38,18 Q35,8 28,8 Q20,8 18,15 Z" fill="#334155"/>
    <!-- Expression - Determined/Happy eyes -->
    <path d="M24,12 Q27,9 30,12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32,12 Q35,9 38,12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M29,16 Q31,19 33,16" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arms in active typing motion -->
    <path d="M15,35 L5,48 L15,52" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45,35 L55,45 L45,50" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hands -->
    <circle cx="15" cy="52" r="3.5" fill="#fcd34d"/>
    <circle cx="45" cy="50" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Character 2 (Center - Man leaning forward energetically, pointing at screen/ideas) -->
  <g transform="translate(100, 95)">
    <!-- Body & Torso -->
    <path d="M15,40 Q25,25 40,30 L55,75 L5,75 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="33" cy="15" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M19,15 Q22,2 35,5 Q46,8 45,20 L40,20 Q38,10 30,10 Q22,10 21,16 Z" fill="#1e293b"/>
    <!-- Expression - Passionate/Focused -->
    <path d="M26,13 L31,15" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M35,15 L40,13" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M31,19 Q33,22 35,19" fill="#e11d48"/>
    <!-- Raised Energetic Arm pointing forward -->
    <path d="M42,38 Q55,25 65,30" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <circle cx="65" cy="30" r="4" fill="#fcd34d"/>
    <!-- Left Arm -->
    <path d="M18,40 L10,58 L20,62" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="62" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Character 3 (Right - Woman holding tablet, smiling brightly with high motivation) -->
  <g transform="translate(155, 100)">
    <!-- Body & Torso -->
    <path d="M15,38 Q25,23 38,28 L50,70 L8,70 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="28" cy="13" r="13" fill="#fcd34d"/>
    <!-- Hair (Ponytail style) -->
    <path d="M15,10 Q20,-1 30,3 Q40,7 38,18 L44,12 Q48,15 45,22 Q40,16 35,15 Z" fill="#7c2d12"/>
    <!-- Expression - Confident smile -->
    <path d="M22,12 Q24,10 26,12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M30,12 Q32,10 34,12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M25,16 Q28,20 31,16" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tablet / Notepad in hands -->
    <rect x="25" y="42" width="22" height="28" rx="2" fill="#f8fafc" transform="rotate(-10 25 42)"/>
    <line x1="29" y1="48" x2="41" y2="46" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="53" x2="38" y2="51" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M15,38 L25,48 L30,42" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38,36 L45,46" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Energy Symbols denoting "干劲" (Drive, Enthusiasm, Vigor) -->
  <g transform="translate(0, 0)">
    <!-- Sparkle 1 near top left character -->
    <path d="M35,90 Q35,98 27,98 Q35,98 35,106 Q35,98 43,98 Q35,98 35,90 Z" fill="#fbbf24"/>
    <!-- Sparkle 2 near center character -->
    <path d="M110,75 Q110,84 101,84 Q110,84 110,93 Q110,84 119,84 Q110,84 110,75 Z" fill="#38bdf8"/>
    <!-- Sparkle 3 near right character -->
    <path d="M185,85 Q185,92 178,92 Q185,92 185,99 Q185,92 192,92 Q185,92 185,85 Z" fill="#f43f5e"/>
    <!-- Small floating energetic dots -->
    <circle cx="75" cy="80" r="2.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="145" cy="70" r="2" fill="#34d399" opacity="0.9"/>
    <circle cx="130" cy="115" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="90" cy="125" r="2" fill="#f472b6" opacity="0.9"/>
  </g>
</svg>