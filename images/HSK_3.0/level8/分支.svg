<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main Trunk -->
  <path d="M120 180 L120 100" stroke="#F39C12" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Left Branch -->
  <path d="M120 120 L80 80" stroke="#F39C12" stroke-width="8" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="12" fill="#3498DB"/>
  
  <!-- Right Branch -->
  <path d="M120 120 L160 80" stroke="#F39C12" stroke-width="8" stroke-linecap="round"/>
  <circle cx="160" cy="80" r="12" fill="#3498DB"/>
  
  <!-- Top Branch -->
  <path d="M120 100 L120 60" stroke="#F39C12" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="60" r="12" fill="#3498DB"/>
  
  <!-- Base -->
  <circle cx="120" cy="180" r="14" fill="#F39C12"/>
</svg>