<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stack of thick currency bundles -->
  <g transform="translate(60, 80)">
    <!-- Bottom bundle -->
    <rect x="0" y="40" width="120" height="40" rx="4" fill="#B8860B"/>
    <rect x="5" y="45" width="110" height="30" rx="2" fill="#FFD700"/>
    
    <!-- Middle bundle -->
    <rect x="10" y="20" width="120" height="40" rx="4" fill="#DAA520"/>
    <rect x="15" y="25" width="110" height="30" rx="2" fill="#FFD700"/>
    
    <!-- Top bundle -->
    <rect x="20" y="0" width="120" height="40" rx="4" fill="#FFD700"/>
    <rect x="25" y="5" width="110" height="30" rx="2" fill="#FFFACD"/>
    
    <!-- Decorative band on top bundle -->
    <rect x="70" y="0" width="20" height="40" fill="#B8860B" fill-opacity="0.3"/>
  </g>
  
  <!-- Upward arrow indicating high amount -->
  <path d="M190 120 L210 100 L230 120 M210 100 L210 180" stroke="#FFD700" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>