<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lab Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing White Powder Gradient -->
    <radialGradient id="powderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="60%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0" />
    </radialGradient>

    <!-- Character Lab Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glass Flask Shading -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Lab Setting -->
  <g id="environment">
    <!-- Laboratory Back Wall Elements -->
    <rect x="24" y="20" width="192" height="110" rx="8" fill="#1e293b" opacity="0.6" />
    
    <!-- Laboratory Shelves -->
    <rect x="36" y="45" width="70" height="4" rx="2" fill="#475569" />
    <rect x="134" y="55" width="70" height="4" rx="2" fill="#475569" />
    
    <!-- Shelf Props (Beakers, Bottles) -->
    <path d="M48 45 L52 32 L60 32 L64 45 Z" fill="#38bdf8" opacity="0.7" />
    <path d="M72 45 L74 35 L82 35 L84 45 Z" fill="#10b981" opacity="0.7" />
    <circle cx="150" cy="43" r="8" fill="#ec4899" opacity="0.7" />
    <rect x="170" y="32" width="12" height="23" rx="3" fill="#fbbf24" opacity="0.7" />

    <!-- Warm Laboratory Lighting / Accent Glow -->
    <circle cx="120" cy="15" r="70" fill="#38bdf8" opacity="0.05" />
    <circle cx="60" cy="160" r="40" fill="#f59e0b" opacity="0.04" />
  </g>

  <!-- Laboratory Workbench -->
  <g id="workbench">
    <rect x="0" y="160" width="240" height="80" fill="url(#tableGrad)" />
    <rect x="0" y="156" width="240" height="6" fill="#475569" />
    <!-- Table shadow under props -->
    <ellipse cx="120" cy="172" rx="70" ry="8" fill="#0f172a" opacity="0.5" />
  </g>

  <!-- Central Scientific Focus: White Powder and Containers -->
  <g id="powder-scenario" transform="translate(100, 145)">
    <!-- Shadow for Petri Dish -->
    <ellipse cx="20" cy="22" rx="35" ry="12" fill="#000000" opacity="0.4" />

    <!-- Glass Petri Dish Base -->
    <ellipse cx="20" cy="18" rx="32" ry="10" fill="#38bdf8" opacity="0.15" />
    <ellipse cx="20" cy="18" rx="32" ry="10" stroke="#7dd3fc" stroke-width="1.5" fill="none" />

    <!-- The White Powder (Target Focus: "白色粉末") -->
    <ellipse cx="18" cy="18" rx="24" ry="7" fill="url(#powderGlow)" />
    <!-- Fine grainy texture detail for powder mound -->
    <circle cx="10" cy="17" r="12" fill="#ffffff" opacity="0.9" />
    <circle cx="26" cy="19" r="10" fill="#f8fafc" opacity="0.95" />
    <circle cx="18" cy="15" r="8" fill="#ffffff" />
    <!-- Sparkles/Highlight indicating fine texture -->
    <circle cx="8" cy="15" r="1.5" fill="#fde047" />
    <circle cx="25" cy="16" r="1" fill="#fde047" />
    <circle cx="18" cy="20" r="1.2" fill="#e2e8f0" />

    <!-- Glass Petri Dish Rim/Top Edge -->
    <ellipse cx="20" cy="15" rx="32" ry="10" stroke="#bae6fd" stroke-width="0.8" fill="none" opacity="0.7" />

    <!-- Spool / Lab Scoop Instrument -->
    <path d="M-22 28 L-2 21 L3 24 L-17 31 Z" fill="#94a3b8" />
    <path d="M-22 28 L-26 30 L-20 33 Z" fill="#cbd5e1" />
  </g>

  <!-- Secondary Props: Erlenmeyer Flask with Powder Reaction/Contents -->
  <g id="flask" transform="translate(35, 120)">
    <ellipse cx="18" cy="52" rx="18" ry="6" fill="#000000" opacity="0.3" />
    <!-- Flask Body -->
    <path d="M14 10 L22 10 L22 25 L34 48 C36 52 33 56 28 56 L8 56 C3 56 0 52 2 48 L14 25 Z" fill="url(#glassGrad)" stroke="#7dd3fc" stroke-width="1.5" stroke-linejoin="round" />
    <!-- White Powder inside Flask bottom -->
    <ellipse cx="18" cy="51" rx="12" ry="4" fill="#ffffff" opacity="0.9" />
    <!-- Liquid/Gas effect rising -->
    <path d="M12 40 C15 35 21 35 24 40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <circle cx="16" cy="32" r="2" fill="#38bdf8" opacity="0.5" />
    <circle cx="20" cy="27" r="1.5" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Character: Curious Scientist / Student inspecting the powder -->
  <g id="character" transform="translate(145, 80)">
    <!-- Body / Lab Coat -->
    <path d="M20 70 L55 70 L65 100 L10 100 Z" fill="url(#coatGrad)" />
    <!-- Inner Shirt / Collar -->
    <path d="M32 70 L37 82 L43 70 Z" fill="#38bdf8" />
    <path d="M30 70 L37 77 L44 70 Z" fill="#475569" />

    <!-- Neck -->
    <rect x="33" y="58" width="8" height="15" fill="#fcd34d" />

    <!-- Head & Face Profile/3-4 View -->
    <circle cx="37" cy="45" r="18" fill="#fcd34d" />
    
    <!-- Hair -->
    <path d="M20 42 C20 30 30 25 45 28 C53 30 55 38 55 45 L50 45 C50 35 42 30 35 30 C27 30 23 35 23 45 Z" fill="#334155" />

    <!-- Expressive Eye (focused, amazed/intrigued) -->
    <circle cx="43" cy="43" r="3" fill="#1e293b" />
    <circle cx="44" cy="42" r="1" fill="#ffffff" />
    <!-- Eyebrow raised in realization -->
    <path d="M39 37 C42 35 46 37 47 38" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Smiling Mouth -->
    <path d="M40 51 C42 53 45 53 47 51" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Safety Goggles on Forehead -->
    <g transform="translate(0, -3)">
      <path d="M25 36 L49 36" stroke="#0ea5e9" stroke-width="2" fill="none" />
      <rect x="31" y="33" width="8" height="6" rx="2" fill="#bae6fd" opacity="0.8" />
      <rect x="41" y="33" width="8" height="6" rx="2" fill="#bae6fd" opacity="0.8" />
    </g>

    <!-- Arm pointing/reaching towards the powder -->
    <path d="M52 75 C60 78 70 85 75 92" fill="none" stroke="url(#coatGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="77" cy="94" r="4" fill="#fcd34d" />
  </g>

  <!-- Foreground Atmospheric Particles (Subtle magic/dust floating) -->
  <g id="particles" opacity="0.6">
    <circle cx="95" cy="110" r="1.5" fill="#ffffff" />
    <circle cx="115" cy="95" r="1" fill="#38bdf8" />
    <circle cx="130" cy="120" r="2" fill="#ffffff" />
    <circle cx="85" cy="130" r="1" fill="#fde047" />
    <circle cx="155" cy="105" r="1.5" fill="#ffffff" />
  </g>
</svg>