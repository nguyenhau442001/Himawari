<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk -->
  <rect x="40" y="140" width="160" height="15" rx="2" fill="#374151"/>
  <rect x="170" y="155" width="10" height="40" rx="2" fill="#2D3748"/>
  <rect x="60" y="155" width="10" height="40" rx="2" fill="#2D3748"/>
  
  <!-- Manager (Arm and Hand) -->
  <path d="M180 100 L180 130 C180 135 175 140 170 140 L120 140" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="140" r="8" fill="#F59E0B"/>
  
  <!-- Document (The termination notice) -->
  <rect x="80" y="100" width="40" height="40" rx="2" fill="#E5E7EB"/>
  <rect x="85" y="105" width="30" height="4" rx="1" fill="#9CA3AF"/>
  <rect x="85" y="115" width="30" height="4" rx="1" fill="#9CA3AF"/>
  <rect x="85" y="125" width="20" height="4" rx="1" fill="#9CA3AF"/>
  
  <!-- Employee (Walking away) -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="30" r="12" fill="#9CA3AF"/>
    <path d="M20 42 L20 80 M20 50 L10 70 M20 50 L30 70" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Exit Door -->
  <rect x="190" y="60" width="30" height="100" rx="4" fill="#374151"/>
  <circle cx="205" cy="110" r="3" fill="#1A1D24"/>
</svg>