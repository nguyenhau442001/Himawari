<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Pedestal / Elevated Platform representing reverence and high regard (崇) -->
    <path d="M 60,185 L 180,185 L 195,200 L 45,200 Z" fill="#2E3544"/>
    <rect x="75" y="170" width="90" height="15" fill="#3E475B" rx="2"/>
    <rect x="90" y="155" width="60" height="15" fill="#4E5970" rx="2"/>
    
    <!-- Upward directional rays / Focus light (shàng - upholding, admiring) -->
    <path d="M 120,40 L 105,110 L 135,110 Z" fill="#F59E0B" opacity="0.15"/>
    <path d="M 120,40 L 85,130 L 155,130 Z" fill="#F59E0B" opacity="0.1"/>

    <!-- Central physical object: A glowing, vibrant symbol of green lifestyle & eco-values held in high esteem -->
    <!-- Hands gently uplifting and adoring the core value (representing reverence,崇尚) -->
    <path d="M 75,160 C 75,145 90,135 105,145 C 105,145 112,130 120,130 C 128,130 135,145 135,145 C 150,135 165,145 165,160 C 165,175 140,185 120,185 C 100,185 75,175 75,160 Z" fill="#E2E8F0"/>
    
    <!-- Eco-lifestyle core object: A flourishing glowing green plant/globe concept -->
    <circle cx="120" cy="100" r="38" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Stylized Leaf & Globe intersection inside representing 绿色健康环保生活方式 -->
    <path d="M 120,70 C 120,70 100,90 100,105 C 100,116 109,125 120,125 C 131,125 140,116 140,105 C 140,90 120,70 120,70 Z" fill="#10B981"/>
    <path d="M 120,85 L 120,120" stroke="#064E3B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120,95 L 108,105" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120,105 L 131,95" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Halo / Reverence Sparkles (Gold/Orange accent for high value) -->
    <circle cx="120" cy="35" r="3" fill="#F59E0B"/>
    <path d="M 120,25 L 120,20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 120,45 L 120,50" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 110,35 L 105,35" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 130,35 L 135,35" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Side decorative respectful framing stars -->
    <path d="M 55,90 L 58,98 L 66,98 L 60,102 L 62,110 L 55,105 L 48,110 L 50,102 L 44,98 L 52,98 Z" fill="#F59E0B" opacity="0.4" transform="scale(0.5) translate(40, 80)"/>
    <path d="M 395,90 L 398,98 L 406,98 L 400,102 L 402,110 L 395,105 L 388,110 L 390,102 L 384,98 L 392,98 Z" fill="#F59E0B" opacity="0.4" transform="scale(0.5) translate(70, 80)"/>
  </g>
</svg>