<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" clip-path="url(#canvasClip)" />

  <!-- Room Interior & Context Props -->
  <!-- Office / Lounge Back wall -->
  <rect x="20" y="30" width="200" height="150" rx="8" fill="#1b263b" />
  <!-- Window showing night/city ambience -->
  <rect x="140" y="45" width="65" height="85" rx="4" fill="#0f172a" />
  <path d="M172 45 V130" stroke="#1b263b" stroke-width="2" />
  <path d="M140 85 H205" stroke="#1b263b" stroke-width="2" />
  <!-- Window city lights dots -->
  <circle cx="155" cy="65" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="163" cy="75" r="1.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="190" cy="60" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="185" cy="100" r="1.5" fill="#fb923c" opacity="0.5" />

  <!-- Office Plants for richness -->
  <path d="M28 140 C28 120 38 120 38 140 Z" fill="#0f172a" />
  <path d="M33 122 C25 110 20 115 25 100 C30 115 33 115 33 122 Z" fill="#10b981" />
  <path d="M35 125 C42 110 50 115 45 95 C38 115 35 118 35 125 Z" fill="#059669" />

  <!-- Sofa / Seating furniture -->
  <!-- Grouped chatting people on the right -->
  <path d="M130 135 H210 V175 H130 Z" fill="#334155" rx="6" />
  <path d="M130 120 H210 V138 H130 Z" fill="#475569" rx="4" />

  <!-- Person 1 (Chatting, smiling) -->
  <circle cx="155" cy="105" r="11" fill="#fbcfe8" />
  <path d="M145 125 C145 115 165 115 165 125 Z" fill="#ec4899" />
  <path d="M151 103 Q155 107 159 103" stroke="#be185d" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Person 2 (Laughing, turned toward Person 1) -->
  <circle cx="185" cy="103" r="11" fill="#fed7aa" />
  <path d="M175 123 C175 113 195 113 195 123 Z" fill="#ea580c" />
  <path d="M181 101 Q185 106 189 101" stroke="#c2410c" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Coffee table with mugs -->
  <rect x="135" y="150" width="60" height="22" rx="3" fill="#64748b" />
  <ellipse cx="150" cy="150" rx="5" ry="3" fill="#94a3b8" />
  <ellipse cx="175" cy="150" rx="5" ry="3" fill="#94a3b8" />

  <!-- Ambient light pool from the group -->
  <path d="M110 180 C130 140 170 130 210 180 Z" fill="url(#warmLight)" />

  <!-- ISOLATED / SEPARATED SUBJECT (The core of the scenario) -->
  <!-- Left side: Wooden desk & chair setup -->
  <rect x="45" y="145" width="50" height="6" rx="2" fill="#94a3b8" />
  <rect x="52" y="151" width="5" height="29" fill="#64748b" />
  <rect x="83" y="151" width="5" height="29" fill="#64748b" />

  <!-- Laptop on desk -->
  <path d="M55 145 L62 135 H82 L89 145 Z" fill="#cbd5e1" />
  <rect x="63" y="137" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8" />

  <!-- Main Character (Feeling isolated, looking away downwards/sideways) -->
  <!-- Chair back -->
  <rect x="58" y="112" width="24" height="42" rx="4" fill="#334155" />
  <!-- Character Body -->
  <path d="M55 155 C55 135 85 135 85 155 Z" fill="#3b82f6" />
  <!-- Character Head -->
  <circle cx="70" cy="115" r="12" fill="#fed7aa" />
  <!-- Hair -->
  <path d="M58 113 C58 100 82 100 82 113 C82 118 78 113 70 113 C62 113 58 118 58 113 Z" fill="#1e293b" />
  <!-- Sad/Thoughtful Facial expression -->
  <circle cx="66" cy="115" r="1" fill="#1e293b" />
  <circle cx="74" cy="115" r="1" fill="#1e293b" />
  <path d="M68 122 Q70 120 72 122" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- Head-in-hand posture or dropped arm -->
  <path d="M62 135 L68 125 L72 133" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Visual separation lines / Atmospheric cue for distance/isolation -->
  <!-- Subtle floor shadow / gap -->
  <ellipse cx="70" cy="182" rx="25" ry="5" fill="#0b0f19" opacity="0.6" />

  <!-- Divider visual tension - empty space with subtle cool glow pointing to isolation -->
  <line x1="115" y1="50" x2="115" y2="170" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,6" opacity="0.15" />

  <!-- Foreground framing elements -->
  <path d="M0 240 V210 C30 210 40 230 60 240 Z" fill="#0b0f19" opacity="0.7" />
  <path d="M240 240 V220 C210 220 200 230 180 240 Z" fill="#0b0f19" opacity="0.7" />
</svg>