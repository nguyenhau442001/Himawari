<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Office Window/Cityscape -->
  <rect x="30" y="30" width="180" height="100" rx="8" fill="#334155" opacity="0.3"/>
  <path d="M40 50 L80 50 L85 40 L120 40 L125 50 L200 50 L200 120 L40 120 Z" fill="#475569"/>
  <circle cx="180" cy="60" r="15" fill="#fbbf24"/>
  
  <!-- Main Subject: Official/Analyst -->
  <g transform="translate(60, 100)">
    <!-- Body -->
    <path d="M20 120 L100 120 L110 70 L10 70 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="50" r="25" fill="#fde68a"/>
    <!-- Glasses -->
    <rect x="45" y="45" width="30" height="10" rx="2" fill="#1e293b"/>
    <!-- Arms -->
    <path d="M10 80 L-10 100" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M110 80 L130 100" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Data Visualization (The "Good Financial Status") -->
  <g transform="translate(150, 150)">
    <rect x="0" y="-60" width="10" height="60" rx="2" fill="#10b981"/>
    <rect x="20" y="-80" width="10" height="80" rx="2" fill="#10b981"/>
    <rect x="40" y="-95" width="10" height="95" rx="2" fill="#10b981"/>
    <path d="M-10 0 L60 0" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Decorative Elements: Growth Arrow -->
  <path d="M160 140 L190 110 L210 130" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#1e293b"/>
  <rect x="0" y="200" width="240" height="5" fill="#334155"/>
</svg>