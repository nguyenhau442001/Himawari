<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Ground line / Foundation -->
    <path d="M50 185 L190 185" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    
    <!-- House representing "成家" (Establishing a family / Home) -->
    <g transform="translate(45, 100)">
      <!-- House base / Walls -->
      <path d="M15 35 L15 80 L65 80 L65 35 Z" fill="#2563EB"/>
      <!-- House Roof -->
      <path d="M10 35 L40 10 L70 35 Z" fill="#F59E0B"/>
      <!-- Warm glowing window -->
      <rect x="27" y="45" width="16" height="20" rx="2" fill="#FEF3C7"/>
      <path d="M35 45 L35 65" stroke="#2563EB" stroke-width="1.5"/>
      <path d="M27 55 L43 55" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Door -->
      <path d="M50 55 L58 55 L58 80 L50 80 Z" fill="#1E40AF"/>
      <circle cx="56" cy="68" r="1" fill="#F59E0B"/>
      <!-- Chimney with a tiny hearth smoke hint -->
      <rect x="52" y="16" width="8" height="15" fill="#D97706"/>
      <path d="M56 12 Q54 6 58 2" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Career / Work representing "立业" (Establishing a career / Building a foundation) -->
    <g transform="translate(130, 105)">
      <!-- Office Building / Workplace -->
      <rect x="15" y="15" width="50" height="65" fill="#3B82F6"/>
      <!-- Building Roof Top Structure -->
      <rect x="30" y="5" width="20" height="10" fill="#60A5FA"/>
      <line x1="40" y1="5" x2="40" y2="0" stroke="#93C5FD" stroke-width="2"/>
      
      <!-- Grid Windows (Enterprise/Career) -->
      <rect x="21" y="23" width="10" height="12" rx="1.5" fill="#E0F2FE"/>
      <rect x="39" y="23" width="10" height="12" rx="1.5" fill="#E0F2FE"/>
      
      <rect x="21" y="41" width="10" height="12" rx="1.5" fill="#E0F2FE"/>
      <rect x="39" y="41" width="10" height="12" rx="1.5" fill="#E0F2FE"/>
      
      <rect x="21" y="59" width="10" height="16" rx="1.5" fill="#1E3A8A"/>
      <rect x="39" y="59" width="10" height="16" rx="1.5" fill="#1E3A8A"/>
    </g>

    <!-- Professional accent gear/industry icon floating subtly to link career context -->
    <g transform="translate(165, 85)">
      <circle cx="12" cy="12" r="12" fill="#10B981"/>
      <path d="M12 6 L13.5 9.5 L17.5 9.5 L14.2 11.8 L15.5 15.5 L12 13.2 L8.5 15.5 L9.8 11.8 L6.5 9.5 L10.5 9.5 Z" fill="#F3F4F6" transform="scale(0.6) translate(8, 8)"/>
    </g>

    <!-- Central connection element: Stable root/bridge symbolizing the solid foundation of life -->
    <g transform="translate(0, 15)">
      <path d="M75 168 C 100 155, 140 155, 165 168" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4 4"/>
    </g>
  </g>
</svg>