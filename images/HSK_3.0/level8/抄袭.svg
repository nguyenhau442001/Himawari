<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: Plagiarism / Copying (抄袭)
       Depicted as two identical documents/papers, where one is actively
       being duplicated onto the other, highlighting literal replication of text/content. -->

  <!-- Background Document (Original Source) -->
  <g transform="translate(48, 52)">
    <!-- Paper base -->
    <rect x="0" y="0" width="85" height="120" rx="6" fill="#2D333B" stroke="#484F58" stroke-width="2"/>
    <!-- Folded top-right corner -->
    <path d="M 65 0 L 85 20 L 85 0 Z" fill="#484F58"/>
    <path d="M 65 0 L 65 20 L 85 20 Z" fill="#21262D"/>
    <!-- Mock text lines (Original) -->
    <rect x="14" y="24" width="45" height="6" rx="3" fill="#6A737D"/>
    <rect x="14" y="40" width="55" height="5" rx="2.5" fill="#484F58"/>
    <rect x="14" y="55" width="50" height="5" rx="2.5" fill="#484F58"/>
    <rect x="14" y="70" width="55" height="5" rx="2.5" fill="#484F58"/>
    <rect x="14" y="85" width="35" height="5" rx="2.5" fill="#484F58"/>
  </g>

  <!-- Foreground Document (The Copy / Plagiarized Work) -->
  <g transform="translate(107, 68)">
    <!-- Paper base -->
    <rect x="0" y="0" width="85" height="120" rx="6" fill="#22272E" stroke="#E3B341" stroke-width="2"/>
    <!-- Folded top-right corner -->
    <path d="M 65 0 L 85 20 L 85 0 Z" fill="#C69026"/>
    <path d="M 65 0 L 65 20 L 85 20 Z" fill="#1A1D24"/>
    <!-- Mock text lines (Being copied / Highlighted with accent color) -->
    <rect x="14" y="24" width="45" height="6" rx="3" fill="#E3B341"/>
    <rect x="14" y="40" width="55" height="5" rx="2.5" fill="#8B949E"/>
    <rect x="14" y="55" width="50" height="5" rx="2.5" fill="#8B949E"/>
    <rect x="14" y="70" width="55" height="5" rx="2.5" fill="#8B949E"/>
    <rect x="14" y="85" width="35" height="5" rx="2.5" fill="#8B949E"/>
  </g>

  <!-- Action/Duplication Beam & Scanner Elements -->
  <!-- Transfer effect connecting the two documents -->
  <path d="M 90 85 L 120 100 L 90 115 Z" fill="#E3B341" opacity="0.15"/>
  <path d="M 110 95 L 130 105 L 110 115 Z" fill="#E3B341" opacity="0.3"/>

  <!-- Stylized mechanical copying nib / duplication cursor hovering over the copy -->
  <g transform="translate(130, 100) rotate(-45)">
    <!-- Pen / Scanner Tool -->
    <path d="M -6 -18 L 6 -18 L 10 12 L 0 22 L -10 12 Z" fill="#E3B341"/>
    <rect x="-4" y="-22" width="8" height="6" rx="2" fill="#F0883E"/>
    <circle cx="0" cy="24" r="2.5" fill="#FFF"/>
  </g>

  <!-- Additional glowing sync/copy particle accents -->
  <circle cx="105" cy="100" r="3" fill="#E3B341"/>
  <circle cx="120" cy="75" r="2" fill="#E3B341" opacity="0.8"/>
  <circle cx="95" cy="135" r="2.5" fill="#E3B341" opacity="0.6"/>

</svg>