<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="40" fill="#475569"/>
  <rect x="190" y="175" width="10" height="40" fill="#475569"/>
  
  <!-- Chart Background -->
  <rect x="60" y="50" width="120" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Chart Line (Sluggish/Slow growth) -->
  <path d="M70 120 Q 100 115, 130 118 T 170 110" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="110" r="4" fill="#fb923c"/>
  
  <!-- Businessman Character -->
  <g transform="translate(120, 150)">
    <!-- Body -->
    <path d="M-20 0 L 20 0 L 15 60 L -15 60 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="20" fill="#fde68a"/>
    <!-- Eyes (Concerned look) -->
    <rect x="-8" y="-30" width="4" height="2" rx="1" fill="#1e293b"/>
    <rect x="4" y="-30" width="4" height="2" rx="1" fill="#1e293b"/>
    <!-- Tie -->
    <path d="M-3 0 L 3 0 L 0 20 Z" fill="#ec4899"/>
  </g>
  
  <!-- Magnifying Glass -->
  <g transform="translate(160, 80)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <path d="M8 8 L 20 20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="40" r="3" fill="#10b981"/>
  <circle cx="200" cy="190" r="4" fill="#fbbf24"/>
  <path d="M180 50 L 190 40" stroke="#334155" stroke-width="2"/>
</svg>