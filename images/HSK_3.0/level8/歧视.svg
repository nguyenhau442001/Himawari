<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Desk Light -->
    <radialGradient id="deskGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Office Interior Elements -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  
  <!-- Window frame and grid -->
  <rect x="140" y="35" width="65" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="172" y1="35" x2="172" y2="125" stroke="#334155" stroke-width="1.5" />
  <line x1="140" y1="80" x2="205" y2="80" stroke="#334155" stroke-width="1.5" />
  
  <!-- Cityscape silhouette outside window -->
  <path d="M145 125 L145 105 L152 105 L152 125 L160 125 L160 95 L168 95 L168 125 L180 125 L180 88 L190 88 L190 125 L200 125 L200 110 L203 110 L203 125 Z" fill="#334155" opacity="0.6"/>

  <!-- Light coming through window -->
  <polygon points="140,35 205,35 230,175 110,175" fill="url(#lightBeam)" />

  <!-- Office Furniture: Partition Wall -->
  <rect x="20" y="110" width="110" height="60" fill="#334155" rx="2" opacity="0.4" />
  <line x1="20" y1="110" x2="130" y2="110" stroke="#475569" stroke-width="2" />

  <!-- Floor -->
  <rect x="20" y="170" width="200" height="50" fill="#0f172a" />
  <line x1="20" y1="170" x2="220" y2="170" stroke="#334155" stroke-width="2" />

  <!-- Large Office Desk -->
  <path d="M 35 155 L 205 155 L 215 185 L 25 185 Z" fill="#334155" filter="url(#shadow)" />
  <rect x="30" y="150" width="180" height="8" rx="2" fill="#475569" />
  <!-- Desk legs -->
  <rect x="45" y="185" width="8" height="25" fill="#1e293b" />
  <rect x="185" y="185" width="8" height="25" fill="#1e293b" />

  <!-- Props on Desk: Laptop, Papers, Coffee Cup -->
  <!-- Laptop -->
  <path d="M 50 148 L 85 148 L 90 152 L 45 152 Z" fill="#cbd5e1" />
  <rect x="52" y="125" width="31" height="24" rx="2" fill="#94a3b8" />
  <rect x="55" y="128" width="25" height="18" rx="1" fill="#38bdf8" opacity="0.4" />

  <!-- Document / Folder stack (symbolizing resumes/applications) -->
  <rect x="160" y="143" width="30" height="10" rx="1" fill="#f8fafc" transform="rotate(-5 160 143)" />
  <rect x="158" y="146" width="32" height="10" rx="1" fill="#e2e8f0" />

  <!-- Plant Prop -->
  <path d="M 200 140 Q 200 130 205 120 Q 210 130 210 140 Z" fill="#10b981" />
  <path d="M 195 142 Q 192 132 188 125 Q 195 130 200 142 Z" fill="#059669" />
  <ellipse cx="200" cy="145" rx="7" ry="5" fill="#cbd5e1" />

  <!-- CHARACTER 1: Standing Interviewer / Manager (Authority figure) -->
  <g transform="translate(105, 75)">
    <!-- Body / Suit -->
    <path d="M 25 50 L 45 50 L 50 95 L 20 95 Z" fill="#1e293b" />
    <path d="M 35 50 L 35 85 L 45 85 L 40 50 Z" fill="#334155" /> <!-- Tie/Lapel accent -->
    
    <!-- Head & Hair -->
    <circle cx="35" cy="30" r="14" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M 21 28 Q 35 15 49 28 L 47 18 Q 35 12 23 18 Z" fill="#334155" /> <!-- Hair -->
    
    <!-- Confident/Dismissive Pose: Arms crossed -->
    <path d="M 25 55 Q 10 65 25 75" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <path d="M 45 55 Q 60 65 45 75" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <circle cx="22" cy="73" r="4" fill="#fbcfe8" />
    
    <!-- Face Profile (Looking down sternly) -->
    <circle cx="43" cy="31" r="1.5" fill="#334155" />
    <path d="M 40 37 Q 44 35 46 37" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 2: Sitting Qualified Candidate (Experiencing bias/rejection) -->
  <g transform="translate(60, 95)">
    <!-- Chair back -->
    <rect x="-10" y="5" width="12" height="65" rx="4" fill="#475569" />
    
    <!-- Torso (Sitting) -->
    <path d="M 0 35 L 25 35 L 30 75 L -5 75 Z" fill="#38bdf8" />
    
    <!-- Head & Hair -->
    <circle cx="12" cy="15" r="13" fill="#fed7aa" />
    <path d="M -1 12 Q 12 -2 25 12 L 23 5 Q 12 -3 1 5 Z" fill="#0f172a" /> <!-- Dark hair -->
    
    <!-- Expression: Concerned / Overlooked -->
    <circle cx="17" cy="15" r="1.5" fill="#1e293b" />
    <path d="M 14 21 Q 17 19 20 21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms resting on desk -->
    <path d="M 20 45 L 45 60" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" />
    <circle cx="47" cy="61" r="3.5" fill="#fed7aa" />
  </g>

  <!-- CHARACTER 3: Seated Colleague / Secondary Observer (Witnessing the dynamic) -->
  <g transform="translate(150, 105)">
    <!-- Torso -->
    <rect x="5" y="25" width="25" height="40" rx="4" fill="#ec4899" opacity="0.8" />
    
    <!-- Head -->
    <circle cx="17" cy="10" r="11" fill="#fde68a" />
    <path d="M 6 8 Q 17 -1 28 8 L 26 3 Q 17 -3 8 3 Z" fill="#78350f" />
    
    <!-- Arm holding chin / thoughtful -->
    <path d="M 10 30 Q 5 20 15 16" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- CONCEPTUAL OVERLAY GRAPHIC (Subtle structural barrier / glass ceiling metaphor) -->
  <!-- Translucent partition symbolizing systemic barrier/bias in the environment -->
  <g opacity="0.25">
    <rect x="115" y="45" width="6" height="110" rx="3" fill="#38bdf8" />
    <rect x="113" y="55" width="10" height="2" fill="#ffffff" />
    <rect x="113" y="95" width="10" height="2" fill="#ffffff" />
    <rect x="113" y="135" width="10" height="2" fill="#ffffff" />
  </g>

  <!-- Foreground ambient lighting / Vignette highlights -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" />
</svg>