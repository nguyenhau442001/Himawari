<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Hologram Projection Glow -->
    <linearGradient id="holoBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- UI/Map Node Gradients -->
    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="nodeNormal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Modern Strategy Room & Office Context -->
  <!-- Floor Grid Perspective Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="120" y1="160" x2="10" y2="235" />
    <line x1="120" y1="160" x2="50" y2="235" />
    <line x1="120" y1="160" x2="90" y2="235" />
    <line x1="120" y1="160" x2="150" y2="235" />
    <line x1="120" y1="160" x2="190" y2="235" />
    <line x1="120" y1="160" x2="230" y2="235" />
    <path d="M 60 190 L 180 190 M 40 210 L 200 210 M 20 230 L 220 230" />
  </g>

  <!-- Large Curved Window with Cityscape Silhouette -->
  <g opacity="0.25">
    <path d="M 30 40 Q 120 15 210 40 L 210 130 L 30 130 Z" fill="#38bdf8" />
    <!-- City buildings silhouette inside window -->
    <rect x="45" y="70" width="15" height="60" fill="#0f172a" />
    <rect x="65" y="55" width="20" height="75" fill="#0f172a" />
    <rect x="90" y="80" width="12" height="50" fill="#0f172a" />
    <rect x="110" y="65" width="25" height="65" fill="#0f172a" />
    <rect x="145" y="50" width="18" height="80" fill="#0f172a" />
    <rect x="170" y="75" width="22" height="55" fill="#0f172a" />
  </g>

  <!-- Strategic Desk / Console Structure -->
  <path d="M 60 170 L 180 170 L 200 210 L 40 210 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M 70 170 L 170 170 L 175 160 L 65 160 Z" fill="#334155" />

  <!-- HOLOGRAM PROJECTOR & SYSTEM (Representing "The Big Picture / 全局") -->
  <!-- Projector Base -->
  <ellipse cx="120" cy="165" rx="35" ry="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <ellipse cx="120" cy="165" rx="20" ry="4" fill="#38bdf8" opacity="0.6" />

  <!-- Hologram Cone Light -->
  <polygon points="120,110 85,165 155,165" fill="url(#holoBeam)" />

  <!-- Holographic Floating "Big Picture" Ecosystem (Network map, macro perspective) -->
  <g filter="url(#softShadow)">
    <!-- Connection Lines / Network Mesh -->
    <line x1="120" y1="115" x2="90" y2="135" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3" />
    <line x1="120" y1="115" x2="150" y2="135" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3" />
    <line x1="90" y1="135" x2="105" y2="150" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="150" y1="135" x2="135" y2="150" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="90" y1="135" x2="65" y2="125" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="150" y1="135" x2="175" y2="125" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="105" y1="150" x2="135" y2="150" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

    <!-- Central Core Node (Macro view / Overview) -->
    <circle cx="120" cy="115" r="8" fill="url(#nodeActive)" />
    <circle cx="120" cy="115" r="13" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5" stroke-dasharray="2,2" />

    <!-- Satellite Nodes (Sub-problems integrated into the whole) -->
    <circle cx="90" cy="135" r="5" fill="url(#nodeNormal)" />
    <circle cx="150" cy="135" r="5" fill="url(#nodeNormal)" />
    <circle cx="65" cy="125" r="4" fill="#10b981" />
    <circle cx="175" cy="125" r="4" fill="#10b981" />
    <circle cx="105" cy="150" r="4" fill="#ec4899" />
    <circle cx="135" cy="150" r="4" fill="#ec4899" />

    <!-- Macro Orbit Rings (Global scope ring) -->
    <ellipse cx="120" cy="138" rx="55" ry="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
    <ellipse cx="120" cy="138" rx="40" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4" />
  </g>


  <!-- CHARACTER: Analytical Subject (Thinking from the global perspective) -->
  <g id="character">
    <!-- Body / Torso (Leaning slightly forward, thoughtful stance) -->
    <path d="M 95 190 L 100 145 L 140 145 L 145 190 Z" fill="url(#jacketGrad)" filter="url(#softShadow)" />
    <!-- Shirt Collar & Tie hint -->
    <path d="M 112 145 L 120 160 L 128 145 Z" fill="url(#shirtGrad)" />
    <polygon points="118,155 120,175 122,155" fill="#ef4444" />
    <!-- Jacket lapels -->
    <path d="M 100 145 L 112 165 L 105 190" fill="#334155" />
    <path d="M 140 145 L 128 165 L 135 190" fill="#334155" />

    <!-- Neck -->
    <rect x="113" y="132" width="14" height="16" fill="#fbcfe8" rx="4" />

    <!-- Head & Hair Profile (Thoughtful expression, looking down at the projection) -->
    <path d="M 110 115 C 105 115 102 120 102 126 C 102 135 110 138 122 138 C 132 138 138 132 138 125 C 138 118 130 115 125 115 Z" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 102 125 C 102 110 112 104 125 106 C 135 108 140 116 138 126 C 135 116 128 110 118 110 C 110 110 105 116 102 125 Z" fill="#334155" />

    <!-- Thoughtful Hand on Chin (Classic "considering the big picture" pose) -->
    <!-- Arm supporting the pose -->
    <path d="M 140 155 C 150 155 155 135 140 128" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" />
    <!-- Hand on Chin -->
    <circle cx="135" cy="125" r="6" fill="#fbcfe8" />
    
    <!-- Other Arm resting on desk/hip -->
    <path d="M 100 160 L 85 185 L 95 195" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND ACCENTS & CONTEXT PROPS -->
  <!-- Floating interface data points (Ambient UI details) -->
  <g opacity="0.6">
    <rect x="35" y="80" width="24" height="14" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <line x1="39" y1="87" x2="55" y2="87" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <rect x="180" y="90" width="28" height="16" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <line x1="184" y1="98" x2="204" y2="98" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Subtle golden accent light reflecting on characters and environment ("global insight" theme) -->
  <circle cx="120" cy="115" r="35" fill="#f59e0b" opacity="0.08" filter="blur(8px)" />
</svg>