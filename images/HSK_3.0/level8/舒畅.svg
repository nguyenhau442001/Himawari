<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background glowing aura for refreshing atmosphere -->
  <circle cx="120" cy="120" r="70" fill="#253245" opacity="0.6"/>
  <circle cx="120" cy="120" r="50" fill="#2E435F" opacity="0.4"/>

  <!-- Energy / Refreshing air flow rings -->
  <path d="M 80,85 C 95,70 145,70 160,85" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 65,110 C 85,90 155,90 175,110" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 75,145 C 95,130 145,130 165,145" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Central Physical Object: Modern Ergonomic Lounge / Relaxation Chair representing physical comfort and "shuchang" -->
  <!-- Chair Shadow -->
  <ellipse cx="120" cy="192" rx="42" ry="7" fill="#111318"/>

  <!-- Chair Legs -->
  <path d="M 98,178 L 88,190" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 142,178 L 152,190" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="180" x2="120" y2="194" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <!-- Chair Base / Shell -->
  <path d="M 85,135 C 80,165 95,180 120,180 C 145,180 160,165 155,135 Z" fill="#334155"/>

  <!-- Chair Seat Cushion -->
  <path d="M 90,135 C 90,155 105,170 120,170 C 135,170 150,155 150,135 Z" fill="#F59E0B"/>

  <!-- Chair Backrest -->
  <path d="M 90,138 C 85,95 100,75 120,75 C 140,75 155,95 150,138 Z" fill="#F59E0B"/>
  <path d="M 97,135 C 93,100 105,82 120,82 C 135,82 147,100 143,135 Z" fill="#FBBF24"/>

  <!-- Human Figure relaxing comfortably (Head & Torso reclining) -->
  <!-- Head -->
  <circle cx="120" cy="88" r="14" fill="#E2E8F0"/>
  
  <!-- Relaxed body leaning back -->
  <path d="M 108,102 C 112,120 115,135 118,150 C 122,150 125,140 128,125 C 130,110 132,102 132,102 Z" fill="#38BDF8"/>

  <!-- Arms relaxed outwards -->
  <path d="M 112,112 C 100,120 92,130 88,125" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 128,112 C 140,120 148,130 152,125" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Legs stretched out comfortably -->
  <path d="M 118,150 C 115,162 110,175 102,185" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 122,150 C 125,162 130,175 138,185" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Floating Sparkles / Vitality indicators (sảng khoái, comfortable energy) -->
  <g fill="#38BDF8">
    <path d="M 68,75 Q 72,75 72,71 Q 72,75 76,75 Q 72,75 72,79 Q 72,75 68,75 Z"/>
    <path d="M 172,95 Q 176,95 176,91 Q 176,95 180,95 Q 176,95 176,99 Q 176,95 172,95 Z"/>
    <path d="M 62,135 Q 65,135 65,132 Q 65,135 68,135 Q 65,135 65,138 Q 65,135 62,135 Z"/>
    <path d="M 178,145 Q 181,145 181,142 Q 181,145 184,145 Q 181,145 181,148 Q 181,145 178,145 Z"/>
  </g>

  <!-- Highlight accent stars (gold/orange) -->
  <g fill="#F59E0B">
    <path d="M 158,68 Q 161,68 161,65 Q 161,68 164,68 Q 161,68 161,71 Q 161,68 158,68 Z"/>
    <path d="M 78,55 Q 81,55 81,52 Q 81,55 84,55 Q 81,55 81,58 Q 81,55 78,55 Z"/>
  </g>
</svg>