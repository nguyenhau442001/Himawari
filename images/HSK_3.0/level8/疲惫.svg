<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Light Cone -->
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Wall & Window Background Context -->
  <!-- Window Frame -->
  <rect x="25" y="30" width="55" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="35" width="45" height="65" fill="url(#window-grad)"/>
  <!-- Night City Lights Outside -->
  <rect x="36" y="50" width="8" height="12" rx="1" fill="#fbbf24" opacity="0.6"/>
  <rect x="48" y="70" width="10" height="15" rx="1" fill="#38bdf8" opacity="0.5"/>
  <rect x="62" y="45" width="7" height="20" rx="1" fill="#fb923c" opacity="0.4"/>
  <!-- Window Crossbars -->
  <line x1="52" y1="35" x2="52" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="67" x2="75" y2="67" stroke="#334155" stroke-width="2"/>

  <!-- Wall Shelf with Books/Plant -->
  <rect x="100" y="25" width="70" height="4" rx="2" fill="#475569"/>
  <rect x="110" y="10" width="10" height="15" rx="2" fill="#f43f5e"/>
  <rect x="122" y="13" width="8" height="12" rx="2" fill="#10b981"/>
  <rect x="132" y="8" width="12" height="17" rx="2" fill="#f59e0b"/>
  <!-- Small hanging plant -->
  <path d="M 155 29 Q 155 45 148 50" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="148" cy="52" r="4" fill="#10b981"/>
  <path d="M 158 35 Q 163 42 165 48" fill="none" stroke="#10b981" stroke-width="2"/>

  <!-- Office Desk -->
  <rect x="10" y="170" width="220" height="12" rx="3" fill="#334155"/>
  <rect x="25" y="182" width="14" height="48" rx="2" fill="#1e293b"/>
  <rect x="201" y="182" width="14" height="48" rx="2" fill="#1e293b"/>

  <!-- Desk Lamp (Casting Light Cone) -->
  <polygon points="175,100 205,100 215,170 165,170" fill="url(#lamp-cone)"/>
  <!-- Lamp Base & Stand -->
  <path d="M 185 170 L 195 170 L 192 130 L 188 130 Z" fill="#64748b"/>
  <path d="M 180 132 C 185 120 195 120 200 132" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="190" cy="132" rx="12" ry="6" fill="#f59e0b"/>

  <!-- Workspace Props: Computer Monitor showing charts/graphs (ended work) -->
  <rect x="115" y="115" width="55" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="122" y="122" width="41" height="28" fill="#1e293b"/>
  <!-- Chart lines on screen -->
  <polyline points="126,142 134,134 142,138 152,126 158,130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="152" cy="126" r="2" fill="#38bdf8"/>
  <rect x="135" y="160" width="18" height="10" rx="1" fill="#475569"/>

  <!-- Coffee Mug with steam -->
  <rect x="85" y="152" width="14" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M 99 157 C 103 157 103 165 99 165" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Steam wisps representing a long day -->
  <path d="M 89 146 Q 91 140 88 135" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 93 148 Q 96 142 93 137" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Scattered Papers / Documents -->
  <polygon points="45,166 68,162 72,174 48,178" fill="#f8fafc" opacity="0.9"/>
  <line x1="50" y1="169" x2="63" y2="167" stroke="#94a3b8" stroke-width="1"/>
  <line x1="51" y1="173" x2="60" y2="171" stroke="#94a3b8" stroke-width="1"/>
  
  <polygon points="62,170 82,166 85,176 65,180" fill="#e2e8f0" opacity="0.8"/>

  <!-- EXHAUSTED CHARACTER (Depicting 疲惫 - Extreme Fatigue) -->
  <!-- Chair Back -->
  <rect x="82" y="75" width="28" height="95" rx="6" fill="#334155"/>
  <path d="M 85 110 L 107 110" stroke="#1e293b" stroke-width="3"/>
  <path d="M 85 130 L 107 130" stroke="#1e293b" stroke-width="3"/>

  <!-- Character Body Slumped Forward over Desk -->
  <!-- Shoulders & Torso -->
  <path d="M 75 140 C 70 125 90 115 110 120 C 130 125 145 145 150 160 L 130 172 C 120 155 95 155 75 140 Z" fill="url(#shirt-grad)"/>

  <!-- Arms resting flat/slumped on desk -->
  <!-- Left Arm (Folded under head) -->
  <path d="M 80 145 C 70 145 55 155 45 150 C 40 147 45 142 52 145 C 65 150 78 145 88 148 Z" fill="#0284c7"/>
  <!-- Right Arm drooping off desk -->
  <path d="M 125 152 C 135 155 145 165 140 178" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="138" cy="182" r="6" fill="#fbcfe8"/>

  <!-- Neck and Head Resting on Forearms -->
  <!-- Neck -->
  <path d="M 88 122 C 92 125 96 125 98 120" fill="#fbcfe8"/>
  
  <!-- Head (Tilted downward, resting on left arm) -->
  <g transform="translate(68, 112)">
    <!-- Hair -->
    <path d="M 2 15 C 2 3 18 -2 28 5 C 38 12 42 25 38 35 C 32 32 28 35 20 35 C 10 35 3 25 2 15 Z" fill="#334155"/>
    <!-- Face Profile / Closed Eyes showing exhaustion -->
    <circle cx="20" cy="22" r="14" fill="#fbcfe8"/>
    <!-- Closed tired eye (Downward arc) -->
    <path d="M 12 22 Q 15 26 19 23" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Exhausted Eyebrow -->
    <path d="M 11 18 Q 15 16 18 19" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Gentle Zzz floating up to show deep fatigue/sleepiness -->
    <text x="32" y="2" font-family="sans-serif" font-weight="bold" font-size="12" fill="#94a3b8" opacity="0.8">z</text>
    <text x="42" y="-6" font-family="sans-serif" font-weight="bold" font-size="15" fill="#64748b" opacity="0.7">Z</text>
    <text x="54" y="-16" font-family="sans-serif" font-weight="bold" font-size="18" fill="#475569" opacity="0.5">Z</text>
  </g>

  <!-- Dramatic overhead shadow/vignette to emphasize late night fatigue -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0.0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#vignette)" pointer-events="none"/>
</svg>