<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow centered on the object -->
  <circle cx="120" cy="120" r="70" fill="#242933" opacity="0.6"/>

  <g transform="translate(0, 5)">
    <!-- Assembled ancient pottery vase (restored to original state) -->
    <!-- Vase Body & Silhouette -->
    <path d="M95 75 Q120 60 145 75 L155 105 Q160 140 145 175 Q135 195 120 195 Q105 195 95 175 Q80 140 85 105 Z" fill="#D97706" />
    
    <!-- Highlights and shading to give volume -->
    <path d="M120 65 L120 195" stroke="#B45309" stroke-width="2" opacity="0.3"/>
    <path d="M100 80 Q120 70 140 80 Q150 110 142 165 Q132 185 120 185" fill="#F59E0B" opacity="0.4"/>
    
    <!-- Vase Neck & Rim -->
    <ellipse cx="120" cy="65" rx="18" ry="6" fill="#F59E0B"/>
    <path d="M102 65 C102 58 138 58 138 65 Z" fill="#D97706"/>
    <ellipse cx="120" cy="63" rx="14" ry="4" fill="#B45309" opacity="0.5"/>

    <!-- Decorative Cultural Patterns on the Restored Vase (Clean & Elegant) -->
    <path d="M93 115 Q120 125 147 115" stroke="#FEF3C7" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M89 135 Q120 145 151 135" stroke="#FEF3C7" stroke-width="3" fill="none" opacity="0.8"/>
    <circle cx="120" cy="95" r="4" fill="#FEF3C7" opacity="0.8"/>
    <circle cx="105" cy="93" r="3" fill="#FEF3C7" opacity="0.8"/>
    <circle cx="135" cy="93" r="3" fill="#FEF3C7" opacity="0.8"/>

    <!-- Precision Gold Kintsugi / Restoration Seams (Highlighting the "Restored" aspect) -->
    <!-- Vertical and jagged mending lines showing where it was pieced back together -->
    <path d="M120 65 L118 85 L125 105 L115 130 L122 155 L120 195" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M102 115 L115 130 L138 125" stroke="#FBBF24" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 90 L125 105 L145 145" stroke="#FBBF24" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 150 L122 155 L135 175" stroke="#FBBF24" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating restoration sparkles / mastery indicators -->
    <g fill="#FBBF24">
      <!-- Top right sparkle -->
      <path d="M165 75 Q165 85 175 85 Q165 85 165 95 Q165 85 155 85 Q165 85 165 75 Z" opacity="0.9"/>
      <!-- Bottom left sparkle -->
      <path d="M75 155 Q75 162 82 162 Q75 162 75 169 Q75 162 68 162 Q75 162 75 155 Z" opacity="0.7"/>
      <!-- Small accent star -->
      <circle cx="155" cy="140" r="2" opacity="0.8"/>
      <circle cx="85" cy="95" r="1.5" opacity="0.6"/>
    </g>

    <!-- Base / Stand shadow -->
    <ellipse cx="120" cy="202" rx="35" ry="6" fill="#111318" opacity="0.7"/>
  </g>
</svg>