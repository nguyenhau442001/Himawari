<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Elements: Night sky and warning elements -->
  <g opacity="0.3">
    <circle cx="40" cy="50" r="1" fill="#FFFFFF"/>
    <circle cx="200" cy="70" r="1.5" fill="#FFFFFF"/>
    <circle cx="180" cy="30" r="1" fill="#FFFFFF"/>
    <circle cx="70" cy="90" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Motion lines / descent trajectory -->
  <path d="M 60,60 Q 110,90 140,150" stroke="#FF5722" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.7"/>

  <!-- Explosion / Impact Effect (Action & Cause/Effect) -->
  <g transform="translate(150, 155)">
    <!-- Outer blast wave -->
    <circle cx="0" cy="0" r="35" fill="#FF5722" opacity="0.2"/>
    <!-- Inner explosion -->
    <path d="M 0 -25 L 8 -10 L 25 -15 L 12 2 L 22 18 L 2 12 L -8 25 L -12 8 L -28 10 L -15 -8 L -22 -20 L -5 -12 Z" fill="#FFC107"/>
    <path d="M 0 -15 L 5 -6 L 15 -9 L 7 1 L 13 11 L 1 7 L -5 15 L -7 5 L -16 6 L -9 -5 L -13 -12 L -3 -7 Z" fill="#FF5722"/>
  </g>

  <!-- Falling Airplane (Action / Incident) -->
  <g transform="translate(110, 110) rotate(-45)">
    <!-- Trail smoke -->
    <path d="M -40,0 Q -25,-5 -10,-2" stroke="#90A4AE" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M -30,5 Q -20,2 -5,5" stroke="#FF5722" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Plane body -->
    <path d="M -20,-4 L 15,-4 C 22,-4 28,0 28,0 C 28,0 22,4 15,4 L -20,4 C -24,4 -28,2 -28,0 C -28,-2 -24,-4 -20,-4 Z" fill="#ECEFF1"/>
    <!-- Wings -->
    <path d="M -5,-3 L 5,-18 C 7,-20 9,-20 10,-17 L 5,-2 Z" fill="#CFD8DC"/>
    <path d="M -5,3 L 5,18 C 7,20 9,20 10,17 L 5,2 Z" fill="#B0BEC5"/>
    <!-- Tail stabilizer -->
    <path d="M -22,-3 L -28,-10 C -29,-11 -31,-10 -30,-8 L -25,-3 Z" fill="#CFD8DC"/>
    <!-- Cockpit window -->
    <path d="M 12,-2 C 15,-2 18,0 18,0 C 18,0 15,2 12,2 Z" fill="#263238"/>
  </g>

  <!-- Dynamic Radar / Alert UI Overlay (Contextualizing 'Accident/Failure') -->
  <g transform="translate(195, 45)">
    <circle cx="0" cy="0" r="18" fill="#2D323C" stroke="#FF5722" stroke-width="2"/>
    <path d="M 0 -10 L 0 6 M 0 10 L 0 10" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-3" r="1.5" fill="#FF5722"/>
  </g>

  <!-- Focus/Alert Indicator framing the bottom impact -->
  <path d="M 30,200 L 50,200" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30,200 L 30,180" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  
  <path d="M 210,200 L 190,200" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <path d="M 210,200 L 210,180" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
</svg>