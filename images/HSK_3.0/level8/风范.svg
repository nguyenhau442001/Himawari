<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glowing atmosphere representing intellectual dignity -->
  <circle cx="120" cy="120" r="85" fill="#222834" opacity="0.6"/>
  <circle cx="120" cy="115" r="55" fill="#2C3544" opacity="0.4"/>

  <!-- Academic/Scientific Motif: Subtle glowing star/atom orbit backdrop representing the "Master" context -->
  <g opacity="0.3" stroke="#4A5568" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <ellipse cx="120" cy="115" rx="70" ry="25" transform="rotate(-15 120 115)"/>
    <ellipse cx="120" cy="115" rx="70" ry="25" transform="rotate(45 120 115)"/>
  </g>

  <!-- Central Character Object: The Senior Scholar / Grand Master (Representing "风范" - Exemplary Demeanor & Rigorous Spirit) -->
  <g transform="translate(0, 10)">
    <!-- Shoulders and Coat (Dark academic jacket/suit with clean flat lines) -->
    <path d="M 68 150 C 68 135, 92 125, 120 125 C 148 125, 172 135, 172 150 L 190 185 C 190 188, 187 190, 184 190 L 56 190 C 53 190, 50 188, 56 185 Z" fill="#2C3548"/>
    
    <!-- Shirt collar and tie/inner lapel -->
    <polygon points="120,135 132,152 108,152" fill="#E2E8F0"/>
    <polygon points="120,140 124,175 116,175" fill="#3B82F6"/>

    <!-- Neck -->
    <rect x="111" y="112" width="18" height="20" rx="4" fill="#D8B49FE0"/>

    <!-- Head & Face (Wise, composed, calm expression of a veteran scientist) -->
    <circle cx="120" cy="98" r="24" fill="#D8B49FE0"/>

    <!-- Ears -->
    <circle cx="95" cy="98" r="4" fill="#C9A28B"/>
    <circle cx="145" cy="98" r="4" fill="#C9A28B"/>

    <!-- Hair (Distinguished silver/white temples, neat scholar cut) -->
    <path d="M 96 90 C 96 76, 106 70, 120 70 C 134 70, 144 76, 144 90 L 144 95 C 136 91, 128 90, 120 90 C 112 90, 104 91, 96 95 Z" fill="#94A3B8"/>
    <!-- Silver side hair -->
    <path d="M 96 95 C 96 90, 98 84, 102 80 C 100 86, 99 92, 98 98 Z" fill="#CBD5E1"/>
    <path d="M 144 95 C 144 90, 142 84, 138 80 C 140 86, 141 92, 142 98 Z" fill="#CBD5E1"/>

    <!-- Gentle, confident warm smile / composed expression -->
    <path d="M 112 108 Q 120 113 128 108" stroke="#713F12" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="111" cy="98" r="1.5" fill="#1E293B"/>
    <circle cx="129" cy="98" r="1.5" fill="#1E293B"/>
    <!-- Gentle wise wrinkles near eyes -->
    <path d="M 106 95 L 103 93" stroke="#A16207" stroke-width="1" stroke-linecap="round"/>
    <path d="M 134 95 L 137 93" stroke="#A16207" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Iconic Exemplary Attributes: Floating Golden Compass & Research Elements (Symbolizing Rigor and Mastery) -->
  <!-- Elegant Golden Compass / Divider hovering gracefully -->
  <g transform="translate(145, 60) rotate(15)">
    <!-- Compass Head -->
    <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="2.5" fill="#1A1D24"/>
    <!-- Left Leg -->
    <polygon points="-2,5 -5,45 -1.5,45 1,8" fill="#F59E0B"/>
    <!-- Right Leg -->
    <polygon points="2,5 1.5,45 5,45 -1,8" fill="#D97706"/>
    <!-- Hinge joint detail -->
    <rect x="-3" y="-1.5" width="6" height="3" rx="1" fill="#B45309"/>
  </g>

  <!-- Floating Glowing Manuscript / Blueprint (Symbolizing rigorous truth-seeking and lifelong dedication) -->
  <g transform="translate(45, 75) rotate(-10)">
    <rect x="0" y="0" width="36" height="46" rx="3" fill="#F8FAFC"/>
    <rect x="0" y="0" width="36" height="8" rx="3" fill="#3B82F6"/>
    <!-- Abstract clean blueprint lines representing precise science -->
    <line x1="6" y1="16" x2="24" y2="16" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="30" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="32" x2="20" y2="32" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="27" cy="32" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Focal Accent: Glowing Gold Laurel/Aura Spark representing high moral stature and master's demeanor -->
  <g transform="translate(120, 32)">
    <path d="M -16 6 C -10 -2, 0 -6, 0 -6 C 0 -6, 10 -2, 16 6" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-8" r="3" fill="#FBBF24"/>
  </g>
</svg>