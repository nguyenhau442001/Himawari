<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="30" y="140" width="180" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="155" width="10" height="60" fill="#334155"/>
  <rect x="190" y="155" width="10" height="60" fill="#334155"/>
  
  <!-- Half-finished model (The core concept) -->
  <g transform="translate(60, 80)">
    <path d="M20 60 L80 60 L70 20 L30 20 Z" fill="#fb923c"/>
    <path d="M30 20 L50 0 L70 20" fill="#f59e0b"/>
    <rect x="45" y="30" width="10" height="15" fill="#1e293b"/>
  </g>
  
  <!-- Character: Frustrated person walking away -->
  <g transform="translate(140, 90)">
    <!-- Body -->
    <path d="M20 40 Q20 80 20 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="20" cy="30" r="15" fill="#fde68a"/>
    <!-- Expression -->
    <path d="M12 25 Q15 22 18 25 M22 25 Q25 22 28 25" stroke="#1e293b" stroke-width="2"/>
    <path d="M15 35 Q20 38 25 35" stroke="#1e293b" stroke-width="2"/>
    <!-- Arm reaching back -->
    <path d="M20 50 L5 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs walking away -->
    <path d="M20 110 L10 140 M20 110 L30 140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Tools left behind -->
  <path d="M80 130 L100 130 L90 110 Z" fill="#94a3b8"/>
  <rect x="110" y="125" width="20" height="5" rx="2" fill="#ec4899"/>
  
  <!-- Warning/Emphasis Glow -->
  <circle cx="150" cy="50" r="3" fill="#10b981"/>
  <circle cx="160" cy="40" r="5" fill="#10b981"/>
</svg>