<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Divided background symbolizing contrast/juxtaposition -->
  <clipPath id="left-clip">
    <rect x="24" y="24" width="96" height="192"/>
  </clipPath>
  <clipPath id="right-clip">
    <rect x="120" y="24" width="96" height="192"/>
  </clipPath>

  <!-- Left Side: Luxury Metropolis (Golden/Warm/Bright) -->
  <g clip-path="url(#left-clip)">
    <!-- Dark warm sky gradient -->
    <rect x="24" y="24" width="96" height="192" fill="#24211D"/>
    <!-- Sleek skyscrapers -->
    <path d="M38 200 L38 90 L60 70 L82 90 L82 200 Z" fill="#D99B26"/>
    <path d="M70 200 L70 120 L95 105 L120 120 L120 200 Z" fill="#F2C14E"/>
    <!-- Glowing windows/details -->
    <rect x="46" y="100" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="58" y="100" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="46" y="120" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="58" y="120" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="46" y="140" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="58" y="140" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    
    <rect x="80" y="130" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="92" y="130" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="80" y="150" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    <rect x="92" y="150" width="6" height="8" fill="#1A1D24" opacity="0.6"/>
    
    <!-- Luxury glow on top -->
    <circle cx="60" cy="70" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Right Side: Dilapidated Slum (Cool/Dark/Desolate) -->
  <g clip-path="url(#right-clip)">
    <!-- Cold dark sky -->
    <rect x="120" y="24" width="96" height="192" fill="#1A222B"/>
    <!-- Jagged, uneven makeshift rooftops / shacks -->
    <path d="M130 200 L130 150 L145 135 L160 150 L160 200 Z" fill="#485A6C"/>
    <path d="M155 200 L155 125 L180 110 L205 125 L205 200 Z" fill="#323E4D"/>
    <!-- Patchy corrugated metal details -->
    <line x1="140" y1="160" x2="150" y2="160" stroke="#1A222B" stroke-width="2"/>
    <line x1="140" y1="175" x2="150" y2="175" stroke="#1A222B" stroke-width="2"/>
    
    <line x1="170" y1="140" x2="190" y2="140" stroke="#1A222B" stroke-width="2"/>
    <line x1="170" y1="155" x2="190" y2="155" stroke="#1A222B" stroke-width="2"/>
    <line x1="170" y1="170" x2="190" y2="170" stroke="#1A222B" stroke-width="2"/>

    <!-- Dim flickering single light -->
    <circle cx="180" cy="135" r="3" fill="#64B5F6" opacity="0.8"/>
  </g>

  <!-- Central dividing contrast line with distinct threshold -->
  <line x1="120" y1="24" x2="120" y2="216" stroke="#111317" stroke-width="4"/>
  <line x1="120" y1="24" x2="120" y2="216" stroke="#F2C14E" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Outer Framing -->
  <rect x="24" y="24" width="192" height="192" rx="16" fill="none" stroke="#2D333D" stroke-width="2"/>
</svg>