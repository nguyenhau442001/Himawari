<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Subtle geometric framing) -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Character 1 (Left - Gentleman offering handshake) -->
  <g id="character-left">
    <!-- Body/Suit -->
    <path d="M 75 160 L 70 195 L 105 195 L 100 160 Z" fill="#2E384D"/>
    <!-- Suit lapels -->
    <polygon points="85,160 90,175 95,160" fill="#E2E8F0"/>
    <!-- Head -->
    <circle cx="85" cy="138" r="14" fill="#E5A982"/>
    <!-- Hair -->
    <path d="M 71 138 C 71 128, 99 128, 99 138 C 97 133, 73 133, 71 138 Z" fill="#334155"/>
    <!-- Smile & Eye (Expressing grace/politeness) -->
    <path d="M 81 140 Q 84 142 87 140" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="136" r="1.5" fill="#1E293B"/>
    <!-- Extended Right Arm & Hand for Handshake -->
    <path d="M 95 155 Q 110 152 118 152" stroke="#E5A982" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Cuff -->
    <rect x="110" y="149" width="4" height="6" fill="#F8FAFC" rx="1"/>
  </g>

  <!-- Character 2 (Right - Receiving handshake with respect) -->
  <g id="character-right">
    <!-- Body/Suit -->
    <path d="M 165 160 L 170 195 L 135 195 L 140 160 Z" fill="#3B495E"/>
    <!-- Suit lapels -->
    <polygon points="155,160 150,175 145,160" fill="#E2E8F0"/>
    <!-- Head -->
    <circle cx="155" cy="138" r="14" fill="#F1C2A2"/>
    <!-- Hair -->
    <path d="M 141 138 C 141 128, 169 128, 169 138 C 167 133, 143 133, 141 138 Z" fill="#1E293B"/>
    <!-- Smile & Eye -->
    <path d="M 153 140 Q 156 142 159 140" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="152" cy="136" r="1.5" fill="#1E293B"/>
    <!-- Extended Left Arm & Hand for Handshake -->
    <path d="M 145 155 Q 130 152 122 152" stroke="#F1C2A2" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Cuff -->
    <rect x="126" y="149" width="4" height="6" fill="#F8FAFC" rx="1"/>
  </g>

  <!-- Interlocking Handshake Focus Area -->
  <circle cx="120" cy="152" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="120" cy="152" r="9" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtle Laurel/Trophy motif above to denote sportsmanship/grace under defeat -->
  <g id="trophy-crest" transform="translate(120, 68)">
    <!-- Glowing background accent -->
    <circle cx="0" cy="0" r="28" fill="#F59E0B" opacity="0.1"/>
    
    <!-- Minimalist Trophy -->
    <path d="M -10 -14 L 10 -14 L 7 4 C 7 10, 4 13, 0 13 C -4 13, -7 10, -7 4 Z" fill="#F59E0B"/>
    <!-- Trophy Base -->
    <rect x="-4" y="13" width="8" height="4" fill="#D97706" rx="1"/>
    <rect x="-8" y="17" width="16" height="3" fill="#B45309" rx="1.5"/>
    <!-- Handles -->
    <path d="M -10 -12 C -15 -12, -15 -4, -10 -2" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 -12 C 15 -12, 15 -4, 10 -2" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Star on Trophy -->
    <path d="M 0 -8 L 1.5 -4 L 5 -4 L 2 -1.5 L 3 2 L 0 0 L -3 2 L -2 -1.5 L -5 -4 L -1.5 -4 Z" fill="#FEF3C7" transform="scale(0.6) translate(0, -6)"/>
  </g>

  <!-- Dynamic Sparkles indicating refined character and dignity -->
  <g fill="#F59E0B">
    <!-- Left sparkle -->
    <path d="M 64 85 Q 64 89 60 89 Q 64 89 64 93 Q 64 89 68 89 Q 64 89 64 85 Z" opacity="0.8"/>
    <!-- Right sparkle -->
    <path d="M 176 85 Q 176 89 172 89 Q 176 89 176 93 Q 176 89 180 89 Q 176 89 176 85 Z" opacity="0.8"/>
  </g>
</svg>