<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Sidewalk and Wall -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="0" width="240" height="180" fill="#1e293b" fill-opacity="0.5"/>
  <path d="M0 180 L240 180" stroke="#475569" stroke-width="2"/>

  <!-- Street Lamp -->
  <rect x="30" y="40" width="4" height="140" fill="#475569"/>
  <path d="M25 40 Q32 30 39 40 Z" fill="#94a3b8"/>
  <circle cx="32" cy="45" r="12" fill="url(#lampGlow)"/>
  <circle cx="32" cy="45" r="4" fill="#fbbf24"/>

  <!-- The Falling Disaster (Shattered Flowerpot) -->
  <!-- Broken Shards -->
  <path d="M95 185 L105 178 L110 188 Z" fill="#fb923c"/>
  <path d="M115 182 L125 188 L118 195 Z" fill="#fb923c"/>
  <path d="M100 192 L112 198 L105 205 Z" fill="#fb923c"/>
  <!-- Soil and Plant -->
  <circle cx="110" cy="190" r="8" fill="#451a03"/>
  <path d="M108 185 Q105 170 115 175" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M112 188 Q120 175 125 182" stroke="#10b981" stroke-width="2" fill="none"/>
  <!-- Impact Lines -->
  <path d="M90 185 L80 180" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M130 185 L140 180" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M110 165 L110 155" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- The Character (Narrowly Escaped) -->
  <g transform="translate(150, 100)">
    <!-- Body -->
    <path d="M10 80 Q15 40 35 40 Q55 40 60 80" fill="#f59e0b"/>
    <!-- Legs in mid-stride -->
    <path d="M25 80 L15 105" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M45 80 L60 100" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <!-- Head looking back -->
    <circle cx="20" cy="25" r="15" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M5 20 Q5 5 25 5 Q35 10 35 25" fill="#1e293b"/>
    <!-- Expressive Face (Shocked/Relieved) -->
    <circle cx="12" cy="25" r="1.5" fill="#0f172a"/> <!-- Eye -->
    <path d="M8 32 Q12 38 16 32" stroke="#0f172a" stroke-width="1" fill="none"/> <!-- Mouth O-shape -->
    <path d="M8 18 Q12 15 16 18" stroke="#0f172a" stroke-width="1" fill="none"/> <!-- Eyebrow -->
    <!-- Arms -->
    <path d="M40 50 Q60 60 65 80" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M15 50 Q-5 65 0 85" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- High Window (Origin of the pot) -->
  <rect x="90" y="20" width="40" height="50" rx="2" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <path d="M90 45 L130 45" stroke="#475569" stroke-width="1"/>
  <path d="M110 20 L110 70" stroke="#475569" stroke-width="1"/>
  <rect x="85" y="70" width="50" height="4" rx="1" fill="#475569"/> <!-- Ledge -->

  <!-- Motion/Sweat Drop -->
  <path d="M165 115 Q160 110 165 105" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>