<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Representation for "按说" (Lẽ ra, thông thường mà nói / Expected norm vs Reality) -->
  <!-- We visualize a balanced, classic mechanical scale/balance representing "Standard expectation / Theory" -->

  <!-- Glow effect for background center -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Mechanical Scale / Balance (Representing "The logical rule / Lẽ ra") -->
  <!-- Base Stand -->
  <path d="M100 195h40v12h-40z" fill="#4F5D75" rx="2"/>
  <path d="M112 155h16v40h-16z" fill="#6C7A9C"/>
  <circle cx="120" cy="155" r="12" fill="#F39C12"/>
  <circle cx="120" cy="155" r="5" fill="#1A1D24"/>

  <!-- Central Pivot Beam (Tilted slightly to show the gap between expectation and reality) -->
  <g transform="rotate(-6 120 95)">
    <!-- Main Beam Bar -->
    <path d="M50 93h140v6H50z" fill="#E2E8F0" rx="3"/>
    <circle cx="120" cy="96" r="6" fill="#F39C12"/>

    <!-- Left Chain & Pan (Expected Norm / Textbook Standard) -->
    <path d="M60 96L60 135" stroke="#94A3B8" stroke-width="2"/>
    <path d="M60 96L45 135" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M60 96L75 135" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M35 135c0 10 25 10 50 0s25-10 50 0" fill="none" stroke="#CBD5E1" stroke-width="3"/>
    <ellipse cx="60" cy="135" rx="25" ry="8" fill="#3B82F6"/>

    <!-- Items on Left Pan: Mathematical formula document / Ideal expectation -->
    <rect x="48" y="118" width="24" height="18" rx="2" fill="#FFFFFF"/>
    <path d="M53 123h14M53 128h10M53 133h8" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right Chain & Pan (Actual outcome / Reality check) -->
    <path d="M180 96L180 145" stroke="#94A3B8" stroke-width="2"/>
    <path d="M180 96L165 145" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M180 96L195 145" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M155 145c0 10 25 10 50 0s25-10 50 0" fill="none" stroke="#CBD5E1" stroke-width="3"/>
    <ellipse cx="180" cy="145" rx="25" ry="8" fill="#EF4444"/>

    <!-- Item on Right Pan: Question mark / Variable hurdle -->
    <path d="M174 122c0-4 3-7 6-7s6 3 6 7c0 3-3 5-5 6v3" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="175" cy="135" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Accent Dashed Reference Line (Ideal Horizontal Level) -->
  <line x1="40" y1="96" x2="200" y2="96" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Contextual highlight dot (Golden focus point) -->
  <circle cx="120" cy="96" r="3" fill="#FFFFFF"/>
</svg>