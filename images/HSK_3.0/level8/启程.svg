<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Morning Light Glow -->
    <linearGradient id="morning-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character 1 Jacket Gradient -->
    <linearGradient id="jacket-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Jacket Gradient -->
    <linearGradient id="jacket-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Suitcase Gradient -->
    <linearGradient id="suitcase-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / SCENERY (Cozy apartment ready for morning departure) -->
  <!-- Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <path d="M 0 190 L 240 190" stroke="#334155" stroke-width="2"/>

  <!-- Wallpaper / Interior Wall -->
  <rect x="0" y="0" width="240" height="190" fill="#1e293b"/>
  
  <!-- Window Frame showing early morning sky (orange/blue gradient) -->
  <g transform="translate(140, 35)">
    <rect x="0" y="0" width="70" height="110" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="4" y="4" width="62" height="102" fill="#0284c7"/>
    <!-- Morning Sky inside window -->
    <path d="M 4 4 L 66 4 L 66 106 L 4 106 Z" fill="url(#morning-glow)"/>
    <circle cx="20" cy="40" r="12" fill="#fef08a" opacity="0.9"/>
    <!-- Window Panes -->
    <line x1="35" y1="4" x2="35" y2="106" stroke="#475569" stroke-width="2"/>
    <line x1="4" y1="55" x2="66" y2="55" stroke="#475569" stroke-width="2"/>
    <!-- Curtains -->
    <path d="M 4 4 Q 15 50 8 106 L 4 106 Z" fill="#38bdf8" opacity="0.4"/>
    <path d="M 66 4 Q 55 50 62 106 L 66 106 Z" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Light Beam streaming through window onto the travelers -->
  <polygon points="140,35 210,35 120,190 20,190" fill="url(#light-beam)"/>

  <!-- Wall shelf with travel props -->
  <rect x="25" y="65" width="80" height="6" rx="2" fill="#475569"/>
  <!-- Small globe on shelf -->
  <circle cx="45" cy="50" r="11" fill="#38bdf8" opacity="0.8"/>
  <path d="M 40 45 Q 48 42 50 50 Q 42 56 40 45 Z" fill="#10b981" opacity="0.7"/>
  <path d="M 43 61 L 47 61 L 45 65 Z" fill="#94a3b8"/>
  <!-- Travel book -->
  <rect x="65" y="48" width="16" height="17" rx="2" fill="#f43f5e"/>
  <rect x="68" y="52" width="10" height="2" fill="#ffffff" opacity="0.8"/>

  <!-- Wall Clock showing early hour (e.g., 6:00 AM) -->
  <circle cx="90" cy="30" r="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <circle cx="90" cy="30" r="1.5" fill="#1e293b"/>
  <line x1="90" y1="30" x2="90" y2="23" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="30" x2="96" y2="30" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- LUGGAGE & PROPS (Ready for departure) -->
  <!-- Big Travel Suitcase 1 -->
  <g transform="translate(35, 135)" filter="url(#shadow)">
    <rect x="0" y="10" width="36" height="45" rx="6" fill="url(#suitcase-grad)"/>
    <!-- Suitcase details -->
    <rect x="3" y="15" width="30" height="35" rx="3" fill="none" stroke="#065f46" stroke-width="1.5" stroke-dasharray="4,2"/>
    <path d="M 12 10 L 12 6 C 12 4 14 3 16 3 L 20 3 C 22 3 24 4 24 6 L 24 10" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="8" cy="57" r="3" fill="#0f172a"/>
    <circle cx="28" cy="57" r="3" fill="#0f172a"/>
  </g>

  <!-- Smaller Backpack / Carry-on -->
  <g transform="translate(15, 140)" filter="url(#shadow)">
    <rect x="0" y="8" width="22" height="30" rx="6" fill="#f59e0b"/>
    <path d="M 5 8 C 5 3 17 3 17 8" fill="none" stroke="#d97706" stroke-width="2"/>
    <rect x="3" y="20" width="16" height="14" rx="3" fill="#d97706"/>
    <!-- Straps -->
    <path d="M 6 8 L 2 16" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <path d="M 16 8 L 20 16" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CHARACTERS: Two smiling travelers ready to set off ("我们明天早上启程") -->
  
  <!-- CHARACTER 1 (Left - Person holding boarding ticket/passport) -->
  <g transform="translate(75, 110)" filter="url(#shadow)">
    <!-- Legs/Pants -->
    <rect x="12" y="50" width="10" height="30" rx="3" fill="#334155"/>
    <rect x="26" y="50" width="10" height="30" rx="3" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="16" cy="80" rx="7" ry="3" fill="#0f172a"/>
    <ellipse cx="30" cy="80" rx="7" ry="3" fill="#0f172a"/>

    <!-- Torso / Jacket -->
    <path d="M 10 20 L 38 20 C 42 20 44 25 42 32 L 36 52 C 35 55 30 55 28 52 L 24 38 L 20 52 C 18 55 13 55 12 52 L 6 32 C 4 25 6 20 10 20 Z" fill="url(#jacket-1)"/>
    <!-- Jacket zipper line -->
    <line x1="24" y1="20" x2="24" y2="42" stroke="#0284c7" stroke-width="2"/>
    <!-- Scarf -->
    <path d="M 16 18 Q 24 24 32 18 Q 36 24 30 28 Q 24 26 18 28 Z" fill="#f43f5e"/>

    <!-- Head & Hair -->
    <circle cx="24" cy="5" r="11" fill="#fcd34d"/> <!-- Face base -->
    <!-- Hair -->
    <path d="M 13 5 C 13 -3 35 -3 35 5 C 35 8 33 6 31 3 C 27 0 21 0 17 3 C 15 6 13 8 13 5 Z" fill="#334155"/>
    <!-- Friendly happy expression -->
    <circle cx="20" cy="4" r="1.5" fill="#1e293b"/>
    <circle cx="28" cy="4" r="1.5" fill="#1e293b"/>
    <path d="M 22 9 Q 24 12 26 9" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="18" cy="7" r="2" fill="#fda4af" opacity="0.6"/>
    <circle cx="30" cy="7" r="2" fill="#fda4af" opacity="0.6"/>

    <!-- Arms & Raised Hand waving / holding travel document -->
    <path d="M 8 24 Q 2 30 6 36" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand holding passport/ticket -->
    <rect x="2" y="32" width="10" height="7" rx="1" fill="#f8fafc" transform="rotate(-15 2 32)"/>

    <path d="M 40 24 Q 48 30 42 38" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2 (Right - Person with backpack/suitcase handle ready) -->
  <g transform="translate(135, 100)" filter="url(#shadow)">
    <!-- Legs/Pants -->
    <path d="M 14 55 L 14 90 C 14 92 12 92 10 90 L 10 55 Z" fill="#1e293b"/>
    <path d="M 28 55 L 28 90 C 28 92 30 92 32 90 L 32 55 Z" fill="#1e293b"/>
    <!-- Shoes -->
    <ellipse cx="12" cy="91" rx="7" ry="3.5" fill="#334155"/>
    <ellipse cx="30" cy="91" rx="7" ry="3.5" fill="#334155"/>

    <!-- Torso / Jacket -->
    <path d="M 10 25 L 32 25 C 38 25 40 30 38 38 L 32 60 C 31 63 26 63 24 60 L 21 45 L 19 60 C 17 63 12 63 11 60 L 5 38 C 3 30 5 25 10 25 Z" fill="url(#jacket-2)"/>
    <!-- Backpack straps visible -->
    <path d="M 14 25 L 10 38" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 28 25 L 32 38" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <circle cx="21" cy="11" r="11" fill="#fde68a"/>
    <!-- Stylish Hair -->
    <path d="M 10 11 C 10 1 32 1 32 11 C 30 6 28 4 24 5 C 20 2 15 4 12 7 C 11 9 10 11 10 11 Z" fill="#7c2d12"/>
    <!-- Expression -->
    <circle cx="17" cy="10" r="1.5" fill="#1e293b"/>
    <circle cx="25" cy="10" r="1.5" fill="#1e293b"/>
    <path d="M 19 14 Q 21 17 23 14" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="15" cy="13" r="2" fill="#f43f5e" opacity="0.5"/>
    <circle cx="27" cy="13" r="2" fill="#f43f5e" opacity="0.5"/>

    <!-- Arms -->
    <path d="M 8 28 Q 2 36 10 44" fill="none" stroke="#be123c" stroke-width="6" stroke-linecap="round"/>
    <!-- Active arm gesturing forward / holding suitcase -->
    <path d="M 34 28 Q 42 34 38 46" fill="none" stroke="#be123c" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Small Travel Coffee Cups / Extra Realism Props on small round table -->
  <g transform="translate(180, 150)" filter="url(#shadow)">
    <!-- Table -->
    <ellipse cx="15" cy="20" rx="18" ry="7" fill="#475569"/>
    <rect x="12" y="20" width="6" height="22" fill="#334155"/>
    <ellipse cx="15" cy="42" rx="10" ry="4" fill="#1e293b"/>
    <!-- Coffee Cup 1 -->
    <path d="M 7 10 L 9 18 C 9 19 11 19 12 18 L 14 10 Z" fill="#f8fafc"/>
    <ellipse cx="10.5" cy="10" rx="2.5" ry="1" fill="#a16207"/>
    <!-- Coffee Cup 2 -->
    <path d="M 16 12 L 18 19 C 18 20 20 20 21 19 L 23 12 Z" fill="#38bdf8"/>
    <ellipse cx="19.5" cy="12" rx="2.5" ry="1" fill="#ffffff"/>
  </g>

  <!-- Sparkles / Morning freshness indicator -->
  <g fill="#fef08a" opacity="0.8">
    <path d="M 125 50 Q 125 55 120 55 Q 125 55 125 60 Q 125 55 130 55 Q 125 55 125 50 Z"/>
    <path d="M 60 95 Q 60 98 57 98 Q 60 98 60 101 Q 60 98 63 98 Q 60 98 60 95 Z"/>
  </g>
</svg>