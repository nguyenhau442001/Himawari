  <circle cx="180" cy="70" r="15" fill="#fbbf24"/>
  <path d="M180 50 L180 55 M180 85 L180 90 M160 70 L165 70 M195 70 L200 70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
