<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background architectural hint (dark slate wall & pillar silhouettes) -->
  <path d="M40 70 L200 70 L200 200 L40 200 Z" fill="#222630"/>
  <rect x="55" y="85" width="25" height="115" fill="#1E222B"/>
  <rect x="160" y="85" width="25" height="115" fill="#1E222B"/>

  <!-- Focus Object: Decayed Wooden Beam (Horizontal Cross-section & Fracture) -->
  <!-- Main Beam Body -->
  <path d="M40 100 L200 100 L200 145 L40 145 Z" fill="#3D2C22"/>
  
  <!-- Upper weathered and cracked surface (sun & rain erosion) -->
  <path d="M40 100 L200 100 L200 108 L40 108 Z" fill="#2E2018"/>
  
  <!-- Deep cracks and structural decay fractures -->
  <path d="M75 100 L70 120 L80 135 L73 145" stroke="#1A1D24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M145 100 L152 118 L142 130 L148 145" stroke="#1A1D24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 100 L105 112 L115 125" stroke="#1A1D24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crumbling inner texture (molded/rotten core exposure in center) -->
  <path d="M90 104 C100 115, 120 115, 130 104 C135 120, 115 135, 95 120 Z" fill="#231711"/>
  <ellipse cx="110" cy="115" rx="18" ry="8" fill="#160E0A"/>

  <!-- Flaking wood grain & decay details (High contrast orange/gold accent for focal decay areas) -->
  <!-- Splintering edge falling apart -->
  <path d="M185 100 L205 95 L195 110 Z" fill="#E67E22" opacity="0.85"/>
  <path d="M190 130 L210 135 L200 145 Z" fill="#D35400" opacity="0.9"/>
  <path d="M50 140 L35 150 L45 145 Z" fill="#D35400" opacity="0.7"/>

  <!-- Fungal growth / mold spots indicating rotting (organic decay) -->
  <path d="M82 125 Q87 120, 92 125 Q90 132, 82 125 Z" fill="#E67E22"/>
  <path d="M158 115 Q163 110, 168 116 Q162 122, 158 115 Z" fill="#E67E22"/>
  <path d="M125 135 Q130 130, 135 136 Q130 140, 125 135 Z" fill="#D35400"/>

  <!-- Falling wood dust / particles -->
  <circle cx="195" cy="155" r="3" fill="#D35400" opacity="0.8"/>
  <circle cx="205" cy="165" r="1.5" fill="#E67E22" opacity="0.7"/>
  <circle cx="185" cy="170" r="2" fill="#C0392B" opacity="0.6"/>
  <circle cx="55" cy="155" r="2" fill="#D35400" opacity="0.7"/>
  <circle cx="45" cy="163" r="1" fill="#E67E22" opacity="0.6"/>

  <!-- Structural sagging/deformation line (showing weakness) -->
  <path d="M40 122 Q120 132 200 122" stroke="#231711" stroke-width="3" fill="none" stroke-dasharray="6,4"/>
</svg>