<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Character Silhouette / Dual Persona Representing "虚伪" (Hypocrisy / Two-faced) -->
  <g transform="translate(120, 115)">
    <!-- Body / Suit -->
    <path d="M-30 65 L-35 85 L35 85 L30 65 Z" fill="#2E3646"/>
    <path d="M-15 65 L0 80 L15 65 Z" fill="#1A1D24"/>
    <path d="M-8 48 L8 48 L6 68 L-6 68 Z" fill="#E2E8F0"/>
    <!-- Red tie representing formal exterior -->
    <polygon points="0,48 -4,64 0,72 4,64" fill="#F59E0B"/>

    <!-- Shoulders & Neck -->
    <path d="M-35 48 C-35 38 -20 35 -12 35 C-12 30 -8 24 0 24 C8 24 12 30 12 35 C20 35 35 38 35 48 Z" fill="#3B4252"/>

    <!-- Head Base -->
    <circle cx="0" cy="0" r="28" fill="#3B4252"/>

    <!-- Mask Divider (Profile split) -->
    <!-- Outer Face (The Polite Mask - Gold/Orange Accent, Warm & Smiling) -->
    <path d="M 0,-28 A 28,28 0 0,1 28,0 A 28,28 0 0,1 0,28 Z" fill="#434C5E"/>
    
    <!-- Outer Mask Facial Features (Smiling, Friendly) -->
    <path d="M 12,-4 C 15,-4 18,-2 19,0" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none"/> <!-- Friendly Eye -->
    <path d="M 8,10 C 13,15 18,12 21,8" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/> <!-- Wide Fake Smile -->
    <circle cx="17" cy="4" r="4" fill="#F59E0B" opacity="0.3"/> <!-- Rosy cheek -->

    <!-- Inner Face (The True Dark Nature - Hidden Behind) -->
    <path d="M 0,-28 A 28,28 0 0,0 -28,0 A 28,28 0 0,0 0,28 Z" fill="#242B38"/>
    
    <!-- Inner Mask Facial Features (Cold, Calculating, Deceptive) -->
    <path d="M -16,-5 L -8,-3" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/> <!-- Narrowed, scheming eye -->
    <path d="M -15,10 C -10,6 -5,6 -2,9" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none"/> <!-- Smirking/Smug mouth -->

    <!-- Splitting Seam / Crack representing duplicity -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#1A1D24" stroke-width="2"/>
    <circle cx="0" cy="-28" r="1.5" fill="#F59E0B"/>
    <circle cx="0" cy="28" r="1.5" fill="#F59E0B"/>
  </g>

  <!-- Contrast floating symbols (Scale/Contrast exaggeration: False mask vs Sharp truth) -->
  <!-- Floating Warm Social Mask Symbol (Right) -->
  <g transform="translate(185, 80)">
    <circle cx="0" cy="0" r="18" fill="#252A34" stroke="#F59E0B" stroke-width="2"/>
    <!-- Smiley Face Icon -->
    <circle cx="-5" cy="-3" r="2" fill="#F59E0B"/>
    <circle cx="5" cy="-3" r="2" fill="#F59E0B"/>
    <path d="M -6,4 C -3,8 3,8 6,4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating True Cold Nature Symbol (Left) -->
  <g transform="translate(55, 80)">
    <circle cx="0" cy="0" r="18" fill="#252A34" stroke="#EF4444" stroke-width="2"/>
    <!-- Cold/Sharp Icon -->
    <path d="M -6,-4 L 6,6 M -6,6 L 6,-4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Ground shadow / Base element -->
  <ellipse cx="120" cy="205" rx="45" ry="6" fill="#111318"/>
</svg>