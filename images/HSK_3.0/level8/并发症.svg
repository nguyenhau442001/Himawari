<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: Medical diagnostic tablet/scan displaying interconnected organ complications -->
  <g transform="translate(30, 25)">
    <!-- Device Body -->
    <rect x="0" y="0" width="180" height="150" rx="16" fill="#242B38" stroke="#333D4F" stroke-width="3"/>
    
    <!-- Screen Header -->
    <circle cx="90" cy="14" r="3" fill="#3D4A61"/>
    
    <!-- Screen Display Area -->
    <rect x="14" y="26" width="152" height="110" rx="8" fill="#151921"/>
    
    <!-- Primary Trigger Source (Center Top): Blood Drop / Sugar Marker -->
    <g transform="translate(90, 42)">
      <path d="M0 -10 C4 -10 8 -4 8 2 C8 7 4 12 0 16 C-4 12 -8 7 -8 2 C-8 -4 -4 -10 0 -10 Z" fill="#FF5E62"/>
    </g>
    
    <!-- Cascading Ripple / Influence Lines -->
    <path d="M82 62 L55 80" stroke="#FF8A00" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round"/>
    <path d="M98 62 L125 80" stroke="#FF8A00" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round"/>
    
    <!-- Secondary Consequence 1: Kidney (Renal Complication) -->
    <g transform="translate(42, 92)">
      <!-- Kidney shape -->
      <path d="M0 -12 C10 -14 16 -6 14 4 C12 14 4 18 -4 14 C-10 10 -12 2 -8 -6 Z" fill="#2E394D" stroke="#FF5E62" stroke-width="2.5"/>
      <!-- Warning accent -->
      <circle cx="3" cy="2" r="3" fill="#FF8A00"/>
    </g>
    
    <!-- Secondary Consequence 2: Eye (Ocular Complication) -->
    <g transform="translate(138, 92)">
      <!-- Eye shape -->
      <path d="M-14 0 C-6 -10 6 -10 14 0 C6 10 -6 10 -14 0 Z" fill="#2E394D" stroke="#FF5E62" stroke-width="2.5"/>
      <!-- Pupil & warning -->
      <circle cx="0" cy="0" r="4.5" fill="#151921"/>
      <circle cx="0" cy="0" r="2" fill="#FF8A00"/>
    </g>
    
    <!-- Connection Nodes (Bottom subtle analytics) -->
    <rect x="35" y="122" width="110" height="4" rx="2" fill="#2A3446"/>
    <rect x="55" y="122" width="40" height="4" rx="2" fill="#FF8A00"/>
  </g>

  <!-- Base Stand / Shadow for Physical Object Realism -->
  <path d="M70 185 L170 185" stroke="#333D4F" stroke-width="4" stroke-linecap="round"/>
  <path d="M95 193 L145 193" stroke="#242B38" stroke-width="4" stroke-linecap="round"/>

  <!-- Accent Focus Glow / Corner Tag -->
  <circle cx="195" cy="45" r="4" fill="#FF8A00"/>
  <circle cx="45" cy="45" r="4" fill="#FF5E62"/>
</svg>