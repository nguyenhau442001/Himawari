<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <radialGradient id="urgentGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Urgent Glow around Center -->
  <circle cx="120" cy="120" r="110" fill="url(#urgentGlow)"/>

  <!-- Background Environment & Architecture -->
  <g id="environment">
    <!-- Window backdrop showing night city/office vibe -->
    <rect x="145" y="45" width="65" height="75" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- City lights outside window -->
    <rect x="155" y="60" width="12" height="18" rx="2" fill="#38bdf8" opacity="0.3"/>
    <rect x="173" y="55" width="10" height="30" rx="2" fill="#f59e0b" opacity="0.3"/>
    <rect x="190" y="70" width="12" height="22" rx="2" fill="#10b981" opacity="0.3"/>
    <!-- Window Frame cross -->
    <line x1="145" y1="82" x2="210" y2="82" stroke="#334155" stroke-width="2"/>
    <line x1="177" y1="45" x2="177" y2="120" stroke="#334155" stroke-width="2"/>

    <!-- Bookshelf / Office Wall Props -->
    <rect x="25" y="50" width="45" height="6" rx="2" fill="#334155"/>
    <path d="M33 35 L39 50 L27 50 Z" fill="#ec4899" opacity="0.7"/>
    <rect x="42" y="38" width="8" height="12" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="52" y="42" width="10" height="8" rx="1" fill="#f59e0b" opacity="0.8"/>

    <!-- Plant on shelf -->
    <path d="M60 50 C60 40 70 40 70 50 Z" fill="#10b981"/>
    <path d="M62 50 C58 45 55 42 53 45" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M67 50 C72 45 76 43 78 46" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Wall clock showing late hour -->
    <circle cx="105" cy="55" r="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="105" cy="55" r="1.5" fill="#f8fafc"/>
    <line x1="105" y1="55" x2="105" y2="47" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="105" y1="55" x2="112" y2="58" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Office Desk & Equipment -->
  <g id="desk-and-props" filter="url(#shadow)">
    <!-- Main Desk Surface -->
    <path d="M20 160 L220 160 L210 200 L30 200 Z" fill="#334155"/>
    <path d="M15 155 L225 155 L220 160 L20 160 Z" fill="#475569"/>

    <!-- Desk Lamp -->
    <path d="M185 155 L185 110 L195 100" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M185 100 L175 85 L200 85 Z" fill="#f59e0b"/>
    <!-- Light cone pointing down -->
    <polygon points="187,100 140,165 210,165" fill="#f59e0b" opacity="0.12"/>

    <!-- Laptop showing Financial Charts -->
    <!-- Laptop Base -->
    <path d="M85 158 L145 158 L155 168 L75 168 Z" fill="#94a3b8"/>
    <!-- Laptop Screen -->
    <rect x="80" y="110" width="64" height="50" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- Screen Inner Glow -->
    <rect x="83" y="113" width="58" height="44" rx="2" fill="url(#screenGlow)"/>
    <!-- Financial Red Alert Chart on Screen -->
    <path d="M90 145 L102 138 L114 142 L126 125 L135 128" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Chart Grid Lines -->
    <line x1="90" y1="150" x2="135" y2="150" stroke="#334155" stroke-width="1"/>
    <line x1="90" y1="120" x2="90" y2="150" stroke="#334155" stroke-width="1"/>
    <!-- Negative trend red indicator dot -->
    <circle cx="126" cy="125" r="3" fill="#ef4444" filter="url(#glow)"/>

    <!-- Important Financial Documents / Papers scattered -->
    <g transform="rotate(-12 55 150)">
      <rect x="45" y="135" width="30" height="38" rx="2" fill="#f8fafc"/>
      <line x1="50" y1="143" x2="68" y2="143" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="150" x2="65" y2="150" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="157" x2="60" y2="157" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="rotate(8 165 155)">
      <rect x="150" y="140" width="28" height="34" rx="2" fill="#f8fafc"/>
      <line x1="155" y1="148" x2="170" y2="148" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <circle cX="164" cy="162" r="5" fill="#ef4444" opacity="0.3"/>
    </g>
  </g>

  <!-- Main Character (Stressed Businessperson/Entrepreneur) -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Chair Backrest -->
    <rect x="95" y="80" width="35" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <path d="M112 150 L112 185" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <circle cx="112" cy="185" r="8" fill="#334155"/>

    <!-- Torso (leaning forward in intense focus) -->
    <path d="M92 120 C92 110 115 105 132 115 L142 155 L90 155 Z" fill="#2563eb"/> <!-- Blue formal shirt -->
    <!-- Collar -->
    <path d="M108 112 L112 124 L118 112 Z" fill="#f8fafc"/>
    <!-- Red tie pointing sharply down -->
    <path d="M110 123 L114 123 L116 142 L112 147 L108 142 Z" fill="#dc2626"/>

    <!-- Head & Expression (Stressed, Intense, Focused) -->
    <g transform="translate(112, 85)">
      <!-- Neck -->
      <rect x="-6" y="15" width="12" height="15" fill="#fcd34d" rx="4"/>

      <!-- Head Base -->
      <circle cx="0" cy="0" r="22" fill="#fcd34d"/>

      <!-- Hair (Messy from stress/overwork) -->
      <path d="M-20 -5 C-22 -20 -5 -26 5 -24 C16 -22 22 -12 21 -2 C22 -10 15 -18 2 -18 C-10 -18 -18 -10 -20 -5 Z" fill="#1e293b"/>

      <!-- Eyebrows (Angled intensely downward, showing urgency) -->
      <path d="M-10 -5 L-2 -8" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M2 -8 L10 -5" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Eyes (Focused wide) -->
      <circle cx="-6" cy="-1" r="2.5" fill="#1e293b"/>
      <circle cx="6" cy="-1" r="2.5" fill="#1e293b"/>

      <!-- Sweat Drop (Symbolizing pressure & urgency) -->
      <path d="M15 -10 C18 -5 18 2 15 2 C12 2 12 -5 15 -10 Z" fill="#38bdf8" filter="url(#glow)"/>

      <!-- Mouth (Tense, pressed line) -->
      <path d="M-5 9 C-2 11 2 11 5 9" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Arms & Hands (Propping head / Touching temples in deep problem-solving gesture) -->
    <!-- Left Arm & Hand touching temple -->
    <path d="M96 120 C85 110 90 90 102 88" stroke="#2563eb" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand on head -->
    <circle cx="104" cy="85" r="6" fill="#fcd34d"/>

    <!-- Right Arm reaching toward laptop / desk -->
    <path d="M130 125 C145 130 145 145 135 155" stroke="#2563eb" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right Hand -->
    <circle cx="132" cy="157" r="5.5" fill="#fcd34d"/>
  </g>

  <!-- Foreground Dynamic Elements: Focus / Urgency Indicators -->
  <!-- Floating warning/priority badge (Abstracted cleanly without text) -->
  <g transform="translate(195, 45)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" opacity="0.9"/>
    <path d="M0 -7 L0 3" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="2" fill="#f8fafc"/>
  </g>

  <!-- Glowing Coin / Capital Symbol (Representing 资金 / Funds) floating slightly as the core issue -->
  <g transform="translate(145, 95)" filter="url(#glow)">
    <circle cx="0" cy="0" r="12" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <!-- Currency sign stylized -->
    <path d="M-3 -4 L3 -4 M0 -6 L0 6 M-3 4 L3 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtle Light Sweep / Vignette for polished app illustration look -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
</svg>