<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect for rising dough -->
  <circle cx="120" cy="135" r="70" fill="#FFB74D" opacity="0.08" filter="blur(15px)"/>

  <!-- Bread Loaf Pan -->
  <g>
    <!-- Pan Rim/Back edge -->
    <path d="M 65 145 L 175 145 L 165 175 C 163 182, 155 188, 145 188 L 95 188 C 85 188, 77 182, 75 175 Z" fill="#374151" />
    <!-- Pan Body Front -->
    <path d="M 68 145 L 172 145 L 163 173 C 161 179, 154 184, 145 184 L 95 184 C 86 184, 79 179, 77 173 Z" fill="#4B5563" />
    <!-- Pan Inner Shadow -->
    <ellipse cx="120" cy="145" rx="52" ry="5" fill="#1F2937" />
  </g>

  <!-- Fermenting Bread Dough (Puffy, rising smoothly, overlapping the rim) -->
  <g>
    <!-- Main Dough Body -->
    <path d="M 68 135 
             C 60 120, 75 95, 95 100 
             C 105 80, 135 80, 145 100 
             C 165 95, 180 120, 172 135 
             C 185 160, 55 160, 68 135 Z" 
          fill="#F6E05E" />
    
    <!-- Dough Highlights / Soft Curves -->
    <path d="M 95 100 C 105 88, 135 88, 145 100 C 135 110, 105 110, 95 100 Z" fill="#FEF08A" opacity="0.6"/>
    
    <!-- Cut lines / Scoring on dough -->
    <path d="M 105 112 C 112 118, 128 118, 135 112" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 85 125 C 92 131, 102 131, 108 125" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 132 125 C 138 131, 148 131, 155 125" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Rising/Activity Bubbles (Yeast fermentation concept) -->
  <g fill="#FFB74D">
    <circle cx="95" cy="78" r="4" opacity="0.9"/>
    <circle cx="103" cy="65" r="2.5" opacity="0.7"/>
    <circle cx="140" cy="72" r="3.5" opacity="0.8"/>
    <circle cx="150" cy="58" r="2" opacity="0.6"/>
    <circle cx="120" cy="55" r="4.5" opacity="0.9"/>
    <circle cx="127" cy="42" r="2" opacity="0.5"/>
  </g>

  <!-- Subtle Motion / Rising Steam Lines -->
  <g stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M 105 38 Q 100 30 108 22" />
    <path d="M 135 38 Q 140 30 132 22" />
  </g>
</svg>