<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Warm Accent Glow -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Accent Glow -->
    <radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment & Lighting -->
  <circle cx="70" cy="120" r="80" fill="url(#blue-glow)"/>
  <circle cx="170" cy="120" r="80" fill="url(#amber-glow)"/>

  <!-- Interior Wall & Architecture -->
  <line x1="120" y1="40" x2="120" y2="190" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  
  <!-- Window view background -->
  <path d="M95 35 L145 35 L140 75 L100 75 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Central Meeting Table -->
  <path d="M70 175 L170 175 L185 195 L55 195 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M65 170 L175 170 L170 175 L70 175 Z" fill="#475569"/>

  <!-- Table Props: Blue Side (Left) -->
  <rect x="80" y="160" width="16" height="12" rx="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="105" cy="166" r="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Table Props: Amber Side (Right) -->
  <rect x="144" y="160" width="16" height="12" rx="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="128" cy="166" r="6" fill="#334155" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Central Documents / Divergent Ideas Props -->
  <g transform="translate(112, 163) rotate(-12)">
    <rect x="-8" y="-6" width="16" height="12" rx="1" fill="#f8fafc"/>
    <line x1="-5" y1="-2" x2="3" y2="-2" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-5" y1="2" x2="1" y2="2" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <g transform="translate(128, 164) rotate(15)">
    <rect x="-8" y="-6" width="16" height="12" rx="1" fill="#cbd5e1"/>
    <line x1="-5" y1="-2" x2="3" y2="-2" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-5" y1="2" x2="-1" y2="2" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- CHARACTER 1: Left Side (Cool/Blue Tone, Skeptical/Refusing gesture) -->
  <g id="character-left" transform="translate(15, 0)">
    <!-- Body / Torso -->
    <path d="M35 185 C35 150 55 140 75 140 C95 140 115 150 115 185 Z" fill="#0284c7"/>
    <!-- Collar / Shirt -->
    <polygon points="65,140 75,155 85,140" fill="#f8fafc"/>
    
    <!-- Head & Hair -->
    <circle cx="75" cy="115" r="18" fill="#fbcfe8"/>
    <path d="M57 115 C57 100 70 95 80 95 C93 95 93 110 93 115 Z" fill="#0f172a"/>
    
    <!-- Facial Features (Skeptical look - brow furrowed, mouth straight) -->
    <line x1="67" y1="110" x2="75" y2="113" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="79" y1="113" x2="87" y2="110" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <circle cx="70" cy="117" r="1.5" fill="#1e293b"/>
    <circle cx="81" cy="117" r="1.5" fill="#1e293b"/>
    <line x1="73" y1="126" x2="79" y2="126" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Arm (Crossed / Defensive) -->
    <path d="M50 150 C50 165 70 165 75 175" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <path d="M95 150 C95 160 85 170 75 175" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2: Right Side (Warm/Amber Tone, Expressive/Disagreeing gesture) -->
  <g id="character-right" transform="translate(110, 0)">
    <!-- Body / Torso -->
    <path d="M35 185 C35 150 55 140 75 140 C95 140 115 150 115 185 Z" fill="#d97706"/>
    <!-- Collar / Shirt -->
    <polygon points="65,140 75,155 85,140" fill="#f8fafc"/>

    <!-- Head & Hair -->
    <circle cx="75" cy="115" r="18" fill="#fed7aa"/>
    <path d="M58 110 C60 98 75 96 85 100 C92 103 93 115 93 115 Z" fill="#78350f"/>

    <!-- Facial Features (Talking / Disagreeing - raised brows, open mouth) -->
    <line x1="67" y1="110" x2="75" y2="108" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="79" y1="108" x2="87" y2="110" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="70" cy="115" r="1.5" fill="#78350f"/>
    <circle cx="81" cy="115" r="1.5" fill="#78350f"/>
    <ellipse cx="75" cy="126" rx="3" ry="2" fill="#78350f"/>

    <!-- Right Arm (Gesturing upward / debating) -->
    <path d="M50 155 C40 145 45 130 55 125" fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
    <circle cx="55" cy="122" r="5" fill="#fed7aa"/>
  </g>

  <!-- Floating Abstract Visual Debate Elements (Contrasting Thoughts) -->
  <!-- Left thought bubble / indicator (Cool Blue X/Square) -->
  <g transform="translate(55, 70)" opacity="0.8">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#38bdf8"/>
  </g>

  <!-- Right thought bubble / indicator (Warm Amber Circle/Triangle) -->
  <g transform="translate(185, 70)" opacity="0.8">
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
    <polygon points="0,-6 6,5 -6,5" fill="#fbbf24"/>
  </g>

  <!-- Tension / Disagreement Spark in Center -->
  <path d="M120 95 L124 105 L116 108 L122 118" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>