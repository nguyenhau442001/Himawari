<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="205" rx="60" ry="8" fill="#121418" opacity="0.5"/>
  
  <!-- Horse -->
  <path d="M165 195 L155 195 L145 155 L105 155 L95 195 L85 195 L100 145 L90 145 L75 115 L85 95 L110 90 L135 95 L150 145 L140 145 Z" fill="#E2E8F0"/>
  <path d="M85 95 L70 85 L72 75 L85 80 Z" fill="#CBD5E0"/> <!-- Horse Head -->
  <path d="M110 90 L105 75 L115 75 Z" fill="#CBD5E0"/> <!-- Horse Mane detail -->
  
  <!-- Rider -->
  <rect x="115" y="105" width="12" height="35" rx="4" fill="#2D3748"/> <!-- Torso -->
  <circle cx="121" cy="98" r="7" fill="#2D3748"/> <!-- Head -->
  
  <!-- Flowing Cape (The "Wind/Majesty" element) -->
  <path d="M115 108 Q80 100 60 130 Q85 135 115 125" fill="#F6AD55">
    <animate attributeName="d" values="M115 108 Q80 100 60 130 Q85 135 115 125;M115 108 Q80 95 55 125 Q85 140 115 125;M115 108 Q80 100 60 130 Q85 135 115 125" dur="3s" repeatCount="indefinite" />
  </path>
  
  <!-- Accents / Reins -->
  <path d="M75 85 L115 115" stroke="#ED8936" stroke-width="1.5" fill="none"/>
  
  <!-- Decorative Majesty Sparks -->
  <circle cx="170" cy="90" r="2" fill="#F6AD55"/>
  <circle cx="185" cy="110" r="3" fill="#FBD38D"/>
  <circle cx="175" cy="130" r="1.5" fill="#F6AD55"/>
</svg>