<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Glow for Flashlight & Escaping Action -->
  <path d="M120 120 L20 40 L60 20 Z" fill="#F1C40F" opacity="0.05"/>
  <path d="M120 120 L210 60 L230 100 Z" fill="#E67E22" opacity="0.08"/>

  <!-- Flashlight Source (Top Left Context) -->
  <g transform="rotate(-30 50 60)">
    <rect x="35" y="55" width="25" height="12" rx="4" fill="#7F8C8D"/>
    <path d="M60 52 L70 48 L70 72 L60 68 Z" fill="#BDC3C7"/>
    <ellipse cx="70" cy="60" rx="3" ry="12" fill="#F1C40F" opacity="0.8"/>
  </g>

  <!-- Dynamic Motion / Escape Streaks (Lủi trốn, chạy tháo thân) -->
  <path d="M140 100 C160 80, 180 70, 205 65" stroke="#E74C3C" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" fill="none" opacity="0.7"/>
  <path d="M110 135 C130 150, 160 170, 190 175" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 6" fill="none" opacity="0.6"/>
  <path d="M125 115 C100 130, 75 145, 45 160" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5" fill="none" opacity="0.5"/>

  <!-- Grain / Food Particles Scattering (Chuồn, hốt hoảng) -->
  <circle cx="100" cy="110" r="2.5" fill="#F39C12"/>
  <circle cx="115" cy="130" r="2" fill="#F39C12"/>
  <circle cx="90" cy="140" r="3" fill="#E67E22"/>
  <circle cx="130" cy="95" r="2" fill="#F39C12"/>

  <!-- Main Subject: Wild Mouse scurrying/fleeing (野鼠乱窜) -->
  <g transform="translate(115, 95)">
    <!-- Shadow beneath mouse -->
    <ellipse cx="0" cy="32" rx="22" ry="7" fill="#111317" opacity="0.6"/>

    <!-- Tail in dynamic whip motion -->
    <path d="M -12 18 C -25 25, -35 15, -45 28" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Hind Legs (Action pose) -->
    <path d="M -5 18 L -12 32 L -6 34" stroke="#7F8C8D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 5 20 L 12 35 L 18 33" stroke="#95A5A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Main Body (Sleek flat vector rodent) -->
    <ellipse cx="2" cy="12" rx="20" ry="14" fill="#BDC3C7" transform="rotate(-15 2 12)"/>
    
    <!-- Head -->
    <path d="M 12 5 C 22 2, 28 -2, 33 -6 C 30 2, 24 8, 16 10 Z" fill="#BDC3C7"/>

    <!-- Ear -->
    <circle cx="15" cy="-2" r="6" fill="#95A5A6"/>
    <circle cx="15" cy="-2" r="3.5" fill="#E88B8B"/>

    <!-- Eye (Widened in panic) -->
    <circle cx="23" cy="-1" r="2.5" fill="#1A1D24"/>
    <circle cx="24" cy="-2" r="1" fill="#FFFFFF"/>

    <!-- Nose / Whiskers -->
    <circle cx="33" cy="-5" r="1.5" fill="#E88B8B"/>
    <line x1="33" y1="-4" x2="40" y2="-7" stroke="#7F8C8D" stroke-width="1" stroke-linecap="round"/>
    <line x1="33" y1="-3" x2="41" y2="-2" stroke="#7F8C8D" stroke-width="1" stroke-linecap="round"/>

    <!-- Front Legs (Scrambling forward) -->
    <path d="M 15 15 L 22 26 L 28 24" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>