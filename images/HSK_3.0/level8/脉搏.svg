<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed/Environment -->
  <rect x="20" y="150" width="200" height="60" rx="10" fill="#334155"/>
  <path d="M40 150 L200 150 L190 130 L50 130 Z" fill="#475569"/>
  
  <!-- Patient -->
  <circle cx="80" cy="110" r="20" fill="#fde68a"/>
  <path d="M65 105 Q70 100 75 105 M85 105 Q90 100 95 105" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M70 115 Q80 120 90 115" stroke="#fb923c" stroke-width="2" fill="none"/>
  <rect x="60" y="130" width="40" height="20" fill="#cbd5e1"/>
  
  <!-- Doctor -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <rect x="5" y="40" width="30" height="80" rx="5" fill="#38bdf8"/>
    <path d="M10 40 L0 80 M30 40 L40 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 15 L25 15" stroke="#475569" stroke-width="2"/>
    <circle cx="12" cy="12" r="2" fill="#475569"/>
    <circle cx="28" cy="12" r="2" fill="#475569"/>
  </g>
  
  <!-- Interaction: Checking Pulse -->
  <path d="M100 135 L145 105" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="145" cy="105" r="8" fill="#fb923c"/>
  
  <!-- Medical Prop: Stethoscope -->
  <path d="M160 90 Q180 80 190 100" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="190" cy="105" r="6" fill="#ec4899"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="30" cy="50" r="2" fill="#fbbf24"/>
  <path d="M210 180 L220 170 M220 180 L210 170" stroke="#10b981" stroke-width="2"/>
</svg>