<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Details -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>
  
  <!-- Visualizing "百般" (trăm phương nghìn kế, đủ mọi cách / a multiplicity of methods, various tools/tactics) -->
  <!-- Central Physical Object: A sleek, modern multi-tool / Swiss Army style apparatus representing diverse ways and methods -->
  
  <!-- Multi-tool central body / handle -->
  <g transform="translate(120, 120) rotate(-35)">
    <!-- Main handle casing (slate/dark metallic) -->
    <rect x="-16" y="-55" width="32" height="110" rx="16" fill="#3A4252" stroke="#4E5668" stroke-width="2"/>
    <rect x="-12" y="-50" width="24" height="100" rx="12" fill="#2D333F"/>
    
    <!-- Pivot bolt -->
    <circle cx="0" cy="-35" r="4" fill="#E5C158"/>
    <circle cx="0" cy="35" r="4" fill="#E5C158"/>

    <!-- Extending Tool 1: Key / Method (Top Right) -->
    <g transform="translate(12, -45) rotate(45)">
      <rect x="0" y="-3" width="32" height="6" rx="2" fill="#E5C158"/>
      <circle cx="34" cy="0" r="6" fill="none" stroke="#E5C158" stroke-width="3"/>
      <rect x="22" y="-5" width="3" height="4" fill="#E5C158"/>
    </g>

    <!-- Extending Tool 2: Pen / Argument / Writing (Top Left) -->
    <g transform="translate(-12, -40) rotate(-40)">
      <path d="M-22,-18 L-4,-4 L-4,4 L-22,10 Z" fill="#4DA6FF"/>
      <polygon points="-26,-20 -22,-18 -24,-22" fill="#E6EDF5"/>
    </g>

    <!-- Extending Tool 3: Gear / Strategy (Middle Right) -->
    <g transform="translate(16, 0) rotate(15)">
      <rect x="0" y="-3" width="26" height="6" rx="2" fill="#FF7B54"/>
      <circle cx="24" cy="0" r="8" fill="#FF7B54"/>
      <circle cx="24" cy="0" r="3" fill="#2D333F"/>
    </g>

    <!-- Extending Tool 4: Compass / Calculation (Bottom Left) -->
    <g transform="translate(-16, 10) rotate(-30)">
      <path d="M-30,0 L-4,-4 L-4,4 Z" fill="#52CC7A"/>
      <circle cx="-32" cy="0" r="5" fill="none" stroke="#52CC7A" stroke-width="2"/>
    </g>

    <!-- Extending Tool 5: Shield / Defense (Bottom Right) -->
    <g transform="translate(12, 45) rotate(25)">
      <path d="M0,-12 L14,-6 L14,6 L0,14 L-14,6 L-14,-6 Z" fill="#9B5DE5"/>
    </g>
  </g>

  <!-- Floating accent elements indicating variety and multiplicity (methods/tactics) -->
  <!-- Small glowing nodes forming a constellation of choices -->
  <circle cx="55" cy="70" r="4" fill="#E5C158" opacity="0.8"/>
  <circle cx="185" cy="85" r="3" fill="#FF7B54" opacity="0.9"/>
  <circle cx="65" cy="170" r="5" fill="#4DA6FF" opacity="0.7"/>
  <circle cx="175" cy="160" r="3" fill="#52CC7A" opacity="0.8"/>
  <circle cx="120" cy="45" r="3.5" fill="#9B5DE5" opacity="0.85"/>

  <!-- Subtle connecting dashed arcs to represent multiple pathways/tactics -->
  <path d="M 55 70 Q 85 50 120 45" fill="none" stroke="#E5C158" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M 185 85 Q 180 120 175 160" fill="none" stroke="#FF7B54" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M 65 170 Q 90 180 120 180" fill="none" stroke="#4DA6FF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
</svg>