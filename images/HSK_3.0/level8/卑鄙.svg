<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="30" y="140" width="180" height="10" rx="2" fill="#475569"/>
  <rect x="40" y="150" width="10" height="60" rx="2" fill="#334155"/>
  <rect x="190" y="150" width="10" height="60" rx="2" fill="#334155"/>
  
  <!-- The "Sneaky" Character (The one using the '卑鄙' tactic) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fb923c"/>
    <path d="M10 25 Q20 35 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="10" y="15" width="5" height="5" fill="#0f172a"/>
    <rect x="25" y="15" width="5" height="5" fill="#0f172a"/>
    <!-- Hand reaching to swap files -->
    <path d="M35 40 L50 60" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="65" r="8" fill="#fb923c"/>
  </g>
  
  <!-- The Victim Character (Looking away) -->
  <g transform="translate(40, 90)">
    <circle cx="20" cy="20" r="20" fill="#38bdf8"/>
    <path d="M10 25 Q20 20 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="12" y="15" width="4" height="4" fill="#0f172a"/>
    <rect x="24" y="15" width="4" height="4" fill="#0f172a"/>
  </g>
  
  <!-- The "Sneaky" Action: Swapping a document -->
  <rect x="110" y="110" width="40" height="30" rx="2" fill="#f8fafc"/>
  <path d="M115 115 H145 M115 122 H135 M115 129 H140" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Document being discarded/hidden -->
  <rect x="60" y="120" width="30" height="20" rx="2" fill="#94a3b8" opacity="0.6"/>
  
  <!-- Ambient Light/Glow -->
  <circle cx="160" cy="100" r="40" fill="#f59e0b" opacity="0.05"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="220" cy="60" r="2" fill="#fbbf24"/>
  <circle cx="20" cy="180" r="4" fill="#10b981"/>
</svg>