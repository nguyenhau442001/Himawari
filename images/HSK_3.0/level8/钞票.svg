<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Character Torso/Hand -->
    <path d="M60 120 C60 80 100 60 140 60 L150 140 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M140 80 L170 100 L160 120 Z" fill="#fb923c"/>
    
    <!-- Wallet -->
    <rect x="80" y="90" width="80" height="50" rx="8" fill="#78350f"/>
    <rect x="85" y="95" width="70" height="40" rx="4" fill="#451a03"/>
    
    <!-- Banknotes (钞票) -->
    <rect x="90" y="70" width="60" height="30" rx="2" fill="#fbbf24"/>
    <rect x="95" y="65" width="60" height="30" rx="2" fill="#f59e0b"/>
    <rect x="100" y="60" width="60" height="30" rx="2" fill="#fbbf24"/>
    
    <!-- Detail lines on money -->
    <line x1="100" y1="75" x2="140" y2="75" stroke="#92400e" stroke-width="2"/>
    <line x1="105" y1="70" x2="145" y2="70" stroke="#92400e" stroke-width="2"/>
    <line x1="110" y1="65" x2="150" y2="65" stroke="#92400e" stroke-width="2"/>
  </g>
  
  <!-- Ambient lighting/decor -->
  <circle cx="200" cy="40" r="30" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <path d="M190 30 L210 50 M210 30 L190 50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <g opacity="0.3">
    <circle cx="30" cy="180" r="10" fill="#10b981"/>
    <circle cx="210" cy="200" r="15" fill="#ec4899"/>
  </g>
</svg>