<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow behind the central figure -->
  <circle cx="120" cy="120" r="70" fill="#2D333B" opacity="0.5"/>

  <!-- Character / Bust representing "Bànxìn-bànyí" (Doubtful / Half-believing) -->
  <g transform="translate(0, 15)">
    <!-- Shoulders / Body -->
    <path d="M 70 185 Q 120 150 170 185 L 180 215 C 180 220 175 225 170 225 L 70 225 C 65 225 60 220 60 215 Z" fill="#2E384D"/>
    <!-- Collar -->
    <path d="M 95 168 L 120 185 L 145 168 L 135 155 L 120 165 L 105 155 Z" fill="#3E4C66"/>

    <!-- Neck -->
    <rect x="106" y="135" width="28" height="30" rx="6" fill="#F4D0B2"/>

    <!-- Head -->
    <path d="M 90 85 C 90 60 150 60 150 85 L 150 130 C 150 145 90 145 90 130 Z" fill="#F4D0B2"/>

    <!-- Hair (Modern sleek flat style) -->
    <path d="M 88 90 C 85 55 155 55 152 90 C 152 70 88 70 88 90 Z" fill="#242B38"/>
    <path d="M 86 85 C 86 85 100 45 140 55 C 145 56 150 62 152 72 C 145 62 125 58 100 68 C 92 71 88 78 86 85 Z" fill="#343D4E"/>

    <!-- Eyebrows (Asymmetric for "Half believing, half doubting") -->
    <!-- Left eyebrow: Raised high in skepticism -->
    <path d="M 96 76 Q 106 68 116 75" fill="none" stroke="#242B38" stroke-width="3" stroke-linecap="round"/>
    <!-- Right eyebrow: Relaxed / normal believing -->
    <path d="M 124 76 Q 134 78 144 74" fill="none" stroke="#242B38" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes -->
    <!-- Left eye: Narrowed, skeptical -->
    <circle cx="106" cy="88" r="4" fill="#242B38"/>
    <path d="M 98 87 Q 106 82 114 87" fill="none" stroke="#242B38" stroke-width="2" stroke-linecap="round"/>

    <!-- Right eye: Open, slightly curious/interested -->
    <circle cx="134" cy="88" r="4" fill="#242B38"/>

    <!-- Nose -->
    <path d="M 120 94 L 117 106 L 122 107" fill="none" stroke="#E0B596" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mouth: Half-smile / smirking side-curve (hesitant expression) -->
    <path d="M 108 118 Q 120 125 132 116" fill="none" stroke="#242B38" stroke-width="3" stroke-linecap="round"/>

    <!-- Hand supporting chin (Classic contemplative / skeptical gesture) -->
    <g transform="translate(0, 5)">
      <!-- Forearm and hand -->
      <path d="M 125 145 L 140 120 C 142 116 148 114 153 118 L 157 122 C 160 125 159 131 155 134 L 138 152 Z" fill="#F4D0B2"/>
      <!-- Fingers curled under chin -->
      <circle cx="137" cy="122" r="5" fill="#E0B596"/>
      <circle cx="145" cy="120" r="4.5" fill="#E0B596"/>
      <circle cx="152" cy="123" r="4" fill="#E0B596"/>
      <!-- Sleeve cuff -->
      <path d="M 125 145 L 142 160 L 132 170 L 115 155 Z" fill="#3E4C66"/>
    </g>
  </g>

  <!-- Semantic Visual Clues: Dual floating thought bubbles (Contrasting Belief vs Doubt) -->
  <!-- Left Side: Doubt (Question mark with subtle orange accent) -->
  <g transform="translate(25, 65)">
    <circle cx="20" cy="20" r="22" fill="#242B38" stroke="#3E4C66" stroke-width="2"/>
    <circle cx="8" cy="10" r="4" fill="#242B38"/>
    <circle cx="2" cy="3" r="2.5" fill="#242B38"/>
    <!-- Question Mark -->
    <path d="M 14 14 C 14 10 26 10 24 17 C 22 22 18 21 18 25" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="18" cy="31" r="2" fill="#F59E0B"/>
  </g>

  <!-- Right Side: Belief (Checkmark representing the other half) -->
  <g transform="translate(175, 65)">
    <circle cx="20" cy="20" r="22" fill="#242B38" stroke="#3E4C66" stroke-width="2"/>
    <circle cx="32" cy="10" r="4" fill="#242B38"/>
    <circle cx="38" cy="3" r="2.5" fill="#242B38"/>
    <!-- Checkmark -->
    <path d="M 10 20 L 17 26 L 30 13" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>