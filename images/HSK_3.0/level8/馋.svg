<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Study Desk Environment -->
    <path d="M40 160 L200 160 L210 190 L30 190 Z" fill="#2D333B"/>
    <rect x="70" y="140" width="100" height="20" rx="4" fill="#3A424E"/>
    
    <!-- Open Book -->
    <path d="M80 148 Q120 138 160 148 L160 175 Q120 165 80 175 Z" fill="#E6EDF3"/>
    <path d="M120 142 L120 171" stroke="#8B949E" stroke-width="2"/>
    <line x1="90" y1="152" x2="110" y2="152" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="160" x2="105" y2="160" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="152" x2="150" y2="152" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="160" x2="145" y2="160" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>

    <!-- Pencil Holder / Pencil -->
    <rect x="175" y="125" width="12" height="30" rx="2" fill="#57606A"/>
    <path d="M176 125 L181 115 L186 125 Z" fill="#F0883E"/>

    <!-- Character: Younger Brother leaning forward, hypnotized by smell -->
    <!-- Body / Hoodie -->
    <path d="M85 190 C85 170 100 155 120 155 C140 155 155 170 155 190 Z" fill="#238636"/>
    <path d="M100 158 Q120 170 140 158" fill="none" stroke="#2EA043" stroke-width="3"/>
    
    <!-- Head & Hair -->
    <circle cx="120" cy="120" r="26" fill="#FFD8BE"/>
    <path d="M95 120 C95 100 105 92 120 92 C135 92 145 100 145 120 C145 112 140 100 120 100 C100 100 95 112 95 120 Z" fill="#22272E"/>

    <!-- Face showing intense craving / mouth watering -->
    <!-- Eyes closed in bliss/yearning (arcs) -->
    <path d="M108 116 Q113 110 118 116" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M122 116 Q127 110 132 116" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="110" cy="123" r="5" fill="#FF9999" opacity="0.6"/>
    <circle cx="130" cy="123" r="5" fill="#FF9999" opacity="0.6"/>

    <!-- Open mouth with tongue out and drool -->
    <path d="M114 128 Q120 138 126 128 Z" fill="#A40E26"/>
    <path d="M117 132 Q120 140 123 132 Z" fill="#FF6B6B"/>
    <!-- Drool drop -->
    <path d="M120 137 C120 137 122 148 120 154 C119 157 117 157 117 154 C117 148 120 137 120 137 Z" fill="#58A6FF" opacity="0.9"/>
    <circle cx="120" cy="153" r="1.5" fill="#C9D1D9" opacity="0.8"/>

    <!-- Thought Bubble / Aroma Trail leading to Roasted Duck Concept -->
    <g opacity="0.85">
      <!-- Swirling aroma lines -->
      <path d="M135 105 Q150 90 140 70 Q130 50 150 35" fill="none" stroke="#F0883E" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
      <path d="M142 98 Q157 83 147 63 Q137 43 157 28" fill="none" stroke="#E3B341" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>

      <!-- Roasted Duck Icon floating in thought/aroma -->
      <g transform="translate(145, 15) scale(0.65)">
        <!-- Plate -->
        <ellipse cx="25" cy="50" rx="30" ry="10" fill="#8B949E"/>
        <ellipse cx="25" cy="48" rx="26" ry="8" fill="#E6EDF3"/>
        
        <!-- Golden Roasted Duck Body -->
        <ellipse cx="25" cy="42" rx="18" ry="12" fill="#D18616"/>
        <path d="M12 45 Q25 55 38 45 Q35 32 25 35 Q15 32 12 45 Z" fill="#F0883E"/>
        <!-- Crispy Duck Head & Neck -->
        <path d="M35 38 Q42 35 40 28 Q38 25 34 30" fill="none" stroke="#D18616" stroke-width="6" stroke-linecap="round"/>
        <circle cx="41" cy="27" r="2.5" fill="#D18616"/>
        <circle cx="42" cy="26" r="1" fill="#1A1D24"/>
      </g>
    </g>

    <!-- Hand resting on chin/cheek -->
    <path d="M105 135 C100 130 95 140 102 145 C106 148 112 145 110 140 Z" fill="#FFD8BE"/>
  </g>
</svg>