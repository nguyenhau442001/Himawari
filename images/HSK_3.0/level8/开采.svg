<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Oil Derrick Structure -->
  <path d="M160 60 L190 60 L180 180 L170 180 Z" fill="#475569"/>
  <path d="M165 80 L185 80 M168 100 L182 100 M170 120 L180 120" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="175" cy="60" r="8" fill="#fb923c"/>
  
  <!-- Drilling Pipe/Mechanism -->
  <rect x="172" y="130" width="6" height="60" fill="#fbbf24"/>
  <path d="M160 180 L190 180 L195 190 L155 190 Z" fill="#64748b"/>
  
  <!-- Oil Splashing/Extraction Effect -->
  <circle cx="175" cy="185" r="4" fill="#10b981"/>
  <path d="M175 185 C 170 170, 165 160, 175 150 C 185 160, 180 170, 175 185" fill="#10b981" opacity="0.6"/>
  
  <!-- Worker Character -->
  <g transform="translate(80, 130)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <rect x="15" y="32" width="10" height="25" fill="#38bdf8"/>
    <rect x="10" y="35" width="5" height="15" fill="#38bdf8" transform="rotate(20 15 35)"/>
    <rect x="25" y="35" width="5" height="15" fill="#38bdf8" transform="rotate(-20 30 35)"/>
    <rect x="17" y="57" width="3" height="15" fill="#475569"/>
    <rect x="20" y="57" width="3" height="15" fill="#475569"/>
    <path d="M12 20 L28 20" stroke="#fde68a" stroke-width="2"/>
  </g>
  
  <!-- Control Panel/Monitor -->
  <rect x="30" y="140" width="40" height="30" rx="4" fill="#334155" stroke="#fb923c" stroke-width="2"/>
  <rect x="35" y="145" width="30" height="20" fill="#0f172a"/>
  <rect x="38" y="148" width="8" height="14" fill="#10b981"/>
  <rect x="50" y="148" width="8" height="14" fill="#ec4899"/>
  
  <!-- Background Elements -->
