<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/pedestal for the jewelry -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>
  <ellipse cx="120" cy="155" rx="45" ry="12" fill="#121418" opacity="0.5"/>

  <!-- Jewelry Illustration (Necklace & Diamond Pendant representing "首饰") -->
  <g transform="translate(0, -5)">
    <!-- Necklace Chain (Gold/Orange gradient feel) -->
    <path d="M 75 80 Q 120 145 165 80" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Chain highlight dots -->
    <circle cx="85" cy="92" r="1.5" fill="#FFE17D"/>
    <circle cx="100" cy="112" r="1.5" fill="#FFE17D"/>
    <circle cx="120" cy="122" r="1.5" fill="#FFE17D"/>
    <circle cx="140" cy="112" r="1.5" fill="#FFE17D"/>
    <circle cx="155" cy="92" r="1.5" fill="#FFE17D"/>

    <!-- Pendant Bail (Connector) -->
    <path d="M 117 122 L 123 122 L 121 129 L 119 129 Z" fill="#F5A623"/>

    <!-- Diamond Gemstone Pendant -->
    <!-- Outer facets -->
    <polygon points="120,133 138,143 120,183 102,143" fill="#4A90E2"/>
    <!-- Top flat facet -->
    <polygon points="120,133 131,139 109,139" fill="#75B5FF"/>
    <!-- Left triangle facet -->
    <polygon points="120,183 102,143 109,139" fill="#357ABD"/>
    <!-- Right triangle facet -->
    <polygon points="120,183 138,143 131,139" fill="#5CA3F5"/>
    <!-- Center reflection / sparkle -->
    <polygon points="120,183 115,143 125,143" fill="#A4D0FF" opacity="0.4"/>
  </g>

  <!-- Sparkle / Accent Effects -->
  <!-- Top Right Sparkle -->
  <path d="M 175 65 Q 175 75 185 75 Q 175 75 175 85 Q 175 75 165 75 Q 175 75 175 65 Z" fill="#FFE17D"/>
  <circle cx="175" cy="75" r="1" fill="#FFFFFF"/>

  <!-- Top Left Small Sparkle -->
  <path d="M 65 95 Q 65 100 70 100 Q 65 100 65 105 Q 65 100 60 100 Q 65 100 65 95 Z" fill="#FFE17D" opacity="0.8"/>

  <!-- Lower Left Sparkle -->
  <path d="M 85 155 Q 85 162 92 162 Q 85 162 85 169 Q 85 162 78 162 Q 85 162 85 155 Z" fill="#FFE17D"/>
  <circle cx="85" cy="162" r="0.8" fill="#FFFFFF"/>
</svg>