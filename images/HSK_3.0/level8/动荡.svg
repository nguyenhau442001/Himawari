<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Unstable Atmosphere -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass/Window Gradients -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Glow (Social Turmoil / Sunset / Siren Light mood) -->
  <circle cx="120" cy="100" r="110" fill="url(#amberGlow)" />

  <!-- BACKGROUND ENVIRONMENT: Historical / Urban Room Interior -->
  <!-- Wall texture / Back structure -->
  <rect x="20" y="20" width="200" height="150" fill="#0f172a" rx="4" />
  
  <!-- Architectural molding / wainscoting line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="#1e293b" stroke-width="3" />

  <!-- Broken / Uneven Floor Line -->
  <path d="M 20 170 L 80 168 L 120 172 L 180 169 L 220 170 L 220 220 L 20 220 Z" fill="#090d16" />
  <path d="M 60 170 L 95 195 L 140 171" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Large Arched Window showing unrest outside (shaky lines, city silhouettes) -->
  <path d="M 140 45 L 190 45 L 190 135 L 140 135 Z" fill="url(#glassGrad)" />
  <!-- Window frame bars -->
  <line x1="165" y1="45" x2="165" y2="135" stroke="#0f172a" stroke-width="3" />
  <line x1="140" y1="90" x2="190" y2="90" stroke="#0f172a" stroke-width="3" />
  <!-- Window Outer Arch / Frame -->
  <rect x="137" y="42" width="56" height="96" rx="2" fill="none" stroke="#475569" stroke-width="3" />

  <!-- Light beam cutting through the dusty room -->
  <polygon points="140,50 190,50 110,170 30,170" fill="url(#lightBeam)" />

  <!-- City Skyline Silhouette Outside Window (Turbulence context) -->
  <path d="M 145 125 L 150 110 L 153 110 L 157 125 L 162 100 L 167 125 L 175 95 L 180 115 L 185 125 Z" fill="#1e293b" />
  <!-- Distant smoke/dust plume -->
  <path d="M 170 95 Q 175 80 165 70 Q 180 65 175 55" stroke="#64748b" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round" />

  <!-- INTERIOR PROPS (Showing instability: tilted shelf, falling items, papers flying) -->
  <!-- Tilted Wall Shelf -->
  <path d="M 30 75 L 85 67" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <path d="M 50 72 L 55 50" fill="none" stroke="#94a3b8" stroke-width="3" /> <!-- Tilted bracket -->

  <!-- Objects falling / sliding off the shelf -->
  <rect x="35" y="60" width="12" height="15" rx="1" fill="#ef4444" transform="rotate(-15 35 60)" />
  <rect x="52" y="55" width="10" height="18" rx="1" fill="#3b82f6" transform="rotate(25 52 55)" />
  <!-- Loose papers floating in the air (wind/chaos) -->
  <path d="M 75 95 Q 85 90 90 100 T 105 105" stroke="#f1f5f9" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 95 65 Q 105 75 100 85" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Heavy Old Wooden Desk (Tilted slightly to emphasize instability) -->
  <g transform="rotate(-3 100 145)">
    <!-- Desk Top -->
    <path d="M 60 135 L 155 135 L 160 142 L 55 142 Z" fill="#78350f" />
    <rect x="55" y="142" width="105" height="6" fill="#451a03" rx="1" />
    <!-- Desk Legs -->
    <line x1="68" y1="148" x2="60" y2="185" stroke="#451a03" stroke-width="5" stroke-linecap="round" />
    <line x1="148" y1="148" x2="156" y2="185" stroke="#451a03" stroke-width="5" stroke-linecap="round" />

    <!-- Items on desk: An old lantern rocking, a tilted mug -->
    <!-- Lantern -->
    <path d="M 85 120 L 95 120 L 93 135 L 87 135 Z" fill="#94a3b8" />
    <circle cx="90" cy="127" r="5" fill="#fbbf24" />
    <path d="M 87 120 Q 90 114 93 120" fill="none" stroke="#64748b" stroke-width="2" />
    
    <!-- Tilted Mug -->
    <ellipse cx="130" cy="133" rx="6" ry="3" fill="#e2e8f0" />
    <path d="M 124 133 L 126 140 L 134 140 L 136 133" fill="#cbd5e1" />
    <!-- Spilling liquid -->
    <path d="M 133 135 Q 140 138 145 142" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>


  <!-- MAIN SUBJECT: Expressive characters experiencing societal turbulence -->
  <!-- Character 1 (Foreground Center-Left): Anxious citizen looking out/holding coat -->
  <g transform="translate(15, 0)">
    <!-- Shadow beneath character -->
    <ellipse cx="80" cy="188" rx="25" ry="6" fill="#020617" opacity="0.6" />

    <!-- Body / Heavy Trench Coat -->
    <path d="M 62 140 Q 60 170 55 190 L 105 190 Q 98 170 98 140 Z" fill="url(#coatGrad)" />
    <!-- Coat Lapels -->
    <path d="M 75 140 L 68 165 L 80 185" fill="#1e293b" />
    <path d="M 85 140 L 92 165 L 80 185" fill="#1e293b" />

    <!-- Scarf with dynamic flow (indicating tension/movement) -->
    <path d="M 72 133 Q 80 145 95 138 L 108 150 L 102 155 L 90 145 Q 80 150 70 138 Z" fill="url(#accentOrange)" />

    <!-- Neck -->
    <rect x="75" y="125" width="10" height="12" fill="#fcd34d" />

    <!-- Head (Expressing worry/tension: furrowed brows, wide eyes) -->
    <circle cx="80" cy="112" r="16" fill="#fde68a" />
    
    <!-- Hair -->
    <path d="M 64 110 Q 65 96 80 96 Q 95 96 96 110 Q 92 102 80 102 Q 68 102 64 110 Z" fill="#1e293b" />

    <!-- Facial Expressions (Worry / Alertness) -->
    <!-- Eyebrows (tilted inward) -->
    <line x1="72" y1="108" x2="77" y2="111" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
    <line x1="88" y1="108" x2="83" y2="111" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (focused, alert) -->
    <circle cx="74" cy="114" r="2" fill="#1e293b" />
    <circle cx="86" cy="114" r="2" fill="#1e293b" />
    <!-- Mouth (slight tight grimace) -->
    <path d="M 77 121 Q 80 119 83 121" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Arms in protective/reactive posture -->
    <!-- Left Arm holding coat collar -->
    <path d="M 65 142 Q 72 145 78 138" stroke="#334155" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Right Arm raised slightly for balance/tension -->
    <path d="M 95 142 Q 105 145 102 158" stroke="#334155" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="103" cy="160" r="4" fill="#fcd34d" />
  </g>

  <!-- Character 2 (Supporting Background Silhouette / Companion looking out window anxiously) -->
  <g transform="translate(110, 30)">
    <!-- Body -->
    <path d="M 35 110 L 25 155 L 55 155 L 45 110 Z" fill="#334155" />
    <!-- Head -->
    <circle cx="40" cy="98" r="11" fill="#fde68a" />
    <!-- Hair -->
    <path d="M 30 98 Q 40 86 50 98 Z" fill="#0f172a" />
    <!-- Hand on window sill -->
    <rect x="22" y="108" width="8" height="6" rx="2" fill="#fcd34d" transform="rotate(-20 22 108)" />
  </g>

  <!-- FOREGROUND ATMOSPHERIC PARTICLES (Dust, debris floating in unstable air) -->
  <circle cx="50" cy="100" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="115" cy="80" r="2" fill="#fef08a" opacity="0.6" />
  <circle cx="130" cy="115" r="1" fill="#fbbf24" opacity="0.9" />
  <circle cx="70" cy="50" r="2" fill="#fef08a" opacity="0.7" />
  <circle cx="195" cy="150" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="100" cy="180" r="2.5" fill="#fef08a" opacity="0.4" />

  <!-- Dramatic Vignette / Border shading for deep cinematic focus -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.8" />
</svg>