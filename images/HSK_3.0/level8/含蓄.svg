<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" clip-path="url(#canvasClip)"/>
  
  <!-- Atmospheric lighting / Ambient elements -->
  <circle cx="180" cy="80" r="90" fill="url(#warmGlow)"/>
  
  <!-- Cafe / Indoor Environment Context -->
  <!-- Background Wall & Window -->
  <rect x="20" y="30" width="100" height="130" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="40" width="80" height="60" rx="2" fill="#1e293b" opacity="0.8"/>
  <circle cx="70" cy="65" r="15" fill="#f59e0b" opacity="0.2"/> <!-- Soft outdoor warm light -->
  <path d="M40 120 L100 120 L110 160 L30 160 Z" fill="#475569" opacity="0.2"/>

  <!-- House plants for warm lifestyle context -->
  <path d="M190 160 Q195 130 180 110 Q200 125 210 160 Z" fill="#10b981" opacity="0.8"/>
  <rect x="185" y="155" width="20" height="25" rx="3" fill="#cbd5e1"/>

  <!-- Table Furniture -->
  <path d="M15 185 L225 185 L215 165 L25 165 Z" fill="#334155"/>
  <rect x="40" y="185" width="12" height="40" fill="#1e293b"/>
  <rect x="188" y="185" width="12" height="40" fill="#1e293b"/>
  
  <!-- Table Props: Teacup and saucer -->
  <ellipse cx="145" cy="168" rx="10" ry="4" fill="#cbd5e1"/>
  <path d="M138 158 C138 155 152 155 152 158 L150 168 C150 170 140 170 138 168 Z" fill="#f8fafc"/>
  <path d="M152 161 C156 161 156 166 152 166" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Steam rising subtly -->
  <path d="M143 150 Q145 145 143 140" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Character 1: The Woman speaking "含蓄" (subtle, nuanced expression, hand near mouth) -->
  <g id="woman">
    <!-- Body / Torso -->
    <path d="M75 180 Q75 140 95 135 L125 135 Q145 140 145 180 Z" fill="#38bdf8"/>
    <!-- Collar / Details -->
    <path d="M95 135 L110 148 L125 135" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neck -->
    <rect x="102" y="122" width="16" height="18" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="110" cy="105" r="22" fill="#fbcfe8"/>
    
    <!-- Hair (Stylish bob cut) -->
    <path d="M88 105 C88 90 98 83 110 83 C122 83 132 90 132 105 L132 120 C125 125 115 122 110 122 C95 122 88 115 88 105 Z" fill="#0f172a"/>
    <path d="M88 105 C88 120 98 130 110 130 C118 130 125 125 130 120 L132 105 Z" fill="#0f172a"/>

    <!-- Facial Expression: Subtle, thoughtful eyes, closed/half-smile -->
    <!-- Eyes (calm, indirect gaze) -->
    <circle cx="102" cy="104" r="1.5" fill="#334155"/>
    <circle cx="116" cy="104" r="1.5" fill="#334155"/>
    <!-- Gentle, reserved smile (hánxù vibe) -->
    <path d="M106 113 Q110 115 114 113" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <circle cx="98" cy="110" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="120" cy="110" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Hand near mouth gesture (expressing nuance/thoughtfulness) -->
    <path d="M125 140 Q135 125 123 115 Q120 112 117 116" fill="#fbcfe8" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="121" cy="113" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: The Listener (Attentive, leaning in to catch the subtle hint) -->
  <g id="listener">
    <!-- Body / Torso -->
    <path d="M130 185 Q135 150 155 145 L180 145 Q195 150 200 185 Z" fill="#f43f5e"/>
    
    <!-- Neck -->
    <rect x="157" y="130" width="14" height="18" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="164" cy="115" r="20" fill="#fbcfe8"/>
    
    <!-- Hair (Short neat hair) -->
    <path d="M147 115 C147 100 155 94 164 94 C175 94 182 100 183 115 L181 120 C175 118 170 122 160 120 Z" fill="#334155"/>

    <!-- Facial Expression: Focused, leaning in, eyebrows slightly raised in realization/curiosity -->
    <circle cx="158" cy="113" r="1.5" fill="#334155"/>
    <circle cx="170" cy="113" r="1.5" fill="#334155"/>
    <!-- Eyebrows (Curious/Listening) -->
    <path d="M155 108 Q158 106 161 108" stroke="#334155" stroke-width="1.2" fill="none"/>
    <path d="M167 108 Q170 106 173 108" stroke="#334155" stroke-width="1.2" fill="none"/>
    <!-- Open attentive mouth -->
    <ellipse cx="164" cy="122" rx="2" ry="2.5" fill="#334155"/>

    <!-- Leaning arm resting on table -->
    <path d="M160 148 L195 168 L200 163 L175 140 Z" fill="#f43f5e"/>
    <circle cx="197" cy="165" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Abstract visual metaphor of "Nuance/Subtlety" (Gentle floating graphical flow lines, no text) -->
  <g opacity="0.7">
    <path d="M115 90 Q125 75 140 78 Q155 81 160 65" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M125 83 Q135 70 145 74" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Glowing accent dots -->
    <circle cx="140" cy="78" r="3" fill="#fbbf24"/>
    <circle cx="160" cy="65" r="2" fill="#38bdf8"/>
  </g>

  <!-- Foreground Lighting/Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" clip-path="url(#canvasClip)" opacity="0.5"/>
</svg>