<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Illustration for "愁眉苦脸" (gloomy, furrowed brows, distressed face) -->
  <g transform="translate(120, 120)">
    <!-- Shoulders / Torso -->
    <path d="M-64,78 C-64,56 -36,46 0,46 C36,46 64,56 64,78 L72,96 L-72,96 Z" fill="#2D3748"/>
    <path d="M-42,48 C-20,44 20,44 42,48 L48,96 L-48,96 Z" fill="#1A202C"/>

    <!-- Neck -->
    <rect x="-14" y="28" width="28" height="28" rx="6" fill="#E2E8F0"/>

    <!-- Head / Face -->
    <circle cx="0" cy="-12" r="44" fill="#E2E8F0"/>

    <!-- Hair / Hat or Head Styling (Dark Slate to contrast dark mode) -->
    <path d="M-44,-12 C-44,-32 -26,-52 0,-52 C26,-52 44,-32 44,-12 C44,-6 42,10 42,10 C42,10 32,2 0,2 C-32,2 -42,10 -42,10 C-42,10 -44,-6 -44,-12 Z" fill="#4A5568"/>

    <!-- Furrowed Brows (愁眉) - High contrast gold/orange accent -->
    <path d="M-22,-24 L-8,-18" stroke="#D69E2E" stroke-width="4" stroke-linecap="round"/>
    <path d="M22,-24 L8,-18" stroke="#D69E2E" stroke-width="4" stroke-linecap="round"/>

    <!-- Eyes (Downcast / Worried) -->
    <circle cx="-15" cy="-10" r="3.5" fill="#1A202C"/>
    <circle cx="15" cy="-10" r="3.5" fill="#1A202C"/>

    <!-- Sweat Drop (Signifying distress/worry) -->
    <path d="M28,-22 C28,-22 34,-14 34,-10 C34,-6.5 31.3,-4 28,-4 C24.7,-4 22,-6.5 22,-10 C22,-14 28,-22 28,-22 Z" fill="#63B3ED" opacity="0.85"/>

    <!-- Bitter / Downturned Mouth (苦脸) -->
    <path d="M-14,14 C-7,6 7,6 14,14" fill="none" stroke="#1A202C" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Chin lines for anguish -->
    <path d="M-6,22 C0,24 6,24 6,22" fill="none" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>