<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background architectural grid lines representing city blocks -->
  <path d="M40 180 L200 180" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M40 140 L200 140" stroke="#2A2F3B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M90 70 L90 200" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M150 70 L150 200" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Surrounding secondary buildings (dark, flat) -->
  <rect x="50" y="110" width="35" height="70" rx="4" fill="#222733"/>
  <rect x="160" y="95" width="40" height="85" rx="4" fill="#222733"/>
  <rect x="95" y="100" width="50" height="40" rx="4" fill="#222733"/>

  <!-- Central Premium Location Plot ("黄金地段") highlighted -->
  <rect x="90" y="135" width="60" height="65" rx="6" fill="#1E2430" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- Modern Flagship Commercial Building on the prime plot -->
  <!-- Building base / storefront -->
  <path d="M98 190 L98 150 C98 147 100 145 103 145 L137 145 C140 145 142 147 142 150 L142 190 Z" fill="#2C3546"/>
  <!-- Glass storefront panels -->
  <rect x="104" y="153" width="14" height="37" fill="#3B475D" rx="2"/>
  <rect x="122" y="153" width="14" height="37" fill="#3B475D" rx="2"/>

  <!-- Building upper tower / sleek modern architecture -->
  <path d="M102 145 L102 95 C102 93 104 91 106 91 L134 91 C136 91 138 93 138 95 L138 145 Z" fill="#333E54"/>
  <!-- Windows grid on tower -->
  <line x1="120" y1="95" x2="120" y2="140" stroke="#222A38" stroke-width="2"/>
  <line x1="108" y1="105" x2="132" y2="105" stroke="#485773" stroke-width="1.5"/>
  <line x1="108" y1="120" x2="132" y2="120" stroke="#485773" stroke-width="1.5"/>
  <line x1="108" y1="135" x2="132" y2="135" stroke="#485773" stroke-width="1.5"/>

  <!-- Golden "Prime Location" Marker / Pin hovering above the property -->
  <path d="M120 42 C110.5 42 103 49.5 103 59 C103 71.5 120 88 120 88 C120 88 137 71.5 137 59 C137 49.5 129.5 42 120 42 Z" fill="#F59E0B"/>
  <circle cx="120" cy="58" r="5.5" fill="#1A1D24"/>

  <!-- Dynamic highlight glow/sparkles for premium status -->
  <path d="M158 55 L161 60 L166 63 L161 66 L158 71 L155 66 L150 63 L155 60 Z" fill="#F59E0B"/>
  <path d="M78 85 L79.5 88 L83 89.5 L79.5 91 L78 94 L76.5 91 L73 89.5 L76.5 88 Z" fill="#F59E0B" opacity="0.7"/>

  <!-- Ground indicator corner brackets to emphasize the exact physical zone/plot -->
  <path d="M85 130 L85 138 L93 138" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M155 130 L155 138 L147 138" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M85 200 L85 192 L93 192" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M155 200 L155 192 L147 192" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>