<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="30" y="140" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="155" width="10" height="60" fill="#475569"/>
  <rect x="190" y="155" width="10" height="60" fill="#475569"/>
  
  <!-- The Aggressor (Standing) -->
  <g transform="translate(140, 60)">
    <circle cx="25" cy="25" r="20" fill="#fb923c"/>
    <path d="M15 35 Q25 45 35 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="10" y="50" width="30" height="60" rx="5" fill="#f59e0b"/>
    <path d="M5 60 L-10 90" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <path d="M45 60 L60 80" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 50 L25 10" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- The Victim (Sitting) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#94a3b8"/>
    <rect x="5" y="40" width="30" height="50" rx="5" fill="#64748b"/>
    <path d="M0 50 L-10 70" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 50 L50 70" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Documents/Props -->
  <rect x="60" y="130" width="40" height="10" rx="2" fill="#e2e8f0"/>
  <rect x="65" y="120" width="30" height="5" rx="1" fill="#e2e8f0"/>
  
  <!-- Action Lines -->
  <path d="M130 80 L110 90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 70 L110 75" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ambient light -->
  <circle cx="165" cy="85" r="40" fill="#fbbf24" opacity="0.05"/>
</svg>