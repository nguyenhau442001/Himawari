<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Doorway frame -->
  <path d="M80 60h80v120H80z" fill="#2C313C" stroke="#4A5568" stroke-width="4"/>
  
  <!-- Partially open door -->
  <path d="M80 60l40 20v100l-40-20z" fill="#3B82F6"/>
  
  <!-- Floor -->
  <path d="M0 180h240v60H0z" fill="#252932"/>
  
  <!-- The Cat (The subject taking the opportunity) -->
  <g transform="translate(130, 150)">
    <path d="M10 30c-5 0-10-5-10-10v-10c0-5 5-10 10-10h10c5 0 10 5 10 10v10c0 5-5 10-10 10z" fill="#F59E0B"/>
    <path d="M5 10l-5-10M25 10l5-10" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 30l10 10" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="10" cy="15" r="2" fill="#1A1D24"/>
    <circle cx="20" cy="15" r="2" fill="#1A1D24"/>
  </g>
  
  <!-- Motion lines indicating the "seizing the moment" movement -->
  <path d="M110 160l-30-10" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M105 175l-40-15" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" opacity="0.4"/>
</svg>