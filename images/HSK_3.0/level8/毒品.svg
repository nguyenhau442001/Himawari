<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="spotlight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" fill="url(#spotlight)" />

  <!-- Architecture / Alleyway Context (City Wall & Light) -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16" />
  <path d="M15 180 L40 100 L70 100 L85 180 Z" fill="#151f33" opacity="0.5" />
  <path d="M160 180 L185 80 L215 80 L230 180 Z" fill="#151f33" opacity="0.6" />

  <!-- Dramatic overhead streetlamp beam -->
  <polygon points="120,0 70,180 170,180" fill="url(#beam-grad)" />

  <!-- EVIDENCE / ILLICIT PACKAGE (The target of the crackdown) -->
  <g id="contraband-package" transform="translate(100, 160)">
    <!-- Small dark box with suspicious glowing contents exposed -->
    <rect x="0" y="10" width="30" height="15" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <rect x="3" y="6" width="24" height="6" rx="1" fill="#64748b" />
    <!-- Glowing illegal powder/substance packets -->
    <rect x="6" y="2" width="8" height="6" rx="1" fill="#ef4444" opacity="0.8" />
    <rect x="16" y="2" width="8" height="6" rx="1" fill="#ef4444" opacity="0.8" />
    <!-- Warning glow effect -->
    <circle cx="15" cy="5" r="10" fill="#ef4444" opacity="0.2" filter="blur(3px)" />
  </g>

  <!-- LAW ENFORCEMENT OFFICER 1 (Dynamic Action / Intervening) -->
  <g id="officer-intervening">
    <!-- Body & Uniform -->
    <path d="M65 140 L85 135 L90 180 L60 180 Z" fill="#1e3a8a" />
    <path d="M72 135 L80 135 L82 170 L70 170 Z" fill="#2563eb" />
    
    <!-- Head & Cap -->
    <circle cx="75" cy="115" r="11" fill="#fbcfe8" />
    <!-- Police Cap -->
    <path d="M63 110 L87 110 L85 103 L65 103 Z" fill="#1e3a8a" />
    <ellipse cx="75" cy="110" rx="13" ry="3" fill="#0f172a" />

    <!-- Dynamic Arm Reaching Out (Halting/Arresting) -->
    <path d="M78 138 L105 145 L108 142 L80 132 Z" fill="#1e3a8a" />
    <circle cx="107" cy="143" r="4" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Leg in motion -->
    <path d="M62 175 L50 200 L62 202 L70 180 Z" fill="#0f172a" />
    <path d="M85 175 L95 198 L83 200 L78 180 Z" fill="#1e3a8a" />
  </g>

  <!-- SUSPECT (Caught in the act, surprised/cornered) -->
  <g id="suspect-cornered">
    <!-- Body -->
    <path d="M135 145 L155 140 L160 180 L130 180 Z" fill="#475569" />
    <!-- Head & Hair -->
    <circle cx="145" cy="120" r="11" fill="#fed7aa" />
    <path d="M134 118 Q145 110 156 118 L155 112 L135 112 Z" fill="#334155" />

    <!-- Hands up in surrender / dropping items -->
    <path d="M138 142 L120 125 L125 120 L142 138 Z" fill="#475569" />
    <circle cx="118" cy="122" r="3.5" fill="#fed7aa" />
    
    <path d="M152 142 L168 130 L172 135 L156 148 Z" fill="#475569" />
    <circle cx="170" cy="132" r="3.5" fill="#fed7aa" />

    <!-- Legs backing away -->
    <path d="M135 178 L125 200 L137 202 L142 178 Z" fill="#1e293b" />
    <path d="M155 178 L165 195 L155 197 L148 178 Z" fill="#334155" />
  </g>

  <!-- LAW ENFORCEMENT OFFICER 2 (Backing up with authority / Shield & Badge vibe) -->
  <g id="officer-support">
    <!-- Body -->
    <path d="M35 150 L55 145 L50 180 L30 180 Z" fill="#1e3a8a" />
    <!-- Head & Cap -->
    <circle cx="45" cy="125" r="10" fill="#fbcfe8" />
    <path d="M35 120 L55 120 L53 114 L37 114 Z" fill="#1e3a8a" />

    <!-- Flashlight Beam / Authority Element -->
    <path d="M50 150 L105 165 L100 175 L45 155 Z" fill="#38bdf8" opacity="0.3" />
    <!-- Flashlight prop -->
    <rect x="45" y="148" width="12" height="6" rx="3" fill="#94a3b8" transform="rotate(15 45 148)" />

    <!-- Legs -->
    <path d="M35 178 L25 202 L37 204 L42 178 Z" fill="#0f172a" />
    <path d="M48 178 L52 203 L40 203 L45 178 Z" fill="#1e3a8a" />
  </g>

  <!-- GOVERNMENT / AUTHORITY SYMBOLIC BADGE ACCENT (Floating subtle HUD element for 'Government Crackdown' context) -->
  <g id="crackdown-indicator" transform="translate(120, 35)">
    <!-- Shield Outline -->
    <path d="M0 -15 L12 -22 L24 -15 L24 5 C24 16 12 24 12 24 C12 24 0 16 0 5 Z" fill="url(#shield-grad)" stroke="#93c5fd" stroke-width="1.5" />
    <!-- Cross / Enforcement Checkmark inside Shield -->
    <path d="M8 0 L12 5 L18 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Atmospheric motion / action lines indicating raid intensity -->
  <line x1="90" y1="90" x2="75" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <line x1="100" y1="80" x2="85" y2="100" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="110" y1="95" x2="95" y2="115" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Vignette overlay for cinematic HSK illustration depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>