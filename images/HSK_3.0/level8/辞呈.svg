<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#2D343E"/>
  
  <!-- Resignation Letter (The physical object) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="80" height="100" rx="4" fill="#E0E6ED"/>
    <rect x="15" y="20" width="50" height="6" rx="1" fill="#94A3B8"/>
    <rect x="15" y="35" width="50" height="6" rx="1" fill="#94A3B8"/>
    <rect x="15" y="50" width="30" height="6" rx="1" fill="#94A3B8"/>
    <!-- Signature line/mark -->
    <path d="M15 80 L50 80" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Hand placing the letter -->
  <path d="M140 160 L140 120 C140 110 150 100 160 100 L180 100 C190 100 200 110 200 120 L200 160" fill="#FDBA74"/>
  
  <!-- Accent highlight on the document -->
  <rect x="165" y="75" width="15" height="15" rx="2" fill="#F59E0B"/>
</svg>