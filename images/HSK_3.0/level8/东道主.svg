<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Host Stage -->
    <radialGradient id="spotlight" cx="50%" cy="20%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Building Window Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT: Beijing Modern/Traditional Hybrid Skyline (Host City Context) -->
  <g id="skyline" opacity="0.35">
    <!-- Distant Modern Towers -->
    <rect x="20" y="90" width="24" height="110" fill="#334155" rx="2"/>
    <rect x="50" y="70" width="30" height="130" fill="#475569" rx="2"/>
    <polygon points="65,45 50,70 80,70" fill="#475569"/>
    
    <!-- Stylized CCTV/Galaxy SOHO iconic architecture curve representation -->
    <path d="M 170,80 Q 200,80 200,110 L 200,200 L 140,200 L 140,130 Q 140,80 170,80 Z" fill="#334155"/>
    
    <!-- Glowing Windows -->
    <rect x="56" y="80" width="6" height="10" fill="url(#windowGlow)"/>
    <rect x="68" y="80" width="6" height="10" fill="url(#windowGlow)"/>
    <rect x="56" y="100" width="6" height="10" fill="url(#windowGlow)"/>
    <rect x="68" y="100" width="6" height="10" fill="url(#windowGlow)"/>
    <rect x="25" y="110" width="5" height="8" fill="url(#windowGlow)"/>
    <rect x="35" y="110" width="5" height="8" fill="url(#windowGlow)"/>
    <rect x="25" y="130" width="5" height="8" fill="url(#windowGlow)"/>
    
    <!-- Traditional Curved Roof silhouette (Forbidden City / Temple of Heaven hint) -->
    <path d="M 90,140 Q 120,125 150,140 L 155,146 L 85,146 Z" fill="#64748b"/>
    <path d="M 98,126 Q 120,115 142,126 L 145,130 L 95,130 Z" fill="#64748b"/>
  </g>

  <!-- STAGE / FLOOR -->
  <path d="M 0,200 L 240,200 L 240,240 L 0,240 Z" fill="#090d16"/>
  <ellipse cx="120" cy="200" rx="100" ry="12" fill="#1e293b" opacity="0.8"/>

  <!-- EVENT / TOURNAMENT PROPS (Context: "比赛" - Competition/Tournament) -->
  <!-- Championship Podium / Stage Centerpiece -->
  <g id="podium_and_trophy">
    <!-- Podium Structure -->
    <rect x="95" y="165" width="50" height="35" fill="#334155" rx="2"/>
    <rect x="100" y="170" width="40" height="30" fill="#475569" rx="1"/>
    
    <!-- Glowing Ribbon / Welcome Banner Base -->
    <path d="M 60,185 Q 120,205 180,185" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Championship Trophy (Host city presents the prize) -->
    <path d="M 113,145 L 127,145 L 125,160 L 115,160 Z" fill="url(#goldGrad)"/>
    <rect x="117" y="160" width="6" height="10" fill="#b45309"/>
    <path d="M 108,130 Q 120,120 132,130 L 130,145 L 110,145 Z" fill="url(#goldGrad)"/>
    <path d="M 104,133 C 100,133 98,138 102,142" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 136,133 C 140,133 142,138 138,142" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Glowing Star on Trophy -->
    <polygon points="120,132 122,137 127,137 123,140 125,145 120,142 115,145 117,140 113,137 118,137" fill="#fff" opacity="0.9"/>
  </g>

  <!-- CHARACTERS: The Host (东道主) Welcoming / Presenting -->
  <!-- Character 1: Host Representative (Smiling, welcoming gesture) -->
  <g id="host_character">
    <!-- Shadow -->
    <ellipse cx="85" cy="201" rx="14" ry="4" fill="#000" opacity="0.4"/>
    
    <!-- Body / Suit -->
    <path d="M 73,175 L 97,175 L 100,200 L 70,200 Z" fill="#0284c7"/>
    <!-- Shirt & Tie -->
    <polygon points="85,175 80,185 90,185" fill="#f8fafc"/>
    <polygon points="85,183 83,195 85,198 87,195" fill="#e11d48"/>
    
    <!-- Head & Face -->
    <circle cx="85" cy="155" r="13" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M 74,155 C 74,145 80,143 85,143 C 92,143 96,146 96,154 C 92,152 89,150 85,150 C 80,150 76,152 74,155 Z" fill="#1e293b"/>
    
    <!-- Friendly Welcoming Expression -->
    <path d="M 80,156 Q 85,161 90,156" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="81" cy="153" r="1.5" fill="#334155"/>
    <circle cx="89" cy="153" r="1.5" fill="#334155"/>
    <!-- Rosy Cheeks -->
    <circle cx="79" cy="157" r="2" fill="#fda4af" opacity="0.6"/>
    <circle cx="91" cy="157" r="2" fill="#fda4af" opacity="0.6"/>

    <!-- Gesturing Arm (Welcoming hand toward center/trophy) -->
    <path d="M 75,178 L 60,170 L 63,165" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="63" cy="165" r="3" fill="#ffedd5"/>
  </g>

  <!-- Character 2: Visiting Participant / Competitor (Appreciative guest) -->
  <g id="guest_character">
    <!-- Shadow -->
    <ellipse cx="155" cy="201" rx="14" ry="4" fill="#000" opacity="0.4"/>
    
    <!-- Body / Attire -->
    <path d="M 143,175 L 167,175 L 172,200 L 140,200 Z" fill="#10b981"/>
    <!-- Collar -->
    <polygon points="155,175 150,183 160,183" fill="#f8fafc"/>
    
    <!-- Head & Face (Looking towards center/host) -->
    <circle cx="155" cy="155" r="13" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M 144,153 C 145,144 150,142 156,142 C 163,142 166,146 166,155 C 162,153 158,151 154,151 C 150,151 146,152 144,153 Z" fill="#b45309"/>
    
    <!-- Expression (Delighted / Clapping) -->
    <path d="M 151,157 Q 155,161 159,157" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="152" cy="153" r="1.5" fill="#334155"/>
    <circle cx="158" cy="153" r="1.5" fill="#334155"/>
    <!-- Rosy Cheeks -->
    <circle cx="150" cy="158" r="2" fill="#fda4af" opacity="0.6"/>
    <circle cx="160" cy="158" r="2" fill="#fda4af" opacity="0.6"/>

    <!-- Clapping / Receiving Arms -->
    <path d="M 165,178 L 158,168 L 152,172" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="152" cy="172" r="3" fill="#ffedd5"/>
  </g>

  <!-- FOREGROUND AMBIENCE: Confetti / Celebration Sparkles -->
  <g id="sparkles" opacity="0.9">
    <circle cx="45" cy="110" r="2" fill="#38bdf8"/>
    <circle cx="55" cy="130" r="1.5" fill="#fbbf24"/>
    <circle cx="195" cy="115" r="2.5" fill="#ec4899"/>
    <circle cx="185" cy="135" r="1.5" fill="#38bdf8"/>
    <circle cx="105" cy="95" r="2" fill="#10b981"/>
    <circle cx="135" cy="105" r="1.5" fill="#fbbf24"/>
    
    <!-- Tiny star sparkles -->
    <path d="M 30,80 L 32,85 L 37,87 L 32,89 L 30,94 L 28,89 L 23,87 L 28,85 Z" fill="#fbbf24" opacity="0.7" transform="scale(0.5) translate(30,60)"/>
    <path d="M 210,90 L 212,95 L 217,97 L 212,99 L 210,104 L 208,99 L 203,97 L 208,95 Z" fill="#38bdf8" opacity="0.7" transform="scale(0.5) translate(210,80)"/>
  </g>
</svg>