<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="180" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The Glass Cup -->
  <path d="M80 80 L160 80 L150 170 L90 170 Z" fill="#e2e8f0" fill-opacity="0.2" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="120" cy="80" rx="40" ry="8" fill="#e2e8f0" fill-opacity="0.1" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Liquid -->
  <path d="M82 100 L158 100 L150 168 L90 168 Z" fill="#38bdf8" fill-opacity="0.3"/>
  
  <!-- Impurities (The 'Chen Dian') -->
  <circle cx="105" cy="164" r="3" fill="#fb923c"/>
  <circle cx="120" cy="166" r="4" fill="#fb923c"/>
  <circle cx="135" cy="163" r="2" fill="#fb923c"/>
  <circle cx="112" cy="167" r="2.5" fill="#fb923c"/>
  <circle cx="128" cy="167" r="3.5" fill="#fb923c"/>
  
  <!-- Character: Scientist/Observer -->
  <g transform="translate(160, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="15" fill="#fde68a"/>
    <!-- Glasses -->
    <rect x="-10" y="-5" width="8" height="6" rx="1" fill="#0f172a"/>
    <rect x="2" y="-5" width="8" height="6" rx="1" fill="#0f172a"/>
    <!-- Body -->
    <path d="M-20 20 L20 20 L15 60 L-15 60 Z" fill="#10b981"/>
    <!-- Arm pointing -->
    <path d="M-15 30 L-35 40 L-30 45 L-15 35" fill="#fde68a"/>
  </g>
  
  <!-- Ambient light/glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
</svg>