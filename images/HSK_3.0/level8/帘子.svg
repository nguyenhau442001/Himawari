<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame -->
  <rect x="60" y="40" width="120" height="160" rx="4" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- The Curtain (帘子) - Mid-action being pulled down -->
  <rect x="64" y="44" width="112" height="100" rx="2" fill="#fbbf24" opacity="0.9"/>
  <path d="M64 144 L176 144 L172 152 L68 152 Z" fill="#f59e0b"/>
  
  <!-- Curtain Cord/Pull -->
  <line x1="165" y1="148" x2="165" y2="180" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="165" cy="185" r="4" fill="#fb923c"/>
  
  <!-- Character Arm/Hand -->
  <path d="M180 160 C 200 150, 210 170, 170 185" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="170" cy="185" r="6" fill="#fcd34d"/>
  
  <!-- Interior Details -->
  <rect x="40" y="200" width="160" height="40" fill="#1e293b"/>
  <path d="M80 200 L160 200 L150 240 L90 240 Z" fill="#334155"/>
  
  <!-- Outside light glow -->
  <rect x="64" y="44" width="112" height="40" fill="#fef3c7" opacity="0.1"/>
  
  <!-- Decorative plant -->
  <circle cx="30" cy="180" r="10" fill="#10b981"/>
  <path d="M30 190 L30 210" stroke="#10b981" stroke-width="3"/>
</svg>