<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow around the archaeological discovery -->
  <circle cx="120" cy="135" r="55" fill="#F59E0B" opacity="0.12"/>
  <circle cx="120" cy="135" r="38" fill="#FBBF24" opacity="0.15"/>

  <!-- Excavation trench cutaway / Earth strata layers -->
  <path d="M24 165 C 60 160, 80 180, 120 180 C 160 180, 180 160, 216 165 L 216 216 C 216 220, 212 224, 208 224 L 32 224 C 28 224, 24 220, 24 216 Z" fill="#231F20"/>
  <path d="M24 150 C 70 142, 85 170, 120 170 C 155 170, 170 142, 216 150 L 216 175 C 180 170, 160 185, 120 185 C 80 185, 60 170, 24 175 Z" fill="#322923"/>
  
  <!-- Excavation pit outline -->
  <path d="M40 135 C 45 180, 75 195, 120 195 C 165 195, 195 180, 200 135 C 175 142, 150 145, 120 145 C 90 145, 65 142, 40 135 Z" fill="#3E332A"/>
  <ellipse cx="120" cy="178" rx="55" ry="14" fill="#2A221C"/>

  <!-- Soil strata markers and unearthed pebbles -->
  <ellipse cx="72" cy="172" rx="4" ry="2.5" fill="#524337"/>
  <ellipse cx="168" cy="175" rx="5" ry="3" fill="#524337"/>
  <ellipse cx="152" cy="184" rx="3.5" ry="2" fill="#42352B"/>
  <ellipse cx="88" cy="183" rx="4.5" ry="2.5" fill="#42352B"/>
  <path d="M50 156 Q 70 159 90 157" stroke="#4B3D32" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 158 Q 170 160 190 156" stroke="#4B3D32" stroke-width="2" stroke-linecap="round"/>

  <!-- Ancient Excavated Relic (Unearthed Bronze/Gold Amphora) -->
  <!-- Relic Shadow -->
  <ellipse cx="118" cy="170" rx="22" ry="6" fill="#1A1512"/>

  <!-- Relic Base -->
  <ellipse cx="118" cy="164" rx="14" ry="4" fill="#B45309"/>
  <path d="M104 164 L 107 154 L 129 154 L 132 164 Z" fill="#D97706"/>

  <!-- Relic Body -->
  <path d="M96 128 C 96 150, 106 156, 118 156 C 130 156, 140 150, 140 128 C 140 118, 134 112, 128 108 L 108 108 C 102 112, 96 118, 96 128 Z" fill="#F59E0B"/>
  
  <!-- Relic Shading / 3D Volume -->
  <path d="M118 108 C 124 112, 130 118, 130 128 C 130 150, 124 156, 118 156 C 130 156, 140 150, 140 128 C 140 118, 134 112, 128 108 Z" fill="#D97706"/>
  <path d="M106 112 C 102 118, 100 125, 101 133 C 103 125, 107 118, 112 113 Z" fill="#FDE68A" opacity="0.6"/>

  <!-- Relic Neck and Lip -->
  <path d="M109 97 L 108 108 L 128 108 L 127 97 Z" fill="#D97706"/>
  <path d="M111 97 L 110 108 L 120 108 L 120 97 Z" fill="#F59E0B"/>
  <ellipse cx="118" cy="97" rx="10" ry="3" fill="#F59E0B"/>
  <ellipse cx="118" cy="97" rx="7.5" ry="2" fill="#92400E"/>

  <!-- Relic Handles -->
  <path d="M97 114 C 88 114, 88 128, 98 132" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M97 114 C 89 114, 89 128, 98 132" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M139 114 C 148 114, 148 128, 138 132" stroke="#B45309" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M139 114 C 147 114, 147 128, 138 132" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Antique Carved Patterns on Relic -->
  <path d="M100 128 Q 118 134 136 128" stroke="#78350F" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M103 134 Q 118 140 133 134" stroke="#78350F" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="118" cy="122" r="2.5" fill="#FEF08A"/>

  <!-- Archaeological Excavation Trowel (Tool stuck in ground) -->
  <g transform="translate(156, 118) rotate(25)">
    <!-- Shadow -->
    <path d="M-6 32 L 6 32 L 0 46 Z" fill="#1F1A16"/>
    <!-- Blade -->
    <path d="M-9 14 L 9 14 L 0 34 Z" fill="#94A3B8"/>
    <path d="M0 14 L 9 14 L 0 34 Z" fill="#64748B"/>
    <line x1="0" y1="14" x2="0" y2="33" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Tang / Neck -->
    <path d="M0 14 L 0 6 L 4 3 L 4 -2" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Wooden Handle -->
    <rect x="1.5" y="-18" width="5" height="16" rx="2.5" fill="#EA580C"/>
    <path d="M1.5" y="-18" width="2.5" height="16" rx="1.2" fill="#F97316"/>
    <!-- Ferrule metal collar -->
    <rect x="2" y="-3" width="4" height="2.5" rx="0.5" fill="#CBD5E1"/>
  </g>

  <!-- Archaeologist Dusting Brush -->
  <g transform="translate(74, 96) rotate(-35)">
    <!-- Wooden Handle -->
    <path d="M-2 -28 L 2 -28 L 3 2 L -3 2 Z" fill="#D97706"/>
    <path d="M-2 -28 L 0 -28 L 0 2 L -3 2 Z" fill="#F59E0B"/>
    <!-- Metal Ferrule -->
    <rect x="-3.5" y="2" width="7" height="6" fill="#94A3B8"/>
    <!-- Bristles -->
    <path d="M-3.5 8 L 3.5 8 L 5 20 L -5 20 Z" fill="#F1F5F9"/>
    <!-- Bristle dark tip/dirt texture -->
    <path d="M-5 17 L 5 17 L 5 20 L -5 20 Z" fill="#94A3B8"/>
  </g>

  <!-- Excavated Dirt Clods / Removed Earth Piles -->
  <path d="M148 162 Q 156 150 165 163 Q 170 160 176 166 Z" fill="#524337"/>
  <path d="M64 158 Q 72 148 80 159 Q 84 155 90 162 Z" fill="#524337"/>

  <!-- Discovery Sparkles (Signifying unearthing / discovery) -->
  <!-- Sparkle Top Right -->
  <path d="M148 94 Q 148 102 156 102 Q 148 102 148 110 Q 148 102 140 102 Q 148 102 148 94 Z" fill="#FBBF24"/>
  <!-- Sparkle Top Left -->
  <path d="M88 78 Q 88 84 94 84 Q 88 84 88 90 Q 88 84 82 84 Q 88 84 88 78 Z" fill="#FEF08A"/>
  <!-- Small Star -->
  <circle cx="152" cy="74" r="1.5" fill="#FDE68A"/>
  <circle cx="70" cy="116" r="1.5" fill="#FDE68A"/>
  <circle cx="168" cy="118" r="1.5" fill="#FDE68A"/>
</svg>