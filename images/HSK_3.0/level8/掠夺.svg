<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Fire/Gold Glow -->
    <radialGradient id="goldGlow" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Chest Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#goldGlow)" />

  <!-- Stone Castle Interior Background Elements -->
  <!-- Stone Wall Blocks -->
  <path d="M15 15h70v40H15z M95 25h65v35H95 z M170 15h55v45H170z" fill="#334155" opacity="0.4" />
  <path d="M15 140h65v80H15z M160 150h65v70H160z" fill="#334155" opacity="0.3" />
  <!-- Broken Stone Archway Top -->
  <path d="M40 80 Q120 20 200 80 L200 60 Q120 5 40 60 Z" fill="#475569" opacity="0.5" />
  <!-- Dramatic light beam -->
  <polygon points="120,0 200,0 240,200 160,200" fill="#f59e0b" opacity="0.05" />

  <!-- Wooden Table / Treasury Base -->
  <rect x="25" y="165" width="130" height="15" fill="url(#woodGrad)" rx="2" />
  <rect x="35" y="180" width="15" height="45" fill="#381301" />
  <rect x="130" y="180" width="15" height="45" fill="#381301" />

  <!-- Open Treasure Chest -->
  <!-- Chest Back/Interior -->
  <path d="M50 130 h80 v35 h-80 z" fill="#3c1608" />
  <!-- Chest Lid (Open upward/backward) -->
  <path d="M50 130 C50 100 70 85 90 85 C110 85 130 100 130 130 Z" fill="#854d0e" />
  <path d="M53 127 C53 100 71 88 90 88 C109 88 127 100 127 127 Z" fill="#a16207" />
  <!-- Metal bands on lid -->
  <path d="M68 90 L68 128" stroke="url(#metalGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M112 90 L112 128" stroke="url(#metalGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Chest Body -->
  <rect x="45" y="130" width="90" height="38" rx="4" fill="#78350f" />
  <rect x="45" y="130" width="90" height="38" rx="4" fill="url(#woodGrad)" opacity="0.6" />
  <!-- Metal Straps & Rivets -->
  <rect x="45" y="145" width="90" height="8" fill="#451a03" />
  <path d="M60 130 V168 M120 130 V168" stroke="url(#metalGrad)" stroke-width="6" />
  <!-- Gold Lock Plate -->
  <rect x="83" y="140" width="14" height="18" rx="2" fill="url(#metalGrad)" />
  <circle cx="90" cy="149" r="2.5" fill="#1e293b" />

  <!-- Overflowing Treasures / Gold Coins & Gems -->
  <circle cx="70" cy="125" r="7" fill="url(#coinGrad)" />
  <circle cx="82" cy="122" r="8" fill="url(#coinGrad)" />
  <circle cx="95" cy="120" r="9" fill="url(#coinGrad)" />
  <circle cx="108" cy="123" r="7" fill="url(#coinGrad)" />
  <circle cx="60" cy="132" r="6" fill="url(#coinGrad)" />
  <circle cx="118" cy="130" r="8" fill="url(#coinGrad)" />
  <!-- Scattered Coins on Table -->
  <ellipse cx="35" cy="163" rx="6" ry="3" fill="url(#coinGrad)" />
  <ellipse cx="145" cy="164" rx="7" ry="3.5" fill="url(#coinGrad)" />
  <ellipse cx="155" cy="160" rx="5" ry="2.5" fill="url(#coinGrad)" />
  <!-- Ruby/Emerald Gems -->
  <polygon points="85,123 90,117 95,123 90,128" fill="#ef4444" />
  <polygon points="102,126 106,121 110,126 106,131" fill="#10b981" />

  <!-- Sack of Loot on Floor/Table -->
  <path d="M140 165 C135 145 155 130 165 145 C175 130 195 145 190 165 Z" fill="#ca8a04" />
  <path d="M155 142 C160 140 170 140 175 142" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  <!-- Gold spilling from sack -->
  <circle cx="160" cy="153" r="5" fill="url(#coinGrad)" />
  <circle cx="170" cy="151" r="6" fill="url(#coinGrad)" />

  <!-- INVADER CHARACTER (Aggressive, dynamic, looting action) -->
  <!-- Torso & Armor (Dark steel/crimson invader uniform) -->
  <g transform="translate(145, 65)">
    <!-- Back Leg / Foot -->
    <path d="M25 70 L15 110 L35 115 L42 75 Z" fill="#334155" />
    <path d="M10 110 h28 l5 7 h-33 z" fill="#0f172a" />

    <!-- Torso (Leaning forward, grabbing/looting motion) -->
    <path d="M10 30 Q30 20 50 40 L45 80 Q25 85 15 75 Z" fill="#475569" />
    <!-- Chest Armor Plate (Dark Red/Steel) -->
    <path d="M18 38 Q30 30 45 45 L40 70 Q25 75 18 65 Z" fill="#991b1b" />
    <path d="M25 45 h12 v15 h-12 z" fill="#f59e0b" opacity="0.8" /> <!-- Emblem -->

    <!-- Front Leg / Foot -->
    <path d="M35 70 L45 115 L65 112 L50 70 Z" fill="#475569" />
    <path d="M42 112 h25 l3 8 h-28 z" fill="#1e293b" />

    <!-- Back Arm holding a looted sack or weapon -->
    <path d="M20 35 Q5 45 -5 35" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Head & Helmet -->
    <!-- Head position (Aggressive profile, facing down/left towards chest) -->
    <circle cx="45" cy="22" r="14" fill="#fed7aa" />
    <!-- Helmet (Iron cap with horn/spike) -->
    <path d="M30 22 C30 5 60 5 60 22 L55 25 H35 Z" fill="#64748b" />
    <path d="M45 5 L48 -4 L51 5 Z" fill="#475569" /> <!-- Spike -->
    <!-- Fierce Visor/Eyes -->
    <path d="M42 18 L52 20" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <!-- Angry brow -->
    <path d="M43 15 L51 18" stroke="#991b1b" stroke-width="2" />

    <!-- Front Arm reaching down to grab gold -->
    <path d="M45 45 Q65 60 75 75" stroke="#475569" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hand grasping a handful of coins -->
    <circle cx="78" cy="78" r="7" fill="#fed7aa" />
    <!-- Coins in hand -->
    <circle cx="82" cy="74" r="5" fill="url(#coinGrad)" />
    <circle cx="85" cy="80" r="4" fill="url(#coinGrad)" />
  </g>

  <!-- Dynamic Flying Gold Coins (Action Effect) -->
  <circle cx="110" cy="95" r="5" fill="url(#coinGrad)" />
  <circle cx="125" cy="80" r="6" fill="url(#coinGrad)" />
  <path d="M105 100 Q120 90 130 75" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.6" />

  <!-- Ambient Foreground Elements / Atmospheric Dust / Sparks -->
  <circle cx="50" cy="60" r="2" fill="#f59e0b" opacity="0.6" />
  <circle cx="100" cy="40" r="1.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="180" cy="110" r="2.5" fill="#f59e0b" opacity="0.4" />
  <circle cx="30" cy="200" r="1.5" fill="#f59e0b" opacity="0.5" />
</svg>