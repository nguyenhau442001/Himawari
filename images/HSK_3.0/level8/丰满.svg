<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing sky/nature context -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>

  <g transform="translate(12, 10)">
    <!-- Stylized Modern Bird representing the Contextual Reference (雏鸟羽翼丰满) -->
    <!-- Tail Feathers -->
    <path d="M 60 140 L 40 160 L 65 155 L 50 175 L 75 160 Z" fill="#3E4C60"/>
    
    <!-- Body -->
    <path d="M 70 100 C 65 130, 85 150, 110 150 C 135 150, 150 130, 140 100 C 130 80, 90 70, 70 100 Z" fill="#5A6D85"/>
    
    <!-- Head -->
    <circle cx="135" cy="75" r="22" fill="#5A6D85"/>
    
    <!-- Beak -->
    <path d="M 152 72 L 175 78 L 152 84 Z" fill="#F59E0B"/>
    
    <!-- Eye -->
    <circle cx="140" cy="71" r="3.5" fill="#1A1D24"/>
    <circle cx="141" cy="70" r="1" fill="#FFFFFF"/>

    <!-- WINGS - Full, layered, and lush (丰满: plump, rich, fully developed) -->
    <!-- Under layer wing feathers -->
    <path d="M 90 95 C 75 110, 65 135, 75 155 C 90 155, 110 135, 120 115 Z" fill="#D97706"/>
    
    <!-- Mid layer wing feathers -->
    <path d="M 95 90 C 85 105, 80 125, 95 145 C 115 140, 130 120, 130 100 Z" fill="#FBBF24"/>
    
    <!-- Top lush wing layer (High-contrast accent color for focus) -->
    <path d="M 100 85 C 95 95, 95 110, 110 130 C 125 125, 135 110, 135 95 C 135 85, 120 80, 100 85 Z" fill="#FCD34D"/>

    <!-- Individual overlapping feather details suggesting rich fullness -->
    <path d="M 105 105 Q 115 115 125 105" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 100 115 Q 110 125 120 115" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 95 95 Q 105 105 115 95" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Secondary Wing (Visible behind) -->
    <path d="M 115 80 C 125 80, 135 90, 140 100 C 135 115, 125 115, 115 105 Z" fill="#4B5E75"/>
  </g>
</svg>