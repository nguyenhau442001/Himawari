<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Spotlight for Boutique Setting -->
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Hanger Gradient -->
    <linearGradient id="metalHanger" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Elegant Clothing Fabric Gradient -->
    <linearGradient id="dressFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Environmental Atmosphere: Boutique Window & Shelves -->
  <path d="M0 0h240v240H0z" fill="url(#spotlight)"/>
  
  <!-- Background Interior Elements (Modern Boutique Shelf / Rack) -->
  <g opacity="0.4">
    <rect x="30" y="40" width="180" height="4" rx="2" fill="#334155"/>
    <rect x="50" y="80" width="140" height="3" rx="1.5" fill="#334155"/>
    <!-- Hanging silhouettes in background -->
    <path d="M70 44l10 20h-20z" fill="#475569"/>
    <path d="M110 44l10 20h-20z" fill="#475569"/>
    <path d="M150 44l10 20h-20z" fill="#475569"/>
  </g>

  <!-- Ambient Plant Decor -->
  <g opacity="0.6">
    <path d="M210 180c0-15 15-25 20-40-10 15-25 15-25 30z" fill="#10b981"/>
    <path d="M200 190c-10-10-5-25-15-35 5 15 15 15 20 25z" fill="#059669"/>
    <rect x="195" y="190" width="20" height="30" rx="4" fill="#334155"/>
  </g>

  <!-- MAIN PROP: The Detailed Garment with Beautiful Patterns (花样) -->
  <g filter="url(#dropShadow)" transform="translate(0, 5)">
    <!-- Wooden/Metal Clothing Rack Bar -->
    <rect x="65" y="32" width="110" height="6" rx="3" fill="url(#metalHanger)"/>
    <!-- Hanger Hook & Body -->
    <path d="M120 32v-8c0-3.3-2.7-6-6-6s-6 2.7-6 6" fill="none" stroke="url(#metalHanger)" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 48l45-12 45 12z" fill="none" stroke="url(#metalHanger)" stroke-width="4" stroke-linejoin="round"/>

    <!-- The Garment Base (Dress / Blouse) -->
    <path d="M92 48l-12 22 14 10 6-12v64c0 6 4 10 10 10h30c6 0 10-4 10-10V72l6 12 14-10-12-22z" fill="url(#dressFabric)"/>
    
    <!-- Garment Collar & Inner details -->
    <path d="M104 48c0 6 8 10 16 10s16-4 16-10" fill="none" stroke="#0284c7" stroke-width="3"/>

    <!-- EXPLICIT PATTERNS (花样 - Huāyàng): Elegant, colorful floral and geometric motifs printed on the fabric -->
    <g>
      <!-- Pattern Unit 1 (Left Chest) -->
      <circle cx="106" cy="74" r="6" fill="#f43f5e" opacity="0.9"/>
      <circle cx="106" cy="74" r="2.5" fill="#fef08a"/>
      <path d="M106 66v2m0 12v2m-6-8h2m10 0h2" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Pattern Unit 2 (Right Chest) -->
      <circle cx="134" cy="74" r="6" fill="#f43f5e" opacity="0.9"/>
      <circle cx="134" cy="74" r="2.5" fill="#fef08a"/>
      <path d="M134 66v2m0 12v2m-6-8h2m10 0h2" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Pattern Unit 3 (Center Torso Motif) -->
      <g transform="translate(120, 96)">
        <circle cx="0" cy="0" r="10" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5"/>
        <path d="M-6 0h12M0-6v12" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="3" fill="#f43f5e"/>
      </g>

      <!-- Pattern Unit 4 & 5 (Lower Hem Floral Swirls) -->
      <path d="M96 122c3-3 7-3 10 0s7 3 10 0" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M124 122c3-3 7-3 10 0s7 3 10 0" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Tiny decorative dots -->
      <circle cx="110" cy="110" r="1.5" fill="#fef08a"/>
      <circle cx="130" cy="110" r="1.5" fill="#fef08a"/>
      <circle cx="100" cy="90" r="1.5" fill="#fef08a"/>
      <circle cx="140" cy="90" r="1.5" fill="#fef08a"/>
    </g>
  </g>

  <!-- CHARACTER: Expressive Shopper / Fashion Admirer -->
  <g transform="translate(0, 10)">
    <!-- Character Body / Torso -->
    <path d="M100 170c-15 0-30 8-38 22v28h76v-28c-8-14-23-22-38-22z" fill="#475569"/>
    <!-- Stylish Jacket / Top -->
    <path d="M88 170l12 18 12-18 10 22H78z" fill="#cbd5e1"/>
    <path d="M100 170v22" stroke="#94a3b8" stroke-width="2"/>

    <!-- Neck -->
    <rect x="94" y="152" width="12" height="20" rx="6" fill="#fbcfe8"/>

    <!-- Head & Face (Expressive, admiring expression looking at the clothes) -->
    <g transform="translate(100, 138)">
      <!-- Hair Back/Base -->
      <circle cx="0" cy="0" r="22" fill="#334155"/>
      
      <!-- Face Skin -->
      <circle cx="0" cy="2" r="18" fill="#fbcfe8"/>
      
      <!-- Hair Bangs & Styling -->
      <path d="M-18-4c4-12 16-16 26-10-6-6-16-6-22 4z" fill="#334155"/>
      <path d="M10-12c6 4 10 12 8 20-8-4-12-12-8-20z" fill="#334155"/>

      <!-- Blushing Cheeks (Appreciation) -->
      <circle cx="-8" cy="8" r="4" fill="#f43f5e" opacity="0.4"/>
      <circle cx="8" cy="8" r="4" fill="#f43f5e" opacity="0.4"/>

      <!-- Friendly Happy Eyes (Looking up-left at the dress pattern) -->
      <circle cx="-6" cy="1" r="2" fill="#0f172a"/>
      <circle cx="6" cy="1" r="2" fill="#0f172a"/>

      <!-- Gentle Happy Smile -->
      <path d="M-4 9c2 2 6 2 8 0" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

      <!-- Left Hand pointing or gesturing admiringly toward the dress -->
      <g transform="translate(-32, 28)">
        <circle cx="0" cy="0" r="7" fill="#fbcfe8"/>
        <!-- Pointing finger -->
        <path d="M5-2l8-3-2 5z" fill="#fbcfe8"/>
        <path d="M-4 4l12-15" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- FOREGROUND & LIGHTING ACCENTS -->
  <!-- Sparkles / Appreciation Glow around the pattern -->
  <g filter="url(#softGlow)" opacity="0.9">
    <path d="M135 60l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fef08a"/>
    <path d="M105 105l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fef08a"/>
  </g>

  <!-- Store Interior Floor Base -->
  <rect x="0" y="220" width="240" height="20" fill="#090d16"/>
  <line x1="0" y1="220" x2="240" y2="220" stroke="#334155" stroke-width="2"/>
</svg>