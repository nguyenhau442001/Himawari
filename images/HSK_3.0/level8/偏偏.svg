<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Interior Wall & Warm Doorway Context -->
  <path d="M120 40 L210 60 L210 220 L120 220 Z" fill="#1e293b"/>
  <rect x="25" y="45" width="95" height="175" fill="#0f172a" rx="4"/>
  
  <!-- Warm Light Spill from Open Door -->
  <path d="M25 45 L120 45 L120 220 L25 220 Z" fill="url(#warmLight)"/>
  <ellipse cx="72" cy="132" rx="35" ry="60" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Interior Floor / Door Frame -->
  <path d="M10 220 L230 220 L230 235 L10 235 Z" fill="#0f172a"/>
  <rect x="20" y="40" width="8" height="180" fill="#334155" rx="2"/>
  <rect x="110" y="40" width="6" height="180" fill="#1e293b" rx="1"/>

  <!-- Interior Props (Hallway table & plant) -->
  <rect x="35" y="160" width="30" height="60" rx="3" fill="#475569"/>
  <ellipse cx="50" cy="160" rx="16" ry="4" fill="#64748b"/>
  <!-- Key bowl on table -->
  <ellipse cx="45" cy="158" rx="6" ry="2" fill="#fb923c"/>
  <!-- Small indoor plant -->
  <path d="M55 145 C55 135 60 130 65 125 C63 135 60 140 55 145 Z" fill="#10b981"/>
  <path d="M50 148 C45 140 44 133 42 127 C47 135 50 142 50 148 Z" fill="#059669"/>

  <!-- Outdoor Environment & Rain Elements -->
  <!-- Distant City Silhouette -->
  <path d="M130 180 L130 140 L145 140 L145 180 L160 180 L160 110 L175 110 L175 180 L195 180 L195 130 L210 130 L210 180 Z" fill="#0f172a" opacity="0.7"/>
  <rect x="150" y="120" width="4" height="6" fill="#fbbf24" opacity="0.6"/>
  <rect x="180" y="140" width="4" height="6" fill="#fbbf24" opacity="0.4"/>

  <!-- Rain Streaks (The "偏偏" unexpected element) -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="130" y1="50" x2="115" y2="90"/>
    <line x1="155" y1="40" x2="140" y2="80"/>
    <line x1="180" y1="65" x2="165" y2="105"/>
    <line x1="205" y1="45" x2="190" y2="85"/>
    <line x1="140" y1="95" x2="125" y2="135"/>
    <line x1="170" y1="110" x2="155" y2="150"/>
    <line x1="195" y1="90" x2="180" y2="130"/>
    <line x1="220" y1="115" x2="205" y2="155"/>
    <line x1="135" y1="150" x2="120" y2="190"/>
    <line x1="165" y1="165" x2="150" y2="205"/>
    <line x1="190" y1="145" x2="175" y2="185"/>
  </g>
  <g stroke="#bae6fd" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <line x1="145" y1="70" x2="132" y2="105"/>
    <line x1="175" y1="85" x2="162" y2="120"/>
    <line x1="210" y1="75" x2="197" y2="110"/>
    <line x1="155" y1="130" x2="142" y2="165"/>
    <line x1="185" y1="120" x2="172" y2="155"/>
  </g>

  <!-- Main Character (Stepping out, shocked/annoyed expression) -->
  <!-- Body/Torso in Jacket -->
  <path d="M85 115 L112 120 L115 180 L80 180 Z" fill="#3b82f6" rx="4"/>
  <!-- Backpack / Bag strap -->
  <path d="M88 115 L102 140 L98 180" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Head & Hair -->
  <circle cx="100" cy="85" r="18" fill="#fcd34d"/>
  <!-- Hair styling -->
  <path d="M84 82 C85 70 95 65 105 68 C115 70 117 80 117 85 C110 81 95 80 84 82 Z" fill="#1e293b"/>

  <!-- Face / Expression (Shocked/Disappointed seeing the rain) -->
  <!-- Eyebrows tilted in dismay -->
  <path d="M92 78 L98 81" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M102 81 L108 78" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes wide -->
  <circle cx="95" cy="86" r="2" fill="#1e293b"/>
  <circle cx="105" cy="86" r="2" fill="#1e293b"/>
  <!-- Open mouth (doh!) -->
  <ellipse cx="100" cy="94" rx="3" ry="4" fill="#b91c1c"/>

  <!-- Arms -->
  <!-- Back Arm holding umbrella handle inside -->
  <path d="M88 120 L75 145 L85 150" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Front Arm holding packed umbrella pointing out/down -->
  <path d="M110 125 L130 145" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Legs (Stepping motion: one inside, one crossing threshold) -->
  <!-- Back leg -->
  <path d="M88 175 L85 215 L95 218" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front stepping leg -->
  <path d="M105 175 L125 195 L135 193" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="98" cy="219" rx="8" ry="4" fill="#0f172a"/>
  <ellipse cx="138" cy="193" rx="9" ry="4" fill="#0f172a"/>

  <!-- Props: Travel Umbrella (Closed or just grabbed) -->
  <g transform="translate(130, 140) rotate(25)">
    <rect x="-2" y="-30" width="4" height="60" rx="2" fill="#ec4899"/>
    <circle cx="0" cy="30" r="4" fill="#0f172a"/>
    <path d="M-2 -30 L0 -38 L2 -30 Z" fill="#db2777"/>
  </g>

  <!-- Puddles forming on the ground outside -->
  <ellipse cx="160" cy="215" rx="25" ry="5" fill="#38bdf8" opacity="0.3"/>
  <ellipse cx="200" cy="222" rx="18" ry="3" fill="#38bdf8" opacity="0.2"/>
  <!-- Ripple rings -->
  <ellipse cx="160" cy="215" rx="12" ry="2" fill="none" stroke="#90cdf4" stroke-width="1" opacity="0.6"/>
  <ellipse cx="200" cy="222" rx="8" ry="1.5" fill="none" stroke="#90cdf4" stroke-width="1" opacity="0.5"/>

</svg>