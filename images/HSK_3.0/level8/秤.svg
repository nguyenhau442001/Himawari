<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#475569"/>
  <rect x="50" y="175" width="10" height="50" rx="2" fill="#334155"/>
  <rect x="180" y="175" width="10" height="50" rx="2" fill="#334155"/>
  
  <!-- The Scale (秤) -->
  <g transform="translate(120, 145)">
    <rect x="-30" y="0" width="60" height="15" rx="2" fill="#94a3b8"/>
    <path d="M-20 0 L-30 -20 L30 -20 L20 0 Z" fill="#cbd5e1"/>
    <circle cx="0" cy="-10" r="8" fill="#fbbf24"/>
    <line x1="0" y1="-10" x2="0" y2="-25" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-25" r="3" fill="#f59e0b"/>
  </g>
  
  <!-- Fruit on scale -->
  <circle cx="120" cy="130" r="10" fill="#ec4899"/>
  
  <!-- Character -->
  <g transform="translate(80, 100)">
    <!-- Body -->
    <path d="M20 120 C20 100, 60 100, 60 120 L60 140 L20 140 Z" fill="#38bdf8"/>
    <!-- Arm reaching -->
    <path d="M60 110 L90 130" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="40" cy="90" r="20" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="33" cy="85" r="2" fill="#1e293b"/>
    <circle cx="47" cy="85" r="2" fill="#1e293b"/>
    <!-- Hair -->
    <path d="M25 80 Q40 65 55 80" stroke="#78350f" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Ambient details -->
  <circle cx="200" cy="50" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M190 40 L210 60 M210 40 L190 60" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  
  <rect x="20" y="20" width="40" height="40" rx="8" fill="#10b981" opacity="0.2"/>
</svg>