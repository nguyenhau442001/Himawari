<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Tea/Hosting Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="woodTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="120" r="110" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Interior Wall & Window Details -->
  <!-- Background Wall Art Frame -->
  <rect x="25" y="40" width="45" height="55" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="30" y="45" width="35" height="45" rx="2" fill="#1e293b" opacity="0.8"/>
  <circle cx="47" cy="62" r="8" fill="#f59e0b" opacity="0.4"/>
  <path d="M 37 80 Q 47 70 57 80" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Warm Hanging Lamp -->
  <path d="M 120 0 L 120 40" stroke="#64748b" stroke-width="2"/>
  <path d="M 100 40 L 140 40 L 145 50 L 95 50 Z" fill="#cbd5e1"/>
  <circle cx="120" cy="53" r="6" fill="#fef08a"/>

  <!-- Dining Table Surface -->
  <path d="M 10 170 L 230 170 L 220 220 L 20 220 Z" fill="url(#woodTable)"/>
  <path d="M 10 170 L 230 170" stroke="#475569" stroke-width="3"/>

  <!-- Tea Set / Props on Table -->
  <!-- Teapot -->
  <path d="M 110 150 Q 120 135 130 150 Z" fill="#38bdf8"/>
  <ellipse cx="120" cy="150" rx="14" ry="6" fill="#0ea5e9"/>
  <path d="M 103 155 Q 98 150 105 145" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 134 148 Q 142 145 138 155" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Tea Cups -->
  <rect x="145" y="152" width="12" height="10" rx="2" fill="#f8fafc"/>
  <rect x="80" y="152" width="12" height="10" rx="2" fill="#f8fafc"/>
  <ellipse cx="151" cy="152" rx="6" ry="2" fill="#bae6fd"/>
  <ellipse cx="86" cy="152" rx="6" ry="2" fill="#bae6fd"/>

  <!-- Fruit Plate / Snacks -->
  <ellipse cx="120" cy="162" rx="18" ry="5" fill="#cbd5e1"/>
  <circle cx="115" cy="159" r="4" fill="#fb923c"/>
  <circle cx="125" cy="159" r="4.5" fill="#ef4444"/>

  <!-- CHARACTER 1: The Host (Welcoming, Attentive, Warm) -->
  <!-- Body/Torso -->
  <path d="M 185 220 L 180 165 C 180 155 195 150 205 160 L 215 220 Z" fill="#0284c7"/>
  <!-- Host Head -->
  <circle cx="200" cy="135" r="16" fill="#fde047"/>
  <!-- Host Hair -->
  <path d="M 185 130 C 185 120 215 120 215 135 C 205 130 195 130 185 130 Z" fill="#334155"/>
  <!-- Host Friendly Expression (Smiling eyes, open smile) -->
  <path d="M 194 133 Q 197 130 200 133" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 203 133 Q 206 130 209 133" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 198 138 Q 201 142 204 138" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Host Arm Reaching Out (Welcoming gesture) -->
  <path d="M 190 160 Q 170 150 160 165" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Host Hand holding tray/cup -->
  <circle cx="157" cy="166" r="4" fill="#fde047"/>

  <!-- CHARACTER 2: The Guest (Respected, Well-treated, Relaxed) -->
  <!-- Body/Torso -->
  <path d="M 55 220 L 60 165 C 60 155 45 150 35 160 L 25 220 Z" fill="#10b981"/>
  <!-- Guest Head -->
  <circle cx="40" cy="135" r="16" fill="#fde047"/>
  <!-- Guest Hair -->
  <path d="M 25 133 C 25 120 55 120 55 133 C 45 128 35 128 25 133 Z" fill="#1e293b"/>
  <!-- Guest Content Expression -->
  <path d="M 33 134 Q 36 131 39 134" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 41 134 Q 44 131 47 134" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 38 139 Q 40 141 42 139" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Guest Relaxed Arm -->
  <path d="M 50 165 Q 65 170 75 160" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Visual Accent: Warm hospitality sparkles / hearts representing "attentive care" (no text) -->
  <path d="M 120 90 Q 124 83 130 87 Q 136 83 140 90 Q 130 102 120 90 Z" fill="#f43f5e" opacity="0.8"/>
  <path d="M 85 105 Q 88 100 92 103 Q 96 100 99 105 Q 92 113 85 105 Z" fill="#f43f5e" opacity="0.5"/>
  <circle cx="155" cy="115" r="3" fill="#fbbf24"/>
  <circle cx="75" cy="85" r="2.5" fill="#fbbf24"/>
</svg>