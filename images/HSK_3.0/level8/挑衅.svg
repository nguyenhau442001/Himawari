<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Accent for Depth -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="50" fill="none" stroke="#252A34" stroke-width="1.5"/>

  <!-- Conceptual Object: A stylized megaphone emitting aggressive/challenging soundwaves -->
  <!-- Soundwaves / Provocation aura (Left/Back) -->
  <path d="M 65 95 C 55 105, 55 135, 65 145" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 80 C 35 95, 35 145, 50 160" fill="none" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Megaphone Body -->
  <g transform="translate(120, 120) rotate(-25) translate(-120, -120)">
    <!-- Handle -->
    <path d="M 95 145 L 85 175 C 83 180, 88 185, 93 183 L 108 173 Z" fill="#3A4252"/>
    
    <!-- Main Cone Outer -->
    <path d="M 90 95 L 165 75 C 172 73, 178 79, 176 86 L 155 160 C 153 167, 145 171, 139 166 L 90 120 Z" fill="#2E3646"/>
    
    <!-- Main Cone Inner / Highlight -->
    <path d="M 95 102 L 158 85 C 163 84, 166 88, 165 93 L 148 150 C 147 154, 142 156, 138 153 L 95 115 Z" fill="#3D4A5E"/>

    <!-- Megaphone Speaker Opening (Dark Depth) -->
    <ellipse cx="160" cy="120" rx="8" ry="38" fill="#1A1D24" transform="rotate(15 160 120)"/>
    <ellipse cx="160" cy="120" rx="5" ry="32" fill="#FF5722" transform="rotate(15 160 120)"/>

    <!-- Grip Ring / Accent -->
    <rect x="92" y="105" width="12" height="30" rx="3" fill="#FFC107" transform="rotate(15 98 120)"/>
  </g>

  <!-- Provocation Energy Spark / Lightning Bolt (Symbolizing sharp, provoking words) -->
  <g transform="translate(145, 60) rotate(15)">
    <polygon points="12,0 0,16 9,16 4,28 22,10 12,10" fill="#FFC107"/>
  </g>
  <g transform="translate(45, 135) rotate(-30) scale(0.6)">
    <polygon points="12,0 0,16 9,16 4,28 22,10 12,10" fill="#FFC107" opacity="0.8"/>
  </g>

  <!-- Dynamic Accent Dots -->
  <circle cx="185" cy="80" r="3" fill="#FF5722"/>
  <circle cx="195" cy="95" r="2" fill="#FFC107"/>
  <circle cx="170" cy="50" r="2.5" fill="#FF5722"/>
</svg>