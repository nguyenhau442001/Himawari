<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "反响" (tiếng vang, phản hồi / echoes, public response) -->
  <g transform="translate(120, 120)">
    <!-- Expanding sound waves / ripples representing "tiếng vang" / "phản hồi" spreading outward -->
    <!-- Outer wave -->
    <path d="M -75 -40 A 85 85 0 0 1 75 -40" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M -75 40 A 85 85 0 0 0 75 40" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Middle wave with accent color (warm orange/gold for focus) -->
    <path d="M -55 -30 A 62 62 0 0 1 55 -30" fill="none" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -55 30 A 62 62 0 0 0 55 30" fill="none" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Inner wave -->
    <path d="M -35 -20 A 40 40 0 0 1 35 -20" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    <path d="M -35 20 A 40 40 0 0 0 35 20" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>

    <!-- Central physical object: A classic, sleek megaphone / speaker emitting sound waves to represent broadcasted message and widespread reaction -->
    <!-- Megaphone body (angled) -->
    <g transform="rotate(-25)">
      <!-- Handle -->
      <rect x="-8" y="10" width="8" height="20" rx="4" fill="#4A5568"/>
      <path d="M -8 18 L -16 24 C -18 25 -16 28 -14 28 L -4 28" fill="none" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>

      <!-- Main cone -->
      <path d="M -15 -14 L 15 -24 L 20 24 L -15 14 Z" fill="#2B6CB0"/>
      
      <!-- Cone opening ring / rim -->
      <ellipse cx="17" cy="0" rx="4" ry="24" fill="#3182CE"/>
      
      <!-- Cone backing -->
      <ellipse cx="-15" cy="0" rx="3" ry="14" fill="#1A365D"/>

      <!-- Inner shine on body -->
      <path d="M -5 -8 L 5 -12 L 8 10 L -5 6 Z" fill="#4299E1" opacity="0.3"/>
    </g>

    <!-- Radiating impact dots / sparks symbolizing intense public reaction ("nhiệt liệt") -->
    <circle cx="70" cy="-55" r="3.5" fill="#F6AD55"/>
    <circle cx="85" cy="-20" r="2.5" fill="#ED8936"/>
    <circle cx="65" cy="45" r="3" fill="#F6AD55"/>
    <circle cx="-70" cy="-60" r="2" fill="#CBD5E0"/>
    <circle cx="-80" cy="30" r="3" fill="#ED8936"/>
    <circle cx="-50" cy="70" r="2.5" fill="#CBD5E0"/>
  </g>
</svg>