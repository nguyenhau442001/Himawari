<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Meeting Room -->
    <radialGradient id="meeting-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Bedside Glow for Sick Character -->
    <radialGradient id="bed-glow" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Path for Split View -->
    <clipPath id="meeting-clip">
      <rect x="120" y="0" width="120" height="240"/>
    </clipPath>
    <clipPath id="bed-clip">
      <rect x="0" y="0" width="120" height="240"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ==================== LEFT SIDE: SICK CHARACTER AT HOME ==================== -->
  <g clip-path="url(#bed-clip)">
    <rect x="0" y="0" width="120" height="240" fill="#111827"/>
    <rect x="0" y="0" width="120" height="240" fill="url(#bed-glow)"/>

    <!-- Wallpaper detail -->
    <path d="M0 60 H120 M0 120 H120 M0 180 H120" stroke="#1f2937" stroke-width="1"/>

    <!-- Bed and Pillow -->
    <rect x="15" y="140" width="90" height="70" rx="10" fill="#374151"/>
    <rect x="25" y="130" width="35" height="25" rx="8" fill="#e2e8f0"/>

    <!-- Sick Character in Bed under blanket -->
    <path d="M25 180 Q60 160 95 180 L100 210 H20 Z" fill="#3b82f6"/>
    <!-- Head resting -->
    <circle cx="45" cy="140" r="16" fill="#fbcfe8"/>
    <!-- Closed eyes / sleeping expression -->
    <path d="M40 138 Q43 142 46 138" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M48 138 Q51 142 54 138" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Fever ice pack on forehead -->
    <rect x="35" y="126" width="22" height="10" rx="3" fill="#38bdf8"/>

    <!-- Bedside Table -->
    <rect x="85" y="150" width="25" height="40" rx="3" fill="#1f2937"/>
    <!-- Thermometer / Medicine Cup -->
    <circle cx="97" cy="144" r="4" fill="#10b981"/>
    <rect x="95" y="148" width="4" height="6" fill="#cbd5e1"/>
    
    <!-- Floating 'sick' / fever symbol (abstract minimal representation, no text) -->
    <path d="M75 110 Q80 100 75 90 T75 70" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- ==================== RIGHT SIDE: THE MEETING / CONFERENCE ==================== -->
  <g clip-path="url(#meeting-clip)">
    <rect x="120" y="0" width="120" height="240" fill="#0f172a"/>
    <rect x="120" y="0" width="120" height="240" fill="url(#meeting-glow)"/>

    <!-- Conference Room Wall & Presentation Screen -->
    <rect x="135" y="30" width="90" height="60" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Presentation graphics (Bar chart & line) -->
    <rect x="145" y="55" width="10" height="25" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="160" y="45" width="10" height="35" rx="2" fill="#3b82f6" opacity="0.8"/>
    <rect x="175" y="60" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.7"/>
    <path d="M145 70 L165 50 L185 55 L205 40" stroke="#10b981" stroke-width="2" fill="none"/>

    <!-- Large Conference Table -->
    <path d="M130 180 L230 180 L215 210 L145 210 Z" fill="#334155"/>
    <ellipse cx="180" cy="180" rx="50" ry="12" fill="#475569"/>

    <!-- Empty Chair at the Front/Center representing Absence -->
    <g transform="translate(165, 140)">
      <rect x="8" y="15" width="14" height="20" rx="3" fill="#1e293b"/>
      <rect x="5" y="5" width="20" height="14" rx="4" fill="#64748b"/>
      <!-- Glowing Red / Warning Indicator hovering over empty chair (Absentee highlight) -->
      <circle cx="15" cy="-5" r="8" fill="#ef4444" opacity="0.9"/>
      <path d="M11 -9 L19 -1 M19 -9 L11 -1" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Colleague 1 (Listening attentively) -->
    <g transform="translate(125, 120)">
      <circle cx="15" cy="15" r="10" fill="#fbcfe8"/>
      <path d="M5 40 C5 28 25 28 25 40 Z" fill="#10b981"/>
      <rect x="10" y="25" width="10" height="8" rx="2" fill="#047857"/>
    </g>

    <!-- Colleague 2 (Taking notes) -->
    <g transform="translate(200, 130)">
      <circle cx="15" cy="15" r="10" fill="#fed7aa"/>
      <path d="M5 40 C5 28 25 28 25 40 Z" fill="#6366f1"/>
      <!-- Laptop / Notepad -->
      <rect x="5" y="32" width="18" height="10" rx="1" fill="#cbd5e1"/>
    </g>

    <!-- Laptops & Coffee on Table -->
    <rect x="140" y="175" width="14" height="8" rx="1" fill="#94a3b8"/>
    <circle cx="210" cy="178" r="3" fill="#cbd5e1"/>
  </g>

  <!-- ==================== DIVIDER & ACCENTS ==================== -->
  <!-- Clean vertical divider line between home (sick) and office (meeting) -->
  <line x1="120" y1="0" x2="120" y2="240" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Subtle connection bridge icon in the middle (optional stylistic touch) -->
  <circle cx="120" cy="120" r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
  <path d="M112 120 H128 M120 112 V128" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer frame stroke -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>