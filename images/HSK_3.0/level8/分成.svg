<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Dividing line / arrow indication -->
  <g opacity="0.3" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round">
    <line x1="120" y1="50" x2="120" y2="190"/>
  </g>

  <!-- Left Group (2 human figures representing "两组") -->
  <g transform="translate(55, 120)">
    <!-- Person 1 -->
    <g transform="translate(-25, 0)">
      <circle cx="0" cy="-35" r="14" fill="#3498DB"/>
      <path d="M-18,-12 C-18,-24 18,-24 18,-12 L22,35 C22,40 18,44 12,44 L-12,44 C-18,44 -22,40 -22,35 Z" fill="#2980B9"/>
    </g>
    <!-- Person 2 -->
    <g transform="translate(15, 10)">
      <circle cx="0" cy="-35" r="12" fill="#5DADE2"/>
      <path d="M-15,-12 C-15,-22 15,-22 15,-12 L19,30 C19,35 15,38 10,38 L-10,38 C-15,38 -19,35 -19,30 Z" fill="#3498DB"/>
    </g>
    <!-- Group bracket / badge -->
    <rect x="-42" y="-60" width="76" height="116" rx="12" fill="none" stroke="#3498DB" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>

  <!-- Right Group (2 human figures representing the other half of "分成两组") -->
  <g transform="translate(185, 120)">
    <!-- Person 3 -->
    <g transform="translate(-15, 10)">
      <circle cx="0" cy="-35" r="12" fill="#F39C12"/>
      <path d="M-15,-12 C-15,-22 15,-22 15,-12 L19,30 C19,35 15,38 10,38 L-10,38 C-15,38 -19,35 -19,30 Z" fill="#D68910"/>
    </g>
    <!-- Person 4 -->
    <g transform="translate(25, 0)">
      <circle cx="0" cy="-35" r="14" fill="#F1C40F"/>
      <path d="M-18,-12 C-18,-24 18,-24 18,-12 L22,35 C22,40 18,44 12,44 L-12,44 C-18,44 -22,40 -22,35 Z" fill="#F39C12"/>
    </g>
    <!-- Group bracket / badge -->
    <rect x="-34" y="-60" width="76" height="116" rx="12" fill="none" stroke="#F1C40F" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>

  <!-- Central splitting action indicator (Dynamic arrows pointing outward) -->
  <g fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 105 50 L 90 50 L 90 50 L 98 42"/>
    <path d="M 90 50 L 98 58"/>
    
    <path d="M 135 50 L 150 50 L 142 42"/>
    <path d="M 150 50 L 142 58"/>
  </g>
</svg>