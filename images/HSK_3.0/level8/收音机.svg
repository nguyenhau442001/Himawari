<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow / Sound wave background hints -->
  <path d="M 60 120 C 60 90, 80 75, 120 75 C 160 75, 180 90, 180 120" stroke="#2D333F" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 45 120 C 45 80, 75 60, 120 60 C 165 60, 195 80, 195 120" stroke="#2D333F" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 6"/>

  <!-- Radio Body -->
  <rect x="52" y="88" width="136" height="92" rx="16" fill="#242933"/>
  
  <!-- Speaker Mesh Area (Left) -->
  <rect x="68" y="104" width="48" height="60" rx="8" fill="#1A1D24"/>
  <!-- Speaker Dots -->
  <circle cx="80" cy="118" r="2" fill="#3E4553"/>
  <circle cx="92" cy="118" r="2" fill="#3E4553"/>
  <circle cx="104" cy="118" r="2" fill="#3E4553"/>
  <circle cx="80" cy="134" r="2" fill="#3E4553"/>
  <circle cx="92" cy="134" r="2" fill="#3E4553"/>
  <circle cx="104" cy="134" r="2" fill="#3E4553"/>
  <circle cx="80" cy="150" r="2" fill="#3E4553"/>
  <circle cx="92" cy="150" r="2" fill="#3E4553"/>
  <circle cx="104" cy="150" r="2" fill="#3E4553"/>

  <!-- Display Panel & Controls (Right) -->
  <rect x="128" y="104" width="44" height="28" rx="6" fill="#1A1D24"/>
  <!-- Tuning Dial Needle/Line -->
  <line x1="144" y1="110" x2="144" y2="126" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Frequency ticks -->
  <line x1="134" y1="120" x2="138" y2="120" stroke="#4E596D" stroke-width="1.5"/>
  <line x1="154" y1="120" x2="158" y2="120" stroke="#4E596D" stroke-width="1.5"/>
  <line x1="164" y1="120" x2="168" y2="120" stroke="#4E596D" stroke-width="1.5"/>

  <!-- Knobs -->
  <circle cx="140" cy="154" r="8" fill="#303742"/>
  <circle cx="140" cy="154" r="5" fill="#1A1D24"/>
  <circle cx="164" cy="154" r="8" fill="#303742"/>
  <circle cx="164" cy="154" r="5" fill="#1A1D24"/>

  <!-- Antenna Base -->
  <circle cx="156" cy="88" r="4" fill="#E5EDF8"/>
  <!-- Telescopic Antenna (Angled) -->
  <line x1="156" y1="88" x2="192" y2="44" stroke="#E5EDF8" stroke-width="4" stroke-linecap="round"/>
  <!-- Antenna segments/highlights -->
  <line x1="166" y1="76" x2="182" y2="56" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>

  <!-- Accent Handle / Top Bar -->
  <path d="M 84 88 L 84 80 C 84 74, 89 70, 95 70 L 145 70 C 151 70, 156 74, 156 80 L 156 88" fill="none" stroke="#3E4553" stroke-width="4" stroke-linecap="round"/>

  <!-- Sound Waves Emanating (Focus Accent) -->
  <path d="M 198 104 C 206 112, 206 128, 198 136" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 206 94 C 218 106, 218 134, 206 146" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Sound Waves Left (Balance) -->
  <path d="M 42 104 C 34 112, 34 128, 42 136" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>