<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Kitchen Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Character: Person peeling egg -->
  <g transform="translate(60, 60)">
    <circle cx="60" cy="40" r="25" fill="#fde68a"/>
    <path d="M45 65 Q60 80 75 65" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <rect x="50" y="90" width="20" height="60" rx="5" fill="#38bdf8"/>
    <path d="M40 100 L50 120 M80 100 L70 120" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- The Egg Scene -->
  <g transform="translate(140, 120)">
    <!-- Cracked Egg Shell -->
    <path d="M-20 -40 A30 40 0 0 1 40 -40 L40 20 A30 40 0 0 1 -20 20 Z" fill="#f8fafc"/>
    <!-- The Membrane (The focus) -->
    <path d="M-18 -35 A28 38 0 0 1 38 -35 L38 -25 A28 38 0 0 1 -18 -25 Z" fill="#ec4899" opacity="0.6"/>
    <!-- Egg Yolk/White visible -->
    <ellipse cx="10" cy="0" rx="20" ry="25" fill="#fbbf24"/>
    <circle cx="10" cy="0" r="10" fill="#f59e0b"/>
  </g>

  <!-- Decorative Kitchen Elements -->
  <circle cx="30" cy="200" r="15" fill="#fb923c" opacity="0.3"/>
  <path d="M200 30 L220 50 M220 30 L200 50" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Focus highlight -->
  <circle cx="150" cy="100" r="40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
</svg>