<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements / Office room -->
  <rect x="25" y="40" width="190" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Window showing night/evening city lights outside -->
  <rect x="145" y="55" width="55" height="50" rx="3" fill="#0f172a" />
  <path d="M145 80H200M172.5 55V105" stroke="#334155" stroke-width="1.5" />
  <!-- City lights in window -->
  <circle cx="155" cy="70" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="185" cy="65" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="165" cy="90" r="1" fill="#f43f5e" opacity="0.5" />
  <circle cx="190" cy="95" r="1.5" fill="#fbbf24" opacity="0.8" />

  <!-- Wall shelf and books -->
  <path d="M35 75H115" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <rect x="45" y="55" width="10" height="20" rx="1" fill="#38bdf8" />
  <rect x="57" y="52" width="8" height="23" rx="1" fill="#f43f5e" />
  <rect x="67" y="58" width="14" height="17" rx="1" fill="#10b981" />

  <!-- Desk Lamp & Glow -->
  <circle cx="55" cy="95" r="35" fill="url(#lampGlow)" />
  <path d="M50 125H60" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M55 125V100L40 85" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M35 85H45L40 75Z" fill="#fbbf24" />

  <!-- Desk Surface -->
  <path d="M15 160H225V170C225 175.5 220.5 180 215 180H25C19.5 180 15 175.5 15 170V160Z" fill="url(#deskGrad)" />
  <rect x="15" y="157" width="210" height="4" fill="#475569" rx="1" />

  <!-- Workspace props -->
  <rect x="175" y="135" width="22" height="25" rx="3" fill="#cbd5e1" />
  <path d="M181 135V132C181 130.3 182.3 129 184 129H193C194.6 129 196 130.3 196 132V135" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <path d="M178 142H194" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Half-eaten lunch box / cold food causing the acute stomach ache -->
  <rect x="135" y="140" width="30" height="20" rx="3" fill="#e2e8f0" />
  <path d="M140 146H160" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  <circle cx="155" cy="153" r="3" fill="#10b981" />

  <!-- Character / Man experiencing severe acute stomach pain -->
  <!-- Chair Back -->
  <path d="M80 160V105C80 102.2 82.2 100 85 100H105C107.8 100 110 102.2 110 105V160" fill="#334155" />
  <rect x="88" y="110" width="14" height="35" rx="2" fill="#475569" opacity="0.5" />

  <!-- Character Body (Leaning forward in acute pain) -->
  <!-- Torso & Shirt -->
  <path d="M90 120C95 115 115 110 135 125C145 133 140 150 130 160H90C85 150 85 130 90 120Z" fill="#38bdf8" />
  
  <!-- Arms clutching stomach acutely -->
  <!-- Left arm -->
  <path d="M125 125C125 125 120 140 105 142C95 143 90 138 90 138" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Right arm clutching abdomen -->
  <path d="M105 125C105 125 115 140 125 142C130 143 135 138 135 138" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Hands clenched on stomach -->
  <circle cx="115" cy="142" r="6" fill="#fcd34d" />

  <!-- Head tilted down in pain, sweat drops indicating acute severity -->
  <path d="M110 95C118 95 124 102 122 110C120 118 112 122 105 120C98 118 96 110 98 102C100 97 105 95 110 95Z" fill="#fcd34d" />
  
  <!-- Hair -->
  <path d="M97 105C97 98 102 93 110 93C118 93 123 98 123 105C123 105 118 101 110 101C102 101 97 105 97 105Z" fill="#1e293b" />
  
  <!-- Facial expression: painful grimace, closed eyes, clenched teeth -->
  <path d="M102 108L108 111M115 108L121 111" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Grimacing mouth -->
  <path d="M108 118H116" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M109 116H115" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Sweat drops (acute illness indicator) -->
  <path d="M124 104C124 104 128 108 128 111C128 113 126 115 124 115C122 115 120 113 120 111C120 108 124 104 124 104Z" fill="#38bdf8" opacity="0.8" />
  <path d="M95 108C95 108 92 111 92 113C92 114 93 115 94 115C95 115 96 114 96 113C96 111 95 108 95 108Z" fill="#38bdf8" opacity="0.8" />

  <!-- Pain waves / visual pulse lines radiating from abdomen -->
  <path d="M100 135C95 130 95 125 100 120" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M130 135C135 130 135 125 130 120" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Foreground plant providing visual frame -->
  <path d="M10 240V210C10 195 22 185 35 185C35 185 30 210 20 240Z" fill="#059669" />
  <path d="M25 240V195C25 180 38 170 50 170C50 170 42 200 30 240Z" fill="#10b981" />
</svg>