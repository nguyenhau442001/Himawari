<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Night sky / Background upper -->
  <path d="M0 0H240V120H0V0Z" fill="#15181E"/>
  
  <!-- Raging river water (background side) -->
  <path d="M0 120H240V240H0V120Z" fill="#121D2F"/>
  
  <!-- Dynamic rushing water waves / current -->
  <path d="M10 160C30 150 50 170 70 160C90 150 110 170 130 160C150 150 170 170 190 160C210 150 220 165 230 160" stroke="#2563EB" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M20 190C40 180 60 200 80 190C100 180 120 200 140 190C160 180 180 200 200 190C215 182 225 195 235 190" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M0 215C25 205 45 225 70 215C95 205 115 225 140 215C165 205 185 225 210 215C225 209 235 218 240 215" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Splashing water against the dike -->
  <path d="M120 155C125 140 135 125 145 115" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M135 165C142 150 155 135 168 125" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="150" cy="110" r="2.5" fill="#93C5FD"/>
  <circle cx="172" cy="120" r="2" fill="#93C5FD"/>
  <circle cx="130" cy="135" r="2" fill="#93C5FD"/>

  <!-- The Dike / Embankment (con đê) - Sleek modern flat design vector -->
  <!-- Base slope of the dike -->
  <path d="M60 210L190 80H240V210H60Z" fill="#334155"/>
  <path d="M80 210L195 95H240V210H80Z" fill="#1E293B"/>

  <!-- Main dike body with graded slope -->
  <path d="M70 210L185 85H220V210H70Z" fill="#475569"/>
  
  <!-- Dike top flat surface -->
  <path d="M170 85H220V95H170V85Z" fill="#64748B"/>

  <!-- Concrete / Stone reinforcement blocks pattern on the dike -->
  <!-- Row 1 -->
  <line x1="100" y1="210" x2="160" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="210" x2="180" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="140" y1="210" x2="200" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="210" x2="215" y2="155" stroke="#334155" stroke-width="2"/>

  <!-- Row 2 -->
  <line x1="130" y1="180" x2="190" y2="120" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="180" x2="210" y2="120" stroke="#334155" stroke-width="2"/>
  
  <!-- Grid cross lines for reinforced structure -->
  <line x1="90" y1="190" x2="150" y2="190" stroke="#334155" stroke-width="1.5"/>
  <line x1="110" y1="160" x2="170" y2="160" stroke="#334155" stroke-width="1.5"/>
  <line x1="130" y1="130" x2="190" y2="130" stroke="#334155" stroke-width="1.5"/>
  <line x1="150" y1="105" x2="210" y2="105" stroke="#334155" stroke-width="1.5"/>

  <!-- Flood water level indicator / High contrast edge against water -->
  <path d="M70 210L185 85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

  <!-- Small green trees/vegetation on the dry side of the dike for scale & modern flat aesthetics -->
  <circle cx="205" cy="89" r="4" fill="#10B981"/>
  <circle cx="185" cy="89" r="3" fill="#059669"/>
  <circle cx="195" cy="88" r="5" fill="#34D399"/>

  <!-- Atmospheric lighting accent (Orange/Gold focus) -->
  <circle cx="50" cy="50" r="30" fill="#F59E0B" opacity="0.1" filter="blur(10px)"/>
</svg>