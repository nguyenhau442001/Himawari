<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" rx="24" fill="#1A1D24"/>
<g transform="translate(40, 60)">
  <!-- Kitchen Counter -->
  <rect x="0" y="100" width="160" height="20" rx="4" fill="#343A46"/>
  
  <!-- Main Chef (Mother) -->
  <g transform="translate(90, 0)">
    <circle cx="20" cy="20" r="15" fill="#FFC107"/>
    <path d="M5 40 Q20 35 35 40 L30 80 L10 80 Z" fill="#FFC107"/>
    <path d="M15 50 L25 50" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Assistant (The Helper) -->
  <g transform="translate(20, 20)">
    <circle cx="20" cy="20" r="12" fill="#4CAF50"/>
    <path d="M8 40 Q20 35 32 40 L28 80 L12 80 Z" fill="#4CAF50"/>
    <!-- Hands holding a bowl to assist -->
    <path d="M25 60 A10 10 0 0 1 45 60" fill="none" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
    <rect x="25" y="55" width="20" height="10" rx="2" fill="#FFC107"/>
  </g>

  <!-- Cooking Pot -->
  <circle cx="110" cy="90" r="15" fill="#E0E0E0"/>
  <path d="M100 80 L120 80" stroke="#BDBDBD" stroke-width="4"/>
</g>
</svg>