<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <clipPath id="screen-clip">
      <rect x="75" y="70" width="90" height="60" rx="4" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light / Window / Glow -->
  <circle cx="120" cy="100" r="80" fill="url(#lamp-glow)" />

  <!-- Background Environment (Studio / Room) -->
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="2" />
  
  <!-- Desk Surface -->
  <path d="M20 185 L220 185 L230 215 L10 215 Z" fill="url(#desk-grad)" />
  <path d="M20 185 L220 185" stroke="#475569" stroke-width="2" />

  <!-- Computer Setup & Broken/Deleted Project Scene -->
  <!-- Monitor Stand -->
  <rect x="110" y="130" width="20" height="25" fill="#475569" />
  <rect x="95" y="152" width="50" height="6" rx="3" fill="#64748b" />

  <!-- Monitor Frame -->
  <rect x="70" y="65" width="100" height="70" rx="8" fill="#334155" />
  <rect x="74" y="69" width="92" height="62" rx="4" fill="#0f172a" />

  <!-- Screen Content: "Error / Crash / Reset state" -->
  <g clip-path="url(#screen-clip)">
    <!-- Warning Icon Graphic -->
    <polygon points="120,82 145,118 95,118" fill="#fbbf24" />
    <circle cx="120" cy="110" r="4" fill="#0f172a" />
    <rect x="118" y="94" width="4" height="10" rx="2" fill="#0f172a" />
    <!-- Coding / Design lines broken -->
    <line x1="85" y1="85" x2="105" y2="85" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="85" y1="95" x2="100" y2="95" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <!-- Glitch accent -->
    <rect x="80" y="123" width="80" height="3" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Coffee Mug (Prop) -->
  <rect x="180" y="160" width="16" height="20" rx="2" fill="#cbd5e1" />
  <path d="M196 166 C202 166 202 176 196 176" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Steam from coffee -->
  <path d="M185 152 C187 148 183 144 185 140" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Desk Lamp (Prop) -->
  <path d="M195 185 L205 120 L215 120" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M200 115 L220 115 L215 125 L205 125 Z" fill="#f59e0b" />

  <!-- Character: Determined / Reassuring (The "No big deal, let's do it again" pose) -->
  <!-- Character Body / Torso -->
  <path d="M100 215 C100 185 110 175 120 175 C130 175 140 185 140 215 Z" fill="#38bdf8" />
  <!-- Hoodie pocket & details -->
  <path d="M110 200 L130 200 L125 215 L115 215 Z" fill="#0284c7" />

  <!-- Character Neck & Head -->
  <rect x="113" y="160" width="14" height="20" fill="#fbcfe8" />
  <!-- Head Base -->
  <circle cx="120" cy="145" r="22" fill="#ffedd5" />

  <!-- Hair Style -->
  <path d="M98 145 C98 125 142 125 142 145 C142 150 138 145 135 140 C125 130 115 130 105 140 C102 145 98 150 98 145 Z" fill="#1e293b" />

  <!-- Face Expression: Confident Smile, Winking/Determined Eyes -->
  <!-- Eyebrows (Determined angle) -->
  <line x1="107" y1="140" x2="117" y2="142" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <line x1="123" y1="142" x2="133" y2="140" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes: Cheerful squint / confident -->
  <path d="M108 147 Q112 151 116 147" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M124 147 Q128 151 132 147" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Confident Grin -->
  <path d="M114 157 Q120 163 126 157" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Rosy Cheeks -->
  <circle cx="106" cy="154" r="3" fill="#fca5a5" opacity="0.6" />
  <circle cx="134" cy="154" r="3" fill="#fca5a5" opacity="0.6" />

  <!-- Arms / Gestures: Rolling up sleeves, ready to restart -->
  <!-- Left Arm (bent, hand near chin or flexing) -->
  <path d="M100 180 L85 195 L95 205" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="95" cy="205" r="6" fill="#ffedd5" />

  <!-- Right Arm (Raised forward, thumb up or confident fist action) -->
  <path d="M140 180 L160 170 L155 155" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="155" cy="155" r="6" fill="#ffedd5" />

  <!-- Action/Energy Sparks (Visualizing "Let's do it again / Fresh start") -->
  <path d="M40 90 L50 95 L40 100" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="55" cy="80" r="3" fill="#38bdf8" />
  <circle cx="35" cy="130" r="2" fill="#10b981" />
  
  <!-- Refresh / Restart Arrow Motif (Abstract representation of re-doing) -->
  <path d="M195 90 C205 90 215 100 215 115 C215 130 200 140 185 135" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" />
  <polygon points="185,125 180,135 193,137" fill="#10b981" />

</svg>