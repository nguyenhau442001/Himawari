<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: stylized crate/boxes and drooping stems to match context -->
  <g opacity="0.15">
    <!-- Crate outline -->
    <rect x="35" y="140" width="60" height="45" rx="4" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="35" y1="155" x2="95" y2="155" stroke="#F59E0B" stroke-width="2"/>
    <!-- Unsold pile line -->
    <path d="M45 140 Q 65 125 85 140" fill="none" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Motion lines / worry aura over the character's head -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M120 45 Q 125 35 130 45" fill="none"/>
    <path d="M138 50 Q 145 42 148 53" fill="none"/>
    <path d="M102 50 Q 95 42 92 53" fill="none"/>
  </g>

  <!-- Drooping heavy sigh element -->
  <path d="M140 105 Q 155 110 152 125" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Character (Farmer / Producer experiencing '犯愁' - action verb context: looking down, hand on head/chin, furrowed posture) -->
  <g transform="translate(0, 5)">
    <!-- Body / Shoulders slumped forward -->
    <path d="M 85 165 C 85 140, 105 135, 120 135 C 135 135, 155 140, 155 165 L 170 195 C 170 198, 168 200, 165 200 L 75 200 C 72 200, 70 198, 70 195 Z" fill="#2563EB"/>

    <!-- Head & Face turned slightly downward -->
    <circle cx="120" cy="100" r="22" fill="#E2E8F0"/>
    
    <!-- Straw hat / Worker hat tilted forward (defining agricultural/hard-working context) -->
    <path d="M 90 90 Q 120 75 150 90 L 140 82 Q 120 78 100 82 Z" fill="#D97706"/>
    <ellipse cx="120" cy="85" rx="32" ry="8" fill="#F59E0B"/>

    <!-- Action: Hand resting on forehead / touching temple (signifying deep thought and worry) -->
    <!-- Arm -->
    <path d="M 100 135 C 105 120, 110 112, 122 108" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand on head -->
    <circle cx="125" cy="103" r="6" fill="#E2E8F0"/>

    <!-- Downcast facial expression lines (closed worried eyes) -->
    <path d="M 112 100 L 118 102" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Slight frown mouth -->
    <path d="M 116 114 Q 120 111 124 114" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground focal element: Unsold agricultural produce (e.g. fresh crop/tomato or basket with stacked goods) sitting heavy -->
  <g transform="translate(145, 135)">
    <!-- Wooden basket base -->
    <path d="M 10 35 L 20 65 L 60 65 L 70 35 Z" fill="#B45309"/>
    <path d="M 8 35 L 72 35 L 68 30 L 12 30 Z" fill="#D97706"/>
    <!-- Produce spilling out / piled up -->
    <circle cx="30" cy="25" r="12" fill="#EF4444"/>
    <circle cx="48" cy="23" r="14" fill="#DC2626"/>
    <circle cx="40" cy="12" r="11" fill="#EF4444"/>
    <!-- Little stem highlights -->
    <path d="M 40 1 Q 42 -3 45 -1" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Direct dynamic cause indicator: Blocked pathway / stagnation arrow symbol subtly integrated -->
  <g transform="translate(30, 110)" opacity="0.8">
    <circle cx="20" cy="20" r="16" fill="#1E293B" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>