<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Context: Industrial Oppression Setting (Factory/Control Floor) -->
  <!-- Heavy machinery pillars and looming shadows -->
  <path d="M 0 240 L 0 80 L 40 100 L 40 240 Z" fill="#090d16" />
  <path d="M 240 240 L 240 80 L 200 100 L 200 240 Z" fill="#090d16" />
  
  <!-- Giant Ominous Claw/Gear in the Background representing 'Oppression' -->
  <g opacity="0.3" fill="#64748b">
    <circle cx="120" cy="50" r="45" />
    <circle cx="120" cy="50" r="30" fill="#0f172a" />
    <rect x="114" y="5" width="12" height="90" rx="2" />
    <rect x="75" y="44" width="90" height="12" rx="2" />
    <rect x="87" y="18" width="66" height="12" rx="2" transform="rotate(45 120 50)" />
    <rect x="87" y="18" width="66" height="12" rx="2" transform="rotate(-45 120 50)" />
  </g>

  <!-- Dramatic Overhead Light Beam (The "Oppressive" Authority Light) -->
  <polygon points="80,0 160,0 200,240 40,240" fill="url(#beamGrad)" />

  <!-- Oppressive Barrier / Wave pushing down from above -->
  <path d="M 30 110 Q 120 140 210 110 L 210 95 Q 120 125 30 95 Z" fill="#ef4444" opacity="0.8" filter="url(#glow)" />
  <!-- Falling heavy debris / chains -->
  <rect x="90" y="115" width="6" height="25" rx="3" fill="#ef4444" />
  <rect x="144" y="115" width="6" height="25" rx="3" fill="#ef4444" />

  <!-- Ground Line -->
  <rect x="0" y="225" width="240" height="15" fill="#020617" />
  <line x1="0" y1="225" x2="240" y2="225" stroke="#334155" stroke-width="2" />

  <!-- HERO CHARACTER: Brave individual standing firm against oppression (反抗) -->
  <g transform="translate(100, 135)">
    <!-- Back Foot -->
    <path d="M 15 80 L 30 80 L 30 90 L 10 90 Z" fill="#1e293b" />
    <!-- Front Foot -->
    <path d="M 25 80 L 45 80 L 45 90 L 20 90 Z" fill="#334155" />

    <!-- Legs in Stance -->
    <path d="M 20 50 L 30 85" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M 30 50 L 18 85" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />

    <!-- Torso leaning forward with determination -->
    <path d="M 12 25 L 38 30 L 32 60 L 8 55 Z" fill="url(#heroGrad)" />
    <circle cx="24" cy="42" r="6" fill="#b45309" opacity="0.4" /> <!-- Outfit detail -->

    <!-- Head determined, looking up -->
    <circle cx="22" cy="14" r="10" fill="#fde68a" />
    <!-- Heroic Hair -->
    <path d="M 12 12 Q 20 -2 32 10 L 28 16 Z" fill="#78350f" />
    <!-- Determined Face expression (brow) -->
    <line x1="18" y1="13" x2="25" y2="15" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

    <!-- Back Arm bracing -->
    <path d="M 16 30 L -2 45" stroke="#d97706" stroke-width="8" stroke-linecap="round" />

    <!-- FRONT ARM & SHIELD/BARRIER pushing UP (Active Resistance) -->
    <path d="M 32 35 L 55 15" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" />
    
    <!-- Energy Shield Block (Reflecting oppression) -->
    <g transform="translate(50, -5)">
      <path d="M 0 0 L 25 -10 L 25 35 L 0 45 Z" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
      <!-- Energy Impact ripples on shield -->
      <circle cx="12" cy="20" r="8" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.8" />
      <circle cx="12" cy="20" r="14" fill="none" stroke="#bfdbfe" stroke-width="1.5" opacity="0.5" />
    </g>
  </g>

  <!-- Sparks of Resistance / Energy Burst -->
  <g transform="translate(155, 120)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glow)" />
    <path d="M -10 -5 L 10 5" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <path d="M -5 10 L 5 -10" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="15" cy="-10" r="2.5" fill="#fbbf24" />
    <circle cx="-12" cy="15" r="2" fill="#38bdf8" />
  </g>

  <!-- Foreground Atmospheric Particles (Golden embers of hope/courage) -->
  <circle cx="60" cy="170" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="75" cy="190" r="1.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="110" cy="210" r="2.5" fill="#fbbf24" opacity="0.9" />
  <circle cx="180" cy="180" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="195" cy="150" r="1" fill="#fbbf24" opacity="0.5" />

</svg>