<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements representing water ripples / southern water towns (江南水乡) -->
  <path d="M40 185 C 70 175, 90 195, 120 185 C 150 175, 170 195, 200 185" stroke="#2A3242" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M60 200 C 80 192, 100 208, 130 200 C 160 192, 180 208, 200 200" stroke="#252C3A" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Central Physical Object: Traditional Chinese Bamboo Flute (笛子 - Dizi) representing "làn điệu / giọng điệu" (musical tune/melody) -->
  
  <!-- Sound waves / Melody flowing gracefully out of the flute -->
  <path d="M 60 90 Q 75 70, 95 90 T 130 90" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 80 65 Q 100 45, 120 65 T 160 65" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 110 45 Q 130 25, 150 45 T 190 45" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Floating musical notes representing the "làn điệu" (tune) -->
  <!-- Note 1 -->
  <circle cx="170" cy="95" r="5" fill="#F59E0B"/>
  <path d="M175 95 L175 75 L187 72 L187 87" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="182" cy="87" r="4" fill="#F59E0B"/>

  <!-- Note 2 -->
  <circle cx="95" cy="115" r="4.5" fill="#38BDF8"/>
  <path d="M99.5 115 L99.5 98 L110 95 L110 108" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="105.5" cy="108" r="3.5" fill="#38BDF8"/>

  <!-- Main Flute Body (Bamboo / Dizi) positioned diagonally -->
  <g transform="rotate(-25 120 140)">
    <!-- Flute bamboo tube -->
    <rect x="50" y="132" width="140" height="16" rx="8" fill="#10B981"/>
    
    <!-- Bamboo segments / rings -->
    <line x1="75" y1="132" x2="75" y2="148" stroke="#065F46" stroke-width="2.5"/>
    <line x1="105" y1="132" x2="105" y2="148" stroke="#065F46" stroke-width="2.5"/>
    <line x1="135" y1="132" x2="135" y2="148" stroke="#065F46" stroke-width="2.5"/>
    <line x1="165" y1="132" x2="165" y2="148" stroke="#065F46" stroke-width="2.5"/>

    <!-- Mouthpiece / Blow hole -->
    <ellipse cx="63" cy="140" rx="3" ry="2" fill="#042F2E"/>

    <!-- Membrane hole (Dimok) with red accent/seal representing traditional craft -->
    <rect x="85" y="137" width="10" height="6" rx="2" fill="#EF4444"/>

    <!-- Finger holes -->
    <circle cx="115" cy="140" r="2" fill="#042F2E"/>
    <circle cx="128" cy="140" r="2" fill="#042F2E"/>
    <circle cx="141" cy="140" r="2" fill="#042F2E"/>
    <circle cx="154" cy="140" r="2" fill="#042F2E"/>
    <circle cx="167" cy="140" r="2" fill="#042F2E"/>
  </g>

  <!-- Accent glow spots -->
  <circle cx="155" cy="70" r="2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="115" cy="50" r="1.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="85" cy="85" r="1.5" fill="#F59E0B" opacity="0.6"/>

</svg>