<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Character setup: "Cô ấy không thể che giấu sự lo lắng trong lòng" (She cannot hide her inner nervousness) -->
  <g transform="translate(0, 10)">
    <!-- Character shoulders and body -->
    <path d="M 80 185 C 80 155, 100 145, 120 145 C 140 145, 160 155, 160 185 Z" fill="#31394D"/>
    
    <!-- Neck -->
    <rect x="110" y="125" width="20" height="25" rx="8" fill="#E8B89D"/>

    <!-- Head -->
    <circle cx="120" cy="105" r="28" fill="#F4C7A5"/>

    <!-- Hair (Back/Base) -->
    <path d="M 92 105 C 92 82, 148 82, 148 105 C 148 120, 140 140, 140 140 L 100 140 C 100 140, 92 120, 92 105 Z" fill="#2C232B"/>
    <!-- Hair bangs/front -->
    <path d="M 94 100 C 100 90, 140 90, 146 100 C 135 96, 105 96, 94 100 Z" fill="#3D303C"/>

    <!-- Dynamic Nervousness Elements (Inner Heart/Anxiety visualized softly radiating) -->
    <!-- Soft glowing heartbeat/anxiety waves inside chest -->
    <circle cx="120" cy="165" r="16" fill="#F59E0B" opacity="0.15"/>
    <circle cx="120" cy="165" r="8" fill="#F59E0B" opacity="0.3"/>

    <!-- Action: Hands trying to cover/mask the face/expression, but tension leaks through -->
    <!-- Left Arm & Hand covering lower face -->
    <path d="M 90 160 C 85 145, 95 120, 105 115 C 115 110, 125 115, 125 115" fill="none" stroke="#E8B89D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Hand crossing over to mask -->
    <path d="M 150 165 C 150 145, 135 120, 120 118" fill="none" stroke="#F4C7A5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Facial expression showing strain/nervousness escaping the mask -->
    <!-- Eyes wide and alert -->
    <circle cx="112" cy="104" r="3.5" fill="#1A1D24"/>
    <circle cx="128" cy="104" r="3.5" fill="#1A1D24"/>
    <circle cx="113" cy="103" r="1" fill="#FFFFFF"/>
    <circle cx="129" cy="103" r="1" fill="#FFFFFF"/>
    
    <!-- Eyebrows tilted in inner tension -->
    <line x1="107" y1="97" x2="116" y2="99" stroke="#2C232B" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="97" x2="124" y2="99" stroke="#2C232B" stroke-width="2" stroke-linecap="round"/>

    <!-- Sweat drops / Motion lines indicating active suppression/action of hiding -->
    <path d="M 88 95 Q 84 90, 88 85" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 152 95 Q 156 90, 152 85" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Action motion lines emphasizing the tense gesture of "掩饰" (masking/concealing) -->
    <path d="M 98 128 L 92 122" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 142 128 L 148 122" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>