<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for elite atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#FFB800" opacity="0.05"/>

  <!-- Character / Tycoon representation (富豪 - Noun) -->
  <g transform="translate(0, 5)">
    <!-- Shoulders and Suit Body -->
    <path d="M 80 185 L 80 160 C 80 145 95 135 120 135 C 145 135 160 145 160 160 L 160 185 Z" fill="#2D323F"/>
    
    <!-- Crisp White Shirt Collar -->
    <polygon points="105,135 120,155 135,135" fill="#FFFFFF"/>
    
    <!-- Luxurious Gold Tie -->
    <polygon points="115,145 125,145 123,175 120,182 117,175" fill="#FFC72C"/>
    <polygon points="113,142 127,142 125,147 115,147" fill="#F0B400"/>

    <!-- Tailored Dark Jacket Lapels -->
    <path d="M 80 185 L 105 135 L 115 145 L 95 185 Z" fill="#222631"/>
    <path d="M 160 185 L 135 135 L 125 145 L 145 185 Z" fill="#222631"/>

    <!-- Neck -->
    <rect x="110" y="122" width="20" height="18" fill="#E8B89C"/>

    <!-- Head / Face -->
    <ellipse cx="120" cy="105" rx="22" ry="26" fill="#F5C6A5"/>

    <!-- Subtle Hair (Sleek modern side-part) -->
    <path d="M 98 100 C 98 88 108 80 120 80 C 133 80 142 88 142 100 L 142 105 L 138 105 C 138 92 130 85 120 85 C 110 85 102 92 102 105 Z" fill="#3D3735"/>
    <path d="M 120 80 C 133 80 142 88 142 100 L 142 93 C 140 84 131 82 120 82 Z" fill="#2A2624"/>

    <!-- Confident Subtle Smile & Eyes -->
    <path d="M 112 109 C 115 112 125 112 128 109" stroke="#3D3735" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="110" cy="100" r="2" fill="#3D3735"/>
    <circle cx="130" cy="100" r="2" fill="#3D3735"/>
    
    <!-- Refined Glasses (Rimless / Sleek gold frame) -->
    <rect x="103" y="95" width="15" height="10" rx="2" fill="none" stroke="#FFC72C" stroke-width="1.5"/>
    <rect x="122" y="95" width="15" height="10" rx="2" fill="none" stroke="#FFC72C" stroke-width="1.5"/>
    <line x1="118" y1="98" x2="122" y2="98" stroke="#FFC72C" stroke-width="1.5"/>

    <!-- Elegant High-Value Symbol / Gold Ingot (Yuanbao) floating above gracefully -->
    <g transform="translate(120, 38)">
      <path d="M -18 -8 Q 0 -16 18 -8 Q 22 2 18 10 Q 0 14 -18 10 Q -22 2 -18 -8 Z" fill="#FFC72C"/>
      <path d="M -12 -5 Q 0 -11 12 -5 Q 15 2 12 7 Q 0 10 -12 7 Q -15 2 -12 -5 Z" fill="#FFE169"/>
      <!-- Inner cutout detail of ingot -->
      <ellipse cx="0" cy="1" rx="6" ry="3" fill="#E6AC00"/>
    </g>

    <!-- Radiating Wealth Sparkles -->
    <path d="M 85 45 L 87 52 L 94 54 L 87 56 L 85 63 L 83 56 L 76 54 L 83 52 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M 155 45 L 157 50 L 162 52 L 157 54 L 155 59 L 153 54 L 148 52 L 153 50 Z" fill="#FFD700" opacity="0.8"/>
    <circle cx="98" cy="35" r="2" fill="#FFC72C"/>
    <circle cx="142" cy="35" r="1.5" fill="#FFC72C"/>
  </g>
</svg>