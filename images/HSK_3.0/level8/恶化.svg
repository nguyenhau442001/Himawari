<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="monitorGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="alertGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="warmLamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Background Environment & Interior Details -->
  <!-- Hospital Room Wall & Partition -->
  <rect x="20" y="20" width="200" height="150" rx="6" fill="#1b263b" />
  <!-- Window showing night/dark exterior -->
  <rect x="160" y="35" width="50" height="70" rx="4" fill="#090d16" />
  <path d="M185 35 V105 M160 70 H210" stroke="#334155" stroke-width="1.5" />
  <!-- Window moonlight -->
  <path d="M165 40 L205 80 V40 Z" fill="#38bdf8" opacity="0.05" />

  <!-- Ambient glow from worsening condition indicator -->
  <circle cx="120" cy="110" r="70" fill="url(#alertGlow)" />

  <!-- Medical Equipment: IV Pole and Bag (Left) -->
  <rect x="42" y="50" width="3" height="130" fill="#64748b" rx="1.5" />
  <path d="M36 180 H48" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <!-- IV Bag -->
  <rect x="36" y="65" width="15" height="25" rx="3" fill="#cbd5e1" opacity="0.8" />
  <rect x="39" y="70" width="9" height="15" rx="1" fill="#38bdf8" opacity="0.6" />
  <path d="M43 90 V130" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Heart Monitor / ECG Machine (Center-Right) -->
  <rect x="125" y="75" width="55" height="40" rx="6" fill="#090d16" stroke="#475569" stroke-width="2" />
  <rect x="128" y="78" width="49" height="34" rx="4" fill="url(#monitorGlow)" />
  <!-- ECG Worsening Spikes (Erratic/High alert graph) -->
  <path d="M 132 95 L 140 95 L 144 85 L 148 105 L 152 80 L 156 100 L 160 95 L 173 95" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Monitor Stand -->
  <path d="M152 115 V130 H142" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Hospital Bed Headboard -->
  <rect x="65" y="100" width="65" height="75" rx="6" fill="#334155" />
  <rect x="70" y="105" width="55" height="45" rx="4" fill="#475569" />

  <!-- Patient Character (Lying in bed, looking distressed) -->
  <!-- Pillow -->
  <ellipse cx="98" cy="120" rx="22" ry="10" fill="#f8fafc" />
  <!-- Patient Head -->
  <circle cx="95" cy="118" r="14" fill="#fed7aa" />
  <!-- Patient Hair -->
  <path d="M 81 118 C 81 108, 105 106, 109 115 C 103 112, 87 112, 81 118 Z" fill="#334155" />
  <!-- Distressed Brow / Closed eyes (wincing) -->
  <path d="M 88 116 Q 91 114 94 116" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 97 116 Q 100 114 103 116" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Sweat drop representing worsening condition/pain -->
  <path d="M 104 110 C 104 110, 107 113, 107 115 C 107 117, 105 118, 104 118 C 103 118, 101 117, 101 115 C 101 113, 104 110, 104 110 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Blanket covering body -->
  <path d="M 75 140 Q 95 130 130 145 L 140 175 L 75 175 Z" fill="#3b82f6" rx="4" />
  <!-- Patient hand resting on blanket with IV tube connected -->
  <circle cx="110" cy="142" r="5" fill="#fed7aa" />
  <path d="M 43 130 Q 80 130 110 142" stroke="#cbd5e1" stroke-width="1.5" fill="none" />

  <!-- Doctor Character (Standing, reacting to the worsening vitals with concern) -->
  <!-- Doctor Body & White Coat -->
  <path d="M 175 125 L 195 125 L 200 185 L 170 185 Z" fill="#e2e8f0" />
  <!-- Inner Scrubs -->
  <path d="M 180 125 H 190 V 150 H 180 Z" fill="#0284c7" />
  <!-- Stethoscope around neck -->
  <path d="M 180 125 C 175 130, 175 140, 182 145" fill="none" stroke="#334155" stroke-width="1.5" />
  <path d="M 190 125 C 195 130, 195 140, 188 145" fill="none" stroke="#334155" stroke-width="1.5" />
  <circle cx="185" cy="147" r="3" fill="#94a3b8" />

  <!-- Doctor Head & Face -->
  <circle cx="185" cy="105" r="13" fill="#fbcfe8" />
  <!-- Doctor Hair -->
  <path d="M 172 105 C 172 95, 198 95, 198 105 C 195 100, 175 100, 172 105 Z" fill="#475569" />
  <!-- Concerned Facial Expression (Eyebrows angled down, serious mouth) -->
  <path d="M 180 102 L 184 104" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 188 104 L 192 102" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="181" cy="106" r="1" fill="#1e293b" />
  <circle cx="191" cy="106" r="1" fill="#1e293b" />
  <path d="M 183 112 Q 185 110 187 112" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Doctor Arms (Holding clipboard, pointing/looking at monitor) -->
  <path d="M 175 130 L 160 145 L 170 155" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Clipboard -->
  <rect x="150" y="138" width="18" height="24" rx="2" fill="#94a3b8" />
  <rect x="153" y="142" width="12" height="16" rx="1" fill="#f8fafc" />
  <path d="M 155 146 H 162 M 155 150 H 160 M 155 154 H 161" stroke="#ef4444" stroke-width="1" stroke-linecap="round" />

  <!-- Warning / Alert Indicator light above monitor (flashing red for worsening condition) -->
  <circle cx="152" cy="62" r="6" fill="#ef4444" />
  <circle cx="152" cy="62" r="10" fill="#ef4444" opacity="0.4">
    <animate attributeName="r" values="6;14;6" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Additional Interior Prop: Medical Cart with bottle -->
  <rect x="25" y="145" width="20" height="35" rx="2" fill="#475569" />
  <line x1="25" y1="155" x2="45" y2="155" stroke="#334155" stroke-width="2" />
  <circle cx="35" cy="138" r="4" fill="#38bdf8" opacity="0.7" />
  <path d="M 33 135 H 37 V 138 H 33 Z" fill="#e2e8f0" />
</svg>