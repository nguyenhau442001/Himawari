<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person reacting exaggeratedly -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 L-30 80 L30 80 L20 20 Z" fill="#4A90E2"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#FFD166"/>
    <!-- Exaggerated Eyes (Wide) -->
    <circle cx="-8" cy="-25" r="4" fill="#1A1D24"/>
    <circle cx="8" cy="-25" r="4" fill="#1A1D24"/>
    <!-- Open Mouth (Shock) -->
    <ellipse cx="0" cy="-10" rx="6" ry="8" fill="#1A1D24"/>
    
    <!-- Arms in dramatic gesture -->
    <path d="M-20 20 L-50 -10 M20 20 L50 -10" stroke="#FFD166" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Motion lines for dramatic effect -->
    <path d="M-60 -20 Q-70 -30 -60 -40" stroke="#FF9F1C" stroke-width="3" fill="none"/>
    <path d="M60 -20 Q70 -30 60 -40" stroke="#FF9F1C" stroke-width="3" fill="none"/>
  </g>

  <!-- The tiny object causing the fuss -->
  <g transform="translate(120, 180)">
    <circle cx="0" cy="0" r="6" fill="#FF6B6B"/>
    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Magnifying glass looking at the tiny object -->
  <g transform="translate(150, 160)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#E0E0E0" stroke-width="4"/>
    <line x1="10" y1="10" x2="30" y2="30" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>