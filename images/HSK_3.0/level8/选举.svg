<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative geometric elements -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#2A2F3B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Ballot Box Group -->
  <g transform="translate(0, 15)">
    <!-- Ballot Box Shadow / Base -->
    <path d="M 85,140 L 155,140 L 165,160 L 75,160 Z" fill="#252A36"/>
    <!-- Box Body -->
    <path d="M 80,100 L 160,100 L 155,145 L 85,145 Z" fill="#31394B"/>
    <!-- Box Front Highlight -->
    <path d="M 90,110 L 150,110 L 146,138 L 94,138 Z" fill="#222733"/>
    
    <!-- Voting Slot Frame -->
    <rect x="105" y="94" width="30" height="6" rx="3" fill="#F59E0B" opacity="0.4"/>
    <rect x="110" y="95" width="20" height="3" rx="1.5" fill="#1A1D24"/>

    <!-- Checkmark Icon on Box -->
    <path d="M 115,124 L 121,130 L 131,118" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Human Character Action (Dynamic Verb Depiction) -->
  <g transform="translate(0, 10)">
    <!-- Motion Lines for Action -->
    <path d="M 100,55 C 110,50 120,50 130,55" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 93,65 C 105,58 135,58 147,65" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Arm / Hand dropping the ballot -->
    <!-- Lower arm & sleeve -->
    <path d="M 85,35 L 115,75 L 128,68 L 100,28 Z" fill="#3B82F6"/>
    <!-- Hand -->
    <circle cx="120" cy="73" r="7" fill="#FBBF24"/>

    <!-- Ballot Paper sliding into the slot -->
    <g transform="translate(112, 45) rotate(15)">
      <rect x="0" y="0" width="22" height="30" rx="2" fill="#F3F4F6"/>
      <!-- Ballot Details (Abstract lines) -->
      <line x1="4" y1="6" x2="14" y2="6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
      <circle cx="6" cy="14" r="2.5" fill="#3B82F6"/>
      <line x1="10" y1="14" x2="18" y2="14" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
      <circle cx="6" cy="22" r="2.5" fill="#D1D5DB"/>
      <line x1="10" y1="22" x2="18" y2="22" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Focus Accent: Glowing particle/spark near the slot -->
  <circle cx="120" cy="98" r="4" fill="#F59E0B"/>
  <circle cx="120" cy="98" r="8" fill="#F59E0B" opacity="0.3"/>
</svg>