<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Subject -->
    <radialGradient id="spotlight" cx="120" cy="110" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Flask Gradient -->
    <linearGradient id="bloodGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    
    <!-- Doctor Coat Gradient -->
    <linearGradient id="labCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="110" fill="url(#spotlight)"/>

  <!-- Clinic Background Environment -->
  <g id="environment">
    <!-- Window with vertical blinds & night blue sky -->
    <rect x="25" y="30" width="50" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="41" y1="30" x2="41" y2="100" stroke="#334155" stroke-width="1.5"/>
    <line x1="58" y1="30" x2="58" y2="100" stroke="#334155" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="8" fill="#38bdf8" opacity="0.3"/>

    <!-- Medical Cabinet / Shelf -->
    <rect x="155" y="40" width="60" height="50" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="155" y1="65" x2="215" y2="65" stroke="#334155" stroke-width="2"/>
    <!-- Tiny props on shelf -->
    <rect x="165" y="50" width="8" height="15" rx="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="190" cy="55" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="200" y="48" width="10" height="17" rx="2" fill="#f43f5e" opacity="0.8"/>

    <!-- Counter Desk -->
    <rect x="10" y="185" width="220" height="35" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M10 185 L230 185" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Foreground Characters & Action (Doctor & Patient Blood Test) -->
  <g id="characters" filter="url(#shadow)">
    
    <!-- PATIENT (Left side, showing arm/hand for blood test or holding requisition slip) -->
    <g id="patient">
      <!-- Patient Body -->
      <path d="M 65 140 Q 65 115 85 115 L 105 115 Q 125 115 125 140 L 130 190 L 60 190 Z" fill="#38bdf8"/>
      <!-- Patient Head -->
      <circle cx="95" cy="95" r="16" fill="#fed7aa"/>
      <!-- Patient Hair -->
      <path d="M 79 95 C 79 80 111 80 111 95 C 111 90 105 87 95 87 C 85 87 79 90 79 95 Z" fill="#475569"/>
      <!-- Patient Arm reaching forward -->
      <path d="M 105 125 Q 125 130 135 145" fill="none" stroke="#fed7aa" stroke-width="9" stroke-linecap="round"/>
      <!-- Requisition Slip / Medical Form in hand -->
      <rect x="125" y="140" width="18" height="24" rx="2" fill="#f8fafc" transform="rotate(15 125 140)"/>
      <line x1="129" y1="146" x2="137" y2="146" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="129" y1="152" x2="139" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="129" y1="158" x2="135" y2="158" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- DOCTOR (Right side, holding blood collection vial/syringe) -->
    <g id="doctor">
      <!-- Doctor Body / Lab Coat -->
      <path d="M 145 140 Q 145 110 165 110 L 195 110 Q 215 110 215 140 L 220 190 L 140 190 Z" fill="url(#labCoat)"/>
      <!-- Blue Scrubs inside -->
      <path d="M 165 115 L 195 115 L 195 150 L 165 150 Z" fill="#0284c7"/>
      <!-- Lab coat lapels -->
      <path d="M 165 110 L 180 150 L 165 190" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M 195 110 L 180 150 L 195 190" fill="none" stroke="#cbd5e1" stroke-width="3"/>

      <!-- Doctor Head -->
      <circle cx="180" cy="92" r="15" fill="#fbcfe8"/>
      <!-- Doctor Hair (Stylized dark neat bun/hair) -->
      <path d="M 165 90 C 165 77 195 77 195 90 C 195 84 190 81 180 81 C 170 81 165 84 165 90 Z" fill="#1e293b"/>
      <!-- Stethoscope around neck -->
      <path d="M 172 98 Q 180 115 175 125" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <circle cx="175" cy="126" r="4" fill="#94a3b8"/>

      <!-- Doctor Hands holding Blood Vial -->
      <!-- Arm extending -->
      <path d="M 155 130 Q 140 135 130 142" fill="none" stroke="url(#labCoat)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="128" cy="143" r="5" fill="#fbcfe8"/>

      <!-- GLOWING BLOOD TEST VIAL (Focal Point representing 化验 / blood test) -->
      <g id="blood-vial" transform="translate(122, 130)">
        <!-- Vial Body -->
        <rect x="-4" y="0" width="12" height="26" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <!-- Liquid Blood inside -->
        <rect x="-3" y="10" width="10" height="15" rx="2" fill="url(#bloodGlow)"/>
        <!-- Vial Cap -->
        <rect x="-6" y="-5" width="16" height="6" rx="2" fill="#10b981"/>
        <!-- Glowing highlight sparkles -->
        <circle cx="2" cy="15" r="1.5" fill="#ffffff" opacity="0.8"/>
        <circle cx="1" cy="20" r="1" fill="#ffffff" opacity="0.6"/>
      </g>
    </g>

    <!-- Medical Cross Emblem on Wall -->
    <g id="medical-cross" transform="translate(110, 45)">
      <rect x="-12" y="-4" width="24" height="8" rx="2" fill="#f43f5e" opacity="0.9"/>
      <rect x="-4" y="-12" width="8" height="24" rx="2" fill="#f43f5e" opacity="0.9"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4"/>
    </g>

  </g>
</svg>