<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle atmosphere -->
  <circle cx="120" cy="120" r="90" fill="#222732" opacity="0.5"/>

  <!-- Conceptual Representation of "动摇" (Object: A physical, weighted pillar/monolith experiencing physical sway and instability) -->
  <g transform="translate(120, 130)">
    <!-- Ground / Base platform -->
    <path d="M-70,50 L70,50 L85,75 L-85,75 Z" fill="#2C3342"/>
    <rect x="-60" y="45" width="120" height="8" rx="2" fill="#3A4456"/>

    <!-- Dynamic ground tilt / oscillation indicators (ghosted outlines) -->
    <path d="M-30,45 L-50,-40 L-10,-40 L10,45 Z" fill="#3B82F6" opacity="0.15"/>
    <path d="M30,45 L10,-40 L50,-40 L70,45 Z" fill="#3B82F6" opacity="0.15"/>

    <!-- Central Heavy Object (Monolith / Pillar showing tilt and structural instability) -->
    <g transform="rotate(-12)">
      <!-- Main body of the physical pillar -->
      <path d="M-22,-65 L22,-65 L30,45 L-30,45 Z" fill="url(#pillarGrad)"/>
      
      <!-- Highlight slice -->
      <path d="M-22,-65 L-8,-65 L-14,45 L-30,45 Z" fill="#FFFFFF" opacity="0.1"/>

      <!-- Structural fracture / stress lines indicating "shake / dao dong" -->
      <path d="M-15,-10 L5,-5 L-8,10 L12,18" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="-5" cy="-2" r="2.5" fill="#F59E0B"/>
      <circle cx="5" cy="12" r="2.5" fill="#F59E0B"/>

      <!-- Top cap -->
      <ellipse cx="0" cy="-65" rx="22" ry="6" fill="#64748B"/>
      <ellipse cx="0" cy="-65" rx="16" ry="4" fill="#475569"/>
    </g>

    <!-- Kinetic motion lines / oscillation arcs (visualizing the rocking/swaying physics) -->
    <path d="M-55,-15 C-65,-5 -65,15 -50,30" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M55,-15 C65,-5 65,15 50,30" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Motion arrows -->
    <path d="M-52,8 L-60,0 L-45,2" fill="#F59E0B"/>
    <path d="M52,8 L60,0 L45,2" fill="#3B82F6"/>

    <!-- Dislodged falling debris (physical instability) -->
    <polygon points="35,-20 42,-12 30,-8" fill="#94A3B8"/>
    <polygon points="-38,5 -45,12 -30,15" fill="#64748B"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
</svg>