<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="car-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="car-body-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="headlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="car-clip">
      <path d="M 30,120 Q 30,105 50,105 L 120,105 Q 150,105 170,120 L 195,150 Q 205,160 195,170 L 35,170 Q 25,160 30,150 Z"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Night Sky & Stars -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="40" cy="30" r="1"/>
    <circle cx="85" cy="20" r="1.5"/>
    <circle cx="130" cy="40" r="1"/>
    <circle cx="180" cy="25" r="2"/>
    <circle cx="210" cy="50" r="1"/>
    <circle cx="20" cy="70" r="1.5"/>
  </g>

  <!-- Distant Mountains/Cityscape -->
  <path d="M 0,110 L 30,90 L 60,105 L 95,85 L 135,100 L 175,80 L 210,95 L 240,85 L 240,130 L 0,130 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M 0,120 L 45,100 L 90,115 L 150,95 L 190,110 L 240,100 L 240,130 L 0,130 Z" fill="#334155" opacity="0.5"/>

  <!-- Road & Environment -->
  <rect x="0" y="130" width="240" height="90" fill="url(#road-grad)"/>
  <!-- Road Markings (Dashed Line) -->
  <line x1="0" y1="175" x2="240" y2="175" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="12,12" opacity="0.7"/>
  <!-- Road Edge -->
  <line x1="0" y1="130" x2="240" y2="130" stroke="#475569" stroke-width="2"/>

  <!-- Motion Speed Lines (Background) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="180" y1="100" x2="210" y2="100"/>
    <line x1="140" y1="90" x2="175" y2="90"/>
    <line x1="190" y1="115" x2="230" y2="115"/>
  </g>

  <!-- THE CAR (Convertible / Side View representing "Driving") -->
  <!-- Headlight beam -->
  <path d="M 32,150 L 0,140 L 0,180 Z" fill="url(#headlight)"/>
  
  <g>
    <!-- Car Shadow -->
    <ellipse cx="115" cy="182" rx="85" ry="8" fill="#020617" opacity="0.6"/>

    <!-- Wheels -->
    <g fill="#0f172a" stroke="#64748b" stroke-width="3">
      <circle cx="65" cy="172" r="16"/>
      <circle cx="175" cy="172" r="16"/>
    </g>
    <!-- Wheel Rims -->
    <g fill="#cbd5e1">
      <circle cx="65" cy="172" r="7"/>
      <circle cx="175" cy="172" r="7"/>
    </g>

    <!-- Car Body Base -->
    <path d="M 35,145 Q 35,130 55,130 L 185,130 Q 205,130 205,145 L 210,165 Q 210,175 195,175 L 45,175 Q 30,175 35,160 Z" fill="url(#car-body)"/>

    <!-- Car Hood Details -->
    <path d="M 35,145 L 60,145 L 60,155 L 38,155 Z" fill="#0284c7" opacity="0.6"/>
    <rect x="195" y="148" width="8" height="12" rx="2" fill="#fef08a"/> <!-- Headlight -->
    <rect x="37" y="148" width="4" height="10" rx="1" fill="#ef4444"/> <!-- Taillight -->

    <!-- Windshield & Roof Opening -->
    <path d="M 75,130 L 95,100 L 165,100 L 185,130 Z" fill="#38bdf8" opacity="0.3"/>
    <path d="M 93,100 L 100,130" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/> <!-- Front windshield frame -->
    <path d="M 167,100 L 160,130" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/> <!-- Rear windshield frame -->

    <!-- TWO DRIVERS (Alternating concept: Driver 1 active, Driver 2 resting/switching or vice-versa) -->
    <!-- Character 1 (Driver - Front, actively steering) -->
    <g transform="translate(105, 105)">
      <!-- Body / Torso -->
      <path d="M 10,25 Q 10,15 22,15 L 32,15 Q 44,15 44,25 L 40,50 L 14,50 Z" fill="#10b981"/>
      <!-- Head -->
      <circle cx="27" cy="6" r="10" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M 17,6 Q 22,-5 37,2 Q 37,6 37,6 Z" fill="#451a03"/>
      <!-- Hands on Steering Wheel -->
      <circle cx="12" cy="30" r="4" fill="#fbcfe8"/>
      <circle cx="32" cy="30" r="4" fill="#fbcfe8"/>
      <!-- Steering Wheel -->
      <circle cx="22" cy="32" r="12" fill="none" stroke="#64748b" stroke-width="4"/>
    </g>

    <!-- Character 2 (Passenger / Co-driver preparing to alternate or resting, looking alert) -->
    <g transform="translate(145, 108)">
      <!-- Body / Torso -->
      <path d="M 10,25 Q 10,15 22,15 L 32,15 Q 44,15 44,25 L 40,50 L 14,50 Z" fill="#f43f5e"/>
      <!-- Head -->
      <circle cx="27" cy="6" r="10" fill="#fed7aa"/>
      <!-- Hair -->
      <path d="M 17,4 Q 27,-2 37,4 Q 32,12 17,4" fill="#1e293b"/>
      <!-- Arm resting casually -->
      <path d="M 14,30 Q 5,35 15,45" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- INTERACTION / ALTERNATING CONCEPT GRAPHIC ELEMENTS -->
  <!-- Curved Swapping / Alternating Arrow Indicator above the car -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main arc indicating switch -->
    <path d="M 90,75 Q 135,50 165,75" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4"/>
    <!-- Arrow heads for exchange -->
    <path d="M 85,70 L 90,75 L 95,70" stroke="#fbbf24" stroke-width="3"/>
    <path d="M 160,70 L 165,75 L 170,70" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- Small floating swap icons (steering wheel rotation indicator) -->
  <g transform="translate(122, 55)" stroke="#38bdf8" stroke-width="2" fill="none">
    <circle cx="6" cy="6" r="8"/>
    <path d="M 2,2 L 10,10 M 10,2 L 2,10" opacity="0.3"/>
  </g>

  <!-- Foreground Atmospheric Glows / Bokeh -->
  <circle cx="20" cy="200" r="3" fill="#38bdf8" opacity="0.3"/>
  <circle cx="220" cy="190" r="4" fill="#fbbf24" opacity="0.4"/>
  <circle cx="200" cy="210" r="2" fill="#10b981" opacity="0.5"/>
</svg>