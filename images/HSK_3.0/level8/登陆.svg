<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for Stormy Night -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ocean Gradient -->
    <linearGradient id="ocean-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Warning Sky Glow -->
    <linearGradient id="sky-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Typhoon Spiral Gradient -->
    <radialGradient id="typhoon-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fb923c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting / Typhoon Warning Horizon -->
  <rect x="0" y="80" width="240" height="80" fill="url(#sky-glow)" />

  <!-- Distant Huge Typhoon Swirl in the Sky (Approaching Landfall) -->
  <g opacity="0.6" transform="translate(160, 70)">
    <circle cx="0" cy="0" r="45" fill="url(#typhoon-center)" />
    <!-- Spiral Arms -->
    <path d="M-30,-20 Q0,-50 30,-20 T60,20" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M-40,10 Q-10,-20 20,-10 T50,30" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M-20,40 Q10,10 40,20 T30,-40" fill="none" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Heavy Rain Streaks -->
  <g stroke="#94a3b8" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="20" y1="20" x2="5" y2="70" />
    <line x1="60" y1="10" x2="45" y2="60" />
    <line x1="100" y1="30" x2="85" y2="80" />
    <line x1="140" y1="15" x2="125" y2="65" />
    <line x1="180" y1="25" x2="165" y2="75" />
    <line x1="220" y1="10" x2="205" y2="60" />
    
    <line x1="40" y1="80" x2="25" y2="130" />
    <line x1="90" y1="70" x2="75" y2="120" />
    <line x1="130" y1="90" x2="115" y2="140" />
    <line x1="170" y1="75" x2="155" y2="125" />
    <line x1="210" y1="85" x2="195" y2="135" />
  </g>

  <!-- Coastal Landmass / Shoreline -->
  <path d="M 0 160 Q 40 150, 90 155 T 240 145 L 240 240 L 0 240 Z" fill="#0f172a" />
  <!-- Land details / Coastal Pier & Lighthouse Base -->
  <path d="M 180 155 L 200 190 L 160 190 Z" fill="#334155" />
  
  <!-- Coastal Lighthouse (Standing firm against impending landfall) -->
  <g transform="translate(180, 100)">
    <!-- Tower -->
    <polygon points="12,0 18,0 22,55 8,55" fill="#cbd5e1" />
    <!-- Red stripes -->
    <polygon points="14.5,15 16.5,15 18,30 13,30" fill="#ef4444" />
    <polygon points="12,40 18,40 19.5,50 10.5,50" fill="#ef4444" />
    <!-- Light Room & Roof -->
    <rect x="8" y="-8" width="14" height="8" fill="#1e293b" />
    <polygon points="15,-16 6,-8 24,-8" fill="#ef4444" />
    <!-- Rotating Beam of Light -->
    <path d="M 15 -4 L -40 -35 L -35 -40 Z" fill="#fef08a" opacity="0.4" />
  </g>

  <!-- Rough Ocean Water & Crashing Waves at Shore -->
  <path d="M 0 165 C 50 155, 100 175, 150 160 C 190 148, 220 165, 240 160 L 240 240 L 0 240 Z" fill="url(#ocean-grad)" />
  
  <!-- Massive Storm Waves (Visualizing "Đổ bộ" / Impact) -->
  <path d="M 30 175 C 50 160, 70 190, 90 170 C 110 150, 130 180, 150 165" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 110 190 C 130 175, 150 200, 170 185 C 190 170, 210 190, 230 175" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />
  <path d="M 10 195 Q 35 175, 60 195" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Safe Harbor / House on Coast with Warm Interior Light (Preparing) -->
  <g transform="translate(45, 120)">
    <!-- House Body -->
    <rect x="0" y="15" width="45" height="30" fill="#334155" />
    <!-- Roof -->
    <polygon points="-5,15 22.5,-3 50,15" fill="#b91c1c" />
    <!-- Warm Window (Showing people inside preparing for the storm) -->
    <rect x="15" y="22" width="12" height="15" rx="2" fill="#fbbf24" />
    <!-- Window Grid -->
    <line x1="21" y1="22" x2="21" y2="37" stroke="#1e293b" stroke-width="1.5" />
    <line x1="15" y1="29" x2="27" y2="29" stroke="#1e293b" stroke-width="1.5" />
    <!-- Storm shutters / reinforcing boards -->
    <line x1="15" y1="22" x2="27" y2="37" stroke="#b45309" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Bent Tree in High Wind (Emphasizing incoming gale force) -->
  <g transform="translate(105, 140)">
    <!-- Trunk bending right -->
    <path d="M 10 25 C 12 10, 25 -5, 40 -15" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <!-- Foliage whipped by wind -->
    <path d="M 35 -12 C 45 -25, 55 -15, 50 -5 C 65 0, 50 15, 38 5 Z" fill="#065f46" />
    <path d="M 28 -5 C 38 -15, 48 -8, 40 5 Z" fill="#047857" />
  </g>

  <!-- Foreground Wind-blown Elements / Debris & Leaves flying -->
  <path d="M 70 90 Q 80 85, 95 92" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" />
  <path d="M 130 110 Q 145 100, 150 115" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="110" cy="85" r="2" fill="#34d399" />
  <circle cx="85" cy="115" r="1.5" fill="#34d399" />

  <!-- Dramatic Lighting Vignette Frame Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.5" />
</svg>