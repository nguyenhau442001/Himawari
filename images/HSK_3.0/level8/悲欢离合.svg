<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle ambient grid / horizon line representing life's journey -->
  <line x1="30" y1="120" x2="210" y2="120" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Quadrant / Section layout representing "悲欢离合" (Grief, Joy, Separation, Reunion) -->
  
  <!-- 1. Top-Left: 悲 (Sorrow / Blue / Drooping teardrop abstract form) -->
  <g transform="translate(65, 65)">
    <!-- Soft glow/shadow -->
    <circle cx="0" cy="0" r="28" fill="#2D3748" opacity="0.4"/>
    <!-- Abstract drooping figure / teardrop motif -->
    <path d="M 0 -18 C -12 -18 -18 -8 -18 2 C -18 14 -8 20 0 24 C 8 20 18 14 18 2 C 18 -8 12 -18 0 -18 Z" fill="#3B82F6" opacity="0.8"/>
    <!-- Downward accent line -->
    <path d="M 0 6 L 0 16" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="2" fill="#1A1D24"/>
  </g>

  <!-- 2. Top-Right: 欢 (Joy / Warm Gold / Rising upward curves) -->
  <g transform="translate(175, 65)">
    <!-- Soft glow/shadow -->
    <circle cx="0" cy="0" r="28" fill="#3D352A" opacity="0.4"/>
    <!-- Abstract rising energetic arcs -->
    <path d="M -14 8 C -14 -4 -6 -12 0 -12 C 6 -12 14 -4 14 8" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-2" r="4" fill="#F59E0B"/>
    <!-- Radiating spark elements -->
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-16" y1="-12" x2="-20" y2="-15" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="-12" x2="20" y2="-15" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 3. Bottom-Left: 离 (Separation / Diverging paths or figures moving apart) -->
  <g transform="translate(65, 175)">
    <!-- Soft glow/shadow -->
    <circle cx="0" cy="0" r="28" fill="#2D3748" opacity="0.4"/>
    <!-- Two small figures / elements parting ways -->
    <circle cx="-10" cy="-2" r="6" fill="#94A3B8"/>
    <path d="M -16 14 C -16 6 -12 4 -10 4 C -8 4 -4 6 -4 14" fill="#94A3B8"/>
    
    <circle cx="10" cy="-2" r="6" fill="#64748B"/>
    <path d="M 4 14 C 4 6 8 4 10 4 C 12 4 16 6 16 14" fill="#64748B"/>

    <!-- Divergence arrows -->
    <path d="M -2 -6 L -8 -12" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <path d="M 2 -6 L 8 -12" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 4. Bottom-Right: 合 (Reunion / Converging elements in warm harmony) -->
  <g transform="translate(175, 175)">
    <!-- Soft glow/shadow -->
    <circle cx="0" cy="0" r="28" fill="#263832" opacity="0.4"/>
    <!-- Two elements coming together into a unified warm shape -->
    <circle cx="-6" cy="0" r="6" fill="#10B981"/>
    <circle cx="6" cy="0" r="6" fill="#34D399"/>
    <!-- Central embracing bond -->
    <path d="M -12 8 C -6 14 6 14 12 8" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <!-- Convergence indicators -->
    <path d="M -16 -8 L -10 -2" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M 16 -8 L 10 -2" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Central Anchor: Representing the cyclical, balanced nature of life's transitions ("寻常风景") -->
  <circle cx="120" cy="120" r="18" fill="#111318" stroke="#334155" stroke-width="2"/>
  <!-- Infinity-inspired minimalist loop or subtle equilibrium symbol -->
  <path d="M 112 120 C 112 115 116 112 120 112 C 124 112 128 115 128 120 C 128 125 124 128 120 128 C 116 128 112 125 112 120 Z" fill="none" stroke="#F8FAFC" stroke-width="2" opacity="0.9"/>
  <circle cx="120" cy="120" r="3" fill="#F59E0B"/>
</svg>