<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid/background atmosphere -->
  <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Central Physical Object: A stylized physical declining physical asset / descending structure representing economic decay/recession -->
  <!-- Base platform -->
  <path d="M60 190 L180 190" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Descending blocks / falling pillars chart metaphor -->
  <!-- Block 1 (Highest, faded) -->
  <rect x="70" y="130" width="24" height="60" rx="4" fill="#2E384D"/>
  
  <!-- Block 2 (Medium) -->
  <rect x="108" y="150" width="24" height="40" rx="4" fill="#3E4C66"/>
  
  <!-- Block 3 (Lowest, accented with warning orange/gold) -->
  <rect x="146" y="170" width="24" height="20" rx="4" fill="#FF8C42"/>
  
  <!-- Bold downward trend arrow cutting through -->
  <path d="M75 105 L120 145 L165 130 L165 155" fill="none" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Downward arrow head -->
  <path d="M150 155 L165 155 L165 140" fill="none" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>