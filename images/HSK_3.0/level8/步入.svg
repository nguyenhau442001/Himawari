<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Floor gradient for depth -->
    <linearGradient id="floorGrad" x1="120" y1="160" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252A34"/>
      <stop offset="100%" stop-color="#14171D"/>
    </linearGradient>
    
    <!-- Archway/Doorway glow & depth -->
    <linearGradient id="doorGlow" x1="120" y1="50" x2="120" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F39C12" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F39C12" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Character clothing gradient -->
    <linearGradient id="suitGrad" x1="100" y1="110" x2="140" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#D4AC0D"/>
    </linearGradient>
  </defs>

  <!-- Ambient background glow representing the grand hall inside -->
  <path d="M 85 55 L 155 55 L 155 175 L 85 175 Z" fill="url(#doorGlow)"/>

  <!-- Grand Archway / Doorway frame (representing entering a space) -->
  <path d="M 75 180 L 75 55 C 75 40, 95 30, 120 30 C 145 30, 165 40, 165 55 L 165 180" fill="none" stroke="#F1C40F" stroke-width="4" stroke-linecap="round"/>
  <!-- Inner architectural trim -->
  <path d="M 82 180 L 82 58 C 82 46, 98 38, 120 38 C 142 38, 158 46, 158 58 L 158 180" fill="none" stroke="#F39C12" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Floor plane (Perspective grid / tiles) -->
  <path d="M 20 180 L 220 180 L 240 220 L 0 220 Z" fill="url(#floorGrad)"/>
  <!-- Floor perspective lines -->
  <line x1="120" y1="180" x2="120" y2="220" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="70" y2="220" stroke="#2C3E50" stroke-width="1"/>
  <line x1="120" y1="180" x2="170" y2="220" stroke="#2C3E50" stroke-width="1"/>
  <line x1="120" y1="180" x2="20" y2="220" stroke="#2C3E50" stroke-width="0.75"/>
  <line x1="120" y1="180" x2="220" y2="220" stroke="#2C3E50" stroke-width="0.75"/>

  <!-- Motion lines / step progression (Visualizing "stepping into") -->
  <path d="M 65 145 C 80 140, 95 142, 105 148" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 50 165 C 70 160, 90 162, 110 170" fill="none" stroke="#F1C40F" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>

  <!-- Character stepping forward (Central icon representation of 'bùrù' / entering) -->
  <!-- Head -->
  <circle cx="115" cy="85" r="11" fill="#F5CBA7"/>
  <!-- Hair -->
  <path d="M 104 83 C 104 74, 112 72, 120 74 C 127 72, 126 83, 126 83 Z" fill="#2C3E50"/>

  <!-- Torso / Suit (Formal wear context) -->
  <path d="M 102 98 L 128 98 L 134 140 L 98 140 Z" fill="url(#suitGrad)"/>
  <!-- Shirt collar & tie accent -->
  <path d="M 111 98 L 120 108 L 129 98 Z" fill="#FFFFFF"/>
  <polygon points="118,105 122,105 121,122 119,122" fill="#E74C3C"/>

  <!-- Back Arm (swinging) -->
  <path d="M 105 102 L 92 125" fill="none" stroke="#34495E" stroke-width="6" stroke-linecap="round"/>

  <!-- Front Arm (reaching forward into the space) -->
  <path d="M 125 102 L 142 120" fill="none" stroke="#34495E" stroke-width="6" stroke-linecap="round"/>
  <circle cx="145" cy="123" r="3.5" fill="#F5CBA7"/>

  <!-- Back Leg (pushing off) -->
  <path d="M 104 140 L 88 172" fill="none" stroke="#2C3E50" stroke-width="7" stroke-linecap="round"/>
  <!-- Back Shoe -->
  <ellipse cx="84" cy="176" rx="6" ry="3" fill="#1C2833"/>

  <!-- Front Leg (stepping forward across the threshold) -->
  <path d="M 122 140 L 138 165 L 152 170" fill="none" stroke="#34495E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Shoe (highlighted gold accent for focus) -->
  <ellipse cx="157" cy="171" rx="8" ry="3.5" fill="url(#goldAcc)"/>

  <!-- Subtle glowing threshold particle/spark to enhance modern flat tech-ed aesthetic -->
  <circle cx="120" cy="180" r="2.5" fill="#F1C40F" opacity="0.9"/>
  <circle cx="145" cy="155" r="1.5" fill="#F39C12" opacity="0.7"/>
  <circle cx="95" cy="130" r="1.5" fill="#F39C12" opacity="0.5"/>
</svg>