<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Grandmother Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Cozy Room Wall -->
  <rect x="16" y="16" width="208" height="180" rx="16" fill="#1b263b" opacity="0.6"/>

  <!-- Wall Shelf with Books and Plant -->
  <rect x="35" y="45" width="90" height="4" rx="2" fill="#334155"/>
  <!-- Books on shelf -->
  <rect x="45" y="25" width="10" height="20" rx="2" fill="#ef4444"/>
  <rect x="56" y="22" width="12" height="23" rx="2" fill="#3b82f6"/>
  <rect x="70" y="28" width="8" height="17" rx="2" fill="#10b981"/>
  <!-- Small potted plant -->
  <path d="M 98 45 L 104 35 L 114 35 L 120 45 Z" fill="#64748b"/>
  <path d="M 109 35 Q 105 25 110 20 Q 115 25 109 35 Z" fill="#22c55e"/>
  <path d="M 109 35 Q 118 27 122 32 Q 120 38 109 35 Z" fill="#16a34a"/>

  <!-- Warm Hanging Lamp -->
  <path d="M 170 16 L 170 55" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 155 55 L 185 55 L 192 70 L 148 70 Z" fill="#f59e0b"/>
  <!-- Light Glow Overlay -->
  <circle cx="170" cy="115" r="75" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>
  <!-- Lamp Beam Triangle -->
  <polygon points="170,70 110,210 230,210" fill="#fbbf24" opacity="0.04"/>

  <!-- Floor -->
  <rect x="16" y="196" width="208" height="28" fill="#0f172a" opacity="0.8"/>
  <line x1="16" y1="196" x2="224" y2="196" stroke="#334155" stroke-width="2"/>

  <!-- Wooden Chair (Grandmother's Seat) -->
  <path d="M 45 140 L 75 140 L 75 200 L 45 200 Z" fill="#9a3412" opacity="0.1"/> <!-- Shadow -->
  <rect x="52" y="110" width="36" height="85" rx="6" fill="#78350f"/>
  <rect x="56" y="116" width="28" height="73" rx="4" fill="#b45309"/>
  <!-- Chair seat -->
  <rect x="42" y="165" width="52" height="12" rx="4" fill="#92400e"/>
  <!-- Chair legs -->
  <line x1="48" y1="177" x2="42" y2="200" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="177" x2="94" y2="200" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>

  <!-- CHARACTERS: GRANDMOTHER & CHILD -->

  <!-- GRANDMOTHER (Left, sitting) -->
  <g transform="translate(40, 95)">
    <!-- Body & Torso (Teal/Green patterned cardigan) -->
    <path d="M 15 50 Q 10 90 22 105 L 58 105 Q 70 90 65 50 Z" fill="#0d9488"/>
    <!-- Collar & Blouse under cardigan -->
    <path d="M 32 45 L 48 45 L 42 60 Z" fill="#f8fafc"/>
    <path d="M 40 45 L 40 75" stroke="#0f766e" stroke-width="2"/>
    <!-- Buttons -->
    <circle cx="40" cy="62" r="1.5" fill="#ccfbf1"/>
    <circle cx="40" cy="72" r="1.5" fill="#ccfbf1"/>

    <!-- Grandmother's Head & Face (Expressing Cixiang / Warmth & Kindness) -->
    <!-- Neck -->
    <rect x="33" y="36" width="14" height="12" rx="4" fill="url(#skinGrad)"/>
    <!-- Head Shape -->
    <circle cx="40" cy="28" r="18" fill="url(#skinGrad)"/>

    <!-- Hair Bun & Silver Hair -->
    <circle cx="40" cy="10" r="7" fill="url(#hairGrad)"/>
    <path d="M 22 28 C 22 16, 58 16, 58 28 C 58 36, 54 36, 50 30 C 45 34, 35 34, 30 30 C 26 36, 22 36, 22 28 Z" fill="url(#hairGrad)"/>

    <!-- Gentle Friendly Eyes (Crescent smiling eyes conveying extreme warmth) -->
    <!-- Left Eye (Blinking/Smiling arc) -->
    <path d="M 30 26 Q 34 30 38 26" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Right Eye (Blinking/Smiling arc) -->
    <path d="M 42 26 Q 46 30 50 26" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Soft Rosy Cheeks (Highlighting affectionate expression) -->
    <circle cx="28" cy="31" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="52" cy="31" r="4" fill="#fda4af" opacity="0.6"/>
    <!-- Warm Smiling Mouth (Gentle curve showing deep affection) -->
    <path d="M 35 35 Q 40 40 45 35" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Grandmother's Arms reaching out gently -->
    <!-- Left Arm holding child's hand -->
    <path d="M 20 60 C 5 70 -5 85 10 95" stroke="#0d9488" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="10" cy="95" r="5" fill="url(#skinGrad)"/>
    <!-- Right Arm resting -->
    <path d="M 60 60 Q 72 70 65 85" stroke="#0d9488" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="65" cy="85" r="4.5" fill="url(#skinGrad)"/>
  </g>

  <!-- CHILD (Right, standing/leaning affectionately) -->
  <g transform="translate(130, 110)">
    <!-- Body (Warm orange/coral sweater) -->
    <path d="M 15 40 Q 5 75 12 90 L 48 90 Q 55 75 45 40 Z" fill="#fb923c"/>
    
    <!-- Child's Head -->
    <!-- Neck -->
    <rect x="23" y="28" width="12" height="12" rx="4" fill="url(#skinGrad)"/>
    <!-- Head Shape -->
    <circle cx="29" cy="20" r="15" fill="url(#skinGrad)"/>

    <!-- Child Hair (Playful dark bob) -->
    <path d="M 14 18 C 14 6, 44 6, 44 18 C 44 26, 42 26, 38 22 C 34 26, 24 26, 20 22 C 16 26, 14 26, 14 18 Z" fill="#334155"/>

    <!-- Child Face (Looking up happily at grandmother) -->
    <!-- Big happy sparkly eyes looking left -->
    <circle cx="23" cy="19" r="2.5" fill="#1e293b"/>
    <circle cx="24" cy="18" r="0.8" fill="#ffffff"/>
    <circle cx="33" cy="19" r="2.5" fill="#1e293b"/>
    <circle cx="34" cy="18" r="0.8" fill="#ffffff"/>
    
    <!-- Happy Smile -->
    <path d="M 25 25 Q 29 29 33 25" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="20" cy="22" r="3" fill="#fda4af" opacity="0.5"/>
    <circle cx="38" cy="22" r="3" fill="#fda4af" opacity="0.5"/>

    <!-- Child's Arms reaching to hold grandmother's hand -->
    <path d="M 12 50 C -5 55 -15 65 -30 65" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="-30" cy="65" r="4" fill="url(#skinGrad)"/>

    <!-- Legs -->
    <rect x="18" y="88" width="8" height="22" rx="3" fill="#3b82f6"/>
    <rect x="30" y="88" width="8" height="22" rx="3" fill="#3b82f6"/>
    <!-- Shoes -->
    <ellipse cx="22" cy="111" rx="6" ry="3" fill="#e2e8f0"/>
    <ellipse cx="34" cy="111" rx="6" ry="3" fill="#e2e8f0"/>
  </g>

  <!-- FOREGROUND PROPS / DETAILS -->
  <!-- Low Coffee Table -->
  <rect x="85" y="175" width="70" height="8" rx="3" fill="#cbd5e1"/>
  <!-- Table Legs -->
  <line x1="93" y1="183" x2="88" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="147" y1="183" x2="152" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Teapot and Teacups on Table -->
  <!-- Teapot -->
  <path d="M 112 165 C 108 165 106 170 108 175 L 122 175 C 124 170 122 165 118 165 Z" fill="#f8fafc"/>
  <circle cx="115" cy="164" r="5" fill="#e2e8f0"/>
  <!-- Teacup -->
  <path d="M 130 168 L 138 168 L 137 175 C 137 176 131 176 130 175 Z" fill="#f8fafc"/>
  <path d="M 137 170 C 140 170 140 174 137 174" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
  <!-- Steam wisps rising with warm glow -->
  <path d="M 114 158 Q 116 153 112 148" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 134 161 Q 132 156 136 151" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Warm Floating Hearts / Affection Symbols (Stylized, soft glowing dots and micro-shapes enhancing the warm emotion) -->
  <path d="M 85 100 Q 88 95 91 100 Q 94 105 88 111 Q 82 105 85 100 Z" fill="#f43f5e" opacity="0.8"/>
  <path d="M 115 80 Q 117 76 119 80 Q 121 84 117 88 Q 113 84 115 80 Z" fill="#fb7185" opacity="0.7"/>
  <circle cx="72" cy="115" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="102" cy="92" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="98" cy="120" r="2.5" fill="#f43f5e" opacity="0.6"/>
</svg>