<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for University/Hospital Lobby -->
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Card Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- SCENE BACKGROUND: University Hospital Exterior & Interior Connection -->
  <!-- University Building Silhouette in background -->
  <path d="M 20 110 L 20 70 L 40 50 L 60 70 L 60 110 Z" fill="#334155" opacity="0.6"/>
  <rect x="30" y="65" width="20" height="15" fill="#475569" opacity="0.6"/>
  <rect x="35" y="85" width="10" height="25" fill="#1e293b"/>

  <!-- Hospital Main Entrance Arch (Affiliated Building Concept) -->
  <path d="M 50 200 L 50 110 C 50 90, 70 80, 120 80 C 170 80, 190 90, 190 110 L 190 200 Z" fill="#334155"/>
  <path d="M 65 200 L 65 115 C 65 100, 80 95, 120 95 C 160 95, 175 100, 175 115 L 175 200 Z" fill="#0f172a"/>

  <!-- Connection Pathway / Plaza -->
  <path d="M 20 200 L 220 200 L 200 240 L 40 240 Z" fill="#475569" opacity="0.4"/>

  <!-- Medical Cross Symbol (Hospital Context) -->
  <g transform="translate(110, 35)">
    <circle cx="10" cy="10" r="16" fill="#059669" filter="url(#shadow)"/>
    <rect x="7" y="3" width="6" height="14" rx="2" fill="#ffffff"/>
    <rect x="3" y="7" width="14" height="6" rx="2" fill="#ffffff"/>
  </g>

  <!-- University Graduation Cap Icon (Affiliation/University Context) -->
  <g transform="translate(195, 45)">
    <circle cx="10" cy="10" r="14" fill="#2563eb" filter="url(#shadow)"/>
    <path d="M 4 10 L 10 7 L 16 10 L 10 13 Z" fill="#ffffff"/>
    <path d="M 7 11.5 L 7 14 C 7 15, 13 15, 13 14 L 13 11.5" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <path d="M 14.5 10.5 L 16 14" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Linking Dashed Arc (Visualizing "Affiliated / Trực thuộc") -->
  <path d="M 120 50 Q 150 20 200 45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M 120 50 Q 90 20 40 55" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- FOREGROUND: Characters (Doctor/Researcher & Student/Patient in front of the Hospital) -->
  
  <!-- Character 1: Doctor in White Coat (representing the Hospital staff) -->
  <g transform="translate(140, 130)">
    <!-- Shadow -->
    <ellipse cx="20" cy="73" rx="14" ry="4" fill="#000000" opacity="0.3"/>
    <!-- Body / Coat -->
    <path d="M 10 30 L 30 30 L 35 70 L 5 70 Z" fill="#f8fafc"/>
    <path d="M 20 30 L 20 70" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Stethoscope -->
    <path d="M 17 32 C 15 38, 25 38, 23 32" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="20" cy="42" r="3" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="20" cy="18" r="10" fill="#fcd34d"/>
    <path d="M 10 16 C 10 10, 30 10, 30 16 C 25 14, 15 14, 10 16 Z" fill="#334155"/>
    <!-- Face expression -->
    <circle cx="17" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="23" cy="18" r="1.5" fill="#1e293b"/>
    <path d="M 19 22 Q 20 24 21 22" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Character 2: University Student holding books (representing the University connection) -->
  <g transform="translate(60, 125)">
    <!-- Shadow -->
    <ellipse cx="20" cy="78" rx="14" ry="4" fill="#000000" opacity="0.3"/>
    <!-- Backpack -->
    <rect x="24" y="32" width="10" height="25" rx="3" fill="#ea580c"/>
    <!-- Body / Clothes -->
    <path d="M 10 35 L 30 35 L 35 75 L 5 75 Z" fill="#3b82f6"/>
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="10" fill="#fcd34d"/>
    <path d="M 9 18 C 10 10, 30 10, 31 18 C 28 15, 12 15, 9 18 Z" fill="#1e293b"/>
    <!-- Holding Folders / Books -->
    <rect x="5" y="45" width="14" height="18" rx="2" fill="#ffffff" transform="rotate(-10 12 54)" filter="url(#shadow)"/>
    <rect x="7" y="48" width="10" height="3" rx="1" fill="#cbd5e1" transform="rotate(-10 12 54)"/>
    <rect x="7" y="53" width="8" height="3" rx="1" fill="#38bdf8" transform="rotate(-10 12 54)"/>
    <!-- Face -->
    <circle cx="17" cy="20" r="1.5" fill="#1e293b"/>
    <circle cx="23" cy="20" r="1.5" fill="#1e293b"/>
    <path d="M 19 24 Q 20 26 21 24" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Props: Entrance Sign / Pillar details -->
  <rect x="95" y="105" width="50" height="15" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="103" cy="112.5" r="3" fill="#10b981"/>
  <circle cx="113" cy="112.5" r="3" fill="#f59e0b"/>
  <circle cx="123" cy="112.5" r="3" fill="#ef4444"/>

  <!-- Ambient glowing particles for rich vector feel -->
  <circle cx="40" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="90" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="180" cy="140" r="2" fill="#f59e0b" opacity="0.5"/>
  <circle cx="65" cy="180" r="1.5" fill="#10b981" opacity="0.7"/>
</svg>