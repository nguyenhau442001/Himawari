<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Scale base / Fulcrum -->
    <path d="M-12,50 L12,50 L20,80 L-20,80 Z" fill="#4B5563" />
    <polygon points="0,35 -15,50 15,50" fill="#9CA3AF" />
    <rect x="-6" y="20" width="12" height="20" fill="#D1D5DB" />

    <!-- Beam -->
    <path d="M-80,24 L80,24 L70,32 L-70,32 Z" fill="#6B7280" />

    <!-- Left Side: Upward force (Green - Profit/Gain) -->
    <g transform="translate(-75, 28)">
      <line x1="0" y1="0" x2="-25" y2="40" stroke="#9CA3AF" stroke-width="2" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="#9CA3AF" stroke-width="2" />
      <line x1="0" y1="0" x2="25" y2="40" stroke="#9CA3AF" stroke-width="2" />
      <path d="M-30,40 L30,40 L20,50 L-20,50 Z" fill="#3B82F6" />
      <!-- Upward stack of blocks (Profit) -->
      <rect x="-14" y="-8" width="28" height="12" rx="2" fill="#10B981" />
      <rect x="-14" y="-22" width="28" height="12" rx="2" fill="#34D399" />
      <rect x="-14" y="-36" width="28" height="12" rx="2" fill="#6EE7B7" />
      <!-- Upward arrow indicator -->
      <path d="M0,-48 L-8,-38 L8,-38 Z" fill="#10B981" />
    </g>

    <!-- Right Side: Downward force (Orange/Red - Cost/Counterbalance) -->
    <g transform="translate(75, 36)">
      <line x1="0" y1="0" x2="-25" y2="40" stroke="#9CA3AF" stroke-width="2" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="#9CA3AF" stroke-width="2" />
      <line x1="0" y1="0" x2="25" y2="40" stroke="#9CA3AF" stroke-width="2" />
      <path d="M-30,40 L30,40 L20,50 L-20,50 Z" fill="#3B82F6" />
      <!-- Downward stack of heavy blocks (Cost) -->
      <rect x="-14" y="-8" width="28" height="12" rx="2" fill="#EF4444" />
      <rect x="-14" y="-22" width="28" height="12" rx="2" fill="#F87171" />
      <rect x="-14" y="-36" width="28" height="12" rx="2" fill="#FCA5A5" />
      <!-- Downward arrow indicator -->
      <path d="M0,6 L-8,-4 L8,-4 Z" fill="#EF4444" />
    </g>

    <!-- Equilibrium / Balance Indicator (Center Fulcrum cap) -->
    <circle cx="0" cy="22" r="5" fill="#F59E0B" />
  </g>
</svg>