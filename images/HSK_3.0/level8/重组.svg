<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "重组" (Restructuring / Reorganization of assets/elements) -->
  <!-- Central physical object: A sleek, modular vault/chest or structural cube being dynamically re-assembled, representing asset restructuring -->
  
  <g transform="translate(120, 115)">
    <!-- Glow / Stage floor -->
    <ellipse cx="0" cy="55" rx="65" ry="16" fill="#101216" opacity="0.8"/>
    <ellipse cx="0" cy="55" rx="45" ry="10" fill="#FFB020" opacity="0.15"/>

    <!-- Disconnected/Floating Isometric structural blocks indicating reorganization -->
    
    <!-- Top-Left Module -->
    <g transform="translate(-32, -35)">
      <path d="M 0,-18 L 26,-8 L 0,2 L -26,-8 Z" fill="#2E384D"/>
      <path d="M -26,-8 L 0,2 L 0,30 L -26,20 Z" fill="#1F2633"/>
      <path d="M 0,2 L 26,-8 L 26,20 L 0,30 Z" fill="#3B4863"/>
      <!-- Accent light -->
      <path d="M -12,-3 L 0,-8 L 12,-3" stroke="#FFB020" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Top-Right Module -->
    <g transform="translate(32, -35)">
      <path d="M 0,-18 L 26,-8 L 0,2 L -26,-8 Z" fill="#3B4863"/>
      <path d="M -26,-8 L 0,2 L 0,30 L -26,20 Z" fill="#2E384D"/>
      <path d="M 0,2 L 26,-8 L 26,20 L 0,30 Z" fill="#242D3D"/>
      <!-- Accent slot -->
      <circle cx="0" cy="11" r="3" fill="#FFB020"/>
    </g>

    <!-- Bottom Central Module (Core Foundation being reorganized) -->
    <g transform="translate(0, 15)">
      <path d="M 0,-20 L 34,-8 L 0,4 L -34,-8 Z" fill="#3B4863"/>
      <path d="M -34,-8 L 0,4 L 0,36 L -34,24 Z" fill="#242D3D"/>
      <path d="M 0,4 L 34,-8 L 34,24 L 0,36 Z" fill="#2E384D"/>
      <!-- Gold core representing revitalized assets / new life -->
      <path d="M 0,12 L 12,7 L 0,2 L -12,7 Z" fill="#FFB020"/>
    </g>

    <!-- Dynamic Reorganization / Assembly Arrows -->
    <!-- Curved arrows guiding elements together smoothly -->
    <path d="M -55,-15 C -45,-35 -25,-40 -12,-38" stroke="#FFB020" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8"/>
    <polygon points="-12,-43 -6,-38 -14,-33" fill="#FFB020"/>

    <path d="M 55,-15 C 45,-35 25,-40 12,-38" stroke="#FFB020" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8"/>
    <polygon points="12,-43 14,-33 6,-38" fill="#FFB020"/>

    <path d="M -40,35 C -25,45 25,45 40,35" stroke="#FFB020" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
    <polygon points="42,30 46,38 37,39" fill="#FFB020"/>

    <!-- Central Spark of New Life / Synergy -->
    <circle cx="0" cy="-5" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="-5" r="9" fill="#FFB020" opacity="0.4"/>
  </g>
</svg>