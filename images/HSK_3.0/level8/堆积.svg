<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mountain-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bag-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bag-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bag-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient background glow from street light / moon -->
  <circle cx="190" cy="50" r="40" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Environment: Alley / Wall & Ground -->
  <!-- Brick/Wall backdrop -->
  <path d="M20 200 L20 80 L60 70 L60 200 Z" fill="#1e293b" opacity="0.6"/>
  <line x1="20" y1="100" x2="60" y2="90" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="130" x2="60" y2="120" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="160" x2="60" y2="150" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Ground -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16"/>
  <ellipse cx="120" cy="205" rx="100" ry="8" fill="#020617"/>

  <!-- TRASH MOUNTAIN (堆积如山 - Layered Trash Pile) -->
  <!-- Base shadow -->
  <ellipse cx="125" cy="200" rx="75" ry="15" fill="#020617" opacity="0.8"/>

  <!-- Back layer of mountain -->
  <path d="M 60 200 Q 90 130 110 110 Q 140 130 170 200 Z" fill="url(#mountain-base)"/>

  <!-- Mid layer / Individual massive garbage bags & clutter -->
  <!-- Large Yellow Bag Left -->
  <path d="M 65 200 Q 60 160 85 150 Q 105 160 100 200 Z" fill="url(#bag-yellow)"/>
  <path d="M 80 150 Q 85 140 90 150" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Large Blue Bag Center-Right -->
  <path d="M 100 200 Q 120 120 155 140 Q 175 170 170 200 Z" fill="url(#bag-blue)"/>
  <path d="M 130 140 Q 135 130 142 138" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

  <!-- Red/Pink Bag Peak -->
  <path d="M 95 140 Q 115 80 145 110 Q 155 130 135 150 Z" fill="url(#bag-red)"/>
  <path d="M 115 95 Q 120 85 128 92" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round"/>

  <!-- Foreground boxes, cans, and extra trash items adding to the pile -->
  <!-- Cardboard box collapsing -->
  <polygon points="140,200 170,180 195,195 175,210" fill="#b45309"/>
  <polygon points="170,180 195,195 195,180 170,165" fill="#d97706"/>
  
  <!-- Green bottle / cans -->
  <rect x="100" y="185" width="10" height="20" rx="3" fill="#10b981" transform="rotate(25 105 195)"/>
  <circle cx="115" cy="190" r="6" fill="#f43f5e"/>
  
  <!-- More bags in front -->
  <path d="M 75 200 Q 90 165 115 175 Q 125 195 110 200 Z" fill="#64748b"/>
  <path d="M 145 200 Q 165 160 185 190 Q 170 210 145 200 Z" fill="#475569"/>

  <!-- Trash spilling out details (banana peel, paper scraps) -->
  <path d="M 115 195 Q 125 190 135 198 Q 125 205 115 195 Z" fill="#facc15"/>
  <path d="M 85 180 Q 95 185 90 195" fill="none" stroke="#f8fafc" stroke-width="2"/>

  <!-- CHARACTER: Frustrated / Overwhelmed Resident or Cleaner -->
  <!-- Character Body / Torso -->
  <path d="M 35 200 Q 38 175 50 175 Q 62 175 65 200 Z" fill="#38bdf8"/>
  
  <!-- Character Head -->
  <circle cx="50" cy="155" r="14" fill="#fcd34d"/>
  
  <!-- Hair -->
  <path d="M 38 153 Q 50 140 62 153 Q 58 147 50 146 Q 42 147 38 153 Z" fill="#334155"/>

  <!-- Face expression: Shocked / Overwhelmed (Wide eyes, open mouth) -->
  <circle cx="45" cy="155" r="2" fill="#1e293b"/>
  <circle cx="55" cy="155" r="2" fill="#1e293b"/>
  <ellipse cx="50" cy="163" rx="3" ry="4" fill="#1e293b"/>

  <!-- Arms expressing despair/hands on head -->
  <path d="M 38 180 Q 30 165 40 155" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round"/>
  <path d="M 62 180 Q 70 165 60 155" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round"/>

  <!-- Sparkle / Sweat drop of stress -->
  <path d="M 65 145 Q 68 150 65 153 Q 62 150 65 145 Z" fill="#38bdf8"/>
  
  <!-- Lighting Highlights on the trash mountain -->
  <path d="M 105 105 Q 115 90 130 100" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 145 145 Q 155 135 160 145" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>