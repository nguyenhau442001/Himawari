<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground/Path -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#334155"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Character: The man walking steadily -->
  <g transform="translate(120, 110)">
    <!-- Legs in steady stride -->
    <path d="M-10 40 L-10 80 M10 40 L30 80" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <!-- Torso -->
    <rect x="-15" y="-20" width="30" height="60" rx="8" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="20" fill="#fde68a"/>
    <!-- Arms -->
    <path d="M-15 0 L-30 20 M15 0 L30 20" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Environmental Details: Steady balance indicators -->
  <circle cx="50" cy="60" r="5" fill="#fb923c" opacity="0.6"/>
  <circle cx="190" cy="80" r="8" fill="#10b981" opacity="0.4"/>
  <path d="M20 210 Q60 180 100 210 T180 210" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Focus highlights on the feet to emphasize "bùfá" -->
  <ellipse cx="110" cy="190" rx="15" ry="5" fill="#fbbf24" opacity="0.3"/>
  <ellipse cx="150" cy="190" rx="15" ry="5" fill="#fbbf24" opacity="0.3"/>
</svg>