<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk/Surface -->
  <rect x="40" y="160" width="160" height="10" fill="#343A46" rx="2"/>
  
  <!-- The Manager (Character) -->
  <g transform="translate(120, 120)">
    <!-- Body/Suit -->
    <path d="M-30 20 L30 20 L25 80 L-25 80 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#E2E8F0"/>
    <!-- Eyes (Closed/Looking down in frustration/inefficiency) -->
    <line x1="-10" y1="-25" x2="-2" y2="-25" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="-25" x2="10" y2="-25" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth (Frown) -->
    <path d="M-8 -10 Q0 -5 8 -10" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>

  <!-- The "Ineffective" Oversight Element: A stack of neglected, messy documents -->
  <g transform="translate(160, 140)">
    <rect x="-20" y="-30" width="40" height="50" fill="#CBD5E0" rx="2"/>
    <rect x="-15" y="-25" width="30" height="5" fill="#A0AEC0" rx="1"/>
    <rect x="-15" y="-15" width="30" height="5" fill="#A0AEC0" rx="1"/>
    <rect x="-15" y="-5" width="30" height="5" fill="#A0AEC0" rx="1"/>
    <!-- Warning sign on top of papers (Orange accent for focus) -->
    <path d="M0 -45 L15 -20 L-15 -20 Z" fill="#F6AD55"/>
    <rect x="-2" y="-35" width="4" height="10" fill="#1A1D24" rx="1"/>
    <circle cx="0" cy="-23" r="2" fill="#1A1D24"/>
  </g>

  <!-- Hand gesture indicating lack of effort/ineffectiveness -->
  <g transform="translate(80, 150)">
    <path d="M0 0 L10 -20 L20 -10 L10 10 Z" fill="#E2E8F0"/>
    <path d="M10 10 L15 20 L5 25 L0 15 Z" fill="#E2E8F0"/>
  </g>
</svg>