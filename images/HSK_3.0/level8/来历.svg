<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="15" rx="2" fill="#475569"/>
  <rect x="60" y="175" width="10" height="50" rx="2" fill="#334155"/>
  <rect x="170" y="175" width="10" height="50" rx="2" fill="#334155"/>
  
  <!-- Antique Vase -->
  <path d="M105 160 L115 110 C115 90, 135 90, 135 110 L145 160 Z" fill="#fbbf24"/>
  <path d="M110 115 C110 100, 140 100, 140 115" stroke="#f59e0b" stroke-width="3" fill="none"/>
  
  <!-- Magnifying Glass -->
  <circle cx="155" cy="130" r="15" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="165" y="140" width="25" height="6" rx="2" fill="#64748b" transform="rotate(45 165 140)"/>
  
  <!-- Character: Appraiser -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M15 20 Q20 28 25 20" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="10" y="40" width="20" height="50" rx="5" fill="#38bdf8"/>
    <rect x="5" y="45" width="10" height="30" rx="3" fill="#38bdf8"/>
    <rect x="25" y="45" width="10" height="30" rx="3" fill="#38bdf8"/>
  </g>
  
  <!-- Question Mark Effect -->
  <path d="M140 80 Q150 60 160 80 T160 100" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="160" cy="110" r="3" fill="#ec4899"/>
  
  <!-- Dust particles -->
  <circle cx="120" cy="100" r="1" fill="#fb923c"/>
  <circle cx="130" cy="90" r="1.5" fill="#fb923c"/>
  <circle cx="145" cy="115" r="1" fill="#fb923c"/>
</svg>