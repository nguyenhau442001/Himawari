<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Office Lighting Gradient -->
    <linearGradient id="warmGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting from Ceiling Lamp -->
  <polygon points="120,0 60,240 180,240" fill="url(#warmGlow)" />

  <!-- Office Background Context -->
  <!-- Back Wall / Window Frame -->
  <rect x="30" y="25" width="80" height="105" rx="4" fill="url(#windowGlow)" stroke="#334155" stroke-width="2" />
  <!-- City Skyline Silhouette outside window -->
  <path d="M38,130 L38,100 L45,100 L45,130 L55,130 L55,85 L65,85 L65,130 L75,130 L75,70 L90,70 L90,130 L102,130 L102,90 L110,90 L110,130 Z" fill="#1e293b" opacity="0.6" />
  
  <!-- Hanging Office Plant -->
  <path d="M190,25 C190,40 210,40 210,25" fill="none" stroke="#64748b" stroke-width="2" />
  <circle cx="200" cy="40" r="14" fill="#334155" />
  <path d="M190,40 Q185,55 180,65 M200,45 Q205,60 215,70 M210,40 Q220,55 225,60" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- Bookshelf / Storage in Background -->
  <rect x="170" y="80" width="45" height="90" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="170" y1="110" x2="215" y2="110" stroke="#334155" stroke-width="1.5" />
  <line x1="170" y1="140" x2="215" y2="140" stroke="#334155" stroke-width="1.5" />
  <rect x="178" y="92" width="8" height="16" fill="#38bdf8" rx="1" />
  <rect x="188" y="90" width="6" height="18" fill="#f43f5e" rx="1" />
  <rect x="196" y="94" width="10" height="14" fill="#fbbf24" rx="1" />

  <!-- Main Office Desk -->
  <path d="M30,165 L210,165 L200,210 L40,210 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="30" y="160" width="180" height="8" rx="2" fill="#334155" />

  <!-- Desk Props (Laptop, Lamp, Coffee Mug, Documents) -->
  <!-- Laptop -->
  <path d="M135,160 L175,160 L185,150 L125,150 Z" fill="#94a3b8" />
  <path d="M120,150 L180,150 L178,130 L122,130 Z" fill="#cbd5e1" />
  <rect x="126" y="134" width="48" height="13" fill="#0ea5e9" rx="1" />
  <!-- Coffee Mug -->
  <circle cx="65" cy="153" r="6" fill="#f43f5e" />
  <path d="M71,151 C75,151 75,157 71,157" fill="none" stroke="#f43f5e" stroke-width="1.5" />
  <!-- Contract Papers on Desk -->
  <rect x="95" y="148" width="22" height="16" rx="1" fill="#f8fafc" transform="rotate(-10 95 148)" />
  <line x1="98" y1="152" x2="112" y2="152" stroke="#64748b" stroke-width="1" transform="rotate(-10 95 148)" />
  <line x1="98" y1="156" x2="108" y2="156" stroke="#64748b" stroke-width="1" transform="rotate(-10 95 148)" />

  <!-- CHARACTER 1: Manager / Employer (Left) -->
  <!-- Body / Torso -->
  <path d="M65,130 Q65,115 80,115 L95,115 Q110,115 110,130 L115,180 L60,180 Z" fill="#2563eb" />
  <!-- Shirt Collar / Tie -->
  <polygon points="87,115 80,128 95,128" fill="#f8fafc" />
  <polygon points="86,126 88,126 90,148 84,148" fill="#ef4444" />
  <!-- Head -->
  <circle cx="87" cy="98" r="16" fill="#fbcfe8" />
  <!-- Hair -->
  <path d="M71,98 C71,85 103,85 103,98 C103,94 98,89 87,89 C76,89 71,94 71,98 Z" fill="#1e293b" />
  <!-- Glasses -->
  <rect x="78" y="93" width="8" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="88" y="93" width="8" height="6" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="86" y1="96" x2="88" y2="96" stroke="#1e293b" stroke-width="1.5" />
  <!-- Friendly Smiling Mouth -->
  <path d="M83,105 Q87,109 91,105" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Arm & Hand shaking / welcoming new employee -->
  <path d="M100,120 Q120,125 130,135" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
  <circle cx="133" cy="138" r="5" fill="#fbcfe8" />

  <!-- CHARACTER 2: New Employee / Hired Person (Right) -->
  <!-- Body / Torso -->
  <path d="M130,130 Q130,115 145,115 L165,115 Q180,115 180,130 L185,185 L125,185 Z" fill="#10b981" />
  <!-- Shirt Collar -->
  <polygon points="155,115 148,128 162,128" fill="#f8fafc" />
  <!-- Head -->
  <circle cx="155" cy="96" r="16" fill="#fed7aa" />
  <!-- Hair -->
  <path d="M139,96 C139,80 171,80 171,96 C165,88 145,88 139,96 Z" fill="#78350f" />
  <!-- Happy Closed Eyes (Joyful expression) -->
  <path d="M148,93 Q151,96 154,93" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M158,93 Q161,96 164,93" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Big Smile -->
  <path d="M150,102 Q155,108 160,102" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Arm shaking hands -->
  <path d="M135,125 Q125,130 133,138" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
  
  <!-- Handshake overlap effect -->
  <circle cx="133" cy="137" r="5.5" fill="#fbcfe8" stroke="#fed7aa" stroke-width="2" />

  <!-- Foreground decorative elements for depth -->
  <!-- Plant pot on right desk corner -->
  <rect x="195" y="145" width="14" height="16" rx="2" fill="#f43f5e" />
  <path d="M202,145 Q190,130 195,120 Q202,135 202,145 Z" fill="#10b981" />
  <path d="M202,145 Q215,130 210,120 Q202,135 202,145 Z" fill="#34d399" />

  <!-- Sparkling / Success Accent Effects -->
  <path d="M110,80 L113,88 L121,91 L113,94 L110,102 L107,94 L99,91 L107,88 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M140,65 L142,70 L147,72 L142,74 L140,79 L138,74 L133,72 L138,70 Z" fill="#38bdf8" opacity="0.9" />
  <circle cx="70" cy="75" r="3" fill="#34d399" opacity="0.7" />
  <circle cx="175" cy="70" r="2.5" fill="#fbbf24" opacity="0.8" />
</svg>