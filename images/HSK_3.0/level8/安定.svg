<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Foundation/Ground -->
  <path d="M40 190 H200 V195 H40 Z" fill="#3B4252"/>
  
  <!-- House Structure (Representing stability/security) -->
  <path d="M70 190 V120 L120 90 L170 120 V190 Z" fill="#2E3440" stroke="#FFB86C" stroke-width="2"/>
  <path d="M70 120 L120 90 L170 120 Z" fill="#FFB86C"/>
  
  <!-- Door -->
  <rect x="105" y="140" width="30" height="50" fill="#1A1D24" stroke="#FFB86C" stroke-width="2"/>
  
  <!-- Window -->
  <rect x="80" y="130" width="20" height="20" fill="#FFB86C"/>
  <rect x="140" y="130" width="20" height="20" fill="#FFB86C"/>
  
  <!-- Tree (Representing growth and peace) -->
  <rect x="180" y="170" width="8" height="20" fill="#4C566A"/>
  <circle cx="184" cy="160" r="15" fill="#A3BE8C"/>
  
  <!-- Calm Atmosphere (Sun/Moon setting) -->
  <circle cx="200" cy="50" r="25" fill="#F9C74F"/>
  
  <!-- Human Figure standing calmly -->
  <g transform="translate(50, 150)">
    <circle cx="10" cy="10" r="8" fill="#D8DEE9"/>
    <path d="M10 18 L10 35 M10 25 L2 30 M10 25 L18 30 M10 35 L5 45 M10 35 L15 45" stroke="#D8DEE9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>