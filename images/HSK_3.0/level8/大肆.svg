<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Window/Spam Light Cone -->
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0"/>
    </linearGradient>
    
    <!-- Neon Accent Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Interior Details -->
  <!-- Wallpaper lines / Studio vibe -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="30" y1="0" x2="30" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="240"/>
  </g>

  <!-- Floating "Spam/Overload" Promotional Elements (Representing '大肆宣传' - spreading everywhere uncontrollably) -->
  <g filter="url(#neonGlow)">
    <!-- Floating Ad Banner 1 -->
    <g transform="translate(18, 45) rotate(-12)">
      <rect width="55" height="28" rx="6" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
      <!-- Abstract Product Shape -->
      <circle cx="15" cy="14" r="6" fill="#fb923c"/>
      <rect x="26" y="9" width="22" height="4" rx="2" fill="#fb923c"/>
      <rect x="26" y="16" width="16" height="3" rx="1.5" fill="#64748b"/>
    </g>

    <!-- Floating Ad Banner 2 -->
    <g transform="translate(165, 30) rotate(15)">
      <rect width="60" height="32" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
      <polygon points="12,20 18,10 24,20" fill="#ec4899"/>
      <rect x="28" y="11" width="24" height="4" rx="2" fill="#ec4899"/>
      <rect x="28" y="18" width="18" height="3" rx="1.5" fill="#64748b"/>
    </g>

    <!-- Floating Notification / Megaphone Sparkles -->
    <g transform="translate(25, 115) rotate(-6)">
      <rect width="45" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
      <rect x="20" y="9" width="18" height="3" rx="1.5" fill="#38bdf8"/>
      <rect x="20" y="15" width="12" height="2" rx="1" fill="#64748b"/>
    </g>

    <g transform="translate(170, 100) rotate(8)">
      <rect width="50" height="26" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="13" cy="13" r="4" fill="#10b981"/>
      <rect x="21" y="10" width="20" height="3" rx="1.5" fill="#10b981"/>
      <rect x="21" y="16" width="14" height="2" rx="1" fill="#64748b"/>
    </g>
  </g>

  <!-- Connection / Broadcast Waves radiating from the desk -->
  <path d="M 90 120 Q 70 90 50 110" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 150 120 Q 170 90 190 110" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 100 110 Q 120 70 140 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Desk Surface -->
  <rect x="30" y="195" width="180" height="12" rx="3" fill="#334155"/>
  <rect x="20" y="207" width="200" height="8" rx="2" fill="#1e293b"/>

  <!-- Laptop / Dual Monitors Setup -->
  <!-- Main Monitor Stand & Base -->
  <rect x="110" y="175" width="20" height="22" fill="#475569"/>
  <ellipse cx="120" cy="197" rx="25" ry="3" fill="#64748b"/>

  <!-- Main Monitor Screen -->
  <rect x="75" y="105" width="90" height="72" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="79" y="109" width="82" height="64" rx="4" fill="url(#screenGlow)"/>

  <!-- Abstract UI elements on screen (Overflowing popups) -->
  <rect x="87" y="118" width="35" height="22" rx="3" fill="#38bdf8" opacity="0.8"/>
  <rect x="127" y="118" width="26" height="22" rx="3" fill="#fb923c" opacity="0.8"/>
  <rect x="87" y="145" width="66" height="20" rx="3" fill="#ec4899" opacity="0.8"/>

  <!-- Character: Overzealous Promoter / Entrepreneur -->
  <g transform="translate(0, 0)">
    <!-- Chair Back -->
    <path d="M 100 140 L 140 140 L 145 200 L 95 200 Z" fill="#334155" opacity="0.5"/>

    <!-- Body / Torso (Leaning forward enthusiastically) -->
    <path d="M 95 160 Q 120 155 145 165 L 155 205 L 85 205 Z" fill="#6366f1"/> <!-- Hoodie/Shirt -->
    <path d="M 105 163 Q 120 160 135 163 L 138 185 L 102 185 Z" fill="#e2e8f0"/> <!-- Collar/Inner shirt -->

    <!-- Arms in active typing / clicking gesture -->
    <!-- Left Arm -->
    <path d="M 95 165 Q 75 175 88 190" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Arm (Raised in excitement/action) -->
    <path d="M 145 168 Q 165 155 155 138" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="88" cy="192" r="5" fill="#fbcfe8"/>
    <circle cx="153" cy="135" r="5" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="113" y="146" width="14" height="18" rx="4" fill="#fbcfe8"/>

    <!-- Head (Expressive, wide-eyed, frantic energy) -->
    <g transform="translate(120, 130)">
      <!-- Hair -->
      <path d="M -18 -8 Q -5 -25 15 -10 Q 22 -3 18 10 Q 15 15 -15 12 Q -22 0 -18 -8 Z" fill="#1e293b"/>
      
      <!-- Face Base -->
      <ellipse cx="0" cy="5" rx="16" ry="18" fill="#fbcfe8"/>

      <!-- Glasses (Creative tech entrepreneur style) -->
      <rect x="-14" y="-2" width="12" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="2"/>
      <rect x="2" y="-2" width="12" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="2"/>
      <line x1="-2" y1="3" x2="2" y2="3" stroke="#0f172a" stroke-width="2"/>

      <!-- Wide Excited Eyes -->
      <circle cx="-8" cy="3" r="3" fill="#0f172a"/>
      <circle cx="8" cy="3" r="3" fill="#0f172a"/>
      <circle cx="-7" cy="2" r="1" fill="#ffffff"/>
      <circle cx="9" cy="2" r="1" fill="#ffffff"/>

      <!-- Eyebrows raised high -->
      <path d="M -12 -7 Q -8 -11 -4 -7" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 4 -7 Q 8 -11 12 -7" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Big Grin / Laughing out loud -->
      <path d="M -7 10 Q 0 18 7 10" fill="#0f172a"/>
      <path d="M -5 10 Q 0 14 5 10" fill="#f43f5e"/>
    </g>
  </g>

  <!-- Foreground Props (Cluttered desk elements reinforcing the "massive online push") -->
  <!-- Coffee Mug -->
  <rect x="52" y="178" width="14" height="18" rx="3" fill="#fbbf24"/>
  <path d="M 66 182 Q 72 182 72 187 Q 72 192 66 192" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam from coffee -->
  <path d="M 56 172 Q 59 167 56 162" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 62 174 Q 65 169 62 164" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Smartphone showing notification explosion -->
  <g transform="translate(162, 170) rotate(12)">
    <rect width="22" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="3" y="4" width="16" height="27" rx="2" fill="#38bdf8" opacity="0.4"/>
    <circle cx="11" cy="18" r="4" fill="#fb923c"/>
  </g>

  <!-- Extra explosive promotional starbursts in corners -->
  <g transform="translate(210, 160)" fill="#fbbf24">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2"/>
  </g>
  <g transform="translate(30, 80)" fill="#38bdf8">
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5"/>
  </g>
</svg>