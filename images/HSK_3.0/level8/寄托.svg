<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Magical Emotional Glow (Poem to Heart/Feeling) -->
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Paper Scroll Gradient -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Background Environment: Traditional Study Room -->
  <g id="environment">
    <!-- Bookshelf in background -->
    <rect x="25" y="45" width="40" height="90" rx="4" fill="#334155" opacity="0.4"/>
    <line x1="25" y1="75" x2="65" y2="75" stroke="#1e293b" stroke-width="3"/>
    <line x1="25" y1="105" x2="65" y2="105" stroke="#1e293b" stroke-width="3"/>
    <!-- Books on shelf -->
    <path d="M32 75 L32 60 L38 60 L38 75 Z" fill="#64748b"/>
    <path d="M40 75 L40 57 L47 57 L47 75 Z" fill="#0284c7"/>
    <path d="M32 105 L32 90 L39 90 L39 105 Z" fill="#10b981"/>

    <!-- Round Window with Night Sky / Moon -->
    <circle cx="195" cy="70" r="30" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <!-- Moon & Stars -->
    <circle cx="205" cy="60" r="8" fill="#fef08a" opacity="0.9"/>
    <circle cx="180" cy="55" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="185" cy="85" r="1" fill="#ffffff" opacity="0.6"/>

    <!-- Wooden Desk -->
    <path d="M 60 170 L 210 170 L 225 210 L 45 210 Z" fill="#475569"/>
    <path d="M 50 162 L 220 162 L 210 170 L 60 170 Z" fill="#64748b"/>
    <!-- Desk Lamp / Inkstone props -->
    <ellipse cx="200" cy="165" rx="10" ry="4" fill="#38bdf8"/>
    <!-- Brush Holder -->
    <rect x="175" y="145" width="8" height="20" rx="2" fill="#94a3b8"/>
    <line x1="179" y1="145" x2="176" y2="135" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="179" y1="145" x2="182" y2="137" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Poet Character -->
  <g id="poet-character">
    <!-- Chair Back -->
    <path d="M 85 130 Q 80 100 95 80 L 115 80 Q 125 100 120 130 Z" fill="#334155"/>

    <!-- Body / Torso -->
    <path d="M 80 175 C 80 145 95 135 110 135 C 125 135 140 145 140 175 Z" fill="url(#robeGrad)"/>
    <!-- Shoulders / Robe Collar -->
    <path d="M 78 145 L 110 155 L 142 145" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

    <!-- Head & Face -->
    <circle cx="110" cy="115" rx="18" ry="20" fill="#fbcfe8"/>
    <!-- Hair & Scholar Cap/Bun -->
    <path d="M 92 110 C 92 95 128 95 128 110 C 128 115 125 120 125 120 L 95 120 C 95 120 92 115 92 110 Z" fill="#1e293b"/>
    <circle cx="110" cy="93" r="6" fill="#1e293b"/>
    
    <!-- Gentle, thoughtful facial expression (Profile/Three-quarters) -->
    <!-- Closed/Thoughtful Eye -->
    <path d="M 115 112 Q 119 116 123 112" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <circle cx="120" cy="120" r="4" fill="#fb7185" opacity="0.5"/>

    <!-- Arms & Hands -->
    <!-- Left arm holding scroll base -->
    <path d="M 85 150 C 75 160 80 175 90 175" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <!-- Right arm extending forward to write/emanate emotion -->
    <path d="M 135 150 C 150 155 155 165 145 170" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="145" cy="170" r="5" fill="#fbcfe8"/> <!-- Hand -->
  </g>

  <!-- The Poem Scroll (Centerpiece) -->
  <g id="poem-scroll">
    <!-- Unrolling Scroll on Desk -->
    <path d="M 90 175 Q 120 160 160 170 L 165 185 Q 125 195 95 185 Z" fill="url(#scrollGrad)" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Scroll Handles (Ends) -->
    <ellipse cx="90" cy="180" rx="4" ry="7" fill="#b45309"/>
    <ellipse cx="165" cy="178" rx="4" ry="7" fill="#b45309"/>

    <!-- Abstract Calligraphic Lines on Scroll (representing poetry, NO real words) -->
    <line x1="105" y1="173" x2="120" y2="171" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="125" y1="174" x2="140" y2="172" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="145" y1="175" x2="155" y2="173" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Visual Metaphor: "寄托" (Channeling/Embodiment of Emotion into Art) -->
  <g id="emotional-energy-transfer">
    <!-- Magic glow ambient -->
    <circle cx="145" cy="140" r="45" fill="url(#magicGlow)"/>

    <!-- Floating Glowing Hearts & Emotional Orbs rising from the scroll -->
    <path d="M 130 145 C 130 138 138 133 143 138 C 148 133 156 138 156 145 C 156 153 143 160 143 160 C 143 160 130 153 130 145 Z" fill="#f43f5e" opacity="0.9"/>
    
    <!-- Smaller sparkling emotion particles -->
    <circle cx="160" cy="125" r="4" fill="#fb7185" opacity="0.8"/>
    <circle cx="125" cy="120" r="3" fill="#f43f5e" opacity="0.7"/>
    <circle cx="140" cy="105" r="5" fill="#fda4af" opacity="0.9"/>
    
    <!-- Swirling magical flow lines connecting poet's heart/mind to the poem -->
    <path d="M 120 125 Q 130 115 140 135" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3" opacity="0.8" stroke-linecap="round"/>
    <path d="M 143 135 Q 150 115 160 125" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Elements (Lighting & Depth) -->
  <!-- Vignette overlay edges -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.5"/>
</svg>