<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Amber Glow from Office/Workspace Window -->
    <radialGradient id="window-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Glow for Spine/Backbone Focus -->
    <radialGradient id="spine-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back wall details & window frame simulating an office or study -->
  <g id="environment">
    <!-- Window structure -->
    <rect x="130" y="25" width="75" height="110" rx="4" fill="#334155" opacity="0.4" />
    <rect x="135" y="30" width="65" height="100" fill="url(#window-glow)" />
    <!-- Window Panes -->
    <line x1="167" y1="30" x2="167" y2="130" stroke="#1e293b" stroke-width="2" opacity="0.6" />
    <line x1="135" y1="80" x2="200" y2="80" stroke="#1e293b" stroke-width="2" opacity="0.6" />

    <!-- Ambient Plant Shelf -->
    <rect x="25" y="55" width="65" height="6" rx="3" fill="#475569" />
    <!-- Potted Plant -->
    <path d="M 45 55 L 50 40 L 60 40 L 65 55 Z" fill="#64748b" />
    <path d="M 55 40 C 45 30 40 20 45 15 C 52 20 55 30 55 40 Z" fill="#10b981" />
    <path d="M 55 40 C 65 30 70 20 65 15 C 58 20 55 30 55 40 Z" fill="#059669" />

    <!-- Wooden Desk -->
    <path d="M 10 195 L 230 195 L 220 215 L 20 215 Z" fill="#334155" />
    <rect x="15" y="190" width="210" height="8" rx="2" fill="#475569" />

    <!-- Desk Props: Laptop & Notebook -->
    <rect x="150" y="170" width="45" height="20" rx="2" fill="#64748b" />
    <polygon points="145,190 205,190 210,195 140,195" fill="#475569" />
    <rect x="80" y="180" width="30" height="12" rx="1" fill="#cbd5e1" />
    <line x1="85" y1="184" x2="105" y2="184" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="85" y1="188" x2="100" y2="188" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- MAIN CHARACTER: Straining / Straightening Up (直起脊梁) -->
  <!-- Scene captures the dynamic moment of stretching/straightening the spine -->
  <g id="character" transform="translate(15, 10)">
    
    <!-- Spine Line Highlight (Visualizing "脊梁" - Backbone/Spine concept subtly) -->
    <ellipse cx="87" cy="115" rx="30" ry="40" fill="url(#spine-highlight)" />

    <!-- Chair -->
    <g id="office-chair" filter="url(#soft-shadow)">
      <!-- Chair Base/Wheels -->
      <circle cx="90" cy="185" r="18" fill="#1e293b" />
      <path d="M 75 195 L 60 205 M 105 195 L 120 205 M 90 195 L 90 210" stroke="#475569" stroke-width="4" stroke-linecap="round" />
      <rect x="82" y="140" width="16" height="45" rx="4" fill="#334155" />
      <!-- Chair Seat -->
      <rect x="65" y="130" width="55" height="14" rx="4" fill="#475569" />
      <!-- Chair Backrest (Angled back, showing he just stood up/straightened from it) -->
      <path d="M 68 75 L 80 135 L 110 135 L 100 75 Z" fill="#334155" />
    </g>

    <!-- Character Body -->
    <!-- Legs (Standing upright firmly next to chair) -->
    <g id="legs">
      <!-- Back Leg -->
      <path d="M 75 140 L 70 195 L 82 195 L 85 155 Z" fill="#1d4ed8" />
      <rect x="68" y="193" width="16" height="8" rx="3" fill="#0f172a" />
      <!-- Front Leg -->
      <path d="M 95 140 L 100 195 L 112 195 L 103 155 Z" fill="#2563eb" />
      <rect x="98" y="193" width="16" height="8" rx="3" fill="#0f172a" />
    </g>

    <!-- Torso demonstrating the straight spine (直起脊梁) -->
    <g id="torso" filter="url(#soft-shadow)">
      <!-- Shirt (Professional modern blazer/shirt combo) -->
      <path d="M 72 75 C 75 75 105 75 108 75 C 112 105 110 140 102 145 C 90 150 78 150 75 145 C 70 140 68 105 72 75 Z" fill="#f8fafc" />
      
      <!-- Jacket / Vest Layer emphasizing upright posture -->
      <path d="M 72 75 L 83 75 L 83 145 L 75 145 C 70 140 68 105 72 75 Z" fill="#3b82f6" />
      <path d="M 108 75 L 97 75 L 97 145 L 102 145 C 110 140 112 105 108 75 Z" fill="#3b82f6" />
      
      <!-- Tie / Collar detail -->
      <polygon points="90,75 87,95 93,95" fill="#ef4444" />
      <polygon points="87,75 93,75 90,82" fill="#0f172a" />
    </g>

    <!-- Arms stretched/relaxed in confident, upright stance -->
    <g id="arms">
      <!-- Left Arm (Behind/At side) -->
      <path d="M 70 78 L 58 115 L 68 120 L 76 90 Z" fill="#2563eb" />
      <circle cx="64" cy="122" r="5" fill="#f1f5f9" />

      <!-- Right Arm (Slightly raised or firmly placed on hip/side, showing strength and resolve) -->
      <path d="M 110 78 L 122 110 L 112 115 L 104 90 Z" fill="#3b82f6" />
      <circle cx="118" cy="113" r="5" fill="#f1f5f9" />
    </g>

    <!-- Neck & Head -->
    <g id="head">
      <!-- Neck -->
      <rect x="85" y="62" width="10" height="16" fill="#f1f5f9" />

      <!-- Head Base -->
      <circle cx="90" cy="45" r="18" fill="#f8fafc" />

      <!-- Hair (Clean, determined styling) -->
      <path d="M 72 45 C 72 30 80 26 92 27 C 105 28 108 38 108 48 L 105 48 C 105 35 98 30 90 30 C 80 30 75 38 75 48 Z" fill="#0f172a" />
      
      <!-- Face profile / expression (Confident, resolute look looking forward) -->
      <circle cx="101" cy="46" r="1.5" fill="#0f172a" />
      <path d="M 102 52 Q 105 54 102 55" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M 97 43 Q 100 42 103 44" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>

  </g>

  <!-- FOREGROUND / DYNAMIC ELEMENTS -->
  <!-- Subtle motion lines or energy rays highlighting the act of straightening up -->
  <g id="motion-effects" opacity="0.6">
    <line x1="75" y1="95" x2="68" y2="95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="115" y1="95" x2="122" y2="95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    
    <!-- Upward directional indicator dots -->
    <circle cx="90" cy="15" r="2" fill="#fbbf24" opacity="0.8" />
    <circle cx="105" cy="22" r="1.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="75" cy="22" r="1.5" fill="#38bdf8" opacity="0.6" />
  </g>
</svg>