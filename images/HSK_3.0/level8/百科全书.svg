<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glows -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Encyclopedia Book Illustration -->
  <g transform="translate(0, 5)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="195" rx="65" ry="12" fill="#101217" opacity="0.8"/>

    <!-- Book Pages Block (Bottom/Back) -->
    <path d="M 60,145 L 60,175 C 60,185 85,190 120,190 C 155,190 180,185 180,175 L 180,145 C 180,155 155,160 120,160 C 85,160 60,155 60,145 Z" fill="#2C3440"/>
    
    <!-- Pages side cut lines -->
    <line x1="75" y1="155" x2="165" y2="155" stroke="#3A4454" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="163" x2="165" y2="163" stroke="#3A4454" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="171" x2="165" y2="171" stroke="#3A4454" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Cover -->
    <path d="M 50,60 C 50,60 80,55 116,68 L 116,165 C 80,152 50,157 50,157 Z" fill="#1B4D8E"/>
    
    <!-- Right Cover -->
    <path d="M 190,60 C 190,60 160,55 124,68 L 124,165 C 160,152 190,157 190,157 Z" fill="#1B4D8E"/>

    <!-- Spine -->
    <path d="M 116,68 L 124,68 L 124,165 L 116,165 Z" fill="#123564"/>

    <!-- Cover Inner Border / Gold Foil Accents -->
    <path d="M 62,72 C 62,72 82,68 110,77 L 110,148 C 82,139 62,143 62,143 Z" fill="none" stroke="#F4A261" stroke-width="1.5" opacity="0.8"/>
    <path d="M 178,72 C 178,72 158,68 130,77 L 130,148 C 158,139 178,143 178,143 Z" fill="none" stroke="#F4A261" stroke-width="1.5" opacity="0.8"/>

    <!-- Center Globe/Knowledge Motif on Cover (Left Page) -->
    <circle cx="86" cy="108" r="16" fill="#123564" stroke="#F4A261" stroke-width="1.5"/>
    <path d="M 72,108 L 100,108" stroke="#F4A261" stroke-width="1" opacity="0.7"/>
    <path d="M 86,92 C 80,98 80,118 86,124" stroke="#F4A261" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M 86,92 C 92,98 92,118 86,124" stroke="#F4A261" stroke-width="1" fill="none" opacity="0.7"/>

    <!-- Center Emblem on Right Page -->
    <rect x="140" y="96" width="24" height="24" rx="3" fill="#123564" stroke="#F4A261" stroke-width="1.5" transform="rotate(45 152 108)"/>
    <circle cx="152" cy="108" r="4" fill="#F4A261"/>

    <!-- Ribbon Bookmark hanging down -->
    <path d="M 118,65 L 118,135 L 122,145 L 126,135 L 126,65 Z" fill="#E76F51"/>

    <!-- Glowing Knowledge / Sparkles representing "All-Encompassing" (百科) -->
    <g fill="#F4A261">
      <!-- Top Left Sparkle -->
      <path d="M 45,45 Q 45,55 35,55 Q 45,55 45,65 Q 45,55 55,55 Q 45,55 45,45" opacity="0.9"/>
      
      <!-- Top Right Sparkle -->
      <path d="M 195,40 Q 195,48 187,48 Q 195,48 195,56 Q 195,48 203,48 Q 195,48 195,40" opacity="0.7"/>
      
      <!-- Far Right Sparkle -->
      <path d="M 210,95 Q 210,101 204,101 Q 210,101 210,107 Q 210,101 216,101 Q 210,101 210,95" opacity="0.8"/>
      
      <!-- Far Left Sparkle -->
      <path d="M 30,110 Q 30,116 24,116 Q 30,116 30,122 Q 30,116 36,116 Q 30,116 30,110" opacity="0.6"/>

      <!-- Small floating nodes of data/wisdom -->
      <circle cx="65" cy="40" r="2" opacity="0.5"/>
      <circle cx="175" cy="35" r="3" opacity="0.6"/>
      <circle cx="195" cy="130" r="2" opacity="0.4"/>
      <circle cx="42" cy="145" r="2.5" opacity="0.5"/>
    </g>
  </g>
</svg>