<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="desk-light" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Shadow -->
    <linearGradient id="skin-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Question Mark Glow/Float Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#desk-light)" />

  <!-- Background Environment (Detective/Mystery Room Context) -->
  <!-- Bookshelf / Wall Grid -->
  <path d="M30 40 H210 V140 H30 Z" fill="#1e293b" opacity="0.3" />
  <line x1="30" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Desk Surface -->
  <path d="M15 170 H225 L215 210 H25 Z" fill="#334155" />
  <path d="M10 165 H230 V172 H10 Z" fill="#475569" rx="2" />

  <!-- Context Props on Desk -->
  <!-- Magnifying Glass -->
  <g transform="translate(45, 175) rotate(-15)">
    <line x1="0" y1="0" x2="-15" y2="25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <circle cx="12" cy="-12" r="14" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="12" cy="-12" r="12" fill="#38bdf8" fill-opacity="0.2" />
  </g>

  <!-- Confidential Folder with "Secret" Stamp (Abstracted as lines) -->
  <g transform="translate(160, 165) rotate(5)">
    <rect x="0" y="0" width="36" height="10" rx="2" fill="#ef4444" />
    <rect x="-4" y="6" width="44" height="26" rx="3" fill="#cbd5e1" />
    <line x1="4" y1="14" x2="28" y2="14" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="22" x2="20" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wild Guessing Symbols / Floating Question Marks (Depicting '胡乱猜测' - random guessing) -->
  <g filter="url(#soft-glow)">
    <!-- Question Mark 1 (Orange/Warning) -->
    <path d="M 85 85 Q 95 65 110 75 Q 120 82 110 95 Q 100 105 100 120" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" />
    <circle cx="100" cy="138" r="3" fill="#fb923c" />

    <!-- Question Mark 2 (Red/Wild) -->
    <path d="M 140 70 Q 148 52 162 60 Q 172 67 162 78 Q 154 87 154 98" fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round" />
    <circle cx="154" cy="112" r="2.5" fill="#f87171" />

    <!-- Question Mark 3 (Yellow/Random) -->
    <path d="M 115 105 Q 122 93 132 98 Q 140 104 132 113 Q 126 120 126 128" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="126" cy="138" r="2" fill="#fbbf24" />
  </g>

  <!-- Main Character: Confident/Reckless Guesser -->
  <g transform="translate(90, 75)">
    <!-- Body / Torso (Blue Suit / Smart Casual) -->
    <path d="M 30 115 L 15 135 H 45 Z" fill="#1e293b" />
    <path d="M 12 75 Q 30 65 48 75 L 45 125 H 15 Z" fill="#3b82f6" />
    <path d="M 22 75 L 30 95 L 38 75 Z" fill="#ffffff" /> <!-- Shirt Collar -->
    
    <!-- Neck -->
    <rect x="23" y="62" width="14" height="15" fill="url(#skin-shade)" />

    <!-- Head & Hair -->
    <!-- Hair Base -->
    <path d="M 16 40 Q 30 15 44 40 Q 52 45 46 58 Q 30 52 14 58 Q 8 45 16 40 Z" fill="#1e293b" />
    
    <!-- Face -->
    <rect x="15" y="42" width="30" height="32" rx="14" fill="url(#skin-shade)" />

    <!-- Ear -->
    <path d="M 13 54 C 9 54 9 62 13 64" fill="url(#skin-shade)" />

    <!-- Expression: Reckless / Over-confident Smirk & Raised Eyebrows -->
    <!-- Eyebrows (Dynamic, angled up wildly) -->
    <path d="M 18 50 Q 24 45 29 49" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 31 49 Q 36 45 42 50" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Squinting/Confident) -->
    <path d="M 20 56 Q 23 53 26 56" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 34 56 Q 37 53 40 56" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Smirk / Grin -->
    <path d="M 23 66 Q 30 72 37 65" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 35 66 Q 37 68 39 65" fill="#f87171" /> <!-- Tongue peek / playful -->
  </g>

  <!-- Gesturing Arms & Hands (Action: "Don't guess wildly!" - Warning gesture) -->
  <!-- Left arm (bent, resting or pointing back) -->
  <path d="M 105 140 L 80 155 L 90 170" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Hand -->
  <circle cx="92" cy="173" r="6" fill="url(#skin-shade)" />

  <!-- Right Arm (Raised in a firm "Stop / Don't" gesture) -->
  <path d="M 135 140 L 155 110 L 150 90" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Hand (Open palm facing forward - Warning/Stop) -->
  <circle cx="147" cy="84" r="8" fill="url(#skin-shade)" />
  <!-- Fingers of Stop Gesture -->
  <path d="M 141 78 L 153 78" stroke="url(#skin-shade)" stroke-width="4" stroke-linecap="round" />

  <!-- Foreground Warning Element / Barrier (Reinforcing "Don't do that") -->
  <!-- Stylized crossed prohibition lines subtly floating near the bottom corner -->
  <g transform="translate(195, 45)" opacity="0.8">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#ef4444" stroke-width="4" />
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Highlights / Rim Light for 2D depth -->
  <path d="M 215 170 H 225 L 215 210 H 205 Z" fill="#64748b" opacity="0.5" />
</svg>