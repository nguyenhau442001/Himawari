<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road/Path -->
  <path d="M0 180 L240 180 L200 240 L-40 240 Z" fill="#2D343E"/>
  <path d="M80 200 L160 200" stroke="#FFB800" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Emergency Vehicle (Simplified Ambulance/Rescue Van) -->
  <g transform="translate(40, 130)">
    <!-- Body -->
    <rect x="0" y="20" width="80" height="40" rx="4" fill="#E0E0E0"/>
    <!-- Cabin -->
    <rect x="50" y="0" width="30" height="20" rx="2" fill="#E0E0E0"/>
    <!-- Window -->
    <rect x="55" y="5" width="20" height="10" rx="1" fill="#1A1D24"/>
    <!-- Wheels -->
    <circle cx="20" cy="65" r="8" fill="#FFB800"/>
    <circle cx="60" cy="65" r="8" fill="#FFB800"/>
    <!-- Emergency Light -->
    <rect x="52" y="-5" width="10" height="5" fill="#FF4D4D"/>
    <!-- Motion lines -->
    <path d="M-10 30 L-30 30 M-15 45 L-35 45" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Destination Marker (Pin) -->
  <g transform="translate(160, 80)">
    <path d="M20 0 C8.95 0 0 8.95 0 20 C0 35 20 55 20 55 C20 55 40 35 40 20 C40 8.95 31.05 0 20 0 Z" fill="#FFB800"/>
    <circle cx="20" cy="20" r="8" fill="#1A1D24"/>
  </g>
</svg>