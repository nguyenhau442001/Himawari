<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="warmGlow" cx="70" cy="120" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Glow Gradient -->
    <radialGradient id="coolGlow" cx="170" cy="120" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Panel Gradient -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting Effects -->
  <rect width="240" height="240" rx="24" fill="url(#warmGlow)"/>
  <rect width="240" height="240" rx="24" fill="url(#coolGlow)"/>

  <!-- Subtle Room Grid / Architecture lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" fill="none">
    <line x1="0" y1="190" x2="240" y2="190"/>
    <line x1="120" y1="40" x2="120" y2="190" stroke-dasharray="4 4"/>
  </g>

  <!-- SCENE LEFT: SUCCESS PATH (Warm, Amber, Ascending) -->
  <g id="successSide">
    <!-- Desk & Office Props -->
    <path d="M 30,170 L 100,170 L 110,190 L 20,190 Z" fill="#334155" opacity="0.6"/>
    <rect x="50" y="145" width="35" height="25" rx="2" fill="#475569"/>
    <!-- Laptop screen showing upward chart -->
    <path d="M 52,147 L 83,147 L 85,167 L 50,167 Z" fill="#0f172a"/>
    <path d="M 57,160 L 64,155 L 71,158 L 78,150" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Plant Prop -->
    <path d="M 90,165 Q 92,150 97,145 Q 102,150 104,165 Z" fill="#10b981" opacity="0.8"/>
    <rect x="91" y="165" width="12" height="10" rx="2" fill="#cbd5e1"/>

    <!-- Successful Character (Confident, Smiling) -->
    <!-- Body -->
    <path d="M 55,145 C 55,125 85,125 85,145 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="70" cy="100" r="14" fill="#fde047"/>
    <!-- Hair -->
    <path d="M 56,98 C 56,88 84,88 84,98 C 80,92 60,92 56,98 Z" fill="#451a03"/>
    <!-- Arm raised in success -->
    <path d="M 80,130 Q 95,110 90,100" fill="none" stroke="#fde047" stroke-width="6" stroke-linecap="round"/>
    <!-- Face Expression: Smiling, looking forward -->
    <circle cx="66" cy="99" r="1.5" fill="#1e293b"/>
    <circle cx="74" cy="99" r="1.5" fill="#1e293b"/>
    <path d="M 67,105 Q 70,108 73,105" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Floating Success Elements (Trophy/Star) -->
    <g transform="translate(62, 55) scale(0.7)">
      <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" fill="#f59e0b"/>
    </g>
  </g>

  <!-- DIVIDER / CONTRAST AXIS ("反之" - On the contrary) -->
  <g transform="translate(120, 120)">
    <!-- Central Pivot Ring -->
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <!-- Directional Swap Arrows (representing 'reverse / on the contrary') -->
    <path d="M -8,-4 L -15,0 L -8,4" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8,4 L 15,0 L 8,-4" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -13,0 Q 0,-15 13,0" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 13,0 Q 0,15 -13,0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- SCENE RIGHT: THE ALTERNATIVE / FAILURE SCENARIO ("如果失败了呢？" - What if it fails?) -->
  <g id="failureSide">
    <!-- Desk & Cluttered Props -->
    <path d="M 140,170 L 210,170 L 220,190 L 130,190 Z" fill="#334155" opacity="0.6"/>
    <!-- Tipped Coffee Mug -->
    <ellipse cx="195" cy="167" rx="6" ry="3" fill="#cbd5e1"/>
    <path d="M 191,167 Q 185,172 190,175" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <!-- Scattered Papers -->
    <rect x="150" y="160" width="18" height="12" rx="1" fill="#f8fafc" transform="rotate(-15 150 160)"/>
    <rect x="170" y="162" width="15" height="10" rx="1" fill="#cbd5e1" transform="rotate(25 170 162)"/>

    <!-- Pensive / Concerned Character (Hand on head, pondering the alternative) -->
    <!-- Body (slouching) -->
    <path d="M 165,145 C 165,128 195,128 195,145 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="180" cy="102" r="14" fill="#fde047"/>
    <!-- Hair (slightly messy) -->
    <path d="M 166,100 C 166,90 194,90 194,100 C 190,93 170,93 166,100 Z" fill="#451a03"/>
    <!-- Arm supporting head (Thinking pose) -->
    <path d="M 175,130 Q 165,115 172,105" fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
    <!-- Face Expression: Worried, questioning eyes, straight/slight frown mouth -->
    <circle cx="176" cy="101" r="1.5" fill="#1e293b"/>
    <circle cx="184" cy="101" r="1.5" fill="#1e293b"/>
    <path d="M 177,108 Q 180,106 183,108" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 173,97 Q 176,95 179,97" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Floating Question Elements (Uncertainty / What if?) -->
    <g transform="translate(195, 50)">
      <circle cx="0" cy="0" r="12" fill="#334155" stroke="#ef4444" stroke-width="1.5"/>
      <path d="M -3,-4 C -3,-7 3,-7 3,-3 C 3,1 -3,2 -3,6" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-3" cy="9" r="1" fill="#ef4444"/>
    </g>
  </g>

  <!-- Foreground framing elements for vector depth -->
  <path d="M 0,240 L 0,225 Q 120,235 240,225 L 240,240 Z" fill="#0f172a"/>
</svg>