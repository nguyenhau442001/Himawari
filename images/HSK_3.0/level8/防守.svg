<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Court Wood Gradient -->
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2219" />
      <stop offset="100%" stop-color="#24140e" />
    </linearGradient>

    <!-- Glowing Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Spotlight/Glow Effect -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    
    <!-- Basketball Glow -->
    <radialGradient id="ballGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>

    <!-- Clip Path for Court Perspective -->
    <clipPath id="courtClip">
      <polygon points="20,160 220,160 200,230 40,230" />
    </clipPath>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient lighting & Spotlight -->
  <circle cx="120" cy="110" r="100" fill="url(#spotlight)" />

  <!-- Background Basketball Stadium Elements -->
  <!-- Stadium wall/stands blurred -->
  <path d="M20,120 L220,120 L220,160 L20,160 Z" fill="#111827" opacity="0.8" />
  <line x1="20" y1="130" x2="220" y2="130" stroke="#1f2937" stroke-width="2" />
  <line x1="20" y1="145" x2="220" y2="145" stroke="#1f2937" stroke-width="2" />
  <circle cx="60" cy="125" r="3" fill="#fbbf24" opacity="0.5" />
  <circle cx="120" cy="125" r="3" fill="#f43f5e" opacity="0.5" />
  <circle cx="180" cy="125" r="3" fill="#38bdf8" opacity="0.5" />

  <!-- Basketball Court Floor (Perspective Trapezoid) -->
  <polygon points="0,160 240,160 240,240 0,240" fill="url(#courtGrad)" />
  <g clip-path="url(#courtClip)">
    <!-- Wood plank lines -->
    <line x1="0" y1="170" x2="240" y2="170" stroke="#4a2818" stroke-width="1" />
    <line x1="-20" y1="185" x2="260" y2="185" stroke="#4a2818" stroke-width="1" />
    <line x1="-50" y1="205" x2="290" y2="205" stroke="#4a2818" stroke-width="1" />
    <line x1="-90" y1="230" x2="330" y2="230" stroke="#4a2818" stroke-width="1" />
    <!-- Court Paint / Lines -->
    <path d="M90,160 Q120,190 150,160" fill="none" stroke="#ea580c" stroke-width="3" opacity="0.6" />
  </g>

  <!-- Hoop/Backboard Structure in Background (Blurred/Distant) -->
  <rect x="110" y="70" width="20" height="15" fill="#e2e8f0" opacity="0.3" />
  <ellipse cx="120" cy="85" rx="8" ry="3" fill="none" stroke="#f97316" stroke-width="2" opacity="0.5" />

  <!-- SCENE: EXCELLENT DEFENSE (防守) -->
  <!-- Context: Two players. An offensive player trying to pass, and a stellar defender locking down with an energy shield motif. -->

  <!-- Defender Shadow -->
  <ellipse cx="125" cy="210" rx="28" ry="8" fill="#000000" opacity="0.6" />

  <!-- DEFENDER CHARACTER (Central focus, active athletic stance) -->
  <g id="defender">
    <!-- Legs in defensive slide stance -->
    <!-- Back Leg -->
    <path d="M110,180 L95,215 L110,218" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M110,180 L95,215 L110,218" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Leg -->
    <path d="M135,180 L150,212 L135,216" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M135,180 L150,212 L135,216" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoes -->
    <ellipse cx="108" cy="218" rx="8" ry="4" fill="#f8fafc" />
    <ellipse cx="137" cy="216" rx="8" ry="4" fill="#f8fafc" />
    <path d="M100,218 L116,218" stroke="#38bdf8" stroke-width="2" />
    <path d="M129,216 L145,216" stroke="#38bdf8" stroke-width="2" />

    <!-- Jersey Shorts -->
    <path d="M105,170 L145,170 L140,190 L110,190 Z" fill="#0284c7" />
    <path d="M125,170 L125,190" stroke="#0369a1" stroke-width="2" />

    <!-- Torso (Bent forward for low center of gravity) -->
    <path d="M105,145 L145,145 L140,175 L110,175 Z" fill="#0284c7" />
    <!-- Jersey Number/Design -->
    <circle cx="125" cy="160" r="6" fill="#f0f9ff" />
    <text x="125" y="164" font-family="sans-serif" font-weight="bold" font-size="10" fill="#0284c7" text-anchor="middle">5</text>

    <!-- Head & Face (Determined, focused expression) -->
    <circle cx="125" cy="125" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M111,122 C113,110 137,110 139,122 C135,116 115,116 111,122 Z" fill="#1e293b" />
    <!-- Focused Eyes & Eyebrows (Determined angle) -->
    <line x1="118" y1="124" x2="124" y2="126" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="128" y1="126" x2="134" y2="124" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="121" cy="128" r="1.5" fill="#1e293b" />
    <circle cx="131" cy="128" r="1.5" fill="#1e293b" />
    <!-- Determined Mouth (slight grimace/grit) -->
    <path d="M122,133 Q125,135 128,133" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms spread wide for defensive stance -->
    <!-- Left Arm (extended wide) -->
    <path d="M110,150 L85,140 L65,145" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand -->
    <circle cx="63" cy="146" r="4" fill="#fbcfe8" />

    <!-- Right Arm (extended wide) -->
    <path d="M140,150 L165,140 L185,145" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Hand -->
    <circle cx="187" cy="146" r="4" fill="#fbcfe8" />
  </g>

  <!-- DEFENSIVE SHIELD EFFECT (Visual metaphor for "excellent defense") -->
  <g opacity="0.85">
    <path d="M100,105 Q125,95 150,105 L155,145 Q125,170 95,145 Z" fill="url(#shieldGrad)" stroke="#7dd3fc" stroke-width="2" />
    <!-- Inner Shield Highlights -->
    <path d="M106,112 Q125,104 144,112 L148,141 Q125,160 102,141 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <!-- Glow lines on shield representing impenetrable defense -->
    <path d="M125,105 L125,155" stroke="#bae6fd" stroke-width="2" opacity="0.8" />
    <path d="M108,125 L142,125" stroke="#bae6fd" stroke-width="2" opacity="0.8" />
  </g>

  <!-- OFFENSIVE PLAYER (Struggling against the defense, on the left) -->
  <g id="attacker" opacity="0.9">
    <!-- Shadow -->
    <ellipse cx="65" cy="212" rx="20" ry="6" fill="#000000" opacity="0.4" />
    
    <!-- Body/Torso leaning back/sideways -->
    <path d="M50,160 L80,165 L75,195 L45,190 Z" fill="#ef4444" />
    <!-- Head -->
    <circle cx="60" cy="138" r="12" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M49,136 C51,128 71,128 73,136 C68,131 54,131 49,136 Z" fill="#451a03" />
    <!-- Surprised/Challenged Face -->
    <circle cx="56" cy="140" r="1.5" fill="#1e293b" />
    <circle cx="64" cy="140" r="1.5" fill="#1e293b" />
    <path d="M58,146 Q60,143 62,146" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Legs -->
    <path d="M50,190 L40,215 L55,218" fill="none" stroke="#991b1b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M70,195 L75,215 L90,212" fill="none" stroke="#991b1b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arms trying to protect/pass ball -->
    <path d="M75,170 L95,160 L105,155" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="107" cy="154" r="3.5" fill="#fed7aa" />

    <!-- Basketball being guarded -->
    <circle cx="112" cy="153" r="10" fill="url(#ballGlow)" stroke="#7c2d12" stroke-width="1.5" />
    <!-- Ball lines -->
    <path d="M104,146 Q112,153 120,146" fill="none" stroke="#7c2d12" stroke-width="1" />
    <path d="M104,160 Q112,153 120,160" fill="none" stroke="#7c2d12" stroke-width="1" />
    <path d="M112,143 L112,163" fill="none" stroke="#7c2d12" stroke-width="1" />
  </g>

  <!-- SPARKLES / EXCELLENCE INDICATORS (Visualizing "很出色" - Excellent) -->
  <g id="sparkles">
    <!-- Star 1 (Top Right) -->
    <path d="M180,75 L183,85 L193,88 L183,91 L180,101 L177,91 L167,88 L177,85 Z" fill="#fbbf24" />
    <circle cx="180" cy="88" r="2" fill="#ffffff" />

    <!-- Star 2 (Top Left) -->
    <path d="M50,70 L52,76 L58,78 L52,80 L50,86 L48,80 L42,78 L48,76 Z" fill="#fbbf24" opacity="0.8" />

    <!-- Star 3 (Mid Right Shield Sparkle) -->
    <path d="M165,115 L167,121 L173,123 L167,125 L165,131 L163,125 L157,123 L163,121 Z" fill="#38bdf8" />

    <!-- Dynamic Action Lines / Motion -->
    <path d="M15,100 Q30,90 40,95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M210,110 Q215,120 225,125" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    
    <!-- Energy dust / particles near floor -->
    <circle cx="130" cy="180" r="2" fill="#38bdf8" opacity="0.9" />
    <circle cx="100" cy="175" r="1.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="150" cy="185" r="2.5" fill="#fbbf24" opacity="0.8" />
  </g>

</svg>