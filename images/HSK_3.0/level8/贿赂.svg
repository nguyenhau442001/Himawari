<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background and Ambient Studio Lighting -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="moneyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <circle cx="120" cy="120" r="100" fill="url(#deskGlow)"/>

  <!-- Architectural Background Elements (Office / Official Setting) -->
  <!-- Window blind lines -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="160" y1="20" x2="220" y2="20" />
    <line x1="160" y1="30" x2="220" y2="30" />
    <line x1="160" y1="40" x2="220" y2="40" />
    <line x1="160" y1="50" x2="220" y2="50" />
    <line x1="160" y1="60" x2="220" y2="60" />
    <line x1="160" y1="70" x2="220" y2="70" />
    <line x1="160" y1="80" x2="220" y2="80" />
    <line x1="160" y1="90" x2="220" y2="90" />
  </g>
  <!-- Bookshelf / Document Cabinet in background -->
  <rect x="25" y="30" width="35" height="80" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="40" width="25" height="6" rx="1" fill="#475569"/>
  <rect x="30" y="52" width="25" height="6" rx="1" fill="#475569"/>
  <rect x="30" y="64" width="25" height="6" rx="1" fill="#475569"/>

  <!-- Official Desk -->
  <path d="M 20 150 L 220 150 L 210 200 L 30 200 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <rect x="20" y="142" width="200" height="10" rx="3" fill="#475569"/>

  <!-- Desk Props: Lamp, Files, Plant -->
  <!-- Desk Lamp -->
  <path d="M 190 142 L 195 100 L 205 100 L 210 142 Z" fill="#64748b"/>
  <path d="M 180 85 C 180 75 210 75 210 85 Z" fill="#fbbf24"/>
  <path d="M 192 100 L 198 142" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Document Folders on Desk -->
  <path d="M 40 148 L 65 140 L 70 148 Z" fill="#ef4444"/>
  <path d="M 45 145 L 75 137 L 80 145 Z" fill="#3b82f6"/>

  <!-- THE BRIBE (The Money Bundle & Briefcase) -->
  <!-- Open Briefcase containing money -->
  <g transform="translate(75, 115)">
    <!-- Briefcase body -->
    <path d="M 0 15 L 10 0 L 50 0 L 60 15 Z" fill="#451a03"/>
    <rect x="-5" y="15" width="70" height="20" rx="4" fill="#78350f" filter="url(#shadow)"/>
    <rect x="25" y="12" width="10" height="5" rx="1" fill="#fbbf24"/>
    <!-- Stack of Money (RMB/Cash bundle) inside -->
    <rect x="8" y="10" width="44" height="12" rx="2" fill="url(#moneyGrad)" stroke="#065f46" stroke-width="1"/>
    <!-- Cash band -->
    <rect x="24" y="10" width="12" height="12" fill="#ef4444" opacity="0.8"/>
  </g>

  <!-- CHARACTER 1: The Official (Sitting behind desk, accepting/looking sternly) -->
  <g transform="translate(110, 85)">
    <!-- Official Body / Suit -->
    <path d="M -25 55 L -35 25 L -10 15 L 0 30 L 10 15 L 35 25 L 25 55 Z" fill="#1e293b"/>
    <!-- White shirt collar & red tie -->
    <polygon points="-5,18 0,35 5,18" fill="#ffffff"/>
    <polygon points="-2,22 0,32 2,22" fill="#ef4444"/>

    <!-- Official Head -->
    <circle cx="0" cy="-5" r="18" fill="#fbcfe8"/>
    <!-- Hair (Strict Official Look) -->
    <path d="M -18 -8 C -15 -22 15 -22 18 -8 C 12 -12 -12 -12 -18 -8 Z" fill="#334155"/>
    <!-- Glasses -->
    <rect x="-10" y="-10" width="8" height="6" rx="1" fill="none" stroke="#334155" stroke-width="1.5"/>
    <rect x="2" y="-10" width="8" height="6" rx="1" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="-2" y1="-7" x2="2" y2="-7" stroke="#334155" stroke-width="1.5"/>
    <!-- Stern expression (Eyebrows lowered) -->
    <line x1="-10" y1="-14" x2="-3" y2="-12" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="-12" x2="10" y2="-14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Serious mouth -->
    <line x1="-4" y1="5" x2="4" y2="5" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Official Arms -->
    <!-- Arm resting on desk -->
    <path d="M -20 30 C -25 35 -35 45 -45 42" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-47" cy="41" r="4" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER 2: The Bribrer (Standing, sliding the briefcase/money across the desk) -->
  <g transform="translate(60, 95)">
    <!-- Briber Body (Suit / Trenchcoat) -->
    <path d="M -20 70 L -25 25 L -5 20 L 0 35 L 15 20 L 30 25 L 25 70 Z" fill="#334155"/>
    <polygon points="-3,23 0,40 3,23" fill="#ffffff"/>
    <polygon points="-2,26 0,34 2,26" fill="#0284c7"/>

    <!-- Briber Head -->
    <circle cx="0" cy="0" r="17" fill="#fed7aa"/>
    <!-- Sleek Hair -->
    <path d="M -16 -3 C -14 -16 12 -16 17 -5 C 10 -10 -10 -10 -16 -3 Z" fill="#0f172a"/>
    <!-- Worried / Sneaky Expression -->
    <!-- Sweating drop -->
    <path d="M 14 -2 C 14 -2 18 4 18 7 C 18 9 16 10 14 10 C 12 10 10 9 10 7 C 10 4 14 -2 14 -2 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Eyes (Glancing sideways towards the official) -->
    <circle cx="-3" cy="-2" r="2" fill="#1e293b"/>
    <circle cx="5" cy="-2" r="2" fill="#1e293b"/>
    <!-- Eyebrows raised anxiously -->
    <path d="M -6 -8 C -4 -10 0 -10 2 -8" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 4 -8 C 6 -10 10 -10 12 -8" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Nervous smile -->
    <path d="M -3,5 Q 0,8 3,5" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Briber Arms (Pushing gesture) -->
    <!-- Back arm -->
    <path d="M -15 35 C -25 35 -30 45 -25 55" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <!-- Front arm pushing forward toward briefcase -->
    <path d="M 15 30 C 25 35 35 45 42 42" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <circle cx="44" cy="41" r="4" fill="#fed7aa"/>
  </g>

  <!-- FOREGROUND / LEGAL CONSEQUENCE ELEMENTS (Gavel & Handcuffs hinting at "being sentenced" / 被判刑) -->
  <!-- Handcuffs resting on front desk corner -->
  <g transform="translate(170, 180) rotate(-15)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="15" cy="5" r="10" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <rect x="7" y="-2" width="6" height="4" rx="1" fill="#64748b"/>
  </g>

  <!-- Judge's Gavel (Symbolizing punishment/sentence) -->
  <g transform="translate(25, 175) rotate(25)">
    <!-- Handle -->
    <rect x="-3" y="-25" width="6" height="40" rx="2" fill="#78350f"/>
    <!-- Mallet Head -->
    <rect x="-18" y="-35" width="36" height="14" rx="3" fill="#b45309" filter="url(#shadow)"/>
    <rect x="-20" y="-37" width="40" height="4" rx="2" fill="#d97706"/>
  </g>

</svg>