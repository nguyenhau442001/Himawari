<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wood / Furniture Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Spotlight / Dramatic Lighting -->
    <radialGradient id="spotlight" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Architecture (Courtroom Interior) -->
  <g id="architecture" opacity="0.6">
    <!-- Wood Paneling Wall -->
    <rect x="20" y="30" width="200" height="110" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="4"/>
    <line x1="20" y1="100" x2="220" y2="100" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Vertical Wall Panels -->
    <line x1="70" y1="30" x2="70" y2="100" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="120" y1="30" x2="120" y2="100" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="170" y1="30" x2="170" y2="100" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Courthouse Emblem / Scale Silhouette (Simplified) -->
    <circle cx="120" cy="55" r="16" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <path d="M120 45 v20 M110 52 h20 M108 52 l-4 8 h8 z M132 52 l-4 8 h8 z" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ambient Lighting / Windows -->
  <g opacity="0.3">
    <path d="M30 30 L50 140 L70 140 L50 30 Z" fill="#38bdf8"/>
    <path d="M210 30 L190 140 L170 140 L190 30 Z" fill="#38bdf8"/>
  </g>

  <!-- Judge's Bench (Background Elevated Area) -->
  <g id="judges-bench">
    <rect x="85" y="70" width="70" height="40" fill="url(#podiumGrad)" rx="2"/>
    <rect x="80" y="66" width="80" height="6" fill="#64748b" rx="1"/>
    <!-- Judge Silhouette/Gavel hint -->
    <circle cx="120" cy="58" r="7" fill="#94a3b8"/>
  </g>

  <!-- Foreground / Midground Elements -->
  <!-- Official Summons Notice / Document on Desk -->
  <g id="summons-document">
    <rect x="95" y="145" width="26" height="18" fill="#f8fafc" rx="1" transform="rotate(-10 95 145)" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Document lines -->
    <line x1="99" y1="149" x2="113" y2="147" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <line x1="98" y1="153" x2="111" y2="151" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <circle cx="114" cy="157" r="3" fill="#ef4444" opacity="0.8"/> <!-- Red Official Seal -->
  </g>

  <!-- Witness / Defendant Table -->
  <g id="table">
    <rect x="60" y="150" width="120" height="45" fill="url(#deskGrad)" rx="4" stroke="#475569" stroke-width="1.5"/>
    <rect x="55" y="145" width="130" height="8" fill="#64748b" rx="2"/>
    <!-- Table Glow Effect representing the "Summons Spotlight" -->
    <ellipse cx="120" cy="155" rx="45" ry="10" fill="url(#tableGlow)"/>
  </g>

  <!-- CHARACTER: The "当事人" (The Involved Party / Defendant / Witness) -->
  <g id="main-character">
    <!-- Body / Suit Torso -->
    <path d="M95 210 L98 175 L112 165 L128 165 L142 175 L145 210 Z" fill="#334155"/>
    <!-- Shirt Collar & Tie -->
    <path d="M112 165 L120 178 L128 165 Z" fill="#f8fafc"/>
    <polygon points="118,172 122,172 123,195 120,198 117,195" fill="#ef4444"/>

    <!-- Left Arm & Hand (Resting nervously on desk) -->
    <path d="M98 175 L85 195 L95 198 L103 183 Z" fill="#334155"/>
    <circle cx="83" cy="198" r="5" fill="#fcd34d"/> <!-- Hand -->

    <!-- Right Arm & Hand (Slightly raised, expressing tension/testifying) -->
    <path d="M142 175 L155 185 L150 195 L138 183 Z" fill="#334155"/>
    <circle cx="158" cy="184" r="5" fill="#fcd34d"/> <!-- Hand -->

    <!-- Neck -->
    <rect x="113" y="158" width="14" height="12" fill="#fcd34d" rx="3"/>

    <!-- Head & Face -->
    <circle cx="120" cy="138" r="20" fill="#fcd34d"/>
    
    <!-- Hair (Neat professional cut, slightly tousled with worry) -->
    <path d="M100 135 C100 120, 110 115, 120 115 C130 115, 140 120, 140 135 C140 138, 138 135, 136 130 C132 122, 128 120, 120 120 C112 120, 108 122, 104 130 C102 135, 100 138, 100 135 Z" fill="#1e293b"/>

    <!-- Expressive Eyebrows (Serious / Anxious / Summoned look) -->
    <path d="M107 132 L115 135" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M133 132 L125 135" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes (Focused, wide with anticipation) -->
    <circle cx="111" cy="138" r="2.5" fill="#1e293b"/>
    <circle cx="129" cy="138" r="2.5" fill="#1e293b"/>
    <!-- Eye highlights -->
    <circle cx="112" cy="137" r="0.8" fill="#ffffff"/>
    <circle cx="130" cy="137" r="0.8" fill="#ffffff"/>

    <!-- Glasses (Intellectual / Professional look typical of official cases) -->
    <rect x="106" y="133" width="10" height="9" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <rect x="124" y="133" width="10" height="9" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="116" y1="137" x2="124" y2="137" stroke="#64748b" stroke-width="1.5"/>

    <!-- Nose & Mouth (Serious, taut expression) -->
    <path d="M120 141 L118 146 L121 146" stroke="#d97706" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M115 152 Q120 150 125 152" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Foreground Elements / Depth (Microphone & Legal Folder) -->
  <g id="foreground-props">
    <!-- Microphone on Stand -->
    <rect x="138" y="160" width="2" height="15" fill="#94a3b8"/>
    <circle cx="139" cy="158" r="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    
    <!-- Stack of case files -->
    <rect x="155" y="152" width="20" height="12" fill="#38bdf8" rx="1" transform="rotate(5 155 152)"/>
    <rect x="153" y="157" width="22" height="12" fill="#e2e8f0" rx="1" transform="rotate(2 153 157)"/>
  </g>

  <!-- Dramatic Lighting / Accent Vignette -->
  <circle cx="120" cy="138" r="60" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.2"/>
</svg>