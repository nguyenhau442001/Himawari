<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Ground line / terrain representing field training -->
    <path d="M 20 200 L 196 200" stroke="#2A303C" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Soldier figure (bent slightly forward under immense heavy load) -->
    <g transform="translate(95, 80)">
      <!-- Legs in marching stride -->
      <path d="M 12 75 L 28 105 L 38 115" fill="none" stroke="#60A5FA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 12 75 L -2 95 L -8 115" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Torso (leaning forward under pressure) -->
      <path d="M 15 75 L 5 40 L 20 15" fill="none" stroke="#60A5FA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Head with cap/helmet -->
      <circle cx="28" cy="10" r="7" fill="#60A5FA"/>
      <path d="M 25 3 L 35 5" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Arm gripping straps -->
      <path d="M 17 32 L 8 50 L 20 62" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- MASSIVE MILITARY BACKPACK (The heavy load / 负重) -->
      <g transform="translate(-15, 2)">
        <!-- Main heavy pack body -->
        <rect x="-35" y="0" width="36" height="55" rx="8" fill="#F59E0B"/>
        <rect x="-30" y="-12" width="26" height="15" rx="5" fill="#D97706"/>
        <rect x="-38" y="15" width="42" height="30" rx="6" fill="#D97706"/>
        
        <!-- Straps and tactical gear attached -->
        <line x1="-15" y1="5" x2="20" y2="30" stroke="#B45309" stroke-width="3"/>
        <line x1="-15" y1="40" x2="20" y2="55" stroke="#B45309" stroke-width="3"/>
        <rect x="-30" y="50" width="26" height="8" rx="2" fill="#92400E"/>
        
        <!-- Rolled sleeping mat on top -->
        <rect x="-32" y="-18" width="30" height="8" rx="3" fill="#92400E"/>
      </g>
    </g>

    <!-- Downward pressure indicators (weight visual cues) -->
    <g transform="translate(80, 50)" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <path d="M 0 0 L 0 12 M -4 8 L 0 12 L 4 8"/>
      <path d="M 15 -5 L 15 12 M 11 8 L 15 12 L 19 8"/>
      <path d="M 30 -10 L 30 12 M 26 8 L 30 12 L 34 8"/>
    </g>

    <!-- Subtle contextual details (terrain element / subtle grid) -->
    <circle cx="40" cy="170" r="2" fill="#2A303C"/>
    <circle cx="170" cy="180" r="3" fill="#2A303C"/>
    <circle cx="150" cy="165" r="1.5" fill="#2A303C"/>
  </g>
</svg>