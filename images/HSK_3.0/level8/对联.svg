<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Lanterns -->
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Red Couplet Paper Gradient -->
    <linearGradient id="red-paper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="wood-door" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- SCENE CONTEXT: Traditional House Entrance / Courtyard Wall -->
  <!-- Wall Background -->
  <rect x="20" y="20" width="200" height="200" rx="8" fill="#334155" opacity="0.4"/>
  
  <!-- Wooden Double Doors -->
  <rect x="76" y="50" width="88" height="170" rx="4" fill="url(#wood-door)" stroke="#78350f" stroke-width="2"/>
  <!-- Door panels detail -->
  <rect x="84" y="60" width="33" height="70" rx="2" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  <rect x="123" y="60" width="33" height="70" rx="2" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  <rect x="84" y="140" width="33" height="70" rx="2" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  <rect x="123" y="140" width="33" height="70" rx="2" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>

  <!-- Brass Door Knocker / Handles -->
  <circle cx="103" cy="130" r="4" fill="#fbbf24"/>
  <circle cx="137" cy="130" r="4" fill="#fbbf24"/>

  <!-- AMBIENT LIGHTING & FESTIVE PROPS -->
  <!-- Lantern glow effect -->
  <circle cx="50" cy="60" r="45" fill="url(#lantern-glow)"/>
  <circle cx="190" cy="60" r="45" fill="url(#lantern-glow)"/>

  <!-- Left Red Lantern -->
  <path d="M50 35 L58 42 L58 70 L50 77 L42 70 L42 42 Z" fill="#ef4444"/>
  <path d="M46 35 L54 35" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 77 L54 77" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="50" y2="35" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="50" y1="77" x2="50" y2="87" stroke="#fbbf24" stroke-width="1"/>

  <!-- Right Red Lantern -->
  <path d="M190 35 L198 42 L198 70 L190 77 L182 70 L182 42 Z" fill="#ef4444"/>
  <path d="M186 35 L194 35" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M186 77 L194 77" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="190" y1="20" x2="190" y2="35" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="190" y1="77" x2="190" y2="87" stroke="#fbbf24" stroke-width="1"/>


  <!-- THE TARGET FOCUS: "对联" (Red Couplets pasted on sides of the door) -->
  <!-- Left Couplet Strip -->
  <rect x="62" y="54" width="11" height="150" rx="1.5" fill="url(#red-paper)" stroke="#f59e0b" stroke-width="0.75" />
  <!-- Abstract golden stroke decorations on left couplet (representing auspicious characters without using real text) -->
  <line x1="65.5" y1="65" x2="69.5" y2="65" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65.5" y1="80" x2="69.5" y2="80" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65.5" y1="95" x2="69.5" y2="95" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65.5" y1="120" x2="69.5" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65.5" y1="145" x2="69.5" y2="145" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65.5" y1="170" x2="69.5" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65.5" y1="190" x2="69.5" y2="190" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Couplet Strip (Being actively pasted by character) -->
  <rect x="167" y="54" width="11" height="150" rx="1.5" fill="url(#red-paper)" stroke="#f59e0b" stroke-width="0.75" />
  <!-- Abstract golden stroke decorations on right couplet -->
  <line x1="170.5" y1="65" x2="174.5" y2="65" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170.5" y1="85" x2="174.5" y2="85" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170.5" y1="110" x2="174.5" y2="110" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170.5" y1="130" x2="174.5" y2="130" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170.5" y1="155" x2="174.5" y2="155" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170.5" y1="175" x2="174.5" y2="175" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170.5" y1="195" x2="174.5" y2="195" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Horizontal scroll above door (Hengpi / Top banner couplet piece) -->
  <rect x="88" y="38" width="64" height="10" rx="1" fill="url(#red-paper)" stroke="#f59e0b" stroke-width="0.5"/>


  <!-- HUMAN CHARACTER: Actively pasting/adjusting the couplets -->
  <!-- Body / Torso -->
  <path d="M110 160 C110 145 120 140 130 140 C140 140 150 145 150 160 L155 210 L105 210 Z" fill="#3b82f6"/>
  <!-- Jacket Collar Details -->
  <path d="M120 140 L130 155 L140 140" fill="none" stroke="#93c5fd" stroke-width="2"/>
  
  <!-- Character Head -->
  <circle cx="130" cy="118" r="16" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M114 118 C114 105 122 102 130 102 C138 102 146 105 146 118 C144 114 136 112 130 112 C124 112 116 114 114 118 Z" fill="#1e293b"/>
  <!-- Cheerful Facial Expression -->
  <circle cx="125" cy="117" r="1.5" fill="#1e293b"/>
  <circle cx="135" cy="117" r="1.5" fill="#1e293b"/>
  <path d="M128 123 Q130 126 132 123" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="123" cy="120" r="2.5" fill="#fca5a5" opacity="0.6"/>
  <circle cx="137" cy="120" r="2.5" fill="#fca5a5" opacity="0.6"/>

  <!-- Left Arm (Holding glue/brush or resting) -->
  <path d="M112 145 L95 165 L100 170" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="98" cy="172" r="3" fill="#fde68a"/>

  <!-- Right Arm (Reaching up to paste the right couplet) -->
  <path d="M148 145 L162 115 L168 100" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="169" cy="98" r="3" fill="#fde68a"/>

  <!-- Supporting Props / Glue bowl or brush on ground -->
  <ellipse cx="90" cy="210" rx="10" ry="4" fill="#64748b"/>
  <path d="M83 208 Q90 198 97 208 Z" fill="#cbd5e1"/>
  <!-- Small brush sticking out -->
  <line x1="90" y1="203" x2="85" y2="190" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 190 L86 186 L88 190 Z" fill="#1e293b"/>

  <!-- Foreground Atmospheric Particles (Golden Sparkles / Festive mood) -->
  <circle cx="30" cy="120" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="45" cy="160" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="210" cy="140" r="1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="200" cy="180" r="2" fill="#ef4444" opacity="0.7"/>
  <circle cx="25" cy="70" r="1" fill="#fbbf24" opacity="0.7"/>
</svg>