<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Ambient background lighting / Office interior hints -->
  <path d="M0 0h240v240H0z" fill="url(#bg-gradient)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="100" r="110" fill="url(#spotlight)"/>

  <!-- Office Background Elements (Desk & Computer Setup) -->
  <!-- Window Grid in background -->
  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <line x1="30" y1="30" x2="30" y2="130"/>
    <line x1="70" y1="30" x2="70" y2="130"/>
    <line x1="170" y1="30" x2="170" y2="130"/>
    <line x1="210" y1="30" x2="210" y2="130"/>
    <line x1="30" y1="60" x2="70" y2="60"/>
    <line x1="30" y1="90" x2="70" y2="90"/>
    <line x1="170" y1="60" x2="210" y2="60"/>
    <line x1="170" y1="90" x2="210" y2="90"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M 20 185 L 220 185 L 235 220 L 5 220 Z" fill="url(#desk-grad)"/>
  <path d="M 20 185 L 220 185 L 220 190 L 20 190 Z" fill="#475569"/>

  <!-- Computer Monitor (Displaying malicious rumors / red toxic indicators) -->
  <rect x="85" y="90" width="70" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="90" y="95" width="60" height="35" rx="2" fill="url(#screen-glow)"/>
  <rect x="115" y="135" width="10" height="15" fill="#64748b"/>
  <rect x="105" y="150" width="30" height="4" rx="2" fill="#64748b"/>

  <!-- Abstract malicious digital chatter bubbles floating out of screen -->
  <g opacity="0.85">
    <!-- Bubble 1 (Left) -->
    <path d="M 75 75 Q 75 65 85 65 L 105 65 Q 115 65 115 75 L 115 85 Q 115 95 105 95 L 90 95 L 80 105 L 83 95 L 85 95 Q 75 95 75 85 Z" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="85" cy="80" r="3" fill="#ef4444"/>
    <circle cx="95" cy="80" r="3" fill="#ef4444"/>
    <circle cx="105" cy="80" r="3" fill="#ef4444"/>

    <!-- Bubble 2 (Right - pointing at him) -->
    <path d="M 140 60 Q 140 50 150 50 L 175 50 Q 185 50 185 60 L 185 70 Q 185 80 175 80 L 165 80 L 160 90 L 158 80 L 150 80 Q 140 80 140 70 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 148 62 L 177 62" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 148 68 L 168 68" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Gossip Silhouettes / Anonymous accusers in background (Blurred context) -->
  <g opacity="0.3" fill="#94a3b8">
    <!-- Accuser 1 -->
    <circle cx="25" cy="140" r="12"/>
    <path d="M 10 170 Q 10 155 25 155 Q 40 155 40 170 Z"/>
    <!-- Accuser 2 -->
    <circle cx="215" cy="135" r="12"/>
    <path d="M 200 165 Q 200 150 215 150 Q 230 150 230 165 Z"/>
  </g>

  <!-- MAIN SUBJECT: The Victim (Anh ấy bị vu khống) -->
  <g id="main-character">
    <!-- Character Body / Torso (Blue Office Shirt) -->
    <path d="M 95 190 L 95 155 Q 95 145 105 145 L 135 145 Q 145 145 145 155 L 145 190 Z" fill="#38bdf8"/>
    <!-- Suit Jacket / Vest -->
    <path d="M 95 190 L 95 160 L 110 145 L 100 145 Z" fill="#0284c7"/>
    <path d="M 145 190 L 145 160 L 130 145 L 140 145 Z" fill="#0284c7"/>
    <!-- Tie -->
    <polygon points="117,145 123,145 125,170 120,180 115,170" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="114" y="135" width="12" height="15" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="120" cy="115" r="20" fill="#fbcfe8"/>

    <!-- Hair (Dark modern styled hair) -->
    <path d="M 100 115 Q 100 95 120 95 Q 140 95 140 115 Q 140 102 135 100 Q 125 97 120 98 Q 110 97 105 102 Q 100 108 100 115 Z" fill="#334155"/>

    <!-- Sad/Distressed Facial Expression -->
    <!-- Eyebrows (Tilted inward in worry) -->
    <path d="M 108 110 L 116 113" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M 132 110 L 124 113" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (Wide, stressed) -->
    <circle cx="112" cy="117" r="2.5" fill="#1e293b"/>
    <circle cx="128" cy="117" r="2.5" fill="#1e293b"/>
    <!-- Sweat drop of distress -->
    <path d="M 135 115 Q 138 120 135 123 Q 132 120 135 115 Z" fill="#38bdf8"/>
    <!-- Mouth (Frowning/Shocked open slightly) -->
    <path d="M 116 128 Q 120 124 124 128" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Hands in shock/disbelief near face or head -->
    <!-- Left Hand touching head -->
    <path d="M 100 130 C 90 125 85 115 90 110 C 93 107 98 112 97 118" fill="#fbcfe8" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Right Hand resting on desk in frustration -->
    <path d="M 140 170 C 150 170 155 180 150 185 C 145 188 138 185 138 180" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Atmospheric Highlights & Context Props -->
  <!-- Coffee mug on desk -->
  <rect x="175" y="170" width="14" height="18" rx="2" fill="#cbd5e1"/>
  <path d="M 189 174 C 194 174 194 184 189 184" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M 180 162 Q 183 157 180 152" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Unfair/Accusatory floating glowing markers (Visual metaphor for slander/bôi nhọ) -->
  <g fill="#ef4444" opacity="0.8">
    <circle cx="70" cy="120" r="4"/>
    <polygon points="175,105 180,115 170,115" />
    <circle cx="160" cy="135" r="3"/>
  </g>
</svg>