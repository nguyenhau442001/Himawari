<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Invitation Card Gold Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment (Cozy Modern Apartment Interior) -->
  <!-- Wallpaper / Wall Panel -->
  <path d="M 0 0 L 240 0 L 240 160 L 0 160 Z" fill="#1e293b" />
  <!-- Wooden Floor -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#0f172a" />
  <!-- Floor Planks Perspective Lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#172033" stroke-width="1.5" />
  <line x1="0" y1="205" x2="240" y2="205" stroke="#172033" stroke-width="1.5" />
  <line x1="0" y1="230" x2="240" y2="230" stroke="#172033" stroke-width="1.5" />

  <!-- Window with Night City Glow -->
  <g opacity="0.6">
    <rect x="160" y="30" width="55" height="100" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    <line x1="187.5" y1="30" x2="187.5" y2="130" stroke="#334155" stroke-width="1.5" />
    <line x1="160" y1="80" x2="215" y2="80" stroke="#334155" stroke-width="1.5" />
    <!-- City lights outside -->
    <circle cx="170" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="65" r="1" fill="#f43f5e" />
    <circle cx="175" cy="100" r="1.5" fill="#fbbf24" />
    <circle cx="205" cy="115" r="1" fill="#34d399" />
  </g>

  <!-- Bookshelf / Plant Prop in background -->
  <path d="M 25 50 L 55 50 L 55 160 L 25 160 Z" fill="#0f172a" opacity="0.5"/>
  <!-- Plant leaves -->
  <path d="M 40 50 Q 30 35 20 40 Q 30 45 40 50" fill="#10b981" />
  <path d="M 40 50 Q 55 35 60 45 Q 45 45 40 50" fill="#059669" />

  <!-- Warm Hanging Lamp / Light cone -->
  <circle cx="120" cy="0" r="100" fill="url(#lampGlow)" pointer-events="none" />
  <path d="M 115 0 L 125 0 L 128 25 L 112 25 Z" fill="#475569" />
  <line x1="120" y1="0" x2="120" y2="-10" stroke="#475569" stroke-width="2" />

  <!-- Wooden Table/Desk in Foreground -->
  <path d="M 15 155 L 225 155 L 235 200 L 5 200 Z" fill="#334155" filter="url(#softShadow)" />
  <path d="M 20 150 L 220 150 L 225 156 L 15 156 Z" fill="#475569" />

  <!-- Coffee Mug Prop on Desk -->
  <g transform="translate(185, 140)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#38bdf8" />
    <path d="M 16 4 C 21 4 21 14 16 14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="8" cy="0" rx="8" ry="3" fill="#7dd3fc" />
  </g>

  <!-- Mail Delivery Box / Envelope (Open, representing "He sent me...") -->
  <g transform="translate(45, 145)">
    <path d="M 0 15 L 20 0 L 40 15 L 40 35 L 0 35 Z" fill="#cbd5e1" />
    <path d="M 0 15 L 20 25 L 40 15" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 0 35 L 15 18 L 25 18 L 40 35 Z" fill="#e2e8f0" />
  </g>

  <!-- CHARACTER: Receiving / Holding the Wedding Invitation -->
  <!-- Chair Back -->
  <rect x="95" y="125" width="50" height="65" rx="8" fill="#1e293b" />

  <!-- Character Body (Sitting, Leaning Forward) -->
  <g id="character">
    <!-- Torso (Wearing a cozy teal sweater) -->
    <path d="M 95 130 C 95 110 145 110 145 130 L 155 180 L 85 180 Z" fill="#0d9488" filter="url(#softShadow)" />
    <!-- Sweater collar -->
    <path d="M 110 112 C 110 120 130 120 130 112 C 125 110 115 110 110 112 Z" fill="#14b8a6" />

    <!-- Head and Face -->
    <g transform="translate(120, 92)">
      <!-- Neck -->
      <rect x="-8" y="10" width="16" height="15" fill="#fbcfe8" />
      <!-- Head shape -->
      <circle cx="0" cy="0" r="22" fill="#fbcfe8" />
      <!-- Hair (Stylish dark bob/layered cut) -->
      <path d="M -22 -2 C -24 -20 -5 -25 15 -18 C 24 -15 23 -2 23 -2 C 23 -2 20 -15 8 -18 C -5 -20 -18 -12 -22 -2 Z" fill="#334155" />
      <path d="M -22 -2 C -24 10 -20 20 -10 22 C -18 15 -20 5 -22 -2 Z" fill="#334155" />
      <!-- Gentle, Happy Facial Expression -->
      <!-- Eyes (Happy closed curves or soft open eyes looking down at invitation) -->
      <path d="M -8 -2 C -6 -5 -2 -5 0 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M 6 -2 C 8 -5 12 -5 14 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <!-- Rosy Cheeks -->
      <circle cx="-10" cy="4" r="4" fill="#f43f5e" opacity="0.3" />
      <circle cx="12" cy="4" r="4" fill="#f43f5e" opacity="0.3" />
      <!-- Smile -->
      <path d="M -4 7 C 0 11 4 11 8 7" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Arms & Hands holding the Invitation -->
    <!-- Left Arm -->
    <path d="M 95 130 Q 80 150 95 165" fill="none" stroke="#0d9488" stroke-width="14" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M 145 130 Q 165 145 145 165" fill="none" stroke="#0d9488" stroke-width="14" stroke-linecap="round" />
    
    <!-- Hands -->
    <circle cx="95" cy="167" r="6" fill="#fbcfe8" />
    <circle cx="145" cy="167" r="6" fill="#fbcfe8" />
  </g>

  <!-- THE WEDDING INVITATION (请柬 - qǐngjiǎn) - Hero Prop -->
  <!-- Angled elegantly in hands -->
  <g transform="translate(120, 155) rotate(-8)" filter="url(#softShadow)">
    <!-- Main Card Base (Folded/Open elegant wedding card) -->
    <rect x="-35" y="-25" width="70" height="50" rx="3" fill="#fffbeb" stroke="#fef08a" stroke-width="1.5" />
    
    <!-- Inner Border / Gold Foil Frame -->
    <rect x="-31" y="-21" width="62" height="42" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Romantic / Wedding Graphic Elements on Card (Abstract vectors mimicking a wedding invite layout) -->
    <!-- Two intersecting wedding rings / floral wreath motif -->
    <circle cx="0" cy="-3" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
    <circle cx="6" cy="-3" r="10" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.7" />

    <!-- Miniature Heart Accent -->
    <path d="M 0 11 C -3 7 -8 7 -8 3 C -8 0 -3 0 0 4 C 3 0 8 0 8 3 C 8 7 3 7 0 11 Z" fill="#f43f5e" transform="scale(0.6) translate(0, 10)" />

    <!-- Elegant abstract text lines representing invitation details (Strictly NO actual words/letters) -->
    <line x1="-20" y1="-12" x2="-5" y2="-12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="5" y1="-12" x2="20" y2="-12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-15" y1="13" x2="15" y2="13" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sparkles / Joyful Atmosphere around the Invitation -->
  <g fill="#fbbf00">
    <!-- Star sparkle 1 -->
    <path d="M 80 120 Q 85 120 85 115 Q 85 120 90 120 Q 85 120 85 125 Q 85 120 80 120 Z" />
    <!-- Star sparkle 2 -->
    <path d="M 155 135 Q 158 135 158 132 Q 158 135 161 135 Q 158 135 158 138 Q 158 135 155 135 Z" />
    <!-- Floating tiny heart -->
    <path d="M 140 105 C 138 102 134 102 134 99 C 134 97 137 97 139 99 C 141 97 144 97 144 99 C 144 102 140 102 140 105 Z" fill="#f43f5e" opacity="0.8" transform="scale(0.8)" />
  </g>

  <!-- Foreground Atmospheric Vignette / Frame enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" pointer-events="none" />
</svg>