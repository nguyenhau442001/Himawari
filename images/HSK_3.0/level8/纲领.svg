<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Podium Glow -->
    <linearGradient id="podium-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Document Gold Accent -->
    <linearGradient id="gold-doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Spotlight -->
  <circle cx="120" cy="90" r="110" fill="url(#spotlight)"/>

  <!-- Architectural Background Elements (Conference Hall / Meeting Room) -->
  <!-- Back Wall Paneling -->
  <path d="M40 180 L200 180 L220 210 L20 210 Z" fill="#090d16" opacity="0.6"/>
  
  <!-- Subtle Wall Banners / Flags hinting at an organizational gathering -->
  <path d="M65 40 L95 40 L90 140 L70 140 Z" fill="#334155" opacity="0.4"/>
  <path d="M145 40 L175 40 L180 140 L160 140 Z" fill="#334155" opacity="0.4"/>
  
  <!-- Central Emblem / Star Motif on Wall (Abstract geometric, no text) -->
  <g transform="translate(120, 55)" opacity="0.8">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,5 -7,9 -5,1 -11,-4 -3,-4" fill="#fbbf24"/>
  </g>

  <!-- Raised Podium Structure -->
  <path d="M85 155 L155 155 L165 195 L75 195 Z" fill="#334155" filter="url(#shadow)"/>
  <!-- Podium Front Panel -->
  <path d="M90 160 L150 160 L158 190 L82 190 Z" fill="#1e293b"/>
  <!-- Podium Glowing Center Accent -->
  <path d="M105 165 L135 165 L138 185 L102 185 Z" fill="url(#podium-glow)"/>
  <rect x="112" y="171" width="16" height="3" rx="1.5" fill="#fbbf24" opacity="0.8"/>
  <rect x="115" y="177" width="10" height="2" rx="1" fill="#fbbf24" opacity="0.5"/>

  <!-- Speaker Character (Confident, professional leader gesturing forward) -->
  <!-- Body & Suit Jacket -->
  <path d="M95 145 C95 130 145 130 145 145 L155 200 L85 200 Z" fill="#0f172a" filter="url(#shadow)"/>
  <!-- Suit Lapels & Shirt -->
  <path d="M120 145 L110 170 L130 170 Z" fill="#f8fafc"/>
  <path d="M110 145 L120 170 L102 195 L85 195 Z" fill="#1e293b"/>
  <path d="M130 145 L120 170 L138 195 L155 195 Z" fill="#1e293b"/>
  <polygon points="120,162 117,175 123,175" fill="#dc2626"/> <!-- Red Tie -->

  <!-- Neck & Head -->
  <rect x="113" y="125" width="14" height="22" rx="6" fill="#fbcfe8"/>
  <!-- Head Base -->
  <circle cx="120" cy="115" r="16" fill="#fbcfe8"/>
  
  <!-- Hair (Professional styled dark hair) -->
  <path d="M104 114 C104 100 136 100 136 114 C136 116 134 110 120 106 C106 110 104 116 104 114 Z" fill="#0f172a"/>

  <!-- Facial Expression (Determined, inspiring, speaking mouth) -->
  <circle cx="115" cy="113" r="1.5" fill="#0f172a"/>
  <circle cx="125" cy="113" r="1.5" fill="#0f172a"/>
  <path d="M117 122 Q120 125 123 122" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms & Gestures -->
  <!-- Left arm holding/resting near podium -->
  <path d="M98 145 L85 170 L95 175 L103 150 Z" fill="#1e293b"/>
  
  <!-- Right Arm raised dynamically pointing/presenting -->
  <path d="M142 145 C155 145 168 135 175 125 C178 120 173 115 168 120 C162 127 152 135 138 142 Z" fill="#1e293b"/>
  <circle cx="177" cy="122" r="5" fill="#fbcfe8"/> <!-- Hand -->

  <!-- THE CORE PROP: The Action Document / Manifesto (纲领 - Guangling / Action Program) -->
  <g transform="translate(100, 138) rotate(-12)" filter="url(#shadow)">
    <!-- Document Base -->
    <rect x="0" y="0" width="34" height="44" rx="2" fill="url(#gold-doc)" stroke="#d97706" stroke-width="1.5"/>
    <!-- Header stripe representing core principles -->
    <rect x="4" y="5" width="26" height="6" rx="1.5" fill="#dc2626"/>
    <!-- Abstract text lines representing structured policy points -->
    <rect x="6" y="15" width="22" height="2" rx="1" fill="#78350f" opacity="0.7"/>
    <rect x="6" y="20" width="18" height="2" rx="1" fill="#78350f" opacity="0.7"/>
    <rect x="6" y="25" width="22" height="2" rx="1" fill="#78350f" opacity="0.7"/>
    <rect x="6" y="30" width="14" height="2" rx="1" fill="#78350f" opacity="0.7"/>
    <!-- Official Red Seal Stamp on document -->
    <circle cx="24" cy="36" r="5" fill="#dc2626" opacity="0.85"/>
    <circle cx="24" cy="36" r="3.5" fill="none" stroke="#fef3c7" stroke-width="0.75"/>
  </g>

  <!-- Foreground Atmospheric Elements (Audience silhouettes at the bottom) -->
  <path d="M0 240 L0 215 C30 205 60 215 90 225 C120 235 150 215 180 220 C200 223 220 230 240 240 Z" fill="#090d16"/>
  <path d="M40 240 L40 222 C60 215 80 225 100 232 L130 240 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M150 240 L160 220 C180 215 200 225 220 235 L230 240 Z" fill="#0f172a" opacity="0.8"/>

  <!-- Dynamic lighting particles / Sparkles of progress and focus -->
  <circle cx="75" cy="95" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="165" cy="80" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="150" cy="65" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="95" cy="70" r="1.5" fill="#fbbf24" opacity="0.7"/>
</svg>