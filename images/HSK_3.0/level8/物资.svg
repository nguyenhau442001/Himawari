<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stack of relief supply boxes -->
  <g transform="translate(60, 80)">
    <!-- Bottom box -->
    <rect x="0" y="40" width="120" height="80" fill="#E67E22" rx="4"/>
    <rect x="10" y="50" width="100" height="60" fill="#D35400" rx="2"/>
    
    <!-- Middle box -->
    <rect x="10" y="20" width="100" height="60" fill="#F39C12" rx="4"/>
    <rect x="20" y="30" width="80" height="40" fill="#E67E22" rx="2"/>
    
    <!-- Top box -->
    <rect x="25" y="0" width="70" height="40" fill="#F1C40F" rx="4"/>
    <rect x="35" y="10" width="50" height="20" fill="#F39C12" rx="2"/>
    
    <!-- Strapping/Detail lines -->
    <path d="M 40 0 L 40 120 M 80 0 L 80 120" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 60 L 120 60 M 10 30 L 110 30" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>