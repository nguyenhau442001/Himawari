<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Traditional Chinese 'Dou' (斗) Measure / Grain Scoop Object -->
    <!-- Drop Shadow / Glow -->
    <path d="M-55,20 L55,20 L40,75 L-40,75 Z" fill="#FF8C00" opacity="0.15" filter="blur(8px)"/>
    
    <!-- Main Body of the Dou (Square wooden measure vessel) -->
    <!-- Back Rim Inner Edge -->
    <path d="M-42,-25 L42,-25 L46,-15 L-46,-15 Z" fill="#2C3240"/>
    
    <!-- Outer Trapezoidal Body -->
    <path d="M-50,-10 L50,-10 L40,65 L-40,65 Z" fill="#2E394D"/>
    
    <!-- Front Face (Slightly lighter to create 3D flat shading) -->
    <path d="M-50,-10 L50,-10 L45,60 L-45,60 Z" fill="none"/>
    
    <!-- Wooden Planks / Texture Lines -->
    <line x1="-47" y1="5" x2="47" y2="5" stroke="#1F2633" stroke-width="2"/>
    <line x1="-44" y1="25" x2="44" y2="25" stroke="#1F2633" stroke-width="2"/>
    <line x1="-41" y1="45" x2="41" y2="45" stroke="#1F2633" stroke-width="2"/>

    <!-- Rim / Top Edge (Thick border) -->
    <path d="M-58,-32 L58,-32 L50,-10 L-50,-10 Z" fill="#FFB347"/>
    <path d="M-54,-28 L54,-28 L46,-12 L-46,-12 Z" fill="#2E394D"/>

    <!-- Bottom Base -->
    <path d="M-40,65 L40,65 L32,75 L-32,75 Z" fill="#1F2633"/>

    <!-- Glowing Grain Overflow (Representing abundance/contest of wealth or measure) -->
    <!-- Individual stylized flat vector grains/coins piling up inside and spilling over -->
    <circle cx="-15" cy="-5" r="7" fill="#FFB347"/>
    <circle cx="5" cy="-8" r="8" fill="#FF8C00"/>
    <circle cx="20" cy="-3" r="6" fill="#FFB347"/>
    <circle cx="-5" cy="-15" r="7" fill="#FFD166"/>
    <circle cx="-25" cy="-12" r="6" fill="#FF8C00"/>
    
    <circle cx="0" cy="-22" r="6" fill="#FFB347"/>
    <circle cx="15" cy="-18" r="7" fill="#FFD166"/>
    <circle cx="-15" cy="-25" r="6" fill="#FF8C00"/>
    
    <!-- Metal Band / Reinforcement Bracket (Common on traditional Dou) -->
    <path d="M-47,15 L-41,45 L-38,45 L-44,15 Z" fill="#FFB347" opacity="0.8"/>
    <path d="M47,15 L41,45 L38,45 L44,15 Z" fill="#FFB347" opacity="0.8"/>
  </g>
</svg>