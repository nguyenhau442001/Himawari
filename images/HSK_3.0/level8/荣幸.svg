<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Architectural Interior Context (Office / Formal Meeting Room) -->
  <!-- Ambient background glow from warm window/light -->
  <circle cx="120" cy="90" r="90" fill="url(#warmLight)"/>
  
  <!-- Window frames / Architecture lines -->
  <path d="M40 180 L200 180" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <rect x="70" y="35" width="100" height="100" rx="8" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <path d="M120 35 L120 135" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <path d="M70 85 L170 85" stroke="#334155" stroke-width="1" opacity="0.4"/>

  <!-- Hanging indoor plant for rich environment -->
  <path d="M195 35 Q195 50 190 60" stroke="#475569" stroke-width="1.5" fill="none"/>
  <circle cx="190" cy="35" r="8" fill="#334155"/>
  <path d="M185 32 Q175 40 180 50 Q188 45 185 32" fill="#10b981" opacity="0.8"/>
  <path d="M195 32 Q205 42 198 52 Q190 46 195 32" fill="#059669" opacity="0.9"/>
  <path d="M190 35 Q185 48 193 58 Q197 48 190 35" fill="#34d399" opacity="0.8"/>

  <!-- Foreground Desk & Professional Props -->
  <path d="M20 195 L220 195 L210 165 L30 165 Z" fill="#0f172a" filter="url(#softShadow)"/>
  <path d="M20 195 L220 195" stroke="#475569" stroke-width="2"/>
  
  <!-- Desk Props: Laptop, Warm Lamp, Badge/Nameplate -->
  <!-- Laptop -->
  <path d="M45 180 L75 180 L80 168 L40 168 Z" fill="#64748b"/>
  <path d="M42 168 L78 168 L75 152 L45 152 Z" fill="#cbd5e1" opacity="0.9"/>
  <rect x="48" y="155" width="27" height="11" rx="1" fill="#0ea5e9" opacity="0.7"/>

  <!-- Warm Desk Lamp -->
  <path d="M190 180 L200 180 L197 150 L193 150 Z" fill="#475569"/>
  <path d="M185 150 Q195 140 205 150 Z" fill="url(#goldAcc)"/>
  <!-- Light cone -->
  <path d="M185 152 L160 195 L210 195 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- Meeting Character Left: Senior / Host (Welcoming gesture) -->
  <g transform="translate(0, 0)">
    <!-- Shadow -->
    <ellipse cx="75" cy="195" rx="22" ry="5" fill="#000000" opacity="0.4"/>
    
    <!-- Body / Suit -->
    <path d="M55 195 L58 150 Q65 140 75 140 Q85 140 92 150 L95 195 Z" fill="url(#suitGrad)" filter="url(#softShadow)"/>
    <!-- Shirt & Tie -->
    <path d="M68 145 L75 160 L82 145 Z" fill="#f8fafc"/>
    <path d="M73 155 L75 175 L77 155 Z" fill="#ef4444"/>

    <!-- Head & Neck -->
    <path d="M71 138 L79 138 L81 145 L69 145 Z" fill="#fbcfe8"/>
    <circle cx="75" cy="122" r="16" fill="#fbcfe8" filter="url(#softShadow)"/>
    
    <!-- Hair (Neat executive style) -->
    <path d="M59 122 Q59 105 75 106 Q91 105 91 122 Q91 114 75 112 Q59 114 59 122 Z" fill="#334155"/>

    <!-- Friendly Expressive Face (Smiling eyes, warm expression) -->
    <path d="M69 120 Q71 117 73 120" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M77 120 Q79 117 81 120" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Gentle smile -->
    <path d="M72 127 Q75 131 78 127" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <circle cx="67" cy="125" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="83" cy="125" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Left Arm & Hand gesturing welcome (pointing open palm towards guest) -->
    <path d="M60 152 Q50 162 55 175 Q60 170 65 160 Z" fill="#334155"/>
    <circle cx="53" cy="177" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Meeting Character Right: Guest / Employee (Bowing slightly / Handshake or Respectful gesture showing "榮幸") -->
  <g transform="translate(0, 0)">
    <!-- Shadow -->
    <ellipse cx="165" cy="195" rx="22" ry="5" fill="#000000" opacity="0.4"/>

    <!-- Body / Suit (Slightly leaning forward respectfully) -->
    <path d="M145 195 L150 152 Q158 142 168 142 Q178 142 183 152 L185 195 Z" fill="url(#primaryGrad)" filter="url(#softShadow)"/>
    <!-- Shirt & Accent Tie -->
    <path d="M161 147 L168 162 L175 147 Z" fill="#f8fafc"/>
    <path d="M166 157 L168 175 L170 157 Z" fill="#0284c7"/>

    <!-- Head & Neck (Leaning forward with deep respect/pleasure) -->
    <path d="M162 140 L170 140 L173 147 L159 147 Z" fill="#fbcfe8"/>
    <circle cx="167" cy="124" r="16" fill="#fbcfe8" filter="url(#softShadow)"/>

    <!-- Hair (Trendy modern cut) -->
    <path d="M151 124 Q153 106 167 106 Q183 107 181 124 Q183 115 167 113 Q151 115 151 124 Z" fill="#1e293b"/>

    <!-- Expressive Face (Eyes closed in warm, sincere gratitude/joy, big smile) -->
    <path d="M160 123 Q163 126 165 123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M170 123 Q172 126 174 123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Warm wide happy smile -->
    <path d="M163 129 Q167 134 171 129" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <circle cx="158" cy="127" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="175" cy="127" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Right Arm / Hand in respectful posture (hand over heart / chest or meeting handshake gesture) -->
    <path d="M175 155 Q185 165 175 178 Q168 175 165 165 Z" fill="#0284c7"/>
    <circle cx="178" cy="179" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Central Interaction / Sparkles of "Honor / Pleased to meet you" feeling -->
  <g transform="translate(120, 105)">
    <!-- Floating Sparkles / Warm Emotional Accents -->
    <path d="M0 -15 L3 -5 L13 -2 L5 3 L8 13 L0 7 L-8 13 L-5 3 L-13 -2 L-3 -5 Z" fill="url(#goldAcc)" filter="url(#softShadow)"/>
    <circle cx="-25" cy="-25" r="2.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="28" cy="-10" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="-20" cy="15" r="1.5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="22" cy="18" r="3" fill="#34d399" opacity="0.8"/>
  </g>

  <!-- Subtle vignette / border polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>