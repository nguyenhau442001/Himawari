<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Background glow/highlight for the device body -->
    <rect x="24" y="24" width="168" height="168" rx="16" fill="#222733" stroke="#2F3646" stroke-width="2"/>
    
    <!-- Precision Instrument Body (Sleek dark metallic plate) -->
    <rect x="36" y="36" width="144" height="144" rx="12" fill="#1E232F"/>
    
    <!-- Subtle mechanical panel details -->
    <!-- Corner screws -->
    <circle cx="48" cy="48" r="3" fill="#2F3646"/>
    <circle cx="168" cy="48" r="3" fill="#2F3646"/>
    <circle cx="48" cy="168" r="3" fill="#2F3646"/>
    <circle cx="168" cy="168" r="3" fill="#2F3646"/>
    
    <!-- Instrument lens / sensor or display housing in upper portion -->
    <rect x="60" y="56" width="96" height="48" rx="8" fill="#151821" stroke="#2B3240" stroke-width="2"/>
    <circle cx="84" cy="80" r="14" fill="#252D3D"/>
    <circle cx="84" cy="80" r="6" fill="#00D2FF" opacity="0.8"/>
    
    <!-- Tech lines inside display -->
    <line x1="108" y1="73" x2="138" y2="73" stroke="#3A4456" stroke-width="3" stroke-linecap="round"/>
    <line x1="108" y1="87" x2="128" y2="87" stroke="#3A4456" stroke-width="3" stroke-linecap="round"/>

    <!-- Focal Point: The Unique Serial Number Tag & Laser Engraving (编号) -->
    <rect x="54" y="120" width="108" height="40" rx="6" fill="#12151B" stroke="#F5A623" stroke-width="2"/>
    
    <!-- Barcode representation -->
    <g transform="translate(64, 130)">
      <rect x="0" y="0" width="3" height="20" fill="#8C9BAE"/>
      <rect x="5" y="0" width="2" height="20" fill="#8C9BAE"/>
      <rect x="9" y="0" width="4" height="20" fill="#8C9BAE"/>
      <rect x="15" y="0" width="2" height="20" fill="#8C9BAE"/>
      <rect x="19" y="0" width="5" height="20" fill="#8C9BAE"/>
      <rect x="26" y="0" width="2" height="20" fill="#8C9BAE"/>
      <rect x="30" y="0" width="3" height="20" fill="#8C9BAE"/>
    </g>

    <!-- Serial digits (represented as crisp modern geometric blocks to avoid random text) -->
    <g transform="translate(108, 131)">
      <!-- Number block 1 -->
      <rect x="0" y="0" width="4" height="18" rx="1" fill="#F5A623"/>
      <!-- Number block 2 -->
      <rect x="7" y="0" width="4" height="18" rx="1" fill="#F5A623"/>
      <!-- Number block 3 -->
      <rect x="14" y="0" width="4" height="18" rx="1" fill="#F5A623"/>
      <!-- Number block 4 -->
      <rect x="21" y="0" width="4" height="18" rx="1" fill="#F5A623"/>
      <!-- Number block 5 -->
      <rect x="28" y="0" width="4" height="18" rx="1" fill="#F5A623"/>
      <!-- Number block 6 -->
      <rect x="35" y="0" width="4" height="18" rx="1" fill="#F5A623"/>
    </g>

    <!-- Laser/Scanning Target Reticle highlighting the serial number (Precision emphasis) -->
    <path d="M 46 116 L 46 112 L 50 112" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <path d="M 170 116 L 170 112 L 166 112" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <path d="M 46 164 L 46 168 L 50 168" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <path d="M 170 164 L 170 168 L 166 168" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>