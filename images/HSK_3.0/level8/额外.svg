<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Golden Bonus Glow Gradient -->
    <radialGradient id="bonus-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Envelope Gradient -->
    <linearGradient id="env-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Screen Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Details: Office Wall & Window -->
  <g id="environment">
    <!-- Window Frame -->
    <rect x="156" y="24" width="60" height="76" rx="4" fill="#334155" />
    <rect x="160" y="28" width="52" height="68" rx="2" fill="#0284c7" fill-opacity="0.2" />
    <!-- Window Panes Grid -->
    <line x1="186" y1="28" x2="186" y2="96" stroke="#334155" stroke-width="2" />
    <line x1="160" y1="62" x2="212" y2="62" stroke="#334155" stroke-width="2" />

    <!-- Light Beam from Window -->
    <polygon points="160,28 120,200 240,200 212,28" fill="url(#light-beam)" />

    <!-- Wall Shelf with Plant and Books -->
    <rect x="24" y="36" width="64" height="4" rx="2" fill="#475569" />
    <!-- Plant Pot -->
    <path d="M34 36 L38 26 L46 26 L50 36 Z" fill="#cbd5e1" />
    <!-- Plant Leaves -->
    <path d="M42 26 C42 20, 36 16, 32 18 C36 22, 40 24, 42 26 Z" fill="#10b981" />
    <path d="M42 26 C42 18, 48 14, 52 16 C48 20, 44 24, 42 26 Z" fill="#34d399" />
    <!-- Books -->
    <rect x="58" y="20" width="8" height="16" rx="1" fill="#f43f5e" />
    <rect x="67" y="18" width="10" height="18" rx="1" fill="#38bdf8" />
  </g>

  <!-- Office Desk and Equipment -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <rect x="12" y="150" width="216" height="8" rx="2" fill="#475569" />
    <rect x="20" y="158" width="200" height="52" fill="#334155" />
    <path d="M20 150 L20 158 L220 158 L220 150 Z" fill="#64748b" />

    <!-- Desk Legs -->
    <rect x="32" y="210" width="10" height="22" fill="#1e293b" />
    <rect x="198" y="210" width="10" height="22" fill="#1e293b" />

    <!-- Computer Monitor -->
    <rect x="110" y="90" width="70" height="46" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <rect x="114" y="94" width="62" height="34" rx="2" fill="#0f172a" />
    <!-- Monitor Stand -->
    <path d="M135 136 L155 136 L158 150 L132 150 Z" fill="#64748b" />
    <!-- UI Graph on Screen -->
    <polyline points="118,120 128,112 138,116 148,104 158,108 170,98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="170" cy="98" r="2" fill="#38bdf8" />

    <!-- Coffee Mug -->
    <rect x="85" y="132" width="16" height="18" rx="2" fill="#f8fafc" />
    <path d="M101 136 C105 136, 105 146, 101 146" fill="none" stroke="#f8fafc" stroke-width="2" />

    <!-- Lamp -->
    <path d="M200 150 L190 100 L210 100 Z" fill="#fb923c" />
    <line x1="200" y1="100" x2="200" y2="70" stroke="#64748b" stroke-width="3" />
  </g>

  <!-- Main Character (Employee) -->
  <g id="character">
    <!-- Chair Back -->
    <rect x="50" y="95" width="36" height="65" rx="6" fill="#1e293b" />

    <!-- Character Body & Suit -->
    <!-- Torso -->
    <path d="M45 135 C45 125, 55 120, 70 120 C85 120, 95 125, 95 135 L98 175 L42 175 Z" fill="#3b82f6" />
    <!-- Shirt Collar & Tie -->
    <polygon points="70,120 62,132 78,132" fill="#f8fafc" />
    <polygon points="68,132 72,132 74,158 70,165 66,158" fill="#ef4444" />

    <!-- Character Head & Face -->
    <circle cx="70" cy="98" r="18" fill="#fde047" /> <!-- Skin base / warm tone -->
    <path d="M52 94 C52 84, 88 84, 88 94 C88 98, 86 102, 70 102 C54 102, 52 98, 52 94 Z" fill="#334155" /> <!-- Hair -->
    
    <!-- Facial Features: Joyful Expression -->
    <!-- Eyes (happy curves) -->
    <path d="M60 96 Q64 92 68 96" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M72 96 Q76 92 80 96" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M65 102 Q70 108 75 102" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks (blush) -->
    <circle cx="58" cy="101" r="3" fill="#f43f5e" fill-opacity="0.4" />
    <circle cx="82" cy="101" r="3" fill="#f43f5e" fill-opacity="0.4" />

    <!-- Arms & Hands -->
    <!-- Left Arm (resting on desk) -->
    <path d="M48 130 L35 145 L50 152" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="35" cy="146" r="5" fill="#fde047" />

    <!-- Right Arm (holding bonus envelope excitedly) -->
    <path d="M92 130 L110 120 L118 135" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="118" cy="136" r="5" fill="#fde047" />
  </g>

  <!-- The "Extra Bonus" Element (Bonus Envelope & Floating Coins) -->
  <g id="bonus-elements">
    <!-- Golden Glow Backdrop for Bonus -->
    <circle cx="125" cy="115" r="35" fill="url(#bonus-glow)" />

    <!-- Floating Bonus Envelope -->
    <g transform="translate(112, 105) rotate(-12)">
      <!-- Envelope Body -->
      <rect width="36" height="24" rx="3" fill="url(#env-grad)" stroke="#fff" stroke-width="1.5" />
      <!-- Envelope Flap -->
      <path d="M0 0 L18 14 L36 0 Z" fill="#e11d48" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Floating Gold Coins (Representing "额外" / Extra Reward) -->
    <!-- Coin 1 -->
    <circle cx="102" cy="85" r="8" fill="url(#coin-grad)" stroke="#fff" stroke-width="1" />
    <circle cx="102" cy="85" r="5" fill="none" stroke="#d97706" stroke-width="1" />
    
    <!-- Coin 2 -->
    <circle cx="138" cy="78" r="10" fill="url(#coin-grad)" stroke="#fff" stroke-width="1.5" />
    <circle cx="138" cy="78" r="6" fill="none" stroke="#d97706" stroke-width="1.2" />

    <!-- Coin 3 (Smaller, dynamic) -->
    <circle cx="145" cy="98" r="6" fill="url(#coin-grad)" stroke="#fff" stroke-width="1" />

    <!-- Sparkles / Glitters -->
    <path d="M125 70 L127 75 L132 77 L127 79 L125 84 L123 79 L118 77 L123 75 Z" fill="#fef08a" />
    <path d="M92 98 L93 101 L96 102 L93 103 L92 106 L91 103 L88 102 L91 101 Z" fill="#fef08a" />
    <path d="M142 118 L143 120 L145 121 L143 122 L142 124 L141 122 L139 121 L141 120 Z" fill="#fef08a" />
  </g>

</svg>