<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <path d="M40 180 L200 180 L200 190 L40 190 Z" fill="#334155"/>
  <circle cx="180" cy="80" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Character 1 (The Subject - Loyal) -->
  <g transform="translate(60, 100)">
    <path d="M20 120 L60 120 L55 80 L25 80 Z" fill="#38bdf8"/>
    <circle cx="40" cy="60" r="20" fill="#fde68a"/>
    <path d="M30 55 Q35 50 40 55 Q45 50 50 55" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M35 65 Q40 70 45 65" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Character 2 (The Friend) -->
  <g transform="translate(130, 100)">
    <path d="M20 120 L60 120 L55 80 L25 80 Z" fill="#ec4899"/>
    <circle cx="40" cy="60" r="20" fill="#fde68a"/>
    <path d="M30 55 Q35 50 40 55 Q45 50 50 55" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M35 65 Q40 70 45 65" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>

  <!-- The "Betrayal" Concept (Represented by a rejected contract/secret) -->
  <g transform="translate(100, 140) rotate(15)">
    <rect width="40" height="50" rx="4" fill="#f1f5f9"/>
    <path d="M10 15 L30 15 M10 25 L30 25 M10 35 L20 35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- The "No" symbol overlaying the thought of betrayal -->
    <circle cx="20" cy="25" r="25" stroke="#ef4444" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M5 5 L35 45" stroke="#ef4444" stroke-width="4" opacity="0.8"/>
  </g>

  <!-- Interaction -->
  <path d="M100 110 Q120 90 140 110" stroke="#fb923c" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
</svg>