<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Scenery Gradient (Night highway with motion) -->
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    
    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    
    <!-- Motion blur lines gradient -->
    <linearGradient id="motion-blur" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- BUS INTERIOR CONTEXT -->
  <!-- Bus Window Frame -->
  <path d="M 15 15 L 225 15 L 225 140 L 15 140 Z" fill="#0b0f19" stroke="#334155" stroke-width="4" />
  
  <!-- Window View (Night Highway motion) -->
  <g clip-path="url(#window-clip)">
    <clipPath id="window-clip">
      <path d="M 19 19 L 221 19 L 221 136 L 19 136 Z" />
    </clipPath>
    <rect x="19" y="19" width="202" height="117" fill="url(#night-sky)" />
    
    <!-- Distant City Lights / Stars -->
    <circle cx="50" cy="40" r="1.5" fill="#93c5fd" opacity="0.6" />
    <circle cx="120" cy="30" r="1" fill="#93c5fd" opacity="0.8" />
    <circle cx="180" cy="50" r="2" fill="#93c5fd" opacity="0.5" />
    
    <!-- Motion Streaks Outside (Say Che / Car sickness vibe) -->
    <rect x="20" y="60" width="80" height="2" fill="url(#motion-blur)" />
    <rect x="110" y="80" width="100" height="3" fill="url(#motion-blur)" />
    <rect x="40" y="100" width="60" height="1.5" fill="url(#motion-blur)" />
    <rect x="130" y="45" width="70" height="2" fill="url(#motion-blur)" />
    
    <!-- Highway Guardrail passing by -->
    <path d="M -20 120 L 260 115" stroke="#475569" stroke-width="3" stroke-dasharray="15 10" />
  </g>

  <!-- Bus Interior Elements: Seat Back & Headrest -->
  <path d="M 15 240 L 15 110 Q 15 95 30 95 L 95 95 Q 110 95 110 110 L 110 240 Z" fill="#334155" />
  <path d="M 25 105 Q 62 85 100 105 L 95 140 Q 62 125 30 140 Z" fill="#475569" opacity="0.5" /> <!-- Seat Headrest highlight -->

  <!-- PASSENGER CHARACTER (Experiencing Motion Sickness / 晕车) -->
  <g transform="translate(0, 5)">
    <!-- Body hunching forward over a disposal bag -->
    <!-- Torso (Blue hoodie/jacket) -->
    <path d="M 75 160 Q 70 185 85 215 L 135 215 Q 120 175 115 160 Z" fill="#0284c7" />
    
    <!-- Hoodie Hood crumpled behind neck -->
    <path d="M 80 135 Q 95 120 115 130 L 115 145 Q 95 140 80 145 Z" fill="#0369a1" />

    <!-- Arms gripping downward towards bag -->
    <path d="M 80 155 Q 65 170 75 190" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <path d="M 115 155 Q 130 170 120 190" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    
    <!-- Hands holding the brown paper motion-sickness bag -->
    <circle cx="78" cy="192" r="6" fill="url(#skin)" />
    <circle cx="118" cy="192" r="6" fill="url(#skin)" />

    <!-- Neck & Head (Leaned forward, green/pale face showing nausea) -->
    <path d="M 90 135 L 105 135 L 102 150 L 92 150 Z" fill="url(#skin)" />
    
    <!-- Head Group (Rotated forward/down) -->
    <g transform="translate(92, 115) rotate(15)">
      <!-- Face Base (Pale/Greenish tint for nausea) -->
      <rect x="-16" y="-18" width="32" height="36" rx="16" fill="#e2e8f0" />
      
      <!-- Hair (Messy, stressed) -->
      <path d="M -16 -5 Q -18 -20 0 -22 Q 18 -20 16 -5 Q 12 -12 0 -12 Q -12 -12 -16 -5 Z" fill="#334155" />
      
      <!-- Closed/Strained Eyes (X_X or tight arcs due to dizziness) -->
      <path d="M -10 -4 L -4 -2" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 4 -2 L 10 -4" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Sweat drops (Anxiety / Dizziness) -->
      <path d="M -14 -10 Q -16 -6 -14 -4 Q -12 -6 -14 -10 Z" fill="#38bdf8" />
      <path d="M 14 -8 Q 16 -4 14 -2 Q 12 -4 14 -8 Z" fill="#38bdf8" />
      
      <!-- Sick / Queasy Expression: Open curved mouth vomiting -->
      <path d="M -5 6 Q 0 4 5 6 Q 2 14 -5 6 Z" fill="#7f1d1d" />
      
      <!-- Rosy/Pale Cheeks -->
      <circle cx="-10" cy="2" r="3" fill="#cbd5e1" opacity="0.6" />
      <circle cx="10" cy="2" r="3" fill="#cbd5e1" opacity="0.6" />
    </g>
  </g>

  <!-- MOTION SICKNESS PROP: Disposal Bag & Action Effect (呕吐) -->
  <g transform="translate(95, 195)">
    <!-- Brown Paper Motion Sickness Bag -->
    <path d="M -12 0 L 12 0 L 15 35 L -15 35 Z" fill="#d97706" />
    <!-- Bag fold rim -->
    <path d="M -14 0 L 14 0 L 14 5 L -14 5 Z" fill="#b45309" />
    <!-- Bag depth shadow -->
    <path d="M -5 5 L 5 5 L 3 35 L -3 35 Z" fill="#92400e" opacity="0.4" />

    <!-- The Action / Fluid Graphic representing '呕吐' (Nausea/Vomiting action stream into bag) -->
    <path d="M -2 -8 Q -5 -3 -2 2 Q 1 7 -1 12" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <!-- Splash droplets into the bag -->
    <circle cx="-1" cy="15" r="2" fill="#bef264" />
    <circle cx="2" cy="18" r="1.5" fill="#bef264" />
    <circle cx="-3" cy="22" r="1" fill="#bef264" />
  </g>

  <!-- FOREGROUND BUS INTERIOR DETAILS -->
  <!-- Handrail overhead / seat handle -->
  <path d="M 195 0 L 195 80 Q 195 95 180 95 L 165 95" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="165" cy="95" r="5" fill="#94a3b8" />

  <!-- Ambient lighting/shadow gradient overlay for realism -->
  <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" pointer-events="none" />
</svg>