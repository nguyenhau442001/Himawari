<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b253b" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior & Context -->
  <!-- Wallpaper line -->
  <line x1="0" y1="140" x2="240" y2="140" stroke="#334155" stroke-width="2" />
  
  <!-- Window showing night city / atmospheric separation -->
  <path d="M170,30 L210,30 L210,110 L170,110 Z" fill="#090d16" stroke="#475569" stroke-width="3" />
  <line x1="190" y1="30" x2="190" y2="110" stroke="#475569" stroke-width="2" />
  <line x1="170" y1="70" x2="210" y2="70" stroke="#475569" stroke-width="2" />
  <!-- Tiny window city lights -->
  <rect x="175" y="40" width="4" height="6" fill="#fbbf24" opacity="0.6" />
  <rect x="182" y="55" width="4" height="6" fill="#38bdf8" opacity="0.6" />
  <rect x="198" y="85" width="4" height="6" fill="#fbbf24" opacity="0.4" />

  <!-- Bookshelf / Wall decor in background -->
  <rect x="25" y="40" width="40" height="8" rx="2" fill="#334155" />
  <path d="M30,40 L30,25 L36,25 L36,40 Z" fill="#ec4899" opacity="0.8" />
  <path d="M38,40 L38,20 L44,20 L44,40 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M46,40 L46,28 L52,28 L52,40 Z" fill="#10b981" opacity="0.8" />

  <!-- Floor -->
  <path d="M0,170 L240,170 L240,240 L0,240 Z" fill="url(#floorGrad)" />

  <!-- Center Wooden Desk -->
  <path d="M60,155 L180,155 L190,175 L50,175 Z" fill="url(#deskGrad)" />
  <rect x="65" y="175" width="12" height="50" fill="#1e293b" />
  <rect x="163" y="175" width="12" height="50" fill="#1e293b" />

  <!-- Props on desk: Broken photo frame and papers -->
  <g transform="translate(110, 142)">
    <!-- Broken frame base -->
    <path d="M -8,15 L 0,0 L 8,15 Z" fill="#fb923c" transform="rotate(-15)" />
    <path d="M 5,18 L 15,3 L 20,15 Z" fill="#fb923c" transform="rotate(25)" />
    <!-- Shattered glass lines -->
    <line x1="-5" y1="10" x2="10" y2="10" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Left Character (Person A - Turning away, arms crossed, resolute expression) -->
  <g transform="translate(45, 100)">
    <!-- Body / Torso turned slightly left -->
    <path d="M15,40 Q25,25 35,40 L40,75 L10,75 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="25" cy="18" r="14" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M11,15 Q25,2 39,15 Q39,8 25,5 Q11,8 11,15 Z" fill="#1e293b" />
    <!-- Serious / Cold Face profile -->
    <path d="M33,16 L37,18 L33,20" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Crossed Arms (blocking interaction) -->
    <path d="M15,45 L35,50 L25,60 L12,52 Z" fill="#2563eb" />
    <!-- Legs -->
    <rect x="14" y="75" width="8" height="35" fill="#0f172a" />
    <rect x="28" y="75" width="8" height="35" fill="#0f172a" />
  </g>

  <!-- Right Character (Person B - Staring in shock/disbelief, hands held back or dropped) -->
  <g transform="translate(150, 100)">
    <!-- Body / Torso -->
    <path d="M15,40 Q25,25 35,40 L45,75 L5,75 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="25" cy="18" r="14" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M10,18 Q25,0 40,18 Q35,8 25,6 Q15,8 10,18 Z" fill="#475569" />
    <!-- Sad / Shocked Face profile -->
    <circle cx="17" cy="17" r="2" fill="#1e293b" />
    <path d="M15,25 Q18,22 21,25" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Dropped arms -->
    <path d="M12,45 L5,65" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" />
    <path d="M38,45 L45,65" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" />
    <!-- Legs -->
    <rect x="12" y="75" width="8" height="35" fill="#1e293b" />
    <rect x="26" y="75" width="8" height="35" fill="#1e293b" />
  </g>

  <!-- Dramatic central visual element: Glowing breach / separation rift between them -->
  <g filter="url(#glow)">
    <path d="M120,40 L115,70 L125,100 L118,130 L122,160" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.9" />
    <path d="M121,50 L118,80 L124,110 L116,140" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Floating separation sparks -->
  <circle cx="110" cy="85" r="3" fill="#f43f5e" />
  <circle cx="130" cy="115" r="2" fill="#fbbf24" />
  <circle cx="115" cy="140" r="2.5" fill="#38bdf8" />
  <circle cx="125" cy="65" r="2" fill="#f43f5e" />

  <!-- Vignette overlay for cinematic depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="6" opacity="0.5" />
</svg>