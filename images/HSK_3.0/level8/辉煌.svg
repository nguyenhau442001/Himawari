<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Architectural Interior / Stage Backdrop -->
  <path d="M0 240 L0 180 L80 140 L160 140 L240 180 L240 240 Z" fill="#0f172a" opacity="0.8"/>
  <rect x="0" y="0" width="240" height="240" fill="url(#spotlight)"/>
  
  <!-- Glowing ambient light rays representing "辉煌" (Brilliance/Splendor) -->
  <g opacity="0.6" filter="url(#glow)">
    <polygon points="120,40 60,200 90,200" fill="url(#goldGlow)"/>
    <polygon points="120,40 150,200 180,200" fill="url(#goldGlow)"/>
    <polygon points="120,40 100,200 140,200" fill="url(#goldGlow)" opacity="0.8"/>
  </g>

  <!-- Confetti / Sparkling achievement elements -->
  <g fill="#fbbf24">
    <circle cx="50" cy="80" r="2" opacity="0.8"/>
    <circle cx="190" cy="90" r="3" opacity="0.6"/>
    <circle cx="70" cy="130" r="1.5" opacity="0.9"/>
    <circle cx="170" cy="120" r="2.5" opacity="0.7"/>
    <polygon points="40,50 43,56 49,57 44,61 46,67 40,64 34,67 36,61 31,57 37,56" transform="scale(0.5) translate(60, 40)" fill="#fef08a"/>
    <polygon points="40,50 43,56 49,57 44,61 46,67 40,64 34,67 36,61 31,57 37,56" transform="scale(0.4) translate(350, 120)" fill="#fef08a"/>
  </g>

  <!-- Wooden Stage Floor -->
  <rect x="0" y="195" width="240" height="45" fill="#1e1b4b"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#0f172a" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="225" x2="240" y2="225" stroke="#0f172a" stroke-width="1" opacity="0.5"/>

  <!-- Podium / Pedestal -->
  <path d="M90 195 L150 195 L160 215 L80 215 Z" fill="#334155"/>
  <path d="M80 215 L160 215 L170 240 L70 240 Z" fill="#1e293b"/>
  <rect x="95" y="203" width="50" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Main Character: Successful Achiever (Proud posture, professional attire) -->
  <g id="character">
    <!-- Shadow -->
    <ellipse cx="120" cy="235" rx="35" ry="5" fill="#020617" opacity="0.6"/>

    <!-- Legs/Suit Trousers -->
    <path d="M106 170 L104 220 L116 220 L118 170 Z" fill="#0f172a"/>
    <path d="M124 170 L126 220 L138 220 L136 170 Z" fill="#0f172a"/>
    <!-- Shoes -->
    <path d="M96 220 L116 220 L116 225 L94 225 Z" fill="#0f172a"/>
    <path d="M124 220 L144 220 L146 225 L124 225 Z" fill="#0f172a"/>

    <!-- Suit Torso -->
    <path d="M100 115 L140 115 L145 170 L95 170 Z" fill="#1e3a8a"/>
    <!-- Shirt & Tie -->
    <path d="M112 115 L128 115 L124 150 L116 150 Z" fill="#f8fafc"/>
    <polygon points="120,122 123,142 120,148 117,142" fill="#ef4444"/>
    <!-- Suit lapels -->
    <path d="M112 115 L120 140 L108 170 Z" fill="#1e40af"/>
    <path d="M128 115 L120 140 L132 170 Z" fill="#1e40af"/>

    <!-- Head & Neck -->
    <rect x="114" y="100" width="12" height="18" fill="#fbcfe8"/>
    <path d="M105 82 C105 72 135 72 135 82 C135 95 105 95 105 82 Z" fill="#33180c"/>
    <!-- Hair styling -->
    <path d="M106 82 C106 72 120 68 132 75 C125 70 115 72 106 82 Z" fill="#1e1b4b"/>
    <!-- Facial expression (Joyful/Proud smile) -->
    <path d="M114 88 Q120 93 126 88" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="113" cy="85" r="1" fill="#1e1b4b"/>
    <circle cx="127" cy="85" r="1" fill="#1e1b4b"/>

    <!-- Arms holding up a massive glowing trophy (Splendid Achievement) -->
    <!-- Left Arm -->
    <path d="M100 120 Q80 125 90 145" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right Arm -->
    <path d="M140 120 Q160 125 150 145" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- The Grand Trophy / Achievement Symbol (Representing "辉煌的成就") -->
  <g id="trophy" transform="translate(120, 95)" filter="url(#glow)">
    <!-- Trophy Base -->
    <path d="M-10 40 L10 40 L12 48 L-12 48 Z" fill="#b45309"/>
    <rect x="-6" y="32" width="12" height="8" fill="url(#trophyGold)"/>
    
    <!-- Trophy Stem -->
    <rect x="-3" y="16" width="6" height="16" fill="url(#trophyGold)"/>
    
    <!-- Trophy Cup Body -->
    <path d="M-22 -16 C-22 16 22 16 22 -16 L18 -22 C18 -22 10 -26 0 -26 C-10 -26 -18 -22 -18 -22 Z" fill="url(#trophyGold)"/>
    <path d="M-18 -18 C-18 8 18 8 18 -18 Z" fill="#fef08a" opacity="0.4"/>

    <!-- Trophy Handles -->
    <path d="M-19 -20 C-30 -20 -30 0 -18 2" stroke="url(#trophyGold)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M19 -20 C30 -20 30 0 18 2" stroke="url(#trophyGold)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Glowing Star on Trophy -->
    <polygon points="0,-16 3,-8 11,-8 5,-3 7,5 0,1 -7,5 -5,-3 -11,-8 -3,-8" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Foreground decorative golden burst particles for extra grandeur -->
  <g transform="translate(120, 80)" filter="url(#glow)">
    <circle cx="0" cy="-45" r="2" fill="#ffffff"/>
    <circle cx="-35" cy="-25" r="1.5" fill="#fef08a"/>
    <circle cx="35" cy="-25" r="2.5" fill="#fef08a"/>
    <circle cx="-25" cy="15" r="1.5" fill="#fbbf24"/>
    <circle cx="25" cy="15" r="2" fill="#fbbf24"/>
  </g>
</svg>