<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize "All/Total" collection -->
  <circle cx="120" cy="120" r="70" fill="#2D333B" opacity="0.6"/>
  <circle cx="120" cy="120" r="50" fill="#3A424E" opacity="0.4"/>

  <!-- Conceptual illustration: "All/Collection of physical items" (representing 统统 - everything/all objects) -->
  <g transform="translate(0, 5)">
    <!-- Open Gift Box / Container base (referencing "这些东西" - these things) -->
    <path d="M75 135 L85 175 L155 175 L165 135 Z" fill="#242B35" stroke="#3A424E" stroke-width="2"/>
    <rect x="70" y="125" width="100" height="15" rx="3" fill="#3A424E"/>
    
    <!-- Vertical Ribbon on Box -->
    <rect x="113" y="125" width="14" height="50" fill="#F59E0B" opacity="0.9"/>

    <!-- Group of diverse items floating out/being gathered together ("Everything/All") -->
    <!-- Item 1: Star (Top Center) -->
    <path d="M120 40 L124 50 L135 52 L127 60 L129 70 L120 65 L111 70 L113 60 L105 52 L116 50 Z" fill="#F59E0B"/>
    
    <!-- Item 2: Document/File (Left) -->
    <rect x="80" y="65" width="22" height="28" rx="3" fill="#38BDF8"/>
    <rect x="85" y="73" width="12" height="3" rx="1.5" fill="#1A1D24" opacity="0.5"/>
    <rect x="85" y="80" width="8" height="3" rx="1.5" fill="#1A1D24" opacity="0.5"/>

    <!-- Item 3: Gift Box / Cube (Right) -->
    <rect x="138" y="75" width="24" height="24" rx="4" fill="#EC4899"/>
    <rect x="148" y="75" width="4" height="24" fill="#F43F5E"/>
    <rect x="138" y="85" width="24" height="4" fill="#F43F5E"/>

    <!-- Item 4: Coin / Value (Far Left) -->
    <circle cx="70" cy="110" rx="10" fill="#FBBF24"/>
    <circle cx="70" cy="110" r="6" fill="#D97706" opacity="0.5"/>

    <!-- Item 5: Gem / Diamond (Far Right) -->
    <path d="M165 102 L175 110 L170 120 L160 120 L155 110 Z" fill="#A855F7"/>

    <!-- Motion/Collection indicator arcs converging into the box/collection -->
    <path d="M90 55 C95 55 105 60 110 70" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <path d="M150 65 C145 65 135 70 130 80" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <path d="M60 95 C70 95 80 100 85 110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <path d="M180 105 C170 105 160 110 155 115" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  </g>

  <!-- Focus / Completeness ring highlighting the totality -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#3A424E" stroke-width="2" stroke-dasharray="6 6"/>
</svg>