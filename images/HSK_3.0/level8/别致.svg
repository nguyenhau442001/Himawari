<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Boutique Interior Elements -->
  <path d="M40 180 L200 180 L200 220 L40 220 Z" fill="#334155"/>
  <circle cx="120" cy="80" r="50" fill="#334155" opacity="0.3"/>
  
  <!-- The Unique Clothing (The Subject) -->
  <g transform="translate(85, 60)">
    <!-- Asymmetrical Dress/Garment -->
    <path d="M35 10 L60 20 L55 100 L15 100 L5 40 Z" fill="#ec4899" stroke="#fbcfe8" stroke-width="2"/>
    <path d="M35 10 L20 30 L5 40 Z" fill="#fb923c"/>
    <circle cx="45" cy="50" r="4" fill="#fbbf24"/>
    <circle cx="30" cy="70" r="4" fill="#fbbf24"/>
  </g>
  
  <!-- Characters -->
  <!-- Person 1 (Pointing/Admiring) -->
  <g transform="translate(30, 110)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <path d="M20 35 L20 80 M20 50 L5 65 M20 50 L35 65" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 45 L50 40" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (Holding/Showing) -->
  <g transform="translate(160, 110)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <path d="M20 35 L20 80 M20 50 L5 65 M20 50 L35 65" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 45 L-10 40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkles/Emphasis -->
  <path d="M150 50 L155 40 L160 50 L170 55 L160 60 L155 70 L150 60 L140 55 Z" fill="#fbbf24"/>
  <path d="M80 90 L83 85 L86 90 L92 93 L86 96 L83 101 L80 96 L74 93 Z" fill="#fbbf24"/>
</svg>