<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Night sky gradient and background glow -->
  <defs>
    <linearGradient id="skyGrad" x1="120" y1="20" x2="120" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F131A"/>
      <stop offset="100%" stop-color="#222B3C"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="120" y1="60" x2="120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F75FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="buildingGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3A4A6B" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect x="0" y="0" width="240" height="240" fill="url(#skyGrad)"/>
  <ellipse cx="120" cy="180" rx="90" ry="40" fill="url(#glowGrad)"/>

  <!-- Distant background towers -->
  <rect x="55" y="90" width="20" height="110" fill="#263147" opacity="0.6"/>
  <rect x="165" y="70" width="22" height="130" fill="#263147" opacity="0.6"/>
  
  <!-- Mid-ground skyscrapers -->
  <rect x="75" y="70" width="30" height="130" fill="#2E3C54"/>
  <rect x="135" y="55" width="30" height="145" fill="#2E3C54"/>

  <!-- Central iconic mega-skyscraper (The core focal point) -->
  <path d="M105 40 L135 40 L140 200 L100 200 Z" fill="#3A4D6B"/>
  <path d="M115 25 L125 25 L125 40 L115 40 Z" fill="#FFB84D"/> <!-- Antenna/Spire -->
  <circle cx="120" cy="23" r="3" fill="#FF4D4D"/> <!-- Aviation warning light -->

  <!-- Architectural details / illuminated windows (Golden/Orange accents for high-contrast focus) -->
  <!-- Left building windows -->
  <rect x="81" y="80" width="6" height="8" fill="#FFB84D" opacity="0.8"/>
  <rect x="93" y="80" width="6" height="8" fill="#FFB84D" opacity="0.4"/>
  <rect x="81" y="96" width="6" height="8" fill="#FFB84D" opacity="0.5"/>
  <rect x="93" y="96" width="6" height="8" fill="#FFB84D" opacity="0.9"/>
  <rect x="81" y="112" width="6" height="8" fill="#FFB84D" opacity="0.9"/>
  <rect x="93" y="112" width="6" height="8" fill="#FFB84D" opacity="0.6"/>
  <rect x="81" y="128" width="6" height="8" fill="#FFB84D" opacity="0.3"/>
  <rect x="93" y="128" width="6" height="8" fill="#FFB84D" opacity="0.8"/>

  <!-- Center mega-tower windows -->
  <rect x="112" y="55" width="6" height="10" fill="#FFB84D" opacity="0.9"/>
  <rect x="122" y="55" width="6" height="10" fill="#FFB84D" opacity="0.5"/>
  <rect x="112" y="75" width="6" height="10" fill="#FFB84D" opacity="0.4"/>
  <rect x="122" y="75" width="6" height="10" fill="#FFB84D" opacity="0.9"/>
  <rect x="112" y="95" width="6" height="10" fill="#FFB84D" opacity="0.8"/>
  <rect x="122" y="95" width="6" height="10" fill="#FFB84D" opacity="0.8"/>
  <rect x="112" y="115" width="6" height="10" fill="#FFB84D" opacity="0.6"/>
  <rect x="122" y="115" width="6" height="10" fill="#FFB84D" opacity="0.9"/>
  <rect x="112" y="135" width="6" height="10" fill="#FFB84D" opacity="0.9"/>
  <rect x="122" y="135" width="6" height="10" fill="#FFB84D" opacity="0.4"/>
  <rect x="112" y="155" width="6" height="10" fill="#FFB84D" opacity="0.7"/>
  <rect x="122" y="155" width="6" height="10" fill="#FFB84D" opacity="0.7"/>

  <!-- Right building windows -->
  <rect x="141" y="65" width="6" height="8" fill="#FFB84D" opacity="0.7"/>
  <rect x="153" y="65" width="6" height="8" fill="#FFB84D" opacity="0.9"/>
  <rect x="141" y="81" width="6" height="8" fill="#FFB84D" opacity="0.4"/>
  <rect x="153" y="81" width="6" height="8" fill="#FFB84D" opacity="0.6"/>
  <rect x="141" y="97" width="6" height="8" fill="#FFB84D" opacity="0.9"/>
  <rect x="153" y="97" width="6" height="8" fill="#FFB84D" opacity="0.8"/>
  <rect x="141" y="113" width="6" height="8" fill="#FFB84D" opacity="0.8"/>
  <rect x="153" y="113" width="6" height="8" fill="#FFB84D" opacity="0.3"/>

  <!-- Foreground suspension bridge / urban connection element representing metropolis scale -->
  <path d="M30 190 L210 190" stroke="#4F75FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 190 Q 120 150 210 190" fill="none" stroke="#FFB84D" stroke-width="2"/>
  <line x1="60" y1="175" x2="60" y2="190" stroke="#FFB84D" stroke-width="1.5"/>
  <line x1="90" y1="164" x2="90" y2="190" stroke="#FFB84D" stroke-width="1.5"/>
  <line x1="150" y1="164" x2="150" y2="190" stroke="#FFB84D" stroke-width="1.5"/>
  <line x1="180" y1="175" x2="180" y2="190" stroke="#FFB84D" stroke-width="1.5"/>

  <!-- Base ground line -->
  <rect x="20" y="200" width="200" height="4" fill="#4F75FF" rx="2"/>

  <!-- Minimal modern framing accents (corners) -->
  <path d="M36 32 L28 32 L28 40" fill="none" stroke="#4F75FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M204 32 L212 32 L212 40" fill="none" stroke="#4F75FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M36 208 L28 208 L28 200" fill="none" stroke="#4F75FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M204 208 L212 208 L212 200" fill="none" stroke="#4F75FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>