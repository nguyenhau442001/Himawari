<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Window Cityscape Light Gradient -->
    <linearGradient id="window-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Context: Wall & Window (Indicating mainland location / modern room) -->
  <!-- Wall base -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b" />
  
  <!-- Modern Window looking out at city silhouette -->
  <g transform="translate(150, 15)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="75" height="95" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="5" y="5" width="65" height="85" fill="url(#window-sky)" />
    <!-- Distant Mainland Cityscape Silhouette (Stylized towers) -->
    <path d="M5 90 L5 60 L15 50 L15 90 Z" fill="#1e293b" opacity="0.8" />
    <path d="M18 90 L18 40 L30 30 L30 90 Z" fill="#1e293b" opacity="0.9" />
    <path d="M33 90 L33 55 L45 45 L45 90 Z" fill="#1e293b" opacity="0.7" />
    <path d="M48 90 L48 35 L60 25 L70 25 L70 90 Z" fill="#1e293b" opacity="0.95" />
    <!-- Window pane divider -->
    <line x1="37" y1="5" x2="37" y2="90" stroke="#334155" stroke-width="2" />
    <line x1="5" y1="47" x2="70" y2="47" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Bookshelf / Wall Decor -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="50" height="6" rx="2" fill="#475569" />
    <!-- Colorful books on shelf -->
    <rect x="5" y="-18" width="8" height="18" rx="1" fill="#ec4899" />
    <rect x="14" y="-22" width="10" height="22" rx="1" fill="#38bdf8" />
    <rect x="25" y="-15" width="7" height="15" rx="1" fill="#10b981" />
    <rect x="33" y="-20" width="12" height="20" rx="1" fill="#f59e0b" />
  </g>

  <!-- Desk Surface -->
  <rect x="10" y="150" width="220" height="80" rx="4" fill="#0f172a" />
  <rect x="10" y="150" width="220" height="6" rx="2" fill="#334155" />

  <!-- Warm Desk Lamp on Left -->
  <g transform="translate(35, 110)">
    <!-- Lamp Base -->
    <ellipse cx="15" cy="40" rx="12" ry="4" fill="#475569" />
    <!-- Lamp Arm -->
    <path d="M15 40 L15 15 L25 5" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp Shade -->
    <path d="M15 -2 L35 10 L25 15 Z" fill="#fbbf24" />
    <!-- Light Cone Glow Effect -->
    <circle cx="55" cy="50" r="45" fill="url(#lamp-glow)" />
  </g>

  <!-- Laptop & Modern Tech Setup (Centerpiece) -->
  <g transform="translate(75, 115)">
    <!-- Laptop Base -->
    <path d="M-15 35 L65 35 L75 42 L-25 42 Z" fill="#64748b" />
    <!-- Laptop Screen Frame -->
    <rect x="-10" y="-10" width="70" height="47" rx="3" fill="#334155" />
    <!-- Screen Display -->
    <rect x="-6" y="-6" width="62" height="39" rx="2" fill="#0f172a" />
    <!-- Document / Interface graphic on screen (Abstract simplified text blocks representing modern writing system) -->
    <rect x="-2" y="-2" width="30" height="4" rx="1" fill="#38bdf8" opacity="0.8" />
    <rect x="-2" y="5" width="50" height="3" rx="1" fill="#94a3b8" opacity="0.6" />
    <rect x="-2" y="11" width="42" height="3" rx="1" fill="#94a3b8" opacity="0.6" />
    <rect x="-2" y="17" width="48" height="3" rx="1" fill="#94a3b8" opacity="0.6" />
    <rect x="-2" y="23" width="25" height="3" rx="1" fill="#10b981" opacity="0.8" />
    <!-- Screen Glow overlay -->
    <rect x="-6" y="-6" width="62" height="39" rx="2" fill="url(#screen-glow)" />
  </g>

  <!-- Writing Notebook / Notepad on Desk -->
  <g transform="translate(155, 135)">
    <polygon points="0,15 45,0 55,25 10,40" fill="#f8fafc" />
    <!-- Notebook spine shadow -->
    <polygon points="0,15 10,40 13,38 4,13" fill="#cbd5e1" />
    <!-- Lines written in notebook (simplified clean modern strokes) -->
    <line x1="15" y1="18" x2="35" y2="11" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="25" x2="42" y2="17" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <line x1="21" y1="32" x2="38" y2="26" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cute Red Pen resting nearby -->
    <line x1="50" y1="30" x2="70" y2="45" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <polygon points="68,43 72,47 70,48" fill="#1e293b" />
  </g>

  <!-- Character: Focused Young Professional / Student sitting at desk -->
  <g transform="translate(95, 85)">
    <!-- Character Body / Torso (Modern hoodie/shirt) -->
    <path d="M10 65 L45 65 L55 95 L-5 95 Z" fill="#3b82f6" />
    <!-- Collar -->
    <path d="M15 65 L27 75 L39 65 Z" fill="#1e293b" />

    <!-- Character Neck -->
    <rect x="20" y="52" width="14" height="15" fill="#fed7aa" />

    <!-- Character Head -->
    <circle cx="27" cy="40" r="18" fill="#fed7aa" />

    <!-- Hair (Trendy modern dark hairstyle) -->
    <path d="M9 38 C9 25, 20 20, 30 22 C42 24, 45 35, 45 42 C45 42, 40 32, 28 30 C16 28, 12 35, 9 38 Z" fill="#0f172a" />
    <path d="M11 36 C13 28, 20 24, 30 25 C38 26, 43 32, 44 38 C38 34, 25 33, 11 36 Z" fill="#1e293b" />

    <!-- Facial Expression: Focused, engaged, pleasant -->
    <!-- Eyebrows (slight slant of concentration) -->
    <line x1="18" y1="35" x2="24" y2="37" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="30" y1="37" x2="36" y2="35" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Friendly Eyes (happy dots/curves) -->
    <circle cx="21" cy="40" r="2" fill="#0f172a" />
    <circle cx="33" cy="40" r="2" fill="#0f172a" />
    <!-- Smile (confident and relaxed) -->
    <path d="M24 46 Q27 49 30 46" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Subtle rosy cheek -->
    <circle cx="17" cy="43" r="3" fill="#f87171" opacity="0.4" />
    <circle cx="37" cy="43" r="3" fill="#f87171" opacity="0.4" />

    <!-- Arms typing / gesturing on desk -->
    <!-- Left Arm -->
    <path d="M-5 80 C0 70, 10 70, 15 75" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <!-- Right Arm reaching forward -->
    <path d="M45 80 C50 70, 45 60, 30 65" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="15" cy="76" r="4" fill="#fed7aa" />
    <circle cx="30" cy="64" r="4" fill="#fed7aa" />
  </g>

  <!-- Coffee Mug for extra real-world coziness -->
  <g transform="translate(45, 140)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M16 4 C20 4, 20 14, 16 16" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam wisps -->
    <path d="M5 -3 C7 -6, 5 -9, 7 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M11 -4 C9 -7, 12 -10, 10 -13" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>