<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background target rings to add depth -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#262B36" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="65" fill="none" stroke="#262B36" stroke-width="1"/>

  <!-- Archery Target (Băzi) -->
  <g id="target">
    <!-- Outer white/light ring -->
    <circle cx="120" cy="120" r="50" fill="#E2E8F0"/>
    
    <!-- Outer black ring -->
    <circle cx="120" cy="120" r="40" fill="#334155"/>
    
    <!-- Blue ring -->
    <circle cx="120" cy="120" r="30" fill="#3B82F6"/>
    
    <!-- Red ring -->
    <circle cx="120" cy="120" r="20" fill="#EF4444"/>
    
    <!-- Gold center (Bulls-eye / Hòng xīn) -->
    <circle cx="120" cy="120" r="10" fill="#F59E0B"/>
  </g>

  <!-- Arrow piercing the bullseye -->
  <g id="arrow">
    <!-- Arrow shaft coming from bottom-left towards the center -->
    <line x1="55" y1="185" x2="115" y2="125" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Arrow head embedded in the bullseye -->
    <polygon points="120,120 112,123 117,118" fill="#CBD5E1"/>
    
    <!-- Fletching (feathers) at the tail end -->
    <path d="M52,188 L45,178 L58,185 Z" fill="#EF4444"/>
    <path d="M52,188 L62,181 L55,194 Z" fill="#EF4444"/>
  </g>

  <!-- Target stand (Tripod legs) -->
  <g id="stand">
    <line x1="120" y1="170" x2="90" y2="215" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="170" x2="150" y2="215" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="170" x2="120" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <!-- Top mount/holder -->
    <rect x="112" y="166" width="16" height="6" rx="2" fill="#64748B"/>
  </g>
</svg>