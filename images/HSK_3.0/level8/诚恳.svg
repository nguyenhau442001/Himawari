<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="giftBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient lighting -->
  <circle cx="120" cy="110" r="100" fill="url(#lampGlow)"/>

  <!-- Background Environment / Window -->
  <path d="M70 45 L170 45 L170 125 L70 125 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Window Panes & Night Sky Scene -->
  <path d="M75 50 L115 50 L115 82 L75 82 Z" fill="#090d16"/>
  <path d="M125 50 L165 50 L165 82 L125 82 Z" fill="#090d16"/>
  <path d="M75 88 L115 88 L115 120 L75 120 Z" fill="#090d16"/>
  <path d="M125 88 L165 88 L165 120 L125 120 Z" fill="#090d16"/>
  <!-- Stars outside -->
  <circle cx="90" cy="65" r="1" fill="#cbd5e1"/>
  <circle cx="150" cy="68" r="1.5" fill="#fef08a"/>
  <circle cx="100" cy="105" r="1" fill="#cbd5e1"/>

  <!-- Cozy Bookshelf Backdrop -->
  <rect x="35" y="60" width="25" height="70" fill="#334155" rx="2"/>
  <rect x="40" y="70" width="15" height="8" fill="#38bdf8" rx="1"/>
  <rect x="40" y="82" width="15" height="10" fill="#f43f5e" rx="1"/>

  <!-- Table Surface -->
  <path d="M20 170 L220 170 L200 210 L40 210 Z" fill="url(#woodTable)"/>
  <path d="M20 170 L220 170 L225 175 L15 175 Z" fill="#475569"/>

  <!-- Decorative Plant in Pot -->
  <path d="M190 145 C185 145 182 150 183 155 L188 172 C188 174 190 175 192 175 L202 175 C204 175 206 174 206 172 L211 155 C212 150 209 145 204 145 Z" fill="#cbd5e1"/>
  <!-- Leaves -->
  <path d="M197 145 C197 130 185 120 175 115 C188 125 195 135 197 145 Z" fill="#10b981"/>
  <path d="M197 145 C205 130 220 125 230 120 C215 130 205 138 197 145 Z" fill="#34d399"/>
  <path d="M197 145 C197 125 197 115 197 105 C197 115 197 125 197 145 Z" fill="#059669"/>

  <!-- Central Character: Person offering a gift sincerely (Head & Torso) -->
  <!-- Body/Shoulders -->
  <path d="M75 210 C75 185 95 175 120 175 C145 175 165 185 165 210 Z" fill="#38bdf8"/>
  <!-- Collar / Shirt Detail -->
  <path d="M105 175 L120 195 L135 175 Z" fill="#f8fafc"/>
  
  <!-- Neck -->
  <rect x="110" y="150" width="20" height="30" fill="#fbcfe8" rx="6"/>

  <!-- Head -->
  <circle cx="120" cy="130" r="24" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M98 125 C98 105 110 98 122 98 C138 98 144 110 144 125 C144 128 142 130 140 128 C130 115 110 115 100 128 C98 130 98 128 98 125 Z" fill="#334155"/>

  <!-- Warm, Sincere Facial Expression -->
  <!-- Eyes (Happy closed curves or gentle warm eyes) -->
  <path d="M108 126 Q113 121 118 126" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M122 126 Q127 121 132 126" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Blushing Cheeks -->
  <circle cx="106" cy="132" r="4" fill="#f43f5e" opacity="0.4"/>
  <circle cx="134" cy="132" r="4" fill="#f43f5e" opacity="0.4"/>
  <!-- Gentle Open Smile -->
  <path d="M115 137 Q120 142 125 137" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Hands Holding Out a Gift (Sincere gesture) -->
  <path d="M85 170 C85 160 95 155 105 165 L110 175 Z" fill="#fbcfe8"/>
  <path d="M155 170 C155 160 145 155 135 165 L130 175 Z" fill="#fbcfe8"/>

  <!-- Gift Box (Representing heartfelt gesture/offering) -->
  <g transform="translate(97, 142)">
    <!-- Box Body -->
    <rect x="0" y="15" width="46" height="38" rx="4" fill="url(#giftBox)" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Vertical Ribbon -->
    <rect x="18" y="15" width="10" height="38" fill="url(#ribbon)"/>
    <!-- Box Lid -->
    <rect x="-3" y="10" width="52" height="9" rx="2" fill="url(#giftBox)" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Lid Ribbon Stripe -->
    <rect x="18" y="10" width="10" height="9" fill="url(#ribbon)"/>
    <!-- Bow -->
    <path d="M23 10 C18 2 10 5 13 10 C15 12 20 11 23 10 Z" fill="#f43f5e" stroke="#be123c" stroke-width="1"/>
    <path d="M23 10 C28 2 36 5 33 10 C31 12 26 11 23 10 Z" fill="#f43f5e" stroke="#be123c" stroke-width="1"/>
    <circle cx="23" cy="10" r="3" fill="#e11d48"/>
  </g>

  <!-- Warm Golden Star Symbolizing Sincerity ("Chân thành") -->
  <g transform="translate(120, 68)">
    <animateTransform attributeName="transform" type="translate" values="120,68; 120,60; 120,68" dur="3s" repeatCount="indefinite"/>
    <path d="M0 -15 C1 -4 4 -1 15 0 C4 1 1 4 0 15 C-1 4 -4 1 -15 0 C-4 -1 -1 -4 0 -15 Z" fill="#fbbf24" filter="drop-shadow(0px 4px 6px rgba(245, 158, 11, 0.4))"/>
    <circle cx="0" cy="0" r="3.5" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Sparkles/Accent Glows representing pure, genuine emotion -->
  <g fill="#fef08a">
    <!-- Star 1 -->
    <path d="M65 95 Q65 105 55 105 Q65 105 65 115 Q65 105 75 105 Q65 105 65 95 Z" opacity="0.8"/>
    <!-- Star 2 -->
    <path d="M175 80 Q175 87 168 87 Q175 87 175 94 Q175 87 182 87 Q175 87 175 80 Z" opacity="0.9"/>
    <!-- Small glowing circles -->
    <circle cx="155" cy="115" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="85" cy="140" r="1.5" fill="#f43f5e" opacity="0.8"/>
  </g>
</svg>