<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props (A cluttered inventor/problem-solver workshop at night) -->
  <path d="M180 30 L210 50 L210 180 L180 180 Z" fill="#1e293b" opacity="0.5"/>
  <!-- Bookshelf / files -->
  <rect x="25" y="45" width="35" height="90" rx="2" fill="#334155" opacity="0.6"/>
  <line x1="25" y1="75" x2="60" y2="75" stroke="#1e293b" stroke-width="3"/>
  <line x1="25" y1="105" x2="60" y2="105" stroke="#1e293b" stroke-width="3"/>
  <rect x="30" y="52" width="8" height="20" rx="1" fill="#f59e0b"/>
  <rect x="40" y="55" width="6" height="17" rx="1" fill="#38bdf8"/>
  <rect x="32" y="82" width="12" height="20" rx="1" fill="#10b981"/>

  <!-- Window with city night view -->
  <rect x="150" y="35" width="55" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <line x1="150" y1="70" x2="205" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="177" y1="35" x2="177" y2="105" stroke="#334155" stroke-width="2"/>
  <!-- City lights -->
  <rect x="158" y="80" width="4" height="10" fill="#fbbf24" opacity="0.8"/>
  <rect x="166" y="75" width="5" height="15" fill="#38bdf8" opacity="0.6"/>
  <rect x="185" y="85" width="4" height="12" fill="#fb923c" opacity="0.7"/>
  <rect x="193" y="78" width="5" height="18" fill="#fbbf24" opacity="0.5"/>

  <!-- Hanging Idea Bulb & Gears (Representing "trăm phương ngàn kế" / brainstorming) -->
  <circle cx="120" cy="45" r="18" fill="url(#glowGrad)"/>
  <path d="M116 33 H124 V39 H116 Z" fill="#94a3b8"/>
  <path d="M112 39 C112 35 128 35 128 39 C128 44 123 46 123 49 H117 C117 46 112 44 112 39 Z" fill="#fbbf24"/>
  <path d="M117 51 H123 V53 H117 Z" fill="#64748b"/>

  <!-- Floating Strategy Elements (Sticky notes, blueprint, gear) -->
  <!-- Blueprint sheet -->
  <rect x="160" y="120" width="30" height="24" rx="2" fill="#38bdf8" opacity="0.2"/>
  <path d="M165 126 H185 M165 132 H178 M165 138 H182" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sticky notes with ideas -->
  <rect x="25" y="125" width="22" height="22" rx="2" fill="#fde047" transform="rotate(-12 36 136)"/>
  <path d="M29 133 H43 M29 139 H39" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" transform="rotate(-12 36 136)"/>

  <rect x="195" y="105" width="20" height="20" rx="2" fill="#f43f5e" transform="rotate(15 205 115)"/>
  <circle cx="205" cy="115" r="4" fill="#ffffff" opacity="0.8" transform="rotate(15 205 115)"/>

  <!-- Desk Surface -->
  <path d="M10 180 L230 180 L220 215 L20 215 Z" fill="url(#deskGrad)"/>
  <path d="M10 180 H230" stroke="#475569" stroke-width="3"/>

  <!-- Desk Props (Laptop, Coffee, Schematics, magnifying glass) -->
  <!-- Laptop base -->
  <path d="M70 185 L120 185 L128 172 L62 172 Z" fill="#64748b"/>
  <!-- Laptop screen showing complex graph/problem -->
  <path d="M68 172 L122 172 L122 135 L68 135 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Graph lines on screen -->
  <path d="M74 162 L85 150 L96 156 L112 142" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <circle cx="112" cy="142" r="3" fill="#f43f5e"/>

  <!-- Coffee mug -->
  <rect x="138" y="162" width="16" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M154 167 C158 167 158 175 154 175" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  
  <!-- Magnifying glass -->
  <circle cx="185" cy="165" r="10" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M178 172 L168 182" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Character: Focused Problem Solver / Inventor -->
  <!-- Torso & Hoodie -->
  <path d="M95 195 C95 170 105 160 120 160 C135 160 145 170 145 195 Z" fill="#2563eb"/>
  <path d="M105 160 L120 178 L135 160" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <!-- Hood behind neck -->
  <path d="M100 162 C105 152 135 152 140 162 Z" fill="#1d4ed8"/>

  <!-- Head & Face -->
  <circle cx="120" cy="132" r="19" fill="#fbcfe8"/>
  <!-- Hair (Messy, intense thinking style) -->
  <path d="M101 132 C101 115 110 110 123 112 C135 114 139 122 140 132 C135 124 125 120 115 124 C108 126 104 130 101 132 Z" fill="#334155"/>

  <!-- Face features (Determined, concentrated expression) -->
  <!-- Eyebrows furrowed -->
  <path d="M110 127 L116 130" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M124 130 L130 127" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="113" cy="133" r="1.5" fill="#1e293b"/>
  <circle cx="127" cy="133" r="1.5" fill="#1e293b"/>
  <!-- Glasses -->
  <rect x="108" y="128" width="10" height="9" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="122" y="128" width="10" height="9" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="118" y1="132" x2="122" y2="132" stroke="#64748b" stroke-width="1.5"/>
  <!-- Determined Mouth -->
  <path d="M116 142 C118 143 122 143 124 142" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms actively working / scratching head or typing -->
  <!-- Left arm holding chin / deep thought -->
  <path d="M100 170 C90 170 88 150 102 142" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <!-- Left hand near chin -->
  <circle cx="103" cy="139" r="4" fill="#fbcfe8"/>

  <!-- Right arm reaching out to adjust something / plan -->
  <path d="M140 175 C150 175 160 160 150 150" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <!-- Right hand -->
  <circle cx="151" cy="146" r="4" fill="#fbcfe8"/>

  <!-- Sweat drop of hard work/pressure -->
  <path d="M136 122 C136 122 140 127 140 130 C140 132 138 134 136 134 C134 134 132 132 132 130 C132 127 136 122 136 122 Z" fill="#38bdf8" opacity="0.8"/>
</svg>