<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window View Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Desk Lamp Cone of Light -->
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Boundary Shield Gradient (Representing "Out of Scope") -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Shadow -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall -->
  <rect x="16" y="16" width="208" height="150" fill="#1e293b" rx="4" />

  <!-- Bookshelf Background Details -->
  <rect x="24" y="28" width="45" height="6" fill="#334155" rx="1" />
  <rect x="28" y="16" width="8" height="12" fill="#64748b" rx="1" />
  <rect x="38" y="18" width="6" height="10" fill="#38bdf8" rx="1" />
  <rect x="46" y="15" width="10" height="13" fill="#f43f5e" rx="1" />
  
  <rect x="24" y="55" width="45" height="6" fill="#334155" rx="1" />
  <rect x="28" y="42" width="7" height="13" fill="#10b981" rx="1" />
  <rect x="37" y="45" width="9" height="10" fill="#fbbf24" rx="1" />

  <!-- Window with Night Sky & Stars -->
  <g transform="translate(140, 24)">
    <rect x="0" y="0" width="64" height="75" rx="6" fill="url(#nightSky)" stroke="#475569" stroke-width="2" />
    <!-- Window Panes -->
    <line x1="32" y1="0" x2="32" y2="75" stroke="#475569" stroke-width="1.5" />
    <line x1="0" y1="37" x2="64" y2="37" stroke="#475569" stroke-width="1.5" />
    <!-- Stars outside -->
    <circle cx="12" cy="15" r="1" fill="#ffffff" />
    <circle cx="50" cy="22" r="1.5" fill="#fef08a" />
    <circle cx="22" cy="55" r="1" fill="#ffffff" />
    <circle cx="48" cy="60" r="1" fill="#93c5fd" />
    <!-- Moon -->
    <circle cx="52" cy="12" r="6" fill="#fde047" opacity="0.8" />
  </g>

  <!-- Office Desk Surface -->
  <path d="M 12 166 L 228 166 L 220 200 L 20 200 Z" fill="#334155" />
  <rect x="12" y="166" width="216" height="6" fill="#475569" rx="2" />

  <!-- PROPS ON DESK -->
  <!-- Laptop -->
  <path d="M 30 166 L 45 135 L 75 135 L 85 166 Z" fill="#64748b" />
  <path d="M 32 165 L 46 137 L 74 137 L 83 165 Z" fill="#94a3b8" />
  <ellipse cx="58" cy="166" rx="30" ry="2" fill="#0f172a" />

  <!-- Research Files / Documents (The "Research Scope" items) -->
  <g transform="translate(95, 145)">
    <!-- Base Folder -->
    <rect x="0" y="0" width="35" height="22" rx="2" fill="#cbd5e1" transform="rotate(-5)" />
    <!-- Top Folder -->
    <rect x="5" y="-3" width="32" height="20" rx="2" fill="#f8fafc" transform="rotate(-2)" />
    <line x1="10" y1="2" x2="25" y2="2" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-2)" />
    <line x1="10" y1="7" x2="30" y2="7" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-2)" />
  </g>

  <!-- Glowing Desk Lamp -->
  <path d="M 195 166 L 200 166 L 198 120 L 192 120 Z" fill="#64748b" />
  <path d="M 185 120 C 185 110, 205 110, 205 120 Z" fill="#f59e0b" />
  <polygon points="170,210 220,210 205,120 185,120" fill="url(#lightCone)" pointer-events="none" />

  <!-- THE CONCEPTUAL BOUNDARY / SCOPE BUBBLE ("范畴" / Out of Scope Visualization) -->
  <!-- Dotted boundary ring indicating research scope limits -->
  <ellipse cx="140" cy="115" rx="55" ry="42" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />
  
  <!-- "Outside the scope" floating research icon (Astronomy/Planet/Alien element that doesn't fit biology/lab research) -->
  <g transform="translate(165, 85)">
    <circle cx="0" cy="0" r="10" fill="#f43f5e" />
    <ellipse cx="0" cy="0" rx="16" ry="5" fill="none" stroke="#fb7185" stroke-width="2" transform="rotate(-25)" />
    <!-- Floating 'X' or dismissal indicator overlaying the out-of-scope item -->
    <path d="M 10 -12 L 18 -4 M 18 -12 L 10 -4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- CHARACTER: RESEARCHER / SCIENTIST -->
  <g id="researcher">
    <!-- Body Shadow -->
    <ellipse cx="102" cy="172" rx="35" ry="8" fill="url(#dropShadow)" />

    <!-- Chair Back -->
    <path d="M 75 160 L 78 100 C 78 95, 83 95, 83 100 L 86 160 Z" fill="#475569" />

    <!-- Torso (Wearing lab coat over blue shirt) -->
    <path d="M 80 135 C 80 120, 95 115, 105 115 C 115 115, 130 120, 130 135 L 125 170 L 85 170 Z" fill="#e2e8f0" />
    <!-- Lab coat opening -->
    <path d="M 105 115 L 100 170 M 105 115 L 110 170" stroke="#cbd5e1" stroke-width="2" />
    <!-- Blue Shirt Inside -->
    <path d="M 98 118 L 112 118 L 108 135 L 102 135 Z" fill="#3b82f6" />

    <!-- Neck -->
    <rect x="100" y="105" width="10" height="14" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="105" cy="90" r="18" fill="#fcd34d" />

    <!-- Hair (Styled neat dark hair) -->
    <path d="M 87 90 C 87 75, 100 70, 115 75 C 122 78, 125 85, 124 92 C 121 82, 110 77, 98 79 C 90 80, 87 86, 87 90 Z" fill="#1e293b" />

    <!-- Facial Expression: Thoughtful / Rejecting gesture -->
    <!-- Eyebrows (slanted in contemplation/hesitation) -->
    <line x1="95" y1="84" x2="102" y2="86" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="110" y1="86" x2="117" y2="84" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (focused forward-down) -->
    <circle cx="98" cy="90" r="2" fill="#1e293b" />
    <circle cx="112" cy="90" r="2" fill="#1e293b" />
    <!-- Glasses -->
    <rect x="94" y="85" width="9" height="7" rx="1.5" fill="none" stroke="#475569" stroke-width="1.5" />
    <rect x="107" y="85" width="9" height="7" rx="1.5" fill="none" stroke="#475569" stroke-width="1.5" />
    <line x1="103" y1="88" x2="107" y2="88" stroke="#475569" stroke-width="1.5" />
    <!-- Gentle, polite refusing smile -->
    <path d="M 101 100 Q 105 103 109 100" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Hands in "Deflecting/Out of Scope" Gesture -->
    <!-- Left Arm (bent, holding palm up/outward firmly in refusal) -->
    <path d="M 85 125 C 75 130, 68 120, 72 110 C 75 103, 85 105, 90 115" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand pushing outward -->
    <circle cx="68" cy="106" r="6" fill="#fcd34d" />

    <!-- Right Arm (resting near research papers) -->
    <path d="M 125 125 C 135 130, 140 145, 130 155" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="127" cy="158" r="5.5" fill="#fcd34d" />
  </g>

  <!-- FOREGROUND ACCENTS (Depth of Field) -->
  <!-- Coffee Mug on desk -->
  <rect x="25" y="152" width="14" height="16" rx="3" fill="#f8fafc" />
  <path d="M 39 156 C 44 156, 44 164, 39 164" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <!-- Steam from mug -->
  <path d="M 29 146 C 29 142, 33 140, 31 136" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

</svg>