<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="200" width="240" height="4" fill="#475569"/>
  
  <!-- Traffic/Noise Visuals -->
  <path d="M180 140 L190 130 M195 145 L205 135 M185 155 L195 145" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M210 120 Q220 110 230 120" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <circle cx="215" cy="140" r="4" fill="#ec4899"/>
  <circle cx="225" cy="150" r="3" fill="#38bdf8"/>
  
  <!-- Character: Person covering ears -->
  <g transform="translate(100, 120)">
    <!-- Body -->
    <path d="M-20 80 L20 80 L15 40 L-15 40 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="20" fill="#fde68a"/>
    <!-- Hands covering ears -->
    <circle cx="-22" cy="20" r="8" fill="#fde68a"/>
    <circle cx="22" cy="20" r="8" fill="#fde68a"/>
    <!-- Eyes (stressed) -->
    <line x1="-8" y1="15" x2="-2" y2="18" stroke="#1e293b" stroke-width="2"/>
    <line x1="2" y1="18" x2="8" y2="15" stroke="#1e293b" stroke-width="2"/>
    <path d="M-5 28 Q0 32 5 28" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>

  <!-- Background Urban Elements -->
  <rect x="20" y="100" width="40" height="80" fill="#475569"/>
  <rect x="30" y="110" width="20" height="20" fill="#1e293b"/>
  <rect x="30" y="140" width="20" height="20" fill="#1e293b"/>
  
  <rect x="150" y="120" width="30" height="60" fill="#475569"/>
  <rect x="155" y="130" width="20" height="15" fill="#f59e0b"/>
  
  <!-- Car silhouette -->
  <path d="M180 190 L230 190 L225 170 L190 170 Z" fill="#fbbf24"/>
  <circle cx="195" cy="195" r="8" fill="#1e293b"/>
  <circle cx="215" cy="195" r="8" fill="#1e293b"/>
  
  <!-- Street Lamp -->
  <line x1="20" y1="180" x2="20" y2="60" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="20" cy="55" r="10" fill="#f59e0b"/>
</svg>