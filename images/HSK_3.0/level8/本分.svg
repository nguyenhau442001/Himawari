<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambiance representing the workplace / steady foundation -->
  <circle cx="120" cy="130" r="70" fill="#222834" opacity="0.6"/>

  <!-- WORKER CHARACTER & FULFILLING DUTY (本分 - Bổn phận, an phận trong công việc bình dị) -->
  <!-- Base / Platform representing steady post/position (平凡岗位) -->
  <path d="M 70 190 L 170 190 L 180 200 L 60 200 Z" fill="#2E3846"/>
  <rect x="80" y="185" width="80" height="5" fill="#3A4656" rx="2"/>

  <!-- Worker Body / Torso -->
  <path d="M 95 140 C 95 125, 145 125, 145 140 L 155 185 L 85 185 Z" fill="#2563EB"/>

  <!-- Worker Uniform Collar / Details -->
  <path d="M 105 130 L 120 145 L 135 130" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Safety Helmet / Hard Hat (Worker symbol) -->
  <path d="M 95 95 C 95 75, 145 75, 145 95 Z" fill="#F59E0B"/>
  <rect x="90" y="93" width="60" height="5" rx="2.5" fill="#D97706"/>

  <!-- Head / Face (calm, focused, content - 老实守规矩) -->
  <circle cx="120" cy="108" r="16" fill="#FDE68A"/>
  <!-- Gentle smile / peaceful eyes -->
  <path d="M 113 108 L 117 108" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M 123 108 L 127 108" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M 116 116 Q 120 120 124 116" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms holding a gear/tool steadily and responsibly (尽好本分) -->
  <!-- Left arm -->
  <path d="M 95 140 L 75 160 L 90 170" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M 145 140 L 165 160 L 150 170" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Precision Gear / Work Tool held securely and proudly in hands -->
  <circle cx="120" cy="165" r="18" fill="none" stroke="#10B981" stroke-width="6"/>
  <circle cx="120" cy="165" r="6" fill="#1A1D24"/>
  <path d="M 120 142 L 120 147" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 183 L 120 188" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 97 165 L 102 165" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 138 165 L 143 165" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

  <!-- Checkmark badge of integrity/dutifulness floating subtly above -->
  <circle cx="175" cy="75" r="14" fill="#065F46"/>
  <path d="M 168 75 L 173 80 L 183 68" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>