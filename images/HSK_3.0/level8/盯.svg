<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradient (Dark-mode modern tech vibe) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Hood/Hair Gradient -->
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Cone -->
    <linearGradient id="lamp-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Room Details -->
  <!-- Bookshelf / Wall Accent -->
  <rect x="25" y="30" width="50" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="55" x2="75" y2="55" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="80" x2="75" y2="80" stroke="#334155" stroke-width="1.5" />
  <!-- Books on shelf -->
  <rect x="30" y="38" width="8" height="17" rx="1" fill="#ec4899" opacity="0.8" />
  <rect x="40" y="35" width="10" height="20" rx="1" fill="#38bdf8" opacity="0.8" />
  <rect x="52" y="40" width="6" height="15" rx="1" fill="#10b981" opacity="0.8" />
  <rect x="30" y="62" width="14" height="18" rx="1" fill="#f59e0b" opacity="0.8" />

  <!-- Wall Plant (Monstera style) -->
  <path d="M195 70 Q 205 60 215 75 Q 220 90 205 95 Z" fill="#10b981" opacity="0.85" />
  <path d="M185 80 Q 195 75 200 90 Q 195 105 180 95 Z" fill="#059669" opacity="0.9" />
  <path d="M200 95 L200 115" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <rect x="190" y="115" width="20" height="18" rx="3" fill="#cbd5e1" />

  <!-- Ambient Light Cone from Desk Lamp -->
  <polygon points="175,20 210,20 230,160 155,160" fill="url(#lamp-light)" />

  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#desk-grad)" />
  <rect x="0" y="166" width="240" height="5" fill="#475569" rx="1" />

  <!-- Computer Setup -->
  <!-- Laptop Base -->
  <path d="M 65 170 L 175 170 L 185 182 L 55 182 Z" fill="#64748b" filter="url(#shadow)" />
  <rect x="105" y="174" width="30" height="4" rx="2" fill="#475569" />

  <!-- Laptop Screen Frame -->
  <rect x="70" y="90" width="100" height="82" rx="6" fill="#334155" filter="url(#shadow)" />
  <!-- Laptop Inner Screen -->
  <rect x="74" y="94" width="92" height="74" rx="4" fill="url(#screen-glow)" />

  <!-- Abstract Code / UI on Screen (Strictly NO text) -->
  <rect x="82" y="104" width="35" height="4" rx="2" fill="#e2e8f0" opacity="0.9" />
  <rect x="82" y="113" width="55" height="3" rx="1.5" fill="#93c5fd" opacity="0.8" />
  <rect x="82" y="120" width="45" height="3" rx="1.5" fill="#93c5fd" opacity="0.8" />
  <rect x="82" y="132" width="65" height="16" rx="3" fill="#0284c7" opacity="0.5" />
  <!-- Data lines inside screen box -->
  <circle cx="150" cy="140" r="5" fill="#34d399" />
  <path d="M142 140 L 147 145 L 157 135" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Character (Focused intently, leaning forward, chin in hands/arms resting) -->
  <!-- Character Body / Hoodie -->
  <path d="M 85 240 C 85 205, 95 190, 120 185 C 145 190, 155 205, 155 240 Z" fill="#38bdf8" filter="url(#shadow)" />
  <!-- Hoodie Strings -->
  <path d="M 112 195 Q 115 210 110 220" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 128 195 Q 125 210 130 220" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Character Neck -->
  <rect x="113" y="172" width="14" height="20" fill="#fbcfe8" rx="4" />

  <!-- Character Head (Leaning forward with intense gaze) -->
  <g transform="translate(120, 155)">
    <!-- Hair Base -->
    <path d="M -22 -15 C -25 -35, 15 -40, 24 -20 C 30 -5, 26 15, 20 15 C 10 15, 5 5, -5 10 C -15 15, -20 0, -22 -15 Z" fill="url(#hair-grad)" />

    <!-- Face Shape -->
    <rect x="-18" y="-12" width="36" height="34" rx="15" fill="#fed7aa" />

    <!-- Ears -->
    <circle cx="-18" cy="4" r="4" fill="#fdb366" />
    <circle cx="18" cy="4" r="4" fill="#fdb366" />

    <!-- Hair Bangs framing face -->
    <path d="M -18 -12 Q 0 -22 18 -12 Q 5 -5 -18 -12 Z" fill="#334155" />

    <!-- INTENSE FOCUSED EYES (Crucial for "盯" - staring fixedly) -->
    <!-- Left Eye Area with determined eyebrows -->
    <circle cx="-7" cy="2" r="6" fill="#ffffff" />
    <circle cx="-6" cy="3" r="3" fill="#0f172a" />
    <circle cx="-5" cy="2" r="1" fill="#ffffff" /> <!-- Highlight -->
    <!-- Piercing Fixed Eyebrow -->
    <path d="M -13 -5 L -2 -1" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Eye Area -->
    <circle cx="7" cy="2" r="6" fill="#ffffff" />
    <circle cx="6" cy="3" r="3" fill="#0f172a" />
    <circle cx="7" cy="2" r="1" fill="#ffffff" /> <!-- Highlight -->
    <!-- Piercing Fixed Eyebrow -->
    <path d="M 2 -1 L 13 -5" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Focused Expression (Determined mouth) -->
    <path d="M -4 14 Q 0 17 5 14" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Blush of deep concentration -->
    <circle cx="-11" cy="9" r="3.5" fill="#f43f5e" opacity="0.3" />
    <circle cx="11" cy="9" r="3.5" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Arms / Hands propped or reaching toward desk -->
  <path d="M 90 220 Q 95 190 110 185" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 150 220 Q 145 190 130 185" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none" />
  <!-- Hands -->
  <circle cx="108" cy="182" r="7" fill="#fed7aa" />
  <circle cx="132" cy="182" r="7" fill="#fed7aa" />

  <!-- Foreground Desk Props -->
  <!-- Coffee Mug with Steam -->
  <rect x="185" y="145" width="18" height="22" rx="3" fill="#fb923c" filter="url(#shadow)" />
  <path d="M 203 150 C 210 150, 210 162, 203 162" stroke="#fb923c" stroke-width="3" fill="none" />
  <!-- Steam wisps -->
  <path d="M 191 138 Q 194 133 191 128" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 197 140 Q 194 135 197 130" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Small Notebook / Sticky Note on Desk -->
  <rect x="40" y="180" width="25" height="20" rx="2" fill="#fef08a" transform="rotate(-10 52 190)" filter="url(#shadow)" />
  <line x1="45" y1="187" x2="58" y2="185" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />
  <line x1="45" y1="193" x2="55" y2="191" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />

  <!-- Focused Staring Visual Line Indicators (Subtle stylistic glowing gaze lines towards screen) -->
  <g opacity="0.25">
    <line x1="105" y1="150" x2="85" y2="135" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="105" y1="160" x2="85" y2="145" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Desk Lamp Fixture (Top Right Corner) -->
  <path d="M 220 0 L 220 40" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <path d="M 200 40 L 220 40" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <path d="M 195 40 L 225 40 L 230 55 L 190 55 Z" fill="#475569" filter="url(#shadow)" />
  <ellipse cx="210" cy="55" rx="20" ry="6" fill="#fef08a" />
</svg>