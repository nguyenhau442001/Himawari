<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glow/Background Effects for Extraction Theme -->
  <circle cx="120" cy="115" r="70" fill="#262B36" opacity="0.6"/>
  <circle cx="120" cy="90" r="35" fill="#FFB703" opacity="0.08"/>

  <!-- Plant Leaves at Bottom (Source) -->
  <g transform="translate(120, 165)">
    <!-- Leaf Left -->
    <path d="M0,15 C-25,15 -40,-5 -30,-25 C-20,-10 -5,0 0,15 Z" fill="#2A9D8F" opacity="0.9"/>
    <!-- Leaf Right -->
    <path d="M0,15 C25,15 40,-5 30,-25 C20,-10 5,0 0,15 Z" fill="#2A9D8F" opacity="0.7"/>
    <!-- Leaf Center -->
    <path d="M0,20 C-10,20 -20,0 -15,-20 C-5,-5 0,0 0,20 Z" fill="#2A9D8F"/>
  </g>

  <!-- Droplets Rising (The Extraction Process) -->
  <g>
    <!-- Lower droplet -->
    <path d="M120,125 C122,121 125,115 125,111 C125,108 122,105 120,105 C118,105 115,108 115,111 C115,115 118,121 120,125 Z" fill="#FFB703" opacity="0.5"/>
    
    <!-- Middle droplet -->
    <path d="M120,95 C121.5,92 123.5,88 123.5,85 C123.5,82.8 121.8,81 120,81 C118.2,81 116.5,82.8 116.5,85 C116.5,88 118.5,92 120,95 Z" fill="#FFB703" opacity="0.8"/>
    
    <!-- Upper droplet (forming/concentrated) -->
    <path d="M120,68 C121,65 122.5,61 122.5,59 C122.5,57.3 121.2,56 120,56 C118.8,56 117.5,57.3 117.5,59 C117.5,61 119,65 120,68 Z" fill="#FFB703"/>
  </g>

  <!-- Distillation Flask / Extraction Vessel (The Physical Object representing Tìliàn) -->
  <g>
    <!-- Flask Neck and Rim -->
    <rect x="113" y="42" width="14" height="6" rx="2" fill="#E0FBFC" opacity="0.9"/>
    <path d="M115,48 L125,48 L131,75 C132,77 130.5,80 128,80 L112,80 C109.5,80 108,77 109,75 L115,48 Z" fill="#8ECAE6" opacity="0.2"/>

    <!-- Flask Bulb (Body) -->
    <circle cx="120" cy="115" r="42" fill="none" stroke="#E0FBFC" stroke-width="4" opacity="0.9"/>
    
    <!-- Liquid inside Flask (Extracted Pure Oil/Essence) -->
    <path d="M 85.5 115 
             A 34.5 34.5 0 0 0 154.5 115 
             Q 154.5 138 120 149 
             Q 85.5 138 85.5 115 Z" fill="#FFB703" opacity="0.85"/>

    <!-- Highlight on Flask -->
    <path d="M 93 100 C 95 87 105 82 112 80" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <circle cx="102" cy="105" r="4" fill="#FFFFFF" opacity="0.6"/>

    <!-- Extracted Pure Droplet suspended at the top inside -->
    <circle cx="120" cy="62" r="3" fill="#FFE169"/>
  </g>

  <!-- Sparkles / Purity indicators -->
  <g transform="translate(120, 115)">
    <!-- Sparkle 1 -->
    <path d="M-45,-25 L-43,-20 L-38,-18 L-43,-16 L-45,-11 L-47,-16 L-52,-18 L-47,-20 Z" fill="#FFB703" opacity="0.9"/>
    <!-- Sparkle 2 -->
    <path d="M50,-10 L51.5,-6 L55.5,-4.5 L51.5,-3 L50,1 L48.5,-3 L44.5,-4.5 L48.5,-6 Z" fill="#FFB703" opacity="0.7"/>
  </g>
</svg>