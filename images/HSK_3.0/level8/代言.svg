<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow/spotlight for spokesperson context -->
  <circle cx="120" cy="110" r="75" fill="#252A34" opacity="0.6"/>
  
  <!-- Camera / Media elements representing endorsement/spokesperson role -->
  <!-- Camera tripod & flash lines in background -->
  <path d="M120 70 L95 160" stroke="#323846" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 70 L145 160" stroke="#323846" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 70 L120 170" stroke="#323846" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Camera flash burst / spotlight effect -->
  <path d="M120 30 L115 50 M120 30 L125 50 M100 35 L112 52 M140 35 L128 52" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="120" cy="35" r="4" fill="#F59E0B"/>

  <!-- Brand Product: Modern Sneaker (floating dynamically to show active endorsement) -->
  <g transform="translate(135, 115) rotate(-15)">
    <!-- Motion lines representing action/launch -->
    <path d="M -25 15 L -45 20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M -20 25 L -35 32" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Sneaker body -->
    <path d="M-20 10 C-15 10 5 8 15 5 C22 3 25 10 20 18 C15 25 -5 27 -18 27 C-25 27 -28 20 -20 10 Z" fill="#E2E8F0"/>
    <!-- Sole -->
    <path d="M-22 20 C-5 20 10 22 22 18 C23 20 20 28 15 28 C-5 28 -18 28 -23 25 Z" fill="#F59E0B"/>
    <!-- Accents -->
    <path d="M-5 14 L5 12" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="5" cy="18" r="2.5" fill="#3B82F6"/>
  </g>

  <!-- Human Character (Spokesperson / Celebrity) gesturing proudly toward the product -->
  <g transform="translate(85, 105)">
    <!-- Torso -->
    <path d="M-25 65 C-25 45 -15 35 0 35 C15 35 25 45 25 65 L35 95 L-35 95 Z" fill="#3B82F6"/>
    <!-- Suit lapels / Formal endorsing attire -->
    <path d="M-5 35 L-15 60 L0 60 Z" fill="#1E293B"/>
    <path d="M5 35 L15 60 L0 60 Z" fill="#1E293B"/>
    <path d="M0 35 L0 55" stroke="#93C5FD" stroke-width="2"/>

    <!-- Head -->
    <circle cx="0" cy="15" r="16" fill="#FDE68A"/>
    <!-- Hair -->
    <path d="M-16 12 C-16 -2 -5 -5 0 -5 C8 -5 16 -2 16 12 C12 5 4 4 0 5 C-4 4 -12 5 -16 12 Z" fill="#1E293B"/>

    <!-- Back Arm (Holding pose) -->
    <path d="M-20 42 L-35 55 L-30 70" stroke="#FDE68A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front Arm (Dynamic pointing/presenting action towards the shoe) -->
    <path d="M18 42 L42 55 L52 48" stroke="#FDE68A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand accent -->
    <circle cx="54" cy="46" r="4.5" fill="#FDE68A"/>
  </g>

  <!-- Focus / Spotlight elements underneath -->
  <ellipse cx="120" cy="195" rx="70" ry="12" fill="#252A34"/>
  <ellipse cx="120" cy="195" rx="45" ry="6" fill="#323846"/>

  <!-- Accent star / quality badge representing brand partnership -->
  <path d="M45 55 L48 63 L56 64 L50 70 L52 78 L45 74 L38 78 L40 70 L34 64 L42 63 Z" fill="#F59E0B" transform="translate(10, 10) scale(0.7)"/>
</svg>