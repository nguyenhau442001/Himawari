<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid lines to give an educational/writing canvas context -->
  <line x1="120" y1="30" x2="120" y2="210" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="30" y1="120" x2="210" y2="120" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Educational Writing Context: Calligraphy Grid Box -->
  <rect x="50" y="50" width="140" height="140" rx="12" fill="none" stroke="#3A4256" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- The core semantic concept: "Héng" (Horizontal brush stroke / Horizontal dimension) -->
  <!-- Main horizontal bold brush stroke representing the "横" (héng) -->
  <g>
    <!-- Shadow/glow for focus -->
    <path d="M 68 114 Q 120 110 172 114 Q 175 120 172 126 Q 120 130 68 126 Q 65 120 68 114 Z" fill="#E67E22" opacity="0.3" filter="blur(4px)"/>
    
    <!-- Primary energetic golden/orange stroke body -->
    <path d="M 70 115 C 90 112, 150 112, 170 115 C 174 117, 174 123, 170 125 C 150 128, 90 128, 70 125 C 66 123, 66 117, 70 115 Z" fill="#F39C12"/>
    
    <!-- Calligraphic brush start (heavy angled cap) -->
    <path d="M 66 112 L 82 112 L 76 128 L 66 128 Z" fill="#E67E22"/>
  </g>

  <!-- Horizontal Dimension / Axis Indicator (Reinforcing the physical/spatial horizontal meaning) -->
  <g>
    <!-- Left arrow head -->
    <path d="M 45 120 L 55 114 L 55 126 Z" fill="#3498DB"/>
    <!-- Left extension line -->
    <line x1="55" y1="120" x2="70" y2="120" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Right arrow head -->
    <path d="M 195 120 L 185 114 L 185 126 Z" fill="#3498DB"/>
    <!-- Right extension line -->
    <line x1="170" y1="120" x2="185" y2="120" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>