<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#16223f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="window-beam" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Golden Inspiration Glow -->
    <linearGradient id="golden-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment: Office / Room Interior -->
  <!-- Wallpaper Grid / Panel Lines -->
  <path d="M0 160 H240 M0 80 H240" stroke="#253556" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="160" y1="80" x2="160" y2="160" stroke="#253556" stroke-width="1.5"/>

  <!-- Window to the Outside World (Ambition/Future) -->
  <g transform="translate(150, 25)">
    <rect width="60" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <path d="M30 0 V70 M0 35 H60" stroke="#334155" stroke-width="2"/>
    <!-- Distant City Skyline Silhouette through Window -->
    <path d="M5 70 V50 L12 42 L15 70 L25 70 V30 L32 20 L38 30 L40 70 L52 70 V45 L57 52 L58 70 Z" fill="#1e293b" opacity="0.8"/>
    <!-- Rising Golden Sun / City Glow -->
    <circle cx="35" cy="55" r="12" fill="url(#golden-glow)"/>
  </g>

  <!-- Window Light Beam casting across the room -->
  <polygon points="150,25 210,25 240,190 100,190" fill="url(#window-beam)"/>

  <!-- Bookshelf / Boring Routine Props (Left side: "Ordinary/Mediocre" constraints) -->
  <g transform="translate(15, 75)">
    <!-- Bookshelf structure -->
    <rect width="45" height="85" rx="2" fill="#172033" stroke="#2a3c5c" stroke-width="2"/>
    <line x1="0" y1="42" x2="45" y2="42" stroke="#2a3c5c" stroke-width="2"/>
    <!-- Boring gray/blue files and stacked papers representing mundane routine -->
    <rect x="6" y="15" width="8" height="25" rx="1" fill="#475569"/>
    <rect x="16" y="18" width="6" height="22" rx="1" fill="#64748b"/>
    <rect x="24" y="12" width="12" height="28" rx="1" fill="#334155"/>
    <rect x="6" y="55" width="33" height="6" rx="1" fill="#64748b"/>
    <rect x="8" y="63" width="28" height="6" rx="1" fill="#475569"/>
    <rect x="10" y="71" width="24" height="6" rx="1" fill="#334155"/>
  </g>

  <!-- Desk Surface -->
  <rect x="40" y="160" width="170" height="10" rx="3" fill="#334155" filter="url(#soft-shadow)"/>
  <path d="M45 170 V210 H205 V170 Z" fill="#1e293b"/>
  <line x1="40" y1="170" x2="210" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- Desk Props (Creative Ambition: Laptop, Sketchbook, Glowing Lamp) -->
  <!-- Laptop Open -->
  <g transform="translate(130, 130)">
    <!-- Base -->
    <path d="M-15 30 L-25 40 H25 L15 30 Z" fill="#64748b"/>
    <!-- Screen -->
    <rect x="-18" y="2" width="36" height="28" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Screen Code/Design lines -->
    <line x1="-12" y1="8" x2="2" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="14" x2="10" y2="14" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="20" x2="-2" y2="20" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sketchbook / Blueprint with Creative Design lines -->
  <g transform="translate(65, 145) rotate(-5)">
    <rect width="32" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Artistic sketches -->
    <path d="M6 8 C 12 4, 16 12, 22 6" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
    <circle cx="24" cy="16" r="3" fill="#38bdf8"/>
    <line x1="6" y1="16" x2="16" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="12" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Desk Lamp (Ambient Focus) -->
  <g transform="translate(185, 120)">
    <path d="M0 50 C-10 40, -5 20, 10 10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <!-- Lamp Shade -->
    <path d="M -2 5 L 18 5 L 12 -5 L -8 -5 Z" fill="#f59e0b"/>
    <!-- Lamp Base -->
    <ellipse cx="0" cy="50" rx="8" ry="3" fill="#d97706"/>
    <!-- Cone Light Pool -->
    <polygon points="-20,50 -5,5 15,5 30,50" fill="url(#lamp-cone)" opacity="0.6"/>
  </g>

  <!-- MAIN CHARACTER: The Ambitious Protagonist -->
  <g id="protagonist" transform="translate(100, 95)" filter="url(#soft-shadow)">
    <!-- Chair Backrest -->
    <rect x="-22" y="10" width="18" height="65" rx="5" fill="#334155"/>

    <!-- Character Body / Leaning Forward in Determination -->
    <g transform="translate(0, 15)">
      <!-- Torso with stylish blue jacket -->
      <path d="M -15 35 Q -10 10 5 12 Q 22 15 25 38 L 18 70 H -12 Z" fill="url(#jacket-grad)"/>
      <!-- Inner Shirt Collar -->
      <path d="M 0 15 L -6 24 H 6 Z" fill="#f8fafc"/>

      <!-- Head & Facial Expression: Determined, Unyielding, Focused -->
      <g transform="translate(5, -10)">
        <!-- Hair -->
        <path d="M -16 -2 C -18 -15, 0 -22, 12 -12 C 16 -8, 18 -2, 18 -2 C 14 -10, 2 -12, -8 -8 C -13 -6, -15 -3, -16 -2 Z" fill="#0f172a"/>

        <!-- Head Base -->
        <ellipse cx="0" cy="0" rx="12" ry="14" fill="#ffedd5"/>

        <!-- Eyebrows (Slanted upward/inward showing strong resolve, refusing mediocrity) -->
        <path d="M -7 -4 L -1 -6" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <path d="M 3 -6 L 8 -3" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

        <!-- Determined Eyes -->
        <circle cx="-4" cy="-2" r="1.5" fill="#1e293b"/>
        <circle cx="5" cy="-2" r="1.5" fill="#1e293b"/>

        <!-- Determined Mouth (Firm set jaw / subtle grit) -->
        <path d="M -3 6 Q 1 9 6 5" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>

        <!-- Ear -->
        <path d="M -12 0 C -15 0, -15 5, -12 5" fill="#ffedd5"/>
      </g>

      <!-- Arms / Hands clenched in determination / reaching forward -->
      <!-- Left Arm (bent, hand resting on desk near sketchbook) -->
      <path d="M -12 25 C -25 30, -32 40, -35 50" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-36" cy="51" r="4" fill="#ffedd5"/>

      <!-- Right Arm (reaching firmly forward towards the glowing future/window) -->
      <path d="M 18 28 C 30 35, 40 45, 45 35" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
      <circle cx="47" cy="32" r="4" fill="#ffedd5"/>
    </g>
  </g>

  <!-- Sparkles of Aspiration / Breaking out of the ordinary box -->
  <g transform="translate(140, 60)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(180, 45) scale(0.6)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(110, 40) scale(0.8)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#f43f5e"/>
  </g>

  <!-- Coffee Mug (Comfort breaker) -->
  <g transform="translate(50, 140)">
    <rect x="0" y="5" width="10" height="14" rx="2" fill="#e2e8f0"/>
    <path d="M 10 8 C 14 8, 14 14, 10 16" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Steam rising from coffee -->
    <path d="M 3 2 C 3 -2, 7 -2, 5 -6 C 3 -10, 7 -10, 6 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>