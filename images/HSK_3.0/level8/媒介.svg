    <path d="M40 60 L40 80" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 70 L20 90" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 70 L60 90" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Accents -->
  <path d="M120 140 L120 160" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
