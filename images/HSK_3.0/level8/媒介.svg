    <path d="M40 60 L40 80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 70 L20 90" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 70 L60 90" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Speech Bubble / Bridge Concept -->
  <path d="M85 90 Q120 40 155 90" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>
