  <circle cx="100" cy="75" r="4" fill="#fb923c"/>
  <circle cx="140" cy="75" r="4" fill="#fb923c"/>
  
  <!-- Character 2 (Listener) -->
  <g transform="translate(140, 80)">
    <path d="M20 120 L60 120 L55 60 L25 60 Z" fill="#ec4899"/>
    <circle cx="40" cy="40" r="20" fill="#fde68a"/>
    <circle cx="33" cy="35" r="2" fill="#78350f"/>
    <circle cx="47" cy="35" r="2" fill="#78350f"/>
