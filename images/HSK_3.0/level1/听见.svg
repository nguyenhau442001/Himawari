<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (window frame & nature outside) -->
  <path d="M40 50 H200 V190 H40 Z" fill="#222730" stroke="#2F3642" stroke-width="2" rx="4"/>
  <!-- Window grid lines -->
  <line x1="120" y1="50" x2="120" y2="190" stroke="#2F3642" stroke-width="2"/>
  <line x1="40" y1="120" x2="200" y2="120" stroke="#2F3642" stroke-width="2"/>

  <!-- Outside landscape (Window view) -->
  <circle cx="75" cy="85" r="12" fill="#F5A623" opacity="0.8"/> <!-- Sun/Morning light -->
  <path d="M50 120 Q65 95 80 120 Z" fill="#2E4033"/>
  <path d="M70 120 Q90 80 110 120 Z" fill="#354E3D"/>

  <!-- Bird outside (Source of sound) -->
  <path d="M165 75 C160 70 150 72 145 78 C148 78 152 80 155 83 C152 85 148 84 145 85 C150 92 162 90 167 82 Z" fill="#E67E22"/>
  <circle cx="166" cy="77" r="1.5" fill="#1A1D24"/>

  <!-- Sound waves traveling inward through the window -->
  <path d="M135 85 C125 90 125 105 115 110" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/>
  <path d="M145 95 C135 100 135 115 125 120" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/>
  <path d="M155 105 C145 110 145 125 135 130" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/>

  <!-- Indoor human character (Action: Hearing / Tīngjiàn) -->
  <!-- Body/Shoulders -->
  <path d="M60 210 C60 170 85 160 100 160 C115 160 140 170 140 210 Z" fill="#3A4A59"/>
  
  <!-- Neck -->
  <rect x="85" y="140" width="30" height="25" fill="#E0AC9D"/>

  <!-- Head -->
  <circle cx="100" cy="115" r="28" fill="#E0AC9D"/>

  <!-- Hair -->
  <path d="M73 110 C73 90 90 85 105 85 C125 85 127 100 127 115 C120 110 110 108 100 108 C90 108 80 110 73 110 Z" fill="#2C3E50"/>

  <!-- Focused Face Profile / Expression -->
  <!-- Ear highlighted to emphasize hearing -->
  <path d="M125 112 C131 112 131 122 125 124" stroke="#E0AC9D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="128" cy="118" r="4" fill="#F5A623" opacity="0.6"/> <!-- Sound reception focus indicator -->

  <!-- Hand cupped near ear to listen intently (Dynamic Action) -->
  <path d="M110 135 C120 130 132 135 135 145 C137 152 130 155 125 150 C122 147 118 145 112 142 Z" fill="#E0AC9D"/>
  <path d="M105 145 C115 145 125 148 128 153" stroke="#C68B79" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Action motion lines near ear -->
  <path d="M136 112 C141 115 141 121 136 124" stroke="#F5A623" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M140 108 C148 113 148 121 140 127" stroke="#F5A623" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>