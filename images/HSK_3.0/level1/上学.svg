<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (school environment hint) -->
  <circle cx="195" cy="55" r="28" fill="#2D333B" opacity="0.5"/>
  <path d="M195 35 L195 75 M175 55 L215 55" stroke="#3E4451" stroke-width="2" stroke-linecap="round" opacity="0.3"/> <!-- subtle clock/sun accent -->

  <!-- School building silhouette in background -->
  <path d="M40 140 L80 110 L120 140 Z" fill="#252A33"/>
  <rect x="48" y="140" width="64" height="40" fill="#252A33"/>
  <rect x="70" y="152" width="20" height="28" fill="#1A1D24"/>

  <!-- Motion lines indicating walking / going towards school -->
  <path d="M55 200 C65 200 70 195 80 195" stroke="#3E4451" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M40 207 C50 207 55 202 65 202" stroke="#3E4451" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Character (Student / Younger brother going to school) -->
  <!-- Backpack -->
  <path d="M82 135 L96 140 L92 165 L78 160 Z" fill="#F39C12"/>
  <path d="M86 137 L92 139" stroke="#D68910" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs & Walking Action -->
  <!-- Back leg (stepping back) -->
  <path d="M90 160 L78 185 L70 183" stroke="#4FA3D1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front leg (stepping forward) -->
  <path d="M96 160 L110 188 L120 185" stroke="#52B788" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="66" cy="184" rx="6" ry="3" fill="#E0E6ED"/>
  <ellipse cx="123" cy="185" rx="6" ry="3" fill="#E0E6ED"/>

  <!-- Torso -->
  <path d="M85 125 L107 125 L102 162 L82 162 Z" fill="#52B788"/>
  <path d="M91 125 L101 125 L101 142 L91 142 Z" fill="#E0E6ED"/> <!-- Collar / shirt detail -->

  <!-- Arms with dynamic action (holding book/backpack strap) -->
  <!-- Back arm -->
  <path d="M88 132 L75 148 L82 152" stroke="#52B788" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front arm swinging -->
  <path d="M102 132 L116 146" stroke="#52B788" stroke-width="6" stroke-linecap="round"/>
  <circle cx="118" cy="148" r="3" fill="#EFECE6"/>

  <!-- Head & Hair -->
  <circle cx="96" cy="106" r="14" fill="#EFECE6"/>
  <!-- Hair styling (neat student haircut) -->
  <path d="M82 104 C82 96 90 90 98 90 C106 90 110 96 110 102 C108 102 106 94 96 94 C86 94 84 102 82 104 Z" fill="#2D333B"/>

  <!-- Object of action: Floating dynamic book/knowledge icon emphasizing "Learning / School" -->
  <g transform="translate(145, 95)">
    <!-- Glow/Focus aura -->
    <circle cx="20" cy="20" r="26" fill="#F39C12" opacity="0.15"/>
    
    <!-- Open Book graphic -->
    <path d="M10 25 C15 23 20 25 25 25 C30 25 35 23 40 25 L40 10 C35 8 30 10 25 10 C20 10 15 8 10 10 Z" fill="#F39C12"/>
    <path d="M25 10 L25 25" stroke="#1A1D24" stroke-width="1.5"/>
    <!-- Page lines -->
    <path d="M14 14 L21 14 M14 18 L21 18" stroke="#1A1D24" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M29 14 L36 14 M29 18 L36 18" stroke="#1A1D24" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Small floating accent stars / spark for modern UI educational feel -->
  <path d="M145 65 L147 70 L152 72 L147 74 L145 79 L143 74 L138 72 L143 70 Z" fill="#F39C12" opacity="0.8"/>
  <path d="M60 75 L61 78 L64 79 L61 80 L60 83 L59 80 L56 79 L59 78 Z" fill="#52B788" opacity="0.6"/>
</svg>