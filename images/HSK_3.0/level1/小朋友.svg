<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle Garden / Park Ground Element -->
  <path d="M 20 200 Q 120 185 220 200 L 220 240 L 20 240 Z" fill="#252A34"/>
  <circle cx="50" cy="195" r="3" fill="#323846"/>
  <circle cx="190" cy="192" r="2" fill="#323846"/>

  <!-- Character 1 (Left Child - Playing/Bending Forward) -->
  <g transform="translate(62, 115)">
    <!-- Body/Shirt -->
    <path d="M-12 35 C-12 25 -5 20 0 20 C5 20 12 25 12 35 L16 65 L-16 65 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="0" cy="5" r="14" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M-14 5 C-14 -4 -6 -10 0 -10 C6 -10 14 -4 14 5 C10 0 5 -3 0 -3 C-5 -3 -10 0 -14 5 Z" fill="#1E293B"/>
    <!-- Arms playing/gesturing -->
    <path d="M-12 28 Q-25 35 -20 45" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <path d="M12 28 Q22 35 18 45" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-7" y1="65" x2="-9" y2="83" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <line x1="7" y1="65" x2="9" y2="83" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Center Child - Joyful/Jumping) -->
  <g transform="translate(120, 95)">
    <!-- Body/Shirt -->
    <path d="M-13 35 C-13 24 -6 18 0 18 C6 18 13 24 13 35 L17 65 L-17 65 Z" fill="#EF4444"/>
    <!-- Head -->
    <circle cx="0" cy="3" r="15" fill="#FDE047"/>
    <!-- Hair -->
    <path d="M-15 3 C-15 -6 -7 -12 0 -12 C7 -12 15 -6 15 3 C11 -2 6 -5 0 -5 C-6 -5 -11 -2 -15 3 Z" fill="#334155"/>
    <!-- Arms raised happily -->
    <path d="M-13 28 Q-26 15 -20 8" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
    <path d="M13 28 Q26 15 20 8" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-7" y1="65" x2="-10" y2="83" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <line x1="7" y1="65" x2="10" y2="83" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Character 3 (Right Child - Cheering/Waving) -->
  <g transform="translate(178, 115)">
    <!-- Body/Shirt -->
    <path d="M-12 35 C-12 25 -5 20 0 20 C5 20 12 25 12 35 L16 65 L-16 65 Z" fill="#10B981"/>
    <!-- Head -->
    <circle cx="0" cy="5" r="14" fill="#FBBF24"/>
    <!-- Hair -->
    <circle cx="0" cy="-3" r="10" fill="#27272A"/>
    <path d="M-13 3 C-13 -6 -5 -9 0 -9 C5 -9 13 -6 13 3 Z" fill="#27272A"/>
    <!-- Arms -->
    <path d="M-12 28 Q-22 35 -15 45" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <path d="M12 28 Q25 18 22 8" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-7" y1="65" x2="-9" y2="83" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <line x1="7" y1="65" x2="9" y2="83" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Joyful decorative elements (stars/sparkles representing playfulness and garden atmosphere) -->
  <g fill="#F59E0B">
    <path d="M 45 75 L 47 80 L 52 82 L 47 84 L 45 89 L 43 84 L 38 82 L 43 80 Z" opacity="0.8"/>
    <path d="M 195 65 L 197 69 L 201 71 L 197 73 L 195 77 L 193 73 L 189 71 L 193 69 Z" opacity="0.9"/>
    <path d="M 115 50 L 117 54 L 121 56 L 117 58 L 115 62 L 113 58 L 109 56 L 113 54 Z" opacity="0.7"/>
  </g>

  <!-- Small stylized flower (garden context) -->
  <g transform="translate(95, 185)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-3" r="4" fill="#F472B6"/>
    <circle cx="0" cy="-3" r="1.5" fill="#FDE047"/>
  </g>
</svg>