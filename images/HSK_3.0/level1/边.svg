<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Dock / Pier (The boundary/edge context) -->
  <path d="M 20 180 L 140 180 L 160 150 L 220 150 L 240 180 L 20 180 Z" fill="#2D323F"/>
  <rect x="20" y="170" width="220" height="10" fill="#3E4455" rx="2"/>
  
  <!-- Wooden planks texture lines on the pier -->
  <line x1="50" y1="180" x2="60" y2="150" stroke="#1A1D24" stroke-width="2" opacity="0.3"/>
  <line x1="90" y1="180" x2="105" y2="150" stroke="#1A1D24" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="180" x2="195" y2="150" stroke="#1A1D24" stroke-width="2" opacity="0.3"/>

  <!-- Water Surface & Waves (Below and beside the pier) -->
  <path d="M 0 180 Q 60 175, 120 180 T 240 180 L 240 240 L 0 240 Z" fill="#14638A" opacity="0.8"/>
  <path d="M 0 195 Q 40 190, 80 195 T 160 195 T 240 195 L 240 240 L 0 240 Z" fill="#0E4C6B"/>

  <!-- Wooden Bollard on the edge ("边") -->
  <path d="M 120 140 L 135 140 L 132 170 L 123 170 Z" fill="#A77B53"/>
  <ellipse cx="127.5" cy="140" rx="7.5" ry="3" fill="#C49A6C"/>
  <path d="M 122 145 C 122 143, 133 143, 133 145" stroke="#7A5636" stroke-width="2" fill="none"/>

  <!-- Fishing Boat docked right next to the edge (边) -->
  <g transform="translate(45, 145)">
    <!-- Hull -->
    <path d="M 10 35 L 75 35 C 80 35, 83 40, 80 43 L 65 52 C 60 55, 25 55, 20 52 L 5 43 C 2 40, 5 35, 10 35 Z" fill="#E05638"/>
    <!-- Cabin -->
    <path d="M 30 15 L 55 15 L 58 35 L 27 35 Z" fill="#F4F4F6"/>
    <!-- Roof -->
    <path d="M 27 15 L 58 15 L 55 10 L 30 10 Z" fill="#3E4455"/>
    <!-- Mast/Flag -->
    <line x1="42" y1="10" x2="42" y2="2" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="42,2 52,6 42,10" fill="#E05638"/>
    <!-- Window -->
    <rect x="36" y="20" width="12" height="8" rx="2" fill="#1A1D24"/>
    <!-- Mooring rope connecting boat to pier -->
    <path d="M 15 37 Q 35 25, 122 145" stroke="#F1C40F" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  </g>

  <!-- Focus Indicator (Subtle bracket highlighting the edge/boundary "边") -->
  <path d="M 105 130 L 100 130 L 100 185 L 105 185" stroke="#F1C40F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 150 130 L 155 130 L 155 185 L 150 185" stroke="#F1C40F" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>