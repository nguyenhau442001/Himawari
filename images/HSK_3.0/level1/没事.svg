<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Gentle, reassuring companion figure (friend/supporter) -->
    <!-- Torso and shoulders -->
    <path d="M70 170 C70 150 90 140 120 140 C150 140 170 150 170 170 L170 200 L70 200 Z" fill="#2D323E"/>
    <!-- Head -->
    <circle cx="120" cy="115" r="22" fill="#E0A96D"/>
    <!-- Calm, reassuring smile and closed happy eyes -->
    <path d="M112 112 Q116 116 120 112" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M128 112 Q132 116 136 112" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M116 123 Q120 128 124 123" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Reassuring gesture: Friendly hand resting gently on shoulder ("Everything is fine / Don't worry") -->
    <path d="M90 145 C80 148 75 155 85 160 C92 163 98 155 95 148 Z" fill="#E0A96D"/>

    <!-- Calm, peaceful centered physical representation of "all clear / nothing is wrong" -->
    <!-- Large clear checkmark / calm balanced aura represented by clean geometric harmony -->
    <circle cx="120" cy="100" r="75" fill="none" stroke="#2D323E" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>

    <!-- Focal glowing reassurance element (Warm golden accent badge symbolizing safety and peace) -->
    <circle cx="120" cy="75" r="32" fill="#FFB703" opacity="0.15"/>
    <circle cx="120" cy="75" r="24" fill="#1A1D24" stroke="#FFB703" stroke-width="3"/>
    
    <!-- Crisp checkmark representing "nothing to worry about" / "all good" -->
    <path d="M108 75 L116 83 L132 67" fill="none" stroke="#FFB703" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>