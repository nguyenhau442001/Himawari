<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle campus/study elements -->
  <g opacity="0.15" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="40" y1="180" x2="200" y2="180"/>
  </g>

  <!-- Person 1 (Left - Character in warm orange/amber) -->
  <g transform="translate(48, 60)">
    <!-- Body / Torso -->
    <path d="M12 90 C12 72 26 58 44 58 C62 58 76 72 76 90 L76 110 L12 110 Z" fill="#F59E0B"/>
    <!-- Head -->
    <circle cx="44" cy="34" r="18" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M28 32 C28 20 36 14 44 14 C52 14 60 20 60 32 C56 26 50 24 44 24 C38 24 32 26 28 32 Z" fill="#D97706"/>
    <!-- Friendly smiling facial expression / gesture (hand waving slightly forward) -->
    <circle cx="44" cy="38" r="1" fill="#78350F"/>
    <circle cx="44" cy="46" r="3" fill="#D97706"/>
    <!-- Outstretched arm greeting -->
    <path d="M68 75 C78 75 86 82 88 88" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Person 2 (Center - Character in teal/cyan) -->
  <g transform="translate(100, 50)">
    <!-- Body / Torso -->
    <path d="M10 100 C10 80 24 66 40 66 C56 66 70 80 70 100 L70 120 L10 120 Z" fill="#0EA5E9"/>
    <!-- Head -->
    <circle cx="40" cy="40" r="19" fill="#38BDF8"/>
    <!-- Hair -->
    <path d="M22 38 C22 24 30 18 40 18 C50 18 58 24 58 38 C54 30 48 28 40 28 C32 28 26 30 22 38 Z" fill="#0369A1"/>
    <!-- Direct engaging posture -->
    <path d="M15 85 L5 95" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round"/>
    <path d="M65 85 L75 95" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Person 3 (Right - Character in purple/indigo) -->
  <g transform="translate(124, 60)">
    <!-- Body / Torso -->
    <path d="M12 90 C12 72 26 58 44 58 C62 58 76 72 76 90 L76 110 L12 110 Z" fill="#8B5CF6"/>
    <!-- Head -->
    <circle cx="44" cy="34" r="18" fill="#A78BFA"/>
    <!-- Hair -->
    <path d="M26 32 C26 20 34 16 44 16 C54 16 62 20 62 32 C58 24 52 22 44 22 C36 22 30 24 26 32 Z" fill="#6D28D9"/>
    <!-- Outstretched arm greeting -->
    <path d="M20 75 C10 75 2 82 0 88" stroke="#8B5CF6" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Group / Plurality connection arc (subtle indicator uniting them as "You all / 你们") -->
  <path d="M48 55 C90 35 150 35 192 55" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>

  <!-- Base platform line to ground the group -->
  <rect x="36" y="172" width="168" height="4" rx="2" fill="#334155"/>
</svg>