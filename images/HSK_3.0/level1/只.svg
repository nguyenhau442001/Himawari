<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid representing precision and measurement -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="0" y1="180" x2="240" y2="180" />
  </g>

  <!-- Visual Metaphor: Isolation / Specific Unit Counter ("Only one" / "A single distinct item") -->
  <!-- A central bracket/magnifying concept showing selection of ONE distinct unit from multiple potential ones -->
  
  <g transform="translate(0, 10)">
    <!-- Faded background silhouettes representing the "many" potential items -->
    <g opacity="0.2">
      <!-- Item left -->
      <circle cx="70" cy="110" r="14" fill="#64748B"/>
      <!-- Item right -->
      <circle cx="170" cy="110" r="14" fill="#64748B"/>
    </g>

    <!-- Connecting isolation lines/bracket indicating selection of the single unit -->
    <path d="M 85 95 L 95 85 L 145 85 L 155 95" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Focus Spotlight / Framing Effect -->
    <circle cx="120" cy="110" r="48" fill="#FFB703" opacity="0.08"/>
    <circle cx="120" cy="110" r="38" fill="none" stroke="#FFB703" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

    <!-- The Single Distinct Subject (A stylized bird/creature representing the classic example "一只小鸟") -->
    <g transform="translate(120, 110)">
      <!-- Perch / Branch -->
      <path d="M -40 30 Q -10 25 35 32" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Bird Body -->
      <ellipse cx="0" cy="2" rx="14" ry="11" fill="#FFB703"/>
      
      <!-- Bird Head -->
      <circle cx="8" cy="-8" r="9" fill="#FFB703"/>
      
      <!-- Beak -->
      <polygon points="15,-8 22,-6 15,-4" fill="#FB8500"/>
      
      <!-- Wing -->
      <path d="M -6 -1 C 2 -1 6 6 2 10 C -2 10 -6 6 -6 -1 Z" fill="#FB8500"/>
      
      <!-- Tail Feathers -->
      <path d="M -13 2 L -22 -2 L -18 7 Z" fill="#FB8500"/>
      
      <!-- Eye -->
      <circle cx="10" cy="-10" r="1.5" fill="#1A1D24"/>
    </g>

    <!-- Precision framing corners (Targeting the single unit) -->
    <!-- Top-Left Corner -->
    <path d="M 85 65 L 70 65 L 70 80" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top-Right Corner -->
    <path d="M 155 65 L 170 65 L 170 80" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Left Corner -->
    <path d="M 85 155 L 70 155 L 70 140" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Right Corner -->
    <path d="M 155 155 L 170 155 L 170 140" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Indicator of "1" (Singular Unit Specification) -->
    <g transform="translate(120, 190)">
      <rect x="-16" y="-12" width="32" height="24" rx="6" fill="#334155" opacity="0.9"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFB703" text-anchor="middle">1</text>
    </g>
  </g>
</svg>