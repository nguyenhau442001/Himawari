<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptualizing "Where" (哪里) as a search for a destination/location -->
  <!-- Using the "Escalation/Progression" metaphor: A path leading to a specific destination -->
  
  <!-- Path/Progression -->
  <path d="M40 180 C 100 180, 120 120, 180 60" stroke="#4A5568" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="12 12"/>
  
  <!-- The "Target" or "Destination" (Escalation point) -->
  <circle cx="180" cy="60" r="20" fill="#F6AD55" opacity="0.2"/>
  <circle cx="180" cy="60" r="10" fill="#F6AD55"/>
  
  <!-- The "Searcher" or "Focus" (Magnifying glass metaphor for finding the location) -->
  <g transform="translate(60, 160)">
    <circle cx="0" cy="0" r="12" stroke="#E2E8F0" stroke-width="4" fill="none"/>
    <line x1="8" y1="8" x2="20" y2="20" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- The "Escalation" indicator: A sharp directional arrow pointing to the destination -->
  <path d="M165 75 L 180 60 L 165 45" stroke="#F6AD55" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Visualizing the "Safety Exit" context (The destination) -->
  <rect x="170" y="30" width="20" height="30" rx="2" fill="#2D3748"/>
  <rect x="174" y="35" width="12" height="20" rx="1" fill="#4A5568"/>
  <path d="M180 40 L 180 50 M 176 44 L 180 40 L 184 44" stroke="#F6AD55" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>