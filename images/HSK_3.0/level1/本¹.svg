<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Visual Metaphor for "本" as a classifier/unit for books -->
  <!-- Dark mode glowing atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>

  <!-- Multi-step progression / Escalation structure (Stack of 3 distinct volumes to match "三本") -->
  <!-- Bottom Book (Foundation/Base level) -->
  <g transform="translate(65, 145)">
    <path d="M 10 0 L 100 0 L 110 20 L 0 20 Z" fill="#2E384D"/>
    <path d="M 0 20 L 110 20 L 110 24 L 0 24 Z" fill="#4B5563"/>
    <rect x="20" y="6" width="70" height="8" rx="2" fill="#3B82F6" opacity="0.8"/>
  </g>

  <!-- Middle Book (Progressive step 2) -->
  <g transform="translate(60, 115)">
    <path d="M 10 0 L 100 0 L 110 20 L 0 20 Z" fill="#374151"/>
    <path d="M 0 20 L 110 20 L 110 24 L 0 24 Z" fill="#6B7280"/>
    <rect x="20" y="6" width="70" height="8" rx="2" fill="#F59E0B" opacity="0.9"/>
  </g>

  <!-- Top Book (Peak/Final unit - matching "三本书") -->
  <g transform="translate(55, 85)">
    <path d="M 10 0 L 100 0 L 110 20 L 0 20 Z" fill="#4B5563"/>
    <path d="M 0 20 L 110 20 L 110 24 L 0 24 Z" fill="#9CA3AF"/>
    <rect x="20" y="6" width="70" height="8" rx="2" fill="#10B981" opacity="0.9"/>
  </g>

  <!-- Magnifying glass / Focal zoom lens indicating specificity and precise counting/unit concept -->
  <g transform="translate(110, 70)">
    <!-- Lens Ring -->
    <circle cx="45" cy="45" r="28" fill="none" stroke="#F59E0B" stroke-width="4" opacity="0.9"/>
    <circle cx="45" cy="45" r="26" fill="#1E293B" opacity="0.4"/>
    <!-- Handle -->
    <path d="M 24 66 L 5 85" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <!-- Focus Indicator / Precise highlight -->
    <circle cx="45" cy="45" r="16" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 2"/>
  </g>

</svg>