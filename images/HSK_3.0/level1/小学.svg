<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for 小学 (Primary School Building) -->
  <g transform="translate(0, 0)">
    <!-- School Building Base Structure -->
    <rect x="55" y="95" width="130" height="90" rx="4" fill="#2D323E"/>
    
    <!-- Central Entrance Porch/Awning -->
    <rect x="96" y="135" width="48" height="50" fill="#242832"/>
    <!-- Double Doors -->
    <rect x="105" y="150" width="14" height="35" rx="3" fill="#3B4252"/>
    <rect x="121" y="150" width="14" height="35" rx="3" fill="#3B4252"/>
    <circle cx="116" cy="168" r="1.5" fill="#525B70"/>
    <circle cx="123" cy="168" r="1.5" fill="#525B70"/>

    <!-- Roof -->
    <path d="M 45 95 L 120 50 L 195 95 Z" fill="#F59E0B"/>
    <!-- Roof Accent Stripe -->
    <path d="M 58 87 L 120 51 L 182 87 Z" fill="#D97706" opacity="0.3"/>

    <!-- Clock Tower / Center Peak -->
    <rect x="108" y="42" width="24" height="24" rx="3" fill="#2D323E"/>
    <circle cx="120" cy="54" r="8" fill="#F3F4F6"/>
    <line x1="120" y1="48" x2="120" y2="54" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="54" x2="124" y2="54" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>

    <!-- Windows - Top Row -->
    <rect x="70" y="110" width="16" height="20" rx="3" fill="#60A5FA"/>
    <rect x="100" y="110" width="16" height="20" rx="3" fill="#60A5FA"/>
    <rect x="124" y="110" width="16" height="20" rx="3" fill="#60A5FA"/>
    <rect x="154" y="110" width="16" height="20" rx="3" fill="#60A5FA"/>

    <!-- Windows - Bottom Row -->
    <rect x="70" y="145" width="16" height="25" rx="3" fill="#60A5FA"/>
    <rect x="154" y="145" width="16" height="25" rx="3" fill="#60A5FA"/>

    <!-- Ground / Lawn -->
    <path d="M 30 185 L 210 185 C 210 185, 210 195, 210 195 C 210 195, 30 195, 30 195 C 30 195, 30 185, 30 185 Z" fill="#10B981"/>
    
    <!-- Playground Elements (Simple Flag and Bush) -->
    <!-- Flagpole -->
    <line x1="45" y1="185" x2="45" y2="125" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <!-- Flag -->
    <polygon points="45,125 65,133 45,141" fill="#EF4444"/>

    <!-- Decorative Bushes -->
    <circle cx="185" cy="183" r="10" fill="#059669"/>
    <circle cx="195" cy="185" r="8" fill="#10B981"/>
    <circle cx="55" cy="183" r="9" fill="#059669"/>
  </g>
</svg>