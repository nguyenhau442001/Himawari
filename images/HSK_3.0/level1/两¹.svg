<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle elements -->
  <circle cx="120" cy="120" r="85" fill="#222732" opacity="0.6"/>

  <!-- Central Visual Representation for "两" (Two books, matching "我有两本书。") -->
  <g transform="translate(0, 5)">
    <!-- Book 2 (Back / Right Book) -->
    <g transform="translate(118, 55)">
      <!-- Cover -->
      <path d="M 0 15 L 42 5 L 42 105 L 0 115 Z" fill="#E67E22" />
      <!-- Pages thickness -->
      <path d="M 42 5 L 50 12 L 50 112 L 42 105 Z" fill="#BDC3C7" />
      <path d="M 46 8 L 50 12 L 50 112 L 46 108 Z" fill="#ECF0F1" />
      <!-- Bookmark ribbon -->
      <path d="M 18 10 L 18 35 L 23 30 L 28 35 L 28 10 Z" fill="#E74C3C" />
      <!-- Cover decoration lines -->
      <line x1="10" y1="30" x2="32" y2="25" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="45" x2="32" y2="40" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Book 1 (Front / Left Book - overlapping) -->
    <g transform="translate(62, 70)">
      <!-- Cover -->
      <path d="M 0 10 L 45 0 L 45 100 L 0 110 Z" fill="#3498DB" />
      <!-- Pages thickness -->
      <path d="M 45 0 L 53 7 L 53 107 L 45 100 Z" fill="#BDC3C7" />
      <path d="M 49 4 L 53 7 L 53 107 L 49 104 Z" fill="#ECF0F1" />
      <!-- Bookmark ribbon -->
      <path d="M 18 8 L 18 30 L 23 25 L 28 30 L 28 8 Z" fill="#E74C3C" />
      <!-- Cover decoration lines -->
      <line x1="10" y1="25" x2="35" y2="20" stroke="#2980B9" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="40" x2="35" y2="35" stroke="#2980B9" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Focus/Count indicator accents (Gold/Orange theme) -->
  <circle cx="62" cy="62" r="4" fill="#F1C40F" />
  <circle cx="178" cy="48" r="4" fill="#F1C40F" />
</svg>