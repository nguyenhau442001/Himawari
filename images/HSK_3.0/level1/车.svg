<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Garage / Parking structure background elements -->
  <path d="M40 180 L200 180" stroke="#2A2F3B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Garage back wall & floor perspective lines -->
  <path d="M70 120 L170 120 L200 180 L40 180 Z" fill="#222733"/>
  <line x1="120" y1="120" x2="120" y2="180" stroke="#1A1D24" stroke-width="2"/>

  <!-- Ambient light glow from ceiling (garage context) -->
  <ellipse cx="120" cy="120" rx="50" ry="10" fill="#3B4252" opacity="0.4"/>

  <!-- Sleek Modern Car (Representing "车") -->
  <g transform="translate(0, 5)">
    <!-- Car Shadow -->
    <ellipse cx="120" cy="172" rx="75" ry="8" fill="#111317" opacity="0.8"/>

    <!-- Car Body - Lower Chassis -->
    <path d="M50 150 C50 145 55 140 65 140 L175 140 C185 140 190 145 190 150 L185 165 C185 170 180 172 175 172 L65 172 C60 172 55 170 55 165 Z" fill="#FF793F"/>

    <!-- Car Body - Upper Cabin & Roof -->
    <path d="M75 140 L95 108 C98 104 102 102 108 102 L132 102 C138 102 142 104 145 108 L165 140 Z" fill="#E6672E"/>

    <!-- Windows (Windshield & Side windows) -->
    <path d="M80 138 L98 110 C100 106 103 105 108 105 L132 105 C137 105 140 106 142 110 L160 138 Z" fill="#1E222B"/>
    <line x1="120" y1="105" x2="120" y2="138" stroke="#1A1D24" stroke-width="3"/>

    <!-- Headlight (Accent Gold/Yellow) -->
    <path d="M48 148 L55 148 C57 148 58 150 56 152 L48 152 Z" fill="#F7D794"/>
    <circle cx="51" cy="150" r="1.5" fill="#FFF"/>

    <!-- Taillight -->
    <path d="M190 148 L185 148 C183 148 182 150 184 152 L190 152 Z" fill="#FF5252"/>

    <!-- Wheels (Left & Right) -->
    <!-- Rear Wheel -->
    <circle cx="82" cy="165" r="18" fill="#2C3240"/>
    <circle cx="82" cy="165" r="10" fill="#4B5563"/>
    <circle cx="82" cy="165" r="4" fill="#E5E9F0"/>

    <!-- Front Wheel -->
    <circle cx="158" cy="165" r="18" fill="#2C3240"/>
    <circle cx="158" cy="165" r="10" fill="#4B5563"/>
    <circle cx="158" cy="165" r="4" fill="#E5E9F0"/>

    <!-- Modern styling accent line -->
    <path d="M55 156 L185 156" stroke="#E6672E" stroke-width="2" opacity="0.6"/>
  </g>

</svg>