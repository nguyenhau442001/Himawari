<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Background Elements (Modern dark UI context) -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 8"/>
  
  <!-- Dynamic Action Context: A middle school student actively studying/reading (capturing the essence of the student life action) -->
  <g transform="translate(0, 5)">
    <!-- Desk Surface -->
    <path d="M 60 165 L 180 165 L 195 190 L 45 190 Z" fill="#2E3646"/>
    <path d="M 45 165 L 195 165" stroke="#48556A" stroke-width="3" stroke-linecap="round"/>

    <!-- Open Book / Learning Materials with motion/interaction lines -->
    <path d="M 95 155 Q 120 145 145 155 L 145 175 Q 120 165 95 175 Z" fill="#E2E8F0"/>
    <path d="M 105 160 L 135 160 M 105 167 L 130 167" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Focus Accent: Glowing highlight on book -->
    <path d="M 120 135 L 120 145" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 115 138 L 125 138" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Student Character (Upper Body, Dynamic Pose leaning forward into study) -->
    <!-- Torso / Hoodie -->
    <path d="M 85 165 C 85 135 100 120 120 120 C 140 120 155 135 155 165 Z" fill="#3B82F6"/>
    
    <!-- Backpack Straps hinting at student status -->
    <path d="M 95 125 L 75 165" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
    <path d="M 145 125 L 165 165" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="112" y="105" width="16" height="20" fill="#FCA5A5"/>

    <!-- Head -->
    <circle cx="120" cy="90" r="22" fill="#FCA5A5"/>

    <!-- Modern Teen Hair Style -->
    <path d="M 98 85 C 98 65 142 65 142 85 C 142 90 145 95 148 95 C 140 100 115 105 102 95 C 98 90 98 85 98 85 Z" fill="#1E293B"/>

    <!-- Arms interacting with the desk/book (Action verb representation) -->
    <!-- Left Arm -->
    <path d="M 90 135 Q 80 150 95 165" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Arm (writing/engaging) -->
    <path d="M 150 135 Q 160 150 140 160" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Hand holding a pen -->
    <circle cx="137" cy="162" r="4" fill="#FCA5A5"/>
    <line x1="137" y1="162" x2="130" y2="172" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Action / Knowledge Spark Lines (Visualizing active learning/action) -->
    <path d="M 70 110 Q 60 100 70 90" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 170 110 Q 180 100 170 90" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="50" r="3" fill="#F59E0B"/>
    <circle cx="105" cy="55" r="2" fill="#3B82F6"/>
    <circle cx="135" cy="55" r="2" fill="#3B82F6"/>
  </g>
</svg>