<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Bookstore Building Exterior / Shopfront Structure -->
    <path d="M 50 170 L 50 95 L 120 70 L 190 95 L 190 170 Z" fill="#242933" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Roof Accent / Awning / Canopy -->
    <path d="M 44 95 L 196 95 L 185 80 L 55 80 Z" fill="#F59E0B"/>
    <path d="M 44 95 L 196 95 L 196 102 L 44 102 Z" fill="#D97706"/>
    
    <!-- Large Glass Display Windows -->
    <rect x="62" y="112" width="50" height="58" rx="4" fill="#111318" stroke="#3A4252" stroke-width="2"/>
    <rect x="128" y="112" width="50" height="58" rx="4" fill="#111318" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Window Display: Books inside left window -->
    <rect x="72" y="142" width="12" height="22" rx="1" fill="#3B82F6"/>
    <rect x="86" y="138" width="14" height="26" rx="1" fill="#EF4444"/>
    <path d="M 72 152 L 84 152" stroke="#111318" stroke-width="1.5"/>
    <path d="M 86 148 L 100 148" stroke="#111318" stroke-width="1.5"/>
    
    <!-- Window Display: Stack of books inside right window -->
    <rect x="138" y="148" width="24" height="6" rx="1" fill="#10B981"/>
    <rect x="140" y="142" width="20" height="6" rx="1" fill="#F59E0B"/>
    <rect x="142" y="136" width="16" height="6" rx="1" fill="#8B5CF6"/>
    
    <!-- Central Entrance Door -->
    <path d="M 105 170 L 105 122 L 135 122 L 135 170 Z" fill="#2E3642" stroke="#4B5563" stroke-width="1.5"/>
    <circle cx="129" cy="148" r="2" fill="#F59E0B"/>

    <!-- Focal Point: Prominent Open Book Sign / Icon mounted above door -->
    <circle cx="120" cy="56" r="24" fill="#111318" stroke="#F59E0B" stroke-width="3"/>
    <!-- Book Graphic Inside Badge -->
    <path d="M 106 64 C 112 61 118 63 120 66 C 122 63 128 61 134 64 L 134 48 C 128 45 122 47 120 50 C 118 47 112 45 106 48 Z" fill="#F59E0B"/>
    <path d="M 120 50 L 120 66" stroke="#111318" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Architectural Base Line -->
    <rect x="35" y="170" width="170" height="6" rx="2" fill="#4B5563"/>
    
    <!-- Warm Lighting Glows (Atmosphere) -->
    <path d="M 62 112 L 112 112 L 112 170 L 62 170 Z" fill="#F59E0B" opacity="0.05"/>
    <path d="M 128 112 L 178 112 L 178 170 L 128 170 Z" fill="#F59E0B" opacity="0.05"/>
  </g>
</svg>