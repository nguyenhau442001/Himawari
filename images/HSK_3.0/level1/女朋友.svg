<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 125)">
    <!-- Character representation: A young woman (bạn gái) smiling -->
    <!-- Torso and Dress -->
    <path d="M-35,65 L35,65 L45,100 L-45,100 Z" fill="#3B82F6" />
    <path d="M-20,65 L20,65 L25,100 L-25,100 Z" fill="#60A5FA" opacity="0.3" />

    <!-- Neck -->
    <rect x="-8" y="32" width="16" height="15" fill="#FBBF24" rx="4" />

    <!-- Head & Hair Base -->
    <circle cx="0" cy="10" r="28" fill="#FBBF24" />
    
    <!-- Hair Back -->
    <path d="M-30,-5 C-35,15 -32,45 -22,60 C-18,65 -15,55 -15,45 C-15,30 -20,10 -20,0 Z" fill="#1E293B" />
    <path d="M30,-5 C35,15 32,45 22,60 C18,65 15,55 15,45 C15,30 20,10 20,0 Z" fill="#1E293B" />

    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="-9" cy="6" r="3" fill="#1E293B" />
    <circle cx="9" cy="6" r="3" fill="#1E293B" />
    <!-- Smile -->
    <path d="M-6,15 Q0,21 6,15" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Blush -->
    <circle cx="-16" cy="12" r="4" fill="#F43F5E" opacity="0.4" />
    <circle cx="16" cy="12" r="4" fill="#F43F5E" opacity="0.4" />

    <!-- Hair Front / Bangs -->
    <path d="M-28,0 C-25,-15 -5,-18 0,-15 C10,-18 25,-15 28,0 C25,-5 15,-10 0,-8 C-15,-10 -25,-5 -28,0 Z" fill="#1E293B" />
    <path d="M-29,2 C-20,-8 -10,-12 0,-12 C-5,-5 -15,0 -29,2 Z" fill="#334155" />
    
    <!-- Friendly waving hand gesture -->
    <circle cx="-42" cy="35" r="8" fill="#FBBF24" />
    <!-- Casual accessory (small collar) -->
    <path d="M-12,50 L0,58 L12,50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>