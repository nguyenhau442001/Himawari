<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definition Context: Noun (Person/Stage) - "After/Later" in timeline growth representation -->
  <g transform="translate(0, 0)">
    <!-- Background Timeline Arc / Path -->
    <path d="M 48 160 Q 120 100 192 160" fill="none" stroke="#2A2F3D" stroke-width="4" stroke-dasharray="6 6"/>

    <!-- Past / Before Stage (Smaller, muted silhouette) -->
    <g transform="translate(60, 115)">
      <!-- Ground shadow -->
      <ellipse cx="0" cy="38" rx="14" ry="4" fill="#14171E"/>
      <!-- Child silhouette/figure -->
      <circle cx="0" cy="10" r="8" fill="#5A6376"/>
      <path d="M -8 20 C -8 15, 8 15, 8 20 L 6 36 L -6 36 Z" fill="#5A6376"/>
    </g>

    <!-- Arrow indicating progression -->
    <path d="M 112 112 L 128 102 L 112 92 Z" fill="#3A4254"/>

    <!-- Future / "后" (After/Later - Grown-up Professional / Doctor context) -->
    <g transform="translate(160, 90)">
      <!-- Ground shadow -->
      <ellipse cx="0" cy="62" rx="18" ry="5" fill="#14171E"/>

      <!-- Professional Figure (Main Noun Focus) -->
      <!-- Legs & Shoes -->
      <rect x="-6" y="40" width="4" height="20" fill="#2E3748"/>
      <rect x="2" y="40" width="4" height="20" fill="#2E3748"/>
      <path d="M -9 60 L -4 60 L -4 57 L -9 57 Z" fill="#F39C12"/>
      <path d="M 4 60 L 9 60 L 9 57 L 4 57 Z" fill="#F39C12"/>

      <!-- Body / Medical Coat -->
      <path d="M -12 20 L 12 20 L 14 45 L -14 45 Z" fill="#E2E8F0"/>
      <!-- Coat opening & buttons -->
      <line x1="0" y1="20" x2="0" y2="44" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="0" cy="26" r="1" fill="#94A3B8"/>
      <circle cx="0" cy="33" r="1" fill="#94A3B8"/>
      <circle cx="0" cy="40" r="1" fill="#94A3B8"/>

      <!-- Stethoscope around neck -->
      <path d="M -6 14 C -6 10, 6 10, 6 14 L 4 24" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
      <circle cx="4" cy="25" r="2.5" fill="#F39C12"/>

      <!-- Head & Hair -->
      <circle cx="0" cy="5" r="9" fill="#E2D9CC"/>
      <path d="M -9 4 C -9 -3, 9 -3, 9 4 C 7 1, -7 1, -9 4 Z" fill="#334155"/>

      <!-- Accent focal element: Medical Head Mirror / Identifier -->
      <circle cx="7" cy="3" r="2" fill="#F39C12"/>
    </g>

    <!-- Floating Focus Indicator / Highlight Ring -->
    <circle cx="160" cy="115" r="54" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  </g>
</svg>