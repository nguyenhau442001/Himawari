<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Distant Mountains -->
  <path d="M0 180 L60 120 L120 160 L180 100 L240 150 L240 240 L0 240 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M-20 200 L80 130 L160 190 L220 110 L280 180 L280 240 L-20 240 Z" fill="#334155"/>

  <!-- Winding Path -->
  <path d="M120 240 Q130 200 100 180 T140 140" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <path d="M120 240 Q130 200 100 180 T140 140" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- Distant Goal Glow -->
  <circle cx="140" cy="130" r="15" fill="#fbbf24" opacity="0.3"/>
  <circle cx="140" cy="130" r="5" fill="#f59e0b"/>

  <!-- Foreground Character (Hiker/Traveler) -->
  <g transform="translate(105, 195)">
    <!-- Legs -->
    <path d="M8 35 L5 42" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M12 35 L15 42" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Backpack -->
    <rect x="3" y="15" width="14" height="18" rx="3" fill="#ec4899"/>
    <!-- Body -->
    <path d="M5 15 Q10 12 15 15 L16 35 L4 35 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="10" cy="8" r="6" fill="#fde68a"/>
    <!-- Looking up gesture -->
    <path d="M14 18 L18 24" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Elements -->
  <path d="M0 220 Q60 210 100 240 L0 240 Z" fill="#0f172a"/>
  <path d="M240 220 Q180 210 140 240 L240 240 Z" fill="#0f172a"/>
  
  <!-- Starting Marker (Milestone) -->
  <g transform="translate(85, 215)">
    <rect x="0" y="0" width="6" height="15" rx="1" fill="#475569"/>
    <rect x="-2" y="-4" width="10" height="6" rx="1" fill="#94a3b8"/>
    <circle cx="3" cy="-1" r="1" fill="#10b981"/>
  </g>

  <!-- Atmospheric Details -->
  <circle cx="40" cy="50" r="1" fill="#f1f5f9" opacity="0.8"/>
  <circle cx="190" cy="40" r="1.5" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="210" cy="80" r="1" fill="#f1f5f9" opacity="0.4"/>
  <circle cx="30" cy="100" r="1" fill="#f1f5f9" opacity="0.5"/>
  
  <!-- Visual Metaphor: The first small sprout -->
  <g transform="translate(140, 225)">
    <path d="M0 0 Q2 -5 5 -4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 0 Q-2 -5 -5 -4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>