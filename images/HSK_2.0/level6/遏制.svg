<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chartUp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office Interior Background Details -->
  <!-- Large Window showing Cityscape at night -->
  <path d="M140 30 L210 30 L210 130 L140 130 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <!-- City Skyline through window -->
  <rect x="150" y="80" width="10" height="50" fill="#1e293b"/>
  <rect x="165" y="60" width="14" height="70" fill="#1e293b"/>
  <rect x="185" y="70" width="12" height="60" fill="#1e293b"/>
  <!-- Window grid lines -->
  <line x1="175" y1="30" x2="175" y2="130" stroke="#334155" stroke-width="1"/>
  <line x1="140" y1="80" x2="210" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Bookshelf / Office Props in background -->
  <rect x="25" y="40" width="40" height="90" fill="#1e293b" rx="2"/>
  <line x1="25" y1="70" x2="65" y2="70" stroke="#0f172a" stroke-width="2"/>
  <line x1="25" y1="100" x2="65" y2="100" stroke="#0f172a" stroke-width="2"/>
  <!-- Books -->
  <rect x="30" y="50" width="8" height="20" fill="#f59e0b" rx="1"/>
  <rect x="40" y="48" width="6" height="22" fill="#10b981" rx="1"/>
  <rect x="48" y="53" width="12" height="17" fill="#ef4444" rx="1"/>

  <!-- Desk Surface -->
  <path d="M10 160 L230 160 L220 210 L20 210 Z" fill="url(#deskGrad)"/>
  <path d="M10 160 L230 160" stroke="#475569" stroke-width="3"/>

  <!-- Inflation Chart (Background Screen / Monitor) -->
  <g transform="translate(75, 45)">
    <rect x="0" y="0" width="90" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Screen Header -->
    <rect x="6" y="6" width="78" height="10" rx="2" fill="#1e293b"/>
    <!-- Rising Red Line (Inflation) -->
    <path d="M12 65 L32 55 L52 40 L78 20" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Filled area under inflation line -->
    <path d="M12 65 L32 55 L52 40 L78 20 L78 72 L12 72 Z" fill="url(#chartUp)"/>
    <!-- Grid dots -->
    <circle cx="12" cy="65" r="2.5" fill="#ef4444"/>
    <circle cx="32" cy="55" r="2.5" fill="#ef4444"/>
    <circle cx="52" cy="40" r="2.5" fill="#ef4444"/>
    <circle cx="78" cy="20" r="3" fill="#ef4444" filter="url(#glow)"/>
  </g>

  <!-- Physical "Constraint" / Action Element: Giant Golden Shield & Barrier -->
  <!-- Glowing Energy Shield Halting the Inflation Arrow -->
  <g transform="translate(130, 60)">
    <!-- Shield Outline -->
    <path d="M 15 0 C 35 5 45 10 45 35 C 45 60 25 75 15 85 C 5 75 -15 60 -15 35 C -15 10 -5 5 15 0 Z" 
          fill="url(#shieldGrad)" opacity="0.85" stroke="#bae6fd" stroke-width="2" filter="url(#glow)"/>
    <!-- Inner Shield Emblem -->
    <path d="M 15 12 C 28 16 33 20 33 35 C 33 50 20 60 15 68 C 10 60 -3 50 -3 35 C -3 20 2 16 15 12 Z" 
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Main Character (Government Official / Leader, confident, active pose) -->
  <g transform="translate(35, 110)">
    <!-- Body / Suit -->
    <path d="M35 50 L65 50 L75 95 L25 95 Z" fill="#1e293b"/>
    <!-- White Shirt Collar & Tie -->
    <polygon points="43,50 57,50 50,68" fill="#f8fafc"/>
    <polygon points="48,60 52,60 53,82 50,86 47,82" fill="#ef4444"/>
    
    <!-- Shoulders / Jacket Lapels -->
    <path d="M35 50 L25 75 L38 75 Z" fill="#0f172a"/>
    <path d="M65 50 L75 75 L62 75 Z" fill="#0f172a"/>

    <!-- Head & Face -->
    <circle cx="50" cy="28" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M34 26 C34 16 42 12 50 12 C58 12 66 16 66 26 C64 22 58 19 50 19 C42 19 36 22 34 26 Z" fill="#334155"/>
    <!-- Determined Expression -->
    <path d="M42 26 Q50 31 58 26" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/> <!-- Eyes -->
    <line x1="43" y1="23" x2="48" y2="24" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/> <!-- Left Eyebrow (focused) -->
    <line x1="57" y1="23" x2="52" y2="24" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/> <!-- Right Eyebrow -->
    <path d="M46 35 Q50 38 54 35" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/> <!-- Mouth -->

    <!-- Active Arm pushing forward (Controlling/Stopping) -->
    <path d="M65 55 L95 65 L98 75 L70 70 Z" fill="#1e293b"/>
    <!-- Hand pushing the barrier -->
    <circle cx="98" cy="72" r="6" fill="#fbcfe8"/>
    
    <!-- Other arm resting on hip -->
    <path d="M35 55 L18 75 L28 85 L38 68 Z" fill="#1e293b"/>
    <circle cx="16" cy="78" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Desk Props (Document, Pen Holder, Plant) -->
  <!-- Document / Policy Paper on Desk -->
  <g transform="translate(100, 175)">
    <polygon points="0,15 35,5 45,25 10,35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="8" y1="18" x2="25" y2="13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="25" x2="30" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small Desk Plant (Adds warmth and life) -->
  <g transform="translate(185, 145)">
    <path d="M10 25 L20 25 L23 40 L7 40 Z" fill="#cbd5e1" rx="2"/>
    <path d="M15 25 C15 15 5 10 5 5 C10 5 15 15 15 25 Z" fill="#10b981"/>
    <path d="M15 25 C15 15 25 10 25 5 C20 5 15 15 15 25 Z" fill="#34d399"/>
    <path d="M15 25 C15 12 15 5 15 0 C15 5 15 12 15 25 Z" fill="#059669"/>
  </g>

  <!-- Accent Sparkles / Energy Particles representing stabilization -->
  <circle cx="150" cy="95" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="135" cy="130" r="2" fill="#38bdf8"/>
  <circle cx="165" cy="50" r="2.5" fill="#fbbf24" filter="url(#glow)"/>

</svg>