<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Statue Base -->
  <rect x="70" y="140" width="100" height="60" rx="4" fill="#334155"/>
  <rect x="75" y="145" width="90" height="50" rx="2" fill="#475569"/>
  
  <!-- Statue (Hero) -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-60" r="15" fill="#fbbf24"/>
    <path d="M-15 -50 L15 -50 L10 -20 L-10 -20 Z" fill="#fbbf24"/>
    <path d="M-8 -20 L-12 10 L-20 5 L-10 -30 Z" fill="#f59e0b"/>
    <path d="M8 -20 L12 10 L20 5 L10 -30 Z" fill="#f59e0b"/>
  </g>

  <!-- People looking up -->
  <g transform="translate(40, 200)">
    <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
    <path d="M-5 -5 L5 -5 L0 -15 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(80, 210)">
    <circle cx="0" cy="0" r="8" fill="#10b981"/>
    <path d="M-5 -5 L5 -5 L0 -15 Z" fill="#10b981"/>
  </g>
  <g transform="translate(160, 210)">
    <circle cx="0" cy="0" r="8" fill="#ec4899"/>
    <path d="M-5 -5 L5 -5 L0 -15 Z" fill="#ec4899"/>
  </g>
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="8" fill="#fb923c"/>
    <path d="M-5 -5 L5 -5 L0 -15 Z" fill="#fb923c"/>
  </g>

  <!-- Decorative Sparkles/Aura -->
  <circle cx="120" cy="80" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="70" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="100" cy="70" r="3" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Ground -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
</svg>