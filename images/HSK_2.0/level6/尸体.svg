<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- River/Ground Context -->
    <path d="M 30,170 Q 120,150 210,170 L 210,185 Q 120,165 30,185 Z" fill="#242B38" opacity="0.8"/>
    
    <!-- Water ripples -->
    <path d="M 60,176 Q 80,173 100,176" fill="none" stroke="#3A465B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 140,178 Q 160,175 180,178" fill="none" stroke="#3A465B" stroke-width="2" stroke-linecap="round"/>

    <!-- Police/Investigation Marker (Focus Accent) -->
    <path d="M 175,90 L 195,130 L 155,130 Z" fill="#F59E0B" opacity="0.15"/>
    <polygon points="175,85 198,135 152,135" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="175" cy="118" r="3" fill="#F59E0B"/>
    <path d="M 175,98 L 175,110" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Forensic / Evidence Tent ID (Small detail) -->
    <polygon points="55,150 70,125 85,150" fill="#3B82F6" opacity="0.3"/>
    <polygon points="55,150 70,125 85,150" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <text x="70" y="145" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>

    <!-- Central Subject: The Body (Stylized Flat Vector Silhouette) -->
    <g transform="translate(25, -5)">
      <!-- Head -->
      <circle cx="85" cy="115" r="14" fill="#64748B"/>
      
      <!-- Torso -->
      <path d="M 95,115 L 140,130 L 130,155 L 85,140 Z" fill="#475569"/>
      
      <!-- Left Arm (bent upward near head) -->
      <path d="M 95,118 L 105,98 L 118,105" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Right Arm (outstretched) -->
      <path d="M 125,126 L 145,115 L 155,122" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Legs (angled naturally) -->
      <path d="M 133,152 L 165,160 L 180,150" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 130,155 L 155,175 L 170,172" fill="none" stroke="#334155" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Outline/Chalk effect overlay (subtle semantic cue) -->
    <path d="M 107,113 C 105,103 112,95 120,98" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
    <path d="M 158,123 C 170,115 178,125 170,135" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  </g>
</svg>