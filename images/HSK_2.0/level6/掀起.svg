<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Water surface -->
  <path d="M20 180 C 80 160, 160 200, 220 180 L 220 220 L 20 220 Z" fill="#2C3E50"/>
  
  <!-- The "Wave" / "Upheaval" effect -->
  <path d="M40 180 C 70 120, 100 100, 130 140 C 160 180, 190 190, 210 160" stroke="#F39C12" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M30 190 C 60 130, 90 110, 120 150 C 150 190, 180 200, 200 170" stroke="#F39C12" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Character Action -->
  <!-- Arm/Hand lifting motion -->
  <path d="M100 180 L 120 130" stroke="#BDC3C7" stroke-width="12" stroke-linecap="round"/>
  <circle cx="120" cy="130" r="10" fill="#BDC3C7"/>
  
  <!-- Motion lines indicating the "lifting/upheaval" -->
  <path d="M130 120 L 140 100" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 125 L 145 105" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ripples/Disturbance -->
  <ellipse cx="130" cy="180" rx="20" ry="8" stroke="#34495E" stroke-width="2" fill="none"/>
  <ellipse cx="130" cy="180" rx="40" ry="15" stroke="#34495E" stroke-width="2" fill="none"/>
</svg>