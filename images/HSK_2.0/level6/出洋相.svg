<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <linearGradient id="spotlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Projector Beam Gradient -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Embarrassed Blush Gradient -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Dark Mode Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ==================== ENVIRONMENT & PROPS ==================== -->
  
  <!-- Presentation Screen / Backdrop in Background -->
  <rect x="50" y="30" width="140" height="75" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <!-- "Mistake" graphic on screen: a silly chart pointing down with a red X -->
  <path d="M 70 85 L 95 65 L 120 75 L 145 50" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="145" cy="50" r="4" fill="#ef4444"/>
  <!-- Red X mark on slide -->
  <path d="M 160 45 L 175 60 M 175 45 L 160 60" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Projector Beam from ceiling -->
  <polygon points="120,0 25,120 95,120" fill="url(#beam)"/>
  
  <!-- Stage Floor -->
  <path d="M 15 175 L 225 175 L 240 210 L 0 210 Z" fill="#090d16"/>
  <!-- Stage edge highlight -->
  <line x1="15" y1="175" x2="225" y2="175" stroke="#334155" stroke-width="2"/>

  <!-- Spotlight Cone over the Character -->
  <polygon points="120,10 70,185 170,185" fill="url(#spotlight)"/>

  <!-- Audience Silhouettes (Foreground, darker context) -->
  <!-- Left Audience Member -->
  <path d="M 10 240 Q 15 210 35 200 Q 40 220 35 240 Z" fill="#1e293b" opacity="0.8"/>
  <circle cx="24" cy="193" r="7" fill="#1e293b"/>
  <!-- Center-Left Audience Member (whispering/giggling hand over mouth) -->
  <path d="M 35 240 Q 40 205 65 195 Q 75 220 70 240 Z" fill="#334155" opacity="0.9"/>
  <circle cx="52" cy="186" r="8" fill="#334155"/>
  <path d="M 48 190 Q 53 192 57 189" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/> <!-- Hand giggling -->

  <!-- Right Audience Member -->
  <path d="M 230 240 Q 225 210 205 200 Q 200 220 205 240 Z" fill="#1e293b" opacity="0.8"/>
  <circle cx="216" cy="193" r="7" fill="#1e293b"/>
  <!-- Center-Right Audience Member -->
  <path d="M 205 240 Q 200 205 175 195 Q 165 220 170 240 Z" fill="#334155" opacity="0.9"/>
  <circle cx="188" cy="186" r="8" fill="#334155"/>

  <!-- Presentation Podium -->
  <path d="M 90 145 L 150 145 L 140 185 L 100 185 Z" fill="#475569"/>
  <path d="M 85 140 L 155 140 L 150 146 L 90 146 Z" fill="#64748b"/>
  <!-- Micro-props on podium: Mic stand and papers scattered -->
  <path d="M 120 140 L 120 120" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="117" r="4" fill="#cbd5e1"/>
  <!-- Messy papers fallen on the floor -->
  <polygon points="75,178 95,175 92,185 72,185" fill="#f8fafc" transform="rotate(-15 80 180)"/>
  <polygon points="145,176 165,180 162,188 142,184" fill="#e2e8f0" transform="rotate(20 150 180)"/>


  <!-- ==================== MAIN SUBJECT (THE EMBARRASSED SPEAKER) ==================== -->
  
  <!-- Body / Suit Torso (Twisted awkwardly in panic) -->
  <g transform="translate(120, 135)">
    <!-- Suit Jacket -->
    <path d="M -18 10 L -22 45 L 22 45 L 18 10 Z" fill="#1e3a8a"/>
    <!-- Shirt Collar & Tie -->
    <path d="M -8 10 L 0 22 L 8 10 Z" fill="#f8fafc"/>
    <path d="M -2 20 L 2 20 L 1 38 L -1 38 Z" fill="#ef4444"/>
    
    <!-- LEFT ARM (Clutching head in despair/panic) -->
    <path d="M -16 12 Q -35 -5 -25 -25" fill="none" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
    <!-- Left Hand on Head -->
    <circle cx="-25" cy="-26" r="6" fill="#fcd34d"/>

    <!-- RIGHT ARM (Waving defensively/awkwardly outward) -->
    <path d="M 16 12 Q 35 25 30 10" fill="none" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
    <!-- Right Hand open -->
    <circle cx="31" cy="7" r="5" fill="#fcd34d"/>

    <!-- HEAD & FACE (Sweating, blushing, comical expression of complete bẽ mặt) -->
    <g transform="translate(0, -22)">
      <!-- Hair (Messy, sticking up from stress) -->
      <path d="M -15 -8 Q -20 -22 -5 -18 Q 0 -26 10 -18 Q 20 -22 15 -8 Z" fill="#0f172a"/>

      <!-- Head Base -->
      <circle cx="0" cy="0" r="18" fill="#fcd34d"/>

      <!-- Embarrassed Blushes -->
      <circle cx="-10" cy="4" r="6" fill="url(#blush)"/>
      <circle cx="10" cy="4" r="6" fill="url(#blush)"/>

      <!-- Eyes: Comically scrunched shut (X or tight arcs) -->
      <path d="M -10 -2 L -5 -6 M -10 -6 L -5 -2" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <path d="M 5 -6 L 10 -2 M 5 -2 L 10 -6" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Mouth: Wide wavy grimace / shouting in panic -->
      <path d="M -7 7 Q 0 14 7 7 Q 5 2 0 4 Q -5 2 -7 7 Z" fill="#991b1b"/>
      <path d="M -7 7 Q 0 14 7 7" fill="none" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Sweat Drop 1 (Big anxiety drop near head) -->
      <path d="M 16 -12 Q 22 -4 16 2 Q 10 -4 16 -12 Z" fill="#38bdf8"/>
      <!-- Sweat Drop 2 (Flying off) -->
      <path d="M -20 -15 Q -16 -10 -20 -5 Q -24 -10 -20 -15 Z" fill="#38bdf8"/>
    </g>
  </g>

  <!-- ==================== ATMOSPHERIC DETAILS ==================== -->
  <!-- Floating awkward sweat particles / motion lines -->
  <path d="M 75 110 Q 70 105 65 112" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 165 100 Q 170 95 175 102" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

</svg>