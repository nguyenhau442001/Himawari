<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Travel/Airport Vibe -->
    <radialGradient id="amber-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Blue Accent for Suitcase/Tech -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Ticket/Paper Grad -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#amber-glow)"/>

  <!-- ENVIRONMENT / CONTEXT: Airport / Travel Departure Lounge -->
  <!-- Large Departure Window showing night/dusk skyline & plane -->
  <g opacity="0.85">
    <!-- Window Frame Structure -->
    <rect x="25" y="35" width="105" height="110" rx="4" fill="#334155" opacity="0.4"/>
    <rect x="30" y="40" width="95" height="100" rx="2" fill="#090d16"/>
    
    <!-- City Skyline through window -->
    <path d="M35 120 L35 100 L42 100 L42 120 Z M48 120 L48 85 L56 85 L56 120 Z M60 120 L60 92 L70 92 L70 120 Z M76 120 L76 75 L88 75 L88 120 Z M94 120 L94 95 L102 95 L102 120 Z M108 120 L108 82 L118 82 L118 120 Z" fill="#1e293b"/>
    <!-- Window Grid Lines -->
    <line x1="77" y1="40" x2="77" y2="140" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="90" x2="125" y2="90" stroke="#334155" stroke-width="2"/>

    <!-- Airplane silhouette ascending -->
    <g transform="translate(80, 55) scale(0.6)">
      <path d="M0 10 C15 8 30 2 35 0 C32 8 20 15 5 18 L12 24 C14 26 13 28 10 27 L2 21 L-10 28 C-12 29 -14 27 -13 25 L-5 15 C-15 12 -22 6 -25 3 C-20 3 -10 6 0 10 Z" fill="#94a3b8"/>
      <!-- Tiny blinking lights -->
      <circle cx="-13" cy="25" r="1.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- REPEATED TRAVEL STICKERS / MULTIPLE BOARDING PASSES (Visualizing "频繁" / Frequently) -->
  <g transform="translate(145, 45) rotate(12)">
    <!-- Pass 3 (Bottom) -->
    <rect x="0" y="20" width="65" height="40" rx="4" fill="#475569" opacity="0.6"/>
    <!-- Pass 2 (Middle) -->
    <rect x="-8" y="10" width="65" height="40" rx="4" fill="#64748b" opacity="0.8"/>
    <!-- Pass 1 (Top) -->
    <rect x="-15" y="0" width="65" height="40" rx="4" fill="url(#paper-grad)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Barcode & Stamp accents on top pass -->
    <rect x="-10" y="8" width="25" height="12" fill="#cbd5e1"/>
    <line x1="-10" y1="26" x2="15" y2="26" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="-10" y1="30" x2="10" y2="30" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Red priority stamp -->
    <circle cx="35" cy="20" r="10" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,1"/>
    <path d="M30 20 L33 23 L41 15" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- MAIN CHARACTER: Business Traveler in Action -->
  <g transform="translate(140, 105)">
    <!-- Shadow -->
    <ellipse cx="-15" cy="120" rx="35" ry="6" fill="#020617" opacity="0.5"/>

    <!-- Suitcase / Trolley (Rolling luggage) -->
    <g transform="translate(25, 60)">
      <!-- Telescopic Handle -->
      <path d="M-12 0 L-12 -35 L12 -35 L12 0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <rect x="-14" y="-38" width="28" height="6" rx="2" fill="#64748b"/>
      
      <!-- Body -->
      <rect x="-22" y="0" width="44" height="60" rx="6" fill="url(#blue-grad)"/>
      <rect x="-18" y="6" width="36" height="48" rx="3" fill="none" stroke="#0284c7" stroke-width="2"/>
      <!-- Horizontal ridges -->
      <line x1="-22" y1="20" x2="22" y2="20" stroke="#0284c7" stroke-width="2"/>
      <line x1="-22" y1="40" x2="22" y2="40" stroke="#0284c7" stroke-width="2"/>
      <!-- Wheels -->
      <circle cx="-14" cy="63" r="4" fill="#334155"/>
      <circle cx="14" cy="63" r="4" fill="#334155"/>
    </g>

    <!-- Character Body & Suit (Business Trip Context) -->
    <!-- Legs walking -->
    <g stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <!-- Back Leg -->
      <path d="M-15 75 L-25 105 L-18 115"/>
      <!-- Front Leg -->
      <path d="M-5 75 L10 102 L22 100"/>
    </g>
    <!-- Shoes -->
    <ellipse cx="-20" cy="117" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="25" cy="102" rx="7" ry="3" fill="#0f172a"/>

    <!-- Torso (Navy Suit Jacket) -->
    <path d="M-30 20 L15 20 L22 75 L-22 75 Z" fill="#334155" rx="4"/>
    <!-- Suit lapels & shirt -->
    <path d="M-5 20 L0 45 L5 20" fill="#ffffff"/>
    <path d="M-2 42 L-10 32" stroke="#1e293b" stroke-width="2"/>
    <path d="M2 42 L10 32" stroke="#1e293b" stroke-width="2"/>
    <!-- Red/Amber Tie -->
    <polygon points="-2,28 2,28 4,45 0,50 -4,45" fill="#f59e0b"/>

    <!-- Arms in motion (Dragging suitcase & holding phone/ticket) -->
    <!-- Back Arm (Holding luggage handle) -->
    <path d="M-20 25 L-35 45 L-10 65" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Arm (Carrying briefcase/phone, dynamic pose) -->
    <path d="M10 25 L35 38 L25 55" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="23" cy="56" r="4" fill="#fcd34d"/>

    <!-- Neck & Head -->
    <rect x="-4" y="10" width="8" height="12" fill="#fcd34d"/>
    <!-- Head / Face profile looking forward/determined -->
    <circle cx="2" cy="-2" r="15" fill="#fcd34d"/>
    
    <!-- Hair (Stylish neat dark hair) -->
    <path d="M-10 -10 C-5 -18 10 -15 15 -5 C12 -8 5 -12 -3 -12 C-7 -12 -9 -10 -10 -10 Z" fill="#0f172a"/>

    <!-- Confident facial expression (Busy commuter) -->
    <path d="M6 -2 L12 -2" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Determined Mouth -->
    <path d="M6 6 Q9 8 12 5" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Briefcase in other hand -->
    <g transform="translate(30, 45) rotate(-15)">
      <rect x="0" y="0" width="22" height="16" rx="3" fill="#b45309"/>
      <path d="M6 0 L6 -4 L16 -4 L16 0" fill="none" stroke="#78350f" stroke-width="2"/>
      <rect x="8" y="6" width="6" height="4" rx="1" fill="#fef3c7"/>
    </g>
  </g>

  <!-- FOREGROUND PROPS / LUGGAGE TAGS (Reinforcing frequent travel theme) -->
  <g transform="translate(45, 175)">
    <!-- Travel Bag / Duffel on floor -->
    <rect x="0" y="10" width="50" height="30" rx="10" fill="#0284c7"/>
    <!-- Zipper line -->
    <line x1="0" y1="18" x2="50" y2="18" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Handles -->
    <path d="M12 10 C12 2 20 2 25 2 C30 2 38 2 38 10" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- Luggage tag with accent color -->
    <polygon points="35,25 45,25 42,35 38,35" fill="#f59e0b"/>
    <circle cx="40" cy="27" r="1.5" fill="#0f172a"/>
    <!-- Feet -->
    <rect x="8" y="40" width="6" height="3" rx="1" fill="#334155"/>
    <rect x="36" y="40" width="6" height="3" rx="1" fill="#334155"/>
  </g>

  <!-- SECONDARY ACCENT: Flight Route Arc & Dots (Graphic element explaining frequency) -->
  <g opacity="0.6">
    <path d="M 50 140 Q 95 90 145 125" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="50" cy="140" r="4" fill="#38bdf8"/>
    <circle cx="95" cy="102" r="3" fill="#f59e0b"/>
    <circle cx="145" cy="125" r="4" fill="#10b981"/>
  </g>

</svg>