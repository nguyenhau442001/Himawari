<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Thermometer Graphic representing 摄氏度 (Celsius) -->
  <g transform="translate(0, 0)">
    <!-- Thermometer Outer Glow/Background Track -->
    <rect x="108" y="45" width="24" height="130" rx="12" fill="#2A2F3D"/>
    
    <!-- Thermometer Bulb Background -->
    <circle cx="120" cy="180" r="22" fill="#2A2F3D"/>

    <!-- Scale Tick Marks -->
    <g stroke="#64748B" stroke-width="2" stroke-linecap="round">
      <line x1="96" y1="65" x2="104" y2="65"/>
      <line x1="100" y1="85" x2="104" y2="85"/>
      <line x1="96" y1="105" x2="104" y2="105"/>
      <line x1="100" y1="125" x2="104" y2="125"/>
      <line x1="96" y1="145" x2="104" y2="145"/>
    </g>

    <!-- Mercury Level (representing 30°C - warm/high state) -->
    <rect x="113" y="90" width="14" height="90" rx="7" fill="url(#mercuryGrad)"/>
    <circle cx="120" cy="180" r="16" fill="#FF5722"/>

    <!-- Thermometer Glass Outline / Highlight -->
    <rect x="108" y="45" width="24" height="130" rx="12" fill="none" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="120" cy="180" r="22" fill="none" stroke="#4F46E5" stroke-width="3"/>
    
    <!-- Glass Reflection / Shine -->
    <path d="M 112 50 L 112 110" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3"/>
  </g>

  <!-- Degree Symbol (°C representation) -->
  <g transform="translate(142, 50)">
    <circle cx="10" cy="10" r="7" fill="none" stroke="#FFB703" stroke-width="4"/>
    <!-- Letter C -->
    <path d="M 38 4 C 34 2 28 4 26 10 C 24 16 28 20 34 20 C 38 20 40 18 40 18" fill="none" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Heat Waves / Ambient Temperature Effect -->
  <g stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6">
    <path d="M 75 90 C 70 85 70 75 75 70"/>
    <path d="M 65 105 C 58 98 58 88 65 82"/>
    <path d="M 165 90 C 170 85 170 75 165 70"/>
    <path d="M 175 105 C 182 98 182 88 175 82"/>
  </g>

  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="mercuryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
  </defs>
</svg>