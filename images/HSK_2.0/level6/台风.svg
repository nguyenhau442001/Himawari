<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Swirling Typhoon Object -->
    <path d="M0 -70 C 40 -70, 75 -40, 70 0 C 65 40, 30 70, -10 65 C -40 60, -65 30, -60 -10 C -55 -40, -30 -60, 0 -60" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Outer Spiral Arms -->
    <path d="M-60 -20 C -70 -50, -40 -80, 0 -80 C 50 -80, 80 -40, 75 10 C 70 50, 30 80, -20 75 C -60 70, -90 30, -80 -20" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Inner Spiral Arms -->
    <path d="M-40 0 C -45 -30, -20 -55, 10 -50 C 35 -45, 55 -20, 50 10 C 45 35, 20 55, -10 50 C -30 45, -45 25, -40 0" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Center Eye of the Typhoon -->
    <circle cx="5" cy="0" r="16" fill="#1A1D24"/>
    <circle cx="5" cy="0" r="10" fill="#FBBF24"/>
    
    <!-- Wind / Rain Streaks for dynamic motion -->
    <line x1="-75" y1="-50" x2="-55" y2="-40" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="-55" x2="50" y2="-45" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="45" x2="55" y2="35" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-70" y1="55" x2="-55" y2="45" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>