<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk/Workspace -->
  <path d="M40 180h160v10H40z" fill="#334155"/>
  <path d="M50 190l-10 40h180l-10-40z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Author Character -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-40" r="25" fill="#fde68a"/>
    <path d="M-10 -45h5m10 0h5m-12 10q6 4 12 0" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M-20 -20h40v10h-40z" fill="#38bdf8"/>
    <path d="M-25 -10h50v40h-50z" fill="#1e3a8a"/>
  </g>
  
  <!-- The "Vivid Description" (The Drawing) -->
  <g transform="translate(150, 80)">
    <rect x="-60" y="-40" width="120" height="80" rx="4" fill="#f1f5f9"/>
    <!-- Rural Scene inside the paper -->
    <path d="M-40 20l20-30 20 30z" fill="#10b981"/>
    <circle cx="20" cy="-10" r="10" fill="#fbbf24"/>
    <path d="M-20 20h60" stroke="#fb923c" stroke-width="2"/>
    <path d="M-30 25h80" stroke="#475569" stroke-width="2"/>
  </g>
  
  <!-- Quill/Pen -->
  <path d="M110 120l20-20l10 10l-20 20z" fill="#ec4899"/>
  <path d="M130 100l10-10" stroke="#ec4899" stroke-width="2"/>
  
  <!-- Ambient Glow -->
  <circle cx="150" cy="80" r="40" fill="#f59e0b" opacity="0.1"/>
</svg>