<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background with atmospheric dark mode gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="spotlight" cx="0.65" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="board-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT: Police Investigation Room / Corkboard background -->
  <!-- Corkboard back wall -->
  <rect x="24" y="24" width="132" height="130" rx="6" fill="#312e81" opacity="0.3" stroke="#475569" stroke-width="1.5" />
  
  <!-- EVIDENCE BOARD: Photos and red connecting strings representing "认定" (identification/determination) -->
  <line x1="60" y1="60" x2="110" y2="90" stroke="#ef4444" stroke-width="2" opacity="0.8" />
  <line x1="110" y1="90" x2="80" y2="120" stroke="#ef4444" stroke-width="2" opacity="0.8" />
  <line x1="60" y1="60" x2="80" y2="120" stroke="#ef4444" stroke-width="2" opacity="0.8" />

  <!-- Small evidence photo 1 -->
  <rect x="45" y="45" width="30" height="26" fill="#f8fafc" rx="2" transform="rotate(-6 60 58)" />
  <circle cx="60" cy="55" r="7" fill="#64748b" />
  <path d="M52 65 C52 60 68 60 68 65" fill="#64748b" />
  <!-- Pin -->
  <circle cx="60" cy="45" r="2.5" fill="#ef4444" />

  <!-- Small evidence photo 2 -->
  <rect x="95" y="75" width="30" height="26" fill="#f8fafc" rx="2" transform="rotate(8 110 88)" />
  <rect x="102" y="82" width="16" height="12" fill="#64748b" rx="1" />
  <!-- Pin -->
  <circle cx="110" cy="75" r="2.5" fill="#ef4444" />

  <!-- MAIN SUSPECT PROFILE (Target of "认定") -->
  <rect x="65" y="105" width="30" height="34" fill="#f8fafc" rx="2" transform="rotate(-3 80 122)" />
  <!-- Suspect silhouette graphic inside photo -->
  <circle cx="80" cy="116" r="6" fill="#1e293b" />
  <path d="M72 131 C72 125 88 125 88 131" fill="#1e293b" />
  <!-- Target highlight border (representing conclusive identification/认定) -->
  <rect x="63" y="103" width="34" height="38" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2" transform="rotate(-3 80 122)" />
  <!-- Pin -->
  <circle cx="80" cy="104" r="2.5" fill="#ef4444" />

  <!-- FOREGROUND DESK -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a" />
  <rect x="0" y="166" width="240" height="6" fill="#334155" rx="2" />

  <!-- Desk Props: Magnifying glass and file folder -->
  <!-- Folder -->
  <path d="M160 175 L215 175 L225 210 L150 210 Z" fill="#3b82f6" opacity="0.9" />
  <path d="M155 182 L210 182 L220 215 L145 215 Z" fill="#60a5fa" opacity="0.9" />
  
  <!-- Magnifying Glass hovering over evidence -->
  <g transform="translate(115, 135) rotate(-25)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#cbd5e1" stroke-width="5" />
    <circle cx="0" cy="0" r="15" fill="#38bdf8" fill-opacity="0.25" />
    <rect x="-3" y="15" width="6" height="25" rx="3" fill="#64748b" />
    <circle cx="-3" cy="15" r="3.5" fill="#475569" />
  </g>

  <!-- POLICE OFFICER CHARACTER (The actor performing "认定") -->
  <!-- Body/Torso in dark uniform -->
  <path d="M165 200 C165 175 195 175 195 200 L205 240 L155 240 Z" fill="#1e3a8a" />
  <path d="M180 178 L180 220" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  <!-- Badge/Insiginia -->
  <polygon points="180,188 184,195 176,195" fill="#f59e0b" />

  <!-- Neck & Head -->
  <rect x="172" y="155" width="16" height="15" fill="#fca5a5" rx="4" />
  <!-- Officer Head (Determined profile looking towards the suspect board) -->
  <circle cx="180" cy="142" r="15" fill="#fca5a5" />
  <!-- Police Cap -->
  <path d="M164 135 L196 135 C198 135 198 128 180 127 C162 128 162 135 164 135 Z" fill="#1e3a8a" />
  <path d="M165 135 L195 135 L198 141 L162 141 Z" fill="#0f172a" />
  <ellipse cx="180" cy="138" rx="14" ry="3" fill="#f59e0b" />
  
  <!-- Officer Hair/Sideburns -->
  <path d="M167 142 C167 138 172 138 174 143" fill="#334155" />

  <!-- Confident/Focused Expression (Eyebrow angled for "认定" - certainty/conclusion) -->
  <path d="M173 139 L183 141" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <circle cx="184" cy="144" r="1.5" fill="#1e293b" />
  <!-- Determined mouth -->
  <path d="M180 151 C183 151 185 149 186 149" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" />

  <!-- Officer Arm pointing/reaching toward the suspect node -->
  <path d="M168 185 C140 185 110 160 95 140" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="94" cy="138" r="5" fill="#fca5a5" />

  <!-- LIGHTING & ATMOSPHERE ACCENTS -->
  <!-- Ambient desk lamp glow from top right casting light down -->
  <path d="M220 0 L240 0 L240 40 Z" fill="#f59e0b" opacity="0.1" />
  
  <!-- FOCUS GLOW OVER SUSPECT PHOTO (Visualizing "认定" - narrowing down/identifying) -->
  <circle cx="80" cy="122" r="28" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4" stroke-dasharray="3 3" />
</svg>