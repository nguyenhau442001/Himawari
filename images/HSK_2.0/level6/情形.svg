<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Holographic Network Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Modern Control Room / Project Management Office -->
  <!-- Ambient Wall Panel Lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />
  <line x1="60" y1="180" x2="60" y2="240" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="180" y1="180" x2="180" y2="240" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Large Curved Command Monitor in Background -->
  <path d="M 40 50 Q 120 30 200 50 L 205 130 Q 120 145 35 130 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  <path d="M 45 58 Q 120 40 195 58 L 199 122 Q 120 135 41 122 Z" fill="url(#screen-glow)" />

  <!-- COMPLEX SITUATION VISUALIZATION ON SCREEN (Nodes, Graphs, Alert Pins) -->
  <!-- Network Connections representing a complex scenario/situation -->
  <path d="M 70 90 Q 95 65 120 95 T 170 80" fill="none" stroke="url(#holo-grad)" stroke-width="2" stroke-linecap="round" />
  <path d="M 60 110 L 90 85 L 130 115 L 180 70" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  
  <!-- Data Nodes / Nodes of the "Complex Situation" -->
  <circle cx="70" cy="90" r="4" fill="#38bdf8" filter="url(#shadow)" />
  <circle cx="120" cy="95" r="5" fill="#ec4899" filter="url(#shadow)" />
  <circle cx="170" cy="80" r="4" fill="#fbbf24" filter="url(#shadow)" />
  <circle cx="90" cy="85" r="3" fill="#10b981" />
  <circle cx="130" cy="115" r="4" fill="#fb923c" />

  <!-- Mini bar chart indicators on screen -->
  <rect x="145" y="95" width="6" height="20" rx="2" fill="#ec4899" opacity="0.7" />
  <rect x="155" y="85" width="6" height="30" rx="2" fill="#38bdf8" opacity="0.7" />
  <rect x="135" y="105" width="6" height="10" rx="2" fill="#fbbf24" opacity="0.7" />

  <!-- Warning / Alert Accent indicating "Complex/Difficult" -->
  <path d="M 105 70 L 109 78 L 101 78 Z" fill="#fbbf24" />
  <circle cx="105" cy="81" r="1" fill="#fbbf24" />

  <!-- Monitor Stand -->
  <rect x="110" y="130" width="20" height="25" fill="#1e293b" />
  <path d="M 90 155 L 150 155 L 160 165 L 80 165 Z" fill="#334155" />

  <!-- FOREGROUND DESK -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
  <path d="M 0 170 L 240 170 L 240 175 L 0 175 Z" fill="#38bdf8" opacity="0.5" /> <!-- Desk LED strip -->

  <!-- Desk Props -->
  <!-- Coffee Mug -->
  <rect x="195" y="155" width="16" height="20" rx="3" fill="#cbd5e1" />
  <path d="M 211 160 C 217 160 217 170 211 170" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 200 150 Q 203 145 201 140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Tablet / Secondary Device showing detailed metrics -->
  <rect x="140" y="160" width="36" height="24" rx="3" transform="rotate(-10 140 160)" fill="#334155" stroke="#64748b" stroke-width="1" />
  <rect x="144" y="164" width="28" height="14" rx="1" transform="rotate(-10 140 160)" fill="#0f172a" />
  <!-- Graph line on tablet -->
  <path d="M 146 174 L 152 170 L 158 175 L 166 167" fill="none" stroke="#10b981" stroke-width="1.5" transform="rotate(-10 140 160)" />

  <!-- MAIN CHARACTER: Concerned Analyst / Professional assessing the situation -->
  <!-- Body / Torso (Wearing a neat navy suit jacket and orange inner shirt) -->
  <path d="M 65 240 L 65 200 C 65 185 85 180 100 180 C 115 180 135 185 135 200 L 135 240 Z" fill="#1e293b" filter="url(#shadow)" />
  <!-- Inner Shirt Collar & Tie -->
  <polygon points="100,185 108,205 92,205" fill="#fb923c" />
  <polygon points="98,200 102,200 103,225 97,225" fill="#e2e8f0" />
  <!-- Suit Lapels -->
  <path d="M 80 180 L 92 210 L 65 240" fill="#0f172a" opacity="0.3" />
  <path d="M 120 180 L 108 210 L 135 240" fill="#0f172a" opacity="0.3" />

  <!-- Neck -->
  <rect x="92" y="165" width="16" height="20" fill="#fed7aa" />

  <!-- Head (Expressing deep thought / complexity) -->
  <circle cx="100" cy="140" r="24" fill="#fed7aa" filter="url(#shadow)" />

  <!-- Hair (Modern styled dark hair) -->
  <path d="M 77 135 C 77 115 123 115 123 135 C 123 145 120 140 118 130 C 110 118 90 118 82 130 C 79 140 77 140 77 135 Z" fill="#334155" />
  <path d="M 76 138 C 76 138 82 145 88 138" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Facial Expressions (Pondering, furrowed brows, thoughtful eyes) -->
  <!-- Eyebrows (Slanted down inward to show complexity/concern) -->
  <line x1="87" y1="133" x2="95" y2="136" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="105" y1="136" x2="113" y2="133" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes (Focused looking at screen) -->
  <circle cx="91" cy="141" r="2" fill="#1e293b" />
  <circle cx="109" cy="141" r="2" fill="#1e293b" />

  <!-- Glasses (Adding professional analyst touch) -->
  <rect x="85" y="135" width="12" height="10" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
  <rect x="103" y="135" width="12" height="10" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
  <line x1="97" y1="139" x2="103" y2="139" stroke="#64748b" stroke-width="1.5" />

  <!-- Nose & Thoughtful Mouth (Subtle serious line) -->
  <path d="M 100 144 L 98 150 L 101 150" fill="none" stroke="#e0a96d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 94 158 Q 100 155 106 158" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

  <!-- Hands / Arms (Resting on chin in contemplation) -->
  <!-- Right arm and hand touching chin -->
  <path d="M 75 210 Q 70 180 90 162" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand on chin -->
  <circle cx="92" cy="158" r="8" fill="#fed7aa" filter="url(#shadow)" />
  <path d="M 88 154 C 92 152 96 156 94 162" fill="none" stroke="#e0a96d" stroke-width="1" />

  <!-- Left arm resting naturally -->
  <path d="M 125 210 Q 135 190 125 175" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round" />

  <!-- AMBIENT LIGHTING & ATMOSPHERE -->
  <!-- Screen glow reflection on character's face and shoulder -->
  <path d="M 100 118 C 115 118 123 130 123 130 C 123 130 115 125 100 125 Z" fill="#38bdf8" opacity="0.3" />
  <path d="M 115 180 L 135 200 L 125 205 Z" fill="#38bdf8" opacity="0.15" />

</svg>