<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Cozy Warm Room Interior Background -->
  <!-- Walls & Floor -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b"/>
  <rect x="20" y="150" width="200" height="70" fill="#334155"/>
  <line x1="20" y1="150" x2="220" y2="150" stroke="#475569" stroke-width="2"/>

  <!-- Warm Window with Night View & Moon -->
  <rect x="35" y="35" width="55" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <circle cx="65" cy="60" r="10" fill="#fbbf24" opacity="0.9"/>
  <path d="M50 85 Q65 75 80 95 L80 105 L50 105 Z" fill="#334155" opacity="0.5"/>
  <!-- Window Frame Lines -->
  <line x1="62" y1="35" x2="62" y2="110" stroke="#475569" stroke-width="1.5"/>
  <line x1="35" y1="72" x2="90" y2="72" stroke="#475569" stroke-width="1.5"/>

  <!-- Warm Lamp Light Effect -->
  <path d="M150 20 L130 85 L170 85 Z" fill="#fbbf24" opacity="0.12"/>
  <path d="M150 35 L145 20 L155 20 Z" fill="#64748b"/>
  <line x1="150" y1="20" x2="150" y2="35" stroke="#64748b" stroke-width="2"/>
  <circle cx="150" cy="37" r="6" fill="#f59e0b"/>

  <!-- Bookshelf Background -->
  <rect x="175" y="45" width="30" height="80" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <line x1="175" y1="70" x2="205" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="175" y1="95" x2="205" y2="95" stroke="#334155" stroke-width="2"/>
  <rect x="180" y="55" width="6" height="15" fill="#38bdf8" rx="1"/>
  <rect x="188" y="58" width="5" height="12" fill="#ec4899" rx="1"/>
  <rect x="180" y="80" width="8" height="15" fill="#10b981" rx="1"/>

  <!-- Mother Character (Seated, Worried Expression, Holding Photo/Phone) -->
  <!-- Chair -->
  <rect x="100" y="100" width="45" height="75" rx="8" fill="#475569"/>
  <rect x="108" y="110" width="29" height="55" rx="4" fill="#334155"/>
  <rect x="105" y="155" width="6" height="30" fill="#1e293b"/>
  <rect x="134" y="155" width="6" height="30" fill="#1e293b"/>

  <!-- Mother Body & Apron -->
  <path d="M105 125 C105 110 135 110 135 125 L140 165 C140 170 100 170 100 165 Z" fill="#0284c7"/>
  <path d="M110 135 L130 135 L135 168 L105 168 Z" fill="#f8fafc"/> <!-- Apron -->

  <!-- Mother Head & Hair -->
  <circle cx="120" cy="92" r="14" fill="#fcd34d"/>
  <!-- Hair Bun & Styling -->
  <path d="M106 90 C106 78 134 78 134 90 C134 96 126 93 120 93 C114 93 106 96 106 90 Z" fill="#334155"/>
  <circle cx="120" cy="74" r="7" fill="#334155"/>

  <!-- Facial Features (Worried/Pensative) -->
  <path d="M113 90 Q116 88 119 90" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M121 90 Q124 88 127 90" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="116" cy="93" r="1.5" fill="#1e293b"/>
  <circle cx="124" cy="93" r="1.5" fill="#1e293b"/>
  <path d="M118 99 Q120 97 122 99" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- Frown/Concerned lips -->

  <!-- Arms holding a framed photo of the child -->
  <path d="M108 130 C100 135 105 145 112 145" stroke="#0284c7" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M132 130 C138 135 133 145 126 145" stroke="#0284c7" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Photo Frame Prop (Representing the child far away) -->
  <rect x="111" y="125" width="18" height="22" rx="2" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
  <rect x="114" y="128" width="12" height="16" fill="#fef3c7"/>
  <!-- Mini Child Illustration inside Frame -->
  <circle cx="120" cy="134" r="3.5" fill="#fcd34d"/>
  <path d="M116 142 C116 139 124 139 124 142 Z" fill="#10b981"/>

  <!-- Side Table & Warm Teapot Prop -->
  <rect x="155" y="145" width="40" height="40" rx="3" fill="#334155"/>
  <rect x="160" y="130" width="14" height="15" rx="3" fill="#cbd5e1"/> <!-- Teapot Body -->
  <path d="M174 135 C179 135 179 140 174 142" stroke="#cbd5e1" stroke-width="2" fill="none"/> <!-- Spout -->
  <path d="M157 134 C154 134 154 141 157 141" stroke="#cbd5e1" stroke-width="2" fill="none"/> <!-- Handle -->
  <circle cx="167" cy="128" r="2" fill="#94a3b8"/> <!-- Lid -->

  <!-- Floating Thought Bubble / Emotional Glow (Representing "Longing & Worry" - 惦记) -->
  <g opacity="0.8">
    <circle cx="95" cy="75" r="4" fill="#fbbf24" opacity="0.4"/>
    <circle cx="85" cy="62" r="6" fill="#fbbf24" opacity="0.6"/>
    <path d="M 72 42 
             C 75 35, 88 35, 91 42 
             C 95 35, 108 35, 111 42 
             C 117 42, 117 52, 111 57 
             C 108 64, 95 64, 91 57 
             C 88 64, 75 64, 72 57 
             C 66 52, 66 42, 72 42 Z" 
          fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>
    <!-- Glowing Heart inside Thought Bubble -->
    <path d="M91 46 C91 44 88 42 86 44 C84 42 81 44 81 46 C81 49 86 52 86 52 C86 52 91 49 91 46 Z" fill="#ef4444"/>
  </g>

  <!-- Floor Rug -->
  <ellipse cx="120" cy="195" rx="60" ry="14" fill="#1e293b" opacity="0.7"/>
  <ellipse cx="120" cy="193" rx="50" ry="10" fill="#475569" opacity="0.4"/>

  <!-- Ambient Light Gradients for Depth -->
  <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
  </radialGradient>
  <circle cx="150" cy="40" r="80" fill="url(#lampGlow)" pointer-events="none"/>
</svg>