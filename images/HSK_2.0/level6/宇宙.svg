<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background stars / deep space ambience -->
  <circle cx="50" cy="50" r="1" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="190" cy="70" r="1.5" fill="#4DA6FF" opacity="0.6"/>
  <circle cx="200" cy="180" r="1" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="40" cy="190" r="1.2" fill="#FFA500" opacity="0.5"/>
  <circle cx="110" cy="30" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="180" cy="130" r="1" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="70" cy="130" r="1.5" fill="#4DA6FF" opacity="0.4"/>

  <!-- Outer Orbit / Cosmic Ring -->
  <ellipse cx="120" cy="120" rx="85" ry="35" fill="none" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(-25 120 120)"/>
  
  <!-- Central Celestial Body: Planet Universe representation -->
  <!-- Planet Body -->
  <circle cx="120" cy="120" r="54" fill="#1E293B"/>
  
  <!-- Planet Atmosphere / Shading -->
  <path d="M 66 120 A 54 54 0 0 0 174 120 A 58 45 0 0 1 66 120 Z" fill="#0F172A" opacity="0.6"/>

  <!-- Planet Rings -->
  <g transform="rotate(-20 120 120)">
    <!-- Back ring part -->
    <path d="M 45 120 A 75 22 0 0 1 195 120" fill="none" stroke="#FFA500" stroke-width="3" opacity="0.4"/>
    <path d="M 38 120 A 82 25 0 0 1 202 120" fill="none" stroke="#4DA6FF" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Surface Details (Continents/Nebula Swirls) -->
  <path d="M 95 90 Q 110 85 125 100 T 140 120 Q 130 145 110 140 T 90 120 Z" fill="#3B82F6" opacity="0.25"/>
  <circle cx="135" cy="95" r="8" fill="#60A5FA" opacity="0.3"/>
  <circle cx="100" cy="140" r="6" fill="#34D399" opacity="0.2"/>

  <!-- Foreground ring part -->
  <g transform="rotate(-20 120 120)">
    <path d="M 195 120 A 75 22 0 0 1 45 120" fill="none" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
    <!-- Orbiting satellite/star on ring -->
    <circle cx="185" cy="112" r="3" fill="#FFFFFF"/>
    <path d="M 185 112 L 195 107" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Glowing accent elements (Cosmic dust / Stars) -->
  <!-- 4-point Star 1 -->
  <path d="M 120 50 C 120 62 120 62 132 62 C 120 62 120 62 120 74 C 120 62 120 62 108 62 C 120 62 120 62 120 50 Z" fill="#FFA500"/>
  
  <!-- 4-point Star 2 (Smaller) -->
  <path d="M 75 80 C 75 86 75 86 81 86 C 75 86 75 86 75 92 C 75 86 75 86 69 86 C 75 86 75 86 75 80 Z" fill="#60A5FA"/>

  <!-- 4-point Star 3 (Smaller) -->
  <path d="M 165 145 C 165 150 165 150 170 150 C 165 150 165 150 165 155 C 165 150 165 150 160 150 C 165 150 165 150 165 145 Z" fill="#FBBF24"/>

  <!-- Additional Orbit Path -->
  <ellipse cx="120" cy="120" rx="68" ry="68" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.2" stroke-dasharray="3 6"/>
  
  <!-- Small orbiting moon -->
  <circle cx="68" cy="95" r="4" fill="#E2E8F0"/>
  <!-- Moon crater -->
  <circle cx="67" cy="94" r="1.2" fill="#CBD5E1"/>

</svg>