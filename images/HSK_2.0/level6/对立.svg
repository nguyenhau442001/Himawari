<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow (Left Viewpoint) -->
    <radialGradient id="amber-glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Cyan Glow (Right Viewpoint) -->
    <radialGradient id="cyan-glow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Characters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Lighting Gradients -->
  <rect width="240" height="240" rx="24" fill="url(#amber-glow)" />
  <rect width="240" height="240" rx="24" fill="url(#cyan-glow)" />

  <!-- Background Architecture: Meeting Room / Discussion Space -->
  <!-- Floor Grid / Horizon Line -->
  <line x1="20" y1="180" x2="220" y2="180" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <ellipse cx="120" cy="180" rx="90" ry="16" fill="#0f172a" opacity="0.6" />

  <!-- Central Split Divider / Tension Line (Representing "Opposing Views") -->
  <line x1="120" y1="40" x2="120" y2="180" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />

  <!-- ================= LEFT SIDE (Warm / Amber Viewpoint) ================= -->
  <!-- Person A: Expressive, leaning back defensively/firmly, pointing left -->
  <g filter="url(#shadow)">
    <!-- Chair A -->
    <path d="M50 170 L55 120 L75 125 L70 170 Z" fill="#334155" />
    <rect x="45" y="100" width="30" height="30" rx="6" fill="#475569" />

    <!-- Character A Body -->
    <path d="M55 170 L65 130 L85 135 L95 170 Z" fill="#d97706" /> <!-- Amber shirt -->
    <!-- Head A -->
    <circle cx="72" cy="110" r="14" fill="#fde68a" />
    <!-- Hair A -->
    <path d="M58 108 C60 96 84 96 86 108 C80 102 64 102 58 108 Z" fill="#78350f" />
    <!-- Facial expression: Frowning, determined -->
    <path d="M68 113 Q72 110 76 113" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="68" cy="109" r="1.5" fill="#451a03" />
    <circle cx="76" cy="109" r="1.5" fill="#451a03" />
    <!-- Pointing Arm A (Pushing away towards the right) -->
    <path d="M80 135 L105 125 L95 120" stroke="#d97706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="105" cy="125" r="4" fill="#fde68a" />
  </g>

  <!-- Left Context Props: Floating Idea Bubble / Concept Art (Amber Theme) -->
  <g transform="translate(45, 55)">
    <circle cx="15" cy="15" r="18" fill="#f59e0b" opacity="0.15" />
    <!-- Abstract Concept Icon: Sun / Growth -->
    <circle cx="15" cy="15" r="8" fill="#f59e0b" />
    <path d="M15 3 L15 7 M15 23 L15 27 M3 15 L7 15 M23 15 L27 15" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>


  <!-- ================= RIGHT SIDE (Cool / Cyan Viewpoint) ================= -->
  <!-- Person B: Mirroring opposition, leaning back, arms crossed/gesturing opposite -->
  <g filter="url(#shadow)">
    <!-- Chair B -->
    <path d="M190 170 L185 120 L165 125 L170 170 Z" fill="#334155" />
    <rect x="165" y="100" width="30" height="30" rx="6" fill="#475569" />

    <!-- Character B Body -->
    <path d="M185 170 L175 130 L155 135 L145 170 Z" fill="#0284c7" /> <!-- Cyan/Blue shirt -->
    <!-- Head B -->
    <circle cx="168" cy="110" r="14" fill="#bae6fd" />
    <!-- Hair B -->
    <path d="M154 108 C156 96 180 96 182 108 C176 102 160 102 154 108 Z" fill="#0f172a" />
    <!-- Facial expression: Stern, disagreeing -->
    <path d="M164 113 Q168 116 172 113" stroke="#0369a1" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="164" cy="109" r="1.5" fill="#0f172a" />
    <circle cx="172" cy="109" r="1.5" fill="#0f172a" />
    <!-- Gesturing Arm B (Pushing back towards the left) -->
    <path d="M160 135 L135 125 L145 120" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="135" cy="125" r="4" fill="#bae6fd" />
  </g>

  <!-- Right Context Props: Floating Idea Bubble / Concept Art (Cyan Theme) -->
  <g transform="translate(180, 55)">
    <circle cx="15" cy="15" r="18" fill="#38bdf8" opacity="0.15" />
    <!-- Abstract Concept Icon: Snowflake / Structure -->
    <path d="M15 7 L15 23 M7 15 L23 15 M9 9 L21 21 M9 21 L21 9" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>


  <!-- ================= CENTRAL DESK & MEETING PROPS ================= -->
  <!-- Shared Conference Table in the middle -->
  <path d="M90 165 L150 165 L160 185 L80 185 Z" fill="#475569" />
  <path d="M85 165 L155 165 L150 160 L90 160 Z" fill="#64748b" />

  <!-- Props on Table: Documents pointing in opposite directions -->
  <!-- Left Document (Amber accent) -->
  <rect x="98" y="162" width="14" height="10" rx="1" fill="#fde68a" transform="rotate(-15 105 167)" />
  <!-- Right Document (Cyan accent) -->
  <rect x="128" y="162" width="14" height="10" rx="1" fill="#bae6fd" transform="rotate(15 135 167)" />

  <!-- Tension sparks / visual clash in the absolute center space -->
  <g transform="translate(120, 115)">
    <!-- Dynamic opposing arrows / spark element -->
    <path d="M -15 0 L -5 0 M -10 -5 L -5 0 L -10 5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 15 0 L 5 0 M 10 -5 L 5 0 L 10 5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="0" cy="0" r="3" fill="#ec4899" />
  </g>

  <!-- Environment Details: Wall frames showing contrasting charts -->
  <!-- Left Wall Art (Upward Trend Chart - Amber) -->
  <rect x="25" y="35" width="30" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <path d="M30 50 L38 43 L44 47 L50 38" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Right Wall Art (Downward/Alternative Trend Chart - Cyan) -->
  <rect x="185" y="35" width="30" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <path d="M190 40 L196 46 L202 42 L210 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

</svg>