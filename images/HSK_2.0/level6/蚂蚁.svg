    <circle cx="12" cy="-2" r="8" fill="#fb923c"/>
    <circle cx="24" cy="0" r="7" fill="#fb923c"/>
    <path d="M10 -5 L 8 -15 M14 -5 L 16 -15" stroke="#fb923c" stroke-width="2"/>
  </g>
  
  <!-- Ant 3 -->
  <g transform="translate(110, 190)">
