  <!-- Food (A large fallen slice of apple) -->
  <path d="M120 160 Q 150 150 180 160 Q 190 180 170 195 Q 140 200 110 185 Z" fill="#ec4899"/>
  <path d="M125 165 Q 140 160 155 165" stroke="#fbcfe8" stroke-width="2" fill="none"/>
  
  <!-- Ants -->
  <!-- Ant 1 -->
  <g transform="translate(160, 185)">
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <circle cx="12" cy="-2" r="8" fill="#fbbf24"/>
