  </g>

  <!-- Grass blades for environment -->
  <path d="M20 240 L 25 190 L 30 240" fill="#10b981"/>
  <path d="M40 240 L 45 200 L 50 240" fill="#10b981"/>
  <path d="M220 240 L 225 200 L 230 240" fill="#10b981"/>
  
