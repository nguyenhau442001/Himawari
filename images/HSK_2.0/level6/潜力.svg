<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Effect for Potential/Magic -->
    <radialGradient id="potentialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Beam Gradient -->
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Window Cityscape Silhouette -->
    <linearGradient id="windowView" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Interior Environment -->
  <!-- Wallpaper / Room Back Wall -->
  <rect x="20" y="20" width="200" height="175" rx="6" fill="#1e293b" opacity="0.5"/>

  <!-- Window with Night Cityscape (Showing aspiration/future) -->
  <g transform="translate(150, 35)">
    <rect x="0" y="0" width="55" height="75" rx="4" fill="url(#windowView)" stroke="#334155" stroke-width="2"/>
    <!-- City buildings silhouettes -->
    <rect x="5" y="35" width="12" height="40" fill="#1e1b4b"/>
    <rect x="19" y="20" width="15" height="55" fill="#1e1b4b"/>
    <rect x="36" y="45" width="14" height="30" fill="#1e1b4b"/>
    <!-- City lights -->
    <circle cx="11" cy="42" r="1" fill="#fbbf24"/>
    <circle cx="24" cy="28" r="1" fill="#38bdf8"/>
    <circle cx="28" cy="35" r="1" fill="#fbbf24"/>
    <circle cx="41" cy="52" r="1" fill="#38bdf8"/>
    <!-- Window Frame Cross -->
    <line x1="27" y1="0" x2="27" y2="75" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="37" x2="55" y2="37" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Bookshelf with Colorful Books -->
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="35" height="60" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Shelves -->
    <line x1="0" y1="20" x2="35" y2="20" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="35" y2="40" stroke="#334155" stroke-width="1.5"/>
    <!-- Books top shelf -->
    <rect x="4" y="8" width="5" height="12" rx="1" fill="#ec4899"/>
    <rect x="10" y="6" width="6" height="14" rx="1" fill="#38bdf8"/>
    <rect x="17" y="10" width="4" height="10" rx="1" fill="#fbbf24"/>
    <!-- Books middle shelf -->
    <rect x="4" y="25" width="7" height="15" rx="1" fill="#10b981"/>
    <rect x="13" y="28" width="5" height="12" rx="1" fill="#f43f5e"/>
    <rect x="19" y="24" width="8" height="16" rx="1" fill="#8b5cf6"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="195" width="240" height="45" fill="#090d16"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2"/>

  <!-- Rug under desk -->
  <ellipse cx="110" cy="210" rx="65" ry="15" fill="#334155" opacity="0.6"/>

  <!-- Wooden Child's Desk and Creative Tools -->
  <g transform="translate(60, 145)">
    <!-- Desk Legs -->
    <rect x="10" y="15" width="6" height="35" fill="#475569" rx="2"/>
    <rect x="84" y="15" width="6" height="35" fill="#475569" rx="2"/>
    <!-- Desk Top -->
    <rect x="0" y="0" width="100" height="15" rx="3" fill="#64748b"/>
    <rect x="-5" y="0" width="110" height="5" rx="2" fill="#94a3b8"/>
    
    <!-- Props on Desk: Globe -->
    <g transform="translate(15, -18)">
      <circle cx="8" cy="8" r="8" fill="#38bdf8" opacity="0.8"/>
      <path d="M4 6 Q 8 2 12 8 Q 8 14 4 6 Z" fill="#10b981" opacity="0.8"/>
      <path d="M2 10 Q 6 12 10 9" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
      <path d="M6 0 L6 16" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M2 16 L14 16" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- Props on Desk: Paper & Rocket Blueprint (Showing big potential/dreams) -->
    <g transform="translate(45, -8)">
      <polygon points="0,8 15,3 25,8 10,13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Tiny rocket drawing on paper -->
      <path d="M10 7 L14 3 L16 6 L12 10 Z" fill="#ef4444"/>
    </g>

    <!-- Pencil Holder with Pens -->
    <g transform="translate(75, -15)">
      <rect x="0" y="0" width="10" height="15" rx="2" fill="#cbd5e1"/>
      <line x1="3" y1="0" x2="1" y2="-6" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="0" x2="8" y2="-8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- POTENTIAL VISUALIZATION: Glowing upward magical stream / imagination particles -->
  <g transform="translate(110, 115)">
    <!-- Light beam from child upward -->
    <path d="M-20 60 L-35 -40 L35 -40 L20 60 Z" fill="url(#beamGrad)" opacity="0.7"/>
    
    <!-- Floating Glowing Icons of Potential (Rocket, Star, Lightbulb, Gear) representing future achievements -->
    <circle cx="0" cy="-20" r="28" fill="url(#potentialGlow)"/>
    
    <!-- Glowing Star -->
    <path d="M0 -45 L3 -35 L12 -35 L5 -29 L8 -20 L0 -25 L-8 -20 L-5 -29 L-12 -35 L-3 -35 Z" fill="#fbbf24" filter="drop-shadow(0px 0px 4px #f59e0b)"/>
    
    <!-- Floating Rocket (Symbolizing great career potential/heights) -->
    <g transform="translate(-18, 5) rotate(-25) scale(0.7)">
      <path d="M0 0 L5 -12 L10 0 L5 -3 Z" fill="#f8fafc"/>
      <polygon points="2,-1 5,-9 8,-1" fill="#ef4444"/>
      <polygon points="0,0 3,-3 0,-5" fill="#cbd5e1"/>
      <polygon points="10,0 7,-3 10,-5" fill="#cbd5e1"/>
      <path d="M3 0 L5 5 L7 0 Z" fill="#fbbf24"/>
    </g>

    <!-- Floating Lightbulb (Creativity/Brilliance) -->
    <g transform="translate(22, 12) rotate(15) scale(0.6)">
      <circle cx="0" cy="-3" r="6" fill="#fbbf24"/>
      <rect x="-2" y="3" width="4" height="4" fill="#94a3b8"/>
      <path d="M-3 9 L3 9" stroke="#94a3b8" stroke-width="2"/>
    </g>
    
    <!-- Sparkles -->
    <circle cx="-10" cy="-5" r="2" fill="#38bdf8"/>
    <circle cx="15" cy="-12" r="1.5" fill="#fbbf24"/>
    <circle cx="-25" cy="25" r="2" fill="#ec4899"/>
    <circle cx="28" cy="30" r="1.5" fill="#10b981"/>
  </g>

  <!-- THE CHILD CHARACTER (Bright, expressive, looking upward with wonder) -->
  <g transform="translate(110, 145)">
    <!-- Chair -->
    <g transform="translate(-15, 0)">
      <rect x="0" y="-35" width="8" height="45" rx="3" fill="#334155"/>
      <rect x="0" y="-15" width="26" height="30" rx="3" fill="#475569"/>
    </g>

    <!-- Child Body & Hoodie (Cheerful Teal/Cyan) -->
    <path d="M-12 15 C-12 5, -8 -5, 0 -8 C8 -5, 12 5, 12 15 Z" fill="#0ea5e9"/>
    <!-- Hoodie Pocket -->
    <path d="M-6 8 Q 0 12 6 8 L 4 15 L -4 15 Z" fill="#0284c7"/>

    <!-- Arms resting/gesturing excitedly -->
    <!-- Left Arm -->
    <path d="M-10 0 C-18 2, -22 10, -25 18" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-26" cy="20" r="3.5" fill="#fcd34d"/> <!-- Hand -->

    <!-- Right Arm (reaching up slightly towards the potential glow) -->
    <path d="M10 0 C18 -2, 22 5, 25 12" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="27" cy="14" r="3.5" fill="#fcd34d"/> <!-- Hand -->

    <!-- Neck -->
    <rect x="-3" y="-12" width="6" height="6" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="0" cy="-22" r="14" fill="#fcd34d"/>

    <!-- Hair (Stylish messy dark brown child hair) -->
    <path d="M-14 -24 C-15 -34, -5 -37, 2 -35 C10 -37, 15 -30, 14 -20 C10 -25, 6 -29, 0 -28 C-6 -29, -11 -26, -14 -24 Z" fill="#451a03"/>
    <path d="M4 -35 C8 -35, 12 -30, 13 -25 C10 -28, 7 -29, 4 -28 Z" fill="#78350f"/>

    <!-- Face Details (Looking up with wide eyes full of potential) -->
    <!-- Eyebrows (slightly raised, curious/amazed) -->
    <path d="M-6 -26 Q -4 -29 -2 -27" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M2 -27 Q 4 -29 6 -26" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes (Big sparkling anime-style eyes) -->
    <circle cx="-4" cy="-22" r="2.5" fill="#1e293b"/>
    <circle cx="4" cy="-22" r="2.5" fill="#1e293b"/>
    <!-- Eye highlights -->
    <circle cx="-5" cy="-23" r="1" fill="#ffffff"/>
    <circle cx="3" cy="-23" r="1" fill="#ffffff"/>

    <!-- Cheeks (Warm blush) -->
    <circle cx="-7" cy="-18" r="2" fill="#f43f5e" opacity="0.4"/>
    <circle cx="7" cy="-18" r="2" fill="#f43f5e" opacity="0.4"/>

    <!-- Smile (Awestruck happy smile) -->
    <path d="M-2 -17 Q 0 -14 2 -17" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ambient Light Particles across the room -->
  <circle cx="70" cy="80" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="170" cy="110" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="40" cy="130" r="1" fill="#ec4899" opacity="0.7"/>
  <circle cx="195" cy="170" r="1.5" fill="#38bdf8" opacity="0.5"/>
</svg>