<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Clinic Interior Elements -->
  <rect x="20" y="180" width="200" height="10" fill="#334155" rx="2"/>
  <circle cx="180" cy="80" r="30" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Doctor Character -->
  <g transform="translate(40, 60)">
    <path d="M20 120 L20 160 M40 120 L40 160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="40" r="20" fill="#fbbf24"/>
    <path d="M10 80 L50 80 L45 120 L15 120 Z" fill="#38bdf8"/>
    <path d="M25 100 L35 100" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Patient Character -->
  <g transform="translate(130, 60)">
    <circle cx="30" cy="40" r="20" fill="#fca5a5"/>
    <path d="M10 80 L50 80 L45 160 L15 160 Z" fill="#e2e8f0"/>
    <path d="M30 160 L20 200 M30 160 L40 200" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <!-- The Pain Spot -->
    <circle cx="30" cy="100" r="8" fill="#ec4899" opacity="0.8">
      <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Doctor Pointing Action -->
  <g transform="translate(75, 90)">
    <path d="M0 0 L35 10" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="12" r="4" fill="#fbbf24"/>
  </g>
  
  <!-- Decorative Ambient Light -->
  <circle cx="200" cy="30" r="40" fill="#fb923c" opacity="0.05"/>
</svg>