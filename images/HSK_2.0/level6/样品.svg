<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow / surface -->
  <ellipse cx="120" cy="180" rx="65" ry="12" fill="#111318"/>
  
  <!-- Open Cardboard Box (The Sample Container) -->
  <!-- Back flaps folded out -->
  <path d="M70 100 L45 75 L75 75 Z" fill="#946b43"/>
  <path d="M170 100 L195 75 L165 75 Z" fill="#b08053"/>
  <path d="M70 100 L120 70 L170 100 L150 105 L120 85 L90 105 Z" fill="#6c4d2d"/>

  <!-- Box Outer Walls -->
  <path d="M70 100 L70 165 L120 185 L170 165 L170 100 L120 120 Z" fill="#c4905d"/>
  
  <!-- Box Left Inner Shadow/Panel -->
  <path d="M70 100 L120 120 L120 185 L70 165 Z" fill="#a4754b"/>
  
  <!-- Box Right Panel -->
  <path d="M120 120 L170 100 L170 165 L120 185 Z" fill="#dbab7c"/>

  <!-- Front flap folded down -->
  <path d="M70 165 L120 195 L170 165 L170 178 L120 208 L70 178 Z" fill="#b08053"/>

  <!-- High-Value Sample Item Emerging (Sleek Modern Product / Device) -->
  <g transform="translate(120, 115)">
    <!-- Glow/Focus effect behind the sample -->
    <circle cx="0" cy="-10" r="35" fill="#f59e0b" opacity="0.15"/>
    
    <!-- Main Product Body (Modern sleek device/tablet mockup) -->
    <rect x="-26" y="-38" width="52" height="68" rx="6" fill="#2d3748" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Screen -->
    <rect x="-21" y="-31" width="42" height="50" rx="3" fill="#1a202c"/>
    <!-- UI graphics on screen -->
    <circle cx="0" cy="-12" r="10" fill="#f59e0b" opacity="0.8"/>
    <rect x="-14" y="6" width="28" height="3" rx="1.5" fill="#4a5568"/>
    <rect x="-10" y="13" width="20" height="3" rx="1.5" fill="#4a5568"/>
    <!-- Home button / indicator -->
    <circle cx="0" cy="24" r="2" fill="#718096"/>
  </g>

  <!-- "SAMPLE" Tag / Golden Star Badge indicating inspection/quality -->
  <g transform="translate(162, 70)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" stroke="#1A1D24" stroke-width="2"/>
    <!-- Star icon inside badge -->
    <path d="M0 -6 L2 -2 L6 -2 L3 1 L4 5 L0 3 L-4 5 L-3 1 L-6 -2 L-2 -2 Z" fill="#1A1D24"/>
  </g>
</svg>