<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environment / Museum Interior -->
  <!-- Back Wall & Architecture Details -->
  <rect x="20" y="20" width="200" height="135" fill="#1e293b"/>
  <!-- Display Arch / Niche in Museum -->
  <path d="M 120 30 Q 150 30 150 60 L 150 135 L 90 135 L 90 60 Q 90 30 120 30 Z" fill="#26354a"/>
  <!-- Exhibit Inside Niche (Dinosaur Skull/Artifact silhouette) -->
  <circle cx="120" cy="70" r="16" fill="#38bdf8" opacity="0.2"/>
  <path d="M 105 85 Q 120 65 135 85 L 130 95 L 110 95 Z" fill="#94a3b8"/>
  <rect x="116" y="95" width="8" height="25" fill="#64748b"/>
  <rect x="105" y="120" width="30" height="6" rx="2" fill="#475569"/>

  <!-- Museum Lighting Accent -->
  <ellipse cx="120" cy="20" rx="40" ry="10" fill="#38bdf8" opacity="0.15"/>
  <path d="M 120 20 L 90 135 L 150 135 Z" fill="#38bdf8" opacity="0.04"/>

  <!-- Floor -->
  <path d="M 0 155 L 240 155 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="155" x2="240" y2="155" stroke="#475569" stroke-width="2"/>
  <!-- Floor Tile Lines (Perspective) -->
  <line x1="120" y1="155" x2="40" y2="240" stroke="#2a3eb1" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="120" y1="155" x2="200" y2="240" stroke="#2a3eb1" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Velvet Ropes / Museum Barriers -->
  <path d="M 20 180 Q 70 170 120 180 Q 170 170 220 180" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="20" cy="180" r="4" fill="#fbbf24"/>
  <circle cx="120" cy="180" r="4" fill="#fbbf24"/>
  <circle cx="220" cy="180" r="4" fill="#fbbf24"/>

  <!-- Characters (Teacher leading Students) -->

  <!-- Teacher (Leading, gesturing towards exhibit, left side) -->
  <g transform="translate(60, 110)">
    <!-- Shadow -->
    <ellipse cx="0" cy="50" rx="12" ry="4" fill="#020617" opacity="0.5"/>
    <!-- Body / Blazer -->
    <path d="M -8 18 L 8 18 L 12 45 L -12 45 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="0" cy="6" r="10" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M -10 3 Q 0 -5 10 3 Q 8 -2 0 -2 Q -8 -2 -10 3 Z" fill="#1e293b"/>
    <!-- Arm gesturing forward -->
    <path d="M 8 22 C 18 22 25 15 28 10" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
    <!-- Hand holding pointer/clipboard -->
    <circle cx="29" cy="9" r="3" fill="#fbcfe8"/>
    <!-- Pointer stick -->
    <line x1="29" y1="9" x2="45" y2="-5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-7" y="45" width="5" height="15" fill="#1e293b"/>
    <rect x="2" y="45" width="5" height="15" fill="#1e293b"/>
    <!-- Scarf / Lanyard detail -->
    <path d="M -4 14 L 0 25 L 4 14" fill="none" stroke="#ec4899" stroke-width="3"/>
  </g>

  <!-- Student 1 (Following closely, holding backpack strap, center) -->
  <g transform="translate(100, 118)">
    <!-- Shadow -->
    <ellipse cx="0" cy="42" rx="10" ry="3" fill="#020617" opacity="0.5"/>
    <!-- Backpack -->
    <rect x="-11" y="18" width="8" height="16" rx="3" fill="#10b981"/>
    <!-- Body -->
    <path d="M -7 15 L 7 15 L 10 38 L -10 38 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="6" r="9" fill="#fed7aa"/>
    <!-- Hair (Cap/Short hair) -->
    <path d="M -9 3 Q 0 -4 9 3 L 9 6 L -9 6 Z" fill="#334155"/>
    <!-- Arms -->
    <path d="M -7 18 L -12 28" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>
    <path d="M 7 18 L 12 28" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-6" y="38" width="4" height="14" fill="#334155"/>
    <rect x="2" y="38" width="4" height="14" fill="#334155"/>
  </g>

  <!-- Student 2 (Curious, pointing up at exhibit, right side) -->
  <g transform="translate(145, 122)">
    <!-- Shadow -->
    <ellipse cx="0" cy="38" rx="10" ry="3" fill="#020617" opacity="0.5"/>
    <!-- Body -->
    <path d="M -7 15 L 7 15 L 9 34 L -9 34 Z" fill="#a855f7"/>
    <!-- Head -->
    <circle cx="0" cy="5" r="9" fill="#fde68a"/>
    <!-- Hair (Pigtails / Ponytail) -->
    <circle cx="-10" cy="3" r="4" fill="#475569"/>
    <circle cx="10" cy="3" r="4" fill="#475569"/>
    <path d="M -9 2 Q 0 -4 9 2 Z" fill="#475569"/>
    <!-- Arm pointing up at museum exhibit -->
    <path d="M 7 18 C 14 10 18 2 22 -4" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-5" y="34" width="4" height="12" fill="#1e293b"/>
    <rect x="1" y="34" width="4" height="12" fill="#1e293b"/>
  </g>

  <!-- Student 3 (Slightly further back, taking notes / holding small book) -->
  <g transform="translate(178, 125)">
    <!-- Shadow -->
    <ellipse cx="0" cy="35" rx="9" ry="3" fill="#020617" opacity="0.5"/>
    <!-- Body -->
    <path d="M -6 14 L 6 14 L 8 32 L -8 32 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="5" r="8" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M -8 3 Q 0 -3 8 3 L 8 5 L -8 5 Z" fill="#0f172a"/>
    <!-- Holding small notebook -->
    <rect x="-2" y="20" width="10" height="8" rx="1" fill="#f8fafc"/>
    <!-- Legs -->
    <rect x="-5" y="32" width="3" height="11" fill="#334155"/>
    <rect x="2" y="32" width="3" height="11" fill="#334155"/>
  </g>

  <!-- Foreground Ambient Sparkles / Warm Museum Ambiance -->
  <circle cx="40" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="85" cy="50" r="1" fill="#38bdf8" opacity="0.8"/>
  <circle cx="200" cy="80" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="160" cy="40" r="1" fill="#f43f5e" opacity="0.5"/>

</svg>