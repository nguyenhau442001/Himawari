<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Doorway Outside Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / INTERIOR -->
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0b1329" />
  <path d="M0 180 L240 180 L250 240 L-10 240 Z" fill="#090e1b" opacity="0.5" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Wall Background -->
  <rect x="15" y="15" width="210" height="165" rx="8" fill="#1e293b" />

  <!-- Hallway / Door Frame (Right Side) -->
  <path d="M160 30 L220 30 L220 180 L160 180 Z" fill="url(#nightSky)" />
  <!-- Outside street light glow -->
  <circle cx="190" cy="100" r="40" fill="#38bdf8" opacity="0.15" filter="url(#dropShadow)" />
  <!-- Door frame structure -->
  <rect x="155" y="25" width="8" height="155" fill="#334155" rx="2" />
  <rect x="218" y="25" width="8" height="155" fill="#334155" rx="2" />
  <rect x="150" y="20" width="76" height="10" fill="#475569" rx="2" />

  <!-- Interior Props: Coat Rack & Plant -->
  <rect x="30" y="45" width="12" height="135" fill="#334155" rx="4" />
  <circle cx="36" cy="45" r="8" fill="#475569" />
  <!-- Umbrella in rack -->
  <path d="M22 100 Q26 130 24 165" stroke="#ec4899" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="24" cy="98" r="4" fill="#ec4899" />
  <!-- Hanging Jacket -->
  <path d="M36 55 C36 55 52 60 55 70 C58 80 50 85 50 85 L36 75 Z" fill="#38bdf8" />
  
  <!-- Warm Indoor Overhead Light Cone -->
  <polygon points="100,15 40,180 160,180" fill="url(#warmGlow)" style="mix-blend-mode: screen;" />

  <!-- CHARACTERS -->
  <!-- 1. Mother (Standing on the left, gesturing with care) -->
  <g id="mother" transform="translate(15, 0)">
    <!-- Mother's Shoes -->
    <ellipse cx="60" cy="180" rx="8" ry="4" fill="#0f172a" />
    
    <!-- Mother's Body / Apron & Dress -->
    <path d="M45 105 Q65 95 75 105 L85 175 L40 175 Z" fill="#475569" />
    <path d="M50 115 L70 115 L75 175 L45 175 Z" fill="#f8fafc" /> <!-- Apron -->
    <path d="M55 115 L65 115 L63 160 L57 160 Z" fill="#cbd5e1" /> <!-- Apron stripe -->

    <!-- Mother's Head & Hair -->
    <circle cx="60" cy="78" r="14" fill="#fcd34d" /> <!-- Face base -->
    <!-- Hair bun & shape -->
    <circle cx="60" cy="68" r="13" fill="#1e293b" />
    <circle cx="71" cy="65" r="5" fill="#1e293b" /> <!-- Bun -->
    <path d="M48 76 C48 68 72 68 72 76 Z" fill="#1e293b" />
    <!-- Facial expression: gentle smile, warm eyes -->
    <path d="M55 78 Q57 76 59 78" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M63 78 Q65 76 67 78" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M58 84 Q60 87 62 84" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Smile -->
    <circle cx="53" cy="81" r="2" fill="#fda4af" opacity="0.6" /> <!-- Blush -->
    <circle cx="69" cy="81" r="2" fill="#fda4af" opacity="0.6" />

    <!-- Mother's Left Arm (Reaching out to adjust collar / gesture "Be careful") -->
    <path d="M50 100 Q40 105 52 115" stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="53" cy="116" r="4" fill="#fcd34d" /> <!-- Hand -->

    <!-- Mother's Right Arm (Down by side) -->
    <path d="M72 100 Q80 120 72 135" stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- 2. Child / Young Adult (Standing ready to leave, holding backpack) -->
  <g id="child" transform="translate(100, 0)">
    <!-- Shoes -->
    <ellipse cx="40" cy="180" rx="9" ry="4" fill="#0f172a" />
    <ellipse cx="62" cy="178" rx="10" ry="4" fill="#0f172a" />

    <!-- Legs & Pants -->
    <path d="M35 130 L38 180 L46 180 L44 130 Z" fill="#334155" />
    <path d="M55 130 L62 178 L70 176 L63 130 Z" fill="#334155" />

    <!-- Torso & Jacket -->
    <path d="M30 95 Q50 90 70 95 L65 140 L35 140 Z" fill="#10b981" />
    <!-- Zipper -->
    <line x1="50" y1="95" x2="50" y2="140" stroke="#047857" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Backpack Straps & Pack (visible over shoulder) -->
    <path d="M33 100 L23 115 L28 145 L38 135 Z" fill="#f97316" /> <!-- Side of backpack -->
    <path d="M32 98 Q40 98 45 105" stroke="#c2410c" stroke-width="3" fill="none" />

    <!-- Head & Hair (Slightly turned toward mother) -->
    <circle cx="50" cy="72" r="13" fill="#fcd34d" />
    <!-- Stylish Short Hair -->
    <path d="M37 72 C37 58 63 58 63 72 C63 72 65 64 58 60 C50 56 42 60 38 66 Z" fill="#0f172a" />
    <!-- Face features: attentive listening -->
    <circle cx="45" cy="73" r="1.5" fill="#1e293b" />
    <circle cx="55" cy="73" r="1.5" fill="#1e293b" />
    <!-- Listening smile -->
    <path d="M48 78 Q50 80 52 78" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Arms -->
    <!-- Left arm holding backpack strap -->
    <path d="M35 100 Q28 115 33 125" stroke="#10b981" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Right arm relaxed -->
    <path d="M65 100 Q72 120 68 135" stroke="#10b981" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="68" cy="137" r="3.5" fill="#fcd34d" /> <!-- Hand -->
  </g>

  <!-- FOREGROUND PROPS & ATMOSPHERE -->
  <!-- Small wooden floor mat / rug -->
  <ellipse cx="120" cy="182" rx="45" ry="8" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="182" rx="40" ry="6" fill="#475569" opacity="0.6" />

  <!-- Action / Care Particles (Visualizing "叮嘱" - words of advice floating softly) -->
  <g opacity="0.85" filter="url(#dropShadow)">
    <!-- Soft glowing warmth sparks representing gentle instruction / reminders -->
    <path d="M78 90 Q83 85 88 92 Q83 95 78 90 Z" fill="#fbbf24" opacity="0.8" />
    <circle cx="95" cy="82" r="3" fill="#f59e0b" />
    <circle cx="88" cy="70" r="2" fill="#fbbf24" />
    
    <path d="M90 78 C92 74 98 75 96 80 C94 85 88 82 90 78 Z" fill="#fcd34d" opacity="0.6" transform="scale(0.7) translate(50, 20)" />
  </g>

  <!-- Key Visual Accent: Scarf on Child (adds preparation for going out "on the road") -->
  <path d="M42 85 Q50 92 58 85 Q54 96 46 96 Z" fill="#ec4899" />
  <path d="M52 92 Q58 105 55 115" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Lighting overlay for depth and cozy vector aesthetic -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>