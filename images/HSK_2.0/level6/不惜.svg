<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Rainy street at night -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <circle cx="180" cy="60" r="25" fill="#fbbf24" opacity="0.3"/>
  <circle cx="180" cy="60" r="15" fill="#f59e0b"/>
  
  <!-- Character 1 (The helper): Giving his coat to the friend -->
  <g transform="translate(80, 100)">
    <path d="M20 30 Q20 10 40 10 L60 10 Q80 10 80 30 L80 100 L20 100 Z" fill="#38bdf8"/>
    <circle cx="50" cy="20" r="15" fill="#fde68a"/>
    <path d="M35 80 L30 120 M65 80 L70 120" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M40 40 L20 60 M60 40 L80 60" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (The friend in need): Receiving help -->
  <g transform="translate(120, 120)">
    <path d="M20 10 L60 10 L55 90 L25 90 Z" fill="#ec4899"/>
    <circle cx="40" cy="0" r="12" fill="#fde68a"/>
    <path d="M30 30 L10 50 M50 30 L70 50" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- The "Cost" - Money/Resources being handed over -->
  <rect x="100" y="140" width="20" height="12" rx="2" fill="#10b981"/>
  <rect x="105" y="143" width="10" height="6" rx="1" fill="#065f46"/>
  
  <!-- Rain effect -->
  <line x1="20" y1="0" x2="10" y2="20" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="0" x2="90" y2="30" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="0" x2="190" y2="40" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="20" x2="40" y2="50" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
  <line x1="150" y1="10" x2="140" y2="40" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
</svg>