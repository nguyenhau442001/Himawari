<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Street Lamp Glow -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Police Car Light (Top) -->
  <rect x="110" y="100" width="20" height="8" rx="2" fill="#ec4899"/>
  <rect x="110" y="108" width="20" height="8" rx="2" fill="#38bdf8"/>
  
  <!-- The "Subject" (The man being taken) -->
  <g transform="translate(80, 120)">
    <circle cx="20" cy="20" r="12" fill="#fcd34d"/>
    <path d="M10 40 L15 80 M30 40 L35 80 M15 50 L25 50" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <rect x="10" y="32" width="20" height="20" rx="4" fill="#fb923c"/>
  </g>
  
  <!-- Police Officer -->
  <g transform="translate(140, 110)">
    <circle cx="20" cy="20" r="12" fill="#94a3b8"/>
    <path d="M20 32 L20 85" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 40 L35 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="32" width="20" height="20" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Street Context -->
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="4"/>
  <rect x="20" y="210" width="40" height="10" fill="#475569"/>
  <rect x="180" y="210" width="40" height="10" fill="#475569"/>
  
  <!-- Handcuff detail -->
  <circle cx="115" cy="150" r="5" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <circle cx="125" cy="150" r="5" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <path d="M120 150 L120 150" stroke="#e2e8f0" stroke-width="2"/>
</svg>