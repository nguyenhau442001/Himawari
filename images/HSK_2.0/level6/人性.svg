<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Reading Lamp Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.6" fx="0.5" fy="0.3">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Highlight Gradient -->
    <linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Abstract Narrative Concept Art (Humanity / Inner Reflection) -->
    <linearGradient id="soul-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="window-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light Effects -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" pointer-events="none"/>

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Bookshelf Background -->
  <g fill="#334155" opacity="0.6">
    <rect x="20" y="40" width="45" height="110" rx="4"/>
    <rect x="175" y="30" width="45" height="120" rx="4"/>
  </g>
  <!-- Shelf lines -->
  <rect x="15" y="75" width="55" height="4" fill="#475569" rx="2"/>
  <rect x="15" y="115" width="55" height="4" fill="#475569" rx="2"/>
  <rect x="170" y="70" width="55" height="4" fill="#475569" rx="2"/>
  <rect x="170" y="110" width="55" height="4" fill="#475569" rx="2"/>
  
  <!-- Colorful Books on Shelves -->
  <path d="M25 55 h8 v20 h-8 z" fill="#f43f5e"/>
  <path d="M35 52 h6 v23 h-6 z" fill="#38bdf8"/>
  <path d="M44 58 h10 v17 h-10 z" fill="#10b981"/>
  <path d="M180 45 h7 v25 h-7 z" fill="#fb923c"/>
  <path d="M189 48 h9 v22 h-9 z" fill="#a855f7"/>
  <path d="M180 85 h8 v25 h-8 z" fill="#38bdf8"/>
  <path d="M190 90 h12 v20 h-12 z" fill="#f43f5e"/>

  <!-- Window with Night Cityscape -->
  <rect x="95" y="30" width="50" height="75" rx="6" fill="url(#window-glow)" stroke="#475569" stroke-width="2"/>
  <!-- City Buildings Silhouette & Lights -->
  <path d="M100 80 h8 v25 h-8 z M112 70 h10 v35 h-10 z M124 75 h9 v30 h-9 z M135 65 h7 v40 h-7 z" fill="#1e293b"/>
  <rect x="115" y="75" width="2" height="3" fill="#fbbf24" opacity="0.8"/>
  <rect x="119" y="85" width="2" height="3" fill="#fbbf24" opacity="0.6"/>
  <rect x="127" y="80" width="2" height="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="138" y="72" width="2" height="4" fill="#fbbf24" opacity="0.9"/>

  <!-- Warm Reading Desk -->
  <path d="M30 175 L210 175 L200 205 L40 205 Z" fill="#334155"/>
  <rect x="35" y="170" width="170" height="8" rx="3" fill="#475569"/>

  <!-- Desk Lamp -->
  <path d="M75 170 L80 120 L95 120 L90 170 Z" fill="#64748b"/>
  <path d="M70 120 C70 100 100 100 100 120 Z" fill="#f59e0b"/>
  <!-- Light cone from desk lamp -->
  <path d="M70 125 L30 205 L130 205 Z" fill="#fbbf24" opacity="0.12" pointer-events="none"/>

  <!-- THE NOVEL / BOOK (Deeply Explored Subject) -->
  <g transform="translate(95, 155)">
    <!-- Open Book Base -->
    <path d="M-30 25 C-15 20 0 25 25 25 C10 10 0 0 -30 0 C-15 10 -30 25 -30 25 Z" fill="#e2e8f0"/>
    <path d="M30 25 C15 20 0 25 -25 25 C-10 10 0 0 30 0 C15 10 30 25 30 25 Z" fill="#f8fafc"/>
    <!-- Book Spine center -->
    <line x1="0" y1="0" x2="0" y2="25" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Abstract pages lines (simulating text/story) -->
    <path d="M-22 8 L-8 12 M-20 13 L-10 16 M-23 18 L-12 21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8 8 L22 12 M10 13 L20 16 M12 18 L23 21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- MAGICAL / CONCEPTUAL NARRATIVE VISUALIZATION ("Exploring Human Nature / Humanity") -->
  <!-- Floating ethereal aura rising from the book representing deep psychological insight and human emotions -->
  <ellipse cx="110" cy="110" rx="35" ry="35" fill="url(#soul-glow)"/>
  
  <!-- Interlinked abstract nodes/forms representing human connections, emotions, and depths -->
  <g transform="translate(110, 105)" opacity="0.85">
    <!-- Heart/Mind symbol abstract -->
    <path d="M0 -12 C-10 -22 -25 -10 -15 3 C-5 12 0 18 0 18 C0 18 5 12 15 3 C25 -10 10 -22 0 -12 Z" fill="#fb7185" opacity="0.8"/>
    <!-- Orbiting empathy / thought rings -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.5"/>
    
    <!-- Glowing floating particles of realization -->
    <circle cx="-25" cy="-10" r="2.5" fill="#38bdf8"/>
    <circle cx="28" cy="8" r="2" fill="#fbbf24"/>
    <circle cx="15" cy="-25" r="1.5" fill="#a78bfa"/>
    <circle cx="-12" cy="22" r="2" fill="#34d399"/>
  </g>

  <!-- MAIN CHARACTER: Deeply engaged reader / scholar -->
  <g id="character">
    <!-- Character Torso & Hoodie -->
    <path d="M70 210 C70 185 85 170 110 170 C135 170 150 185 150 210 Z" fill="#0284c7"/>
    <!-- Hoodie Strings / Collar Detail -->
    <path d="M95 170 L98 190 M125 170 L122 190" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>

    <!-- Character Neck -->
    <rect x="100" y="152" width="20" height="20" fill="url(#skin-grad)" rx="4"/>

    <!-- Character Head -->
    <circle cx="110" cy="135" r="22" fill="url(#skin-grad)"/>

    <!-- Hair (Thoughtful, neat modern cut) -->
    <path d="M88 130 C88 115 100 110 110 110 C125 110 132 120 132 135 C132 140 130 142 130 142 C130 142 126 125 110 120 C96 115 90 128 88 130 Z" fill="#0f172a"/>

    <!-- Thoughtful Face Profile & Expression (Gazing intently at the book/magical aura) -->
    <!-- Eyeglasses (Intellectual touch) -->
    <rect x="98" y="127" width="11" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="113" y="127" width="11" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="109" y1="131" x2="113" y2="131" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Gentle, absorbed facial expression (subtle focused mouth) -->
    <path d="M112 145 Q116 148 120 145" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Active Hands resting near the book -->
    <circle cx="90" cy="165" r="7" fill="url(#skin-grad)"/>
    <circle cx="130" cy="165" r="7" fill="url(#skin-grad)"/>
  </g>

  <!-- Foreground Atmospheric Elements (Depth of Field) -->
  <!-- Floating dust motes caught in the lamp light -->
  <circle cx="50" cy="140" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="65" cy="115" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="160" cy="130" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="175" cy="150" r="1" fill="#fbbf24" opacity="0.7"/>

  <!-- Ambient vignette border styling -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>