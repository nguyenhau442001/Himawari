<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Environment -->
  <rect x="20" y="140" width="200" height="80" rx="4" fill="#334155"/>
  <rect x="30" y="150" width="180" height="10" rx="2" fill="#475569"/>
  <circle cx="180" cy="190" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- The Subject (Sneaking away) -->
  <g transform="translate(130, 100)">
    <!-- Body -->
    <path d="M20 120 L50 120 L45 70 L25 70 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="35" cy="55" r="15" fill="#fde68a"/>
    <!-- Eye (Looking back) -->
    <circle cx="42" cy="52" r="2" fill="#0f172a"/>
    <!-- Arm reaching back -->
    <path d="M25 80 L10 95" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <!-- Leg in motion -->
    <path d="M30 120 L20 140" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 120 L50 140" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Distraction/Context: Boss/Colleague at desk -->
  <g transform="translate(40, 110)">
    <rect x="0" y="40" width="40" height="60" rx="5" fill="#94a3b8"/>
    <circle cx="20" cy="30" r="12" fill="#fde68a"/>
    <rect x="10" y="50" width="20" height="5" fill="#38bdf8"/>
  </g>

  <!-- Motion lines for sneaking -->
  <path d="M100 130 Q110 120 120 130" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M90 140 Q100 130 110 140" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Doorway/Exit -->
  <rect x="180" y="60" width="40" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="190" cy="120" r="3" fill="#fbbf24"/>
</svg>