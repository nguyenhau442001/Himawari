<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Iceberg base -->
  <path d="M20 240 L100 160 L180 240 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M60 240 L140 140 L220 240 Z" fill="#e0f2fe" opacity="0.8"/>
  
  <!-- Polar Bear -->
  <g transform="translate(80, 130)">
    <!-- Body -->
    <ellipse cx="60" cy="60" rx="40" ry="30" fill="#f1f5f9"/>
    <!-- Head -->
    <circle cx="90" cy="40" r="20" fill="#f1f5f9"/>
    <!-- Ears -->
    <circle cx="80" cy="25" r="5" fill="#f1f5f9"/>
    <circle cx="100" cy="25" r="5" fill="#f1f5f9"/>
    <!-- Nose -->
    <ellipse cx="105" cy="42" r="4" ry="3" fill="#0f172a"/>
    <!-- Eye -->
    <circle cx="95" cy="35" r="2" fill="#0f172a"/>
    <!-- Leg -->
    <rect x="40" y="80" width="10" height="20" rx="5" fill="#f1f5f9"/>
    <rect x="70" y="80" width="10" height="20" rx="5" fill="#f1f5f9"/>
  </g>
  
  <!-- Northern Lights / Atmosphere -->
  <path d="M0 50 Q 60 20, 120 50 T 240 50" stroke="#10b981" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M0 70 Q 60 40, 120 70 T 240 70" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Stars -->
  <circle cx="30" cy="30" r="1.5" fill="#fbbf24"/>
  <circle cx="200" cy="40" r="1" fill="#fbbf24"/>
  <circle cx="150" cy="20" r="1.5" fill="#fbbf24"/>
  <circle cx="50" cy="100" r="1" fill="#fbbf24"/>
  
  <!-- Snowflakes -->
  <path d="M180 80 L184 84 M184 80 L180 84" stroke="#e0f2fe" stroke-width="1"/>
  <path d="M40 150 L44 154 M44 150 L40 154" stroke="#e0f2fe" stroke-width="1"/>
</svg>