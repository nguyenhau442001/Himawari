<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Shop Glow -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" opacity="0.8"/>
  <circle cx="120" cy="110" r="60" fill="#3b82f6" opacity="0.1"/>

  <!-- Shelf & Shop Interior Background -->
  <!-- Back Wall -->
  <rect x="30" y="40" width="180" height="120" rx="4" fill="#1e293b"/>
  <!-- Shelf 1 -->
  <rect x="40" y="70" width="160" height="6" rx="2" fill="#334155"/>
  <!-- Shelf Items (Potted plant, jar, books) -->
  <path d="M55 70 L55 55 C55 52 65 52 65 55 L65 70 Z" fill="#10b981"/>
  <circle cx="60" cy="50" r="8" fill="#34d399"/>
  <rect x="80" y="52" width="14" height="18" rx="2" fill="#f43f5e"/>
  <rect x="96" y="55" width="12" height="15" rx="2" fill="#fbbf24"/>
  
  <!-- Counter Top -->
  <path d="M20 160 L220 160 L210 205 L30 205 Z" fill="#334155"/>
  <rect x="20" y="154" width="200" height="8" rx="2" fill="#475569"/>

  <!-- Character 1: Shopkeeper / Merchant (Friendly, pointing at item with a fair price) -->
  <g transform="translate(150, 95)">
    <!-- Body -->
    <path d="M15 50 L45 50 L55 110 L5 110 Z" fill="#0ea5e9"/>
    <!-- Head -->
    <circle cx="30" cy="24" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M16 22 C16 12 44 12 44 22 C40 17 20 17 16 22 Z" fill="#451a03"/>
    <!-- Apron -->
    <path d="M20 50 L40 50 L42 110 L18 110 Z" fill="#f8fafc"/>
    <!-- Smiling Face (implied profile/semi-profile) -->
    <circle cx="36" cy="24" r="1.5" fill="#1e293b"/>
    <path d="M35 30 Q38 33 41 30" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Pointing Arm gesturing to the item -->
    <path d="M15 55 Q-5 60 -10 45" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 2: Customer (Delighted, holding hands up approvingly) -->
  <g transform="translate(45, 90)">
    <!-- Body -->
    <path d="M10 55 L45 55 L50 115 L5 115 Z" fill="#8b5cf6"/>
    <!-- Head -->
    <circle cx="28" cy="24" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M14 22 C14 10 42 10 42 22 C38 15 18 15 14 22 Z" fill="#1e293b"/>
    <!-- Happy Face -->
    <circle cx="24" cy="24" r="1.5" fill="#1e293b"/>
    <circle cx="32" cy="24" r="1.5" fill="#1e293b"/>
    <path d="M25 29 Q28 32 31 29" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Raised Happy Arms -->
    <path d="M12 55 Q0 35 10 25" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M42 55 Q55 35 45 25" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Centerpiece: The Item (Fruit basket or nice merchandise on the counter representing the "price") -->
  <g transform="translate(100, 135)">
    <!-- Basket/Base -->
    <path d="M5 20 L25 20 L22 35 L8 35 Z" fill="#d97706"/>
    <!-- Fruits (Apples / Oranges) -->
    <circle cx="11" cy="14" r="8" fill="#ef4444"/>
    <circle cx="19" cy="12" r="9" fill="#f97316"/>
    <circle cx="15" cy="5" r="7" fill="#fbbf24"/>
  </g>

  <!-- Price Tag Prop (Floating slightly above the item, displaying clear fair value vibe) -->
  <g transform="translate(102, 105)">
    <!-- Tag Background -->
    <path d="M0 10 L10 0 L32 0 L32 20 L10 20 Z" fill="#fbbf24"/>
    <!-- Hole in Tag -->
    <circle cx="6" cy="10" r="2" fill="#0f172a"/>
    <!-- Checkmark icon inside tag symbolizing "fair/good value" -->
    <path d="M14 10 L18 14 L26 6" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Tag String -->
    <path d="M0 10 Q-8 5 -12 25" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Sparkles / Positive Feedback Stars -->
  <g fill="#38bdf8">
    <path d="M 35 70 Q 35 75 40 75 Q 35 75 35 80 Q 35 75 30 75 Q 35 75 35 70" />
    <path d="M 205 85 Q 205 89 209 89 Q 205 89 205 93 Q 205 89 201 89 Q 205 89 205 85" fill="#fbbf24" />
    <path d="M 120 45 Q 120 50 125 50 Q 120 50 120 55 Q 120 50 115 50 Q 120 50 120 45" fill="#34d399" />
  </g>

</svg>