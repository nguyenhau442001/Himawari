<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Room elements (floor, wall) -->
  <rect x="0" y="160" width="240" height="80" fill="#2d3a4b"/> <!-- Floor -->
  <rect x="0" y="0" width="240" height="160" fill="#243040"/> <!-- Wall -->

  <!-- Window in background -->
  <rect x="160" y="40" width="60" height="80" rx="8" fill="#38455a"/>
  <rect x="165" y="45" width="50" height="70" rx="6" fill="#1e293b"/> <!-- Window pane -->
  <circle cx="190" cy="80" r="15" fill="#f59e0b" opacity="0.2"/> <!-- Subtle glow outside -->

  <!-- Couch -->
  <rect x="30" y="130" width="180" height="70" rx="10" fill="#4a5d7a"/> <!-- Couch base -->
  <rect x="35" y="120" width="170" height="40" rx="8" fill="#5a6e8c"/> <!-- Couch backrest -->
  <rect x="40" y="150" width="160" height="40" rx="8" fill="#4a5d7a"/> <!-- Couch seat -->

  <!-- Character -->
  <!-- Head -->
  <circle cx="120" cy="90" r="25" fill="#fbbf24"/> <!-- Skin tone -->

  <!-- Hair -->
  <path d="M100 65 C90 50, 150 50, 140 65 L140 90 C140 105, 100 105, 100 90 Z" fill="#38455a"/>

  <!-- Neck -->
  <rect x="115" y="105" width="10" height="10" fill="#fbbf24"/>

  <!-- Body (sweater) -->
  <path d="M100 110 C90 115, 85 130, 85 145 L85 160 C85 170, 155 170, 155 160 L155 145 C155 130, 150 115, 140 110 Z" fill="#7a8ba6"/>

  <!-- Arms -->
  <path d="M90 125 C80 130, 75 140, 75 150 C75 160, 95 165, 100 160" fill="#7a8ba6"/> <!-- Left arm -->
  <path d="M150 125 C160 130, 165 140, 165 150 C165 160, 145 165, 140 160" fill="#7a8ba6"/> <!-- Right arm -->

  <!-- Hands holding phone -->
  <path d="M95 155 C90 160, 90 170, 100 170 C110 170, 110 160, 105 155 Z" fill="#fbbf24"/> <!-- Left hand -->
  <path d="M145 155 C150 160, 150 170, 140 170 C130 170, 130 160, 135 155 Z" fill="#fbbf24"/> <!-- Right hand -->

  <!-- Smartphone -->
  <rect x="100" y="160" width="40" height="60" rx="8" fill="#38455a"/> <!-- Phone body -->
  <rect x="104" y="164" width="32" height="52" rx="4" fill="#10b981"/> <!-- Phone screen (glowing green for news) -->
  <!-- Abstract content on screen -->
  <rect x="108" y="170" width="24" height="4" rx="1" fill="#a7f3d0"/>
  <rect x="108" y="177" width="18" height="4" rx="1" fill="#a7f3d0"/>
  <rect x="108" y="184" width="20" height="4" rx="1" fill="#a7f3d0"/>
  <rect x="108" y="191" width="22" height="4" rx="1" fill="#a7f3d0"/>
  <rect x="108" y="198" width="16" height="4" rx="1" fill="#a7f3d0"/>
  <rect x="108" y="205" width="26" height="4" rx="1" fill="#a7f3d0"/>

  <!-- Face details (surprised expression) -->
  <circle cx="110" cy="85" r="4" fill="#1e293b"/> <!-- Left eye -->
  <circle cx="130" cy="85" r="4" fill="#1e293b"/> <!-- Right eye -->
  <path d="M105 75 Q110 70, 115 75" stroke="#1e293b" stroke-width="2" fill="none"/> <!-- Left eyebrow raised -->
  <path d="M125 75 Q130 70, 135 75" stroke="#1e293b" stroke-width="2" fill="none"/> <!-- Right eyebrow raised -->
  <circle cx="120" cy="100" r="5" fill="#1e293b"/> <!-- Open mouth (O-shape) -->

  <!-- Subtle shadow under the character/couch to ground it -->
  <ellipse cx="120" cy="195" rx="80" ry="10" fill="#1e293b" opacity="0.5"/>
</svg>