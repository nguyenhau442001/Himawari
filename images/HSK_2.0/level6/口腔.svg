<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bathroom Mirror/Cabinet -->
  <rect x="60" y="40" width="120" height="160" rx="10" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="70" y="50" width="100" height="140" rx="5" fill="#e2e8f0" opacity="0.1"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Shoulders -->
    <path d="M30 140 Q80 140 130 140 L130 160 Q80 160 30 160 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="80" cy="80" r="35" fill="#fde68a"/>
    <!-- Eyes -->
    <ellipse cx="68" cy="75" rx="4" ry="5" fill="#1e293b"/>
    <ellipse cx="92" cy="75" rx="4" ry="5" fill="#1e293b"/>
    <!-- Mouth open (focus on oral cavity) -->
    <path d="M70 95 Q80 105 90 95 Q80 98 70 95" fill="#ec4899"/>
    <!-- Toothbrush -->
    <rect x="95" y="90" width="40" height="6" rx="2" fill="#fbbf24"/>
    <rect x="125" y="85" width="10" height="15" rx="2" fill="#ffffff"/>
    <path d="M127 86 L127 99 M130 86 L130 99 M133 86 L133 99" stroke="#38bdf8" stroke-width="1"/>
  </g>
  
  <!-- Sink/Counter -->
  <rect x="20" y="200" width="200" height="40" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Accessories -->
  <circle cx="180" cy="190" r="15" fill="#10b981" opacity="0.6"/>
  <rect x="175" y="170" width="10" height="20" rx="2" fill="#fb923c"/>
  
  <!-- Bubbles/Sparkle -->
  <circle cx="100" cy="110" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="110" cy="105" r="2" fill="#ffffff" opacity="0.6"/>
</svg>