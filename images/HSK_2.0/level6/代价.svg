<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Window Grid & City View silhouette -->
  <path d="M150 30 L210 30 L210 110 L150 110 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M150 70 L210 70 M180 30 L180 110" stroke="#334155" stroke-width="1.5" />
  <!-- City outside window -->
  <rect x="156" y="50" width="8" height="60" fill="#0f172a" opacity="0.6" />
  <rect x="168" y="40" width="12" height="70" fill="#0f172a" opacity="0.6" />
  <rect x="184" y="60" width="10" height="50" fill="#0f172a" opacity="0.6" />
  <rect x="198" y="45" width="8" height="65" fill="#0f172a" opacity="0.6" />
  <polygon points="150,30 180,15 210,30" fill="#334155" />
  <polygon points="155,50 160,45 165,50" fill="#fbbf24" opacity="0.8" />
  <polygon points="172,43 176,38 180,43" fill="#fbbf24" opacity="0.5" />
  
  <!-- Ambient Window Light Cone -->
  <polygon points="150,30 210,30 240,160 120,160" fill="url(#window-glow)" />

  <!-- Bookshelf Background -->
  <rect x="20" y="40" width="45" height="90" fill="#111827" rx="2" />
  <line x1="20" y1="70" x2="65" y2="70" stroke="#374151" stroke-width="2" />
  <line x1="20" y1="100" x2="65" y2="100" stroke="#374151" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="24" y="50" width="6" height="20" fill="#ef4444" rx="1" />
  <rect x="31" y="48" width="8" height="22" fill="#3b82f6" rx="1" />
  <rect x="40" y="53" width="5" height="17" fill="#10b981" rx="1" />
  <rect x="47" y="51" width="7" height="19" fill="#f59e0b" rx="1" />
  <rect x="25" y="78" width="10" height="22" fill="#8b5cf6" rx="1" />
  <rect x="36" y="82" width="6" height="18" fill="#ec4899" rx="1" />

  <!-- Desk Surface -->
  <path d="M10 165 L230 165 L220 185 L20 185 Z" fill="#334155" filter="url(#shadow)" />
  <rect x="10" y="160" width="220" height="8" fill="#475569" rx="2" />

  <!-- Props on Desk -->
  <!-- Laptop (Open, glowing screen showing intense work/stress) -->
  <path d="M130 155 L180 155 L190 162 L120 162 Z" fill="#64748b" />
  <path d="M135 125 L175 125 C177 125 178 126 178 128 L175 156 C175 157 174 158 173 158 L137 158 C136 158 135 157 135 156 L132 128 C132 126 133 125 135 125 Z" fill="#0f172a" />
  <!-- Screen Graphic (red charts representing heavy cost/loss) -->
  <polyline points="140,148 148,140 156,145 164,133 170,137" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="164" cy="133" r="2" fill="#ef4444" />
  <path d="M135 125 L175 125" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

  <!-- Coffee Mug (Empty / knocked over slightly with steam) -->
  <rect x="195" y="142" width="14" height="18" rx="2" fill="#f8fafc" filter="url(#shadow)" />
  <path d="M209 146 C213 146 213 154 209 154" fill="none" stroke="#f8fafc" stroke-width="2" />
  <path d="M198 137 C199 134 197 132 200 128" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Desk Lamp (Providing dramatic rim light) -->
  <path d="M45 160 L55 160 L60 120 L40 120 Z" fill="#475569" />
  <path d="M35 120 C35 105 65 105 65 120 Z" fill="#f59e0b" />
  <ellipse cx="50" cy="120" rx="15" ry="5" fill="#fbbf24" />
  <!-- Lamp light beam ellipse on desk -->
  <ellipse cx="85" cy="162" rx="35" ry="8" fill="url(#lamp-glow)" />

  <!-- Scattered Papers / Files (Representing overwhelming effort) -->
  <polygon points="75,158 105,152 110,163 80,165" fill="#f1f5f9" filter="url(#shadow)" />
  <line x1="82" y1="158" x2="98" y2="155" stroke="#cbd5e1" stroke-width="1" />
  <line x1="83" y1="161" x2="95" y2="158" stroke="#cbd5e1" stroke-width="1" />
  
  <polygon points="100,160 125,155 128,162 103,166" fill="#e2e8f0" opacity="0.9" />

  <!-- MAIN SUBJECT: STRESSED / EXHAUSTED CHARACTER -->
  <!-- Chair Back -->
  <path d="M75 80 L115 80 L120 160 L70 160 Z" fill="#334155" rx="8" filter="url(#shadow)" />
  <path d="M85 90 L105 90 L105 150 L85 150 Z" fill="#1e293b" opacity="0.6" />

  <!-- Character Body (Leaning forward, head in hands - Depicting sacrifice, heavy burden, "paying a huge price") -->
  <!-- Torso & Hooded Sweatshirt / Jacket (Dark, muted blue representing fatigue) -->
  <path d="M70 160 C70 130 90 115 110 115 C130 115 150 130 150 160 Z" fill="#1d4ed8" filter="url(#shadow)" />
  
  <!-- Hoodie Sleeves crossing onto desk -->
  <path d="M80 130 C75 140 85 155 100 155 C115 155 120 140 115 130 Z" fill="#1e40af" />
  <path d="M140 130 C145 140 135 155 120 155 C105 155 100 140 105 130 Z" fill="#1e40af" />

  <!-- Neck -->
  <rect x="98" y="102" width="14" height="20" fill="#fbcfe8" />

  <!-- Head (Bow down in regret/exhaustion) -->
  <ellipse cx="105" cy="100" rx="16" ry="18" fill="#fbcfe8" filter="url(#shadow)" />
  
  <!-- Messy Hair (Dark brown/black) -->
  <path d="M89 98 C88 85 100 80 112 82 C124 84 123 96 123 96 C123 96 116 87 105 87 C94 87 89 98 89 98 Z" fill="#0f172a" />
  
  <!-- Hands clutching head / Face in palms (Expressing deep emotional cost) -->
  <path d="M92 98 C92 90 98 90 100 102 C101 108 94 112 92 108 Z" fill="#fbcfe8" filter="url(#shadow)" />
  <path d="M118 98 C118 90 112 90 110 102 C109 108 116 112 118 108 Z" fill="#fbcfe8" filter="url(#shadow)" />

  <!-- Subtle visual effects of exhaustion/stress: Floating sweat drop or stress lines -->
  <path d="M126 90 C128 94 126 98 124 98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M129 95 C130 97 129 99 128 99" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Foreground Atmospheric Details (Dust motes / dramatic ambiance) -->
  <circle cx="180" cy="100" r="1.5" fill="#fbbf24" opacity="0.4" />
  <circle cx="130" cy="70" r="1" fill="#38bdf8" opacity="0.5" />
  <circle cx="70" cy="110" r="1.5" fill="#fbbf24" opacity="0.3" />
  <circle cx="95" cy="55" r="2" fill="#38bdf8" opacity="0.4" />

  <!-- Vignette frame overlay border stroke for clean vector container finish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>