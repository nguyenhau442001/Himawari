<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Curtain Gradient Left -->
    <linearGradient id="curtainLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Curtain Gradient Right -->
    <linearGradient id="curtainRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Character 1 Skin & Clothes Gradients -->
    <linearGradient id="actor1Shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Shirt -->
    <linearGradient id="actor2Shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    
    <!-- Script / Prop Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Studio / Theater Backwall Details -->
  <g id="backwall">
    <rect x="0" y="0" width="240" height="180" fill="#1e293b" />
    <!-- Brick lines / Studio acoustic panels -->
    <path d="M40,0 L40,180 M80,0 L80,180 M120,0 L120,180 M160,0 L160,180 M200,0 L200,180" stroke="#2b394f" stroke-width="0.8" opacity="0.5"/>
    <path d="M0,40 L240,40 M0,90 L240,90 M0,140 L240,140" stroke="#2b394f" stroke-width="0.8" opacity="0.3"/>
    
    <!-- Lighting Truss at top -->
    <rect x="20" y="10" width="200" height="6" rx="3" fill="#334155" />
    <circle cx="60" cy="13" r="3" fill="#fbbf24" />
    <circle cx="120" cy="13" r="3" fill="#38bdf8" />
    <circle cx="180" cy="13" r="3" fill="#fbbf24" />
  </g>

  <!-- Stage Spotlight Cone -->
  <polygon points="120,0 20,180 220,180" fill="url(#spotlight)" />

  <!-- Stage Floor -->
  <rect x="0" y="175" width="240" height="65" fill="url(#floorGrad)" />
  <!-- Wooden floor planks pattern -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#1e293b" stroke-width="1.5" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#1e293b" stroke-width="1" />
  <line x1="0" y1="220" x2="240" y2="220" stroke="#1e293b" stroke-width="1.5" />
  <path d="M60,175 L40,240 M140,175 L130,240 M190,175 L210,240" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />

  <!-- Props: Microphone Stand & Director Stool -->
  <g id="props">
    <!-- Mic Stand -->
    <line x1="85" y1="120" x2="85" y2="190" stroke="#64748b" stroke-width="2.5" />
    <circle cx="85" cy="120" r="3.5" fill="#94a3b8" />
    <path d="M78,125 Q85,120 92,125" fill="none" stroke="#94a3b8" stroke-width="2" />
    <ellipse cx="85" cy="190" rx="12" ry="4" fill="#475569" />

    <!-- Costume Rack in background left -->
    <path d="M25,140 L25,170 M35,145 L35,170 M20,145 L40,145" stroke="#475569" stroke-width="2" />
    <path d="M15,150 Q27,142 38,150" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path d="M22,153 Q30,146 38,153" fill="none" stroke="#ec4899" stroke-width="3" />
  </g>

  <!-- Side Curtains -->
  <path d="M0,0 L35,0 L20,180 L0,180 Z" fill="url(#curtainLeft)" />
  <path d="M240,0 L205,0 L220,180 L240,180 Z" fill="url(#curtainRight)" />

  <!-- CHARACTER 1: Expressive Actor (Left) - Gesturing dramatically -->
  <g id="actor1" transform="translate(15, 0)">
    <!-- Shadow -->
    <ellipse cx="60" cy="192" rx="14" ry="4" fill="#090d16" opacity="0.6" />

    <!-- Legs & Shoes -->
    <path d="M53,155 L50,188 L43,190" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M67,155 L70,188 L78,190" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Body / Torso (Dynamic lean) -->
    <path d="M48,110 L72,110 L68,158 L52,158 Z" fill="url(#actor1Shirt)" />
    <!-- Collar -->
    <path d="M56,110 L64,110 L60,118 Z" fill="#e0f2fe" />

    <!-- Arms (Expressive rehearsal pose: one arm out, one bent holding script) -->
    <!-- Left Arm outstretched -->
    <path d="M48,115 L25,135" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="23" cy="136" r="3.5" fill="#fbcfe8" />

    <!-- Right Arm holding script book -->
    <path d="M72,115 L92,130" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <circle cx="94" cy="132" r="3.5" fill="#fbcfe8" />

    <!-- Prop: Script Book in hand -->
    <g transform="translate(90, 125) rotate(15)">
      <rect x="0" y="0" width="16" height="12" rx="1" fill="#f8fafc" />
      <line x1="8" y1="0" x2="8" y2="12" stroke="#cbd5e1" stroke-width="1" />
      <line x1="3" y1="3" x2="6" y2="3" stroke="#94a3b8" stroke-width="1" />
      <line x1="3" y1="6" x2="6" y2="6" stroke="#94a3b8" stroke-width="1" />
      <line x1="10" y1="3" x2="13" y2="3" stroke="#94a3b8" stroke-width="1" />
    </g>

    <!-- Head & Hair -->
    <circle cx="60" cy="95" r="14" fill="#fbcfe8" />
    <!-- Hair (Dark, stylized) -->
    <path d="M46,95 C46,83 52,80 60,80 C68,80 74,83 74,95 C74,95 70,88 60,88 C50,88 46,95 46,95 Z" fill="#0f172a" />
    <!-- Face Expression: Singing/Speaking enthusiastically -->
    <path d="M57,98 Q60,105 63,98" fill="#be185d" /> <!-- Open mouth -->
    <circle cx="55" cy="93" r="1.5" fill="#1e293b" />
    <circle cx="65" cy="93" r="1.5" fill="#1e293b" />
    <!-- Blush -->
    <ellipse cx="53" cy="97" rx="2" ry="1" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="67" cy="97" rx="2" ry="1" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- CHARACTER 2: Actress (Right) - Engaging in dialogue scene -->
  <g id="actor2" transform="translate(130, 0)">
    <!-- Shadow -->
    <ellipse cx="50" cy="192" rx="13" ry="4" fill="#090d16" opacity="0.6" />

    <!-- Legs & Shoes -->
    <path d="M44,155 L42,188 L36,190" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56,155 L58,188 L64,190" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dress / Torso -->
    <path d="M38,112 L62,112 L66,160 L34,160 Z" fill="url(#actor2Shirt)" />
    <!-- Belt accent -->
    <rect x="37" y="135" width="26" height="4" rx="2" fill="#fda4af" />

    <!-- Arms (Acting pose: reacting with hands near chest) -->
    <!-- Left Arm -->
    <path d="M38,116 L25,130" fill="none" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="23" cy="132" r="3" fill="#fbcfe8" />

    <!-- Right Arm pointing / gesturing -->
    <path d="M62,116 L76,128" fill="none" stroke="#be185d" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="78" cy="129" r="3" fill="#fbcfe8" />

    <!-- Head & Hair (Ponytail) -->
    <circle cx="50" cy="92" r="13" fill="#fbcfe8" />
    <!-- Hair base & Ponytail -->
    <path d="M38,92 C38,80 44,78 50,78 C58,78 62,82 62,92 C65,90 70,92 72,88 C70,98 62,95 62,95 C62,95 62,98 50,98 C40,98 38,92 38,92 Z" fill="#1e293b" />
    
    <!-- Face Expression: Focused and expressive -->
    <path d="M47,96 Q50,101 53,96" fill="#831843" />
    <circle cx="46" cy="90" r="1.5" fill="#1e293b" />
    <circle cx="54" cy="90" r="1.5" fill="#1e293b" />
    <!-- Eyebrows angled for dramatic acting -->
    <line x1="44" y1="87" x2="48" y2="88" stroke="#1e293b" stroke-width="1" stroke-linecap="round" />
    <line x1="52" y1="88" x2="56" y2="87" stroke="#1e293b" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Rehearsal Director Notes / Floating Musical/Action Sparkles (Visual Narrative Elements) -->
  <g id="sparkles" filter="url(#glow)">
    <!-- Star 1 -->
    <path d="M110,65 L112,70 L117,72 L112,74 L110,79 L108,74 L103,72 L108,70 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Star 2 -->
    <path d="M75,50 L76,53 L79,54 L76,55 L75,58 L74,55 L71,54 L74,53 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Musical Note -->
    <path d="M145,55 L145,42 L153,40 L153,50" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="142" cy="51" r="3" fill="#f43f5e" />
    <circle cx="150" cy="49" r="3" fill="#f43f5e" />
  </g>

  <!-- Foreground Atmospheric Lighting Overlay -->
  <circle cx="120" cy="110" r="90" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.15" />

  <!-- Outer App Border Frame Accent -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>