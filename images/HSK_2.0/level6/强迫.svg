<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 (Pushing) Skin/Cloth gradients -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="resistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light from Lamp -->
  <circle cx="160" cy="80" r="110" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall & Flooring -->
  <rect x="20" y="30" width="200" height="150" rx="8" fill="#1b2a4a" />
  <!-- Window showing night city -->
  <path d="M 35 45 L 85 45 L 85 115 L 35 115 Z" fill="#0b1329" stroke="#334155" stroke-width="2" />
  <rect x="42" y="55" width="12" height="18" rx="2" fill="#fbbf24" opacity="0.6" />
  <rect x="62" y="65" width="14" height="25" rx="2" fill="#38bdf8" opacity="0.4" />
  <rect x="48" y="90" width="10" height="12" rx="1" fill="#fbbf24" opacity="0.3" />
  <!-- Desk Surface -->
  <path d="M 20 180 L 220 180 L 210 165 L 30 165 Z" fill="#334155" />
  <rect x="25" y="180" width="190" height="6" rx="2" fill="#475569" />

  <!-- Desk Props -->
  <!-- Stack of Papers -->
  <rect x="150" y="153" width="35" height="15" rx="1" fill="#cbd5e1" transform="rotate(-5 150 153)" />
  <rect x="148" y="157" width="35" height="15" rx="1" fill="#f8fafc" />
  <!-- Plant Pot -->
  <path d="M 195 150 L 210 150 L 207 165 L 198 165 Z" fill="#64748b" />
  <path d="M 202 150 Q 195 135 190 130 Q 202 140 202 150 Z" fill="#10b981" />
  <path d="M 204 150 Q 212 138 218 135 Q 208 142 204 150 Z" fill="#34d399" />
  <!-- Desk Lamp -->
  <path d="M 165 165 L 175 165 L 172 130 L 168 130 Z" fill="#94a3b8" />
  <path d="M 158 115 Q 170 110 182 120 L 178 128 L 162 128 Z" fill="#fbbf24" />

  <!-- CHARACTERS: "Nobody can force you to do what you don't want to do." -->

  <!-- CHARACTER 2: Sitting person (Resisting / Firm boundary) -->
  <g id="seated-person">
    <!-- Chair -->
    <path d="M 75 125 L 105 125 L 105 170 L 98 170 L 98 135 L 82 135 L 82 170 L 75 170 Z" fill="#475569" />
    <rect x="68" y="100" width="8" height="60" rx="3" fill="#64748b" />

    <!-- Body & Arms (Leaning back slightly, crossed arms/rejecting gesture) -->
    <!-- Torso -->
    <path d="M 75 120 Q 90 115 95 145 L 85 170 L 65 160 Z" fill="url(#resistGrad)" />
    <!-- Head -->
    <circle cx="70" cy="102" r="13" fill="#fed7aa" />
    <!-- Hair (Short modern dark hair) -->
    <path d="M 58 100 Q 60 88 72 88 Q 83 90 82 104 Q 78 98 68 98 Z" fill="#1e1b4b" />
    <!-- Face expression: Determined / Firm -->
    <path d="M 74 103 L 78 103" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" />
    <circle cx="76" cy="107" r="1.5" fill="#1e1b4b" />

    <!-- Hands up in 'Stop / Refuse' gesture -->
    <circle cx="95" cy="132" r="6" fill="#fed7aa" />
    <path d="M 85 135 L 95 132 L 92 145 Z" fill="url(#resistGrad)" />
  </g>

  <!-- CHARACTER 1: Standing person (Attempting to force / Push document or action) -->
  <g id="standing-person">
    <!-- Legs -->
    <rect x="120" y="150" width="8" height="30" fill="#334155" />
    <rect x="135" y="150" width="8" height="30" fill="#1e293b" />
    
    <!-- Torso (Leaning forward aggressively) -->
    <path d="M 115 105 L 140 115 L 132 155 L 112 150 Z" fill="url(#suitGrad)" />

    <!-- Head -->
    <circle cx="125" cy="90" r="13" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 115 88 Q 120 78 132 82 Q 138 88 135 96 Q 128 92 118 94 Z" fill="#0f172a" />
    <!-- Face expression: Demanding / Pressuring -->
    <path d="M 128 89 L 133 91" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Arms pushing forward holding clipboard/paper -->
    <!-- Back Arm -->
    <path d="M 125 115 L 140 130 L 135 135" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Arm & Hand -->
    <path d="M 120 120 L 105 132" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="102" cy="133" r="5" fill="#fbcfe8" />

    <!-- The pushed object (a contract/clipboard being rejected) -->
    <g transform="translate(95, 125) rotate(-15)">
      <rect x="0" y="0" width="18" height="22" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <rect x="3" y="4" width="12" height="2" rx="1" fill="#94a3b8" />
      <rect x="3" y="9" width="8" height="2" rx="1" fill="#94a3b8" />
      <rect x="3" y="14" width="10" height="2" rx="1" fill="#ef4444" /> <!-- Red X mark implied -->
    </g>
  </g>

  <!-- FOREGROUND VIGNETTE & DETAILS -->
  <!-- Subtle floor shadow under furniture -->
  <ellipse cx="90" cy="177" rx="60" ry="5" fill="#020617" opacity="0.4" />
  <ellipse cx="130" cy="180" rx="30" ry="4" fill="#020617" opacity="0.4" />

  <!-- Dramatic boundary line/spark between characters indicating refusal/resistance -->
  <path d="M 98 120 L 93 145" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2,3" opacity="0.8" />
</svg>