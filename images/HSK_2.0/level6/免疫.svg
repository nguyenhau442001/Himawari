<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Medical Room Context -->
  <rect x="30" y="140" width="180" height="60" rx="10" fill="#334155"/>
  <circle cx="100" cy="160" r="15" fill="#475569"/>
  <path d="M95 160h10M100 155v10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Doctor Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40h20l-5 40h-10z" fill="#38bdf8"/>
    <path d="M5 45l-15 10M35 45l15 10" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 80l-5 30M25 80l5 30" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Patient Character -->
  <g transform="translate(60, 90)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40h20l-5 50h-10z" fill="#ec4899"/>
    <path d="M35 50l20 5" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Syringe/Vaccine Action -->
  <g transform="translate(110, 110) rotate(45)">
    <rect x="0" y="-5" width="40" height="10" rx="2" fill="#94a3b8"/>
    <rect x="35" y="-3" width="10" height="6" fill="#fb923c"/>
    <path d="M-5 0h-10" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  
  <!-- Immunity Shield Effect -->
  <path d="M120 40 L160 50 L160 80 C160 100 120 110 120 110 C120 110 80 100 80 80 L80 50 Z" 
        fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
  <circle cx="120" cy="70" r="10" fill="#10b981" opacity="0.3"/>
  <path d="M115 65l10 10M125 65l-10 10" stroke="#10b981" stroke-width="2"/>
</svg>