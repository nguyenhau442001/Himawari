<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6BC0"/>
      <stop offset="100%" stop-color="#3F51B5"/>
    </linearGradient>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Radial Glow Behind Active Slot -->
  <circle cx="96" cy="155" r="45" fill="url(#glow)"/>

  <!-- UI Structure / Panel Board -->
  <rect x="22" y="32" width="126" height="176" rx="16" fill="#212631" stroke="#2C3342" stroke-width="2"/>
  
  <!-- Panel Window Controls -->
  <circle cx="36" cy="46" r="3" fill="#FF5252" opacity="0.8"/>
  <circle cx="46" cy="46" r="3" fill="#FFB020" opacity="0.8"/>
  <circle cx="56" cy="46" r="3" fill="#00E676" opacity="0.8"/>
  <line x1="22" y1="56" x2="148" y2="56" stroke="#2C3342" stroke-width="1.5"/>

  <!-- Pre-arranged Item 1 (Properly Settled) -->
  <rect x="32" y="66" width="106" height="30" rx="8" fill="#2B3240"/>
  <circle cx="46" cy="81" r="7" fill="#00E5FF" fill-opacity="0.2"/>
  <path d="M 42 81 L 45 84 L 50 78" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="58" y="78.5" width="55" height="5" rx="2.5" fill="#4A5568"/>

  <!-- Pre-arranged Item 2 (Properly Settled) -->
  <rect x="32" y="102" width="106" height="30" rx="8" fill="#2B3240"/>
  <circle cx="46" cy="117" r="7" fill="#00E676" fill-opacity="0.2"/>
  <path d="M 42 117 L 45 120 L 50 114" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="58" y="114.5" width="65" height="5" rx="2.5" fill="#4A5568"/>

  <!-- Target Slot Outline (Dashed Gold) -->
  <rect x="32" y="138" width="106" height="34" rx="8" fill="#181C24" stroke="#FFB020" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Foundation Base Item -->
  <rect x="32" y="178" width="106" height="20" rx="6" fill="#252B37" opacity="0.5"/>
  <rect x="42" y="185.5" width="40" height="5" rx="2.5" fill="#384252"/>

  <!-- Precision Alignment Guide Lines -->
  <path d="M 22 155 L 42 155" stroke="#FFB020" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Active Golden Block Being Placed -->
  <g filter="url(#shadow)">
    <rect x="46" y="140" width="100" height="30" rx="8" fill="url(#goldGrad)"/>
    <path d="M 58 155 L 62 159 L 70 151" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="76" y="152.5" width="52" height="5" rx="2.5" fill="#1A1D24" opacity="0.7"/>
  </g>

  <!-- Motion Lines (Action / Sliding Effect) -->
  <path d="M 152 146 L 164 146" stroke="#FFB020" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 155 155 L 168 155" stroke="#FFB020" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 150 163 L 160 163" stroke="#FFB020" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Sparkles of Perfect Fit / Alignment -->
  <path d="M 44 130 L 45.5 133.5 L 49 135 L 45.5 136.5 L 44 140 L 42.5 136.5 L 39 135 L 42.5 133.5 Z" fill="#FFE082"/>
  <path d="M 136 126 L 137 129 L 140 130 L 137 131 L 136 134 L 135 131 L 132 130 L 135 129 Z" fill="#00E5FF"/>
  <path d="M 28 162 L 29 164.5 L 31.5 165.5 L 29 166.5 L 28 169 L 27 166.5 L 24.5 165.5 L 27 164.5 Z" fill="#00E676"/>

  <!-- Character (Human Action) -->
  <!-- Legs -->
  <path d="M 166 160 L 160 198" stroke="#1E2532" stroke-width="8" stroke-linecap="round"/>
  <path d="M 180 160 L 184 198" stroke="#171D27" stroke-width="8" stroke-linecap="round"/>
  <path d="M 152 198 L 164 198" stroke="#0D1117" stroke-width="4" stroke-linecap="round"/>
  <path d="M 176 198 L 188 198" stroke="#0D1117" stroke-width="4" stroke-linecap="round"/>

  <!-- Torso leaning forward -->
  <path d="M 160 118 C 160 110 170 110 180 112 L 186 160 L 162 160 Z" fill="url(#shirtGrad)"/>

  <!-- Head & Hair -->
  <path d="M 170 112 L 170 106" stroke="#FFCC80" stroke-width="5"/>
  <circle cx="174" cy="94" r="12" fill="#FFCC80"/>
  <path d="M 164 92 C 164 82 173 78 181 80 C 186 82 188 88 186 94 C 182 90 174 90 164 92 Z" fill="#2A313A"/>

  <!-- Primary Arm & Hand (Actively Pushing/Placing Block) -->
  <path d="M 166 122 C 146 132 136 142 128 150" stroke="#FFCC80" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 166 122 C 158 126 152 130 148 134" stroke="#3F51B5" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="127" cy="151" r="4" fill="#FFFFCC80"/>

  <!-- Secondary Supporting Arm & Hand -->
  <path d="M 174 125 C 158 140 148 148 138 155" stroke="#FFCC80" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="137" cy="156" r="3.5" fill="#FFCC80"/>
</svg>