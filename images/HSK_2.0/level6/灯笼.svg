<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lantern-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Night sky ambient glow from lanterns -->
  <circle cx="120" cy="110" r="90" fill="url(#lantern-glow)" opacity="0.3"/>
  <circle cx="60" cy="90" r="50" fill="url(#lantern-glow)" opacity="0.2"/>
  <circle cx="180" cy="90" r="50" fill="url(#lantern-glow)" opacity="0.2"/>

  <!-- Traditional Architecture Background (House Exterior / Eaves) -->
  <g id="architecture">
    <!-- Wall -->
    <rect x="40" y="80" width="160" height="130" fill="#090d16" rx="4"/>
    
    <!-- Wooden door frame / panels -->
    <rect x="95" y="110" width="50" height="100" fill="#1e1b18" rx="2"/>
    <path d="M95 130 H145 M95 150 H145 M95 170 H145 M95 190 H145" stroke="#292524" stroke-width="2"/>

    <!-- Roof Eaves (Traditional Curved Roof structure) -->
    <path d="M20 80 Q120 50 220 80 L230 70 Q120 35 10 70 Z" fill="url(#roof-grad)"/>
    <path d="M35 70 Q120 45 205 70 L200 62 Q120 38 40 62 Z" fill="#475569"/>
    
    <!-- Roof Ridge & Decorative elements -->
    <path d="M15 75 L225 75" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Hanging Lanterns (Centerpiece: 灯笼) -->
  <!-- Left Small Lantern -->
  <g id="lantern-left" transform="translate(65, 85)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#78350f" stroke-width="2"/>
    <!-- Glow -->
    <circle cx="0" cy="30" r="20" fill="url(#lantern-glow)" opacity="0.8"/>
    <!-- Top Cap -->
    <path d="M-8 15 L8 15 L5 19 L-5 19 Z" fill="#b45309"/>
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="14" ry="16" fill="url(#lantern-body)"/>
    <!-- Ribs -->
    <path d="M0 14 C-10 20 -10 40 0 46 C10 40 10 20 0 14" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>
    <path d="M-13 30 C-5 32 5 32 13 30" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.4"/>
    <!-- Bottom Cap & Tassel -->
    <path d="M-5 41 L5 41 L3 45 L-3 45 Z" fill="#b45309"/>
    <line x1="0" y1="45" x2="0" y2="60" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M-3 60 L3 60 L0 67 Z" fill="#ef4444"/>
  </g>

  <!-- Right Small Lantern -->
  <g id="lantern-right" transform="translate(175, 85)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#78350f" stroke-width="2"/>
    <!-- Glow -->
    <circle cx="0" cy="30" r="20" fill="url(#lantern-glow)" opacity="0.8"/>
    <!-- Top Cap -->
    <path d="M-8 15 L8 15 L5 19 L-5 19 Z" fill="#b45309"/>
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="14" ry="16" fill="url(#lantern-body)"/>
    <!-- Ribs -->
    <path d="M0 14 C-10 20 -10 40 0 46 C10 40 10 20 0 14" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>
    <path d="M-13 30 C-5 32 5 32 13 30" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.4"/>
    <!-- Bottom Cap & Tassel -->
    <path d="M-5 41 L5 41 L3 45 L-3 45 Z" fill="#b45309"/>
    <line x1="0" y1="45" x2="0" y2="60" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M-3 60 L3 60 L0 67 Z" fill="#ef4444"/>
  </g>

  <!-- Main Center Large Lantern (Focal Point) -->
  <g id="lantern-center" transform="translate(120, 75)">
    <line x1="0" y1="-15" x2="0" y2="8" stroke="#78350f" stroke-width="2.5"/>
    <!-- Intense Glow -->
    <circle cx="0" cy="32" r="32" fill="url(#lantern-glow)"/>
    <!-- Top Cap -->
    <path d="M-12 8 L12 8 L8 14 L-8 14 Z" fill="#d97706"/>
    <circle cx="0" cy="8" r="3" fill="#b45309"/>
    <!-- Body -->
    <ellipse cx="0" cy="32" rx="22" ry="24" fill="url(#lantern-body)"/>
    <!-- Ribs -->
    <path d="M0 8 C-18 16 -18 48 0 56 C18 48 18 16 0 8" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.7"/>
    <path d="M-21 32 C-10 35 10 35 21 32" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.5"/>
    <!-- Bottom Cap & Tassel -->
    <path d="M-8 50 L8 50 L5 56 L-5 56 Z" fill="#d97706"/>
    <line x1="0" y1="56" x2="0" y2="76" stroke="#fbbf24" stroke-width="2"/>
    <rect x="-3" y="76" width="6" height="4" fill="#d97706" rx="1"/>
    <path d="M-5 80 L5 80 L2 96 L-2 96 Z" fill="#ef4444"/>
  </g>

  <!-- Human Character actively hanging/adjusting a lantern -->
  <g id="character-hanging">
    <!-- Character Body (Standing on a small stool or reaching up) -->
    <!-- Legs -->
    <path d="M145 220 L145 190 Q145 175 135 170 L125 165" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M165 220 L165 195 Q165 180 155 175" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <ellipse cx="140" cy="221" rx="8" ry="4" fill="#0f172a"/>
    <ellipse cx="168" cy="221" rx="8" ry="4" fill="#0f172a"/>

    <!-- Torso (Winter outfit - cozy red/orange vest or jacket) -->
    <path d="M130 145 C130 130 170 130 170 145 L165 180 C165 185 135 185 135 180 Z" fill="#f97316"/>
    
    <!-- Left arm reaching up to hold string -->
    <path d="M132 140 Q115 120 105 105" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="103" cy="102" r="5" fill="#fcd34d"/>

    <!-- Right arm supporting/gesturing -->
    <path d="M168 145 Q180 140 175 160" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
    <circle cx="176" cy="164" r="5" fill="#fcd34d"/>

    <!-- Head and Hair -->
    <circle cx="150" cy="115" r="16" fill="#fcd34d"/>
    <!-- Hair style (Cute bob with bangs) -->
    <path d="M134 115 C134 100 166 100 166 115 C166 120 160 120 158 115 C156 108 144 108 142 115 C140 120 134 120 134 115 Z" fill="#1e293b"/>
    <!-- Happy smiling face profile (implied cheek & smile) -->
    <path d="M158 116 Q161 119 157 122" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="154" cy="114" r="1.5" fill="#1e293b"/>
    <!-- Rosy cheek -->
    <circle cx="157" cy="118" r="3" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- Festive atmosphere details: Plum blossom branch at the top corner -->
  <g id="plum-blossoms" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Branch -->
    <path d="M0 30 Q30 15 70 25 M35 22 Q45 35 55 40"/>
    <!-- Blossoms (Pink/White flowers) -->
    <g fill="#f43f5e" stroke="none">
      <circle cx="20" cy="22" r="3"/>
      <circle cx="23" cy="20" r="3"/>
      <circle cx="18" cy="19" r="3"/>
      <circle cx="21" cy="25" r="3"/>
      <circle cx="21" cy="21" r="1.5" fill="#fef08a"/>

      <circle cx="50" cy="28" r="3"/>
      <circle cx="53" cy="26" r="3"/>
      <circle cx="48" cy="25" r="3"/>
      <circle cx="51" cy="31" r="3"/>
      <circle cx="51" cy="27" r="1.5" fill="#fef08a"/>

      <circle cx="65" cy="20" r="2.5"/>
      <circle cx="63" cy="23" r="2.5"/>
      <circle cx="67" cy="22" r="2.5"/>
      <circle cx="65" cy="21" r="1.2" fill="#fef08a"/>
    </g>
  </g>

  <!-- Foreground Floor / Step -->
  <rect x="0" y="220" width="240" height="20" fill="#090d16"/>
  <line x1="0" y1="220" x2="240" y2="220" stroke="#334155" stroke-width="2"/>
</svg>