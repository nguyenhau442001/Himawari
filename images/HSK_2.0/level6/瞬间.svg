<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for modern UI feel -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="50" fill="none" stroke="#2A2F3D" stroke-width="1"/>
  
  <!-- Conceptual Illustration: A precise physical object capturing a frozen instant in time -->
  <!-- Stopwatch / Shutter Hybrid representing "Instant / Khoảnh khắc" -->
  
  <!-- Outer metallic casing -->
  <circle cx="120" cy="125" r="56" fill="#252A37" stroke="#3E475B" stroke-width="4"/>
  <circle cx="120" cy="125" r="48" fill="#151821"/>

  <!-- Top crown/button of stopwatch -->
  <rect x="113" y="58" width="14" height="12" rx="2" fill="#3E475B"/>
  <rect x="117" y="52" width="6" height="8" rx="1" fill="#3E475B"/>

  <!-- Dynamic Speed / Time-slice Arcs (Orange/Gold accent for focus) -->
  <path d="M 70 85 A 58 58 0 0 1 176 74" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M 165 170 A 58 58 0 0 1 65 160" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Clock Tick Marks -->
  <line x1="120" y1="79" x2="120" y2="85" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="165" x2="120" y2="171" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="125" x2="80" y2="125" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="125" x2="166" y2="125" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Camera Shutter / Lightning Slice representing the "flash" of a moment -->
  <!-- Shutter blades forming a sharp geometric focal point -->
  <path d="M 120 125 L 142 103 L 135 98 Z" fill="#F59E0B"/>
  <path d="M 120 125 L 142 147 L 147 140 Z" fill="#D97706"/>
  <path d="M 120 125 L 98 147 L 105 152 Z" fill="#F59E0B"/>
  <path d="M 120 125 L 98 103 L 93 110 Z" fill="#B45309"/>

  <!-- Center pivot point -->
  <circle cx="120" cy="125" r="8" fill="#FFFFFF"/>
  <circle cx="120" cy="125" r="4" fill="#1A1D24"/>

  <!-- Lightning / Spark accent indicating suddenness ("trong tức khắc") -->
  <polygon points="152,65 142,88 155,88 145,110 168,82 153,82" fill="#FACC15" stroke="#1A1D24" stroke-width="1.5"/>

</svg>