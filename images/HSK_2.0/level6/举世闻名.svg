<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Mountains -->
  <path d="M0 180 L40 120 L80 160 L120 100 L160 150 L200 110 L240 180 Z" fill="#334155"/>
  
  <!-- The Great Wall (Segmented) -->
  <path d="M0 180 L60 150 L120 170 L180 140 L240 160" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <path d="M10 175 L20 165 M40 160 L50 150 M80 165 L90 155 M130 160 L140 150 M190 145 L200 135" stroke="#475569" stroke-width="4"/>
  
  <!-- Tourists -->
  <g transform="translate(100, 160)">
    <!-- Person 1 -->
    <circle cx="0" cy="-20" r="8" fill="#fbbf24"/>
    <path d="M-5 -12 L5 -12 L2 -2 L-2 -2 Z" fill="#38bdf8"/>
    <path d="M-2 -2 L-4 15 M2 -2 L4 15" stroke="#38bdf8" stroke-width="3"/>
    <!-- Camera -->
    <rect x="5" y="-15" width="8" height="6" fill="#f8fafc"/>
    <circle cx="9" cy="-12" r="2" fill="#1e293b"/>
  </g>
  
  <g transform="translate(140, 150)">
    <!-- Person 2 -->
    <circle cx="0" cy="-20" r="8" fill="#fb923c"/>
    <path d="M-5 -12 L5 -12 L2 -2 L-2 -2 Z" fill="#ec4899"/>
    <path d="M-2 -2 L-4 15 M2 -2 L4 15" stroke="#ec4899" stroke-width="3"/>
    <!-- Pointing Finger -->
    <path d="M5 -15 L15 -20" stroke="#fb923c" stroke-width="2"/>
  </g>
  
  <!-- Global/Fame Accents -->
  <circle cx="200" cy="40" r="3" fill="#f59e0b"/>
  <circle cx="180" cy="30" r="2" fill="#f59e0b"/>
  <circle cx="210" cy="60" r="4" fill="#f59e0b"/>
  <path d="M200 40 L205 35 M200 40 L205 45 M200 40 L195 35 M200 40 L195 45" stroke="#f59e0b" stroke-width="1"/>
  
  <!-- Decorative Cloud -->
  <path d="M20 50 Q40 40 60 50 T100 50" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>