<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Spotlight from Window -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Character 1 (Apologizer) Shirt Gradient -->
    <linearGradient id="shirt1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Forgiver) Robe/Cardigan Gradient -->
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall & Floor Line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />
  <rect x="0" y="180" width="240" height="60" fill="url(#floorGrad)" />

  <!-- Window with Moonlight/Warm light -->
  <rect x="155" y="30" width="55" height="90" rx="4" fill="#0b1329" stroke="#334155" stroke-width="3" />
  <!-- Window Panes -->
  <line x1="182" y1="30" x2="182" y2="120" stroke="#334155" stroke-width="2" />
  <line x1="155" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="2" />
  <!-- Window Light Beam casting on floor & characters -->
  <polygon points="155,120 210,120 240,180 110,180" fill="url(#windowLight)" />

  <!-- Bookshelf Background Prop -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="45" height="110" fill="#1b263b" rx="2" />
    <!-- Shelves -->
    <line x1="0" y1="35" x2="45" y2="35" stroke="#334155" stroke-width="3" />
    <line x1="0" y1="72" x2="45" y2="72" stroke="#334155" stroke-width="3" />
    <!-- Books -->
    <rect x="6" y="15" width="8" height="20" rx="1" fill="#f43f5e" />
    <rect x="16" y="12" width="10" height="23" rx="1" fill="#3b82f6" />
    <rect x="28" y="18" width="6" height="17" rx="1" fill="#10b981" />
    <rect x="8" y="45" width="12" height="27" rx="1" fill="#fbbf24" />
    <rect x="23" y="50" width="9" height="22" rx="1" fill="#ec4899" />
  </g>

  <!-- Potted Plant Prop -->
  <g transform="translate(185, 135)">
    <!-- Pot -->
    <path d="M5,15 L15,45 L35,45 L45,15 Z" fill="#cbd5e1" />
    <ellipse cx="25" cy="15" rx="20" ry="4" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M25,11 Q10,-5 0,0 Q10,10 25,11 Z" fill="url(#leafGrad)" />
    <path d="M25,11 Q35,-10 50,-5 Q35,5 25,11 Z" fill="url(#leafGrad)" />
    <path d="M25,11 Q20,-18 30,-22 Q30,0 25,11 Z" fill="url(#leafGrad)" />
  </g>

  <!-- CHARACTERS SCENARIO: "请饶恕我的过错" (Seeking and granting forgiveness) -->

  <!-- CHARACTER 2 (The Forgiver / Listener sitting on armchair) -->
  <g id="forgiver" transform="translate(130, 95)">
    <!-- Armchair -->
    <rect x="-10" y="30" width="65" height="60" rx="8" fill="#334155" filter="url(#softShadow)" />
    <rect x="-5" y="25" width="55" height="55" rx="8" fill="#475569" />
    <!-- Armchair Cushion -->
    <rect x="0" y="45" width="45" height="35" rx="6" fill="#64748b" />

    <!-- Body -->
    <path d="M12,40 L35,40 L40,80 L8,80 Z" fill="url(#robeGrad)" />
    
    <!-- Head & Hair -->
    <circle cx="24" cy="22" r="13" fill="#fed7aa" />
    <!-- Gentle Hair Style -->
    <path d="M11,22 Q12,10 24,10 Q37,10 37,22 Q37,16 30,14 Q24,12 17,14 Q11,16 11,22 Z" fill="#334155" />

    <!-- Calm, Forgiving Facial Expression -->
    <!-- Closed/Gentle Soft Eye -->
    <path d="M20,22 Q23,24 26,22" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Warm Soft Smile -->
    <path d="M21,28 Q24,31 27,28" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheek -->
    <circle cx="28" cy="26" r="3" fill="#fca5a5" opacity="0.6" />

    <!-- Reassuring Hand gesture resting/reaching out slightly -->
    <path d="M35,55 Q42,57 38,63" fill="#fed7aa" stroke="#f6ad55" stroke-width="1" />
  </g>


  <!-- CHARACTER 1 (The Apologizer / Bowing in remorse) -->
  <g id="apologizer" transform="translate(65, 105)">
    <!-- Shadow beneath -->
    <ellipse cx="18" cy="78" rx="25" ry="6" fill="#000000" opacity="0.3" />

    <!-- Body bent forward remorsefully -->
    <g transform="translate(0, 10)">
      <!-- Legs kneeling/standing forward -->
      <rect x="5" y="40" width="10" height="30" rx="5" fill="#1e293b" />
      <rect x="22" y="40" width="10" height="30" rx="5" fill="#1e293b" />
      
      <!-- Torso (Leaning forward angle) -->
      <path d="M10,15 L32,22 L25,50 L5,42 Z" fill="url(#shirt1Grad)" filter="url(#softShadow)" />

      <!-- Head bowed down in sincerity -->
      <g transform="translate(32, 12)">
        <circle cx="8" cy="5" r="11" fill="#fde047" /> <!-- Using warm stylized skin tone / blonde-ish hair cap or hair -->
        <circle cx="7" cy="4" r="11" fill="#fed7aa" />
        
        <!-- Neat Brown Hair -->
        <path d="M-2,5 Q0,-5 8,-5 Q18,-5 16,5 Q12,0 8,1 Q4,0 -2,5 Z" fill="#78350f" />

        <!-- Closed concentrated/regretful eyes -->
        <path d="M9,5 L13,7" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
        
        <!-- Slight frown/serious remorse mouth -->
        <path d="M11,10 Q13,9 14,11" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" fill="none" />
        
        <!-- Worried brow -->
        <line x1="8" y1="3" x2="12" y2="4" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />
      </g>

      <!-- Arms outstretched pleadingly towards the other person -->
      <path d="M15,25 Q32,30 38,35" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
      <circle cx="39" cy="36" r="5" fill="#fed7aa" />
    </g>
  </g>

  <!-- EMOTIONAL / ATMOSPHERIC DETAILS -->
  <!-- Floating Warm Heart / Empathy Sparkles (Subtle visual cue of reconciliation, NO text) -->
  <g transform="translate(100, 75)" filter="url(#softShadow)">
    <path d="M0,5 Q-8,-3 -4,-10 Q0,-14 4,-10 Q8,-3 0,5 Z" fill="#f43f5e" opacity="0.85" transform="scale(0.8)" />
  </g>
  <g transform="translate(112, 60)" opacity="0.6">
    <path d="M0,3 Q-5,-2 -2,-7 Q0,-9 2,-7 Q5,-2 0,3 Z" fill="#fb7185" transform="scale(0.5)" />
  </g>
</svg>