<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Bar Gradients representing growth year by year -->
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="windowClip">
      <path d="M 0,0 L 240,0 L 240,240 L 0,240 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office Interior Background Elements -->
  <g opacity="0.4">
    <!-- Window with city view -->
    <rect x="150" y="25" width="65" height="75" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <line x1="182" y1="25" x2="182" y2="100" stroke="#334155" stroke-width="1.5"/>
    <line x1="150" y1="62" x2="215" y2="62" stroke="#334155" stroke-width="1.5"/>
    <!-- City lights outside -->
    <rect x="156" y="40" width="6" height="12" fill="#fbbf24" opacity="0.6"/>
    <rect x="166" y="50" width="6" height="10" fill="#38bdf8" opacity="0.6"/>
    <rect x="189" y="35" width="8" height="20" fill="#f43f5e" opacity="0.5"/>
    <rect x="200" y="45" width="6" height="15" fill="#34d399" opacity="0.6"/>

    <!-- Wall Shelf -->
    <rect x="25" y="30" width="70" height="4" rx="2" fill="#475569"/>
    <!-- Small plant on shelf -->
    <path d="M 45,30 Q 45,20 50,18 Q 55,20 55,30 Z" fill="#34d399"/>
    <path d="M 50,18 Q 42,12 40,15" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 50,18 Q 58,10 60,14" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 46,30 L 54,30 L 52,24 L 48,24 Z" fill="#64748b"/>
  </g>

  <!-- Office Desk & Equipment -->
  <!-- Desk Surface -->
  <path d="M 15,190 L 225,190 L 210,165 L 30,165 Z" fill="#334155"/>
  <rect x="15" y="190" width="210" height="8" rx="2" fill="#475569"/>
  <!-- Desk Legs -->
  <rect x="35" y="198" width="8" height="25" fill="#1e293b"/>
  <rect x="197" y="198" width="8" height="25" fill="#1e293b"/>

  <!-- Laptop on Desk -->
  <path d="M 160,165 L 205,165 L 198,145 L 167,145 Z" fill="#94a3b8"/>
  <path d="M 155,168 L 210,168 L 215,172 L 150,172 Z" fill="#cbd5e1"/>
  <!-- Laptop Screen Mini Growth Chart -->
  <rect x="170" y="148" width="28" height="15" rx="1" fill="#0f172a"/>
  <polyline points="173,160 178,158 184,155 192,150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="135" y="155" width="12" height="14" rx="2" fill="#f8fafc"/>
  <path d="M 147,158 C 151,158 151,165 147,165" stroke="#f8fafc" stroke-width="2" fill="none"/>

  <!-- 3D Growing Sales Bar Chart (The Core Concept: 递增 - Increasing Year by Year) -->
  <g transform="translate(60, 95)">
    <!-- Chart Base Platform -->
    <ellipse cx="45" cy="75" rx="55" ry="15" fill="#0b0f19" opacity="0.5"/>

    <!-- Bar 1 (Lowest - Year 1) -->
    <g>
      <!-- Side/Back face for 3D effect -->
      <path d="M 0,55 L 15,48 L 15,20 L 0,27 Z" fill="#0284c7"/>
      <!-- Front face -->
      <rect x="-15" y="30" width="15" height="25" fill="url(#bar1)" rx="1"/>
      <!-- Top face -->
      <path d="M -15,30 L 0,23 L 15,30 L 0,37 Z" fill="#38bdf8"/>
    </g>

    <!-- Bar 2 (Medium - Year 2) -->
    <g transform="translate(25, -12)">
      <path d="M 0,55 L 15,48 L 15,10 L 0,17 Z" fill="#059669"/>
      <rect x="-15" y="20" width="15" height="35" fill="url(#bar2)" rx="1"/>
      <path d="M -15,20 L 0,13 L 15,20 L 0,27 Z" fill="#34d399"/>
    </g>

    <!-- Bar 3 (High - Year 3) -->
    <g transform="translate(50, -28)">
      <path d="M 0,55 L 15,48 L 15, -2 L 0,5 Z" fill="#d97706"/>
      <rect x="-15" y="8" width="15" height="47" fill="url(#bar3)" rx="1"/>
      <path d="M -15,8 L 0,1 L 15,8 L 0,15 Z" fill="#fbbf24"/>
    </g>

    <!-- Bar 4 (Highest - Year 4 / Current) -->
    <g transform="translate(75, -45)" filter="url(#glow)">
      <path d="M 0,55 L 15,48 L 15, -15 L 0, -8 Z" fill="#be123c"/>
      <rect x="-15" y="-5" width="15" height="60" fill="url(#bar4)" rx="1"/>
      <path d="M -15,-5 L 0,-12 L 15,-5 L 0,2 Z" fill="#f43f5e"/>
      
      <!-- Sparkle on highest bar -->
      <path d="M 0,-20 L 3,-28 L 11,-31 L 3,-34 L 0,-42 L -3,-34 L -11,-31 L -3,-28 Z" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Rising Trend Arrow connecting the bars -->
    <path d="M -7,45 Q 15,30 25,18 T 65,-5 T 82,-28" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="3,3" opacity="0.7"/>
    <!-- Arrow Head -->
    <path d="M 85,-32 L 80,-23 L 78,-29 Z" fill="#ffffff"/>
  </g>

  <!-- Business Character (Excited professional celebrating success) -->
  <g transform="translate(25, 80)">
    <!-- Body / Suit Torso -->
    <path d="M 40,80 Q 40,65 50,55 L 65,55 Q 75,65 75,80 L 70,110 L 45,110 Z" fill="#3b82f6"/>
    <!-- Shirt collar & Tie -->
    <polygon points="50,55 57,68 65,55" fill="#f8fafc"/>
    <polygon points="55,62 59,62 61,85 57,90 53,85" fill="#ef4444"/>

    <!-- Head & Face -->
    <circle cx="58" cy="38" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 42,38 C 42,24 50,20 60,21 C 70,22 74,28 74,36 C 70,32 64,30 58,32 C 50,33 46,35 42,38 Z" fill="#1e293b"/>
    <!-- Happy Expression -->
    <circle cx="53" cy="36" r="1.5" fill="#1e293b"/>
    <circle cx="63" cy="36" r="1.5" fill="#1e293b"/>
    <path d="M 55,42 Q 58,46 61,42" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="51" cy="40" r="2" fill="#f43f5e" opacity="0.4"/>
    <circle cx="65" cy="40" r="2" fill="#f43f5e" opacity="0.4"/>

    <!-- Left Arm (Gesturing upward excitedly toward the chart) -->
    <path d="M 42,60 L 25,45 L 18,50" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Hand -->
    <circle cx="15" cy="52" r="4" fill="#fbcfe8"/>

    <!-- Right Arm (Raised high in celebration) -->
    <path d="M 73,60 L 85,35 L 92,28" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Hand -->
    <circle cx="95" cy="25" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Highlights -->
  <circle cx="185" cy="70" r="50" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="70" cy="150" r="40" fill="#f43f5e" opacity="0.05" filter="url(#glow)"/>
</svg>