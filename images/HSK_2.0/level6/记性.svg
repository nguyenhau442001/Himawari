<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Subtle Interior Wall Gradient & Wallpaper Lines -->
  <rect x="0" y="0" width="240" height="240" fill="url(#bg-gradient)" rx="24"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lamp-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Light from Desk Lamp -->
  <polygon points="120,40 40,210 200,210" fill="url(#lamp-glow)" />

  <!-- Background Environment (Bookshelf & Sticky Notes) -->
  <g opacity="0.4">
    <!-- Shelf -->
    <rect x="30" y="60" width="180" height="6" rx="3" fill="#475569"/>
    <!-- Books on shelf -->
    <rect x="45" y="32" width="14" height="28" rx="2" fill="#38bdf8"/>
    <rect x="62" y="28" width="18" height="32" rx="2" fill="#ec4899"/>
    <rect x="83" y="36" width="10" height="24" rx="2" fill="#10b981"/>
    <rect x="160" y="30" width="16" height="30" rx="2" fill="#f59e0b"/>
    <rect x="179" y="35" width="12" height="25" rx="2" fill="#6366f1"/>
    
    <!-- Cluttered Sticky Notes on Wall (representing forgetfulness/memory reminders) -->
    <rect x="50" y="80" width="22" height="22" rx="2" fill="#fbbf24" transform="rotate(-12 61 91)"/>
    <rect x="80" y="75" width="20" height="25" rx="2" fill="#f43f5e" transform="rotate(8 90 87)"/>
    <rect x="170" y="85" width="24" height="20" rx="2" fill="#38bdf8" transform="rotate(-5 182 95)"/>
  </g>

  <!-- Desk Surface -->
  <rect x="10" y="195" width="220" height="35" fill="url(#desk-grad)" rx="4"/>
  <rect x="10" y="195" width="220" height="6" fill="#475569" rx="2"/>

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M 140 195 L 195 195 L 185 170 L 150 170 Z" fill="#64748b"/>
  <path d="M 143 192 L 192 192 L 183 173 L 152 173 Z" fill="#94a3b8"/>
  <path d="M 130 198 L 205 198 L 210 195 L 125 195 Z" fill="#475569"/>
  <!-- Coffee Mug -->
  <rect x="195" y="172" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M 211 178 C 218 178, 218 188, 211 188" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <!-- Open Notebook -->
  <path d="M 70 180 Q 90 172 110 180 L 110 196 Q 90 188 70 196 Z" fill="#f8fafc"/>
  <path d="M 75 184 L 100 183" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 75 189 L 95 188" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Desk Lamp -->
  <path d="M 40 195 L 45 140 L 50 140" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 32 135 L 58 135 L 50 120 L 40 120 Z" fill="#f59e0b"/>

  <!-- Main Character: Confused/Forgetful Young Man -->
  <g id="character">
    <!-- Torso / Hoodie -->
    <path d="M 85 200 C 85 165, 155 165, 155 200 Z" fill="#3b82f6"/>
    <!-- Hoodie Hood/Collar -->
    <path d="M 100 135 C 100 125, 140 125, 140 135 L 145 155 C 145 160, 95 160, 95 155 Z" fill="#2563eb"/>

    <!-- Neck -->
    <rect x="108" y="122" width="24" height="20" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="120" cy="110" r="28" fill="#fde047"/>

    <!-- Messy Hair -->
    <path d="M 92 110 C 90 90, 110 80, 125 82 C 140 80, 152 95, 148 115 C 145 102, 135 90, 120 92 C 105 90, 95 102, 92 110 Z" fill="#1e293b"/>

    <!-- Face Features: Expressing confusion / poor memory -->
    <!-- Eyebrows (Uneven, puzzled expression) -->
    <path d="M 104 102 L 114 106" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 126 106 L 136 102" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Wide, staring blankly in thought) -->
    <circle cx="109" cy="112" r="3" fill="#1e293b"/>
    <circle cx="131" cy="112" r="3" fill="#1e293b"/>

    <!-- Open "O" mouth (trying to remember, blank expression) -->
    <ellipse cx="120" cy="125" rx="5" ry="6" fill="#1e293b"/>

    <!-- Hand scratching head (classic pose for forgetfulness / "记性不好") -->
    <!-- Arm -->
    <path d="M 145 170 C 160 160, 160 130, 140 115" stroke="#fcd34d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="137" cy="107" r="9" fill="#fcd34d"/>
    <!-- Fingers scratching head -->
    <path d="M 131 102 L 133 98" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    <path d="M 137 100 L 139 96" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>

    <!-- Other arm resting on desk -->
    <path d="M 95 175 L 105 195" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Question Marks / Memory Loss Metaphor -->
  <g fill="#94a3b8" opacity="0.8">
    <!-- Question Mark 1 -->
    <path d="M 155 75 C 155 65, 175 65, 175 78 C 175 88, 165 88, 165 96" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="165" cy="106" r="2.5"/>
    
    <!-- Question Mark 2 (Smaller, floating higher) -->
    <path d="M 90 55 C 90 48, 102 48, 102 57 C 102 63, 96 63, 96 68" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="96" cy="74" r="2"/>
  </g>

</svg>