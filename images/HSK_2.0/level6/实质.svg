<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect behind the core object -->
  <circle cx="120" cy="120" r="60" fill="#FFB703" opacity="0.1" filter="blur(12px)"/>

  <!-- Abstract outer shell / surface layer (representing the superficial layer) -->
  <path d="M120 50 L180 85 L180 155 L120 190 L60 155 L60 85 Z" 
        fill="none" 
        stroke="#334155" 
        stroke-width="3" 
        stroke-dasharray="6 4" 
        opacity="0.6"/>
  
  <path d="M120 65 L165 92 L165 148 L120 175 L75 148 L75 92 Z" 
        fill="#1E293B" 
        stroke="#475569" 
        stroke-width="2" 
        opacity="0.8"/>

  <!-- Central Physical Object: Glowing Crystalline Core (Representing "The Essence" / 实质) -->
  <g transform="translate(120, 120)">
    <!-- Outer facets of the crystal -->
    <polygon points="0,-45 35,-15 0,45 -35,-15" fill="#FB8500" opacity="0.85"/>
    <polygon points="0,-45 -35,-15 -15,-25" fill="#FFB703"/>
    <polygon points="0,-45 35,-15 15,-25" fill="#FFB703"/>
    
    <!-- Left lower facet -->
    <polygon points="-35,-15 0,45 -15,5" fill="#D97706" opacity="0.9"/>
    
    <!-- Right lower facet -->
    <polygon points="35,-15 0,45 15,5" fill="#F59E0B" opacity="0.9"/>

    <!-- Inner glowing diamond structure -->
    <polygon points="0,-25 20,-5 0,30 -20,-5" fill="#FFF" opacity="0.3"/>
    <polygon points="0,-25 0,30 -20,-5" fill="#FFE599" opacity="0.4"/>

    <!-- Core energy rings / focus indicators -->
    <ellipse cx="0" cy="48" rx="22" ry="6" fill="#000" opacity="0.4"/>
  </g>

  <!-- Precision focus / clarity crosshairs -->
  <path d="M120 35 L120 45" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M120 195 L120 205" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35 120 L45 120" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M195 120 L205 120" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floating particles representing revealed truth/essence -->
  <circle cx="85" cy="80" r="2.5" fill="#FFB703"/>
  <circle cx="160" cy="95" r="2" fill="#FFB703" opacity="0.7"/>
  <circle cx="145" cy="165" r="3" fill="#FB8500"/>
  <circle cx="90" cy="150" r="1.5" fill="#FFF" opacity="0.9"/>
</svg>