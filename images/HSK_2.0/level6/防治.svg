<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment (Cozy Wellness Room / Clinic Corner) -->
  <!-- Wall base -->
  <rect x="0" y="0" width="240" height="180" fill="url(#wallGrad)" />
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#090d16" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Ambient Light Glow behind scene -->
  <circle cx="130" cy="100" r="70" fill="url(#glowGrad)" />

  <!-- Shelf with Health Props (Prevention/Treatment concept) -->
  <rect x="150" y="45" width="70" height="6" rx="3" fill="#475569" />
  <!-- Herbal jar / Medicine bottle on shelf -->
  <rect x="165" y="20" width="16" height="25" rx="4" fill="#64748b" />
  <rect x="163" y="17" width="20" height="5" rx="2.5" fill="#94a3b8" />
  <circle cx="173" cy="30" r="4" fill="#38bdf8" />
  <!-- Medical wellness plant on shelf -->
  <path d="M 200 45 Q 200 25 195 20 Q 205 25 200 45 Z" fill="url(#plantGrad)" />

  <!-- Window with subtle outdoors -->
  <rect x="15" y="25" width="45" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <line x1="37.5" y1="25" x2="37.5" y2="90" stroke="#334155" stroke-width="1.5" />
  <line x1="15" y1="57.5" x2="60" y2="57.5" stroke="#334155" stroke-width="1.5" />
  <!-- Sun/nature outside window -->
  <circle cx="37.5" cy="45" r="8" fill="#fbbf24" opacity="0.8" />
  <path d="M 25 80 Q 35 65 45 80 Z" fill="#10b981" opacity="0.6" />

  <!-- Main Table/Desk -->
  <rect x="80" y="150" width="135" height="12" rx="4" fill="#334155" />
  <rect x="95" y="162" width="10" height="25" fill="#1e293b" />
  <rect x="190" y="162" width="10" height="25" fill="#1e293b" />

  <!-- Props on Table: Herbal Tea & Healing Potion (Treatment/Prevention representation) -->
  <!-- Teapot -->
  <path d="M 175 140 C 170 130 160 130 155 140 L 175 140 Z" fill="#cbd5e1" />
  <circle cx="165" cy="143" r="10" fill="#cbd5e1" />
  <path d="M 153 140 C 148 140 148 148 153 150" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Teacup with warm glowing tea -->
  <path d="M 130 140 L 142 140 C 141 150 131 150 130 140 Z" fill="#f1f5f9" />
  <ellipse cx="136" cy="140" rx="6" ry="2" fill="url(#teaGrad)" />
  <!-- Steam from tea -->
  <path d="M 134 133 Q 137 127 134 121" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Secondary Prop: Prevention Shield/Book icon integrated in scene -->
  <g transform="translate(100, 115)">
    <path d="M 12 0 L 24 5 L 24 14 C 24 21 18 26 12 29 C 6 26 0 21 0 14 L 0 5 Z" fill="url(#shieldGrad)" />
    <!-- Medical Cross on Shield -->
    <rect x="10.5" y="8" width="3" height="11" rx="1" fill="#ffffff" />
    <rect x="6.5" y="12" width="11" height="3" rx="1" fill="#ffffff" />
  </g>

  <!-- Character: Active, Healthy Practitioner / Person performing prevention and treatment -->
  <g transform="translate(45, 80)">
    <!-- Body / Torso (Wearing a neat blue wellness tunic/uniform) -->
    <path d="M 25 65 Q 40 55 55 65 L 65 105 L 15 105 Z" fill="#0284c7" />
    <path d="M 30 65 L 40 85 L 50 65" fill="none" stroke="#e0f2fe" stroke-width="2" />

    <!-- Head & Hair -->
    <!-- Hair background layer -->
    <circle cx="40" cy="32" r="18" fill="#1e293b" />
    <!-- Face -->
    <circle cx="40" cy="35" r="15" fill="#fcd34d" />
    <!-- Friendly happy eyes (curves) -->
    <path d="M 33 33 Q 36 36 39 33" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 43 33 Q 46 36 49 33" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Healthy glow) -->
    <circle cx="33" cy="38" r="3" fill="#f87171" opacity="0.6" />
    <circle cx="47" cy="38" r="3" fill="#f87171" opacity="0.6" />
    <!-- Gentle Smile -->
    <path d="M 37 41 Q 40 44 43 41" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Hair stylish cut -->
    <path d="M 25 30 Q 30 15 45 18 Q 55 20 53 35 Z" fill="#334155" />

    <!-- Arms & Active Action (Holding a healthy natural plant / holding up preventive care) -->
    <!-- Back Arm -->
    <path d="M 22 68 Q 10 75 18 85" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Front Arm gesturing positively towards the wellness props -->
    <path d="M 52 68 Q 65 72 60 88" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="60" cy="90" r="5" fill="#fcd34d" />
  </g>

  <!-- Potted Plant on Floor (Completing the lively, natural health-focused environment) -->
  <g transform="translate(18, 145)">
    <!-- Pot -->
    <path d="M 5 15 L 15 35 L 35 35 L 45 15 Z" fill="#f43f5e" />
    <ellipse cx="25" cy="15" rx="20" ry="4" fill="#fb7185" />
    <!-- Plant Stems & Leaves -->
    <path d="M 25 15 Q 25 -5 10 -10" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 25 15 Q 35 0 45 -5" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 25 15 Q 20 5 30 -15" stroke="#059669" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sparkles / Vitality Floating Elements (Representing health, wellness, and good method) -->
  <g fill="#38bdf8">
    <path d="M 115 75 L 117 80 L 122 82 L 117 84 L 115 89 L 113 84 L 108 82 L 113 80 Z" opacity="0.8" />
    <path d="M 75 55 L 76 58 L 79 59 L 76 60 L 75 63 L 74 60 L 71 59 L 74 58 Z" opacity="0.6" transform="scale(0.8) translate(20, 10)" />
  </g>
  <g fill="#10b981">
    <path d="M 145 95 L 146 98 L 149 99 L 146 100 L 145 103 L 144 100 L 141 99 L 144 98 Z" opacity="0.9" />
  </g>

</svg>