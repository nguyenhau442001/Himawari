<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Classroom Background Elements -->
  <rect x="20" y="40" width="200" height="100" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="30" y="50" width="180" height="80" rx="2" fill="#1e293b"/>
  <circle cx="120" cy="90" r="25" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Teacher at board -->
  <path d="M120 70 L120 120 M100 80 L140 80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Student 1 -->
  <g transform="translate(40, 150)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <rect x="10" y="32" width="20" height="40" rx="4" fill="#ec4899"/>
    <path d="M15 20 L25 20" stroke="#0f172a" stroke-width="2"/>
    <circle cx="16" cy="18" r="2" fill="#0f172a"/>
    <circle cx="24" cy="18" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Student 2 -->
  <g transform="translate(100, 150)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <rect x="10" y="32" width="20" height="40" rx="4" fill="#10b981"/>
    <path d="M15 20 L25 20" stroke="#0f172a" stroke-width="2"/>
    <circle cx="16" cy="18" r="2" fill="#0f172a"/>
    <circle cx="24" cy="18" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Student 3 -->
  <g transform="translate(160, 150)">
    <circle cx="20" cy="20" r="12" fill="#38bdf8"/>
    <rect x="10" y="32" width="20" height="40" rx="4" fill="#fb923c"/>
    <path d="M15 20 L25 20" stroke="#0f172a" stroke-width="2"/>
    <circle cx="16" cy="18" r="2" fill="#0f172a"/>
    <circle cx="24" cy="18" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Focus indicators (small glowing dots) -->
  <circle cx="55" cy="165" r="2" fill="#fbbf24"/>
  <circle cx="115" cy="165" r="2" fill="#fbbf24"/>
  <circle cx="175" cy="165" r="2" fill="#fbbf24"/>
  
  <!-- Desk surface -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a"/>
  <rect x="10" y="195" width="220" height="10" rx="2" fill="#334155"/>
</svg>