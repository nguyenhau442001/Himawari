<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Dog Fur Gradients -->
    <linearGradient id="dogBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="dogDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Bone Gradient -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Wooden Floor -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#334155" opacity="0.6" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2" />
  <line x1="40" y1="180" x2="20" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5" />
  <line x1="130" y1="180" x2="110" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5" />
  <line x1="200" y1="180" x2="220" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5" />

  <!-- Cozy Background Wall Decor (Window / Plant) -->
  <!-- Window Frame -->
  <rect x="150" y="40" width="60" height="80" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <line x1="180" y1="40" x2="180" y2="120" stroke="#475569" stroke-width="2" />
  <line x1="150" y1="80" x2="210" y2="80" stroke="#475569" stroke-width="2" />
  <!-- Night Sky Outside Window -->
  <circle cx="165" cy="55" r="2" fill="#f8fafc" opacity="0.8" />
  <circle cx="195" cy="65" r="1.5" fill="#f8fafc" opacity="0.6" />
  <circle cx="175" cy="100" r="1" fill="#f8fafc" opacity="0.5" />

  <!-- Cozy Floor Mat -->
  <ellipse cx="120" cy="195" rx="75" ry="22" fill="#0ea5e9" opacity="0.15" />
  <ellipse cx="120" cy="195" rx="65" ry="17" fill="#38bdf8" opacity="0.2" />

  <!-- Plant Pot in Background -->
  <path d="M 25 150 L 35 150 L 38 175 L 22 175 Z" fill="#64748b" />
  <path d="M 30 150 C 25 130 15 125 15 125 C 15 125 25 140 28 150" fill="#10b981" />
  <path d="M 30 150 C 35 125 45 120 45 120 C 45 120 35 138 32 150" fill="#34d399" />
  <path d="M 30 150 C 20 140 10 145 10 145 C 10 145 22 148 30 150" fill="#059669" />


  <!-- MAIN SUBJECT: THE DOG (Shiba/Friendly Breed) -->
  <g transform="translate(0, 5)">
    <!-- Dog Tail -->
    <path d="M 160 160 Q 185 140 175 120 Q 165 100 150 115" fill="none" stroke="url(#dogBody)" stroke-width="12" stroke-linecap="round" />
    <path d="M 160 160 Q 185 140 175 120 Q 165 100 150 115" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Dog Body / Sitting posture -->
    <path d="M 95 120 C 75 120 65 150 70 175 C 72 185 85 185 90 175 C 98 155 110 155 120 175 C 125 185 138 185 140 175 C 145 140 125 120 95 120 Z" fill="url(#dogBody)" />
    
    <!-- Dog Chest Cream Patch -->
    <path d="M 95 130 C 85 130 80 150 85 170 C 95 170 100 160 105 130 Z" fill="#fffbeb" opacity="0.9" />

    <!-- Dog Hind Legs -->
    <ellipse cx="73" cy="177" rx="10" ry="6" fill="url(#dogDark)" />
    <ellipse cx="137" cy="177" rx="10" ry="6" fill="url(#dogDark)" />

    <!-- Dog Front Legs -->
    <rect x="83" y="145" width="10" height="35" rx="5" fill="url(#dogDark)" />
    <rect x="117" y="145" width="10" height="35" rx="5" fill="url(#dogDark)" />
    <ellipse cx="88" cy="177" rx="5" ry="3" fill="#78350f" />
    <ellipse cx="122" cy="177" rx="5" ry="3" fill="#78350f" />

    <!-- Dog Head -->
    <g transform="translate(100, 95)">
      <!-- Ears -->
      <path d="M -25 -15 L -40 -35 L -15 -25 Z" fill="url(#dogDark)" />
      <path d="M 25 -15 L 40 -35 L 15 -25 Z" fill="url(#dogDark)" />
      <path d="M -23 -18 L -33 -30 L -17 -22 Z" fill="#fed7aa" />
      <path d="M 23 -18 L 33 -30 L 17 -22 Z" fill="#fed7aa" />

      <!-- Head Base Shape -->
      <path d="M -30 -15 C -30 15 -15 25 0 25 C 15 25 30 15 30 -15 C 30 -30 15 -35 0 -35 C -15 -35 -30 -30 -30 -15 Z" fill="url(#dogBody)" />
      
      <!-- Cheeks / Muzzle area (lighter fur) -->
      <path d="M -22 -5 C -22 15 0 22 0 22 C 0 22 22 15 22 -5 C 22 -15 10 -18 0 -18 C -10 -18 -22 -15 -22 -5 Z" fill="#fffbeb" opacity="0.95" />

      <!-- Eyes (Happy/Excited Arcs or dots) -->
      <circle cx="-11" cy="-12" r="3" fill="#0f172a" />
      <circle cx="11" cy="-12" r="3" fill="#0f172a" />
      <!-- Eye Highlights -->
      <circle cx="-12" cy="-13" r="1" fill="#ffffff" />
      <circle cx="10" cy="-13" r="1" fill="#ffffff" />

      <!-- Eyebrows (playful angle) -->
      <path d="M -16 -19 L -7 -17" stroke="#92400e" stroke-width="2" stroke-linecap="round" />
      <path d="M 16 -19 L 7 -17" stroke="#92400e" stroke-width="2" stroke-linecap="round" />

      <!-- Nose -->
      <ellipse cx="0" cy="-3" rx="5" ry="3.5" fill="#0f172a" />
      <ellipse cx="-1" cy="-4" rx="1.5" ry="1" fill="#334155" />

      <!-- Tongue sticking out slightly out of joy -->
      <path d="M -3 3 C -3 9 3 9 3 3 Z" fill="#f43f5e" />
    </g>

    <!-- CRITICAL ACTION: THE BONE HELD IN MOUTH ("叼" - diāo) -->
    <g transform="translate(100, 103) rotate(-15)">
      <!-- Bone Central Shaft -->
      <rect x="-35" y="-7" width="70" height="14" rx="4" fill="url(#boneGrad)" />
      
      <!-- Bone Knobs / Ends (Left) -->
      <circle cx="-33" cy="-11" r="7" fill="url(#boneGrad)" />
      <circle cx="-33" cy="11" r="7" fill="url(#boneGrad)" />
      <rect x="-38" y="-10" width="10" height="20" rx="3" fill="url(#boneGrad)" />

      <!-- Bone Knobs / Ends (Right) -->
      <circle cx="33" cy="-11" r="7" fill="url(#boneGrad)" />
      <circle cx="33" cy="11" r="7" fill="url(#boneGrad)" />
      <rect x="28" y="-10" width="10" height="20" rx="3" fill="url(#boneGrad)" />

      <!-- Subtle Shadow on Bone for Depth -->
      <rect x="-30" y="4" width="60" height="3" fill="#cbd5e1" opacity="0.6" />
    </g>

  </g>

  <!-- FOREGROUND ACCENTS & POLISH -->
  <!-- Sparkles / Joy indicators -->
  <g fill="#fbbf24">
    <path d="M 50 70 L 53 78 L 61 81 L 53 84 L 50 92 L 47 84 L 39 81 L 47 78 Z" opacity="0.8" />
    <path d="M 190 90 L 192 95 L 197 97 L 192 99 L 190 104 L 188 99 L 183 97 L 188 95 Z" transform="scale(0.7) translate(80, 20)" opacity="0.9" />
  </g>

  <!-- Little Paw Print on Floor -->
  <g transform="translate(165, 185) rotate(15)" opacity="0.3">
    <ellipse cx="0" cy="5" rx="5" ry="4" fill="#0f172a" />
    <circle cx="-4" cy="-2" r="2" fill="#0f172a" />
    <circle cx="0" cy="-5" r="2.2" fill="#0f172a" />
    <circle cx="4" cy="-2" r="2" fill="#0f172a" />
  </g>

  <!-- Vignette Border Frame Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>