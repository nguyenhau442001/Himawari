<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#161f38"/>
      <stop offset="100%" stop-color="#221e3b"/>
    </linearGradient>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="36" y="44" width="168" height="110" rx="12"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Stars / Time Particles -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="20" cy="40" r="1.5"/>
    <circle cx="15" cy="90" r="1"/>
    <circle cx="225" cy="50" r="1.5"/>
    <circle cx="215" cy="120" r="1"/>
    <circle cx="45" cy="20" r="1"/>
    <circle cx="190" cy="25" r="1.5"/>
  </g>

  <!-- Cinema / Room Environment -->
  <!-- Floor -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#1e293b" stroke-width="2"/>

  <!-- Cinema Screen / Portal Frame -->
  <!-- Outer glowing frame representing movie screen / space-time gateway -->
  <rect x="32" y="40" width="176" height="118" rx="16" fill="#334155" opacity="0.5"/>
  <rect x="34" y="42" width="172" height="114" rx="14" fill="#0f172a"/>

  <!-- Inside Screen Content (Time-Space Crossing Visuals) -->
  <g clip-path="url(#screenClip)">
    <!-- Nebula background inside screen -->
    <rect x="36" y="44" width="168" height="110" fill="#111827"/>
    <ellipse cx="120" cy="99" rx="80" ry="40" fill="url(#portalGrad)" opacity="0.4"/>
    
    <!-- Time Vortex Swirl Rings -->
    <ellipse cx="120" cy="99" rx="70" ry="25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    <ellipse cx="120" cy="99" rx="50" ry="18" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
    <ellipse cx="120" cy="99" rx="30" ry="10" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>

    <!-- Ancient Monument silhouette on one side, futuristic on other -->
    <!-- Ancient Architecture (Left of portal) -->
    <path d="M45 154 L45 120 L55 120 L55 154 Z" fill="#1e293b"/>
    <path d="M60 154 L60 110 L70 110 L70 154 Z" fill="#1e293b"/>
    <path d="M38 120 L62 105 L86 120 Z" fill="#334155"/>

    <!-- Futuristic Architecture (Right of portal) -->
    <path d="M175 154 L175 95 L190 95 L190 154 Z" fill="#1e293b"/>
    <circle cx="182" cy="85" r="6" fill="#38bdf8" opacity="0.6"/>

    <!-- Central Time-Crossing Beam -->
    <path d="M100 44 L140 44 L160 154 L80 154 Z" fill="url(#beamGrad)"/>

    <!-- Shooting star / time particle -->
    <path d="M60 60 Q 90 80 130 90" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="130" cy="90" r="3" fill="#fbbf24"/>
  </g>

  <!-- Projector Beam Light coming down onto the audience -->
  <polygon points="120,0 0,240 240,240" fill="#38bdf8" opacity="0.03"/>

  <!-- Foreground: Viewer / Character experiencing the movie -->
  <!-- Cinema Chair Back -->
  <rect x="70" y="160" width="100" height="70" rx="12" fill="#1e293b"/>
  <rect x="78" y="168" width="84" height="54" rx="8" fill="#334155"/>

  <!-- Character (Viewer) watching intently -->
  <!-- Head & Hair -->
  <circle cx="120" cy="165" r="22" fill="#fbcfe8"/>
  <path d="M98 165 C98 145 142 145 142 165 C142 170 138 172 135 168 C125 178 115 178 105 168 C102 172 98 170 98 165 Z" fill="#0f172a"/>
  
  <!-- Hoodie / Outfit -->
  <path d="M92 205 C92 185 148 185 148 205 L158 240 L82 240 Z" fill="#6366f1"/>
  <!-- Hoodie Hood folds -->
  <path d="M100 185 L120 198 L140 185" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing effect on character from the portal/screen -->
  <circle cx="120" cy="170" r="25" fill="url(#glowGrad)" style="mix-blend-mode: overlay;" opacity="0.7"/>

  <!-- Popcorn Bucket & Cinema Props on a small ledge/armrest -->
  <g transform="translate(180, 185)">
    <!-- Popcorn Tub -->
    <path d="M2 15 L8 35 L22 35 L28 15 Z" fill="#ef4444"/>
    <path d="M6 15 L10 35 M14 15 L15 35 M22 15 L20 35" stroke="#f87171" stroke-width="2"/>
    <!-- Popcorn puffs -->
    <circle cx="10" cy="11" r="5" fill="#fef08a"/>
    <circle cx="15" cy="9" r="6" fill="#fef08a"/>
    <circle cx="20" cy="12" r="5" fill="#fef08a"/>
    <circle cx="15" cy="6" r="4" fill="#fefef0"/>
  </g>

  <!-- 3D Glasses resting or held / floating dynamic cinematic spark -->
  <g transform="translate(45, 185)">
    <!-- Drink cup with straw -->
    <rect x="2" y="10" width="16" height="25" rx="2" fill="#f8fafc"/>
    <line x1="10" y1="2" x2="6" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 10 Q10 7 20 10" fill="#38bdf8"/>
  </g>

  <!-- Ambient light glowing reflections -->
  <circle cx="120" cy="99" r="86" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <rect x="30" y="38" width="180" height="122" rx="18" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
</svg>