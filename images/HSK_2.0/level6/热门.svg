<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="70" y="45" width="100" height="75" rx="6"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment / Studio Elements -->
  <!-- Ambient light rays / Studio lights -->
  <path d="M50 0 L90 240 L110 240 L80 0 Z" fill="#38bdf8" opacity="0.04"/>
  <path d="M190 0 L150 240 L130 240 L160 0 Z" fill="#ec4899" opacity="0.04"/>

  <!-- Office/Studio Wall Shelf with Props -->
  <rect x="30" y="30" width="60" height="4" rx="2" fill="#475569"/>
  <circle cx="45" cy="24" r="6" fill="#10b981"/>
  <path d="M57 18 L63 30 L51 30 Z" fill="#f59e0b"/>
  
  <!-- Calendar showing 'This Year' concept -->
  <rect x="165" y="25" width="35" height="40" rx="4" fill="#334155"/>
  <rect x="165" y="25" width="35" height="12" rx="4" fill="#ef4444"/>
  <circle cx="175" cy="22" r="2" fill="#cbd5e1"/>
  <circle cx="190" cy="22" r="2" fill="#cbd5e1"/>
  <!-- Abstract mini calendar grid -->
  <rect x="171" y="42" width="7" height="6" rx="1" fill="#94a3b8"/>
  <rect x="182" y="42" width="7" height="6" rx="1" fill="#f59e0b"/>
  <rect x="193" y="42" width="7" height="6" rx="1" fill="#94a3b8"/>
  <rect x="171" y="51" width="7" height="6" rx="1" fill="#94a3b8"/>
  <rect x="182" y="51" width="7" height="6" rx="1" fill="#94a3b8"/>

  <!-- MAIN MONITOR / PRESENTATION SCREEN ("The Topic") -->
  <rect x="65" y="40" width="110" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="70" y="45" width="100" height="75" rx="5" fill="#1e293b"/>
  <!-- Screen Content: Trending / Hot Topic Visualization -->
  <g clip-path="url(#screenClip)">
    <rect x="70" y="45" width="100" height="75" fill="url(#screenGlow)"/>
    
    <!-- Rising trend graph lines -->
    <path d="M 85 100 Q 100 95, 115 80 T 145 60 T 160 50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="50" r="4" fill="#38bdf8"/>
    <circle cx="160" cy="50" r="8" fill="#38bdf8" opacity="0.4"/>

    <!-- Abstract chat bubbles / topic nodes floating on screen -->
    <rect x="80" y="60" width="35" height="20" rx="6" fill="#0284c7" opacity="0.8"/>
    <circle cx="90" cy="70" r="2" fill="#bae6fd"/>
    <circle cx="97" cy="70" r="2" fill="#bae6fd"/>
    <circle cx="104" cy="70" r="2" fill="#bae6fd"/>

    <rect x="120" y="85" width="40" height="22" rx="6" fill="#ec4899" opacity="0.8"/>
    <path d="M130 96 L137 92 L137 100 Z" fill="#fce7f3"/>
    <rect x="141" y="93" width="14" height="3" rx="1.5" fill="#fce7f3"/>
    <rect x="141" y="98" width="10" height="3" rx="1.5" fill="#fce7f3"/>
  </g>

  <!-- Monitor Stand -->
  <path d="M110 125 L130 125 L135 140 L105 140 Z" fill="#475569"/>
  <rect x="90" y="140" width="60" height="6" rx="3" fill="#64748b"/>

  <!-- BIG CENTRAL FIRE / "HOT" SYMBOL overlapping screen base -->
  <g transform="translate(120, 85)">
    <!-- Dynamic flame shapes representing 'Hot / 热门' -->
    <path d="M0 15 C -15 0, -20 -15, -10 -30 C 0 -10, 10 -20, 5 -35 C 20 -20, 25 0, 0 15 Z" fill="url(#fireGrad)"/>
    <path d="M-3 10 C -10 0, -12 -10, -5 -18 C 0 -8, 5 -12, 2 -22 C 10 -12, 12 0, -3 10 Z" fill="#fef08a" opacity="0.8"/>
    <circle cx="0" cy="-5" r="12" fill="#f59e0b" opacity="0.3" filter="blur(4px)"/>
  </g>

  <!-- FOREGROUND DESK & CHARACTERS -->
  <!-- Wooden Desk Surface -->
  <rect x="20" y="180" width="200" height="35" rx="4" fill="#b45309"/>
  <rect x="20" y="175" width="200" height="8" rx="2" fill="#d97706"/>
  <!-- Desk details (Laptop, Coffee cup, Notebook) -->
  <path d="M45 170 L75 170 L80 175 L40 175 Z" fill="#64748b"/> <!-- Mini keyboard/laptop base -->
  <!-- Coffee mug -->
  <rect x="180" y="155" width="14" height="20" rx="3" fill="#f8fafc"/>
  <path d="M194 160 C 198 160, 198 170, 194 172" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M184 150 Q 187 145, 185 140" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M189 148 Q 192 143, 190 138" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- CHARACTER 1: Excited Presenter / Commentator (Left) -->
  <g transform="translate(45, 120)">
    <!-- Body / Torso -->
    <path d="M15 40 Q 25 30, 45 35 L 55 60 L 5 60 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt details -->
    <path d="M28 34 L 35 45 L 42 34 Z" fill="#f8fafc"/>
    <!-- Neck -->
    <rect x="30" y="22" width="10" height="10" fill="#fbcfe8"/>
    <!-- Head -->
    <circle cx="35" cy="15" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 21 15 C 21 5, 30 2, 45 5 C 48 10, 49 15, 49 15 C 49 15, 40 8, 30 10 C 24 11, 21 15, 21 15 Z" fill="#1e293b"/>
    <!-- Expressive Face (Smiling, talking enthusiastically) -->
    <circle cx="30" cy="14" r="1.5" fill="#1e293b"/>
    <circle cx="41" cy="14" r="1.5" fill="#1e293b"/>
    <path d="M 33 20 Q 35 24, 38 20" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Raised Arm pointing at the hot topic screen -->
    <path d="M 45 38 C 55 35, 65 25, 75 18" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="77" cy="16" r="4" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER 2: Interested Colleague / Audience (Right) -->
  <g transform="translate(150, 125)">
    <!-- Body / Torso -->
    <path d="M15 35 Q 25 25, 35 35 L 50 55 L 0 55 Z" fill="#10b981"/>
    <path d="M20 35 L 25 45 L 30 35 Z" fill="#f8fafc"/>
    <!-- Neck -->
    <rect x="20" y="20" width="10" height="10" fill="#fbcfe8"/>
    <!-- Head -->
    <circle cx="25" cy="13" r="13" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 13 12 C 13 3, 20 1, 32 3 C 37 6, 38 12, 38 12 C 38 12, 30 6, 22 7 C 16 8, 13 12, 13 12 Z" fill="#b45309"/>
    <!-- Face (Amazed / engaged expression) -->
    <circle cx="20" cy="12" r="1.5" fill="#1e293b"/>
    <circle cx="29" cy="12" r="1.5" fill="#1e293b"/>
    <circle cx="24" cy="18" r="3" fill="#1e293b"/> <!-- Open mouth -->
    <!-- Arm leaning on desk -->
    <path d="M 15 40 C 5 42, -5 45, -15 50" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="-17" cy="51" r="3.5" fill="#fbcfe8"/>
  </g>

  <!-- Ambient lighting/sparkles representing 'Popularity / Hotness' -->
  <g fill="#f59e0b">
    <path d="M 50 80 L 52 85 L 57 87 L 52 89 L 50 94 L 48 89 L 43 87 L 48 85 Z" opacity="0.8"/>
    <path d="M 190 70 L 191 73 L 194 74 L 191 75 L 190 78 L 189 75 L 186 74 L 189 73 Z" opacity="0.6"/>
    <path d="M 115 25 L 116.5 28.5 L 120 30 L 116.5 31.5 L 115 35 L 113.5 31.5 L 110 30 L 113.5 28.5 Z" opacity="0.9"/>
  </g>

  <!-- Foreground framing elements for depth -->
  <rect x="0" y="232" width="240" height="8" fill="#0f172a"/>
</svg>