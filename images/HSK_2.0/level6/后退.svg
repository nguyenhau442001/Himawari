<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container & Environment -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="dustGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Tactical Searchlight / Moonlight Effect -->
  <path d="M 0 0 L 120 240 L 40 240 Z" fill="#38bdf8" opacity="0.08"/>
  <path d="M 240 0 L 120 240 L 200 240 Z" fill="#38bdf8" opacity="0.05"/>

  <!-- Background Environment: Terrain, Sandbags, Barricades -->
  <!-- Distant Hills/Obstacles -->
  <path d="M0 130 Q 60 110, 130 125 T 240 120 L 240 150 L 0 150 Z" fill="#1b2a4a"/>
  
  <!-- Sandbag Barricade (Left) -->
  <g fill="#475569" stroke="#1e293b" stroke-width="1.5">
    <ellipse cx="25" cy="155" rx="14" ry="7"/>
    <ellipse cx="45" cy="152" rx="16" ry="8"/>
    <ellipse cx="35" cy="146" rx="15" ry="7"/>
    <ellipse cx="15" cy="150" rx="13" ry="6"/>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="150" width="240" height="90" fill="url(#groundGrad)"/>
  
  <!-- Tactical Ground Lines & Dust Motion Effects -->
  <path d="M 20 180 Q 70 175 120 185" stroke="#64748b" stroke-width="2" stroke-dasharray="4,6" fill="none" opacity="0.4"/>
  <path d="M 40 200 Q 90 195 150 205" stroke="#64748b" stroke-width="2" stroke-dasharray="3,8" fill="none" opacity="0.4"/>

  <!-- Motion Trails / Backward Movement Indicator (Arrows & Dust) -->
  <g filter="url(#glow)">
    <path d="M 170 170 L 140 170 M 150 165 L 140 170 L 150 175" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <path d="M 130 185 L 100 185 M 110 180 L 100 185 L 110 190" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <path d="M 200 160 L 170 160 M 180 155 L 170 160 L 180 165" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Dust Clouds at feet -->
  <circle cx="165" cy="185" r="12" fill="#64748b" opacity="0.4"/>
  <circle cx="185" cy="190" r="8" fill="#64748b" opacity="0.3"/>
  <circle cx="145" cy="195" r="10" fill="#64748b" opacity="0.3"/>

  <!-- SUBJECT: RETREATING TROOP / SOLDIER (部队后退) -->
  <!-- Character 1 (Main retreating soldier - center-right) -->
  <g transform="translate(145, 120)">
    <!-- Shadow -->
    <ellipse cx="15" cy="70" rx="18" ry="6" fill="#020617" opacity="0.6"/>

    <!-- Backpack / Gear -->
    <rect x="-8" y="20" width="14" height="25" rx="4" fill="#334155"/>

    <!-- Left Leg (Stepping back / dynamic pose) -->
    <path d="M 10 45 L 25 65 L 35 62" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 10 45 L 25 65 L 35 62" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Boot -->
    <path d="M 32 60 L 40 64" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

    <!-- Right Leg (Pushing off) -->
    <path d="M 5 45 L -5 62 L -12 60" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 5 45 L -5 62 L -12 60" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Boot -->
    <path d="M -15 58 L -8 63" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

    <!-- Torso (Uniform - Slate/Navy with amber accents) -->
    <path d="M -8 15 L 18 15 L 14 48 L -4 48 Z" fill="#334155"/>
    <path d="M 5 15 L 5 48" stroke="#1e293b" stroke-width="2"/>
    <path d="M -6 22 L 16 22" stroke="#f59e0b" stroke-width="2" opacity="0.8"/> <!-- Insignia/Strap -->

    <!-- Head & Helmet -->
    <!-- Helmet -->
    <path d="M -4 3 Q 5 -2 15 4 Q 18 10 8 13 L -2 13 Q -10 10 -4 3 Z" fill="#475569"/>
    <path d="M -7 9 Q 5 14 17 9" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <!-- Face Profile (Looking back/forward defensively) -->
    <circle cx="5" cy="8" r="5" fill="#fbcfe8"/>
    <path d="M 8 7 L 10 9" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/> <!-- Eye -->

    <!-- Arms & Rifle (Retreating stance, holding weapon ready) -->
    <!-- Back Arm -->
    <path d="M 12 20 L 25 30 L 15 38" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front Arm -->
    <path d="M -2 20 L 15 28 L 22 25" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Rifle held horizontally/diagonally -->
    <path d="M -12 24 L 35 22" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 12 21 L 18 28" stroke="#334155" stroke-width="4"/> <!-- Rifle stock/scope -->
  </g>

  <!-- Character 2 (Second retreating soldier - further back for depth) -->
  <g transform="translate(95, 125) scale(0.8)">
    <!-- Shadow -->
    <ellipse cx="10" cy="70" rx="14" ry="5" fill="#020617" opacity="0.5"/>
    
    <!-- Backpack -->
    <rect x="-6" y="22" width="12" height="22" rx="3" fill="#334155"/>

    <!-- Legs -->
    <path d="M 8 45 L 20 62 L 28 60" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 2 45 L -8 60 L -15 58" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Torso -->
    <path d="M -6 16 L 15 16 L 12 46 L -3 46 Z" fill="#475569"/>

    <!-- Helmet & Head -->
    <path d="M -3 4 Q 4 0 13 5 Q 15 10 7 12 L -2 12 Q -8 9 -3 4 Z" fill="#334155"/>
    <circle cx="4" cy="8" r="4.5" fill="#fbcfe8"/>

    <!-- Arms & Equipment -->
    <path d="M -2 22 L 12 28 L 18 25" stroke="#334155" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M -10 25 L 25 23" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Character 3 (Commander/Lead signaling backward movement) -->
  <g transform="translate(195, 125)">
    <!-- Shadow -->
    <ellipse cx="10" cy="70" rx="15" ry="5" fill="#020617" opacity="0.6"/>

    <!-- Legs in motion -->
    <path d="M 5 45 L -5 62 L -14 60" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 12 45 L 22 62 L 30 58" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Torso -->
    <path d="M -5 15 L 16 15 L 12 47 L -2 47 Z" fill="#334155"/>
    <path d="M -5 15 L 16 15 L 12 22 L -5 22 Z" fill="#f59e0b" opacity="0.8"/> <!-- Commander sash/band -->

    <!-- Head & Cap -->
    <path d="M -4 4 Q 5 -1 14 5 Q 16 10 8 12 L -3 12 Q -9 9 -4 4 Z" fill="#475569"/>
    <!-- Peak cap visor -->
    <path d="M 2 8 L 18 10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="5" cy="8" r="4.5" fill="#fbcfe8"/>

    <!-- Arms gesturing backward (Signaling "Fall Back / 后退") -->
    <!-- Arm pointing/waving back -->
    <path d="M 12 20 L 28 15 L 34 22" stroke="#475569" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M -2 20 L -12 28 L -8 35" stroke="#475569" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Binoculars or Radio in hand -->
    <rect x="-14" y="32" width="8" height="6" rx="1" fill="#0f172a"/>
  </g>

  <!-- Foreground Atmospheric Elements & Debris -->
  <!-- Small glowing particles/embers floating from distance -->
  <circle cx="70" cy="100" r="1.5" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <circle cx="110" cy="90" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="160" cy="110" r="2" fill="#fbbf24" opacity="0.7" filter="url(#glow)"/>
  <circle cx="40" cy="120" r="1" fill="#fbbf24" opacity="0.5"/>

  <!-- Tactical Flare Glow in Upper Corner (Setting the dramatic scene) -->
  <circle cx="20" cy="20" r="50" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- Frame Border / Vignette Effect -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>