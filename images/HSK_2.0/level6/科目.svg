<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Student Character -->
  <g transform="translate(180, 140)">
    <circle cx="0" cy="0" r="15" fill="#fde68a"/>
    <path d="M-5 -5 h2 m4 0 h2 M-3 5 q3 3 6 0" stroke="#1e293b" stroke-width="2" fill="none"/>
    <rect x="-10" y="15" width="20" height="30" rx="4" fill="#38bdf8"/>
  </g>

  <!-- The 6 Subjects (Books/Folders) -->
  <g transform="translate(35, 170)">
    <rect x="0" y="0" width="25" height="40" rx="2" fill="#fb923c"/>
    <rect x="30" y="5" width="25" height="35" rx="2" fill="#10b981"/>
    <rect x="60" y="0" width="25" height="40" rx="2" fill="#ec4899"/>
    <rect x="90" y="10" width="25" height="30" rx="2" fill="#fbbf24"/>
    <rect x="120" y="0" width="25" height="40" rx="2" fill="#38bdf8"/>
    <rect x="150" y="5" width="25" height="35" rx="2" fill="#a78bfa"/>
  </g>

  <!-- Background Elements -->
  <circle cx="200" cy="40" r="30" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <path d="M180 60 L220 20" stroke="#334155" stroke-width="4"/>
  
  <!-- Window/Light -->
  <rect x="30" y="30" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M30 70 L90 70 M60 30 L60 110" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative Plant -->
  <circle cx="20" cy="140" r="8" fill="#10b981"/>
  <path d="M20 148 L20 160" stroke="#475569" stroke-width="4"/>
</svg>