<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Workshop Environment / Interior -->
  <path d="M 20 180 L 220 180 L 220 220 L 20 220 Z" fill="url(#floorGrad)"/>
  <line x1="20" y1="180" x2="220" y2="180" stroke="#475569" stroke-width="2"/>
  
  <!-- Background Shelf with Tools -->
  <rect x="30" y="70" width="80" height="6" rx="3" fill="#475569"/>
  <!-- Tool silhouette 1 -->
  <path d="M 50 50 L 55 70 L 45 70 Z" fill="#64748b"/>
  <!-- Tool silhouette 2 -->
  <rect x="75" y="45" width="8" height="25" rx="2" fill="#64748b"/>
  <circle cx="79" cy="42" r="4" fill="#64748b"/>
  
  <!-- Workbench -->
  <g id="workbench">
    <!-- Legs -->
    <rect x="45" y="140" width="12" height="40" fill="#334155"/>
    <rect x="183" y="140" width="12" height="40" fill="#334155"/>
    <!-- Tabletop -->
    <rect x="30" y="130" width="180" height="14" rx="3" fill="#92400e"/>
    <rect x="30" y="130" width="180" height="4" rx="2" fill="#b45309"/>
  </g>

  <!-- The Wooden Board with Warping Edge (Focus: 翘 - qiào) -->
  <g id="warped-board">
    <!-- Flat part resting on table -->
    <path d="M 50 128 L 160 128 L 160 134 L 50 134 Z" fill="url(#woodGrad)"/>
    <!-- Wood grain lines -->
    <line x1="60" y1="130" x2="140" y2="130" stroke="#92400e" stroke-width="1" stroke-linecap="round"/>
    <line x1="70" y1="132" x2="120" y2="132" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>

    <!-- The Warped/Upward-curled end (翘起来) -->
    <path d="M 158 132 C 175 132, 190 120, 198 105 C 196 103, 192 106, 188 108 C 180 120, 168 126, 158 128 Z" fill="url(#woodGrad)" filter="url(#glow)"/>
    <line x1="162" y1="130" x2="192" y2="108" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Action indicator arrows showing the 'warping up' motion -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
      <path d="M 195 115 Q 203 105 197 93"/>
      <polyline points="191,97 197,91 202,97"/>
    </g>
  </g>

  <!-- Character: Carpenter / Inspector inspecting the wood -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M 75 170 C 75 150, 95 145, 110 145 C 125 145, 145 150, 145 170 Z" fill="#0284c7"/>
    <!-- Collar / Apron straps -->
    <path d="M 95 145 L 90 170" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 125 145 L 130 170" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="85" y="155" width="50" height="25" rx="4" fill="#38bdf8" opacity="0.3"/>

    <!-- Head & Face -->
    <circle cx="110" cy="118" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 94 118 C 94 105, 105 100, 115 100 C 125 100, 126 108, 126 112 C 126 112, 122 108, 116 108 C 110 108, 102 112, 94 118 Z" fill="#334155"/>
    
    <!-- Facial Expression: Surprised/Realizing the defect -->
    <circle cx="105" cy="116" r="1.5" fill="#1e293b"/>
    <circle cx="117" cy="116" r="1.5" fill="#1e293b"/>
    <!-- Raised eyebrow -->
    <path d="M 103 112 Q 106 109 109 112" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 114 111 Q 117 108 120 111" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Open surprised mouth -->
    <ellipse cx="111" cy="123" rx="2.5" ry="3.5" fill="#1e293b"/>

    <!-- Arm pointing/checking the warped plank -->
    <path d="M 135 150 C 145 140, 155 125, 165 118" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="167" cy="116" r="4" fill="#fbcfe8"/>

    <!-- Other Arm resting -->
    <path d="M 85 150 C 75 155, 70 165, 72 175" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Foreground Props: Ruler / Tools on table -->
  <g id="tools">
    <!-- Metal ruler lying flat -->
    <rect x="40" y="130" width="35" height="4" rx="1" fill="#cbd5e1"/>
    <line x1="45" y1="130" x2="45" y2="134" stroke="#64748b" stroke-width="1"/>
    <line x1="55" y1="130" x2="55" y2="134" stroke="#64748b" stroke-width="1"/>
    <line x1="65" y1="130" x2="65" y2="134" stroke="#64748b" stroke-width="1"/>

    <!-- Pencil -->
    <path d="M 115 131 L 135 125 L 136 127 L 116 133 Z" fill="#fbbf24"/>
    <polygon points="135,125 138,127 136,127" fill="#334155"/>
  </g>

  <!-- Ambient Light / Warm Lamp Glow from above -->
  <path d="M 110 20 L 160 0 L 60 0 Z" fill="#ffffff" opacity="0.03"/>
  <circle cx="110" cy="10" r="80" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>
</svg>