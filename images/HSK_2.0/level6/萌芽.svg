<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 180 C 80 160, 160 160, 240 180 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.5"/>
  <path d="M0 190 C 80 170, 160 170, 240 190 L 240 240 L 0 240 Z" fill="#1e293b"/>

  <!-- Character: A child kneeling -->
  <g transform="translate(60, 140)">
    <path d="M20 60 L40 60 L35 30 L25 30 Z" fill="#38bdf8"/> <!-- Body -->
    <circle cx="30" cy="25" r="12" fill="#fbbf24"/> <!-- Head -->
    <path d="M22 22 L26 26 M34 22 L30 26" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/> <!-- Eyes -->
    <path d="M25 32 Q30 35 35 32" stroke="#0f172a" stroke-width="2" fill="none"/> <!-- Smile -->
    <path d="M15 50 L20 60 L10 70" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/> <!-- Arm -->
  </g>

  <!-- Nature: Sprouting plants -->
  <g transform="translate(140, 190)">
    <!-- Sprout 1 -->
    <path d="M0 0 C 5 -20, 15 -20, 20 0" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="10" cy="-15" rx="4" ry="6" fill="#10b981" transform="rotate(-20 10 -15)"/>
    <ellipse cx="10" cy="-15" rx="4" ry="6" fill="#10b981" transform="rotate(20 10 -15)"/>
  </g>
  
  <g transform="translate(170, 200)">
    <!-- Sprout 2 -->
    <path d="M0 0 C 2 -10, 8 -10, 10 0" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="5" cy="-8" rx="3" ry="4" fill="#10b981" transform="rotate(-15 5 -8)"/>
  </g>

  <!-- Sun/Spring warmth -->
  <circle cx="200" cy="40" r="25" fill="#fb923c" opacity="0.2"/>
  <circle cx="200" cy="40" r="15" fill="#f59e0b"/>
  
  <!-- Decorative elements -->
  <path d="M30 40 L35 35 M40 50 L45 45" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 120 L205 115 M210 130 L215 125" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
</svg>