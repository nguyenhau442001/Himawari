<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Warm Spotlight for Hero -->
    <radialGradient id="heroSpotlight" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow for Respect / Admiration element -->
    <radialGradient id="admitGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Dark Mode Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Community Workshop / Public Service Center (Real-world setting) -->
  <!-- Back Wall & Interior Architecture -->
  <rect x="20" y="25" width="200" height="155" fill="#182232"/>
  
  <!-- Wooden Bookshelf / Storage Unit on Back Wall -->
  <g fill="#273548">
    <rect x="35" y="45" width="50" height="90" rx="2"/>
    <rect x="40" y="65" width="40" height="4" fill="#1e293b"/>
    <rect x="40" y="85" width="40" height="4" fill="#1e293b"/>
    <rect x="40" y="105" width="40" height="4" fill="#1e293b"/>
  </g>
  <!-- Colorful books on shelf -->
  <rect x="43" y="52" width="6" height="13" fill="#f43f5e" rx="1"/>
  <rect x="51" y="50" width="8" height="15" fill="#38bdf8" rx="1"/>
  <rect x="61" y="54" width="5" height="11" fill="#10b981" rx="1"/>
  <rect x="68" y="51" width="9" height="14" fill="#f59e0b" rx="1"/>
  
  <!-- Large Window showing soft evening glow outside -->
  <rect x="155" y="45" width="50" height="70" rx="4" fill="#0b1320" stroke="#334155" stroke-width="2"/>
  <path d="M155 45 L205 115 M205 45 L155 115" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <polygon points="155,45 205,45 205,115 155,115" fill="url(#windowLight)"/>

  <!-- Indoor Ambient Lighting / Warm Wall Sconce -->
  <circle cx="120" cy="40" r="18" fill="url(#heroSpotlight)"/>
  <path d="M115 30 h10 l-3 8 h-4 z" fill="#475569"/>
  <circle cx="120" cy="38" r="4" fill="#fef08a"/>

  <!-- Floor -->
  <rect x="20" y="180" width="200" height="35" fill="#0f172a"/>
  <line x1="20" y1="180" x2="220" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- SCENE PROPS: Wooden Table / Desk where good deeds/certificates are presented -->
  <g filter="url(#softShadow)">
    <path d="M50 160 L190 160 L180 185 L60 185 Z" fill="#334155"/>
    <rect x="55" y="152" width="130" height="10" rx="2" fill="#475569"/>
    <!-- Table legs -->
    <rect x="65" y="185" width="8" height="20" fill="#1e293b"/>
    <rect x="167" y="185" width="8" height="20" fill="#1e293b"/>
  </g>

  <!-- Props on Table: A plaque of recognition & bouquet of flowers (Symbolizing respect & integrity) -->
  <g transform="translate(100, 135)">
    <!-- Award Plaque -->
    <rect x="-12" y="2" width="24" height="18" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="0" cy="9" r="4" fill="#f59e0b"/>
    <!-- Bouquet -->
    <path d="M22 20 c0 -8 -5 -15 -5 -15 s-5 7 -5 15 z" fill="#10b981"/>
    <circle cx="17" cy="3" r="3" fill="#ec4899"/>
    <circle cx="12" cy="7" r="2.5" fill="#38bdf8"/>
    <circle cx="22" cy="6" r="2.5" fill="#fef08a"/>
    <path d="M17 14 c0 3 0 6 0 6" stroke="#047857" stroke-width="2"/>
  </g>

  <!-- CHARACTERS -->
  <!-- Character 1: The Admired Person (Standing upright, confident, humble posture, wearing smart casual attire) -->
  <g transform="translate(75, 95)" filter="url(#softShadow)">
    <!-- Shadow beneath character -->
    <ellipse cx="0" cy="88" rx="18" ry="5" fill="#000000" opacity="0.4"/>

    <!-- Body / Torso (Warm trustworthy blue sweater over white collar) -->
    <path d="M-14 35 L14 35 L18 70 L-18 70 Z" fill="#2563eb"/>
    <path d="M-6 35 L0 44 L6 35 Z" fill="#f8fafc"/>
    <!-- Arms in welcoming, honest gesture -->
    <path d="M-14 38 L-25 55 L-20 58 L-12 45 Z" fill="#1d4ed8"/>
    <path d="M14 38 L24 50 L20 54 L11 43 Z" fill="#1d4ed8"/>
    <!-- Hands -->
    <circle cx="-22" cy="60" r="4" fill="#ffedd5"/>
    <circle cx="22" cy="56" r="4" fill="#ffedd5"/>

    <!-- Legs & Shoes (Dark trousers) -->
    <rect x="-12" y="70" width="10" height="20" fill="#0f172a"/>
    <rect x="2" y="70" width="10" height="20" fill="#0f172a"/>
    <path d="M-16 90 L-10 90 L-10 87 L-16 87 Z" fill="#334155" rx="1"/>
    <path d="M10 90 L16 90 L16 87 L10 87 Z" fill="#334155" rx="1"/>

    <!-- Head & Face -->
    <circle cx="0" cy="20" r="14" fill="#ffedd5"/>
    <!-- Hair (Neat dark brown hair) -->
    <path d="M-14 18 C-14 8 -6 6 0 6 C6 6 14 8 14 18 C14 18 10 12 0 12 C-10 12 -14 18 -14 18 Z" fill="#33170a"/>
    <!-- Facial expression: Warm, sincere, smiling eyes, gentle composure -->
    <circle cx="-4" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="4" cy="18" r="1.5" fill="#1e293b"/>
    <path d="M-3 24 Q0 27 3 24" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <circle cx="-7" cy="21" r="2" fill="#fca5a5" opacity="0.6"/>
    <circle cx="7" cy="21" r="2" fill="#fca5a5" opacity="0.6"/>
  </g>

  <!-- Character 2: The Admirer (Bowing slightly / gesturing with deep respect and appreciation) -->
  <g transform="translate(160, 98)" filter="url(#softShadow)">
    <!-- Shadow beneath character -->
    <ellipse cx="0" cy="85" rx="16" ry="5" fill="#000000" opacity="0.4"/>

    <!-- Body / Torso (Leaning forward slightly in respectful posture, emerald green jacket) -->
    <path d="M-12 38 L16 34 L20 72 L-8 72 Z" fill="#059669"/>
    <!-- Inner shirt -->
    <path d="M2 36 L10 42 L6 46 Z" fill="#f8fafc"/>
    
    <!-- Arms expressing admiration (one hand over chest/heart, one gesturing toward the hero) -->
    <path d="M-8 42 L-22 52 L-18 57 L-5 48 Z" fill="#047857"/>
    <path d="M12 37 L28 44 L25 49 L10 44 Z" fill="#047857"/>
    <!-- Hands -->
    <circle cx="-24" cy="54" r="3.5" fill="#fde047"/>
    <circle cx="30" cy="46" r="3.5" fill="#fde047"/>

    <!-- Legs (Slanted for bowing posture) -->
    <path d="M-6 70 L-10 90 L-3 90 L0 72 Z" fill="#1e293b"/>
    <path d="M12 70 L18 88 L24 87 L16 70 Z" fill="#1e293b"/>

    <!-- Head & Face (Looking up admiringly with sparkling eyes) -->
    <path d="M4 18 C3 10 10 6 15 10 C20 14 18 22 14 24 C10 26 5 26 4 18 Z" fill="#78350f"/> <!-- Hair -->
    <circle cx="12" cy="21" r="13" fill="#fde68a"/>
    <!-- Expressive eyes showing respect and awe -->
    <path d="M8 18 Q11 16 14 19" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="13" cy="21" r="2" fill="#0284c7"/> <!-- Shining eye -->
    <circle cx="16" cy="23" r="1.5" fill="#e11d48"/> <!-- Warm grateful smile -->
    <!-- Blush of high esteem -->
    <circle cx="8" cy="24" r="2.5" fill="#fb7185" opacity="0.7"/>
  </g>

  <!-- ATMOSPHERIC ELEMENTS: Visualizing "Respect" and "Character/Integrity" as subtle glowing aura / floating warm sparks -->
  <g>
    <!-- Glowing admiration sparkles floating near the center -->
    <path d="M 125 100 L 127 105 L 132 107 L 127 109 L 125 114 L 123 109 L 118 107 L 123 105 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 100 80 L 101 83 L 104 84 L 101 85 L 100 88 L 99 85 L 96 84 L 99 83 Z" fill="#38bdf8" opacity="0.7" transform="scale(0.7) translate(40, 20)"/>
    <path d="M 150 70 L 151 73 L 154 74 L 151 75 L 150 78 L 149 75 L 146 74 L 149 73 Z" fill="#f43f5e" opacity="0.6" transform="scale(0.8) translate(30, -10)"/>

    <!-- Soft upward glowing particles (representing noble character elevating the atmosphere) -->
    <circle cx="95" cy="110" r="1.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="105" cy="95" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="135" cy="85" r="1" fill="#fef08a" opacity="0.7"/>
    <circle cx="145" cy="115" r="2" fill="#34d399" opacity="0.9"/>
  </g>

  <!-- Foreground Vignette / Framing Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>