<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Warm Ambient Light Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Qipao Silk Gradient (Emerald/Teal with Gold Accent) -->
    <linearGradient id="qipao-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Mirror Reflection Gradient -->
    <linearGradient id="mirror-ref" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- INTERIOR ENVIRONMENT / SCENOGRAPHY -->
  <!-- Wooden Floor & Baseboard -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#475569" stroke-width="2" />
  <line x1="60" y1="200" x2="40" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="150" y1="200" x2="140" y2="240" stroke="#1e293b" stroke-width="1.5" />

  <!-- Wall Decor: Traditional Chinese Round Window / Moon Gate Silhouette -->
  <circle cx="180" cy="85" r="50" fill="#0b0f19" opacity="0.7" />
  <circle cx="180" cy="85" r="46" fill="none" stroke="#334155" stroke-width="2" />
  <!-- Bamboo branch outside round window -->
  <path d="M160 110 Q170 90 200 70" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M175 95 Q185 85 195 88" stroke="#64748b" stroke-width="1.5" fill="none" />
  <path d="M168 102 Q160 95 158 85" stroke="#64748b" stroke-width="1.5" fill="none" />

  <!-- Hanging Lantern (Atmospheric Lighting) -->
  <path d="M50 0 L50 25" stroke="#64748b" stroke-width="1.5" />
  <ellipse cx="50" cy="30" rx="12" ry="4" fill="#f59e0b" />
  <path d="M38 30 C38 50 62 50 62 30 Z" fill="#ef4444" filter="url(#shadow)" />
  <path d="M38 30 C38 42 62 42 62 30 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="50" y1="50" x2="50" y2="60" stroke="#f59e0b" stroke-width="2" />

  <!-- Vanity / Dressing Table with Prop (Perfume Bottle) -->
  <path d="M15 200 L45 160 L125 160 L155 200 Z" fill="#334155" opacity="0.6" />
  <rect x="35" y="155" width="80" height="6" rx="3" fill="#64748b" />
  <!-- Perfume Bottle Prop -->
  <rect x="55" y="135" width="16" height="20" rx="4" fill="#38bdf8" opacity="0.8" />
  <rect x="60" y="130" width="6" height="5" fill="#f59e0b" />

  <!-- MAIN SUBJECT: CHARACTER WEARING A BEAUTIFUL QIPAO -->
  <g transform="translate(15, 15)" filter="url(#shadow)">
    <!-- Hair & Back Elements -->
    <path d="M85 45 C75 45 68 55 68 70 C68 85 75 90 75 105 C75 115 70 120 70 120 C70 120 85 125 95 120 C105 125 110 115 110 105 C110 90 117 85 117 70 C117 55 110 45 95 45 Z" fill="#0f172a" />
    <!-- Elegant hair bun -->
    <circle cx="95" cy="38" r="12" fill="#0f172a" />
    <path d="M85 38 L105 38" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" /> <!-- Hair pin -->

    <!-- Head & Face (Gentle, Happy Expression) -->
    <circle cx="95" cy="55" r="18" fill="#fbcfe8" />
    <path d="M83 50 Q87 47 91 51" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M99 50 Q103 47 107 51" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Gentle smiling eyes -->
    <path d="M85 55 Q87 58 89 55" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M101 55 Q103 58 105 55" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Blush -->
    <circle cx="84" cy="60" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="106" cy="60" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Smile -->
    <path d="M91 63 Q95 67 99 63" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Neck & Mandarin Collar (Stand-up Collar of Qipao) -->
    <path d="M90 70 L90 77 L100 77 L100 70 Z" fill="#fbcfe8" />
    <path d="M87 73 C87 70 103 70 103 73 C103 76 87 76 87 73 Z" fill="url(#qipao-grad)" stroke="url(#gold-accent)" stroke-width="1.5" />
    <!-- Chinese Knot / Frog Buttons (盘扣) -->
    <circle cx="95" cy="79" r="2.5" fill="#f59e0b" />
    <circle cx="95" cy="88" r="2.5" fill="#f59e0b" />
    <circle cx="95" cy="97" r="2.5" fill="#f59e0b" />

    <!-- QIPAO BODY (áo sườn xám) -->
    <!-- Torso and fitted silhouette -->
    <path d="M75 78 C70 85 68 115 72 150 L82 185 L95 185 L108 185 L118 150 C122 115 120 85 115 78 Z" fill="url(#qipao-grad)" />
    
    <!-- Gold Trim / Piping along the side slit and edges -->
    <path d="M72 150 L82 185" stroke="url(#gold-accent)" stroke-width="2" fill="none" />
    <path d="M118 150 L108 185" stroke="url(#gold-accent)" stroke-width="2" fill="none" />
    <!-- Center-right asymmetric placket curve typical of Qipao -->
    <path d="M95 77 C95 110 88 140 85 185" stroke="url(#gold-accent)" stroke-width="1.5" fill="none" opacity="0.8" />

    <!-- Delicate Floral Patterns on Qipao (Stylized Vector Motifs) -->
    <g fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.6">
      <!-- Left side motifs -->
      <circle cx="82" cy="100" r="4" />
      <path d="M82 96 C80 94 78 96 82 96" />
      <circle cx="78" cy="130" r="5" />
      <circle cx="85" cy="160" r="4" />
      <!-- Right side motifs -->
      <circle cx="108" cy="110" r="4" />
      <circle cx="112" cy="140" r="5" />
      <circle cx="102" cy="170" r="4" />
    </g>

    <!-- Arms & Hands (Graceful pose admiring dress) -->
    <!-- Left Arm (bent holding skirt edge) -->
    <path d="M75 80 C60 90 65 115 78 125" fill="none" stroke="url(#qipao-grad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="79" cy="127" r="5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Right Arm (raised slightly in elegant expression) -->
    <path d="M115 80 C130 90 125 115 112 110" fill="none" stroke="url(#qipao-grad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="110" cy="108" r="5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Legs & Traditional Shoes (Peeeking through side slit) -->
    <path d="M88 185 L86 205" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />
    <path d="M102 185 L104 205" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />
    <!-- Mary Jane / Traditional Flat Shoes -->
    <ellipse cx="85" cy="207" rx="6" ry="3" fill="#0f172a" />
    <ellipse cx="106" cy="207" rx="6" ry="3" fill="#0f172a" />
  </g>

  <!-- FOREGROUND FRAME ELEMENTS (Adding depth of field) -->
  <!-- Soft vignette / foreground bokeh particles -->
  <circle cx="30" cy="100" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="45" cy="80" r="3.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="25" cy="140" r="1.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="210" cy="170" r="3" fill="#fbbf24" opacity="0.5" />
  <circle cx="195" cy="190" r="1.5" fill="#38bdf8" opacity="0.4" />
</svg>