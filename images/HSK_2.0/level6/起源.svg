<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmosphere / Ambient Lighting -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <circle cx="150" cy="80" r="40" fill="#38bdf8" opacity="0.05"/>
  <circle cx="90" cy="140" r="50" fill="#f59e0b" opacity="0.04"/>

  <!-- Museum / Research Desk Environment -->
  <!-- Wooden Desk Surface -->
  <path d="M 20 185 L 220 185 L 230 220 L 10 220 Z" fill="#334155"/>
  <path d="M 20 185 L 220 185 L 225 192 L 15 192 Z" fill="#475569"/>
  
  <!-- Desk Lamp illuminating the scene -->
  <path d="M 195 185 L 205 130 L 215 130 L 210 185 Z" fill="#64748b"/>
  <path d="M 190 125 Q 210 110 225 125 Z" fill="#f59e0b"/>
  <!-- Lamp light cone -->
  <polygon points="207,130 140,185 200,185" fill="#f59e0b" opacity="0.15"/>

  <!-- Ancient Relic / Artifact (The "Custom" or "Tradition") -->
  <!-- Stone/Jade Carving on a Stand -->
  <rect x="70" y="165" width="40" height="20" rx="3" fill="#475569"/>
  <path d="M 80 165 L 90 140 L 100 165 Z" fill="#64748b"/>
  <circle cx="90" cy="132" r="16" fill="#38bdf8" opacity="0.8"/>
  <!-- Abstract mysterious ancient spiral symbol on relic -->
  <path d="M 85 132 Q 90 124 95 132 Q 95 138 90 138 Q 87 138 87 135" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Old Scroll / Fragment (Uncertain Origin) -->
  <path d="M 40 170 Q 55 165 70 175 L 65 185 Q 50 175 35 185 Z" fill="#cbd5e1"/>
  <path d="M 38 172 L 67 177" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Magnifying Glass hovering over the relic -->
  <g transform="translate(110, 105)">
    <!-- Glass Lens Area (transparent glow) -->
    <circle cx="0" cy="0" r="22" fill="#38bdf8" opacity="0.15"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <!-- Glass reflection highlight -->
    <path d="M -12 -10 Q -5 -15 0 -12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Handle -->
    <path d="M 15 15 L 32 32" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 15 15 L 32 32" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Researcher Character (Curious / Puzzled gesture) -->
  <!-- Body / Lab coat / Sleeves -->
  <path d="M 95 220 Q 95 190 110 175 L 140 175 Q 155 190 155 220 Z" fill="#e2e8f0"/>
  <!-- Collar -->
  <polygon points="115,175 125,190 135,175" fill="#cbd5e1"/>
  
  <!-- Head & Hair -->
  <circle cx="125" cy="140" r="18" fill="#fbcfe8"/> <!-- Skin tone -->
  <!-- Hair -->
  <path d="M 107 138 Q 110 120 125 120 Q 140 120 143 138 Q 145 130 135 125 Q 125 122 115 126 Q 105 130 107 138 Z" fill="#334155"/>

  <!-- Concerned / Puzzled Face Features -->
  <!-- Eyebrows tilted in questioning/confusion -->
  <line x1="116" y1="135" x2="122" y2="137" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="137" x2="134" y2="135" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="119" cy="141" r="1.5" fill="#334155"/>
  <circle cx="131" cy="141" r="1.5" fill="#334155"/>
  <!-- Small uncertain mouth -->
  <path d="M 123 150 Q 125 148 127 150" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Puzzled Hands / Arms scratching head or holding chin -->
  <!-- Arm reaching up to chin -->
  <path d="M 110 175 Q 115 160 120 155" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand near chin -->
  <circle cx="121" cy="153" r="4" fill="#fbcfe8"/>

  <!-- Floating Question Marks (Illustrating "Unable to verify/unknown origin") -->
  <g fill="#38bdf8" opacity="0.8">
    <!-- Q-mark 1 -->
    <path d="M 75 80 Q 75 70 85 70 Q 95 70 95 80 Q 95 88 85 92 L 85 98" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="85" cy="106" r="1.5"/>
  </g>
  <g fill="#f59e0b" opacity="0.7" transform="translate(30, -10) scale(0.8)">
    <!-- Q-mark 2 -->
    <path d="M 75 80 Q 75 70 85 70 Q 95 70 95 80 Q 95 88 85 92 L 85 98" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="85" cy="106" r="1.5"/>
  </g>

  <!-- Bookshelf Background Element -->
  <rect x="25" y="40" width="70" height="90" fill="#1e293b"/>
  <line x1="25" y1="70" x2="95" y2="70" stroke="#334155" stroke-width="4"/>
  <line x1="25" y1="100" x2="95" y2="100" stroke="#334155" stroke-width="4"/>
  <!-- Colorful Books -->
  <rect x="30" y="50" width="8" height="20" rx="1" fill="#ef4444"/>
  <rect x="40" y="48" width="10" height="22" rx="1" fill="#3b82f6"/>
  <rect x="52" y="53" width="7" height="17" rx="1" fill="#10b981"/>
  <rect x="65" y="46" width="12" height="24" rx="1" fill="#f59e0b"/>

  <rect x="30" y="78" width="12" height="22" rx="1" fill="#8b5cf6"/>
  <rect x="44" y="82" width="6" height="18" rx="1" fill="#ec4899"/>
  <rect x="53" y="76" width="10" height="24" rx="1" fill="#06b6d4"/>

</svg>