<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glow / aura for "神气" (proud, majestic, stylish aura) -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.1"/>
  <path d="M120 45 L129 70 L155 70 L133 86 L142 111 L120 95 L98 111 L107 86 L85 70 L111 70 Z" fill="#FFB703" opacity="0.15"/>

  <!-- Character / Object representing "神气" (Oai vệ, tự đắc - Confident, dapper character in new clothes) -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Torso (Wearing a sleek, sharp modern jacket/suit - "穿上新衣服") -->
    <path d="M 75 165 C 75 145 95 135 120 135 C 145 135 165 145 165 165 L 175 185 L 65 185 Z" fill="#2D3748"/>
    
    <!-- Jacket lapels -->
    <path d="M 120 135 L 100 170 L 120 185 L 140 170 Z" fill="#1A202C"/>
    
    <!-- Inner shirt & vibrant tie ("shénqì" accent) -->
    <polygon points="120,145 113,165 127,165" fill="#E2E8F0"/>
    <polygon points="117,162 123,162 125,185 120,190 115,185" fill="#FFB703"/>

    <!-- Neck -->
    <rect x="110" y="118" width="20" height="25" rx="4" fill="#F6AD55"/>

    <!-- Head & Confident Expression -->
    <!-- Chin/Face base -->
    <circle cx="120" cy="100" r="32" fill="#F6AD55"/>

    <!-- Stylish Hair (Upward swept, looking sharp/proud) -->
    <path d="M 88 100 C 88 75 105 68 120 68 C 138 68 153 78 153 100 C 153 100 148 75 132 72 C 120 70 102 75 88 100 Z" fill="#2D3748"/>
    <path d="M 115 68 C 125 60 142 62 152 75 C 145 68 130 65 115 68 Z" fill="#4A5568"/>

    <!-- Confident Eyes (Smug/Proud closed-happy arc or sharp confident dots with eyebrows angled up) -->
    <!-- Left Eyebrow (Angled confidently) -->
    <path d="M 98 88 L 112 92" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Eyebrow -->
    <path d="M 128 92 L 142 88" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>

    <!-- Confident Smile (Smirk) -->
    <path d="M 108 110 Q 120 120 132 110" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>

    <!-- Cheeks (Confident flush) -->
    <circle cx="100" cy="105" r="4" fill="#ED8936" opacity="0.4"/>
    <circle cx="140" cy="105" r="4" fill="#ED8936" opacity="0.4"/>

    <!-- Collar / High-fashion accents -->
    <path d="M 85 140 L 75 125 L 95 132 Z" fill="#FFB703"/>
    <path d="M 155 140 L 165 125 L 145 132 Z" fill="#FFB703"/>
  </g>

  <!-- Sparkles / Aura of "Vẻ oai" (Majestic / Proud energy) -->
  <g fill="#FFB703">
    <!-- Top left star -->
    <path d="M 60 70 Q 60 60 50 60 Q 60 60 60 50 Q 60 60 70 60 Q 60 60 60 70 Z"/>
    <!-- Top right star -->
    <path d="M 180 80 Q 180 72 172 72 Q 180 72 180 64 Q 180 72 188 72 Q 180 72 180 80 Z"/>
    <!-- Right mid star -->
    <path d="M 195 130 Q 195 122 187 122 Q 195 122 195 114 Q 195 122 203 122 Q 195 122 195 130 Z"/>
  </g>
</svg>