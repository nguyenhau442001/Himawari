<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skin-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Character 2 Skin Gradient -->
    <linearGradient id="skin-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Dramatic Spotlight Overlay -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Container & Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Interior Details -->
  <g id="room-interior">
    <!-- Window with Night Cityscape -->
    <rect x="145" y="30" width="65" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <path d="M145 72.5 H210 M177.5 30 V115" stroke="#334155" stroke-width="2" />
    <!-- City lights outside -->
    <rect x="153" y="45" width="8" height="12" rx="1" fill="#fbbf24" opacity="0.6" />
    <rect x="166" y="50" width="6" height="25" rx="1" fill="#38bdf8" opacity="0.5" />
    <rect x="190" y="40" width="10" height="35" rx="1" fill="#ec4899" opacity="0.4" />
    <rect x="155" y="70" width="12" height="30" rx="1" fill="#fb923c" opacity="0.5" />
    <rect x="185" y="85" width="14" height="20" rx="1" fill="#38bdf8" opacity="0.4" />

    <!-- Bookshelf in Background -->
    <rect x="25" y="35" width="45" height="90" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="65" x2="70" y2="65" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="95" x2="70" y2="95" stroke="#334155" stroke-width="1.5" />
    <!-- Books on Shelf -->
    <rect x="30" y="45" width="6" height="20" rx="1" fill="#38bdf8" />
    <rect x="38" y="42" width="8" height="23" rx="1" fill="#ec4899" />
    <rect x="52" y="47" width="5" height="18" rx="1" fill="#10b981" />
    <rect x="30" y="72" width="7" height="23" rx="1" fill="#f59e0b" />
    <rect x="43" y="75" width="10" height="20" rx="1" fill="#6366f1" />

    <!-- House Plant -->
    <path d="M85 130 C85 115 95 115 95 130 Z" fill="#334155" />
    <path d="M82 130 H98 L94 150 H86 Z" fill="#cbd5e1" />
    <!-- Plant Leaves -->
    <path d="M90 115 C75 100 70 85 80 80 C85 77 90 90 90 115 Z" fill="#10b981" />
    <path d="M90 115 C105 105 115 90 110 82 C107 77 97 90 90 115 Z" fill="#34d399" />
    <path d="M90 115 C90 95 95 80 102 82 C107 85 98 100 90 115 Z" fill="#059669" />

    <!-- Floor Line & Rug -->
    <line x1="0" y1="185" x2="240" y2="185" stroke="#0f172a" stroke-width="4" />
    <ellipse cx="125" cy="195" rx="80" ry="15" fill="#334155" opacity="0.6" />
  </g>

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="80" r="100" fill="url(#lamp-glow)" pointer-events="none" />

  <!-- SCENE: CHARACTERS EXPRESSING MISUNDERSTANDING ("纯粹是误会") -->
  <g id="main-scene" filter="url(#shadow)">
    
    <!-- CHARACTER 1 (Left: Explaining, apologetic/earnest gesture) -->
    <g id="character-male">
      <!-- Body & Torso -->
      <path d="M 65 145 C 65 130 75 125 90 125 C 105 125 115 130 115 145 L 110 185 L 70 185 Z" fill="#3b82f6" />
      <!-- Collar -->
      <path d="M 83 125 L 90 135 L 97 125 Z" fill="#ffffff" />

      <!-- Head & Neck -->
      <path d="M 85 115 H 95 V 128 H 85 Z" fill="url(#skin-1)" />
      <circle cx="90" cy="100" r="16" fill="url(#skin-1)" />
      
      <!-- Hair (Neat dark hair) -->
      <path d="M 74 98 C 74 85 84 83 90 83 C 98 83 106 87 106 100 C 106 100 104 92 100 89 C 96 86 86 86 80 90 C 76 93 74 98 74 98 Z" fill="#0f172a" />

      <!-- Facial Expression (Earnest, wide eyes clearing up a misunderstanding) -->
      <!-- Eyebrows (slanted slightly inward for concern/earnestness) -->
      <path d="M 80 94 Q 84 92 88 95" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 92 95 Q 96 92 100 94" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Eyes -->
      <circle cx="84" cy="98" r="2" fill="#0f172a" />
      <circle cx="96" cy="98" r="2" fill="#0f172a" />
      <!-- Open earnest mouth -->
      <path d="M 88 106 Q 90 110 92 106 Z" fill="#0f172a" />
      <!-- Blush of embarrassment -->
      <ellipse cx="80" cy="103" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4" />
      <ellipse cx="100" cy="103" rx="3" ry="1.5" fill="#f43f5e" opacity="0.4" />

      <!-- Arms & Gestures (Hands up in a "Hold on, it's just a misunderstanding!" gesture) -->
      <!-- Left Arm (Back) -->
      <path d="M 70 130 L 55 145 L 60 155" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Arm (Active gesture explaining) -->
      <path d="M 110 130 C 120 130 125 140 120 150" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Hand open palm facing other person -->
      <circle cx="120" cy="153" r="4" fill="url(#skin-1)" />

      <!-- Legs -->
      <rect x="75" y="185" width="10" height="30" rx="3" fill="#1e293b" />
      <rect x="95" y="185" width="10" height="30" rx="3" fill="#1e293b" />
      <!-- Shoes -->
      <path d="M 70 213 H 86 C 88 213 88 217 85 217 H 70 Z" fill="#0f172a" />
      <path d="M 94 213 H 110 C 112 213 112 217 109 217 H 94 Z" fill="#0f172a" />
    </g>

    <!-- CHARACTER 2 (Right: Surprised/Realizing the truth, hands up in realization) -->
    <g id="character-female">
      <!-- Body & Torso -->
      <path d="M 145 145 C 145 130 155 125 170 125 C 185 125 195 130 195 145 L 190 185 L 150 185 Z" fill="#ec4899" />
      <!-- Collar -->
      <path d="M 163 125 L 170 135 L 177 125 Z" fill="#ffffff" />

      <!-- Head & Neck -->
      <path d="M 165 115 H 175 V 128 H 165 Z" fill="url(#skin-2)" />
      <circle cx="170" cy="100" r="16" fill="url(#skin-2)" />

      <!-- Hair (Ponytail style) -->
      <path d="M 154 98 C 154 85 164 83 170 83 C 178 83 186 87 186 100 C 186 110 178 115 170 115 C 160 115 154 105 154 98 Z" fill="#78350f" />
      <!-- Ponytail extension -->
      <path d="M 183 95 C 195 90 200 100 195 110 C 190 112 185 105 183 95 Z" fill="#78350f" />

      <!-- Facial Expression (Realization / Surprised realization: Eyes wide, mouth in 'O' shape) -->
      <!-- Eyebrows raised high in surprise -->
      <path d="M 160 91 Q 164 88 168 91" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 172 91 Q 176 88 180 91" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Wide Eyes -->
      <circle cx="164" cy="96" r="2.5" fill="#451a03" />
      <circle cx="176" cy="96" r="2.5" fill="#451a03" />
      <!-- Surprised O mouth -->
      <ellipse cx="170" cy="104" rx="2.5" ry="3.5" fill="#451a03" />
      <!-- Embarrassed/Surprised Blush -->
      <ellipse cx="158" cy="101" rx="3.5" ry="1.5" fill="#f43f5e" opacity="0.5" />
      <ellipse cx="182" cy="101" rx="3.5" ry="1.5" fill="#f43f5e" opacity="0.5" />

      <!-- Arms & Gestures (Hands raised in surprised realization) -->
      <!-- Left Arm (Surprised gesture up) -->
      <path d="M 150 130 C 140 120 135 110 142 105" fill="none" stroke="#db2777" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="142" cy="103" r="4" fill="url(#skin-2)" />
      
      <!-- Right Arm (Hand gesturing near chin/chest) -->
      <path d="M 190 130 C 198 135 195 145 185 145" fill="none" stroke="#db2777" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="183" cy="145" r="4" fill="url(#skin-2)" />

      <!-- Legs -->
      <rect x="155" y="185" width="10" height="30" rx="3" fill="#1e293b" />
      <rect x="175" y="185" width="10" height="30" rx="3" fill="#1e293b" />
      <!-- Shoes -->
      <path d="M 150 213 H 166 C 168 213 168 217 165 217 H 150 Z" fill="#0f172a" />
      <path d="M 174 213 H 190 C 192 213 192 217 189 217 H 174 Z" fill="#0f172a" />
    </g>

    <!-- CONTEXT PROPS BETWEEN CHARACTERS -->
    <!-- Dropped/Misplaced Item on floor or table indicating the misunderstanding context (e.g., a mix-up of folders or files) -->
    <g id="prop-misunderstanding" transform="translate(122, 160)">
      <!-- Fallen open folder / papers -->
      <path d="M -10 15 L 10 10 L 15 25 L -5 30 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
      <path d="M -5 12 L 15 18 L 10 22 L -10 16 Z" fill="#ffffff" />
      <!-- Question mark visual metaphor integrated cleanly as a subtle glowing element floating between them -->
      <path d="M 0 -12 C -6 -12 -8 -6 -4 -2 C 0 2 0 6 -2 10" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="-2" cy="16" r="2" fill="#38bdf8" opacity="0.8" />
      
      <!-- Tiny sparkling clarity stars popping to show the misunderstanding is clearing up -->
      <path d="M 18 -10 L 20 -15 L 22 -10 L 27 -8 L 22 -6 L 20 -1 L 18 -6 L 13 -8 Z" fill="#fbbf24" opacity="0.9" />
      <path d="M -22 -5 L -21 -8 L -19 -5 L -16 -4 L -19 -3 L -21 0 L -22 -3 L -25 -4 Z" fill="#38bdf8" opacity="0.9" />
    </g>

  </g>

  <!-- Foreground Atmospheric Lighting Overlay -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" pointer-events="none" />
</svg>