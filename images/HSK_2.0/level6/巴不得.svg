<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="140" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="155" width="10" height="70" rx="2" fill="#475569"/>
  <rect x="200" y="155" width="10" height="70" rx="2" fill="#475569"/>
  
  <!-- Computer Screen -->
  <rect x="70" y="70" width="100" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="75" y="75" width="90" height="60" rx="3" fill="#1e293b"/>
  <!-- Calendar icon on screen -->
  <rect x="105" y="85" width="30" height="30" rx="4" fill="#fb923c"/>
  <rect x="105" y="85" width="30" height="8" rx="4" fill="#f59e0b"/>
  
  <!-- Character -->
  <!-- Head -->
  <circle cx="120" cy="60" r="25" fill="#fde68a"/>
  <!-- Eyes (Expressive/Longing) -->
  <ellipse cx="108" cy="55" rx="3" ry="5" fill="#1e293b"/>
  <ellipse cx="132" cy="55" rx="3" ry="5" fill="#1e293b"/>
  <!-- Mouth (Grin/Anxious) -->
  <path d="M 108 70 Q 120 75 132 70" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Body/Arms -->
  <path d="M 95 100 L 70 140" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
  <path d="M 145 100 L 170 140" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
  <circle cx="120" cy="110" r="30" fill="#3b82f6"/>
  
  <!-- Clock on wall -->
  <circle cx="200" cy="40" r="20" fill="#334155"/>
  <circle cx="200" cy="40" r="17" fill="#1e293b"/>
  <line x1="200" y1="40" x2="200" y2="28" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="40" x2="212" y2="40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Floating "Vacation" symbols -->
  <circle cx="50" cy="50" r="5" fill="#10b981"/>
  <circle cx="40" cy="60" r="3" fill="#10b981"/>
  <circle cx="190" cy="100" r="6" fill="#ec4899"/>
  <circle cx="210" cy="90" r="4" fill="#ec4899"/>
  
  <!-- Desk clutter -->
  <rect x="40" y="145" width="20" height="5" rx="1" fill="#94a3b8"/>
  <rect x="180" y="145" width="15" height="10" rx="1" fill="#fbbf24"/>
</svg>