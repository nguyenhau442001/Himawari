<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Display Case Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Museum / Gallery Interior -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Floor and Wall separation -->
  <path d="M0,170 L240,170 L240,240 L0,240 Z" fill="#090d16"/>
  <!-- Wall grid detail -->
  <path d="M0,170 L240,170" stroke="#334155" stroke-width="1.5" opacity="0.4"/>

  <!-- Museum Display Pedestal & Broken Glass Case -->
  <g id="display-case" filter="url(#shadow)">
    <!-- Pedestal Base -->
    <rect x="70" y="140" width="100" height="40" rx="4" fill="#334155"/>
    <rect x="65" y="135" width="110" height="8" rx="2" fill="#475569"/>
    
    <!-- Stolen Object (Golden Gem / Artifact) on pedestal -->
    <circle cx="120" cy="120" r="12" fill="#fbbf24" filter="url(#shadow)"/>
    <path d="M120,105 L124,115 L134,120 L124,125 L120,135 L116,125 L106,120 L116,115 Z" fill="#fef08a"/>

    <!-- Shattered Glass Dome / Case -->
    <!-- Back glass outline -->
    <path d="M85,135 L85,90 Q120,60 155,90 L155,135" fill="url(#glassGrad)" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- Flying glass shards (Caught in action!) -->
    <path d="M95,85 L105,75 L110,88 Z" fill="#bae6fd" opacity="0.8"/>
    <path d="M145,70 L155,80 L140,85 Z" fill="#bae6fd" opacity="0.8"/>
    <path d="M125,55 L135,62 L120,68 Z" fill="#e0f2fe" opacity="0.9"/>
    <path d="M75,100 L68,90 L80,95 Z" fill="#bae6fd" opacity="0.7"/>
  </g>

  <!-- Caught in the act: Thief Character -->
  <g id="thief" filter="url(#shadow)">
    <!-- Thief Body (Mid-action, caught, startled) -->
    <!-- Legs in dynamic awkward stance -->
    <path d="M100,170 L90,210 L105,212 L112,175" fill="#1e293b"/>
    <path d="M130,170 L145,205 L132,208 L122,175" fill="#1e293b"/>
    <!-- Shoes -->
    <ellipse cx="98" cy="213" rx="10" ry="4" fill="#0f172a"/>
    <ellipse cx="138" cy="209" rx="10" ry="4" fill="#0f172a"/>

    <!-- Torso (Classic striped thief sweater) -->
    <path d="M95,125 L145,125 L140,175 L100,175 Z" fill="#f8fafc"/>
    <!-- Stripes -->
    <path d="M96,135 L143,135 M97,145 L142,145 M98,155 L141,155 M99,165 L140,165" stroke="#334155" stroke-width="4"/>

    <!-- Arms caught holding the loot -->
    <!-- Left arm raised defensively -->
    <path d="M95,130 L75,110 L85,105 L100,125" fill="#f8fafc"/>
    <circle cx="73" cy="107" r="6" fill="#fca5a5"/> <!-- Hand -->

    <!-- Right arm clutching the golden gem tightly -->
    <path d="M145,130 L165,115 L155,105 L140,120" fill="#f8fafc"/>
    <circle cx="167" cy="113" r="6" fill="#fca5a5"/> <!-- Hand -->
    <!-- The stolen gem in hand -->
    <circle cx="170" cy="105" r="7" fill="#fbbf24"/>

    <!-- Head & Face (Shocked expression: wide eyes, open mouth, sweat drop) -->
    <circle cx="120" cy="95" r="18" fill="#fca5a5"/>
    <!-- Thief Mask (Classic eye mask) -->
    <path d="M103,88 Q120,82 137,88 L138,98 Q120,92 102,98 Z" fill="#0f172a"/>
    <!-- Wide startled eyes -->
    <circle cx="112" cy="92" r="3.5" fill="#ffffff"/>
    <circle cx="113" cy="92" r="1.5" fill="#0f172a"/>
    <circle cx="128" cy="92" r="3.5" fill="#ffffff"/>
    <circle cx="127" cy="92" r="1.5" fill="#0f172a"/>
    <!-- Shocked open mouth 'O' -->
    <ellipse cx="120" cy="104" rx="4" ry="6" fill="#7f1d1d"/>
    <!-- Sweat drop of panic -->
    <path d="M136,80 Q140,85 136,90 Q132,85 136,80 Z" fill="#38bdf8"/>

    <!-- Thief Beanie / Hat -->
    <path d="M102,90 Q120,70 138,90 L136,95 Q120,80 104,95 Z" fill="#0f172a"/>
  </g>

  <!-- Security Guard Character (Busted! Pointing the flashlight/hand) -->
  <g id="guard" filter="url(#shadow)">
    <!-- Guard Body (Authoritative stance on the left) -->
    <!-- Legs -->
    <path d="M35,160 L30,215 L45,215 L48,165" fill="#1e3a8a"/>
    <path d="M55,160 L60,210 L75,210 L62,165" fill="#1e3a8a"/>
    <ellipse cx="38" cy="216" rx="9" ry="4" fill="#0f172a"/>
    <ellipse cx="68" cy="211" rx="9" ry="4" fill="#0f172a"/>

    <!-- Torso (Uniform) -->
    <path d="M30,115 L70,115 L65,165 L35,165 Z" fill="#2563eb"/>
    <!-- Badge / Belt details -->
    <rect x="45" y="155" width="20" height="6" fill="#fbbf24" rx="2"/>

    <!-- Pointing Arm directly at thief ("Gotcha!") -->
    <path d="M60,125 L95,115 L90,105 L55,120" fill="#2563eb"/>
    <!-- Pointing Hand & Index Finger -->
    <circle cx="97" cy="113" r="5" fill="#f87171"/>
    <path d="M100,113 L110,111 L100,109 Z" fill="#f87171"/>

    <!-- Head & Cap -->
    <circle cx="50" cy="95" r="16" fill="#f87171"/>
    <!-- Security Cap -->
    <path d="M36,88 Q50,78 64,88 L68,92 Q50,86 32,92 Z" fill="#1e3a8a"/>
    <path d="M40,88 L60,88 L65,83 L35,83 Z" fill="#1e3a8a"/> <!-- Peak -->
    <ellipse cx="50" cy="85" r="5" fill="#fbbf24"/> <!-- Cap badge -->

    <!-- Guard Face (Determined / Stern) -->
    <!-- Determined Eyebrows -->
    <path d="M42,93 L50,96" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round"/>
    <!-- Confident Eyes -->
    <circle cx="45" cy="97" r="2" fill="#0f172a"/>
    <!-- Smirk / Stern Mouth -->
    <path d="M44,103 Q48,105 52,102" stroke="#7f1d1d" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Dramatic Action Effects (Alarm / Caught Moment) -->
  <g id="effects">
    <!-- Red Alarm Light Beam from top right -->
    <polygon points="240,0 180,0 130,80 240,80" fill="#ef4444" opacity="0.15"/>
    <circle cx="210" cy="30" r="12" fill="#ef4444" filter="url(#shadow)" opacity="0.9"/>
    <circle cx="210" cy="30" r="6" fill="#f87171"/>
    
    <!-- Action Burst / Busted Indicator above thief -->
    <path d="M120,60 L124,48 L136,52 L128,40 L138,32 L125,32 L120,20 L115,32 L102,32 L112,40 L104,52 L116,48 Z" fill="#fbbf24" filter="url(#shadow)"/>
  </g>
</svg>