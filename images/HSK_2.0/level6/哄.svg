<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Night Glow & Window -->
  <circle cx="120" cy="120" r="110" fill="#1e293b" opacity="0.4"/>
  
  <!-- Window with Night Sky & Moon -->
  <g transform="translate(145, 25)">
    <rect x="0" y="0" width="70" height="85" rx="8" fill="#0b1329" stroke="#334155" stroke-width="3"/>
    <!-- Moon & Stars -->
    <circle cx="50" cy="25" r="10" fill="#fbbf24" opacity="0.9"/>
    <circle cx="20" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="35" cy="65" r="1" fill="#ffffff" opacity="0.6"/>
    <!-- Window frame grid -->
    <line x1="35" y1="0" x2="35" y2="85" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="42" x2="70" y2="42" stroke="#334155" stroke-width="2"/>
    <!-- Curtains -->
    <path d="M0 0 Q10 40 0 85" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 0 Q60 40 70 85" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Bedroom Interior Details -->
  <!-- Wallpaper subtle pattern lines -->
  <path d="M30 0 L30 240 M70 0 L70 240 M110 0 L110 240" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>

  <!-- Bookshelf / Toy shelf in background -->
  <rect x="20" y="40" width="45" height="110" rx="4" fill="#1a233a"/>
  <rect x="25" y="70" width="35" height="6" fill="#334155"/>
  <rect x="25" y="105" width="35" height="6" fill="#334155"/>
  <!-- Toys on shelf -->
  <circle cx="35" cy="92" r="8" fill="#f43f5e"/>
  <rect x="45" y="85" width="10" height="20" rx="2" fill="#38bdf8"/>

  <!-- Warm Nursery Floor Lamp -->
  <path d="M210 180 L210 225" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M195 180 L225 180" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 150 L220 150 L225 180 L195 180 Z" fill="#fbbf24" opacity="0.85"/>
  <!-- Light cone gradient / glow -->
  <path d="M200 150 L220 150 L240 230 L160 230 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- Crib -->
  <g transform="translate(15, 130)">
    <!-- Crib Back -->
    <rect x="0" y="20" width="130" height="70" rx="6" fill="#334155"/>
    <!-- Crib Bars -->
    <line x1="15" y1="20" x2="15" y2="90" stroke="#1e293b" stroke-width="3"/>
    <line x1="30" y1="20" x2="30" y2="90" stroke="#1e293b" stroke-width="3"/>
    <line x1="45" y1="20" x2="45" y2="90" stroke="#1e293b" stroke-width="3"/>
    <line x1="60" y1="20" x2="60" y2="90" stroke="#1e293b" stroke-width="3"/>
    <line x1="75" y1="20" x2="75" y2="90" stroke="#1e293b" stroke-width="3"/>
    <line x1="90" y1="20" x2="90" y2="90" stroke="#1e293b" stroke-width="3"/>
    <line x1="105" y1="20" x2="105" y2="90" stroke="#1e293b" stroke-width="3"/>
    <line x1="120" y1="20" x2="120" y2="90" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Crib Mattress & Pillow -->
    <rect x="10" y="65" width="110" height="35" rx="6" fill="#cbd5e1"/>
    <rect x="15" y="70" width="30" height="20" rx="8" fill="#f8fafc"/>
    
    <!-- Sleeping Baby -->
    <g transform="translate(20, 68)">
      <!-- Baby Head -->
      <circle cx="25" cy="12" r="11" fill="#fbcfe8"/>
      <!-- Closed Eyes (sleeping arch) -->
      <path d="M21 13 Q24 16 27 13" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Cute flush cheek -->
      <circle cx="28" cy="16" r="3" fill="#f43f5e" opacity="0.4"/>
      <!-- Baby Blanket -->
      <path d="M10 15 Q25 5 45 15 L50 32 L5 32 Z" fill="#38bdf8"/>
      <!-- Little Teddy bear next to baby -->
      <circle cx="85" cy="20" r="7" fill="#b45309"/>
      <circle cx="80" cy="15" r="3" fill="#b45309"/>
      <circle cx="90" cy="15" r="3" fill="#b45309"/>
    </g>

    <!-- Crib Front Frame -->
    <rect x="5" y="85" width="120" height="15" rx="4" fill="#475569"/>
  </g>

  <!-- Mother Character (Seated beside crib, comforting/soothing) -->
  <g transform="translate(75, 100)">
    <!-- Mother Body / Torso -->
    <path d="M35 50 Q30 75 40 110 L70 110 Q65 75 60 50 Z" fill="#ec4899"/>
    <!-- Mother Arm Reaching to Crib (Gentle patting gesture) -->
    <path d="M45 55 Q20 60 -5 75 Q-15 80 -10 85 Q-5 85 10 75 Q30 65 50 65 Z" fill="#fbcfe8"/>
    <!-- Hand -->
    <circle cx="-12" cy="85" r="5" fill="#fbcfe8"/>
    
    <!-- Mother Head & Hair -->
    <circle cx="50" cy="30" r="15" fill="#fbcfe8"/>
    <!-- Hair Bun -->
    <circle cx="65" cy="22" r="7" fill="#1e293b"/>
    <!-- Hair Base -->
    <path d="M35 30 Q35 15 50 15 Q65 15 63 35 Q50 38 38 35 Z" fill="#1e293b"/>
    <!-- Mother Face Profile (Soft, loving expression) -->
    <path d="M57 32 Q61 32 59 36" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round"/> <!-- Closed loving eye -->
    <path d="M62 40 Q59 42 56 40" fill="none" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round"/> <!-- Gentle smile -->
    <circle cx="55" cy="38" r="3" fill="#f43f5e" opacity="0.4"/> <!-- Cheek -->

    <!-- Mother Chair/Stool -->
    <rect x="30" y="100" width="45" height="12" rx="4" fill="#334155"/>
    <line x1="38" y1="112" x2="30" y2="135" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="67" y1="112" x2="75" y2="135" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Mother Legs -->
    <path d="M45 110 L38 135 L50 135 Z" fill="#1e293b"/>
  </g>

  <!-- Floating Gentle Zzz / Soothing Musical Notes (representing the action of "哄" - soothing to sleep) -->
  <g transform="translate(45, 75)">
    <!-- Musical Note 1 -->
    <path d="M0 15 Q5 10 5 0 L15 3 L15 15 Q15 20 10 20 Q5 20 5 15 Q5 10 10 10" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="5" cy="18" r="3.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="15" cy="15" r="3.5" fill="#fbbf24" opacity="0.9"/>

    <!-- Small heart or sparkle of warmth -->
    <path d="M40 -10 Q45 -18 52 -10 Q58 -2 52 5 Q45 12 40 5 Z" fill="#f43f5e" opacity="0.7" transform="scale(0.6) translate(20, -5)"/>
  </g>

  <!-- Ambient floor rug -->
  <ellipse cx="100" cy="230" rx="80" ry="8" fill="#334155" opacity="0.6"/>
</svg>