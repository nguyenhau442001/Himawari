<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/circle for focus -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.6"/>

  <!-- Main Object: Sleek Modern Briefcase / Administrative Affairs Symbol -->
  <!-- Shadow/Base -->
  <ellipse cx="120" cy="180" rx="45" ry="8" fill="#111317" opacity="0.8"/>

  <!-- Briefcase Body (Back layer) -->
  <rect x="75" y="85" width="90" height="65" rx="8" fill="#2C3440"/>
  
  <!-- Briefcase Metal Clasp & Lock Details -->
  <path d="M110,85 L130,85 L130,95 L110,95 Z" fill="#E5A93B"/>
  <circle cx="120" cy="90" r="2.5" fill="#1A1D24"/>

  <!-- Briefcase Front Flap / Opening Line -->
  <path d="M75,115 Q120,125 165,115" stroke="#1A1D24" stroke-width="2" fill="none"/>

  <!-- Briefcase Main Body (Front layer with gradient/highlight feel) -->
  <rect x="70" y="95" width="100" height="75" rx="10" fill="#343E4D"/>
  
  <!-- Subtle accent lines representing files/organization inside -->
  <rect x="85" y="78" width="70" height="10" rx="3" fill="#E5A93B" opacity="0.9"/>
  <rect x="92" y="72" width="56" height="8" rx="2" fill="#526077"/>

  <!-- Briefcase Handle -->
  <path d="M95,95 L95,78 C95,72 145,72 145,78 L145,95" stroke="#E5A93B" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Document/Task Checklist floating to signify "Affairs/Work" (事务) -->
  <g transform="translate(145, 110)">
    <!-- Document background -->
    <rect x="0" y="0" width="45" height="55" rx="6" fill="#FFFFFF"/>
    <!-- Checkmarks & Lines -->
    <!-- Line 1 -->
    <circle cx="10" cy="15" r="4" fill="#22C55E"/>
    <path d="M8,15 L10,17 L14,12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="13" width="18" height="4" rx="2" fill="#CBD5E1"/>
    
    <!-- Line 2 -->
    <circle cx="10" cy="27" r="4" fill="#22C55E"/>
    <path d="M8,27 L10,29 L14,24" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="25" width="14" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Line 3 (Pending) -->
    <circle cx="10" cy="39" r="4" fill="#E5A93B"/>
    <rect x="18" y="37" width="16" height="4" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Floating accent dots for modern flat vector educational feel -->
  <circle cx="55" cy="85" r="4" fill="#E5A93B" opacity="0.8"/>
  <circle cx="65" cy="70" r="2.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="185" cy="90" r="3" fill="#38BDF8" opacity="0.9"/>
  <circle cx="50" cy="140" r="3.5" fill="#E5A93B" opacity="0.6"/>
</svg>