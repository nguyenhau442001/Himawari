<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Interior Room Background -->
  <!-- Floor -->
  <polygon points="0,180 240,180 240,240 0,240" fill="#1e293b"/>
  <!-- Wall -->
  <rect x="0" y="0" width="240" height="180" fill="#0f172a"/>
  
  <!-- Room Details: Bookshelf in background -->
  <rect x="25" y="40" width="70" height="120" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="70" width="60" height="8" fill="#475569" opacity="0.4"/>
  <rect x="30" y="110" width="60" height="8" fill="#475569" opacity="0.4"/>
  <rect x="30" y="145" width="60" height="8" fill="#475569" opacity="0.4"/>
  
  <!-- Desk/Table workspace for parent -->
  <rect x="110" y="130" width="115" height="12" rx="2" fill="#64748b"/>
  <rect x="125" y="142" width="12" height="40" fill="#475569"/>
  <rect x="200" y="142" width="12" height="40" fill="#475569"/>
  
  <!-- Desk Props: Laptop, Papers, Lamp -->
  <!-- Laptop -->
  <path d="M 135 125 L 175 125 L 180 130 L 130 130 Z" fill="#94a3b8"/>
  <rect x="140" y="105" width="30" height="20" rx="2" fill="#cbd5e1"/>
  <!-- Papers scattered -->
  <rect x="182" y="122" width="18" height="10" rx="1" fill="#f8fafc" transform="rotate(-10 182 122)"/>
  <rect x="190" y="120" width="16" height="12" rx="1" fill="#e2e8f0" transform="rotate(15 190 120)"/>
  
  <!-- TARGET SCENE: Adult/Parent working & Child 'gây rối' (making a mess / climbing) -->
  
  <!-- Parent Character (Stressed / Warning) -->
  <!-- Body & Chair -->
  <rect x="145" y="100" width="32" height="45" rx="8" fill="#0284c7"/>
  <circle cx="161" cy="85" r="14" fill="#fed7aa"/> <!-- Head -->
  <!-- Hair -->
  <path d="M 147 80 C 147 70, 175 70, 175 80 Z" fill="#334155"/>
  <!-- Hand gesturing stop / talking -->
  <path d="M 138 105 C 130 105, 130 95, 135 90" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Mischievous Child Character (Gây rối - climbing on the desk and knocking things over) -->
  <!-- Child Body -->
  <circle cx="130" cy="115" r="11" fill="#fde047"/> <!-- Head -->
  <path d="M 121 110 C 120 100, 140 100, 139 110" fill="#ea580c"/> <!-- Wild child hair -->
  
  <!-- Torso & Arms reaching for the laptop/papers -->
  <path d="M 120 125 C 115 115, 130 110, 135 125 Z" fill="#ec4899"/>
  <!-- Arms actively pushing/swatting papers -->
  <path d="M 132 120 L 155 115" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  <path d="M 125 125 L 145 130" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Flying paper / Mess being made -->
  <rect x="155" y="95" width="14" height="10" rx="1" fill="#f8fafc" transform="rotate(-45 155 95)"/>
  <circle cx="170" cy="100" r="2" fill="#38bdf8"/>
  <circle cx="145" y="85" r="2.5" fill="#f43f5e"/>
  
  <!-- Action lines / Dynamic visual cues for disruption -->
  <path d="M 115 105 Q 110 100 118 95" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 112 115 Q 105 112 110 105" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Foreground Plant for framing -->
  <path d="M 0 240 Q 15 190 35 240 Z" fill="#065f46"/>
  <path d="M 15 240 Q 25 180 50 210 Z" fill="#047857"/>
  <ellipse cx="25" cy="195" rx="8" ry="14" fill="#10b981" transform="rotate(-20 25 195)"/>
  <ellipse cx="40" cy="205" rx="6" ry="12" fill="#34d399" transform="rotate(30 40 205)"/>
  
  <!-- Ambient lighting/glow effects -->
  <circle cx="161" cy="85" r="25" fill="#f59e0b" opacity="0.08" filter="blur(8px)"/>
</svg>