<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Central Satellite Body -->
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#FFB800"/>
    <circle cx="0" cy="0" r="10" fill="#1A1D24"/>
    
    <!-- Solar Panels -->
    <rect x="-60" y="-10" width="30" height="20" rx="2" fill="#4A90E2"/>
    <rect x="30" y="-10" width="30" height="20" rx="2" fill="#4A90E2"/>
    
    <!-- Antenna/Signal -->
    <path d="M0 -20 L0 -40 M-10 -40 L10 -40" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-40" r="3" fill="#FFB800"/>
    
    <!-- Orbital Path Ring -->
    <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Signal Waves -->
    <path d="M15 -15 Q30 -30 45 -15" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.6"/>
    <path d="M20 -10 Q35 -25 50 -10" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.4"/>
  </g>
</svg>