<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Night Sky Atmosphere -->
  <circle cx="200" cy="40" r="2" fill="#f8fafc" opacity="0.3"/>
  <circle cx="180" cy="60" r="1" fill="#f8fafc" opacity="0.5"/>
  <circle cx="40" cy="80" r="1.5" fill="#f8fafc" opacity="0.4"/>
  
  <!-- Radar Screen (The Radar) -->
  <circle cx="120" cy="180" r="45" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="120" cy="180" r="30" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="120" cy="180" r="15" fill="none" stroke="#1e293b" stroke-width="1"/>
  <line x1="120" y1="135" x2="120" y2="225" stroke="#1e293b" stroke-width="1"/>
  <line x1="75" y1="180" x2="165" y2="180" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Radar Sweep -->
  <path d="M120 180 L165 180 A45 45 0 0 0 120 135 Z" fill="#38bdf8" opacity="0.2"/>
  <circle cx="150" cy="150" r="3" fill="#fbbf24"/>
  
  <!-- Airplane -->
  <g transform="translate(120, 80)">
    <path d="M-20 0 L20 0 L10 -5 L-10 -5 Z" fill="#f1f5f9"/>
    <path d="M-5 -5 L5 -5 L0 -15 Z" fill="#f1f5f9"/>
    <path d="M-20 0 L-25 5 L-15 5 Z" fill="#f1f5f9"/>
    <path d="M20 0 L25 5 L15 5 Z" fill="#f1f5f9"/>
  </g>
  
  <!-- Navigation Beam -->
  <line x1="120" y1="80" x2="150" y2="150" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Pilot/Controller Character (Simplified) -->
  <g transform="translate(60, 160)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24"/>
    <rect x="-15" y="10" width="30" height="40" rx="5" fill="#334155"/>
    <circle cx="-5" cy="-2" r="2" fill="#0f172a"/>
    <circle cx="5" cy="-2" r="2" fill="#0f172a"/>
    <path d="M-5 5 Q0 8 5 5" stroke="#0f172a" stroke-width="1" fill="none"/>
  </g>
</svg>