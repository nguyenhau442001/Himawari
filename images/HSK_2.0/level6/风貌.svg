<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Skyline Gradient - Old to New Transition -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background light representing renewal/modernity -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="170" cy="90" r="50" fill="#10b981" opacity="0.1" filter="url(#glow)" />

  <!-- Urban Environment / Cityscape Background (New Look / 风貌) -->
  <g id="cityscape" opacity="0.45">
    <!-- Traditional/Old silhouette baseline (fading out left) -->
    <path d="M 15 170 L 15 150 L 25 150 L 25 140 L 35 140 L 35 170 Z" fill="#64748b" />
    <path d="M 38 170 L 38 130 L 48 120 L 58 130 L 58 170 Z" fill="#64748b" />
    
    <!-- Modern skyscrapers rising (New Face / 新风貌) -->
    <rect x="65" y="100" width="22" height="70" fill="#334155" rx="2" />
    <rect x="70" y="108" width="5" height="8" fill="#38bdf8" opacity="0.6" />
    <rect x="79" y="108" width="5" height="8" fill="#38bdf8" opacity="0.6" />
    <rect x="70" y="122" width="5" height="8" fill="#38bdf8" opacity="0.6" />
    <rect x="79" y="122" width="5" height="8" fill="#38bdf8" opacity="0.6" />

    <!-- Iconic Modern Tower with curved/dynamic architecture -->
    <path d="M 92 170 L 96 60 Q 98 50 102 50 Q 106 50 108 60 L 112 170 Z" fill="url(#skyGrad)" opacity="0.8" />
    <!-- Glowing antenna on modern tower -->
    <line x1="102" y1="50" x2="102" y2="38" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" filter="url(#softGlow)" />
    <circle cx="102" cy="37" r="2" fill="#f59e0b" filter="url(#glow)" />

    <!-- Futuristic Glass Building -->
    <polygon points="120,170 120,85 145,105 145,170" fill="#1e293b" stroke="#38bdf8" stroke-width="0.75" opacity="0.9" />
    <line x1="128" y1="100" x2="137" y2="107" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="128" y1="120" x2="137" y2="127" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="128" y1="140" x2="137" y2="147" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

    <!-- Background futuristic dome / green tech structure -->
    <path d="M 160 170 C 160 135 180 120 200 120 C 220 120 240 135 240 170 Z" fill="#065f46" opacity="0.4" />
    <path d="M 160 170 C 160 135 180 120 200 120 C 220 120 240 135 240 170 Z" fill="none" stroke="#10b981" stroke-width="1" opacity="0.7" />
  </g>

  <!-- Foreground Park / Elevated Scenic Overlook Platform -->
  <g id="platform">
    <!-- Ground / Terrace base -->
    <path d="M -10 170 Q 120 160 250 170 L 250 240 L -10 240 Z" fill="#0f172a" />
    <path d="M 0 170 Q 120 162 240 170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <!-- Railing / Modern Architecture details -->
    <line x1="20" y1="175" x2="220" y2="175" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />
  </g>

  <!-- Context Props: Smart Tablet / Urban Planning Display (Showing the "New Look") -->
  <g id="planning-tablet" transform="translate(135, 125)">
    <!-- Stand -->
    <path d="M 15 42 L 25 55 L 5 55 Z" fill="#475569" />
    <!-- Tablet Body -->
    <rect x="-5" y="2" width="40" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Screen graphic (Abstract City Blueprint) -->
    <rect x="0" y="7" width="30" height="32" fill="#1e293b" rx="2" />
    <polyline points="3,30 10,20 17,25 27,12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="27" cy="12" r="2.5" fill="#f59e0b" filter="url(#softGlow)" />
  </g>

  <!-- Foreground Characters: Architect / Observer admiring the new city appearance -->
  <g id="characters">
    <!-- Character 1 (Architect / Planner - pointing forward proudly) -->
    <g id="character-main" transform="translate(65, 115)">
      <!-- Shadow -->
      <ellipse cx="18" cy="57" rx="14" ry="4" fill="#000000" opacity="0.4" />

      <!-- Legs -->
      <rect x="10" y="38" width="6" height="20" fill="#334155" rx="3" />
      <rect x="20" y="38" width="6" height="20" fill="#334155" rx="3" />
      <!-- Shoes -->
      <path d="M 7 56 L 13 56 C 15 56 15 58 13 58 L 7 58 Z" fill="#0f172a" />
      <path d="M 17 56 L 23 56 C 25 56 25 58 23 58 L 17 58 Z" fill="#0f172a" />

      <!-- Torso / Jacket -->
      <path d="M 10 16 Q 8 16 7 22 L 9 40 C 9 41 27 41 27 40 L 29 22 Q 28 16 26 16 Z" fill="#fb923c" />
      <!-- Inner shirt accent -->
      <path d="M 15 16 L 15 28 L 21 28 L 21 16 Z" fill="#f8fafc" />

      <!-- Head -->
      <circle cx="18" cy="9" r="8" fill="#fcd34d" />
      <!-- Friendly facial expression (smiling, gazing forward) -->
      <path d="M 21 9 Q 23 10 22 12" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />

      <!-- Modern Stylish Hair -->
      <path d="M 10 7 C 11 3 16 2 21 4 C 25 5 26 8 26 8 C 26 8 24 6 21 5 C 16 3 12 5 10 7 Z" fill="#334155" />

      <!-- Back Arm (Holding tablet base or resting) -->
      <path d="M 10 18 L 2 28" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" />

      <!-- Front Arm (Pointing enthusiastically towards the new city) -->
      <path d="M 26 18 Q 36 15 42 22" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="43" cy="23" r="2.5" fill="#fcd34d" />
    </g>

    <!-- Character 2 (Colleague / Resident - smiling and observing) -->
    <g id="character-secondary" transform="translate(100, 125)">
      <!-- Shadow -->
      <ellipse cx="14" cy="47" rx="12" ry="3.5" fill="#000000" opacity="0.4" />

      <!-- Legs -->
      <rect x="8" y="30" width="5" height="18" fill="#1e293b" rx="2.5" />
      <rect x="16" y="30" width="5" height="18" fill="#1e293b" rx="2.5" />

      <!-- Torso -->
      <path d="M 8 14 Q 7 14 6 18 L 8 32 C 8 33 22 33 22 32 L 24 18 Q 23 14 22 14 Z" fill="#38bdf8" />

      <!-- Head -->
      <circle cx="15" cy="7" r="7" fill="#fcd34d" />
      <path d="M 10 5 Q 12 7 14 5" fill="none" stroke="#0f172a" stroke-width="1" stroke-linecap="round" />

      <!-- Hair (Ponytail) -->
      <path d="M 9 5 C 9 1 15 1 18 4 C 20 6 22 5 24 3 C 22 8 17 9 13 8 Z" fill="#0f172a" />

      <!-- Arms crossed or relaxed happily -->
      <path d="M 8 16 Q 15 22 22 16" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Foreground Nature Accent (Vibrant plants framing the scene, symbolizing growth) -->
  <g id="foliage" opacity="0.9">
    <!-- Left Plant -->
    <path d="M -5 200 Q 10 180 20 240 Z" fill="#065f46" />
    <path d="M 5 210 Q 15 170 35 185 Q 20 200 5 210 Z" fill="#10b981" />
    <path d="M -2 225 Q 12 195 25 205 Q 10 220 -2 225 Z" fill="#34d399" />

    <!-- Right Plant -->
    <path d="M 235 210 Q 225 185 210 240 Z" fill="#065f46" />
    <path d="M 220 215 Q 210 175 190 190 Q 205 205 220 215 Z" fill="#10b981" />
  </g>

  <!-- Dynamic Sparkles / Highlights representing "New Look / Vitality" (风貌) -->
  <g id="sparkles">
    <path d="M 160 70 L 163 76 L 169 79 L 163 82 L 160 88 L 157 82 L 151 79 L 157 76 Z" fill="#f59e0b" filter="url(#glow)" opacity="0.9" />
    <path d="M 75 85 L 77 89 L 81 91 L 77 93 L 75 97 L 73 93 L 69 91 L 73 89 Z" fill="#38bdf8" filter="url(#glow)" opacity="0.8" />
    <circle cx="195" cy="105" r="2" fill="#fbbf24" filter="url(#softGlow)" />
    <circle cx="50" cy="115" r="1.5" fill="#38bdf8" filter="url(#softGlow)" />
  </g>
</svg>