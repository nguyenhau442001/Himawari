<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Character 1 (The one being reassured) -->
  <g transform="translate(40, 60)">
    <circle cx="30" cy="30" r="25" fill="#fb923c"/>
    <path d="M15 45 Q30 55 45 45" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="4" fill="#0f172a"/>
    <circle cx="40" cy="25" r="4" fill="#0f172a"/>
    <rect x="10" y="70" width="40" height="60" rx="10" fill="#64748b"/>
  </g>
  
  <!-- Character 2 (The one reassuring) -->
  <g transform="translate(140, 60)">
    <circle cx="30" cy="30" r="25" fill="#38bdf8"/>
    <path d="M15 35 Q30 45 45 35" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="4" fill="#0f172a"/>
    <circle cx="40" cy="25" r="4" fill="#0f172a"/>
    <rect x="10" y="70" width="40" height="60" rx="10" fill="#0ea5e9"/>
    <!-- Hand gesture of reassurance -->
    <path d="M-10 60 L-30 50" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Context Props -->
  <rect x="160" y="170" width="40" height="50" rx="4" fill="#f59e0b"/>
  <circle cx="180" cy="195" r="15" fill="#fbbf24"/>
  <path d="M170 195 L190 195 M180 185 L180 205" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <rect x="50" y="180" width="30" height="40" rx="4" fill="#ec4899"/>
  <circle cx="65" cy="200" r="8" fill="#fbcfe8"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.5"/>
</svg>