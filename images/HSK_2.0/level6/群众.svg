<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="roomLight" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>

    <!-- Window Outdoor Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Connection Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Backdrop -->
  <rect x="15" y="15" width="210" height="155" rx="12" fill="url(#roomLight)" />

  <!-- Window with City/Greenery Silhouette -->
  <g transform="translate(90, 25)">
    <rect x="0" y="0" width="60" height="70" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#475569" stroke-width="2" />
    <rect x="4" y="4" width="52" height="62" rx="4" fill="url(#windowGlow)" />
    <!-- Window Panes -->
    <line x1="30" y1="4" x2="30" y2="66" stroke="#475569" stroke-width="2" />
    <line x1="4" y1="35" x2="56" y2="35" stroke="#475569" stroke-width="2" />
    <!-- Plant outside window sill -->
    <path d="M20 66 Q30 50 40 66 Z" fill="#10b981" />
  </g>

  <!-- Hanging Wall Bulletin / Notice Board -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="45" height="35" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <rect x="6" y="6" width="33" height="23" fill="#cbd5e1" rx="2" />
    <!-- Mini note lines -->
    <line x1="10" y1="10" x2="25" y2="10" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="16" x2="30" y2="16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="22" x2="20" y2="22" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Push pin -->
    <circle cx="22" cy="6" r="2" fill="#ef4444" />
  </g>

  <!-- Bookshelf on Right Wall -->
  <g transform="translate(165, 35)">
    <rect x="0" y="0" width="40" height="50" fill="none" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="25" x2="40" y2="25" stroke="#475569" stroke-width="2" />
    <!-- Books -->
    <rect x="5" y="10" width="6" height="15" rx="1" fill="#f59e0b" />
    <rect x="12" y="8" width="8" height="17" rx="1" fill="#38bdf8" />
    <rect x="22" y="12" width="5" height="13" rx="1" fill="#ec4899" />
    <rect x="5" y="32" width="7" height="18" rx="1" fill="#10b981" />
    <rect x="14" y="35" width="6" height="15" rx="1" fill="#cbd5e1" />
  </g>

  <!-- Consultation Desk -->
  <g filter="url(#shadow)">
    <!-- Desk Legs -->
    <rect x="65" y="145" width="8" height="35" fill="#334155" />
    <rect x="167" y="145" width="8" height="35" fill="#334155" />
    <!-- Desk Top Surface -->
    <path d="M50 135 L190 135 L195 145 L45 145 Z" fill="url(#woodGrad)" />
    <!-- Desk Front Panel -->
    <rect x="50" y="145" width="140" height="25" fill="#92400e" />
    <!-- Props on Desk: Laptop & Documents -->
    <rect x="90" y="125" width="30" height="12" rx="1" fill="#cbd5e1" />
    <polygon points="85,137 125,137 130,145 80,145" fill="#94a3b8" />
    <rect x="135" y="130" width="16" height="10" rx="1" fill="#f8fafc" />
    <circle cx="110" cy="115" r="8" fill="#fef08a" opacity="0.8" /> <!-- Desk Lamp Glow -->
  </g>

  <!-- CONNECTION / BOND VISUALIZATION (MEIYI LIANXI - "密切联系") -->
  <!-- Glowing energetic bridge between official and citizens -->
  <path d="M85 110 Q120 85 155 110" fill="none" stroke="url(#beamGrad)" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round" filter="url(#shadow)">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="2s" repeatCount="indefinite" />
  </path>
  <circle cx="120" cy="92" r="5" fill="#f59e0b" filter="url(#shadow)" />
  <path d="M117 92 L120 95 L124 89" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- LEFT CHARACTER: Cán bộ (Cadre / Official) -->
  <g id="official" transform="translate(50, 85)" filter="url(#shadow)">
    <!-- Body/Suit -->
    <path d="M25 35 L45 35 L48 70 L22 70 Z" fill="#0284c7" /> <!-- Suit jacket -->
    <path d="M30 35 L35 48 L40 35 Z" fill="#f8fafc" /> <!-- Shirt collar -->
    <polygon points="35,42 33,55 37,55" fill="#ef4444" /> <!-- Red Tie -->
    
    <!-- Head & Face -->
    <circle cx="35" cy="20" r="13" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M22 20 C22 10 32 8 45 14 C40 10 30 10 25 15 Z" fill="#1e293b" />
    <!-- Friendly Expression -->
    <path d="M31 22 Q35 26 39 22" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="31" cy="18" r="1.5" fill="#1e293b" />
    <circle cx="39" cy="18" r="1.5" fill="#1e293b" />
    <path d="M27 15 Q31 12 35 15" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- Caring eyebrows -->

    <!-- Gesturing Arm reaching out -->
    <path d="M42 40 Q55 45 62 38" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <circle cx="63" cy="37" r="4" fill="#fcd34d" /> <!-- Hand -->
  </g>

  <!-- RIGHT CHARACTER: Quần chúng (Citizen / Masses - Represented by two engaged citizens) -->
  <g id="citizens" transform="translate(130, 80)" filter="url(#shadow)">
    <!-- Citizen 1 (Standing / Leaning in attentively) -->
    <g transform="translate(15, 0)">
      <!-- Body -->
      <path d="M15 40 L35 40 L38 75 L12 75 Z" fill="#10b981" />
      <path d="M20 40 L25 50 L30 40 Z" fill="#f8fafc" />
      <!-- Head -->
      <circle cx="25" cy="25" r="12" fill="#ffedd5" />
      <!-- Hair -->
      <path d="M14 25 C14 14 25 12 36 20 C32 15 20 15 15 20 Z" fill="#475569" />
      <!-- Face -->
      <path d="M22 27 Q25 30 28 27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="22" cy="23" r="1.2" fill="#1e293b" />
      <circle cx="28" cy="23" r="1.2" fill="#1e293b" />
      <!-- Arm holding clipboard/notes -->
      <path d="M18 45 Q5 50 10 60" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
      <rect x="2" y="55" width="12" height="15" rx="1" fill="#cbd5e1" />
    </g>

    <!-- Citizen 2 (Smiling elderly/community member seated/leaning) -->
    <g transform="translate(-10, 10)">
      <!-- Body -->
      <path d="M15 35 L35 35 L40 65 L10 65 Z" fill="#f59e0b" />
      <!-- Head -->
      <circle cx="25" cy="20" r="11" fill="#fde047" />
      <!-- Friendly Hair / Glasses -->
      <path d="M16 18 C16 10 34 10 34 18" fill="#64748b" />
      <circle cx="21" cy="18" r="3" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle cx="29" cy="18" r="3" fill="none" stroke="#1e293b" stroke-width="1" />
      <path d="M21 23 Q25 27 29 23" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- Big smile -->
      <!-- Welcoming hand gesture -->
      <path d="M32 42 Q42 45 40 38" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
      <circle cx="41" cy="36" r="3.5" fill="#fde047" />
    </g>
  </g>

  <!-- Foreground Floor Base -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2" />

  <!-- Subtle Ambient Highlights -->
  <circle cx="120" cy="35" r="40" fill="#ffffff" opacity="0.03" filter="blur(10px)" />
</svg>