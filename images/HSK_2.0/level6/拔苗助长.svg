<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="10" rx="2" fill="#475569"/>
  <rect x="50" y="160" width="10" height="80" fill="#334155"/>
  <rect x="180" y="160" width="10" height="80" fill="#334155"/>
  
  <!-- Parent Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 Q20 60 30 40" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <rect x="5" y="35" width="30" height="40" rx="5" fill="#38bdf8"/>
    <rect x="15" y="75" width="5" height="40" fill="#38bdf8"/>
    <rect x="25" y="75" width="5" height="40" fill="#38bdf8"/>
    <!-- Hand pulling book -->
    <path d="M35 50 L50 40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Child Character -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <rect x="10" y="32" width="20" height="30" rx="5" fill="#ec4899"/>
    <rect x="12" y="62" width="6" height="30" fill="#ec4899"/>
    <rect x="22" y="62" width="6" height="30" fill="#ec4899"/>
    <!-- Stressed expression -->
    <line x1="15" y1="15" x2="18" y2="18" stroke="#0f172a" stroke-width="2"/>
    <line x1="22" y1="18" x2="25" y2="15" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Books/Props -->
  <rect x="70" y="120" width="30" height="40" rx="2" fill="#10b981"/>
  <rect x="75" y="115" width="30" height="40" rx="2" fill="#fb923c"/>
  <rect x="80" y="110" width="30" height="40" rx="2" fill="#38bdf8"/>
  
  <!-- Visual Metaphor: The "Pulling" action -->
  <path d="M110 110 L140 60" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="140" cy="60" r="4" fill="#f59e0b"/>
  
  <!-- Lamp -->
  <path d="M180 150 L180 100 L200 80" stroke="#94a3b8" stroke-width="4" fill="none"/>
  <circle cx="200" cy="80" r="10" fill="#fbbf24" opacity="0.6"/>
</svg>