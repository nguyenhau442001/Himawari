<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The Broken Vase (The Evidence) -->
  <g transform="translate(160, 145)">
    <path d="M0 25 L10 0 L20 25 Z" fill="#ec4899" opacity="0.8"/>
    <path d="M5 25 L15 5 L25 25 Z" fill="#ec4899" opacity="0.6"/>
    <circle cx="10" cy="25" r="3" fill="#fb923c"/>
  </g>
  
  <!-- The Accuser (Pointing) -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="20" r="15" fill="#cbd5e1"/>
    <path d="M20 35 L20 80 M20 50 L5 60 M20 50 L35 60" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 55 L45 45" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="45" r="3" fill="#38bdf8"/>
  </g>
  
  <!-- The Denier (Arms crossed, looking away) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M20 35 L20 80 M20 50 L5 70 M20 50 L35 70" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 50 L30 55" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 55 L15 60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- Eyes looking away -->
    <rect x="25" y="15" width="5" height="2" fill="#0f172a"/>
  </g>
  
  <!-- Background Decor -->
  <rect x="30" y="40" width="40" height="30" rx="2" fill="#334155" opacity="0.5"/>
  <circle cx="180" cy="50" r="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
</svg>