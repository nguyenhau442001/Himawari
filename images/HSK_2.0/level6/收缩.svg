<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle radial glow for central focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <g transform="translate(0, 5)">
    <!-- Outer/Original Metal Object (Dotted/Ghost outline representing expanded state) -->
    <rect x="70" y="70" width="100" height="100" rx="12" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.7"/>

    <!-- Inner/Contracted Metal Object (Solid, representing '收缩' - contraction due to cold) -->
    <rect x="88" y="88" width="64" height="64" rx="8" fill="#2B3748" stroke="#3B82F6" stroke-width="2.5"/>

    <!-- Metal texture details on the inner object -->
    <line x1="100" y1="88" x2="100" y2="152" stroke="#4A5568" stroke-width="1.5" opacity="0.4"/>
    <line x1="140" y1="88" x2="140" y2="152" stroke="#4A5568" stroke-width="1.5" opacity="0.4"/>
    <circle cx="120" cy="120" r="6" fill="#3B82F6" opacity="0.8"/>

    <!-- Inward Motion / Contraction Arrows (Orange/Gold for high-contrast focus) -->
    <!-- Top Arrow -->
    <path d="M120,48 L120,74 M112,64 L120,74 L128,64" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom Arrow -->
    <path d="M120,192 L120,166 M112,176 L120,166 L128,176" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left Arrow -->
    <path d="M48,120 L74,120 M64,112 L74,120 L64,128" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Arrow -->
    <path d="M192,120 L166,120 M176,112 L166,120 L176,128" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cold / Temperature visual cues (Ice/Frost crystals near corners) -->
    <path d="M55,55 L61,61 M61,55 L55,61" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M185,55 L179,61 M179,55 L185,61" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M55,185 L61,179 M61,185 L55,179" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M185,185 L179,179 M179,185 L185,179" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>