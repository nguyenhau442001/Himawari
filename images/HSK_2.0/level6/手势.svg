<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle decorative background ring for focus -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Hand Gesture Icon (Stop Gesture / "手势") -->
  <g transform="translate(0, 5)">
    <!-- Palm / Hand Base -->
    <path d="M 90 135 
             C 90 115, 90 100, 90 95 
             C 90 89, 95 85, 101 85 
             C 107 85, 110 89, 110 95
             L 110 120" 
          fill="#FFA726" />

    <!-- Index Finger -->
    <path d="M 110 120 
             L 110 70 
             C 110 64, 115 60, 121 60 
             C 127 60, 130 64, 130 70 
             L 130 115" 
          fill="#FFA726" />

    <!-- Middle Finger -->
    <path d="M 130 115 
             L 130 55 
             C 130 49, 135 45, 141 45 
             C 147 45, 150 49, 150 55 
             L 150 115" 
          fill="#FFA726" />

    <!-- Ring Finger -->
    <path d="M 150 115 
             L 150 60 
             C 150 54, 155 50, 161 50 
             C 167 50, 170 54, 170 60 
             L 170 120" 
          fill="#FFA726" />

    <!-- Pinky Finger -->
    <path d="M 170 125 
             L 170 75 
             C 170 69, 175 65, 181 65 
             C 187 65, 190 69, 190 75 
             L 190 130
             C 190 145, 180 155, 165 155
             L 130 155" 
          fill="#F57C00" />

    <!-- Thumb -->
    <path d="M 90 135
             C 75 135, 65 145, 65 155
             C 65 165, 75 170, 90 165
             L 130 155
             L 130 135
             Z" 
          fill="#E65100" />
    
    <!-- Palm Body Fill to unify -->
    <path d="M 110 120 L 130 115 L 130 155 L 110 155 Z" fill="#FFA726" />
    <path d="M 130 115 L 150 115 L 150 155 L 130 155 Z" fill="#FFA726" />
    <path d="M 150 115 L 170 120 L 170 155 L 150 155 Z" fill="#FFA726" />
  </g>

  <!-- Action/Stop Indicator Rays (representing the "Stop" semantic context: "停止的手势") -->
  <g stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="28" x2="120" y2="18" />
    <line x1="88" y1="36" x2="81" y2="29" />
    <line x1="152" y1="36" x2="159" y2="29" />
  </g>

  <!-- Focus/Base Platform Arc -->
  <ellipse cx="120" cy="185" rx="45" ry="8" fill="#252A34"/>
</svg>