<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Fire Glow -->
    <radialGradient id="fire-glow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Background -->
  <!-- Floor -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="#0f172a" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2" />
  <!-- Baseboard -->
  <rect x="0" y="185" width="240" height="10" fill="#1e293b" stroke="#475569" stroke-width="1" />

  <!-- Wall -->
  <rect x="0" y="0" width="240" height="185" fill="url(#wall-grad)" />

  <!-- Window letting in cool blue moonlight/ambient light -->
  <g transform="translate(15, 25)">
    <rect x="0" y="0" width="45" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="5" y="5" width="16" height="28" fill="#38bdf8" fill-opacity="0.15" />
    <rect x="24" y="5" width="16" height="28" fill="#38bdf8" fill-opacity="0.15" />
    <rect x="5" y="37" width="16" height="28" fill="#38bdf8" fill-opacity="0.15" />
    <rect x="24" y="37" width="16" height="28" fill="#38bdf8" fill-opacity="0.15" />
    <!-- Window sill -->
    <rect x="-3" y="70" width="51" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Ambient Fire Glow on Wall (matching the scorch mark location) -->
  <circle cx="150" cy="95" r="70" fill="url(#fire-glow)" />

  <!-- THE SCORCH MARK / FIRE TRACE (火烧的痕迹) -->
  <g transform="translate(110, 50)">
    <!-- Outer Soot / Smoke Stain -->
    <path d="M40 10 Q65 20 55 50 Q60 80 40 95 Q15 100 10 75 Q-5 50 15 30 Q25 5 40 10 Z" fill="#0f172a" fill-opacity="0.8" />
    <!-- Dark Burn Center -->
    <path d="M35 25 Q50 35 42 60 Q45 80 30 85 Q15 80 20 60 Q10 35 28 25 Q32 20 35 25 Z" fill="#020617" />
    <!-- Charred texture lines/cracks -->
    <path d="M30 30 L25 55 M38 45 L42 70 M22 40 L35 50" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Glowing ember remnants / ash flecks -->
    <circle cx="33" cy="40" r="1.5" fill="#f59e0b" />
    <circle cx="25" cy="65" r="1" fill="#ef4444" />
    <circle cx="40" cy="55" r="1.5" fill="#f97316" />
    <path d="M28 75 L31 78 M36 30 L34 27" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Wall Hook & Hanging Frame (slightly askew from past incident) -->
  <g transform="translate(130, 25) rotate(-8)">
    <circle cx="20" cy="-5" r="3" fill="#64748b" />
    <path d="M20 -2 L20 10" stroke="#475569" stroke-width="1.5" />
    <rect x="0" y="10" width="40" height="30" rx="2" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Damaged corner of the frame -->
    <path d="M0 10 L12 10 L0 22 Z" fill="#1e293b" />
  </g>

  <!-- Foreground Furniture & Props (Bookshelf / Side Table) -->
  <g transform="translate(165, 120)">
    <!-- Cabinet Body -->
    <rect x="0" y="0" width="60" height="75" rx="4" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Cabinet Drawer Line -->
    <line x1="0" y1="25" x2="60" y2="25" stroke="#1e293b" stroke-width="2" />
    <circle cx="30" cy="12.5" r="3" fill="#fbbf24" />
    <!-- Extinguisher on floor next to cabinet -->
    <g transform="translate(-30, 15)">
      <rect x="0" y="15" width="18" height="40" rx="9" fill="#ef4444" />
      <rect x="5" y="8" width="8" height="8" rx="2" fill="#b91c1c" />
      <path d="M13 10 C20 10 22 2 22 -2" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <rect x="4" y="22" width="10" height="4" rx="2" fill="#f8fafc" fill-opacity="0.4" />
    </g>
  </g>

  <!-- CHARACTER: Concerned Homeowner/Observer pointing at the scorch mark -->
  <g transform="translate(45, 95)">
    <!-- Character Shadow -->
    <ellipse cx="35" cy="102" rx="25" ry="6" fill="#020617" fill-opacity="0.4" />

    <!-- Legs & Shoes -->
    <rect x="20" y="70" width="10" height="32" rx="4" fill="#334155" />
    <rect x="40" y="70" width="10" height="32" rx="4" fill="#334155" />
    <path d="M16 100 L30 100 C33 100 33 102 30 102 L14 102 C12 102 12 100 16 100 Z" fill="#0f172a" />
    <path d="M36 100 L50 100 C53 100 53 102 50 102 L34 102 C32 102 32 100 36 100 Z" fill="#0f172a" />

    <!-- Torso (Comfortable Home Outfit / Hoodie) -->
    <path d="M18 35 C18 30 52 30 52 35 L56 72 C56 75 52 75 50 75 L20 75 C18 75 14 75 14 72 Z" fill="#38bdf8" />
    <!-- Hoodie Pocket -->
    <path d="M25 55 L45 55 C47 55 48 65 45 68 L25 68 C22 65 23 55 25 55 Z" fill="#0284c7" fill-opacity="0.5" />

    <!-- Head & Face -->
    <circle cx="35" cy="18" r="16" fill="#fed7aa" />
    <!-- Hair (Curious, slightly messy) -->
    <path d="M19 18 C18 8 26 2 36 2 C48 2 52 10 52 18 C52 20 50 20 49 18 C47 10 40 6 35 6 C26 6 22 12 21 18 C20 20 19 20 19 18 Z" fill="#1e293b" />

    <!-- Facial Expression: Eyes wide, mouth slightly open in realization/concern -->
    <circle cx="29" cy="16" r="2" fill="#1e293b" />
    <circle cx="41" cy="16" r="2" fill="#1e293b" />
    <path d="M33 23 C35 25 37 25 39 23" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Eyebrows raised -->
    <path d="M27 12 C29 11 31 11 32 12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M38 12 C40 11 42 11 43 12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Arm (Holding chin/hand in thought) -->
    <path d="M18 38 C10 40 12 55 22 55" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <circle cx="22" cy="55" r="4.5" fill="#fed7aa" />

    <!-- Right Arm (Pointing directly at the scorch mark on the wall) -->
    <path d="M52 38 L72 30" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <!-- Pointing Hand -->
    <circle cx="72" cy="30" r="4.5" fill="#fed7aa" />
    <path d="M72 30 L84 26 C86 25 86 28 84 29 L72 32 Z" fill="#fed7aa" />
  </g>

  <!-- Subtle dust particles floating in the room light -->
  <circle cx="95" cy="80" r="1.5" fill="#cbd5e1" fill-opacity="0.6" />
  <circle cx="105" cy="115" r="1" fill="#cbd5e1" fill-opacity="0.4" />
  <circle cx="75" cy="55" r="1" fill="#cbd5e1" fill-opacity="0.5" />
  <circle cx="130" cy="140" r="1.5" fill="#cbd5e1" fill-opacity="0.3" />
</svg>