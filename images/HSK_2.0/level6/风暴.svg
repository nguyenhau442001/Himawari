<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Dark Navy Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#152238" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ominous Storm Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Indoor/Window Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <!-- Lightning Flash Gradient -->
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Distant City Skyline (Silhouettes) -->
  <g fill="#0f172a" opacity="0.8">
    <rect x="15" y="150" width="18" height="60" />
    <polygon points="15,150 24,135 33,150" />
    <rect x="36" y="130" width="24" height="80" />
    <rect x="63" y="160" width="15" height="50" />
    <rect x="81" y="120" width="30" height="90" />
    <polygon points="96,105 81,120 111,120" />
    <rect x="114" y="140" width="20" height="70" />
    <rect x="137" y="125" width="26" height="85" />
    <rect x="166" y="145" width="22" height="65" />
    <rect x="191" y="135" width="34" height="75" />
  </g>

  <!-- Ground / Street Level -->
  <rect x="0" y="210" width="240" height="30" fill="#0b0f19" />
  <rect x="0" y="210" width="240" height="3" fill="#334155" />

  <!-- Ominous Rolling Storm Clouds Approaching -->
  <path d="M-20,90 Q30,60 80,85 Q130,50 180,75 Q230,55 260,90 L260,210 L-20,210 Z" fill="url(#cloudGrad)" opacity="0.85" />
  <path d="M-10,110 Q50,75 110,100 Q170,70 250,95 L250,210 L-10,210 Z" fill="#0f172a" opacity="0.9" />

  <!-- Lightning Bolt striking down -->
  <polygon points="140,40 120,95 138,95 125,145 165,85 145,85" fill="url(#flashGrad)" />

  <!-- Environment Elements: Street Lamp & Bending Tree (Wind Effect) -->
  <!-- Street Lamp -->
  <rect x="200" y="100" width="5" height="115" fill="#475569" />
  <path d="M 202 100 Q 192 80 180 85" stroke="#475569" stroke-width="4" fill="none" />
  <path d="M 172 85 L 188 85 L 185 95 L 175 95 Z" fill="#475569" />
  <ellipse cx="180" cy="98" rx="6" ry="4" fill="#fbbf24" opacity="0.9" />
  <path d="M 180 98 L 150 180 L 210 180 Z" fill="#fbbf24" opacity="0.15" /> <!-- Light cone -->

  <!-- Bending Tree (Wind Blowing Left to Right) -->
  <path d="M 35,210 Q 38,180 30,150 Q 20,120 45,95" stroke="#334155" stroke-width="7" stroke-linecap="round" fill="none" />
  <!-- Leaves rustling in wind -->
  <path d="M 45,95 Q 60,85 55,75 Q 40,80 45,95" fill="#1e293b" />
  <path d="M 30,110 Q 15,100 20,90 Q 35,100 30,110" fill="#1e293b" />
  <path d="M 38,130 Q 55,125 50,115 Q 35,120 38,130" fill="#1e293b" />

  <!-- Main Subject: Person at a Cozy Indoor Window Observing the Storm -->
  <!-- Room Interior Framing (Wall & Window Frame) -->
  <rect x="0" y="0" width="240" height="240" fill="none" stroke="#090d16" stroke-width="16" />
  
  <!-- Window Sill & Frame Structure -->
  <rect x="135" y="100" width="90" height="110" fill="none" stroke="#334155" stroke-width="6" />
  <!-- Warm Indoor Window Light Spill -->
  <path d="M 138 103 L 222 103 L 222 207 L 138 207 Z" fill="url(#windowGlow)" opacity="0.12" />

  <!-- Character: Concerned Woman Looking Out the Window at the Storm -->
  <!-- Body / Torso (Cozy Sweater) -->
  <path d="M 160,210 C 160,185 175,175 190,175 C 205,175 220,185 220,210 Z" fill="#f43f5e" />
  <path d="M 190,175 C 182,175 175,180 170,188" stroke="#be123c" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="183" y="162" width="14" height="16" rx="6" fill="#fbcfe8" />

  <!-- Head Profile / Face turned toward window (left) -->
  <circle cx="187" cy="150" r="14" fill="#fbcfe8" />
  
  <!-- Hair (Stylish Bob cut blowing slightly) -->
  <path d="M 175,142 C 170,135 180,125 192,128 C 202,130 205,145 202,160 C 200,165 197,165 195,160 C 195,150 190,143 175,142 Z" fill="#33292a" />
  <!-- Front bang strand -->
  <path d="M 175,142 Q 180,148 185,145" stroke="#33292a" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Facial Expression: Wide watchful eye, serious/anticipating -->
  <circle cx="178" cy="148" r="2" fill="#1e293b" />
  <path d="M 176,144 Q 179,142 181,144" stroke="#33292a" stroke-width="1.5" fill="none" stroke-linecap="round" /> <!-- Eyebrow raised -->
  <path d="M 173,153 Q 176,155 179,153" stroke="#be123c" stroke-width="1.5" fill="none" stroke-linecap="round" /> <!-- Subtle worried lip -->

  <!-- Arms / Hands resting on window sill -->
  <path d="M 168,190 C 175,185 185,188 190,195" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" fill="none" />
  <circle cx="192" cy="196" r="4" fill="#fbcfe8" /> <!-- Hand -->

  <!-- Interior Details: Warm Houseplant on the windowsill -->
  <path d="M 143,205 L 157,205 L 154,190 L 146,190 Z" fill="#38bdf8" /> <!-- Pot -->
  <ellipse cx="150" cy="190" rx="4" ry="2" fill="#0284c7" />
  <!-- Plant Leaves (Succulent / Monstera mini) -->
  <path d="M 150,190 Q 142,180 140,175 Q 148,178 150,190 Z" fill="#10b981" />
  <path d="M 150,190 Q 155,175 162,172 Q 155,182 150,190 Z" fill="#059669" />
  <path d="M 150,190 Q 150,170 145,168 Q 148,180 150,190 Z" fill="#34d399" />

  <!-- Rain Streaks (Blowing diagonally indicating fierce approaching storm) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
    <line x1="50" y1="70" x2="35" y2="100" />
    <line x1="75" y1="60" x2="60" y2="90" />
    <line x1="100" y1="80" x2="85" y2="110" />
    <line x1="60" y1="120" x2="45" y2="150" />
    <line x1="90" y1="130" x2="75" y2="160" />
    <line x1="120" y1="110" x2="105" y2="140" />
    
    <!-- Heavy gusts closer to foreground -->
    <line x1="15" y1="160" x2="0" y2="190" stroke-width="2" opacity="0.8" />
    <line x1="40" y1="175" x2="25" y2="205" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Atmospheric Lighting Vignette / Frame border cleanup -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.5" />
</svg>