<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="150" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character (Upper body) -->
  <g transform="translate(40, 60)">
    <circle cx="40" cy="30" r="25" fill="#fbbf24"/>
    <path d="M25 30 Q 40 45 55 30" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="15" y="60" width="50" height="80" rx="10" fill="#38bdf8"/>
    <rect x="10" y="70" width="15" height="40" rx="5" fill="#38bdf8"/>
    <rect x="55" y="70" width="15" height="40" rx="5" fill="#38bdf8"/>
  </g>
  
  <!-- Airplane Model -->
  <g transform="translate(130, 120)">
    <path d="M0 0 L 60 0 L 50 -10 L 10 -10 Z" fill="#ec4899"/>
    <path d="M20 -5 L 40 -5 L 35 -25 Z" fill="#fb923c"/>
    <rect x="25" y="-2" width="10" height="4" fill="#f8fafc"/>
  </g>
  
  <!-- Tools on desk -->
  <rect x="180" y="160" width="20" height="5" rx="2" fill="#94a3b8"/>
  <circle cx="170" cy="165" r="8" fill="#10b981"/>
  
  <!-- Ambient light glow -->
  <circle cx="150" cy="120" r="40" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Window/Background detail -->
  <rect x="160" y="30" width="50" height="80" rx="5" stroke="#475569" stroke-width="2" fill="none"/>
  <circle cx="185" cy="50" r="10" fill="#fbbf24"/>
</svg>