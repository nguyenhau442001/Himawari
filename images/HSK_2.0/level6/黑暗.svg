<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient representing a dark room -->
    <linearGradient id="roomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Subtle window beam fading into darkness -->
    <linearGradient id="faintBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm sleep/bed blanket gradient -->
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Character pajamas -->
    <linearGradient id="pajamas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Soft glow for alarm clock LED (barely visible) -->
    <filter id="dimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#roomBg)"/>

  <!-- ROOM INTERIOR BACKGROUND ELEMENTS (All in dark, muted tones to convey 黑暗) -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="180" fill="#0b101d"/>
  <!-- Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#060911"/>
  <!-- Baseboard -->
  <rect x="0" y="176" width="240" height="4" fill="#04060b"/>

  <!-- Window Frame on the Back Wall (Closed shutters / heavy night outside) -->
  <g transform="translate(160, 35)">
    <!-- Window Outer Frame -->
    <rect x="0" y="0" width="45" height="70" rx="4" fill="#1e293b" opacity="0.6"/>
    <!-- Glass showing absolute night -->
    <rect x="3" y="3" width="39" height="64" rx="2" fill="#090d16"/>
    <!-- Window Panes Grid -->
    <line x1="22.5" y1="3" x2="22.5" y2="67" stroke="#131b2e" stroke-width="2"/>
    <line x1="3" y1="35" x2="42" y2="35" stroke="#131b2e" stroke-width="2"/>
    <!-- Faint moonlight beam piercing slightly into the room -->
    <polygon points="3,3 42,3 60,120 -30,120" fill="url(#faintBeam)"/>
  </g>

  <!-- Wall Shelf with Books (silhouetted in dark indigo) -->
  <g transform="translate(25, 50)">
    <rect x="0" y="0" width="55" height="4" rx="1" fill="#1e293b" opacity="0.8"/>
    <!-- Books silhouette -->
    <rect x="8" y="-12" width="6" height="12" rx="1" fill="#172033"/>
    <rect x="15" y="-16" width="8" height="16" rx="1" fill="#131b2b"/>
    <rect x="24" y="-10" width="5" height="10" rx="1" fill="#1a2338"/>
    <rect x="32" y="-14" width="10" height="14" rx="1" fill="#151e30"/>
  </g>

  <!-- Wardrobe / Closet on the left -->
  <rect x="15" y="80" width="45" height="96" rx="2" fill="#0d1320" opacity="0.9"/>
  <line x1="37" y1="80" x2="37" y2="176" stroke="#070a12" stroke-width="2"/>
  <circle cx="33" cy="130" r="1.5" fill="#1e293b"/>

  <!-- Bed & Sleeping Character (Main focal point of the bedroom scene) -->
  <g transform="translate(70, 110)">
    <!-- Bed Frame / Headboard -->
    <rect x="0" y="10" width="115" height="60" rx="6" fill="#162035"/>
    <rect x="10" y="0" width="95" height="15" rx="3" fill="#111827"/>

    <!-- Pillows -->
    <rect x="15" y="16" width="35" height="22" rx="8" fill="#22304a"/>
    <rect x="55" y="18" width="30" height="20" rx="7" fill="#1a253b"/>

    <!-- Sleeping Character tucked under blankets -->
    <!-- Blanket -->
    <path d="M10 32 C30 28, 90 28, 110 35 L115 70 L5 70 Z" fill="url(#blanketGrad)"/>
    <!-- Blanket fold / detail line -->
    <path d="M12 35 C35 32, 85 32, 108 38" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Character Head resting on pillow -->
    <circle cx="32" cy="24" r="11" fill="#fcd34d"/>
    <!-- Closed peaceful eyes (curved lines) -->
    <path d="M28 23 C29 25, 31 25, 32 23" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Cute rosy cheek -->
    <circle cx="29" cy="27" r="3" fill="#f87171" opacity="0.5"/>
    <!-- Hair tuft -->
    <path d="M25 16 C27 13, 31 13, 35 15" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Nightstand next to bed -->
  <g transform="translate(190, 130)">
    <rect x="0" y="0" width="30" height="48" rx="3" fill="#131b2e"/>
    <rect x="4" y="8" width="22" height="14" rx="2" fill="#0d1320"/>
    <circle cx="15" cy="15" r="1" fill="#22304a"/>
    
    <!-- Tiny digital alarm clock showing faint red/amber digits in the dark darkness -->
    <rect x="8" y="-10" width="14" height="9" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <!-- Faint glowing time dots -->
    <circle cx="13" cy="-5.5" r="0.75" fill="#ef4444" filter="url(#dimGlow)" opacity="0.8"/>
    <circle cx="17" cy="-5.5" r="0.75" fill="#ef4444" filter="url(#dimGlow)" opacity="0.8"/>
    <circle cx="15" cy="-3.5" r="0.5" fill="#ef4444" opacity="0.4"/>
  </g>

  <!-- Indoor Houseplant silhouette on the floor -->
  <g transform="translate(45, 150)">
    <!-- Pot -->
    <path d="M4 18 L12 30 L28 30 L36 18 Z" fill="#1e293b"/>
    <!-- Leaves (dark green/slate) -->
    <path d="M20 18 C20 5, 10 -5, 2 -8 C10 -2, 18 5, 20 18 Z" fill="#14302c"/>
    <path d="M20 18 C22 2, 32 -2, 38 4 C30 6, 22 12, 20 18 Z" fill="#0f2924"/>
    <path d="M20 18 C22 8, 35 10, 42 16 C32 16, 25 18, 20 18 Z" fill="#1b3b35"/>
  </g>

  <!-- Slippers neatly placed on floor -->
  <g transform="translate(135, 195)">
    <!-- Left slipper -->
    <path d="M0 6 C0 2, 4 0, 9 2 C14 4, 16 8, 14 11 C12 13, 2 13, 0 6 Z" fill="#1e293b"/>
    <!-- Right slipper -->
    <path d="M18 6 C18 2, 22 0, 27 2 C32 4, 34 8, 32 11 C30 13, 20 13, 18 6 Z" fill="#1e293b"/>
  </g>

  <!-- Ambient lighting overlay gradients to enhance the deep "hēiàn" (darkness) mood -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#020408" stop-opacity="0.75"/>
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none"/>
</svg>