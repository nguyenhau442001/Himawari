<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="robe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Architectural Background Details (Courtroom Environment) -->
  <!-- Back Wall Paneling -->
  <rect x="40" y="40" width="160" height="120" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="40" x2="120" y2="160" stroke="#334155" stroke-width="2"/>
  
  <!-- Warm Spotlight from above -->
  <path d="M90 40 L150 40 L180 160 L60 160 Z" fill="#fbbf24" opacity="0.04"/>

  <!-- Bookshelf / Law Books in Background -->
  <rect x="52" y="60" width="12" height="40" rx="2" fill="#ef4444"/>
  <rect x="66" y="58" width="10" height="42" rx="2" fill="#10b981"/>
  <rect x="78" y="62" width="14" height="38" rx="2" fill="#f59e0b"/>
  <rect x="150" y="60" width="12" height="40" rx="2" fill="#8b5cf6"/>
  <rect x="164" y="62" width="16" height="38" rx="2" fill="#38bdf8"/>

  <!-- Judge's Desk / Podium -->
  <path d="M50 160 L190 160 L200 195 L40 195 Z" fill="url(#wood-desk)" stroke="#64748b" stroke-width="2"/>
  <!-- Desk Highlight -->
  <rect x="45" y="156" width="150" height="6" rx="3" fill="#64748b"/>

  <!-- Gavel Resting on Desk -->
  <g transform="translate(145, 172)">
    <!-- Gavel block -->
    <rect x="-10" y="6" width="28" height="10" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Gavel handle -->
    <rect x="-18" y="1" width="30" height="6" rx="3" transform="rotate(-15 -18 1)" fill="#b45309"/>
  </g>

  <!-- Scales of Justice (Central Decorative Element representing fairness/gōngzhèng) -->
  <g transform="translate(120, 95)">
    <!-- Stand -->
    <rect x="-3" y="10" width="6" height="45" fill="url(#gold-glow)"/>
    <path d="M -12 55 L 12 55 L 8 52 L -8 52 Z" fill="url(#gold-glow)"/>
    <!-- Top hook -->
    <circle cx="0" cy="10" r="4" fill="url(#gold-glow)"/>
    <!-- Beam -->
    <path d="M -25 15 L 25 15 L 22 10 L -22 10 Z" fill="url(#gold-glow)"/>
    <circle cx="-25" cy="15" r="2" fill="#f59e0b"/>
    <circle cx="25" cy="15" r="2" fill="#f59e0b"/>
    <!-- Left Pan -->
    <path d="M -25 15 L -35 35 L -15 35 Z" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M -38 35 C -38 41 -12 41 -12 35 Z" fill="url(#gold-glow)" opacity="0.8"/>
    <!-- Right Pan -->
    <path d="M 25 15 L 15 35 L 35 35 Z" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 12 35 C 12 41 38 41 38 35 Z" fill="url(#gold-glow)" opacity="0.8"/>
  </g>

  <!-- Judge Character (Professional, focused, fair expression) -->
  <g transform="translate(120, 110)">
    <!-- Body / Robe -->
    <path d="M -35 50 L 35 50 L 45 90 L -45 90 Z" fill="url(#robe-grad)"/>
    <!-- White Collar Tabs -->
    <polygon points="-8,45 0,58 8,45" fill="#f8fafc"/>
    
    <!-- Shoulders / Arms -->
    <path d="M -35 50 C -35 35 -15 35 0 35 C 15 35 35 35 35 50" fill="url(#robe-grad)"/>

    <!-- Neck -->
    <rect x="-6" y="26" width="12" height="12" fill="#fbcfe8" rx="4"/>

    <!-- Head -->
    <circle cx="0" cy="12" r="18" fill="#ffedd5"/>

    <!-- Hair / Judge Wig Style or Professional Hair -->
    <path d="M -18 10 C -18 -2 18 -2 18 10 C 18 16 16 8 16 3 C 16 -3 -16 -3 -16 3 C -16 8 -18 10 -18 10 Z" fill="#334155"/>

    <!-- Facial Features -->
    <!-- Eyes (Focused, Calm) -->
    <path d="M -7 10 Q -5 7 -3 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 3 10 Q 5 7 7 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Gentle, confident smile -->
    <path d="M -3 18 Q 0 21 3 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Glasses (Intellectual touch) -->
    <circle cx="-5" cy="10" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="5" cy="10" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-2" y1="10" x2="2" y2="10" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Raised Hand pointing or holding document (Active gesture of ruling/justice) -->
    <g transform="translate(28, 45)">
      <circle cx="0" cy="0" r="7" fill="#ffedd5"/>
      <path d="M -5 -3 L -2 -15 L 3 -15 L 5 -3 Z" fill="url(#robe-grad)"/>
    </g>

    <!-- Other Hand resting on desk -->
    <g transform="translate(-25, 55)">
      <circle cx="0" cy="0" r="6" fill="#ffedd5"/>
    </g>
  </g>

  <!-- Foreground Documents / Legal Briefs on Desk -->
  <g transform="translate(70, 168)">
    <rect x="0" y="0" width="30" height="20" rx="2" fill="#f8fafc" transform="rotate(-8)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Mock text lines on paper -->
    <line x1="5" y1="5" x2="20" y2="4" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-8)"/>
    <line x1="5" y1="10" x2="25" y2="9" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-8)"/>
    <line x1="5" y1="15" x2="15" y2="14" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-8)"/>
    
    <!-- Red Official Seal Stamp -->
    <circle cx="20" cy="12" r="4" fill="#ef4444" opacity="0.8" transform="rotate(-8)"/>
  </g>

  <!-- Ambient lighting effects / Vignette overlay for depth -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
</svg>