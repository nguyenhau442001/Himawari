<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="parkFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Setting: A cozy park / outdoor shelter with a warm caring atmosphere -->
  <!-- Park background elements -->
  <circle cx="190" cy="90" r="35" fill="#1e3a8a" opacity="0.3" />
  <path d="M150 140 Q170 100 200 140 Z" fill="#047857" opacity="0.4" />
  <path d="M30 150 Q60 110 90 150 Z" fill="#047857" opacity="0.4" />

  <!-- Ground -->
  <path d="M0 150 C60 140 180 140 240 150 L240 240 L0 240 Z" fill="url(#parkFloor)" />
  <ellipse cx="120" cy="180" rx="90" ry="30" fill="#064e3b" opacity="0.5" />

  <!-- Context Props: Park Bench and Care items -->
  <!-- Bench -->
  <g id="bench">
    <!-- Bench legs -->
    <rect x="50" y="145" width="6" height="35" rx="3" fill="#475569" />
    <rect x="180" y="145" width="6" height="35" rx="3" fill="#475569" />
    <!-- Bench seat -->
    <rect x="40" y="140" width="155" height="8" rx="3" fill="#b45309" />
    <rect x="40" y="152" width="155" height="6" rx="2" fill="#92400e" />
    <!-- Bench backrest -->
    <path d="M42 110 L193 110 L190 135 L45 135 Z" fill="#b45309" opacity="0.9" />
    <line x1="55" y1="110" x2="55" y2="135" stroke="#78350f" stroke-width="3" />
    <line x1="180" y1="110" x2="180" y2="135" stroke="#78350f" stroke-width="3" />
  </g>

  <!-- Caring Props: Bowl of food & Heart Symbolizing Protection/Kindness -->
  <ellipse cx="150" cy="185" rx="14" ry="6" fill="#cbd5e1" />
  <ellipse cx="150" cy="183" rx="11" ry="4" fill="#fbbf24" />

  <!-- Main Characters: Person protecting/caring for a stray dog (contrasting with mistreatment) -->
  <!-- Person (Protector/Owner kneeling gently) -->
  <g id="rescuer">
    <!-- Body & Legs (Kneeling) -->
    <path d="M75 145 C75 130 90 120 100 135 L105 175 C105 180 95 185 85 185 L70 185 Z" fill="#38bdf8" />
    <!-- Head & Hair -->
    <circle cx="85" cy="110" rx="14" fill="#fde047" />
    <path d="M71 110 C71 95 99 95 99 110 C99 105 90 98 85 98 C80 98 71 105 71 110 Z" fill="#78350f" />
    <!-- Face expression (warm smile) -->
    <circle cx="81" cy="109" r="1.5" fill="#1e293b" />
    <circle cx="89" cy="109" r="1.5" fill="#1e293b" />
    <path d="M83 115 Q85 118 87 115" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    
    <!-- Arms reaching out gently to pet/protect -->
    <path d="M95 135 Q115 130 125 145" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>

  <!-- Happy Protected Animal (Dog) -->
  <g id="happy-dog">
    <!-- Dog body -->
    <ellipse cx="135" cy="165" rx="18" ry="12" fill="#d97706" />
    <!-- Dog head -->
    <circle cx="122" cy="155" rx="11" fill="#d97706" />
    <!-- Floppy ear -->
    <path d="M115 148 C110 150 110 160 118 162 Z" fill="#b45309" />
    <!-- Snout & Nose -->
    <circle cx="114" cy="157" rx="4" fill="#fef3c7" />
    <circle cx="112" cy="156" rx="1.5" fill="#1e293b" />
    <!-- Tail wagging -->
    <path d="M153 160 Q162 150 160 142" stroke="#d97706" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Paws -->
    <ellipse cx="125" cy="177" rx="3" ry="2" fill="#b45309" />
    <ellipse cx="145" cy="177" rx="3" ry="2" fill="#b45309" />
  </g>

  <!-- Visual Prohibition / Protection Element (Intuitive "Care/Protect" concept over "No Mistreatment") -->
  <!-- A glowing warm shield/heart aura above symbolizing safe, humane treatment -->
  <g transform="translate(110, 75)">
    <path d="M 0,-10 C -15,-25 -30,-5 -10,15 L 0,25 L 10,15 C 30,-5 15,-25 0,-10 Z" fill="#ef4444" opacity="0.9" />
    <path d="M -3,-3 L 3,3 M 3,-3 L -3,3" stroke="#ffffff" stroke-width="0" /> <!-- Clean heart -->
  </g>

  <!-- Secondary decorative elements (Warm lighting & nature) -->
  <circle cx="45" cy="60" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="195" cy="50" r="3" fill="#fbbf24" opacity="0.4" />
  <circle cx="210" cy="110" r="1.5" fill="#fbbf24" opacity="0.8" />

  <!-- Foreground subtle vignette framing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>