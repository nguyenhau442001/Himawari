<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="formGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background glow / window / shelf details -->
  <path d="M40 30 H100 V100 H40 Z" fill="#1e293b" opacity="0.5"/>
  <circle cx="180" cy="50" r="25" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Bookshelf / Office background elements -->
  <rect x="180" y="70" width="30" height="8" rx="2" fill="#475569"/>
  <rect x="185" y="55" width="20" height="15" rx="1" fill="#06b6d4" opacity="0.6"/>
  <rect x="165" y="60" width="15" height="18" rx="1" fill="#ec4899" opacity="0.6"/>

  <!-- Desk Surface -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <path d="M 0 180 L 240 180" stroke="#475569" stroke-width="2"/>

  <!-- Laptop / Computer Setup -->
  <!-- Laptop Base -->
  <path d="M 75 180 L 165 180 L 175 190 L 65 190 Z" fill="#64748b"/>
  <!-- Laptop Screen Outer -->
  <rect x="80" y="100" width="80" height="82" rx="4" fill="#334155"/>
  <!-- Laptop Screen Inner -->
  <rect x="84" y="104" width="72" height="70" rx="2" fill="url(#screenGrad)"/>

  <!-- Floating Feedback Form / UI overlay (Representing "Feedback") -->
  <g transform="translate(100, 75)">
    <!-- Main Form Paper -->
    <rect x="-35" y="0" width="70" height="85" rx="6" fill="url(#formGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
    
    <!-- Form Header decorative stars / rating -->
    <circle cx="-18" cy="15" r="4" fill="#f59e0b"/>
    <circle cx="-6" cy="15" r="4" fill="#f59e0b"/>
    <circle cx="6" cy="15" r="4" fill="#f59e0b"/>
    <circle cx="18" cy="15" r="4" fill="#cbd5e1"/>

    <!-- Form Lines (Mock text) -->
    <rect x="-25" y="28" width="50" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="-25" y="38" width="38" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Checkbox / Options -->
    <rect x="-25" y="50" width="8" height="8" rx="2" fill="#10b981"/>
    <rect x="-13" y="52" width="30" height="4" rx="2" fill="#94a3b8"/>

    <rect x="-25" y="64" width="8" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="-13" y="66" width="24" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Glowing feedback highlights rising up -->
  <circle cx="130" cy="60" r="6" fill="#f59e0b" opacity="0.8" filter="url(#glow)"/>
  <circle cx="150" cy="45" r="4" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="110" cy="35" r="5" fill="#10b981" opacity="0.8" filter="url(#glow)"/>

  <!-- Character: Customer / User giving feedback -->
  <!-- Body / Torso -->
  <path d="M 30 200 C 30 170 50 160 70 160 C 90 160 110 170 110 200 Z" fill="#3b82f6"/>
  
  <!-- Collar / Shirt Detail -->
  <path d="M 58 160 L 70 175 L 82 160 Z" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="63" y="145" width="14" height="20" fill="#f87171" rx="4"/>

  <!-- Head -->
  <circle cx="70" cy="125" r="22" fill="#fcd34d"/>
  
  <!-- Hair -->
  <path d="M 48 120 C 48 105 60 100 70 100 C 85 100 92 110 92 125 L 92 130 L 48 130 Z" fill="#1e293b"/>

  <!-- Facial expression: Smiling, engaged, pointing/presenting -->
  <!-- Eye -->
  <circle cx="78" cy="122" r="2.5" fill="#1e293b"/>
  <!-- Smile -->
  <path d="M 74 133 C 76 137 82 137 85 133" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy cheek -->
  <circle cx="82" cy="128" r="4" fill="#f87171" opacity="0.4"/>

  <!-- Arm gesturing toward the feedback form -->
  <path d="M 95 170 C 110 165 125 150 135 135" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Hand -->
  <circle cx="138" cy="130" r="6" fill="#fcd34d"/>

  <!-- Coffee Mug as desk prop -->
  <path d="M 190 160 L 210 160 L 208 180 L 192 180 Z" fill="#f8fafc"/>
  <path d="M 210 165 C 216 165 216 175 210 175" stroke="#f8fafc" stroke-width="3" fill="none"/>
  <ellipse cx="200" cy="160" rx="10" ry="3" fill="#cbd5e1"/>

</svg>