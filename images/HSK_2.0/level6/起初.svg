<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <clipPath id="canvas-clip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bg-gradient)" />

    <!-- Interior Room Context: Wall & Floor -->
    <rect x="0" y="0" width="240" height="165" fill="#1e293b" />
    <path d="M0 165 L240 165 L240 240 L0 240 Z" fill="#0f172a" />
    <!-- Floor line/molding -->
    <line x1="0" y1="165" x2="240" y2="165" stroke="#334155" stroke-width="2" />

    <!-- Ambient Lighting / Spotlight on Presenter -->
    <polygon points="100,0 140,0 180,165 60,165" fill="url(#spotlight)" />

    <!-- Background Props: Window & Plant -->
    <rect x="25" y="30" width="45" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="47" y1="30" x2="47" y2="90" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="60" x2="70" y2="60" stroke="#334155" stroke-width="1.5" />

    <!-- Houseplant -->
    <path d="M205 150 Q205 130 215 120 Q225 130 225 150 Z" fill="#10b981" opacity="0.8" />
    <path d="M195 155 Q195 135 205 125 Q215 135 215 155 Z" fill="#059669" />
    <path d="M210 165 L210 150 L220 150 L220 165 Z" fill="#64748b" rx="2" />

    <!-- Presentation Board / Flipchart Stand -->
    <rect x="95" y="45" width="50" height="70" rx="3" fill="#334155" />
    <rect x="100" y="50" width="40" height="60" fill="#f8fafc" />
    <!-- Abstract chart lines on board -->
    <polyline points="105,75 115,65 125,70 135,58" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="135" cy="58" r="3" fill="#ef4444" />
    <!-- Easel legs -->
    <line x1="105" y1="115" x2="90" y2="165" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <line x1="135" y1="115" x2="150" y2="165" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="115" x2="120" y2="165" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

    <!-- MAIN SUBJECT 1: The Speaker / Pitcher (Confident, pointing at chart) -->
    <g id="speaker">
      <!-- Body/Torso -->
      <path d="M110 130 L130 130 L138 175 L102 175 Z" fill="#38bdf8" />
      <!-- Head -->
      <circle cx="120" cy="108" r="14" fill="#fed7aa" />
      <!-- Hair -->
      <path d="M106 105 Q120 90 134 105 Q132 98 120 96 Q108 98 106 105 Z" fill="#334155" />
      <!-- Arm pointing -->
      <path d="M128 135 L148 120" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" />
      <!-- Other arm -->
      <path d="M112 135 L102 155" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <!-- Legs -->
      <line x1="112" y1="175" x2="110" y2="215" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
      <line x1="128" y1="175" x2="130" y2="215" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
      <!-- Face details -->
      <circle cx="125" cy="107" r="1.5" fill="#1e293b" />
      <path d="M122 114 Q125 117 128 114" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- MAIN SUBJECT 2: Skeptical Audience Member 1 (Arms crossed, doubting) -->
    <g id="skeptic-left">
      <!-- Body -->
      <path d="M55 140 L75 140 L80 180 L50 180 Z" fill="#ec4899" />
      <!-- Head -->
      <circle cx="65" cy="118" r="13" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M52 115 Q65 100 78 115 L78 122 L52 122 Z" fill="#831843" />
      <!-- Crossed Arms -->
      <path d="M56 145 L74 152 L62 162" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Legs -->
      <line x1="58" y1="180" x2="56" y2="215" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
      <line x1="72" y1="180" x2="74" y2="215" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
      <!-- Face (Skeptical expression: furrowed brow, straight mouth) -->
      <line x1="68" y1="116" x2="73" y2="118" stroke="#831843" stroke-width="1.5" stroke-linecap="round" />
      <line x1="68" y1="124" x2="72" y2="124" stroke="#831843" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- MAIN SUBJECT 3: Skeptical Audience Member 2 (Hand on chin, leaning back, unsure) -->
    <g id="skeptic-right">
      <!-- Body -->
      <path d="M165 145 L185 145 L190 185 L160 185 Z" fill="#8b5cf6" />
      <!-- Head -->
      <circle cx="175" cy="122" r="13" fill="#fed7aa" />
      <!-- Hair -->
      <path d="M163 120 Q175 108 187 120 Z" fill="#451a03" />
      <!-- Arm with hand on chin -->
      <path d="M168 152 L172 132 L176 130" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Legs -->
      <line x1="168" y1="185" x2="164" y2="215" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
      <line x1="182" y1="185" x2="186" y2="215" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
      <!-- Face (Doubting expression: sideways glance) -->
      <circle cx="178" cy="121" r="1.5" fill="#1e293b" />
      <line x1="174" y1="127" x2="178" y2="128" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- TABLE / FURNITURE CONTEXT -->
    <rect x="40" y="175" height="12" width="160" rx="3" fill="#475569" />
    <rect x="55" y="187" height="28" width="10" fill="#334155" />
    <rect x="175" y="187" height="28" width="10" fill="#334155" />

    <!-- TABLE PROPS (Note, coffee cup, folders representing the meeting) -->
    <rect x="75" y="165" width="20" height="10" rx="1" fill="#f8fafc" />
    <circle cx="150" cy="170" r="5" fill="#f1f5f9" />
    <path d="M155 167 C158 167 158 173 155 173" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

    <!-- ATMOSPHERIC / NARRATIVE ELEMENTS (Subtle floating question marks / doubt indicators - purely graphical) -->
    <path d="M52 98 Q55 90 62 95 Q68 100 62 106 Q58 110 58 115" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="58" cy="122" r="1.5" fill="#94a3b8" opacity="0.6" />

    <path d="M188 102 Q191 94 198 99 Q204 104 198 110 Q194 114 194 119" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="194" cy="126" r="1.5" fill="#94a3b8" opacity="0.6" />
  </g>
</svg>