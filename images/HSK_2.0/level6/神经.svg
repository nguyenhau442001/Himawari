<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Central Brain Silhouette / Core Outline -->
    <path d="M-35,-25 C-45,-25 -55,-10 -50,10 C-45,30 -30,40 -15,45 C-5,48 0,35 10,40 C25,45 40,30 45,10 C50,-10 35,-30 20,-35 C10,-38 10,-25 0,-28 C-10,-31 -20,-25 -35,-25 Z" 
          fill="#252A34" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Neural Network / Synapse Paths (Orange & Teal glowing vectors) -->
    <!-- Main spine connection -->
    <path d="M0,45 L0,65" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="65" r="4" fill="#FF9F43"/>

    <!-- Left Hemisphere Neurons -->
    <path d="M-15,45 C-30,35 -40,15 -35,-5 C-32,-18 -20,-25 -10,-20" 
          fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M-35,-5 L-50,-15" fill="none" stroke="#FF9F43" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M-25,15 L-40,25" fill="none" stroke="#00D2D3" stroke-width="2"/>
    
    <!-- Right Hemisphere Neurons -->
    <path d="M10,40 C25,35 38,15 35,-5 C33,-20 20,-30 5,-25" 
          fill="none" stroke="#00D2D3" stroke-width="3" stroke-linecap="round"/>
    <path d="M35,-5 L50,0" fill="none" stroke="#00D2D3" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M20,10 L35,20" fill="none" stroke="#FF9F43" stroke-width="2"/>

    <!-- Center Synapse Spark/Core -->
    <circle cx="-10" cy="-5" r="5" fill="#FF9F43"/>
    <circle cx="10" cy="-5" r="4" fill="#00D2D3"/>
    <circle cx="0" cy="15" r="6" fill="#FF9F43"/>
    
    <!-- Impulses / Nodes -->
    <circle cx="-35" cy="-5" r="3" fill="#00D2D3"/>
    <circle cx="35" cy="-5" r="3" fill="#FF9F43"/>
    <circle cx="-50" cy="-15" r="2.5" fill="#FF9F43"/>
    <circle cx="50" cy="0" r="2.5" fill="#00D2D3"/>
    
    <!-- Subtle Damage/Break Indicator (Representing "受损" / Damaged Nerve) -->
    <g transform="translate(25, -20)">
      <path d="M0,0 L6,-6 M6,0 L0,-6" stroke="#FF5252" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="3" cy="-3" r="10" fill="none" stroke="#FF5252" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>

  <!-- Decorative technical frame/dots in corners for modern UI feel -->
  <circle cx="30" cy="30" r="2" fill="#3A4252"/>
  <circle cx="210" cy="30" r="2" fill="#3A4252"/>
  <circle cx="30" cy="210" r="2" fill="#3A4252"/>
  <circle cx="210" cy="210" r="2" fill="#3A4252"/>
</svg>