<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Park Ground Gradient -->
    <linearGradient id="ground-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Poster Green Gradient -->
    <linearGradient id="poster-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE BACKGROUND: Park Environment -->
  <!-- Distant Trees / Foliage -->
  <circle cx="40" cy="110" r="35" fill="#1e3a8a" opacity="0.4"/>
  <circle cx="200" cy="100" r="45" fill="#1e3a8a" opacity="0.4"/>
  <circle cx="120" cy="90" r="50" fill="#1e3a8a" opacity="0.3"/>

  <!-- Ground / Grass -->
  <path d="M 0 160 Q 60 150 120 160 T 240 155 L 240 240 L 0 240 Z" fill="url(#ground-grad)"/>

  <!-- Park Path / Plaza -->
  <path d="M 40 240 Q 90 180 150 160 L 220 160 L 240 240 Z" fill="#0f172a" opacity="0.6"/>

  <!-- PROPS: Park Bench on the left -->
  <g id="park-bench" transform="translate(15, 150)">
    <!-- Bench legs -->
    <rect x="10" y="15" width="4" height="15" fill="#475569"/>
    <rect x="35" y="15" width="4" height="15" fill="#475569"/>
    <!-- Bench seat -->
    <rect x="5" y="10" width="40" height="5" rx="2" fill="#b45309"/>
    <!-- Bench backrest -->
    <rect x="5" y="0" width="40" height="8" rx="2" fill="#d97706"/>
    <rect x="12" y="8" width="4" height="8" fill="#475569"/>
    <rect x="32" y="8" width="4" height="8" fill="#475569"/>
  </g>

  <!-- PROPS: Sparkling Clean Trash Bin & Falling Leaf/Eco motif -->
  <g id="trash-bin" transform="translate(170, 150)">
    <!-- Bin Shadow -->
    <ellipse cx="20" cy="32" rx="16" ry="4" fill="#000000" opacity="0.3"/>
    <!-- Bin Body -->
    <path d="M 8 5 L 32 5 L 29 32 L 11 32 Z" fill="#38bdf8"/>
    <!-- Bin Lid -->
    <ellipse cx="20" cy="5" rx="13" ry="4" fill="#0284c7"/>
    <!-- Recycle Icon (Abstract clean lines) -->
    <path d="M 17 16 L 20 13 L 23 16 M 20 13 L 20 23" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- PROPS: Clean Park Sign / Notice Board (Visualizing the concept of rules/keeping clean) -->
  <g id="park-sign" transform="translate(100, 115)">
    <!-- Pole -->
    <rect x="18" y="25" width="4" height="40" fill="#64748b"/>
    <!-- Board Frame -->
    <rect x="0" y="0" width="40" height="30" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Board Content (Clean nature symbol representation) -->
    <rect x="4" y="4" width="32" height="22" rx="4" fill="url(#poster-grad)"/>
    <!-- Little green tree icon inside sign -->
    <circle cx="20" cy="13" r="6" fill="#f0fdf4"/>
    <path d="M 20 16 L 20 20" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles indicating cleanliness & freshness -->
  <g filter="url(#glow)">
    <!-- Sparkle 1 -->
    <path d="M 145 110 Q 145 120 135 120 Q 145 120 145 130 Q 145 120 155 120 Q 145 120 145 110 Z" fill="#fbbf24"/>
    <!-- Sparkle 2 -->
    <path d="M 90 95 Q 90 101 84 101 Q 90 101 90 107 Q 90 101 96 101 Q 90 101 90 95 Z" fill="#38bdf8"/>
    <!-- Sparkle 3 -->
    <path d="M 205 145 Q 205 150 200 150 Q 205 150 205 155 Q 205 150 210 150 Q 205 150 205 145 Z" fill="#34d399"/>
  </g>

  <!-- MAIN CHARACTER: Young woman happily throwing a wrapper into the bin, demonstrating clean habits -->
  <g id="character" transform="translate(115, 115)">
    <!-- Shadow -->
    <ellipse cx="15" cy="50" rx="14" ry="4" fill="#000" opacity="0.4"/>

    <!-- Legs & Shoes -->
    <!-- Back Leg -->
    <rect x="8" y="32" width="5" height="20" rx="2.5" fill="#0284c7"/>
    <!-- Front Leg -->
    <rect x="18" y="30" width="5" height="22" rx="2.5" fill="#0284c7"/>
    <!-- Shoes -->
    <ellipse cx="9" cy="52" rx="4" ry="2" fill="#334155"/>
    <ellipse cx="21" cy="54" rx="4" ry="2" fill="#334155"/>

    <!-- Torso (Jacket/Shirt) -->
    <path d="M 10 16 L 24 16 L 27 34 L 7 34 Z" fill="#f43f5e" rx="3"/>
    <!-- Inner Shirt Collar -->
    <path d="M 14 16 L 17 21 L 20 16 Z" fill="#ffffff"/>

    <!-- Back Arm (Holding wrapper trajectory) -->
    <path d="M 10 18 Q -2 15 -5 22" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Head & Hair -->
    <!-- Hair back -->
    <circle cx="17" cy="9" r="9" fill="#1e293b"/>
    <!-- Face -->
    <circle cx="18" cy="10" r="8" fill="#fcd34d"/>
    <!-- Hair front/bangs -->
    <path d="M 10 7 Q 15 3 22 7 Q 17 4 10 7 Z" fill="#1e293b"/>
    <!-- Facial expression: happy eyes & smile -->
    <circle cx="16" cy="9" r="1" fill="#1e293b"/>
    <circle cx="21" cy="9" r="1" fill="#1e293b"/>
    <path d="M 17 12 Q 18.5 14 20 12" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <circle cx="14" cy="11" r="1.5" fill="#fb7185" opacity="0.6"/>
    <circle cx="23" cy="11" r="1.5" fill="#fb7185" opacity="0.6"/>

    <!-- Front Arm (Reaching forward towards the bin) -->
    <path d="M 22 18 Q 32 15 38 22" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="39" cy="23" r="2.5" fill="#fcd34d"/>

    <!-- Clean wrapper flying into the bin -->
    <g transform="translate(48, 12)">
      <path d="M 0 0 L 6 2 L 4 7 L -2 5 Z" fill="#fbbf24"/>
      <path d="M 2 2 L 8 4" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Leaf floating in clean breeze -->
  <g transform="translate(45, 80) rotate(25)" filter="url(#glow)">
    <path d="M 0 6 C 0 0 6 -6 12 -6 C 6 -6 0 0 0 6 Z" fill="#34d399"/>
    <path d="M 0 6 L 10 -4" stroke="#059669" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g transform="translate(190, 60) rotate(-40)" filter="url(#glow)">
    <path d="M 0 6 C 0 0 6 -6 12 -6 C 6 -6 0 0 0 6 Z" fill="#38bdf8"/>
    <path d="M 0 6 L 10 -4" stroke="#0284c7" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Ambient lighting/vignette overlay for rich app-icon depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
</svg>