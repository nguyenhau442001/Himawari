<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Floodwater Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Floodwater Highlight -->
    <linearGradient id="waterTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- House Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- House Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Background Environment & Hills -->
  <path d="M0 150 Q 60 120, 120 145 T 240 135 L 240 240 L 0 240 Z" fill="#475569" opacity="0.6"/>
  <path d="M0 160 Q 80 130, 160 155 T 240 145 L 240 240 L 0 240 Z" fill="#334155" opacity="0.8"/>

  <!-- Village Houses (Partially Submerged) -->
  <!-- House 1 (Left background) -->
  <g transform="translate(25, 115)">
    <rect x="0" y="30" width="45" height="40" fill="url(#wallGrad)" rx="2"/>
    <polygon points="-5,30 22,5 50,30" fill="url(#roofGrad)"/>
    <rect x="15" y="45" width="15" height="25" fill="#78350f" rx="1"/>
  </g>

  <!-- House 2 (Right background) -->
  <g transform="translate(165, 125)">
    <rect x="0" y="25" width="50" height="35" fill="url(#wallGrad)" rx="2"/>
    <polygon points="-5,25 25,2 55,25" fill="url(#roofGrad)"/>
    <rect x="18" y="38" width="14" height="22" fill="#78350f" rx="1"/>
  </g>

  <!-- Submerged Tree (Left) -->
  <g transform="translate(15, 130)">
    <path d="M15 50 L15 15 Q 15 5, 25 5 Q 35 5, 35 15 L35 50 Z" fill="#78350f"/>
    <circle cx="25" cy="0" r="14" fill="#065f46" opacity="0.9"/>
    <circle cx="16" cy="-5" r="10" fill="#047857" opacity="0.9"/>
    <circle cx="34" cy="-5" r="10" fill="#047857" opacity="0.9"/>
  </g>

  <!-- Main Submerged Village Scene (Center Foreground) -->
  <!-- House 3 (Center-Left) -->
  <g transform="translate(80, 95)">
    <!-- Walls -->
    <rect x="0" y="35" width="75" height="55" fill="url(#wallGrad)" rx="3"/>
    <!-- Roof -->
    <polygon points="-8,35 37,5 83,35" fill="url(#roofGrad)"/>
    <polygon points="-8,35 83,35 83,40 -8,40" fill="#991b1b"/>
    
    <!-- Windows (Half underwater) -->
    <rect x="12" y="48" width="16" height="20" fill="#1e293b" rx="2"/>
    <rect x="47" y="48" width="16" height="20" fill="#1e293b" rx="2"/>
    <line x1="20" y1="48" x2="20" y2="68" stroke="#fef3c7" stroke-width="2"/>
    <line x1="12" y1="58" x2="28" y2="58" stroke="#fef3c7" stroke-width="2"/>
    <line x1="55" y1="48" x2="55" y2="68" stroke="#fef3c7" stroke-width="2"/>
    <line x1="47" y1="58" x2="63" y2="58" stroke="#fef3c7" stroke-width="2"/>

    <!-- Door (Submerged at base) -->
    <rect x="30" y="60" width="15" height="30" fill="#78350f" rx="1"/>
  </g>

  <!-- FLOODWATER LAYER (Deep rising water covering lower parts of village) -->
  <path d="M0 135 C 40 128, 80 142, 120 135 C 160 128, 200 142, 240 135 L 240 240 L 0 240 Z" fill="url(#waterGrad)"/>
  
  <!-- Water Surface Wave Highlights -->
  <path d="M0 135 C 40 128, 80 142, 120 135 C 160 128, 200 142, 240 135" fill="none" stroke="url(#waterTop)" stroke-width="4" stroke-linecap="round"/>
  <path d="M20 155 C 70 148, 130 162, 220 152" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <path d="M40 175 C 90 168, 150 182, 200 172" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Floating debris/props in floodwater -->
  <!-- Wooden barrel floating -->
  <g transform="translate(55, 142) rotate(-15)">
    <rect x="0" y="0" width="16" height="12" rx="3" fill="#b45309"/>
    <line x1="4" y1="0" x2="4" y2="12" stroke="#78350f" stroke-width="2"/>
    <line x1="12" y1="0" x2="12" y2="12" stroke="#78350f" stroke-width="2"/>
  </g>
  
  <!-- Floating crate -->
  <g transform="translate(180, 155) rotate(8)">
    <rect x="0" y="0" width="18" height="14" fill="#92400e" rx="1"/>
    <line x1="0" y1="0" x2="18" y2="14" stroke="#78350f" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="0" y2="14" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- RESCUE SCENE: Person on Roof calling for help / safe -->
  <g transform="translate(125, 75)">
    <!-- Person Body (Sitting/Squatting on roof edge) -->
    <!-- Legs -->
    <rect x="15" y="32" width="10" height="8" rx="3" fill="#2563eb"/>
    <rect x="23" y="35" width="12" height="7" rx="3" fill="#2563eb"/>
    
    <!-- Torso -->
    <path d="M10 15 C 10 12, 15 10, 22 12 L 25 35 L 12 35 Z" fill="#f59e0b"/>
    
    <!-- Head -->
    <circle cx="18" cy="5" r="7" fill="#fde047"/>
    <!-- Hair -->
    <path d="M11 4 C 12 1, 24 1, 25 4 C 23 2, 13 2, 11 4 Z" fill="#451a03"/>

    <!-- Arms (One raised waving anxiously) -->
    <path d="M13 16 L 3 8" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="2" cy="7" r="3" fill="#fde047"/>
    <path d="M21 16 L 27 25" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Rescue/Emergency Lighting Element (Warm glow casting over scene) -->
  <circle cx="210" cy="40" r="25" fill="#fbbf24" opacity="0.15" filter="blur(10px)"/>
  <circle cx="210" cy="40" r="10" fill="#fef08a" opacity="0.9"/>
  <path d="M210 50 L 140 140 L 170 145 Z" fill="#fef08a" opacity="0.1"/>

  <!-- Rain effect overlay -->
  <g stroke="#93c5fd" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="30" y1="10" x2="15" y2="40"/>
    <line x1="70" y1="20" x2="55" y2="50"/>
    <line x1="110" y1="5" x2="95" y2="35"/>
    <line x1="150" y1="30" x2="135" y2="60"/>
    <line x1="190" y1="15" x2="175" y2="45"/>
    <line x1="220" y1="35" x2="205" y2="65"/>
    
    <line x1="50" y1="60" x2="35" y2="90"/>
    <line x1="90" y1="75" x2="75" y2="105"/>
    <line x1="130" y1="55" x2="115" y2="85"/>
    <line x1="170" y1="70" x2="155" y2="100"/>
    <line x1="210" y1="60" x2="195" y2="90"/>
  </g>

  <!-- Vignette / Border frame smooth inset -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>