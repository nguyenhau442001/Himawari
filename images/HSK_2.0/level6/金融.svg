<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </defs>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.1" />
    </defs>
  </defs>
  
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Cityscape Window -->
  <rect x="40" y="30" width="160" height="100" rx="8" fill="#1e293b" opacity="0.5"/>
  <path d="M50 130 V90 H70 V100 H85 V80 H105 V130 Z" fill="#0f172a"/>
  <path d="M120 130 V70 H140 V95 H155 V130 Z" fill="#0f172a"/>
  <path d="M165 130 V85 H185 V130 Z" fill="#0f172a"/>
  <circle cx="60" cy="100" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="60" cy="110" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="130" cy="85" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="130" cy="100" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="175" cy="95" r="1" fill="#fbbf24" opacity="0.6"/>

  <!-- Desk -->
  <path d="M0 190 H240 V240 H0 Z" fill="#334155"/>
  
  <!-- Character -->
  <path d="M95 240 C95 210 105 185 120 185 C135 185 145 210 145 240" fill="#cbd5e1"/>
  <path d="M115 185 L120 200 L125 185 Z" fill="#1e293b"/> <!-- Tie -->
  <path d="M110 145 C110 135 130 135 130 145 V165 C130 175 110 175 110 165 Z" fill="#fde047" opacity="0.8"/> <!-- Face stylized -->
  <path d="M110 145 C110 135 130 135 130 145 C130 140 110 140 110 145" fill="#475569"/> <!-- Hair -->
  
  <!-- Monitors -->
  <!-- Left Monitor -->
  <rect x="35" y="145" width="70" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="38" y="148" width="64" height="44" rx="2" fill="url(#screenGlow)"/>
  <!-- Candlestick Chart -->
  <line x1="45" y1="180" x2="45" y2="165" stroke="#10b981" stroke-width="2"/>
  <line x1="55" y1="175" x2="55" y2="160" stroke="#10b981" stroke-width="2"/>
  <line x1="65" y1="170" x2="65" y2="185" stroke="#fb923c" stroke-width="2"/>
  <line x1="75" y1="160" x2="75" y2="155" stroke="#10b981" stroke-width="2"/>
  <line x1="85" y1="165" x2="85" y2="175" stroke="#fb923c" stroke-width="2"/>

  <!-- Right Monitor -->
  <rect x="135" y="145" width="70" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="138" y="148" width="64" height="44" rx="2" fill="url(#screenGlow)"/>
  <!-- Line Graph -->
  <path d="M145 185 Q155 165 165 175 T185 155 T200 160" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Desk Props -->
  <rect x="210" y="180" width="12" height="15" rx="2" fill="#94a3b8"/> <!-- Mug -->
  <rect x="110" y="215" width="30" height="4" rx="2" fill="#475569"/> <!-- Keyboard -->
  
  <!-- Subtle Lighting -->
  <circle cx="70" cy="170" r="30" fill="#38bdf8" opacity="0.05"/>
  <circle cx="170" cy="170" r="30" fill="#10b981" opacity="0.05"/>
</svg>