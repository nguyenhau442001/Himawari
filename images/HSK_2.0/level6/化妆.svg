<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <defs>
    <!-- Radial glow for vanity mirror -->
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Soft skin gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Hair gradient -->
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Table wood texture -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Ambient Room Background -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" opacity="0.6"/>
  
  <!-- Warm background accent light -->
  <circle cx="120" cy="90" r="80" fill="url(#mirrorGlow)"/>

  <!-- Wall shelf with bottles -->
  <rect x="40" y="45" width="60" height="4" rx="2" fill="#475569"/>
  <rect x="50" y="25" width="12" height="20" rx="3" fill="#ec4899" opacity="0.8"/>
  <path d="M72 33 L84 33 L82 45 L74 45 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="95" cy="38" r="6" fill="#f59e0b" opacity="0.9"/>

  <!-- Hanging Plant -->
  <path d="M190 20 Q190 40 200 50" stroke="#64748b" stroke-width="2" fill="none"/>
  <circle cx="200" cy="52" r="8" fill="#10b981"/>
  <path d="M185 30 Q190 35 188 45" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M205 32 Q200 40 208 48" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Vanity Mirror (Round with Lights) -->
  <circle cx="120" cy="95" r="48" fill="#0f172a" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="120" cy="95" r="42" fill="#334155" opacity="0.4"/>
  <!-- Mirror Reflection / Face Area -->
  <circle cx="120" cy="95" r="40" fill="#1e293b"/>
  
  <!-- Mirror bulb lights -->
  <circle cx="120" cy="51" r="3" fill="#fef08a"/>
  <circle cx="145" cy="58" r="3" fill="#fef08a"/>
  <circle cx="163" cy="76" r="3" fill="#fef08a"/>
  <circle cx="168" cy="95" r="3" fill="#fef08a"/>
  <circle cx="145" cy="132" r="3" fill="#fef08a"/>
  <circle cx="95" cy="58" r="3" fill="#fef08a"/>
  <circle cx="77" cy="76" r="3" fill="#fef08a"/>
  <circle cx="72" cy="95" r="3" fill="#fef08a"/>
  <circle cx="95" cy="132" r="3" fill="#fef08a"/>
  
  <!-- Mirror Stand -->
  <path d="M115 139 L125 139 L130 160 L110 160 Z" fill="#475569"/>
  <ellipse cx="120" cy="160" rx="20" ry="4" fill="#64748b"/>

  <!-- Vanity Table / Desk -->
  <rect x="20" y="160" width="200" height="10" rx="3" fill="url(#wood)"/>

  <!-- Cosmetics & Props on Desk -->
  <!-- Palette -->
  <rect x="45" y="145" width="22" height="16" rx="4" fill="#cbd5e1"/>
  <circle cx="52" cy="151" r="3" fill="#ec4899"/>
  <circle cx="60" cy="151" r="3" fill="#f59e0b"/>
  <circle cx="52" cy="157" r="3" fill="#38bdf8"/>
  <circle cx="60" cy="157" r="3" fill="#10b981"/>

  <!-- Lipstick open -->
  <rect x="175" y="140" width="8" height="20" rx="2" fill="#cbd5e1"/>
  <path d="M175 135 L183 135 L182 140 L176 140 Z" fill="#ec4899"/>

  <!-- Perfume bottle -->
  <path d="M195 138 L205 138 L208 160 L192 160 Z" fill="#38bdf8" opacity="0.7"/>
  <rect x="198" y="133" width="4" height="5" fill="#cbd5e1"/>
  <ellipse cx="200" cy="133" rx="5" ry="2" fill="#f59e0b"/>

  <!-- Character (Woman sitting, applying makeup) -->
  <!-- Shoulders / Body / Clothes -->
  <path d="M85 215 C85 190 95 175 120 175 C145 175 155 190 155 215 Z" fill="#ec4899"/>
  <!-- Collar / Neckline detail -->
  <path d="M102 180 C120 190 138 180 138 180 C138 180 142 195 120 195 C98 195 102 180 102 180 Z" fill="#fbcfe8"/>

  <!-- Neck -->
  <rect x="110" y="145" width="20" height="35" fill="url(#skin)" rx="6"/>

  <!-- Head / Face -->
  <circle cx="120" cy="130" r="28" fill="url(#skin)"/>

  <!-- Hair Back -->
  <circle cx="120" cy="125" r="30" fill="url(#hair)" style="z-index:-1"/>
  
  <!-- Cute Hair Style (Bun/Top knot hint and side bangs) -->
  <path d="M92 120 Q90 100 110 105 Q120 90 135 105 Q150 100 148 125 Q152 145 140 160 L100 160 Q88 140 92 120 Z" fill="url(#hair)"/>
  
  <!-- Face features -->
  <!-- Gentle closed happy eyes (arches) -->
  <path d="M107 128 Q112 123 117 128" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M123 128 Q128 123 133 128" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Rosy Cheeks -->
  <circle cx="107" cy="135" r="5" fill="#fda4af" opacity="0.6"/>
  <circle cx="133" cy="135" r="5" fill="#fda4af" opacity="0.6"/>

  <!-- Smile -->
  <path d="M115 142 Q120 147 125 142" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyelash / Makeup touch (Action context) -->
  <!-- Makeup brush in hand -->
  <g transform="translate(135, 110) rotate(-25)">
    <!-- Brush Handle -->
    <rect x="0" y="0" width="4" height="35" rx="2" fill="#f8fafc"/>
    <rect x="-1" y="28" width="6" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Brush Bristles -->
    <path d="M-1 34 Q2 42 5 34 Z" fill="#ec4899"/>
  </g>

  <!-- Arm raising to face -->
  <path d="M138 180 Q150 140 138 120" stroke="url(#skin)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Other arm resting on desk -->
  <path d="M102 180 Q85 185 80 165" stroke="url(#skin)" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="78" cy="162" r="5" fill="url(#skin)"/>

  <!-- Sparkles / Beauty highlights -->
  <path d="M85 85 L87 90 L92 92 L87 94 L85 99 L83 94 L78 92 L83 90 Z" fill="#fef08a" opacity="0.8"/>
  <path d="M155 105 L156 108 L159 109 L156 110 L155 113 L154 110 L151 109 L154 108 Z" fill="#38bdf8" opacity="0.9"/>
  <circle cx="150" cy="75" r="2" fill="#fef08a"/>
  
  <!-- Foreground styling gradient overlay -->
  <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="80%" stop-color="#0f172a" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5"/>
  </linearGradient>
  <rect width="240" height="240" fill="url(#vignette)" pointer-events="none"/>
</svg>