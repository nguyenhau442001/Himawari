<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dress-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Lighting / Stage Effect -->
  <circle cx="120" cy="0" r="140" fill="url(#lamp-glow)"/>

  <!-- Interior Environment / Art Gallery or Elegant Lounge -->
  <!-- Background Wall Art / Minimalist Frame -->
  <rect x="140" y="45" width="55" height="75" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="146" y="52" width="43" height="61" fill="#475569" opacity="0.5"/>
  <circle cx="167" cy="82" r="14" fill="#fbbf24" opacity="0.3"/>
  <path d="M 152 100 Q 167 75 182 100 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- House Plant on sleek stand -->
  <path d="M 45 190 L 55 190 L 52 145 L 48 145 Z" fill="#64748b"/>
  <ellipse cx="50" cy="145" rx="8" ry="3" fill="#94a3b8"/>
  <path d="M 50 142 C 40 130 35 115 30 105 C 45 110 50 125 50 142 Z" fill="#10b981"/>
  <path d="M 50 142 C 60 120 70 110 80 95 C 70 115 60 125 50 142 Z" fill="#059669"/>
  <path d="M 50 142 C 52 120 48 105 45 90 C 48 110 49 125 50 142 Z" fill="#34d399"/>

  <!-- Elegant Floor / Surface -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#475569" stroke-width="1.5" opacity="0.5"/>

  <!-- Modern Designer Chair / Prop -->
  <path d="M 85 160 L 115 160 L 125 200 L 75 200 Z" fill="url(#wood-grad)"/>
  <path d="M 92 120 C 85 130 85 150 85 160 L 115 160 C 115 150 115 130 108 120 Z" fill="#b45309"/>
  <path d="M 90 110 Q 100 95 110 110 Q 115 135 100 135 Q 85 135 90 110 Z" fill="#d97706"/>
  <!-- Chair legs -->
  <line x1="82" y1="200" x2="72" y2="225" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="200" x2="128" y2="225" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="200" x2="85" y2="228" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- MAIN CHARACTER: Graceful Woman ("qìzhì" - poise, elegance, refined demeanor) -->
  <g transform="translate(10, 0)">
    <!-- Elegant Posture: Standing gracefully, holding a book or gesturing gently -->
    
    <!-- Legs in graceful posture (one crossed slightly behind) -->
    <path d="M 112 170 L 108 215 C 108 220 112 223 116 220 L 122 185 Z" fill="#334155"/>
    <path d="M 124 170 L 128 213 C 128 218 125 222 120 220 L 114 190 Z" fill="#1e293b"/>
    <!-- Stylish Shoes -->
    <ellipse cx="116" cy="222" rx="5" ry="2" fill="#0f172a"/>
    <ellipse cx="120" cy="221" rx="5" ry="2" fill="#0f172a"/>

    <!-- Flowing Dress / Skirt embodying grace -->
    <path d="M 100 115 Q 120 110 135 115 L 148 175 Q 120 185 92 175 Z" fill="url(#dress-grad)"/>
    <!-- Dress folds / motion lines -->
    <path d="M 110 125 Q 120 150 124 178" stroke="#0284c7" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 125 125 Q 132 150 138 176" stroke="#0284c7" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Torso & Upper Body (Poised, upright posture) -->
    <path d="M 104 80 L 132 80 L 140 120 L 96 120 Z" fill="#0284c7"/>
    <!-- Chic Collar / Scarf accent -->
    <path d="M 110 80 Q 118 95 126 80 Q 120 75 110 80 Z" fill="#fbbf24"/>

    <!-- Arms & Hands in graceful gesture -->
    <!-- Back arm -->
    <path d="M 100 85 L 85 110 L 95 115" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front arm holding a teacup or book delicately -->
    <path d="M 136 85 Q 150 100 145 115" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="116" r="3.5" fill="#fbcfe8"/>

    <!-- Delicate Saucer & Teacup (Props showing refinement) -->
    <ellipse cx="145" cy="122" rx="7" ry="2.5" fill="#f8fafc"/>
    <path d="M 142 118 L 148 118 L 147 122 L 143 122 Z" fill="#cbd5e1"/>

    <!-- Neck -->
    <path d="M 112 70 L 124 70 L 124 82 L 112 82 Z" fill="#fbcfe8"/>

    <!-- Head & Hair (Sophisticated hairstyle) -->
    <!-- Back Hair / Bun -->
    <circle cx="132" cy="55" r="10" fill="#0f172a"/>
    <!-- Head Base -->
    <circle cx="118" cy="54" r="14" fill="#fbcfe8"/>
    <!-- Elegant Hair Styling -->
    <path d="M 104 54 C 104 40 128 40 132 58 C 125 46 110 46 104 54 Z" fill="#0f172a"/>
    <path d="M 110 45 C 115 42 125 43 130 50 C 122 45 115 45 110 45 Z" fill="#334155"/>

    <!-- Facial Profile (Calm, confident, gentle smile) -->
    <path d="M 128 52 Q 131 55 128 58" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- Gentle smile -->
    <circle cx="124" cy="51" r="1.5" fill="#0f172a"/> <!-- Eye -->
    <!-- Subtle eyelash line -->
    <path d="M 122 49 C 124 48 126 49 127 50" stroke="#0f172a" stroke-width="1" fill="none"/>

    <!-- Elegant Ear with tiny earring -->
    <circle cx="112" cy="54" r="2" fill="#fbcfe8"/>
    <circle cx="111" cy="56" r="1" fill="#fbbf24"/>
  </g>

  <!-- Ambient Sparkles / Aura of "Qìzhì" (Poise and Aura) -->
  <g fill="#fbbf24">
    <circle cx="165" cy="135" r="2" opacity="0.8"/>
    <path d="M 165 128 L 165 142 M 158 135 L 172 135" stroke="#fbbf24" stroke-width="0.8" opacity="0.6"/>
    
    <circle cx="95" cy="85" r="1.5" opacity="0.7"/>
    <path d="M 95 81 L 95 89 M 91 85 L 99 85" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>

    <circle cx="140" cy="40" r="1.8" opacity="0.9"/>
    
    <circle cx="70" cy="120" r="1.2" opacity="0.6"/>
  </g>
</svg>