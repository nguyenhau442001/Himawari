<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Environment / Office Setting -->
  <!-- Back Wall & Window -->
  <rect x="24" y="20" width="192" height="130" rx="6" fill="#1e293b"/>
  <!-- Window Grid Showing Night City Lights -->
  <rect x="150" y="35" width="50" height="65" rx="4" fill="#090d16"/>
  <path d="M150 67.5H200 M175 35V100" stroke="#1e293b" stroke-width="2"/>
  <circle cx="165" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="80" r="1.5" fill="#f59e0b" opacity="0.6"/>
  
  <!-- Office Plant -->
  <path d="M38 115 C38 105 45 105 45 115 L45 140 L35 140 Z" fill="#334155"/>
  <path d="M41 105 C30 90 35 75 41 70 C47 75 52 90 41 105 Z" fill="#10b981"/>
  <path d="M41 105 C55 95 65 100 70 105 C60 110 50 110 41 105 Z" fill="#059669"/>

  <!-- Conference Table -->
  <path d="M20 145 H220 L210 185 H30 Z" fill="#334155"/>
  <rect x="20" y="145" width="200" height="6" rx="3" fill="#475569"/>

  <!-- Character 1: The Speaker (Confident, leading the meeting) -->
  <g transform="translate(60, 80)">
    <!-- Body & Torso -->
    <path d="M10 65 C10 45 25 40 40 40 C55 40 70 45 70 65 L80 100 H0 Z" fill="#38bdf8"/>
    <!-- Collar & Tie -->
    <polygon points="30,40 50,40 40,55" fill="#f8fafc"/>
    <polygon points="38,55 42,55 44,75 40,82 36,75" fill="#ef4444"/>
    <!-- Head & Hair -->
    <circle cx="40" cy="22" r="16" fill="#fbcfe8"/>
    <path d="M24 20 C24 10 32 6 40 6 C48 6 56 10 56 20 C56 22 55 24 54 20 C50 12 30 12 26 20 C25 24 24 22 24 20 Z" fill="#1e293b"/>
    <!-- Confident Expression & Gestures -->
    <circle cx="34" cy="21" r="1.5" fill="#0f172a"/>
    <circle cx="46" cy="21" r="1.5" fill="#0f172a"/>
    <path d="M37 28 Q40 31 43 28" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Raised Arm making a point -->
    <path d="M65 50 Q75 35 70 25" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="68" cy="23" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: The Follower (附和 - Mimicking posture, nodding, repeating agreement) -->
  <g transform="translate(130, 85)">
    <!-- Body & Torso (Leaning forward eagerly) -->
    <path d="M15 60 C15 42 28 38 42 38 C56 38 70 42 70 60 L75 95 H5 Z" fill="#fb923c"/>
    <!-- Collar -->
    <polygon points="32,38 52,38 42,50" fill="#f8fafc"/>
    <!-- Head & Hair (Tilted in agreement) -->
    <circle cx="42" cy="20" r="15" fill="#fbcfe8"/>
    <path d="M28 18 C28 8 36 6 44 6 C52 6 58 10 58 18 C55 16 33 14 28 18 Z" fill="#475569"/>
    <!-- Expression: Over-enthusiastic agreement -->
    <circle cx="37" cy="19" r="1.5" fill="#0f172a"/>
    <circle cx="47" cy="19" r="1.5" fill="#0f172a"/>
    <!-- Wide eager smile -->
    <path d="M38 25 Q42 29 46 25" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Nodding / Hands clapped together in sycophantic agreement -->
    <path d="M15 55 Q30 50 40 60" stroke="#fb923c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M65 55 Q50 50 42 60" stroke="#fb923c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="39" cy="62" r="4.5" fill="#fbcfe8"/>
  </g>

  <!-- Context Props on Desk: Laptops, Coffee, Notes -->
  <!-- Laptop 1 -->
  <path d="M45 165 L65 150 H95 L115 165 Z" fill="#64748b"/>
  <rect x="55" y="135" width="40" height="18" rx="2" fill="#cbd5e1"/>
  <!-- Coffee Cup -->
  <rect x="175" y="145" width="14" height="18" rx="2" fill="#f8fafc"/>
  <path d="M189 150 C194 150 194 158 189 158" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M172 163 H200" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Speech bubble / Echo visual cue (Abstractly showing agreement/copying without text) -->
  <g transform="translate(145, 45)">
    <path d="M0 15 C0 7 7 0 15 0 H35 C43 0 50 7 50 15 C50 23 43 30 35 30 H20 L10 40 L12 30 C5 30 0 23 0 15 Z" fill="#fef3c7"/>
    <!-- Checkmark & Duplicate Arrow inside bubble implying "Just echoing/copying opinions" -->
    <path d="M15 15 L22 22 L35 9" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Small secondary echo bubble -->
  <g transform="translate(130, 30)">
    <circle cx="6" cy="6" r="4" fill="#fef3c7"/>
    <circle cx="16" cy="16" r="7" fill="#fef3c7"/>
  </g>

  <!-- Foreground shading for depth -->
  <rect x="0" y="210" width="240" height="30" fill="#090d16" opacity="0.4"/>
</svg>