<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Classroom Wall -->
  <rect x="20" y="30" width="200" height="140" rx="10" fill="#334155"/>
  <rect x="25" y="35" width="190" height="130" rx="8" fill="#1e293b"/>
  
  <!-- Teacher character -->
  <g transform="translate(160, 80)">
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <path d="M-5 -5 h2 m4 0 h2 M-5 5 q5 5 10 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-10" y="15" width="20" height="30" rx="4" fill="#38bdf8"/>
    <rect x="-12" y="15" width="5" height="20" rx="2" fill="#38bdf8"/>
    <rect x="7" y="15" width="5" height="20" rx="2" fill="#38bdf8"/>
  </g>
  
  <!-- Student character (The one being punished) -->
  <g transform="translate(80, 100)">
    <circle cx="0" cy="0" r="15" fill="#fca5a5"/>
    <path d="M-5 -5 h2 m4 0 h2 M-5 5 q5 2 10 2" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="-10" y="15" width="20" height="40" rx="4" fill="#ec4899"/>
    <rect x="-12" y="15" width="5" height="25" rx="2" fill="#ec4899"/>
    <rect x="7" y="15" width="5" height="25" rx="2" fill="#ec4899"/>
  </g>

  <!-- The "Punishment" prop: Standing in the corner -->
  <rect x="35" y="90" width="10" height="60" rx="2" fill="#94a3b8"/>
  
  <!-- Floor -->
  <rect x="0" y="170" width="240" height="70" fill="#1e293b"/>
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="2"/>
  
  <!-- Desk/Context -->
  <rect x="140" y="130" width="60" height="40" rx="4" fill="#475569"/>
  <rect x="145" y="135" width="50" height="5" rx="1" fill="#f59e0b"/>
  
  <!-- Visual indicator of error (broken vase) -->
  <g transform="translate(60, 160)">
    <path d="M-10 10 L10 10 L5 -10 L-5 -10 Z" fill="#fb923c"/>
    <path d="M-5 0 L5 0" stroke="#0f172a" stroke-width="1"/>
  </g>
</svg>