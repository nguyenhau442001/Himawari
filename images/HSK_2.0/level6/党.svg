<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Glow for Certificate/Application -->
    <radialGradient id="paper-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Characters/Objects -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lamp Glow & Lighting -->
  <circle cx="180" cy="50" r="100" fill="url(#lamp-glow)" />

  <!-- Background Environment: Office / Meeting Room -->
  <!-- Bookshelf & Wall details -->
  <rect x="25" y="40" width="70" height="95" rx="4" fill="#1b263b" />
  <!-- Shelf rows -->
  <rect x="30" y="65" width="60" height="6" rx="2" fill="#475569" />
  <rect x="30" y="90" width="60" height="6" rx="2" fill="#475569" />
  <rect x="30" y="115" width="60" height="6" rx="2" fill="#475569" />
  <!-- Colorful books on shelf -->
  <rect x="35" y="48" width="8" height="17" rx="2" fill="#38bdf8" />
  <rect x="45" y="45" width="10" height="20" rx="2" fill="#f43f5e" />
  <rect x="57" y="50" width="7" height="15" rx="2" fill="#10b981" />
  <rect x="70" y="47" width="12" height="18" rx="2" fill="#fbbf24" />

  <rect x="38" y="72" width="14" height="18" rx="2" fill="#a855f7" />
  <rect x="54" y="74" width="8" height="16" rx="2" fill="#38bdf8" />

  <!-- Window with night city view -->
  <path d="M125,35 L195,35 L195,100 L125,100 Z" fill="#090d16" stroke="#475569" stroke-width="2" />
  <!-- City building silhouettes outside -->
  <rect x="132" y="65" width="12" height="35" fill="#1e293b" />
  <rect x="146" y="50" width="15" height="50" fill="#1e293b" />
  <rect x="163" y="70" width="10" height="30" fill="#1e293b" />
  <rect x="175" y="58" width="14" height="42" fill="#1e293b" />
  <!-- City window lights -->
  <rect x="135" y="70" width="2" height="3" fill="#fbbf24" opacity="0.6" />
  <rect x="150" y="55" width="3" height="4" fill="#fbbf24" opacity="0.8" />
  <rect x="150" y="65" width="3" height="4" fill="#38bdf8" opacity="0.6" />
  <rect x="178" y="65" width="2" height="3" fill="#fbbf24" opacity="0.9" />

  <!-- Office Desk -->
  <rect x="15" y="160" width="210" height="12" rx="4" fill="#334155" filter="url(#shadow)" />
  <rect x="25" y="172" width="14" height="55" rx="3" fill="#1e293b" />
  <rect x="201" y="172" width="14" height="55" rx="3" fill="#1e293b" />
  <rect x="15" y="160" width="210" height="4" rx="2" fill="#475569" /> <!-- Desk edge highlight -->

  <!-- Desk Props -->
  <!-- Desk Lamp -->
  <path d="M185,160 L185,110 L160,85" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M148,78 L168,72 L160,92 Z" fill="#fbbf24" />

  <!-- Pen holder & pens -->
  <rect x="195" y="135" width="14" height="25" rx="3" fill="#64748b" />
  <line x1="200" y1="135" x2="197" y2="122" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
  <line x1="205" y1="135" x2="208" y2="120" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Potted Plant on desk -->
  <path d="M40,145 L50,160 L30,160 Z" fill="#cbd5e1" />
  <ellipse cx="40" cy="144" rx="10" ry="3" fill="#94a3b8" />
  <circle cx="37" cy="136" r="6" fill="#10b981" />
  <circle cx="45" cy="133" r="8" fill="#059669" />
  <circle cx="41" cy="140" r="7" fill="#34d399" />

  <!-- MAIN CHARACTER: Man Joining/Committing (Leaning forward signing document) -->
  <!-- Chair Back -->
  <path d="M70,110 Q70,95 85,95 L95,95 Q110,95 110,110 L105,165 L75,165 Z" fill="#334155" filter="url(#shadow)" />
  
  <!-- Character Body / Torso (Blue Shirt & Vest) -->
  <path d="M70,125 L110,125 L120,165 L60,165 Z" fill="#1d4ed8" /> <!-- Blue shirt base -->
  <!-- Vest / Formal Jacket -->
  <path d="M68,125 L85,125 L80,165 L60,165 Z" fill="#0f172a" />
  <path d="M112,125 L95,125 L100,165 L120,165 Z" fill="#0f172a" />
  <!-- Tie -->
  <polygon points="88,125 92,125 94,150 90,158 86,150" fill="#ef4444" />

  <!-- Character Neck & Head -->
  <rect x="83" y="108" width="14" height="20" rx="6" fill="#fcd34d" />
  <!-- Head -->
  <circle cx="90" cy="92" r="18" fill="#fcd34d" filter="url(#shadow)" />
  <!-- Hair (Neat modern styling) -->
  <path d="M72,92 Q72,74 90,74 Q108,74 108,92 Q105,82 90,81 Q75,82 72,92 Z" fill="#1e293b" />

  <!-- Facial expression: Confident, focused, smiling -->
  <!-- Eyebrows -->
  <path d="M80,87 Q85,84 90,87" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M92,87 Q97,84 102,87" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes (Happy / Determined arcs or dots) -->
  <circle cx="85" cy="92" r="2" fill="#1e293b" />
  <circle cx="97" cy="92" r="2" fill="#1e293b" />
  <!-- Smile -->
  <path d="M87,100 Q91,104 95,100" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Arms & Hands -->
  <!-- Left Arm (Holding pen / writing) -->
  <path d="M68,130 L45,145 L75,155" fill="none" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Hand holding pen -->
  <circle cx="78" cy="153" r="6" fill="#fcd34d" />
  <!-- Pen -->
  <line x1="72" y1="162" x2="85" y2="145" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Right Arm (Resting on desk) -->
  <path d="M112,130 L130,145 L115,160" fill="none" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="112" cy="160" r="6" fill="#fcd34d" />

  <!-- CENTRAL FOCUS: The Official Document / Application Form ("Joining the Organization/Party") -->
  <g filter="url(#shadow)">
    <!-- Glow behind document -->
    <circle cx="95" cy="155" r="30" fill="url(#paper-glow)" />
    
    <!-- Paper Sheet -->
    <polygon points="70,140 120,135 125,175 75,180" fill="#f8fafc" />
    
    <!-- Document Header Accent (Red Banner symbolizing formal allegiance/membership) -->
    <path d="M74,143 L118,138 L118,148 L74,153 Z" fill="#dc2626" />

    <!-- Mock text lines on document -->
    <line x1="78" y1="158" x2="105" y2="155" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="77" y1="165" x2="112" y2="162" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="76" y1="172" x2="98" y2="170" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Official Red Seal / Stamp on the document (classic circular stamp graphic) -->
    <circle cx="110" cy="168" r="8" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <circle cx="110" cy="168" r="5" fill="#dc2626" opacity="0.3" />
    <path d="M107,168 L113,168 M110,165 L110,171" stroke="#dc2626" stroke-width="1.5" />
  </g>

  <!-- SECOND CHARACTER: Welcoming Colleague / Mentor supporting the action -->
  <!-- Mentor Torso (Friendly professional attire - emerald green blazer) -->
  <path d="M145,130 L185,130 L195,175 L135,175 Z" fill="#047857" />
  <path d="M150,130 L165,130 L160,175 L135,175 Z" fill="#065f46" />
  <path d="M180,130 L165,130 L170,175 L195,175 Z" fill="#065f46" />
  <!-- Inner shirt -->
  <path d="M162,130 L168,130 L167,150 L163,150 Z" fill="#f8fafc" />

  <!-- Mentor Head & Hair -->
  <circle cx="165" cy="98" r="16" fill="#fcd34d" filter="url(#shadow)" />
  <path d="M151,95 Q153,82 165,82 Q180,82 181,96 Q175,88 165,88 Q155,88 151,95 Z" fill="#334155" />

  <!-- Mentor Facial expression: Encouraging smile -->
  <circle cx="160" cy="97" r="1.5" fill="#1e293b" />
  <circle cx="170" cy="97" r="1.5" fill="#1e293b" />
  <path d="M162,104 Q165,108 168,104" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Mentor Gesturing (Pointing warmly toward the application) -->
  <path d="M150,135 L130,148" fill="none" stroke="#047857" stroke-width="10" stroke-linecap="round" />
  <circle cx="127" cy="150" r="5" fill="#fcd34d" />

  <!-- Foreground Atmospheric Particles / Sparkles (Success / Milestone atmosphere) -->
  <circle cx="135" cy="115" r="2.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="110" cy="110" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="145" cy="80" r="2" fill="#34d399" opacity="0.7" />
  <circle cx="65" cy="70" r="2" fill="#fbbf24" opacity="0.6" />
  
  <!-- Subtle App Polish Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.4" />
</svg>