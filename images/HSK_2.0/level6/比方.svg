<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(20, 40)">
    <!-- Table -->
    <rect x="10" y="120" width="180" height="15" rx="2" fill="#475569"/>
    <rect x="30" y="135" width="10" height="40" fill="#334155"/>
    <rect x="160" y="135" width="10" height="40" fill="#334155"/>
    
    <!-- Character 1 (The guide) -->
    <circle cx="50" cy="80" r="15" fill="#fde68a"/>
    <path d="M35 95 Q50 110 65 95" stroke="#fde68a" stroke-width="4" fill="none"/>
    <rect x="40" y="100" width="20" height="30" rx="5" fill="#38bdf8"/>
    <path d="M45 110 L35 130" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Character 2 (The listener) -->
    <circle cx="140" cy="80" r="15" fill="#fde68a"/>
    <path d="M125 95 Q140 110 155 95" stroke="#fde68a" stroke-width="4" fill="none"/>
    <rect x="130" y="100" width="20" height="30" rx="5" fill="#ec4899"/>
    
    <!-- The "Step" - A DIY project (e.g., building a small robot or model) -->
    <rect x="75" y="100" width="40" height="20" rx="3" fill="#fb923c"/>
    <circle cx="85" cy="110" r="5" fill="#10b981"/>
    <circle cx="105" cy="110" r="5" fill="#10b981"/>
    
    <!-- Pointer/Gesture -->
    <path d="M65 105 L80 95" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="95" r="4" fill="#f59e0b"/>
    
    <!-- Ambient details -->
    <circle cx="180" cy="30" r="3" fill="#fbbf24" opacity="0.5"/>
    <circle cx="20" cy="20" r="2" fill="#fbbf24" opacity="0.3"/>
    <rect x="150" y="50" width="30" height="40" rx="2" fill="#334155" opacity="0.4"/>
  </g>
</svg>