<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background grid/glow to enhance contrast -->
  <circle cx="120" cy="120" r="85" fill="#222733" opacity="0.6"/>

  <!-- Chart/Graph base grid lines -->
  <line x1="60" y1="165" x2="190" y2="165" stroke="#2D3342" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="75" x2="60" y2="175" stroke="#2D3342" stroke-width="2" stroke-linecap="round"/>

  <!-- Before state: Small, flat, dull trend (representing "before improvement") -->
  <path d="M 60 150 L 95 145 L 130 148" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="130" cy="148" r="4" fill="#64748B"/>

  <!-- The Dramatic Upward Shift / "Xiǎnzhù" (Significant/Remarkable Contrast) -->
  <!-- Connecting dashed trajectory of significant leap -->
  <path d="M 130 148 Q 155 110 175 75" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- After state: Large, vibrant, soaring trend line with high contrast -->
  <path d="M 60 150 Q 115 155 130 148 C 145 140 160 105 180 70" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Accent Node at the peak representing remarkable/obvious prominence -->
  <circle cx="180" cy="70" r="10" fill="#F59E0B" opacity="0.25"/>
  <circle cx="180" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="180" cy="70" r="2.5" fill="#1A1D24"/>

  <!-- Scale Exaggeration Elements: Glowing upward indicator burst at the peak -->
  <g transform="translate(180, 70)">
    <path d="M 0 -14 L 0 -22 M 10 -10 L 16 -16 M -10 -10 L -16 -16" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Secondary data points showing clean flat-design hierarchy -->
  <circle cx="95" cy="145" r="3" fill="#475569"/>
  <circle cx="130" cy="148" r="3" fill="#475569"/>
  
  <!-- Subtle floor shadow under chart -->
  <ellipse cx="125" cy="178" rx="75" ry="3" fill="#12151B"/>
</svg>