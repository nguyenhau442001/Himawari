<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Factory Background -->
  <rect x="20" y="80" width="200" height="100" fill="#334155" rx="4"/>
  <rect x="30" y="90" width="40" height="30" fill="#475569"/>
  <rect x="80" y="90" width="40" height="30" fill="#475569"/>
  <rect x="130" y="90" width="40" height="30" fill="#475569"/>
  <rect x="180" y="90" width="30" height="30" fill="#475569"/>
  
  <!-- Conveyor Belt -->
  <rect x="0" y="180" width="240" height="20" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="20" cy="190" r="8" fill="#64748b"/>
  <circle cx="220" cy="190" r="8" fill="#64748b"/>

  <!-- Worker Character -->
  <g transform="translate(60, 110)">
    <path d="M20 70 L20 110 M40 70 L40 110" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="40" r="20" fill="#fcd34d"/>
    <path d="M15 35 Q20 30 25 35 M35 35 Q40 30 45 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M20 50 Q30 55 40 50" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="10" y="60" width="40" height="15" fill="#38bdf8" rx="4"/>
  </g>

  <!-- Oppressive Figure (The Exploiter) -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="40" height="80" fill="#ec4899" rx="10" opacity="0.8"/>
    <circle cx="20" cy="-10" r="15" fill="#ec4899"/>
    <path d="M10 20 L-20 40 M30 20 L60 40" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Action: Worker pushing away -->
  <path d="M80 130 L120 130" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
  <circle cx="130" cy="130" r="5" fill="#fb923c"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="220" rx="100" ry="10" fill="#000" opacity="0.3"/>
</svg>