<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="150" width="10" height="80" fill="#475569"/>
  <rect x="200" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- The Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 100 Q-40 50 0 50 T40 100" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="30" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-30 20 Q-30 -10 0 -10 T30 20" fill="#1e293b"/>
    <!-- Expression of restraint -->
    <line x1="-10" y1="10" x2="-5" y2="15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="10" x2="5" y2="15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-10 35 Q0 30 10 35" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Clenched Fists on desk -->
    <circle cx="-50" cy="30" r="12" fill="#fde68a"/>
    <circle cx="50" cy="30" r="12" fill="#fde68a"/>
  </g>
  
  <!-- Emotional Pressure Visualization (Abstracted as warm glow/sparks) -->
  <circle cx="120" cy="100" r="5" fill="#fb923c" opacity="0.6">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M110 90 L130 90 M120 80 L120 100" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Office Props -->
  <rect x="160" y="110" width="30" height="20" rx="2" fill="#ec4899"/>
  <circle cx="50" cy="120" r="8" fill="#10b981"/>
  <rect x="45" y="125" width="10" height="15" fill="#10b981"/>
</svg>