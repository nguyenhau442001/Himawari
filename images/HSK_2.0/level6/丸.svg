<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2A324B"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </radialGradient>

    <!-- Pill Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Sphere Spherical Pill (丸) Gradient -->
    <radialGradient id="pillBody" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="15%" stop-color="#FDE047"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <!-- Pill Specular Highlight -->
    <linearGradient id="pillHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Pill Gradient (Inside Bottle) -->
    <radialGradient id="darkPill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Shadow Gradient -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F1117" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Subtle Surface Grid / Platform Line -->
  <ellipse cx="120" cy="180" rx="85" ry="20" fill="none" stroke="#2E384D" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- BACKGROUND CONTEXT: Medicine Bottle (Left) -->
  <g transform="translate(42, 85) rotate(-12)">
    <!-- Bottle Shadow -->
    <ellipse cx="25" cy="82" rx="22" ry="6" fill="url(#dropShadow)"/>
    <!-- Bottle Body -->
    <rect x="5" y="20" width="40" height="60" rx="8" fill="#242C3D" stroke="#3B475D" stroke-width="1.5"/>
    <!-- Bottle Liquid/Content Layer -->
    <rect x="8" y="38" width="34" height="39" rx="5" fill="#1D2330"/>
    <!-- Pills Inside Bottle -->
    <circle cx="20" cy="62" r="7" fill="url(#darkPill)"/>
    <circle cx="30" cy="55" r="7" fill="url(#darkPill)"/>
    <!-- Bottle Neck & Cap -->
    <rect x="12" y="12" width="26" height="8" rx="2" fill="#3B475D"/>
    <rect x="9" y="5" width="32" height="9" rx="3" fill="#38BDF8"/>
    <!-- Bottle Highlight -->
    <rect x="9" y="24" width="3" height="50" rx="1.5" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- BACKGROUND CONTEXT: Glass of Water (Right) -->
  <g transform="translate(162, 95)">
    <!-- Glass Shadow -->
    <ellipse cx="18" cy="72" rx="18" ry="5" fill="url(#dropShadow)"/>
    <!-- Glass Body -->
    <polygon points="4,0 32,0 28,68 8,68" fill="#242C3D" stroke="#3B475D" stroke-width="1.5"/>
    <!-- Water Content -->
    <polygon points="7,22 29,22 26,65 10,65" fill="#38BDF8" opacity="0.2"/>
    <ellipse cx="18" cy="22" rx="11" ry="2" fill="#38BDF8" opacity="0.4"/>
    <!-- Glass Rim & Highlights -->
    <ellipse cx="18" cy="0" rx="14" ry="3" fill="none" stroke="#475569" stroke-width="1.5"/>
    <line x1="9" y1="8" x2="12" y2="58" stroke="#ffffff" stroke-width="1.5" opacity="0.1" stroke-linecap="round"/>
  </g>

  <!-- CENTRAL FOCUS: Single Medicinal Pill ("丸" - Wán) -->
  
  <!-- Outer Focus Ring & Target Graphic -->
  <circle cx="120" cy="115" r="52" fill="url(#goldGlow)"/>
  <circle cx="120" cy="115" r="44" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <circle cx="120" cy="115" r="50" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.15"/>
  
  <!-- Precision Alignment Crosshairs (Emphasizing "One Single Object") -->
  <line x1="120" y1="58" x2="120" y2="64" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="120" y1="166" x2="120" y2="172" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="63" y1="115" x2="69" y2="115" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="171" y1="115" x2="177" y2="115" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Ground Shadow for Central Pill -->
  <ellipse cx="120" cy="154" rx="22" ry="7" fill="url(#dropShadow)"/>

  <!-- The Spherical Pill (丸) -->
  <g transform="translate(120, 115)">
    <!-- Main Round Body -->
    <circle cx="0" cy="0" r="28" fill="url(#pillBody)"/>
    
    <!-- Curved Glossy Reflection (Enhancing 3D Sphere shape) -->
    <path d="M -18 -10 A 22 22 0 0 1 10 -22 A 26 26 0 0 0 -18 -10 Z" fill="url(#pillHighlight)"/>
    
    <!-- Secondary Rim Light -->
    <circle cx="0" cy="0" r="27.5" fill="none" stroke="#FEF08A" stroke-width="1" opacity="0.5"/>
    
    <!-- Tiny Specular Sparkle Spot -->
    <circle cx="-10" cy="-12" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-5" cy="-17" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Sparkle / Floating Micro-Details (Educational Accent) -->
  <path d="M 152 82 L 154 87 L 159 89 L 154 91 L 152 96 L 150 91 L 145 89 L 150 87 Z" fill="#FDE047" opacity="0.7"/>
  <path d="M 85 138 L 86.5 141 L 89.5 142.5 L 86.5 144 L 85 147 L 83.5 144 L 80.5 142.5 L 83.5 141 Z" fill="#FDE047" opacity="0.5"/>
  <circle cx="158" cy="132" r="1.5" fill="#F59E0B" opacity="0.6"/>
  <circle cx="82" cy="88" r="2" fill="#F59E0B" opacity="0.6"/>

</svg>