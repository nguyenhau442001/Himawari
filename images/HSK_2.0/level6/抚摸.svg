<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props -->
  <!-- Ambient Lamp Light Circle -->
  <circle cx="170" cy="70" r="90" fill="url(#lampGlow)"/>

  <!-- Bookshelf Background -->
  <g fill="#334155" opacity="0.6">
    <rect x="20" y="40" width="70" height="8" rx="2"/>
    <rect x="25" y="25" width="12" height="15"/>
    <rect x="40" y="20" width="10" height="20"/>
    <rect x="53" y="28" width="14" height="12"/>
    
    <!-- Plant on shelf -->
    <path d="M 75 40 Q 75 30 80 25 Q 85 30 85 40 Z" fill="#10b981"/>
    <circle cx="80" cy="35" r="8" fill="#047857"/>
  </g>

  <!-- Wall Picture Frame -->
  <rect x="150" y="35" width="40" height="30" rx="3" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 153 60 L 165 48 L 175 55 L 185 43 L 187 60 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- Cozy Window with Night View / Stars -->
  <rect x="100" y="30" width="35" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="110" cy="45" r="1.5" fill="#fef08a"/>
  <circle cx="125" cy="55" r="1.5" fill="#fef08a"/>
  <path d="M 100 52.5 L 135 52.5 M 117.5 30 L 117.5 75" stroke="#475569" stroke-width="1.5"/>

  <!-- Wooden Floor / Base Surface -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <rect x="0" y="190" width="240" height="6" fill="#334155"/>

  <!-- Comfortable Sofa/Chair -->
  <path d="M 30 195 L 30 130 C 30 115 45 110 65 110 L 140 110 C 160 110 175 115 175 130 L 175 195 Z" fill="#475569" filter="url(#softShadow)"/>
  <!-- Sofa cushion -->
  <path d="M 40 195 L 40 135 C 40 125 50 120 65 120 L 140 120 C 155 120 165 125 165 135 L 165 195 Z" fill="#64748b"/>

  <!-- Floor Cushion / Rug -->
  <ellipse cx="110" cy="195" rx="70" ry="15" fill="#1e293b"/>
  <ellipse cx="110" cy="195" rx="60" ry="11" fill="#334155"/>

  <!-- MAIN SUBJECT: The Little Cute Cat -->
  <g id="cat" filter="url(#softShadow)">
    <!-- Cat Body -->
    <ellipse cx="120" cy="180" rx="22" ry="16" fill="#f97316"/>
    <!-- Cat Tail -->
    <path d="M 100 185 C 85 190 80 175 85 165" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
    <!-- Cat Head -->
    <circle cx="138" cy="170" r="14" fill="#f97316"/>
    <!-- Cat Ears -->
    <polygon points="127,160 132,148 138,158" fill="#f97316"/>
    <polygon points="142,158 148,148 152,160" fill="#f97316"/>
    <polygon points="129,158 132,151 136,158" fill="#fbcfe8"/>
    <polygon points="144,158 148,151 150,158" fill="#fbcfe8"/>
    <!-- Cat Face Details -->
    <circle cx="134" cy="168" r="1.5" fill="#1e293b"/>
    <circle cx="143" cy="168" r="1.5" fill="#1e293b"/>
    <polygon points="138,171 140,171 139,172.5" fill="#fbcfe8"/>
    <!-- Happy closed eyes / whiskers -->
    <path d="M 131 166 Q 134 164 136 166" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
    <path d="M 141 166 Q 143 164 146 166" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
    <line x1="128" y1="172" x2="134" y2="173" stroke="#fed7aa" stroke-width="1" stroke-linecap="round"/>
    <line x1="128" y1="175" x2="134" y2="175" stroke="#fed7aa" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT: The Woman (Cô ấy) -->
  <g id="woman" filter="url(#softShadow)">
    <!-- Woman Torso & Clothing -->
    <path d="M 70 195 C 70 165 85 150 100 150 C 115 150 125 165 125 195 Z" fill="#ec4899"/>
    <!-- Cozy Sweater Collar -->
    <path d="M 85 152 C 90 158 110 158 115 152 C 115 152 107 148 100 148 C 93 148 85 152 85 152 Z" fill="#f472b6"/>

    <!-- Woman Neck -->
    <rect x="94" y="136" width="12" height="16" rx="4" fill="#fbcfe8"/>

    <!-- Woman Head -->
    <circle cx="100" cy="125" r="18" fill="#fbcfe8"/>

    <!-- Hair Back -->
    <path d="M 80 120 C 75 140 85 160 100 160 C 115 160 125 140 120 120 C 122 105 110 95 100 95 C 90 95 78 105 80 120 Z" fill="#334155"/>
    
    <!-- Hair Bangs -->
    <path d="M 83 120 C 85 110 95 112 102 110 C 110 112 115 115 117 122 C 110 118 90 118 83 120 Z" fill="#1e293b"/>

    <!-- Peaceful Gentle Face Expression -->
    <!-- Closed Happy Eye -->
    <path d="M 92 125 Q 95 122 98 125" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Gentle Smile -->
    <path d="M 94 132 Q 97 135 100 132" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Soft Blush -->
    <circle cx="91" cy="130" r="3" fill="#fb7185" opacity="0.5"/>

    <!-- Arm & Hand performing "抚摸" (Vuốt ve action) -->
    <!-- Upper Arm -->
    <path d="M 80 155 C 80 170 95 175 115 172" fill="none" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <!-- Forearm & Hand gently resting/stroking cat's head -->
    <path d="M 110 172 C 122 170 132 165 137 163" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    <!-- Gentle fingers touching cat -->
    <circle cx="138" cy="163" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Foreground / Atmospheric details (Heart/Sparkles denoting affection) -->
  <g fill="#f43f5e" opacity="0.8">
    <!-- Heart 1 -->
    <path d="M 135 145 C 135 142 138 140 140 142 C 142 140 145 142 145 145 C 145 148 140 152 140 152 C 140 152 135 148 135 145 Z" transform="scale(0.8) translate(40, 25)" />
    <!-- Sparkle / Soft Glow dots -->
    <circle cx="125" cy="148" r="1.5" fill="#fbbf24"/>
    <circle cx="150" cy="155" r="1" fill="#fbbf24"/>
  </g>
</svg>