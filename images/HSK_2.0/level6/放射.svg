<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Laboratory Environment / Backdrop -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b"/>
  <!-- Wall grid details -->
  <line x1="40" y1="0" x2="40" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="0" x2="120" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="200" y1="0" x2="200" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Laboratory Workbench -->
  <rect x="20" y="150" width="200" height="12" fill="#334155" rx="3"/>
  <rect x="35" y="162" width="170" height="50" fill="#0f172a" rx="2"/>
  
  <!-- Control Panel / Monitor -->
  <rect x="145" y="100" width="55" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="150" y="105" width="45" height="25" rx="2" fill="#090d16"/>
  <!-- Screen Waveform -->
  <path d="M 155 120 L 163 120 L 168 110 L 173 130 L 178 115 L 183 125 L 190 120" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sci-Fi Energy Emission Apparatus (Center) -->
  <path d="M 90 150 L 110 150 L 115 125 L 85 125 Z" fill="#64748b"/>
  <circle cx="100" cy="115" r="22" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  
  <!-- RADIATION / ENERGY EMISSION (放射) -->
  <!-- Radiating Energy Waves & Particles -->
  <circle cx="100" cy="115" r="34" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="100" cy="115" r="48" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.5"/>
  <path d="M 100 65 L 100 75" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 60 100 L 70 103" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 130 100 L 140 103" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 70 135 L 78 128" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 122 135 L 130 128" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Glowing Core -->
  <circle cx="100" cy="115" r="14" fill="#f59e0b"/>
  <circle cx="100" cy="115" r="8" fill="#fef08a"/>
  
  <!-- Scientist Character (Left side, observing with curiosity) -->
  <!-- Body/Lab Coat -->
  <path d="M 45 160 L 45 130 C 45 120, 65 120, 65 130 L 65 160 Z" fill="#e2e8f0"/>
  <path d="M 55 125 L 50 160 L 60 160 Z" fill="#cbd5e1"/>
  <!-- Head & Hair -->
  <circle cx="55" cy="105" r="11" fill="#fbcfe8"/>
  <path d="M 44 103 C 44 92, 66 92, 66 103 C 66 100, 60 95, 55 95 C 50 95, 44 100, 44 103 Z" fill="#334155"/>
  <!-- Safety Goggles -->
  <rect x="49" y="100" width="13" height="6" rx="2" fill="#0284c7" opacity="0.8"/>
  <path d="M 46 102 L 49 102" stroke="#334155" stroke-width="1.5"/>
  <path d="M 62 102 L 65 102" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Scientist's Arm pointing at energy core -->
  <path d="M 60 135 C 70 130, 80 125, 85 120" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="86" cy="119" r="3" fill="#fbcfe8"/>

  <!-- Additional Lab Props -->
  <!-- Flask on the right -->
  <path d="M 185 145 L 195 145 L 193 130 L 197 122 L 183 122 L 187 130 Z" fill="#cbd5e1" opacity="0.8"/>
  <path d="M 184 135 L 196 135 L 195 143 L 185 143 Z" fill="#10b981" opacity="0.7"/>
