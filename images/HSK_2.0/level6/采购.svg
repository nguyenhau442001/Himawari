<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Warehouse/Industrial Background -->
  <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#334155"/>
  <rect x="40" y="100" width="40" height="80" fill="#475569"/>
  <rect x="100" y="120" width="40" height="60" fill="#475569"/>
  <rect x="160" y="110" width="40" height="70" fill="#475569"/>
  
  <!-- Raw Material Crates -->
  <rect x="45" y="150" width="30" height="30" fill="#fbbf24"/>
  <rect x="45" y="150" width="30" height="30" stroke="#0f172a" stroke-width="2" fill="none"/>
  <path d="M45 155 L75 155 M45 165 L75 165 M55 150 L55 180 M65 150 L65 180" stroke="#0f172a" stroke-width="1"/>
  
  <!-- Character: The Buyer -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-15 40 L15 40 L10 80 L-10 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="25" r="15" fill="#fde68a"/>
    <!-- Suit/Tie -->
    <path d="M-5 40 L0 55 L5 40 Z" fill="#ec4899"/>
    <!-- Arm reaching for clipboard -->
    <path d="M15 45 L35 60" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Clipboard -->
    <rect x="35" y="50" width="20" height="25" rx="2" fill="#e2e8f0"/>
    <path d="M38 55 L52 55 M38 60 L52 60 M38 65 L48 65" stroke="#475569" stroke-width="1"/>
  </g>
  
  <!-- Character: The Supplier -->
  <g transform="translate(60, 120)">
    <!-- Body -->
    <path d="M-15 40 L15 40 L10 80 L-10 80 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="0" cy="25" r="15" fill="#fde68a"/>
    <!-- Handshake gesture -->
    <path d="M15 45 L30 45" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Accents -->
  <circle cx="200" cy="40" r="3" fill="#fb923c"/>
  <circle cx="180" cy="30" r="2" fill="#f59e0b"/>
  <path d="M190 50 L195 45" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
</svg>