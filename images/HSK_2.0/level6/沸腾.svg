<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Kitchen Glow Gradient -->
    <radialGradient id="kitchen-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Stainless Steel Pot Gradient -->
    <linearGradient id="pot-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Boiling Water Gradient -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Kitchen Environment & Back Wall -->
  <rect x="0" y="0" width="240" height="150" fill="#1e293b" />
  <rect x="0" y="146" width="240" height="4" fill="#334155" />
  
  <!-- Kitchen Window with Night Scene -->
  <rect x="150" y="20" width="70" height="90" rx="6" fill="#090d16" stroke="#334155" stroke-width="3" />
  <!-- Window Grid -->
  <line x1="185" y1="20" x2="185" y2="110" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="65" x2="220" y2="65" stroke="#334155" stroke-width="2" />
  <!-- Moon outside -->
  <circle cx="170" cy="40" r="10" fill="#fef08a" opacity="0.8" />
  
  <!-- Hanging Kitchen Utensil Rack -->
  <line x1="20" y1="30" x2="120" y2="30" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M 40 30 L 40 45" stroke="#64748b" stroke-width="2" />
  <circle cx="40" cy="48" r="4" fill="none" stroke="#64748b" stroke-width="2" />
  <path d="M 80 30 L 80 50" stroke="#64748b" stroke-width="2" />
  <path d="M 75 50 Q 80 60 85 50 Z" fill="#64748b" />

  <!-- Kitchen Counter -->
  <rect x="0" y="150" width="240" height="90" fill="#334155" />
  <rect x="0" y="150" width="240" height="10" fill="#475569" />
  <!-- Counter Wood/Tile Texture Line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#1e293b" stroke-width="2" opacity="0.4" />

  <!-- Ambient Glow from Stove -->
  <circle cx="100" cy="150" r="70" fill="url(#kitchen-glow)" />

  <!-- Stove Top Base -->
  <ellipse cx="100" cy="150" rx="45" ry="15" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Heating Element Ring (Active/Glowing Orange) -->
  <ellipse cx="100" cy="150" rx="32" ry="10" fill="none" stroke="#f97316" stroke-width="4" filter="url(#drop-shadow)" />

  <!-- Stainless Steel Pot (Main Subject Container) -->
  <g filter="url(#drop-shadow)">
    <!-- Pot Body -->
    <path d="M 68 105 L 75 145 C 75 152, 125 152, 125 145 L 132 105 Z" fill="url(#pot-grad)" />
    <!-- Pot Rim -->
    <ellipse cx="100" cy="105" rx="32" ry="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Pot Handle Left -->
    <path d="M 68 115 C 50 115, 50 130, 68 130" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
    <!-- Pot Handle Right -->
    <path d="M 132 115 C 150 115, 150 130, 132 130" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Boiling Water Inside Pot (Visible surface) -->
  <ellipse cx="100" cy="107" rx="29" ry="5" fill="url(#water-grad)" />

  <!-- Boiling Activity: Bubbles and Vigorous Action (Fèiténg Effect) -->
  <g>
    <!-- Small Bubbles under surface -->
    <circle cx="90" cy="106" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="105" cy="108" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="112" cy="106" r="2.5" fill="#ffffff" opacity="0.85" />
    <circle cx="98" cy="105" r="3.5" fill="#ffffff" opacity="0.9" />

    <!-- Rising Steam Plumes (Curved, dynamic vector lines) -->
    <path d="M 90 100 Q 82 80 95 65 T 90 40" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 100 100 Q 112 75 98 60 T 108 35" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <path d="M 110 100 Q 100 80 112 65 T 105 30" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- Flying Water Droplets / Splashes (Indicating boiling intensity) -->
    <circle cx="95" cy="98" r="1.5" fill="#38bdf8" />
    <circle cx="105" cy="95" r="2" fill="#38bdf8" />
    <circle cx="100" cy="90" r="1" fill="#38bdf8" />
  </g>

  <!-- Expressive Character (Home Cook / Observer) -->
  <g transform="translate(15, 75)" filter="url(#drop-shadow)">
    <!-- Character Body / Apron -->
    <!-- Torso & Shirt -->
    <path d="M 25 90 C 25 70, 55 70, 55 90 L 65 140 L 15 140 Z" fill="#38bdf8" />
    <!-- Apron -->
    <path d="M 30 85 L 50 85 L 55 140 L 25 140 Z" fill="#f8fafc" />
    <path d="M 37 85 L 37 120 L 43 120 L 43 85 Z" fill="#cbd5e1" opacity="0.5" /> <!-- Apron pocket/strap line -->

    <!-- Character Neck -->
    <rect x="35" y="60" width="10" height="15" fill="url(#skin-grad)" />

    <!-- Character Head -->
    <circle cx="40" cy="45" r="22" fill="url(#skin-grad)" />

    <!-- Hair (Stylized dark brown/black) -->
    <path d="M 18 45 C 18 20, 62 20, 62 45 C 62 48, 58 45, 55 40 C 50 28, 30 28, 25 40 C 22 45, 18 48, 18 45 Z" fill="#1e293b" />

    <!-- Expressive Face (Surprised/Excited realization: "Ah, it's boiling!") -->
    <!-- Eyebrows (Arched high in surprise) -->
    <path d="M 30 36 Q 35 32 40 36" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 45 36 Q 50 32 55 36" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes (Wide open dots) -->
    <circle cx="36" cy="43" r="2.5" fill="#1e293b" />
    <circle cx="50" cy="43" r="2.5" fill="#1e293b" />

    <!-- Open 'O' Mouth (Reacting to the boiling pot) -->
    <circle cx="43" cy="53" r="4" fill="#1e293b" />

    <!-- Left Arm & Hand (Reaching out, pointing gesture towards the pot) -->
    <path d="M 25 90 C 10 95, 5 105, 0 100" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="100" r="4" fill="url(#skin-grad)" />

    <!-- Right Arm (Bent near body) -->
    <path d="M 55 90 C 65 95, 65 110, 55 115" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Context Prop on Counter: Spoon resting in a small dish -->
  <ellipse cx="195" cy="190" rx="12" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M 180 185 Q 195 175 210 190" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
</svg>