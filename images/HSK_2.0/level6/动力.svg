<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Environment Gradients & Backdrop -->
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wall & Room Interior -->
  <rect x="0" y="0" width="240" height="170" fill="url(#wallGrad)"/>
  
  <!-- Window view (Night/Evening City) -->
  <g opacity="0.4">
    <rect x="175" y="25" width="45" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="182" y="32" width="14" height="25" fill="#38bdf8" opacity="0.4"/>
    <rect x="201" y="32" width="14" height="25" fill="#38bdf8" opacity="0.2"/>
    <rect x="182" y="62" width="14" height="25" fill="#38bdf8" opacity="0.6"/>
    <rect x="201" y="62" width="14" height="25" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- Wall Shelf with Plant -->
  <rect x="20" y="45" width="50" height="4" rx="2" fill="#475569"/>
  <path d="M35 45 C35 35 45 35 45 45" fill="#10b981"/>
  <circle cx="40" cy="38" r="8" fill="#10b981"/>
  <circle cx="32" cy="42" r="6" fill="#059669"/>
  <circle cx="48" cy="41" r="7" fill="#34d399"/>
  <path d="M37 45 L43 45 L41 52 L39 52 Z" fill="#94a3b8"/>

  <!-- Office Desk -->
  <rect x="10" y="165" width="220" height="10" fill="url(#deskGrad)" rx="2"/>
  <rect x="25" y="175" width="12" height="55" fill="#1e293b"/>
  <rect x="203" y="175" width="12" height="55" fill="#1e293b"/>

  <!-- Computer Monitor & Workspace props -->
  <g transform="translate(130, 95)">
    <!-- Stand -->
    <rect x="25" y="55" width="20" height="15" fill="#64748b"/>
    <rect x="10" y="68" width="50" height="4" rx="2" fill="#475569"/>
    <!-- Screen -->
    <rect x="-10" y="0" width="90" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="-6" y="4" width="82" height="50" rx="4" fill="url(#screenGrad)"/>
    <!-- Chart lines on screen -->
    <path d="M5 40 L20 25 L35 32 L55 15 L70 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="110" y="145" width="14" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M124 149 C129 149 129 159 124 159" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Main Character (Office Worker feeling energized/motivated) -->
  <g transform="translate(45, 95)">
    <!-- Chair Back -->
    <path d="M -15 70 L -15 15 C -15 5, -5 0, 15 0 C 35 0, 45 5, 45 15 L 45 70 Z" fill="#334155" rx="5"/>
    
    <!-- Body / Torso -->
    <path d="M 0 45 C 0 30, 20 25, 35 30 L 45 75 L -5 75 Z" fill="#38bdf8"/>
    <path d="M 12 33 L 33 39 L 28 55 L 7 49 Z" fill="#ffffff"/> <!-- Shirt collar/tie accent -->
    
    <!-- Head & Face -->
    <circle cx="22" cy="12" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 7 12 C 7 -2, 20 -4, 34 2 C 37 8, 35 15, 35 15 C 35 15, 25 5, 15 8 C 10 9, 7 12, 7 12 Z" fill="#334155"/>
    <!-- Happy/Determined Expression -->
    <circle cx="27" cy="11" r="2" fill="#1e293b"/>
    <path d="M 24 17 Q 28 21 32 17" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Raised Arm / Dynamic Pose -->
    <path d="M 30 35 Q 50 20 40 5" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="40" cy="5" r="5" fill="#fbcfe8"/>
  </g>

  <!-- The "Motivation / Salary" visual metaphor (Glowing Coin / Bonus envelope rising from desk) -->
  <g transform="translate(100, 110)">
    <!-- Glowing Aura / Energy Beam -->
    <circle cx="20" cy="20" r="32" fill="url(#goldGlow)" opacity="0.25" filter="url(#glow)"/>
    
    <!-- Red Envelope / Bonus Packet (Common cultural representation of work reward/salary in Asia) -->
    <g transform="translate(5, 5)">
      <rect x="0" y="5" width="30" height="42" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
      <!-- Gold Ribbon / Accent -->
      <rect x="0" y="20" width="30" height="8" fill="#fbbf24"/>
      <circle cx="15" cy="24" r="5" fill="#f59e0b"/>
    </g>
    
    <!-- Floating Gold Coins (Dynamic energy burst upward) -->
    <g transform="translate(35, -15)">
      <circle cx="0" cy="0" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
      <text x="-3" y="4" font-size="10" fill="#b45309" font-weight="bold">$</text>
    </g>
    <g transform="translate(-10, -25)">
      <circle cx="0" cy="0" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    </g>
    <g transform="translate(25, -35)">
      <circle cx="0" cy="0" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Flowing Energy / Drive Lines (Depicting '动力' - force/pull/momentum) -->
  <g opacity="0.7">
    <path d="M 75 140 Q 95 120 110 115" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M 80 150 Q 105 130 125 125" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 3"/>
  </g>

  <!-- Ambient lighting highlights -->
  <circle cx="120" cy="95" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="145" cy="85" r="1.5" fill="#ffffff" opacity="0.4"/>
</svg>