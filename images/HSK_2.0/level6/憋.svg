<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="80" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- Character -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-40 80 Q-40 20 0 20 Q40 20 40 80 Z" fill="#38bdf8"/>
    <!-- Face -->
    <circle cx="0" cy="0" r="35" fill="#fde68a"/>
    <!-- Angry Expression -->
    <path d="M-15 -10 L-5 -5 M5 -5 L15 -10" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 15 Q0 25 10 15" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Red flush of anger -->
    <circle cx="-20" cy="5" r="5" fill="#ec4899" opacity="0.6"/>
    <circle cx="20" cy="5" r="5" fill="#ec4899" opacity="0.6"/>
  </g>
  
  <!-- The "Belly" pressure visualization -->
  <circle cx="120" cy="150" r="25" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="4 4"/>
  <path d="M110 140 L130 160 M130 140 L110 160" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Office Props -->
  <rect x="160" y="110" width="30" height="30" rx="4" fill="#64748b"/>
  <rect x="165" y="115" width="20" height="5" rx="1" fill="#f8fafc"/>
  <rect x="165" y="125" width="20" height="5" rx="1" fill="#f8fafc"/>
  
  <circle cx="60" cy="120" r="15" fill="#94a3b8"/>
  <rect x="55" y="100" width="10" height="20" rx="2" fill="#475569"/>
</svg>