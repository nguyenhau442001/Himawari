<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Speed/Decisive action motion trails (representing "dứt khoát") -->
    <path d="M-85 -30 L-50 -30" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-95 0 L-60 0" stroke="#FF9F43" stroke-width="5" stroke-linecap="round"/>
    <path d="M-80 30 L-45 30" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Clean, sharp slash/check graphic symbolizing crispness, efficiency, and clarity (sảng khoái, dứt khoát) -->
    <!-- Circular background badge -->
    <circle cx="10" cy="0" r="64" fill="#252A34" stroke="#2F3644" stroke-width="3"/>
    
    <!-- Refreshing/Cool breeze element (sảng khoái) - minimalist wind swirl -->
    <path d="M-15 -25 C 10 -35, 35 -15, 20 5 C 10 18, -10 12, -5 25 C 0 35, 25 35, 35 25" fill="none" stroke="#00D2D3" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Decisive checkmark/blade (dứt khoát) -->
    <path d="M-12 2 L 0 16 L 36 -22" fill="none" stroke="#FF9F43" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>