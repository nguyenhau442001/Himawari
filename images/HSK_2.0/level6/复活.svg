<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="lanternGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="woodBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Workshop Interior Details -->
  <!-- Walls & Windows -->
  <path d="M 40,200 L 40,70 L 120,45 L 200,70 L 200,200 Z" fill="#1e293b" />
  <!-- Traditional Chinese Window Lattice Frame in Background -->
  <g stroke="#334155" stroke-width="2" fill="none" opacity="0.4">
    <rect x="95" y="70" width="50" height="70" rx="4" />
    <line x1="95" y1="95" x2="145" y2="95" />
    <line x1="95" y1="120" x2="145" y2="120" />
    <line x1="120" y1="70" x2="120" y2="140" />
  </g>

  <!-- Wooden Workbench -->
  <rect x="30" y="165" width="180" height="12" fill="url(#woodBeam)" rx="2" />
  <rect x="45" y="177" width="12" height="40" fill="#78350f" />
  <rect x="183" y="177" width="12" height="40" fill="#78350f" />
  <rect x="30" y="165" width="180" height="4" fill="#b45309" rx="1" />

  <!-- Environment & Props: Tools and reviving traditional puppet/artifact -->
  <!-- Stool -->
  <ellipse cx="190" cy="180" rx="14" ry="5" fill="#475569" />
  <rect x="185" y="180" width="4" height="25" fill="#334155" />
  <rect x="191" y="180" width="4" height="25" fill="#334155" />

  <!-- Crafting Tools on Desk -->
  <!-- Paint brush in jar -->
  <rect x="52" y="145" width="8" height="20" rx="2" fill="#38bdf8" />
  <path d="M 50,145 Q 56,130 52,120" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <circle cx="56" cy="150" r="6" fill="#475569" />
  
  <!-- Wood carving blocks / shavings -->
  <path d="M 155,162 Q 162,158 170,165" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 148,164 Q 152,160 157,165" stroke="#fb923c" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Magic Revival Aura / Energy swirling around the artifact -->
  <circle cx="120" cy="125" r="45" fill="url(#magicGlow)" />
  
  <!-- Floating Magical Sparkles / Energy Particles -->
  <circle cx="95" cy="100" r="3" fill="#fef08a" />
  <circle cx="145" cy="105" r="2" fill="#38bdf8" />
  <circle cx="100" cy="140" r="2.5" fill="#38bdf8" />
  <circle cx="140" cy="135" r="3.5" fill="#fef08a" />
  <circle cx="120" cy="85" r="2" fill="#ec4899" />
  <path d="M 115,100 Q 120,90 125,100 Q 120,110 115,100 Z" fill="#38bdf8" opacity="0.7" />
  <path d="M 130,120 Q 135,112 140,120 Q 135,128 130,120 Z" fill="#fef08a" opacity="0.8" />

  <!-- The Artifact / Traditional Object being "Revived" (A gorgeous traditional puppet/mask glowing with life) -->
  <g transform="translate(120, 120)">
    <!-- Puppet body / base structure -->
    <path d="M -10,25 L 10,25 L 6,45 L -6,45 Z" fill="#b45309" />
    <!-- Glowing decorative collar -->
    <path d="M -14,25 Q 0,33 14,25 L 10,20 Q 0,27 -10,20 Z" fill="#ef4444" />
    <!-- Puppet head (Traditional Opera Mask motif) -->
    <circle cx="0" cy="8" r="14" fill="#fbbf24" />
    <!-- Mask facial details -->
    <path d="M -8,5 Q 0,0 8,5 L 6,12 Q 0,15 -6,12 Z" fill="#ef4444" />
    <circle cx="-5" cy="7" r="2" fill="#1e293b" />
    <circle cx="5" cy="7" r="2" fill="#1e293b" />
    <!-- Crown / Headdress ornament -->
    <path d="M -8,-2 L 0,-12 L 8,-2 Z" fill="#10b981" />
    <circle cx="0" cy="-12" r="2.5" fill="#fef08a" />
  </g>

  <!-- Young Artisan Character (Crafting/Reviving the tradition) -->
  <g transform="translate(85, 115)">
    <!-- Body & Apron -->
    <path d="M -22,45 L -16,80 L 16,80 L 22,45 Z" fill="#334155" />
    <!-- Apron -->
    <path d="M -16,42 L 16,42 L 14,80 L -14,80 Z" fill="#cbd5e1" />
    <circle cx="0" cy="55" r="4" fill="#64748b" />

    <!-- Head & Hair -->
    <circle cx="0" cy="18" r="16" fill="#fbcfe8" />
    <!-- Hair style (Modern neat artisan bun/hair) -->
    <path d="M -16,16 C -16,4 -10,-2 0,-2 C 10,-2 16,4 16,16 C 16,12 12,2 0,2 C -12,2 -16,12 -16,16 Z" fill="#0f172a" />
    <circle cx="0" cy="-6" r="6" fill="#0f172a" />

    <!-- Face Profile / Expression (Focused, inspired, smiling) -->
    <path d="M 4,16 Q 7,18 10,16" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <circle cx="8" cy="14" r="1.5" fill="#0f172a" />
    <path d="M 12,20 Q 14,22 11,23" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round" /> <!-- Happy subtle smile -->

    <!-- Arms & Hands actively working/gesturing toward the floating artifact -->
    <!-- Left arm (supporting/holding steady) -->
    <path d="M -18,40 Q -30,50 -22,60" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="-22" cy="60" r="4" fill="#fbcfe8" />

    <!-- Right arm (gesturing upward in wonder/creation) -->
    <path d="M 18,40 Q 32,35 28,20" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="28" cy="18" r="4" fill="#fbcfe8" />
  </g>

  <!-- Foreground Ambient Glow & Warm Lantern hanging from top -->
  <g transform="translate(180, 0)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#475569" stroke-width="2" />
    <path d="M -12,40 L 12,40 L 16,60 L -16,60 Z" fill="url(#lanternGlow)" />
    <path d="M -16,60 Q 0,68 16,60 L 12,65 Q 0,70 -12,65 Z" fill="#b45309" />
    <circle cx="0" cy="50" r="6" fill="#fef08a" />
    <!-- Lantern soft light emission -->
    <circle cx="0" cy="55" r="30" fill="#f59e0b" opacity="0.15" />
  </g>

  <!-- Left Side Hanging Traditional Scroll / Art Piece (Context of heritage) -->
  <g transform="translate(35, 30)">
    <rect x="-8" y="0" width="16" height="55" rx="2" fill="#f1f5f9" />
    <rect x="-10" y="-4" width="20" height="6" rx="2" fill="#78350f" />
    <rect x="-10" y="53" width="20" height="6" rx="2" fill="#78350f" />
    <!-- Abstract Chinese art motif on scroll (simple decorative strokes) -->
    <path d="M 0,12 Q 4,20 0,28 Q -4,36 0,44" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="0" cy="20" r="2" fill="#f59e0b" />
  </g>

  <!-- Subtle floor shadow and lighting vignettes -->
  <ellipse cx="120" cy="215" rx="90" ry="8" fill="#0f172a" opacity="0.6" />
</svg>