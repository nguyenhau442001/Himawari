<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character representing the person -->
  <g transform="translate(120, 130)">
    <circle cx="0" cy="-40" r="25" fill="#E0E0E0"/>
    <path d="M-10 -45 L-5 -40 M5 -45 L10 -40" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 -30 Q0 -22 8 -30" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-25 0 L-15 40 L15 40 L25 0 Z" fill="#7D8590"/>
  </g>

  <!-- The "Dilemma" - Two contrasting paths/choices -->
  <g stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Path (Orange) -->
    <path d="M100 130 L60 80 L60 50" stroke="#FFB86C" fill="none"/>
    <circle cx="60" cy="50" r="8" fill="#FFB86C"/>
    
    <!-- Right Path (Blue/Grey) -->
    <path d="M140 130 L180 80 L180 50" stroke="#6272A4" fill="none"/>
    <circle cx="180" cy="50" r="8" fill="#6272A4"/>
  </g>

  <!-- Question mark symbol representing the mental state -->
  <path d="M120 60 Q135 60 135 75 Q135 90 120 95 M120 110 L120 112" stroke="#FFB86C" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>