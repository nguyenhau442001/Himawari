<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="80" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- Person 1 (The Criticizer) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M5 25 Q20 35 35 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <path d="M10 50 L30 50 L25 120 L15 120 Z" fill="#38bdf8"/>
    <path d="M30 60 L50 80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 60 L-10 90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (The Victim) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="20" fill="#94a3b8"/>
    <path d="M10 35 Q20 30 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <path d="M10 50 L30 50 L25 120 L15 120 Z" fill="#ec4899"/>
    <path d="M10 60 L-5 80" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 60 L45 80" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Speech Bubble / Gesture -->
  <path d="M130 70 L100 50 L100 30 L160 30 L160 50 L140 50 Z" fill="#f59e0b" opacity="0.8"/>
  <circle cx="110" cy="40" r="3" fill="#0f172a"/>
  <circle cx="130" cy="40" r="3" fill="#0f172a"/>
  <circle cx="150" cy="40" r="3" fill="#0f172a"/>
  
  <!-- Environment Props -->
  <rect x="170" y="50" width="30" height="40" rx="2" fill="#475569"/>
  <rect x="175" y="55" width="20" height="5" fill="#334155"/>
  <rect x="175" y="65" width="20" height="5" fill="#334155"/>
  <rect x="175" y="75" width="10" height="5" fill="#334155"/>
  
  <circle cx="50" cy="180" r="15" fill="#10b981" opacity="0.3"/>
