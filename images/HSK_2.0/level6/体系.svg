<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Subtle Grid/Glow for Modern Tech Aesthetic -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="40" y1="120" x2="200" y2="120" />
    <line x1="120" y1="40" x2="120" y2="200" />
    <circle cx="120" cy="120" r="70" fill="none" />
  </g>

  <!-- Central "System" Structure (体系) - Interconnected 3D-feeling Flat Isometric Nodes -->
  <!-- Connecting Lines -->
  <g stroke="#3A4256" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center to Top -->
    <line x1="120" y1="120" x2="120" y2="75" />
    <!-- Center to Bottom Left -->
    <line x1="120" y1="120" x2="80" y2="155" />
    <!-- Center to Bottom Right -->
    <line x1="120" y1="120" x2="160" y2="155" />
    <!-- Outer secondary links -->
    <line x1="80" y1="155" x2="55" y2="125" />
    <line x1="160" y1="155" x2="185" y2="125" />
    <line x1="120" y1="75" x2="150" y2="90" />
    <line x1="120" y1="75" x2="90" y2="90" />
  </g>

  <!-- Node Elements (Representing a structured management/operational system) -->
  
  <!-- Outer Secondary Node Left -->
  <circle cx="55" cy="125" r="10" fill="#262C3A" stroke="#4F5D75" stroke-width="2"/>
  <circle cx="55" cy="125" r="3" fill="#64748B"/>

  <!-- Outer Secondary Node Right -->
  <circle cx="185" cy="125" r="10" fill="#262C3A" stroke="#4F5D75" stroke-width="2"/>
  <circle cx="185" cy="125" r="3" fill="#64748B"/>

  <!-- Sub Node Top-Left -->
  <circle cx="90" cy="90" r="12" fill="#262C3A" stroke="#64748B" stroke-width="2"/>
  <path d="M86 90 L89 93 L95 87" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sub Node Top-Right -->
  <circle cx="150" cy="90" r="12" fill="#262C3A" stroke="#64748B" stroke-width="2"/>
  <rect x="146" y="86" width="8" height="8" rx="1.5" fill="#38BDF8"/>

  <!-- Bottom Left Node (Process/Task) -->
  <circle cx="80" cy="155" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <path d="M74 155 L78 159 L87 150" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Right Node (Structure/Standard) -->
  <circle cx="160" cy="155" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <rect x="154" y="149" width="12" height="12" rx="2" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <!-- Top Node (Hierarchy Peak / Management) -->
  <circle cx="120" cy="75" r="18" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Crown/Core icon inside top node -->
  <path d="M112 78 L120 68 L128 78 Z" fill="#F59E0B"/>
  <circle cx="120" cy="73" r="2" fill="#1A1D24"/>

  <!-- Center Core Node (The Heart of the System - Company/Management Core) -->
  <circle cx="120" cy="120" r="26" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="120" cy="120" r="20" fill="#262C3A"/>
  
  <!-- Gear/Framework Symbol inside Core -->
  <path d="M120 108 
           L122.5 111.5 
           L126.5 110.5 
           L128 114 
           L124.5 116.5 
           L126 120.5 
           L130 121 
           L129 125 
           L125 125 
           L124 129 
           L120 127 
           L116 129 
           L115 125 
           L111 125 
           L110 121 
           L114 120.5 
           L115.5 116.5 
           L112 114 
           L113.5 110.5 
           L117.5 111.5 Z" 
        fill="#F59E0B" opacity="0.9"/>
  <circle cx="120" cy="120" r="5" fill="#1E293B"/>

  <!-- Orbiting/Connection Particles (Accentuation) -->
  <circle cx="120" cy="42" r="3" fill="#F59E0B" />
  <circle cx="50" cy="170" r="2" fill="#38BDF8" />
  <circle cx="190" cy="170" r="2.5" fill="#38BDF8" />

</svg>