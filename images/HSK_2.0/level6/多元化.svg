<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office Interior Background Elements -->
  <!-- Large Window showing Cityscape & Growth -->
  <g opacity="0.6">
    <rect x="140" y="25" width="80" height="110" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- City buildings outside -->
    <rect x="148" y="60" width="14" height="75" fill="#334155"/>
    <rect x="166" y="45" width="18" height="90" fill="#1e293b"/>
    <rect x="188" y="70" width="22" height="65" fill="#334155"/>
    <!-- Window pane grid -->
    <line x1="180" y1="25" x2="180" y2="135" stroke="#475569" stroke-width="1"/>
    <line x1="140" y1="80" x2="220" y2="80" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Wall Shelf with diversified product prototypes / icons -->
  <g transform="translate(20, 25)">
    <rect x="0" y="35" width="70" height="4" rx="2" fill="#475569"/>
    <!-- Globe/Global icon prop -->
    <circle cx="15" cy="22" r="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M7 22h16M15 12c3 3 3 17 0 20M15 12c-3 3-3 17 0 20" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Tech device prop -->
    <rect x="35" y="10" width="12" height="25" rx="2" fill="#10b981"/>
    <circle cx="41" cy="31" r="1" fill="#fff"/>
    <!-- Box/Physical product prop -->
    <polygon points="55,35 68,30 68,20 55,25" fill="#fbbf24"/>
    <polygon points="55,25 42,20 42,30 55,35" fill="#f59e0b"/>
    <polygon points="42,20 55,15 68,20 55,25" fill="#fb923c"/>
  </g>

  <!-- Main Desk Surface -->
  <path d="M10 185 L230 185 L220 215 L20 215 Z" fill="url(#tableGrad)"/>
  <rect x="15" y="180" width="210" height="6" rx="3" fill="#64748b"/>

  <!-- Character: Business Woman planning diversification -->
  <!-- Chair Back -->
  <path d="M65 110 C65 95 85 95 85 110 L85 180 L65 180 Z" fill="#334155"/>
  <ellipse cx="75" cy="105" rx="10" ry="4" fill="#475569"/>

  <!-- Character Body & Arms -->
  <!-- Torso (Blazer) -->
  <path d="M55 135 C55 120 70 120 75 140 C80 160 85 175 85 185 L45 185 C45 170 50 150 55 135 Z" fill="#0284c7"/>
  <path d="M62 135 L75 160 L88 135 Z" fill="#f8fafc"/> <!-- Shirt V-neck -->

  <!-- Head & Hair -->
  <circle cx="70" cy="112" r="14" fill="#fbcfe8"/> <!-- Face -->
  <!-- Stylish hair -->
  <path d="M56 110 C54 95 86 92 84 112 C83 120 80 130 75 130 C70 130 60 125 56 110 Z" fill="#334155"/>
  <path d="M82 108 C86 115 84 125 80 130 C85 120 85 110 82 108 Z" fill="#1e293b"/>

  <!-- Arm pointing / interacting with holographic chart -->
  <path d="M75 145 L110 135 L115 145 L85 160 Z" fill="#0284c7"/>
  <circle cx="113" cy="140" r="4" fill="#fbcfe8"/> <!-- Hand -->


  <!-- Centerpiece: Holographic/Floating Multi-Branch Growth Chart (Visualizing Diversification) -->
  <g transform="translate(110, 80)">
    <!-- Central Hub node -->
    <circle cx="35" cy="60" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="35" cy="60" r="6" fill="#38bdf8"/>

    <!-- Branch 1: Digital/Tech (Top) -->
    <path d="M35 46 C35 25 15 20 5 15" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,3"/>
    <circle cx="5" cy="15" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Icon inside node: Cloud/Digital -->
    <path d="M2 17 C1 17 1 13 4 13 C5 11 8 11 9 13 C11 13 11 17 9 17 Z" fill="#f8fafc"/>

    <!-- Branch 2: Physical Products / Retail (Right Top) -->
    <path d="M47 50 C65 35 75 25 85 20" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="85" cy="20" r="10" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Icon inside node: Box -->
    <polygon points="85,15 91,18 91,24 85,26 79,24 79,18" fill="#fef08a"/>
    <polyline points="79,18 85,21 91,18" fill="none" stroke="#d97706" stroke-width="1"/>

    <!-- Branch 3: Global Markets / Expansion (Right Mid) -->
    <path d="M49 65 C70 65 85 70 95 75" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="95" cy="75" r="10" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
    <!-- Icon inside node: Globe rings -->
    <circle cx="95" cy="75" r="6" fill="none" stroke="#a7f3d0" stroke-width="1.5"/>
    <ellipse cx="95" cy="75" rx="2" ry="6" fill="none" stroke="#a7f3d0" stroke-width="1"/>

    <!-- Branch 4: Services / Consulting (Bottom Right) -->
    <path d="M45 72 C65 90 75 105 80 115" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="3,3"/>
    <circle cx="80" cy="115" r="10" fill="#be185d" stroke="#ec4899" stroke-width="1.5"/>
    <!-- Icon inside node: Star/Quality -->
    <path d="M80 109 L82 113 L86 113 L83 115 L84 119 L80 117 L76 119 L77 115 L74 113 L78 113 Z" fill="#fbcfe8"/>

    <!-- Connecting glowing particles/nodes -->
    <circle cx="20" cy="30" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="65" cy="30" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="70" cy="70" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="60" cy="95" r="3" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Desk Props -->
  <!-- Laptop showing multi-column graphs -->
  <g transform="translate(115, 155)">
    <!-- Laptop Base -->
    <polygon points="-15,25 35,25 45,33 -25,33" fill="#64748b"/>
    <rect x="-26" y="32" width="73" height="3" rx="1.5" fill="#475569"/>
    <!-- Laptop Screen -->
    <polygon points="-15,25 35,25 30,-15 -10,-15" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Screen Dashboard Bars (Diversified metrics) -->
    <rect x="-5" y="-5" width="6" height="20" rx="1" fill="#38bdf8"/>
    <rect x="4" y="-10" width="6" height="25" rx="1" fill="#fbbf24"/>
    <rect x="13" y="-2" width="6" height="17" rx="1" fill="#10b981"/>
    <rect x="22" y="-7" width="6" height="22" rx="1" fill="#ec4899"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(45, 170)">
    <rect x="0" y="0" width="12" height="15" rx="2" fill="#f8fafc"/>
    <path d="M12 3 C16 3 16 10 12 11" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Steam -->
    <path d="M3 -3 C3 -6 5 -6 5 -9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M8 -2 C8 -5 10 -5 10 -8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Document / Business Plan on Desk -->
  <g transform="translate(85, 175) rotate(-10)">
    <rect x="0" y="0" width="22" height="28" rx="1" fill="#f8fafc"/>
    <line x1="4" y1="5" x2="14" y2="5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="10" x2="18" y2="10" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="4" y1="14" x2="15" y2="14" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="6" cy="21" r="3" fill="#38bdf8"/>
    <circle cx="15" cy="21" r="3" fill="#fbbf24"/>
  </g>

</svg>