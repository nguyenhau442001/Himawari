<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg_grad)" />

  <!-- Window/Environment -->
  <rect x="30" y="40" width="60" height="80" rx="4" fill="#1e293b" />
  <rect x="35" y="45" width="22" height="32" rx="2" fill="#0f172a" />
  <rect x="63" y="45" width="22" height="32" rx="2" fill="#0f172a" />
  <rect x="35" y="82" width="22" height="32" rx="2" fill="#0f172a" />
  <rect x="63" y="82" width="22" height="32" rx="2" fill="#0f172a" />
  <circle cx="75" cy="60" r="3" fill="#f59e0b" opacity="0.6" />

  <!-- Desk -->
  <path d="M10 200 L230 200 L240 240 L0 240 Z" fill="#334155" />
  <rect x="0" y="200" width="240" height="4" fill="#475569" />

  <!-- Character -->
  <path d="M140 200 Q130 140 160 120 Q180 110 190 130 L200 200 Z" fill="#38bdf8" opacity="0.8" /> <!-- Torso -->
  <circle cx="175" cy="100" r="18" fill="#fbbf24" /> <!-- Head -->
  <path d="M175 118 Q175 130 160 135" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" /> <!-- Neck/Shoulder -->
  
  <!-- Arms and Hands -->
  <path d="M155 145 L110 175" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" /> <!-- Left Arm -->
  <path d="M185 140 L205 185" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" /> <!-- Right Arm -->
  
  <!-- Laptop -->
  <path d="M70 195 L140 195 L145 198 L65 198 Z" fill="#94a3b8" /> <!-- Base -->
  <rect x="75" y="145" width="60" height="45" rx="2" fill="#1e293b" stroke="#94a3b8" stroke-width="2" /> <!-- Screen -->
  <rect x="80" y="152" width="50" height="32" rx="1" fill="#0ea5e9" opacity="0.2" /> <!-- Screen Glow -->
  
  <!-- Laptop Screen Content (Abstract lines) -->
  <rect x="85" y="158" width="40" height="2" rx="1" fill="#38bdf8" />
  <rect x="85" y="164" width="30" height="2" rx="1" fill="#38bdf8" />
  <rect x="85" y="170" width="35" height="2" rx="1" fill="#38bdf8" />

  <!-- Smartphone (The Translation Tool) -->
  <rect x="45" y="170" width="22" height="38" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5" transform="rotate(-10, 56, 189)" />
  <rect x="48" y="174" width="16" height="30" rx="1" fill="#10b981" opacity="0.9" transform="rotate(-10, 56, 189)" />
  
  <!-- Translation Visual Metaphor on Phone -->
  <circle cx="53" cy="182" r="3" fill="#ffffff" opacity="0.8" transform="rotate(-10, 56, 189)" />
  <path d="M56 185 L60 185" stroke="#ffffff" stroke-width="1" transform="rotate(-10, 56, 189)" />
  <rect x="49" y="190" width="14" height="8" rx="1" fill="#ffffff" opacity="0.4" transform="rotate(-10, 56, 189)" />

  <!-- Homework/Paper -->
  <rect x="150" y="185" width="50" height="35" rx="2" fill="#f8fafc" transform="rotate(5, 175, 202)" />
  <path d="M158 195 L192 195 M158 202 L185 202 M158 209 L190 209" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" transform="rotate(5, 175, 202)" />
  
  <!-- Desk Lamp -->
  <path d="M20 200 L40 200 L35 150 Q35 130 55 130" fill="none" stroke="#475569" stroke-width="3" />
  <path d="M50 120 L75 120 L85 140 L40 140 Z" fill="#fb923c" />
  <path d="M45 140 Q62 170 80 140" fill="#fbbf24" opacity="0.3" filter="url(#glow)" />

  <!-- Coffee Mug -->
  <path d="M105 190 L115 190 L114 200 L106 200 Z" fill="#ec4899" />
  <path d="M115 192 Q119 192 119 195 Q119 198 115 198" fill="none" stroke="#ec4899" stroke-width="1.5" />

  <!-- Finishing Touches: Small particles for atmosphere -->
  <circle cx="210" cy="60" r="1" fill="#38bdf8" opacity="0.4" />
  <circle cx="220" cy="100" r="1.5" fill="#38bdf8" opacity="0.2" />
  <circle cx="40" cy="30" r="1" fill="#38bdf8" opacity="0.3" />
</svg>