<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Character: The Mentor (Pointing) -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L30 40 L25 90 L15 90 Z" fill="#38bdf8"/>
    <path d="M25 50 L50 45" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M45 45 L55 35" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character: The Student (Nodding/Realizing) -->
  <g transform="translate(50, 80)">
    <circle cx="20" cy="20" r="15" fill="#fca5a5"/>
    <path d="M10 40 L30 40 L25 90 L15 90 Z" fill="#ec4899"/>
    <path d="M20 15 L25 20 L20 25" fill="none" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- The "Obvious" Logic: A glowing lightbulb icon on a whiteboard -->
  <g transform="translate(120, 30)">
    <circle cx="0" cy="0" r="12" fill="#fb923c"/>
    <path d="M-5 10 L5 10 M-3 15 L3 15" stroke="#fb923c" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Context Props: Open book on desk -->
  <path d="M60 170 L100 170 L105 185 L55 185 Z" fill="#f8fafc"/>
  <path d="M65 175 L95 175 M65 180 L95 180" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Decorative ambient glow -->
  <circle cx="180" cy="180" r="40" fill="#10b981" opacity="0.05"/>
</svg>