<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  
  <!-- Car Body -->
  <path d="M40 180 L200 180 L190 130 L160 110 L80 110 L50 130 Z" fill="#fb923c"/>
  <rect x="90" y="120" width="40" height="30" rx="2" fill="#38bdf8" opacity="0.6"/>
  
  <!-- The Worn Tire (The focus) -->
  <circle cx="60" cy="180" r="25" fill="#1e293b" stroke="#fbbf24" stroke-width="4" stroke-dasharray="4 4"/>
  <circle cx="60" cy="180" r="10" fill="#475569"/>
  
  <!-- Mechanic Character -->
  <g transform="translate(140, 130)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40 L30 40 L35 80 L5 80 Z" fill="#ec4899"/>
    <rect x="10" y="80" width="8" height="20" fill="#fde68a"/>
    <rect x="22" y="80" width="8" height="20" fill="#fde68a"/>
    <path d="M5 45 L-10 60" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <path d="M35 45 L50 60" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Tool -->
  <path d="M160 190 L180 170 L190 180 L170 200 Z" fill="#94a3b8"/>
  <rect x="175" y="185" width="20" height="5" fill="#64748b" transform="rotate(45 185 187)"/>
  
  <!-- Other Tires -->
  <circle cx="180" cy="180" r="25" fill="#334155"/>
  <circle cx="180" cy="180" r="10" fill="#475569"/>
  
  <!-- Contextual Sparkles/Attention -->
  <circle cx="60" cy="150" r="3" fill="#fbbf24"/>
  <circle cx="55" cy="145" r="2" fill="#fbbf24"/>
</svg>