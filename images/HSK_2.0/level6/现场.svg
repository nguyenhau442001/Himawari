<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Environment -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="0" y="180" width="240" height="4" fill="#475569"/>
  
  <!-- Police Car (Simplified) -->
  <g transform="translate(140, 130)">
    <rect x="0" y="20" width="80" height="30" rx="4" fill="#38bdf8"/>
    <rect x="10" y="5" width="40" height="20" rx="2" fill="#38bdf8"/>
    <circle cx="20" cy="50" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="60" cy="50" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="25" y="10" width="10" height="10" fill="#fef3c7"/>
    <!-- Siren -->
    <rect x="30" y="0" width="10" height="5" fill="#ef4444"/>
  </g>

  <!-- Police Officer -->
  <g transform="translate(60, 120)">
    <!-- Body -->
    <rect x="10" y="30" width="20" height="40" rx="4" fill="#1e40af"/>
    <!-- Head -->
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <!-- Hat -->
    <rect x="8" y="8" width="24" height="6" rx="2" fill="#1e293b"/>
    <!-- Arm -->
    <path d="M30 40 L45 55" stroke="#1e40af" stroke-width="8" stroke-linecap="round"/>
    <!-- Leg -->
    <rect x="12" y="70" width="6" height="20" fill="#1e293b"/>
    <rect x="22" y="70" width="6" height="20" fill="#1e293b"/>
  </g>

  <!-- Caution Tape / Scene Marker -->
  <path d="M20 190 L100 160" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 5"/>
  <path d="M10 200 L90 170" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 5"/>
  
  <!-- Motion Lines -->
  <path d="M100 140 L120 140" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  <path d="M105 130 L125 130" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Background Details -->
  <rect x="180" y="80" width="40" height="100" fill="#1e293b" opacity="0.5"/>
  <rect x="190" y="100" width="20" height="20" fill="#334155"/>
  <rect x="190" y="140" width="20" height="20" fill="#334155"/>
</svg>