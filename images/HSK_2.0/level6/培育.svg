<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Architecture & Environment (School Interior / Office) -->
  <!-- Large Arched Window showing bright mentoring/future environment -->
  <path d="M 140 25 L 195 25 L 195 130 L 140 130 Z" fill="url(#windowGlow)" />
  <path d="M 140 25 A 27.5 27.5 0 0 1 195 25 Z" fill="#38bdf8" fill-opacity="0.15" />
  <path d="M 167.5 25 L 167.5 130" stroke="#334155" stroke-width="2" />
  <path d="M 140 77.5 L 195 77.5" stroke="#334155" stroke-width="2" />
  <rect x="137" y="22" width="61" height="111" rx="2" fill="none" stroke="#475569" stroke-width="3" />

  <!-- Bookshelf Background Elements -->
  <rect x="25" y="45" width="45" height="8" rx="2" fill="#334155" />
  <rect x="32" y="30" width="8" height="15" rx="1" fill="#fb923c" />
  <rect x="42" y="27" width="10" height="18" rx="1" fill="#38bdf8" />
  <rect x="54" y="32" width="7" height="13" rx="1" fill="#10b981" />

  <rect x="25" y="75" width="45" height="8" rx="2" fill="#334155" />
  <rect x="30" y="60" width="9" height="15" rx="1" fill="#ec4899" />
  <rect x="41" y="62" width="12" height="13" rx="1" fill="#fbbf24" />

  <!-- Ambient Light Cone (Mentorship / Growth theme) -->
  <polygon points="120,40 210,210 30,210" fill="url(#lightBeam)" />

  <!-- Desk & Workspace -->
  <rect x="35" y="150" width="170" height="12" rx="4" fill="url(#deskGrad)" filter="url(#softShadow)" />
  <rect x="55" y="162" width="12" height="48" rx="2" fill="#1e293b" />
  <rect x="173" y="162" width="12" height="48" rx="2" fill="#1e293b" />

  <!-- Desk Props: Laptop & Open Blueprint/Book of Talent -->
  <path d="M 120 144 L 155 144 L 162 150 L 113 150 Z" fill="#64748b" />
  <rect x="110" y="132" width="55" height="14" rx="2" fill="#cbd5e1" />
  <!-- Screen Glow Details -->
  <rect x="114" y="135" width="47" height="8" rx="1" fill="#0f172a" />
  <circle cx="120" cy="139" r="2" fill="#10b981" />
  <line x1="126" y1="138" x2="145" y2="138" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="126" y1="141" x2="138" y2="141" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />

  <!-- Growth Symbol / Seedling in Pot (Metaphor for nurturing talent) -->
  <g transform="translate(75, 122)">
    <path d="M 6 18 L 14 18 L 17 28 L 3 28 Z" fill="#cbd5e1" filter="url(#softShadow)" />
    <!-- Plant Stem & Leaves -->
    <path d="M 10 18 Q 10 10 6 6" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 10 13 Q 14 10 15 6 Q 12 11 10 13 Z" fill="#34d399" />
    <path d="M 8 9 Q 4 6 2 4 Q 5 8 8 9 Z" fill="#10b981" />
  </g>

  <!-- Person 1: Mentor / Professor (Guiding, nurturing) -->
  <g transform="translate(130, 78)">
    <!-- Body & Torso -->
    <path d="M 25 50 Q 25 35 45 35 Q 65 35 65 50 L 75 80 L 15 80 Z" fill="#334155" filter="url(#softShadow)" />
    <!-- Shirt / Collar -->
    <path d="M 45 35 L 38 48 L 52 48 Z" fill="#f8fafc" />
    <path d="M 42 48 L 45 58 L 48 48 Z" fill="#ef4444" />
    <!-- Head & Hair -->
    <circle cx="45" cy="22" r="14" fill="#fde047" />
    <path d="M 31 22 Q 33 10 45 10 Q 57 10 59 22 Q 55 16 45 16 Q 35 16 31 22 Z" fill="#334155" />
    <!-- Friendly facial features -->
    <circle cx="41" cy="21" r="1.5" fill="#1e293b" />
    <circle cx="49" cy="21" r="1.5" fill="#1e293b" />
    <path d="M 43 26 Q 45 28 47 26" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arm gesturing towards student -->
    <path d="M 28 42 Q 10 45 5 55" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <circle cx="5" cy="56" r="4" fill="#fde047" />
  </g>

  <!-- Person 2: Student / Emerging Talent (Receiving guidance, growing) -->
  <g transform="translate(50, 85)">
    <!-- Body & Torso -->
    <path d="M 25 45 Q 25 32 40 32 Q 55 32 55 45 L 65 75 L 15 75 Z" fill="#0284c7" filter="url(#softShadow)" />
    <!-- Collar -->
    <path d="M 40 32 L 34 42 L 46 42 Z" fill="#f8fafc" />
    <!-- Head & Hair -->
    <circle cx="40" cy="18" r="13" fill="#fde047" />
    <path d="M 27 18 Q 30 7 40 7 Q 52 7 53 18 Q 48 12 40 12 Q 32 12 27 18 Z" fill="#1e293b" />
    <!-- Energetic expression -->
    <circle cx="36" cy="17" r="1.5" fill="#1e293b" />
    <circle cx="44" cy="17" r="1.5" fill="#1e293b" />
    <path d="M 38 22 Q 40 24 42 22" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arms resting on desk / taking notes -->
    <path d="M 52 48 Q 65 52 70 58" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <circle cx="71" cy="59" r="3.5" fill="#fde047" />
  </g>

  <!-- Floating Sparkles / Excellence indicators (Representing '优秀人才' - Outstanding Talent) -->
  <g transform="translate(100, 50)" fill="#fbbf24">
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" opacity="0.9" />
  </g>
  <g transform="translate(145, 75)" fill="#38bdf8">
    <path d="M 0 -5 Q 0 0 5 0 Q 0 0 0 5 Q 0 0 -5 0 Q 0 0 0 -5 Z" opacity="0.8" />
  </g>
  <g transform="translate(85, 45)" fill="#34d399">
    <path d="M 0 -4 Q 0 0 4 0 Q 0 0 0 4 Q 0 0 -4 0 Q 0 0 0 -4 Z" opacity="0.9" />
  </g>

  <!-- Foreground framing elements for depth -->
  <path d="M 0 240 L 0 230 Q 120 220 240 230 L 240 240 Z" fill="#090d16" />
</svg>