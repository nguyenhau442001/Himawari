<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Architectural Stadium/Stage Interior Elements -->
  <!-- Stadium lights / Ambient glow -->
  <circle cx="120" cy="40" r="100" fill="url(#spotlight)"/>

  <!-- Background Curtains / Architecture -->
  <path d="M0 0 L40 0 L20 180 L0 180 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M240 0 L200 0 L220 180 L240 180 Z" fill="#0f172a" opacity="0.6"/>

  <!-- National Flag Banner Backdrop -->
  <g transform="translate(120, 30)">
    <!-- Hanging rod -->
    <rect x="-55" y="-10" width="110" height="4" rx="2" fill="#64748b"/>
    <!-- Flag cloth flowing -->
    <path d="M-50 -6 C -20 -12, 20 0, 50 -6 L 45 90 C 15 96, -15 84, -45 90 Z" fill="url(#flagRed)"/>
    <!-- Subtle golden wreath emblem silhouette on flag -->
    <circle cx="0" cy="40" r="18" fill="#fbbf24" opacity="0.25"/>
    <path d="M -8 40 L -3 45 L 8 33" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage Floor / Podium -->
  <ellipse cx="120" cy="195" rx="80" ry="18" fill="#0b0f19"/>
  <!-- Podium Structure -->
  <path d="M 85 175 L 155 175 L 165 205 L 75 205 Z" fill="#334155"/>
  <path d="M 80 175 L 160 175 L 160 182 L 80 182 Z" fill="#475569"/>
  <!-- Podium accent glow -->
  <rect x="95" y="188" width="50" height="6" rx="3" fill="#38bdf8" opacity="0.8"/>

  <!-- Confetti / Particle FX -->
  <circle cx="45" cy="80" r="3" fill="#fbbf24"/>
  <rect x="180" y="70" width="5" height="4" rx="1" fill="#38bdf8" transform="rotate(25 182 72)"/>
  <circle cx="195" cy="120" r="2.5" fill="#f43f5e"/>
  <rect x="35" y="130" width="4" height="6" rx="1" fill="#10b981" transform="rotate(-15 37 133)"/>
  <circle cx="70" cy="50" r="2" fill="#fb923c"/>
  <circle cx="170" cy="45" r="3" fill="#fbbf24"/>

  <!-- Main Character: Athlete / Representative -->
  <g transform="translate(120, 115)">
    <!-- Shadow beneath character -->
    <ellipse cx="0" cy="75" rx="35" ry="8" fill="#000000" opacity="0.4"/>

    <!-- Torso (Wearing official blazer/sport suit) -->
    <path d="M -22 25 L 22 25 L 26 72 L -26 72 Z" fill="#1e3a8a"/>
    <!-- Blazer lapels -->
    <path d="M -5 25 L -12 55 L 0 55 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 5 25 L 12 55 L 0 55 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 0 25 L 0 65" stroke="#0f172a" stroke-width="2"/>
    <!-- Gold medals / pins on jacket -->
    <circle cx="-10" cy="38" r="3" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="-4" cy="42" r="2.5" fill="#38bdf8"/>

    <!-- Neck & Head -->
    <rect x="-5" y="12" width="10" height="15" fill="#fbcfe8"/>
    <!-- Head circle -->
    <circle cx="0" cy="2" r="18" fill="#fbcfe8"/>
    <!-- Hair (Stylish short dark hair) -->
    <path d="M -18 0 C -18 -12, -8 -16, 2 -16 C 14 -16, 18 -8, 18 2 C 18 5, 15 3, 15 -2 C 12 -10, 2 -12, -8 -8 C -15 -5, -18 0, -18 0 Z" fill="#0f172a"/>
    
    <!-- Proud, happy facial expression -->
    <!-- Smiling eyes -->
    <path d="M -8 -1 Q -5 -5 -2 -1" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 2 -1 Q 5 -5 8 -1" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="-9" cy="4" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="9" cy="4" r="3" fill="#f43f5e" opacity="0.3"/>
    <!-- Big joyful smile -->
    <path d="M -5 7 Q 0 13 5 7" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms holding up the Trophy / Honor -->
    <!-- Left arm raised proudly holding trophy base/stem -->
    <path d="M -22 30 C -35 25, -42 10, -32 0" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round"/>
    <!-- Right arm supporting or pointing -->
    <path d="M 22 30 C 35 35, 40 45, 30 55" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="30" cy="55" r="5" fill="#fbcfe8"/>

    <!-- Legs -->
    <rect x="-16" y="70" width="12" height="25" rx="4" fill="#0f172a"/>
    <rect x="4" y="70" width="12" height="25" rx="4" fill="#0f172a"/>
    <!-- Shoes -->
    <path d="M -22 92 L -10 92 L -10 97 C -10 99, -16 99, -22 97 Z" fill="#334155"/>
    <path d="M 10 92 L 22 92 L 22 97 C 22 99, 16 99, 10 97 Z" fill="#334155"/>
  </g>

  <!-- The Grand Trophy (Centerpiece of Honor / 荣誉) -->
  <g transform="translate(120, 75)" filter="url(#glow)">
    <!-- Trophy Glow Aura -->
    <circle cx="0" cy="-10" r="35" fill="#fbbf24" opacity="0.15"/>
    
    <!-- Trophy Base -->
    <path d="M -12 25 L 12 25 L 9 35 L -9 35 Z" fill="#475569"/>
    <rect x="-16" y="35" width="32" height="6" rx="2" fill="#334155"/>
    
    <!-- Trophy Stem -->
    <rect x="-4" y="10" width="8" height="15" fill="url(#goldGrad)"/>

    <!-- Trophy Cup Body -->
    <path d="M -22 -20 C -22 15, 22 15, 22 -20 L 16 -25 C 16 -25, 10 -22, 0 -22 C -10 -22, -16 -25, -16 -25 Z" fill="url(#goldGrad)"/>
    <!-- Cup Rim -->
    <ellipse cx="0" cy="-22" rx="16" ry="4" fill="#fef3c7"/>
    <ellipse cx="0" cy="-22" rx="13" ry="2.5" fill="#d97706"/>

    <!-- Trophy Handles -->
    <path d="M -17 -18 C -28 -18, -28 0, -17 2" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 17 -18 C 28 -18, 28 0, 17 2" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Star Emblem on Trophy Center -->
    <path d="M 0 -7 L 2 -1 L 8 -1 L 3 3 L 5 9 L 0 6 L -5 9 L -3 3 L -8 -1 L -2 -1 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Sparkles around Trophy -->
  <g fill="#fbbf24">
    <path d="M 85 45 Q 90 45 90 40 Q 90 45 95 45 Q 90 45 90 50 Q 90 45 85 45 Z"/>
    <path d="M 155 55 Q 159 55 159 51 Q 159 55 163 55 Q 159 55 159 59 Q 159 55 155 55 Z"/>
    <circle cx="100" cy="80" r="1.5" fill="#ffffff"/>
    <circle cx="145" cy="75" r="2" fill="#ffffff"/>
  </g>
</svg>