<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="30" y="140" width="180" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="70" rx="2" fill="#475569"/>
  <rect x="190" y="150" width="10" height="70" rx="2" fill="#475569"/>
  
  <!-- Financial Chart (The "Impact" visual) -->
  <path d="M60 130 L90 100 L120 120 L150 60 L180 90" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="60" r="6" fill="#fb923c"/>
  
  <!-- Character: Stressed Business Person -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 80 Q-30 40 0 40 Q30 40 30 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="25" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-15 20 Q-20 5 0 5 Q20 5 15 20 Z" fill="#475569"/>
    <!-- Eyes (Stressed) -->
    <line x1="-8" y1="20" x2="-2" y2="25" stroke="#1e293b" stroke-width="2"/>
    <line x1="2" y1="25" x2="8" y2="20" stroke="#1e293b" stroke-width="2"/>
    <!-- Mouth (Worried) -->
    <path d="M-8 35 Q0 30 8 35" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Impact Visuals (Cracks/Shockwaves) -->
  <path d="M140 50 L160 40 M160 50 L170 30" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="60" r="15" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Floating Documents -->
  <rect x="170" y="70" width="30" height="20" rx="2" fill="#f1f5f9" transform="rotate(15 185 80)"/>
  <rect x="180" y="50" width="25" height="15" rx="2" fill="#f1f5f9" transform="rotate(-10 192 57)"/>
</svg>