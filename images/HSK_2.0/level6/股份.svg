<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Golden Screen / Document Glow -->
    <linearGradient id="docGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Pie Chart Slices for "Shares" Concept (Visualizing portion of company) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Office Interior -->
  <!-- Large Architecture Window -->
  <polygon points="170,30 220,40 220,180 170,160" fill="url(#windowGlow)" />
  <line x1="195" y1="35" x2="195" y2="170" stroke="#334155" stroke-width="1.5" />
  <line x1="170" y1="100" x2="220" y2="110" stroke="#334155" stroke-width="1.5" />

  <!-- Bookshelf / Plant silhouette in background -->
  <rect x="20" y="50" width="25" height="90" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="70" x2="45" y2="70" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="95" x2="45" y2="95" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="120" x2="45" y2="120" stroke="#334155" stroke-width="1" />
  <!-- Small plant on shelf -->
  <path d="M28,68 Q30,58 35,62 Q40,58 42,68 Z" fill="#10b981" opacity="0.8" />

  <!-- Office Desk Surface -->
  <path d="M20,170 L220,170 L230,210 L10,210 Z" fill="url(#deskGrad)" />
  <line x1="20" y1="170" x2="220" y2="170" stroke="#475569" stroke-width="2" />

  <!-- Desk Props: Plant & Coffee Mug -->
  <!-- Coffee Mug -->
  <rect x="35" y="150" width="16" height="20" rx="3" fill="#ec4899" />
  <path d="M51,154 C55,154 55,164 51,164" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
  <!-- Small Desk Plant -->
  <ellipse cx="200" cy="155" rx="8" ry="4" fill="#64748b" />
  <path d="M200,155 L200,145 M197,148 Q190,140 193,135 M203,148 Q210,138 207,133" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Laptop & Holographic / Glowing Document showing "Shares/Portion" -->
  <!-- Laptop Base -->
  <polygon points="65,185 135,185 145,198 55,198" fill="#64748b" />
  <!-- Laptop Screen -->
  <polygon points="70,125 130,125 135,185 65,185" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <polygon points="73,128 127,128 132,182 68,182" fill="url(#docGlow)" />

  <!-- Data Graphic on Laptop Screen (Pie Chart representing "部分股份" - a portion of shares) -->
  <circle cx="100" cy="150" r="16" fill="#334155" />
  <!-- Pie slice representing part/share (amber/gold) -->
  <path d="M100,150 L100,134 A16,16 0 0,1 115,158 Z" fill="#fbbf24" />
  <path d="M100,150 L115,158 A16,16 0 1,1 100,134 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="100" cy="150" r="6" fill="#0f172a" />

  <!-- Character (Businessman analyzing his company share) -->
  <!-- Chair Back -->
  <path d="M125,90 L155,90 L160,165 L120,165 Z" fill="#334155" rx="4" />

  <!-- Character Torso & Arms -->
  <path d="M105,175 C105,145 125,135 145,140 L155,175 Z" fill="#1e3a8a" /> <!-- Suit jacket -->
  <path d="M120,140 L135,140 L140,155 L125,155 Z" fill="#ffffff" /> <!-- Shirt collar / tie base -->
  <polygon points="129,143 133,143 135,160 131,160" fill="#ef4444" /> <!-- Red Tie -->

  <!-- Character Head & Hair -->
  <circle cx="130" cy="105" r="18" fill="#fcd34d" /> <!-- Skin tone -->
  <!-- Hair -->
  <path d="M113,105 C113,90 120,88 135,89 C148,90 148,100 147,105 C142,98 120,96 113,105 Z" fill="#1e293b" />
  <!-- Friendly, confident facial expression -->
  <circle cx="125" cy="103" r="1.5" fill="#1e293b" />
  <circle cx="137" cy="103" r="1.5" fill="#1e293b" />
  <path d="M129,111 Q131,114 133,111" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Arms interacting with laptop & documents -->
  <!-- Right arm reaching toward screen/desk -->
  <path d="M140,145 Q150,155 135,170" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" />
  <circle cx="133" cy="172" r="4" fill="#fcd34d" />

  <!-- Floating Document/Certificate Prop representing official Share Certificate -->
  <g transform="translate(70, 75) rotate(-10)">
    <rect width="45" height="55" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" filter="url(#glow)" />
    <!-- Header line -->
    <rect x="8" y="8" width="20" height="4" rx="1" fill="#3b82f6" />
    <!-- Text lines placeholder -->
    <line x1="8" y1="18" x2="37" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="24" x2="30" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="30" x2="35" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Gold Seal / Stamp representing ownership/shares -->
    <circle cx="32" cy="42" r="7" fill="#fbbf24" />
    <circle cx="32" cy="42" r="4" fill="#f59e0b" />
  </g>

  <!-- Sparkles / Emphasis on the "Share/Portion" concept -->
  <path d="M55,60 L58,68 L66,71 L58,74 L55,82 L52,74 L44,71 L52,68 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M175,65 L177,70 L182,72 L177,74 L175,79 L173,74 L168,72 L173,70 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="160" cy="50" r="3" fill="#fbbf24" opacity="0.7" />
  <circle cx="50" cy="120" r="2" fill="#38bdf8" opacity="0.6" />

</svg>