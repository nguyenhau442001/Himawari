<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1b18" />
      <stop offset="60%" stop-color="#191113" />
      <stop offset="100%" stop-color="#0f0c10" />
    </linearGradient>

    <!-- Sky/Haze Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.15" />
    </linearGradient>

    <!-- Ground/Cracked Earth Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="40%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#291102" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Sky & Scorching Sun -->
  <rect x="0" y="0" width="240" height="150" fill="url(#skyGrad)" rx="24" />
  <circle cx="180" cy="55" r="45" fill="url(#sunGlow)" />
  <circle cx="180" cy="55" r="22" fill="#fde047" opacity="0.9" />

  <!-- Background Distant Hills (Dry, Barren) -->
  <path d="M0 130 Q60 110 120 125 T240 115 L240 145 L0 145 Z" fill="#451a03" opacity="0.7" />

  <!-- Ground: Severe Drought (Parched, Cracked Earth) -->
  <path d="M0 140 Q120 135 240 140 L240 240 L0 240 Z" fill="url(#groundGrad)" />

  <!-- Deep Ground Cracks (Illustration of 干旱 / Drought) -->
  <path d="M20 160 L45 180 L35 210 L60 230" stroke="#170a01" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M45 180 L75 190 L95 175" stroke="#170a01" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M120 150 L110 175 L135 195 L125 235" stroke="#170a01" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M110 175 L85 195" stroke="#170a01" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M180 170 L165 190 L195 210" stroke="#170a01" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M195 155 L210 180 L230 190" stroke="#170a01" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Withered Dead Tree (Symbolizing Severe Drought) -->
  <g transform="translate(45, 145)">
    <!-- Trunk & Branches -->
    <path d="M15 0 C15 -15 8 -25 3 -40 C0 -48 5 -55 2 -65" stroke="#3b1f11" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M10 -25 C18 -32 25 -30 32 -40" stroke="#3b1f11" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M6 -45 C-2 -52 -5 -60 -12 -68" stroke="#3b1f11" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M2 -35 C10 -40 12 -50 8 -58" stroke="#3b1f11" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Cracking Root Base -->
    <path d="M0 0 L-10 8 M15 0 L25 10" stroke="#3b1f11" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Secondary Small Withered Shrub -->
  <path d="M205 152 Q210 142 215 150 M210 145 Q205 138 200 142" stroke="#451a03" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Main Human Subject: Farmer/Villager Inspecting the Dry Land -->
  <g transform="translate(120, 120)">
    <!-- Shadow -->
    <ellipse cx="0" cy="55" rx="22" ry="6" fill="#0f0c10" opacity="0.6" />

    <!-- Legs (Kneeling/Crouching position reflecting despair/worry) -->
    <path d="M-12 35 L-18 52 L-8 55" stroke="#b45309" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M12 35 L16 52 L6 55" stroke="#b45309" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <ellipse cx="-7" cy="55" rx="5" ry="3" fill="#78350f" />
    <ellipse cx="7" cy="55" rx="5" ry="3" fill="#78350f" />

    <!-- Torso (Bent forward, heavy mood) -->
    <path d="M-14 10 C-16 0 -10 -15 0 -20 C10 -15 16 0 14 35 L-12 35 Z" fill="#d97706" />
    <path d="M-13 12 C-13 25 -10 35 -10 35 L10 35 C10 35 13 25 13 12 Z" fill="#b45309" opacity="0.4" /> <!-- Vest detail -->

    <!-- Head & Straw Hat (Classic rural farmer look) -->
    <!-- Head -->
    <circle cx="0" cy="-28" r="10" fill="#fbcfe8" />
    <path d="M-8 -32 C-8 -38 8 -38 8 -32 Z" fill="#78350f" /> <!-- Hair -->

    <!-- Concerned Facial Expression (Implied: furrowed brow, downward gaze) -->
    <path d="M-3 -30 L-1 -29" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <path d="M1 -29 L3 -30" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="-2" cy="-25" r="1" fill="#78350f" />
    <circle cx="2" cy="-25" r="1" fill="#78350f" />
    <path d="M-2 -20 Q0 -18 2 -20" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round" /> <!-- Sad mouth -->

    <!-- Conical Straw Hat tilted forward -->
    <ellipse cx="0" cy="-38" rx="22" ry="7" fill="#fbbf24" />
    <ellipse cx="0" cy="-39" rx="12" ry="3" fill="#f59e0b" />
    <path d="M-22 -38 C-25 -36 -20 -33 -15 -35" stroke="#d97706" stroke-width="1" fill="none" />

    <!-- Arms reaching down to touch the cracked earth -->
    <path d="M-12 -5 C-22 0 -28 15 -35 30" stroke="#d97706" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M12 -5 C22 5 28 20 28 35" stroke="#d97706" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Hands -->
    <circle cx="-36" cy="32" r="4" fill="#fbcfe8" />
    <circle cx="28" cy="37" r="4" fill="#fbcfe8" />
  </g>

  <!-- Context Prop: Empty/Dry Wooden Bucket & Broken Hoe nearby -->
  <!-- Bucket -->
  <g transform="translate(75, 160)">
    <path d="M-8 0 L8 0 L6 18 L-6 18 Z" fill="#78350f" />
    <path d="M-9 3 L9 3" stroke="#451a03" stroke-width="2" />
    <path d="M-7 14 L7 14" stroke="#451a03" stroke-width="2" />
    <path d="M-8 0 C-12 -12 12 -12 8 0" stroke="#94a3b8" stroke-width="2" fill="none" /> <!-- Handle -->
  </g>

  <!-- Broken Hoe (象征农作困难) -->
  <g transform="translate(165, 175) rotate(-35)">
    <!-- Handle -->
    <rect x="0" y="0" width="6" height="50" rx="3" fill="#a16207" />
    <!-- Metal Blade -->
    <path d="M-8 -6 L14 -6 L10 4 L-4 4 Z" fill="#64748b" />
    <path d="M-8 -6 L14 -6 L14 -10 L-8 -10 Z" fill="#475569" />
  </g>

  <!-- Subtle Dust/Heat Haze Overlay Effect -->
  <rect x="0" y="0" width="240" height="240" fill="#f59e0b" opacity="0.04" pointer-events="none" rx="24" />

  <!-- Frame Border (Clean Minimalist Rounded Inset) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3" />
</svg>