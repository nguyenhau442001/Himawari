<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wood-shelf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" fill="url(#lamp-glow)" />

  <!-- Room Environment & Context Props -->
  <!-- Wallpaper Grid / Accent Lines -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" />
  <rect x="0" y="160" width="240" height="80" fill="#0b0f19" opacity="0.4" />

  <!-- Background Shelf with Books & Plant -->
  <rect x="25" y="75" width="90" height="6" rx="3" fill="url(#wood-shelf)" />
  <!-- Books on shelf -->
  <rect x="35" y="53" width="10" height="22" rx="2" fill="#38bdf8" />
  <rect x="47" y="48" width="12" height="27" rx="2" fill="#f43f5e" />
  <rect x="61" y="55" width="8" height="20" rx="2" fill="#10b981" />
  <!-- Small potted plant -->
  <path d="M90 65 L102 65 L99 75 L93 75 Z" fill="#cbd5e1" />
  <path d="M96 65 C96 58 102 55 102 50 C102 58 96 65 96 65 Z" fill="#34d399" />
  <path d="M96 65 C96 58 90 55 90 50 C90 58 96 65 96 65 Z" fill="#10b981" />

  <!-- Picture Frame on Wall -->
  <rect x="145" y="42" width="45" height="35" rx="4" fill="#334155" />
  <rect x="148" y="45" width="39" height="29" fill="#1e293b" />
  <!-- Simple landscape in frame -->
  <circle cx="167" cy="55" r="6" fill="#fbbf24" />
  <path d="M148 65 L160 55 L175 68 L187 60 L187 74 L148 74 Z" fill="#059669" opacity="0.6" />

  <!-- Hanging Pendant Lamp -->
  <path d="M185 0 L185 30" stroke="#64748b" stroke-width="2" />
  <path d="M170 30 L200 30 L205 40 L165 40 Z" fill="#fbbf24" />

  <!-- Window with Night Sky / Stars outside -->
  <rect x="190" y="80" width="35" height="65" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <circle cx="202" cy="95" r="1.5" fill="#e2e8f0" />
  <circle cx="215" cy="115" r="1" fill="#e2e8f0" />
  <circle cx="200" cy="130" r="1.5" fill="#e2e8f0" />
  <path d="M190 112 L225 112" stroke="#475569" stroke-width="2" />

  <!-- Central Character (Owner/Teacher gesturing thoughtfully) -->
  <!-- Body / Torso -->
  <path d="M100 150 C100 135 110 130 120 130 C130 130 140 135 140 150 L145 195 L95 195 Z" fill="#38bdf8" />
  <!-- Collar -->
  <path d="M112 130 L120 142 L128 130 Z" fill="#f8fafc" />

  <!-- Head & Face -->
  <circle cx="120" cy="108" r="18" fill="#fcd34d" />
  <!-- Hair -->
  <path d="M102 108 C102 95 110 90 120 90 C130 90 138 95 138 108 C138 102 134 92 120 92 C106 92 102 102 102 108 Z" fill="#334155" />
  <!-- Friendly Face features -->
  <circle cx="114" cy="106" r="1.5" fill="#1e293b" />
  <circle cx="126" cy="106" r="1.5" fill="#1e293b" />
  <path d="M117 114 Q120 118 123 114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Rosy cheeks -->
  <circle cx="111" cy="110" r="2.5" fill="#f43f5e" opacity="0.4" />
  <circle cx="129" cy="110" r="2.5" fill="#f43f5e" opacity="0.4" />

  <!-- Arms / Hands gesturing towards the pets -->
  <!-- Right Arm (pointing/presenting to the left) -->
  <path d="M136 140 C145 140 155 148 150 155" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <circle cx="152" cy="156" r="4" fill="#fcd34d" />

  <!-- Left Arm -->
  <path d="M104 140 C95 145 90 155 95 160" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
  <circle cx="95" cy="162" r="4" fill="#fcd34d" />

  <!-- Rug on Floor -->
  <ellipse cx="120" cy="205" rx="80" ry="15" fill="#334155" opacity="0.7" />
  <ellipse cx="120" cy="205" rx="70" ry="11" fill="#475569" opacity="0.5" />

  <!-- PET 1: CAT (Left side, smart pose with small glowing 'smart/idea' spark) -->
  <g transform="translate(60, 160)">
    <!-- Cat Body -->
    <ellipse cx="15" cy="25" rx="14" ry="11" fill="#fb923c" />
    <!-- Cat Head -->
    <circle cx="10" cy="12" rx="10" fill="#fb923c" />
    <!-- Cat Ears -->
    <path d="M2 5 L6 14 L10 4 Z" fill="#fb923c" />
    <path d="M14 4 L18 14 L22 5 Z" fill="#fb923c" />
    <path d="M4 7 L6 11 L8 6 Z" fill="#fbcfe8" />
    <path d="M16 6 L18 11 L20 7 Z" fill="#fbcfe8" />
    <!-- Cat Face -->
    <circle cx="7" cy="11" r="1" fill="#1e293b" />
    <circle cx="13" cy="11" r="1" fill="#1e293b" />
    <polygon points="10,13 8,15 12,15" fill="#fbcfe8" />
    <path d="M7 16 Q10 18 13 16" stroke="#1e293b" stroke-width="1" fill="none" stroke-linecap="round" />
    <!-- Whiskers -->
    <line x1="2" y1="15" x2="6" y2="16" stroke="#fff" stroke-width="1" opacity="0.7" />
    <line x1="2" y1="18" x2="6" y2="17" stroke="#fff" stroke-width="1" opacity="0.7" />
    <line x1="14" y1="16" x2="18" y2="15" stroke="#fff" stroke-width="1" opacity="0.7" />
    <line x1="14" y1="17" x2="18" y2="18" stroke="#fff" stroke-width="1" opacity="0.7" />
    <!-- Cat Tail (curled up) -->
    <path d="M27 28 C35 28 35 15 28 15" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" />
    <!-- Cat Paws -->
    <ellipse cx="8" cy="35" rx="3" ry="2" fill="#fb923c" />
    <ellipse cx="20" cy="35" rx="3" ry="2" fill="#fb923c" />
    <!-- Smart Sparkle above Cat -->
    <path d="M10 -2 L12 3 L17 5 L12 7 L10 12 L8 7 L3 5 L8 3 Z" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- PET 2: DOG (Right side, smart/alert expression) -->
  <g transform="translate(145, 150)">
    <!-- Dog Body -->
    <ellipse cx="20" cy="32" rx="16" ry="12" fill="#d97706" />
    <!-- Dog Head -->
    <circle cx="26" cy="16" rx="11" fill="#d97706" />
    <!-- Floppy Ears -->
    <path d="M16 12 C14 18 18 24 22 22" fill="#b45309" />
    <path d="M34 14 C38 18 36 24 32 23" fill="#b45309" />
    <!-- Dog Muzzle -->
    <ellipse cx="28" cy="20" rx="6" ry="5" fill="#fde68a" />
    <circle cx="28" cy="18" r="2" fill="#1e293b" />
    <!-- Dog Face Features -->
    <circle cx="21" cy="14" r="1.5" fill="#1e293b" />
    <circle cx="31" cy="14" r="1.5" fill="#1e293b" />
    <!-- Happy open mouth / tongue -->
    <path d="M26 22 Q28 25 30 22" fill="#f43f5e" />
    <!-- Dog Tail (wagging upward) -->
    <path d="M4 30 C-4 26 -2 18 2 22" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
    <!-- Dog Paws -->
    <ellipse cx="12" cy="43" rx="3.5" ry="2" fill="#d97706" />
    <ellipse cx="26" cy="43" rx="3.5" ry="2" fill="#d97706" />
    <!-- Smart Sparkle above Dog -->
    <path d="M32 2 L33.5 5.5 L37 7 L33.5 8.5 L32 12 L30.5 8.5 L27 7 L30.5 5.5 Z" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Foreground Floor Line -->
  <path d="M0 195 L240 195" stroke="#475569" stroke-width="3" />

  <!-- Interactive Accent Sparkles / Richness elements -->
  <circle cx="50" cy="115" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="190" cy="125" r="2" fill="#38bdf8" opacity="0.6" />
</svg>