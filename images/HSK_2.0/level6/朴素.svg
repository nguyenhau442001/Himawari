<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit (Plain/Simple) Gradient -->
    <linearGradient id="plainOutfit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Glow -->
  <circle cx="120" cy="90" r="110" fill="url(#lampGlow)" />

  <!-- ================= BACKGROUND LAYER: COZY ROOM ================= -->
  <!-- Wallpaper/Wall -->
  <rect x="24" y="24" width="192" height="192" rx="4" fill="none" />
  
  <!-- Window Frame (Left) -->
  <rect x="36" y="55" width="40" height="70" rx="2" fill="#0b1325" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="59" width="32" height="62" fill="url(#nightSky)" />
  <!-- Window Panes -->
  <line x1="56" y1="59" x2="56" y2="121" stroke="#334155" stroke-width="1.5"/>
  <line x1="40" y1="90" x2="72" y2="90" stroke="#334155" stroke-width="1.5"/>
  <!-- Moon outside -->
  <circle cx="50" cy="70" r="5" fill="#e2e8f0" opacity="0.8"/>

  <!-- Hanging Bookshelf (Right) -->
  <rect x="145" y="60" width="60" height="6" rx="1" fill="#475569"/>
  <path d="M152 60 L152 48 L158 48 L158 60 Z" fill="#3b82f6" opacity="0.8"/>
  <path d="M160 60 L160 52 L165 52 L165 60 Z" fill="#10b981" opacity="0.8"/>
  <path d="M168 60 L168 46 L175 46 L175 60 Z" fill="#f59e0b" opacity="0.8"/>

  <!-- Potted Plant on Floor -->
  <path d="M42 190 L58 190 L54 212 L46 212 Z" fill="#64748b"/>
  <ellipse cx="50" cy="190" rx="8" ry="2" fill="#94a3b8"/>
  <path d="M50 190 Q40 170 35 160" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 190 Q65 170 70 155" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 190 Q50 165 52 150" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="35" cy="160" r="4" fill="#4ade80"/>
  <circle cx="70" cy="155" r="5" fill="#4ade80"/>
  <circle cx="52" cy="150" r="4" fill="#4ade80"/>

  <!-- Wooden Desk & Table Lamp -->
  <rect x="80" y="165" width="125" height="50" rx="3" fill="#334155"/>
  <rect x="90" y="170" width="105" height="6" rx="2" fill="#475569"/>
  <!-- Desk Lamp -->
  <path d="M165 170 L165 140 L175 140 L175 170 Z" fill="#cbd5e1"/>
  <path d="M155 140 C155 130 185 130 185 140 Z" fill="#38bdf8"/>
  <ellipse cx="170" cy="140" rx="15" ry="3" fill="#0284c7"/>
  <!-- Open Notebook on Desk -->
  <rect x="110" y="178" width="25" height="18" rx="1" fill="#f8fafc"/>
  <line x1="122" y1="178" x2="122" y2="196" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="114" y1="183" x2="120" y2="183" stroke="#94a3b8" stroke-width="1"/>
  <line x1="114" y1="188" x2="120" y2="188" stroke="#94a3b8" stroke-width="1"/>
  <line x1="124" y1="183" x2="130" y2="183" stroke="#94a3b8" stroke-width="1"/>


  <!-- ================= FOREGROUND: THE SUBJECT (PLAINTY DRESSED WOMAN) ================= -->
  
  <!-- Chair Back -->
  <rect x="95" y="130" width="26" height="55" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Woman's Body & Posture -->
  <!-- Simple Slate Gray / Muted Tone Top (Highlighting "朴素" - plain, unadorned clothing) -->
  <path d="M92 145 C85 145 78 158 75 175 L125 175 C122 158 115 145 108 145 Z" fill="url(#plainOutfit)"/>
  
  <!-- Simple Round Collar (No patterns, no jewelry) -->
  <path d="M92 145 Q100 155 108 145 Q100 148 92 145 Z" fill="#475569"/>

  <!-- Arms / Hands -->
  <path d="M82 150 L100 172 L112 165" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands holding a simple teacup -->
  <circle cx="106" cy="168" r="4" fill="#f1f5f9"/>

  <!-- Neck -->
  <rect x="96" y="134" width="8" height="15" fill="#fbcfe8" rx="3"/>

  <!-- Head & Hair (Neat, tied back simply, no fancy clips or styling) -->
  <!-- Back Hair Bun -->
  <circle cx="112" cy="120" r="8" fill="#334155"/>
  <!-- Head Base -->
  <circle cx="100" cy="122" r="14" fill="#fbcfe8"/>
  <!-- Simple Front Hair / Bangs -->
  <path d="M88 118 C90 110 102 110 110 118 C105 125 93 125 88 118 Z" fill="#334155"/>
  
  <!-- Facial Profile (Calm, gentle expression) -->
  <!-- Gentle Eye -->
  <path d="M96 122 Q99 125 102 122" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gentle Smile -->
  <path d="M97 129 Q100 131 103 129" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rosy Cheek -->
  <circle cx="95" cy="126" r="3" fill="#fda4af" opacity="0.6"/>

  <!-- Chair Seat & Legs -->
  <rect x="88" y="175" width="40" height="8" rx="2" fill="#334155"/>
  <line x1="94" y1="183" x2="90" y2="215" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="122" y1="183" x2="126" y2="215" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="102" y1="183" x2="102" y2="212" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle Warm Accent Lighting from Lamp -->
  <path d="M0 0 L240 0 L240 240 L0 240 Z" fill="#f59e0b" opacity="0.03" pointer-events="none"/>
</svg>