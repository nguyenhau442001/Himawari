<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with dark modern gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scroll-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e2"/>
      <stop offset="100%" stop-color="#f5e6be"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- Atmospheric background details (study room) -->
  <path d="M40 190 L200 190 L200 196 L40 196 Z" fill="#334155" opacity="0.6"/>
  <!-- Bookshelf in background -->
  <rect x="180" y="70" width="35" height="120" fill="#1e293b" rx="2"/>
  <line x1="180" y1="100" x2="215" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="130" x2="215" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="160" x2="215" y2="160" stroke="#334155" stroke-width="2"/>
  <!-- Colorful books -->
  <rect x="185" y="80" width="8" height="20" fill="#ef4444" rx="1"/>
  <rect x="195" y="77" width="10" height="23" fill="#3b82f6" rx="1"/>
  <rect x="186" y="110" width="12" height="20" fill="#10b981" rx="1"/>
  <rect x="200" y="113" width="7" height="17" fill="#f59e0b" rx="1"/>

  <!-- Window with soft night light -->
  <rect x="25" y="55" width="45" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="47" y1="55" x2="47" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="92" x2="70" y2="92" stroke="#334155" stroke-width="2"/>
  <!-- Moon outside -->
  <circle cx="55" cy="73" r="8" fill="#fbbf24" opacity="0.8"/>

  <!-- Study Desk -->
  <path d="M30 165 L210 165 L200 190 L40 190 Z" fill="#475569" filter="url(#shadow)"/>
  <rect x="35" y="160" width="170" height="6" fill="#64748b" rx="2"/>

  <!-- Desk lamp casting warm light -->
  <path d="M175 160 L180 120 L185 120 L190 160 Z" fill="#64748b"/>
  <path d="M165 110 C165 95 195 95 195 110 Z" fill="#f59e0b" filter="url(#shadow)"/>
  <polygon points="150,165 180,110 210,165" fill="url(#beam-grad)"/>

  <!-- Character (Thoughtful Reader / Scholar) -->
  <!-- Body / Torso -->
  <path d="M75 190 C75 160 90 145 115 145 C140 145 155 160 155 190 Z" fill="#2563eb" filter="url(#shadow)"/>
  <path d="M95 148 C105 138 125 138 135 148 L145 165 L85 165 Z" fill="#1e40af"/> <!-- Collar/Shirt -->

  <!-- Neck & Head -->
  <rect x="105" y="128" width="20" height="22" fill="#fbcfe8" rx="6"/>
  <path d="M100 115 C100 95 130 95 130 115 C130 125 100 125 100 115 Z" fill="#fbcfe8"/> <!-- Head base -->

  <!-- Hair (Stylized dark neat hair) -->
  <path d="M100 108 C100 88 130 88 132 108 C132 115 128 115 125 110 C120 98 110 98 105 110 C103 115 100 115 100 108 Z" fill="#0f172a"/>

  <!-- Expressive Face (Deep contemplation) -->
  <!-- Eyebrows angled thoughtfully -->
  <line x1="108" y1="108" x2="116" y2="110" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="110" x2="128" y2="108" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes closed in deep thought / concentration -->
  <path d="M110 114 Q114 117 118 114" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M122 114 Q126 117 130 114" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Thoughtful gentle smile / pursed lips -->
  <path d="M116 123 Q120 125 124 123" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Hand supporting chin (Pensive gesture) -->
  <circle cx="108" cy="132" r="8" fill="#fbcfe8"/>
  <path d="M100 145 L108 135 L116 142 Z" fill="#2563eb"/>

  <!-- Classical Scroll / Ancient Book open on desk with "Deep Meaning" glowing effect -->
  <g transform="translate(70, 150)">
    <!-- Scroll base -->
    <path d="M 0 15 Q 40 5 80 15 L 80 35 Q 40 25 0 35 Z" fill="url(#scroll-grad)" filter="url(#shadow)"/>
    <!-- Scroll ends (rollers) -->
    <ellipse cx="2" cy="25" rx="3" ry="10" fill="#b45309"/>
    <ellipse cx="78" cy="25" rx="3" ry="10" fill="#b45309"/>
    <!-- Abstract philosophical lines representing text (meaning/proverb) -->
    <line x1="15" y1="15" x2="35" y2="17" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="14" x2="65" y2="16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="22" x2="65" y2="24" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Glowing magical/intellectual sparkles symbolizing "Deep Meaning / 含义" -->
  <g>
    <!-- Central golden aura rising from the scroll -->
    <circle cx="110" cy="140" r="22" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    <circle cx="110" cy="140" r="32" fill="none" stroke="#f59e0b" stroke-width="0.75" opacity="0.4"/>
    
    <!-- Sparkle 1 (Top Left) -->
    <path d="M 85 105 Q 90 105 90 100 Q 90 105 95 105 Q 90 105 90 110 Q 90 105 85 105 Z" fill="#fbbf24" filter="url(#shadow)"/>
    <!-- Sparkle 2 (Top Right) -->
    <path d="M 135 95 Q 140 95 140 90 Q 140 95 145 95 Q 140 95 140 100 Q 140 95 135 95 Z" fill="#38bdf8" filter="url(#shadow)"/>
    <!-- Sparkle 3 (Center High) -->
    <path d="M 112 80 Q 117 80 117 75 Q 117 80 122 80 Q 117 80 117 85 Q 117 80 112 80 Z" fill="#fbbf24" filter="url(#shadow)"/>
    
    <!-- Small glowing dots -->
    <circle cx="75" cy="130" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="145" cy="125" r="3" fill="#fbbf24" opacity="0.9"/>
    <circle cx="95" cy="75" r="1.5" fill="#f43f5e" opacity="0.8"/>
    <circle cx="130" cy="70" r="2" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Teacup on desk for cozy intellectual ambiance -->
  <path d="M 45 160 C 45 152 55 152 55 160 Z" fill="#cbd5e1"/>
  <rect x="43" y="160" width="14" height="15" rx="3" fill="#f1f5f9"/>
  <path d="M 57 163 C 61 163 61 170 57 171" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <!-- Steam from teacup -->
  <path d="M 48 148 Q 50 144 48 140" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 52 147 Q 54 143 52 139" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>

</svg>