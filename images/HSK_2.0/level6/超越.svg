<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Aura Gradient for Limit Breaking -->
    <radialGradient id="energyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Track/Environment Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Holographic Bar Fill -->
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Background Elements: Running Track & Stadium Vibe -->
  <!-- Track Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#trackGrad)" />
  <!-- Glowing Lane Lines -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#475569" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <line x1="0" y1="215" x2="240" y2="215" stroke="#475569" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Background holographic "Limit" Bar (Visualizing crossing a threshold) -->
  <g transform="translate(45, 30)">
    <!-- Hologram Frame -->
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Background track for bar -->
    <rect x="8" y="8" width="134" height="10" rx="3" fill="#1e293b" />
    <!-- Filled progress pushing past 100% (The 'Limit') -->
    <rect x="8" y="8" width="120" height="10" rx="3" fill="url(#barFill)" />
    <!-- Dotted Limit Line Marker -->
    <line x1="105" y1="4" x2="105" y2="22" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2" />
    <!-- Glowing pulse node at limit breach -->
    <circle cx="128" cy="13" r="5" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="128" cy="13" r="2" fill="#ffffff" />
  </g>

  <!-- Energy Aura / Shockwave Behind Runner (Representing breaking through limits) -->
  <circle cx="125" cy="135" r="55" fill="url(#energyAura)" />
  <path d="M 95 105 L 110 90 M 155 105 L 140 90 M 85 140 L 65 135 M 165 140 L 185 135" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Dynamic Motion Lines (Speed & Breakthrough) -->
  <g opacity="0.5" stroke-linecap="round">
    <line x1="20" y1="125" x2="70" y2="125" stroke="#38bdf8" stroke-width="2" />
    <line x1="10" y1="145" x2="55" y2="145" stroke="#10b981" stroke-width="3" />
    <line x1="30" y1="165" x2="80" y2="165" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="170" y1="115" x2="220" y2="115" stroke="#f59e0b" stroke-width="2.5" />
    <line x1="160" y1="155" x2="215" y2="155" stroke="#ec4899" stroke-width="2" />
  </g>

  <!-- Main Character: Runner breaking limits (Dynamic Pose) -->
  <g transform="translate(10, 0)">
    <!-- Back Leg (Extending back) -->
    <path d="M 115 135 L 85 175 L 70 170" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Back Foot -->
    <path d="M 70 170 L 58 178" stroke="#334155" stroke-width="8" stroke-linecap="round" />

    <!-- Torso (Lean forward with intense effort) -->
    <path d="M 105 100 L 125 145 L 110 150 L 95 110 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Athletic Top details -->
    <path d="M 100 110 L 120 115 L 118 135 L 102 130 Z" fill="#38bdf8" opacity="0.6" />

    <!-- Back Arm (Pumping backward) -->
    <path d="M 108 105 L 85 125 L 75 115" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="72" cy="112" r="4" fill="#fed7aa" />

    <!-- Front Leg (Driving forward powerfully) -->
    <path d="M 120 142 L 140 130 L 155 160" fill="none" stroke="#38bdf8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Foot -->
    <path d="M 155 160 L 170 168" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" />

    <!-- Head & Face (Determined expression, looking forward) -->
    <g transform="translate(122, 78)">
      <!-- Hair flying back -->
      <path d="M 5 -4 C -2 -4 -8 2 -12 10 C -4 8 2 2 5 -4 Z" fill="#1e293b" />
      <!-- Head base -->
      <circle cx="0" cy="0" r="14" fill="#fed7aa" />
      <!-- Determination headband -->
      <path d="M -13 -3 C 0 -7 12 -3 12 -3 L 14 2 C 0 -2 -14 2 -14 2 Z" fill="#f59e0b" />
      <!-- Streaming headband tails -->
      <path d="M 12 -1 C 22 2 32 -2 38 -8" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
      <!-- Focused Eyes (Determined slant) -->
      <path d="M 2 -1 L 8 1" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <!-- Determined Mouth/Jaw -->
      <path d="M 4 8 L 9 7" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Front Arm (Pumping forward with vigor) -->
    <path d="M 115 102 L 140 108 L 150 92" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Hand clenched -->
    <circle cx="152" cy="89" r="4.5" fill="#fed7aa" />
  </g>

  <!-- Foreground Particle Effects / Sparks of overcoming limits -->
  <g fill="#fbbf24">
    <circle cx="170" cy="95" r="3" filter="url(#glow)" />
    <circle cx="185" cy="125" r="2" opacity="0.8" />
    <circle cx="155" cy="50" r="2.5" filter="url(#glow)" />
    <circle cx="65" cy="85" r="1.5" opacity="0.6" />
    <circle cx="45" cy="130" r="2" filter="url(#glow)" />
    <circle cx="205" cy="175" r="1.5" opacity="0.9" />
  </g>

  <!-- Finishing touch: Ambient vignette shadow corners for clean vector frame depth -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>