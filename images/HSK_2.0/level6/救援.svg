<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Debris and Ground -->
  <path d="M0 240 L240 240 L240 180 L180 190 L120 170 L60 190 L0 180 Z" fill="#334155"/>
  <circle cx="180" cy="200" r="15" fill="#475569"/>
  <rect x="40" y="210" width="30" height="10" rx="2" fill="#475569"/>
  
  <!-- Rescue Vehicle (Back) -->
  <rect x="160" y="130" width="60" height="50" rx="4" fill="#fb923c"/>
  <rect x="170" y="140" width="40" height="20" rx="2" fill="#0f172a"/>
  <circle cx="175" cy="180" r="8" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  <circle cx="205" cy="180" r="8" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Emergency Light -->
  <rect x="185" y="120" width="10" height="10" fill="#ef4444"/>
  
  <!-- Rescue Team Member 1 (Running) -->
  <g transform="translate(80, 140)">
    <circle cx="10" cy="10" r="10" fill="#fde68a"/>
    <path d="M0 30 L20 30 L15 70 L5 70 Z" fill="#38bdf8"/>
    <path d="M5 35 L-10 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 35 L30 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Rescue Team Member 2 (Helping/Lifting) -->
  <g transform="translate(120, 150)">
    <circle cx="10" cy="10" r="10" fill="#fde68a"/>
    <path d="M0 30 L20 30 L15 70 L5 70 Z" fill="#10b981"/>
    <path d="M20 40 L40 30" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person being rescued -->
  <g transform="translate(40, 160)">
    <circle cx="10" cy="10" r="8" fill="#fde68a"/>
    <rect x="5" y="20" width="10" height="30" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Light Beam/Action Effect -->
  <path d="M160 130 L100 100 L120 150" fill="#fbbf24" opacity="0.3"/>
</svg>