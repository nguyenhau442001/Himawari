<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow or grid accent -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.6"/>

  <!-- Conceptual Vector Illustration: Scales of Justice (representing lawsuit / legal proceedings "诉讼") -->
  <!-- Central Pillar & Base -->
  <g fill="#94A3B8">
    <!-- Base platform -->
    <path d="M 95 185 L 145 185 L 155 195 L 85 195 Z" fill="#64748B"/>
    <!-- Vertical stand -->
    <rect x="114" y="75" width="12" height="115" rx="3" fill="#94A3B8"/>
    <!-- Top decorative finial / cap -->
    <circle cx="120" cy="70" r="8" fill="#F59E0B"/>
  </g>

  <!-- Balance Beam -->
  <g>
    <!-- Main horizontal arm -->
    <rect x="70" y="75" width="100" height="6" rx="3" fill="#F59E0B"/>
    <!-- Center pivot joint -->
    <circle cx="120" cy="78" rx="6" ry="6" fill="#D97706"/>
  </g>

  <!-- Left Scale Pan -->
  <g>
    <!-- Chains/Strings -->
    <line x1="75" y1="81" x2="65" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="81" x2="105" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pan Dish -->
    <path d="M 55 135 Q 85 155 115 135 Z" fill="#38BDF8" opacity="0.9"/>
    <!-- Legal Document / Folder inside left pan (representing the case file) -->
    <path d="M 72 125 L 98 125 L 98 138 L 72 138 Z" fill="#F8FAFC" rx="1"/>
    <line x1="77" y1="129" x2="93" y2="129" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="77" y1="133" x2="88" y2="133" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Right Scale Pan (Slightly lower to indicate weighing/judgment) -->
  <g transform="translate(0, 10)">
    <!-- Chains/Strings -->
    <line x1="145" y1="81" x2="135" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="165" y1="81" x2="175" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pan Dish -->
    <path d="M 125 135 Q 155 155 185 135 Z" fill="#38BDF8" opacity="0.9"/>
    <!-- Gavel head resting in right pan -->
    <rect x="140" y="122" width="30" height="14" rx="3" fill="#F59E0B"/>
    <rect x="150" y="116" width="10" height="6" rx="1" fill="#D97706"/>
  </g>

  <!-- Highlight accents -->
  <circle cx="120" cy="78" r="3" fill="#FEF3C7"/>
</svg>