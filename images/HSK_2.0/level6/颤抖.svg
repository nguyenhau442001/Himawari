<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#334155"/>
  <rect x="50" y="175" width="10" height="65" fill="#1e293b"/>
  <rect x="180" y="175" width="10" height="65" fill="#1e293b"/>
  
  <!-- Coffee Cup -->
  <path d="M160 135h30l-5 25h-20z" fill="#fb923c"/>
  <circle cx="175" cy="135" r="15" fill="none" stroke="#fb923c" stroke-width="3"/>
  
  <!-- Character Upper Body -->
  <path d="M80 100c0-30 40-30 40 0v40H80z" fill="#cbd5e1"/>
  <circle cx="100" cy="70" r="25" fill="#fde68a"/>
  
  <!-- Shaking Hands -->
  <g id="hands">
    <path d="M85 145c-5-10 0-20 10-20" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M115 145c5-10 0-20-10-20" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Motion lines -->
    <path d="M80 130l-5-10M125 130l5-10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Face Details -->
  <circle cx="90" cy="65" r="3" fill="#0f172a"/>
  <circle cx="110" cy="65" r="3" fill="#0f172a"/>
  <path d="M92 85c8-5 16-5 24 0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Environment -->
  <circle cx="200" cy="50" r="30" fill="#fbbf24" opacity="0.1"/>
  <rect x="60" y="100" width="80" height="5" rx="2" fill="#38bdf8" opacity="0.3"/>
</svg>