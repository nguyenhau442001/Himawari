<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Environment -->
  <rect x="20" y="120" width="200" height="80" rx="4" fill="#334155"/>
  <rect x="30" y="130" width="180" height="60" rx="2" fill="#1e293b"/>
  
  <!-- The Subject (The one plotting) -->
  <g transform="translate(40, 60)">
    <circle cx="30" cy="30" r="20" fill="#fb923c"/>
    <path d="M15 60 Q30 40 45 60 L45 100 L15 100 Z" fill="#38bdf8"/>
    <path d="M20 65 L10 85" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 65 L50 85" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="25" r="3" fill="#0f172a"/>
    <circle cx="38" cy="25" r="3" fill="#0f172a"/>
    <path d="M25 35 Q30 38 35 35" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- The Target (The one being plotted against) -->
  <g transform="translate(140, 80)">
    <circle cx="30" cy="30" r="15" fill="#94a3b8"/>
    <path d="M20 55 L20 90 M40 55 L40 90" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="25" cy="25" r="2" fill="#0f172a"/>
    <circle cx="35" cy="25" r="2" fill="#0f172a"/>
  </g>
  
  <!-- The Plotting Element (The "Opportunity") -->
  <g transform="translate(80, 140)">
    <path d="M0 0 L40 0 L30 20 L10 20 Z" fill="#f59e0b"/>
    <rect x="15" y="5" width="10" height="10" rx="1" fill="#0f172a"/>
  </g>
  
  <!-- Visual Narrative: The "Looking" Action -->
  <path d="M65 80 Q100 60 135 85" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="135" cy="85" r="4" fill="#ec4899"/>
</svg>