<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78350f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ground -->
  <path d="M0 200 Q120 190 240 200 L240 240 L0 240 Z" fill="#1e293b"/>
  
  <!-- The Plant (The Focus: Thick Stem) -->
  <!-- Roots/Base -->
  <path d="M140 205 Q160 210 180 205" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- The Thick Stem (茎) -->
  <path d="M145 205 L148 80 Q160 75 172 80 L175 205 Z" fill="url(#stem-grad)"/>
  <!-- Texture on stem to show strength/thickness -->
  <path d="M152 180 L152 140 M160 190 L160 110 M168 170 L168 130" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Large Leaves -->
  <path d="M148 90 Q110 70 90 100 Q110 110 148 105" fill="#059669"/>
  <path d="M172 95 Q210 80 220 115 Q190 130 172 110" fill="#10b981"/>
  <path d="M160 80 Q160 30 190 20 Q200 50 165 75" fill="#059669"/>
  <path d="M155 85 Q130 40 100 45 Q120 75 150 85" fill="#10b981"/>

  <!-- Character (Gardener/Observer) -->
  <!-- Body -->
  <path d="M60 205 L55 160 Q55 145 70 140 L85 140 Q100 145 100 160 L95 205" fill="#f59e0b"/>
  <!-- Head -->
  <circle cx="77" cy="125" r="12" fill="#fef3c7"/>
  <!-- Hair -->
  <path d="M65 125 Q65 110 77 110 Q89 110 89 125 L92 130 Q77 135 62 130 Z" fill="#451a03"/>
  <!-- Arms gesturing to the stem's thickness -->
  <path d="M70 155 Q110 155 135 170" stroke="#fef3c7" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M70 165 Q110 175 135 190" stroke="#fef3c7" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Context Props -->
  <!-- Watering Can -->
  <path d="M20 205 L45 205 L45 185 L25 185 Z" fill="#38bdf8"/>
  <path d="M45 190 L55 180" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M25 185 Q15 185 15 195 Q15 205 25 205" stroke="#38bdf8" stroke-width="2" fill="none"/>
  
  <!-- Small Potted Plant in background -->
  <rect x="190" y="185" width="20" height="20" fill="#78350f"/>
  <path d="M195 185 Q190 170 200 165 Q210 170 205 185" fill="#10b981"/>

  <!-- Light Accents -->
  <circle cx="200" cy="50" r="40" fill="#fbbf24" opacity="0.05"/>
  <circle cx="200" cy="50" r="20" fill="#fbbf24" opacity="0.05"/>
</svg>