<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative concentric subtle rings representing legacy/time -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A313C" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#2A313C" stroke-width="1.5" opacity="0.8"/>

  <!-- Central Visual Representation: 3 overlapping stylized figures in a ascending generational chain -->
  <!-- Generation 1 (Grandparent - Left/Bottom) -->
  <g transform="translate(68, 110)">
    <!-- Body/Shoulders -->
    <path d="M 0 50 C 0 32, 14 26, 26 26 C 38 26, 52 32, 52 50 Z" fill="#3A4454"/>
    <!-- Head -->
    <circle cx="26" cy="12" r="10" fill="#E6A15C"/>
    <!-- Medical Head Mirror / Accent -->
    <path d="M 17 8 C 21 5, 25 5, 29 8" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="23" cy="6" r="3" fill="#F8FAFC"/>
  </g>

  <!-- Generation 2 (Parent - Right/Middle) -->
  <g transform="translate(120, 95)">
    <!-- Body/Shoulders -->
    <path d="M 0 55 C 0 35, 16 30, 30 30 C 44 30, 60 35, 60 55 Z" fill="#475569"/>
    <!-- Head -->
    <circle cx="30" cy="13" r="11" fill="#F3B068"/>
    <!-- Medical Head Mirror / Accent -->
    <path d="M 20 9 C 25 6, 30 6, 35 9" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="27.5" cy="7" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Generation 3 (Child/Current - Center/Foreground, highlighted with Gold accent for focus) -->
  <g transform="translate(87, 75)">
    <!-- Body/Shoulders -->
    <path d="M 0 65 C 0 40, 18 34, 33 34 C 48 34, 66 40, 66 65 Z" fill="#D97706"/>
    <!-- Head -->
    <circle cx="33" cy="14" r="12" fill="#FBD38D"/>
    <!-- Medical Head Mirror / Accent (Gold theme) -->
    <path d="M 22 10 C 27 7, 33 7, 38 10" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="8" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Connecting upward lineage flow line/pulse -->
  <path d="M 94 110 L 115 100 L 138 90" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="94" cy="110" r="4" fill="#F59E0B"/>
  <circle cx="115" cy="100" r="4" fill="#F59E0B"/>
  <circle cx="138" cy="90" r="5" fill="#F59E0B"/>

  <!-- Medical Cross Symbol floating above, anchoring the "doctor family" context -->
  <g transform="translate(108, 25)">
    <rect x="0" y="8" width="24" height="8" rx="2" fill="#F59E0B"/>
    <rect x="8" y="0" width="8" height="24" rx="2" fill="#F59E0B"/>
  </g>
</svg>