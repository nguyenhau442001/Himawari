<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="urgentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Cozy Modern Office / Room Interior -->
  <!-- Window with city night silhouette and warm urgent sky/amber glow -->
  <path d="M150 30 L210 30 L210 110 L150 110 Z" fill="#0b0f19" />
  <path d="M152 32 L208 32 L208 108 L152 108 Z" fill="url(#windowGlow)" />
  <path d="M180 32 L180 108" stroke="#0f172a" stroke-width="2" />
  <path d="M152 70 L208 70" stroke="#0f172a" stroke-width="2" />
  <!-- Cityscape silhouettes outside -->
  <path d="M155 108 L155 85 L165 85 L165 108 L175 108 L175 75 L185 75 L185 108 L195 108 L195 90 L205 90 L205 108 Z" fill="#1e293b" />

  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="45" width="35" height="75" rx="4" fill="#334155" />
  <rect x="30" y="60" width="25" height="4" rx="2" fill="#64748b" />
  <rect x="30" y="75" width="25" height="4" rx="2" fill="#f59e0b" />
  <rect x="30" y="90" width="25" height="4" rx="2" fill="#38bdf8" />

  <!-- Desk Surface -->
  <path d="M15 175 L225 175 L210 215 L30 215 Z" fill="#334155" />
  <path d="M15 175 L225 175 L225 182 L15 182 Z" fill="#475569" />

  <!-- Laptop on Desk -->
  <!-- Laptop Base -->
  <path d="M75 175 L165 175 L178 158 L62 158 Z" fill="#94a3b8" />
  <path d="M100 175 L140 175 L137 158 L103 158 Z" fill="#cbd5e1" /> <!-- trackpad area -->
  <!-- Laptop Screen Lid -->
  <path d="M65 160 L175 160 L170 100 L70 100 Z" fill="#475569" />
  <!-- Screen Display -->
  <path d="M73 155 L167 155 L163 105 L77 105 Z" fill="url(#screenGlow)" />
  <!-- Message UI lines on screen (representing waiting for reply) -->
  <rect x="85" y="115" width="45" height="8" rx="4" fill="#e0f2fe" opacity="0.8"/>
  <rect x="85" y="128" width="60" height="6" rx="3" fill="#bae6fd" opacity="0.6"/>
  <rect x="85" y="140" width="30" height="6" rx="3" fill="#bae6fd" opacity="0.6"/>

  <!-- Urgency / "As soon as possible" Indicator (Floating glowing clock / action icon) -->
  <circle cx="120" cy="80" r="14" fill="#f59e0b" />
  <circle cx="120" cy="80" r="11" fill="#1e293b" />
  <path d="M120 73 L120 80 L125 83" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 70 Q110 60 130 65" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" fill="none" />

  <!-- CHARACTER: Person anxiously waiting or typing a prompt reply -->
  <!-- Body / Torso -->
  <path d="M90 220 L95 170 C95 160 105 155 120 155 C135 155 145 160 145 170 L150 220 Z" fill="#ec4899" />
  <!-- Collar / Shirt detail -->
  <path d="M110 155 L120 168 L130 155 Z" fill="#fdf2f8" />

  <!-- Neck -->
  <rect x="112" y="140" width="16" height="20" fill="#fbcfe8" />

  <!-- Head -->
  <circle cx="120" cy="118" r="22" fill="#fbcfe8" />
  
  <!-- Hair (Stylish modern haircut) -->
  <path d="M98 115 C98 98 142 98 142 115 C142 122 138 115 135 110 C125 102 115 102 105 110 C101 115 98 112 98 115 Z" fill="#0f172a" />

  <!-- Expressive Face (Anxious / Eager expression) -->
  <!-- Eyebrows slightly angled -->
  <path d="M108 112 L115 115" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <path d="M125 115 L132 112" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes (Big, attentive) -->
  <circle cx="112" cy="120" r="2.5" fill="#0f172a" />
  <circle cx="128" cy="120" r="2.5" fill="#0f172a" />
  <!-- Mouth (Determined / Focused small curve) -->
  <path d="M116 130 Q120 133 124 130" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Rosy cheeks -->
  <circle cx="107" cy="125" r="3" fill="#fda4af" opacity="0.6" />
  <circle cx="133" cy="125" r="3" fill="#fda4af" opacity="0.6" />

  <!-- Arms reaching forward to type/respond -->
  <!-- Left arm -->
  <path d="M95 175 C80 175 75 160 85 150" stroke="#ec4899" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Right arm -->
  <path d="M145 175 C160 175 165 160 155 150" stroke="#ec4899" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Hands -->
  <circle cx="85" cy="148" r="5" fill="#fbcfe8" />
  <circle cx="155" cy="148" r="5" fill="#fbcfe8" />

  <!-- Additional props: Coffee mug on desk for long working hours -->
  <rect x="185" y="155" width="16" height="20" rx="3" fill="#10b981" />
  <path d="M201 160 C207 160 207 170 201 172" stroke="#10b981" stroke-width="3" fill="none" />
  <!-- Steam rising from coffee -->
  <path d="M190 148 Q193 142 190 136" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Subtle light accent rim on top edge -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>