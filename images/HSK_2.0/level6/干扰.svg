<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- TV Screen Glitch Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Static Pattern -->
    <pattern id="staticNoise" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#38bdf8" opacity="0.3"/>
      <rect x="2" y="0" width="2" height="2" fill="#ec4899" opacity="0.3"/>
      <rect x="0" y="2" width="2" height="2" fill="#f59e0b" opacity="0.3"/>
      <rect x="2" y="2" width="2" height="2" fill="#f8fafc" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Floor Line -->
  <path d="M0 195 L240 195" stroke="#334155" stroke-width="2"/>
  <path d="M0 196 L240 196 L240 240 L0 240 Z" fill="#0b1329"/>

  <!-- Storm Window (Context: Rainy storm causing bad signal) -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="36" height="48" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <line x1="18" y1="0" x2="18" y2="48" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="24" x2="36" y2="24" stroke="#334155" stroke-width="1.5"/>
    <!-- Rain streaks -->
    <path d="M6 8 L2 16 M22 6 L18 14 M10 28 L6 36 M28 26 L24 34" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <!-- Cloud & Lightning -->
    <path d="M8 12 Q12 8 18 11 Q22 8 26 12 Q28 15 24 17 Z" fill="#334155" opacity="0.8"/>
    <path d="M16 14 L12 20 L15 20 L11 26" stroke="#fbbf24" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Floor Lamp (Left Ambient Light) -->
  <circle cx="20" cy="120" r="35" fill="url(#lampGlow)"/>
  <path d="M12 195 L18 100 L22 100 L28 195" fill="#334155"/>
  <path d="M12 100 L28 100 L24 85 L16 85 Z" fill="#f59e0b"/>

  <!-- Rug -->
  <ellipse cx="115" cy="202" rx="75" ry="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- TV Stand -->
  <rect x="145" y="150" width="70" height="35" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="153" y="160" width="22" height="15" rx="2" fill="#0f172a"/>
  <rect x="180" y="160" width="22" height="15" rx="2" fill="#0f172a"/>
  <line x1="155" y1="185" x2="152" y2="195" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="205" y1="185" x2="208" y2="195" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- TV Glitch Ambient Ambient Glow -->
  <circle cx="180" cy="115" r="50" fill="url(#screenGlow)"/>

  <!-- TV Set -->
  <rect x="138" y="80" width="84" height="65" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2.5"/>
  <!-- TV Legs/Base -->
  <path d="M172 145 L188 145 L185 150 L175 150 Z" fill="#334155"/>

  <!-- TV SCREEN (SIGNAL INTERFERENCE / 干扰) -->
  <rect x="143" y="85" width="74" height="55" rx="3" fill="#090d16"/>
  <!-- Base Static Noise -->
  <rect x="143" y="85" width="74" height="55" rx="3" fill="url(#staticNoise)"/>

  <!-- Distorted Glitch Color Bars (Interference visual) -->
  <g opacity="0.85">
    <!-- Offset, broken color bands -->
    <path d="M143 88 H175 V95 H143 Z" fill="#ec4899"/>
    <path d="M180 86 H217 V93 H180 Z" fill="#38bdf8"/>
    
    <path d="M143 102 H165 V110 H143 Z" fill="#38bdf8"/>
    <path d="M160 104 H200 V108 H160 Z" fill="#f59e0b"/>
    <path d="M195 101 H217 V112 H195 Z" fill="#10b981"/>

    <path d="M143 120 H185 V126 H143 Z" fill="#ec4899"/>
    <path d="M190 118 H217 V128 H190 Z" fill="#38bdf8"/>
  </g>

  <!-- Glitch Jagged Lines across screen -->
  <path d="M143 96 L160 96 L165 99 L185 93 L195 98 L217 95" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9"/>
  <path d="M143 115 L155 113 L162 118 L180 112 L200 116 L217 113" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9"/>
  <path d="M143 129 L170 129 L175 132 L217 128" stroke="#38bdf8" stroke-width="1.2" fill="none"/>

  <!-- Disrupted / No Signal Icon Graphic on Screen -->
  <g transform="translate(180, 112)">
    <!-- Diagonal Slash / Warning -->
    <circle cx="0" cy="0" r="10" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.9"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#ef4444" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Antenna & Radio Interference Waves -->
  <!-- Antenna Base -->
  <path d="M176 80 L184 80 L182 74 L178 74 Z" fill="#64748b"/>
  <!-- Left Antenna Rod -->
  <line x1="178" y1="74" x2="155" y2="45" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="155" cy="45" r="2" fill="#38bdf8"/>
  <!-- Right Antenna Rod -->
  <line x1="182" y1="74" x2="208" y2="42" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="208" cy="42" r="2" fill="#ec4899"/>

  <!-- Sparks / Dynamic Interference Waves around Antennas (干扰) -->
  <path d="M148 42 L152 46 L146 50 L154 54" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M212 38 L218 42 L210 46 L216 50" stroke="#ec4899" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Electromagnetic Interference Arcs -->
  <path d="M165 35 A 15 15 0 0 1 195 33" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
  <path d="M158 28 A 25 25 0 0 1 205 25" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- CHARACTER (Frustrated viewer experiencing signal disturbance) -->
  <g transform="translate(45, 105)">
    <!-- Armchair -->
    <path d="M0 40 C0 25 10 20 25 20 C35 20 40 10 50 10 C60 10 65 25 65 40 L65 75 L0 75 Z" fill="#1e293b"/>
    <path d="M-5 45 C-5 35 3 32 10 32 L15 75 L-5 75 Z" fill="#334155"/> <!-- Left Armrest -->
    <path d="M48 42 C48 35 55 35 62 38 L58 75 L45 75 Z" fill="#334155"/> <!-- Right Armrest -->
    <rect x="5" y="60" width="50" height="18" rx="4" fill="#334155"/> <!-- Cushion -->

    <!-- Legs -->
    <path d="M20 70 L22 90 L12 90" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M38 70 L42 88 L52 90" stroke="#1e40af" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Shoes -->
    <ellipse cx="10" cy="91" rx="6" ry="3" fill="#f8fafc"/>
    <ellipse cx="54" cy="91" rx="6" ry="3" fill="#f8fafc"/>

    <!-- Body / Torso (Leaning forward in confusion) -->
    <path d="M18 35 C18 28 28 25 38 28 C45 30 48 40 45 58 L22 58 Z" fill="#fb923c"/>

    <!-- Left Arm (Hand scratching head in confusion) -->
    <path d="M22 32 C12 28 8 18 16 10 C20 6 24 10 24 14" stroke="#fdba74" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="28" cy="16" r="10" fill="#fdba74"/>
    <!-- Hair -->
    <path d="M20 16 C18 8 26 4 32 6 C36 8 38 14 36 18 C32 14 26 14 20 16 Z" fill="#0f172a"/>

    <!-- Face details (Confused / Annoyed Expression) -->
    <!-- Furrowed Eyebrow -->
    <path d="M29 12 L35 14" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Eye (squinting/puzzled) -->
    <circle cx="32" cy="16" r="1.2" fill="#0f172a"/>
    <!-- Mouth (open 'puzzled' O shape) -->
    <ellipse cx="34" cy="20" rx="1.5" ry="2" fill="#0f172a"/>

    <!-- Right Arm (Holding Remote Control pointing at TV) -->
    <path d="M40 36 L56 38 L68 35" stroke="#fdba74" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Remote Control -->
    <rect x="67" y="31" width="12" height="6" rx="1" fill="#0f172a" transform="rotate(-10 67 31)"/>
    <!-- Infrared / Signal Rays from Remote getting blocked/distorted -->
    <path d="M80 28 L86 26 M81 31 L88 31 M80 34 L86 36" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Distorted Signal Ray Visual (Connecting remote/space to TV) -->
  <g opacity="0.7">
    <path d="M128 138 L134 135 L131 142 L138 139" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Question mark / Confusion symbol floating -->
    <path d="M98 90 C98 86 103 84 105 87 C106 89 103 91 103 94" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="103" cy="98" r="1" fill="#fbbf24"/>
  </g>
</svg>