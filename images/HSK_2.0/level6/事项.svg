<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Accent for Tech/Modern Flat Style -->
  <g opacity="0.15">
    <line x1="40" y1="60" x2="200" y2="60" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="40" y1="120" x2="200" y2="120" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="40" y1="180" x2="200" y2="180" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Physical Object: The Checklist Clipboard / Itemized List (Representing 事项 - items/clauses/matters) -->
  <g transform="translate(0, 0)">
    <!-- Clipboard Base (Slate/Grey) -->
    <rect x="70" y="45" width="100" height="150" rx="12" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Paper Sheet (White/Light Slate with Flat shading) -->
    <rect x="82" y="65" width="76" height="120" rx="6" fill="#F7FAFC"/>

    <!-- Top Metal Clip -->
    <path d="M 95 45 L 95 40 C 95 37.7909 96.7909 36 99 36 L 141 36 C 143.209 36 145 37.7909 145 40 L 145 45 Z" fill="#E2E8F0"/>
    <rect x="102" y="41" width="36" height="8" rx="2" fill="#CBD5E0"/>

    <!-- Item 1: Checked Item (Focus Accent - Gold/Orange) -->
    <g transform="translate(94, 83)">
      <circle cx="8" cy="8" r="7" fill="#F59E0B"/>
      <!-- Checkmark -->
      <path d="M 5 8 L 7.5 10.5 L 11.5 5.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text Line Placeholder -->
      <rect x="22" y="5" width="40" height="6" rx="3" fill="#CBD5E0"/>
    </g>

    <!-- Item 2: Unchecked/Notice Item -->
    <g transform="translate(94, 115)">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#64748B" stroke-width="2"/>
      <!-- Text Line Placeholder -->
      <rect x="22" y="5" width="32" height="6" rx="3" fill="#E2E8F0"/>
    </g>

    <!-- Item 3: Unchecked/Notice Item -->
    <g transform="translate(94, 147)">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#64748B" stroke-width="2"/>
      <!-- Text Line Placeholder -->
      <rect x="22" y="5" width="36" height="6" rx="3" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- Attention / Notice Indicator (Floating Exclamation / Focus Badge) -->
  <g transform="translate(165, 35)">
    <circle cx="16" cy="16" r="16" fill="#F59E0B" stroke="#1A1D24" stroke-width="3"/>
    <path d="M 16 9 L 16 17 M 16 21 L 16 23" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>