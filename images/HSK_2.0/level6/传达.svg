<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Office/Meeting Space -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 (Speaker) Gradient -->
    <linearGradient id="speakerShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Message / Broadcast Wave Glow -->
    <linearGradient id="msgWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT / CONTEXT PROPS -->
  <!-- Back Wall Decor & Windows -->
  <rect x="30" y="40" width="180" height="90" rx="6" fill="#141c2e" stroke="#334155" stroke-width="1.5"/>
  <!-- Office Window View (Night City Silhouette) -->
  <path d="M45 55 h50 v65 h-50 z" fill="#090d16"/>
  <rect x="52" y="65" width="8" height="12" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="65" y="80" width="8" height="25" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="78" y="70" width="10" height="15" rx="1" fill="#f59e0b" opacity="0.8"/>
  <path d="M105 55 h90 v65 h-90 z" fill="#090d16"/>
  <rect x="115" y="75" width="12" height="18" rx="1" fill="#38bdf8" opacity="0.5"/>
  <rect x="132" y="65" width="10" height="35" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="150" y="85" width="15" height="15" rx="1" fill="#10b981" opacity="0.4"/>
  <rect x="175" y="70" width="12" height="20" rx="1" fill="#f59e0b" opacity="0.6"/>

  <!-- Indoor Plant (Left) -->
  <path d="M25 155 c0 -15 15 -15 15 0 z" fill="#059669"/>
  <path d="M32 155 c-10 -10 -5 -25 5 -20 z" fill="#10b981"/>
  <path d="M32 155 c10 -10 5 -25 -5 -20 z" fill="#34d399"/>
  <rect x="24" y="155" width="16" height="20" rx="3" fill="#cbd5e1"/>

  <!-- Meeting Table -->
  <path d="M20 185 L220 185 L205 215 L35 215 Z" fill="#334155" filter="url(#softShadow)"/>
  <path d="M25 185 L215 185 L215 190 L25 190 Z" fill="#475569"/>

  <!-- Table Props: Laptops, Notebook, Coffee Mug -->
  <!-- Laptop 1 (Left Listener) -->
  <path d="M55 180 l15 -10 h20 l-15 10 z" fill="#64748b"/>
  <path d="M68 170 h18 v12 h-18 z" fill="#94a3b8"/>
  <!-- Notebook & Pen (Center) -->
  <rect x="95" y="180" width="22" height="16" rx="2" fill="#e2e8f0"/>
  <line x1="99" y1="184" x2="113" y2="184" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="99" y1="189" x2="110" y2="189" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Coffee Mug -->
  <rect x="175" y="172" width="12" height="14" rx="2" fill="#ec4899"/>
  <path d="M187 175 c3 0 3 6 0 6" fill="none" stroke="#ec4899" stroke-width="2"/>


  <!-- THE MESSAGE / BROADCAST VISUALIZATION (传达 - transmission arc) -->
  <g filter="url(#softShadow)">
    <!-- Expanding sound/message waves from speaker toward the team -->
    <path d="M95 92 Q 120 75 145 100" fill="none" stroke="url(#msgWave)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M102 85 Q 130 65 158 95" fill="none" stroke="url(#msgWave)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M109 78 Q 140 55 171 90" fill="none" stroke="url(#msgWave)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Floating abstract communication particles/nodes -->
    <circle cx="120" cy="80" r="3" fill="#fbbf24"/>
    <circle cx="138" cy="70" r="2" fill="#38bdf8"/>
    <circle cx="152" cy="85" r="3.5" fill="#10b981"/>
  </g>


  <!-- CHARACTERS -->

  <!-- LISTENER 1 (Left) -->
  <g transform="translate(30, 115)">
    <!-- Body / Torso -->
    <path d="M20 50 c0 -15 10 -25 25 -25 c15 0 25 10 25 25 v25 h-50 z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="45" cy="18" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M31 16 c2 -10 12 -12 24 -8 c4 2 8 8 8 8 c-5 -5 -15 -6 -22 -3 c-6 3 -8 3 -10 3 z" fill="#334155"/>
    <!-- Face Profile / Expression (Attentive listening) -->
    <circle cx="53" cy="18" r="1.5" fill="#1e293b"/>
    <path d="M54 23 q2 2 4 1" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm leaning on table -->
    <path d="M25 45 l15 15 l15 -5" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="55" cy="55" r="5" fill="#fcd34d"/>
  </g>

  <!-- LISTENER 2 (Right Background) -->
  <g transform="translate(145, 115)">
    <!-- Body / Torso -->
    <path d="M20 50 c0 -15 10 -25 25 -25 c15 0 25 10 25 25 v25 h-50 z" fill="#8b5cf6"/>
    <!-- Head -->
    <circle cx="45" cy="18" r="14" fill="#fbcfe8"/>
    <!-- Hair (Ponytail) -->
    <path d="M31 16 c0 -8 8 -12 18 -10 c6 1 10 5 10 5 c-2 -4 -8 -8 -15 -8 c-8 0 -13 4 -13 13 z" fill="#475569"/>
    <circle cx="58" cy="14" r="4" fill="#475569"/>
    <!-- Face -->
    <circle cx="37" cy="18" r="1.5" fill="#1e293b"/>
    <!-- Arm/Hand taking notes -->
    <path d="M55 45 l-10 15 l-15 -5" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="55" r="5" fill="#fbcfe8"/>
  </g>

  <!-- MAIN SPEAKER (Center-Left, Actively Conveying Message) -->
  <g transform="translate(72, 95)" filter="url(#softShadow)">
    <!-- Dynamic Torso turning toward group -->
    <path d="M15 65 c0 -18 10 -30 25 -30 c15 0 25 12 25 30 v30 h-50 z" fill="url(#speakerShirt)"/>
    
    <!-- Raised Communicating Arm (Conveying gesture) -->
    <path d="M38 45 q 25 -10 32 -25" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand gesturing outward -->
    <circle cx="72" cy="18" r="6" fill="#fcd34d"/>
    <!-- Supporting Arm -->
    <path d="M25 50 l-12 20" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round"/>
    <circle cx="12" cy="73" r="5.5" fill="#fcd34d"/>

    <!-- Head & Expressive Face -->
    <circle cx="40" cy="16" r="16" fill="#fcd34d"/>
    <!-- Stylish Hair -->
    <path d="M24 14 c2 -12 12 -16 26 -12 c7 2 12 8 12 8 c-4 -6 -12 -10 -20 -10 c-10 0 -16 5 -18 14 z" fill="#1e293b"/>
    
    <!-- Facial Features: Enthusiastic / Explaining -->
    <!-- Eyes (Focused and bright) -->
    <circle cx="45" cy="15" r="2" fill="#1e293b"/>
    <!-- Open Mouth (Speaking / Delivering message) -->
    <path d="M44 23 c3 0 5 3 2 5 c-2 2 -4 0 -2 -5 z" fill="#be123c"/>
    <!-- Eyebrows raised dynamically -->
    <path d="M42 10 q3 -3 6 0" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND LIGHTING & POLISH ACCENTS -->
  <circle cx="100" cy="30" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="40" cy="90" r="1.5" fill="#38bdf8" opacity="0.3"/>
  <circle cx="210" cy="60" r="1" fill="#f59e0b" opacity="0.4"/>
</svg>