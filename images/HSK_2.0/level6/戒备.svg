<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <path d="M0 180 L240 180 L240 216 C240 229.255 229.255 240 216 240 L24 240 C10.745 240 0 229.255 0 216 Z" fill="#1e293b"/>
  
  <!-- Street Lamp -->
  <rect x="200" y="40" width="4" height="140" fill="#334155"/>
  <path d="M190 40 Q202 30 214 40" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="202" cy="45" r="8" fill="#fbbf24" opacity="0.2"/>
  <circle cx="202" cy="45" r="4" fill="#fef3c7"/>
  <path d="M202 45 L140 180 L240 180 L202 45" fill="url(#lampGlow)" opacity="0.3"/>
  
  <!-- Police Car (Simplified/Stylized) -->
  <g transform="translate(10, 145)">
    <path d="M0 25 Q0 15 10 15 L50 15 Q60 15 60 25 L60 35 L0 35 Z" fill="#f8fafc"/>
    <path d="M5 15 L15 5 L40 5 L50 15 Z" fill="#38bdf8" opacity="0.6"/>
    <rect x="20" y="0" width="15" height="5" rx="1" fill="#ef4444"/>
    <rect x="35" y="0" width="15" height="5" rx="1" fill="#3b82f6"/>
    <!-- Flashing Light Glows -->
    <circle cx="27" cy="2" r="10" fill="#ef4444" opacity="0.2"/>
    <circle cx="42" cy="2" r="10" fill="#3b82f6" opacity="0.2"/>
    <circle cx="10" cy="30" r="3" fill="#fef3c7"/>
  </g>

  <!-- Security Barrier -->
  <g transform="translate(80, 175)">
    <rect x="0" y="0" width="120" height="8" rx="2" fill="#f59e0b"/>
    <path d="M10 0 L25 8 M35 0 L50 8 M60 0 L75 8 M85 0 L100 8 M110 0 L120 5" stroke="#1e293b" stroke-width="4"/>
    <rect x="5" y="8" width="4" height="12" fill="#475569"/>
    <rect x="111" y="8" width="4" height="12" fill="#475569"/>
  </g>

  <!-- Police Officer 1 (Patrolling) -->
  <g transform="translate(140, 115)">
    <!-- Body -->
    <path d="M10 60 Q10 35 25 35 Q40 35 40 60 L40 75 L10 75 Z" fill="#1e3a8a"/>
    <!-- Head/Cap -->
    <circle cx="25" cy="25" r="10" fill="#fde047" opacity="0.2"/> <!-- Head glow -->
    <circle cx="25" cy="25" r="8" fill="#ffedd5"/>
    <path d="M15 20 Q25 12 35 20 L38 22 L12 22 Z" fill="#1e1b4b"/>
    <!-- Arms/Radio -->
    <path d="M12 45 Q5 45 5 55" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
    <rect x="2" y="52" width="4" height="8" rx="1" fill="#0f172a"/> <!-- Radio -->
    <!-- Legs -->
    <rect x="15" y="75" width="8" height="15" fill="#1e1b4b"/>
    <rect x="27" y="75" width="8" height="15" fill="#1e1b4b"/>
  </g>

  <!-- Police Officer 2 (Watching) -->
  <g transform="translate(85, 120)">
    <!-- Body -->
    <path d="M10 55 Q10 30 25 30 Q40 30 40 55 L40 70 L10 70 Z" fill="#1e3a8a"/>
    <!-- Head/Cap -->
    <circle cx="25" cy="20" r="8" fill="#ffedd5"/>
    <path d="M15 15 Q25 7 35 15 L38 17 L12 17 Z" fill="#1e1b4b"/>
    <!-- Flashlight Beam -->
    <path d="M12 45 L-20 60 L-15 80 L12 50 Z" fill="#fef3c7" opacity="0.2"/>
    <rect x="8" y="45" width="8" height="4" rx="1" fill="#475569" transform="rotate(-30 12 45)"/>
    <!-- Legs -->
    <rect x="15" y="70" width="8" height="15" fill="#1e1b4b"/>
    <rect x="27" y="70" width="8" height="15" fill="#1e1b4b"/>
  </g>

  <!-- Alert/Scanning Symbols -->
  <g opacity="0.6">
    <path d="M175 110 Q180 105 185 110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M172 105 Q180 98 188 105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Definitions -->
  <defs>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>