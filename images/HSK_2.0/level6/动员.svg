<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight for Official -->
    <radialGradient id="spotlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Relief Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall & Windows showing city dusk -->
  <rect x="20" y="25" width="200" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Backdrop Banner representing Community/Government Coordination -->
  <path d="M 60 25 L 180 25 L 170 85 L 70 85 Z" fill="#0284c7" opacity="0.2" />
  <circle cx="120" cy="55" r="18" fill="#38bdf8" opacity="0.3" />
  <path d="M 112 55 L 118 61 L 130 47" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Supplies Stack (Relief goods) -->
  <g transform="translate(165, 100)" filter="url(#shadow)">
    <!-- Box 1 -->
    <rect x="0" y="20" width="35" height="30" rx="3" fill="url(#boxGrad)" />
    <path d="M 0 32 L 35 32" stroke="#b45309" stroke-width="2" />
    <circle cx="17" cy="26" r="3" fill="#fef3c7" />
    <!-- Box 2 -->
    <rect x="5" y="-5" width="30" height="27" rx="3" fill="#ea580c" />
    <path d="M 5 7 L 35 7" stroke="#9a3412" stroke-width="2" />
    <!-- First-aid cross symbol on box -->
    <rect x="17" y="2" width="6" height="2" fill="#fff" />
    <rect x="19" y="0" width="2" height="6" fill="#fff" />
  </g>

  <!-- Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- CHARACTERS & SCENARIO -->

  <!-- CHARACTER 1: Government Official / Coordinator (Left, gesturing dynamically - "Mobilizing") -->
  <g id="official" transform="translate(15, 80)" filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="45" cy="90" rx="18" ry="6" fill="#0f172a" opacity="0.6" />
    
    <!-- Legs -->
    <rect x="36" y="60" width="8" height="30" rx="4" fill="#334155" />
    <rect x="48" y="60" width="8" height="30" rx="4" fill="#334155" />
    <!-- Shoes -->
    <path d="M 32 88 L 44 88 L 44 92 L 32 92 Z" fill="#0f172a" />
    <path d="M 48 88 L 60 88 L 60 92 L 48 92 Z" fill="#0f172a" />

    <!-- Torso (Formal Vest / Shirt) -->
    <path d="M 32 25 L 58 25 L 62 62 L 28 62 Z" fill="#f8fafc" />
    <!-- Official Blue Vest -->
    <path d="M 30 25 L 40 25 L 42 62 L 28 62 Z" fill="#0284c7" />
    <path d="M 50 25 L 60 25 L 62 62 L 48 62 Z" fill="#0284c7" />
    
    <!-- Head & Face -->
    <circle cx="45" cy="14" r="11" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 34 12 C 34 6, 40 4, 46 4 C 52 4, 56 8, 56 14 Z" fill="#1e293b" />
    <!-- Confident, inspiring expression -->
    <path d="M 47 16 Q 50 19 53 16" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

    <!-- Left Arm (Raised, pointing/calling to action) -->
    <path d="M 30 30 L 12 18" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <circle cx="10" cy="16" r="5" fill="#fcd34d" />

    <!-- Right Arm (Forward, holding clipboard) -->
    <path d="M 60 30 L 72 45" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <circle cx="73" cy="48" r="5" fill="#fcd34d" />

    <!-- Clipboard Prop -->
    <rect x="68" y="42" width="16" height="20" rx="2" fill="#cbd5e1" transform="rotate(15 76 52)" />
    <rect x="71" y="46" width="10" height="12" fill="#fff" transform="rotate(15 76 52)" />
  </g>

  <!-- CHARACTER 2: Citizen / Volunteer 1 (Center-Right, responsive, ready to help) -->
  <g id="volunteer1" transform="translate(100, 95)" filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="30" cy="75" rx="14" ry="5" fill="#0f172a" opacity="0.6" />

    <!-- Legs -->
    <rect x="22" y="45" width="7" height="30" rx="3.5" fill="#1e293b" />
    <rect x="31" y="45" width="7" height="30" rx="3.5" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="25" cy="74" rx="5" ry="3" fill="#38bdf8" />
    <ellipse cx="35" cy="74" rx="5" ry="3" fill="#38bdf8" />

    <!-- Torso (Active Volunteer Hoodie) -->
    <path d="M 18 15 L 42 15 L 45 50 L 15 50 Z" fill="#10b981" />
    <path d="M 23 15 L 37 15 L 35 30 L 25 30 Z" fill="#059669" /> <!-- Collar/Neck -->

    <!-- Head & Face -->
    <circle cx="30" cy="4" r="10" fill="#fcd34d" />
    <!-- Cap -->
    <path d="M 19 2 C 25 -2, 35 -2, 41 2 L 44 5 L 16 5 Z" fill="#059669" />
    <!-- Face expression: Eager / Nodding -->
    <circle cx="33" cy="6" r="1.5" fill="#1e293b" />
    <path d="M 31 10 Q 33 12 35 10" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms gesturing readiness -->
    <path d="M 18 20 L 5 32" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
    <circle cx="3" cy="34" r="4.5" fill="#fcd34d" />
    <path d="M 42 20 L 52 30" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
    <circle cx="54" cy="32" r="4.5" fill="#fcd34d" />
  </g>

  <!-- CHARACTER 3: Citizen / Volunteer 2 (Right, lifting/participating) -->
  <g id="volunteer2" transform="translate(145, 105)" filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="25" cy="65" rx="14" ry="5" fill="#0f172a" opacity="0.6" />

    <!-- Legs -->
    <rect x="17" y="38" width="7" height="27" rx="3.5" fill="#334155" />
    <rect x="27" y="38" width="7" height="27" rx="3.5" fill="#334155" />

    <!-- Torso (Orange Relief Volunteer Jacket) -->
    <path d="M 12 10 L 38 10 L 35 42 L 15 42 Z" fill="#fb923c" />

    <!-- Head -->
    <circle cx="25" cy="0" r="10" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 16 -3 C 18 -8, 32 -8, 34 -3 Z" fill="#78350f" />
    <!-- Expression -->
    <circle cx="27" cy="2" r="1.5" fill="#1e293b" />
    <path d="M 25 6 Q 27 8 29 6" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms holding a relief box -->
    <path d="M 15 18 L 5 25" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />
    <path d="M 35 18 L 42 24" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />

    <!-- Small relief box held in hands -->
    <rect x="-2" y="20" width="22" height="18" rx="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" />
    <path d="M -2 29 L 20 29" stroke="#6366f1" stroke-width="1.5" />
  </g>

  <!-- FOREGROUND ACCENTS / DYNAMIC ELEMENTS -->
  <!-- Communication / Mobilization Waves (Representing the call to action) -->
  <path d="M 45 75 Q 60 65 75 80" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 50 68 Q 68 55 85 72" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

  <!-- Medical / Rescue Symbol Icon floating subtly above the scene context -->
  <g transform="translate(110, 20)" opacity="0.8">
    <circle cx="10" cy="10" r="12" fill="#ef4444" opacity="0.2"/>
    <rect x="7" y="4" width="6" height="12" rx="1" fill="#ef4444" />
    <rect x="4" y="7" width="12" height="6" rx="1" fill="#ef4444" />
  </g>

  <!-- Lighting overlay for depth -->
  <circle cx="35" cy="50" r="40" fill="#38bdf8" opacity="0.08" pointer-events="none" />
</svg>