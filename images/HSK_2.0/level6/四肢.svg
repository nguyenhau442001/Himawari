<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background grid/glow elements for modern tech-education aesthetic -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="50" fill="none" stroke="#252A34" stroke-width="1"/>

  <!-- Central Human Silhouette / Anatomical Focus for "四肢" (Limbs) -->
  <g transform="translate(120, 120)">
    <!-- Head -->
    <circle cx="0" cy="-56" r="10" fill="#6272A4"/>
    
    <!-- Torso -->
    <path d="M-10,-42 L10,-42 L8,-8 L-8,-8 Z" fill="#6272A4"/>

    <!-- TARGET: FOUR LIMBS (Highlighted in Orange/Gold Accent) -->
    <!-- Left Arm -->
    <g>
      <line x1="-10" y1="-38" x2="-42" y2="-12" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
      <line x1="-42" y1="-12" x2="-62" y2="-32" stroke="#FFB86C" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-62" cy="-32" r="3.5" fill="#FF5555"/>
    </g>

    <!-- Right Arm -->
    <g>
      <line x1="10" y1="-38" x2="42" y2="-12" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
      <line x1="42" y1="-12" x2="62" y2="-32" stroke="#FFB86C" stroke-width="5" stroke-linecap="round"/>
      <circle cx="62" cy="-32" r="3.5" fill="#FF5555"/>
    </g>

    <!-- Left Leg -->
    <g>
      <line x1="-6" y1="-8" x2="-22" y2="30" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
      <line x1="-22" y1="30" x2="-32" y2="68" stroke="#FFB86C" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-32" cy="68" r="3.5" fill="#FF5555"/>
    </g>

    <!-- Right Leg -->
    <g>
      <line x1="6" y1="-8" x2="22" y2="30" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
      <line x1="22" y1="30" x2="32" y2="68" stroke="#FFB86C" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="68" r="3.5" fill="#FF5555"/>
    </g>

    <!-- Core motion indicators / accents -->
    <path d="M-50,-45 C-60,-55 -55,-70 -35,-75" fill="none" stroke="#50FA7B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M50,45 C60,55 55,70 35,75" fill="none" stroke="#50FA7B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  </g>
</svg>