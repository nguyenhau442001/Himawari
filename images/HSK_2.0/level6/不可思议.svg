<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#334155"/>
  <rect x="50" y="175" width="10" height="50" fill="#475569"/>
  <rect x="180" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Scientist/Student Character -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-30" r="25" fill="#fde68a"/>
    <path d="M-10 -35 Q-5 -40 0 -35 T10 -35" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-38" r="3" fill="#1e293b"/>
    <circle cx="8" cy="-38" r="3" fill="#1e293b"/>
    <path d="M-15 -20 Q0 -10 15 -20" stroke="#1e293b" stroke-width="2" fill="none"/>
    <rect x="-20" y="0" width="40" height="60" rx="10" fill="#38bdf8"/>
  </g>

  <!-- The "Result" (Glowing Flask/Experiment) -->
  <g transform="translate(180, 120)">
    <path d="M-15 40 L15 40 L10 10 L-10 10 Z" fill="#ec4899"/>
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="10" fill="#fff" opacity="0.3"/>
    <path d="M-5 -5 L5 5 M-5 5 L5 -5" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Shocked Expression Elements -->
  <path d="M80 80 L70 60 M90 75 L95 55" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="75" cy="70" r="4" fill="#fb923c"/>
  
  <!-- Floating Data/Particles -->
  <circle cx="150" cy="90" r="3" fill="#10b981"/>
  <circle cx="160" cy="70" r="2" fill="#38bdf8"/>
  <rect x="170" y="80" width="6" height="6" rx="1" fill="#fbbf24" transform="rotate(20)"/>
  
  <!-- Background Glow -->
  <circle cx="180" cy="120" r="40" fill="#fbbf24" opacity="0.1"/>
</svg>