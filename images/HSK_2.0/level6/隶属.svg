<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for HQ / Head Office -->
    <radialGradient id="hqGlow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Cyan Glow for Sub-department -->
    <radialGradient id="subGlow" cx="30%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Connection Line Gradient -->
    <linearGradient id="connectGrad" x1="85" y1="110" x2="155" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Window Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#hqGlow)"/>
  <rect width="240" height="240" rx="24" fill="url(#subGlow)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- City Window Silhouette -->
  <path d="M 160 80 L 190 70 L 190 150 L 160 150 Z" fill="url(#windowGrad)" opacity="0.4"/>
  <rect x="168" y="78" width="6" height="8" rx="1" fill="#fbbf24" opacity="0.6"/>
  <rect x="178" y="78" width="6" height="8" rx="1" fill="#fbbf24" opacity="0.4"/>
  <rect x="168" y="92" width="6" height="8" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="178" y="92" width="6" height="8" rx="1" fill="#fbbf24" opacity="0.8"/>

  <!-- Organizational Hierarchy Architecture (Connecting "Sub-department" to "Headquarters") -->
  <!-- Dotted Connection Line -->
  <path d="M 85 110 Q 120 70 155 85" stroke="url(#connectGrad)" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>
  
  <!-- Pulsing nodes indicating dependency / subordination -->
  <circle cx="85" cy="110" r="4" fill="#38bdf8"/>
  <circle cx="155" cy="85" r="6" fill="#fbbf24"/>
  <circle cx="120" cy="89" r="3" fill="#10b981"/>

  <!-- RIGHT SIDE: HEADQUARTERS (总公司 - Grand Building / Executive Desk) -->
  <g transform="translate(135, 65)">
    <!-- HQ Desk -->
    <rect x="10" y="45" width="55" height="6" rx="2" fill="#475569"/>
    <path d="M 15 51 L 20 75 M 60 51 L 55 75" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Executive Monitor showing high-level growth chart -->
    <rect x="22" y="20" width="30" height="22" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="26,38 32,32 38,35 46,24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- HQ Executive Character -->
    <!-- Body & Suit -->
    <path d="M 30 75 C 30 63 45 63 45 75 Z" fill="#3b82f6"/>
    <rect x="33" y="65" width="9" height="12" fill="#ffffff"/>
    <polygon points="35,65 41,65 37.5,72" fill="#ef4444"/>
    <!-- Head -->
    <circle cx="37.5" cy="54" r="7" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 30.5 52 C 31 47 44 47 44.5 52 C 43 49 32 49 30.5 52 Z" fill="#1e293b"/>
  </g>

  <!-- LEFT SIDE: SUB-DEPARTMENT (这个部门 - Branch Office Desk & Employee) -->
  <g transform="translate(35, 90)">
    <!-- Sub-office Desk -->
    <rect x="-10" y="45" width="75" height="6" rx="2" fill="#334155"/>
    <path d="M -2 51 L 3 75 M 62 51 L 57 75" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Desk Props: Laptop, Documents, Plant -->
    <!-- Laptop -->
    <path d="M 30 45 L 48 45 L 52 35 L 26 35 Z" fill="#64748b"/>
    <rect x="27" y="36" width="24" height="8" rx="1" fill="#38bdf8"/>
    <!-- Documents / Files -->
    <rect x="5" y="38" width="14" height="7" rx="1" fill="#cbd5e1" transform="rotate(-10 12 41)"/>
    <rect x="8" y="36" width="14" height="7" rx="1" fill="#ffffff" transform="rotate(-5 15 395)"/>
    <!-- Small desk plant -->
    <rect x="-4" y="38" width="6" height="7" rx="1" fill="#f43f5e"/>
    <circle cx="-1" cy="35" r="4" fill="#10b981"/>

    <!-- Sub-department Employee Character -->
    <!-- Torso & Clothing -->
    <path d="M 15 75 C 15 62 33 62 33 75 Z" fill="#0ea5e9"/>
    <rect x="21" y="64" width="7" height="11" fill="#f8fafc"/>
    <!-- Head & Face -->
    <circle cx="24.5" cy="52" r="7" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 17.5 50 C 18 44 31 44 31.5 50 C 29 47 20 47 17.5 50 Z" fill="#334155"/>
    <!-- Arms actively typing/working -->
    <path d="M 18 66 C 15 68 22 72 27 68" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- FOREGROUND ACCENTS & POLISH -->
  <!-- Ambient light particles floating to enhance depth -->
  <circle cx="105" cy="130" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="130" cy="150" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="65" cy="65" r="1.5" fill="#fb923c" opacity="0.4"/>
</svg>