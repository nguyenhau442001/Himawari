<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Dawn breaking over a modern park -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="75%" stop-color="#311030" />
      <stop offset="100%" stop-color="#4c1d0f" />
    </linearGradient>

    <!-- Morning Sun Glow -->
    <radialGradient id="sunGlow" cx="75%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Motion Blur / Shadow -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Jogger Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Dawn Sky & Ambient Glow -->
  <circle cx="180" cy="150" r="100" fill="url(#sunGlow)" />

  <!-- Distant City Skyline / Trees Silhouette -->
  <path d="M0 160 L20 155 L45 158 L70 145 L95 150 L120 140 L145 148 L170 135 L195 142 L220 138 L240 145 L240 240 L0 240 Z" fill="#1e1e3f" opacity="0.7" />

  <!-- Park Layer (Mid-ground) -->
  <path d="M0 175 Q60 165 120 172 T240 168 L240 240 L0 240 Z" fill="#064e3b" opacity="0.9" />

  <!-- Decorative Early Morning Park Elements (Trees & Lamppost) -->
  <!-- Pine tree left -->
  <path d="M25 175 L15 195 L22 195 L12 215 L20 215 L10 240 L40 240 L30 215 L38 215 L28 195 L35 195 Z" fill="#022c22" />
  <!-- Pine tree far left -->
  <path d="M55 180 L48 200 L54 200 L45 220 L52 220 L42 240 L68 240 L60 220 L66 220 L58 200 L64 200 Z" fill="#022c22" opacity="0.6" />

  <!-- Vintage Park Lamppost (Glowing in early dawn) -->
  <rect x="200" y="110" width="3" height="130" fill="#334155" />
  <circle cx="201.5" cy="110" r="6" fill="#fbbf24" opacity="0.9" />
  <circle cx="201.5" cy="110" r="14" fill="#f59e0b" opacity="0.2" />

  <!-- Foreground Path / Ground -->
  <path d="M-10 190 Q80 180 250 195 L250 240 L-10 240 Z" fill="url(#groundGrad)" />

  <!-- Jogging Motion Path / Speed Lines -->
  <path d="M70 215 Q110 210 150 215" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 8" opacity="0.5" />
  <path d="M85 222 Q125 217 165 222" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.4" />

  <!-- MAIN CHARACTER: Dynamic Jogger in Action -->
  <g transform="translate(110, 140)">
    <!-- Shadow under runner -->
    <ellipse cx="15" cy="78" rx="22" ry="5" fill="#022c22" opacity="0.6" />

    <!-- Back Arm (Swinging backward) -->
    <path d="M12 25 L-2 42" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <circle cx="-3" cy="44" r="3.5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Back Leg (Pushing off ground) -->
    <path d="M10 45 L-5 70 L-12 73" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoe back -->
    <path d="M-12 73 L-18 75" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />

    <!-- Torso (Lean forward for running) -->
    <path d="M5 15 L20 48 L8 45 Z" fill="url(#shirtGrad)" />
    <!-- Running gear stripe -->
    <path d="M12 20 L22 46" stroke="#f8fafc" stroke-width="2.5" opacity="0.8" />

    <!-- Head & Face (Focused expression, motion tilt) -->
    <circle cx="15" cy="6" r="8" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M7 6 Q9 -2 18 2 Q22 5 20 8 Z" fill="#0f172a" />
    <!-- Motion headband -->
    <path d="M8 5 Q15 2 22 7" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />

    <!-- Front Arm (Bent at elbow, swinging forward) -->
    <path d="M14 22 L28 32 L22 45" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="21" cy="47" r="3.5" fill="#fbcfe8" />

    <!-- Front Leg (Stepping forward, knee high) -->
    <path d="M18 45 L32 55 L25 72" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoe front -->
    <path d="M25 72 L33 75" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Morning Atmosphere / Floating Dew/Light Particles -->
  <circle cx="60" cy="110" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="140" cy="95" r="2" fill="#fde047" opacity="0.6" />
  <circle cx="95" cy="130" r="1" fill="#fde047" opacity="0.9" />
  <circle cx="180" cy="80" r="2.5" fill="#fde047" opacity="0.5" />
  <circle cx="35" cy="140" r="1.5" fill="#fde047" opacity="0.7" />

  <!-- Subtle framing border for clean vector look -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>