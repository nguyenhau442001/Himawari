<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm indoor light gradient -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Grape gradient for "串" (a cluster/bunch) -->
    <radialGradient id="grape-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>

    <!-- Shop awning pattern/gradient -->
    <linearGradient id="awning-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting -->
  <circle cx="120" cy="120" r="120" fill="url(#lamp-glow)" />

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Fruit Market / Store Background Elements -->
  <!-- Wall shelf behind -->
  <rect x="30" y="70" width="180" height="8" rx="4" fill="#334155" />
  <rect x="50" y="110" width="140" height="8" rx="4" fill="#334155" />
  
  <!-- Ambient decorative jars/baskets on shelves -->
  <circle cx="60" cy="58" r="12" fill="#10b981" opacity="0.6" />
  <circle cx="95" cy="54" r="16" fill="#f59e0b" opacity="0.6" />
  <path d="M 160 70 L 175 48 L 190 70 Z" fill="#ec4899" opacity="0.6" />

  <!-- Counter/Desk Surface -->
  <rect x="15" y="185" width="210" height="40" rx="6" fill="#0f172a" />
  <rect x="15" y="180" width="210" height="8" rx="3" fill="#475569" />
  <!-- Cash register / small shop props -->
  <rect x="25" y="150" width="30" height="30" rx="4" fill="#64748b" />
  <rect x="32" y="158" width="16" height="8" rx="2" fill="#38bdf8" />

  <!-- CHARACTER: Woman buying the grapes ("她") -->
  <g id="customer-character">
    <!-- Body/Torso (Teal jacket with warm collar) -->
    <path d="M 125 180 C 125 155 145 150 165 150 C 185 150 200 160 205 180 Z" fill="#0d9488" />
    <path d="M 145 150 L 165 170 L 185 150" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    
    <!-- Neck -->
    <rect x="155" y="132" width="20" height="22" rx="6" fill="#fbcfe8" />
    
    <!-- Head -->
    <circle cx="165" cy="118" r="22" fill="#fbcfe8" />
    
    <!-- Hair (Styled bob cut, dark brown) -->
    <path d="M 143 115 C 143 95 187 95 187 115 C 187 135 182 142 178 142 C 174 142 172 130 165 130 C 158 130 156 142 152 142 C 148 142 143 135 143 115 Z" fill="#331a00" />
    <path d="M 145 115 C 145 102 165 98 185 115 C 180 100 150 100 145 115 Z" fill="#4d2600" />

    <!-- Friendly facial expression (Happy eyes looking at grapes) -->
    <path d="M 168 116 Q 173 112 178 117" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Rosy cheek -->
    <circle cx="178" cy="122" r="4" fill="#f43f5e" opacity="0.4" />
    <!-- Smile -->
    <path d="M 172 126 Q 177 131 182 125" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Raised Hand holding the Grape Cluster ("一串葡萄") -->
    <!-- Arm -->
    <path d="M 140 160 C 130 155 110 145 105 130" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="102" cy="126" r="7" fill="#fbcfe8" />
  </g>

  <!-- THE FOCAL POINT: "一串葡萄" (A bunch of grapes hanging naturally) -->
  <g id="grape-cluster">
    <!-- Stem & Vine connecting to hand -->
    <path d="M 102 126 C 98 120 95 110 92 105" fill="none" stroke="#65a30d" stroke-width="3.5" stroke-linecap="round" />
    <!-- Small green leaves -->
    <path d="M 92 105 C 85 100 82 108 88 112 C 92 110 92 105 92 105 Z" fill="#84cc16" />
    <path d="M 92 105 C 100 98 104 106 97 110 C 92 107 92 105 92 105 Z" fill="#a3e635" />

    <!-- Grapes arranged in a rich cluster/string ("串") -->
    <!-- Row 1 (top) -->
    <circle cx="94" cy="113" r="6" fill="url(#grape-grad)" />
    <circle cx="104" cy="115" r="6" fill="url(#grape-grad)" />
    
    <!-- Row 2 -->
    <circle cx="88" cy="122" r="6.5" fill="url(#grape-grad)" />
    <circle cx="97" cy="123" r="7" fill="url(#grape-grad)" />
    <circle cx="107" cy="122" r="6" fill="url(#grape-grad)" />

    <!-- Row 3 -->
    <circle cx="92" cy="131" r="7" fill="url(#grape-grad)" />
    <circle cx="101" cy="132" r="7.5" fill="url(#grape-grad)" />
    <circle cx="110" cy="130" r="6.5" fill="url(#grape-grad)" />

    <!-- Row 4 -->
    <circle cx="96" cy="140" r="7" fill="url(#grape-grad)" />
    <circle cx="105" cy="141" r="7" fill="url(#grape-grad)" />

    <!-- Bottom tip -->
    <circle cx="100" cy="150" r="6" fill="url(#grape-grad)" />

    <!-- Fresh specular highlights on grapes for juicy realism -->
    <circle cx="95" cy="120" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="100" cy="129" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="104" cy="138" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="87" cy="120" r="1.5" fill="#ffffff" opacity="0.5" />
    <circle cx="108" cy="120" r="1.5" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- SHOPKEEPER / SELLER (Contextualizing the purchase interaction) -->
  <g id="shopkeeper-character">
    <!-- Body behind counter -->
    <path d="M 20 190 C 20 160 50 150 75 150 C 95 150 110 160 115 190 Z" fill="#3b82f6" />
    <!-- Apron -->
    <path d="M 40 165 L 90 165 L 95 190 L 35 190 Z" fill="#f8fafc" />
    <circle cx="65" cy="135" r="16" fill="#fed7aa" />
    <!-- Friendly vendor smile & cap -->
    <path d="M 49 130 C 49 120 81 120 81 130 Z" fill="#ea580c" />
    <path d="M 60 133 Q 65 137 70 133" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground details: Shopping basket on counter with other fruit -->
  <g id="shopping-basket">
    <path d="M 120 185 L 135 165 L 175 165 L 190 185 Z" fill="#d97706" />
    <!-- Basket weave lines -->
    <path d="M 127 175 L 183 175" stroke="#b45309" stroke-width="2" />
    <!-- Oranges/Apples inside basket -->
    <circle cx="140" cy="162" r="10" fill="#f97316" />
    <circle cx="155" cy="160" r="11" fill="#ef4444" />
    <circle cx="170" cy="163" r="9" fill="#eab308" />
  </g>

</svg>