<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle consistency lines representing steady path/timeline -->
  <path d="M40 180 L200 180" stroke="#2A313C" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M40 140 L200 140" stroke="#2A313C" stroke-width="1.5" opacity="0.3"/>

  <!-- Central iconic representation of "As always / Steadfast support" -->
  <!-- Ground platform -->
  <path d="M60 190 L180 190" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>

  <!-- Solid milestone pillar representing consistency/unchanged nature -->
  <rect x="75" y="100" width="30" height="90" rx="4" fill="#2E3846"/>
  <rect x="70" y="90" width="40" height="14" rx="3" fill="#3E4C60"/>

  <!-- Person 1 (Supporter standing firm, unchanged) -->
  <!-- Body/Torso -->
  <path d="M95 135 C95 125 105 120 115 120 C125 120 135 125 135 135 L135 190 L95 190 Z" fill="#E67E22"/>
  <!-- Head -->
  <circle cx="115" cy="102" r="12" fill="#F39C12"/>
  <!-- Supporting steady arm extended forward -->
  <path d="M115 135 L150 145" stroke="#E67E22" stroke-width="8" stroke-linecap="round"/>

  <!-- Person 2 (Recipient receiving the unwavering, consistent support) -->
  <!-- Body/Torso -->
  <path d="M155 145 C155 135 165 130 175 130 C185 130 195 135 195 145 L195 190 L155 190 Z" fill="#3498DB"/>
  <!-- Head -->
  <circle cx="175" cy="112" r="11" fill="#5DADE2"/>

  <!-- Unwavering steady connection beam / supportive handshake gesture -->
  <path d="M145 145 L165 145" stroke="#F1C40F" stroke-width="6" stroke-linecap="round"/>

  <!-- Symbolizing constant time / eternal continuation: minimalist steady clock/horizon element above -->
  <circle cx="115" cy="55" r="22" fill="none" stroke="#3E4C60" stroke-width="3"/>
  <path d="M115 40 V55 L125 60" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Steady directional arrow looping seamlessly -->
  <path d="M145 55 C145 42 130 38 115 38" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M140 50 L145 55 L149 48" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>