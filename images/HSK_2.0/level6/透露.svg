<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to create focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Central Object: A sleek, modern glowing document/envelope revealing data (representing "tiết lộ" / disclosure of information) -->
  <g transform="translate(120, 120)">
    <!-- Glowing light rays emerging from the center -->
    <path d="M 0 -25 L 0 -55" stroke="#FFB74D" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 18 -18 L 40 -40" stroke="#FFB74D" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M -18 -18 L -40 -40" stroke="#FFB74D" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Document Base / Folder -->
    <rect x="-50" y="-35" width="100" height="75" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Folder Tab -->
    <path d="M -50 -35 L -30 -35 L -20 -45 L -50 -45 Z" fill="#4A5568"/>

    <!-- Emerging Glowing Data Sheet (The 'Secret' or 'Information' being revealed) -->
    <g transform="translate(0, -15)">
      <rect x="-35" y="-35" width="70" height="55" rx="4" fill="#FFFFFF" opacity="0.95"/>
      
      <!-- Abstract lines of text on the emerging sheet -->
      <rect x="-25" y="-23" width="30" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="-25" y="-13" width="50" height="4" rx="2" fill="#FFB74D"/>
      <rect x="-25" y="-3" width="40" height="4" rx="2" fill="#CBD5E0"/>
      <rect x="-25" y="7" width="20" height="4" rx="2" fill="#CBD5E0"/>
    </g>

    <!-- Glowing Accent Focus Ring -->
    <circle cx="0" cy="5" r="50" fill="none" stroke="#FFB74D" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  </g>
</svg>