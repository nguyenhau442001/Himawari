<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Restaurant/Cafe Interior Environment -->
  <!-- Back Wall & Floor -->
  <rect x="20" y="30" width="200" height="130" fill="#1e293b" rx="8"/>
  <rect x="20" y="150" width="200" height="60" fill="#0f172a"/>
  
  <!-- Window view outside -->
  <rect x="140" y="45" width="60" height="70" rx="4" fill="#334155"/>
  <circle cx="170" cy="70" r="12" fill="#fbbf24" opacity="0.8"/>
  <path d="M150 100 Q160 90 170 100 T190 100" stroke="#64748b" stroke-width="3" fill="none"/>

  <!-- Messy Table & Props -->
  <path d="M40 150 L200 150 L190 175 L50 175 Z" fill="#475569"/>
  <path d="M45 145 L195 145 L190 150 L50 150 Z" fill="#64748b"/>

  <!-- Spilled Bowl & Mess on Table -->
  <ellipse cx="90" cy="155" rx="14" ry="7" fill="#cbd5e1"/>
  <!-- Spilled food/soup splash -->
  <path d="M85 153 C70 150 65 160 75 165 C85 170 105 165 95 158 Z" fill="#f59e0b" opacity="0.85"/>
  <!-- Tipping bowl -->
  <path d="M75 140 L105 142 L100 150 L80 148 Z" fill="#e2e8f0"/>

  <!-- Other tableware -->
  <rect x="150" y="142" width="12" height="15" rx="3" fill="#cbd5e1"/> <!-- Cup -->
  <line x1="165" y1="140" x2="165" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/> <!-- Chopsticks -->

  <!-- Secondary Character (Witness/Judging onlooker) -->
  <g transform="translate(160, 95)">
    <!-- Body -->
    <path d="M20 60 L45 60 L50 90 L15 90 Z" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="32" cy="35" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M18 32 C18 20 46 20 46 32 C42 26 22 26 18 32 Z" fill="#334155"/>
    <!-- Expression - Disapproving side-eye -->
    <circle cx="28" cy="35" r="2" fill="#0f172a"/>
    <circle cx="38" cy="35" r="2" fill="#0f172a"/>
    <path d="M30 44 Q33 40 36 44" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M25 31 L32 32" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Main Character (Embarrassed/Mất mặt) -->
  <g transform="translate(50, 85)">
    <!-- Slumped Body -->
    <path d="M25 65 C25 55 45 50 60 65 L65 100 L20 100 Z" fill="#ef4444"/>
    
    <!-- Sweating / Embarrassment aura (red face & sweat drop) -->
    <path d="M40 38 Q55 25 70 38" fill="#f87171"/>
    
    <!-- Head (Hiding in hands / Slumped down) -->
    <circle cx="45" cy="40" r="18" fill="#fde68a"/>
    
    <!-- Hair -->
    <path d="M28 35 C28 20 62 20 62 35 C55 27 35 27 28 35 Z" fill="#1e293b"/>

    <!-- Hands covering face in shame -->
    <path d="M35 48 C35 38 55 38 55 48 C55 52 35 52 35 48 Z" fill="#fde68a"/>
    <circle cx="45" cy="45" r="5" fill="#ef4444" opacity="0.6"/> <!-- Blushing hands -->

    <!-- Sweat drop of awkwardness -->
    <path d="M63 32 Q66 38 63 42 Q60 38 63 32 Z" fill="#38bdf8"/>

    <!-- Action lines / Shame vibration waves -->
    <path d="M15 45 Q10 50 15 55" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M10 52 Q5 57 10 62" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Foreground decorative plants/interior frame elements for depth -->
  <path d="M0 240 L0 210 Q15 205 30 215 T60 210 L60 240 Z" fill="#0f172a"/>
  
  <!-- Lighting accent / Ambient glow (Warm indoor atmosphere contrasted with cold social embarrassment) -->
  <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#lampGlow)" pointer-events="none" rx="24"/>
</svg>