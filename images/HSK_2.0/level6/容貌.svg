<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Mirror Gold Rim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Vanity Table Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Lamp Light Gradient -->
    <radialGradient id="lampLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment / Room Details -->
  <!-- Wallpaper subtle panel lines -->
  <line x1="60" y1="0" x2="60" y2="170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="180" y1="0" x2="180" y2="170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Hanging Warm Ambient Light / Pendant Lamp -->
  <path d="M120 0 L120 40" stroke="#64748b" stroke-width="2"/>
  <circle cx="120" cy="40" r="16" fill="#f59e0b" filter="url(#softGlow)"/>
  <circle cx="120" cy="40" r="12" fill="#fef08a"/>

  <!-- Ambient Light Cone -->
  <polygon points="120,40 50,180 190,180" fill="url(#lampLight)"/>

  <!-- Houseplant in Background for Rich Real-World Context -->
  <path d="M30 170 Q30 140 45 130 Q50 145 45 170 Z" fill="#10b981"/>
  <path d="M45 170 Q55 130 70 120 Q65 145 55 170 Z" fill="#059669"/>
  <path d="M35 170 Q20 140 10 135 Q18 155 30 170 Z" fill="#34d399"/>
  <path d="M25 170 C25 160 45 160 55 170 Z" fill="#b45309"/> <!-- Pot -->

  <!-- Vanity Table / Desk Surface -->
  <rect x="0" y="170" width="240" height="70" fill="url(#woodGrad)"/>
  <rect x="0" y="170" width="240" height="6" fill="#64748b"/>

  <!-- Vanity Accessories / Makeup Bottles on Table -->
  <!-- Perfume Bottle -->
  <rect x="180" y="145" width="16" height="25" rx="3" fill="#38bdf8" opacity="0.8"/>
  <rect x="184" y="140" width="8" height="5" fill="#fef08a"/>
  <!-- Cosmetic Jar -->
  <ellipse cx="65" cy="162" rx="12" ry="5" fill="#f43f5e"/>
  <rect x="53" y="152" width="24" height="10" rx="2" fill="#fda4af"/>

  <!-- Elegant Vanity Mirror (Centerpiece) -->
  <!-- Mirror Stand Base -->
  <ellipse cx="120" cy="172" rx="22" ry="6" fill="url(#goldGrad)"/>
  <path d="M117 150 L123 150 L125 172 L115 172 Z" fill="url(#goldGrad)"/>

  <!-- Mirror Outer Ring -->
  <circle cx="120" cy="95" r="48" fill="url(#goldGrad)" filter="url(#softGlow)"/>
  <!-- Mirror Glass & Reflection Effect -->
  <circle cx="120" cy="95" r="43" fill="#0f172a"/>
  <circle cx="120" cy="95" r="41" fill="#38bdf8" opacity="0.15"/>
  <path d="M95 75 Q110 65 125 70 Q105 85 95 75 Z" fill="#ffffff" opacity="0.25"/> <!-- Glass glare -->

  <!-- CHARACTER: Young Woman (Showing her beautiful appearance / dung mạo xinh đẹp) -->
  <!-- Shoulders & Outfit -->
  <path d="M80 200 C80 175 100 170 120 170 C140 170 160 175 160 200 Z" fill="#f43f5e"/> <!-- Elegant pink top -->
  <path d="M95 185 C110 180 130 180 145 185 L155 200 L85 200 Z" fill="#fb7185"/> <!-- Collar detail -->

  <!-- Neck -->
  <rect x="110" y="145" width="20" height="30" rx="8" fill="#fbcfe8"/>

  <!-- Face Base (Reflected in mirror / positioned just in front) -->
  <ellipse cx="120" cy="120" rx="26" ry="30" fill="#fbcfe8"/>

  <!-- Hair Styling (Flowing elegant black/dark hair framing the face) -->
  <!-- Back hair -->
  <path d="M90 100 Q80 140 95 170 L145 170 Q160 140 150 100 Q150 85 120 85 Q90 85 90 100 Z" fill="#0f172a"/>
  <!-- Bangs and side locks -->
  <path d="M94 105 Q120 90 146 105 Q140 135 145 155 Q130 160 120 150 Q110 160 95 155 Q100 135 94 105 Z" fill="#1e293b"/>

  <!-- Facial Features (Expressing exquisite beauty, gentle smiling expression) -->
  <!-- Gentle Eyes -->
  <ellipse cx="110" cy="118" rx="3.5" ry="4" fill="#0f172a"/>
  <ellipse cx="130" cy="118" rx="3.5" ry="4" fill="#0f172a"/>
  <!-- Eye Sparkle -->
  <circle cx="111" cy="117" r="1.2" fill="#ffffff"/>
  <circle cx="131" cy="117" r="1.2" fill="#ffffff"/>

  <!-- Soft Eyellashes / Brows -->
  <path d="M105 112 Q110 110 115 112" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M125 112 Q130 110 135 112" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cheeks -->
  <circle cx="104" cy="126" r="5" fill="#fb7185" opacity="0.5"/>
  <circle cx="136" cy="126" r="5" fill="#fb7185" opacity="0.5"/>

  <!-- Gentle Smile -->
  <path d="M114 133 Q120 139 126 133" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Delicate Earrings -->
  <circle cx="93" cy="132" r="2" fill="url(#goldGrad)"/>
  <circle cx="147" cy="132" r="2" fill="url(#goldGrad)"/>

  <!-- Foreground decorative warm bokeh / sparkle elements -->
  <circle cx="70" cy="90" r="3" fill="#fef08a" opacity="0.7" filter="url(#softGlow)"/>
  <circle cx="170" cy="100" r="2" fill="#fef08a" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="150" cy="65" r="4" fill="#f59e0b" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="85" cy="60" r="2.5" fill="#fef08a" opacity="0.9" filter="url(#softGlow)"/>
</svg>