<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Shelf Gradient -->
    <linearGradient id="shelf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment (Supermarket Aisle) -->
  <g id="environment">
    <!-- Back wall grid / tiles -->
    <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
    
    <!-- Promotional banner hanging (dimmed/crossed out vibe) -->
    <path d="M 60,35 L 180,35 L 170,65 L 70,65 Z" fill="#334155" opacity="0.4" />
    
    <!-- Shelves with products -->
    <!-- Shelf 1 (Top) -->
    <rect x="30" y="70" width="180" height="8" fill="url(#shelf-grad)" />
    <!-- Normal products -->
    <rect x="45" y="45" width="20" height="25" rx="3" fill="#38bdf8" />
    <rect x="75" y="48" width="18" height="22" rx="3" fill="#10b981" />
    <rect x="103" y="42" width="22" height="28" rx="3" fill="#f59e0b" />
    
    <!-- Shelf 2 (Middle - The "Boycotted" Product focus) -->
    <rect x="30" y="115" width="180" height="8" fill="url(#shelf-grad)" />
    
    <!-- Shelf 3 (Bottom) -->
    <rect x="30" y="160" width="180" height="8" fill="url(#shelf-grad)" />
    <rect x="45" y="135" width="25" height="25" rx="4" fill="#64748b" />
    <rect x="80" y="132" width="20" height="28" rx="4" fill="#a855f7" />
  </g>

  <!-- Floor -->
  <path d="M 0,168 L 240,168 L 240,240 L 0,240 Z" fill="url(#floor-grad)" />
  <line x1="0" y1="168" x2="240" y2="168" stroke="#334155" stroke-width="2" />

  <!-- The Disliked/Boycotted Product on Middle Shelf -->
  <g id="boycotted-product" filter="url(#drop-shadow)">
    <!-- Product Box -->
    <rect x="135" y="85" width="36" height="30" rx="4" fill="#ef4444" />
    <path d="M 135,85 L 153,78 L 171,85 L 171,90 L 153,83 L 135,90 Z" fill="#f87171" /> <!-- 3D top -->
    
    <!-- Big 'X' over the product to clearly signify boycott/rejection -->
    <line x1="138" y1="88" x2="168" y2="112" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="168" y1="88" x2="138" y2="112" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Main Consumer Character (Rejecting / Boycotting) -->
  <g id="consumer-character" filter="url(#drop-shadow)">
    <!-- Body / Torso (Turning away, jacket style) -->
    <path d="M 70,200 C 70,180 85,165 95,155 L 115,165 C 125,175 130,190 130,200 Z" fill="#3b82f6" />
    <path d="M 85,158 L 97,190 L 108,190 L 100,158 Z" fill="#1d4ed8" /> <!-- Inner shirt -->

    <!-- Head & Hair -->
    <circle cx="95" cy="122" r="18" fill="#fcd34d" /> <!-- Face base -->
    <path d="M 77,122 C 77,105 113,105 113,122 C 113,115 105,102 95,102 C 85,102 77,115 77,122 Z" fill="#1e293b" /> <!-- Hair -->

    <!-- Facial Expression: Determined/Dismissive -->
    <path d="M 100,118 L 108,121" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" /> <!-- Angry/Firm brow -->
    <circle cx="104" cy="125" r="2" fill="#1e293b" /> <!-- Eye -->
    <path d="M 98,135 Q 104,131 110,134" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" /> <!-- Frown mouth -->
    <path d="M 112,123 Q 116,125 112,127" fill="#f87171" /> <!-- Slight blush/cheek -->

    <!-- Arms & Hands performing the "Stop / Reject" gesture -->
    <!-- Back arm (resting) -->
    <path d="M 80,160 Q 70,175 75,190" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />

    <!-- Front arm pushing forward decisively (palm out toward the product) -->
    <path d="M 115,165 Q 135,155 145,135" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <!-- Hand in "Stop" gesture / Palm facing product -->
    <circle cx="148" cy="130" r="8" fill="#fcd34d" />
    <!-- Motion lines / Force field indicating rejection -->
    <path d="M 132,120 Q 128,128 132,136" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 126,115 Q 120,128 126,141" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Secondary Consumer (Solidarity / Supporting the boycott) -->
  <g id="supporting-consumer" opacity="0.85">
    <!-- Body -->
    <path d="M 35,200 C 35,185 45,170 55,160 L 70,170 C 75,185 75,200 75,200 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="55" cy="130" r="15" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 40,130 C 40,112 70,112 70,130 C 65,118 45,118 40,130 Z" fill="#475569" />
    <!-- Arms crossed in disapproval -->
    <path d="M 45,165 Q 60,160 65,175" fill="none" stroke="#db2777" stroke-width="9" stroke-linecap="round" />
    <!-- Determined Face -->
    <path d="M 58,131 L 65,133" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 58,141 Q 62,138 66,141" fill="none" stroke="#9f1239" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground ambiance / Shopping basket dropped/ignored on the floor -->
  <g id="floor-props" filter="url(#drop-shadow)">
    <ellipse cx="185" cy="195" rx="22" ry="10" fill="#334155" />
    <path d="M 165,195 L 170,180 L 200,180 L 205,195 Z" fill="#64748b" opacity="0.8" />
    <path d="M 168,187 L 202,187" stroke="#1e293b" stroke-width="2" />
    <!-- Crossed out tag or fallen rejected item -->
    <rect x="175" y="190" width="16" height="12" rx="2" fill="#ef4444" transform="rotate(-15 183 196)" />
    <line x1="173" y1="188" x2="193" y2="204" stroke="#ffffff" stroke-width="2.5" />
  </g>
</svg>