<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle design elements -->
  <g opacity="0.3">
    <!-- Wind streams -->
    <path d="M30 150 C50 140, 70 160, 90 150 C110 140, 130 160, 150 150 C170 140, 190 160, 210 150" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M50 170 C70 160, 90 180, 110 170 C130 160, 150 180, 170 170" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Water waves representing smooth sailing -->
  <g fill="none" stroke-linecap="round">
    <!-- Deep water waves -->
    <path d="M20 185 C40 175, 60 195, 80 185 C100 175, 120 195, 140 185 C160 175, 180 195, 200 185 C210 180, 220 185, 230 185" stroke="#0284C7" stroke-width="4"/>
    <path d="M10 205 C30 195, 50 215, 70 205 C90 195, 110 215, 130 205 C150 195, 170 215, 190 205 C210 195, 220 205, 230 205" stroke="#0369A1" stroke-width="3" opacity="0.7"/>
    <!-- Surface crests (Gold/Orange accent) -->
    <path d="M45 172 C55 168, 65 176, 75 172" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M135 172 C145 168, 155 176, 165 172" stroke="#F59E0B" stroke-width="2.5"/>
  </g>

  <!-- Sailboat (The central physical object) -->
  <g transform="translate(0, 5)">
    <!-- Hull -->
    <path d="M80 145 L170 145 C175 145, 178 150, 172 156 C155 172, 105 172, 78 156 C72 150, 75 145, 80 145 Z" fill="#F97316"/>
    <!-- Hull accent stripe -->
    <path d="M85 149 L165 149 C168 149, 170 152, 167 154 C152 164, 108 164, 93 154 C90 152, 92 149, 85 149 Z" fill="#FB923C"/>

    <!-- Mast -->
    <rect x="123" y="65" width="4" height="82" rx="2" fill="#94A3B8"/>

    <!-- Main Sail (Filled with wind, orange/gold theme) -->
    <path d="M121 68 C105 90, 85 110, 85 135 L121 135 Z" fill="#FFFFFF"/>
    <path d="M121 68 C105 90, 85 110, 85 135 L121 135 Z" fill="#F59E0B" opacity="0.15"/>

    <!-- Jib Sail (Front sail) -->
    <path d="M127 75 C138 95, 155 115, 155 135 L127 135 Z" fill="#F1F5F9"/>

    <!-- Flag on top -->
    <path d="M125 60 L142 65 L125 70 Z" fill="#EF4444"/>
  </g>

  <!-- Wind gusts (Favorable wind direction) -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M50 75 Q75 75, 90 85"/>
    <path d="M35 100 Q60 100, 75 110"/>
    <path d="M60 55 Q75 55, 85 62"/>
  </g>

</svg>