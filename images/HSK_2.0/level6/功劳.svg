<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Gradient for Success/Trophy -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Desk & Interior Gradients -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Details: Office Window & Cityscape Silhouette -->
  <g opacity="0.3">
    <!-- Window frame -->
    <rect x="150" y="25" width="65" height="90" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <!-- City lights through window -->
    <rect x="156" y="40" width="12" height="75" fill="#64748b" />
    <rect x="172" y="55" width="12" height="60" fill="#64748b" />
    <rect x="188" y="35" width="12" height="80" fill="#64748b" />
    <!-- Glowing window light -->
    <rect x="158" y="45" width="8" height="10" fill="#fbbf24" opacity="0.6" />
    <rect x="175" y="70" width="8" height="12" fill="#38bdf8" opacity="0.6" />
    <rect x="190" y="50" width="8" height="15" fill="#fbbf24" opacity="0.6" />
  </g>

  <!-- Bookshelf / Plants in Background -->
  <path d="M25 45 L75 45 L75 95 L25 95 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <!-- Plant pots -->
  <path d="M35 75 C35 70 55 70 55 75 L50 90 L40 90 Z" fill="#0ea5e9" />
  <circle cx="45" cy="65" r="12" fill="#10b981" />
  <circle cx="38" cy="68" r="8" fill="#059669" />
  <circle cx="52" cy="68" r="8" fill="#059669" />

  <!-- Office Desk Surface -->
  <path d="M15 175 L225 175 L210 215 L30 215 Z" fill="url(#wood-grad)" />
  <path d="M15 175 L225 175 L225 180 L15 180 Z" fill="#475569" />

  <!-- Desk Props: Laptop -->
  <g transform="translate(130, 145)">
    <!-- Laptop Base -->
    <path d="M-5 25 L55 25 L65 33 L-15 33 Z" fill="#64748b" />
    <!-- Laptop Screen -->
    <path d="M0 0 L50 0 L45 26 L5 26 Z" fill="#475569" />
    <path d="M3 3 L47 3 L43 23 L7 23 Z" fill="url(#screen-glow)" />
    <!-- Success Chart lines on screen -->
    <polyline points="10,18 20,13 30,16 40,8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Coffee Mug -->
  <rect x="195" y="152" width="14" height="18" rx="2" fill="#f8fafc" />
  <path d="M209 157 C214 157 214 165 209 165" fill="none" stroke="#f8fafc" stroke-width="2" />

  <!-- MAIN PROP: The Shiny Success Trophy (Center Stage representing '功劳' / Contribution & Achievement) -->
  <g transform="translate(105, 110)" filter="url(#soft-shadow)">
    <!-- Trophy Base -->
    <path d="M5 45 L25 45 L22 55 L8 55 Z" fill="#64748b" />
    <rect x="11" y="38" width="8" height="8" fill="#94a3b8" />
    <!-- Trophy Stem -->
    <rect x="13" y="25" width="4" height="15" fill="url(#gold-grad)" />
    <!-- Trophy Cup -->
    <path d="M4 5 C4 20 26 20 26 5 Z" fill="url(#gold-grad)" />
    <!-- Handles -->
    <path d="M4 8 C-2 8 -2 18 4 18" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M26 8 C32 8 32 18 26 18" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <!-- Star Emblem on Trophy -->
    <polygon points="15,9 17,13 21,13 18,15 19,19 15,17 11,19 12,15 9,13 13,13" fill="#fef08a" />
  </g>

  <!-- CHARACTER 1 (Left - Teammate presenting / pointing to success) -->
  <g transform="translate(35, 90)">
    <!-- Body / Torso -->
    <path d="M25 45 L50 45 L55 90 L20 90 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="35" cy="22" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M21 22 C21 12 49 12 49 22 C49 26 45 28 45 24 C45 18 25 18 25 24 C25 28 21 26 21 22 Z" fill="#334155" />
    <!-- Arm gesturing toward trophy -->
    <path d="M50 50 C65 50 70 65 72 70" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="74" cy="72" r="5" fill="#fbcfe8" />
    <!-- Face Expression: Friendly smile -->
    <path d="M32 24 Q35 28 38 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="31" cy="20" r="2" fill="#334155" />
    <circle cx="39" cy="20" r="2" fill="#334155" />
  </g>

  <!-- CHARACTER 2 (Right - Main subject 'he' who shares the credit / contribution) -->
  <g transform="translate(150, 80)">
    <!-- Body / Torso (Warm Orange/Amber shirt) -->
    <path d="M20 55 L50 55 L60 110 L15 110 Z" fill="#fb923c" />
    <path d="M20 55 L35 75 L50 55 Z" fill="#ea580c" />
    <!-- Head -->
    <circle cx="35" cy="28" r="15" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M20 28 C20 15 50 15 50 28 C50 32 45 28 42 22 C38 18 32 18 28 22 C25 28 20 32 20 28 Z" fill="#1e293b" />
    <!-- Arm (Nodding / pointing supportively toward the trophy) -->
    <path d="M20 65 C5 65 10 85 12 90" fill="none" stroke="#fb923c" stroke-width="9" stroke-linecap="round" />
    <!-- Hand pointing/supporting -->
    <circle cx="13" cy="93" r="5" fill="#fbcfe8" />
    <!-- Friendly, proud expression -->
    <path d="M31 30 Q35 34 39 30" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (Happy curved lines) -->
    <path d="M29 25 Q31 23 33 25" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M37 25 Q39 23 41 25" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Blushing cheeks -->
    <circle cx="28" cy="29" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="42" cy="29" r="3" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Sparkling / Success Magic Particles (Representing shared effort & achievement) -->
  <g fill="#fbbf24">
    <polygon points="120,70 122,76 128,78 122,80 120,86 118,80 112,78 118,76" />
    <polygon points="95,100 96,103 99,104 96,105 95,108 94,105 91,104 94,103" opacity="0.8" />
    <polygon points="140,95 141,98 144,99 141,100 140,103 139,100 136,99 139,98" opacity="0.8" />
    <circle cx="105" cy="65" r="2" fill="#38bdf8" />
    <circle cx="135" cy="60" r="2.5" fill="#34d399" />
  </g>

</svg>