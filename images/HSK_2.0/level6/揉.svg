<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="windowClip">
      <path d="M 160 30 Q 180 30 200 30 L 200 110 L 160 110 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environment / Room Details -->
  <!-- Night Window Scene Outside -->
  <path d="M 155 25 L 205 25 L 205 115 L 155 115 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M 160 30 L 200 30 L 200 110 L 160 110 Z" fill="url(#windowGlow)"/>
  <!-- Moon & Stars outside -->
  <circle cx="185" cy="50" r="8" fill="#fef08a" opacity="0.8"/>
  <circle cx="170" cy="75" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="192" cy="85" r="1" fill="#ffffff" opacity="0.8"/>
  <path d="M 160 70 L 200 70" stroke="#334155" stroke-width="1.5"/>
  <path d="M 180 30 L 180 110" stroke="#334155" stroke-width="1.5"/>

  <!-- Bookshelf Background Props -->
  <rect x="25" y="40" width="50" height="70" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="75" x2="75" y2="75" stroke="#334155" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="30" y="50" width="8" height="23" fill="#f43f5e" rx="1"/>
  <rect x="39" y="48" width="10" height="25" fill="#38bdf8" rx="1"/>
  <rect x="52" y="53" width="7" height="20" fill="#fbbf24" rx="1"/>
  <rect x="30" y="82" width="12" height="25" fill="#10b981" rx="1"/>
  <rect x="44" y="86" width="9" height="21" fill="#a855f7" rx="1"/>

  <!-- Desk Surface -->
  <path d="M 10 185 L 230 185 L 230 190 L 10 190 Z" fill="#0f172a"/>
  <rect x="10" y="175" width="220" height="12" fill="#334155" rx="2"/>
  <rect x="20" y="187" width="200" height="40" fill="#1e293b"/>

  <!-- Desk Lamp -->
  <path d="M 195 175 L 205 175 L 200 135 Z" fill="#475569"/>
  <path d="M 200 135 Q 180 115 155 125" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Lamp Shade & Cone Light -->
  <path d="M 145 118 L 165 118 L 172 130 L 138 130 Z" fill="#f59e0b"/>
  <path d="M 100 175 L 155 125 L 200 175 Z" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>
  <ellipse cx="150" cy="175" rx="35" ry="6" fill="#fbbf24" opacity="0.15"/>

  <!-- Laptop on Desk -->
  <path d="M 75 160 L 135 160 L 142 175 L 68 175 Z" fill="#64748b"/>
  <path d="M 70 130 L 140 130 L 135 160 L 75 160 Z" fill="#475569"/>
  <path d="M 75 135 L 135 135 L 132 155 L 78 155 Z" fill="#0f172a"/>
  <!-- Code lines mock on screen -->
  <line x1="82" y1="141" x2="105" y2="141" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="147" x2="120" y2="147" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="153" x2="98" y2="153" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="145" y="152" width="14" height="20" rx="3" fill="#ffffff"/>
  <path d="M 159 157 C 164 157 164 167 159 167" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Main Character (Young woman rubbing tired eyes) -->
  <!-- Chair Back -->
  <path d="M 90 95 L 120 95 L 115 175 L 95 175 Z" fill="#334155" rx="4"/>

  <!-- Character Body / Hoodie -->
  <path d="M 78 175 C 78 145 92 135 110 135 C 128 135 142 145 142 175 Z" fill="#ec4899"/>
  <!-- Hoodie Collar / Strings -->
  <path d="M 98 135 Q 110 150 122 135" fill="none" stroke="#fbcfe8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="106" cy="148" r="1.5" fill="#fbcfe8"/>
  <circle cx="114" cy="148" r="1.5" fill="#fbcfe8"/>

  <!-- Neck -->
  <rect x="103" y="122" width="14" height="18" fill="#ffedd5"/>

  <!-- Head & Hair -->
  <!-- Back Hair -->
  <path d="M 92 88 C 85 110 90 130 100 135 C 110 135 120 130 128 120 C 132 110 130 95 124 88 Z" fill="#311005"/>
  
  <!-- Face Base -->
  <ellipse cx="110" cy="104" rx="17" ry="19" fill="#ffedd5"/>

  <!-- Tired Closed Eyes (Arched lines showing fatigue/rubbing) -->
  <path d="M 98 102 Q 103 98 108 102" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <path d="M 112 102 Q 117 98 122 102" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

  <!-- Tired Eye Bags / Rosy tired cheeks -->
  <ellipse cx="103" cy="107" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="117" cy="107" rx="3" ry="1.5" fill="#f43f5e" opacity="0.3"/>

  <!-- Gentle tired mouth -->
  <path d="M 108 116 Q 110 118 112 116" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Front Bangs / Hair details -->
  <path d="M 93 92 C 95 105 102 108 105 108 C 108 108 115 102 122 98 C 124 92 120 86 110 85 C 100 84 94 88 93 92 Z" fill="#451a03"/>

  <!-- Active Arm / Hand Gently Rubbing the Eyes (The '揉' action) -->
  <!-- Upper Arm -->
  <path d="M 125 138 C 135 130 145 115 135 105 Z" fill="#ec4899"/>
  <!-- Forearm & Hand contouring face -->
  <path d="M 135 105 C 128 100 120 95 112 98 C 108 100 106 104 108 108 C 112 110 122 108 128 108 Z" fill="#ffedd5"/>
  <!-- Fingers curving gently over eyes -->
  <path d="M 102 102 C 105 96 115 95 120 102" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
  <circle cx="111" cy="99" r="6" fill="#ffedd5"/>
  <!-- Motion / softness indicator lines near eyes -->
  <path d="M 94 99 Q 92 102 94 105" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 91 101 Q 89 103 91 106" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Other arm resting on desk -->
  <path d="M 85 140 C 75 155 70 170 65 175 L 78 175 Z" fill="#ec4899"/>
  <circle cx="65" cy="176" r="5" fill="#ffedd5"/>

  <!-- Ambient lighting highlights -->
  <path d="M 10 10 L 230 10 L 230 230 L 10 230 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" rx="24"/>
</svg>