<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glowLeft)"/>
  <rect width="240" height="240" rx="24" fill="url(#glowRight)"/>

  <!-- Window / Room Environment Details -->
  <g fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="30" y1="30" x2="30" y2="120"/>
    <line x1="210" y1="30" x2="210" y2="120"/>
    <path d="M70 40 L90 20 L170 20 L190 40"/>
  </g>
  
  <!-- Ambient Wall Plant -->
  <circle cx="205" cy="55" r="12" fill="#065f46" opacity="0.6"/>
  <path d="M195 55 Q205 40 215 55 Q205 70 195 55" fill="#10b981" opacity="0.8"/>
  <path d="M205 45 Q215 35 210 25" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 60 Q190 70 185 65" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

  <!-- Bookshelf Background -->
  <rect x="25" y="45" width="40" height="6" rx="2" fill="#475569"/>
  <rect x="30" y="25" width="8" height="20" rx="1" fill="#f59e0b"/>
  <rect x="40" y="28" width="10" height="17" rx="1" fill="#ec4899"/>
  <rect x="52" y="22" width="7" height="23" rx="1" fill="#38bdf8"/>

  <!-- Desk Surface -->
  <rect x="15" y="160" width="210" height="50" rx="6" fill="url(#deskGrad)"/>
  <rect x="15" y="160" width="210" height="6" fill="#475569" opacity="0.6"/>

  <!-- Connection Line Arc (Visualizing 'Correspond / 对应') -->
  <path d="M 85 105 Q 120 75 155 105" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.8"/>
  <circle cx="85" cy="105" r="3" fill="#fbbf24"/>
  <circle cx="155" cy="105" r="3" fill="#fbbf24"/>

  <!-- Left Element: Question Paper & Holder -->
  <g transform="translate(60, 95)">
    <!-- Paper shadow -->
    <rect x="-18" y="-23" width="38" height="48" rx="4" fill="#0f172a" opacity="0.5"/>
    <!-- Paper -->
    <rect x="-20" y="-25" width="38" height="48" rx="4" fill="#f8fafc"/>
    <!-- Question Marks / Lines -->
    <circle cx="-1" cy="-8" r="6" fill="#ef4444" opacity="0.2"/>
    <text x="-3" y="-3" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ef4444">?</text>
    <line x1="-12" y1="5" x2="8" y2="5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="12" x2="2" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="19" x2="5" y2="19" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Clip -->
    <rect x="-6" y="-30" width="12" height="7" rx="2" fill="#38bdf8"/>
  </g>

  <!-- Right Element: Answer Paper & Holder -->
  <g transform="translate(180, 95)">
    <!-- Paper shadow -->
    <rect x="-18" y="-23" width="38" height="48" rx="4" fill="#0f172a" opacity="0.5"/>
    <!-- Paper -->
    <rect x="-20" y="-25" width="38" height="48" rx="4" fill="#f8fafc"/>
    <!-- Answer Check / Lines -->
    <circle cx="-1" cy="-8" r="6" fill="#10b981" opacity="0.2"/>
    <path d="M-5 -8 L-2 -5 L5 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-12" y1="5" x2="8" y2="5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="12" x2="4" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="19" x2="-2" y2="19" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Clip -->
    <rect x="-6" y="-30" width="12" height="7" rx="2" fill="#10b981"/>
  </g>

  <!-- Central Character: Focused Student / Thinker -->
  <g transform="translate(120, 115)">
    <!-- Body / Torso with Jacket -->
    <path d="M-25 50 C-25 30 -15 25 0 25 C15 25 25 30 25 50 L30 85 L-30 85 Z" fill="#3b82f6"/>
    <!-- Inner Shirt Collar -->
    <path d="M-8 25 L0 35 L8 25 Z" fill="#f8fafc"/>
    <path d="M0 35 L0 65" stroke="#1d4ed8" stroke-width="2" opacity="0.4"/>

    <!-- Neck -->
    <rect x="-6" y="16" width="12" height="14" fill="#fdba74"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="22" fill="#fed7aa"/>

    <!-- Hair Style (Stylized modern neat hair) -->
    <path d="M-21 -5 C-22 -20 -10 -24 2 -24 C16 -24 22 -15 22 -3 C22 2 20 8 20 8 C20 8 16 0 10 -5 C4 -10 -6 -5 -21 -5 Z" fill="#1e293b"/>
    <path d="M-18 -10 C-15 -18 -5 -21 5 -19 C12 -18 18 -10 19 -5 C12 -12 0 -12 -18 -10 Z" fill="#334155"/>

    <!-- Facial Expression (Thoughtful, solving a problem) -->
    <!-- Eyes closed happily/concentrated or arched brow -->
    <path d="M-10 -3 Q-6 -7 -2 -3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M2 -3 Q6 -7 10 -3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Smile -->
    <path d="M-4 6 Q0 10 4 6" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="-13" cy="3" r="3.5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="13" cy="3" r="3.5" fill="#f43f5e" opacity="0.3"/>

    <!-- Arms interacting with papers -->
    <!-- Left Arm holding question -->
    <path d="M-22 35 C-35 45 -42 60 -45 75" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-45" cy="75" r="5" fill="#fdba74"/>

    <!-- Right Arm holding answer -->
    <path d="M22 35 C35 45 42 60 45 75" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="45" cy="75" r="5" fill="#fdba74"/>
  </g>

  <!-- Foreground Desk Props -->
  <!-- Coffee Mug -->
  <g transform="translate(155, 155)">
    <rect x="0" y="0" width="16" height="18" rx="3" fill="#f8fafc"/>
    <path d="M16 4 C20 4 21 12 16 14" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M3 3 L13 3" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Coffee liquid inside -->
    <ellipse cx="8" cy="3" rx="5" ry="1.5" fill="#78350f"/>
  </g>

  <!-- Pen / Pencil Stand -->
  <g transform="translate(70, 150)">
    <rect x="0" y="0" width="12" height="22" rx="3" fill="#cbd5e1"/>
    <path d="M3 0 L2 -8" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M9 0 L10 -10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M6 0 L6 -6" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>