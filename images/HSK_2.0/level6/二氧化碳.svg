<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm sunbeam glow -->
    <linearGradient id="sunbeam" x1="180" y1="0" x2="60" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing CO2 particle gradient -->
    <radialGradient id="co2Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <!-- Pot gradient -->
    <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Character skin gradient -->
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Sunbeam overlay -->
  <rect width="240" height="240" rx="24" fill="url(#sunbeam)"/>

  <!-- Interior Wall & Bookshelf Background Context -->
  <path d="M0 170 H240 V240 H0 Z" fill="#090d16" opacity="0.6"/>
  <!-- Window frame background light -->
  <rect x="140" y="20" width="80" height="130" rx="4" fill="#334155" opacity="0.2"/>
  <path d="M180 20 V150 M140 85 H220" stroke="#1e293b" stroke-width="3"/>

  <!-- SCENE OBJECTS: Potted Monstera / Leafy Plant (Thực vật) -->
  <g id="plant-pot">
    <!-- Plant Table -->
    <rect x="65" y="165" width="70" height="8" rx="2" fill="#475569"/>
    <path d="M75 173 L80 215 H125 L130 173 Z" fill="#334155"/>
    
    <!-- Flowerpot -->
    <path d="M85 145 L92 170 H118 L125 145 Z" fill="url(#potGrad)"/>
    <ellipse cx="105" cy="145" rx="20" ry="4" fill="#f97316"/>
    <ellipse cx="105" cy="147" rx="17" ry="3" fill="#78350f"/>

    <!-- Plant Stems & Lush Leaves -->
    <!-- Center Main Stem -->
    <path d="M105 145 C102 120 105 100 100 80" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M100 110 C70 100 50 120 60 140 C70 150 90 140 100 110 Z" fill="url(#leafGrad)"/>
    <path d="M100 110 Q75 125 62 138" stroke="#a7f3d0" stroke-width="1.5" fill="none"/>

    <!-- Right Large Leaf -->
    <path d="M102 95 C130 80 150 105 140 125 C130 140 110 125 102 95 Z" fill="url(#leafGrad)"/>
    <path d="M102 95 Q125 105 138 120" stroke="#a7f3d0" stroke-width="1.5" fill="none"/>

    <!-- Top Sprouting Leaf -->
    <path d="M100 80 C100 55 85 45 75 55 C65 65 75 85 100 80 Z" fill="url(#leafGrad)"/>
    <path d="M100 80 Q85 65 78 58" stroke="#a7f3d0" stroke-width="1.5" fill="none"/>
    
    <path d="M100 85 C115 65 135 70 135 85 C135 100 110 95 100 85 Z" fill="#10b981"/>
  </g>

  <!-- CHARACTER: Young Botanist / Student actively caring for environment -->
  <g id="character">
    <!-- Torso & Arms -->
    <path d="M25 210 C25 190 40 180 55 180 C70 180 85 190 85 210 Z" fill="#3b82f6"/>
    <!-- Sleeves / Shoulders -->
    <circle cx="32" cy="188" r="10" fill="#2563eb"/>
    <circle cx="78" cy="188" r="10" fill="#2563eb"/>

    <!-- Neck -->
    <rect x="49" y="165" width="12" height="18" fill="url(#skin)"/>

    <!-- Head -->
    <circle cx="55" cy="148" r="18" fill="url(#skin)"/>

    <!-- Hair (Trendy styled) -->
    <path d="M37 148 C37 132 50 130 55 130 C65 130 73 135 73 148 C73 150 71 144 68 142 C62 138 48 138 42 143 C39 145 37 148 37 148 Z" fill="#1e293b"/>
    <path d="M39 146 C42 138 52 135 60 136 C67 137 71 142 73 148 C70 144 63 140 55 140 C47 140 42 143 39 146 Z" fill="#334155"/>

    <!-- Friendly Facial Expression -->
    <!-- Eyes (Happy closed arcs) -->
    <path d="M47 150 Q50 154 53 150" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M58 150 Q61 154 64 150" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Cheeks (Warm blush) -->
    <circle cx="47" cy="155" r="4" fill="#fb7185" opacity="0.5"/>
    <circle cx="63" cy="155" r="4" fill="#fb7185" opacity="0.5"/>
    <!-- Smiling Mouth -->
    <path d="M52 158 Q55 162 58 158" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Hand holding a spray bottle or pointing gently -->
    <path d="M75 190 L85 185 L90 192 L82 198 Z" fill="url(#skin)"/>
  </g>

  <!-- SCIENTIFIC/VISUAL METAPHOR: Absorption of CO2 (二氧化碳) -->
  <!-- Floating CO2 molecules moving gracefully from left/air towards the green plant leaves -->
  
  <!-- Ambient floating molecule 1 (Far background) -->
  <g opacity="0.6">
    <circle cx="35" cy="90" r="12" fill="url(#co2Glow)"/>
    <text x="35" y="94" font-family="sans-serif" font-weight="bold" font-size="9" fill="#e0f2fe" text-anchor="middle">CO₂</text>
  </g>

  <!-- Ambient floating molecule 2 (Mid background) -->
  <g opacity="0.8">
    <circle cx="75" cy="65" r="15" fill="url(#co2Glow)"/>
    <text x="75" y="69" font-family="sans-serif" font-weight="bold" font-size="11" fill="#e0f2fe" text-anchor="middle">CO₂</text>
  </g>

  <!-- Main highlighted molecule being actively absorbed by the top plant leaf -->
  <g transform="translate(0, 0)">
    <!-- Motion trail / flow lines -->
    <path d="M85 85 Q92 82 98 81" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" fill="none" opacity="0.8"/>
    <path d="M70 100 Q80 95 90 88" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" fill="none" opacity="0.8"/>

    <!-- CO2 Particle Bubble entering leaf -->
    <circle cx="98" cy="81" r="16" fill="url(#co2Glow)"/>
    <circle cx="98" cy="81" r="16" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.9"/>
    <!-- Crisp text replacement inside vector using stylized clean geometry/shapes or clear font rendering -->
    <text x="98" y="85" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">CO₂</text>
  </g>

  <!-- Sparkling Absorption Energy Effects (Photosynthesis / Oxygen release hints) -->
  <g fill="#34d399">
    <circle cx="120" cy="70" r="3" opacity="0.9"/>
    <circle cx="135" cy="90" r="2" opacity="0.7"/>
    <circle cx="115" cy="50" r="2.5" opacity="0.8"/>
    <!-- Tiny upward oxygen bubbles/sparkles -->
    <path d="M115 45 L117 40 L119 45 Z" fill="#a7f3d0"/>
    <path d="M130 65 L131.5 61 L133 65 Z" fill="#a7f3d0"/>
  </g>

  <!-- Foreground Atmospheric Details -->
  <!-- Cozy desk surface -->
  <path d="M0 215 H240 V240 H0 Z" fill="#0b0f19"/>
  <!-- Pen holder or book edge on desk for realism -->
  <rect x="180" y="200" width="30" height="15" rx="3" fill="#334155"/>
  <rect x="188" y="190" width="4" height="15" fill="#ec4899"/>
  <rect x="196" y="193" width="4" height="12" fill="#38bdf8"/>
</svg>