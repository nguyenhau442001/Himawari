<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Glowing release aura -->
  <circle cx="120" cy="120" r="50" fill="#FFB703" opacity="0.1"/>

  <!-- Open Modern Prison Cell / Gate (Left & Right bars fading out) -->
  <g opacity="0.4" stroke="#4A5568" stroke-width="4" stroke-linecap="round">
    <!-- Left bars -->
    <line x1="50" y1="70" x2="50" y2="170"/>
    <line x1="70" y1="70" x2="70" y2="170"/>
    <!-- Right bars -->
    <line x1="170" y1="70" x2="170" y2="170"/>
    <line x1="190" y1="70" x2="190" y2="170"/>
  </g>

  <!-- Broken/Opening Shackle at the center representing "Released" -->
  <g transform="translate(120, 120)">
    <!-- Shackle top broken and flying up-right -->
    <path d="M-22,-5 C-22,-20 -10,-28 2,-26 C12,-24 20,-16 26,-8" fill="none" stroke="#FFB703" stroke-width="8" stroke-linecap="round" transform="translate(15, -15) rotate(25)" />
    
    <!-- Shackle bottom base -->
    <path d="M-22,-5 C-22,15 22,15 22,-5" fill="none" stroke="#FFB703" stroke-width="8" stroke-linecap="round" />
    
    <!-- Chain links falling away -->
    <path d="M-8,18 L-15,30 M8,18 L15,30" fill="none" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Freedom / Release Dynamic Elements (Birds / Sparkles flying out) -->
  <g fill="#FFB703">
    <!-- Stylized soaring bird / upward motion -->
    <path d="M 155,95 Q 165,85 180,80 Q 168,92 165,105 Z" />
    <path d="M 140,75 Q 147,67 158,63 Q 150,72 148,82 Z" />
    <circle cx="130" cy="65" r="3" opacity="0.8"/>
    <circle cx="170" cy="130" r="2" opacity="0.6"/>
  </g>

  <!-- Highlight glow effect -->
  <circle cx="120" cy="100" r="20" fill="#FFF" opacity="0.05" filter="blur(5px)"/>
</svg>