<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Outer glow / aura representing life/generation -->
    <circle cx="0" cy="5" r="54" fill="#FFB703" opacity="0.1" />
    <circle cx="0" cy="5" r="44" fill="#FFB703" opacity="0.15" />

    <!-- Stylized parent hands cupping the new life -->
    <path d="M-55,30 C-45,45 -25,50 0,50 C25,50 45,45 55,30 C40,42 20,42 0,42 C-20,42 -40,42 -55,30 Z" fill="#90E0EF" opacity="0.3" />

    <!-- Leaves/Sprouts symbolizing birth, growth, and new generation -->
    <path d="M-8,-15 C-25,-30 -40,-15 -30,5 C-22,18 -10,30 0,45 C10,30 22,18 30,5 C40,-15 25,-30 8,-15 Z" fill="#2A9D8F" />

    <!-- Central glowing infant / seed of life symbol -->
    <circle cx="0" cy="-2" r="16" fill="#F4A261" />
    <circle cx="0" cy="-2" r="12" fill="#E76F51" />
    
    <!-- Abstract happy face/heart hint on the central newborn -->
    <circle cx="-4" cy="-4" r="1.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="4" cy="-4" r="1.5" fill="#FFFFFF" opacity="0.8" />
    <path d="M-2,3 C0,5 2,5 4,3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Floating accent particles symbolizing vitality and policy/future context -->
    <circle cx="-50" cy="-20" r="3" fill="#FFB703" opacity="0.8" />
    <circle cx="55" cy="-25" r="2.5" fill="#FFB703" opacity="0.6" />
    <circle cx="45" cy="25" r="2" fill="#90E0EF" opacity="0.8" />
    <circle cx="-45" cy="35" r="2" fill="#2A9D8F" opacity="0.7" />
    <path d="M 0,-48 L 3,-42 L 9,-42 L 4,-38 L 6,-32 L 0,-35 L -6,-32 L -4,-38 L -9,-42 L -3,-42 Z" fill="#FFB703" transform="scale(0.6) translate(0, -95)" />
  </g>
</svg>