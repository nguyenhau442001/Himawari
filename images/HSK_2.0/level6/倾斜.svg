<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#111c2e" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Building Gradient -->
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Stars / Night Sky Details -->
  <circle cx="30" cy="40" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="70" cy="25" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="200" cy="35" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="215" cy="70" r="1.2" fill="#f8fafc" opacity="0.7"/>

  <!-- Distant Background Buildings -->
  <rect x="10" y="90" width="35" height="150" fill="#1e293b" opacity="0.5" />
  <rect x="180" y="70" width="50" height="170" fill="#1e293b" opacity="0.6" />
  <rect x="140" y="110" width="30" height="130" fill="#1e293b" opacity="0.4" />

  <!-- GROUND / STREET LEVEL -->
  <!-- Sidewalk -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#0f172a" />
  <!-- Street Curbside -->
  <path d="M 0 195 L 240 195 L 240 200 L 0 200 Z" fill="#334155" />
  <!-- Street Light Cone / Ambient Ground Glow -->
  <ellipse cx="120" cy="200" rx="90" ry="15" fill="#38bdf8" opacity="0.15" />

  <!-- THE TILTED BUILDING (倾斜的楼) -->
  <!-- We group and rotate it slightly (e.g., -5 degrees) from its base pivot at (90, 195) -->
  <g transform="translate(95, 195) rotate(-6) translate(-95, -195)">
    <!-- Building Shadow on Ground/Background -->
    
    <!-- Main Structure -->
    <path d="M 60 50 L 130 50 L 130 195 L 60 195 Z" fill="url(#buildingGrad)" />
    
    <!-- Architectural Side Pillar -->
    <path d="M 55 50 L 60 50 L 60 195 L 55 195 Z" fill="#1e293b" />
    <path d="M 130 50 L 135 50 L 135 195 L 130 195 Z" fill="#0f172a" />

    <!-- Roof details -->
    <path d="M 52 45 L 138 45 L 130 50 L 60 50 Z" fill="#64748b" />
    <rect x="85" y="32" width="6" height="15" fill="#64748b" />
    <circle cx="88" cy="30" r="2" fill="#ef4444" /> <!-- Warning light -->

    <!-- Windows Grid & Warm Glow -->
    <!-- Row 1 -->
    <rect x="70" y="65" width="15" height="20" rx="2" fill="url(#windowGlow)" />
    <rect x="95" y="65" width="15" height="20" rx="2" fill="#0f172a" />
    <rect x="110" y="65" width="10" height="20" rx="2" fill="url(#windowGlow)" opacity="0.7"/>

    <!-- Row 2 -->
    <rect x="70" y="95" width="15" height="20" rx="2" fill="#0f172a" />
    <rect x="95" y="95" width="15" height="20" rx="2" fill="url(#windowGlow)" />
    <rect x="110" y="95" width="10" height="20" rx="2" fill="#0f172a" />

    <!-- Row 3 -->
    <rect x="70" y="125" width="15" height="20" rx="2" fill="url(#windowGlow)" />
    <rect x="95" y="125" width="15" height="20" rx="2" fill="url(#windowGlow)" />
    <rect x="110" y="125" width="10" height="20" rx="2" fill="#0f172a" />

    <!-- Row 4 -->
    <rect x="70" y="155" width="15" height="20" rx="2" fill="#0f172a" />
    <rect x="95" y="155" width="15" height="20" rx="2" fill="url(#windowGlow)" />
    <rect x="110" y="155" width="10" height="20" rx="2" fill="url(#windowGlow)" />
  </g>

  <!-- REFERENCE PLUMB LINE (Shows the tilt clearly) -->
  <!-- Dashed vertical reference line hanging from top -->
  <line x1="95" y1="45" x2="95" y2="195" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <!-- Plumb bob weight at the bottom -->
  <polygon points="92,185 98,185 95,195" fill="#38bdf8" opacity="0.8" />

  <!-- FOREGROUND CHARACTERS (Observing the tilt) -->
  <!-- Character 1: Man pointing at the building -->
  <g transform="translate(150, 160)">
    <!-- Body / Jacket -->
    <path d="M 12 25 L 24 22 L 30 40 L 22 40 L 24 65 L 12 65 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="18" cy="12" r="8" fill="#fde047" />
    <!-- Hair -->
    <path d="M 10 10 Q 18 4 26 10 L 25 14 L 11 14 Z" fill="#334155" />
    <!-- Face expression (curious/surprised) -->
    <circle cx="21" cy="12" r="1" fill="#1e293b" />
    <!-- Arm pointing left towards the building -->
    <path d="M 14 26 Q -2 20 -10 15" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="-10" cy="15" r="3" fill="#fde047" /> <!-- Hand -->
    <!-- Legs -->
    <path d="M 15 65 L 12 85 L 18 85 L 20 65 Z" fill="#1e293b" />
    <path d="M 21 65 L 24 85 L 30 85 L 26 65 Z" fill="#1e293b" />
  </g>

  <!-- Character 2: Woman holding a clipboard / measuring -->
  <g transform="translate(185, 155)">
    <!-- Body / Coat -->
    <path d="M 10 20 L 22 24 L 26 65 L 16 65 L 14 40 L 8 65 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="16" cy="10" r="7.5" fill="#fde047" />
    <!-- Hair bun -->
    <circle cx="23" cy="8" r="3" fill="#475569" />
    <path d="M 9 9 Q 16 3 21 8 L 20 12 L 10 12 Z" fill="#475569" />
    <!-- Clipboard in hands -->
    <rect x="-2" y="28" width="12" height="15" rx="1" fill="#f8fafc" />
    <path d="M 2 26 L 8 26 L 8 29 L 2 29 Z" fill="#94a3b8" />
    <!-- Arms -->
    <path d="M 18 24 L 4 30" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <!-- Legs -->
    <path d="M 14 65 L 12 90 L 16 90 L 18 65 Z" fill="#334155" />
    <path d="M 19 65 L 22 90 L 26 90 L 24 65 Z" fill="#334155" />
  </g>

  <!-- ENVIRONMENT PROPS -->
  <!-- Street Lamp -->
  <rect x="25" y="110" width="4" height="90" fill="#475569" />
  <path d="M 27 110 L 15 95 L 20 93 L 29 108 Z" fill="#64748b" />
  <circle cx="14" cy="95" r="5" fill="#fbbf24" />
  <ellipse cx="14" cy="95" rx="2" ry="2" fill="#fff" />
  <!-- Light beam cast down -->
  <path d="M 12 98 L -5 200 L 50 200 Z" fill="#fbbf24" opacity="0.1" />

  <!-- Potted Plant on Sidewalk -->
  <path d="M 115 190 L 125 190 L 127 200 L 113 200 Z" fill="#94a3b8" />
  <path d="M 118 190 Q 120 175 110 170" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 122 190 Q 125 178 132 173" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="110" cy="170" r="3" fill="#34d399" />
  <circle cx="132" cy="173" r="3" fill="#34d399" />

  <!-- Foreground Atmospheric Particles / Dust / Sparkles -->
  <circle cx="70" cy="120" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="85" cy="80" r="1" fill="#fbbf24" opacity="0.7"/>
  <circle cx="130" cy="150" r="1.2" fill="#f43f5e" opacity="0.5"/>
  <circle cx="160" cy="110" r="1" fill="#38bdf8" opacity="0.8"/>
</svg>