<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shield/Barrier Energy Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Hero Character Gradient -->
    <linearGradient id="heroSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Invader/Threat Gradient -->
    <linearGradient id="invaderSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (City ruins / hills under siege) -->
  <g opacity="0.3">
    <!-- Distant ruined structures -->
    <path d="M20,180 L20,130 L40,110 L50,110 L50,180 Z" fill="#334155" />
    <path d="M60,180 L60,95 L85,75 L110,95 L110,180 Z" fill="#334155" />
    <path d="M180,180 L180,120 L210,100 L230,120 L230,180 Z" fill="#334155" />
    <!-- Smokey clouds / atmosphere -->
    <circle cx="50" cy="60" r="25" fill="#475569" opacity="0.2" filter="url(#glow)" />
    <circle cx="190" cy="50" r="30" fill="#475569" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="175" width="240" height="65" fill="url(#groundGrad)" />
  <path d="M0,175 Q120,165 240,175 L240,240 L0,240 Z" fill="#090d16" opacity="0.5" />
  
  <!-- Impact Debris & Crater Details on Ground -->
  <ellipse cx="140" cy="180" rx="25" ry="6" fill="#0f172a" />
  <path d="M130,178 L125,172 M150,179 L155,173 M140,182 L142,175" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- THREAT / INVADER SIDE (Right side) -->
  <g transform="translate(170, 115)">
    <!-- Invader Hover Pod / Machine -->
    <ellipse cx="15" cy="50" rx="22" ry="8" fill="#f43f5e" opacity="0.3" filter="url(#glow)" />
    <path d="M -5,35 Q 15,20 35,35 L 45,55 Q 15,65 -15,55 Z" fill="url(#invaderSuit)" />
    <!-- Optical Sensor/Eye -->
    <circle cx="15" cy="45" r="7" fill="#111827" />
    <circle cx="15" cy="45" r="4" fill="#fb7185" filter="url(#glow)" />
    
    <!-- Projectile / Energy Blast moving towards the left -->
    <g transform="translate(-55, -5)">
      <ellipse cx="0" cy="45" rx="10" ry="4" fill="#fb923c" filter="url(#glow)" />
      <path d="M 10,45 L 25,45" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- DEFENDER / HEROIC CITIZEN SIDE (Left-Center) -->
  <!-- Energy Shield Barrier (The core concept of 'Resistance') -->
  <g transform="translate(105, 110)">
    <!-- Shield Field Projection -->
    <path d="M -15,-45 Q 10,-55 25,-35 Q 40,0 25,45 Q 10,65 -15,55 Q -30,20 -15,-45 Z" fill="url(#shieldGrad)" filter="url(#glow)" />
    <path d="M -10,-40 Q 10,-48 20,-30 Q 32,0 20,40 Q 10,55 -10,48 Q -22,18 -10,-40 Z" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8" />
    <!-- Impact Ripple on Shield -->
    <circle cx="5" cy="10" r="14" fill="none" stroke="#7dd3fc" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Heroic Defender Character -->
  <g transform="translate(75, 115)">
    <!-- Character Shadow -->
    <ellipse cx="10" cy="63" rx="18" ry="5" fill="#000000" opacity="0.6" />

    <!-- Left Leg (Braced back) -->
    <path d="M 5,45 L -8,60 L -15,60" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Leg (Forward stance) -->
    <path d="M 15,45 L 22,60 L 30,60" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Torso (Dynamic lean forward for resistance) -->
    <path d="M 0,20 L 25,25 L 20,50 L -2,45 Z" fill="url(#heroSuit)" />

    <!-- Scarf / Cape flowing backward -->
    <path d="M 5,15 Q -15,18 -30,10 Q -20,25 -5,22 Z" fill="#ef4444" />

    <!-- Left Arm (Extending forward, holding/projecting shield) -->
    <path d="M 5,23 L 30,35" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    
    <!-- Right Arm (Braced, bent) -->
    <path d="M 15,22 L 25,38 L 15,45" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Head & Determined Facial Expression -->
    <g transform="translate(10, 5)">
      <!-- Hair -->
      <path d="M -8,-5 Q 2,-16 14,-8 Q 18,-2 12,2 Z" fill="#1e293b" />
      <!-- Face Base -->
      <circle cx="5" cy="4" r="10" fill="#fde047" />
      <!-- Determined Eyebrow & Eyes (Slanted for resistance/bravery) -->
      <path d="M 1,2 L 8,3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <circle cx="8" cy="6" r="1.5" fill="#1e293b" />
      <!-- Determined Mouth -->
      <path d="M 6,10 L 11,10" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- FOREGROUND / ATMOSPHERIC DETAILS -->
  <!-- Sparks and Energy Particles flying from the shield impact -->
  <g fill="#38bdf8">
    <circle cx="100" cy="110" r="2.5" filter="url(#glow)" />
    <circle cx="95" cy="130" r="1.5" />
    <circle cx="115" cy="95" r="2" filter="url(#glow)" />
    <circle cx="90" cy="90" r="1" />
  </g>
  <g fill="#fb923c">
    <circle cx="108" cy="120" r="2" filter="url(#glow)" />
    <circle cx="102" cy="100" r="1.5" />
  </g>

  <!-- Foreground debris elements framing the bottom corners -->
  <path d="M0,240 L0,225 L15,240 Z" fill="#0f172a" />
  <path d="M240,240 L240,215 L215,240 Z" fill="#0f172a" />
</svg>