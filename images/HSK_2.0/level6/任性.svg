<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Wallpaper Pattern / Stripes -->
  <g opacity="0.15">
    <path d="M40 0 L40 170 M80 0 L80 170 M120 0 L120 170 M160 0 L160 170 M200 0 L200 170" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Wall & Floor Divider -->
  <rect x="0" y="165" width="240" height="75" fill="url(#floorGrad)"/>
  <line x1="0" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="3"/>

  <!-- Background Window showing night -->
  <rect x="25" y="30" width="55" height="80" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <path d="M52.5 30 L52.5 110 M25 70 L80 70" stroke="#475569" stroke-width="1.5"/>
  <!-- Stars outside -->
  <circle cx="38" cy="45" r="1" fill="#fbbf24"/>
  <circle cx="68" cy="55" r="1.5" fill="#f8fafc"/>
  <circle cx="45" cy="90" r="1" fill="#f8fafc"/>

  <!-- Bookshelf Background Prop -->
  <g transform="translate(180, 45)">
    <rect x="0" y="0" width="40" height="120" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="80" x2="40" y2="80" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="6" y="15" width="8" height="25" rx="1" fill="#ef4444"/>
    <rect x="15" y="18" width="6" height="22" rx="1" fill="#38bdf8"/>
    <rect x="23" y="12" width="10" height="28" rx="1" fill="#10b981"/>
    <rect x="5" y="55" width="12" height="25" rx="1" fill="#f59e0b"/>
    <rect x="19" y="58" width="9" height="22" rx="1" fill="#ec4899"/>
  </g>

  <!-- Hanging Pendant Light -->
  <line x1="120" y1="0" x2="120" y2="35" stroke="#64748b" stroke-width="2"/>
  <path d="M105 35 L135 35 L140 45 L100 45 Z" fill="#64748b"/>
  <circle cx="120" cy="45" r="25" fill="url(#lampGlow)"/>

  <!-- MAIN CHARACTERS & ACTION (Childhood Stubbornness: "她从小就很任性") -->
  
  <!-- The Parent / Adult Figure (Trying to reason, holding a toy/book) -->
  <g transform="translate(45, 80)">
    <!-- Body & Dress -->
    <path d="M25 45 Q25 30 35 30 L45 30 Q55 30 55 45 L65 85 L15 85 Z" fill="#3b82f6" filter="url(#shadow)"/>
    <!-- Head & Face -->
    <circle cx="40" cy="20" r="12" fill="#fbcfe8"/>
    <!-- Hair (Mom/Adult) -->
    <path d="M28 15 C28 8 52 8 52 15 C52 22 48 30 40 30 C32 30 28 22 28 15 Z" fill="#475569"/>
    <!-- Gentle/Concerned Expression -->
    <circle cx="36" cy="19" r="1.5" fill="#1e293b"/>
    <circle cx="44" cy="19" r="1.5" fill="#1e293b"/>
    <path d="M38 25 Q40 23 42 25" stroke="#1e293b" stroke-width="1" fill="none" stroke-linecap="round"/>
    
    <!-- Arms (Offering peacefully) -->
    <path d="M25 40 Q10 45 15 55" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Holding a book/object -->
    <rect x="5" y="48" width="14" height="10" rx="1" fill="#fb923c"/>
  </g>

  <!-- The Child Character (Stubborn, arms crossed, turning head away) -->
  <g transform="translate(110, 85)">
    <!-- Shadow beneath child -->
    <ellipse cx="40" cy="80" rx="25" ry="6" fill="#0f172a" opacity="0.6"/>

    <!-- Child Body / Outfit (Cute yellow toddler hoodie) -->
    <path d="M25 35 Q25 25 35 25 L45 25 Q55 25 55 35 L60 80 L20 80 Z" fill="#fbbf24" filter="url(#shadow)"/>
    <!-- Hoodie Pocket & Details -->
    <path d="M30 65 L50 65 L45 75 L35 75 Z" fill="#f59e0b"/>

    <!-- Head (Turned sharply to the side / defiant angle) -->
    <circle cx="40" cy="18" r="14" fill="#ffedd5"/>
    
    <!-- Child Hair (Messy cute bob) -->
    <path d="M25 12 C25 2 55 2 55 12 C55 18 50 24 40 24 C30 24 25 18 25 12 Z" fill="#78350f"/>
    <!-- Front bangs covering one eye slightly -->
    <path d="M30 12 Q40 22 48 15" fill="#78350f"/>

    <!-- Stubborn Face Expression (Pouting, eyes looking away angrily) -->
    <!-- Eyebrows furrowed down -->
    <path d="M33 14 L38 16" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M44 16 L49 14" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyes (looking sideways/away to the right) -->
    <circle cx="36" cy="18" r="1.5" fill="#1e293b"/>
    <circle cx="44" cy="18" r="1.5" fill="#1e293b"/>
    <!-- Pouting puffy cheeks & grumpy mouth -->
    <path d="M38 23 Q40 21 42 23" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="33" cy="21" r="2.5" fill="#fecaca" opacity="0.6"/>
    <circle cx="47" cy="21" r="2.5" fill="#fecaca" opacity="0.6"/>

    <!-- Stubborn Arms Crossed tightly over chest -->
    <path d="M22 40 Q40 45 58 40" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M24 48 Q40 52 56 46" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Little hands tucked in -->
    <circle cx="23" cy="44" r="3" fill="#ffedd5"/>
    <circle cx="57" cy="43" r="3" fill="#ffedd5"/>

    <!-- Legs stomping / planted firmly -->
    <rect x="28" y="78" width="8" height="12" rx="3" fill="#3b82f6"/>
    <rect x="44" y="78" width="8" height="12" rx="3" fill="#3b82f6"/>
    <!-- Shoes -->
    <ellipse cx="32" cy="90" rx="6" ry="3" fill="#ef4444"/>
    <ellipse cx="48" cy="90" rx="6" ry="3" fill="#ef4444"/>
  </g>

  <!-- PROPS TO COMPLETE THE SCENE (Living Room Context) -->
  <!-- Low Wooden Coffee Table -->
  <g transform="translate(80, 145)" filter="url(#shadow)">
    <!-- Table Top -->
    <path d="M0 10 L120 10 L110 30 L10 30 Z" fill="#b45309"/>
    <path d="M0 5 L120 5 L120 10 L0 10 Z" fill="#d97706"/>
    <!-- Table Legs -->
    <rect x="15" y="30" width="6" height="25" fill="#92400e"/>
    <rect x="99" y="30" width="6" height="25" fill="#92400e"/>
    
    <!-- Discarded / Rejected Toys on Table (Emphasizing stubbornness/capriciousness) -->
    <!-- Toy Block Stack knocked over -->
    <rect x="30" y="-5" width="12" height="15" rx="1" fill="#ec4899"/>
    <rect x="45" y="2" width="15" height="8" rx="1" fill="#10b981"/>
    <rect x="35" id="block3" x="38" y="-12" width="10" height="8" rx="1" fill="#38bdf8" transform="rotate(15 43 -8)"/>
    
    <!-- Stuffed Teddy Bear sitting rejected -->
    <g transform="translate(75, -8)">
      <circle cx="10" cy="5" r="7" fill="#d97706"/>
      <circle cx="5" cy="1" r="3" fill="#b45309"/>
      <circle cx="15" cy="1" r="3" fill="#b45309"/>
      <ellipse cx="10" cy="15" rx="8" ry="10" fill="#d97706"/>
      <circle cx="10" cy="14" r="4" fill="#fef3c7"/>
    </g>
  </g>

  <!-- Potted Plant in Corner -->
  <g transform="translate(15, 125)">
    <path d="M5 25 L15 55 L35 55 L45 25 Z" fill="#e2e8f0"/>
    <ellipse cx="25" cy="25" rx="20" ry="6" fill="#cbd5e1"/>
    <!-- Plant Leaves -->
    <path d="M25 25 Q10 10 5 -5 Q20 5 25 25 Z" fill="#10b981"/>
    <path d="M25 25 Q35 5 45 -10 Q35 10 25 25 Z" fill="#059669"/>
    <path d="M25 25 Q25 -5 25 -20 Q25 0 25 25 Z" fill="#34d399"/>
  </g>

  <!-- Dynamic Accent Details (Subtle atmospheric mood cues, no text) -->
  <g opacity="0.6">
    <!-- Little huff/sigh cloud near child's head -->
    <path d="M165 95 Q170 93 173 96 Q177 94 179 97 Q175 101 165 95 Z" fill="#94a3b8" opacity="0.7"/>
  </g>
</svg>