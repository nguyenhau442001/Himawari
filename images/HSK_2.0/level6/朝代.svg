<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Tang Dynasty Architecture Elements -->
  <path d="M40 180 L200 180 L190 120 L50 120 Z" fill="#334155"/>
  <path d="M50 120 L120 80 L190 120 Z" fill="#fb923c"/>
  <path d="M60 120 L120 90 L180 120 Z" fill="#f59e0b"/>
  
  <!-- Prosperity Elements (Lanterns and Silk) -->
  <circle cx="70" cy="140" r="12" fill="#ec4899"/>
  <circle cx="170" cy="140" r="12" fill="#ec4899"/>
  <path d="M70 152 L70 170" stroke="#fbbf24" stroke-width="2"/>
  <path d="M170 152 L170 170" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Scholar Character -->
  <g transform="translate(100, 150)">
    <ellipse cx="20" cy="20" rx="15" ry="18" fill="#fde68a"/>
    <path d="M10 35 Q20 45 30 35" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="40" rx="5" fill="#38bdf8"/>
    <path d="M5 45 L0 70 M35 45 L40 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="15" y="80" width="5" height="10" fill="#1e293b"/>
    <rect x="25" y="80" width="5" height="10" fill="#1e293b"/>
  </g>
  
  <!-- Prosperity Accents -->
  <path d="M30 200 Q60 180 90 200 T150 200" stroke="#10b981" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <circle cx="210" cy="50" r="20" fill="#fbbf24" opacity="0.3"/>
  <circle cx="210" cy="50" r="10" fill="#fbbf24"/>
  
  <!-- Decorative clouds -->
  <path d="M20 60 Q30 50 40 60 T60 60" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M180 70 Q190 60 200 70 T220 70" stroke="#94a3b8" stroke-width="2" fill="none"/>
</svg>