<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background ocean gradient (deep sea underwater) -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Sun rays filtering through water -->
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Diver wetsuit gradient -->
    <linearGradient id="wetsuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Coral gradients -->
    <linearGradient id="coralPink" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="coralOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Full bleed container with dark ocean vibe -->
  <rect width="240" height="240" rx="24" fill="url(#oceanBg)" />

  <!-- Atmospheric light rays from surface -->
  <polygon points="50,0 20,240 70,240" fill="url(#sunRay)" />
  <polygon points="120,0 90,240 150,240" fill="url(#sunRay)" />
  <polygon points="180,0 150,240 210,240" fill="url(#sunRay)" />

  <!-- Background decorative elements (distant sea life and bubbles) -->
  <g fill="#38bdf8" opacity="0.4">
    <circle cx="180" cy="100" r="2" />
    <circle cx="185" cy="85" r="3" />
    <circle cx="182" cy="70" r="1.5" />
    <circle cx="190" cy="55" r="4" />
    
    <circle cx="60" cy="140" r="2" />
    <circle cx="56" cy="125" r="3.5" />
    <circle cx="62" cy="110" r="2" />
  </g>

  <!-- Distant schools of tiny fish -->
  <g fill="#94a3b8" opacity="0.6">
    <ellipse cx="200" cy="130" rx="3" ry="1.5" />
    <ellipse cx="208" cy="127" rx="2.5" ry="1.2" />
    <ellipse cx="212" cy="134" rx="2" ry="1" />
    <ellipse cx="195" cy="138" rx="2.5" ry="1.2" />
  </g>

  <!-- Sea floor / Seabed silhouette -->
  <path d="M0 210 Q40 195 90 205 T180 200 T240 210 L240 240 L0 240 Z" fill="#0b1329" />
  <path d="M0 220 Q60 210 120 220 T240 215 L240 240 L0 240 Z" fill="#060913" />

  <!-- Coral Reefs & Seaweed (Foreground props) -->
  <!-- Left coral cluster -->
  <path d="M10 240 Q15 200 5 185 Q20 195 25 240 Z" fill="url(#coralPink)" />
  <path d="M20 240 Q30 190 40 175 Q45 200 35 240 Z" fill="url(#coralOrange)" />
  <path d="M5 240 Q0 210 12 200 Q2 210 5 240 Z" fill="#ec4899" opacity="0.8" />

  <!-- Right coral cluster -->
  <path d="M210 240 Q205 190 225 170 Q235 200 230 240 Z" fill="url(#coralPink)" />
  <path d="M225 240 Q235 180 245 185 Q240 210 235 240 Z" fill="url(#coralOrange)" />
  <path d="M195 240 Q200 205 190 195 Q205 210 205 240 Z" fill="#38bdf8" opacity="0.5" />

  <!-- Cute Sea Turtle swimming nearby (Context prop) -->
  <g transform="translate(35, 140) rotate(-15)">
    <!-- Flippers -->
    <ellipse cx="10" cy="-8" rx="10" ry="4" fill="#0d9488" transform="rotate(-30 10 -8)" />
    <ellipse cx="10" cy="18" rx="10" ry="4" fill="#0d9488" transform="rotate(30 10 18)" />
    <ellipse cx="-12" cy="-5" rx="6" ry="3" fill="#0d9488" transform="rotate(30 -12 -5)" />
    <ellipse cx="-12" cy="15" rx="6" ry="3" fill="#0d9488" transform="rotate(-30 -12 15)" />
    <!-- Shell -->
    <ellipse cx="0" cy="5" rx="16" ry="12" fill="#14b8a6" />
    <ellipse cx="0" cy="5" rx="12" ry="9" fill="#0f766e" />
    <!-- Head -->
    <circle cx="18" cy="5" r="5" fill="#14b8a6" />
  </g>

  <!-- MAIN SUBJECT: Scuba Diver actively exploring -->
  <g transform="translate(100, 100)">
    
    <!-- Dive Fins -->
    <g transform="translate(-35, 45) rotate(25)">
      <path d="M0 0 L-25 10 L-20 -5 Z" fill="#f59e0b" />
    </g>
    <g transform="translate(-15, 50) rotate(10)">
      <path d="M0 0 L-30 5 L-22 -8 Z" fill="#f59e0b" />
    </g>

    <!-- Oxygen Tank & Straps -->
    <rect x="-18" y="-15" width="12" height="35" rx="6" fill="#cbd5e1" />
    <rect x="-16" y="-12" width="8" height="29" rx="4" fill="#f8fafc" />
    <!-- Tank valve & regulator tube -->
    <rect x="-14" y="-20" width="4" height="6" fill="#64748b" />
    <path d="M -12 -17 C -5 -25 15 -20 20 -2" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Diver Body (Wetsuit) -->
    <path d="M-15 -10 Q-25 10 -30 35 L-10 40 Q-5 15 5 10 L15 35 L30 25 Q15 -5 5 -15 Z" fill="url(#wetsuit)" />
    
    <!-- Arms (posing dynamically, pointing at fish/coral) -->
    <!-- Back arm -->
    <path d="M -10 -5 C -20 5 -35 0 -40 -15" fill="none" stroke="url(#wetsuit)" stroke-width="8" stroke-linecap="round" />
    <!-- Front arm reaching out -->
    <path d="M 10 -10 C 25 -5 40 -15 48 -22" fill="none" stroke="url(#wetsuit)" stroke-width="8" stroke-linecap="round" />
    <!-- Hand / glove -->
    <circle cx="50" cy="-24" r="4" fill="#f59e0b" />

    <!-- Head & Mask -->
    <g transform="translate(15, -25)">
      <!-- Hair / Hood -->
      <path d="M-8 -5 C-12 -15 0 -22 10 -15 C18 -10 15 5 10 10 C5 12 -5 10 -8 -5 Z" fill="#1e293b" />
      
      <!-- Face profile & Mask -->
      <circle cx="5" cy="0" r="9" fill="#fbcfe8" /> <!-- skin tone -->
      
      <!-- Diving Mask frame -->
      <rect x="2" y="-5" rx="3" ry="3" width="14" height="10" fill="#0284c7" />
      <rect x="4" y="-3" rx="2" ry="2" width="10" height="6" fill="#38bdf8" opacity="0.6" />
      <!-- Mask strap -->
      <path d="M 2 -2 C -5 -5 -8 -2 -12 2" fill="none" stroke="#0f172a" stroke-width="2.5" />

      <!-- Regulator Mouthpiece -->
      <rect x="10" y="4" width="6" height="5" rx="2" fill="#334155" />
    </g>

    <!-- Bubbles rising from regulator -->
    <g fill="#38bdf8" opacity="0.7">
      <circle cx="30" cy="-25" r="2.5" />
      <circle cx="35" cy="-38" r="4" />
      <circle cx="32" cy="-52" r="3" />
      <circle cx="38" cy="-68" r="5" />
    </g>
  </g>

  <!-- Cute tropical fish swimming near the diver (Context prop) -->
  <g transform="translate(165, 80)">
    <!-- Fish body -->
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#fb923c" />
    <!-- Fish tail -->
    <polygon points="-10,0 -18,-6 -15,0 -18,6" fill="#ea580c" />
    <!-- White stripe -->
    <path d="M 0 -7 Q 3 0 0 7" fill="none" stroke="#ffffff" stroke-width="3" />
    <!-- Eye -->
    <circle cx="5" cy="-2" r="1.5" fill="#0f172a" />
  </g>

  <g transform="translate(185, 115) scale(0.7)">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#facc15" />
    <polygon points="-10,0 -18,-6 -15,0 -18,6" fill="#ca8a04" />
    <path d="M 0 -7 Q 3 0 0 7" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="5" cy="-2" r="1.5" fill="#0f172a" />
  </g>

  <!-- Gentle water surface glow at the top -->
  <ellipse cx="120" cy="0" rx="140" ry="25" fill="#38bdf8" opacity="0.15" />
</svg>