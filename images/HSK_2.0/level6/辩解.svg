<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Clothing Gradient (Accused) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Clothing Gradient (Stern Manager/Interrogator) -->
    <linearGradient id="mgrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / OFFICE CONTEXT -->
  <!-- Window with City Skyline Silhouette -->
  <g opacity="0.4">
    <rect x="140" y="25" width="70" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="25" x2="175" y2="115" stroke="#334155" stroke-width="2"/>
    <line x1="140" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="2"/>
    <!-- City lights/buildings outside -->
    <rect x="148" y="55" width="8" height="60" fill="#1e293b"/>
    <rect x="160" y="45" width="10" height="70" fill="#1e293b"/>
    <rect x="185" y="60" width="12" height="55" fill="#1e293b"/>
    <circle cx="152" cy="50" r="1" fill="#fbbf24" />
    <circle cx="165" cy="40" r="1" fill="#fbbf24" />
    <circle cx="190" cy="52" r="1" fill="#fbbf24" />
  </g>

  <!-- Office Bookshelf / Props in background -->
  <rect x="25" y="40" width="45" height="70" fill="#131b2e" rx="2"/>
  <line x1="25" y1="65" x2="70" y2="65" stroke="#1e293b" stroke-width="2"/>
  <line x1="25" y1="90" x2="70" y2="90" stroke="#1e293b" stroke-width="2"/>
  <rect x="32" y="48" width="8" height="17" fill="#3b82f6" rx="1"/>
  <rect x="42" y="52" width="6" height="13" fill="#10b981" rx="1"/>
  <rect x="52" y="45" width="10" height="20" fill="#f59e0b" rx="1"/>

  <!-- Office Desk -->
  <path d="M 20 185 L 220 185 L 210 155 L 30 155 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <rect x="25" y="185" width="190" height="8" rx="2" fill="#475569" />

  <!-- Desk Props (Laptop, Folder, Coffee Mug, Open File) -->
  <g>
    <!-- Laptop -->
    <path d="M 120 155 L 155 155 L 160 142 L 115 142 Z" fill="#64748b"/>
    <rect x="117" y="143" width="41" height="11" rx="1" fill="#94a3b8"/>
    <path d="M 105 157 L 170 157 L 175 160 L 100 160 Z" fill="#475569" rx="1"/>
    
    <!-- Open Folder / Papers -->
    <path d="M 50 155 L 75 150 L 95 155 L 70 160 Z" fill="#cbd5e1" filter="url(#shadow)"/>
    <line x1="58" y1="154" x2="68" y2="152" stroke="#64748b" stroke-width="1.5"/>
    <line x1="75" y1="153" x2="85" y2="151" stroke="#64748b" stroke-width="1.5"/>

    <!-- Coffee Mug -->
    <rect x="185" y="144" width="12" height="14" rx="2" fill="#f8fafc"/>
    <path d="M 197 147 C 201 147 201 153 197 153" stroke="#f8fafc" stroke-width="2" fill="none"/>
  </g>


  <!-- CHARACTER 2: THE STERNS / ACCUSER (Right Side) -->
  <g id="accuser" filter="url(#shadow)">
    <!-- Body / Suit -->
    <path d="M 165 210 L 195 210 L 190 145 L 160 145 Z" fill="url(#mgrGrad)" />
    <!-- White Collar & Tie -->
    <polygon points="175,145 180,158 185,145" fill="#f8fafc" />
    <polygon points="178,150 182,150 180,170" fill="#ef4444" />
    
    <!-- Head & Hair -->
    <circle cx="178" cy="115" r="18" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M 162 115 C 162 98 194 98 194 115 L 192 108 C 185 100 170 100 164 108 Z" fill="#334155" /> <!-- Hair -->
    
    <!-- Serious Face Expression -->
    <!-- Eyebrows (Slanted down angrily/skeptically) -->
    <line x1="168" y1="110" x2="176" y2="113" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="180" y1="113" x2="188" y2="110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="172" cy="117" r="1.5" fill="#1e293b"/>
    <circle cx="184" cy="117" r="1.5" fill="#1e293b"/>
    <!-- Stern Mouth -->
    <path d="M 174 127 L 182 127" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Crossed Arms -->
    <path d="M 160 145 C 160 145 175 160 190 145" stroke="#334155" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="162" y="142" width="30" height="12" rx="6" fill="#475569" />
  </g>


  <!-- CHARACTER 1: THE SUBJECT DEFENDING HIMSELF (Left Side) -->
  <g id="subject-defending" filter="url(#shadow)">
    <!-- Body / Dynamic Leaning Forward Pose -->
    <path d="M 75 210 L 105 210 L 100 145 L 75 145 Z" fill="url(#shirtGrad)" />
    
    <!-- Dynamic Gesturing Arms (Showing "Continuous Explanation / Biànjiě") -->
    <!-- Back Arm -->
    <path d="M 80 148 L 60 135 L 50 145" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="48" cy="147" r="5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Front Active Arm Reaching Out / Gesturing -->
    <path d="M 95 148 L 120 130 L 130 120" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="133" cy="118" r="5" fill="#fbcfe8" /> <!-- Open gesturing palm/hand -->

    <!-- Head & Hair (Leaning forward urgently) -->
    <circle cx="88" cy="110" r="18" fill="#fbcfe8" />
    <!-- Messy hair indicating stress/urgency -->
    <path d="M 72 110 C 70 92 104 92 106 105 C 108 98 100 90 88 92 C 78 92 72 100 72 110 Z" fill="#b45309" />
    
    <!-- Expressive Face (Anxious, pleading, earnestly explaining) -->
    <!-- Eyebrows raised in the middle (Worried/Eager) -->
    <path d="M 80 106 Q 84 102 88 106" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 88 106 Q 92 102 96 106" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Eyes (Wide, expressive) -->
    <circle cx="83" cy="112" r="2.5" fill="#1e293b"/>
    <circle cx="93" cy="112" r="2.5" fill="#1e293b"/>
    <circle cx="84" cy="111" r="1" fill="#ffffff"/>
    <circle cx="94" cy="111" r="1" fill="#ffffff"/>
    <!-- Open Mouth (Actively speaking / explaining) -->
    <path d="M 85 120 Q 88 127 91 120" fill="#78350f" />

    <!-- Motion/Action Lines for "Continuous" talking/gesturing -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <path d="M 137 114 Q 142 118 139 125" fill="none"/>
      <path d="M 141 110 Q 148 116 144 124" fill="none"/>
    </g>
    <!-- Sound/Speech Emission visual cues (Abstract floating kinetic dots/waves representing continuous talking without using letters) -->
    <g fill="#fbbf24">
      <circle cx="125" cy="98" r="2.5" opacity="0.9" />
      <circle cx="135" cy="90" r="1.5" opacity="0.7" />
      <circle cx="145" cy="85" r="2" opacity="0.5" />
      <path d="M 120 105 Q 128 98 124 90" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M 128 100 Q 136 92 132 82" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

</svg>