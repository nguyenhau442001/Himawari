<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient representing rich nature -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Golden Sunlight/Bounty Glow -->
    <radialGradient id="sun-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Waterfall/River Gradient -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Scene Base: Lush Natural Environment (Mountains, Waterfall, Giant Tree) -->
  <g id="landscape">
    <!-- Sky & Atmosphere -->
    <rect x="0" y="0" width="240" height="180" rx="24" fill="url(#sky-grad)"/>
    <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#sun-glow)"/>

    <!-- Distant Mountains -->
    <polygon points="0,130 50,80 110,130" fill="#065f46" opacity="0.6"/>
    <polygon points="80,120 150,60 220,130" fill="#047857" opacity="0.8"/>
    <polygon points="170,140 210,95 240,140" fill="#0f766e" opacity="0.7"/>

    <!-- Waterfall Flow -->
    <path d="M165,60 Q170,95 160,130 Q155,150 162,170" fill="none" stroke="url(#water-grad)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <circle cx="162" cy="172" r="10" fill="#38bdf8" opacity="0.5"/>

    <!-- Terraced Hills / Rich Soil -->
    <path d="M0,150 C60,135 120,145 240,130 L240,240 L0,240 Z" fill="#064e3b"/>
    <path d="M0,175 C80,160 160,170 240,155 L240,240 L0,240 Z" fill="#022c22"/>

    <!-- Giant Lush Tree (Symbol of 'Abundant/Bountiful Nature') -->
    <!-- Tree Trunk -->
    <path d="M50,180 Q45,130 55,100 L70,100 Q75,130 75,180 Z" fill="#78350f"/>
    <path d="M62,130 Q40,110 35,90 Q50,100 65,120 Z" fill="#92400e"/>
    <!-- Canopy Layers -->
    <circle cx="55" cy="85" r="35" fill="url(#leaf-grad)"/>
    <circle cx="35" cy="95" r="25" fill="#059669"/>
    <circle cx="75" cy="90" r="28" fill="#10b981"/>
    <circle cx="55" cy="65" r="25" fill="#34d399"/>
  </g>

  <!-- Glowing Abundance Particles / Fireflies / Nature Energy -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="90" cy="110" r="2"/>
    <circle cx="110" cy="90" r="3"/>
    <circle cx="130" cy="130" r="2"/>
    <circle cx="70" cy="150" r="2.5"/>
    <circle cx="150" cy="100" r="1.5"/>
    <circle cx="185" cy="140" r="2"/>
  </g>

  <!-- Foreground: Botanist / Explorer Character Enjoying the Environment -->
  <g id="character" transform="translate(100, 110)">
    <!-- Shadow beneath character -->
    <ellipse cx="20" cy="110" rx="25" ry="6" fill="#000000" opacity="0.4"/>

    <!-- Legs (Sitting/Kneeling casually on the rich green grass) -->
    <rect x="5" y="85" width="12" height="20" rx="6" fill="#1e3a8a"/>
    <rect x="25" y="85" width="12" height="20" rx="6" fill="#1e3a8a"/>
    <!-- Shoes -->
    <path d="M2,103 Q2,98 8,98 L18,98 Q18,105 10,105 Z" fill="#b45309"/>

    <!-- Torso -->
    <path d="M5,50 L37,50 Q42,70 37,90 L5,90 Q0,70 5,50 Z" fill="#fb923c"/>
    <!-- Jacket Details / Backpack straps -->
    <path d="M12,50 L10,90" stroke="#c2410c" stroke-width="3"/>
    <path d="M30,50 L32,90" stroke="#c2410c" stroke-width="3"/>

    <!-- Head & Face -->
    <circle cx="21" cy="30" r="15" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M8,30 Q9,15 21,15 Q33,15 34,30 Q30,22 21,22 Q12,22 8,30 Z" fill="#451a03"/>
    <!-- Happy Expression (Smiling, eyes closed in wonder/joy) -->
    <path d="M15,29 Q18,33 21,29" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M23,29 Q26,33 29,29" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M20,34 Q22,37 24,34" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arm pointing/gesturing admiringly toward nature -->
    <path d="M35,55 Q50,50 55,40" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="56" cy="38" r="4" fill="#fed7aa"/>

    <!-- Other arm resting on knee -->
    <path d="M10,55 Q0,70 12,85" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>
    <circle cx="13" cy="87" r="4" fill="#fed7aa"/>
  </g>

  <!-- Foreground Props: Magnifying Glass / Field Sample & Giant Flowers -->
  <g id="props">
    <!-- Giant Vibrant Flower (Bottom Left) -->
    <path d="M20,200 Q25,170 35,160" fill="none" stroke="#047857" stroke-width="4"/>
    <!-- Petals -->
    <circle cx="35" cy="150" r="8" fill="#ec4899"/>
    <circle cx="45" cy="158" r="8" fill="#f43f5e"/>
    <circle cx="37" cy="168" r="8" fill="#fb7185"/>
    <circle cx="25" cy="160" r="8" fill="#f472b6"/>
    <!-- Center -->
    <circle cx="35" cy="159" r="5" fill="#fbbf24"/>

    <!-- Second Flower -->
    <path d="M210,210 Q200,185 190,175" fill="none" stroke="#047857" stroke-width="4"/>
    <circle cx="190" cy="165" r="7" fill="#38bdf8"/>
    <circle cx="198" cy="173" r="7" fill="#818cf8"/>
    <circle cx="182" cy="173" r="7" fill="#60a5fa"/>
    <circle cx="190" cy="171" r="4" fill="#fef08a"/>

    <!-- Sketchbook / Field Journal on the ground -->
    <g transform="translate(65, 195) rotate(-10)">
      <rect x="0" y="0" width="35" height="25" rx="3" fill="#f8fafc"/>
      <rect x="0" y="0" width="6" height="25" fill="#cbd5e1"/>
      <line x1="10" y1="7" x2="30" y2="7" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="13" x2="25" y2="13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="19" x2="28" y2="19" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Framing / Vignette Overlay for Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>