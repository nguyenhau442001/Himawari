<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="kidShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="dadShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <linearGradient id="woodFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop shadow filter for depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Interior Room Background -->
  <g id="room-interior">
    <!-- Back wall -->
    <rect x="12" y="12" width="216" height="175" rx="16" fill="url(#wallGrad)" />
    
    <!-- Warm accent light from a window or lamp -->
    <circle cx="190" cy="60" r="70" fill="url(#warmGlow)" />

    <!-- Window frame showing cozy night/evening city blur -->
    <rect x="155" y="30" width="55" height="85" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="182" y1="30" x2="182" y2="115" stroke="#475569" stroke-width="1.5"/>
    <line x1="155" y1="72" x2="210" y2="72" stroke="#475569" stroke-width="1.5"/>
    <!-- Tiny distant lights outside window -->
    <circle cx="168" cy="48" r="1.5" fill="#fbbf24"/>
    <circle cx="198" cy="85" r="1.5" fill="#38bdf8"/>
    <circle cx="175" cy="100" r="1" fill="#38bdf8"/>

    <!-- Potted Plant (Prop for rich environment) -->
    <path d="M25 150 L35 150 L38 180 L22 180 Z" fill="#64748b"/>
    <path d="M20 150 L40 150 L37 146 L23 146 Z" fill="#94a3b8"/>
    <!-- Plant leaves -->
    <path d="M30 146 Q20 120 10 130 Q15 145 30 146" fill="#10b981" opacity="0.9"/>
    <path d="M30 146 Q35 110 50 120 Q40 140 30 146" fill="#34d399" opacity="0.9"/>
    <path d="M30 146 Q30 115 28 105 Q22 125 30 146" fill="#059669" opacity="0.9"/>

    <!-- Wooden Floor -->
    <path d="M12 187 L228 187 L228 220 C228 224.4 224.4 228 220 228 L20 228 C15.6 228 12 224.4 12 220 Z" fill="url(#woodFloor)" />
    <!-- Floor planks lines -->
    <line x1="12" y1="198" x2="228" y2="198" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    <line x1="12" y1="213" x2="228" y2="213" stroke="#1e293b" stroke-width="1" opacity="0.5"/>

    <!-- Height Growth Chart Sticker on the Wall (Central theme prop) -->
    <g id="height-chart" transform="translate(70, 25)">
      <!-- Chart backing strip -->
      <rect x="0" y="0" width="16" height="155" rx="3" fill="#f8fafc" filter="url(#softShadow)"/>
      <!-- Measurement ticks & numbers visual -->
      <line x1="2" y1="20" x2="8" y2="20" stroke="#64748b" stroke-width="1.5"/>
      <line x1="2" y1="50" x2="10" y2="50" stroke="#334155" stroke-width="2"/>
      <line x1="2" y1="80" x2="8" y2="80" stroke="#64748b" stroke-width="1.5"/>
      <line x1="2" y1="110" x2="10" y2="110" stroke="#334155" stroke-width="2"/>
      <line x1="2" y1="140" x2="8" y2="140" stroke="#64748b" stroke-width="1.5"/>
      <!-- Cute animal icons on chart -->
      <circle cx="8" cy="35" r="3" fill="#f43f5e"/>
      <circle cx="8" cy="95" r="3" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Characters (Father and Growing Child) -->
  <g id="characters" filter="url(#softShadow)">
    
    <!-- FATHER (Adult standing, gently marking or checking height) -->
    <g id="father" transform="translate(115, 60)">
      <!-- Dad's Body/Torso -->
      <path d="M25 60 C25 50 35 45 45 45 C55 45 65 50 65 60 L70 127 C70 129.8 67.8 132 65 132 L25 132 C22.2 132 20 129.8 20 127 Z" fill="url(#dadShirt)"/>
      <!-- Dad's Arms -->
      <!-- Right Arm pointing / measuring -->
      <path d="M60 55 L85 65 L80 72 L58 63 Z" fill="#059669"/>
      <circle cx="86" cy="66" r="5" fill="#f87171"/> <!-- Hand -->

      <!-- Dad's Head & Face -->
      <circle cx="45" cy="28" r="16" fill="#f87171"/>
      <!-- Hair -->
      <path d="M29 25 C29 16 37 12 46 12 C55 12 61 17 61 26 C57 23 52 22 45 22 C38 22 33 23 29 25 Z" fill="#334155"/>
      <!-- Friendly Expression -->
      <path d="M49 28 Q51 31 53 28" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/> <!-- Eye -->
      <path d="M43 35 Q46 38 49 35" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/> <!-- Smile -->
      
      <!-- Dad's Pants & Legs -->
      <rect x="26" y="132" width="16" height="50" rx="4" fill="#334155"/>
      <rect x="48" y="132" width="16" height="50" rx="4" fill="#334155"/>
      <!-- Shoes -->
      <path d="M22 182 L44 182 C46.2 182 48 183.8 48 186 L22 186 Z" fill="#1e293b"/>
      <path d="M44 182 L66 182 C68 182 70 183.8 70 186 L44 186 Z" fill="#1e293b"/>
    </g>

    <!-- CHILD (Actively growing, standing straight against the growth chart) -->
    <g id="child" transform="translate(68, 75)">
      <!-- Child's Head -->
      <circle cx="26" cy="22" r="14" fill="#fbcfe8"/>
      <!-- Playful Spiky Hair -->
      <path d="M13 20 C13 10 21 8 27 8 C33 8 39 12 40 20 C36 15 30 14 26 14 C21 14 16 16 13 20 Z" fill="#475569"/>
      
      <!-- Happy, proud expression -->
      <circle cx="29" cy="22" r="1.5" fill="#334155"/>
      <path d="M27 27 Q29 30 32 27" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Rosy cheeks -->
      <circle cx="32" cy="25" r="2" fill="#f43f5e" opacity="0.4"/>

      <!-- Child's Torso (Blue Shirt) -->
      <path d="M14 44 C14 36 20 34 26 34 C32 34 38 36 38 44 L42 104 C42 106.2 40.2 108 38 108 L14 108 C11.8 108 10 106.2 10 104 Z" fill="url(#kidShirt)"/>
      
      <!-- Arms relaxed/excited at sides -->
      <path d="M12 46 L4 65 L9 68 L15 50 Z" fill="#0284c7"/>
      <circle cx="3" cy="67" r="3.5" fill="#fbcfe8"/>

      <path d="M40 46 L48 62 L43 65 L37 48 Z" fill="#0284c7"/>
      <circle cx="49" cy="63" r="3.5" fill="#fbcfe8"/>

      <!-- Child's Legs & Shorts -->
      <rect x="14" y="108" width="8" height="39" rx="3" fill="#fb923c"/>
      <rect x="28" y="108" width="8" height="39" rx="3" fill="#fb923c"/>
      
      <!-- Shoes (Sneakers with bright accent) -->
      <path d="M10 147 L23 147 C24.1 147 25 147.9 25 149 L10 149 Z" fill="#ef4444"/>
      <path d="M27 147 L40 147 C41.1 147 42 147.9 42 149 L27 149 Z" fill="#ef4444"/>
    </g>

    <!-- Measurement Indicator Line (Visual cue connecting dad's hand to child's head - showing height check) -->
    <line x1="94" y1="91" x2="115" y2="125" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="3,3" stroke-linecap="round"/>
    <!-- Small indicator pointer arrow -->
    <polygon points="94,91 100,88 98,95" fill="#fbbf24"/>
  </g>

  <!-- Foreground decorative elements for rich framing -->
  <!-- A toy block on the floor to enhance child/home context -->
  <g transform="translate(45, 195)" filter="url(#softShadow)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#ec4899"/>
    <path d="M0 0 L8 -6 L24 -6 L16 0 Z" fill="#f43f5e"/>
    <path d="M16 0 L24 -6 L24 10 L16 16 Z" fill="#be185d"/>
  </g>
  <g transform="translate(62, 202)" filter="url(#softShadow)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#38bdf8"/>
    <path d="M0 0 L6 -5 L20 -5 L14 0 Z" fill="#0ea5e9"/>
    <path d="M14 0 L20 -5 L20 9 L14 14 Z" fill="#0284c7"/>
  </g>

</svg>