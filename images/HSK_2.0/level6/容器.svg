<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Water Stream Gradient -->
    <linearGradient id="waterStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.6" />
    </linearGradient>

    <!-- Pitcher Liquid Gradient -->
    <linearGradient id="pitcherLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Container/Glass Liquid Gradient -->
    <linearGradient id="containerLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Kitchen / Interior Details -->
  <!-- Wall & Counter setup -->
  <rect x="0" y="160" width="240" height="80" fill="#090d16" />
  <rect x="0" y="155" width="240" height="5" fill="#334155" />
  
  <!-- Window & Outdoor suggestion -->
  <rect x="25" y="25" width="60" height="90" rx="8" fill="#1e293b" />
  <rect x="30" y="30" width="50" height="80" rx="4" fill="url(#windowLight)" />
  <path d="M55 30 L55 110" stroke="#0f172a" stroke-width="2" />
  <path d="M30 70 L80 70" stroke="#0f172a" stroke-width="2" />
  
  <!-- Hanging Shelf & Plant Prop -->
  <rect x="145" y="45" width="70" height="6" rx="3" fill="#475569" />
  <!-- Mini potted plant on shelf -->
  <path d="M170 45 L170 35 C170 32 180 32 180 35 L180 45 Z" fill="#cbd5e1" />
  <circle cx="175" cy="27" r="8" fill="#10b981" />
  <circle cx="170" cy="23" r="6" fill="#34d399" />
  <circle cx="180" cy="24" r="5" fill="#059669" />

  <!-- Warm Pendant Light -->
  <path d="M200 0 L200 20" stroke="#64748b" stroke-width="2" />
  <path d="M185 20 L215 20 L220 30 L180 30 Z" fill="#475569" />
  <circle cx="200" cy="30" r="45" fill="url(#lampGlow)" />

  <!-- MAIN SCENE: Character & Container Setup -->
  
  <!-- Countertop surface -->
  <path d="M15 165 L225 165 L230 175 L10 175 Z" fill="#334155" />

  <!-- Target Container (Glass pitcher/vase resting on counter) -->
  <g id="targetContainer">
    <!-- Base/Shadow -->
    <ellipse cx="145" cy="165" rx="20" ry="5" fill="#0f172a" opacity="0.6" />
    
    <!-- Glass Body Back -->
    <path d="M130 115 L160 115 L166 163 C166 166 163 168 159 168 L131 168 C127 168 124 166 124 163 Z" fill="#ffffff" fill-opacity="0.05" />
    
    <!-- Liquid inside container -->
    <path d="M126 145 C135 143 155 143 164 145 L165 162 C165 165 163 167 159 167 L131 167 C127 167 125 165 125 162 Z" fill="url(#containerLiquid)" />
    
    <!-- Liquid Surface Ellipse -->
    <ellipse cx="145" cy="144" rx="19" ry="4" fill="#38bdf8" fill-opacity="0.5" />
    
    <!-- Glass Body Front / Highlights -->
    <path d="M130 115 L160 115 L166 163 C166 166 163 168 159 168 L131 168 C127 168 124 166 124 163 Z" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M127 125 C128 140 128 150 127 160" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round" />
  </g>

  <!-- Pouring Water Stream -->
  <path d="M98 100 Q120 120 138 142" stroke="url(#waterStream)" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Water splashes/bubbles in container -->
  <circle cx="142" cy="144" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="149" cy="147" r="1.5" fill="#ffffff" opacity="0.8" />

  <!-- Character: Person Pouring Water -->
  <g id="character">
    <!-- Torso & Body -->
    <path d="M55 180 C50 150 70 135 90 145 L100 180 Z" fill="#ec4899" />
    <!-- Collar/Details -->
    <path d="M72 142 L80 150 L88 142" fill="none" stroke="#fbcfe8" stroke-width="2" />

    <!-- Head & Face -->
    <circle cx="75" cy="115" r="18" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M57 115 C57 98 93 98 93 115 C93 120 90 123 90 123 L85 107 L65 107 L60 123 C60 123 57 120 57 115 Z" fill="#334155" />
    
    <!-- Facial expression: happy, focused eyes and smiling -->
    <circle cx="70" cy="114" r="1.5" fill="#1e293b" />
    <circle cx="80" cy="114" r="1.5" fill="#1e293b" />
    <path d="M73 120 Q75 123 78 120" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Blush -->
    <circle cx="67" cy="118" r="2.5" fill="#fca5a5" opacity="0.6" />
    <circle cx="83" cy="118" r="2.5" fill="#fca5a5" opacity="0.6" />

    <!-- Back Arm (Holding Pitcher Handle / Supporting) -->
    <path d="M70 140 L85 115 L95 120" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Arm & Hand (Pouring Pitcher) -->
    <path d="M85 145 Q95 110 90 95" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />
    
    <!-- Pitcher/Kettle being held -->
    <g transform="translate(80, 75)">
      <!-- Pitcher Body -->
      <path d="M5 10 L25 10 C28 10 30 12 30 15 L23 35 C22 38 19 40 16 40 L14 40 C11 40 8 38 7 35 L0 15 C0 12 2 10 5 10 Z" fill="#f8fafc" />
      <!-- Pitcher Liquid Inside -->
      <path d="M2 18 L26 18 L22 35 C22 37 19 38 16 38 L14 38 C11 38 8 37 8 35 Z" fill="url(#pitcherLiquid)" />
      <!-- Pitcher Handle -->
      <path d="M25 15 C33 15 33 30 27 33" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <!-- Pitcher Lid / Spout -->
      <path d="M2 10 L28 10 L15 3 Z" fill="#cbd5e1" />
      <path d="M25 8 L32 5" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Foreground details: Wooden cutting board / kitchen ambience -->
  <ellipse cx="145" cy="170" rx="45" ry="8" fill="#0f172a" opacity="0.3" />
  <rect x="110" y="167" width="70" height="4" rx="2" fill="#94a3b8" opacity="0.15" />

</svg>