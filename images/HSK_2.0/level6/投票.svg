<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Details -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>
  <path d="M60 190 H180" stroke="#2F3646" stroke-width="3" stroke-linecap="round"/>

  <!-- Ballot Box -->
  <g id="ballot-box">
    <!-- Box Body -->
    <path d="M85 130 H155 L165 185 H75 Z" fill="#3B4252"/>
    <path d="M85 130 H155 L155 138 H85 Z" fill="#4C566A"/>
    <!-- Box Front Accent / Shadow -->
    <path d="M75 185 L120 195 L165 185 L155 138 H85 Z" fill="#2E3440" opacity="0.4"/>
    <!-- Slot Frame -->
    <rect x="100" y="133" width="40" height="6" rx="2" fill="#1A1D24"/>
  </g>

  <!-- Motion Lines for Action -->
  <g id="motion-lines" stroke="#EBCB8B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="110" y1="95" x2="110" y2="115"/>
    <line x1="120" y1="90" x2="120" y2="110"/>
    <line x1="130" y1="95" x2="130" y2="115"/>
  </g>

  <!-- Ballot Paper (Going into the slot) -->
  <g id="ballot-paper" transform="rotate(-10 120 110)">
    <rect x="105" y="75" width="30" height="42" rx="3" fill="#ECEFF4"/>
    <!-- Checkmark on ballot -->
    <path d="M113 93 L118 98 L127 88" stroke="#D08770" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="113" y1="105" x2="130" y2="105" stroke="#D8DEE9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Human Hand & Arm (Dynamic Action) -->
  <g id="acting-hand">
    <!-- Sleeve / Arm -->
    <path d="M150 170 C160 150 155 130 145 120 L135 125 C142 135 145 145 138 165 Z" fill="#5E81AC"/>
    <!-- Hand / Fingers gripping the ballot -->
    <path d="M130 112 C135 110 142 114 140 120 C138 126 132 125 128 120 Z" fill="#EBCB8B"/>
    <circle cx="134" cy="116" r="3" fill="#D08770" opacity="0.3"/>
  </g>

  <!-- Focus / Success Elements -->
  <g id="sparkles">
    <path d="M75 90 L78 96 L84 99 L78 102 L75 108 L72 102 L66 99 L72 96 Z" fill="#EBCB8B" opacity="0.9"/>
    <path d="M170 100 L172 104 L176 106 L172 108 L170 112 L168 108 L164 106 L168 104 Z" fill="#EBCB8B" opacity="0.7"/>
  </g>
</svg>