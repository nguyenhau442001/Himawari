<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sun/Sunset Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Tree Gradient -->
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Warm Amber Window/Light Glow -->
    <radialGradient id="warmLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Bird Silhouette Gradient -->
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Background Environment: Distant Mountains & Landscape -->
  <path d="M0 160 Q 40 130, 90 150 T 190 140 Q 220 135, 240 145 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.7" />
  <path d="M0 180 Q 60 160, 120 175 T 240 170 L 240 240 L 0 240 Z" fill="#090d16" />

  <!-- Cozy Foreground: Cabin / Nature Observer House Corner -->
  <!-- House Wall & Roof (Right side) -->
  <path d="M160 120 L 240 90 L 240 240 L 160 240 Z" fill="#334155" />
  <path d="M150 115 L 240 85 L 240 95 L 150 125 Z" fill="#475569" />
  
  <!-- Warm Glowing Window -->
  <rect x="180" y="135" width="35" height="45" rx="4" fill="#1e293b" />
  <rect x="184" y="139" width="27" height="37" rx="2" fill="#fbbf24" opacity="0.9" />
  <!-- Window Grid -->
  <line x1="197" y1="139" x2="197" y2="176" stroke="#1e293b" stroke-width="2" />
  <line x1="184" y1="157" x2="211" y2="157" stroke="#1e293b" stroke-width="2" />
  <!-- Window Light Glow Cone -->
  <path d="M184 176 L 140 240 L 220 240 Z" fill="url(#warmLight)" opacity="0.3" />

  <!-- Roof Overhang / Balcony / Railing -->
  <path d="M160 150 L 240 120 L 240 128 L 160 158 Z" fill="#1e293b" />
  <line x1="175" y1="185" x2="175" y2="220" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <line x1="200" y1="175" x2="200" y2="210" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <line x1="170" y1="190" x2="220" y2="170" stroke="#1e293b" stroke-width="2" />

  <!-- Foreground Trees (Pine/Evergreen on Left) -->
  <path d="M 30 240 L 30 150 L 15 170 L 35 140 L 20 155 L 40 125 L 55 155 L 40 170 L 55 240 Z" fill="url(#treeGrad)" />
  <path d="M 60 240 L 60 170 L 48 190 L 68 160 L 55 175 L 72 145 L 85 175 L 72 190 L 85 240 Z" fill="#047857" />

  <!-- Character: Curious Observer / Child looking out with telescope/binoculars -->
  <!-- Body/Outfit -->
  <path d="M125 240 C 125 210, 140 195, 155 195 C 170 195, 180 210, 180 240 Z" fill="#38bdf8" />
  <!-- Scarf -->
  <path d="M138 193 C 145 190, 155 192, 162 196 C 160 203, 140 205, 138 193 Z" fill="#ec4899" />
  <path d="M135 195 L 120 220 L 128 223 L 138 200 Z" fill="#ec4899" />
  <!-- Head -->
  <circle cx="150" cy="178" r="14" fill="#fed7aa" />
  <!-- Hair (Stylized cap/hair) -->
  <path d="M 136 178 C 136 168, 164 168, 164 178 C 164 175, 160 162, 150 162 C 140 162, 136 175, 136 178 Z" fill="#78350f" />
  
  <!-- Arms & Binoculars pointing up-left -->
  <path d="M 145 198 L 130 180 L 140 175 L 152 192 Z" fill="#38bdf8" />
  <!-- Binoculars Prop -->
  <rect x="115" y="165" width="22" height="12" rx="4" transform="rotate(-35 125 170)" fill="#0f172a" />
  <circle cx="112" cy="162" r="7" fill="#fbbf24" />
  <circle cx="130" cy="175" r="6" fill="#fbbf24" />

  <!-- MIGRATING BIRDS (The Core Narrative: 迁徙 - Migration) -->
  <!-- V-formation flock soaring across the golden sky -->
  
  <!-- Bird 1 (Leader, Large) -->
  <g transform="translate(70, 70) scale(1.2)">
    <path d="M 0 0 Q 12 -12, 24 -4 Q 12 2, 0 0 Z" fill="url(#birdGrad)" />
    <path d="M 0 0 Q -12 -12, -24 -4 Q -12 2, 0 0 Z" fill="url(#birdGrad)" />
  </g>

  <!-- Bird 2 -->
  <g transform="translate(95, 55)">
    <path d="M 0 0 Q 10 -10, 20 -3 Q 10 2, 0 0 Z" fill="url(#birdGrad)" />
    <path d="M 0 0 Q -10 -10, -20 -3 Q -10 2, 0 0 Z" fill="url(#birdGrad)" />
  </g>

  <!-- Bird 3 -->
  <g transform="translate(120, 42) scale(0.9)">
    <path d="M 0 0 Q 10 -10, 20 -3 Q 10 2, 0 0 Z" fill="url(#birdGrad)" />
    <path d="M 0 0 Q -10 -10, -20 -3 Q -10 2, 0 0 Z" fill="url(#birdGrad)" />
  </g>

  <!-- Bird 4 (Trailing wing of V) -->
  <g transform="translate(145, 30) scale(0.7)">
    <path d="M 0 0 Q 10 -10, 20 -3 Q 10 2, 0 0 Z" fill="url(#birdGrad)" />
    <path d="M 0 0 Q -10 -10, -20 -3 Q -10 2, 0 0 Z" fill="url(#birdGrad)" />
  </g>

  <!-- Bird 5 (Other side of V) -->
  <g transform="translate(90, 85) scale(0.9)">
    <path d="M 0 0 Q 10 -10, 20 -3 Q 10 2, 0 0 Z" fill="url(#birdGrad)" />
    <path d="M 0 0 Q -10 -10, -20 -3 Q -10 2, 0 0 Z" fill="url(#birdGrad)" />
  </g>

  <!-- Bird 6 -->
  <g transform="translate(110, 100) scale(0.7)">
    <path d="M 0 0 Q 10 -10, 20 -3 Q 10 2, 0 0 Z" fill="url(#birdGrad)" />
    <path d="M 0 0 Q -10 -10, -20 -3 Q -10 2, 0 0 Z" fill="url(#birdGrad)" />
  </g>

  <!-- Distant tiny birds -->
  <path d="M 170 50 Q 175 45, 180 48 Q 175 50, 170 50 Z" fill="#fbbf24" opacity="0.6" />
  <path d="M 185 58 Q 190 53, 195 56 Q 190 58, 185 58 Z" fill="#fbbf24" opacity="0.6" />

  <!-- Motion / Directional wind trails (Subtle artistic depth) -->
  <path d="M 40 75 Q 55 70, 65 72" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3" />
  <path d="M 60 45 Q 75 40, 85 43" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- Atmospheric Glow & Vignette -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>