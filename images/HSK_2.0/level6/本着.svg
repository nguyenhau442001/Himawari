<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character: Professional Person -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <path d="M-10 -5 L-5 -5 M5 -5 L10 -5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 10 Q0 15 5 10" stroke="#1e293b" stroke-width="2" fill="none"/>
    <rect x="-30" y="30" width="60" height="80" rx="10" fill="#38bdf8"/>
  </g>
  
  <!-- The "Honesty" Symbol: A glowing document with a checkmark -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#f1f5f9"/>
    <path d="M10 15 L30 15 M10 25 L30 25 M10 35 L20 35" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="30" cy="40" r="6" fill="#10b981"/>
    <path d="M27 40 L29 42 L33 38" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>

  <!-- Decorative elements: Lamp/Light -->
  <path d="M180 160 L180 80 L200 80 L190 160 Z" fill="#fb923c" opacity="0.6"/>
  <circle cx="190" cy="80" r="10" fill="#fbbf24"/>
  
  <!-- Handshake silhouette (abstracted as two hands meeting) -->
  <path d="M150 180 C160 170 170 170 180 180" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M155 185 C165 175 175 175 185 185" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Background accents -->
  <circle cx="30" cy="40" r="3" fill="#38bdf8"/>
  <circle cx="210" cy="30" r="4" fill="#fb923c"/>
</svg>