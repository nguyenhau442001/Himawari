<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Bulb/Clarity Light Gradient -->
    <radialGradient id="mindGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Paper Stack Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Office / Study Room during a complex task -->
  <!-- Bookshelf / Back Wall Details -->
  <rect x="25" y="30" width="190" height="110" rx="6" fill="#131c2e" />
  
  <!-- Books on Shelf (Abstract colorful books) -->
  <rect x="40" y="55" width="12" height="40" rx="2" fill="#3b82f6" />
  <rect x="54" y="50" width="15" height="45" rx="2" fill="#ef4444" />
  <rect x="71" y="60" width="10" height="35" rx="2" fill="#10b981" />
  
  <!-- Window showing night/city outside (representing difficulty/challenge) -->
  <path d="M 150 45 L 200 45 L 200 110 L 150 110 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  <!-- City skyline silhouettes through window -->
  <path d="M 155 110 L 155 85 L 163 85 L 163 110 L 172 110 L 172 70 L 180 70 L 180 110 L 192 110 L 192 90 L 197 90 L 197 110 Z" fill="#1e293b" />
  <!-- Window crossbars -->
  <line x1="175" y1="45" x2="175" y2="110" stroke="#334155" stroke-width="1.5" />
  <line x1="150" y1="77" x2="200" y2="77" stroke="#334155" stroke-width="1.5" />

  <!-- Desk Surface -->
  <path d="M 10 170 L 230 170 L 220 220 L 20 220 Z" fill="url(#deskGrad)" filter="url(#shadow)" />
  <rect x="15" y="165" width="210" height="8" rx="3" fill="#475569" />

  <!-- Cluttered Work Props (Representing "Difficulties" / Complex Work) -->
  <!-- Messy Papers / Blueprints -->
  <g transform="rotate(-12, 60, 160)" filter="url(#shadow)">
    <rect x="45" y="135" width="45" height="55" rx="2" fill="#f8fafc" />
    <line x1="52" y1="147" x2="83" y2="147" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="159" x2="75" y2="159" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="171" x2="80" y2="171" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <!-- Red error cross mark -->
    <path d="M 65 155 L 75 165 M 75 155 L 65 165" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Laptop with Code/Charts -->
  <g transform="translate(130, 130)">
    <!-- Laptop Base -->
    <path d="M -15 35 L 55 35 L 65 42 L -25 42 Z" fill="#94a3b8" />
    <path d="M -20 42 L 60 42 L 55 45 L -15 45 Z" fill="#64748b" />
    <!-- Laptop Screen -->
    <rect x="-12" y="-10" width="60" height="46" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <rect x="-8" y="-6" width="52" height="38" fill="url(#screenGrad)" />
    <!-- Chart lines on screen -->
    <path d="M -2 15 L 10 5 L 22 12 L 38 -1" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Coffee Mug (Steam rising) -->
  <g transform="translate(35, 150)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#cbd5e1" />
    <path d="M 16 9 C 22 9, 22 21, 16 21" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 5 0 C 3 -3, 9 -5, 7 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- MAIN CHARACTER: Sitting at desk, keeping a clear, calm, and focused mind ("清醒的头脑") -->
  <g id="character">
    <!-- Body & Torso (Teal/Blue Professional Sweater) -->
    <path d="M 90 185 C 90 160, 100 145, 120 145 C 140 145, 150 160, 150 185 Z" fill="#0ea5e9" />
    <!-- Collar / Shirt Detail -->
    <path d="M 110 145 L 120 156 L 130 145" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Arms resting on desk -->
    <path d="M 98 165 L 75 178" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" />
    <path d="M 142 165 L 165 178" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="72" cy="180" r="5" fill="#fbcfe8" />
    <circle cx="168" cy="180" r="5" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="113" y="130" width="14" height="20" rx="4" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="120" cy="115" r="22" fill="#fbcfe8" />

    <!-- Neat Hair Style (Dark brown/black) -->
    <path d="M 98 115 C 98 95, 142 95, 142 115 C 142 122, 138 122, 138 118 C 138 102, 102 102, 102 118 C 102 122, 98 122, 98 115 Z" fill="#334155" />
    <path d="M 100 110 C 105 100, 135 100, 140 110 C 138 103, 102 103, 100 110 Z" fill="#334155" />

    <!-- Facial Expression: Calm, Alert, Clear-headed, Focused Eyes -->
    <!-- Open, calm, determined eyes looking forward -->
    <circle cx="112" cy="115" r="3.5" fill="#1e293b" />
    <circle cx="128" cy="115" r="3.5" fill="#1e293b" />
    <!-- Eye shine (showing alertness) -->
    <circle cx="111" cy="114" r="1.2" fill="#ffffff" />
    <circle cx="127" cy="114" r="1.2" fill="#ffffff" />
    
    <!-- Calm, confident, straight eyebrows (indicating clarity and composure under pressure) -->
    <path d="M 108 109 L 117 110" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M 123 110 L 132 109" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Gentle confident smile (not stressed) -->
    <path d="M 116 125 C 118 127, 122 127, 124 125" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- CLARITY METAPHOR & VISUAL HIGHLIGHT: Glowing Mind / Lightbulb concept floating above head -->
  <!-- Ambient golden glow surrounding the head -->
  <circle cx="120" cy="85" r="35" fill="url(#mindGlow)" />

  <!-- Glowing Idea / Clear Mind Head Aura (Lightbulb / Glowing abstract bulb floating safely above) -->
  <g transform="translate(120, 75)" filter="url(#shadow)">
    <!-- Lightbulb body -->
    <path d="M -8 2 C -8 -6, -3 -12, 0 -12 C 3 -12, 8 -6, 8 2 C 8 7, 5 9, 4 12 L -4 12 C -5 9, -8 7, -8 2 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Bulb base -->
    <rect x="-3" y="12" width="6" height="4" rx="1" fill="#94a3b8" />
    <!-- Radiating clarity rays -->
    <path d="M 0 -18 L 0 -22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -12 -12 L -15 -15" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 12 -12 L 15 -15" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -16 0 L -20 0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 16 0 L 20 0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

</svg>