<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="board-grad" x1="40" y1="40" x2="200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Background Office Atmosphere -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#090d16"/>
  <!-- Window grid representing corporate modern setting -->
  <path d="M160 30 L210 30 L210 110 L160 110 Z" fill="#1e293b" opacity="0.4"/>
  <path d="M185 30 L185 110 M160 70 L210 70" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Warm spotlight beam pointing to strategy board -->
  <polygon points="120,0 20,180 180,180" fill="url(#beam)" />

  <!-- Strategic Planning Board (The core context: "方针" - Strategy/Policy guideline) -->
  <rect x="35" y="35" width="125" height="100" rx="6" fill="url(#board-grad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Abstract flowchart / strategy indicators on the board (NO text/letters) -->
  <circle cx="55" cy="55" r="8" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="95" cy="55" r="6" fill="#10b981"/>
  <circle cx="135" cy="75" r="7" fill="#fb923c"/>
  
  <!-- Connecting strategy lines -->
  <path d="M63 55 H89 M101 58 L125 70 M135 82 V105" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
  
  <!-- Upward growth chart on board (representing "发展" - development) -->
  <path d="M45 110 L65 95 L85 100 L110 70 L135 60" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M125 60 H135 V70" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spotlight icon/marker -->
  <circle cx="120" cy="15" r="5" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Office Desk Surface -->
  <path d="M10 185 C40 180 200 180 230 185 L240 210 C180 215 60 215 0 210 Z" fill="#334155"/>
  <path d="M0 185 L240 185" stroke="#475569" stroke-width="2"/>

  <!-- Character 1 (Presenter / Manager pointing at the new direction) -->
  <!-- Body / Torso -->
  <path d="M175 140 C170 125 155 120 145 125 L130 185 L180 185 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="155" cy="105" r="14" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M141 103 C142 93 150 91 162 93 C169 94 171 100 169 108 C160 105 150 106 141 103 Z" fill="#0f172a"/>
  <!-- Arm pointing up/left to board -->
  <path d="M165 125 L125 95 L118 103 L150 138 Z" fill="#38bdf8"/>
  <!-- Hand -->
  <circle cx="116" cy="100" r="4" fill="#fbcfe8"/>
  <!-- Glasses / Professional look -->
  <circle cx="159" cy="104" r="3" fill="none" stroke="#0f172a" stroke-width="1"/>

  <!-- Character 2 (Colleague listening / observing intently) -->
  <!-- Body / Torso -->
  <path d="M75 150 C75 135 90 130 100 135 L115 190 L60 190 Z" fill="#ec4899"/>
  <!-- Head -->
  <circle cx="90" cy="115" r="13" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M77 112 C76 102 85 99 97 101 C104 102 106 108 104 116 C98 111 88 112 77 112 Z" fill="#475569"/>
  <!-- Arm resting on table -->
  <path d="M85 138 L100 165 L85 170 L75 145 Z" fill="#ec4899"/>

  <!-- Foreground Props on Desk (Adding rich real-world context) -->
  <!-- Laptop -->
  <path d="M25 175 L55 170 L60 195 L20 195 Z" fill="#cbd5e1"/>
  <path d="M18 195 L62 195 L65 198 L15 198 Z" fill="#94a3b8"/>
  <!-- Coffee mug -->
  <rect x="200" y="170" width="16" height="20" rx="3" fill="#fbbf24"/>
  <path d="M216 175 C222 175 222 185 216 185" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- Accent glow effects on characters -->
  <circle cx="120" cy="100" r="2" fill="#fff" filter="url(#glow)"/>
  <circle cx="55" cy="55" r="4" fill="#fff" filter="url(#glow)"/>
</svg>