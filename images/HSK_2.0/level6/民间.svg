<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Fireplace/Warm Glow -->
  <path d="M80 240 L160 240 L150 180 L90 180 Z" fill="#475569"/>
  <path d="M100 230 C100 200 140 200 140 230" fill="#fb923c" opacity="0.8"/>
  <path d="M110 220 C110 205 130 205 130 220" fill="#f59e0b" opacity="0.9"/>
  
  <!-- Elder Character -->
  <g transform="translate(60, 100)">
    <circle cx="30" cy="30" r="25" fill="#cbd5e1"/>
    <path d="M15 35 Q30 45 45 35" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="15" y="55" width="30" height="60" rx="5" fill="#38bdf8"/>
    <path d="M15 60 L5 100 M45 60 L55 100" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Child Character -->
  <g transform="translate(140, 120)">
    <circle cx="20" cy="20" r="18" fill="#fde68a"/>
    <rect x="10" y="38" width="20" height="50" rx="5" fill="#ec4899"/>
    <path d="M10 45 L0 80 M30 45 L40 80" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Floating Narrative Elements (Story essence) -->
  <g fill="#10b981" opacity="0.6">
    <path d="M180 60 L190 40 L200 60 Z"/>
    <circle cx="170" cy="80" r="4"/>
    <path d="M210 90 Q220 80 230 90" stroke="#10b981" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Moon/Window light -->
