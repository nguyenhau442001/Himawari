  </g>
  
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <rect x="-10" y="15" width="20" height="40" fill="#38bdf8"/>
  </g>
  
  <!-- Decorative Sparkles/Trend Indicators -->
  <path d="M180 50l5 10l10 5l-10 5l-5 10l-5-10l-10-5l10-5z" fill="#fbbf24"/>
  <path d="M60 70l3 6l6 3l-6 3l-3 6l-3-6l-6-3l6-3z" fill="#10b981"/>
  <path d="M150 30l4 8l8 4l-8 4l-4 8l-4-8l-8-4l8-4z" fill="#ec4899"/>
  
  <!-- Ground Detail -->
