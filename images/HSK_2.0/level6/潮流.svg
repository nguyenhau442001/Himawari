      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Scene Background -->
  <path d="M0 160h240v80H0z" fill="#334155"/>
  <path d="M40 160l20-80h40l20 80z" fill="#475569"/>
  <path d="M140 160l20-60h40l20 60z" fill="#475569"/>
  
  <!-- Main Character (The Trendsetter) -->
