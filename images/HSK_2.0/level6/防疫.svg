<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm indoor light glow -->
    <radialGradient id="lightGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass/Counter shine -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lightGlow)"/>

  <!-- ENVIRONMENT / SCENERY: Public Checkpoint / Lobby -->
  <!-- Wall Background Detail: Panel lines & subtle notice board -->
  <line x1="0" y1="130" x2="240" y2="130" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 4"/>
  
  <!-- Digital Info Screen on Wall (Displaying preventive measures vibe) -->
  <rect x="25" y="30" width="70" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="33" y="38" width="30" height="4" rx="2" fill="#38bdf8"/>
  <rect x="33" y="47" width="45" height="3" rx="1.5" fill="#64748b"/>
  <rect x="33" y="55" width="35" height="3" rx="1.5" fill="#64748b"/>
  <!-- Status Light on screen -->
  <circle cx="85" cy="40" r="3" fill="#10b981"/>

  <!-- Indoor Plant (adds life and realism) -->
  <path d="M195,140 Q190,110 210,95 Q220,115 210,140 Z" fill="#065f46" opacity="0.8"/>
  <path d="M190,145 Q170,120 180,100 Q195,115 200,145 Z" fill="#047857" opacity="0.9"/>
  <path d="M205,145 Q225,125 225,105 Q210,125 205,145 Z" fill="#10b981" opacity="0.85"/>
  <rect x="185" y="145" width="30" height="35" rx="4" fill="#475569"/>

  <!-- Foreground/Midground Counter Desk -->
  <path d="M0,160 L240,160 L240,240 L0,240 Z" fill="#0f172a" filter="url(#softShadow)"/>
  <path d="M0,160 L240,160 L240,170 L0,170 Z" fill="#334155"/>
  <rect x="0" y="160" width="240" height="80" fill="url(#glassShine)"/>

  <!-- CHARACTER 1: Staff / Health Worker behind counter -->
  <!-- Body/Uniform -->
  <path d="M50,195 Q50,175 70,175 L110,175 Q130,175 130,195 L130,220 L50,220 Z" fill="#0284c7"/>
  <!-- Protective Blue Vest/Gown -->
  <path d="M60,175 L120,175 L125,220 L55,220 Z" fill="#0ea5e9"/>
  <!-- Head & Hair -->
  <circle cx="90" cy="140" r="18" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M72,138 Q90,120 108,138 Q105,125 90,122 Q75,125 72,138 Z" fill="#334155"/>
  <!-- Blue Medical Cap -->
  <path d="M73,135 Q90,118 107,135 Q100,130 90,130 Q80,130 73,135 Z" fill="#38bdf8"/>
  <!-- Face Mask on Staff -->
  <path d="M82,142 L98,142 L96,152 L84,152 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
  <!-- Eyes -->
  <circle cx="84" cy="138" r="1.5" fill="#1e293b"/>
  <circle cx="96" cy="138" r="1.5" fill="#1e293b"/>

  <!-- CHARACTER 2: Citizen / Visitor stepping up for temperature/sanitization check -->
  <!-- Body & Jacket -->
  <path d="M140,210 Q145,175 170,175 L200,175 Q220,175 225,210 Z" fill="#f59e0b"/>
  <!-- Scarf -->
  <path d="M162,173 Q175,182 188,173 L185,185 Q175,190 165,185 Z" fill="#ef4444"/>
  <!-- Head & Hair -->
  <circle cx="175" cy="135" r="19" fill="#fde047"/>
  <!-- Stylish Hair -->
  <path d="M156,132 Q170,112 194,125 Q185,118 175,120 Q160,120 156,132 Z" fill="#451a03"/>
  <!-- Eyes (Friendly, cooperative look) -->
  <circle cx="170" cy="133" r="1.5" fill="#1e293b"/>
  <circle cx="182" cy="133" r="1.5" fill="#1e293b"/>
  <!-- Protective Mask on Visitor -->
  <path d="M167,137 L183,137 L182,147 L168,147 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>


  <!-- PROPS: STRICTLY CONCRETE & RELATABLE (防疫 actions & gear) -->
  
  <!-- Automatic Hand Sanitizer Dispenser mounted on stand/counter -->
  <!-- Stand Pole -->
  <rect x="125" y="125" width="6" height="45" fill="#64748b"/>
  <!-- Dispenser Body -->
  <rect x="116" y="105" width="24" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" filter="url(#softShadow)"/>
  <!-- Window view of fluid -->
  <rect x="125" y="113" width="6" height="12" rx="3" fill="#38bdf8" opacity="0.6"/>
  <!-- Dispenser Nozzle & Drop -->
  <path d="M128,135 L128,139" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="128" cy="143" r="2.5" fill="#38bdf8"/>

  <!-- Temperature Scanner Gun in Staff's hand -->
  <!-- Staff Arm extending forward -->
  <path d="M105,180 Q120,180 128,165" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <!-- Gun Body -->
  <rect x="122" y="155" width="12" height="10" rx="2" fill="#334155"/>
  <path d="M125,165 L125,172" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Laser Beam pointer projecting toward visitor -->
  <line x1="122" y1="160" x2="167" y2="140" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8"/>
  <circle cx="167" cy="140" r="3" fill="#ef4444" opacity="0.6"/>

  <!-- Additional safety prop on counter: Box of face masks -->
  <rect x="25" y="152" width="28" height="16" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M25,158 L53,158" stroke="#94a3b8" stroke-width="1"/>
  <path d="M35,152 L35,168" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Stack of masks inside open box visual -->
  <path d="M28,152 L32,148 L50,148 L50,152 Z" fill="#f8fafc"/>

  <!-- Ambient lighting sparkles (subtle clean atmosphere) -->
  <circle cx="150" cy="80" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="70" cy="95" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="210" cy="65" r="1" fill="#38bdf8" opacity="0.4"/>
</svg>