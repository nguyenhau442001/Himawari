<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Trophy Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Wood Podium/Desk -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting / Spotlight -->
  <circle cx="120" cy="90" r="110" fill="url(#spotlight)" />

  <!-- Background Environment: Award Stage / Hall -->
  <!-- Curtain/Backdrop folds -->
  <path d="M0 0 L40 180 L0 180 Z" fill="#131c2e" opacity="0.6" />
  <path d="M240 0 L200 180 L240 180 Z" fill="#131c2e" opacity="0.6" />
  <path d="M40 0 L80 180 L0 180 Z" fill="#1e293b" opacity="0.4" />
  <path d="M200 0 L160 180 L240 180 Z" fill="#1e293b" opacity="0.4" />

  <!-- Stage Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#090d16" />
  <ellipse cx="120" cy="180" rx="100" ry="12" fill="#1e293b" opacity="0.8" />

  <!-- Glowing Stars / Recognition Sparks in Background -->
  <g fill="#fbbf24">
    <path d="M40 60 L42 66 L48 68 L42 70 L40 76 L38 70 L32 68 L38 66 Z" opacity="0.6" transform="scale(0.7) translate(10, 20)" />
    <path d="M200 50 L202 56 L208 58 L202 60 L200 66 L198 60 L192 58 L198 56 Z" opacity="0.8" transform="scale(0.8) translate(50, 10)" />
    <path d="M210 110 L211 114 L215 115 L211 116 L210 120 L209 116 L205 115 L209 114 Z" opacity="0.5" />
    <path d="M30 115 L31 119 L35 120 L31 121 L30 125 L29 121 L25 120 L29 119 Z" opacity="0.7" />
  </g>

  <!-- Podium / Desk at Center -->
  <path d="M90 175 L150 175 L160 210 L80 210 Z" fill="url(#wood-grad)" />
  <path d="M85 170 L155 170 L150 175 L90 175 Z" fill="#475569" />
  <!-- Golden emblem on podium (abstract shape, no text) -->
  <circle cx="120" cy="190" r="8" fill="#fbbf24" opacity="0.8" />
  <path d="M120 185 L122 189 L126 190 L122 191 L120 195 L118 191 L114 190 L118 189 Z" fill="#fff" opacity="0.9" />

  <!-- Central Genius Character (The "Genius" / Subject) -->
  <!-- Body / Suit -->
  <path d="M100 175 L140 175 L145 140 L95 140 Z" fill="#0284c7" />
  <!-- Shirt collar -->
  <polygon points="120,140 112,150 128,150" fill="#f8fafc" />
  <!-- Red bowtie (symbolizing honor/genius presentation) -->
  <path d="M115,148 L125,148 L122,152 L125,156 L115,156 L118,152 Z" fill="#ef4444" />

  <!-- Neck -->
  <rect x="114" y="130" width="12" height="15" fill="#fbcfe8" rx="4" />

  <!-- Head -->
  <circle cx="120" cy="115" r="22" fill="#fbcfe8" />

  <!-- Stylish Hair (Genius look) -->
  <path d="M98 115 C98 100, 108 92, 120 92 C132 92, 144 100, 142 118 C140 110, 135 98, 122 96 C110 94, 102 105, 98 115 Z" fill="#1e293b" />
  <path d="M138 105 C145 105, 148 112, 146 118 C144 112, 140 108, 138 105 Z" fill="#1e293b" />

  <!-- Friendly, Confident Expression -->
  <!-- Confident Smile -->
  <path d="M112 122 Q120 128 128 122" stroke="#9d174d" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Sparkly Eyes (Genius brilliance) -->
  <circle cx="111" cy="113" r="3" fill="#0f172a" />
  <circle cx="129" cy="113" r="3" fill="#0f172a" />
  <circle cx="112" cy="112" r="1" fill="#fff" />
  <circle cx="130" cy="112" r="1" fill="#fff" />
  <!-- Rosy Cheeks -->
  <circle cx="108" cy="117" r="3.5" fill="#fda4af" opacity="0.6" />
  <circle cx="132" cy="117" r="3.5" fill="#fda4af" opacity="0.6" />

  <!-- Left Arm holding a glowing blueprint / invention / book -->
  <path d="M98 145 L75 165 L85 175 L102 155 Z" fill="#0284c7" />
  <circle cx="78" cy="170" r="5" fill="#fbcfe8" />

  <!-- Right Arm presenting outward (Public Recognition) -->
  <path d="M142 145 L165 140 L168 152 L145 155 Z" fill="#0284c7" />
  <circle cx="168" cy="146" r="5" fill="#fbcfe8" />

  <!-- Floating Golden Trophy (Representing "Publicly Recognized / 公认") -->
  <g transform="translate(120, 52)">
    <!-- Trophy Glow -->
    <circle cx="0" cy="0" r="26" fill="#fbbf24" opacity="0.2" filter="blur(4px)" />
    <!-- Cup Body -->
    <path d="M-12 -12 L12 -12 L9 10 C9 15, 3 18, 0 18 C-3 18, -9 15, -9 10 Z" fill="url(#gold-grad)" />
    <!-- Cup Rim -->
    <ellipse cx="0" cy="-12" rx="12" ry="3" fill="#fef08a" />
    <ellipse cx="0" cy="-12" rx="10" ry="2" fill="#ca8a04" />
    <!-- Handles -->
    <path d="M-12 -9 C-18 -9, -18 2, -9 5" stroke="#eab308" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M12 -9 C18 -9, 18 2, 9 5" stroke="#eab308" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="-2" y="18" width="4" height="7" fill="#ca8a04" />
    <path d="M-8 25 L8 25 L6 28 L-6 28 Z" fill="url(#gold-grad)" />
    <!-- Little star on trophy -->
    <path d="M0 -3 L1.5 1 L5 1.5 L2 4 L3 7.5 L0 5.5 L-3 7.5 L-2 4 L-5 1.5 L-1.5 1 Z" fill="#fff" transform="scale(0.6)" />
  </g>

  <!-- Side Characters / Audience silhouette showing "Public/Everyone" (公认) -->
  <!-- Left Audience Member applauding -->
  <g opacity="0.8">
    <path d="M30 210 L55 210 L60 240 L25 240 Z" fill="#334155" />
    <circle cx="42" cy="195" r="12" fill="#fbcfe8" />
    <path d="M32 192 C32 182, 52 182, 52 192" fill="#475569" />
    <!-- Hand clapping -->
    <circle cx="52" cy="205" r="4" fill="#fbcfe8" />
  </g>

  <!-- Right Audience Member applauding -->
  <g opacity="0.8">
    <path d="M185 210 L210 210 L215 240 L180 240 Z" fill="#334155" />
    <circle cx="198" cy="195" r="12" fill="#fbcfe8" />
    <path d="M188 192 C188 182, 208 182, 208 192" fill="#38bdf8" />
    <!-- Hand clapping -->
    <circle cx="188" cy="205" r="4" fill="#fbcfe8" />
  </g>

  <!-- Extra Sparkles / Confetti for Universal Acclaim -->
  <circle cx="85" cy="85" r="3" fill="#38bdf8" />
  <circle cx="155" cy="75" r="2.5" fill="#ec4899" />
  <circle cx="95" cy="45" r="2" fill="#fbbf24" />
  <circle cx="145" cy="40" r="3" fill="#10b981" />
  <path d="M75 95 L78 98 L75 101 L72 98 Z" fill="#f43f5e" opacity="0.8" />
  <path d="M165 105 L168 108 L165 111 L162 108 Z" fill="#38bdf8" opacity="0.8" />
</svg>