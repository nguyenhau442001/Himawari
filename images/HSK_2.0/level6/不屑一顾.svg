<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="80" fill="#475569"/>
  <rect x="180" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- The Proposal Paper -->
  <rect x="120" y="110" width="60" height="40" rx="2" fill="#f1f5f9"/>
  <line x1="130" y1="120" x2="170" y2="120" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="130" y1="130" x2="170" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="130" y1="140" x2="150" y2="140" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- The Subject (Man) -->
  <g transform="translate(30, 60)">
    <!-- Body -->
    <path d="M40 160 L80 160 L75 100 L45 100 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="80" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M35 80 Q 35 50 60 50 Q 85 50 85 80" fill="#1e293b"/>
    <!-- Expression: Disdain -->
    <path d="M50 75 L58 83" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M70 75 L62 83" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M52 95 Q 60 90 68 95" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm pushing away -->
    <path d="M80 120 L110 115" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="4" fill="#fb923c"/>
  <circle cx="220" cy="60" r="2" fill="#10b981"/>
  <path d="M10 200 L30 180" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
</svg>