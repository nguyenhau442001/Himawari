<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Window Light Glow -->
    <linearGradient id="window-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Clip Path for Window View -->
    <clipPath id="window-clip">
      <rect x="150" y="35" width="55" height="75" rx="4"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Room Environment -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b"/>
  <!-- Floor -->
  <polygon points="20,170 220,170 240,220 0,220" fill="#0f172a"/>
  <!-- Floor Line Accent -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Bookshelf Background -->
  <rect x="35" y="35" width="60" height="90" fill="#090d16" rx="2"/>
  <rect x="40" y="55" width="50" height="4" fill="#334155"/>
  <rect x="40" y="80" width="50" height="4" fill="#334155"/>
  <rect x="40" y="105" width="50" height="4" fill="#334155"/>
  <!-- Books on shelf -->
  <rect x="43" y="42" width="8" height="13" fill="#f43f5e" rx="1"/>
  <rect x="53" y="40" width="6" height="15" fill="#38bdf8" rx="1"/>
  <rect x="61" y="44" width="10" height="11" fill="#fbbf24" rx="1"/>
  <rect x="43" y="65" width="12" height="15" fill="#10b981" rx="1"/>
  <rect x="58" y="62" width="7" height="18" fill="#a855f7" rx="1"/>

  <!-- Window Frame -->
  <rect x="148" y="33" width="59" height="79" fill="#334155" rx="6"/>
  <rect x="150" y="35" width="55" height="75" fill="#090d16" rx="4"/>
  <!-- Window Landscape -->
  <g clip-path="url(#window-clip)">
    <rect x="150" y="35" width="55" height="75" fill="url(#window-light)"/>
    <!-- Moon / City silhouette through window -->
    <circle cx="185" cy="55" r="8" fill="#fbbf24" opacity="0.8"/>
    <path d="M150,90 L165,75 L180,85 L200,70 L205,110 L150,110 Z" fill="#1e293b"/>
  </g>
  <!-- Window Crossbars -->
  <line x1="177" y1="35" x2="177" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="72" x2="205" y2="72" stroke="#334155" stroke-width="2"/>

  <!-- Hanging Desk Lamp -->
  <path d="M110,20 L110,45" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M95,45 L125,45 L132,55 L88,55 Z" fill="#475569"/>
  <ellipse cx="110" cy="55" rx="22" ry="12" fill="url(#lamp-glow)"/>
  <path d="M105,55 L115,55 L120,85 L100,85 Z" fill="#fbbf24" opacity="0.15"/> <!-- Light beam cone hint -->

  <!-- Desk & Study Props -->
  <!-- Desk Body -->
  <path d="M75,130 L205,130 L215,170 L65,170 Z" fill="#334155"/>
  <rect x="70" y="125" width="140" height="8" fill="#475569" rx="2"/>
  <!-- Desk Legs -->
  <rect x="80" y="170" width="8" height="40" fill="#1e293b"/>
  <rect x="192" y="170" width="8" height="40" fill="#1e293b"/>

  <!-- Laptop on Desk -->
  <path d="M150,128 L195,128 L202,138 L143,138 Z" fill="#94a3b8"/>
  <path d="M152,112 L193,112 L195,128 L150,128 Z" fill="#cbd5e1"/>
  <!-- Screen code/content lines (abstract, non-text) -->
  <rect x="156" y="115" width="30" height="3" fill="#38bdf8" rx="1"/>
  <rect x="156" y="121" width="22" height="3" fill="#10b981" rx="1"/>

  <!-- Open Thick Book (Symbolizing "Knowledge / Understanding") -->
  <path d="M95,122 C95,117 115,115 125,115 C135,115 155,117 155,122 L155,142 C155,142 135,138 125,138 C115,138 95,142 95,142 Z" fill="#e2e8f0"/>
  <!-- Book spine & pages center -->
  <line x1="125" y1="115" x2="125" y2="138" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M100,122 L120,120 L120,135 L100,137 Z" fill="#f8fafc"/>
  <path d="M130,120 L150,122 L150,137 L130,135 Z" fill="#f8fafc"/>
  <!-- Abstract lines on book -->
  <line x1="104" y1="126" x2="116" y2="125" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="130" x2="114" y2="129" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="134" y1="125" x2="146" y2="126" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- CHARACTER: The Thinker / Reader (Male, Expressive, Scratching head/superficial pose) -->
  <!-- Chair Back -->
  <rect x="105" y="95" width="28" height="55" rx="6" fill="#334155"/>
  <rect x="110" y="100" width="18" height="45" rx="4" fill="#1e293b"/>

  <!-- Character Torso & Shirt -->
  <path d="M90,175 C90,148 105,140 120,140 C135,140 150,148 150,175 Z" fill="#38bdf8"/>
  <!-- Collar -->
  <path d="M110,140 L120,152 L130,140 Z" fill="#e0f2fe"/>

  <!-- Head & Face -->
  <circle cx="120" cy="118" r="16" fill="#fde047"/> <!-- Warm skin tone -->
  <!-- Hair (Trendy messy style) -->
  <path d="M104,115 C104,105 110,100 122,100 C134,100 138,108 136,116 C132,110 125,108 118,110 C112,112 108,114 104,115 Z" fill="#334155"/>

  <!-- Facial Expression: Doubtful, Frowning, Confused (Depicting "Shallow Understanding") -->
  <!-- Eyebrows (Uneven, puzzled) -->
  <line x1="112" y1="113" x2="118" y2="115" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="122" y1="115" x2="128" y2="113" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes (Closed in thought or squinting doubtfully) -->
  <path d="M113,119 Q115,121 117,119" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M123,119 Q125,121 127,119" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Mouth (Wry, uncertain half-smile / frown) -->
  <path d="M115,127 Q120,124 125,127" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Arms & Hands -->
  <!-- Left Arm (Scratches head thoughtfully/perplexed) -->
  <path d="M93,150 C82,145 80,125 105,116" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Hand scratching head -->
  <circle cx="106" cy="112" r="5" fill="#fde047"/>

  <!-- Right Arm (Resting on desk near the book) -->
  <path d="M147,150 C155,148 145,130 130,125" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="127" cy="125" r="5" fill="#fde047"/>

  <!-- Coffee Mug for Real-World Context -->
  <rect x="68" y="138" width="14" height="18" rx="3" fill="#f43f5e"/>
  <path d="M82,142 C86,142 86,150 82,152" stroke="#f43f5e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Steam from coffee -->
  <path d="M72,133 Q75,128 72,123" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Visual Metaphor Element: Floating Question Mark / Light Bulb outline over head -->
  <!-- Instead of flat icon, render as a sleek glowing aura / floating puzzle concept -->
  <g transform="translate(132, 85)">
    <circle cx="0" cy="0" r="12" fill="#0f172a" opacity="0.8" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M-3,-4 C-3,-7 3,-7 3,-4 C3,-2 0,-1 0,2" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="6" r="1" fill="#fbbf24"/>
  </g>
</svg>