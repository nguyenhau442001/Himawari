<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <rect x="30" y="140" width="180" height="60" rx="4" fill="#334155"/>
  <circle cx="120" cy="80" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
  
  <!-- The "Leader" figure -->
  <g transform="translate(160, 90)">
    <circle cx="0" cy="0" r="15" fill="#f59e0b"/>
    <rect x="-8" y="15" width="16" height="40" rx="4" fill="#fb923c"/>
    <path d="M-10 20 L-25 40 M10 20 L25 40" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- The "Blindly Following" group -->
  <g transform="translate(80, 110)">
    <circle cx="0" cy="0" r="12" fill="#94a3b8"/>
    <rect x="-6" y="12" width="12" height="35" rx="4" fill="#64748b"/>
    <path d="M-5 15 L-15 35 M5 15 L15 35" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(40, 120)">
    <circle cx="0" cy="0" r="10" fill="#94a3b8"/>
    <rect x="-5" y="10" width="10" height="30" rx="4" fill="#64748b"/>
    <path d="M-5 12 L-15 30 M5 12 L15 30" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- The "Observer" (The one who stops) -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="-20" r="14" fill="#10b981"/>
    <rect x="-6" y="-6" width="12" height="40" rx="4" fill="#059669"/>
    <path d="M-8 0 L-20 20 M8 0 L20 20" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <!-- Stop gesture -->
    <circle cx="0" cy="-40" r="6" fill="#ec4899"/>
  </g>

  <!-- Directional path -->
  <path d="M 40 130 Q 80 100 160 100" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Decorative floor elements -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a" opacity="0.5"/>
</svg>