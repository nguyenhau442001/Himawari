<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Floor / Base Line -->
    <path d="M-80 50 L80 50" stroke="#3A4252" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Modern Pillar / Economic Column symbolizing growth that has stopped -->
    <path d="M-50 45 L-50 -10 L-25 -25 L-25 45 Z" fill="#252D3D"/>
    <path d="M-25 45 L-25 -25 L0 -40 L0 45 Z" fill="#2F384B"/>
    
    <!-- Growth blocks hitting a dead stop (Stagnation visual) -->
    <!-- Upward arrow indicator halted -->
    <path d="M-37 -15 L-37 15" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>
    <path d="M-45 -5 L-37 -15 L-29 -5" stroke="#FFA726" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- The Barrier / Pause symbol blocking further progress -->
    <rect x="-10" y="-55" width="12" height="100" rx="4" fill="#EF5350"/>
    <rect x="12" y="-55" width="12" height="100" rx="4" fill="#EF5350"/>
    
    <!-- Flat design modern gear / mechanism locked -->
    <circle cx="50" cy="10" r="22" fill="#2F384B"/>
    <circle cx="50" cy="10" r="14" fill="#1A1D24"/>
    <rect x="47" y="-16" width="6" height="52" fill="#FFA726" rx="2"/>
    <rect x="24" y="7" width="52" height="6" fill="#FFA726" rx="2"/>
    <circle cx="50" cy="10" r="6" fill="#FFA726"/>

    <!-- Floating pause / halt indicator floating above -->
    <rect x="-15" y="-85" width="8" height="20" rx="2" fill="#FFA726"/>
    <rect x="-1" y="-85" width="8" height="20" rx="2" fill="#FFA726"/>
  </g>
</svg>