<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Podium -->
  <path d="M70 180 L170 180 L160 210 L80 210 Z" fill="#334155"/>
  <path d="M75 180 L165 180 L160 195 L80 195 Z" fill="#475569"/>
  
  <!-- Background Elements (Flags/Architecture) -->
  <rect x="50" y="60" width="30" height="120" fill="#1e3a8a" opacity="0.6"/>
  <rect x="160" y="60" width="30" height="120" fill="#1e3a8a" opacity="0.6"/>
  <circle cx="120" cy="80" r="35" fill="#f59e0b" opacity="0.1"/>
  
  <!-- The Leader -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 80 C-30 40, -20 20, 0 20 C20 20, 30 40, 30 80 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-25" y="20" width="50" height="15" rx="5" fill="#38bdf8"/>
    
    <!-- Arms -->
    <path d="M-25 30 L-45 60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 30 L45 60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#fbbf24"/>
    <path d="M-10 -15 L-5 -15 M5 -15 L10 -15" stroke="#0f172a" stroke-width="2"/>
    <path d="M-5 5 Q0 10 5 5" stroke="#0f172a" stroke-width="2" fill="none"/>
    
    <!-- Hair -->
    <path d="M-20 -15 C-20 -35, 20 -35, 20 -15 L15 -20 C5 -25, -5 -25, -15 -20 Z" fill="#0f172a"/>
  </g>
  
  <!-- Microphone -->
  <path d="M120 110 L120 140" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="120" cy="105" r="6" fill="#94a3b8"/>
  
  <!-- Decorative Accents -->
  <circle cx="40" cy="40" r="3" fill="#fb923c"/>
  <circle cx="200" cy="180" r="4" fill="#10b981"/>
  <path d="M200 40 L215 55" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
</svg>