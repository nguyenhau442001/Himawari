<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Pain Aura / Distress Gradient -->
    <radialGradient id="painGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Architecture -->
  <path d="M0 0 H240 V170 L0 160 Z" fill="#182235"/>
  <path d="M0 160 L240 170 V240 H0 Z" fill="#0b1325"/>
  
  <!-- Window Grid showing dark stormy/painful night outside -->
  <path d="M165 30 H215 V110 H165 Z" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <path d="M190 30 V110" stroke="#334155" stroke-width="2"/>
  <path d="M165 70 H215" stroke="#334155" stroke-width="2"/>
  <circle cx="180" cy="45" r="3" fill="#64748b" opacity="0.5"/>
  <circle cx="205" cy="85" r="2" fill="#64748b" opacity="0.3"/>

  <!-- Distress / Pain Aura Wave behind character -->
  <circle cx="105" cy="115" r="75" fill="url(#painGlow)"/>

  <!-- Wooden Study Desk -->
  <!-- Desk Base / Leg -->
  <rect x="50" y="185" width="14" height="55" fill="#334155"/>
  <rect x="156" y="185" width="14" height="55" fill="#334155"/>
  <!-- Desk Top -->
  <rect x="30" y="170" width="160" height="15" rx="3" fill="#475569"/>
  <rect x="25" y="165" width="170" height="7" rx="2" fill="#64748b"/>

  <!-- Desk Props (Papers, Laptop, Lamp) -->
  <!-- Laptop Base -->
  <path d="M70 165 L60 165 L65 145 L95 145 Z" fill="#94a3b8"/>
  <rect x="62" y="165" width="31" height="2" fill="#cbd5e1"/>
  <!-- Open Laptop Screen glowing slightly -->
  <path d="M66 145 H94 V125 H66 Z" fill="#38bdf8" opacity="0.2"/>
  <rect x="68" y="127" width="24" height="16" rx="1" fill="#0f172a"/>
  
  <!-- Messy Papers (representing work stress/headache triggers) -->
  <rect x="110" y="160" width="22" height="12" rx="1" fill="#cbd5e1" transform="rotate(-10 120 165)"/>
  <rect x="125" y="162" width="25" height="14" rx="1" fill="#f8fafc" transform="rotate(15 135 170)"/>
  <line x1="128" y1="166" x2="145" y2="166" stroke="#94a3b8" stroke-width="1"/>
  <line x1="128" y1="170" x2="140" y2="170" stroke="#94a3b8" stroke-width="1"/>

  <!-- Desk Lamp -->
  <path d="M165 165 L170 120 L175 165 Z" fill="#334155"/>
  <path d="M162 115 H178 L185 125 H155 Z" fill="#f59e0b"/>
  <!-- Lamp Glow Circle -->
  <circle cx="170" cy="140" r="45" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- CHARACTER: Suffering from Intense Pain/Headache (忍受 - enduring pain) -->
  <g transform="translate(15, 0)">
    <!-- Office Chair Backrest -->
    <path d="M85 85 Q85 60 105 60 Q125 60 125 85 L120 170 H90 Z" fill="#334155"/>
    <rect x="95" y="90" width="20" height="70" rx="4" fill="#1e293b" opacity="0.6"/>

    <!-- Character Torso & Hoodie -->
    <path d="M75 185 L85 130 Q105 120 125 130 L135 185 Z" fill="#3b82f6"/>
    <!-- Hoodie Hood behind head -->
    <path d="M82 105 Q105 90 128 105 L132 125 Q105 115 78 125 Z" fill="#2563eb"/>

    <!-- Arms gripping head in intense pain -->
    <!-- Left Arm -->
    <path d="M80 140 Q65 110 88 95 L95 105 Q82 115 88 135 Z" fill="#3b82f6"/>
    <!-- Left Hand clasping temple -->
    <circle cx="92" cy="94" r="7" fill="#fbcfe8"/>

    <!-- Right Arm -->
    <path d="M130 140 Q145 110 122 95 L115 105 Q128 115 122 135 Z" fill="#3b82f6"/>
    <!-- Right Hand clasping temple -->
    <circle cx="118" cy="94" r="7" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="98" y="112" width="14" height="18" fill="#fbcfe8"/>

    <!-- Head / Face in agony -->
    <circle cx="105" cy="98" r="18" fill="#fbcfe8"/>

    <!-- Facial Expression: Eyes tightly shut in sharp pain (> <) -->
    <!-- Left eye squeeze -->
    <path d="M93 94 L98 98 L93 102" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right eye squeeze -->
    <path d="M117 94 L112 98 L117 102" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Heavy furrowed brow / stress lines -->
    <line x1="97" y1="91" x2="102" y2="93" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="113" y1="91" x2="108" y2="93" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Suffering Mouth (wincing / gritting teeth) -->
    <path d="M98 108 Q105 104 112 108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="107" x2="110" y2="107" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Messy Hair -->
    <path d="M87 95 Q90 80 105 80 Q120 80 123 95 Q115 84 105 84 Q95 84 87 95 Z" fill="#1e293b"/>
    <path d="M95 82 Q105 76 115 83" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- Sweat Drops (signifying intense physical/mental suffering) -->
    <path d="M83 98 Q80 104 83 107 Q86 104 83 98 Z" fill="#38bdf8"/>
    <path d="M127 98 Q130 104 127 107 Q124 104 127 98 Z" fill="#38bdf8"/>
    <path d="M107 88 Q105 83 107 81 Q109 83 107 88 Z" fill="#38bdf8"/>
  </g>

  <!-- Pulsing Pain Radiations/Sparks (Visual cue of "这种痛苦" - this pain) -->
  <path d="M35 85 L45 92" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 105 L40 108" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M185 85 L175 92" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M192 105 L180 108" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="95" r="2" fill="#ef4444"/>
  <circle cx="188" cy="95" r="2" fill="#ef4444"/>

</svg>