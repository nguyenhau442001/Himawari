<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="windowClip">
      <path d="M160 30 H210 V110 H160 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Classroom Environment / Background Details -->
  <!-- Bookshelf on the left -->
  <rect x="15" y="50" width="35" height="130" fill="#334155" rx="3"/>
  <rect x="18" y="80" width="29" height="6" fill="#475569"/>
  <rect x="18" y="115" width="29" height="6" fill="#475569"/>
  <rect x="18" y="150" width="29" height="6" fill="#475569"/>
  <!-- Books on shelf -->
  <path d="M22 75 H28 V80 H22 Z" fill="#ec4899"/>
  <path d="M30 72 H37 V80 H30 Z" fill="#38bdf8"/>
  <path d="M23 108 H29 V115 H23 Z" fill="#10b981"/>
  <path d="M32 105 H38 V115 H32 Z" fill="#f59e0b"/>

  <!-- Window in background -->
  <rect x="160" y="30" width="50" height="80" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <rect x="160" y="30" width="50" height="80" fill="url(#windowGlow)"/>
  <!-- Window pane dividers -->
  <line x1="185" y1="30" x2="185" y2="110" stroke="#475569" stroke-width="1.5"/>
  <line x1="160" y1="70" x2="210" y2="70" stroke="#475569" stroke-width="1.5"/>
  <!-- Outside plant silhouettes -->
  <path d="M175 110 Q170 95 180 85 Q190 95 185 110 Z" fill="#1e293b"/>

  <!-- Warm lamp light effect illuminating the scene -->
  <circle cx="120" cy="110" r="90" fill="url(#warmLight)" pointer-events="none"/>

  <!-- Teacher's Desk -->
  <path d="M60 160 H180 V175 H60 Z" fill="#475569"/>
  <path d="M65 175 L70 215 H85 L80 175 Z" fill="#334155"/>
  <path d="M175 175 L170 215 H155 L160 175 Z" fill="#334155"/>
  <!-- Desk props -->
  <!-- Stack of notebooks -->
  <rect x="75" y="152" width="25" height="8" rx="1" fill="#cbd5e1"/>
  <rect x="73" y="150" width="27" height="3" rx="1" fill="#f8fafc"/>
  <!-- Desk lamp base & arm -->
  <ellipse cx="155" cy="158" rx="8" ry="3" fill="#cbd5e1"/>
  <path d="M155 158 Q145 135 135 125" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M130 120 L140 122 L138 128 L128 126 Z" fill="#f59e0b"/>

  <!-- CHARACTER 1: Student (Sitting, looking slightly concerned/attentive) -->
  <g id="student">
    <!-- Student Body / Torso -->
    <path d="M80 165 C80 145 95 140 105 140 C115 140 125 145 125 165 Z" fill="#38bdf8"/>
    <!-- Student Collar/Shirt Details -->
    <path d="M98 140 L105 150 L112 140 Z" fill="#f8fafc"/>

    <!-- Student Head -->
    <circle cx="105" cy="118" r="16" fill="#fcd34d"/>
    <!-- Student Hair -->
    <path d="M89 118 C89 105 101 100 115 105 C121 108 121 118 121 118 C121 118 113 112 105 112 C97 112 89 118 89 118 Z" fill="#334155"/>
    
    <!-- Student Face Features (Gentle, receptive) -->
    <circle cx="100" cy="117" r="1.5" fill="#1e293b"/>
    <circle cx="110" cy="117" r="1.5" fill="#1e293b"/>
    <!-- Gentle neutral/thoughtful mouth -->
    <path d="M103 124 Q105 126 107 124" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Soft blush -->
    <ellipse cx="97" cy="120" rx="2" ry="1" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="113" cy="120" rx="2" ry="1" fill="#f43f5e" opacity="0.4"/>

    <!-- Student Arm (resting on desk/holding pen) -->
    <path d="M85 155 Q95 165 105 160" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="105" cy="160" r="3" fill="#fcd34d"/>
  </g>


  <!-- CHARACTER 2: Teacher (Standing, leaning forward with warm, caring expression) -->
  <g id="teacher">
    <!-- Teacher Body / Torso (Leaning forward) -->
    <path d="M125 155 C125 130 145 120 160 125 C175 130 180 150 180 165 Z" fill="#10b981"/>
    <!-- Teacher Jacket lapels -->
    <path d="M145 127 L155 145 L135 150 Z" fill="#047857"/>

    <!-- Teacher Head -->
    <circle cx="155" cy="105" r="17" fill="#fcd34d"/>
    <!-- Teacher Hair (neatly styled) -->
    <path d="M138 105 C138 90 150 85 168 92 C172 95 172 105 172 105 C172 105 165 98 155 98 C145 98 138 105 138 105 Z" fill="#1e293b"/>

    <!-- Teacher Face (Warm, empathetic smile, gentle eyes) -->
    <!-- Friendly curved eyes indicating kindness -->
    <path d="M148 105 Q151 102 154 105" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M158 105 Q161 102 164 105" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Warm smile -->
    <path d="M151 112 Q156 117 161 112" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Warm blush -->
    <ellipse cx="146" cy="108" rx="2.5" ry="1.2" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="166" cy="108" rx="2.5" ry="1.2" fill="#f43f5e" opacity="0.4"/>

    <!-- Teacher Arm reaching out to gently place hand on student's shoulder -->
    <!-- Shoulder/arm reaching forward -->
    <path d="M140 135 C125 135 115 130 110 135" stroke="#10b981" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Caring hand on student's shoulder -->
    <circle cx="108" cy="135" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Foreground details to create rich depth (Coffee mug on desk) -->
  <path d="M125 160 H137 V172 C137 175 134 178 131 178 H131 C128 178 125 175 125 172 Z" fill="#f8fafc"/>
  <path d="M137 163 H140 C142 163 143 165 143 167 C143 169 142 171 140 171 H137" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <!-- Steam rising softly from mug (symbolizing warmth & care) -->
  <path d="M128 153 Q131 148 129 143 Q127 138 130 133" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Subtle glowing care/warmth particle highlights floating gently -->
  <circle cx="125" cy="95" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="138" cy="82" r="1.5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="112" cy="88" r="1" fill="#fbbf24" opacity="0.7"/>

  <!-- Outer frame border overlay for polished app vector look -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>