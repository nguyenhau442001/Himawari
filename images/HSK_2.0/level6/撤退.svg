<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Terrain/Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 C 80 160, 160 200, 240 180 L240 240 L0 240 Z" fill="#475569"/>

  <!-- Commander Character -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <rect x="12" y="32" width="16" height="30" rx="4" fill="#fb923c"/>
    <path d="M12 40 L4 55 M28 40 L36 55" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M16 62 L14 85 M24 62 L26 85" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="32" width="20" height="6" fill="#f59e0b"/>
  </g>

  <!-- Soldier Character 1 -->
  <g transform="translate(120, 120)">
    <circle cx="20" cy="20" r="10" fill="#38bdf8"/>
    <rect x="14" y="30" width="12" height="25" rx="3" fill="#38bdf8"/>
    <path d="M14 35 L5 45 M26 35 L35 45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M16 55 L14 75 M24 55 L26 75" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Soldier Character 2 -->
  <g transform="translate(170, 130)">
    <circle cx="20" cy="20" r="10" fill="#38bdf8"/>
    <rect x="14" y="30" width="12" height="25" rx="3" fill="#38bdf8"/>
    <path d="M14 35 L5 45 M26 35 L35 45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M16 55 L14 75 M24 55 L26 75" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Directional Motion Lines -->
  <path d="M180 100 L220 80 M190 110 L230 90 M200 120 L240 100" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Command Signal/Flag -->
  <rect x="55" y="70" width="4" height="60" fill="#94a3b8"/>
  <path d="M59 70 L80 85 L59 100 Z" fill="#ec4899"/>
