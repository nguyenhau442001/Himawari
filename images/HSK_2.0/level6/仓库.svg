<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Warehouse Background Structure -->
  <rect x="20" y="60" width="200" height="140" rx="4" fill="#334155"/>
  <path d="M20 60 L40 40 L220 40 L200 60 Z" fill="#475569"/>
  <rect x="30" y="70" width="40" height="120" fill="#1e293b" opacity="0.3"/>
  <rect x="80" y="70" width="40" height="120" fill="#1e293b" opacity="0.3"/>
  <rect x="130" y="70" width="40" height="120" fill="#1e293b" opacity="0.3"/>
  <rect x="180" y="70" width="30" height="120" fill="#1e293b" opacity="0.3"/>

  <!-- Shelving Units -->
  <rect x="30" y="80" width="50" height="10" fill="#64748b"/>
  <rect x="30" y="110" width="50" height="10" fill="#64748b"/>
  <rect x="30" y="140" width="50" height="10" fill="#64748b"/>
  
  <rect x="150" y="80" width="60" height="10" fill="#64748b"/>
  <rect x="150" y="110" width="60" height="10" fill="#64748b"/>
  <rect x="150" y="140" width="60" height="10" fill="#64748b"/>

  <!-- Cargo Boxes -->
  <rect x="35" y="65" width="20" height="15" fill="#fb923c"/>
  <rect x="60" y="65" width="15" height="15" fill="#f59e0b"/>
  <rect x="160" y="95" width="20" height="15" fill="#fbbf24"/>
  <rect x="185" y="95" width="20" height="15" fill="#fb923c"/>
  <rect x="160" y="125" width="40" height="15" fill="#f59e0b"/>

  <!-- Worker Character -->
  <g transform="translate(100, 150)">
    <circle cx="20" cy="20" r="10" fill="#fde68a"/>
    <rect x="15" y="30" width="10" height="30" rx="2" fill="#38bdf8"/>
    <rect x="5" y="35" width="8" height="20" rx="2" fill="#38bdf8" transform="rotate(-10 9 35)"/>
    <rect x="27" y="35" width="8" height="20" rx="2" fill="#38bdf8" transform="rotate(10 31 35)"/>
    <rect x="15" y="60" width="4" height="20" rx="1" fill="#1e293b"/>
    <rect x="21" y="60" width="4" height="20" rx="1" fill="#1e293b"/>
  </g>

  <!-- Foreground Box being placed -->
  <rect x="80" y="180" width="40" height="30" rx="2" fill="#ec4899"/>
  <path d="M80 180 L90 170 L130 170 L120 180 Z" fill="#db2777"/>
  <path d="M120 180 L130 170 L130 200 L120 210 Z" fill="#be185d"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="40" r="60" fill="#f59e0b" opacity="0.05"/>
</svg>