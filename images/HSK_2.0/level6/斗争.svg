<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm bedside light glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window moonlight / hope glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Heartbeat/Vitality Line Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Background Elements -->
  <!-- Wallpaper subtle lines -->
  <path d="M0 40 H240 M0 90 H240 M0 140 H240 M0 190 H240" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />

  <!-- Window Frame & Night Sky -->
  <g id="window" transform="translate(15, 20)">
    <rect x="0" y="0" width="55" height="85" rx="4" fill="#090d16" stroke="#475569" stroke-width="2" />
    <rect x="5" y="5" width="45" height="75" fill="url(#window-glow)" />
    <!-- Window Panes Cross -->
    <path d="M27.5 5 V80 M5 42.5 H50" stroke="#475569" stroke-width="1.5" />
    <!-- City Skyline outside -->
    <path d="M8 80 V55 L14 48 L18 80 Z" fill="#1e293b" />
    <path d="M20 80 V40 L28 32 L36 80 Z" fill="#1e293b" />
    <path d="M38 80 V50 L45 80 Z" fill="#1e293b" />
    <!-- Tiny Stars of Hope -->
    <circle cx="15" cy="18" r="0.8" fill="#f8fafc" />
    <circle cx="42" cy="12" r="1" fill="#f8fafc" />
    <circle cx="35" cy="25" r="0.6" fill="#f8fafc" />
  </g>

  <!-- Wall Shelf with Medicine & Clock (Long-term struggle context) -->
  <g id="shelf" transform="translate(155, 30)">
    <rect x="0" y="0" width="70" height="4" rx="2" fill="#64748b" />
    <!-- Pill bottles / medicine jars -->
    <rect x="10" y="-14" width="12" height="14" rx="2" fill="#f43f5e" />
    <rect x="12" y="-17" width="8" height="3" fill="#cbd5e1" />
    <rect x="26" y="-18" width="16" height="18" rx="3" fill="#38bdf8" />
    <rect x="30" y="-21" width="8" height="3" fill="#cbd5e1" />
    <!-- Small clock implying time passing / perseverance -->
    <circle cx="55" cy="-10" r="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <line x1="55" y1="-10" x2="55" y2="-15" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="55" y1="-10" x2="60" y2="-10" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Bed / Patient Environment -->
  <g id="bed">
    <!-- Bed Headboard -->
    <rect x="25" y="100" width="190" height="110" rx="12" fill="#334155" />
    <rect x="30" y="105" width="180" height="100" rx="8" fill="#1e293b" />
    
    <!-- Pillow -->
    <path d="M38 120 C38 112 46 108 58 108 H98 C110 108 118 112 118 120 C118 128 110 132 98 132 H58 C46 132 38 128 38 120 Z" fill="#cbd5e1" />
    <path d="M40 120 C40 114 47 110 58 110 H98 C109 110 116 114 116 120 C116 126 109 130 98 130 H58 C47 130 40 126 40 120 Z" fill="#f1f5f9" />

    <!-- Blanket / Duvet (Covering patient) -->
    <path d="M35 155 Q80 145 140 155 T215 150 V205 H35 Z" fill="#0284c7" />
    <path d="M35 165 Q80 155 140 165 T215 160 V205 H35 Z" fill="#0369a1" />
    <!-- Blanket fold details -->
    <path d="M35 155 Q80 145 140 155 T215 150" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <!-- Character (Patient sitting up bravely, fighting back) -->
  <g id="patient">
    <!-- Patient Body / Shoulders -->
    <path d="M55 165 C55 145 70 135 85 135 H105 C120 135 135 145 135 165 Z" fill="#f8fafc" />
    <!-- Hospital gown collar -->
    <path d="M75 135 L95 135 L100 150 L70 150 Z" fill="#e2e8f0" />

    <!-- Patient Head & Face (Determined expression) -->
    <g id="head" transform="translate(85, 115)">
      <!-- Neck -->
      <rect x="-8" y="10" width="16" height="15" fill="#fbcfe8" />
      <!-- Head Base -->
      <circle cx="0" cy="0" r="18" fill="#fbcfe8" />
      
      <!-- Hair (Messy/Bedhead, showing weariness but styled determinedly) -->
      <path d="M-17 -5 C-18 -16 -8 -21 2 -21 C14 -21 19 -14 18 -5 C14 -8 10 -6 5 -12 C0 -12 -5 -5 -17 -5 Z" fill="#334155" />

      <!-- Eyes - Determined look (firm curved lines, looking forward) -->
      <path d="M-7 -2 C-5 -4 -3 -4 -1 -2" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M3 -2 C5 -4 7 -4 9 -2" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Determined mouth (slight resolute upward curve) -->
      <path d="M-3 6 C-1 8 1 8 3 6" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Cheeks showing slight strain/flush of battle -->
      <circle cx="-10" cy="3" r="3" fill="#f43f5e" opacity="0.3" />
      <circle cx="10" cy="3" r="3" fill="#f43f5e" opacity="0.3" />
    </g>

    <!-- Arms / Fists of "斗争" (Fighting / Resisting sickness) -->
    <!-- Left Arm raised in determination over blanket -->
    <path d="M60 145 L45 125 L55 118 L68 138 Z" fill="#fbcfe8" />
    <!-- Clenched Fist -->
    <circle cx="42" cy="116" r="6" fill="#fbcfe8" stroke="#e11d48" stroke-width="1" />
  </g>

  <!-- Medical Equipment & Vitality Monitor (The "Disease/Battlefield" context) -->
  <g id="monitor-stand" transform="translate(170, 110)">
    <!-- Pole -->
    <line x1="15" y1="20" x2="15" y2="90" stroke="#64748b" stroke-width="3" />
    <!-- IV Bag -->
    <rect x="8" y="25" width="14" height="22" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M12 25 V20 H18 V25" fill="none" stroke="#64748b" stroke-width="1.5" />
    <!-- Liquid inside IV -->
    <rect x="10" y="32" width="10" height="12" rx="2" fill="#38bdf8" opacity="0.7" />
    <!-- IV Tube flowing to patient -->
    <path d="M15 47 C15 65 -20 80 -65 65" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" />

    <!-- Heart Rate Monitor Screen -->
    <g transform="translate(-15, 40)">
      <rect x="0" y="0" width="45" height="30" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Vitality EKG Wave (Pulsing green line - depicting life fighting back) -->
      <path d="M4 15 H12 L15 8 L19 22 L23 12 L26 18 L30 15 H41" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" filter="url(#glow)" />
      <!-- Screen glow dot -->
      <circle cx="39" cy="15" r="1.5" fill="#34d399" />
    </g>
  </g>

  <!-- Bedside Table & Warm Lamp -->
  <g id="bedside-table" transform="translate(15, 135)">
    <!-- Cabinet Body -->
    <rect x="0" y="10" width="35" height="60" rx="4" fill="#475569" />
    <rect x="4" y="16" width="27" height="22" rx="2" fill="#334155" />
    <circle cx="17" cy="27" r="2" fill="#94a3b8" />
    <rect x="4" y="44" width="27" height="22" rx="2" fill="#334155" />
    <circle cx="17" cy="55" r="2" fill="#94a3b8" />

    <!-- Lamp Base & Light -->
    <ellipse cx="17" cy="10" rx="10" ry="3" fill="#cbd5e1" />
    <path d="M14 10 L16 -2 H18 L20 10 Z" fill="#94a3b8" />
    <!-- Lampshade -->
    <path d="M8 -2 L26 -2 L22 -16 L12 -16 Z" fill="#f59e0b" />
    <!-- Light Glow Beam Effect over scene -->
    <path d="M8 -16 L-20 70 H46 Z" fill="url(#lamp-glow)" pointer-events="none" />
  </g>

  <!-- Cozy Floor Rug at base -->
  <ellipse cx="120" cy="220" r="85" fill="#334155" opacity="0.4" />
</svg>