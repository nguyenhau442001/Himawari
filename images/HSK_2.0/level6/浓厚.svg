    <ellipse cx="8" cy="-25" rx="3" ry="4" fill="#0f172a"/>
  </g>
  
  <!-- Musical elements (Floating) -->
  <path d="M180 80 C 190 70, 200 70, 210 80 S 220 90, 210 100" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="110" r="5" fill="#10b981"/>
  <rect x="190" y="50" width="6" height="20" rx="2" fill="#fbbf24"/>
  <rect x="205" y="45" width="6" height="25" rx="2" fill="#fbbf24"/>
  
  <!-- Books/Records -->
  <rect x="30" y="130" width="40" height="30" rx="4" fill="#475569"/>
  <rect x="35" y="135" width="30" height="20" rx="2" fill="#1e293b"/>
  
  <!-- Note -->
