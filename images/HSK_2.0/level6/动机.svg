<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-glow)" />

  <!-- Background Environment & Window -->
  <!-- Window frame showing mysterious night city -->
  <path d="M 140,25 L 210,25 L 210,110 L 140,110 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- City building silhouettes outside -->
  <rect x="148" y="60" width="12" height="50" fill="#1e293b" />
  <rect x="164" y="45" width="16" height="65" fill="#1e293b" />
  <rect x="184" y="70" width="18" height="40" fill="#1e293b" />
  <!-- City window lights -->
  <rect x="152" y="65" width="4" height="4" fill="#fbbf24" opacity="0.6"/>
  <rect x="168" y="55" width="4" height="6" fill="#38bdf8" opacity="0.6"/>
  <rect x="188" y="80" width="4" height="4" fill="#fbbf24" opacity="0.4"/>

  <!-- Ambient background glow behind detective/observer -->
  <circle cx="90" cy="110" r="60" fill="url(#amber-glow)" />

  <!-- Bookshelf background element -->
  <rect x="25" y="40" width="40" height="75" fill="#111827" rx="2" />
  <line x1="25" y1="65" x2="65" y2="65" stroke="#374151" stroke-width="2" />
  <line x1="25" y1="90" x2="65" y2="90" stroke="#374151" stroke-width="2" />
  <!-- Books -->
  <rect x="29" y="48" width="6" height="17" fill="#ef4444" opacity="0.8" />
  <rect x="36" y="51" width="5" height="14" fill="#3b82f6" opacity="0.8" />
  <rect x="43" y="45" width="8" height="20" fill="#10b981" opacity="0.8" />
  <rect x="30" y="73" width="7" height="17" fill="#f59e0b" opacity="0.8" />
  <rect x="39" y="76" width="6" height="14" fill="#8b5cf6" opacity="0.8" />

  <!-- Desk Surface -->
  <path d="M 10,185 L 230,185 L 210,140 L 30,140 Z" fill="url(#desk-grad)" filter="url(#soft-shadow)" />
  <!-- Desk front edge -->
  <rect x="10" y="185" width="220" height="6" fill="#475569" rx="1" />

  <!-- Props on Desk: Laptop showing data/investigation charts -->
  <g transform="translate(145, 125)">
    <!-- Laptop Base -->
    <path d="M -15,35 L 45,35 L 55,45 L -25,45 Z" fill="#64748b" />
    <!-- Laptop Screen Back -->
    <rect x="-18" y="-5" width="65" height="42" rx="3" fill="#475569" />
    <!-- Screen Display -->
    <rect x="-14" y="-1" width="57" height="34" rx="1" fill="#0f172a" />
    <!-- Chart lines on screen representing "motivation/analysis" -->
    <polyline points="-8,20 2,12 12,16 26,4 40,8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="4" r="3" fill="#f43f5e" />
    <path d="M-8,25 L15,25" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass Prop (Symbolizing investigation into "motives") -->
  <g transform="translate(115, 155) rotate(-25)">
    <line x1="0" y1="0" x2="-22" y2="22" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <circle cx="15" cy="-15" r="14" fill="none" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="15" cy="-15" r="12" fill="#38bdf8" fill-opacity="0.15" />
    <path d="M 8,-18 Q 15,-10 20,-15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="75" y="153" width="16" height="20" rx="3" fill="#f8fafc" />
  <path d="M 91,158 C 96,158 96,168 91,168" fill="none" stroke="#f8fafc" stroke-width="2" />
  <path d="M 79,150 Q 83,143 87,150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- MAIN CHARACTER: Curious/Puzzled Observer / Investigator -->
  <!-- Body / Torso -->
  <path d="M 60,195 C 60,165 85,150 110,150 C 135,150 160,165 160,195 Z" fill="#2563eb" />
  <!-- Jacket Collar / Lapel -->
  <path d="M 85,150 L 97,175 L 110,155 L 123,175 L 135,150" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" />
  <!-- Inner Shirt / Tie -->
  <polygon points="104,155 116,155 110,180" fill="#f8fafc" />
  <polygon points="108,162 112,162 110,175" fill="#ef4444" />

  <!-- Neck -->
  <rect x="100" y="135" width="20" height="20" fill="#fcd34d" />

  <!-- Head -->
  <circle cx="110" cy="115" r="26" fill="#fcd34d" />

  <!-- Hair Style -->
  <path d="M 86,110 C 85,95 95,88 112,88 C 130,88 136,98 135,115 C 135,115 130,103 118,103 C 105,103 93,108 86,110 Z" fill="#1e293b" />

  <!-- Facial Expression: Puzzled, questioning ("What is the motive?") -->
  <!-- Eyebrows (Furrowed / Questioning asymmetry) -->
  <path d="M 96,106 Q 102,102 108,107" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 113,106 Q 119,100 125,103" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes -->
  <circle cx="102" cy="114" r="3" fill="#1e293b" />
  <circle cx="120" cy="114" r="3" fill="#1e293b" />

  <!-- Nose -->
  <path d="M 112,116 Q 114,121 110,123" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

  <!-- Mouth (Pensive, questioning expression - slight "O" shape or asymmetry) -->
  <circle cx="112" cy="131" r="3" fill="#b45309" />

  <!-- Hand scratching head in deep thought / questioning gesture -->
  <path d="M 125,130 C 138,125 142,105 135,95" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
  <!-- Fingers -->
  <circle cx="135" cy="93" r="4" fill="#fcd34d" />

  <!-- Floating Conceptual Elements: Question Mark & Target/Gears representing "Motive / Dongji" -->
  <!-- Glowing Question Mark indicating "What is the motive?" -->
  <g transform="translate(100, 35)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="3" />
    <path d="M -6,-7 C -6,-13 6,-13 6,-6 C 6,0 -2,3 -2,9" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    <circle cx="-2" cy="14" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Secondary subtle floating puzzle pieces / gears on the left -->
  <g transform="translate(45, 90)" opacity="0.8">
    <circle cx="0" cy="0" r="14" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <path d="M -6,-4 L 6,-4 L 0,8 Z" fill="#38bdf8" />
  </g>
</svg>