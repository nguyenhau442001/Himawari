<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Speech Bubble Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Character 1 Skin / Hair Styles -->
    <clipPath id="circleClip">
      <circle cx="120" cy="120" r="100"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glow -->
  <circle cx="120" cy="120" r="120" fill="url(#spotlight)"/>

  <!-- Interior Background Elements (Classroom / Meeting Room) -->
  <!-- Back Wall & Panel Line -->
  <line x1="30" y1="185" x2="210" y2="185" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Bookshelf / Plants in Background -->
  <rect x="35" y="75" width="22" height="60" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="40" y="85" width="12" height="6" rx="1" fill="#64748b" opacity="0.5"/>
  <rect x="38" y="95" width="16" height="6" rx="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="41" y="105" width="10" height="6" rx="1" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Window grid -->
  <rect x="180" y="55" width="30" height="45" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="195" y1="55" x2="195" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="77" x2="210" y2="77" stroke="#334155" stroke-width="2"/>

  <!-- Desks -->
  <path d="M 15 200 L 95 170 L 140 170 L 225 200 Z" fill="#334155" opacity="0.8"/>
  <rect x="85" y="170" width="70" height="35" fill="#475569" rx="3"/>
  
  <!-- Desk props: laptop, notebook, pen -->
  <rect x="105" y="177" width="30" height="18" rx="2" fill="#94a3b8"/>
  <path d="M 100 195 L 140 195 L 143 198 L 97 198 Z" fill="#cbd5e1"/>
  <rect x="145" y="180" width="14" height="18" rx="1" fill="#f1f5f9"/>
  <line x1="148" y1="185" x2="155" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="148" y1="190" x2="153" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- CHARACTER 1: LISTENER / INSTRUCTOR (Left side, giving prompt) -->
  <g transform="translate(15, 30)">
    <!-- Body / Torso -->
    <path d="M 35 130 C 35 110, 50 100, 65 100 C 80 100, 95 110, 95 130 L 95 160 L 35 160 Z" fill="#0284c7"/>
    <!-- Collar/Details -->
    <path d="M 55 100 L 65 115 L 75 100" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Head & Neck -->
    <path d="M 60 90 L 70 90 L 70 102 L 60 102 Z" fill="#fbcfe8"/>
    <circle cx="65" cy="72" r="18" fill="#fbcfe8"/>
    
    <!-- Hair (Instructor) -->
    <path d="M 47 72 C 47 55, 83 55, 83 72 C 83 75, 82 78, 80 80 L 78 68 C 70 63, 60 63, 52 68 L 50 80 C 48 78, 47 75, 47 72 Z" fill="#334155"/>

    <!-- Face details -->
    <!-- Friendly smiling eye -->
    <path d="M 68 70 Q 72 67, 75 70" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Pointing / Explaining Hand -->
    <path d="M 85 115 C 95 115, 105 110, 108 105 C 110 102, 108 98, 104 99 C 100 100, 95 108, 90 110" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CHARACTER 2: SPEAKER / STUDENT (Right side, retelling/repeating) -->
  <g transform="translate(100, 25)">
    <!-- Torso -->
    <path d="M 40 135 C 40 115, 55 105, 75 105 C 95 105, 110 115, 110 135 L 115 165 L 35 165 Z" fill="#10b981"/>
    <!-- Collar -->
    <path d="M 65 105 L 75 120 L 85 105" fill="none" stroke="#d1fae5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head & Neck -->
    <path d="M 70 95 L 80 95 L 80 108 L 70 108 Z" fill="#fbcfe8"/>
    <circle cx="75" cy="77" r="19" fill="#fbcfe8"/>

    <!-- Hair (Student - Modern neat bob) -->
    <path d="M 55 77 C 55 58, 95 58, 95 77 C 95 85, 92 92, 88 95 L 85 80 C 80 75, 70 75, 65 80 L 62 95 C 58 92, 55 85, 55 77 Z" fill="#1e293b"/>

    <!-- Face Profile: Active Speaking Expression -->
    <!-- Focused/Talking Eye -->
    <circle cx="83" cy="74" r="2.5" fill="#1e293b"/>
    <!-- Eyebrow raised slightly in concentration -->
    <path d="M 79 67 Q 83 65, 87 68" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Open mouth (speaking / retelling action) -->
    <path d="M 83 83 C 83 83, 89 83, 89 86 C 89 89, 83 89, 83 86 Z" fill="#9f1239"/>

    <!-- Active Gesture Hand (Holding chin / thoughtful retelling gesture) -->
    <path d="M 70 130 C 70 120, 75 115, 82 118 C 85 119, 86 123, 83 126" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ACTION & RETELLING VISUAL CUE: Floating Concept Graphic / Story Recall -->
  <!-- Represents "Recalling & Retelling Content" (Narrative flow bubbles) -->
  <g transform="translate(110, 15)">
    <!-- Main thought/speech bubble containing stylized story sequence icons -->
    <rect x="-15" y="0" width="75" height="42" rx="10" fill="#ffffff" filter="url(#glow)" opacity="0.95"/>
    <path d="M 5 42 L 12 52 L 20 42 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Mini storyline graphics inside the bubble (Representing content being retold) -->
    <!-- Mini Document Icon -->
    <rect x="-5" y="10" width="12" height="16" rx="2" fill="#e2e8f0"/>
    <line x1="-2" y1="14" x2="4" y2="14" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-2" y1="18" x2="4" y2="18" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-2" y1="22" x2="2" y2="22" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arrow Flow (representing 're-stating' or 'retelling sequence') -->
    <path d="M 11 18 Q 15 15, 19 18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <polygon points="19,16 23,19 18,21" fill="#f59e0b"/>

    <!-- Mini Speech / Output Icon -->
    <rect x="25" y="10" width="22" height="16" rx="3" fill="#38bdf8" opacity="0.2"/>
    <!-- Sound Waves / Voice output -->
    <path d="M 30 14 L 30 22" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <path d="M 34 12 L 34 24" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <path d="M 38 15 L 38 21" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Secondary Echo Bubbles (Creating rhythm of repeating/recounting) -->
  <circle cx="102" cy="78" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="112" cy="70" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="125" cy="58" r="9" fill="#38bdf8" opacity="0.4"/>

  <!-- Foreground Ambient Glow / Vignette Accent -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
</svg>