<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definition background elements: Contrast and Scale (Adjective rule) -->
  <!-- Ephemeral element: Small, fading cosmic dust/star cluster representing transience -->
  <g opacity="0.3">
    <circle cx="70" cy="120" r="1.5" fill="#8B9BB4"/>
    <circle cx="85" cy="105" r="1" fill="#8B9BB4"/>
    <circle cx="60" cy="135" r="1" fill="#8B9BB4"/>
    <path d="M 65 110 L 75 125" stroke="#8B9BB4" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Eternal element: Massive, glowing celestial orbit/ring representing unending time -->
  <!-- Outer boundless structure -->
  <ellipse cx="140" cy="120" rx="65" ry="30" fill="none" stroke="#2D3748" stroke-width="2" transform="rotate(-15 140 120)"/>
  
  <!-- Primary Golden Arc representing infinite duration (Scale exaggeration & contrast) -->
  <path d="M 82 135 A 65 30 0 1 1 198 105" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(-15 140 120)"/>
  
  <!-- Glowing core / Anchor of eternity -->
  <circle cx="140" cy="120" r="22" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="140" cy="120" r="14" fill="#F59E0B" opacity="0.2"/>
  
  <!-- Infinite loop / Hourglass abstract representation fused with modern sleek geometry -->
  <path d="M 134 110 C 134 116 146 124 146 130 C 146 136 134 144 134 150 C 134 150 134 150 134 150" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 146 110 C 146 116 134 124 134 130 C 134 136 146 144 146 150" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  
  <circle cx="140" cy="104" r="3" fill="#FBBF24"/>
  <circle cx="140" cy="136" r="3" fill="#FBBF24"/>

  <!-- Accenting timeless light particles (Gold) -->
  <circle cx="185" cy="75" r="2" fill="#FBBF24" opacity="0.8"/>
  <circle cx="95" cy="170" r="1.5" fill="#FBBF24" opacity="0.5"/>
  <path d="M 185 75 L 180 70" stroke="#FBBF24" stroke-width="1" opacity="0.5"/>
</svg>