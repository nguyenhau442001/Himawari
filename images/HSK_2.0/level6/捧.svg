<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with deep slate gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="teaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Background Room Elements -->
  <!-- Window / Night view -->
  <path d="M165 45 L210 50 L210 130 L165 125 Z" fill="#090d16" opacity="0.8" />
  <circle cx="188" cy="70" r="8" fill="#fef08a" opacity="0.4" />
  <!-- Window frame lines -->
  <line x1="187" y1="50" x2="187" y2="128" stroke="#334155" stroke-width="2" />
  <line x1="165" y1="88" x2="210" y2="90" stroke="#334155" stroke-width="2" />

  <!-- Bookshelf / cozy ambient details -->
  <rect x="25" y="60" width="40" height="8" rx="2" fill="#334155" />
  <rect x="30" y="42" width="12" height="18" fill="#38bdf8" rx="1" opacity="0.6" />
  <rect x="44" y="45" width="10" height="15" fill="#ec4899" rx="1" opacity="0.6" />
  
  <!-- Warm hanging pendant lamp top right -->
  <path d="M100 15 L140 15 L130 35 L110 35 Z" fill="#334155" />
  <path d="M120 35 L120 60" stroke="#475569" stroke-width="2" />
  <ellipse cx="120" cy="62" rx="18" ry="6" fill="#fbbf24" opacity="0.9" />

  <!-- Table surface -->
  <rect x="15" y="195" width="210" height="8" rx="4" fill="#334155" />
  <path d="M30 203 L40 230" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <path d="M210 203 L200 230" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- Character Torso & Shoulders -->
  <!-- Cozy sweater / clothing -->
  <path d="M90 200 C90 160 110 145 120 145 C130 145 150 160 150 200 Z" fill="#38bdf8" />
  <!-- Collar -->
  <path d="M105 147 C120 157 135 147 135 147 C135 147 125 153 120 153 C115 153 105 147 105 147 Z" fill="#bae6fd" />

  <!-- Character Neck -->
  <rect x="112" y="132" width="16" height="18" rx="6" fill="#fcd34d" />

  <!-- Character Head -->
  <circle cx="120" cy="115" r="26" fill="#fde68a" />

  <!-- Hair Style -->
  <path d="M94 112 C92 90 105 85 120 85 C135 85 148 90 146 115 C146 115 148 100 138 95 C128 90 112 90 102 96 C94 100 94 112 94 112 Z" fill="#1e293b" />
  <path d="M94 110 C92 120 95 130 100 135 C97 125 97 118 94 110 Z" fill="#1e293b" />

  <!-- Relaxed / Happy Face Details -->
  <!-- Eyes (closed in peaceful enjoyment) -->
  <path d="M110 115 Q115 120 120 115" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M125 115 Q130 120 135 115" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Gentle smile -->
  <path d="M116 126 Q120 130 124 126" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Rosy cheeks -->
  <circle cx="107" cy="122" r="4" fill="#fb7185" opacity="0.6" />
  <circle cx="133" cy="122" r="4" fill="#fb7185" opacity="0.6" />

  <!-- TWO HANDS ACTIVELY "PENG" (CUFFING / HOLDING WITH TWO HANDS) THE TEA CUP -->
  <!-- Left Hand (Cupping from left side/bottom) -->
  <path d="M98 160 C92 165 95 178 105 178 C112 178 112 170 112 165 Z" fill="#fcd34d" />
  <!-- Left arm sleeve connection -->
  <path d="M90 175 L102 170" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

  <!-- Right Hand (Cupping from right side/bottom) -->
  <path d="M142 160 C148 165 145 178 135 178 C128 178 128 170 128 165 Z" fill="#fcd34d" />
  <!-- Right arm sleeve connection -->
  <path d="M150 175 L138 170" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

  <!-- TEA CUP (Held securely in both hands) -->
  <rect x="106" y="152" width="28" height="32" rx="4" fill="#ffffff" />
  <!-- Inner cup depth/rim -->
  <ellipse cx="120" cy="152" rx="14" ry="4" fill="#e2e8f0" />
  <!-- Hot Tea liquid inside -->
  <ellipse cx="120" cy="153" rx="12" ry="3" fill="url(#teaGradient)" />

  <!-- Steam rising from hot tea -->
  <path d="M115 140 Q112 130 118 120 Q124 110 120 100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M125 142 Q128 132 123 122 Q118 112 122 102" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- Additional cozy background items on table -->
  <circle cx="65" cy="195" r="12" fill="#cbd5e1" opacity="0.2" />
</svg>