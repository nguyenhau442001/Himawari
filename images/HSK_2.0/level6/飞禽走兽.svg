<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#091e14" />
    </linearGradient>

    <!-- Glowing Sun/Moon Light -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Canopy Gradient -->
    <linearGradient id="canopyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="canopyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Ambient Light Circle -->
  <circle cx="120" cy="110" r="90" fill="url(#sunGlow)" />

  <!-- Background Forest Canopy & Hills -->
  <path d="M-20 180 Q 30 140, 80 160 T 180 150 Q 220 135, 260 170 L 260 240 L -20 240 Z" fill="#064e3b" opacity="0.6" />
  <path d="M-10 195 Q 60 165, 120 180 T 250 170 L 250 240 L -10 240 Z" fill="#022c22" opacity="0.8" />

  <!-- Distant Trees -->
  <circle cx="40" cy="150" r="30" fill="#065f46" opacity="0.5" />
  <circle cx="200" cy="140" r="35" fill="#065f46" opacity="0.4" />
  <circle cx="160" cy="155" r="25" fill="#047857" opacity="0.5" />

  <!-- ==================== FLYING BIRDS (飞禽) ==================== -->
  <!-- Bird 1 (Large foreground) -->
  <g transform="translate(65, 45) scale(0.8)">
    <path d="M 0 10 Q 15 -10, 30 5 Q 15 2, 0 10 Z" fill="#38bdf8" />
    <path d="M 0 10 Q -15 -10, -30 5 Q -15 2, 0 10 Z" fill="#0ea5e9" />
    <circle cx="0" cy="8" r="3" fill="#f8fafc" />
  </g>

  <!-- Bird 2 (Medium soaring) -->
  <g transform="translate(145, 30) scale(0.6) rotate(15)">
    <path d="M 0 10 Q 15 -10, 30 5 Q 15 2, 0 10 Z" fill="#7dd3fc" />
    <path d="M 0 10 Q -15 -10, -30 5 Q -15 2, 0 10 Z" fill="#38bdf8" />
  </g>

  <!-- Bird 3 (Small distant) -->
  <path d="M 105 20 Q 112 10, 120 18 Q 112 15, 105 20 Z" fill="#bae6fd" />
  <path d="M 105 20 Q 98 10, 90 18 Q 98 15, 105 20 Z" fill="#7dd3fc" />

  <!-- ==================== FOREGROUND JUNGLE ENVIRONMENT ==================== -->
  <!-- Giant Forest Trees framing the scene -->
  <!-- Left Tree Trunk -->
  <path d="M -10 240 L 0 110 L 25 100 L 35 240 Z" fill="url(#trunkGrad)" />
  <!-- Left Tree Canopy -->
  <ellipse cx="15" cy="80" rx="45" ry="35" fill="url(#canopyGrad1)" />
  <ellipse cx="-5" cy="95" rx="35" ry="30" fill="url(#canopyGrad2)" />

  <!-- Right Tree Trunk -->
  <path d="M 215 240 L 220 120 L 245 110 L 250 240 Z" fill="url(#trunkGrad)" />
  <!-- Right Tree Canopy -->
  <ellipse cx="225" cy="85" rx="40" ry="35" fill="url(#canopyGrad1)" />

  <!-- Central Hanging Vines & Leaves -->
  <path d="M 70 0 Q 75 40, 65 70" stroke="#047857" stroke-width="3" fill="none" />
  <path d="M 170 0 Q 165 50, 175 80" stroke="#065f46" stroke-width="4" fill="none" />
  <ellipse cx="65" cy="70" rx="6" ry="10" fill="#34d399" transform="rotate(25 65 70)" />
  <ellipse cx="175" cy="80" rx="8" ry="12" fill="#10b981" transform="rotate(-15 175 80)" />

  <!-- ==================== WALKING BEASTS (走兽) ==================== -->
  <!-- Deer (走兽 - Graceful Herbivore) -->
  <g transform="translate(135, 140)">
    <!-- Body -->
    <ellipse cx="25" cy="35" rx="18" ry="12" fill="#f97316" />
    <!-- Neck & Head -->
    <path d="M 35 30 L 45 12 L 40 8 L 32 25 Z" fill="#ea580c" />
    <circle cx="45" cy="9" r="6" fill="#f97316" />
    <!-- Antlers -->
    <path d="M 46 3 Q 52 -3, 56 -8 M 50 0 Q 56 2, 60 0" stroke="#fdba74" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <rect x="15" y="44" width="3" height="18" rx="1.5" fill="#c2410c" />
    <rect x="23" y="44" width="3" height="18" rx="1.5" fill="#c2410c" />
    <rect x="30" y="44" width="3" height="17" rx="1.5" fill="#c2410c" />
    <rect x="36" y="44" width="3" height="17" rx="1.5" fill="#c2410c" />
    <!-- Tail -->
    <path d="M 7 32 Q 3 28, 5 35 Z" fill="#ffedd5" />
    <!-- Eye & Details -->
    <circle cx="47" cy="8" r="1.5" fill="#0f172a" />
  </g>

  <!-- Cute Tiger / Wild Cat (走兽 - Striking Carnivore) -->
  <g transform="translate(55, 145)">
    <!-- Body -->
    <ellipse cx="30" cy="30" rx="22" ry="14" fill="#fbbf24" />
    <!-- Stripes -->
    <path d="M 20 18 L 22 26 M 28 17 L 30 27 M 36 19 L 38 27" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <!-- Head -->
    <circle cx="14" cy="24" r="12" fill="#fbbf24" />
    <!-- Ears -->
    <polygon points="5,15 10,22 3,22" fill="#d97706" />
    <polygon points="19,15 21,22 15,20" fill="#d97706" />
    <!-- Muzzle & Eyes -->
    <circle cx="11" cy="23" r="1.5" fill="#0f172a" />
    <circle cx="17" cy="23" r="1.5" fill="#0f172a" />
    <ellipse cx="14" cy="27" rx="3" ry="2" fill="#fef3c7" />
    <path d="M 14 26 L 14 28" stroke="#0f172a" stroke-width="1" />
    <!-- Legs -->
    <rect x="16" y="38" width="4" height="16" rx="2" fill="#d97706" />
    <rect x="22" y="38" width="4" height="16" rx="2" fill="#d97706" />
    <rect x="38" y="38" width="4" height="16" rx="2" fill="#d97706" />
    <rect x="44" y="38" width="4" height="16" rx="2" fill="#d97706" />
    <!-- Tail (Curved up) -->
    <path d="M 50 30 Q 62 25, 58 12" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 58 17 Q 61 14, 59 12" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- ==================== GROUND & FOLIAGE ==================== -->
  <!-- Forest Floor Ground Mound -->
  <path d="M-10 200 Q 60 185, 120 195 T 250 190 L 250 240 L -10 240 Z" fill="#064e3b" />
  <path d="M-10 210 Q 80 200, 150 210 T 250 205 L 250 240 L -10 240 Z" fill="#022c22" />

  <!-- Foreground Bushes & Flowers -->
  <circle cx="25" cy="210" r="18" fill="#10b981" />
  <circle cx="40" cy="215" r="22" fill="#059669" />
  <circle cx="15" cy="220" r="15" fill="#34d399" />

  <circle cx="210" cy="215" r="20" fill="#059669" />
  <circle cx="225" cy="210" r="16" fill="#10b981" />

  <!-- Colorful Wildflowers on Forest Floor -->
  <circle cx="75" cy="205" r="3" fill="#f43f5e" />
  <circle cx="77" cy="207" r="1" fill="#fbbf24" />

  <circle cx="110" cy="210" r="3.5" fill="#a855f7" />
  <circle cx="110" cy="210" r="1" fill="#fef08a" />

  <circle cx="175" cy="208" r="3" fill="#f43f5e" />
  <circle cx="195" cy="215" r="3" fill="#fb923c" />

  <!-- Glowing Fireflies / Magical Forest Dust -->
  <circle cx="95" cy="130" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="115" cy="115" r="2" fill="#fde047" opacity="0.9" />
  <circle cx="85" cy="100" r="1" fill="#fde047" opacity="0.7" />
  <circle cx="155" cy="120" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="130" cy="95" r="2" fill="#fde047" opacity="0.9" />
  <circle cx="45" cy="125" r="1.5" fill="#fde047" opacity="0.7" />

  <!-- Soft Vignette / Border frame overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.3" />
</svg>