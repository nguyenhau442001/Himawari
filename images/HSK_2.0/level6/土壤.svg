<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Main soil mound -->
  <!-- Base shape, slightly irregular, wider at bottom -->
  <path d="M 30 180 C 50 200, 190 200, 210 180 L 210 210 L 30 210 Z" fill="#5A3A2B"/>
  <!-- Top contour of the soil, more organic -->
  <path d="M 45 170 C 60 185, 180 185, 195 170 C 185 175, 160 178, 120 178 C 80 178, 55 175, 45 170 Z" fill="#7A5C4B"/>
  <!-- Smaller clumps/texture on top -->
  <path d="M 60 165 C 70 170, 100 170, 110 165 C 105 167, 80 167, 70 165 Z" fill="#9B7D6A"/>
  <path d="M 130 165 C 140 170, 170 170, 180 165 C 175 167, 145 167, 135 165 Z" fill="#9B7D6A"/>
  <!-- Central accent clump, where the sprout emerges -->
  <path d="M 100 155 C 110 160, 130 160, 140 155 C 135 157, 110 157, 100 155 Z" fill="#C29B75"/>

  <!-- Plant sprout - Larger and more prominent -->
  <!-- Stem -->
  <path d="M 120 150 L 118 110 C 117 90, 123 90, 122 110 L 120 150 Z" fill="#4A8F3A"/>
  <!-- Left Leaf -->
  <path d="M 118 110 C 100 100, 90 80, 100 70 C 110 60, 118 80, 118 100 Z" fill="#6BBF59"/>
  <!-- Right Leaf -->
  <path d="M 122 110 C 140 100, 150 80, 140 70 C 130 60, 122 80, 122 100 Z" fill="#6BBF59"/>
</svg>