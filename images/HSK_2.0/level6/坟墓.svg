<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#17233f" />
      <stop offset="100%" stop-color="#2a3b5c" />
    </linearGradient>

    <!-- Lantern Glow Gradient -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Vignette / Lighting -->
    <radialGradient id="groundGlow" cx="50%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#groundGlow)" />

  <!-- Background Environment: Soft distant hills and glowing moon -->
  <circle cx="185" cy="55" r="18" fill="#fef3c7" opacity="0.9" />
  <circle cx="185" cy="55" r="26" fill="#fef3c7" opacity="0.15" />

  <!-- Distant Hills -->
  <path d="M0 160 Q 60 135 120 155 T 240 145 L 240 240 L 0 240 Z" fill="#1b2a47" opacity="0.7" />
  <path d="M0 175 Q 90 150 170 170 T 240 165 L 240 240 L 0 240 Z" fill="#1e3254" />

  <!-- Cypress / Pine Trees in background -->
  <g fill="#16253d">
    <path d="M30 165 L20 120 L40 120 Z" />
    <path d="M30 130 L23 90 L37 90 Z" />
    <path d="M30 100 L26 70 L34 70 Z" />

    <path d="M210 170 L200 125 L220 125 Z" />
    <path d="M210 135 L203 95 L217 95 Z" />
  </g>

  <!-- Ground Plane -->
  <path d="M0 190 Q 120 170 240 190 L 240 240 L 0 240 Z" fill="#0f172a" />

  <!-- TOMBSTONE / FENMU (坟墓) -->
  <g id="tomb">
    <!-- Mound Base (土堆) -->
    <ellipse cx="140" cy="195" rx="55" ry="22" fill="#2d3748" />
    <ellipse cx="140" cy="192" rx="48" ry="17" fill="#334155" />

    <!-- Headstone (墓碑) -->
    <path d="M115 190 L115 130 C115 115 125 105 140 105 C155 105 165 115 165 130 L165 190 Z" fill="#475569" stroke="#64748b" stroke-width="1.5" />
    <!-- Inner Inscription Placeholder (Abstracted, no actual text) -->
    <line x1="140" y1="125" x2="140" y2="165" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="133" y1="135" x2="133" y2="155" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="147" y1="135" x2="147" y2="155" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- OFFERINGS / PROPS (Incense & Flowers) -->
  <g id="offerings">
    <!-- Incense Burner / Pot -->
    <rect x="132" y="185" width="16" height="12" rx="3" fill="#cbd5e1" />
    <ellipse cx="140" cy="185" rx="8" ry="3" fill="#e2e8f0" />
    <!-- Incense Smoke -->
    <path d="M138 182 Q 135 170 142 160 Q 148 150 140 140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <!-- Incense Glow Spark -->
    <circle cx="138" cy="181" r="1.5" fill="#fef08a" />

    <!-- Yellow/White Chrysanthemum Bouquet -->
    <path d="M100 195 L108 175 L112 195 Z" fill="#047857" />
    <circle cx="104" cy="173" r="5" fill="#fbbf24" />
    <circle cx="109" cy="170" r="4.5" fill="#fef08a" />
    <circle cx="100" cy="177" r="4.5" fill="#f59e0b" />
  </g>

  <!-- FOREGROUND CHARACTER: Grandson visiting the tomb -->
  <g id="character-standing">
    <!-- Shadow -->
    <ellipse cx="75" cy="210" rx="18" ry="6" fill="#020617" opacity="0.6" />

    <!-- Body / Jacket (Warm winter/spring coat, dark slate blue) -->
    <path d="M62 165 L88 165 L93 210 L57 210 Z" fill="#1e293b" />
    <!-- Jacket collar / lapels -->
    <path d="M70 165 L75 180 L80 165" fill="none" stroke="#334155" stroke-width="2" />

    <!-- Legs / Trousers -->
    <rect x="63" y="205" width="9" height="20" fill="#0f172a" />
    <rect x="78" y="205" width="9" height="20" fill="#0f172a" />
    <!-- Shoes -->
    <path d="M59 223 L67 223 C71 223 71 225 71 225 L59 225 Z" fill="#334155" />
    <path d="M74 223 L82 223 C86 223 86 225 86 225 L74 225 Z" fill="#334155" />

    <!-- Head & Face Profile / 3/4 view looking at tomb -->
    <circle cx="75" cy="143" r="13" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M62 143 C62 133 68 130 76 130 C86 130 89 137 89 146 L82 146 C82 139 78 136 74 136 C69 136 67 139 67 143 Z" fill="#0f172a" />

    <!-- Arm reaching forward respectfully -->
    <!-- Back arm -->
    <path d="M65 170 L55 185 L60 190" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front arm holding a lantern or holding hands respectfully -->
    <path d="M85 170 L98 178 L105 175" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="106" cy="174" r="3.5" fill="#fbcfe8" />

    <!-- Traditional Portable Lantern (Giving warm illumination to the scene) -->
    <g id="lantern">
      <circle cx="106" cy="174" r="18" fill="url(#lanternGlow)" />
      <!-- Lantern Body -->
      <path d="M101 170 L111 170 L113 186 L99 186 Z" fill="#ef4444" />
      <!-- Lantern Ribs -->
      <path d="M106 170 L106 186" stroke="#b91c1c" stroke-width="1" />
      <path d="M101 178 L111 178" stroke="#b91c1c" stroke-width="1" />
      <!-- Caps -->
      <rect x="103" y="167" width="6" height="3" rx="1" fill="#fbbf24" />
      <rect x="103" y="186" width="6" height="3" rx="1" fill="#fbbf24" />
      <!-- Handle -->
      <path d="M106 163 C103 163 103 167 106 167" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    </g>
  </g>

  <!-- Atmospheric Floating Fireflies / Light Motes -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="120" cy="140" r="1.5" />
    <circle cx="155" cy="130" r="2" />
    <circle cx="95" cy="115" r="1" />
    <circle cx="170" cy="150" r="1.5" />
    <circle cx="130" cy="110" r="2" />
  </g>
</svg>