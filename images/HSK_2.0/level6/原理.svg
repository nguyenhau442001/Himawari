<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid pattern for technical/mechanism theme -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="30" y1="0" x2="30" y2="240"/>
    <line x1="90" y1="0" x2="90" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="240"/>
    <line x1="0" y1="30" x2="240" y2="30"/>
    <line x1="0" y1="90" x2="240" y2="90"/>
    <line x1="0" y1="150" x2="240" y2="150"/>
    <line x1="0" y1="210" x2="240" y2="210"/>
  </g>

  <!-- Central Physical Object: Cutaway mechanical assembly revealing core principles/gears -->
  <g transform="translate(120, 115)">
    <!-- Outer casing / frame representing the machine -->
    <path d="M-65 -45 L-45 -65 L45 -65 L65 -45 L65 45 L45 65 L-45 65 L-65 45 Z" fill="#252A34" stroke="#3E4553" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#3E4553" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.6"/>

    <!-- Accent glow / focus element representing "core principle / inner workings" -->
    <circle cx="0" cy="0" r="38" fill="#1F242D"/>
    
    <!-- Secondary Gear (Top Left) -->
    <g transform="translate(-20, -22)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#525B6C" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1A1D24"/>
    </g>

    <!-- Secondary Gear (Bottom Right) -->
    <g transform="translate(22, 20)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#525B6C" stroke-width="6"/>
      <circle cx="0" cy="0" r="4" fill="#1A1D24"/>
    </g>

    <!-- Main Central Gear (Gold/Orange accent for focus/principle) -->
    <g transform="rotate(15)">
      <!-- Gear teeth representation -->
      <circle cx="0" cy="0" r="26" fill="none" stroke="#F5A623" stroke-width="10" stroke-dasharray="8 4"/>
      <!-- Gear body -->
      <circle cx="0" cy="0" r="22" fill="#252A34" stroke="#F5A623" stroke-width="2"/>
      <!-- Center hole -->
      <circle cx="0" cy="0" r="8" fill="#F5A623"/>
      <circle cx="0" cy="0" r="3" fill="#1A1D24"/>
    </g>

    <!-- Interlocking energy spark / core dot -->
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Supporting technical base / floor line -->
  <path d="M70 185 L170 185" stroke="#3E4553" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Diagnostic nodes / structural connection points -->
  <circle cx="120" cy="50" r="3" fill="#F5A623"/>
  <circle cx="65" cy="115" r="3" fill="#525B6C"/>
  <circle cx="175" cy="115" r="3" fill="#525B6C"/>
</svg>