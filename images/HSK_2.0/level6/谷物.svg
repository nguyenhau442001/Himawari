<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Warm ambient glow behind the scene -->
  <circle cx="120" cy="130" r="70" fill="url(#glowGrad)"/>

  <!-- Kitchen Counter -->
  <rect x="20" y="185" width="200" height="35" rx="6" fill="#334155"/>
  <rect x="20" y="185" width="200" height="6" fill="#475569"/>

  <!-- Background Kitchen Elements (Window & Plants) -->
  <rect x="70" y="45" width="100" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <!-- Window panes -->
  <line x1="120" y1="45" x2="120" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="87" x2="170" y2="87" stroke="#334155" stroke-width="2"/>
  <!-- Outside night stars/lights -->
  <circle cx="90" cy="65" r="1.5" fill="#38bdf8"/>
  <circle cx="150" cy="70" r="1.5" fill="#f43f5e"/>
  <circle cx="100" cy="110" r="1.5" fill="#10b981"/>

  <!-- Plant pot on counter background -->
  <path d="M 40 185 L 45 165 L 55 165 L 60 185 Z" fill="#64748b"/>
  <path d="M 42 165 Q 50 145 35 135 Q 50 155 58 165 Z" fill="#10b981"/>
  <path d="M 50 165 Q 65 145 60 130 Q 55 150 50 165 Z" fill="#34d399"/>

  <!-- Character (Smiling woman/person enjoying healthy breakfast) -->
  <!-- Head & Hair -->
  <circle cx="120" cy="85" r="22" fill="#fde047"/>
  <path d="M 98 85 C 98 65 142 65 142 85 C 142 95 135 105 135 105 L 105 105 C 105 105 98 95 98 85 Z" fill="#475569"/>
  <!-- Face features (happy expression) -->
  <circle cx="113" cy="83" r="2" fill="#1e293b"/>
  <circle cx="127" cy="83" r="2" fill="#1e293b"/>
  <path d="M 117 90 Q 120 94 123 90" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="109" cy="86" r="3" fill="#fda4af" opacity="0.6"/>
  <circle cx="131" cy="86" r="3" fill="#fda4af" opacity="0.6"/>

  <!-- Torso & Clothing (Cozy sweater) -->
  <path d="M 95 140 C 95 115 145 115 145 140 L 160 185 L 80 185 Z" fill="#ec4899"/>
  <!-- Collar -->
  <path d="M 105 118 C 120 125 135 118 135 118 C 135 125 105 125 105 118 Z" fill="#f43f5e"/>

  <!-- Hands holding the bowl -->
  <circle cx="95" cy="165" r="7" fill="#fde047"/>
  <circle cx="145" cy="165" r="7" fill="#fde047"/>

  <!-- Foreground: Large Cereal/Grain Bowl (谷物) -->
  <ellipse cx="120" cy="165" rx="35" ry="12" fill="#94a3b8"/>
  <path d="M 85 165 Q 85 190 120 190 Q 155 190 155 165 Z" fill="url(#bowlGrad)"/>
  
  <!-- Grains, Oats, Berries inside the bowl (Rich nutrition details) -->
  <ellipse cx="120" cy="166" rx="30" ry="9" fill="#78350f"/>
  <!-- Rolled oats & grains scatter -->
  <ellipse cx="110" cy="164" rx="5" ry="3" fill="#fef3c7" transform="rotate(-15 110 164)"/>
  <ellipse cx="125" cy="167" rx="6" ry="3" fill="#fde68a" transform="rotate(20 125 167)"/>
  <ellipse cx="135" cy="164" rx="5" ry="3" fill="#fef3c7" transform="rotate(-30 135 164)"/>
  <ellipse cx="105" cy="168" rx="4" ry="2" fill="#fbbf24" transform="rotate(45 105 168)"/>
  <!-- Berries / nuts (nutrition symbols) -->
  <circle cx="118" cy="163" r="3.5" fill="#f43f5e"/>
  <circle cx="130" cy="168" r="3" fill="#10b981"/>
  <circle cx="112" cy="168" r="3" fill="#a855f7"/>
  <circle cx="124" cy="162" r="2.5" fill="#f43f5e"/>

  <!-- Spoon with grain -->
  <path d="M 145 140 L 165 175" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="166" cy="177" rx="5" ry="3" fill="#cbd5e1" transform="rotate(45 166 177)"/>
  <ellipse cx="166" cy="177" rx="3" ry="1.5" fill="#fef3c7" transform="rotate(45 166 177)"/>

  <!-- Sparkles / Nutritional glow / Energy bursts -->
  <path d="M 80 140 L 83 145 L 88 148 L 83 151 L 80 156 L 77 151 L 72 148 L 77 145 Z" fill="#fbbf24"/>
  <path d="M 160 130 L 162 134 L 166 136 L 162 138 L 160 142 L 158 138 L 154 136 L 158 134 Z" fill="#38bdf8"/>
  <path d="M 120 120 L 122 124 L 126 126 L 122 128 L 120 132 L 118 128 L 114 126 L 118 124 Z" fill="#10b981"/>

  <!-- Floating steam/aroma lines indicating freshness and warmth -->
  <path d="M 110 150 Q 105 140 115 130 Q 125 120 120 110" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 130 152 Q 135 142 125 132 Q 115 122 122 112" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>