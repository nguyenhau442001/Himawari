<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Environment -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Danger/Warning Red Glow for Lungs/Smoke -->
    <radialGradient id="dangerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Lung Healthy/Warning Gradient -->
    <linearGradient id="lungGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Interior Background Elements (Window, Desk, Ambient Lighting) -->
  <g opacity="0.6">
    <!-- Window Frame in Background -->
    <rect x="156" y="28" width="56" height="76" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="184" y1="28" x2="184" y2="104" stroke="#334155" stroke-width="2"/>
    <line x1="156" y1="66" x2="212" y2="66" stroke="#334155" stroke-width="2"/>
    <!-- City Skyline through Window -->
    <path d="M164 104 L164 78 L170 78 L170 104 Z M176 104 L176 70 L182 70 L182 104 Z M192 104 L192 62 L202 62 L202 104 Z" fill="#334155"/>
  </g>

  <!-- LUNG ANATOMY GRAPHIC (The Central Metaphor / Context) -->
  <g transform="translate(120, 95)">
    <!-- Ambient danger glow behind lungs -->
    <circle cx="0" cy="0" r="48" fill="url(#dangerGlow)"/>

    <!-- Trachea (Windpipe) -->
    <path d="M-4 -36 L-4 -20 L4 -20 L4 -36 Z" fill="#94a3b8" rx="2"/>
    <path d="M-3 -32 L3 -32 M-3 -28 L3 -28 M-3 -24 L3 -24" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Lung -->
    <path d="M -6 -18 
             C -24 -18, -42 -2, -42, 22 
             C -42, 42, -26, 48, -12, 44 
             C -4, 42, -2, 26, -6, 10 Z" 
          fill="url(#lungGradient)" stroke="#fda4af" stroke-width="1.5"/>

    <!-- Right Lung -->
    <path d="M 6 -18 
             C 24 -18, 42 -2, 42, 22 
             C 42, 42, 26, 48, 12, 44 
             C 4, 42, 2, 26, 6, 10 Z" 
          fill="url(#lungGradient)" stroke="#fda4af" stroke-width="1.5"/>

    <!-- Crack / Damage Warning Markers on Lungs -->
    <path d="M-22 18 L-16 26 M-18 26 L-12 30" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 16 L22 24 M20 24 L26 28" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-16" cy="12" r="3" fill="#fef08a" opacity="0.8"/>
    <circle cx="20" cy="10" r="2.5" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- FOREGROUND CHARACTER & SMOKING SCENARIO -->
  <!-- Desk Surface -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="196" width="240" height="6" fill="#334155"/>

  <!-- Character (Smoker, seated, holding cigarette) -->
  <g transform="translate(65, 125)">
    <!-- Torso / Jacket -->
    <path d="M -30 75 L -35 110 L 35 110 L 30 75 Z" fill="#3b82f6"/>
    <path d="M -15 75 L 0 95 L 15 75 Z" fill="#1e293b"/> <!-- Shirt collar V -->

    <!-- Neck & Head -->
    <rect x="-8" y="46" width="16" height="32" rx="6" fill="#fbcfe8"/>
    <circle cx="0" cy="30" r="22" fill="#fbcfe8"/>

    <!-- Hair -->
    <path d="M -20 22 C -20 10, -10 8, 0 8 C 10 8, 20 10, 20 22 C 20 30, 16 32, 16 26 C 10 24, -10 24, -16 26 C -16 32, -20 30, -20 22 Z" fill="#334155"/>

    <!-- Facial Expression (Concentrated/Tired eyes) -->
    <line x1="-8" y1="28" x2="-2" y2="30" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="30" x2="8" y2="28" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyebrows (slanted slightly) -->
    <line x1="-9" y1="23" x2="-2" y2="25" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2" y1="25" x2="9" y2="23" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Closed / Puffed Mouth -->
    <circle cx="6" cy="40" r="3.5" fill="#475569"/>

    <!-- Arm holding cigarette near face -->
    <!-- Upper Arm -->
    <path d="M -25 80 C -35 60, -25 45, -10 40" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <!-- Forearm & Hand -->
    <path d="M -10 40 L 4 35" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="6" cy="34" r="5" fill="#fbcfe8"/>

    <!-- Cigarette and Amber Glow -->
    <line x1="6" y1="34" x2="26" y2="28" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="28" r="2.5" fill="#f97316"/>
    <circle cx="26" cy="28" r="4" fill="#fbbf24" opacity="0.6"/>
  </g>

  <!-- SMOKE PLUMES RISING AND CURLING -->
  <g opacity="0.75">
    <!-- Smoke from cigarette curling upwards toward the lungs -->
    <path d="M 91 149 
             C 95 135, 80 125, 90 110 
             C 100 95, 115 90, 110 75 
             C 105 60, 90 55, 95 40" 
          fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <path d="M 93 147 
             C 98 138, 86 128, 93 115 
             C 100 102, 112 96, 108 82 
             C 104 68, 93 62, 98 50" 
          fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Swirling smoke puffs near lungs -->
    <circle cx="100" cy="55" r="7" fill="#94a3b8" opacity="0.3"/>
    <circle cx="112" cy="40" r="10" fill="#cbd5e1" opacity="0.25"/>
    <circle cx="125" cy="30" r="13" fill="#e2e8f0" opacity="0.2"/>
  </g>

  <!-- FOREGROUND PROPS (Desk details like ashtray, coffee mug) -->
  <g transform="translate(0, 195)">
    <!-- Coffee Mug -->
    <rect x="155" y="-18" width="18" height="22" rx="3" fill="#38bdf8"/>
    <path d="M 173 -12 C 180 -12, 180 -4, 173 -4" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam from Mug -->
    <path d="M 160 -24 C 163 -28, 161 -32, 164 -36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Ashtray -->
    <ellipse cx="195" cy="-4" rx="16" ry="6" fill="#64748b"/>
    <ellipse cx="195" cy="-6" rx="13" ry="4" fill="#334155"/>
    <!-- Stubbed cigarette in ashtray -->
    <line x1="190" y1="-8" x2="198" y2="-4" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Subtle vignette/border ring for clean presentation -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>