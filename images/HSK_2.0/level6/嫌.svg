<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <circle cx="40" cy="20" r="15" fill="#FFC107"/>
    <path d="M25 50 Q40 40 55 50 L55 120 L25 120 Z" fill="#E0E0E0"/>
    <!-- Disdainful arm gesture -->
    <path d="M55 60 L90 50" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <path d="M90 50 L100 30" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <!-- Motion lines -->
    <path d="M105 25 L120 20 M110 35 L125 30" stroke="#FF9800" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Object being rejected (Shirt) -->
  <g transform="translate(140, 110)">
    <path d="M0 0 L40 0 L35 60 L5 60 Z" fill="#FF5722"/>
    <path d="M10 10 L30 10 M10 20 L30 20" stroke="#1A1D24" stroke-width="2"/>
    <!-- Price tag -->
    <rect x="35" y="-10" width="15" height="10" fill="#FFC107"/>
    <path d="M35 0 L42.5 5 L50 0" fill="#FFC107"/>
  </g>

  <!-- Disdainful facial expression detail -->
  <path d="M95 105 L105 115" stroke="#1A1D24" stroke-width="2"/>
  <path d="M105 105 L95 115" stroke="#1A1D24" stroke-width="2"/>
</svg>