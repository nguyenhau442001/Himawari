<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background & Context Props -->
  <!-- Wallpaper Pattern / Accent Wall -->
  <path d="M0 0 H240 V170 H0 Z" fill="#1e293b" />
  <path d="M0 165 H240 V240 H0 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="2" />

  <!-- Background Window showing night stars/moon -->
  <g transform="translate(160, 25)">
    <rect x="0" y="0" width="50" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <line x1="25" y1="0" x2="25" y2="70" stroke="#475569" stroke-width="1.5" />
    <line x1="0" y1="35" x2="50" y2="35" stroke="#475569" stroke-width="1.5" />
    <!-- Moon & Stars -->
    <circle cx="38" cy="18" r="6" fill="#fbbf24" />
    <circle cx="12" cy="22" r="1.5" fill="#f8fafc" opacity="0.8" />
    <circle cx="18" cy="52" r="1" fill="#f8fafc" opacity="0.6" />
    <!-- Curtains -->
    <path d="M-5 -2 C10 20 5 50 -5 72" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M55 -2 C40 20 45 50 55 72" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Bookshelf & Plant Context Props -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="40" height="120" fill="#0f172a" opacity="0.5" rx="4" />
    <!-- Books -->
    <rect x="6" y="20" width="10" height="25" fill="#ec4899" rx="1" />
    <rect x="18" y="15" width="8" height="30" fill="#38bdf8" rx="1" />
    <rect x="6" y="70" width="28" height="12" fill="#10b981" rx="1" />
    <!-- Plant pot on shelf -->
    <path d="M10 100 L15 115 H25 L30 100 Z" fill="#f97316" />
    <path d="M20 100 C10 90 5 80 15 70 C25 80 25 90 20 100 Z" fill="#10b981" />
  </g>

  <!-- Warm Floor Lamp -->
  <g transform="translate(210, 60)">
    <circle cx="-10" cy="50" r="45" fill="url(#lampGlow)" />
    <path d="M-10 140 V0" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M-25 15 C-25 0 5 0 5 15 Z" fill="#fbbf24" />
    <ellipse cx="-10" cy="140" rx="15" ry="4" fill="#475569" />
  </g>

  <!-- Main Scene Characters: Mother and Child ("在妈妈跟前") -->
  <!-- Context Area: Playmat / Rug on floor right in front of mother -->
  <ellipse cx="105" cy="195" rx="55" ry="18" fill="#334155" filter="url(#softShadow)" />
  <ellipse cx="105" cy="195" rx="50" ry="15" fill="#1e293b" />
  <!-- Colorful play blocks on the rug -->
  <rect x="75" y="190" width="12" height="12" fill="#ec4899" rx="2" transform="rotate(15 81 196)" />
  <rect x="125" y="192" width="14" height="10" fill="#38bdf8" rx="2" transform="rotate(-10 132 197)" />
  <circle cx="105" cy="200" r="6" fill="#fbbf24" />

  <!-- Mother Character (Seated comfortably on a cozy armchair/cushion) -->
  <g transform="translate(60, 105)" filter="url(#softShadow)">
    <!-- Armchair / Cushion base -->
    <path d="M -25 20 C -25 -10 10 -20 35 -10 C 55 0 65 30 65 65 H -35 C -35 40 -30 25 -25 20 Z" fill="#475569" />
    <path d="M -30 65 H 65 V 80 C 65 85 60 90 55 90 H -20 C -25 90 -30 85 -30 80 Z" fill="#334155" />

    <!-- Mother's Body & Legs -->
    <path d="M 5 35 L 35 55 L 50 65 H 20 L -5 50 Z" fill="#6366f1" /> <!-- Pants/Legs -->

    <!-- Mother's Torso -->
    <path d="M -15 10 C -20 -10 5 -15 15 -5 C 25 5 30 35 25 55 H -5 C -15 40 -15 20 -15 10 Z" fill="#a855f7" />

    <!-- Mother's Arms (gentle, relaxed gesture pointing towards her front/child) -->
    <path d="M 10 15 C 30 20 40 35 45 45" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round" />
    <circle cx="45" cy="46" r="5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Mother's Head & Hair -->
    <circle cx="5" cy="-12" r="14" fill="#fbcfe8" /> <!-- Face -->
    <!-- Hair -->
    <path d="M -8 -18 C -10 -30 20 -30 22 -15 C 25 -5 18 0 18 0 C 18 0 5 -5 -8 -18 Z" fill="#0f172a" />
    <circle cx="18" cy="-5" r="5" fill="#0f172a" /> <!-- Hair bun -->

    <!-- Mother's Facial Expression (Smiling warmly, looking down at child) -->
    <path d="M 8 -12 Q 11 -9 14 -12" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" /> <!-- Eye -->
    <path d="M 6 -6 Q 10 -2 14 -6" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" /> <!-- Smile -->
    <!-- Rosy cheek -->
    <circle cx="13" cy="-8" r="3" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- Child Character (Actively playing "跟前" - right in front of mother) -->
  <g transform="translate(115, 145)" filter="url(#softShadow)">
    <!-- Child Body / Sitting/Playing pose -->
    <path d="M -10 20 C -15 10 -5 0 10 5 C 25 10 35 25 30 35 C 25 45 5 45 -5 35 Z" fill="#10b981" /> <!-- Bright shirt -->

    <!-- Child's Arms reaching forward to toys -->
    <path d="M 15 12 C 25 15 35 25 42 20" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
    <circle cx="43" cy="18" r="4" fill="#fde68a" /> <!-- Hand -->

    <!-- Child's Head -->
    <circle cx="10" cy="-5" r="12" fill="#fde68a" /> <!-- Face -->
    <!-- Cute child hair style (spiky tuft) -->
    <path d="M -2 -15 C 5 -25 18 -18 15 -10 C 15 -10 5 -18 -2 -15 Z" fill="#78350f" />
    <circle cx="2" cy="-17" r="3" fill="#78350f" />

    <!-- Child's Expression (Joyful, excited play) -->
    <path d="M 12 -7 Q 15 -4 18 -7" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" /> <!-- Eye -->
    <path d="M 11 -2 Q 15 3 19 -1" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" /> <!-- Big open happy smile -->
    <!-- Rosy cheek -->
    <circle cx="17" cy="-4" r="2.5" fill="#f43f5e" opacity="0.5" />

    <!-- Toy stack near child -->
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="10" height="10" fill="#f43f5e" rx="2" />
      <rect x="2" y="-10" width="6" height="10" fill="#3b82f6" rx="1" />
      <circle cx="5" cy="-13" r="3" fill="#fbbf24" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Depth of field) -->
  <circle cx="25" cy="220" r="3" fill="#38bdf8" opacity="0.3" />
  <circle cx="215" cy="200" r="4" fill="#ec4899" opacity="0.3" />
  <circle cx="180" cy="225" r="2" fill="#fbbf24" opacity="0.4" />
</svg>