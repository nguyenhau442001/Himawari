<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#334155" />
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Steep Cliff Face Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Distant Mountains -->
  <polygon points="0,180 60,110 120,150 180,100 240,170 240,240 0,240" fill="#1e293b" opacity="0.5" />
  
  <!-- Massive Steep Mountain (这座山) -->
  <!-- Base mass -->
  <polygon points="30,240 80,70 110,240" fill="url(#mountainGrad)" />
  <!-- Extremely steep cliff face showing '陡峭' nature -->
  <polygon points="80,70 120,240 210,240 180,40" fill="url(#cliffGrad)" />

  <!-- Mountain Rock Textures & Crevices -->
  <path d="M 95,90 L 110,130 L 100,160 L 130,210" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 140,80 L 130,120 L 155,160 L 140,200" stroke="#0f172a" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round" />
  <path d="M 165,110 L 150,150 L 175,190" stroke="#0f172a" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 85,115 L 75,140" stroke="#0f172a" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round" />

  <!-- Cloud Layers -->
  <path d="M 10,60 Q 25,50 45,65 Q 65,55 80,65 L 80,75 L 10,75 Z" fill="#64748b" opacity="0.2" />
  <path d="M 150,130 Q 170,115 195,130 Q 220,120 235,135 L 235,145 L 150,145 Z" fill="#64748b" opacity="0.3" />

  <!-- Hiking Trail (Dotted/Winding up the steep cliff) -->
  <path d="M 120,230 Q 140,200 135,170 Q 130,140 150,110 Q 165,90 180,40" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.8" />

  <!-- Adventurous Hikers / Characters scaling the steep cliff -->
  <!-- Hiker 1 (Lower, pointing up in awe at the steepness) -->
  <g transform="translate(100, 180)">
    <!-- Body -->
    <path d="M 10,15 L 15,30 L 10,40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Backpack -->
    <rect x="3" y="18" width="8" height="12" rx="2" fill="#ec4899" />
    <!-- Head -->
    <circle cx="12" cy="8" r="4" fill="#fb923c" />
    <!-- Arm pointing up -->
    <path d="M 12,15 L 22,8" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
    <!-- Leg -->
    <path d="M 15,30 L 20,42" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Hiker 2 (Higher up on the sheer wall, gripping carefully) -->
  <g transform="translate(145, 115)">
    <!-- Body -->
    <path d="M 12,10 L 8,25 L 14,35" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Backpack -->
    <rect x="11" y="12" width="7" height="10" rx="2" fill="#f59e0b" />
    <!-- Head & Hat -->
    <circle cx="10" cy="4" r="3.5" fill="#fb923c" />
    <path d="M 7,2 L 13,2" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arms gripping rock -->
    <path d="M 10,12 L 4,15" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
    <!-- Legs braced -->
    <path d="M 8,25 L 2,30" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Foreground Pine Trees (Scale reference emphasizing height) -->
  <!-- Tiny trees on lower slopes -->
  <polygon points="65,225 70,210 75,225" fill="#042f2e" />
  <polygon points="73,230 77,215 81,230" fill="#065f46" />
  <!-- Tree near bottom left -->
  <path d="M 35,240 L 35,215" stroke="#78350f" stroke-width="3" />
  <polygon points="35,200 25,220 45,220" fill="#065f46" />
  <polygon points="35,210 28,228 42,228" fill="#042f2e" />

  <!-- Birds soaring to show immense vertical height -->
  <path d="M 50,40 Q 55,33 60,40 Q 65,33 70,40" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" />
  <path d="M 115,25 Q 118,20 122,25 Q 125,20 128,25" stroke="#cbd5e1" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Sun / Warm Glow Accent Top Right -->
  <circle cx="200" cy="45" r="16" fill="#f59e0b" opacity="0.9" />
  <circle cx="200" cy="45" r="24" fill="#fbbf24" opacity="0.3" />

  <!-- Frame Border / Vignette (Dark Mode Clean Polish) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>