<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 125)">
    <!-- Overflowing abundant basket/cornucopia concept representing mass production/harvest -->
    
    <!-- Glow effect for abundance -->
    <circle cx="0" cy="-10" r="70" fill="#FFB703" opacity="0.1" filter="blur(10px)"/>
    
    <!-- Burst rays of abundance -->
    <g opacity="0.25">
      <path d="M0,-20 L0,-90" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,-20 L-60,-70" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,-20 L60,-70" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,-20 L-80,-10" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,-20 L80,-10" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Base Basket / Container -->
    <path d="M-55,20 C-55,50 55,50 55,20 C60,5 -60,5 -55,20 Z" fill="#D4A373"/>
    <path d="M-50,20 C-50,55 50,55 50,20 L55,10 C55,10 0,25 -55,10 Z" fill="#CCD5AE"/>
    
    <!-- Basket Weave Pattern (Simplified) -->
    <path d="M-45,23 C-20,33 20,33 45,23" stroke="#B08968" stroke-width="3" fill="none"/>
    <path d="M-48,32 C-20,41 20,41 48,32" stroke="#B08968" stroke-width="3" fill="none"/>

    <!-- Abundant Fruits spilling out -->
    <!-- Watermelon slice -->
    <path d="M-35,-20 L-5, -35 L-20, -60 Z" fill="#E63946"/>
    <path d="M-37,-22 L-3, -37 L-21, -63 Z" fill="#F1FAEE" stroke="#E63946" stroke-width="2"/>
    <circle cx="-20" cy="-42" r="1.5" fill="#1D3557"/>
    <circle cx="-15" cy="-38" r="1.5" fill="#1D3557"/>

    <!-- Pineapple -->
    <g transform="translate(25, -40) rotate(15)">
      <ellipse cx="0" cy="10" rx="16" ry="22" fill="#FFB703"/>
      <path d="M-10,-5 L0,-22 L10,-5 Z" fill="#52B788"/>
      <path d="M-6,-12 L0,-28 L6,-12 Z" fill="#40916C"/>
      <!-- Diamond pattern -->
      <path d="M-12,5 L0,15 L12,5" stroke="#D4A373" stroke-width="1.5" fill="none"/>
      <path d="M-15,0 L0,10 L15,0" stroke="#D4A373" stroke-width="1.5" fill="none"/>
      <path d="M-10,10 L0,20 L10,10" stroke="#D4A373" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Apple -->
    <circle cx="-5" cy="-15" r="15" fill="#E07A5F"/>
    <path d="M-5,-30 Q-2,-37 3,-30" stroke="#81B29A" stroke-width="3" fill="none"/>
    <path d="M-5,-33 Q-10,-38 -15,-33" fill="#81B29A"/>

    <!-- Oranges / Citrus -->
    <circle cx="-35" cy="-5" r="14" fill="#F77F00"/>
    <circle cx="-35" cy="-5" r="12" fill="#FCBF49"/>
    <circle cx="35" cy="-2" r="13" fill="#F77F00"/>

    <!-- Grapes -->
    <g transform="translate(-5, -55)">
      <circle cx="0" cy="0" r="7" fill="#9B5DE5"/>
      <circle cx="-8" cy="7" r="7" fill="#9B5DE5"/>
      <circle cx="8" cy="7" r="7" fill="#9B5DE5"/>
      <circle cx="0" cy="14" r="7" fill="#9B5DE5"/>
      <circle cx="-12" cy="15" r="6" fill="#7209B7"/>
      <circle cx="12" cy="15" r="6" fill="#7209B7"/>
      <path d="M0,-7 Q3,-15 10,-18" stroke="#52B788" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Extra small floating fruits for rich abundance effect -->
    <circle cx="-48" cy="15" r="6" fill="#E63946"/>
    <circle cx="48" cy="12" r="7" fill="#F77F00"/>
    <circle cx="15" cy="-5" r="8" fill="#F4A261"/>
  </g>
</svg>