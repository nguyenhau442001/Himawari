<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Workshop Light Gradient -->
    <radialGradient id="lightGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Eco Material Green Accent -->
    <linearGradient id="ecoGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Natural Wood / Cork Material -->
    <linearGradient id="woodMat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Recycled Paper Roll Gradient -->
    <linearGradient id="paperRoll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Workshop Lighting -->
  <circle cx="120" cy="80" r="110" fill="url(#lightGlow)"/>

  <!-- Workshop Background Elements (Shelf with eco-supplies & plants) -->
  <g id="background-context" opacity="0.8">
    <!-- Back wall shelf -->
    <rect x="30" y="55" width="180" height="6" rx="3" fill="#334155" filter="url(#shadow)"/>
    
    <!-- Potted Plant on shelf (eco theme) -->
    <path d="M 45 55 L 50 38 L 66 38 L 71 55 Z" fill="#64748b"/>
    <ellipse cx="58" cy="38" rx="8" ry="3" fill="#475569"/>
    <!-- Leaves -->
    <path d="M 58 35 Q 50 20 42 28 Q 48 35 58 35 Z" fill="#10b981"/>
    <path d="M 58 35 Q 65 18 74 25 Q 68 35 58 35 Z" fill="#34d399"/>
    <path d="M 58 35 Q 58 15 58 25 Z" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

    <!-- Eco Material Samples on Shelf -->
    <rect x="85" y="42" width="12" height="13" rx="2" fill="url(#woodMat)"/>
    <rect x="101" y="39" width="10" height="16" rx="2" fill="#94a3b8"/>
    <!-- Glass jar with bamboo/sprout -->
    <rect x="170" y="36" width="16" height="19" rx="3" fill="#38bdf8" fill-opacity="0.3" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 178 55 L 178 38" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 178 44 Q 172 40 174 36" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 178 48 Q 184 44 182 40" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M 120 0 L 120 28" stroke="#475569" stroke-width="2"/>
  <path d="M 100 28 L 140 28 L 148 42 L 92 42 Z" fill="#334155"/>
  <path d="M 96 42 L 144 42" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- WORKBENCH SURFACE -->
  <path d="M 20 180 L 220 180 L 230 220 L 10 220 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M 20 180 L 220 180 L 220 185 L 20 185 Z" fill="#475569"/>

  <!-- PROPS ON DESK (The "Eco-Material" context) -->
  <!-- Roll of Eco Kraft Paper / Biodegradable Material -->
  <g transform="translate(35, 145)" filter="url(#shadow)">
    <ellipse cx="15" cy="10" rx="6" ry="12" fill="#d97706"/>
    <path d="M 15 -2 L 55 8 L 55 30 L 15 22 Z" fill="url(#paperRoll)"/>
    <ellipse cx="55" cy="19" rx="6" ry="11" fill="#cbd5e1"/>
    <!-- Inner roll hole -->
    <ellipse cx="15" cy="10" rx="2" ry="5" fill="#92400e"/>
  </g>

  <!-- MAIN CHARACTER: Designer / Artisan examining the eco-material -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Torso & Apron -->
    <!-- Slate Blue Shirt -->
    <path d="M 90 165 C 90 135 110 130 130 130 C 150 130 170 135 170 165 L 175 195 L 85 195 Z" fill="#38bdf8"/>
    <!-- Yellow-Brown Artisan Apron straps & body -->
    <path d="M 105 130 L 110 195 L 150 195 L 155 130 Z" fill="#d97706"/>
    <path d="M 105 130 L 120 155 L 135 130" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="140" x2="95" y2="155" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="140" x2="165" y2="155" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>

    <!-- Neck & Head -->
    <path d="M 120 125 L 120 135" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round"/>
    <!-- Head Circle -->
    <circle cx="120" cy="105" r="20" fill="#fecdd3"/>
    <!-- Friendly Face Features -->
    <!-- Hair -->
    <path d="M 100 102 C 100 85 140 85 140 102 C 140 102 142 95 135 90 C 125 82 110 84 105 92 C 101 96 100 102 100 102 Z" fill="#334155"/>
    <!-- Glasses (Smart/Designer look) -->
    <circle cx="113" cy="104" r="5" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="127" cy="104" r="5" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="118" y1="104" x2="122" y2="104" stroke="#334155" stroke-width="1.5"/>
    <!-- Smile -->
    <path d="M 116 115 Q 120 119 124 115" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Arms interacting with the sample -->
    <!-- Left Arm holding the board -->
    <path d="M 95 145 Q 85 160 100 175" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Right Arm pointing / presenting -->
    <path d="M 145 145 Q 165 155 155 170" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hands -->
    <circle cx="100" cy="177" r="4" fill="#fecdd3"/>
    <circle cx="155" cy="172" r="4" fill="#fecdd3"/>
  </g>

  <!-- THE FOCAL OBJECT: "环保材料" (Eco-friendly composite panel being presented) -->
  <g id="eco-material-board" transform="translate(95, 155)" filter="url(#shadow)">
    <!-- Board tilted in hands -->
    <polygon points="0,20 50,5 65,25 15,40" fill="url(#woodMat)" stroke="#b45309" stroke-width="1"/>
    <!-- Wood grain / recycled texture lines -->
    <path d="M 10 25 Q 30 18 45 23" stroke="#92400e" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 15 30 Q 35 23 50 28" stroke="#92400e" stroke-width="1.5" fill="none" opacity="0.6"/>
    
    <!-- Embedded Leaf Motif on the material proving it's eco-friendly -->
    <g transform="translate(28, 12) rotate(15)">
      <ellipse cx="6" cy="6" rx="6" ry="3" fill="url(#ecoGreen)"/>
      <path d="M 0 6 Q 6 2 12 6 Q 6 10 0 6 Z" fill="#10b981"/>
      <path d="M 2 6 L 10 6" stroke="#065f46" stroke-width="0.75" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Eco Badge / Floating Leaf Accents (Reinforcing 'Huánbǎo') -->
  <g id="floating-eco-accents">
    <!-- Glowing Green Leaf floating top right -->
    <g transform="translate(180, 75) rotate(-20)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="14" fill="#065f46" fill-opacity="0.4"/>
      <path d="M -7 3 C -7 -6 7 -6 7 3 C 7 10 -7 10 -7 3 Z" fill="url(#ecoGreen)"/>
      <path d="M -7 3 L 7 3" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
      <path d="M 0 3 L 0 8" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Small Sparkles / Quality Indicators near material -->
    <path d="M 85 145 L 87 150 L 92 152 L 87 154 L 85 159 L 83 154 L 78 152 L 83 150 Z" fill="#34d399" opacity="0.9"/>
    <path d="M 160 120 L 161 123 L 164 124 L 161 125 L 160 128 L 159 125 L 156 124 L 159 123 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Frame border subtly rounding out the design -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>