<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Park setting -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.2"/>
  <path d="M0 180 Q 60 150 120 180 T 240 180 V 240 H 0 Z" fill="#10b981" opacity="0.3"/>
  
  <!-- Character: The open/cheerful girl -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 C -20 60, 20 60, 20 20 L 15 -20 L -15 -20 Z" fill="#ec4899"/>
    <!-- Arms (Open gesture) -->
    <path d="M-15 -10 L -50 10 M 15 -10 L 50 10" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -45 C -30 -70, 30 -70, 25 -45 L 20 -30 L 0 -50 L -20 -30 Z" fill="#78350f"/>
    <!-- Face: Cheerful expression -->
    <circle cx="-8" cy="-45" r="3" fill="#1e293b"/>
    <circle cx="8" cy="-45" r="3" fill="#1e293b"/>
    <path d="M-10 -35 Q 0 -25 10 -35" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Context Props: Friends/Social vibe -->
  <g transform="translate(40, 150)">
    <circle cx="0" cy="0" r="15" fill="#38bdf8"/>
    <path d="M-5 -5 L 5 5 M -5 5 L 5 -5" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <g transform="translate(200, 160)">
    <circle cx="0" cy="0" r="15" fill="#fb923c"/>
    <path d="M-5 -2 Q 0 5 5 -2" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="4" fill="#f59e0b"/>
  <circle cx="210" cy="100" r="3" fill="#38bdf8"/>
  <circle cx="150" cy="40" r="5" fill="#ec4899"/>
</svg>