    <path d="M106 120 L115 129 L134 110" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Corner accent marks denoting origin/starting point -->
    <path d="M72 76 H80 M72 76 V84" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M168 76 H160 M168 76 V84" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
