<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration: Original/Initial Blueprint & Physical Artifact representing "原先" (the original/prior state) -->
  <g transform="translate(0, 0)">
    <!-- Background blueprint grid lines for "original plan" context -->
    <path d="M48 60 H192 M48 96 H192 M48 132 H192 M48 168 H192" stroke="#262C38" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M60 48 V192 M96 48 V192 M132 48 V192 M168 48 V192" stroke="#262C38" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Base document/blueprint representing the "initial/original" state -->
    <rect x="64" y="64" width="112" height="120" rx="6" fill="#222834" stroke="#3A4456" stroke-width="2"/>
    
    <!-- Blueprint header/fold -->
    <path d="M144 64 L176 96 V64 Z" fill="#2C3544"/>

    <!-- Original architectural/project drawing lines inside -->
    <path d="M84 104 L120 80 L156 104 V152 H84 Z" fill="none" stroke="#52607A" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Focal Point: Golden/Amber accent stamp/marker indicating "Original" -->
