<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing a grit/training workshop or forge room -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environment/Workshop Background Elements -->
  <!-- Window with glowing ambient light -->
  <path d="M160 30 L210 30 L210 110 L160 110 Z" fill="#334155" opacity="0.4"/>
  <path d="M165 35 L205 35 L205 105 L165 105 Z" fill="#0f172a"/>
  <!-- Window panes -->
  <line x1="185" y1="35" x2="185" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="165" y1="70" x2="205" y2="70" stroke="#334155" stroke-width="2"/>
  <path d="M170 40 L200 40 L200 65 L170 65 Z" fill="#38bdf8" opacity="0.15"/>

  <!-- Workshop shelves and tools in background -->
  <rect x="25" y="45" width="50" height="6" rx="3" fill="#334155"/>
  <circle cx="35" cy="40" r="5" fill="#64748b"/>
  <rect x="50" y="32" width="12" height="13" rx="2" fill="#64748b"/>
  
  <rect x="25" y="85" width="45" height="5" rx="2" fill="#334155"/>
  <path d="M35 70 L40 85 L30 85 Z" fill="#64748b"/>

  <!-- Heavy Workbench -->
  <rect x="20" y="160" width="200" height="12" fill="#334155"/>
  <rect x="35" y="172" width="16" height="48" fill="#1e293b"/>
  <rect x="189" y="172" width="16" height="48" fill="#1e293b"/>

  <!-- Anvil on Workbench -->
  <path d="M115 135 L145 135 L140 145 L138 160 L122 160 L120 145 Z" fill="url(#metalGrad)"/>
  <path d="M110 130 L150 130 L150 135 L110 135 Z" fill="#cbd5e1"/>

  <!-- Sparks / Intensity Effects (Representing "磨练" - arduous polishing/forging) -->
  <circle cx="130" cy="125" r="12" fill="url(#sparkGlow)"/>
  <circle cx="125" cy="120" r="3" fill="#fbbf24"/>
  <circle cx="142" cy="128" r="2" fill="#f97316"/>
  <circle cx="118" cy="132" r="2.5" fill="#fbbf24"/>
  <path d="M128 115 L132 108" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M138 118 L146 112" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M120 125 L110 122" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character: Determined artisan/person undergoing rigorous trial/work -->
  <!-- Body/Torso leaning forward -->
  <path d="M80 165 C75 145 85 125 105 120 L115 155 L90 170 Z" fill="#38bdf8"/>
  <!-- Head with focused expression -->
  <circle cx="75" cy="115" r="14" fill="#ffedd5"/>
  <!-- Hair -->
  <path d="M62 115 C62 102 75 100 85 108 C88 105 90 110 88 115 Z" fill="#334155"/>
  <!-- Sweat drop (hard work) -->
  <path d="M88 112 C88 112 92 117 92 120 C92 122 90 123 88 123 C86 123 84 122 84 120 C84 117 88 112 88 112 Z" fill="#38bdf8"/>

  <!-- Determined Eyes & Brow -->
  <line x1="77" y1="113" x2="83" y2="115" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Determined Mouth -->
  <path d="M78 123 L83 123" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms holding tool / working intently -->
  <path d="M85 125 L110 135 L125 128" fill="none" stroke="#ffedd5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands -->
  <circle cx="125" cy="128" r="4" fill="#ffedd5"/>

  <!-- Tool being used (Chisel / File / Metal piece) -->
  <path d="M115 130 L135 125" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M125 127 L130 125" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

  <!-- Front apron / protective gear -->
  <path d="M78 140 L98 145 L102 170 L78 170 Z" fill="#cbd5e1"/>
  <path d="M85 140 L85 130 L95 130 L95 140" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Additional ambient glow / depth shadows -->
  <rect x="0" y="225" width="240" height="15" fill="#0f172a" opacity="0.6"/>
</svg>