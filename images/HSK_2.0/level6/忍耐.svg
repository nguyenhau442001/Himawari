<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm desk lamp glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window night gradient -->
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Character clothing gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Paper scrap styling -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Window showing night/city lights -->
  <g transform="translate(145, 18)">
    <rect x="0" y="0" width="70" height="85" rx="4" fill="url(#night-sky)" stroke="#334155" stroke-width="2"/>
    <!-- Window pane grid -->
    <line x1="35" y1="0" x2="35" y2="85" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="42" x2="70" y2="42" stroke="#334155" stroke-width="2" />
    <!-- City silhouette in window -->
    <path d="M5 85 L5 65 L12 65 L12 85 L18 85 L18 55 L28 55 L28 85 L42 85 L42 50 L55 50 L55 85 L65 85 L65 60 L68 60 L68 85 Z" fill="#1e293b" opacity="0.8" />
    <!-- Tiny distant lights -->
    <circle cx="20" cy="70" r="1" fill="#fde047" />
    <circle cx="48" cy="62" r="1" fill="#fde047" />
    <circle cx="60" cy="75" r="1" fill="#fde047" />
  </g>

  <!-- Bookshelf / Wall Props -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="50" height="6" rx="2" fill="#475569" />
    <!-- Books -->
    <rect x="5" y="-18" width="8" height="18" rx="1" fill="#ec4899" />
    <rect x="14" y="-22" width="10" height="22" rx="1" fill="#8b5cf6" />
    <rect x="25" y="-15" width="7" height="15" rx="1" fill="#10b981" />
  </g>

  <!-- Hanging Plant -->
  <g transform="translate(95, 15)">
    <path d="M15 0 C15 15 5 15 5 25" fill="none" stroke="#64748b" stroke-width="2" />
    <circle cx="10" cy="25" r="8" fill="#334155" />
    <!-- Leaves drooping -->
    <path d="M6 28 C2 35 10 42 10 42 C10 42 18 35 14 28 Z" fill="#10b981" />
    <path d="M3 26 C-2 30 2 38 6 36 Z" fill="#059669" />
    <path d="M17 26 C22 30 18 38 14 36 Z" fill="#059669" />
  </g>

  <!-- DESK SURFACE -->
  <rect x="15" y="185" width="210" height="40" rx="4" fill="#334155" />
  <rect x="15" y="180" width="210" height="8" rx="2" fill="#475569" />

  <!-- DESK PROPS -->
  <!-- Desk Lamp -->
  <g transform="translate(190, 115)">
    <!-- Lamp base -->
    <ellipse cx="0" cy="65" rx="12" ry="4" fill="#64748b" />
    <!-- Lamp arm -->
    <path d="M0 65 L-15 30 L-25 15" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lamp head/shade -->
    <path d="M-35 5 L-15 5 L-5 20 L-45 20 Z" fill="#fbbf24" />
    <!-- Light beam overlay -->
    <polygon points="-25,20 -60,110 30,110" fill="url(#lamp-glow)" />
  </g>

  <!-- Laptop showing "Error / Failure" (crumpled paper & frustration context) -->
  <g transform="translate(130, 140)">
    <!-- Laptop base -->
    <polygon points="-20,40 30,40 40,48 -30,48" fill="#64748b" />
    <!-- Laptop screen -->
    <rect x="-22" y="2" width="50" height="38" rx="2" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Screen content: Abstract chart going down (failure/setback) -->
    <polyline points="-12,30 -2,22 8,26 18,12" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="18" cy="12" r="2.5" fill="#ef4444" />
  </g>

  <!-- Crumpled paper balls (representing setbacks/frustration) -->
  <g filter="url(#drop-shadow)">
    <circle cx="110" cy="170" r="7" fill="#f8fafc" />
    <path d="M106 167 Q110 165 114 168 T112 174" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    
    <circle cx="175" cy="175" r="6" fill="#f1f5f9" />
    <path d="M172 173 Q176 171 178 176" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Coffee mug -->
  <g transform="translate(45, 155)" filter="url(#drop-shadow)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M16 10 C21 10 21 20 16 20" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Steam swirls (patience/deep breath) -->
    <path d="M5 0 C7 -3 3 -6 5 -9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M11 2 C13 -1 9 -4 11 -7" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- MAIN CHARACTER: Struggling with setbacks, practicing patience (忍耐) -->
  <g transform="translate(70, 75)">
    <!-- Body & Torso (leaning slightly forward, deep concentration) -->
    <path d="M35 60 C35 50 45 40 60 40 C75 40 85 50 85 60 L90 105 L30 105 Z" fill="url(#shirt-grad)" />

    <!-- Shoulders / Arms resting on desk, hands clenched in patience -->
    <!-- Left Arm -->
    <path d="M38 55 L20 75 L30 85 L45 70" fill="#0284c7" />
    <!-- Left Hand (clenched fist showing restraint/perseverance) -->
    <circle cx="28" cy="88" r="7" fill="#fcd34d" />
    <circle cx="26" cy="86" r="5" fill="#fbbf24" />

    <!-- Right Arm -->
    <path d="M82 55 L95 75 L85 85 L70 70" fill="#0284c7" />
    <!-- Right Hand (clenched fist) -->
    <circle cx="92" cy="88" r="7" fill="#fcd34d" />

    <!-- Neck -->
    <path d="M53 35 L67 35 L67 45 L53 45 Z" fill="#fcd34d" />

    <!-- Head (Eyes closed deeply, taking a deep breath to endure the setback) -->
    <g transform="translate(60, 22)">
      <!-- Hair -->
      <path d="M-16 8 C-16 -8 0 -16 16 -16 C32 -16 48 -8 48 8 C48 16 40 18 36 12 C32 6 24 10 16 6 C8 10 0 6 -4 12 C-8 18 -16 16 -16 8 Z" fill="#334155" />

      <!-- Face Base -->
      <ellipse cx="16" cy="12" rx="15" ry="17" fill="#fcd34d" />

      <!-- Ears -->
      <circle cx="0" cy="12" r="3" fill="#f59e0b" />
      <circle cx="32" cy="12" r="3" fill="#f59e0b" />

      <!-- Facial Expression of "忍耐" (Patience / Endurance): Calm, eyes closed peacefully in deep concentration, slight firm mouth line -->
      <!-- Closed Eyes (arc lines pointing down/up calmly) -->
      <path d="M6 10 C8 12 11 12 13 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M19 10 C21 12 24 12 26 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Eyebrows (focused, determined downward angle) -->
      <path d="M5 6 L13 8" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
      <path d="M27 6 L19 8" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

      <!-- Nose -->
      <path d="M16 14 L15 17 L17 17" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Mouth (Firm, resilient line) -->
      <path d="M12 21 C15 22 17 22 20 21" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

      <!-- Subtle determination blush/sweat drop representing challenge -->
      <path d="M31 16 C34 16 35 19 33 21 C31 23 29 20 31 16 Z" fill="#38bdf8" opacity="0.6" />
    </g>
  </g>

  <!-- FOREGROUND / ATMOSPHERE PARTICLES (Calm focus / breathing dust motes) -->
  <circle cx="50" cy="110" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="115" cy="95" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="180" cy="95" r="1" fill="#fbbf24" opacity="0.7" />
  <circle cx="35" cy="140" r="1.5" fill="#fbbf24" opacity="0.5" />

</svg>