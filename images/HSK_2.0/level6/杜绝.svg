<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glowStop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office / Workspace Environment -->
  <!-- Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#090d16"/>
  
  <!-- Back Wall Windows & Architecture -->
  <rect x="30" y="30" width="80" height="110" rx="6" fill="#162032" stroke="#334155" stroke-width="2"/>
  <rect x="130" y="30" width="80" height="110" rx="6" fill="#162032" stroke="#334155" stroke-width="2"/>
  <!-- Window Glass Grids -->
  <line x1="70" y1="30" x2="70" y2="140" stroke="#334155" stroke-width="1.5"/>
  <line x1="30" y1="85" x2="110" y2="85" stroke="#334155" stroke-width="1.5"/>
  <line x1="170" y1="30" x2="170" y2="140" stroke="#334155" stroke-width="1.5"/>
  <line x1="130" y1="85" x2="210" y2="85" stroke="#334155" stroke-width="1.5"/>

  <!-- Office Desk -->
  <rect x="15" y="165" width="210" height="25" rx="4" fill="#334155"/>
  <rect x="25" y="155" width="190" height="12" rx="2" fill="#475569"/>
  <!-- Desk Legs -->
  <rect x="35" y="190" width="10" height="35" fill="#1e293b"/>
  <rect x="195" y="190" width="10" height="35" fill="#1e293b"/>

  <!-- Desk Props: Laptop & Papers -->
  <path d="M 155 145 L 195 145 L 205 155 L 145 155 Z" fill="#94a3b8"/>
  <rect x="150" y="125" width="50" height="22" rx="2" fill="#cbd5e1"/>
  <!-- Messy Papers / "Phenomenon" to be stopped -->
  <rect x="130" y="148" width="22" height="12" rx="1" transform="rotate(-15 130 148)" fill="#f1f5f9"/>
  <rect x="115" y="150" width="20" height="14" rx="1" transform="rotate(10 115 150)" fill="#e2e8f0"/>

  <!-- The "Stop/Halt" Action Context (Red Tag / Hazard representation replaced with concrete barrier/stop action) -->
  <!-- Warning light fixture on wall -->
  <circle cx="120" cy="20" r="10" fill="#334155"/>
  <circle cx="120" cy="20" r="6" fill="#ef4444"/>
  <path d="M 100 20 L 140 20 L 160 190 L 80 190 Z" fill="url(#beamGrad)" opacity="0.6"/>

  <!-- Character: Manager / Professional firmly halting the issue -->
  <!-- Body/Torso -->
  <path d="M 60 140 C 60 110 90 110 90 140 L 95 190 L 55 190 Z" fill="#0284c7"/>
  <!-- Collar & Shirt -->
  <polygon points="70,115 75,130 80,115" fill="#f8fafc"/>
  <rect x="73" y="115" width="4" height="25" fill="#cbd5e1"/>

  <!-- Head & Face -->
  <circle cx="75" cy="85" r="18" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 58 85 C 58 70 92 70 92 85 C 90 78 60 78 58 85 Z" fill="#1e293b"/>
  <!-- Determined Eyebrows & Eyes -->
  <line x1="66" y1="80" x2="73" y2="83" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="77" y1="83" x2="84" y2="80" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="69" cy="87" r="2" fill="#1e293b"/>
  <circle cx="81" cy="87" r="2" fill="#1e293b"/>
  <!-- Firm Mouth -->
  <path d="M 71 96 Q 75 93 79 96" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Left Arm & Hand (Reaching out authoritatively to STOP) -->
  <path d="M 60 120 L 40 135 L 50 145 L 70 135 Z" fill="#0284c7"/>
  <!-- Palm facing forward (Stop gesture) -->
  <circle cx="35" cy="138" r="9" fill="#fcd34d"/>
  <path d="M 31 133 L 31 143 M 35 131 L 35 143 M 39 133 L 39 143" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Arm (Bent at waist) -->
  <path d="M 90 125 L 105 145 L 95 155 L 85 135 Z" fill="#0369a1"/>

  <!-- Barrier Graphic Element (The decisive cutoff / eradication vector) -->
  <!-- Glowing green shield/barrier effect cleanly cutting off the mess -->
  <circle cx="125" cy="150" r="24" fill="url(#glowStop)"/>
  <!-- Bold Clean Stop Symbol (Hand/Barrier overlay reinforcing '杜绝') -->
  <rect x="116" y="138" width="18" height="24" rx="4" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <!-- Horizontal block line -->
  <rect x="112" y="146" width="26" height="6" rx="2" fill="#ffffff"/>

  <!-- Dynamic accent particles representing complete elimination/stopping -->
  <circle cx="150" cy="115" r="4" fill="#38bdf8"/>
  <circle cx="165" cy="100" r="3" fill="#10b981"/>
  <circle cx="135" cy="105" r="2" fill="#fbbf24"/>
  <path d="M 155 125 L 163 117" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 130 115 L 136 109" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

</svg>