<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Document (Bộ hồ sơ) -->
    <g transform="translate(32, 20)">
      <!-- Document background -->
      <rect x="0" y="0" width="116" height="150" rx="6" fill="#252A34" stroke="#3F4654" stroke-width="2"/>
      
      <!-- Document folded corner -->
      <path d="M 86 0 L 116 30 L 116 0 Z" fill="#3F4654"/>
      
      <!-- Placeholder text lines -->
      <rect x="18" y="24" width="50" height="8" rx="4" fill="#3F4654"/>
      <rect x="18" y="48" width="80" height="6" rx="3" fill="#343B48"/>
      <rect x="18" y="64" width="70" height="6" rx="3" fill="#343B48"/>
      <rect x="18" y="80" width="80" height="6" rx="3" fill="#343B48"/>
      <rect x="18" y="96" width="50" height="6" rx="3" fill="#343B48"/>
      
      <!-- Official stamp / approval area -->
      <circle cx="76" cy="122" r="16" fill="none" stroke="#FFA726" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
    </g>

    <!-- Magnifying Glass (Thẩm tra / Kiểm tra) -->
    <g transform="translate(70, 70)">
      <!-- Glass shadow/glow effect -->
      <circle cx="50" cy="50" r="38" fill="#1A1D24" opacity="0.6"/>
      
      <!-- Handle -->
      <path d="M 22 78 L -4 104 C -8 108 -8 114 -4 118 C 0 122 6 122 10 118 L 36 92 Z" fill="#FFA726"/>
      
      <!-- Handle metallic highlight -->
      <path d="M 17 83 L -1 101 C -3 103 -3 107 -1 109 C 1 111 5 111 7 109 L 25 91 Z" fill="#FFB74D" opacity="0.4"/>

      <!-- Rim Outer -->
      <circle cx="50" cy="50" r="36" fill="#252A34" stroke="#FFA726" stroke-width="6"/>
      
      <!-- Lens Glass -->
      <circle cx="50" cy="50" r="30" fill="#38BDF8" fill-opacity="0.15"/>
      
      <!-- Lens reflection / shine -->
      <path d="M 28 35 C 34 27 44 25 52 27" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      
      <!-- Checkmark symbol inside lens (Verification/Review complete concept) -->
      <path d="M 38 52 L 46 60 L 64 40" fill="none" stroke="#FFA726" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>