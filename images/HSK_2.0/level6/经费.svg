<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <defs>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lab Environment Background -->
  <rect x="20" y="40" width="60" height="80" rx="4" fill="#1e293b" opacity="0.5"/>
  <rect x="25" y="50" width="10" height="20" rx="2" fill="#334155"/>
  <rect x="40" y="45" width="8" height="25" rx="2" fill="#475569"/>
  <rect x="55" y="55" width="12" height="15" rx="2" fill="#334155"/>

  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="url(#tableGrad)"/>
  <rect x="0" y="180" width="240" height="2" fill="#334155"/>

  <!-- Researcher Character -->
  <g transform="translate(30, 85)">
    <!-- Body/Lab Coat -->
    <path d="M20 95 Q40 45 60 95 L65 115 L15 115 Z" fill="#f8fafc"/>
    <path d="M35 55 L45 55 L48 95 L12 95 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="40" cy="35" r="15" fill="#ffdbac"/>
    <path d="M25 30 Q25 15 40 15 Q55 15 55 30" fill="#475569"/> <!-- Hair -->
    <!-- Arm/Hand on Chin -->
    <path d="M55 75 Q65 75 60 55 Q58 45 45 45" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M45 45 Q42 45 42 40" fill="none" stroke="#ffdbac" stroke-width="6" stroke-linecap="round"/>
    <!-- Other Arm -->
    <path d="M25 75 Q10 85 15 110" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- High-Tech Research Subject (Hologram) -->
  <g transform="translate(130, 60)" filter="url(#glow)">
    <!-- Glowing Molecule/Structure -->
    <circle cx="40" cy="40" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <circle cx="40" cy="40" r="4" fill="#38bdf8"/>
    <line x1="40" y1="20" x2="40" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="20" y1="40" x2="60" y2="40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="25" cy="25" r="3" fill="#10b981"/>
    <circle cx="55" cy="55" r="3" fill="#10b981"/>
    <circle cx="55" cy="25" r="3" fill="#fbbf24"/>
    <circle cx="25" cy="55" r="3" fill="#fbbf24"/>
    <!-- Connecting lines -->
    <path d="M25 25 L40 40 L55 55 M55 25 L40 40 L25 55" stroke="#38bdf8" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Lab Equipment -->
  <g transform="translate(170, 135)">
    <!-- Microscope -->
    <path d="M10 45 L40 45 L35 40 L15 40 Z" fill="#475569"/>
    <path d="M30 40 L30 15 Q30 5 20 5 L15 5" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="12" y="10" width="6" height="15" transform="rotate(-20)" fill="#94a3b8"/>
    <rect x="18" y="30" width="10" height="4" fill="#334155"/>
  </g>

  <!-- The "Funding Needed" Visual (Tablet on desk) -->
  <g transform="translate(85, 185)">
    <rect width="50" height="35" rx="3" fill="#334155" transform="skewX(-10)"/>
    <rect x="4" y="4" width="42" height="27" rx="1" fill="#1e293b" transform="skewX(-10)"/>
    
    <!-- Bar Chart showing budget gap -->
    <rect x="10" y="10" width="6" height="15" fill="#10b981" opacity="0.5" transform="skewX(-10)"/> <!-- Past fund -->
    <rect x="20" y="15" width="6" height="10" fill="#10b981" opacity="0.5" transform="skewX(-10)"/> <!-- Past fund -->
    
    <!-- The "Current/Needed" Gap -->
    <rect x="30" y="22" width="6" height="3" fill="#ef4444" transform="skewX(-10)">
       <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="8" width="6" height="14" fill="#ef4444" opacity="0.1" transform="skewX(-10)"/> <!-- Target ghost bar -->
    
    <!-- Warning Icon (Small triangle) -->
    <path d="M40 25 L44 25 L42 21 Z" fill="#f59e0b" transform="skewX(-10)"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="1" fill="#38bdf8" opacity="0.4"/>
  <circle cx="210" cy="80" r="1.5" fill="#38bdf8" opacity="0.2"/>
  <circle cx="190" cy="110" r="1" fill="#38bdf8" opacity="0.3"/>
</svg>