<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character representing the person causing trouble -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 80 L-30 40 Q-30 20 -10 20 L10 20 Q30 20 30 40 L30 80 Z" fill="#4A5568"/>
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="35" fill="#E2E8F0"/>
    
    <!-- Face: Expressing irrationality/tantrum -->
    <path d="M-15 -15 L-5 -5 M-5 -15 L-15 -5" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 -15 L5 -5 M5 -15 L15 -5" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 15 Q0 25 15 15" stroke="#1A1D24" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Arms in a flailing, disruptive gesture -->
    <path d="M-30 30 L-60 10" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 30 L60 50" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Visual representation of "irrational noise/disruption" (abstracted as jagged shapes) -->
    <path d="M70 -20 L90 -40 L80 -10 L110 -10 L90 10 L100 30 L70 20" fill="#F6AD55"/>
    <path d="M-70 -30 L-90 -50 L-80 -20 L-110 -20 L-90 0 L-100 20 L-70 10" fill="#F6AD55"/>
  </g>
</svg>