    <!-- Hair -->
    <path d="M35 100c0-20 15-30 25-30s25 10 25 30v10H35z" fill="#475569"/>
    <!-- Eyes (closed/focused) -->
    <path d="M48 95h8m16 0h8" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Action: Preparing food/folding laundry -->
  <rect x="130" y="140" width="60" height="40" rx="4" fill="#f8fafc"/>
  <path d="M135 145h50v5h-50zM135 155h50v5h-50z" fill="#cbd5e1"/>
  
  <!-- Environment details -->
  <circle cx="200" cy="60" r="30" fill="#fbbf24" opacity="0.2"/>
  <path d="M180 100l20-20M190 110l20-20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Warm glow effect -->
  <ellipse cx="100" cy="140" rx="80" ry="40" fill="#fb923c" opacity="0.05"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="4" fill="#38bdf8"/>
  <circle cx="210" cy="30" r="3" fill="#10b981"/>
  <circle cx="20" cy="200" r="5" fill="#ec4899"/>
</svg>