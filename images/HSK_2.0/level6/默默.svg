<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Kitchen Counter -->
  <path d="M0 160h240v80H0z" fill="#334155"/>
  <rect x="20" y="170" width="200" height="10" rx="2" fill="#475569"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 160c0-20 10-30 20-30s20 10 20 30v40H40z" fill="#64748b"/>
    <!-- Apron -->
    <path d="M45 135h30v50H45z" fill="#fb923c"/>
    <!-- Head -->
