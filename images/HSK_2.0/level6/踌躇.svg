<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%\" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window City Glow -->
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Character Skin Shadow Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lamp Glow -->
  <circle cx="150" cy="110" r="90" fill="url(#lamp-glow)" />

  <!-- BACKGROUND ARCHITECTURE & PROPS -->
  <!-- Window framing night city -->
  <path d="M 28 35 L 75 35 L 75 140 L 28 140 Z" fill="url(#window-grad)" />
  <!-- Window grid lines -->
  <line x1="75" y1="35" x2="75" y2="140" stroke="#0f172a" stroke-width="2.5" />
  <line x1="28" y1="87" x2="75" y2="87" stroke="#0f172a" stroke-width="2" />
  <line x1="28" y1="35" x2="75" y2="35" stroke="#312e81" stroke-width="3" />
  <!-- Distant City Lights through Window -->
  <rect x="35" y="50" width="6" height="12" rx="1" fill="#fbbf24" opacity="0.6" />
  <rect x="45" y="70" width="8" height="15" rx="1" fill="#38bdf8" opacity="0.5" />
  <rect x="58" y="45" width="5" height="20" rx="1" fill="#f43f5e" opacity="0.4" />
  <rect x="38" y="100" width="7" height="25" rx="1" fill="#34d399" opacity="0.5" />
  <rect x="52" y="95" width="10" height="30" rx="1" fill="#fbbf24" opacity="0.4" />
  <!-- Window Sill -->
  <rect x="24" y="137" width="55" height="5" rx="1.5" fill="#475569" />

  <!-- Bookshelf in background -->
  <rect x="180" y="55" width="36" height="120" fill="#0f172a" opacity="0.7" />
  <line x1="180" y1="95" x2="216" y2="95" stroke="#334155" stroke-width="2" />
  <line x1="180" y1="135" x2="216" y2="135" stroke="#334155" stroke-width="2" />
  <!-- Books -->
  <rect x="185" y="75" width="6" height="20" rx="1" fill="#38bdf8" />
  <rect x="193" y="72" width="8" height="23" rx="1" fill="#f43f5e" />
  <rect x="203" y="78" width="5" height="17" rx="1" fill="#fbbf24" />
  <rect x="186" y="112" width="7" height="23" rx="1" fill="#10b981" />
  <rect x="195" y="115" width="12" height="20" rx="1" fill="#8b5cf6" />

  <!-- Wall Clock showing late hours -->
  <circle cx="150" cy="50" r="15" fill="#334155" />
  <circle cx="150" cy="50" r="13" fill="#1e293b" />
  <line x1="150" y1="50" x2="150" y2="42" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="150" y1="50" x2="158" y2="53" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="150" cy="50" r="1.5" stroke="#f43f5e" fill="#f43f5e" />

  <!-- Office Desk -->
  <rect x="80" y="165" width="130" height="10" rx="3" fill="#334155" />
  <rect x="95" y="175" width="12" height="50" rx="2" fill="#1e293b" />
  <rect x="180" y="175" width="12" height="50" rx="2" fill="#1e293b" />

  <!-- Desk Lamp -->
  <path d="M 175 165 L 170 120 L 160 115" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 150 110 L 168 112 L 162 125 L 148 123 Z" fill="#fbbf24" />
  <ellipse cx="155" cy="124" rx="8" ry="3" fill="#fef08a" />

  <!-- Critical Props: Important Contract / Decision Documents & Pen -->
  <g transform="rotate(-5 125 165)">
    <!-- Paper base -->
    <rect x="110" y="145" width="36" height="25" rx="1" fill="#f8fafc" />
    <!-- Text lines on document -->
    <line x1="115" y1="151" x2="135" y2="151" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="115" y1="156" x2="140" y2="156" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="115" y1="161" x2="128" y2="161" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <!-- Red official stamp / seal (Decision context) -->
    <circle cx="135" cy="163" r="4" fill="none" stroke="#ef4444" stroke-width="1" />
  </g>

  <!-- Modern Fountain Pen resting beside paper -->
  <path d="M 148 162 L 168 152" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 148 162 L 146 163" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

  <!-- Coffee Mug with steam -->
  <rect x="88" y="148" width="14" height="17" rx="3" fill="#38bdf8" />
  <path d="M 102 153 C 106 153 106 161 102 161" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <!-- Steam wisps -->
  <path d="M 92 143 C 94 140 91 137 93 134" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />
  <path d="M 97 145 C 99 142 96 139 98 136" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />

  <!-- MAIN CHARACTER: DEPICITNG 踌躇 (HESITATION / DUNDING / UNCERTAINTY) -->
  <g id="character-hesitation">
    <!-- Body / Torso (Leaning forward, tense posture) -->
    <path d="M 95 210 C 92 185 105 165 125 165 C 145 165 155 185 155 210 Z" fill="#334155" />
    <!-- Shirt Collar / Tie -->
    <polygon points="120,165 130,165 125,178" fill="#f8fafc" />
    <polygon points="123,170 127,170 126,188 124,188" fill="#f43f5e" />

    <!-- Left Arm & Hand (Supporting chin in a deep thinking, hesitant gesture) -->
    <!-- Upper arm -->
    <path d="M 105 180 L 95 145" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Forearm reaching up -->
    <path d="M 95 145 L 115 130" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
    <!-- Hand touching chin / mouth hesitatingly -->
    <circle cx="118" cy="126" r="7" fill="url(#skin-grad)" />
    <!-- Fingers curled against cheek -->
    <path d="M 113 131 C 117 133 121 131 123 127" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" />

    <!-- Right Arm (Resting hesitantly near the document/pen) -->
    <path d="M 145 180 C 145 160 140 155 135 152" fill="none" stroke="#334155" stroke-width="13" stroke-linecap="round" />
    <circle cx="133" cy="150" r="6" fill="url(#skin-grad)" />

    <!-- Neck -->
    <rect x="117" y="152" width="16" height="18" rx="5" fill="url(#skin-grad)" />

    <!-- Head (Tilted slightly downward & sideways in contemplation) -->
    <g transform="rotate(-6 125 115)">
      <!-- Ears -->
      <circle cx="106" cy="116" r="4" fill="url(#skin-grad)" />

      <!-- Face Base -->
      <ellipse cx="123" cy="115" rx="16" ry="19" fill="url(#skin-grad)" />

      <!-- Hair (Clean, modern professional cut, dark slate) -->
      <path d="M 107 115 C 107 98 115 95 126 95 C 139 95 141 102 141 114 C 141 114 139 104 127 103 C 114 102 109 108 107 115 Z" fill="#0f172a" />
      <path d="M 108 113 C 110 102 118 97 127 97 C 136 97 139 103 140 110 C 135 102 120 101 112 110 Z" fill="#1e293b" />

      <!-- Eyebrows (Slightly furrowed, showing indecision and mental weight) -->
      <path d="M 113 109 C 116 107 121 108 124 110" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <path d="M 128 110 C 131 108 135 107 138 109" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

      <!-- Eyes (Thoughtful, looking intently downward at the contract/decision) -->
      <circle cx="118" cy="114" r="2" fill="#0f172a" />
      <circle cx="132" cy="114" r="2" fill="#0f172a" />
      <!-- Subtle lower eyelid tension -->
      <path d="M 116 117 C 118 118 120 118 121 117" fill="none" stroke="#cbd5e1" stroke-width="1" />
      <path d="M 130 117 C 132 118 134 118 135 117" fill="none" stroke="#cbd5e1" stroke-width="1" />

      <!-- Nose -->
      <path d="M 127 115 L 125 122 L 128 123" fill="none" stroke="#d4b499" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Mouth (Pensed, closed, showing hesitation before making the choice) -->
      <path d="M 121 129 C 124 131 128 131 130 129" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Visual Metaphor for "Hesitation/Thinking" (Subtle floating question/thought cues, non-textual) -->
  <g opacity="0.6">
    <path d="M 155 90 C 158 85 164 85 167 90 C 170 95 163 100 163 105" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="163" cy="112" r="1.5" fill="#fbbf24" />

    <path d="M 172 75 C 174 72 178 72 180 75 C 182 78 178 81 178 84" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="178" cy="89" r="1.2" fill="#38bdf8" />
  </g>

  <!-- Foreground ambient lighting gradients / vignette -->
  <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="90%" stop-color="#0f172a" stop-opacity="0" />
    <stop offset="100%" stop-color="#090d16" stop-opacity="0.8" />
  </linearGradient>
  <rect width="240" height="240" fill="url(#vignette)" pointer-events="none" />
</svg>