<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Fire (Target of the action) -->
  <g transform="translate(160, 130)">
    <path d="M10 60 Q30 0 50 60 T70 60 L70 80 L10 80 Z" fill="#EF4444" opacity="0.8"/>
    <path d="M20 65 Q35 20 50 65 T65 65 L65 80 L20 80 Z" fill="#F97316"/>
    <path d="M30 70 Q40 40 50 70 T60 70 L60 80 L30 80 Z" fill="#FBBF24"/>
  </g>

  <!-- Steam/Smoke effect where water hits fire -->
  <circle cx="175" cy="185" r="8" fill="#94A3B8" opacity="0.4"/>
  <circle cx="190" cy="175" r="12" fill="#94A3B8" opacity="0.3"/>
  <circle cx="205" cy="190" r="10" fill="#94A3B8" opacity="0.4"/>

  <!-- Firefighter Character -->
  <g>
    <!-- Legs in dynamic stance -->
    <path d="M75 210 L90 175 L105 175 L115 210" stroke="#334155" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M75 210 L90 175 L105 175 L115 210" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
    
    <!-- Torso leaning forward -->
    <path d="M95 175 L115 125 L140 135 L125 180 Z" fill="#334155"/>
    <path d="M105 145 L130 155" stroke="#FBBF24" stroke-width="3" fill="none"/>
    
    <!-- Arms holding the nozzle -->
    <path d="M115 135 L145 145" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M110 145 L140 155" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Helmet -->
    <path d="M105 125 Q105 105 125 105 Q145 105 145 125 L100 125 Z" fill="#FBBF24"/>
    <rect x="100" y="122" width="50" height="4" rx="2" fill="#F59E0B"/>
    <path d="M120 105 L120 95 L130 95 L130 105" fill="#FBBF24"/>
    
    <!-- Face/Mask area -->
    <path d="M125 112 L140 112 L140 122 L125 122 Z" fill="#1E293B"/>
  </g>

  <!-- Fire Hose -->
  <path d="M0 220 Q40 220 60 200 Q80 180 110 150" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>

  <!-- Water Stream (The Action) -->
  <g>
    <!-- Main stream -->
    <path d="M145 148 Q170 155 200 185" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" from="0, 50" to="50, 0" dur="1s" repeatCount="indefinite" />
    </path>
    <path d="M145 148 Q175 145 210 175" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Splashes/Droplets -->
    <circle cx="180" cy="160" r="2" fill="#BAE6FD"/>
    <circle cx="195" cy="155" r="1.5" fill="#BAE6FD"/>
    <circle cx="210" cy="170" r="2.5" fill="#BAE6FD"/>
    <circle cx="165" cy="145" r="1" fill="#BAE6FD"/>
  </g>

  <!-- Motion Lines for the Firefighter -->
  <line x1="60" y1="140" x2="80" y2="140" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="55" y1="160" x2="75" y2="160" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>