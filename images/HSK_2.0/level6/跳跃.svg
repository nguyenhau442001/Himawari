<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/motion arcs -->
  <path d="M 60 170 Q 120 130 180 170" fill="none" stroke="#2A303C" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M 80 185 Q 120 155 160 185" fill="none" stroke="#2A303C" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic swoosh indicating upward leap -->
  <path d="M 50 180 C 70 180, 90 130, 110 90 C 125 60, 145 40, 180 35" fill="none" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 70 190 C 90 190, 110 145, 125 105 C 138 75, 155 55, 195 50" fill="none" stroke="#FF9F43" stroke-width="6" stroke-linecap="round"/>

  <!-- Athlete / Human Figure in mid-air leap (Noun: con người) -->
  <g transform="translate(10, -5)">
    <!-- Head -->
    <circle cx="115" cy="65" r="12" fill="#FF9F43"/>
    
    <!-- Torso (leaning forward dynamically) -->
    <path d="M 110 77 L 100 115 L 125 110 Z" fill="#4B7BEC"/>
    
    <!-- Back Arm (reaching back) -->
    <path d="M 105 82 L 85 95 L 75 90" fill="none" stroke="#4B7BEC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Arm (reaching forward/up) -->
    <path d="M 118 80 L 138 65 L 148 55" fill="none" stroke="#4B7BEC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Leg (bent up high / tucking) -->
    <path d="M 115 112 L 130 135 L 115 155" fill="none" stroke="#FF9F43" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Back Leg (extended backward) -->
    <path d="M 108 115 L 90 145 L 70 150" fill="none" stroke="#FF9F43" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Speed / Motion lines -->
  <line x1="160" y1="75" x2="185" y2="70" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="150" y1="95" x2="175" y2="90" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="165" y1="115" x2="190" y2="110" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Ground shadow reference -->
  <ellipse cx="120" cy="195" rx="35" ry="6" fill="#111318"/>
</svg>