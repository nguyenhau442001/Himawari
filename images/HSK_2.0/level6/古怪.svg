<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric background room details -->
  <!-- Floor -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <!-- Wall Shadow/Gradient -->
  <rect x="0" y="0" width="240" height="180" fill="#0f172a"/>
  
  <!-- Window showing night/odd weather to enhance mood -->
  <rect x="25" y="35" width="60" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <line x1="55" y1="35" x2="55" y2="120" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="77" x2="85" y2="77" stroke="#334155" stroke-width="2"/>
  <!-- Outside view: quirky slanted moon/stars -->
  <circle cx="45" cy="55" r="8" fill="#fbbf24" opacity="0.8"/>
  <path d="M 70 50 L 73 57 L 80 58 L 75 63 L 77 70 L 70 66 L 63 70 L 65 63 L 60 58 L 67 57 Z" fill="#38bdf8" opacity="0.6" transform="scale(0.5) translate(60, 30)"/>

  <!-- Bookshelf in background with weird tilted books -->
  <rect x="155" y="45" width="60" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="155" y1="75" x2="215" y2="75" stroke="#334155" stroke-width="2"/>
  <line x1="155" y1="105" x2="215" y2="105" stroke="#334155" stroke-width="2"/>
  <!-- Tilted Books -->
  <rect x="165" y="55" width="8" height="20" rx="1" fill="#ec4899" transform="rotate(15 165 55)"/>
  <rect x="176" y="53" width="7" height="22" rx="1" fill="#38bdf8"/>
  <rect x="187" y="56" width="9" height="19" rx="1" fill="#10b981" transform="rotate(-10 187 56)"/>
  <rect x="163" y="85" width="8" height="20" rx="1" fill="#fb923c"/>
  <rect x="173" y="82" width="10" height="23" rx="1" fill="#f59e0b" transform="rotate(25 173 82)"/>

  <!-- Floor Lamp casting warm glow -->
  <line x1="210" y1="180" x2="210" y2="90" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200 90 L 220 90 L 225 105 L 195 105 Z" fill="#fbbf24"/>
  <!-- Lamp light cone -->
  <path d="M 195 105 L 140 180 L 240 180 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- Quirky Character (The "Guiguai" Subject) -->
  <!-- Character Shadow -->
  <ellipse cx="110" cy="185" rx="35" ry="8" fill="#020617"/>

  <!-- Character Body / Pose: Standing on one leg, balancing upside down teapot on head, wearing mismatched clothes -->
  <!-- Legs -->
  <!-- Standing Leg -->
  <path d="M 100 135 L 95 180" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <!-- Raised Leg (doing yoga/odd pose) -->
  <path d="M 120 135 L 140 115 L 155 125" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Shoes (mismatched colors) -->
  <ellipse cx="93" cy="182" rx="7" ry="4" fill="#ec4899"/>
  <ellipse cx="157" cy="125" rx="7" ry="4" fill="#10b981"/>

  <!-- Torso (Wearing a striped sweater with mismatched sleeves) -->
  <path d="M 90 100 L 130 100 L 125 145 L 95 145 Z" fill="#f1f5f9"/>
  <!-- Stripes on Torso -->
  <line x1="93" y1="112" x2="128" y2="112" stroke="#ec4899" stroke-width="4"/>
  <line x1="94" y1="124" x2="127" y2="124" stroke="#38bdf8" stroke-width="4"/>
  <line x1="95" y1="136" x2="126" y2="136" stroke="#10b981" stroke-width="4"/>

  <!-- Arms in eccentric pose (one up, one waving sideways) -->
  <path d="M 90 105 L 65 90" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round"/>
  <path d="M 130 105 L 155 140" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="62" cy="88" r="4" fill="#fde68a"/>
  <circle cx="157" cy="143" r="4" fill="#fde68a"/>

  <!-- Head with comical expression -->
  <circle cx="110" cy="75" r="22" fill="#fde68a"/>
  
  <!-- Hair: Messy/Wild -->
  <path d="M 88 72 C 85 55, 100 50, 110 52 C 120 50, 135 55, 132 72 C 138 65, 130 85, 128 80" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Face: Wide quirky eyes, glasses on sideways, goofy smile -->
  <!-- Glasses frame (tilted oddly) -->
  <rect x="97" y="66" width="12" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 103 71)"/>
  <rect x="111" y="70" width="12" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(25 117 75)"/>
  <line x1="108" y1="69" x2="113" y2="72" stroke="#0f172a" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="103" cy="71" r="2" fill="#0f172a"/>
  <circle cx="117" cy="75" r="3" fill="#0f172a"/>

  <!-- Mouth: playful grin -->
  <path d="M 104 84 Q 110 90 116 83" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="97" cy="80" r="3" fill="#ec4899" opacity="0.5"/>
  <circle cx="122" cy="83" r="3" fill="#ec4899" opacity="0.5"/>

  <!-- The Odd Prop on Head: Upside-down Teapot balancing precariously -->
  <g transform="translate(110, 48) rotate(-10)">
    <!-- Teapot Body -->
    <path d="M -10 -5 C -12 -15, 12 -15, 10 -5 C 15 2, -15 2, -10 -5 Z" fill="#fb923c"/>
    <!-- Teapot Lid (pointing down onto head) -->
    <ellipse cx="0" cy="-6" rx="8" ry="2" fill="#ea580c"/>
    <!-- Teapot Spout -->
    <path d="M 10 -8 L 18 -12 L 17 -7 Z" fill="#fb923c"/>
    <!-- Teapot Handle -->
    <path d="M -10 -8 C -18 -8, -18 0, -10 0" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <!-- Little droplet falling upward/sideways for absurdity -->
    <circle cx="22" cy="-14" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Observing friend/onlooker in background showing bewilderment ("Behavior is very strange") -->
  <!-- Onlooker head & shoulders -->
  <g transform="translate(185, 140)">
    <!-- Body -->
    <path d="M -15 40 L 35 40 L 25 15 C 20 5, -5 5, -10 15 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="8" cy="-5" r="16" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M -6 -15 C 2 -22, 18 -15, 22 -5 C 15 -10, 0 -10, -6 -15 Z" fill="#1e293b"/>
    <!-- Expression: Surprised/Confused eyes & raised eyebrow -->
    <circle cx="4" cy="-7" r="2" fill="#0f172a"/>
    <circle cx="14" cy="-7" r="2.5" fill="#0f172a"/>
    <!-- Raised eyebrow -->
    <path d="M 11 -13 Q 14 -16 17 -12" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- O-shaped confused mouth -->
    <ellipse cx="10" cy="2" rx="2" ry="3" fill="#0f172a"/>
    
    <!-- Sweat drop of confusion -->
    <path d="M 22 -8 C 22 -8, 26 -2, 26 1 C 26 3, 24 4, 22 4 C 20 4, 18 3, 18 1 C 18 -2, 22 -8, 22 -8 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground decorative elements for depth -->
  <!-- Small quirky rug on floor -->
  <ellipse cx="110" cy="190" rx="55" ry="15" fill="#334155" opacity="0.6"/>
  <ellipse cx="110" cy="190" rx="45" ry="11" fill="#1e293b"/>
  <!-- Zigzag pattern on rug -->
  <path d="M 70 190 Q 80 185, 90 190 T 110 190 T 130 190 T 150 190" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>

</svg>