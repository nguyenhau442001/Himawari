<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & BACKGROUND -->
  <!-- Back Wall & Floor Line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" opacity="0.6"/>

  <!-- Window with City Silhouette -->
  <g opacity="0.4">
    <rect x="156" y="30" width="56" height="85" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="184" y1="30" x2="184" y2="115" stroke="#475569" stroke-width="2"/>
    <line x1="156" y1="72" x2="212" y2="72" stroke="#475569" stroke-width="2"/>
    <!-- City outside -->
    <polygon points="160,115 160,95 168,90 172,115" fill="#64748b"/>
    <polygon points="175,115 175,82 188,78 192,115" fill="#64748b"/>
    <polygon points="195,115 195,88 208,85 208,115" fill="#64748b"/>
  </g>

  <!-- Light Beam from Window -->
  <polygon points="156,30 212,30 240,170 120,170" fill="url(#lightBeam)"/>

  <!-- Bookshelf Background Prop -->
  <g fill="#334155" opacity="0.7">
    <rect x="18" y="40" width="40" height="6" rx="2"/>
    <rect x="24" y="26" width="30" height="14" rx="2"/>
    <rect x="22" y="55" width="34" height="6" rx="2"/>
    <rect x="28" y="65" width="22" height="5" rx="1" fill="#475569"/>
    <rect x="32" y="72" width="16" height="5" rx="1" fill="#64748b"/>
  </g>

  <!-- Desk & Office Props -->
  <!-- Desk Surface -->
  <path d="M 20 170 L 220 170 L 210 195 L 30 195 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="25" y="165" width="190" height="7" rx="2" fill="#475569"/>

  <!-- Desk Lamp -->
  <circle cx="190" cy="130" r="40" fill="url(#lampGlow)"/>
  <path d="M 180 165 L 190 165 L 195 135 L 185 135 Z" fill="#64748b"/>
  <path d="M 175 125 C 175 115, 195 115, 195 125 Z" fill="#fbbf24"/>
  <line x1="190" y1="165" x2="190" y2="195" stroke="#1e293b" stroke-width="4"/>

  <!-- Laptop & Secret Folder (The Betrayal Context) -->
  <!-- Open Laptop -->
  <path d="M 120 170 L 160 170 L 155 150 L 125 150 Z" fill="#64748b"/>
  <path d="M 115 172 L 165 172 L 170 177 L 110 177 Z" fill="#94a3b8"/>
  <rect x="128" y="153" width="24" height="14" rx="1" fill="#38bdf8" opacity="0.8"/>

  <!-- Red Confidential Folder being handed over/hidden -->
  <g transform="translate(85, 150) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="35" height="26" rx="2" fill="#ef4444"/>
    <rect x="3" y="4" width="20" height="3" rx="1" fill="#f87171"/>
    <rect x="3" y="10" width="14" height="3" rx="1" fill="#f87171"/>
    <!-- Secret stamp -->
    <circle cx="27" cy="18" r="5" fill="#b91c1c"/>
  </g>

  <!-- CHARACTERS -->

  <!-- CHARACTER 1: The Betrayer (Foreground, Shifty, Smiling/Guilty, Handing over info) -->
  <g id="betrayer" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 90 195 C 90 165, 120 165, 120 195 Z" fill="#0284c7"/>
    <!-- Arm reaching out -->
    <path d="M 105 170 Q 115 160, 125 165" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand holding folder -->
    <circle cx="125" cy="165" r="4" fill="#fbcfe8"/>

    <!-- Neck & Head -->
    <rect x="100" y="145" width="12" height="15" fill="#fbcfe8"/>
    <!-- Head Base -->
    <circle cx="106" cy="132" r="18" fill="#fbcfe8"/>

    <!-- Hair (Sleek dark hair) -->
    <path d="M 88 130 C 88 115, 120 115, 124 132 C 124 132, 122 120, 106 118 C 90 118, 88 130, 88 130 Z" fill="#0f172a"/>

    <!-- Facial Expression (Nervous, scheming smile, looking sideways) -->
    <!-- Eyes (Glancing sideways) -->
    <circle cx="102" cy="130" r="2" fill="#0f172a"/>
    <circle cx="112" cy="130" r="2" fill="#0f172a"/>
    <!-- Eyebrows (Suspicious angle) -->
    <line x1="99" y1="125" x2="105" y2="127" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="109" y1="127" x2="115" y2="125" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smirk / Sly Smile -->
    <path d="M 104 139 Q 108 143, 113 138" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Blush of guilt / sweat drop -->
    <path d="M 118 127 Q 120 131, 117 135" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2: The Betrayed Friend (In background, looking shocked/betrayed from doorway or behind) -->
  <g id="betrayed-friend" filter="url(#shadow)" opacity="0.9">
    <!-- Body silhouette peeking from left -->
    <path d="M 0 210 L 0 140 C 20 140, 40 150, 45 210 Z" fill="#475569"/>
    
    <!-- Head -->
    <circle cx="30" cy="120" r="16" fill="#fbcfe8"/>
    
    <!-- Messy / Shocked Hair -->
    <path d="M 14 116 C 14 100, 46 100, 46 116 C 46 116, 40 106, 30 106 C 20 106, 14 116, 14 116 Z" fill="#334155"/>

    <!-- Shocked Facial Expression -->
    <!-- Wide Eyes -->
    <circle cx="26" cy="118" r="3.5" fill="#ffffff"/>
    <circle cx="26" cy="118" r="1.5" fill="#0f172a"/>
    <circle cx="36" cy="118" r="3.5" fill="#ffffff"/>
    <circle cx="36" cy="118" r="1.5" fill="#0f172a"/>
    
    <!-- Surprised O-Mouth -->
    <ellipse cx="31" cy="127" rx="2.5" ry="4" fill="#0f172a"/>

    <!-- Hand raised in disbelief near mouth -->
    <path d="M 38 135 Q 45 130, 42 145" fill="none" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Dramatic Lighting / Atmosphere Overlay -->
  <!-- Subtle vignette / mood shadows -->
  <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z" fill="none" stroke="#0f172a" stroke-width="16"/>
</svg>