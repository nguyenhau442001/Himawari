<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm pub/cafe lighting gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass/Bubble Gradient -->
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT & PROPS (Cozy cafe/pub setting) -->
  <!-- Ambient light pool -->
  <circle cx="120" cy="110" r="90" fill="url(#lamp-glow)" />

  <!-- Wooden Table Surface -->
  <path d="M 30,170 L 210,170 L 220,210 L 20,210 Z" fill="#334155" />
  <path d="M 30,170 L 210,170 L 210,175 L 30,175 Z" fill="#475569" />
  <!-- Table props: mugs and plates -->
  <ellipse cx="60" cy="175" rx="12" ry="5" fill="#64748b" />
  <path d="M 50,165 C 50,160 70,160 70,165 L 68,175 C 68,175 52,175 50,175 Z" fill="#94a3b8" />
  
  <ellipse cx="180" cy="178" rx="15" ry="6" fill="#64748b" />
  <path d="M 168,166 C 168,160 192,160 192,166 L 190,178 C 190,178 170,178 168,178 Z" fill="#cbd5e1" />
  <path d="M 192,168 C 198,168 198,174 192,176" stroke="#cbd5e1" stroke-width="2" fill="none" />

  <!-- Background wall details: window / shelves -->
  <rect x="150" y="50" width="50" height="70" rx="4" fill="#1e293b" opacity="0.6" />
  <line x1="175" y1="50" x2="175" y2="120" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="85" x2="200" y2="85" stroke="#334155" stroke-width="2" />

  <!-- CHARACTER 2: LISTENER / SKEPTIC (Right) -->
  <g id="listener-character">
    <!-- Body / Torso -->
    <path d="M 160,210 C 160,185 180,175 195,175 C 210,175 220,190 220,210 Z" fill="#0284c7" />
    <!-- Head -->
    <circle cx="185" cy="135" r="18" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 168,135 C 168,120 185,115 200,125 C 198,135 195,135 195,135 Z" fill="#334155" />
    <!-- Arm leaning on table -->
    <path d="M 175,160 L 195,175 L 180,185 Z" fill="#0284c7" />
    <!-- Hand on chin (skeptical pose) -->
    <circle cx="178" cy="162" r="5" fill="#fed7aa" />
    <!-- Facial expression: Skeptical / Doubting -->
    <path d="M 177,130 L 184,132" stroke="#475569" stroke-width="2" stroke-linecap="round" /> <!-- Raised eyebrow -->
    <circle cx="189" cy="134" r="1.5" fill="#1e293b" />
    <path d="M 183,144 C 185,142 188,142 190,144" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round" /> <!-- Smirk -->
  </g>

  <!-- CHARACTER 1: THE BOASTER / STORYTELLER (Left) -->
  <g id="boaster-character">
    <!-- Torso -->
    <path d="M 80,210 C 80,180 60,170 45,170 C 30,170 20,190 20,210 Z" fill="#f43f5e" />
    <!-- Dynamic gesture arm (pointing high / exaggerating) -->
    <path d="M 65,170 L 95,120 L 105,130 L 75,180 Z" fill="#f43f5e" />
    <!-- Hand -->
    <circle cx="98" cy="116" r="6" fill="#fed7aa" />
    
    <!-- Head (tilted back proudly) -->
    <circle cx="65" cy="125" r="20" fill="#fed7aa" />
    <!-- Hair (stylish, confident) -->
    <path d="M 48,120 C 50,105 70,105 82,115 C 80,125 75,125 75,125 Z" fill="#1e293b" />
    
    <!-- Facial expression: Confident, grinning, eyes closed in laughter/pride -->
    <path d="M 58,122 C 60,120 64,120 66,122" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 70,122 C 72,120 76,120 78,122" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Big confident grin -->
    <path d="M 60,132 C 63,138 71,138 74,132 Z" fill="#1e293b" />
    <!-- Rosy cheek -->
    <circle cx="75" cy="130" r="4" fill="#fb7185" opacity="0.6" />
    
    <!-- Other arm resting -->
    <path d="M 40,175 L 55,190 L 45,200 Z" fill="#e11d48" />
  </g>

  <!-- THE VISUAL METAPHOR: EXAGGERATED BUBBLES / BOASTING NARRATIVE -->
  <!-- Floating magical/exaggerated elements representing "blowing/boasting" (吹牛) -->
  <!-- Golden sparkling trail coming from mouth -->
  <path d="M 80,120 Q 110,90 135,100 T 160,80" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,6" fill="none" stroke-linecap="round" />

  <!-- Large comic/vector talk bubble containing the absurd exaggeration icons -->
  <g transform="translate(100, 35)">
    <!-- Main Cloud/Bubble Shape -->
    <path d="M 15,25 C 10,10 30,5 45,12 C 55,2 75,5 82,20 C 95,22 100,40 90,55 C 98,70 85,85 70,80 C 60,90 40,85 32,75 C 15,80 5,65 12,50 C 2,38 8,25 15,25 Z" fill="url(#bubble-grad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.3))" />
    
    <!-- Little tail pointing to the boaster -->
    <path d="M 15,65 L 0,85 L 25,70 Z" fill="#cbd5e1" />

    <!-- Inside the bubble: Humorous surreal icons representing the "tall tales" (e.g., catching a huge fish, flying rocket, crown) -->
    <!-- Crown icon (Showing he claims to be a king/expert) -->
    <path d="M 38,38 L 43,26 L 49,35 L 55,26 L 60,38 Z" fill="#f59e0b" />
    <rect x="37" y="39" width="24" height="4" rx="2" fill="#d97706" />

    <!-- Rocket / Star icon (Showing exaggerated achievements) -->
    <path d="M 72,42 L 78,30 L 84,42 Z" fill="#ef4444" />
    <circle cx="78" cy="37" r="2" fill="#fff" />
    <path d="M 76,42 L 78,48 L 80,42 Z" fill="#f59e0b" />

    <!-- Big Star -->
    <path d="M 45,55 L 48,48 L 55,47 L 50,42 L 52,35 L 45,39 L 38,35 L 40,42 L 35,47 L 42,48 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Small floating sparkle bubbles -->
  <circle cx="85" cy="85" r="4" fill="#fbbf24" />
  <circle cx="165" cy="65" r="3" fill="#38bdf8" />
  <circle cx="185" cy="100" r="5" fill="#f43f5e" />

</svg>