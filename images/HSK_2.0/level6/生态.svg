<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to create depth for the central ecological object -->
  <circle cx="120" cy="120" r="70" fill="#222B36" opacity="0.6"/>

  <!-- Centerpiece: Ecosystem Globe representing "生态" (Shengtai / Ecology) -->
  <g transform="translate(120, 115)">
    <!-- Outer Circular Orbit / Ring (Tech/Modern flat touch) -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#2D3748" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#3B82F6" stroke-width="3" opacity="0.2"/>

    <!-- Globe Base (The Environment/Earth core) -->
    <circle cx="0" cy="0" r="50" fill="#1E293B"/>

    <!-- Landmass silhouettes inside the globe -->
    <path d="M-30 10 Q-15 -10 5 -5 Q25 0 30 20 Q15 35 -10 30 Z" fill="#10B981" opacity="0.8"/>
    <path d="M-15 -25 Q5 -35 20 -20 Q10 -5 -15 -15 Z" fill="#059669" opacity="0.7"/>

    <!-- Dynamic Ecosystem Elements: Water Wave -->
    <path d="M-42 22 Q-20 35 0 22 Q20 9 42 22 L42 45 Q20 58 0 45 Q-20 32 -42 45 Z" fill="#3B82F6" opacity="0.5"/>

    <!-- Central Focus: Sprout / Plant Life representing "生" (Life/Growth) -->
    <g transform="translate(0, 5)">
      <!-- Stem -->
      <path d="M0 15 Q0 -5 -2 -18" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Left Leaf -->
      <path d="M-1 -5 Q-15 -12 -18 -2 Q-10 3 -1 -5 Z" fill="#34D399"/>
      
      <!-- Right Leaf -->
      <path d="M-1 -12 Q12 -22 18 -12 Q10 -2 -1 -12 Z" fill="#10B981"/>
      
      <!-- Top Bud -->
      <circle cx="-3" cy="-20" r="4" fill="#6EE7B7"/>
    </g>

    <!-- Orbiting Energy / Balance Elements (Gold/Orange accent for focus) -->
    <circle cx="48" cy="-25" r="5" fill="#F59E0B"/>
    <path d="M44 -29 L52 -21 M52 -29 L44 -21" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="-48" cy="15" r="3.5" fill="#60A5FA"/>
  </g>

  <!-- UI framing / bottom anchor for flashcard style -->
  <rect x="96" y="202" width="48" height="4" rx="2" fill="#374151"/>
</svg>