  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Mountain Silhouettes -->
  <path d="M0 240 L0 120 L40 90 L80 130 L120 100 L160 140 L200 110 L240 150 L240 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M20 240 L20 140 L60 110 L100 150 L140 120 L180 160 L220 130 L240 170 L240 240 Z" fill="#334155" opacity="0.6"/>

