    <rect x="5" y="3" width="10" height="15" rx="2" fill="#38bdf8"/>
    <rect x="2" y="5" width="4" height="10" rx="1" fill="#38bdf8"/>
    <rect x="14" y="5" width="4" height="10" rx="1" fill="#38bdf8"/>
    <rect x="6" y="18" width="3" height="10" rx="1" fill="#fb923c"/>
