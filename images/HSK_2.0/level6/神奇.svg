<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background aura for "Miraculous Object / Elixir" -->
  <circle cx="120" cy="115" r="55" fill="#FFB703" opacity="0.08" filter="blur(8px)"/>
  
  <!-- Floating magical sparks / particles -->
  <g fill="#FFB703" opacity="0.8">
    <path d="M70,85 L72,90 L77,92 L72,94 L70,99 L68,94 L63,92 L68,90 Z" transform="scale(0.8) translate(10, 10)"/>
    <path d="M175,95 L176.5,99 L180.5,100.5 L176.5,102 L175,106 L173.5,102 L169.5,100.5 L173.5,99 Z" transform="scale(0.7) translate(30, 0)"/>
    <path d="M165,150 L166,153 L169,154 L166,155 L165,158 L164,155 L161,154 L164,153 Z" transform="scale(0.9) translate(15, 10)"/>
    <circle cx="85" cy="145" r="2.5" fill="#3A86EF"/>
    <circle cx="155" cy="75" r="2" fill="#3A86EF"/>
  </g>

  <!-- Central Object: Magical Medicine Bottle (Representing "这种药效果十分神奇") -->
  <g transform="translate(0, 5)">
    <!-- Aura/Glow from bottle -->
    <path d="M95,120 Q120,105 145,120 Q160,145 145,170 Q120,185 95,170 Q80,145 95,120 Z" fill="#3A86EF" opacity="0.15" filter="blur(6px)"/>
    
    <!-- Cork / Stopper -->
    <path d="M107,68 L133,68 C135,68 136,69 136,71 L136,77 C136,79 135,80 133,80 L107,80 C105,80 104,79 104,77 L104,71 C104,69 105,68 107,68 Z" fill="#E9D8A6"/>
    <!-- Cork detail line -->
    <line x1="104" y1="74" x2="136" y2="74" stroke="#CA6702" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bottle Neck -->
    <rect x="110" y="80" width="20" height="15" fill="#E2E8F0" opacity="0.9"/>
    <rect x="108" y="93" width="24" height="6" rx="3" fill="#FFB703"/>

    <!-- Bottle Body (Flask/Potion container) -->
    <path d="M108,99 C108,99 85,130 85,150 C85,172 100,185 120,185 C140,185 155,172 155,150 C155,130 132,99 132,99 Z" fill="#2B303C" stroke="#3A86EF" stroke-width="3"/>
    
    <!-- Liquid inside (Glowing Gold/Orange) -->
    <path d="M88,148 C95,135 105,128 120,128 C135,128 145,135 152,148 C154,153 155,158 154,165 C152,176 138,182 120,182 C102,182 88,176 86,165 C85,158 86,153 88,148 Z" fill="#FFB703" opacity="0.85"/>

    <!-- Bubbles inside liquid -->
    <circle cx="110" cy="155" r="3.5" fill="#FFF" opacity="0.6"/>
    <circle cx="130" cy="165" r="2" fill="#FFF" opacity="0.6"/>
    <circle cx="123" cy="145" r="1.5" fill="#FFF" opacity="0.6"/>

    <!-- Bottle highlight reflection -->
    <path d="M96,135 C94,142 93,150 95,160" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none"/>

    <!-- Magical Star Icon embedded on the bottle -->
    <g transform="translate(120, 155) scale(0.9)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- Energy Rings / Orbiting Miraculous Elements -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="120" cy="150" rx="48" ry="16" stroke="#3A86EF" stroke-width="2" opacity="0.4" transform="rotate(-15 120 150)"/>
    <path d="M60,110 Q90,95 120,115" stroke="#FFB703" stroke-width="2" opacity="0.6" stroke-dasharray="4 4"/>
    <path d="M120,115 Q150,135 180,110" stroke="#FFB703" stroke-width="2" opacity="0.6" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Additional magical sparkles near base -->
  <path d="M120,195 L121.5,199 L125.5,200.5 L121.5,202 L120,206 L118.5,202 L114.5,200.5 L118.5,199 Z" fill="#FFB703" opacity="0.9" transform="scale(0.8) translate(30, 10)"/>
</svg>