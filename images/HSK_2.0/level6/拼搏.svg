<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Track / Ground Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Stadium Lighting Effect -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Runner 1 Jersey (Orange/Amber) -->
    <linearGradient id="jersey1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Runner 2 Jersey (Cyan/Blue) -->
    <linearGradient id="jersey2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Motion Lines Filter / Soft Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stadium Atmosphere & Lights -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />
  
  <!-- Stadium Floodlights in Background -->
  <circle cx="60" cy="40" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="70" cy="35" r="2" fill="#38bdf8" opacity="0.9" filter="url(#glow)" />
  <circle cx="180" cy="40" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="170" cy="35" r="2" fill="#38bdf8" opacity="0.9" filter="url(#glow)" />
  
  <!-- Stadium Architecture / Stands silhouette -->
  <path d="M0 90 L240 90 L240 110 L0 110 Z" fill="#1e293b" opacity="0.4" />
  <line x1="0" y1="95" x2="240" y2="95" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.5" />
  <line x1="0" y1="102" x2="240" y2="102" stroke="#334155" stroke-width="1" stroke-dasharray="8,4" opacity="0.5" />

  <!-- Running Track Surface -->
  <path d="M-20 160 Q120 120 260 160 L260 230 Q120 200 -20 230 Z" fill="url(#trackGrad)" />
  
  <!-- Track Lanes (Perspective Lines) -->
  <path d="M10 172 Q120 140 230 173" stroke="#f8fafc" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <path d="M-5 190 Q120 157 245 192" stroke="#f8fafc" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <path d="M-15 210 Q120 175 255 212" stroke="#f8fafc" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Finish Line Ribbon (Diagonal across the track) -->
  <g opacity="0.9">
    <line x1="185" y1="125" x2="160" y2="185" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="183" y1="125" x2="158" y2="185" stroke="#ef4444" stroke-width="2" />
    <!-- Support Poles -->
    <line x1="185" y1="125" x2="185" y2="110" stroke="#94a3b8" stroke-width="2" />
    <line x1="160" y1="185" x2="155" y2="200" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Speed / Motion Streak Lines -->
  <g opacity="0.4" stroke-linecap="round">
    <line x1="40" y1="145" x2="90" y2="145" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="30" y1="155" x2="110" y2="155" stroke="#fbbf24" stroke-width="2" />
    <line x1="60" y1="170" x2="130" y2="170" stroke="#ffffff" stroke-width="1" />
    <line x1="90" y1="135" x2="150" y2="135" stroke="#fbbf24" stroke-width="1.5" />
  </g>

  <!-- ATHLETE 1: Intense Sprinter in Orange/Amber (Foreground, pushing hard) -->
  <g transform="translate(10, 0)">
    <!-- Back Leg (Stretching / Pushing) -->
    <path d="M125 150 L105 185 L85 175" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Shoe 1 -->
    <ellipse cx="82" cy="177" rx="6" ry="3" fill="#ffffff" transform="rotate(-15 82 177)" />

    <!-- Back Arm (Pumped back) -->
    <path d="M115 125 L95 140 L110 155" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="110" cy="157" r="3.5" fill="#fcd34d" />

    <!-- Torso (Lean forward for maximum effort/拼搏) -->
    <path d="M115 115 L135 155 L125 155 L105 125 Z" fill="url(#jersey1)" />
    <!-- Jersey Number / Detail -->
    <circle cx="123" cy="138" r="4" fill="#ffffff" opacity="0.9" />

    <!-- Head & Determination Face -->
    <circle cx="128" cy="103" r="10" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M118 102 C118 95, 128 93, 136 98 C134 95, 126 95, 120 98 Z" fill="#0f172a" />
    <!-- Determined Eyes (slanted brows) -->
    <line x1="124" y1="102" x2="130" y2="104" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <!-- Sweat drop of hard effort -->
    <path d="M136 103 Q138 107 136 109 Q134 107 136 103 Z" fill="#38bdf8" />

    <!-- Front Arm (Reaching forward) -->
    <path d="M120 120 L145 130 L160 120" stroke="#fb923c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="162" cy="119" r="3.5" fill="#fcd34d" />

    <!-- Front Leg (Powerful stride) -->
    <path d="M130 150 L155 170 L145 195" stroke="#ea580c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Shoe 2 -->
    <ellipse cx="143" cy="197" rx="7" ry="3.5" fill="#ffffff" transform="rotate(25 143 197)" />
  </g>

  <!-- ATHLETE 2: Competitor Closely Following (Cyan/Blue Jersey) -->
  <g transform="translate(-30, 15) scale(0.9)" opacity="0.95">
    <!-- Back Leg -->
    <path d="M120 145 L100 175 L85 165" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Arm -->
    <path d="M110 120 L95 135 L105 150" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Torso -->
    <path d="M110 110 L130 145 L120 145 L100 120 Z" fill="url(#jersey2)" />
    
    <!-- Head -->
    <circle cx="122" cy="100" r="9" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M114 99 C114 93, 122 91, 130 95 Z" fill="#1e293b" />
    <!-- Focus Brow -->
    <line x1="119" y1="99" x2="124" y2="101" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Front Arm -->
    <path d="M115 115 L135 125 L145 115" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Front Leg -->
    <path d="M125 145 L145 165 L135 190" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <ellipse cx="133" cy="192" rx="6" ry="3" fill="#ffffff" transform="rotate(20 133 192)" />
  </g>

  <!-- Environmental Energy & Dynamic Elements -->
  <!-- Floating energetic sparks / sweat particles representing intense effort (拼搏) -->
  <circle cx="130" cy="115" r="1.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="145" cy="105" r="2" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="160" cy="130" r="1" fill="#ffffff" />
  <circle cx="110" cy="140" r="1.5" fill="#fb923c" />
  <circle cx="95" cy="120" r="2" fill="#38bdf8" filter="url(#glow)" />
</svg>