<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainDistant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mountainClose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    
    <!-- Bag Expansion Glow -->
    <radialGradient id="expansionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Background / Stars & Clouds -->
  <g id="atmosphere">
    <!-- Tiny distant stars -->
    <circle cx="40" cy="30" r="1" fill="#cbd5e1" opacity="0.6"/>
    <circle cx="90" cy="20" r="1.5" fill="#e2e8f0" opacity="0.8"/>
    <circle cx="160" cy="35" r="1" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="210" cy="25" r="1.2" fill="#f8fafc" opacity="0.9"/>
    
    <!-- High altitude wispy clouds -->
    <path d="M 15 50 Q 30 45 45 50 T 75 48" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 170 40 Q 185 35 200 40 T 230 38" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Distant Mountain Range -->
  <polygon points="0,170 50,110 110,160 170,95 240,150 240,240 0,240" fill="url(#mountainDistant)"/>
  
  <!-- Closer Peak (Snow Capped) -->
  <polygon points="110,240 160,110 220,180 240,160 240,240" fill="url(#mountainClose)"/>
  <!-- Snow cap -->
  <polygon points="160,110 173,132 165,138 158,130 148,135" fill="#f8fafc" opacity="0.9"/>

  <!-- Main Foreground Peak / Summit Platform -->
  <path d="M -10,240 L 40,140 Q 80,120 120,135 L 200,240 Z" fill="#475569"/>
  <!-- Rocky ground texture details -->
  <path d="M 30,190 L 50,175 L 70,200" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 90,170 L 110,155 L 125,180" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Wooden Camp Sign / Post pointing up -->
  <g id="signpost" transform="translate(35, 120)">
    <rect x="0" y="0" width="4" height="40" fill="#78350f" rx="1"/>
    <!-- Signboard -->
    <path d="M -12,8 L 16,3 L 16,22 L -12,17 Z" fill="#b45309"/>
    <path d="M -10,9 L 14,5 L 14,20 L -10,24 Z" fill="#d97706"/>
    <!-- Direction arrow notch -->
    <polygon points="14,12.5 20,12.5 14,8" fill="#b45309"/>
    <!-- Small altitude marker lines (no text) -->
    <line x1="-5" y1="12" x2="2" y2="12" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="16" x2="6" y2="16" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Hiker Character -->
  <g id="hiker" transform="translate(100, 115)">
    <!-- Hiking Backpack (Large, well-equipped) -->
    <rect x="-16" y="22" width="16" height="24" rx="5" fill="#0284c7"/>
    <rect x="-18" y="26" width="20" height="8" rx="2" fill="#0ea5e9"/>
    <!-- Sleeping roll attached to top -->
    <rect x="-14" y="17" width="12" height="6" rx="3" fill="#f97316"/>
    
    <!-- Body / Winter Jacket (Warm orange/red explorer gear) -->
    <path d="M -12,22 C -15,30 -10,50 -10,55 L 4,55 C 6,45 8,30 5,22 Z" fill="#ea580c"/>
    <path d="M -6,22 L -6,52" stroke="#c2410c" stroke-width="2"/> <!-- zipper -->

    <!-- Legs & Hiking Boots -->
    <path d="M -8,53 L -9,75 L -4,75 L -3,53 Z" fill="#334155"/> <!-- Left leg -->
    <rect x="-11" y="72" width="8" height="5" rx="2" fill="#1e293b"/> <!-- Left boot -->
    <path d="M 0,53 L 2,74 L 7,73 L 4,53 Z" fill="#334155"/> <!-- Right leg -->
    <rect x="2" y="71" width="8" height="5" rx="2" fill="#1e293b"/> <!-- Right boot -->

    <!-- Head & Winter Hat -->
    <circle cx="-3" cy="12" r="8" fill="#fed7aa"/> <!-- Face -->
    <!-- Cheeks flushed from cold/altitude -->
    <circle cx="-6" cy="14" r="2" fill="#f43f5e" opacity="0.6"/>
    <!-- Smiling open mouth expression of awe/success -->
    <path d="M -5,17 Q -3,20 -1,17" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Eyes (happy squint) -->
    <path d="M -7,10 Q -5,8 -3,10" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Beanie Hat -->
    <path d="M -12,10 C -12,2 -4,2 6,8 L 6,11 C -4,6 -10,6 -12,10 Z" fill="#0284c7"/>
    <circle cx="-3" cy="2" r="2.5" fill="#f97316"/> <!-- Pom pom -->

    <!-- Arms & Interaction -->
    <!-- Left arm holding trekking pole -->
    <path d="M -11,26 L -20,40 L -18,65" stroke="#ea580c" stroke-width="5" stroke-linecap="round" fill="none"/>
    <line x1="-18" y1="20" x2="-22" y2="75" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/> <!-- Trekking pole -->

    <!-- Right arm pointing excitedly at the inflated snack bag -->
    <path d="M 3,25 C 10,28 16,35 18,30" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="19" cy="28" r="3" fill="#fed7aa"/> <!-- Hand -->
  </g>

  <!-- Low Atmospheric Pressure Demonstration Prop (Puffed-up Snack Bag) -->
  <!-- Situated clearly in front/near the hiker to demonstrate air pressure difference -->
  <g id="puffed-bag" transform="translate(145, 145)">
    <!-- Expansion glow effect -->
    <circle cx="15" cy="15" r="25" fill="url(#expansionGlow)"/>

    <!-- Taut, swollen foil snack bag -->
    <g transform="rotate(15)">
      <!-- Bag body -->
      <path d="M 0,5 Q -8,20 -4,35 Q 15,42 28,32 Q 33,18 25,5 Q 12,-2 0,5 Z" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
      
      <!-- Foil highlights to show tightness/stretching -->
      <path d="M 4,8 Q 12,15 10,30" stroke="#6ee7b7" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 15,6 Q 22,18 20,28" stroke="#6ee7b7" stroke-width="1.5" fill="none" opacity="0.5"/>

      <!-- Bag top crimp/seal -->
      <path d="M 2,-2 L 14,-2 L 13,4 L 3,4 Z" fill="#047857"/>
      <line x1="4" y1="1" x2="12" y2="1" stroke="#065f46" stroke-width="1"/>
      <line x1="4" y1="3" x2="12" y2="3" stroke="#065f46" stroke-width="1"/>

      <!-- Internal pressure outward force lines (subtle arrows pointing out) -->
      <path d="M -5,22 L -10,20" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 32,22 L 37,20" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 22, -1 L 25, -6" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Additional Atmospheric/Height elements: Flying Bird in distance -->
  <g id="birds" opacity="0.7">
    <path d="M 60,70 Q 65,65 70,70 Q 75,65 80,70 Q 75,73 70,70 Q 65,73 60,70 Z" fill="#94a3b8" transform="scale(0.6) translate(50, 20)"/>
    <path d="M 60,70 Q 65,65 70,70 Q 75,65 80,70 Q 75,73 70,70 Q 65,73 60,70 Z" fill="#94a3b8" transform="scale(0.4) translate(140, 60)"/>
  </g>

  <!-- Foreground Atmospheric Mist/Clouds passing the peak -->
  <path d="M 110,195 Q 130,185 155,195 T 195,190" stroke="#94a3b8" stroke-width="6" fill="none" opacity="0.15" stroke-linecap="round"/>
  <path d="M 20,220 Q 50,210 80,225 T 140,215" stroke="#94a3b8" stroke-width="8" fill="none" opacity="0.1" stroke-linecap="round"/>

</svg>