<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Beam from Book / Revelation -->
    <linearGradient id="lightBeam" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Bulb/Spark -->
    <radialGradient id="glowSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>

    <!-- Character Skin Shadow -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Cozy Room Interior -->
  <!-- Wallpaper / Back wall -->
  <rect x="15" y="15" width="210" height="185" rx="8" fill="#17223b" opacity="0.6" />
  
  <!-- Bookshelf in background -->
  <g fill="#283856" opacity="0.5">
    <rect x="25" y="40" width="45" height="90" rx="2" />
    <!-- Shelves & books -->
    <rect x="28" y="65" width="39" height="3" fill="#3b4d75" />
    <rect x="28" y="90" width="39" height="3" fill="#3b4d75" />
    <rect x="28" y="115" width="39" height="3" fill="#3b4d75" />
    <!-- Colorful tiny book spines -->
    <rect x="32" y="45" width="6" height="18" fill="#38bdf8" />
    <rect x="40" y="47" width="8" height="16" fill="#f43f5e" />
    <rect x="50" y="44" width="5" height="19" fill="#10b981" />
    
    <rect x="30" y="70" width="7" height="18" fill="#fbbf24" />
    <rect x="39" y="72" width="10" height="16" fill="#6366f1" />
    <rect x="52" y="69" width="6" height="19" fill="#ec4899" />
  </g>

  <!-- Round Window showing night sky & moon -->
  <circle cx="190" cy="70" r="28" fill="url(#windowGrad)" stroke="#334155" stroke-width="4" />
  <!-- Moon & Stars outside -->
  <circle cx="200" cy="58" r="7" fill="#fef08a" opacity="0.9" />
  <circle cx="175" cy="65" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="182" cy="85" r="1" fill="#ffffff" opacity="0.6" />
  <path d="M 190 42 L 190 98 M 162 70 L 218 70" stroke="#334155" stroke-width="3" /> <!-- Window frame cross -->

  <!-- House plant on a small ledge -->
  <path d="M 155 125 L 175 125 L 170 145 L 160 145 Z" fill="#475569" /> <!-- Pot -->
  <path d="M 165 125 C 165 110, 150 110, 155 95 C 165 110, 180 110, 165 125 Z" fill="#10b981" /> <!-- Plant leaves -->
  <path d="M 165 125 C 175 110, 190 115, 185 100 C 175 110, 160 115, 165 125 Z" fill="#34d399" />

  <!-- Wooden Desk Surface -->
  <path d="M 10 170 L 230 170 L 220 205 L 20 205 Z" fill="#b45309" />
  <path d="M 10 170 L 230 170 L 230 176 L 10 176 Z" fill="#d97706" /> <!-- Desk Edge Highlight -->
  <rect x="30" y="205" width="15" height="25" fill="#78350f" rx="3" /> <!-- Desk leg left -->
  <rect x="195" y="205" width="15" height="25" fill="#78350f" rx="3" /> <!-- Desk leg right -->

  <!-- THE MOMENT OF REVELATION (Light Cone from Book) -->
  <polygon points="120,135 60,20 180,20" fill="url(#lightBeam)" />

  <!-- Floating Sparkles / Ideas / "启示" visual metaphor -->
  <g transform="translate(0, 0)">
    <!-- Central Bright Sparkle above book -->
    <circle cx="120" cy="70" r="16" fill="url(#glowSpark)" />
    <!-- Sparkle star shape -->
    <path d="M 120 52 L 123 64 L 135 67 L 123 70 L 120 82 L 117 70 L 105 67 L 117 64 Z" fill="#fef08a" />
    <path d="M 95 85 L 97 91 L 103 93 L 97 95 L 95 101 L 93 95 L 87 93 L 93 91 Z" fill="#38bdf8" />
    <path d="M 145 90 L 146.5 94.5 L 151 96 L 146.5 97.5 L 145 102 L 143.5 97.5 L 139 96 L 143.5 94.5 Z" fill="#f472b6" />
    <!-- Floating abstract thought circles -->
    <circle cx="100" cy="115" r="4" fill="#fbbf24" opacity="0.8" />
    <circle cx="140" cy="110" r="6" fill="#38bdf8" opacity="0.7" />
    <circle cx="110" cy="95" r="2.5" fill="#f472b6" opacity="0.9" />
  </g>

  <!-- PROPS ON DESK -->
  <!-- Coffee Mug -->
  <rect x="180" y="150" width="16" height="22" rx="3" fill="#f8fafc" />
  <path d="M 196 155 C 203 155, 203 167, 196 167" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <!-- Steam from mug -->
  <path d="M 185 142 C 183 137, 189 134, 187 128" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Open Story Book (Centerpiece) -->
  <g transform="translate(95, 135)">
    <!-- Book Cover / Base -->
    <path d="M -25 32 L 25 32 L 35 44 L -35 44 Z" fill="#1e3a8a" />
    <!-- Left Page -->
    <path d="M -25 30 L -2 27 L -2 40 L -33 42 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 25 30 L 2 27 L 2 40 L 33 42 Z" fill="#f8fafc" />
    <!-- Center Spine Shadow -->
    <line x1="0" y1="27" x2="0" y2="40" stroke="#cbd5e1" stroke-width="2" />
    <!-- Text lines on book (abstract squiggles) -->
    <line x1="-20" y1="32" x2="-8" y2="33" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-22" y1="36" x2="-10" y2="37" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="32" x2="20" y2="33" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="36" x2="22" y2="37" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: In-depth expressive human experiencing "启示" (revelation/insight) -->
  <g transform="translate(0, 5)">
    <!-- Character Body / Torso (leaning forward in realization) -->
    <path d="M 90 185 C 90 155, 105 140, 125 140 C 145 140, 160 155, 160 185 Z" fill="#3b82f6" />
    <!-- Collar / Shirt Detail -->
    <path d="M 112 140 L 125 152 L 138 140 Z" fill="#f8fafc" />

    <!-- Arms / Hands supporting head in "Ah-ha!" moment -->
    <!-- Left Arm -->
    <path d="M 98 165 C 80 160, 75 135, 95 125 C 102 122, 108 128, 105 135 Z" fill="#3b82f6" />
    <!-- Left Hand supporting chin/cheek -->
    <circle cx="102" cy="122" r="8" fill="url(#skinGrad)" />

    <!-- Right Arm (bent back or resting) -->
    <path d="M 152 165 C 170 165, 175 140, 155 130 C 148 127, 142 133, 145 140 Z" fill="#2563eb" />
    <circle cx="148" cy="127" r="7" fill="url(#skinGrad)" />

    <!-- Neck -->
    <rect x="117" y="130" width="16" height="18" fill="url(#skinGrad)" rx="6" />

    <!-- Head -->
    <g transform="translate(125, 115)">
      <!-- Hair Back -->
      <circle cx="0" cy="-5" r="26" fill="#1e293b" />
      
      <!-- Face Base -->
      <circle cx="0" cy="0" r="24" fill="url(#skinGrad)" />

      <!-- Hair Front / Bangs -->
      <path d="M -22 -10 C -20 -24, 0 -28, 15 -22 C 22 -19, 24 -10, 24 -10 C 24 -10, 10 -18, -5 -16 C -15 -15, -22 -10, -22 -10 Z" fill="#1e293b" />
      <path d="M -15 -18 C -10 -25, 5 -24, 12 -20 C 5 -22, -5 -20, -15 -18 Z" fill="#334155" />

      <!-- Facial Expression: Eyes wide open with sudden brilliant realization -->
      <!-- Left Eye (Surprised / Enlightened look) -->
      <circle cx="-8" cy="-2" r="5" fill="#ffffff" />
      <circle cx="-7" cy="-2" r="2.5" fill="#0f172a" />
      <circle cx="-8.5" cy="-3.5" r="1" fill="#ffffff" /> <!-- highlight -->

      <!-- Right Eye -->
      <circle cx="8" cy="-2" r="5" fill="#ffffff" />
      <circle cx="7" cy="-2" r="2.5" fill="#0f172a" />
      <circle cx="5.5" cy="-3.5" r="1" fill="#ffffff" /> <!-- highlight -->

      <!-- Eyebrows raised high in realization -->
      <path d="M -13 -10 C -10 -13, -5 -10, -3 -9" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M 3 -9 C 5 -10, 10 -13, 13 -10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Cheeks (Warm blush of excitement) -->
      <circle cx="-13" cy="5" r="4" fill="#f43f5e" opacity="0.3" />
      <circle cx="13" cy="5" r="4" fill="#f43f5e" opacity="0.3" />

      <!-- Open "Aha!" / Smiling Mouth -->
      <path d="M -6 8 C -6 14, 6 14, 6 8 C 6 6, -6 6, -6 8 Z" fill="#9f1239" />
      <path d="M -5 8 C -5 11, 5 11, 5 8 Z" fill="#f43f5e" /> <!-- Tongue -->
      <!-- Mouth highlight line -->
      <path d="M -6 8 C -6 6, 6 6, 6 8" fill="none" stroke="#e11d48" stroke-width="1.5" />
    </g>
  </g>

  <!-- FOREGROUND DEPTH DETAILS -->
  <!-- Ambient lighting overlay (vignette framing) -->
  <circle cx="120" cy="120" r="130" fill="none" stroke="#000000" stroke-width="20" opacity="0.25" />
</svg>