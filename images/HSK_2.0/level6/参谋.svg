<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="40" y="140" width="160" height="15" rx="2" fill="#475569"/>
  <rect x="50" y="155" width="10" height="60" rx="2" fill="#334155"/>
  <rect x="180" y="155" width="10" height="60" rx="2" fill="#334155"/>
  
  <!-- Map on table -->
  <path d="M60 145 L180 145 L170 180 L70 180 Z" fill="#cbd5e1"/>
  <path d="M75 150 L165 150 L160 175 L80 175 Z" fill="#94a3b8"/>
  <circle cx="100" cy="160" r="4" fill="#ef4444"/>
  <circle cx="140" cy="165" r="4" fill="#ef4444"/>
  
  <!-- Character -->
  <g transform="translate(120, 110)">
    <!-- Uniform -->
    <path d="M-40 20 L40 20 L35 80 L-35 80 Z" fill="#1e40af"/>
    <rect x="-35" y="20" width="70" height="10" fill="#1e3a8a"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-20 -25 C-20 -40 20 -40 20 -25 L20 -15 L-20 -15 Z" fill="#334155"/>
    <!-- Eyes -->
    <ellipse cx="-8" cy="-15" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="8" cy="-15" rx="3" ry="4" fill="#0f172a"/>
    <!-- Glasses -->
    <circle cx="-8" cy="-15" r="7" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <circle cx="8" cy="-15" r="7" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <line x1="-1" y1="-15" x2="1" y2="-15" stroke="#fbbf24" stroke-width="2"/>
  </g>
  
  <!-- Props -->
  <rect x="160" y="120" width="20" height="25" rx="2" fill="#fb923c"/>
  <rect x="165" y="125" width="10" height="5" fill="#fff"/>
  <rect x="165" y="135" width="10" height="5" fill="#fff"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="100" r="80" fill="url(#lightGrad)" opacity="0.1"/>
  <defs>
    <radialGradient id="lightGrad">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>