<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Office Glow -->
    <radialGradient id="office-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Government Emblem / Crest Shield Gradient -->
    <linearGradient id="crest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#office-glow)" />

  <!-- Interior Wall & Background Architecture -->
  <g id="interior">
    <!-- Large Official Arch / Window in Background -->
    <path d="M 80 35 L 160 35 L 160 110 C 160 135, 80 135, 80 110 Z" fill="url(#window-light)" />
    <!-- Window Frame Lines -->
    <line x1="120" y1="35" x2="120" y2="125" stroke="#1e293b" stroke-width="2" />
    <line x1="85" y1="80" x2="155" y2="80" stroke="#1e293b" stroke-width="2" />

    <!-- Official Government Emblem Plaque on Wall -->
    <circle cx="120" cy="65" r="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 120 54 L 123 61 L 130 62 L 125 67 L 126 74 L 120 70 L 114 74 L 115 67 L 110 62 L 117 61 Z" fill="url(#crest-grad)" transform="translate(0, 2) scale(0.65)" />

    <!-- Filing Cabinets / Bookshelf Elements on Left -->
    <rect x="25" y="45" width="30" height="90" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="75" x2="55" y2="75" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="105" x2="55" y2="105" stroke="#334155" stroke-width="1.5" />
    <circle cx="40" cy="60" r="2" fill="#64748b" />
    <circle cx="40" cy="90" r="2" fill="#64748b" />
    <circle cx="40" cy="120" r="2" fill="#64748b" />

    <!-- Potted Plant on Right for Environmental Depth -->
    <path d="M 195 105 L 210 105 L 206 130 L 199 130 Z" fill="#475569" />
    <path d="M 202 105 C 190 90, 185 70, 195 60 C 205 70, 205 90, 202 105 Z" fill="#10b981" opacity="0.8" />
    <path d="M 202 105 C 215 95, 220 75, 212 65 C 205 75, 205 90, 202 105 Z" fill="#059669" opacity="0.9" />
  </g>

  <!-- Foreground Workspace (Desk & Office Props) -->
  <g id="workspace">
    <!-- Main Desk Surface -->
    <path d="M 20 155 L 220 155 L 210 205 L 30 205 Z" fill="url(#desk-grad)" />
    <!-- Desk Front Edge Highlight -->
    <path d="M 20 155 L 220 155" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Office Desk Props -->
    <!-- Computer Monitor & Stand -->
    <rect x="95" y="105" width="50" height="35" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="99" y="109" width="42" height="23" rx="1" fill="#38bdf8" opacity="0.2" />
    <!-- Abstract UI bars on screen representing official documents/data -->
    <line x1="104" y1="115" x2="125" y2="115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="104" y1="122" x2="132" y2="122" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="104" y1="129" x2="118" y2="129" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 115 140 L 125 140 L 127 146 L 113 146 Z" fill="#64748b" />
    <rect x="110" y="146" width="20" height="3" rx="1.5" fill="#475569" />

    <!-- Stack of Official Documents / Files -->
    <g transform="translate(155, 135)">
      <rect x="0" y="12" width="35" height="6" rx="1" fill="#cbd5e1" />
      <rect x="-2" y="8" width="37" height="6" rx="1" fill="#f8fafc" />
      <rect x="2" y="4" width="33" height="6" rx="1" fill="#e2e8f0" />
      <!-- Red official stamp mark -->
      <circle cx="25" cy="7" r="3" fill="#ef4444" opacity="0.8" />
    </g>

    <!-- Desk Lamp -->
    <path d="M 55 155 L 55 130 L 45 120" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 38 115 L 52 115 L 48 123 L 42 123 Z" fill="#f59e0b" />
    <path d="M 45 123 L 45 130" stroke="#f59e0b" stroke-width="2" />
    <!-- Lamp Light Cone Projection -->
    <polygon points="45,123 25,175 65,175" fill="#fbbf24" opacity="0.08" />
  </g>

  <!-- Character: Professional Government Worker -->
  <g id="character">
    <!-- Character Body / Suit Torso -->
    <path d="M 92 185 L 148 185 L 142 140 L 98 140 Z" fill="url(#suit-grad)" />
    <!-- Crisp White Shirt Collar -->
    <path d="M 110 140 L 120 152 L 130 140 Z" fill="#f8fafc" />
    <!-- Professional Tie -->
    <polygon points="118,144 122,144 124,170 120,178 116,170" fill="#ef4444" />

    <!-- Character Arms & Hands Working -->
    <!-- Left Arm (Holding stylus/pen or typing) -->
    <path d="M 98 145 C 80 155, 85 175, 95 175" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M 142 145 C 160 155, 155 175, 145 175" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
    
    <!-- Hands -->
    <circle cx="95" cy="175" r="5" fill="#f1d0b3" />
    <circle cx="145" cy="175" r="5" fill="#f1d0b3" />

    <!-- Neck -->
    <rect x="113" y="130" width="14" height="15" fill="#f1d0b3" />

    <!-- Head & Face -->
    <circle cx="120" cy="110" r="20" fill="#f1d0b3" />

    <!-- Neat Professional Hair (Dark, styled neatly) -->
    <path d="M 101 108 C 101 92, 139 92, 139 108 C 139 112, 137 103, 132 98 C 124 93, 114 93, 108 98 C 103 103, 101 108, 101 108 Z" fill="#0f172a" />

    <!-- Professional Glasses -->
    <rect x="108" y="103" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <rect x="121" y="103" width="11" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <line x1="119" y1="106" x2="121" y2="106" stroke="#0f172a" stroke-width="1.5" />

    <!-- Confident, Friendly Expression -->
    <!-- Eyes (Focused & Content) -->
    <line x1="111" y1="106" x2="116" y2="106" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <line x1="124" y1="106" x2="129" y2="106" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <!-- Gentle Smile -->
    <path d="M 116 117 C 118 119, 122 119, 124 117" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="110" cy="113" r="2.5" fill="#fb7185" opacity="0.4" />
    <circle cx="130" cy="113" r="2.5" fill="#fb7185" opacity="0.4" />
  </g>

  <!-- Atmospheric Highlights & Polish -->
  <!-- Subtle rim light on character hair -->
  <path d="M 108 98 C 114 93, 124 93, 132 98" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Floating UI / Success Sparkles (Clean vector ambience) -->
  <g transform="translate(170, 75)">
    <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
  <g transform="translate(60, 95) scale(0.6)">
    <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>