<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements / UI glow -->
  <circle cx="120" cy="120" r="70" fill="#242933" opacity="0.6"/>
  
  <!-- Subtle context lines indicating mouth/jaw outline -->
  <path d="M 75 145 Q 120 180 165 145" fill="none" stroke="#2F3642" stroke-width="4" stroke-linecap="round"/>
  <path d="M 85 95 Q 120 70 155 95" fill="none" stroke="#2F3642" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Main Object: The Tongue (舌头) - Sleek modern flat vector style -->
  <!-- Base shadow for depth -->
  <path d="M 90 120 C 90 155 100 170 120 170 C 140 170 150 155 150 120 C 150 95 138 85 120 85 C 102 85 90 95 90 120 Z" fill="#C23B3B" opacity="0.4" filter="blur(4px)"/>
  
  <!-- Main tongue body -->
  <path d="M 92 118 C 92 152 102 166 120 166 C 138 166 148 152 148 118 C 148 94 136 84 120 84 C 104 84 92 94 92 118 Z" fill="#FF5E7E"/>
  
  <!-- Tongue surface highlight / glossy effect -->
  <path d="M 104 105 C 104 130 110 145 120 148 C 124 148 127 135 127 115 C 127 98 120 90 120 90 C 120 90 104 90 104 105 Z" fill="#FF8CA3" opacity="0.7"/>

  <!-- Center subtle dividing line of the tongue -->
  <path d="M 120 95 L 120 155" fill="none" stroke="#E04868" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Contextual focus: "Biting" element representing "他不小心咬到了自己的舌头" -->
  <!-- Upper Teeth (White clean flat blocks) -->
  <path d="M 90 75 L 95 90 L 115 90 L 115 75 Z" fill="#EAEFF8" opacity="0.9"/>
  <path d="M 118 75 L 118 90 L 138 90 L 143 75 Z" fill="#EAEFF8" opacity="0.9"/>
  <path d="M 85 75 L 89 88 L 78 88 Z" fill="#D2DCED" opacity="0.7"/>
  <path d="M 145 75 L 141 88 L 152 88 Z" fill="#D2DCED" opacity="0.7"/>

  <!-- Lower Teeth biting down slightly on the edge -->
  <path d="M 95 130 L 98 112 L 118 112 L 115 130 Z" fill="#EAEFF8"/>
  <path d="M 121 130 L 121 112 L 141 112 L 144 130 Z" fill="#EAEFF8"/>

  <!-- Focus/Action Accent: Small impact star/spark representing the pinch/bite -->
  <g transform="translate(132, 105)">
    <circle cx="0" cy="0" r="14" fill="#FFC542" opacity="0.2"/>
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#FFC542"/>
  </g>

  <!-- Accent frame / Focus ring around the entire subject -->
  <circle cx="120" cy="120" r="54" fill="none" stroke="#FFC542" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
</svg>