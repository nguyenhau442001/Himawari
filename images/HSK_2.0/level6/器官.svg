<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="heart-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <!-- Clip path for doctor's circular window/screen -->
    <clipPath id="screen-clip">
      <circle cx="120" cy="95" r="42" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background elements / medical clinic interior -->
  <path d="M0 170 H240 V240 H0 Z" fill="#090d16" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2" />
  
  <!-- Clinic Shelf with props -->
  <rect x="25" y="110" width="55" height="6" rx="3" fill="#475569" />
  <!-- Medical bottle prop -->
  <rect x="38" y="94" width="14" height="16" rx="3" fill="#38bdf8" opacity="0.8" />
  <rect x="42" y="90" width="6" height="4" fill="#cbd5e1" />
  <!-- Plant prop -->
  <circle cx="65" cy="102" r="8" fill="#10b981" />
  <path d="M65 110 V98" stroke="#059669" stroke-width="2" />

  <!-- Holographic / Educational Medical Display Screen (Representing the "Human Organ" context) -->
  <circle cx="120" cy="95" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="120" cy="95" r="44" fill="#0f172a" />
  
  <!-- Screen Glow -->
  <circle cx="120" cy="95" r="42" fill="url(#glow-grad)" />

  <!-- INSIDE THE SCREEN: The Heart (心脏 - Organ) & Body silhouette -->
  <g clip-path="url(#screen-clip)">
    <!-- Subtle Human Torso Silhouette -->
    <path d="M120 50 C105 50 95 65 95 85 C95 110 100 135 100 135 H140 C140 135 145 110 145 85 C145 65 135 50 120 50 Z" fill="#1e293b" opacity="0.6" />
    
    <!-- Heart Glow Effect -->
    <circle cx="120" cy="90" r="25" fill="url(#heart-glow)" />

    <!-- Detailed stylized anatomical Heart (The Vital Organ) -->
    <g transform="translate(120, 90) scale(1.1)">
      <!-- Arteries -->
      <path d="M-2 -16 C-2 -22 4 -24 8 -20 C10 -18 8 -14 6 -12" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
      <path d="M3 -14 C6 -18 12 -16 14 -12" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Main Heart Muscle Shape -->
      <path d="M 0 12 
               C -14 2, -22 -4, -22 -12 
               C -22 -18, -16 -22, -9 -18 
               C -4 -15, -1 -10, 0 -6 
               C 1 -10, 4 -15, 9 -18 
               C 16 -22, 22 -18, 22 -12 
               C 22 -4, 14 2, 0 12 Z" 
            fill="#fb7185" />
      <!-- Heart Highlight for 3D vector gloss -->
      <path d="M -10 -13 C -13 -15, -16 -11, -14 -8" fill="none" stroke="#ffe4e6" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Vital Pulse Line / EKG wave cutting across -->
    <path d="M78 115 H100 L106 100 L112 125 L120 80 L128 110 L134 95 H162" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- Screen Stand / Mount -->
  <path d="M120 139 V155" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <path d="M100 155 H140" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- Character: Curious Student / Patient looking at the organ display -->
  <!-- Character Body & Lab Coat / Casual Jacket -->
  <path d="M 120 180 
           C 100 180, 80 195, 75 220 
           H 165 
           C 160 195, 140 180, 120 180 Z" 
        fill="#334155" />
  <!-- Inner shirt -->
  <path d="M 120 185 L 110 220 H 130 Z" fill="#38bdf8" />
  
  <!-- Character Neck & Head -->
  <path d="M 112 170 H 128 V 185 H 112 Z" fill="#fcd34d" />
  <circle cx="120" cy="155" r="18" fill="#fcd34d" />
  
  <!-- Hair (Friendly, modern stylized) -->
  <path d="M 102 150 C 102 138, 110 135, 120 135 C 130 135, 138 138, 138 150 C 138 155, 136 158, 136 158 C 136 158, 130 142, 120 142 C 110 142, 104 158, 104 158 C 104 158, 102 155, 102 150 Z" fill="#1e293b" />

  <!-- Character Hands pointing or gesturing towards the heart organ display -->
  <circle cx="95" cy="185" r="7" fill="#fcd34d" />
  <path d="M 75 195 C 80 188, 90 185, 95 185" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- Foreground decorative elements: Medical clipboard / tablet on the desk -->
  <g transform="translate(170, 175) rotate(10)">
    <rect x="0" y="0" width="30" height="38" rx="4" fill="#e2e8f0" />
    <rect x="4" y="6" width="22" height="26" rx="2" fill="#ffffff" />
    <!-- Mock notes / graphs on clipboard -->
    <line x1="8" y1="11" x2="18" y2="11" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="17" x2="22" y2="17" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M 8 26 L 12 22 L 16 25 L 22 19" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Clip -->
    <rect x="10" y="-2" width="10" height="6" rx="2" fill="#64748b" />
  </g>

  <!-- Sparkles / Educational emphasis markers -->
  <g fill="#fbbf24">
    <circle cx="65" cy="65" r="2" opacity="0.8" />
    <circle cx="175" cy="60" r="3" opacity="0.6" />
    <circle cx="160" cy="130" r="2" opacity="0.9" />
  </g>
</svg>