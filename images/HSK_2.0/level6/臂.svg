    <!-- Sleeve -->
    <path d="M0 20 L80 20 L85 80 L5 80 Z" fill="#38bdf8"/>
    <!-- Skin -->
    <path d="M85 80 L140 100 L150 90 L100 60 Z" fill="#fcd34d"/>
    <path d="M85 80 L140 100 L135 115 L80 95 Z" fill="#fb923c"/>
    
