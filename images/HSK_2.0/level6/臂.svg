    <path d="M112 88 L122 92" stroke="#fbcfe8" stroke-width="1" stroke-linecap="round"/>
  </g>
  
  <!-- Props: Workbench items -->
  <rect x="40" y="190" width="30" height="10" rx="2" fill="#94a3b8"/>
  <circle cx="180" cy="200" r="12" fill="#64748b"/>
  <path d="M175 195 L185 205 M185 195 L175 205" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Ambient Lighting -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
</svg>