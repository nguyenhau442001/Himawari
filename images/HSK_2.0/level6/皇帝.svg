<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Throne Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Imperial Robe Red Gradient -->
    <linearGradient id="robe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Ambient Glow behind Throne -->
    <radialGradient id="throne-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#throne-glow)" />

  <!-- Palace Architecture & Columns -->
  <!-- Left Pillar -->
  <rect x="25" y="30" width="16" height="180" rx="4" fill="#334155" />
  <rect x="22" y="30" width="22" height="10" rx="2" fill="#475569" />
  <rect x="22" y="200" width="22" height="10" rx="2" fill="#475569" />

  <!-- Right Pillar -->
  <rect x="199" y="30" width="16" height="180" rx="4" fill="#334155" />
  <rect x="196" y="30" width="22" height="10" rx="2" fill="#475569" />
  <rect x="196" y="200" width="22" height="10" rx="2" fill="#475569" />

  <!-- Palace Floor & Steps -->
  <path d="M40 210 L200 210 L215 235 L25 235 Z" fill="#090d16" />
  <path d="M50 195 L190 195 L200 210 L40 210 Z" fill="#1e293b" />
  
  <!-- Majestic Folding Screen (Background) -->
  <path d="M60 65 L120 50 L180 65 L180 180 L60 180 Z" fill="#78350f" opacity="0.6"/>
  <path d="M75 70 L120 58 L165 70 L165 170 L75 170 Z" fill="#b45309" opacity="0.4"/>
  <!-- Decorative screen sun motif -->
  <circle cx="120" cy="110" r="22" fill="#f59e0b" opacity="0.2"/>

  <!-- Grand Throne -->
  <!-- Throne Back -->
  <path d="M90 60 L150 60 L160 170 L80 170 Z" fill="url(#gold-grad)" />
  <path d="M96 68 L144 68 L152 162 L88 162 Z" fill="#b45309" />
  <!-- Throne Top Arch -->
  <path d="M85 62 Q120 35 155 62 Z" fill="url(#gold-grad)" />

  <!-- Throne Seat & Armrests -->
  <rect x="75" y="150" width="90" height="15" rx="4" fill="url(#gold-grad)" />
  <rect x="70" y="130" width="14" height="40" rx="5" fill="url(#gold-grad)" />
  <rect x="156" y="130" width="14" height="40" rx="5" fill="url(#gold-grad)" />

  <!-- Emperor Character -->
  <!-- Imperial Robe Body -->
  <path d="M92 120 L148 120 L158 185 L82 185 Z" fill="url(#robe-grad)" />
  
  <!-- Robe Details (Jade/Gold Trims) -->
  <path d="M120 120 L120 185" stroke="#f59e0b" stroke-width="4" />
  <!-- Dragon embroidery hint on robe -->
  <circle cx="107" cy="155" r="8" fill="#fbbf24" opacity="0.8"/>
  <circle cx="133" cy="155" r="8" fill="#fbbf24" opacity="0.8"/>

  <!-- Shoulders / Arms -->
  <path d="M85 125 Q120 110 155 125 L158 140 L148 140 L120 130 L92 140 L82 140 Z" fill="#b91c1c" />

  <!-- Head & Face -->
  <circle cx="120" cy="98" r="18" fill="#fde68a" />
  <!-- Confident/Supreme Expression -->
  <path d="M110 95 Q115 92 120 95" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M120 95 Q125 92 130 95" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="115" cy="102" r="1.5" fill="#451a03" />
  <circle cx="125" cy="102" r="1.5" fill="#451a03" />
  <path d="M115 110 Q120 114 125 110" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Imperial Crown (Mianmian) -->
  <!-- Crown Base/Cap -->
  <rect x="104" y="74" width="32" height="10" rx="3" fill="#1e293b" />
  <!-- Crown Board (Flat top) -->
  <rect x="96" y="66" width="48" height="6" rx="2" fill="url(#gold-grad)" />
  <!-- Hanging Beads (Front Mian beads representing supreme authority) -->
  <line x1="102" y1="72" x2="102" y2="86" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="110" y1="72" x2="110" y2="86" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <line x1="120" y1="72" x2="120" y2="86" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <line x1="130" y1="72" x2="130" y2="86" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <line x1="138" y1="72" x2="138" y2="86" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Gestures: Commanding Hand (Right hand resting confidently on armrest) -->
  <circle cx="160" cy="148" r="6" fill="#fde68a" />

  <!-- Foreground Atmospheric Elements (Impression of vast power & height) -->
  <!-- Hanging Imperial Lantern (Left) -->
  <line x1="40" y1="30" x2="40" y2="60" stroke="#fbbf24" stroke-width="1.5" />
  <path d="M30 60 L50 60 L55 80 L45 88 L35 88 L25 80 Z" fill="#ef4444" />
  <path d="M30 60 L50 60 L55 80 L45 88 L35 88 L25 80 Z" stroke="#fbbf24" stroke-width="1.5" fill="none" />
  <circle cx="40" cy="74" r="5" fill="#f59e0b" />

  <!-- Hanging Imperial Lantern (Right) -->
  <line x1="200" y1="30" x2="200" y2="60" stroke="#fbbf24" stroke-width="1.5" />
  <path d="M190 60 L210 60 L215 80 L205 88 L195 88 L185 80 Z" fill="#ef4444" />
  <path d="M190 60 L210 60 L215 80 L205 88 L195 88 L185 80 Z" stroke="#fbbf24" stroke-width="1.5" fill="none" />
  <circle cx="200" cy="74" r="5" fill="#f59e0b" />

  <!-- Soft vignette framing the powerful scene -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>