<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Base -->
  <path d="M40 180 L200 180" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The "Past" (Left side) - Faded/Old style -->
  <g opacity="0.5">
    <path d="M60 180 L60 120 L90 120 L90 180" fill="#718096"/>
    <path d="M60 120 L75 100 L90 120" fill="#718096"/>
  </g>
  
  <!-- The "Present/Future" (Right side) - Vibrant/Active -->
  <g>
    <path d="M150 180 L150 100 L180 100 L180 180" fill="#F6AD55"/>
    <path d="M150 100 L165 80 L180 100" fill="#F6AD55"/>
  </g>
  
  <!-- The "Action" - Hand passing the flame/torch/legacy -->
  <g>
    <!-- Hand 1 (Giving) -->
    <path d="M80 130 C80 120 90 115 95 120 L105 130 L100 140 L85 140 Z" fill="#E2E8F0"/>
    <!-- Hand 2 (Receiving) -->
    <path d="M135 110 C135 100 145 95 150 100 L160 110 L155 120 L140 120 Z" fill="#E2E8F0"/>
    
    <!-- Motion/Connection Line -->
    <path d="M100 125 L145 105" stroke="#F6AD55" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>
    
    <!-- The "Legacy" object (A small sprout being passed) -->
    <circle cx="122" cy="115" r="8" fill="#68D391"/>
    <path d="M122 107 L122 102" stroke="#68D391" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Motion lines indicating continuation -->
  <path d="M185 90 Q200 70 215 90" stroke="#F6AD55" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M190 80 Q205 60 220 80" stroke="#F6AD55" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>