<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container with gradient background -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Floor -->
  <path d="M0 160 C60 140, 180 140, 240 160 L240 240 L0 240 Z" fill="#2d3a4b"/>

  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="160" fill="#253242"/>

  <!-- Window on back wall -->
  <rect x="160" y="40" width="60" height="80" rx="8" fill="#384a5e"/>
  <rect x="165" y="45" width="50" height="70" rx="6" fill="#1f2c3d"/> <!-- Inner glass -->
  <circle cx="190" cy="80" r="20" fill="#38bdf8" opacity="0.08"/> <!-- Subtle light glow -->

  <!-- Clock on back wall -->
  <circle cx="50" cy="60" r="18" fill="#384a5e"/>
  <circle cx="50" cy="60" r="15" fill="#1f2c3d"/>
  <path d="M50 50 L50 60 L58 60 Z" fill="#fbbf24"/> <!-- Hour hand -->
  <path d="M50 45 L50 60 L55 60 Z" fill="#fbbf24"/> <!-- Minute hand -->

  <!-- Teacher character -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="20" height="50" rx="8" fill="#38bdf8"/> <!-- Body -->
    <circle cx="10" cy="-5" r="12" fill="#fbbf24"/> <!-- Head -->
    <circle cx="6" cy="-8" r="2" fill="#1f2c3d"/> <!-- Eye 1 -->
    <circle cx="14" cy="-8" r="2" fill="#1f2c3d"/> <!-- Eye 2 -->
    <path d="M8 0 C8 2, 12 2, 12 0" stroke="#1f2c3d" stroke-width="1" fill="none"/> <!-- Mouth -->
    <rect x="-5" y="10" width="30" height="10" rx="4" fill="#38bdf8"/> <!-- Arms -->
    <rect x="5" y="50" width="10" height="15" rx="4" fill="#1f2c3d"/> <!-- Legs -->
  </g>

  <!-- Student 1 (foreground, left) -->
  <g transform="translate(40, 140)">
    <!-- Desk -->
    <rect x="-20" y="0" width="60" height="25" rx="6" fill="#4a5c73"/>
    <rect x="-15" y="25" width="50" height="10" rx="4" fill="#384a5e"/> <!-- Desk support -->
    <!-- Paper on desk -->
    <rect x="-10" y="5" width="40" height="20" rx="3" fill="#e0e7ef"/>
    <!-- Character -->
    <g transform="translate(10, -30)">
      <rect x="-15" y="0" width="30" height="40" rx="8" fill="#10b981"/> <!-- Body -->
      <circle cx="0" cy="-10" r="15" fill="#fbbf24"/> <!-- Head -->
      <circle cx="-5" cy="-15" r="3" fill="#1f2c3d"/> <!-- Eye 1 -->
      <circle cx="5" cy="-15" r="3" fill="#1f2c3d"/> <!-- Eye 2 -->
      <path d="M-5 -5 C-3 -3, 3 -3, 5 -5" stroke="#1f2c3d" stroke-width="1" fill="none"/> <!-- Mouth (focused) -->
      <!-- Arms and Hand -->
      <rect x="-20" y="10" width="15" height="8" rx="3" fill="#10b981" transform="rotate(-15 -12.5 14)"/> <!-- Left arm -->
      <rect x="5" y="10" width="15" height="8" rx="3" fill="#10b981" transform="rotate(15 12.5 14)"/> <!-- Right arm -->
      <circle cx="15" cy="18" r="5" fill="#fbbf24"/> <!-- Right hand -->
      <!-- Pencil -->
      <rect x="17" y="15" width="3" height="15" rx="1" fill="#fb923c" transform="rotate(20 18.5 22.5)"/>
      <path d="M18.5 15 L18.5 10 L20 15 Z" fill="#1f2c3d" transform="rotate(20 18.5 22.5)"/>

      <rect x="-10" y="40" width="10" height="15" rx="4" fill="#1f2c3d"/> <!-- Legs -->
      <rect x="10" y="40" width="10" height="15" rx="4" fill="#1f2c3d"/> <!-- Legs -->
    </g>
  </g>

  <!-- Student 2 (midground, right) -->
  <g transform="translate(160, 130)">
    <!-- Desk -->
    <rect x="-20" y="0" width="60" height="25" rx="6" fill="#4a5c73"/>
    <rect x="-15" y="25" width="50" height="10" rx="4" fill="#384a5e"/> <!-- Desk support -->
    <!-- Paper on desk -->
    <rect x="-10" y="5" width="40" height="20" rx="3" fill="#e0e7ef"/>
    <!-- Character -->
    <g transform="translate(10, -30)">
      <rect x="-15" y="0" width="30" height="40" rx="8" fill="#ec4899"/> <!-- Body -->
      <circle cx="0" cy="-10" r="15" fill="#fbbf24"/> <!-- Head -->
      <circle cx="-5" cy="-15" r="3" fill="#1f2c3d"/> <!-- Eye 1 -->
      <circle cx="5" cy="-15" r="3" fill="#1f2c3d"/> <!-- Eye 2 -->
      <path d="M-5 -5 C-3 -7, 3 -7, 5 -5" stroke="#1f2c3d" stroke-width="1" fill="none"/> <!-- Mouth (thinking) -->
      <!-- Arms and Hand -->
      <rect x="-20" y="10" width="15" height="8" rx="3" fill="#ec4899" transform="rotate(-15 -12.5 14)"/> <!-- Left arm -->
      <rect x="5" y="10" width="15" height="8" rx="3" fill="#ec4899" transform="rotate(15 12.5 14)"/> <!-- Right arm -->
      <circle cx="15" cy="18" r="5" fill="#fbbf24"/> <!-- Right hand -->
      <!-- Pencil -->
      <rect x="17" y="15" width="3" height="15" rx="1" fill="#fb923c" transform="rotate(20 18.5 22.5)"/>
      <path d="M18.5 15 L18.5 10 L20 15 Z" fill="#1f2c3d" transform="rotate(20 18.5 22.5)"/>

      <rect x="-10" y="40" width="10" height="15" rx="4" fill="#1f2c3d"/> <!-- Legs -->
      <rect x="10" y="40" width="10" height="15" rx="4" fill="#1f2c3d"/> <!-- Legs -->
    </g>
  </g>

  <!-- Student 3 (background, center) - slightly smaller to show depth -->
  <g transform="translate(100, 110) scale(0.8)">
    <!-- Desk -->
    <rect x="-20" y="0" width="60" height="25" rx="6" fill="#4a5c73"/>
    <rect x="-15" y="25" width="50" height="10" rx="4" fill="#384a5e"/> <!-- Desk support -->
    <!-- Paper on desk -->
    <rect x="-10" y="5" width="40" height="20" rx="3" fill="#e0e7ef"/>
    <!-- Character -->
    <g transform="translate(10, -30)">
      <rect x="-15" y="0" width="30" height="40" rx="8" fill="#38bdf8"/> <!-- Body -->
      <circle cx="0" cy="-10" r="15" fill="#fbbf24"/> <!-- Head -->
      <circle cx="-5" cy="-15" r="3" fill="#1f2c3d"/> <!-- Eye 1 -->
      <circle cx="5" cy="-15" r="3" fill="#1f2c3d"/> <!-- Eye 2 -->
      <path d="M-5 -5 C-3 -3, 3 -3, 5 -5" stroke="#1f2c3d" stroke-width="1" fill="none"/> <!-- Mouth (focused) -->
      <!-- Arms and Hand -->
      <rect x="-20" y="10" width="15" height="8" rx="3" fill="#38bdf8" transform="rotate(-15 -12.5 14)"/> <!-- Left arm -->
      <rect x="5" y="10" width="15" height="8" rx="3" fill="#38bdf8" transform="rotate(15 12.5 14)"/> <!-- Right arm -->
      <circle cx="15" cy="18" r="5" fill="#fbbf24"/> <!-- Right hand -->
      <!-- Pencil -->
      <rect x="17" y="15" width="3" height="15" rx="1" fill="#fb923c" transform="rotate(20 18.5 22.5)"/>
      <path d="M18.5 15 L18.5 10 L20 15 Z" fill="#1f2c3d" transform="rotate(20 18.5 22.5)"/>

      <rect x="-10" y="40" width="10" height="15" rx="4" fill="#1f2c3d"/> <!-- Legs -->
      <rect x="10" y="40" width="10" height="15" rx="4" fill="#1f2c3d"/> <!-- Legs -->
    </g>
  </g>

  <!-- Add some subtle light reflection on the floor from the window -->
  <path d="M160 160 L180 140 L220 140 L240 160 Z" fill="#38bdf8" opacity="0.05"/>

</svg>