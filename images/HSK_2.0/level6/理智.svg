<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- Character: The person trying to stay calm -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 120 Q-40 80 0 80 Q40 80 40 120" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="40" r="30" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-30 35 Q-30 10 0 10 Q30 10 30 35 Q30 20 0 20 Z" fill="#475569"/>
    <!-- Eyes (Closed, focused) -->
    <path d="M-15 40 L-5 40 M5 40 L15 40" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth (Determined line) -->
    <path d="M-10 55 L10 55" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Hands on head -->
    <circle cx="-35" cy="50" r="8" fill="#fde68a"/>
    <circle cx="35" cy="50" r="8" fill="#fde68a"/>
  </g>

  <!-- Contextual Props: Stressful situation vs Calm -->
  <!-- Scattered papers -->
  <rect x="40" y="170" width="30" height="40" fill="#e2e8f0" transform="rotate(-10 55 190)"/>
  <rect x="170" y="175" width="30" height="40" fill="#e2e8f0" transform="rotate(15 185 195)"/>
  
  <!-- The "Reason" light: A warm lamp glowing -->
  <circle cx="120" cy="10" r="60" fill="#f59e0b" opacity="0.1"/>
  <path d="M110 20 L130 20 L125 60 L115 60 Z" fill="#fbbf24"/>
  <rect x="115" y="60" width="10" height="10" fill="#fb923c"/>
  
  <!-- Cooling blue accent for "Rationality" -->
  <circle cx="180" cy="60" r="15" fill="#38bdf8" opacity="0.6"/>
  <path d="M175 55 L185 65 M185 55 L175 65" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Coffee mug (Steam) -->
  <rect x="30" y="190" width="20" height="25" fill="#94a3b8" rx="2"/>
  <path d="M35 185 Q40 175 35 170" stroke="#cbd5e1" stroke-width="2" fill="none"/>
</svg>