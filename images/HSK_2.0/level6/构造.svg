<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing a high-tech workshop environment -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Workshop background details -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="30" width="40" height="50" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="50" cy="55" r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <path d="M50 43 L50 67 M38 55 L62 55" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Desk Surface -->
  <path d="M10 180 L230 180 L220 220 L20 220 Z" fill="url(#desk)" filter="url(#shadow)"/>
  <rect x="20" y="176" width="200" height="6" rx="3" fill="#475569"/>

  <!-- Complex Machine / Mechanism (构造 - construction/structure) -->
  <g transform="translate(100, 110)">
    <!-- Machine Base Shadow -->
    <ellipse cx="20" cy="65" rx="45" ry="10" fill="#000000" opacity="0.4"/>

    <!-- Main Chassis & Inner Complex Structure -->
    <rect x="-15" y="15" width="70" height="50" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
    
    <!-- Transparent view showing complex gears and internal wiring -->
    <rect x="-5" y="25" width="50" height="30" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    
    <!-- Complex Gears (Interlocking) -->
    <circle cx="8" cy="40" r="10" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 2"/>
    <circle cx="8" cy="40" r="4" fill="#fbbf24"/>

    <circle cx="32" cy="35" r="8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="3 2"/>
    <circle cx="32" cy="35" r="3" fill="#34d399"/>

    <circle cx="22" cy="50" r="6" fill="none" stroke="#ec4899" stroke-width="2"/>

    <!-- Connecting Wires & Tubes -->
    <path d="M-15 30 C-25 30 -25 10 -40 10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M55 40 C65 40 65 20 80 20" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Holographic projection beam indicating complexity -->
    <path d="M15 15 L-10 -20 L40 -20 L25 15 Z" fill="url(#glow)"/>
    <circle cx="15" cy="-20" r="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="15" cy="-20" r="4" fill="#38bdf8"/>

    <!-- Upper mechanical arm / sensor -->
    <rect x="5" y="-5" width="20" height="20" rx="3" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="15" y1="-5" x2="15" y2="-12" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- Character: Engineer inspecting closely with a magnifying tool/gesture -->
  <!-- Character Body & Lab Coat -->
  <g transform="translate(35, 105)">
    <!-- Body -->
    <path d="M15 80 L35 45 L65 45 L85 80 Z" fill="#e2e8f0" filter="url(#shadow)"/>
    <!-- Lab coat lapels -->
    <path d="M40 45 L50 70 L60 45" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="50" cy="55" r="2" fill="#94a3b8"/>
    <circle cx="50" cy="65" r="2" fill="#94a3b8"/>

    <!-- Head & Hair -->
    <circle cx="50" cy="22" r="16" fill="#fbcfe8"/>
    <path d="M34 22 C34 10 44 6 54 8 C64 10 66 18 66 24 C50 26 40 24 34 22 Z" fill="#475569"/>
    
    <!-- Expressive Face (Focused, thoughtful brow) -->
    <line x1="42" y1="18" x2="48" y2="20" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="23" r="2.5" fill="#1e293b"/>
    <path d="M52 26 C54 27 56 27 58 26" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Magnifying Glass held by character -->
    <g transform="translate(65, 35) rotate(-15)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
      <circle cx="0" cy="0" r="13" fill="#38bdf8" fill-opacity="0.15"/>
      <line x1="10" y1="10" x2="22" y2="22" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Arm reaching out -->
    <path d="M65 50 L75 42" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Floating UI / Blueprint Elements (Indicating complexity without text) -->
  <g transform="translate(160, 45)" opacity="0.8">
    <rect x="0" y="0" width="45" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="6" y1="8" x2="25" y2="8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="16" x2="35" y2="16" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="22" x2="20" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="36" cy="22" r="3" fill="#10b981"/>
  </g>
  
  <path d="M150 77 L160 77" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M155 70 L160 77 L155 84" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
</svg>