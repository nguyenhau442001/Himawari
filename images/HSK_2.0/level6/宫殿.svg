<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Golden Palace Roof Gradient -->
    <linearGradient id="goldRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pillar/Wall Gradient -->
    <linearGradient id="redWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Warm Glow for Majestic Vibe -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Glow -->
  <circle cx="120" cy="100" r="100" fill="url(#sunGlow)"/>

  <!-- Distant Mountains/Clouds for Scale -->
  <path d="M0 170 Q40 150 80 165 T160 160 T240 170 L240 240 L0 240 Z" fill="#1e293b" opacity="0.6"/>

  <!-- 宫殿 (Grand Palace Architecture) -->
  <!-- Base Terrace (White Marble Style) -->
  <rect x="30" y="160" width="180" height="20" fill="#cbd5e1" rx="2"/>
  <rect x="40" y="150" width="160" height="10" fill="#e2e8f0" rx="1"/>
  <!-- Terrace Railings -->
  <path d="M40 150 L40 142 M60 150 L60 142 M80 150 L80 142 M100 150 L100 142 M120 150 L120 142 M140 150 L140 142 M160 150 L160 142 M180 150 L180 142 M200 150 L200 142" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <rect x="35" y="142" width="170" height="4" fill="#94a3b8" rx="1"/>

  <!-- Palace Main Hall Structure (Red Walls) -->
  <rect x="55" y="90" width="130" height="60" fill="url(#redWall)"/>

  <!-- Golden Pillars -->
  <rect x="65" y="90" width="8" height="60" fill="#f59e0b"/>
  <rect x="95" y="90" width="8" height="60" fill="#f59e0b"/>
  <rect x="137" y="90" width="8" height="60" fill="#f59e0b"/>
  <rect x="167" y="90" width="8" height="60" fill="#f59e0b"/>

  <!-- Grand Palace Doors & Windows -->
  <rect x="107" y="105" width="26" height="45" fill="#450a0a" rx="13"/>
  <rect x="77" y="105" width="16" height="25" fill="#fef08a" opacity="0.3" rx="2"/>
  <rect x="147" y="105" width="16" height="25" fill="#fef08a" opacity="0.3" rx="2"/>

  <!-- Lower Roof -->
  <path d="M45 90 Q120 75 195 90 L205 105 L35 105 Z" fill="url(#goldRoof)"/>
  <!-- Lower Roof Ridge Line -->
  <path d="M50 90 Q120 77 190 90" stroke="#fef08a" stroke-width="2" fill="none"/>

  <!-- Upper Roof (Double Eaves traditional style) -->
  <path d="M65 60 Q120 45 175 60 L185 75 L55 75 Z" fill="url(#goldRoof)"/>
  <path d="M70 60 Q120 48 170 60" stroke="#fef08a" stroke-width="2" fill="none"/>

  <!-- Roof Ridge Decorations / Ornaments -->
  <path d="M120 30 L120 45" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="28" r="4" fill="#fef08a"/>

  <!-- Real-world Human Context: Tourists / Visitors admiring the majestic palace -->
  <!-- Character 1 (Tourist pointing in awe) -->
  <g transform="translate(75, 175)">
    <!-- Body -->
    <path d="M12 25 L18 45 L8 45 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="15" cy="15" r="7" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M8 13 Q15 6 22 13 L20 16 L10 16 Z" fill="#334155"/>
    <!-- Arm pointing up and out -->
    <path d="M15 22 Q25 15 30 10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="12" y1="45" x2="10" y2="60" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="45" x2="18" y2="60" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Tourist taking photo / holding camera) -->
  <g transform="translate(140, 178)">
    <!-- Body -->
    <path d="M10 22 L15 45 L5 45 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="12" cy="13" r="6" fill="#fed7aa"/>
    <!-- Hair bun -->
    <circle cx="12" cy="5" r="3" fill="#451a03"/>
    <!-- Arms holding camera -->
    <rect x="10" y="18" width="12" height="7" rx="2" fill="#94a3b8"/>
    <!-- Legs -->
    <line x1="9" y1="45" x2="7" y2="57" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="13" y1="45" x2="15" y2="57" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Elements (Lanterns for cultural depth) -->
  <g transform="translate(50, 125)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="0" cy="20" rx="6" ry="8" fill="#ef4444"/>
    <path d="M-4 27 L4 27" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <g transform="translate(190, 125)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="0" cy="20" rx="6" ry="8" fill="#ef4444"/>
    <path d="M-4 27 L4 27" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Sparkles/Stars for grand magical ambiance -->
  <path d="M40 50 L42 55 L47 57 L42 59 L40 64 L38 59 L33 57 L38 55 Z" fill="#fef08a" opacity="0.8"/>
  <path d="M200 40 L201 43 L204 44 L201 45 L200 48 L199 45 L196 44 L199 43 Z" fill="#fef08a" opacity="0.6"/>
  <path d="M100 35 L101 37 L103 38 L101 39 L100 41 L99 39 L97 38 L99 37 Z" fill="#fef08a" opacity="0.9"/>
</svg>