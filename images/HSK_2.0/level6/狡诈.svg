<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Shady Green Screen Glow / Monitor Light -->
    <linearGradient id="monitorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / OFFICE BACKGROUND -->
  <!-- Wallpaper Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="240" y2="60"/>
    <line x1="0" y1="110" x2="240" y2="110"/>
  </g>

  <!-- Bookshelf Background Props -->
  <rect x="25" y="35" width="45" height="75" rx="4" fill="#1b263b" stroke="#334155" stroke-width="1.5"/>
  <rect x="32" y="45" width="8" height="50" rx="2" fill="#38bdf8" opacity="0.4"/>
  <rect x="42" y="48" width="10" height="47" rx="2" fill="#fbbf24" opacity="0.4"/>
  <rect x="54" y="42" width="8" height="53" rx="2" fill="#ec4899" opacity="0.4"/>
  
  <!-- Desk Lamp -->
  <path d="M 195 130 L 210 110 L 225 130 Z" fill="#64748b"/>
  <path d="M 210 110 L 210 80 L 180 60" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="180" cy="60" r="12" fill="#fbbf24"/>
  <!-- Lamp Light Cone -->
  <polygon points="180,60 130,165 210,165" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- DESK SURFACE -->
  <path d="M 10 165 L 230 165 L 240 215 L 0 215 Z" fill="url(#deskGrad)" filter="url(#softShadow)"/>
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>

  <!-- CONTEXT PROPS ON DESK -->
  <!-- Financial Chart / Document (The "Scheme") -->
  <g transform="translate(35, 145) rotate(-8)">
    <rect x="0" y="0" width="50" height="40" rx="2" fill="#f8fafc" filter="url(#softShadow)"/>
    <path d="M 8 28 L 18 18 L 28 22 L 42 10" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="42" cy="10" r="4" fill="#ef4444"/>
    <line x1="8" y1="10" x2="25" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="14" x2="20" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Laptop showing hidden/shady data -->
  <g transform="translate(130, 135)">
    <!-- Laptop Base -->
    <path d="M -15 35 L 55 35 L 65 45 L -25 45 Z" fill="#475569"/>
    <rect x="-10" y="38" width="55" height="4" rx="2" fill="#334155"/>
    <!-- Laptop Screen -->
    <rect x="-5" y="-5" width="50" height="40" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="40" height="30" fill="url(#monitorGlow)"/>
    <!-- Fake code/data lines -->
    <line x1="4" y1="6" x2="24" y2="6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="12" x2="32" y2="12" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="16" y2="18" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="195" y="145" width="18" height="22" rx="3" fill="#cbd5e1"/>
  <path d="M 213 150 C 220 150, 220 162, 213 164" stroke="#cbd5e1" stroke-width="3" fill="none"/>

  <!-- MAIN CHARACTER: THE "CUNNING" SCHEMER -->
  <g transform="translate(85, 80)">
    <!-- Body / Suit -->
    <path d="M 20 85 L 50 85 L 65 135 L 5 135 Z" fill="#1e293b"/>
    <!-- Shirt Collar -->
    <path d="M 25 85 L 35 100 L 45 85 Z" fill="#f8fafc"/>
    <!-- Red Tie -->
    <polygon points="33,95 37,95 39,125 35,130 31,125" fill="#ef4444" filter="url(#softShadow)"/>

    <!-- Head / Neck -->
    <rect x="27" y="65" width="18" height="25" fill="#fbcfe8" rx="4"/>
    <circle cx="35" cy="55" r="22" fill="#fed7aa" filter="url(#softShadow)"/>

    <!-- Sly Hair Style (slicked back / sharp angles) -->
    <path d="M 13 52 C 15 35, 30 32, 52 40 C 55 41, 57 43, 55 46 C 48 44, 38 42, 25 48 C 20 50, 16 52, 13 52 Z" fill="#0f172a"/>

    <!-- Cunning Facial Expression -->
    <!-- Smirking/Scheming Eyes (Slanted, calculating) -->
    <!-- Left Eye (winking/narrowed) -->
    <path d="M 23 52 Q 28 48 33 53" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Right Eye (narrowed with smirk) -->
    <path d="M 40 51 Q 45 47 50 50" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Eyebrows (Arched, plotting) -->
    <path d="M 22 47 Q 28 42 34 48" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 39 46 Q 45 40 51 43" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Smirk Smile (Asymmetrical, sly grin showing cleverness) -->
    <path d="M 30 65 Q 40 60 48 66" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 46 64 L 49 67" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>

    <!-- Hand Steepling / Rubbing Together (Classic "Cunning/Evil Plot" pose) -->
    <!-- Left Arm & Hand -->
    <path d="M 15 110 C 15 95, 25 90, 30 100" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="100" r="6" fill="#fed7aa"/>

    <!-- Right Arm & Hand (Fingers rubbing together greedily/slyly) -->
    <path d="M 55 110 C 55 95, 45 90, 38 100" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="100" r="6" fill="#fed7aa"/>

    <!-- Dramatic Backlighting / Rim Light on Character -->
    <path d="M 13 52 C 15 35, 30 32, 52 40 C 57 43, 57 46, 55 46" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Foreground Atmospheric Elements (Subtle mystery particles/glow) -->
  <circle cx="70" cy="100" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="150" cy="80" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="110" cy="60" r="2.5" fill="#fbbf24" opacity="0.5"/>
</svg>