<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Stage Floor -->
  <rect x="20" y="180" width="200" height="20" rx="2" fill="#334155"/>
  <rect x="30" y="200" width="180" height="10" rx="2" fill="#1e293b"/>
  
  <!-- Stage Lights -->
  <circle cx="60" cy="20" r="15" fill="#f59e0b" opacity="0.2"/>
  <circle cx="180" cy="20" r="15" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Magician -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-20 0 L20 0 L15 -60 L-15 -60 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Head -->
    <circle cx="0" cy="-75" r="15" fill="#fde68a"/>
    <!-- Hat -->
    <rect x="-18" y="-95" width="36" height="10" fill="#0f172a"/>
    <rect x="-10" y="-115" width="20" height="20" fill="#0f172a"/>
    <!-- Cape -->
    <path d="M-15 -50 L-40 -20 L-15 -10 Z" fill="#ec4899"/>
    <path d="M15 -50 L40 -20 L15 -10 Z" fill="#ec4899"/>
  </g>
  
  <!-- Magic Trick: Floating Cards -->
  <g transform="translate(160, 100)">
    <rect x="0" y="0" width="20" height="30" rx="2" fill="#ffffff" transform="rotate(15)"/>
    <rect x="-10" y="-10" width="20" height="30" rx="2" fill="#fb923c" transform="rotate(-10)"/>
    <rect x="5" y="-20" width="20" height="30" rx="2" fill="#10b981" transform="rotate(5)"/>
  </g>
  
  <!-- Magic Sparkles -->
  <circle cx="170" cy="80" r="2" fill="#f59e0b"/>
  <circle cx="150" cy="70" r="3" fill="#fbbf24"/>
  <circle cx="185" cy="90" r="2" fill="#f59e0b"/>
  
  <!-- Curtain -->
  <path d="M0 0 L0 240 L40 240 L40 0 Z" fill="#312e81" opacity="0.4"/>
  <path d="M200 0 L200 240 L240 240 L240 0 Z" fill="#312e81" opacity="0.4"/>
</svg>