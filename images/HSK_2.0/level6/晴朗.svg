<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient for "Qinglang" (Clear/Bright Weather) -->
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Frame Gradient -->
    <linearGradient id="wood-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE: Indoor cozy room looking out at a bright, clear day (晴朗 - Qīnglǎng) -->
  
  <!-- Window Outer Frame / Wall Cutout -->
  <rect x="24" y="24" width="192" height="156" rx="16" fill="#0f172a" stroke="#334155" stroke-width="4"/>

  <!-- Outdoor Sky View (Bright & Clear) -->
  <g clip-path="url(#window-clip)">
    <clipPath id="window-clip">
      <rect x="28" y="28" width="184" height="148" rx="12"/>
    </clipPath>
    
    <!-- Clear Blue Sky -->
    <rect x="28" y="28" width="184" height="148" fill="url(#sky-grad)"/>

    <!-- Radiant Sun (Signifying 'Qinglang' / Clear Weather) -->
    <circle cx="160" cy="70" r="50" fill="url(#sun-glow)"/>
    <circle cx="160" cy="70" r="18" fill="#fef08a"/>

    <!-- Distant Soft Hills / Horizon -->
    <path d="M 28 140 Q 70 120 120 135 T 212 125 L 212 176 L 28 176 Z" fill="#60a5fa" opacity="0.4"/>
    <path d="M 28 150 Q 90 130 150 145 T 212 140 L 212 176 L 28 176 Z" fill="#3b82f6" opacity="0.3"/>

    <!-- Fluffy Minimalist White Clouds (Very sparser, highlighting clear sky) -->
    <path d="M 50 65 Q 55 55 68 58 Q 78 50 90 60 Q 102 60 100 72 Q 80 75 50 65 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Window Pane Inner Dividers (Cross grid) -->
  <rect x="28" y="28" width="184" height="148" rx="12" fill="none" stroke="#1e293b" stroke-width="6"/>
  <!-- Cross Bars -->
  <line x1="120" y1="28" x2="120" y2="176" stroke="#1e293b" stroke-width="6"/>
  <line x1="28" y1="102" x2="212" y2="102" stroke="#1e293b" stroke-width="6"/>

  <!-- Window Sill -->
  <rect x="20" y="172" width="200" height="12" rx="4" fill="#475569"/>
  <rect x="24" y="184" width="192" height="4" rx="2" fill="#334155"/>

  <!-- Indoor Environment / Foreground Props -->
  
  <!-- Potted Plant on Sill (Adds life and contrast to the clear day) -->
  <g transform="translate(170, 140)">
    <!-- Pot -->
    <path d="M 4 20 L 16 36 L 28 20 Z" fill="#f43f5e"/>
    <ellipse cx="16" cy="20" rx="12" ry="4" fill="#fb7185"/>
    <!-- Stems & Leaves -->
    <path d="M 16 20 Q 10 5 2 -2" fill="none" stroke="url(#leaf-grad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 16 20 Q 22 2 30 -4" fill="none" stroke="url(#leaf-grad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 16 20 Q 18 2 16 -8" fill="none" stroke="url(#leaf-grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Leaf Shapes -->
    <circle cx="2" cy="-3" r="5" fill="#34d399"/>
    <circle cx="30" cy="-5" r="5" fill="#10b981"/>
    <circle cx="16" cy="-9" r="6" fill="#34d399"/>
  </g>

  <!-- Character: Happy Person enjoying the clear weather -->
  <g transform="translate(50, 115)">
    <!-- Character Body / Hoodie -->
    <path d="M 15 65 C 15 48 30 45 45 45 C 60 45 75 48 75 65 L 85 85 L 5 85 Z" fill="#38bdf8"/>
    <path d="M 45 45 L 45 65" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Neck -->
    <rect x="38" y="37" width="14" height="10" fill="#fbcfe8" rx="4"/>

    <!-- Head & Face -->
    <circle cx="45" cy="28" r="18" fill="#fbcfe8"/>
    
    <!-- Hair (Stylish Dark Bob) -->
    <path d="M 27 28 C 27 15 35 12 45 12 C 55 12 63 15 63 28 C 63 32 60 38 58 38 C 55 38 53 30 45 30 C 37 30 35 38 32 38 C 30 38 27 32 27 28 Z" fill="#1e293b"/>

    <!-- Cheeks (Blush of happiness) -->
    <circle cx="36" cy="32" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="54" cy="32" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Happy Closed Eyes (Joyful expression) -->
    <path d="M 36 24 Q 39 27 42 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 48 24 Q 51 27 54 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Big Smile -->
    <path d="M 40 33 Q 45 38 50 33" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms resting on windowsill, expressing cheerful relaxation -->
    <path d="M 18 55 Q 5 58 2 68" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="2" cy="68" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Coffee Mug on Desk (Context prop) -->
  <g transform="translate(115, 162)">
    <rect x="0" y="4" width="14" height="14" rx="3" fill="#fb923c"/>
    <path d="M 14 7 C 18 7 18 13 14 13" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam indicating warmth -->
    <path d="M 4 0 Q 6 -3 4 -6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 9 -1 Q 11 -4 9 -7" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

</svg>