<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Interior Room Context -->
  <!-- Floor -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Wall baseboard -->
  <rect x="0" y="185" width="240" height="5" fill="#334155"/>

  <!-- Window Frame showing Typhoon Transition (Strong to Weak) -->
  <g transform="translate(130, 40)">
    <rect x="0" y="0" width="80" height="120" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#64748b" stroke-width="3"/>
    <!-- Window pane grid -->
    <line x1="40" y1="0" x2="40" y2="120" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="60" x2="80" y2="60" stroke="#64748b" stroke-width="2"/>

    <!-- Outside: Fading storm elements (Typhoon weakening) -->
    <!-- Heavy bent tree on left side of window -->
    <path d="M 20 120 Q 15 90 25 60 Q 30 45 20 30" stroke="#047857" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Gentle swaying leaves (storm calming down) -->
    <path d="M 20 30 Q 10 25 15 20" stroke="#10b981" stroke-width="3" fill="none"/>
    <path d="M 20 30 Q 35 22 28 15" stroke="#10b981" stroke-width="3" fill="none"/>

    <!-- Calming sky outside window (Golden hour breaking through clouds) -->
    <path d="M 0 0 L 80 0 L 80 60 L 0 60 Z" fill="url(#windowGlow)"/>
    <!-- Soft clearing sun ray -->
    <polygon points="40,0 80,0 80,80" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- Weather Dashboard / Monitor on desk showing declining wind speed graph -->
  <g transform="translate(135, 115)">
    <rect x="0" y="0" width="70" height="45" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Screen content: Decreasing wave/line chart -->
    <path d="M 8 35 Q 20 10 35 25 T 62 32" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Downward trend arrow indicating 'weakening' -->
    <path d="M 45 15 L 55 15 L 50 22 Z" fill="#38bdf8"/>
  </g>

  <!-- Desk Surface -->
  <rect x="120" y="160" width="100" height="10" rx="2" fill="#475569"/>
  <!-- Coffee mug on desk -->
  <rect x="135" y="140" width="12" height="20" rx="2" fill="#ec4899"/>
  <path d="M 147 145 C 153 145 153 155 147 155" fill="none" stroke="#ec4899" stroke-width="2"/>

  <!-- Main Human Character: Relieved person watching the storm subside -->
  <!-- Character Body / Torso -->
  <path d="M 50 190 Q 50 150 70 135 L 95 135 Q 115 150 115 190 Z" fill="#38bdf8"/>

  <!-- Character Neck & Head -->
  <rect x="72" y="112" width="16" height="25" rx="6" fill="#fed7aa"/>
  <circle cx="80" cy="100" r="22" fill="#fed7aa"/>

  <!-- Hair (Stylized clean vector hair) -->
  <path d="M 60 95 Q 75 75 95 95 Q 102 95 100 85 Q 80 70 60 85 Z" fill="#1e293b"/>

  <!-- Facial expression: Relieved, calm smile -->
  <!-- Closed happy eyes -->
  <path d="M 70 98 Q 74 102 78 98" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 82 98 Q 86 102 90 98" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gentle relaxed smile -->
  <path d="M 76 110 Q 80 114 84 110" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Character Arms gesturing relief (hands leaning on table / near chest) -->
  <path d="M 55 155 Q 65 170 80 165" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="80" cy="165" r="6" fill="#fed7aa"/>

  <!-- Foreground details: Cozy home elements -->
  <!-- Warm reading lamp casting soft light on the scene -->
  <path d="M 25 190 L 25 110 L 35 110 L 35 190 Z" fill="#64748b"/>
  <path d="M 15 110 L 45 110 L 38 95 L 22 95 Z" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Ambient light glow overlay for atmosphere -->
  <circle cx="80" cy="100" r="120" fill="#38bdf8" opacity="0.04" pointer-events="none"/>
</svg>