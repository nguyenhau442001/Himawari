<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="deskGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Blue Laser/Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)" />

  <!-- Background Environment: Studio Wall & Architecture -->
  <!-- Ambient background shelf & plants -->
  <path d="M 30 70 L 90 70 L 90 73 L 30 73 Z" fill="#334155" opacity="0.6" />
  <circle cx="50" cy="58" r="10" fill="#10b981" opacity="0.8" />
  <path d="M 45 68 Q 50 55 55 68 Z" fill="#64748b" />
  <circle cx="70" cy="62" r="8" fill="#f43f5e" opacity="0.8" />
  <path d="M 67 68 Q 70 58 73 68 Z" fill="#64748b" />

  <!-- Large Draftsman's Window showing night city -->
  <path d="M 150 20 L 210 20 L 210 110 L 150 110 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  <!-- City lights through window -->
  <rect x="158" y="40" width="10" height="25" fill="#f59e0b" opacity="0.3" rx="2" />
  <rect x="174" y="30" width="12" height="40" fill="#38bdf8" opacity="0.2" rx="2" />
  <rect x="192" y="50" width="10" height="35" fill="#f43f5e" opacity="0.25" rx="2" />
  <line x1="150" y1="65" x2="210" y2="65" stroke="#334155" stroke-width="2" />
  <line x1="180" y1="20" x2="180" y2="110" stroke="#334155" stroke-width="2" />

  <!-- Hanging Pendant Lamp -->
  <path d="M 120 0 L 120 35" stroke="#64748b" stroke-width="2" />
  <path d="M 105 35 L 135 35 L 142 45 L 98 45 Z" fill="#f59e0b" />
  <path d="M 100 45 L 140 45 L 150 48 L 90 48 Z" fill="#fbbf24" />
  <!-- Light Cone -->
  <polygon points="120,48 20,200 220,200" fill="#f59e0b" opacity="0.06" />

  <!-- Architect's Drawing Board / Desk Surface -->
  <path d="M 15 155 L 225 155 L 205 215 L 35 215 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Wooden desk texture/inset -->
  <path d="M 25 162 L 215 162 L 200 208 L 40 208 Z" fill="#0f172a" />

  <!-- PROPS ON DESK -->
  <!-- Coffee Mug -->
  <rect x="185" y="165" width="14" height="18" rx="3" fill="#cbd5e1" />
  <path d="M 199 170 C 205 170 205 178 199 180" stroke="#cbd5e1" stroke-width="2.5" fill="none" />
  <path d="M 188 162 L 212 162" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />

  <!-- Ruler / Drafting Tools -->
  <polygon points="50,195 90,175 95,185 55,205" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />

  <!-- CHARACTER: Architect / Designer leaning over desk -->
  <!-- Torso & Shoulders -->
  <path d="M 95 190 Q 95 145 130 135 L 145 185 Z" fill="#0284c7" />
  <!-- Collar & Neck -->
  <path d="M 115 125 L 125 138 L 135 125 Z" fill="#fbcfe8" />
  <rect x="117" y="115" width="12" height="15" fill="#fed7aa" rx="4" />

  <!-- Head with focused expression -->
  <circle cx="120" cy="102" r="14" fill="#fed7aa" />
  <!-- Hair (Stylish dark bun/haircut) -->
  <path d="M 106 100 C 105 85 135 85 134 102 C 138 98 135 90 128 88 C 120 86 110 90 106 100 Z" fill="#334155" />
  <circle cx="132" cy="95" r="5" fill="#334155" />
  <!-- Glasses -->
  <rect x="113" y="97" width="7" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <rect x="122" y="97" width="7" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
  <line x1="120" y1="99" x2="122" y2="99" stroke="#0f172a" stroke-width="1.5" />
  <!-- Focused Eyes & Smile -->
  <circle cx="116" cy="99" r="1" fill="#0f172a" />
  <circle cx="125" cy="99" r="1" fill="#0f172a" />
  <path d="M 119 107 Q 121 110 123 107" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Arms pointing / holding drafting pen -->
  <!-- Right Arm -->
  <path d="M 135 145 Q 155 160 165 175" stroke="#0284c7" stroke-width="9" stroke-linecap="round" fill="none" />
  <!-- Hand holding pen -->
  <circle cx="167" cy="178" r="4" fill="#fed7aa" />
  <!-- Precision Pen / Stylus -->
  <line x1="155" y1="172" x2="185" y2="187" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />

  <!-- Left Arm -->
  <path d="M 105 155 Q 90 170 85 185" stroke="#0369a1" stroke-width="9" stroke-linecap="round" fill="none" />
  <circle cx="83" cy="188" r="4" fill="#fed7aa" />

  <!-- MAIN SCENARIO FOCUS: THE TWO PARALLEL LINES -->
  <!-- Architectural Blue Blueprint Paper on Desk -->
  <polygon points="65,168 155,148 168,192 78,212" fill="#0284c7" opacity="0.9" stroke="#38bdf8" stroke-width="1" />
  <!-- Blueprint Grid Detail -->
  <line x1="85" y1="175" x2="145" y2="162" stroke="#38bdf8" stroke-width="0.5" opacity="0.3" />
  <line x1="90" y1="190" x2="150" y2="177" stroke="#38bdf8" stroke-width="0.5" opacity="0.3" />

  <!-- THE TARGET CONCEPT: Two perfectly glowing parallel straight lines -->
  <g id="parallel-lines">
    <!-- Line 1 -->
    <line x1="85" y1="182" x2="148" y2="168" stroke="url(#laserGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Line 2 -->
    <line x1="91" y1="199" x2="154" y2="185" stroke="url(#laserGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Technical helper arrows / extension lines showing exact perpendicular distance -->
    <line x1="100" y1="180" x2="106" y2="196" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2" />
    <!-- Perpendicular right angle indicators -->
    <polyline points="104,181 107,182 106,185" fill="none" stroke="#fbbf24" stroke-width="1" />
    <polyline points="102,192 105,193 104,195" fill="none" stroke="#fbbf24" stroke-width="1" />
    
    <!-- Little glowing nodes at line endpoints to pop visually -->
    <circle cx="85" cy="182" r="2" fill="#38bdf8" />
    <circle cx="148" cy="168" r="2" fill="#38bdf8" />
    <circle cx="91" cy="199" r="2" fill="#38bdf8" />
    <circle cx="154" cy="185" r="2" fill="#38bdf8" />
  </g>

  <!-- Foreground Atmospheric Elements (Depth of field) -->
  <!-- Cute small desk plant pot bottom left -->
  <path d="M 15 210 L 35 210 L 32 230 L 18 230 Z" fill="#64748b" />
  <ellipse cx="25" cy="210" rx="10" ry="3" fill="#94a3b8" />
  <path d="M 25 210 Q 15 195 10 185" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 25 210 Q 35 190 40 180" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 25 210 Q 25 190 25 175" stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round" />
</svg>