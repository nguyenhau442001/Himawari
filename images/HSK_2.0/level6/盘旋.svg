<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sun/Moon Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Background Environment & Atmosphere -->
  <!-- Ambient Glow from High Sun -->
  <circle cx="180" cy="50" r="70" fill="url(#sunGlow)"/>
  <circle cx="180" cy="50" r="16" fill="#fef3c7"/>

  <!-- Distant Mountain Ranges (Layer 1) -->
  <path d="M0 190 L40 150 L90 180 L150 130 L200 170 L240 140 L240 240 L0 240 Z" fill="#1b2a47" opacity="0.6"/>

  <!-- Closer Mountain Ranges (Layer 2 with Pine Silhouettes) -->
  <path d="M0 210 L50 175 L110 200 L170 160 L240 190 L240 240 L0 240 Z" fill="#0f172a"/>

  <!-- Foreground Pine Trees and Cliff Edge on Left -->
  <path d="M0 240 L0 200 Q15 190 30 240 Z" fill="#090d16"/>
  <!-- Pine Tree 1 -->
  <polygon points="25,180 15,200 35,200" fill="#0f172a"/>
  <polygon points="25,165 18,185 32,185" fill="#0f172a"/>
  <rect x="23" y="200" width="4" height="15" fill="#090d16"/>

  <!-- Cloud Layers (Stylized) -->
  <path d="M-10 90 Q20 70 60 90 Q100 70 140 100 Q180 80 220 100 Q250 90 260 110 L260 130 L-10 130 Z" fill="#334155" opacity="0.25"/>
  <path d="M-10 110 Q30 95 80 120 Q130 100 170 125 Q210 110 250 130 L250 150 L-10 150 Z" fill="#1e293b" opacity="0.5"/>

  <!-- MAIN ACTION: EAGLE CIRCLING (盘旋 - Pánxuán) -->
  <!-- Swooping Motion Path Lines (Subtle Guide for Bay Lượn) -->
  <path d="M70 70 C120 40 180 70 140 110 C100 150 50 110 90 80" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,6" fill="none" opacity="0.4"/>

  <!-- Soaring Eagle Illustration Group (Dynamic Perspective) -->
  <g transform="translate(110, 75) scale(0.9)">
    <!-- Eagle Body & Head -->
    <ellipse cx="0" cy="0" rx="8" ry="14" fill="#78350f" transform="rotate(25)" />
    <!-- White Head / Tail Details for Eagle Look -->
    <circle cx="-3" cy="-10" r="5" fill="#f8fafc"/>
    <path d="M-6 -14 L-2 -8 L-7 -6 Z" fill="#d97706"/> <!-- Sharp beak -->
    
    <!-- Left Wing (Extended and curved upward for banking turn) -->
    <path d="M-4 -4 C-25 -25 -55 -20 -70 -5 C-55 5 -30 10 -4 4 Z" fill="#92400e"/>
    <!-- Wing Feathers Edge (Left) -->
    <path d="M-70 -5 C-60 -12 -45 -15 -35 -4" stroke="#451a03" stroke-width="1.5" fill="none"/>
    <path d="M-55 -12 C-45 -18 -30 -15 -20 -2" stroke="#451a03" stroke-width="1.5" fill="none"/>

    <!-- Right Wing (Tucked slightly in perspective) -->
    <path d="M3 2 C25 -10 50 -2 55 12 C40 18 20 15 4 8 Z" fill="#b45309"/>

    <!-- Tail Feathers -->
    <path d="M6 10 L14 24 L8 22 L2 25 Z" fill="#f8fafc"/>
    <path d="M8 12 L11 20 L7 18 Z" fill="#78350f"/>
  </g>

  <!-- Secondary Smaller Eagle far away for depth -->
  <g transform="translate(50, 45) scale(0.45)">
    <path d="M-20 -5 Q0 -20 20 -5 Q0 5 -20 -5 Z" fill="#92400e"/>
    <circle cx="0" cy="-5" r="3" fill="#f8fafc"/>
  </g>

  <!-- Foreground atmospheric dust / particles / sun rays -->
  <circle cx="150" cy="30" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="190" cy="80" r="2" fill="#fef08a" opacity="0.6"/>
  <circle cx="90" cy="50" r="1" fill="#fef08a" opacity="0.7"/>
  <circle cx="120" cy="130" r="1.5" fill="#fef08a" opacity="0.5"/>

  <!-- Border Frame for polished app illustration look -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.4"/>
</svg>