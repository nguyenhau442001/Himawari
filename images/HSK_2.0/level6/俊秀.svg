<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Park setting with a bench and tree -->
  <path d="M0 180 Q120 160 240 180 L240 240 L0 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M180 180 L180 80 L200 80 L200 180 Z" fill="#475569"/>
  <circle cx="190" cy="70" r="40" fill="#10b981"/>
  <circle cx="170" cy="60" r="35" fill="#059669"/>
  
  <!-- The Child -->
  <g transform="translate(100, 120)">
    <!-- Body -->
    <path d="M-15 80 L15 80 L10 40 L-10 40 Z" fill="#38bdf8"/>
    <!-- Arms -->
    <path d="M-15 45 L-30 60" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 45 L30 60" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-22 20 Q-25 -5 0 -5 Q25 -5 22 20 Z" fill="#78350f"/>
    <!-- Face (Features) -->
    <circle cx="-8" cy="15" r="3" fill="#0f172a"/>
    <circle cx="8" cy="15" r="3" fill="#0f172a"/>
    <path d="M-8 25 Q0 30 8 25" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-5 22 Q0 20 5 22" stroke="#ec4899" stroke-width="1" fill="none"/>
  </g>

  <!-- Elder/Parent figure observing -->
  <g transform="translate(50, 130)">
    <path d="M-20 90 L20 90 L15 40 L-15 40 Z" fill="#fb923c"/>
    <circle cx="0" cy="25" r="20" fill="#fde68a"/>
    <path d="M-15 25 Q-20 5 0 5 Q20 5 15 25" fill="#475569"/>
    <path d="M-5 20 L-2 20 M2 20 L5 20" stroke="#0f172a" stroke-width="2"/>
    <path d="M-5 30 Q0 35 5 30" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="5" fill="#fbbf24"/>
  <circle cx="30" cy="50" r="3" fill="#fbbf24"/>
  <path d="M220 150 L225 140 L230 150 Z" fill="#fbbf24"/>
</svg>