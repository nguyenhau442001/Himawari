<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- Character: The person looking regretful/hesitant -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 80 Q-40 40 0 40 Q40 40 40 80 L40 120 L-40 120 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="30" fill="#fde68a"/>
    <!-- Eyes (looking down/sad) -->
    <ellipse cx="-10" cy="5" rx="3" ry="4" fill="#1e293b"/>
    <ellipse cx="10" cy="5" rx="3" ry="4" fill="#1e293b"/>
    <!-- Mouth (frown) -->
    <path d="M-10 20 Q0 15 10 20" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>

  <!-- The "Action" - A resignation letter or difficult document -->
  <rect x="60" y="170" width="60" height="50" fill="#f1f5f9" rx="2"/>
  <line x1="70" y1="185" x2="110" y2="185" stroke="#94a3b8" stroke-width="4"/>
  <line x1="70" y1="200" x2="110" y2="200" stroke="#94a3b8" stroke-width="4"/>
  <line x1="70" y1="215" x2="90" y2="215" stroke="#94a3b8" stroke-width="4"/>

  <!-- Pen -->
  <path d="M130 190 L150 170 L155 175 L135 195 Z" fill="#fb923c"/>
  
  <!-- Ambient lighting/mood -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.1"/>
  <circle cx="180" cy="60" r="20" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Window/Background detail -->
  <rect x="160" y="30" width="50" height="80" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="185" y1="30" x2="185" y2="110" stroke="#334155" stroke-width="2"/>
  <circle cx="185" cy="70" r="5" fill="#38bdf8" opacity="0.3"/>
</svg>