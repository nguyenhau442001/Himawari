<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="room-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Fruit Tray Gradient -->
    <linearGradient id="tray-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Character Outfit -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Background Elements (Cozy Living Room Context) -->
  <rect width="240" height="240" rx="24" fill="url(#room-glow)"/>
  
  <!-- Window / Warm light source in background -->
  <path d="M170 40 L210 50 L210 130 L170 120 Z" fill="#334155" opacity="0.4"/>
  <path d="M175 48 L205 56 L205 124 L175 116 Z" fill="#fbbf24" opacity="0.1"/>

  <!-- House Plant (Context Prop) -->
  <g transform="translate(25, 130)">
    <path d="M10 50 L20 80 L0 80 Z" fill="#64748b"/>
    <ellipse cx="10" cy="50" rx="12" ry="4" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M10 45 C 5 20, -10 10, -15 0 C -5 20, 5 30, 10 45 Z" fill="#10b981"/>
    <path d="M12 45 C 20 20, 35 15, 45 5 C 30 20, 20 30, 12 45 Z" fill="#059669"/>
    <path d="M10 48 C 5 30, 15 10, 15 0 C 12 15, 8 30, 10 48 Z" fill="#34d399"/>
  </g>

  <!-- Sofa Backrest (Context Prop) -->
  <path d="M0 160 Q 60 145 130 160 L130 200 L0 200 Z" fill="#1e293b" opacity="0.8"/>

  <!-- FLOOR -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Floor line reflection/accent -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- MAIN CHARACTER: WALKING & CARRYING A TRAY WITH TWO HANDS (端) -->
  <!-- Shadow under feet -->
  <ellipse cx="120" cy="202" rx="35" ry="6" fill="#020617" opacity="0.5"/>

  <!-- Character Body Group -->
  <g transform="translate(75, 75)">
    <!-- Legs (Walking Pose) -->
    <!-- Back Leg -->
    <path d="M35 85 L20 115 L32 118 L42 90 Z" fill="#334155"/>
    <!-- Front Leg -->
    <path d="M50 85 L62 112 L75 108 L60 85 Z" fill="#475569"/>
    <!-- Shoes -->
    <ellipse cx="26" cy="118" rx="8" ry="4" fill="#0f172a"/>
    <ellipse cx="68" cy="109" rx="8" ry="4" fill="#0f172a"/>

    <!-- Torso (Slightly turned/walking) -->
    <path d="M30 40 L65 40 L70 85 L25 85 Z" fill="url(#shirt-grad)" rx="6"/>
    <!-- Collar / Details -->
    <path d="M40 40 L55 40 L50 50 L45 50 Z" fill="#e2e8f0"/>

    <!-- Head & Hair -->
    <!-- Hair back -->
    <circle cx="48" cy="22" r="17" fill="#1e1b4b"/>
    <!-- Face -->
    <circle cx="50" cy="24" r="15" fill="#fcd34d"/>
    <!-- Friendly happy expression -->
    <path d="M44 23 Q 47 27 50 23" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <path d="M54 23 Q 57 27 60 23" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <path d="M49 30 Q 52 34 55 30" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="43" cy="28" r="3" fill="#fb7185" opacity="0.6"/>
    <circle cx="61" cy="28" r="3" fill="#fb7185" opacity="0.6"/>
    <!-- Hair front / bangs -->
    <path d="M35 18 Q 48 10 60 20 Q 50 12 38 22 Z" fill="#312e81"/>

    <!-- Arms securely holding the tray with TWO HANDS (端 - bưng bằng hai tay) -->
    <!-- Left Arm (supporting left side of tray) -->
    <path d="M32 45 C 15 50, 10 30, 20 20" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="5" fill="#fcd34d"/> <!-- Left Hand -->

    <!-- Right Arm (supporting right side of tray) -->
    <path d="M63 45 C 80 50, 85 30, 75 20" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <circle cx="75" cy="20" r="5" fill="#fcd34d"/> <!-- Right Hand -->

    <!-- THE TRAY OF FRUIT (The object being carried - 盘水果) -->
    <!-- Tray base -->
    <path d="M10 17 L85 17 L77 24 L18 24 Z" fill="url(#tray-grad)"/>
    <ellipse cx="47" cy="17" rx="37" ry="5" fill="#fbbf24"/>
    <ellipse cx="47" cy="17" rx="33" ry="3" fill="#f59e0b"/>

    <!-- Fruits on Tray (Colorful details) -->
    <!-- Apple/Red fruit -->
    <circle cx="35" cy="14" r="7" fill="#ef4444"/>
    <path d="M35 7 L35 9" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>

    <!-- Orange -->
    <circle cx="52" cy="14" r="6" fill="#f97316"/>
    <circle cx="52" cy="14" r="5" fill="#fb923c"/>

    <!-- Grapes cluster -->
    <circle cx="43" cy="11" r="3.5" fill="#8b5cf6"/>
    <circle cx="47" cy="10" r="3" fill="#a855f7"/>
    <circle cx="45" cy="15" r="3.5" fill="#7c3aed"/>

    <!-- Banana slice / piece -->
    <path d="M59 13 Q 64 10 68 15 Q 63 17 59 13 Z" fill="#fef08a"/>
  </g>

  <!-- Ambient Floating Motion Lines / Sparkles (Enhancing the 'walking over' / 走过来 action) -->
  <g opacity="0.6">
    <path d="M25 105 Q 35 100 45 105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M15 115 Q 25 110 35 115" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    
    <!-- Warm accent sparkle near tray -->
    <path d="M145 75 L148 82 L155 85 L148 88 L145 95 L142 88 L135 85 L142 82 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M60 55 L61 58 L65 60 L61 62 L60 65 L59 62 L55 60 L59 58 Z" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>