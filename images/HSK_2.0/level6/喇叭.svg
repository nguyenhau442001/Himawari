<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Street Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="205" width="240" height="5" fill="#475569"/>
  
  <!-- Building Silhouette -->
  <path d="M20 240V80h40v-20h40v20h40v-30h40v190z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- The Loudspeaker (喇叭) -->
  <g transform="translate(160, 120)">
    <path d="M0 0l40-20v40z" fill="#fbbf24"/>
    <rect x="-10" y="-5" width="15" height="10" fill="#fb923c"/>
    <rect x="-20" y="-8" width="10" height="16" fill="#94a3b8"/>
  </g>
  
  <!-- Sound Waves -->
  <path d="M205 120c5-10 15-15 25-10" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M205 120c8-15 25-20 35-10" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Character: Pedestrian -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="15" fill="#e2e8f0"/>
    <path d="M20 35v40M20 75l-10 25M20 75l10 25M20 45l-15 15M20 45l15 15" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="5" fill="#334155"/>
    <path d="M15 15l3-3M25 15l-3-3" stroke="#334155" stroke-width="2"/>
  </g>
  
  <!-- Street Lamp -->
  <rect x="210" y="40" width="4" height="140" fill="#94a3b8"/>
  <circle cx="212" cy="40" r="10" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="2" fill="#f8fafc"/>
  <circle cx="150" cy="30" r="3" fill="#f8fafc"/>
  <circle cx="100" cy="60" r="2" fill="#f8fafc"/>
</svg>