<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Teacher character -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="-30" r="12" fill="#FFC107"/>
    <path d="M10 0h20l-5 40h-10z" fill="#FFC107"/>
    <path d="M5 40h30l-2 20h-26z" fill="#3498DB"/>
    <path d="M15 40v30M25 40v30" stroke="#3498DB" stroke-width="4" stroke-linecap="round"/>
    <!-- Guiding gesture -->
    <path d="M30 0 L55 -15" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Student character -->
  <g transform="translate(140, 140)">
    <circle cx="20" cy="-30" r="10" fill="#E0E0E0"/>
    <path d="M12 0h16l-3 30h-10z" fill="#E0E0E0"/>
    <path d="M8 30h24l-2 20h-20z" fill="#95A5A6"/>
  </g>

  <!-- Motion lines indicating guidance/direction -->
  <path d="M95 95 Q 120 80 145 100" stroke="#FFC107" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <path d="M145 100 l -5 -5 m 5 5 l -5 5" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>

  <!-- Thought bubble representation (Abstracted as a lightbulb concept) -->
  <g transform="translate(160, 80)">
    <path d="M0 0 C -10 -20 10 -20 0 0" fill="#FFC107"/>
    <circle cx="0" cy="5" r="3" fill="#FFC107"/>
  </g>
</svg>