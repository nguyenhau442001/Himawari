<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow representing time/distance -->
  <circle cx="120" cy="120" r="100" fill="url(#glowGrad)" />

  <!-- Window frame showing distant night city/evening (symbolizing separation/time passing) -->
  <path d="M70 45 L170 45 L170 195 L70 195 Z" fill="#090d16" opacity="0.6"/>
  <rect x="75" y="50" width="43" height="140" fill="url(#warmLight)" rx="2" />
  <rect x="122" y="50" width="43" height="140" fill="#111827" rx="2" />

  <!-- City lights in distance (tiny glowing dots) -->
  <circle cx="135" cy="160" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="170" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="140" cy="120" r="1.5" fill="#f43f5e" opacity="0.5"/>
  <circle cx="155" cy="130" r="1" fill="#fbbf24" opacity="0.7"/>

  <!-- Coffee Shop / Living Room Interior Elements -->
  <!-- Table -->
  <path d="M40 175 L200 175 L210 200 L30 200 Z" fill="#334155" />
  <rect x="30" y="195" width="180" height="6" fill="#1e293b" rx="2" />

  <!-- Left Character (Person A - looking thoughtfully at empty space across the table) -->
  <g transform="translate(10, 0)">
    <!-- Body / Jacket -->
    <path d="M70 180 C70 155 85 145 95 145 C105 145 120 155 120 180 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="95" cy="125" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M81 125 C81 114 90 110 95 110 C103 110 110 115 110 125 C106 123 100 121 95 121 C90 121 85 123 81 125 Z" fill="#0f172a" />
    <!-- Arm resting on table, holding coffee mug -->
    <path d="M85 155 L95 170 L105 165" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Coffee Mug -->
    <rect x="98" y="160" width="12" height="15" rx="3" fill="#f8fafc" />
    <path d="M110 164 C114 164 114 171 110 171" fill="none" stroke="#f8fafc" stroke-width="2" />
    <!-- Steam rising (faint, sparse) -->
    <path d="M102 153 C104 150 102 147 104 144" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Empty Chair & Space on the Right (Visualizing "increasingly less frequent meetings / absence") -->
  <g transform="translate(115, 0)">
    <!-- Empty chair backrest outline -->
    <rect x="70" y="130" width="22" height="45" rx="4" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="4 3" opacity="0.5" />
    <!-- Table space with just a solitary cold glass -->
    <rect x="45" y="165" width="10" height="15" rx="1" fill="#64748b" opacity="0.3" />
  </g>

  <!-- Graphic overlay indicating time/frequency gap (dotted curved arc and calendar motif floating softly) -->
  <!-- Dotted path showing separation/distance over time -->
  <path d="M 105 110 Q 120 85 135 110" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" opacity="0.4" />
  
  <!-- Stylized subtle calendar icon in upper corner showing passing days -->
  <g transform="translate(175, 25)" opacity="0.8">
    <rect x="0" y="0" width="32" height="34" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="32" height="10" fill="#f43f5e" rx="6" />
    <circle cx="8" cy="5" r="1.5" fill="#cbd5e1" />
    <circle cx="24" cy="5" r="1.5" fill="#cbd5e1" />
    <!-- Small grid dots inside calendar -->
    <circle cx="8" cy="18" r="1.5" fill="#94a3b8" />
    <circle cx="16" cy="18" r="1.5" fill="#94a3b8" />
    <circle cx="24" cy="18" r="1.5" fill="#334155" /> <!-- crossed out / missing -->
    <circle cx="8" cy="26" r="1.5" fill="#334155" />
    <circle cx="16" cy="26" r="1.5" fill="#334155" />
    <circle cx="24" cy="26" r="1.5" fill="#334155" />
  </g>

  <!-- Foreground ambiance plant silhouette for depth -->
  <path d="M15 240 C15 210 25 195 40 185" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  <path d="M30 195 C20 185 15 170 20 160 C25 175 40 185 30 195 Z" fill="#1e293b" />
  <path d="M38 188 C48 180 55 165 52 150 C48 165 35 175 38 188 Z" fill="#1e293b" />
</svg>