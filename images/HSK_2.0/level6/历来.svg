<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Architecture: Old meets New -->
  <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#334155"/>
  <rect x="40" y="100" width="40" height="80" fill="#475569"/>
  <rect x="100" y="80" width="50" height="100" fill="#64748b"/>
  <rect x="170" y="60" width="40" height="120" fill="#475569"/>
  
  <!-- Street Details -->
  <circle cx="180" cy="70" r="5" fill="#fbbf24"/>
  <circle cx="120" cy="90" r="5" fill="#fbbf24"/>
  <circle cx="50" cy="110" r="5" fill="#fbbf24"/>
  
  <!-- Characters: An elder pointing to the history of the street -->
  <g transform="translate(40, 130)">
    <circle cx="20" cy="20" r="10" fill="#fde68a"/>
    <path d="M20 30 L20 60 M20 40 L10 50 M20 40 L30 50 M10 80 L20 60 L30 80" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(100, 140)">
    <circle cx="20" cy="20" r="10" fill="#38bdf8"/>
    <path d="M20 30 L20 60 M20 40 L10 50 M20 40 L30 50 M10 80 L20 60 L30 80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Narrative Element: The "Time" connection -->
  <path d="M60 140 L90 130" stroke="#ec4899" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="90" cy="130" r="4" fill="#ec4899"/>
  
  <!-- Ground/Street -->
  <path d="M0 220 L240 220 L240 240 L0 240 Z" fill="#1e293b"/>
  <rect x="0" y="220" width="240" height="20" fill="#0f172a"/>
  
  <!-- Decorative accents -->
  <circle cx="200" cy="30" r="2" fill="#fb923c"/>
  <circle cx="210" cy="40" r="3" fill="#fb923c"/>
  <circle cx="190" cy="45" r="2" fill="#fb923c"/>
</svg>