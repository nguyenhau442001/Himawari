  <path d="M110 80 L 130 80 M 110 90 L 130 90" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="60" r="8" fill="none" stroke="#10b981" stroke-width="3"/>
  
  <!-- Ambient details -->
  <circle cx="30" cy="40" r="3" fill="#f8fafc" opacity="0.3"/>
