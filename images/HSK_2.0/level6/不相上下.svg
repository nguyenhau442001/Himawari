      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Chess Table -->
  <rect x="40" y="150" width="160" height="20" rx="4" fill="#475569"/>
  <rect x="60" y="170" width="10" height="50" fill="#334155"/>
  <rect x="170" y="170" width="10" height="50" fill="#334155"/>
  
  <!-- Chessboard -->
  <rect x="70" y="130" width="100" height="20" rx="2" fill="#f1f5f9"/>
  <rect x="70" y="130" width="50" height="20" fill="#334155"/>
  
  <!-- Player 1 (Left) -->
  <circle cx="80" cy="100" r="25" fill="#fb923c"/>
  <path d="M60 140 Q 80 120 100 140 L 95 160 L 65 160 Z" fill="#38bdf8"/>
  <circle cx="70" cy="95" r="4" fill="#0f172a"/>
  <circle cx="90" cy="95" r="4" fill="#0f172a"/>
  
  <!-- Player 2 (Right) -->
