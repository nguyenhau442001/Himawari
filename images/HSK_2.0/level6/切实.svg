<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Floor Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="180" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Spotlight -->
    <radialGradient id="amberGlow" cx="120" cy="90" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Screen Glow -->
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#475569" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Amber Spotlight for Practical Action Focus -->
  <circle cx="120" cy="110" r="100" fill="url(#amberGlow)" />

  <!-- BACKDROP ENVIRONMENT: Office / Workspace (Realistic context for solving problems practically) -->
  <!-- Window Grid -->
  <rect x="25" y="25" width="50" height="65" rx="4" fill="url(#windowLight)" stroke="#334155" stroke-width="2"/>
  <line x1="50" y1="25" x2="50" y2="90" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="57" x2="75" y2="57" stroke="#334155" stroke-width="2"/>

  <!-- Wall Shelf with Books and Plant (Context props) -->
  <rect x="155" y="35" width="60" height="6" rx="2" fill="#475569"/>
  <!-- Book 1 -->
  <rect x="165" y="15" width="10" height="20" rx="1" fill="#f43f5e"/>
  <!-- Book 2 -->
  <rect x="177" y="18" width="14" height="17" rx="1" fill="#10b981"/>
  <!-- Small Potted Plant -->
  <path d="M 198 35 L 208 35 L 205 25 L 201 25 Z" fill="#94a3b8"/>
  <circle cx="204.5" cy="23" r="6" fill="#34d399"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M 120 0 L 120 35" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 35 L 140 35 L 132 45 L 108 45 Z" fill="#64748b"/>
  <!-- Lamp Cone Light Beam -->
  <path d="M 108 45 L 132 45 L 170 140 L 70 140 Z" fill="#fbbf24" opacity="0.08"/>

  <!-- WORKSPACE DESK SURFACE -->
  <path d="M 10 180 L 230 180 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <rect x="0" y="176" width="240" height="6" fill="#475569" />

  <!-- PRACTICAL PROBLEM SOLVING PROPS ON DESK -->
  <!-- Coffee Mug -->
  <rect x="28" y="150" width="16" height="20" rx="3" fill="#e2e8f0" filter="url(#shadow)"/>
  <path d="M 44 154 C 48 154 48 164 44 164" stroke="#e2e8f0" stroke-width="3" fill="none"/>
  <!-- Steam rising -->
  <path d="M 33 143 C 35 140 33 137 36 134" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Laptop / Computer Showing Analytics/Problem Solution (Practical Action) -->
  <!-- Laptop Base -->
  <path d="M 140 176 L 210 176 L 220 183 L 130 183 Z" fill="#64748b" filter="url(#shadow)"/>
  <!-- Laptop Screen Frame -->
  <rect x="145" y="125" width="60" height="52" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <!-- Screen Display Content (Charts & Checkmark representing resolved problem) -->
  <rect x="150" y="130" width="50" height="42" fill="url(#screenGlow)"/>
  <!-- Mini Bar Chart -->
  <rect x="156" y="158" width="6" height="10" rx="1" fill="#38bdf8"/>
  <rect x="166" y="150" width="6" height="18" rx="1" fill="#38bdf8"/>
  <rect x="176" y="142" width="6" height="26" rx="1" fill="#10b981"/>
  <!-- Success Checkmark Graphic on Screen -->
  <path d="M 188 150 L 192 154 L 198 144" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Blueprint / Physical Action Files -->
  <g transform="translate(60, 155) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="28" rx="2" fill="#f8fafc"/>
    <line x1="6" y1="8" x2="25" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="35" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="18" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Red Stamp: Done/Concrete Action -->
    <circle cx="32" cy="18" r="6" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M 29 18 L 31 20 L 35 15" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MAIN CHARACTER: Focused professional actively pointing/solving the problem "切实解决" -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Torso & Shirt (Professional Blue) -->
    <path d="M 90 178 C 90 155 102 145 120 145 C 138 145 150 155 150 178 Z" fill="#2563eb" />
    <!-- Collar -->
    <path d="M 110 145 L 120 156 L 130 145 Z" fill="#ffffff" />
    <path d="M 115 145 L 120 152 L 125 145 Z" fill="#cbd5e1" />

    <!-- Neck -->
    <rect x="113" y="132" width="14" height="18" rx="4" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="120" cy="115" r="22" fill="#fbcfe8" />

    <!-- Hair (Stylish Dark Slate Modern Cut) -->
    <path d="M 98 115 C 98 100 110 92 120 92 C 130 92 142 100 142 115 C 142 122 140 120 138 110 C 135 98 125 96 120 96 C 112 96 104 100 101 112 C 99 118 98 118 98 115 Z" fill="#1e293b" />

    <!-- Face Expression: Determined, focused, confident -->
    <!-- Eyebrows (Focused angle) -->
    <path d="M 108 109 L 115 111" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 125 111 L 132 109" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (Confident dots with highlight) -->
    <circle cx="112" cy="116" r="2.5" fill="#1e293b"/>
    <circle cx="128" cy="116" r="2.5" fill="#1e293b"/>
    <circle cx="113" cy="115" r="0.8" fill="#ffffff"/>
    <circle cx="129" cy="115" r="0.8" fill="#ffffff"/>
    <!-- Smile (Determined smirk/smile indicating action execution) -->
    <path d="M 116 125 C 118 127 122 127 124 125" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Glasses for professional intelligence -->
    <rect x="107" y="111" width="10" height="9" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <rect x="123" y="111" width="10" height="9" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="117" y1="115" x2="123" y2="115" stroke="#64748b" stroke-width="1.5"/>

    <!-- Left Arm & Hand (Actively pointing forward to emphasize concrete action/solution) -->
    <!-- Shoulder/Arm -->
    <path d="M 95 150 C 80 155 70 165 65 170" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <!-- Forearm pointing right towards the problem data/solution -->
    <path d="M 65 170 L 95 175" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand pointing finger -->
    <circle cx="98" cy="175" r="4.5" fill="#fbcfe8"/>
    <path d="M 98 171 L 108 174 L 98 177 Z" fill="#fbcfe8"/>

    <!-- Right Arm (Resting on desk/holding pen) -->
    <path d="M 145 150 C 155 160 160 170 165 178" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="166" cy="180" r="4" fill="#fbcfe8"/>
  </g>

  <!-- FOREGROUND ACCENTS & VIBRANT PARTICLES (Depicting energy of effective solution "切实") -->
  <circle cx="55" cy="110" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="95" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="40" cy="130" r="2" fill="#10b981" opacity="0.7"/>
  <circle cx="210" cy="140" r="2.5" fill="#f43f5e" opacity="0.7"/>

  <!-- Dynamic Accent Glow Ring on the Active Action Point -->
  <path d="M 95 165 A 15 15 0 0 1 115 185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 108 185 L 115 185 L 115 178" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>