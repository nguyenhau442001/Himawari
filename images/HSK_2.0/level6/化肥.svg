<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Sky -->
  <circle cx="190" cy="60" r="22" fill="#fbbf24" opacity="0.9"/>
  <path d="M 30 110 Q 70 90 120 110 T 210 100" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
  
  <!-- Farmland Hills -->
  <path d="M 0 140 Q 60 120 120 140 T 240 135 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.5"/>
  <path d="M 0 160 Q 90 135 180 160 T 240 155 L 240 240 L 0 240 Z" fill="#1e293b"/>

  <!-- Cultivated Rows & Crops -->
  <path d="M 40 240 Q 70 170 110 160" fill="none" stroke="#0f172a" stroke-width="8"/>
  <path d="M 100 240 Q 130 170 170 160" fill="none" stroke="#0f172a" stroke-width="8"/>
  
  <!-- Growing Sprouts / Crop Field -->
  <g fill="#10b981">
    <path d="M 65 175 C 65 160 75 155 75 155 C 75 155 70 170 65 175 Z"/>
    <path d="M 85 185 C 85 165 98 160 98 160 C 98 160 92 180 85 185 Z"/>
    <path d="M 125 195 C 125 175 138 170 138 170 C 138 170 132 190 125 195 Z"/>
    <path d="M 150 205 C 150 185 163 180 163 180 C 163 180 157 200 150 205 Z"/>
  </g>

  <!-- Farmer Character -->
  <!-- Straw Hat -->
  <ellipse cx="145" cy="115" rx="26" ry="7" fill="#fb923c"/>
  <path d="M 132 112 Q 145 98 158 112 Z" fill="#f59e0b"/>

  <!-- Farmer Head & Torso -->
  <circle cx="145" cy="122" rx="11" ry="12" fill="#fed7aa"/>
  <path d="M 130 134 Q 145 130 160 134 L 165 175 L 125 175 Z" fill="#10b981"/> <!-- Green jacket -->

  <!-- Arms interacting with fertilizer -->
  <path d="M 130 145 Q 110 150 100 140" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  <circle cx="98" cy="138" r="4" fill="#fed7aa"/>

  <!-- Fertilizer Bag (化肥 - huàféi) -->
  <g transform="translate(70, 130)">
    <!-- Bag body -->
    <path d="M 5 15 C 5 5 15 0 25 0 C 35 0 45 5 45 15 L 40 70 C 40 75 35 78 25 78 C 15 78 10 75 10 70 Z" fill="url(#bagGrad)" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Bag Fold/Top -->
    <path d="M 8 12 Q 25 16 42 12" fill="none" stroke="#e0f2fe" stroke-width="2"/>
    <!-- Graphical leaf/plant icon on bag representing fertilizer purpose -->
    <path d="M 25 45 C 25 35 18 30 18 30 C 18 30 23 40 25 45 Z" fill="#10b981"/>
    <path d="M 25 45 C 25 35 32 30 32 30 C 32 30 27 40 25 45 Z" fill="#34d399"/>
    <line x1="25" y1="52" x2="25" y2="35" stroke="#0c4a6e" stroke-width="2"/>
  </g>

  <!-- Spilled/Applied Fertilizer Particles near ground -->
  <circle cx="85" cy="180" r="2" fill="#e0f2fe"/>
  <circle cx="92" cy="188" r="2.5" fill="#bae6fd"/>
  <circle cx="78" cy="185" r="1.5" fill="#e0f2fe"/>
  <circle cx="105" cy="195" r="2" fill="#e0f2fe"/>

  <!-- Foreground details / Soil texture -->
  <path d="M 0 200 Q 60 190 120 205 T 240 200 L 240 240 L 0 240 Z" fill="url(#soilGrad)"/>

  <!-- Additional glowing ambiance particles -->
  <circle cx="60" cy="80" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="120" cy="70" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="180" cy="110" r="1" fill="#fbbf24" opacity="0.8"/>
</svg>