<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <defs>
    <!-- Window/Haze Glow -->
    <radialGradient id="cityGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Neon Accent Glows -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="120" cy="120" r="100" fill="url(#cityGlow)"/>

  <!-- LAYER 1: Distant Skyscrapers (Dense urban background) -->
  <g fill="#1e293b">
    <rect x="20" y="80" width="18" height="120" rx="2"/>
    <rect x="42" y="60" width="22" height="140" rx="2"/>
    <rect x="68" y="90" width="15" height="110" rx="2"/>
    <rect x="87" y="50" width="25" height="150" rx="2"/>
    <rect x="116" y="70" width="20" height="130" rx="2"/>
    <rect x="140" y="45" width="28" height="155" rx="2"/>
    <rect x="172" y="75" width="18" height="125" rx="2"/>
    <rect x="194" y="65" width="26" height="135" rx="2"/>
  </g>

  <!-- Windows in background skyscrapers (Dense grid effect) -->
  <g fill="#fbbf24" opacity="0.6">
    <rect x="24" y="90" width="3" height="4"/><rect x="30" y="90" width="3" height="4"/><rect x="24" y="100" width="3" height="4"/><rect x="30" y="100" width="3" height="4"/>
    <rect x="47" y="70" width="4" height="6"/><rect x="55" y="70" width="4" height="6"/><rect x="47" y="85" width="4" height="6"/><rect x="55" y="85" width="4" height="6"/><rect x="47" y="100" width="4" height="6"/><rect x="55" y="100" width="4" height="6"/>
    <rect x="92" y="60" width="4" height="5"/><rect x="100" y="60" width="4" height="5"/><rect x="92" y="72" width="4" height="5"/><rect x="100" y="72" width="4" height="5"/><rect x="92" y="84" width="4" height="5"/><rect x="100" y="84" width="4" height="5"/>
    <rect x="146" y="55" width="5" height="6"/><rect x="155" y="55" width="5" height="6"/><rect x="146" y="70" width="5" height="6"/><rect x="155" y="70" width="5" height="6"/><rect x="146" y="85" width="5" height="6"/><rect x="155" y="85" width="5" height="6"/>
    <rect x="198" y="75" width="4" height="5"/><rect x="207" y="75" width="4" height="5"/><rect x="198" y="90" width="4" height="5"/><rect x="207" y="90" width="4" height="5"/>
  </g>

  <!-- LAYER 2: Mid-ground Overpass / Bridge structure with heavy traffic feeling -->
  <path d="M 0 150 Q 120 130 240 155 L 240 175 Q 120 150 0 170 Z" fill="#334155"/>
  <rect x="0" y="165" width="240" height="8" fill="#475569"/>

  <!-- Dense Traffic Lights (Streaking cars symbolizing high population/vehicle density) -->
  <path d="M 10 160 Q 80 148 150 158" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 80 166 Q 160 154 230 164" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 30 155 Q 110 143 200 157" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- LAYER 3: Foreground Metro/Street Platform & Stylized Crowded Characters -->
  <!-- Platform floor -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#38bdf8" stroke-width="2"/>

  <!-- Subway/Train Doors in background of platform -->
  <rect x="30" y="170" width="60" height="25" fill="#334155" rx="2"/>
  <rect x="35" y="173" width="23" height="22" fill="#64748b" opacity="0.4"/>
  <rect x="62" y="173" width="23" height="22" fill="#64748b" opacity="0.4"/>

  <rect x="150" y="170" width="60" height="25" fill="#334155" rx="2"/>
  <rect x="155" y="173" width="23" height="22" fill="#64748b" opacity="0.4"/>
  <rect x="182" y="173" width="23" height="22" fill="#64748b" opacity="0.4"/>

  <!-- CROWD OF CHARACTERS (Showing dense population / packed environment) -->
  
  <!-- Character 1 (Left, standing, looking bored/squished) -->
  <g transform="translate(25, 175)">
    <path d="M 10 35 L 20 65 L 5 65 Z" fill="#475569"/>
    <circle cx="15" cy="20" r="10" fill="#fbcfe8"/> <!-- Head -->
    <path d="M 8 15 Q 15 8 22 15 Z" fill="#451a03"/> <!-- Hair -->
    <rect x="7" y="30" width="16" height="25" rx="4" fill="url(#neonPink)"/> <!-- Body -->
  </g>

  <!-- Character 2 (Front-Left, wearing backpack, tightly packed) -->
  <g transform="translate(55, 162)">
    <!-- Backpack -->
    <rect x="2" y="22" width="8" height="20" rx="3" fill="#0284c7"/>
    <!-- Body -->
    <rect x="8" y="20" width="20" height="30" rx="5" fill="url(#neonOrange)"/>
    <!-- Head & Face profile -->
    <circle cx="18" cy="10" r="11" fill="#fed7aa"/>
    <path d="M 10 6 Q 18 2 25 8 Z" fill="#1e293b"/>
    <!-- Arm holding strap -->
    <path d="M 8 25 Q 4 35 12 45" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 3 (Center-Main, smiling slightly, commuting crush) -->
  <g transform="translate(95, 155)">
    <!-- Body / Jacket -->
    <rect x="8" y="25" width="24" height="40" rx="6" fill="url(#neonBlue)"/>
    <!-- Scarf -->
    <path d="M 10 23 Q 20 30 30 23 L 28 32 Q 20 38 12 32 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="20" cy="12" r="12" fill="#fbcfe8"/>
    <!-- Hair stylish -->
    <path d="M 10 10 Q 20 2 30 10 Q 25 5 15 5 Z" fill="#0f172a"/>
    <!-- Smartphone in hand lifted up -->
    <rect x="26" y="35" width="10" height="16" rx="2" fill="#94a3b8"/>
    <rect x="28" y="38" width="6" height="10" fill="#38bdf8"/>
    <path d="M 22 42 Q 26 40 28 38" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 4 (Right-Center, partially behind) -->
  <g transform="translate(132, 165)">
    <rect x="5" y="20" width="20" height="32" rx="5" fill="#10b981"/>
    <circle cx="15" cy="10" r="10" fill="#fde68a"/>
    <path d="M 7 7 Q 15 1 23 7 Z" fill="#b45309"/>
  </g>

  <!-- Character 5 (Far Right, dense crowd edge) -->
  <g transform="translate(170, 160)">
    <rect x="6" y="22" width="22" height="35" rx="5" fill="#8b5cf6"/>
    <circle cx="17" cy="11" r="11" fill="#fed7aa"/>
    <path d="M 9 7 Q 17 0 25 7 Z" fill="#312e81"/>
  </g>

  <!-- Character 6 (Partial edge overlap for ultra-dense feel) -->
  <g transform="translate(205, 168)">
    <rect x="5" y="20" width="18" height="30" rx="4" fill="#f43f5e"/>
    <circle cx="14" cy="10" r="9" fill="#fbcfe8"/>
    <path d="M 8 7 Q 14 2 20 7 Z" fill="#881337"/>
  </g>

  <!-- Ambient lighting/particles floating to enrich vector atmosphere -->
  <circle cx="40" cy="120" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="70" cy="105" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="110" cy="130" r="2" fill="#f43f5e" opacity="0.5"/>
  <circle cx="180" cy="115" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="210" cy="135" r="2" fill="#fbbf24" opacity="0.6"/>

  <!-- Framing Border (Subtle inner stroke for polished app-icon feel) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>