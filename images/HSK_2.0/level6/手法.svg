<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Accent -->
  <circle cx="120" cy="120" r="75" fill="none" stroke="#262B35" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Conceptual Illustration for "Thủ pháp" (Cinematic/Artistic Technique - Camera, Lens, Skill) -->
  <g transform="translate(0, 0)">
    <!-- Main Focus: Professional Camera Lens / Artistic Mechanism (representing technique and method) -->
    
    <!-- Outer Camera Body / Device Base -->
    <rect x="70" y="80" width="100" height="80" rx="16" fill="#2E3646" stroke="#3E4A61" stroke-width="2"/>
    
    <!-- Lens Mount Ring -->
    <circle cx="120" cy="120" r="38" fill="#1A1D24" stroke="#4A5A75" stroke-width="3"/>
    
    <!-- Inner Lens Elements (Aperture / Technique focus) -->
    <circle cx="120" cy="120" r="26" fill="#1F2633"/>
    
    <!-- Aperture Blades / Precision Lines -->
    <path d="M120 94 L120 110" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M146 120 L130 120" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 146 L120 130" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M94 120 L110 120" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Center Glass Reflection -->
    <circle cx="114" cy="114" r="8" fill="#3B82F6" opacity="0.4"/>
    <circle cx="120" cy="120" r="16" fill="none" stroke="#FF9F43" stroke-width="2" opacity="0.8"/>

    <!-- Top Dials / Controls (representing precision and craft) -->
    <rect x="90" y="70" width="20" height="10" rx="3" fill="#4A5A75"/>
    <rect x="130" y="68" width="16" height="12" rx="3" fill="#FF9F43"/>

    <!-- Skill / Creative Spark Elements (Golden Accent) -->
    <path d="M180 75 L184 85 L194 89 L184 93 L180 103 L176 93 L166 89 L176 85 Z" fill="#FFC107"/>
    <path d="M60 145 L62 150 L67 152 L62 154 L60 159 L58 154 L53 152 L58 150 Z" fill="#FFC107" transform="scale(0.8) translate(20, 10)"/>

    <!-- Film strip / Artistic motion accents (contextual to film technique) -->
    <rect x="50" y="170" width="140" height="8" rx="4" fill="#2E3646"/>
    <circle cx="65" cy="174" r="2" fill="#FF9F43"/>
    <circle cx="85" cy="174" r="2" fill="#FF9F43"/>
    <circle cx="105" cy="174" r="2" fill="#FF9F43"/>
    <circle cx="125" cy="174" r="2" fill="#FF9F43"/>
    <circle cx="145" cy="174" r="2" fill="#FF9F43"/>
    <circle cx="165" cy="174" r="2" fill="#FF9F43"/>
    <circle cx="185" cy="174" r="2" fill="#FF9F43"/>
  </g>
</svg>