<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk/Office Environment -->
  <rect x="20" y="140" width="200" height="80" rx="4" fill="#334155"/>
  <rect x="30" y="150" width="180" height="10" rx="2" fill="#475569"/>
  
  <!-- Character 1: The one hiding the criminal -->
  <g transform="translate(130, 80)">
    <circle cx="20" cy="20" r="20" fill="#fcd34d"/>
    <path d="M10 35 Q20 45 30 35" stroke="#78350f" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="80" rx="5" fill="#fb923c"/>
    <path d="M5 50 L-10 70 M35 50 L50 70" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: The criminal hiding behind the desk -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="15" fill="#94a3b8"/>
    <path d="M10 25 Q20 30 30 25" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="10" y="35" width="20" height="40" rx="5" fill="#64748b"/>
  </g>
  
  <!-- Character 3: The authority figure pointing -->
  <g transform="translate(180, 90)">
    <circle cx="20" cy="20" r="20" fill="#38bdf8"/>
    <rect x="10" y="40" width="20" height="80" rx="5" fill="#0284c7"/>
    <path d="M10 50 L-20 60" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 50 L50 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="55" cy="40" r="4" fill="#ec4899"/>
  </g>
  
  <!-- Warning/Prohibition Sign (Abstract) -->
  <circle cx="200" cy="40" r="15" fill="none" stroke="#ef4444" stroke-width="4"/>
  <line x1="190" y1="50" x2="210" y2="30" stroke="#ef4444" stroke-width="4"/>
</svg>