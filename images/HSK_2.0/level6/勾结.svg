<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moneyGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Background Environment / Office Interior -->
  <!-- Wall panels & subtle shadows -->
  <path d="M0 0 H240 V150 H0 Z" fill="#162032"/>
  <rect x="25" y="25" width="50" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <path d="M35 45 H65 M35 60 H55" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Window with city night silhouette -->
  <path d="M165 25 H210 V95 H165 Z" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
  <path d="M175 45 L180 35 L185 45 L190 30 L195 55 L200 40 L205 60 V95 H175 Z" fill="#1e293b" opacity="0.6"/>
  <circle cx="200" cy="35" r="2" fill="#fbbf24" opacity="0.8"/>

  <!-- Overhead Suspended Lamp -->
  <path d="M120 0 V35" stroke="#475569" stroke-width="2"/>
  <path d="M100 35 H140 L145 45 H95 Z" fill="#475569"/>
  <polygon points="95,45 145,45 160,150 80,150" fill="url(#warmLamp)"/>

  <!-- Office Desk Surface -->
  <path d="M10 150 H230 V220 H10 Z" fill="url(#deskGradient)"/>
  <path d="M10 150 H230 V156 H10 Z" fill="#475569"/>

  <!-- CONTEXT PROPS: Documents, Laptop, Stolen Money / Scheme -->
  <!-- Laptop -->
  <path d="M60 145 L70 125 H110 L120 145 Z" fill="#64748b"/>
  <rect x="65" y="127" width="45" height="16" rx="1" fill="#38bdf8" opacity="0.3"/>

  <!-- Documents & Blueprint of the Scam -->
  <rect x="135" y="130" width="30" height="22" rx="1" fill="#f8fafc" transform="rotate(-10 135 130)"/>
  <line x1="140" y1="135" x2="158" y2="135" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="141" x2="152" y2="141" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="155" cy="145" r="3" fill="#ef4444" opacity="0.8"/>

  <!-- Pile of Stolen Money / Cash Bag -->
  <ellipse cx="105" cy="148" rx="22" ry="7" fill="url(#moneyGlow)"/>
  <rect x="92" y="138" width="22" height="12" rx="2" fill="#10b981" transform="rotate(15 92 138)"/>
  <rect x="96" y="134" width="20" height="12" rx="2" fill="#059669" transform="rotate(-5 96 134)"/>
  <path d="M102 138 H110 M102 142 H110" stroke="#d1fae5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- MAIN CHARACTERS: Two figures "colluding" (勾结) in secret -->
  
  <!-- Character Left (The Schemer 1) -->
  <g transform="translate(45, 80)">
    <!-- Body & Suit -->
    <path d="M25 70 C25 55 35 45 50 45 C65 45 75 55 75 70 V100 H25 Z" fill="#1e293b"/>
    <path d="M38 45 L50 65 L62 45 Z" fill="#f8fafc"/> <!-- Shirt collar -->
    <path d="M47 55 L50 70 L53 55 Z" fill="#ef4444"/> <!-- Tie -->
    
    <!-- Head & Shifty Face -->
    <circle cx="50" cy="32" r="16" fill="#fed7aa"/>
    <!-- Sleek Hair -->
    <path d="M35 30 C35 20 45 16 55 18 C62 19 65 25 65 25 Z" fill="#0f172a"/>
    <!-- Smirking Eyes (Sideways glance towards partner) -->
    <path d="M42 30 Q46 27 50 30" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M54 30 Q58 27 62 30" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Sly Smirk -->
    <path d="M45 38 Q50 43 55 37" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Arms leaning over desk -->
    <path d="M25 75 Q15 85 20 95" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="95" r="6" fill="#fed7aa"/>
  </g>

  <!-- Character Right (The Schemer 2 - leaning in, whispering/colluding) -->
  <g transform="translate(130, 75)">
    <!-- Body & Jacket -->
    <path d="M25 75 C25 60 35 50 50 50 C65 50 75 60 75 75 V105 H25 Z" fill="#334155"/>
    <path d="M38 50 L50 70 L62 50 Z" fill="#f8fafc"/>
    <path d="M47 60 L50 75 L53 60 Z" fill="#38bdf8"/>
    
    <!-- Head & Expression -->
    <circle cx="45" cy="30" r="15" fill="#fcd34d"/>
    <!-- Dark curly/messy hair -->
    <path d="M32 28 C32 18 40 15 52 18 C58 20 58 28 58 28 Z" fill="#334155"/>
    <!-- Suspicious Eyes looking left -->
    <path d="M37 28 Q41 25 45 28" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M48 28 Q52 25 56 28" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Grin -->
    <path d="M40 37 Q46 42 52 36" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Hand pointing at money / scheming gesture -->
    <path d="M75 80 Q85 85 80 95" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="82" cy="94" r="5" fill="#fcd34d"/>
  </g>

  <!-- Dramatic Lighting/Atmosphere Overlays -->
  <!-- Subtle vignette -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.6"/>
</svg>