<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Hologram / Glow Gradients -->
    <linearGradient id="holoBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="dnaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Lab Environment -->
  <!-- Back Wall Details / Shelves -->
  <rect x="30" y="40" width="70" height="6" rx="3" fill="#334155"/>
  <rect x="40" y="25" width="12" height="15" rx="2" fill="#64748b"/>
  <rect x="58" y="20" width="16" height="20" rx="2" fill="#0ea5e9"/>
  <rect x="78" y="28" width="10" height="12" rx="2" fill="#10b981"/>

  <rect x="140" y="50" width="70" height="6" rx="3" fill="#334155"/>
  <circle cx="155" cy="38" r="8" fill="#f59e0b"/>
  <path d="M 175 46 L 185 46 L 180 35 Z" fill="#ec4899"/>

  <!-- Large Lab Window / Sci-Fi Grid lines -->
  <path d="M 30 180 L 210 180" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Laboratory Desk / Console -->
  <path d="M 20 180 L 220 180 L 210 215 L 30 215 Z" fill="#0f172a" filter="url(#shadow)"/>
  <rect x="20" y="175" width="200" height="8" rx="4" fill="#475569"/>

  <!-- Holographic Projector Base on Desk -->
  <path d="M 95 185 L 145 185 L 135 175 L 105 175 Z" fill="#64748b"/>
  <ellipse cx="120" cy="175" rx="20" ry="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Holographic Light Cone -->
  <polygon points="120,80 90,175 150,175" fill="url(#holoBeam)"/>

  <!-- Central Floating DNA Double Helix (Gene Visualization) -->
  <g filter="url(#glow)">
    <!-- DNA Strand 1 (Pink/Purple) -->
    <path d="M 105 90 C 135 100, 105 120, 135 130 C 105 140, 105 160, 135 170" 
          fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <!-- DNA Strand 2 (Blue/Cyan) -->
    <path d="M 135 90 C 105 100, 135 120, 105 130 C 135 140, 135 160, 105 170" 
          fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- DNA Base Pairs (Rungs) -->
    <line x1="120" y1="95" x2="120" y2="95" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <line x1="112" y1="110" x2="128" y2="110" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="125" x2="120" y2="125" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="112" y1="140" x2="128" y2="140" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="155" x2="120" y2="155" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="112" y1="168" x2="128" y2="168" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

    <!-- Floating Gene Nodes / Sparks -->
    <circle cx="100" cy="115" r="3" fill="#fb923c"/>
    <circle cx="140" cy="145" r="2.5" fill="#34d399"/>
    <circle cx="120" cy="85" r="2" fill="#f43f5e"/>
  </g>

  <!-- Scientist Character (Right side, examining the DNA) -->
  <!-- Body/Lab Coat -->
  <path d="M 175 140 L 195 140 L 205 180 L 165 180 Z" fill="#cbd5e1" filter="url(#shadow)"/>
  <path d="M 180 140 L 190 140 L 195 180 L 185 180 Z" fill="#94a3b8"/> <!-- Coat opening -->
  <path d="M 178 140 L 187 155 L 196 140 Z" fill="#1e293b"/> <!-- Inner shirt -->

  <!-- Scientist Head & Hair -->
  <circle cx="186" cy="118" r="16" fill="#fbcfe8"/> <!-- Face tone -->
  <!-- Hair (Stylish dark teal/slate) -->
  <path d="M 170 118 C 170 102, 202 102, 202 118 C 202 122, 198 120, 195 115 C 190 110, 180 110, 175 115 C 172 118, 170 118, 170 118 Z" fill="#0f172a"/>
  
  <!-- Facial expression: Focused, amazed eyes looking at the hologram -->
  <circle cx="191" cy="117" r="1.5" fill="#0f172a"/>
  <!-- Smile line indicating realization/discovery -->
  <path d="M 189 124 Q 193 127 196 124" fill="none" fill-opacity="0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cute round glasses -->
  <circle cx="191" cy="117" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Scientist Arm Pointing / Gesturing at DNA -->
  <path d="M 178 145 C 160 145, 150 150, 142 150" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="140" cy="150" r="3" fill="#fbcfe8"/>

  <!-- Second Character / Student observing (Left side) -->
  <!-- Body / Casual Hoodie -->
  <path d="M 45 150 L 70 150 L 78 180 L 37 180 Z" fill="#0ea5e9" filter="url(#shadow)"/>
  <!-- Hoodie Strings & Detail -->
  <line x1="53" y1="150" x2="53" y2="165" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="62" y1="150" x2="62" y2="165" stroke="#e0f2fe" stroke-width="2"/>

  <!-- Student Head & Hair -->
  <circle cx="58" cy="122" r="15" fill="#ffedd5"/>
  <!-- Curly / Textured Hair -->
  <path d="M 43 122 C 43 108, 73 108, 73 122 C 75 115, 70 104, 58 104 C 46 104, 41 115, 43 122 Z" fill="#78350f"/>
  
  <!-- Expression: Intrigued, wide-eyed -->
  <circle cx="63" cy="121" r="1.5" fill="#78350f"/>
  <path d="M 61 127 Q 64 130 67 127" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Student Arm resting on desk, chin in hand thinking/observing -->
  <path d="M 55 155 C 55 165, 65 170, 72 175" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="73" cy="173" r="3" fill="#ffedd5"/> <!-- Hand supporting chin -->

  <!-- Foreground Lab Equipment Props -->
  <!-- Microscope / Analyzer on Left -->
  <rect x="25" y="150" width="14" height="25" rx="3" fill="#64748b"/>
  <path d="M 22 175 L 42 175 L 38 165 L 26 165 Z" fill="#475569"/>
  <circle cx="32" cy="148" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M 32 144 L 38 140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Tablet / Control Screen on Right Desk -->
  <rect x="180" y="185" width="30" height="22" rx="3" transform="rotate(-10 180 185)" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <!-- Screen UI graphics (abstract waves/charts, NO text) -->
  <path d="M 185 198 L 190 193 L 195 196 L 202 188" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="202" cy="188" r="1.5" fill="#34d399"/>

  <!-- Ambient lighting highlights -->
  <circle cx="120" cy="30" r="40" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
</svg>