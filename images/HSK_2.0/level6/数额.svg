<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(36, 45)">
    <!-- Subtle background card representing a financial document/loan statement -->
    <rect x="12" y="12" width="144" height="126" rx="12" fill="#252A34" opacity="0.6"/>
    
    <!-- Main physical document / ledger -->
    <rect x="0" y="0" width="144" height="126" rx="12" fill="#2F3643"/>
    
    <!-- Document header elements -->
    <rect x="18" y="20" width="40" height="8" rx="4" fill="#4B5563"/>
    <rect x="18" y="34" width="70" height="6" rx="3" fill="#374151"/>
    
    <!-- Decorative graph bars representing quantity/amount growth -->
    <rect x="18" y="70" width="14" height="32" rx="4" fill="#3B82F6" opacity="0.5"/>
    <rect x="38" y="58" width="14" height="44" rx="4" fill="#3B82F6" opacity="0.7"/>
    <rect x="58" y="46" width="14" height="56" rx="4" fill="#3B82F6"/>
    
    <!-- Financial currency coin / token representing the concrete physical unit of the amount -->
    <circle cx="108" cy="74" r="28" fill="#F59E0B"/>
    <circle cx="108" cy="74" r="22" fill="#D97706"/>
    <!-- Currency symbol / abstract value marker inside coin -->
    <path d="M102 64h12M108 62v24M102 86h12" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Confirmation / Checkmark badge indicating "determined/confirmed" (已确定) -->
    <circle cx="132" cy="24" r="16" fill="#10B981"/>
    <path d="M124 24l5 5 10-10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>