<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Raindrop Path -->
    <path id="drop" d="M0,0 C-1,3 -1,4 0,6 C1,4 1,3 0,0 Z" fill="#38bdf8" opacity="0.6" />
    
    <!-- Backpack Gradient -->
    <linearGradient id="backpack-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Warm Indoor Light -->
    <radialGradient id="indoor-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Living Room Interior -->
  <!-- Floor -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />
  
  <!-- Wallpaper/Wall Texture -->
  <rect x="0" y="0" width="240" height="190" fill="#1e293b" />
  <path d="M0,40 H240 M0,80 H240 M0,120 H240 M0,160 H240" stroke="#25354a" stroke-width="1" opacity="0.5" />

  <!-- Indoor Shelf & Plants -->
  <rect x="15" y="90" width="55" height="6" rx="3" fill="#475569" />
  <!-- Small Plant on Shelf -->
  <path d="M35,90 C35,80 38,75 42,70 C46,75 49,80 49,90 Z" fill="#10b981" />
  <path d="M42,90 L42,80" stroke="#065f46" stroke-width="2" />
  <path d="M32,90 C32,82 35,78 39,73" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M52,90 C52,82 49,78 45,73" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M35,90 L49,90 C49,94 45,96 42,96 C39,96 35,94 35,90 Z" fill="#f8fafc" />

  <!-- Large Window (Center-Right) overlooking stormy outdoors -->
  <g id="window">
    <!-- Window Frame Outer -->
    <rect x="130" y="30" width="85" height="135" rx="4" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <!-- Window Pane Sky Background (Stormy Dark Blue) -->
    <rect x="134" y="34" width="77" height="127" fill="#0b1329" />
    
    <!-- Distant Dark Clouds -->
    <path d="M134,50 Q145,40 160,50 Q175,40 190,50 Q205,42 211,50 V70 H134 Z" fill="#1e293b" opacity="0.8" />

    <!-- Rain outside window -->
    <line x1="145" y1="50" x2="140" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="165" y1="45" x2="160" y2="65" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="185" y1="55" x2="180" y2="75" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="195" y1="40" x2="190" y2="60" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    
    <line x1="138" y1="80" x2="133" y2="100" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="158" y1="75" x2="153" y2="95" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="178" y1="85" x2="173" y2="105" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="202" y1="70" x2="197" y2="90" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

    <!-- Windowpane Cross Grid -->
    <line x1="134" y1="97" x2="211" y2="97" stroke="#475569" stroke-width="3" />
    <line x1="172" y1="34" x2="172" y2="161" stroke="#475569" stroke-width="3" />

    <!-- Window Light Projection on Floor/Wall -->
    <polygon points="120,190 230,190 220,130 140,130" fill="url(#window-light)" />
  </g>

  <!-- Props: Travel Backpack & Hiking Gear (Ready to go, but paused) -->
  <g id="travel-gear" transform="translate(95, 130)">
    <!-- Backpack -->
    <rect x="0" y="10" width="24" height="34" rx="8" fill="url(#backpack-grad)" />
    <path d="M4,10 C4,4 20,4 20,10" fill="none" stroke="#be185d" stroke-width="3" />
    <rect x="6" y="18" width="12" height="16" rx="4" fill="#9d174d" />
    <!-- Straps -->
    <path d="M6,10 L2,25" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" />
    <path d="M18,10 L22,25" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" />
    <!-- Hiking Pole leaned next to bag -->
    <line x1="28" y1="5" x2="24" y2="48" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="28.5" cy="4" r="2" fill="#f59e0b" />
  </g>

  <!-- CHARACTER 1: Person pointing at the window / discussing (Left) -->
  <g id="character-1" transform="translate(25, 80)">
    <!-- Body & Hoodie (Amber/Orange accent) -->
    <path d="M35,60 C35,48 45,45 55,50 L65,85 L20,85 Z" fill="#fbbf24" />
    <!-- Head -->
    <circle cx="50" cy="30" r="14" fill="#fcd34d" />
    <!-- Hair (Stylish dark brown/slate) -->
    <path d="M37,28 C37,18 50,15 63,22 C61,16 48,16 39,22 Z" fill="#334155" />
    <path d="M37,28 C36,32 39,36 43,35" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    
    <!-- Face Profile (Looking right towards window) -->
    <!-- Eye -->
    <circle cx="56" cy="29" r="1.5" fill="#1e293b" />
    <!-- Mouth (Speaking/Thoughtful expression) -->
    <path d="M55,36 C57,37 59,36 60,35" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm pointing towards window -->
    <!-- Back arm -->
    <path d="M40,55 L25,70" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <!-- Front arm pointing right -->
    <path d="M55,55 L75,45" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
    <circle cx="77" cy="44" r="4" fill="#fcd34d" /> <!-- Hand -->

    <!-- Legs/Pants -->
    <path d="M32,85 L32,110" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <path d="M52,85 L54,110" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <!-- Shoes -->
    <path d="M26,110 L36,110 C38,110 38,114 36,114 L26,114 Z" fill="#0f172a" />
    <path d="M48,110 L58,110 C60,110 60,114 58,114 L48,114 Z" fill="#0f172a" />
  </g>

  <!-- CHARACTER 2: Second person listening/observing (Center-Left) -->
  <g id="character-2" transform="translate(75, 75)">
    <!-- Body & Jacket (Teal/Green accent) -->
    <path d="M30,65 C30,52 42,50 52,55 L62,95 L18,95 Z" fill="#38bdf8" />
    
    <!-- Head -->
    <circle cx="42" cy="27" r="13" fill="#fcd34d" />
    <!-- Hair (Short dark) -->
    <path d="M30,25 C31,17 40,15 52,20 C48,15 36,16 30,25 Z" fill="#1e293b" />

    <!-- Face looking right -->
    <circle cx="47" cy="26" r="1.5" fill="#1e293b" />
    <!-- Concerned/Contemplative mouth -->
    <path d="M45,33 Q48,31 51,33" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms crossed or holding chin (Thoughtful pose) -->
    <path d="M32,60 C38,62 45,62 52,58" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <path d="M36,58 C40,68 46,68 50,60" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />

    <!-- Legs -->
    <path d="M28,95 L26,120" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <path d="M48,95 L50,120" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <!-- Shoes -->
    <path d="M20,120 L30,120 C32,120 32,124 30,124 L20,124 Z" fill="#0f172a" />
    <path d="M44,120 L54,120 C56,120 56,124 54,124 L44,124 Z" fill="#0f172a" />
  </g>

  <!-- Indoor Foreground Ambient Elements -->
  <!-- Coffee Table with Weather App / Map props -->
  <g id="table" transform="translate(60, 160)">
    <!-- Table top -->
    <ellipse cx="40" cy="10" rx="45" ry="12" fill="#334155" />
    <ellipse cx="40" cy="8" rx="43" ry="10" fill="#475569" />
    <!-- Table legs -->
    <path d="M10,15 L5,35" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <path d="M70,15 L75,35" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    
    <!-- Weather/Trip Planner Prop (Tablet or Map on table showing rain icon concept) -->
    <rect x="25" y="4" width="22" height="14" rx="2" fill="#f8fafc" transform="rotate(-10 36 11)" />
    <circle cx="33" cy="10" r="3" fill="#38bdf8" />
    <path d="M38,12 L43,9" stroke="#ef4444" stroke-width="2" stroke-linecap="round" /> <!-- Cancel/Cross out line indicating trip cancelled -->
  </g>

  <!-- Additional indoor cozy lighting overlay -->
  <circle cx="100" cy="50" r="90" fill="url(#indoor-glow)" pointer-events="none" />

  <!-- Falling Rain Effects Inside Foreground (Depth layering) -->
  <use href="#drop" x="155" y="100" />
  <use href="#drop" x="185" y="130" />
  <use href="#drop" x="140" y="145" />

</svg>