<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Deep Canyon Walls -->
  <path d="M40 40 L80 240 L0 240 L0 40 Z" fill="#2C3E50"/>
  <path d="M200 40 L160 240 L240 240 L240 40 Z" fill="#2C3E50"/>
  
  <!-- Canyon Depth/Shadows -->
  <path d="M60 60 L90 240 L30 240 Z" fill="#16212B"/>
  <path d="M180 60 L150 240 L210 240 Z" fill="#16212B"/>
  
  <!-- River at the bottom -->
  <path d="M90 240 L120 180 L150 240 Z" fill="#3498DB"/>
  
  <!-- Highlights on edges -->
  <path d="M40 40 L80 240" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 40 L160 240" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Distant sky/horizon hint -->
  <path d="M80 40 L160 40 L120 120 Z" fill="#243447"/>
</svg>