<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Hallway Glow -->
    <radialGradient id="doorLight" cx="0.8" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Motion Blur / Shadow -->
    <filter id="motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Environment: Modern Room with Open Door -->
  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a"/>
  <!-- Baseboard -->
  <rect x="0" y="164" width="240" height="6" fill="#334155"/>

  <!-- Wall Background -->
  <rect x="0" y="0" width="240" height="164" fill="#1e293b"/>

  <!-- Window with Night City Silhouette -->
  <rect x="25" y="30" width="45" height="75" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <path d="M35 50 h10 v55 h-10 z M50 40 h10 v65 h-10 z" fill="#1e293b" opacity="0.5"/>
  <!-- Window city lights -->
  <circle cx="32" cy="70" r="1" fill="#fbbf24"/>
  <circle cx="62" cy="85" r="1.5" fill="#38bdf8"/>

  <!-- Wall Decor / Clock showing running late (hands askew) -->
  <circle cx="105" cy="45" r="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <polyline points="105,37 105,45 112,45" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- Open Doorway & Exterior Hallway -->
  <!-- Hallway light cast -->
  <path d="M165 40 L210 25 L210 200 L165 170 Z" fill="url(#doorLight)"/>
  <!-- Door frame -->
  <path d="M160 20 L215 20 L215 190 L160 190 Z" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <!-- Open Door panel swinging out -->
  <path d="M160 20 L140 30 L140 180 L160 190 Z" fill="#334155" opacity="0.8"/>
  <circle cx="152" cy="105" r="2.5" fill="#94a3b8"/>

  <!-- Dropped Desk Prop (showing sudden panic/rush) -->
  <rect x="25" y="130" width="55" height="35" rx="2" fill="#334155"/>
  <rect x="30" y="110" width="25" height="20" rx="1" fill="#475569"/>
  <!-- Fallen chair -->
  <path d="M85 145 L105 160 M90 140 L75 155 M95 152 L110 165" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Flying papers/documents -->
  <path d="M60 120 l12 -8 l6 10 l-12 8 z" fill="#f8fafc" transform="rotate(-15 65 120)"/>
  <path d="M95 95 l10 -6 l4 8 l-10 6 z" fill="#e2e8f0" transform="rotate(35 100 95)"/>
  <circle cx="75" cy="140" r="3" fill="#f43f5e"/> <!-- Fallen coffee cup / splash -->

  <!-- Main Subject: Character in 'Huángmáng' (Panic/Rush) Motion -->
  <g transform="translate(10, 0)">
    <!-- Motion Lines Behind Character -->
    <path d="M75 110 h-15 M70 135 h-25 M80 90 h-10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#motionBlur)"/>
    <path d="M65 160 h-20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Trailing coat / scarf tail -->
    <path d="M110 95 C95 100 80 120 70 135 C85 130 95 115 105 105 Z" fill="#ef4444"/>

    <!-- Character Body (Leaning forward dynamically) -->
    <!-- Left Leg (Back, pushing off) -->
    <path d="M105 130 L85 170 L70 170" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 130 L85 170 L70 170" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoe Left -->
    <ellipse cx="68" cy="172" rx="6" ry="3" fill="#0f172a"/>

    <!-- Right Leg (Front, striding outward) -->
    <path d="M120 130 L135 165 L150 168" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 130 L135 165 L150 168" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoe Right -->
    <ellipse cx="153" cy="170" rx="7" ry="3.5" fill="#0f172a"/>

    <!-- Torso (Dynamic forward lean) -->
    <path d="M100 85 L130 95 L120 135 L95 125 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- White shirt collar / tie fluttering -->
    <path d="M110 88 L122 93 L118 105 Z" fill="#f8fafc"/>
    <path d="M117 93 L132 105 L125 115 Z" fill="#1d4ed8"/>

    <!-- Left Arm (Flailing backward in panic) -->
    <path d="M105 90 L85 105 L75 100" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="73" cy="99" r="3.5" fill="#fcd34d"/> <!-- Hand -->

    <!-- Right Arm (Reaching forward toward the door) -->
    <path d="M125 95 L145 100 L160 95" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="162" cy="94" r="3.5" fill="#fcd34d"/> <!-- Hand reaching out -->

    <!-- Head & Expressive Face (Wide eyes, open mouth = panic) -->
    <g transform="translate(122, 70)">
      <!-- Hair flying back -->
      <path d="M-5 -2 C5 -10 15 -5 20 2 C10 0 2 -3 -5 -2 Z" fill="#0f172a"/>
      <!-- Head base -->
      <circle cx="8" cy="6" r="10" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
      <!-- Surprised/Panic Wide Eye -->
      <circle cx="11" cy="4" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <circle cx="12" cy="4" r="1.2" fill="#0f172a"/>
      <!-- Eyebrow arched high in shock -->
      <path d="M7 -1 L14 -3" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Open mouth (gasping/rushing) -->
      <ellipse cx="13" cy="11" rx="2.5" ry="3.5" fill="#78350f"/>
      <!-- Cheek flush (panic sweat/blush) -->
      <circle cx="8" cy="9" r="2" fill="#f43f5e" opacity="0.6"/>
    </g>
  </g>

  <!-- Foreground Floor Shadow for Depth -->
  <ellipse cx="110" cy="172" rx="55" ry="5" fill="#090d16" opacity="0.4"/>
  <ellipse cx="140" cy="171" rx="20" ry="3" fill="#090d16" opacity="0.6"/>
</svg>