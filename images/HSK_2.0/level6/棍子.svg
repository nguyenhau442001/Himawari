<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    
    <!-- Warm Accent Light -->
    <radialGradient id="amberGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Stick Gradient -->
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Character Clothing Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>
  <rect width="240" height="240" rx="24" fill="url(#amberGlow)"/>

  <!-- Environment / Background Elements (Hiking Trail / Park Scene) -->
  <g opacity="0.6">
    <!-- Distant Hills -->
    <path d="M-10 180 Q 60 130 140 165 T 260 150 L 260 240 L -10 240 Z" fill="#131c2e"/>
    <path d="M20 200 Q 100 150 190 180 T 250 170 L 250 240 L 20 240 Z" fill="#172338"/>
    
    <!-- Pine Trees / Foliage -->
    <polygon points="40,160 50,135 60,160" fill="#1e293b"/>
    <polygon points="45,150 50,140 55,150" fill="#334155"/>
    <polygon points="200,165 210,140 220,165" fill="#1e293b"/>
    <polygon points="190,175 198,155 206,175" fill="#172338"/>

    <!-- Pathway -->
    <path d="M 60 240 Q 110 190 220 220 L 240 240 Z" fill="#22304a" opacity="0.8"/>
  </g>

  <!-- Main Character (Man holding a stick) -->
  <g filter="url(#shadow)">
    
    <!-- Back Foot & Leg -->
    <path d="M 100 190 L 110 225 L 125 228" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="127" cy="227" rx="8" ry="4" fill="#64748b"/>

    <!-- Torso (Slightly turned/active hiking pose) -->
    <path d="M 90 130 L 125 135 L 120 195 L 95 190 Z" fill="url(#jacketGrad)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Backpack details -->
    <path d="M 82 135 Q 75 160 85 185 L 92 180 Q 85 160 90 140 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M 75 155 L 85 158" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Leg & Foot -->
    <path d="M 105 190 L 100 220 L 88 226" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="84" cy="226" rx="9" ry="4.5" fill="#64748b"/>

    <!-- Head & Face -->
    <!-- Neck -->
    <rect x="100" y="118" width="14" height="16" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>
    <!-- Head Shape -->
    <circle cx="107" cy="98" r="22" fill="#fed7aa" stroke="#0f172a" stroke-width="3"/>
    <!-- Hair (Adventurous messy style) -->
    <path d="M 85 98 C 85 78 125 78 128 95 C 122 90 115 88 107 89 C 95 89 88 94 85 98 Z" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Friendly Confident Face Expressions -->
    <!-- Eye (Happy squint / focused) -->
    <path d="M 108 96 Q 114 93 118 97" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Gentle Smile -->
    <path d="M 112 105 Q 116 109 120 106" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks (Warm accent) -->
    <circle cx="120" cy="102" r="4" fill="#fb7185" opacity="0.6"/>

    <!-- Back Arm -->
    <path d="M 115 135 L 135 155 L 125 170" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="124" cy="172" r="5" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>

    <!-- Front Arm & Hand (Holding the Stick) -->
    <!-- Shoulder to elbow -->
    <path d="M 95 135 L 80 155" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round"/>
    <!-- Forearm reaching forward/down -->
    <path d="M 80 155 L 105 175" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand grip -->
    <circle cx="106" cy="176" r="6" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/>

  </g>

  <!-- THE STICK (棍子 - gùnzi) - Prominently featured in hand and touching the ground -->
  <g filter="url(#shadow)">
    <line x1="125" y1="95" x2="85" y2="232" stroke="url(#stickGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Stick knots/texture details -->
    <path d="M 110 150 Q 113 152 111 155" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 98 190 Q 95 192 97 195" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Highlight on stick -->
    <line x1="122" y1="99" x2="103" y2="165" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Foreground Nature Details (Leaves, pebbles enhancing realism) -->
  <g opacity="0.85">
    <!-- Glowing Fireflies / Nature Sparkles -->
    <circle cx="155" cy="120" r="3" fill="#fbbf24" filter="url(#shadow)"/>
    <circle cx="60" cy="100" r="2" fill="#38bdf8"/>
    <circle cx="185" cy="80" r="2.5" fill="#fbbf24"/>
    
    <!-- Cute grass tufts at bottom -->
    <path d="M 30 240 Q 33 220 38 240" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 35 240 Q 40 225 45 240" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    
    <path d="M 205 240 Q 210 215 218 240" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 212 240 Q 217 225 225 240" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>