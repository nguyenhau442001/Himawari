<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Kitchen Light Glow -->
    <radialGradient id="kitchenGlow" cx="120" cy="90" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Egg Yolk Gradient -->
    <radialGradient id="yolkGrad" cx="35" cy="35" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>

    <!-- Protein Sparkle Glow -->
    <radialGradient id="sparkleGlow" cx="50" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Bowl/Pan -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#kitchenGlow)"/>

  <!-- Kitchen Environment Details -->
  <!-- Wooden Countertop -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <rect x="0" y="175" width="240" height="8" fill="#334155" rx="2"/>
  <rect x="0" y="183" width="240" height="2" fill="#090d16"/>
  
  <!-- Kitchen Background Tile Lines / Shelving Hint -->
  <line x1="20" y1="40" x2="220" y2="40" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <circle cx="200" cy="40" r="8" fill="#475569" opacity="0.3"/>

  <!-- Floating Protein Nutritional Energy Particles & Icons (Abstract representation of nutrient richness) -->
  <g transform="translate(18, 55)">
    <circle cx="0" cy="0" r="22" fill="url(#sparkleGlow)"/>
    <path d="M 0,-8 C 4,-8 7,-5 7,-1 C 7,4 0,9 0,9 C 0,9 -7,4 -7,-1 C -7,-5 -4,-8 0,-8 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
  <g transform="translate(210, 80)">
    <circle cx="0" cy="0" r="26" fill="url(#sparkleGlow)"/>
    <path d="M 0,-10 C 5,-10 9,-6 9,-1 C 9,5 0,11 0,11 C 0,11 -9,5 -9,-1 C -9,-6 -5,-10 0,-10 Z" fill="#10b981" opacity="0.8"/>
  </g>
  <path d="M 195,120 Q 202,110 209,120 T 223,120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 25,125 Q 31,118 37,125" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Character: Chef / Cooking Enthusiast (Head and Shoulders profile focused on cooking) -->
  <g id="character">
    <!-- Chef Jacket / Apron Base -->
    <path d="M 50,240 C 50,205 70,180 95,180 L 145,180 C 170,180 190,205 190,240 Z" fill="#334155"/>
    <path d="M 75,180 L 95,240 L 145,240 L 165,180 Z" fill="#f8fafc"/>
    <!-- Apron Straps / Details -->
    <path d="M 95,180 L 105,240" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M 145,180 L 135,240" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="120" cy="200" r="3" fill="#0f172a"/>

    <!-- Neck & Head -->
    <rect x="105" y="145" width="30" height="40" fill="#fbcfe8" rx="6"/>
    <path d="M 105,155 Q 120,165 135,155" fill="#f43f5e" opacity="0.2"/> <!-- Neck shadow -->
    
    <!-- Face Shape -->
    <path d="M 95,115 C 95,95 145,95 145,115 L 145,145 C 145,165 95,165 95,145 Z" fill="#fde68a" />
    <path d="M 100,110 C 100,90 140,90 140,110 L 140,135 C 140,150 100,150 100,135 Z" fill="#fcd34d" opacity="0.15"/> <!-- Skin contour -->

    <!-- Friendly Cheeks & Eyes -->
    <circle cx="108" cy="130" r="4" fill="#1e293b"/>
    <circle cx="132" cy="130" r="4" fill="#1e293b"/>
    <!-- Happy curved eyebrows -->
    <path d="M 104,122 Q 108,119 112,122" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 128,122 Q 132,119 136,122" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="104" cy="138" r="5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="136" cy="138" r="5" fill="#f43f5e" opacity="0.3"/>

    <!-- Gentle Smile -->
    <path d="M 115,140 Q 120,145 125,140" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Hair -->
    <path d="M 95,115 C 95,90 145,90 145,115 C 145,100 95,100 95,115 Z" fill="#0f172a"/>
    <path d="M 93,112 Q 97,95 110,92 Q 125,90 142,100 Q 148,110 147,120 C 147,120 140,98 120,96 C 100,94 93,112 93,112 Z" fill="#1e293b"/>

    <!-- Chef Hat -->
    <path d="M 102,92 C 95,92 90,75 102,68 C 96,50 115,45 124,55 C 135,45 152,55 142,70 C 150,78 145,92 138,92 Z" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M 100,92 L 140,92 L 138,100 L 102,100 Z" fill="#f1f5f9"/>
  </g>

  <!-- Main Prop: Ceramic Mixing Bowl on Counter (Full of Eggs & Rich Protein Context) -->
  <g id="bowl-and-eggs" filter="url(#shadow)">
    <!-- Bowl Back Inner -->
    <ellipse cx="120" cy="148" rx="55" ry="18" fill="#e2e8f0"/>
    
    <!-- Bowl Contents (Whites & Yolks) -->
    <ellipse cx="120" cy="150" rx="50" ry="15" fill="#ffffff"/>
    
    <!-- Egg 1 (Cracked/Floating Yolk in center) -->
    <circle cx="110" cy="150" r="14" fill="url(#yolkGrad)"/>
    <circle cx="106" cy="146" r="4" fill="#ffffff" opacity="0.6"/> <!-- Highlight -->

    <!-- Egg 2 (Partial/Second Yolk) -->
    <circle cx="140" cy="153" r="10" fill="url(#yolkGrad)"/>

    <!-- Bowl Front Body -->
    <path d="M 65,148 C 65,185 175,185 175,148 C 175,178 65,178 65,148 Z" fill="#f8fafc"/>
    <path d="M 65,148 C 65,185 175,185 175,148 C 175,178 65,178 65,148 Z" fill="#3b82f6" opacity="0.1"/>
    
    <!-- Bowl Rim -->
    <ellipse cx="120" cy="148" rx="55" ry="18" fill="none" stroke="#cbd5e1" stroke-width="4"/>
  </g>

  <!-- Whole Egg Beside the Bowl (Reinforcing the "Trứng" / Egg context) -->
  <g id="whole-egg" filter="url(#shadow)" transform="translate(48, 160)">
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#fdfbf7"/>
    <!-- Subtle Egg Shading -->
    <path d="M 0,-18 C 8,-18 14,-8 14,0 C 14,10 6,18 0,18 C -2,18 -5,12 -5,0 C -5,-10 -2,-18 0,-18 Z" fill="#f1e7d0" opacity="0.5"/>
    <ellipse cx="-4" cy="-6" rx="4" ry="2" fill="#ffffff" opacity="0.8" transform="rotate(-30 -4 -6)"/>
  </g>

  <!-- Whisk tool partially in the bowl -->
  <g id="whisk" filter="url(#shadow)" transform="translate(145, 120) rotate(25)">
    <!-- Whisk Handle -->
    <rect x="-3" y="-30" width="6" height="35" rx="3" fill="#cbd5e1"/>
    <rect x="-2" y="-30" width="4" height="35" rx="2" fill="#f1f5f9"/>
    <circle cx="0" cy="-30" r="3" fill="#94a3b8"/>
    
    <!-- Whisk Wires -->
    <path d="M 0,5 C -10,15 -12,25 0,35 C 12,25 10,15 0,5 Z" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0,5 C -5,15 -6,25 0,35 C 6,25 5,15 0,5 Z" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <path d="M -3,12 C -12,18 -10,28 -1,34" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 3,12 C 12,18 10,28 1,34" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Glowing Nutritional Aura / Sparkles around the Bowl to emphasize 'Rich in Protein' -->
  <g id="protein-sparkles">
    <!-- Star Sparkle 1 (Top Left of bowl) -->
    <path d="M 75,115 Q 82,115 82,108 Q 82,115 89,115 Q 82,115 82,122 Q 82,115 75,115 Z" fill="#38bdf8"/>
    <!-- Star Sparkle 2 (Top Right of bowl) -->
    <path d="M 160,110 Q 166,110 166,104 Q 166,110 172,110 Q 166,110 166,116 Q 166,110 160,110 Z" fill="#fbbf24"/>
    <!-- Small dot sparkles -->
    <circle cx="95" cy="100" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="150" cy="95" r="2" fill="#10b981" opacity="0.8"/>
    <circle cx="120" cy="85" r="3" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Dynamic Highlight Overlay for Glossy Finish -->
  <path d="M 0,0 L 240,0 L 240,240 L 0,240 Z" fill="none" pointer-events="none"/>
</svg>