<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bed/Patient area -->
  <rect x="60" y="150" width="120" height="20" rx="4" fill="#374151"/>
  <circle cx="80" cy="130" r="15" fill="#9CA3AF"/>
  <path d="M70 145 Q80 140 90 145" stroke="#4B5563" stroke-width="4" fill="none"/>
  
  <!-- Leader character -->
  <g>
    <circle cx="160" cy="100" r="12" fill="#F59E0B"/>
    <path d="M150 120 L155 150 M170 120 L165 150" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <path d="M140 130 L155 140" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Gesture of comfort (Hand reaching out) -->
  <circle cx="135" cy="135" r="8" fill="#F59E0B"/>
  
  <!-- Motion lines indicating care/action -->
  <path d="M120 120 Q110 110 100 120" stroke="#F59E0B" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M125 115 Q115 105 105 115" stroke="#F59E0B" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Gift/Fruit basket symbol -->
  <path d="M180 140 L200 140 L195 160 L185 160 Z" fill="#D97706"/>
  <circle cx="190" cy="135" r="4" fill="#EF4444"/>
</svg>