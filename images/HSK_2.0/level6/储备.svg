<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Light Glow -->
    <radialGradient id="warm-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Shelf Gradient -->
    <linearGradient id="shelf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sack Gradient -->
    <linearGradient id="sack-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sack-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="worker-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#warm-glow)" />

  <!-- ENVIRONMENT: Warehouse interior -->
  <!-- Back Wall Details -->
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="2" />
  
  <!-- Storage Racks (Background) -->
  <rect x="25" y="45" width="8" height="135" fill="#475569" rx="2" />
  <rect x="95" y="45" width="8" height="135" fill="#475569" rx="2" />
  <rect x="15" y="65" width="98" height="6" fill="url(#shelf-grad)" />
  <rect x="15" y="115" width="98" height="6" fill="url(#shelf-grad)" />
  <rect x="15" y="165" width="98" height="6" fill="url(#shelf-grad)" />

  <!-- Bountiful Grain Sacks on Background Racks (Abundant Reserves) -->
  <!-- Shelf 1 Sacks -->
  <path d="M 28 65 Q 33 45 43 45 Q 53 45 58 65 Z" fill="url(#sack-grad-1)" filter="url(#shadow)" />
  <path d="M 60 65 Q 67 43 77 43 Q 87 43 94 65 Z" fill="url(#sack-grad-2)" filter="url(#shadow)" />
  <!-- Shelf 2 Sacks -->
  <path d="M 25 115 Q 31 92 41 92 Q 51 92 57 115 Z" fill="url(#sack-grad-2)" filter="url(#shadow)" />
  <path d="M 59 115 Q 65 90 76 90 Q 86 90 92 115 Z" fill="url(#sack-grad-1)" filter="url(#shadow)" />

  <!-- Foreground Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#0f172a" />
  <ellipse cx="120" cy="190" rx="110" ry="15" fill="#090d16" />

  <!-- PROPS: Stored Grain Sacks Stack (Abundant Food Reserve) -->
  <g filter="url(#shadow)">
    <!-- Bottom layer sacks -->
    <path d="M 140 180 Q 150 150 170 150 Q 190 150 200 180 Z" fill="url(#sack-grad-1)" />
    <path d="M 190 180 Q 200 152 217 152 Q 235 152 240 180 Z" fill="url(#sack-grad-2)" />
    <!-- Center stack sack -->
    <path d="M 160 150 Q 172 122 192 122 Q 212 122 224 150 Z" fill="url(#sack-grad-2)" />
    <!-- Top small sack -->
    <path d="M 178 122 Q 185 102 198 102 Q 210 102 218 122 Z" fill="url(#sack-grad-1)" />
    
    <!-- Tie strings and texture lines -->
    <path d="M 43 45 Q 48 48 53 45" stroke="#78350f" stroke-width="2" fill="none" />
    <path d="M 77 43 Q 82 46 87 43" stroke="#78350f" stroke-width="2" fill="none" />
    <path d="M 192 122 Q 197 125 202 122" stroke="#78350f" stroke-width="2" fill="none" />
    <path d="M 198 102 Q 201 104 205 102" stroke="#78350f" stroke-width="2" fill="none" />
  </g>

  <!-- SUBJECT: Inventory Inspector / Officer managing the reserves -->
  <g transform="translate(0, 5)" filter="url(#shadow)">
    <!-- Legs/Pants -->
    <rect x="74" y="145" width="12" height="35" rx="4" fill="#334155" />
    <rect x="94" y="145" width="12" height="35" rx="4" fill="#334155" />
    <!-- Shoes -->
    <path d="M 68 180 L 86 180 C 89 180 89 175 86 175 L 72 175 Z" fill="#0f172a" />
    <path d="M 94 180 L 112 180 C 115 180 115 175 112 175 L 98 175 Z" fill="#0f172a" />

    <!-- Torso (Worker/Inspector uniform) -->
    <path d="M 68 100 L 112 100 L 118 150 L 62 150 Z" fill="url(#worker-shirt)" rx="6" />
    <!-- Safety Vest / Details -->
    <path d="M 78 100 L 85 150 L 95 150 L 102 100 Z" fill="#fbbf24" opacity="0.9" />
    <rect x="83" y="115" width="14" height="6" rx="2" fill="#f59e0b" />

    <!-- Head & Face -->
    <circle cx="90" cy="78" r="16" fill="#fbcfe8" />
    <!-- Friendly/Confident Expression -->
    <path d="M 84 75 Q 90 81 96 75" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="72" r="2" fill="#1e293b" />
    <circle cx="95" cy="72" r="2" fill="#1e293b" />
    <!-- Hair -->
    <path d="M 74 78 C 74 62 106 62 106 78 C 100 72 80 72 74 78 Z" fill="#334155" />

    <!-- Arms & Interaction: Checking/Clipboard setup -->
    <!-- Left Arm (Holding clipboard) -->
    <path d="M 68 105 L 50 125 L 60 135 L 72 115 Z" fill="#0284c7" />
    
    <!-- Clipboard Prop -->
    <g transform="translate(38, 115) rotate(-15)">
      <rect x="0" y="0" width="22" height="30" rx="2" fill="#f8fafc" />
      <rect x="6" y="-3" width="10" height="4" rx="1" fill="#64748b" />
      <!-- Paper lines representing inventory data -->
      <line x1="4" y1="7" x2="18" y2="7" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="4" y1="13" x2="16" y2="13" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="4" y1="19" x2="14" y2="19" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <!-- Checkmark showing abundance/sufficiency -->
      <path d="M 6 25 L 9 28 L 16 22" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Right Arm (Pointing approvingly at the stored grain) -->
    <path d="M 112 105 L 132 120 L 124 130 L 108 115 Z" fill="#0284c7" />
    <circle cx="134" cy="122" r="4" fill="#fbcfe8" />
  </g>

  <!-- AMBIENT LIGHTING & DUST PARTICLES (Warmth and Life) -->
  <circle cx="140" cy="70" r="1.5" fill="#fde047" opacity="0.6" />
  <circle cx="180" cy="50" r="2" fill="#fde047" opacity="0.4" />
  <circle cx="60" cy="90" r="1" fill="#fde047" opacity="0.8" />
  <circle cx="110" cy="40" r="1.5" fill="#fde047" opacity="0.5" />
  <circle cx="210" cy="95" r="2" fill="#fde047" opacity="0.7" />

  <!-- Shield/Check Accent subtle overlay (symbolizing security/adequacy "充足") -->
  <g transform="translate(195, 25)" filter="url(#shadow)">
    <circle cx="12" cy="12" r="14" fill="#065f46" opacity="0.85" />
    <path d="M 6 12 L 10 16 L 18 8" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>