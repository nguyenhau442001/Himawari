<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Window View Gradient (Night City Skyline) -->
    <linearGradient id="windowView" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Luxury Apartment Interior -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="155" fill="#1e293b"/>
  <path d="M 20 20 L 220 20 L 220 175 L 20 175 Z" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Decorative Wall Paneling -->
  <rect x="35" y="35" width="75" height="125" rx="4" fill="none" stroke="#475569" stroke-width="1" opacity="0.4"/>
  <rect x="130" y="35" width="75" height="125" rx="4" fill="none" stroke="#475569" stroke-width="1" opacity="0.4"/>

  <!-- Large Floor-to-Ceiling Window showing city lights -->
  <g opacity="0.85">
    <rect x="135" y="35" width="65" height="125" fill="url(#windowView)"/>
    <!-- City lights through window -->
    <rect x="145" y="80" width="6" height="12" fill="#fbbf24" opacity="0.8"/>
    <rect x="155" y="65" width="8" height="20" fill="#38bdf8" opacity="0.7"/>
    <rect x="170" y="90" width="5" height="40" fill="#f43f5e" opacity="0.6"/>
    <rect x="180" y="70" width="10" height="30" fill="#fbbf24" opacity="0.5"/>
    <rect x="145" y="110" width="12" height="25" fill="#34d399" opacity="0.6"/>
    <!-- Window Frame -->
    <rect x="135" y="35" width="65" height="125" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="167" y1="35" x2="167" y2="160" stroke="#64748b" stroke-width="1.5"/>
    <line x1="135" y1="95" x2="200" y2="95" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Luxury Indoor Plant (Fiddle Leaf Fig in Modern Pot) -->
  <g transform="translate(195, 115)">
    <!-- Pot -->
    <path d="M 5 25 L 15 50 L 25 50 L 35 25 Z" fill="#e2e8f0"/>
    <ellipse cx="20" cy="25" rx="15" ry="4" fill="#cbd5e1"/>
    <!-- Leaves -->
    <path d="M 20 25 C 10 15, -5 20, -10 10 C -5 0, 15 10, 20 25 Z" fill="#10b981"/>
    <path d="M 20 25 C 30 10, 40 15, 45 5 C 45 15, 30 20, 20 25 Z" fill="#059669"/>
    <path d="M 20 25 C 15 5, 25 -5, 35 -10 C 35 5, 25 15, 20 25 Z" fill="#34d399"/>
  </g>

  <!-- Modern Luxury Pendant Light -->
  <g>
    <line x1="75" y1="20" x2="75" y2="55" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="75" cy="55" rx="18" ry="6" fill="#f59e0b" filter="url(#glow)"/>
    <path d="M 57 55 L 75 70 L 93 55 Z" fill="#fbbf24"/>
    <path d="M 65 55 L 75 63 L 85 55 Z" fill="#fef3c7"/>
    <!-- Light cone overlay -->
    <polygon points="75,58 20,175 130,175" fill="url(#goldGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>
  </g>

  <!-- Art / Abstract Painting on Wall -->
  <g transform="translate(45, 45)" filter="url(#shadow)">
    <rect width="45" height="55" rx="2" fill="#334155"/>
    <rect x="4" y="4" width="37" height="47" fill="#f8fafc"/>
    <circle cx="22" cy="20" r="12" fill="#ec4899" opacity="0.8"/>
    <path d="M 10 40 Q 22 25 34 40 Z" fill="#3b82f6"/>
  </g>

  <!-- Wooden Floor -->
  <rect x="20" y="175" width="200" height="45" fill="url(#floorGrad)"/>
  <!-- Floor planks perspective lines -->
  <line x1="20" y1="190" x2="220" y2="190" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="205" x2="220" y2="205" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="175" x2="60" y2="220" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
  <line x1="160" y1="175" x2="180" y2="220" stroke="#1e293b" stroke-width="1" opacity="0.4"/>

  <!-- Luxury Velvet Sofa -->
  <g transform="translate(25, 125)" filter="url(#shadow)">
    <!-- Sofa Back -->
    <rect x="0" y="10" width="105" height="35" rx="8" fill="#3b82f6"/>
    <rect x="5" y="15" width="45" height="25" rx="4" fill="#60a5fa" opacity="0.4"/>
    <rect x="55" y="15" width="45" height="25" rx="4" fill="#60a5fa" opacity="0.4"/>
    
    <!-- Sofa Arms -->
    <rect x="-5" y="25" width="15" height="30" rx="6" fill="#2563eb"/>
    <rect x="95" y="25" width="15" height="30" rx="6" fill="#2563eb"/>

    <!-- Sofa Cushions (Seat) -->
    <rect x="5" y="35" width="95" height="25" rx="6" fill="#2563eb"/>
    <line x1="52" y1="35" x2="52" y2="60" stroke="#1d4ed8" stroke-width="2"/>

    <!-- Sofa Base / Legs -->
    <rect x="0" y="58" width="105" height="6" rx="2" fill="#1e40af"/>
    <rect x="10" y="64" width="4" height="6" fill="#fbbf24"/>
    <rect x="91" y="64" width="4" height="6" fill="#fbbf24"/>
  </g>

  <!-- Modern Glass Coffee Table with Teapot & Teacups -->
  <g transform="translate(75, 155)" filter="url(#shadow)">
    <!-- Table Legs -->
    <line x1="10" y1="15" x2="5" y2="35" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="60" y1="15" x2="65" y2="35" stroke="#fbbf24" stroke-width="2.5"/>
    <!-- Glass Top -->
    <ellipse cx="35" cy="15" rx="35" ry="10" fill="#38bdf8" opacity="0.4"/>
    <ellipse cx="35" cy="15" rx="33" ry="8" fill="#e0f2fe" opacity="0.2"/>

    <!-- Teapot -->
    <path d="M 30 10 Q 25 2 35 2 Q 45 2 40 10 Z" fill="#f8fafc"/>
    <circle cx="35" cy="6" r="5" fill="#e2e8f0"/>
    <path d="M 40 5 Q 46 5 45 10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Teacups -->
    <ellipse cx="18" cy="14" rx="4" ry="2" fill="#f8fafc"/>
    <ellipse cx="50" cy="12" rx="4" ry="2" fill="#f8fafc"/>
  </g>

  <!-- CHARACTERS (A Happy, Well-Dressed Family Illustrating Wealth/Prosperity) -->

  <!-- Father (Standing elegantly behind sofa, smiling, well-dressed in blazer) -->
  <g transform="translate(60, 85)" filter="url(#shadow)">
    <!-- Body / Blazer -->
    <path d="M 12 35 L 28 35 L 35 75 L 5 75 Z" fill="#1e293b"/>
    <!-- Inner Shirt & Tie -->
    <path d="M 17 35 L 23 35 L 23 55 L 17 55 Z" fill="#f8fafc"/>
    <polygon points="20,38 18,50 22,50" fill="#ef4444"/>
    <!-- Lapels -->
    <path d="M 17 35 L 20 45 L 12 60" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M 23 35 L 20 45 L 28 60" fill="none" stroke="#334155" stroke-width="2"/>

    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="11" fill="#fbcfe8"/> <!-- Skin tone -->
    <!-- Stylish Hair -->
    <path d="M 10 18 Q 18 8 30 16 Q 28 10 20 10 Q 12 10 10 18 Z" fill="#0f172a"/>
    <!-- Facial expression: Warm smile -->
    <path d="M 17 22 Q 20 25 23 22" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="18" r="1.5" fill="#334155"/>
    <circle cx="24" cy="18" r="1.5" fill="#334155"/>
    <!-- Gentle expression lines -->
    <path d="M 25 19 Q 27 18 26 17" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.5"/>
    <path d="M 15 19 Q 13 18 14 17" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Mother (Sitting on sofa, elegant dress, pearls, warm expression) -->
  <g transform="translate(30, 115)" filter="url(#shadow)">
    <!-- Dress / Torso -->
    <path d="M 10 30 Q 20 20 30 30 L 35 65 L 5 65 Z" fill="#ec4899"/>
    <!-- Pearl Necklace -->
    <circle cx="17" cy="30" r="1.5" fill="#fff"/>
    <circle cx="20" cy="32" r="1.5" fill="#fff"/>
    <circle cx="23" cy="30" r="1.5" fill="#fff"/>

    <!-- Head & Hair -->
    <circle cx="20" cy="16" r="10" fill="#fbcfe8"/>
    <!-- Elegant Updo Hair -->
    <path d="M 10 14 C 10 4, 30 4, 30 14 C 30 18, 25 20, 20 20 C 15 20, 10 18, 10 14 Z" fill="#312e81"/>
    <circle cx="25" cy="8" r="5" fill="#312e81"/>
    <!-- Face -->
    <circle cx="17" cy="15" r="1" fill="#334155"/>
    <circle cx="23" cy="15" r="1" fill="#334155"/>
    <path d="M 18 19 Q 20 22 22 19" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arm gesturing warmly -->
    <path d="M 8 35 Q -2 40 2 48" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
    <circle cx="2" cy="49" r="3" fill="#fbcfe8"/>
  </g>

  <!-- Child / Daughter (Sitting happily next to mother, holding a small gift/toy or book) -->
  <g transform="translate(75, 128)" filter="url(#shadow)">
    <!-- Colorful Sweater -->
    <path d="M 8 28 Q 18 20 28 28 L 32 55 L 4 55 Z" fill="#38bdf8"/>

    <!-- Head & Hair -->
    <circle cx="18" cy="14" r="9" fill="#fbcfe8"/>
    <!-- Cute Bob Hair with hairclip -->
    <path d="M 9 12 C 9 4, 27 4, 27 12 C 27 22, 22 24, 18 24 C 14 24, 9 20, 9 12 Z" fill="#b45309"/>
    <circle cx="12" cy="10" r="2" fill="#f43f5e"/> <!-- Hair clip -->
    
    <!-- Face: Joyful -->
    <circle cx="15" cy="13" r="1" fill="#334155"/>
    <circle cx="21" cy="13" r="1" fill="#334155"/>
    <path d="M 16 16 Q 18 19 20 16" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Small Gift Box in Hands -->
    <rect x="12" y="38" width="12" height="10" rx="1" fill="#f43f5e"/>
    <rect x="17" y="38" width="2" height="10" fill="#fbbf24"/>
    <rect x="12" y="42" width="12" height="2" fill="#fbbf24"/>
  </g>

  <!-- Luxury Accent Details (Framed floor lamp on the left) -->
  <g transform="translate(15, 60)" filter="url(#shadow)">
    <line x1="15" y1="15" x2="15" y2="115" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="15" cy="115" r="8" fill="#d97706"/>
    <!-- Lampshade -->
    <path d="M 5 15 L 25 15 L 20 2 L 10 2 Z" fill="#fef3c7"/>
    <!-- Glow -->
    <ellipse cx="15" cy="15" rx="8" ry="4" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- Subtle floor rug for warmth and luxury feel -->
  <ellipse cx="110" cy="190" rx="65" ry="18" fill="#475569" opacity="0.4"/>
  <ellipse cx="110" cy="190" rx="55" ry="14" fill="#334155" opacity="0.6"/>

  <!-- High-end decorative bowl on coffee table -->
  <ellipse cx="95" cy="168" rx="6" ry="2" fill="#fbbf24"/>
  <circle cx="95" cy="166" r="3" fill="#f8fafc"/>
  <circle cx="93" cy="166" r="2.5" fill="#f43f5e"/>

  <!-- Foreground Atmospheric Lighting Sparkles (Indicating high quality, affluent comfort) -->
  <g fill="#fbbf24" opacity="0.8">
    <path d="M 110 90 L 112 95 L 117 97 L 112 99 L 110 104 L 108 99 L 103 97 L 108 95 Z" transform="scale(0.5) translate(120, 60)"/>
    <path d="M 110 90 L 112 95 L 117 97 L 112 99 L 110 104 L 108 99 L 103 97 L 108 95 Z" transform="scale(0.4) translate(300, 180)" fill="#38bdf8"/>
    <path d="M 110 90 L 112 95 L 117 97 L 112 99 L 110 104 L 108 99 L 103 97 L 108 95 Z" transform="scale(0.6) translate(80, 220)" fill="#fef3c7"/>
  </g>
</svg>