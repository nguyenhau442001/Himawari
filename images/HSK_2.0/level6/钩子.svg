<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall Accent Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Clothing Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Hook Metallic Gradient -->
    <linearGradient id="metalHook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="120" r="120" fill="url(#lampGlow)" />

  <!-- Room Interior Background -->
  <!-- Wooden floor line -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#090d16" stroke-width="4" />
  <rect x="0" y="200" width="240" height="40" fill="#0b0f19" />

  <!-- Wooden Wall Panel / Rack Backboard -->
  <rect x="70" y="30" width="100" height="150" rx="12" fill="#334155" opacity="0.4" />
  <rect x="75" y="35" width="90" height="140" rx="8" fill="#1e293b" opacity="0.6" />

  <!-- Plant Prop on Top Shelf / Background -->
  <path d="M140 35 Q145 20 155 25 Q165 30 160 38" fill="#10b981" />
  <path d="M135 35 Q130 22 120 28 Q110 34 118 40" fill="#059669" />
  <ellipse cx="140" cy="38" rx="12" ry="6" fill="#475569" />

  <!-- THE TARGET OBJECT: HANGING HOOK (钩子) & MOUNTED BASE -->
  <!-- Wooden mounting base -->
  <rect x="112" y="90" width="16" height="30" rx="4" fill="#78350f" />
  <circle cx="120" cy="98" r="2" fill="#d97706" />
  <circle cx="120" cy="112" r="2" fill="#d97706" />

  <!-- The Metal Hook (钩子) Structure -->
  <path d="M 120 100 C 135 100, 142 108, 142 120 C 142 130, 134 135, 126 130" 
        fill="none" stroke="url(#metalHook)" stroke-width="6" stroke-linecap="round" />
  <!-- Hook Highlight -->
  <path d="M 121 101 C 133 101, 140 108, 140 119" 
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- CLOTHING HANGING ON THE HOOK (The Action Result: 把衣服挂在钩子上) -->
  <!-- Coat Hanger -->
  <path d="M 95 110 L 120 102 L 145 110" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <!-- Hanger Hook loop over the wall hook -->
  <circle cx="120" cy="101" r="3" fill="none" stroke="url(#metalHook)" stroke-width="2" />

  <!-- Hanging Jacket/Shirt -->
  <path d="M 95 110 L 80 150 L 95 185 L 120 175 L 145 185 L 160 150 L 145 110 Z" fill="url(#jacketGrad)" />
  <!-- Jacket Collar / Details -->
  <path d="M 105 110 L 120 135 L 135 110" fill="none" stroke="#ffe4e6" stroke-width="2" stroke-linejoin="round" />
  <line x1="120" y1="135" x2="120" y2="180" stroke="#be123c" stroke-width="2" stroke-dasharray="4 2" />

  <!-- CHARACTER INTERACTING (Hanging the clothes) -->
  <!-- Character Body / Torso (Partially in view on the left side) -->
  <path d="M 30 160 Q 30 130 55 125 L 75 140 L 70 200 L 20 200 Z" fill="url(#shirtGrad)" />
  
  <!-- Character Head -->
  <circle cx="50" cy="95" r="18" fill="#fcd34d" />
  <!-- Hair -->
  <path d="M 32 95 Q 35 75 55 77 Q 68 79 65 95 Z" fill="#334155" />
  <!-- Friendly Face Profile -->
  <circle cx="58" cy="96" r="2" fill="#1e293b" />
  <path d="M 58 102 Q 62 105 65 102" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Reaching Arm & Hand placing/adjusting the hanger -->
  <path d="M 65 130 Q 80 120 95 110" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="96" cy="109" r="5" fill="#fcd34d" />

  <!-- Environment Props: Shoe rack / Floor basket below -->
  <rect x="160" y="170" width="50" height="30" rx="6" fill="#475569" opacity="0.5" />
  <path d="M 170 170 Q 185 160 200 170" fill="none" stroke="#64748b" stroke-width="3" />
  <!-- Slippers inside basket -->
  <ellipse cx="178" cy="182" rx="8" ry="4" fill="#f43f5e" opacity="0.8" />
  <ellipse cx="192" cy="185" rx="8" ry="4" fill="#f43f5e" opacity="0.8" />

  <!-- Floor Lamp / Interior Decor Side Element -->
  <path d="M 215 200 L 215 80" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M 205 80 L 225 80 L 230 60 L 200 60 Z" fill="#fbbf24" opacity="0.9" />

  <!-- Additional cozy room details: Soft lighting reflection on the wall -->
  <ellipse cx="120" cy="40" rx="30" ry="3" fill="#fbbf24" opacity="0.3" />

</svg>