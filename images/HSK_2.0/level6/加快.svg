<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Office / Project Studio Elements -->
  <!-- Window Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1.5">
    <line x1="20" y1="40" x2="220" y2="40" />
    <line x1="20" y1="80" x2="220" y2="80" />
    <line x1="70" y1="20" x2="70" y2="100" />
    <line x1="170" y1="20" x2="170" y2="100" />
  </g>

  <!-- Large Kanban / Project Progress Board (Context for "进度" - Progress) -->
  <rect x="25" y="35" width="120" height="75" rx="6" fill="url(#boardGrad)" stroke="#475569" stroke-width="1.5" />
  
  <!-- Kanban Columns & Sticky Notes (Progress tracking) -->
  <!-- Col 1: Done -->
  <rect x="33" y="45" width="32" height="55" rx="4" fill="#0f172a" opacity="0.6" />
  <rect x="38" y="52" width="22" height="8" rx="2" fill="#10b981" />
  <rect x="38" y="64" width="18" height="6" rx="2" fill="#334155" />
  <rect x="38" y="74" width="22" height="6" rx="2" fill="#334155" />

  <!-- Col 2: In Progress (Active acceleration focus) -->
  <rect x="69" y="45" width="32" height="55" rx="4" fill="#0f172a" opacity="0.6" />
  <rect x="74" y="52" width="22" height="14" rx="2" fill="#f59e0b" />
  <!-- Speed lines on sticky note indicating acceleration -->
  <line x1="98" y1="55" x2="104" y2="55" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="98" y1="60" x2="106" y2="60" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <rect x="74" y="70" width="16" height="6" rx="2" fill="#334155" />

  <!-- Col 3: To Do -->
  <rect x="105" y="45" width="32" height="55" rx="4" fill="#0f172a" opacity="0.6" />
  <rect x="110" y="52" width="22" height="8" rx="2" fill="#64748b" />
  <rect x="110" y="64" width="15" height="6" rx="2" fill="#334155" />

  <!-- Dynamic Rocket / Fast-track Progress Icon on Board -->
  <circle cx="128" cy="85" r="10" fill="#38bdf8" opacity="0.2" />
  <path d="M125 90 L128 80 L131 90 L128 88 Z" fill="#38bdf8" />

  <!-- Desk Surface -->
  <path d="M10 190 L230 190 L220 220 L20 220 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="15" y="185" width="210" height="8" rx="3" fill="#334155" />

  <!-- Context Props on Desk -->
  <!-- Laptop showing upward analytics graph -->
  <path d="M140 160 L185 160 L195 188 L130 188 Z" fill="#64748b" />
  <path d="M135 188 L190 188 L198 193 L127 193 Z" fill="#475569" />
  <!-- Laptop Screen Graphic (Upward trend / Speed) -->
  <rect x="144" y="135" width="37" height="27" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <polyline points="148,155 158,150 166,153 175,139" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="175" cy="139" r="2.5" fill="#38bdf8" />

  <!-- Coffee Mug (Energy for fast-paced work) -->
  <rect x="198" y="168" width="14" height="18" rx="3" fill="#fb923c" />
  <path d="M212 172 C217 172, 217 182, 212 182" fill="none" stroke="#fb923c" stroke-width="2" />
  <!-- Steam lines -->
  <path d="M202 162 C204 158, 201 155, 203 150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- CHARACTER 1: Team Member pointing enthusiastically at progress board (Speed/Action) -->
  <g transform="translate(155, 110)">
    <!-- Body / Torso -->
    <path d="M-15 45 C-15 30, -5 20, 10 25 C25 30, 30 45, 30 75 L-15 75 Z" fill="#38bdf8" />
    <!-- Collar / Neck -->
    <circle cx="5" cy="18" r="7" fill="#fbcfe8" />
    <!-- Head -->
    <circle cx="5" cy="8" r="13" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M -8 -2 C -5 -8, 12 -6, 17 2 C 12 0, -2 0, -8 -2 Z" fill="#1e293b" />
    <!-- Action Arm pointing up-left toward board -->
    <path d="M 15 28 C 30 20, 45 -5, 50 -12" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="51" cy="-14" r="5" fill="#fbcfe8" />
    <!-- Speed lines near hand -->
    <line x1="56" y1="-18" x2="62" y2="-22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="54" y1="-10" x2="60" y2="-12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Other Arm -->
    <path d="M -5 28 L -20 50" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 2: Focused Collaborator typing quickly, boosting pace -->
  <g transform="translate(75, 115)">
    <!-- Body / Torso -->
    <path d="M-20 40 C-20 25, -10 20, 5 25 C20 30, 25 40, 25 75 L-20 75 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="0" cy="5" r="13" fill="#fbcfe8" />
    <!-- Hair / Headphones -->
    <path d="M -12 -3 C -10 -10, 10 -10, 12 -3 C 8 -5, -8 -5, -12 -3 Z" fill="#334155" />
    <path d="M-13 2 A 13 13 0 0 1 13 2" fill="none" stroke="#fb923c" stroke-width="3" />
    <!-- Focused Face (Determined expression) -->
    <line x1="-4" y1="4" x2="0" y2="6" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="2" y1="6" x2="6" y2="4" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Typing Arms leaning forward -->
    <path d="M -15 35 C -5 35, 10 45, 20 60" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />
    <path d="M 15 35 C 25 35, 30 50, 25 62" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND ACCENTS & DYNAMIC SPEED LINES (Amplifying "加快" / Acceleration concept) -->
  <!-- Motion Swoosh underlining the scene -->
  <path d="M 30 205 Q 120 185, 210 200" fill="none" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  
  <!-- Speed particle sparks -->
  <circle cx="110" cy="175" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="120" cy="172" r="1.5" fill="#fbbf24" opacity="0.9" />
  <circle cx="95" cy="180" r="2" fill="#38bdf8" opacity="0.6" />

  <!-- Floating Fast-Forward / Acceleration Symbol (Abstracted into clean vector geometry, no text) -->
  <g transform="translate(185, 55)" opacity="0.9">
    <polygon points="0,0 10,6 0,12" fill="#38bdf8" />
    <polygon points="8,0 18,6 8,12" fill="#38bdf8" opacity="0.6" />
  </g>
  <g transform="translate(170, 55)" opacity="0.9">
    <polygon points="0,0 10,6 0,12" fill="#38bdf8" opacity="0.3" />
  </g>

</svg>