<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Palace Wall / Interior Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311026" />
      <stop offset="100%" stop-color="#1a0914" />
    </linearGradient>

    <!-- Golden Pillar Gradient -->
    <linearGradient id="gold-pillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Window Moonlight -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- PALACE INTERIOR ARCHITECTURE -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="url(#wall-grad)" />

  <!-- Decorative Wall Panels / Woodwork -->
  <rect x="35" y="30" width="70" height="130" rx="4" fill="#3b132c" stroke="#581c40" stroke-width="2" />
  <rect x="135" y="30" width="70" height="130" rx="4" fill="#3b132c" stroke="#581c40" stroke-width="2" />
  
  <!-- Traditional Chinese Circular Moon Window (showing night garden outside) -->
  <circle cx="120" cy="85" r="38" fill="#0b0f19" stroke="#d97706" stroke-width="3" filter="url(#shadow)" />
  <!-- Window Grille -->
  <path d="M120 47 L120 123 M82 85 L158 85 M95 60 L145 110 M95 110 L145 60" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.7" />
  <!-- Outside Garden View -->
  <circle cx="120" cy="85" r="35" fill="url(#moonlight)" />
  <!-- Bamboo silhouettes outside -->
  <path d="M100 110 L100 70 M102 70 L102 110 M140 115 L140 65 M142 65 L142 115" stroke="#065f46" stroke-width="2" stroke-linecap="round" />
  <path d="M100 85 L95 80 M102 75 L107 72 M140 90 L146 86 M142 75 L137 72" stroke="#065f46" stroke-width="1.5" />

  <!-- Hanging Palace Lantern (Left) -->
  <path d="M55 20 L55 45" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="55" cy="55" r="14" fill="#ef4444" filter="url(#shadow)" />
  <path d="M45 50 Q55 45 65 50 Q65 60 55 65 Q45 60 45 50 Z" fill="#dc2626" />
  <path d="M48 48 L62 48 M48 62 L62 62" stroke="#f59e0b" stroke-width="2" />
  <circle cx="55" cy="55" r="22" fill="url(#lantern-glow)" />

  <!-- Hanging Palace Lantern (Right) -->
  <path d="M185 20 L185 45" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="185" cy="55" r="14" fill="#ef4444" filter="url(#shadow)" />
  <path d="M175 50 Q185 45 195 50 Q195 60 185 65 Q175 60 175 50 Z" fill="#dc2626" />
  <path d="M178 48 L192 48 M178 62 L192 62" stroke="#f59e0b" stroke-width="2" />
  <circle cx="185" cy="55" r="22" fill="url(#lantern-glow)" />

  <!-- Palace Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#floor-grad)" />
  <!-- Floor Tile Lines (Perspective) -->
  <line x1="120" y1="170" x2="20" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="120" y1="170" x2="220" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="120" y1="170" x2="120" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="120" y1="170" x2="70" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="120" y1="170" x2="170" y2="240" stroke="#1e293b" stroke-width="1.5" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#1e293b" stroke-width="1" />
  <line x1="0" y1="218" x2="240" y2="218" stroke="#1e293b" stroke-width="1" />

  <!-- Left & Right Golden Pillars for Architectural Framing -->
  <rect x="0" y="20" width="16" height="150" fill="url(#gold-pillar)" />
  <rect x="224" y="20" width="16" height="150" fill="url(#gold-pillar)" />
  <rect x="0" y="20" width="240" height="12" fill="#b45309" />

  <!-- THE THRONE / SEATING AREA -->
  <!-- Imperial Throne (Backdrop) -->
  <path d="M85 105 L155 105 L165 170 L75 170 Z" fill="#78350f" filter="url(#shadow)" />
  <path d="M75 100 L165 100 L170 110 L70 110 Z" fill="#d97706" />
  <!-- Throne Cushion -->
  <rect x="85" y="145" width="70" height="25" rx="6" fill="#991b1b" />
  <rect x="80" y="165" width="80" height="10" rx="3" fill="#b45309" />

  <!-- IMPERIAL CHARACTER: THE EMPRESS (皇后 - Huánghòu) -->
  <!-- Sitting gracefully on the throne -->
  <!-- Body/Robes (Imperial Red & Gold traditional Hanfu style) -->
  <!-- Outer Robe / Sleeves -->
  <path d="M80 180 Q65 170 70 155 Q85 150 100 160 Z" fill="#b91c1c" />
  <path d="M160 180 Q175 170 170 155 Q155 150 140 160 Z" fill="#b91c1c" />
  
  <!-- Main Robe Skirt/Body -->
  <path d="M90 145 L150 145 L162 178 L78 178 Z" fill="#dc2626" />
  <!-- Golden Robe Trim -->
  <path d="M105 145 L135 145 L140 178 L100 178 Z" fill="#fbbf24" opacity="0.9" />
  <!-- Belt/Sash -->
  <rect x="95" y="142" width="50" height="8" rx="4" fill="#d97706" />
  <circle cx="120" cy="146" r="5" fill="#ef4444" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Neck -->
  <rect x="114" y="120" width="12" height="14" fill="#fde68a" />

  <!-- Head & Face -->
  <circle cx="120" cy="108" r="18" fill="#fef3c7" filter="url(#shadow)" />
  <!-- Hair (Traditional Elaborate Empress Bun) -->
  <path d="M102 105 C102 92 138 92 138 105 C145 105 145 115 136 118 C136 110 104 110 104 118 C95 115 95 105 102 105 Z" fill="#0f172a" />
  <!-- Hair Bun Top Peak -->
  <ellipse cx="120" cy="88" rx="10" ry="8" fill="#0f172a" />
  <!-- Golden Phoenix Hair Ornaments (Diadem / Fengguan) -->
  <path d="M110 85 Q120 75 130 85 Q125 90 120 85 Q115 90 110 85 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
  <circle cx="120" cy="79" r="3" fill="#ef4444" />
  <!-- Hair Side Pins / Tassels -->
  <path d="M104 100 L95 108" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <circle cx="94" cy="110" r="2" fill="#ef4444" />
  <path d="M136 100 L145 108" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <circle cx="146" cy="110" r="2" fill="#ef4444" />

  <!-- Facial Features (Serene, Regal expression) -->
  <!-- Eyebrows (Delicate, arched) -->
  <path d="M110 103 Q114 100 118 103" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M122 103 Q126 100 130 103" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="114" cy="107" r="2" fill="#0f172a" />
  <circle cx="126" cy="107" r="2" fill="#0f172a" />
  <!-- Gentle Smile -->
  <path d="M117 114 Q120 117 123 114" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Rosy Cheeks -->
  <circle cx="111" cy="111" r="3" fill="#fda4af" opacity="0.6" />
  <circle cx="129" cy="111" r="3" fill="#fda4af" opacity="0.6" />

  <!-- FOREGROUND PROPS (Contextual richness) -->
  <!-- Traditional Small Lacquered Tea Table on the side -->
  <rect x="45" y="180" width="35" height="25" rx="3" fill="#78350f" filter="url(#shadow)" />
  <rect x="42" y="176" width="41" height="6" rx="2" fill="#92400e" />
  <rect x="48" y="205" width="5" height="15" fill="#5c2c16" />
  <rect x="72" y="205" width="5" height="15" fill="#5c2c16" />

  <!-- Tea Set on Table -->
  <!-- Teapot -->
  <path d="M57 165 C55 160 63 160 61 165 Z" fill="#f8fafc" />
  <circle cx="59" cy="164" r="5" fill="#f8fafc" filter="url(#shadow)" />
  <path d="M55 164 L52 162" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
  <path d="M63 164 Q66 164 65 167" stroke="#f8fafc" stroke-width="1.5" fill="none" />
  <!-- Teacup -->
  <rect x="68" y="169" width="6" height="5" rx="1" fill="#f8fafc" />

  <!-- Potted Orchid Plant (Imperial Palace Flora) -->
  <!-- Pot -->
  <path d="M185 185 L175 205 L205 205 L195 185 Z" fill="#cbd5e1" filter="url(#shadow)" />
  <ellipse cx="190" cy="185" rx="10" ry="3" fill="#e2e8f0" />
  <!-- Orchid Leaves -->
  <path d="M190 183 Q175 160 165 155" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M190 183 Q200 155 210 150" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M190 183 Q190 150 185 145" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Orchid Flowers -->
  <circle cx="166" cy="154" r="4" fill="#f43f5e" />
  <circle cx="209" cy="151" r="4" fill="#f43f5e" />
  <circle cx="185" cy="144" r="4.5" fill="#f43f5e" />
  <circle cx="185" cy="144" r="1.5" fill="#fbbf24" />

  <!-- Subtle ambient lighting overlays for rich atmosphere -->
  <circle cx="120" cy="108" r="80" fill="url(#lantern-glow)" style="mix-blend-mode: overlay;" />
</svg>