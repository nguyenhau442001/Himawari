<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="soil-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#291104"/>
    </linearGradient>

    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="plant-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment & Sky -->
  <g id="environment">
    <!-- Sky dome -->
    <path d="M 0 0 L 240 0 L 240 140 L 0 140 Z" fill="url(#sky-grad)"/>
    
    <!-- Warm sun/glow behind hills -->
    <circle cx="180" cy="90" r="45" fill="url(#sun-glow)"/>

    <!-- Rolling Hills / Landscape -->
    <path d="M 0 110 Q 70 80 140 115 T 240 100 L 240 150 L 0 150 Z" fill="#334155" opacity="0.5"/>
    <path d="M 0 125 Q 90 95 180 130 T 240 120 L 240 160 L 0 160 Z" fill="#475569" opacity="0.6"/>

    <!-- Distant cute farmhouse/shed -->
    <path d="M 195 105 L 210 95 L 225 105 L 225 125 L 195 125 Z" fill="#64748b"/>
    <polygon points="190,105 210,90 230,105" fill="#94a3b8"/>
  </g>

  <!-- Rich, Dark, Fertile Soil Layer (Foreground) -->
  <g id="fertile-soil">
    <!-- Main soil mound with rich organic texture -->
    <path d="M -10 140 Q 60 120 120 135 T 250 130 L 250 250 L -10 250 Z" fill="url(#soil-grad)"/>
    
    <!-- Soil highlights and rich clumps showing fertility and moisture -->
    <ellipse cx="60" cy="150" rx="18" ry="8" fill="#522208" opacity="0.7"/>
    <ellipse cx="140" cy="165" rx="25" ry="10" fill="#522208" opacity="0.7"/>
    <ellipse cx="190" cy="145" rx="15" ry="6" fill="#3d1804" opacity="0.8"/>
    <ellipse cx="90" cy="180" rx="30" ry="12" fill="#3d1804" opacity="0.8"/>
    <circle cx="40" cy="170" r="4" fill="#a16207" opacity="0.6"/>
    <circle cx="160" cy="150" r="5" fill="#a16207" opacity="0.6"/>
    <circle cx="110" cy="160" r="3" fill="#a16207" opacity="0.6"/>
  </g>

  <!-- Lush Plants and Crops sprouting (Showing fertility) -->
  <g id="lush-crops">
    <!-- Giant vibrant pumpkin / melon in center foreground -->
    <path d="M 105 155 Q 120 130 135 155 Q 150 170 135 185 Q 120 195 105 185 Q 90 170 105 155 Z" fill="#ea580c"/>
    <path d="M 120 135 Q 120 160 120 190" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 105 145 Q 120 155 135 145" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Giant vibrant green leaves sprouting from the rich earth -->
    <!-- Left leafy sprout -->
    <path d="M 40 145 Q 20 120 10 130 Q 5 150 35 150 Z" fill="url(#plant-grad)"/>
    <path d="M 40 145 Q 25 135 12 133" stroke="#86efac" stroke-width="2" fill="none"/>
    
    <path d="M 50 140 Q 60 110 75 115 Q 85 130 55 150 Z" fill="url(#plant-grad)"/>
    <path d="M 50 140 Q 62 125 72 120" stroke="#86efac" stroke-width="2" fill="none"/>

    <!-- Right tall thriving plants -->
    <path d="M 180 140 Q 195 100 215 110 Q 225 130 185 150 Z" fill="url(#plant-grad)"/>
    <path d="M 180 140 Q 195 125 210 118" stroke="#86efac" stroke-width="2" fill="none"/>

    <path d="M 165 145 Q 160 115 145 120 Q 135 135 160 155 Z" fill="#22c55e"/>
  </g>

  <!-- Expressive Farmer Character -->
  <g id="character-farmer" transform="translate(0, 5)">
    <!-- Body / Overalls (blue denim) -->
    <path d="M 85 120 Q 95 100 115 105 L 125 140 L 75 140 Z" fill="#0284c7"/>
    <!-- Straps -->
    <line x1="90" y1="105" x2="80" y2="125" stroke="#0369a1" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="105" x2="120" y2="125" stroke="#0369a1" stroke-width="4" stroke-linecap="round"/>
    <!-- Red flannel shirt underneath -->
    <path d="M 85 105 L 115 105 L 120 125 L 80 125 Z" fill="#dc2626"/>

    <!-- Head & Face -->
    <circle cx="100" cy="85" r="16" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M 84 80 Q 100 65 116 80 Q 115 72 100 70 Q 85 72 84 80 Z" fill="#78350f" /> <!-- Hair -->

    <!-- Happy, proud facial expression -->
    <circle cx="94" cy="83" r="2" fill="#1e293b"/>
    <circle cx="106" cy="83" r="2" fill="#1e293b"/>
    <path d="M 96 90 Q 100 95 104 90" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="90" cy="87" r="2.5" fill="#f43f5e" opacity="0.6"/> <!-- Rosy cheek -->
    <circle cx="110" cy="87" r="2.5" fill="#f43f5e" opacity="0.6"/>

    <!-- Straw Hat -->
    <ellipse cx="100" cy="73" rx="24" ry="6" fill="#f59e0b"/>
    <path d="M 88 70 Q 100 56 112 70 Z" fill="#fbbf24"/>
    <rect x="88" y="68" width="24" height="3" rx="1.5" fill="#b45309"/>

    <!-- Arms interacting with the environment -->
    <!-- Left arm holding spade -->
    <path d="M 85 110 Q 65 115 60 135" stroke="#dc2626" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="137" r="4" fill="#fbcfe8"/>

    <!-- Right arm resting proudly on hip -->
    <path d="M 115 110 Q 130 115 125 130" stroke="#dc2626" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="125" cy="132" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Farming Tool: Spade stuck proudly in the rich soil -->
  <g id="spade">
    <!-- Wooden handle -->
    <line x1="55" y1="100" x2="45" y2="160" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
    <!-- Handle top loop -->
    <path d="M 57 97 Q 55 92 53 97" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Metal blade buried slightly in the rich earth -->
    <path d="M 41 155 L 49 155 L 52 175 C 52 180 38 180 38 175 Z" fill="#94a3b8"/>
    <path d="M 45 155 L 45 175" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Floating Sparkles / Magic Fertile Glow (Modern Vector Detail) -->
  <g id="sparkles" fill="#fbbf24">
    <path d="M 70 120 L 72 125 L 77 127 L 72 129 L 70 134 L 68 129 L 63 127 L 68 125 Z" opacity="0.9"/>
    <path d="M 155 105 L 156.5 109 L 160.5 110.5 L 156.5 112 L 155 116 L 153.5 112 L 149.5 110.5 L 153.5 109 Z" opacity="0.8"/>
    <path d="M 130 135 L 131 138 L 134 139 L 131 140 L 130 143 L 129 140 L 126 139 L 129 138 Z" opacity="0.7"/>
    <circle cx="45" cy="110" r="2" fill="#fef08a" opacity="0.8"/>
    <circle cx="165" cy="130" r="1.5" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Foreground Atmospheric Leaf/Vines framing -->
  <g id="foreground-frame">
    <path d="M 0 240 Q 15 220 5 200" stroke="#15803d" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 2 210 Q -5 205 -2 195 Q 8 200 2 210 Z" fill="#22c55e"/>
    
    <path d="M 240 230 Q 220 215 225 190" stroke="#15803d" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 228 200 Q 242 195 238 185 Q 220 190 228 200 Z" fill="#16a34a"/>
  </g>
</svg>