<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting/glow reflecting "honesty/clarity" -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" opacity="0.6"/>
  <circle cx="120" cy="90" r="50" fill="#38bdf8" opacity="0.08"/>

  <!-- Interior Wall & Window Setting (Context) -->
  <path d="M 30,195 L 210,195 L 210,210 L 30,210 Z" fill="#334155"/>
  <rect x="50" y="50" width="140" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Window view (Night/Evening cozy city vibe) -->
  <rect x="60" y="60" width="55" height="90" rx="2" fill="#090d16"/>
  <circle cx="87" cy="85" r="12" fill="#fbbf24" opacity="0.8"/>
  <rect x="125" y="60" width="55" height="90" rx="2" fill="#090d16"/>
  <path d="M 135,110 L 145,100 L 155,120 L 165,105" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Room Interior Prop: Bookshelf / Lamp -->
  <path d="M 35,100 L 45,100 L 45,195 L 35,195 Z" fill="#475569"/>
  <rect x="37" y="120" width="6" height="3" fill="#fb923c"/>
  <rect x="37" y="140" width="6" height="3" fill="#10b981"/>

  <!-- Desk and Honest Interaction Props -->
  <rect x="80" y="165" width="80" height="30" rx="2" fill="#334155"/>
  <rect x="70" y="195" width="100" height="6" fill="#1e293b"/>
  <!-- Open transparent glass of water (symbol of clarity/truth) -->
  <path d="M 140,145 L 143,165 L 157,165 L 160,145 Z" fill="#38bdf8" opacity="0.3"/>
  <path d="M 142,150 L 158,150" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Character 1: The Speaker (Man telling the truth, calm, open hands) -->
  <!-- Torso & Shirt -->
  <path d="M 85,150 L 115,150 L 122,195 L 78,195 Z" fill="#38bdf8"/>
  <path d="M 95,150 L 100,165 L 105,150" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Head & Face (Calm, direct eye contact, open expression) -->
  <circle cx="100" cy="115" r="18" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 83,115 C 83,100 95,95 105,97 C 115,99 117,112 117,112 C 117,112 110,102 100,103 C 90,104 85,110 83,115 Z" fill="#334155"/>
  <!-- Open, honest eyes (direct look) -->
  <circle cx="94" cy="113" r="2" fill="#0f172a"/>
  <circle cx="106" cy="113" r="2" fill="#0f172a"/>
  <!-- Gentle, reassuring smile (No lying = peaceful mouth curve) -->
  <path d="M 97,123 Q 100,126 103,123" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Arms expressing openness ( palms up / open gestures, no hiding behind back) -->
  <!-- Left arm -->
  <path d="M 87,152 Q 72,158 75,170" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Right arm gesturing forward openly -->
  <path d="M 113,152 Q 125,160 120,172" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Character 2: The Listener (Listening trustingly, leaning in) -->
  <!-- Torso -->
  <path d="M 145,155 L 175,155 L 180,195 L 140,195 Z" fill="#ec4899"/>
  <!-- Head -->
  <circle cx="160" cy="120" r="16" fill="#fcd34d"/>
  <!-- Hair (Ponytail/Bun style) -->
  <path d="M 146,120 C 146,105 158,103 168,107 C 176,110 176,125 176,125 C 176,125 182,118 184,124 C 186,130 178,135 170,132 Z" fill="#475569"/>
  <!-- Eyes (Trusting, calm) -->
  <circle cx="155" cy="118" r="1.5" fill="#0f172a"/>
  <circle cx="165" cy="118" r="1.5" fill="#0f172a"/>
  <path d="M 158,126 Q 160,128 162,126" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Ambient highlight effects for clean modern vector look -->
  <path d="M 20,20 L 220,20" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="210" cy="40" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="25" cy="210" r="2" fill="#38bdf8" opacity="0.6"/>
</svg>