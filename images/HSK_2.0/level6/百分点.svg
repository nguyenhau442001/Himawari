<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Background Elements -->
  <rect x="30" y="60" width="180" height="110" rx="8" fill="#334155"/>
  <rect x="40" y="70" width="160" height="90" rx="4" fill="#0f172a"/>
  
  <!-- Growth Chart on Screen -->
  <path d="M50 140 L80 130 L110 110 L140 90 L170 60" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="60" r="5" fill="#10b981"/>
  
  <!-- Character: Business Professional -->
  <g transform="translate(120, 140)">
    <path d="M-20 80 Q-20 40 0 40 T20 80" fill="#38bdf8"/>
    <circle cx="0" cy="30" r="15" fill="#fde68a"/>
    <rect x="-12" y="45" width="24" height="10" fill="#38bdf8"/>
    <path d="M-15 45 L-25 60 M15 45 L25 60" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- The "Five Percentage Points" Visual Marker -->
  <g transform="translate(180, 80)">
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#fb923c"/>
    <path d="M-5 -5 L5 5 M-5 5 L5 -5" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="30" fill="#fb923c" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold"></text>
  </g>
  
  <!-- Desk -->
  <rect x="20" y="180" width="200" height="15" rx="2" fill="#475569"/>
  
  <!-- Decorative Accents -->
  <circle cx="40" cy="40" r="3" fill="#ec4899"/>
  <circle cx="200" cy="200" r="4" fill="#fbbf24"/>
  <path d="M180 190 L190 180" stroke="#fbbf24" stroke-width="2"/>
</svg>