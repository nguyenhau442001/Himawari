<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Scenery Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Lamp Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Panel Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Window Frame & Night Sky with Mountains/City Silhouette -->
  <g id="window">
    <rect x="25" y="20" width="70" height="90" rx="8" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Night Sky View -->
    <clipPath id="window-clip">
      <rect x="28" y="23" width="64" height="84" rx="6"/>
    </clipPath>
    <g clip-path="url(#window-clip)">
      <rect x="28" y="23" width="64" height="84" fill="url(#sky-grad)"/>
      <!-- Stars -->
      <circle cx="40" cy="35" r="1" fill="#ffffff" opacity="0.8"/>
      <circle cx="75" cy="45" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="55" cy="30" r="1" fill="#ffffff" opacity="0.7"/>
      <circle cx="80" cy="70" r="1" fill="#ffffff" opacity="0.5"/>
      <!-- Mountain / Horizon silhouette -->
      <path d="M28 85 L45 65 L60 75 L85 55 L92 90 L28 90 Z" fill="#1e1b4b"/>
      <!-- Airplane icon passing by -->
      <path d="M45 50 L55 48 L53 51 L58 52 L53 53 L51 56 Z" fill="#94a3b8" transform="rotate(-15 50 50) scale(0.6)"/>
    </g>
    <!-- Window frame cross -->
    <line x1="60" y1="23" x2="60" y2="107" stroke="#334155" stroke-width="2"/>
    <line x1="28" y1="65" x2="92" y2="65" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Ambient Interior Props (Bookshelf / Plant) -->
  <g id="interior-props" opacity="0.6">
    <!-- Small Plant -->
    <path d="M195 90 C195 80 205 75 205 75 C205 75 215 80 215 90 Z" fill="#334155"/>
    <path d="M205 75 L205 65" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M205 70 C200 60 190 65 190 65 C190 65 195 72 205 70 Z" fill="#10b981"/>
    <path d="M205 68 C210 60 220 65 220 65 C220 65 215 72 205 68 Z" fill="#34d399"/>
  </g>

  <!-- Desk Surface -->
  <rect x="15" y="190" width="210" height="12" rx="4" fill="#334155"/>
  <rect x="25" y="202" width="190" height="26" fill="#1e293b"/>
  <!-- Desk Lamp -->
  <path d="M185 190 L195 140 L205 140 L215 190 Z" fill="#475569"/>
  <path d="M180 135 C180 120 200 120 200 135 Z" fill="#f59e0b"/>
  <!-- Lamp Light Cone -->
  <polygon points="190,140 120,200 200,200" fill="url(#lamp-glow)" style="mix-blend-mode: screen;" pointer-events="none"/>


  <!-- CHARACTERS -->
  <!-- Young Woman (Planning Trip, Stressed/Surprised at High Cost) -->
  <g id="character-woman">
    <!-- Body / Torso (Teal Hoodie) -->
    <path d="M110 160 C110 145 125 135 140 135 C155 135 170 145 170 160 L175 195 L105 195 Z" fill="#0d9488"/>
    <!-- Hoodie Strings -->
    <path d="M135 145 Q138 155 135 160" stroke="#f0fdfa" stroke-width="1.5" fill="none"/>
    <path d="M145 145 Q142 155 145 160" stroke="#f0fdfa" stroke-width="1.5" fill="none"/>

    <!-- Neck -->
    <rect x="133" y="122" width="14" height="18" rx="4" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="140" cy="105" r="22" fill="#fbcfe8"/>
    <!-- Hair (Brown Bob cut) -->
    <path d="M118 105 C118 85 162 85 162 105 L164 125 C164 125 155 128 140 125 C125 128 116 125 116 125 Z" fill="#451a03"/>
    <!-- Hair strands framing face -->
    <path d="M118 105 C115 115 118 125 122 130" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M162 105 C165 115 162 125 158 130" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Facial Expressions (Surprised / Concerned) -->
    <!-- Eyebrows (tilted up in surprise) -->
    <path d="M128 97 Q132 94 136 97" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M144 97 Q148 94 152 97" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Eyes (Wide, black dots with highlight) -->
    <circle cx="132" cy="103" r="2.5" fill="#1e293b"/>
    <circle cx="148" cy="103" r="2.5" fill="#1e293b"/>
    <circle cx="131.5" cy="102" r="1" fill="#ffffff"/>
    <circle cx="147.5" cy="102" r="1" fill="#ffffff"/>
    <!-- Open "O" mouth showing high price shock -->
    <ellipse cx="140" cy="113" rx="3.5" ry="5" fill="#7c2d12"/>

    <!-- Hands & Arms -->
    <!-- Left Arm holding head/cheek in disbelief -->
    <path d="M120 145 C110 140 105 125 115 112" stroke="#0d9488" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="115" cy="110" r="5" fill="#fbcfe8"/> <!-- Hand -->
    <!-- Right Arm pointing at invoice/tablet -->
    <path d="M160 145 L175 160" stroke="#0d9488" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="177" cy="162" r="4.5" fill="#fbcfe8"/>
  </g>


  <!-- FOREGROUND PROPS / THE "EXPENSIVE TRAVEL COST" ARTIFACTS -->
  <!-- Booking Tablet / Flight Itinerary Floating on Desk -->
  <g id="invoice-tablet" filter="url(#shadow)" transform="rotate(-6 100 150)">
    <!-- Tablet Body -->
    <rect x="75" y="130" width="55" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Screen Header -->
    <rect x="80" y="136" width="45" height="10" rx="3" fill="#3b82f6"/>
    <!-- Plane icon & route lines on screen -->
    <path d="M85 156 L95 156" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="156" r="2" fill="#ef4444"/>
    <path d="M105 156 L115 156" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M98 153 L102 156 L98 159" fill="#3b82f6"/>
    
    <!-- Price Tag / High Cost Indicator (Highlighting 'Expensive') -->
    <rect x="80" y="165" width="45" height="28" rx="4" fill="#fee2e2"/>
    <!-- Barcode lines -->
    <line x1="85" y1="172" x2="93" y2="172" stroke="#ef4444" stroke-width="3"/>
    <line x1="96" y1="172" x2="98" y2="172" stroke="#ef4444" stroke-width="3"/>
    <line x1="101" y1="172" x2="108" y2="172" stroke="#ef4444" stroke-width="3"/>
    <line x1="111" y1="172" x2="116" y2="172" stroke="#ef4444" stroke-width="3"/>
    
    <!-- Big Numbers representing Cost (Abstracted clean shapes, NO actual text) -->
    <path d="M85 183 L90 183 L90 189 L85 189 Z" fill="#b91c1c"/>
    <circle cx="95" cy="186" r="1.5" fill="#b91c1c"/>
    <path d="M100 183 L108 183 L108 189 L100 189 Z" fill="#b91c1c"/>
    <path d="M112 183 L118 183 L118 189 L112 189 Z" fill="#b91c1c"/>
  </g>

  <!-- Globe (Travel context prop) -->
  <g id="globe" transform="translate(35, 135)">
    <!-- Stand -->
    <path d="M15 50 L25 50 L20 30 Z" fill="#64748b"/>
    <path d="M20 30 A 18 18 0 0 1 20 6" stroke="#64748b" stroke-width="3" fill="none"/>
    <!-- Sphere -->
    <circle cx="20" cy="18" r="16" fill="#38bdf8"/>
    <!-- Continents styling -->
    <path d="M12 10 Q16 8 20 14 Q24 10 22 20 Q15 25 12 19 Z" fill="#0284c7" opacity="0.7"/>
    <circle cx="20" cy="18" r="16" stroke="#0ea5e9" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Passport & Luggage Tag -->
  <g id="passport" transform="translate(155, 175) rotate(12)">
    <!-- Passport Cover -->
    <rect x="0" y="0" width="22" height="28" rx="3" fill="#1e3a8a"/>
    <!-- Gold crest placeholder -->
    <circle cx="11" cy="12" r="4" fill="#fbbf24"/>
    <!-- Pages edge -->
    <rect x="-2" y="2" width="3" height="24" fill="#e2e8f0"/>
  </g>

  <!-- Price Alert Badge (Floating above, emphasizing "Not Cheap / Expensive") -->
  <g id="alert-badge" filter="url(#shadow)" transform="translate(145, 65)">
    <circle cx="16" cy="16" r="18" fill="#ef4444"/>
    <!-- Upward price surge / Warning arrow icon -->
    <path d="M16 8 L22 16 L19 16 L19 24 L13 24 L13 16 L10 16 Z" fill="#ffffff"/>
    <!-- Sparkles for attention -->
    <path d="M-4 6 L0 8 L-4 10 L-6 14 L-8 10 L-12 8 L-8 6 L-6 2 Z" fill="#fbbf24" transform="scale(0.6)"/>
    <path d="M32 20 L35 21 L32 22 L31 25 L30 22 L27 21 L30 20 L31 17 Z" fill="#fbbf24" transform="scale(0.6)"/>
  </g>
</svg>