<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a" opacity="0.3"/>
  
  <!-- Carpet being rolled -->
  <path d="M40 180 L160 180 L160 200 L40 200 Z" fill="#fb923c" opacity="0.6"/>
  <path d="M160 170 C185 170 200 185 200 200 C200 215 185 230 160 230 C135 230 120 215 120 200 L160 200" fill="#f59e0b"/>
  <circle cx="160" cy="200" r="8" fill="#d97706"/>
  
  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Body -->
    <path d="M20 40 L40 40 L35 80 L25 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="30" cy="30" r="15" fill="#fde68a"/>
    <!-- Arms -->
    <path d="M20 45 L10 60" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 45 L55 60" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Hands interacting with carpet -->
    <circle cx="10" cy="60" r="5" fill="#fbbf24"/>
    <circle cx="55" cy="60" r="5" fill="#fbbf24"/>
  </g>
  
  <!-- Room details -->
  <rect x="20" y="50" width="40" height="5" fill="#334155" rx="2"/>
  <rect x="25" y="55" width="30" height="2" fill="#334155" rx="1"/>
  <circle cx="200" cy="60" r="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M190 60 L210 60 M200 50 L200 70" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative elements -->
  <circle cx="220" cy="180" r="3" fill="#10b981"/>
  <circle cx="30" cy="220" r="2" fill="#ec4899"/>
</svg>