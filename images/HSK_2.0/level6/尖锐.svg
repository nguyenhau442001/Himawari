<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Spotlight/Window Light Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Sharp Crystal/Energy Accent Gradient (symbolizing "sharp criticism") -->
    <linearGradient id="sharpAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Office Interior -->
  <!-- Bookshelf / Wall details -->
  <rect x="25" y="40" width="60" height="75" rx="4" fill="#334155" opacity="0.4" />
  <rect x="30" y="55" width="50" height="6" rx="2" fill="#475569" opacity="0.6" />
  <rect x="30" y="75" width="40" height="6" rx="2" fill="#475569" opacity="0.6" />
  <rect x="30" y="95" width="45" height="6" rx="2" fill="#475569" opacity="0.6" />

  <!-- Window Frame in Background -->
  <rect x="155" y="30" width="55" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="182" y1="30" x2="182" y2="100" stroke="#334155" stroke-width="2" />
  <line x1="155" y1="65" x2="210" y2="65" stroke="#334155" stroke-width="2" />

  <!-- Ambient Light from Window -->
  <polygon points="155,30 210,30 230,160 110,160" fill="url(#lightBeam)" />

  <!-- Floor / Base -->
  <rect x="0" y="195" width="240" height="45" fill="#090d16" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2" />

  <!-- Conference / Meeting Table -->
  <path d="M 30,195 L 60,150 L 210,150 L 235,195 Z" fill="#334155" />
  <path d="M 35,195 L 63,153 L 207,153 L 230,195 Z" fill="#475569" />
  <rect x="45" y="150" width="175" height="8" rx="2" fill="#64748b" />

  <!-- Table Props: Laptop & Documents with sharp red marks (criticism context) -->
  <rect x="75" y="140" width="45" height="18" rx="2" fill="#94a3b8" />
  <polygon points="90,140 105,140 108,125 87,125" fill="#cbd5e1" /> <!-- Laptop screen -->
  
  <!-- Document with feedback -->
  <g transform="translate(135, 135) rotate(-8)">
    <rect width="36" height="45" rx="2" fill="url(#paperGrad)" />
    <!-- Mock text lines -->
    <line x1="6" y1="8" x2="25" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="14" x2="30" y2="14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="20" x2="20" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Sharp Red Correction Marks (Criticism) -->
    <path d="M 6,30 L 14,38 L 30,24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CHARACTER 1: The Speaker / Critic (Standing confidently, gesturing sharply) -->
  <g id="critic-character">
    <!-- Body & Suit -->
    <path d="M 50,195 L 55,135 L 75,130 L 90,195 Z" fill="#1e293b" />
    <path d="M 60,133 L 70,165 L 80,133 Z" fill="#f8fafc" /> <!-- Shirt -->
    <polygon points="70,140 66,160 74,160" fill="#38bdf8" /> <!-- Tie -->

    <!-- Head & Face (Serious, expressive) -->
    <circle cx="70" cy="110" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 55,110 C 55,98 85,98 85,110 C 85,102 75,94 70,94 C 65,94 55,102 55,110 Z" fill="#334155" />
    
    <!-- Serious Expression -->
    <!-- Eyes (focused, slightly narrowed) -->
    <line x1="63" y1="108" x2="69" y2="108" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="73" y1="108" x2="79" y2="108" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Eyebrows (angular, stern) -->
    <path d="M 62,104 L 70,106" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 80,104 L 72,106" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Mouth (firm, speaking) -->
    <path d="M 66,118 Q 70,115 74,118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Gesturing Arm (Pointing forward firmly) -->
    <path d="M 75,135 L 105,125 L 120,122" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 75,135 L 105,125 L 120,122" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand pointing -->
    <circle cx="123" cy="121" r="4" fill="#fbcfe8" />

    <!-- Other Arm -->
    <path d="M 60,135 L 48,165" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
  </g>


  <!-- CHARACTER 2: The Listener / Colleague (Receiving the sharp critique, looking thoughtful/surprised) -->
  <g id="listener-character" transform="translate(90, 10)">
    <!-- Body -->
    <path d="M 90,185 L 95,145 L 115,140 L 125,185 Z" fill="#475569" />
    <path d="M 100,143 L 107,165 L 115,143 Z" fill="#e2e8f0" />

    <!-- Head -->
    <circle cx="108" cy="120" r="15" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 94,120 C 94,107 122,107 122,120 C 122,112 115,103 108,103 C 101,103 94,112 94,120 Z" fill="#b45309" />

    <!-- Surprised/Reflective Expression -->
    <circle cx="103" cy="118" r="2" fill="#1e293b" />
    <circle cx="113" cy="118" r="2" fill="#1e293b" />
    <!-- Raised/Surprised Eyebrows -->
    <path d="M 100,113 Q 103,111 106,113" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 110,113 Q 113,111 116,113" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Open, processing mouth -->
    <ellipse cx="108" cy="127" rx="3" ry="2.5" fill="#1e293b" />

    <!-- Arms (Hugging chest defensively / thoughtfully) -->
    <path d="M 95,145 L 108,155 L 120,145" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>


  <!-- VISUAL METAPHOR FOR "尖锐" (SHARP CRITICISM) -->
  <!-- A dynamic, sleek graphical element floating between them, symbolizing the "sharp words" without using any text -->
  <g transform="translate(118, 95)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.4))">
    <!-- Glowing Sharp Crystal / Spearhead shapes -->
    <polygon points="0,15 12,0 8,30" fill="url(#sharpAccent)" />
    <polygon points="10,20 28,8 16,35" fill="#38bdf8" />
    <polygon points="20,12 38,25 22,40" fill="#fbbf24" />
    
    <!-- Impact/Focus lines radiating -->
    <line x1="-5" y1="20" x2="-15" y2="20" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="5" x2="-8" y2="-3" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="-5" x2="20" y2="-12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Additional Atmospheric Lighting/Vignette -->
  <circle cx="120" cy="115" r="85" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none" />

</svg>