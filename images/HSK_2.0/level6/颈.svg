<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1e293b"/>

  <!-- Ground / Zoo enclosure floor -->
  <path d="M0 180 C60 170, 180 170, 240 180 L240 240 L0 240 Z" fill="#334155"/>

  <!-- Zoo fence/barrier -->
  <rect x="0" y="165" width="240" height="15" fill="#475569"/>
  <rect x="0" y="155" width="240" height="5" fill="#64748b"/>

  <!-- Giraffe (behind characters) -->
  <!-- Giraffe body -->
  <ellipse cx="180" cy="160" rx="25" ry="20" fill="#fbbf24"/>
  <!-- Giraffe legs (simplified) -->
  <rect x="170" y="180" width="8" height="30" fill="#fbbf24"/>
  <rect x="185" y="180" width="8" height="30" fill="#fbbf24"/>
  
  <!-- Giraffe neck - VERY LONG -->
  <path d="M180 140 C178 100, 182 60, 185 30 L195 30 C198 60, 193 100, 190 140 Z" fill="#fbbf24"/>
  <!-- Giraffe head -->
  <circle cx="190" cy="20" r="15" fill="#fbbf24"/>
  <path d="M190 15 C193 10, 198 10, 201 15 L201 20 C198 25, 193 25, 190 20 Z" fill="#f59e0b"/> <!-- Snout -->
  <circle cx="186" cy="15" r="2" fill="#0f172a"/> <!-- Eye 1 -->
  <circle cx="194" cy="15" r="2" fill="#0f172a"/> <!-- Eye 2 -->
  <!-- Ossicones (horns) -->
  <rect x="183" y="5" width="3" height="8" rx="1.5" fill="#f59e0b"/>
  <rect x="193" y="5" width="3" height="8" rx="1.5" fill="#f59e0b"/>

  <!-- Giraffe spots (simplified) -->
  <circle cx="185" cy="150" r="5" fill="#f59e0b"/>
  <circle cx="170" cy="165" r="6" fill="#f59e0b"/>
  <circle cx="195" cy="168" r="4" fill="#f59e0b"/>
  <circle cx="180" cy="120" r="7" fill="#f59e0b"/>
  <circle cx="190" cy="100" r="5" fill="#f59e0b"/>
  <circle cx="182" cy="70" r="6" fill="#f59e0b"/>
  <circle cx="192" cy="50" r="4" fill="#f59e0b"/>
  <circle cx="185" cy="30" r="5" fill="#f59e0b"/>

  <!-- Tree (for giraffe to reach) -->
  <rect x="210" y="0" width="10" height="100" fill="#78350f"/>
  <circle cx="215" cy="90" r="20" fill="#10b981"/>
  <circle cx="200" cy="80" r="15" fill="#10b981"/>
  <circle cx="225" cy="75" r="18" fill="#10b981"/>
  <circle cx="210" cy="60" r="12" fill="#10b981"/>

  <!-- Human Characters -->
  <!-- Adult (left) -->
  <circle cx="70" cy="130" r="15" fill="#38bdf8"/> <!-- Head -->
  <rect x="55" y="140" width="30" height="40" fill="#38bdf8"/> <!-- Body -->
  <rect x="60" y="180" width="10" height="20" fill="#64748b"/> <!-- Leg 1 -->
  <rect x="75" y="180" width="10" height="20" fill="#64748b"/> <!-- Leg 2 -->
  <path d="M60 150 C50 155, 50 165, 55 170" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"/> <!-- Arm 1 -->
  <path d="M80 150 C90 155, 90 165, 85 170" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"/> <!-- Arm 2 -->
  <circle cx="65" cy="125" r="2" fill="#0f172a"/> <!-- Eye 1 -->
  <circle cx="75" cy="125" r="2" fill="#0f172a"/> <!-- Eye 2 -->
  <path d="M68 135 Q72 138, 76 135" stroke="#0f172a" stroke-width="1.5" fill="none"/> <!-- Mouth (slight smile) -->
  <path d="M70 140 L70 145" stroke="#0f172a" stroke-width="1.5" fill="none"/> <!-- Neck line -->

  <!-- Child (right) -->
  <circle cx="120" cy="140" r="12" fill="#fb923c"/> <!-- Head -->
  <rect x="108" y="148" width="24" height="30" fill="#fb923c"/> <!-- Body -->
  <rect x="110" y="178" width="8" height="15" fill="#64748b"/> <!-- Leg 1 -->
  <rect x="120" y="178" width="8" height="15" fill="#64748b"/> <!-- Leg 2 -->
  <path d="M110 155 C100 160, 100 165, 105 170" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round"/> <!-- Arm 1 -->
  <path d="M125 155 C135 160, 135 165, 130 170" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round"/> <!-- Arm 2 (pointing up) -->
  <path d="M130 165 L135 155 L140 150" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round"/> <!-- Pointing finger -->
  <circle cx="117" cy="137" r="1.5" fill="#0f172a"/> <!-- Eye 1 -->
  <circle cx="123" cy="137" r="1.5" fill="#0f172a"/> <!-- Eye 2 -->
  <path d="M118 142 Q122 145, 126 142" stroke="#0f172a" stroke-width="1.2" fill="none"/> <!-- Mouth (open in wonder) -->
  <path d="M120 145 L120 148" stroke="#0f172a" stroke-width="1.2" fill="none"/> <!-- Neck line -->

  <!-- Sun/Light source (subtle glow) -->
  <circle cx="220" cy="20" r="15" fill="#fbbf24" opacity="0.1"/>
  <circle cx="220" cy="20" r="10" fill="#fbbf24" opacity="0.2"/>
</svg>