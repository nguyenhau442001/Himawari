<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Ship Hull Gradient -->
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Sunset Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- Stars / Sky details -->
  <circle cx="40" cy="35" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="70" cy="20" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="110" cy="45" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="25" cy="65" r="1" fill="#f8fafc" opacity="0.4"/>

  <!-- Distant Mountains/City Silhouette -->
  <path d="M0 120 L30 105 L55 115 L90 95 L120 110 L160 90 L200 105 L240 95 L240 130 L0 130 Z" fill="#1e293b" opacity="0.7"/>

  <!-- Water Surface -->
  <rect x="0" y="130" width="240" height="110" fill="url(#waterGrad)"/>

  <!-- Water Ripples / Reflections -->
  <path d="M20 145 Q40 142 60 145 T100 145" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M130 155 Q160 152 190 155 T220 155" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M40 175 Q70 172 100 175 T160 175" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M10 205 Q50 202 90 205 T170 205" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- THE PIER / DOCK (码头 - mǎtóu) -->
  <!-- Wooden pylons under pier -->
  <rect x="130" y="130" width="8" height="60" fill="#451a03"/>
  <rect x="160" y="130" width="8" height="70" fill="#451a03"/>
  <rect x="195" y="130" width="8" height="75" fill="#451a03"/>
  <rect x="225" y="130" width="8" height="80" fill="#451a03"/>

  <!-- Pier platform / boardwalk -->
  <polygon points="110,130 240,120 240,140 110,145" fill="#78350f"/>
  <polygon points="110,125 240,115 240,120 110,130" fill="#b45309"/>
  
  <!-- Wooden planks texture lines -->
  <line x1="130" y1="127" x2="130" y2="142" stroke="#451a03" stroke-width="1"/>
  <line x1="150" y1="126" x2="150" y2="142" stroke="#451a03" stroke-width="1"/>
  <line x1="170" y1="125" x2="170" y2="143" stroke="#451a03" stroke-width="1"/>
  <line x1="190" y1="124" x2="190" y2="143" stroke="#451a03" stroke-width="1"/>
  <line x1="210" y1="123" x2="210" y2="144" stroke="#451a03" stroke-width="1"/>

  <!-- Mooring Bollards (Bollard posts on pier) -->
  <rect x="145" y="115" width="6" height="15" fill="#334155" rx="2"/>
  <ellipse cx="148" cy="115" rx="5" ry="2" fill="#64748b"/>
  
  <rect x="200" y="110" width="6" height="15" fill="#334155" rx="2"/>
  <ellipse cx="203" cy="110" rx="5" ry="2" fill="#64748b"/>

  <!-- Lamppost on Pier -->
  <rect x="225" y="80" width="4" height="45" fill="#1e293b"/>
  <path d="M220 80 L227 70 L234 80 Z" fill="#334155"/>
  <circle cx="227" cy="82" r="4" fill="#fbbf24"/>
  <!-- Light Glow -->
  <circle cx="227" cy="82" r="16" fill="#fbbf24" opacity="0.25"/>

  <!-- THE SHIP (轮船 - lúnchuán) -->
  <!-- Ship Hull -->
  <path d="M25 155 L145 155 C155 155 160 175 160 185 C160 185 100 185 30 185 C20 185 18 165 25 155 Z" fill="url(#shipGrad)"/>
  <path d="M25 155 L145 155 C155 155 160 175 160 185 C160 185 100 185 30 185 C20 185 18 165 25 155 Z" stroke="#9f1239" stroke-width="2" fill="none"/>
  
  <!-- Waterline accent (black stripe) -->
  <path d="M24 175 C60 180 120 180 161 178" stroke="#0f172a" stroke-width="3" fill="none"/>

  <!-- Ship Deck and Cabins -->
  <rect x="45" y="135" width="85" height="20" fill="#f1f5f9" rx="2"/>
  <!-- Windows on lower deck -->
  <circle cx="60" cy="145" r="3" fill="#0f172a"/>
  <circle cx="75" cy="145" r="3" fill="#0f172a"/>
  <circle cx="90" cy="145" r="3" fill="#0f172a"/>
  <circle cx="105" cy="145" r="3" fill="#0f172a"/>

  <!-- Upper Bridge / Cabin -->
  <rect x="65" y="115" width="50" height="20" fill="#f1f5f9" rx="2"/>
  <rect x="75" y="120" width="30" height="10" fill="#0284c7" rx="1"/>

  <!-- Funnel / Smokestack -->
  <rect x="95" y="95" width="14" height="22" fill="#cbd5e1" rx="1"/>
  <rect x="93" y="93" width="18" height="5" fill="#0f172a" rx="1"/>
  <!-- Steam / Smoke -->
  <path d="M100 90 Q95 75 105 65 T100 45" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M105 85 Q115 70 110 55" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Mast & Flag -->
  <line x1="45" y1="135" x2="45" y2="95" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="45,95 30,100 45,105" fill="#f59e0b"/>

  <!-- Mooring Ropes (Ties ship to the pier / 码头) -->
  <path d="M50 155 Q90 135 145 120" stroke="#fef3c7" stroke-width="2" stroke-dasharray="3,2" fill="none"/>
  <path d="M125 155 Q165 140 200 115" stroke="#fef3c7" stroke-width="2" stroke-dasharray="3,2" fill="none"/>

  <!-- CHARACTERS ON THE PIER -->
  <!-- Character 1: Tourist / Traveler with backpack looking at ship -->
  <g transform="translate(160, 95)">
    <!-- Backpack -->
    <rect x="-1" y="15" width="10" height="15" fill="#059669" rx="3"/>
    <!-- Body -->
    <path d="M3 14 C1 14 0 20 0 30 L10 30 C10 20 8 14 3 14 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="5" cy="8" r="6" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M-1 7 C0 3 10 3 11 7 C9 4 1 4 -1 7 Z" fill="#1e293b"/>
    <!-- Legs -->
    <line x1="3" y1="30" x2="2" y2="45" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="30" x2="9" y2="45" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Arm pointing at ship -->
    <path d="M5 18 L-5 24" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Pier Worker / Sailor holding clipboard -->
  <g transform="translate(195, 93)">
    <!-- Body -->
    <rect x="0" y="13" width="12" height="18" fill="#e2e8f0" rx="2"/>
    <!-- Vest -->
    <path d="M0 13 L6 13 L6 31 L0 31 Z" fill="#f59e0b"/>
    <path d="M6 13 L12 13 L12 31 L6 31 Z" fill="#f59e0b"/>
    <!-- Head & Cap -->
    <circle cx="6" cy="7" r="6" fill="#fcd34d"/>
    <path d="M1 4 L11 4 L12 2 L0 2 Z" fill="#0284c7"/>
    <rect x="8" y="3" width="6" height="2" fill="#0284c7" rx="1"/>
    <!-- Legs -->
    <line x1="3" y1="31" x2="3" y2="47" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="31" x2="9" y2="47" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <!-- Arm holding clipboard -->
    <path d="M9 18 L15 25" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    <!-- Clipboard -->
    <rect x="13" y="23" width="5" height="7" fill="#f8fafc" rx="1"/>
  </g>

  <!-- Seagulls flying in the sky -->
  <path d="M65 60 Q70 52 75 60 Q80 52 85 60" stroke="#f8fafc" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M135 45 Q140 39 145 45 Q150 39 155 45" stroke="#f8fafc" stroke-width="1.2" fill="none" stroke-linecap="round"/>

</svg>