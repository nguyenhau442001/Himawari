<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Interior Architectural Details -->
  <!-- Back Wall Panel -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4"/>
  
  <!-- Scales of Justice emblem on back wall -->
  <g transform="translate(120, 55)" opacity="0.8">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M0 -15 V10 M-12 -6 H12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M-12 -6 L-16 4 H-8 Z M12 -6 L8 4 H16 Z" fill="#fbbf24"/>
    <path d="M-16 4 C-16 8 -8 8 -8 4 M8 4 C8 8 16 8 16 4" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Side Windows with warm courtroom light -->
  <path d="M20 30 H50 V130 H20 Z" fill="url(#glow)"/>
  <path d="M220 30 H190 V130 H220 Z" fill="url(#glow)"/>

  <!-- Judge's Bench / Elevated Platform -->
  <rect x="70" y="115" width="100" height="10" fill="#451a03" rx="2"/>
  <rect x="65" y="125" width="110" height="45" fill="url(#wood)" rx="2"/>
  <!-- Gavel & Block on Bench -->
  <rect x="110" y="120" width="20" height="6" fill="#f59e0b" rx="1"/>
  <path d="M113 120 V110 H127 V120 Z" fill="#b45309" stroke="#d97706" stroke-width="1"/>
  <rect x="105" y="106" width="30" height="4" fill="#fbbf24" rx="1"/>

  <!-- Lawyer / Opposing Party Left -->
  <g transform="translate(60, 140)">
    <!-- Body & Suit -->
    <path d="M 0 50 C 0 35, 15 30, 25 30 C 35 30, 50 35, 50 50 Z" fill="#38bdf8"/>
    <polygon points="15,30 35,30 25,50" fill="#ffffff"/> <!-- Shirt collar -->
    <polygon points="23,32 27,32 25,44" fill="#ef4444"/> <!-- Tie -->
    <!-- Head & Hair -->
    <circle cx="25" cy="15" r="12" fill="#fbcfe8"/>
    <path d="M 13 15 C 13 5, 37 5, 37 15 C 37 12, 35 8, 25 8 C 15 8, 13 12, 13 15 Z" fill="#0f172a"/>
    <!-- Expressive Arm gesturing towards dispute -->
    <path d="M 35 35 Q 50 40, 55 25" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="25" r="4" fill="#fbcfe8"/>
    <!-- Briefcase on floor -->
    <rect x="-10" y="40" width="14" height="10" rx="2" fill="#78350f"/>
    <path d="M -5 40 V 37 H 1 V 40" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Opposing Party Right -->
  <g transform="translate(130, 140)">
    <!-- Body & Suit -->
    <path d="M 0 50 C 0 35, 15 30, 25 30 C 35 30, 50 35, 50 50 Z" fill="#10b981"/>
    <polygon points="15,30 35,30 25,50" fill="#ffffff"/>
    <polygon points="23,32 27,32 25,44" fill="#3b82f6"/>
    <!-- Head & Hair -->
    <circle cx="25" cy="15" r="12" fill="#fef08a"/>
    <path d="M 13 12 C 15 3, 35 3, 37 12 C 35 8, 15 8, 13 12 Z" fill="#78350f"/>
    <!-- Arm holding document / folder -->
    <path d="M 15 35 Q 5 45, -5 35" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <!-- Folder/Evidence papers -->
    <rect x="-15" y="25" width="16" height="20" fill="#f8fafc" rx="1"/>
    <path d="M -12 30 H -5 M -12 34 H -7 M -12 38 H -8" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Central Disputed Document / Contract (Symbolizing the "这件事" - This Matter) -->
  <g transform="translate(108, 155)">
    <rect x="0" y="0" width="24" height="30" fill="#f8fafc" rx="2" transform="rotate(-10 12 15)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Red Official Seal / Stamp on Document -->
    <circle cx="12" cy="18" r="5" fill="none" stroke="#ef4444" stroke-width="1.5" transform="rotate(-10 12 15)"/>
    <path d="M 10 18 L 12 20 L 15 15" fill="none" stroke="#ef4444" stroke-width="1" transform="rotate(-10 12 15)"/>
  </g>

  <!-- Foreground Floor Line -->
  <rect x="0" y="190" width="240" height="50" fill="#0f172a"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="3"/>
  
  <!-- Subtle Dynamic Conflict Sparks/Accents -->
  <path d="M 105 135 L 115 125" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 135 135 L 125 125" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
</svg>