<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Window showing stormy weather (Context: "current situation" - bad weather / urgent condition) -->
  <path d="M40 35 H100 V115 H40 Z" fill="#1e293b" stroke="#475569" stroke-width="3" rx="4"/>
  <!-- Rain streaks outside window -->
  <line x1="50" y1="45" x2="45" y2="65" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="70" y1="50" x2="65" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="90" y1="40" x2="85" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="55" y1="75" x2="50" y2="95" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="80" y1="80" x2="75" y2="100" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Lightning flash -->
  <polygon points="75,45 65,75 80,75 70,105" fill="#fbbf24" opacity="0.3"/>

  <!-- Office Interior Wall Art & Shelf -->
  <rect x="130" y="30" href="#" width="70" height="4" rx="2" fill="#475569"/>
  <path d="M145 30 L150 15 H170 L175 30 Z" fill="#0ea5e9" opacity="0.4"/>
  <circle cx="185" cy="45" r="8" fill="#10b981" opacity="0.5"/>

  <!-- Large Office Desk -->
  <path d="M20 160 H220 V210 H20 Z" fill="url(#desk)" stroke="#475569" stroke-width="2"/>
  <rect x="20" y="152" width="200" height="8" rx="3" fill="#475569"/>

  <!-- Meeting / Presentation Board in Background -->
  <rect x="120" y="70" width="90" height="70" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Calendar / Clock icon on board showing scheduled meeting time -->
  <circle cx="165" cy="95" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polyline points="165,87 165,95 173,95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Postponed / Delayed symbol (Arrow curving back / clock hand pointing back) -->
  <path d="M150 120 Q165 110 180 120" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <polyline points="175,115 180,120 174,125" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Desk Props -->
  <!-- Laptop open -->
  <path d="M45 145 L35 155 H85 L75 145 Z" fill="#64748b"/>
  <rect x="42" y="125" width="38" height="22" rx="2" fill="#94a3b8"/>
  <rect x="45" y="128" width="32" height="16" fill="#0f172a"/>

  <!-- Coffee mug with steam -->
  <rect x="95" y="135" width="12" height="15" rx="2" fill="#cbd5e1"/>
  <path d="M107 138 C112 138 112 146 107 146" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M98 128 Q100 122 97 118" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Main Character (Project Manager / Decision Maker) -->
  <!-- Body / Torso -->
  <path d="M110 200 C110 175 120 165 140 165 C160 165 170 175 170 200 Z" fill="#0ea5e9"/>
  <!-- Collar / Shirt -->
  <polygon points="130,165 140,178 150,165" fill="#f8fafc"/>
  <polygon points="135,165 140,173 145,165" fill="#ef4444"/> <!-- Tie -->

  <!-- Neck & Head -->
  <rect x="133" y="152" width="14" height="16" fill="#fcd34d"/>
  <circle cx="140" cy="140" r="18" fill="#fcd34d"/>

  <!-- Hair -->
  <path d="M122 138 C122 125 132 120 140 120 C150 120 158 126 158 138 C152 135 145 133 140 133 C135 133 128 135 122 138 Z" fill="#334155"/>

  <!-- Expressive Face (Thoughtful / Decisive gesture) -->
  <circle cx="134" cy="138" r="1.5" fill="#1e293b"/>
  <circle cx="146" cy="138" r="1.5" fill="#1e293b"/>
  <!-- Eyebrows furrowed slightly -->
  <line x1="131" y1="134" x2="137" y2="135" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="143" y1="135" x2="149" y2="134" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mouth firm/serious line -->
  <path d="M136 148 Q140 146 144 148" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arm pointing / gesturing toward the delay schedule / weather -->
  <path d="M125 175 Q105 160 95 175" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="93" cy="177" r="5" fill="#fcd34d"/>

  <!-- Accent lighting (Warm desk lamp glow on character) -->
  <circle cx="140" cy="140" r="60" fill="url(#warm-glow)" style="mix-blend-mode: overlay;" pointer-events="none"/>
</svg>