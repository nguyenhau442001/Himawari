<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing connection/jurisdiction -->
  <circle cx="120" cy="120" r="80" fill="#222B38" opacity="0.6"/>

  <!-- Central Visual Representation for "涉及" (Involving/Touching upon multiple nodes/jurisdictions) -->
  <g transform="translate(120, 120)">
    <!-- Connecting network lines (Intersection/Involvement) -->
    <path d="M-50 -30 L50 -30 M-40 20 L40 20 M0 -50 L0 50" stroke="#3A475C" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
    
    <!-- Central core node (The core subject/case) -->
    <circle cx="0" cy="0" r="32" fill="#2A3446" stroke="#4F627D" stroke-width="2"/>
    
    <!-- Document/Case icon in the center -->
    <rect x="-10" y="-14" width="20" height="28" rx="2" fill="#E6EDF5"/>
    <rect x="-6" y="-8" width="12" height="2" rx="1" fill="#1A1D24"/>
    <rect x="-6" y="-3" width="12" height="2" rx="1" fill="#1A1D24"/>
    <rect x="-6" y="2" width="8" height="2" rx="1" fill="#1A1D24"/>

    <!-- Orbiting nodes representing multiple countries/entities involved (涉及多个国家) -->
    <!-- Node 1: Top Left -->
    <g transform="translate(-50, -35)">
      <circle cx="0" cy="0" r="16" fill="#F2994A"/>
      <path d="M-8 2 C-8 -4 8 -4 8 2 M-6 -2 C-6 -6 6 -6 6 -2" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Node 2: Top Right -->
    <g transform="translate(50, -35)">
      <circle cx="0" cy="0" r="16" fill="#2F80ED"/>
      <circle cx="0" cy="0" r="8" stroke="#1A1D24" stroke-width="1.5" fill="none"/>
      <path d="M-8 0 H8" stroke="#1A1D24" stroke-width="1.5"/>
    </g>

    <!-- Node 3: Bottom Center -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="16" fill="#27AE60"/>
      <path d="M-6 4 L0 -6 L6 4 Z" fill="#1A1D24"/>
    </g>

    <!-- Focus/Connection indicators (Highlighting the "reach" or "involvement") -->
    <path d="M-28 -18 L-38 -25" stroke="#F2994A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 -18 L38 -25" stroke="#2F80ED" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 32 L0 38" stroke="#27AE60" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>