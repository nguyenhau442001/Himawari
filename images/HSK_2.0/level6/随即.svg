<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Outer glow / pulse ring indicating immediacy -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#FF9F43" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
    
    <!-- Timeline/Action Track -->
    <path d="M-60 40 L60 40" stroke="#2D323F" stroke-width="6" stroke-linecap="round"/>
    <path d="M-60 40 L-10 40" stroke="#FF9F43" stroke-width="6" stroke-linecap="round"/>

    <!-- Step 1: The Phone Call (Trigger Object) -->
    <g transform="translate(-45, -5)">
      <!-- Phone Body -->
      <rect x="-16" y="-30" width="32" height="52" rx="6" fill="#2D323F" stroke="#FF9F43" stroke-width="2"/>
      <!-- Screen -->
      <rect x="-12" y="-22" width="24" height="32" rx="2" fill="#1A1D24"/>
      <!-- Call wave icon -->
      <path d="M-6 -2 C-3 -5 -3 -11 -6 -14" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
      <path d="M-2 0 C3 -4 3 -14 -2 -18" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <!-- Home Button / Indicator -->
      <circle cx="0" cy="16" r="2" fill="#FF9F43"/>
    </g>

    <!-- Rapid Transition Arrow (Immediate action indicator) -->
    <g transform="translate(5, -5)">
      <path d="M-10 0 L15 0 M8 -7 L16 0 L8 7" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Step 2: The Character Stepping Out (Result Object) -->
    <g transform="translate(45, -5)">
      <!-- Door Frame Background -->
      <rect x="-14" y="-32" width="28" height="60" rx="3" fill="#1A1D24" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 2"/>
      
      <!-- Character Silhouette / Modern Flat Style -->
      <!-- Head -->
      <circle cx="4" cy="-18" r="7" fill="#FF9F43"/>
      <!-- Body / Coat -->
      <path d="M-2 -10 L10 -8 L14 18 L-6 18 Z" fill="#FF9F43"/>
      <!-- Legs in motion (Right after) -->
      <path d="M2 18 L10 27" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
      <path d="M4 18 L-2 25" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>
</svg>