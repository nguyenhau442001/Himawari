<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stage Spotlight Gradient -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Idol Jacket Gradient -->
    <linearGradient id="idolJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Fan Hoodie Gradient -->
    <linearGradient id="fanHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Stage Lights in Background -->
  <circle cx="60" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="180" cy="40" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="210" cy="70" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="40" cy="90" r="2.5" fill="#10b981" opacity="0.6"/>

  <!-- Concert Beam / Spotlight cone -->
  <polygon points="120,0 60,220 180,220" fill="url(#spotlight)"/>

  <!-- Background Stage Details / Equipment -->
  <rect x="95" y="110" width="10" height="110" fill="#0f172a" opacity="0.8"/>
  <polygon points="100,105 85,115 115,115" fill="#334155"/>
  <!-- Microphone Stand -->
  <line x1="120" y1="90" x2="120" y2="190" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="85" r="4" fill="#cbd5e1"/>

  <!-- IDOL (Center Stage, singing, stylish pose) -->
  <g id="idol">
    <!-- Idol Shadow/Glow -->
    <ellipse cx="120" cy="205" rx="35" ry="6" fill="#000000" opacity="0.4"/>
    
    <!-- Idol Legs -->
    <path d="M110 165 L106 202 L116 202 L118 175 Z" fill="#0f172a"/>
    <path d="M130 165 L134 202 L124 202 L122 175 Z" fill="#0f172a"/>
    <path d="M103 200 L117 200 L117 205 L103 205 Z" fill="#334155"/>
    <path d="M123 200 L137 200 L137 205 L123 205 Z" fill="#334155"/>

    <!-- Idol Torso & Jacket -->
    <path d="M100 125 L140 125 L145 170 L95 170 Z" fill="url(#idolJacket)"/>
    <path d="M100 125 L120 155 L140 125" fill="#1e293b"/> <!-- Inner shirt -->
    <!-- Jacket details (Lapels & Accents) -->
    <path d="M100 125 L115 170 L105 170 Z" fill="#f43f5e"/>
    <path d="M140 125 L125 170 L135 170 Z" fill="#f43f5e"/>
    <circle cx="120" cy="140" r="1.5" fill="#fbbf24"/>
    <circle cx="120" cy="150" r="1.5" fill="#fbbf24"/>

    <!-- Idol Arms (Dynamic pose holding mic) -->
    <path d="M100 130 Q85 145 95 160" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round"/>
    <path d="M140 130 Q150 110 135 105" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round"/>
    <!-- Idol Hand holding mic -->
    <circle cx="132" cy="103" r="4" fill="#fbcfe8"/>
    <ellipse cx="130" cy="100" rx="3" ry="5" fill="#94a3b8" transform="rotate(-30 130 100)"/>

    <!-- Idol Head & Hair -->
    <circle cx="120" cy="100" r="15" fill="#fbcfe8"/>
    <!-- Trendy Idol Hair -->
    <path d="M103 98 Q105 82 120 83 Q135 82 137 98 Q140 88 132 80 Q120 75 108 80 Q100 88 103 98 Z" fill="#334155"/>
    <!-- Face Expression (Happy/Singing) -->
    <path d="M115 99 Q120 103 125 99" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M117 107 Q120 111 123 107" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND FANS (Representing "many young people" / 很多年轻人 admiring the idol) -->
  
  <!-- Fan Left (Young woman cheering with lightstick/phone) -->
  <g id="fan-left">
    <!-- Body/Hoodie -->
    <path d="M45 170 L75 170 L80 220 L40 220 Z" fill="url(#fanHoodie)"/>
    <!-- Head -->
    <circle cx="60" cy="148" r="12" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M48 145 Q46 130 60 130 Q74 130 72 145 Q75 165 70 170 L50 170 Q45 160 48 145 Z" fill="#475569"/>
    <!-- Raised Arm holding lightstick -->
    <path d="M72 160 Q85 130 78 115" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Glow Lightstick -->
    <circle cx="76" cy="110" r="7" fill="#f43f5e"/>
    <circle cx="76" cy="110" r="10" fill="#f43f5e" opacity="0.4"/>
    <rect x="75" y="117" width="2" height="6" fill="#94a3b8"/>
    <!-- Face profile indicator -->
    <path d="M66 146 Q68 150 66 154" fill="none" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Fan Right (Young man taking photo with phone / cheering) -->
  <g id="fan-right">
    <!-- Body/Jacket -->
    <path d="M165 175 L195 170 L205 220 L155 220 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="180" cy="152" r="12" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M168 150 Q170 138 180 138 Q192 138 192 150 Q195 142 188 136 Q180 133 172 136 Q165 142 168 150 Z" fill="#1e293b"/>
    <!-- Raised Arms holding phone -->
    <path d="M168 165 Q175 140 185 140" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <!-- Smartphone screen glow -->
    <rect x="180" y="132" width="10" height="14" rx="2" fill="#38bdf8" transform="rotate(15 180 132)"/>
    <line x1="183" y1="130" x2="175" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Additional Small Crowd Silhouette (Adding depth in background) -->
  <g id="crowd-silhouette" fill="#0f172a" opacity="0.9">
    <circle cx="20" cy="190" r="9"/>
    <path d="M10 210 L30 210 L30 240 L10 240 Z"/>
    
    <circle cx="220" cy="185" r="10"/>
    <path d="M210 205 L230 205 L235 240 L205 240 Z"/>

    <circle cx="95" cy="195" r="8"/>
    <circle cx="145" cy="195" r="8"/>
  </g>

  <!-- Atmospheric Light Particles / Confetti -->
  <circle cx="90" cy="130" r="2" fill="#fbbf24"/>
  <circle cx="155" cy="120" r="1.5" fill="#f43f5e"/>
  <circle cx="70" cy="80" r="1.5" fill="#38bdf8"/>
  <circle cx="170" cy="90" r="2" fill="#10b981"/>
  <rect x="105" y="70" width="4" height="2" fill="#fbbf24" transform="rotate(25 105 70)"/>
  <rect x="135" y="65" width="3" height="3" fill="#ec4899" transform="rotate(45 135 65)"/>

  <!-- Border Frame / Vignette Effect (Subtle rounded frame) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>