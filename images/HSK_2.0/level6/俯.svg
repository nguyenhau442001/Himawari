<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Floor Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="pants-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Environment & Context Props -->
  <!-- Floor -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#floor-grad)" />
  <!-- Baseboard trim -->
  <rect x="0" y="165" width="240" height="5" fill="#0f172a" />

  <!-- Bookshelf in background -->
  <g opacity="0.6">
    <rect x="25" y="60" width="55" height="110" fill="#334155" rx="2" />
    <rect x="30" y="90" width="45" height="4" fill="#1e293b" />
    <rect x="30" y="125" width="45" height="4" fill="#1e293b" />
    <!-- Books -->
    <path d="M35 75 L45 75 L45 90 L35 90 Z" fill="#ec4899" />
    <path d="M48 72 L58 72 L58 90 L48 90 Z" fill="#10b981" />
    <path d="M61 78 L69 78 L69 90 L61 90 Z" fill="#f59e0b" />
    <path d="M35 105 L43 105 L43 125 L35 125 Z" fill="#38bdf8" />
    <path d="M46 110 L56 110 L56 125 L46 125 Z" fill="#fb923c" />
  </g>

  <!-- Potted Plant -->
  <g transform="translate(190, 110)">
    <!-- Pot -->
    <path d="M10 40 L26 40 L32 60 L4 60 Z" fill="#cbd5e1" />
    <!-- Plant Leaves -->
    <path d="M18 40 Q 5 20, 10 5 Q 18 15, 18 40 Z" fill="#10b981" />
    <path d="M18 40 Q 30 15, 25 2 Q 20 18, 18 40 Z" fill="#059669" />
    <path d="M18 40 Q 12 10, 2 18 Q 10 25, 18 40 Z" fill="#34d399" />
  </g>

  <!-- Hanging Wall Lamp casting light -->
  <path d="M130 0 L130 35" stroke="#475569" stroke-width="3" />
  <path d="M115 35 L145 35 L150 50 L110 50 Z" fill="#475569" />
  <circle cx="130" cy="50" r="8" fill="#fef08a" />
  <circle cx="130" cy="95" r="70" fill="url(#lamp-glow)" />

  <!-- Dropped Object on the floor (The key/item being picked up) -->
  <g transform="translate(95, 180)" filter="url(#shadow)">
    <!-- Keys -->
    <circle cx="5" cy="5" r="4" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    <path d="M8 8 L18 15 M14 11 L17 10 M16 13 L18 12" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: BENDING DOWN (俯身) -->
  <g id="character" filter="url(#shadow)">
    
    <!-- Shadow beneath character -->
    <ellipse cx="140" cy="183" rx="35" ry="8" fill="#020617" opacity="0.6" />

    <!-- Legs & Feet (Stanced for bending) -->
    <!-- Back Leg (Left) -->
    <path d="M125 140 Q 115 160, 105 178 L 115 180 Q 123 165, 132 143 Z" fill="url(#pants-grad)" />
    <!-- Shoes Left -->
    <ellipse cx="110" cy="181" rx="9" ry="5" fill="#1e293b" />

    <!-- Front Leg (Right, bending slightly) -->
    <path d="M140 142 Q 155 160, 158 178 L 168 176 Q 163 155, 145 138 Z" fill="url(#pants-grad)" />
    <!-- Shoes Right -->
    <ellipse cx="163" cy="177" rx="9" ry="5" fill="#1e293b" />

    <!-- Torso (Leaning forward / 俯) -->
    <!-- Using a rotated/angled polygon/path for dynamic torso angle -->
    <g transform="translate(110, 120) rotate(-45)">
      <!-- Torso shape -->
      <rect x="0" y="0" width="35" height="42" rx="10" fill="url(#shirt-grad)" />
      <!-- Belt -->
      <rect x="32" y="0" width="4" height="42" fill="#0f172a" opacity="0.3" />
    </g>

    <!-- Head and Hair (Leaning down synchronously) -->
    <g transform="translate(72, 88)">
      <!-- Neck -->
      <path d="M18 15 L26 25" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" />
      <!-- Hair Back -->
      <circle cx="12" cy="10" r="14" fill="#334155" />
      <!-- Face -->
      <circle cx="15" cy="14" r="13" fill="#fecdd3" />
      <!-- Hair Front / Bangs -->
      <path d="M5 10 Q 12 3, 22 8 Q 18 15, 10 12 Z" fill="#334155" />
      <!-- Facial Expression (Focused/Intentional eyes looking down at object) -->
      <circle cx="19" cy="13" r="1.5" fill="#1e293b" />
      <!-- Gentle curved smile showing concentration -->
      <path d="M21 18 Q 23 20, 25 18" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Arms Reaching Down to Pick Up Object -->
    <!-- Back Arm (Passive/balance) -->
    <path d="M125 125 Q 110 135, 100 130" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Front Arm (Reaching down towards the floor/keys) -->
    <!-- Shoulder to elbow to hand reaching target -->
    <path d="M135 122 Q 110 145, 95 174" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Hand detail gripping/reaching -->
    <circle cx="95" cy="176" r="5" fill="#fecdd3" />
  </g>

  <!-- Motion/Action Sparkles (Highlighting the "Picking Up" action) -->
  <g transform="translate(92, 172)" opacity="0.8">
    <path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="translate(108, 168)" opacity="0.6">
    <circle cx="0" cy="0" r="2" fill="#38bdf8" />
  </g>
</svg>