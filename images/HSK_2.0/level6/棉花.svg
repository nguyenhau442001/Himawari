<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Golden Hour Sky/Sun -->
    <radialGradient id="sunGlow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Field Soil Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="30%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#271002" />
    </linearGradient>

    <!-- Cotton Fluff Gradient -->
    <linearGradient id="cottonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Basket Gradient -->
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Distant Hills / Rural Horizon -->
  <path d="M0 130 Q60 110 130 125 T240 120 L240 160 L0 160 Z" fill="#334155" opacity="0.6" />
  <path d="M0 145 Q90 130 180 140 T240 138 L240 160 L0 160 Z" fill="#475569" opacity="0.8" />

  <!-- Agricultural Field (Ground) -->
  <path d="M0 155 Q120 140 240 155 L240 240 L0 240 Z" fill="url(#soilGrad)" />
  <!-- Soil Furrows / Rows -->
  <path d="M20 180 Q80 170 140 200 T240 210" stroke="#271002" stroke-width="4" fill="none" opacity="0.7" />
  <path d="M0 210 Q60 195 130 225 T240 235" stroke="#271002" stroke-width="4" fill="none" opacity="0.7" />

  <!-- Cotton Plant Background Rows (Smaller) -->
  <!-- Row 1 -->
  <circle cx="40" cy="158" r="6" fill="#15803d" />
  <circle cx="90" cy="165" r="7" fill="#15803d" />
  <circle cx="150" cy="172" r="6" fill="#15803d" />
  <circle cx="210" cy="180" r="7" fill="#15803d" />
  
  <!-- BACKBONE: THE MAIN COTTON BUSH (Foreground - Right Side) -->
  <g id="mainCottonBush" filter="url(#shadow)">
    <!-- Stem and branches -->
    <path d="M180 220 Q178 190 175 170" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M175 195 Q160 185 145 180" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M177 185 Q195 175 205 165" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M176 172 Q170 155 165 145" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Green Leaves -->
    <path d="M145 180 Q135 175 140 165 Q150 165 155 175 Z" fill="#22c55e" />
    <path d="M205 165 Q215 155 210 145 Q200 150 195 160 Z" fill="#16a34a" />
    <path d="M165 145 Q160 135 170 132 Q175 140 170 145 Z" fill="#22c55e" />

    <!-- Ripe Open Cotton Bolls (Target Concept: 棉花) -->
    <!-- Boll 1 (Lower Left Branch) -->
    <g transform="translate(142, 175)">
      <path d="M0 0 Q-8 -6 -2 -12 Q6 -14 10 -6 Q8 4 0 0" fill="#7c2d12" />
      <circle cx="-3" cy="-4" r="7" fill="url(#cottonGrad)" />
      <circle cx="4" cy="-5" r="7" fill="url(#cottonGrad)" />
      <circle cx="1" cy="3" r="6" fill="url(#cottonGrad)" />
      <!-- Soft highlight -->
      <circle cx="-4" cy="-6" r="3" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Boll 2 (Upper Right Branch) -->
    <g transform="translate(202, 160)">
      <path d="M0 0 Q-6 -6 2 -10 Q10 -6 6 4 Q-2 6 0 0" fill="#7c2d12" />
      <circle cx="-3" cy="-3" r="8" fill="url(#cottonGrad)" />
      <circle cx="4" cy="-2" r="7" fill="url(#cottonGrad)" />
      <circle cx="0" cy="5" r="7" fill="url(#cottonGrad)" />
      <circle cx="2" cy="-4" r="3" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Boll 3 (Top Center - Being Harvested / Picked) -->
    <g transform="translate(164, 140)">
      <path d="M0 0 Q-5 -8 2 -12 Q9 -8 5 4 Q-4 4 0 0" fill="#7c2d12" />
      <circle cx="-4" cy="-4" r="8" fill="url(#cottonGrad)" />
      <circle cx="3" cy="-3" r="8" fill="url(#cottonGrad)" />
      <circle cx="0" cy="4" r="7" fill="url(#cottonGrad)" />
    </g>
  </g>

  <!-- HARVEST BASKET (Filled with harvested white cotton) -->
  <g id="basket" filter="url(#shadow)" transform="translate(115, 185)">
    <!-- Basket Body -->
    <path d="M5 0 L25 0 Q30 25 28 35 Q15 38 2 35 Q0 25 5 0 Z" fill="url(#basketGrad)" />
    <!-- Weave texture lines -->
    <path d="M8 8 L22 8 M6 16 L24 16 M4 24 L26 24" stroke="#78350f" stroke-width="1.5" opacity="0.6" />
    <path d="M10 0 L10 36 M20 0 L20 37" stroke="#78350f" stroke-width="1.5" opacity="0.4" />
    <!-- Rim -->
    <ellipse cx="15" cy="0" rx="10" ry="3" fill="#f59e0b" />
    <!-- Cotton overflowing from basket -->
    <circle cx="12" cy="-3" r="7" fill="url(#cottonGrad)" />
    <circle cx="20" cy="-2" r="8" fill="url(#cottonGrad)" />
    <circle cx="16" cy="-8" r="9" fill="url(#cottonGrad)" />
  </g>

  <!-- FARMER CHARACTER (Active harvesting action) -->
  <g id="farmer" filter="url(#shadow)">
    <!-- Legs (Kneeling / Crouching in the field) -->
    <!-- Left Leg (bent) -->
    <path d="M65 210 Q50 215 45 228 L75 230 Q80 218 65 210 Z" fill="#1e3a8a" />
    <!-- Right Knee on ground -->
    <path d="M85 205 Q100 210 110 225 L95 232 Q85 220 85 205 Z" fill="#1e3a8a" />
    <!-- Boots -->
    <ellipse cx="40" cy="231" rx="8" ry="4" fill="#334155" />
    <ellipse cx="100" cy="233" rx="8" ry="4" fill="#334155" />

    <!-- Torso (Leaning forward into the bush) -->
    <path d="M60 170 Q75 160 90 180 L80 215 Q60 215 55 195 Z" fill="#ea580c" />
    <!-- Orange vest / jacket style -->
    <path d="M62 172 Q72 165 85 182 L78 212 Q63 212 60 195 Z" fill="#f97316" />
    <path d="M70 170 L72 214" stroke="#c2410c" stroke-width="3" opacity="0.5" />

    <!-- Head & Straw Hat -->
    <!-- Head/Face profile -->
    <circle cx="85" cy="155" r="12" fill="#fed7aa" />
    <!-- Happy / Focused Face Expression -->
    <path d="M89 154 Q92 157 95 154" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="91" cy="152" r="1.5" fill="#78350f" />
    <path d="M83 160 Q87 164 91 161" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Traditional Asian Straw Hat (Conical, tilted as they work) -->
    <ellipse cx="85" cy="144" rx="22" ry="7" fill="#fbbf24" />
    <path d="M63 144 Q85 125 107 144 Z" fill="#f59e0b" />
    <ellipse cx="85" cy="144" rx="22" ry="7" fill="none" stroke="#d97706" stroke-width="1" />

    <!-- Left Arm (Supporting balance) -->
    <path d="M65 178 Q48 185 45 195" stroke="#ea580c" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="43" cy="197" r="4" fill="#fed7aa" />

    <!-- Right Arm (Reaching forward, actively picking cotton from the plant) -->
    <path d="M85 175 Q115 165 145 145" stroke="#ea580c" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hand gently holding the fluffy cotton -->
    <circle cx="150" cy="143" r="5" fill="#fed7aa" />

    <!-- The exact cotton boll being plucked in hand -->
    <g transform="translate(150, 141)">
      <circle cx="0" cy="0" r="7" fill="url(#cottonGrad)" filter="url(#shadow)" />
      <circle cx="-3" cy="-2" r="5" fill="#ffffff" />
    </g>
  </g>

  <!-- Ambient Floating Cotton Fluffs / Particles (Adds magical natural atmosphere) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="130" cy="100" r="3" />
    <circle cx="140" cy="108" r="2" />
    <circle cx="190" cy="120" r="3.5" />
    <circle cx="205" cy="112" r="2" />
    <path d="M188 118 Q192 116 195 119 Q192 122 188 118 Z" fill="#ffffff" opacity="0.8" />
    <circle cx="105" cy="125" r="2.5" />
  </g>

  <!-- Foreground Grass Tufts (Depth of field elements) -->
  <path d="M10 240 L12 215 L18 240 Z" fill="#16a34a" />
  <path d="M220 240 L226 218 L232 240 Z" fill="#15803d" />
  <path d="M228 240 L233 223 L238 240 Z" fill="#22c55e" />
</svg>