<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Window Frame & Night Sky Context -->
  <g id="window-scene">
    <!-- Window Outer Wall -->
    <rect x="110" y="20" width="115" height="180" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Night Sky View outside window -->
    <clipPath id="window-clip">
      <rect x="115" y="25" width="105" height="170" rx="2" />
    </clipPath>
    
    <g clip-path="url(#window-clip)">
      <rect x="115" y="25" width="105" height="170" fill="#090d16"/>
      <!-- Moon -->
      <circle cx="190" cy="55" r="14" fill="#fef08a" opacity="0.9"/>
      <!-- Soft moon glow -->
      <circle cx="190" cy="55" r="26" fill="#fef08a" opacity="0.15"/>
      <!-- Distant City Lights / Stars -->
      <circle cx="135" cy="140" r="1.5" fill="#38bdf8" opacity="0.8"/>
      <circle cx="150" cy="155" r="1" fill="#fb923c" opacity="0.7"/>
      <circle cx="170" cy="130" r="1.5" fill="#f43f5e" opacity="0.6"/>
      <circle cx="145" cy="175" r="1" fill="#38bdf8" opacity="0.5"/>
      <!-- Distant Cityscape Silhouettes -->
      <path d="M115 195 L115 170 L125 160 L125 195 Z" fill="#111827"/>
      <path d="M130 195 L130 145 L145 145 L145 195 Z" fill="#111827"/>
      <path d="M150 195 L150 130 L168 130 L168 195 Z" fill="#111827"/>
      <path d="M175 195 L175 165 L190 165 L190 195 Z" fill="#111827"/>
      
      <!-- Window pane divider vertical -->
      <rect x="165" y="25" width="4" height="170" fill="#2d3748"/>
      <!-- Window pane divider horizontal -->
      <rect x="115" y="105" width="105" height="4" fill="#2d3748"/>
    </g>

    <!-- Indoor Warm Light Glow from Window onto Room -->
    <path d="M115 105 L25 220 L160 220 Z" fill="#fbbf24" opacity="0.04"/>
  </g>

  <!-- Interior Wall & Bookshelf details -->
  <g id="interior-props">
    <!-- Bookshelf / Plant in Background -->
    <rect x="25" y="60" width="40" height="8" rx="2" fill="#334155"/>
    <!-- Little potted plant -->
    <path d="M35 60 L38 50 L46 50 L49 60 Z" fill="#0ea5e9"/>
    <circle cx="42" cy="45" r="8" fill="#10b981"/>
    <circle cx="38" cy="42" r="6" fill="#34d399"/>
    
    <!-- Desk / Windowsill Surface -->
    <path d="M100 200 L230 200 L220 215 L110 215 Z" fill="#334155"/>
    <rect x="105" y="200" width="120" height="6" rx="2" fill="#475569"/>

    <!-- Coffee Mug with steam -->
    <rect x="125" y="180" width="12" height="16" rx="3" fill="#f8fafc"/>
    <path d="M137 184 C141 184, 141 192, 137 192" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <!-- Steam lines -->
    <path d="M129 174 C131 170, 127 168, 129 164" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M135 172 C137 168, 133 166, 135 162" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Main Character: Sitting and looking out the window, dazed (Chūshén) -->
  <g id="female-character">
    <!-- Chair Back -->
    <path d="M45 100 C45 85, 85 85, 85 100 L85 200 C85 205, 45 205, 45 200 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Body / Torso (Wearing cozy sweater) -->
    <path d="M50 140 C50 120, 90 120, 90 140 L95 210 L45 210 Z" fill="#f43f5e"/>
    
    <!-- Arms / Elbow resting on desk or knee -->
    <!-- Left Arm leaning -->
    <path d="M55 135 C40 145, 45 170, 60 180 L75 185 L70 170 Z" fill="#f43f5e"/>
    <!-- Hand gently supporting chin -->
    <circle cx="78" cy="165" r="7" fill="#fbcfe8"/>
    
    <!-- Head & Hair -->
    <!-- Back Hair -->
    <path d="M55 90 C45 95, 40 130, 50 150 C55 140, 55 110, 65 100 Z" fill="#1e293b"/>
    <!-- Head Circle -->
    <circle cx="75" cy="105" r="18" fill="#fbcfe8"/>
    
    <!-- Front Hair & Bangs -->
    <path d="M60 98 C65 92, 85 92, 90 105 C90 105, 85 115, 75 115 C65 115, 60 105, 60 98 Z" fill="#1e293b"/>
    <path d="M85 102 C90 110, 85 125, 78 128 C78 128, 85 115, 85 102 Z" fill="#1e293b"/>

    <!-- Peaceful, vacant facial expression (Dazed / 出神) -->
    <!-- Soft dreamy eye (just a calm closed/half-open sleepy curved line denoting gazing far away) -->
    <path d="M83 103 Q87 106 91 103" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Subtle rosy cheek -->
    <circle cx="86" cy="110" r="4" fill="#fda4af" opacity="0.6"/>
    <!-- Calm relaxed lips -->
    <path d="M88 115 Q90 116 92 115" stroke="#e11d48" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Dreamy/Thoughtful Sparkles & Ambient Atmosphere (Visualizing "being lost in thought / ngẩn ngơ") -->
  <g id="thoughtful-atmosphere" opacity="0.8">
    <!-- Soft bokeh floating dots near window -->
    <circle cx="100" cy="90" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="95" cy="70" r="1.5" fill="#f43f5e" opacity="0.5"/>
    <circle cx="108" cy="60" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="85" cy="50" r="2.5" fill="#fbbf24" opacity="0.4"/>
    
    <!-- Gentle wavy abstract wisps indicating daydreaming state -->
    <path d="M88 75 Q95 70, 92 62" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M96 68 Q103 62, 100 55" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

</svg>