<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Background Elements: Night forest/clearing showing cleverness -->
  <!-- Soft forest floor / clearing glow -->
  <radialGradient id="forestGlow" cx="50%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#forestGlow)"/>

  <!-- Pine trees in background (silhouetted with teal tint) -->
  <path d="M20 180 L35 120 L50 180 Z" fill="#1e293b"/>
  <path d="M40 190 L55 130 L70 190 Z" fill="#1e293b"/>
  <path d="M180 190 L195 125 L210 190 Z" fill="#1e293b"/>
  <path d="M200 185 L215 135 L230 185 Z" fill="#1e293b"/>

  <!-- Ground Terrain -->
  <path d="M0 170 Q 60 155, 120 170 T 240 165 L 240 240 L 0 240 Z" fill="#1e293b"/>
  <path d="M0 185 Q 90 175, 240 185 L 240 240 L 0 240 Z" fill="#090d16"/>

  <!-- Clever Fox Setup (Thematic props: puzzle box / glowing puzzle elements indicating "smart/clever") -->
  <!-- Wooden Stump / Table surface -->
  <ellipse cx="120" cy="180" rx="60" ry="18" fill="#334155"/>
  <ellipse cx="120" cy="176" rx="56" ry="15" fill="#475569"/>

  <!-- Clever Puzzle Prop (Golden glowing geometric puzzle orb showing intelligence) -->
  <circle cx="155" cy="155" r="10" fill="#f59e0b" opacity="0.3"/>
  <circle cx="155" cy="155" r="6" fill="#fbbf24"/>
  <path d="M152 153 L158 153 L155 158 Z" fill="#0f172a"/>

  <!-- The Fox Character (狐狸) - Clever pose, paw on chin/head, bright expressive eyes -->
  <!-- Fox Body & Torso -->
  <path d="M90 190 C85 165, 100 145, 120 145 C140 145, 155 165, 150 190 Z" fill="#ea580c"/>
  
  <!-- Fluffy White Chest Fur -->
  <path d="M105 160 C110 180, 130 180, 135 160 C130 175, 110 175, 105 160 Z" fill="#f8fafc"/>

  <!-- Fox Head -->
  <path d="M95 120 C90 100, 110 90, 125 95 C140 90, 160 100, 155 120 C155 135, 140 145, 125 145 C110 145, 95 135, 95 120 Z" fill="#f97316"/>

  <!-- Fox Ears -->
  <!-- Left Ear -->
  <polygon points="98,98 85,65 110,85" fill="#c2410c"/>
  <polygon points="97,93 90,72 105,83" fill="#fbcfe8" opacity="0.4"/>
  <!-- Right Ear (Tilted slightly in thought) -->
  <polygon points="152,98 165,65 140,85" fill="#c2410c"/>
  <polygon points="153,93 160,72 145,83" fill="#fbcfe8" opacity="0.4"/>

  <!-- Clever Expression: Smart slanted eyes and subtle confident smirk -->
  <!-- Left Eye (Slanted, clever) -->
  <path d="M105 112 Q113 107, 120 114" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right Eye (Winking/Smart arc) -->
  <path d="M130 114 Q137 107, 145 112" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Snout & Nose -->
  <path d="M115 120 C120 128, 130 128, 135 120 C130 122, 120 122, 115 120 Z" fill="#fff7ed"/>
  <ellipse cx="125" cy="120" rx="3" ry="2" fill="#0f172a"/>
  <!-- Confident Smile -->
  <path d="M121 125 Q125 129, 130 125" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Paws (Thoughtful pose: one paw tapping chin) -->
  <!-- Left arm/paw resting -->
  <path d="M95 155 C90 165, 100 175, 110 170 Z" fill="#ea580c"/>
  <circle cx="112" cy="168" r="5" fill="#f8fafc"/>
  
  <!-- Right arm/paw touching chin thoughtfully -->
  <path d="M145 150 C155 145, 145 130, 135 132 Z" fill="#ea580c"/>
  <circle cx="134" cy="132" r="5" fill="#f8fafc"/>

  <!-- Magical / Sparkle elements representing "Cleverness/智慧" -->
  <g fill="#fbbf24">
    <!-- Sparkle 1 (Top Left) -->
    <path d="M70 90 Q70 80, 60 80 Q70 80, 70 70 Q70 80, 80 80 Q70 80, 70 90 Z"/>
    <!-- Sparkle 2 (Top Right - Near head) -->
    <path d="M175 75 Q175 65, 165 65 Q175 65, 175 55 Q175 65, 185 65 Q175 65, 175 75 Z"/>
    <!-- Sparkle 3 (Small near puzzle) -->
    <path d="M165 135 Q165 130, 160 130 Q165 130, 165 125 Q165 130, 170 130 Q165 130, 165 135 Z"/>
  </g>

  <!-- Glowing Light Ray from Above (Highlighting the clever fox) -->
  <path d="M100 0 L140 0 L170 240 L70 240 Z" fill="url(#lightRay)" opacity="0.1"/>
  <defs>
    <linearGradient id="lightRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

</svg>