<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Interior Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Distraction Element Gradients (Colorful floating items) -->
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Wallpaper details (bookshelf/window hinting at a study room) -->
  <g opacity="0.15">
    <rect x="20" y="30" width="40" height="70" rx="4" fill="#94a3b8"/>
    <rect x="70" y="40" width="30" height="60" rx="4" fill="#94a3b8"/>
    <line x1="20" y1="100" x2="110" y2="100" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- Warm Desk Lamp Beam & Light Cone -->
  <circle cx="120" cy="90" r="70" fill="url(#lampGlow)"/>
  <path d="M120 40 L60 160 H180 Z" fill="#fbbf24" opacity="0.05"/>

  <!-- Desk Surface -->
  <path d="M0 165 C60 160 180 160 240 165 V240 H0 Z" fill="url(#deskGrad)"/>
  <rect x="0" y="165" width="240" height="4" fill="#475569" opacity="0.6"/>

  <!-- Open Book on Desk (Center Focus) -->
  <g filter="url(#shadow)">
    <path d="M90 175 Q120 165 150 175 V205 Q120 195 90 205 Z" fill="#f8fafc"/>
    <path d="M92 177 Q120 167 148 177 V203 Q120 193 92 203 Z" fill="#e2e8f0"/>
    <line x1="120" y1="170" x2="120" y2="204" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Abstract text lines in book -->
    <line x1="98" y1="184" x2="113" y2="184" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="98" y1="192" x2="110" y2="192" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="127" y1="184" x2="142" y2="184" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="127" y1="192" x2="138" y2="192" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Desk Lamp -->
  <g>
    <!-- Base -->
    <ellipse cx="180" cy="170" rx="14" ry="6" fill="#64748b"/>
    <!-- Stand -->
    <path d="M180 170 L175 110 C173 100 165 95 160 95" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Shade -->
    <path d="M145 95 L175 90 L168 75 L152 75 Z" fill="#f59e0b"/>
    <ellipse cx="160" cy="85" rx="9" ry="3" fill="#fef08a"/>
  </g>

  <!-- Character (Student trying to focus, torso and head) -->
  <g transform="translate(0, 5)">
    <!-- Body / Hoodie -->
    <path d="M70 210 C70 175 95 155 120 155 C145 155 170 175 170 210 Z" fill="#3b82f6" filter="url(#shadow)"/>
    <!-- Collar / Hood folds -->
    <path d="M95 155 C105 170 135 170 145 155" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="110" y="142" width="20" height="20" fill="#fbcfe8" rx="6"/>

    <!-- Head -->
    <circle cx="120" cy="115" r="28" fill="#fbcfe8" filter="url(#shadow)"/>

    <!-- Hair (Messy, stylized student hair) -->
    <path d="M92 115 C92 95 105 88 120 88 C138 88 148 98 148 118 C148 118 142 110 135 108 C128 106 122 112 115 108 C108 104 100 110 92 115 Z" fill="#1e293b"/>

    <!-- Focused/Distracted facial expression -->
    <!-- Eyes looking sideways at distractions -->
    <circle cx="110" cy="116" r="3.5" fill="#1e293b"/>
    <circle cx="130" cy="116" r="3.5" fill="#1e293b"/>
    <!-- Slight sweat drop representing mental struggle / distraction -->
    <path d="M142 105 C142 105 146 112 146 115 C146 117 144 119 142 119 C140 119 138 117 138 115 C138 112 142 105 142 105 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Mouth - slightly open, uncertain -->
    <path d="M116 128 C118 132 122 132 124 128" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Hands resting near book, one reaching out slightly -->
    <circle cx="95" cy="165" r="8" fill="#fbcfe8"/>
    <circle cx="145" cy="165" r="8" fill="#fbcfe8"/>
  </g>

  <!-- VISUALIZING "分散" (Dispersion / Scattered Attention) -->
  <!-- Floating distracted thoughts / notifications / icons breaking away from the head -->
  <g>
    <!-- Floating Phone (Notification distraction) -->
    <g transform="translate(45, 75) rotate(-15)" filter="url(#shadow)">
      <rect x="0" y="0" width="22" height="36" rx="4" fill="url(#phoneGlow)"/>
      <rect x="3" y="4" width="16" height="24" rx="2" fill="#0f172a"/>
      <!-- Glowing app notification dots -->
      <circle cx="8" cy="12" r="2" fill="#ec4899"/>
      <circle cx="14" cy="12" r="2" fill="#fbbf24"/>
      <circle cx="11" cy="18" r="3" fill="#10b981"/>
    </g>

    <!-- Floating Game Controller / Play Icon -->
    <g transform="translate(170, 65) rotate(20)" filter="url(#shadow)">
      <rect x="0" y="0" width="30" height="20" rx="6" fill="#ec4899"/>
      <circle cx="9" cy="10" r="3" fill="#f8fafc"/>
      <path d="M20 7 L24 10 L20 13 Z" fill="#f8fafc"/>
    </g>

    <!-- Floating Music Note (Auditory distraction) -->
    <g transform="translate(155, 30) rotate(-10)" filter="url(#shadow)">
      <circle cx="6" cy="18" r="5" fill="#a855f7"/>
      <path d="M11 18 V4 L22 7 V21" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="17" cy="21" r="5" fill="#a855f7"/>
    </g>

    <!-- Floating Star / Shiny Idea (Daydreaming) -->
    <g transform="translate(75, 35) rotate(10)" filter="url(#shadow)">
      <path d="M12 2 L14.5 9 L22 10 L16.5 15 L18 22 L12 18 L6 22 L7.5 15 L2 10 L9.5 9 Z" fill="#fbbf24" transform="scale(0.7)"/>
    </g>

    <!-- Dotted Dispersion / Flow Lines emanating from head toward distractions -->
    <path d="M100 95 Q75 80 60 85" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.7"/>
    <path d="M120 85 Q110 50 85 45" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.7"/>
    <path d="M135 90 Q150 60 165 45" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.7"/>
    <path d="M140 105 Q160 80 175 75" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>