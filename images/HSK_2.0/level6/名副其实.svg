<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="170" width="180" height="50" fill="#1e293b"/>
  
  <!-- The Expert (Subject) -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 80 Q-30 40 0 40 T30 80" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#fde68a"/>
    <!-- Glasses -->
    <rect x="-15" y="15" width="12" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="3" y="15" width="12" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="-3" y1="19" x2="3" y2="19" stroke="#0f172a" stroke-width="2"/>
    <!-- Hair -->
    <path d="M-20 10 Q-20 -5 0 -10 T20 10" fill="#475569"/>
  </g>

  <!-- Tools of the trade (Evidence of expertise) -->
  <!-- Microscope -->
  <g transform="translate(50, 130)">
    <rect x="-5" y="0" width="10" height="40" fill="#94a3b8"/>
    <circle cx="0" cy="-5" r="10" fill="#fbbf24"/>
    <rect x="-15" y="35" width="30" height="5" fill="#64748b"/>
  </g>

  <!-- Books/Documents -->
  <rect x="160" y="140" width="40" height="20" rx="2" fill="#ec4899"/>
  <rect x="165" y="135" width="40" height="20" rx="2" fill="#10b981"/>
  
  <!-- Golden Sparkles (Representing "True Expert" status) -->
  <circle cx="180" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="195" cy="95" r="5" fill="#fbbf24"/>
  <circle cx="170" cy="110" r="2" fill="#fbbf24"/>
  
  <!-- Magnifying Glass -->
  <g transform="translate(80, 150) rotate(-20)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fb923c" stroke-width="4"/>
    <line x1="10" y1="10" x2="30" y2="30" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>