<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm indoor ambient light from window -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for Character -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / SCENE DETAILS -->
  <!-- Wall panels & architectural lines -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="1.5" />
  <rect x="15" y="45" width="50" height="90" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <!-- Window Panes with Evening/Outdoor Glow -->
  <rect x="20" y="50" width="19" height="38" rx="2" fill="#38bdf8" fill-opacity="0.2" />
  <rect x="43" y="50" width="19" height="38" rx="2" fill="#38bdf8" fill-opacity="0.2" />
  <rect x="20" y="92" width="19" height="38" rx="2" fill="#38bdf8" fill-opacity="0.2" />
  <rect x="43" y="92" width="19" height="38" rx="2" fill="#38bdf8" fill-opacity="0.2" />
  <path d="M20 50 L42 50 L42 88 L20 88 Z" fill="url(#windowLight)" />

  <!-- Indoor Decor: Wall Plant / Shelf -->
  <path d="M185 65 L225 65 L220 75 L190 75 Z" fill="#475569" />
  <path d="M205 65 L205 55" stroke="#64748b" stroke-width="2" />
  <!-- Pot & Plant -->
  <path d="M197 45 L213 45 L210 55 L200 55 Z" fill="#f43f5e" />
  <path d="M205 45 Q190 35 185 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <path d="M205 45 Q215 30 225 25" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <path d="M205 45 Q205 30 205 20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Floor Surface -->
  <rect x="0" y="160" width="240" height="80" fill="url(#floorGrad)" />
  <!-- Wooden floor planks perspective lines -->
  <path d="M0 180 L240 180 M0 205 L240 205 M0 230 L240 230" stroke="#1e293b" stroke-width="1" />
  <path d="M80 160 L40 240 M160 160 L200 240" stroke="#1e293b" stroke-width="0.8" opacity="0.5" />

  <!-- Scene Prop: Dropped item / Shoe or bag hinting at accident/fall -->
  <ellipse cx="85" cy="190" rx="6" ry="3" fill="#0f172a" />
  <path d="M78 188 Q82 182 88 187" fill="#fb923c" />

  <!-- MAIN CHARACTER: Stumbling / Limping (一瘸一拐) -->
  <!-- Floor Shadow -->
  <ellipse cx="125" cy="202" rx="22" ry="6" fill="#000000" opacity="0.6" filter="url(#shadow)" />

  <g transform="translate(105, 75)">
    <!-- Body Tilt & Motion lines (representing uneven movement) -->
    <path d="M5 25 L-2 30" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M25 60 L32 65" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- Left Leg (Sound/Supporting Leg - straight down) -->
    <path d="M10 100 L8 127" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <path d="M6 127 L2 129" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" /> <!-- Shoe -->

    <!-- Right Leg (Injured/Bandaged Leg - lifted awkwardly / limping) -->
    <path d="M18 100 L32 112 L28 122" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Medical Bandage on Shin -->
    <rect x="27" y="111" width="7" height="9" rx="2" fill="#f8fafc" transform="rotate(15 30 115)" />
    <path d="M27 114 L34 116" stroke="#ef4444" stroke-width="1.5" />
    <!-- Shoe on injured foot -->
    <path d="M25 122 L20 125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Torso (Wearing a casual hoodie, slightly leaning) -->
    <path d="M2 55 L26 55 L30 102 L4 102 Z" fill="#6366f1" rx="4" />
    <path d="M16 55 L16 102" stroke="#4f46e5" stroke-width="2" /> <!-- Zipper line -->
    <!-- Hoodie Pocket -->
    <path d="M10 85 L22 85 L24 97 L8 97 Z" fill="#4f46e5" />

    <!-- Head & Face (Exhibiting strain/pain expression) -->
    <circle cx="15" cy="35" r="14" fill="#ffedd5" />
    <!-- Hair -->
    <path d="M3 33 Q12 18 27 30 Q25 24 15 22 Q5 24 3 33 Z" fill="#334155" />
    <!-- Facial expression: Grimace / wince -->
    <!-- Eyebrows angled in discomfort -->
    <path d="M9 31 L14 33" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M18 33 L23 31" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Eyes closed tight in wince (> <) -->
    <path d="M10 35 L13 37 L10 39" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M19 37 L22 35 L19 33" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Mouth grimacing -->
    <path d="M13 43 Q16 40 19 43" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Sweat drop (showing difficulty) -->
    <path d="M26 35 Q28 38 26 40 Q24 38 26 35 Z" fill="#38bdf8" opacity="0.8" />

    <!-- Arms (Balanced unevenly to compensate for limping) -->
    <!-- Left Arm reaching back slightly -->
    <path d="M3 58 L-5 75 L-12 85" fill="none" stroke="#6366f1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-13" cy="87" r="3.5" fill="#ffedd5" />

    <!-- Right Arm raised forward for balance -->
    <path d="M25 58 L38 72 L45 68" fill="none" stroke="#6366f1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="47" cy="66" r="3.5" fill="#ffedd5" />
  </g>

  <!-- Foreground details / atmospheric lighting highlights -->
  <path d="M0 0 H240 V240 H0 Z" fill="none" />
  <circle cx="120" cy="120" r="114" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>