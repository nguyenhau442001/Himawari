<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient lighting & window light shaft -->
  <path d="M 0 0 L 120 0 L 180 240 L 0 240 Z" fill="url(#warmGlow)"/>
  
  <!-- Background Room Elements -->
  <!-- Bookshelf / Architecture -->
  <rect x="20" y="40" width="40" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="70" x2="60" y2="70" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="100" x2="60" y2="100" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="50" width="10" height="18" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="42" y="55" width="12" height="13" rx="2" fill="#f59e0b" opacity="0.6"/>
  <rect x="26" y="80" width="14" height="18" rx="2" fill="#10b981" opacity="0.6"/>

  <!-- Wall Art / Design Board -->
  <rect x="150" y="35" width="60" height="45" rx="4" fill="#334155" opacity="0.4"/>
  <circle cx="165" cy="50" r="6" fill="#fb923c" opacity="0.8"/>
  <path d="M 160 65 L 180 50 L 195 62" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Desk Surface -->
  <path d="M 20 185 L 220 185 L 210 215 L 30 215 Z" fill="url(#deskGrad)"/>
  <rect x="20" y="180" width="200" height="6" rx="3" fill="#475569"/>

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M 95 165 L 145 165 L 155 183 L 85 183 Z" fill="#94a3b8"/>
  <rect x="100" y="140" width="40" height="26" rx="2" fill="#cbd5e1"/>
  <rect x="103" y="143" width="34" height="20" rx="1" fill="url(#screenGrad)"/>
  <path d="M 113 150 L 120 157 L 130 146" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coffee Cup -->
  <rect x="165" y="160" width="14" height="18" rx="2" fill="#f8fafc"/>
  <path d="M 179 164 C 183 164 183 172 179 174" stroke="#f8fafc" stroke-width="2" fill="none"/>

  <!-- Plant -->
  <path d="M 60 175 L 70 175 L 68 185 L 62 185 Z" fill="#cbd5e1"/>
  <path d="M 65 175 C 65 160 55 155 50 150" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 65 175 C 65 155 75 150 80 145" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="150" r="4" fill="#10b981"/>
  <circle cx="80" cy="145" r="4" fill="#10b981"/>


  <!-- CHARACTER 1 (Left - Partner A) -->
  <!-- Chair -->
  <path d="M 55 145 L 85 145 L 90 205 L 50 205 Z" fill="#1e293b" opacity="0.5"/>
  
  <!-- Body/Torso -->
  <path d="M 50 150 C 50 130 85 130 85 150 L 80 190 L 55 190 Z" fill="#38bdf8"/>
  <path d="M 67 150 L 67 190" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="68" cy="108" r="17" fill="#fbcfe8"/>
  <!-- Hair (Stylish dark bob) -->
  <path d="M 51 108 C 51 90 85 90 85 108 C 85 115 82 125 78 125 C 75 120 74 112 68 112 C 62 112 61 120 58 125 C 54 125 51 115 51 108 Z" fill="#1e293b"/>
  <!-- Face expression: Smiling / Confident -->
  <circle cx="62" cy="107" r="1.5" fill="#1e293b"/>
  <circle cx="74" cy="107" r="1.5" fill="#1e293b"/>
  <path d="M 66 113 Q 68 116 70 113" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms / Gesturing (Teamwork action) -->
  <!-- Left Arm (resting) -->
  <path d="M 50 145 L 42 165 L 50 170" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right Arm (pointing/collaborating toward center) -->
  <path d="M 85 145 Q 95 150 102 142" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="104" cy="140" r="4" fill="#fbcfe8"/>


  <!-- CHARACTER 2 (Right - Partner B) -->
  <!-- Chair -->
  <path d="M 155 145 L 185 145 L 190 205 L 150 205 Z" fill="#1e293b" opacity="0.5"/>

  <!-- Body/Torso -->
  <path d="M 155 150 C 155 130 190 130 190 150 L 185 190 L 160 190 Z" fill="#f59e0b"/>
  
  <!-- Head -->
  <circle cx="172" cy="108" r="17" fill="#fed7aa"/>
  <!-- Hair (Neat wavy dark hair) -->
  <path d="M 155 108 C 155 92 189 92 189 108 C 189 110 187 115 184 115 C 180 110 175 102 172 102 C 165 102 160 110 157 115 C 155 112 155 110 155 108 Z" fill="#334155"/>
  <!-- Face expression: Enthusiastic / Agreeing -->
  <circle cx="166" cy="107" r="1.5" fill="#334155"/>
  <circle cx="178" cy="107" r="1.5" fill="#334155"/>
  <path d="M 170 113 Q 172 116 174 113" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms / Interacting -->
  <!-- Left Arm (reaching out to collaborate) -->
  <path d="M 155 145 Q 145 155 138 145" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="136" cy="143" r="4" fill="#fed7aa"/>
  <!-- Right Arm -->
  <path d="M 190 145 L 198 165 L 190 170" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Mutual Collaboration Element (Floating friendly accent above them) -->
  <path d="M 120 75 Q 120 60 135 65 Q 145 60 150 75 Q 135 90 120 75 Z" fill="#ec4899" opacity="0.2"/>
  <circle cx="120" cy="80" r="3" fill="#38bdf8"/>
  <circle cx="150" cy="80" r="3" fill="#10b981"/>
  <circle cx="135" cy="55" r="4" fill="#f59e0b"/>

</svg>