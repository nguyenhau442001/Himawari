<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Ambient background glow/warm room lighting -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>

  <!-- Classroom/Study Room Interior Environment -->
  <!-- Chalkboard / Large Screen in Background -->
  <rect x="35" y="30" width="170" height="105" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="42" y="38" width="156" height="89" rx="3" fill="#1e293b"/>
  
  <!-- Abstract Math/Science formulas drawn on board (non-text symbols: curves, variables, fraction bars) -->
  <!-- Formula 1: fraction / wave -->
  <path d="M 55 60 L 85 60" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 62 50 Q 70 40 78 65" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 95 55 Q 105 70 115 55" stroke="#f43f5e" stroke-width="2" fill="none"/>

  <!-- Formula 2: geometrical layout -->
  <circle cx="150" cy="65" r="14" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <path d="M 140 75 L 150 51 L 160 75 Z" stroke="#34d399" stroke-width="2" fill="none"/>
  <line x1="130" y1="90" x2="185" y2="90" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Teacher/Instructor Character -->
  <!-- Body/Torso (Teal jacket/cardigan) -->
  <path d="M 90 205 L 90 175 Q 90 160 120 160 Q 150 160 150 175 L 150 205 Z" fill="#0d9488"/>
  <path d="M 105 160 L 120 185 L 135 160 Z" fill="#f8fafc"/> <!-- Shirt collar -->

  <!-- Head & Neck -->
  <path d="M 113 160 L 127 160 L 127 150 L 113 150 Z" fill="#ffd1b3"/>
  <circle cx="120" cy="135" r="20" fill="#ffd1b3"/>

  <!-- Hair (Stylish dark bob/short hair) -->
  <path d="M 100 130 C 100 115 110 110 120 110 C 130 110 140 115 140 130 L 140 142 C 140 142 133 135 120 135 C 107 135 100 142 100 142 Z" fill="#334155"/>

  <!-- Face details (Friendly expression, focused eyes, smiling) -->
  <circle cx="113" cy="135" r="2" fill="#1e293b"/>
  <circle cx="127" cy="135" r="2" fill="#1e293b"/>
  <path d="M 117 142 Q 120 146 123 142" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 107 131 Q 113 129 116 131" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 124 131 Q 127 129 133 131" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Gesturing Arms & Pointer Hand pointing at the formulas -->
  <!-- Left arm holding pointer -->
  <path d="M 92 170 Q 75 160 65 140" stroke="#0d9488" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Pointer stick extending towards board -->
  <line x1="62" y1="135" x2="48" y2="105" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right arm raised gesturing emphasize/remember -->
  <path d="M 148 170 Q 165 150 160 130" stroke="#0d9488" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="160" cy="125" r="5" fill="#ffd1b3"/> <!-- Right hand -->

  <!-- Foreground Desk & Learning Props -->
  <!-- Desk surface -->
  <path d="M 20 215 L 220 215 L 210 195 L 30 195 Z" fill="#475569"/>
  <rect x="25" y="215" width="190" height="8" rx="2" fill="#334155"/>

  <!-- Open Notebook on Desk -->
  <path d="M 75 205 L 120 198 L 165 205 L 120 212 Z" fill="#f8fafc"/>
  <line x1="120" y1="198" x2="120" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Little colored graph/notes drawn in book -->
  <path d="M 85 204 L 95 202 L 105 205" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <path d="M 135 204 L 145 203 L 155 206" stroke="#3b82f6" stroke-width="1.5" fill="none"/>

  <!-- Coffee Mug / Pencil Holder on Desk -->
  <rect x="175" y="195" width="16" height="20" rx="3" fill="#fb923c"/>
  <path d="M 191 200 C 196 200 196 210 191 210" stroke="#fb923c" stroke-width="2.5" fill="none"/>
  <!-- Pencils sticking out -->
  <line x1="180" y1="195" x2="177" y2="183" stroke="#f43f5e" stroke-width="2"/>
  <line x1="185" y1="195" x2="187" y2="182" stroke="#38bdf8" stroke-width="2"/>

  <!-- Glowing emphasis ring / spotlight on the main formula concept -->
  <circle cx="120" cy="65" r="45" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" fill="none" opacity="0.4"/>
</svg>