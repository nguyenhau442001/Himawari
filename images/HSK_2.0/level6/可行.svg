    <!-- Body -->
    <path d="M-30 25 C-30 50, 30 50, 30 25 L20 80 L-20 80 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Checkmark/Approval element -->
  <circle cx="190" cy="60" r="20" fill="#10b981"/>
  <path d="M180 60 L187 67 L202 52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="4" fill="#fb923c"/>
  <circle cx="200" cy="180" r="3" fill="#ec4899"/>
  <path d="M30 180 L50 160" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
