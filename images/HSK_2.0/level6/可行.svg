<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#475569"/>
  <rect x="50" y="150" width="10" height="60" rx="2" fill="#334155"/>
  <rect x="180" y="150" width="10" height="60" rx="2" fill="#334155"/>
  
  <!-- Blueprint/Plan -->
  <path d="M70 90 L170 90 L160 130 L60 130 Z" fill="#f8fafc"/>
  <path d="M80 100 H150 M80 110 H130 M80 120 H140" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="155" cy="105" r="6" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(120, 110)">
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Glasses -->
    <rect x="-15" y="-5" width="12" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="2"/>
    <rect x="3" y="-5" width="12" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="2"/>
    <!-- Smile -->
