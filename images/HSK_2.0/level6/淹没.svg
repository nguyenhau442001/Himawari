<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: dark sky, distant flooded horizon -->
  <path d="M0 130 H240 V240 H0 Z" fill="#1E2430"/>
  
  <!-- Torrential rain / motion lines for action -->
  <g stroke="#3A4A60" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="40" y1="40" x2="25" y2="70" />
    <line x1="80" y1="30" x2="65" y2="60" />
    <line x1="120" y1="45" x2="105" y2="75" />
    <line x1="160" y1="35" x2="145" y2="65" />
    <line x1="200" y1="50" x2="185" y2="80" />
    
    <line x1="60" y1="70" x2="45" y2="100" />
    <line x1="100" y1="65" x2="85" y2="95" />
    <line x1="140" y1="80" x2="125" y2="110" />
    <line x1="180" y1="60" x2="165" y2="90" />
  </g>

  <!-- The Village (Houses being submerged) -->
  <g id="village">
    <!-- House 1 (Left, partially submerged) -->
    <path d="M35 130 L55 110 L75 130 Z" fill="#D97706"/>
    <rect x="40" y="130" width="30" height="30" fill="#92400E"/>
    <rect x="48" y="140" width="14" height="20" fill="#1E2430"/>

    <!-- House 2 (Center-Right, roof only visible - showing severe submersion/yānmò) -->
    <path d="M150 120 L175 95 L200 120 Z" fill="#E11D48"/>
    <!-- Only top of walls showing above water line -->
    <rect x="155" y="120" width="40" height="10" fill="#9F1239"/>
  </g>

  <!-- Rushing Floodwater (Dynamic action waves overlapping the village) -->
  <g id="flood_waters">
    <!-- Deep water base -->
    <path d="M0 130 C60 120, 140 140, 240 125 V240 H0 Z" fill="#0284C7"/>
    <path d="M0 145 C70 135, 150 155, 240 140 V240 H0 Z" fill="#0369A1" opacity="0.9"/>

    <!-- Dynamic wave crests & motion interaction -->
    <path d="M0 135 Q 30 120, 60 135 T 120 130 T 180 138 T 240 130 V240 H0 Z" fill="#0EA5E9"/>
    
    <!-- Foam / Splash accents -->
    <path d="M45 132 C 50 125, 55 125, 60 132" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M125 137 C 130 128, 138 128, 143 137" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M185 133 C 190 124, 198 124, 203 133" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Foreground high-contrast action wave sweeping across -->
  <path d="M-10 165 C 40 150, 90 180, 150 160 C 190 145, 220 165, 250 155 V 240 H -10 Z" fill="#38BDF8" opacity="0.4"/>
</svg>