<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND ROOM ENVIRONMENT -->
  <!-- Wall shelf with scattered items -->
  <rect x="25" y="45" width="90" height="6" rx="3" fill="#334155"/>
  <!-- Misplaced books on shelf -->
  <path d="M35 45L37 28H46L44 45Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M48 45L52 30H61L57 45Z" fill="#fb923c" opacity="0.8"/>
  <rect x="65" y="32" width="12" height="13" rx="2" fill="#ec4899" opacity="0.8" transform="rotate(15 65 32)"/>
  
  <!-- Desk & Workspace -->
  <rect x="20" y="160" width="200" height="50" rx="6" fill="#334155" filter="url(#softShadow)"/>
  <rect x="20" y="155" width="200" height="8" rx="2" fill="#475569"/>

  <!-- Study Lamp on Desk (Right side) -->
  <path d="M185 155L180 110" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 110L165 95C162 92 165 88 170 88H190C195 88 198 92 195 95L180 110Z" fill="#fbbf24" filter="url(#softShadow)"/>
  <ellipse cx="180" cy="112" rx="25" ry="15" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- SCATTERED PROPS (Showing "Hay quên, đãng trí") -->
  <!-- Coffee mug tipped over with spilled drink -->
  <path d="M125 180C125 175 130 172 135 175C140 178 140 185 135 188C130 190 125 185 125 180Z" fill="#38bdf8" opacity="0.6"/>
  <rect x="145" y="170" width="14" height="16" rx="3" fill="#cbd5e1" transform="rotate(25 145 170)"/>
  <path d="M159 175C164 175 166 180 163 183" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- Floating misplaced glasses / keys -->
  <circle cx="105" cy="178" r="6" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <circle cx="91" cy="178" r="6" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <path d="M97 178H99" stroke="#f1f5f9" stroke-width="2"/>
  <path d="M85 182L81 185" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Wandering papers / sticky notes -->
  <rect x="50" y="175" width="18" height="14" rx="2" fill="#fbbf24" transform="rotate(-12 50 175)" opacity="0.9"/>
  <rect x="180" y="165" width="16" height="20" rx="2" fill="#f8fafc" transform="rotate(18 180 165)" opacity="0.9"/>
  <line x1="183" y1="172" x2="191" y2="172" stroke="#94a3b8" stroke-width="1.5" transform="rotate(18 180 165)"/>
  <line x1="183" y1="177" x2="193" y2="177" stroke="#94a3b8" stroke-width="1.5" transform="rotate(18 180 165)"/>

  <!-- MAIN SUBJECT: Frustrated / Forgetful Character -->
  <g transform="translate(0, 5)">
    <!-- Character Body & Chair -->
    <rect x="75" y="130" width="36" height="35" rx="8" fill="#1e293b"/>
    <path d="M70 125H116V135H70Z" fill="#0f172a" rx="4"/>
    
    <!-- Torso (Hoodie) -->
    <path d="M68 135C68 122 78 120 93 120C108 120 118 122 118 135V165H68V135Z" fill="#38bdf8"/>
    <!-- Hoodie Pocket & Strings -->
    <path d="M82 150H104V165H82V150Z" fill="#0284c7" rx="3"/>
    <path d="M86 120L84 138" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M100 120L102 138" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm (Scratched head in confusion/forgetfulness) -->
    <path d="M70 135C60 135 55 120 62 105C66 98 75 92 80 95" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Right Arm (Holding phone/paper blankly) -->
    <path d="M116 135C125 140 130 155 120 165" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Neck -->
    <rect x="85" y="110" width="16" height="14" fill="#fde047" rx="4"/>

    <!-- Head & Face (Expressed panic/forgetfulness) -->
    <circle cx="93" cy="95" r="22" fill="#fde047" filter="url(#softShadow)"/>

    <!-- Hair (Messy style matching 'forgetful' persona) -->
    <path d="M71 90C72 75 80 72 93 72C106 72 114 76 115 92C111 85 104 81 93 82C82 83 75 87 71 90Z" fill="#334155"/>
    <path d="M85 74L88 67M95 72L98 65M103 74L108 68" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Face Features: Confused/Panicked Expression -->
    <!-- Eyebrows (Tilted inward/upward in worry) -->
    <path d="M80 88L88 92" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M98 92L106 88" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wide Open Eyes -->
    <circle cx="84" cy="97" r="4" fill="#1e293b"/>
    <circle cx="102" cy="97" r="4" fill="#1e293b"/>
    <circle cx="85" cy="96" r="1.5" fill="#ffffff"/>
    <circle cx="103" cy="96" r="1.5" fill="#ffffff"/>

    <!-- Sweat Drop (Classic sign of panic/forgetfulness) -->
    <path d="M115 88C115 88 120 95 120 99C120 101.8 117.8 104 115 104C112.2 104 110 101.8 110 99C110 95 115 88 115 88Z" fill="#38bdf8" filter="url(#softShadow)"/>

    <!-- Open "O" Mouth (Shocked realization) -->
    <ellipse cx="93" cy="107" rx="4" ry="5" fill="#1e293b"/>
    
    <!-- Blush -->
    <ellipse cx="78" cy="103" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="108" cy="103" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
  </g>

  <!-- FOREGROUND ACCENT ELEMENTS (Floating question marks / confusion indicators, abstract shapes removed, using situational context) -->
  <!-- Floating misplaced keys near head -->
  <g transform="translate(130, 85) rotate(25)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M3 3L12 12M10 10L13 8M8 12L11 10" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>