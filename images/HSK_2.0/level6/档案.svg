<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cabinetMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <clipPath id="sceneClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" clip-path="url(#sceneClip)"/>

  <!-- Ambient lighting from overhead archive lamp -->
  <polygon points="120,0 40,240 200,240" fill="url(#warmLight)" clip-path="url(#sceneClip)"/>

  <!-- BACKGROUND ARCHIVE SHELVES / CABINETS -->
  <g id="shelves">
    <!-- Left Cabinet Stack -->
    <rect x="15" y="45" width="50" height="150" fill="url(#cabinetMetal)" rx="2"/>
    <rect x="18" y="48" width="44" height="32" fill="#1e293b" rx="1"/>
    <rect x="18" y="85" width="44" height="32" fill="#1e293b" rx="1"/>
    <rect x="18" y="122" width="44" height="32" fill="#1e293b" rx="1"/>
    <rect x="18" y="159" width="44" height="32" fill="#1e293b" rx="1"/>
    <!-- Cabinet handles & label slots -->
    <rect x="34" y="60" width="12" height="4" fill="#94a3b8" rx="1"/>
    <rect x="34" y="97" width="12" height="4" fill="#94a3b8" rx="1"/>
    <rect x="34" y="134" width="12" height="4" fill="#94a3b8" rx="1"/>
    <rect x="34" y="171" width="12" height="4" fill="#94a3b8" rx="1"/>

    <!-- Right Tall Document Rack -->
    <rect x="175" y="30" width="50" height="175" fill="#334155" rx="2"/>
    <line x1="175" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="3"/>
    <line x1="175" y1="105" x2="225" y2="105" stroke="#1e293b" stroke-width="3"/>
    <line x1="175" y1="145" x2="225" y2="145" stroke="#1e293b" stroke-width="3"/>
    <!-- Archive folders stacked neatly -->
    <rect x="182" y="45" width="12" height="18" fill="#38bdf8" rx="1"/>
    <rect x="196" y="43" width="14" height="20" fill="#f43f5e" rx="1"/>
    <rect x="212" y="46" width="10" height="17" fill="#10b981" rx="1"/>
    <rect x="182" y="82" width="15" height="20" fill="#fb923c" rx="1"/>
    <rect x="199" y="85" width="12" height="17" fill="#38bdf8" rx="1"/>
    <rect x="182" y="122" width="13" height="20" fill="#fbbf24" rx="1"/>
    <rect x="197" y="120" width="15" height="22" fill="#a855f7" rx="1"/>
  </g>

  <!-- FOREGROUND DESK & CLOCK / TIME PASSAGE SYMBOLISM -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <rect x="50" y="155" width="140" height="55" fill="#475569" rx="3"/>
    <rect x="45" y="150" width="150" height="10" fill="#64748b" rx="2"/>

    <!-- Stack of important archives being preserved (档案) -->
    <g transform="translate(70, 115)">
      <!-- Folder 1 (Bottom) -->
      <path d="M0,30 L35,25 L55,40 L20,45 Z" fill="#cbd5e1"/>
      <rect x="15" y="30" width="35" height="12" fill="#0284c7" rx="1"/>
      <!-- Folder 2 (Middle) -->
      <path d="M5,18 L40,13 L60,28 L25,33 Z" fill="#e2e8f0"/>
      <rect x="20" y="18" width="35" height="12" fill="#e11d48" rx="1"/>
      <!-- Folder 3 (Top) -->
      <path d="M10,5 L45,0 L65,15 L30,20 Z" fill="#f8fafc"/>
      <rect x="25" y="5" width="35" height="12" fill="#059669" rx="1"/>
      <circle cx="42" cy="11" r="2" fill="#fef08a"/>
    </g>

    <!-- Hourglass indicating the "10 years" preservation aspect -->
    <g transform="translate(145, 110)">
      <polygon points="12,0 28,0 32,5 24,18 32,31 28,36 12,36 8,31 16,18 8,5" fill="#334155"/>
      <path d="M10,2 L30,2 L24,17 L30,34 L10,34 L16,19 Z" fill="#1e293b"/>
      <!-- Sand top (decreasing) -->
      <polygon points="12,10 28,10 20,18" fill="#fbbf24"/>
      <!-- Sand bottom (accumulating) -->
      <polygon points="15,31 25,31 20,24" fill="#fbbf24"/>
      <!-- Glass frame highlights -->
      <rect x="13" y="1" width="14" height="34" fill="none" stroke="#64748b" stroke-width="1" rx="2"/>
    </g>
  </g>

  <!-- CHARACTER: Archivist / Office worker carefully filing documents -->
  <g id="character">
    <!-- Body / Torso (leaning forward) -->
    <path d="M95,160 C90,130 110,110 130,120 L135,160 Z" fill="#38bdf8"/>
    <!-- Collar & Tie/Badge detail -->
    <polygon points="112,118 120,128 128,118" fill="#ffffff"/>
    <polygon points="118,126 122,126 120,140" fill="#f43f5e"/>

    <!-- Head & Hair -->
    <circle cx="125" cy="95" r="18" fill="#fbcfe8"/>
    <!-- Hair style -->
    <path d="M107,95 C107,80 120,75 135,80 C143,83 145,95 143,100 C135,92 120,90 110,102 Z" fill="#334155"/>

    <!-- Focused Face Expression -->
    <!-- Eyes (concentrating downward) -->
    <line x1="117" y1="96" x2="123" y2="98" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="128" y1="98" x2="134" y2="96" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Gentle Smile -->
    <path d="M122,105 C125,108 128,108 131,105" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Round Cheeks -->
    <circle cx="115" cy="102" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="135" cy="102" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms actively placing/holding archive -->
    <!-- Back Arm -->
    <path d="M100,125 L80,135 L85,145" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm reaching folder -->
    <path d="M130,125 L115,138 L105,135" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="102" cy="134" r="4" fill="#fbcfe8"/>
  </g>

  <!-- FOREGROUND DETAILS (Lighting & Depth of Field elements) -->
  <g id="lighting-accents">
    <!-- Warm accent glow top right -->
    <circle cx="200" cy="40" r="30" fill="#fbbf24" opacity="0.1" filter="blur(10px)"/>
    <!-- Cool rim light on desk -->
    <path d="M45,150 L195,150" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Vignette Frame Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" clip-path="url(#sceneClip)"/>
</svg>