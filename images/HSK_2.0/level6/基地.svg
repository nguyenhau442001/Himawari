<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Base environment: Training Camp / Military Base Setting -->
  <!-- Distant Watchtower -->
  <path d="M195,120 L205,120 L208,170 L192,170 Z" fill="#475569"/>
  <rect x="190" y="112" width="20" height="10" rx="2" fill="#64748b"/>
  <line x1="198" y1="120" x2="198" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="194" y1="135" x2="204" y2="145" stroke="#334155" stroke-width="1.5"/>
  <line x1="204" y1="150" x2="194" y2="160" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Searchlight beam -->
  <polygon points="198,115 150,70 170,60" fill="#fef08a" opacity="0.15"/>

  <!-- Ground -->
  <path d="M0,170 Q120,160 240,170 L240,240 L0,240 Z" fill="url(#groundGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>

  <!-- Obstacle / Training Course Equipment (Low Wall / Barricade) -->
  <rect x="20" y="180" width="45" height="15" rx="3" fill="#64748b"/>
  <rect x="25" y="170" width="6" height="25" fill="#475569"/>
  <rect x="54" y="170" width="6" height="25" fill="#475569"/>

  <!-- Command Tent / Facility Structure -->
  <path d="M120,100 L180,140 L60,140 Z" fill="url(#tentGrad)"/>
  <path d="M120,100 L180,140 L170,140 L120,108 Z" fill="#22c55e" opacity="0.3"/>
  <!-- Tent Entrance -->
  <path d="M105,140 L120,118 L135,140 Z" fill="#090d16"/>
  <!-- Radar Dish on top of tent -->
  <circle cx="120" cy="94" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="94" x2="124" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="105" stroke="#94a3b8" stroke-width="2"/>

  <!-- Tactical Command Table Prop (Foreground) -->
  <!-- Table legs -->
  <line x1="90" y1="210" x2="85" y2="230" stroke="#94a3b8" stroke-width="3"/>
  <line x1="130" y1="210" x2="135" y2="230" stroke="#94a3b8" stroke-width="3"/>
  <!-- Table Top -->
  <path d="M75,200 L145,200 L140,212 L80,212 Z" fill="#64748b"/>
  <!-- Holographic / Digital Screen on Table -->
  <path d="M90,200 L130,200 L125,175 L95,175 Z" fill="url(#screenGlow)" opacity="0.8"/>
  <!-- Tactical Map Elements on Screen -->
  <circle cx="110" cy="187" r="5" fill="#fbbf24"/>
  <path d="M98,182 L105,190 L120,180" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Character 1: Officer / Instructor (Standing, gesturing) -->
  <!-- Body / Uniform -->
  <path d="M150,165 L168,160 L172,195 L146,195 Z" fill="#15803d"/>
  <!-- Head & Cap -->
  <circle cx="160" cy="142" r="11" fill="#fcd34d"/>
  <!-- Officer Cap -->
  <path d="M148,137 L172,137 L168,130 L152,130 Z" fill="#166534"/>
  <path d="M147,137 L173,137 C175,137 175,140 173,140 L147,140 C145,140 145,137 147,137 Z" fill="#fbbf24"/>
  <!-- Facial features (determined look) -->
  <line x1="157" y1="141" x2="161" y2="141" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="164" y1="141" x2="168" y2="141" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arm pointing at screen -->
  <path d="M152,163 L135,178 L140,182" fill="none" stroke="#15803d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="137" cy="180" r="4" fill="#fcd34d"/>

  <!-- Character 2: Trainee / Soldier (Saluting / attentive) -->
  <!-- Body / Uniform -->
  <path d="M85,170 L105,165 L108,205 L82,205 Z" fill="#166534"/>
  <!-- Head -->
  <circle cx="95" cy="148" r="10" fill="#fcd34d"/>
  <!-- Short military hair -->
  <path d="M86,145 C86,140 92,138 98,140 C102,141 104,144 104,148 L86,148 Z" fill="#451a03"/>
  <!-- Saluting Arm -->
  <path d="M90,168 L80,152 L92,147" fill="none" stroke="#166534" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="91" cy="147" r="3.5" fill="#fcd34d"/>
  <!-- Focused eyes -->
  <line x1="94" y1="147" x2="98" y2="147" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Foreground details: Training equipment props -->
  <!-- Water canteen on ground -->
  <rect x="62" y="210" width="10" height="14" rx="3" fill="#e2e8f0"/>
  <path d="M65,210 L67,208 L69,208 L71,210 Z" fill="#64748b"/>

  <!-- Tactical Walkie Talkie -->
  <rect x="155" y="212" width="8" height="16" rx="2" fill="#334155"/>
  <line x1="159" y1="212" x2="159" y2="207" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Atmospheric Lighting / Ambient Glow -->
  <circle cx="110" cy="185" r="25" fill="#38bdf8" opacity="0.12" filter="blur(8px)"/>
  
  <!-- Subtle ground dust/debris -->
  <circle cx="180" cy="210" r="1.5" fill="#64748b" opacity="0.6"/>
  <circle cx="45" cy="220" r="2" fill="#64748b" opacity="0.4"/>
  <circle cx="135" cy="225" r="1" fill="#64748b" opacity="0.5"/>
</svg>