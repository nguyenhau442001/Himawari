<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid representing harbor water and structural scale -->
  <g opacity="0.15">
    <line x1="30" y1="180" x2="210" y2="180" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="30" y1="200" x2="210" y2="200" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="90" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- Abstract Categorization / Structural Classification Metaphor (Classifier for Ships) -->
  <!-- Floating alignment grid showcasing structural containment and units (Measure word function) -->
  
  <!-- Base Dock Platform / Horizon Line -->
  <path d="M 40 160 L 200 160" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Conceptual Measurement / Unit Frame (Focusing on discrete counting & categorization of large vessels) -->
  <g transform="translate(0, 0)">
    <!-- Slot 1: First Vessel Unit Indicator -->
    <rect x="55" y="115" width="38" height="45" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Slot 2: Main Highlighted Vessel Unit (艘) - Crisp, modern geometric ship -->
    <g transform="translate(101, 105)">
      <!-- Unit containment bracket / highlight -->
      <rect x="-4" y="-4" width="46" height="65" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2.5"/>
      <!-- Accent glow behind ship -->
      <circle cx="19" cy="28" r="18" fill="#F59E0B" opacity="0.15"/>
      
      <!-- Sleek Modern Hull -->
      <path d="M 4 35 L 34 35 C 36 35 37 37 35 39 L 28 44 C 25 46 13 46 10 44 L 3 39 C 1 37 2 35 4 35 Z" fill="#3B82F6"/>
      <!-- Superstructure / Deck levels -->
      <rect x="10" y="23" width="18" height="12" rx="2" fill="#94A3B8"/>
      <rect x="13" y="15" width="12" height="8" rx="1.5" fill="#E2E8F0"/>
      <!-- Funnel / Mast -->
      <rect x="17" y="9" width="4" height="6" fill="#F59E0B"/>
      <!-- Hull waterline accent -->
      <path d="M 6 39 L 32 39" stroke="#60A5FA" stroke-width="1.5"/>
    </g>

    <!-- Slot 3: Third Vessel Unit Indicator -->
    <rect x="147" y="115" width="38" height="45" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Progression / Categorization Indicators (Floating structural markers) -->
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top bracket pointing directly to the unit -->
    <path d="M 111 82 L 120 74 L 129 82"/>
    <line x1="120" y1="74" x2="120" y2="92"/>
  </g>

  <!-- Abstract scale / unit counter nodes -->
  <circle cx="74" cy="95" r="3" fill="#64748B"/>
  <circle cx="120" cy="95" r="4" fill="#F59E0B"/>
  <circle cx="166" cy="95" r="3" fill="#64748B"/>

  <!-- Dynamic focal beam highlighting the precise discrete entity unit -->
  <path d="M 120 35 L 100 65 L 140 65 Z" fill="#F59E0B" opacity="0.2"/>
  <circle cx="120" cy="30" r="4" fill="#F59E0B"/>
</svg>