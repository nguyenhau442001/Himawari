<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="120" y1="30" x2="40" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="165" cy="90" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="plantPot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Wall Details -->
  <!-- Window Frame -->
  <path d="M 35 25 L 85 25 L 85 140 L 35 140 Z" fill="#334155" opacity="0.4"/>
  <rect x="40" y="30" width="40" height="105" fill="#1e293b" rx="2"/>
  <!-- Windowpane Light -->
  <polygon points="40,30 80,30 80,135 40,135" fill="url(#lightBeam)"/>
  <line x1="60" y1="30" x2="60" y2="135" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="82" x2="80" y2="82" stroke="#334155" stroke-width="2"/>

  <!-- Stars / Night Sky outside window -->
  <circle cx="50" cy="45" r="1" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="70" cy="65" r="1.5" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="48" cy="95" r="1" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="68" cy="115" r="1.2" fill="#e2e8f0" opacity="0.7"/>

  <!-- Wall Shelf -->
  <rect x="130" y="35" width="80" height="6" rx="3" fill="#475569"/>
  <!-- Books on Shelf -->
  <rect x="140" y="15" width="10" height="20" rx="2" fill="#ec4899"/>
  <rect x="151" y="12" width="12" height="23" rx="2" fill="#8b5cf6"/>
  <rect x="164" y="18" width="8" height="17" rx="2" fill="#06b6d4"/>
  <!-- Small Potted Plant on Shelf -->
  <path d="M 185 25 L 195 25 L 193 35 L 187 35 Z" fill="#94a3b8"/>
  <circle cx="190" cy="22" r="6" fill="#10b981"/>
  <circle cx="185" cy="20" r="5" fill="#34d399"/>

  <!-- Desk Lamp Glow Effect -->
  <circle cx="165" cy="90" r="70" fill="url(#lampGlow)"/>

  <!-- Bookshelf / Storage Unit edge on right -->
  <rect x="220" y="0" width="20" height="240" fill="#0f172a" opacity="0.5"/>

  <!-- Main Wooden Desk -->
  <rect x="15" y="170" width="210" height="12" rx="3" fill="#b45309" filter="url(#shadow)"/>
  <rect x="25" y="182" width="15" height="48" fill="#78350f"/>
  <rect x="200" y="182" width="15" height="48" fill="#78350f"/>

  <!-- Desk Items -->
  <!-- Study Materials / Open Notebook -->
  <g transform="translate(65, 145)">
    <!-- Notebook Base -->
    <path d="M 10 10 L 70 5 L 75 30 L 15 35 Z" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M 70 5 L 130 10 L 135 35 L 75 30 Z" fill="#f1f5f9"/>
    <!-- Center Binding -->
    <line x1="70" y1="5" x2="75" y2="30" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Simulated Study Notes & Foreign Vocabulary lines -->
    <line x1="20" y1="16" x2="50" y2="14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="22" x2="45" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="85" y1="18" x2="115" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="25" x2="110" y2="27" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sticky Note (representing constant effort/reminder) -->
    <rect x="5" y="-5" width="22" height="20" rx="2" fill="#fef08a" transform="rotate(-8 5 -5)"/>
    <line x1="9" y1="2" x2="20" y2="2" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="7" x2="16" y2="7" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Laptop / Reference Tablet -->
  <g transform="translate(145, 140)">
    <!-- Laptop Base -->
    <path d="M -5 32 L 45 32 L 52 42 L -12 42 Z" fill="#cbd5e1"/>
    <!-- Screen -->
    <path d="M 0 0 L 40 -2 L 40 32 L 0 32 Z" fill="#334155" rx="2"/>
    <rect x="4" y="4" width="32" height="22" rx="1" fill="#0ea5e9"/>
    <!-- UI graphics on screen (Abstract learning stats bar/graph) -->
    <rect x="8" y="8" width="16" height="3" rx="1" fill="#e0f2fe"/>
    <rect x="8" y="14" width="24" height="2" rx="1" fill="#bae6fd"/>
    <rect x="8" y="19" width="18" height="2" rx="1" fill="#bae6fd"/>
    <circle cx="30" cy="18" r="4" fill="#f59e0b"/>
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(195, 110)">
    <!-- Base -->
    <ellipse cx="0" cy="60" rx="12" ry="4" fill="#64748b"/>
    <!-- Arm -->
    <path d="M 0 60 L -15 30 L 10 10" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shade -->
    <path d="M 2 -2 L 22 18 L 8 24 L -12 4 Z" fill="#f59e0b"/>
    <!-- Bulb Glow Light Cone -->
    <polygon points="5,20 -15,70 45,70" fill="url(#lampGlow)" opacity="0.6"/>
  </g>

  <!-- Coffee Mug (Fuel for perseverance) -->
  <g transform="translate(32, 148)">
    <rect x="0" y="5" width="14" height="17" rx="3" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M 14 8 C 18 8, 18 16, 14 18" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 3 3 C 4 1, 7 1, 8 3" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Character (Determined Student studying late with focus) -->
  <g transform="translate(85, 80)">
    <!-- Chair Backrest -->
    <path d="M -25 30 L -15 100 L -5 100 L 5 30 Z" fill="#334155" filter="url(#shadow)"/>
    
    <!-- Torso (Leaning forward with dedication) -->
    <path d="M -10 40 Q 10 30, 25 75 L 0 95 Q -20 70, -10 40 Z" fill="url(#sweaterGrad)" filter="url(#shadow)"/>

    <!-- Sleeves & Arms resting on desk -->
    <!-- Left Arm -->
    <path d="M -5 50 Q -25 60, -35 80 L -25 88 Q -15 70, 5 65 Z" fill="#2563eb"/>
    <!-- Right Arm holding pen -->
    <path d="M 15 50 Q 30 55, 42 75 L 32 80 Q 22 68, 8 62 Z" fill="#2563eb"/>
    
    <!-- Hand & Pen -->
    <circle cx="45" cy="77" r="4" fill="#fbcfe8"/>
    <line x1="45" y1="77" x2="55" y2="87" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck & Head -->
    <path d="M 2 32 Q 5 22, 10 20 L 15 32 Z" fill="#fbcfe8"/>
    
    <!-- Head Group (Determined expression, looking down at book) -->
    <g transform="translate(12, -2)">
      <!-- Hair (Styled neatly) -->
      <path d="M -5 18 C -5 5, 10 -2, 25 2 C 32 4, 38 12, 35 22 C 35 25, 30 25, 28 20 C 22 10, 10 10, 0 20 Z" fill="#0f172a"/>
      <path d="M -2 15 C 2 5, 15 4, 24 10 Z" fill="#1e293b"/>

      <!-- Face Profile -->
      <circle cx="15" cy="18" r="13" fill="#fbcfe8"/>
      
      <!-- Ear -->
      <path d="M 5 16 C 3 16, 3 22, 6 22" fill="#f472b6"/>

      <!-- Focused Eyes (Determined, narrow, looking down) -->
      <path d="M 14 18 L 22 19" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Eyebrow set with firm intention (恒心 - Persistence/Focus) -->
      <path d="M 12 14 L 22 15" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Cheek blush (effort and warmth) -->
      <circle cx="18" cy="22" r="3" fill="#f43f5e" opacity="0.3"/>

      <!-- Smile hint (confident and persistent) -->
      <path d="M 17 24 Q 21 26, 23 23" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Ambient glowing particles / Spark of focus/mind power -->
  <g opacity="0.8">
    <circle cx="115" cy="115" r="2" fill="#f59e0b"/>
    <circle cx="130" cy="105" r="1.5" fill="#38bdf8"/>
    <circle cx="100" cy="100" r="1" fill="#10b981"/>
    <!-- Tiny star sparkles -->
    <path d="M 120 95 L 122 99 L 126 100 L 122 101 L 120 105 L 118 101 L 114 100 L 118 99 Z" fill="#fbbf24" transform="scale(0.5) translate(130, 90)"/>
  </g>
</svg>