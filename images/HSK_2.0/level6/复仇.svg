<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping paths -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Lamp Cone Gradient -->
    <linearGradient id="lampCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Red Accent / Intensity Glow (Mental Focus/Obsession) -->
    <radialGradient id="obsessGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Dark Detective/Study Room -->
  <!-- Brick Wall Texture Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="40" x2="240" y2="40" />
    <line x1="0" y1="80" x2="240" y2="80" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="0" y1="160" x2="240" y2="160" />
    <!-- Vertical offset mortar lines -->
    <line x1="60" y1="40" x2="60" y2="80" />
    <line x1="150" y1="40" x2="150" y2="80" />
    <line x1="100" y1="80" x2="100" y2="120" />
    <line x1="180" y1="80" x2="180" y2="120" />
    <line x1="40" y1="120" x2="40" y2="160" />
    <line x1="130" y1="120" x2="130" y2="160" />
  </g>

  <!-- Tall Arched Window on Left with Cityscape silhouette -->
  <path d="M 25 15 L 65 15 C 65 15, 65 55, 65 75 L 25 75 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- City skyline through window -->
  <rect x="30" y="40" width="8" height="35" fill="#1e293b" />
  <rect x="40" y="30" width="12" height="45" fill="#1e293b" />
  <rect x="54" y="50" width="8" height="25" fill="#1e293b" />
  <!-- Window Light Beam Casting across the room -->
  <polygon points="65,30 160,200 65,200" fill="url(#lightBeam)" />

  <!-- The Investigation / Vengeance Board (Corkboard with photos, red strings) -->
  <rect x="135" y="20" width="85" height="95" rx="3" fill="#38220f" stroke="#523214" stroke-width="2" />
  <!-- Cork texture inner -->
  <rect x="138" y="23" width="79" height="89" fill="#78350f" opacity="0.6" />
  
  <!-- Photos pinned on board -->
  <!-- Target Photo 1 -->
  <rect x="145" y="30" width="22" height="26" fill="#cbd5e1" rx="1" transform="rotate(-5 156 43)" />
  <circle cx="156" cy="35" r="1.5" fill="#ef4444" /> <!-- Pin -->
  <!-- Target Photo 2 -->
  <rect x="185" y="45" width="24" height="22" fill="#cbd5e1" rx="1" transform="rotate(8 197 56)" />
  <circle cx="197" cy="48" r="1.5" fill="#ef4444" /> <!-- Pin -->
  <!-- Center Evidence Document / Dossier -->
  <rect x="155" y="65" width="35" height="30" fill="#f8fafc" rx="1" transform="rotate(-2 172 80)" />
  <circle cx="172" cy="68" r="1.5" fill="#ef4444" /> <!-- Pin -->
  <!-- Red lines connecting clues (The obsessive planning) -->
  <polyline points="156,43 172,80 197,56" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="156" y1="43" x2="197" y2="56" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Mental Obsession Red Glow behind Character's head -->
  <circle cx="105" cy="115" r="45" fill="url(#obsessGlow)" />

  <!-- Wooden Desk Surface -->
  <rect x="10" y="195" width="220" height="15" fill="#451a03" rx="2" />
  <rect x="10" y="210" width="220" height="25" fill="#270e01" />
  <!-- Desk Edge Highlight -->
  <line x1="10" y1="195" x2="230" y2="195" stroke="#78350f" stroke-width="2" />

  <!-- Desk Props -->
  <!-- Desk Lamp on Right -->
  <path d="M 195 195 L 205 195 L 202 165 L 198 165 Z" fill="#64748b" />
  <path d="M 190 145 C 190 135, 210 135, 210 145 Z" fill="#fbbf24" />
  <polygon points="180,195 220,195 210,145 190,145" fill="url(#lampCone)" />
  <!-- Open Notebook / Journal on Desk -->
  <path d="M 120 200 L 160 195 L 175 205 L 135 210 Z" fill="#f8fafc" />
  <line x1="147" y1="197.5" x2="155" y2="207" stroke="#cbd5e1" stroke-width="1" />
  <line x1="135" y1="200" x2="135" y2="210" stroke="#94a3b8" stroke-width="1.5" /> <!-- Spine -->

  <!-- Main Character (Determined, intensely focused, leaning forward) -->
  <g id="character">
    <!-- Torso / Jacket -->
    <path d="M 75 198 C 75 165, 88 150, 105 150 C 122 150, 135 165, 135 198 Z" fill="url(#jacketGrad)" />
    <!-- Inner Shirt / Collar -->
    <path d="M 97 150 L 105 168 L 113 150 Z" fill="#cbd5e1" />
    <path d="M 100 150 L 105 158 L 110 150 Z" fill="#1e293b" />

    <!-- Neck -->
    <rect x="98" y="135" width="14" height="20" fill="#fbcfe8" rx="4" />
    <path d="M 98 145 Q 105 150 112 145 Z" fill="#db2777" opacity="0.3" /> <!-- Shadow under chin -->

    <!-- Head -->
    <path d="M 88 115 C 88 95, 122 95, 122 115 C 122 135, 88 135, 88 115 Z" fill="#fbcfe8" />

    <!-- Hair (Messy, intense, analytical anime/modern style) -->
    <path d="M 86 115 C 84 90, 100 82, 118 88 C 126 90, 128 105, 128 115 C 128 105, 120 86, 105 85 C 90 84, 86 100, 86 115 Z" fill="#0f172a" />
    <path d="M 115 87 C 122 90, 128 100, 132 112 C 126 104, 120 95, 115 87 Z" fill="#0f172a" />
    <path d="M 90 90 C 85 95, 82 105, 84 115 C 86 105, 88 98, 90 90 Z" fill="#0f172a" />

    <!-- Intense Eyes & Serious Brow (The 'Vengeance/Revenge' Look) -->
    <!-- Eyebrows slanted sharply downward in determination -->
    <path d="M 92 107 L 103 111" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 118 107 L 107 111" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Eyes -->
    <circle cx="97" cy="114" r="3.5" fill="#0f172a" />
    <circle cx="113" cy="114" r="3.5" fill="#0f172a" />
    <circle cx="98.5" cy="113" r="1" fill="#ffffff" /> <!-- Eye gleam -->
    <circle cx="114.5" cy="113" r="1" fill="#ffffff" />

    <!-- Determined, tight mouth (firm line) -->
    <path d="M 100 126 Q 105 124 110 126" stroke="#9f1239" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Arms & Hands in brooding gesture -->
    <!-- Left arm resting/gripping desk edge -->
    <path d="M 80 170 C 70 175, 60 190, 55 198" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    <!-- Left Hand clenched into a fist on desk -->
    <circle cx="55" cy="198" r="6" fill="#fbcfe8" />
    <circle cx="55" cy="198" r="5" fill="none" stroke="#db2777" stroke-width="1.5" />

    <!-- Right arm bent, hand resting near chin/mouth in deep thought -->
    <path d="M 130 170 C 135 180, 125 195, 115 198" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    <!-- Right Hand touching chin thoughtfully -->
    <path d="M 110 130 C 105 132, 108 138, 115 136 Z" fill="#fbcfe8" />
  </g>

  <!-- Atmospheric Foreground Dust / Suspended Thought Particles -->
  <circle cx="75" cy="140" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="145" cy="130" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="160" cy="160" r="1" fill="#f43f5e" opacity="0.7" />
  <circle cx="85" cy="75" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="45" cy="110" r="2" fill="#fbbf24" opacity="0.3" />
</svg>