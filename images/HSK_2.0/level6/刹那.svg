<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- The Dropped Mug (The 'Moment' of action) -->
  <g transform="translate(120, 140)">
    <path d="M-20 0 L20 0 L15 40 L-15 40 Z" fill="#fb923c"/>
    <ellipse cx="0" cy="0" rx="20" ry="6" fill="#f59e0b"/>
    <!-- Splashing Coffee -->
    <path d="M-10 10 Q-30 5 -20 -20 Q-5 -10 0 0" fill="#fbbf24" opacity="0.8"/>
    <path d="M10 10 Q30 5 20 -20 Q5 -10 0 0" fill="#fbbf24" opacity="0.8"/>
  </g>
  
  <!-- Character Hands reaching out -->
  <path d="M60 160 Q50 120 70 110" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M180 160 Q190 120 170 110" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Motion Lines -->
  <path d="M120 100 L120 80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M130 110 L150 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 110 L90 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Background Details -->
  <circle cx="200" cy="40" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="30" width="40" height="60" fill="#334155" rx="4"/>
  <circle cx="50" cy="60" r="10" fill="#1e293b"/>
</svg>