<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient lighting/glow behind main problem area -->
  <circle cx="120" cy="110" r="70" fill="url(#glowGrad)"/>

  <!-- Room Interior / Environment Elements -->
  <!-- Bookshelf / Wall details -->
  <path d="M30 40 L90 40 L90 42 L30 42 Z" fill="#475569" opacity="0.6"/>
  <rect x="40" y="22" width="12" height="18" rx="2" fill="#64748b" opacity="0.7"/>
  <rect x="54" y="24" width="10" height="16" rx="2" fill="#38bdf8" opacity="0.5"/>
  <rect x="66" y="20" width="14" height="20" rx="2" fill="#fbbf24" opacity="0.5"/>

  <!-- Wall Calendar (showing passage of time: "迄今为止" - up until now / long duration) -->
  <g transform="translate(160, 25)">
    <rect x="0" y="0" width="36" height="42" rx="4" fill="#334155"/>
    <rect x="0" y="0" width="36" height="12" rx="4" fill="#ef4444"/>
    <circle cx="10" cy="6" r="2" fill="#cbd5e1"/>
    <circle cx="26" cy="6" r="2" fill="#cbd5e1"/>
    <!-- Cross marks on calendar indicating ongoing unresolved days -->
    <path d="M8 20 L14 26 M14 20 L8 26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 20 L28 26 M28 20 L22 26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 31 L14 37 M14 31 L8 37" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M10 180 L230 180 L220 215 L20 215 Z" fill="url(#deskGrad)"/>
  <path d="M10 180 L230 180" stroke="#475569" stroke-width="2"/>

  <!-- The "Problem" - Complex Blueprint / Puzzle Board on Desk -->
  <g transform="translate(75, 115)">
    <!-- Blueprint paper -->
    <rect x="0" y="0" width="90" height="65" rx="3" fill="#e2e8f0"/>
    <path d="M15 15 H75 M15 25 H55 M15 35 H65" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Tangled gears / unsolved puzzle diagram -->
    <circle cx="45" cy="42" r="14" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 3"/>
    <circle cx="45" cy="42" r="6" fill="#ef4444" opacity="0.8"/>
    <!-- Big Question Mark floating above the problem, glowing orange/amber -->
    <path d="M40 10 C40 2 50 2 50 10 C50 16 45 18 45 24" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="32" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Coffee Mug (prop showing late hours / long working time) -->
  <g transform="translate(180, 150)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#cbd5e1"/>
    <path d="M16 9 C20 9 20 19 16 19" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Steam lines -->
    <path d="M5 1 C5 -2 8 -2 8 -5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M11 0 C11 -3 14 -3 14 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Main Character: Exhausted/Thoughtful Engineer/Student Pondering the Unsolved Problem -->
  <!-- Character Body & Torso -->
  <path d="M85 210 C85 180 100 160 120 160 C140 160 155 180 155 210 Z" fill="#38bdf8"/>
  
  <!-- Character Head & Hair -->
  <circle cx="120" cy="115" r="22" fill="#fbcfe8"/> <!-- Face base -->
  <!-- Hair -->
  <path d="M98 115 C98 100 108 92 120 92 C132 92 142 100 142 115 C142 120 140 125 140 125 L100 125 C100 125 98 120 98 115 Z" fill="#1e293b"/>

  <!-- Pensive Facial Expression (Hand supporting chin, looking at problem) -->
  <path d="M112 118 Q120 124 128 118" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/> <!-- Concerned mouth -->
  <circle cx="112" cy="110" r="2" fill="#334155"/> <!-- Left eye -->
  <circle cx="128" cy="110" r="2" fill="#334155"/> <!-- Right eye -->
  <path d="M109 105 Q113 103 116 106" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/> <!-- Left brow -->
  <path d="M124 106 Q127 103 131 105" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/> <!-- Right brow -->

  <!-- Arm and Hand supporting the chin (classic pose for "unresolved problem / thinking") -->
  <path d="M105 160 L115 130 C115 130 118 122 122 122" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sleeve cuff -->
  <path d="M98 152 L112 142" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>

  <!-- Desk lamp illuminating the scene dramatically -->
  <g transform="translate(25, 80)">
    <path d="M30 100 L30 60" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 60 L15 40" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 25 L35 25 L25 40 L15 40 Z" fill="#fbbf24"/>
    <!-- Light cone overlay -->
    <polygon points="20,40 -20,110 90,110" fill="#fbbf24" opacity="0.08"/>
  </g>

</svg>