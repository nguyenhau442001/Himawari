<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lab Countertop Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Flask Liquid Gradient -->
    <linearGradient id="glowLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Window Light Shadow -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Laboratory / Kitchen Tech Counter) -->
  <!-- Ambient Wall Accents / Shelves -->
  <rect x="20" y="30" width="80" height="6" rx="3" fill="#334155"/>
  <rect x="140" y="45" width="70" height="6" rx="3" fill="#334155"/>
  <circle cx="115" cy="40" r="12" fill="#334155" opacity="0.5"/>

  <!-- Window beam -->
  <polygon points="0,0 120,0 60,240 0,240" fill="url(#windowLight)"/>

  <!-- Laboratory Countertop -->
  <rect x="0" y="180" width="240" height="60" fill="url(#counterGrad)"/>
  <rect x="0" y="175" width="240" height="5" fill="#475569"/>

  <!-- SCIENTIST CHARACTER (Right side) -->
  <!-- Body/Lab Coat -->
  <path d="M165,130 C165,115 175,110 190,110 C205,110 215,115 215,130 L220,180 L160,180 Z" fill="#f8fafc"/>
  <!-- Lab coat lapels -->
  <path d="M190,110 L180,145 L200,145 Z" fill="#e2e8f0"/>
  <line x1="190" y1="145" x2="190" y2="180" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Neck & Head -->
  <path d="M182,105 L198,105 L195,115 L185,115 Z" fill="#fbcfe8"/>
  <circle cx="190" cy="92" r="14" fill="#fbcfe8"/>
  <!-- Hair (Dark Blue/Slate) -->
  <path d="M176,92 C176,80 182,78 190,78 C198,78 204,80 204,92 C204,92 202,86 190,86 C178,86 176,92 176,92 Z" fill="#1e293b"/>

  <!-- Protective Glasses/Goggles on forehead -->
  <path d="M179,84 C179,81 185,80 190,80 C195,80 201,81 201,84 C201,87 195,88 190,88 C185,88 179,87 179,84 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Expressive Face (Surprised/Analyzing) -->
  <circle cx="186" cy="92" r="1.5" fill="#0f172a"/>
  <circle cx="194" cy="92" r="1.5" fill="#0f172a"/>
  <!-- Eyebrows raised -->
  <path d="M184,89 Q186,87 188,89" stroke="#0f172a" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M192,89 Q194,87 196,89" stroke="#0f172a" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Open mouth -->
  <circle cx="190" cy="98" r="2" fill="#0f172a"/>

  <!-- Arm holding magnifying glass or pointing -->
  <path d="M165,125 Q150,135 145,145" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Hand -->
  <circle cx="143" cy="147" r="4" fill="#fbcfe8"/>

  <!-- SCIENTIFIC EQUIPMENT: MICROSCOPE / HORMONE TESTER -->
  <!-- Microscope Base -->
  <path d="M100,180 L140,180 L130,160 L110,160 Z" fill="#64748b"/>
  <!-- Microscope Stem & Arm -->
  <rect x="117" y="120" width="6" height="40" fill="#64748b"/>
  <path d="M120,120 C105,120 100,135 100,145" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Eyepiece -->
  <rect x="92" y="128" width="16" height="6" rx="3" fill="#94a3b8" transform="rotate(-30 100 131)"/>
  <!-- Digital Screen showing graphs/hormone levels -->
  <rect x="105" y="95" width="30" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Graph lines inside screen -->
  <path d="M109,111 L114,105 L119,109 L125,99 L131,107" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Screen Glow -->
  <rect x="105" y="95" width="30" height="22" rx="4" fill="#38bdf8" opacity="0.1" filter="url(#neonGlow)"/>


  <!-- THE SUBJECT: FRUIT WITH HORMONE ANALYSIS -->
  <!-- Cutting Board -->
  <ellipse cx="65" cy="175" rx="35" ry="12" fill="#b45309"/>
  <ellipse cx="65" cy="173" rx="33" ry="10" fill="#d97706"/>

  <!-- ENHANCED EXOTIC FRUIT (Dragonfruit / Pitaya sliced & whole - rich in appearance) -->
  <!-- Whole Dragonfruit (Pink with green scales) -->
  <g transform="translate(35, 140)">
    <!-- Fruit Body -->
    <ellipse cx="15" cy="22" rx="16" ry="19" fill="#ec4899"/>
    <!-- Scales/Leaves -->
    <path d="M0,15 Q-8,10 -5,25 Q5,20 0,15 Z" fill="#10b981"/>
    <path d="M25,10 Q35,5 30,22 Q20,18 25,10 Z" fill="#10b981"/>
    <path d="M10,35 Q15,45 22,38 Q18,28 10,35 Z" fill="#10b981"/>
    <!-- Highlights -->
    <ellipse cx="10" cy="18" rx="4" ry="8" fill="#f472b6" opacity="0.6"/>
  </g>

  <!-- Sliced Dragonfruit (Showing white flesh and black seeds) -->
  <g transform="translate(70, 130)">
    <!-- Outer thick pink rind -->
    <ellipse cx="20" cy="25" rx="22" ry="16" fill="#ec4899"/>
    <!-- Inner white flesh -->
    <ellipse cx="20" cy="25" rx="17" ry="12" fill="#f8fafc"/>
    
    <!-- Tiny black seeds -->
    <circle cx="15" cy="22" r="1.2" fill="#0f172a"/>
    <circle cx="22" cy="20" r="1.2" fill="#0f172a"/>
    <circle cx="25" cy="27" r="1.2" fill="#0f172a"/>
    <circle cx="16" cy="28" r="1.2" fill="#0f172a"/>
    <circle cx="19" cy="24" r="1.2" fill="#0f172a"/>
    <circle cx="12" cy="25" r="1.2" fill="#0f172a"/>
    <circle cx="27" cy="23" r="1.2" fill="#0f172a"/>

    <!-- Highlight on fruit juice -->
    <path d="M15,16 Q20,15 25,18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>


  <!-- VISUALIZING HORMONE CONTENT (Glowing abstract chemical/hormone structure floating from the fruit) -->
  <g filter="url(#neonGlow)">
    <!-- Glowing chemical bonds rising from fruit -->
    <path d="M65,125 Q70,105 85,95" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="4 2"/>
    <path d="M85,95 L95,88" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M85,95 L80,82" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Glowing Hormone Molecular Nodes -->
    <circle cx="65" cy="125" r="4" fill="#f59e0b"/>
    <circle cx="85" cy="95" r="5" fill="#f59e0b"/>
    <circle cx="95" cy="88" r="3" fill="#38bdf8"/>
    <circle cx="80" cy="82" r="3" fill="#10b981"/>

    <circle cx="65" cy="125" r="2" fill="#fff"/>
    <circle cx="85" cy="95" r="2.5" fill="#fff"/>
  </g>

  <!-- Chemical Flask / Beaker on Counter -->
  <g transform="translate(145, 145)">
    <!-- Beaker Glass Body -->
    <path d="M5,25 L10,5 L25,5 L30,25 C30,32 5,32 5,25 Z" fill="#38bdf8" opacity="0.2" stroke="#94a3b8" stroke-width="2"/>
    <!-- Liquid Inside Flask -->
    <path d="M8,17 L11,7 L24,7 L27,17 C27,22 8,22 8,17 Z" fill="url(#glowLiquid)"/>
    <!-- Measurement markings -->
    <line x1="15" y1="11" x2="18" y2="11" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="14" y1="15" x2="19" y2="15" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Bubbles -->
    <circle cx="16" cy="14" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="21" cy="12" r="1.5" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Ambient lighting highlights -->
  <circle cx="120" cy="50" r="40" fill="#38bdf8" opacity="0.05" filter="url(#neonGlow)"/>

</svg>