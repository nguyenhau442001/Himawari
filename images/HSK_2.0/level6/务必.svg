<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Visual Metaphor: Escalation/Causality of "Must" (务必) -->
  <!-- A path leading to a critical, non-negotiable destination point -->
  
  <!-- Background Path -->
  <path d="M40 180 L120 180 L200 100" stroke="#333B47" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- The "Must" Marker: A sharp, high-contrast focal point -->
  <circle cx="200" cy="100" r="16" fill="#FFB800"/>
  <circle cx="200" cy="100" r="8" fill="#1A1D24"/>
  
  <!-- The Progression: A series of steps leading to the focal point -->
  <rect x="60" y="170" width="20" height="10" rx="2" fill="#4A5568"/>
  <rect x="100" y="150" width="20" height="30" rx="2" fill="#4A5568"/>
  <rect x="140" y="130" width="20" height="50" rx="2" fill="#4A5568"/>
  
  <!-- The Arrow of Causality: Emphasizing the necessity of the arrival -->
  <path d="M160 120 L190 105" stroke="#FFB800" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 115 L190 105 L185 95" stroke="#FFB800" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Decorative accent to imply urgency/importance -->
  <circle cx="200" cy="100" r="24" stroke="#FFB800" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
</svg>