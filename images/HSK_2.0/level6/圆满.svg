<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow for 'complete/successful' state -->
  <circle cx="120" cy="110" r="70" fill="#FFB800" opacity="0.08"/>
  
  <!-- Contrast / Scale Exaggeration: Fragmented/Incomplete vs Fully Realized/Complete (Adjective representation) -->
  <g transform="translate(0, -5)">
    <!-- Outer complete golden ring representing perfection/fulfillment (圆) -->
    <circle cx="120" cy="110" r="56" fill="none" stroke="#2A2F3D" stroke-width="6"/>
    <circle cx="120" cy="110" r="56" fill="none" stroke="#FFB800" stroke-width="6" stroke-dasharray="352" stroke-dashoffset="0" stroke-linecap="round"/>
    
    <!-- Inner glowing achievement core (满) -->
    <circle cx="120" cy="110" r="42" fill="#222836"/>
    
    <!-- Central celebratory / successful visual metaphor: A fully bloomed geometric star/flower signifying a successful event -->
    <g transform="translate(120, 110)">
      <!-- Radiating success beams -->
      <path d="M0-30 L6-12 L24-24 L12-6 L30 0 L12 6 L24 24 L6 12 L0 30 L-6 12 L-24 24 L-12 6 L-30 0 L-12 -6 L-24 -24 L-6 -12 Z" fill="#FFB800" opacity="0.9"/>
      <circle cx="0" cy="0" r="14" fill="#1A1D24"/>
      <circle cx="0" cy="0" r="8" fill="#FF8A00"/>
    </g>
    
    <!-- Floating accomplishment particles / stars -->
    <circle cx="72" cy="62" r="3" fill="#FFB800" opacity="0.8"/>
    <circle cx="168" cy="74" r="2.5" fill="#FFB800" opacity="0.6"/>
    <circle cx="65" cy="140" r="2" fill="#FFB800" opacity="0.7"/>
    <circle cx="162" cy="145" r="3.5" fill="#FFB800" opacity="0.9"/>
  </g>

  <!-- Ground / Base platform providing stability and completion -->
  <path d="M70 185 L170 185" stroke="#323846" stroke-width="3" stroke-linecap="round"/>
  <path d="M95 192 L145 192" stroke="#252A35" stroke-width="2" stroke-linecap="round"/>
</svg>