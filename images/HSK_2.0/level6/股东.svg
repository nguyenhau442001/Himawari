<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- ENVIRONMENT: BOARDROOM -->
  <!-- Back Wall & Architectural Lines -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="20" width="200" height="140" rx="4" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Large Presentation Screen (Company General Meeting Display) -->
  <rect x="65" y="32" width="110" height="65" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="73" y="40" width="94" height="42" rx="2" fill="#1e293b"/>
  <!-- Abstract chart on screen representing shareholder data -->
  <path d="M 83 72 L 95 62 L 107 67 L 123 52 L 137 57 L 157 44" fill="none" stroke="url(#screen-glow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="157" cy="44" r="3" fill="#38bdf8"/>
  <path d="M83 75 L157 75" stroke="#334155" stroke-width="1"/>

  <!-- Conference Table -->
  <!-- Table Base/Shadow -->
  <ellipse cx="120" cy="180" rx="90" ry="18" fill="#0b0f19" opacity="0.6"/>
  <!-- Main Table Surface -->
  <path d="M 35 155 L 205 155 L 225 195 L 15 195 Z" fill="#334155"/>
  <path d="M 40 159 L 200 159 L 216 191 L 24 191 Z" fill="#1e293b"/>
  <!-- Table Details (Papers, Water Glasses, Laptops) -->
  <rect x="95" y="168" width="18" height="12" rx="1" fill="#cbd5e1"/>
  <rect x="127" y="166" width="22" height="14" rx="2" fill="#475569"/>
  <rect x="130" y="169" width="16" height="9" fill="#38bdf8" opacity="0.8"/>
  <!-- Water pitcher & glass -->
  <path d="M 75 165 L 81 165 L 80 180 L 76 180 Z" fill="#94a3b8" opacity="0.7"/>
  <circle cx="67" cy="176" r="3" fill="#94a3b8" opacity="0.7"/>

  <!-- CHARACTERS (股东 - Shareholders / Board Members in Meeting) -->

  <!-- Left Shareholder (Listening attentively, taking notes) -->
  <g transform="translate(30, 100)">
    <!-- Body / Suit -->
    <path d="M 12 65 L 36 65 L 42 95 L 6 95 Z" fill="#0f172a"/>
    <path d="M 24 65 L 24 85" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Head & Hair -->
    <circle cx="24" cy="38" r="16" fill="#fcd34d"/>
    <path d="M 10 36 C 10 24 18 20 28 22 C 36 24 38 32 38 36 Z" fill="#334155"/>
    <!-- Face Profile -->
    <path d="M 22 42 L 26 44 L 23 47" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm & Hand with pen -->
    <path d="M 12 70 C 6 75 4 85 10 90" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="10" cy="91" r="3" fill="#fcd34d"/>
  </g>

  <!-- Center Speaker / Chairperson (Presenting at the head of the table) -->
  <g transform="translate(92, 85)">
    <!-- Raised Hand / Gesturing -->
    <path d="M 10 45 C 0 35 -5 20 -2 15 C 2 10 8 15 12 25" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- Body / Suit -->
    <path d="M 10 50 L 46 50 L 52 100 L 4 100 Z" fill="#1e293b"/>
    <path d="M 28 50 L 22 75 L 34 75 Z" fill="#f8fafc"/> <!-- Shirt & Tie -->
    <path d="M 28 65 L 28 85" stroke="#ef4444" stroke-width="2"/>
    <!-- Head & Hair -->
    <circle cx="28" cy="24" r="17" fill="#fbbf24"/>
    <path d="M 13 22 C 14 12 22 10 32 12 C 40 14 43 20 43 26 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="20" y="20" width="8" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="29" y="20" width="8" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="28" y1="22" x2="29" y2="22" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Confident Expression -->
    <path d="M 25 33 Q 28 36 31 33" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Right Shareholder (Engaged, gesturing to screen) -->
  <g transform="translate(160, 95)">
    <!-- Body / Suit -->
    <path d="M 10 65 L 42 65 L 48 100 L 4 100 Z" fill="#334155"/>
    <path d="M 26 65 L 20 85 L 32 85 Z" fill="#0f172a"/>
    <!-- Head & Hair -->
    <circle cx="26" cy="36" r="16" fill="#fb923c"/>
    <path d="M 14 34 C 14 22 22 20 34 24 C 38 26 38 34 38 36 Z" fill="#78350f"/>
    <!-- Expression (Speaking/Discussing) -->
    <circle cx="32" cy="40" r="3" fill="#9a3412"/>
    <path d="M 22 39 Q 26 37 29 40" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Raised Arm pointing to screen -->
    <path d="M 38 65 C 48 55 55 40 62 30" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <circle cx="63" cy="28" r="3" fill="#fb923c"/>
  </g>

  <!-- FOREGROUND ACCENTS & POLISH -->
  <!-- Golden badge/pin on Chairperson lapel hinting at formal corporate governance -->
  <circle cx="114" cy="142" r="3" fill="url(#gold-grad)"/>

  <!-- Ambient lighting highlights on table edge -->
  <path d="M 35 155 L 205 155" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>
</svg>