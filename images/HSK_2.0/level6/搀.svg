<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Road/Street -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Traffic Light Pole -->
  <rect x="200" y="80" width="6" height="120" fill="#64748b"/>
  <circle cx="203" cy="70" r="10" fill="#ec4899"/>
  
  <!-- Elderly Person -->
  <g transform="translate(80, 120)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M20 32 L20 70 M20 40 L5 60 M20 40 L35 55" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <rect x="10" y="70" width="20" height="40" rx="4" fill="#fb923c"/>
  </g>
  
  <!-- Young Man (The helper) -->
  <g transform="translate(120, 100)">
    <circle cx="20" cy="20" r="14" fill="#fde68a"/>
    <path d="M20 34 L20 80 M20 45 L5 70 M20 45 L35 70" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <!-- The "搀" (Supporting) action -->
    <path d="M10 40 L-20 40" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="80" width="20" height="50" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Cityscape Silhouette -->
  <path d="M0 180 L20 140 L40 180 Z" fill="#475569"/>
  <path d="M180 180 L210 120 L240 180 Z" fill="#475569"/>
  
  <!-- Decorative Street Glow -->
  <circle cx="203" cy="70" r="4" fill="#fff" opacity="0.5"/>
</svg>