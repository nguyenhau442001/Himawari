<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT & BACKGROUND PROPS -->
  <!-- Wallpaper / Wall lines -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" />
  
  <!-- Window frame on the back wall -->
  <rect x="150" y="40" width="50" height="80" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
  <line x1="175" y1="40" x2="175" y2="120" stroke="#334155" stroke-width="1.5" />
  <line x1="150" y1="80" x2="200" y2="80" stroke="#334155" stroke-width="1.5" />
  
  <!-- Moon/Night sky outside window -->
  <circle cx="170" cy="60" r="8" fill="#e2e8f0" opacity="0.8" />
  <path d="M170 52 C173 54, 175 58, 173 62 C170 64, 166 62, 168 58 Z" fill="#090d16" />

  <!-- Light beam coming from window -->
  <polygon points="150,40 200,40 240,180 180,180" fill="url(#lightBeam)" />

  <!-- Bookshelf in background -->
  <rect x="25" y="50" width="35" height="90" fill="#1e1b4b" rx="2" opacity="0.6" />
  <line x1="25" y1="80" x2="60" y2="80" stroke="#312e81" stroke-width="2" />
  <line x1="25" y1="110" x2="60" y2="110" stroke="#312e81" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="30" y="65" width="6" height="15" fill="#f43f5e" rx="1" />
  <rect x="38" y="60" width="8" height="20" fill="#38bdf8" rx="1" />
  <rect x="30" y="92" width="12" height="18" fill="#fbbf24" rx="1" />

  <!-- Desk and Workspace Props -->
  <rect x="20" y="160" width="160" height="8" fill="#475569" rx="2" />
  <rect x="35" y="168" width="12" height="52" fill="#334155" />
  <rect x="153" y="168" width="12" height="52" fill="#334155" />

  <!-- Desk Lamp (Unlit/Dim) -->
  <path d="M130,160 L135,130 L145,130 L150,160 Z" fill="#64748b" />
  <path d="M125,120 Q140,110 155,125 Z" fill="#475569" />

  <!-- Unfinished paperwork / Resume / Graph going down -->
  <rect x="55" y="138" width="30" height="22" fill="#f8fafc" rx="1" transform="rotate(-5 70 150)" />
  <line x1="60" y1="145" x2="78" y2="145" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-5 70 150)" />
  <line x1="60" y1="151" x2="72" y2="151" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-5 70 150)" />
  <!-- Downward trend red chart line -->
  <path d="M62,156 L68,154 L74,158 L80,155" fill="none" stroke="#ef4444" stroke-width="1.5" transform="rotate(-5 70 150)" />

  <!-- Coffee mug (cold, no steam) -->
  <rect x="95" y="145" width="12" height="15" fill="#e2e8f0" rx="2" />
  <path d="M107,148 C111,148 111,156 107,156" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- MAIN CHARACTER: Slumped over desk, conveying loss of hope/confidence -->
  <g transform="translate(85, 82)">
    <!-- Body / Torso slumped forward -->
    <path d="M30,45 C25,55 10,78 5,88 L45,90 C50,75 55,60 55,45 Z" fill="#334155" />
    
    <!-- Arms crossed on desk, head resting -->
    <path d="M15,55 Q35,70 55,55 L50,45 Q35,55 20,45 Z" fill="#1e293b" />
    <path d="M10,65 Q35,80 60,65" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" />

    <!-- Head slumped down -->
    <circle cx="35" cy="35" r="14" fill="#cbd5e1" />
    <!-- Messy hair -->
    <path d="M21,32 C22,23 30,20 42,24 C45,25 48,28 49,32 C45,28 35,26 27,29 Z" fill="#334155" />
    
    <!-- Closed, weary eyes (heavy drooping lines) -->
    <path d="M38,36 Q42,39 46,36" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Slumped shoulders / back contour -->
    <path d="M25,38 C15,42 5,60 5,88" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND ATMOSPHERE (Subtle melancholic vibe, heavy shadows) -->
  <rect x="0" y="200" width="240" height="40" fill="#090d16" opacity="0.4" />

  <!-- Floating abstract "fading light/hope" particles (dissipating) -->
  <circle cx="110" cy="110" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="125" cy="95" r="1" fill="#38bdf8" opacity="0.4" />
  <circle cx="100" cy="85" r="2" fill="#fbbf24" opacity="0.3" />
  <circle cx="135" cy="75" r="1" fill="#38bdf8" opacity="0.2" />

</svg>