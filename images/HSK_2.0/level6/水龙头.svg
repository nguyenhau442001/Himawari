    <!-- Spout / Nozzle -->
    <path d="M152 135 L168 135 L165 145 L155 145 Z" fill="#718096"/>

    <!-- Water Drops (Visualizing "Turn off the faucet" / water context) -->
    <!-- Drop 1 -->
    <path d="M160 158 C160 158, 155 165, 155 169 C155 172, 157.2 174, 160 174 C162.8 174, 165 172, 165 169 C165 165, 160 158, 160 158 Z" fill="#4FD1C5" opacity="0.9"/>
    <!-- Drop 2 (falling lower) -->
    <path d="M160 186 C160 186, 157 190, 157 193 C157 195, 158.3 196, 160 196 C161.7 196, 163 195, 163 193 C163 190, 160 186, 160 186 Z" fill="#4FD1C5" opacity="0.5"/>
  </g>
</svg>