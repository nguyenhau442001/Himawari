<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Window in background (subtle) -->
  <rect x="160" y="30" width="50" height="80" rx="8" fill="#2d3748" opacity="0.6"/>
  <rect x="165" y="35" width="40" height="70" rx="6" fill="#4a5568" opacity="0.4"/>
  <circle cx="185" cy="70" r="15" fill="#f59e0b" opacity="0.2"/> <!-- Subtle glow/moon -->

  <!-- Desk -->
  <rect x="30" y="140" width="180" height="60" rx="10" fill="#364152"/>
  <rect x="35" y="135" width="170" height="10" rx="5" fill="#4a5568"/> <!-- Desk surface highlight -->

  <!-- Computer Monitor -->
  <rect x="60" y="65" width="120" height="70" rx="8" fill="#2d3748"/> <!-- Monitor frame -->
  <rect x="65" y="70" width="110" height="60" rx="6" fill="#1a202c"/> <!-- Screen background -->

  <!-- Data Visualization on Screen -->
  <!-- Grid lines -->
  <line x1="70" y1="120" x2="170" y2="120" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="70" y1="105" x2="170" y2="105" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="70" y1="90" x2="170" y2="90" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="70" y1="75" x2="170" y2="75" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="70" y1="70" x2="70" y2="125" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="95" y1="70" x2="95" y2="125" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="120" y1="70" x2="120" y2="125" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="145" y1="70" x2="145" y2="125" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="170" y1="70" x2="170" y2="125" stroke="#4a5568" stroke-width="0.5"/>

  <!-- Precise Line Graph -->
  <polyline points="70,115 85,90 100,100 115,80 130,95 145,75 160,85 170,70"
            fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="115" r="1.5" fill="#38bdf8"/>
  <circle cx="85" cy="90" r="1.5" fill="#38bdf8"/>
  <circle cx="100" cy="100" r="1.5" fill="#38bdf8"/>
  <circle cx="115" cy="80" r="1.5" fill="#38bdf8"/>
  <circle cx="130" cy="95" r="1.5" fill="#38bdf8"/>
  <circle cx="145" cy="75" r="1.5" fill="#38bdf8"/>
  <circle cx="160" cy="85" r="1.5" fill="#38bdf8"/>
  <circle cx="170" cy="70" r="1.5" fill="#38bdf8"/>

  <!-- Character (Data Analyst) -->
  <!-- Body -->
  <rect x="85" y="150" width="70" height="50" rx="10" fill="#4a5568"/> <!-- Torso/Chair back -->
  <rect x="90" y="160" width="60" height="40" rx="8" fill="#5a6270"/> <!-- Chair seat -->

  <!-- Head -->
  <circle cx="120" cy="125" r="18" fill="#fbbf24"/> <!-- Skin tone -->
  <!-- Hair -->
  <path d="M105 110 Q120 95 135 110 C138 115 138 125 135 130 C130 135 110 135 105 130 C102 125 102 115 105 110Z" fill="#2d3748"/>
  <!-- Eyes -->
  <circle cx="112" cy="120" r="2" fill="#1a202c"/>
  <circle cx="128" cy="120" r="2" fill="#1a202c"/>
  <!-- Mouth (slight smile for satisfaction) -->
  <path d="M115 128 Q120 130 125 128" stroke="#1a202c" stroke-width="1.5" fill="none"/>

  <!-- Neck -->
  <rect x="115" y="140" width="10" height="10" fill="#fbbf24"/>

  <!-- Arms -->
  <rect x="75" y="145" width="20" height="40" rx="8" fill="#4a5568"/> <!-- Left arm sleeve -->
  <rect x="145" y="145" width="20" height="40" rx="8" fill="#4a5568"/> <!-- Right arm sleeve -->

  <!-- Hands (on keyboard/mouse) -->
  <circle cx="85" cy="180" r="6" fill="#fbbf24"/> <!-- Left hand -->
  <circle cx="155" cy="180" r="6" fill="#fbbf24"/> <!-- Right hand -->

  <!-- Keyboard -->
  <rect x="60" y="185" width="60" height="15" rx="3" fill="#2d3748"/>
  <rect x="63" y="188" width="54" height="9" rx="2" fill="#4a5568"/> <!-- Keys -->

  <!-- Mouse -->
  <rect x="130" y="188" width="20" height="10" rx="5" fill="#2d3748"/>
  <circle cx="140" cy="193" r="3" fill="#4a5568"/> <!-- Scroll wheel -->

  <!-- Subtle light glow from screen onto character/desk -->
  <circle cx="120" cy="130" r="25" fill="#38bdf8" opacity="0.1"/>
  <rect x="60" y="140" width="120" height="10" fill="#38bdf8" opacity="0.05"/>
</svg>