<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  <circle cx="180" cy="160" r="15" fill="#f59e0b" opacity="0.3"/>
  <rect x="40" y="155" width="60" height="4" rx="2" fill="#475569"/>
  <rect x="40" y="165" width="40" height="4" rx="2" fill="#475569"/>
  
  <!-- Character A (The inquirer) -->
  <g transform="translate(40, 60)">
    <circle cx="30" cy="30" r="25" fill="#fb923c"/>
    <path d="M15 45 Q30 55 45 45" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#0f172a"/>
    <circle cx="40" cy="25" r="3" fill="#0f172a"/>
    <path d="M30 60 L30 120" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 80 L30 100 L50 80" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Character B (The subject being described) -->
  <g transform="translate(140, 50)">
    <circle cx="30" cy="30" r="30" fill="#38bdf8"/>
    <path d="M15 45 Q30 55 45 45" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="4" fill="#0f172a"/>
    <circle cx="40" cy="25" r="4" fill="#0f172a"/>
    <path d="M30 60 L30 130" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <path d="M5 90 L30 110 L55 90" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M10 130 L20 160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M50 130 L40 160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Thought Bubble / Focus -->
  <path d="M110 40 Q100 20 120 20 L130 20 Q150 20 150 40 Q150 60 130 60 L120 60 L110 70 Z" fill="#ec4899" opacity="0.8"/>
  <circle cx="130" cy="40" r="5" fill="#ffffff" opacity="0.5"/>
</svg>