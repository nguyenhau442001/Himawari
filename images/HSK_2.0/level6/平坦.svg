<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Road Surface Gradient (Showing smoothness) -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sunset/Warm Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    
    <!-- Scooter Gradient -->
    <linearGradient id="scooterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />
  <circle cx="190" cy="80" r="120" fill="url(#sunGlow)" />

  <!-- Distant Hills & Trees (Context) -->
  <path d="M0 120 Q60 100 120 125 T240 115 L240 140 L0 140 Z" fill="#334155" opacity="0.6" />
  <circle cx="45" cy="115" r="12" fill="#10b981" opacity="0.4" />
  <circle cx="75" cy="118" r="16" fill="#10b981" opacity="0.5" />
  <circle cx="180" cy="120" r="14" fill="#10b981" opacity="0.4" />

  <!-- Modern Streetlamp (Context prop for infrastructure) -->
  <path d="M210 140 L210 50 L225 50" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M220 50 L230 65 L210 65 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M220 65 L190 140" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

  <!-- THE FLAT/SMOOTH ROAD ("这条路修得很平坦") -->
  <!-- Road Base -->
  <path d="M-20 140 L260 140 L260 210 L-20 210 Z" fill="url(#roadGrad)" />
  
  <!-- Perfectly straight, glowing asphalt edge lines emphasizing flatness -->
  <line x1="-20" y1="143" x2="260" y2="143" stroke="#64748b" stroke-width="2" />
  <line x1="-20" y1="207" x2="260" y2="207" stroke="#64748b" stroke-width="2" />

  <!-- Center dashed lines showing precision and smooth paving -->
  <line x1="0" y1="175" x2="25" y2="175" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <line x1="45" y1="175" x2="70" y2="175" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <line x1="90" y1="175" x2="115" y2="175" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <line x1="135" y1="175" x2="160" y2="175" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <line x1="180" y1="175" x2="205" y2="175" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <line x1="225" y1="175" x2="250" y2="175" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

  <!-- Roadside sidewalk / curb -->
  <path d="M-20 135 L260 135 L260 140 L-20 140 Z" fill="#94a3b8" />

  <!-- Foreground Bushes/Plants -->
  <circle cx="15" cy="138" r="8" fill="#10b981" />
  <circle cx="25" cy="136" r="10" fill="#059669" />
  <circle cx="110" cy="137" r="9" fill="#10b981" />
  <circle cx="120" cy="135" r="7" fill="#059669" />

  <!-- MAIN CHARACTER: Person effortlessly riding a kick scooter on the smooth road -->
  <!-- Scooter Deck & Stem -->
  <line x1="105" y1="170" x2="135" y2="170" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <path d="M110 170 L118 120" stroke="url(#scooterGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M113 120 L105 115" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Scooter Wheels -->
  <circle cx="95" cy="177" r="7" fill="#334155" />
  <circle cx="95" cy="177" r="3" fill="#cbd5e1" />
  <circle cx="140" cy="177" r="7" fill="#334155" />
  <circle cx="140" cy="177" r="3" fill="#cbd5e1" />

  <!-- Character Body (Leaning forward slightly, happy & balanced) -->
  <!-- Backpack -->
  <path d="M90 120 L102 125 L98 145 L86 140 Z" fill="#f59e0b" rx="2" />
  
  <!-- Torso & Arms -->
  <path d="M95 115 L115 125 L108 150 L88 140 Z" fill="url(#shirtGrad)" />
  <!-- Arms holding handlebar -->
  <path d="M105 125 L115 130 L110 120" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Head & Hair -->
  <circle cx="102" cy="98" r="11" fill="#fbcfe8" /> <!-- Face -->
  <path d="M91 98 Q93 86 104 88 Q113 90 112 100 Q105 93 96 97 Z" fill="#334155" /> <!-- Hair -->
  
  <!-- Happy Facial Expression (Smiling eyes & mouth) -->
  <path d="M97 96 L100 98" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <path d="M103 96 L106 98" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <path d="M99 101 Q101 104 104 101" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Legs (Riding pose) -->
  <!-- Back leg (on scooter) -->
  <path d="M98 145 L108 170 L112 170" stroke="url(#pantsGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Front leg (pushing/gliding) -->
  <path d="M95 145 L80 160 L75 165" stroke="url(#pantsGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Motion lines indicating smooth, effortless gliding -->
  <path d="M65 160 L50 160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M60 170 L45 170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Architectural details: Modern building background right -->
  <path d="M180 140 L180 80 L240 80 L240 140 Z" fill="#1e293b" opacity="0.8" />
  <!-- Windows grid -->
  <rect x="190" y="90" width="10" height="15" fill="#38bdf8" opacity="0.3" rx="1" />
  <rect x="210" y="90" width="10" height="15" fill="#38bdf8" opacity="0.5" rx="1" />
  <rect x="190" y="115" width="10" height="15" fill="#38bdf8" opacity="0.4" rx="1" />
  <rect x="210" y="115" width="10" height="15" fill="#fbbf24" opacity="0.4" rx="1" />

</svg>