<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Table Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    
    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="80" r="100" fill="url(#lamp-glow)" />

  <!-- Background Office Details -->
  <!-- Bookshelf -->
  <rect x="25" y="40" width="35" height="90" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="70" x2="60" y2="70" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="100" x2="60" y2="100" stroke="#334155" stroke-width="2" />
  <!-- Colored book spines -->
  <rect x="29" y="48" width="6" height="20" rx="1" fill="#38bdf8" />
  <rect x="37" y="45" width="8" height="23" rx="1" fill="#ec4899" />
  <rect x="47" y="50" width="5" height="18" rx="1" fill="#10b981" />
  <rect x="30" y="78" width="7" height="20" rx="1" fill="#fb923c" />
  <rect x="39" y="81" width="10" height="17" rx="1" fill="#818cf8" />

  <!-- Window with City Silhouette -->
  <path d="M 175 35 L 215 35 L 215 105 L 175 105 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  <!-- Cityscape inside window -->
  <path d="M 180 105 L 180 75 L 187 75 L 187 105 Z" fill="#1e293b" />
  <path d="M 190 105 L 190 60 L 198 60 L 198 105 Z" fill="#1e293b" />
  <path d="M 200 105 L 200 80 L 210 80 L 210 105 Z" fill="#1e293b" />
  <!-- Window crossbars -->
  <line x1="195" y1="35" x2="195" y2="105" stroke="#334155" stroke-width="1.5" />
  <line x1="175" y1="70" x2="215" y2="70" stroke="#334155" stroke-width="1.5" />

  <!-- Hanging Pendant Lamp -->
  <line x1="120" y1="0" x2="120" y2="35" stroke="#64748b" stroke-width="2" />
  <path d="M 105 35 L 135 35 L 140 45 L 100 45 Z" fill="#cbd5e1" />

  <!-- Office Desk -->
  <path d="M 20 160 L 220 160 L 210 205 L 30 205 Z" fill="url(#table-grad)" filter="url(#shadow)" />
  <rect x="25" y="155" width="190" height="8" rx="2" fill="#475569" />

  <!-- Desk Props -->
  <!-- Coffee Mug -->
  <rect x="112" y="145" width="16" height="18" rx="3" fill="#f8fafc" />
  <path d="M 128 149 C 133 149, 133 159, 128 159" stroke="#f8fafc" stroke-width="2.5" fill="none" />
  <path d="M 116 142 C 117 137, 115 133, 119 130" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" />
  
  <!-- Laptop -->
  <path d="M 90 158 L 150 158 L 155 163 L 85 163 Z" fill="#64748b" />
  <path d="M 92 125 L 148 125 L 150 158 L 90 158 Z" fill="#334155" />
  <rect x="96" y="130" width="48" height="24" rx="2" fill="#0f172a" />

  <!-- CHARACTER LEFT (Character A - Bowing / Flattering) -->
  <g transform="translate(45, 95)">
    <!-- Body / Torso leaning forward -->
    <path d="M 35 40 Q 20 50 10 75 L 35 75 L 45 50 Z" fill="#3b82f6" />
    <!-- Head -->
    <circle cx="12" cy="30" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M -1 25 Q 12 12 25 25 Q 22 35 18 35 Q 10 32 2 35 Z" fill="#1e293b" />
    <!-- Facial expression: exaggerated wide smile, closed happy eyes -->
    <path d="M 6 32 Q 10 37 14 32" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 6 26 C 7 25, 9 25, 10 26" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 13 26 C 14 25, 16 25, 17 26" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Arms gesturing enthusiastically (Flattering pose) -->
    <!-- Back arm -->
    <path d="M 30 45 Q 40 40 48 48" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Front arm holding up thumb or clapping -->
    <path d="M 22 55 Q 35 60 42 50" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="43" cy="48" r="4" fill="#fbcfe8" />
  </g>

  <!-- CHARACTER RIGHT (Character B - Defensive / "Stop it" gesture) -->
  <g transform="translate(135, 90)">
    <!-- Torso leaning slightly back -->
    <path d="M 25 40 Q 35 50 40 75 L 15 75 L 15 50 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="32" cy="30" r="14" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 18 28 Q 32 12 45 25 Q 44 32 38 30 Z" fill="#475569" />
    <!-- Facial expression: slightly overwhelmed, waving hand, squinting -->
    <path d="M 28 32 Q 33 28 38 32" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <line x1="26" y1="26" x2="30" y2="28" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="36" y1="28" x2="40" y2="26" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Raised Hand / Palm facing left ("Stop!" gesture) -->
    <path d="M 28 45 Q 15 40 10 32" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="8" cy="30" r="5" fill="#fbcfe8" />
    <!-- Other arm resting -->
    <path d="M 32 50 Q 42 60 38 72" stroke="#10b981" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Visual Metaphors / "Flattery" Bubbles (Sparkles & Stars indicating excessive praise, floating away) -->
  <!-- Sparkle 1 -->
  <path d="M 90 60 L 93 68 L 101 71 L 93 74 L 90 82 L 87 74 L 79 71 L 87 68 Z" fill="#fbbf24" opacity="0.9" />
  <!-- Sparkle 2 -->
  <path d="M 130 50 L 132 55 L 137 57 L 132 59 L 130 64 L 128 59 L 123 57 L 128 55 Z" fill="#f43f5e" opacity="0.8" />
  <!-- Tiny floating circles / praise bubbles -->
  <circle cx="105" cy="55" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="115" cy="45" r="5" fill="#38bdf8" opacity="0.6" />
  <circle cx="80" cy="90" r="2.5" fill="#ec4899" opacity="0.7" />

  <!-- Action lines / Motion lines near Character A -->
  <path d="M 75 110 Q 82 115 88 110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 72 120 Q 80 125 86 120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />

</svg>