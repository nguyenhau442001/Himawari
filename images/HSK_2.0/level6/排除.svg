<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Interior Room Context (Police Station / Investigation Room) -->
  <!-- Back Wall & Panel -->
  <rect x="20" y="25" width="200" height="155" rx="8" fill="#1e293b"/>
  
  <!-- Window with vertical blinds & soft city night light -->
  <rect x="150" y="45" width="55" height="95" rx="4" fill="#090d16"/>
  <!-- Blinds slats -->
  <line x1="150" y1="60" x2="205" y2="60" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="75" x2="205" y2="75" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="90" x2="205" y2="90" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="105" x2="205" y2="105" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="120" x2="205" y2="120" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Investigation Desk -->
  <path d="M 35 155 L 175 155 L 185 185 L 25 185 Z" fill="#334155"/>
  <rect x="30" y="148" width="150" height="10" rx="3" fill="#475569"/>
  
  <!-- Props on Desk -->
  <!-- Case File / Documents -->
  <rect x="50" y="152" width="40" height="25" rx="2" fill="#e2e8f0" transform="rotate(-5 50 152)"/>
  <line x1="55" y1="160" x2="80" y2="160" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="167" x2="75" y2="167" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <rect x="140" y="150" width="14" height="18" rx="3" fill="#38bdf8"/>
  <path d="M 154 154 C 158 154, 158 162, 154 164" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Character 1: Police Officer (Foreground Right, reviewing and clearing) -->
  <!-- Officer Body & Uniform -->
  <path d="M 125 185 L 140 120 L 175 120 L 195 185 Z" fill="#1e3a8a"/>
  <!-- Officer Tie -->
  <polygon points="150,125 155,125 157,145 152,150 148,145" fill="#0f172a"/>
  <!-- Officer Head & Face -->
  <circle cx="150" cy="102" r="14" fill="#cbd5e1"/>
  <!-- Police Cap -->
  <path d="M 135 95 C 135 90, 165 90, 165 95 L 170 98 C 170 98, 130 98, 130 98 Z" fill="#1e3a8a"/>
  <rect x="140" y="93" width="20" height="4" fill="#1e293b"/>
  <path d="M 134 94 C 138 90, 162 90, 166 94" fill="#fbbf24"/> <!-- Gold badge accent -->

  <!-- Officer Hand holding Stamp / Pen pointing away -->
  <path d="M 120 135 Q 135 140, 138 132" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Character 2: Civilian / Subject cleared of suspicion (Sitting on the left, looking relieved) -->
  <!-- Civilian Body -->
  <path d="M 55 185 L 65 130 L 95 130 L 105 185 Z" fill="#475569"/>
  <!-- Civilian Head -->
  <circle cx="80" cy="112" r="13" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M 68 110 C 68 100, 92 100, 92 110 C 92 105, 68 105, 68 110 Z" fill="#78350f"/>
  
  <!-- Relieved Expression (Soft smile, relaxed posture) -->
  <path d="M 77 116 Q 80 119, 83 116" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- CRITICAL ILLUSTRATION ELEMENT: "Elimination / Clearance" visual metaphor -->
  <!-- A glowing green checkmark / check overlay crossing out a suspect tag or folder -->
  <g transform="translate(85, 65)">
    <!-- Suspect File Tag floating slightly -->
    <rect x="-15" y="-10" width="50" height="30" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <!-- Photo placeholder silhouette inside tag -->
    <circle cx="10" cy="5" r="7" fill="#cbd5e1"/>
    <path d="M 2 17 C 2 12, 18 12, 18 17" fill="#cbd5e1"/>
    
    <!-- Red Question Mark stamped/crossed out -->
    <circle cx="30" cy="5" r="12" fill="#ef4444"/>
    <path d="M 27 1 C 27 -2, 33 -2, 33 2 C 33 6, 29 6, 29 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="29" cy="14" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Big Glowing Green Verification / Elimination Stamp Effect -->
  <g transform="translate(115, 85)">
    <circle cx="0" cy="0" r="18" fill="#10b981" opacity="0.2"/>
    <circle cx="0" cy="0" r="14" fill="#10b981"/>
    <!-- Checkmark representing 'Cleared / Excluded from suspicion' -->
    <path d="M -5 0 L -1 4 L 6 -4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ambient lighting/glow on scene -->
  <circle cx="150" cy="65" r="35" fill="#38bdf8" opacity="0.08" filter="blur(10px)"/>
</svg>