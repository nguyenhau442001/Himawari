<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Amber Glow for Heritage/Legacy -->
    <radialGradient id="heritageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Scroll Gradient -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="15%" stop-color="#fffbeb" />
      <stop offset="85%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Wood Texture / Color for Desk -->
    <linearGradient id="woodDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="woodLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Elements -->
  <circle cx="120" cy="110" r="90" fill="url(#heritageGlow)" />

  <!-- Background Architecture / Interior Details -->
  <!-- Bookshelf Background Left -->
  <rect x="25" y="45" width="45" height="110" rx="3" fill="#1e1b4b" opacity="0.6"/>
  <rect x="30" y="60" width="35" height="4" fill="#312e81" opacity="0.8"/>
  <rect x="30" y="85" width="35" height="4" fill="#312e81" opacity="0.8"/>
  <rect x="30" y="110" width="35" height="4" fill="#312e81" opacity="0.8"/>
  <!-- Books on shelf -->
  <rect x="33" y="68" width="6" height="17" rx="1" fill="#f43f5e" />
  <rect x="41" y="66" width="5" height="19" rx="1" fill="#38bdf8" />
  <rect x="48" y="70" width="8" height="15" rx="1" fill="#10b981" />
  <rect x="33" y="93" width="7" height="17" rx="1" fill="#fbbf24" />
  <rect x="42" y="95" width="10" height="15" rx="1" fill="#a855f7" />

  <!-- Window Frame Right -->
  <path d="M175 40 L210 40 L210 115 L175 115 Z" fill="url(#windowLight)" stroke="#334155" stroke-width="2"/>
  <line x1="192" y1="40" x2="192" y2="115" stroke="#334155" stroke-width="1.5" />
  <line x1="175" y1="77" x2="210" y2="77" stroke="#334155" stroke-width="1.5" />

  <!-- House Plant on Bookshelf Top -->
  <path d="M40 45 C40 38 48 38 48 45 Z" fill="#10b981" />
  <path d="M44 45 L44 32" stroke="#059669" stroke-width="1.5" />
  <circle cx="44" cy="30" r="5" fill="#f43f5e" />

  <!-- Main Wooden Desk -->
  <rect x="20" y="150" width="200" height="12" rx="3" fill="url(#woodLight)" />
  <rect x="25" y="162" width="190" height="50" fill="url(#woodDark)" />
  <!-- Desk Leg Left -->
  <path d="M35 162 L45 162 L40 215 L30 215 Z" fill="#291104" />
  <!-- Desk Leg Right -->
  <path d="M195 162 L205 162 L210 215 L200 215 Z" fill="#291104" />

  <!-- Props on Desk: Antique Vase / Artifact -->
  <path d="M55 150 C50 142 58 132 58 128 C58 125 54 125 54 122 C54 118 62 118 62 122 C62 125 58 125 58 128 C58 132 66 142 61 150 Z" fill="#e2e8f0" />
  <ellipse cx="58" cy="122" rx="4" ry="1.5" fill="#cbd5e1" />
  <!-- Plant twig inside vase -->
  <path d="M58 122 Q52 110 48 105" stroke="#10b981" stroke-width="1.5" fill="none" />
  <circle cx="48" cy="105" r="2.5" fill="#34d399" />

  <!-- Open Heirloom Scroll / Document (Centerpiece representing 'Heritage') -->
  <g transform="translate(112, 135) rotate(-5)">
    <!-- Scroll Base / Shadow -->
    <rect x="-32" y="-12" width="64" height="24" rx="2" fill="#78350f" opacity="0.3" />
    <!-- Scroll Paper -->
    <path d="M-28 -10 C-30 -10 -30 -14 -28 -14 L28 -14 C30 -14 30 -10 28 -10 Z" fill="#d97706" />
    <rect x="-28" y="-10" width="56" height="20" fill="url(#scrollGrad)" />
    <!-- Abstract Heritage Calligraphy / Map Lines -->
    <path d="M-20 -5 L-5 -5 M-18 0 L5 0 M-22 5 L-2 5" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <circle cx="15" cy="-2" r="3.5" fill="#ef4444" opacity="0.8" />
    <!-- Scroll Wooden Handles -->
    <rect x="-31" y="-16" width="4" height="28" rx="2" fill="#b45309" />
    <rect x="27" y="-16" width="4" height="28" rx="2" fill="#b45309" />
  </g>

  <!-- CHARACTERS: Grandfather (Elder) and Grandson (Younger generation / 后辈) -->

  <!-- Character 1: Grandfather (Standing/Leaning from Left) -->
  <g transform="translate(68, 102)">
    <!-- Body / Torso (Elder in traditional/neat tunic) -->
    <path d="M-12 50 C-12 30 12 30 12 50 L18 78 C18 80 16 82 14 82 L-14 82 C-16 82 -18 80 -18 78 Z" fill="#334155" />
    <!-- Inner Collar -->
    <path d="M-6 30 L0 38 L6 30" fill="none" stroke="#f8fafc" stroke-width="2" />
    <!-- Head -->
    <circle cx="0" cy="14" r="14" fill="#fed7aa" />
    <!-- Friendly Elder Face / Expression (Smiling, looking down lovingly) -->
    <path d="M-6 12 Q-3 15 0 12" stroke="#451a03" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M2 12 Q5 15 8 12" stroke="#451a03" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M-2 18 Q0 21 2 18" stroke="#e11d48" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <!-- Gray Hair & Beard -->
    <path d="M-13 14 C-14 6 -8 2 0 2 C8 2 14 6 13 14 C14 18 10 22 10 22 C10 22 7 26 0 26 C-7 26 -10 22 -10 22 C-10 22 -14 18 -13 14 Z" fill="#94a3b8" />
    <!-- Glasses -->
    <circle cx="-4" cy="13" r="4.5" fill="none" stroke="#64748b" stroke-width="1" />
    <circle cx="5" cy="13" r="4.5" fill="none" stroke="#64748b" stroke-width="1" />
    <line x1="0" y1="13" x2="1" y2="13" stroke="#64748b" stroke-width="1" />

    <!-- Grandfather's Arm Reaching Out to Pass/Guide -->
    <!-- Shoulder & Upper Arm -->
    <path d="M10 38 C22 38 28 46 32 52" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round" />
    <!-- Forearm & Hand pointing/touching the scroll -->
    <path d="M32 52 L42 56" fill="none" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" />
    <circle cx="43" cy="56" r="3.5" fill="#fed7aa" />
  </g>

  <!-- Character 2: Grandson / Younger Generation (后辈 - hòubèi) (Sitting/Standing closely on Right) -->
  <g transform="translate(155, 95)">
    <!-- Torso (Youthful vibrant hoodie/sweater in modern teal/cyan) -->
    <path d="M-15 55 C-15 35 15 35 15 55 L22 85 C22 88 19 90 16 90 L-16 90 C-19 90 -22 88 -22 85 Z" fill="#0284c7" />
    <!-- Collar / Hoodie Strings -->
    <path d="M-8 35 L0 44 L8 35" fill="none" stroke="#e0f2fe" stroke-width="2" />
    <path d="M-4 44 L-5 55" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />
    <path d="M4 44 L5 55" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />

    <!-- Head -->
    <circle cx="0" cy="16" r="15" fill="#ffedd5" />
    <!-- Youthful Hair (Stylized dark modern crop) -->
    <path d="M-15 14 C-16 4 -6 1 0 1 C8 1 16 4 15 14 C16 10 12 4 4 3 C-4 2 -14 6 -15 14 Z" fill="#1e293b" />
    <path d="M-15 14 L-12 19 L-8 14 L-4 20 L1 13 L6 19 L12 13 L15 14" fill="#1e293b" />

    <!-- Face: Attentive, respectful, slightly smiling expression -->
    <!-- Eyes -->
    <circle cx="-4" cy="15" r="1.5" fill="#1e293b" />
    <circle cx="5" cy="15" r="1.5" fill="#1e293b" />
    <!-- Eyebrows (slanted slightly with earnest attention) -->
    <path d="M-7 11 Q-4 10 -2 12" stroke="#1e293b" stroke-width="1" fill="none" stroke-linecap="round" />
    <path d="M3 12 Q5 10 8 11" stroke="#1e293b" stroke-width="1" fill="none" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M-1 20 Q2 23 4 20" stroke="#c2410c" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <circle cx="-6" cy="19" r="2" fill="#fda4af" opacity="0.6" />
    <circle cx="7" cy="19" r="2" fill="#fda4af" opacity="0.6" />

    <!-- Grandson's Arm Reaching / Receiving the Heritage -->
    <!-- Upper Arm -->
    <path d="M-14 42 C-24 45 -28 55 -30 62" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round" />
    <!-- Forearm & Hand receiving/holding out toward scroll -->
    <path d="M-30 62 L-40 60" fill="none" stroke="#ffedd5" stroke-width="7" stroke-linecap="round" />
    <circle cx="-41" cy="60" r="3.5" fill="#ffedd5" />
  </g>

  <!-- Floating Sparkles / Heritage Energy Particles -->
  <g fill="#fbbf24">
    <path d="M95 90 L97 95 L102 97 L97 99 L95 104 L93 99 L88 97 L93 95 Z" opacity="0.9" />
    <path d="M135 75 L136 78 L139 79 L136 80 L135 83 L134 80 L131 79 L134 78 Z" opacity="0.7" />
    <circle cx="115" cy="70" r="2" opacity="0.8" />
    <circle cx="80" cy="120" r="1.5" opacity="0.6" />
    <circle cx="150" cy="115" r="2.5" opacity="0.5" />
  </g>
</svg>