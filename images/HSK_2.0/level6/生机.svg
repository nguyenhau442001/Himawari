<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow representing life force / energy -->
  <circle cx="120" cy="120" r="70" fill="#2E3842" opacity="0.4"/>
  <circle cx="120" cy="120" r="50" fill="#3D4F5C" opacity="0.2"/>

  <!-- Conceptual Physical Object (Sprout breaking through soil/ground - representing "sức sống", "sinh khí" in a spring field) -->
  <!-- Ground / Soil layer -->
  <path d="M 60 160 Q 120 150 180 160 L 195 180 Q 120 190 45 180 Z" fill="#243447"/>
  <path d="M 75 167 Q 120 158 165 167 L 175 177 Q 120 186 65 177 Z" fill="#2E435F"/>

  <!-- Energy particles / Glowing sparks (Vibrant spring atmosphere) -->
  <circle cx="90" cy="100" r="2.5" fill="#F5A623" opacity="0.8"/>
  <circle cx="155" cy="85" r="2" fill="#F5A623" opacity="0.9"/>
  <circle cx="140" cy="120" r="1.5" fill="#F5A623" opacity="0.7"/>
  <circle cx="95" cy="135" r="2" fill="#F5A623" opacity="0.6"/>

  <!-- Main Sprout Stem -->
  <path d="M 120 160 C 120 130, 105 105, 90 90" fill="none" stroke="#50E3C2" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left Leaf (Vibrant green with modern flat styling) -->
  <path d="M 97 103 C 75 95, 65 110, 75 125 C 85 125, 95 115, 97 103 Z" fill="#4CD964"/>
  <path d="M 97 103 C 85 110, 78 118, 75 125" fill="none" stroke="#2ECC71" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Leaf (Main focal point, glowing accent) -->
  <path d="M 95 97 C 120 85, 135 100, 125 120 C 115 115, 105 105, 95 97 Z" fill="#50E3C2"/>
  <path d="M 95 97 C 110 102, 118 112, 125 120" fill="none" stroke="#26A69A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Focus / Energy core at the tip of the sprout -->
  <circle cx="90" cy="90" r="4" fill="#F5A623"/>
  <circle cx="90" cy="90" r="8" fill="#F5A623" opacity="0.3"/>
</svg>