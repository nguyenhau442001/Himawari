<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Office Environment / Background Elements -->
  <!-- Window / City backdrop glow -->
  <path d="M140 30 H210 V130 H140 Z" fill="#0b1329" rx="4" />
  <rect x="148" y="38" width="24" height="36" fill="#1e293b" rx="2" />
  <rect x="178" y="38" width="24" height="36" fill="#1e293b" rx="2" />
  <rect x="148" y="80" width="24" height="42" fill="#1e293b" rx="2" />
  <rect x="178" y="80" width="24" height="42" fill="#1e293b" rx="2" />
  <!-- Warm office light source -->
  <circle cx="80" cy="20" r="40" fill="#fbbf24" opacity="0.08" filter="url(#glow)" />

  <!-- Desk Surface -->
  <path d="M10 185 L230 185 L240 220 L0 220 Z" fill="url(#deskGrad)" />
  <line x1="10" y1="185" x2="230" y2="185" stroke="#475569" stroke-width="2" />

  <!-- Desk Props (Laptop, Coffee, Lamp) -->
  <!-- Laptop -->
  <path d="M165 155 L215 155 L225 185 L155 185 Z" fill="#64748b" />
  <path d="M170 120 H210 V155 H170 Z" fill="#94a3b8" rx="2" />
  <path d="M174 125 H206 V150 H174 Z" fill="url(#screenGrad)" />
  <!-- Coffee Cup -->
  <rect x="130" y="160" width="14" height="20" rx="3" fill="#f8fafc" />
  <path d="M144 165 C149 165 149 175 144 175" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

  <!-- Character 1: The "Long-winded" Speaker (Left) -->
  <!-- Body / Torso -->
  <path d="M40 150 C40 130 65 130 65 150 L75 200 H25 Z" fill="#3b82f6" />
  <!-- Head & Face -->
  <circle cx="52" cy="110" r="18" fill="#ffedd5" />
  <!-- Hair -->
  <path d="M36 110 C36 95 68 95 68 110 C68 102 60 98 52 98 C44 98 36 102 36 110 Z" fill="#1e293b" />
  <!-- Expressive talking mouth & hand gesture -->
  <path d="M58 116 C60 116 62 118 60 120 C58 120 57 118 58 116 Z" fill="#c2410c" />
  <circle cx="46" cy="106" r="2.5" fill="#1e293b" />
  <!-- Raised talking hand (excessive gesture) -->
  <path d="M62 135 C75 125 75 110 70 105" fill="none" stroke="#ffedd5" stroke-width="6" stroke-linecap="round" />
  <!-- Abstract "blah blah" speech floating trail (No text, just decorative wavy loops) -->
  <path d="M75 100 C85 90 80 80 90 70 C95 65 105 70 100 80" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M72 112 C82 105 88 100 95 90" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Character 2: The Impatient Listener / Cutting to the Point (Right) -->
  <!-- Body / Torso -->
  <path d="M120 155 C120 135 150 135 150 155 L160 200 H110 Z" fill="#10b981" />
  <!-- Head & Face -->
  <circle cx="135" cy="115" r="18" fill="#fde68a" />
  <!-- Hair -->
  <path d="M119 115 C119 100 151 100 151 115 C145 108 125 108 119 115 Z" fill="#78350f" />
  <!-- Impatient / Serious expression (Eyebrow furrowed, straight mouth) -->
  <line x1="128" y1="110" x2="135" y2="112" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <line x1="142" y1="112" x2="149" y2="110" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <line x1="131" y1="123" x2="141" y2="123" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <circle cx="128" cy="115" r="2" fill="#1e293b" />
  <circle cx="142" cy="115" r="2" fill="#1e293b" />

  <!-- Hand making a "stop / cut to the chase" direct gesture -->
  <!-- Arm -->
  <path d="M125 145 C110 145 105 130 100 120" fill="none" stroke="#fde68a" stroke-width="7" stroke-linecap="round" />
  <!-- Palm facing forward (Stop / Direct action) -->
  <rect x="90" y="110" width="12" height="16" rx="4" fill="#fde68a" transform="rotate(-15 96 118)" />

  <!-- Focal Target Accent (The "Core / Point" glowing indicator floating between them) -->
  <circle cx="95" cy="130" r="10" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="95" cy="130" r="6" fill="#fff" />
  <path d="M92 130 L95 127 L98 130 M95 127 V135" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Foreground Lighting & Atmosphere Polish -->
  <circle cx="120" cy="20" r="120" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05" />
</svg>