<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 190, 160 190, 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Firewood Pile -->
  <g transform="translate(120, 160)">
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="#475569"/>
    <path d="M-30 -10 L -35 -40 L -20 -45 L -15 -15 Z" fill="#92400e"/>
    <path d="M-10 -15 L -5 -50 L 10 -45 L 15 -10 Z" fill="#b45309"/>
    <path d="M15 -10 L 20 -40 L 35 -35 L 30 -5 Z" fill="#78350f"/>
    <!-- The Rope (The 'Kun' action) -->
    <path d="M-25 -25 C -25 -35, 25 -35, 25 -25 C 25 -15, -25 -15, -25 -25" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M-5 -30 L 5 -20" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 L -30 60 L -10 60 L -5 30 L 5 30 L 10 60 L 30 60 L 20 20 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-5" r="3" fill="#0f172a"/>
    <!-- Arms -->
    <path d="M-20 25 L -45 45" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 25 L 45 45" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Hands interacting with wood -->
    <circle cx="-45" cy="45" r="6" fill="#fb923c"/>
    <circle cx="45" cy="45" r="6" fill="#fb923c"/>
  </g>

  <!-- Ambient details -->
  <circle cx="200" cy="50" r="2" fill="#f8fafc" opacity="0.5"/>
  <circle cx="180" cy="30" r="3" fill="#f8fafc" opacity="0.3"/>
  <circle cx="40" cy="70" r="2" fill="#f8fafc" opacity="0.4"/>
</svg>