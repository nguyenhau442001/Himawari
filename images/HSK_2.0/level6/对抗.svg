<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="arenaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment Context: Competition Arena / Stage Floor -->
  <ellipse cx="120" cy="180" rx="90" ry="35" fill="#090d16" opacity="0.8"/>
  <ellipse cx="120" cy="180" rx="75" ry="25" fill="url(#arenaGlow)"/>
  
  <!-- Dynamic Floor Grid Lines for Spatial Depth -->
  <path d="M 45 180 L 75 145 M 195 180 L 165 145 M 90 195 L 95 160 M 150 195 L 145 160" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="120" cy="175" rx="55" ry="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

  <!-- Background Stage Lights / Sparks representing intensity (激烈对抗) -->
  <circle cx="120" cy="115" r="35" fill="url(#arenaGlow)"/>
  <path d="M 115 95 L 125 135 M 105 105 L 135 125" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  <circle cx="110" cy="100" r="2" fill="#fff"/>
  <circle cx="135" cy="120" r="1.5" fill="#38bdf8"/>
  <circle cx="100" cy="130" r="2" fill="#ec4899"/>

  <!-- CHARACTER 1 (Left Side - Blue Team, pushing forward dynamically) -->
  <g transform="translate(0, 0)">
    <!-- Motion lines behind Character 1 -->
    <path d="M 40 130 L 75 130 M 45 145 L 80 145 M 50 160 L 70 160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Character 1 Shadow -->
    <ellipse cx="90" cy="190" rx="20" ry="6" fill="#000" opacity="0.4"/>
    
    <!-- Torso & Arms (Leaning aggressively right) -->
    <path d="M 85 135 L 105 125 L 115 155 L 90 165 Z" fill="#0284c7"/>
    <!-- Head & Helmet -->
    <circle cx="95" cy="110" r="13" fill="#cbd5e1"/>
    <path d="M 85 108 C 85 100 105 100 105 108 L 108 115 L 82 115 Z" fill="#0284c7"/>
    <!-- Visor -->
    <path d="M 93 110 L 105 110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dynamic Arms pushing (对抗 point of contact) -->
    <path d="M 102 128 L 122 138" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
    <circle cx="123" cy="138" r="5" fill="#f8fafc"/> <!-- Gloves/Hands clashing -->
    
    <!-- Legs in stance -->
    <path d="M 95 160 L 75 185 M 105 160 L 115 182" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 75 185 L 68 185 M 115 182 L 122 182" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2 (Right Side - Orange/Red Team, opposing fiercely) -->
  <g transform="translate(0, 0)">
    <!-- Motion lines behind Character 2 -->
    <path d="M 200 130 L 165 130 M 195 145 L 160 145 M 190 160 L 170 160" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Character 2 Shadow -->
    <ellipse cx="150" cy="190" rx="20" ry="6" fill="#000" opacity="0.4"/>
    
    <!-- Torso & Arms (Leaning aggressively left to counter) -->
    <path d="M 155 135 L 135 125 L 125 155 L 150 165 Z" fill="#ea580c"/>
    <!-- Head & Helmet -->
    <circle cx="145" cy="110" r="13" fill="#cbd5e1"/>
    <path d="M 135 108 C 135 100 155 100 155 108 L 158 115 L 132 115 Z" fill="#ea580c"/>
    <!-- Visor -->
    <path d="M 147 110 L 135 110" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dynamic Arms pushing -->
    <path d="M 138 128 L 118 138" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <circle cx="117" cy="138" r="5" fill="#f8fafc"/> <!-- Gloves/Hands clashing -->
    
    <!-- Legs in stance -->
    <path d="M 145 160 L 165 185 M 135 160 L 125 182" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 165 185 L 172 185 M 125 182 L 118 182" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- IMPACT / CLASH CENTER (The focal point of '对抗' & '激烈') -->
  <g transform="translate(120, 138)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" filter="url(#glow)" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    
    <!-- Impact energy bursts/lightning -->
    <path d="M 0 -18 L 3 -6 L 15 -9 L 6 0 L 14 9 L 3 6 L 0 18 L -3 6 L -15 9 L -6 0 L -14 -9 L -3 -6 Z" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M 0 -12 L 2 -4 L 10 -6 L 4 0 L 10 6 L 2 4 L 0 12 L -2 4 L -10 6 L -4 0 L -10 -6 L -2 -4 Z" fill="#ffffff"/>
    
    <!-- Sparks flying out -->
    <circle cx="-16" cy="-12" r="2" fill="#38bdf8"/>
    <circle cx="18" cy="-15" r="2.5" fill="#ec4899"/>
    <circle cx="20" cy="10" r="1.5" fill="#fbbf24"/>
    <circle cx="-18" cy="12" r="2" fill="#38bdf8"/>
    <circle cx="0" cy="-22" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Atmospheric Foreground Details (Frames / Sparks) -->
  <path d="M 20 60 L 30 60 M 25 55 L 25 65" stroke="#334155" stroke-width="2" opacity="0.5"/>
  <path d="M 210 80 L 220 80 M 215 75 L 215 85" stroke="#334155" stroke-width="2" opacity="0.5"/>
  <path d="M 200 190 L 210 190" stroke="#334155" stroke-width="2" opacity="0.3"/>
  <path d="M 30 170 L 40 170" stroke="#334155" stroke-width="2" opacity="0.3"/>
</svg>