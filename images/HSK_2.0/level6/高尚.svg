<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Golden Light Glow for "Noble/Character" theme -->
    <radialGradient id="nobleGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Desk & Books Gradients -->
    <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="woodTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Noble Glow & Background Elements -->
  <circle cx="120" cy="90" r="100" fill="url(#nobleGlow)" />

  <!-- Window Frame in Background (Contextual indoor setting) -->
  <g opacity="0.7">
    <rect x="150" y="30" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="153" y="33" width="54" height="74" fill="url(#windowLight)" />
    <!-- Window Panes -->
    <line x1="180" y1="33" x2="180" y2="107" stroke="#334155" stroke-width="2" />
    <line x1="153" y1="70" x2="207" y2="70" stroke="#334155" stroke-width="2" />
    <!-- Outside Plant Silhouette / Leaves near window -->
    <path d="M195 107 Q200 90 190 75 Q205 85 200 107 Z" fill="#047857" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Books in background representing wisdom and character -->
  <g opacity="0.8">
    <rect x="30" y="45" width="70" height="8" rx="2" fill="#475569" />
    <!-- Colorful book spines -->
    <rect x="35" y="20" width="8" height="25" rx="1" fill="#ef4444" />
    <rect x="44" y="17" width="10" height="28" rx="1" fill="#3b82f6" />
    <rect x="55" y="22" width="7" height="23" rx="1" fill="#10b981" />
    <rect x="63" y="19" width="12" height="26" rx="1" fill="#f59e0b" />
    <rect x="76" y="24" width="6" height="21" rx="1" fill="#ec4899" />
    <!-- Plant on shelf -->
    <path d="M90 27 Q95 18 102 22 Q98 29 90 27 Z" fill="#10b981" />
    <path d="M96 25 Q104 20 108 27 Q100 32 96 25 Z" fill="#059669" />
    <rect x="88" y="27" width="8" height="6" rx="1" fill="#cbd5e1" />
  </g>

  <!-- Wooden Desk Surface -->
  <g filter="url(#shadow)">
    <!-- Desk Front Edge -->
    <rect x="20" y="170" width="200" height="8" rx="2" fill="url(#woodDark)" />
    <!-- Desk Top -->
    <path d="M20 170 L220 170 L230 182 L10 182 Z" fill="url(#woodTop)" />
  </g>

  <!-- Props on Desk: Warm Desk Lamp illuminating the scene -->
  <g>
    <!-- Lamp Stand -->
    <path d="M195 170 L195 110 L180 85" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp Shade -->
    <path d="M165 75 L195 75 L205 90 L155 90 Z" fill="#f59e0b" />
    <ellipse cx="180" cy="90" rx="25" ry="8" fill="#fbbf24" opacity="0.4" />
    <!-- Light Cone Projection -->
    <polygon points="180,90 120,170 210,170" fill="#f59e0b" opacity="0.08" />
  </g>

  <!-- Props on Desk: Open Book / Notebook (symbolizing honest work, study, or journal) -->
  <g>
    <path d="M85 162 L125 158 L125 174 L85 178 Z" fill="#f8fafc" />
    <path d="M125 158 L165 162 L165 178 L125 174 Z" fill="#e2e8f0" />
    <line x1="125" y1="158" x2="125" y2="174" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Text lines indication -->
    <line x1="92" y1="166" x2="115" y2="164" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="92" y1="171" x2="110" y2="169" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="135" y1="166" x2="155" y2="168" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: A dignified, kind person embodying "高尚" (Noble character) -->
  <g id="character" filter="url(#shadow)">
    <!-- Torso & Coat -->
    <path d="M90 180 C90 135 150 135 150 180 Z" fill="url(#coatGrad)" />
    <!-- Shirt Collar & Inner Tie / Scarf for dignified appearance -->
    <path d="M107 135 L120 152 L133 135 Z" fill="url(#shirtGrad)" />
    <polygon points="117,148 123,148 125,170 115,170" fill="#3b82f6" />

    <!-- Arms / Gentle Hand Gesture over heart (showing sincerity and noble integrity) -->
    <!-- Left arm resting -->
    <path d="M95 145 C80 155 75 175 75 175" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" />
    <!-- Right arm placed gently across chest/heart -->
    <path d="M145 145 C130 155 120 165 115 160" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
    <!-- Hand on chest -->
    <circle cx="113" cy="158" rx="6" ry="6" fill="#f97316" />

    <!-- Neck -->
    <rect x="112" y="122" width="16" height="18" rx="4" fill="#f97316" />

    <!-- Head & Face Structure -->
    <ellipse cx="120" cy="105" rx="22" ry="26" fill="#f97316" />

    <!-- Neat Professional Hair (Dark, styled cleanly) -->
    <path d="M98 105 C98 82 142 82 142 105 C142 98 138 85 120 84 C102 85 98 98 98 105 Z" fill="#0f172a" />
    <!-- Hair fringe detail -->
    <path d="M102 95 Q115 98 125 93 Q135 98 138 95 Q135 88 120 86 Q105 88 102 95 Z" fill="#1e293b" />

    <!-- Warm, Confident, Kind Facial Expression -->
    <!-- Gentle Eyes (Calm, upright, sincere gaze) -->
    <path d="M108 104 Q113 100 118 104" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <path d="M122 104 Q127 100 132 104" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyebrows (Serene and strong) -->
    <path d="M106 98 Q113 95 119 98" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M121 98 Q127 95 134 98" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Gentle Friendly Smile (Indicating high moral character and warmth) -->
    <path d="M113 118 Q120 123 127 118" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtle rosy cheek for warmth -->
    <ellipse cx="110" cy="112" rx="4" ry="2.5" fill="#ea580c" opacity="0.4" />
    <ellipse cx="130" cy="112" rx="4" ry="2.5" fill="#ea580c" opacity="0.4" />
  </g>

  <!-- Floating Symbolic Elements of Honor & Nobility (Subtle golden sparkle/star motifs representing "高尚" character) -->
  <g>
    <!-- Sparkle 1 -->
    <path d="M60 70 Q60 80 50 80 Q60 80 60 90 Q60 80 70 80 Q60 80 60 70 Z" fill="#fbbf24" opacity="0.8" />
    <!-- Sparkle 2 -->
    <path d="M180 50 Q180 56 174 56 Q180 56 180 62 Q180 56 186 56 Q180 56 180 50 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Sparkle 3 (small) -->
    <circle cx="150" cy="55" r="2.5" fill="#f59e0b" opacity="0.7" />
    <circle cx="75" cy="105" r="2" fill="#fbbf24" opacity="0.6" />
  </g>

  <!-- Foreground Atmospheric Vignette / Frame enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" />
</svg>