<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient representing early dawn morning -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm interior lamp gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Morning sun horizon glow -->
    <linearGradient id="sunriseGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGradient)" />

  <!-- Window Scene: Early morning horizon outside -->
  <g id="window-view">
    <!-- Window Frame Backing -->
    <rect x="130" y="30" width="85" height="110" rx="4" fill="#090d16" stroke="#475569" stroke-width="3" />
    
    <!-- Sunrise Sky -->
    <clipPath id="windowClip">
      <rect x="132" y="32" width="81" height="106" rx="2" />
    </clipPath>
    <g clip-path="url(#windowClip)">
      <rect x="132" y="32" width="81" height="106" fill="#1e1b4b" />
      <!-- Dawn Horizon Glow -->
      <circle cx="172" cy="110" r="45" fill="url(#sunriseGlow)" />
      <!-- Crescent Moon fading in early dawn -->
      <path d="M 195 50 Q 185 55 190 65 Q 200 60 195 50" fill="#cbd5e1" opacity="0.8" />
      <!-- Distant City Skyline Silhouettes -->
      <path d="M 132 120 L 140 100 L 145 100 L 150 115 L 158 90 L 165 90 L 170 120 L 180 85 L 190 85 L 195 110 L 205 95 L 213 120 Z" fill="#0f172a" />
    </g>

    <!-- Window Pane Dividers -->
    <line x1="172" y1="32" x2="172" y2="138" stroke="#475569" stroke-width="2" />
    <line x1="132" y1="85" x2="213" y2="85" stroke="#475569" stroke-width="2" />
    <!-- Window Sill -->
    <rect x="126" y="138" width="97" height="6" rx="2" fill="#64748b" filter="url(#shadow)" />
    <!-- Small potted plant on window sill -->
    <path d="M 145 138 L 150 128 L 158 128 L 163 138 Z" fill="#38bdf8" />
    <path d="M 154 128 Q 150 115 142 118 Q 154 115 154 128 Z" fill="#10b981" />
    <path d="M 154 128 Q 158 112 166 116 Q 154 115 154 128 Z" fill="#059669" />
  </g>

  <!-- Interior Wall & Ambient Elements -->
  <!-- Wall clock showing early morning (e.g. 5:30) -->
  <g id="wall-clock" transform="translate(80, 45)">
    <circle cx="0" cy="0" r="14" fill="#f8fafc" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="1" fill="#1e293b" />
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="6" y2="-4" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Ambient Wall Lamp casting warm light -->
  <circle cx="35" cy="50" r="35" fill="url(#lampGlow)" />
  <path d="M 30 35 L 40 35 L 37 45 L 33 45 Z" fill="#64748b" />
  <path d="M 25 45 Q 35 38 45 45 Z" fill="#f59e0b" />

  <!-- Foreground: Travel Gear / Packed Luggage (Context for "Lên đường") -->
  <g id="luggage-pile" filter="url(#shadow)">
    <!-- Suitcase 1 -->
    <rect x="25" y="155" width="45" height="55" rx="6" fill="#3b82f6" />
    <rect x="25" y="163" width="45" height="6" fill="#1d4ed8" />
    <!-- Suitcase handle & wheels -->
    <path d="M 40 155 L 40 150 M 50 155 L 50 150 M 38 150 L 52 150" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="32" cy="213" r="3" fill="#0f172a" />
    <circle cx="63" cy="213" r="3" fill="#0f172a" />

    <!-- Duffel Bag stacked on top -->
    <path d="M 20 135 Q 20 120 40 120 Q 60 120 60 135 L 55 155 L 25 155 Z" fill="#ec4899" />
    <path d="M 30 120 Q 40 110 50 120" stroke="#fbcfe8" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Travel backpack leaning -->
    <path d="M 70 145 Q 85 140 88 175 L 75 210 L 60 200 Z" fill="#10b981" />
    <rect x="68" y="160" width="12" height="15" rx="3" fill="#047857" />
    <path d="M 72 145 C 68 135 78 130 75 145" stroke="#059669" stroke-width="3" fill="none" />
    
    <!-- Travel ticket/passport sticking out -->
    <rect x="35" y="130" width="12" height="18" rx="1" fill="#f8fafc" transform="rotate(15 35 130)" />
    <rect x="37" y="133" width="8" height="3" rx="1" fill="#ef4444" transform="rotate(15 35 130)" />
  </g>

  <!-- Characters Actively Preparing to Depart -->
  <!-- Character 1 (Standing, adjusting jacket/coat) -->
  <g id="character-left" filter="url(#shadow)">
    <!-- Legs -->
    <rect x="95" y="170" width="9" height="45" rx="4" fill="#334155" />
    <rect x="110" y="170" width="9" height="45" rx="4" fill="#334155" />
    <!-- Shoes -->
    <path d="M 90 212 L 105 212 L 105 217 Q 105 219 100 219 L 90 219 Z" fill="#0f172a" />
    <path d="M 108 212 L 123 212 L 123 219 L 113 219 Q 108 219 108 217 Z" fill="#0f172a" />

    <!-- Body / Trench Coat -->
    <path d="M 92 110 L 128 110 L 134 175 L 88 175 Z" fill="#cbd5e1" />
    <!-- Coat Lapels and Belt -->
    <path d="M 110 110 L 100 140 L 110 175" stroke="#94a3b8" stroke-width="2" fill="none" />
    <path d="M 110 110 L 120 140 L 110 175" stroke="#94a3b8" stroke-width="2" fill="none" />
    <rect x="88" y="145" width="44" height="6" rx="2" fill="#64748b" />

    <!-- Scarf -->
    <path d="M 98 98 Q 110 106 122 98 L 125 115 Q 110 120 95 115 Z" fill="#f97316" />
    <path d="M 118 110 L 122 140 L 112 140 L 114 110 Z" fill="#ea580c" />

    <!-- Head & Hair -->
    <circle cx="110" cy="82" r="16" fill="#fbcfe8" />
    <!-- Hair style (short energetic bob) -->
    <path d="M 95 82 Q 94 65 110 66 Q 126 65 125 82 Q 128 72 120 68 Q 110 64 100 68 Q 94 72 95 82 Z" fill="#1e293b" />

    <!-- Face Profile (Smiling, determined look looking toward the window/door) -->
    <circle cx="119" cy="82" r="1.5" fill="#1e293b" />
    <path d="M 121 87 Q 124 89 127 86" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arms in motion (holding coffee cup or jacket button) -->
    <path d="M 92 115 Q 78 130 85 145" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="145" r="5" fill="#fbcfe8" />
    
    <!-- Right Arm pointing towards door/luggage -->
    <path d="M 128 115 Q 142 125 138 135" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" fill="none" />
    <circle cx="138" cy="135" r="4.5" fill="#fbcfe8" />
  </g>

  <!-- Character 2 (Slightly behind, checking watch or holding coat) -->
  <g id="character-right" filter="url(#shadow)">
    <!-- Legs -->
    <path d="M 152 170 L 155 212 L 164 212 L 161 170 Z" fill="#1e293b" />
    <path d="M 170 170 L 175 212 L 184 212 L 181 170 Z" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="160" cy="214" rx="7" ry="3" fill="#0f172a" />
    <ellipse cx="180" cy="214" rx="7" ry="3" fill="#0f172a" />

    <!-- Body / Jacket -->
    <path d="M 150 115 L 188 115 L 185 175 L 150 175 Z" fill="#38bdf8" />
    <path d="M 169 115 L 169 175" stroke="#0284c7" stroke-width="2" />

    <!-- Head & Hair -->
    <circle cx="170" cy="85" r="15" fill="#fbcfe8" />
    <!-- Short male hair -->
    <path d="M 156 85 Q 158 70 172 70 Q 186 70 184 85 Q 180 75 170 75 Q 160 75 156 85 Z" fill="#334155" />

    <!-- Face profile looking forward -->
    <circle cx="178" cy="85" r="1.5" fill="#1e293b" />
    <path d="M 180 90 Q 183 92 185 89" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arm checking watch / holding strap -->
    <path d="M 185 125 Q 195 135 188 145" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none" />
    <circle cx="188" cy="145" r="4.5" fill="#fbcfe8" />
  </g>

  <!-- Interior Floor Line -->
  <path d="M 0 215 L 240 215" stroke="#334155" stroke-width="3" />
  <rect x="0" y="217" width="240" height="23" fill="#090d16" />

  <!-- Dynamic Motion/Action subtle elements (Ready to depart vibe) -->
  <g opacity="0.6">
    <!-- Tiny sparkling light rays near the window suggesting early dawn energy -->
    <path d="M 140 50 L 144 54 M 144 50 L 140 54" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 200 40 L 204 44 M 204 40 L 200 44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  </g>

</svg>