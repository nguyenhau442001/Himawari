<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Classroom/Office Environment -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  <rect x="30" y="170" width="180" height="10" fill="#475569" rx="2"/>
  
  <!-- Person being mocked (The one with the "flaw" - e.g., tripping or holding a broken paper) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L15 80 L5 120 M30 40 L35 80 L45 120" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <rect x="5" y="40" width="30" height="40" fill="#38bdf8" rx="5"/>
    <path d="M10 50 L25 50 M10 60 L20 60" stroke="#0f172a" stroke-width="2"/>
    <path d="M15 10 L25 10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Person mocking (The one pointing/laughing) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M20 35 L20 80 L10 120 M20 35 L20 80 L30 120" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 50 L40 40" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 10 L15 15 M25 10 L20 15" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 25 Q20 30 28 25" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Warning Gesture (The "Don't" hand) -->
  <g transform="translate(110, 130)">
    <circle cx="0" cy="0" r="12" fill="#ec4899" opacity="0.8"/>
    <path d="M-5 -5 L5 5 M-5 5 L5 -5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="40" r="3" fill="#f59e0b"/>
  <circle cx="40" cy="30" r="2" fill="#10b981"/>
</svg>