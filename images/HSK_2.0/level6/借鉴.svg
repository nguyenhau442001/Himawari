<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <path d="M0 180 Q120 170 240 180 V240 H0 Z" fill="#1e293b"/>
  
  <!-- Desk/Work Surface -->
  <path d="M20 190 L220 190 L230 210 L10 210 Z" fill="#334155"/>
  
  <!-- The "Experience" - A Glowing Architectural Model -->
  <g transform="translate(105, 145)">
    <!-- Base of model -->
    <rect x="0" y="35" width="50" height="10" fill="#475569"/>
    <!-- Glowing Buildings (The successful project being studied) -->
    <rect x="5" y="10" width="12" height="25" fill="#fbbf24" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="0" width="10" height="35" fill="#f59e0b" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="33" y="15" width="12" height="20" fill="#fbbf24" opacity="0.9"/>
    <!-- Light Glow Effect -->
    <circle cx="25" cy="20" r="30" fill="url(#glowGradient)" opacity="0.3"/>
  </g>
  
  <defs>
    <radialGradient id="glowGradient">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Senior Professional (The "Other" providing experience) -->
  <g transform="translate(160, 90)">
    <!-- Body -->
    <path d="M10 100 Q30 60 50 100" fill="#475569"/>
    <!-- Head -->
    <circle cx="30" cy="55" r="12" fill="#fde68a"/>
    <!-- Hair (Grey/Senior) -->
    <path d="M18 50 Q30 35 42 50 Q40 45 20 45 Z" fill="#94a3b8"/>
    <!-- Arm pointing to the model -->
    <path d="M20 75 L-15 70" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Junior Professional (The Subject learning/referencing) -->
  <g transform="translate(30, 100)">
    <!-- Body -->
    <path d="M10 100 Q30 60 50 100" fill="#0d9488"/>
    <!-- Head -->
    <circle cx="30" cy="55" r="12" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M18 50 Q30 35 42 50 Q40 42 20 42 Z" fill="#334155"/>
    <!-- Arm holding notebook -->
    <path d="M40 80 L55 75" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <!-- Notebook -->
    <rect x="55" y="65" width="18" height="22" rx="2" fill="#f8fafc" transform="rotate(10, 55, 65)"/>
    <path d="M58 72 L68 70 M59 76 L69 74 M60 80 L70 78" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Pen in hand -->
    <path d="M52 72 L58 68" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Environmental Details -->
  <!-- Blueprints on the table -->
  <rect x="70" y="195" width="30" height="10" rx="1" fill="#38bdf8" opacity="0.6" transform="rotate(-5, 70, 195)"/>
  <rect x="150" y="192" width="25" height="12" rx="1" fill="#38bdf8" opacity="0.4" transform="rotate(15, 150, 192)"/>
  
  <!-- Window/Background Light -->
  <rect x="180" y="40" width="30" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M180 60 L210 60 M195 40 L195 80" stroke="#334155" stroke-width="1"/>
  
  <!-- Floating particles of "inspiration" -->
  <circle cx="110" cy="120" r="1.5" fill="#fbbf24">
    <animate attributeName="cy" values="120;110;120" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="140" cy="135" r="1" fill="#38bdf8">
    <animate attributeName="cy" values="135;125;135" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>