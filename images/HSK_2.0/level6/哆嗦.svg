<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="frosty-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Mug Steam / Warmth Gradient -->
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Shaking Motion Effect Filters or Symbols -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: Room Interior & Winter Night -->
  <!-- Wall Base -->
  <rect x="0" y="0" width="240" height="180" fill="#111827" />
  
  <!-- Wooden Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" />
  <line x1="0" y1="195" x2="240" y2="195" stroke="#1e293b" stroke-width="2" />
  <line x1="0" y1="215" x2="240" y2="215" stroke="#1e293b" stroke-width="2" />

  <!-- Window with Snow falling outside -->
  <g transform="translate(150, 20)">
    <!-- Window Frame Outer -->
    <rect x="0" y="0" width="70" height="110" rx="4" fill="#334155" />
    <!-- Window Glass -->
    <rect x="6" y="6" width="58" height="98" fill="url(#frosty-glow)" />
    <!-- Window Panes -->
    <line x1="35" y1="6" x2="35" y2="104" stroke="#334155" stroke-width="3" />
    <line x1="6" y1="55" x2="64" y2="55" stroke="#334155" stroke-width="3" />
    
    <!-- Snowflakes outside window -->
    <circle cx="18" cy="20" r="1.5" fill="#e2e8f0" opacity="0.8" />
    <circle cx="50" cy="35" r="2" fill="#e2e8f0" opacity="0.9" />
    <circle cx="25" cy="75" r="1.5" fill="#e2e8f0" opacity="0.7" />
    <circle cx="45" cy="90" r="2" fill="#e2e8f0" opacity="0.8" />

    <!-- Frost Details on Window Corners -->
    <path d="M6 6 L22 6 L6 22 Z" fill="#93c5fd" opacity="0.4" />
    <path d="M64 6 L48 6 L64 22 Z" fill="#93c5fd" opacity="0.4" />
  </g>

  <!-- Bookshelf / Prop in Background -->
  <rect x="20" y="40" width="40" height="80" fill="#1e293b" rx="2" />
  <line x1="20" y1="70" x2="60" y2="70" stroke="#0f172a" stroke-width="3" />
  <line x1="20" y1="100" x2="60" y2="100" stroke="#0f172a" stroke-width="3" />
  <!-- Books -->
  <rect x="26" y="52" width="8" height="18" fill="#3b82f6" rx="1" />
  <rect x="36" y="48" width="10" height="22" fill="#ef4444" rx="1" />
  <rect x="26" y="80" width="12" height="20" fill="#10b981" rx="1" />

  <!-- FLOOR PROP: Small Wooden Stool / Table -->
  <g transform="translate(45, 160)">
    <ellipse cx="25" cy="10" rx="25" ry="6" fill="#334155" />
    <rect x="8" y="14" width="4" height="30" fill="#1e293b" />
    <rect x="38" y="14" width="4" height="30" fill="#1e293b" />
    <!-- Hot Mug on Stool -->
    <rect x="20" y="2" width="10" height="10" rx="2" fill="url(#mug-grad)" />
    <!-- Steam rising from mug -->
    <path d="M23 -2 Q25 -6 23 -10" stroke="#93c5fd" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round" />
    <path d="M28 -1 Q26 -5 28 -9" stroke="#93c5fd" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: Person freezing and shaking (哆嗦) -->
  <g transform="translate(95, 95)">
    
    <!-- Shaking Motion Lines (Left & Right blur/vibration indicator) -->
    <path d="M-12 30 Q-16 45 -12 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M88 30 Q92 45 88 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M-8 85 Q-14 95 -8 105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M84 85 Q90 95 84 105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Lower Body / Crossed Legs sitting on floor -->
    <g transform="translate(38, 95)">
      <ellipse cx="0" cy="20" rx="22" ry="12" fill="#3b82f6" />
      <!-- Shoes / Feet tucked -->
      <circle cx="-16" cy="24" r="6" fill="#1e293b" />
      <circle cx="16" cy="24" r="6" fill="#1e293b" />
    </g>

    <!-- Thick Puffy Winter Jacket (Huddled up) -->
    <!-- Jacket Body -->
    <path d="M15 40 Q38 32 61 40 L70 95 Q38 108 6 95 Z" fill="#0284c7" />
    <!-- Jacket Puff Lines -->
    <path d="M22 50 Q38 46 54 52" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M17 65 Q38 60 59 67" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M13 80 Q38 75 63 82" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Wrapped Cozy Scarf (Yellow/Orange accent for warmth contrast) -->
    <path d="M24 33 Q38 42 52 33 L55 45 Q38 52 21 45 Z" fill="#f59e0b" />
    <!-- Scarf Tails hanging -->
    <path d="M48 42 Q56 60 52 75 L42 73 Q46 55 42 42 Z" fill="#d97706" />

    <!-- Crossed Arms hugging tightly to stop shaking -->
    <!-- Left Arm -->
    <path d="M20 45 Q38 60 52 50" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Right Arm -->
    <path d="M56 45 Q38 65 24 55" stroke="#0369a1" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hands tucked in sleeves/shoulders -->
    <circle cx="21" cy="53" r="6" fill="#fbcfe8" />
    <circle cx="55" cy="48" r="6" fill="#fbcfe8" />

    <!-- Head & Face (Expressing intense cold / shivering eyes squeezed, blue nose) -->
    <g transform="translate(38, 20)">
      <!-- Neck -->
      <rect x="-5" y="10" width="10" height="10" fill="#fbcfe8" />

      <!-- Head Circle -->
      <circle cx="0" cy="0" r="18" fill="#fbcfe8" />

      <!-- Winter Beanie Hat -->
      <path d="M-18 -2 C-18 -18 18 -18 18 -2 C18 5 14 10 0 10 C-14 10 -18 5 -18 -2 Z" fill="#f43f5e" />
      <!-- Beanie Pom-Pom -->
      <circle cx="0" cy="-20" r="5" fill="#fb7185" />
      <!-- Beanie Brim Fold -->
      <path d="M-18.5 -3 Q0 1 18.5 -3 L18.5 3 Q0 7 -18.5 3 Z" fill="#e11d48" />

      <!-- Face Expressions - Shivering / Teeth Chattering -->
      <!-- Squeezed / Shivering Eyes (> < style or tight curves) -->
      <path d="M-9 -3 L-4 -1 M-9 -1 L-4 -3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M4 -3 L9 -1 M4 -1 L9 -3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

      <!-- Cold Blue/Pink Nose -->
      <ellipse cx="0" cy="3" rx="3" ry="2" fill="#38bdf8" />

      <!-- Shivering Mouth / Chattering Teeth (Wavy line) -->
      <path d="M-4 8 Q0 6 4 8" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- Blue Chilly Face Tones / Frosty Cheeks -->
      <circle cx="-10" cy="4" r="3" fill="#38bdf8" opacity="0.4" />
      <circle cx="10" cy="4" r="3" fill="#38bdf8" opacity="0.4" />
    </g>
  </g>

  <!-- Chilling Atmosphere Elements (Floating Frost / Shivering Sparkles) -->
  <g fill="#93c5fd" opacity="0.8">
    <circle cx="85" cy="70" r="2" />
    <circle cx="160" cy="140" r="1.5" />
    <circle cx="75" cy="180" r="2" />
    <path d="M70 120 L73 123 L70 126 L67 123 Z" opacity="0.6" />
    <path d="M165 80 L167 82 L165 84 L163 82 Z" opacity="0.6" />
  </g>
</svg>