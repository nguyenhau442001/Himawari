<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/particles representing education and mission context -->
  <g opacity="0.3">
    <circle cx="120" cy="120" r="70" fill="none" stroke="#3A4454" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="90" fill="none" stroke="#3A4454" stroke-width="0.5" opacity="0.5"/>
    <!-- Floating particles/stars -->
    <circle cx="65" cy="75" r="1.5" fill="#F59E0B"/>
    <circle cx="175" cy="85" r="2" fill="#3B82F6"/>
    <circle cx="160" cy="165" r="1.5" fill="#F59E0B"/>
    <circle cx="80" cy="155" r="2" fill="#3B82F6"/>
  </g>

  <!-- Central Physical Object: The "Mission" Scroll/Scroll-Badge with Education Torch/Spark motif -->
  <g transform="translate(120, 120)">
    
    <!-- Outer glowing aura for "Sứ mệnh quan trọng" (Important mission) -->
    <circle cx="0" cy="0" r="54" fill="#F59E0B" opacity="0.12"/>
    <circle cx="0" cy="0" r="44" fill="#1E293B" stroke="#334155" stroke-width="2"/>

    <!-- Scroll / Document Base (Representing the authoritative mandate/mission) -->
    <path d="M-22,-28 L22,-28 C26,-28 28,-26 28,-22 L28,22 C28,26 26,28 22,28 L-22,28 C-26,28 -28,26 -28,22 L-28,-22 C-28,-26 -26,-28 -22,-28 Z" fill="#0F172A" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Scroll decorative inner lines (document details) -->
    <line x1="-16" y1="-14" x2="16" y2="-14" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="-4" x2="16" y2="-4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="6" x2="6" y2="6" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

    <!-- Central Focal Point: Education Torch / Responsibility Emblem (Golden flame representing the mission of education) -->
    <g transform="translate(0, 10)">
      <!-- Torch handle -->
      <path d="M-5,16 L5,16 L4,30 L-4,30 Z" fill="#475569"/>
      <rect x="-6" y="14" width="12" height="3" rx="1.5" fill="#64748B"/>
      
      <!-- Flame core (Glowing Gold/Orange) -->
      <path d="M0,12 C-7,12 -10,3 -4,-2 C-8,-8 -2,-16 0,-18 C2,-16 8,-8 4,-2 C10,3 7,12 0,12 Z" fill="#F59E0B"/>
      <!-- Inner bright flame -->
      <path d="M0,8 C-3,8 -5,3 -2,0 C-4,-4 -1,-9 0,-10 C1,-9 4,-4 2,0 C5,3 3,8 0,8 Z" fill="#FBBF24"/>
    </g>

    <!-- Glowing seal/badge overlaying the scroll to emphasize official/important mission -->
    <circle cx="22" cy="18" r="10" fill="#EF4444" stroke="#1E293B" stroke-width="2"/>
    <path d="M18,18 L21,21 L27,15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accent frame corners for sleek modern UI look -->
  <path d="M 20 36 L 20 20 L 36 20" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 220 36 L 220 20 L 204 20" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 20 204 L 20 220 L 36 220" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 220 204 L 220 220 L 204 220" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>