<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 15)">
    <!-- Road / Infrastructure Base -->
    <path d="M 40,150 L 200,150 L 190,195 L 50,195 Z" fill="#2D333B"/>
    <path d="M 120,150 L 120,195" stroke="#4F5D73" stroke-width="3" stroke-dasharray="6,6"/>
    
    <!-- Traffic Signal Pole (Leaning/Frozen) -->
    <rect x="75" y="70" width="8" height="85" fill="#4F5D73" rx="2" transform="rotate(8 75 155)"/>
    <rect x="63" y="60" width="32" height="65" rx="6" fill="#111518" transform="rotate(8 75 155)"/>
    
    <!-- Traffic Lights: All RED (System Paralysis) -->
    <circle cx="79" cy="78" r="7" fill="#FF5252" filter="drop-shadow(0px 0px 6px #FF5252)"/>
    <circle cx="79" cy="95" r="7" fill="#363C46"/>
    <circle cx="79" cy="112" r="7" fill="#363C46"/>

    <!-- Snowdrifts / Paralysis Factor -->
    <path d="M 30,195 C 45,180 65,185 85,195 C 105,180 125,185 145,195 C 165,180 185,185 210,195 Z" fill="#E2E8F0" opacity="0.9"/>
    
    <!-- Central Impeded Vehicle (Car caught in gridlock) -->
    <g transform="translate(110, 130)">
      <!-- Car Body -->
      <path d="M 15,30 L 35,15 L 65,15 L 85,30 L 95,45 L 5,45 Z" fill="#FF9800"/>
      <!-- Car Roof -->
      <path d="M 38,15 L 50,5 L 70,5 L 78,15 Z" fill="#E68A00"/>
      <!-- Windows -->
      <path d="M 40,14 L 49,7 L 60,7 L 60,14 Z" fill="#1A1D24"/>
      <path d="M 62,14 L 62,7 L 69,7 L 76,14 Z" fill="#1A1D24"/>
      <!-- Wheels -->
      <circle cx="28" cy="45" r="10" fill="#111518"/>
      <circle cx="28" cy="45" r="4" fill="#4F5D73"/>
      <circle cx="72" cy="45" r="10" fill="#111518"/>
      <circle cx="72" cy="45" r="4" fill="#4F5D73"/>
      <!-- Snow on Car -->
      <path d="M 36,16 L 50,4 L 72,4 L 80,16 Q 58,12 36,16 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Falling Snowflakes (Systemic freeze) -->
    <g fill="#FFFFFF" opacity="0.7">
      <circle cx="50" cy="50" r="2.5"/>
      <circle cx="160" cy="40" r="1.5"/>
      <circle cx="195" cy="85" r="3"/>
      <circle cx="35" cy="100" r="2"/>
      <circle cx="100" cy="35" r="2"/>
      <circle cx="210" cy="130" r="1.5"/>
      <circle cx="170" cy="105" r="2.5"/>
      
      <!-- Snowflake vectors -->
      <path d="M 85,30 L 95,30 M 90,25 L 90,35" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M 140,70 L 148,70 M 144,66 L 144,74" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M 60,130 L 66,130 M 63,127 L 63,133" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M 180,160 L 186,160 M 183,157 L 183,163" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <!-- Hazard / System Halt Indicator Overlay -->
    <g transform="translate(120, 85)">
      <circle cx="0" cy="0" r="18" fill="#1A1D24" stroke="#FF5252" stroke-width="3"/>
      <path d="M -8,-8 L 8,8 M 8,-8 L -8,8" stroke="#FF5252" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>