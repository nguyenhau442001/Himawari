<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Concept: Responding to a call/event -->
  <!-- The "Call" (Source) -->
  <g transform="translate(60, 80)">
    <path d="M20 0 L60 0 L50 20 L30 20 Z" fill="#FFB84D"/>
    <path d="M35 20 L35 50" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35" cy="60" r="8" fill="#FFB84D"/>
    <!-- Motion lines representing the call/signal -->
    <path d="M70 10 Q90 30 70 50" fill="none" stroke="#FFB84D" stroke-width="3" stroke-dasharray="4 4"/>
  </g>

  <!-- The "Response" (Action) -->
  <g transform="translate(120, 80)">
    <!-- Character body -->
    <path d="M40 120 L40 80 Q40 60 60 60 L80 60 Q100 60 100 80 L100 120" fill="#4D96FF"/>
    <circle cx="70" cy="45" r="15" fill="#E0E0E0"/>
    
    <!-- Action: Raising hand to respond -->
    <path d="M100 70 L120 40" stroke="#E0E0E0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="125" cy="35" r="8" fill="#E0E0E0"/>
    
    <!-- Motion lines indicating active participation -->
    <path d="M110 30 L130 10" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
    <path d="M135 25 L155 5" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ground line -->
  <path d="M30 200 L210 200" stroke="#333842" stroke-width="4" stroke-linecap="round"/>
</svg>