<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines indicating upward, energetic movement -->
  <path d="M100 180 Q 110 150 120 120 M140 180 Q 130 150 120 120" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.6"/>
  
  <!-- Character 1: Enthusiastic participant raising hand -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="12" fill="#FFB84D"/>
    <path d="M20 32 L20 70 M20 45 L5 60 M20 45 L35 60 M20 70 L10 100 M20 70 L30 100" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 35 L40 10" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2: Enthusiastic participant jumping/reaching -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="12" fill="#FFB84D"/>
    <path d="M20 32 L20 60 M20 45 L5 35 M20 45 L35 35 M20 60 L10 90 M20 60 L30 90" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Ground line -->
  <path d="M40 190 L200 190" stroke="#3E4451" stroke-width="4" stroke-linecap="round"/>
</svg>