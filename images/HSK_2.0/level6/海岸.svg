<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Beach/Sand Gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Sunset Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Sun & Atmosphere -->
  <circle cx="160" cy="90" r="45" fill="url(#sunGlow)"/>
  <circle cx="160" cy="90" r="18" fill="#fef08a"/>

  <!-- Distant Mountains/Cliffs -->
  <path d="M0 125 Q 40 110, 80 120 T 160 115 L 240 125 L 240 140 L 0 140 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Ocean Layer -->
  <rect x="0" y="130" width="240" height="35" fill="url(#oceanGrad)"/>
  <!-- Waves -->
  <path d="M0 135 Q 20 130, 40 135 T 80 135 T 120 135 T 160 135 T 200 135 T 240 135 L 240 165 L 0 165 Z" fill="#0284c7" opacity="0.5"/>
  <path d="M0 142 Q 30 138, 60 142 T 120 142 T 180 142 T 240 142 L 240 165 L 0 165 Z" fill="#0369a1" opacity="0.8"/>
  <path d="M0 152 Q 25 149, 50 152 T 100 152 T 150 152 T 200 152 T 240 152 L 240 165 L 0 165 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- Coastline / Sandy Shore (The '海岸' / hǎiàn) -->
  <path d="M0 160 C 80 155, 140 165, 240 155 L 240 240 L 0 240 Z" fill="url(#sandGrad)"/>

  <!-- Wet sand reflection strip -->
  <path d="M0 160 C 80 155, 140 165, 240 155 L 240 168 C 140 178, 80 168, 0 173 Z" fill="#92400e" opacity="0.6"/>

  <!-- Sea Oats / Coastal Vegetation (Left foreground context) -->
  <path d="M15 240 Q 12 210, 5 195" stroke="#042f2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M15 220 Q 22 205, 28 190" stroke="#042f2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M22 240 Q 25 215, 35 200" stroke="#065f46" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Leaf dots -->
  <circle cx="5" cy="195" r="2.5" fill="#38bdf8"/>
  <circle cx="28" cy="190" r="2" fill="#38bdf8"/>
  <circle cx="35" cy="200" r="2.5" fill="#fde047"/>

  <!-- Seagulls in the sky -->
  <path d="M40 70 Q 45 65, 50 72 Q 55 65, 60 70" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M190 50 Q 194 46, 198 52 Q 202 46, 206 50" stroke="#cbd5e1" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- CHARACTER 1: Person Walking (Left/Leading) -->
  <g transform="translate(85, 155)">
    <!-- Shadow -->
    <ellipse cx="5" cy="32" rx="10" ry="3" fill="#451a03" opacity="0.5"/>
    <!-- Legs -->
    <line x1="2" y1="18" x2="-4" y2="30" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="14" y2="28" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Shoes -->
    <rect x="-7" y="28" width="5" height="3" rx="1.5" fill="#f8fafc"/>
    <rect x="12" y="26" width="6" height="3" rx="1.5" fill="#f8fafc"/>
    <!-- Body / Jacket -->
    <path d="M-2 5 L10 5 L12 20 L-2 20 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="5" cy="-2" r="6" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M-1 -5 C 2 -9, 8 -9, 11 -4 C 8 -3, 3 -4, -1 -5 Z" fill="#451a03"/>
    <!-- Arm (swinging) -->
    <path d="M8 7 L16 16" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    <!-- Arm (holding hand or back) -->
    <path d="M-1 7 L-6 15" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 2: Person Walking (Right/Following) -->
  <g transform="translate(118, 153)">
    <!-- Shadow -->
    <ellipse cx="5" cy="34" rx="11" ry="3.5" fill="#451a03" opacity="0.5"/>
    <!-- Legs -->
    <line x1="2" y1="18" x2="8" y2="32" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="0" y2="30" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Shoes -->
    <rect x="6" y="30" width="6" height="3" rx="1.5" fill="#0f172a"/>
    <rect x="-3" y="28" width="6" height="3" rx="1.5" fill="#0f172a"/>
    <!-- Body / Sweater -->
    <path d="M-1 4 L12 4 L14 20 L-1 20 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="6" cy="-3" r="6.5" fill="#fcd34d"/>
    <!-- Hair/Cap -->
    <path d="M-1 -6 C 3 -10, 11 -8, 13 -3 C 8 -3, 2 -5, -1 -6 Z" fill="#0f172a"/>
    <!-- Arms -->
    <path d="M10 7 L18 14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M2 7 L-3 14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Little dog walking alongside them (Adds rich real-world storytelling) -->
  <g transform="translate(152, 175)">
    <!-- Dog Shadow -->
    <ellipse cx="4" cy="14" rx="7" ry="2" fill="#451a03" opacity="0.4"/>
    <!-- Dog Body -->
    <ellipse cx="5" cy="8" rx="9" ry="5" fill="#d97706"/>
    <!-- Dog Head -->
    <circle cx="13" cy="5" r="4.5" fill="#d97706"/>
    <!-- Dog Ear -->
    <path d="M12 2 Q 10 -2, 8 2" fill="#b45309"/>
    <!-- Dog Snout -->
    <circle cx="16" cy="6" r="1.5" fill="#78350f"/>
    <!-- Legs -->
    <line x1="0" y1="12" x2="-1" y2="17" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="12" x2="3" y2="17" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="12" x2="7" y2="17" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="12" x2="12" y2="17" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Tail up -->
    <path d="M-3 6 Q -7 2, -5 -2" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Foreground details: Shells on the beach -->
  <g transform="translate(60, 210)">
    <!-- Conch shell -->
    <path d="M0 0 C 4 -4, 8 -2, 10 2 C 8 5, 2 6, 0 0 Z" fill="#f472b6"/>
    <path d="M3 1 C 5 -1, 7 0, 8 2" stroke="#db2777" stroke-width="1" fill="none"/>
  </g>
  <g transform="translate(195, 195)">
    <!-- Starfish -->
    <path d="M5 0 L6.5 3.5 L10 4 L7.5 6.5 L8.5 10 L5 8 L1.5 10 L2.5 6.5 L0 4 L3.5 3.5 Z" fill="#fb7185"/>
  </g>
  <g transform="translate(110, 225)">
    <!-- Clam shell -->
    <path d="M0 4 Q 4 -2, 8 4 Q 4 6, 0 4 Z" fill="#fed7aa"/>
    <line x1="4" y1="0" x2="4" y2="5" stroke="#fdba74" stroke-width="1"/>
  </g>
</svg>