<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light -->
    <radialGradient id="desk-light" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- UI Accent Gradients -->
    <linearGradient id="gain-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="loss-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>

    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="120" r="120" fill="url(#desk-light)" />

  <!-- Background Environment: Window & Cityscape Silhouette -->
  <g opacity="0.4">
    <!-- Window Frame -->
    <rect x="150" y="25" width="65" height="85" rx="4" fill="none" stroke="#475569" stroke-width="2" />
    <line x1="182" y1="25" x2="182" y2="110" stroke="#475569" stroke-width="1.5" />
    <line x1="150" y1="67" x2="215" y2="67" stroke="#475569" stroke-width="1.5" />
    <!-- City lights outside -->
    <rect x="158" y="45" width="6" height="8" fill="#fbbf24" opacity="0.6" />
    <rect x="170" y="75" width="6" height="12" fill="#38bdf8" opacity="0.6" />
    <rect x="195" y="50" width="8" height="15" fill="#fbbf24" opacity="0.4" />

    <!-- Bookshelf / Office Props -->
    <rect x="25" y="30" width="40" height="6" rx="2" fill="#334155" />
    <path d="M32 30 L32 18 L38 18 L38 30 Z" fill="#38bdf8" opacity="0.7" />
    <path d="M40 30 L40 14 L47 14 L47 30 Z" fill="#ec4899" opacity="0.7" />
    <path d="M49 30 L49 20 L55 20 L55 30 Z" fill="#10b981" opacity="0.7" />
  </g>

  <!-- Desk Surface -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="url(#wood-desk)" />
  <rect x="0" y="195" width="240" height="4" fill="#475569" opacity="0.5" />

  <!-- Central Visual Metaphor: Modern Balanced Scale (衡量 - Weighing pros and cons) -->
  <g transform="translate(120, 95)">
    <!-- Scale Stand Base -->
    <path d="M-15 85 L15 85 L10 75 L-10 75 Z" fill="#64748b" />
    <rect x="-3" y="10" width="6" height="65" rx="2" fill="#94a3b8" />
    
    <!-- Scale Top Finial -->
    <circle cx="0" cy="10" r="6" fill="#cbd5e1" />

    <!-- Scale Beam (Tilted slightly to show active pondering/weighing) -->
    <g transform="rotate(-6)">
      <!-- Main horizontal bar -->
      <rect x="-65" y="4" width="130" height="5" rx="2.5" fill="#e2e8f0" />
      <circle cx="0" cy="6.5" r="3" fill="#0f172a" />

      <!-- Left Pan (Loss / Risky choice - Reddish accent) -->
      <g transform="translate(-65, 4)">
        <line x1="0" y1="0" x2="-15" y2="35" stroke="#94a3b8" stroke-width="1.5" />
        <line x1="0" y1="0" x2="15" y2="35" stroke="#94a3b8" stroke-width="1.5" />
        <path d="M-22 35 C-22 43, 22 43, 22 35 Z" fill="url(#loss-grad)" />
        <!-- Minus icon on left pan representing 'Loss' -->
        <rect x="-7" y="37" width="14" height="3" rx="1.5" fill="#ffffff" />
      </g>

      <!-- Right Pan (Gain / Beneficial choice - Greenish accent) -->
      <g transform="translate(65, 4)">
        <line x1="0" y1="0" x2="-15" y2="28" stroke="#94a3b8" stroke-width="1.5" />
        <line x1="0" y1="0" x2="15" y2="28" stroke="#94a3b8" stroke-width="1.5" />
        <path d="M-22 28 C-22 36, 22 36, 22 28 Z" fill="url(#gain-grad)" />
        <!-- Plus icon on right pan representing 'Gain' -->
        <rect x="-7" y="30" width="14" height="3" rx="1.5" fill="#ffffff" />
        <rect x="-1.5" y="25.5" width="3" height="12" rx="1.5" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Character: Thoughtful Professional Pondering (衡量) -->
  <g transform="translate(55, 110)">
    <!-- Body / Torso -->
    <path d="M15 85 C15 65, 30 55, 45 55 C60 55, 75 65, 75 85 Z" fill="#38bdf8" />
    <!-- Collar / Shirt Detail -->
    <polygon points="45,55 38,68 52,68" fill="#f8fafc" />

    <!-- Neck -->
    <rect x="40" y="44" width="10" height="14" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="45" cy="30" r="18" fill="#fcd34d" />

    <!-- Hair (Stylish dark slate) -->
    <path d="M28 30 C28 15, 62 15, 62 30 C62 32, 59 28, 55 24 C50 18, 40 18, 35 24 C31 28, 28 30, 28 30 Z" fill="#334155" />

    <!-- Thoughtful Face Profile & Expression -->
    <!-- Eyebrow furrowed in concentration -->
    <line x1="38" y1="26" x2="45" y2="28" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <!-- Eye (Focused, looking up at the scale) -->
    <circle cx="43" cy="32" r="2" fill="#1e293b" />
    <!-- Gentle contemplative mouth -->
    <path d="M42 39 Q46 41 50 38" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

    <!-- Hand on Chin (Classic 'Thinking/Weighing options' pose) -->
    <path d="M35 50 C30 45, 38 38, 43 40" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
    <circle cx="43" cy="39" r="5" fill="#f59e0b" />
  </g>

  <!-- Secondary Context Props on Desk: Documents / Decision Planning -->
  <g transform="translate(130, 165)">
    <!-- Document 1 (Rotated blueprint/checklist) -->
    <g transform="rotate(-12)">
      <rect x="0" y="0" width="45" height="30" rx="3" fill="#f8fafc" />
      <line x1="6" y1="8" x2="25" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="14" x2="35" y2="14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="20" x2="18" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <!-- Checkbox active -->
      <rect x="33" y="18" width="6" height="6" rx="1" fill="#10b981" />
    </g>
    
    <!-- Document 2 (Underneath) -->
    <g transform="rotate(8) translate(25, 5)">
      <rect x="0" y="0" width="40" height="26" rx="3" fill="#e2e8f0" />
      <line x1="6" y1="8" x2="30" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="14" x2="22" y2="14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Coffee Mug (Warm drink for late-night planning) -->
    <g transform="translate(-35, -5)">
      <rect x="0" y="5" width="16" height="20" rx="3" fill="#fb923c" />
      <path d="M16 9 C21 9, 21 19, 16 19" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />
      <!-- Steam swirls -->
      <path d="M5 0 Q8 -4, 5 -8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
      <path d="M11 -2 Q14 -6, 11 -10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>

  <!-- Ambient Glowing Particles representing 'Decision / Ideas' -->
  <circle cx="95" cy="70" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="145" cy="55" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="130" cy="130" r="1.5" fill="#34d399" opacity="0.9" />
  <circle cx="65" cy="140" r="2.5" fill="#fbbf24" opacity="0.5" />
</svg>