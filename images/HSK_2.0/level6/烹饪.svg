<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Kitchen Light Glow -->
    <radialGradient id="kitchenLight" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Cabinet/Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Copper Pan Gradient -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Character Skin -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#kitchenLight)"/>

  <!-- Kitchen Background Elements -->
  <!-- Upper Cabinet -->
  <rect x="20" y="16" width="200" height="40" rx="4" fill="url(#wallGrad)" opacity="0.6"/>
  <line x1="120" y1="16" x2="120" y2="56" stroke="#0f172a" stroke-width="2" opacity="0.4"/>
  <circle cx="110" cy="36" r="3" fill="#64748b"/>
  <circle cx="130" cy="36" r="3" fill="#64748b"/>

  <!-- Floating Recipe/Notes Shelf -->
  <rect x="150" y="75" width="65" height="6" rx="2" fill="#475569"/>
  <!-- Recipe Book on Shelf -->
  <path d="M165 57 L165 75 L200 75 L200 57 Z" fill="#ec4899"/>
  <path d="M168 60 L197 60 L197 72 L168 72 Z" fill="#fbcfe8"/>
  <path d="M170 63 L195 63" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>
  <path d="M170 67 L188 67" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>

  <!-- Backsplash Tile Grid Lines -->
  <g stroke="#475569" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="96" x2="240" y2="96"/>
    <line x1="0" y1="126" x2="240" y2="126"/>
    <line x1="60" y1="56" x2="60" y2="156"/>
    <line x1="120" y1="56" x2="120" y2="156"/>
    <line x1="180" y1="56" x2="180" y2="156"/>
  </g>

  <!-- Hanging Utensils Rail -->
  <line x1="25" y1="68" x2="95" y2="68" stroke="#64748b" stroke-width="2"/>
  <path d="M40 68 L40 82 M60 68 L60 85 M80 68 L80 78" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Kitchen Countertop -->
  <rect x="0" y="156" width="240" height="84" fill="#0f172a"/>
  <rect x="0" y="156" width="240" height="10" fill="#334155"/>
  <rect x="10" y="166" width="220" height="64" fill="#1e293b" rx="2"/>

  <!-- Cooking Station & Props -->
  <!-- Cutting Board -->
  <rect x="18" y="176" width="55" height="38" rx="6" fill="#b45309" filter="url(#shadow)"/>
  <rect x="22" y="180" width="47" height="30" rx="4" fill="#d97706"/>
  <circle cx="28" cy="195" r="3" fill="#92400e"/>

  <!-- Fresh Ingredients on Board (Carrot & Mushroom) -->
  <path d="M35 195 Q 45 190 55 198" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M42 205 Q 48 200 52 207" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="32" cy="204" rx="4" ry="3" fill="#e2e8f0"/>
  <path d="M32 201 L32 207" stroke="#64748b" stroke-width="1.5"/>

  <!-- Chef's Knife -->
  <path d="M60 170 L72 173 L68 185 L58 178 Z" fill="#94a3b8" filter="url(#shadow)"/>
  <path d="M57 178 L60 180 L55 186 L52 184 Z" fill="#78350f"/>

  <!-- Hot Pan with Flambe / Steam effect -->
  <path d="M125 180 C125 200 175 200 175 180 Z" fill="url(#copper)" filter="url(#shadow)"/>
  <path d="M172 184 C190 184 195 178 190 172" stroke="#b45309" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Pan Rim -->
  <ellipse cx="150" cy="180" rx="26" ry="6" fill="#fb923c"/>
  <!-- Delicious Food Inside Pan -->
  <ellipse cx="150" cy="181" rx="22" ry="4" fill="#7c2d12"/>
  <circle cx="140" cy="180" r="3" fill="#f97316"/>
  <circle cx="155" cy="182" r="2.5" fill="#10b981"/>
  <circle cx="162" cy="180" r="2" fill="#facc15"/>

  <!-- Dynamic Steam / Culinary Aroma Waves -->
  <path d="M142 165 C 138 155, 150 145, 142 135" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M158 162 C 162 152, 150 142, 158 132" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M150 168 C 145 158, 155 150, 148 138" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- MAIN CHARACTER: Expert Female Chef / Home Cook -->
  <g id="character" filter="url(#shadow)">
    <!-- Body / Torso with Apron -->
    <!-- Chef Jacket (White) -->
    <path d="M85 140 L125 140 L135 220 L75 220 Z" fill="#f8fafc"/>
    <!-- Double-breasted jacket buttons -->
    <circle cx="102" cy="165" r="2" fill="#334155"/>
    <circle cx="112" cy="165" r="2" fill="#334155"/>
    <circle cx="104" cy="185" r="2" fill="#334155"/>
    <circle cx="114" cy="185" r="2" fill="#334155"/>
    
    <!-- Smart Apron (Teal/Emerald Accent) -->
    <path d="M92 155 L118 155 L122 220 L88 220 Z" fill="#0d9488"/>
    <path d="M105 155 L95 180 L115 180 Z" fill="#14b8a6"/>

    <!-- Neck -->
    <rect x="98" y="124" char="neck" width="9" height="22" fill="url(#skin)"/>

    <!-- Head -->
    <circle cx="103" cy="108" r="20" fill="url(#skin)"/>

    <!-- Hair (Stylish Bun & Bangs) -->
    <path d="M83 105 C83 90, 123 90, 123 105 C123 115, 115 120, 103 120 C91 120, 83 115, 83 105 Z" fill="#0f172a"/>
    <!-- Cute High Bun -->
    <circle cx="103" cy="85" r="10" fill="#0f172a"/>
    <circle cx="107" cy="83" r="3" fill="#334155" opacity="0.5"/> <!-- highlight -->

    <!-- Chef's Hat (Toque Blanche - tilted stylishly) -->
    <path d="M88 84 C85 70, 95 62, 105 65 C115 60, 125 72, 118 84 Z" fill="#f8fafc"/>
    <rect x="91" y="80" width="24" height="6" rx="2" fill="#e2e8f0"/>

    <!-- Expressive Face (Intelligent, Focused, Confident) -->
    <!-- Confident Smart Eyes -->
    <path d="M93 106 Q 96 102 99 106" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M107 106 Q 110 102 113 106" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Gentle Knowledgeable Smile -->
    <path d="M99 115 Q 103 118 107 115" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Red Rosy Cheeks of Passion -->
    <circle cx="92" cy="111" r="3.5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="114" cy="111" r="3.5" fill="#f43f5e" opacity="0.3"/>

    <!-- Arms & Active Hands -->
    <!-- Left Arm (Holding Spatula/Stirring) -->
    <path d="M85 145 Q 70 160 120 175" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand holding wooden spoon -->
    <circle cx="120" cy="175" r="4" fill="url(#skin)"/>
    <!-- Wooden Spatula in action -->
    <path d="M115 178 L145 183" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="147" cy="183.5" rx="5" ry="3" fill="#d97706"/>

    <!-- Right Arm (Gesturing expertly, pointing towards the delicious pan) -->
    <path d="M121 145 Q 140 155 135 170" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="135" cy="170" r="4" fill="url(#skin)"/>
  </g>

  <!-- Floating Culinary Mastery Sparkles / Icons -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 65 110 L 67 115 L 72 117 L 67 119 L 65 124 L 63 119 L 58 117 L 63 115 Z"/>
    <!-- Star 2 -->
    <path d="M 185 95 L 186.5 98.5 L 190 100 L 186.5 101.5 L 185 105 L 183.5 101.5 L 180 100 L 183.5 98.5 Z" transform="scale(0.8) translate(50, 10)"/>
    <!-- Heart Accent (Showing love for cooking) -->
    <path d="M 195 130 C 190 123, 180 126, 180 133 C 180 140, 195 148, 195 148 C 195 148, 210 140, 210 133 C 210 126, 200 123, 195 130 Z" fill="#ec4899" opacity="0.8" transform="scale(0.7) translate(80, 40)"/>
  </g>
</svg>