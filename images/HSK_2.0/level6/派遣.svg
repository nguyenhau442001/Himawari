<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Office Interior Background Elements -->
  <!-- Window overlooking city / abroad motif -->
  <rect x="140" y="24" width="70" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M140 24 H210 V114 H140 Z" fill="url(#windowGlow)" />
  <!-- City Skyline Silhouette through window -->
  <path d="M148 114 V85 H156 V114 H164 V70 H174 V114 H184 V90 H192 V114 H202 V75 H208 V114 Z" fill="#1e293b" />
  <!-- Airplane icon in sky (minimal vector representing going abroad) -->
  <path d="M165 45 L180 50 L168 52 L165 57 L162 52 L150 50 Z" fill="#38bdf8" opacity="0.7" transform="rotate(-15 165 50)" />

  <!-- Office Wall Shelves & Plant -->
  <rect x="25" y="30" width="80" height="6" rx="2" fill="#334155" />
  <circle.plant>
    <path d="M45 30 Q43 20 48 15 Q53 20 51 30 Z" fill="#10b981" />
    <path d="M50 30 Q53 18 60 16 Q62 23 55 30 Z" fill="#34d399" />
    <path d="M40 30 Q35 22 38 18 Q44 23 45 30 Z" fill="#059669" />
    <rect x="42" y="30" width="12" height="12" rx="2" fill="#cbd5e1" />
  </circle.plant>

  <!-- Warm ambient light from desk lamp / focal point -->
  <circle cx="110" cy="110" r="70" fill="url(#warmLight)" />

  <!-- Desk Surface -->
  <path d="M10 160 H230 V210 H10 Z" fill="url(#deskGrad)" />
  <rect x="10" y="155" width="220" height="6" rx="2" fill="#475569" />

  <!-- Desk Props (Globe & Passport/Ticket & Laptop) -->
  <!-- Globe (representing going abroad) -->
  <circle cx="195" cy="135" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <path d="M185 127 Q195 120 205 127 Q205 143 185 143 Z" fill="#0284c7" opacity="0.6" />
  <path d="M180 135 H210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
  <path d="M195 117 V153" stroke="#475569" stroke-width="2" />
  <path d="M187 153 H203" stroke="#475569" stroke-width="2" />

  <!-- Open Passport / Travel Documents on desk -->
  <rect x="120" y="145" width="28" height="20" rx="2" transform="rotate(-10 135 155)" fill="#b91c1c" />
  <rect x="135" y="143" width="26" height="20" rx="2" transform="rotate(5 148 153)" fill="#f8fafc" />
  <line x1="139" y1="148" x2="149" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="139" y1="153" x2="146" y2="153" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Laptop -->
  <path d="M70 165 L80 142 H110 L120 165 Z" fill="#64748b" />
  <path d="M60 165 H130 L135 170 H55 Z" fill="#475569" />

  <!-- Main Character: Manager / Boss handing assignment/ticket -->
  <!-- Boss Torso & Suit -->
  <path d="M25 120 C25 105 45 100 55 100 C65 100 85 105 85 120 L80 160 H30 Z" fill="#1e293b" />
  <!-- Tie & Shirt -->
  <path d="M50 105 L55 130 L60 105 Z" fill="#ef4444" />
  <path d="M48 100 H62 V115 H48 Z" fill="#f8fafc" />
  <!-- Boss Head & Hair -->
  <circle cx="55" cy="80" r="15" fill="#fbcfe8" />
  <!-- Skin tone adjustment -->
  <circle cx="55" cy="81" r="14" fill="#ffedd5" />
  <path d="M41 78 C41 68 69 68 69 78 Z" fill="#334155" />
  <!-- Boss Arm extending forward holding document/flight ticket folder -->
  <path d="M70 110 Q95 115 105 125 L100 132 Q90 122 75 120 Z" fill="#1e293b" />
  <!-- Hand -->
  <circle cx="106" cy="128" r="4" fill="#ffedd5" />

  <!-- File folder / dispatch letter being handed over -->
  <rect x="95" y="122" width="20" height="14" rx="2" transform="rotate(15 105 129)" fill="#f59e0b" />
  <rect x="98" y="125" width="14" height="2" fill="#fff" transform="rotate(15 105 129)" />

  <!-- Secondary Character: Employee being dispatched/sent abroad -->
  <!-- Employee Torso -->
  <path d="M120 130 C120 115 140 110 150 110 C160 110 180 115 180 130 L175 170 H125 Z" fill="#0284c7" />
  <!-- Collar -->
  <path d="M143 110 H157 V122 H143 Z" fill="#f8fafc" />
  <!-- Employee Head & Hair -->
  <circle cx="150" cy="90" r="15" fill="#ffedd5" />
  <path d="M136 88 C136 75 164 75 164 88 C164 88 160 82 150 82 C140 82 136 88 136 88 Z" fill="#1e293b" />
  <!-- Employee Expression: Surprised/Happy anticipation (Wide eyes, smiling) -->
  <circle cx="145" cy="89" r="1.5" fill="#1e293b" />
  <circle cx="155" cy="89" r="1.5" fill="#1e293b" />
  <path d="M148 95 Q150 98 152 95" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Employee Arm reaching to accept the assignment/ticket -->
  <path d="M130 120 Q118 122 110 126 L113 134 Q122 129 135 127 Z" fill="#0284c7" />
  <circle cx="109" cy="130" r="4" fill="#ffedd5" />

  <!-- Small suitcase on floor beside employee representing travel preparation -->
  <rect x="185" y="170" width="22" height="28" rx="4" fill="#ea580c" />
  <rect x="191" y="165" width="10" height="5" rx="2" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <line x1="185" y1="180" x2="207" y2="180" stroke="#c2410c" stroke-width="2" />
  <circle cx="196" cy="198" r="2" fill="#334155" />

</svg>