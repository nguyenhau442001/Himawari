<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "以往" (The Past / Former times):
       An iconic, tangible vintage calendar book with retro pages flipping backward, 
       representing a physical object from a previous era. -->

  <!-- Glow effect behind the object -->
  <circle cx="120" cy="120" r="70" fill="#2D323F" opacity="0.5"/>

  <!-- Vintage Desk Calendar / Document Stand representing "The Past" -->
  <g transform="translate(0, 5)">
    <!-- Base stand -->
    <path d="M 70 170 L 170 170 L 155 185 L 85 185 Z" fill="#3A3F4D"/>
    
    <!-- Binding rings -->
    <circle cx="95" cy="72" r="5" fill="#F59E0B"/>
    <circle cx="145" cy="72" r="5" fill="#F59E0B"/>
    <rect x="92" y="70" width="6" height="15" fill="#D97706"/>
    <rect x="142" y="70" width="6" height="15" fill="#D97706"/>

    <!-- Back pages (fading into the past) -->
    <rect x="80" y="75" width="80" height="95" rx="6" fill="#262C3A"/>

    <!-- Main past page (Physical object centered) -->
    <rect x="75" y="80" width="90" height="100" rx="6" fill="#F3F4F6"/>
    
    <!-- Calendar header band -->
    <path d="M 75 80 L 165 80 L 165 105 L 75 105 Z" fill="#EF4444"/>
    <circle cx="90" cy="92" r="3" fill="#FFFFFF"/>
    <circle cx="150" cy="92" r="3" fill="#FFFFFF"/>

    <!-- Retro calendar grid / lines representing days gone by -->
    <rect x="90" y="120" width="15" height="10" rx="2" fill="#D1D5DB"/>
    <rect x="112" y="120" width="15" height="10" rx="2" fill="#D1D5DB"/>
    <rect x="134" y="120" width="15" height="10" rx="2" fill="#EF4444"/>

    <rect x="90" y="136" width="15" height="10" rx="2" fill="#D1D5DB"/>
    <rect x="112" y="136" width="15" height="10" rx="2" fill="#D1D5DB"/>
    <rect x="134" y="136" width="15" height="10" rx="2" fill="#D1D5DB"/>

    <rect x="90" y="152" width="15" height="10" rx="2" fill="#D1D5DB"/>
    <rect x="112" y="152" width="15" height="10" rx="2" fill="#D1D5DB"/>
    <rect x="134" y="152" width="15" height="10" rx="2" fill="#D1D5DB"/>

    <!-- Flipping page effect (arrow/motion line showing backward in time) -->
    <path d="M 155 70 C 180 50, 180 30, 160 20" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="155,15 170,22 158,28" fill="#F59E0B"/>
    
    <!-- Clock icon inset showing time passed -->
    <circle cx="165" cy="140" r="22" fill="#1F2937" stroke="#F59E0B" stroke-width="3"/>
    <polyline points="165,128 165,140 173,144" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>