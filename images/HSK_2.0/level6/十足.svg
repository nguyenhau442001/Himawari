<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize the central object -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.08"/>
  
  <!-- Decorative percentage/fullness rings (abstract conceptual framing) -->
  <circle cx="120" cy="120" r="76" fill="none" stroke="#2D323E" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="120" cy="120" r="68" fill="none" stroke="#FFB703" stroke-width="4" stroke-dasharray="358" stroke-dashoffset="0" stroke-linecap="round" opacity="0.25"/>

  <!-- Main Object: Sleek Modern Trophy representing "Full/100%" success, confidence, and achievement -->
  <g transform="translate(0, 4)">
    <!-- Trophy Base -->
    <path d="M95 178 L145 178 L140 162 L100 162 Z" fill="#4A5568"/>
    <rect x="105" y="152" width="30" height="12" rx="2" fill="#718096"/>
    
    <!-- Trophy Handles -->
    <path d="M 92 88 C 72 88, 72 124, 92 134" fill="none" stroke="#FFB703" stroke-width="6" stroke-linecap="round"/>
    <path d="M 148 88 C 168 88, 168 124, 148 134" fill="none" stroke="#FFB703" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Trophy Cup Body (Back/Inner) -->
    <path d="M 92 72 C 92 120, 148 120, 148 72 Z" fill="#E2E8F0"/>
    
    <!-- Liquid/Energy Level (Showing "100%" - Full to the brim with glowing gold) -->
    <path d="M 93 84 C 93 118, 147 118, 147 84 Z" fill="#FFB703"/>
    
    <!-- Trophy Cup Body (Front Overlays & Rim) -->
    <ellipse cx="120" cy="72" rx="28" ry="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="2"/>
    <ellipse cx="120" cy="72" rx="24" ry="6" fill="#FFB703"/>
    
    <!-- Star Emblem on Trophy (representing top quality/100%) -->
    <polygon points="120,95 123,103 131,103 125,108 127,116 120,111 113,116 115,108 109,103 117,103" fill="#1A1D24"/>
  </g>

  <!-- Sparkles / 100% indicators -->
  <g fill="#FFB703">
    <!-- Top right sparkle -->
    <path d="M 172 64 Q 172 74 182 74 Q 172 74 172 84 Q 172 74 162 74 Q 172 74 172 64" />
    <!-- Bottom left sparkle -->
    <path d="M 68 136 Q 68 142 74 142 Q 68 142 68 148 Q 68 142 62 142 Q 68 142 68 136" />
    <!-- Small accent dot -->
    <circle cx="164" cy="110" r="3" opacity="0.8"/>
  </g>
</svg>