<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Glow -->
    <radialGradient id="deskGlow" cx="50%" cy="60%" r="55%" fx="50%" fy="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Teacher Warm Spot -->
    <radialGradient id="teacherSpot" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Clip for Window -->
    <clipPath id="windowClip">
      <rect x="180" y="25" width="35" height="55" rx="4" />
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects -->
  <rect width="240" height="240" fill="url(#deskGlow)" />
  <rect width="240" height="240" fill="url(#teacherSpot)" />
  <rect width="240" height="240" fill="url(#moonGlow)" />

  <!-- ==================== BACKGROUND ENVIRONMENT ==================== -->
  <!-- Classroom Back Wall & Chalkboard / Scroll Shelf -->
  <rect x="25" y="30" width="135" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <!-- Traditional Chinese Scroll / Painting on Wall (representing classical poetry theme) -->
  <rect x="75" y="42" width="35" height="70" rx="2" fill="#1e1b4b" stroke="#475569" stroke-width="1" />
  <path d="M82 52 L95 52 M82 62 L103 62 M82 72 L90 72 M82 82 L98 82 M82 92 L92 92" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <!-- Scroll Rollers -->
  <rect x="72" y="40" width="41" height="3" rx="1" fill="#b45309" />
  <rect x="72" y="111" width="41" height="3" rx="1" fill="#b45309" />

  <!-- Bookshelf Background detail -->
  <g opacity="0.4">
    <rect x="35" y="45" width="8" height="60" fill="#334155" rx="1" />
    <rect x="45" y="50" width="6" height="55" fill="#475569" rx="1" />
    <rect x="53" y="42" width="7" height="63" fill="#1e293b" rx="1" />
  </g>

  <!-- Traditional Window with Moon/Night View -->
  <g>
    <rect x="180" y="25" width="35" height="55" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#475569" stroke-width="2" />
    <path d="M197.5 25 V80 M180 52.5 H215" stroke="#475569" stroke-width="1.5" />
    <!-- Moon outside -->
    <circle cx="203" cy="40" r="6" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- House Plant on Bookshelf -->
  <path d="M165 110 Q167 95 160 85 Q175 95 170 110 Z" fill="#10b981" />
  <ellipse cx="165" cy="111" rx="7" ry="4" fill="#64748b" />


  <!-- ==================== TEACHER CHARACTER (LEFT) ==================== -->
  <g id="teacher">
    <!-- Teacher Body/Torso -->
    <path d="M35 170 C35 150 45 140 58 140 C71 140 81 150 81 170 Z" fill="#334155" />
    <path d="M45 140 L58 155 L71 140 Z" fill="#f8fafc" /> <!-- Collar / Shirt -->
    
    <!-- Teacher Head -->
    <circle cx="58" cy="118" r="16" fill="#fbcfe8" />
    <!-- Teacher Hair -->
    <path d="M43 118 C43 105 50 100 58 100 C67 100 73 105 73 118 C70 114 65 112 58 112 C51 112 46 114 43 118 Z" fill="#334155" />
    <!-- Teacher Glasses -->
    <circle cx="53" cy="118" r="4" fill="none" stroke="#b45309" stroke-width="1.5" />
    <circle cx="63" cy="118" r="4" fill="none" stroke="#b45309" stroke-width="1.5" />
    <line x1="57" y1="118" x2="59" y2="118" stroke="#b45309" stroke-width="1.5" />

    <!-- Teacher Arm Pointing / Directing -->
    <path d="M72 148 L95 135" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <circle cx="95" cy="134" r="4" fill="#fbcfe8" />
  </g>


  <!-- ==================== STUDENT CHARACTER (CENTER-RIGHT) ==================== -->
  <g id="student">
    <!-- Student Chair -->
    <rect x="115" y="155" width="28" height="35" rx="3" fill="#cbd5e1" />
    <rect x="115" y="130" width="28" height="28" rx="3" fill="#94a3b8" />

    <!-- Student Torso (Sitting upright, engaged in reciting/back-reciting) -->
    <path d="M110 175 C110 155 120 145 130 145 C140 145 150 155 150 175 Z" fill="#0284c7" />
    <path d="M123 145 L130 155 L137 145 Z" fill="#f8fafc" /> <!-- Collar -->

    <!-- Student Head (Looking slightly up and expressive, eyes closed/focused in memory recitation) -->
    <circle cx="130" cy="115" r="17" fill="#fbcfe8" />
    
    <!-- Student Hair (Modern neat cut) -->
    <path d="M113 115 C113 100 120 96 130 96 C140 96 147 100 147 115 C145 110 140 106 130 106 C120 106 115 110 113 115 Z" fill="#1e293b" />
    
    <!-- Facial Features: Reciting expression (open mouth, focused/closed eyes or looking up) -->
    <!-- Focused/Passionate Recitation Eyes (Arcs) -->
    <path d="M123 114 Q126 111 129 114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M131 114 Q134 111 137 114" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Open Mouth voicing out -->
    <ellipse cx="130" cy="123" rx="3.5" ry="4" fill="#be123c" />

    <!-- Student Hands Raised / Gesturing while Reciting -->
    <!-- Left Arm -->
    <path d="M115 155 L103 140 L110 135" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="109" cy="134" r="3.5" fill="#fbcfe8" />
    <!-- Right Arm (Raised higher holding memory or chest) -->
    <path d="M145 155 L156 138 L148 132" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="147" cy="131" r="3.5" fill="#fbcfe8" />
  </g>


  <!-- ==================== FOREGROUND DESK & PROPS ==================== -->
  <g id="desk-and-props">
    <!-- Large Student Desk -->
    <rect x="90" y="170" width="85" height="12" rx="3" fill="#334155" />
    <rect x="95" y="182" width="8" height="42" fill="#1e293b" />
    <rect x="162" y="182" width="8" height="42" fill="#1e293b" />

    <!-- Open Textbook / Poetry Book on Desk -->
    <g transform="translate(112, 155)">
      <!-- Book Cover (Dark Red/Amber) -->
      <path d="M0 16 L25 10 L50 16 L50 32 L25 26 L0 32 Z" fill="#b45309" />
      <!-- Left Page -->
      <path d="M3 17 L23 12 L23 27 L3 31 Z" fill="#f8fafc" />
      <path d="M7 19 L18 16 M7 23 L16 20 M7 27 L15 24" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
      <!-- Right Page -->
      <path d="M27 12 L47 17 L47 31 L27 27 Z" fill="#f8fafc" />
      <path d="M32 16 L43 19 M32 20 L41 23 M32 24 L43 27" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
      <!-- Bookmark ribbon hanging down -->
      <path d="M25 14 Q25 25 22 35" stroke="#ef4444" stroke-width="2.5" fill="none" />
    </g>

    <!-- Warm Desk Lamp -->
    <g transform="translate(155, 145)">
      <!-- Lamp Base -->
      <ellipse cx="0" cy="28" rx="8" ry="3" fill="#64748b" />
      <!-- Lamp Pole -->
      <path d="M0 28 L0 10" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <!-- Lamp Shade -->
      <path d="M-9 10 L9 10 L6 2 L-6 2 Z" fill="#fbbf24" />
      <!-- Light beam cone downwards -->
      <polygon points="-6,10 6,10 22,35 -22,35" fill="#fef08a" opacity="0.12" />
    </g>

    <!-- Coffee Mug / Tea Cup on Desk -->
    <rect x="98" y="157" width="9" height="12" rx="2" fill="#38bdf8" />
    <path d="M107 160 C110 160 110 166 107 166" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <!-- Steam wisps -->
    <path d="M101 152 Q103 148 101 144" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>


  <!-- ==================== MEMORY / RECITAL VISUALIZATION EFFECTS ==================== -->
  <!-- Floating expressive poetry/sound notes representing recitation output -->
  <g id="recitation-particles">
    <!-- Glowing note 1 -->
    <circle cx="155" cy="95" r="4" fill="#fbbf24" opacity="0.8" />
    <path d="M155 95 Q162 88 160 80" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
    
    <!-- Glowing note 2 -->
    <circle cx="170" cy="115" r="3" fill="#38bdf8" opacity="0.9" />
    
    <!-- Floating abstract poetry glyph hints (artistic curved lines representing verse rhythm) -->
    <path d="M142 85 Q148 78 156 82" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M135 75 Q143 67 150 72" stroke="#a855f7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    
    <!-- Sparkles of achievement/focus -->
    <path d="M100 110 L102 105 L107 103 L102 101 L100 96 L98 101 L93 103 L98 105 Z" fill="#fef08a" opacity="0.7" />
    <path d="M175 145 L176 142 L179 141 L176 140 L175 137 L174 140 L171 141 L174 142 Z" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- Foreground Floor Line -->
  <rect x="0" y="222" width="240" height="18" fill="#090d16" />
</svg>