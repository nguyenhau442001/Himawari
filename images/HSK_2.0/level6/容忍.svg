<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall & Floor Gradients -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glow for tension -->
    <radialGradient id="tension-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    
    <!-- Window Light -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <clipPath id="window-clip">
      <rect x="25" y="30" width="45" height="60" rx="4"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Background -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="165" fill="url(#wall-grad)"/>
  
  <!-- Subtle Wall Paneling Line -->
  <line x1="0" y1="165" x2="240" y2="165" stroke="#0f172a" stroke-width="3"/>

  <!-- Window Context Props -->
  <g opacity="0.8">
    <rect x="25" y="30" width="45" height="60" fill="#0f172a" stroke="#475569" stroke-width="2" rx="4"/>
    <rect x="25" y="30" width="45" height="60" fill="url(#window-glow)"/>
    <line x1="47" y1="30" x2="47" y2="90" stroke="#475569" stroke-width="1.5"/>
    <line x1="25" y1="60" x2="70" y2="60" stroke="#475569" stroke-width="1.5"/>
    <!-- City silhouette outside window -->
    <path d="M28 90 L28 75 L33 75 L33 90 L38 90 L38 68 L44 68 L44 90 L52 90 L52 62 L59 62 L59 90 L67 90 L67 70 L70 70 L70 90 Z" fill="#1e293b"/>
  </g>

  <!-- Office Shelf with props -->
  <g transform="translate(160, 25)">
    <rect x="0" y="0" width="55" height="6" fill="#475569" rx="2"/>
    <!-- Books / Folders -->
    <rect x="8" y="-18" width="8" height="18" fill="#f59e0b" rx="1"/>
    <rect x="18" y="-22" width="10" height="22" fill="#38bdf8" rx="1"/>
    <rect x="30" y="-15" width="7" height="15" fill="#10b981" rx="1"/>
    <rect x="39" y="-20" width="9" height="20" fill="#ec4899" rx="1"/>
  </g>

  <!-- Tension Atmosphere Effect over the offending action -->
  <circle cx="150" cy="115" r="50" fill="url(#tension-glow)" />

  <!-- Floor Surface -->
  <path d="M0 165 L240 165 L240 240 L0 240 Z" fill="#0f172a"/>
  
  <!-- Desk / Table Structure -->
  <g filter="url(#shadow)">
    <!-- Desk Top -->
    <path d="M15 160 L225 160 L215 185 L25 185 Z" fill="url(#desk-grad)"/>
    <!-- Desk Front Rim -->
    <rect x="20" y="180" width="200" height="8" fill="#334155" rx="2"/>
    <!-- Desk Legs -->
    <rect x="35" y="188" width="10" height="42" fill="#1e293b"/>
    <rect x="195" y="188" width="10" height="42" fill="#1e293b"/>
  </g>

  <!-- Desk Props (Laptop, Papers, Coffee Mug) -->
  <g>
    <!-- Laptop Base -->
    <path d="M85 172 L135 172 L142 165 L78 165 Z" fill="#94a3b8"/>
    <!-- Laptop Screen (Folded down / pushed back) -->
    <path d="M80 165 L140 165 L140 145 L80 145 Z" fill="#475569"/>
    <rect x="85" y="149" width="50" height="13" fill="#0f172a" rx="1"/>
    
    <!-- Scattered Messy Papers (Representing the bad behavior/mistake) -->
    <g transform="translate(135, 155) rotate(12)">
      <rect x="0" y="0" width="22" height="16" fill="#f8fafc" rx="1"/>
      <line x1="3" y1="4" x2="15" y2="4" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="3" y1="8" x2="18" y2="8" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="3" y1="12" x2="11" y2="12" stroke="#ef4444" stroke-width="1.5"/> <!-- Red error mark -->
    </g>
    <g transform="translate(155, 162) rotate(-8)">
      <rect x="0" y="0" width="20" height="14" fill="#e2e8f0" rx="1"/>
      <line x1="3" y1="4" x2="14" y2="4" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="3" y1="8" x2="16" y2="8" stroke="#ef4444" stroke-width="1.5"/>
    </g>

    <!-- Coffee Mug -->
    <rect x="58" y="157" width="12" height="14" fill="#cbd5e1" rx="2"/>
    <path d="M70 160 C74 160 74 167 70 168" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  </g>

  <!-- CHARACTER 1: The Offending Employee / Culprit (Left Side, pointing at desk/mistake nervously or defiantly) -->
  <g id="character-culprit" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M75 140 C75 125 90 120 100 120 C110 120 125 125 125 140 L120 185 L80 185 Z" fill="#fb923c"/>
    <!-- Collar/Tie details -->
    <path d="M92 120 L100 135 L108 120 Z" fill="#f8fafc"/>
    <polygon points="98,135 102,135 101,155 99,155" fill="#ef4444"/>

    <!-- Left Arm gesturing down to the papers -->
    <path d="M80 125 C70 135 55 145 45 155" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="42" cy="157" r="5" fill="#fde047"/>

    <!-- Head -->
    <circle cx="100" cy="98" r="18" fill="#fde047"/>
    <!-- Hair (Messy/Casual) -->
    <path d="M82 98 C82 85 92 80 102 80 C114 80 118 88 118 98 C115 92 108 88 100 88 C90 88 85 92 82 98 Z" fill="#334155"/>
    
    <!-- Face Expression (Slightly defiant / caught in the act) -->
    <!-- Eyes -->
    <circle cx="93" cy="97" r="2" fill="#1e293b"/>
    <circle cx="107" cy="97" r="2" fill="#1e293b"/>
    <!-- Eyebrows (Slanted up towards center) -->
    <line x1="90" y1="92" x2="96" y2="94" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="104" y1="94" x2="110" y2="92" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth (Smirk / Defensive line) -->
    <path d="M95 106 Q100 103 105 106" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- CHARACTER 2: The Authority Figure / Leader (Right Side, Firmly Rejecting / "Né tránh/Dung thứ không được") -->
  <g id="character-leader" filter="url(#shadow)">
    <!-- Torso (Professional Suit Jacket) -->
    <path d="M145 190 C145 155 160 130 180 130 C200 130 215 155 215 190 Z" fill="#1e3a8a"/>
    <!-- Inner Shirt & Tie -->
    <path d="M170 130 L180 148 L190 130 Z" fill="#f8fafc"/>
    <polygon points="178,145 182,145 184,175 176,175" fill="#3b82f6"/>
    <!-- Lapels -->
    <path d="M170 130 L175 165 L160 185" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M190 130 L185 165 L200 185" stroke="#0f172a" stroke-width="2" fill="none"/>

    <!-- Right Arm: Firm Stop Gesture (Palm Facing Forward / Rejecting) -->
    <!-- Upper Arm -->
    <path d="M210 140 C220 145 225 155 220 165" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Forearm & Palm out -->
    <path d="M220 165 L195 160" stroke="#fde047" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Stop Hand Palm -->
    <rect x="187" y="150" width="8" height="18" rx="3" fill="#fde047"/>
    
    <!-- Left Arm: Hand on hip / stern pose -->
    <path d="M150 145 C140 155 140 170 155 180" stroke="#1e3a8a" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- Head -->
    <circle cx="180" cy="90" r="19" fill="#fde047"/>
    <!-- Hair (Neat, Professional Professional Cut) -->
    <path d="M162 90 C162 76 172 71 182 71 C196 71 198 82 198 90 C194 84 188 82 180 82 C170 82 165 85 162 90 Z" fill="#0f172a"/>

    <!-- Face Expression (Stern, Serious, Uncompromising 'Zero Tolerance') -->
    <!-- Eyes (Focused, narrowed with disapproval) -->
    <line x1="170" y1="88" x2="176" y2="90" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="184" y1="90" x2="190" y2="88" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Heavy Stern Eyebrows (Slanted down sharply towards center) -->
    <path d="M167 83 L177 87" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M193 83 L183 87" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Mouth (Firm, straight, tight-lipped non-negotiable line) -->
    <line x1="173" y1="101" x2="187" y2="101" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Accent Elements for Dynamic Focus (Cross/Warning symbols stylized cleanly, NO text) -->
  <g transform="translate(155, 95)" opacity="0.85">
    <!-- Red warning shield / barrier graphic -->
    <path d="M 0,-10 L 8,-5 L 8,5 L 0,10 L -8,5 L -8,-5 Z" fill="#ef4444" filter="url(#shadow)"/>
    <!-- White X inside warning badge -->
    <path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>