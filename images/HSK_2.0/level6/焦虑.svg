<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Night Glow Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.05" />
    </linearGradient>

    <!-- Desk Lamp Cone Light -->
    <linearGradient id="lamp-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: BACKGROUND LAYER -->
  <!-- Window Frame showing deep night -->
  <rect x="150" y="25" width="65" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
  <rect x="154" y="29" width="57" height="77" fill="url(#window-glow)" />
  <!-- Window crossbars -->
  <line x1="182" y1="29" x2="182" y2="106" stroke="#334155" stroke-width="2" />
  <line x1="154" y1="67" x2="211" y2="67" stroke="#334155" stroke-width="2" />
  <!-- Distant City Lights through window -->
  <circle cx="165" cy="85" r="1.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="172" cy="92" r="1" fill="#38bdf8" opacity="0.5" />
  <circle cx="195" cy="80" r="1.5" fill="#ef4444" opacity="0.5" />
  <circle cx="200" cy="98" r="1" fill="#f59e0b" opacity="0.4" />

  <!-- Bookshelf / Wall Shelf -->
  <rect x="25" y="45" width="80" height="6" rx="2" fill="#334155" />
  <!-- Books on shelf -->
  <path d="M35 25 h8 v20 h-8 z" fill="#475569" />
  <path d="M45 22 h10 v23 h-10 z" fill="#0ea5e9" />
  <path d="M57 28 h6 v17 h-6 z" fill="#f43f5e" />
  <path d="M65 20 h12 v25 h-12 z" fill="#10b981" />

  <!-- Wall Clock showing late hour (e.g., 2:00 AM) -->
  <circle cx="110" cy="50" r="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <circle cx="110" cy="50" r="1" fill="#cbd5e1" />
  <line x1="110" y1="50" x2="110" y2="40" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="110" y1="50" x2="117" y2="52" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />

  <!-- ENVIRONMENT: MIDGROUND & PROPS -->
  <!-- Desk Surface -->
  <rect x="15" y="155" width="210" height="12" rx="3" fill="#334155" />
  <rect x="25" y="167" width="10" height="50" fill="#1e293b" />
  <rect x="205" y="167" width="10" height="50" fill="#1e293b" />

  <!-- Desk Lamp (Off/Dim) -->
  <path d="M50 155 L55 125 L65 125 L70 155 Z" fill="#64748b" />
  <path d="M45 120 C45 110, 75 110, 75 120 Z" fill="#cbd5e1" />
  <!-- Lamp Light Cone -->
  <polygon points="60,123 20,200 120,200" fill="url(#lamp-light)" />

  <!-- Laptop & Scattered Papers -->
  <!-- Laptop base -->
  <path d="M90 155 L75 142 h60 L120 155 Z" fill="#94a3b8" />
  <!-- Laptop screen -->
  <rect x="92" y="112" width="56" height="32" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <rect x="96" y="116" width="48" height="24" rx="1" fill="url(#screen-glow)" />
  <!-- Code/Text lines on screen (abstract) -->
  <line x1="100" y1="122" x2="120" y2="122" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="100" y1="128" x2="135" y2="128" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="100" y1="134" x2="115" y2="134" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />

  <!-- Messy Papers / Notes -->
  <rect x="145" y="145" width="22" height="15" rx="1" fill="#f1f5f9" transform="rotate(-12 156 152)" />
  <line x1="148" y1="149" x2="162" y2="149" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="148" y1="153" x2="158" y2="153" stroke="#cbd5e1" stroke-width="1.5" />

  <rect x="165" y="148" width="25" height="18" rx="1" fill="#fef08a" transform="rotate(8 177 157)" />
  <!-- Coffee Mug -->
  <rect x="195" y="138" width="14" height="18" rx="2" fill="#cbd5e1" />
  <path d="M209 142 C215 142, 215 152, 209 152" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Steam lines rising from mug (indicating stress/exhaustion) -->
  <path d="M200 132 C198 128, 204 124, 202 120" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- MAIN CHARACTER: Deeply Anxious / Stressed Man -->
  <!-- Chair Backrest -->
  <path d="M100 100 Q100 80 115 80 H135 Q150 80 150 100 V160 H100 Z" fill="#334155" />

  <!-- Body hunched forward -->
  <!-- Torso & Hoodie -->
  <path d="M100 130 C90 135, 80 155, 85 175 L155 175 C160 155, 150 135, 140 130 Z" fill="#2563eb" />
  <!-- Hoodie Hood / Shoulders hunched -->
  <path d="M95 130 C90 115, 105 100, 120 100 C135 100, 150 115, 145 130 C135 125, 105 125, 95 130 Z" fill="#1d4ed8" />

  <!-- Arms clutching/pulling hair (Classic anxiety/stress pose) -->
  <!-- Left arm -->
  <path d="M100 130 C90 120, 100 105, 112 110" stroke="#2563eb" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Left Hand on Head -->
  <circle cx="115" cy="105" r="6" fill="#f8fafc" />

  <!-- Right arm -->
  <path d="M140 130 C150 120, 140 105, 128 110" stroke="#2563eb" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Right Hand on Head -->
  <circle cx="125" cy="105" r="6" fill="#f8fafc" />

  <!-- Head (Tilted downward, tense) -->
  <circle cx="120" cy="112" r="16" fill="#fed7aa" />

  <!-- Messy Hair (Tuned to show agitation) -->
  <path d="M104 112 C102 100, 110 92, 120 92 C130 92, 138 100, 136 112 C134 102, 126 96, 120 96 C114 96, 106 102, 104 112 Z" fill="#334155" />
  <path d="M110 94 L105 88 M120 92 L121 84 M130 94 L136 87" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Facial Expressions (Anxiety/Stress: furrowed brows, tense mouth, sweat drop) -->
  <!-- Furrowed Eyebrows -->
  <line x1="112" y1="110" x2="118" y2="113" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <line x1="128" y1="110" x2="122" y2="113" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Tense Eyes (closed tight in overwhelm) -->
  <path d="M112 116 Q115 119 118 116" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M122 116 Q125 119 128 116" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Tight/Worried Mouth -->
  <path d="M116 126 Q120 123 124 126" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Sweat Drop (Classic visual indicator of anxiety/pressure) -->
  <path d="M136 108 C136 108, 140 114, 140 117 C140 119.2, 138.2 121, 136 121 C133.8 121, 132 119.2, 132 117 C132 114, 136 108, 136 108 Z" fill="#38bdf8" opacity="0.8" />

  <!-- FOREGROUND & ATMOSPHERIC DETAILS -->
  <!-- Subtle particle dust / stress tension floating hints -->
  <circle cx="75" cy="130" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="165" cy="120" r="1" fill="#fbbf24" opacity="0.5" />
  <circle cx="155" cy="100" r="2" fill="#38bdf8" opacity="0.3" />

  <!-- Vignette overlay for cozy/dark dramatic framing -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#000000" stroke-width="8" opacity="0.3" />
</svg>