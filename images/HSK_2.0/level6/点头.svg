<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Agreement/Lighting -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 (Speaking/Proposing) Skin & Clothes Gradients -->
    <linearGradient id="shirt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Nodding in Agreement) Clothes -->
    <linearGradient id="shirt-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="90" r="110" fill="url(#lamp-glow)" />

  <!-- BACKGROUND ENVIRONMENT -->
  <g id="environment">
    <!-- Cozy Café / Office Wall Backdrops -->
    <rect x="24" y="40" width="192" height="110" rx="6" fill="#1b263b" />
    <!-- Window with Night City Silhouette -->
    <path d="M 160 55 L 200 55 L 200 125 L 160 125 Z" fill="#090d16" />
    <path d="M 170 70 L 178 70 L 178 125 L 170 125 Z" fill="#1e293b" opacity="0.4" />
    <path d="M 185 85 L 193 85 L 193 125 L 185 125 Z" fill="#1e293b" opacity="0.4" />
    <!-- City lights glow -->
    <circle cx="174" cy="65" r="1.5" fill="#facc15" />
    <circle cx="189" cy="78" r="1.5" fill="#38bdf8" />

    <!-- Wall Art / Frame -->
    <rect x="40" y="55" width="35" height="45" rx="3" fill="#283548" stroke="#334155" stroke-width="1.5" />
    <circle. cx="57" cy="73" r="10" fill="#38bdf8" opacity="0.2" />
    <path d="M 46 88 L 57 78 L 69 88 Z" fill="#10b981" opacity="0.3" />

    <!-- Bookshelf / Prop in background -->
    <rect x="85" y="65" width="25" height="4" fill="#334155" rx="1" />
    <rect x="88" y="50" width="6" height="15" fill="#f43f5e" rx="1" />
    <rect x="95" y="48" width="8" height="17" fill="#3b82f6" rx="1" />

    <!-- Hanging Pendant Light -->
    <line x1="120" y1="0" x2="120" y2="35" stroke="#475569" stroke-width="2" />
    <path d="M 105 35 L 135 35 L 142 45 L 98 45 Z" fill="#334155" />
    <!-- Light Cone overlay (semi-transparent) -->
    <path d="M 120 45 L 50 160 L 190 160 Z" fill="#fbbf24" opacity="0.04" />
  </g>

  <!-- FURNITURE: Wooden Table & Props -->
  <g id="furniture">
    <!-- Table Base / Legs -->
    <rect x="60" y="160" width="120" height="8" rx="3" fill="#854d0e" filter="url(#shadow)" />
    <path d="M 75 168 L 70 215 L 82 215 L 85 168 Z" fill="#713f12" />
    <path d="M 165 168 L 158 168 L 161 215 L 173 215 Z" fill="#713f12" />

    <!-- Tabletop Items (Plan/Contract & Coffee Mug) -->
    <!-- Blueprint / Contract Document -->
    <rect x="95" y="145" width="50" height="20" rx="2" fill="#f8fafc" transform="rotate(-5 120 155)" />
    <!-- Mini chart lines on document -->
    <line x1="100" y1="150" x2="120" y2="148" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="100" y1="156" x2="135" y2="154" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <!-- Red Approval Checkmark Stamp on Document -->
    <circle cx="134" cy="156" r="5" fill="none" stroke="#ef4444" stroke-width="1.5" />
    <path d="M 131 156 L 133 158 L 138 153" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Coffee Mug -->
    <rect x="68" y="142" width="12" height="15" rx="2" fill="#10b981" />
    <path d="M 80 145 C 84 145 84 153 80 153" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 72 135 C 72 132 75 130 74 127" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- CHARACTERS -->
  <!-- Character 1: Left (Explaining / Presenting Proposal) -->
  <g id="character-left" filter="url(#shadow)">
    <!-- Body/Torso -->
    <path d="M 50 170 Q 50 145 75 145 L 85 170 Z" fill="url(#shirt-blue)" />
    <path d="M 65 145 L 75 130 L 85 145 Z" fill="#0f172a" /> <!-- Collar -->
    
    <!-- Left Arm gesturing -->
    <path d="M 55 150 Q 40 160 52 175" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <circle cx="52" cy="177" r="5" fill="#f8fafc" /> <!-- Hand -->

    <!-- Head & Hair -->
    <circle cx="70" cy="115" r="16" fill="#f8fafc" />
    <!-- Hair -->
    <path d="M 54 115 C 54 100 86 100 86 115 C 86 112 82 102 70 102 C 58 102 54 112 54 115 Z" fill="#334155" />
    <!-- Facial expression: speaking, friendly smile, looking towards right -->
    <circle cx="75" cy="113" r="1.5" fill="#0f172a" />
    <path d="M 77 119 Q 80 121 82 119" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cheeks (warm friendly tone) -->
    <circle cx="78" cy="116" r="3" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Character 2: Right (THE MAIN FOCUS: 点头 - Nodding in Agreement) -->
  <g id="character-right" filter="url(#shadow)">
    <!-- Body/Torso leaning forward slightly, showing active engagement -->
    <path d="M 155 170 Q 160 145 185 145 L 195 170 Z" fill="url(#shirt-coral)" />
    <path d="M 165 145 L 175 130 L 185 145 Z" fill="#1e293b" /> <!-- Collar -->

    <!-- Right arm resting on table, thumb up or hand relaxed -->
    <path d="M 180 155 Q 190 165 185 168" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round" />
    <circle cx="183" cy="170" r="5" fill="#fed7aa" />

    <!-- HEAD GROUP (Animated downward/nodding tilt: Pivot around neck ~ (165, 105)) -->
    <g transform="translate(0, 4)"> 
      <!-- Head Circle -->
      <circle cx="165" cy="102" r="16" fill="#fed7aa" />
      
      <!-- Stylish Hair (Dark Bob / Modern Cut) -->
      <path d="M 149 102 C 149 88 181 88 181 102 C 181 97 175 90 165 90 C 155 90 149 97 149 102 Z" fill="#1e293b" />
      <path d="M 148 100 L 152 115 L 156 105 Z" fill="#1e293b" /> <!-- Side fringe -->

      <!-- Face Details indicating Agreement & Nodding -->
      <!-- Peaceful closed happy eyes (curves showing satisfaction/agreement) -->
      <path d="M 167 99 Q 171 103 175 99" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Gentle confident smile -->
      <path d="M 170 108 Q 174 112 178 108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Warm Blush -->
      <circle cx="175" cy="106" r="3.5" fill="#f43f5e" opacity="0.35" />
    </g>

    <!-- MOTION LINES FOR NODDING (Crucial to depict the dynamic action of "点头") -->
    <g opacity="0.8">
      <!-- Arc motion indicator above head showing downward nod -->
      <path d="M 158 84 Q 166 79 174 84" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
      <!-- Small dynamic arrows indicating downward nod motion -->
      <path d="M 175 87 L 178 91 L 173 92" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- FOREGROUND ACCENTS / DEPTH -->
  <!-- Soft lighting highlights on edges -->
  <path d="M 0 240 L 240 240" stroke="#334155" stroke-width="4" />
</svg>