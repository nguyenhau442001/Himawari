<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Courtroom Background Elements -->
  <path d="M40 180 L200 180 L190 120 L50 120 Z" fill="#334155"/>
  <rect x="60" y="130" width="120" height="40" fill="#475569" rx="4"/>
  <rect x="70" y="140" width="100" height="20" fill="#1e293b" rx="2"/>
  
  <!-- The Defendant (Bị cáo) -->
  <g transform="translate(120, 150)">
    <circle cx="0" cy="-45" r="12" fill="#fde68a"/>
    <path d="M-5 -42 Q0 -38 5 -42" stroke="#475569" stroke-width="1.5" fill="none"/>
    <path d="M-3 -48 L-1 -48 M1 -48 L3 -48" stroke="#475569" stroke-width="1.5"/>
    <path d="M-15 -35 L15 -35 L10 0 L-10 0 Z" fill="#94a3b8"/>
    <path d="M-10 0 L-15 40 L-5 40 L-2 10 L2 10 L5 40 L15 40 L10 0" fill="#64748b"/>
    <!-- Hand raised in confession -->
    <path d="M12 -20 L25 -10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Judge/Authority figure silhouette -->
  <g transform="translate(180, 110)">
    <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
    <rect x="-10" y="8" width="20" height="30" fill="#38bdf8" rx="2"/>
  </g>
  
  <!-- Decorative courtroom lighting/accents -->
  <circle cx="40" cy="40" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="30" r="4" fill="#fbbf24" opacity="0.4"/>
  <path d="M0 240 L240 240 L240 220 L0 220 Z" fill="#0f172a" opacity="0.3"/>
  
  <!-- Confession/Submission Gesture -->
  <path d="M145 135 Q160 125 155 110" stroke="#fb923c" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
</svg>