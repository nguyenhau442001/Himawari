<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Sky & Atmosphere -->
    <rect width="240" height="240" fill="url(#skyGrad)"/>
    
    <!-- Stars & Glowing Sun/Moon -->
    <circle cx="190" cy="50" r="18" fill="url(#sunGrad)" opacity="0.9"/>
    <circle cx="190" cy="50" r="26" fill="#f59e0b" opacity="0.15"/>
    <circle cx="50" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="85" cy="30" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="130" cy="45" r="1.2" fill="#ffffff" opacity="0.5"/>
    <circle cx="35" cy="75" r="1" fill="#ffffff" opacity="0.3"/>

    <!-- Distant Mountain Ranges (The "Barrier" / 屏障) -->
    <!-- Back Ridge -->
    <path d="M-10 160 L50 95 L110 140 L170 80 L250 135 L250 200 L-10 200 Z" fill="#334155" opacity="0.6"/>
    
    <!-- Main Majestic Mountain (Natural Barrier) -->
    <path d="M20 180 L90 70 L130 110 L180 50 L240 160 L240 220 L20 220 Z" fill="url(#mountainGrad)"/>
    
    <!-- Mountain Highlights/Snow Caps -->
    <path d="M90 70 L102 95 L96 98 L90 85 L84 98 L78 95 Z" fill="#f8fafc" opacity="0.9"/>
    <path d="M180 50 L195 80 L188 83 L180 65 L172 83 L165 80 Z" fill="#f8fafc" opacity="0.9"/>
    
    <!-- Wind flow lines indicating the barrier blocking wind/storm -->
    <path d="M 10 50 Q 50 45 75 75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
    <path d="M 25 35 Q 60 30 82 60" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.2"/>
    <!-- Wind deflected upward by mountain -->
    <path d="M 75 75 Q 90 50 95 35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
    
    <!-- Foreground Valley / Campsite Ground -->
    <path d="M0 175 Q 120 165 240 185 L240 240 L0 240 Z" fill="url(#groundGrad)"/>
    
    <!-- Pine Trees on the peaceful side -->
    <path d="M25 185 L35 155 L45 185 Z" fill="#047857"/>
    <path d="M35 165 L43 140 L51 165 Z" fill="#059669"/>
    <rect x="33" y="180" width="4" height="10" fill="#78350f"/>

    <path d="M205 190 L213 168 L221 190 Z" fill="#047857"/>
    <rect x="211" y="188" width="3" height="8" fill="#78350f"/>

    <!-- Peaceful Campsite Scene (Protected by the mountain) -->
    <!-- Cozy Tent -->
    <path d="M125 195 L155 160 L185 195 Z" fill="url(#tentGrad)"/>
    <path d="M155 160 L155 195 L185 195 Z" fill="#e11d48" opacity="0.7"/>
    <path d="M142 195 L155 175 L168 195 Z" fill="#fbcfe8"/> <!-- Tent entrance -->

    <!-- Campfire -->
    <ellipse cx="105" cy="193" rx="12" ry="4" fill="#022c22"/>
    <path d="M97 192 L101 184 L105 193 Z" fill="#f97316"/>
    <path d="M103 193 L107 181 L111 193 Z" fill="#ef4444"/>
    <path d="M105 191 L105 186 L108 190 Z" fill="#fbbf24"/>
    <circle cx="105" cy="180" r="3" fill="#f59e0b" opacity="0.6"/>

    <!-- Relaxed Traveler / Hiker Character -->
    <!-- Sitting Body -->
    <circle cx="125" cy="183" r="7" fill="#fb923c"/> <!-- Head -->
    <path d="M118 195 C118 188 123 185 128 185 C133 185 138 188 138 195 Z" fill="#3b82f6"/> <!-- Torso/Jacket -->
    <!-- Crossed legs -->
    <path d="M120 197 Q 128 193 136 197" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Backpack resting nearby -->
    <path d="M68 180 Q 65 172 72 170 Q 79 172 76 185 Z" fill="#854d0e"/>
    <rect x="70" y="174" width="4" height="8" rx="2" fill="#ca8a04"/>

    <!-- Additional Environmental Polish: Gentle Glowing Warmth in the Valley -->
    <ellipse cx="130" cy="190" rx="45" ry="12" fill="#fbbf24" opacity="0.08"/>

    <!-- Foreground Framing Grass Tufts -->
    <path d="M10 205 L13 195 L16 205" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M15 208 L18 198 L20 208" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M220 202 L224 192 L227 202" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Subtle border frame -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
  </g>
</svg>