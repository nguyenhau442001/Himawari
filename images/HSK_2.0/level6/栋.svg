<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100% " stop-color="#334155"/>
    </linearGradient>

    <!-- Building Gradient -->
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Stars / Night Sky ambience -->
  <circle cx="40" cy="30" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="90" cy="20" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="190" cy="40" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="210" cy="15" r="1.2" fill="#f8fafc" opacity="0.9"/>
  <circle cx="25" cy="80" r="1" fill="#94a3b8" opacity="0.4"/>

  <!-- Distant Background Buildings -->
  <rect x="20" y="80" width="30" height="130" fill="#1e293b" opacity="0.7"/>
  <rect x="180" y="70" width="45" height="140" fill="#1e293b" opacity="0.7"/>

  <!-- MAIN SUBJECT: "栋" (The Building - 10 floors explicitly depicted) -->
  <g id="mainBuilding">
    <!-- Building Shadow/Base -->
    <rect x="75" y="45" width="90" height="165" rx="4" fill="#0369a1" opacity="0.3"/>
    
    <!-- Main Structure -->
    <rect x="70" y="40" width="90" height="170" rx="6" fill="url(#buildingGrad)"/>
    
    <!-- Architectural Frame Accent -->
    <rect x="74" y="44" width="82" height="162" rx="4" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5"/>

    <!-- 10 FLOORS (Repeated row structure with illuminated windows) -->
    <!-- Floor 1 (Ground / Lobby) -->
    <rect x="95" y="185" width="40" height="25" rx="2" fill="#0284c7"/>
    <path d="M105,210 V193 A5,5 0 0,1 135,193 V210 Z" fill="#334155"/>
    <circle cx="128" cy="202" r="1.5" fill="#fbbf24"/>

    <!-- Floor 2 -->
    <rect x="80" y="165" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="109" y="165" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="138" y="165" width="22" height="14" rx="1.5" fill="#1e293b" opacity="0.5"/>

    <!-- Floor 3 -->
    <rect x="80" y="147" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="109" y="147" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="138" y="147" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>

    <!-- Floor 4 -->
    <rect x="80" y="129" width="22" height="14" rx="1.5" fill="#1e293b" opacity="0.5"/>
    <rect x="109" y="129" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="138" y="129" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>

    <!-- Floor 5 -->
    <rect x="80" y="111" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="109" y="111" width="22" height="14" rx="1.5" fill="#1e293b" opacity="0.5"/>
    <rect x="138" y="111" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>

    <!-- Floor 6 -->
    <rect x="80" y="93" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="109" y="93" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="138" y="93" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>

    <!-- Floor 7 -->
    <rect x="80" y="75" width="22" height="14" rx="1.5" fill="#1e293b" opacity="0.5"/>
    <rect x="109" y="75" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="138" y="75" width="22" height="14" rx="1.5" fill="#1e293b" opacity="0.5"/>

    <!-- Floor 8 -->
    <rect x="80" y="57" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="109" y="57" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>
    <rect x="138" y="57" width="22" height="14" rx="1.5" fill="url(#windowGlow)"/>

    <!-- Floor 9 (Added extra distinct middle tier for structural rhythm) -->
    <line x1="74" y1="50" x2="156" y2="50" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Rooftop Architecture (Floor 10 crown) -->
  <path d="M85,40 L115,25 L145,40 Z" fill="#0284c7"/>
  <rect x="110" y="15" width="10" height="15" fill="#38bdf8"/>
  <circle cx="115" cy="13" r="3" fill="#ef4444" filter="url(#glow)"/>

  <!-- Foreground / Ground -->
  <rect x="0" y="205" width="240" height="35" fill="url(#groundGrad)"/>
  <rect x="0" y="205" width="240" height="3" fill="#38bdf8" opacity="0.5"/>

  <!-- Foliage / Bushes for context -->
  <circle cx="55" cy="210" r="12" fill="#059669"/>
  <circle cx="45" cy="213" r="10" fill="#10b981"/>
  <circle cx="195" cy="212" r="14" fill="#059669"/>
  <circle cx="205" cy="215" r="9" fill="#10b981"/>

  <!-- Street Lamp giving warm glow to the scene -->
  <path d="M35,210 V140" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M35,140 L25,145" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M22,148 Q25,143 32,145" fill="#f59e0b" filter="url(#glow)"/>
  <path d="M20,149 C20,154 30,154 30,149 Z" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Light beam from lamp -->
  <polygon points="25,150 5,210 65,210" fill="#fbbf24" opacity="0.08"/>

  <!-- Characters (Real-world interaction: A person pointing out and counting the floors of the building) -->
  <!-- Character 1: Tourist / Resident pointing -->
  <g id="characterPointing">
    <!-- Body -->
    <path d="M165,210 C165,195 175,190 178,180 C180,173 178,165 178,165" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="178" cy="155" r="9" fill="#fb923c"/>
    <!-- Hair -->
    <path d="M170,152 C172,146 184,146 186,152 Z" fill="#334155"/>
    <!-- Arm pointing towards the building -->
    <path d="M175,175 L150,165" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="147" cy="164" r="2.5" fill="#fb923c"/>
    <!-- Legs -->
    <path d="M168,210 V190" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M178,210 V190" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Companion listening/looking -->
  <g id="characterListening">
    <!-- Body -->
    <data/>
    <path d="M195,210 C195,195 190,190 188,180 C186,173 188,165 188,165" stroke="#ec4899" stroke-width="7" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="188" cy="156" r="8" fill="#fb923c"/>
    <!-- Hair -->
    <path d="M180,153 C182,147 194,147 196,153 C196,158 180,158 180,153" fill="#1e293b"/>
    <!-- Legs -->
    <path d="M190,210 V192" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M198,210 V192" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Cute floating particle effects / architectural dimension lines subtle hint -->
  <line x1="62" y1="40" x2="62" y2="210" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <polyline points="59,40 62,35 65,40" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <polyline points="59,210 62,215 65,210" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
</svg>