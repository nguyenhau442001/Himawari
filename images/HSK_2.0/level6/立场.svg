<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="15" rx="2" fill="#334155"/>
  <rect x="50" y="155" width="10" height="60" fill="#475569"/>
  <rect x="180" y="155" width="10" height="60" fill="#475569"/>
  
  <!-- The Subject (The man holding his ground) -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 100 Q-30 40 0 40 T30 100" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="20" fill="#fde68a"/>
    <!-- Determined Face -->
    <line x1="-8" y1="15" x2="-4" y2="15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="15" x2="8" y2="15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6 25 Q0 30 6 25" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arms crossed -->
    <path d="M-25 50 L-10 65 L10 65 L25 50" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Opposing party (The pressure) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="0" r="15" fill="#94a3b8"/>
    <path d="M-15 15 L-5 40 L5 40 L15 15" fill="#94a3b8"/>
    <!-- Pointing finger -->
    <rect x="15" y="-5" width="20" height="4" rx="2" fill="#fb923c"/>
  </g>
  
  <!-- Documents on desk -->
  <rect x="70" y="142" width="30" height="40" rx="2" fill="#f1f5f9"/>
  <line x1="75" y1="150" x2="95" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="75" y1="160" x2="95" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  
  <!-- Decorative background elements -->
  <rect x="160" y="40" width="40" height="60" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="180" cy="70" r="10" fill="#10b981"/>
</svg>