<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ground Line -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#3A3F4B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ground Subsidence / Crack -->
  <path d="M100 180 L110 195 L125 180 L140 190 L150 180" stroke="#FF5722" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="125" cy="198" r="2" fill="#FF5722"/>

  <!-- Collapsing House (Iconic Object for "塌" - collapse/cave-in) -->
  <g transform="translate(120, 115)">
    <!-- Falling Roof (Tilted) -->
    <path d="M-65 -10 L0 -65 L65 -10 Z" fill="#FF8A65" stroke="#1A1D24" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Roof Tile Detail / Accent -->
    <path d="M-45 -25 L0 -60 L45 -25" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Wall (Standing/Slightly Leaning) -->
    <path d="M-55 -5 L-55 55 L-45 55 L-45 -5 Z" fill="#90CAF9" stroke="#1A1D24" stroke-width="2"/>

    <!-- Right Wall (Collapsing inward/broken) -->
    <path d="M45 -5 L55 55 L35 50 L40 -5 Z" fill="#64B5F6" stroke="#1A1D24" stroke-width="2"/>

    <!-- Interior Debris / Fallen Blocks -->
    <rect x="-20" y="30" width="16" height="16" rx="2" fill="#E0E0E0" transform="rotate(15 -20 30)" stroke="#1A1D24" stroke-width="1.5"/>
    <rect x="5" y="38" width="14" height="14" rx="2" fill="#BDBDBD" transform="rotate(-25 5 38)" stroke="#1A1D24" stroke-width="1.5"/>
    <polygon points="-10,50 15,55 -5,60" fill="#9E9E9E" stroke="#1A1D24" stroke-width="1.5"/>

    <!-- Dust / Impact Clouds (Focus Accent) -->
    <circle cx="-55" cy="55" r="8" fill="#37474F" opacity="0.8"/>
    <circle cx="-65" cy="58" r="5" fill="#37474F" opacity="0.6"/>
    <circle cx="55" cy="52" r="9" fill="#37474F" opacity="0.8"/>
    <circle cx="68" cy="56" r="6" fill="#37474F" opacity="0.6"/>
  </g>

  <!-- Focus / Motion Indicator (Downward Force Lines) -->
  <g stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="85" y1="65" x2="85" y2="85"/>
    <line x1="155" y1="65" x2="155" y2="85"/>
    <!-- Arrowheads -->
    <polyline points="80,80 85,88 90,80" fill="none"/>
    <polyline points="150,80 155,88 160,80" fill="none"/>
  </g>

</svg>