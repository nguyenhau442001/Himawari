  <!-- Lock Icon (Abstract representation of security) -->
  <path d="M180 40h20v20h-20z" fill="#10b981"/>
  <path d="M185 40v-5a5 5 0 0 1 10 0v5" fill="none" stroke="#10b981" stroke-width="3"/>
