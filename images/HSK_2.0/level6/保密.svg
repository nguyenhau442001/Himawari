<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>

  <!-- Document with Confidential Stamp/Seal visual -->
  <path d="M90 110h60v70H90z" fill="#f1f5f9"/>
  <path d="M100 125h40v5H100zM100 135h40v5H100zM100 145h25v5H100z" fill="#94a3b8"/>
  <circle cx="120" cy="160" r="12" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M112 160l5 5 10-10" stroke="#ec4899" stroke-width="2" fill="none"/>

  <!-- Character (Upper body) -->
  <g transform="translate(60, 60)">
