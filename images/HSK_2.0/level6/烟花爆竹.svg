<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Glowing background aura for fireworks -->
    <circle cx="120" cy="85" r="55" fill="#FF5722" opacity="0.1" filter="blur(8px)"/>
    <circle cx="120" cy="85" r="35" fill="#FFC107" opacity="0.15" filter="blur(4px)"/>

    <!-- Fireworks burst on top -->
    <g stroke-linecap="round" stroke-width="3">
      <!-- Center spark -->
      <circle cx="120" cy="85" r="4" fill="#FFEB3B"/>
      
      <!-- Rays/Sparks -->
      <line x1="120" y1="85" x2="120" y2="45" stroke="#FF5722"/>
      <line x1="120" y1="85" x2="120" y2="125" stroke="#FF5722"/>
      <line x1="120" y1="85" x2="80" y2="85" stroke="#FF5722"/>
      <line x1="120" y1="85" x2="160" y2="85" stroke="#FF5722"/>
      
      <line x1="120" y1="85" x2="92" y2="57" stroke="#FFC107"/>
      <line x1="120" y1="85" x2="148" y2="57" stroke="#FFC107"/>
      <line x1="120" y1="85" x2="92" y2="113" stroke="#FFC107"/>
      <line x1="120" y1="85" x2="148" y2="113" stroke="#FFC107"/>
    </g>

    <!-- Sparkle dots -->
    <circle cx="138" cy="40" r="2" fill="#FFF" opacity="0.8"/>
    <circle cx="95" cy="48" r="1.5" fill="#FFEB3B" opacity="0.9"/>
    <circle cx="155" cy="72" r="2" fill="#FF5722" opacity="0.8"/>
    <circle cx="82" cy="70" r="1.5" fill="#FFF" opacity="0.7"/>

    <!-- Firecracker String (Baozhu) at the bottom -->
    <g transform="translate(120, 140)">
      <!-- Central vertical fuse/rope -->
      <line x1="0" y1="-25" x2="0" y2="65" stroke="#795548" stroke-width="2.5" stroke-dasharray="3,3"/>

      <!-- Firecracker cylinders (Pairs stacked vertically) -->
      <!-- Row 1 -->
      <rect x="-18" y="-20" width="14" height="22" rx="3" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <rect x="4" y="-20" width="14" height="22" rx="3" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <!-- Gold bands Row 1 -->
      <rect x="-18" y="-13" width="14" height="3" fill="#FFD700"/>
      <rect x="4" y="-13" width="14" height="3" fill="#FFD700"/>

      <!-- Row 2 -->
      <rect x="-18" y="6" width="14" height="22" rx="3" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <rect x="4" y="6" width="14" height="22" rx="3" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <!-- Gold bands Row 2 -->
      <rect x="-18" y="13" width="14" height="3" fill="#FFD700"/>
      <rect x="4" y="13" width="14" height="3" fill="#FFD700"/>

      <!-- Row 3 -->
      <rect x="-18" y="32" width="14" height="22" rx="3" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <rect x="4" y="32" width="14" height="22" rx="3" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <!-- Gold bands Row 3 -->
      <rect x="-18" y="39" width="14" height="3" fill="#FFD700"/>
      <rect x="4" y="39" width="14" height="3" fill="#FFD700"/>
      
      <!-- Top burning fuse sparkle -->
      <path d="M 0,-25 L -4,-33 M 0,-25 L 3,-32" stroke="#FFEB3B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-5" cy="-34" r="2" fill="#FF5722"/>
    </g>
  </g>
</svg>