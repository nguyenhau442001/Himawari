<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="180" y="150" width="10" height="90" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="90" rx="2" fill="#334155"/>
  
  <!-- Character 1: The one ignoring (The "He") -->
  <g transform="translate(140, 80)">
    <circle cx="30" cy="30" r="25" fill="#fbbf24"/>
    <path d="M15 35 Q30 45 45 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#0f172a"/>
    <circle cx="40" cy="25" r="3" fill="#0f172a"/>
    <rect x="10" y="60" width="40" height="80" rx="10" fill="#38bdf8"/>
    <rect x="15" y="70" width="30" height="10" rx="2" fill="#0f172a"/>
  </g>
  
  <!-- Character 2: The one speaking -->
  <g transform="translate(40, 100)">
    <circle cx="30" cy="30" r="20" fill="#fca5a5"/>
    <path d="M20 45 Q30 35 40 45" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="22" cy="25" r="2" fill="#0f172a"/>
    <circle cx="38" cy="25" r="2" fill="#0f172a"/>
    <path d="M25 55 L35 55" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <rect x="15" y="55" width="30" height="70" rx="8" fill="#fb923c"/>
  </g>
  
  <!-- Speech Bubble (Visualizing the ignored words) -->
  <path d="M75 90 L100 70 L90 100 Z" fill="#ec4899"/>
  <circle cx="110" cy="60" r="8" fill="#ec4899" opacity="0.6"/>
  <circle cx="125" cy="50" r="5" fill="#ec4899" opacity="0.4"/>
  
  <!-- Laptop on desk -->
  <rect x="130" y="125" width="60" height="40" rx="4" fill="#64748b"/>
  <rect x="135" y="130" width="50" height="30" fill="#0f172a"/>
  <rect x="140" y="135" width="40" height="2" fill="#38bdf8"/>
  <rect x="140" y="140" width="30" height="2" fill="#38bdf8"/>
  <rect x="140" y="145" width="20" height="2" fill="#38bdf8"/>
</svg>