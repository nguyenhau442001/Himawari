<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Desk Lamp Light -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Background / Office Architecture -->
  <!-- Bookshelf Background Left -->
  <rect x="18" y="50" width="40" height="110" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="22" y="70" width="32" height="4" fill="#475569"/>
  <rect x="22" y="100" width="32" height="4" fill="#475569"/>
  <rect x="22" y="130" width="32" height="4" fill="#475569"/>
  <!-- Colorful books on shelf -->
  <rect x="26" y="58" width="6" height="12" rx="1" fill="#ec4899"/>
  <rect x="34" y="55" width="8" height="15" rx="1" fill="#38bdf8"/>
  <rect x="44" y="60" width="5" height="10" rx="1" fill="#10b981"/>

  <!-- Window Frame Right -->
  <rect x="185" y="40" width="35" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="202" y1="40" x2="202" y2="115" stroke="#334155" stroke-width="2"/>
  <line x1="185" y1="77" x2="220" y2="77" stroke="#334155" stroke-width="2"/>
  
  <!-- Moonlight Beam from Window -->
  <polygon points="185,40 220,40 240,160 120,160" fill="url(#lightBeam)"/>

  <!-- Wall Clock showing late time (e.g., 9:15) -->
  <circle cx="120" cy="35" r="14" fill="#334155" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="35" r="11" fill="#1e293b"/>
  <line x1="120" y1="35" x2="120" y2="28" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="35" x2="127" y2="38" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Teacher's Desk -->
  <rect x="70" y="135" width="135" height="12" rx="2" fill="#475569"/>
  <rect x="85" y="147" width="10" height="45" fill="#334155"/>
  <rect x="180" y="147" width="10" height="45" fill="#334155"/>

  <!-- Desk Props: Stack of Graded Papers & Globe/Lamp -->
  <rect x="85" y="123" width="22" height="12" rx="1" fill="#f8fafc" transform="rotate(-5 85 123)"/>
  <rect x="84" y="126" width="22" height="12" rx="1" fill="#cbd5e1" transform="rotate(2 84 126)"/>
  <rect x="87" y="121" width="18" height="12" rx="1" fill="#f1f5f9"/>
  <!-- Red Pen / Checkmark on top paper -->
  <path d="M92 126 L95 129 L100 123" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Desk Lamp -->
  <path d="M165 135 L170 105 L180 105 L185 135 Z" fill="#64748b"/>
  <path d="M162 102 C162 95 188 95 188 102 Z" fill="#fbbf24"/>
  <circle cx="175" cy="105" r="30" fill="url(#lampGlow)"/>

  <!-- CHARACTER 1: Teacher (Right side, sitting behind desk, compassionate expression) -->
  <g id="teacher">
    <!-- Teacher Body / Shirt -->
    <path d="M135 155 L165 155 L172 190 L128 190 Z" fill="#38bdf8"/>
    <!-- Collar / Tie -->
    <polygon points="145,155 155,155 150,170" fill="#f8fafc"/>
    <polygon points="148,168 152,168 153,182 150,186 147,182" fill="#ef4444"/>

    <!-- Teacher Head & Hair -->
    <circle cx="150" cy="132" r="16" fill="#fcd34d"/>
    <!-- Hair style -->
    <path d="M136 130 C136 118 164 118 164 130 C160 123 140 123 136 130 Z" fill="#475569"/>

    <!-- Glasses -->
    <circle cx="144" cy="131" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="156" cy="131" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="149" y1="131" x2="151" y2="131" stroke="#64748b" stroke-width="1.5"/>

    <!-- Friendly Smile -->
    <path d="M146 140 Q150 144 154 140" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Teacher Arm pointing/gesturing acceptance -->
    <path d="M135 160 C125 162 115 165 110 160" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="107" cy="158" r="4" fill="#fcd34d"/>
  </g>


  <!-- CHARACTER 2: Student (Left side, leaning forward, handing over late homework with hopeful/grateful expression) -->
  <g id="student">
    <!-- Student Body / Hoodie -->
    <path d="M40 190 L75 190 L70 150 L50 150 Z" fill="#10b981"/>
    <!-- Hoodie Pocket -->
    <path d="M50 175 L65 175 L63 188 L52 188 Z" fill="#047857"/>

    <!-- Student Head & Hair -->
    <circle cx="58" cy="135" r="15" fill="#fcd34d"/>
    <!-- Spiky Hair -->
    <path d="M45 130 C45 120 60 118 70 125 C70 120 72 125 73 130 C73 130 68 128 65 130 Z" fill="#1e293b"/>

    <!-- Earnest Face & Expression -->
    <!-- Eyes (grateful, looking up slightly) -->
    <circle cx="63" cy="134" r="2" fill="#1e293b"/>
    <!-- Shy/Hopeful Smile -->
    <path d="M57 142 Q62 146 66 141" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Slight anxious blush -->
    <ellipse cx="66" cy="138" rx="2.5" ry="1.5" fill="#f43f5e" opacity="0.4"/>

    <!-- Student Arm outstretched holding the paper -->
    <path d="M68 158 Q85 155 98 150" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="149" r="3.5" fill="#fcd34d"/>

    <!-- The Late Homework Paper being handed over -->
    <polygon points="95,142 115,138 118,155 98,159" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Text lines placeholder on paper -->
    <line x1="100" y1="146" x2="110" y2="144" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="150" x2="112" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="154" x2="107" y2="152" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Floor / Base shadow -->
  <rect x="0" y="215" width="240" height="25" fill="#090d16"/>
  <ellipse cx="120" cy="215" rx="110" ry="6" fill="#020617" opacity="0.5"/>

</svg>