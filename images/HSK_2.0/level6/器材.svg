<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with dark slate gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- School Gym / Sports Hall Background Elements -->
  <!-- Back Wall & Floor Line -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b"/>
  <polygon points="0,170 240,170 240,240 0,240" fill="url(#floorGrad)"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2"/>
  
  <!-- Basketball Hoop on the Wall (Context) -->
  <path d="M195,50 L225,50 L210,80 Z" fill="none" stroke="#64748b" stroke-width="3"/>
  <line x1="210" y1="80" x2="210" y2="110" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="210" cy="110" rx="12" ry="5" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Window with warm/cool gym lighting -->
  <rect x="15" y="30" width="45" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <line x1="37.5" y1="30" x2="37.5" y2="100" stroke="#475569" stroke-width="1.5"/>
  <line x1="15" y1="65" x2="60" y2="65" stroke="#475569" stroke-width="1.5"/>
  <polygon points="37.5,65 120,240 0,240" fill="url(#sunbeam)"/>

  <!-- NEW SPORTS EQUIPMENT (体育器材) - The core visual subject -->
  
  <!-- 1. Equipment Rack / Cart holding items -->
  <rect x="75" y="115" width="65" height="75" rx="3" fill="none" stroke="#64748b" stroke-width="3"/>
  <line x1="75" y1="135" x2="140" y2="135" stroke="#64748b" stroke-width="2"/>
  <line x1="75" y1="160" x2="140" y2="160" stroke="#64748b" stroke-width="2"/>
  <circle cx="82" cy="193" r="4" fill="#94a3b8"/>
  <circle cx="133" cy="193" r="4" fill="#94a3b8"/>
  <line x1="82" y1="190" x2="82" y2="175" stroke="#64748b" stroke-width="3"/>
  <line x1="133" y1="190" x2="133" y2="175" stroke="#64748b" stroke-width="3"/>

  <!-- 2. Equipment on/around the rack (Basketballs, Volleyball, Badminton rackets) -->
  <!-- Basketball -->
  <circle cx="95" cy="100" r="15" fill="#f97316"/>
  <path d="M95,85 C90,95 90,105 95,115 M80,100 C90,95 100,95 110,100 M82,90 C90,98 100,98 108,90 M82,110 C90,102 100,102 108,110" fill="none" stroke="#c2410c" stroke-width="1.5"/>
  
  <!-- Volleyball (White/Blue panels) -->
  <circle cx="123" cy="103" r="14" fill="#f8fafc"/>
  <path d="M115,92 Q123,103 131,92" fill="none" stroke="#0284c7" stroke-width="2"/>
  <path d="M112,112 Q123,103 134,112" fill="none" stroke="#0284c7" stroke-width="2"/>

  <!-- Badminton Rackets leaning on the side -->
  <line x1="62" y1="180" x2="72" y2="120" stroke="#cbd5e1" stroke-width="3"/>
  <ellipse cx="73" cy="112" rx="8" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="58" y1="185" x2="68" y2="125" stroke="#cbd5e1" stroke-width="3"/>
  <ellipse cx="69" cy="117" rx="8" ry="12" fill="none" stroke="#ec4899" stroke-width="2.5"/>

  <!-- 3. Balance cone / Traffic marker (New Equipment) -->
  <polygon points="155,185 175,185 168,145 162,145" fill="#f59e0b"/>
  <rect x="157" y="175" width="16" height="4" fill="#ffffff" rx="1"/>
  <rect x="161" y="155" width="8" height="4" fill="#ffffff" rx="1"/>
  <ellipse cx="165" cy="185" rx="13" ry="4" fill="#d97706"/>

  <!-- EXPRESSIVE CHARACTERS (Students/Teacher organizing new equipment) -->
  
  <!-- Character 1: Student carrying a new ball / standing happy -->
  <g transform="translate(25, 110)">
    <!-- Body & Clothes -->
    <path d="M30,45 L45,70 L35,75 L20,50 Z" fill="#3b82f6"/>
    <path d="M15,45 L30,45 L35,70 L20,70 Z" fill="#2563eb"/>
    <!-- Legs -->
    <line x1="22" y1="70" x2="18" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="32" y1="70" x2="36" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <!-- Head & Face -->
    <circle cx="28" cy="25" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M14,23 C14,12 24,10 32,13 C38,15 42,22 42,22 C42,22 36,18 30,18 C22,18 16,21 14,23 Z" fill="#334155"/>
    <!-- Eyes & Smile -->
    <circle cx="24" cy="24" r="2" fill="#1e293b"/>
    <circle cx="34" cy="24" r="2" fill="#1e293b"/>
    <path d="M27,30 Q30,34 33,30" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arms holding a green football/soccer ball -->
    <path d="M38,38 L45,48 L35,52" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="48" r="12" fill="#10b981"/>
    <!-- Soccer ball pattern hints -->
    <polygon points="45,41 48,45 45,49 42,45" fill="#ffffff"/>
  </g>

  <!-- Character 2: Teacher/Student pointing at the new equipment proudly -->
  <g transform="translate(160, 95)">
    <!-- Body -->
    <path d="M20,40 L35,70 L25,75 L10,50 Z" fill="#ec4899"/>
    <!-- Legs -->
    <line x1="14" y1="70" x2="10" y2="125" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="26" y1="70" x2="28" y2="125" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="18" cy="20" r="13" fill="#fcd34d"/>
    <!-- Hair (Ponytail) -->
    <path d="M5,15 C5,5 20,5 25,12 C30,18 28,25 35,28" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="14" cy="19" r="1.5" fill="#1e293b"/>
    <circle cx="22" cy="19" r="1.5" fill="#1e293b"/>
    <path d="M16,25 Q18,28 20,25" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm pointing towards equipment -->
    <path d="M10,38 L-5,30" fill="none" stroke="#fcd34d" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / New Item Highlight indicators (Visual reinforcement of "new/添置") -->
  <g fill="#fbbf24">
    <path d="M 125,55 Q 125,65 135,65 Q 125,65 125,75 Q 125,65 115,65 Q 125,65 125,55 Z"/>
    <path d="M 60,85 Q 60,92 67,92 Q 60,92 60,99 Q 60,92 53,92 Q 60,92 60,85 Z"/>
    <path d="M 180,130 Q 180,136 186,136 Q 180,136 180,142 Q 180,136 174,136 Q 180,136 180,130 Z"/>
  </g>

</svg>