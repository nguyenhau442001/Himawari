<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Rock/Mountain Gradients -->
    <linearGradient id="rock-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rock-layer-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="rock-layer-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="rock-layer-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Light Glow -->
    <radialGradient id="headlamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- DISTANT SCENERY / CAVE BACKGROUND -->
  <!-- Stalactites -->
  <path d="M20 0 L35 45 L50 0 Z" fill="#334155" />
  <path d="M80 0 L95 30 L110 0 Z" fill="#334155" />
  <path d="M160 0 L175 55 L190 0 Z" fill="#334155" />

  <!-- Geological Strata Wall (Cliffside / Outcrop) -->
  <g transform="translate(10, 30)">
    <!-- Rock background body -->
    <path d="M0 20 L220 20 L220 180 L0 180 Z" fill="url(#rock-base)" opacity="0.4" />
    
    <!-- Distinct geological strata layers (folded earth crust) -->
    <path d="M10 30 Q 70 15, 130 40 T 220 30 L 220 65 Q 150 75, 90 55 T 10 70 Z" fill="url(#rock-layer-1)" />
    <path d="M10 75 Q 80 90, 140 70 T 220 85 L 220 120 Q 140 135, 70 110 T 10 125 Z" fill="url(#rock-layer-2)" />
    <path d="M10 130 Q 60 115, 120 145 T 220 135 L 220 170 Q 130 185, 70 160 T 10 175 Z" fill="url(#rock-layer-3)" />

    <!-- Fault line / Crack -->
    <path d="M 90 35 L 105 70 L 98 110 L 115 160" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.7" />
    <path d="M 160 25 L 155 60 L 170 95 L 165 145" stroke="#0f172a" stroke-width="2" fill="none" opacity="0.5" />
  </g>

  <!-- FOREGROUND ENVIRONMENT PROPS -->
  <!-- Rock sample sitting on a outcrop ledge -->
  <g transform="translate(160, 150)">
    <path d="M0 20 L25 5 L45 25 L10 35 Z" fill="#64748b" />
    <path d="M25 5 L45 25 L35 38 L10 35 Z" fill="#475569" />
    <!-- Crystal glint inside rock -->
    <polygon points="25,18 28,14 31,20 27,22" fill="#38bdf8" />
  </g>

  <!-- Geological Hammer / Pick resting nearby -->
  <g transform="translate(195, 130) rotate(25)">
    <rect x="0" y="0" width="6" height="40" rx="3" fill="#cbd5e1" />
    <path d="M-8 -4 L14 -4 L10 -12 L-4 -12 Z" fill="#475569" />
    <path d="M-12 -8 L-4 -12 L-4 -4 Z" fill="#334155" />
  </g>

  <!-- MAIN CHARACTER: GEOLOGIST EXPERT -->
  <!-- Character positioned examining the rock face closely -->
  <g transform="translate(40, 75)">
    <!-- Body / Torso (Vest with pockets typical of field geologists) -->
    <path d="M35 70 L65 70 L75 125 L25 125 Z" fill="#0284c7" />
    <!-- Vest details / pockets -->
    <rect x="33" y="85" width="12" height="15" rx="2" fill="#0369a1" />
    <rect x="55" y="85" width="12" height="15" rx="2" fill="#0369a1" />
    <path d="M35 70 L50 95 L65 70" fill="#f8fafc" /> <!-- Shirt collar V -->

    <!-- Back Arm / Supporting -->
    <path d="M30 75 Q 15 90, 25 105" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Head & Hard Hat -->
    <!-- Neck -->
    <rect x="42" y="45" width="16" height="18" fill="#fbcfe8" />
    
    <!-- Head -->
    <circle cx="50" cy="40" r="15" fill="#fcd34d" /> <!-- Face silhouette -->
    
    <!-- Friendly / Focused facial expression -->
    <!-- Glasses (Expert look) -->
    <rect x="40" y="32" width="10" height="7" rx="2" fill="none" stroke="#334155" stroke-width="1.5" />
    <rect x="52" y="32" width="10" height="7" rx="2" fill="none" stroke="#334155" stroke-width="1.5" />
    <line x1="50" y1="35" x2="52" y2="35" stroke="#334155" stroke-width="1.5" />
    <!-- Eye dot looking at rock -->
    <circle cx="57" cy="35" r="1.5" fill="#1e293b" />
    <!-- Confident smile -->
    <path d="M48 44 Q 52 47, 56 44" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Hair -->
    <path d="M35 35 Q 50 20, 65 35 L 65 30 Q 50 15, 35 30 Z" fill="#451a03" />

    <!-- Safety Hard Hat (Yellow) -->
    <path d="M32 28 Q 50 10, 68 28 L 72 32 L 28 32 Z" fill="#fbbf24" />
    <ellipse cx="50" cy="27" rx="20" ry="5" fill="#f59e0b" />

    <!-- Headlamp on Helmet (emitting light) -->
    <rect x="46" y="22" width="8" height="6" rx="2" fill="#e2e8f0" />
    <path d="M54 25 L 115 50 L 115 5 Z" fill="url(#headlamp-glow)" opacity="0.6" />

    <!-- Forward Arm holding Magnifying Glass examining strata -->
    <!-- Upper arm -->
    <path d="M62 75 Q 80 80, 85 95" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Forearm -->
    <path d="M85 95 L 105 105" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Magnifying Glass Prop -->
    <!-- Handle -->
    <line x1="105" y1="105" x2="120" y2="112" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <!-- Rim -->
    <circle cx="100" cy="98" r="14" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <!-- Lens glass reflection -->
    <circle cx="100" cy="98" r="12" fill="#38bdf8" fill-opacity="0.25" />
    <path d="M92 92 Q 96 90, 102 94" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- ADDITIONAL SCIENTIFIC / FIELD CONTEXT PROPS -->
  <!-- Clipboard / Field notebook on the ground with geological map sketches -->
  <g transform="translate(25, 175) rotate(-10)">
    <!-- Board -->
    <rect x="0" y="0" width="35" height="45" rx="3" fill="#cbd5e1" />
    <!-- Paper -->
    <rect x="3" y="3" width="29" height="39" rx="2" fill="#f8fafc" />
    <!-- Clip -->
    <rect x="11" y="-2" width="13" height="5" rx="1" fill="#475569" />
    <!-- Colored Stratum Lines on Paper (Map/Diagram) -->
    <path d="M6 12 Q 15 8, 29 15" stroke="#d97706" stroke-width="3" fill="none" />
    <path d="M6 20 Q 18 24, 29 19" stroke="#059669" stroke-width="3" fill="none" />
    <path d="M6 30 Q 14 28, 29 32" stroke="#475569" stroke-width="2.5" fill="none" />
    <!-- Compass icon drawn -->
    <circle cx="18" cy="35" r="4" fill="none" stroke="#dc2626" stroke-width="1" />
    <polygon points="18,32 19,35 18,38 17,35" fill="#dc2626" />
  </g>

  <!-- Ambient glowing crystal cluster in foreground corner -->
  <g transform="translate(210, 195)">
    <polygon points="0,15 5,-5 10,15" fill="#a855f7" />
    <polygon points="8,20 13,-2 18,20" fill="#c084fc" />
    <polygon points="14,18 20,5 24,20" fill="#e879f9" />
    <!-- Glow aura -->
    <circle cx="12" cy="10" r="18" fill="#d946ef" opacity="0.2" filter="blur(4px)" />
  </g>

</svg>