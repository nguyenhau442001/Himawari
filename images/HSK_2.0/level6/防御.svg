<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="stone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment (Night sky, distant hills, stars) -->
  <circle cx="40" cy="50" r="1.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="190" cy="35" r="1" fill="#94a3b8" opacity="0.8" />
  <circle cx="210" cy="70" r="1.5" fill="#94a3b8" opacity="0.5" />
  <circle cx="65" cy="80" r="1" fill="#94a3b8" opacity="0.4" />
  
  <path d="M 0 160 Q 60 140 120 155 T 240 150 L 240 240 L 0 240 Z" fill="#090d16" />

  <!-- Castle Structure (这座城堡有很强的防御能力) -->
  <!-- Outer Wall Left -->
  <path d="M 20 200 L 20 130 L 60 130 L 60 200 Z" fill="url(#stone-grad)" />
  <!-- Wall texture lines -->
  <line x1="20" y1="150" x2="60" y2="150" stroke="#1e293b" stroke-width="2" />
  <line x1="20" y1="175" x2="60" y2="175" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Wall Right -->
  <path d="M 180 200 L 180 130 L 220 130 L 220 200 Z" fill="url(#stone-grad)" />
  <line x1="180" y1="150" x2="220" y2="150" stroke="#1e293b" stroke-width="2" />
  <line x1="180" y1="175" x2="220" y2="175" stroke="#1e293b" stroke-width="2" />

  <!-- Main Keep / Tower -->
  <path d="M 70 210 L 70 100 L 170 100 L 170 210 Z" fill="url(#stone-grad)" />
  <!-- Brick pattern on keep -->
  <line x1="70" y1="120" x2="170" y2="120" stroke="#1e293b" stroke-width="2" />
  <line x1="70" y1="145" x2="170" y2="145" stroke="#1e293b" stroke-width="2" />
  <line x1="70" y1="170" x2="170" y2="170" stroke="#1e293b" stroke-width="2" />
  <line x1="70" y1="195" x2="170" y2="195" stroke="#1e293b" stroke-width="2" />

  <!-- Crenellations (防御 Battlements) -->
  <!-- Left Wall Crenellations -->
  <path d="M 15 130 L 15 120 L 25 120 L 25 130 L 35 130 L 35 120 L 45 120 L 45 130 L 55 130 L 55 120 L 65 120 L 65 130 Z" fill="#475569" />
  <!-- Right Wall Crenellations -->
  <path d="M 175 130 L 175 120 L 185 120 L 185 130 L 195 130 L 195 120 L 205 120 L 205 130 L 215 130 L 215 120 L 225 120 L 225 130 Z" fill="#475569" />
  <!-- Keep Crenellations -->
  <path d="M 65 100 L 65 90 L 77 90 L 77 100 L 89 100 L 89 90 L 101 90 L 101 100 L 113 100 L 113 90 L 125 90 L 125 100 L 137 100 L 137 90 L 149 90 L 149 100 L 161 100 L 161 90 L 173 90 L 173 100 Z" fill="#475569" />

  <!-- Castle Gate (Reinforced) -->
  <path d="M 100 210 L 100 160 Q 120 145 140 160 L 140 210 Z" fill="#1e293b" />
  <!-- Iron portcullis bars -->
  <line x1="110" y1="165" x2="110" y2="210" stroke="#64748b" stroke-width="3" />
  <line x1="120" y1="160" x2="120" y2="210" stroke="#64748b" stroke-width="3" />
  <line x1="130" y1="165" x2="130" y2="210" stroke="#64748b" stroke-width="3" />
  <line x1="105" y1="180" x2="135" y2="180" stroke="#64748b" stroke-width="3" />
  <line x1="105" y1="195" x2="135" y2="195" stroke="#64748b" stroke-width="3" />

  <!-- Glowing Defensive Energy Shield (Visualizing "强防御能力" - Strong Defense Capability) -->
  <path d="M 50 110 Q 120 60 190 110 L 190 190 Q 120 220 50 190 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  <path d="M 40 100 Q 120 45 200 100 L 200 200 Q 120 235 40 200 Z" fill="#38bdf8" opacity="0.1" />

  <!-- Defensive Magic Runes / Nodes on Shield -->
  <circle cx="120" cy="75" r="4" fill="#fbbf24" />
  <circle cx="75" cy="100" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="165" cy="100" r="3" fill="#fbbf24" opacity="0.8" />

  <!-- Expressive Character (Guard/Defender standing proudly on top) -->
  <!-- Body / Armor -->
  <path d="M 112 85 L 128 85 L 132 105 L 108 105 Z" fill="#cbd5e1" />
  <rect x="114" y="90" width="12" height="12" rx="2" fill="#0284c7" />
  
  <!-- Head & Helmet -->
  <circle cx="120" cy="74" r="7" fill="#fde047" />
  <!-- Helmet -->
  <path d="M 111 72 Q 120 63 129 72 L 127 68 L 113 68 Z" fill="#64748b" />
  <path d="M 120 63 L 120 67" stroke="#fbbf24" stroke-width="2" /> <!-- Plume/crest -->

  <!-- Holding a large defensive shield -->
  <path d="M 103 80 Q 95 90 103 105 L 112 100 L 112 85 Z" fill="url(#shield-grad)" />
  <path d="M 103 80 Q 95 90 103 105" fill="none" stroke="#e0f2fe" stroke-width="1.5" />

  <!-- Flying projectiles bouncing off the defense (Action context) -->
  <!-- Incoming projectile 1 (bouncing away) -->
  <circle cx="65" cy="95" r="3" fill="#f97316" />
  <path d="M 45 80 L 63 93" stroke="#f97316" stroke-width="2" stroke-linecap="round" />
  <!-- Bounce vector -->
  <path d="M 67 93 L 55 70" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Incoming projectile 2 (blocked by energy field) -->
  <circle cx="170" cy="140" r="3" fill="#f97316" />
  <path d="M 195 130 L 173 138" stroke="#f97316" stroke-width="2" stroke-linecap="round" />
  <!-- Impact spark -->
  <circle cx="170" cy="140" r="6" fill="#fbbf24" opacity="0.7" />

  <!-- Ground details / Foreground foliage -->
  <path d="M 0 240 L 0 220 Q 30 215 50 230 Q 70 210 90 235 L 240 235 L 240 240 Z" fill="#0f172a" />
  <circle cx="20" cy="230" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="225" cy="225" r="2.5" fill="#38bdf8" opacity="0.4" />
</svg>