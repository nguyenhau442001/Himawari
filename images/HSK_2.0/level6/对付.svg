<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Warning / Hard Problem Glow -->
    <radialGradient id="warningGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Warning Glow behind the complex task -->
  <circle cx="120" cy="95" r="55" fill="url(#warningGlow)" />

  <!-- WINDOW / BACKGROUND OFFICE CONTEXT -->
  <!-- Window Frame -->
  <path d="M165 40 L210 50 L210 115 L165 105 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <!-- Cityscape silhouette outside -->
  <path d="M172 103 L172 75 L180 70 L180 103 Z M185 103 L185 60 L195 55 L195 103 Z M200 103 L200 80 L206 75 L206 103 Z" fill="#334155" opacity="0.6" />

  <!-- Bookshelf / Office Props in background -->
  <rect x="25" y="45" width="35" height="70" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="65" x2="60" y2="65" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="85" x2="60" y2="85" stroke="#334155" stroke-width="1.5" />
  <!-- Colorful books on shelf -->
  <rect x="29" y="52" width="6" height="13" rx="1" fill="#ec4899" />
  <rect x="37" y="50" width="8" height="15" rx="1" fill="#38bdf8" />
  <rect x="48" y="53" width="7" height="12" rx="1" fill="#f59e0b" />

  <!-- DESK SURFACE -->
  <path d="M15 180 L225 180 L210 205 L30 205 Z" fill="url(#deskGrad)" />
  <path d="M15 180 L225 180 L225 184 L15 184 Z" fill="#475569" />

  <!-- LARGE COMPLEX TASK / PUZZLE BOARD ON DESK -->
  <rect x="75" y="60" width="90" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Screen internal grid / tangled problem elements -->
  <rect x="83" y="68" width="74" height="42" rx="3" fill="url(#screenGrad)" stroke="#334155" stroke-width="1" />
  <!-- Tangled Chart / Bug lines (Representing the "hard problem") -->
  <path d="M92 95 Q 105 75, 120 95 T 148 80" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  <path d="M92 85 Q 110 105, 125 85 T 150 98" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3" />
  <!-- Warning badge on screen -->
  <circle cx="150" cy="78" r="5" fill="#ef4444" />
  <path d="M150 75 L150 79 M150 81 L150 81.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Stand for the board/monitor -->
  <path d="M110 130 L130 130 L135 150 L105 150 Z" fill="#475569" />
  <rect x="95" y="150" width="50" height="5" rx="2.5" fill="#64748b" />

  <!-- Coffee Mug with Steam -->
  <rect x="180" y="155" width="16" height="20" rx="3" fill="#cbd5e1" />
  <path d="M196 160 C 202 160, 202 170, 196 170" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
  <!-- Steam lines -->
  <path d="M185 148 C 183 144, 189 140, 187 135" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M191 150 C 193 146, 187 142, 189 137" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- CHARACTER (Stressed / Determined, trying to "deal with" the hard task) -->
  <!-- Body / Torso -->
  <path d="M85 205 C 85 180, 110 170, 120 170 C 130 170, 155 180, 155 205 Z" fill="#3b82f6" />
  <!-- Collar / Shirt details -->
  <path d="M105 170 L120 188 L135 170" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- Neck -->
  <rect x="110" y="155" width="20" height="20" fill="#fbcfe8" />

  <!-- Head -->
  <circle cx="120" cy="138" r="22" fill="#fbcfe8" />

  <!-- Hair (Messy / stressed from the hard problem) -->
  <path d="M98 135 C 96 120, 110 112, 125 114 C 140 112, 145 125, 144 138 C 140 130, 135 116, 120 117 C 105 116, 100 128, 98 135 Z" fill="#1e293b" />
  <path d="M115 115 C 115 108, 125 106, 130 112" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Facial Expression (Determined, furrowed brow dealing with the difficulty) -->
  <!-- Eyebrows (Slanted down in concentration) -->
  <path d="M107 132 L116 136" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M125 136 L134 132" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Eyes (Focused) -->
  <circle cx="112" cy="141" r="2" fill="#1e293b" />
  <circle cx="129" cy="141" r="2" fill="#1e293b" />
  <!-- Mouth (Determined straight/frown line) -->
  <path d="M115 152 L126 152" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Sweat drop (showing difficulty / stress) -->
  <path d="M139 133 C 142 137, 142 142, 139 142 C 136 142, 136 137, 139 133 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Arms / Hands actively working / dealing with the problem -->
  <!-- Left Arm -->
  <path d="M90 185 L75 160 L90 150" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Hand scratching head in perplexity -->
  <circle cx="95" cy="145" r="6" fill="#fbcfe8" />

  <!-- Right Arm (Pointing / fixing the issue) -->
  <path d="M150 185 L165 165 L150 150" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="145" cy="145" r="6" fill="#fbcfe8" />

  <!-- Desk clutter (Notepads, pens) -->
  <rect x="45" y="170" width="25" height="18" rx="2" fill="#cbd5e1" transform="rotate(-10 45 170)" />
  <line x1="50" y1="176" x2="65" y2="173" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="50" y1="181" x2="63" y2="178" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="165" y="175" width="8" height="25" rx="2" fill="#f43f5e" transform="rotate(25 165 175)" />

</svg>