<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Architecture / Office environment -->
  <!-- Window grid showing night city backdrop -->
  <g opacity="0.4">
    <rect x="140" y="30" width="70" height="90" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <line x1="175" y1="30" x2="175" y2="120" stroke="#334155" stroke-width="1.5" />
    <line x1="140" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="1.5" />
    <!-- City lights -->
    <rect x="148" y="40" width="8" height="12" rx="1" fill="#fbbf24" opacity="0.6"/>
    <rect x="160" y="45" width="10" height="8" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="185" y="38" width="12" height="15" rx="1" fill="#fbbf24" opacity="0.4"/>
    <rect x="150" y="85" width="10" height="10" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="180" y="90" width="15" height="12" rx="1" fill="#ec4899" opacity="0.5"/>
  </g>

  <!-- Ambient lighting from the project stats (representing the heavy cost) -->
  <polygon points="120,110 50,185 190,185" fill="url(#goldGlow)" filter="url(#glow)" />

  <!-- Bookshelf / Architecture props in background -->
  <rect x="25" y="45" width="40" height="80" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="70" x2="65" y2="70" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="95" x2="65" y2="95" stroke="#334155" stroke-width="1.5"/>
  <!-- Colorful books -->
  <rect x="30" y="53" width="6" height="17" rx="1" fill="#38bdf8"/>
  <rect x="38" y="55" width="8" height="15" rx="1" fill="#ec4899"/>
  <rect x="48" y="50" width="5" height="20" rx="1" fill="#fbbf24"/>
  <rect x="30" y="78" width="12" height="17" rx="1" fill="#10b981"/>

  <!-- Main Desk Surface -->
  <rect x="20" y="165" width="200" height="12" rx="3" fill="url(#deskGrad)" />
  <rect x="35" y="177" width="170" height="35" fill="#1e293b" opacity="0.4"/>

  <!-- Computer Setup showing complex blueprints/financial charts -->
  <g transform="translate(115, 95)">
    <!-- Monitor Stand -->
    <rect x="15" y="50" width="10" height="20" fill="#64748b" />
    <ellipse cx="20" cy="70" rx="18" ry="4" fill="#475569" />
    <!-- Monitor Frame -->
    <rect x="-25" y="0" width="90" height="52" rx="4" fill="#334155" />
    <rect x="-22" y="3" width="84" height="46" rx="2" fill="url(#screenGrad)" />
    <!-- Chart / Financial Graph on screen -->
    <path d="M-15 35 L-5 25 L10 30 L25 12 L40 18 L55 8" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glowing data points -->
    <circle cx="25" cy="12" r="3" fill="#ef4444" />
    <circle cx="55" cy="8" r="3" fill="#10b981" />
    <!-- Downward drain arrow (representing loss/consumption) -->
    <path d="M42 22 L52 22 L47 30 Z" fill="#ef4444"/>
  </g>

  <!-- Financial Documents / Blueprints scattered -->
  <g transform="translate(45, 140) rotate(-12)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#f8fafc" />
    <line x1="5" y1="8" x2="25" y2="8" stroke="#cbd5e1" stroke-width="2" />
    <line x1="5" y1="14" x2="30" y2="14" stroke="#cbd5e1" stroke-width="2" />
    <line x1="5" y1="20" x2="18" y2="20" stroke="#cbd5e1" stroke-width="2" />
    <!-- Red deficit stamp / mark -->
    <circle cx="25" cy="32" r="7" fill="none" stroke="#ef4444" stroke-width="2" />
    <line x1="21" y1="28" x2="29" y2="36" stroke="#ef4444" stroke-width="2" />
    <line x1="29" y1="28" x2="21" y2="36" stroke="#ef4444" stroke-width="2" />
  </g>

  <g transform="translate(85, 148) rotate(8)">
    <rect x="0" y="0" width="30" height="38" rx="2" fill="#f1f5f9" />
    <line x1="5" y1="8" x2="20" y2="8" stroke="#94a3b8" stroke-width="2" />
    <line x1="5" y1="14" x2="25" y2="14" stroke="#94a3b8" stroke-width="2" />
    <path d="M6 26 L12 20 L18 24 L24 16" fill="none" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Stacks of Gold Coins / Capital / Funds being depleted -->
  <!-- Stack 1 -->
  <g transform="translate(170, 140)">
    <ellipse cx="12" cy="30" rx="14" ry="5" fill="#d97706"/>
    <rect x="-2" y="24" width="28" height="6" fill="#f59e0b"/>
    <ellipse cx="12" cy="24" rx="14" ry="5" fill="#fbbf24"/>
    
    <ellipse cx="12" cy="18" rx="14" ry="5" fill="#d97706"/>
    <rect x="-2" y="12" width="28" height="6" fill="#f59e0b"/>
    <ellipse cx="12" cy="12" rx="14" ry="5" fill="#fbbf24"/>

    <ellipse cx="12" cy="6" rx="14" ry="5" fill="#d97706"/>
    <rect x="-2" y="0" width="28" height="6" fill="#f59e0b"/>
    <ellipse cx="12" cy="0" rx="14" ry="5" fill="#fbbf24"/>
  </g>

  <!-- Stack 2 (Taller, central focus of massive capital) -->
  <g transform="translate(195, 130)">
    <ellipse cx="12" cy="45" rx="16" ry="6" fill="#b45309"/>
    <rect x="-4" y="36" width="32" height="9" fill="#d97706"/>
    <ellipse cx="12" cy="36" rx="16" ry="6" fill="#f59e0b"/>

    <ellipse cx="12" cy="27" rx="16" ry="6" fill="#b45309"/>
    <rect x="-4" y="18" width="32" height="9" fill="#d97706"/>
    <ellipse cx="12" cy="18" rx="16" ry="6" fill="#f59e0b"/>

    <ellipse cx="12" cy="9" rx="16" ry="6" fill="#b45309"/>
    <rect x="-4" y="0" width="32" height="9" fill="#d97706"/>
    <ellipse cx="12" cy="0" rx="16" ry="6" fill="#fbbf24"/>
  </g>

  <!-- Character: Project Manager / Director experiencing the heavy cost/exhaustion -->
  <g transform="translate(65, 85)">
    <!-- Body / Suit Jacket -->
    <path d="M15 85 C15 70 25 60 45 60 C65 60 75 70 75 85 L85 110 L5 110 Z" fill="#1e293b" />
    <path d="M45 60 L45 110" stroke="#334155" stroke-width="2" />
    <!-- Shirt collar & red tie (classic corporate/project lead look) -->
    <path d="M35 60 L45 75 L55 60 Z" fill="#f8fafc" />
    <polygon points="42,72 48,72 50,95 45,100 40,95" fill="#ef4444" />

    <!-- Head & Face (Stressed / Concerned expression) -->
    <circle cx="45" cy="38" rx="20" ry="22" fill="#fed7aa" />
    <!-- Hair (Styled professional dark hair) -->
    <path d="M25 35 C25 18 35 15 45 15 C55 15 65 18 65 35 C65 40 60 38 60 30 C60 22 52 18 45 18 C38 18 30 22 30 30 C30 38 25 40 25 35 Z" fill="#334155" />

    <!-- Eyebrows furrowed in worry -->
    <path d="M30 30 L38 33" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M52 33 L60 30" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (tired, looking at the high cost) -->
    <circle cx="34" cy="37" r="2.5" fill="#1e293b" />
    <circle cx="56" cy="37" r="2.5" fill="#1e293b" />
    <!-- Eye bags for stress -->
    <path d="M31 41 Q34 44 37 41" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M53 41 Q56 44 59 41" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Mouth (grimace / sigh) -->
    <path d="M39 49 Q45 44 51 49" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />

    <!-- Arms and Hands interacting with head in stress -->
    <!-- Left arm holding head -->
    <path d="M15 85 C10 65 25 50 35 40" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
    <circle cx="33" cy="38" r="7" fill="#fed7aa" />

    <!-- Right arm resting on desk -->
    <path d="M75 85 C85 85 95 100 100 110" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
    <circle cx="102" cy="110" r="6" fill="#fed7aa" />
  </g>

  <!-- Floating Downward Red Arrows indicating depletion/consumption of funds -->
  <g transform="translate(150, 60)" opacity="0.8">
    <path d="M0 0 L0 20 M-5 15 L0 22 L5 15" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(170, 80)" opacity="0.9">
    <path d="M0 0 L0 25 M-6 18 L0 27 L6 18" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(130, 45)" opacity="0.6">
    <path d="M0 0 L0 15 M-4 10 L0 17 L4 10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Coffee Mug (props for long working hours) -->
  <g transform="translate(25, 145)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#38bdf8" />
    <path d="M16 9 C22 9 22 19 16 19" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M4 2 L6 0 M8 2 L10 0 M12 2 L14 0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>