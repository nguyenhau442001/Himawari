<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Glow -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Projector Screen Glow -->
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Table Top Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & BACKGROUND -->
  <!-- Subtle Office Wall Paneling / Interior details -->
  <path d="M0 140 L240 140" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Large Window showing subtle evening city lights -->
  <rect x="25" y="25" width="60" height="85" rx="4" fill="url(#windowGlow)" stroke="#334155" stroke-width="1.5"/>
  <line x1="55" y1="25" x2="55" y2="110" stroke="#334155" stroke-width="1"/>
  <line x1="25" y1="67" x2="85" y2="67" stroke="#334155" stroke-width="1"/>
  <!-- City building lights outside -->
  <rect x="32" y="45" width="6" height="8" rx="1" fill="#f59e0b" opacity="0.4"/>
  <rect x="43" y="75" width="8" height="12" rx="1" fill="#38bdf8" opacity="0.3"/>
  <rect x="65" y="55" width="7" height="15" rx="1" fill="#f59e0b" opacity="0.3"/>

  <!-- Projector Screen mounted on wall -->
  <rect x="105" y="20" width="110" height="75" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="110" y="25" width="100" height="65" fill="url(#screenGlow)"/>
  <!-- Abstract Data viz on Screen (Suggestions/Charts) -->
  <polyline points="125,70 140,55 155,62 175,40 195,48" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data Points -->
  <circle cx="140" cy="55" r="3" fill="#fbbf24"/>
  <circle cx="175" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="195" cy="48" r="3" fill="#fbbf24"/>
  <!-- Bar chart hints -->
  <rect x="122" y="72" width="8" height="10" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="135" y="65" width="8" height="17" rx="1" fill="#38bdf8" opacity="0.8"/>
  <rect x="150" y="68" width="8" height="14" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="165" y="58" width="8" height="24" rx="1" fill="#10b981" opacity="0.8"/>

  <!-- Meeting Room Table -->
  <path d="M15 160 C15 152 22 145 30 145 L210 145 C218 145 225 152 225 160 L235 210 C235 215 230 220 225 220 L15 220 C10 220 5 215 5 210 Z" fill="url(#tableGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Table highlight line -->
  <path d="M22 152 L218 152" stroke="#64748b" stroke-width="1" opacity="0.6"/>

  <!-- FOREGROUND / CHARACTERS & PROPS -->
  
  <!-- Left Participant (Listening / Observing) -->
  <g transform="translate(35, 115)">
    <!-- Body / Torso -->
    <path d="M10 50 C10 38 20 30 35 30 C50 30 60 38 60 50 L65 85 L5 85 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt -->
    <path d="M28 30 L35 42 L42 30 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="35" cy="18" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M21 18 C21 10 27 5 35 5 C43 5 49 10 49 18 C49 20 47 16 45 14 C40 10 30 10 25 14 C23 16 21 18 21 18 Z" fill="#1e293b"/>
    <!-- Arm resting on table -->
    <path d="M15 50 L35 60 L50 55" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Speaker / Presenter -->
  <g transform="translate(95, 100)">
    <!-- Body / Torso -->
    <path d="M10 55 C10 42 20 35 35 35 C50 35 60 42 60 55 L70 100 L0 100 Z" fill="#10b981"/>
    <!-- Shirt inner -->
    <path d="M28 35 L35 45 L42 35 Z" fill="#f8fafc"/>
    <!-- Neck -->
    <rect x="30" y="27" width="10" height="10" fill="#fbcfe8"/>
    <!-- Head -->
    <circle cx="35" cy="16" r="14" fill="#fbcfe8"/>
    <!-- Hair (Styled professional) -->
    <path d="M21 14 C21 7 27 3 35 3 C43 3 49 7 49 14 C49 17 48 15 46 12 C42 7 28 7 24 12 C22 15 21 14 21 14 Z" fill="#334155"/>
    <!-- Active Presenter Arm pointing towards suggestions/screen -->
    <path d="M50 50 L75 35" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="77" cy="33" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Right Participant (Taking Notes) -->
  <g transform="translate(155, 110)">
    <!-- Body / Torso -->
    <path d="M10 55 C10 43 20 35 35 35 C50 35 60 43 60 55 L65 95 L5 95 Z" fill="#8b5cf6"/>
    <!-- Collar -->
    <path d="M28 35 L35 46 L42 35 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="35" cy="20" r="14" fill="#fbcfe8"/>
    <!-- Hair (Ponytail/Bun hint) -->
    <circle cx="45" cy="14" r="5" fill="#0f172a"/>
    <path d="M21 20 C21 11 27 6 35 6 C43 6 49 11 49 20 C49 22 47 18 45 16 C40 12 30 12 25 16 C23 18 21 20 21 20 Z" fill="#0f172a"/>
    <!-- Arm writing -->
    <path d="M20 55 L35 65 L28 75" fill="none" stroke="#8b5cf6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27" cy="77" r="3" fill="#fbcfe8"/>
  </g>

  <!-- PROPS ON TABLE (Representing "Several Suggestions" / 若干建议) -->
  
  <!-- Laptops / Notepads / Documents -->
  <!-- Notepad 1 (Left) -->
  <g transform="translate(50, 165) rotate(-5)">
    <rect width="28" height="35" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="6" y1="8" x2="22" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="15" x2="20" y2="15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="22" x2="16" y2="22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Document Stack representing "Several proposals/suggestions" (Center/Right) -->
  <g transform="translate(110, 160)">
    <!-- Paper 3 (Bottom) -->
    <rect x="-4" y="6" width="36" height="26" rx="2" fill="#cbd5e1" transform="rotate(8)"/>
    <!-- Paper 2 (Middle) -->
    <rect x="-2" y="3" width="34" height="24" rx="2" fill="#e2e8f0" transform="rotate(-3)"/>
    <!-- Paper 1 (Top) -->
    <rect x="0" y="0" width="32" height="22" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <!-- Document lines (Mock text representation) -->
    <line x1="6" y1="6" x2="20" y2="6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="11" x2="26" y2="11" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="16" x2="18" y2="16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Checkmark badge on document (indicating proposal approved/made) -->
    <circle cx="24" cy="15" r="4" fill="#10b981"/>
    <polyline points="22,15 23.5,16.5 27,13" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Coffee Cup for realistic meeting environment -->
  <g transform="translate(180, 168)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M16 4 C20 4 20 14 16 14" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="8" cy="0" rx="8" ry="3" fill="#cbd5e1"/>
    <ellipse cx="8" cy="0" rx="6" ry="2" fill="#b45309"/>
  </g>

</svg>