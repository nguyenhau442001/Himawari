<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Glow -->
  <circle cx="120" cy="120" r="70" fill="#FF9F0A" opacity="0.05"/>

  <!-- Conceptual Representation of "武器" (Weapon / Knowledge as Weapon) -->
  <!-- Modern, sleek stylized futuristic/tactical shield and energy blade combined with subtle book geometry -->
  
  <g transform="translate(120, 120)">
    <!-- Outer Shield / Book Spine Aura -->
    <path d="M0 -75 L55 -45 L55 25 C55 55 25 75 0 90 C-25 75 -55 55 -55 25 L-55 -45 Z" fill="#252A34" stroke="#FF9F0A" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner Shield Panel -->
    <path d="M0 -62 L42 -37 L42 20 C42 45 20 62 0 74 C-20 62 -42 45 -42 20 L-42 -37 Z" fill="#1A1D24"/>

    <!-- Open Book Pages forming a V-shape (Symbolizing Knowledge / 知识) -->
    <path d="M-35 -25 C-15 -30 -5 -15 0 10 C-5 -15 -15 -30 -35 -25 Z" fill="#FF9F0A" opacity="0.15"/>
    <path d="M35 -25 C15 -30 5 -15 0 10 C5 -15 15 -30 35 -25 Z" fill="#FF9F0A" opacity="0.15"/>

    <!-- Central Energy Blade / Pen Nib (Symbolizing Power / 武器) -->
    <!-- Blade Body -->
    <path d="M0 -65 L12 -25 L4 55 L0 70 L-4 55 L-12 -25 Z" fill="#FF9F0A"/>
    <!-- Blade Core Highlight -->
    <path d="M0 -55 L5 -20 L2 45 L0 55 L-2 45 L-5 -20 Z" fill="#FFE58F"/>
    
    <!-- Crossguard / Hilt Wings -->
    <path d="M-22 -18 L22 -18 L16 -8 L-16 -8 Z" fill="#E88B00"/>
    <circle cx="0" cy="-13" r="3" fill="#FFE58F"/>

    <!-- Floating Geometric Tech Nodes (Modern Flat Accent) -->
    <circle cx="-50" cy="-10" r="3" fill="#FF9F0A"/>
    <circle cx="50" cy="-10" r="3" fill="#FF9F0A"/>
    <line x1="-50" y1="-10" x2="-40" y2="-10" stroke="#FF9F0A" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="-10" x2="40" y2="-10" stroke="#FF9F0A" stroke-width="2" stroke-linecap="round"/>

    <circle cx="-40" cy="30" r="2" fill="#FFE58F" opacity="0.7"/>
    <circle cx="40" cy="30" r="2" fill="#FFE58F" opacity="0.7"/>
  </g>
</svg>