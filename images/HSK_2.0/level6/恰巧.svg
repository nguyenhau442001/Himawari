<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Magic 'Coincidence' Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Window City Glow -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENTAL BACKGROUND DETAILS -->
  <!-- Cozy Apartment Interior -->
  <rect x="15" y="15" width="210" height="155" rx="8" fill="#162032" />
  
  <!-- Wooden Floor -->
  <path d="M15 170 L225 170 L225 220 C225 223 223 225 220 225 L20 225 C17 225 15 223 15 220 Z" fill="url(#floorGrad)" />
  <line x1="15" y1="185" x2="225" y2="185" stroke="#1e293b" stroke-width="1.5" />
  <line x1="15" y1="202" x2="225" y2="202" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Window showing night city -->
  <rect x="85" y="30" width="70" height="90" rx="4" fill="url(#windowGrad)" stroke="#334155" stroke-width="2" />
  <!-- Window Panes -->
  <line x1="120" y1="30" x2="120" y2="120" stroke="#334155" stroke-width="2" />
  <line x1="85" y1="75" x2="155" y2="75" stroke="#334155" stroke-width="2" />
  <!-- City lights through window -->
  <rect x="95" y="45" width="8" height="12" rx="1" fill="#fbbf24" opacity="0.6" />
  <rect x="108" y="55" width="6" height="15" rx="1" fill="#38bdf8" opacity="0.5" />
  <rect x="135" y="40" width="10" height="20" rx="1" fill="#fb923c" opacity="0.4" />
  <rect x="130" y="85" width="8" height="15" rx="1" fill="#34d399" opacity="0.5" />
  <rect x="98" y="95" width="12" height="10" rx="1" fill="#fbbf24" opacity="0.5" />

  <!-- Bookshelf Background Prop -->
  <rect x="25" y="45" width="40" height="85" rx="2" fill="#1e293b" />
  <line x1="25" y1="70" x2="65" y2="70" stroke="#0f172a" stroke-width="2" />
  <line x1="25" y1="95" x2="65" y2="95" stroke="#0f172a" stroke-width="2" />
  <!-- Books -->
  <rect x="30" y="55" width="6" height="15" fill="#38bdf8" rx="1" />
  <rect x="38" y="52" width="8" height="18" fill="#ec4899" rx="1" />
  <rect x="48" y="57" width="5" height="13" fill="#10b981" rx="1" />
  <rect x="32" y="78" width="12" height="17" fill="#fbbf24" rx="1" />
  <rect x="46" y="80" width="7" height="15" fill="#818cf8" rx="1" />

  <!-- Plant Prop -->
  <path d="M195 155 L215 155 L210 170 L200 170 Z" fill="#64748b" />
  <path d="M205 155 Q195 130 185 135 Q195 150 205 155 Z" fill="#10b981" />
  <path d="M205 155 Q220 135 225 145 Q210 150 205 155 Z" fill="#34d399" />
  <path d="M205 155 Q205 125 205 125 Q205 140 205 155 Z" fill="#059669" />

  <!-- CEILING LAMP & GLOW -->
  <circle cx="120" cy="15" r="30" fill="url(#lampGlow)" />
  <path d="M115 0 L125 0 L122 25 L118 25 Z" fill="#475569" />
  <ellipse cx="120" cy="27" rx="12" ry="4" fill="#fbbf24" />

  <!-- MAIN SCENARIO: TWO CHARACTERS COLLIDING / MEETING MID-ROOM -->
  <!-- The scenario: "Tôi đi tìm anh ấy, tình cờ anh ấy cũng đang tìm tôi." -> Meeting face-to-face in the middle, both carrying props indicating searching/meeting (phone/notepad), caught by surprise & joy. -->

  <!-- CHARACTER 1: Left Person (Male, wearing blue jacket, walking right, holding phone/note) -->
  <g id="character-left">
    <!-- Body / Torso -->
    <path d="M65 140 L85 135 L90 185 L65 185 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="78" cy="115" r="14" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M64 115 Q70 100 88 108 Q85 118 80 115 Z" fill="#1e293b" />
    <!-- Face expression: Surprised/Happy Open Mouth -->
    <circle cx="74" cy="113" r="1.5" fill="#1e293b" />
    <path d="M80 116 Q83 120 86 116" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Arm reaching forward with surprise gesture -->
    <path d="M80 140 L105 130 L110 145" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="110" cy="145" r="4" fill="#fcd34d" />
    <!-- Legs in motion -->
    <path d="M70 185 L60 215 L72 218" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M85 185 L95 210 L105 210" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CHARACTER 2: Right Person (Female, wearing warm orange/pink sweater, walking left) -->
  <g id="character-right">
    <!-- Body / Torso -->
    <path d="M175 140 L155 135 L150 185 L175 185 Z" fill="#fb923c" />
    <!-- Head -->
    <circle cx="162" cy="115" r="14" fill="#fcd34d" />
    <!-- Hair (Ponytail) -->
    <path d="M150 110 Q160 98 176 112 Q175 125 168 122 Z" fill="#b45309" />
    <path d="M172 115 Q185 115 180 128" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
    <!-- Face expression: Surprised/Happy -->
    <circle cx="166" cy="113" r="1.5" fill="#1e293b" />
    <path d="M154 116 Q157 120 160 116" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Arm reaching forward -->
    <path d="M160 140 L135 130 L130 145" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="130" cy="145" r="4" fill="#fcd34d" />
    <!-- Legs in motion -->
    <path d="M170 185 L180 215 L168 218" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M155 185 L145 210 L135 210" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- PROPS IN HANDS: Both holding search items / phones -->
  <!-- Left person's phone glowing -->
  <rect x="106" y="142" width="10" height="14" rx="2" fill="#38bdf8" transform="rotate(15 111 149)" />
  <rect x="108" y="144" width="6" height="10" rx="1" fill="#ffffff" transform="rotate(15 111 149)" opacity="0.8" />

  <!-- Right person's notebook/notepad -->
  <rect x="124" y="142" width="12" height="15" rx="1" fill="#ec4899" transform="rotate(-15 130 149)" />
  <line x1="127" y1="146" x2="133" y2="146" stroke="#ffffff" stroke-width="1.5" />
  <line x1="127" y1="150" x2="133" y2="150" stroke="#ffffff" stroke-width="1.5" />

  <!-- CENTRAL "COINCIDENCE" EFFECT (Vừa đúng lúc / Tình cờ) -->
  <!-- Sparkling Magic / Timing Element right between them -->
  <g id="sparkles" transform="translate(120, 110)">
    <!-- Large glowing star burst -->
    <path d="M 0 -22 L 4 -6 L 20 -2 L 4 2 L 0 18 L -4 2 L -20 -2 L -4 -6 Z" fill="url(#sparkleGrad)" />
    <!-- Smaller floating sparkles -->
    <circle cx="-25" cy="-15" r="3" fill="#fbbf24" />
    <circle cx="28" cy="10" r="2.5" fill="#38bdf8" />
    <circle cx="-18" cy="22" r="2" fill="#ec4899" />
    <circle cx="22" cy="-25" r="3.5" fill="#10b981" />
    
    <!-- Action speed lines / surprise arcs -->
    <path d="M -35 -5 Q -40 -15 -30 -20" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 35 5 Q 40 15 30 20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- INTERACTION ELEMENTS: Speech/Thought connection bubble or floating hearts/notes -->
  <path d="M 100 85 Q 120 70 140 85" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" />
  <path d="M 120 73 L 123 78 L 117 78 Z" fill="#f43f5e" />

</svg>