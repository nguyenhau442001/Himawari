<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Context: Modern Policy & Analytics Office -->
  <!-- Large Window showing Cityscape (Market) -->
  <rect x="135" y="45" width="75" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
  <!-- City buildings in window -->
  <rect x="145" y="85" width="14" height="50" fill="#1e293b" />
  <rect x="163" y="70" width="16" height="65" fill="#1e293b" />
  <rect x="183" y="95" width="18" height="40" fill="#1e293b" />
  <!-- City lights/windows -->
  <rect x="148" y="92" width="3" height="4" fill="#fbbf24" opacity="0.6" />
  <rect x="154" y="92" width="3" height="4" fill="#fbbf24" opacity="0.6" />
  <rect x="148" y="102" width="3" height="4" fill="#38bdf8" opacity="0.8" />
  <rect x="168" y="80" width="3" height="4" fill="#fbbf24" opacity="0.8" />
  <rect x="174" y="90" width="3" height="4" fill="#fbbf24" opacity="0.8" />
  <rect x="188" y="105" width="3" height="4" fill="#38bdf8" opacity="0.8" />

  <!-- Window Frame Divider -->
  <line x1="172" y1="45" x2="172" y2="135" stroke="#334155" stroke-width="2" />
  <line x1="135" y1="90" x2="210" y2="90" stroke="#334155" stroke-width="2" />

  <!-- Policy Projector / Direction Beam (Representing "导向" - Guidance/Orientation) -->
  <polygon points="65,85 150,110 150,150 65,115" fill="url(#beamGrad)" />

  <!-- Holographic Policy Projection (Upward trend chart in market) -->
  <g transform="translate(140, 105)">
    <path d="M 0 35 L 15 25 L 30 28 L 45 10 L 60 5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="60" cy="5" r="4" fill="#10b981" />
    <!-- Compass/Direction Vector symbol inside projection to emphasize 'direction/guidance' -->
    <polygon points="45,10 48,18 43,15" fill="#38bdf8" />
  </g>

  <!-- Desk & Office Props -->
  <rect x="20" y="155" width="115" height="10" rx="2" fill="#475569" />
  <rect x="35" y="165" width="15" height="45" fill="#334155" />
  <rect x="105" y="165" width="15" height="45" fill="#334155" />

  <!-- Desk Items: Policy Document / Blueprint -->
  <g transform="translate(45, 135) rotate(-10)">
    <rect width="35" height="25" rx="2" fill="#f8fafc" />
    <!-- Document lines -->
    <line x1="6" y1="6" x2="20" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="11" x2="29" y2="11" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="6" y1="16" x2="16" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Mini directional arrow stamp on doc -->
    <polygon points="26,17 31,14 26,11" fill="#38bdf8" />
  </g>

  <!-- Laptop showing market data -->
  <path d="M 80,155 L 115,155 L 122,145 L 73,145 Z" fill="#64748b" />
  <rect x="75" y="125" width="45" height="20" rx="2" fill="url(#screenGrad)" stroke="#64748b" stroke-width="1.5" />
  <!-- Graph on laptop screen -->
  <polyline points="80,140 88,136 96,138 104,130 112,128" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- Main Character (Policy Maker / Analyst actively pointing/guiding) -->
  <!-- Character Body & Suit -->
  <path d="M 40,195 C 40,170 55,160 65,160 C 75,160 90,170 90,195 Z" fill="#0ea5e9" />
  <path d="M 53,160 L 65,180 L 77,160 Z" fill="#ffffff" /> <!-- Shirt collar / tie -->
  <polygon points="63,170 67,170 65,185" fill="#ef4444" /> <!-- Tie -->

  <!-- Character Head & Hair -->
  <circle cx="65" cy="130" r="18" fill="#fbcfe8" />
  <!-- Hair -->
  <path d="M 47,130 C 47,118 55,110 65,110 C 77,110 83,120 83,132 C 80,132 75,128 70,128 C 62,128 58,135 53,135 Z" fill="#1e293b" />
  <!-- Friendly, focused facial expression -->
  <circle cx="59" cy="128" r="1.5" fill="#0f172a" />
  <circle cx="71" cy="128" r="1.5" fill="#0f172a" />
  <path d="M 63,136 Q 65,139 67,136" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="55" cy="132" r="3" fill="#f43f5e" opacity="0.3" />
  <circle cx="75" cy="132" r="3" fill="#f43f5e" opacity="0.3" />

  <!-- Character Arm pointing towards the window/market scene (Emphasizing "Guidance/导向") -->
  <path d="M 50,165 Q 35,145 25,135" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="23" cy="133" r="4" fill="#fbcfe8" />

  <!-- Indoor Ambient Details -->
  <!-- Plant Pot for warmth and life -->
  <rect x="15" y="175" width="18" height="20" rx="2" fill="#cbd5e1" />
  <path d="M 24,175 C 15,160 18,145 24,140 C 30,145 33,160 24,175 Z" fill="#10b981" />
  <path d="M 24,175 C 20,165 15,155 12,150 C 18,152 22,162 24,175 Z" fill="#059669" />
  <path d="M 24,175 C 28,165 33,155 36,150 C 30,152 26,162 24,175 Z" fill="#34d399" />

  <!-- Ambient Light Glow from Window onto Floor/Desk -->
  <path d="M 135,135 L 210,135 L 225,215 L 120,215 Z" fill="#38bdf8" opacity="0.04" />

</svg>