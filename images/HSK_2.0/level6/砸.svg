<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Vase fragments -->
  <path d="M160 180 L175 150 L190 180 Z" fill="#FF9F1C" opacity="0.8"/>
  <path d="M140 190 L155 160 L170 190 Z" fill="#FF9F1C" opacity="0.6"/>
  <path d="M180 195 L195 170 L210 195 Z" fill="#FF9F1C" opacity="0.7"/>
  
