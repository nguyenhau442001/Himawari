  <path d="M145 130 C145 125 155 125 155 130 Z" fill="#f59e0b"/>
  <rect x="148" y="128" width="4" height="3" fill="#1e293b"/>
  
  <rect x="75" y="112" width="22" height="18" rx="2" fill="#0f172a"/>
  <rect x="77" y="114" width="18" height="12" rx="1" fill="#38bdf8" opacity="0.4"/>
  <path d="M83 130 L87 130 L88 133 L82 133 Z" fill="#64748b"/>

  <!-- Elegant Potted Palm / Monstera in Corner -->
  <path d="M195 140 L215 140 L210 185 L200 185 Z" fill="#475569"/> <!-- Pot -->
  <ellipse cx="205" cy="140" rx="10" ry="3" fill="#64748b"/>
  <!-- Plant Leaves -->
  <path d="M205 137 C215 120 230 110 235 100 C220 115 210 125 205 137 Z" fill="#10b981"/>
  <path d="M205 137 C190 125 180 110 175 95 C190 110 198 122 205 137 Z" fill="#059669"/>
  <path d="M205 137 C210 115 205 90 210 75 C202 95 202 115 205 137 Z" fill="#34d399"/>

  <!-- CHARACTER 1: The Impressed Guest (Foreground Right) -->
