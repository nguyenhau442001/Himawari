  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#172554" opacity="0.5"/>
  <line x1="120" y1="180" x2="120" y2="240" stroke="#1e293b" stroke-width="2"/>
  <line x1="60" y1="180" x2="20" y2="240" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="180" y1="180" x2="220" y2="240" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Luxury Concierge / Reception Desk -->
  <path d="M60 140 L180 140 L195 185 L45 185 Z" fill="#334155"/>
  <!-- Polished Marble Countertop -->
  <path d="M55 133 L185 133 L190 140 L50 140 Z" fill="#cbd5e1"/>
  <path d="M55 133 L185 133 L187 136 L53 136 Z" fill="#f8fafc"/>
