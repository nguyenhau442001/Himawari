  <!-- Hair (Stylish dark slicked-back) -->
  <path d="M149 165 C150 155 160 153 172 157 C175 162 173 166 173 166 C173 166 168 158 160 158 C153 158 150 162 149 165 Z" fill="#0f172a"/>
  <!-- Happy/Impressed Eyes (Curved lines of joy) -->
  <path d="M156 165 Q160 169 164 165" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M158 173 Q162 178 167 173" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="154" cy="172" r="2.5" fill="#f43f5e" opacity="0.5"/>
  <circle cx="170" cy="172" r="2.5" fill="#f43f5e" opacity="0.5"/>

  <!-- Gesture: Hand raised pointing/admiring -->
  <path d="M175 190 C185 185 190 175 188 170 C186 168 182 170 183 175 C184 180 178 185 175 190 Z" fill="#fde047"/>

  <!-- CHARACTER 2: The Professional Concierge / Hotel Staff (Behind Desk) -->
  <!-- Uniform Torso -->
  <path d="M100 155 L120 155 L125 185 L95 185 Z" fill="#0f172a"/>
  <!-- Gold Lapels & White Collar -->
  <path d="M106 155 L110 168 L103 168 Z" fill="#f8fafc"/>
  <path d="M114 155 L110 168 L117 168 Z" fill="#f8fafc"/>
  <path d="M106 155 L103 168 L101 160 Z" fill="#f59e0b"/>
  <path d="M114 155 L117 168 L119 160 Z" fill="#f59e0b"/>

  <!-- Head & Friendly Smile -->
  <circle cx="110" cy="140" rx="11" ry="12" fill="#fde047"/>
  <!-- Neat Bun Hair -->
  <circle cx="110" cy="126" r="5" fill="#1e293b"/>
  <path d="M99 138 C99 130 121 130 121 138 C121 142 119 140 110 140 C101 140 99 142 99 138 Z" fill="#1e293b"/>
  <!-- Eyes -->
  <circle cx="106" cy="139" r="1.5" fill="#1e293b"/>
  <circle cx="114" cy="139" r="1.5" fill="#1e293b"/>
  <!-- Welcoming Smile -->
  <path d="M107 145 Q110 148 113 145" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Floating Sparkles / Luxury Aura Indicators -->
  <g transform="translate(130, 85)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fef08a"/>
  </g>
  <g transform="translate(70, 70) scale(0.7)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#f59e0b"/>
  </g>
  <g transform="translate(180, 110) scale(0.8)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#38bdf8"/>
  </g>
</svg>