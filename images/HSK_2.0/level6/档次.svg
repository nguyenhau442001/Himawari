  <circle cx="220" cy="90" r="15" fill="#f59e0b" opacity="0.15"/>
  <path d="M217 80 L223 80 L221 100 L219 100 Z" fill="#94a3b8"/>
  <circle cx="220" cy="78" r="6" fill="#fef08a"/>
