<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- UI/Blueprint Hologram Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Gear Metallic Gradients -->
    <linearGradient id="gear-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="gear-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#glow)" />

  <!-- Environmental Background Elements: Modern Office Wall & Window -->
  <!-- Window Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="180" y1="20" x2="220" y2="60" />
    <line x1="220" y1="20" x2="180" y2="60" />
    <rect x="170" y="10" width="60" height="70" rx="4" fill="none" />
  </g>

  <!-- Hanging Plant (Context) -->
  <path d="M 25 10 C 25 25, 45 25, 45 40" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 45 35 Q 35 45 25 40 T 45 55 T 60 40 Z" fill="#10b981" opacity="0.8" />
  <path d="M 45 35 Q 55 45 65 40 T 45 55 T 30 40 Z" fill="#34d399" opacity="0.8" />

  <!-- Corkboard with Blueprint sketches in background -->
  <rect x="15" y="60" width="55" height="45" rx="3" fill="#334155" opacity="0.4" />
  <line x1="25" y1="72" x2="50" y2="72" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="25" y1="82" x2="40" y2="82" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <circle cx="20" cy="65" r="2" fill="#ef4444" />

  <!-- Standing Desk / Workbench -->
  <path d="M 50 170 L 190 170 L 180 185 L 60 185 Z" fill="#334155" filter="url(#shadow)" />
  <rect x="70" y="185" width="12" height="40" fill="#1e293b" />
  <rect x="158" y="185" width="12" height="40" fill="#1e293b" />

  <!-- Hologram / New Mechanism Projection Base -->
  <ellipse cx="120" cy="170" rx="45" ry="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
  <ellipse cx="120" cy="170" rx="30" ry="6" fill="url(#holo-grad)" />

  <!-- Interlocking Gears (The "Mechanism" - 机制 being built) -->
  <g filter="url(#shadow)">
    <!-- Central Large Gear (Gold) -->
    <g transform="translate(120, 125)">
      <circle r="22" fill="url(#gear-gold)" />
      <path d="M 0 -28 L 4 -25 L 4 -21 L -4 -21 L -4 -25 Z M 0 28 L 4 25 L 4 21 L -4 21 L -4 25 Z M -28 0 L -25 -4 L -21 -4 L -21 4 L -25 4 Z M 28 0 L 25 -4 L 21 -4 L 21 4 L 25 4 Z M -20 -20 L -17 -23 L -14 -20 L -17 -17 Z M 20 20 L 17 23 L 14 20 L 17 17 Z M -20 20 L -23 17 L -20 14 L -17 17 Z M 20 -20 L 23 -17 L 20 -14 L 17 -17 Z" fill="#d97706" />
      <circle r="9" fill="#0f172a" />
    </g>

    <!-- Secondary Gear Top Left (Blue) -->
    <g transform="translate(88, 105)">
      <circle r="15" fill="url(#gear-blue)" />
      <path d="M 0 -19 L 3 -16 L 3 -13 L -3 -13 L -3 -16 Z M 0 19 L 3 16 L 3 13 L -3 13 L -3 16 Z M -19 0 L -16 -3 L -13 -3 L -13 3 L -16 3 Z M 19 0 L 16 -3 L 13 -3 L 13 3 L 16 3 Z" fill="#0284c7" />
      <circle r="6" fill="#0f172a" />
    </g>

    <!-- New Incoming Gear Floating into Place (Emerald/Cyan Accent - "New Mechanism") -->
    <g transform="translate(155, 100)" opacity="0.95">
      <circle r="16" fill="#10b981" />
      <path d="M 0 -20 L 3 -17 L 3 -14 L -3 -14 L -3 -17 Z M 0 20 L 3 17 L 3 14 L -3 14 L -3 17 Z M -20 0 L -17 -3 L -14 -3 L -14 3 L -17 3 Z M 20 0 L 17 -3 L 14 -3 L 14 3 L 17 3 Z" fill="#059669" />
      <circle r="7" fill="#0f172a" />
      <!-- Connection motion trail -->
      <path d="M -15 15 L -25 25" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2" />
    </g>
  </g>

  <!-- Holographic Projection Beams -->
  <polygon points="105,170 95,105 105,105" fill="url(#holo-grad)" opacity="0.5" />
  <polygon points="135,170 135,105 145,105" fill="url(#holo-grad)" opacity="0.5" />

  <!-- Character 1: Architect / Planner (Left Side) -->
  <g transform="translate(45, 115)">
    <!-- Body / Torso -->
    <path d="M 15 55 C 10 40, 20 30, 25 30 C 30 30, 40 40, 35 55 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="25" cy="20" r="11" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 15 18 C 15 10, 25 8, 33 14 C 33 14, 30 22, 25 22 Z" fill="#475569" />
    <!-- Arm reaching out to adjust mechanism -->
    <path d="M 28 35 Q 45 40 58 30" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="60" cy="28" r="3.5" fill="#fcd34d" />
  </g>

  <!-- Character 2: Engineer / Builder (Right Side) -->
  <g transform="translate(160, 110)">
    <!-- Body / Torso -->
    <path d="M 15 60 C 20 45, 10 35, 15 35 C 20 35, 30 45, 25 60 Z" fill="#fb923c" />
    <!-- Head -->
    <circle cx="20" cy="22" r="11" fill="#fcd34d" />
    <!-- Hair / Safety Cap -->
    <path d="M 10 18 C 10 10, 30 10, 30 18 Z" fill="#f59e0b" />
    <!-- Arm pointing/placing new piece -->
    <path d="M 18 38 Q 0 40 -12 28" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="-14" cy="26" r="3.5" fill="#fcd34d" />
  </g>

  <!-- Foreground Desk Details (Laptop & Coffee Cup) -->
  <g transform="translate(0, 10)">
    <!-- Laptop Base -->
    <polygon points="75,160 105,160 115,168 65,168" fill="#64748b" />
    <!-- Laptop Screen -->
    <polygon points="77,135 103,135 105,160 75,160" fill="#475569" />
    <polygon points="80,138 100,138 102,157 78,157" fill="#0f172a" />
    <!-- Code/Graph lines on screen -->
    <line x1="83" y1="143" x2="93" y2="143" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="83" y1="148" x2="97" y2="148" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="83" y1="153" x2="88" y2="153" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

    <!-- Coffee Mug -->
    <rect x="145" y="152" width="12" height="15" rx="2" fill="#f8fafc" />
    <path d="M 157 155 C 162 155, 162 163, 157 165" fill="none" stroke="#f8fafc" stroke-width="2" />
    <!-- Steam -->
    <path d="M 149 146 Q 151 140 149 134" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Architectural Compass / Drafting Tool -->
  <g transform="translate(130, 162) rotate(25)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-6" y2="19" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2.5" fill="#f59e0b" />
  </g>

  <!-- Ambient Light Sparks (Signifying Innovation & Creation) -->
  <circle cx="105" cy="85" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="140" cy="80" r="1.5" fill="#10b981" opacity="0.9" />
  <circle cx="130" cy="95" r="2.5" fill="#fbbf24" opacity="0.7" />
  <path d="M 118 70 L 120 75 L 125 77 L 120 79 L 118 84 L 116 79 L 111 77 L 116 75 Z" fill="#fbbf24" opacity="0.6" transform="scale(0.5) translate(140, 80)" />

</svg>