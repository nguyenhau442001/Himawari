<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- "Vague/Foggy" Thought/Speech Bubble Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd1a9" />
      <stop offset="100%" stop-color="#f5b882" />
    </linearGradient>

    <!-- Blur filter for hazy/ambiguous visual element -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Lighting Effect -->
  <circle cx="170" cy="90" r="110" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Bookshelf / Back Wall Details -->
  <rect x="25" y="45" width="70" height="85" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="73" x2="95" y2="73" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="101" x2="95" y2="101" stroke="#334155" stroke-width="1.5" />
  <!-- Books on shelf -->
  <rect x="32" y="53" width="8" height="20" rx="1" fill="#38bdf8" opacity="0.7" />
  <rect x="42" y="50" width="12" height="23" rx="1" fill="#ec4899" opacity="0.7" />
  <rect x="56" y="55" width="6" height="18" rx="1" fill="#fb923c" opacity="0.7" />
  <rect x="68" y="80" width="10" height="21" rx="1" fill="#10b981" opacity="0.7" />
  <rect x="80" y="83" width="7" height="18" rx="1" fill="#fbbf24" opacity="0.7" />

  <!-- Office Desk Surface -->
  <rect x="10" y="175" width="220" height="50" rx="4" fill="#0f172a" />
  <path d="M10 175 L230 175 L220 165 L20 165 Z" fill="#334155" opacity="0.4" />
  <rect x="10" y="175" width="220" height="6" fill="#475569" />

  <!-- Desk Props: Laptop & Coffee Cup -->
  <rect x="125" y="153" width="55" height="18" rx="2" fill="#64748b" />
  <path d="M115 171 L190 171 L195 175 L110 175 Z" fill="#94a3b8" />
  <rect x="135" y="142" width="35" height="13" rx="1" fill="#334155" />
  <circle cx="168" cy="142" r="2" fill="#38bdf8" /> <!-- small power light -->

  <rect x="195" y="150" width="14" height="17" rx="3" fill="#cbd5e1" />
  <path d="M209 154 C213 154, 213 162, 209 162" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <!-- Steam rising -->
  <path d="M200 144 C200 140, 203 138, 200 134" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Desk Lamp -->
  <path d="M175 165 L175 110 L165 95" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M158 92 L177 92 L182 100 L153 100 Z" fill="#fbbf24" />
  <!-- Light cone line subtle -->
  <line x1="167" y1="100" x2="160" y2="165" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3" opacity="0.2" />


  <!-- CHARACTERS -->

  <!-- CHARACTER 1: The Questioner / Interviewer (Left side, inquiring) -->
  <g transform="translate(15, 0)">
    <!-- Body & Shoulders -->
    <path d="M 25 200 C 25 180, 45 175, 60 175 C 75 175, 95 180, 95 200 Z" fill="#3b82f6" />
    <!-- Collar / Shirt -->
    <path d="M 50 175 L 60 190 L 70 175 Z" fill="#ffffff" />

    <!-- Head & Neck -->
    <rect x="52" y="130" width="16" height="20" fill="url(#skinGrad)" />
    <circle cx="60" cy="120" r="18" fill="url(#skinGrad)" />

    <!-- Hair (Curious/Professional style) -->
    <path d="M 43 120 C 43 105, 55 102, 63 102 C 75 102, 78 112, 77 125 C 75 125, 75 115, 60 112 C 48 112, 45 120, 43 120 Z" fill="#1e293b" />

    <!-- Facial Expression: Asking / Pointing hand -->
    <!-- Eyebrow raised -->
    <path d="M 50 114 Q 55 111, 60 115" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="53" cy="118" r="2" fill="#1e293b" />
    <circle cx="67" cy="118" r="2" fill="#1e293b" />
    <!-- Confused / Inquiring mouth -->
    <path d="M 58 127 Q 61 130, 64 127" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Arm gesturing question -->
    <path d="M 35 180 C 40 165, 50 160, 65 168" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="65" cy="168" r="5" fill="url(#skinGrad)" />

    <!-- Question Mark Icon Floating gently above -->
    <path d="M 68 82 C 68 75, 78 75, 78 82 C 78 88, 68 87, 68 95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="68" cy="103" r="1.5" fill="#38bdf8" />
  </g>


  <!-- CHARACTER 2: The Responder (Right side, giving vague answer) -->
  <g transform="translate(100, 0)">
    <!-- Body & Shoulders (Leaning back slightly, defensive/evasive posture) -->
    <path d="M 30 200 C 30 180, 50 170, 65 170 C 85 170, 105 180, 105 200 Z" fill="#10b981" />
    <path d="M 45 170 L 65 185 L 85 170 Z" fill="#e2e8f0" /> <!-- shirt collar -->

    <!-- Head & Neck -->
    <rect x="57" y="125" width="16" height="20" fill="url(#skinGrad)" />
    <circle cx="65" cy="115" r="18" fill="url(#skinGrad)" />

    <!-- Hair (Messy/Wavy modern style) -->
    <path d="M 49 115 C 48 98, 62 95, 72 98 C 82 101, 83 115, 82 122 C 75 115, 60 115, 49 115 Z" fill="#334155" />
    <path d="M 78 105 C 83 108, 86 114, 84 120" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Facial Expression: Unsure / Ambiguous smile / Sweating drop -->
    <!-- Eyes looking sideways / evasive -->
    <circle cx="59" cy="113" r="1.8" fill="#1e293b" />
    <circle cx="71" cy="113" r="1.8" fill="#1e293b" />
    <!-- Half-smile / Awkward smirk -->
    <path d="M 59 123 Q 65 121, 71 124" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Sweat drop on temple (nervous about being vague) -->
    <path d="M 78 111 C 81 113, 81 117, 78 117 C 75 117, 75 113, 78 111 Z" fill="#38bdf8" opacity="0.8" />

    <!-- Hand scratching head / uncertain gesture -->
    <path d="M 78 175 C 90 160, 95 135, 80 125" stroke="#10b981" stroke-width="9" stroke-linecap="round" fill="none" />
    <circle cx="80" cy="125" r="5" fill="url(#skinGrad)" />
  </g>


  <!-- CENTRAL VISUAL METAPHOR: "含糊" (Hánhu - Vague / Muddy / Foggy Answer) -->
  <!-- A large, stylized, swirling amorphous cloud emerging from between them, visually representing an unclear, fuzzy, misty response -->
  <g transform="translate(85, 80)">
    <!-- Main blurred fuzzy speech bubble/thought stream -->
    <path d="M 10 30 C -5 20, -5 -10, 15 -15 C 25 -30, 55 -30, 65 -15 C 85 -15, 90 10, 75 25 C 85 45, 60 55, 45 40 C 30 55, 0 45, 10 30 Z" 
          fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#softBlur)" opacity="0.85" />

    <!-- Inner hazy abstract shapes inside the bubble representing scrambled, unclear thoughts/words (NO TEXT) -->
    <circle cx="35" cy="5" r="12" fill="#c084fc" opacity="0.3" filter="url(#softBlur)" />
    <circle cx="45" cy="15" r="16" fill="#38bdf8" opacity="0.25" filter="url(#softBlur)" />
    <path d="M 20 15 Q 35 -5, 50 15" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#softBlur)" />
    <path d="M 25 5 Q 40 25, 55 5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" filter="url(#softBlur)" />

    <!-- Floating fuzzy dots/sparkles around the ambiguity -->
    <circle cx="-5" cy="0" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="80" cy="-5" r="2" fill="#c084fc" opacity="0.6" />
    <circle cx="70" cy="35" r="2.5" fill="#fbbf24" opacity="0.5" />
    <circle cx="15" cy="45" r="1.5" fill="#38bdf8" opacity="0.7" />
  </g>

</svg>