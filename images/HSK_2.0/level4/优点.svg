<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Ambient Spotlight Glow -->
    <radialGradient id="spotlight" cx="38%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Polished Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="16%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Rich Gold Gradients -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Rosette Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment: Wall Elements -->
  <!-- Framed Honor Certificate on Wall -->
  <g opacity="0.25" transform="translate(18, 18)">
    <rect width="34" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="4" y="4" width="26" height="34" rx="2" fill="#0f172a"/>
    <circle cx="17" cy="15" r="5" fill="#f59e0b" opacity="0.6"/>
    <line x1="9" y1="26" x2="25" y2="26" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="11" y1="31" x2="23" y2="31" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 0 168 L 240 168 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <line x1="0" y1="168" x2="240" y2="168" stroke="#475569" stroke-width="2"/>
  <line x1="0" y1="170" x2="240" y2="170" stroke="#0f172a" stroke-width="1"/>

  <!-- Left Desk Prop: Study Lamp -->
  <g transform="translate(8, 104)">
    <!-- Base -->
    <ellipse cx="14" cy="64" rx="11" ry="3" fill="#020617" opacity="0.6"/>
    <rect x="7" y="61" width="14" height="3" rx="1.5" fill="#64748b"/>
    <!-- Stem -->
    <path d="M 14 62 Q 8 36 22 18" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Shade -->
    <path d="M 17 14 L 33 7 L 37 22 L 21 28 Z" fill="#f59e0b"/>
    <ellipse cx="30" cy="17" rx="6" ry="9" fill="#fef08a" transform="rotate(22 30 17)"/>
    <!-- Warm Light Cone: shines softly onto desk surface -->
    <polygon points="32,18 135,55 125,64 22,28" fill="#fbbf24" opacity="0.12"/>
  </g>

  <!-- MAIN NOUN OBJECT 1: Merit / Strengths Clipboard Plaque ("Bảng Ưu Điểm") -->
  <g transform="translate(34, 62)">
    <!-- Desk Contact Shadow -->
    <ellipse cx="38" cy="106" rx="36" ry="3.5" fill="#020617" opacity="0.6"/>
    <!-- Drop Shadow -->
    <rect x="2" y="4" width="76" height="102" rx="7" fill="#020617" opacity="0.5"/>

    <!-- Clipboard Board -->
    <rect x="0" y="0" width="76" height="102" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Inner Certificate Sheet -->
    <rect x="5" y="8" width="66" height="88" rx="4" fill="#f8fafc"/>

    <!-- Gold Clamp Top -->
    <path d="M 24 -3 L 52 -3 C 54 -3 55 -1 55 2 L 55 6 L 21 6 L 21 2 C 21 -1 22 -3 24 -3 Z" fill="url(#goldGrad)"/>
    <ellipse cx="38" cy="1.5" rx="3.5" ry="1.2" fill="#ffffff" opacity="0.7"/>

    <!-- Prominent Merit Rosette Badge (Huy chương Ưu điểm) -->
    <g transform="translate(38, 22)">
      <!-- Ribbons -->
      <path d="M -7 8 L -11 22 L -5 19 L 0 22 L -2 8 Z" fill="url(#ribbonGrad)"/>
      <path d="M 7 8 L 11 22 L 5 19 L 0 22 L 2 8 Z" fill="url(#ribbonGrad)"/>
      <!-- Rosette Medal Body -->
      <circle cx="0" cy="7" r="10.5" fill="url(#goldGrad)"/>
      <circle cx="0" cy="7" r="8.5" fill="#d97706"/>
      <!-- Shiny 5-Point Star -->
      <polygon points="0,1.5 2.2,5.5 6.8,6 3.5,9.2 4.5,13.8 0,11.5 -4.5,13.8 -3.5,9.2 -6.8,6 -2.2,5.5" fill="#fef08a"/>
    </g>

    <!-- Checklist of Evaluated Merits / Strengths (Các Ưu điểm vượt trội) -->
    <!-- Row 1: Top Strength (Emerald) -->
    <g transform="translate(8, 47)">
      <circle cx="5" cy="5" r="4.5" fill="#dcfce7"/>
      <path d="M 3 5 L 4.8 7 L 8 3" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="13" y="2.5" width="44" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="13" y="2.5" width="40" height="5" rx="2.5" fill="#10b981"/>
    </g>

    <!-- Row 2: Secondary Strength (Sky Blue) -->
    <g transform="translate(8, 62)">
      <circle cx="5" cy="5" r="4.5" fill="#dcfce7"/>
      <path d="M 3 5 L 4.8 7 L 8 3" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="13" y="2.5" width="44" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="13" y="2.5" width="35" height="5" rx="2.5" fill="#0ea5e9"/>
    </g>

    <!-- Row 3: Special Forte (Amber Gold) -->
    <g transform="translate(8, 77)">
      <circle cx="5" cy="5" r="4.5" fill="#dcfce7"/>
      <path d="M 3 5 L 4.8 7 L 8 3" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="13" y="2.5" width="44" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="13" y="2.5" width="42" height="5" rx="2.5" fill="#f59e0b"/>
    </g>
  </g>

  <!-- MAIN NOUN OBJECT 2: Golden Star Trophy (Cúp Ưu Điểm) -->
  <g transform="translate(112, 126)">
    <!-- Shadow -->
    <ellipse cx="12" cy="42" rx="13" ry="3.5" fill="#020617" opacity="0.6"/>

    <!-- Base -->
    <rect x="3" y="35" width="18" height="5.5" rx="1.5" fill="#78350f"/>
    <rect x="1" y="40" width="22" height="3" rx="1" fill="#451a03"/>
    <rect x="5" y="36.5" width="14" height="2" rx="0.8" fill="url(#goldGrad)"/>

    <!-- Cup Body & Handles -->
    <path d="M 9.5 35 L 9.5 28 C 6 28 4 24 4 20 L 20 20 C 20 24 18 28 14.5 28 L 14.5 35 Z" fill="url(#goldGrad)"/>
    <!-- Left handle -->
    <path d="M 4 20 C 0 20 0 26 4 26" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M 20 20 C 24 20 24 26 20 26" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Radiant Gold Star atop Trophy -->
    <g transform="translate(12, 11)" filter="url(#glow)">
      <polygon points="0,-9 2.7,-2.7 9,-1.8 4.5,2.7 5.8,9 0,5.4 -5.8,9 -4.5,2.7 -9,-1.8 -2.7,-2.7" fill="url(#goldBright)"/>
      <polygon points="0,-9 2.7,-2.7 0,0 -2.7,-2.7" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <!-- CHARACTER: Confident, Happy Person Showcasing Their Strengths -->
  <g transform="translate(154, 48)">
    <!-- Shadow on desk -->
    <ellipse cx="38" cy="120" rx="30" ry="6" fill="#020617" opacity="0.45"/>

    <!-- Upper Body / Blazer -->
    <!-- Shoulders & Torso -->
    <path d="M 14 94 C 13 76 25 66 38 66 C 51 66 63 76 62 94 L 66 120 L 10 120 Z" fill="url(#jacketGrad)"/>

    <!-- Inner Shirt & Collar -->
    <polygon points="38,66 32,84 44,84" fill="#ffffff"/>
    <polygon points="38,76 36,92 38,97 40,92" fill="#f43f5e"/>

    <!-- Lapels -->
    <path d="M 25 68 L 33 90 L 38 90 L 31 68 Z" fill="#0284c7" opacity="0.8"/>
    <path d="M 51 68 L 43 90 L 38 90 L 45 68 Z" fill="#0369a1" opacity="0.8"/>

    <!-- Right Arm (Raised triumphantly holding glowing golden star) -->
    <path d="M 57 84 Q 69 74 71 58" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round"/>
    <!-- Raised Hand -->
    <circle cx="71" cy="56" r="4.5" fill="#fed7aa"/>
    <!-- Shining Gold Star held high in hand! -->
    <g transform="translate(71, 46)" filter="url(#glow)">
      <polygon points="0,-8 2.4,-2.4 8,-1.6 4,2.4 5.2,8 0,4.8 -5.2,8 -4,2.4 -8,-1.6 -2.4,-2.4" fill="url(#goldBright)"/>
      <polygon points="0,-8 2.4,-2.4 0,0 -2.4,-2.4" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Left Arm: Gracefully curved forward giving proud THUMBS UP towards the merits -->
    <path d="M 18 86 Q 4 90 -6 98" fill="none" stroke="#0284c7" stroke-width="8.5" stroke-linecap="round"/>
    
    <!-- Expressive Thumbs-Up Hand in clear space -->
    <g transform="translate(-16, 88)">
      <!-- Thumb pointing upright -->
      <path d="M 6 3 C 6 -3 9.5 -5 11.5 -5 C 13.5 -5 14 -3 13.5 3 L 13 7 L 8 7 Z" fill="#fed7aa"/>
      <path d="M 9.5 -3 L 12 -3" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
      <!-- Fist -->
      <rect x="2" y="4" width="12" height="12" rx="3.5" fill="#fba66c"/>
      <!-- Fingers detail -->
      <line x1="4" y1="7" x2="11" y2="7" stroke="#fdba74" stroke-width="1.3"/>
      <line x1="3" y1="10" x2="12" y2="10" stroke="#fdba74" stroke-width="1.3"/>
      <line x1="4" y1="13" x2="11" y2="13" stroke="#fdba74" stroke-width="1.3"/>
    </g>

    <!-- Neck -->
    <rect x="33" y="48" width="10" height="20" rx="4" fill="#fed7aa"/>
    <rect x="35" y="60" width="6" height="5" rx="2" fill="#fdba74" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="38" cy="41" rx="18" ry="19" fill="#fed7aa"/>

    <!-- Ears -->
    <circle cx="20" cy="43" r="4.5" fill="#fba66c"/>
    <circle cx="56" cy="43" r="4.5" fill="#fba66c"/>

    <!-- Cheeks (Warm Blush) -->
    <circle cx="27" cy="45" r="3.5" fill="#f43f5e" opacity="0.35"/>
    <circle cx="49" cy="45" r="3.5" fill="#f43f5e" opacity="0.35"/>

    <!-- Hair -->
    <path d="M 20 39 C 18 23 32 19 46 22 C 55 25 57 32 56 40 C 53 36 48 31 38 31 C 29 31 23 35 20 39 Z" fill="url(#hairGrad)"/>
    <path d="M 20 39 C 20 44 22 48 23 49 C 22 45 21 42 21 39 Z" fill="#0f172a"/>
    <path d="M 56 39 C 56 44 54 48 53 49 C 54 45 55 42 55 39 Z" fill="#0f172a"/>
    <path d="M 34 21 Q 40 16 45 20" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 26 34 Q 31 31 35 34" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 41 34 Q 45 31 50 34" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Happy Eyes ^ ^ -->
    <path d="M 27 39 Q 31 35 35 39" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 41 39 Q 45 35 49 39" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 38 40 L 37 44 L 39 44" fill="none" stroke="#fba66c" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Bright Joyful Smile -->
    <path d="M 32 46 Q 38 54 44 46 Z" fill="#881337"/>
    <path d="M 33.5 46.5 Q 38 50 42.5 46.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ambient Celebratory Sparkles (✦) -->
  <g filter="url(#glow)">
    <!-- Gold sparkle above trophy -->
    <path d="M 112 110 L 114 114 L 118 116 L 114 118 L 112 122 L 110 118 L 106 116 L 110 114 Z" fill="#fbbf24"/>
    <!-- Cyan sparkle above merit board -->
    <path d="M 34 46 L 35.5 49 L 39 50 L 35.5 51 L 34 54 L 32.5 51 L 29 50 L 32.5 49 Z" fill="#38bdf8"/>
    <!-- Gold sparkle near top star -->
    <path d="M 226 32 L 227.5 35 L 231 36 L 227.5 37 L 226 40 L 224.5 37 L 221 36 L 224.5 35 Z" fill="#fbbf24"/>
    <circle cx="135" cy="40" r="2" fill="#38bdf8"/>
    <circle cx="95" cy="180" r="1.5" fill="#34d399"/>
  </g>

  <!-- Foreground Vignette Shadows -->
  <path d="M 0 0 L 240 0 L 240 8 L 0 8 Z" fill="#020617" opacity="0.3"/>
  <path d="M 0 232 L 240 232 L 240 240 L 0 240 Z" fill="#020617" opacity="0.4"/>
</svg>