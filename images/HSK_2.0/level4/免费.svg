<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark-mode Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Tag & Ribbon Gradients -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Free Banner 3D Gradient -->
    <linearGradient id="freeBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Celebratory Ambient Glow behind Hero Tag -->
  <circle cx="120" cy="115" r="75" fill="#f59e0b" opacity="0.12" filter="url(#strongGlow)"/>
  <circle cx="120" cy="115" r="50" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>

  <!-- Background festive decorative streamers & stars -->
  <g opacity="0.4">
    <!-- Streamer ribbons -->
    <path d="M 25 35 Q 45 20 65 38 T 105 35" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 140 30 Q 165 45 190 28 T 225 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles & Confetti dots -->
  <g filter="url(#glow)">
    <circle cx="36" cy="62" r="2.5" fill="#fbbf24"/>
    <circle cx="204" cy="58" r="2.5" fill="#38bdf8"/>
    <circle cx="28" cy="145" r="2" fill="#ec4899"/>
    <circle cx="212" cy="150" r="2" fill="#10b981"/>
    <!-- Star sparkles -->
    <path d="M 50 82 Q 50 75 45 75 Q 50 75 50 68 Q 50 75 55 75 Q 50 75 50 82 Z" fill="#fbbf24"/>
    <path d="M 190 78 Q 190 71 185 71 Q 190 71 190 64 Q 190 71 195 71 Q 190 71 190 78 Z" fill="#fde047"/>
    <path d="M 120 40 Q 120 34 116 34 Q 120 34 120 28 Q 120 34 124 34 Q 120 34 120 40 Z" fill="#38bdf8"/>
  </g>

  <!-- ==================== BACKGROUND PROPS: EVENT ADMISSION TICKET ==================== -->
  <!-- Angled Event Ticket sitting behind the main price tag -->
  <g transform="translate(120, 112) rotate(10)" filter="url(#softShadow)">
    <rect x="-82" y="-48" width="164" height="96" rx="10" fill="url(#ticketGrad)" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Ticket notches -->
    <circle cx="-82" cy="0" r="8" fill="#0f172a"/>
    <circle cx="82" cy="0" r="8" fill="#0f172a"/>
    <!-- Perforation line -->
    <line x1="42" y1="-44" x2="42" y2="44" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Ticket decorative stars -->
    <path d="M 58 -20 L 60 -15 L 65 -15 L 61 -12 L 63 -7 L 58 -10 L 53 -7 L 55 -12 L 51 -15 L 56 -15 Z" fill="#fef08a"/>
    <path d="M 58 10 L 60 15 L 65 15 L 61 18 L 63 23 L 58 20 L 53 23 L 55 18 L 51 15 L 56 15 Z" fill="#fef08a"/>
  </g>

  <!-- ==================== HERO PROP: GIANT PROMINENT PRICE TAG (FREE / 0$) ==================== -->
  <!-- Slightly angled for dynamic, energetic appeal -->
  <g transform="translate(120, 115) rotate(-6)" filter="url(#softShadow)">
    <!-- Tag String Cord & Eyelet -->
    <path d="M -75 -45 Q -105 -80 -85 -95 Q -65 -110 -55 -85" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Big Price Tag Base -->
    <rect x="-78" y="-48" width="156" height="96" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="-75" y="-45" width="150" height="90" rx="11" fill="url(#tagGrad)"/>

    <!-- Tag Eyelet Ring on Left -->
    <circle cx="-62" cy="0" r="6" fill="#0f172a" stroke="#facc15" stroke-width="2"/>

    <!-- 1. CROSSED OUT OLD PRICE (Eliminated cost: $50 -> STRIKETHROUGH) -->
    <g transform="translate(-18, -24)">
      <!-- Old price text "$50" -->
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#94a3b8" letter-spacing="0.5">$50</text>
      <!-- Bold Red Strikethrough Line (Cancelling the cost) -->
      <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Arrow or Transition indicator -->
    <path d="M 8 -29 L 14 -29 L 11 -32 M 14 -29 L 11 -26" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. "0$" BADGE (Zero dollar price) -->
    <g transform="translate(36, -26)">
      <rect x="-16" y="-10" width="32" height="18" rx="5" fill="#10b981" filter="url(#glow)"/>
      <text x="0" y="3.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff">$0</text>
    </g>

    <!-- 3. HERO WORD: MASSIVE "FREE" BANNER -->
    <!-- Golden 3D Ribbon Banner for FREE -->
    <rect x="-68" y="-6" width="136" height="42" rx="8" fill="url(#freeBannerGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Bold 3D Depth Shadow for Text -->
    <text x="0" y="27" text-anchor="middle" font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#78350f" letter-spacing="2">FREE</text>
    <!-- Crisp Bright Top Layer of "FREE" Text -->
    <text x="0" y="25" text-anchor="middle" font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">FREE</text>

    <!-- Sparkle Stars on the FREE banner -->
    <polygon points="-58,8 -56,12 -52,12 -55,14 -54,18 -58,15 -62,18 -61,14 -64,12 -60,12" fill="#ffffff"/>
    <polygon points="58,8 60,12 64,12 61,14 62,18 58,15 54,18 55,14 52,12 56,12" fill="#ffffff"/>
  </g>

  <!-- ==================== INTERACTION: HANDS RECEIVING & PRESENTING ==================== -->
  <!-- Left Hand: Customer happily taking the free pass -->
  <g transform="translate(38, 172)" filter="url(#softShadow)">
    <!-- Arm sleeve (Coral jacket) -->
    <path d="M -20 30 L 10 0 L 22 10 L -8 40 Z" fill="#ea580c"/>
    <!-- Wrist & Palm reaching upward to grasp -->
    <path d="M 8 2 Q 22 -6 32 -2 Q 38 6 30 14 L 18 10 Z" fill="url(#skinGrad)"/>
    <!-- Fingers curled gently holding the card -->
    <ellipse cx="28" cy="2" rx="4" ry="6" fill="#fba66c"/>
    <ellipse cx="32" cy="6" rx="4" ry="5.5" fill="url(#skinGrad)"/>
    <ellipse cx="28" cy="11" rx="4" ry="5" fill="url(#skinGrad)"/>
    <!-- Thumb holding front -->
    <path d="M 18 -2 C 24 -6 28 -2 24 5 Z" fill="#fed7aa"/>
  </g>

  <!-- Right Hand: Staff warmly offering with open welcoming gesture -->
  <g transform="translate(195, 175)" filter="url(#softShadow)">
    <!-- Arm sleeve (Teal uniform) -->
    <path d="M 25 35 L -4 6 L -16 16 L 15 45 Z" fill="#0891b2"/>
    <!-- Open palm supporting underneath -->
    <path d="M -5 8 Q -18 2 -26 8 Q -30 16 -20 20 L -12 16 Z" fill="url(#skinGrad)"/>
    <!-- Extended welcoming fingers -->
    <ellipse cx="-24" cy="11" rx="4" ry="5.5" fill="url(#skinGrad)"/>
    <ellipse cx="-20" cy="15" rx="4" ry="5.5" fill="url(#skinGrad)"/>
  </g>

  <!-- ==================== ZERO MONEY SPENT VISUAL: WALLET STAYING SHUT ==================== -->
  <!-- Bottom center: Closed wallet with a green checkmark or lock (0 spent) -->
  <g transform="translate(120, 202)" filter="url(#softShadow)">
    <!-- Mini closed leather wallet -->
    <rect x="-20" y="-12" width="40" height="24" rx="4" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="12" cy="0" r="2.5" fill="#fbbf24"/>
    <!-- Green complimentary badge floating on top of wallet -->
    <circle cx="-14" cy="-8" r="7" fill="#10b981" stroke="#047857" stroke-width="1"/>
    <!-- Checkmark indicating cost-free success -->
    <path d="M -17 -8 L -15 -6 L -11 -10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Floor Fade -->
  <rect x="0" y="226" width="240" height="14" fill="url(#bgGrad)" opacity="0.7"/>
</svg>