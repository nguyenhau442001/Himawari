<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="48%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Natural Warm Skin Gradient -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="35%" stop-color="#fed7aa"/>
      <stop offset="75%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fba66c"/>
    </linearGradient>

    <!-- Athletic T-Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Shorts / Pants Gradient -->
    <linearGradient id="pantsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Pain Relief / Care Glow Aura -->
    <radialGradient id="careGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment: Fitness Studio / Home Exercise Space -->
  <g opacity="0.22">
    <!-- Window Frame -->
    <rect x="24" y="24" width="45" height="55" rx="4" fill="none" stroke="#475569" stroke-width="1.5"/>
    <line x1="46.5" y1="24" x2="46.5" y2="79" stroke="#475569" stroke-width="1.5"/>
    <line x1="24" y1="51.5" x2="69" y2="51.5" stroke="#475569" stroke-width="1.5"/>

    <!-- Plant on Shelf -->
    <rect x="175" y="55" width="42" height="4" rx="2" fill="#475569"/>
    <path d="M 188 55 L 191 44 L 201 44 L 204 55 Z" fill="#64748b"/>
    <circle cx="196" cy="40" r="7" fill="#10b981"/>
  </g>

  <!-- Floor Surface -->
  <path d="M 0 188 L 240 188 L 240 240 L 0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="188" x2="240" y2="188" stroke="#475569" stroke-width="2"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#0f172a" stroke-width="1"/>

  <!-- CHARACTER: RELIEVING A SORE ARM VIA ARM STRETCH ("我的胳膊有点疼") -->
  <g transform="translate(0, 10)">
    <!-- Shadow on floor -->
    <ellipse cx="120" cy="186" rx="52" ry="8" fill="#020617" opacity="0.55"/>

    <!-- Sporty Shorts / Lower Body -->
    <path d="M 94 165 L 86 195 L 115 195 L 120 175 L 125 195 L 154 195 L 146 165 Z" fill="url(#pantsGrad)"/>
    <rect x="94" y="162" width="52" height="5" rx="2" fill="#334155"/>

    <!-- Torso / Athletic T-Shirt -->
    <path d="M 85 95 C 83 76 98 66 120 66 C 142 66 157 76 155 95 L 147 165 L 93 165 Z" fill="url(#shirtGrad)"/>

    <!-- Crew Neck Collar -->
    <path d="M 108 66 C 108 76 132 76 132 66 Z" fill="#0284c7"/>
    <path d="M 110 66 C 110 74 130 74 130 66 Z" fill="#fed7aa"/>

    <!-- Head & Neck -->
    <g id="head">
      <!-- Neck -->
      <rect x="114" y="52" width="12" height="17" rx="5" fill="url(#skinGrad)"/>
      <rect x="116" y="61" width="8" height="6" rx="2" fill="#fba66c" opacity="0.4"/>

      <!-- Head Shape -->
      <ellipse cx="120" cy="42" rx="19" ry="20" fill="url(#skinGrad)"/>

      <!-- Ears -->
      <circle cx="101" cy="44" r="4.5" fill="#fba66c"/>
      <circle cx="139" cy="44" r="4.5" fill="#fba66c"/>

      <!-- Hair -->
      <path d="M 101 40 C 99 24 113 19 127 22 C 136 25 138 33 137 41 C 134 37 129 32 119 32 C 110 32 104 36 101 40 Z" fill="url(#hairGrad)"/>
      <path d="M 101 40 C 101 45 103 49 104 50 C 103 46 102 43 102 40 Z" fill="#0f172a"/>
      <path d="M 137 40 C 137 45 135 49 134 50 C 135 46 136 43 136 40 Z" fill="#0f172a"/>
      <path d="M 115 21 Q 121 16 126 20" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

      <!-- Eyebrows (Empathetic / gentle relief expression) -->
      <path d="M 107 35 Q 112 33 116 36" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 124 36 Q 128 33 133 35" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Eyes (Pleasant, focused on stretching ^ ^) -->
      <path d="M 108 41 Q 112 37 116 41" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 124 41 Q 128 37 132 41" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M 120 41 L 119 45 L 121 45" fill="none" stroke="#fba66c" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Gentle Caring Smile -->
      <path d="M 115 49 Q 120 54 125 49" fill="none" stroke="#881337" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Cheeks -->
      <circle cx="107" cy="45" r="3.2" fill="#f43f5e" opacity="0.3"/>
      <circle cx="133" cy="45" r="3.2" fill="#f43f5e" opacity="0.3"/>

      <!-- Relief / Sweat Drop -->
      <path d="M 136 34 C 136 34, 134 37, 134 39 C 134 40.5 135 41.5 136.5 41.5 C 138 41.5 139 40.5 139 39 C 139 37, 136 34, 136 34 Z" fill="#38bdf8" opacity="0.85"/>
    </g>

    <!-- Left Shoulder Sleeve (Sleeve of the arm being stretched) -->
    <path d="M 148 90 L 165 105 L 155 111 L 140 98 Z" fill="#0369a1"/>

    <!-- Right Shoulder Sleeve (Sleeve of the supporting arm) -->
    <path d="M 92 90 L 75 105 L 85 111 L 98 98 Z" fill="#0284c7"/>

    <!-- THE SUPPORTING ARM (Character's Right Arm: bends UP from below to hook and hold the sore arm) -->
    <path d="M 78 104 Q 72 126 78 144 Q 86 148 95 140 L 105 118" fill="none" stroke="url(#skinGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- THE HERO OBJECT: THE COMPLETE STRETCHED ARM (胳膊 - GĒBO) -->
    <!-- Extends horizontally across chest from shoulder (152, 98) across to hand (54, 118) -->
    <!-- 1. Upper Arm (Bicep / Tricep) -->
    <path d="M 152 100 Q 138 108 122 112" fill="none" stroke="url(#skinGrad)" stroke-width="17" stroke-linecap="round"/>
    
    <!-- 2. Elbow Joint & Forearm extending smoothly across chest -->
    <path d="M 124 112 Q 95 116 72 120" fill="none" stroke="url(#skinGrad)" stroke-width="15" stroke-linecap="round"/>

    <!-- Supporting Hand wrapping gently over the sore arm -->
    <g transform="translate(97, 107)">
      <!-- Clasping palm and fingers -->
      <path d="M 2 8 C 2 3 6 0 11 0 C 15 0 18 3 18 8 L 18 16 C 18 19 15 21 11 21 C 6 21 2 19 2 16 Z" fill="url(#skinGrad)"/>
      <line x1="5" y1="5" x2="14" y2="5" stroke="#fdba74" stroke-width="1.3"/>
      <line x1="4" y1="8" x2="15" y2="8" stroke="#fdba74" stroke-width="1.3"/>
      <line x1="4" y1="11" x2="15" y2="11" stroke="#fdba74" stroke-width="1.3"/>
      <!-- Thumb wrapping over top -->
      <path d="M 2 8 C -1 8 -3 6 -3 3 C -3 0 0 -1 3 -1 L 6 3 Z" fill="#ffedd5"/>
    </g>

    <!-- 3. Extended Hand & Fingers (Clearly showing a real human hand at the end of the arm) -->
    <g transform="translate(52, 112)">
      <!-- Palm -->
      <ellipse cx="18" cy="8" rx="8" ry="6.5" fill="url(#skinGrad)"/>
      <!-- Natural open stretched fingers -->
      <path d="M 14 6 L 0 5" stroke="url(#skinGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 14 8 L -4 8" stroke="url(#skinGrad)" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M 14 10 L -3 11" stroke="url(#skinGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 14 12 L 1 13" stroke="url(#skinGrad)" stroke-width="3" stroke-linecap="round"/>
      <!-- Thumb -->
      <path d="M 16 4 Q 12 -1 8 0" stroke="#ffedd5" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <!-- Anatomical Muscle Highlights on the Arm -->
    <path d="M 148 98 Q 135 106 120 109" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/>
    <path d="M 112 110 Q 92 114 74 118" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Bicep muscle curve -->
    <path d="M 138 114 Q 130 118 122 117" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.35"/>

    <!-- SOOTHING / PAIN RELIEF GLOW AURA (Context: "胳膊有点疼" - Gentle Relief) -->
    <g transform="translate(122, 114)" filter="url(#glow)">
      <!-- Warm amber soothing glow -->
      <circle cx="0" cy="0" r="16" fill="url(#careGlow)"/>
      <!-- Relief / healing sparkles -->
      <path d="M 0 -8 L 1.5 -2.5 L 7 -1.5 L 2 1.5 L 3 7 L 0 4 L -3 7 L -2 1.5 L -7 -1.5 L -1.5 -2.5 Z" fill="#fbbf24"/>
      <circle cx="10" cy="6" r="1.5" fill="#f59e0b"/>
      <circle cx="-10" cy="4" r="1.2" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Ambient Sparkles in Background -->
  <g filter="url(#glow)">
    <circle cx="205" cy="115" r="2" fill="#38bdf8"/>
    <circle cx="35" cy="95" r="1.8" fill="#fbbf24"/>
    <circle cx="160" cy="170" r="1.5" fill="#34d399"/>
  </g>

  <!-- Foreground Vignette Shadows -->
  <path d="M 0 0 L 240 0 L 240 8 L 0 8 Z" fill="#020617" opacity="0.3"/>
  <path d="M 0 232 L 240 232 L 240 240 L 0 240 Z" fill="#020617" opacity="0.4"/>
</svg>