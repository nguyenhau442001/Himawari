<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Eureka Radial Glow -->
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Lightbulb Body Gradient -->
    <linearGradient id="bulb-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Character Hoodie Gradient -->
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#090d16" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ================= 1. BACKGROUND ENVIRONMENT ================= -->
  <!-- Ambient Wall Horizon & Shelf Line -->
  <line x1="0" y1="116" x2="240" y2="116" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Study Window on Left (Night city view) -->
  <g transform="translate(16, 26)">
    <rect width="38" height="52" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <line x1="19" y1="0" x2="19" y2="52" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="26" x2="38" y2="26" stroke="#334155" stroke-width="1.5" />
    <!-- Distant stars / lights -->
    <circle cx="10" cy="14" r="1.2" fill="#f8fafc" opacity="0.8" />
    <circle cx="27" cy="18" r="1" fill="#38bdf8" opacity="0.7" />
    <circle cx="12" cy="38" r="1" fill="#fbbf24" opacity="0.6" />
  </g>

  <!-- Creative Sticky Notes Pinboard on Right Wall -->
  <g transform="translate(186, 28)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#ec4899" transform="rotate(-6 8 8)" opacity="0.85" />
    <rect x="18" y="4" width="15" height="15" rx="2" fill="#38bdf8" transform="rotate(8 25 11)" opacity="0.85" />
    <rect x="6" y="20" width="16" height="16" rx="2" fill="#10b981" transform="rotate(3 14 28)" opacity="0.85" />
  </g>

  <!-- ================= 2. THE "IDEA / CHỦ Ý" (RADIANT LIGHTBULB) ================= -->
  <!-- Large Warm Radial Halo -->
  <circle cx="120" cy="44" r="44" fill="url(#bulb-glow)" />

  <g id="idea_bulb" transform="translate(120, 44)">
    <!-- Radiating Ray Bursts -->
    <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-29" x2="0" y2="-37" />
      <line x1="21" y1="-21" x2="27" y2="-27" />
      <line x1="29" y1="-2" x2="37" y2="-2" />
      <line x1="-21" y1="-21" x2="-27" y2="-27" />
      <line x1="-29" y1="-2" x2="-37" y2="-2" />
    </g>

    <!-- Sparkle Stars (Inspiration bursts) -->
    <!-- Top-Right Sparkle -->
    <path d="M26 -31 Q27 -36 32 -37 Q27 -38 26 -43 Q25 -38 20 -37 Q25 -36 26 -31 Z" fill="#fde047" />
    <!-- Top-Left Sparkle -->
    <path d="M-26 -27 Q-25 -31 -21 -32 Q-25 -33 -26 -37 Q-27 -33 -31 -32 Q-27 -31 -26 -27 Z" fill="#38bdf8" />
    <!-- Colorful Accent Dots -->
    <circle cx="34" cy="12" r="2.2" fill="#10b981" />
    <circle cx="-32" cy="10" r="2" fill="#ec4899" />
    <circle cx="0" cy="-42" r="1.8" fill="#fbbf24" />

    <!-- Lightbulb Glass Shape -->
    <path d="M-15 -6 C-17 -18 -8 -27 0 -27 C8 -27 17 -18 15 -6 C14 2 9 8 8 13 L-8 13 C-9 8 -14 2 -15 -6 Z" 
          fill="url(#bulb-grad)" filter="url(#shadow)" />

    <!-- Inner Luminous Filament (Loop) -->
    <path d="M-5 11 L-5 0 C-5 -5 -1 -7 -1 -2 C-1 -7 4 -7 4 0 L4 11" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="-1" cy="-4" r="1.5" fill="#ffffff" />

    <!-- Glass Highlight Reflection -->
    <path d="M-11 -12 C-11 -19 -6 -23 0 -23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Metallic Screw Base -->
    <rect x="-7.5" y="13" width="15" height="3.5" rx="1.5" fill="#94a3b8" />
    <rect x="-6.5" y="17.5" width="13" height="3" rx="1.2" fill="#64748b" />
    <path d="M-4.5 21 L4.5 21 L3 24 L-3 24 Z" fill="#475569" />
  </g>

  <!-- ================= 3. SEATED CHARACTER (MIDGROUND) ================= -->
  <!-- Chair Backrest Silhouette behind character -->
  <rect x="92" y="140" width="56" height="40" rx="8" fill="#1e293b" opacity="0.8" />

  <!-- Body / Torso (Extends naturally down behind desk) -->
  <path d="M78 210 C78 152 98 136 120 136 C142 136 162 152 162 210 Z" fill="url(#hoodie-grad)" />
  <!-- Collar & Hoodie drawstrings -->
  <path d="M111 136 L120 146 L129 136" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="115" y1="146" x2="114" y2="158" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />
  <line x1="125" y1="146" x2="126" y2="158" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />

  <!-- Left Arm (Reaching forward to desk) -->
  <path d="M92 146 Q74 162 78 184" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="115" y="128" width="10" height="12" rx="3" fill="#ffedd5" />

  <!-- Ears -->
  <circle cx="98" cy="119" r="4.5" fill="#ffedd5" />
  <circle cx="142" cy="119" r="4.5" fill="#ffedd5" />

  <!-- Head -->
  <circle cx="120" cy="119" r="21" fill="#ffedd5" />

  <!-- Modern Hair with volume & stylish bangs -->
  <path d="M97 115 C96 95 108 89 120 89 C134 89 144 95 143 115 C140 105 133 100 122 100 C112 100 104 105 97 115 Z" fill="#1e293b" />
  <!-- Hair highlight from lightbulb -->
  <path d="M112 91 C117 89 123 89 128 91" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.45" fill="none" />
  <!-- Front fringe / bangs -->
  <path d="M101 101 C108 97 116 105 120 101 C122 106 128 103 135 107 C131 99 125 97 119 97 C113 97 107 99 101 101 Z" fill="#1e293b" />

  <!-- Facial Features (Inspired Eureka expression) -->
  <!-- Arched Expressive Eyebrows -->
  <path d="M107 109 Q112 105 116 108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <path d="M124 108 Q128 105 133 109" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Lively Sparkle Eyes -->
  <ellipse cx="112" cy="116" rx="2.2" ry="2.8" fill="#0f172a" />
  <ellipse cx="128" cy="116" rx="2.2" ry="2.8" fill="#0f172a" />
  <circle cx="113" cy="115" r="1" fill="#ffffff" />
  <circle cx="129" cy="115" r="1" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <circle cx="106" cy="122" r="3.2" fill="#fda4af" opacity="0.65" />
  <circle cx="134" cy="122" r="3.2" fill="#fda4af" opacity="0.65" />

  <!-- Joyful Smiling Mouth (Open smile with teeth) -->
  <path d="M115 124 Q120 132 125 124 Z" fill="#be123c" />
  <path d="M116 124 Q120 127 124 124" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- ================= 4. FOREGROUND DESK & PROPS ================= -->
  <!-- Desk Base Surface -->
  <path d="M0 174 L240 174 L240 240 L0 240 Z" fill="url(#desk-grad)" />
  <line x1="0" y1="174" x2="240" y2="174" stroke="#64748b" stroke-width="2.5" />

  <!-- Open Study Notebook on Left Desk -->
  <g transform="translate(22, 180)">
    <path d="M0 10 L26 4 L52 10 L52 36 L26 30 L0 36 Z" fill="#f8fafc" filter="url(#shadow)" />
    <line x1="26" y1="4" x2="26" y2="30" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Notes lines -->
    <line x1="6" y1="14" x2="20" y2="11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="20" x2="19" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="11" x2="46" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="17" x2="45" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Left Hand & Pencil resting on desk -->
  <g transform="translate(76, 178)">
    <!-- Yellow Pencil angled toward notebook -->
    <line x1="12" y1="-2" x2="-4" y2="12" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="-4" cy="12" r="1.2" fill="#0f172a" />
    <!-- Left sleeve cuff -->
    <line x1="0" y1="4" x2="8" y2="11" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <!-- Hand grip -->
    <circle cx="5" cy="5" r="5.5" fill="#ffedd5" />
  </g>

  <!-- Ceramic Coffee Mug on Right Desk -->
  <g transform="translate(186, 178)">
    <rect x="0" y="8" width="18" height="22" rx="3" fill="#f43f5e" />
    <path d="M18 13 C23 13 23 23 18 23" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    <ellipse cx="9" cy="8" rx="9" ry="3" fill="#fb7185" />
    <ellipse cx="9" cy="8" rx="7" ry="2" fill="#78350f" />
    <!-- Steam wisps -->
    <path d="M7 3 Q9 0 7 -3" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M11 4 Q13 1 11 -2" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- ================= 5. FOREGROUND RAISED RIGHT ARM & GESTURE ================= -->
  <!-- Natural bent elbow: shoulder -> elbow bent out -> forearm pointing up to bulb -->
  <path d="M148 148 L 166 142 L 152 98" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Sleeve cuff -->
  <line x1="147" y1="100" x2="157" y2="97" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
  <!-- Raised Hand -->
  <circle cx="151" cy="94" r="6" fill="#ffedd5" />
  <!-- Pointing Index Finger gesturing up toward the lightbulb -->
  <rect x="148" y="78" width="5" height="17" rx="2.5" fill="#ffedd5" />
  <!-- Curled fingers detail -->
  <path d="M147 92 C145 96 153 96 152 92" stroke="#fbcfe8" stroke-width="1.5" fill="none" />

  <!-- Energy sparks near pointing finger -->
  <path d="M161 80 L168 76" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" />
  <path d="M159 90 L167 94" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="163" cy="85" r="1.8" fill="#38bdf8" />
</svg>
