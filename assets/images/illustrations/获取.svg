<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Glow for Success -->
    <radialGradient id="successGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Background & Environment -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Ambient Success Radiance -->
  <circle cx="120" cy="110" r="90" fill="url(#successGlow)" />

  <!-- Room Interior Elements (Shelf, Plant, Light) -->
  <!-- Bookshelf Background -->
  <path d="M30 60 H90 V140 H30 Z" fill="#1e293b" opacity="0.5" />
  <rect x="35" y="80" width="50" height="6" fill="#334155" rx="3" />
  <rect x="35" y="110" width="50" height="6" fill="#334155" rx="3" />
  <!-- Mini Books on Shelf -->
  <rect x="40" y="66" width="8" height="14" fill="#38bdf8" rx="1" />
  <rect x="50" y="64" width="10" height="16" fill="#ec4899" rx="1" />
  <rect x="62" y="68" width="6" height="12" fill="#10b981" rx="1" />

  <!-- Window with Night City Silhouette / Moonlight -->
  <path d="M165 40 H205 V120 H165 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M185 40 V120 M165 80 H205" stroke="#334155" stroke-width="1.5" />
  <!-- City building shapes outside window -->
  <rect x="170" y="90" width="8" height="30" fill="#1e293b" />
  <rect x="180" y="70" width="10" height="50" fill="#1e293b" />
  <rect x="193" y="85" width="9" height="35" fill="#1e293b" />
  <circle cx="174" cy="95" r="1" fill="#fef08a" />
  <circle cx="185" cy="75" r="1" fill="#fef08a" />
  <circle cx="188" cy="90" r="1" fill="#fef08a" />

  <!-- 2. Desk & Workspace Setup -->
  <!-- Desk Surface -->
  <path d="M15 170 H225 V215 H15 Z" fill="url(#deskGrad)" />
  <rect x="15" y="165" width="210" height="8" fill="#475569" rx="2" />
  <rect x="25" y="215" width="15" height="25" fill="#0f172a" />
  <rect x="200" y="215" width="15" height="25" fill="#0f172a" />

  <!-- Laptop / Computer Setup -->
  <path d="M75 140 H135 L145 170 H65 Z" fill="#475569" />
  <path d="M80 100 H130 V140 H80 Z" fill="#334155" rx="3" />
  <!-- Screen Glow -->
  <rect x="83" y="103" width="44" height="34" fill="#0f172a" rx="2" />
  <path d="M85 110 L95 125 L105 115 L120 130 H125" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="120" cy="130" r="3" fill="#10b981" />

  <!-- Desk Props: Plant & Coffee Mug -->
  <!-- Plant Pot -->
  <path d="M45 150 L50 165 H36 L41 150 Z" fill="#cbd5e1" />
  <path d="M41 150 H45 C45 142 37 142 37 150 Z" fill="#10b981" />
  <path d="M43 150 C47 140 52 145 47 150 Z" fill="#059669" />

  <!-- Coffee Mug with steam -->
  <path d="M160 152 H174 V167 C174 170 171 172 167 172 H163 C159 172 156 170 156 167 V152 Z" fill="#f8fafc" />
  <path d="M174 156 H177 C179 156 180 158 180 160 C180 162 179 164 177 164 H174" stroke="#f8fafc" stroke-width="2" fill="none" />
  <!-- Steam lines -->
  <path d="M163 144 C163 142 166 141 166 138" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M168 146 C168 144 171 143 171 140" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- 3. Main Character (Hardworking professional/student achieving success) -->
  <!-- Chair Back -->
  <path d="M95 90 H125 V165 H95 Z" fill="#334155" rx="6" opacity="0.8" />

  <!-- Character Body (Torso in Hoodie/Shirt) -->
  <path d="M85 145 C85 125 135 125 135 145 V175 H85 Z" fill="#2563eb" filter="url(#softShadow)" />
  <!-- Collar -->
  <path d="M102 125 L110 135 L118 125 Z" fill="#ffffff" />

  <!-- Character Head & Face -->
  <circle cx="110" cy="100" r="18" fill="#ffedd5" />
  <!-- Hair (Modern stylish dark hair) -->
  <path d="M92 98 C92 85 128 85 128 98 C128 102 126 95 120 92 C115 90 105 90 100 92 C94 95 92 98 92 98 Z" fill="#0f172a" />
  
  <!-- Facial Expression: Determined, joyful eyes & smiling mouth -->
  <circle cx="104" cy="99" r="1.5" fill="#1e293b" />
  <circle cx="116" cy="99" r="1.5" fill="#1e293b" />
  <path d="M107 106 Q110 109 113 106" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Cheeks (Excitement blush) -->
  <circle cx="102" cy="103" r="2.5" fill="#fda4af" opacity="0.6" />
  <circle cx="118" cy="103" r="2.5" fill="#fda4af" opacity="0.6" />

  <!-- Arms in Action (Stretching / Lifting Trophy) -->
  <!-- Left Arm (Holding trophy base or supporting) -->
  <path d="M85 135 L65 115 L75 105 L92 125" fill="#2563eb" />
  <!-- Left Hand -->
  <circle cx="70" cy="110" r="4" fill="#ffedd5" />

  <!-- Right Arm (Lifting high in triumph) -->
  <path d="M135 135 L155 100 L145 90 L125 120" fill="#2563eb" />
  <!-- Right Hand holding Trophy -->
  <circle cx="150" cy="95" r="4" fill="#ffedd5" />

  <!-- 4. The Trophy (Symbolizing Success/Achievement - 获取成功) -->
  <g transform="translate(130, 45)" filter="url(#softShadow)">
    <!-- Trophy Base -->
    <path d="M15 55 H25 V62 H15 Z" fill="#334155" />
    <path d="M12 62 H28 V65 H12 Z" fill="#1e293b" />
    <path d="M18 45 H22 V55 H18 Z" fill="#94a3b8" />
    
    <!-- Trophy Cup Body -->
    <path d="M10 20 C10 40 30 40 30 20 Z" fill="url(#goldGrad)" />
    <path d="M8 20 H32 V23 C32 35 8 35 8 23 Z" fill="url(#goldGrad)" />
    <!-- Cup Rim -->
    <ellipse cx="20" cy="20" rx="12" ry="3" fill="#fef08a" />
    <ellipse cx="20" cy="20" rx="10" ry="2" fill="#d97706" />

    <!-- Trophy Handles -->
    <path d="M9 22 C2 22 2 32 9 34" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M31 22 C38 22 38 32 31 34" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Star Emblem on Trophy -->
    <path d="M20 25 L21.5 28.5 H25 L22.2 30.5 L23.3 34 L20 32 L16.7 34 L17.8 30.5 L15 28.5 H18.5 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- 5. Sparkles & Effort/Achievement Elements -->
  <!-- Floating Golden Sparkles representing 'huòqǔ' (acquiring success through effort) -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M110 50 L112 55 L117 57 L112 59 L110 64 L108 59 L103 57 L108 55 Z" />
    <!-- Star 2 -->
    <path d="M165 45 L166 48 L169 49 L166 50 L165 53 L164 50 L161 49 L164 48 Z" transform="scale(0.8) translate(40, 10)" />
    <!-- Star 3 -->
    <path d="M70 70 L71 73 L74 74 L71 75 L70 78 L69 75 L66 74 L69 73 Z" />
  </g>

  <!-- Energy / Effort wave lines around the character -->
  <path d="M60 130 C50 120 50 100 65 90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M170 125 C180 115 180 95 165 85" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Subtle floor shadow under desk & chair -->
  <ellipse cx="120" cy="225" rx="90" ry="6" fill="#020617" opacity="0.4" />
</svg>