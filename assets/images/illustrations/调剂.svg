    <path d="M120 100L138 82" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>

    <!-- Interface Markers (Tuning notches) -->
    <circle cx="120" cy="56" r="2.5" fill="#FF9F43"/>
    <circle cx="158" cy="85" r="2.5" fill="#4F5D73"/>
    <circle cx="158" cy="115" r="2.5" fill="#4F5D73"/>
    <circle cx="120" cy="144" r="2.5" fill="#4F5D73"/>
    <circle cx="82" cy="115" r="2.5" fill="#4F5D73"/>
    <circle cx="82" cy="85" r="2.5" fill="#4F5D73"/>
  </g>

  <!-- Floating Decorative Elements (representing work-life harmony/adjustment) -->
  <!-- Sparkle 1 (Top Left) -->
  <path d="M68 62C68 68 64 70 64 70C64 70 68 72 68 78C68 72 72 70 72 70C72 70 68 68 68 62Z" fill="#FF9F43" opacity="0.8"/>
  
  <!-- Sparkle 2 (Top Right) -->
  <path d="M176 54C176 59 173 61 173 61C173 61 176 63 176 68C176 63 179 61 179 61C179 61 176 59 176 54Z" fill="#54A0FF" opacity="0.8"/>

