  <!-- Subtle Background Glow / Desk Surface -->
  <path d="M40 180C40 174.477 44.4772 170 50 170H190C195.523 170 200 174.477 200 180V184C200 189.523 195.523 194 190 194H50C44.4772 194 40 189.523 40 184V180Z" fill="#262A35"/>

  <!-- Central Physical Object: A modern, sleek life-balance / seasoning control device (Metaphor for 'Tiáojì' - adjustment/balancing of life and work) -->
