<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor platform -->
  <ellipse cx="120" cy="180" rx="70" ry="16" fill="#222730"/>

  <!-- Main Object: Cleaning Spray Bottle (representing hygiene / 卫生) -->
  <g transform="translate(0, -5)">
    <!-- Bottle Body -->
    <path d="M 98,100 L 142,100 C 146,100 148,103 148,108 L 146,170 C 146,175 142,179 137,179 L 103,179 C 98,179 94,175 94,170 L 92,108 C 92,103 94,100 98,100 Z" fill="#20B2AA"/>
    
    <!-- Bottle Liquid Level (Transparency effect) -->
    <path d="M 93,125 L 145,125 L 146,170 C 146,175 142,179 137,179 L 103,179 C 98,179 94,175 94,170 Z" fill="#48D1CC"/>
    
    <!-- Bottle Neck -->
    <rect x="106" y="82" width="28" height="18" fill="#1ABC9C"/>
    <rect x="104" y="78" width="32" height="6" rx="3" fill="#EAEAEA"/>

    <!-- Trigger Sprayer Head -->
    <path d="M 100,60 L 145,60 C 149,60 152,63 152,67 L 152,74 C 152,78 149,81 145,81 L 100,81 Z" fill="#EAEAEA"/>
    <!-- Nozzle tip -->
    <rect x="146" y="65" width="10" height="6" rx="2" fill="#F1C40F"/>
    <!-- Trigger handle -->
    <path d="M 106,82 C 106,82 96,86 96,94 C 96,102 104,102 106,98 Z" fill="#D2D6DC"/>
  </g>

  <!-- Sparkles / Cleanliness indicators (Gold/Orange accents) -->
  <g fill="#F1C40F">
    <!-- Top-Right Sparkle -->
    <path d="M 175,60 Q 175,70 185,70 Q 175,70 175,80 Q 175,70 165,70 Q 175,70 175,60 Z"/>
    
    <!-- Left Sparkle -->
    <path d="M 65,115 Q 65,122 72,122 Q 65,122 65,129 Q 65,122 58,122 Q 65,122 65,115 Z"/>
    
    <!-- Bottom-Right Sparkle -->
    <path d="M 160,155 Q 160,160 165,160 Q 160,160 160,165 Q 160,160 155,160 Q 160,160 160,155 Z"/>
  </g>

  <!-- Hygiene Bubbles -->
  <circle cx="82" cy="90" r="5" fill="#48D1CC" opacity="0.6"/>
  <circle cx="158" cy="95" r="3" fill="#48D1CC" opacity="0.8"/>
  <circle cx="74" cy="140" r="4" fill="#48D1CC" opacity="0.5"/>
</svg>