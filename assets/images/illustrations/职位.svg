<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow behind the desk/chair -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Office Desk & Executive Chair (Representing "职位" / Job Position, Title, Office) -->
  
  <!-- High-back Executive Chair -->
  <!-- Chair Base / Wheels -->
  <g fill="#4A5568">
    <ellipse cx="120" cy="195" rx="26" ry="6"/>
    <rect x="117" y="175" width="6" height="20" rx="2"/>
    <path d="M94 195 L120 177 L146 195" stroke="#4A5568" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Chair Seat -->
  <path d="M90 145 C90 140, 150 140, 150 145 L155 165 C155 170, 85 170, 85 165 Z" fill="#2D3748"/>
  
  <!-- Chair Backrest (Tall executive style indicating higher position/rank) -->
  <path d="M96 75 C96 68, 144 68, 144 75 L150 145 C150 148, 90 148, 90 145 Z" fill="#3182CE"/>
  <path d="M104 85 C104 82, 136 82, 136 85 L138 135 C138 137, 102 137, 102 135 Z" fill="#2B6CB0" opacity="0.6"/>

  <!-- Executive Desk -->
  <!-- Desk Base / Legs -->
  <rect x="65" y="165" width="12" height="40" rx="3" fill="#4A5568"/>
  <rect x="163" y="165" width="12" height="40" rx="3" fill="#4A5568"/>
  
  <!-- Desk Top Surface -->
  <path d="M45 155 L195 155 L205 165 L35 165 Z" fill="#CBD5E0"/>
  <path d="M35 165 L205 165 L205 172 L35 172 Z" fill="#A0AEC0"/>

  <!-- Professional Desk Items (Signifying status, responsibility, management) -->
  <!-- Laptop -->
  <path d="M90 152 L150 152 L156 155 L84 155 Z" fill="#E2E8F0"/>
  <rect x="100" y="132" width="40" height="20" rx="2" fill="#718096"/>
  <rect x="103" y="135" width="34" height="14" fill="#EDF2F7"/>

  <!-- Nameplate / Title Plaque on Desk (Symbolizing "职位" / Title & Role) -->
  <g transform="translate(145, 138)">
    <polygon points="0,12 8,2 32,2 40,12" fill="#D69E2E"/>
    <polygon points="4,14 36,14 40,17 0,17" fill="#B7791F"/>
    <line x1="10" y1="7" x2="30" y2="7" stroke="#744210" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="10" x2="26" y2="10" stroke="#744210" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Golden Accent / Promotion Star (Representing career advancement and prestigious position) -->
  <g transform="translate(120, 42)">
    <circle cx="0" cy="0" r="18" fill="#D69E2E" opacity="0.2"/>
    <path d="M0 -12 L3.5 -3.5 L12 -3.5 L5.5 2 L8 10 L0 5.5 L-8 10 L-5.5 2 L-12 -3.5 L-3.5 -3.5 Z" fill="#ECC94B"/>
