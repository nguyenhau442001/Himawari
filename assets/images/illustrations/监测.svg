<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="75" y="45" width="90" height="65" rx="6"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Glow -->
  <circle cx="120" cy="80" r="80" fill="url(#glow)"/>

  <!-- Scene Context: Window showing outside environment (Air Quality / Nature) -->
  <g id="window-scene">
    <!-- Window Frame -->
    <rect x="15" y="30" width="45" height="85" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="19" y="34" width="37" height="77" fill="#0284c7" fill-opacity="0.2"/>
    <!-- Outside elements: Green tree representing environment -->
    <path d="M37 70 Q30 50 37 40 Q45 50 37 70" fill="url(#treeGrad)"/>
    <rect x="35" y="70" width="4" height="25" fill="#78350f"/>
    <!-- Small bird/nature detail -->
    <path d="M25 50 Q28 47 31 50 Q28 52 25 50" fill="#cbd5e1"/>
  </g>

  <!-- Environmental Monitoring Device (Air Quality Sensor Station) outside/mounted -->
  <g id="sensor-probe">
    <path d="M50 85 L75 85" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="85" r="5" fill="#f59e0b"/>
    <circle cx="50" cy="85" r="2" fill="#ef4444"/>
    <!-- Wave signals from sensor -->
    <path d="M45 75 Q40 85 45 95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M41 72 Q34 85 41 98" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Desk Surface -->
  <path d="M10 195 L230 195 L220 220 L20 220 Z" fill="#0f172a"/>
  <rect x="10" y="190" width="220" height="7" rx="2" fill="#475569"/>

  <!-- Main Monitoring Computer / Dashboard Setup -->
  <g id="main-monitor">
    <!-- Stand -->
    <path d="M110 155 L130 155 L135 190 L105 190 Z" fill="#475569"/>
    <ellipse cx="120" cy="190" rx="25" ry="4" fill="#64748b"/>
    
    <!-- Monitor Outer Frame -->
    <rect x="70" y="40" width="100" height="118" rx="8" fill="#334155" stroke="#64748b" stroke-width="2"/>
    
    <!-- Screen Area -->
    <rect x="75" y="45" width="90" height="95" rx="4" fill="#090d16"/>
    <rect x="75" y="45" width="90" height="95" rx="4" fill="url(#screenGrad)"/>

    <!-- UI Graphs & Data Visualizing "Monitoring" (Monitoring Air Quality metrics) -->
    <!-- Line chart showing fluctuations -->
    <path d="M85 95 L95 85 L105 90 L115 75 L125 80 L135 70 L145 78 L155 68" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="155" cy="68" r="3" fill="#38bdf8"/>
    
    <!-- Bar charts -->
    <rect x="85" y="105" width="8" height="20" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="97" y="100" width="8" height="25" rx="1" fill="#10b981" opacity="0.8"/>
    <rect x="109" y="110" width="8" height="15" rx="1" fill="#f59e0b" opacity="0.8"/>
    <rect x="121" y="98" width="8" height="27" rx="1" fill="#10b981" opacity="0.8"/>

    <!-- Circular gauge/radar -->
    <circle cx="145" cy="98" r="12" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M145 86 A12 12 0 0 1 157 98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="145" cy="98" r="2" fill="#f59e0b"/>
  </g>

  <!-- Secondary Prop: Coffee Mug on Desk -->
  <rect x="190" y="170" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M206 175 Q212 175 212 180 Q212 185 206 185" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <!-- Steam from coffee -->
  <path d="M195 162 Q198 157 195 152" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Expressive Character (Environmental Officer / Scientist sitting at desk) -->
  <g id="character">
    <!-- Character Body / Lab Coat / Shirt -->
    <path d="M100 220 L100 185 Q100 170 120 170 Q140 170 140 185 L140 220 Z" fill="#e2e8f0"/>
    <!-- Shirt collar/tie accents -->
    <path d="M115 170 L120 180 L125 170" fill="#38bdf8"/>
    <path d="M112 170 L120 195 L128 170 Z" fill="#0284c7"/>

    <!-- Character Neck & Head -->
    <rect x="113" y="155" width="14" height="20" fill="#fcd34d"/>
    <circle cx="120" cy="140" r="18" fill="#fcd34d"/>

    <!-- Hair -->
    <path d="M102 138 Q103 122 120 122 Q137 122 138 138 Q135 130 120 128 Q105 130 102 138 Z" fill="#334155"/>

    <!-- Face details (Focused expression looking at monitor) -->
    <circle cx="113" cy="138" r="1.5" fill="#1e293b"/>
    <circle cx="127" cy="138" r="1.5" fill="#1e293b"/>
    <!-- Gentle focused smile -->
    <path d="M118 147 Q120 149 122 147" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Glasses for professional scientific look -->
    <rect x="109" y="133" width="8" height="6" rx="1" fill="none" stroke="#475569" stroke-width="1.5"/>
    <rect x="123" y="133" width="8" height="6" rx="1" fill="none" stroke="#475569" stroke-width="1.5"/>
    <line x1="117" y1="136" x2="123" y2="136" stroke="#475569" stroke-width="1.5"/>

    <!-- Arms interacting / typing -->
    <path d="M100 190 Q90 180 85 170" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    <path d="M140 190 Q150 180 155 170" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Foreground decorative elements: Indoor plant adding to "Environment" theme -->
  <g id="indoor-plant">
    <path d="M25 180 Q20 195 25 210 L35 210 Q40 195 35 180 Z" fill="#64748b"/>
    <!-- Plant leaves -->
    <path d="M30 180 Q15 170 10 155 Q25 160 30 180 Z" fill="#10b981"/>
    <path d="M30 180 Q45 165 50 150 Q35 165 30 180 Z" fill="#059669"/>
    <path d="M30 180 Q30 160 30 145 Q30 160 30 180 Z" fill="#34d399"/>
  </g>

  <!-- Subtle light accent casting on scene -->
  <path d="M0 0 L240 0 L240 20 L0 100 Z" fill="#ffffff" opacity="0.03"/>
</svg>