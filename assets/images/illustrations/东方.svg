<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background Glow for East / Sunrise -->
  <circle cx="120" cy="180" r="90" fill="#2D323E" opacity="0.4"/>
  
  <!-- Horizon Line representing earth/landscape -->
  <path d="M 30,170 Q 120,165 210,170" fill="none" stroke="#3A4150" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Stylized Modern Silhouette Landscape (East/Location context) -->
  <!-- Hills / Mountains -->
  <path d="M 30,170 L 65,130 L 105,170 Z" fill="#252A35"/>
  <path d="M 85,170 L 135,100 L 195,170 Z" fill="#20242E"/>
  <path d="M 160,170 L 185,140 L 215,170 Z" fill="#282E3B"/>

  <!-- Radiant Rising Sun (Physical Object/Place representation of 东方) -->
  <circle cx="120" cy="130" r="28" fill="#FFB74D"/>
  
  <!-- Sun Rays / Sunrise vector accents -->
  <line x1="120" y1="88" x2="120" y2="76" stroke="#FFB74D" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="81" y2="91" stroke="#FFB74D" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="100" x2="159" y2="91" stroke="#FFB74D" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="130" x2="64" y2="130" stroke="#FFB74D" stroke-width="3" stroke-linecap="round"/>
  <line x1="164" y1="130" x2="176" y2="130" stroke="#FFB74D" stroke-width="3" stroke-linecap="round"/>

  <!-- Compass Needle indicating East (Primary iconic object anchor) -->
  <!-- Outer Compass Ring -->
  <circle cx="120" cy="130" r="74" fill="none" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Small directional marker at the bottom center to ground the illustration -->
  <circle cx="120" cy="195" r="4" fill="#FFB74D"/>
</svg>