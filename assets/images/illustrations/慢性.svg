<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character (The man) -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M20 120 L80 120 L75 70 L25 70 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="50" r="25" fill="#fde68a"/>
    <!-- Expression of discomfort -->
    <path d="M40 50 Q45 45 50 50" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M60 50 Q65 45 70 50" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M45 65 Q50 60 55 65" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Hand holding stomach -->
    <ellipse cx="50" cy="90" rx="15" ry="10" fill="#fb923c"/>
  </g>
  
  <!-- Props: Medicine bottle and glass -->
  <g transform="translate(160, 130)">
    <rect x="0" y="0" width="20" height="30" rx="2" fill="#ec4899"/>
    <circle cx="10" cy="5" r="3" fill="#f8fafc"/>
  </g>
  <g transform="translate(190, 135)">
    <path d="M0 0 L20 0 L18 25 L2 25 Z" fill="#38bdf8" fill-opacity="0.6"/>
    <path d="M2 5 L18 5" stroke="#f8fafc" stroke-width="2"/>
  </g>
  
  <!-- Background details: Calendar/Chart indicating long-term/chronic -->
  <g transform="translate(30, 30)">
    <rect width="50" height="40" rx="4" fill="#475569"/>
    <path d="M5 10 L45 10 M5 20 L45 20 M5 30 L45 30" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="15" cy="15" r="3" fill="#fbbf24"/>
    <circle cx="35" cy="25" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Lamp -->
  <path d="M180 30 L200 30 L195 60 L185 60 Z" fill="#fbbf24"/>
  <path d="M190 60 L190 100" stroke="#94a3b8" stroke-width="4"/>
</svg>