<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to highlight the central subject -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Conceptual illustration for "孙女" (granddaughter) -->
  <!-- Represented as a warm, smiling young girl (granddaughter) in modern flat vector style -->
  <g transform="translate(0, 10)">
    <!-- Body / Torso -->
    <path d="M 85 165 C 85 145, 100 135, 120 135 C 140 135, 155 145, 155 165 L 165 190 C 165 195, 160 200, 155 200 L 85 200 C 80 200, 75 195, 75 190 Z" fill="#3B82F6"/>
    <!-- Collar -->
    <path d="M 105 135 L 120 150 L 135 135 Z" fill="#E2E8F0"/>

    <!-- Neck -->
    <rect x="111" y="118" width="18" height="22" rx="6" fill="#FDE68A"/>

    <!-- Head / Face -->
    <circle cx="120" cy="95" r="32" fill="#FDE68A"/>

    <!-- Hair (Back/Base) -->
    <path d="M 88 95 C 88 72, 100 62, 120 62 C 140 62, 152 72, 152 95 L 152 110 C 152 115, 148 118, 143 118 L 97 118 C 92 118, 88 115, 88 110 Z" fill="#332922"/>
    
    <!-- Hair Bangs & Pigtails (Cute granddaughter styling) -->
    <path d="M 90 90 C 95 72, 110 65, 120 65 C 130 65, 145 72, 150 90 C 140 78, 100 78, 90 90 Z" fill="#332922"/>
    
    <!-- Left Pigtail -->
    <path d="M 88 85 C 75 80, 68 90, 72 102 C 76 108, 85 105, 88 95 Z" fill="#332922"/>
    <circle cx="70" cy="98" r="7" fill="#F43F5E"/>
    
    <!-- Right Pigtail -->
    <path d="M 152 85 C 165 80, 172 90, 168 102 C 164 108, 155 105, 152 95 Z" fill="#332922"/>
    <circle cx="170" cy="98" r="7" fill="#F43F5E"/>

    <!-- Facial Features -->
    <!-- Eyes (Happy closed arcs) -->
    <path d="M 106 92 C 108 96, 112 96, 114 92" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 126 92 C 128 96, 132 96, 134 92" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Rosy Cheeks -->
    <circle cx="103" cy="99" r="5" fill="#F43F5E" opacity="0.4"/>
    <circle cx="137" cy="99" r="5" fill="#F43F5E" opacity="0.4"/>

    <!-- Smile -->
    <path d="M 113 103 C 116 107, 124 107, 127 103" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Accent Focus Glow (Gold/Orange matching app theme) -->
  <circle cx="120" cy="120" r="92" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="8 6"/>
</svg>