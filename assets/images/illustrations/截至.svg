<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative calendar grid pattern (subtle) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 4">
    <line x1="48" y1="48" x2="192" y2="48" />
    <line x1="48" y1="96" x2="192" y2="96" />
    <line x1="48" y1="144" x2="192" y2="144" />
    <line x1="48" y1="192" x2="192" y2="192" />
    <line x1="48" y1="48" x2="48" y2="192" />
    <line x1="96" y1="48" x2="96" y2="192" />
    <line x1="144" y1="48" x2="144" y2="192" />
    <line x1="192" y1="48" x2="192" y2="192" />
  </g>

  <!-- Central Physical Object: A sleek, modern desk calendar / deadline marker -->
  <!-- Calendar Base / Stand -->
  <path d="M70 170 L170 170 L185 195 L55 195 Z" fill="#2E3440" />
  <path d="M55 195 L185 195 L190 202 L50 202 Z" fill="#4C566A" rx="2" />

  <!-- Calendar Ring Bindings -->
  <rect x="85" y="48" width="10" height="18" rx="5" fill="#E5C07B" />
  <rect x="145" y="48" width="10" height="18" rx="5" fill="#E5C07B" />

  <!-- Calendar Back Page (Shadow effect) -->
  <rect x="65" y="58" width="110" height="118" rx="8" fill="#3B4252" />

  <!-- Calendar Main Page -->
  <rect x="60" y="54" width="120" height="120" rx="8" fill="#2E3440" />

  <!-- Calendar Header Banner -->
  <path d="M 68 54 L 172 54 A 8 8 0 0 1 180 62 L 180 84 L 60 84 L 60 62 A 8 8 0 0 1 68 54 Z" fill="#E06C75" />
  
  <!-- Calendar Grid Lines / Days representation -->
  <g fill="#4B5263">
    <rect x="76" y="98" width="16" height="12" rx="2" />
    <rect x="98" y="98" width="16" height="12" rx="2" />
    <rect x="120" y="98" width="16" height="12" rx="2" />
    <rect x="142" y="98" width="16" height="12" rx="2" />

    <rect x="76" y="116" width="16" height="12" rx="2" />
    <rect x="98" y="116" width="16" height="12" rx="2" />
    <rect x="120" y="116" width="16" height="12" rx="2" fill="#E5C07B" opacity="0.3" />
    <rect x="142" y="116" width="16" height="12" rx="2" fill="#E06C75" opacity="0.4" />

    <rect x="76" y="134" width="16" height="12" rx="2" />
    <rect x="98" y="134" width="16" height="12" rx="2" />
    <rect x="120" y="134" width="16" height="12" rx="2" />
    <rect x="142" y="134" width="16" height="12" rx="2" />
  </g>

  <!-- The Exact Cut-off Point (Deadline Marker / Red Pin / Stop Indicator) -->
  <!-- Drop shadow for the marker -->
  <circle cx="150" cy="122" r="14" fill="#000000" opacity="0.3" />
  
  <!-- Main Marker Pin -->
  <circle cx="150" cy="120" r="14" fill="#E5C07B" />
  <circle cx="150" cy="120" r="8" fill="#D19A66" />
  
  <!-- Clear "Cut-off / Stop" boundary indicator line across the calendar -->
  <line x1="50" y1="120" x2="88" y2="120" stroke="#E5C07B" stroke-width="4" stroke-linecap="round" />
  <path d="M 172 120 L 195 120" stroke="#E5C07B" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 3" />

  <!-- Bold Stop Arrow Head indicating limit/cutoff -->
  <polygon points="192,112 204,120 192,128" fill="#E5C07B" />

</svg>