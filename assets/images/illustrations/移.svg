<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Table -->
  <g id="table">
    <rect x="70" y="130" width="100" height="10" rx="2" fill="#fb923c"/>
    <rect x="80" y="140" width="10" height="50" fill="#fb923c"/>
    <rect x="150" y="140" width="10" height="50" fill="#fb923c"/>
  </g>

  <!-- Character 1 (Pushing) -->
  <g id="char1">
    <circle cx="50" cy="120" r="12" fill="#f59e0b"/>
    <path d="M45 135 L40 170 M55 135 L60 170" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <rect x="42" y="132" width="16" height="30" rx="4" fill="#f59e0b"/>
    <path d="M58 140 L70 145" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Helping) -->
  <g id="char2">
    <circle cx="190" cy="120" r="12" fill="#38bdf8"/>
    <path d="M185 135 L180 170 M195 135 L200 170" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="182" y="132" width="16" height="30" rx="4" fill="#38bdf8"/>
    <path d="M182 140 L170 145" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Motion Indicators -->
  <path d="M175 120 L190 120 M185 115 L190 120 L185 125" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M175 110 L185 110 M180 105 L185 110 L180 115" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Room Details -->
  <rect x="20" y="50" width="40" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="120" cy="60" r="20" fill="#1e293b" opacity="0.6"/>
  <rect x="100" y="85" width="40" height="5" rx="2" fill="#334155"/>
</svg>