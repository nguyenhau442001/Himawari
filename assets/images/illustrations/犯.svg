<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Contextual Elements (Slate background tones) -->
  <circle cx="120" cy="120" r="80" fill="#222630" />
  <circle cx="120" cy="120" r="60" fill="#2A2F3D" />

  <!-- Physical Object representing "犯" in the context of committing a mistake/error (a glowing misstep/document with a marked error) -->
  <g transform="translate(0, 5)">
    <!-- Document background -->
    <rect x="75" y="55" width="90" height="115" rx="8" fill="#323846" stroke="#40475B" stroke-width="2"/>
    
    <!-- Document lines -->
    <rect x="92" y="75" width="56" height="6" rx="3" fill="#525B70"/>
    <rect x="92" y="93" width="40" height="6" rx="3" fill="#525B70"/>
    <rect x="92" y="111" width="48" height="6" rx="3" fill="#525B70"/>

    <!-- Error mark (Red cross/stamp representing committing/犯 an error) -->
    <circle cx="120" cy="140" r="18" fill="#FF4D4D" opacity="0.2"/>
    <path d="M 112 132 L 128 148 M 128 132 L 112 148" stroke="#FF4D4D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Focal Accent (Gold/Orange highlight representing the critical point of the error) -->
  <circle cx="120" cy="140" r="26" fill="none" stroke="#F5A623" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
  <circle cx="120" cy="55" r="4" fill="#F5A623"/>
</svg>