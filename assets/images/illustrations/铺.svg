<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm bedside light beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bed sheet gradient (vibrant teal/mint new sheet) -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Blanket/Quilt folded gradient -->
    <linearGradient id="quiltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Room Elements (Wall & Window) -->
  <g id="room-context">
    <!-- Window Frame -->
    <rect x="15" y="25" width="45" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="20" y="30" width="35" height="50" rx="3" fill="#0284c7" opacity="0.2" />
    <line x1="37.5" y1="30" x2="37.5" y2="80" stroke="#475569" stroke-width="2" />
    <line x1="20" y1="55" x2="55" y2="55" stroke="#475569" stroke-width="2" />
    <!-- Moonlight/Warm light from window -->
    <path d="M 20 30 L 70 120 L 15 120 Z" fill="url(#lightBeam)" />

    <!-- Wall Art / Deco Circle -->
    <circle cx="195" cy="45" r="18" fill="#334155" opacity="0.6" />
    <circle cx="195" cy="45" r="12" fill="#1e293b" />
    <path d="M 190 45 L 200 40 L 198 50 Z" fill="#fbbf24" opacity="0.8" />

    <!-- Nightstand & Lamp -->
    <rect x="190" y="115" width="35" height="50" rx="4" fill="#475569" />
    <path d="M 195 115 L 220 115 L 215 105 L 200 105 Z" fill="#94a3b8" />
    <path d="M 207 90 L 200 105 H 220 L 213 90 Z" fill="#fbbf24" filter="url(#softShadow)" />
    <circle cx="210" cy="85" r="6" fill="#f59e0b" />
  </g>

  <!-- Bed Structure (Wood/Modern Frame) -->
  <g id="bed-structure" filter="url(#softShadow)">
    <!-- Headboard -->
    <rect x="25" y="90" width="145" height="55" rx="8" fill="#334155" />
    <rect x="30" y="95" width="135" height="45" rx="4" fill="#1e293b" opacity="0.5" />

    <!-- Bed Base / Mattress Platform -->
    <rect x="20" y="130" width="170" height="75" rx="6" fill="#475569" />
    <!-- Mattress -->
    <rect x="22" y="133" width="166" height="65" rx="5" fill="#f1f5f9" />
  </g>

  <!-- THE MAIN ACTION: Spreading the New Bed Sheet ("铺一条新床单") -->
  <g id="bed-sheet-action" filter="url(#softShadow)">
    <!-- Folded down blanket at bottom/side -->
    <path d="M 22 175 C 50 165, 80 185, 110 170 C 130 160, 160 175, 188 165 L 188 195 C 150 205, 90 190, 22 198 Z" fill="url(#quiltGrad)" />
    
    <!-- The NEW Crisp Sheet being actively spread/pulled across the bed -->
    <!-- Wavy dynamic path showing motion and placement -->
    <path d="M 30 140 
             Q 70 132, 110 148 
             T 185 138 
             L 185 185 
             Q 140 195, 95 180 
             T 30 188 Z" 
          fill="url(#sheetGrad)" />

    <!-- Sheet creases / folds texture -->
    <path d="M 60 142 Q 75 165, 65 180" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 110 145 Q 125 160, 115 182" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 150 140 Q 160 155, 155 175" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- Pillows -->
  <g id="pillows" filter="url(#softShadow)">
    <!-- Pillow 1 -->
    <rect x="35" y="102" width="45" height="28" rx="8" fill="#ffffff" />
    <rect x="38" y="105" width="39" height="22" rx="6" fill="#e2e8f0" opacity="0.5" />
    <!-- Pillow 2 -->
    <rect x="85" y="102" width="45" height="28" rx="8" fill="#ffffff" />
    <rect x="88" y="105" width="39" height="22" rx="6" fill="#e2e8f0" opacity="0.5" />
  </g>

  <!-- CHARACTER: Woman actively spreading the bed sheet -->
  <g id="character-woman" filter="url(#softShadow)">
    <!-- Body / Torso (leaning forward dynamically) -->
    <path d="M 125 125 C 115 110, 110 95, 125 80 C 135 70, 150 75, 155 85 C 160 95, 155 115, 145 130 Z" fill="#ec4899" />
    
    <!-- Head & Hair -->
    <!-- Hair back -->
    <circle cx="138" cy="62" r="14" fill="#0f172a" />
    <!-- Face profile/skin -->
    <circle cx="143" cy="64" r="11" fill="#ffedd5" />
    <!-- Hair bun / ponytail -->
    <circle cx="148" cy="52" r="7" fill="#0f172a" />
    <!-- Facial expression: focused & smiling gently -->
    <path d="M 148 65 Q 151 68, 153 65" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="147" cy="61" r="1.5" fill="#0f172a" />

    <!-- Left Arm (Reaching down to smooth the sheet) -->
    <path d="M 130 95 Q 110 115, 95 135" stroke="#ffedd5" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Hand smoothing -->
    <circle cx="93" cy="138" r="4" fill="#ffedd5" />

    <!-- Right Arm (Pulling back / adjusting) -->
    <path d="M 145 90 Q 160 100, 165 115" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="167" cy="118" r="3.5" fill="#ffedd5" />

    <!-- Legs (Kneeling/positioned on the edge of bed) -->
    <path d="M 140 130 Q 155 140, 170 135" stroke="#334155" stroke-width="9" stroke-linecap="round" fill="none" />
  </g>

  <!-- Foreground Atmospheric Elements (Cosy lighting & sparkles) -->
  <g id="sparkles">
    <circle cx="65" cy="125" r="2" fill="#bae6fd" opacity="0.8" />
    <circle cx="120" cy="130" r="1.5" fill="#bae6fd" opacity="0.9" />
    <circle cx="165" cy="135" r="2" fill="#bae6fd" opacity="0.7" />
    <!-- Soft highlight accent -->
    <path d="M 40 145 Q 50 140, 60 145" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>