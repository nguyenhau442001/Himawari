<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window Frame representing the 'limit' -->
  <rect x="60" y="50" width="120" height="120" rx="8" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Character looking through the small frame -->
  <g transform="translate(120, 110)">
    <circle cx="0" cy="0" r="25" fill="#f59e0b"/>
    <path d="M-10 -5 Q 0 -15 10 -5" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="-8" cy="-5" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-5" r="3" fill="#0f172a"/>
    <path d="M-15 15 L 15 15" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- The 'Limited' view inside the frame -->
  <circle cx="120" cy="110" r="30" fill="#1e293b" opacity="0.5"/>
  <path d="M105 100 L 135 100 L 120 125 Z" fill="#fb923c"/>
  
  <!-- The 'Expanded' view outside the frame -->
  <g fill="#38bdf8">
    <circle cx="30" cy="40" r="8"/>
    <circle cx="210" cy="180" r="12"/>
    <path d="M180 40 L 200 30 L 220 50 Z"/>
    <path d="M30 190 L 50 180 L 40 210 Z"/>
  </g>
  
  <!-- Hand pointing outward/encouraging -->
  <g transform="translate(160, 160)">
    <path d="M0 0 L 20 -20 L 30 -15 L 10 10 Z" fill="#fbbf24"/>
    <circle cx="25" cy="-17" r="5" fill="#fbbf24"/>
  </g>
  
  <!-- Decorative elements for depth -->
  <path d="M20 220 Q 120 200 220 220" stroke="#334155" stroke-width="2" fill="none"/>
</svg>