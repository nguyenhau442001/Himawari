<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Starry night background hints -->
  <circle cx="50" cy="50" r="1" fill="#4A5568" opacity="0.6"/>
  <circle cx="190" cy="60" r="1.5" fill="#CBD5E0" opacity="0.8"/>
  <circle cx="210" cy="140" r="1" fill="#4A5568" opacity="0.4"/>
  <circle cx="40" cy="160" r="1.5" fill="#CBD5E0" opacity="0.5"/>
  <circle cx="100" cy="40" r="1" fill="#CBD5E0" opacity="0.7"/>

  <!-- Crescent Moon -->
  <path d="M 180 75 A 25 25 0 0 1 160 110 A 30 30 0 0 0 180 75 Z" fill="#F6E05E" opacity="0.9"/>

  <!-- Cityscape silhouette in background (representing "整座城市") -->
  <g fill="#2D3748" opacity="0.6">
    <rect x="20" y="150" width="25" height="50"/>
    <rect x="45" y="130" width="30" height="70"/>
    <rect x="75" y="160" width="20" height="40"/>
    <rect x="145" y="140" width="35" height="60"/>
    <rect x="180" y="155" width="25" height="45"/>
    <rect x="205" y="135" width="20" height="65"/>
  </g>

  <!-- Central Character sleeping peacefully in bed (representing "沉睡") -->
  <!-- Bed frame -->
  <rect x="60" y="165" width="120" height="20" rx="4" fill="#4A5568"/>
  <rect x="65" y="185" width="15" height="15" fill="#2D3748"/>
  <rect x="160" y="185" width="15" height="15" fill="#2D3748"/>
  
  <!-- Pillow -->
  <rect x="75" y="130" width="35" height="25" rx="8" fill="#E2E8F0"/>

  <!-- Mattress & Blanket -->
  <path d="M 70 145 L 180 145 L 180 175 L 70 175 Z" fill="#3182CE"/>
  <path d="M 90 140 Q 135 150 175 145 L 175 175 L 90 175 Z" fill="#4299E1"/>

  <!-- Character Head & Hair -->
  <circle cx="95" cy="140" r="14" fill="#F6AD55"/>
  <path d="M 81 140 C 81 130 90 126 100 128 C 108 130 110 138 109 143 Z" fill="#2D3748"/>

  <!-- Closed Eye (Peaceful sleep curve) -->
  <path d="M 92 139 Q 95 142 98 139" stroke="#2D3748" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Zzz Sleeping Symbols (Accent Color: Gold/Orange for focus) -->
  <g fill="none" stroke="#ED8936" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <!-- Small Z -->
    <path d="M 125 110 L 135 110 L 125 122 L 135 122"/>
    <!-- Medium Z -->
    <path d="M 138 90 L 153 90 L 138 108 L 153 108" transform="scale(0.8) translate(40, 20)"/>
    <!-- Large Z -->
    <path d="M 155 65 L 175 65 L 155 88 L 175 88" transform="scale(0.7) translate(80, 10)"/>
  </g>

</svg>