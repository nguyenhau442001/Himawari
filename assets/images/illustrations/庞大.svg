<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- UI/Hologram Gradients -->
    <linearGradient id="holoBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Engineering Office / Control Center) -->
  <g id="environment">
    <!-- Window showing night city skyline -->
    <path d="M 30 35 L 120 35 L 120 120 L 30 120 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- City buildings in background -->
    <rect x="40" y="60" width="12" height="60" fill="#131c2e"/>
    <rect x="55" y="50" width="18" height="70" fill="#162238"/>
    <rect x="76" y="75" width="15" height="45" fill="#131c2e"/>
    <rect x="95" y="45" width="16" height="75" fill="#1b2a4a"/>
    <!-- Building lights -->
    <rect x="43" y="65" width="2" height="3" fill="#fbbf24" opacity="0.6"/>
    <rect x="60" y="60" width="3" height="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="60" y="70" width="3" height="2" fill="#fbbf24" opacity="0.8"/>
    <rect x="100" y="55" width="2" height="4" fill="#fbbf24" opacity="0.7"/>
    <rect x="105" y="70" width="2" height="2" fill="#38bdf8" opacity="0.9"/>

    <!-- Ambient Office Lights & Shelves -->
    <rect x="140" y="40" width="70" height="4" fill="#334155" rx="2"/>
    <path d="M 150 44 L 150 70 M 200 44 L 200 75" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Holographic Projector & Huge Engineering Model (The "庞大" Project) -->
  <g id="hologram_projector">
    <!-- Projector Base on Desk -->
    <path d="M 120 185 L 190 185 L 180 175 L 130 175 Z" fill="#475569"/>
    <ellipse cx="155" cy="175" rx="25" ry="5" fill="#64748b"/>
    <ellipse cx="155" cy="175" rx="15" ry="3" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Holographic Cone Beam -->
    <polygon points="155,175 110,95 200,95" fill="url(#holoBlue)"/>
    <line x1="155" y1="175" x2="110" y2="95" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <line x1="155" y1="175" x2="200" y2="95" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

    <!-- Huge Complex Engineering Structure (Mega Bridge / Mega Complex) -->
    <g id="mega_structure" transform="translate(115, 80)">
      <!-- Base platform -->
      <path d="M 10 90 L 70 90 L 80 100 L 0 100 Z" fill="#1e3a8a" opacity="0.7"/>
      
      <!-- Tower 1 (Suspension Bridge Pylon) -->
      <rect x="15" y="30" width="6" height="60" fill="#38bdf8" opacity="0.8"/>
      <rect x="27" y="30" width="6" height="60" fill="#38bdf8" opacity="0.8"/>
      <rect x="12" y="30" width="24" height="4" fill="#7dd3fc"/>
      <rect x="12" y="55" width="24" height="3" fill="#7dd3fc"/>
      
      <!-- Tower 2 -->
      <rect x="53" y="20" width="6" height="70" fill="#38bdf8" opacity="0.8"/>
      <rect x="65" y="20" width="6" height="70" fill="#38bdf8" opacity="0.8"/>
      <rect x="50" y="20" width="24" height="4" fill="#7dd3fc"/>
      <rect x="50" y="45" width="24" height="3" fill="#7dd3fc"/>
      <rect x="50" y="70" width="24" height="3" fill="#7dd3fc"/>

      <!-- Suspension Cables -->
      <path d="M 5 75 Q 36 40 60 75" fill="none" stroke="#7dd3fc" stroke-width="1.5" filter="url(#glow)"/>
      <path d="M 20 40 Q 50 20 75 80" fill="none" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>

      <!-- Deck / Roadway -->
      <path d="M 0 78 L 80 78 L 80 82 L 0 82 Z" fill="#38bdf8" opacity="0.9"/>

      <!-- Complex Buildings / Mega Structures in background of hologram -->
      <path d="M 35 40 L 45 40 L 45 90 L 35 90 Z" fill="#0284c7" opacity="0.4"/>
      <circle cx="56" cy="15" r="4" fill="#fb923c" filter="url(#glow)"/>
      <circle cx="18" cy="25" r="3" fill="#10b981" filter="url(#glow)"/>

      <!-- Data nodes / grid lines floating -->
      <circle cx="36" cy="60" r="2" fill="#ffffff"/>
      <line x1="36" y1="60" x2="50" y2="50" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>
  </g>

  <!-- Foreground Desk & Architect / Engineer Character -->
  <g id="workstation_and_character">
    <!-- Main Desk -->
    <rect x="10" y="180" width="130" height="12" fill="#334155" rx="3"/>
    <rect x="25" y="192" width="10" height="30" fill="#1e293b"/>
    <rect x="115" y="192" width="10" height="30" fill="#1e293b"/>

    <!-- Secondary Hologram / Tablet on Desk -->
    <path d="M 35 180 L 75 180 L 70 170 L 40 170 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <line x1="45" y1="175" x2="65" y2="175" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="55" cy="163" r="6" fill="#38bdf8" opacity="0.6" filter="url(#glow)"/>
    <line x1="55" y1="169" x2="55" y2="170" stroke="#38bdf8" stroke-width="2"/>

    <!-- Coffee Mug -->
    <rect x="90" y="168" width="10" height="12" rx="2" fill="#cbd5e1"/>
    <path d="M 100 171 C 104 171 104 177 100 177" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Character: Lead Architect / Engineer -->
    <g id="architect_character">
      <!-- Body / Torso (leaning forward) -->
      <path d="M 75 220 C 75 195 85 185 100 185 C 115 185 125 195 125 220 Z" fill="#0284c7"/>
      <!-- Collar / Shirt -->
      <path d="M 92 185 L 100 195 L 108 185 Z" fill="#f8fafc"/>

      <!-- Head & Hair -->
      <circle cx="100" cy="155" r="15" fill="#fbcfe8"/> <!-- Skin tone -->
      <!-- Hair (Dark modern cut) -->
      <path d="M 85 155 C 85 142 95 138 102 138 C 112 138 116 146 116 155 C 113 151 108 145 100 145 C 92 145 87 150 85 155 Z" fill="#334155"/>

      <!-- Face Profile (Looking intently towards the huge project) -->
      <!-- Glasses -->
      <rect x="94" y="150" width="8" height="5" rx="1" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
      <line x1="102" y1="152" x2="105" y2="152" stroke="#fbbf24" stroke-width="1.5"/>
      
      <!-- Arms & Hands gesturing/working -->
      <!-- Back Arm (resting) -->
      <!-- Front Arm (raised pointing/operating) -->
      <path d="M 115 190 L 125 168 L 132 172" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Hand -->
      <circle cx="134" cy="174" r="3.5" fill="#fbcfe8"/>
    </g>
  </g>

  <!-- Ambient lighting effects & accents -->
  <circle cx="155" cy="95" r="35" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>
  
  <!-- UI floating frame indicators (Abstract technical framing, NO text) -->
  <path d="M 15 25 L 25 25 L 25 15" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 225 25 L 215 25 L 215 15" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 15 215 L 25 215 L 25 225" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 225 215 L 215 215 L 215 225" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>