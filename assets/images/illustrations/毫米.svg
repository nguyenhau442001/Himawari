<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Fabric Gradient (Teal/Cyan) -->
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Magnifier Glass Gradient -->
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)"/>
    </linearGradient>

    <!-- Character Skin & Hair -->
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Background Details: Workshop Wall & Shelf -->
  <path d="M 0 130 L 240 130" stroke="#334155" stroke-width="2" opacity="0.5"/>
  <rect x="25" y="85" width="70" height="8" rx="2" fill="#334155" opacity="0.6"/>
  <!-- Spools of thread on shelf -->
  <rect x="35" y="65" width="12" height="20" rx="2" fill="#ec4899"/>
  <rect x="53" y="60" width="14" height="25" rx="2" fill="#f59e0b"/>
  <rect x="75" y="68" width="10" height="17" rx="2" fill="#38bdf8"/>

  <!-- Warm Desk Lamp Glow -->
  <circle cx="190" cy="50" r="60" fill="#f59e0b" opacity="0.08"/>
  <path d="M 190 20 L 210 60 L 170 60 Z" fill="#475569"/>
  <path d="M 190 60 L 190 140" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Wooden Workbench / Desk Surface -->
  <path d="M 0 140 L 240 140 L 240 240 L 0 240 Z" fill="url(#desk)" filter="url(#shadow)"/>
  <path d="M 0 140 L 240 140" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- THE THICK FABRIC (Focus of "这块布厚两毫米") -->
  <g filter="url(#shadow)">
    <!-- Fabric Side Profile showing thickness (The "2mm" edge) -->
    <path d="M 70 170 L 170 170 L 185 195 L 85 195 Z" fill="#0f766e"/>
    <!-- The thick cross-section edge (front facing) -->
    <path d="M 70 170 L 85 195 L 85 203 L 70 178 Z" fill="#115e59"/>
    <path d="M 85 195 L 185 195 L 185 203 L 85 203 Z" fill="#0f766e"/>
    <!-- Top flat surface of the fabric -->
    <path d="M 70 170 L 170 170 L 185 195 L 85 195 Z" fill="url(#fabric)"/>
    <!-- Fabric texture stitching/lines -->
    <path d="M 80 177 L 160 177 M 90 185 L 170 185" stroke="#99f6e4" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  </g>

  <!-- Precision Caliper / Ruler Tool measuring the fabric thickness -->
  <g transform="translate(115, 120)" filter="url(#shadow)">
    <!-- Caliper Vertical Beam -->
    <rect x="0" y="10" width="6" height="75" rx="1" fill="#94a3b8"/>
    <rect x="2" y="15" width="2" height="65" fill="#475569"/>
    
    <!-- Metric Scale Ticks -->
    <line x1="0" y1="20" x2="3" y2="20" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="25" x2="4" y2="25" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="3" y2="30" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="35" x2="4" y2="35" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Caliper Fixed Jaw -->
    <path d="M -15 10 L 6 10 L 6 22 L -15 22 Z" fill="#64748b"/>
    <!-- Caliper Sliding Jaw (clamped perfectly to the 2mm fabric edge) -->
    <path d="M -15 58 L 6 58 L 6 70 L -15 70 Z" fill="#64748b"/>
    
    <!-- Measurement Dial -->
    <circle cx="3" cy="40" r="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <circle cx="3" cy="40" r="2" fill="#ef4444"/>
    <line x1="3" y1="40" x2="8" y2="37" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Character Tailor / Inspector (Leaning in closely to inspect) -->
  <g transform="translate(25, 45)">
    <!-- Body / Torso (Blue shirt/apron) -->
    <path d="M 25 110 C 25 90, 55 90, 55 110 L 65 150 L 15 150 Z" fill="#2563eb" filter="url(#shadow)"/>
    <path d="M 30 110 L 40 150 L 50 150 L 40 110 Z" fill="#1d4ed8" opacity="0.4"/> <!-- Apron strap/shadow -->

    <!-- Neck -->
    <rect x="33" y="80" width="10" height="15" fill="url(#skin)"/>

    <!-- Head -->
    <circle cx="38" cy="65" r="18" fill="url(#skin)" filter="url(#shadow)"/>
    
    <!-- Hair (Stylish dark slate) -->
    <path d="M 20 65 C 20 48, 56 48, 56 65 C 56 70, 50 62, 45 58 C 40 54, 30 54, 25 58 C 21 62, 20 65, 20 65 Z" fill="#334155"/>

    <!-- Focused Eye & Expression -->
    <circle cx="45" cy="65" r="2" fill="#0f172a"/>
    <path d="M 42 61 Q 46 59 49 61" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- Eyebrow lowered in concentration -->

    <!-- Arm reaching forward to hold caliper -->
    <path d="M 45 105 Q 75 115 95 125" stroke="#fdba74" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
    <circle cx="97" cy="126" r="5" fill="url(#skin)"/> <!-- Hand -->
  </g>

  <!-- Magnifying Glass hovering near the measurement point to emphasize precision -->
  <g transform="translate(135, 95)" filter="url(#shadow)">
    <!-- Glass Area -->
    <circle cx="0" cy="0" r="24" fill="url(#lens)" stroke="#38bdf8" stroke-width="3"/>
    <!-- Glass Highlight Reflection -->
    <path d="M -14 -10 C -5 -18, 5 -18, 12 -12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Handle -->
    <path d="M 17 17 L 35 35" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M 17 17 L 35 35" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Focus Highlights indicating exact fine measurement -->
  <g transform="translate(110, 150)" fill="#fbbf24">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z"/>
  </g>
  <g transform="translate(155, 185)" fill="#38bdf8" opacity="0.8">
    <path d="M 0 0 L 1.5 3.5 L 5 5 L 1.5 6.5 L 0 10 L -1.5 6.5 L -5 5 L -1.5 3.5 Z"/>
  </g>
</svg>