<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road Surface -->
  <path d="M0 160 L240 160 L220 240 L20 240 Z" fill="#2D343E"/>
  <path d="M80 180 L160 180 L150 240 L90 240 Z" fill="#3A4452"/>
  
  <!-- Buildings (Left) -->
  <rect x="20" y="60" width="50" height="100" rx="4" fill="#FFB84D"/>
  <rect x="30" y="80" width="10" height="20" fill="#1A1D24"/>
  <rect x="50" y="80" width="10" height="20" fill="#1A1D24"/>
  <rect x="30" y="120" width="30" height="40" fill="#1A1D24"/>
  
  <!-- Buildings (Right) -->
  <rect x="170" y="40" width="50" height="120" rx="4" fill="#FFB84D"/>
  <rect x="180" y="60" width="10" height="20" fill="#1A1D24"/>
  <rect x="200" y="60" width="10" height="20" fill="#1A1D24"/>
  <rect x="180" y="100" width="30" height="60" fill="#1A1D24"/>
  
  <!-- Street Details -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#FFB84D" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Street Lamp -->
  <path d="M190 160 L190 80" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="190" cy="75" r="8" fill="#FFB84D"/>
  
  <!-- Tree -->
  <rect x="40" y="140" width="6" height="20" fill="#5D6D7E"/>
  <circle cx="43" cy="130" r="12" fill="#4ADE80"/>
</svg>