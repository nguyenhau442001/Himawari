<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Market Stall Counter -->
  <path d="M20 160h200v40c0 11-9 20-20 20H40c-11 0-20-9-20-20z" fill="#334155"/>
  <path d="M30 160h180v15H30z" fill="#475569"/>
  
  <!-- Character: Vendor -->
  <circle cx="180" cy="130" r="25" fill="#fbbf24"/>
  <path d="M165 150h30v40h-30z" fill="#fb923c"/>
  
  <!-- Character: Customer -->
  <circle cx="60" cy="130" r="25" fill="#38bdf8"/>
  <path d="M45 150h30v40h-30z" fill="#10b981"/>
  
  <!-- Currency Flow Action -->
  <g fill="#f59e0b">
    <circle cx="120" cy="120" r="8"/>
    <circle cx="100" cy="100" r="6"/>
    <circle cx="140" cy="100" r="6"/>
    <circle cx="120" cy="80" r="5"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M90 120 Q 120 100 150 120" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M80 110 Q 120 90 160 110" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Market Goods -->
  <rect x="170" y="165" width="15" height="15" rx="2" fill="#ec4899"/>
  <rect x="190" y="165" width="15" height="15" rx="2" fill="#818cf8"/>
  
  <!-- Background Elements -->
  <path d="M20 200h200" stroke="#475569" stroke-width="2"/>
  <circle cx="210" cy="40" r="20" fill="#fbbf24" opacity="0.2"/>
</svg>