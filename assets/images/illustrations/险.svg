<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient / Depth -->
  <path d="M 0 160 L 80 180 L 160 140 L 240 190 L 240 240 L 0 240 Z" fill="#222733" opacity="0.5"/>

  <!-- Dramatic Chasm / Abyss (Visualizing "险" - dangerous, perilous terrain) -->
  <path d="M 90 220 L 115 110 L 125 110 L 150 220 Z" fill="#111318"/>
  <path d="M 97 220 L 117 125 L 123 125 L 143 220 Z" fill="#0A0B0E"/>

  <!-- Jagged Mountain Cliffs -->
  <path d="M 0 220 L 0 140 L 45 160 L 90 110 L 115 110 L 90 220 Z" fill="#282E3D"/>
  <path d="M 150 220 L 125 110 L 150 90 L 195 130 L 240 100 L 240 220 Z" fill="#2E3546"/>

  <!-- Treacherous, winding mountain path (盘山小道) with high-contrast accent color -->
  <path d="M 15 155 C 35 155, 60 165, 75 145 C 90 125, 100 120, 110 115" stroke="#3A445C" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 130 115 C 140 120, 155 135, 175 125 C 195 115, 215 110, 230 108" stroke="#3A445C" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- The Danger Edge: Glowing warning highlight on the cliff edge -->
  <path d="M 115 110 L 125 110" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
  <path d="M 90 110 L 115 110" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 125 110 L 150 90" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Scale Exaggeration: Tiny lone traveler emphasizing the immense peril/height (险) -->
  <g transform="translate(103, 103)">
    <!-- Traveler body -->
    <circle cx="4" cy="3" r="2.5" fill="#FF9F43"/>
    <path d="M 4 5.5 L 4 10 M 2 8 L 6 8 M 3 13 L 4 10 L 5 13" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
    <!-- Backpack for scale -->
    <rect x="5.5" y="6" width="3" height="4" rx="1" fill="#FF6B6B"/>
  </g>

  <!-- Floating Falling Rocks (symbolizing unstable, hazardous terrain) -->
  <circle cx="120" cy="140" r="2.5" fill="#FF9F43" opacity="0.8"/>
  <circle cx="128" cy="155" r="1.5" fill="#FF9F43" opacity="0.5"/>
  <path d="M 115 170 L 117 174 L 113 174 Z" fill="#FF9F43" opacity="0.6"/>

  <!-- Dramatic Atmosphere / Ambient Light Accent -->
  <circle cx="120" cy="70" r="50" fill="#FF9F43" opacity="0.04" filter="blur(10px)"/>
</svg>