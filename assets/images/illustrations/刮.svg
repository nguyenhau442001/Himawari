<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Ambient glow / atmosphere representing strong wind -->
    <path d="M-90 -60 C-40 -80, 20 -70, 70 -50 C-10 -40, -50 -20, -80 0" fill="none" stroke="#2D3748" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-70 30 C-20 10, 40 20, 90 40 C30 50, -20 60, -60 80" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Dynamic Wind Gust Lines (Orange/Gold accent theme) -->
    <path d="M-100 -30 C-60 -35, -20 -15, 20 -35 C50 -50, 80 -40, 110 -55" fill="none" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M-80 10 C-40 5, 0 25, 45 5 C75 -5, 95 10, 115 5" fill="none" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M-95 55 C-55 45, -15 65, 30 45 C60 30, 90 45, 110 35" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Wind swirls -->
    <path d="M40 -35 C50 -35, 55 -30, 50 -25 C45 -20, 35 -25, 38 -30" fill="none" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
    <path d="M-30 20 C-20 20, -15 25, -20 30 C-25 35, -35 30, -32 25" fill="none" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>

    <!-- Central Object/Scene: A tree violently bending in the heavy wind ("外面刮大风了") -->
    <!-- Ground line -->
    <line x1="-80" y1="90" x2="80" y2="90" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>

    <!-- Bending Tree Trunk -->
    <path d="M-10 90 C-5 50, -25 10, -45 -30 C-50 -40, -52 -50, -45 -55 C-38 -60, -35 -45, -40 -30 C-30 0, -5 45, 10 90 Z" fill="#718096"/>
    
    <!-- Tree Foliage / Crown blown to the side -->
    <g transform="translate(-45, -55)">
      <!-- Layered leaves swept by wind -->
      <path d="M0 0 C-35 -20, -50 10, -35 35 C-20 60, 20 40, 25 10 C30 -20, 15 -10, 0 0 Z" fill="#2B6CB0"/>
      <path d="M-15 -10 C-45 -5, -45 25, -20 35 C0 45, 20 20, 5 0 C-5 -10, -10 -15, -15 -10 Z" fill="#3182CE"/>
      <path d="M-5 -25 C-30 -30, -40 -5, -25 15 C-10 35, 15 15, 10 -5 C5 -25, 0 -20, -5 -25 Z" fill="#4299E1"/>
    </g>

    <!-- Flying leaves (Debris in the wind) -->
    <path d="M30 -10 C35 -15, 40 -12, 38 -7 C35 -2, 25 -5, 30 -10 Z" fill="#FF9F43"/>
    <path d="M-65 -15 C-60 -20, -55 -18, -58 -12 C-60 -7, -70 -10, -65 -15 Z" fill="#FF9F43"/>
    <path d="M10 35 C15 30, 20 33, 18 38 C15 43, 8 40, 10 35 Z" fill="#FF9F43"/>

  </g>
</svg>