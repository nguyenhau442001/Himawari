<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- City Background -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#1e293b" opacity="0.5"/>
  <rect x="20" y="100" width="40" height="60" fill="#334155"/>
  <rect x="80" y="80" width="50" height="80" fill="#334155"/>
  <rect x="160" y="110" width="40" height="50" fill="#334155"/>
  
  <!-- The Overpass (立交桥) -->
  <path d="M0 140 C 60 120, 180 120, 240 140 L240 160 C 180 140, 60 140, 0 160 Z" fill="#475569"/>
  <path d="M20 150 L220 150" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <path d="M0 130 L40 100 L200 100 L240 130" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Characters -->
  <g transform="translate(100, 170)">
    <!-- Person 1 -->
    <circle cx="10" cy="10" r="8" fill="#f59e0b"/>
    <path d="M10 18 L10 40 M10 25 L0 35 M10 25 L20 35 M10 40 L5 60 M10 40 L15 60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Pointing Gesture -->
    <path d="M15 25 L30 15" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(140, 180)">
    <!-- Person 2 -->
    <circle cx="10" cy="10" r="8" fill="#38bdf8"/>
    <path d="M10 18 L10 40 M10 25 L0 35 M10 25 L20 35 M10 40 L5 60 M10 40 L15 60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Street Lights -->
  <circle cx="30" cy="100" r="3" fill="#fbbf24"/>
  <circle cx="210" cy="100" r="3" fill="#fbbf24"/>
  
  <!-- Decorative Accents -->
  <circle cx="200" cy="40" r="2" fill="#ec4899" opacity="0.4"/>
  <circle cx="40" cy="50" r="3" fill="#10b981" opacity="0.4"/>
</svg>