<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="8"/>
  
  <!-- Character 1 (The requester) -->
  <g transform="translate(40, 60)">
    <circle cx="40" cy="40" r="25" fill="#fb923c"/>
    <path d="M25 70 Q40 90 55 70" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="35" r="3" fill="#0f172a"/>
    <circle cx="48" cy="35" r="3" fill="#0f172a"/>
    <path d="M30 50 Q40 58 50 50" fill="none" stroke="#0f172a" stroke-width="2"/>
    <!-- Hands in pleading gesture -->
    <circle cx="40" cy="100" r="12" fill="#fb923c"/>
  </g>
  
  <!-- Character 2 (The helper) -->
  <g transform="translate(140, 60)">
    <circle cx="40" cy="40" r="25" fill="#38bdf8"/>
    <path d="M25 70 Q40 90 55 70" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="35" r="3" fill="#0f172a"/>
    <circle cx="48" cy="35" r="3" fill="#0f172a"/>
    <path d="M30 50 Q40 45 50 50" fill="none" stroke="#0f172a" stroke-width="2"/>
    <!-- Holding a document -->
    <rect x="50" y="70" width="30" height="40" fill="#f1f5f9" rx="2"/>
  </g>
  
  <!-- Desk Props -->
  <rect x="150" y="175" width="40" height="5" fill="#fbbf24" rx="1"/>
  <circle cx="60" cy="180" r="8" fill="#ec4899"/>
  <rect x="80" y="170" width="20" height="20" fill="#10b981" rx="4"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="120" r="150" fill="none" stroke="#f59e0b" stroke-opacity="0.05" stroke-width="20"/>
</svg>