<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- City Background: Old vs New -->
  <path d="M20 180 L100 180 L100 120 L60 100 L20 120 Z" fill="#334155"/>
  <path d="M140 180 L220 180 L220 80 L180 60 L140 80 Z" fill="#1e3a8a"/>
  
  <!-- Modern Buildings -->
  <rect x="150" y="90" width="20" height="90" fill="#38bdf8" rx="2"/>
  <rect x="180" y="70" width="30" height="110" fill="#0ea5e9" rx="2"/>
  
  <!-- Glowing Windows -->
  <rect x="155" y="100" width="10" height="10" fill="#fbbf24"/>
  <rect x="185" y="80" width="10" height="10" fill="#fbbf24"/>
  <rect x="185" y="100" width="10" height="10" fill="#fbbf24"/>
  
  <!-- Foreground: Character pointing at the change -->
  <g transform="translate(40, 130)">
    <circle cx="30" cy="30" r="25" fill="#fde68a"/>
    <path d="M30 55 L30 110 M30 70 L10 90 M30 70 L50 90" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 40 L70 20" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Elements: Sparkles of renewal -->
  <circle cx="160" cy="60" r="3" fill="#fb923c"/>
  <circle cx="190" cy="50" r="4" fill="#fb923c"/>
  <path d="M170 70 L175 65 L180 70 L175 75 Z" fill="#ec4899"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
  <path d="M0 180 L240 180" stroke="#334155" stroke-width="2"/>
</svg>