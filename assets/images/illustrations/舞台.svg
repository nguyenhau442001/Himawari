<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Stage Floor -->
  <path d="M20 180 L220 180 L240 220 L0 220 Z" fill="#334155"/>
  <path d="M20 180 L220 180 L210 170 L30 170 Z" fill="#475569"/>
  
  <!-- Spotlight Glows -->
  <ellipse cx="80" cy="150" rx="40" ry="20" fill="url(#spotlight)"/>
  <ellipse cx="160" cy="150" rx="40" ry="20" fill="url(#spotlight)"/>
  
  <!-- Actor 1 -->
  <g transform="translate(70, 120)">
    <circle cx="0" cy="-40" r="12" fill="#fbbf24"/>
    <path d="M-15 -30 L15 -30 L10 10 L-10 10 Z" fill="#ec4899"/>
    <path d="M-10 10 L-15 50 M10 10 L15 50" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M-5 50 L-10 70 M5 50 L10 70" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Actor 2 -->
  <g transform="translate(150, 110)">
    <circle cx="0" cy="-40" r="12" fill="#fbbf24"/>
    <path d="M-15 -30 L15 -30 L10 10 L-10 10 Z" fill="#38bdf8"/>
    <path d="M-10 10 L-5 50 M10 10 L5 50" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M-5 50 L-10 70 M5 50 L10 70" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Stage Lights (Beams) -->
  <path d="M60 0 L40 120 L80 120 Z" fill="#f59e0b" opacity="0.15"/>
  <path d="M180 0 L160 120 L200 120 Z" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Decorative Stage Elements -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
</svg>