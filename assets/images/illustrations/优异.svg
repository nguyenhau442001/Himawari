<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative academic elements -->
  <g opacity="0.15">
    <circle cx="120" cy="110" r="75" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="120" cy="110" r="90" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Scale Exaggeration/Contrast: Ordinary scores/papers in background (small, subtle) -->
  <g opacity="0.3">
    <!-- Left background paper -->
    <g transform="translate(45, 95) rotate(-12)">
      <rect x="0" y="0" width="36" height="48" rx="3" fill="#334155"/>
      <line x1="8" y1="10" x2="28" y2="10" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="18" x2="22" y2="18" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="32" r="5" fill="#EF4444"/>
    </g>

    <!-- Right background paper -->
    <g transform="translate(160, 95) rotate(15)">
      <rect x="0" y="0" width="36" height="48" rx="3" fill="#334155"/>
      <line x1="8" y1="10" x2="28" y2="10" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="18" x2="20" y2="18" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 30 L25 35 L30 27" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Central Focus: Outstanding Achievement (优异 - Scale Exaggeration: Large, Glowing, Elevated) -->
  <!-- Radiance/Glow behind the main award -->
  <circle cx="120" cy="110" r="50" fill="#F59E0B" opacity="0.12"/>
  <circle cx="120" cy="110" r="38" fill="#F59E0B" opacity="0.2"/>

  <!-- Floating Achievement Certificate/Exam Paper (Exaggerated Scale & Prominence) -->
  <g transform="translate(120, 110)">
    <!-- Shadow -->
    <ellipse cx="0" cy="70" rx="35" ry="6" fill="#0F172A" opacity="0.6"/>

    <!-- Main Document Paper (Tilted slightly for dynamic modern flat look) -->
    <g transform="translate(-36, -55)">
      <rect x="0" y="0" width="72" height="92" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
      
      <!-- Header lines -->
      <line x1="14" y1="16" x2="42" y2="16" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="25" x2="58" y2="25" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Body lines -->
      <line x1="14" y1="38" x2="52" y2="38" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="48" x2="48" y2="48" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="58" x2="36" y2="58" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

      <!-- Top Accent Banner -->
      <path d="M 0 6 C 0 2.686 2.686 0 6 0 L 66 0 C 69.314 0 72 2.686 72 6 L 72 14 L 0 14 Z" fill="#3B82F6"/>
    </g>

    <!-- Outstanding Gold Star Emblem (Visual Anchor for 'Exceptional/优异') -->
    <g transform="translate(0, -6)">
      <!-- Ribbon tails -->
      <path d="M-10 24 L-18 42 L-8 37 L-2 42 Z" fill="#D97706"/>
      <path d="M10 24 L18 42 L8 37 L2 42 Z" fill="#D97706"/>
      
      <!-- Gold Medal Base -->
      <circle cx="0" cy="10" r="24" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <circle cx="0" cy="10" r="19" fill="#FCD34D"/>

      <!-- Star Icon -->
      <path d="M0 -1 L3 6 L10 7 L5 12 L6 19 L0 15 L-6 19 L-5 12 L-10 7 L-3 6 Z" fill="#B45309" transform="translate(0, 2) scale(0.9)"/>
    </g>

    <!-- Sparkling Stars (Highlighting elite quality) -->
    <g fill="#F59E0B">
      <!-- Top Right Sparkle -->
      <path d="M 38 -32 Q 38 -22 48 -22 Q 38 -22 38 -12 Q 38 -22 28 -22 Q 38 -22 38 -32 Z"/>
      <!-- Top Left Sparkle (Smaller) -->
      <path d="M -42 -22 Q -42 -15 -49 -15 Q -42 -15 -42 -8 Q -42 -15 -35 -15 Q -42 -15 -42 -22 Z" transform="scale(0.8) translate(-10, -5)"/>
    </g>
  </g>

  <!-- Bottom UI Context / Anchor Line -->
  <rect x="70" y="202" width="100" height="4" rx="2" fill="#334155"/>
</svg>