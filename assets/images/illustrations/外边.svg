<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Window Frame representing "Inside" looking out to "Outside" (Wàibian) -->
  <!-- Outer wall background (Interior room) -->
  <rect x="24" y="24" width="192" height="192" rx="16" fill="#222730" stroke="#323846" stroke-width="4"/>
  
  <!-- Window Cutout -->
  <rect x="52" y="52" width="136" height="136" rx="8" fill="#12151B"/>
  
  <!-- Outside View (Sky, Wind, and Elements) -->
  <clipPath id="window-clip">
    <rect x="52" y="52" width="136" height="136" rx="8" />
  </clipPath>
  
  <g clip-path="url(#window-clip)">
    <!-- Outside Sky Background -->
    <rect x="52" y="52" width="136" height="136" fill="#1E2530"/>
    
    <!-- Distant Building Silhouettes -->
    <rect x="64" y="120" width="28" height="68" fill="#252C3A"/>
    <rect x="100" y="100" width="36" height="88" fill="#222936"/>
    <rect x="144" y="130" width="32" height="58" fill="#252C3A"/>
    
    <!-- Wind Gusts / Storm lines representing "外边风很大" -->
    <path d="M 60 75 Q 90 70 120 78 T 180 72" fill="none" stroke="#637599" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 55 105 Q 85 100 115 108 T 175 102" fill="none" stroke="#637599" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 70 145 Q 100 140 130 148 T 185 142" fill="none" stroke="#637599" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Flying leaves in the wind -->
    <path d="M 90 90 Q 95 85 100 90 Q 95 95 90 90 Z" fill="#E58D38" transform="rotate(-30 95 90)"/>
    <path d="M 140 120 Q 145 115 150 120 Q 145 125 140 120 Z" fill="#E58D38" transform="rotate(45 145 120)"/>
  </g>
  
  <!-- Window Sill & Frame Structure -->
  <!-- Window Pane Dividers -->
  <rect x="118" y="52" width="4" height="136" fill="#323846"/>
  <rect x="52" y="118" width="136" height="4" fill="#323846"/>
  
  <!-- Inner Window Frame Border -->
  <rect x="52" y="52" width="136" height="136" rx="8" fill="none" stroke="#424B5C" stroke-width="6"/>
  
  <!-- Windowsill extending inward -->
  <path d="M 40 188 L 200 188 L 210 200 L 30 200 Z" fill="#323846"/>
  <rect x="30" y="188" width="180" height="5" rx="2" fill="#424B5C"/>
  
  <!-- Indoor element: Warm glowing coat/jacket hanging near the window -->
  <path d="M 72 75 C 72 70 78 68 82 72 L 95 82 L 105 75 C 109 71 115 73 115 78 L 112 110 L 75 110 Z" fill="#E58D38"/>
  <path d="M 85 80 L 102 80" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="93" cy="92" r="2" fill="#1A1D24"/>
  <circle cx="93" cy="102" r="2" fill="#1A1D24"/>
  
  <!-- Focus Indicator (Subtle warm glow accent representing the distinct concept) -->
  <circle cx="120" cy="95" r="4" fill="#E58D38" opacity="0.8"/>
</svg>