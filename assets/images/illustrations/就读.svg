  </g>

  <!-- Open Book (Symbolizing Study) -->
  <path d="M80 195l40-10 40 10v15l-40-10-40 10z" fill="#FFB84D"/>
  <path d="M80 195l40 10 40-10" fill="none" stroke="#1A1D24" stroke-width="2"/>
