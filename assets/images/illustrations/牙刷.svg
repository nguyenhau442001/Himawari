<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambient background element for contrast -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Toothbrush Illustration Group (Diagonal layout for dynamism) -->
  <g transform="rotate(-35, 120, 120)">
    
    <!-- Toothbrush Handle (Sleek modern flat vector) -->
    <!-- Main handle body -->
    <path d="M 85 195 L 115 195 C 117.76 195 120 192.76 120 190 L 120 110 C 120 107.79 118.21 106 116 106 L 104 106 C 101.79 106 100 107.79 100 110 L 100 190 C 100 192.76 102.24 195 105 195 Z" fill="#E2E8F0" />
    
    <!-- Rubber ergonomic grip inlay (Vibrant accent) -->
    <path d="M 104 140 L 116 140 C 117.1 140 118 140.9 118 142 L 118 175 C 118 176.1 117.1 177 116 177 L 104 177 C 102.9 177 102 176.1 102 175 L 102 142 C 102 140.9 102.9 140 104 140 Z" fill="#F59E0B" />
    
    <!-- Neck (Tapered upper handle) -->
    <path d="M 103 106 L 117 106 C 118.1 106 119 105.1 118.5 104 L 113.5 65 C 112.5 57 107.5 57 106.5 65 L 101.5 104 C 101 105.1 101.9 106 103 106 Z" fill="#CBD5E1" />

    <!-- Brush Head Base -->
    <rect x="100.5" y="40" width="19" height="30" rx="9.5" fill="#E2E8F0" />

    <!-- Bristles (High-contrast focus color) -->
    <!-- Rows of bristles represented as clean rounded rectangles -->
    <rect x="103.5" y="43" width="4" height="24" rx="2" fill="#38BDF8" />
    <rect x="110.5" y="43" width="4" height="24" rx="2" fill="#0EA5E9" />
    <rect x="117.5" y="43" width="4" height="24" rx="2" fill="#38BDF8" opacity="0.6" />

  </g>

  <!-- Clean minimalist accent bubbles/sparkles to indicate freshness/cleanliness -->
  <circle cx="65" cy="80" r="4" fill="#38BDF8" opacity="0.7"/>
  <circle cx="175" cy="155" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="165" cy="75" r="2" fill="#38BDF8" opacity="0.5"/>
  <circle cx="75" cy="160" r="2.5" fill="#F59E0B" opacity="0.6"/>

</svg>