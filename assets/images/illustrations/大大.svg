<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Background subtle elements for depth -->
    <circle cx="120" cy="115" r="75" fill="#222733" opacity="0.6"/>
    
    <!-- Outer Large Scale / Ring (Representing the first "大" - scope/extent) -->
    <circle cx="120" cy="115" r="62" fill="none" stroke="#2D3748" stroke-width="3" stroke-dasharray="8 6"/>
    
    <!-- Central Giant Physical Object/Character (Elder/Grand figure representing "大大" as a noun for a senior person/dignitary/elder, embodying grand scale and importance) -->
    <!-- Torso / Suit -->
    <path d="M 80,155 C 80,135 98,125 120,125 C 142,125 160,135 160,155 L 175,180 C 175,183 172,185 168,185 L 72,185 C 68,185 65,183 65,180 Z" fill="#3182CE"/>
    
    <!-- Collar and Tie -->
    <polygon points="120,135 110,150 130,150" fill="#E2E8F0"/>
    <polygon points="117,150 123,150 125,175 120,180 115,175" fill="#F6AD55"/>
    
    <!-- Shoulders / Coat lapels -->
    <path d="M 85,135 L 120,155 L 155,135 L 165,160 L 140,165 L 120,155 L 100,165 L 75,160 Z" fill="#2B6CB0"/>

    <!-- Head (Grand, dignified older person) -->
    <circle cx="120" cy="90" r="28" fill="#FEEBC8"/>
    
    <!-- Hair (Silver/Grey distinguished hair on the sides) -->
    <path d="M 94,92 C 93,75 105,62 120,62 C 135,62 147,75 146,92 C 142,88 132,85 120,85 C 108,85 98,88 94,92 Z" fill="#CBD5E0"/>
    
    <!-- Gentle, Wise Facial Features -->
    <circle cx="110" cy="88" r="2.5" fill="#2D3748"/>
    <circle cx="130" cy="88" r="2.5" fill="#2D3748"/>
    <!-- Friendly Smile -->
    <path d="M 113,99 C 117,103 123,103 127,99" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
    <!-- Gentle Glasses -->
    <rect x="104" y="82" width="14" height="10" rx="2" fill="none" stroke="#CBD5E0" stroke-width="1.5"/>
    <rect x="122" y="82" width="14" height="10" rx="2" fill="none" stroke="#CBD5E0" stroke-width="1.5"/>
    <line x1="118" y1="87" x2="122" y2="87" stroke="#CBD5E0" stroke-width="1.5"/>

    <!-- Accent Focus: Golden Laurel / Grandeur Emblem behind or framing the dignified figure -->
    <path d="M 72,60 C 60,75 58,95 65,115" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    <path d="M 168,60 C 180,75 182,95 175,115" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top Floating Grand Star/Badge Emphasizing Magnitude ("大") -->
    <path d="M 120,38 L 124,46 L 133,47 L 126,53 L 128,62 L 120,58 L 112,62 L 114,53 L 107,47 L 116,46 Z" fill="#F6AD55"/>
  </g>
</svg>