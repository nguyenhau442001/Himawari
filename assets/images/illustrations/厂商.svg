<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for modern tech feel -->
  <path d="M60 180 L180 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="70" fill="none" stroke="#252A38" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Factory / Manufacturing Building (representing 厂) -->
  <g transform="translate(45, 80)">
    <!-- Main building body -->
    <rect x="25" y="40" width="80" height="60" fill="#2D3748" rx="2"/>
    
    <!-- Sawtooth factory roof (iconic manufacturing symbol) -->
    <path d="M25 40 L25 20 L50 40 L50 20 L75 40 L75 20 L105 40 Z" fill="#3B4960"/>
    
    <!-- Windows -->
    <rect x="35" y="50" width="12" height="15" fill="#63B3ED" rx="1"/>
    <rect x="57" y="50" width="12" height="15" fill="#63B3ED" rx="1"/>
    <rect x="79" y="50" width="12" height="15" fill="#63B3ED" rx="1"/>
    
    <!-- Industrial door / loading bay -->
    <path d="M52 100 L52 78 C52 75 54 73 57 73 L73 73 C76 73 78 75 78 78 L78 100 Z" fill="#1A202C"/>
    
    <!-- Smokestack with steam/exhaust -->
    <rect x="90" y="5" width="10" height="35" fill="#4A5568"/>
    <path d="M95 -2 C93 -8 98 -12 95 -18" fill="none" stroke="#718096" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M102 2 C100 -3 105 -7 102 -12" fill="none" stroke="#718096" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Commercial / Shipping / Product elements (representing 商) -->
  <g transform="translate(115, 115)">
    <!-- Modern Laptop / Product representation (connecting to contextual reference) -->
    <g transform="translate(10, 25)">
      <!-- Laptop Screen -->
      <rect x="0" y="-15" width="46" height="28" rx="2" fill="#2B6CB0"/>
      <rect x="3" y="-12" width="40" height="22" fill="#E2E8F0"/>
      <!-- Screen content (abstract UI) -->
      <rect x="7" y="-8" width="15" height="3" fill="#3182CE" rx="1"/>
      <rect x="7" y="-3" width="32" height="8" fill="#CBD5E0" rx="1"/>
      
      <!-- Laptop Base -->
      <path d="M-6 16 L52 16 C54 16 55 18 53 19 L-7 19 C-9 18 -8 16 -6 16 Z" fill="#A0AEC0"/>
      <!-- Hinge -->
      <rect x="15" y="13" width="16" height="3" fill="#4A5568" rx="1"/>
    </g>

    <!-- Shipping Box / Commerce symbol overlapping base -->
    <g transform="translate(-15, 20)">
      <rect x="0" y="5" width="28" height="24" rx="2" fill="#D69E2E"/>
      <!-- Box flaps -->
      <path d="M0 5 L14 -3 L28 5 Z" fill="#B7791F"/>
      <path d="M14 -3 L14 5" stroke="#975A16" stroke-width="1.5"/>
      <!-- Tape / Accent -->
      <rect x="12" y="5" width="4" height="24" fill="#F6AD55"/>
    </g>
  </g>

  <!-- Focus / Quality Accent Ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.8"/>
</svg>