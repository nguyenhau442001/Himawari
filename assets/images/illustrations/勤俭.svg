<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT: Cozy Living Room & Household Management Scene -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="30" width="200" height="150" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window showing night outdoors -->
  <g>
    <rect x="145" y="45" width="55" height="70" rx="2" fill="url(#nightSky)" stroke="#475569" stroke-width="2" />
    <!-- Window pane grid -->
    <line x1="172" y1="45" x2="172" y2="115" stroke="#475569" stroke-width="1.5" />
    <line x1="145" y1="80" x2="200" y2="80" stroke="#475569" stroke-width="1.5" />
    <!-- Distant cute moon/star -->
    <circle cx="185" cy="60" r="5" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Wooden Shelves with recycled jars/goods -->
  <g>
    <rect x="35" y="55" width="75" height="4" rx="2" fill="#64748b" />
    <!-- Glass jar 1 (reused jam jar with green lid) -->
    <path d="M 45 38 L 55 38 L 56 43 L 44 43 Z" fill="#10b981" />
    <rect x="44" y="43" width="13" height="12" rx="2" fill="#94a3b8" opacity="0.6" />
    <!-- Glass jar 2 (beans/grains) -->
    <rect x="65" y="38" width="14" height="17" rx="3" fill="#94a3b8" opacity="0.5" />
    <path d="M 68 45 L 76 45 L 75 53 L 69 53 Z" fill="#f59e0b" opacity="0.8" />
    <!-- Plant in recycled tin can -->
    <rect x="88" y="40" width="12" height="15" rx="1" fill="#38bdf8" />
    <path d="M 94 40 Q 90 30 85 32 Q 94 28 94 40 Z" fill="#22c55e" />
    <path d="M 94 40 Q 98 32 103 35 Q 94 30 94 40 Z" fill="#16a34a" />
  </g>

  <!-- Wall Clock showing thoughtful budgeting time -->
  <circle cx="115" cy="65" r="14" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <circle cx="115" cy="65" r="1.5" fill="#cbd5e1" />
  <line x1="115" y1="65" x2="115" y2="57" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="115" y1="65" x2="121" y2="67" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Hanging Warm Pendant Lamp -->
  <path d="M 105 20 L 135 20 L 130 35 L 110 35 Z" fill="#475569" />
  <line x1="120" y1="0" x2="120" y2="20" stroke="#64748b" stroke-width="1.5" />
  <path d="M 95 35 C 95 32 145 32 145 35 L 138 45 C 138 45 102 45 95 35 Z" fill="#fbbf24" />

  <!-- Sturdy Wooden Table / Desk -->
  <rect x="25" y="145" width="190" height="10" rx="2" fill="#b45309" />
  <rect x="35" y="155" width="12" height="50" rx="2" fill="#92400e" />
  <rect x="193" y="155" width="12" height="50" rx="2" fill="#92400e" />

  <!-- PROPS: Household Management (Ledger, Abacus, Teapot, Recycled items) -->
  <!-- Accounting Ledger & Pen -->
  <g transform="translate(100, 115)">
    <!-- Open Book / Ledger -->
    <path d="M 15 30 L 45 25 L 45 50 L 15 55 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 45 25 L 75 30 L 75 55 L 45 50 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <line x1="45" y1="27" x2="45" y2="52" stroke="#94a3b8" stroke-width="1" />
    <!-- Ledger lines -->
    <line x1="20" y1="35" x2="38" y2="35" stroke="#ef4444" stroke-width="1" stroke-linecap="round" />
    <line x1="20" y1="42" x2="35" y2="42" stroke="#64748b" stroke-width="1" stroke-linecap="round" />
    <line x1="52" y1="36" x2="70" y2="36" stroke="#64748b" stroke-width="1" stroke-linecap="round" />
    <line x1="52" y1="43" x2="65" y2="43" stroke="#64748b" stroke-width="1" stroke-linecap="round" />
    <!-- Simple traditional Abacus (Suanpan) next to ledger -->
    <rect x="78" y="32" width="28" height="20" rx="2" fill="#78350f" stroke="#b45309" stroke-width="1" />
    <line x1="85" y1="32" x2="85" y2="52" stroke="#d97706" stroke-width="1" />
    <line x1="92" y1="32" x2="92" y2="52" stroke="#d97706" stroke-width="1" />
    <line x1="99" y1="32" x2="99" y2="52" stroke="#d97706" stroke-width="1" />
    <!-- Abacus beads -->
    <circle cx="85" cy="38" r="2.5" fill="#fef3c7" />
    <circle cx="85" cy="46" r="2.5" fill="#fef3c7" />
    <circle cx="92" cy="36" r="2.5" fill="#fef3c7" />
    <circle cx="92" cy="48" r="2.5" fill="#fef3c7" />
    <circle cx="99" cy="39" r="2.5" fill="#fef3c7" />
    <circle cx="99" cy="45" r="2.5" fill="#fef3c7" />
  </g>

  <!-- Simple Ceramic Teapot & Cup (Frugal comfort) -->
  <g transform="translate(45, 122)">
    <path d="M 12 18 C 5 18 2 23 2 28 C 2 33 8 36 12 36 Z" fill="#e2e8f0" />
    <path d="M 12 15 L 18 15 L 17 38 L 13 38 Z" fill="#cbd5e1" />
    <path d="M 7 24 C 1 23 0 19 3 17" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" /> <!-- Spout -->
    <path d="M 17 21 C 21 21 22 30 17 32" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" /> <!-- Handle -->
    <circle cx="15" cy="13" r="3" fill="#10b981" /> <!-- Lid knob -->
    
    <!-- Teacup -->
    <path d="M 28 26 L 36 26 L 35 36 L 29 36 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- CHARACTERS: The Parents (Mother reviewing finances, Father supporting with care) -->
  
  <!-- MOTHER (Left side, managing household budget carefully) -->
  <g transform="translate(15, 65)">
    <!-- Body / Torso -->
    <path d="M 45 65 C 45 52 55 48 68 48 C 82 48 90 52 90 65 L 95 95 L 40 95 Z" fill="#0284c7" /> <!-- Blue cardigan/vest -->
    <path d="M 50 48 L 68 62 L 85 48" fill="none" stroke="#e0f2fe" stroke-width="2" /> <!-- Inner collar -->

    <!-- Head & Face -->
    <circle cx="67" cy="32" r="16" fill="#fbcfe8" /> <!-- Skin tone -->
    <!-- Neat bun hair -->
    <path d="M 53 30 C 53 20 81 20 81 30 C 85 30 88 35 84 38 C 75 33 59 33 50 38 C 46 35 49 30 53 30 Z" fill="#1e293b" />
    <circle cx="67" cy="18" r="6" fill="#1e293b" /> <!-- Bun -->
    
    <!-- Gentle, focused facial expression -->
    <path d="M 60 30 Q 64 28 67 30" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" /> <!-- Eyebrow -->
    <path d="M 70 30 Q 73 28 76 30" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="63" cy="33" r="1.5" fill="#1e293b" /> <!-- Eyes -->
    <circle cx="73" cy="33" r="1.5" fill="#1e293b" />
    <path d="M 67 36 L 66 39 L 68 39 Z" fill="#f472b6" /> <!-- Cute nose -->
    <path d="M 65 42 Q 68 45 71 42" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" /> <!-- Gentle smile -->

    <!-- Arm reaching forward to write/calculate -->
    <path d="M 48 60 C 38 65 35 75 42 82 C 45 85 48 83 47 80 C 45 74 48 68 55 64 Z" fill="#0284c7" />
    <!-- Hand holding pencil -->
    <circle cx="43" cy="83" r="3.5" fill="#fbcfe8" />
    <line x1="42" y1="84" x2="35" y2="88" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FATHER (Right side, supportive partner looking over ledger with practical wisdom) -->
  <g transform="translate(115, 58)">
    <!-- Body / Torso -->
    <path d="M 50 72 C 50 58 62 52 78 52 C 94 52 105 58 105 72 L 112 102 L 45 102 Z" fill="#334155" /> <!-- Dark practical jacket -->
    <path d="M 62 52 L 78 68 L 94 52" fill="none" stroke="#94a3b8" stroke-width="2" /> <!-- Collar -->
    <path d="M 78 65 L 78 102" fill="none" stroke="#64748b" stroke-width="1.5" /> <!-- Jacket opening -->

    <!-- Head & Face -->
    <circle cx="78" cy="36" r="17" fill="#fed7aa" /> <!-- Warm skin tone -->
    <!-- Short neat hair -->
    <path d="M 62 38 C 62 23 94 23 94 38 C 91 33 65 33 62 38 Z" fill="#334155" />
    
    <!-- Warm, supportive expression -->
    <path d="M 69 34 Q 73 32 76 34" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 80 34 Q 83 32 87 34" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="72" cy="37" r="1.5" fill="#1e293b" />
    <circle cx="83" cy="37" r="1.5" fill="#1e293b" />
    <!-- Warm smile -->
    <path d="M 76 45 Q 78 48 81 45" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm resting on table, pointing supportively at the ledger -->
    <path d="M 98 75 C 105 78 112 85 110 92 C 108 95 105 93 103 90 C 100 84 96 80 88 78 Z" fill="#334155" />
    <circle cx="111" cy="93" r="3.5" fill="#fed7aa" /> <!-- Hand -->
  </g>

  <!-- Foreground Floor & Base Shadow -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" />
  <ellipse cx="120" cy="210" rx="100" ry="6" fill="#000000" opacity="0.3" />
</svg>