<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cap Tassel Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Window & Night Sky (Tomorrow is coming) -->
  <path d="M 160 35 L 210 35 L 210 110 L 160 110 Z" fill="#090d16" stroke="#475569" stroke-width="2" rx="2" />
  <!-- Window Panes / Stars -->
  <circle cx="175" cy="50" r="1" fill="#94a3b8" />
  <circle cx="195" cy="70" r="1.5" fill="#f1f5f9" />
  <circle cx="180" cy="90" r="1" fill="#94a3b8" />
  <!-- Window Light Beam casting in -->
  <polygon points="160,110 210,110 235,215 110,215" fill="url(#light-beam)" opacity="0.6" />

  <!-- Wooden Bookshelf / Interior Prop Left -->
  <rect x="15" y="45" width="40" height="130" fill="#1e1b4b" rx="2" />
  <rect x="20" y="60" width="30" height="6" fill="#312e81" />
  <rect x="20" y="95" width="30" height="6" fill="#312e81" />
  <rect x="20" y="130" width="30" height="6" fill="#312e81" />
  <!-- Books on shelf -->
  <path d="M 23 55 L 28 55 L 28 60 L 23 60 Z" fill="#ec4899" />
  <path d="M 29 53 L 35 53 L 35 60 L 29 60 Z" fill="#38bdf8" />
  <path d="M 23 90 L 27 90 L 27 95 L 23 95 Z" fill="#10b981" />
  <path d="M 28 88 L 36 88 L 36 95 L 28 95 Z" fill="#f59e0b" />

  <!-- Potted Plant (Warmth & Life) -->
  <path d="M 205 180 L 225 180 L 220 210 L 210 210 Z" fill="#cbd5e1" />
  <ellipse cx="215" cy="180" rx="10" ry="3" fill="#94a3b8" />
  <path d="M 215 180 Q 200 150 190 145" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M 215 180 Q 230 140 235 135" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M 215 180 Q 215 140 210 135" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

  <!-- MAIN CHARACTER PREPARING FOR GRADUATION CEREMONY -->
  <!-- Desk / Surface -->
  <path d="M 50 185 L 200 185 L 210 215 L 40 215 Z" fill="#334155" />
  <path d="M 40 185 L 200 185 L 200 190 L 40 190 Z" fill="#475569" />

  <!-- Character Body & Robe (Bachelor's Robe preparation) -->
  <!-- Torso / Dark Academic Robe -->
  <path d="M 95 140 L 145 140 L 155 210 L 85 210 Z" fill="#1e293b" />
  <!-- Robe V-neck collar (Blue/Gold trim) -->
  <path d="M 110 140 L 130 140 L 120 175 Z" fill="#3b82f6" />
  <path d="M 116 140 L 124 140 L 120 170 Z" fill="url(#gold-grad)" />

  <!-- Arms / Gesturing excitedly toward the cap -->
  <!-- Left arm -->
  <path d="M 95 145 Q 75 160 80 180" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
  <!-- Right arm reaching forward -->
  <path d="M 145 145 Q 165 160 160 185" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />

  <!-- Hands -->
  <circle cx="79" cy="183" r="5" fill="#fcd34d" />
  <circle cx="162" cy="188" r="5" fill="#fcd34d" />

  <!-- Neck -->
  <rect x="112" y="128" width="16" height="18" fill="#fcd34d" rx="4" />

  <!-- Head & Facial Expression -->
  <circle cx="120" cy="105" r="22" fill="#fcd34d" />
  <!-- Happy smiling eyes -->
  <path d="M 110 102 Q 114 97 118 102" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 122 102 Q 126 97 130 102" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Cheeks (Excitement blush) -->
  <circle cx="110" cy="108" r="4" fill="#f43f5e" opacity="0.4" />
  <circle cx="130" cy="108" r="4" fill="#f43f5e" opacity="0.4" />
  <!-- Big happy smile anticipating tomorrow -->
  <path d="M 114 113 Q 120 120 126 113" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Hair (Stylized dark neat hair) -->
  <path d="M 98 102 Q 100 83 120 83 Q 140 83 142 102 Q 140 92 120 90 Q 100 92 98 102 Z" fill="#0f172a" />

  <!-- GRADUATION CAP & PROPS (Focus of the Ceremony theme) -->
  <!-- Sitting on the desk, being admired -->
  <g transform="translate(100, 160)">
    <!-- Cap Mortarboard Base (Diamond) -->
    <polygon points="20,10 45,2 70,10 45,18" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Cap Skullcap Part -->
    <path d="M 32 13 L 58 13 L 55 22 L 35 22 Z" fill="#1e293b" />
    <!-- Golden Button & Tassel hanging down -->
    <circle cx="45" cy="10" r="3" fill="url(#gold-grad)" />
    <path d="M 45 10 Q 55 15 58 28" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="58" cy="29" r="2" fill="url(#gold-grad)" />
  </g>

  <!-- Rolled Graduation Diploma with Ribbon (Symbolizing the Ceremony) -->
  <g transform="translate(65, 192) rotate(-15)">
    <!-- Scroll Paper -->
    <rect x="0" y="0" width="45" height="14" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner roll depth effect -->
    <line x1="3" y1="3" x2="42" y2="3" stroke="#cbd5e1" stroke-width="1" />
    <!-- Red Ribbon tied around -->
    <rect x="20" y="0" width="6" height="14" fill="#ef4444" />
    <!-- Ribbon tails -->
    <path d="M 23 14 L 20 22 L 23 20 L 26 22 Z" fill="#ef4444" />
  </g>

  <!-- Calendar / Clock showing "Tomorrow" concept -->
  <!-- Modern Wall Clock in background indicating time -->
  <circle cx="120" cy="40" r="18" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <circle cx="120" cy="40" r="2" fill="#f8fafc" />
  <line x1="120" y1="40" x2="120" y2="28" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <line x1="120" y1="40" x2="130" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <!-- Clock ticks -->
  <line x1="120" y1="23" x2="120" y2="25" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="120" y1="55" x2="120" y2="57" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="103" y1="40" x2="105" y2="40" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="135" y1="40" x2="137" y2="40" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Sparkles / Anticipation Atmosphere Elements -->
  <g fill="#fbbf24">
    <path d="M 65 130 Q 67 125 70 130 Q 67 135 65 130 Z" opacity="0.8" />
    <path d="M 175 120 Q 177 115 180 120 Q 177 125 175 120 Z" opacity="0.9" />
    <path d="M 150 85 Q 152 80 155 85 Q 152 90 150 85 Z" opacity="0.7" />
    <circle cx="85" cy="115" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="160" cy="100" r="2" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>