<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Kite Gradient 1 (Orange/Pink) -->
    <linearGradient id="kiteGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Kite Gradient 2 (Cyan/Blue) -->
    <linearGradient id="kiteGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Grass Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Background Environment: Soft distant hills -->
  <path d="M-10 180 Q 50 140, 120 165 T 250 150 L 250 240 L -10 240 Z" fill="#065f46" opacity="0.4" />
  <path d="M-10 190 Q 70 155, 150 185 T 250 170 L 250 240 L -10 240 Z" fill="#059669" opacity="0.6" />

  <!-- Foreground Grass Hill -->
  <path d="M-10 200 Q 80 175, 160 195 T 250 185 L 250 240 L -10 240 Z" fill="url(#grassGrad)" />

  <!-- Fluffy Cloud 1 -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="40" cy="50" r="15" />
    <circle cx="55" cy="45" r="18" />
    <circle cx="70" cy="52" r="12" />
    <rect x="35" y="50" width="40" height="15" rx="5" />
  </g>

  <!-- Fluffy Cloud 2 -->
  <g fill="#ffffff" opacity="0.1">
    <circle cx="180" cy="70" r="12" />
    <circle cx="192" cy="65" r="15" />
    <circle cx="205" cy="72" r="10" />
    <rect x="178" y="70" width="35" height="12" rx="4" />
  </g>

  <!-- KITES IN THE SKY (The core subject: 风筝) -->
  <!-- Kite 1 String -->
  <path d="M 75 145 Q 110 90, 140 65" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.7" />
  <!-- Kite 1 (Diamond Shape with Bows and Tail) -->
  <g transform="translate(140, 65)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="25" fill="#fb923c" opacity="0.2" filter="blur(4px)" />
    <!-- Kite Body -->
    <path d="M 0 -18 L 14 0 L 0 22 L -14 0 Z" fill="url(#kiteGrad1)" stroke="#fff" stroke-width="1" />
    <path d="M 0 -18 L 0 22 M -14 0 L 14 0" stroke="#fed7aa" stroke-width="0.7" opacity="0.6" />
    <!-- Bows on Tail -->
    <path d="M 0 22 Q 10 35, 5 48 Q -5 60, 2 72" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
    <ellipse cx="3" cy="35" rx="4" ry="2" fill="#38bdf8" />
    <ellipse cx="-2" cy="48" rx="4" ry="2" fill="#fbbf24" />
    <ellipse cx="1" cy="62" rx="3" ry="1.5" fill="#ec4899" />
  </g>

  <!-- Kite 2 String -->
  <path d="M 145 150 Q 170 110, 195 90" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.7" />
  <!-- Kite 2 (Smaller Secondary Kite) -->
  <g transform="translate(195, 90) rotate(15)">
    <path d="M 0 -12 L 10 0 L 0 16 L -10 0 Z" fill="url(#kiteGrad2)" stroke="#fff" stroke-width="0.8" />
    <path d="M 0 16 Q 8 25, 3 35" fill="none" stroke="#cbd5e1" stroke-width="0.7" />
    <circle cx="4" cy="24" r="2" fill="#fb923c" />
  </g>


  <!-- CHARACTER 1: Child running/holding string -->
  <g transform="translate(60, 140)">
    <!-- Body/Torso leaning forward for action -->
    <path d="M 10 15 L 22 35 L 12 45 L 2 25 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="18" cy="5" r="9" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 9 2 Q 18 -4, 25 3 Q 23 7, 18 6 Z" fill="#1e293b" />
    <!-- Back Arm holding string -->
    <path d="M 18 18 L 30 10 L 35 15" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Arm raised happily -->
    <path d="M 10 18 L -2 12 L -6 18" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Legs in running motion -->
    <path d="M 12 43 L 22 58" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <path d="M 12 43 L 0 52" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="23" cy="59" rx="4" ry="2" fill="#1e293b" />
    <ellipse cx="-2" cy="53" rx="4" ry="2" fill="#1e293b" />
  </g>

  <!-- CHARACTER 2: Child standing, pointing/cheering at kites -->
  <g transform="translate(130, 145)">
    <!-- Torso -->
    <path d="M 10 15 L 18 38 L 8 42 L 2 20 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="12" cy="4" r="8" fill="#fcd34d" />
    <!-- Hair Pigtails -->
    <circle cx="6" cy="1" r="3" fill="#1e293b" />
    <circle cx="18" cy="1" r="3" fill="#1e293b" />
    <!-- Arm pointing up to sky -->
    <path d="M 12 18 L 24 5 L 28 2" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Other arm -->
    <path d="M 6 20 L -2 28" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
    <!-- Legs -->
    <path d="M 10 40 L 14 58" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <path d="M 6 40 L 2 55" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <!-- Shoes -->
    <ellipse cx="15" cy="59" rx="3.5" ry="2" fill="#1e293b" />
    <ellipse cx="1" cy="56" rx="3.5" ry="2" fill="#1e293b" />
  </g>

  <!-- Foreground details: Flowers & Grass tufts -->
  <g fill="#f43f5e">
    <circle cx="35" cy="205" r="2" />
    <circle cx="40" cy="210" r="1.5" />
    <circle cx="105" cy="215" r="2" />
    <circle cx="175" cy="210" r="2" />
    <circle cx="182" cy="206" r="1.5" />
    <circle cx="210" cy="220" r="2" />
  </g>
  <g fill="#fbbf24">
    <circle cx="37" cy="208" r="1" />
    <circle cx="108" cy="213" r="1" />
    <circle cx="178" cy="208" r="1" />
    <circle cx="212" cy="218" r="1" />
  </g>

  <!-- Grass Blades silhouettes -->
  <path d="M 20 210 Q 22 200, 25 205 M 23 210 L 27 202 M 85 218 Q 88 208, 92 212 M 150 212 Q 153 200, 156 208 M 220 220 Q 223 210, 227 215" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />

  <!-- Ambient lighting/sparkles in air -->
  <circle cx="110" cy="100" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="165" cy="120" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="75" cy="80" r="1" fill="#ffffff" opacity="0.5" />
</svg>