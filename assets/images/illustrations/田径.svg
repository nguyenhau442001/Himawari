<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Background track elements (subtle curves) -->
    <path d="M40 180 C 20 180, 10 150, 20 110 C 30 70, 70 40, 120 40 C 170 40, 200 70, 200 110" fill="none" stroke="#2A2F3D" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Running Track Lanes -->
    <path d="M20 140 L 170 140 C 185 140, 195 130, 195 115 C 195 100, 185 90, 170 90 L 50 90 C 35 90, 25 80, 25 65 C 25 50, 35 40, 50 40 L 160 40" fill="none" stroke="#E65100" stroke-width="2" opacity="0.3"/>
    <path d="M15 160 L 175 160 C 195 160, 210 145, 210 125 C 210 105, 195 90, 175 90" fill="none" stroke="#FFA726" stroke-width="3" opacity="0.5"/>

    <!-- High Jump / Pole Vault Crossbar & Uprights (Field event representation) -->
    <rect x="150" y="45" width="4" height="115" rx="2" fill="#78909C"/>
    <rect x="175" y="45" width="4" height="115" rx="2" fill="#78909C"/>
    <rect x="145" y="65" width="34" height="4" rx="2" fill="#FFB74D"/>
    
    <!-- Running Athlete (Dynamic Flat Vector) -->
    <!-- Motion lines -->
    <line x1="75" y1="115" x2="55" y2="120" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="70" y1="130" x2="45" y2="135" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Back Leg -->
    <path d="M105 110 L 125 135 L 110 155" fill="none" stroke="#FFA726" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back Arm -->
    <path d="M100 80 L 120 100 L 105 115" fill="none" stroke="#FFCC80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso -->
    <path d="M90 70 L 110 115 L 95 120 Z" fill="#FF9800"/>
    
    <!-- Head -->
    <circle cx="85" cy="58" r="10" fill="#FFE0B2"/>
    
    <!-- Front Leg -->
    <path d="M105 115 L 85 140 L 65 130" fill="none" stroke="#FFB74D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm -->
    <path d="M95 75 L 75 90 L 85 105" fill="none" stroke="#FFE0B2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Track Base Line / Finish Line pattern -->
    <line x1="20" y1="170" x2="180" y2="170" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
    <rect x="165" y="166" width="4" height="8" fill="#FFFFFF"/>
    <rect x="173" y="166" width="4" height="8" fill="#FFFFFF"/>
    
    <!-- Secondary Field Icon: Javelin/Shot put arc accent -->
    <path d="M60 160 Q 95 140 130 160" fill="none" stroke="#4DB6AC" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  </g>
</svg>