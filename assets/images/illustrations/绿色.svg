<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Adjective / Describing Word Rule: Visual contrast & scale exaggeration -->
  <!-- Contextual reference: "这片叶子是绿色的" (The leaf is green) -->
  
  <!-- Dim, desaturated background element representing the general object/context -->
  <g opacity="0.3">
    <path d="M 60 140 C 60 90, 90 70, 130 65" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 100 170 C 100 120, 130 100, 170 95" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Focused contrast: Giant, vivid green leaf representing the exact adjective property "绿色" -->
  <g transform="translate(15, 10)">
    <!-- Leaf stem -->
    <path d="M 95 165 C 105 130, 115 95, 125 65" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Leaf body (large scale exaggeration for the quality) -->
    <path d="M 125 65 C 150 75, 185 105, 185 145 C 185 185, 145 195, 125 195 C 95 195, 65 175, 65 145 C 65 115, 95 85, 125 65 Z" fill="#10B981" opacity="0.2"/>
    <path d="M 125 65 C 150 75, 180 105, 180 140 C 180 175, 145 190, 125 190 C 95 190, 70 170, 70 140 C 70 110, 95 85, 125 65 Z" fill="#059669"/>
    
    <!-- Leaf veins (modern flat graphic details) -->
    <path d="M 125 160 L 155 135" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 115 135 L 145 110" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 105 115 L 125 95" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 125 135 L 95 110" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 135 110 L 115 90" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Accent highlight indicating property focus (gold/orange accent as per guidelines) -->
  <circle cx="185" cy="65" r="6" fill="#F59E0B"/>
  <circle cx="185" cy="65" r="12" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
</svg>