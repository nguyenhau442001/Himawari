<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/lines for structure -->
  <line x1="40" y1="200" x2="200" y2="200" stroke="#2A2F3A" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bar 1: Last Year (Lower) -->
  <!-- X: 60, Width: 40, Height: 70, Y: 130 -->
  <rect x="60" y="130" width="40" height="70" rx="6" fill="#3A4252"/>
  <text x="80" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6E7687" text-anchor="middle">去年</text>

  <!-- Bar 2: This Year (Higher, accented with gold/orange) -->
  <!-- X: 140, Width: 40, Height: 120, Y: 80 -->
  <rect x="140" y="80" width="40" height="120" rx="6" fill="url(#goldGradient)"/>
  <text x="160" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">今年</text>

  <!-- Upward comparison arrow / indicator spanning the height difference -->
  <g transform="translate(160, 62)">
    <circle cx="0" cy="0" r="14" fill="#F59E0B" opacity="0.15"/>
    <path d="M0 8 L0 -8 M-5 -3 L0 -8 L5 -3" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle dotted comparison line showing the elevation -->
  <line x1="100" y1="130" x2="140" y2="130" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
</svg>