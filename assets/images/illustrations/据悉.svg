<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="80" rx="2" fill="#475569"/>
  <rect x="180" y="150" width="10" height="80" rx="2" fill="#475569"/>
  
  <!-- Laptop Screen -->
  <rect x="70" y="70" width="100" height="70" rx="6" fill="#cbd5e1"/>
  <rect x="75" y="75" width="90" height="50" fill="#0f172a"/>
  
  <!-- Data Visualization on Screen -->
  <path d="M85 115 L100 95 L115 105 L130 90 L145 100" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="145" cy="100" r="3" fill="#38bdf8"/>
  
  <!-- Character: Professional looking at news -->
  <circle cx="120" cy="50" r="20" fill="#fde68a"/>
  <path d="M110 50 Q110 40 120 40 Q130 40 130 50" fill="#fbbf24"/>
  <path d="M105 55 Q120 65 135 55" stroke="#92400e" stroke-width="2" fill="none"/>
  <rect x="90" y="75" width="60" height="10" fill="#fb923c" rx="2"/>
  
  <!-- Calendar indicating next month -->
  <rect x="170" y="40" width="40" height="50" rx="4" fill="#334155"/>
  <rect x="175" y="45" width="30" height="10" fill="#ec4899"/>
  <rect x="175" y="60" width="30" height="25" fill="#f1f5f9"/>
  <circle cx="190" cy="72" r="6" fill="#10b981"/>
  
  <!-- Coffee Mug -->
  <rect x="170" y="120" width="20" height="20" rx="4" fill="#fb923c"/>
  <path d="M190 125 h5 a3 3 0 0 1 0 6 h-5" stroke="#fb923c" stroke-width="3" fill="none"/>
  
  <!-- Ambient Light Glow -->
  <circle cx="120" cy="70" r="80" fill="#f59e0b" opacity="0.05"/>
</svg>