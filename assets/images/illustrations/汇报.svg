<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window City Glow Gradient -->
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Projector Screen Glow -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Warm Lamp Light -->
    <radialGradient id="lampLight" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT & INTERIOR DECORATION -->
  <!-- Office Wall & Floor Partition -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#0f172a" stroke-width="3" />
  <rect x="0" y="180" width="240" height="60" fill="#0b0f19" />

  <!-- Large Window with City Skyline Silhouette -->
  <g opacity="0.6">
    <rect x="145" y="25" width="75" height="110" rx="4" fill="url(#windowGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Window Panes -->
    <line x1="145" y1="80" x2="220" y2="80" stroke="#334155" stroke-width="1" />
    <line x1="182.5" y1="25" x2="182.5" y2="135" stroke="#334155" stroke-width="1" />
    <!-- City Buildings outside -->
    <path d="M150,135 L150,105 L160,105 L160,135 L170,135 L170,90 L180,90 L180,135 L195,135 L195,70 L205,70 L205,135 L215,135 L215,115 L220,115 L220,135 Z" fill="#1e293b" />
    <!-- Tiny glowing windows -->
    <rect x="153" y="110" width="3" height="4" fill="#fbbf24" opacity="0.6" />
    <rect x="153" y="118" width="3" height="4" fill="#fbbf24" opacity="0.4" />
    <rect x="173" y="96" width="3" height="4" fill="#fbbf24" opacity="0.5" />
    <rect x="198" y="78" width="3" height="5" fill="#38bdf8" opacity="0.7" />
    <rect x="202" y="78" width="3" height="5" fill="#fbbf24" opacity="0.5" />
  </g>

  <!-- Presentation Screen in Background -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="105" height="75" rx="4" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#softShadow)" />
    <!-- Screen Stand / Mount -->
    <line x1="52.5" y1="0" x2="52.5" y2="-10" stroke="#475569" stroke-width="2" />
    <!-- Abstract Progress Chart on Screen (Bars and Line) -->
    <polyline points="15,55 35,45 55,50 75,30 90,20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Data points -->
    <circle cx="35" cy="45" r="2.5" fill="#ffffff" />
    <circle cx="55" cy="50" r="2.5" fill="#ffffff" />
    <circle cx="75" cy="30" r="2.5" fill="#fbbf24" />
    <circle cx="90" cy="20" r="3" fill="#10b981" />
    <!-- Mini bar graphs -->
    <rect x="18" y="58" width="8" height="10" rx="1" fill="#334155" />
    <rect x="30" y="52" width="8" height="16" rx="1" fill="#334155" />
    <rect x="42" y="48" width="8" height="20" rx="1" fill="#334155" />
    <rect x="54" y="40" width="8" height="28" rx="1" fill="#38bdf8" opacity="0.6" />
    <rect x="66" y="32" width="8" height="36" rx="1" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Overhead Modern Lamp -->
  <path d="M125,0 L135,0 L140,15 L120,15 Z" fill="#475569" />
  <line x1="130" y1="0" x2="130" y2="35" stroke="#475569" stroke-width="1.5" />
  <ellipse cx="130" cy="35" rx="20" ry="6" fill="#334155" />
  <ellipse cx="130" cy="35" rx="16" ry="4" fill="#fbbf24" />
  <path d="M100,35 L130,180 L160,180 Z" fill="url(#lampLight)" style="mix-blend-mode: screen;" pointer-events="none" />

  <!-- FURNITURE: Meeting Table & Stool -->
  <!-- Modern Curved Wooden/Slate Meeting Table -->
  <g filter="url(#softShadow)">
    <path d="M60,155 L180,155 C195,155 205,170 195,185 L140,210 C120,218 80,218 60,210 C45,202 45,165 60,155 Z" fill="#334155" />
    <path d="M63,158 L177,158 C190,158 198,170 190,182 L137,205 C119,212 81,212 63,205 C51,197 51,168 63,158 Z" fill="#1e293b" />
  </g>
  <!-- Table Legs -->
  <rect x="75" y="195" width="8" height="30" rx="2" fill="#475569" />
  <rect x="160" y="195" width="8" height="30" rx="2" fill="#475569" />

  <!-- Table Props: Laptop, Notebook, Coffee Cup -->
  <g transform="translate(100, 155)">
    <!-- Laptop Base -->
    <polygon points="10,25 45,25 50,35 0,35" fill="#94a3b8" />
    <!-- Laptop Screen -->
    <polygon points="12,5 43,5 45,25 10,25" fill="#cbd5e1" />
    <polygon points="14,7 41,7 43,23 12,23" fill="#0f172a" />
    <rect x="18" y="10" width="12" height="8" rx="1" fill="#38bdf8" opacity="0.7" />
    <!-- Notebook & Pen -->
    <rect x="55" y="22" width="22" height="16" rx="2" fill="#f8fafc" />
    <line x1="59" y1="26" x2="73" y2="26" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="59" y1="30" x2="70" y2="30" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="53" y1="34" x2="65" y2="20" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
    <!-- Coffee Mug -->
    <rect x="-12" y="24" width="10" height="12" rx="2" fill="#ffffff" />
    <path d="M-2,27 C1,27 1,33 -2,33" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <ellipse cx="-7" cy="24" rx="3" ry="1" fill="#38bdf8" />
  </g>


  <!-- CHARACTERS -->

  <!-- CHARACTER 1: The Presenter / Subordinate (Standing left, actively pointing/reporting) -->
  <g id="presenter" filter="url(#softShadow)">
    <!-- Body / Torso (leaning forward professionally) -->
    <path d="M55,115 C55,100 65,95 75,105 L85,135 C88,145 75,155 65,150 Z" fill="#3b82f6" />
    <path d="M68,102 L74,107 L70,130 L64,125 Z" fill="#ffffff" /> <!-- Shirt Collar/Tie accent -->
    
    <!-- Head & Hair -->
    <circle cx="70" cy="85" r="14" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M57,85 C57,72 70,70 83,78 C83,83 75,85 70,85 C60,85 57,85 57,85 Z" fill="#0f172a" /> <!-- Neat dark hair -->
    
    <!-- Facial expression: Focused, engaged, speaking -->
    <circle cx="74" cy="84" r="1.5" fill="#1e293b" />
    <path d="M78,89 Q82,91 80,93" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" /> <!-- Confident smile -->

    <!-- Left Arm (Holding pointer/gesture towards screen) -->
    <path d="M65,110 L45,100 L30,115" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="30" cy="115" r="3" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Right Arm (Gesticulating open palm towards leader) -->
    <path d="M78,112 L95,125 L105,115" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="105" cy="115" r="3.5" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Legs (Standing firmly) -->
    <path d="M62,148 L58,195 L68,195 L72,150 Z" fill="#1e293b" />
    <path d="M74,148 L80,195 L90,195 L80,150 Z" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="64" cy="196" rx="6" ry="2.5" fill="#0f172a" />
    <ellipse cx="85" cy="196" rx="6" ry="2.5" fill="#0f172a" />
  </g>


  <!-- CHARACTER 2: The Leader / Superior (Sitting right, attentive, listening & nodding) -->
  <g id="leader" filter="url(#softShadow)">
    <!-- Chair Backrest -->
    <rect x="165" y="90" width="28" height="75" rx="6" fill="#475569" />
    <rect x="170" y="98" width="18" height="60" rx="4" fill="#334155" />

    <!-- Torso (Sitting upright, professional blazer) -->
    <path d="M150,115 C150,105 165,105 175,115 L180,155 C180,165 160,165 150,155 Z" fill="#0f172a" />
    <path d="M162,112 L168,118 L165,145 L158,140 Z" fill="#38bdf8" /> <!-- Inner shirt / blouse -->

    <!-- Head & Hair (Grey-distinguished leader or serious professional) -->
    <circle cx="165" cy="82" r="14" fill="#fbcfe8" />
    <!-- Stylish haircut -->
    <path d="M151,82 C151,68 179,68 179,82 C179,85 175,80 165,80 C155,80 151,82 151,82 Z" fill="#334155" />
    
    <!-- Facial expression: Attentive, thoughtful, observant -->
    <circle cx="158" cy="81" r="1.5" fill="#1e293b" />
    <!-- Glasses -->
    <rect x="154" y="77" width="6" height="5" rx="1" fill="none" stroke="#fbbf24" stroke-width="1.2" />
    <path d="M160,79 L163,79" stroke="#fbbf24" stroke-width="1.2" />
    <!-- Calm, neutral-positive mouth -->
    <path d="M156,88 Q159,90 162,88" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" />

    <!-- Arms (Resting attentively on table/crossing slightly) -->
    <path d="M155,120 L135,135 L125,145" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="125" cy="145" r="3.5" fill="#fbcfe8" /> <!-- Hand resting near laptop -->
  </g>

  <!-- FOREGROUND ACCENTS & POLISH (Soft lighting / atmosphere) -->
  <!-- Subtle upward ambient energy highlights -->
  <circle cx="70" cy="110" r="25" fill="#38bdf8" opacity="0.08" filter="url(#softShadow)" pointer-events="none" />
  <circle cx="150" cy="120" r="30" fill="#fbbf24" opacity="0.05" filter="url(#softShadow)" pointer-events="none" />

</svg>