<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(20, 40)">
    <!-- Music Notes/Essence Flow -->
    <path d="M120 30 C 150 20, 180 40, 170 70 S 140 100, 120 90" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
    <circle cx="170" cy="70" r="4" fill="#fb923c"/>
    <circle cx="140" cy="40" r="3" fill="#38bdf8"/>
    
    <!-- Characters -->
    <!-- Person 1 (Guitarist) -->
    <path d="M40 160 Q 40 120 60 120 T 80 160" fill="#ec4899"/>
    <circle cx="60" cy="110" r="15" fill="#fde68a"/>
    <rect x="55" y="125" width="10" height="30" fill="#ec4899"/>
    
    <!-- Person 2 (Singer) -->
    <path d="M100 160 Q 100 110 120 110 T 140 160" fill="#38bdf8"/>
    <circle cx="120" cy="100" r="18" fill="#fde68a"/>
    <path d="M115 130 L 125 130 L 130 160 L 110 160 Z" fill="#38bdf8"/>
    
    <!-- Person 3 (Piano/Keyboard) -->
    <path d="M160 160 Q 160 120 180 120 T 200 160" fill="#10b981"/>
    <circle cx="180" cy="110" r="15" fill="#fde68a"/>
    <rect x="175" y="125" width="10" height="30" fill="#10b981"/>
    
    <!-- Instrument/Desk -->
    <rect x="30" y="160" width="160" height="15" rx="2" fill="#475569"/>
    <rect x="40" y="175" width="140" height="10" rx="2" fill="#334155"/>
    
    <!-- Heart/Essence Symbolizing 'Xin Xue' -->
    <path d="M120 70 C 110 60, 100 70, 120 90 C 140 70, 130 60, 120 70" fill="#fb923c"/>
  </g>
  
  <!-- Ambient Lighting -->
  <circle cx="120" cy="80" r="60" fill="#fbbf24" opacity="0.05"/>
</svg>