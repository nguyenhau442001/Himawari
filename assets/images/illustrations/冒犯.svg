<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="90" fill="#334155"/>
  <rect x="190" y="150" width="10" height="90" fill="#334155"/>
  
  <!-- Desk items -->
  <circle cx="170" cy="125" r="12" fill="#fbbf24"/>
  <rect x="60" y="120" width="30" height="20" rx="2" fill="#38bdf8"/>
  
  <!-- Character 1 (Apologizing) -->
  <g transform="translate(60, 80)">
    <path d="M20 150 L20 100 Q20 80 40 80 L60 80 Q80 80 80 100 L80 150" fill="#fb923c"/>
    <circle cx="50" cy="65" r="20" fill="#fde68a"/>
    <path d="M40 60 L45 65 M55 60 L50 65" stroke="#1e293b" stroke-width="2"/>
    <path d="M45 75 Q50 72 55 75" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Hands clasped in apology -->
    <circle cx="50" cy="110" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Character 2 (The person being addressed) -->
  <g transform="translate(130, 80)">
    <path d="M20 150 L20 100 Q20 80 40 80 L60 80 Q80 80 80 100 L80 150" fill="#ec4899"/>
    <circle cx="50" cy="65" r="20" fill="#fde68a"/>
    <path d="M40 60 L45 65 M55 60 L50 65" stroke="#1e293b" stroke-width="2"/>
    <path d="M42 75 Q50 70 58 75" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Slightly stern posture -->
    <rect x="15" y="90" width="70" height="5" rx="2" fill="#10b981"/>
  </g>
  
  <!-- Ambient light effect -->
  <ellipse cx="120" cy="200" rx="80" ry="20" fill="#38bdf8" opacity="0.1"/>
</svg>