<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="30" y="150" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="165" width="10" height="60" fill="#475569"/>
  <rect x="190" y="165" width="10" height="60" fill="#475569"/>
  
  <!-- Leader (Manager) -->
  <g transform="translate(130, 80)">
    <circle cx="25" cy="25" r="25" fill="#fbbf24"/>
    <path d="M10 40 Q25 55 40 40" stroke="#0f172a" stroke-width="3" fill="none"/>
    <rect x="10" y="60" width="30" height="80" rx="5" fill="#38bdf8"/>
    <rect x="0" y="65" width="50" height="10" rx="2" fill="#38bdf8"/>
  </g>
  
  <!-- Employee -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="20" fill="#fca5a5"/>
    <path d="M10 30 Q20 40 30 30" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="5" y="45" width="30" height="95" rx="5" fill="#ec4899"/>
  </g>
  
  <!-- Document / Proposal -->
  <rect x="95" y="120" width="50" height="60" rx="2" fill="#f8fafc"/>
  <line x1="105" y1="135" x2="135" y2="135" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="105" y1="145" x2="135" y2="145" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="105" y1="155" x2="120" y2="155" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Checkmark (Acceptance) -->
  <path d="M145 110 L155 120 L175 95" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Ambient light -->
  <circle cx="150" cy="90" r="40" fill="#fbbf24" opacity="0.1"/>
</svg>