<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/water effect hinting at deep ocean context -->
  <circle cx="120" cy="120" r="90" fill="#222B38" opacity="0.6"/>
  
  <!-- Scent/olfactory wave lines (representing "嗅觉" / acute sense of smell from the sentence context) -->
  <path d="M75,95 C65,95 55,100 50,110" stroke="#FFA726" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M68,80 C54,82 40,90 32,105" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M60,65 C42,68 25,80 15,100" stroke="#FFA726" stroke-width="3" stroke-linecap="round" fill="none" opacity="1"/>

  <!-- Shark Illustration (Cá mập - 鲨鱼) -->
  <g transform="translate(10, 10)">
    <!-- Dorsal Fin (Vây lưng) -->
    <path d="M 125 70 L 140 25 L 155 75 Z" fill="#3B82F6"/>
    
    <!-- Pectoral Fin (Vây ngực) -->
    <path d="M 130 115 L 115 150 L 150 135 Z" fill="#2563EB" opacity="0.9"/>

    <!-- Main Body & Head (Thân và đầu cá mập) -->
    <!-- Sleek hydrodynamic body tapering to the tail -->
    <path d="M 60 110 C 60 110 110 70 170 85 C 200 92 215 105 225 110 C 215 115 200 128 170 135 C 110 150 60 110 60 110 Z" fill="#60A5FA"/>
    
    <!-- Belly (Bụng màu sáng) -->
    <path d="M 75 113 C 110 130 160 130 195 118 C 170 135 110 138 75 113 Z" fill="#93C5FD" opacity="0.6"/>

    <!-- Tail Fin (Vây đuôi) -->
    <!-- Upper lobe -->
    <path d="M 215 108 L 238 75 C 238 75 232 102 223 112 Z" fill="#3B82F6"/>
    <!-- Lower lobe -->
    <path d="M 218 112 L 238 135 C 238 135 232 118 223 112 Z" fill="#2563EB"/>

    <!-- Gills (Mang cá) -->
    <path d="M 95 95 L 90 110" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 103 94 L 98 109" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 111 93 L 106 108" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye (Mắt sắc sảo) -->
    <circle cx="78" cy="98" r="4" fill="#0F172A"/>
    <circle cx="79.5" cy="97" r="1.5" fill="#FFFFFF"/>

    <!-- Sharp Snout & Mouth hint -->
    <path d="M 60 110 L 72 110" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Focus accent dot highlighting the keen sensory perception -->
  <circle cx="65" cy="115" r="3" fill="#FFA726"/>
  <circle cx="65" cy="115" r="7" stroke="#FFA726" stroke-width="1.5" fill="none" opacity="0.8"/>
</svg>