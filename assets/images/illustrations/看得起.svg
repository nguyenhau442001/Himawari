<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle architectural element/light -->
  <path d="M120 40 L160 80 L80 80 Z" fill="#252A34" opacity="0.3"/>
  <rect x="70" y="80" width="100" height="120" rx="4" fill="#222733"/>

  <!-- Person A (Speaker / Colleague being respected, receiving the trust) -->
  <g transform="translate(0, 0)">
    <!-- Body / Suit -->
    <path d="M65 180 C65 155 75 145 90 145 L105 145 C120 145 130 155 130 180 Z" fill="#2E4057"/>
    <!-- Shirt collar & tie -->
    <polygon points="90,145 97,165 105,145" fill="#EAEAEA"/>
    <polygon points="95,155 99,185 101,185 101,155" fill="#E6AF2E"/>
    <!-- Head & Neck -->
    <rect x="90" y="130" width="18" height="20" fill="#E0AC69"/>
    <circle cx="99" cy="115" r="16" fill="#E0AC69"/>
    <!-- Hair -->
    <path d="M83 115 C83 100 95 98 110 105 C115 110 115 115 115 115 L83 115 Z" fill="#2C3E50"/>
    <!-- Confident, appreciative posture (hand on chest) -->
    <path d="M90 155 C90 155 95 168 102 165 C109 162 112 150 112 150" fill="none" stroke="#E0AC69" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Person B (Colleague / Superior showing respect - bowing slightly, open gesture of high regard) -->
  <g transform="translate(45, 0)">
    <!-- Body / Suit - tilted forward in respectful bow -->
    <path d="M65 180 C65 155 75 145 90 145 L105 145 C120 145 130 155 130 180 Z" fill="#3B4F6C" transform="rotate(12 97 160)"/>
    <!-- Head & Neck - tilted -->
    <g transform="rotate(12 97 140)">
      <rect x="90" y="130" width="18" height="20" fill="#D4A373"/>
      <circle cx="99" cy="115" r="16" fill="#D4A373"/>
      <!-- Hair -->
      <path d="M83 115 C83 100 95 98 110 105 C115 110 115 115 115 115 L83 115 Z" fill="#34495E"/>
      <!-- Warm, respectful smile lines -->
      <path d="M106 118 Q110 121 113 119" fill="none" stroke="#8D5B4C" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Extended gesture of high regard / valuing (open palm forward) -->
    <path d="M75 155 C60 150 50 145 45 140" fill="none" stroke="#D4A373" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Symbol of Trust/Task Handover (Folder/Briefcase floating subtly between them with gold accent representing high value/esteem) -->
  <g transform="translate(100, 105)">
    <!-- Glow / Aura of respect -->
    <circle cx="20" cy="15" r="22" fill="#E6AF2E" opacity="0.15"/>
    
    <!-- Professional Folder / Mission Document -->
    <rect x="5" y="5" width="30" height="22" rx="3" fill="#F4D06F"/>
    <path d="M5 9 L15 9 L18 13 L35 13" fill="none" stroke="#DAA520" stroke-width="2"/>
    <rect x="10" y="12" width="20" height="12" rx="1" fill="#FFFFFF"/>
    <!-- Document lines -->
    <line x1="13" y1="15" x2="24" y2="15" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="19" x2="20" y2="19" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Subtle upward rising gold particles representing "value, esteem, elevation" (看得起 - looking up to / valuing someone) -->
  <circle cx="105" cy="85" r="2.5" fill="#E6AF2E" opacity="0.8"/>
  <circle cx="115" cy="70" r="1.5" fill="#E6AF2E" opacity="0.6"/>
  <circle cx="125" cy="80" r="2" fill="#E6AF2E" opacity="0.9"/>
  <circle cx="135" cy="65" r="3" fill="#F4D06F" opacity="0.7"/>

  <!-- Floor shadow for grounding -->
  <ellipse cx="120" cy="183" rx="85" ry="6" fill="#111318"/>
</svg>