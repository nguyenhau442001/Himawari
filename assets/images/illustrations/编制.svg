<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "编制" (Noun - authorized personnel quota/staffing structure):
       Represented as an official institutional organizational chart / personnel slots board 
       with formal structured avatar placeholders, highlighting authorized headcount slots. -->

  <!-- Outer Board Frame -->
  <rect x="36" y="38" width="168" height="152" rx="12" fill="#222733" stroke="#2F3646" stroke-width="2"/>

  <!-- Header Section of the Board -->
  <rect x="36" y="38" width="168" height="32" rx="12" fill="#2A3140"/>
  <rect x="36" y="58" width="168" height="12" fill="#2A3140"/>
  
  <!-- Header Icon/Dots -->
  <circle cx="54" cy="54" r="4" fill="#E6A15C"/>
  <circle cx="68" cy="54" r="4" fill="#4A5568"/>
  <circle cx="82" cy="54" r="4" fill="#4A5568"/>

  <!-- Top-level Management Node (Authorized Slot 1) -->
  <rect x="96" y="84" width="48" height="32" rx="6" fill="#1E2430" stroke="#E6A15C" stroke-width="2"/>
  <circle cx="120" cy="94" r="5" fill="#E6A15C"/>
  <path d="M110 106 C110 101.5 114.5 100 120 100 C125.5 100 130 101.5 130 106 Z" fill="#E6A15C"/>

  <!-- Connecting Lines -->
  <path d="M120 116 V132 M72 132 H168" stroke="#3A4456" stroke-width="2" fill="none"/>
  <path d="M72 132 V144 M120 132 V144 M168 132 V144" stroke="#3A4456" stroke-width="2" fill="none"/>

  <!-- Lower Staff Slots (Authorized Quota / Biên chế structure) -->
  <!-- Slot 2 (Filled - Official Staff) -->
  <rect x="48" y="144" width="48" height="32" rx="6" fill="#1E2430" stroke="#3A4456" stroke-width="1.5"/>
  <circle cx="72" cy="154" r="4" fill="#718096"/>
  <path d="M64 164 C64 160.5 67.5 159 72 159 C76.5 159 80 160.5 80 164 Z" fill="#718096"/>

  <!-- Slot 3 (Filled - Official Staff with Gold Accent signifying strict approved quota) -->
  <rect x="96" y="144" width="48" height="32" rx="6" fill="#252B38" stroke="#E6A15C" stroke-width="2"/>
  <circle cx="120" cy="154" r="4" fill="#E6A15C"/>
  <path d="M112 164 C112 160.5 115.5 159 120 159 C124.5 159 128 160.5 128 164 Z" fill="#E6A15C"/>
  
  <!-- Small verification badge on official slot -->
  <circle cx="136" cy="150" r="5" fill="#E6A15C"/>
  <path d="M133.5 150 L135 151.5 L138.5 148" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Slot 4 (Empty / Reserved Quota Slot) -->
  <rect x="144" y="144" width="48" height="32" rx="6" fill="#1E2430" stroke="#3A4456" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="168" cy="160" r="8" fill="none" stroke="#4A5568" stroke-width="1.5"/>
  <path d="M165 160 H171 M168 157 V163" stroke="#4A5568" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom Accent Label Bar (Visual balance representing official document/quota file) -->
  <rect x="60" y="196" width="120" height="8" rx="4" fill="#2A3140"/>
  <rect x="75" y="198" width="60" height="4" rx="2" fill="#E6A15C"/>
</svg>