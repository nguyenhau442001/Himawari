<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Glow / Focus element -->
  <circle cx="120" cy="115" r="70" fill="#222733" />
  
  <!-- Conceptual Graphic for "申报" (Customs Declaration / Official Document with Check & Stamp) -->
  <g transform="translate(0, 0)">
    <!-- Clipboard / Document Base -->
    <rect x="75" y="55" width="90" height="125" rx="8" fill="#2E3646" stroke="#404B60" stroke-width="2"/>
    
    <!-- Paper Sheet -->
    <rect x="85" y="65" width="70" height="105" rx="4" fill="#FFFFFF"/>
    
    <!-- Document Header / Clip -->
    <rect x="98" y="47" width="44" height="14" rx="4" fill="#FFA500"/>
    <circle cx="120" cy="54" r="3" fill="#1A1D24"/>
    
    <!-- Form Lines (Placeholder text lines) -->
    <rect x="100" y="85" width="45" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="100" y="100" width="30" height="6" rx="3" fill="#E2E8F0"/>
    
    <rect x="100" y="125" width="45" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="100" y="135" width="35" height="4" rx="2" fill="#CBD5E1"/>
    
    <!-- Checkmark Icon (Declaration Approved/Submitted) -->
    <circle cx="120" cy="112" r="14" fill="#E0F2FE"/>
    <path d="M113 112 L118 117 L128 107" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Official Stamp / Seal (Gold/Orange Accent) -->
    <g transform="translate(115, 130)">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#FFA500" stroke-width="2.5" stroke-dasharray="4 2"/>
      <path d="M12 20 L17 25 L28 14" fill="none" stroke="#FFA500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Baggage / Item icon hint (representing goods to declare) -->
    <g transform="translate(55, 145)">
      <rect x="0" y="10" width="22" height="16" rx="3" fill="#FFA500"/>
      <path d="M7 10 V7 C7 5.3 8.3 4 10 4 H12 C13.7 4 15 5.3 15 7 V10" fill="none" stroke="#FFA500" stroke-width="2" stroke-linecap="round"/>
      <circle cx="11" cy="18" r="2" fill="#1A1D24"/>
    </g>
    
    <!-- Arrow indicating declaration submission -->
    <path d="M165 90 C185 90, 185 130, 165 130" fill="none" stroke="#FFA500" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="162,125 172,130 162,135" fill="#FFA500"/>
  </g>
</svg>