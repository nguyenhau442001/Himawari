<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#FF8C00" opacity="0.08"/>
  
  <!-- Ripe Apple Illustration (Visualizing "chín" / ripe fruit context) -->
  <g transform="translate(0, 5)">
    <!-- Back leaf -->
    <path d="M125 55 C135 45, 150 48, 155 60 C150 68, 135 68, 125 55 Z" fill="#2ECC71"/>
    
    <!-- Stem -->
    <path d="M117 65 C117 55, 122 48, 125 40" stroke="#795548" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Main Apple Body (Deep Ripe Red/Orange) -->
    <path d="M120 72 
             C155 72, 175 95, 175 130 
             C175 165, 145 190, 120 190 
             C95 190, 65 165, 65 130 
             C65 95, 85 72, 120 72 Z" 
          fill="url(#appleGradient)" />
          
    <!-- Apple Highlight / Glossy effect -->
    <path d="M95 90 C100 85, 110 82, 115 85 C108 92, 108 105, 95 110 C92 100, 93 94, 95 90 Z" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="appleGradient" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="40%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </radialGradient>
  </defs>
</svg>