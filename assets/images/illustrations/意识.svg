<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="realizationGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Cozy Office / Study Room at Night) -->
  <!-- Window showing night sky -->
  <rect x="25" y="20" width="60" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <line x1="55" y1="20" x2="55" y2="95" stroke="#475569" stroke-width="2"/>
  <line x1="25" y1="57" x2="85" y2="57" stroke="#475569" stroke-width="2"/>
  <!-- Stars outside -->
  <circle cx="35" cy="32" r="1" fill="#cbd5e1"/>
  <circle cx="70" cy="40" r="1.5" fill="#f8fafc"/>
  <circle cx="45" cy="75" r="1" fill="#94a3b8"/>
  
  <!-- Bookshelf / Background shelf with props -->
  <rect x="150" y="30" width="65" height="8" rx="2" fill="#334155"/>
  <rect x="160" y="15" width="10" height="15" rx="1" fill="#ec4899"/>
  <rect x="172" y="12" width="12" height="18" rx="1" fill="#38bdf8"/>
  <rect x="187" y="17" width="8" height="13" rx="1" fill="#10b981"/>

  <!-- Desk Lamp -->
  <path d="M190,135 L200,105 L215,105 L225,135 Z" fill="#fbbf24"/>
  <path d="M207,105 L207,155" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M195,155 L219,155" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="207" cy="120" r="30" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Office Desk Surface -->
  <rect x="15" y="155" width="210" height="12" rx="3" fill="url(#deskGrad)"/>
  <rect x="25" y="167" width="10" height="50" rx="2" fill="#334155"/>
  <rect x="205" y="167" width="10" height="50" rx="2" fill="#334155"/>

  <!-- Work Props on Desk (Documents, Crumpled Paper, Pen Holder) -->
  <!-- Crumpled paper balls (representing mistakes/redos) -->
  <circle cx="65" cy="148" r="6" fill="#cbd5e1"/>
  <path d="M62,146 Q65,143 68,147 Q70,150 66,152 Z" fill="#94a3b8"/>
  <circle cx="80" cy="151" r="5" fill="#e2e8f0"/>
  
  <!-- Open Document / Project with Red Corrections -->
  <g transform="translate(95, 130) rotate(-5)">
    <rect x="0" y="0" width="45" height="30" rx="2" fill="#f8fafc"/>
    <line x1="6" y1="7" x2="25" y2="7" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="13" x2="35" y2="13" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="19" x2="20" y2="19" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Big red error marks / crosses -->
    <path d="M28,18 L38,26 M38,18 L28,26" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Main Character (Realization Moment) -->
  <g id="character">
    <!-- Body & Chair -->
    <path d="M100,165 L140,165 L145,210 L95,210 Z" fill="#334155"/>
    <rect x="110" y="110" width="25" height="55" rx="8" fill="#3b82f6"/> <!-- Shirt -->

    <!-- Head & Hair -->
    <path d="M110,85 C110,70 130,70 130,85 C130,90 128,95 125,98 L125,110 L115,110 L115,98 C112,95 110,90 110,85 Z" fill="#fcd34d"/> <!-- Neck/Face base -->
    <circle cx="120" cy="83" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M104,80 C104,65 136,65 136,80 C136,83 134,84 132,83 C125,72 115,75 108,83 C106,84 104,83 104,80 Z" fill="#1e293b"/>

    <!-- Expressive Poses & Hands (Hand touching forehead in realization) -->
    <!-- Back arm resting -->
    <path d="M110,115 L95,140 L105,145" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front arm & hand gesturing realization to the head -->
    <path d="M130,115 C140,120 142,95 132,90" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand on forehead -->
    <circle cx="130" cy="87" r="5" fill="#fcd34d"/>

    <!-- Facial Expression: Eyes wide in realization, slight open mouth -->
    <!-- Eyebrows raised -->
    <path d="M112,77 Q117,73 122,77" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M125,77 Q130,73 135,77" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Wide open eyes -->
    <circle cx="116" cy="83" r="2.5" fill="#1e293b"/>
    <circle cx="130" cy="83" r="2.5" fill="#1e293b"/>
    <!-- Mouth surprised/realizing -->
    <ellipse cx="123" cy="92" rx="3" ry="2" fill="#b91c1c"/>
  </g>

  <!-- Visual Metaphor for "Realization" / "Aha! Moment" (Glowing Insight Lightbulb & Sparkles near head) -->
  <g transform="translate(120, 38)">
    <circle cx="0" cy="0" r="22" fill="url(#realizationGlow)" style="mix-blend-mode: screen;"/>
    <!-- Lightbulb Icon -->
    <path d="M-5,10 L5,10 L4,2 L-4,2 Z" fill="#94a3b8"/>
    <path d="M-7,-3 C-7,-10 7,-10 7,-3 C7,2 4,5 3,7 L-3,7 C-4,5 -7,2 -7,-3 Z" fill="#fbbf24"/>
    <!-- Sparkles / Insight Rays -->
    <path d="M0,-16 L0,-21" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M12,-11 L16,-15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M-12,-11 L-16,-15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M15,0 L20,0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M-15,0 L-20,0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Additional Atmospheric Lighting Highlights -->
  <path d="M0,0 L240,0 L240,240 L0,240 Z" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.2"/>
</svg>