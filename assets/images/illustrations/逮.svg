<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines for dynamic action -->
  <path d="M120 120 L160 80 M125 115 L165 75 M130 110 L170 70" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
  
  <!-- The "Capturer" (Police/Authority figure) -->
  <g transform="translate(60, 100)">
    <path d="M20 100 L20 60 L40 60 L40 100" fill="#4D8CFF"/>
    <circle cx="30" cy="50" r="15" fill="#E0E0E0"/>
    <path d="M30 65 L30 90" stroke="#4D8CFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 70 L50 90" stroke="#4D8CFF" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The "Captured" (Suspect) -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="12" fill="#FF6B6B"/>
    <path d="M20 32 L20 60" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 40 L5 60" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 40 L35 60" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- The "Catching" Hand -->
  <path d="M85 110 C95 90 110 80 130 85 C140 88 145 95 140 100" stroke="#FFB84D" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M135 95 L145 85" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
</svg>