<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Layer -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)" />

  <!-- Environment / Background Elements -->
  <!-- Bookshelf in background -->
  <g fill="#334155" opacity="0.6">
    <rect x="25" y="45" width="45" height="110" rx="4" />
    <rect x="30" y="60" width="35" height="6" rx="2" fill="#475569" />
    <rect x="30" y="85" width="35" height="6" rx="2" fill="#475569" />
    <rect x="30" y="115" width="35" height="6" rx="2" fill="#475569" />
    <!-- Books -->
    <path d="M35 60h6v20h-6z" fill="#f59e0b" />
    <path d="M43 60h8v20h-8z" fill="#38bdf8" />
    <path d="M35 85h10v22h-10z" fill="#10b981" />
  </g>

  <!-- Wooden Table & Mirror Frame -->
  <rect x="20" y="170" width="200" height="55" rx="8" fill="#334155" />
  <rect x="25" y="175" width="190" height="6" rx="2" fill="#475569" />

  <!-- Vanity Mirror -->
  <circle cx="120" cy="115" r="52" fill="#0f172a" stroke="#475569" stroke-width="4" />
  <circle cx="120" cy="115" r="48" fill="#1e293b" opacity="0.8" />
  <!-- Mirror Reflection highlights -->
  <path d="M92 95a35 35 0 0 1 50-5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Props on Desk -->
  <rect x="145" y="155" width="25" height="15" rx="3" fill="#cbd5e1" /> <!-- Jewelry Box -->
  <circle cx="85" cy="160" r="8" fill="#f59e0b" /> <!-- Perfume bottle cap -->
  <path d="M80 168h10v7h-10z" fill="#f8fafc" opacity="0.8" />

  <!-- Main Character (Older Gentleman) -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Coat -->
    <path d="M 75 190 C 75 160 95 150 120 150 C 145 150 165 160 165 190 Z" fill="#0284c7" />
    <!-- Collar & Shirt -->
    <path d="M 105 150 L 120 170 L 135 150 Z" fill="#f8fafc" />
    <path d="M 112 150 L 120 162 L 128 150 Z" fill="#cbd5e1" />

    <!-- Neck -->
    <rect x="110" y="130" width="20" height="30" rx="8" fill="#fbcfe8" opacity="0.9" />

    <!-- Head Base -->
    <circle cx="120" cy="115" r="28" fill="#fbcfe8" />

    <!-- Warm Facial Expression (Gentle Smile, Eyes Closed in reflection/contentment) -->
    <path d="M 108 115 Q 112 110 116 115" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 124 115 Q 128 110 132 115" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Gentle Smile -->
    <path d="M 114 127 Q 120 133 126 127" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Warm Blush) -->
    <circle cx="104" cy="122" r="5" fill="#f43f5e" opacity="0.3" />
    <circle cx="136" cy="122" r="5" fill="#f43f5e" opacity="0.3" />

    <!-- Target Focus: "Hua Bai" (Salt and Pepper Hair) -->
    <!-- Base dark hair shape -->
    <path d="M 93 115 C 92 90 102 82 120 82 C 138 82 148 90 147 115 C 147 115 142 98 120 98 C 98 98 93 115 93 115 Z" fill="#334155" />
    
    <!-- Salt & Pepper textured locks / highlights (花白 - Grey and white mixed strands) -->
    <path d="M 96 110 C 98 96 106 88 120 88 C 134 88 142 96 144 110" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 100 102 C 105 92 112 90 120 90 C 128 90 135 92 140 102" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 103 96 C 108 90 115 88 120 88 C 125 88 132 90 137 96" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Sideburns with grey mix -->
    <path d="M 94 110 C 93 118 96 124 99 126" stroke="#f1f5f9" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 146 110 C 147 118 144 124 141 126" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none" />
    
    <!-- Top crown frosted white highlights -->
    <path d="M 112 87 Q 120 84 128 87" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 106 92 Q 120 89 134 92" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Foreground Atmospheric Elements (Warm Cozy Light Beams) -->
  <path d="M 0 0 L 90 0 L 140 240 L 0 240 Z" fill="#ffffff" opacity="0.03" />
</svg>