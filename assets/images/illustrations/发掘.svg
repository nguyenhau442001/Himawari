<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Ancient Tomb Wall Gradient -->
    <linearGradient id="tombGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Artifact Glow -->
    <radialGradient id="artifactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Flashlight Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Underground Cave / Tomb Environment -->
  <!-- Cave Ceiling/Walls -->
  <path d="M0,0 L240,0 L240,190 C200,180 180,210 140,190 C100,170 80,200 40,185 L0,200 Z" fill="url(#tombGrad)"/>
  
  <!-- Ancient Stone Bricks & Hieroglyphics Details on Wall -->
  <g fill="#475569" opacity="0.6">
    <!-- Stone blocks -->
    <path d="M20,30 L60,30 L55,50 L15,50 Z" />
    <path d="M65,25 L110,25 L105,45 L60,45 Z" />
    <path d="M120,35 L170,35 L165,55 L115,55 Z" />
    <path d="M175,25 L220,25 L225,48 L170,48 Z" />
    <path d="M10,55 L50,55 L45,75 L15,75 Z" />
    <path d="M180,60 L230,60 L225,80 L175,80 Z" />
    
    <!-- Simple abstract ancient carvings -->
    <circle cx="35" cy="40" r="3" fill="#cbd5e1" opacity="0.4"/>
    <path d="M85,32 L95,32 M90,28 L90,36" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4"/>
    <path d="M140,42 L150,42 L145,48 Z" fill="#cbd5e1" opacity="0.4"/>
  </g>

  <!-- Dirt Mound / Excavation Site -->
  <path d="M0,240 L0,180 C40,170 70,210 120,195 C170,180 200,210 240,185 L240,240 Z" fill="#33271d"/>
  <path d="M30,240 C50,190 90,185 130,200 C170,215 200,190 220,240 Z" fill="#453527"/>

  <!-- Unearthed Ancient Pot / Artifact (Centerpiece of "Excavation") -->
  <g transform="translate(100, 160)">
    <!-- Golden Glow from artifact -->
    <circle cx="20" cy="20" r="35" fill="url(#artifactGlow)"/>
    
    <!-- Ancient Vase buried partially -->
    <ellipse cx="20" cy="25" rx="16" ry="6" fill="#78350f"/>
    <path d="M8,25 C6,10 12,5 20,5 C28,5 34,10 32,25 C35,35 30,42 20,42 C10,42 5,35 8,25 Z" fill="#d97706"/>
    <!-- Vase decorative band -->
    <path d="M11,18 C15,20 25,20 29,18" stroke="#b45309" stroke-width="3" fill="none"/>
    <path d="M10,24 C15,26 25,26 30,24" stroke="#b45309" stroke-width="2" fill="none"/>
    <!-- Highlight -->
    <path d="M14,12 C16,10 20,9 22,10" stroke="#fde68a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Archaeological Tools (Brush and Trowel on ground) -->
  <g transform="translate(45, 195)">
    <!-- Trowel -->
    <path d="M0,10 L15,5 L18,12 L5,18 Z" fill="#94a3b8"/>
    <path d="M15,8 L25,3" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <!-- Brush -->
    <rect x="35" y="10" width="12" height="4" rx="2" fill="#cbd5e1" transform="rotate(-30 35 10)"/>
    <path d="M45,15 L52,18 L48,22 Z" fill="#78350f" transform="rotate(-30 45 15)"/>
  </g>

  <!-- Archaeologist Character (Kneeling, actively brushing/excavating) -->
  <g transform="translate(130, 115)">
    <!-- Shadow beneath character -->
    <ellipse cx="20" cy="85" rx="30" ry="8" fill="#090d16" opacity="0.6"/>

    <!-- Body / Torso (Leaning forward) -->
    <path d="M10,45 C5,35 15,25 25,35 C35,45 40,65 35,75 L15,75 Z" fill="#0284c7"/> <!-- Explorer Vest/Shirt -->
    <path d="M12,42 L22,32 L32,45 L22,50 Z" fill="#e0f2fe"/> <!-- Collar / Shirt inside -->

    <!-- Head & Face (Focused expression) -->
    <g transform="translate(25, 12)">
      <!-- Hair & Hat (Safari hat) -->
      <path d="M-8,5 C-8,-5 18,-5 18,5 C25,6 30,8 28,10 C-10,10 -15,8 -8,5 Z" fill="#e2e8f0"/>
      <ellipse cx="5" cy="2" rx="12" ry="6" fill="#cbd5e1"/>
      
      <!-- Face profile/front-angled -->
      <circle cx="5" cy="12" r="9" fill="#fcd34d"/> <!-- Skin -->
      
      <!-- Focused Eyes (Looking down at artifact) -->
      <path d="M2,11 L6,11" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8,11 L12,11" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Smile / Concentration mouth -->
      <path d="M5,16 C7,17 9,16 10,15" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Arms & Excavation Brush Action -->
    <!-- Back arm -->
    <path d="M28,45 L38,55 L45,50" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Front arm holding brush near the artifact -->
    <path d="M15,42 C5,45 -2,55 -8,65" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Brush in hand pointing at the treasure -->
    <g transform="translate(-15, 62) rotate(-20)">
      <rect x="0" y="0" width="16" height="4" rx="2" fill="#94a3b8"/>
      <path d="M16,-1 L22,2 L16,5 Z" fill="#78350f"/> <!-- Bristles -->
      <!-- Motion dust particles -->
      <circle cx="-6" cy="-4" r="1.5" fill="#cbd5e1" opacity="0.8"/>
      <circle cx="-10" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </g>

    <!-- Legs (Kneeling posture) -->
    <!-- Pants -->
    <path d="M18,70 C15,80 5,85 -5,80 C-10,75 -5,70 5,72 Z" fill="#334155"/>
    <path d="M30,70 C35,82 45,85 52,78 C55,72 48,68 38,70 Z" fill="#334155"/>
    <!-- Boots -->
    <path d="M-12,78 C-18,78 -16,88 -8,88 C-2,88 2,86 -4,80 Z" fill="#78350f"/>
    <path d="M50,76 C58,76 60,86 52,86 C46,86 42,84 48,78 Z" fill="#78350f"/>
  </g>

  <!-- Hanging Cave Stalactites & Atmospheric Lighting -->
  <path d="M0,0 L30,0 L20,35 L0,20 Z" fill="#334155" opacity="0.7"/>
  <path d="M90,0 L130,0 L115,45 L100,25 Z" fill="#334155" opacity="0.5"/>
  <path d="M210,0 L240,0 L240,30 L220,15 Z" fill="#334155" opacity="0.6"/>

  <!-- Ambient glowing particles / dust motes in the cave -->
  <circle cx="80" cy="100" r="1.5" fill="#fde68a" opacity="0.6"/>
  <circle cx="110" cy="80" r="2" fill="#fde68a" opacity="0.8"/>
  <circle cx="65" cy="140" r="1" fill="#fde68a" opacity="0.5"/>
  <circle cx="150" cy="110" r="1.5" fill="#fde68a" opacity="0.4"/>
  <circle cx="130" cy="150" r="2.5" fill="#fde68a" opacity="0.7"/>

  <!-- Lantern / Light Source illuminating the scene -->
  <g transform="translate(190, 40)">
    <circle cx="0" cy="0" r="22" fill="#fbbf24" opacity="0.2"/>
    <circle cx="0" cy="0" r="12" fill="#fbbf24" opacity="0.4"/>
    <rect x="-6" y="-8" width="12" height="16" rx="3" fill="#f59e0b"/>
    <path d="M-8,-8 L8,-8 L6,-12 L-6,-12 Z" fill="#334155"/>
    <path d="M0,-12 L0,-18" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Light Beam shining down toward the excavation -->
    <path d="M-6,10 L-50,140 L20,140 Z" fill="url(#lightBeam)" opacity="0.6"/>
  </g>
</svg>