<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Military Research Lab Setting -->
  <path d="M20 180 L220 180 L200 240 L40 240 Z" fill="#334155"/>
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- The Missile -->
  <g transform="translate(120, 120) rotate(-20)">
    <rect x="-10" y="-60" width="20" height="120" rx="4" fill="#94a3b8"/>
    <path d="M-10 -60 L0 -80 L10 -60 Z" fill="#fb923c"/>
    <rect x="-15" y="40" width="30" height="15" rx="2" fill="#38bdf8"/>
    <rect x="-5" y="55" width="10" height="10" fill="#38bdf8"/>
  </g>
  
  <!-- Scientist Character -->
  <g transform="translate(60, 140)">
    <circle cx="0" cy="-30" r="15" fill="#fde68a"/>
    <path d="M-15 -30 L15 -30 L10 0 L-10 0 Z" fill="#ec4899"/>
    <rect x="-12" y="0" width="24" height="60" rx="4" fill="#ec4899"/>
    <path d="M-20 10 L-30 40 M20 10 L30 40" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Holographic Display/Data -->
  <rect x="140" y="40" width="60" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="150" y1="55" x2="180" y2="55" stroke="#38bdf8" stroke-width="2"/>
  <line x1="150" y1="65" x2="170" y2="65" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="185" cy="60" r="3" fill="#fb923c"/>
  
  <!-- Ambient Details -->
