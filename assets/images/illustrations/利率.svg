<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bank Counter Desk -->
  <path d="M20 180h200v30c0 5.5-4.5 10-10 10H30c-5.5 0-10-4.5-10-10v-30z" fill="#334155"/>
  <rect x="20" y="170" width="200" height="10" fill="#475569"/>
  
  <!-- Bank Clerk -->
  <circle cx="180" cy="140" r="25" fill="#fde68a"/>
  <path d="M165 160h30v40h-30z" fill="#3b82f6"/>
  
  <!-- Customer -->
  <circle cx="60" cy="140" r="25" fill="#fde68a"/>
  <path d="M45 160h30v40h-30z" fill="#ec4899"/>
  
  <!-- Graph/Chart Display -->
  <rect x="90" y="60" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M100 120 L120 100 L140 125" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140" cy="125" r="3" fill="#ef4444"/>
  
  <!-- Decorative Elements -->
  <path d="M110 70h20M110 80h10" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Downward Arrow Indicator -->
  <path d="M120 135 l-8 -8 m8 8 l8 -8 m-8 8 v-15" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ambient Lighting -->
  <circle cx="120" cy="120" r="100" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>