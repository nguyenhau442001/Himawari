<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Medical Light Beam -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Warm Amber Glow for 'Important' Focus -->
    <radialGradient id="focusGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background elements / clinic interior -->
  <path d="M0 170 H240 V240 H0 Z" fill="#090d16" opacity="0.6"/>
  <!-- Window/Light panel in background -->
  <rect x="25" y="30" width="60" height="70" rx="4" fill="#334155" opacity="0.3"/>
  <rect x="30" y="35" width="50" height="60" rx="2" fill="#1e293b" opacity="0.5"/>

  <!-- Diagnostic Light Beam from above -->
  <polygon points="120,0 70,165 170,165" fill="url(#lightBeam)"/>

  <!-- Glow behind the monitor/scans emphasizing importance -->
  <circle cx="120" cy="120" r="70" fill="url(#focusGlow)"/>

  <!-- Doctor Character (partial view on the right) -->
  <g id="doctor">
    <!-- Body / White Coat -->
    <path d="M170 195 C170 170 185 160 210 165 V240 H170 Z" fill="#f8fafc"/>
    <path d="M190 165 L190 240" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Head -->
    <circle cx="190" cy="140" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M176 138 C176 128 184 124 196 126 C204 127 206 135 204 142 Z" fill="#334155"/>
  </g>

  <!-- Patient Character (seated on the left, looking at scans) -->
  <g id="patient">
    <!-- Chair back -->
    <path d="M45 110 C45 95 65 95 65 110 V210 H45 Z" fill="#475569" rx="4"/>
    <!-- Patient Body -->
    <path d="M40 165 C40 145 60 140 85 155 V240 H40 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="75" cy="135" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M62 133 C62 122 72 120 85 125 C90 127 88 138 80 138 Z" fill="#475569"/>
    <!-- Arm pointing/observing -->
    <path d="M80 160 C90 160 100 170 105 180" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Medical Desk / Console in center -->
  <rect x="80" y="165" width="80" height="75" rx="4" fill="#334155"/>
  <rect x="85" y="170" width="70" height="40" rx="2" fill="#0f172a"/>

  <!-- Diagnostic Monitor displaying early detection scan -->
  <g id="monitor" transform="translate(90, 75)">
    <!-- Monitor Stand -->
    <rect x="25" y="80" width="10" height="15" fill="#475569"/>
    <path d="M10 95 H40 V98 H10 Z" fill="#64748b" rx="1"/>
    <!-- Screen Frame -->
    <rect x="-5" y="-5" width="70" height="88" rx="6" fill="#1e293b"/>
    <rect x="0" y="0" width="60" height="78" rx="4" fill="url(#screenGlow)"/>
    
    <!-- Scan Graphic (Visualizing 'Early Stage' / Cell cluster with glowing highlight) -->
    <circle cx="30" cy="39" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Early detection marker: Green/Amber glowing spot indicating early discovery -->
    <circle cx="24" cy="32" r="6" fill="#10b981" opacity="0.9"/>
    <circle cx="24" cy="32" r="10" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.8"/>
    <!-- Wavy anatomical scan lines inside screen -->
    <path d="M10 20 Q20 10 30 25 T50 20" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M10 60 Q25 70 40 55 T55 60" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- Floating "Important / Breakthrough" Visual Element (Golden star/sparkle representing the crucial value of early detection) -->
  <g transform="translate(145, 55)" filter="drop-shadow(0px 0px 6px rgba(245, 158, 11, 0.6))">
    <path d="M12 0 L15 9 L24 12 L15 15 L12 24 L9 15 L0 12 L9 9 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(75, 45) scale(0.6)" opacity="0.8">
    <path d="M12 0 L15 9 L24 12 L15 15 L12 24 L9 15 L0 12 L9 9 Z" fill="#f59e0b"/>
  </g>

  <!-- Foreground table edge with medical instruments/clipboard -->
  <path d="M70 230 H170 V240 H70 Z" fill="#1e293b"/>
  <!-- Clipboard prop -->
  <rect x="100" y="215" width="20" height="25" rx="2" fill="#f8fafc" transform="rotate(-15 100 215)"/>
  <path d="M105 212 H115 V216 H105 Z" fill="#94a3b8" transform="rotate(-15 100 215)"/>
  
  <!-- Subtle light accent rim on top of canvas -->
  <rect x="0" y="0" width="240" height="2" fill="#38bdf8" opacity="0.4"/>
</svg>