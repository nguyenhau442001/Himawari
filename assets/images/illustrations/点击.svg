<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle UI surface representation -->
  <rect x="50" y="50" width="140" height="140" rx="16" fill="#222733" stroke="#2F3646" stroke-width="2"/>
  
  <!-- UI button being clicked -->
  <rect x="75" y="90" width="90" height="44" rx="8" fill="#F39C12"/>
  <rect x="79" y="94" width="82" height="18" rx="4" fill="#F5B041" opacity="0.4"/>
  
  <!-- Ripple/Click effect waves -->
  <circle cx="120" cy="112" r="30" fill="none" stroke="#F39C12" stroke-width="2" opacity="0.6"/>
  <circle cx="120" cy="112" r="45" fill="none" stroke="#F39C12" stroke-width="1.5" opacity="0.3"/>

  <!-- Computer Mouse / Cursor icon emphasizing the click action -->
  <g transform="translate(110, 85) rotate(-15)">
    <!-- Mouse body shadow -->
    <path d="M14 2C7.37 2 2 7.37 2 14v28c0 6.63 5.37 12 12 12h12c6.63 0 12-5.37 12-12V14c0-6.63-5.37-12-12-12H14z" fill="#0F1117" opacity="0.3" transform="translate(2, 4)"/>
    
    <!-- Mouse body -->
    <path d="M14 2C7.37 2 2 7.37 2 14v28c0 6.63 5.37 12 12 12h12c6.63 0 12-5.37 12-12V14c0-6.63-5.37-12-12-12H14z" fill="#ECF0F1"/>
    
    <!-- Left click button (pressed / highlighted state) -->
    <path d="M14 2h6c6.63 0 12 5.37 12 12v12H14V2z" fill="#BDC3C7"/>
    <line x1="14" y1="2" x2="14" y2="26" stroke="#95A5A6" stroke-width="1.5"/>
    <line x1="14" y1="14" x2="32" y2="14" stroke="#95A5A6" stroke-width="1.5"/>
    
    <!-- Click contact point (spark/indicator) -->
    <circle cx="14" cy="14" r="3" fill="#E74C3C"/>
  </g>
</svg>