<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle Factory Floor Background Elements -->
  <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <rect x="50" y="110" width="40" height="70" fill="#222733" rx="4"/>
  <rect x="150" y="90" width="45" height="90" fill="#222733" rx="4"/>
  <circle cx="70" cy="130" r="8" fill="#2D3446"/>
  <circle cx="172" cy="120" r="12" fill="#2D3446"/>

  <!-- High-Tech Smart Conveyor Belt System -->
  <!-- Conveyor Base -->
  <rect x="40" y="165" width="160" height="12" rx="6" fill="#2A3142"/>
  <circle cx="55" cy="171" r="5" fill="#4B5563"/>
  <circle cx="95" cy="171" r="5" fill="#4B5563"/>
  <circle cx="135" cy="171" r="5" fill="#4B5563"/>
  <circle cx="175" cy="171" r="5" fill="#4B5563"/>

  <!-- Product 1 (Standard Box - Passing Quality Check) -->
  <g transform="translate(60, 125)">
    <!-- Box Body -->
    <rect x="0" y="15" width="30" height="25" rx="3" fill="#3B82F6"/>
    <!-- Box Lid/Highlight -->
    <path d="M0 18 L15 10 L30 18 L30 22 L15 14 L0 22 Z" fill="#60A5FA"/>
  </g>

  <!-- High-Tech Inspection Scanner Arches -->
  <path d="M100 170 L100 85 C100 70, 140 70, 140 85 L140 170" fill="none" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <!-- Scanner Beam & Core Element -->
  <rect x="106" y="75" width="28" height="6" rx="3" fill="#00E5FF"/>
  <path d="M120 81 L120 165" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="120" cy="78" r="3" fill="#FFFFFF"/>

  <!-- Flagship Premium Certified Product (Output Ratio Representation) -->
  <g transform="translate(145, 115)">
    <!-- Glow Effect for Success Rate -->
    <circle cx="15" cy="20" r="22" fill="#F59E0B" opacity="0.15"/>
    <!-- Perfect Quality Cuboid -->
    <rect x="0" y="10" width="30" height="30" rx="4" fill="#F59E0B"/>
    <!-- Front Face Gradient overlay -->
    <rect x="0" y="10" width="30" height="30" rx="4" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Top Face -->
    <path d="M0 14 L15 4 L30 14 L15 24 Z" fill="#FBBF24"/>
    
    <!-- Holographic Checkmark Badge on Product -->
    <circle cx="15" cy="25" r="7" fill="#1A1D24"/>
    <path d="M11 25 L14 28 L19 21" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Holographic Analytics/Percentage Indicator (Visualizing "Rate/Ratio") -->
  <g transform="translate(155, 45)">
    <rect x="-10" y="0" width="50" height="24" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <!-- Indicator Target Dots -->
    <circle cx="4" cy="12" r="3" fill="#10B981"/>
    <!-- Simulated Rate Symbol/Graph -->
    <path d="M14 16 L20 10 L24 13 L32 7" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="28,7 32,7 32,11" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
</svg>