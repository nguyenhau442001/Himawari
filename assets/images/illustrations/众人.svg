<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background glow representing gathering/crowd focus -->
  <ellipse cx="120" cy="140" rx="90" ry="45" fill="#232733"/>

  <!-- Background Layer of Crowd (Silhouettes/Lower contrast) -->
  <g fill="#323846">
    <!-- Person Left Outer -->
    <circle cx="55" cy="120" r="14"/>
    <path d="M 37 155 C 37 138 45 135 55 135 C 65 135 73 138 73 155 Z"/>
    
    <!-- Person Right Outer -->
    <circle cx="185" cy="120" r="14"/>
    <path d="M 167 155 C 167 138 175 135 185 135 C 195 135 203 138 203 155 Z"/>

    <!-- Person Inner Left -->
    <circle cx="82" cy="110" r="15"/>
    <path d="M 62 150 C 62 132 71 128 82 128 C 93 128 102 132 102 150 Z"/>

    <!-- Person Inner Right -->
    <circle cx="158" cy="110" r="15"/>
    <path d="M 138 150 C 138 132 147 128 158 128 C 169 128 178 132 178 150 Z"/>
  </g>

  <!-- Foreground Layer of Crowd (Main Focal Characters) -->
  <g fill="#434C5E">
    <!-- Left Mid Person -->
    <circle cx="100" cy="100" r="16"/>
    <path d="M 78 145 C 78 125 88 120 100 120 C 112 120 122 125 122 145 Z"/>

    <!-- Right Mid Person -->
    <circle cx="140" cy="100" r="16"/>
    <path d="M 118 145 C 118 125 128 120 140 120 C 152 120 162 125 162 145 Z"/>
  </g>

  <!-- Central Focal Group (Front Row / Diverse crowd elements) -->
  <!-- Left prominent figure -->
  <circle cx="72" cy="92" r="18" fill="#525E75"/>
  <path d="M 48 140 C 48 116 58 110 72 110 C 86 110 96 116 96 140 Z" fill="#525E75"/>

  <!-- Right prominent figure -->
  <circle cx="168" cy="92" r="18" fill="#525E75"/>
  <path d="M 144 140 C 144 116 154 110 168 110 C 182 110 192 116 192 140 Z" fill="#525E75"/>

  <!-- Very Center Prominent Foreground Figures -->
  <circle cx="108" cy="85" r="19" fill="#E5C158"/>
  <path d="M 83 135 C 83 108 94 102 108 102 C 122 102 133 108 133 135 Z" fill="#E5C158"/>

  <circle cx="132" cy="85" r="19" fill="#E59833"/>
  <path d="M 107 135 C 107 108 118 102 132 102 C 146 102 157 108 157 135 Z" fill="#E59833"/>

  <!-- Base Crowd Floor / Body Mass for Solid Silhouette feel -->
  <path d="M 25 170 C 25 150 45 145 120 145 C 195 145 215 150 215 170 L 225 205 C 225 210 220 215 215 215 L 25 215 C 20 215 15 210 15 205 Z" fill="#2E3440"/>
  
  <!-- Overlay brighter shoulders in front -->
  <path d="M 50 165 C 50 150 70 145 120 145 C 170 145 190 150 190 165 L 200 200 C 200 205 195 210 190 210 L 50 210 C 45 210 40 205 40 200 Z" fill="#3B4252"/>

  <!-- Central Highlight / Focus Lines converging or glowing softly above to emphasize "众" (crowd/multitude) -->
  <circle cx="120" cy="55" r="4" fill="#E5C158"/>
  <circle cx="95" cy="62" r="3" fill="#E5C158" opacity="0.7"/>
  <circle cx="145" cy="62" r="3" fill="#E5C158" opacity="0.7"/>
  <circle cx="75" cy="75" r="2.5" fill="#E5C158" opacity="0.5"/>
  <circle cx="165" cy="75" r="2.5" fill="#E5C158" opacity="0.5"/>
</svg>