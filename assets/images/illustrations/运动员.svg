<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative water/motion effect elements -->
  <path d="M40 180 Q80 170 120 180 T200 180" stroke="#2563EB" stroke-width="3" stroke-opacity="0.3" fill="none" stroke-linecap="round"/>
  <path d="M50 195 Q90 185 130 195 T210 195" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.2" fill="none" stroke-linecap="round"/>
  <path d="M30 165 Q70 155 110 165 T190 165" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.2" fill="none" stroke-linecap="round"/>

  <!-- Swimming Athlete Illustration -->
  <g transform="translate(0, 5)">
    <!-- Water surface / lane line accents -->
    <line x1="30" y1="145" x2="210" y2="145" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Motion waves / splashes -->
    <path d="M145 135 C155 130 165 140 175 135" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M70 125 C75 120 82 127 88 123" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Splash droplets -->
    <circle cx="168" cy="122" r="2" fill="#38BDF8"/>
    <circle cx="178" cy="128" r="1.5" fill="#38BDF8"/>
    <circle cx="78" cy="114" r="1.5" fill="#38BDF8"/>

    <!-- Swimmer Body (Freestyle stroke, dynamic arm extended forward) -->
    <!-- Back Arm (underwater/pulling or in recovery) -->
    <path d="M120 105 Q140 90 155 115" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Torso and Hips (angled for streamline freestyle position) -->
    <path d="M85 115 L140 120" stroke="#F97316" stroke-width="16" stroke-linecap="round"/>

    <!-- Swim Cap -->
    <path d="M72 103 C70 93 82 90 89 98 Z" fill="#F59E0B"/>

    <!-- Head & Face (profile looking slightly forward/down into water) -->
    <circle cx="78" cy="100" r="8" fill="#FDBA74"/>
    
    <!-- Goggles -->
    <path d="M76 98 L82 99" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Front Arm (reaching forward with energy) -->
    <path d="M85 105 Q115 100 135 112" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="137" cy="113" r="4.5" fill="#FDBA74"/>

    <!-- Legs & Feet (dynamic flutter kick) -->
    <path d="M140 120 Q165 135 185 125" stroke="#F97316" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M180 125 Q195 132 205 124" stroke="#FDBA74" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Modern UI Focus Accent / Focal highlight ring (subtle) -->
  <circle cx="120" cy="115" r="85" stroke="#F97316" stroke-opacity="0.15" stroke-width="1.5" fill="none" stroke-dasharray="10 6"/>

</svg>