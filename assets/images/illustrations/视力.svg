<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Outer Glow / Focal Aura behind the eye -->
  <circle cx="120" cy="115" r="54" fill="#F59E0B" opacity="0.12"/>
  <circle cx="120" cy="115" r="44" fill="#F59E0B" opacity="0.08"/>

  <!-- Stylized Modern Eye (Noun representation for "shìlì" / eyesight) -->
  <path d="M52 115 C72 82 96 72 120 72 C144 72 168 82 188 115 C168 148 144 158 120 158 C96 158 72 148 52 115 Z" fill="#252A34" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Sclera light sheen -->
  <path d="M60 115 C76 90 98 80 120 80 C132 80 144 83 155 89 C138 82 112 84 92 98 C77 108 65 115 60 115 Z" fill="#FFFFFF" opacity="0.06"/>

  <!-- Iris -->
  <circle cx="120" cy="115" r="26" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="120" cy="115" r="18" fill="#F59E0B" opacity="0.85"/>

  <!-- Pupil -->
  <circle cx="120" cy="115" r="9" fill="#1A1D24"/>
  
  <!-- Pupil Highlight (Gloss) -->
  <circle cx="117" cy="112" r="3" fill="#FFFFFF" opacity="0.9"/>

  <!-- Eyelashes / Upper Lid Detail -->
  <path d="M52 115 C72 82 96 72 120 72 C144 72 168 82 188 115" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="95" y1="74" x2="92" y2="65" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="71" x2="120" y2="61" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="145" y1="74" x2="148" y2="65" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Vision / Sight Focus Markers (Target Reticle) -->
  <path d="M96 48 L96 42 L102 42" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M144 48 L144 42 L138 42" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 182 L96 188 L102 188" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M144 182 L144 188 L138 188" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Focus / Vision Rays -->
  <line x1="120" y1="38" x2="120" y2="48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="120" y1="182" x2="120" y2="192" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="38" y1="115" x2="48" y2="115" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="192" y1="115" x2="202" y2="115" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

</svg>