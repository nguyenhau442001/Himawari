<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Fabric and Tailoring Action Visuals -->
  <g transform="translate(0, 0)">
    <!-- Background workbench surface hint -->
    <path d="M 40,180 L 200,180" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>

    <!-- Vibrant fabric being cut (Representing 裁 - cutting/tailoring) -->
    <!-- Fabric body draped -->
    <path d="M 60,150 C 90,130 110,170 140,150 C 170,130 190,160 210,140 L 210,180 L 60,180 Z" fill="#E67E22" opacity="0.2"/>
    
    <!-- Main cut fabric piece -->
    <path d="M 65,145 Q 100,115 135,135 T 205,125 L 200,175 L 65,175 Z" fill="#E67E22"/>
    <path d="M 65,145 Q 100,115 135,135 T 205,125" stroke="#F39C12" stroke-width="2" fill="none"/>

    <!-- Dotted cutting motion path / guideline -->
    <path d="M 135,135 Q 150,90 170,75" stroke="#3A4256" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

    <!-- Tailor's Hand holding Scissors -->
    <!-- Arm/Sleeve -->
    <path d="M 130,50 L 175,95 L 155,115 L 115,75 Z" fill="#3498DB"/>
    <!-- Hand -->
    <circle cx="145" cy="85" r="14" fill="#FAD7A0"/>

    <!-- Large Tailor Scissors (Dynamic Action) -->
    <!-- Pivot screw -->
    <circle cx="138" cy="88" r="3" fill="#BDC3C7"/>
    
    <!-- Scissor blades cutting down to fabric -->
    <!-- Top blade (moving) -->
    <path d="M 138,88 L 180,60 L 185,63 L 140,93 Z" fill="#E0E6ED"/>
    <path d="M 180,60 L 138,88" stroke="#95A5A6" stroke-width="1.5"/>
    
    <!-- Bottom blade (stationary aligned with cut) -->
    <path d="M 138,88 L 135,135 L 132,135 L 136,85 Z" fill="#BDC3C7"/>

    <!-- Scissor Handles (Gold/Orange accent) -->
    <!-- Handle loop 1 (Thumb) -->
    <ellipse cx="125" cy="78" rx="8" ry="12" transform="rotate(-30 125 78)" fill="none" stroke="#F1C40F" stroke-width="4"/>
    <!-- Handle loop 2 (Fingers) -->
    <ellipse cx="132" cy="102" rx="10" ry="14" transform="rotate(20 132 102)" fill="none" stroke="#F1C40F" stroke-width="4"/>

    <!-- Action motion lines indicating precise cutting motion -->
    <path d="M 165,70 L 155,77" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 172,80 L 162,87" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Precision cut line markers / sparks representing exact skill (老师傅熟练手艺) -->
    <circle cx="135" cy="135" r="4" fill="#F1C40F"/>
    <circle cx="135" cy="135" r="8" stroke="#F1C40F" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
</svg>