<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Background Elements -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  <path d="M40 140 L40 80 L200 80 L200 140" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- New Equipment 1: 3D Printer/Tech Box -->
  <rect x="40" y="150" width="40" height="40" rx="4" fill="#38bdf8"/>
  <rect x="45" y="155" width="30" height="30" rx="2" fill="#0f172a" fill-opacity="0.3"/>
  <circle cx="60" cy="170" r="8" fill="#fbbf24"/>
  
  <!-- New Equipment 2: Server/Tower -->
  <rect x="100" y="130" width="30" height="60" rx="4" fill="#10b981"/>
  <rect x="105" y="135" width="20" height="10" rx="2" fill="#0f172a" fill-opacity="0.3"/>
  <rect x="105" y="150" width="20" height="10" rx="2" fill="#0f172a" fill-opacity="0.3"/>
  
  <!-- New Equipment 3: Monitor/Device -->
  <rect x="150" y="145" width="50" height="35" rx="4" fill="#ec4899"/>
  <rect x="155" y="150" width="40" height="25" rx="2" fill="#0f172a" fill-opacity="0.3"/>
  
  <!-- Character: Employee pointing at new equipment -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-20 80 Q-20 40 0 40 T20 80" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="15" fill="#fde68a"/>
    <!-- Arm -->
    <path d="M15 50 L40 30" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="45" cy="25" r="5" fill="#fde68a"/>
  </g>
  
  <!-- Decorative Growth/Expansion Arrows -->
  <path d="M200 40 L220 20 L220 60 Z" fill="#fbbf24"/>
  <path d="M210 30 L210 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 40 L220 40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
</svg>