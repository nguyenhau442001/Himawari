<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Hands/Warmth -->
    <radialGradient id="warmth-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Room Context -->
  <!-- Window showing winter night / blue cold outside -->
  <path d="M165 35 H205 V110 H165 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M167 37 H203 V108 H167 Z" fill="url(#window-light)"/>
  <!-- Window frame cross -->
  <path d="M185 37 V108 M167 72 H203" stroke="#334155" stroke-width="2"/>
  
  <!-- Snowflakes outside window -->
  <circle cx="175" cy="50" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="195" cy="65" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="180" cy="90" r="1.5" fill="#94a3b8" opacity="0.6"/>

  <!-- Room Interior Details: Bookshelf / Plant in background -->
  <rect x="25" y="60" width="30" height="60" rx="4" fill="#334155" opacity="0.4"/>
  <rect x="30" y="75" width="20" height="4" fill="#475569"/>
  <rect x="30" y="95" width="20" height="4" fill="#475569"/>
  
  <!-- Warm indoor hanging light -->
  <path d="M120 0 V30" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="30" r="8" fill="#f59e0b" opacity="0.3"/>

  <!-- Character Torso & Shoulders (Bundled up in winter clothes) -->
  <!-- Winter coat collar -->
  <path d="M85 180 C85 155 100 145 120 145 C140 145 155 155 155 180 V210 H85 Z" fill="#3b82f6"/>
  <!-- Scarf wrapped around neck -->
  <path d="M95 140 C105 130 135 130 145 140 C150 145 145 160 135 165 C125 170 115 170 105 165 C95 160 90 145 95 140 Z" fill="#ef4444"/>
  <!-- Scarf tail dangling -->
  <path d="M130 160 L145 190 L135 195 L125 165 Z" fill="#ef4444"/>

  <!-- Character Neck & Head -->
  <path d="M108 125 H132 V148 H108 Z" fill="#fed7aa"/>
  <!-- Head -->
  <circle cx="120" cy="95" r="32" fill="#fed7aa"/>

  <!-- Hair Style (Short, neat stylized) -->
  <path d="M90 95 C90 70 110 60 125 62 C145 64 150 80 150 95 C150 95 140 85 120 85 C100 85 90 95 90 95 Z" fill="#1e293b"/>

  <!-- Facial Expressions (Eyes closed tightly in a shiver/warmth-seeking expression, gentle smile) -->
  <!-- Closed happy/focus eyes -->
  <path d="M106 94 Q112 99 118 94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M122 94 Q128 99 134 94" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Rosy cheeks showing cold -->
  <circle cx="104" cy="102" r="6" fill="#f43f5e" opacity="0.3"/>
  <circle cx="136" cy="102" r="6" fill="#f43f5e" opacity="0.3"/>
  
  <!-- Mouth (slight cozy expression) -->
  <path d="M115 110 Q120 114 125 110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Breath Vapor (Showing cold air) -->
  <path d="M125 105 C132 102 138 106 142 102 C146 98 142 92 136 94" fill="#ffffff" opacity="0.25"/>

  <!-- Warmth Glow behind Hands -->
  <circle cx="120" cy="155" r="35" fill="url(#warmth-glow)"/>

  <!-- Arms and Hands Actively Rubbing (搓 - Cuō) -->
  <!-- Left Arm & Hand -->
  <path d="M95 160 C95 150 105 145 115 150 L122 155" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
  <path d="M115 148 L128 156" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Right Arm & Hand (Overlapping to show friction/rubbing action) -->
  <path d="M145 160 C145 150 135 145 125 150 L118 155" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M125 148 L112 156" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>

  <!-- Friction / Heat Sparks / Motion lines for "搓" (Rubbing action) -->
  <path d="M102 145 Q120 138 138 145" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M106 162 Q120 168 134 162" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Tiny radiating warmth sparks -->
  <circle cx="105" cy="138" r="2" fill="#f59e0b"/>
  <circle cx="135" cy="138" r="1.5" fill="#f59e0b"/>
  <circle cx="120" cy="135" r="2.5" fill="#fbbf24"/>

  <!-- Foreground Surface (Desk / Table edge) -->
  <path d="M0 210 H240 V240 H0 Z" fill="#0f172a"/>
  <path d="M0 210 H240" stroke="#334155" stroke-width="3"/>
  
  <!-- Prop on desk: Warm mug of tea / hot drink -->
  <rect x="55" y="185" width="22" height="25" rx="4" fill="#cbd5e1"/>
  <path d="M77 192 C83 192 83 203 77 203" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <!-- Steam from mug -->
  <path d="M62 178 C60 170 66 165 64 158" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M70 178 C72 172 68 168 70 160" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>