<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Map Glow -->
    <linearGradient id="mapGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05" />
    </linearGradient>

    <!-- Character Cloak Gradient -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environmental Details: Study / Library Interior -->
  <g id="environment">
    <!-- Bookshelf Left -->
    <rect x="16" y="40" width="36" height="140" fill="#1e293b" rx="4" />
    <rect x="20" y="55" width="28" height="6" fill="#334155" rx="1" />
    <rect x="20" y="85" width="28" height="6" fill="#334155" rx="1" />
    <rect x="20" y="115" width="28" height="6" fill="#334155" rx="1" />
    <rect x="20" y="145" width="28" height="6" fill="#334155" rx="1" />
    <!-- Books on shelves -->
    <path d="M22 55L22 45C22 43.8 23 43 24 43L27 43C28 43 29 43.8 29 45L29 55Z" fill="#64748b" />
    <path d="M32 55L32 47C32 46.4 32.6 46 33.2 46H35.8C36.4 46 37 46.4 37 47L37 55Z" fill="#3b82f6" />
    <path d="M22 115L22 105C22 104.4 22.6 104 23.2 104H25.8C26.4 104 27 104.4 27 105L27 115Z" fill="#ef4444" />
    <path d="M30 115L30 102C30 101.4 30.6 101 31.2 101H34.8C35.4 101 36 101.4 36 102L36 115Z" fill="#10b981" />

    <!-- Window Right -->
    <rect x="180" y="36" width="44" height="70" rx="6" fill="#090d16" stroke="#334155" stroke-width="2" />
    <line x1="202" y1="36" x2="202" y2="106" stroke="#334155" stroke-width="2" />
    <line x1="180" y1="71" x2="224" y2="71" stroke="#334155" stroke-width="2" />
    <!-- Moonlight glow from window -->
    <path d="M185 41L219 41L219 101L185 101Z" fill="#38bdf8" opacity="0.05" />

    <!-- Large Wooden Study Table -->
    <path d="M40 170L200 170L210 205L30 205Z" fill="#334155" />
    <path d="M35 162L205 162L200 170L40 170Z" fill="#475569" />
    <!-- Table Legs -->
    <rect x="50" y="205" width="12" height="25" fill="#1e293b" rx="2" />
    <rect x="178" y="205" width="12" height="25" fill="#1e293b" rx="2" />
  </g>

  <!-- Central Historical Map / Artifact (The "History" context) -->
  <g id="historical-map" transform="translate(60, 95)">
    <!-- Map Paper -->
    <path d="M10 20C10 15 15 10 20 10L100 15C105 15 110 20 110 25L105 75C105 80 100 85 95 85L15 80C10 80 5 75 5 70Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <path d="M10 20C10 15 15 10 20 10L100 15C105 15 110 20 110 25L105 75C105 80 100 85 95 85L15 80C10 80 5 75 5 70Z" fill="url(#mapGlow)" />
    
    <!-- Map Topography & Borders -->
    <path d="M25 35 Q 40 25, 60 40 T 95 30" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6" />
    <path d="M20 55 Q 50 70, 80 50" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6" />

    <!-- Strategic Military Advance Markers (Symbolizing Invasion/侵略) -->
    <!-- Curved attacking arrow 1 -->
    <path d="M25 65 C 40 50, 50 35, 75 35" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <polygon points="75,30 85,35 75,40" fill="#ef4444" />

    <!-- Curved attacking arrow 2 -->
    <path d="M30 25 C 45 35, 60 55, 85 60" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <polygon points="85,55 95,60 85,65" fill="#ef4444" />

    <!-- Castles/Fortress icons on map -->
    <path d="M68 32 L72 26 L76 32 Z" fill="#b91c1c" />
    <rect x="69" y="32" width="6" height="5" fill="#b91c1c" />
  </g>

  <!-- Desk Props: Magnifying Glass, Hourglass, Inkwell -->
  <g id="desk-props">
    <!-- Inkwell -->
    <path d="M45 162 L55 162 L57 155 L43 155 Z" fill="#0f172a" />
    <ellipse cx="50" cy="155" rx="7" ry="2" fill="#38bdf8" />
    <!-- Feather Quill -->
    <path d="M50 155 C 45 130, 30 110, 20 100 C 25 115, 38 135, 48 153" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5" />

    <!-- Magnifying Glass hovering near map -->
    <g transform="translate(145, 120) rotate(-25)">
      <line x1="0" y1="0" x2="-25" y2="25" stroke="#475569" stroke-width="5" stroke-linecap="round" />
      <circle cx="15" cy="-15" r="16" fill="none" stroke="#f59e0b" stroke-width="4" />
      <circle cx="15" cy="-15" r="14" fill="#38bdf8" fill-opacity="0.15" />
    </g>
  </g>

  <!-- Foreground Main Character: Scholar/Historian analyzing the conflict -->
  <g id="character-historian">
    <!-- Torso & Cloak -->
    <path d="M115 165 C 115 145, 130 135, 145 135 C 160 135, 175 145, 175 165 L 185 205 L 105 205 Z" fill="url(#cloakGrad)" />
    <path d="M130 138 C 130 138, 145 145, 160 138 L 165 170 L 125 170 Z" fill="#1e293b" /> <!-- Inner collar/shirt -->

    <!-- Head & Face -->
    <circle cx="145" cy="105" r="18" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M127 105 C 127 92, 135 87, 145 87 C 155 87, 163 92, 163 105 C 163 105, 155 93, 145 93 C 135 93, 127 105, 127 105 Z" fill="#334155" />
    <!-- Expression: Serious, focused, contemplative -->
    <path d="M137 101 L 143 103" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M147 103 L 153 101" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="140" cy="107" r="1.5" fill="#1e293b" />
    <circle cx="150" cy="107" r="1.5" fill="#1e293b" />
    <path d="M143 115 C 145 117, 147 117, 149 115" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Glasses -->
    <circle cx="140" cy="107" r="5" fill="none" stroke="#d97706" stroke-width="1.5" />
    <circle cx="150" cy="107" r="5" fill="none" stroke="#d97706" stroke-width="1.5" />
    <line x1="145" y1="107" x2="145" y2="106" stroke="#d97706" stroke-width="1.5" />

    <!-- Active Arms & Hands -->
    <!-- Right arm reaching toward the map -->
    <path d="M165 145 C 175 145, 185 155, 180 165" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" />
    <circle cx="180" cy="168" r="5" fill="#fcd34d" />

    <!-- Left arm resting / holding chin -->
    <path d="M125 145 C 115 145, 115 155, 120 165" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" />
    <circle cx="120" cy="168" r="5" fill="#fcd34d" />
  </g>

  <!-- Ambient Lighting / Atmospheric Effects -->
  <!-- Warm reading lamp glow from top-left -->
  <path d="M0 0 L 100 0 L 60 180 L 0 120 Z" fill="#fbbf24" opacity="0.04" />
</svg>