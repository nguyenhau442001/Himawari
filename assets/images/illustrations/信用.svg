<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="2" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Character 1: The Merchant (Giving item) -->
  <circle cx="70" cy="110" r="25" fill="#fb923c"/>
  <path d="M55 135 L65 170 L75 170 L85 135 Z" fill="#38bdf8"/>
  <rect x="60" y="135" width="20" height="30" rx="5" fill="#fb923c"/>
  
  <!-- Character 2: The Client (Receiving item) -->
  <circle cx="170" cy="110" r="25" fill="#fbbf24"/>
  <path d="M155 135 L165 170 L175 170 L185 135 Z" fill="#10b981"/>
  <rect x="160" y="135" width="20" height="30" rx="5" fill="#fbbf24"/>
  
  <!-- The Handshake / Transaction -->
  <path d="M95 145 L145 145" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="145" r="8" fill="#f59e0b"/>
  
  <!-- Props: Goods/Contract -->
  <rect x="95" y="125" width="50" height="35" rx="4" fill="#f1f5f9"/>
  <line x1="105" y1="135" x2="135" y2="135" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="105" y1="145" x2="125" y2="145" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Background Elements -->
  <rect x="40" y="60" width="40" height="40" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="160" y="60" width="40" height="40" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.1"/>
</svg>