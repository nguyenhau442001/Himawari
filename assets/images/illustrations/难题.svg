<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Glowing background aura for the puzzle/problem focus -->
    <circle cx="120" cy="115" r="70" fill="#2D2214" opacity="0.6"/>

    <!-- Document/Exam Sheet Base -->
    <rect x="75" y="45" width="90" height="120" rx="6" fill="#252A34" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Paper Header Lines -->
    <rect x="90" y="60" width="40" height="6" rx="3" fill="#4B5563"/>
    <rect x="90" y="74" width="25" height="4" rx="2" fill="#3A4252"/>
    
    <!-- Answer lines or failed attempts -->
    <line x1="90" y1="95" x2="150" y2="95" stroke="#3A4252" stroke-width="3" stroke-dasharray="4, 4" stroke-linecap="round"/>
    <line x1="90" y1="110" x2="130" y2="110" stroke="#3A4252" stroke-width="3" stroke-dasharray="4, 4" stroke-linecap="round"/>

    <!-- Giant Confusing Mathematical / Hard Problem Symbol (Centerpiece) -->
    <!-- Stylized Integral / Equation symbol combining complexity -->
    <path d="M 102 122 C 102 110, 115 110, 115 100 C 115 90, 102 90, 102 80" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Math variables / X symbol denoting "unknown hard problem" -->
    <path d="M 126 92 L 142 118 M 142 92 L 126 118" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>

    <!-- Question Mark integrated prominently into the document -->
    <path d="M 108 135 C 108 126, 132 126, 132 112 C 132 102, 116 102, 116 94" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="116" cy="150" r="4" fill="#FBBF24"/>

    <!-- Pencil resting diagonally, emphasizing a difficult test/exam context -->
    <g transform="rotate(-35, 120, 170)">
      <!-- Eraser -->
      <rect x="105" y="160" width="12" height="10" rx="2" fill="#9CA3AF"/>
      <!-- Metal Band -->
      <rect x="105" y="170" width="12" height="6" fill="#D1D5DB"/>
      <!-- Wooden Body -->
      <rect x="105" y="176" width="12" height="40" fill="#FBBF24"/>
      <!-- Sharp Tip -->
      <polygon points="105,216 117,216 111,226" fill="#1F2937"/>
    </g>

    <!-- Accent decorative elements representing difficulty/friction -->
    <circle cx="65" cy="85" r="3" fill="#F59E0B" opacity="0.6"/>
    <circle cx="175" cy="135" r="2.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="165" cy="65" r="2" fill="#FBBF24" opacity="0.5"/>
  </g>
</svg>