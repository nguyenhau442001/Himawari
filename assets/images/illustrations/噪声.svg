<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow/waves representing sound propagation -->
  <path d="M75,100 Q60,120 75,140" fill="none" stroke="#2F3643" stroke-width="3" stroke-linecap="round"/>
  <path d="M60,85 Q40,120 60,155" fill="none" stroke="#2F3643" stroke-width="3" stroke-linecap="round"/>
  <path d="M45,70 Q20,120 45,170" fill="none" stroke="#2F3643" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Heavy industrial construction machine (Excavator/Jackhammer conceptual mashup) representing "施工工地上机器" -->
  <!-- Machine body / Chassis -->
  <rect x="80" y="110" width="80" height="50" rx="6" fill="#3A4252"/>
  
  <!-- Tracks / Wheels -->
  <rect x="70" y="152" width="100" height="18" rx="9" fill="#252A34"/>
  <circle cx="90" cy="161" r="6" fill="#64748B"/>
  <circle cx="120" cy="161" r="6" fill="#64748B"/>
  <circle cx="150" cy="161" r="6" fill="#64748B"/>

  <!-- Cabin -->
  <path d="M95,110 L125,110 L135,75 L95,75 Z" fill="#252A34"/>
  <path d="M100,82 L121,82 L128,104 L100,104 Z" fill="#F1F5F9" opacity="0.8"/> <!-- Window -->

  <!-- Mechanical arm / Heavy breaker boom -->
  <path d="M125,85 L160,65 L180,95" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160,65 L175,50" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Heavy chisel / Drill (The noise source) -->
  <rect x="172" y="90" width="12" height="55" rx="3" fill="#F59E0B"/>
  <polygon points="172,145 184,145 178,165" fill="#D97706"/>

  <!-- Dynamic impact sparks / chaos lines -->
  <path d="M178,165 L190,175" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M178,165 L165,178" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M178,165 L185,182" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- High-contrast sound waves (Noise / 噪声) emanating aggressively -->
  <path d="M195,85 Q215,100 215,120 Q215,140 195,155" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M205,70 Q235,95 235,120 Q235,145 205,170" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Ground line -->
  <line x1="30" y1="175" x2="210" y2="175" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
</svg>