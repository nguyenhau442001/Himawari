<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <rect x="40" y="80" width="160" height="100" rx="4" fill="#334155"/>
  <circle cx="120" cy="130" r="35" fill="#f59e0b" opacity="0.15"/>
  
  <!-- The Man (Subject) -->
  <g transform="translate(60, 100)">
    <path d="M20 120 L20 80 Q20 60 40 60 L60 60 Q80 60 80 80 L80 120" fill="#38bdf8"/>
    <circle cx="50" cy="45" r="15" fill="#fde68a"/>
    <path d="M45 40 L47 42 M53 40 L51 42" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M45 50 Q50 53 55 50" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- The Child (Recipient of the promise) -->
  <g transform="translate(110, 110)">
    <path d="M15 110 L15 80 Q15 65 30 65 L45 65 Q60 65 60 80 L60 110" fill="#ec4899"/>
    <circle cx="37" cy="50" r="12" fill="#fde68a"/>
    <path d="M33 46 L35 48 M39 46 L41 48" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M33 54 Q37 56 41 54" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- The Action: Handshake/Gift (The fulfillment of the promise) -->
  <g transform="translate(95, 140)">
    <circle cx="20" cy="20" r="12" fill="#10b981"/>
    <path d="M15 20 L18 23 L25 16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <path d="M180 50 L190 40 M190 50 L180 40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="40" r="3" fill="#fb923c"/>
</svg>