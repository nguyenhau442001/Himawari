  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Left side: Formal Business Setting -->
  <rect x="20" y="60" width="90" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
