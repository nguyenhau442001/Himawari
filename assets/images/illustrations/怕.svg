<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Floor shadow / grounding -->
    <ellipse cx="120" cy="188" rx="75" ry="12" fill="#111317" opacity="0.6"/>

    <!-- Frightened Little Sister Character (Conveys 'pà' / fear/scared) -->
    <g id="frightened-character">
      <!-- Body / Hoodie (slate blue) -->
      <path d="M 95 145 C 90 130 95 115 120 115 C 145 115 150 130 145 145 C 150 155 155 180 145 190 C 135 195 105 195 95 190 C 85 180 90 155 95 145 Z" fill="#3B4252"/>
      
      <!-- Nervous shrinking shoulders / huddle lines -->
      <path d="M 92 135 Q 80 145 85 160" stroke="#4C566A" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 148 135 Q 160 145 155 160" stroke="#4C566A" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Head (slight tilt, leaning back slightly in fear) -->
      <circle cx="120" cy="92" r="26" fill="#E5C1A8"/>
      
      <!-- Hair (cute bob cut) -->
      <path d="M 94 92 C 92 72 108 64 120 64 C 132 64 148 72 146 92 C 148 108 142 118 136 120 C 130 112 125 108 120 108 C 115 108 110 112 104 120 C 98 118 92 108 94 92 Z" fill="#2E3440"/>

      <!-- Terrified facial expression -->
      <!-- Wide frightened eyes -->
      <circle cx="111" cy="91" r="5" fill="#FFFFFF"/>
      <circle cx="129" cy="91" r="5" fill="#FFFFFF"/>
      <circle cx="112" cy="91" r="2.2" fill="#2E3440"/>
      <circle cx="128" cy="91" r="2.2" fill="#2E3440"/>
      
      <!-- Trembling / O-shaped mouth -->
      <ellipse cx="120" cy="103" rx="3.5" ry="5" fill="#2E3440"/>

      <!-- Nervous sweat drops -->
      <path d="M 97 78 Q 94 74 97 70 Q 100 74 97 78 Z" fill="#88C0D0"/>
      
      <!-- Hands clutched tightly in front of chest (fear gesture) -->
      <circle cx="114" cy="138" r="7" fill="#E5C1A8"/>
      <circle cx="126" cy="138" r="7" fill="#E5C1A8"/>
    </g>

    <!-- The Dog (Contextual reference: 狗 - triggering the fear) -->
    <g id="dog-character" transform="translate(38, 110)">
      <!-- Dog Body -->
      <ellipse cx="32" cy="48" rx="20" ry="14" fill="#D08770"/>
      
      <!-- Dog Head -->
      <circle cx="20" cy="36" r="13" fill="#D08770"/>
      
      <!-- Pointy Alert Ears (perked up aggressively/playfully) -->
      <polygon points="12,25 16,13 22,23" fill="#B48EAD"/>
      <polygon points="20,25 26,14 30,24" fill="#B48EAD"/>

      <!-- Dog Snout & Nose -->
      <ellipse cx="12" cy="38" rx="6" ry="4" fill="#ECEFF4"/>
      <circle cx="9" cy="37" r="2" fill="#2E3440"/>

      <!-- Tail wagging / up high -->
      <path d="M 52 44 Q 62 36 58 26" stroke="#D08770" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Dog Legs -->
      <rect x="18" y="58" width="4" height="14" rx="2" fill="#B48EAD"/>
      <rect x="26" y="58" width="4" height="14" rx="2" fill="#B48EAD"/>
      <rect x="40" y="58" width="4" height="14" rx="2" fill="#B48EAD"/>
      <rect x="46" y="58" width="4" height="14" rx="2" fill="#B48EAD"/>
      
      <!-- Alert Bark/Spark lines -->
      <path d="M 4 33 Q 0 31 2 28" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Visual Accent: Shiver / Fear vibration lines near the girl -->
    <g stroke="#88C0D0" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <!-- Left side shiver -->
      <path d="M 72 95 Q 68 100 72 105"/>
      <path d="M 68 112 Q 64 117 68 122"/>
      
      <!-- Motion/Tension marks between dog and girl -->
      <line x1="72" y1="135" x2="82" y2="135" stroke-dasharray="2,2"/>
      <line x1="70" y1="145" x2="80" y2="145" stroke-dasharray="2,2"/>
    </g>

    <!-- Warm Focus Accent Glow (Gold/Orange accent framing the focal interaction) -->
    <circle cx="120" cy="120" r="105" fill="none" stroke="#EBCB8B" stroke-width="1.5" opacity="0.15" stroke-dasharray="6 6"/>
  </g>
</svg>