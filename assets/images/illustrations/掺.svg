<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="125" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Liquid Container (Glass Beaker) -->
  <g transform="translate(0, 5)">
    <!-- Beaker Body -->
    <path d="M 90 70 L 90 165 C 90 173 96 180 104 180 L 136 180 C 144 180 150 173 150 165 L 150 70 Z" fill="#2D3748" opacity="0.3"/>
    
    <!-- Liquid Layers (Demonstrating "Pha lẫn, trộn lẫn, lẫn tạp" / Adulteration / Mixing) -->
    <!-- Base Pure Liquid (Orange/Fruit Juice reference) -->
    <path d="M 92 110 L 92 165 C 92 171 97 176 104 176 L 136 176 C 143 176 148 171 148 165 L 148 110 Z" fill="#F6AD55"/>
    
    <!-- Adulterated/Mixed Layer (Water/Foreign substance mixed in, lighter fluid with swirling impurity effect) -->
    <path d="M 92 90 L 92 112 C 105 105 115 115 130 108 C 138 105 144 110 148 108 L 148 90 Z" fill="#63B3ED" opacity="0.7"/>
    
    <!-- Swirl mixing lines inside the liquid -->
    <path d="M 105 130 Q 120 120 135 140" stroke="#DD6B20" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 110 150 Q 125 140 130 160" stroke="#3182CE" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Impurity Particles / Foreign elements -->
    <circle cx="108" cy="135" r="3" fill="#E2E8F0" opacity="0.8"/>
    <circle cx="132" cy="120" r="2.5" fill="#E2E8F0" opacity="0.7"/>
    <circle cx="118" cy="162" r="3.5" fill="#CBD5E0" opacity="0.8"/>
    <circle cx="125" cy="100" r="2" fill="#E2E8F0" opacity="0.9"/>

    <!-- Beaker Rim -->
    <rect x="84" y="64" width="72" height="8" rx="3" fill="#E2E8F0"/>
    
    <!-- Glass Highlight/Reflection -->
    <path d="M 96 80 L 96 160" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Dropper / Pouring element adding the adulterant -->
  <g transform="translate(10, -5)">
    <!-- Dropper Glass Body -->
    <path d="M 145 30 L 155 30 L 152 75 L 148 75 Z" fill="#CBD5E0" opacity="0.8"/>
    <!-- Dropper Bulb (Top) -->
    <path d="M 143 25 C 143 20 157 20 157 25 L 157 32 L 143 32 Z" fill="#ED8936"/>
    <!-- Droplet falling into beaker -->
    <path d="M 150 85 C 147 88 147 93 150 95 C 153 93 153 88 150 85 Z" fill="#63B3ED"/>
    <!-- Motion lines for dropping -->
    <line x1="150" y1="78" x2="150" y2="82" stroke="#63B3ED" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Warning / Alteration indicator (Focus accent color: Orange/Gold) -->
  <g transform="translate(42, 130)">
    <circle cx="12" cy="12" r="14" fill="#1A1D24" stroke="#ED8936" stroke-width="3"/>
    <!-- Exclamation mark / warning symbol -->
    <line x1="12" y1="6" x2="12" y2="13" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="1.5" fill="#ED8936"/>
  </g>
</svg>