<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Office/Study Background Details -->
  <!-- Bookshelf in background -->
  <rect x="18" y="40" width="36" height="85" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="18" y1="65" x2="54" y2="65" stroke="#334155" stroke-width="1.5"/>
  <line x1="18" y1="90" x2="54" y2="90" stroke="#334155" stroke-width="1.5"/>
  <!-- Book items -->
  <rect x="23" y="47" width="6" height="18" fill="#38bdf8" rx="1"/>
  <rect x="31" y="45" width="8" height="20" fill="#f43f5e" rx="1"/>
  <rect x="41" y="49" width="5" height="16" fill="#10b981" rx="1"/>
  <rect x="24" y="73" width="12" height="17" fill="#fbbf24" rx="1"/>
  <rect x="38" y="70" width="10" height="20" fill="#a855f7" rx="1"/>

  <!-- Large Idea Chalkboard / Wall Display -->
  <rect x="68" y="32" width="154" height="105" rx="6" fill="url(#boardGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="74" y="38" width="142" height="93" rx="4" fill="#0f172a"/>

  <!-- Abstract scientific/theoretical diagrams drawn on the board in glowing chalk -->
  <path d="M 90 95 Q 110 65 135 85 T 180 75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="110" cy="75" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="155" cy="80" r="4" fill="#f43f5e" opacity="0.6"/>
  <line x1="90" y1="110" x2="195" y2="110" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="95" y1="50" x2="95" y2="115" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Connecting nodes chart -->
  <polygon points="150,55 175,70 165,95 135,95 125,70" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>

  <!-- THE BIRTH OF THE IDEA: Central Glowing Conceptual Sphere (A New Theory is Born) -->
  <circle cx="145" cy="78" r="32" fill="url(#glowGrad)" filter="url(#softGlow)"/>
  <circle cx="145" cy="78" r="18" fill="#fbbf24" filter="url(#softGlow)"/>
  <circle cx="145" cy="78" r="12" fill="#fffbeb"/>
  <!-- Sparkles / rays emitting from the new theory -->
  <path d="M 145 52 L 145 44" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 145 104 L 145 112" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 119 78 L 111 78" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 171 78 L 179 78" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 127 60 L 121 54" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 163 96 L 169 102" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 163 60 L 169 54" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 127 96 L 121 102" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Desk Surface -->
  <rect x="0" y="195" width="240" height="45" fill="url(#deskGrad)"/>
  <path d="M 0 195 L 240 195" stroke="#64748b" stroke-width="2"/>

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M 175 195 L 225 195 L 215 178 L 185 178 Z" fill="#64748b"/>
  <path d="M 183 178 L 217 178 L 220 155 L 180 155 Z" fill="#94a3b8"/>
  <rect x="184" y="158" width="32" height="18" rx="1" fill="#0f172a"/>
  <!-- Coffee mug -->
  <rect x="42" y="172" width="16" height="23" rx="3" fill="#cbd5e1"/>
  <path d="M 58 178 C 64 178, 64 190, 58 190" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Notebook and pen -->
  <rect x="68" y="180" width="35" height="16" rx="2" fill="#f8fafc" transform="rotate(-5 68 180)"/>
  <line x1="72" y1="184" x2="95" y2="182" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="72" y1="189" x2="90" y2="187" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="110" y1="188" x2="135" y2="175" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Character (Researcher / Thinker) -->
  <!-- Torso & Shoulders -->
  <path d="M 60 220 C 60 195, 80 185, 105 185 C 130 185, 150 195, 150 220 Z" fill="#2563eb"/>
  <!-- Collar / Shirt -->
  <path d="M 90 185 L 105 200 L 120 185 Z" fill="#f8fafc"/>
  
  <!-- Neck -->
  <rect x="97" y="162" width="16" height="25" rx="8" fill="#fbcfe8"/>

  <!-- Head (Excited / Amazed expression looking up at the born theory) -->
  <circle cx="105" cy="142" r="22" fill="#fbcfe8"/>

  <!-- Hair -->
  <path d="M 83 142 C 83 125, 95 120, 105 120 C 120 120, 127 130, 127 148 L 127 154 L 83 154 Z" fill="#1e293b"/>
  <path d="M 83 140 C 85 130, 95 123, 107 122" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Face Details -->
  <!-- Glasses -->
  <circle cx="97" cy="142" r="6" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="113" cy="142" r="6" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="103" y1="142" x2="107" y2="142" stroke="#0f172a" stroke-width="1.5"/>
  
  <!-- Eyes (Wide with awe) -->
  <circle cx="97" cy="142" r="2" fill="#0f172a"/>
  <circle cx="113" cy="142" r="2" fill="#0f172a"/>

  <!-- Smile / Open mouth of realization -->
  <path d="M 101 153 Q 105 159 110 153" fill="#0f172a"/>

  <!-- Arms / Gesturing (Hands up in excitement / breakthrough) -->
  <!-- Left arm -->
  <path d="M 65 195 C 50 180, 45 155, 55 145" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <!-- Left hand -->
  <circle cx="55" cy="142" r="6" fill="#fbcfe8"/>

  <!-- Right arm reaching toward the theory -->
  <path d="M 140 190 C 155 175, 170 150, 160 130" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <!-- Right hand -->
  <circle cx="158" cy="125" r="6" fill="#fbcfe8"/>

  <!-- Ambient Light Reflection on Desk/Character -->
  <path d="M 70 195 C 100 195, 130 195, 160 195" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>