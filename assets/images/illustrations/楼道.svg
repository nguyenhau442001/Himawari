<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Perspective Corridor Walls -->
  <path d="M0 0 L80 60 L80 240 L0 240 Z" fill="#2C313C"/>
  <path d="M240 0 L160 60 L160 240 L240 240 Z" fill="#2C313C"/>
  
  <!-- Ceiling and Floor -->
  <path d="M0 0 L80 60 L160 60 L240 0 Z" fill="#3A414F"/>
  <path d="M0 240 L80 180 L160 180 L240 240 Z" fill="#252A34"/>
  
  <!-- Doors -->
  <rect x="90" y="80" width="60" height="100" rx="4" fill="#3D4657" stroke="#FFB84D" stroke-width="2"/>
  <circle cx="140" cy="130" r="4" fill="#FFB84D"/>
  
  <!-- Floor Detail (Tiling) -->
  <path d="M80 180 L160 180 L240 240 L0 240 Z" fill="none" stroke="#1A1D24" stroke-width="2"/>
  <line x1="120" y1="180" x2="120" y2="240" stroke="#1A1D24" stroke-width="2"/>
  
  <!-- Warning/Focus Element: Prohibited clutter indicator -->
  <rect x="20" y="190" width="40" height="20" rx="2" fill="#FFB84D"/>
  <rect x="25" y="195" width="30" height="10" rx="1" fill="#1A1D24"/>
  <path d="M35 195 L45 205 M45 195 L35 205" stroke="#FFB84D" stroke-width="3"/>
  
  <!-- Lighting -->
  <rect x="100" y="65" width="40" height="10" rx="2" fill="#FFB84D" opacity="0.6"/>
</svg>