<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle radial background glow to highlight the object -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.08"/>

  <!-- Trophy Iconography representing "奖" (Award / Prize) -->
  <g transform="translate(0, 5)">
    <!-- Base / Stand -->
    <path d="M90 185 L150 185 L155 195 C155 198 152 200 148 200 L92 200 C88 200 85 198 85 195 Z" fill="#4A5568"/>
    <rect x="100" y="170" width="40" height="15" fill="#718096" rx="2"/>

    <!-- Stem -->
    <rect x="112" y="140" width="16" height="32" fill="#4A5568"/>

    <!-- Trophy Cup Body -->
    <path d="M 80 70 
             Q 80 135 120 135 
             Q 160 135 160 70 Z" 
          fill="#FFB703"/>

    <!-- Cup Inner Depth / Shading -->
    <path d="M 85 70 
             Q 85 125 120 125 
             Q 155 125 155 70 Z" 
          fill="#F59E0B"/>

    <!-- Rim of the Trophy -->
    <ellipse cx="120" cy="70" rx="40" ry="10" fill="#FBBF24"/>
    <ellipse cx="120" cy="68" rx="36" ry="7" fill="#FDE68A"/>

    <!-- Left Handle -->
    <path d="M 83 78 
             C 60 78 60 110 83 118" 
          fill="none" stroke="#FFB703" stroke-width="7" stroke-linecap="round"/>

    <!-- Right Handle -->
    <path d="M 157 78 
             C 180 78 180 110 157 118" 
          fill="none" stroke="#FFB703" stroke-width="7" stroke-linecap="round"/>

    <!-- Star Emblem on Trophy Center -->
    <polygon points="120,85 124,96 136,96 126,103 130,114 120,107 110,114 114,103 104,96 116,96" fill="#FEF3C7"/>

    <!-- Shine / Highlight on Trophy -->
    <path d="M 92 78 Q 90 100 97 115" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Floating celebratory sparkles / stars -->
  <g fill="#FBBF24" opacity="0.9">
    <!-- Top Left Sparkle -->
    <path d="M 65 50 Q 65 60 55 60 Q 65 60 65 70 Q 65 60 75 60 Q 65 60 65 50 Z"/>
    <!-- Top Right Sparkle -->
    <path d="M 180 40 Q 180 48 172 48 Q 180 48 180 56 Q 180 48 188 48 Q 180 48 180 40 Z" transform="scale(0.8) translate(60, 10)"/>
    <!-- Small Accent Star -->
    <circle cx="155" cy="45" r="3" fill="#FDE68A"/>
    <circle cx="78" cy="115" r="2.5" fill="#FDE68A"/>
  </g>
</svg>