<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glow effect behind monitor -->
  <circle cx="120" cy="110" r="70" fill="#2563EB" opacity="0.15" filter="blur(16px)" />

  <!-- Modern Desk / Base -->
  <rect x="52" y="180" width="136" height="6" rx="3" fill="#334155" />

  <!-- Monitor Stand -->
  <path d="M104 158H136V180H104Z" fill="#475569" />
  <rect x="88" y="174" width="64" height="6" rx="3" fill="#64748B" />

  <!-- Monitor Body -->
  <rect x="56" y="52" width="128" height="106" rx="10" fill="#0F172A" stroke="#334155" stroke-width="3" />
  
  <!-- Screen Inner -->
  <rect x="64" y="60" width="112" height="90" rx="6" fill="#111827" />

  <!-- Code / IDE UI Header -->
  <circle cx="74" cy="70" r="2.5" fill="#EF4444" />
  <circle cx="83" cy="70" r="2.5" fill="#F59E0B" />
  <circle cx="92" cy="70" r="2.5" fill="#10B981" />

  <!-- Code Editor Lines (Abstract Syntax Representation) -->
  <!-- Line 1: Keyword & Variable -->
  <rect x="74" y="82" width="16" height="5" rx="2.5" fill="#F43F5E" />
  <rect x="94" y="82" width="24" height="5" rx="2.5" fill="#60A5FA" />
  <rect x="122" y="82" width="12" height="5" rx="2.5" fill="#94A3B8" />

  <!-- Line 2: Function/Bracket -->
  <rect x="82" y="94" width="10" height="5" rx="2.5" fill="#38BDF8" />
  <rect x="96" y="94" width="44" height="5" rx="2.5" fill="#FBBF24" />
  <rect x="144" y="94" width="8" height="5" rx="2.5" fill="#34D399" />

  <!-- Line 3: Nested Code -->
  <rect x="90" y="106" width="32" height="5" rx="2.5" fill="#A78BFA" />
  <rect x="126" y="106" width="18" height="5" rx="2.5" fill="#F43F5E" />

  <!-- Line 4 -->
  <rect x="90" y="118" width="22" height="5" rx="2.5" fill="#60A5FA" />
  <rect x="116" y="118" width="36" height="5" rx="2.5" fill="#34D399" />

  <!-- Line 5: Closing -->
  <rect x="82" y="130" width="8" height="5" rx="2.5" fill="#34D399" />

  <!-- Cursor / Active typing indicator -->
  <rect x="156" y="118" width="3" height="6" rx="1" fill="#F59E0B" />

  <!-- Floating Tech / Logic Accent Elements -->
  <!-- Curly Braces representing programming logic -->
  <path d="M 44 96 C 38 96, 38 100, 38 104 L 38 108 C 38 112, 34 114, 30 116 C 34 118, 38 120, 38 124 L 38 128 C 38 132, 38 136, 44 136" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <path d="M 196 96 C 202 96, 202 100, 202 104 L 202 108 C 202 112, 206 114, 210 116 C 206 118, 202 120, 202 124 L 202 128 C 202 132, 202 136, 196 136" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>