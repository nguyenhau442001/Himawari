<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize value -->
  <circle cx="120" cy="120" r="70" fill="#FFC107" opacity="0.08"/>

  <!-- Jewelry Box (Open, glowing with value to represent "贵重" - precious/valuable items) -->
  <g transform="translate(0, 10)">
    <!-- Back inner velvet lining -->
    <path d="M70 95 L170 95 L160 130 L80 130 Z" fill="#2C3240"/>
    
    <!-- Open Lid -->
    <path d="M70 90 L170 90 L160 45 L80 45 Z" fill="#363C4E"/>
    <!-- Lid inner panel -->
    <path d="M78 85 L162 85 L154 53 L86 53 Z" fill="#252A36"/>
    <!-- Lid highlight/rim -->
    <path d="M70 90 L170 90 L168 93 L72 93 Z" fill="#D4AF37"/>

    <!-- Precious Gems & Gold inside -->
    <!-- Gold Bar -->
    <rect x="88" y="105" width="36" height="18" rx="3" fill="#FFC107"/>
    <rect x="91" y="108" width="30" height="12" rx="1" fill="#FFD54F" opacity="0.6"/>
    
    <!-- Diamond/Gem 1 (Ruby Red) -->
    <polygon points="140,100 152,100 158,112 146,122 134,112" fill="#FF5252"/>
    <polygon points="140,100 146,106 146,122 134,112" fill="#FF8A80" opacity="0.6"/>
    <polygon points="140,100 152,100 146,106" fill="#FF1744" opacity="0.8"/>

    <!-- Gem 2 (Sapphire Blue) -->
    <polygon points="112,85 124,85 130,97 118,107 106,97" fill="#448AFF"/>
    <polygon points="112,85 118,91 118,107 106,97" fill="#82B1FF" opacity="0.6"/>
    
    <!-- Pearl Necklace draped over -->
    <path d="M 85 120 C 100 140, 140 140, 155 120" fill="none" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 8"/>

    <!-- Box Base Front -->
    <path d="M65 125 L175 125 L170 165 C170 170, 166 174, 160 174 L80 174 C74 174, 70 170, 70 165 Z" fill="#42495E"/>
    
    <!-- Box Base Front Face (Shaded) -->
    <path d="M70 125 L170 125 L165 168 C165 171, 162 174, 158 174 L82 174 C78 174, 75 171, 75 168 Z" fill="#2E3442"/>
    
    <!-- Golden Lock/Clasp on Box -->
    <rect x="111" y="123" width="18" height="14" rx="3" fill="#D4AF37"/>
    <circle cx="120" cy="130" r="2.5" fill="#1A1D24"/>
  </g>

  <!-- Sparkles denoting high value / preciousness -->
  <!-- Top Left Sparkle -->
  <path d="M60 65 Q60 50 45 50 Q60 50 60 35 Q60 50 75 50 Q60 50 60 65 Z" fill="#FFD700" opacity="0.9"/>
  
  <!-- Top Right Sparkle -->
  <path d="M190 75 Q190 65 180 65 Q190 65 190 55 Q190 65 200 65 Q190 65 190 75 Z" fill="#FFD700" opacity="0.8"/>
  
  <!-- Small Accent Sparkle -->
  <path d="M85 45 Q85 39 79 39 Q85 39 85 33 Q85 39 91 39 Q85 39 85 45 Z" fill="#FFC107" opacity="0.6"/>
</svg>