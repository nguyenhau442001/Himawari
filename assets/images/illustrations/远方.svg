<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Landscape -->
  <path d="M0 160 Q 60 140, 120 160 T 240 160 V 240 H 0 Z" fill="#2C313C"/>
  <path d="M0 170 Q 80 150, 160 170 T 240 170 V 240 H 0 Z" fill="#3D4451"/>
  
  <!-- Silhouette of the Person -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="12" fill="#F39C12"/>
    <path d="M8 35 Q 20 30, 32 35 L 30 80 L 10 80 Z" fill="#F39C12"/>
  </g>
  
  <!-- The "Distant" Point (The Horizon/Destination) -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="6" fill="#F39C12"/>
    <circle cx="0" cy="0" r="12" fill="#F39C12" opacity="0.3"/>
    <circle cx="0" cy="0" r="18" fill="#F39C12" opacity="0.1"/>
  </g>
  
  <!-- Line of Sight -->
  <path d="M70 125 L 170 120" stroke="#F39C12" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
</svg>