    <rect x="12" y="45" width="16" height="40" rx="4" fill="#ec4899"/>
    <path d="M15 15h2v5h-2zM23 15h2v5h-2z" fill="#1e293b"/>
    <path d="M15 30h10" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Table -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#475569"/>
  
  <!-- Medicine Props -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="20" height="20" rx="2" fill="#10b981"/>
    <rect x="25" y="5" width="15" height="15" rx="7.5" fill="#fb923c"/>
    <rect x="45" y="0" width="20" height="20" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Clipboard/Instruction -->
