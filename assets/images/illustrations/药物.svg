<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Doctor Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="18" fill="#fde68a"/>
    <path d="M10 25h20v5a10 10 0 0 1-20 0z" fill="#38bdf8"/>
    <rect x="12" y="45" width="16" height="40" rx="4" fill="#38bdf8"/>
    <path d="M5 50h30v10h-30z" fill="#e2e8f0"/>
  </g>

  <!-- Patient Character -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="18" fill="#fde68a"/>
