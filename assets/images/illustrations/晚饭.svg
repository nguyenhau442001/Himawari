  <path d="M 170,135 L 190,135 C 191,135 192,136 191,138 L 189,140 L 171,140 L 169,138 C 168,136 169,135 170,135 Z" fill="#EAECEF" opacity="0.9"/>
  <rect x="178" y="165" width="4" height="15" fill="#EAECEF" opacity="0.8"/>
