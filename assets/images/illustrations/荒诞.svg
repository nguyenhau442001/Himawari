<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window/Moonlit Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Reading Lamp Warm Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment / Room Interior -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" />
  
  <!-- Bookshelf Background Details -->
  <line x1="35" y1="50" x2="90" y2="50" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <rect x="42" y="32" width="8" height="18" rx="2" fill="#475569" />
  <rect x="52" y="28" width="10" height="22" rx="2" fill="#38bdf8" />
  <rect x="64" y="35" width="7" height="15" rx="2" fill="#ec4899" />
  <rect x="73" y="30" width="12" height="20" rx="2" fill="#f59e0b" />

  <!-- Round Window showing Surreal Moon / Starry night -->
  <circle cx="180" cy="70" r="28" fill="url(#window-glow)" stroke="#334155" stroke-width="3" />
  <!-- Surreal floating elements outside window -->
  <circle cx="170" cy="62" r="4" fill="#fbbf24" />
  <path d="M 188 75 Q 193 70 190 80 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 172 82 Q 178 85 175 78 Z" fill="#ec4899" opacity="0.8" />

  <!-- Wooden Desk Surface -->
  <path d="M 20 170 L 220 170 L 210 195 L 30 195 Z" fill="#334155" />
  <rect x="20" y="165" width="200" height="7" rx="3" fill="#475569" />

  <!-- Lamp Lighting & Fixture -->
  <circle cx="120" cy="120" r="60" fill="url(#lamp-glow)" pointer-events="none" />
  <!-- Lamp Stand & Shade -->
  <path d="M 195 167 L 205 167 L 200 135 Z" fill="#64748b" />
  <path d="M 190 135 L 210 135 L 205 120 L 195 120 Z" fill="#f59e0b" />
  <path d="M 200 120 L 200 80" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Open Storybook with Absurd Illustrations -->
  <g transform="translate(70, 145)">
    <!-- Book Shadow -->
    <ellipse cx="50" cy="30" rx="45" ry="10" fill="#0f172a" opacity="0.6" />
    <!-- Book Pages Base -->
    <path d="M 5 25 Q 50 10 95 25 L 90 48 Q 50 35 10 48 Z" fill="#cbd5e1" />
    <path d="M 6 25 Q 50 12 50 42 Q 10 35 10 48 Z" fill="#f1f5f9" />
    <path d="M 50 12 Q 50 42 94 25 L 90 48 Q 50 35 50 42 Z" fill="#e2e8f0" />
    
    <!-- Absurd Story Graphic on Left Page (A Fish Flying with an Umbrella) -->
    <path d="M 25 24 Q 30 20 35 24 Q 40 28 32 30 Z" fill="#38bdf8" /> <!-- Flying Fish -->
    <circle cx="33" cy="23" r="1" fill="#0f172a" />
    <path d="M 20 20 Q 28 15 36 20" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round" /> <!-- Umbrella -->
    <line x1="28" y1="20" x2="28" y2="28" stroke="#64748b" stroke-width="1.5" />

    <!-- Absurd Story Graphic on Right Page (A Teapot with legs walking) -->
    <ellipse cx="70" cy="28" rx="7" ry="5" fill="#f59e0b" /> <!-- Teapot body -->
    <path d="M 63 28 Q 60 25 61 22" stroke="#f59e0b" stroke-width="1.5" fill="none" /> <!-- Spout -->
    <path d="M 77 28 Q 80 26 78 24" stroke="#f59e0b" stroke-width="1.5" fill="none" /> <!-- Handle -->
    <line x1="67" y1="33" x2="65" y2="40" stroke="#334155" stroke-width="1.5" stroke-linecap="round" /> <!-- Leg 1 -->
    <line x1="73" y1="33" x2="75" y2="40" stroke="#334155" stroke-width="1.5" stroke-linecap="round" /> <!-- Leg 2 -->
  </g>

  <!-- Main Expressive Character (Reader reacting with shock/disbelief) -->
  <g transform="translate(5, 60)">
    <!-- Character Body / Hoodie -->
    <path d="M 50 115 Q 50 85 75 85 Q 100 85 100 115 Z" fill="#38bdf8" />
    <path d="M 60 88 L 75 100 L 90 88" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /> <!-- Hoodie collar -->

    <!-- Neck -->
    <rect x="68" y="75" width="14" height="15" fill="#fcd34d" />

    <!-- Expressive Head -->
    <circle cx="75" cy="65" r="22" fill="#fcd34d" />

    <!-- Hair (Messy/Surprised style) -->
    <path d="M 53 62 Q 50 45 65 48 Q 75 42 85 49 Q 95 46 97 60 Q 95 55 90 55 Z" fill="#1e293b" />

    <!-- Face Expressing "Absurdity / Mind Blown" -->
    <!-- Wide Eyebrows Raised High -->
    <path d="M 60 55 Q 65 51 70 56" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 80 56 Q 85 51 90 55" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Wide Open Shocked Eyes -->
    <circle cx="65" cy="63" r="4.5" fill="#ffffff" />
    <circle cx="65" cy="63" r="2" fill="#0f172a" />
    <circle cx="85" cy="63" r="4.5" fill="#ffffff" />
    <circle cx="85" cy="63" r="2" fill="#0f172a" />

    <!-- Comical Open Mouth ('O' shape of disbelief) -->
    <ellipse cx="75" cy="74" rx="5" ry="7" fill="#1e293b" />
    <ellipse cx="75" cy="73" rx="3" ry="4" fill="#ef4444" />

    <!-- Sweat Drop (Signifying absolute perplexity) -->
    <path d="M 94 58 Q 98 64 94 68 Q 90 64 94 58 Z" fill="#38bdf8" />

    <!-- Arms & Hands Gesturing Disbelief / Scratching Head -->
    <!-- Left Arm holding head -->
    <path d="M 52 95 Q 40 75 58 68" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="58" cy="66" r="5" fill="#fcd34d" />

    <!-- Right Arm leaning on desk -->
    <path d="M 95 95 Q 110 95 105 110" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="106" cy="112" r="5" fill="#fcd34d" />
  </g>

  <!-- Comical Floating Question Marks / Confusion Sparks -->
  <g fill="#fbbf24">
    <path d="M 135 65 Q 140 55 147 62 Q 152 68 145 74 L 145 78" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="145" cy="84" r="1.5" />
    
    <path d="M 30 75 Q 33 68 38 73 Q 42 78 37 82 L 37 85" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="37" cy="89" r="1.5" fill="#38bdf8" />
  </g>

</svg>