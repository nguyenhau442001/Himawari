<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character 1 (The speaker) -->
  <g transform="translate(40, 60)">
    <circle cx="30" cy="30" r="25" fill="#fb923c"/>
    <path d="M15 50 Q30 65 45 50" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="4" fill="#0f172a"/>
    <circle cx="40" cy="25" r="4" fill="#0f172a"/>
    <rect x="10" y="80" width="40" height="70" rx="10" fill="#38bdf8"/>
  </g>
  
  <!-- Character 2 (The listener) -->
  <g transform="translate(140, 60)">
    <circle cx="30" cy="30" r="25" fill="#10b981"/>
    <path d="M15 45 Q30 40 45 45" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="4" fill="#0f172a"/>
    <circle cx="40" cy="25" r="4" fill="#0f172a"/>
    <rect x="10" y="80" width="40" height="70" rx="10" fill="#ec4899"/>
  </g>

  <!-- The "Clarification" Prop (A document with a spotlight) -->
  <rect x="95" y="170" width="50" height="40" rx="2" fill="#f8fafc"/>
  <line x1="105" y1="180" x2="135" y2="180" stroke="#64748b" stroke-width="2"/>
  <line x1="105" y1="190" x2="135" y2="190" stroke="#64748b" stroke-width="2"/>
  <line x1="105" y1="200" x2="120" y2="200" stroke="#64748b" stroke-width="2"/>
  
  <!-- Spotlight effect -->
  <path d="M120 100 L100 170 L140 170 Z" fill="#fbbf24" opacity="0.2"/>
  <circle cx="120" cy="90" r="15" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Speech bubbles/Gesture indicators -->
  <path d="M80 70 Q90 50 110 60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="115" cy="60" r="3" fill="#f59e0b"/>
</svg>