<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative sleek ambient lighting -->
  <circle cx="120" cy="120" r="90" fill="#252A34" opacity="0.5"/>

  <!-- Visual contrast (Adjective rule): Standard tier vs. Exaggerated High-End tier -->
  <!-- Low/Standard tier (Left/Bottom representation - smaller, simple, muted) -->
  <g transform="translate(55, 140)">
    <rect x="-20" y="-15" width="40" height="30" rx="4" fill="#2A303C" stroke="#3A4252" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#3A4252"/>
  </g>

  <!-- High-End / Premium tier (Right/Top representation - large, gold/orange accents, luxurious pedestal/glow) -->
  <g transform="translate(135, 100)">
    <!-- Luxurious glowing platform -->
    <ellipse cx="0" cy="55" rx="55" ry="16" fill="#F5A623" opacity="0.15"/>
    <ellipse cx="0" cy="55" rx="40" ry="10" fill="#F5A623" opacity="0.3"/>

    <!-- Pedestal / Display Stand -->
    <path d="M-30 45 L30 45 L20 20 L-20 20 Z" fill="#2C323E" stroke="#F5A623" stroke-width="1.5"/>
    
    <!-- Premium Product (Sleek minimalist luxury bag / designer item with gold highlights) -->
    <!-- Main bag body -->
    <path d="M-22 15 L22 15 C26 15 28 18 26 22 L18 40 C17 42 15 43 13 43 L-13 43 C-15 43 -17 42 -18 40 L-26 22 C-28 18 -26 15 -22 15 Z" fill="#1E232D" stroke="#F5A623" stroke-width="2"/>
    
    <!-- Golden clasp / emblem -->
    <circle cx="0" cy="28" r="5" fill="#F5A623"/>
    <rect x="-2" y="26" width="4" height="4" fill="#1E232D"/>

    <!-- Handles -->
    <path d="M-12 15 C-12 5 12 5 12 15" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Premium Sparkles / Quality indicators -->
    <path d="M35 -20 L38 -10 L48 -7 L38 -4 L35 6 L32 -4 L22 -7 L32 -10 Z" fill="#F5A623"/>
    <path d="M-35 5 L-33 11 L-27 13 L-33 15 L-35 21 L-37 15 L-43 13 L-37 11 Z" fill="#F5A623" transform="scale(0.6) translate(-20, -10)"/>
  </g>

  <!-- Sleek connecting dynamic scale line emphasizing the leap to "High-End" -->
  <path d="M 65 130 C 85 110, 95 90, 115 80" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <polygon points="118,76 110,81 114,85" fill="#F5A623"/>
</svg>