<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Grid / Atmosphere for Editing/Script Context -->
  <g opacity="0.15">
    <line x1="30" y1="50" x2="210" y2="50" stroke="#8FA3BF" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="30" y1="80" x2="210" y2="80" stroke="#8FA3BF" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="30" y1="110" x2="160" y2="110" stroke="#8FA3BF" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Script / Document (representing the script/剧本 being edited) -->
  <g transform="translate(45, 45)">
    <!-- Document Base -->
    <rect x="0" y="0" width="110" height="130" rx="6" fill="#282D3D"/>
    <!-- Document Header -->
    <rect x="15" y="15" width="50" height="8" rx="4" fill="#404B69"/>
    <!-- Text Lines -->
    <rect x="15" y="35" width="80" height="4" rx="2" fill="#363F59"/>
    <rect x="15" y="47" width="70" height="4" rx="2" fill="#363F59"/>
    <rect x="15" y="59" width="80" height="4" rx="2" fill="#363F59"/>
    <rect x="15" y="71" width="45" height="4" rx="2" fill="#363F59"/>
    
    <!-- Original text crossed out (Redundant/Old ending) -->
    <path d="M15 95 L85 95" stroke="#FF5C5C" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 107 L60 107" stroke="#FF5C5C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Highlight box for the edit / modification -->
  <rect x="55" y="130" width="80" height="30" rx="4" fill="none" stroke="#FFA726" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- New edited text lines (Gold/Orange accent to show active modification) -->
  <g transform="translate(62, 138)">
    <rect x="0" y="0" width="50" height="5" rx="2.5" fill="#FFA726"/>
    <rect x="0" y="10" width="35" height="5" rx="2.5" fill="#FFA726"/>
  </g>

  <!-- Dynamic Human Interaction / Action (Hand holding a pen/pencil actively modifying) -->
  <g transform="translate(10, 20)">
    <!-- Motion Lines for Action (改动 - Action/Verb) -->
    <path d="M 120 120 Q 135 110 145 95" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M 126 128 Q 141 118 151 103" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Stylus / Editing Pen -->
    <g transform="translate(125, 85) rotate(-35)">
      <!-- Pen Body -->
      <rect x="0" y="0" width="8" height="60" rx="4" fill="#E6EDF5"/>
      <!-- Pen Tip -->
      <polygon points="0,60 8,60 4,75" fill="#FFA726"/>
      <!-- Pen Grip/Details -->
      <rect x="0" y="10" width="8" height="12" fill="#404B69"/>
      <rect x="0" y="30" width="8" height="6" fill="#404B69"/>
    </g>

    <!-- Hand holding pen (Sleek flat vector style) -->
    <path d="M110 135 C115 125 125 115 135 120 C145 125 140 135 130 145 C120 155 105 145 110 135 Z" fill="#F2A25C"/>
    <!-- Fingers wrapping -->
    <path d="M125 125 L138 108 C141 105 146 107 144 111 L133 130 Z" fill="#E08B45"/>
    <path d="M118 132 L130 118 C133 115 137 117 135 121 L125 137 Z" fill="#D47C37"/>
  </g>

  <!-- Sparkle/Success accent indicating a precise, smart change -->
  <g transform="translate(180, 55)">
    <path d="M0 10 L20 10 M10 0 L10 20" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="10" r="3" fill="#FFE0B2"/>
  </g>
  <g transform="translate(45, 175) scale(0.6)">
    <path d="M0 10 L20 10 M10 0 L10 20" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>