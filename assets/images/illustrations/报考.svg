<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient background elements for depth -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.5"/>

  <!-- Target Institution (Peking University architectural silhouette representation - classical gate roof & columns) -->
  <g transform="translate(65, 45)">
    <!-- Roof base/glow -->
    <path d="M15 35 L55 35 L65 45 L5 45 Z" fill="#3A4454" opacity="0.5"/>
    <!-- Main traditional roof -->
    <path d="M10 32 Q35 22 60 32 L70 42 Q35 34 0 42 Z" fill="#FFB703" opacity="0.2"/>
    <!-- Pillars -->
    <rect x="18" y="45" width="6" height="25" fill="#4A5568"/>
    <rect x="32" y="45" width="6" height="25" fill="#4A5568"/>
    <rect x="46" y="45" width="6" height="25" fill="#4A5568"/>
    <!-- Building base -->
    <rect x="12" y="70" width="46" height="6" rx="2" fill="#3A4454"/>
  </g>

  <!-- Application Form / Document floating centrally -->
  <g transform="translate(85, 90)">
    <!-- Document background shadow -->
    <rect x="2" y="2" width="70" height="85" rx="6" fill="#0D0F12" opacity="0.6"/>
    <!-- Document paper -->
    <rect x="0" y="0" width="70" height="85" rx="6" fill="#FFFFFF"/>
    
    <!-- Header accent bar -->
    <rect x="12" y="12" width="46" height="8" rx="4" fill="#FFB703"/>
    
    <!-- Form lines (simulated text) -->
    <rect x="12" y="28" width="35" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="12" y="38" width="46" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="12" y="48" width="40" height="4" rx="2" fill="#E2E8F0"/>
    
    <!-- Checkbox and checkmark (Application submitted/targeted) -->
    <rect x="12" y="60" width="12" height="12" rx="3" fill="#E2E8F0"/>
    <path d="M15 66 L18 69 L23 62" fill="none" stroke="#FF7043" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="61" width="30" height="10" rx="3" fill="#FFB703" opacity="0.3"/>
  </g>

  <!-- Dynamic Human Character Hand / Action (Verb: Registering/Applying) -->
  <g transform="translate(0, 0)">
    <!-- Motion lines indicating intent/action moving towards the document -->
    <path d="M45 130 C60 130, 70 135, 80 140" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M50 145 C62 145, 72 148, 82 150" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- Stylized modern arm/hand holding a pen pointing at the form -->
    <!-- Sleeve -->
    <path d="M0 175 L45 155 L55 175 L10 195 Z" fill="#3B82F6"/>
    
    <!-- Hand -->
    <path d="M45 155 C50 152, 60 148, 68 152 C73 155, 75 160, 72 165 C68 170, 58 172, 52 170 Z" fill="#FBBF24"/>
    
    <!-- Pen / Stylus -->
    <g transform="translate(55, 142) rotate(-35)">
      <!-- Pen Body -->
      <rect x="0" y="0" width="6" height="35" rx="3" fill="#FF7043"/>
      <!-- Pen Tip -->
      <polygon points="0,35 3,42 6,35" fill="#1A1D24"/>
      <!-- Glow/Focus point at tip -->
      <circle cx="3" cy="42" r="4" fill="#FFB703" opacity="0.8"/>
    </g>
  </g>

  <!-- Accent star/sparkle for successful registration concept -->
  <g transform="translate(170, 75)">
    <path d="M 0,-8 C 1,-3 3,-1 8,0 C 3,1 1,3 0,8 C -1,3 -3,1 -8,0 C -3,-1 -1,-3 0,-8 Z" fill="#FFB703"/>
  </g>
  <g transform="translate(60, 80) scale(0.6)">
    <path d="M 0,-8 C 1,-3 3,-1 8,0 C 3,1 1,3 0,8 C -1,3 -3,1 -8,0 C -3,-1 -1,-3 0,-8 Z" fill="#3B82F6"/>
  </g>
</svg>