<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize the subject -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.6"/>

  <!-- Conceptual Illustration: A human arm showing a clear, shallow scar (疤) -->
  <g transform="translate(12, 0)">
    <!-- Arm/Skin base -->
    <path d="M 50 160 C 50 120, 70 80, 110 65 C 130 57, 160 55, 185 60 C 190 61, 192 67, 188 71 C 160 98, 120 125, 95 175 C 92 181, 84 183, 79 179 C 62 165, 50 162, 50 160 Z" fill="#2D323E"/>
    
    <!-- Skin surface highlight layer -->
    <path d="M 57 156 C 57 122, 75 86, 112 71 C 131 63, 159 61, 182 66 C 160 92, 124 117, 98 167 C 82 166, 68 163, 57 156 Z" fill="#363C4D"/>

    <!-- The Scar (疤) - Long, shallow, texturized healing mark with high-contrast accent color -->
    <g transform="rotate(-32, 115, 115)">
      <!-- Outer subtle healing tissue/discoloration -->
      <path d="M 85 115 Q 115 112 145 118" stroke="#D18359" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.3"/>
      
      <!-- Main scar line (浅浅伤疤 - light, shallow scar texture) -->
      <path d="M 88 115 Q 112 113 142 117" stroke="#F5A372" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Tiny healing stitch/texture details characteristic of a scar -->
      <line x1="98" y1="113" x2="96" y2="117" stroke="#363C4D" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="112" y1="113" x2="114" y2="117" stroke="#363C4D" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="128" y1="114" x2="126" y2="118" stroke="#363C4D" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Anatomical contour highlights -->
    <path d="M 72 135 C 85 115, 105 95, 130 82" stroke="#43495B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Focal indicator dots (minimal, non-distracting) -->
  <circle cx="123" cy="118" r="2.5" fill="#FFB380" opacity="0.8"/>
  <circle cx="123" cy="118" r="6" fill="none" stroke="#FFB380" stroke-width="1" opacity="0.4"/>
</svg>