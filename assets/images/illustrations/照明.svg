<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative night sky elements -->
  <circle cx="50" cy="50" r="1" fill="#4A5568"/>
  <circle cx="190" cy="70" r="1.5" fill="#4A5568"/>
  <circle cx="170" cy="40" r="1" fill="#4A5568"/>
  <circle cx="70" cy="90" r="1" fill="#4A5568"/>

  <!-- Light beam / illumination triangle -->
  <polygon points="120,72 50,210 190,210" fill="url(#lightBeam)" opacity="0.85"/>

  <!-- Lamp Post Structure -->
  <!-- Top decorative cap -->
  <path d="M120,20 L132,32 L108,32 Z" fill="#2D3748"/>
  
  <!-- Lampshade / Fixture -->
  <path d="M100,32 L140,32 L152,56 L88,56 Z" fill="#4A5568"/>
  <rect x="95" y="52" width="50" height="6" rx="2" fill="#718096"/>

  <!-- Glowing bulb -->
  <circle cx="120" cy="64" r="8" fill="#F6E05E"/>
  <circle cx="120" cy="64" r="12" fill="#F6E05E" opacity="0.3"/>

  <!-- Curved arm connecting to pole -->
  <path d="M120,32 L120,20" stroke="#2D3748" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Main vertical pole -->
  <rect x="115" y="56" width="10" height="154" fill="#2D3748"/>

  <!-- Base of the lamp post -->
  <path d="M105,210 L135,210 L135,214 L105,214 Z" fill="#4A5568"/>

  <!-- Ground plane -->
  <rect x="0" y="210" width="240" height="30" fill="#14171D"/>

  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="lightBeam" x1="120" y1="64" x2="120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E05E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F6E05E" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
</svg>