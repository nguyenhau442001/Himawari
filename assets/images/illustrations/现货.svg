<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Shelf / Warehouse Rack Structure -->
  <g fill="none" stroke="#2E3440" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical supports -->
    <line x1="40" y1="50" x2="40" y2="200" />
    <line x1="200" y1="50" x2="200" y2="200" />
    <!-- Shelves (horizontal beams) -->
    <line x1="30" y1="100" x2="210" y2="100" />
    <line x1="30" y1="150" x2="210" y2="150" />
    <line x1="30" y1="200" x2="210" y2="200" />
  </g>

  <!-- Shadow under boxes -->
  <ellipse cx="120" cy="148" rx="65" ry="4" fill="#111318"/>
  <ellipse cx="95" cy="98" rx="45" ry="3" fill="#111318"/>

  <!-- Bottom Shelf: Ready stock boxes (现货) with high-contrast accent color (Gold/Orange) -->
  <g>
    <!-- Box 1 (Left) -->
    <path d="M 60 115 L 90 100 L 120 115 L 90 130 Z" fill="#D08770" />
    <path d="M 60 115 L 60 142 L 90 157 L 90 130 Z" fill="#BF616A" />
    <path d="M 120 115 L 120 142 L 90 157 L 90 130 Z" fill="#A54F58" />
    
    <!-- Box 2 (Center - Main focus) -->
    <path d="M 90 105 L 120 90 L 150 105 L 120 120 Z" fill="#EBCB8B" />
    <path d="M 90 105 L 90 135 L 120 150 L 120 120 Z" fill="#D0B067" />
    <path d="M 150 105 L 150 135 L 120 150 L 120 120 Z" fill="#BA9B52" />

    <!-- Box 3 (Right) -->
    <path d="M 120 115 L 150 100 L 180 115 L 150 130 Z" fill="#D08770" />
    <path d="M 120 115 L 120 142 L 150 157 L 150 130 Z" fill="#BF616A" />
    <path d="M 180 115 L 180 142 L 150 157 L 150 130 Z" fill="#A54F58" />
  </g>

  <!-- Top Shelf: Additional stock boxes to complete the warehouse feel -->
  <g opacity="0.8">
    <path d="M 75 68 L 95 58 L 115 68 L 95 78 Z" fill="#88C0D0" />
    <path d="M 75 68 L 75 88 L 95 98 L 95 78 Z" fill="#5E81AC" />
    <path d="M 115 68 L 115 88 L 95 98 L 95 78 Z" fill="#4C6B91" />

    <path d="M 115 68 L 135 58 L 155 68 L 135 78 Z" fill="#EBCB8B" />
    <path d="M 115 68 L 115 88 L 135 98 L 135 78 Z" fill="#D0B067" />
    <path d="M 155 68 L 155 88 L 135 98 L 135 78 Z" fill="#BA9B52" />
  </g>

  <!-- Prominent checkmark / ready symbol floating clearly above the central item to emphasize "available in stock / ready to ship" -->
  <g transform="translate(120, 52)">
    <circle cx="0" cy="0" r="16" fill="#A3BE8C" />
    <path d="M -6 -1 L -2 4 L 7 -5" fill="none" stroke="#2E3440" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>