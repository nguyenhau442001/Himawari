<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background glowing aura for hot pot warmth -->
  <circle cx="120" cy="130" r="60" fill="#FF5722" opacity="0.1" filter="blur(10px)"/>

  <!-- Hot Pot Base and Body -->
  <!-- Pot stand/base -->
  <path d="M 90 190 L 150 190 L 140 175 L 100 175 Z" fill="#374151"/>
  
  <!-- Outer Pot Bowl -->
  <path d="M 70 120 C 70 160 170 160 170 120 Z" fill="#4B5563"/>
  
  <!-- Pot Rim -->
  <ellipse cx="120" cy="120" rx="52" ry="14" fill="#9CA3AF"/>
  
  <!-- Yin-Yang Divider Inside Pot -->
  <path d="M 120 108 C 127 108 132 114 132 120 C 132 126 127 132 120 132 C 113 132 108 126 108 120 C 108 114 113 108 120 108 Z" fill="#EF4444" opacity="0.2"/>
  
  <!-- Spicy Broth (Left) -->
  <path d="M 72 120 C 72 155 120 158 120 132 C 113 132 108 126 108 120 C 108 114 113 108 120 108 C 120 82 72 85 72 120 Z" fill="#DC2626"/>
  <!-- Clear Broth (Right) -->
  <path d="M 168 120 C 168 155 120 158 120 132 C 127 132 132 126 132 120 C 132 114 127 108 120 108 C 120 82 168 85 168 120 Z" fill="#F59E0B" opacity="0.8"/>

  <!-- Floating Ingredients in Pot -->
  <circle cx="95" cy="125" r="4" fill="#10B981"/>
  <circle cx="105" cy="135" r="3" fill="#E5E7EB"/>
  <circle cx="145" cy="128" r="4" fill="#EF4444"/>

  <!-- Steam / Heat Rising Waves (Motion lines for action) -->
  <path d="M 105 95 C 100 85 110 75 105 65" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 120 90 C 125 78 115 70 120 58" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 135 95 C 140 85 130 75 135 65" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Dynamic Chopsticks Action (Verb: dipping/shuan) -->
  <!-- Hand holding chopsticks (simplified graphic representation) -->
  <path d="M 140 35 L 180 85" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <path d="M 145 33 L 183 80" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Food slice held by chopsticks dipping into the broth -->
  <path d="M 175 75 L 195 65 L 185 85 Z" fill="#F43F5E"/>

  <!-- Motion lines indicating dipping action (Up and down / swirling) -->
  <path d="M 165 95 Q 175 105 165 115" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  <path d="M 172 100 Q 182 110 172 120" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" fill="none"/>

  <!-- Ambient winter element: subtle snowflakes in dark mode -->
  <circle cx="40" cy="50" r="1.5" fill="#93C5FD" opacity="0.5"/>
  <circle cx="200" cy="40" r="2" fill="#93C5FD" opacity="0.4"/>
  <circle cx="30" cy="150" r="1" fill="#93C5FD" opacity="0.3"/>
  <circle cx="210" cy="180" r="1.5" fill="#93C5FD" opacity="0.5"/>
</svg>