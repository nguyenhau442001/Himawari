<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric night elements (summer grass silhouettes at the bottom) -->
  <path d="M0 240 L0 205 C15 200, 25 210, 40 205 C55 200, 65 195, 85 200 C105 205, 120 190, 140 195 C160 200, 175 190, 195 198 C215 206, 225 200, 240 202 L240 240 Z" fill="#12151B"/>
  <path d="M0 240 L0 215 C20 212, 35 220, 55 215 C75 210, 90 222, 115 218 C140 214, 160 220, 185 215 C210 210, 225 216, 240 212 L240 240 Z" fill="#0D0F13"/>

  <!-- Grass blades silhouetted -->
  <path d="M20 240 L18 190 L24 240 Z" fill="#12151B"/>
  <path d="M30 240 L35 180 L40 240 Z" fill="#0D0F13"/>
  <path d="M75 240 L70 185 L80 240 Z" fill="#12151B"/>
  <path d="M110 240 L115 175 L122 240 Z" fill="#0D0F13"/>
  <path d="M165 240 L160 182 L170 240 Z" fill="#12151B"/>
  <path d="M205 240 L212 188 L218 240 Z" fill="#0D0F13"/>

  <!-- Ambient light glows (Soft background gradients) -->
  <circle cx="85" cy="110" r="45" fill="#FFB703" opacity="0.08" filter="blur(8px)"/>
  <circle cx="155" cy="95" r="50" fill="#FFB703" opacity="0.1" filter="blur(10px)"/>
  <circle cx="120" cy="150" r="40" fill="#FFB703" opacity="0.06" filter="blur(8px)"/>

  <!-- Glowing Firefly 1 (Center-Left) -->
  <g>
    <!-- Outer light aura -->
    <circle cx="85" cy="110" r="18" fill="#FFD166" opacity="0.25"/>
    <circle cx="85" cy="110" r="10" fill="#FFEE93" opacity="0.5"/>
    <!-- Wings -->
    <ellipse cx="80" cy="103" rx="4" ry="7" fill="#E9F5DB" opacity="0.6" transform="rotate(-25 80 103)"/>
    <ellipse cx="90" cy="103" rx="4" ry="7" fill="#E9F5DB" opacity="0.6" transform="rotate(25 90 103)"/>
    <!-- Body & Head -->
    <ellipse cx="85" cy="108" rx="3.5" ry="6" fill="#3D405B"/>
    <circle cx="85" cy="103" r="2.5" fill="#3D405B"/>
    <!-- Glowing Abdomen (The "发光" source) -->
    <ellipse cx="85" cy="114" rx="4.5" ry="6" fill="#FFD166"/>
    <ellipse cx="85" cy="114" rx="2.5" ry="4" fill="#FFFFFF"/>
  </g>

  <!-- Glowing Firefly 2 (Main Hero - Center-Right) -->
  <g>
    <!-- Outer light aura -->
    <circle cx="155" cy="95" r="24" fill="#FFB703" opacity="0.22"/>
    <circle cx="155" cy="95" r="14" fill="#FFD166" opacity="0.4"/>
    <!-- Wings -->
    <ellipse cx="149" cy="87" rx="5" ry="9" fill="#E9F5DB" opacity="0.7" transform="rotate(-30 149 87)"/>
    <ellipse cx="161" cy="87" rx="5" ry="9" fill="#E9F5DB" opacity="0.7" transform="rotate(30 161 87)"/>
    <!-- Body & Head -->
    <ellipse cx="155" cy="93" rx="4.5" ry="8" fill="#2B2D42"/>
    <circle cx="155" cy="86" r="3" fill="#2B2D42"/>
    <!-- Glowing Abdomen (The core "发光" noun representation) -->
    <ellipse cx="155" cy="100" rx="6" ry="8" fill="#FFD166"/>
    <ellipse cx="155" cy="100" rx="3.5" ry="5.5" fill="#FFFFFF"/>
  </g>

  <!-- Glowing Firefly 3 (Foreground Right) -->
  <g>
    <!-- Outer light aura -->
    <circle cx="120" cy="150" r="16" fill="#FFD166" opacity="0.3"/>
    <!-- Wings -->
    <ellipse cx="116" cy="144" rx="3" ry="5" fill="#E9F5DB" opacity="0.6" transform="rotate(-15 116 144)"/>
    <ellipse cx="124" cy="144" rx="3" ry="5" fill="#E9F5DB" opacity="0.6" transform="rotate(15 124 144)"/>
    <!-- Body -->
    <ellipse cx="120" cy="148" rx="3" ry="5" fill="#3D405B"/>
    <!-- Glowing Abdomen -->
    <ellipse cx="120" cy="153" rx="4" ry="5.5" fill="#FFD166"/>
    <ellipse cx="120" cy="153" rx="2" ry="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Minor floating light sparkles -->
  <circle cx="105" cy="75" r="1.5" fill="#FFEE93" opacity="0.9"/>
  <circle cx="180" cy="130" r="2" fill="#FFEE93" opacity="0.8"/>
  <circle cx="60" cy="140" r="1.5" fill="#FFEE93" opacity="0.7"/>
  <circle cx="138" cy="170" r="2" fill="#FFEE93" opacity="0.8"/>
  <circle cx="95" cy="180" r="1" fill="#FFEE93" opacity="0.6"/>

  <!-- Light sparkle cross-accents -->
  <path d="M155 72 L155 80 M151 76 L159 76" stroke="#FFEE93" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <path d="M85 93 L85 97 M83 95 L87 95" stroke="#FFEE93" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
</svg>