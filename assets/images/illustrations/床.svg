<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow and reflection -->
  <ellipse cx="120" cy="180" rx="85" ry="12" fill="#121419"/>

  <!-- Bed Frame & Headboard -->
  <g id="bed-frame">
    <!-- Back legs -->
    <rect x="52" y="145" width="6" height="25" fill="#3E4451" rx="2"/>
    <rect x="182" y="145" width="6" height="25" fill="#3E4451" rx="2"/>
    
    <!-- Headboard (Darker wood/slate tone) -->
    <rect x="44" y="65" width="152" height="90" rx="8" fill="#2C323D"/>
    
    <!-- Headboard inner accent panel -->
    <rect x="52" y="73" width="136" height="74" rx="4" fill="#232730"/>
    
    <!-- Bed base / Platform -->
    <rect x="40" y="130" width="160" height="35" rx="4" fill="#374151"/>
    
    <!-- Front legs -->
    <rect x="52" y="160" width="8" height="15" fill="#1F232B" rx="2"/>
    <rect x="180" y="160" width="8" height="15" fill="#1F232B" rx="2"/>
  </g>

  <!-- Mattress (Thick, comfortable, modern flat design) -->
  <g id="mattress">
    <!-- Mattress base -->
    <rect x="36" y="105" width="168" height="35" rx="8" fill="#E5E7EB"/>
    <!-- Mattress side depth shading -->
    <path d="M 36 125 L 204 125 L 204 135 C 204 139.418 200.418 143 196 143 L 44 143 C 39.5817 143 36 139.418 36 135 Z" fill="#D1D5DB"/>
  </g>

  <!-- Bedding & Comforter (Accent Color: Warm Amber/Orange for focus) -->
  <g id="bedding">
    <!-- Comforter base -->
    <path d="M 65 115 L 204 115 L 204 132 C 204 137 200 141 195 141 L 65 141 Z" fill="#F59E0B"/>
    <path d="M 65 115 L 204 115 L 204 132 C 204 137 200 141 195 141 L 65 141 Z" fill="#D97706" opacity="0.3"/>
    
    <!-- Folded top sheet layer -->
    <path d="M 65 115 L 140 115 L 140 130 L 65 130 Z" fill="#FEF3C7"/>
    
    <!-- Pillows (Plump, angled slightly for modern look) -->
    <!-- Left Pillow -->
    <g transform="rotate(-5 82 95)">
      <rect x="68" y="82" width="50" height="28" rx="8" fill="#F9FAFB"/>
      <rect x="68" y="96" width="50" height="14" rx="4" fill="#E5E7EB"/>
    </g>
    <!-- Right Pillow -->
    <g transform="rotate(5 158 95)">
      <rect x="122" y="82" width="50" height="28" rx="8" fill="#F9FAFB"/>
      <rect x="122" y="96" width="50" height="14" rx="4" fill="#E5E7EB"/>
    </g>
  </g>

  <!-- Modern minimalist accent lighting / glow to emphasize object -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.15" stroke-dasharray="6 6"/>
</svg>