<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Cityscape Background -->
  <path d="M20 180 L80 140 L140 180 Z" fill="#334155"/>
  <path d="M160 190 L220 150 L240 240 L140 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Government Official Character -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="15" fill="#f8fafc"/>
    <path d="M5 35 Q20 50 35 35 L30 80 L10 80 Z" fill="#38bdf8"/>
    <rect x="15" y="80" width="4" height="20" fill="#38bdf8"/>
    <rect x="21" y="80" width="4" height="20" fill="#38bdf8"/>
    <circle cx="15" cy="18" r="2" fill="#0f172a"/>
    <circle cx="25" cy="18" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Presenting the Idea (Low Carbon Concept) -->
  <path d="M100 120 L160 100 L160 160 L100 180 Z" fill="#fbbf24" opacity="0.2"/>
  <path d="M110 130 L150 115 L150 150 L110 165 Z" fill="#f59e0b"/>
  
  <!-- Low Carbon Symbols (Bicycle and Leaf) -->
  <g transform="translate(120, 125) scale(0.8)">
    <circle cx="10" cy="20" r="6" fill="#10b981"/>
    <circle cx="30" cy="20" r="6" fill="#10b981"/>
    <path d="M10 20 L20 10 L30 20" stroke="#10b981" stroke-width="3" fill="none"/>
    <path d="M20 10 L20 20" stroke="#10b981" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="50" r="3" fill="#fb923c"/>
  <circle cx="180" cy="40" r="2" fill="#ec4899"/>
  <path d="M40 60 L50 50 L60 60 L50 70 Z" fill="#38bdf8" opacity="0.5"/>
  
  <!-- Ground -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a"/>
</svg>