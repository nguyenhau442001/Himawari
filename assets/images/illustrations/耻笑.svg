<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Character / Physical Object representing the Noun: The Object of Mockery / Pointing Figures -->
  
  <!-- Subtle spotlight / floor shadow for depth -->
  <ellipse cx="120" cy="195" rx="55" ry="10" fill="#111318" opacity="0.8"/>
  
  <!-- Person being mocked (center, slouched posture, feeling small/ashamed due to temporary failure) -->
  <g transform="translate(0, 5)">
    <!-- Body/Torso (slouched) -->
    <path d="M102 125 C102 112 108 105 120 105 C132 105 138 112 138 125 L145 170 C145 175 141 178 136 178 L104 178 C99 178 95 175 95 170 Z" fill="#2E384D"/>
    
    <!-- Head (bowed slightly downward) -->
    <circle cx="120" cy="90" r="16" fill="#D4A373"/>
    
    <!-- Downcast face profile/expression elements -->
    <path d="M125 94 Q120 98 115 94" stroke="#6C757D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M112 87 Q115 89 118 87" stroke="#6C757D" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Drooping shoulders / crossed arms showing vulnerability -->
    <path d="M102 118 Q120 128 138 118" stroke="#3E4C66" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Mocking Figures / Pointing Hands (The physical manifestation of '耻笑' - pointing and jeering) -->
  
  <!-- Left Mocking Figure (Partial/Stylized shadow character leaning in) -->
  <g transform="translate(45, 70)">
    <circle cx="20" cy="30" r="12" fill="#E0A96D"/>
    <path d="M20 42 C15 42 10 50 10 70 L30 70 C30 50 25 42 20 42 Z" fill="#E056FD" opacity="0.15"/>
    <!-- Pointing Arm & Finger directed at center -->
    <path d="M28 45 L58 35" stroke="#E056FD" stroke-width="6" stroke-linecap="round"/>
    <!-- Pointing index finger accent -->
    <circle cx="62" cy="34" r="3" fill="#FF4757"/>
    <!-- Mocking open mouth smile indicator -->
    <path d="M14 33 Q20 39 26 33" stroke="#2B2D42" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right Mocking Figure (Partial/Stylized shadow character leaning in) -->
  <g transform="translate(150, 70)">
    <circle cx="20" cy="30" r="12" fill="#E0A96D"/>
    <!-- Pointing Arm & Finger directed at center from right -->
    <path d="M12 45 L-18 35" stroke="#E056FD" stroke-width="6" stroke-linecap="round"/>
    <!-- Pointing index finger accent -->
    <circle cx="-22" cy="34" r="3" fill="#FF4757"/>
    <!-- Mocking open mouth smile indicator -->
    <path d="M14 33 Q20 39 26 33" stroke="#2B2D42" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Visual focus accents: sharp high-contrast orange/gold rays or derogatory chatter echoes (abstracted cleanly) -->
  <path d="M85 75 Q75 65 65 70" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M155 75 Q165 65 175 70" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M90 60 Q85 50 75 50" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M150 60 Q155 50 165 50" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  
</svg>