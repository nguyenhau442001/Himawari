<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmosphere/Sky Gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#2D3446"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#sky)"/>

  <!-- High Altitude Wire -->
  <line x1="0" y1="120" x2="240" y2="120" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Acrobat -->
  <g transform="translate(120, 110)">
    <!-- Pole -->
    <rect x="-40" y="-2" width="80" height="4" fill="#E2E8F0" rx="2"/>
    <!-- Body -->
    <circle cx="0" cy="-15" r="8" fill="#F6AD55"/>
    <rect x="-3" y="-7" width="6" height="15" fill="#F6AD55"/>
    <!-- Arms -->
    <path d="M-25 -10 L25 -10" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M-5 8 L-10 25" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 8 L10 25" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Distant Clouds for scale -->
  <path d="M30 40 Q40 30 50 40 T70 40" stroke="#2D3748" stroke-width="2" fill="none"/>
  <path d="M180 60 Q190 50 200 60 T220 60" stroke="#2D3748" stroke-width="2" fill="none"/>
  <path d="M100 180 Q110 170 120 180 T140 180" stroke="#2D3748" stroke-width="2" fill="none"/>
</svg>