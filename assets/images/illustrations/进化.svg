<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Decorative Elements (Subtle geological strata / time passing) -->
  <g opacity="0.15">
    <path d="M 30,190 Q 90,170 150,195 T 240,185" fill="none" stroke="#64748B" stroke-width="2"/>
    <path d="M 20,210 Q 100,195 180,215 T 240,205" fill="none" stroke="#64748B" stroke-width="2"/>
  </g>

  <!-- Evolution stages connecting arrow -->
  <path d="M 65,130 C 95,130 115,100 145,100 C 165,100 180,85 190,70" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Stage 1: Primitive Aquatic/Amphibian Form (Left/Bottom) -->
  <g transform="translate(45, 115)">
    <!-- Body -->
    <ellipse cx="20" cy="20" rx="16" ry="11" fill="#38BDF8"/>
    <!-- Tail -->
    <path d="M 36,20 C 45,15 50,8 52,5 C 50,15 45,25 36,28 Z" fill="#38BDF8"/>
    <!-- Fin/Details -->
    <path d="M 12,9 Q 15,3 22,7" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="16" r="2" fill="#0F172A"/>
    <!-- Tiny legs -->
    <rect x="12" y="29" width="3" height="6" rx="1.5" fill="#0284C7"/>
    <rect x="23" y="29" width="3" height="6" rx="1.5" fill="#0284C7"/>
  </g>

  <!-- Stage 2: Transitional Terrestrial Form (Middle) -->
  <g transform="translate(105, 80)">
    <!-- Body -->
    <ellipse cx="22" cy="25" rx="18" ry="13" fill="#34D399"/>
    <!-- Head -->
    <circle cx="36" cy="17" r="10" fill="#34D399"/>
    <circle cx="40" cy="15" r="2" fill="#065F46"/>
    <!-- Tail -->
    <path d="M 4,25 C -4,22 -8,15 -12,10 C -7,20 0,27 4,30 Z" fill="#34D399"/>
    <!-- Legs -->
    <rect x="12" y="35" width="4" height="10" rx="2" fill="#059669"/>
    <rect x="28" y="35" width="4" height="10" rx="2" fill="#059669"/>
    <path d="M 8,28 Q 12,32 16,36" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Stage 3: Advanced Upright/Bipedal Form (Right/Top) - Focal Point -->
  <g transform="translate(160, 40)">
    <!-- Glow/Aura for Focus -->
    <circle cx="30" cy="40" r="28" fill="#F59E0B" opacity="0.12"/>

    <!-- Head -->
    <circle cx="30" cy="18" r="9" fill="#FBBF24"/>
    <path d="M 26,17 Q 30,15 34,17" fill="none" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Torso (Dynamic leaning forward, showing progress/climbing) -->
    <path d="M 24,28 Q 32,27 34,42 L 30,55 L 22,50 Z" fill="#F59E0B"/>

    <!-- Arms (Action pose) -->
    <path d="M 28,32 L 18,42" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
    <path d="M 32,34 L 42,28" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>

    <!-- Legs (Walking/Advancing stride) -->
    <path d="M 30,53 L 20,68" fill="none" stroke="#D97706" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 30,53 L 38,65" fill="none" stroke="#D97706" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Ground Line representing timeline progression -->
  <path d="M 30,200 L 210,200" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Step markers on ground -->
  <circle cx="65" cy="200" r="3" fill="#64748B"/>
  <circle cx="125" cy="200" r="3" fill="#64748B"/>
  <circle cx="190" cy="200" r="4" fill="#F59E0B"/>
</svg>