<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Architectural Background (Moon Gate) -->
  <circle cx="120" cy="110" r="75" fill="#252932"/>
  <circle cx="120" cy="110" r="72" fill="none" stroke="#3D4451" stroke-width="1"/>

  <!-- Ancestor Figures (Traditional Portrait Style) -->
  <!-- Male Ancestor (Left) -->
  <g transform="translate(75, 80)">
    <!-- Robe -->
    <path d="M0 80 L45 80 L40 25 C40 15 35 10 22 10 C10 10 5 15 5 25 Z" fill="#3D4451"/>
    <path d="M22 10 L22 80" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
    <!-- Head and Beard -->
    <circle cx="22" cy="15" r="12" fill="#E0E0E0"/>
    <path d="M12 18 Q22 45 32 18" fill="#FFFFFF"/> <!-- Long Beard -->
    <path d="M10 10 L34 10 L30 2 L14 2 Z" fill="#2D323E"/> <!-- Traditional Cap -->
  </g>

  <!-- Female Ancestor (Right) -->
  <g transform="translate(120, 80)">
    <!-- Robe -->
    <path d="M0 80 L45 80 L40 25 C40 15 35 10 22 10 C10 10 5 15 5 25 Z" fill="#3D4451"/>
    <path d="M22 10 L22 80" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
    <!-- Head and Hair Bun -->
    <circle cx="22" cy="15" r="11" fill="#E0E0E0"/>
    <path d="M12 10 C12 2 32 2 32 10 L32 15 L12 15 Z" fill="#2D323E"/> <!-- Hair Bun -->
    <circle cx="32" cy="8" r="3" fill="#FFD700"/> <!-- Hair Ornament -->
  </g>

  <!-- Incense Burner (Censer) - The Ritual Object -->
  <g transform="translate(100, 175)">
    <!-- Censer Bowl -->
    <path d="M0 10 Q0 30 20 30 Q40 30 40 10 Z" fill="#4A4E5A"/>
    <rect x="5" y="28" width="5" height="6" rx="1" fill="#4A4E5A"/>
    <rect x="30" y="28" width="5" height="6" rx="1" fill="#4A4E5A"/>
    
    <!-- Incense Sticks -->
    <line x1="15" y1="12" x2="15" y2="-10" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="20" y1="10" x2="20" y2="-15" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="25" y1="12" x2="25" y2="-10" stroke="#FF8C00" stroke-width="1.5"/>
    
    <!-- Glowing Tips -->
    <circle cx="15" cy="-10" r="1.5" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="20" cy="-15" r="1.5" fill="#FFD700">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="25" cy="-10" r="1.5" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Stylized Smoke -->
    <path d="M18 -20 Q15 -30 20 -35" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
    <path d="M22 -22 Q25 -32 20 -40" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Golden Lineage Accent -->
  <path d="M60 165 L180 165" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>