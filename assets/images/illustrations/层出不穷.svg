<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(20, 40)">
    <!-- Desk -->
    <rect x="0" y="120" width="200" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="130" width="10" height="50" fill="#334155"/>
    <rect x="170" y="130" width="10" height="50" fill="#334155"/>
    
    <!-- Character -->
    <circle cx="100" cy="60" r="25" fill="#fde68a"/>
    <path d="M85 65 Q100 75 115 65" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="90" cy="55" r="3" fill="#1e293b"/>
    <circle cx="110" cy="55" r="3" fill="#1e293b"/>
    <rect x="70" y="85" width="60" height="40" rx="5" fill="#f8fafc"/>
    
    <!-- Floating Problems (The "层出不穷" visual) -->
    <g fill="#fb923c">
      <path d="M160 30 L175 10 L190 30 Z" opacity="0.9"/>
      <circle cx="180" cy="50" r="8" opacity="0.8"/>
      <rect x="150" y="70" width="15" height="15" rx="2" opacity="0.7"/>
      <path d="M170 100 L185 80 L200 100 Z" opacity="0.6"/>
      <circle cx="195" cy="120" r="6" opacity="0.5"/>
    </g>
    
    <!-- Paper stacks -->
    <rect x="10" y="100" width="40" height="20" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="95" width="40" height="20" rx="2" fill="#94a3b8"/>
    <rect x="14" y="90" width="40" height="20" rx="2" fill="#64748b"/>
    
    <!-- Coffee Mug -->
    <rect x="150" y="100" width="20" height="20" rx="2" fill="#ec4899"/>
    <path d="M170 105 Q175 105 175 115" stroke="#ec4899" stroke-width="3" fill="none"/>
    
    <!-- Motion lines for stress -->
    <path d="M135 50 Q145 40 155 50" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M135 60 Q145 50 155 60" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>
</svg>