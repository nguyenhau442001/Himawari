<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(30, 25)">
    <!-- Globe Grid / Ocean Background -->
    <circle cx="90" cy="95" r="75" fill="#222733"/>
    <path d="M 15 95 Q 90 60 165 95" stroke="#2D3342" stroke-width="1.5" fill="none"/>
    <path d="M 15 95 Q 90 130 165 95" stroke="#2D3342" stroke-width="1.5" fill="none"/>
    <path d="M 90 20 Q 55 95 90 170" stroke="#2D3342" stroke-width="1.5" fill="none"/>
    <path d="M 90 20 Q 125 95 90 170" stroke="#2D3342" stroke-width="1.5" fill="none"/>
    <circle cx="90" cy="95" r="75" stroke="#3A4254" stroke-width="2" fill="none"/>

    <!-- North America Continent Silhouette -->
    <!-- Canada/Alaska/Greenland area + USA + Mexico narrowed down -->
    <path d="M 75 40 
             L 85 38 L 95 45 L 110 42 L 115 50 L 105 58 L 115 62 L 125 65 L 120 72 L 105 78 L 95 85 L 90 92 L 98 105 L 102 118 L 95 125 L 85 135 L 78 125 L 75 115 L 70 110 L 62 105 L 55 98 L 50 90 L 45 80 L 52 75 L 60 78 L 68 70 L 65 60 L 72 50 Z" 
          fill="#3B82F6" opacity="0.85"/>
          
    <!-- Subtle secondary continent shape for context (South America tip & Greenland) -->
    <path d="M 102 128 L 108 135 L 105 145 L 98 140 Z" fill="#2D3342" opacity="0.7"/>
    <path d="M 125 35 L 132 32 L 135 40 L 128 45 Z" fill="#2D3342" opacity="0.7"/>

    <!-- Location Marker / Pin highlighting North America -->
    <g transform="translate(85, 75)">
      <!-- Pin Shadow -->
      <ellipse cx="5" cy="22" r="4" fill="#000000" opacity="0.4"/>
      <!-- Pin Body -->
      <path d="M 5 0 C 2.2 0 0 2.2 0 5 C 0 8.5 5 18 5 18 C 5 18 10 8.5 10 5 C 10 2.2 7.8 0 5 0 Z" fill="#F59E0B"/>
      <!-- Inner Dot -->
      <circle cx="5" cy="5" r="2" fill="#1A1D24"/>
    </g>

    <!-- Decorative Orbit / Meridian Ring -->
    <ellipse cx="90" cy="95" rx="88" ry="32" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 8" fill="none" transform="rotate(-15 90 95)" opacity="0.6"/>
  </g>
</svg>