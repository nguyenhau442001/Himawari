<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Frying Pan Base -->
    <path d="M 65 145 C 65 165, 85 180, 120 180 C 155 180, 175 165, 175 145 Z" fill="#3A4250" />
    <path d="M 70 145 L 170 145 C 170 145, 165 138, 120 138 C 75 138, 70 145, 70 145 Z" fill="#4E5D6C" />
    <ellipse cx="120" cy="145" rx="50" ry="8" fill="#2C3440" />
    <rect x="165" y="135" width="55" height="10" rx="5" fill="#3A4250" />
    <circle cx="212" cy="140" r="3" fill="#1A1D24" />

    <!-- Cooking Oil Liquid inside Pan -->
    <ellipse cx="120" cy="145" rx="42" ry="6" fill="#F39C12" opacity="0.85" />
    <ellipse cx="110" cy="144" rx="20" ry="3" fill="#F1C40F" opacity="0.6" />

    <!-- Oil Bottle / Container -->
    <!-- Bottle Body -->
    <path d="M 102 55 L 138 55 C 142 55, 145 58, 145 62 L 145 115 C 145 120, 142 123, 138 123 L 102 123 C 98 123, 95 120, 95 115 L 95 62 C 95 58, 98 55, 102 55 Z" fill="#2980B9" opacity="0.9" />
    <!-- Bottle Label -->
    <rect x="100" y="75" width="40" height="30" rx="4" fill="#ECF0F1" />
    <circle cx="120" cy="90" r="8" fill="#F39C12" />

    <!-- Bottle Neck & Cap -->
    <rect x="111" y="42" width="18" height="13" rx="2" fill="#3A4250" />
    <rect x="108" y="34" width="24" height="9" rx="3" fill="#E74C3C" />

    <!-- Pouring Oil Stream -->
    <path d="M 112 123 C 112 135, 108 140, 114 144 C 116 145, 118 145, 118 144 C 112 140, 116 135, 116 123 Z" fill="#F39C12" />
    
    <!-- Oil Droplets / Splashes -->
    <circle cx="128" cy="132" r="3" fill="#F1C40F" />
    <circle cx="103" cy="136" r="2" fill="#F39C12" />
    
    <!-- Highlights -->
    <path d="M 99 65 L 99 110" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.25" />
    <circle cx="120" cy="24" r="3" fill="#F39C12" opacity="0.6" />
    <circle cx="135" cy="30" r="2" fill="#F1C40F" opacity="0.4" />
