<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 癌 (cancer/tumor biology theme in sleek modern flat vector style) -->
  <g transform="translate(120, 120)">
    <!-- Subtle medical cross backdrop / grid pattern for context -->
    <circle cx="0" cy="0" r="72" fill="#222733" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#2D3748" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Healthy cell cluster base / background layers -->
    <path d="M-30,-20 C-40,-40 -10,-60 10,-45 C30,-30 45,-50 60,-35 C75,-20 60,10 50,30 C40,50 10,45 -10,50 C-30,55 -55,20 -30,-20 Z" fill="#2B4C7E" opacity="0.4"/>

    <!-- Abnormal / malignant focal cell cluster (Orange/Gold accent for focus & medical attention) -->
    <g>
      <!-- Main aberrant growth cell body -->
      <path d="M-15,-25 C5,-45 45,-30 40,-5 C35,20 50,45 25,50 C0,55 -25,45 -35,20 C-45,-5 -35,-5 -15,-25 Z" fill="#D97706" />
      <path d="M-10,-20 C2,-35 35,-25 30,-5 C25,15 40,35 20,40 C0,45 -20,35 -25,15 C-30,-5 -22,-5 -10,-20 Z" fill="#F59E0B" />

      <!-- Irregular nuclei (multi-nucleated / abnormal hallmark) -->
      <circle cx="5" cy="5" r="10" fill="#1A1D24" />
      <circle cx="3" cy="3" r="4" fill="#EF4444" />

      <circle cx="-12" cy="15" r="7" fill="#1A1D24" />
      <circle cx="-12" cy="15" r="2.5" fill="#EF4444" />

      <circle cx="15" cy="-12" r="6" fill="#1A1D24" />
      <circle cx="15" cy="-12" r="2" fill="#EF4444" />

      <!-- Cellular distortion / aggressive pseudopodia spikes -->
      <path d="M30,-5 L52,-15 L38,5 Z" fill="#F59E0B" />
      <path d="M20,40 L35,58 L10,48 Z" fill="#F59E0B" />
      <path d="M-25,15 L-48,25 L-30,0 Z" fill="#F59E0B" />
      <path d="M-10,-20 L-22,-42 L0,-28 Z" fill="#F59E0B" />
    </g>

    <!-- Medical magnifying glass / diagnostic focus overlay representing '早发现、早诊断' -->
    <g transform="translate(15, 10)">
      <!-- Glass Rim -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.9"/>
      <!-- Glass Reflection/Sheen -->
      <path d="M-30,-30 C-15,-42 15,-42 30,-30" fill="none" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <!-- Handle -->
      <path d="M34,34 L62,62" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
      <rect x="53" y="53" width="16" height="16" rx="4" transform="rotate(45 61 61)" fill="#0284C7"/>
    </g>
  </g>
</svg>