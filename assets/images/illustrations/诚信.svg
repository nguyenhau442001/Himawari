<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Central Physical Object representing 诚信 (Integrity/Trust - Handshake / Contract seal motif) -->
  <g transform="translate(0, 0)">
    <!-- Document Base / Contract -->
    <rect x="76" y="65" width="88" height="110" rx="6" fill="#2D3340" stroke="#3F485B" stroke-width="2"/>
    
    <!-- Document Lines (Abstract text representation) -->
    <line x1="96" y1="90" x2="144" y2="90" stroke="#4F5D73" stroke-width="4" stroke-linecap="round"/>
    <line x1="96" y1="110" x2="134" y2="110" stroke="#4F5D73" stroke-width="4" stroke-linecap="round"/>
    <line x1="96" y1="130" x2="120" y2="130" stroke="#4F5D73" stroke-width="4" stroke-linecap="round"/>

    <!-- Gold Wax Seal / Stamp representing Trust, Word, and Honor -->
    <circle cx="140" cy="145" r="22" fill="#F59E0B"/>
    <circle cx="140" cy="145" r="17" fill="#D97706"/>
    
    <!-- Checkmark inside the seal symbolizing truth/integrity -->
    <path d="M132 145 L137 150 L149 138" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Interlocked Hands overlaying the document representing Trust/誠信 -->
    <g transform="translate(0, -5)">
      <!-- Left Cuff & Arm -->
      <path d="M60 140 L85 140 L85 165 L60 165 Z" fill="#3B82F6"/>
      <!-- Left Hand -->
      <path d="M85 142 C95 142 105 148 115 155 L105 168 C95 160 90 158 85 158 Z" fill="#FBBF24"/>

      <!-- Right Cuff & Arm -->
      <path d="M180 140 L155 140 L155 165 L180 165 Z" fill="#EF4444"/>
      <!-- Right Hand -->
      <path d="M155 142 C145 142 135 148 125 155 L135 168 C145 160 150 158 155 158 Z" fill="#FCD34D"/>

      <!-- Handshake grip connection -->
      <path d="M110 150 L130 150 L130 165 L110 165 Z" fill="#F59E0B" opacity="0.8"/>
    </g>
  </g>
</svg>