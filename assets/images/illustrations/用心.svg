<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "用心" (to apply one's mind, attentiveness, dedication to learning/craft) -->
  <!-- Central Physical Object: An open book combined with a glowing, focused mind/study lamp metaphor -->
  
  <!-- Desk surface -->
  <path d="M 40 180 L 200 180 L 210 195 L 30 195 Z" fill="#2A2F3A" />
  
  <!-- Open Book (representing study/learning) -->
  <path d="M 70 145 C 95 135 120 145 120 145 C 120 145 145 135 170 145 L 170 175 C 145 165 120 175 120 175 C 120 175 95 165 70 175 Z" fill="#E2E8F0" />
  <!-- Book spine & center shadow -->
  <path d="M 120 145 C 120 145 120 175 120 175 C 120 175 118 160 120 145 Z" fill="#CBD5E1" />
  <!-- Pages lines -->
  <line x1="82" y1="153" x2="108" y2="150" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="82" y1="161" x2="110" y2="158" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="132" y1="150" x2="158" y2="153" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="130" y1="158" x2="158" y2="161" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- The "Heart/Mind" focus element: A glowing, stylized warm core merging with an academic focal point above the book -->
  <!-- Glowing aura -->
  <circle cx="120" cy="95" r="38" fill="#F59E0B" opacity="0.15" />
  <circle cx="120" cy="95" r="26" fill="#F59E0B" opacity="0.25" />

  <!-- Pencil / Writing tool actively engaging -->
  <g transform="translate(120, 95) rotate(-35)">
    <rect x="-4" y="15" width="8" height="35" rx="1" fill="#3B82F6" />
    <polygon points="-4,50 4,50 0,58" fill="#F59E0B" />
    <polygon points="-2,55 2,55 0,58" fill="#1E293B" />
    <rect x="-4" y="12" width="8" height="4" rx="1" fill="#94A3B8" />
  </g>

  <!-- Focused Mind / Attentive Core Icon (Human-centric physical icon of concentrated intellect/mind, depicted as a glowing stylized brain/head profile with radiant focus) -->
  <path d="M 105 80 
           C 105 68, 135 68, 135 80 
           C 145 80, 150 92, 142 102 
           C 135 110, 125 112, 120 120 
           C 115 112, 105 110, 98 102 
           C 90 92, 95 80, 105 80 Z" 
        fill="#F59E0B" />

  <!-- Sparkles of deep concentration / insight -->
  <path d="M 75 75 L 78 82 L 85 85 L 78 88 L 75 95 L 72 88 L 65 85 L 72 82 Z" fill="#FBBF24" opacity="0.9" />
  <path d="M 165 70 L 167 74 L 172 76 L 167 78 L 165 82 L 163 78 L 158 76 L 163 74 Z" fill="#FBBF24" opacity="0.8" />
  <path d="M 148 118 L 150 122 L 155 124 L 150 126 L 148 130 L 146 126 L 141 124 L 146 122 Z" fill="#FBBF24" opacity="0.7" />

  <!-- Subtle grounding light beam from the focal point down to the book -->
  <polygon points="110,120 130,120 140,145 100,145" fill="#F59E0B" opacity="0.1" />
</svg>