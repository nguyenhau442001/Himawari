<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sea surface -->
  <path d="M0 160 Q 120 140 240 160 L 240 240 L 0 240 Z" fill="#2C3E50"/>
  
  <!-- Broken fish farm structure (the physical object) -->
  <g transform="translate(120, 140)">
    <!-- Main support post broken -->
    <rect x="-40" y="-10" width="80" height="10" fill="#E67E22"/>
    <rect x="-45" y="0" width="10" height="40" fill="#D35400"/>
    <rect x="35" y="0" width="10" height="40" fill="#D35400"/>
    
    <!-- Tilted/Collapsing net frame -->
    <path d="M-50 0 L 50 -20 L 40 -40 L -60 -20 Z" fill="#E67E22" opacity="0.8"/>
    
    <!-- Debris/Broken nets -->
    <path d="M-40 0 L -60 30 M-30 0 L -45 35 M35 0 L 50 30" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Floating debris -->
    <circle cx="-10" cy="50" r="4" fill="#E67E22"/>
    <circle cx="20" cy="60" r="3" fill="#E67E22"/>
  </g>
  
  <!-- Stormy atmosphere -->
  <path d="M20 40 Q 60 20 100 40 T 180 40" stroke="#34495E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M40 60 Q 80 40 120 60 T 200 60" stroke="#34495E" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Rain streaks -->
  <line x1="50" y1="20" x2="40" y2="50" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="150" y1="30" x2="140" y2="60" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="200" y1="40" x2="190" y2="70" stroke="#7F8C8D" stroke-width="2"/>
</svg>