<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Central platter / serving tray representing food variety context -->
    <ellipse cx="120" cy="180" rx="70" ry="16" fill="#2A2F3D"/>
    <ellipse cx="120" cy="176" rx="64" ry="12" fill="#353D52"/>
    
    <!-- Food Item 1: Steamed Dumpling / Baozi (Center-Left) -->
    <g transform="translate(90, 140)">
      <circle cx="0" cy="10" r="18" fill="#F4EDE2"/>
      <!-- Folds -->
      <path d="M0 -4 C -4 4, -8 10, -12 14 M0 -4 C 0 4, 0 10, 0 16 M0 -4 C 4 4, 8 10, 12 14" stroke="#D8CEBD" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M-5 -4 C 0 -8, 5 -8, 5 -4" fill="#E8DEC9"/>
      <ellipse cx="0" cy="22" rx="14" ry="4" fill="#1A1D24" opacity="0.2"/>
    </g>

    <!-- Food Item 2: Noodle Bowl with Chopsticks (Center-Right) -->
    <g transform="translate(150, 135)">
      <!-- Bowl -->
      <path d="M-14 6 L-10 22 Q0 26, 10 22 L14 6 Z" fill="#E06D53"/>
      <ellipse cx="0" cy="6" rx="14" ry="5" fill="#F4EDE2"/>
      <!-- Noodles inside -->
      <path d="M-8 6 Q -4 9, 0 6 Q 4 3, 8 6" stroke="#F4C430" stroke-width="2" fill="none"/>
      <!-- Chopsticks -->
      <line x1="-12" y1="-8" x2="16" y2="-2" stroke="#D28C4A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="-10" x2="20" y2="-4" stroke="#D28C4A" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Food Item 3: Sushi / Bento Roll (Front Center) -->
    <g transform="translate(120, 160)">
      <rect x="-14" y="0" width="28" height="16" rx="6" fill="#F4EDE2"/>
      <rect x="-10" y="4" width="20" height="8" rx="3" fill="#E85D75"/>
      <path d="M-14 8 L-16 12 L16 12 L14 8 Z" fill="#353D52"/>
    </g>

    <!-- Food Item 4: Green Leafy Salad Bowl / Fruit (Back Left) -->
    <g transform="translate(68, 100)">
      <path d="M-14 10 Q0 24, 14 10 Z" fill="#4A7C59"/>
      <circle cx="-5" cy="8" r="7" fill="#E06D53"/>
      <circle cx="5" cy="6" r="6" fill="#F4C430"/>
      <circle cx="0" cy="12" r="5" fill="#6BB382"/>
    </g>

    <!-- Food Item 5: Bento Box compartment / Steamed Bun (Back Center) -->
    <g transform="translate(120, 95)">
      <circle cx="0" cy="10" r="14" fill="#F4C430"/>
      <circle cx="-3" cy="8" r="3" fill="#E06D53"/>
      <circle cx="4" cy="12" r="2.5" fill="#4A7C59"/>
    </g>

    <!-- Food Item 6: Drink / Cup with Straw (Back Right) -->
    <g transform="translate(172, 105)">
      <path d="M-8 4 L-6 22 L6 22 L8 4 Z" fill="#52B788"/>
      <ellipse cx="0" cy="4" rx="8" ry="3" fill="#74C69D"/>
      <line x1="2" y1="-6" x2="-4" y2="12" stroke="#F4EDE2" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Surrounding Floating Elements representing "Diversity / Variety" (Multiple distinct shapes) -->
  <g opacity="0.9">
    <!-- Top Left Star/Sparkle -->
    <path d="M 45 60 Q 45 45, 30 45 Q 45 45, 45 30 Q 45 45, 60 45 Q 45 45, 45 60" fill="#F4C430"/>
    
    <!-- Top Right Circle Cluster -->
    <circle cx="195" cy="55" r="5" fill="#E06D53"/>
    <circle cx="210" cy="70" r="3" fill="#52B788"/>
    
    <!-- Mid Left Diamond -->
    <polygon points="35,115 43,125 35,135 27,125" fill="#52B788"/>
    
    <!-- Mid Right Sparkle -->
    <path d="M 200 130 Q 200 120, 190 120 Q 200 120, 200 110 Q 200 120, 210 120 Q 200 120, 200 130" fill="#F4C430"/>

    <!-- Bottom Left Ring -->
    <circle cx="55" cy="190" r="6" fill="none" stroke="#E85D75" stroke-width="2.5"/>

    <!-- Floating upward flow lines for variety/choice -->
    <path d="M 80 70 Q 75 55, 85 40" stroke="#353D52" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 160 75 Q 165 60, 155 45" stroke="#353D52" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>