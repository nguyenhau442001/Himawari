<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "冒" (Risk / Hazard / Danger) -->
  <g transform="translate(120, 115)">
    <!-- Hazard Ground / Cliff Edge -->
    <path d="M-90 50 L90 50 L90 55 L-90 55 Z" fill="#2C3240" rx="2"/>
    <path d="M-30 50 L30 50 L20 70 L-20 70 Z" fill="#222630"/>

    <!-- Warning / Danger Elements (Spikes / Chasm edge indicator) -->
    <polygon points="-70,50 -60,35 -50,50" fill="#E06C75" opacity="0.3"/>
    <polygon points="50,50 60,35 70,50" fill="#E06C75" opacity="0.3"/>

    <!-- Fiery / Dangerous upward emissions representing "Risk" (mào - emitting/venting/braving danger) -->
    <path d="M-15 45 C-25 10 -40 -10 -25 -40 C-35 -10 -15 -5 -10 -55 C 0 -15 20 -20 15 -45 C 30 -15 15 5 25 45 Z" fill="#E5C07B" opacity="0.15"/>
    <path d="M-8 40 C-15 15 -25 0 -15 -25 C-20 0 -10 5 -5 -35 C 0 -10 10 -10 8 -30 C 18 -10 8 5 15 40 Z" fill="#E06C75" opacity="0.25"/>

    <!-- Central Object / Character braving the risk (representing "他冒着性命危险") -->
    <!-- Person silhouette taking a bold step forward -->
    <g transform="translate(0, 0)">
      <!-- Shadow -->
      <ellipse cx="0" cy="50" rx="18" ry="4" fill="#111318"/>

      <!-- Legs in motion (striding over hazard) -->
      <path d="M -5 30 L -18 48 L -10 50 L -2 35 Z" fill="#61AFEF"/>
      <path d="M 5 30 L 15 45 L 22 43 L 10 28 Z" fill="#61AFEF"/>

      <!-- Torso -->
      <path d="M -12 10 C -12 5 -8 2 0 2 C 8 2 12 5 12 10 L 10 32 C 10 34 5 35 0 35 C -5 35 -10 34 -10 32 Z" fill="#E5C07B"/>

      <!-- Head & Helmet/Hat -->
      <circle cx="0" cy="-6" r="10" fill="#E5C07B"/>
      <!-- Protective gear / Explorer hat -->
      <path d="M -13 -8 C -13 -15 13 -15 13 -8 L 15 -5 L -15 -5 Z" fill="#D19A66"/>
      <rect x="-10" y="-14" width="20" height="3" rx="1.5" fill="#E06C75"/>

      <!-- Outstretched arm showing action -->
      <path d="M 10 12 L 25 22 L 22 26 L 8 16 Z" fill="#E5C07B"/>
    </g>

    <!-- Floating Risk / Warning Sparks (Abstracting the semantic essence of venturing into the unknown) -->
    <circle cx="-45" cy="-20" r="3" fill="#E06C75"/>
    <circle cx="50" cy="-35" r="4" fill="#E5C07B"/>
    <circle cx="35" cy="-10" r="2" fill="#E06C75"/>
    <circle cx="-35" cy="5" r="2.5" fill="#98C379"/>

    <!-- Sharp warning exclamation / danger focal point floating above -->
    <g transform="translate(0, -60)">
      <circle cx="0" cy="0" r="12" fill="#2C3240" stroke="#E06C75" stroke-width="2.5"/>
      <rect x="-1.5" y="-6" width="3" height="6" rx="1.5" fill="#E06C75"/>
      <circle cx="0" cy="4" r="1.5" fill="#E06C75"/>
    </g>
  </g>
</svg>