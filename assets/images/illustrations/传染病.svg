<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background gradient for atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#00D2FF" opacity="0.05"/>
  <circle cx="120" cy="120" r="40" fill="#FF4B4B" opacity="0.05"/>

  <!-- Viral Pathogen Core (Representing Infectious Disease) -->
  <g transform="translate(120, 120)">
    <!-- Spikes (Viral Antigens) -->
    <g stroke="#FF4B4B" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-52"/>
      <line x1="0" y1="0" x2="0" y2="52"/>
      <line x1="0" y1="0" x2="-52" y2="0"/>
      <line x1="0" y1="0" x2="52" y2="0"/>
      <line x1="0" y1="0" x2="-37" y2="-37"/>
      <line x1="0" y1="0" x2="37" y2="37"/>
      <line x1="0" y1="0" x2="37" y2="-37"/>
      <line x1="0" y1="0" x2="-37" y2="37"/>
    </g>

    <!-- Spike Terminal Knobs -->
    <fill-group fill="#FF4B4B">
      <circle cx="0" cy="-52" r="5"/>
      <circle cx="0" cy="52" r="5"/>
      <circle cx="-52" cy="0" r="5"/>
      <circle cx="52" cy="0" r="5"/>
      <circle cx="-37" cy="-37" r="5"/>
      <circle cx="37" cy="37" r="5"/>
      <circle cx="37" cy="-37" r="5"/>
      <circle cx="-37" cy="37" r="5"/>
    </fill-group>

    <!-- Main Viral Body (Capsid) -->
    <circle cx="0" cy="0" r="34" fill="#262B35" stroke="#FF4B4B" stroke-width="6"/>
    
    <!-- Internal RNA/DNA strand motif -->
    <path d="M-14,-10 Q 0,15 14,-10" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10,10 Q 0,-15 10,10" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Mutation / Transmission Nodes -->
    <circle cx="-6" cy="-2" r="3" fill="#FF9F43"/>
    <circle cx="6" cy="2" r="3" fill="#FF9F43"/>
  </g>

  <!-- Secondary Transmission Indicators (Spreading Effect) -->
  <g opacity="0.6">
    <circle cx="56" cy="70" r="12" fill="none" stroke="#00D2FF" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="184" cy="170" r="16" fill="none" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="170" cy="70" r="8" fill="#FF4B4B" opacity="0.4"/>
    <circle cx="70" cy="170" r="6" fill="#00D2FF" opacity="0.4"/>
  </g>
</svg>