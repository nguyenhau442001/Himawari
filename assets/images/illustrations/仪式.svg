<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#FFC107" opacity="0.05"/>
  
  <!-- Stylized Wedding Arch / Ceremony Structure -->
  <!-- Pillars -->
  <rect x="75" y="80" width="10" height="100" rx="3" fill="#3E4C59"/>
  <rect x="155" y="80" width="10" height="100" rx="3" fill="#3E4C59"/>
  
  <!-- Pillar Bases and Capitals -->
  <rect x="70" y="175" width="20" height="8" rx="2" fill="#5C6F84"/>
  <rect x="150" y="175" width="20" height="8" rx="2" fill="#5C6F84"/>
  <rect x="70" y="75" width="20" height="8" rx="2" fill="#5C6F84"/>
  <rect x="150" y="75" width="20" height="8" rx="2" fill="#5C6F84"/>

  <!-- Arch Top (Draped floral/fabric curve) -->
  <path d="M 80 75 Q 120 115 160 75" fill="none" stroke="#FFD54F" stroke-width="4" stroke-linecap="round"/>
  <path d="M 85 85 Q 120 120 155 85" fill="none" stroke="#FFC107" stroke-width="2" opacity="0.6"/>

  <!-- Hanging celebratory decorations (Lanterns/Floral accents) -->
  <circle cx="120" cy="98" r="8" fill="#FF6F61"/>
  <path d="M 120 90 L 120 78" stroke="#E0E0E0" stroke-width="1.5"/>

  <!-- Couple / Figures engaging in the ceremony -->
  <!-- Left Figure (Suit) -->
  <path d="M 95 145 L 102 180 L 90 180 Z" fill="#2C3E50"/>
  <circle cx="98" cy="133" r="8" fill="#FFCCBC"/>
  <!-- Right Figure (Dress/Veil hint) -->
  <path d="M 145 145 C 145 145, 153 165, 155 180 C 150 180, 140 180, 137 180 C 139 165, 145 145, 145 145 Z" fill="#ECEFF1"/>
  <circle cx="142" cy="133" r="8" fill="#FFCCBC"/>
  
  <!-- Outstretched Hands Meeting (Symbolizing the formal vow/ritual) -->
  <path d="M 106 138 Q 120 134 134 138" fill="none" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>

  <!-- Raised Podium / Stage -->
  <path d="M 60 183 L 180 183 L 190 195 L 50 195 Z" fill="#323F4B"/>
  <rect x="50" y="195" width="140" height="4" rx="2" fill="#FFC107"/>

  <!-- Floating ceremonial confetti/sparkles for formal/grand atmosphere -->
  <circle cx="85" cy="55" r="2" fill="#FFD54F"/>
  <circle cx="105" cy="45" r="1.5" fill="#FF6F61"/>
  <circle cx="135" cy="45" r="2" fill="#FFD54F"/>
  <circle cx="155" cy="55" r="1.5" fill="#64B5F6"/>
  <polygon points="120,40 122,44 126,45 122,47 120,51 118,47 114,45 118,44" fill="#FFD54F" transform="scale(0.6) translate(80, 20)"/>
</svg>