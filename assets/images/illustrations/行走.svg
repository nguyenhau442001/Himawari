<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Tree Canopy -->
  <path d="M20 120 C 10 80, 60 40, 120 50 C 180 40, 230 80, 220 120 C 240 100, 260 140, 220 160 L 20 160 Z" fill="#10b981" opacity="0.3"/>
  <path d="M40 130 C 30 90, 80 50, 140 60 C 200 50, 250 90, 240 130 C 260 110, 280 150, 240 170 L 40 170 Z" fill="#065f46" opacity="0.4"/>
  
  <!-- Path -->
  <path d="M0 240 L 240 240 L 220 180 L 20 180 Z" fill="#334155"/>
  <path d="M30 240 L 210 240 L 200 190 L 40 190 Z" fill="#475569"/>
  
  <!-- Elder Character -->
  <g transform="translate(100, 160)">
    <!-- Cane -->
    <line x1="15" y1="0" x2="15" y2="-45" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="15" cy="-48" r="4" fill="#fb923c"/>
    
    <!-- Body -->
    <path d="M0 0 C -5 -20, 5 -40, 0 -60 C -5 -70, 5 -80, 15 -80 C 25 -80, 35 -70, 30 -60 L 25 -20 Z" fill="#94a3b8"/>
    
    <!-- Head -->
    <circle cx="15" cy="-85" r="12" fill="#fde68a"/>
    
    <!-- Clothing Details -->
    <rect x="5" y="-75" width="20" height="10" fill="#64748b" rx="2"/>
    
    <!-- Legs (Walking motion) -->
    <path d="M5 -10 L 0 0" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 -10 L 25 0" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Dappled Light Effects -->
  <circle cx="60" cy="190" r="8" fill="#fbbf24" opacity="0.2"/>
  <circle cx="140" cy="210" r="12" fill="#fbbf24" opacity="0.15"/>
  <circle cx="190" cy="195" r="6" fill="#fbbf24" opacity="0.25"/>
</svg>