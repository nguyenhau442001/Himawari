<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Light Source -->
  <path d="M160 40 L210 40 L210 120 L160 120 Z" fill="#334155" opacity="0.5"/>
  <circle cx="185" cy="80" r="25" fill="#fbbf24" opacity="0.2"/>
  <path d="M185 55 L185 105 M160 80 L210 80" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>

  <!-- Elderly Man -->
  <g transform="translate(40, 80)">
    <!-- Body -->
    <path d="M40 140 C40 100, 120 100, 120 140 L120 160 L40 160 Z" fill="#334155"/>
    <path d="M60 100 C60 70, 100 70, 100 100 L100 120 L60 120 Z" fill="#f1f5f9"/>
    
    <!-- Face -->
    <circle cx="80" cy="70" r="30" fill="#fde68a"/>
    <path d="M65 65 Q70 60 75 65" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M85 65 Q90 60 95 65" stroke="#475569" stroke-width="2" fill="none"/>
    
    <!-- The Smile (Anxiang) -->
    <path d="M70 85 Q80 95 90 85" stroke="#e11d48" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Hair/Details -->
    <path d="M60 60 Q80 40 100 60" stroke="#cbd5e1" stroke-width="4" fill="none"/>
    <circle cx="80" cy="75" r="3" fill="#fb923c" opacity="0.4"/>
  </g>

  <!-- Chair/Context -->
  <path d="M30 160 L150 160 L140 200 L40 200 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative Plant -->
  <path d="M180 180 L180 220" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="180" cy="170" rx="10" ry="15" fill="#10b981"/>
  <ellipse cx="195" cy="185" rx="10" ry="15" fill="#10b981" transform="rotate(30 195 185)"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.05"/>
</svg>