<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle decorative background rays/atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="115" r="50" fill="#2F3644" opacity="0.4"/>
  
  <!-- Central Physical Object representing "赞同" (Consensus/Agreement Document & Stamp) -->
  <g transform="translate(0, 5)">
    <!-- Document background/shadow -->
    <rect x="75" y="45" width="90" height="115" rx="8" fill="#111318" opacity="0.5"/>
    
    <!-- Main Document -->
    <rect x="70" y="40" width="90" height="115" rx="8" fill="#FFFFFF"/>
    <path d="M 135 40 L 160 65 L 160 40 Z" fill="#E2E8F0"/>
    
    <!-- Document text lines -->
    <rect x="85" y="58" width="45" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="85" y="74" width="60" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="85" y="85" width="50" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="85" y="96" width="55" height="4" rx="2" fill="#E2E8F0"/>
    
    <!-- Agreement Checkmark Area -->
    <circle cx="115" cy="120" r="18" fill="#FFFBEB"/>
    <path d="M 106 120 L 112 126 L 125 113" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Physical Stamp / Seal (Object of Approval) -->
  <g transform="translate(115, 145)">
    <!-- Stamp Handle -->
    <path d="M -12 25 L 12 25 L 9 10 L -9 10 Z" fill="#D97706"/>
    <rect x="-6" y="-5" width="12" height="15" rx="2" fill="#F59E0B"/>
    <ellipse cx="0" cy="-5" rx="6" ry="2" fill="#FCD34D"/>
    
    <!-- Stamp Base -->
    <rect x="-18" y="25" width="36" height="8" rx="3" fill="#B45309"/>
    
    <!-- Golden Accent glow ring on stamp -->
    <path d="M -15 33 L 15 33 L 12 42 L -12 42 Z" fill="#F59E0B"/>
  </g>

  <!-- People silhouettes / hands expressing agreement joining together subtly around the document -->
  <!-- Left hand gesture (thumbs up / approval) -->
  <g transform="translate(38, 110) rotate(-15)">
    <rect x="0" y="0" width="22" height="30" rx="6" fill="#60A5FA"/>
    <!-- Thumb pointing up -->
    <path d="M 12 0 C 12 -8 20 -8 20 0 L 20 10 L 12 10 Z" fill="#60A5FA"/>
  </g>

  <!-- Right hand gesture (thumbs up / approval) -->
  <g transform="translate(180, 110) scale(-1, 1) rotate(-15)">
    <rect x="0" y="0" width="22" height="30" rx="6" fill="#60A5FA"/>
    <!-- Thumb pointing up -->
    <path d="M 12 0 C 12 -8 20 -8 20 0 L 20 10 L 12 10 Z" fill="#60A5FA"/>
  </g>

</svg>