<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/backdrop for ranking podium -->
  <ellipse cx="120" cy="180" rx="90" ry="20" fill="#252A34" opacity="0.6"/>

  <!-- Podium Base / Steps -->
  <!-- 2nd Place (Left) -->
  <rect x="52" y="130" width="40" height="50" rx="4" fill="#2D3342"/>
  <rect x="52" y="130" width="40" height="8" rx="4" fill="#404859"/>
  <!-- 1st Place (Center) -->
  <rect x="100" y="100" width="40" height="80" rx="4" fill="#363D4E"/>
  <rect x="100" y="100" width="40" height="10" rx="4" fill="#F59E0B"/>
  <!-- 3rd Place (Right) -->
  <rect x="148" y="150" width="40" height="30" rx="4" fill="#2D3342"/>
  <rect x="148" y="150" width="40" height="8" rx="4" fill="#404859"/>

  <!-- Rank Numbers on Podium Blocks -->
  <!-- #2 -->
  <text x="72" y="160" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#94A3B8" text-anchor="middle">2</text>
  <!-- #1 -->
  <text x="120" y="135" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#F59E0B" text-anchor="middle">1</text>
  <!-- #3 -->
  <text x="168" y="173" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#94A3B8" text-anchor="middle">3</text>

  <!-- Central Trophy (representing top ranking achievement) -->
  <!-- Trophy Base -->
  <path d="M112 95 L128 95 L132 102 L108 102 Z" fill="#64748B"/>
  <rect x="116" y="87" width="8" height="8" fill="#64748B"/>
  <!-- Trophy Cup -->
  <path d="M106 58 C106 72 134 72 134 58 L136 50 C136 46 132 44 128 44 L112 44 C108 44 104 46 104 50 Z" fill="#F59E0B"/>
  <path d="M106 58 C106 72 134 72 134 58 L136 50 C136 46 132 44 128 44 L112 44 C108 44 104 46 104 50 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <!-- Trophy Handles -->
  <path d="M104 48 C96 48 94 56 99 60" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M136 48 C144 48 146 56 141 60" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Star on Trophy -->
  <path d="M120 52 L122.2 56.5 L127.1 57.2 L123.5 60.7 L124.4 65.6 L120 63.3 L115.6 65.6 L116.5 60.7 L112.9 57.2 L117.8 56.5 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Upward Trend Arrow (representing the "大幅提升" - dramatic rise in rank) -->
  <path d="M165 90 L200 55 M200 55 L180 55 M200 55 L200 75" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative Achievement Elements (Sparkles) -->
  <path d="M45 75 L47 82 L54 84 L47 86 L45 93 L43 86 L36 84 L43 82 Z" fill="#F59E0B" opacity="0.8"/>
  <path d="M195 125 L196.5 129.5 L201 131 L196.5 132.5 L195 137 L193.5 132.5 L189 131 L193.5 129.5 Z" fill="#F59E0B" opacity="0.6"/>

  <!-- Subtle Grade / List card floating subtly on the left to ground the ranking concept -->
  <rect x="35" y="100" width="22" height="28" rx="3" fill="#252A34" stroke="#334155" stroke-width="1.5"/>
  <line x1="40" y1="106" x2="50" y2="106" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="112" x2="52" y2="112" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="118" x2="48" y2="118" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

</svg>