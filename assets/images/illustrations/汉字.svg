<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow representing writing focus -->
  <circle cx="120" cy="115" r="70" fill="#2D323F" opacity="0.6"/>

  <!-- Fountain pen / Calligraphy brush indicating the act of writing Chinese characters -->
  <g transform="translate(120, 115)">
    <!-- Traditional Calligraphy Brush Handle (angled) -->
    <g transform="rotate(-35)">
      <!-- Brush tip/hairs -->
      <path d="M -4,-50 L 4,-50 L 6,-25 C 6,-15 3,-5 0,0 C -3,-5 -6,-15 -6,-25 Z" fill="#3A3F4B"/>
      <!-- Dark wet ink tip -->
      <path d="M -2,-45 L 2,-45 L 3,-25 C 3,-18 1.5,-8 0,-2 C -1.5,-8 -3,-18 -3,-25 Z" fill="#F39C12"/>
      
      <!-- Upper bamboo/wooden handle segment -->
      <rect x="-4" y="-120" width="8" height="70" rx="2" fill="#E0E6ED"/>
      <!-- Metallic ferrule -->
      <rect x="-4.5" y="-50" width="9" height="6" rx="1" fill="#F39C12"/>
      
      <!-- Handle brush red/gold accent ring -->
      <rect x="-4" y="-105" width="8" height="3" fill="#F39C12"/>
      <rect x="-4" y="-85" width="8" height="3" fill="#F39C12"/>
    </g>

    <!-- Stylized Hanzi / Calligraphic Stroke Trails -->
    <!-- Horizontal stroke -->
    <path d="M -60,25 C -40,25 -20,25 0,25" stroke="#F39C12" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Vertical downward stroke with hook -->
    <path d="M -15,10 C -15,30 -15,55 -5,70 C 0,77 8,80 18,75" stroke="#F39C12" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Diagonal right stroke -->
    <path d="M -15,35 C 10,40 35,55 55,75" stroke="#E0E6ED" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Diagonal left stroke -->
    <path d="M 5,20 C 15,35 30,50 45,65" stroke="#E0E6ED" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Open traditional booklet / paper sheets representing script practice -->
  <g transform="translate(120, 190)">
    <!-- Base paper shadow -->
    <path d="M -65,-12 C -30,-16 0,-18 65,-12 C 65,10 30,12 0,10 C -30,12 -65,10 -65,-12 Z" fill="#111317" opacity="0.5"/>
    <!-- Left page -->
    <path d="M -65,-15 C -30,-19 0,-21 0,-23 L 0,8 C -30,10 -65,8 -65,-12 Z" fill="#2D323F"/>
    <!-- Right page -->
    <path d="M 65,-15 C 30,-19 0,-21 0,-23 L 0,8 C 30,10 65,8 65,-12 Z" fill="#353B48"/>
    <!-- Center spine line -->
    <line x1="0" y1="-23" x2="0" y2="8" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Grid squares / Tianziwang subtle guides on paper -->
    <rect x="-45" y="-18" width="30" height="20" fill="none" stroke="#404756" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <rect x="15" y="-18" width="30" height="20" fill="none" stroke="#404756" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  </g>
</svg>