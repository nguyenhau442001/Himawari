<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Ambient Glow representing the transition/arrival of spring -->
  <circle cx="120" cy="130" r="70" fill="#2E384D" opacity="0.4"/>
  <circle cx="120" cy="110" r="45" fill="#F59E0B" opacity="0.08"/>

  <!-- Motion lines / Arrival waves -->
  <path d="M75 165 C90 155, 105 155, 120 165 C135 175, 150 175, 165 165" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" stroke-dasharray="4 4"/>
  <path d="M60 180 C80 168, 100 168, 120 180 C140 192, 160 192, 180 180" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Ground / Soil Layer -->
  <path d="M 60 195 Q 120 185 180 195 L 195 210 Q 120 215 45 210 Z" fill="#2A3441"/>
  <ellipse cx="120" cy="198" rx="65" ry="8" fill="#374151"/>

  <!-- Central Dynamic Action Subject: Spring Sprout emerging / arriving -->
  <g id="sprout-arrival">
    <!-- Stem and leaves growing upward dynamically -->
    <path d="M120 195 Q 120 160 120 125" stroke="#10B981" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Left Leaf -->
    <path d="M120 145 C 105 135, 90 140, 85 150 C 95 160, 110 155, 120 145 Z" fill="#34D399"/>
    
    <!-- Right Leaf (bursting out with motion lines) -->
    <path d="M120 135 C 135 125, 150 130, 155 140 C 145 150, 130 145, 120 135 Z" fill="#10B981"/>

    <!-- Top fresh bud -->
    <ellipse cx="120" cy="118" rx="8" ry="12" fill="#6EE7B7" transform="rotate(-15 120 118)"/>
  </g>

  <!-- Dynamic Arrival Elements (Sunlight breaking through, descending arrows/rays) -->
  <g id="arrival-rays">
    <!-- Sun / Warmth source descending -->
    <circle cx="120" cy="65" r="18" fill="#F59E0B"/>
    <circle cx="120" cy="65" r="26" fill="#F59E0B" opacity="0.2"/>
    
    <!-- Directional Light Beams / Action vectors showing "Approaching / 临" -->
    <path d="M 95 78 L 110 100" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 145 78 L 130 100" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Arrowhead indicators of downward/forward movement (Arrival) -->
    <polygon points="120,110 115,100 125,100" fill="#F59E0B"/>
  </g>

  <!-- Floating Nature / Vitality Particles (万物复苏) -->
  <g fill="#34D399" opacity="0.8">
    <circle cx="85" cy="115" r="3"/>
    <circle cx="155" cy="105" r="2.5"/>
    <circle cx="70" cy="145" r="2"/>
    <circle cx="170" cy="135" r="3.5"/>
  </g>
  
  <g fill="#F59E0B" opacity="0.9">
    <circle cx="100" cy="85" r="2"/>
    <circle cx="140" cy="90" r="2.5"/>
  </g>
</svg>