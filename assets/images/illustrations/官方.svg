<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Podium and Desk Gradients -->
    <linearGradient id="podium-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="gold-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Microphone Metallic Gradient -->
    <linearGradient id="metal-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment: Press Conference Backdrop / Curtains & Lighting -->
  <g id="environment">
    <!-- Subtle vertical banners / acoustic panels representing official setting -->
    <rect x="30" y="30" width="35" height="130" fill="#1e293b" opacity="0.6"/>
    <rect x="75" y="20" width="45" height="140" fill="#334155" opacity="0.4"/>
    <rect x="130" y="20" width="45" height="140" fill="#334155" opacity="0.4"/>
    <rect x="185" y="30" width="35" height="130" fill="#1e293b" opacity="0.6"/>

    <!-- Ambient spotlight glow behind speaker -->
    <circle cx="120" cy="85" r="50" fill="url(#gold-glow)" />

    <!-- Official Seal / Emblem graphic on the back wall (Abstract representation of state authority/official status) -->
    <circle cx="120" cy="70" r="18" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
    <circle cx="120" cy="70" r="14" fill="#f59e0b" opacity="0.2"/>
    <path d="M120 58 L123 66 L131 66 L125 71 L127 79 L120 74 L113 79 L115 71 L109 66 L117 66 Z" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Foreground Podium Desk -->
  <g id="podium">
    <!-- Main desk body -->
    <path d="M 75 160 L 165 160 L 175 210 L 65 210 Z" fill="url(#podium-grad)" stroke="#475569" stroke-width="2"/>
    <!-- Desk top surface (perspective ellipse/polygon) -->
    <polygon points="65,160 175,160 185,168 55,168" fill="#475569"/>
    <!-- Gold accent stripe on podium -->
    <path d="M 70 185 L 170 185 L 172 192 L 68 192 Z" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Official Document / Statement Papers on Podium -->
  <g id="official-documents">
    <!-- Paper 1 -->
    <polygon points="95,162 125,158 130,172 100,176" fill="#f8fafc" />
    <line x1="102" y1="166" x2="118" y2="164" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="101" y1="170" x2="115" y2="168" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Paper 2 (Main Announcement Document with Gold Seal Stamp) -->
    <polygon points="110,155 148,153 152,170 114,172" fill="#ffffff" />
    <line x1="118" y1="160" x2="140" y2="158" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="117" y1="165" x2="135" y2="163" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Official Red/Gold Stamp on Document -->
    <circle cx="140" cy="165" r="5" fill="#ef4444" opacity="0.85"/>
  </g>

  <!-- Microphones -->
  <g id="microphones">
    <!-- Mic Stand 1 -->
    <line x1="105" y1="162" x2="105" y2="135" stroke="#64748b" stroke-width="2.5"/>
    <!-- Mic Head 1 -->
    <ellipse cx="105" cy="132" rx="4" ry="6" fill="url(#metal-grad)" stroke="#334155" stroke-width="1"/>

    <!-- Mic Stand 2 (Main active mic) -->
    <path d="M 135 160 Q 138 140 132 125" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <!-- Mic Head 2 -->
    <ellipse cx="131" cy="122" rx="5" ry="7" fill="url(#metal-grad)" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Main Character: Official Spokesperson / Speaker -->
  <g id="spokesperson">
    <!-- Suit Shoulders & Torso -->
    <path d="M 85 220 Q 95 180 120 180 Q 145 180 155 220 Z" fill="#0f172a" />
    
    <!-- Suit Lapels -->
    <polygon points="120,180 110,210 116,215" fill="#334155"/>
    <polygon points="120,180 130,210 124,215" fill="#334155"/>
    
    <!-- Crisp White Shirt Collar & Red Tie (Formal attire denoting official status) -->
    <polygon points="113,180 120,192 127,180" fill="#f8fafc"/>
    <polygon points="118,189 122,189 123,212 117,212" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="112" y="170" width="16" height="15" fill="#fbcfe8" rx="4"/>

    <!-- Head & Face -->
    <ellipse cx="120" cy="150" rx="18" ry="21" fill="#fbcfe8" />

    <!-- Professional Hair Style -->
    <path d="M 102 145 C 102 130 110 126 120 126 C 132 126 138 132 138 144 C 138 144 135 133 120 133 C 105 133 102 145 102 145 Z" fill="#334155" />

    <!-- Confident facial expression (Speaking/Declaring) -->
    <!-- Eyes: focused and serious -->
    <circle cx="113" cy="148" r="2" fill="#1e293b"/>
    <circle cx="127" cy="148" r="2" fill="#1e293b"/>
    <!-- Eyebrows with slight confident angle -->
    <line x1="110" y1="143" x2="116" y2="144" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="124" y1="144" x2="130" y2="143" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Glasses for professional intelligence look -->
    <rect x="109" y="144" width="9" height="7" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="122" y="144" width="9" height="7" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="118" y1="147" x2="122" y2="147" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Nose -->
    <path d="M 120 150 L 118 156 L 121 156" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Open Mouth (Actively making an official statement / speaking clearly) -->
    <path d="M 116 161 Q 120 166 124 161 Z" fill="#991b1b" />

    <!-- Gesturing Hand (Pointing forward authoritatively to emphasize the statement) -->
    <!-- Upper Arm & Forearm pointing out towards audience -->
    <path d="M 145 195 Q 165 190 170 175" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand Palm & Fingers -->
    <circle cx="172" cy="172" r="5" fill="#fbcfe8"/>
    <!-- Index finger pointing -->
    <path d="M 175 170 L 183 167" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Lighting & Flash Camera Effects (Subtle dots/stars indicating live press event) -->
  <g id="camera-flashes" opacity="0.8">
    <circle cx="50" cy="110" r="1.5" fill="#ffffff"/>
    <polygon points="50,105 52,110 50,115 48,110" fill="#38bdf8" opacity="0.6"/>
    
    <circle cx="190" cy="100" r="2" fill="#ffffff"/>
    <polygon points="190,94 193,100 190,106 187,100" fill="#38bdf8" opacity="0.6"/>

    <circle cx="70" cy="70" r="1" fill="#ffffff"/>
    <circle cx="170" cy="65" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Foreground Frame Enhancement (Subtle Vignette/Border for Vector Polish) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
</svg>