<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to highlight the object -->
  <circle cx="120" cy="120" r="70" fill="#2D333F" opacity="0.4"/>

  <!-- Motion lines / energetic aura -->
  <path d="M 60 70 Q 50 90 55 110" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 180 170 Q 190 150 185 130" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 170 65 Q 185 80 175 95" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 70 175 Q 55 160 65 145" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Soccer Ball (足球) -->
  <g transform="translate(120, 120)">
    <!-- Outer White Sphere -->
    <circle cx="0" cy="0" r="64" fill="#F4F5F7"/>
    
    <!-- Shading for 3D/Flat-modern depth -->
    <circle cx="0" cy="0" r="64" fill="url(#ballGradient)" opacity="0.15"/>

    <!-- Central Pentagon -->
    <polygon points="0,-18 17,-6 11,14 -11,14 -17,-6" fill="#21252B"/>

    <!-- Surrounding Patches (Hexagons & Edges) -->
    <!-- Top-left black edge/pentagon -->
    <polygon points="-38,-35 -18,-45 0,-18 -17,-6 -34,-16" fill="#21252B"/>
    <!-- Top-right black edge/pentagon -->
    <polygon points="38,-35 18,-45 0,-18 17,-6 34,-16" fill="#21252B"/>
    <!-- Bottom-left black edge/pentagon -->
    <polygon points="-42,20 -22,40 -11,14 -17,-6 -35,5" fill="#21252B"/>
    <!-- Bottom-right black edge/pentagon -->
    <polygon points="42,20 22,40 11,14 17,-6 35,5" fill="#21252B"/>
    <!-- Bottom center black edge -->
    <polygon points="0,54 -22,40 -11,14 11,14 22,40" fill="#21252B"/>
    <!-- Top center black edge -->
    <polygon points="0,-58 -18,-45 0,-18 18,-45" fill="#21252B"/>

    <!-- Seam Lines connecting geometry for authentic look -->
    <path d="M 0,-18 L 0,-58 M 17,-6 L 38,-35 M -17,-6 L -38,-35 M 11,14 L 42,20 M -11,14 L -42,20 M 0,14 L 0,54" stroke="#21252B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Gradient definition for sphere shading -->
  <defs>
    <radialGradient id="ballGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- High-contrast focus accent ring -->
  <circle cx="120" cy="120" r="74" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.8"/>
</svg>