<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric background glow for "Observation/Realization" -->
  <circle cx="120" cy="110" r="70" fill="#3B82F6" opacity="0.08"/>

  <!-- Motion lines / Insight rays radiating from upper head/eyes -->
  <g opacity="0.4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="45" x2="120" y2="30"/>
    <line x1="145" y1="52" x2="158" y2="42"/>
    <line x1="95" y1="52" x2="82" y2="42"/>
  </g>

  <!-- Contextual environment preview: Approaching rain / dark cloud & raindrops (看来今天会下雨) -->
  <g transform="translate(0, 0)">
    <!-- Dark rain cloud in upper right -->
    <path d="M 165 65 
             C 165 57, 172 50, 180 50 
             C 186 50, 192 54, 195 60 
             C 202 60, 208 66, 208 73 
             C 208 80, 202 85, 195 85 
             L 168 85 
             C 166 85, 165 83, 165 80 Z" 
          fill="#4B5563" opacity="0.8"/>
          
    <!-- Falling raindrops -->
    <g stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="175" y1="92" x2="171" y2="102"/>
      <line x1="190" y1="95" x2="186" y2="105"/>
    </g>
  </g>

  <!-- Human Character Action (Verb: Looking/Deducing) -->
  <g>
    <!-- Torso & Shoulders -->
    <path d="M 75 190 C 75 160, 95 145, 120 145 C 145 145, 165 160, 165 190 Z" fill="#1E3A8A"/>
    
    <!-- Neck -->
    <rect x="111" y="128" width="18" height="22" rx="6" fill="#FCA5A5"/>

    <!-- Head -->
    <circle cx="120" cy="105" r="28" fill="#FCA5A5"/>

    <!-- Hair (Sleek modern style, dark slate) -->
    <path d="M 92 105 C 92 88, 104 77, 120 77 C 136 77, 148 88, 148 105 C 148 110, 146 112, 145 110 C 142 90, 130 83, 120 83 C 110 83, 98 90, 95 110 C 94 112, 92 110, 92 105 Z" fill="#374151"/>

    <!-- Dynamic Action: Hand raised to chin/glasses in a thoughtful "evaluating/deducing" pose -->
    <path d="M 135 155 L 148 135 C 151 130, 148 123, 142 122 C 136 121, 132 126, 128 132 L 120 145" fill="none" stroke="#FCA5A5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Focused Eye / Gaze indicator (highlighting active observation) -->
    <circle cx="132" cy="104" r="3.5" fill="#1F2937"/>
    <circle cx="108" cy="104" r="3.5" fill="#1F2937"/>

    <!-- Thoughtful / Realization open mouth -->
    <path d="M 116 117 Q 120 123 124 117" fill="none" stroke="#991B1B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Focus/Insight Accent: Glowing magnifying/focus indicator floating towards the weather element -->
  <g transform="translate(145, 75)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.9"/>
    <line x1="11" y1="11" x2="22" y2="22" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>