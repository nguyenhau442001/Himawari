<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk/Workspace -->
  <rect x="40" y="150" width="160" height="15" rx="2" fill="#343A46"/>
  <rect x="50" y="165" width="10" height="40" fill="#2A2F3A"/>
  <rect x="180" y="165" width="10" height="40" fill="#2A2F3A"/>
  
  <!-- Character (The "Ganshi" / Staff Member) -->
  <g transform="translate(120, 110)">
    <!-- Body -->
    <path d="M-30 80 Q0 50 30 80 L25 120 L-25 120 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M-25 20 Q-25 -10 0 -10 Q25 -10 25 20 Z" fill="#2D3748"/>
    <!-- Shirt Collar -->
    <path d="M-10 40 L0 50 L10 40 Z" fill="#CBD5E0"/>
  </g>
  
  <!-- Professional Tools (Representing the role) -->
  <!-- Clipboard -->
  <rect x="140" y="80" width="50" height="70" rx="4" fill="#E2E8F0"/>
  <rect x="145" y="85" width="40" height="5" rx="1" fill="#FFB84D"/>
  <line x1="150" y1="100" x2="180" y2="100" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="115" x2="180" y2="115" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="130" x2="170" y2="130" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pen in hand -->
  <rect x="110" y="130" width="30" height="4" rx="2" fill="#FFB84D" transform="rotate(-20 125 132)"/>
  
  <!-- Badge/ID Tag on chest -->
  <rect x="115" y="135" width="10" height="15" rx="1" fill="#FFB84D"/>
</svg>