<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" fill="#334155" rx="2"/>
  <rect x="40" y="175" width="10" height="65" fill="#1e293b"/>
  <rect x="190" y="175" width="10" height="65" fill="#1e293b"/>
  
  <!-- Cluttered Desk Items -->
  <rect x="50" y="145" width="40" height="15" fill="#475569" rx="2"/>
  <circle cx="110" cy="150" r="8" fill="#ec4899"/>
  <rect x="130" y="130" width="30" height="30" fill="#334155" rx="4"/>
  <path d="M135 135h20v5h-20zM135 145h20v5h-20z" fill="#94a3b8"/>
  
  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 -20c0-15 10-25 25-25s25 10 25 25" fill="#78350f"/>
    <!-- Eyes (stressed) -->
    <line x1="-12" y1="-25" x2="-5" y2="-20" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-20" x2="12" y2="-25" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth (grimace) -->
    <path d="M-10 -10 Q0 -5 10 -10" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <path d="M-30 20 C-30 5 30 5 30 20 L25 80 L-25 80 Z" fill="#38bdf8"/>
    
    <!-- Hands on head -->
    <circle cx="-35" cy="-10" r="8" fill="#fde68a"/>
    <circle cx="35" cy="-10" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Edge/Cliff metaphor (Visualizing "The Edge") -->
  <path d="M0 240 L240 240 L240 220 C120 230 0 220 0 240" fill="#fb923c" opacity="0.3"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="100" r="80" fill="#fbbf24" opacity="0.05"/>
</svg>