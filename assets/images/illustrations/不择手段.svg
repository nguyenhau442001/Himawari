<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk Environment -->
  <rect x="20" y="140" width="200" height="80" rx="8" fill="#334155"/>
  <rect x="30" y="150" width="180" height="60" rx="4" fill="#0f172a"/>
  
  <!-- The Subject (The one doing whatever it takes) -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 25 Q20 35 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <path d="M5 50 L35 50 L30 100 L10 100 Z" fill="#38bdf8"/>
    <path d="M0 60 L10 80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 60 L50 70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- The "Unscrupulous" actions: Stealing files and sabotaging -->
  <g transform="translate(40, 160)">
    <!-- File folder being snatched -->
    <path d="M0 0 L40 0 L45 10 L50 0 L60 0 L60 40 L0 40 Z" fill="#ec4899"/>
    <rect x="10" y="10" width="40" height="5" fill="#f8fafc"/>
    <rect x="10" y="20" width="30" height="5" fill="#f8fafc"/>
  </g>

  <!-- Sabotage element: Cutting a wire/connection -->
  <path d="M160 170 L190 190" stroke="#fb923c" stroke-width="4" stroke-dasharray="4 4"/>
  <path d="M180 160 L200 200" stroke="#fb923c" stroke-width="4"/>
  
  <!-- Success Trophy in background -->
  <path d="M180 80 L220 80 L210 120 L190 120 Z" fill="#fbbf24"/>
  <path d="M200 80 L200 60" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="200" cy="55" r="5" fill="#fbbf24"/>

  <!-- Decorative accents -->
  <circle cx="50" cy="50" r="3" fill="#10b981"/>
  <circle cx="200" cy="30" r="4" fill="#38bdf8"/>
  <circle cx="100" cy="180" r="2" fill="#ec4899"/>
</svg>