<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The "Escalation/Contrast" Metaphor: A staircase of increasing intensity -->
  <!-- Base level: A simple, small block -->
  <rect x="40" y="180" width="30" height="20" fill="#3D4451"/>
  
  <!-- Middle level: A slightly larger block -->
  <rect x="80" y="150" width="30" height="50" fill="#5D677A"/>
  
  <!-- High level: A tall, towering block representing "Busy" -->
  <rect x="120" y="100" width="30" height="100" fill="#7A879D"/>
  
  <!-- Extreme level: The "Regardless" (不论) breakthrough -->
  <!-- A character silhouette performing an action (exercise) despite the towering height of the previous blocks -->
  <g transform="translate(170, 140)">
    <!-- Character body -->
    <circle cx="15" cy="15" r="12" fill="#FFB86C"/>
    <rect x="12" y="27" width="6" height="30" fill="#FFB86C"/>
    <!-- Arms in motion (exercise) -->
    <path d="M 5 40 L 15 35 L 25 40" stroke="#FFB86C" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Legs in motion -->
    <path d="M 10 57 L 8 75 M 20 57 L 22 75" stroke="#FFB86C" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Visual indicator of "Regardless": An arrow cutting across the intensity levels -->
  <path d="M 30 190 L 200 190" stroke="#FFB86C" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M 195 185 L 205 190 L 195 195" fill="#FFB86C"/>
</svg>