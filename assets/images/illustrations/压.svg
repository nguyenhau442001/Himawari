<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bottom Book -->
  <rect x="60" y="140" width="120" height="20" rx="2" fill="#4A5568"/>
  <rect x="65" y="145" width="110" height="10" rx="1" fill="#718096"/>
  
  <!-- Top Object (Heavy block) -->
  <rect x="80" y="90" width="80" height="50" rx="4" fill="#F6AD55"/>
  <rect x="85" y="95" width="70" height="40" rx="2" fill="#ED8936"/>
  
  <!-- Shadow effect to emphasize pressure -->
  <ellipse cx="120" cy="160" rx="50" ry="5" fill="#000000" opacity="0.3"/>
  
  <!-- Visual indicator of force/weight -->
  <path d="M120 70 L120 90 M115 85 L120 90 L125 85" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>