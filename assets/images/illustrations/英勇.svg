<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground line -->
  <path d="M40 180 L200 180" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  
  <!-- The "Small" (Overcoming obstacle/fear) -->
  <g transform="translate(60, 160)">
    <circle cx="10" cy="-10" r="6" fill="#4B5563"/>
    <path d="M10 -4 L10 10 M10 10 L5 20 M10 10 L15 20" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- The "Large" (The Heroic Action/Scale Exaggeration) -->
  <g transform="translate(130, 160)">
    <!-- Heroic Stance -->
    <circle cx="20" cy="-40" r="12" fill="#F59E0B"/>
    <path d="M20 -28 L20 0 M20 0 L10 20 M20 0 L30 20 M20 -15 L5 -5 M20 -15 L35 -5" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Dynamic Action Lines/Aura (Non-sci-fi, represent movement/impact) -->
    <path d="M-10 -50 L-20 -60" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M50 -30 L60 -20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M20 -70 L20 -85" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Contrast: Small grey figure vs Large gold figure to represent the quality of bravery/heroism -->
</svg>