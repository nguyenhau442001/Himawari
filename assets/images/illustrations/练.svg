<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (subtle ink wash effect representation) -->
  <path d="M40 180 C80 160 120 190 200 170" stroke="#252A35" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M50 70 C90 90 150 50 190 80" stroke="#252A35" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Xuan Paper / Scroll background -->
  <rect x="55" y="45" width="130" height="150" rx="4" fill="#EAE5D9" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))"/>
  
  <!-- Paper texture details (subtle inner border) -->
  <rect x="63" y="53" width="114" height="134" rx="2" fill="none" stroke="#DCD5C5" stroke-width="1.5"/>

  <!-- Calligraphy Brush (Maobi) resting diagonally -->
  <!-- Brush Handle -->
  <path d="M85 35 L175 145" stroke="#8C5830" stroke-width="6" stroke-linecap="round"/>
  <!-- Brush Ferrule -->
  <line x1="165" y1="133" x2="175" y2="145" stroke="#C2A25B" stroke-width="6.5"/>
  <!-- Brush Tip (Dark ink) -->
  <path d="M175 145 C185 157 192 168 198 178 C192 173 182 165 175 145 Z" fill="#2C2C2C"/>

  <!-- Calligraphy strokes on paper (Representing practice / repetition: 练) -->
  <!-- Horizontal stroke -->
  <path d="M75 85 Q110 80 145 86" stroke="#1F242D" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Vertical stroke with hook -->
  <path d="M95 75 Q93 115 95 145 Q96 160 108 158 Q115 156 112 145" stroke="#1F242D" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Slashing stroke -->
  <path d="M135 105 Q120 130 90 165" stroke="#1F242D" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Dot / Accent -->
  <circle cx="145" cy="120" r="3" fill="#1F242D"/>
  
  <!-- Ink Stone (砚台) at the bottom right corner of paper -->
  <path d="M130 185 Q160 175 190 185 C195 190 190 198 180 200 C150 205 140 205 130 200 C125 195 125 190 130 185 Z" fill="#363C4A"/>
  <ellipse cx="160" cy="190" rx="20" ry="6" fill="#22262E"/>
  <path d="M152 189 C155 186 165 186 168 189 C165 191 155 191 152 189 Z" fill="#1A1D24"/>

  <!-- Focus accent: Golden glow indicating active practice / mastery -->
  <circle cx="107" cy="115" r="32" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
  <circle cx="107" cy="115" r="42" fill="none" stroke="#F39C12" stroke-width="1" opacity="0.3"/>
</svg>