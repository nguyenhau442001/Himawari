<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing a political/organizational meeting room -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Background interior elements: wall paneling, subtle lighting -->
  <line x1="30" y1="40" x2="210" y2="40" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <rect x="95" y="25" width="50" height="15" rx="3" fill="#334155" opacity="0.4"/>
  
  <!-- Central large meeting table dividing the room into two sides (factions) -->
  <path d="M 60,110 L 180,110 L 195,165 L 45,165 Z" fill="url(#table)" stroke="#475569" stroke-width="1.5"/>
  <!-- Table highlight -->
  <path d="M 65,113 L 175,113 L 187,140 L 53,140 Z" fill="#475569" opacity="0.3"/>

  <!-- LEFT FACTION (Group A: Amber/Warm tone accents) -->
  <!-- Character 1A (Left - Leader speaking earnestly) -->
  <g transform="translate(45, 75)">
    <!-- Body & Suit -->
    <path d="M 15,35 L 30,35 L 35,70 L 5,70 Z" fill="#38bdf8"/>
    <path d="M 20,35 L 25,35 L 25,60 L 20,60 Z" fill="#f8fafc"/> <!-- Tie/Shirt -->
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="12" fill="#fcd34d"/>
    <path d="M 10,18 C 10,10 30,10 30,18 Z" fill="#0f172a"/>
    <!-- Gesture: Hand raised making a point -->
    <circle cx="35" cy="45" r="4" fill="#fcd34d"/>
  </g>

  <!-- Character 2A (Left supporter nodding) -->
  <g transform="translate(15, 100)">
    <path d="M 12,30 L 28,30 L 32,60 L 8,60 Z" fill="#0284c7"/>
    <circle cx="20" cy="18" r="10" fill="#fcd34d"/>
    <path d="M 12,14 C 12,8 28,8 28,14 Z" fill="#334155"/>
  </g>

  <!-- Props for Faction A: Folders & Blue documents -->
  <rect x="55" y="125" width="22" height="14" rx="2" fill="#38bdf8" transform="rotate(-10 55 125)"/>
  <rect x="35" y="135" width="20" height="12" rx="2" fill="#bae6fd" transform="rotate(5 35 135)"/>

  <!-- RIGHT FACTION (Group B: Emerald/Cool tone accents - contrasting viewpoint) -->
  <!-- Character 1B (Right - Leader crossing arms/resisting) -->
  <g transform="translate(160, 75)">
    <!-- Body & Suit -->
    <path d="M 15,35 L 30,35 L 40,70 L 10,70 Z" fill="#10b981"/>
    <path d="M 20,35 L 25,35 L 25,55 L 20,55 Z" fill="#f8fafc"/>
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="12" fill="#fcd34d"/>
    <path d="M 8,16 C 12,8 28,8 32,16 Z" fill="#475569"/>
    <!-- Crossed arms gesture -->
    <rect x="12" y="42" width="20" height="7" rx="3.5" fill="#059669" transform="rotate(-15 22 45)"/>
  </g>

  <!-- Character 2B (Right supporter whispering/discussing) -->
  <g transform="translate(190, 105)">
    <path d="M 10,30 L 26,30 L 30,60 L 6,60 Z" fill="#047857"/>
    <circle cx="18" cy="18" r="10" fill="#fcd34d"/>
    <path d="M 10,14 C 10,8 26,8 26,14 Z" fill="#1e293b"/>
  </g>

  <!-- Props for Faction B: Green folders & contrasting charts -->
  <rect x="160" y="120" width="24" height="15" rx="2" fill="#34d399" transform="rotate(12 160 120)"/>
  <rect x="180" y="132" width="20" height="12" rx="2" fill="#a7f3d0" transform="rotate(-5 180 132)"/>

  <!-- Abstract visual indicators of division / distinct factions (Floating subtle nodes) -->
  <!-- Left faction cluster icon -->
  <circle cx="45" cy="55" r="3" fill="#38bdf8"/>
  <circle cx="30" cy="65" r="2" fill="#38bdf8" opacity="0.6"/>
  <line x1="45" y1="55" x2="30" y2="65" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

  <!-- Right faction cluster icon -->
  <circle cx="195" cy="55" r="3" fill="#10b981"/>
  <circle cx="210" cy="65" r="2" fill="#10b981" opacity="0.6"/>
  <line x1="195" y1="55" x2="210" y2="65" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>

  <!-- Center divider subtle energy/barrier line representing differing views -->
  <line x1="120" y1="95" x2="120" y2="160" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>

</svg>