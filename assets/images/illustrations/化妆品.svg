<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with deep slate navy -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="vanityGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mirrorClip">
      <ellipse cx="120" cy="85" rx="45" ry="35"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#vanityGlow)"/>

  <!-- Room Interior Background Elements -->
  <!-- Wallpaper subtle stripe pattern -->
  <path d="M40 0 V200 M80 0 V200 M120 0 V200 M160 0 V200 M200 0 V200" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Vanity Table and Mirror Setup -->
  <ellipse cx="120" cy="85" rx="49" ry="39" fill="#334155"/>
  <ellipse cx="120" cy="85" rx="45" ry="35" fill="#0f172a"/>
  
  <!-- Mirror Reflection / Warm Glow -->
  <ellipse cx="120" cy="85" rx="45" ry="35" fill="#fbbf24" opacity="0.08"/>
  <circle cx="105" cy="70" r="15" fill="#38bdf8" opacity="0.1"/>

  <!-- Table surface -->
  <path d="M20 160 H220 V172 H20 Z" fill="#475569"/>
  <path d="M15 160 H225 V165 H15 Z" fill="#64748b"/>
  <!-- Table Legs -->
  <path d="M40 172 L30 220 H36 L44 172 Z" fill="#334155"/>
  <path d="M200 172 L210 220 H204 L196 172 Z" fill="#334155"/>

  <!-- MASSIVE PILE OF COSMETICS (Showing "lots of cosmetics" - 很多化妆品) -->
  <!-- Shopping bags overflowing with cosmetics in the background/side -->
  <path d="M20 120 C15 120 10 130 10 140 V165 C10 168 12 170 15 170 H45 C48 170 50 168 50 165 V140 C50 130 45 120 40 120 Z" fill="#ec4899"/>
  <path d="M25 120 V112 C25 108 35 108 35 112 V120" fill="none" stroke="#fbcfe8" stroke-width="2"/>
  <!-- Cosmetics sticking out of bag -->
  <rect x="20" y="105" width="8" height="20" rx="2" fill="#fb923c" transform="rotate(-15 24 115)"/>
  <rect x="32" y="102" width="10" height="25" rx="3" fill="#38bdf8" transform="rotate(10 37 115)"/>

  <!-- Vanity Tray and Cosmetics Pile (Center-Right & Center-Left) -->
  <ellipse cx="120" cy="158" rx="70" ry="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

  <!-- Perfume Bottle -->
  <path d="M75 145 H85 V158 H75 Z" fill="#f43f5e" opacity="0.9"/>
  <path d="M70 135 H90 V145 H70 Z" fill="#cbd5e1" opacity="0.8"/>
  <circle cx="80" cy="130" r="4" fill="#fbbf24"/>

  <!-- Lipstick Tower & Tubes -->
  <rect x="95" y="142" width="6" height="18" rx="1" fill="#fb923c"/>
  <path d="M95 142 H101 V145 L98 140 L95 145 Z" fill="#ec4899"/>
  
  <rect x="104" y="138" width="6" height="22" rx="1" fill="#38bdf8"/>
  <path d="M104 138 H110 V141 L107 136 L104 141 Z" fill="#f43f5e"/>

  <rect x="113" y="145" width="6" height="15" rx="1" fill="#10b981"/>
  
  <!-- Eyeshadow Palettes & Compacts (Stacked haphazardly to show "lots") -->
  <rect x="130" y="148" width="24" height="12" rx="3" fill="#cbd5e1" transform="rotate(-5 142 154)"/>
  <rect x="128" y="140" width="22" height="10" rx="3" fill="#ec4899" transform="rotate(8 139 145)"/>
  <circle cx="140" cy="132" r="7" fill="#fbbf24" stroke="#fff" stroke-width="1"/>

  <!-- Foundation bottles & jars -->
  <path d="M160 140 H172 V160 H160 Z" rx="3" fill="#e2e8f0"/>
  <path d="M163 135 H169 V140 H163 Z" fill="#334155"/>

  <circle cx="185" cy="148" r="8" fill="#f43f5e"/>
  <circle cx="185" cy="148" r="5" fill="#fda4af"/>
  
  <rect x="195" y="142" width="12" height="18" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Brushes container -->
  <path d="M55 140 L60 160 H72 L77 140 Z" fill="#fbcfe8"/>
  <line x1="62" y1="140" x2="56" y2="125" stroke="#334155" stroke-width="2"/>
  <circle cx="56" cy="123" r="3" fill="#ec4899"/>
  <line x1="66" y1="140" x2="65" y2="120" stroke="#334155" stroke-width="2"/>
  <circle cx="65" cy="118" r="3" fill="#fbbf24"/>
  <line x1="70" y1="140" x2="76" y2="122" stroke="#334155" stroke-width="2"/>
  <circle cx="76" cy="120" r="3" fill="#38bdf8"/>


  <!-- MAIN CHARACTER: Happy woman trying out / organizing her new cosmetics -->
  <!-- Torso & Shoulders -->
  <path d="M90 220 C90 190 100 180 120 180 C140 180 150 190 150 220 Z" fill="#ec4899"/>
  <!-- Neck -->
  <path d="M112 175 H128 V190 H112 Z" fill="#fcd34d"/>
  
  <!-- Head & Hair (Expressive, joyful pose) -->
  <path d="M95 125 C90 100 110 90 120 90 C130 90 150 100 145 125 C145 145 140 160 120 160 C100 160 95 145 95 125 Z" fill="#fcd34d"/> <!-- Face -->
  
  <!-- Hair Back/Sides -->
  <path d="M92 110 C80 120 80 155 90 175 C95 150 100 135 105 125 Z" fill="#0f172a"/>
  <path d="M148 110 C160 120 160 155 150 175 C145 150 140 135 135 125 Z" fill="#0f172a"/>
  <path d="M95 105 C100 85 140 85 145 105 C140 95 100 95 95 105 Z" fill="#0f172a"/> <!-- Bangs -->

  <!-- Facial Features (Delighted expression) -->
  <!-- Closed happy eyes ^ ^ -->
  <path d="M105 122 Q110 117 115 122" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M125 122 Q130 117 135 122" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Cheeks blushe/glow -->
  <circle cx="103" cy="128" r="5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="137" cy="128" r="5" fill="#f43f5e" opacity="0.4"/>
  <!-- Smile -->
  <path d="M114 135 Q120 142 126 135" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms and Hands interacting with cosmetics -->
  <!-- Right Arm holding a lipstick up in triumph/joy -->
  <path d="M145 190 C155 180 165 150 160 135" fill="none" stroke="#ec4899" stroke-width="12" stroke-linecap="round"/>
  <circle cx="159" cy="130" r="5" fill="#fcd34d"/> <!-- Hand -->
  <rect x="156" y="118" width="6" height="15" rx="1" fill="#f43f5e" transform="rotate(25 159 125)"/> <!-- Lipstick in hand -->

  <!-- Left Arm resting near tray -->
  <path d="M95 190 C85 180 90 160 105 155" fill="none" stroke="#ec4899" stroke-width="12" stroke-linecap="round"/>
  <circle cx="108" cy="153" r="5" fill="#fcd34d"/> <!-- Hand -->

  <!-- Floating Sparkles / Joy indicators -->
  <path d="M70 95 L73 102 L80 105 L73 108 L70 115 L67 108 L60 105 L67 102 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M175 100 L177 105 L182 107 L177 109 L175 114 L173 109 L168 107 L173 105 Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M165 75 L166 79 L170 80 L166 81 L165 85 L164 81 L160 80 L164 79 Z" fill="#fbbf24" opacity="0.9"/>

</svg>