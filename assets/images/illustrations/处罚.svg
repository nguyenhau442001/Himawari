<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background accent glow -->
  <circle cx="120" cy="120" r="70" fill="#E74C3C" opacity="0.08"/>

  <!-- Official Document / Notice representing Penalty (Xử phạt hành chính) -->
  <g transform="translate(0, 5)">
    <!-- Document Base -->
    <path d="M75 45 H145 L170 70 V190 C170 195.5 165.5 200 160 200 H80 C74.5 200 70 195.5 70 190 V50 C70 44.5 74.5 40 80 40 Z" fill="#2C323D"/>
    
    <!-- Document Fold Corner -->
    <path d="M145 40 L170 70 H145 Z" fill="#1E222B"/>

    <!-- Red Official Penalty Stamp (Hồng sắc ấn chương/hình phạt) -->
    <g transform="translate(120, 115) rotate(-15)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#E74C3C" stroke-width="4" stroke-dasharray="6,3"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <!-- Cross mark inside stamp for violation/penalty -->
      <path d="M-12 -12 L12 12 M-12 12 L12 -12" stroke="#E74C3C" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Document Text Lines -->
    <rect x="90" y="65" width="40" height="6" rx="3" fill="#4E596D"/>
    <rect x="90" y="85" width="60" height="4" rx="2" fill="#3E4859"/>
    <rect x="90" y="97" width="50" height="4" rx="2" fill="#3E4859"/>

    <!-- Traffic Violation Symbol Context at the bottom of the document -->
    <rect x="90" y="150" width="60" height="28" rx="4" fill="#1E222B"/>
    <!-- Simplified Traffic Light Icon on Document -->
    <circle cx="105" cy="164" r="5" fill="#E74C3C"/>
    <circle cx="120" cy="164" r="5" fill="#4E596D"/>
    <circle cx="135" cy="164" r="5" fill="#4E596D"/>
  </g>

  <!-- Legal Gavel (Búa pháp lý - biểu tượng xử phạt) -->
  <g transform="translate(0, 10)">
    <!-- Gavel Handle -->
    <path d="M40 185 L115 110" stroke="#D4AC0D" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Gavel Head Base (Block) -->
    <rect x="35" y="175" width="45" height="24" rx="4" transform="rotate(-45 57 187)" fill="#F1C40F"/>
    
    <!-- Gavel Head Metal Accent -->
    <rect x="29" y="169" width="16" height="30" rx="3" transform="rotate(-45 37 184)" fill="#E5B109"/>
    <rect x="63" y="203" width="16" height="30" rx="3" transform="rotate(-45 71 218)" fill="#E5B109"/>
  </g>
</svg>