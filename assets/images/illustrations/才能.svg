<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle glow/gradient -->
  <circle cx="120" cy="120" r="80" fill="#2D323E" opacity="0.3"/>

  <!-- Conceptual Central Element for "才能" (Talent/Capability - person equipped with tools/sprout of potential glowing and ascending) -->
  <!-- We represent human capability/talent as a stylized, capable human figure confidently holding or radiating potential and mastery, grounded in clean modern flat design. -->
  
  <!-- Subtle pedestal / ground line -->
  <path d="M 80,180 L 160,180" stroke="#3A4150" stroke-width="3" stroke-linecap="round"/>

  <!-- Human Figure representing the person (Noun: con người with talent) -->
  <!-- Head -->
  <circle cx="120" cy="85" r="18" fill="#F59E0B"/>
  
  <!-- Body / Torso -->
  <path d="M 98,140 C 98,115 108,110 120,110 C 132,110 142,115 142,140 L 145,175 L 95,175 Z" fill="#3B82F6"/>

  <!-- Arms outstretched dynamically showing capability and achievement -->
  <path d="M 108,125 L 75,105" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 132,125 L 165,105" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>

  <!-- Dynamic floating stars / sparks of brilliance / potential (representing "talent" in action) -->
  <g fill="#F59E0B">
    <!-- Left star -->
    <path d="M 65,85 L 68,92 L 75,95 L 68,98 L 65,105 L 62,98 L 55,95 L 62,92 Z"/>
    <!-- Right star -->
    <path d="M 175,85 L 178,92 L 185,95 L 178,98 L 175,105 L 172,98 L 165,95 L 172,92 Z"/>
    <!-- Top center star -->
    <path d="M 120,40 L 122,46 L 128,48 L 122,50 L 120,56 L 118,50 L 112,48 L 118,46 Z"/>
  </g>

  <!-- Accent upward rays symbolizing effort and success ("努力...成功") -->
  <path d="M 95,65 L 85,50" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 145,65 L 155,50" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

</svg>