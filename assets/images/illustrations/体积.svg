<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Grid/Space for depth -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="40" y1="120" x2="200" y2="120" stroke-dasharray="2,2"/>
    <line x1="120" y1="40" x2="120" y2="200" stroke-dasharray="2,2"/>
  </g>

  <!-- 3D Cube / Volume Representation (Thể tích) -->
  <g transform="translate(48, 48)">
    <!-- Dimension guides / measurement cues in Gold/Orange accent -->
    <!-- Height guide -->
    <path d="M 10 15 L 10 125" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
    <path d="M 7 15 L 13 15 M 7 125 L 13 125" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Width guide -->
    <path d="M 15 135 L 105 135" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
    <path d="M 15 132 L 15 138 M 105 132 L 105 138" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>

    <!-- Depth guide -->
    <path d="M 115 125 L 145 95" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
    <path d="M 114 122 L 117 127 M 143 93 L 148 98" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>

    <!-- 3D Isometric Box (Main Object representing Volume/Thể tích) -->
    <!-- Back faces / Inner lines (hidden structure hint) -->
    <path d="M 35 35 L 35 105 L 95 105" fill="none" stroke="#2D3748" stroke-width="2"/>

    <!-- Left Face -->
    <polygon points="35,35 35,105 95,105 95,35" fill="#3B82F6" opacity="0.85"/>
    
    <!-- Right Face -->
    <polygon points="95,35 95,105 135,65 135,-5" fill="#2563EB" opacity="0.95"/>
    
    <!-- Top Face -->
    <polygon points="35,35 75,-5 135,-5 95,35" fill="#60A5FA"/>

    <!-- Glowing internal grid/voxel breakdown to signify internal volume -->
    <g stroke="#93C5FD" stroke-width="1" opacity="0.4" fill="none">
      <!-- Left face grid -->
      <line x1="35" y1="58" x2="95" y2="58"/>
      <line x1="35" y1="82" x2="95" y2="82"/>
      <line x1="55" y1="35" x2="55" y2="105"/>
      <line x1="75" y1="35" x2="75" y2="105"/>

      <!-- Right face grid -->
      <line x1="95" y1="12" x2="135" y2="12"/>
      <line x1="95" y1="40" x2="135" y2="40"/>
      <line x1="105" y1="1" x2="105" y2="95"/>
      <line x1="120" y1="-3" x2="120" y2="50"/>

      <!-- Top face grid -->
      <line x1="55" y1="15" x2="115" y2="15"/>
      <line x1="75" y1="-5" x2="95" y2="35"/>
      <line x1="55" y1="-5" x2="115" y2="35"/>
    </g>

    <!-- Highlight edges for sleek flat/modern vector look -->
    <polyline points="35,105 95,105 135,65" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="35,35 35,105 95,105" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="35,35 75,-5 135,-5 135,65 95,105" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="95" y1="35" x2="95" y2="105" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="95" y1="35" x2="135" y2="-5" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>