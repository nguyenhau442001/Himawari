<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle Background Glow -->
  <circle cx="120" cy="120" r="70" fill="#2E2538" opacity="0.6"/>

  <!-- Perfume Bottle (香水) Vector Illustration -->
  <g transform="translate(0, 5)">
    <!-- Mist / Scent Particles -->
    <g opacity="0.8">
      <circle cx="120" cy="38" r="2" fill="#E8B966"/>
      <circle cx="108" cy="46" r="1.5" fill="#E8B966"/>
      <circle cx="132" cy="44" r="2.5" fill="#E8B966"/>
      <circle cx="96" cy="54" r="2" fill="#E8B966"/>
      <circle cx="144" cy="52" r="1.5" fill="#E8B966"/>
      <path d="M120 50 Q112 40 100 35" stroke="#E8B966" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M120 48 Q128 38 140 32" stroke="#E8B966" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M120 45 Q120 32 120 25" stroke="#E8B966" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Perfume Cap / Sprayer -->
    <path d="M110 56 L130 56 L128 66 L112 66 Z" fill="#D4AF37"/>
    <rect x="115" y="52" width="10" height="4" rx="1" fill="#E8C872"/>
    <rect x="118" y="48" width="4" height="4" fill="#B39235"/>

    <!-- Bottle Neck -->
    <path d="M112 66 L128 66 L126 76 L114 76 Z" fill="#3D4B63"/>
    
    <!-- Gold Collar / Accent -->
    <rect x="112" y="74" width="16" height="4" rx="1" fill="#E8C872"/>

    <!-- Main Glass Bottle Body (Elegant Curved Flask) -->
    <path d="M114 78 C95 78 82 92 82 120 C82 155 94 175 114 184 L114 194 L126 194 L126 184 C146 175 158 155 158 120 C158 92 145 78 126 78 Z" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>

    <!-- Liquid Inside Bottle (Gold/Amber Perfume) -->
    <path d="M85 125 C85 155 96 172 114 180 L114 190 L126 190 L126 180 C144 172 155 155 155 125 C155 125 155 110 155 105 C140 100 100 100 85 105 C85 110 85 125 85 125 Z" fill="#E8B966" opacity="0.85"/>

    <!-- Liquid Surface Wave -->
    <path d="M86 108 C100 102 140 102 154 108 C150 104 140 101 120 101 C100 101 90 104 86 108 Z" fill="#FFEAA5" opacity="0.9"/>

    <!-- Glass Reflection Highlights -->
    <!-- Left curved highlight -->
    <path d="M90 115 C90 145 98 165 110 175" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Right subtle reflection -->
    <path d="M148 115 C148 140 142 160 134 172" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.15"/>
    <!-- Small star sparkle -->
    <path d="M102 135 L104 140 L109 142 L104 144 L102 149 L100 144 L95 142 L100 140 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Elegant Label on Bottle -->
    <rect x="100" y="125" width="40" height="45" rx="4" fill="#1A1D24" opacity="0.85" stroke="#E8B966" stroke-width="1"/>
    <!-- Minimalist decorative graphic inside label -->
    <circle cx="120" cy="142" r="8" fill="none" stroke="#E8B966" stroke-width="1" opacity="0.7"/>
    <path d="M120 136 L120 148 M114 142 L126 142" stroke="#E8B966" stroke-width="1" opacity="0.7"/>

    <!-- Base / Reflection on surface -->
    <ellipse cx="120" cy="198" rx="22" ry="4" fill="#0E1116"/>
  </g>
</svg>