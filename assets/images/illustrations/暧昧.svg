<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Environment (Coffee shop / lounge, night) -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient background shapes & lighting -->
  <circle cx="120" cy="80" r="70" fill="#1e293b" opacity="0.6"/>
  <!-- Warm cafe lighting glow -->
  <circle cx="170" cy="90" r="45" fill="#f59e0b" opacity="0.12"/>
  
  <!-- Window / Cityscape silhouette backdrop -->
  <rect x="20" y="30" width="70" height="90" rx="4" fill="#1e293b" opacity="0.4"/>
  <rect x="30" y="40" width="20" height="30" fill="#334155" opacity="0.3"/>
  <rect x="60" y="40" width="20" height="50" fill="#334155" opacity="0.3"/>
  
  <!-- Potted plant for cozy setting -->
  <path d="M 25 180 C 25 160, 45 160, 45 180 Z" fill="#334155"/>
  <path d="M 35 160 L 35 130 C 25 110, 15 120, 15 120" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M 35 150 L 35 115 C 45 100, 55 110, 55 110" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Table surface -->
  <path d="M 40 185 L 200 185 L 210 210 L 30 210 Z" fill="#334155"/>
  <ellipse cx="120" cy="185" rx="80" ry="10" fill="#475569"/>
  <!-- Coffee cups / props -->
  <rect x="75" y="165" width="16" height="20" rx="2" fill="#e2e8f0"/>
  <path d="M 91 170 C 96 170, 96 180, 91 180" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="150" y="165" width="16" height="20" rx="2" fill="#cbd5e1"/>

  <!-- CHARACTER 1: Woman (Curious, attentive, slightly leaning in) -->
  <g transform="translate(0, 0)">
    <!-- Body & Torso -->
    <path d="M 65 210 C 65 180, 85 170, 95 170 L 105 170 C 115 170, 125 180, 125 210 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Neck -->
    <rect x="85" y="125" width="14" height="25" fill="#fca5a5"/>
    <!-- Head -->
    <circle cx="92" cy="115" r="22" fill="#ffd1dc"/>
    <!-- Hair (Dark bob) -->
    <path d="M 70 110 C 70 90, 114 90, 114 110 L 114 135 L 102 125 L 92 135 L 82 125 L 70 135 Z" fill="#1e293b"/>
    <!-- Facial expression: Thoughtful / questioning -->
    <circle cx="85" cy="115" r="2" fill="#0f172a"/>
    <circle cx="99" cy="115" r="2" fill="#0f172a"/>
    <!-- Gentle eyebrow tilt -->
    <path d="M 82 110 C 85 108, 88 108, 90 110" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 94 110 C 97 108, 100 108, 102 110" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Subtle curious mouth -->
    <path d="M 90 123 C 92 125, 94 125, 96 123" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hand on chin (contemplating his ambiguous attitude) -->
    <path d="M 95 160 C 95 150, 85 150, 88 140" fill="none" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="89" cy="138" r="5" fill="#fca5a5"/>
  </g>

  <!-- CHARACTER 2: Man (Representing "暧昧" - ambiguous posture: looking away while smiling faintly, leaning back, mixed signals) -->
  <g transform="translate(0, 0)">
    <!-- Body & Torso (leaning slightly back, defensive/evasive yet engaging) -->
    <path d="M 140 210 C 145 180, 155 170, 165 170 L 175 170 C 185 170, 185 190, 185 210 Z" fill="#fb923c" opacity="0.9"/>
    <!-- Neck -->
    <rect x="155" y="125" width="14" height="25" fill="#fca5a5"/>
    <!-- Head (Turned slightly away/upwards, creating ambiguous vibe) -->
    <circle cx="162" cy="115" r="22" fill="#ffd1dc"/>
    <!-- Hair (Stylish neat dark hair) -->
    <path d="M 140 112 C 140 92, 184 92, 184 112 L 184 120 C 175 115, 150 115, 140 120 Z" fill="#334155"/>
    <!-- Facial expression: Ambiguous smile, eyes looking sideways (not directly meeting hers) -->
    <!-- Eyes looking right/away -->
    <circle cx="168" cy="115" r="2" fill="#0f172a"/>
    <circle cx="175" cy="115" r="2" fill="#0f172a"/>
    <!-- Ambiguous half-smile (neither clear yes nor no) -->
    <path d="M 166 123 C 170 126, 175 125, 178 122" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Hand behind head / scratching neck gesture (classic ambivalent body language) -->
    <path d="M 165 145 C 175 130, 185 140, 180 120" fill="none" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="180" cy="118" r="5" fill="#fca5a5"/>
  </g>

  <!-- AMBIGUITY VISUAL METAPHOR: Floating subtle abstract question marks / hazy gradient clouds between them representing "mơ hồ / àimèi" -->
  <g opacity="0.6">
    <!-- Hazy glowing aura floating above the table between them -->
    <ellipse cx="130" cy="110" rx="20" ry="12" fill="#fbbf24" opacity="0.15"/>
    
    <!-- Stylized subtle glowing dots / shifting path -->
    <circle cx="120" cy="115" r="3" fill="#f43f5e" opacity="0.6"/>
    <circle cx="132" cy="100" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="140" cy="118" r="4" fill="#fbbf24" opacity="0.6"/>
    
    <!-- Flowing abstract wave of uncertainty above them -->
    <path d="M 115 105 Q 130 90 145 105" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" opacity="0.5"/>
  </g>

  <!-- Foreground framing / depth vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
</svg>