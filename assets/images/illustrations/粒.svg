<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "粒" (lì - grain/unit/enumeration of every single particle, reflecting "粒粒皆辛苦") -->
  <!-- Using a progression/escalation metaphor: magnification and meticulous accumulation of single fundamental units (grains) rising from base to high value. -->

  <!-- Subtle background grid/progression steps -->
  <g opacity="0.15">
    <line x1="40" y1="180" x2="200" y2="180" stroke="#8A99AD" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="40" y1="130" x2="200" y2="130" stroke="#8A99AD" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="40" y1="80" x2="200" y2="80" stroke="#8A99AD" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Escalation / Accumulation path (Staircase / Tiered growth representing meticulous accumulation of every single grain) -->
  <path d="M50 180 L90 180 L90 150 L130 150 L130 110 L170 110 L170 70 L200 70" fill="none" stroke="#2D3748" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Magnifying glass highlighting the micro-unit (The single grain/particle "粒") -->
  <!-- Glass rim -->
  <circle cx="95" cy="95" r="32" fill="#1A1D24" stroke="#F6AD55" stroke-width="4"/>
  <!-- Glass lens reflection -->
  <path d="M75 80 A 20 20 0 0 1 105 75" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="117" y1="117" x2="145" y2="145" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/>

  <!-- The single precise grain inside the lens (Focal point) -->
  <g transform="translate(95, 95)">
    <!-- Golden grain/rice droplet shape -->
    <path d="M 0 -14 C 8 -4, 10 6, 0 14 C -10 6, -8 -4, 0 -14 Z" fill="#F6AD55"/>
    <path d="M 0 -8 C 3 -2, 4 3, 0 9" fill="none" stroke="#DD6B20" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Cascading sequence of individual grains (representing "粒粒" - each and every particle accumulated through hard work) -->
  <!-- Grain 1 (Base level) -->
  <path d="M 65 174 C 70 170, 72 165, 67 160 C 62 165, 60 170, 65 174 Z" fill="#ED8936" opacity="0.6"/>
  <!-- Grain 2 -->
  <path d="M 105 144 C 110 140, 112 135, 107 130 C 102 135, 100 140, 105 144 Z" fill="#ED8936" opacity="0.8"/>
  <!-- Grain 3 (Top level / Peak accumulation) -->
  <path d="M 175 104 C 180 100, 182 95, 177 90 C 172 95, 170 100, 175 104 Z" fill="#F6AD55"/>

  <!-- Upward directional progression arrow emphasizing the meticulous accumulation and high value -->
  <path d="M 185 60 L 195 70 L 185 80" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="150" y1="70" x2="195" y2="70" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>

</svg>