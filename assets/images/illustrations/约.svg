<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Calendar Base Object (Noun representation of "yuē" / an appointment) -->
  <g transform="translate(45, 40)">
    <!-- Calendar Body -->
    <rect x="20" y="20" width="110" height="130" rx="12" fill="#282D3D" stroke="#3A4256" stroke-width="4"/>
    
    <!-- Calendar Header Top Bar -->
    <path d="M 20 32 A 12 12 0 0 1 32 20 L 118 20 A 12 12 0 0 1 130 32 L 130 55 L 20 55 Z" fill="#E56B38"/>
    
    <!-- Binding Rings -->
    <rect x="42" y="10" width="10" height="18" rx="5" fill="#F49A6E"/>
    <rect x="98" y="10" width="10" height="18" rx="5" fill="#F49A6E"/>
    
    <!-- Calendar Grid / Appointment Dots -->
    <circle cx="50" cy="80" r="6" fill="#3A4256"/>
    <circle cx="75" cy="80" r="6" fill="#3A4256"/>
    <circle cx="100" cy="80" r="6" fill="#3A4256"/>
    
    <circle cx="50" cy="105" r="6" fill="#3A4256"/>
    <!-- Highlighted Appointment Date with Clock/Meeting Indicator -->
    <circle cx="75" cy="105" r="14" fill="#E56B38"/>
    <path d="M 75 97 L 75 105 L 81 108" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <circle cx="100" cy="105" r="6" fill="#3A4256"/>
    
    <circle cx="50" cy="130" r="6" fill="#3A4256"/>
    <circle cx="75" cy="130" r="6" fill="#3A4256"/>
    <circle cx="100" cy="130" r="6" fill="#3A4256"/>
  </g>
  
  <!-- Stylized Clock Badge overlapping top-right to emphasize scheduled time/appointment -->
  <g transform="translate(145, 125)">
    <circle cx="25" cy="25" r="25" fill="#1A1D24" stroke="#E56B38" stroke-width="4"/>
    <circle cx="25" cy="25" r="21" fill="#282D3D"/>
    <!-- Clock Hands -->
    <path d="M 25 14 L 25 25 L 33 25" stroke="#F49A6E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>