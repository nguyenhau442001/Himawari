<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Left Object (Blue Cube) -->
  <g transform="translate(50, 100)">
    <path d="M0 20 L20 30 L40 20 L20 10 Z" fill="#4A90E2"/>
    <path d="M0 20 L20 30 L20 50 L0 40 Z" fill="#357ABD"/>
    <path d="M20 30 L40 20 L40 40 L20 50 Z" fill="#2A5D8C"/>
  </g>

  <!-- Right Object (Orange Sphere) -->
  <g transform="translate(150, 120)">
    <circle cx="20" cy="20" r="20" fill="#F5A623"/>
    <circle cx="20" cy="20" r="12" fill="#D08B1A"/>
  </g>

  <!-- Separation Line/Gap -->
  <line x1="120" y1="60" x2="120" y2="180" stroke="#374151" stroke-width="2" stroke-dasharray="8 8"/>
</svg>