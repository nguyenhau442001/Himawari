<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Shadow/Ground -->
  <ellipse cx="120" cy="195" rx="70" ry="12" fill="#000000" opacity="0.3"/>
  
  <!-- Main Object: A heavy, bulky cast-iron industrial block -->
  <g transform="translate(60, 70)">
    <!-- Main Body -->
    <path d="M10 0 L110 0 L120 20 L120 90 L0 90 L0 20 Z" fill="#4A5568"/>
    <!-- Top Detail (Bolt/Structure) -->
    <rect x="30" y="10" width="60" height="10" fill="#2D3748"/>
    <!-- Side Detail (Heavy texture/bolts) -->
    <circle cx="20" cy="50" r="8" fill="#2D3748"/>
    <circle cx="60" cy="50" r="8" fill="#2D3748"/>
    <circle cx="100" cy="50" r="8" fill="#2D3748"/>
    <!-- Accent Color for Focus -->
    <rect x="0" y="85" width="120" height="5" fill="#F6AD55"/>
  </g>
  
  <!-- Visual weight indicators (cracks/stress lines) -->
  <path d="M70 160 L85 160" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  <path d="M155 160 L170 160" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
</svg>