<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow representing winter cold/warmth contrast -->
  <circle cx="120" cy="120" r="80" fill="#222B38" opacity="0.6"/>
  <circle cx="120" cy="85" r="30" fill="#38BDF8" opacity="0.08"/>

  <!-- Down Jacket (羽绒服) Illustration -->
  <g transform="translate(0, 5)">
    <!-- Hanger & Hook -->
    <path d="M 120 35 L 120 48" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120 35 C 117 32, 112 32, 110 35 C 108 38, 110 41, 113 42" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Main Jacket Body (Puffer Jacket with Baffles/Quilting) -->
    <!-- Collar -->
    <path d="M 98 55 L 120 63 L 142 55 L 138 48 L 102 48 Z" fill="#0284C7"/>
    <path d="M 120 63 L 120 72" stroke="#0369A1" stroke-width="2"/>

    <!-- Left Sleeve -->
    <path d="M 98 58 Q 75 75 62 105 L 75 118 Q 90 92 104 72 Z" fill="#0EA5E9"/>
    <!-- Left Sleeve Baffles -->
    <path d="M 72 82 Q 83 74 95 65" stroke="#0284C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 68 96 Q 78 87 88 77" stroke="#0284C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Right Sleeve -->
    <path d="M 142 58 Q 165 75 178 105 L 165 118 Q 150 92 136 72 Z" fill="#0EA5E9"/>
    <!-- Right Sleeve Baffles -->
    <path d="M 168 82 Q 157 74 145 65" stroke="#0284C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 172 96 Q 162 87 152 77" stroke="#0284C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Torso -->
    <path d="M 98 56 L 142 56 Q 146 120 144 185 L 96 185 Q 94 120 98 56 Z" fill="#0EA5E9"/>

    <!-- Horizontal Quilting / Puffer Baffles (Torso) -->
    <path d="M 99 78 C 110 82, 130 82, 141 78" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 98 100 C 110 104, 130 104, 142 100" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 97 122 C 110 126, 130 126, 143 122" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 96 144 C 110 148, 130 148, 144 144" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 96 166 C 110 170, 130 170, 144 166" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Center Zipper Placket -->
    <path d="M 120 56 L 120 185" stroke="#0284C7" stroke-width="4" stroke-dasharray="4,2"/>
    <circle cx="120" cy="70" r="3" fill="#38BDF8"/>

    <!-- Zipper Pull / Accent (Orange/Gold for focus) -->
    <path d="M 120 73 L 120 83" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <rect x="117.5" y="83" width="5" height="7" rx="1.5" fill="#F59E0B"/>

    <!-- Pockets with Zippers -->
    <line x1="106" y1="158" x2="114" y2="158" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="105" cy="158" r="1.5" fill="#F59E0B"/>
    
    <line x1="126" y1="158" x2="134" y2="158" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="135" cy="158" r="1.5" fill="#F59E0B"/>
    
    <!-- Ribbed Cuffs and Hem Details -->
    <path d="M 64 105 L 77 118" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 176 105 L 163 118" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating stylized snowflakes / warmth indicator to signify winter wear -->
  <g opacity="0.6">
    <path d="M 60 140 L 60 152 M 54 146 L 66 146" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 182 140 L 182 152 M 176 146 L 188 146" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="60" cy="146" r="1" fill="#FFFFFF"/>
    <circle cx="182" cy="146" r="1" fill="#FFFFFF"/>
    
    <path d="M 75 60 L 75 68 M 71 64 L 79 64" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 165 60 L 165 68 M 161 64 L 169 64" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>