<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#FFC107" opacity="0.05"/>

  <!-- Trophy Illustration (Physical Object representing 获奖) -->
  <g transform="translate(0, 5)">
    <!-- Base -->
    <path d="M 95 175 L 145 175 L 140 160 L 100 160 Z" fill="#4A5568"/>
    <rect x="90" y="175" width="60" height="12" rx="3" fill="#2D3748"/>
    
    <!-- Stem -->
    <rect x="111" y="135" width="18" height="28" fill="#4A5568"/>

    <!-- Trophy Cup Body -->
    <path d="M 85 65 Q 120 75 155 65 L 145 130 Q 120 145 95 130 Z" fill="#FFC107"/>
    <path d="M 85 65 Q 120 75 155 65 L 150 95 Q 120 110 90 95 Z" fill="#FFD54F" opacity="0.6"/>

    <!-- Left Handle -->
    <path d="M 88 75 C 65 75 65 110 93 118" fill="none" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Right Handle -->
    <path d="M 152 75 C 175 75 175 110 147 118" fill="none" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>

    <!-- Inner Cup Depth -->
    <ellipse cx="120" cy="65" rx="35" ry="9" fill="#FFA000"/>
    <ellipse cx="120" cy="65" rx="30" ry="6" fill="#FFC107"/>

    <!-- Star Emblem on Trophy -->
    <polygon points="120,88 123,96 132,96 125,101 127,109 120,104 113,109 115,101 108,96 117,96" fill="#FFF" opacity="0.9"/>

    <!-- Sparkles / Highlights -->
    <path d="M 68 50 L 70 56 L 76 58 L 70 60 L 68 66 L 66 60 L 60 58 L 66 56 Z" fill="#FFE082"/>
    <path d="M 172 90 L 173 94 L 177 95 L 173 96 L 172 100 L 171 96 L 167 95 L 171 94 Z" fill="#FFE082"/>
    <circle cx="155" cy="48" r="3" fill="#FFE082"/>
    <circle cx="85" cy="135" r="2.5" fill="#FFE082"/>
  </g>
</svg>