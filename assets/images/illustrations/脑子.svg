<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (sleek modern tech glow) -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.5"/>
  
  <!-- Neural/Mental Clarity Rays -->
  <g opacity="0.3" stroke="#00E5FF" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="35" x2="120" y2="45" />
    <line x1="120" y1="195" x2="120" y2="205" />
    <line x1="35" y1="120" x2="45" y2="120" />
    <line x1="195" y1="120" x2="205" y2="120" />
    <line x1="60" y1="60" x2="67" y2="67" />
    <line x1="173" y1="173" x2="180" y2="180" />
    <line x1="60" y1="180" x2="67" y2="173" />
    <line x1="173" y1="67" x2="180" y2="60" />
  </g>

  <!-- Central Brain / Mind Illustration (Naozi) -->
  <g transform="translate(0, 5)">
    <!-- Outer Glow for Clarity / Alertness -->
    <path d="M120 52 C95 52 75 72 75 97 C75 110 81 122 90 130 L90 152 C90 156 93 159 97 159 L143 159 C147 159 150 156 150 152 L150 130 C159 122 165 110 165 97 C165 72 145 52 120 52 Z" fill="#2B313F" />

    <!-- Brain Hemispheres Base -->
    <!-- Left Hemisphere -->
    <path d="M117 60 C98 60 82 74 82 93 C82 103 86 112 93 118 L93 150 C93 152 95 154 97 154 L117 154 L117 60 Z" fill="#3A4454" />
    
    <!-- Right Hemisphere -->
    <path d="M123 60 C142 60 158 74 158 93 C158 103 154 112 147 118 L147 150 C147 152 145 154 143 154 L123 154 L123 60 Z" fill="#434F63" />

    <!-- Brain Sulci / Gyri (Detail lines) - Left -->
    <path d="M92 78 C100 78 105 85 105 92" stroke="#2B313F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M90 102 C102 102 108 108 108 116" stroke="#2B313F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M96 130 C104 130 110 134 110 142" stroke="#2B313F" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Brain Sulci / Gyri (Detail lines) - Right -->
    <path d="M148 78 C140 78 135 85 135 92" stroke="#3A4454" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M150 102 C138 102 132 108 132 116" stroke="#3A4454" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M144 130 C136 130 130 134 130 142" stroke="#3A4454" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Central Divider -->
    <line x1="120" y1="60" x2="120" y2="154" stroke="#1A1D24" stroke-width="3"/>

    <!-- Frontal Lobe / Clarity Accent (Representing "Qingxian" - Clear/Alert Mind) -->
    <circle cx="100" cy="85" r="4" fill="#00E5FF"/>
    <circle cx="140" cy="85" r="4" fill="#00E5FF"/>
    <circle cx="120" cy="110" r="5" fill="#FFB703"/>
    
    <!-- Synapse / Activity Sparks (Orange/Gold for focus & alertness) -->
    <path d="M100 85 L120 110 L140 85" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M120 110 L120 140" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="140" r="3" fill="#FFB703"/>
  </g>

  <!-- Base Stand / Stem (Brainstem / Neck structure connecting to body) -->
  <path d="M108 154 L108 168 C108 172 112 175 116 175 L124 175 C128 175 132 172 132 168 L132 154 Z" fill="#2B313F"/>
  <path d="M100 175 L140 175 C146 175 150 179 150 184 L150 188 C150 190 148 192 146 192 L94 192 C92 192 90 190 90 188 L90 184 C90 179 94 175 100 175 Z" fill="#3A4454"/>

  <!-- Focus/Alertness Indicator (Glowing Ring framing the brain nicely) -->
  <circle cx="120" cy="115" r="58" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.4"/>
</svg>