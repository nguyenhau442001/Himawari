<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow from Broadcast waves -->
  <circle cx="120" cy="115" r="70" fill="#3B82F6" opacity="0.08"/>
  <circle cx="120" cy="115" r="45" fill="#3B82F6" opacity="0.12"/>

  <!-- Broadcast Waves (Left & Right) -->
  <path d="M 85 85 A 35 35 0 0 0 85 145" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 68 65 A 60 60 0 0 0 68 165" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  
  <path d="M 155 85 A 35 35 0 0 1 155 145" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 172 65 A 60 60 0 0 1 172 165" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- TV Antennae -->
  <line x1="120" y1="80" x2="95" y2="45" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="145" y2="45" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="95" cy="45" r="3.5" fill="#F59E0B"/>
  <circle cx="145" cy="45" r="3.5" fill="#F59E0B"/>

  <!-- Modern Flat TV / Broadcasting Monitor -->
  <!-- Outer Frame & Stand -->
  <rect x="70" y="80" width="100" height="70" rx="8" fill="#334155"/>
  <rect x="74" y="84" width="92" height="62" rx="5" fill="#0F172A"/>
  
  <!-- Stand base -->
  <path d="M 100 150 L 140 150 L 146 156 L 94 156 Z" fill="#64748B"/>
  <rect x="112" y="146" width="16" height="4" fill="#475569"/>

  <!-- Screen Content (Live Broadcast Scene) -->
  <g clip-path="url(#screen-clip)">
    <clipPath id="screen-clip">
      <rect x="74" y="84" width="92" height="62" rx="5"/>
    </clipPath>
    
    <!-- Screen Background Gradient -->
    <rect x="74" y="84" width="92" height="62" fill="#1E293B"/>

    <!-- Simulated On-Screen Graphic: Landscape / Broadcast subject -->
    <path d="M 74 130 Q 100 110 120 125 T 166 115 L 166 146 L 74 146 Z" fill="#0D9488" opacity="0.4"/>
    <circle cx="145" cy="102" r="8" fill="#FBBF24"/> <!-- Sun / Studio Light -->

    <!-- Broadcaster Character inside screen -->
    <circle cx="120" cy="112" r="10" fill="#CBD5E1"/> <!-- Head -->
    <path d="M 106 135 C 106 124 112 122 120 122 C 128 122 134 124 134 135 Z" fill="#38BDF8"/> <!-- Body/Suit -->
  </g>

  <!-- Live Recording Indicator (Blinking Red Dot + Text Representation shape) -->
  <circle cx="86" cy="95" r="3" fill="#EF4444"/>
  <circle cx="86" cy="95" r="5" fill="#EF4444" opacity="0.4">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Signal / Play Accent Icon (Gold badge below) -->
  <circle cx="120" cy="188" r="18" fill="#F59E0B"/>
  <polygon points="114,178 130,188 114,198" fill="#1A1D24"/>
</svg>