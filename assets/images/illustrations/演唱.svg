<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow behind performer -->
  <circle cx="120" cy="110" r="70" fill="#FF9F43" opacity="0.08"/>

  <!-- Dynamic sound/motion lines representing singing (演唱 action) -->
  <g fill="none" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <!-- Sound waves radiating from singer -->
    <path d="M 85 70 C 75 80 75 100 85 110" />
    <path d="M 70 55 C 55 75 55 105 70 125" />
    
    <!-- Floating musical notes for performance context -->
    <path d="M 175 60 L 175 85 M 175 65 C 170 63 163 65 160 70 C 157 75 160 82 166 83" fill="#FF9F43" stroke="none"/>
    <circle cx="156" cy="83" r="4" fill="#FF9F43"/>
    
    <path d="M 65 145 L 65 165 M 65 149 C 62 147 57 149 55 153 C 53 157 55 162 60 163" fill="#FF9F43" stroke="none"/>
    <circle cx="57" cy="161" r="3" fill="#FF9F43"/>
  </g>

  <!-- Microphone Stand -->
  <g stroke="#8A99AD" stroke-width="3" stroke-linecap="round">
    <!-- Base -->
    <path d="M 100 200 L 140 200" stroke-width="4"/>
    <!-- Vertical pole -->
    <line x1="120" y1="200" x2="120" y2="120"/>
    <!-- Boom arm -->
    <line x1="120" y1="120" x2="135" y2="95"/>
  </g>

  <!-- Microphone Head -->
  <g transform="translate(135, 90)">
    <rect x="-6" y="-10" width="12" height="16" rx="6" fill="#F1F5F9"/>
    <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#475569" stroke-width="1.5"/>
    <line x1="-6" y1="2" x2="6" y2="2" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Singer Character (Dynamic Action - Verb) -->
  <g>
    <!-- Torso and shoulders -->
    <path d="M 95 160 C 95 140 105 130 120 130 C 135 130 145 140 145 160 L 145 200 L 95 200 Z" fill="#3B82F6"/>
    
    <!-- Raised arm holding/singing towards mic -->
    <path d="M 105 135 C 115 125 130 120 138 128" fill="none" stroke="#FEE2E2" stroke-width="10" stroke-linecap="round"/>

    <!-- Head & Hair (Expressive pose, tilted back slightly) -->
    <circle cx="112" cy="108" r="18" fill="#FEE2E2"/>
    <path d="M 98 100 C 95 85 110 80 125 90 C 128 92 128 98 125 105 Z" fill="#1E293B"/>

    <!-- Facial expression: Open mouth singing -->
    <path d="M 118 112 C 120 112 122 114 121 117 C 120 119 116 119 115 117 Z" fill="#991B1B"/>
    <!-- Closed happy/passionate eye -->
    <path d="M 120 104 C 122 102 125 104 127 106" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Stage Spotlight Cone Effect -->
  <path d="M 120 0 L 20 200 L 220 200 Z" fill="#FF9F43" opacity="0.04" style="mix-blend-mode: screen;"/>
</svg>