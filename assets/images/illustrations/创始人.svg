<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Architectural Blueprint/Framework Background Lines (representing foundation/creation) -->
    <path d="M50 145 L120 105 L190 145" fill="none" stroke="#2D333F" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="120" y1="105" x2="120" y2="185" stroke="#2D333F" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Foundation Base -->
    <path d="M70 185 L170 185 L180 195 L60 195 Z" fill="#3A4252"/>
    <rect x="75" y="170" width="90" height="15" rx="2" fill="#4E5D6C"/>

    <!-- Emerging Core Structure (The "Creation/Start" concept) -->
    <polygon points="120,65 155,95 155,160 85,160 85,95" fill="#252A34"/>
    <polygon points="120,55 165,95 75,95" fill="#3B82F6"/>

    <!-- Glowing Blueprint Energy Node (Origin/Spark) -->
    <circle cx="120" cy="115" r="16" fill="#F59E0B" opacity="0.2"/>
    <circle cx="120" cy="115" r="10" fill="#F59E0B"/>
    <path d="M120 107 L120 123 M112 115 L128 115" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

    <!-- Confident Pioneer/Founder Character (Central Human Figure) -->
    <!-- Torso & Shoulders -->
    <path d="M90 200 C90 175 105 165 120 165 C135 165 150 175 150 200 Z" fill="#10B981"/>
    <rect x="110" y="155" width="20" height="18" rx="4" fill="#E2E8F0"/>
    <!-- Collar -->
    <path d="M110 158 L120 168 L130 158" fill="none" stroke="#0F172A" stroke-width="2"/>

    <!-- Head & Hair -->
    <circle cx="120" cy="130" r="18" fill="#FDE68A"/>
    <!-- Modern Hair Style -->
    <path d="M102 128 C102 115 112 110 122 110 C134 110 138 120 138 132 C138 132 138 134 138 134 C132 124 122 122 112 126 C107 128 102 128 102 128 Z" fill="#1E293B"/>

    <!-- Inspiring Visionary Pose (Hand pointing forward/upward towards future creation) -->
    <path d="M140 175 L165 150 L175 155" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="175" cy="155" r="5" fill="#FDE68A"/>

    <!-- Spark of Vision / Innovation Star Icon -->
    <g transform="translate(170, 75)">
      <path d="M0 -12 C0 -4 4 0 12 0 C4 0 0 4 0 12 C0 4 -4 0 -12 0 C-4 0 0 -4 0 -12 Z" fill="#F59E0B"/>
    </g>
    <g transform="translate(70, 95) scale(0.6)">
      <path d="M0 -12 C0 -4 4 0 12 0 C4 0 0 4 0 12 C0 4 -4 0 -12 0 C-4 0 0 -4 0 -12 Z" fill="#F59E0B"/>
    </g>
  </g>
</svg>