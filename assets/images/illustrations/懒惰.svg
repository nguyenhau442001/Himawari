<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="140" width="200" height="15" rx="4" fill="#475569"/>
  <rect x="30" y="155" width="10" height="85" fill="#334155"/>
  <rect x="200" y="155" width="10" height="85" fill="#334155"/>
  
  <!-- Computer Monitor -->
  <rect x="130" y="70" width="80" height="60" rx="4" fill="#334155"/>
  <rect x="135" y="75" width="70" height="50" rx="2" fill="#0f172a"/>
  <circle cx="170" cy="100" r="10" fill="#fb923c" opacity="0.3"/>
  
  <!-- Character -->
  <g transform="translate(40, 60)">
    <!-- Body slumped -->
    <path d="M20 120 Q60 120 80 100 L90 150 L10 150 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="80" r="25" fill="#fde68a"/>
    <!-- Eyes closed (lazy) -->
    <path d="M40 75 L48 80 M52 80 L60 75" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M45 95 Q50 90 55 95" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm slumped on desk -->
    <path d="M70 110 L120 130 L125 145 L80 135 Z" fill="#fde68a"/>
  </g>
  
  <!-- Cluttered props -->
  <circle cx="180" cy="150" r="12" fill="#ec4899"/>
  <rect x="150" y="145" width="20" height="5" rx="2" fill="#fbbf24"/>
  <path d="M190 130 L210 130 L205 140 L195 140 Z" fill="#10b981"/>
  
  <!-- Coffee mug -->
  <rect x="100" y="125" width="20" height="20" rx="2" fill="#fb923c"/>
  <path d="M120 130 Q130 130 130 140" stroke="#fb923c" stroke-width="4" fill="none"/>
</svg>