<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Background subtle glow representing abundance/group -->
    <circle cx="120" cy="115" r="75" fill="#242B38" opacity="0.6"/>
    
    <!-- Central character / Young professional volunteer with high qualification -->
    <!-- Head & Hair -->
    <circle cx="120" cy="72" r="16" fill="#F39C12"/>
    <path d="M 104 68 C 104 56, 136 56, 136 68 C 136 72, 133 74, 133 74 C 133 74, 128 64, 120 64 C 112 64, 107 74, 107 74 C 107 74, 104 72, 104 68 Z" fill="#2C3E50"/>
    
    <!-- Torso (Voluntary uniform / professional attire with subtle badge) -->
    <path d="M 92 125 L 105 92 L 135 92 L 148 125 C 148 145, 92 145, 92 125 Z" fill="#3498DB"/>
    <!-- Collar & Tie/Symbol -->
    <polygon points="120,92 114,106 126,106" fill="#ECF0F1"/>
    
    <!-- Professional / Academic credentials floating or held (Graduation cap/Diploma icon integrated as physical object) -->
    <!-- Academic Cap floating top left -->
    <g transform="translate(62, 55) rotate(-12)">
      <polygon points="18,5 32,12 18,19 4,12" fill="#E74C3C"/>
      <polygon points="18,5 32,12 18,19 4,12" stroke="#C0392B" stroke-width="1" fill="none"/>
      <rect x="14" y="16" width="8" height="7" fill="#C0392B"/>
      <path d="M 28 14 L 30 22 L 28 23" stroke="#F1C40F" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Professional Gear / Technical tool badge top right representing "专业技能" -->
    <g transform="translate(170, 60) rotate(10)">
      <circle cx="12" cy="12" r="12" fill="#2ECC71"/>
      <path d="M 12 6 L 13.5 9.5 L 17 11 L 13.5 12.5 L 12 16 L 10.5 12.5 L 7 11 L 10.5 9.5 Z" fill="#FFFFFF"/>
    </g>

    <!-- Surrounding stylized silhouettes indicating "abundance / 不乏 (not lacking / many)" -->
    <!-- Left person silhouette -->
    <circle cx="68" cy="95" r="11" fill="#4B6584"/>
    <path d="M 52 135 L 60 115 L 76 115 L 84 135 Z" fill="#4B6584"/>

    <!-- Right person silhouette -->
    <circle cx="172" cy="95" r="11" fill="#4B6584"/>
    <path d="M 156 135 L 164 115 L 180 115 L 188 135 Z" fill="#4B6584"/>

    <!-- Foreground group alignment line / base platform -->
    <path d="M 50 155 L 190 155" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Abundance indicator dots / stars emphasizing "不乏" (plentiful, numerous) -->
    <circle cx="95" cy="42" r="2.5" fill="#F1C40F" opacity="0.8"/>
    <circle cx="145" cy="40" r="3.5" fill="#F1C40F"/>
    <circle cx="160" cy="52" r="2" fill="#F1C40F" opacity="0.6"/>
    <circle cx="82" cy="48" r="2" fill="#F1C40F" opacity="0.7"/>
  </g>
</svg>