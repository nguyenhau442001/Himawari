<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Clock/Deadline Indicator -->
  <circle cx="180" cy="50" r="25" fill="#1e293b" stroke="#fb923c" stroke-width="3"/>
  <path d="M180 35 L180 50 L195 50" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Paper/Application -->
  <rect x="70" y="100" width="80" height="100" rx="4" fill="#f8fafc"/>
  <rect x="80" y="115" width="60" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="80" y="130" width="60" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="80" y="145" width="40" height="6" rx="2" fill="#cbd5e1"/>
  
  <!-- Hand placing the paper -->
  <path d="M110 150 C 100 130, 150 120, 160 140" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <circle cx="160" cy="140" r="12" fill="#fbbf24"/>
  
  <!-- Character (Head/Shoulders) -->
  <circle cx="60" cy="140" r="30" fill="#38bdf8"/>
  <path d="M45 135 Q 50 145 60 145 Q 70 145 75 135" stroke="#0f172a" stroke-width="2" fill="none"/>
  <circle cx="50" cy="135" r="3" fill="#0f172a"/>
  <circle cx="70" cy="135" r="3" fill="#0f172a"/>
  
  <!-- Mailbox Slot/Submission Point -->
  <rect x="170" y="140" width="50" height="20" rx="2" fill="#10b981"/>
  <rect x="175" y="145" width="40" height="10" rx="1" fill="#064e3b"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="4" fill="#ec4899"/>
  <circle cx="210" cy="200" r="6" fill="#38bdf8"/>
</svg>