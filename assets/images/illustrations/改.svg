<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing digital workspace / coding environment -->
  <circle cx="120" cy="120" r="90" fill="#252A34" opacity="0.6"/>
  
  <!-- Document / Code block being edited (representing "这个错误我已经改了") -->
  <g transform="translate(48, 42)">
    <!-- Document background -->
    <rect width="144" height="156" rx="8" fill="#222733" stroke="#2E3646" stroke-width="2"/>
    
    <!-- Code lines / text placeholders -->
    <rect x="18" y="22" width="60" height="8" rx="4" fill="#3E4859"/>
    <rect x="18" y="42" width="108" height="8" rx="4" fill="#3E4859"/>
    <rect x="18" y="62" width="84" height="8" rx="4" fill="#3E4859"/>
    
    <!-- The "Error" line (being corrected) with red indicator -->
    <rect x="18" y="82" width="108" height="16" rx="4" fill="#3B2629"/>
    <circle cx="26" cy="90" r="4" fill="#FF5252"/>
    <rect x="36" y="86" width="76" height="8" rx="4" fill="#FF8A80" opacity="0.8"/>
    
    <!-- The "Corrected" line with bright accent (gold/orange) indicating action "改" -->
    <rect x="18" y="108" width="108" height="16" rx="4" fill="#362E22"/>
    <circle cx="26" cy="116" r="4" fill="#FFC107"/>
    <rect x="36" y="112" width="64" height="8" rx="4" fill="#FFD54F"/>
    
    <!-- More untouched code lines -->
    <rect x="18" y="136" width="92" height="8" rx="4" fill="#3E4859"/>
  </g>

  <!-- Dynamic Correction Action / Motion Graphic -->
  <!-- Pencil / Editing tool applying the change -->
  <g transform="translate(130, 95) rotate(-35)">
    <!-- Motion trails representing the verb action (changing/fixing) -->
    <path d="M -25 -15 L -45 -15" stroke="#FF9800" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M -25 -8 L -38 -8" stroke="#FFC107" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Pen body -->
    <path d="M0 -6 L25 -6 L25 6 L0 6 Z" fill="#FFA726"/>
    <!-- Pen tip -->
    <polygon points="0,-6 -12,0 0,6" fill="#FFC107"/>
    <!-- Metal ferrule -->
    <rect x="23" y="-6" width="4" height="12" fill="#CFD8DC"/>
    <!-- Eraser / Top -->
    <rect x="27" y="-6" width="8" height="12" rx="2" fill="#AB47BC"/>
  </g>

  <!-- Sparkle / Success impact dots showing completed change -->
  <g fill="#FFC107">
    <circle cx="124" cy="98" r="2.5"/>
    <circle cx="112" cy="85" r="1.5"/>
    <path d="M 132 80 L 135 74 L 138 80 L 144 83 L 138 86 L 135 92 L 132 86 L 126 83 Z" opacity="0.9"/>
  </g>

  <!-- Focus/Action arc lines highlighting the active modification -->
  <path d="M 105 85 C 115 75, 135 75, 145 85" fill="none" stroke="#FF9800" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>