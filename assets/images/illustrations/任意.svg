<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient and room interior -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Window/Background architectural details -->
  <path d="M40 30 L80 30 L80 130 L40 130 Z" fill="#1e293b" opacity="0.4"/>
  <rect x="45" y="35" width="30" height="40" rx="4" fill="#0f172a"/>
  <rect x="45" y="80" width="30" height="40" rx="4" fill="#0f172a"/>

  <!-- Office/Meeting Room Wall Board (Rules/Regulations display) -->
  <rect x="110" y="25" width="105" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="118" y="33" width="89" height="69" rx="4" fill="url(#boardGrad)" opacity="0.15"/>
  <!-- Rule document mock layout lines -->
  <rect x="126" y="45" width="45" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="126" y="58" width="73" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
  <rect x="126" y="66" width="60" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
  <rect x="126" y="74" width="68" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
  <rect x="126" y="82" width="40" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>

  <!-- Warning / Prohibition Stamp Overlay (Visualizing "Cannot change arbitrarily") -->
  <g transform="translate(160, 65) rotate(-15)">
    <rect x="-22" y="-12" width="44" height="24" rx="4" fill="none" stroke="#ef4444" stroke-width="3"/>
    <path d="M-15 -6 L15 6 M-15 6 L15 -6" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Office Desk Surface -->
  <path d="M15 170 L225 170 L210 215 L30 215 Z" fill="url(#deskGrad)"/>
  <rect x="15" y="165" width="210" height="8" rx="2" fill="#475569"/>

  <!-- Desk Props: Laptop & Coffee Mug -->
  <!-- Laptop Base -->
  <path d="M60 165 L110 165 L120 180 L50 180 Z" fill="#64748b"/>
  <!-- Laptop Screen -->
  <path d="M62 130 L108 130 L110 166 L60 166 Z" fill="#334155"/>
  <rect x="68" y="136" width="34" height="22" rx="2" fill="#0ea5e9" opacity="0.3"/>
  <!-- Coffee Mug -->
  <rect x="135" y="152" width="14" height="18" rx="3" fill="#fb923c"/>
  <path d="M149 157 C153 157 153 165 149 165" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Main Character: Professional Team Lead / Manager gesturing stop/restriction -->
  <!-- Character Body / Torso -->
  <path d="M75 160 C75 130 90 120 110 120 C130 120 145 130 145 160 Z" fill="#0284c7"/>
  <path d="M95 120 L125 120 L135 160 L85 160 Z" fill="#38bdf8"/> <!-- Shirt collar & front -->
  <path d="M102 120 L118 120 L115 140 L105 140 Z" fill="#cbd5e1"/> <!-- Tie -->

  <!-- Character Neck & Head -->
  <rect x="103" y="102" width="14" height="20" rx="4" fill="#fbcfe8"/>
  <circle cx="110" cy="90" r="18" fill="#fbcfe8"/>

  <!-- Character Hair (Modern styled dark hair) -->
  <path d="M92 90 C92 75 100 72 110 72 C120 72 128 75 128 90 C128 95 125 93 125 88 C125 78 118 76 110 76 C102 76 95 78 95 88 C95 93 92 95 92 90 Z" fill="#334155"/>

  <!-- Facial Expression: Serious, firm, decisive -->
  <circle cx="104" cy="88" r="1.5" fill="#1e293b"/>
  <circle cx="116" cy="88" r="1.5" fill="#1e293b"/>
  <!-- Firm straight mouth -->
  <path d="M106 97 L114 97" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyebrows angled down in determination -->
  <path d="M101 83 L107 85" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M113 85 L119 83" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character Arms & Hands (Stopping gesture emphasizing the rule) -->
  <!-- Left Arm (bent holding side) -->
  <path d="M78 135 L65 155 L75 165" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Arm & Hand raised firmly in stop gesture -->
  <path d="M140 130 L165 110 L170 95" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Palm facing forward (Stop action) -->
  <circle cx="172" cy="90" r="8" fill="#fbcfe8"/>

  <!-- Foreground Ambient Lighting / Glow Highlights -->
  <circle cx="172" cy="90" r="16" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Secondary Character (Employee looking on, understanding the rule constraint) -->
  <!-- Head & Body partially visible on the right -->
  <circle cx="195" cy="140" r="14" fill="#fed7aa"/>
  <path d="M185 132 C185 122 192 120 198 120 C205 120 210 124 210 134 C210 134 205 133 200 133 C193 133 185 132 185 132 Z" fill="#78350f"/>
  <path d="M180 155 C180 145 187 142 195 142 C203 142 210 145 210 155 L215 210 L175 210 Z" fill="#475569"/>
  <!-- Surprised/Curious Expression -->
  <circle cx="191" cy="138" r="1" fill="#1e293b"/>
  <circle cx="199" cy="138" r="1" fill="#1e293b"/>
  <circle cx="195" cy="144" r="2" fill="#1e293b"/> <!-- open mouth realizing -->

</svg>