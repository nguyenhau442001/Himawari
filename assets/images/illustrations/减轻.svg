<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: A classic mechanical balance scale (representing lightening/reducing weight or load), 
       with one side visibly lighter/higher to depict "jiǎnqīng" (reduction/alleviation). -->
       
  <!-- Background subtle glow behind the scale for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Scale Stand / Base -->
  <!-- Base platform -->
  <path d="M 90 190 L 150 190 C 155 190, 155 196, 150 196 L 90 196 C 85 196, 85 190, 90 190 Z" fill="#64748B"/>
  <!-- Vertical pillar -->
  <rect x="116" y="90" width="8" height="100" rx="2" fill="#94A3B8"/>
  <!-- Top finial / cap -->
  <circle cx="120" cy="90" r="6" fill="#F59E0B"/>

  <!-- Balance Beam & Pivot Assembly -->
  <!-- Pivot triangle -->
  <polygon points="120,86 110,102 130,102" fill="#CBD5E1"/>
  
  <!-- Beam (Tilted to show weight reduction on the right side) -->
  <!-- Rotated group around pivot (120, 96) -->
  <g transform="rotate(-12, 120, 96)">
    <!-- Main beam bar -->
    <rect x="50" y="92" width="140" height="8" rx="4" fill="#F8FAFC"/>
    
    <!-- Left Chain & Pan (Heavier side, positioned lower) -->
    <line x1="60" y1="100" x2="60" y2="145" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="100" x2="75" y2="145" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left Pan -->
    <path d="M 40 145 C 40 155, 95 155, 95 145 Z" fill="#E2E8F0"/>
    <!-- Heavy load objects on left pan (representing stress/weight/burden) -->
    <rect x="55" y="125" width="26" height="20" rx="3" fill="#EF4444"/>
    <rect x="62" y="112" width="18" height="15" rx="2" fill="#DC2626"/>

    <!-- Right Chain & Pan (Lighter/Reduced side, positioned higher) -->
    <line x1="180" y1="100" x2="165" y2="125" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="180" y1="100" x2="180" y2="125" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right Pan -->
    <path d="M 145 125 C 145 135, 200 135, 200 125 Z" fill="#E2E8F0"/>
    <!-- Light/reduced load on right pan (a single small green leaf/feather representing alleviation) -->
    <path d="M 172 122 C 172 122, 178 112, 185 110 C 185 116, 178 123, 172 122 Z" fill="#10B981"/>
    <path d="M 172 122 C 172 122, 168 120, 165 125 C 168 126, 171 124, 172 122 Z" fill="#34D399"/>
  </g>

  <!-- Accent upward motion indicator / reduction effect (Gold/Orange sleek arrows floating up on the right) -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 175 75 L 180 65 L 185 75" opacity="0.9"/>
    <path d="M 175 60 L 180 50 L 185 60" opacity="0.5"/>
  </g>
</svg>