<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow/spotlight for central character -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>

  <!-- Ambassador Character Representation (Noun: Con người - Đại sứ) -->
  <!-- Suit / Body -->
  <path d="M90 190 L90 155 C90 142 100 135 120 135 C140 135 150 142 150 155 L150 190 Z" fill="#2E384D"/>
  
  <!-- Shirt & Tie -->
  <polygon points="120,142 110,165 130,165" fill="#E2E8F0"/>
  <polygon points="120,162 116,190 124,190" fill="#F59E0B"/> <!-- Gold accent tie -->

  <!-- Suit Jacket Lapels -->
  <path d="M105 135 L120 165 L105 190" fill="#1E2533"/>
  <path d="M135 135 L120 165 L135 190" fill="#1E2533"/>

  <!-- Neck & Head -->
  <rect x="113" y="122" width="14" height="18" fill="#FCE7F3" rx="4"/>
  <circle cx="120" cy="100" r="22" fill="#FCE7F3"/>
  
  <!-- Hair (Sleek, professional neat cut) -->
  <path d="M98 100 C98 84 106 80 120 80 C134 80 142 84 142 100 C142 103 140 101 140 94 C140 85 132 82 120 82 C108 82 100 85 100 94 C100 101 98 103 98 100 Z" fill="#334155"/>

  <!-- Diplomatic Sash / Ribbon (Signifying high state representation) -->
  <path d="M96 138 L144 185" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
  <circle cx="144" cy="185" r="4" fill="#FBBF24"/>

  <!-- Diplomatic Credentials Document (Representing 国书 being delivered) -->
  <g transform="translate(130, 115) rotate(15)">
    <!-- Document background -->
    <rect x="0" y="0" width="36" height="46" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Wax seal ribbon/medal hanging -->
    <rect x="14" y="32" width="8" height="18" fill="#DC2626"/>
    <circle cx="18" cy="42" r="5" fill="#B91C1C"/>
    <!-- Text lines placeholder -->
    <line x1="6" y1="8" x2="26" y2="8" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="30" y2="14" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="22" y2="20" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="28" y2="26" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ambassador's Hand holding the document forward -->
  <path d="M135 145 C145 145 152 152 148 160 C146 163 142 163 138 160" fill="#FCE7F3" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>