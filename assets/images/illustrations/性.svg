<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "Importance" (性) as a central, heavy, golden anchor/weight on a pedestal -->
  <!-- The weight symbolizes the core essence or "nature" of a matter -->
  
  <g transform="translate(120, 120)">
    <!-- Pedestal -->
    <rect x="-60" y="40" width="120" height="15" rx="4" fill="#3D4451"/>
    <rect x="-40" y="55" width="80" height="10" rx="2" fill="#2C313C"/>
    
    <!-- The Object (The "Core/Nature" - A stylized golden diamond/gemstone) -->
    <path d="M0 -60 L40 -20 L0 20 L-40 -20 Z" fill="#FFB84D"/>
    <path d="M0 -60 L40 -20 L0 -10 Z" fill="#FFD180"/>
    <path d="M0 20 L40 -20 L0 -10 Z" fill="#E69138"/>
    
    <!-- Focus ring/highlight -->
    <circle cx="0" cy="-20" r="15" fill="none" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>