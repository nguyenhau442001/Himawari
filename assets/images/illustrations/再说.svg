<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Calendar / Tomorrow concept object -->
    <rect x="55" y="45" width="130" height="135" rx="14" fill="#242B38" stroke="#333D52" stroke-width="3"/>
    
    <!-- Calendar Header -->
    <path d="M 55 59 A 14 14 0 0 1 69 45 L 171 45 A 14 14 0 0 1 185 59 L 185 75 L 55 75 Z" fill="#E67E22"/>
    
    <!-- Calendar Rings -->
    <rect x="83" y="32" width="10" height="20" rx="5" fill="#A6ACBE"/>
    <rect x="147" y="32" width="10" height="20" rx="5" fill="#A6ACBE"/>
    
    <!-- Date Grid representing postponement / future -->
    <!-- Weekday header dots -->
    <circle cx="80" cy="98" r="4" fill="#4E5D78"/>
    <circle cx="107" cy="98" r="4" fill="#4E5D78"/>
    <circle cx="133" cy="98" r="4" fill="#4E5D78"/>
    <circle cx="160" cy="98" r="4" fill="#4E5D78"/>
    
    <!-- Week 1 -->
    <circle cx="80" cy="122" r="6" fill="#333D52"/>
    <circle cx="107" cy="122" r="6" fill="#333D52"/>
    <circle cx="133" cy="122" r="6" fill="#333D52"/>
    <circle cx="160" cy="122" r="6" fill="#333D52"/>
    
    <!-- Highlighted "Tomorrow" Date Cell with Pulsing/Focus Accent -->
    <rect x="88" y="141" width="90" height="32" rx="8" fill="#2E394F"/>
    
    <!-- Arrow pointing forward/later (再说 - leave for later / talk about it later) -->
    <path d="M 98 157 L 130 157 M 118 147 L 130 157 L 118 167" fill="none" stroke="#E67E22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speech bubble / discussion element overlapping calendar (representing speaking/discussing later) -->
    <g transform="translate(130, 130)">
      <path d="M 5 25 Q 5 10 25 10 L 65 10 Q 85 10 85 25 L 85 45 Q 85 60 65 60 L 45 60 L 30 75 L 35 60 L 25 60 Q 5 60 5 45 Z" fill="#E67E22" stroke="#1A1D24" stroke-width="3"/>
      <!-- Ellipsis inside speech bubble -->
      <circle cx="30" cy="35" r="4" fill="#1A1D24"/>
      <circle cx="45" cy="35" r="4" fill="#1A1D24"/>
      <circle cx="60" cy="35" r="4" fill="#1A1D24"/>
    </g>
  </g>
</svg>