<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Earth/Home Globe Base -->
    <circle cx="0" cy="15" r="55" fill="#242A38"/>
    
    <!-- Continents / Landmasses (Green) -->
    <path d="M-30, -5 C-15, -20 15, -25 35, -5 C50, 10 40, 35 20, 45 C0, 55 -25, 40 -35, 20 C-45, 0 -40, 5 -30, -5 Z" fill="#2ECC71" opacity="0.85"/>
    <path d="M-15, 25 C-5, 20 10, 25 15, 35 C20, 45 5, 55 -10, 50 C-20, 45 -20, 30 -15, 25 Z" fill="#27AE60" opacity="0.85"/>

    <!-- Protective, nurturing hands cupping the earth (representing 'protection' and 'home' / 家园) -->
    <!-- Left Hand -->
    <path d="M-75, 55 C-60, 25 -35, 10 -25, 20 C-20, 25 -22, 32 -28, 38 C-40, 48 -55, 60 -65, 75 C-72, 85 -80, 75 -75, 55 Z" fill="#F1C40F" />
    
    <!-- Right Hand -->
    <path d="M75, 55 C60, 25 35, 10 25, 20 C20, 25 22, 32 28, 38 C40, 48 55, 60 65, 75 C72, 85 80, 75 75, 55 Z" fill="#F39C12" />

    <!-- Thriving Green Sprout on top of the Earth (Green home / 生态家园) -->
    <path d="M0, -40 C0, -60 -15, -75 -30, -70 C-35, -68 -32, -60 -25, -60 C-12, -60 -5, -50 0, -40 Z" fill="#2ECC71"/>
    <path d="M0, -40 C0, -60 15, -75 30, -70 C35, -68 32, -60 25, -60 C12, -60 5, -50 0, -40 Z" fill="#2ECC71"/>
    <path d="M0, -35 L0, -50" stroke="#27AE60" stroke-width="4" stroke-linecap="round"/>

    <!-- Sparkles / Ecology details -->
    <circle cx="-45" cy="-25" r="3" fill="#2ECC71" opacity="0.6"/>
    <circle cx="50" cy="-15" r="2.5" fill="#2ECC71" opacity="0.6"/>
    <circle cx="35" cy="25" r="2" fill="#2ECC71" opacity="0.6"/>
  </g>
</svg>