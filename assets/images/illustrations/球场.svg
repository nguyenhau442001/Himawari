<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Field Surface (Perspective View) -->
  <path d="M40 180 L200 180 L180 90 L60 90 Z" fill="#232D3F" stroke="#2D3B4E" stroke-width="2"/>

  <!-- Field Markings -->
  <!-- Center circle & line -->
  <ellipse cx="120" cy="135" rx="24" ry="12" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.8"/>
  <line x1="120" y1="90" x2="120" y2="180" stroke="#F59E0B" stroke-width="2" opacity="0.8"/>

  <!-- Penalty areas -->
  <path d="M85 90 L155 90 L160 108 L80 108 Z" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.8"/>
  <path d="M70 180 L170 180 L163 162 L77 162 Z" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.8"/>

  <!-- Goal Background / Net Shadow -->
  <path d="M100 68 L140 68 L145 90 L95 90 Z" fill="#2E3948" opacity="0.5"/>

  <!-- Goal Net & Structure -->
  <!-- Left post -->
  <line x1="95" y1="90" x2="100" y2="68" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <!-- Right post -->
  <line x1="145" y1="90" x2="140" y2="68" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="100" y1="68" x2="140" y2="68" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Net pattern -->
  <line x1="105" y1="68" x2="103" y2="90" stroke="#94A3B8" stroke-width="1"/>
  <line x1="115" y1="68" x2="114" y2="90" stroke="#94A3B8" stroke-width="1"/>
  <line x1="125" y1="68" x2="125" y2="90" stroke="#94A3B8" stroke-width="1"/>
  <line x1="135" y1="68" x2="136" y2="90" stroke="#94A3B8" stroke-width="1"/>
  <line x1="102" y1="75" x2="142" y2="75" stroke="#94A3B8" stroke-width="1"/>
  <line x1="101" y1="83" x2="143" y2="83" stroke="#94A3B8" stroke-width="1"/>

  <!-- Foreground / Central Focal Object: Soccer Ball (qiú) -->
  <g transform="translate(120, 145)">
    <!-- Ball shadow -->
    <ellipse cx="0" cy="18" rx="16" ry="6" fill="#0B0D11" opacity="0.6"/>
    
    <!-- Outer white sphere -->
    <circle cx="0" cy="0" r="18" fill="#F8FAFC"/>
    
    <!-- Soccer ball pentagon/hex pattern (Stylized flat vector) -->
    <polygon points="0,-6 -6,-2 -4,5 4,5 6,-2" fill="#1E293B"/>
    <!-- Connecting lines to create classic soccer ball look -->
    <line x1="0" y1="-6" x2="0" y2="-18" stroke="#1E293B" stroke-width="2"/>
    <line x1="-6" y1="-2" x2="-15" y2="-8" stroke="#1E293B" stroke-width="2"/>
    <line x1="6" y1="-2" x2="15" y2="-8" stroke="#1E293B" stroke-width="2"/>
    <line x1="-4" y1="5" x2="-12" y2="13" stroke="#1E293B" stroke-width="2"/>
    <line x1="4" y1="5" x2="12" y2="13" stroke="#1E293B" stroke-width="2"/>

    <!-- Dynamic highlight for modern look -->
    <circle cx="-6" cy="-6" r="3" fill="#FFFFFF" opacity="0.4"/>
  </g>

</svg>