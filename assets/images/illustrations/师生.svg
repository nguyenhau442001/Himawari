<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Teacher (Left) -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="25" r="12" fill="#FFD700"/>
    <path d="M15 40 Q30 55 45 40 L40 90 L20 90 Z" fill="#FFD700"/>
    <path d="M20 90 L20 130 L15 130 L15 90 Z" fill="#FFD700"/>
    <path d="M45 90 L45 130 L40 130 L40 90 Z" fill="#FFD700"/>
    <path d="M40 50 L60 70" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Student (Right) -->
  <g transform="translate(130, 110)">
    <circle cx="20" cy="20" r="10" fill="#4A90E2"/>
    <path d="M10 30 Q20 40 30 30 L25 70 L15 70 Z" fill="#4A90E2"/>
    <path d="M15 70 L15 100 L12 100 L12 70 Z" fill="#4A90E2"/>
    <path d="M28 70 L28 100 L25 100 L25 70 Z" fill="#4A90E2"/>
  </g>
  
  <!-- Interaction: Book/Knowledge sharing -->
  <rect x="95" y="95" width="40" height="30" rx="2" fill="#FFFFFF"/>
  <line x1="100" y1="105" x2="130" y2="105" stroke="#1A1D24" stroke-width="2"/>
  <line x1="100" y1="115" x2="130" y2="115" stroke="#1A1D24" stroke-width="2"/>
  
  <!-- Connection gesture -->
  <path d="M90 85 L105 95" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
</svg>