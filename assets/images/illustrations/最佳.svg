  <path d="M160 140 C160 110, 180 100, 190 120 C200 100, 220 110, 220 140 Z" fill="#f87171"/>
  <path d="M20 160 C20 130, 40 120, 50 140 C60 120, 80 130, 80 160 Z" fill="#ef4444"/>
  
  <!-- Characters -->
  <!-- Person 1 -->
  <g transform="translate(80, 140)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M10 40 L15 80 M30 40 L25 80" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 50 L30 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="16" cy="18" r="2" fill="#1e293b"/>
    <circle cx="24" cy="18" r="2" fill="#1e293b"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(120, 150)">
    <circle cx="20" cy="20" r="12" fill="#fde68a"/>
    <path d="M10 40 L15 80 M30 40 L25 80" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 50 L30 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="16" cy="18" r="2" fill="#1e293b"/>
    <circle cx="24" cy="18" r="2" fill="#1e293b"/>
