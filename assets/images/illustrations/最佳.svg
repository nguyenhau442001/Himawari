  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Mountains -->
  <path d="M0 180 L40 120 L80 160 L120 100 L160 140 L200 90 L240 130 L240 240 L0 240 Z" fill="#334155"/>
  
