  </g>
  
  <!-- Golden Autumn Leaves Falling -->
  <circle cx="50" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="100" cy="30" r="4" fill="#f59e0b"/>
  <circle cx="150" cy="60" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="40" r="4" fill="#f59e0b"/>
  
