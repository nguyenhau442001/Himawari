<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Classroom/Training Hall -->
  <rect x="30" y="50" width="180" height="100" rx="4" fill="#334155" opacity="0.3"/>
  <circle cx="120" cy="100" r="40" fill="#1e293b" opacity="0.5"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="0" cy="-20" r="15" fill="#fcd34d"/>
    <path d="M-15 0 Q0 10 15 0 L10 50 L-10 50 Z" fill="#38bdf8"/>
    <rect x="-12" y="45" width="24" height="60" rx="4" fill="#38bdf8"/>
    <!-- Holding Certificate -->
    <rect x="10" y="10" width="30" height="20" rx="2" fill="#f59e0b" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(160, 100)">
    <circle cx="0" cy="-20" r="15" fill="#fb923c"/>
    <path d="M-15 0 Q0 10 15 0 L10 50 L-10 50 Z" fill="#ec4899"/>
    <rect x="-12" y="45" width="24" height="60" rx="4" fill="#ec4899"/>
    <!-- Holding Certificate -->
    <rect x="-40" y="10" width="30" height="20" rx="2" fill="#f59e0b" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Center Instructor/Table -->
  <rect x="80" y="160" width="80" height="40" rx="8" fill="#475569"/>
  <path d="M90 160 L110 130 L130 160 Z" fill="#10b981"/>
  
  <!-- Decorative Confetti/Celebration -->
  <circle cx="40" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="50" r="2" fill="#38bdf8"/>
  <circle cx="180" cy="180" r="3" fill="#ec4899"/>
  <circle cx="50" cy="190" r="2" fill="#10b981"/>
  
  <!-- Floor -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a"/>
</svg>