<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle wall corner depth hint -->
  <path d="M120 40 L120 200" stroke="#222630" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Wall Socket (插座) - Centered iconic physical object -->
  <g transform="translate(120, 120)">
    <!-- Outer wall plate shadow -->
    <rect x="-42" y="-52" width="84" height="104" rx="12" fill="#111318" />
    
    <!-- Outer wall plate -->
    <rect x="-40" y="-50" width="80" height="100" rx="10" fill="#EAEFF8" stroke="#D0D7E5" stroke-width="2" />
    
    <!-- Inner recessed frame -->
    <rect x="-30" y="-40" width="60" height="80" rx="6" fill="#D8E1F0" />
    
    <!-- Center screw head -->
    <circle cx="0" cy="-30" r="3" fill="#B0BDD2" />
    <line x1="-2" y1="-30" x2="2" y2="-30" stroke="#8A9BB8" stroke-width="1.5" />

    <!-- Socket Module Left (Plug-in interface) -->
    <g transform="translate(-15, 0)">
      <rect x="-10" y="-22" width="20" height="44" rx="4" fill="#2A303C" />
      <!-- Ground pin hole (top round) -->
      <circle cx="0" cy="-12" r="2.5" fill="#111318" />
      <!-- Live/Neutral slots (bottom parallel bars) -->
      <rect x="-3" y="-3" width="6" height="7" rx="1" fill="#111318" />
      <rect x="-3" y="6" width="6" height="7" rx="1" fill="#111318" />
    </g>

    <!-- Socket Module Right (Plug-in interface) -->
    <g transform="translate(15, 0)">
      <rect x="-10" y="-22" width="20" height="44" rx="4" fill="#2A303C" />
      <!-- Ground pin hole (top round) -->
      <circle cx="0" cy="-12" r="2.5" fill="#111318" />
      <!-- Live/Neutral slots (bottom parallel bars) -->
      <rect x="-3" y="-3" width="6" height="7" rx="1" fill="#111318" />
      <rect x="-3" y="6" width="6" height="7" rx="1" fill="#111318" />
    </g>
    
    <!-- Subtle Power/Energy Accent (Gold/Orange focus highlight per instructions) -->
    <circle cx="0" cy="34" r="2.5" fill="#FF9F0A" />
  </g>

  <!-- Ground shadow beneath socket structure -->
  <ellipse cx="120" cy="180" rx="35" ry="4" fill="#0D0F13" opacity="0.6"/>
</svg>