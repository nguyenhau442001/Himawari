        fill="none" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="90" x2="120" y2="105" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floating Creative Elements / Sparkles around the bulb -->
  <!-- Top Right Star -->
  <path d="M 175 75 C 175 75, 182 72, 185 65 C 188 72, 195 75, 195 75 C 195 75, 188 78, 185 85 C 182 78, 175 75, 175 75 Z" fill="#4CC9F0"/>

  <!-- Top Left Sparkle -->
  <path d="M 60 70 C 60 70, 65 68, 67 62 C 69 68, 74 70, 74 70 C 74 70, 69 72, 67 78 C 65 72, 60 70, 60 70 Z" fill="#FFB703"/>

  <!-- Far Right Diamond Sparkle -->
  <path d="M 188 125 C 188 125, 192 123, 194 118 C 196 123, 200 125, 200 125 C 200 125, 196 127, 194 132 C 192 127, 188 125, 188 125 Z" fill="#F72585"/>

  <!-- Far Left Small Sparkle -->
  <path d="M 45 115 C 45 115, 48 114, 49 110 C 50 114, 53 115, 53 115 C 53 115, 50 116, 49 120 C 48 116, 45 115, 45 115 Z" fill="#4CC9F0"/>

  <!-- Orbiting Creative Idea Dots / Nodes -->
  <circle cx="80" cy="145" r="4" fill="#F72585"/>
  <circle cx="160" cy="150" r="5" fill="#4CC9F0"/>
  <circle cx="145" cy="42" r="3" fill="#FFB703"/>
  <circle cx="95" cy="45" r="4.5" fill="#4CC9F0"/>

  <!-- Small geometric accent connection lines representing idea generation -->
  <path d="M 120 35 L 120 42" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 75 90 L 83 93" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 165 90 L 157 93" stroke="#F72585" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>