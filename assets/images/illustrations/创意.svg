  <rect x="112" y="145" width="16" height="5" rx="2" fill="#6C757D"/>
  <rect x="114" y="152" width="12" height="6" rx="2" fill="#4A5568"/>
  <path d="M 116 158 C 116 162, 124 162, 124 158 Z" fill="#2B2D42"/>

  <!-- Filament inside -->
