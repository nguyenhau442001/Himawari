<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect behind the central object -->
  <circle cx="120" cy="115" r="50" fill="#FFB703" opacity="0.12"/>
  <circle cx="120" cy="115" r="35" fill="#FFB703" opacity="0.18"/>

  <!-- Lightbulb Glass Outer Body -->
  <path d="M 95 90 C 95 68, 105 55, 120 55 C 135 55, 145 68, 145 90 C 145 103, 137 113, 131 122 L 129 130 C 128 132, 125 134, 120 134 C 115 134, 112 132, 111 130 L 109 122 C 103 113, 95 103, 95 90 Z" 
        fill="#FFB703" opacity="0.9"/>
  
  <!-- Bulb Inner Highlight (Flat Style) -->
  <path d="M 104 82 C 104 72, 110 65, 120 63 C 110 63, 102 72, 102 85 C 102 88, 103 91, 104 93 C 103 90, 104 85, 104 82 Z" 
        fill="#FFFFFF" opacity="0.4"/>

  <!-- Lightbulb Base / Screw Thread -->
