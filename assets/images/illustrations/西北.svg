<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Compass / Direction Map representing Northwest (西北) -->
  <g transform="translate(120, 120)">
    <!-- Outer map disc / background -->
    <circle cx="0" cy="0" r="76" fill="#222730" stroke="#2C3440" stroke-width="3"/>
    
    <!-- Subtle grid lines indicating geography/location -->
    <path d="M -50 -50 L 50 50 M -50 50 L 50 -50" stroke="#2C3440" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#2C3440" stroke-width="1.5"/>

    <!-- Map representation / stylized landmass -->
    <path d="M -40 -20 Q -20 -40 10 -35 Q 35 -30 45 -10 Q 55 10 30 35 Q 0 45 -25 25 Q -45 10 -40 -20 Z" fill="#2A3342" opacity="0.6"/>

    <!-- Pin pointing to Northwest location -->
    <g transform="translate(-32, -32)">
      <path d="M 0 0 C -8 -12 -12 -18 -12 -26 A 12 12 0 0 1 12 -26 C 12 -18 8 -12 0 0 Z" fill="#FF9F43"/>
      <circle cx="0" cy="-26" r="4.5" fill="#1A1D24"/>
    </g>

    <!-- Directional Crosshairs -->
    <!-- North Marker -->
    <text x="0" y="-56" font-family="sans-serif" font-weight="bold" font-size="12" fill="#7C8B9F" text-anchor="middle">N</text>
    <!-- West Marker -->
    <text x="-58" y="4" font-family="sans-serif" font-weight="bold" font-size="12" fill="#7C8B9F" text-anchor="middle">W</text>
    <!-- South Marker -->
    <text x="0" y="66" font-family="sans-serif" font-weight="bold" font-size="12" fill="#7C8B9F" text-anchor="middle">S</text>
    <!-- East Marker -->
    <text x="58" y="4" font-family="sans-serif" font-weight="bold" font-size="12" fill="#7C8B9F" text-anchor="middle">E</text>

    <!-- Northwest Highlight Indicator (The core semantic focus) -->
    <!-- Northwest sector wedge background -->
    <path d="M 0 0 L -60 0 A 60 60 0 0 1 0 -60 Z" fill="#FF9F43" opacity="0.15"/>
    
    <!-- Prominent Northwest Arrow -->
    <g transform="rotate(-45)">
      <polygon points="0,-68 8,-48 -8,-48" fill="#FF9F43"/>
      <rect x="-2.5" y="-48" width="5" height="32" fill="#FF9F43" rx="1"/>
    </g>

    <!-- Center point -->
    <circle cx="0" cy="0" r="5" fill="#7C8B9F"/>
    <circle cx="0" cy="0" r="2" fill="#1A1D24"/>
  </g>
</svg>