<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight/Inspiration Glow -->
    <radialGradient id="spark-glow" cx="120" cy="95" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="window-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow for Paper/Props -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / CLASSROOM CONTEXT -->
  <!-- Back Wall & Corner -->
  <path d="M0 0 H240 V165 L0 185 Z" fill="#162032"/>
  <path d="M0 165 L240 185 V240 H0 Z" fill="#0b1120"/>
  <!-- Floor line -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#334155" stroke-width="2"/>

  <!-- Window with light beam -->
  <path d="M25 40 H75 V130 H25 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M28 43 H72 V127 H28 Z" fill="url(#window-light)"/>
  <line x1="50" y1="40" x2="50" y2="130" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="85" x2="75" y2="85" stroke="#334155" stroke-width="1.5"/>

  <!-- Bookshelf Background Props -->
  <rect x="185" y="55" width="35" height="110" fill="#1a2536" rx="2"/>
  <line x1="185" y1="90" x2="220" y2="90" stroke="#2d3748" stroke-width="2"/>
  <line x1="185" y1="125" x2="220" y2="125" stroke="#2d3748" stroke-width="2"/>
  <!-- Colorful books -->
  <rect x="190" y="65" width="6" height="25" fill="#f43f5e" rx="1"/>
  <rect x="197" y="68" width="8" height="22" fill="#38bdf8" rx="1"/>
  <rect x="207" y="63" width="5" height="27" fill="#fbbf24" rx="1"/>
  <rect x="190" y="100" width="7" height="25" fill="#10b981" rx="1"/>
  <rect x="208" y="103" width="6" height="22" fill="#a855f7" rx="1"/>

  <!-- Blackboard / Notice board -->
  <rect x="90" y="30" width="80" height="50" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Abstract colorful diagrams on board (No text, pure shapes) -->
  <circle cx="110" cy="50" r="8" fill="#f43f5e" opacity="0.7"/>
  <rect x="125" y="44" width="25" height="12" rx="2" fill="#38bdf8" opacity="0.7"/>
  <polygon points="110,70 115,60 120,70" fill="#fbbf24" opacity="0.7"/>
  <path d="M135 60 Q145 55 155 65" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Teacher's Desk -->
  <path d="M75 160 H165 L175 195 H65 Z" fill="#2d3748" filter="url(#shadow)"/>
  <path d="M70 155 H170 V163 H70 Z" fill="#475569" rx="2"/>

  <!-- Desk Props (Globe, Books, Flask representing inspiration/science/learning) -->
  <!-- Globe -->
  <circle cx="150" cy="140" r="12" fill="#38bdf8" opacity="0.8"/>
  <path d="M143 135 C 148 132, 153 138, 157 135" stroke="#0f172a" stroke-width="1.5" fill="none"/>
  <path d="M142 143 C 146 146, 152 143, 155 147" stroke="#0f172a" stroke-width="1.5" fill="none"/>
  <path d="M150 125 V155" stroke="#94a3b8" stroke-width="2"/>
  <path d="M145 155 H155" stroke="#94a3b8" stroke-width="2"/>

  <!-- Stack of books -->
  <rect x="85" y="145" width="22" height="6" rx="1" fill="#ec4899"/>
  <rect x="83" y="139" width="24" height="6" rx="1" fill="#8b5cf6"/>
  <rect x="86" y="133" width="20" height="6" rx="1" fill="#06b6d4"/>

  <!-- INSPIRATION EFFECT / SPARKLE GRADIENT -->
  <circle cx="120" cy="95" r="60" fill="url(#spark-glow)"/>

  <!-- Floating Inspiration Sparkles / Ideas (Visualizing "Khơi gợi hứng thú") -->
  <g transform="translate(0, -5)">
    <!-- Star 1 (Gold) -->
    <path d="M120 70 L122.5 77 L129 77.5 L123.8 82 L125.5 88 L120 84.5 L114.5 88 L116.2 82 L111 77.5 L117.5 77 Z" fill="#fbbf24"/>
    <!-- Star 2 (Orange/Bright) -->
    <path d="M95 90 L96.5 94 L100 94.5 L97.3 97 L98 100 L95 98.2 L92 100 L92.7 97 L90 94.5 L93.5 94 Z" fill="#fb923c" transform="scale(0.8) translate(30, 0)"/>
    <!-- Light bulb representing bright idea -->
    <path d="M120 95 C 114 95, 110 99, 110 104 C 110 108, 113 111, 115 113 V 117 H 125 V 113 C 127 111, 130 108, 130 104 C 130 99, 126 95, 120 95 Z" fill="#fef08a" filter="url(#shadow)"/>
    <rect x="117" y="117" width="6" height="3" fill="#94a3b8"/>
    <!-- Glowing trails/dots -->
    <circle cx="102" cy="80" r="2.5" fill="#fde047"/>
    <circle cx="138" cy="88" r="3" fill="#fde047"/>
    <circle cx="132" cy="115" r="2" fill="#fde047"/>
  </g>


  <!-- CHARACTERS -->

  <!-- TEACHER (Standing on the left, gesturing towards the student with dynamic pose) -->
  <g id="teacher">
    <!-- Teacher Body/Torso -->
    <path d="M65 130 C 65 115, 75 110, 85 110 C 95 110, 105 115, 105 130 L 100 170 H 70 Z" fill="#4f46e5" filter="url(#shadow)"/>
    <!-- Teacher Collar/Tie -->
    <polygon points="85,110 90,122 80,122" fill="#ffffff"/>
    <polygon points="85,122 88,135 85,142 82,135" fill="#e11d48"/>

    <!-- Teacher Head & Face -->
    <circle cx="85" cy="92" r="14" fill="#ffedd5"/>
    <!-- Hair (Neat dark brown/black) -->
    <path d="M71 92 C 71 80, 80 77, 88 77 C 97 77, 99 84, 99 92 C 96 88, 92 85, 85 85 C 78 85, 73 88, 71 92 Z" fill="#332924"/>
    <!-- Friendly facial expression (Smiling, eyes crinkled with warmth) -->
    <path d="M79 92 Q 82 89 85 92" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M89 92 Q 92 89 95 92" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Gentle smile -->
    <path d="M83 98 Q 85 101 88 98" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Glasses -->
    <rect x="77" y="89" width="7" height="5" rx="1" fill="none" stroke="#b45309" stroke-width="1.2"/>
    <rect x="86" y="89" width="7" height="5" rx="1" fill="none" stroke="#b45309" stroke-width="1.2"/>
    <line x1="84" y1="91" x2="86" y2="91" stroke="#b45309" stroke-width="1.2"/>

    <!-- Teacher Arms (Engaged gesture: pointing up/out toward inspiration) -->
    <!-- Back Arm -->
    <path d="M70 120 L 55 130 L 60 140" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm (Reaching up energetically) -->
    <path d="M100 120 C 110 110, 115 95, 122 90" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/>
    <!-- Teacher Hand -->
    <circle cx="123" cy="88" r="4" fill="#ffedd5"/>
  </g>


  <!-- STUDENT (Sitting on the right, eyes wide with sudden realization/excitement) -->
  <g id="student">
    <!-- Chair back -->
    <rect x="155" y="125" width="18" height="60" rx="4" fill="#334155"/>

    <!-- Student Torso (Leaning forward eagerly) -->
    <path d="M145 135 C 145 125, 155 120, 168 123 C 178 125, 185 135, 185 145 L 175 180 H 145 Z" fill="#0ea5e9" filter="url(#shadow)"/>
    <!-- Collar / Hoodie strings -->
    <path d="M162 123 L 164 135" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M170 125 L 168 135" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Student Head & Face -->
    <circle cx="168" cy="105" r="14" fill="#fde68a"/>
    <!-- Hair (Trendy messy dark blue/black hair) -->
    <path d="M154 105 C 154 93, 162 90, 172 91 C 182 92, 184 100, 183 107 C 180 102, 175 97, 168 97 C 160 97, 156 101, 154 105 Z" fill="#1e1b4b"/>
    <path d="M178 98 L 184 102 L 180 106 Z" fill="#1e1b4b"/>

    <!-- Excited Facial Expression -->
    <!-- Wide happy eyes -->
    <circle cx="163" cy="104" r="2.5" fill="#0f172a"/>
    <circle cx="174" cy="104" r="2.5" fill="#0f172a"/>
    <!-- Eye highlights -->
    <circle cx="164" cy="103" r="1" fill="#ffffff"/>
    <circle cx="175" cy="103" r="1" fill="#ffffff"/>
    <!-- Big excited open smile -->
    <path d="M164 111 C 166 115, 172 115, 174 111 Z" fill="#be123c"/>
    <!-- Blushing cheeks -->
    <circle cx="160" cy="108" r="2" fill="#fb7185" opacity="0.6"/>
    <circle cx="177" cy="108" r="2" fill="#fb7185" opacity="0.6"/>

    <!-- Student Arms (Reacting, hands raised or clutching desk in awe) -->
    <!-- Arm resting on desk with pencil -->
    <path d="M160 145 L 140 160 L 130 155" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Student Hand -->
    <circle cx="129" cy="154" r="3.5" fill="#fde68a"/>
    <!-- Pencil -->
    <line x1="124" y1="152" x2="136" y2="158" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Other arm lifted in excitement -->
    <path d="M178 135 C 185 130, 192 120, 195 110" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round"/>
    <circle cx="196" cy="107" r="3.5" fill="#fde68a"/>
  </g>

  <!-- FOREGROUND DESK DETAILS (Notebook with bright spark drawn on it) -->
  <g id="notebook" transform="translate(115, 162)">
    <!-- Open Book -->
    <path d="M 0 10 C 15 5, 30 5, 45 10 L 45 28 C 30 23, 15 23, 0 28 Z" fill="#ffffff" filter="url(#shadow)"/>
    <!-- Book spine center line -->
    <line x1="22.5" y1="7" x2="22.5" y2="26" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Abstract sketches inside notebook (Showing ideas forming) -->
    <path d="M 8 14 H 17" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 8 18 H 14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tiny star drawn on right page -->
    <path d="M 34 14 L 35 17 L 38 17.5 L 35.5 19 L 36.5 22 L 34 20 L 31.5 22 L 32.5 19 L 30 17.5 L 33 17 Z" fill="#f59e0b" transform="scale(0.5) translate(40, 12)"/>
  </g>

</svg>