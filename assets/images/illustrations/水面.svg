<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Water Surface -->
  <path d="M40 120 C 80 110, 160 110, 200 120 L 200 180 L 40 180 Z" fill="#2C5F7D"/>
  <path d="M40 120 C 80 110, 160 110, 200 120 L 200 125 C 160 115, 80 115, 40 125 Z" fill="#4A90E2"/>
  
  <!-- Ripples -->
  <ellipse cx="120" cy="125" rx="30" ry="8" fill="none" stroke="#7FB3D5" stroke-width="2" opacity="0.6"/>
  <ellipse cx="150" cy="135" rx="20" ry="5" fill="none" stroke="#7FB3D5" stroke-width="2" opacity="0.4"/>
  
  <!-- Floating Leaves -->
  <path d="M80 115 C 85 110, 95 110, 100 115 C 95 120, 85 120, 80 115" fill="#FFB347"/>
  <path d="M140 125 C 145 120, 155 120, 160 125 C 155 130, 145 130, 140 125" fill="#FFD700"/>
  <path d="M110 130 C 115 125, 125 125, 130 130 C 125 135, 115 135, 110 130" fill="#FF8C00"/>
  
  <!-- Reflection lines -->
  <line x1="85" y1="120" x2="85" y2="125" stroke="#4A90E2" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="130" x2="150" y2="135" stroke="#4A90E2" stroke-width="1" opacity="0.5"/>
</svg>