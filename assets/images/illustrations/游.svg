<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background pool water gradient & waves -->
  <defs>
    <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2b46"/>
      <stop offset="100%" stop-color="#163c63"/>
    </linearGradient>
    <linearGradient id="waterSurface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Pool background area -->
  <rect x="20" y="60" width="200" height="140" rx="16" fill="url(#poolGrad)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Swimming pool tile lines / perspective lines -->
  <line x1="50" y1="60" x2="40" y2="200" stroke="#1b426e" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="120" y1="60" x2="120" y2="200" stroke="#1b426e" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="190" y1="60" x2="200" y2="200" stroke="#1b426e" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>

  <!-- Water surface ripples -->
  <path d="M 25 80 Q 45 75, 65 80 T 105 80 T 145 80 T 185 80 T 215 80" fill="none" stroke="url(#waterSurface)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 35 95 Q 55 90, 75 95 T 115 95 T 155 95 T 195 95" fill="none" stroke="url(#waterSurface)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Motion lines for swimming action -->
  <path d="M 45 140 C 60 135, 75 145, 90 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M 50 155 C 65 150, 80 160, 95 155" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Dynamic Swimmer Character (Freestyle stroke motion) -->
  <g transform="translate(10, 10)">
    <!-- Water splash around head/arms -->
    <circle cx="110" cy="115" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="125" cy="105" r="2" fill="#38bdf8" opacity="0.8"/>
    <path d="M 105 118 Q 112 110, 118 116" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Head & Cap (Facing right, sleek profile) -->
    <circle cx="115" cy="120" r="10" fill="#f97316"/> <!-- Swim cap - Accent Orange -->
    <path d="M 123 118 C 126 120, 126 123, 123 125" fill="#fcd34d"/> <!-- Goggles strap/eye area -->

    <!-- Torso (angled dynamically in water) -->
    <path d="M 105 125 Q 130 130, 155 135" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Forward reaching arm (Entering water) -->
    <path d="M 120 128 C 145 132, 165 125, 185 110" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/> <!-- Arm/Hand in gold/skin tone -->

    <!-- Backward recovering arm -->
    <path d="M 110 125 C 95 110, 80 115, 70 125" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>

    <!-- Legs with motion trail -->
    <path d="M 155 135 C 175 145, 190 130, 205 140" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Splash at feet -->
    <path d="M 200 135 Q 208 140, 215 135" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="210" cy="143" r="2" fill="#38bdf8"/>
    <circle cx="216" cy="138" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Surface ripples around body -->
  <ellipse cx="140" cy="135" rx="55" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="110" cy="140" rx="30" ry="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Ambient water bubbles -->
  <circle cx="75" cy="165" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="82" cy="175" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="160" cy="160" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="168" cy="150" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="172" cy="155" r="1.5" fill="#38bdf8" opacity="0.7"/>

  <!-- Top Pool Edge / Deck -->
  <rect x="20" y="52" width="200" height="8" rx="4" fill="#334155"/>
  <rect x="20" y="52" width="200" height="3" fill="#64748b" opacity="0.6"/>
</svg>