<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M40 190 L200 190" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Character (Soldier) -->
  <g transform="translate(80, 120)">
    <!-- Body -->
    <path d="M20 60 L20 30 L40 30 L40 60" fill="#4B5563"/>
    <!-- Head -->
    <circle cx="30" cy="20" r="10" fill="#9CA3AF"/>
    <!-- Helmet -->
    <path d="M20 20 A10 10 0 0 1 40 20" fill="#F59E0B"/>
    <!-- Arm in action -->
    <path d="M40 35 L60 45" stroke="#4B5563" stroke-width="6" stroke-linecap="round"/>
    <!-- Leg -->
    <path d="M25 60 L25 70" stroke="#4B5563" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Target/Object of Exercise -->
  <g transform="translate(150, 150)">
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="#3B82F6"/>
    <rect x="-5" y="-20" width="10" height="10" fill="#3B82F6"/>
  </g>

  <!-- Motion Lines -->
  <path d="M140 130 Q120 120 100 130" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M145 120 Q125 110 105 120" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Tactical Map/Marker -->
  <circle cx="150" cy="140" r="3" fill="#EF4444"/>
  <path d="M150 140 L160 130" stroke="#EF4444" stroke-width="2"/>
</svg>