<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip">
      <path d="M 80,40 Q 120,20 160,40 L 160,110 L 80,110 Z"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Setting -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#273548" rx="8"/>
  <path d="M 20,130 L 220,130" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="130" width="200" height="70" fill="#1e293b"/>

  <!-- Window with starry night & glowing moon/pure light -->
  <path d="M 80,40 Q 120,20 160,40 L 160,110 L 80,110 Z" fill="url(#windowGlow)"/>
  <path d="M 76,38 Q 120,16 164,38" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Stars outside -->
  <circle cx="95" cy="55" r="1.5" fill="#e2e8f0"/>
  <circle cx="145" cy="50" r="1" fill="#e2e8f0"/>
  <circle cx="130" cy="75" r="1.5" fill="#38bdf8"/>
  <circle cx="100" cy="90" r="1" fill="#e2e8f0"/>
  <!-- Window Sill & Potted Plant (Environment context) -->
  <rect x="70" y="110" width="100" height="6" fill="#475569" rx="2"/>
  <!-- Cute little pot on sill -->
  <path d="M 140,110 L 144,98 L 156,98 L 160,110 Z" fill="#f97316"/>
  <path d="M 150,98 C 147,90 145,85 142,80 C 148,82 153,86 155,98 Z" fill="#10b981"/>
  <path d="M 150,98 C 153,90 156,86 161,82 C 157,86 153,91 150,98 Z" fill="#34d399"/>

  <!-- Floating Pure Heart/Light Motif over child -->
  <circle cx="120" cy="70" r="35" fill="url(#heartGlow)"/>
  <path d="M 120,62 C 120,55 110,48 102,55 C 95,62 102,72 120,85 C 138,72 145,62 138,55 C 130,48 120,55 120,62 Z" fill="#f43f5e" opacity="0.9"/>
  <!-- Sparkles around the heart -->
  <path d="M 92,45 L 95,50 L 100,50 L 96,53 L 98,58 L 92,55 L 86,58 L 88,53 L 84,50 L 89,50 Z" fill="#fbbf24" transform="scale(0.5) translate(100, 20)"/>
  <path d="M 152,65 L 154,68 L 158,68 L 155,70 L 156,74 L 152,71 L 148,74 L 149,70 L 146,68 L 150,68 Z" fill="#fbbf24" transform="scale(0.4) translate(210, 60)"/>

  <!-- Character: Child (Innocent, peaceful expression, looking up) -->
  <!-- Body / Hoodie -->
  <path d="M 95,175 C 95,155 105,145 120,145 C 135,145 145,155 145,175 L 160,210 C 160,213 157,215 154,215 L 86,215 C 83,215 80,213 80,210 Z" fill="#38bdf8"/>
  <!-- Hoodie pocket & details -->
  <path d="M 105,190 L 135,190 L 132,210 L 108,210 Z" fill="#0ea5e9"/>
  <circle cx="112" cy="170" r="3" fill="#cbd5e1"/>
  <circle cx="128" cy="170" r="3" fill="#cbd5e1"/>
  <path d="M 112,170 Q 120,178 128,170" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- Neck -->
  <rect x="112" y="132" width="16" height="18" fill="#ffedd5"/>

  <!-- Head -->
  <circle cx="120" cy="115" r="22" fill="#ffedd5"/>
  
  <!-- Hair (Soft, cute child hairstyle) -->
  <path d="M 98,112 C 98,98 108,94 120,94 C 132,94 142,98 142,112 C 142,118 140,122 138,122 C 136,122 136,118 138,114 C 138,102 130,98 120,98 C 110,98 102,102 102,114 C 102,118 100,122 98,122 C 96,122 98,118 98,112 Z" fill="#334155"/>
  <circle cx="100" cy="112" r="3" fill="#334155"/>
  <circle cx="140" cy="112" r="3" fill="#334155"/>

  <!-- Face: Eyes (closed in serene happiness / gentle wonder) -->
  <path d="M 110,114 Q 114,119 118,114" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 122,114 Q 126,119 130,114" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="108" cy="119" r="3.5" fill="#fda4af" opacity="0.6"/>
  <circle cx="132" cy="119" r="3.5" fill="#fda4af" opacity="0.6"/>
  <!-- Gentle Smile -->
  <path d="M 117,123 Q 120,126 123,123" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Arms / Hands expressing wonder/pure joy -->
  <path d="M 95,160 C 85,160 80,145 75,140" stroke="#ffedd5" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="73" cy="138" r="4" fill="#ffedd5"/>
  
  <path d="M 145,160 C 155,160 160,145 165,140" stroke="#ffedd5" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="167" cy="138" r="4" fill="#ffedd5"/>

  <!-- Foreground Floor / Prop: Toy block stack (childlike innocent setting) -->
  <rect x="35" y="195" width="22" height="20" fill="#f43f5e" rx="3"/>
  <rect x="42" y="175" width="20" height="20" fill="#fbbf24" rx="3"/>
  <path d="M 52,155 L 45,175 L 59,175 Z" fill="#10b981"/>

  <rect x="180" y="190" width="25" height="25" fill="#38bdf8" rx="4"/>
  <circle cx="192.5" cy="202.5" r="7" fill="#ffffff" opacity="0.3"/>

  <!-- Extra warm ambient lighting effects -->
  <circle cx="120" cy="120" r="90" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.05"/>
</svg>