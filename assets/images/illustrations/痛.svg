<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Leg outline / context based on "我的腿很痛" -->
    <path d="M95 50 L125 50 L135 155 L100 160 Z" fill="#2E3440" opacity="0.6"/>
    
    <!-- Lower leg & knee structure -->
    <path d="M100 85 C100 70, 140 70, 140 95 C140 120, 130 140, 125 170 L95 170 C95 140, 100 110, 100 85 Z" fill="#3B4252"/>
    
    <!-- Knee joint circle -->
    <circle cx="120" cy="95" r="18" fill="#434C5E"/>

    <!-- Pain focal point: Glowing stylized pain indicator (pulsing spikes/starburst) at the knee -->
    <g transform="translate(120, 95)">
      <!-- Outer glow aura -->
      <circle cx="0" cy="0" r="26" fill="#FF5555" opacity="0.25"/>
      <circle cx="0" cy="0" r="18" fill="#FF5555" opacity="0.4"/>
      
      <!-- Sharp pain symbol / radiating discomfort spikes -->
      <path d="M0 -18 L4 -5 L17 -10 L7 0 L18 6 L5 7 L0 20 L-5 7 L-18 6 L-7 0 L-17 -10 L-4 -5 Z" fill="#FF5555"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Additional radiating pain pulse rings -->
    <circle cx="120" cy="95" r="34" stroke="#FF5555" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4 4"/>
    <circle cx="120" cy="95" r="42" stroke="#FF5555" stroke-width="1.5" fill="none" opacity="0.3"/>
  </g>
</svg>