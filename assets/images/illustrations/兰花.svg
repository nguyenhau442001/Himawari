<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle balcony railing line and background mood -->
  <path d="M40 180H200" stroke="#2A303C" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="180" x2="60" y2="200" stroke="#2A303C" stroke-width="2"/>
  <line x1="100" y1="180" x2="100" y2="200" stroke="#2A303C" stroke-width="2"/>
  <line x1="140" y1="180" x2="140" y2="200" stroke="#2A303C" stroke-width="2"/>
  <line x1="180" y1="180" x2="180" y2="200" stroke="#2A303C" stroke-width="2"/>

  <!-- Soft ambient fragrance wisps -->
  <path d="M85 85 C75 75 75 60 85 45" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.15"/>
  <path d="M155 85 C165 75 165 60 155 45" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.15"/>
  <path d="M120 75 C120 60 115 45 125 30" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.2"/>

  <!-- Ceramic Pot -->
  <path d="M95 140H145L155 175H85L95 140Z" fill="#3B4252"/>
  <path d="M90 135H150V140H90V135Z" fill="#4C566A" rx="2"/>
  <ellipse cx="120" cy="137.5" rx="30" ry="3" fill="#2E3440"/>

  <!-- Orchid Leaves (Graceful, sweeping blades) -->
  <path d="M105 137C90 120 75 105 55 90C50 86 45 92 50 98C70 115 85 130 98 142Z" fill="#88C0D0" opacity="0.85"/>
  <path d="M110 137C100 110 95 90 80 70C76 65 70 72 75 78C90 98 96 115 105 140Z" fill="#A3BE8C" opacity="0.9"/>
  <path d="M130 137C145 115 160 100 185 85C190 82 195 88 190 93C168 108 152 122 135 140Z" fill="#88C0D0" opacity="0.8"/>
  <path d="M125 137C138 110 145 90 162 70C166 65 172 72 168 78C152 96 144 115 128 140Z" fill="#A3BE8C" opacity="0.95"/>

  <!-- Flower Stems -->
  <path d="M120 137C118 115 122 95 112 75" stroke="#A3BE8C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M120 120C125 100 132 85 142 65" stroke="#A3BE8C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Orchids (Phalaenopsis / Cymbidium hybrid style - Elegant White/Gold accented petals) -->
  
  <!-- Flower 1 (Top Left) -->
  <g transform="translate(105, 70) scale(0.7)">
    <!-- Back Petals -->
    <path d="M0 0C-15 -15 -25 -5 -15 10C-5 25 10 15 0 0Z" fill="#E5E9F0" opacity="0.9"/>
    <path d="M0 0C15 -15 25 -5 15 10C5 25 -10 15 0 0Z" fill="#E5E9F0" opacity="0.9"/>
    <!-- Side Petals -->
    <path d="M0 0C-20 0 -25 -20 -10 -25C5 -30 15 -15 0 0Z" fill="#ECEFF4"/>
    <path d="M0 0C20 0 25 -20 10 -25C-5 -30 -15 -15 0 0Z" fill="#ECEFF4"/>
    <!-- Labellum (Lip) with Golden Accent -->
    <path d="M0 0C-5 15 0 25 0 30C0 30 8 22 5 12C3 5 2 2 0 0Z" fill="#EBCB8B"/>
    <circle cx="0" cy="15" r="3" fill="#D08770"/>
  </g>

  <!-- Flower 2 (Top Right - Main Focal) -->
  <g transform="translate(142, 60) scale(0.9)">
    <!-- Back Petals -->
    <path d="M0 0C-15 -15 -25 -5 -15 10C-5 25 10 15 0 0Z" fill="#E5E9F0" opacity="0.9"/>
    <path d="M0 0C15 -15 25 -5 15 10C5 25 -10 15 0 0Z" fill="#E5E9F0" opacity="0.9"/>
    <!-- Side Petals -->
    <path d="M0 0C-22 -5 -30 -22 -12 -25C5 -28 18 -12 0 0Z" fill="#ECEFF4"/>
    <path d="M0 0C22 -5 30 -22 12 -25C-5 -28 -18 -12 0 0Z" fill="#ECEFF4"/>
    <!-- Labellum (Lip) with Golden Accent -->
    <path d="M0 0C-6 18 0 28 0 35C0 35 10 25 6 14C4 6 2 2 0 0Z" fill="#EBCB8B"/>
    <circle cx="0" cy="16" r="3.5" fill="#D08770"/>
  </g>

  <!-- Flower 3 (Lower Center Bud/Bloom) -->
  <g transform="translate(122, 95) scale(0.55)">
    <path d="M0 0C-15 -15 -25 -5 -15 10C-5 25 10 15 0 0Z" fill="#E5E9F0" opacity="0.9"/>
    <path d="M0 0C15 -15 25 -5 15 10C5 25 -10 15 0 0Z" fill="#E5E9F0" opacity="0.9"/>
    <path d="M0 0C-20 0 -25 -20 -10 -25C5 -30 15 -15 0 0Z" fill="#ECEFF4"/>
    <path d="M0 0C20 0 25 -20 10 -25C-5 -30 -15 -15 0 0Z" fill="#ECEFF4"/>
    <path d="M0 0C-5 15 0 25 0 30C0 30 8 22 5 12C3 5 2 2 0 0Z" fill="#EBCB8B"/>
    <circle cx="0" cy="15" r="3" fill="#D08770"/>
  </g>

</svg>