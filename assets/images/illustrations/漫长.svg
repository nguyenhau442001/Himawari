<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant mountain path -->
  <path d="M0 160 Q 60 140, 120 160 T 240 140 L 240 240 L 0 240 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M20 200 L 80 180 L 150 200 L 220 185" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6 6"/>
  
  <!-- The Traveler -->
  <g transform="translate(100, 150)">
    <!-- Backpack -->
    <rect x="-10" y="10" width="20" height="25" rx="4" fill="#fb923c"/>
    <!-- Body -->
    <path d="M-5 35 L-5 60 M5 35 L5 60" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="25" r="10" fill="#f8fafc"/>
    <!-- Walking stick -->
    <line x1="15" y1="40" x2="25" y2="70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Environment: Harsh elements -->
  <circle cx="200" cy="50" r="25" fill="#fbbf24" opacity="0.3"/>
  <path d="M180 80 L190 70 M210 90 L220 80" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Distant peaks -->
  <path d="M0 160 L40 100 L80 160 Z" fill="#334155"/>
  <path d="M60 160 L120 80 L180 160 Z" fill="#475569"/>
  <path d="M160 160 L210 110 L240 160 Z" fill="#334155"/>

  <!-- Stars/Atmosphere -->
  <circle cx="30" cy="40" r="1" fill="#e2e8f0"/>
  <circle cx="50" cy="20" r="1.5" fill="#e2e8f0"/>
  <circle cx="220" cy="30" r="1" fill="#e2e8f0"/>
  
  <!-- Footprints -->
  <ellipse cx="110" cy="210" rx="4" ry="2" fill="#334155"/>
  <ellipse cx="130" cy="205" rx="4" ry="2" fill="#334155"/>
  <ellipse cx="150" cy="200" rx="4" ry="2" fill="#334155"/>
</svg>