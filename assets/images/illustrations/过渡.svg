<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Transition Bridge/Arch Object -->
  <!-- Background atmosphere / subtle path -->
  <path d="M 40 160 C 90 160, 150 160, 200 160" stroke="#2A2F3D" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- The Physical Bridge Structure representing 过渡 (Noun - Physical Object/Structure) -->
  <!-- Left Pillar (Hot / Summer representing the context) -->
  <rect x="50" y="110" width="20" height="50" rx="4" fill="#E67E22" opacity="0.8"/>
  <circle cx="60" cy="95" r="10" fill="#F39C12"/>
  
  <!-- Right Pillar (Cool / Autumn representing the context) -->
  <rect x="170" y="110" width="20" height="50" rx="4" fill="#3498DB" opacity="0.8"/>
  <circle cx="180" cy="95" r="10" fill="#2980B9"/>

  <!-- Main Smooth Arch / Transition Span -->
  <path d="M 60 110 C 90 60, 150 60, 180 110" fill="none" stroke="#F1C40F" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Crossing Object (Physical embodiment of transitioning from one state to another) -->
  <g transform="translate(120, 95)">
    <!-- Leaf / Season shift symbol crossing the bridge -->
    <path d="M 0 -15 C 10 -5, 12 10, 0 20 C -12 10, -10 -5, 0 -15 Z" fill="#2ECC71"/>
    <path d="M 0 -10 L 0 15" stroke="#1E8449" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ground Line -->
  <path d="M 30 165 L 210 165" stroke="#3A4150" stroke-width="3" stroke-linecap="round"/>
</svg>