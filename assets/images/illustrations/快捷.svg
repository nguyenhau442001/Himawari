<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background grid lines indicating speed and trajectory -->
    <line x1="30" y1="120" x2="210" y2="120" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="40" y1="150" x2="200" y2="150" stroke="#2A2F3B" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Motion trails representing high speed / quickness (快) -->
    <path d="M40 100 L120 100" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <path d="M60 85 L160 85" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M30 115 L180 115" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Sleek High-Speed Train / Modern Bullet Train representing 快捷 (fast & direct transit) -->
    <!-- Train Body (Aerodynamic nose cone) -->
    <path d="M 60 135 L 180 135 C 195 135 205 125 210 115 L 215 110 C 215 110 190 110 150 110 L 60 110 Z" fill="#3B82F6"/>
    <path d="M 50 110 L 150 110 C 190 110 215 110 215 110 C 210 98 195 95 180 95 L 50 95 C 40 95 35 100 35 102 C 35 106 40 110 50 110 Z" fill="#60A5FA"/>
    
    <!-- Train Windshield / Cockpit Window -->
    <path d="M 185 100 C 195 100 203 103 207 107 C 203 107 185 107 185 107 Z" fill="#1A1D24"/>

    <!-- Train Windows -->
    <rect x="70" y="101" width="12" height="6" rx="2" fill="#1A1D24"/>
    <rect x="90" y="101" width="12" height="6" rx="2" fill="#1A1D24"/>
    <rect x="110" y="101" width="12" height="6" rx="2" fill="#1A1D24"/>
    <rect x="130" y="101" width="12" height="6" rx="2" fill="#1A1D24"/>
    <rect x="150" y="101" width="12" height="6" rx="2" fill="#1A1D24"/>

    <!-- Underbody details -->
    <rect x="65" y="135" width="130" height="4" rx="2" fill="#2563EB"/>
    
    <!-- Wheels / Chassis connection -->
    <circle cx="85" cy="142" r="6" fill="#94A3B8"/>
    <circle cx="85" cy="142" r="3" fill="#1A1D24"/>
    <circle cx="165" cy="142" r="6" fill="#94A3B8"/>
    <circle cx="165" cy="142" r="3" fill="#1A1D24"/>

    <!-- Scale exaggeration / Contrast visual element: Simplified minimalist route nodes representing convenience & directness (捷) -->
    <!-- Direct shortcut arc representing "convenient connection" -->
    <path d="M 65 80 Q 125 40 185 80" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 3"/>
    
    <!-- Origin Node -->
    <circle cx="65" cy="80" r="5" fill="#10B981"/>
    <circle cx="65" cy="80" r="9" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>

    <!-- Destination Node (Highlighted with golden accent for focus) -->
    <circle cx="185" cy="80" r="7" fill="#F59E0B"/>
    <circle cx="185" cy="80" r="12" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.6"/>

    <!-- Speed / Efficiency indicator lines near destination -->
    <path d="M 195 72 L 205 68" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 198 80 L 210 80" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>