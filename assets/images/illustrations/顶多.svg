<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "顶多" (at most, maximum limit) -->
  <!-- Context reference: walking time max 20 minutes / upper limit boundary -->
  <g transform="translate(0, 0)">
    <!-- Background subtle grid or horizon representing the limit line -->
    <line x1="40" y1="180" x2="200" y2="180" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Upper limit marker/roof structure symbolizing "顶" (top/maximum) -->
    <path d="M 60 80 L 120 50 L 180 80" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Vertical limit boundary pillars -->
    <line x1="60" y1="80" x2="60" y2="180" stroke="#3A4255" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="180" y1="80" x2="180" y2="180" stroke="#3A4255" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Central iconic physical object representing the absolute ceiling/maximum capacity -->
    <!-- A modern stop-watch / time limit indicator representing "at most 20 minutes" -->
    <circle cx="120" cy="125" r="42" fill="#222733" stroke="#F59E0B" stroke-width="4"/>
    
    <!-- Clock face details -->
    <circle cx="120" cy="125" r="3" fill="#F59E0B"/>
    <path d="M 120 100 L 120 125 L 140 125" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top winder / crown of the limit marker -->
    <rect x="113" y="77" width="14" height="6" rx="2" fill="#F59E0B"/>

    <!-- Indicator arrow pointing to the absolute limit -->
    <path d="M 120 40 L 112 52 L 128 52 Z" fill="#F59E0B"/>
    <line x1="120" y1="30" x2="120" y2="45" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>