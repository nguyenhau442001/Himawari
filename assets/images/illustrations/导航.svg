<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- UI Glow Gradient -->
    <linearGradient id="uiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Path Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / CONTEXT: Urban Street Scene Background -->
  <g id="environment" opacity="0.4">
    <!-- Distant City Skyline Silhouette -->
    <path d="M15 160 L15 110 L30 110 L30 95 L45 95 L45 160 Z" fill="#334155"/>
    <path d="M50 160 L50 80 L70 80 L70 160 Z" fill="#475569"/>
    <path d="M75 160 L75 100 L95 100 L95 160 Z" fill="#334155"/>
    <path d="M150 160 L150 70 L175 70 L175 160 Z" fill="#475569"/>
    <path d="M180 160 L180 90 L200 90 L200 160 Z" fill="#334155"/>
    <path d="M205 160 L205 105 L225 105 L225 160 Z" fill="#334155"/>
    
    <!-- Street details / Lamppost -->
    <rect x="210" y="80" width="3" height="80" fill="#64748b"/>
    <path d="M205 80 L213 80 L216 85 L202 85 Z" fill="#64748b"/>
    <circle cx="209" cy="87" r="4" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Sidewalk & Road -->
    <rect x="0" y="160" width="240" height="80" fill="#0f172a"/>
    <path d="M0 160 L240 160" stroke="#334155" stroke-width="2"/>
    <path d="M0 175 L240 175" stroke="#334155" stroke-dasharray="8 8" stroke-width="2"/>
  </g>

  <!-- BACK CHARACTER: Friend / Companion pointing the way -->
  <g id="companion" transform="translate(145, 100)">
    <!-- Body -->
    <path d="M15 65 L35 65 L40 120 L10 120 Z" fill="#475569"/>
    <!-- Head -->
    <circle cx="25" cy="45" r="12" fill="#cbd5e1"/>
    <!-- Hair -->
    <path d="M13 42 C15 33, 35 33, 37 42 C30 38, 20 38, 13 42 Z" fill="#1e293b"/>
    <!-- Arm pointing -->
    <path d="M30 55 L55 45" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER: Traveler holding phone in foreground -->
  <g id="main-character" filter="url(#shadow)" transform="translate(45, 80)">
    <!-- Torso (Jacket) -->
    <path d="M40 50 Q40 40 55 40 Q70 40 70 50 L75 110 Q75 120 60 120 L45 120 Q35 120 35 110 Z" fill="#38bdf8"/>
    <path d="M55 40 L55 120" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Head -->
    <circle cx="55" cy="22" r="14" fill="#fbcfe8"/>
    <!-- Hair (Stylish bob) -->
    <path d="M41 20 C40 10, 70 10, 69 20 C70 12, 40 12, 41 20 Z" fill="#334155"/>
    <path d="M41 18 L39 30 L45 27 Z" fill="#334155"/>

    <!-- Arm holding phone -->
    <path d="M68 55 Q80 65 75 80" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="75" cy="82" r="5" fill="#fbcfe8"/>

    <!-- SMARTPHONE (The Centerpiece showing accurate navigation) -->
    <g transform="translate(62, 70) rotate(-15)">
      <!-- Phone Body -->
      <rect x="0" y="0" width="36" height="64" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <!-- Screen -->
      <rect x="3" y="4" width="30" height="56" rx="4" fill="url(#phoneScreen)"/>
      
      <!-- NAVIGATION UI GRAPHICS (Abstracted clean vectors matching "导航很准确") -->
      <!-- Map Route Curve (Glowing accurate path) -->
      <path d="M9 48 Q15 35 27 15" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M9 48 Q15 35 27 15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Destination Pin (Accurate Target Indicator - Gold/Amber) -->
      <g transform="translate(27, 15)">
        <circle cx="0" cy="0" r="6" fill="#fbbf24" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
      </g>

      <!-- Start Node -->
      <circle cx="9" cy="48" r="3" fill="#10b981"/>

      <!-- Accuracy Checkmark Badge / UI Indicator -->
      <rect x="7" y="7" width="10" height="5" rx="2.5" fill="#10b981"/>
      <path d="M9 9.5 L11 11 L15 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Other Arm (Relaxed) -->
    <path d="M42 55 Q35 75 40 90" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND ACCENTS & CONTEXT PROPS -->
  <!-- Directional glowing accurate holographic overlay extending from phone into real world -->
  <g opacity="0.7">
    <path d="M130 135 L160 115 L180 140" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow)"/>
    <!-- Floating Direction Arrow 3D cue -->
    <polygon points="175,130 188,142 170,147" fill="#10b981" filter="url(#shadow)"/>
    <circle cx="130" cy="135" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="160" cy="115" r="4" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- Atmosphere Sparkles / GPS signal pulses -->
  <g fill="#38bdf8">
    <circle cx="110" cy="60" r="2" opacity="0.8" filter="url(#glow)"/>
    <circle cx="125" cy="45" r="1.5" opacity="0.6"/>
    <circle cx="95" cy="50" r="2.5" opacity="0.9" filter="url(#glow)"/>
    <!-- Plus a warm accurate GPS lock star -->
    <path d="M120 70 L122 75 L127 77 L122 79 L120 84 L118 79 L113 77 L118 75 Z" fill="#fbbf24" opacity="0.9" filter="url(#glow)" transform="scale(0.6) translate(80, 20)"/>
  </g>

  <!-- Vignette / Frame Border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>