<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="hologram-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT: Modern High-tech Workspace -->
  <!-- Ambient background lines / grid representing advanced tech -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="0" y1="180" x2="240" y2="180"/>
    <line x1="0" y1="200" x2="240" y2="200"/>
    <line x1="40" y1="180" x2="20" y2="240"/>
    <line x1="100" y1="180" x2="80" y2="240"/>
    <line x1="140" y1="180" x2="160" y2="240"/>
    <line x1="200" y1="180" x2="220" y2="240"/>
  </g>

  <!-- Large panoramic window showing futuristic cityscape with evolving tech architecture -->
  <path d="M 30,30 L 210,30 L 210,140 L 30,140 Z" fill="url(#window-grad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Window grid -->
  <path d="M 90,30 L 90,140 M 150,30 L 150,140 M 30,85 L 210,85" stroke="#334155" stroke-width="0.75" stroke-opacity="0.6"/>

  <!-- City Skyline through window (representing rapid development) -->
  <path d="M 35,140 L 35,95 L 45,90 L 45,140 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M 50,140 L 50,70 L 65,65 L 65,140 Z" fill="#334155" opacity="0.6"/>
  <!-- Flying tech drone / aerial vehicle -->
  <ellipse cx="75" cy="75" rx="4" ry="1" fill="#38bdf8" filter="url(#soft-glow)"/>
  <path d="M 70,140 L 70,110 L 85,105 L 85,140 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M 95,140 L 95,50 L 115,45 L 115,140 Z" fill="#334155" opacity="0.7"/>
  <!-- Futuristic spire with glowing beacon -->
  <path d="M 130,140 L 130,40 L 133,35 L 136,40 L 136,140 Z" fill="#1e293b"/>
  <circle cx="133" cy="34" r="1.5" fill="#ef4444" filter="url(#glow)"/>
  
  <path d="M 155,140 L 155,80 L 175,75 L 175,140 Z" fill="#334155" opacity="0.5"/>
  <path d="M 185,140 L 185,60 L 200,55 L 200,140 Z" fill="#1e293b" opacity="0.9"/>
  
  <!-- Glowing data stream in the sky (representing rapid science progress) -->
  <path d="M 40,50 Q 80,30 120,60 T 200,40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M 40,65 Q 90,45 130,75 T 205,55" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M 10,185 L 230,185 L 240,210 L 0,210 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="0" y="210" width="240" height="30" fill="#090d16"/>

  <!-- WORKSPACE PROPS -->
  <!-- Smart Desk Lamp -->
  <path d="M 200,185 L 195,130 L 190,130" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 185,125 L 195,135 L 205,125 Z" fill="#38bdf8" filter="url(#soft-glow)"/>
  <ellipse cx="195" cy="185" rx="8" ry="3" fill="#475569"/>

  <!-- Futuristic Holographic Projector Device on Desk -->
  <rect x="100" y="180" width="40" height="8" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
  <ellipse cx="120" cy="180" rx="14" ry="3" fill="#38bdf8" filter="url(#glow)"/>

  <!-- CENTRAL SCIENTIFIC HOLOGRAPHIC DISPLAY (R&D / Science Innovation) -->
  <g transform="translate(120, 145)">
    <!-- Hologram cone light -->
    <path d="M 0,35 L -35,-45 L 35,-45 Z" fill="url(#hologram-grad)"/>
    
    <!-- Floating Holographic DNA / Tech Structure -->
    <g filter="url(#glow)">
      <!-- DNA Helix nodes -->
      <path d="M -20,-20 Q 0,-30 20,-10 T -20,0 T 20,10" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 20,-20 Q 0,-10 -20,0 T 20,10 T -20,20" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
      
      <circle cx="-10" cy="-25" r="2" fill="#38bdf8"/>
      <circle cx="10" cy="-15" r="2" fill="#10b981"/>
      <circle cx="0" cy="-5" r="2" fill="#fbbf24"/>
      <circle cx="-10" cy="5" r="2" fill="#38bdf8"/>
      <circle cx="10" cy="15" r="2" fill="#ec4899"/>
    </g>

    <!-- Floating data rings -->
    <ellipse cx="0" cy="-25" rx="22" ry="6" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="30" ry="8" fill="none" stroke="#10b981" stroke-width="0.75" stroke-dasharray="6,3" opacity="0.6"/>
  </g>

  <!-- Secondary Screen / Tablet -->
  <g transform="translate(45, 160) rotate(-10)">
    <rect x="0" y="0" width="32" height="22" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="3" y="3" width="26" height="13" fill="#0f172a"/>
    <!-- Animated UI bars -->
    <rect x="5" y="5" width="10" height="2" rx="1" fill="#38bdf8"/>
    <rect x="5" y="9" width="20" height="1.5" rx="0.5" fill="#10b981"/>
    <rect x="5" y="12" width="15" height="1.5" rx="0.5" fill="#fbbf24"/>
    <path d="M 5,19 L 12,15 L 18,17 L 27,13" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  </g>

  <!-- MAIN CHARACTER: Young Researcher / Engineer -->
  <g transform="translate(100, 95)">
    <!-- Chair back -->
    <path d="M -30,20 L -25,-35 L -15,-35 L -20,20 Z" fill="#334155" opacity="0.8"/>
    
    <!-- Body / Torso (leaning forward engaged with rapid tech) -->
    <path d="M -15,20 C -15,5 -5,0 15,10 L 25,50 L -15,55 Z" fill="#0284c7"/>
    
    <!-- Lab coat / Jacket -->
    <path d="M -18,15 C -15,5 -5,2 10,10 L 22,55 L -10,55 Z" fill="#f8fafc"/>
    <path d="M 0,12 L 8,40 L 15,55" fill="none" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Arms interacting with hologram -->
    <!-- Left arm -->
    <path d="M -10,18 C -25,25 -30,45 -20,50" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-20" cy="50" r="4" fill="#fcd34d"/> <!-- Hand -->

    <!-- Right arm reaching towards hologram -->
    <path d="M 12,18 C 30,25 45,35 55,25" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="56" cy="23" r="4" fill="#fcd34d"/> <!-- Hand pointing / interacting -->

    <!-- Head and Hair -->
    <!-- Neck -->
    <rect x="-2" y="-3" width="6" height="8" fill="#fcd34d"/>
    
    <!-- Head base -->
    <circle cx="2" cy="-14" r="14" fill="#fcd34d"/>

    <!-- Stylish Modern Hair (Dark Navy/Slate) -->
    <path d="M -12,-18 C -14,-28 0,-30 12,-24 C 18,-20 16,-12 16,-12 C 16,-12 12,-22 2,-21 C -8,-20 -12,-18 -12,-18 Z" fill="#1e293b"/>
    <path d="M -13,-18 C -12,-23 -2,-25 6,-23 C 10,-22 14,-17 14,-17 C 14,-17 8,-20 0,-19 C -8,-18 -13,-18 -13,-18 Z" fill="#334155"/>

    <!-- Face details -->
    <!-- Glasses (Smart tech glasses with glowing rim) -->
    <rect x="-3" y="-17" width="9" height="5" rx="1" fill="none" stroke="#38bdf8" stroke-width="1.2" filter="url(#soft-glow)"/>
    <path d="M 6,-15 L 9,-14" fill="none" stroke="#38bdf8" stroke-width="1"/> <!-- temple -->

    <!-- Expression: Focused, amazed, smiling slightly at rapid progress -->
    <path d="M 5,-9 Q 8,-7 10,-9" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linecap="round"/> <!-- Smile -->
    <circle cx="6" cy="-15" r="1" fill="#0f172a"/> <!-- Eye behind glasses -->
  </g>

  <!-- Floating accent tech particles / energy sparks representing "日新月异" (rapid evolution) -->
  <g filter="url(#glow)">
    <circle cx="160" cy="80" r="2.5" fill="#38bdf8"/>
    <circle cx="175" cy="110" r="1.5" fill="#10b981"/>
    <circle cx="85" cy="120" r="2" fill="#fbbf24"/>
    <circle cx="145" cy="50" r="1.5" fill="#ec4899"/>
    <circle cx="45" cy="110" r="2" fill="#38bdf8"/>
    
    <!-- Plus icons / tech sparks -->
    <path d="M 190,70 L 190,76 M 187,73 L 193,73" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 70,50 L 70,54 M 68,52 L 72,52" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 120,30 L 120,34 M 118,32 L 122,32" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Foreground ambient lighting / subtle vignette for depth -->
  <path d="M 0,0 L 240,0 L 240,240 L 0,240 Z" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.15"/>
</svg>