<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Newspaper Highlight Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lamp Glow -->
  <circle cx="160" cy="100" r="90" fill="url(#lampGlow)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Bookshelf / Wall details -->
  <path d="M20 40 L90 40 L90 43 L20 43 Z" fill="#334155" opacity="0.6" />
  <rect x="30" y="20" width="12" height="20" rx="2" fill="#38bdf8" opacity="0.4" />
  <rect x="45" y="16" width="10" height="24" rx="2" fill="#ec4899" opacity="0.4" />
  <rect x="58" y="22" width="16" height="18" rx="2" fill="#10b981" opacity="0.4" />

  <!-- Window Frame showing night city / subtle lights -->
  <g opacity="0.3">
    <rect x="175" y="30" width="45" height="65" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <line x1="197" y1="30" x2="197" y2="95" stroke="#475569" stroke-width="1.5" />
    <line x1="175" y1="62" x2="220" y2="62" stroke="#475569" stroke-width="1.5" />
    <!-- City lights outside -->
    <circle cx="185" cy="45" r="1.5" fill="#fbbf24" />
    <circle cx="210" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="190" cy="80" r="1.5" fill="#fb923c" />
  </g>

  <!-- Desk Surface -->
  <path d="M10 185 L230 185 L220 215 L20 215 Z" fill="#090d16" />
  <path d="M10 185 L230 185 L230 188 L10 188 Z" fill="#334155" />

  <!-- Desk Lamp -->
  <g>
    <path d="M190 185 L200 130 L205 130 L195 185 Z" fill="#64748b" />
    <path d="M190 133 C180 120 170 100 175 80 C185 85 195 100 198 133 Z" fill="#f59e0b" filter="url(#softShadow)" />
    <!-- Lamp Head -->
    <path d="M160 70 L195 75 L185 95 L150 90 Z" fill="#fbbf24" />
    <!-- Light Cone Line -->
    <polygon points="172,87 110,185 180,185" fill="#fbbf24" opacity="0.08" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(140, 155)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#38bdf8" filter="url(#softShadow)" />
    <path d="M16 4 C21 4 21 14 16 14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M5 -4 C3 -8 8 -10 6 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M11 -4 C9 -8 14 -10 12 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- THE NEWSPAPER (Central Prop - "报纸" & "启事") -->
  <g transform="translate(75, 120) rotate(-8)" filter="url(#softShadow)">
    <!-- Main Paper Sheet -->
    <rect x="0" y="0" width="90" height="75" rx="3" fill="url(#paperGrad)" />
    <rect x="0" y="0" width="90" height="75" rx="3" fill="none" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Newspaper Header Banner -->
    <rect x="10" y="8" width="70" height="10" rx="2" fill="#334155" />
    
    <!-- Columns and Text Lines (Abstracted) -->
    <line x1="10" y1="24" x2="50" y2="24" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="29" x2="45" y2="29" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Highlighted Section: The "Notice / 启事" Box -->
    <rect x="48" y="22" width="32" height="42" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    
    <!-- Small Silhouette Graphic inside Notice (representing a person/missing icon) -->
    <circle cx="64" cy="34" r="5" fill="#f59e0b" />
    <path d="M57 48 C57 42 71 42 71 48 Z" fill="#f59e0b" />
    
    <!-- Notice text lines -->
    <line x1="52" y1="53" x2="76" y2="53" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
    <line x1="55" y1="58" x2="73" y2="58" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />

    <!-- Other newspaper columns -->
    <line x1="10" y1="36" x2="40" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="41" x2="38" y2="41" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="46" x2="35" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <line x1="10" y1="56" x2="40" y2="56" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="10" y1="61" x2="35" y2="61" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER (Expressive Man sitting at desk, checking the published notice) -->
  <g transform="translate(25, 95)">
    <!-- Chair Back -->
    <rect x="15" y="15" width="22" height="75" rx="6" fill="#1e293b" filter="url(#softShadow)" />
    
    <!-- Torso (Jacket/Sweater) -->
    <path d="M22 60 C22 45 45 42 55 55 L65 95 L15 95 Z" fill="#2563eb" filter="url(#softShadow)" />
    <!-- Collar & Shirt -->
    <path d="M36 55 L44 55 L48 65 L32 65 Z" fill="#f8fafc" />
    <path d="M40 55 L40 70" stroke="#1d4ed8" stroke-width="2" />

    <!-- Head & Face -->
    <g transform="translate(32, 22)">
      <!-- Hair -->
      <path d="M2 18 C2 4 14 0 26 2 C36 4 44 12 44 22 L44 28 C30 24 16 26 2 28 Z" fill="#0f172a" />
      <!-- Face Base -->
      <rect x="6" y="10" width="32" height="30" rx="14" fill="#ffedd5" />
      <!-- Ear -->
      <circle cx="36" cy="25" r="4" fill="#fed7aa" />
      <!-- Eyebrows (Thoughtful / Caring expression) -->
      <path d="M12 21 C15 19 20 21 22 23" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" />
      <path d="M26 23 C28 21 33 19 36 21" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" />
      <!-- Eyes -->
      <circle cx="17" cy="26" r="2" fill="#1e293b" />
      <circle cx="31" cy="26" r="2" fill="#1e293b" />
      <!-- Gentle Smile / Serious Concern -->
      <path d="M22 33 C24 35 27 35 29 33" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" />
      <!-- Cheek Blush -->
      <circle cx="14" cy="30" r="3" fill="#fca5a5" opacity="0.5" />
      <circle cx="34" cy="30" r="3" fill="#fca5a5" opacity="0.5" />
    </g>

    <!-- Arms & Hands pointing/holding the newspaper -->
    <!-- Back Arm -->
    <path d="M25 65 C15 70 10 85 15 95" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    
    <!-- Front Arm & Hand resting near newspaper -->
    <path d="M50 70 C60 75 70 85 75 90" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" />
    <circle cx="78" cy="91" r="5" fill="#ffedd5" />
  </g>

  <!-- Laptop / Desk clutter for extra richness -->
  <g transform="translate(10, 170)">
    <path d="M0 15 L35 15 L30 0 L5 0 Z" fill="#64748b" />
    <rect x="-3" y="13" width="41" height="3" rx="1.5" fill="#94a3b8" />
  </g>

</svg>