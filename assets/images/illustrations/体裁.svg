<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow/accent -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.4"/>

  <!-- Conceptual illustration for "体裁" (Literary Genre / Physical manuscript & categorized categories) -->
  <g transform="translate(0, 0)">
    <!-- Stack of documents/books representing genre categorization -->
    <!-- Document 3 (Bottom/Back) -->
    <path d="M70,95 L170,95 L170,175 C170,180.5 165.5,185 160,185 L80,185 C74.5,185 70,180.5 70,175 Z" fill="#2A3441" />
    <line x1="90" y1="115" x2="150" y2="115" stroke="#3E4C59" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="135" x2="130" y2="135" stroke="#3E4C59" stroke-width="4" stroke-linecap="round"/>

    <!-- Document 2 (Middle) -->
    <path d="M60,80 L160,80 L160,160 C160,165.5 155.5,170 150,170 L70,170 C64.5,170 60,165.5 60,160 Z" fill="#3A4A5D" />
    <line x1="80" y1="100" x2="140" y2="100" stroke="#52647A" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="120" x2="120" y2="120" stroke="#52647A" stroke-width="4" stroke-linecap="round"/>

    <!-- Document 1 (Front/Primary - Classic Scroll/Book styling) -->
    <path d="M50,65 L150,65 C155.5,65 160,69.5 160,75 L160,155 C160,160.5 155.5,165 150,165 L50,165 C44.5,165 40,160.5 40,155 L40,75 C40,69.5 44.5,65 50,65 Z" fill="#2C3E50" />
    
    <!-- Binding/Spine effect on the left -->
    <path d="M40,75 C40,69.5 44.5,65 50,65 L55,65 L55,165 L50,165 C44.5,165 40,160.5 40,155 Z" fill="#1E293B" />
    <circle cx="47" cy="85" r="2" fill="#F59E0B"/>
    <circle cx="47" cy="115" r="2" fill="#F59E0B"/>
    <circle cx="47" cy="145" r="2" fill="#F59E0B"/>

    <!-- Classical poetry layout lines (representing classical genre) -->
    <line x1="75" y1="85" x2="135" y2="85" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="105" x2="120" y2="105" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="125" x2="135" y2="125" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="145" x2="110" y2="145" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

    <!-- Highlight / Focal Accent (Gold/Orange representing structure/classification) -->
    <path d="M140,50 L185,50 C190.5,50 195,54.5 195,60 L195,140 C195,145.5 190.5,150 185,150 L140,150 Z" fill="#F59E0B" opacity="0.15" />
    <path d="M135,45 L180,45 C185.5,45 190,49.5 190,55 L190,135 C190,140.5 185.5,145 180,145 L135,145 C129.5,145 125,140.5 125,135 L125,55 C125,49.5 129.5,45 135,45 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="3" />
    
    <!-- Categorization icons inside the floating selector card -->
    <circle cx="157" cy="70" r="8" fill="#F59E0B" />
    <path d="M153,70 L156,73 L163,66" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <line x1="145" y1="95" x2="170" y2="95" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="110" x2="165" y2="110" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="125" x2="160" y2="125" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

    <!-- Connecting structural bracket / classification indicator -->
    <path d="M110,65 L110,40 L160,40" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" opacity="0.8"/>
  </g>
</svg>