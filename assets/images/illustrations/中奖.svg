<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines / Celebration background rays -->
  <g opacity="0.15">
    <path d="M120 30L120 50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M65 55L80 70" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M175 55L160 70" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 110L60 110" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 110L180 110" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Confetti / Sparkles -->
  <circle cx="75" cy="50" r="3" fill="#FBBF24"/>
  <circle cx="165" cy="45" r="4" fill="#34D399"/>
  <circle cx="50" cy="90" r="2.5" fill="#60A5FA"/>
  <circle cx="190" cy="95" r="3" fill="#F472B6"/>
  
  <polygon points="120,25 122,32 129,32 123,36 125,43 120,39 115,43 117,36 111,32 118,32" fill="#F59E0B" opacity="0.8"/>
  <polygon points="195,50 196,54 200,54 197,57 198,61 195,58 192,61 193,57 190,54 194,54" fill="#FBBF24" opacity="0.9"/>
  <polygon points="45,45 46,48 50,48 47,50 48,54 45,51 42,54 43,50 40,48 44,48" fill="#38BDF8" opacity="0.8"/>

  <!-- Golden Ticket / Scratch Card Object (Cause) -->
  <g transform="translate(60, 115)">
    <!-- Ticket Shadow -->
    <rect x="0" y="5" width="120" height="70" rx="8" fill="#0F1115" opacity="0.5"/>
    <!-- Ticket Base -->
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#1E293B"/>
    <rect x="0" y="0" width="120" height="70" rx="8" fill="none" stroke="#334155" stroke-width="2"/>
    
    <!-- Decorative Ticket Edges -->
    <circle cx="0" cy="35" r="8" fill="#1A1D24"/>
    <circle cx="120" cy="35" r="8" fill="#1A1D24"/>
    
    <!-- Ticket Header -->
    <rect x="15" y="12" width="90" height="10" rx="3" fill="#475569"/>
    
    <!-- Winning Symbol Area (Scratch revealed) -->
    <rect x="15" y="30" width="90" height="28" rx="4" fill="#FEF3C7"/>
    
    <!-- Winner Trophy Icon inside ticket -->
    <path d="M55 36H65V42C65 45.3137 62.3137 48 59 48C55.6863 48 53 45.3137 53 42V36H55Z" fill="#D97706"/>
    <path d="M52 36H68V38H52V36Z" fill="#D97706"/>
    <path d="M59 48V52M55 52H63" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M51 37H53C53 40 55 41 57 41V37H51Z" fill="#F59E0B"/>
    <path d="M69 37H67C67 40 65 41 63 41V37H69Z" fill="#F59E0B"/>
  </g>

  <!-- Dynamic Character Action (Arms/Hands interacting, pointing at win) -->
  <g>
    <!-- Character Head / Upper Shoulders hint at bottom -->
    <path d="M90 220C90 205 103 195 120 195C137 195 150 205 150 220V240H90V220Z" fill="#334155"/>
    
    <!-- Hands holding / revealing -->
    <path d="M75 140C65 145 55 160 55 175L70 185C75 175 82 165 90 155L75 140Z" fill="#F87171"/>
    <path d="M165 140C175 145 185 160 185 175L170 185C165 175 158 165 150 155L165 140Z" fill="#F87171"/>
    
    <!-- Thumbs up / Victory gesture element -->
    <circle cx="68" cy="138" r="8" fill="#FCA5A5"/>
    <circle cx="172" cy="138" r="8" fill="#FCA5A5"/>
  </g>

  <!-- Action / Success Motion Lines pointing to the prize -->
  <path d="M95 110L105 95" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  <path d="M145 110L135 95" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 105L120 90" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>

</svg>