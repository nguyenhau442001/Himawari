<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment (Meeting/Classroom/Stage context) -->
  <path d="M0 0h240v180H0z" fill="#0f172a" opacity="0.4" />
  
  <!-- Ambient Lighting / Spotlight effect representing a gathering/meeting -->
  <polygon points="120,0 20,200 220,200" fill="url(#spotlight)" />

  <!-- Wall Elements: Windows & Poster outlines for interior depth -->
  <rect x="25" y="25" width="35" height="50" rx="4" fill="#334155" opacity="0.3" />
  <rect x="180" y="25" width="35" height="50" rx="4" fill="#334155" opacity="0.3" />

  <!-- Speaker / Central Character (Frustrated/Embarrassed, asking for quiet) -->
  <g transform="translate(110, 85)">
    <!-- Body & Torso -->
    <path d="M-15 55 L15 55 L20 95 L-20 95 Z" fill="#38bdf8" />
    <!-- Arms raised in gesture "shh" / "stop" -->
    <path d="M-15 60 L-30 45 L-22 35 L-12 50 Z" fill="#0284c7" />
    <path d="M15 60 L32 40 L25 30 L10 48 Z" fill="#0284c7" />
    <!-- Head -->
    <circle cx="0" cy="25" r="18" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M-15 20 C-15 8, -5 5, 0 10 C5 5, 15 8, 15 20 C10 14, -10 14, -15 20 Z" fill="#b45309" />
    <!-- Facial expression: Eyes closed/strained, open mouth asking to stop -->
    <path d="M-6 24 L-2 26" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M2 26 L6 24" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="0" cy="32" rx="4" ry="5" fill="#1e293b" />
  </g>

  <!-- Left Disturber Character (Hùa theo / Teasing, pointing & laughing) -->
  <g transform="translate(55, 95)">
    <!-- Torso -->
    <path d="M-12 50 L12 50 L15 90 L-15 90 Z" fill="#ec4899" />
    <!-- Pointing Arm -->
    <path d="M10 55 L35 40 L40 45 L15 65 Z" fill="#db2777" />
    <!-- Head leaning forward -->
    <circle cx="-2" cy="20" r="16" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M-16 16 C-14 5, 5 8, 8 18 C3 14, -10 12, -16 16 Z" fill="#831843" />
    <!-- Laughing face (eyes curved, open happy mouth) -->
    <path d="M-8 18 Q-4 14 0 18" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M2 18 Q6 14 10 18" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M-3 24 Q0 30 3 24 Z" fill="#1e293b" />
  </g>

  <!-- Right Disturber Character (More commotion, arms up, teasing) -->
  <g transform="translate(180, 95)">
    <!-- Torso -->
    <path d="M-12 50 L12 50 L18 90 L-18 90 Z" fill="#10b981" />
    <!-- Waving Arms -->
    <path d="M-12 55 L-30 35 L-24 28 L-5 45 Z" fill="#059669" />
    <path d="M12 55 L28 40 L22 32 L8 48 Z" fill="#059669" />
    <!-- Head -->
    <circle cx="2" cy="20" r="16" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M-10 14 C0 5, 15 8, 16 18 C10 12, -2 12, -10 14 Z" fill="#065f46" />
    <!-- Laughing face -->
    <path d="M-4 18 Q0 14 4 18" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M6 18 Q10 14 14 18" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="2" cy="26" r="3" fill="#1e293b" />
  </g>

  <!-- Foreground Table / Podium / Desk adding concrete real-world context -->
  <path d="M20 175 L220 175 L200 230 L40 230 Z" fill="url(#desk-grad)" />
  <path d="M20 175 L220 175 L220 183 L20 183 Z" fill="#475569" />

  <!-- Props on Desk: Microphone, papers, water glass -->
  <!-- Microphone for the speaker -->
  <rect x="117" y="150" width="6" height="30" fill="#94a3b8" />
  <circle cx="120" cy="147" r="7" fill="#cbd5e1" />
  <path d="M113 147 A7 7 0 0 0 127 147" stroke="#64748b" stroke-width="1.5" fill="none" />
  <!-- Notepad / Papers -->
  <rect x="85" y="170" width="25" height="18" rx="2" fill="#f8fafc" />
  <path d="M90 175 H105 M90 180 H100" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <!-- Water Glass -->
  <path d="M145 168 L148 185 L158 185 L161 168 Z" fill="#38bdf8" opacity="0.4" />
  <path d="M144 168 H162" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />

  <!-- Visual Action Indicators (Sound waves / commotion lines floating around) -->
  <path d="M40 70 Q45 65 50 70" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M35 80 Q43 73 50 82" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M190 70 Q195 65 200 70" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M190 82 Q197 73 205 80" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Subtle Shh / Quiet Gesture Symbol (Abstract kinetic lines near central character's mouth) -->
  <path d="M103 115 Q108 110 105 105" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M106 119 Q113 112 108 106" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Clean framing container stroke -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" />
</svg>