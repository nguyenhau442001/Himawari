<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Sun/Heat representation -->
  <circle cx="200" cy="40" r="25" fill="#fbbf24" opacity="0.3"/>
  <circle cx="200" cy="40" r="15" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 C 40 100, 80 100, 80 140 L 80 160 C 80 165, 40 165, 40 160 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="80" r="30" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="50" cy="75" r="3" fill="#0f172a"/>
    <circle cx="70" cy="75" r="3" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M50 85 Q 60 92, 70 85" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arm holding ice cream -->
    <path d="M80 110 L 110 90" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Ice Cream (雪糕) -->
  <g transform="translate(160, 70)">
    <rect x="-10" y="20" width="20" height="40" rx="4" fill="#ec4899"/>
    <rect x="-3" y="60" width="6" height="15" fill="#d97706"/>
    <!-- Drip -->
    <circle cx="5" cy="60" r="3" fill="#ec4899"/>
    <!-- Cool vapor effect -->
    <path d="M-15 15 Q -20 5, -10 0" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M15 15 Q 20 5, 10 0" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Background elements -->
  <path d="M0 240 L 240 240 L 240 200 Q 120 180 0 200 Z" fill="#1e293b" opacity="0.5"/>
  <circle cx="30" cy="180" r="2" fill="#fb923c" opacity="0.4"/>
  <circle cx="210" cy="190" r="3" fill="#10b981" opacity="0.4"/>
</svg>