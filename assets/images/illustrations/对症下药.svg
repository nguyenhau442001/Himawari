<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Abstract representation of the business "problem" (chaotic, fragmented gear/structure) -->
  <g transform="translate(120, 120)">
    <path d="M-40 -40 L-10 -40 L-10 -10 L-40 -10 Z" fill="#FF5252" opacity="0.6"/>
    <path d="M10 -40 L40 -40 L40 -10 L10 -10 Z" fill="#FF5252" opacity="0.6"/>
    <path d="M-40 10 L-10 10 L-10 40 L-40 40 Z" fill="#FF5252" opacity="0.6"/>
    <path d="M10 10 L40 10 L40 40 L10 40 Z" fill="#FF5252" opacity="0.6"/>
  </g>

  <!-- The "Prescription" (The precise solution) -->
  <!-- A golden key/tool fitting perfectly into the center -->
  <g transform="translate(120, 120)">
    <rect x="-5" y="-55" width="10" height="110" rx="2" fill="#FFD700"/>
    <rect x="-15" y="-55" width="30" height="10" rx="2" fill="#FFD700"/>
    <rect x="-15" y="-25" width="20" height="10" rx="2" fill="#FFD700"/>
  </g>

  <!-- Visual contrast: The chaotic red fragments vs the precise golden solution -->
  <!-- The golden element is scaled to be the focal point, emphasizing the "correctness" -->
  <circle cx="120" cy="120" r="5" fill="#FFD700"/>
</svg>