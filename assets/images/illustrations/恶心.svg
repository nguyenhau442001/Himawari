<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="smellGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="240" height="240" fill="url(#bgGrad)" />

    <!-- Kitchen / Dining Room Environment Background -->
    <rect x="20" y="120" width="200" height="100" fill="#334155" rx="8" />
    <!-- Counter top -->
    <rect x="20" y="112" width="200" height="12" fill="#475569" rx="3" />
    <rect x="15" y="108" width="210" height="6" fill="#64748b" rx="2" />

    <!-- Window in background -->
    <rect x="90" y="30" width="60" height="70" fill="#020617" rx="4" />
    <rect x="95" y="35" width="23" height="30" fill="#1e293b" />
    <rect x="122" y="35" width="23" height="30" fill="#1e293b" />
    <rect x="95" y="69" width="23" height="26" fill="#1e293b" />
    <rect x="122" y="69" width="23" height="26" fill="#1e293b" />

    <!-- The Problematic Food Bowl (Source of smell) -->
    <g transform="translate(160, 95)">
      <!-- Bowl shadow -->
      <ellipse cx="0" cy="18" rx="22" ry="6" fill="#090d16" opacity="0.5" />
      <!-- Bowl body -->
      <path d="M -18 8 C -18 20, 18 20, 18 8 Z" fill="#cbd5e1" />
      <ellipse cx="0" cy="8" rx="18" ry="5" fill="#94a3b8" />
      <ellipse cx="0" cy="8" rx="14" ry="3" fill="#38bdf8" />
      <!-- Spooky/Spoiled food content (Greenish-brown blobs & bubbles) -->
      <circle cx="-4" cy="7" r="4" fill="#047857" />
      <circle cx="5" cy="8" r="3.5" fill="#065f46" />
      <circle cx="1" cy="5" r="2.5" fill="#047857" />
    </g>

    <!-- Wavy Stinky Lines / Smell rising -->
    <g stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M 155 80 Q 145 65 155 50 T 150 25" />
      <path d="M 170 85 Q 185 70 170 55 T 180 30" stroke-width="2" />
    </g>

    <!-- Character: Experiencing Nausea (恶心) -->
    <!-- Torso and Shoulders -->
    <path d="M 50 200 C 50 165, 80 150, 100 150 C 120 150, 150 165, 150 200 Z" fill="#3b82f6" />
    <path d="M 65 155 L 75 125 L 105 125 L 115 155 Z" fill="#f8fafc" /> <!-- Collar / Shirt -->
    <path d="M 80 120 L 90 132 L 100 120 Z" fill="#ef4444" /> <!-- Tie / Accent -->

    <!-- Head & Neck -->
    <rect x="85" y="105" width="20" height="25" fill="#fed7aa" />
    <!-- Head leans back slightly, eyes squeezed shut in disgust, hand raised to chest/mouth -->
    <circle cx="95" cy="85" r="26" fill="#fed7aa" />

    <!-- Hair (Styled neatly or messily) -->
    <path d="M 69 80 C 68 65, 85 55, 105 60 C 121 64, 123 78, 122 88 C 110 75, 80 75, 69 80 Z" fill="#1e293b" />

    <!-- Facial Expression: Disgust / Nausea -->
    <!-- Eyebrows angled down sharply in distress -->
    <path d="M 78 74 L 89 79" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 101 79 L 112 74" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes squeezed shut (horizontal curved lines with lashes/folds) -->
    <path d="M 78 85 Q 83 89 88 85" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 102 85 Q 107 89 112 85" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 95 88 L 92 95 L 97 96" stroke="#c2410c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth open in groan/disgust (wavy grimace line) -->
    <path d="M 87 102 Q 95 97 103 102" stroke="#9a3412" stroke-width="2.5" fill="#7c2d12" stroke-linecap="round" />

    <!-- Blush / Sweat drop of distress -->
    <path d="M 116 88 C 120 90, 120 95, 115 96" fill="#38bdf8" opacity="0.6" />
    <!-- Sweat drop flying off head -->
    <path d="M 119 65 C 119 65, 124 72, 124 76 C 124 79, 121 81, 119 81 C 117 81, 114 79, 114 76 C 114 72, 119 65, 119 65 Z" fill="#38bdf8" />

    <!-- Arms & Hands reacting -->
    <!-- One hand holding stomach/chest -->
    <path d="M 60 160 C 50 170, 70 190, 85 175" fill="none" stroke="#fed7aa" stroke-width="10" stroke-linecap="round" />
    <path d="M 80 178 C 85 180, 92 175, 95 170" fill="#fed7aa" stroke-width="8" stroke-linecap="round" /> <!-- hand -->
    <!-- Other arm raised defensively warding off the smell -->
    <path d="M 130 160 C 145 150, 135 125, 120 125" fill="none" stroke="#fed7aa" stroke-width="10" stroke-linecap="round" />
    <circle cx="120" cy="122" r="5" fill="#fed7aa" /> <!-- open palm facing source -->

    <!-- Foreground kitchen props -->
    <rect x="30" y="95" width="24" height="20" fill="#64748b" rx="2" />
    <path d="M 42 95 L 42 85" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Ambient decorative dots / lighting elements -->
    <circle cx="35" cy="45" r="2" fill="#64748b" opacity="0.5" />
    <circle cx="205" cy="65" r="1.5" fill="#64748b" opacity="0.5" />
    <circle cx="210" cy="180" r="2" fill="#64748b" opacity="0.5" />
  </g>
</svg>