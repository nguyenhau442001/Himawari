<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing background accents representing effort and energy -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- First Layer of Effort (Base Scale/Object) -->
  <g transform="translate(0, 5)">
    <!-- Book Base -->
    <path d="M 70,120 L 120,105 L 170,120 L 170,165 L 120,150 L 70,165 Z" fill="#2D3748"/>
    <path d="M 120,105 L 120,150" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <!-- Pages -->
    <path d="M 75,123 L 115,111 L 115,152 L 75,160 Z" fill="#4A5568"/>
    <path d="M 165,123 L 125,111 L 125,152 L 165,160 Z" fill="#4A5568"/>
    <!-- Pencil representing study/effort -->
    <path d="M 90,135 L 135,90 L 142,97 L 97,142 Z" fill="#F6AD55"/>
    <polygon points="135,90 142,97 138.5,100.5 131.5,93.5" fill="#DD6B20"/>
  </g>

  <!-- Second Layer / Doubling Effect (The "Jiabei" / Double Effort concept: Duplicated, amplified, glowing gold) -->
  <g transform="translate(0, -15)">
    <!-- Offset duplicate of the book, glowing with gold accent to signify "doubled/amplified effort" -->
    <path d="M 70,120 L 120,105 L 170,120 L 170,165 L 120,150 L 70,165 Z" fill="#D69E2E" opacity="0.25"/>
    
    <!-- Main Floating Amplified Study Icon (Double Book & Powerful Upward Energy) -->
    <path d="M 75,110 C 75,100 95,95 120,95 C 145,95 165,100 165,110 L 165,150 C 165,160 145,165 120,165 C 95,165 75,160 75,150 Z" fill="#2D3748" stroke="#ECC94B" stroke-width="3"/>
    
    <!-- Center spine -->
    <line x1="120" y1="95" x2="120" y2="165" stroke="#ECC94B" stroke-width="3"/>

    <!-- Left & Right Pages with high-contrast gold details -->
    <path d="M 82,112 C 95,108 110,110 115,113 L 115,152 C 110,149 95,147 82,151 Z" fill="#4A5568"/>
    <path d="M 158,112 C 145,108 130,110 125,113 L 125,152 C 130,149 145,147 158,151 Z" fill="#4A5568"/>

    <!-- Upward Action / Double Energy Arrows -->
    <g stroke="#F6AD55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 95,85 L 120,60 L 145,85"/>
      <path d="M 105,72 L 120,57 L 135,72" opacity="0.7"/>
    </g>

    <!-- Star/Sparkle accents indicating multiplied intensity -->
    <path d="M 55,100 L 58,108 L 66,111 L 58,114 L 55,122 L 52,114 L 44,111 L 52,108 Z" fill="#ECC94B"/>
    <path d="M 185,90 L 187,95 L 192,97 L 187,99 L 185,104 L 183,99 L 178,97 L 183,95 Z" fill="#F6AD55"/>
    <path d="M 175,140 L 177,145 L 182,147 L 177,149 L 175,154 L 173,149 L 168,147 L 173,145 Z" fill="#ECC94B"/>
  </g>
</svg>