<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing care/hospital environment -->
  <circle cx="120" cy="120" r="80" fill="#222B38" opacity="0.6"/>

  <!-- Hospital Bed / Patient Context -->
  <!-- Bed frame -->
  <rect x="55" y="150" width="130" height="12" rx="6" fill="#3A4454"/>
  <rect x="70" y="130" width="100" height="22" rx="4" fill="#2E3846"/>
  <!-- Mattress & Pillow -->
  <rect x="62" y="115" width="116" height="25" rx="8" fill="#E2E8F0"/>
  <rect x="68" y="102" width="35" height="18" rx="6" fill="#CBD5E1"/>

  <!-- Patient Character (Resting in bed) -->
  <!-- Blanket covering body -->
  <path d="M60 145 C60 125, 90 120, 140 120 C170 120, 180 130, 180 155 L60 155 Z" fill="#3B82F6"/>
  <path d="M60 155 L180 155 L180 162 L60 162 Z" fill="#2563EB"/>
  
  <!-- Patient Head & Face -->
  <circle cx="145" cy="95" r="18" fill="#FDE68A"/>
  <!-- Closed peaceful eyes (sleeping/recovering) -->
  <path d="M140 94 Q143 97 146 94" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M150 94 Q153 97 156 94" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Hospital wristband -->
  <path d="M72 135 L80 135" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>

  <!-- Medical Caregiver (Nurse/Doctor standing beside bed) -->
  <!-- Body / Uniform (White coat/scrubs) -->
  <path d="M190 115 L215 130 L210 190 L175 190 L170 130 Z" fill="#F8FAFC"/>
  <!-- Stethoscope around neck -->
  <path d="M190 95 C185 95, 183 105, 185 112 C186 116, 192 118, 195 125" stroke="#475569" stroke-width="2.5" fill="none"/>
  <circle cx="195" cy="127" r="4" fill="#94A3B8"/>

  <!-- Caregiver Head & Hair -->
  <circle cx="190" cy="80" r="15" fill="#FFDBAC"/>
  <!-- Nurse cap / Headwear -->
  <path d="M176 75 C180 65, 200 65, 204 75 Z" fill="#F8FAFC"/>
  <rect x="184" y="68" width="12" height="6" rx="2" fill="#EF4444"/>

  <!-- Caring gesture: Hand gently holding clipboard or adjusting blanket -->
  <path d="M170 120 L185 128 L180 135 Z" fill="#FFDBAC"/>
  
  <!-- Clipboard symbol of medical attention -->
  <rect x="195" y="135" width="22" height="30" rx="3" fill="#64748B"/>
  <rect x="199" y="142" width="14" height="18" rx="1" fill="#F1F5F9"/>
  <path d="M202 147 L210 147" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <path d="M202 153 L208 153" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- IV Pole / Medical equipment in background -->
  <line x1="35" y1="60" x2="35" y2="190" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="65" x2="45" y2="65" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <!-- IV Bag -->
  <rect x="28" y="75" width="14" height="22" rx="4" fill="#38BDF8" opacity="0.8"/>
  <path d="M35 97 L35 120" stroke="#38BDF8" stroke-width="1.5"/>
</svg>