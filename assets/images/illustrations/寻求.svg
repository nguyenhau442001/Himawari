<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements: Abstract path representing the search journey -->
  <path d="M40 120 C 80 80, 160 80, 200 120" stroke="#2D343E" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#FFB84D"/>
    <path d="M5 40 Q 20 60 35 40 L 35 90 Q 20 100 5 90 Z" fill="#FFB84D"/>
    <path d="M10 50 L 5 70" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#4D94FF"/>
    <path d="M5 40 Q 20 60 35 40 L 35 90 Q 20 100 5 90 Z" fill="#4D94FF"/>
    <path d="M30 50 L 35 70" stroke="#4D94FF" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- The "Goal" or "Solution" being sought (Gold puzzle piece) -->
  <path d="M105 70 L 135 70 L 135 100 L 120 100 L 120 115 L 105 115 Z" fill="#FFD700"/>
  
  <!-- Motion lines indicating active search/reaching -->
  <path d="M85 110 Q 100 90 115 105" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-opacity="0.3"/>
  <path d="M155 110 Q 140 90 125 105" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-opacity="0.3"/>
  
  <!-- Ground line -->
  <line x1="40" y1="190" x2="200" y2="190" stroke="#3E4552" stroke-width="2"/>
</svg>