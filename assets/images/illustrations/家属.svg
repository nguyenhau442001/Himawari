<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor shadow / ambient glow -->
  <ellipse cx="120" cy="195" rx="70" ry="12" fill="#111318" opacity="0.8"/>

  <!-- Character 1: Patient's Family Member (Wife/Relative) waiting anxiously -->
  <g transform="translate(75, 75)">
    <!-- Body / Torso -->
    <path d="M 12 75 C 12 60 22 50 35 50 C 48 50 58 60 58 75 L 58 105 L 12 105 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="35" cy="28" r="16" fill="#FBBF24"/>
    <!-- Hair (Clean modern flat style) -->
    <path d="M 20 25 C 20 15 28 12 35 12 C 43 12 50 15 50 25 C 50 22 47 18 35 18 C 23 18 20 22 20 25 Z" fill="#1E293B"/>
    <!-- Anxious hands clasped together -->
    <circle cx="35" cy="72" r="8" fill="#FBBF24"/>
  </g>

  <!-- Character 2: Doctor in white coat communicating -->
  <g transform="translate(130, 75)">
    <!-- Body / White Coat -->
    <path d="M 10 75 C 10 60 20 50 33 50 C 46 50 56 60 56 75 L 56 105 L 10 105 Z" fill="#E2E8F0"/>
    <!-- Stethoscope -->
    <path d="M 28 50 C 28 60 38 60 38 70" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="33" cy="28" r="16" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M 19 26 C 19 16 26 13 33 13 C 41 13 47 16 47 26 Z" fill="#334155"/>
    <!-- Gesturing hand explaining -->
    <circle cx="8" cy="70" r="6" fill="#FBBF24"/>
  </g>

  <!-- Hospital / Medical Accent (Subtle cross symbol floating above to give clinical context without clutter) -->
  <g transform="translate(112, 32)">
    <rect x="0" y="5" width="16" height="6" rx="2" fill="#EF4444"/>
    <rect x="5" y="0" width="6" height="16" rx="2" fill="#EF4444"/>
  </g>

  <!-- Focus / Connection indicator between family and doctor -->
  <path d="M 105 115 Q 120 105 135 115" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
</svg>