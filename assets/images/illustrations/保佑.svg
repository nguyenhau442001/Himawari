<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow for Divine/Sacred Atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.08"/>
  <circle cx="120" cy="115" r="45" fill="#FFB703" opacity="0.12"/>

  <!-- Divine Rays / Aura -->
  <g stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="120" y1="45" x2="120" y2="30"/>
    <line x1="160" y1="65" x2="172" y2="53"/>
    <line x1="180" y1="105" x2="195" y2="105"/>
    <line x1="80" y1="65" x2="68" y2="53"/>
    <line x1="60" y1="105" x2="45" y2="105"/>
  </g>

  <!-- Stylized Mazu Goddess Statue (The Physical Object representing "保佑") -->
  <!-- Headdress / Crown (Mian guan with beads) -->
  <path d="M95 72 L145 72 L140 58 L100 58 Z" fill="#D4AF37"/>
  <rect x="90" y="68" width="60" height="6" rx="3" fill="#FFC857"/>
  <!-- Hanging beads from crown -->
  <circle cx="100" cy="78" r="1.5" fill="#E0F2FE"/>
  <circle cx="110" cy="78" r="1.5" fill="#E0F2FE"/>
  <circle cx="120" cy="78" r="1.5" fill="#E0F2FE"/>
  <circle cx="130" cy="78" r="1.5" fill="#E0F2FE"/>
  <circle cx="140" cy="78" r="1.5" fill="#E0F2FE"/>

  <!-- Face / Head -->
  <path d="M102 78 C102 74 138 74 138 78 L136 95 C136 102 104 102 104 95 Z" fill="#FDE047" opacity="0.9"/>

  <!-- Body / Robes (Traditional Imperial / Goddess Attire) -->
  <path d="M85 155 C85 125 155 125 155 155 L165 185 C165 188 162 190 158 190 L82 190 C78 190 75 188 75 185 Z" fill="#C2410C"/>
  
  <!-- Inner Robe / Chest Details -->
  <path d="M104 110 L136 110 L145 155 L95 155 Z" fill="#EA580C"/>
  
  <!-- Decorative Collar / Jade Tablet (Hu) held in hands -->
  <rect x="112" y="125" width="16" height="25" rx="3" fill="#38BDF8"/>
  <path d="M90 115 L150 115 L140 128 L100 128 Z" fill="#FACC15"/>

  <!-- Protective / Blessing Hands (Cupped gently underneath or surrounding) -->
  <path d="M65 165 C65 145 80 140 95 145" stroke="#FACC15" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M175 165 C175 145 160 140 145 145" stroke="#FACC15" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Base / Altar -->
  <rect x="80" y="190" width="80" height="12" rx="4" fill="#334155"/>
  <rect x="70" y="202" width="100" height="8" rx="3" fill="#1E293B"/>

  <!-- Subtle Blessing Sparkles / Energy Particles -->
  <g fill="#38BDF8">
    <circle cx="85" cy="100" r="2"/>
    <circle cx="155" cy="100" r="2"/>
    <circle cx="120" cy="38" r="2.5"/>
    <circle cx="65" cy="130" r="1.5"/>
    <circle cx="175" cy="130" r="1.5"/>
  </g>
  <g fill="#FACC15">
    <circle cx="100" cy="50" r="1.5"/>
    <circle cx="140" cy="50" r="1.5"/>
  </g>
</svg>