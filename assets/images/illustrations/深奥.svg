<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="abyss-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252A34"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <!-- Background Layer / Deep Abyss Representation -->
  <circle cx="120" cy="120" r="95" fill="url(#abyss-grad)" stroke="#2D3342" stroke-width="2"/>

  <!-- Concentric depth rings representing layers of meaning -->
  <circle cx="120" cy="120" r="75" fill="none" stroke="#3A4256" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="120" cy="120" r="55" fill="none" stroke="#4A5568" stroke-width="1.5" opacity="0.5"/>
  <circle cx="120" cy="120" r="35" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.3"/>

  <!-- Conceptual Contrast: Surface (Simple) vs Depth (Profound / 深奥) -->
  <!-- Surface layer (Small, simple, shallow puzzle/node) at the top -->
  <g transform="translate(120, 52)">
    <!-- Surface indicator line -->
    <line x1="0" y1="-12" x2="0" y2="4" stroke="#64748B" stroke-dasharray="2 2" stroke-width="1.5"/>
    <!-- Small simple element -->
    <circle cx="0" cy="-16" r="8" fill="#64748B" opacity="0.8"/>
    <path d="M-3 -16 L0 -19 L3 -16" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Deep layer (Massive, glowing, multi-layered complex core representing 深奥) -->
  <g transform="translate(120, 130)">
    <!-- Outer geometric complex orbit -->
    <path d="M 0,-38 L 33,19 L -33,19 Z" fill="none" stroke="#FF8C00" stroke-width="1.5" opacity="0.4" stroke-linejoin="round"/>
    <path d="M 0,38 L 33,-19 L -33,-19 Z" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4" stroke-linejoin="round"/>

    <!-- Central Glowing Core (Profound truth/theory) -->
    <circle cx="0" cy="0" r="22" fill="#1E232E" stroke="url(#gold-grad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Complex interconnected nodes inside the core (representing intricate theory) -->
    <circle cx="-7" cy="-5" r="3.5" fill="#FF8C00" filter="url(#subtle-glow)"/>
    <circle cx="8" cy="-3" r="2.5" fill="#FFD700"/>
    <circle cx="0" cy="9" r="3" fill="#FF8C00"/>
    
    <line x1="-7" y1="-5" x2="8" y2="-3" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>
    <line x1="-7" y1="-5" x2="0" y2="9" stroke="#FF8C00" stroke-width="1.5" opacity="0.8"/>
    <line x1="8" y1="-3" x2="0" y2="9" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>

    <!-- Radiating spark particles representing profound insight -->
    <circle cx="0" cy="-30" r="1.5" fill="#FFD700" opacity="0.9"/>
    <circle cx="28" cy="12" r="2" fill="#FF8C00" opacity="0.9"/>
    <circle cx="-28" cy="12" r="1.5" fill="#FFD700" opacity="0.9"/>
    
    <!-- Connection beam from surface to depth -->
    <path d="M 0,-22 L 0,-50" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- Scale contrast indicator brackets on the side (Visualizing Adjective scale: Shallow vs. Deep) -->
  <g transform="translate(32, 75)" opacity="0.6">
    <path d="M 6 0 L 0 0 L 0 95 L 6 95" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="47" x2="4" y2="47" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

</svg>