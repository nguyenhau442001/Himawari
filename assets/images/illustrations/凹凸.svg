<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Uneven Road Surface -->
  <path d="M0 180 C 40 160, 80 200, 120 170 C 160 140, 200 190, 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  <path d="M0 180 C 40 160, 80 200, 120 170 C 160 140, 200 190, 240 180" stroke="#475569" stroke-width="4" fill="none"/>
  
  <!-- Character: Person stumbling -->
  <g transform="translate(100, 120)">
    <!-- Body -->
    <path d="M20 20 L 30 60 L 10 60 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="20" cy="15" r="12" fill="#fbbf24"/>
    <!-- Arms -->
    <path d="M10 30 L 0 45" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 30 L 45 35" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M20 60 L 15 80" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 60 L 35 75" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Context: Street Lamp -->
  <rect x="200" y="80" width="6" height="100" fill="#64748b"/>
  <circle cx="203" cy="75" r="15" fill="#f59e0b" opacity="0.3"/>
  <circle cx="203" cy="75" r="8" fill="#fef3c7"/>

  <!-- Decorative elements (Stones/Debris) -->
  <circle cx="50" cy="190" r="4" fill="#94a3b8"/>
  <circle cx="150" cy="210" r="6" fill="#94a3b8"/>
  <path d="M180 195 L 190 190 L 195 200 Z" fill="#94a3b8"/>
  
  <!-- Motion lines -->
  <path d="M70 130 L 90 120" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 140 L 95 130" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
</svg>