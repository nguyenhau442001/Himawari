<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Rocket Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Stars / Background Details -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="35" cy="40" r="1" />
    <circle cx="85" cy="25" r="1.5" />
    <circle cx="170" cy="35" r="1" />
    <circle cx="210" cy="65" r="1.5" />
    <circle cx="25" cy="90" r="1" />
    <circle cx="205" cy="130" r="1" />
    <circle cx="55" cy="135" r="0.8" />
  </g>

  <!-- Distant moon / horizon glow -->
  <circle cx="190" cy="50" r="18" fill="#334155" opacity="0.4" />
  <circle cx="190" cy="50" r="12" fill="#475569" opacity="0.3" />

  <!-- Launch Pad Structure (Bottom) -->
  <g id="launch-pad">
    <!-- Platform base -->
    <rect x="70" y="215" width="100" height="8" rx="2" fill="#475569" />
    <rect x="85" y="205" width="70" height="10" fill="#334155" />
    
    <!-- Support Tower / Gantry -->
    <path d="M 65 210 L 65 140 L 73 140 L 73 210 Z" fill="#64748b" />
    <path d="M 65 150 L 52 170 L 58 175 L 65 155 Z" fill="#475569" />
    <path d="M 65 180 L 52 200 L 58 205 L 65 185 Z" fill="#475569" />
    <line x1="65" y1="160" x2="73" y2="165" stroke="#334155" stroke-width="2" />
    <line x1="65" y1="190" x2="73" y2="195" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Giant Launch Smoke & Flame (Bottom) -->
  <g filter="url(#glow)">
    <!-- Outer bright plume -->
    <ellipse cx="120" cy="200" rx="25" ry="15" fill="#fbbf24" opacity="0.8" />
    <path d="M 105 205 Q 120 175 125 120 Q 130 175 135 205 Z" fill="url(#flameGrad)" />
    <!-- Smoke clouds around base -->
    <circle cx="95" cy="208" r="12" fill="#cbd5e1" opacity="0.8" />
    <circle cx="80" cy="212" r="15" fill="#94a3b8" opacity="0.7" />
    <circle cx="145" cy="208" r="14" fill="#cbd5e1" opacity="0.8" />
    <circle cx="160" cy="213" r="16" fill="#94a3b8" opacity="0.7" />
    <circle cx="120" cy="210" r="18" fill="#e2e8f0" opacity="0.9" />
  </g>

  <!-- Rocket (Lifting off, mid-air ascent) -->
  <g id="rocket">
    <!-- Main Body -->
    <rect x="111" y="80" width="18" height="65" rx="9" fill="#f8fafc" />
    <!-- Red Accent / Stripe -->
    <path d="M 111 98 L 129 98 L 129 110 L 111 110 Z" fill="#ef4444" />
    <!-- Nose Cone -->
    <path d="M 120 58 C 125 58 129 70 129 80 L 111 80 C 111 70 115 58 120 58 Z" fill="#ef4444" />
    <!-- Window Porthole -->
    <circle cx="120" cy="90" r="4" fill="#0f172a" />
    <circle cx="120" cy="90" r="2.5" fill="#38bdf8" />
    <!-- Fins -->
    <path d="M 111 130 L 98 148 L 111 142 Z" fill="#3b82f6" />
    <path d="M 129 130 L 142 148 L 129 142 Z" fill="#3b82f6" />
    <!-- Exhaust Nozzle -->
    <rect x="115" y="145" width="10" height="5" fill="#475569" />
  </g>

  <!-- Excited Spectators (Bottom Left and Right Corners) -->
  <!-- Character 1: Child cheering with arms up -->
  <g id="spectator-child" transform="translate(20, 160)">
    <!-- Body / Jacket -->
    <path d="M 15 35 Q 22 28 29 35 L 32 55 L 8 55 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="20" cy="20" r="9" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 11 18 Q 20 10 29 18 Q 25 12 20 13 Q 15 12 11 18 Z" fill="#451a03" />
    <!-- Arms raised in excitement -->
    <path d="M 15 32 L 8 18" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
    <path d="M 25 32 L 32 18" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
    <!-- Face (Happy eyes & open smile) -->
    <circle cx="17" cy="20" r="1" fill="#1e293b" />
    <circle cx="23" cy="20" r="1" fill="#1e293b" />
    <path d="M 18 23 Q 20 26 22 23" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Character 2: Adult holding camera / pointing -->
  <g id="spectator-adult" transform="translate(175, 155)">
    <!-- Body / Hoodie -->
    <path d="M 12 35 Q 22 25 32 35 L 36 60 L 8 60 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="22" cy="18" r="9" fill="#fca5a5" />
    <!-- Hair -->
    <path d="M 13 15 Q 22 8 31 15 L 29 12 Q 22 10 15 12 Z" fill="#78350f" />
    <!-- Arm pointing/holding phone -->
    <path d="M 28 32 L 38 24" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" />
    <!-- Smartphone / Camera Device -->
    <rect x="36" y="20" width="8" height="12" rx="2" fill="#1e293b" />
    <rect x="38" y="22" width="4" height="8" rx="1" fill="#38bdf8" />
    <!-- Face profile indicator -->
    <circle cx="25" cy="18" r="1" fill="#1e293b" />
  </g>

  <!-- Success Sparkles / Celebration Elements (Subtle stars floating) -->
  <g fill="#fbbf24">
    <path d="M 75 80 L 77 85 L 82 87 L 77 89 L 75 94 L 73 89 L 68 87 L 73 85 Z" opacity="0.9" />
    <path d="M 165 70 L 166.5 73.5 L 170 75 L 166.5 76.5 L 165 80 L 163.5 76.5 L 160 75 L 163.5 73.5 Z" opacity="0.8" />
    <path d="M 145 115 L 146 117 L 148 118 L 146 119 L 145 121 L 144 119 L 142 118 L 144 117 Z" opacity="0.7" />
  </g>
</svg>