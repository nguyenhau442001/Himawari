<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Water/Paddy Gradient -->
    <linearGradient id="paddyWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Sunset/Dawn Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  
  <!-- Atmospheric Sun Glow -->
  <circle cx="190" cy="70" r="80" fill="url(#sunGlow)"/>
  <circle cx="190" cy="70" r="18" fill="#fbbf24"/>

  <!-- Distant Mountains -->
  <path d="M 0 130 L 40 100 L 90 125 L 150 90 L 210 115 L 240 100 L 240 160 L 0 160 Z" fill="#334155" opacity="0.6"/>
  <path d="M 0 145 L 60 120 L 120 150 L 180 125 L 240 140 L 240 165 L 0 165 Z" fill="#475569" opacity="0.8"/>

  <!-- Layered Terraced Rice Paddies (Water and Mud Banks) -->
  <!-- Terrace 1 (Background) -->
  <path d="M 0 155 Q 120 145 240 155 L 240 175 Q 120 165 0 175 Z" fill="#047857"/>
  <path d="M 10 162 Q 120 154 230 162" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Terrace 2 (Midground) -->
  <path d="M 0 175 Q 120 165 240 175 L 240 200 Q 120 190 0 200 Z" fill="url(#paddyWater)"/>
  <!-- Rice Shoots in Midground -->
  <g fill="#10b981">
    <path d="M 30 185 Q 32 175 35 173 Q 33 182 30 185 Z"/>
    <path d="M 45 187 Q 47 178 50 176 Q 48 184 45 187 Z"/>
    <path d="M 60 184 Q 62 174 65 172 Q 63 181 60 184 Z"/>
    <path d="M 160 190 Q 162 181 165 179 Q 163 187 160 190 Z"/>
    <path d="M 175 192 Q 177 183 180 181 Q 178 189 175 192 Z"/>
    <path d="M 190 188 Q 192 179 195 177 Q 193 185 190 188 Z"/>
  </g>

  <!-- Terrace 3 (Foreground - Active Planting Area) -->
  <path d="M 0 200 Q 120 190 240 200 L 240 240 L 0 240 Z" fill="url(#paddyWater)"/>
  
  <!-- Muddy Ridge Reflection Highlights -->
  <path d="M 0 200 Q 120 190 240 200" stroke="#065f46" stroke-width="4" fill="none"/>

  <!-- Rice Shoots planted in neat rows (Perspective grid) -->
  <g fill="#34d399">
    <!-- Row 1 -->
    <path d="M 20 215 L 22 205 L 25 214 Z"/>
    <path d="M 50 218 L 52 208 L 55 217 Z"/>
    <path d="M 80 221 L 82 211 L 85 220 Z"/>
    <path d="M 110 224 L 112 214 L 115 223 Z"/>
    
    <!-- Row 2 -->
    <path d="M 35 228 L 37 218 L 40 227 Z"/>
    <path d="M 70 231 L 72 221 L 75 230 Z"/>
    <path d="M 105 234 L 107 224 L 110 233 Z"/>
  </g>

  <!-- Farmer Character (Depicting "种植" - Planting rice) -->
  <g transform="translate(130, 160)">
    <!-- Bamboo Hat (Non La / Douli) -->
    <ellipse cx="20" cy="18" rx="22" ry="7" fill="#fbbf24"/>
    <ellipse cx="20" cy="16" rx="20" ry="5" fill="#f59e0b"/>
    <path d="M -2 18 L 20 10 L 42 18 Z" fill="#d97706"/>

    <!-- Head & Face (Profile/Bent down working) -->
    <circle cx="20" cy="24" r="8" fill="#fbcfe8"/> <!-- skin -->

    <!-- Torso (Leaning forward, wearing traditional blue/slate rural tunic) -->
    <path d="M 10 30 Q 25 28 35 38 L 25 55 L 5 45 Z" fill="#0284c7"/>

    <!-- Arms reaching into the water to plant -->
    <path d="M 30 35 L 45 42 L 55 48" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Hand holding rice seedlings -->
    <circle cx="56" cy="49" r="3" fill="#34d399"/>

    <!-- Legs crouching / submerged slightly -->
    <path d="M 12 48 L 0 65 L -10 65" stroke="#0369a1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Second Farmer in Background (Adding richness and realism) -->
  <g transform="translate(60, 168) scale(0.7)">
    <!-- Bamboo Hat -->
    <ellipse cx="20" cy="18" rx="22" ry="7" fill="#fbbf24"/>
    <path d="M -2 18 L 20 10 L 42 18 Z" fill="#d97706"/>
    <!-- Body -->
    <circle cx="20" cy="24" r="8" fill="#fbcfe8"/>
    <path d="M 10 30 Q 25 28 35 38 L 25 55 L 5 45 Z" fill="#0369a1"/>
    <!-- Arm planting -->
    <path d="M 30 35 L 48 45" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Foreground Details & Ripple Effects on Water -->
  <ellipse cx="160" cy="215" rx="8" ry="2" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <ellipse cx="140" cy="225" rx="12" ry="3" fill="none" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  
  <!-- Basket with Rice Seedlings on the Edge -->
  <g transform="translate(190, 195)">
    <!-- Basket Body -->
    <path d="M 0 10 L 8 22 L 28 22 L 36 10 Z" fill="#b45309"/>
    <path d="M 2 10 Q 18 6 34 10 Q 18 14 2 10 Z" fill="#d97706"/>
    <!-- Seedlings sticking out of basket -->
    <path d="M 12 8 Q 10 -2 8 -5" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M 18 7 Q 18 -4 20 -8" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 8 Q 28 -1 30 -6" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flying Birds (Adding life and scale to the rural landscape) -->
  <path d="M 40 60 Q 45 52 50 60 Q 55 52 60 60" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 65 45 Q 69 40 73 45 Q 77 40 81 45" stroke="#94a3b8" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Ambient Light Reflection on Water Surfaces -->
  <path d="M 20 208 Q 50 206 80 208" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 100 218 Q 130 216 160 218" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.2"/>

</svg>