<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Room elements (subtle) -->
  <path d="M0 160 H240 V240 H0 Z" fill="#1c2b3f"/> <!-- Floor/lower wall -->
  <rect x="0" y="140" width="240" height="20" fill="#2a3a4f"/> <!-- Wall trim/baseboard -->

  <!-- Shelf on wall -->
  <rect x="150" y="30" width="60" height="5" rx="2" fill="#3a4a5f"/>
  <circle cx="160" cy="40" r="5" fill="#10b981"/> <!-- Small plant pot -->
  <rect x="175" y="35" width="15" height="10" rx="2" fill="#fb923c"/> <!-- Small book -->
  <rect x="195" y="35" width="10" height="15" rx="2" fill="#38bdf8"/> <!-- Another small book -->

  <!-- Desk -->
  <rect x="40" y="130" width="160" height="10" rx="4" fill="#3a4a5f"/> <!-- Desk surface -->
  <rect x="45" y="140" width="150" height="60" rx="4" fill="#2a3a4f"/> <!-- Desk legs/body -->

  <!-- Computer Monitor -->
  <rect x="75" y="60" width="90" height="60" rx="6" fill="#2a3a4f"/> <!-- Monitor stand/base -->
  <rect x="80" y="40" width="80" height="50" rx="4" fill="#1a2a3f"/> <!-- Monitor frame -->
  <rect x="85" y="45" width="70" height="40" rx="2" fill="#0f172a"/> <!-- Monitor screen background -->
  <!-- Screen content: A design interface with a small element being refined -->
  <rect x="87" y="47" width="66" height="36" rx="1" fill="#1e293b"/>
  <rect x="90" y="50" width="10" height="4" fill="#38bdf8"/> <!-- Header bar element -->
  <rect x="105" y="50" width="20" height="4" fill="#10b981"/> <!-- Another header element -->
  <rect x="90" y="58" width="58" height="20" rx="2" fill="#2a3a4f"/> <!-- Main content area -->
  <rect x="95" y="62" width="48" height="12" rx="1" fill="#3a4a5f"/> <!-- A larger element on screen -->
  <!-- The element being refined - a small button/icon -->
  <rect x="110" y="65" width="10" height="6" rx="1" fill="#fbbf24"/> <!-- The element itself -->
  <!-- Subtle grid lines or guides around the refined element to show precision -->
  <line x1="108" y1="68" x2="122" y2="68" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="1 1"/>
  <line x1="115" y1="63" x2="115" y2="72" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="1 1"/>
  <!-- A subtle glow around the refined element -->
  <circle cx="115" cy="68" r="8" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.4"/>

  <!-- Keyboard -->
  <rect x="70" y="105" width="40" height="10" rx="2" fill="#2a3a4f"/>
  <!-- Mouse -->
  <rect x="120" y="108" width="15" height="8" rx="3" fill="#2a3a4f"/>
  <circle cx="127.5" cy="112" r="2" fill="#38bdf8"/> <!-- Mouse scroll wheel/button -->

  <!-- Character (He) -->
  <!-- Body -->
  <path d="M120 125 C115 118 105 115 98 120 L95 140 L145 140 L142 120 C135 115 125 118 120 125 Z" fill="#3a4a5f"/> <!-- Torso/shirt -->
  <!-- Arms -->
  <path d="M105 128 Q100 135 98 145 L95 150 L90 150 L93 145 Q98 135 103 128 Z" fill="#3a4a5f"/> <!-- Left arm -->
  <path d="M135 128 Q140 135 142 145 L145 150 L150 150 L147 145 Q142 135 137 128 Z" fill="#3a4a5f"/> <!-- Right arm -->
  <!-- Hands (on mouse) -->
  <path d="M120 115 C122 110 128 108 133 110 C135 112 135 115 133 117 C130 118 125 118 120 115 Z" fill="#fbbf24"/> <!-- Right hand -->
  <!-- Head -->
  <circle cx="120" cy="100" r="15" fill="#fbbf24"/> <!-- Face -->
  <!-- Hair -->
  <path d="M108 90 C100 87 100 78 110 73 C120 68 130 68 132 78 C135 88 130 90 125 90 Z" fill="#2a3a4f"/>
  <!-- Eyes (focused) -->
  <circle cx="115" cy="95" r="1.5" fill="#0f172a"/>
  <circle cx="125" cy="95" r="1.5" fill="#0f172a"/>
  <!-- Eyebrows (slightly furrowed in concentration) -->
  <path d="M113 92 Q115 91 117 92" stroke="#0f172a" stroke-width="1" stroke-linecap="round"/>
  <path d="M123 92 Q125 91 127 92" stroke="#0f172a" stroke-width="1" stroke-linecap="round"/>
  <!-- Mouth (neutral/focused) -->
  <path d="M118 102 Q120 103 122 102" stroke="#0f172a" stroke-width="1" stroke-linecap="round"/>

  <!-- Chair -->
  <rect x="100" y="140" width="40" height="50" rx="8" fill="#2a3a4f"/> <!-- Chair back -->
  <rect x="95" y="180" width="50" height="10" rx="4" fill="#3a4a5f"/> <!-- Chair seat -->
  <rect x="110" y="190" width="20" height="20" rx="4" fill="#2a3a4f"/> <!-- Chair base -->

  <!-- Subtle light glow from screen onto character/desk -->
  <ellipse cx="120" cy="110" rx="30" ry="20" fill="#38bdf8" opacity="0.1"/>
  <ellipse cx="120" cy="135" rx="40" ry="15" fill="#38bdf8" opacity="0.05"/>

</svg>