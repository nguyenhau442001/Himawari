<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ticketMachine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Details: Interior Wall & Floor -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" />
  
  <!-- Wall Poster / Guide Sign (Abstract directional queue art) -->
  <rect x="180" y="35" width="40" height="60" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <circle cx="200" cy="50" r="8" fill="#38bdf8" />
  <rect x="190" y="65" width="20" height="4" rx="2" fill="#94a3b8" />
  <rect x="190" y="75" width="15" height="4" rx="2" fill="#94a3b8" />

  <!-- Floor Queue Markers / Footsteps indicating Order (次序) -->
  <g opacity="0.5">
    <!-- Step 1 -->
    <path d="M50 190 C48 185 52 180 55 180 C58 180 62 185 60 190 Z" fill="#38bdf8" />
    <circle cx="53" cy="177" r="2" fill="#38bdf8" />
    <circle cx="57" cy="177" r="2" fill="#38bdf8" />
    <!-- Step 2 -->
    <path d="M90 195 C88 190 92 185 95 185 C98 185 102 190 100 195 Z" fill="#38bdf8" />
    <circle cx="93" cy="182" r="2" fill="#38bdf8" />
    <circle cx="97" cy="182" r="2" fill="#38bdf8" />
    <!-- Step 3 -->
    <path d="M130 200 C128 195 132 190 135 190 C138 190 142 195 140 200 Z" fill="#38bdf8" />
    <circle cx="133" cy="187" r="2" fill="#38bdf8" />
    <circle cx="137" cy="187" r="2" fill="#38bdf8" />
  </g>

  <!-- Queue Barrier Stanchion / Pole -->
  <rect x="25" y="110" width="6" height="65" fill="#94a3b8" />
  <ellipse cx="28" cy="175" rx="10" ry="4" fill="#64748b" />
  <circle cx="28" cy="110" r="5" fill="#cbd5e1" />
  <path d="M28 115 Q80 135 140 125" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2" />

  <!-- Ticket Kiosk Machine (Context Prop) -->
  <rect x="180" y="90" width="45" height="75" rx="6" fill="url(#ticketMachine)" />
  <rect x="190" y="100" width="25" height="18" rx="2" fill="#0f172a" />
  <circle cx="202.5" cy="109" r="5" fill="#38bdf8" />
  <rect x="195" y="125" width="15" height="10" rx="1" fill="#fbbf24" />
  <!-- Ticket slot -->
  <rect x="192" y="150" width="20" height="4" rx="2" fill="#0f172a" />

  <!-- CHARACTER 3 (Back of queue, waiting patiently) -->
  <g transform="translate(115, 75)">
    <!-- Body & Backpack -->
    <rect x="10" y="45" width="18" height="35" rx="5" fill="#10b981" />
    <rect x="7" y="50" width="6" height="25" rx="3" fill="#059669" />
    <!-- Head -->
    <circle cx="19" cy="32" r="10" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M10 32 C10 24 28 24 28 32 C26 28 12 28 10 32 Z" fill="#334155" />
    <!-- Legs -->
    <rect x="12" y="78" width="5" height="25" rx="2.5" fill="#334155" />
    <rect x="21" y="78" width="5" height="25" rx="2.5" fill="#334155" />
  </g>

  <!-- CHARACTER 2 (Middle of queue, orderly pose) -->
  <g transform="translate(75, 70)">
    <!-- Body -->
    <rect x="10" y="45" width="20" height="40" rx="6" fill="#ec4899" />
    <!-- Arms holding bag -->
    <path d="M10 50 L5 65 L10 68" fill="none" stroke="#be185d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Head -->
    <circle cx="20" cy="30" r="11" fill="#fde68a" />
    <!-- Hair (Ponytail) -->
    <circle cx="20" cy="27" r="11" fill="#475569" />
    <path d="M28 25 C35 25 38 32 35 38" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <!-- Legs -->
    <rect x="13" y="83" width="6" height="25" rx="3" fill="#1e293b" />
    <rect x="21" y="83" width="6" height="25" rx="3" fill="#1e293b" />
  </g>

  <!-- CHARACTER 1 (Front of queue, interacting with ticket kiosk/front person) -->
  <g transform="translate(35, 65)">
    <!-- Body -->
    <rect x="12" y="48" width="22" height="42" rx="6" fill="#38bdf8" />
    <!-- Arm reaching forward -->
    <path d="M34 55 Q45 58 48 53" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Head -->
    <circle cx="23" cy="31" r="11" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M13 30 C13 20 33 20 33 30 C30 25 16 25 13 30 Z" fill="#1e293b" />
    <!-- Legs -->
    <rect x="15" y="88" width="6" height="25" rx="3" fill="#334155" />
    <rect x="25" y="88" width="6" height="25" rx="3" fill="#334155" />
  </g>

  <!-- Visual indicator of Order (Sequence numbers floating subtly above characters, replacing text with neat visual dots/pips) -->
  <g fill="#fbbf24">
    <circle cx="58" cy="80" r="6" />
    <text x="58" y="83.5" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>

    <circle cx="98" cy="85" r="6" />
    <text x="98" y="88.5" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>

    <circle cx="138" cy="90" r="6" />
    <text x="138" y="93.5" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">3</text>
  </g>

  <!-- Soft glowing queue progression arrow -->
  <path d="M68 95 Q83 85 93 95" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
  <path d="M108 100 Q123 90 133 100" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
</svg>