<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Medicine Box -->
  <rect x="40" y="120" width="50" height="60" rx="4" fill="#fb923c"/>
  <rect x="45" y="125" width="40" height="15" rx="2" fill="#fff"/>
  
  <!-- Instruction Paper -->
  <path d="M110 100 L190 100 L195 170 L105 170 Z" fill="#f1f5f9"/>
  <line x1="120" y1="115" x2="180" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="125" x2="180" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="135" x2="160" y2="135" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Character: Person reading -->
  <g transform="translate(100, 60)">
    <!-- Head -->
    <circle cx="40" cy="40" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M20 40 Q20 15 40 15 Q60 15 60 40" fill="#475569"/>
    <!-- Glasses -->
    <circle cx="30" cy="40" r="6" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="50" cy="40" r="6" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="36" y1="40" x2="44" y2="40" stroke="#1e293b" stroke-width="2"/>
    <!-- Body -->
    <path d="M15 80 Q40 65 65 80 L70 140 L10 140 Z" fill="#38bdf8"/>
    <!-- Hands holding paper -->
    <rect x="5" y="85" width="15" height="20" rx="5" fill="#fde68a"/>
    <rect x="60" y="85" width="15" height="20" rx="5" fill="#fde68a"/>
  </g>
  
  <!-- Decorative Accent -->
  <circle cx="210" cy="30" r="8" fill="#10b981" opacity="0.6"/>
  <circle cx="30" cy="30" r="5" fill="#ec4899" opacity="0.6"/>
</svg>