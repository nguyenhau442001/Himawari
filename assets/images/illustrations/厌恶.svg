<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background depth elements -->
  <circle cx="120" cy="120" r="80" fill="#222631" opacity="0.6"/>

  <!-- Motion lines indicating recoil/rejection -->
  <g stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="75" y1="105" x2="55" y2="95" />
    <line x1="70" y1="125" x2="45" y2="125" />
    <line x1="75" y1="145" x2="55" y2="155" />
  </g>

  <!-- Rejected object/behavior representation (abstract unpleasant element being pushed away) -->
  <g transform="translate(45, 110)">
    <circle cx="0" cy="10" r="14" fill="#3A4150"/>
    <path d="M-8 2 L8 18 M-8 18 L8 2" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Main character showing disgust/aversion (厌恶) -->
  <g transform="translate(10, 0)">
    <!-- Character Body / Torso -->
    <path d="M 95 190 L 105 145 L 145 145 L 155 190 Z" fill="#2E3440"/>
    
    <!-- Character Neck -->
    <rect x="115" y="130" width="16" height="20" fill="#E5C1A5"/>

    <!-- Character Head turning away -->
    <circle cx="123" cy="105" r="24" fill="#E5C1A5"/>

    <!-- Hair -->
    <path d="M 99 105 C 99 90, 110 80, 130 82 C 145 84, 148 98, 147 110 L 140 110 C 140 98, 135 90, 122 90 C 110 90, 107 98, 107 105 Z" fill="#3B4252"/>

    <!-- Facial expression: Eyes squinted in disgust, mouth grimacing -->
    <!-- Eyebrows angled downward sternly -->
    <line x1="110" y1="100" x2="120" y2="104" stroke="#4C566A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="126" y1="104" x2="136" y2="100" stroke="#4C566A" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Squinted closed eyes -->
    <path d="M 112 110 Q 115 113 118 110" stroke="#2E3440" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 128 110 Q 131 113 134 110" stroke="#2E3440" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Grimacing mouth (turning down) -->
    <path d="M 118 122 Q 123 117 128 122" stroke="#2E3440" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Dynamic Action: Arms pushing away / rejecting -->
    <!-- Back Arm / Shoulder -->
    <path d="M 105 150 L 90 135 L 75 145" fill="none" stroke="#2E3440" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Arm explicitly pushing outward with an open palm -->
    <path d="M 135 150 L 155 135 L 175 125" fill="none" stroke="#E5C1A5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sleeve -->
    <path d="M 135 150 L 150 140" fill="none" stroke="#3B4252" stroke-width="13" stroke-linecap="round"/>

    <!-- Open Palm / Rejection Hand Gesture -->
    <circle cx="178" cy="123" r="8" fill="#E5C1A5"/>
    <path d="M 175 115 L 185 120 L 175 131" stroke="#C49B7A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Focal Accent Spark / Focus Indicator -->
  <circle cx="185" cy="85" r="3" fill="#FFB454" opacity="0.8"/>
  <path d="M 185 75 L 185 95 M 175 85 L 195 85" stroke="#FFB454" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>