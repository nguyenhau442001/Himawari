<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweater-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Thought Bubble Gradient -->
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Bookshelf in background -->
  <rect x="25" y="40" width="80" height="110" rx="4" fill="#0f172a" opacity="0.6" />
  <!-- Empty/sparse shelves -->
  <line x1="25" y1="70" x2="105" y2="70" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="25" y1="105" x2="105" y2="105" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="25" y1="140" x2="105" y2="140" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  
  <!-- Only ONE lonely book on the shelf to visually reinforce "pínfá" (scarce/empty) -->
  <rect x="35" y="52" width="12" height="18" rx="2" fill="#ef4444" />
  <rect x="49" y="50" width="10" height="20" rx="2" fill="#3b82f6" />

  <!-- Room Interior Plant (drooping, sparse) -->
  <path d="M195,140 Q195,115 185,100" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M195,125 Q205,115 210,105" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M185,100 Q175,90 170,85" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <path d="M185,100 Q195,85 190,75" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M210,105 Q220,95 225,90" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  <!-- Pot -->
  <path d="M180,140 L210,140 L205,160 L185,160 Z" fill="#475569" />

  <!-- Desk & Lamp -->
  <rect x="0" y="160" width="240" height="80" fill="#0b0f19" />
  <rect x="15" y="152" width="210" height="10" rx="3" fill="#334155" />

  <!-- Desk Lamp -->
  <circle cx="190" cy="152" r="12" fill="#64748b" />
  <path d="M190,152 L170,95 L180,90 L195,150 Z" fill="#475569" />
  <!-- Lamp Head -->
  <path d="M150,75 C150,65 170,60 185,75 Z" fill="#f59e0b" />
  <!-- Lamp Light Cone -->
  <path d="M165,80 L70,160 L140,160 Z" fill="url(#lamp-glow)" />

  <!-- Laptop on desk -->
  <path d="M80,152 L130,152 L138,135 L72,135 Z" fill="#64748b" />
  <rect x="65" y="152" width="75" height="4" rx="2" fill="#94a3b8" />
  <rect x="78" y="138" width="48" height="12" rx="1" fill="#0f172a" />
  <!-- Blinking cursor / empty screen lines -->
  <line x1="83" y1="144" x2="100" y2="144" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- MAIN CHARACTER: Staring blankly, hand scratching head -->
  <!-- Body / Torso -->
  <path d="M85,185 C85,165 95,152 115,152 C135,152 145,165 145,185 Z" fill="url(#sweater-grad)" />
  <!-- Collar -->
  <path d="M100,152 C100,160 130,160 130,152 C120,155 110,155 100,152 Z" fill="#bae6fd" />

  <!-- Neck -->
  <rect x="105" y="135" width="20" height="22" fill="#fbcfe8" rx="6" />

  <!-- Head -->
  <circle cx="115" cy="118" r="26" fill="#fbcfe8" />
  
  <!-- Hair Style -->
  <path d="M91,115 C91,96 100,90 115,90 C132,90 140,100 140,122 C140,122 135,102 115,102 C96,102 91,115 91,115 Z" fill="#334155" />

  <!-- Facial Features (Puzzled / Blank expression) -->
  <!-- Eyebrows (asymmetrical, puzzled) -->
  <path d="M102,110 Q108,107 113,112" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M120,109 Q126,112 131,109" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes (Wide, blank staring) -->
  <circle cx="108" cy="116" r="3" fill="#1e293b" />
  <circle cx="125" cy="116" r="3" fill="#1e293b" />
  <!-- Eye highlights -->
  <circle cx="109" cy="115" r="1" fill="#ffffff" />
  <circle cx="126" cy="115" r="1" fill="#ffffff" />

  <!-- Nose & Mouth (Flat, slightly open in hesitation) -->
  <path d="M116,120 L118,124 L115,125" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M111,133 Q116,136 121,133" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Arms and Hands -->
  <!-- Right arm resting on desk -->
  <path d="M135,165 Q150,165 155,152" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <circle cx="155" cy="150" r="6" fill="#fbcfe8" />

  <!-- Left arm scratching head -->
  <path d="M95,165 Q75,145 95,115" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <!-- Left Hand scratching head -->
  <circle cx="95" cy="110" r="6" fill="#fbcfe8" />

  <!-- THOUGHT BUBBLE (Visualizing "scarce/empty" knowledge) -->
  <!-- Main Thought Bubble -->
  <path d="M 125,75 
           C 140,75 165,75 165,55 
           C 165,35 140,35 125,35 
           C 110,35 85,35 85,55 
           C 85,75 110,75 125,75 Z" 
        fill="url(#bubble-grad)" stroke="#475569" stroke-width="2" />
  
  <!-- Thought Bubble Trail Circles -->
  <circle cx="110" cy="85" r="4" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <circle cx="102" cy="95" r="2.5" fill="#334155" stroke="#475569" stroke-width="1.5" />

  <!-- Icons inside Thought Bubble representing "Pínfá" (Scarcity/Emptiness of Knowledge) -->
  <!-- A single, lonely question mark representing lack of ideas -->
  <path d="M 118,45 Q 125,38 132,45 Q 135,50 125,58 L 125,62" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="125" cy="67" r="1.5" fill="#f59e0b" />
</svg>