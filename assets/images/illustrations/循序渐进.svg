<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Central Object: A stepped, rising architectural/book platform structure representing progressive, orderly advancement (循序渐进) -->
  
  <!-- Ambient background glow/grid hints to emphasize structure -->
  <path d="M40 190 L200 190" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Step 1 (Lowest, Base) -->
  <g>
    <!-- Shadow/Depth -->
    <path d="M60 170 L100 150 L140 170 L100 190 Z" fill="#242B38"/>
    <!-- Front Face -->
    <path d="M60 170 L100 190 L100 205 L60 185 Z" fill="#3B4252"/>
    <!-- Right Face -->
    <path d="M100 190 L140 170 L140 185 L100 205 Z" fill="#2E3440"/>
    <!-- Top Face -->
    <path d="M60 170 L100 150 L140 170 L100 190 Z" fill="#4C566A"/>
    <!-- Icon/Marker on step 1: Base indicator (circle) -->
    <circle cx="100" cy="170" r="6" fill="#D08770"/>
  </g>

  <!-- Step 2 (Middle) -->
  <g>
    <!-- Shadow/Depth -->
    <path d="M90 135 L130 115 L170 135 L130 155 Z" fill="#2E3440"/>
    <!-- Front Face -->
    <path d="M90 135 L130 155 L130 170 L90 150 Z" fill="#4C566A"/>
    <!-- Right Face -->
    <path d="M130 155 L170 135 L170 150 L130 170 Z" fill="#3B4252"/>
    <!-- Top Face -->
    <path d="M90 135 L130 115 L170 135 L130 155 Z" fill="#5E687D"/>
    <!-- Icon/Marker on step 2 -->
    <circle cx="130" cy="135" r="6" fill="#EBCB8B"/>
  </g>

  <!-- Step 3 (Highest, Peak) -->
  <g>
    <!-- Shadow/Depth -->
    <path d="M120 100 L160 80 L200 100 L160 120 Z" fill="#3B4252"/>
    <!-- Front Face -->
    <path d="M120 100 L160 120 L160 135 L120 115 Z" fill="#5E687D"/>
    <!-- Right Face -->
    <path d="M160 120 L200 100 L200 115 L160 135 Z" fill="#4C566A"/>
    <!-- Top Face -->
    <path d="M120 100 L160 80 L200 100 L160 120 Z" fill="#88C0D0"/>
    <!-- Icon/Marker on step 3 (Goal/Success) -->
    <circle cx="160" cy="100" r="6" fill="#A3BE8C"/>
  </g>

  <!-- Connecting Ascending Path / Arrow Flow Overlay -->
  <path d="M100 170 Q 115 152 130 135 Q 145 117 160 100" fill="none" stroke="#EBCB8B" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Ground connection markers for orderly progression -->
  <line x1="60" y1="185" x2="60" y2="195" stroke="#4C566A" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="150" x2="90" y2="160" stroke="#5E687D" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="115" x2="120" y2="125" stroke="#88C0D0" stroke-width="3" stroke-linecap="round"/>

</svg>