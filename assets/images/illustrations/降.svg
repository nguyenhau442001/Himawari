<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow to enhance sleek modern look -->
  <circle cx="120" cy="130" r="70" fill="#222730" opacity="0.6"/>
  
  <!-- Falling motion trail lines -->
  <g stroke="#3A4252" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="95" y1="50" x2="95" y2="75" stroke-dasharray="4 4"/>
    <line x1="145" y1="60" x2="145" y2="90" stroke-dasharray="4 4"/>
  </g>

  <!-- Ground / Reference Line -->
  <line x1="60" y1="185" x2="180" y2="185" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Object: A physical descending thermometer (Noun: physical object representing temperature drop) -->
  <g id="thermometer">
    <!-- Outer glass tube casing -->
    <rect x="110" y="55" width="20" height="115" rx="10" fill="#2A313E" stroke="#4A5568" stroke-width="3"/>
    
    <!-- Bulb at bottom -->
    <circle cx="120" cy="165" r="16" fill="#2A313E" stroke="#4A5568" stroke-width="3"/>
    
    <!-- Liquid inside bulb -->
    <circle cx="120" cy="165" r="10" fill="#F59E0B"/>
    
    <!-- Lowered liquid column (representing 降 / dropping temperature) -->
    <rect x="114" y="125" width="12" height="40" rx="4" fill="#F59E0B"/>
    
    <!-- Temperature Scale Ticks -->
    <g stroke="#64748B" stroke-width="2" stroke-linecap="round">
      <line x1="126" y1="75" x2="132" y2="75"/>
      <line x1="126" y1="95" x2="132" y2="95"/>
      <line x1="126" y1="115" x2="132" y2="115"/>
      <line x1="126" y1="135" x2="132" y2="135"/>
      <line x1="126" y1="155" x2="132" y2="155"/>
    </g>
  </g>

  <!-- Prominent Downward Action Arrow (Visualizing the exact semantic meaning: to lower/drop) -->
  <g>
    <path d="M 120 70 L 120 135" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 104 120 L 120 140 L 136 120" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>