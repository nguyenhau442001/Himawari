<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Podium Base -->
  <path d="M50 190 L190 190 L180 205 L60 205 Z" fill="#2A2F3D"/>
  
  <!-- 3rd Place Podium (Left) -->
  <rect x="55" y="145" width="40" height="45" fill="#323846" rx="2"/>
  <text x="75" y="172" font-family="sans-serif" font-weight="bold" font-size="16" fill="#8C95A7" text-anchor="middle">3</text>

  <!-- 1st Place Podium (Center - taller, shifted slightly back/styled for 2nd place focus) -->
  <rect x="100" y="110" width="40" height="80" fill="#323846" rx="2"/>
  <text x="120" y="155" font-family="sans-serif" font-weight="bold" font-size="16" fill="#8C95A7" text-anchor="middle">1</text>

  <!-- 2nd Place Podium (Right - Highlighted / Á quân) -->
  <rect x="145" y="125" width="40" height="65" fill="#2E3748" rx="2"/>
  <rect x="143" y="123" width="44" height="4" fill="#F59E0B" rx="1"/>
  <text x="165" y="162" font-family="sans-serif" font-weight="bold" font-size="18" fill="#F59E0B" text-anchor="middle">2</text>

  <!-- Silver Trophy (Centered directly on the 2nd Place Podium) -->
  <g transform="translate(165, 82)">
    <!-- Trophy Handles -->
    <path d="M -10 12 C -22 12 -22 30 -10 35" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 10 12 C 22 12 22 30 10 35" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Trophy Cup -->
    <path d="M -12 5 L 12 5 L 9 32 C 9 38 -9 38 -9 32 Z" fill="#CBD5E1"/>
    <path d="M -12 5 L 12 5 L 10 12 L -10 12 Z" fill="#E2E8F0"/>
    
    <!-- Inner Cup Shade -->
    <ellipse cx="0" cy="5" rx="12" ry="3" fill="#94A3B8"/>

    <!-- Trophy Stem & Base -->
    <rect x="-3" y="38" width="6" height="12" fill="#94A3B8"/>
    <rect x="-10" y="50" width="20" height="6" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Silver Medal Hanging on the 2nd place podium front -->
  <g transform="translate(165, 138)">
    <polygon points="0,0 -8,-15 8,-15" fill="#3B82F6"/>
    <circle cx="0" cy="8" r="9" fill="#E2E8F0"/>
    <circle cx="0" cy="8" r="6" fill="#94A3B8"/>
    <text x="0" y="12" font-family="sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <!-- Subtle ambient decorative elements (Sparkles/Focus) -->
  <path d="M 195 65 L 198 75 L 208 78 L 198 81 L 195 91 L 192 81 L 182 78 L 192 75 Z" fill="#F59E0B" opacity="0.8"/>
  <path d="M 45 105 L 47 111 L 53 113 L 47 115 L 45 121 L 43 115 L 37 113 L 43 111 Z" fill="#94A3B8" opacity="0.4"/>
</svg>