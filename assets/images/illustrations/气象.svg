<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- TV Screen Glow -->
    <radialGradient id="tv-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Rain Gradient -->
    <linearGradient id="rain-grad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- INTERIOR ENVIRONMENT -->
  <!-- Wallpaper Pattern / Accent Wall -->
  <path d="M0 0 H240 V170 H0 Z" fill="#1e293b"/>
  
  <!-- Warm Ambient Light from TV -->
  <circle cx="120" cy="95" r="80" fill="url(#tv-glow)"/>

  <!-- Window Showing Tomorrow's Rain (Context for 气象预报说明天有雨) -->
  <g transform="translate(170, 45)">
    <rect x="0" y="0" width="45" height="75" rx="4" fill="#0b1329" stroke="#334155" stroke-width="3"/>
    <!-- Window Pane Divider -->
    <line x1="22.5" y1="0" x2="22.5" y2="75" stroke="#334155" stroke-width="2"/>
    <!-- Raindrops on Window -->
    <line x1="8" y1="15" x2="6" y2="25" stroke="url(#rain-grad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="35" x2="14" y2="45" stroke="url(#rain-grad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="20" x2="30" y2="30" stroke="url(#rain-grad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="38" y1="50" x2="36" y2="60" stroke="url(#rain-grad)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Subtle cloud outside -->
    <path d="M12 15 Q15 10 20 12 Q25 8 32 12 Q38 10 40 16 Z" fill="#475569" opacity="0.4"/>
  </g>

  <!-- Living Room Furniture: TV Stand & Television -->
  <!-- TV Stand -->
  <rect x="70" y="130" width="100" height="30" rx="4" fill="#334155" filter="url(#shadow)"/>
  <rect x="85" y="140" width="70" height="15" fill="#1e293b" rx="2"/>
  <!-- Plant on Stand -->
  <circle cx="80" cy="122" r="8" fill="#10b981"/>
  <path d="M75 125 Q80 110 85 125 Z" fill="#059669"/>

  <!-- TV Set (Weather Forecast Display) -->
  <rect x="75" y="55" width="90" height="75" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <!-- TV Screen Inner -->
  <rect x="81" y="61" width="78" height="55" rx="4" fill="#1e293b"/>
  <!-- Weather Forecast Graphics on Screen: Sun turning to Rain Cloud -->
  <circle cx="105" cy="82" r="10" fill="#fbbf24"/>
  <!-- Animated Arrow / Transition -->
  <path d="M118 82 L128 82 M124 78 L128 82 L124 86" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rain Cloud Icon on Screen -->
  <path d="M136 85 C136 81 142 77 147 80 C151 77 157 81 157 85 C160 85 162 88 162 91 C162 94 160 96 157 96 L136 96 C133 96 131 94 131 91 C131 88 133 85 136 85 Z" fill="#38bdf8"/>
  <!-- Raindrops falling from cloud on screen -->
  <line x1="138" y1="100" x2="136" y2="105" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="146" y1="100" x2="144" y2="105" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="154" y1="100" x2="152" y2="105" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- TV Stand Base -->
  <path d="M110 130 L120 116 L130 130 Z" fill="#475569"/>

  <!-- Foreground Floor -->
  <rect x="0" y="170" width="240" height="70" fill="url(#floor-grad)"/>
  <!-- Floorboard detail -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- MAIN CHARACTER & PROP (Person preparing umbrella / watching weather forecast) -->
  <g transform="translate(30, 105)" filter="url(#shadow)">
    <!-- Sofa/Armchair Base -->
    <path d="M-10 40 Q5 35 25 40 L35 75 Q12 80 -10 75 Z" fill="#3b82f6" rx="6"/>
    <rect x="-15" y="30" width="50" height="20" rx="8" fill="#60a5fa"/>

    <!-- Character Body -->
    <!-- Legs -->
    <rect x="5" y="55" width="10" height="25" rx="4" fill="#334155"/>
    <rect x="18" y="55" width="10" height="25" rx="4" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="9" cy="80" rx="7" ry="4" fill="#f8fafc"/>
    <ellipse cx="23" cy="80" rx="7" ry="4" fill="#f8fafc"/>

    <!-- Torso (Wearing cozy sweater) -->
    <path d="M2 15 Q22 10 36 20 L32 55 Q17 60 2 55 Z" fill="#ec4899"/>
    
    <!-- Arms gesturing towards TV -->
    <!-- Left arm holding/resting -->
    <path d="M4 22 Q-5 30 5 40" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
    <!-- Right arm pointing or holding prop -->
    <path d="M34 25 Q46 32 38 45" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>

    <!-- Head & Face -->
    <circle cx="21" cy="-3" r="14" fill="#ffedd5"/>
    <!-- Hair (Stylized modern cut) -->
    <path d="M7 -7 Q21 -22 33 -5 Q30 -14 21 -15 Q12 -14 7 -7 Z" fill="#334155"/>
    <!-- Facial expression: surprised/realizing ("Ah, it will rain tomorrow!") -->
    <circle cx="17" cy="-3" r="1.5" fill="#1e293b"/>
    <circle cx="25" cy="-3" r="1.5" fill="#1e293b"/>
    <!-- Open surprised mouth -->
    <ellipse cx="21" cy="4" rx="2.5" ry="3.5" fill="#991b1b"/>
    <!-- Rosy cheeks -->
    <circle cx="15" cy="1" r="2.5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="27" cy="1" r="2.5" fill="#fca5a5" opacity="0.6"/>
  </g>

  <!-- CRUCIAL PROP: Umbrellas ready by the door/couch (Visualizing "有雨") -->
  <g transform="translate(15, 115)" filter="url(#shadow)">
    <!-- Umbrella Stand / Bucket -->
    <path d="M5 30 L15 30 L13 65 L7 65 Z" fill="#64748b"/>
    <ellipse cx="10" cy="30" rx="5" ry="2" fill="#94a3b8"/>
    
    <!-- Red Umbrella Handle sticking out -->
    <path d="M8 30 L-2 -15" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Umbrella Canopy folded -->
    <path d="M-2 -15 Q-4 -20 -1 -23 Q2 -20 0 -15" fill="#ef4444"/>
    
    <!-- Blue Umbrella Handle sticking out -->
    <path d="M12 30 L22 -10" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 -10 Q20 -15 23 -18 Q26 -15 24 -10" fill="#3b82f6"/>
  </g>

  <!-- Ambient lighting sparkles / warm atmosphere -->
  <circle cx="105" cy="35" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="135" cy="25" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="210" cy="140" r="1.5" fill="#fbbf24" opacity="0.5"/>
</svg>