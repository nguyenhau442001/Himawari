<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background subtle guide curves representing motion/stretch -->
    <path d="M 60 120 Q 120 70 180 120" fill="none" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 60 120 Q 120 170 180 120" fill="none" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Left anchor / wall -->
    <rect x="35" y="90" width="12" height="60" rx="3" fill="#4A5568"/>
    <line x1="38" y1="95" x2="38" y2="145" stroke="#2D3748" stroke-width="2"/>

    <!-- Right anchor / wall -->
    <rect x="193" y="90" width="12" height="60" rx="3" fill="#4A5568"/>
    <line x1="202" y1="95" x2="202" y2="145" stroke="#2D3748" stroke-width="2"/>

    <!-- Stretched Spring / Elastic element in glowing orange/gold (focus accent) -->
    <path d="M 47 120 
             L 57 100, 77 140, 97 100, 117 140, 137 100, 157 140, 177 100, 187 120" 
          fill="none" 
          stroke="#F6AD55" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center core / object being suspended/elastic -->
    <circle cx="117" cy="120" r="14" fill="#1A1D24" stroke="#F6AD55" stroke-width="4"/>
    <circle cx="117" cy="120" r="6" fill="#E2E8F0"/>

    <!-- Directional arrows indicating elasticity (compression and tension) -->
    <!-- Left arrows -->
    <g transform="translate(15, 0)">
      <path d="M 22 120 L 32 113 L 32 127 Z" fill="#63B3ED"/>
    </g>
    <!-- Right arrows -->
    <g transform="translate(211, 0) scale(-1, 1) translate(-240, 0)">
      <path d="M 22 120 L 32 113 L 32 127 Z" fill="#63B3ED"/>
    </g>
  </g>
</svg>