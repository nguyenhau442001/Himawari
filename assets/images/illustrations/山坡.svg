<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/ambient elements -->
  <circle cx="180" cy="70" r="40" fill="#252A34" opacity="0.6"/>
  <circle cx="70" cy="180" r="50" fill="#252A34" opacity="0.4"/>

  <!-- Conceptual illustration for 山坡 (shānpō - hillside/slope) -->
  <g>
    <!-- Distant mountains / background peaks -->
    <polygon points="120,70 170,120 70,120" fill="#222730"/>
    <polygon points="160,85 210,150 110,150" fill="#282D3A"/>

    <!-- Main Hillside (山坡) - Sleek flat vector design -->
    <!-- The sloping ground surface -->
    <path d="M20,180 C80,175 140,140 220,100 L220,210 L20,210 Z" fill="#2D3545"/>
    <path d="M20,180 C80,175 140,140 220,100 L220,115 C140,155 80,190 20,195 Z" fill="#3B4459"/>

    <!-- High-contrast accent layer representing the distinct slope surface -->
    <path d="M25,182 C82,177 138,143 215,103 L218,109 C141,149 83,183 25,188 Z" fill="#F5A623" opacity="0.3"/>

    <!-- Distinct tree on the hillside to give scale and depth -->
    <!-- Tree 1 -->
    <rect x="75" y="145" width="4" height="20" fill="#1A1D24"/>
    <circle cx="77" cy="140" r="10" fill="#3B7A57"/>
    <circle cx="74" cy="135" r="8" fill="#4A936C"/>

    <!-- Tree 2 -->
    <rect x="145" y="125" width="5" height="25" fill="#1A1D24"/>
    <circle cx="147" cy="118" r="12" fill="#4A936C"/>
    <circle cx="151" cy="114" r="9" fill="#5AA87E"/>

    <!-- Small accent shrub -->
    <circle cx="110" cy="162" r="6" fill="#3B7A57"/>
    <circle cx="114" cy="164" r="5" fill="#4A936C"/>

    <!-- Focal golden glowing accent sun/moon positioned neatly over the slope -->
    <circle cx="180" cy="65" r="18" fill="#F5A623"/>
    
    <!-- Minimalist terrain contour lines for modern design feel -->
    <path d="M40,198 C80,195 120,180 160,155" stroke="#F5A623" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M60,203 C100,200 150,185 190,165" stroke="#4A936C" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>