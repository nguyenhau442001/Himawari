<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/lines representing measurement -->
  <line x1="60" y1="40" x2="60" y2="200" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="180" y1="40" x2="180" y2="200" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Height measurement scale pillar (Right side) -->
  <rect x="175" y="50" width="10" height="150" rx="3" fill="#2E3548"/>
  <line x1="175" y1="70" x2="182" y2="70" stroke="#4E5973" stroke-width="1.5"/>
  <line x1="175" y1="90" x2="182" y2="90" stroke="#4E5973" stroke-width="1.5"/>
  <line x1="175" y1="110" x2="185" y2="110" stroke="#F59E0B" stroke-width="2"/>
  <line x1="175" y1="130" x2="182" y2="130" stroke="#4E5973" stroke-width="1.5"/>
  <line x1="175" y1="150" x2="182" y2="150" stroke="#4E5973" stroke-width="1.5"/>
  <line x1="175" y1="170" x2="182" y2="170" stroke="#4E5973" stroke-width="1.5"/>

  <!-- Measurement indicator brackets / height line -->
  <line x1="95" y1="65" x2="185" y2="65" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="105,70 95,65 105,60" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <line x1="95" y1="190" x2="155" y2="190" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="105,195 95,190 105,185" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <line x1="95" y1="65" x2="95" y2="190" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Central Human Character representing 身高 (Height) -->
  <!-- Head -->
  <circle cx="135" cy="78" r="14" fill="#38BDF8"/>
  
  <!-- Hair -->
  <path d="M121 75 C122 66, 131 63, 142 66 C148 68, 149 74, 149 74 Z" fill="#0EA5E9"/>

  <!-- Torso & Upper Body -->
  <path d="M121 92 C121 92, 135 90, 149 92 C154 115, 156 145, 156 145 C156 145, 148 148, 135 148 C122 148, 114 145, 114 145 C114 145, 116 115, 121 92 Z" fill="#38BDF8"/>
  
  <!-- Outfit Details (Modern Flat Style) -->
  <path d="M127 92 L135 110 L143 92" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Legs -->
  <rect x="123" y="145" width="10" height="45" rx="4" fill="#0EA5E9"/>
  <rect x="137" y="145" width="10" height="45" rx="4" fill="#0EA5E9"/>

  <!-- Shoes -->
  <path d="M119 190 L133 190 C135 190, 135 194, 133 194 L119 194 C117 194, 117 190, 119 190 Z" fill="#94A3B8"/>
  <path d="M137 190 L151 190 C153 190, 153 194, 151 194 L137 194 C135 194, 135 190, 137 190 Z" fill="#94A3B8"/>

</svg>