  <path d="M120 180 C 120 140, 120 120, 120 90" stroke="#4CAF50" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M120 180 C 125 150, 130 130, 130 100" stroke="#4CAF50" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Leaves -->
  <path d="M110 130 Q 100 120, 95 135 Q 105 135, 110 130" fill="#2E7D32"/>
  <path d="M130 140 Q 140 130, 145 145 Q 135 145, 130 140" fill="#2E7D32"/>

