<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground Plane -->
  <path d="M40 180 L200 180" stroke="#3A3F4B" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Figures emerging (涌现) -->
  <!-- Figure 1 (Center) -->
  <g transform="translate(120, 170)">
    <circle cx="0" cy="-60" r="12" fill="#FFB84D"/>
    <path d="M-15 -45 L15 -45 L10 -10 L-10 -10 Z" fill="#FFB84D"/>
    <path d="M-5 -10 L-8 10 M5 -10 L8 10" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <!-- Motion lines -->
    <path d="M0 -80 L0 -100" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- Figure 2 (Left) -->
  <g transform="translate(70, 170)">
    <circle cx="0" cy="-45" r="10" fill="#FFD699"/>
    <path d="M-12 -35 L12 -35 L8 -5 L-8 -5 Z" fill="#FFD699"/>
    <path d="M-4 -5 L-6 10 M4 -5 L6 10" stroke="#FFD699" stroke-width="3" stroke-linecap="round"/>
    <!-- Motion lines -->
    <path d="M0 -60 L0 -75" stroke="#FFD699" stroke-width="2" stroke-dasharray="3 3" opacity="0.5"/>
  </g>

  <!-- Figure 3 (Right) -->
  <g transform="translate(170, 170)">
    <circle cx="0" cy="-45" r="10" fill="#FFD699"/>
    <path d="M-12 -35 L12 -35 L8 -5 L-8 -5 Z" fill="#FFD699"/>
    <path d="M-4 -5 L-6 10 M4 -5 L6 10" stroke="#FFD699" stroke-width="3" stroke-linecap="round"/>
    <!-- Motion lines -->
    <path d="M0 -60 L0 -75" stroke="#FFD699" stroke-width="2" stroke-dasharray="3 3" opacity="0.5"/>
  </g>

  <!-- Secondary background figures (faint) -->
  <g transform="translate(40, 170)" opacity="0.3">
    <circle cx="0" cy="-30" r="8" fill="#4A5568"/>
    <path d="M-8 -22 L8 -22 L5 0 L-5 0 Z" fill="#4A5568"/>
  </g>
  <g transform="translate(200, 170)" opacity="0.3">
    <circle cx="0" cy="-30" r="8" fill="#4A5568"/>
    <path d="M-8 -22 L8 -22 L5 0 L-5 0 Z" fill="#4A5568"/>
  </g>
</svg>