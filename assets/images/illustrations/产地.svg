<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glows/elements -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Map / Location pin base -->
  <!-- Stylized mountain / origin landscape icon representation -->
  <path d="M70 160 L100 120 L130 160 Z" fill="#2D3748"/>
  <path d="M110 160 L145 105 L180 160 Z" fill="#3E4C59"/>
  
  <!-- Tea plant / agricultural product springing from the origin -->
  <path d="M145 105 L145 160" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Leaves / Agriculture symbol -->
  <path d="M145 125 C130 120 120 130 125 140 C135 145 145 135 145 125 Z" fill="#48BB78"/>
  <path d="M145 110 C160 105 170 115 165 125 C155 130 145 120 145 110 Z" fill="#38A169"/>

  <!-- Sleek Modern Package / Tea Box (representing 包装盒 / 原产地 context) -->
  <g transform="translate(65, 85)">
    <!-- Box Body -->
    <rect x="0" y="30" width="60" height="70" rx="4" fill="#2D3748"/>
    <!-- Box Front Face Lighter shade -->
    <path d="M10 30 L50 30 L50 100 L10 100 Z" fill="#374151"/>
    <!-- Box Lid / Top -->
    <polygon points="5,30 30,15 55,30" fill="#4B5563"/>
    <polygon points="10,30 30,18 50,30" fill="#6B7280"/>
    
    <!-- Accent Gold Stamp / Origin Mark on Box (Focus point) -->
    <circle cx="30" cy="65" r="14" fill="#1F2937"/>
    <circle cx="30" cy="65" r="10" fill="#F59E0B"/>
    <!-- Star/Origin icon inside stamp -->
    <polygon points="30,58 32,63 37,63 33,66 35,71 30,68 25,71 27,66 23,63 28,63" fill="#1F2937"/>
  </g>

  <!-- Large Location Pin overlaying the origin/box -->
  <g filter="drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.4))">
    <path d="M120 45 C101.22 45 86 60.22 86 79 C86 103.75 120 135 120 135 C120 135 154 103.75 154 79 C154 60.22 138.78 45 120 45 Z" fill="#F59E0B"/>
    <circle cx="120" cy="77" r="12" fill="#1A1D24"/>
  </g>

</svg>