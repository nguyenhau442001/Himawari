<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle grid/lines for structure -->
  <path d="M 60 40 L 60 200 M 120 40 L 120 200 M 180 40 L 180 200" stroke="#252A34" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Central Physical Object representing "条理" (Structured Filing Cabinet / Organized Folders) -->
  <g transform="translate(45, 45)">
    <!-- Main Cabinet Body -->
    <rect x="15" y="10" width="120" height="130" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Top Drawer (Slightly open/active to show order) -->
    <rect x="25" y="22" width="100" height="32" rx="4" fill="#3182CE" opacity="0.9"/>
    <circle cx="75" cy="38" r="3" fill="#E2E8F0"/>
    
    <!-- Papers perfectly ordered inside top drawer -->
    <rect x="35" y="14" width="80" height="10" rx="2" fill="#E2E8F0" opacity="0.9"/>
    <rect x="40" y="10" width="70" height="6" rx="2" fill="#CBD5E0" opacity="0.7"/>

    <!-- Middle Drawer -->
    <rect x="25" y="62" width="100" height="32" rx="4" fill="#2B6CB0" opacity="0.9"/>
    <circle cx="75" cy="78" r="3" fill="#E2E8F0"/>
    <line x1="45" y1="78" x2="60" y2="78" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Bottom Drawer -->
    <rect x="25" y="102" width="100" height="32" rx="4" fill="#2B6CB0" opacity="0.9"/>
    <circle cx="75" cy="118" r="3" fill="#E2E8F0"/>
    <line x1="45" y1="118" x2="60" y2="118" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Accent Focus: Glowing Organized Checkmark / Flow Lines -->
  <g transform="translate(130, 85)">
    <circle cx="35" cy="35" r="24" fill="#DD6B20" opacity="0.2"/>
    <circle cx="35" cy="35" r="18" fill="#DD6B20"/>
    <!-- Checkmark icon -->
    <path d="M 27 35 L 32 40 L 44 28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sequential flow indicators (Nodes showing systematic order) -->
  <g transform="translate(30, 185)">
    <line x1="10" y1="0" x2="170" y2="0" stroke="#4A5568" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="20" cy="0" r="5" fill="#3182CE"/>
    <circle cx="70" cy="0" r="5" fill="#3182CE"/>
    <circle cx="120" cy="0" r="5" fill="#3182CE"/>
    <circle cx="170" cy="0" r="5" fill="#DD6B20"/>
  </g>
</svg>