<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Person 1 (The Impulsive One) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="25" fill="#fb923c"/>
    <path d="M5 35 Q20 45 35 35" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="10" cy="15" r="3" fill="#0f172a"/>
    <circle cx="30" cy="15" r="3" fill="#0f172a"/>
    <rect x="5" y="60" width="30" height="80" rx="5" fill="#fb923c"/>
    <rect x="0" y="70" width="10" height="40" rx="3" fill="#fb923c" transform="rotate(-20 5 70)"/>
    <rect x="30" y="70" width="10" height="40" rx="3" fill="#fb923c" transform="rotate(20 40 70)"/>
  </g>
  
  <!-- Person 2 (The Calming One) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="25" fill="#38bdf8"/>
    <path d="M10 35 Q20 30 30 35" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="10" cy="15" r="3" fill="#0f172a"/>
    <circle cx="30" cy="15" r="3" fill="#0f172a"/>
    <rect x="5" y="45" width="30" height="95" rx="5" fill="#38bdf8"/>
    <path d="M5 50 L-10 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M35 50 L50 80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Context Props -->
  <rect x="150" y="130" width="40" height="30" rx="4" fill="#f59e0b"/>
  <circle cx="170" cy="145" r="8" fill="#1e293b"/>
  
  <path d="M80 150 L100 150 L90 130 Z" fill="#ec4899"/>
  
  <!-- Floating "Cool Down" Particles -->
  <circle cx="100" cy="60" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="110" cy="50" r="2" fill="#10b981" opacity="0.4"/>
  <circle cx="90" cy="55" r="3" fill="#10b981" opacity="0.5"/>
</svg>