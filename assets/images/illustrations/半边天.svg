<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Definitions for Gradients & Clipping -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22304A"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#118AB2"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="120" cy="115" r="75"/>
    </clipPath>
  </defs>

  <!-- Background decorative globe / split circle -->
  <circle cx="120" cy="115" r="75" fill="url(#skyGrad)" stroke="#2C3E50" stroke-width="2"/>

  <!-- Left Side: Dark Night Sky with Stars (First Half) -->
  <g clip-path="url(#circleClip)">
    <rect x="45" y="40" width="75" height="150" fill="#141821"/>
    <!-- Stars -->
    <circle cx="70" cy="75" r="1.5" fill="#A0AAB2"/>
    <circle cx="95" cy="100" r="1" fill="#A0AAB2"/>
    <circle cx="65" cy="135" r="1.2" fill="#A0AAB2"/>
    <path d="M78 85 L80 90 L85 92 L80 94 L78 99 L76 94 L71 92 L76 90 Z" fill="#FFD166" opacity="0.6" transform="scale(0.5) translate(80, 80)"/>
  </g>

  <!-- Right Side: Golden Sun / Bright Sky (Second Half - "Half the Sky" Concept) -->
  <g clip-path="url(#circleClip)">
    <path d="M120 40 L195 40 L195 190 L120 190 Z" fill="#1E2A38"/>
    <!-- Golden Sun Rays / Glow inside the right half -->
    <circle cx="155" cy="95" r="35" fill="url(#goldGrad)" opacity="0.25"/>
    <circle cx="155" cy="95" r="22" fill="url(#goldGrad)" opacity="0.5"/>
    <circle cx="155" cy="95" r="12" fill="#FFD166"/>
  </g>

  <!-- Central Divider Representing Equal Balance -->
  <line x1="120" y1="35" x2="120" y2="195" stroke="#FFD166" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Iconic Character: Modern Professional Woman Supporting/Lifting (Representing Phái Nữ / 顶起半边天) -->
  <!-- Shoulders and Torso -->
  <path d="M85 195 C85 165 100 155 120 155 C140 155 155 165 155 195 Z" fill="#26547C"/>
  <path d="M92 195 C92 172 104 162 120 162 C136 162 148 172 148 195 Z" fill="#EF476F"/>

  <!-- Neck -->
  <rect x="114" y="142" width="12" height="18" fill="#F4A261"/>

  <!-- Head -->
  <circle cx="120" cy="128" r="17" fill="#F4A261"/>

  <!-- Modern Hair Style -->
  <path d="M103 124 C103 110 110 106 120 106 C130 106 137 110 137 124 C137 132 139 140 143 145 C138 148 130 146 120 146 C110 146 102 148 97 145 C101 140 103 132 103 124 Z" fill="#2B2D42"/>
  <!-- Hair bun / modern styling -->
  <circle cx="120" cy="98" r="8" fill="#2B2D42"/>

  <!-- Uplifted Arms Supporting the Upper Framework / Sky -->
  <!-- Left Arm -->
  <path d="M92 165 C80 150 72 125 78 115 C82 108 90 110 92 118 C94 126 95 140 105 155 Z" fill="#F4A261"/>
  <!-- Right Arm -->
  <path d="M148 165 C160 150 168 125 162 115 C158 108 150 110 148 118 C146 126 145 140 135 155 Z" fill="#F4A261"/>

  <!-- Confident Upraised Hands Supporting the top boundary -->
  <circle cx="78" cy="112" r="5" fill="#E76F51"/>
  <circle cx="162" cy="112" r="5" fill="#E76F51"/>

  <!-- Sleek Modern Base / Platform -->
  <rect x="70" y="200" width="100" height="6" rx="3" fill="#FFD166"/>
  <rect x="90" y="209" width="60" height="4" rx="2" fill="#E59866" opacity="0.6"/>

</svg>