<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Subtle glow/shadow for depth -->
    <ellipse cx="120" cy="200" rx="45" ry="8" fill="#111317"/>

    <!-- Plastic Bag (塑料袋) representing 塑料 -->
    <!-- Handles loop -->
    <path d="M 92,72 C 92,54 104,44 120,44 C 136,44 148,54 148,72" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 102,72 C 102,60 110,54 120,54 C 130,54 138,60 138,72" fill="none" stroke="#1A1D24" stroke-width="4"/>

    <!-- Bag body / main shape -->
    <path d="M 72,72 
             L 168,72 
             C 182,100 178,175 168,190 
             C 160,202 80,202 72,190 
             C 62,175 58,100 72,72 Z" 
          fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round"/>

    <!-- Dynamic folds & creases to give plastic texture -->
    <path d="M 90,85 C 100,120 85,150 95,190" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M 150,88 C 138,125 155,155 145,190" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M 120,72 C 115,110 125,140 120,195" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- Glossy reflection highlights -->
    <path d="M 82,90 C 85,120 78,150 84,170" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
    <path d="M 100,80 C 103,95 99,110 102,125" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Recycled symbol / Eco friendly modification hint (subtle context for modern usage) -->
    <g transform="translate(120, 135) scale(0.8)" opacity="0.85">
      <path d="M 0,-18 L 12,3 L -12,3 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 10,12 L 22,-9 L 0,-3 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -10,12 L 0,-3 L -22,-9 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
      <!-- Inner arrows looping -->
      <path d="M 0,-10 C 6,-10 9,-5 11,0" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 13,8 C 10,12 5,14 0,14" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <path d="M -13,4 C -12,0 -9,-6 -4,-9" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>