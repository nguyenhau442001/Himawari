<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#121d31" />
      <stop offset="100%" stop-color="#2a1f1d" />
    </linearGradient>

    <!-- Explosion glow gradient -->
    <radialGradient id="blastGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="1" />
      <stop offset="25%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary small explosion -->
    <radialGradient id="smallBlast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Warm interior light gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop shadow filter for character -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Distant smoky atmosphere & city silhouette -->
  <g id="distant-city">
    <!-- Back skyline -->
    <path d="M0 200 L0 145 L15 145 L15 135 L25 135 L25 200 L45 200 L45 125 L60 125 L60 200 L90 200 L90 110 L110 110 L110 200 L140 200 L140 130 L160 130 L160 200 L190 200 L190 115 L210 115 L210 200 L240 200 L240 240 L0 240 Z" fill="#171c26" />
  </g>

  <!-- Sky flashes and smoke clouds -->
  <g id="smoke-and-fire">
    <!-- Background glow from bomb -->
    <circle cx="160" cy="95" r="70" fill="url(#blastGlow)" />
    <circle cx="70" cy="130" r="40" fill="url(#smallBlast)" />

    <!-- Stylized billowing smoke clouds -->
    <path d="M140 110 C125 110 115 95 120 80 C125 65 145 60 155 70 C165 55 190 60 195 75 C205 80 205 100 195 110 Z" fill="#33292d" opacity="0.85" />
    <path d="M150 90 C140 85 135 75 140 65 C145 55 160 50 170 60 C175 48 195 55 195 70 C200 75 195 90 185 95 Z" fill="#524347" opacity="0.7" />
    
    <!-- Debris flying -->
    <path d="M150 80 L135 60 M165 75 L180 50 M155 95 L130 115 M170 90 L195 85" stroke="#f97316" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground City Buildings (Ruins / Impact area) -->
  <g id="foreground-buildings">
    <!-- Left damaged building -->
    <path d="M0 200 L0 80 L35 80 L35 70 L55 70 L55 200 Z" fill="#1e2433" />
    <path d="M35 70 L35 95 L55 95 L55 70 Z" fill="#0f172a" /> <!-- Hole/Damage -->
    <rect x="10" y="90" width="12" height="16" rx="2" fill="#38bdf8" opacity="0.3" />
    <rect x="10" y="115" width="12" height="16" rx="2" fill="#38bdf8" opacity="0.3" />
    
    <!-- Right heavy damaged building -->
    <path d="M180 200 L180 60 L205 60 L205 50 L240 50 L240 200 Z" fill="#242b3b" />
    <!-- Jagged blast hole in building -->
    <path d="M190 90 L210 80 L200 110 L230 120 L205 140 L185 120 Z" fill="#0b0f17" />
    <!-- Glowing internal fire in building -->
    <path d="M200 100 L210 105 L205 125 Z" fill="#f59e0b" />
    <rect x="215" y="65" width="14" height="18" rx="2" fill="#ef4444" opacity="0.7" />
  </g>

  <!-- Interior Safe Haven / Foreground Reference (Showing human context) -->
  <!-- A room interior where characters experience the urban bombing -->
  <g id="room-interior">
    <!-- Room Floor -->
    <polygon points="0,240 240,240 240,195 0,195" fill="#181316" />
    <!-- Floor line/skirting board -->
    <line x1="0" y1="195" x2="240" y2="195" stroke="#292024" stroke-width="3" />

    <!-- Window frame looking out at the city bombing -->
    <rect x="65" y="85" width="110" height="110" fill="#0a0e17" stroke="#332a30" stroke-width="6" />
    <!-- Window pane glow from outside explosions -->
    <rect x="71" y="91" width="47" height="47" fill="url(#windowLight)" opacity="0.4" />
    <rect x="124" y="91" width="47" height="47" fill="url(#windowLight)" opacity="0.2" />
    <rect x="71" y="144" width="47" height="47" fill="url(#windowLight)" opacity="0.3" />
    <rect x="124" y="144" width="47" height="47" fill="url(#windowLight)" opacity="0.5" />
    
    <!-- Window Crossbars -->
    <line x1="120" y1="85" x2="120" y2="195" stroke="#332a30" stroke-width="5" />
    <line x1="65" y1="140" x2="175" y2="140" stroke="#332a30" stroke-width="5" />

    <!-- Indoor Furniture: Bookshelf on the left, knocked over lamp or table -->
    <rect x="5" y="140" width="30" height="55" fill="#2d1c18" rx="2" />
    <rect x="9" y="150" width="22" height="6" fill="#452a25" />
    <rect x="9" y="165" width="22" height="6" fill="#452a25" />
    <rect x="9" y="180" width="22" height="6" fill="#452a25" />
  </g>

  <!-- Expressive Characters (Reacting to the bombing outside) -->
  <!-- Character 1: Adult shielding/cuddling a child in fear -->
  <g id="characters" filter="url(#shadow)">
    <!-- Adult Figure -->
    <!-- Body/Hoodie -->
    <path d="M 105 195 C 105 175 110 160 120 150 C 130 140 145 140 155 150 C 165 160 170 175 170 195 Z" fill="#3b82f6" />
    <!-- Head / Protective posture (hugging) -->
    <circle cx="130" cy="140" r="14" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 118 135 C 118 128 125 125 132 126 C 140 127 142 133 142 138 L 118 138 Z" fill="#1e293b" />
    <!-- Worried face expression (eyes closed tightly, brows furrowed) -->
    <path d="M 124 139 L 128 141" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 132 141 L 136 139" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 128 147 Q 130 145 132 147" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Arms wrapped around child -->
    <path d="M 115 165 C 125 165 145 170 155 160" stroke="#2563eb" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Child Figure (Sheltering close, scared) -->
    <circle cx="150" cy="158" r="11" fill="#fde68a" />
    <!-- Child Hair -->
    <path d="M 141 154 C 141 148 148 146 154 147 C 159 148 160 152 160 156 L 141 156 Z" fill="#b45309" />
    <!-- Child Body -->
    <path d="M 140 195 C 140 175 145 165 155 165 C 165 165 170 175 170 195 Z" fill="#ec4899" />
    <!-- Scared face lines on child -->
    <path d="M 146 157 L 149 158" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 152 158 L 155 157" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Trembling / hands over ears or holding tight -->
    <circle cx="158" cy="161" r="3" fill="#fde68a" />
  </g>

  <!-- Foreground debris / broken glass and shockwave lines inside room -->
  <g id="foreground-effects" opacity="0.9">
    <!-- Shockwave vibration lines near window -->
    <path d="M 60 85 L 50 75 M 180 85 L 190 75 M 120 80 L 120 70" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    
    <!-- Broken glass shards on floor -->
    <polygon points="45,195 50,190 55,195" fill="#bae6fd" opacity="0.8" />
    <polygon points="185,193 192,188 196,195" fill="#bae6fd" opacity="0.8" />
    <polygon points="105,196 112,191 115,196" fill="#bae6fd" opacity="0.8" />
  </g>
</svg>