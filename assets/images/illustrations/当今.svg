<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle grid/glow effect for "today/present era" -->
  <circle cx="120" cy="115" r="70" fill="#222733" opacity="0.6"/>
  <circle cx="120" cy="115" r="50" fill="#2A303C" opacity="0.4"/>

  <!-- Central Object: A sleek, modern glowing digital desk clock / calendar interface symbolizing "Today / Present era" (当今) -->
  
  <!-- Clock Outer Ring -->
  <circle cx="120" cy="110" r="46" fill="none" stroke="#3A4252" stroke-width="4"/>
  <circle cx="120" cy="110" r="46" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="180 110" stroke-linecap="round" transform="rotate(-90 120 110)"/>

  <!-- Clock Face Base -->
  <circle cx="120" cy="110" r="40" fill="#1E232E"/>

  <!-- Hour and Minute Hands pointing to "Now" -->
  <line x1="120" y1="110" x2="120" y2="88" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="110" x2="140" y2="118" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="110" r="4" fill="#F59E0B"/>

  <!-- Digital Calendar / Today Indicator Overlay (representing the present moment/era) -->
  <rect x="90" y="145" width="60" height="24" rx="6" fill="#F59E0B"/>
  <!-- Checkmark / Core icon inside badge indicating current active day -->
  <path d="M107 157 L114 163 L133 149" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Modern minimalist orbit rings representing "Era / Time" (时代) -->
  <ellipse cx="120" cy="110" rx="80" ry="26" fill="none" stroke="#3A4252" stroke-width="1.5" stroke-dasharray="6 6" transform="rotate(-15 120 110)"/>
  <circle cx="52" cy="92" r="4" fill="#F59E0B"/>
  <circle cx="188" cy="128" r="3" fill="#60A5FA"/>

</svg>