<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Park Gate Structure -->
  <path d="M60 180 L60 80 L100 60 L140 80 L140 180" fill="none" stroke="#4A5568" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="100" width="30" height="80" fill="#2D3748" rx="4"/>
  
  <!-- Elderly Person Character -->
  <g transform="translate(70, 120)">
    <circle cx="20" cy="20" r="12" fill="#F6AD55"/>
    <path d="M20 32 L20 60 M20 40 L10 50 M20 40 L30 50 M10 75 L20 60 L30 75" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Staff Character waving off payment -->
  <g transform="translate(160, 120)">
    <circle cx="15" cy="20" r="10" fill="#63B3ED"/>
    <path d="M15 30 L15 55 M15 35 L5 45 M15 35 L25 45 M5 70 L15 55 L25 70" stroke="#63B3ED" stroke-width="4" stroke-linecap="round"/>
    <!-- Friendly hand gesture indicating no payment -->
    <path d="M15 35 L30 25" stroke="#63B3ED" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Crossed-out Coin Symbol representing 'Free' -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#F6AD55" stroke-width="3"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Ground line -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2D3748" stroke-width="4" stroke-linecap="round"/>
</svg>