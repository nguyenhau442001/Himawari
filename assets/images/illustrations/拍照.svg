<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Context Indicator / Framing -->
    <rect x="0" y="0" width="216" height="216" rx="16" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Camera Body -->
    <g transform="translate(38, 65)">
      <!-- Main body casing -->
      <rect x="10" y="30" width="120" height="80" rx="12" fill="#2E364F"/>
      <!-- Top plate -->
      <path d="M 35 30 L 45 18 L 95 18 L 105 30 Z" fill="#3B4463"/>
      <!-- Shutter button -->
      <rect x="95" y="10" width="16" height="8" rx="3" fill="#F59E0B"/>
      <!-- Flash / Hotshoe -->
      <rect x="25" y="14" width="18" height="4" rx="2" fill="#4A5578"/>
      
      <!-- Main Lens Outer Ring -->
      <circle cx="70" cy="70" r="32" fill="#1A1D24" stroke="#4A5578" stroke-width="4"/>
      <!-- Lens Inner Element -->
      <circle cx="70" cy="70" r="22" fill="#2E364F"/>
      <!-- Lens Glass & Reflection -->
      <circle cx="70" cy="70" r="16" fill="#111318"/>
      <path d="M 60 58 A 16 16 0 0 1 82 82 Z" fill="#3B82F6" opacity="0.6"/>
      <circle cx="65" cy="65" r="4" fill="#FFFFFF" opacity="0.4"/>
      
      <!-- Viewfinder / Sensor dot -->
      <circle cx="25" cy="45" r="5" fill="#111318"/>
      <!-- Grip accent -->
      <rect x="16" y="42" width="6" height="56" rx="3" fill="#F59E0B" opacity="0.9"/>
    </g>
    
    <!-- Dynamic Shutter / Flash Beam -->
    <path d="M 120 100 L 190 50 L 190 150 Z" fill="#F59E0B" opacity="0.15"/>
    <circle cx="190" cy="100" r="4" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Focus brackets / Viewfinder corners -->
    <path d="M 50 45 L 42 45 L 42 53" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 170 45 L 178 45 L 178 53" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 50 155 L 42 155 L 42 147" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 170 155 L 178 155 L 178 147" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>