<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Room 1 (Left) Gradient -->
    <linearGradient id="room1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Room 2 (Right - Source of Noise) Gradient -->
    <linearGradient id="room2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Sound Wave Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ==================== BACKGROUND ROOMS & WALL ==================== -->
  <!-- Left Room (Protagonist's room) -->
  <rect x="15" y="20" width="105" height="185" rx="8" fill="url(#room1Grad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Right Room (Strange sound room) -->
  <rect x="120" y="20" width="105" height="185" rx="8" fill="url(#room2Grad)" stroke="#64748b" stroke-width="2"/>

  <!-- Shared Partition Wall with a glowing crack / subtle opening -->
  <rect x="117" y="20" width="6" height="185" fill="#0f172a"/>
  <!-- Door frame separator -->
  <line x1="120" y1="20" x2="120" y2="205" stroke="#0f172a" stroke-width="3"/>

  <!-- ==================== RIGHT ROOM (NOISE SOURCE) ==================== -->
  <!-- Tipped over lamp / messy props -->
  <path d="M 140 160 L 160 175 L 155 185 L 135 170 Z" fill="#64748b"/>
  <!-- Toppled lampshade -->
  <path d="M 160 165 L 185 155 L 190 170 L 165 180 Z" fill="#fbbf24"/>
  <!-- Floor shadow/motion lines in right room -->
  <path d="M 130 150 Q 150 145 170 155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- SUDDEN STRANGE SOUND EFFECT (响声) -->
  <g filter="url(#glow)">
    <!-- Shockwaves / Sound waves bursting from right room through the wall -->
    <path d="M 115 100 Q 95 90 85 70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 118 115 Q 90 100 75 75" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 115 130 Q 95 120 85 100" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Sound impact stars / comic vibration sparks -->
    <path d="M 100 85 L 92 80 L 100 75 Z" fill="#fbbf24"/>
    <path d="M 90 110 L 80 105 L 85 95 Z" fill="#f43f5e"/>
    <path d="M 105 135 L 95 142 L 100 128 Z" fill="#38bdf8"/>
  </g>


  <!-- ==================== LEFT ROOM (PROTAGONIST) ==================== -->
  <!-- Desk & Study Lamp -->
  <rect x="25" y="145" width="60" height="10" rx="3" fill="#64748b"/>
  <rect x="45" y="155" width="8" height="35" fill="#475569"/>
  <!-- Open Book on Desk -->
  <path d="M 35 145 Q 55 138 75 145 L 75 135 Q 55 128 35 135 Z" fill="#f8fafc"/>
  <path d="M 55 138 L 55 145" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Desk Lamp -->
  <circle cx="75" cy="120" r="40" fill="url(#lampGlow)"/>
  <path d="M 70 145 L 75 120 L 80 145 Z" fill="#94a3b8"/>
  <path d="M 60 115 Q 75 105 90 115 Z" fill="#fbbf24"/>

  <!-- Character: Surprised Person at Desk -->
  <!-- Chair Back -->
  <rect x="35" y="115" width="20" height="45" rx="6" fill="#475569"/>

  <!-- Character Body (Leaning forward in surprise) -->
  <path d="M 40 135 Q 60 120 75 135 L 70 170 L 35 170 Z" fill="#38bdf8"/> <!-- Blue hoodie -->
  
  <!-- Character Head (Turned sharply towards the right wall) -->
  <circle cx="65" cy="100" r="16" fill="url(#skinGrad)"/>
  
  <!-- Hair (Messy/Expressive) -->
  <path d="M 50 95 Q 55 80 75 85 Q 85 90 80 102 Q 70 95 50 95 Z" fill="#1e293b"/>

  <!-- Wide Open Surprised Eyes looking right -->
  <circle cx="72" cy="98" r="3.5" fill="#ffffff"/>
  <circle cx="73" cy="98" r="1.5" fill="#0f172a"/>
  <!-- Eyebrows raised high in shock -->
  <path d="M 67 91 Q 73 87 78 90" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Open O-shaped Surprised Mouth -->
  <ellipse cx="76" cy="106" rx="2.5" ry="3.5" fill="#0f172a"/>

  <!-- Raised Hand pausing mid-action (holding a pen or stopping) -->
  <path d="M 70 125 Q 85 120 82 108" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="82" cy="107" r="3" fill="url(#skinGrad)"/>


  <!-- ==================== FOREGROUND FLOOR & DETAILS ==================== -->
  <!-- Base floor line -->
  <line x1="15" y1="205" x2="225" y2="205" stroke="#334155" stroke-width="3"/>

  <!-- Floor rug in protagonist room -->
  <ellipse cx="65" cy="195" rx="35" ry="8" fill="#475569" opacity="0.6"/>

  <!-- Question mark / Mystery indicator subtle floating icon (abstract mood, no text) -->
  <g transform="translate(160, 60) scale(0.8)" opacity="0.8">
    <path d="M 0 -10 C 0 -20 15 -20 15 -10 C 15 0 0 5 0 15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <circle cx="0" cy="24" r="2.5" fill="#fbbf24"/>
  </g>

</svg>