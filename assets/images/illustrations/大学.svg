<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background campus subtle design elements -->
  <path d="M40 180 L200 180" stroke="#2A2F3B" stroke-width="2" stroke-linecap="round"/>
  
  <!-- University Building (Classical/Modern Academic Hall) -->
  <g transform="translate(0, 10)">
    <!-- Base / Steps -->
    <rect x="70" y="160" width="100" height="8" rx="2" fill="#2E3646"/>
    <rect x="80" y="152" width="80" height="8" rx="2" fill="#3A445A"/>

    <!-- Main Hall Structure -->
    <rect x="75" y="90" width="90" height="62" fill="#242B38"/>
    
    <!-- Columns -->
    <rect x="90" y="105" width="8" height="47" fill="#4A566D"/>
    <rect x="106" y="105" width="8" height="47" fill="#4A566D"/>
    <rect x="126" y="105" width="8" height="47" fill="#4A566D"/>
    <rect x="142" y="105" width="8" height="47" fill="#4A566D"/>

    <!-- Building Pediment / Roof Base -->
    <polygon points="70,90 170,90 120,55" fill="#313C50"/>
    <polygon points="75,90 165,90 120,60" fill="#3A445A"/>

    <!-- Accent Golden Roof Trim (Academic Excellence) -->
    <polygon points="120,50 125,58 115,58" fill="#F1C40F"/>
    
    <!-- Central Arch / Entrance -->
    <path d="M110 152 L110 125 A10 10 0 0 1 130 125 L130 152 Z" fill="#1A1D24"/>
  </g>

  <!-- Foreground Professor / Academic Figure (Contextual reference: 他是大学的教授) -->
  <g transform="translate(0, 10)">
    <!-- Body / Suit -->
    <path d="M105 180 L115 155 L135 155 L145 180 Z" fill="#2C3E50"/>
    <!-- Jacket Lapels -->
    <path d="M115 155 L120 170 L125 155 Z" fill="#34495E"/>
    <!-- Shirt & Tie -->
    <polygon points="120,155 122,165 118,165" fill="#ECF0F1"/>
    <polygon points="120,163 122,163 121,173" fill="#E74C3C"/>

    <!-- Head & Hair -->
    <circle cx="125" cy="138" r="11" fill="#F5CBA7"/>
    <!-- Glasses -->
    <rect x="119" y="134" width="5" height="3" rx="0.5" fill="none" stroke="#F1C40F" stroke-width="1.5"/>
    <rect x="126" y="134" width="5" height="3" rx="0.5" fill="none" stroke="#F1C40F" stroke-width="1.5"/>
    <line x1="124" y1="135" x2="126" y2="135" stroke="#F1C40F" stroke-width="1.5"/>
    
    <!-- Hair style -->
    <path d="M114 135 C114 128 136 128 136 135 Z" fill="#5D6D7E"/>

    <!-- Holding Academic Book -->
    <rect x="130" y="162" width="16" height="12" rx="2" fill="#E67E22" transform="rotate(-15 130 162)"/>
    <rect x="132" y="164" width="12" height="8" rx="1" fill="#F39C12" transform="rotate(-15 130 162)"/>
  </g>

  <!-- Floating Graduation Cap (Academic symbol above building) -->
  <g transform="translate(145, 60)">
    <polygon points="0,10 15,3 30,10 15,17" fill="#2C3E50"/>
    <polygon points="0,10 15,3 30,10 15,17" stroke="#34495E" stroke-width="1"/>
    <!-- Cap Headband -->
    <path d="M7 13 L7 18 C7 21 23 21 23 18 L23 13" fill="none" stroke="#2C3E50" stroke-width="3"/>
    <!-- Tassel -->
    <path d="M22 12 Q28 15 27 22" fill="none" stroke="#F1C40F" stroke-width="1.5"/>
    <circle cx="27" cy="22" r="1.5" fill="#F1C40F"/>
  </g>
</svg>