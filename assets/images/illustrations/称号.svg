<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Factory/Workshop Elements -->
  <path d="M40 180 L200 180 L200 100 L160 80 L120 100 L80 80 L40 100 Z" fill="#334155"/>
  <circle cx="180" cy="120" r="15" fill="#475569"/>
  <rect x="50" y="110" width="40" height="60" fill="#475569" rx="4"/>
  
  <!-- Character -->
  <g transform="translate(80, 100)">
    <!-- Body -->
    <path d="M30 120 L70 120 L65 70 L35 70 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="50" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M35 45 Q50 30 65 45" fill="#78350f"/>
    <!-- Arm holding certificate -->
    <path d="M65 80 L90 70" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The Certificate/Award Object -->
  <g transform="translate(140, 130)">
    <rect x="0" y="0" width="50" height="40" rx="4" fill="#fbbf24"/>
    <rect x="5" y="5" width="40" height="30" rx="2" fill="#fffbeb"/>
    <path d="M10 12 L40 12 M10 20 L40 20 M10 28 L30 28" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- Ribbon -->
    <path d="M25 40 L25 55 L35 50 L45 55 L45 40" fill="#ec4899"/>
  </g>
  
  <!-- Confetti/Celebration Accents -->
  <circle cx="40" cy="60" r="3" fill="#10b981"/>
  <circle cx="200" cy="50" r="4" fill="#fb923c"/>
  <circle cx="180" cy="180" r="3" fill="#38bdf8"/>
  <path d="M20 150 L30 140" stroke="#fbbf24" stroke-width="2"/>
</svg>