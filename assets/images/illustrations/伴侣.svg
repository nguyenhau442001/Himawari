<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Journey Path representing "人生旅途" -->
  <path d="M 40 180 C 80 180, 100 130, 120 130 C 140 130, 160 180, 200 180" fill="none" stroke="#2A303C" stroke-width="6" stroke-linecap="round"/>
  <path d="M 40 180 C 80 180, 100 130, 120 130 C 140 130, 160 180, 200 180" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8"/>

  <!-- Background Scenery Elements (Mountains & Stars for journey) -->
  <polygon points="50,130 80,80 110,130" fill="#222733"/>
  <polygon points="130,140 170,70 210,140" fill="#222733"/>
  <circle cx="190" cy="50" r="1.5" fill="#F1F5F9" opacity="0.6"/>
  <circle cx="50" cy="60" r="1" fill="#F1F5F9" opacity="0.4"/>
  <circle cx="90" cy="45" r="1.5" fill="#F1F5F9" opacity="0.5"/>

  <!-- Companion Figure 1 (Left - Walking together, modern flat style) -->
  <g transform="translate(85, 95)">
    <!-- Body / Torso -->
    <path d="M 12 35 C 12 28, 18 24, 25 24 C 32 24, 38 28, 38 35 L 42 70 L 8 70 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="25" cy="14" r="9" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M 16 14 C 16 9, 20 5, 25 5 C 30 5, 34 9, 34 14 C 34 16, 32 17, 30 15 C 28 13, 22 13, 20 15 C 18 17, 16 16, 16 14 Z" fill="#1E293B"/>
    <!-- Legs -->
    <line x1="16" y1="70" x2="14" y2="105" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <line x1="34" y1="70" x2="36" y2="105" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <!-- Arm (reaching out toward partner) -->
    <path d="M 35 32 Q 45 35, 48 42" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Companion Figure 2 (Right - Walking together, harmonious palette) -->
  <g transform="translate(115, 95)">
    <!-- Body / Torso -->
    <path d="M 12 35 C 12 28, 18 24, 25 24 C 32 24, 38 28, 38 35 L 42 70 L 8 70 Z" fill="#EC4899"/>
    <!-- Head -->
    <circle cx="25" cy="14" r="9" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M 15 14 C 15 8, 20 4, 25 4 C 30 4, 35 8, 35 14 L 36 22 C 34 22, 32 18, 30 18 C 28 18, 22 18, 20 18 C 18 18, 15 22, 14 22 Z" fill="#475569"/>
    <!-- Legs -->
    <line x1="16" y1="70" x2="18" y2="105" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <line x1="34" y1="70" x2="32" y2="105" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <!-- Arm (reaching out to hold hands) -->
    <path d="M 15 32 Q 5 35, 2 42" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Shared Focal Point: Warm Connection Glow (Non-heart, purely collaborative/companionable motif) -->
  <circle cx="120" cy="133" r="4" fill="#F59E0B"/>
  <circle cx="120" cy="133" r="10" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>

  <!-- Foreground subtle elements for grounding -->
  <ellipse cx="120" cy="202" rx="70" ry="4" fill="#111318"/>
</svg>