<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Left side: Chaotic/Complex state -->
  <g transform="translate(60, 120)">
    <path d="M-20 -40 L 0 -60 L 20 -40 L 0 -20 Z" fill="#FF9F1C" opacity="0.6"/>
    <path d="M-30 -10 L -10 -30 L 10 -10 L -10 10 Z" fill="#FF9F1C" opacity="0.6"/>
    <path d="M5 -50 L 25 -70 L 45 -50 L 25 -30 Z" fill="#FF9F1C" opacity="0.6"/>
    <path d="M-35 0 L -15 -20 L 5 0 L -15 20 Z" fill="#FF9F1C" opacity="0.6"/>
    <path d="M-10 -50 L 10 -70 L 30 -50 L 10 -30 Z" fill="#FF9F1C" opacity="0.6"/>
    <path d="M-25 -25 L -5 -45 L 15 -25 L -5 -5 Z" fill="#FF9F1C" opacity="0.6"/>
  </g>

  <!-- Arrow representing transition -->
  <path d="M95 120 L 145 120 M 135 110 L 145 120 L 135 130" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right side: Simplified state -->
  <g transform="translate(180, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#FF9F1C"/>
  </g>
</svg>