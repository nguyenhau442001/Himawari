<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="zongziGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="zongziHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Interior Elements / Room Context -->
  <g id="environment">
    <!-- Warm ambient light from festive lantern/lamp -->
    <circle cx="120" cy="70" r="90" fill="url(#lampGlow)"/>

    <!-- Window frame showing evening blue night sky outside -->
    <path d="M 170 30 L 210 30 L 210 110 L 170 110 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M 175 35 L 205 35 L 205 105 L 175 105 Z" fill="#1e293b"/>
    <circle cx="190" cy="50" r="8" fill="#fbbf24" opacity="0.8"/> <!-- Moon -->
    <!-- Simple cloud outside -->
    <path d="M 180 80 Q 185 75 192 80 Q 200 78 202 85 L 180 85 Z" fill="#334155" opacity="0.5"/>

    <!-- Festive hanging pouch / sachet on the wall (Xiangbao tradition) -->
    <path d="M 60 25 L 60 40" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 50 40 Q 60 35 70 40 L 75 55 Q 60 65 45 55 Z" fill="#ec4899"/>
    <path d="M 60 58 L 60 70" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="60" cy="48" r="3" fill="#fbbf24"/>

    <!-- Wooden Wall shelf / background line -->
    <line x1="20" y1="115" x2="160" y2="115" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <circle cx="40" cy="115" r="4" fill="#64748b"/>
    <circle cx="140" cy="115" r="4" fill="#64748b"/>
  </g>

  <!-- Table Surface -->
  <g id="table">
    <!-- Table top -->
    <path d="M 15 175 L 225 175 L 215 215 L 25 215 Z" fill="url(#tableGrad)"/>
    <!-- Table edge highlight -->
    <line x1="15" y1="175" x2="225" y2="175" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Table wooden texture accent -->
    <path d="M 40 185 L 200 185" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    <path d="M 50 195 L 190 195" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Props & Objects on Table -->
  <g id="props">
    <!-- Bamboo steamer basket base containing Zongzi -->
    <ellipse cx="120" cy="165" rx="55" ry="18" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="120" cy="163" rx="51" ry="15" fill="#1e293b"/>
    
    <!-- Bamboo steamer rim layers -->
    <path d="M 65 165 C 65 177 175 177 175 165" fill="none" stroke="#64748b" stroke-width="3"/>
    
    <!-- Steam wisps rising from the hot zongzi -->
    <path d="M 105 145 Q 100 130 110 115 Q 120 100 115 85" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 135 142 Q 140 128 132 115 Q 125 102 130 90" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Ceramic Plate with Zongzi -->
    <ellipse cx="120" cy="170" rx="42" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- ZONGZI 1 (Center Front - Unwrapped / Being eaten) -->
    <g transform="translate(110, 155)">
      <!-- Rice sticky texture body -->
      <path d="M 0 -22 L 20 10 L -18 8 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
      <!-- Bamboo leaf wrapping partially peeled back -->
      <path d="M -5 -22 L 0 -22 L -18 8 L -25 2 Z" fill="url(#zongziGrad)"/>
      <path d="M 10 -10 L 20 10 L 5 12 Z" fill="url(#zongziGrad)"/>
      <!-- Red bean / filling peek -->
      <circle cx="2" cy="0" r="3.5" fill="#991b1b"/>
      <!-- String tie loose on side -->
      <path d="M -2 2 Q 5 10 12 15" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2,1"/>
    </g>

    <!-- ZONGZI 2 (Stacked behind, fully wrapped in reed leaves) -->
    <g transform="translate(85, 152) rotate(-15)">
      <path d="M 0 -20 L 18 12 L -16 8 Z" fill="url(#zongziGrad)"/>
      <path d="M 0 -20 L 5 10 L 18 12 Z" fill="url(#zongziHighlight)"/>
      <!-- Twine wrap detail -->
      <path d="M -8 3 L 8 8" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
      <path d="M -4 -6 L 10 -2" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- ZONGZI 3 (Right side stacked) -->
    <g transform="translate(150, 158) rotate(12)">
      <path d="M 0 -18 L 16 10 L -15 7 Z" fill="url(#zongziGrad)"/>
      <path d="M 0 -18 L -5 8 L -15 7 Z" fill="url(#zongziHighlight)"/>
      <path d="M -6 0 L 8 4" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Small tea cup next to plate -->
    <ellipse cx="62" cy="168" rx="10" ry="5" fill="#334155"/>
    <path d="M 52 168 L 55 180 L 69 180 L 72 168 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <ellipse cx="62" cy="168" rx="8" ry="3.5" fill="#0284c7" opacity="0.8"/> <!-- Tea liquid -->
  </g>

  <!-- Main Character: Happy person enjoying the festive food -->
  <g id="character" transform="translate(0, 0)">
    <!-- Body / Torso (wearing comfortable modern festive green/teal hoodie) -->
    <path d="M 85 215 C 85 190 95 170 120 170 C 145 170 155 190 155 215 Z" fill="#0d9488"/>
    <!-- Collar details -->
    <path d="M 105 170 L 120 185 L 135 170" fill="none" stroke="#115e59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <path d="M 112 150 L 128 150 L 130 172 L 110 172 Z" fill="#fcd34d"/>

    <!-- Head and Face -->
    <circle cx="120" cy="130" r="28" fill="#fef3c7"/> <!-- Warm skin tone -->
    <circle cx="120" cy="130" r="28" fill="url(#warmGlow)"/>

    <!-- Hair (Stylish dark slate modern haircut) -->
    <path d="M 94 125 C 92 105 105 95 120 95 C 138 95 147 105 146 125 C 146 130 148 122 144 115 C 138 102 125 100 120 100 C 105 100 98 108 96 118 Z" fill="#1e293b"/>
    <path d="M 95 120 Q 102 112 112 115" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Cheeks (Blushing happily from delicious food) -->
    <circle cx="103" cy="136" r="5" fill="#f43f5e" opacity="0.4"/>
    <circle cx="137" cy="136" r="5" fill="#f43f5e" opacity="0.4"/>

    <!-- Eyes (Happy closed crescent eyes indicating enjoyment) -->
    <path d="M 104 128 Q 108 123 112 128" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 128 128 Q 132 123 136 128" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Big Happy Open Smile -->
    <path d="M 112 138 Q 120 148 128 138 Z" fill="#991b1b"/>
    <path d="M 114 138 Q 120 144 126 138" fill="none" stroke="#fff" stroke-width="1.5"/>

    <!-- Active Hands / Arms holding chopsticks or bringing food -->
    <!-- Left Arm & Hand holding chopsticks pointing toward zongzi -->
    <path d="M 90 190 C 80 180 95 160 105 155" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round"/>
    <circle cx="105" cy="153" r="6" fill="#fef3c7"/> <!-- Hand -->
    <!-- Chopsticks -->
    <line x1="108" y1="145" x2="118" y2="158" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="106" y1="148" x2="116" y2="161" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Arm & Hand resting or gesturing happily -->
    <path d="M 150 190 C 160 180 145 165 135 158" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round"/>
    <circle cx="134" cy="156" r="6" fill="#fef3c7"/> <!-- Hand -->
  </g>

  <!-- Foreground Atmospheric Elements (Soft Focus Sparkles / Festive vibe) -->
  <g id="sparkles" fill="#fbbf24">
    <circle cx="45" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="55" cy="85" r="2.5" opacity="0.9"/>
    <circle cx="35" cy="130" r="2" opacity="0.5"/>
    <circle cx="195" cy="140" r="2" opacity="0.8"/>
    <circle cx="205" cy="125" r="1.5" opacity="0.6"/>
    <!-- Tiny star sparkles -->
    <path d="M 165 70 L 167 75 L 172 77 L 167 79 L 165 84 L 163 79 L 158 77 L 163 75 Z" fill="#fbbf24" opacity="0.7" transform="scale(0.5) translate(160, 40)"/>
  </g>

</svg>