<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Escalation/Progression Metaphor: A staircase leading to a sharp, exaggerated peak -->
  <!-- Base level -->
  <path d="M40 180 L80 180 L80 160 L40 160 Z" fill="#3D4451"/>
  <path d="M80 160 L120 160 L120 140 L80 140 Z" fill="#4B5563"/>
  <path d="M120 140 L160 140 L160 120 L120 120 Z" fill="#6B7280"/>
  <path d="M160 120 L200 120 L200 80 L160 80 Z" fill="#F59E0B"/>
  
  <!-- The "Càng... càng" progression indicator: A rising line graph path -->
  <path d="M50 170 C 80 170, 100 150, 130 130 C 160 110, 170 90, 190 90" stroke="#F59E0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Visualizing the "Cold" (Temperature drop) context via a sharp, stylized icicle/peak element -->
  <path d="M180 90 L200 90 L190 60 Z" fill="#60A5FA"/>
  
  <!-- Decorative accent for progression -->
  <circle cx="50" cy="170" r="4" fill="#F59E0B"/>
  <circle cx="190" cy="90" r="6" fill="#F59E0B"/>
</svg>