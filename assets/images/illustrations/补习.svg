<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk and Environment Elements -->
  <!-- Main Desk Surface -->
  <path d="M 40,175 L 200,175 L 210,195 L 30,195 Z" fill="#2D3340"/>
  <rect x="35" y="170" width="170" height="7" rx="3.5" fill="#3B4252"/>
  
  <!-- Open Textbook showing math concepts -->
  <path d="M 75,145 Q 120,130 165,145 L 165,175 Q 120,160 75,175 Z" fill="#E5E9F0"/>
  <path d="M 120,135 L 120,170" stroke="#D8DEE9" stroke-width="2"/>
  <!-- Left Page Equations (Math notes) -->
  <path d="M 85,150 L 105,150 M 85,158 L 110,158 M 90,166 L 100,166" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
  <!-- Right Page Graph (Showing improvement / going up) -->
  <path d="M 135,163 L 145,158 L 153,161 L 160,148" fill="none" stroke="#D08770" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="148" r="2.5" fill="#D08770"/>

  <!-- Glowing Desk Lamp representing evening/night study -->
  <path d="M 185,170 L 185,115 L 195,115 L 195,170 Z" fill="#4C566A"/>
  <path d="M 170,115 Q 190,100 210,115 Z" fill="#EBCB8B"/>
  <path d="M 165,115 L 215,115" stroke="#D08770" stroke-width="2" stroke-linecap="round"/>
  <!-- Light cone gradient / beam -->
  <polygon points="190,115 130,175 210,175" fill="#EBCB8B" opacity="0.12"/>
  
  <!-- Student Character (Front-left, engaged in learning) -->
  <!-- Body/Torso -->
  <path d="M 70,175 C 70,145 95,135 95,135 C 95,135 110,150 115,175 Z" fill="#5E81AC"/>
  <!-- Head -->
  <circle cx="90" cy="118" r="16" fill="#ECEFF4"/>
  <!-- Hair -->
  <path d="M 74,115 C 74,100 106,100 106,115 C 106,120 102,112 90,110 C 78,112 74,120 74,115 Z" fill="#2E3440"/>
  <!-- Arm writing/interacting -->
  <path d="M 95,145 L 105,160 L 115,155" fill="none" stroke="#5E81AC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand holding pen -->
  <circle cx="115" cy="153" r="3.5" fill="#ECEFF4"/>
  <line x1="115" y1="153" x2="120" y2="158" stroke="#D08770" stroke-width="2" stroke-linecap="round"/>

  <!-- Tutor Character (Standing slightly behind/beside, pointing/guiding) -->
  <!-- Body/Torso -->
  <path d="M 145,175 C 145,135 170,125 170,125 C 170,125 190,145 195,175 Z" fill="#88C0D0"/>
  <!-- Head -->
  <circle cx="170" cy="105" r="15" fill="#ECEFF4"/>
  <!-- Hair (Tutor) -->
  <path d="M 155,102 C 155,90 185,90 185,102 C 185,106 180,98 170,97 C 160,98 155,106 155,102 Z" fill="#4C566A"/>
  <!-- Glasses for smart tutor look -->
  <circle cx="165" cy="104" r="3.5" fill="none" stroke="#2E3440" stroke-width="1.5"/>
  <circle cx="175" cy="104" r="3.5" fill="none" stroke="#2E3440" stroke-width="1.5"/>
  <line x1="168.5" y1="104" x2="171.5" y2="104" stroke="#2E3440" stroke-width="1.5"/>

  <!-- Tutor's Guiding Arm & Hand (Action of 'Tutoring' / 'Buxi') -->
  <path d="M 160,130 L 135,145 L 125,143" fill="none" stroke="#88C0D0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pointing Finger direct interaction -->
  <circle cx="125" cy="143" r="3" fill="#ECEFF4"/>
  <path d="M 125,143 L 118,141" stroke="#ECEFF4" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Motion / Insight Lines (Highlighting active learning / teaching moment) -->
  <path d="M 115,125 Q 120,118 127,122" fill="none" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 130,118 Q 135,112 142,116" fill="none" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="132" cy="128" r="1.5" fill="#EBCB8B"/>
  <circle cx="120" cy="135" r="1" fill="#EBCB8B"/>

  <!-- Sparkle of understanding / progress -->
  <path d="M 148,82 L 150,88 L 156,90 L 150,92 L 148,98 L 146,92 L 140,90 L 146,88 Z" fill="#EBCB8B"/>
  <path d="M 100,75 L 101,79 L 105,80 L 101,81 L 100,85 L 99,81 L 95,80 L 99,79 Z" fill="#A3BE8C" opacity="0.8"/>

  <!-- Evening Window in Background indicating night study (晚间) -->
  <rect x="100" y="35" width="40" height="55" rx="4" fill="#2E3440"/>
  <!-- Crescent Moon outside -->
  <path d="M 125,50 C 120,50 115,55 115,62 C 115,69 120,74 125,74 C 122,70 122,54 125,50 Z" fill="#EBCB8B" opacity="0.85"/>
  <!-- Window grid lines -->
  <line x1="120" y1="35" x2="120" y2="90" stroke="#1A1D24" stroke-width="2"/>
  <line x1="100" y1="62.5" x2="140" y2="62.5" stroke="#1A1D24" stroke-width="2"/>
</svg>