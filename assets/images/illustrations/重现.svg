<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 重现 (Reappearance / Cinematic Reenactment based on the context of historical documentary):
       Centered physical object: An iconic classic vintage film projector projecting a vivid historical scene (representing the Red Army march silhouettes), capturing the exact meaning of "reappearing/ tái hiện". -->

  <!-- Projector Stand / Base -->
  <path d="M100 190 L140 190 L130 160 L110 160 Z" fill="#2E3440"/>
  <rect x="114" y="130" width="12" height="35" rx="3" fill="#4C566A"/>

  <!-- Projector Body -->
  <rect x="80" y="95" width="80" height="50" rx="8" fill="#3B4252"/>
  <rect x="90" y="105" width="20" height="8" rx="2" fill="#EBCB8B"/>

  <!-- Lens (Pointing Right) -->
  <path d="M160 110 L185 103 L185 137 L160 130 Z" fill="#4C566A"/>
  <rect x="180" y="101" width="7" height="38" rx="2" fill="#E5C07B"/>

  <!-- Film Reels (Feed & Take-up) -->
  <circle cx="100" cy="75" r="22" fill="none" stroke="#E5C07B" stroke-width="5"/>
  <circle cx="100" cy="75" r="6" fill="#E5C07B"/>
  <line x1="84" y1="75" x2="116" y2="75" stroke="#E5C07B" stroke-width="3"/>
  <line x1="100" y1="59" x2="100" y2="91" stroke="#E5C07B" stroke-width="3"/>

  <circle cx="145" cy="75" r="18" fill="none" stroke="#E5C07B" stroke-width="4"/>
  <circle cx="145" cy="75" r="5" fill="#E5C07B"/>
  <line x1="132" y1="75" x2="158" y2="75" stroke="#E5C07B" stroke-width="2.5"/>
  <line x1="145" y1="62" x2="145" y2="88" stroke="#E5C07B" stroke-width="2.5"/>

  <!-- Light Beam / Projection Cone -->
  <polygon points="187,112 230,80 230,160" fill="url(#lightBeam)" opacity="0.8"/>

  <!-- Reappearing Historical Scene inside the beam (Marching figures silhouette) -->
  <g transform="translate(195, 100) scale(0.6)">
    <!-- Terrain / Mountains in background -->
    <path d="M0 70 L15 45 L35 60 L55 30 L75 70 Z" fill="#D08770" opacity="0.6"/>
    <!-- Marching Silhouettes (representing the Long March historical reenactment) -->
    <path d="M15 65 L18 50 L22 65 Z" fill="#E5C07B"/>
    <circle cx="18" cy="46" r="3" fill="#E5C07B"/>
    <path d="M30 65 L33 48 L37 65 Z" fill="#E5C07B"/>
    <circle cx="33" cy="44" r="3" fill="#E5C07B"/>
    <path d="M48 65 L51 46 L55 65 Z" fill="#E5C07B"/>
    <circle cx="51" cy="42" r="3" fill="#E5C07B"/>
  </g>

  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBCB8B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EBCB8B" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
</svg>