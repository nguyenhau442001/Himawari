<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Glowing background aura representing warmth/hospitality -->
    <circle cx="0" cy="0" r="70" fill="#FFB703" opacity="0.1"/>
    
    <!-- Serving Cloche (Dome) -->
    <!-- Cloche Plate -->
    <ellipse cx="0" cy="55" rx="65" ry="14" fill="#2E3540"/>
    <ellipse cx="0" cy="52" rx="55" ry="10" fill="#3A4454"/>
    
    <!-- Cloche Dome Body -->
    <path d="M -50 45 C -50 -5, -25 -25, 0 -25 C 25 -25, 50 -5, 50 45 Z" fill="#FFB703"/>
    
    <!-- Cloche Dome Highlight/Shadow for Flat Vector depth -->
    <path d="M 0 -25 C 25 -25, 50 -5, 50 45 C 50 45, 25 20, 0 20 C -25 20, -50 45, -50 45 C -50 -5, -25 -25, 0 -25 Z" fill="#FFA200" opacity="0.5"/>
    <path d="M -20 5 C -35 20, -42 35, -45 42 C -40 20, -25 5, -20 5 Z" fill="#FFE169" opacity="0.4"/>

    <!-- Handle on top of Dome -->
    <ellipse cx="0" cy="-33" rx="10" ry="5" fill="#FFE169"/>
    <rect x="-3" y="-39" width="6" height="8" rx="2" fill="#FFB703"/>

    <!-- Emanating warmth / heart symbol (Hospitality/Warm Reception) -->
    <g transform="translate(0, -65)" opacity="0.9">
      <path d="M 0 -5 C -12 -18, -25 -5, 0 18 C 25 -5, 12 -18, 0 -5 Z" fill="#FF5470"/>
    </g>
    
    <!-- Sparkles of warmth and excellence -->
    <path d="M -55 -20 L -50 -25 L -45 -20 L -50 -15 Z" fill="#FFE169"/>
    <path d="M 55 -10 L 60 -15 L 65 -10 L 60 -5 Z" fill="#FFE169"/>
  </g>
</svg>