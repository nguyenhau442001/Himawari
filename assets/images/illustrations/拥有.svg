<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- House Structure -->
  <path d="M40 180 L200 180 L200 100 L120 40 L40 100 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M120 40 L200 100 L180 100 L120 55 Z" fill="#475569"/>
  
  <!-- Windows -->
  <rect x="60" y="110" width="30" height="30" fill="#fbbf24" rx="4"/>
  <rect x="150" y="110" width="30" height="30" fill="#fbbf24" rx="4"/>
  <rect x="105" y="130" width="30" height="50" fill="#1e293b" stroke="#fbbf24" stroke-width="2" rx="4"/>
  
  <!-- Character -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="-30" r="12" fill="#fcd34d"/>
    <path d="M-15 -15 L15 -15 L10 10 L-10 10 Z" fill="#38bdf8"/>
    <path d="M-5 10 L-5 25 M5 10 L5 25" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 25 L-10 35 M10 25 L10 35" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <!-- Arms gesturing to house -->
    <path d="M-15 -5 L-30 0" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 -5 L30 0" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Garden/Ground -->
  <path d="M20 180 Q120 170 220 180 L220 220 L20 220 Z" fill="#10b981" opacity="0.3"/>
  <circle cx="40" cy="190" r="8" fill="#ec4899"/>
  <circle cx="190" cy="195" r="6" fill="#fb923c"/>
</svg>