<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for focus -->
  <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Visual Metaphor for "上述" (Already stated above / referenced content): 
       A floating document/scroll with highlighted upper sections, connected by a curving upward-pointing directional arc/arrow indicating backward/upward reference to text previously read. -->

  <!-- Base Document Card -->
  <g transform="translate(60, 50)">
    <!-- Document background -->
    <rect x="0" y="0" width="120" height="140" rx="8" fill="#222831" stroke="#393E46" stroke-width="2"/>
    
    <!-- Header / "Above" Section (Highlighted with accent color for "上述") -->
    <rect x="14" y="16" width="92" height="36" rx="4" fill="#FFB703" fill-opacity="0.15" stroke="#FFB703" stroke-width="1.5"/>
    <line x1="24" y1="26" x2="84" y2="26" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="38" x2="64" y2="38" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Subsequent body sections (Lower down, dimmed/standard) -->
    <line x1="16" y1="68" x2="96" y2="68" stroke="#4Ecca3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="16" y1="82" x2="80" y2="82" stroke="#4Ecca3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    
    <line x1="16" y1="104" x2="96" y2="104" stroke="#4Ecca3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="16" y1="118" x2="70" y2="118" stroke="#4Ecca3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Upward/Backward Reference Arc and Magnifier / Focus Element -->
  <g>
    <!-- Curved arrow looping from lower area pointing back UP to the upper referenced block -->
    <path d="M 80,140 C 40,140 35,90 68,66" fill="none" stroke="#FFB703" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
    
    <!-- Arrowhead pointing up at the upper section -->
    <polygon points="65,60 76,64 71,73" fill="#FFB703"/>
    
    <!-- Focus Indicator / Checkmark badge representing confirmation of the referenced clause -->
    <circle cx="170" cy="70" r="18" fill="#FFB703"/>
    <path d="M 163,70 L 168,75 L 178,63" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>