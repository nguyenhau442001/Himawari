<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Light Glow -->
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Holographic/Projected "Problem" Glow (Front vs Back) -->
    <linearGradient id="frontGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    
    <linearGradient id="backGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Effects -->
  <circle cx="120" cy="120" r="100" fill="url(#deskGlow)" />

  <!-- Background Environment (Office/Study Room) -->
  <!-- Bookshelf & Props in background -->
  <g opacity="0.4">
    <rect x="25" y="45" width="40" height="70" rx="4" fill="#334155" />
    <rect x="30" y="55" width="30" height="6" fill="#475569" />
    <rect x="30" y="70" width="25" height="6" fill="#64748b" />
    <rect x="30" y="85" width="28" height="6" fill="#cbd5e1" />
    
    <!-- Window with night city silhouette -->
    <rect x="170" y="35" width="45" height="65" rx="6" fill="#090d16" stroke="#334155" stroke-width="2" />
    <path d="M175 60 h35 v35 h-35 z" fill="#1e293b" opacity="0.5" />
    <rect x="182" y="45" width="8" height="12" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="195" y="70" width="10" height="15" rx="1" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Desk Surface -->
  <path d="M 20 185 L 220 185 L 230 210 L 10 210 Z" fill="#0f172a" />
  <path d="M 20 185 L 220 185" stroke="#334155" stroke-width="3" />

  <!-- MAIN SCENE: The Problem & Its Flip Side ("反面") -->
  <!-- We show a clever metaphor: A floating physical complex problem block/puzzle. 
       The front side is orderly and bright (cyan/blue), but the character is pointing 
       at the flipped, chaotic, hidden rear/underside (pink/orange/shadowed). -->

  <!-- Floating Hologram / Conceptual Puzzle (The "Problem") -->
  <g transform="translate(120, 115)" filter="url(#shadow)">
    
    <!-- Back Side Glow / Shadow casting behind -->
    <path d="M -25 -45 L 35 -35 L 25 35 L -35 25 Z" fill="url(#backGlow)" />

    <!-- Isometric Problem Block - Base Structure -->
    <!-- BACK / REVERSE SIDE (The '反面' - focal point) -->
    <g>
      <!-- Underside/Reverse panel angled towards viewer -->
      <path d="M -30 10 L 15 35 L 45 5 L 0 -20 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />
      
      <!-- Tangled gears / warning elements on the reverse side showing 'the other side of the issue' -->
      <circle cx="0" cy="8" r="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <path d="M -5 8 L 5 8 M 0 3 L 0 13" stroke="#ec4899" stroke-width="2" />
      
      <circle cx="20" cy="18" r="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.5" />
      <path d="M 16 18 L 24 18" stroke="#fb923c" stroke-width="1.5" />

      <!-- Warning/Complex jagged lines on the reverse -->
      <path d="M -15 -5 L -5 0 L -10 5 L -20 0 Z" fill="#ec4899" opacity="0.8" />
      <path d="M 10 -10 L 25 -5" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- FRONT SIDE (Bright, orderly face - turned slightly away/up) -->
    <g opacity="0.7">
      <path d="M -30 -40 L 15 -15 L 0 -20 L -45 -45 Z" fill="#1e293b" />
      <path d="M -45 -45 L 0 -20 L 0 10 L -45 -15 Z" fill="url(#frontGlow)" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Neat grid on front -->
      <rect x="-35" y="-35" width="8" height="8" rx="1" fill="#38bdf8" />
      <rect x="-22" y="-28" width="8" height="8" rx="1" fill="#38bdf8" />
      <rect x="-35" y="-20" width="8" height="8" rx="1" fill="#38bdf8" />
    </g>

    <!-- Floating Sparkles / Insight particles -->
    <circle cx="-40" cy="-10" r="2.5" fill="#fbbf24" />
    <circle cx="45" cy="-25" r="2" fill="#38bdf8" />
    <circle cx="30" y="30" r="3" fill="#ec4899" />
  </g>

  <!-- CHARACTER: Curious Student / Analyst -->
  <!-- Sitting/Standing near the desk, pointing directly at the 'reverse side' -->
  <g transform="translate(65, 120)">
    <!-- Character Body / Torso -->
    <path d="M 10 70 C 10 50, 25 40, 40 40 C 55 40, 70 50, 70 70 L 75 95 L 5 95 Z" fill="#3b82f6" />
    <!-- Collar / Shirt detail -->
    <path d="M 30 40 L 40 52 L 50 40 Z" fill="#f8fafc" />

    <!-- Head -->
    <circle cx="40" cy="20" r="18" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 22 20 C 22 8, 32 3, 42 4 C 55 5, 58 14, 58 22 C 58 22, 55 18, 48 16 C 40 14, 32 18, 22 20 Z" fill="#1e293b" />
    <!-- Friendly, analytical expression (eyes wide, focused) -->
    <circle cx="34" cy="19" r="2" fill="#1e293b" />
    <circle cx="46" cy="19" r="2" fill="#1e293b" />
    <!-- Mouth open slightly in realization -->
    <path d="M 39 26 Q 41 29 43 26 Z" fill="#9a3412" />
    <!-- Eyebrows raised -->
    <path d="M 32 14 Q 35 12 37 15" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 43 15 Q 45 12 48 14" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Back Arm (resting) -->
    <path d="M 15 50 Q 0 65, 10 80" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="10" cy="80" r="5" fill="#fed7aa" />

    <!-- Front Arm & Hand (Pointing intently at the REVERSE side of the problem) -->
    <!-- Shoulder to elbow -->
    <path d="M 65 50 Q 85 45, 95 30" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Forearm pointing at the underside/back -->
    <path d="M 95 30 Q 105 20, 115 15" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Pointing Finger -->
    <circle cx="118" cy="14" r="3.5" fill="#fed7aa" />
  </g>

  <!-- Desk Props for Context -->
  <g transform="translate(140, 175)">
    <!-- Open Notebook / Documents -->
    <path d="M 0 10 L 35 0 L 55 15 L 20 25 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 35 0 L 35 25 L 55 15 Z" fill="#e2e8f0" />
    <!-- Scribble lines on paper -->
    <line x1="8" y1="12" x2="20" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="17" x2="25" y2="13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Coffee Mug -->
    <rect x="-25" y="2" width="16" height="20" rx="3" fill="#f43f5e" />
    <path d="M -9 7 C -4 7, -4 17, -9 17" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    <!-- Steam -->
    <path d="M -20 -3 Q -17 -8, -20 -13" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M -15 -5 Q -12 -10, -15 -15" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Accent lighting highlight on top frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" />
</svg>