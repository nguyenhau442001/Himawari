<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Textures & Colors -->
    <linearGradient id="woodBench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="clayVase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Workshop Interior Environment / Back Wall -->
  <rect x="20" y="25" width="200" height="150" rx="6" fill="#090d16" opacity="0.6"/>
  
  <!-- Window lattice with warm exterior light -->
  <g opacity="0.4">
    <rect x="155" y="45" width="45" height="60" rx="4" fill="#38bdf8" opacity="0.15"/>
    <path d="M155 75 H200 M177 45 V105" stroke="#64748b" stroke-width="2"/>
    <rect x="155" y="45" width="45" height="60" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Hanging Tools & Shelves in Background -->
  <path d="M35 50 H95" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Small hanging props -->
  <circle cx="50" cy="58" r="4" fill="#64748b"/>
  <path d="M75 50 V68" stroke="#64748b" stroke-width="1.5"/>
  <rect x="70" y="68" width="10" height="15" rx="2" fill="#475569"/>

  <!-- Atmospheric Glow over Crafting Area -->
  <circle cx="120" cy="130" r="90" fill="url(#lanternGlow)"/>

  <!-- Workbench -->
  <path d="M25 165 H215 V175 H25 Z" fill="url(#woodBench)"/>
  <rect x="35" y="175" width="14" height="40" fill="#78350f" rx="2"/>
  <rect x="191" y="175" width="14" height="40" fill="#78350f" rx="2"/>

  <!-- Craft Props on Bench (Clay Pottery & Tools) -->
  <g transform="translate(0, 5)">
    <!-- Extra unfinished pot -->
    <ellipse cx="55" cy="155" rx="12" ry="4" fill="#78350f"/>
    <path d="M44 155 Q43 140 55 138 Q67 140 66 155 Z" fill="#9a3412"/>
    
    <!-- Pottery Wheel Base -->
    <ellipse cx="120" cy="162" rx="35" ry="6" fill="#334155"/>
    <ellipse cx="120" cy="160" rx="32" ry="4" fill="#64748b"/>
    <!-- Wet Clay on Wheel being shaped -->
    <path d="M102 160 C102 142 108 135 120 132 C132 135 138 142 138 160 Z" fill="url(#clayVase)"/>
    <ellipse cx="120" cy="132" rx="6" ry="2" fill="#fdba74"/>
  </g>

  <!-- CHARACTER 1: Master (师傅) - Experienced, older, guiding -->
  <g id="master-character">
    <!-- Master Body / Torso -->
    <path d="M70 170 Q65 140 85 125 L105 135 L110 170 Z" fill="#1e3a8a"/> <!-- Deep blue traditional tunic -->
    <path d="M85 125 L98 140 L80 165 Z" fill="#2563eb" opacity="0.6"/> <!-- Robe lapel -->

    <!-- Master Head & Face -->
    <circle cx="78" cy="105" r="15" fill="#fbcfe8"/> <!-- Skin base -->
    <path d="M66 102 Q75 90 90 98 Q88 115 70 115 Z" fill="#f8fafc"/> <!-- Graying hair & beard bun -->
    <path d="M70 98 Q78 92 86 98" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/> <!-- Hair line -->
    <!-- Gentle focused expression -->
    <path d="M73 105 Q77 102 81 105" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="75" cy="108" r="1.5" fill="#0f172a"/>
    <circle cx="83" cy="108" r="1.5" fill="#0f172a"/>
    <path d="M77 113 Q79 115 81 113" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/> <!-- Smile -->

    <!-- Master Arms guiding the apprentice -->
    <!-- Back arm -->
    <path d="M80 135 Q70 145 95 152" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round"/>
    <!-- Front arm reaching over to hands -->
    <path d="M90 130 Q105 130 112 145" fill="none" stroke="#1e3a8a" stroke-width="11" stroke-linecap="round"/>
    <!-- Master's Hand overlaying apprentice's hands on the clay -->
    <circle cx="114" cy="147" r="5" fill="#fbcfe8"/>
  </g>

  <!-- CHARACTER 2: Apprentice (徒弟) - Younger, focused, learning -->
  <g id="apprentice-character">
    <!-- Apprentice Body / Torso -->
    <path d="M140 170 Q145 135 130 120 L110 130 L115 170 Z" fill="#047857"/> <!-- Green tunic -->
    <path d="M125 122 L115 135 L135 155 Z" fill="#059669"/>

    <!-- Apprentice Head & Face -->
    <circle cx="138" cy="102" r="14" fill="#fbcfe8"/>
    <!-- Dark youthful hair -->
    <path d="M126 100 Q138 88 150 98 Q148 108 130 108 Z" fill="#334155"/>
    <!-- Intentional, attentive look -->
    <circle cx="134" cy="105" r="1.5" fill="#0f172a"/>
    <circle cx="142" cy="105" r="1.5" fill="#0f172a"/>
    <path d="M136 111 Q138 113 140 111" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Apprentice Arms holding the clay -->
    <path d="M130 130 Q125 142 118 147" fill="none" stroke="#047857" stroke-width="10" stroke-linecap="round"/>
    <!-- Hands clasping the clay together with master -->
    <circle cx="117" cy="148" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Action Focus Sparkles / Crafting Energy (Representing 'Passing on the skill') -->
  <g opacity="0.9">
    <path d="M120 120 L122 126 L128 128 L122 130 L120 136 L118 130 L112 128 L118 126 Z" fill="#fbbf24"/>
    <path d="M98 128 L99 131 L102 132 L99 133 L98 136 L97 133 L94 132 L97 131 Z" fill="#38bdf8" transform="scale(0.8) translate(30, 20)"/>
  </g>

  <!-- Foreground Atmospheric Vignette / Frame enhancement -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>