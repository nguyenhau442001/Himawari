<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow representing call activity / signal waves -->
  <circle cx="120" cy="120" r="75" fill="none" stroke="#2D3748" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  
  <!-- Modern Smartphone / Telephone Object -->
  <g transform="translate(75, 45)">
    <!-- Phone Body (Sleek dark frame with rounded corners) -->
    <rect x="0" y="0" width="90" height="150" rx="16" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Screen -->
    <rect x="8" y="14" width="74" height="122" rx="8" fill="#0F1115"/>
    
    <!-- Speaker Notch / Top Camera -->
    <rect x="35" y="6" width="20" height="4" rx="2" fill="#4A5568"/>
    
    <!-- UI elements on screen: Active "Busy Line" Call Interface -->
    <!-- Caller Avatar Placeholder -->
    <circle cx="45" cy="48" r="16" fill="#E2E8F0" opacity="0.15"/>
    <circle cx="45" cy="44" r="7" fill="#E2E8F0" opacity="0.8"/>
    <path d="M 33 65 C 33 58, 57 58, 57 65 Z" fill="#E2E8F0" opacity="0.8"/>
    
    <!-- "Busy / Occupied" Status Indicator (Orange/Gold focus color per prompt rules) -->
    <rect x="22" y="76" width="46" height="6" rx="3" fill="#F6AD55"/>
    
    <!-- Call Timer / Waveform representation -->
    <rect x="30" y="88" width="30" height="3" rx="1.5" fill="#4A5568"/>
    
    <!-- Call Action Buttons at bottom of screen -->
    <!-- Decline / End Call Button (Red accent for busy context) -->
    <circle cx="45" cy="116" r="10" fill="#FC8181"/>
    <!-- Phone handset icon inside button -->
    <path d="M 40 114 C 40 113, 42 112, 43 113 L 44 114 C 44.5 114.5, 44.5 115.5, 44 116 C 43.5 116.5, 42.5 116.5, 42 116 L 41 115 Z" fill="#FFFFFF" transform="rotate(135 43 115)"/>
  </g>

  <!-- Signal / Connection Waves (Top right of phone) -->
  <path d="M 175 60 C 182 67, 182 77, 175 84" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 181 54 C 192 65, 192 79, 181 90" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Busy Signal Indicator Badge (Subtle modern dot in corner) -->
  <circle cx="185" cy="45" r="6" fill="#F6AD55"/>
  <circle cx="185" cy="45" r="10" fill="none" stroke="#F6AD55" stroke-width="1.5" opacity="0.5"/>
</svg>