<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Distant Mountain Range -->
  <path d="M40 180 L80 110 L120 160 L160 90 L200 180 Z" fill="#2C3E50" stroke="#34495E" stroke-width="2"/>
  <path d="M50 180 L90 130 L130 170 L170 110 L210 180 Z" fill="#34495E" stroke="#455A64" stroke-width="2"/>
  
  <!-- The Teacher Figure -->
  <g transform="translate(120, 180)">
    <circle cx="0" cy="-45" r="8" fill="#F39C12"/> <!-- Head -->
    <path d="M-10 -35 L10 -35 L8 -15 L-8 -15 Z" fill="#F39C12"/> <!-- Body -->
    <path d="M-8 -25 L-15 -10 M8 -25 L15 -10" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/> <!-- Arms -->
    <path d="M-4 -15 L-4 0 M4 -15 L4 0" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/> <!-- Legs -->
  </g>
  
  <!-- Path leading to the distance -->
  <path d="M120 180 L140 240" stroke="#F39C12" stroke-width="3" stroke-dasharray="6 6"/>
  
  <!-- Sun/Horizon accent -->
  <circle cx="180" cy="70" r="15" fill="#F39C12" opacity="0.8"/>
</svg>