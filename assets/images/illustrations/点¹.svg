<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Clock Body -->
  <circle cx="120" cy="115" r="70" fill="#222730" stroke="#3A4252" stroke-width="6"/>
  
  <!-- Clock Inner Face Gradient/Shadow Effect -->
  <circle cx="120" cy="115" r="62" fill="#1E232C"/>

  <!-- Clock Hour Markers -->
  <line x1="120" y1="59" x2="120" y2="65" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="165" x2="120" y2="171" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="115" x2="70" y2="115" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="115" x2="176" y2="115" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>

  <!-- Clock Hands (Showing an explicit time, e.g., 3 o'clock / hour focus) -->
  <!-- Hour hand -->
  <line x1="120" y1="115" x2="120" y2="85" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="120" y1="115" x2="155" y2="115" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center Pin -->
  <circle cx="120" cy="115" r="6" fill="#F59E0B"/>

  <!-- Focus/Highlight Dot (Visualizing the semantic meaning of "点" as a specific hour/point in time) -->
  <circle cx="120" cy="59" r="5" fill="#FFFFFF"/>
</svg>