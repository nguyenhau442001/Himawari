<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background building facade with multiple doors representing houses/households -->
  <g opacity="0.15">
    <rect x="30" y="50" width="180" height="150" rx="4" fill="#64748B"/>
    <!-- Floor divider -->
    <line x1="30" y1="125" x2="210" y2="125" stroke="#1A1D24" stroke-width="4"/>
    <!-- Windows -->
    <rect x="50" y="70" width="24" height="30" rx="2" fill="#E2E8F0"/>
    <rect x="90" y="70" width="24" height="30" rx="2" fill="#E2E8F0"/>
    <rect x="166" y="70" width="24" height="30" rx="2" fill="#E2E8F0"/>
    <rect x="50" y="145" width="24" height="30" rx="2" fill="#E2E8F0"/>
    <rect x="126" y="145" width="24" height="30" rx="2" fill="#E2E8F0"/>
    <rect x="166" y="145" width="24" height="30" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Door 1 (Left background) -->
  <rect x="120" y="65" width="36" height="60" rx="2" fill="#334155"/>
  <circle cx="148" cy="97" r="2" fill="#F59E0B"/>

  <!-- Door 2 (Foreground center) -->
  <rect x="100" y="115" width="48" height="85" rx="3" fill="#475569"/>
  <path d="M100 115 H148 V120 H100 Z" fill="#64748B"/>
  <circle cx="138" cy="158" r="3" fill="#F59E0B"/>
  <!-- Open door effect -->
  <path d="M100 115 L80 125 V190 L100 200 Z" fill="#334155" opacity="0.8"/>

  <!-- Pathway / Ground -->
  <path d="M20 200 H220 V210 H20 Z" fill="#0F172A"/>

  <!-- Volunteer visiting (representing "挨家挨户" - going door-to-door) -->
  <!-- Volunteer character -->
  <g transform="translate(60, 120)">
    <!-- Body / Vest (Volunteer uniform) -->
    <path d="M25 45 L15 80 H35 L38 55 Z" fill="#F59E0B"/>
    <!-- Head -->
    <circle cx="27" cy="22" r="9" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M19 19 C19 14, 23 12, 27 12 C32 12, 35 15, 35 20 Z" fill="#334155"/>
    <!-- Torso -->
    <rect x="18" y="31" width="18" height="25" rx="4" fill="#3B82F6"/>
    <!-- Arm reaching out to knock/interact -->
    <path d="M27 38 L48 44" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50" cy="45" r="3.5" fill="#E2E8F0"/>
    <!-- Legs -->
    <path d="M21 56 L18 80" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <path d="M31 56 L34 80" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Resident opening the door -->
  <g transform="translate(108, 125)">
    <!-- Head -->
    <circle cx="14" cy="16" r="8" fill="#CBD5E1"/>
    <!-- Torso inside doorway -->
    <rect x="7" y="24" width="16" height="51" rx="3" fill="#0EA5E9"/>
  </g>

  <!-- Motion lines indicating progression / sequence of doors -->
  <path d="M40 100 Q75 80 110 105" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M140 105 Q175 80 200 100" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  <polygon points="113,103 118,108 110,111" fill="#F59E0B"/>

</svg>