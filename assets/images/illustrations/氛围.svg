<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Lighting / "氛围" Ambiance Effect -->
  <defs>
    <!-- Soft warm library glow overlay -->
    <radialGradient id="studyAmbiance" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Desk lamp beam -->
    <linearGradient id="lampBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background Ambiance Glow -->
    <rect width="240" height="240" fill="url(#studyAmbiance)"/>

    <!-- LIBRARY ENVIRONMENT (Physical setting defining the "bầu không khí") -->
    <!-- Background Bookshelves -->
    <rect x="36" y="50" width="168" height="90" fill="#222632" rx="4"/>
    <!-- Shelf dividers & books -->
    <rect x="42" y="60" width="156" height="3" fill="#161920"/>
    <!-- Books group left -->
    <rect x="48" y="70" width="10" height="30" fill="#2E3544"/>
    <rect x="60" y="68" width="14" height="32" fill="#3B4252"/>
    <rect x="76" y="72" width="8" height="28" fill="#4C566A"/>
    <rect x="86" y="66" width="12" height="34" fill="#2E3544"/>
    <!-- Books group middle -->
    <rect x="130" y="68" width="16" height="32" fill="#4C566A"/>
    <rect x="148" y="70" width="10" height="30" fill="#3B4252"/>
    <rect x="160" y="66" width="14" height="34" fill="#2E3544"/>

    <!-- Second Shelf -->
    <rect x="42" y="105" width="156" height="3" fill="#161920"/>
    <!-- Books group lower -->
    <rect x="48" y="112" width="12" height="28" fill="#3B4252"/>
    <rect x="62" y="110" width="18" height="30" fill="#2E3544"/>
    <rect x="170" y="112" width="14" height="28" fill="#4C566A"/>

    <!-- Desk Surface -->
    <rect x="28" y="170" width="184" height="12" fill="#2C3240" rx="2"/>
    <rect x="40" y="182" width="160" height="6" fill="#1E232D"/>

    <!-- Lamp Beam Projection -->
    <polygon points="120,40 75,170 165,170" fill="url(#lampBeam)"/>

    <!-- Central Character (Student immersed in the quiet, focused atmosphere) -->
    <!-- Chair back -->
    <rect x="105" y="125" width="30" height="50" fill="#3B4252" rx="4"/>
    
    <!-- Character Torso & Shoulders -->
    <path d="M 92 170 Q 120 155 148 170 L 155 185 L 85 185 Z" fill="#3B82F6"/>

    <!-- Character Neck -->
    <rect x="113" y="132" width="14" height="18" fill="#D1D5DB"/>

    <!-- Character Head -->
    <circle cx="120" cy="120" r="16" fill="#E5E7EB"/>
    
    <!-- Hair (Focused posture, head slightly bowed) -->
    <path d="M 104 120 C 104 108 112 102 120 102 C 128 102 136 108 136 120 L 136 126 L 104 126 Z" fill="#1F2937"/>

    <!-- Open Book on Desk -->
    <path d="M 100 160 L 120 155 L 140 160 L 140 172 L 120 168 L 100 172 Z" fill="#F3F4F6"/>
    <!-- Book Spine/Center -->
    <line x1="120" y1="155" x2="120" y2="168" stroke="#D1D5DB" stroke-width="1.5"/>
    <!-- Abstract text lines in book -->
    <line x1="105" y1="163" x2="115" y2="161" stroke="#9CA3AF" stroke-width="1"/>
    <line x1="125" y1="161" x2="135" y2="163" stroke="#9CA3AF" stroke-width="1"/>

    <!-- Desk Lamp (Modern, sleek) -->
    <!-- Lamp base -->
    <ellipse cx="165" cy="170" rx="10" ry="3" fill="#4B5563"/>
    <!-- Lamp arm -->
    <path d="M 165 170 L 165 55 L 130 40" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp shade -->
    <path d="M 115 35 L 135 35 L 142 45 L 108 45 Z" fill="#FBBF24"/>
    <!-- Lamp bulb glow -->
    <circle cx="125" cy="45" r="4" fill="#FEF3C7"/>

    <!-- Peaceful / Focused Ambiance Floating Elements (Subtle particulate/focus cues) -->
    <circle cx="85" cy="95" r="1.5" fill="#FBBF24" opacity="0.6"/>
    <circle cx="155" cy="85" r="2" fill="#FBBF24" opacity="0.4"/>
    <circle cx="95" cy="135" r="1" fill="#FBBF24" opacity="0.8"/>
    <circle cx="145" cy="125" r="1.5" fill="#3B82F6" opacity="0.5"/>
    <circle cx="120" cy="80" r="1" fill="#FBBF24" opacity="0.7"/>

  </g>
</svg>