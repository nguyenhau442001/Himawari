<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Base Line -->
  <rect x="40" y="200" width="160" height="3" rx="1.5" fill="#334155"/>
  
  <!-- Background Greenery (Lush Environment) -->
  <circle cx="65" cy="185" r="22" fill="#064E3B"/>
  <circle cx="175" cy="190" r="18" fill="#065F46"/>
  
  <!-- Main Residential Building (Modern Apartment Style) -->
  <rect x="85" y="55" width="70" height="145" rx="2" fill="#475569"/>
  <!-- Building Depth/Shadow Side -->
  <path d="M155 70 L170 85 V200 H155 Z" fill="#334155"/>
  <!-- Roof Detail -->
  <path d="M85 55 L100 40 H170 L155 55 Z" fill="#64748B"/>
  
  <!-- Lit Windows (Representing Living Spaces/Life) -->
  <!-- Row 1 -->
  <rect x="95" y="70" width="12" height="12" rx="1" fill="#FBBF24"/>
  <rect x="114" y="70" width="12" height="12" rx="1" fill="#FBBF24"/>
  <rect x="133" y="70" width="12" height="12" rx="1" fill="#FBBF24"/>
  <!-- Row 2 -->
  <rect x="95" y="95" width="12" height="12" rx="1" fill="#FBBF24" fill-opacity="0.8"/>
  <rect x="114" y="95" width="12" height="12" rx="1" fill="#FBBF24"/>
  <rect x="133" y="95" width="12" height="12" rx="1" fill="#FBBF24" fill-opacity="0.6"/>
  <!-- Row 3 -->
  <rect x="95" y="120" width="12" height="12" rx="1" fill="#FBBF24"/>
  <rect x="114" y="120" width="12" height="12" rx="1" fill="#FBBF24" fill-opacity="0.9"/>
  <rect x="133" y="120" width="12" height="12" rx="1" fill="#FBBF24"/>
  <!-- Row 4 -->
  <rect x="95" y="145" width="12" height="12" rx="1" fill="#FBBF24" fill-opacity="0.7"/>
  <rect x="114" y="145" width="12" height="12" rx="1" fill="#FBBF24"/>
  <rect x="133" y="145" width="12" height="12" rx="1" fill="#FBBF24"/>
  
  <!-- Entrance -->
  <rect x="110" y="175" width="20" height="25" rx="1" fill="#1E293B"/>
  
  <!-- Foreground Greenery (Lush/宜居 Context) -->
  <circle cx="55" cy="195" r="15" fill="#059669"/>
  <circle cx="185" cy="195" r="20" fill="#10B981"/>
  <circle cx="160" cy="200" r="12" fill="#34D399"/>
  <circle cx="80" cy="202" r="10" fill="#10B981"/>
