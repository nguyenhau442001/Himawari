<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Background Container with Deep Slate/Navy Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements / Workshop / Heritage Studio Context -->
  <!-- Wooden Roof Beam & Traditional Architecture Details -->
  <path d="M0 45 L120 15 L240 45 L240 35 L120 5 L0 35 Z" fill="#334155" />
  <rect x="0" y="40" width="240" height="6" fill="#0f172a" opacity="0.6" />

  <!-- Background Wall Panel (Warm dark gray with subtle pattern) -->
  <rect x="20" y="46" width="200" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Traditional window lattice silhouette in background -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.5">
    <line x1="170" y1="70" x2="210" y2="70" />
    <line x1="170" y1="90" x2="210" y2="90" />
    <line x1="170" y1="110" x2="210" y2="110" />
    <line x1="190" y1="55" x2="190" y2="125" />
  </g>

  <!-- Hanging Red Traditional Lanterns (Symbolizing Tradition/Heritage) -->
  <circle cx="45" cy="80" r="22" fill="url(#lanternGlow)" />
  <path d="M40 55 H50 V60 H40 Z" fill="#d97706" />
  <ellipse cx="45" cy="75" rx="14" ry="18" fill="#ef4444" />
  <path d="M37 70 Q45 65 53 70 Q45 80 37 70 Z" fill="#f87171" opacity="0.6" />
  <path d="M40 93 H50 V97 H40 Z" fill="#d97706" />
  <line x1="45" y1="45" x2="45" y2="55" stroke="#94a3b8" stroke-width="1" />

  <!-- Workbench (Foreground Context) -->
  <rect x="25" y="165" width="190" height="12" fill="url(#woodGrad)" rx="2" />
  <rect x="35" y="177" width="12" height="40" fill="#451a03" />
  <rect x="193" y="177" width="12" height="40" fill="#451a03" />

  <!-- Craft / Heritage Props on Desk: Inkstone, Scroll, Calligraphy Brush -->
  <!-- Scroll/Paper being worked on -->
  <path d="M70 160 L125 155 L128 167 L73 172 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
  <line x1="78" y1="163" x2="115" y2="160" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <line x1="82" y1="167" x2="110" y2="164" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  
  <!-- Inkstone & Brush -->
  <ellipse cx="145" cy="165" rx="12" ry="6" fill="#475569" />
  <ellipse cx="145" cy="164" rx="8" ry="3" fill="#0f172a" />
  <path d="M135 155 L160 142" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  <path d="M158 143 L162 140" stroke="#1e293b" stroke-width="2" />

  <!-- Two Energetic Characters (Mentorship / Passing down the tradition, embodying 发扬) -->
  <!-- Character 1 (Older/Master - Teaching/Guiding) -->
  <g id="master-character">
    <!-- Body/Torso -->
    <path d="M65 140 C65 125 75 115 90 115 C105 115 115 125 115 140 L120 170 H60 Z" fill="#0284c7" />
    <path d="M90 115 L90 145" stroke="#0369a1" stroke-width="2" />
    <!-- Collar (Traditional wrap) -->
    <path d="M78 115 L90 130 L102 115" fill="#f8fafc" />
    <!-- Head -->
    <circle cx="90" cy="98" r="15" fill="#fbcfe8" />
    <!-- Hair (Graying at temples) -->
    <path d="M75 98 C75 88 105 88 105 98 C105 95 100 85 90 85 C80 85 75 95 75 98 Z" fill="#64748b" />
    <!-- Friendly smiling face, warm expression -->
    <circle cx="85" cy="97" r="1.5" fill="#334155" />
    <circle cx="95" cy="97" r="1.5" fill="#334155" />
    <path d="M88 102 Q90 105 92 102" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Master's Arms pointing forward/guiding -->
    <path d="M68 130 Q80 135 95 130" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="95" cy="130" r="5" fill="#fbcfe8" />
  </g>

  <!-- Character 2 (Younger/Apprentice - Actively carrying/elevating the tradition) -->
  <g id="apprentice-character">
    <!-- Body/Torso - Vibrant energy (Orange/Amber clothing) -->
    <path d="M130 135 C130 120 140 112 155 112 C170 112 180 120 180 135 L185 170 H125 Z" fill="#ea580c" />
    <!-- Collar -->
    <path d="M143 112 L155 128 L167 112" fill="#fef08a" />
    <!-- Head -->
    <circle cx="155" cy="95" r="16" fill="#fbcfe8" />
    <!-- Hair (Youthful dark hair) -->
    <path d="M139 93 C139 80 171 80 171 93 C171 88 165 77 155 77 C145 77 139 88 139 93 Z" fill="#1e293b" />
    <!-- Expressive sparkling face -->
    <circle cx="150" cy="94" r="1.5" fill="#1e293b" />
    <circle cx="160" cy="94" r="1.5" fill="#1e293b" />
    <path d="M153 100 Q155 104 157 100" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Active Gesture: Raising a traditional artifact/paper kite or heritage item aloft proudly -->
    <!-- Arm reaching up holding the prop -->
    <path d="M170 120 Q185 100 175 75" stroke="#ea580c" stroke-width="9" stroke-linecap="round" fill="none" />
    <circle cx="175" cy="75" r="5" fill="#fbcfe8" />
  </g>

  <!-- The Heritage Object being "fāyáng" (Elevated / Promoted / Celebrated) -->
  <!-- Traditional Swallow Kite / Artisan Paperwork symbolizing cultural spirit lifted high -->
  <g transform="translate(165, 45)">
    <!-- Golden glow behind the lifted tradition object -->
    <circle cx="10" cy="20" r="25" fill="url(#lanternGlow)" />
    <!-- Swallow Kite Structure (Classic Chinese traditional motif) -->
    <path d="M10 5 Q25 -5 40 10 Q25 15 10 35 Q-5 15 -20 10 Q-5 -5 10 5 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <path d="M10 5 Q10 20 10 35" stroke="#b45309" stroke-width="1" fill="none" />
    <!-- Decorative wings accents -->
    <path d="M0 8 Q10 12 20 8" stroke="#ef4444" stroke-width="2" fill="none" />
    <path d="M-10 12 Q10 22 30 12" stroke="#10b981" stroke-width="2" fill="none" />
    <!-- Kite tail flowing down toward characters -->
    <path d="M10 35 Q15 45 5 55 Q10 65 10 75" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Dynamic Sparkles / Energy bursts representing "carrying forward / vitality" -->
  <g fill="#fbbf24">
    <circle cx="130" cy="55" r="2.5" />
    <circle cx="205" cy="70" r="2" />
    <circle cx="215" cy="40" r="3" />
    <path d="M115 70 L117 75 L122 77 L117 79 L115 84 L113 79 L108 77 L113 75 Z" opacity="0.8" />
    <path d="M195 100 L196 103 L199 104 L196 105 L195 108 L194 105 L191 104 L194 103 Z" opacity="0.8" />
  </g>

  <!-- Foreground Floor Line for Depth -->
  <rect x="0" y="215" width="240" height="25" fill="#0f172a" />
</svg>