<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Mountain Peak Silhouette Background/Base representing "峰" -->
    <path d="M 60 170 L 120 100 L 180 170 Z" fill="#242B38" />
    <path d="M 90 170 L 120 130 L 150 170 Z" fill="#2D3748" />

    <!-- Stylized Summit Flag / Marker -->
    <line x1="120" y1="100" x2="120" y2="70" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="120,70 142,78 120,86" fill="#F59E0B" />

    <!-- Conference Table (Circular/Oval Summit Table) representing "会" -->
    <ellipse cx="120" cy="180" rx="75" ry="25" fill="#2A3444" stroke="#374151" stroke-width="2"/>
    <ellipse cx="120" cy="176" rx="65" ry="20" fill="#1E2530"/>

    <!-- Leaders / Delegates around the table (Flat Minimalist Avatars) -->
    <!-- Leader 1 (Front Center - Host) -->
    <circle cx="120" cy="195" r="8" fill="#F3F4F6"/>
    <path d="M 108 210 Q 120 202 132 210" fill="#3B82F6"/>

    <!-- Leader 2 (Left) -->
    <circle cx="75" cy="185" r="7" fill="#E5E7EB"/>
    <path d="M 65 198 Q 75 192 85 198" fill="#10B981"/>

    <!-- Leader 3 (Right) -->
    <circle cx="165" cy="185" r="7" fill="#E5E7EB"/>
    <path d="M 155 198 Q 165 192 175 198" fill="#8B5CF6"/>

    <!-- Leader 4 (Far Left) -->
    <circle cx="50" cy="170" r="6" fill="#D1D5DB"/>
    
    <!-- Leader 5 (Far Right) -->
    <circle cx="190" cy="170" r="6" fill="#D1D5DB"/>

    <!-- Global Connection / Summit Highlights (Golden accent dots above table representing high-level dialogue) -->
    <circle cx="100" cy="160" r="2" fill="#F59E0B" opacity="0.8"/>
    <circle cx="120" cy="155" r="3" fill="#F59E0B"/>
    <circle cx="140" cy="160" r="2" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Subtle connecting arc for international cooperation/agreement -->
    <path d="M 90 163 Q 120 150 150 163" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  </g>
</svg>