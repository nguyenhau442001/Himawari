<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Sky Gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="120" y1="20" x2="120" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E263F"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3182CE" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric Sky Background -->
  <circle cx="120" cy="110" r="85" fill="url(#skyGrad)"/>

  <!-- Celestial Body / Atmosphere Accent -->
  <circle cx="170" cy="70" r="16" fill="#F6AD55" opacity="0.9"/>

  <!-- Rain Clouds (Representing 天 好像要下雨了) -->
  <g transform="translate(120, 95)">
    <!-- Back Cloud -->
    <path d="M-35 0 C-35 -15 -15 -20 0 -15 C10 -25 35 -20 40 -5 C50 -5 55 10 45 20 C40 25 35 25 30 25 C15 35 -25 35 -35 20 C-45 15 -45 5 -35 0 Z" fill="#4A5568" opacity="0.6"/>
    
    <!-- Front Cloud (Darker, threatening storm cloud) -->
    <path d="M-45 10 C-45 -8 -20 -15 -5 -10 C5 -22 30 -15 38 2 C48 2 54 18 42 28 C35 34 25 34 15 34 C-5 42 -35 38 -45 25 C-52 20 -52 14 -45 10 Z" fill="#A0AEC0"/>
    
    <!-- Raindrops -->
    <line x1="-25" y1="42" x2="-29" y2="56" stroke="url(#rainGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-5" y1="40" x2="-9" y2="54" stroke="url(#rainGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="44" x2="11" y2="58" stroke="url(#rainGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="38" x2="26" y2="52" stroke="url(#rainGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Stylized Horizon / Landscape Silhouette anchoring the physical space (Ground vs Sky) -->
  <path d="M 40 185 Q 90 175 140 182 T 200 180 L 200 200 L 40 200 Z" fill="#2D3748" opacity="0.7"/>

  <!-- Horizon accent line -->
  <line x1="40" y1="183" x2="200" y2="183" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
</svg>