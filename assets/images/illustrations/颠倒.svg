<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting & background room elements -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <rect x="35" y="30" width="170" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M70 50 L170 50" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Desk Surface -->
  <path d="M20 185 L220 185 L205 215 L35 215 Z" fill="#334155"/>
  <path d="M20 185 L220 185" stroke="#475569" stroke-width="3"/>
  
  <!-- Student Character (Curious/Confused) -->
  <!-- Body/Outfit -->
  <path d="M60 215 C60 190 80 175 100 175 C120 175 140 190 140 215 Z" fill="#3b82f6"/>
  <!-- Head -->
  <circle cx="100" cy="140" r="22" fill="#fed7aa"/>
  <!-- Hair -->
  <path d="M78 135 C78 120 90 115 100 115 C110 115 122 120 122 135 C122 142 118 145 118 145 C118 145 112 125 100 125 C88 125 82 145 82 145 C82 145 78 142 78 135 Z" fill="#334155"/>
  <!-- Expression: Puzzled Eyebrows, Concentrating -->
  <line x1="90" y1="134" x2="96" y2="137" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="137" x2="110" y2="134" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="93" cy="142" r="1.5" fill="#1e293b"/>
  <circle cx="107" cy="142" r="1.5" fill="#1e293b"/>
  <path d="M98 150 Q100 153 102 150" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Arm pointing at reversed sentences -->
  <path d="M125 185 L145 170 L155 175" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="155" cy="175" r="3" fill="#fed7aa"/>

  <!-- Open Notebook / Document on Desk -->
  <g transform="translate(100, 110)">
    <!-- Notebook Base -->
    <path d="M-35 55 L35 55 L35 105 L-35 105 Z" fill="#f8fafc" rx="4"/>
    <!-- Center Fold Shadow -->
    <line x1="0" y1="55" x2="0" y2="105" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Sentence 1 (Swapped/Inverted position: bottom index visually highlighted as first, but visually crossed or pointing out error) -->
    <!-- Sentence Block A (Originally 2nd, now 1st) -->
    <rect x="-30" y="62" width="26" height="6" rx="2" fill="#ef4444" opacity="0.8"/>
    <circle cx="-3" cy="65" r="2" fill="#ef4444"/>
    
    <!-- Sentence Block B (Originally 1st, now 2nd) -->
    <rect x="-30" y="78" width="26" height="6" rx="2" fill="#ef4444" opacity="0.8"/>
    <circle cx="-3" cy="81" r="2" fill="#ef4444"/>

    <!-- Glowing Swap Indicator Arcs showing the reversal -->
    <path d="M -32 71 C -35 60, -15 50, -5 60" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 2" stroke-linecap="round"/>
    <polygon points="-5,60 -10,57 -8,63" fill="#f59e0b"/>

    <path d="M -5 73 C -15 83, -35 80, -32 69" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 2" stroke-linecap="round"/>
    <polygon points="-32,69 -28,73 -32,75" fill="#f59e0b"/>
  </g>

  <!-- Giant floating visualization of the inverted order (Abstract structural blocks representing the two clauses/sentences) -->
  <g transform="translate(145, 60)">
    <!-- Background card for clarity -->
    <rect x="0" y="0" width="70" height="75" rx="10" fill="#334155" stroke="#475569" stroke-width="2"/>
    
    <!-- Block 1 (Red indicator - Arrow pointing down) -->
    <g transform="translate(10, 12)">
      <rect x="0" y="0" width="50" height="18" rx="4" fill="#3b82f6"/>
      <!-- abstract line art for sentence symbols -->
      <line x1="8" y1="9" x2="30" y2="9" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="41" cy="9" r="3" fill="#93c5fd"/>
    </g>

    <!-- Block 2 (Blue indicator - Arrow pointing up) -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="50" height="18" rx="4" fill="#10b981"/>
      <!-- abstract line art for sentence symbols -->
      <line x1="8" y1="9" x2="35" y2="9" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="43" cy="9" r="3" fill="#6ee7b7"/>
    </g>

    <!-- Swap Interchange Arrows on the side -->
    <path d="M 60 25 C 75 35, 75 40, 60 50" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="60,50 66,46 64,53" fill="#f59e0b"/>
    <path d="M 10 38 C -5 28, -5 23, 10 13" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="10,13 4,17 6,10" fill="#f59e0b"/>
  </g>

  <!-- Lamp providing warm focus light on the desk -->
  <path d="M200 40 L180 80 L220 80 Z" fill="#f59e0b" opacity="0.2"/>
  <path d="M190 35 L210 35 L215 45 L185 45 Z" fill="#64748b"/>
  <path d="M200 45 L200 85" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Coffee Cup for desk realism -->
  <rect x="40" y="160" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M56 164 C62 164 62 176 56 176" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Spark / Attention Indicator -->
  <path d="M 115 35 Q 120 25 130 30 Q 120 35 115 45 Q 110 35 100 30 Q 110 25 115 35 Z" fill="#fbbf24"/>
</svg>