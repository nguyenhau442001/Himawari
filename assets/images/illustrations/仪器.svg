<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 仪器 (Precision scientific instrument / laboratory device) -->
  <g transform="translate(0, 0)">
    <!-- Base platform / Laboratory bench -->
    <rect x="40" y="175" width="160" height="12" rx="4" fill="#2D333B"/>
    <rect x="55" y="187" width="130" height="6" rx="2" fill="#22262E"/>

    <!-- Microscope Stand and Body (Precision Instrument representation) -->
    <!-- Vertical pillar -->
    <rect x="105" y="85" width="12" height="90" rx="3" fill="#6E7681"/>
    <!-- Heavy base -->
    <path d="M 90 170 L 150 170 L 140 155 L 100 155 Z" fill="#484F58"/>

    <!-- Optical head & eyepiece tube -->
    <path d="M 85 70 L 125 75 L 125 95 L 85 85 Z" fill="#8B949E"/>
    <!-- Eyepiece -->
    <rect x="70" y="62" width="22" height="14" rx="4" transform="rotate(-15 70 62)" fill="#58A6FF"/>
    <rect x="68" y="58" width="12" height="8" rx="2" transform="rotate(-15 68 58)" fill="#C9D1D9"/>

    <!-- Adjustment knobs (Focus wheels) -->
    <circle cx="126" cy="105" r="8" fill="#F0883E"/>
    <circle cx="126" cy="105" r="4" fill="#2D333B"/>
    <circle cx="98" cy="115" r="6" fill="#F0883E"/>

    <!-- Objective turret and lenses -->
    <rect x="108" y="125" width="20" height="12" rx="2" fill="#484F58"/>
    <polygon points="112,137 124,137 121,152 115,152" fill="#C9D1D9"/>

    <!-- Microscope stage -->
    <rect x="90" y="140" width="50" height="6" rx="2" fill="#58A6FF"/>
    <rect x="102" y="146" width="26" height="4" fill="#30363D"/>

    <!-- Glass slide with specimen sample -->
    <rect x="98" y="138" width="34" height="3" rx="1" fill="#E6EDF3" fill-opacity="0.7"/>
    <circle cx="115" cy="139" r="4" fill="#F85149" fill-opacity="0.8"/>

    <!-- Light source / Mirror underneath -->
    <ellipse cx="115" cy="162" rx="10" ry="4" fill="#58A6FF"/>

    <!-- Precision laser / light beam effect indicating accuracy and high-tech nature -->
    <polygon points="115,152 112,139 118,139" fill="#58A6FF" fill-opacity="0.6"/>
    <line x1="115" y1="139" x2="115" y2="95" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8"/>

    <!-- Electronic digital control panel / screen on the device -->
    <rect x="75" y="102" width="16" height="22" rx="3" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <polyline points="78,118 82,112 85,116 88,108" fill="none" stroke="#3FB950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ambient high-tech interface elements (focus rings / data accents) -->
    <path d="M 155 70 A 35 35 0 0 1 175 105" fill="none" stroke="#F0883E" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="175" cy="105" r="3" fill="#F0883E"/>

    <path d="M 75 150 A 30 30 0 0 1 65 125" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="65" cy="125" r="2" fill="#58A6FF"/>
  </g>
</svg>