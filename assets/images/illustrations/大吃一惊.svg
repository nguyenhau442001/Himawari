<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Character Head -->
    <circle cx="60" cy="60" r="45" fill="#2D343E"/>
    <circle cx="60" cy="60" r="40" fill="#FFD700"/>
    
    <!-- Eyes - Wide Open/Surprised -->
    <ellipse cx="40" cy="50" rx="6" ry="10" fill="#1A1D24"/>
    <ellipse cx="80" cy="50" rx="6" ry="10" fill="#1A1D24"/>
    
    <!-- Eyebrows - Raised -->
    <path d="M30 35 Q40 25 50 35" stroke="#1A1D24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M70 35 Q80 25 90 35" stroke="#1A1D24" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Mouth - Shocked O shape -->
    <ellipse cx="60" cy="85" rx="12" ry="16" fill="#1A1D24"/>
    
    <!-- Hands - Raised in surprise -->
    <path d="M20 90 L5 70" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
    <path d="M100 90 L115 70" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
    <circle cx="5" cy="70" r="8" fill="#FFD700"/>
    <circle cx="115" cy="70" r="8" fill="#FFD700"/>
  </g>
</svg>