  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Light -->
  <rect x="160" y="40" width="50" height="70" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  <path d="M185 40 L185 110" stroke="#475569" stroke-width="2"/>
  <circle cx="185" cy="75" r="15" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Bed/Accommodation -->
  <rect x="30" y="140" width="180" height="60" rx="8" fill="#334155"/>
  <rect x="40" y="120" width="60" height="30" rx="4" fill="#f8fafc"/>
