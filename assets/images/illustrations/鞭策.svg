<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: Desk and Window -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="100" y="150" width="40" height="90" fill="#475569"/>
  <circle cx="120" cy="80" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  
  <!-- Teacher (Silhouette/Stylized) -->
  <g transform="translate(40, 60)">
    <circle cx="20" cy="20" r="12" fill="#f8fafc"/>
    <path d="M10 40 Q20 30 30 40 L30 80 L10 80 Z" fill="#94a3b8"/>
    <path d="M20 35 L20 50 M15 45 L25 45" stroke="#f8fafc" stroke-width="2"/>
  </g>
  
  <!-- Student (The subject being motivated) -->
  <g transform="translate(140, 100)">
    <!-- Body -->
    <path d="M20 40 L40 40 L35 120 L5 120 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="22" cy="30" r="15" fill="#fcd34d"/>
    <!-- Eyes/Expression -->
    <circle cx="16" cy="26" r="2" fill="#0f172a"/>
    <circle cx="28" cy="26" r="2" fill="#0f172a"/>
    <path d="M18 35 Q22 38 26 35" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <!-- Action Lines (Motivation/Forward movement) -->
    <path d="M50 80 L80 60 M50 90 L90 70 M50 100 L80 90" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Books/Props -->
  <rect x="160" y="120" width="30" height="20" rx="2" fill="#ec4899"/>
  <rect x="165" y="125" width="20" height="10" rx="1" fill="#f8fafc"/>
  
  <!-- Light Glow -->
  <circle cx="120" cy="80" r="5" fill="#fbbf24">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>