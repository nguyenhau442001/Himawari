  <!-- Character 1: Running -->
  <g transform="translate(60, 120)">
    <circle cx="10" cy="10" r="10" fill="#FFB84D"/>
    <path d="M10 20 L10 50 M10 30 L0 40 M10 30 L20 40 M10 50 L0 70 M10 50 L20 60" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
