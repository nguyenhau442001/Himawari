<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for modern dark theme -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.5"/>
  <line x1="60" y1="120" x2="180" y2="120" stroke="#2C3444" stroke-width="2" stroke-dasharray="4 4" />

  <!-- A chain of connected, distinct physical elements representing "a series" (一系列) -->
  <!-- Link 1 (Left) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="0" r="26" fill="#252D3D"/>
    <circle cx="0" cy="0" r="22" fill="#2E384D"/>
    <!-- Document / policy icon inside -->
    <rect x="-8" y="-11" width="16" height="22" rx="2" fill="#F39C12"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="5" x2="2" y2="5" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Connecting line 1 -->
  <path d="M 86 120 L 100 120" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
  <circle cx="93" cy="120" r="3" fill="#F39C12"/>

  <!-- Link 2 (Center - Focus) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="32" fill="#2A3548"/>
    <circle cx="0" cy="0" r="28" fill="#F39C12"/>
    <!-- Main Policy / Official Document icon -->
    <rect x="-10" y="-13" width="20" height="26" rx="3" fill="#1A1D24"/>
    <circle cx="0" cy="-6" r="3" fill="#F39C12"/>
    <line x1="-5" y1="1" x2="5" y2="1" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="6" x2="3" y2="6" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Connecting line 2 -->
  <path d="M 140 120 L 154 120" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
  <circle cx="147" cy="120" r="3" fill="#F39C12"/>

  <!-- Link 3 (Right) -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="26" fill="#252D3D"/>
    <circle cx="0" cy="0" r="22" fill="#2E384D"/>
    <!-- Briefcase / Support icon inside -->
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="#3498DB"/>
    <path d="M-6 -7 V-10 C-6 -11.5 -4.5 -12 -3 -12 H3 C4.5 -12 6 -11.5 6 -10 V-7" fill="none" stroke="#3498DB" stroke-width="2"/>
    <line x1="-10" y1="-1" x2="10" y2="-1" stroke="#1A1D24" stroke-width="1.5"/>
  </g>

  <!-- Additional top/bottom smaller elements to emphasize completeness of the series -->
  <g transform="translate(90, 72)">
    <circle cx="0" cy="0" r="16" fill="#252D3D"/>
    <path d="M-5 -2 L-1 3 L6 -4" fill="none" stroke="#2ECC71" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M 98 86 L 110 100" stroke="#252D3D" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(150, 168)">
    <circle cx="0" cy="0" r="16" fill="#252D3D"/>
    <circle cx="0" cy="0" r="6" fill="#E74C3C"/>
  </g>
  <path d="M 142 154 L 130 140" stroke="#252D3D" stroke-width="3" stroke-linecap="round"/>

</svg>