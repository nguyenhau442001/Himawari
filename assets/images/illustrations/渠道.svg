<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Details (Office / Business setting) -->
  <path d="M20 20 H220 V160 H20 Z" fill="#1e293b"/>
  <!-- Window grid showing modern city view -->
  <rect x="155" y="35" width="55" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="182" y1="35" x2="182" y2="110" stroke="#334155" stroke-width="1.5"/>
  <line x1="155" y1="72" x2="210" y2="72" stroke="#334155" stroke-width="1.5"/>
  <!-- City lights in window -->
  <rect x="162" y="42" width="6" height="8" rx="1" fill="#fbbf24" opacity="0.6"/>
  <rect x="172" y="55" width="6" height="12" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="190" y="45" width="8" height="6" rx="1" fill="#fb923c" opacity="0.5"/>
  <rect x="192" y="85" width="6" height="15" rx="1" fill="#38bdf8" opacity="0.4"/>

  <!-- Wall shelf with business props -->
  <rect x="25" y="40" width="65" height="4" rx="2" fill="#475569"/>
  <rect x="35" y="24" width="12" height="16" rx="2" fill="#10b981"/>
  <rect x="50" y="20" width="10" height="20" rx="2" fill="#fb923c"/>
  <rect x="63" y="28" width="14" height="12" rx="2" fill="#38bdf8"/>

  <!-- Main Desk Surface -->
  <path d="M10 160 H230 V175 H10 Z" fill="url(#deskGrad)" rx="2"/>
  <rect x="10" y="155" width="220" height="6" rx="3" fill="#475569"/>

  <!-- Sales Strategy Hologram / Screen (Representing multiple channels/routes) -->
  <path d="M85 75 L135 75 L145 130 L75 130 Z" fill="url(#chartGlow)" filter="url(#glow)"/>
  <!-- Connecting nodes and lines (Multiple Channels) -->
  <circle cx="110" cy="85" r="4" fill="#38bdf8"/>
  <circle cx="85" cy="115" r="3" fill="#10b981"/>
  <circle cx="110" cy="120" r="3" fill="#fbbf24"/>
  <circle cx="135" cy="110" r="3" fill="#ec4899"/>
  <!-- Channel branching paths -->
  <path d="M110 89 L85 115 M110 89 L110 120 M110 89 L135 110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" fill="none"/>
  <!-- Growth Bar Chart on Screen -->
  <rect x="83" y="105" width="5" height="15" rx="1" fill="#10b981"/>
  <rect x="107" y="98" width="5" height="22" rx="1" fill="#fbbf24"/>
  <rect x="131" y="90" width="5" height="30" rx="1" fill="#ec4899"/>

  <!-- Desk Props: Laptop & Coffee -->
  <!-- Laptop Base -->
  <path d="M135 155 L175 155 L185 142 L125 142 Z" fill="#64748b"/>
  <!-- Laptop Screen showing growth line -->
  <path d="M128 142 L182 142 L185 112 L125 112 Z" fill="#0f172a"/>
  <path d="M132 135 L145 128 L158 132 L175 118" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <!-- Coffee Mug -->
  <rect x="195" y="135" width="14" height="18" rx="3" fill="#f8fafc"/>
  <path d="M209 140 C215 140, 215 150, 209 152" stroke="#f8fafc" stroke-width="2.5" fill="none"/>

  <!-- Character: Business Professional planning expansion -->
  <!-- Body/Torso -->
  <path d="M45 170 C45 145, 60 135, 75 135 C90 135, 105 145, 105 170 Z" fill="#1d4ed8"/>
  <!-- Shirt collar -->
  <path d="M67 135 L75 148 L83 135 Z" fill="#f8fafc"/>
  <!-- Tie -->
  <polygon points="73,143 77,143 79,165 75,172 71,165" fill="#ef4444"/>

  <!-- Character Neck & Head -->
  <rect x="70" y="125" width="10" height="15" fill="#fed7aa"/>
  <!-- Head shape -->
  <circle cx="75" cy="110" r="18" fill="#fed7aa"/>
  <!-- Hair (Stylish modern cut) -->
  <path d="M57 110 C57 95, 70 90, 85 95 C93 98, 93 110, 93 110 C93 110, 85 100, 75 100 C65 100, 57 105, 57 110 Z" fill="#334155"/>
  <!-- Friendly, confident expression -->
  <circle cx="69" cy="108" r="1.5" fill="#1e293b"/>
  <circle cx="81" cy="108" r="1.5" fill="#1e293b"/>
  <path d="M72 116 Q75 120 78 116" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Arms actively pointing/expanding toward the channels/screen -->
  <!-- Back Arm -->
  <path d="M60 140 L45 155 L55 160" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Front Arm gesturing outward (Symbolizing widening/expanding channels) -->
  <path d="M90 140 C105 140, 115 130, 125 125" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Hand -->
  <circle cx="127" cy="124" r="5" fill="#fed7aa"/>

  <!-- Action Effect Lines / Expanding vector arrows representing "拓宽渠道" (Widening channels) -->
  <path d="M142 95 Q155 90 170 95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M165 91 L171 95 L165 100" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M145 120 Q160 125 178 115" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M172 112 L179 115 L173 121" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M138 72 Q150 60 170 65" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M164 61 L171 65 L164 71" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Foreground ambiance highlights -->
  <circle cx="215" cy="190" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="25" cy="205" r="3" fill="#fbbf24" opacity="0.2"/>
</svg>