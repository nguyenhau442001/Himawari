<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Supporting Beam Structure (The "Liang" - Rường cột) -->
  <path d="M40 180 L200 180 L190 160 L50 160 Z" fill="#4A5568"/>
  <rect x="60" y="60" width="20" height="100" fill="#E67E22"/>
  <rect x="160" y="60" width="20" height="100" fill="#E67E22"/>
  <rect x="50" y="40" width="140" height="20" fill="#F39C12"/>
  
  <!-- Stylized Human Figure (The "Dong" - Trụ cột con người) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="-30" r="12" fill="#F1C40F"/>
    <path d="M-15 0 L15 0 L10 40 L-10 40 Z" fill="#F1C40F"/>
    <path d="M-5 40 L-5 70 M5 40 L5 70" stroke="#F1C40F" stroke-width="6" stroke-linecap="round"/>
    <path d="M-10 10 L-25 25 M10 10 L25 25" stroke="#F1C40F" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Foundation Base -->
  <rect x="30" y="180" width="180" height="10" fill="#34495E"/>
</svg>