<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Energy Aura / Sweat/Focus Effect -->
    <linearGradient id="energy-beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Dark Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Architecture -->
  <!-- Window Grid showing night-time cityscape / late work session -->
  <g opacity="0.3">
    <rect x="150" y="20" width="70" height="90" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="185" y1="20" x2="185" y2="110" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="65" x2="220" y2="65" stroke="#475569" stroke-width="2"/>
    <!-- City lights outside -->
    <rect x="160" y="30" width="10" height="15" fill="#f59e0b" opacity="0.6"/>
    <rect x="195" y="40" width="12" height="20" fill="#38bdf8" opacity="0.5"/>
    <rect x="165" y="75" width="15" height="12" fill="#f59e0b" opacity="0.4"/>
  </g>

  <!-- Bookshelf / Office Props Background -->
  <rect x="20" y="45" width="45" height="8" rx="2" fill="#334155"/>
  <path d="M25 45 L25 30 L32 30 L32 45 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M34 45 L34 26 L42 26 L42 45 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M44 45 L44 32 L52 32 L52 45 Z" fill="#10b981" opacity="0.8"/>

  <!-- Hanging Task Board / Project Flow Chart with Sticky Notes -->
  <g transform="translate(25, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="55" height="40" rx="4" fill="#334155"/>
    <rect x="6" y="6" width="12" height="8" rx="2" fill="#fbbf24"/>
    <rect x="22" y="6" width="12" height="8" rx="2" fill="#38bdf8"/>
    <rect x="38" y="6" width="12" height="8" rx="2" fill="#10b981"/>
    <!-- Checkmarks / Progress Lines -->
    <path d="M9 10 L11 12 L15 8" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M25 10 L27 12 L31 8" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Active mission node -->
    <circle cx="44" cy="10" r="3" fill="#ec4899"/>
    <!-- Flow lines -->
    <line x1="12" y1="22" x2="48" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="30" x2="35" y2="30" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Desk Surface -->
  <path d="M10 185 L230 185 L220 210 L20 210 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="10" y="180" width="220" height="7" rx="3" fill="#475569"/>

  <!-- Desk Lamp -->
  <circle cx="195" cy="140" r="50" fill="url(#lamp-glow)"/>
  <path d="M190 180 L200 180 L205 140 L185 140 Z" fill="#64748b"/>
  <path d="M195 140 L210 100" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M210 100 L225 90" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M215 80 L235 95 L225 105 Z" fill="#fbbf24" filter="url(#shadow)"/>
  <ellipse cx="225" cy="100" rx="6" ry="6" fill="#fef08a"/>

  <!-- Laptop & Work Documents (Task Completion Setup) -->
  <!-- Laptop Base -->
  <path d="M130 180 L190 180 L200 165 L120 165 Z" fill="#94a3b8"/>
  <!-- Laptop Screen -->
  <path d="M125 167 L195 167 L190 120 L130 120 Z" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <!-- Screen UI - Charts & Graphs indicating intensive task execution -->
  <path d="M138 150 L145 140 L152 145 L162 130 L172 135 L182 125" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="182" cy="125" r="2.5" fill="#ec4899"/>
  <!-- Stack of Papers / Mission Files -->
  <g transform="translate(60, 165) rotate(-5)">
    <rect x="0" y="0" width="40" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="6" y1="5" x2="25" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="10" x2="30" y2="10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="15" x2="18" y2="15" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(85, 172) rotate(8)">
    <rect x="0" y="0" width="35" height="18" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="5" y1="6" x2="25" y2="6" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="12" r="3" fill="#10b981"/>
  </g>

  <!-- Coffee Mug (Energy booster) -->
  <rect x="45" y="165" width="14" height="18" rx="3" fill="#ea580c"/>
  <path d="M59 170 C63 170 63 178 59 178" stroke="#ea580c" stroke-width="2.5" fill="none"/>
  <!-- Steam lines -->
  <path d="M49 158 C49 154 53 154 53 150" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- MAIN CHARACTER: Deeply focused, giving 100% effort ("全力以赴") -->
  <g transform="translate(80, 75)">
    <!-- Body / Torso leaning forward intensely -->
    <path d="M 30 115 C 20 90, 25 70, 45 60 C 60 55, 75 70, 75 95 L 85 115 Z" fill="#2563eb" filter="url(#shadow)"/>
    
    <!-- Arms / Hands typing rapidly or gesturing determination -->
    <!-- Back Arm -->
    <path d="M 35 75 Q 20 90, 40 105" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Front Arm reaching forward to keyboard -->
    <path d="M 65 75 Q 90 90, 100 105" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="102" cy="107" r="5" fill="#fbcfe8"/>

    <!-- Neck & Head leaning forward with fierce concentration -->
    <path d="M 48 58 L 56 70" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Head Group -->
    <g transform="translate(50, 20)">
      <!-- Hair (Dynamic, flowing slightly with determination) -->
      <path d="M 0 25 C -5 5, 20 -5, 35 5 C 45 10, 48 25, 40 35 L 5 35 Z" fill="#0f172a"/>
      
      <!-- Face profile/angle -->
      <rect x="10" y="10" width="28" height="30" rx="12" fill="#fbcfe8"/>
      
      <!-- Determined Eyebrow & Focused Eye -->
      <path d="M 16 20 L 28 23" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="24" cy="26" r="2.5" fill="#0f172a"/>
      
      <!-- Determined expression: Firm mouth line -->
      <path d="M 28 34 L 34 35" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Sweat drop of hard work / effort -->
      <path d="M 38 18 C 38 15, 41 12, 41 12 C 41 12, 44 15, 44 18 A 3 3 0 0 1 38 18 Z" fill="#38bdf8" filter="url(#shadow)"/>
    </g>

    <!-- Collar / Shirt Detail -->
    <path d="M 42 60 L 52 68 L 62 60" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dynamic Energy / Action Lines representing "Going All Out" /全力以赴 -->
  <g opacity="0.7">
    <!-- Upward momentum light rays behind character -->
    <path d="M 70 120 L 50 30" stroke="url(#energy-beam)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 120 130 L 140 40" stroke="url(#energy-beam)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Sparkles of peak performance & breakthrough -->
    <path d="M 40 80 L 45 85 L 40 90 L 35 85 Z" fill="#fbbf24"/>
    <path d="M 150 70 L 154 74 L 150 78 L 146 74 Z" fill="#38bdf8"/>
    <path d="M 110 40 L 113 43 L 110 46 L 107 43 Z" fill="#ec4899"/>
  </g>

</svg>