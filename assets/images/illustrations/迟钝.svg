<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Speed trail / Echo lines (left side, fast/sharp) -->
    <path d="M55 85 L75 85" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
    <path d="M45 105 L70 105" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 125 L68 125" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Sharp, quick signal icon (sharp angular wave representing quick response) -->
    <path d="M70 105 L82 92 L94 118 L106 105" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="106" cy="105" r="4" fill="#38BDF8"/>
  </g>

  <g transform="translate(70, 0)">
    <!-- Heavy, sluggish signal icon (rounded, delayed, fading wave representing 迟钝) -->
    <!-- Center divider subtle line -->
    <line x1="10" y1="60" x2="10" y2="180" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Sluggish wave: thick, low contrast, trailing off -->
    <path d="M45 105 C55 105, 58 125, 75 125 C92 125, 95 105, 110 105" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Lagging / delayed shadow echoes of the wave -->
    <path d="M35 105 C45 105, 48 120, 60 120" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <path d="M25 105 C33 105, 35 115, 45 115" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>

    <!-- Heavy sleepy/delayed indicator dot -->
    <circle cx="110" cy="105" r="5" fill="#F59E0B"/>
    
    <!-- Sleepy / slow down dots (inertial lag) -->
    <circle cx="130" cy="112" r="3" fill="#F59E0B" opacity="0.6"/>
    <circle cx="145" cy="118" r="2" fill="#F59E0B" opacity="0.3"/>
  </g>

  <!-- Abstract cognitive gear / clock slowing down at the bottom -->
  <g transform="translate(120, 160)">
    <!-- Sluggish pendulum / slow motion arc -->
    <path d="M-30 0 C-30 20, 30 20, 30 0" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
    <circle cx="0" cy="18" r="6" fill="#F59E0B"/>
  </g>
</svg>