<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Plate base / shadow -->
    <ellipse cx="120" cy="142" rx="72" ry="34" fill="#111318"/>
    
    <!-- Outer ceramic rim -->
    <ellipse cx="120" cy="138" rx="72" ry="34" fill="#E2E8F0"/>
    
    <!-- Inner plate bowl area -->
    <ellipse cx="120" cy="138" rx="64" ry="29" fill="#F8FAFC"/>
    
    <!-- Chopsticks resting across the plate -->
    <!-- Chopstick 1 -->
    <line x1="60" y1="92" x2="190" y2="128" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="60" y1="92" x2="68" y2="94" stroke="#B45309" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Chopstick 2 -->
    <line x1="56" y1="100" x2="186" y2="136" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="56" y1="100" x2="64" y2="102" stroke="#D97706" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Asian Bento/Bowl contents: Lunch meal -->
    <!-- Rice mound (left side) -->
    <ellipse cx="96" cy="133" rx="22" ry="14" fill="#FFFFFF"/>
    <path d="M 74 133 C 74 122, 84 117, 96 117 C 108 117, 118 122, 118 133 Z" fill="#F1F5F9"/>
    
    <!-- Stir-fried greens/veggies (top right) -->
    <path d="M 124 130 C 130 120, 148 118, 156 128 C 162 135, 150 142, 138 139 Z" fill="#10B981"/>
    <path d="M 132 125 C 137 122, 144 123, 147 127" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <path d="M 144 133 C 149 130, 155 133, 153 137" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

    <!-- Main dish / Meat or Tofu piece (bottom right) -->
    <path d="M 112 143 C 112 137, 126 135, 136 140 C 144 144, 142 153, 132 155 C 120 157, 112 150, 112 143 Z" fill="#EA580C"/>
    <path d="M 120 142 C 124 140, 130 142, 132 146" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>

    <!-- Carrots / Garnish cubes -->
    <rect x="136" y="126" width="6" height="6" rx="1.5" transform="rotate(15 139 129)" fill="#F97316"/>
    <rect x="106" y="142" width="5" height="5" rx="1" transform="rotate(-10 108 144)" fill="#F97316"/>

    <!-- Steam wisps representing a hot freshly prepared lunch -->
    <path d="M 105 104 C 102 96, 110 90, 107 82" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 130 98 C 127 90, 135 84, 132 76" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>