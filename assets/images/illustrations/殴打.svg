<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Police Light Glow Gradient -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette / Lighting Overlay -->
    <linearGradient id="streetLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Urban Street / Alley Context -->
  <g id="environment">
    <!-- Brick Wall Background -->
    <rect x="0" y="40" width="240" height="150" fill="#273548"/>
    <!-- Brick pattern lines -->
    <path d="M0 60 H240 M0 80 H240 M0 100 H240 M0 120 H240 M0 140 H240 M0 160 H240 M0 180 H240" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M40 40 V60 M80 60 V80 M120 40 V60 M160 60 V80 M200 40 V60 M20 80 V100 M60 80 V100 M100 80 V100 M140 80 V100 M180 80 V100 M30 120 V140 M70 120 V140 M110 120 V140 M150 120 V140 M190 120 V140 M50 160 V180 M90 160 V180 M130 160 V180 M170 160 V180 M210 160 V180" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Pavement Ground -->
    <rect x="0" y="180" width="240" height="60" fill="#0f172a"/>
    <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
    <!-- Sidewalk curb -->
    <rect x="0" y="175" width="240" height="5" fill="#475569"/>

    <!-- Street light cone from top -->
    <polygon points="120,0 40,240 200,240" fill="url(#streetLight)" style="mix-blend-mode: overlay;" />
  </g>

  <!-- DYNAMIC POLICE LIGHT FLASHES (Animated via static overlapping glows & stylized elements) -->
  <g id="police-lights">
    <!-- Red Flasher Beam Left -->
    <ellipse cx="60" cy="30" rx="40" ry="25" fill="url(#redGlow)" style="mix-blend-mode: screen;" />
    <!-- Blue Flasher Beam Right -->
    <ellipse cx="180" cy="30" rx="40" ry="25" fill="url(#blueGlow)" style="mix-blend-mode: screen;" />

    <!-- Police Car Roof Silhouette & Lights -->
    <path d="M140 35 L160 20 L200 20 L220 35 Z" fill="#0f172a" />
    <rect x="165" y="15" width="12" height="6" rx="2" fill="#ef4444" />
    <rect x="183" y="15" width="12" height="6" rx="2" fill="#3b82f6" />
  </g>

  <!-- CHARACTERS SCENE -->
  <!-- 1. Victim / Bystander (Sitting on ground, rubbing head) -->
  <g id="victim" transform="translate(0, 5)">
    <!-- Body slumped -->
    <ellipse cx="75" cy="180" rx="14" ry="10" fill="#d97706" />
    <!-- Head -->
    <circle cx="68" cy="162" r="11" fill="#fcd34d" />
    <!-- Hurt expression / Dizzy spiral or hand on head -->
    <path d="M62 165 C65 160 70 160 73 165" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arm holding head -->
    <path d="M68 168 L60 175" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <!-- Fallen items (Dropped glasses or phone) -->
    <circle cx="52" cy="185" rx="3" ry="3" fill="#94a3b8" />
    <line x1="48" y1="187" x2="56" y2="183" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- 2. The Perpetrator being escorted ("他因殴打他人被警察带走了") -->
  <g id="perpetrator-and-police" transform="translate(10, 0)">
    <!-- Police Officer 1 (Left, holding perp arm) -->
    <g id="police-left">
      <!-- Officer Body (Dark Blue uniform) -->
      <path d="M95 120 L110 115 L118 185 L90 185 Z" fill="#1e3a8a" />
      <!-- Officer Arm -->
      <path d="M100 125 L125 135" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" />
      <!-- Officer Head & Cap -->
      <circle cx="102" cy="100" r="10" fill="#fde68a" />
      <path d="M90 95 L114 95 L110 90 L94 90 Z" fill="#1e3a8a" />
      <rect x="98" y="87" width="16" height="3" fill="#1e3a8a" />
    </g>

    <!-- Perpetrator (Center-Right, handcuffed/escorted) -->
    <g id="perpetrator">
      <!-- Torso (Orange/Red detained jacket style, contrasting) -->
      <path d="M125 115 L145 110 L152 185 L125 185 Z" fill="#f97316" />
      <!-- Arms pulled back slightly / Handcuffs implied -->
      <path d="M125 125 L115 135" stroke="#c2410c" stroke-width="8" stroke-linecap="round" />
      <path d="M145 125 L135 135" stroke="#c2410c" stroke-width="8" stroke-linecap="round" />
      <!-- Silver Handcuff glint -->
      <circle cx="120" cy="132" r="3" fill="#e2e8f0" />
      
      <!-- Head (Guilty/Resistant expression) -->
      <circle cx="136" cy="95" r="11" fill="#fef08a" />
      <!-- Messy hair -->
      <path d="M125 90 C130 85 142 85 147 90 C145 87 130 87 125 90" fill="#78350f" />
      <!-- Stern/Angry brow -->
      <line x1="130" y1="92" x2="138" y2="94" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <line x1="138" y1="94" x2="144" y2="92" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <!-- Mouth frowning -->
      <path d="M132 101 Q136 98 140 101" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Legs walking forward -->
      <path d="M132 185 L130 220 L142 220 L140 185 Z" fill="#334155" />
    </g>

    <!-- Police Officer 2 (Right, leading the way) -->
    <g id="police-right">
      <!-- Body -->
      <path d="M160 115 L178 112 L172 185 L155 185 Z" fill="#1e3a8a" />
      <!-- Arm pointing forward -->
      <path d="M165 125 L190 120" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" />
      <!-- Head & Cap -->
      <circle cx="168" cy="98" r="10" fill="#fde68a" />
      <path d="M158 93 L180 93 L176 88 L162 88 Z" fill="#1e3a8a" />
      <!-- Legs -->
      <path d="M160 185 L165 220 L175 220 L170 185 Z" fill="#0f172a" />
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERE / CONTEXT PROPS -->
  <g id="props">
    <!-- Caution/Police line tape blurred in foreground corner -->
    <path d="M-10 210 L80 245" stroke="#eab308" stroke-width="12" stroke-linecap="square" opacity="0.9"/>
    <!-- Diagonal stripes on tape -->
    <path d="M10 210 L20 215 M30 218 L40 223 M50 226 L60 231" stroke="#0f172a" stroke-width="6" opacity="0.8"/>
  </g>
</svg>