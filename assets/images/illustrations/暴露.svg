<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="80" rx="2" fill="#334155"/>
  <rect x="180" y="150" width="10" height="80" rx="2" fill="#334155"/>
  
  <!-- The "Weakness" (The crumpled paper/error) -->
  <circle cx="120" cy="130" r="25" fill="#fb923c" opacity="0.2"/>
  <path d="M105 120 L135 120 L130 145 L110 145 Z" fill="#f8fafc"/>
  <path d="M110 125 L130 125 M110 132 L125 132" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- The Character (The person whose weakness is exposed) -->
  <g transform="translate(60, 80)">
    <circle cx="60" cy="40" r="25" fill="#cbd5e1"/>
    <path d="M45 40 Q60 55 75 40" stroke="#475569" stroke-width="3" fill="none"/>
    <circle cx="52" cy="35" r="3" fill="#1e293b"/>
    <circle cx="68" cy="35" r="3" fill="#1e293b"/>
    <path d="M40 70 L50 120 L70 120 L80 70" fill="#38bdf8"/>
    <path d="M40 70 L30 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 70 L90 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The Spotlight/Exposing Element -->
  <path d="M120 0 L160 120 L80 120 Z" fill="#fbbf24" opacity="0.15"/>
  <circle cx="120" cy="130" r="15" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="4" fill="#10b981"/>
  <circle cx="30" cy="180" r="3" fill="#ec4899"/>
</svg>