<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Rich Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="avatar-clip">
      <circle cx="120" cy="55" r="18" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Context: Office Interior -->
  <!-- Window -->
  <rect x="145" y="25" width="65" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="148" y="28" width="59" height="69" fill="url(#window-glow)" />
  <!-- City silhouette through window -->
  <path d="M155 97 L155 75 L162 75 L162 97 Z M167 97 L167 60 L176 60 L176 97 Z M181 97 L181 68 L192 68 L192 97 Z" fill="#1e293b" />

  <!-- Wall shelf with books and plant -->
  <rect x="25" y="35" width="70" height="4" rx="2" fill="#475569" />
  <rect x="33" y="20" width="10" height="15" rx="1" fill="#ec4899" />
  <rect x="45" y="17" width="12" height="18" rx="1" fill="#38bdf8" />
  <rect x="59" y="22" width="8" height="13" rx="1" fill="#10b981" />
  <!-- Small potted plant -->
  <path d="M78 27 Q78 20 84 20 Q90 20 90 27 Z" fill="#10b981" />
  <path d="M81 35 L87 35 L85 27 L83 27 Z" fill="#cbd5e1" />

  <!-- Office Desk Surface -->
  <path d="M15 175 L225 175 L210 215 L30 215 Z" fill="url(#desk-grad)" />
  <rect x="15" y="170" width="210" height="7" rx="3" fill="#475569" />

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M40 175 L65 155 L105 155 L100 175 Z" fill="#64748b" />
  <path d="M36 175 L109 175 L112 178 L33 178 Z" fill="#94a3b8" />
  <!-- Coffee Mug -->
  <rect x="180" y="155" width="14" height="18" rx="2" fill="#f8fafc" />
  <path d="M194 159 C198 159 198 169 194 169" stroke="#f8fafc" stroke-width="2" fill="none" />

  <!-- CHARACTER 2 (The Listener / Mentor - cross, unimpressed with flattery) -->
  <g transform="translate(155, 95)">
    <!-- Body / Torso -->
    <path d="M 15 50 C 15 35, 45 35, 45 50 L 50 85 L 10 85 Z" fill="#0284c7" />
    <!-- Collar / Tie -->
    <polygon points="25,38 35,38 30,50" fill="#f8fafc" />
    <!-- Head -->
    <circle cx="30" cy="20" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 14 18 C 14 8, 46 8, 46 18 C 46 12, 38 10, 30 10 C 22 10, 14 12, 14 18 Z" fill="#334155" />
    <!-- Serious / Unimpressed Face Features -->
    <path d="M 20 18 L 26 21" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M 34 21 L 40 18" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="23" y1="27" x2="37" y2="27" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <!-- Crossed Arms (Showing rejection of flattery) -->
    <path d="M 12 55 Q 30 50 48 55 L 42 68 Q 30 60 18 68 Z" fill="#0284c7" />
    <circle cx="15" cy="58" r="5" fill="#fbcfe8" />
    <circle cx="45" cy="58" r="5" fill="#fbcfe8" />
  </g>

  <!-- CHARACTER 1 (The Flatterer - bowing / over-complimenting with fake gesture) -->
  <g transform="translate(45, 90)">
    <!-- Body / Leaning Forward -->
    <path d="M 15 45 C 15 30, 45 30, 45 45 L 40 85 L 10 85 Z" fill="#10b981" />
    <!-- Collar -->
    <polygon points="25,33 35,33 30,42" fill="#f8fafc" />
    <!-- Head (Tilting eagerly) -->
    <circle cx="28" cy="16" r="15" fill="#fde68a" />
    <!-- Hair -->
    <path d="M 15 15 C 16 6, 40 6, 41 15 C 38 12, 18 12, 15 15 Z" fill="#78350f" />
    <!-- Flattering / Exaggerated Happy Face -->
    <path d="M 20 15 Q 24 11 28 15" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 30 15 Q 34 11 38 15" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Big wide smile -->
    <path d="M 22 21 Q 30 29 36 21" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="19" cy="21" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="39" cy="21" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Gesture / Hands clasping/flattering -->
    <path d="M 25 45 Q 40 45 45 55" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="46" cy="55" r="5" fill="#fde68a" />
  </g>

  <!-- Visual Metaphor: Floating abstract "flattery" bubbles / sparkles (showing empty praise) -->
  <g opacity="0.8">
    <path d="M 100 80 Q 105 70 115 75 Q 105 80 100 90 Q 95 80 85 75 Q 95 70 100 80 Z" fill="#fbbf24" />
    <circle cx="125" cy="65" r="4" fill="#f59e0b" />
    <circle cx="85" cy="100" r="3" fill="#fbbf24" />
    <!-- Soft golden spotlight/glow over the action -->
    <path d="M 80 0 L 160 0 L 180 240 L 60 240 Z" fill="url(#accent-glow)" style="mix-blend-mode: overlay;" />
  </g>

  <!-- Foreground plant element for depth -->
  <path d="M 5 240 Q 5 200 20 190 Q 30 185 25 240 Z" fill="#065f46" />
  <path d="M 15 240 Q 25 195 40 195 Q 50 195 45 240 Z" fill="#047857" />
</svg>