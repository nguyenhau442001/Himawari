  <line x1="120" y1="62" x2="120" y2="52" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="100" x2="78" y2="100" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="100" x2="162" y2="100" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
