  <circle cx="65" cy="75" r="28" fill="#222733" />
  <circle cx="175" cy="85" r="32" fill="#222733" />
  <circle cx="120" cy="160" r="36" fill="#222733" />

  <!-- Location Pin 1 (Top Left) -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#2A3241"/>
    <path d="M20 9C15 9 11 13 11 18C11 24.5 20 31 20 31C20 31 29 24.5 29 18C29 13 25 9 20 9ZM20 21.5C18.1 21.5 16.5 19.9 16.5 18C16.5 16.1 18.1 14.5 20 14.5C21.9 14.5 23.5 16.1 23.5 18C23.5 19.9 21.9 21.5 20 21.5Z" fill="#F59E0B"/>
  </g>

  <!-- Location Pin 2 (Top Right) -->
  <g transform="translate(155, 55)">
    <circle cx="20" cy="20" r="20" fill="#2A3241"/>
    <path d="M20 9C15 9 11 13 11 18C11 24.5 20 31 20 31C20 31 29 24.5 29 18C29 13 25 9 20 9ZM20 21.5C18.1 21.5 16.5 19.9 16.5 18C16.5 16.1 18.1 14.5 20 14.5C21.9 14.5 23.5 16.1 23.5 18C23.5 19.9 21.9 21.5 20 21.5Z" fill="#F59E0B"/>
  </g>

  <!-- Location Pin 3 (Bottom) -->
  <g transform="translate(100, 130)">
    <circle cx="20" cy="20" r="22" fill="#2A3241"/>
    <path d="M20 9C15 9 11 13 11 18C11 24.5 20 31 20 31C20 31 29 24.5 29 18C29 13 25 9 20 9ZM20 21.5C18.1 21.5 16.5 19.9 16.5 18C16.5 16.1 18.1 14.5 20 14.5C21.9 14.5 23.5 16.1 23.5 18C23.5 19.9 21.9 21.5 20 21.5Z" fill="#F59E0B"/>
  </g>

  <!-- Connecting dashed lines showing omnipresence / "everywhere" concept -->
  <path d="M65 75 Q100 50 175 85" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M65 85 Q90 120 120 150" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M175 95 Q150 125 120 150" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- Central focal glowing star/spark symbol representing the essence manifesting everywhere -->
  <circle cx="120" cy="100" r="26" fill="#F59E0B"/>
  <path d="M120 84L123.5 94.5H134L125.5 100.5L129 111L120 105L111 111L114.5 100.5L106 94.5H116.5L120 84Z" fill="#1A1D24"/>
  
