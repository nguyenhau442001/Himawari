<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients & Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Cashier/Receipt -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- UI Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow for Paper/Receipt -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow behind the checkout counter -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)" />

  <!-- Restaurant / Cafe / Shop Interior Background -->
  <!-- Back Wall -->
  <rect x="20" y="25" width="200" height="110" rx="8" fill="#1e293b" opacity="0.6" />
  
  <!-- Ambient Wall Shelves & Decor props -->
  <rect x="40" y="45" width="40" height="4" rx="2" fill="#475569" />
  <rect x="50" y="32" width="20" height="13" rx="3" fill="#38bdf8" opacity="0.7" />
  <rect x="160" y="45" width="40" height="4" rx="2" fill="#475569" />
  <circle cx="180" cy="38" r="7" fill="#fb923c" opacity="0.8" />

  <!-- Wooden Countertop Surface -->
  <path d="M 20 135 L 220 135 L 210 165 L 30 165 Z" fill="#334155" />
  <!-- Countertop Highlight Line -->
  <path d="M 24 135 L 216 135" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <!-- Counterfront body -->
  <rect x="30" y="165" width="180" height="55" fill="#0f172a" opacity="0.9" />
  <!-- Vertical wood slat details on counter -->
  <line x1="75" y1="165" x2="75" y2="220" stroke="#1e293b" stroke-width="3" />
  <line x1="120" y1="165" x2="120" y2="220" stroke="#1e293b" stroke-width="3" />
  <line x1="165" y1="165" x2="165" y2="220" stroke="#1e293b" stroke-width="3" />

  <!-- Register / POS Machine -->
  <rect x="155" y="90" width="30" height="35" rx="4" fill="#64748b" />
  <rect x="160" y="95" width="20" height="12" rx="2" fill="#38bdf8" opacity="0.8" />
  <!-- POS Screen Glow -->
  <rect x="162" y="97" width="16" height="8" rx="1" fill="#bae6fd" />

  <!-- Character: Customer (Left side, smiling, paying) -->
  <g transform="translate(10, 30)">
    <!-- Body / Jacket -->
    <path d="M 30 120 C 30 105 45 95 65 95 C 85 95 100 105 100 120 L 100 140 L 30 140 Z" fill="#ec4899" />
    <!-- Inner Shirt / Collar -->
    <path d="M 55 95 L 65 110 L 75 95 Z" fill="#f8fafc" />
    <!-- Neck -->
    <rect x="58" y="83" width="14" height="14" fill="#fcd34d" />
    <!-- Head -->
    <circle cx="65" cy="70" r="16" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 49 68 C 49 55 60 50 72 54 C 81 57 81 72 81 72 L 49 72 Z" fill="#334155" />
    <!-- Friendly Face / Expression -->
    <circle cx="60" cy="69" r="1.5" fill="#1e293b" />
    <circle cx="70" cy="69" r="1.5" fill="#1e293b" />
    <path d="M 63 76 Q 65 79 67 76" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Hand holding credit card / cash towards total -->
    <path d="M 85 110 C 95 110 105 115 110 122 C 105 125 95 120 85 115 Z" fill="#fcd34d" />
    <rect x="100" y="115" width="16" height="10" rx="2" transform="rotate(15 100 115)" fill="#38bdf8" />
  </g>

  <!-- Character: Cashier / Merchant (Right side, behind counter, pointing to total) -->
  <g transform="translate(110, 20)">
    <!-- Apron / Body -->
    <path d="M 40 130 L 70 130 L 75 150 L 35 150 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="55" cy="80" r="15" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M 42 78 C 42 66 50 63 60 63 C 70 63 68 78 68 78 Z" fill="#475569" />
    <!-- Face -->
    <circle cx="50" cy="78" r="1.5" fill="#1e293b" />
    <circle cx="60" cy="78" r="1.5" fill="#1e293b" />
    <path d="M 53 84 Q 55 87 57 84" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Raised arm pointing/presenting -->
    <path d="M 65 105 L 85 95 L 90 102 L 70 115 Z" fill="#fcd34d" />
  </g>

  <!-- Central Focus: The Receipt / Total Bill (Representing "共计" & "一千元") -->
  <!-- Floats prominently above the counter to symbolize the grand total calculation -->
  <g filter="url(#dropShadow)" transform="translate(85, 45)">
    <!-- Receipt Paper Background -->
    <path d="M 0 0 L 70 0 L 70 85 C 70 88 67 91 63 88 C 59 85 55 88 51 88 C 47 88 43 85 39 88 C 35 88 31 85 27 88 C 23 88 19 85 15 88 C 11 88 7 85 3 88 C 0 91 -3 88 -7 88 L -7 0 Z" fill="#ffffff" />
    
    <!-- Receipt Header Line / Logo Placeholder -->
    <circle cx="31.5" cy="12" r="5" fill="#f59e0b" />
    <line x1="12" y1="22" x2="51" y2="22" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="30" x2="48" y2="30" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />

    <!-- Itemized mock lines -->
    <line x1="12" y1="42" x2="35" y2="42" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="42" x2="58" y2="42" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <line x1="12" y1="50" x2="30" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="42" y1="50" x2="58" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Divider Line -->
    <line x1="8" y1="58" x2="55" y2="58" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Total Highlight Section (The core visual metaphor for 共计 一千元) -->
    <!-- Amber Badge Box -->
    <rect x="6" y="63" width="51" height="18" rx="4" fill="#fef3c7" />
    
    <!-- Bold numeric representation "1000" visual bars/shapes (Strictly NO actual digits/letters, using stylized geometric currency/number shapes) -->
    <!-- Currency Symbol shape ($/¥ equivalent abstract) -->
    <circle cx="16" cy="72" r="4" fill="#f59e0b" />
    <!-- Stylized 1 0 0 0 blocks -->
    <rect x="25" y="68" width="3" height="8" rx="1" fill="#b45309" />
    <circle cx="33" cy="72" r="3.5" fill="none" stroke="#b45309" stroke-width="2" />
    <circle cx="41" cy="72" r="3.5" fill="none" stroke="#b45309" stroke-width="2" />
    <circle cx="49" cy="72" r="3.5" fill="none" stroke="#b45309" stroke-width="2" />
  </g>

  <!-- Sparkles / Emphasis near the total receipt -->
  <g transform="translate(135, 45)" fill="#fbbf24">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z" />
  </g>
  <g transform="translate(75, 115) scale(0.6)" fill="#38bdf8">
    <path d="M 0 0 L 2 5 L 7 7 L 2 9 L 0 14 L -2 9 L -7 7 L -2 5 Z" />
  </g>

  <!-- Foreground plant/prop on counter for extra depth -->
  <g transform="translate(35, 122)">
    <rect x="0" y="8" width="12" height="13" rx="2" fill="#cbd5e1" />
    <path d="M 6 8 C 6 2 2 -2 -2 -5" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 6 8 C 6 1 12 -3 16 -7" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 6 8 C 6 5 6 -2 6 -10" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="-2" cy="-5" r="3" fill="#34d399" />
    <circle cx="16" cy="-7" r="3" fill="#34d399" />
    <circle cx="6" cy="-10" r="4" fill="#34d399" />
  </g>
</svg>