<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Environment -->
  <rect x="140" y="30" width="60" height="80" rx="4" fill="#334155" opacity="0.3"/>
  <circle cx="180" cy="50" r="1.5" fill="#fde047" opacity="0.6"/>
  <circle cx="160" cy="70" r="1" fill="#fde047" opacity="0.4"/>
  
  <!-- Desk -->
  <path d="M20 200 L220 200 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Large Monitor/Dashboard -->
  <rect x="50" y="50" width="140" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Progress Graph on Screen -->
  <path d="M70 130 Q 100 120, 110 100 T 170 70" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="170" cy="70" r="4" fill="#10b981" filter="url(#glow)"/>
  
  <!-- Checkmarks (Milestones) -->
  <path d="M70 110 l3 3 l6 -6" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 90 l3 3 l6 -6" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 85 l3 3 l6 -6" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character 1 (Left - Sitting) -->
  <path d="M40 210 Q 40 160, 70 160 Q 100 160, 100 210" fill="#fb923c"/> <!-- Shirt -->
  <circle cx="70" cy="145" r="12" fill="#ffedd5"/> <!-- Head -->
  <path d="M70 133 Q 85 133, 85 145 L 55 145 Q 55 133, 70 133" fill="#475569"/> <!-- Hair -->
  <path d="M90 180 Q 110 170, 120 150" fill="none" stroke="#ffedd5" stroke-width="4" stroke-linecap="round"/> <!-- Arm pointing -->
  
  <!-- Character 2 (Right - Standing) -->
  <path d="M160 220 Q 160 150, 190 150 Q 220 150, 220 220" fill="#38bdf8"/> <!-- Shirt -->
  <circle cx="190" cy="135" r="12" fill="#fde68a"/> <!-- Head -->
  <path d="M190 123 Q 205 123, 205 135 L 175 135 Q 175 123, 190 123" fill="#1e293b"/> <!-- Hair -->
  <path d="M170 170 Q 150 160, 140 140" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/> <!-- Arm gesturing -->
  
  <!-- Desk Props -->
  <rect x="110" y="185" width="30" height="15" rx="2" fill="#94a3b8"/> <!-- Keyboard -->
  <path d="M160 185 Q 165 185, 165 195 L 155 195 Q 155 185, 160 185" fill="#f43f5e"/> <!-- Coffee Mug -->
  <rect x="25" y="170" width="15" height="30" rx="2" fill="#10b981" opacity="0.6"/> <!-- Folder/Book -->
  
  <!-- Warm Glow from Screen -->
  <rect x="50" y="50" width="140" height="100" rx="8" fill="#38bdf8" opacity="0.05"/>
  
  <!-- Small Plant -->
  <path d="M200 190 L210 190 L212 200 L198 200 Z" fill="#78350f"/> <!-- Pot -->
  <path d="M205 190 Q 205 175, 215 175 M205 190 Q 205 180, 195 180" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>