<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#38bdf8;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Floor/Ground -->
  <ellipse cx="120" cy="220" rx="100" ry="20" fill="#1e293b" opacity="0.5"/>

  <!-- The Central Object of Surprise (A Floating Glowing Cube/Artifact) -->
  <g transform="translate(120, 145)">
    <circle r="35" fill="url(#orbGlow)"/>
    <path d="M-10 -10 L10 -10 L15 0 L5 10 L-15 10 Z" fill="#38bdf8" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M-10 -10 L0 -18 L20 -18 L10 -10 Z" fill="#7dd3fc" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M10 -10 L20 -18 L25 -8 L15 0 Z" fill="#0ea5e9" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3s" repeatCount="indefinite" />
    </path>
    <!-- Sparkles -->
    <circle cx="-20" cy="-15" r="1.5" fill="#fbbf24" filter="url(#softGlow)"/>
    <circle cx="25" cy="10" r="1" fill="#fbbf24"/>
    <circle cx="5" cy="-25" r="1.2" fill="#fff"/>
  </g>

  <!-- Character 1: Amazed Woman (Left) -->
  <g transform="translate(55, 170)">
    <!-- Body -->
    <path d="M-15 70 Q-15 30 5 30 Q25 30 25 70" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="5" cy="15" r="16" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-11 15 Q-11 -5 5 -5 Q21 -5 21 15 L21 25 Q5 20 -11 25 Z" fill="#475569"/>
    <!-- Face: Surprise Expression -->
    <circle cx="0" cy="15" r="2.5" fill="#1e293b"/> <!-- Eye -->
    <circle cx="12" cy="15" r="2.5" fill="#1e293b"/> <!-- Eye -->
    <ellipse cx="6" cy="24" rx="4" ry="5" fill="#1e293b"/> <!-- Open mouth -->
    <!-- Hands near face -->
    <path d="M-8 40 Q-15 35 -12 25" stroke="#fde68a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M20 40 Q27 35 24 25" stroke="#fde68a" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 2: Shocked Man (Center-Right) -->
  <g transform="translate(175, 165)">
    <!-- Body -->
    <path d="M-20 75 Q-20 35 0 35 Q20 35 20 75" fill="#10b981"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="17" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M-17 12 Q-17 -3 0 -3 Q17 -3 17 12" fill="#1e293b" stroke="#1e293b" stroke-width="4"/>
    <!-- Face: Surprise Expression -->
    <g transform="translate(-2, 0)">
      <circle cx="-6" cy="14" r="2" fill="#1e293b"/> <!-- Eye -->
      <circle cx="6" cy="14" r="2" fill="#1e293b"/> <!-- Eye -->
      <path d="M-8 8 Q-6 5 -4 8" stroke="#1e293b" fill="none" stroke-width="1.5"/> <!-- Eyebrow -->
      <path d="M4 8 Q6 5 8 8" stroke="#1e293b" fill="none" stroke-width="1.5"/> <!-- Eyebrow -->
      <rect x="-4" y="22" width="8" height="6" rx="3" fill="#1e293b"/> <!-- Mouth -->
    </g>
    <!-- Pointing Hand -->
    <path d="M-15 45 Q-35 40 -40 30" stroke="#ffedd5" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 3: Peeking Person (Background Center) -->
  <g transform="translate(120, 155)">
    <!-- Head only peeking from behind -->
    <circle cx="0" cy="0" r="14" fill="#f97316" opacity="0.9"/> <!-- Hat/Hair -->
    <circle cx="0" cy="5" r="13" fill="#f59e0b"/> <!-- Face -->
    <circle cx="-5" cy="5" r="2" fill="#1e293b"/>
    <circle cx="5" cy="5" r="2" fill="#1e293b"/>
    <ellipse cx="0" cy="12" rx="3" ry="4" fill="#1e293b"/>
  </g>

  <!-- Lighting Highlights on Characters -->
  <circle cx="80" cy="155" r="15" fill="#38bdf8" opacity="0.2" filter="url(#softGlow)"/>
  <circle cx="160" cy="155" r="15" fill="#38bdf8" opacity="0.2" filter="url(#softGlow)"/>

</svg>