    <path d="M60 80 L80 100" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Blueprint/Contract -->
  <rect x="130" y="150" width="40" height="30" rx="2" fill="#f1f5f9"/>
  <path d="M135 155 H165 M135 162 H165 M135 169 H150" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative Accents -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="210" cy="30" r="2" fill="#fbbf24"/>
  <path d="M30 190 L210 190" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Foreground Ground -->
  <path d="M0 240 L240 240 L240 180 Q120 200 0 180 Z" fill="#0f172a" opacity="0.5"/>
