<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Construction Site -->
  <path d="M40 180 L200 180 L190 120 L50 120 Z" fill="#334155"/>
  <rect x="60" y="130" width="20" height="50" fill="#475569"/>
  <rect x="160" y="130" width="20" height="50" fill="#475569"/>
  
  <!-- Crane silhouette -->
  <path d="M180 120 L180 60 L220 80 M180 70 L140 90" stroke="#94a3b8" stroke-width="4" fill="none"/>
  
  <!-- Main Character -->
