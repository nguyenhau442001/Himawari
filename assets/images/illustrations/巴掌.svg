<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Contextual Elements (Miniature Tech / Scale Reference) -->
  <g transform="translate(120, 135)" opacity="0.6">
    <!-- Sleek modern mini PC case sitting in the palm -->
    <rect x="-24" y="-20" width="48" height="40" rx="6" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    <!-- Ports and details on mini PC -->
    <circle cx="-16" cy="0" r="2.5" fill="#00F2FE"/>
    <rect x="-8" y="-2" width="20" height="4" rx="1" fill="#4A5568"/>
    <rect x="-8" y="6" width="12" height="3" rx="1" fill="#FFB800"/>
  </g>

  <!-- Main Object: Open Human Palm (巴掌 / Lòng bàn tay) -->
  <g transform="translate(0, 5)">
    <!-- Wrist & Forearm base -->
    <path d="M 96,180 L 96,210 C 96,216 102,220 110,220 L 130,220 C 138,220 144,216 144,210 L 144,180 Z" fill="#DDB487" opacity="0.8"/>
    
    <!-- Palm Base (Anatomical shape) -->
    <path d="M 85,130 C 80,110 90,85 120,85 C 150,85 160,110 155,130 C 150,150 145,185 130,185 C 115,185 90,150 85,130 Z" fill="#F4C295"/>
    
    <!-- Palm lines / details -->
    <path d="M 105,125 Q 120,140 135,120" fill="none" stroke="#E0A977" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 112,145 Q 122,155 130,140" fill="none" stroke="#E0A977" stroke-width="2" stroke-linecap="round"/>

    <!-- Thumb (Left side) -->
    <path d="M 88,110 C 70,115 62,130 65,145 C 68,155 78,155 88,140 Z" fill="#F4C295"/>
    <path d="M 75,130 Q 70,138 78,145" fill="none" stroke="#E0A977" stroke-width="2" stroke-linecap="round"/>

    <!-- Index Finger -->
    <path d="M 92,85 C 92,65 96,55 106,55 C 116,55 118,65 118,85 Z" fill="#F4C295"/>
    <path d="M 100,70 L 110,70" stroke="#E0A977" stroke-width="2" stroke-linecap="round"/>

    <!-- Middle Finger -->
    <path d="M 116,83 C 116,60 120,48 130,48 C 140,48 144,60 142,83 Z" fill="#F4C295"/>
    <path d="M 124,64 L 134,64" stroke="#E0A977" stroke-width="2" stroke-linecap="round"/>

    <!-- Ring Finger -->
    <path d="M 140,86 C 142,66 148,55 156,58 C 164,61 165,72 160,92 Z" fill="#F4C295"/>
    <path d="M 147,73 L 155,71" stroke="#E0A977" stroke-width="2" stroke-linecap="round"/>

    <!-- Pinky Finger -->
    <path d="M 154,98 C 162,85 172,90 174,102 C 176,112 168,122 160,125 Z" fill="#F4C295"/>
    <path d="M 163,108 L 169,112" stroke="#E0A977" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- High-contrast focus accent: Subtle glowing highlight indicating the palm's scale/boundary -->
  <circle cx="120" cy="135" r="45" fill="none" stroke="#FFB800" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
</svg>