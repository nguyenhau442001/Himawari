<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 110)">
    <!-- Sun Ray / Heat Wave Background Glow -->
    <circle cx="0" cy="0" r="64" fill="#FF5722" opacity="0.15"/>
    <circle cx="0" cy="0" r="52" fill="#FF9800" opacity="0.2"/>

    <!-- Sun / Heat Source -->
    <circle cx="0" cy="0" r="40" fill="#FF9800"/>
    <circle cx="0" cy="0" r="32" fill="#FFC107"/>

    <!-- Heat Waves / Radiating Rays (Curved Flat Design Elements) -->
    <path d="M-55,-15 C-65,-25 -65,-45 -50,-55" stroke="#FF5722" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M55,-15 C65,-25 65,-45 50,-55" stroke="#FF5722" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M-60,15 C-75,10 -80,-5 -70,-20" stroke="#FF9800" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60,15 C75,10 80,-5 70,-20" stroke="#FF9800" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ground Landscape Base -->
  <path d="M30,190 Q120,175 210,190 L220,215 Q120,225 20,215 Z" fill="#2C323D"/>
  
  <!-- Heat Distortion / Rising Waves at the bottom -->
  <path d="M70,170 Q75,155 70,140 Q65,125 70,110" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none"/>
  <path d="M120,175 Q125,160 120,145 Q115,130 120,115" stroke="#FF5722" stroke-width="3.5" stroke-linecap="round" opacity="0.8" fill="none"/>
  <path d="M170,170 Q175,155 170,140 Q165,125 170,110" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none"/>

</svg>