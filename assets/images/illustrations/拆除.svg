<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 125)">
    <!-- Ground line -->
    <path d="M-90 45 L90 45" stroke="#2A2E3D" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Building structure being demolished (Center noun) -->
    <!-- Left standing portion -->
    <path d="M-60 45 L-60 -15 L-20 -15 L-20 45 Z" fill="#252A3A"/>
    <!-- Windows of standing portion -->
    <rect x="-50" y="-5" width="8" height="12" rx="2" fill="#3A4256"/>
    <rect x="-35" y="-5" width="8" height="12" rx="2" fill="#3A4256"/>

    <!-- Demolished/falling section (Right side) -->
    <!-- Falling wall block -->
    <g transform="translate(30, 15) rotate(18)">
      <path d="M0 0 L40 -20 L40 30 L0 30 Z" fill="#2E3446"/>
      <rect x="10" y="-5" width="8" height="12" rx="2" fill="#3A4256"/>
    </g>

    <!-- Falling roof truss / debris -->
    <path d="M-10 -40 L25 -65 L50 -35 Z" fill="#E67E22" opacity="0.9"/>
    <path d="M25 -65 L10 -30 L45 -20 Z" fill="#D35400" opacity="0.8"/>

    <!-- Wrecking Ball & Crane Hook System -->
    <!-- Crane cable -->
    <path d="M40 -75 L40 -5" stroke="#8C95A5" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Heavy Wrecking Ball (Impact) -->
    <circle cx="28" cy="10" r="14" fill="#E74C3C"/>
    <!-- Ball highlight -->
    <circle cx="24" cy="6" r="4" fill="#FF6B6B" opacity="0.6"/>

    <!-- Impact dust and debris particles -->
    <circle cx="5" cy="25" r="4" fill="#8C95A5" opacity="0.8"/>
    <circle cx="55" cy="5" r="3" fill="#8C95A5" opacity="0.6"/>
    <circle cx="45" cy="35" r="5" fill="#8C95A5" opacity="0.7"/>
    <path d="M12 30 L22 38" stroke="#8C95A5" stroke-width="2" stroke-linecap="round"/>
    <path d="M48 -10 L58 -5" stroke="#8C95A5" stroke-width="2" stroke-linecap="round"/>

    <!-- Hazard / Construction Accent (Orange/Gold warning stripes on beam) -->
    <g transform="translate(-20, -15)">
      <rect x="0" y="0" width="45" height="8" rx="2" fill="#F39C12"/>
      <path d="M10 0 L15 8 M25 0 L30 8 M40 0 L45 8" stroke="#1A1D24" stroke-width="3"/>
    </g>
  </g>
</svg>