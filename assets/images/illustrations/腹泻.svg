<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Plate / Seafood context -->
    <path d="M 60 180 L 180 180 C 190 180, 195 190, 185 198 C 150 210, 90 210, 55 198 C 45 190, 50 180, 60 180 Z" fill="#2A2F3D" />
    <ellipse cx="120" cy="184" rx="55" ry="8" fill="#363C4E" />
    
    <!-- Stylized Shrimp/Seafood hinting at context -->
    <path d="M 85 175 C 75 160, 90 145, 105 155 C 115 160, 110 170, 100 175 Z" fill="#FF7849" opacity="0.6"/>

    <!-- Simplified human abdominal/stomach silhouette focused -->
    <path d="M 95 65 C 95 55, 145 55, 145 65 C 155 80, 160 100, 150 120 C 140 140, 100 140, 90 120 C 80 100, 85 80, 95 65 Z" fill="#242936" stroke="#363C4E" stroke-width="3"/>

    <!-- Intestinal tract glowing / distressed (orange/red accent) -->
    <path d="M 102 85 C 102 80, 138 80, 138 85 C 138 90, 102 90, 102 95 C 102 100, 138 100, 138 105 C 138 110, 102 110, 102 115 C 102 122, 138 122, 138 125" fill="none" stroke="#FF5722" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M 102 85 C 102 80, 138 80, 138 85 C 138 90, 102 90, 102 95 C 102 100, 138 100, 138 105 C 138 110, 102 110, 102 115 C 102 122, 138 122, 138 125" fill="none" stroke="#FF8A65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pain / Distress indicator (flash/spike lines) -->
    <path d="M 120 70 L 120 135" stroke="#FFD54F" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Dynamic flushing / urgency arrows (downward fast motion) -->
    <g transform="translate(0, 10)">
      <path d="M 120 135 L 120 162" stroke="#FF5722" stroke-width="4" stroke-linecap="round"/>
      <path d="M 112 152 L 120 162 L 128 152" fill="none" stroke="#FF5722" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M 98 125 L 90 148" stroke="#FF7849" stroke-width="3" stroke-linecap="round"/>
      <path d="M 87 139 L 90 148 L 97 141" fill="none" stroke="#FF7849" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M 142 125 L 150 148" stroke="#FF7849" stroke-width="3" stroke-linecap="round"/>
      <path d="M 143 141 L 150 148 L 153 139" fill="none" stroke="#FF7849" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Discomfort expression marks around upper body -->
    <path d="M 75 75 C 70 70, 70 65, 75 60" fill="none" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 165 75 C 170 70, 170 65, 165 60" fill="none" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>