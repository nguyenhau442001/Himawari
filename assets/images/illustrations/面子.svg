<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mirror Frame -->
  <rect x="70" y="40" width="100" height="130" rx="8" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="78" y="48" width="84" height="114" rx="4" fill="#bae6fd"/>
  
  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 100 C-30 80, -10 70, 0 70 C10 70, 30 80, 30 100 L30 120 L-30 120 Z" fill="#38bdf8"/>
    <!-- Neck -->
    <rect x="-8" y="55" width="16" height="15" fill="#fde68a"/>
    <!-- Head -->
    <circle cx="0" cy="35" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-25 30 C-25 10, -10 5, 0 5 C10 5, 25 10, 25 30 L25 40 L-25 40 Z" fill="#1e293b"/>
    <!-- Expression: Adjusting tie/collar -->
    <path d="M-10 65 L0 75 L10 65" stroke="#fb923c" stroke-width="3" fill="none"/>
    <circle cx="-8" cy="30" r="2" fill="#1e293b"/>
    <circle cx="8" cy="30" r="2" fill="#1e293b"/>
  </g>
  
  <!-- Reflection -->
  <g transform="translate(120, 120)" opacity="0.4">
    <path d="M-30 100 C-30 80, -10 70, 0 70 C10 70, 30 80, 30 100 L30 120 L-30 120 Z" fill="#38bdf8"/>
    <rect x="-8" y="55" width="16" height="15" fill="#fde68a"/>
    <circle cx="0" cy="35" r="25" fill="#fde68a"/>
    <path d="M-25 30 C-25 10, -10 5, 0 5 C10 5, 25 10, 25 30 L25 40 L-25 40 Z" fill="#1e293b"/>
    <path d="M-10 65 L0 75 L10 65" stroke="#fb923c" stroke-width="3" fill="none"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="40" cy="180" r="15" fill="#ec4899" opacity="0.6"/>
  <circle cx="200" cy="60" r="10" fill="#10b981" opacity="0.6"/>
  <path d="M180 180 L210 180 L195 155 Z" fill="#fbbf24" opacity="0.8"/>
