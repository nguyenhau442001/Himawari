<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The "Original" Object (Old Prototype) -->
  <g opacity="0.6">
    <rect x="40" y="120" width="60" height="40" rx="4" fill="#475569"/>
    <circle cx="70" cy="140" r="10" fill="#1e293b"/>
  </g>
  
  <!-- The "Innovation" (New Improved Version) -->
  <g>
    <rect x="120" y="90" width="80" height="70" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="130" y="100" width="60" height="20" rx="2" fill="#38bdf8"/>
    <circle cx="160" cy="140" r="12" fill="#10b981"/>
    <path d="M140 140 L180 140 M160 120 L160 160" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Character: Designer/Engineer -->
  <g>
    <path d="M80 180 C80 160 100 150 110 150 C120 150 140 160 140 180" fill="#fb923c"/>
    <circle cx="110" cy="135" r="15" fill="#fde68a"/>
    <rect x="105" y="150" width="10" height="30" fill="#fb923c"/>
    <!-- Arm reaching to improve -->
    <path d="M115 160 L140 130" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Connection/Spark of Innovation -->
  <path d="M100 130 Q110 110 130 120" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Ambient light/glow -->
  <circle cx="160" cy="140" r="30" fill="#f59e0b" opacity="0.1"/>
</svg>