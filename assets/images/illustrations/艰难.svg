<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed Dark Mode Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background lighting representing corporate/office tension -->
  <circle cx="120" cy="80" r="90" fill="url(#warmLight)" />

  <!-- WINDOW & CITY BACKGROUND (Out of focus, night/overtime) -->
  <g opacity="0.3">
    <!-- Window frame -->
    <rect x="140" y="30" width="70" height="90" rx="4" fill="#334155" />
    <rect x="144" y="34" width="29" height="40" fill="#475569" />
    <rect x="177" y="34" width="29" height="40" fill="#475569" />
    <rect x="144" y="78" width="29" height="38" fill="#475569" />
    <rect x="177" y="78" width="29" height="38" fill="#475569" />
    <!-- City lights outside -->
    <rect x="30" y="50" width="12" height="70" fill="#64748b" opacity="0.4"/>
    <rect x="46" y="40" width="16" height="80" fill="#475569" opacity="0.4"/>
    <circle cx="36" cy="60" r="1" fill="#fef08a" />
    <circle cx="52" cy="70" r="1" fill="#fef08a" />
    <circle cx="55" cy="50" r="1" fill="#fef08a" />
  </g>

  <!-- OFFICE ENVIRONMENT & PROPS -->
  <!-- Bookshelf / Filing cabinet in background -->
  <rect x="20" y="60" width="45" height="90" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="90" x2="65" y2="90" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="120" x2="65" y2="120" stroke="#334155" stroke-width="2"/>
  <!-- Folders on shelf -->
  <rect x="26" y="72" width="8" height="16" rx="1" fill="#ef4444" opacity="0.8"/>
  <rect x="36" y="70" width="8" height="18" rx="1" fill="#3b82f6" opacity="0.8"/>
  <rect x="46" y="74" width="6" height="14" rx="1" fill="#10b981" opacity="0.8"/>

  <!-- Main Office Desk -->
  <rect x="10" y="160" width="220" height="14" rx="3" fill="url(#deskGrad)" />
  <rect x="30" y="174" width="12" height="50" fill="#0f172a" />
  <rect x="198" y="174" width="12" height="50" fill="#0f172a" />

  <!-- Desk Props: Financial chart showing decline (downturn/difficult times) -->
  <g transform="translate(140, 115)">
    <!-- Paper -->
    <rect x="0" y="0" width="36" height="45" rx="2" fill="#f8fafc" />
    <!-- Downward Trend Line Graph -->
    <polyline points="6,35 14,25 22,32 30,12" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="12" r="2.5" fill="#ef4444"/>
    <!-- Red warning stamp -->
    <rect x="8" y="16" width="20" height="8" rx="1" fill="#ef4444" opacity="0.2"/>
  </g>

  <!-- Laptop showing heavy workload / graphs -->
  <g transform="translate(75, 125)">
    <!-- Laptop Base -->
    <path d="M-10,35 L50,35 L42,23 L-2,23 Z" fill="#64748b" />
    <rect x="-11" y="35" width="62" height="3" rx="1.5" fill="#475569" />
    <!-- Screen -->
    <rect x="0" y="0" width="40" height="25" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- UI elements (red decline bars) -->
    <rect x="6" y="14" width="5" height="7" fill="#ef4444" rx="1"/>
    <rect x="14" y="10" width="5" height="11" fill="#ef4444" rx="1"/>
    <rect x="22" y="16" width="5" height="5" fill="#ef4444" rx="1"/>
    <line x1="4" y1="21" x2="36" y2="21" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Coffee Mug (Stress/Late nights) -->
  <rect x="45" y="142" width="12" height="16" rx="2" fill="#cbd5e1" />
  <path d="M57,146 C61,146 61,154 57,154" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Steam lines -->
  <path d="M49,134 C50,132 48,130 49,128" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M53,136 C54,134 52,132 53,130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- MAIN CHARACTER: Stressed/Overwhelmed Business Professional -->
  <g transform="translate(90, 80)">
    <!-- Body / Suit Jacket -->
    <path d="M25,50 C25,45 35,38 45,38 C55,38 65,45 65,50 L75,85 L15,85 Z" fill="#1e293b" />
    <!-- Shirt collar & Tie -->
    <polygon points="45,38 52,52 38,52" fill="#f8fafc" />
    <polygon points="45,45 48,70 45,75 42,70" fill="#ef4444" /> <!-- Red tie for corporate stress/alert -->
    <path d="M25,50 C32,55 38,55 45,50 C52,55 58,55 65,50 L70,80 L20,80 Z" fill="#334155" /> <!-- Jacket lapels -->

    <!-- Neck -->
    <rect x="40" y="30" width="10" height="12" fill="#f1d0b1" />

    <!-- Head (Hand on head / Face in hand gesture showing immense difficulty/worry) -->
    <g transform="translate(33, 2)">
      <!-- Head base -->
      <circle cx="12" cy="18" r="14" fill="#f5d0b1" />
      
      <!-- Hair (Messy, overworked look) -->
      <path d="M-1,15 C-2,5 6,2 14,2 C22,2 26,7 26,16 C23,12 20,10 14,10 C8,10 2,12 -1,15 Z" fill="#334155" />

      <!-- Concerned Face Features (Eyes closed tightly in worry, furrowed brow) -->
      <path d="M5,17 L10,19" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <path d="M14,19 L19,17" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <!-- Furrowed brows -->
      <line x1="4" y1="15" x2="11" y2="17" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="17" x2="20" y2="15" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Worried Mouth (Tight, straight line) -->
      <line x1="10" y1="26" x2="15" y2="26" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

      <!-- Hand holding head (Classic pose for "艰难" - hard times/burden) -->
      <path d="M12,12 C10,12 4,16 2,22 C0,28 6,32 10,30 C12,29 14,24 12,22" fill="#f5d0b1" />
      <!-- Fingers pressing temples -->
      <circle cx="5" cy="18" r="3" fill="#f5d0b1" />
      <circle cx="10" cy="15" r="3" fill="#f5d0b1" />
    </g>

    <!-- Arms -->
    <!-- Supporting arm on desk -->
    <path d="M22,55 C10,65 5,75 5,80" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
    <!-- Other arm resting -->
    <path d="M68,55 C78,65 82,75 80,80" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- SECOND CHARACTER (Optional colleague in background, adding realism and depth) -->
  <g transform="translate(160, 95)" opacity="0.85">
    <!-- Body -->
    <path d="M15,40 C15,35 23,30 30,30 C37,30 45,35 45,40 L50,75 L10,75 Z" fill="#334155" />
    <!-- Neck & Head -->
    <rect x="25" y="22" width="10" height="10" fill="#e0ac69" />
    <circle cx="30" cy="14" r="11" fill="#e0ac69" />
    <!-- Hair -->
    <path d="M20,10 C20,4 25,2 30,2 C36,2 40,6 40,14 C35,11 25,11 20,10 Z" fill="#475569" />
    <!-- Head in hands looking at papers -->
    <path d="M22,12 C20,16 22,22 26,22 C30,22 34,18 36,14" fill="#e0ac69" />
    <!-- Arm supporting chin -->
    <path d="M22,35 C20,28 26,24 28,24" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- DESK LAMP (Casting focused warm amber downward glow) -->
  <g transform="translate(195, 100)">
    <!-- Base -->
    <ellipse cx="0" cy="60" rx="12" ry="4" fill="#475569" />
    <!-- Stand / Arm -->
    <path d="M0,60 L0,25 L-20,15" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shade -->
    <path d="M-30,15 L-10,15 L-5,5 L-35,5 Z" fill="#38bdf8" />
    <!-- Light Beam Overlay -->
    <polygon points="-20,15 -75,160 35,160" fill="#f59e0b" opacity="0.08" />
  </g>

</svg>