<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="heavyHit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Room Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>

    <!-- Window / Night City Background Context -->
    <path d="M 150 30 L 210 30 L 210 110 L 150 110 Z" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="158" y="40" width="12" height="18" fill="#fbbf24" opacity="0.3"/>
    <rect x="178" y="60" width="12" height="25" fill="#38bdf8" opacity="0.2"/>
    <rect x="194" y="45" width="10" height="15" fill="#fbbf24" opacity="0.2"/>
    <path d="M 150 30 L 210 30 L 210 110 L 150 110 Z" fill="url(#windowGlow)"/>

    <!-- Bookshelf / Office Props in background -->
    <rect x="25" y="40" width="45" height="70" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="25" y1="65" x2="70" y2="65" stroke="#334155" stroke-width="1.5"/>
    <line x1="25" y1="90" x2="70" y2="90" stroke="#334155" stroke-width="1.5"/>
    <rect x="30" y="48" width="8" height="17" fill="#ef4444" opacity="0.7"/>
    <rect x="40" y="50" width="6" height="15" fill="#38bdf8" opacity="0.7"/>
    <rect x="32" y="75" width="14" height="15" fill="#10b981" opacity="0.7"/>

    <!-- Heavy Blow / Impact Visual Cue radiating from the paper -->
    <circle cx="120" cy="140" r="70" fill="url(#heavyHit)"/>
    <path d="M 95 105 L 110 120" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 145 105 L 130 120" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 120 95 L 120 115" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Office Desk -->
    <path d="M 30 170 L 210 170 L 220 210 L 20 210 Z" fill="url(#deskGrad)"/>
    <rect x="20" y="165" width="200" height="8" rx="2" fill="#475569"/>

    <!-- Desk Props: Laptop, Coffee Mug, Scrunched Failure Papers -->
    <!-- Laptop -->
    <path d="M 150 168 L 195 168 L 202 155 L 143 155 Z" fill="#64748b"/>
    <rect x="145" y="130" width="55" height="27" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <rect x="148" y="133" width="49" height="21" fill="#0f172a"/>
    <!-- Failure chart on screen -->
    <polyline points="152,150 160,145 168,148 176,138 184,142 192,136" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="192" cy="136" r="2" fill="#ef4444"/>

    <!-- Coffee Mug -->
    <rect x="120" y="150" width="14" height="18" rx="2" fill="#cbd5e1"/>
    <path d="M 134 154 C 139 154 139 164 134 164" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Scrunched Failure Papers / Red Marks -->
    <circle cx="95" cy="162" r="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 92 160 L 98 164" stroke="#ef4444" stroke-width="2"/>
    <circle cx="75" cy="165" r="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Main Subject (Character experiencing 'DaJi' / heavy blow of failure) -->
    <!-- Chair Back -->
    <path d="M 90 100 L 110 100 L 115 170 L 85 170 Z" fill="#334155" opacity="0.9"/>
    
    <!-- Character Body slumped over -->
    <!-- Torso -->
    <path d="M 85 130 C 90 120, 110 125, 120 140 C 125 150, 115 170, 95 170 Z" fill="#3b82f6"/>
    
    <!-- Head in Hands (Defeated posture) -->
    <!-- Arms crossed on desk / supporting head -->
    <path d="M 85 145 C 90 135, 105 130, 118 145 C 120 148, 110 155, 95 155 Z" fill="#2563eb"/>
    <path d="M 100 130 C 105 125, 115 130, 118 140 C 118 145, 105 145, 100 130 Z" fill="#f8fafc"/> <!-- Hands holding head -->

    <!-- Head bowed down -->
    <circle cx="102" cy="122" r="14" fill="#fbbf24"/>
    <!-- Messy hair indicating stress -->
    <path d="M 88 118 C 90 110, 95 110, 100 112 C 105 110, 112 112, 114 120 C 110 116, 95 116, 88 118 Z" fill="#1e293b"/>

    <!-- Dropped Report Document with Bold Red 'F' / Failure Mark on Desk -->
    <g transform="translate(45, 150) rotate(-15)">
      <rect x="0" y="0" width="35" height="25" fill="#f8fafc" rx="1"/>
      <line x1="5" y1="6" x2="25" y2="6" stroke="#94a3b8" stroke-width="2"/>
      <line x1="5" y1="11" x2="20" y2="11" stroke="#94a3b8" stroke-width="2"/>
      <!-- Giant Red Failure Mark -->
      <path d="M 22 8 L 30 8 M 26 8 L 26 20 M 23 15 L 29 15" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Additional dramatic lighting highlights -->
    <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
  </g>
</svg>