<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Server Rack Body -->
  <rect x="70" y="44" width="100" height="152" rx="8" fill="#282D37" stroke="#3A4252" stroke-width="2"/>

  <!-- Top Unit -->
  <rect x="82" y="60" width="76" height="32" rx="4" fill="#1E232B" stroke="#3A4252" stroke-width="1.5"/>
  <!-- Drive bays top -->
  <circle cx="96" cy="76" r="3" fill="#64748B"/>
  <rect x="110" y="74" width="24" height="4" rx="2" fill="#3A4252"/>
  <circle cx="148" cy="76" r="3.5" fill="#EF4444"/> <!-- Error status indicator -->

  <!-- Middle Unit -->
  <rect x="82" y="104" width="76" height="32" rx="4" fill="#1E232B" stroke="#3A4252" stroke-width="1.5"/>
  <!-- Drive bays mid -->
  <circle cx="96" cy="120" r="3" fill="#64748B"/>
  <rect x="110" y="118" width="24" height="4" rx="2" fill="#3A4252"/>
  <circle cx="148" cy="120" r="3.5" fill="#F59E0B"/> <!-- Warning status -->

  <!-- Bottom Unit -->
  <rect x="82" y="148" width="76" height="32" rx="4" fill="#1E232B" stroke="#3A4252" stroke-width="1.5"/>
  <!-- Drive bays bot -->
  <circle cx="96" cy="164" r="3" fill="#64748B"/>
  <rect x="110" y="162" width="24" height="4" rx="2" fill="#3A4252"/>
  <circle cx="148" cy="164" r="3.5" fill="#10B981"/> <!-- Normal status -->

  <!-- Rack mount ears / screws -->
  <circle cx="78" cy="52" r="2" fill="#4B5563"/>
  <circle cx="162" cy="52" r="2" fill="#4B5563"/>
  <circle cx="78" cy="196" r="2" fill="#4B5563"/>
  <circle cx="162" cy="196" r="2" fill="#4B5563"/>

  <!-- Glow effect from the error state -->
  <path d="M148 72 L148 80 M144 76 L152 76" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>