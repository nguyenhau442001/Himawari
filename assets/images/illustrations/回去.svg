<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M40 180 L200 180" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- House silhouette (Destination) -->
  <path d="M160 180 L160 130 L180 110 L200 130 L200 180 Z" fill="#2D3748" stroke="#718096" stroke-width="2"/>
  <rect x="170" y="145" width="20" height="35" fill="#1A1D24" stroke="#718096" stroke-width="2"/>
  
  <!-- Character walking back -->
  <g transform="translate(80, 140)">
    <!-- Body -->
    <path d="M10 0 L10 40" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="10" cy="-10" r="8" fill="#F6AD55"/>
    <!-- Legs -->
    <path d="M10 40 L5 60" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 40 L15 60" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M10 10 L20 25" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 10 L0 25" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Directional Arrow (Subtle) -->
  <path d="M90 120 L150 120 M140 110 L150 120 L140 130" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>