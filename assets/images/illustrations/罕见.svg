<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Hologram Glow -->
    <linearGradient id="holoGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- DNA Strand Colors -->
    <linearGradient id="dna1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="dna2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- UI Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment: Modern Medical Lab -->
  <!-- Lab Wall Panels & Equipment Racks -->
  <path d="M20 20 H220 V200 H20 Z" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="70" y1="20" x2="70" y2="150" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="170" y1="20" x2="170" y2="150" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Monitor screen in background showing charts -->
  <rect x="85" y="35" width="70" height="45" rx="4" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <path d="M93 65 L103 50 L113 58 L125 43 L135 55 L147 45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="125" cy="43" r="2.5" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Lab Counter & Microscope Base -->
  <path d="M10 185 H230 V215 H10 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="15" y="175" width="40" height="12" rx="2" fill="#475569"/>

  <!-- Microscope (Left Side) -->
  <path d="M30 175 L30 145 C30 135 35 130 45 130 L55 130" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M42 135 L52 110 L62 115 L52 140 Z" fill="#64748b"/>
  <circle cx="57" cy="112" r="3" fill="#cbd5e1"/>
  <rect x="40" y="170" width="25" height="5" rx="1" fill="#64748b"/>

  <!-- Holographic Rare Medical/DNA Projection (Centerpiece) -->
  <ellipse cx="120" cy="155" rx="35" ry="12" fill="url(#holoGlow)"/>
  <ellipse cx="120" cy="155" rx="35" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <path d="M85 155 L120 120 L155 155" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Floating DNA Double Helix (Representing the "Rare Disease / Condition") -->
  <g transform="translate(120, 95)">
    <!-- Connecting rungs -->
    <line x1="-8" y1="-25" x2="8" y2="-15" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="6" y1="-5" x2="-6" y2="5" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="-8" y1="15" x2="8" y2="25" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Strand 1 -->
    <path d="M -12 -35 C 15 -20, 15 -10, -12 5 C -35 20, -35 30, -12 45" fill="none" stroke="url(#dna1)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Strand 2 -->
    <path d="M 12 -35 C -15 -20, -15 -10, 12 5 C 35 20, 35 30, 12 45" fill="none" stroke="url(#dna2)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Glowing Nodes on DNA -->
    <circle cx="-12" cy="-35" r="3" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="12" cy="-35" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-12" cy="5" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="12" cy="5" r="3" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="-12" cy="45" r="3" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="12" cy="45" r="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Doctor / Researcher Character (Right Side, Examining) -->
  <g transform="translate(160, 105)">
    <!-- Doctor Body / Lab Coat -->
    <path d="M 15 80 L 35 110 H -15 L 5 80 Z" fill="#e2e8f0"/>
    <path d="M 15 80 L 5 110 H -5 L 5 80 Z" fill="#cbd5e1"/> <!-- Coat opening -->
    <path d="M 10 45 C 5 45, 0 50, 0 60 L 0 80 H 30 L 30 60 C 30 50, 20 45, 10 45 Z" fill="#38bdf8"/> <!-- Scrub top underneath -->

    <!-- Head & Face Profile -->
    <circle cx="12" cy="25" r="14" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M -2 22 C -2 12, 10 10, 22 18 C 22 25, 20 30, 20 30 C 20 30, 5 32, -2 22 Z" fill="#334155"/>
    
    <!-- Glasses -->
    <rect x="12" y="20" width="8" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Arm & Hand pointing/interacting with hologram -->
    <path d="M 5 60 C -5 65, -15 65, -25 55" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-27" cy="53" r="3.5" fill="#ffedd5"/> <!-- Hand -->
  </g>

  <!-- Ambient Glow Particles / Sparks indicating specialized discovery -->
  <circle cx="95" cy="115" r="1.5" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="145" cy="85" r="2" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="105" cy="140" r="1" fill="#f43f5e" filter="url(#glow)"/>
</svg>