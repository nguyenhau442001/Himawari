<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Snowy ground baseline representing the context -->
  <path d="M 30,170 Q 70,165 120,170 Q 170,175 210,170 L 210,195 L 30,195 Z" fill="#282E3D" opacity="0.6"/>
  <path d="M 30,170 Q 70,165 120,170 Q 170,175 210,170" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Trail of cute animal footprints (脚印) curving upwards/across the snow -->
  <!-- Footprint 1 (Background, small) -->
  <g transform="translate(60, 145) rotate(-15) scale(0.55)">
    <ellipse cx="0" cy="10" rx="10" ry="12" fill="#38BDF8" opacity="0.5"/>
    <circle cx="-9" cy="-5" r="4.5" fill="#38BDF8" opacity="0.5"/>
    <circle cx="-3" cy="-10" r="4.5" fill="#38BDF8" opacity="0.5"/>
    <circle cx="4" cy="-10" r="4.5" fill="#38BDF8" opacity="0.5"/>
    <circle cx="10" cy="-5" r="4.5" fill="#38BDF8" opacity="0.5"/>
  </g>

  <!-- Footprint 2 (Mid-ground, medium) -->
  <g transform="translate(100, 130) rotate(5) scale(0.75)">
    <ellipse cx="0" cy="10" rx="10" ry="12" fill="#38BDF8" opacity="0.8"/>
    <circle cx="-9" cy="-5" r="4.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="-3" cy="-10" r="4.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="4" cy="-10" r="4.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="10" cy="-5" r="4.5" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- Footprint 3 (Foreground, large focus object) -->
  <g transform="translate(155, 105) rotate(-10) scale(1.1)">
    <!-- Subtle glow/shadow for emphasis -->
    <ellipse cx="0" cy="12" rx="12" ry="14" fill="#0EA5E9" opacity="0.3"/>
    
    <!-- Main pad -->
    <ellipse cx="0" cy="10" rx="10" ry="12" fill="#38BDF8"/>
    <ellipse cx="0" cy="10" rx="7" ry="9" fill="#7DD3FC"/>
    
    <!-- Toe beans -->
    <circle cx="-9" cy="-5" r="4.5" fill="#38BDF8"/>
    <circle cx="-9" cy="-5" r="2.5" fill="#7DD3FC"/>
    
    <circle cx="-3" cy="-10" r="4.5" fill="#38BDF8"/>
    <circle cx="-3" cy="-10" r="2.5" fill="#7DD3FC"/>
    
    <circle cx="4" cy="-10" r="4.5" fill="#38BDF8"/>
    <circle cx="4" cy="-10" r="2.5" fill="#7DD3FC"/>
    
    <circle cx="10" cy="-5" r="4.5" fill="#38BDF8"/>
    <circle cx="10" cy="-5" r="2.5" fill="#7DD3FC"/>
  </g>

  <!-- Additional glowing spark/focus indicator for clarity -->
  <path d="M 185,85 L 188,92 L 195,95 L 188,98 L 185,105 L 182,98 L 175,95 L 182,92 Z" fill="#F59E0B" opacity="0.8"/>
  <path d="M 75,115 L 77,119 L 81,121 L 77,123 L 75,127 L 73,123 L 69,121 L 73,119 Z" fill="#F59E0B" opacity="0.6"/>

</svg>