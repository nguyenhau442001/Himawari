<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Interior -->
  <rect x="20" y="40" width="200" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="50" width="180" height="140" fill="#0f172a" opacity="0.5"/>
  
  <!-- Teacher (Standing) -->
  <g transform="translate(160, 80)">
    <circle cx="15" cy="20" r="12" fill="#fde68a"/>
    <path d="M5 40 Q15 35 25 40 L20 80 L10 80 Z" fill="#38bdf8"/>
    <rect x="5" y="80" width="8" height="30" fill="#1e293b"/>
    <rect x="17" y="80" width="8" height="30" fill="#1e293b"/>
  </g>
  
  <!-- Students (Two figures) -->
  <g transform="translate(60, 90)">
    <circle cx="10" cy="20" r="10" fill="#fde68a"/>
    <path d="M0 35 Q10 30 20 35 L15 70 L5 70 Z" fill="#fb923c"/>
    <rect x="2" y="70" width="6" height="25" fill="#1e293b"/>
    <rect x="12" y="70" width="6" height="25" fill="#1e293b"/>
  </g>
  
  <g transform="translate(90, 95)">
    <circle cx="10" cy="20" r="10" fill="#fde68a"/>
    <path d="M0 35 Q10 30 20 35 L15 70 L5 70 Z" fill="#ec4899"/>
    <rect x="2" y="70" width="6" height="25" fill="#1e293b"/>
    <rect x="12" y="70" width="6" height="25" fill="#1e293b"/>
  </g>
  
  <!-- Gift/Prop -->
  <rect x="70" y="150" width="20" height="20" fill="#10b981" rx="2"/>
  <rect x="78" y="150" width="4" height="20" fill="#ffffff" opacity="0.3"/>
  <path d="M70 155 L90 155" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Bookshelf Background -->
  <rect x="160" y="60" width="40" height="5" fill="#475569"/>
  <rect x="160" y="70" width="40" height="5" fill="#475569"/>
  
  <!-- Window Light -->
  <circle cx="200" cy="40" r="15" fill="#f59e0b" opacity="0.2"/>
</svg>