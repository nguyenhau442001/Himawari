<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Elements: Rain -->
  <g stroke="#4A5568" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="20" x2="30" y2="50"/>
    <line x1="80" y1="10" x2="70" y2="40"/>
    <line x1="120" y1="30" x2="110" y2="60"/>
    <line x1="160" y1="15" x2="150" y2="45"/>
    <line x1="200" y1="25" x2="190" y2="55"/>
  </g>

  <!-- Flood Water -->
  <path d="M0 240 L0 180 Q60 160 120 180 T240 180 L240 240 Z" fill="#2C5282"/>
  <path d="M0 240 L0 190 Q60 170 120 190 T240 190 L240 240 Z" fill="#3182CE"/>

  <!-- Character: Person struggling/experiencing the flood -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-15 0 L15 0 L10 40 L-10 40 Z" fill="#E2E8F0"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="15" fill="#E2E8F0"/>
    <!-- Arms in defensive/struggling posture -->
    <path d="M-15 5 L-30 20" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 5 L30 20" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Motion lines indicating impact/force -->
  <path d="M40 170 Q60 160 80 170" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M160 170 Q180 160 200 170" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Debris/Impact visual -->
  <circle cx="50" cy="180" r="4" fill="#F6AD55"/>
  <circle cx="190" cy="180" r="4" fill="#F6AD55"/>
</svg>