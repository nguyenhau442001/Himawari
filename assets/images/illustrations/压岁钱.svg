<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Decor -->
  <path d="M40 20 L40 80 M200 20 L200 80" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="40" cy="90" r="6" fill="#fbbf24"/>
  <circle cx="200" cy="90" r="6" fill="#fbbf24"/>
  
  <!-- Elder Character -->
  <g transform="translate(40, 100)">
    <path d="M30 120 L30 60 Q30 40 50 40 L70 40 Q90 40 90 60 L90 120" fill="#38bdf8"/>
    <circle cx="60" cy="30" r="20" fill="#fde68a"/>
    <path d="M50 35 Q60 45 70 35" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Child Character -->
  <g transform="translate(130, 120)">
    <path d="M20 100 L20 50 Q20 35 35 35 L45 35 Q60 35 60 50 L60 100" fill="#ec4899"/>
    <circle cx="40" cy="25" r="15" fill="#fde68a"/>
    <path d="M35 25 L45 25" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- The Red Envelope (压岁钱) -->
  <g transform="translate(95, 130)">
    <rect x="0" y="0" width="40" height="25" rx="2" fill="#ef4444"/>
    <rect x="5" y="5" width="30" height="15" rx="1" fill="#f59e0b"/>
  </g>
  
  <!-- Decorative Lanterns -->
  <circle cx="180" cy="40" r="15" fill="#ef4444"/>
  <path d="M180 55 L180 70" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="60" cy="40" r="15" fill="#ef4444"/>
  <path d="M60 55 L60 70" stroke="#fbbf24" stroke-width="2"/>
</svg>