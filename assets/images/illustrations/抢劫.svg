<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Night Urban Theme -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Distant City Skyline & Street Elements -->
  <!-- Building 1 -->
  <rect x="20" y="70" width="40" height="130" fill="#1e293b" opacity="0.6"/>
  <rect x="28" y="80" width="8" height="12" fill="#38bdf8" opacity="0.3"/>
  <rect x="44" y="80" width="8" height="12" fill="#38bdf8" opacity="0.3"/>
  <rect x="28" y="105" width="8" height="12" fill="#38bdf8" opacity="0.3"/>
  <rect x="44" y="105" width="8" height="12" fill="#38bdf8" opacity="0.3"/>

  <!-- Building 2 -->
  <rect x="75" y="50" width="55" height="150" fill="#1e293b" opacity="0.8"/>
  <rect x="85" y="65" width="10" height="16" fill="#fbbf24" opacity="0.3"/>
  <rect x="105" y="65" width="10" height="16" fill="#fbbf24" opacity="0.3"/>
  <rect x="85" y="95" width="10" height="16" fill="#fbbf24" opacity="0.3"/>
  <rect x="105" y="95" width="10" height="16" fill="#38bdf8" opacity="0.3"/>

  <!-- Building 3 (Right) -->
  <rect x="165" y="80" width="55" height="120" fill="#1e293b" opacity="0.6"/>
  <rect x="175" y="95" width="12" height="15" fill="#38bdf8" opacity="0.2"/>
  <rect x="195" y="95" width="12" height="15" fill="#38bdf8" opacity="0.2"/>

  <!-- Street Lamp Casting Light -->
  <path d="M195 40 L195 200" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 40 L210 40 L215 50 L175 50 Z" fill="#334155"/>
  <path d="M195 50 L160 210 L230 210 Z" fill="#fbbf24" opacity="0.12"/>
  <circle cx="195" cy="46" r="4" fill="#fbbf24"/>

  <!-- Sidewalk and Street Ground -->
  <rect x="0" y="190" width="240" height="50" fill="#090d16"/>
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-dasharray="8 6" stroke-width="2"/>

  <!-- Street Details: Trash Can / Post -->
  <rect x="25" y="165" width="14" height="35" rx="3" fill="#334155"/>
  <circle cx="32" cy="160" r="8" fill="#475569"/>

  <!-- Action Scene: The Robbery (搶劫) -->
  <!-- Motion Lines / Speed Lines -->
  <path d="M90 120 L55 115" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M100 135 L65 130" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M85 150 L45 145" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Snatcher (Running away to the left with bag) -->
  <g transform="translate(45, 105)">
    <!-- Back leg -->
    <path d="M18 65 L8 85" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <!-- Front leg -->
    <path d="M22 65 L32 82" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M12 35 C12 30 25 30 28 50 L20 68" fill="#0ea5e9"/>
    <!-- Back arm -->
    <path d="M18 40 L5 50" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="24" cy="22" r="10" fill="#fbcfe8"/>
    <!-- Hoodie/Hair -->
    <path d="M14 22 C14 14 34 14 34 22 Z" fill="#0369a1"/>
    <!-- Front arm holding stolen bag -->
    <path d="M25 40 L5 48" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
    <!-- Stolen Bag flying back -->
    <rect x="-5" y="42" width="14" height="12" rx="2" fill="#fb923c"/>
    <path d="M2 42 C2 38 6 38 6 42" stroke="#d97706" stroke-width="2" fill="none"/>
  </g>

  <!-- Victim (Stumbling / Shocked on the right) -->
  <g transform="translate(115, 100)">
    <!-- Legs in stumble pose -->
    <path d="M35 60 L45 85" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M25 60 L15 82" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <!-- Body leaning back -->
    <path d="M30 35 C30 35 40 50 32 65 L22 60" fill="#cbd5e1"/>
    <path d="M25 38 L32 62" fill="#475569"/>
    <!-- Head -->
    <circle cx="36" cy="22" r="10" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M26 20 C28 12 46 12 44 22 Z" fill="#334155"/>
    <!-- Shocked/Open mouth -->
    <circle cx="40" cy="24" r="2" fill="#1e293b"/>
    <!-- Arms thrown up in shock -->
    <path d="M30 40 L12 30" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <path d="M35 38 L55 25" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <!-- Dropped items (Phone / Papers) -->
    <rect x="55" y="70" width="8" height="12" rx="1" fill="#38bdf8" transform="rotate(30 55 70)"/>
    <circle cx="5" cy="78" r="4" fill="#fbbf24"/>
  </g>

  <!-- Dramatic Lighting / Accent Glow -->
  <circle cx="70" cy="120" r="40" fill="#f43f5e" opacity="0.15" filter="blur(10px)"/>
</svg>