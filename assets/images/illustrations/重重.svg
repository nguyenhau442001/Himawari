<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration: "重重" (Layer upon layer / stacked obstacles or barriers) -->
  <g transform="translate(0, 0)">
    <!-- Background subtle depth rings / layers -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#262C38" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="120" cy="120" r="65" fill="none" stroke="#262C38" stroke-width="2"/>

    <!-- Layer 4 (Backmost mountain/barrier) -->
    <path d="M 40 150 Q 80 100 120 120 Q 160 140 200 130 L 200 170 L 40 170 Z" fill="#2A3242" opacity="0.6"/>

    <!-- Layer 3 (Mid-back barrier) -->
    <path d="M 50 140 Q 95 85 135 110 Q 175 135 195 125 L 195 180 L 50 180 Z" fill="#333D52" opacity="0.8"/>

    <!-- Layer 2 (Mid-front barrier) -->
    <path d="M 35 125 Q 75 70 120 95 Q 165 120 205 115 L 205 190 L 35 190 Z" fill="#404B63"/>

    <!-- Layer 1 (Foremost prominent barrier with high-contrast accent) -->
    <path d="M 45 110 Q 85 55 125 75 Q 165 95 195 90 L 195 200 L 45 200 Z" fill="#4E5D78"/>

    <!-- Stylized peaks with golden/orange highlights representing layered difficulty / 重重关卡 -->
    <path d="M 85 95 L 120 70 L 155 95 Z" fill="#F59E0B" opacity="0.9"/>
    <path d="M 105 110 L 130 90 L 155 110 Z" fill="#D97706" opacity="0.7"/>

    <!-- Multiple overlapping geometric vertical stratum/barrier panels (Reinforcing "layer upon layer") -->
    <rect x="75" y="130" width="90" height="8" rx="4" fill="#1A1D24"/>
    <rect x="65" y="148" width="110" height="8" rx="4" fill="#1A1D24"/>
    <rect x="55" y="166" width="130" height="8" rx="4" fill="#1A1D24"/>

    <!-- Central glowing focal points indicating persistence / breaking through layers -->
    <circle cx="120" cy="70" r="4" fill="#FFFFFF"/>
    <circle cx="120" cy="70" r="8" fill="#F59E0B" opacity="0.5"/>
  </g>
</svg>