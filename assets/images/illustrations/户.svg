<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Traditional Single-Leaf House Representation (户 - Door/Household) -->
    <!-- Ground line -->
    <line x1="60" y1="185" x2="180" y2="185" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
    
    <!-- House Structure -->
    <path d="M75 185 L75 105 L120 70 L165 105 L165 185 Z" fill="#242B38" stroke="#4A5568" stroke-width="3"/>
    
    <!-- Roof highlight -->
    <path d="M120 70 L165 105 L75 105 Z" fill="#2E3846"/>
    
    <!-- Warm Home Glow / Window & Door -->
    <rect x="95" y="125" width="50" height="60" rx="4" fill="#1A1D24"/>
    
    <!-- The Door (representing 户 as a single door leaf/household entry) -->
    <!-- Door frame -->
    <rect x="100" y="130" width="40" height="55" rx="2" fill="#2E3846"/>
    <!-- Open door panel (isometric/flat perspective showing entry) -->
    <path d="M100 130 L125 138 L125 185 L100 185 Z" fill="#F6AD55" opacity="0.15"/>
    <rect x="100" y="130" width="40" height="55" rx="2" fill="none" stroke="#F6AD55" stroke-width="2.5"/>
    <!-- Door handle -->
    <circle cx="132" cy="160" r="2.5" fill="#F6AD55"/>

    <!-- Welcome Warm Light from inside -->
    <path d="M100 130 L140 130 L140 185 L100 185 Z" fill="url(#warmGlow)" opacity="0.3"/>

    <!-- Family/Household Symbol (Multiple people silhouettes subtly implied or welcoming porch light) -->
    <circle cx="120" cy="112" r="8" fill="#F6AD55"/>
    <path d="M110 126 C110 120 115 118 120 118 C125 118 130 120 130 126 Z" fill="#F6AD55"/>
  </g>

  <defs>
    <linearGradient id="warmGlow" x1="120" y1="185" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6AD55" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F6AD55" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>