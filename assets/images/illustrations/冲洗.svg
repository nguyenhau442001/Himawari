<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sink basin -->
  <path d="M50 110 L190 110 L175 180 C173 189 165 195 156 195 L84 195 C75 195 67 189 65 180 Z" fill="#2B313C"/>
  <ellipse cx="120" cy="110" rx="70" ry="8" fill="#3A4252"/>
  <ellipse cx="120" cy="185" rx="36" ry="6" fill="#1A1D24"/>

  <!-- Water pooling / splashing effect -->
  <ellipse cx="120" cy="175" rx="30" ry="5" fill="#38BDF8" opacity="0.3"/>
  <ellipse cx="120" cy="178" rx="18" ry="3" fill="#38BDF8" opacity="0.5"/>

  <!-- Faucet -->
  <path d="M120 40 L120 75 C120 85 110 90 100 90 L95 90" fill="none" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <!-- Faucet aerator -->
  <rect x="88" y="87" width="14" height="6" rx="2" fill="#64748B"/>

  <!-- Running Water Stream with Motion Lines -->
  <path d="M93 95 L93 170" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <line x1="91" y1="105" x2="91" y2="125" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="135" x2="95" y2="160" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Splash droplets -->
  <circle cx="85" cy="172" r="2.5" fill="#38BDF8"/>
  <circle cx="102" cy="175" r="2" fill="#38BDF8"/>
  <path d="M89 168 C87 165 83 167 85 170" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M99 169 C101 166 105 168 103 171" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Fresh Green Leaf / Vegetable being washed -->
  <g transform="translate(100, 130) rotate(-15)">
    <!-- Leaf blade -->
    <path d="M20 30 C 5 25, 0 5, 20 0 C 40 5, 35 25, 20 30 Z" fill="#22C55E"/>
    <!-- Leaf veins -->
    <path d="M20 28 L20 4" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 20 L12 14" fill="none" stroke="#15803D" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M20 14 L28 8" fill="none" stroke="#15803D" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M20 8 L13 4" fill="none" stroke="#15803D" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Hand holding the leaf under water -->
  <path d="M125 150 C125 140 115 138 105 142 C95 146 88 152 82 162 C78 168 85 175 92 170 C99 165 106 160 112 158 C118 156 125 160 125 150 Z" fill="#FCA5A5"/>
  <!-- Thumb -->
  <path d="M108 143 C103 145 98 150 96 156 C95 158 98 160 101 157 C106 152 110 148 114 145 Z" fill="#F87171"/>

  <!-- Action / cleaning sparkle accents (Gold/Orange high contrast accent per guidelines) -->
  <path d="M145 120 L148 126 L154 129 L148 132 L145 138 L142 132 L136 129 L142 126 Z" fill="#FBBF24"/>
  <path d="M72 135 L74 139 L78 141 L74 143 L72 147 L70 143 L66 141 L70 139 Z" fill="#FBBF24" transform="scale(0.7) translate(30, 40)"/>
</svg>