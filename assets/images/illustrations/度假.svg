<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sea/Water -->
  <path d="M0 180 C 60 160, 180 160, 240 180 L 240 240 L 0 240 Z" fill="#2C3E50"/>
  <path d="M0 190 C 80 170, 160 200, 240 185" stroke="#3498DB" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Beach/Sand -->
  <path d="M0 180 C 60 190, 180 190, 240 180 L 240 200 L 0 200 Z" fill="#D4AC0D"/>
  
  <!-- Beach Chair -->
  <path d="M160 180 L 190 180 L 180 150 L 150 150 Z" fill="#E67E22"/>
  <path d="M165 180 L 165 195 M185 180 L 185 195" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Human Character (Relaxing) -->
  <g transform="translate(60, 140)">
    <!-- Body -->
    <path d="M0 0 C 10 -20, 50 -20, 60 0 L 50 10 L 10 10 Z" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="30" cy="-10" r="12" fill="#F1C40F"/>
    <!-- Arm reaching out -->
    <path d="M50 5 L 70 20" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>
    <!-- Leg -->
    <path d="M10 10 L 5 30" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Motion lines for relaxation/breeze -->
  <path d="M20 120 Q 40 110 60 120" stroke="#BDC3C7" stroke-width="2" fill="none"/>
  <path d="M30 110 Q 50 100 70 110" stroke="#BDC3C7" stroke-width="2" fill="none"/>
  
  <!-- Sun -->
  <circle cx="200" cy="40" r="25" fill="#F1C40F"/>
  <path d="M200 5 L 200 15 M200 65 L 200 75 M165 40 L 175 40 M225 40 L 235 40" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
</svg>