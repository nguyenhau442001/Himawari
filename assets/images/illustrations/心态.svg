<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="30" y="170" width="180" height="50" fill="#1e293b"/>
  
  <!-- Character: Calm professional at desk -->
  <!-- Head -->
  <circle cx="120" cy="90" r="30" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M95 90 C 95 60, 145 60, 145 90 L 145 70 C 145 50, 95 50, 95 70 Z" fill="#475569"/>
  <!-- Eyes (Calm/Closed) -->
  <path d="M105 90 Q 110 85 115 90" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M125 90 Q 130 85 135 90" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M110 105 Q 120 112 130 105" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <path d="M80 130 C 80 110, 160 110, 160 130 L 170 200 L 70 200 Z" fill="#38bdf8"/>
  
  <!-- Props: Laptop -->
  <rect x="60" y="135" width="60" height="40" rx="4" fill="#94a3b8"/>
  <rect x="65" y="140" width="50" height="30" fill="#0f172a"/>
  <!-- Chart on screen -->
  <path d="M70 165 L 85 150 L 100 155 L 110 145" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Props: Coffee Mug -->
  <rect x="150" y="145" width="25" height="30" rx="3" fill="#fb923c"/>
  <path d="M175 150 Q 185 150 185 160 Q 185 170 175 170" stroke="#fb923c" stroke-width="4" fill="none"/>
  
  <!-- Atmosphere: Golden glow/aura -->
  <circle cx="120" cy="90" r="50" fill="#fbbf24" opacity="0.1"/>
  <circle cx="120" cy="90" r="80" fill="#fbbf24" opacity="0.05"/>
  
  <!-- Window/Background element -->
  <rect x="180" y="30" width="40" height="40" rx="5" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="200" cy="50" r="10" fill="#f59e0b"/>
</svg>