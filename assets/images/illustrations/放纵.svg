<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "放纵" (Indulgence/Lack of restraint) as a person slumped in a chair, 
       surrounded by excessive, scattered items (empty cups, gaming controllers, snacks) 
       to visualize the lack of discipline and the "no-bottom-line" aspect of the concept. -->
  
  <!-- Chair -->
  <path d="M70 180 L170 180 L160 130 L80 130 Z" fill="#3A3F4B"/>
  <path d="M80 130 L80 100 L160 100 L160 130 Z" fill="#4A5060"/>
  
  <!-- Person (Slumped posture) -->
  <circle cx="120" cy="85" r="20" fill="#FFC107"/>
  <path d="M105 110 Q120 120 135 110 L140 150 Q120 165 100 150 Z" fill="#FFC107"/>
  <path d="M135 110 L150 130" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
  <path d="M105 110 L90 130" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Scattered items representing lack of restraint -->
  <rect x="50" y="190" width="20" height="15" rx="2" fill="#E64A19"/>
  <circle cx="190" cy="195" r="10" fill="#E64A19"/>
  <rect x="180" y="160" width="15" height="25" rx="2" fill="#FFC107"/>
  <path d="M60 160 L75 160 L70 180 Z" fill="#FFC107"/>
  <path d="M170 200 L185 220" stroke="#E64A19" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 205 L195 225" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
</svg>