<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative tech circles -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="120" cy="120" r="65" fill="none" stroke="#2A2F3D" stroke-width="1"/>

  <!-- Conceptual Target Zone (Boundary / Within) -->
  <circle cx="120" cy="120" r="50" fill="#242B38" stroke="#3A445C" stroke-width="2"/>
  
  <!-- Inner Highlight Area (Representing "Within") -->
  <circle cx="120" cy="120" r="35" fill="#2E384D" opacity="0.6"/>

  <!-- Central Physical Object: A sleek modern desk calendar / time boundary marker -->
  <g transform="translate(120, 115)">
    <!-- Calendar Stand Base -->
    <path d="M-22,25 L22,25 L18,38 L-18,38 Z" fill="#64748B"/>
    
    <!-- Calendar Body -->
    <rect x="-28" y="-22" width="56" height="50" rx="6" fill="#38BDF8"/>
    
    <!-- Calendar Top Binding/Rings -->
    <rect x="-16" y="-28" width="6" height="8" rx="3" fill="#E2E8F0"/>
    <rect x="10" y="-28" width="6" height="8" rx="3" fill="#E2E8F0"/>

    <!-- Calendar Pages / Inner Accent -->
    <rect x="-22" y="-12" width="44" height="34" rx="3" fill="#F8FAFC"/>
    
    <!-- Grid Lines on Calendar -->
    <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-14" y1="8" x2="6" y2="8" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

    <!-- Focal Checkmark (Completing within the limit) -->
    <circle cx="9" cy="13" r="10" fill="#10B981"/>
    <path d="M5,13 L8,16 L14,10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Surrounding boundary constraint indicators (Brackets/Markers) -->
  <!-- Top Marker -->
  <path d="M112,42 L120,34 L128,42" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom Marker -->
  <path d="M112,198 L120,206 L128,198" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Marker -->
  <path d="M42,112 L34,120 L42,128" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Marker -->
  <path d="M198,112 L206,120 L198,128" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

</svg>