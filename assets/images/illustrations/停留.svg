<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Platform -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="180" width="240" height="4" fill="#475569"/>
  
  <!-- Train -->
  <rect x="20" y="80" width="200" height="100" rx="8" fill="#fb923c"/>
  <rect x="35" y="95" width="40" height="40" rx="4" fill="#0f172a"/>
  <rect x="100" y="95" width="40" height="40" rx="4" fill="#0f172a"/>
  <rect x="165" y="95" width="40" height="40" rx="4" fill="#0f172a"/>
  
  <!-- Clock -->
  <circle cx="120" cy="50" r="20" fill="#f59e0b"/>
  <circle cx="120" cy="50" r="16" fill="#1e293b"/>
  <line x1="120" y1="50" x2="120" y2="40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="130" y2="50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Passenger -->
  <g transform="translate(150, 140)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <rect x="5" y="20" width="10" height="20" rx="2" fill="#38bdf8"/>
    <rect x="2" y="22" width="4" height="15" rx="1" fill="#38bdf8"/>
    <rect x="14" y="22" width="4" height="15" rx="1" fill="#38bdf8"/>
  </g>
  
  <!-- Luggage -->
  <rect x="180" y="160" width="20" height="20" rx="2" fill="#ec4899"/>
  
  <!-- Station Light -->
  <circle cx="20" cy="20" r="6" fill="#10b981"/>
  <circle cx="40" cy="20" r="6" fill="#10b981"/>
  
  <!-- Speed lines -->
  <line x1="220" y1="120" x2="240" y2="120" stroke="#475569" stroke-width="2"/>
  <line x1="220" y1="140" x2="240" y2="140" stroke="#475569" stroke-width="2"/>
</svg>