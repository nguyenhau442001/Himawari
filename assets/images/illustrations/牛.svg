<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/pedestal for focus -->
  <ellipse cx="120" cy="180" rx="70" ry="14" fill="#262B36"/>

  <!-- Bull / Cow Illustration (representing 牛) -->
  <g transform="translate(0, 5)">
    <!-- Body -->
    <path d="M75,120 C75,95 95,85 120,85 C145,85 165,95 165,120 C165,140 155,155 145,160 L145,185 C145,190 140,195 135,195 L125,195 C120,195 115,190 115,185 L115,160 C110,160 105,160 95,160 L95,185 C95,190 90,195 85,195 L75,195 C70,195 65,190 65,185 L65,160 C55,155 45,140 45,120 C45,100 55,90 65,85" fill="#E6AF2E"/>
    
    <!-- Main Torso Mass -->
    <rect x="70" y="95" width="100" height="70" rx="25" fill="#F4B942"/>

    <!-- Head Group -->
    <g transform="translate(120, 85)">
      <!-- Head Base -->
      <path d="M-30,-20 C-30,-35 30,-35 30,-20 C30,-5 20,20 0,25 C-20,20 -30,-5 -30,-20 Z" fill="#F4B942"/>
      
      <!-- Muzzle -->
      <ellipse cx="0" cy="12" rx="18" ry="12" fill="#E6AF2E"/>
      <!-- Nostrils -->
      <ellipse cx="-6" cy="12" rx="2.5" ry="1.5" fill="#3E3424"/>
      <ellipse cx="6" cy="12" rx="2.5" ry="1.5" fill="#3E3424"/>

      <!-- Eyes -->
      <circle cx="-14" cy="-5" r="3.5" fill="#1A1D24"/>
      <circle cx="14" cy="-5" r="3.5" fill="#1A1D24"/>
      <circle cx="-15" cy="-6" r="1" fill="#FFFFFF"/>
      <circle cx="13" cy="-6" r="1" fill="#FFFFFF"/>

      <!-- Horns -->
      <path d="M-22,-28 C-35,-42 -45,-30 -42,-18 C-40,-12 -30,-18 -22,-22 Z" fill="#EAEAEA"/>
      <path d="M22,-28 C35,-42 45,-30 42,-18 C40,-12 30,-18 22,-22 Z" fill="#EAEAEA"/>

      <!-- Ears -->
      <path d="M-28,-18 C-42,-15 -40,-5 -30,-8 Z" fill="#E6AF2E"/>
      <path d="M28,-18 C42,-15 40,-5 30,-8 Z" fill="#E6AF2E"/>
    </g>

    <!-- Legs (Foreground pair) -->
    <rect x="80" y="155" width="14" height="40" rx="7" fill="#E6AF2E"/>
    <rect x="146" y="155" width="14" height="40" rx="7" fill="#E6AF2E"/>
    <!-- Hooves -->
    <rect x="80" y="185" width="14" height="10" rx="3" fill="#3E3424"/>
    <rect x="146" y="185" width="14" height="10" rx="3" fill="#3E3424"/>

    <!-- Cute Ring in Nose (Classic ox trait) -->
    <path d="M120,103 A5,5 0 0,1 120,113 A5,5 0 0,1 120,103" fill="none" stroke="#EAEAEA" stroke-width="2.5"/>

    <!-- Tail -->
    <path d="M170,100 C190,105 195,125 185,145" fill="none" stroke="#F4B942" stroke-width="4" stroke-linecap="round"/>
    <path d="M185,140 C190,150 183,155 180,153 C178,150 182,142 185,140 Z" fill="#3E3424"/>
  </g>
</svg>