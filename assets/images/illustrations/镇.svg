<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ancient Town Scene -->
  <g transform="translate(40, 60)">
    <!-- River/Water path -->
    <path d="M0 120 Q 80 100 160 120 L 160 140 L 0 140 Z" fill="#2C3E50"/>
    
    <!-- Stone Bridge -->
    <path d="M30 110 Q 80 80 130 110" stroke="#95A5A6" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Traditional Buildings -->
    <path d="M10 120 L 10 70 L 40 50 L 70 70 L 70 120 Z" fill="#E67E22"/>
    <path d="M80 120 L 80 60 L 110 40 L 140 60 L 140 120 Z" fill="#D35400"/>
    
    <!-- Roof details -->
    <path d="M5 70 L 45 70 M 75 60 L 145 60" stroke="#F1C40F" stroke-width="4"/>
    
    <!-- Bamboo element -->
    <path d="M150 130 L 150 40" stroke="#27AE60" stroke-width="6"/>
    <path d="M150 50 L 165 40 M 150 60 L 165 50 M 150 70 L 165 60" stroke="#27AE60" stroke-width="2"/>
    
    <!-- Stone path texture -->
    <circle cx="20" cy="130" r="2" fill="#7F8C8D"/>
    <circle cx="50" cy="135" r="2" fill="#7F8C8D"/>
    <circle cx="90" cy="132" r="2" fill="#7F8C8D"/>
    <circle cx="120" cy="136" r="2" fill="#7F8C8D"/>
  </g>
</svg>