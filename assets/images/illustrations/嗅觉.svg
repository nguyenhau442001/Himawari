<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Dog head representing "狗" and "嗅觉" context -->
    <!-- Ears -->
    <path d="M-55 -40 C-75 -20 -70 20 -40 30 C-30 20 -35 -10 -40 -30 Z" fill="#D97706"/>
    <path d="M55 -40 C75 -20 70 20 40 30 C30 20 35 -10 40 -30 Z" fill="#D97706"/>
    
    <!-- Head base -->
    <path d="M-45 -35 C-50 -10 -45 30 0 45 C45 30 50 -10 45 -35 C45 -55 25 -65 0 -65 C-25 -65 -45 -55 -45 -35 Z" fill="#F59E0B"/>
    
    <!-- Snout / Muzzle area -->
    <ellipse cx="0" cy="15" rx="25" ry="20" fill="#FDE68A"/>
    
    <!-- Nose -->
    <path d="M-10 5 C-10 0 10 0 10 5 C10 12 -10 12 -10 5 Z" fill="#1E293B"/>
    
    <!-- Eyes -->
    <circle cx="-18" cy="-20" r="4" fill="#1E293B"/>
    <circle cx="18" cy="-20" r="4" fill="#1E293B"/>
    <circle cx="-19" cy="-22" r="1.5" fill="#FFFFFF"/>
    <circle cx="17" cy="-22" r="1.5" fill="#FFFFFF"/>
    
    <!-- Scent / Olfactory waves indicating "嗅觉" -->
    <g fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round">
      <path d="M-55 -85 C-45 -95 -25 -95 -15 -85" opacity="0.4"/>
      <path d="M-65 -70 C-50 -85 -20 -85 -5 -70" opacity="0.7"/>
      <path d="M-75 -55 C-55 -75 -15 -75 5 -55" opacity="1.0"/>
    </g>
    
    <g fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round">
      <path d="M55 -85 C45 -95 25 -95 15 -85" opacity="0.4"/>
      <path d="M65 -70 C50 -85 20 -85 5 -70" opacity="0.7"/>
      <path d="M75 -55 C55 -75 15 -75 -5 -55" opacity="1.0"/>
    </g>
    
    <!-- Emanating scent spiral/trail moving towards nose -->
    <path d="M0 -115 C15 -115 15 -95 0 -95 C-15 -95 -15 -75 0 -75" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Scent particle dots -->
    <circle cx="0" cy="-60" r="3.5" fill="#38BDF8"/>
    <circle cx="-25" cy="-45" r="2.5" fill="#38BDF8"/>
    <circle cx="25" cy="-45" r="2.5" fill="#38BDF8"/>
  </g>
</svg>