<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Gear Mechanism representing intrinsic connection -->
  <g transform="translate(120, 120)">
    <!-- Large Gear -->
    <path d="M-40 -10 L-40 10 L-20 10 L-20 20 L-10 20 L-10 40 L10 40 L10 20 L20 20 L20 10 L40 10 L40 -10 L20 -10 L20 -20 L10 -20 L10 -40 L-10 -40 L-10 -20 L-20 -20 L-20 -10 Z" fill="#FFB84D"/>
    <circle cx="0" cy="0" r="12" fill="#1A1D24"/>
    
    <!-- Small Gear Interlocked -->
    <g transform="translate(65, 0)">
      <path d="M-20 -5 L-20 5 L-10 5 L-10 10 L-5 10 L-5 20 L5 20 L5 10 L10 10 L10 5 L20 5 L20 -5 L10 -5 L10 -10 L5 -10 L5 -20 L-5 -20 L-5 -10 L-10 -10 L-10 -5 Z" fill="#4DA6FF"/>
      <circle cx="0" cy="0" r="6" fill="#1A1D24"/>
    </g>
    
    <!-- Connection Linkage -->
    <rect x="-20" y="-3" width="85" height="6" rx="3" fill="#3E4451"/>
    
    <!-- Second Large Gear -->
    <g transform="translate(130, 0)">
      <path d="M-40 -10 L-40 10 L-20 10 L-20 20 L-10 20 L-10 40 L10 40 L10 20 L20 20 L20 10 L40 10 L40 -10 L20 -10 L20 -20 L10 -20 L10 -40 L-10 -40 L-10 -20 L-20 -20 L-20 -10 Z" fill="#FFB84D"/>
      <circle cx="0" cy="0" r="12" fill="#1A1D24"/>
    </g>
  </g>
</svg>