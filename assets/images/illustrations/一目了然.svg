<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(40, 40)">
    <!-- Magnifying glass frame -->
    <circle cx="80" cy="80" r="50" fill="none" stroke="#FFB84D" stroke-width="8"/>
    <rect x="115" y="115" width="8" height="40" rx="4" fill="#FFB84D" transform="rotate(45 119 135)"/>
    
    <!-- The clear, iconic object: A bright, high-contrast lightbulb -->
    <path d="M80 30 C 60 30, 50 45, 50 65 C 50 85, 65 95, 65 105 L 95 105 C 95 95, 110 85, 110 65 C 110 45, 100 30, 80 30 Z" fill="#FFD54F"/>
    <rect x="70" y="105" width="20" height="10" fill="#FFB84D"/>
    <rect x="73" y="115" width="14" height="8" rx="2" fill="#FFB84D"/>
    
    <!-- Rays of clarity -->
    <line x1="80" y1="20" x2="80" y2="10" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="60" x2="130" y2="50" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="60" x2="30" y2="50" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>