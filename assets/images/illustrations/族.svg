<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subway Interior Structure -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="180" width="240" height="5" fill="#475569"/>
  <circle cx="40" cy="195" r="4" fill="#64748b"/>
  <circle cx="120" cy="195" r="4" fill="#64748b"/>
  <circle cx="200" cy="195" r="4" fill="#64748b"/>
  
  <!-- Subway Handrails -->
  <path d="M60 0 L60 80" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="60" cy="80" r="8" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M180 0 L180 80" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="180" cy="80" r="8" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Character 1: Man in suit rushing -->
  <g transform="translate(40, 100)">
    <path d="M10 20 L30 20 L25 80 L15 80 Z" fill="#38bdf8"/>
    <ellipse cx="20" cy="15" rx="10" ry="12" fill="#fbbf24"/>
    <path d="M15 75 L10 110 M25 75 L30 110" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <rect x="25" y="30" width="15" height="20" fill="#fb923c" rx="2"/>
  </g>

  <!-- Character 2: Woman with briefcase rushing -->
  <g transform="translate(130, 110)">
    <path d="M0 10 L20 10 L15 70 L5 70 Z" fill="#ec4899"/>
    <ellipse cx="10" cy="5" rx="10" ry="12" fill="#fbbf24"/>
    <path d="M5 65 L0 100 M15 65 L20 100" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <rect x="-10" y="40" width="12" height="8" fill="#10b981" rx="1"/>
  </g>

  <!-- Motion Blur Lines -->
  <path d="M10 120 L40 120" stroke="#f8fafc" stroke-width="1" opacity="0.3"/>
  <path d="M150 130 L190 130" stroke="#f8fafc" stroke-width="1" opacity="0.3"/>
  <path d="M20 140 L50 140" stroke="#f8fafc" stroke-width="1" opacity="0.3"/>
</svg>