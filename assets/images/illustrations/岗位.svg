<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Console Glow -->
    <radialGradient id="consoleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window City Light -->
    <linearGradient id="cityGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Character Uniform Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Control Room Interior -->
  <!-- Back Wall & Window -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#111827"/>
  
  <!-- Large Observational Window showing Night City / Station -->
  <path d="M 60,35 L 180,35 L 180,105 L 60,105 Z" fill="url(#cityGlow)" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Grid & City Silhouette outside -->
  <path d="M 60,70 L 180,70 M 120,35 L 120,105" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="75" y="75" width="12" height="30" fill="#1e293b" opacity="0.6"/>
  <rect x="95" y="60" width="15" height="45" fill="#1e293b" opacity="0.6"/>
  <rect x="135" y="65" width="20" height="40" fill="#1e293b" opacity="0.6"/>
  <rect x="160" y="80" width="12" height="25" fill="#1e293b" opacity="0.6"/>
  
  <!-- Weather/Environment indicators on window (Rain drops / digital stars) -->
  <circle cx="70" cy="45" r="1" fill="#38bdf8" opacity="0.8"/>
  <circle cx="150" cy="50" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="105" cy="85" r="1" fill="#38bdf8" opacity="0.7"/>

  <!-- Wall shelving & telemetry displays -->
  <rect x="30" y="45" width="22" height="15" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <path d="M 34,50 L 40,55 L 48,48" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <rect x="188" y="45" width="22" height="15" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <circle cx="195" cy="52" r="3" fill="#f59e0b"/>
  <circle cx="203" cy="52" r="3" fill="#38bdf8"/>

  <!-- FLOOR -->
  <path d="M 0,195 L 240,195 L 240,240 L 0,240 Z" fill="#090d16"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2"/>

  <!-- WORKSTATION DESK -->
  <!-- Desk Base / Console -->
  <path d="M 40,150 L 200,150 L 215,195 L 25,195 Z" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <!-- Desk Surface Highlight -->
  <path d="M 40,150 L 200,150 L 208,157 L 32,157 Z" fill="#475569"/>

  <!-- PROPS ON DESK -->
  <!-- Holographic / Main Control Console Screen -->
  <rect x="90" y="115" width="60" height="38" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="95" y="120" width="50" height="25" fill="#0284c7" opacity="0.2"/>
  <!-- Screen interface graphics (Abstract lines & data bars) -->
  <path d="M 100,135 L 115,125 L 125,132 L 140,122" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140" cy="122" r="2.5" fill="#10b981"/>
  
  <!-- Secondary Dashboard / Buttons -->
  <rect x="50" y="130" width="30" height="20" rx="3" fill="#334155"/>
  <circle cx="58" cy="140" r="3" fill="#ef4444"/>
  <circle cx="70" cy="140" r="3" fill="#10b981"/>

  <rect x="160" y="130" width="30" height="20" rx="3" fill="#334155"/>
  <line x1="166" y1="138" x2="174" y2="138" stroke="#f59e0b" stroke-width="2"/>
  <line x1="178" y1="138" x2="184" y2="138" stroke="#38bdf8" stroke-width="2"/>
  <line x1="166" y1="144" x2="184" y2="144" stroke="#64748b" stroke-width="2"/>

  <!-- Desk Lamp casting warm light -->
  <path d="M 195,150 L 190,110 L 198,110 L 203,150 Z" fill="#64748b"/>
  <path d="M 180,105 C 180,95 204,95 204,105 Z" fill="#f59e0b" filter="url(#shadow)"/>
  <ellipse cx="192" cy="105" rx="12" ry="4" fill="#fbbf24"/>
  <circle cx="120" cy="155" r="35" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- CHARACTER: Dedicated Professional at Post ("岗位") -->
  <!-- Character Body / Torso (Leaning slightly forward, attentive and steadfast) -->
  <g transform="translate(110, 115)">
    <!-- Chair Back -->
    <path d="M -22,40 L -18,-15 C -18,-20 -12,-25 0,-25 C 12,-25 18,-20 18,-15 L 22,40 Z" fill="#334155" filter="url(#shadow)"/>
    <ellipse cx="0" cy="-25" rx="12" ry="5" fill="#475569"/>

    <!-- Shoulders & Uniform Jacket -->
    <path d="M -32,45 C -32,20 -18,10 0,10 C 18,10 32,20 32,45 L 26,75 C 26,75 18,70 0,70 C -18,70 -26,75 -26,75 Z" fill="url(#jacketGrad)" filter="url(#shadow)"/>
    
    <!-- Collar & Tie/Badge detail -->
    <path d="M -10,10 L 0,25 L 10,10 Z" fill="#e2e8f0"/>
    <polygon points="-3,20 3,20 1.5,45 -1.5,45" fill="#f59e0b"/>
    <rect x="-18" y="28" width="6" height="8" rx="1" fill="#38bdf8"/> <!-- Professional badge -->

    <!-- Arms & Hands positioned on console -->
    <!-- Left Arm -->
    <path d="M -28,32 C -35,35 -45,45 -42,55" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="-42" cy="58" r="5" fill="#fbcfe8"/>

    <!-- Right Arm -->
    <path d="M 28,32 C 38,35 48,45 45,55" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <!-- Right Hand -->
    <circle cx="45" cy="58" r="5" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="-5" y="2" width="10" height="12" fill="#fbcfe8"/>

    <!-- Head & Face (Determined, calm, focused expression) -->
    <circle cx="0" cy="-12" r="18" fill="#fbcfe8" filter="url(#shadow)"/>
    
    <!-- Hair (Stylized neat professional cut, dark slate) -->
    <path d="M -18,-15 C -18,-28 -5,-30 2,-30 C 12,-30 18,-24 19,-14 C 15,-18 10,-19 2,-19 C -7,-19 -15,-16 -18,-15 Z" fill="#1e293b"/>
    <path d="M -16,-17 C -10,-24 5,-23 16,-15 C 13,-23 5,-25 -2,-25 C -9,-25 -14,-22 -16,-17 Z" fill="#334155"/>

    <!-- Ears -->
    <circle cx="-18" cy="-10" r="3" fill="#fbcfe8"/>
    <circle cx="18" cy="-10" r="3" fill="#fbcfe8"/>

    <!-- Facial Features: Focused eyes looking forward at screens -->
    <!-- Eyebrows (Slightly angled downward showing firm concentration/responsibility) -->
    <path d="M -10,-17 L -3,-15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 3,-15 L 10,-17" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes (Calm dots with highlight) -->
    <circle cx="-6" cy="-12" r="2" fill="#0f172a"/>
    <circle cx="6" cy="-12" r="2" fill="#0f172a"/>
    <circle cx="-5" cy="-13" r="0.7" fill="#ffffff"/>
    <circle cx="7" cy="-13" r="0.7" fill="#ffffff"/>

    <!-- Glasses (Smart professional look) -->
    <rect x="-10" y="-16" width="8" height="7" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="2" y="-16" width="8" height="7" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="-2" y1="-13" x2="2" y2="-13" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Nose & Confident Gentle Mouth -->
    <path d="M 0,-10 L -1,-6 L 1,-6" fill="none" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M -4,-3 C -2,-1 2,-1 4,-3" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND ATMOSPHERE / LIGHTING TOUCHES -->
  <!-- Ambient screen reflection on lower foreground desk rim -->
  <path d="M 32,157 L 208,157 L 215,195 L 25,195 Z" fill="url(#consoleGlow)" style="mix-blend-mode: overlay;"/>

  <!-- Coffee Mug (Relatable real-world touch of someone staying at their post/overtime) -->
  <g transform="translate(175, 155)">
    <rect x="0" y="0" width="12" height="15" rx="2" fill="#e2e8f0"/>
    <path d="M 12,3 C 16,3 16,10 12,12" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Steam rising -->
    <path d="M 3,-3 C 5,-6 1,-9 4,-12" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 8,-4 C 10,-7 6,-10 9,-13" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>