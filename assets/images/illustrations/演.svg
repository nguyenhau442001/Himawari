<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stage Spotlight Effect -->
  <ellipse cx="120" cy="120" rx="90" ry="90" fill="#252A33"/>
  
  <!-- Actor Character -->
  <g transform="translate(70, 60)">
    <!-- Body -->
    <path d="M50 140 C50 120, 50 110, 50 100 C50 80, 70 70, 70 70 L30 70 C30 70, 50 80, 50 100 L50 140" fill="#FFB84D"/>
    <!-- Head -->
    <circle cx="50" cy="55" r="20" fill="#FFB84D"/>
    <!-- Hair -->
    <path d="M35 50 C35 35, 65 35, 65 50 C65 45, 60 40, 50 40 C40 40, 35 45, 35 50" fill="#FFFFFF"/>
    <!-- Arm Gesture (Acting) -->
    <path d="M70 85 L95 70" stroke="#FFB84D" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 85 L10 100" stroke="#FFB84D" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Theater Mask / Prop -->
  <g transform="translate(140, 130)">
    <path d="M20 0 C20 -20, 40 -20, 40 0 C40 20, 20 20, 20 0" fill="#FFFFFF"/>
    <circle cx="25" cy="-5" r="3" fill="#1A1D24"/>
    <circle cx="35" cy="-5" r="3" fill="#1A1D24"/>
    <path d="M25 5 Q30 10 35 5" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>

  <!-- Spotlight Beam -->
  <path d="M120 0 L180 240 L60 240 Z" fill="#FFFFFF" opacity="0.05"/>
</svg>