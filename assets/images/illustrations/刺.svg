<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm accent glow behind the rose scene -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character clothing gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Rose stem gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Rose petal gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#glow)" />

  <!-- Background Environment (Cozy Interior) -->
  <!-- Wooden Table / Surface -->
  <path d="M 20 180 L 220 180 L 220 215 C 220 223 213 230 205 230 L 35 230 C 27 230 20 223 20 215 Z" fill="#090d16" />
  <path d="M 20 180 L 220 180 L 220 188 L 20 188 Z" fill="#334155" opacity="0.4" />

  <!-- Background Window / Wall Details -->
  <rect x="150" y="35" width="60" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="180" y1="35" x2="180" y2="120" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="77" x2="210" y2="77" stroke="#334155" stroke-width="2" />
  
  <!-- Warm window light spill -->
  <path d="M 160 35 L 200 35 L 210 120 L 150 120 Z" fill="#fbbf24" opacity="0.04" />

  <!-- Potted Plant on Table (Background Context) -->
  <path d="M 180 150 L 200 150 L 195 180 L 185 180 Z" fill="#cbd5e1" />
  <circle cx="190" cy="140" r="16" fill="#059669" />

  <!-- MAIN SCENE: Character & Rose -->
  <!-- Character Body / Shoulders -->
  <path d="M 50 200 C 50 170 70 155 95 155 C 120 155 140 170 140 200 Z" fill="url(#shirtGrad)" />
  <!-- Collar -->
  <path d="M 80 155 L 95 170 L 110 155 Z" fill="#f8fafc" />

  <!-- Character Neck & Head -->
  <rect x="85" y="125" width="20" height="35" rx="8" fill="#fed7aa" />
  <circle cx="95" cy="105" r="24" fill="#fed7aa" />

  <!-- Character Hair -->
  <path d="M 71 100 C 71 85 82 75 97 75 C 113 75 121 86 121 100 C 121 105 119 110 119 110 C 119 110 114 90 95 90 C 76 90 71 100 71 100 Z" fill="#334155" />

  <!-- Surprised / Ouch Facial Expression -->
  <!-- Eyebrows (pinched in pain) -->
  <line x1="83" y1="98" x2="90" y2="101" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <line x1="107" y1="98" x2="100" y2="101" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes (squeezed shut in small arcs) -->
  <path d="M 83 107 Q 87 111 91 107" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 99 107 Q 103 111 107 107" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Open Ouch Mouth -->
  <ellipse cx="95" cy="116" rx="5" ry="6" fill="#991b1b" />

  <!-- Character Arm Reaching Out -->
  <path d="M 125 170 C 145 170 160 160 165 145" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" />
  <!-- Hand & Pricked Finger Action -->
  <circle cx="168" cy="142" r="8" fill="#fed7aa" />

  <!-- RED PAIN SPARK / ACTION EFFECT -->
  <g transform="translate(172, 134)">
    <circle cx="0" cy="0" r="10" fill="#f43f5e" opacity="0.3" />
    <path d="M 0 -6 L 2 -2 L 6 0 L 2 2 L 0 6 L -2 2 L -6 0 L -2 -2 Z" fill="#fbbf24" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- THE ROSE STEM & THORN (Subject of focus) -->
  <!-- Stem -->
  <path d="M 175 185 C 170 165 160 150 168 138" fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- THE SHARP THORN (刺 - The core vocabulary visual anchor) -->
  <!-- Prominent, sharp triangular thorn pointing directly at the finger -->
  <polygon points="166,144 175,142 169,149" fill="#047857" stroke="#065f46" stroke-width="1" />
  <!-- Extra small thorn lower down -->
  <polygon points="172,165 178,168 171,170" fill="#047857" />

  <!-- Rose Leaf -->
  <path d="M 160 160 Q 145 155 140 145 Q 155 148 165 158 Z" fill="#10b981" />
  <path d="M 160 160 Q 150 153 140 145" fill="none" stroke="#047857" stroke-width="1.5" />

  <!-- Rose Bloom (Top) -->
  <g transform="translate(170, 130)">
    <circle cx="0" cy="0" r="14" fill="#9f1239" />
    <path d="M -10 -4 C -5 -12 5 -12 10 -4 C 6 6 -6 6 -10 -4 Z" fill="url(#roseGrad)" />
    <path d="M -8 -8 C 0 -14 8 -8 4 2 C -2 2 -6 -2 -8 -8 Z" fill="#fb7185" />
    <circle cx="1" cy="-2" r="4" fill="#e11d48" />
  </g>

  <!-- Floating Pain/Surprise Sweat Drop -->
  <path d="M 112 90 Q 115 95 112 98 Q 109 95 112 90 Z" fill="#38bdf8" opacity="0.8" />
</svg>