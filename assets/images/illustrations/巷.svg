<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Perspective ground plane -->
  <path d="M0 240 L90 140 L150 140 L240 240 Z" fill="#2D343E"/>
  
  <!-- Left building wall -->
  <path d="M0 240 L0 40 L80 110 L80 240 Z" fill="#3D4756"/>
  <rect x="20" y="80" width="30" height="40" fill="#FFB86C" rx="4"/>
  <rect x="25" y="85" width="20" height="30" fill="#1A1D24" rx="2"/>
  
  <!-- Right building wall -->
  <path d="M240 240 L240 40 L160 110 L160 240 Z" fill="#3D4756"/>
  <rect x="190" y="130" width="30" height="40" fill="#FFB86C" rx="4"/>
  <rect x="195" y="135" width="20" height="30" fill="#1A1D24" rx="2"/>
  
  <!-- Street floor details -->
  <path d="M90 140 L100 240 M110 140 L120 240 M130 140 L140 240" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Distant alley exit -->
  <rect x="95" y="115" width="50" height="25" fill="#262B36"/>
  <rect x="110" y="120" width="20" height="20" fill="#FFB86C" rx="2"/>
  
  <!-- Street lamp -->
  <path d="M80 110 L80 70" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="65" r="8" fill="#FFB86C"/>
  <circle cx="80" cy="65" r="12" fill="#FFB86C" opacity="0.2"/>
</svg>