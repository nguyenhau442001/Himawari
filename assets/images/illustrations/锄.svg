<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: subtle soil ground -->
  <path d="M 0,185 Q 60,175 120,185 T 240,185 L 240,240 L 0,240 Z" fill="#242B38"/>
  <path d="M 0,195 Q 80,188 160,198 T 240,192 L 240,240 L 0,240 Z" fill="#1E2430"/>

  <!-- Ground surface texture lines -->
  <path d="M 30,190 Q 45,188 60,191" stroke="#2E3848" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 150,196 Q 170,194 190,197" stroke="#2E3848" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 90,205 Q 110,203 130,206" stroke="#2E3848" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Sprout/weed being hoed (contextual tie-in to 'chú cao') -->
  <g transform="translate(75, 175)">
    <path d="M15,10 C15,0 5,-5 0,-15 C10,-10 15,-5 20,5 Z" fill="#4ADE80" opacity="0.8"/>
    <path d="M5,10 C5,2 -2,-2 -8,-8 C0,-5 5,-2 8,5 Z" fill="#22C55E" opacity="0.9"/>
    <path d="M10,12 L10,25" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The Hoe (Chù - Noun): Iconic, clear, centered physical object -->
  <g transform="rotate(-15, 120, 120)">
    <!-- Long wooden handle -->
    <line x1="45" y1="210" x2="175" y2="70" stroke="#C28E54" stroke-width="7" stroke-linecap="round"/>
    <line x1="48" y1="207" x2="172" y2="73" stroke="#DCA268" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Metal blade collar / connection -->
    <path d="M 165,80 L 180,65 L 185,72 L 170,87 Z" fill="#64748B"/>
    <circle cx="173" cy="78" r="2" fill="#475569"/>

    <!-- Sharp metal blade (curved hoe head) -->
    <!-- High contrast accent color (gold/orange highlight & sleek dark steel) -->
    <path d="M 160,55 C 150,50 135,60 130,75 C 127,84 133,92 142,90 C 152,88 175,75 185,62 C 190,55 188,48 180,50 C 172,52 165,54 160,55 Z" fill="#CBD5E1"/>
    <!-- Blade cutting edge highlight -->
    <path d="M 130,75 C 127,84 133,92 142,90 C 152,88 165,80 172,73" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Soil particles flying up (dynamic interaction) -->
  <circle cx="70" cy="165" r="2.5" fill="#C28E54" opacity="0.9"/>
  <circle cx="85" cy="155" r="3.5" fill="#A8733E" opacity="0.9"/>
  <circle cx="62" cy="175" r="2" fill="#A8733E" opacity="0.8"/>
  <path d="M 75,160 Q 80,150 90,153" stroke="#C28E54" stroke-width="1.5" fill="none" stroke-linecap="round"/>

</svg>