<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/pedestal to frame the noun -->
  <circle cx="120" cy="130" r="70" fill="#242833" opacity="0.6"/>
  <ellipse cx="120" cy="180" rx="55" ry="10" fill="#111317" opacity="0.8"/>

  <!-- Chicken Illustration (Noun representation for "鸡") -->
  <g id="rooster-chicken">
    <!-- Tail feathers -->
    <path d="M70 120 C 50 110, 40 90, 45 75 C 55 90, 70 105, 75 115 Z" fill="#3B82F6"/>
    <path d="M68 130 C 45 130, 35 115, 42 100 C 52 110, 65 120, 72 125 Z" fill="#60A5FA"/>
    <path d="M72 140 C 50 145, 45 130, 55 115 C 62 125, 70 135, 76 138 Z" fill="#3B82F6"/>

    <!-- Main Body (Back/Wing area) -->
    <path d="M75 140 C 70 110, 90 95, 120 95 C 150 95, 170 115, 165 145 C 160 170, 130 180, 100 175 C 80 170, 78 155, 75 140 Z" fill="#F59E0B"/>
    
    <!-- Wing highlight -->
    <path d="M100 125 C 120 125, 140 135, 145 155 C 130 165, 110 160, 95 145 Z" fill="#D97706"/>

    <!-- Underbody / Chest -->
    <path d="M140 100 C 165 105, 180 125, 175 155 C 170 175, 145 180, 130 175 C 150 165, 155 140, 140 100 Z" fill="#FBBF24"/>

    <!-- Legs -->
    <path d="M105 175 L 100 200 L 92 200" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M135 175 L 140 200 L 148 200" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Neck & Head -->
    <path d="M135 100 C 130 80, 140 65, 150 55 C 155 50, 165 55, 160 65 C 150 80, 145 90, 145 105 Z" fill="#F59E0B"/>

    <!-- Head / Beak / Comb -->
    <!-- Comb (Red crest) -->
    <path d="M150 48 C 145 38, 155 35, 158 42 C 162 35, 170 40, 165 48 C 172 48, 172 58, 162 58 Z" fill="#EF4444"/>
    
    <!-- Head base -->
    <circle cx="158" cy="58" r="14" fill="#F59E0B"/>

    <!-- Eye -->
    <circle cx="163" cy="55" r="2.5" fill="#1A1D24"/>

    <!-- Beak -->
    <path d="M168 55 L 182 58 L 168 64 Z" fill="#EF4444"/>

    <!-- Wattle (Red part under beak) -->
    <path d="M165 64 C 162 72, 170 72, 170 64 Z" fill="#EF4444"/>
  </g>
</svg>