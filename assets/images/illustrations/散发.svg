<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Subtle background glow / room atmosphere -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <ellipse cx="120" cy="205" rx="80" ry="15" fill="#090d16" opacity="0.8"/>

  <!-- Window frame and night sky context -->
  <path d="M 50 30 L 190 30 L 190 140 L 50 140 Z" fill="#172554" stroke="#334155" stroke-width="3"/>
  <line x1="120" y1="30" x2="120" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="50" y1="85" x2="190" y2="85" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="55" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="155" cy="45" r="2" fill="#f8fafc" opacity="0.9"/>
  <circle cx="170" cy="70" r="1" fill="#f8fafc" opacity="0.6"/>

  <!-- Wooden windowsill/table -->
  <rect x="35" y="140" width="170" height="12" rx="3" fill="#334155"/>
  <rect x="40" y="152" width="160" height="6" rx="2" fill="#1e293b"/>

  <!-- Flower pot -->
  <path d="M 95 140 L 105 115 L 135 115 L 145 140 Z" fill="#ea580c"/>
  <ellipse cx="120" cy="115" rx="15" ry="4" fill="#c2410c"/>
  <!-- Soil -->
  <ellipse cx="120" cy="117" rx="13" ry="3" fill="#78350f"/>

  <!-- Flower stems and leaves -->
  <path d="M 120 115 Q 115 95 105 80" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 115 Q 125 90 135 75" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 115 Q 110 100 95 95" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Leaves -->
  <path d="M 105 100 Q 90 95 95 105 Q 105 108 105 100 Z" fill="#16a34a"/>
  <path d="M 130 102 Q 145 98 142 108 Q 130 112 130 102 Z" fill="#15803d"/>

  <!-- Blooming Flowers (Bright Pink/Coral) -->
  <!-- Left Flower -->
  <g transform="translate(105, 75)">
    <circle cx="0" cy="0" r="14" fill="#f43f5e"/>
    <circle cx="-8" cy="-6" r="6" fill="#fb7185"/>
    <circle cx="8" cy="-6" r="6" fill="#fb7185"/>
    <circle cx="-8" cy="6" r="6" fill="#fb7185"/>
    <circle cx="8" cy="6" r="6" fill="#fb7185"/>
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
  </g>

  <!-- Right Flower -->
  <g transform="translate(135, 70)">
    <circle cx="0" cy="0" r="16" fill="#e11d48"/>
    <circle cx="-9" cy="-7" r="7" fill="#f43f5e"/>
    <circle cx="9" cy="-7" r="7" fill="#f43f5e"/>
    <circle cx="-9" cy="7" r="7" fill="#f43f5e"/>
    <circle cx="9" cy="7" r="7" fill="#f43f5e"/>
    <circle cx="0" cy="0" r="6.5" fill="#f59e0b"/>
  </g>

  <!-- Scent / Aroma Waves (散发 - tỏa ra hương thơm) -->
  <!-- Swirling elegant golden aroma paths drifting into the room -->
  <path d="M 100 65 Q 80 50 90 30 T 70 10" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 140 60 Q 165 45 150 25 T 170 5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 120 60 Q 120 40 105 25 T 130 0" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating aroma sparkles / fragrance particles -->
  <circle cx="75" cy="40" r="3" fill="#fde047" opacity="0.9"/>
  <circle cx="95" cy="20" r="2" fill="#fbb6ce" opacity="0.8"/>
  <circle cx="155" cy="35" r="3.5" fill="#fde047" opacity="0.85"/>
  <circle cx="135" cy="15" r="2" fill="#fbb6ce" opacity="0.9"/>
  <circle cx="115" cy="10" r="2.5" fill="#fde047" opacity="0.7"/>

  <!-- Character experiencing the scent (Delighted person leaning in) -->
  <!-- Body/Shoulders -->
  <path d="M 150 240 L 150 210 Q 150 195 170 190 L 220 190 L 235 240 Z" fill="#0284c7"/>
  
  <!-- Neck -->
  <path d="M 175 195 L 180 180 L 192 180 L 195 195 Z" fill="#fbcfe8"/>

  <!-- Head (profile leaning forward, eyes closed in bliss) -->
  <path d="M 175 170 Q 170 150 190 145 Q 210 140 215 160 Q 220 180 195 185 Z" fill="#fbcfe8"/>
  
  <!-- Hair (Stylish dark bob/bun) -->
  <path d="M 173 160 Q 165 140 190 138 Q 210 135 212 150 Q 200 142 185 145 Q 175 148 173 160 Z" fill="#334155"/>
  <circle cx="212" cy="148" r="7" fill="#334155"/>

  <!-- Facial expression: Blissful curved smile line and peaceful closed eye -->
  <path d="M 200 155 Q 205 153 210 157" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 206 167 Q 211 170 215 165" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Blushing cheek of delight -->
  <circle cx="208" cy="163" r="4" fill="#fda4af" opacity="0.7"/>

  <!-- Foreground details: Cozy room elements (bookshelf edge or desk item) -->
  <rect x="20" y="210" width="45" height="30" rx="4" fill="#475569"/>
  <rect x="25" y="215" width="35" height="5" rx="2" fill="#cbd5e1"/>
  <rect x="25" y="224" width="25" height="5" rx="2" fill="#38bdf8"/>
</svg>