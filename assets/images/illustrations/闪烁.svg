<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Hill Gradient -->
    <linearGradient id="hillGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Sleeping Cat Gradient -->
    <linearGradient id="catGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Distant Glowing Stars (Flashing/Shimmering Effect) -->
  <g opacity="0.6">
    <circle cx="35" cy="45" r="1" fill="#ffffff"/>
    <circle cx="75" cy="25" r="1.5" fill="#fde047"/>
    <circle cx="120" cy="55" r="1" fill="#ffffff"/>
    <circle cx="165" cy="30" r="1.5" fill="#38bdf8"/>
    <circle cx="210" cy="50" r="1" fill="#ffffff"/>
    <circle cx="45" cy="95" r="1.2" fill="#fde047"/>
    <circle cx="195" cy="85" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Large Twinkling Stars (Representing 闪烁) -->
  <!-- Star 1 (Top Left) -->
  <g transform="translate(65, 55)">
    <circle cx="0" cy="0" r="12" fill="url(#starGlow)"/>
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#ffffff"/>
  </g>

  <!-- Star 2 (Center High - Brightest) -->
  <g transform="translate(135, 35)">
    <circle cx="0" cy="0" r="16" fill="url(#starGlow)"/>
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#ffffff"/>
    <!-- Shimmer rays -->
    <path d="M -5 -5 L 5 5 M -5 5 L 5 -5" stroke="#fde047" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Star 3 (Right) -->
  <g transform="translate(185, 65)">
    <circle cx="0" cy="0" r="10" fill="url(#starGlow)"/>
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#ffffff"/>
  </g>

  <!-- Star 4 (Lower Left Sky) -->
  <g transform="translate(90, 85)">
    <circle cx="0" cy="0" r="9" fill="url(#starGlow)"/>
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#ffffff"/>
  </g>

  <!-- Backdrop Environment: Rooftop / Balcony ledge -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="url(#hillGradient)"/>
  
  <!-- Balcony railing / Roof structure -->
  <rect x="20" y="175" width="200" height="15" rx="3" fill="#334155"/>
  <rect x="35" y="150" width="12" height="30" fill="#475569"/>
  <rect x="193" y="150" width="12" height="30" fill="#475569"/>
  <!-- Railing bars -->
  <rect x="55" y="162" width="6" height="15" fill="#1e293b"/>
  <rect x="75" y="162" width="6" height="15" fill="#1e293b"/>
  <rect x="95" y="162" width="6" height="15" fill="#1e293b"/>
  <rect x="115" y="162" width="6" height="15" fill="#1e293b"/>
  <rect x="135" y="162" width="6" height="15" fill="#1e293b"/>
  <rect x="155" y="162" width="6" height="15" fill="#1e293b"/>
  <rect x="175" y="162" width="6" height="15" fill="#1e293b"/>

  <!-- Potted Plant on Balcony (Context Prop) -->
  <path d="M 30 175 L 45 175 L 42 160 L 33 160 Z" fill="#94a3b8"/>
  <path d="M 37 160 C 35 145, 25 140, 20 135" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 39 160 C 42 145, 52 138, 55 130" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="133" r="4" fill="#34d399"/>
  <circle cx="56" cy="128" r="5" fill="#34d399"/>

  <!-- Character 1: Girl sitting, looking up at the night sky -->
  <!-- Body/Torso in cozy sweater -->
  <path d="M 90 175 C 90 155, 100 145, 115 145 C 130 145, 138 155, 140 175 Z" fill="#ec4899"/>
  
  <!-- Cozy Blanket Wrapped Around Legs -->
  <path d="M 85 182 C 85 168, 105 165, 125 168 C 145 170, 150 180, 150 190 L 85 190 Z" fill="url(#blanketGrad)"/>
  <!-- Blanket fold detail -->
  <path d="M 115 171 C 125 171, 140 176, 148 185" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Head & Face (Profile/Three-quarters looking up) -->
  <circle cx="115" cy="130" r="15" fill="#fbcfe8"/>
  <!-- Hair tied up in a bun -->
  <circle cx="112" cy="112" r="6" fill="#475569"/>
  <path d="M 100 128 C 100 118, 125 118, 128 128" fill="#475569"/>
  <!-- Gentle upward gaze/smile profile -->
  <path d="M 122 131 C 124 131, 125 133, 124 135" stroke="#fda4af" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Character 2: Cozy Cat curled up beside her -->
  <path d="M 152 182 C 145 178, 140 185, 145 190 C 150 195, 168 195, 172 188 C 175 182, 165 178, 152 182 Z" fill="url(#catGradient)"/>
  <!-- Cat Head -->
  <circle cx="143" cy="182" r="6" fill="#fb923c"/>
  <!-- Cat Ears -->
  <polygon points="140,177 143,172 146,177" fill="#ea580c"/>
  <polygon points="146,178 149,174 151,180" fill="#ea580c"/>
  <!-- Cat Tail curled -->
  <path d="M 172 188 C 178 186, 180 192, 175 194" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Foreground Atmospheric Glow (Warm ambient light from inside/below contrasting cool night) -->
  <path d="M 0 240 L 240 240 L 240 235 L 0 235 Z" fill="#3b82f6" opacity="0.3"/>
</svg>