<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Sharp, jagged, dark-red broken chain links representing the physical manifestation of hatred -->
    <path d="M40 20 L60 40 L40 60 L20 40 Z" fill="#FF4D4D" stroke="#1A1D24" stroke-width="4"/>
    <path d="M60 40 L80 60 L60 80 L40 60 Z" fill="#FF4D4D" stroke="#1A1D24" stroke-width="4"/>
    <path d="M80 60 L100 80 L80 100 L60 80 Z" fill="#FF4D4D" stroke="#1A1D24" stroke-width="4"/>
    
    <!-- Jagged, sharp-edged iron shackle representing the weight and constriction of hatred -->
    <path d="M30 100 C 30 140, 90 140, 90 100" fill="none" stroke="#FF9F43" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 95 L35 105 M85 95 L95 105" stroke="#FF9F43" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Sharp, thorn-like protrusions -->
    <path d="M50 20 L45 5 L55 5 Z" fill="#FF4D4D"/>
    <path d="M70 80 L75 95 L65 95 Z" fill="#FF4D4D"/>
  </g>
</svg>