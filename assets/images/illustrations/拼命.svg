<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Furniture Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Interior Details -->
  <g id="environment">
    <!-- Window with night city lights -->
    <rect x="25" y="30" width="50" height="65" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- City buildings silhouettes outside -->
    <rect x="30" y="55" width="10" height="40" fill="#1e293b"/>
    <rect x="43" y="45" width="12" height="50" fill="#1e293b"/>
    <rect x="58" y="60" width="12" height="35" fill="#1e293b"/>
    <!-- Tiny window lights -->
    <rect x="33" y="60" width="2" height="2" fill="#fbbf24"/>
    <rect x="47" y="52" width="2" height="3" fill="#38bdf8"/>
    <rect x="62" y="70" width="2" height="2" fill="#fbbf24"/>
    
    <!-- Wall Shelf with books / files -->
    <rect x="150" y="45" width="65" height="4" rx="2" fill="#475569"/>
    <path d="M160 45 L160 28 L170 28 L170 45 Z" fill="#ef4444"/>
    <path d="M172 45 L172 32 L182 32 L182 45 Z" fill="#3b82f6"/>
    <path d="M185 45 L185 25 L197 25 L197 45 Z" fill="#10b981"/>

    <!-- Wall Clock showing late hour (e.g., 2:00 AM) -->
    <circle cx="115" cy="40" r="12" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="115" cy="40" r="1" fill="#f8fafc"/>
    <line x1="115" y1="40" x2="115" y2="33" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="115" y1="40" x2="122" y2="40" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Lamp Light Cone -->
  <path d="M180 15 L215 130 L145 130 Z" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Desk Lamp Fixture -->
  <path d="M175 25 Q180 50 185 85" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M168 25 L192 25 L185 15 Z" fill="#475569"/>

  <!-- Main Desk Surface -->
  <rect x="10" y="165" width="220" height="70" fill="url(#deskGrad)" rx="4"/>
  <rect x="10" y="165" width="220" height="6" fill="#475569" rx="2"/>

  <!-- Desk Props (Papers, Coffee, Multiple Monitors/Screens) -->
  <g id="desk-props">
    <!-- Coffee mug with steam -->
    <rect x="195" y="145" width="16" height="20" rx="3" fill="#cbd5e1"/>
    <path d="M211 150 C215 150 215 158 211 160" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M200 140 Q202 135 200 130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M206 139 Q208 133 206 127" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Stack of documents / extra work -->
    <path d="M150 155 L175 150 L185 162 L160 167 Z" fill="#f1f5f9"/>
    <path d="M148 160 L173 155 L183 167 L158 172 Z" fill="#e2e8f0"/>
    <line x1="155" y1="160" x2="168" y2="157" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="158" y1="165" x2="171" y2="162" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Laptop / Monitors setup showing intense multitasking ("拼命工作") -->
    <!-- Secondary Monitor (Left) -->
    <rect x="35" y="115" width="40" height="30" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="38" y="118" width="34" height="24" fill="#0284c7"/>
    <polyline points="42,130 48,135 58,122 66,128" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 145 L58 145 L55 152 L53 152 Z" fill="#64748b"/>

    <!-- Main Curved Monitor (Center) -->
    <rect x="78" y="100" width="62" height="45" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="82" y="104" width="54" height="37" fill="url(#screenGlow)"/>
    <!-- Code / Data UI lines on screen -->
    <line x1="88" y1="112" x2="110" y2="112" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="122" x2="124" y2="122" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="88" y1="130" x2="105" y2="130" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M100 145 L118 145 L114 157 L104 157 Z" fill="#64748b"/>
  </g>

  <!-- Flying Coins (Visualizing "想多赚点钱" - earning extra money through intense effort) -->
  <g id="flying-coins" filter="url(#glow)">
    <!-- Coin 1 -->
    <circle cx="110" cy="80" r="8" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="110" cy="80" r="4" fill="none" stroke="#ca8a04" stroke-width="1"/>
    <!-- Coin 2 -->
    <circle cx="135" cy="65" r="10" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="1.5"/>
    <rect x="133" y="61" width="4" height="8" fill="#ca8a04" rx="1"/>
    <!-- Coin 3 -->
    <circle cx="155" cy="85" r="7" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="1"/>
    <!-- Sparkles -->
    <path d="M125 75 L127 70 L130 75 L135 77 L130 79 L127 84 L125 79 L120 77 Z" fill="#fef08a"/>
    <path d="M145 52 L146 48 L149 52 L153 53 L149 54 L146 58 L145 54 L141 53 Z" fill="#fef08a"/>
  </g>

  <!-- Character: Hardworking Professional ("拼命" - Intense dedication, sweat drops, leaning forward) -->
  <g id="character">
    <!-- Chair Backrest -->
    <path d="M90 120 Q85 160 88 190" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

    <!-- Body / Torso leaning forward intensely -->
    <path d="M95 145 C100 130 115 125 125 140 L135 175 C135 175 110 185 95 170 Z" fill="#3b82f6"/>
    <!-- Shirt collar/tie -->
    <polygon points="112,130 122,135 116,145" fill="#f8fafc"/>
    <polygon points="116,145 118,145 119,160 115,160" fill="#ef4444"/>

    <!-- Arms actively typing / reaching -->
    <!-- Left Arm -->
    <path d="M102 140 Q90 155 105 165" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="106" cy="166" r="5" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Right Arm (reaching fast) -->
    <path d="M124 136 Q135 150 125 168" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="123" cy="170" r="5" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Head and Face (Intense focus expression, messy hair from working overtime, sweat drop) -->
    <g id="head">
      <!-- Neck -->
      <path d="M110 125 L116 125 L115 135 L111 135 Z" fill="#fbcfe8"/>
      
      <!-- Head Base -->
      <circle cx="113" cy="108" r="16" fill="#fbcfe8"/>

      <!-- Messy Overtime Hair -->
      <path d="M97 110 C96 95 110 90 125 95 C130 96 132 102 130 106 C129 101 120 95 110 96 C102 97 99 104 97 110 Z" fill="#1e293b"/>
      <path d="M124 94 C128 92 133 96 133 100" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

      <!-- Focused Eyes (Concentrated slant) -->
      <line x1="116" y1="106" x2="124" y2="108" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="103" y1="106" x2="111" y2="108" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Determined Eyebrows (Slanted down for intense effort) -->
      <line x1="102" y1="103" x2="111" y2="104" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="117" y1="104" x2="125" y2="103" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Focused Mouth (Grimacing/Determined line) -->
      <path d="M111 118 Q115 115 120 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Sweat Drop (Signifying hard work / "拼命") -->
      <path d="M129 108 C132 112 132 116 129 116 C126 116 126 112 129 108 Z" fill="#38bdf8" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Foreground decorative accent / Frame border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>