<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/vignette effect for depth -->
  <circle cx="120" cy="120" r="90" fill="#252A36" opacity="0.6"/>

  <!-- Contextual Visual: A physical storefront counter with fresh fruit and a clear low-price tag -->
  <!-- Storefront counter base -->
  <rect x="50" y="140" width="140" height="55" rx="6" fill="#2D3748"/>
  <!-- Counter top surface -->
  <rect x="44" y="132" width="152" height="12" rx="4" fill="#4A5568"/>
  <!-- Counter front panel wood texture/accent line -->
  <rect x="60" y="155" width="120" height="4" rx="2" fill="#1A1D24" opacity="0.4"/>
  <rect x="60" y="170" width="120" height="4" rx="2" fill="#1A1D24" opacity="0.4"/>

  <!-- Wooden Fruit Crate on Counter -->
  <rect x="75" y="96" width="90" height="40" rx="4" fill="#C05621"/>
  <rect x="78" y="99" width="84" height="34" rx="2" fill="#DD6B20"/>
  <!-- Crate slats -->
  <line x1="105" y1="99" x2="105" y2="133" stroke="#9C4221" stroke-width="3"/>
  <line x1="135" y1="99" x2="135" y2="133" stroke="#9C4221" stroke-width="3"/>

  <!-- Fresh Fruits (Apples & Oranges representing the fruit shop context) -->
  <!-- Back row fruits -->
  <circle cx="95" cy="90" r="14" fill="#E53E3E"/>
  <circle cx="120" cy="88" r="15" fill="#DD6B20"/>
  <circle cx="145" cy="90" r="14" fill="#E53E3E"/>
  <!-- Front row fruits -->
  <circle cx="107" cy="80" r="13" fill="#ED8936"/>
  <circle cx="132" cy="79" r="14" fill="#F56565"/>
  <!-- Fruit stems and leaves -->
  <path d="M95 76 Q97 70 101 73" stroke="#38A169" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M120 73 Q123 68 127 71" stroke="#38A169" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M145 76 Q147 70 151 73" stroke="#38A169" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Price Tag representing "低价" (Low Price - physical object noun representation) -->
  <!-- Tag string hanging from the crate -->
  <path d="M120 96 C120 75 140 60 155 60" stroke="#A0AEC0" stroke-width="2" fill="none"/>
  
  <!-- Main Price Tag Shape (High contrast accent: Gold/Orange) -->
  <g transform="translate(145, 50)">
    <!-- Tag body -->
    <path d="M 0 15 L 15 0 L 55 0 L 55 40 L 15 40 Z" fill="#ECC94B"/>
    <!-- Hole ring -->
    <circle cx="10" cy="12" r="3.5" fill="#1A1D24"/>
    <!-- Downward arrow icon on the tag indicating "Low" -->
    <path d="M 30 16 L 30 28 M 24 22 L 30 28 L 36 22" stroke="#744210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Coin / Value indicator line below arrow -->
    <rect x="25" y="32" width="10" height="3" rx="1.5" fill="#744210"/>
  </g>

</svg>