<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Warm Study Atmosphere & Window backdrop -->
  <path d="M140 20 H210 V140 H140 Z" fill="#1e293b" opacity="0.4"/>
  <!-- Window frames -->
  <line x1="175" y1="20" x2="175" y2="140" stroke="#0f172a" stroke-width="3"/>
  <line x1="140" y1="80" x2="210" y2="80" stroke="#0f172a" stroke-width="3"/>
  <!-- Night city lights through window -->
  <circle cx="155" cy="50" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="195" cy="40" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="110" r="1.5" fill="#f43f5e" opacity="0.5"/>
  <circle cx="190" cy="100" r="2" fill="#fbbf24" opacity="0.7"/>

  <!-- Bookshelf & Books -->
  <rect x="25" y="45" width="45" height="6" rx="2" fill="#475569"/>
  <path d="M30 25 h8 v20 h-8 z" fill="#f43f5e" rx="1"/>
  <path d="M40 28 h7 v17 h-7 z" fill="#38bdf8" rx="1"/>
  <path d="M50 22 h9 v23 h-9 z" fill="#10b981" rx="1"/>
  <path d="M61 30 h6 v15 h-6 z" fill="#f59e0b" rx="1"/>

  <!-- Desk Lamp Light Cone -->
  <polygon points="85,35 45,150 125,150" fill="url(#lampGlow)" opacity="0.7"/>

  <!-- Desk Surface -->
  <rect x="0" y="150" width="240" height="90" fill="url(#deskGrad)"/>
  <rect x="0" y="150" width="240" height="4" fill="#475569"/>

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M125 150 L185 150 L195 130 L115 130 Z" fill="#64748b"/>
  <path d="M118 133 L192 133 L188 147 L122 147 Z" fill="url(#screenGlow)"/>
  <rect x="145" y="137" width="24" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>

  <!-- Coffee Mug -->
  <rect x="70" y="133" width="16" height="18" rx="3" fill="#cbd5e1"/>
  <path d="M86 138 c4 0 4 8 0 8" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <!-- Steam from mug -->
  <path d="M75 125 q2 -4 0 -8 t0 -8" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Framed Photo of Parents (Symbolizing Expectations) -->
  <rect x="25" y="112" width="34" height="40" rx="3" fill="#334155"/>
  <rect x="29" y="116" width="26" height="30" rx="1" fill="#f8fafc"/>
  <!-- Abstract parents portrait figures -->
  <circle cx="36" cy="126" r="5" fill="#cbd5e1"/>
  <path d="M30 138 c0 -4 12 -4 12 0 Z" fill="#3b82f6"/>
  <circle cx="47" cy="125" r="5" fill="#cbd5e1"/>
  <path d="M41 137 c0 -4 12 -4 12 0 Z" fill="#ec4899"/>
  <!-- Photo frame stand -->
  <line x1="42" y1="152" x2="42" y2="158" stroke="#64748b" stroke-width="2"/>

  <!-- Desk Lamp Fixture -->
  <path d="M85 35 L85 65" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 35 Q85 20 100 35 Z" fill="#fbbf24"/>
  <circle cx="85" cy="150" r="10" fill="#475569"/>

  <!-- Main Student Character (Focused, determined, studying hard so as NOT to let parents down) -->
  <!-- Chair Back -->
  <path d="M90 100 Q95 70 115 70 Q135 70 140 100 Z" fill="#334155"/>
  
  <!-- Character Body & Shoulders -->
  <path d="M75 180 C75 145 95 130 120 130 C145 130 165 145 165 180 Z" fill="#3b82f6"/>
  <!-- Collar -->
  <path d="M105 130 L120 145 L135 130 L125 127 Z" fill="#f8fafc"/>

  <!-- Head & Hair -->
  <circle cx="120" cy="105" r="22" fill="#fbcfe8"/> <!-- Face base -->
  <!-- Hair (Dark, neat student style) -->
  <path d="M98 105 C98 85 142 85 142 105 C142 112 138 108 135 98 C130 88 110 88 105 98 C102 108 98 112 98 105 Z" fill="#0f172a"/>

  <!-- Determined Facial Expression -->
  <!-- Eyebrows angled with determination/focus -->
  <line x1="108" y1="99" x2="116" y2="102" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="102" x2="132" y2="99" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="112" cy="107" r="2.5" fill="#0f172a"/>
  <circle cx="128" cy="107" r="2.5" fill="#0f172a"/>
  <!-- Determined firm mouth -->
  <path d="M116 116 Q120 118 124 116" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Subtle blush / intensity glow -->
  <circle cx="106" cy="112" r="3" fill="#f43f5e" opacity="0.3"/>
  <circle cx="134" cy="112" r="3" fill="#f43f5e" opacity="0.3"/>

  <!-- Arms leaning on desk, holding pen/studying -->
  <!-- Left arm -->
  <path d="M85 145 C95 140 105 140 115 155" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Right arm / hand writing -->
  <path d="M155 145 C145 140 135 140 128 152" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="125" cy="155" r="5" fill="#fbcfe8"/>

  <!-- Notebook / Textbook on Desk -->
  <path d="M95 145 L145 140 L155 175 L105 180 Z" fill="#f8fafc"/>
  <path d="M120 142 L130 178" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Lines on book (studying hard) -->
  <line x1="103" y1="155" x2="115" y2="154" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="102" y1="163" x2="114" y2="162" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="101" y1="171" x2="113" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="135" y1="150" x2="147" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="134" y1="158" x2="146" y2="156" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="133" y1="166" x2="145" y2="164" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Pencil / Pen in hand -->
  <line x1="122" y1="152" x2="110" y2="165" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle glow highlighting parental expectation/support connection -->
  <path d="M46 116 Q75 90 100 100" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
</svg>