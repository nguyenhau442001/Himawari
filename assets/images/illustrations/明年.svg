<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Calendar Body -->
    <rect x="10" y="10" width="100" height="100" rx="8" fill="#2D343E" stroke="#FFB800" stroke-width="4"/>
    <rect x="10" y="10" width="100" height="25" rx="8" fill="#FFB800"/>
    <!-- Calendar Holes -->
    <circle cx="35" cy="10" r="4" fill="#1A1D24"/>
    <circle cx="60" cy="10" r="4" fill="#1A1D24"/>
    <circle cx="85" cy="10" r="4" fill="#1A1D24"/>
    <!-- Calendar Date -->
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
    <!-- Arrow indicating future -->
    <path d="M130 60 L160 60 M145 45 L160 60 L145 75" stroke="#FFB800" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Next Calendar -->
    <rect x="160" y="35" width="50" height="50" rx="6" fill="#2D343E" stroke="#5D687A" stroke-width="2"/>
    <rect x="160" y="35" width="50" height="12" rx="6" fill="#5D687A"/>
    <text x="185" y="72" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5D687A" text-anchor="middle">01</text>
  </g>
</svg>