<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall / Floor Gradients -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Action impact burst / motion lines -->
    <radialGradient id="impactGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- School Classroom Interior (Environment) -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="170" fill="url(#wallGrad)"/>
  
  <!-- Classroom window showing outdoors -->
  <rect x="145" y="30" width="60" height="80" rx="4" fill="#64748b" opacity="0.4"/>
  <rect x="150" y="35" width="23" height="70" fill="#38bdf8" opacity="0.15"/>
  <rect x="177" y="35" width="23" height="70" fill="#38bdf8" opacity="0.15"/>
  <line x1="161.5" y1="35" x2="161.5" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="70" x2="200" y2="70" stroke="#334155" stroke-width="2"/>

  <!-- Wall decoration: Blackboard outline -->
  <rect x="25" y="35" width="95" height="55" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Abstract chalk drawings on board -->
  <path d="M 35 50 L 55 65 M 70 45 L 85 60" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="100" cy="55" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Classroom Floor -->
  <rect x="0" y="170" width="240" height="70" fill="url(#floorGrad)"/>
  <!-- Floor tile perspective lines -->
  <line x1="0" y1="170" x2="-40" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="170" x2="20" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="170" x2="120" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="180" y1="170" x2="220" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="240" y1="170" x2="280" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#1e293b" stroke-width="1" opacity="0.3"/>

  <!-- Background Props: Overturned School Desk & Flying Backpack/Books -->
  <g transform="translate(185, 155) rotate(15)">
    <!-- Overturned Desk -->
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="#d97706" opacity="0.8"/>
    <line x1="-12" y1="10" x2="-18" y2="25" stroke="#64748b" stroke-width="3"/>
    <line x1="12" y1="10" x2="18" y2="25" stroke="#64748b" stroke-width="3"/>
  </g>
  <!-- Flying Notebook/Paper -->
  <path d="M 130 145 L 145 135 L 152 148 L 137 158 Z" fill="#f8fafc" opacity="0.9"/>
  <line x1="135" y1="147" x2="145" y2="141" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Impact / Action FX Background Glow -->
  <circle cx="115" cy="165" r="45" fill="url(#impactGlow)"/>

  <!-- SCENE SUBJECT: TWO CHILDREN FIGHTING (打架) -->

  <!-- Child 1 (Left side, aggressive red/orange theme) -->
  <g id="child1">
    <!-- Shadow -->
    <ellipse cx="85" cy="205" rx="18" ry="6" fill="#0f172a" opacity="0.6"/>
    
    <!-- Body / Torso (Dynamic leaning forward) -->
    <path d="M 75 145 L 100 160 L 90 190 L 70 185 Z" fill="#ef4444"/>
    <!-- Collar / Shirt details -->
    <path d="M 78 145 L 85 155 L 92 145" fill="#f8fafc"/>

    <!-- Left Arm (Wind-up punch back) -->
    <path d="M 72 150 L 55 135 L 45 145" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Left Hand -->
    <circle cx="42" cy="147" r="5" fill="#fdba74"/>

    <!-- Right Arm (Punching forward) -->
    <path d="M 95 152 L 115 160" stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Right Fist -->
    <circle cx="120" cy="162" r="6" fill="#fdba74"/>

    <!-- Legs (Stanced wide) -->
    <path d="M 75 185 L 60 205" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M 85 185 L 100 203" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="57" cy="207" rx="7" ry="4" fill="#1e293b"/>
    <ellipse cx="103" cy="205" rx="7" ry="4" fill="#1e293b"/>

    <!-- Head & Hair (Action pose, tilted) -->
    <circle cx="70" cy="132" r="14" fill="#fdba74"/>
    <!-- Spiky Hair -->
    <path d="M 56 130 C 55 118, 65 115, 75 120 C 82 116, 90 124, 84 135 Z" fill="#1e293b"/>
    <!-- Determined Face Expression -->
    <path d="M 68 132 L 75 136" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 65 128 L 71 130" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Angry brow -->
    <path d="M 72 140 Q 75 143 78 140" stroke="#9a3412" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Child 2 (Right side, blue/teal theme, stumbling back) -->
  <g id="child2">
    <!-- Shadow -->
    <ellipse cx="145" cy="207" rx="16" ry="5" fill="#0f172a" opacity="0.6"/>

    <!-- Body / Torso (Reeling backward from impact) -->
    <path d="M 135 140 L 155 155 L 145 190 L 125 185 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt details -->
    <path d="M 138 140 L 145 150 L 152 140" fill="#f8fafc"/>

    <!-- Left Arm (Flailing up defensively) -->
    <path d="M 130 145 L 115 130 L 110 120" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="108" cy="117" r="5" fill="#fdba74"/>

    <!-- Right Arm (Reaching out/pushed back) -->
    <path d="M 152 150 L 170 140" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="174" cy="137" r="5" fill="#fdba74"/>

    <!-- Legs (Off balance) -->
    <path d="M 135 185 L 125 205" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M 142 185 L 155 205" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="122" cy="207" rx="7" ry="4" fill="#1e293b"/>
    <ellipse cx="158" cy="207" rx="7" ry="4" fill="#1e293b"/>

    <!-- Head & Hair (Knocked back, dizzy/shocked) -->
    <circle cx="142" cy="128" r="14" fill="#fdba74"/>
    <!-- Messy Hair -->
    <path d="M 128 126 C 130 115, 142 112, 150 120 C 158 116, 160 128, 154 135 Z" fill="#475569"/>
    <!-- Shocked/Dizzy Face -->
    <circle cx="145" cy="125" r="1.5" fill="#1e293b"/>
    <circle cx="137" cy="125" r="1.5" fill="#1e293b"/>
    <path d="M 138 135 Q 141 131 144 135" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Motion & Impact Effects (Clash sparks) -->
  <g transform="translate(118, 158)">
    <path d="M 0 0 L -8 -12 M 0 0 L 10 -10 M 0 0 L 12 5 M 0 0 L -6 10" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="2" cy="-2" r="4" fill="#fef08a"/>
    <circle cx="-5" cy="5" r="2.5" fill="#f97316"/>
  </g>

  <!-- Foreground Foreground Prop (Dropped Pencil Box / Pens on floor) -->
  <rect x="75" y="215" width="24" height="10" rx="3" fill="#10b981" transform="rotate(-10 75 215)"/>
  <line x1="105" y1="218" x2="118" y2="214" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="223" x2="115" y2="223" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

</svg>