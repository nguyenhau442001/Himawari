<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background ambient glow for the light source -->
  <circle cx="120" cy="110" r="70" fill="#FFC107" opacity="0.04"/>

  <!-- Wall mounting base / Socket fixture -->
  <path d="M 105 50 L 135 50 L 130 65 L 110 65 Z" fill="#2E3440" stroke="#4C566A" stroke-width="2" stroke-linejoin="round"/>
  <rect x="114" y="65" width="12" height="15" fill="#3B4252"/>

  <!-- Hanging cord / stem -->
  <line x1="120" y1="35" x2="120" y2="80" stroke="#4C566A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="35" r="4" fill="#88C0D0"/>

  <!-- Light bulb glass outline and body -->
  <path d="M 85 105 C 85 82, 100 70, 120 70 C 140 70, 155 82, 155 105 C 155 120, 145 132, 138 142 L 138 152 C 138 155, 135 158, 132 158 L 108 158 C 105 158, 102 155, 102 152 L 102 142 C 95 132, 85 120, 85 105 Z" 
        fill="#2E3440" stroke="#4C566A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Internal filament (Energy saving spiral shape) -->
  <path d="M 112 125 C 108 120, 108 112, 115 110 C 120 108, 125 112, 120 118 C 115 124, 112 128, 120 132 C 126 135, 130 130, 128 122" 
        fill="none" stroke="#61AFEF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="112" y1="135" x2="112" y2="142" stroke="#4C566A" stroke-width="2"/>
  <line x1="128" y1="135" x2="128" y2="142" stroke="#4C566A" stroke-width="2"/>

  <!-- Green eco-leaf sprouting from the top of the bulb glass -->
  <path d="M 120 70 C 120 52, 138 45, 145 42 C 145 58, 132 68, 120 70 Z" fill="#98C379"/>
  <path d="M 120 70 C 125 58, 135 50, 145 42" fill="none" stroke="#E5FCF0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Base threading details -->
  <line x1="102" y1="146" x2="138" y2="146" stroke="#4C566A" stroke-width="2"/>
  <line x1="102" y1="150" x2="138" y2="150" stroke="#4C566A" stroke-width="2"/>

  <!-- Human Hand interacting (turning off / tapping gently) - representing daily habit -->
  <!-- Sleek flat hand graphic reaching from bottom right -->
  <path d="M 175 195 C 165 185, 150 170, 140 162 C 135 158, 132 152, 136 148 C 140 144, 146 147, 150 152 C 158 160, 175 178, 185 190 C 192 198, 195 210, 185 215 C 175 220, 180 205, 175 195 Z" 
        fill="#E5C07B" stroke="#D19A66" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Index finger pointing/touching base of bulb -->
  <path d="M 140 162 L 132 155 C 129 152, 132 147, 136 148 L 144 156 Z" fill="#E5C07B" stroke="#D19A66" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 152 225 L 185 215 C 195 210, 198 198, 188 192 L 165 180 Z" fill="#61AFEF" opacity="0.8" stroke="#4C566A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Subtle motion/action indicator lines -->
  <path d="M 150 135 C 155 130, 158 122, 158 115" fill="none" stroke="#98C379" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 160 125 C 164 120, 166 112, 165 105" fill="none" stroke="#98C379" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

</svg>