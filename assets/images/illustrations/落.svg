<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Tree Trunk -->
  <path d="M120 180 C 115 140, 115 100, 120 80 L 125 80 C 130 100, 130 140, 125 180 Z" fill="#5D4037"/>
  
  <!-- Branches -->
  <path d="M122 90 L 100 60 M 122 95 L 145 65 M 122 85 L 122 50" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Remaining Leaves on Tree -->
  <ellipse cx="100" cy="60" rx="8" ry="5" fill="#FFB300" transform="rotate(-20 100 60)"/>
  <ellipse cx="145" cy="65" rx="8" ry="5" fill="#FF7043" transform="rotate(20 145 65)"/>
  <ellipse cx="122" cy="50" rx="8" ry="5" fill="#FFB300" transform="rotate(0 122 50)"/>
  
  <!-- Falling Leaves (The Action) -->
  <path d="M135 80 Q 145 100 140 120 Q 135 140 145 150" stroke="#FF7043" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <ellipse cx="145" cy="150" rx="8" ry="5" fill="#FF7043" transform="rotate(45 145 150)"/>
  
  <path d="M110 90 Q 90 110 95 130 Q 100 150 85 160" stroke="#FFB300" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <ellipse cx="85" cy="160" rx="8" ry="5" fill="#FFB300" transform="rotate(-30 85 160)"/>
  
  <!-- Ground -->
  <path d="M40 200 L 200 200" stroke="#455A64" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Fallen Leaves on Ground -->
  <ellipse cx="70" cy="195" rx="8" ry="5" fill="#FF7043"/>
  <ellipse cx="160" cy="195" rx="8" ry="5" fill="#FFB300"/>
  <ellipse cx="180" cy="198" rx="8" ry="5" fill="#FF7043" transform="rotate(10 180 198)"/>
</svg>