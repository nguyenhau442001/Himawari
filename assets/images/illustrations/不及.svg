<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Master craftsman (Teacher) on the left - taller, more detailed, gold accent -->
  <g transform="translate(60, 100)">
    <circle cx="30" cy="20" r="15" fill="#FFB84D"/>
    <rect x="20" y="35" width="20" height="60" rx="4" fill="#FFB84D"/>
    <path d="M10 50 L50 50 L45 80 L15 80 Z" fill="#E69F00"/>
    <path d="M25 40 L35 40 L35 50 L25 50 Z" fill="#333"/>
  </g>

  <!-- Apprentice on the right - smaller, simpler, slate blue accent -->
  <g transform="translate(140, 120)">
    <circle cx="20" cy="20" r="10" fill="#7D8590"/>
    <rect x="15" y="30" width="10" height="50" rx="2" fill="#7D8590"/>
    <path d="M5 40 L35 40 L30 70 L10 70 Z" fill="#5D646E"/>
  </g>

  <!-- Comparison indicator: A simple vertical height line showing the gap -->
  <line x1="110" y1="120" x2="110" y2="190" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="105" y1="120" x2="115" y2="120" stroke="#4A5568" stroke-width="2"/>
  <line x1="105" y1="190" x2="115" y2="190" stroke="#4A5568" stroke-width="2"/>
</svg>