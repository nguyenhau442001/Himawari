<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Grid / Context elements for "Dangerous Place" and "Child" -->
  <g transform="translate(0, 10)">
    <!-- Warning Floor / Hazard Zone Indicator -->
    <path d="M 30,170 L 210,170 L 190,200 L 50,200 Z" fill="#252A34"/>
    <path d="M 50,170 L 190,170" stroke="#FF5722" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

    <!-- Danger Sign (Physical Object representing the hazard location) -->
    <g transform="translate(165, 115)">
      <!-- Triangle Post -->
      <rect x="13" y="25" width="4" height="35" fill="#718096"/>
      <!-- Warning Triangle -->
      <polygon points="15,5 30,30 0,30" fill="#FFC107"/>
      <!-- Exclamation Mark inside Triangle -->
      <rect x="13.5" y="13" width="3" height="9" rx="1.5" fill="#1A1D24"/>
      <circle cx="15" cy="25" r="1.5" fill="#1A1D24"/>
    </g>

    <!-- Spiky barrier / Hazard representation -->
    <g transform="translate(150, 130)">
      <polygon points="5,20 10,10 15,20" fill="#EF4444" opacity="0.8"/>
      <polygon points="15,20 20,5 25,20" fill="#EF4444" opacity="0.8"/>
      <polygon points="25,20 30,12 35,20" fill="#EF4444" opacity="0.8"/>
    </g>

    <!-- Separation / Distance Indicator (Dotted directional arc pointing away) -->
    <path d="M 115,110 C 135,90 145,115 160,105" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="162,102 165,109 157,108" fill="#38BDF8"/>

    <!-- Child character stepping back / staying away (Noun: human) -->
    <g transform="translate(70, 95)">
      <!-- Child Body / Hoodie -->
      <path d="M 15,35 C 10,35 6,40 5,50 L 5,75 C 5,78 8,80 11,80 L 29,80 C 32,80 35,78 35,75 L 35,50 C 34,40 30,35 25,35 Z" fill="#38BDF8"/>
      <!-- Child Head -->
      <circle cx="20" cy="20" r="12" fill="#FCE7F3"/>
      <!-- Child Hair -->
      <path d="M 10,18 C 10,10 16,8 22,9 C 28,10 30,15 30,20 C 27,15 15,15 10,18 Z" fill="#D97706"/>
      <!-- Face profile looking away (left) -->
      <circle cx="15" cy="21" r="1.5" fill="#1A1D24"/>
      
      <!-- Back Leg -->
      <rect x="10" y="78" width="5" height="22" rx="2.5" fill="#1E293B"/>
      <!-- Front Leg (stepping backward) -->
      <rect x="22" y="78" width="5" height="22" rx="2.5" fill="#334155"/>
      
      <!-- Arms gesturing to keep distance -->
      <path d="M 6,45 C 0,48 -5,55 -8,50" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
      <path d="M 34,45 C 42,42 48,45 52,48" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Floor shadow for child -->
    <ellipse cx="90" cy="198" rx="25" ry="4" fill="#0F172A" opacity="0.6"/>
  </g>
</svg>