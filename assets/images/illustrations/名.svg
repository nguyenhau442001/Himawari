<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Escalation / Progression / Status Metaphor (Abstract Grammar/Role/Title structure) -->
  <g transform="translate(0, 0)">
    <!-- Multi-step architectural platform representing elevation of status/identity -->
    <!-- Base step -->
    <path d="M48 180 L192 180 L180 196 L60 196 Z" fill="#2A2F3D"/>
    
    <!-- Middle step -->
    <path d="M72 156 L168 156 L158 172 L82 172 Z" fill="#363C4E"/>

    <!-- Top elevated pedestal (Focus on distinction/role) -->
    <path d="M96 132 L144 132 L138 148 L102 148 Z" fill="#434B5E"/>

    <!-- Vertical focal pillar / spotlight beam rising up to symbolize "reputation/identity/title" -->
    <polygon points="108,132 132,132 150,60 90,60" fill="url(#beamGrad)" opacity="0.3"/>

    <defs>
      <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#FFB020" stop-opacity="0"/>
        <stop offset="100%" stop-color="#FFB020" stop-opacity="1"/>
      </linearGradient>

      <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFB020" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#E58900" stop-opacity="0.2"/>
      </linearGradient>
    </defs>

    <!-- Central distinguished figure / scholar representation (respectful silhouette & credentials) -->
    <!-- Body / Torso -->
    <path d="M96 132 C96 112 144 112 144 132 Z" fill="#2E3544"/>
    <path d="M92 136 L148 136 L140 100 L100 100 Z" fill="#3B4254"/>
    
    <!-- Lapels / Academic robe styling -->
    <path d="M120 100 L110 125 L120 136 L130 125 Z" fill="#4F586E"/>

    <!-- Head -->
    <circle cx="120" cy="80" r="14" fill="#E2E8F0"/>
    
    <!-- Academic cap / Status marker -->
    <path d="M100 70 L120 62 L140 70 L120 78 Z" fill="#FFB020"/>
    <rect x="117" y="75" width="6" height="6" fill="#D99B14"/>

    <!-- Accent Golden Badge / Identity token floating slightly above to represent the specific title/classifier function -->
    <circle cx="120" cy="46" r="10" fill="url(#glowGrad)" stroke="#FFB020" stroke-width="2"/>
    <!-- Inner distinct emblem (star/insignia) -->
    <polygon points="120,40 122,44 126,44 123,47 124,51 120,49 116,51 117,47 114,44 118,44" fill="#FFB020"/>

    <!-- Subtle supporting geometric markers for structural/grammatical precision -->
    <circle cx="60" cy="100" r="2" fill="#4F586E"/>
    <circle cx="180" cy="100" r="2" fill="#4F586E"/>
    <line x1="68" y1="100" x2="92" y2="100" stroke="#4F586E" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="148" y1="100" x2="172" y2="100" stroke="#4F586E" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
</svg>