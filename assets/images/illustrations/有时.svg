<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "有时" (Sometimes / Occasionality):
       Represented as an iconic, tactile physical desk clock (noun object) 
       with a dynamic sun/moon alternating aperture or rhythm wave, 
       signifying recurring moments in time. -->

  <!-- Clock shadow/glow -->
  <circle cx="120" cy="125" r="64" fill="#111318" opacity="0.6"/>

  <!-- Clock Outer Case -->
  <circle cx="120" cy="120" r="60" fill="#252A34" stroke="#3A4252" stroke-width="4"/>

  <!-- Clock Inner Dial -->
  <circle cx="120" cy="120" r="50" fill="#1A1D24"/>

  <!-- Clock Accent Markers (Hour pips) -->
  <circle cx="120" cy="74" r="2.5" fill="#5A657D"/>
  <circle cx="120" cy="166" r="2.5" fill="#5A657D"/>
  <circle cx="74" cy="120" r="2.5" fill="#5A657D"/>
  <circle cx="166" cy="120" r="2.5" fill="#5A657D"/>

  <!-- Interval / "Occasional" Highlight Segment (Arc) -->
  <path d="M 120 70 A 50 50 0 0 1 165 105 L 120 120 Z" fill="#F59E0B" opacity="0.2"/>

  <!-- Clock Hands (Indicating a specific moment/sometimes) -->
  <!-- Hour hand -->
  <line x1="120" y1="120" x2="95" y2="105" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="120" y1="120" x2="150" y2="95" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Pivot Pin -->
  <circle cx="120" cy="120" r="5" fill="#F59E0B"/>

  <!-- Clock Feet -->
  <path d="M 90 174 L 80 190 L 95 186 Z" fill="#3A4252"/>
  <path d="M 150 174 L 160 190 L 145 186 Z" fill="#3A4252"/>

  <!-- Clock Top Bell/Handle -->
  <path d="M 105 62 Q 120 48 135 62" fill="none" stroke="#3A4252" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="48" r="6" fill="#F59E0B"/>

  <!-- Floating accent dots representing episodic occurrences -->
  <circle cx="65" cy="75" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="180" cy="90" r="2" fill="#5A657D" opacity="0.6"/>
  <circle cx="170" cy="155" r="4" fill="#F59E0B" opacity="0.5"/>
  <circle cx="60" cy="150" r="2" fill="#5A657D" opacity="0.8"/>

</svg>