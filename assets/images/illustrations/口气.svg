<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="80" rx="2" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" rx="2" fill="#475569"/>
  
  <!-- Laptop -->
  <path d="M70 140 L170 140 L180 110 L60 110 Z" fill="#64748b"/>
  <rect x="75" y="115" width="90" height="20" rx="2" fill="#1e293b"/>
  
  <!-- Character: The Serious Speaker -->
  <g transform="translate(140, 60)">
    <circle cx="0" cy="0" r="30" fill="#fde68a"/>
    <path d="M-10 -5 L-5 -5 M5 -5 L10 -5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 10 Q0 15 5 10" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="-35" y="30" width="70" height="100" rx="10" fill="#38bdf8"/>
    <rect x="-40" y="35" width="15" height="40" rx="5" fill="#38bdf8"/>
    <rect x="25" y="35" width="15" height="40" rx="5" fill="#38bdf8"/>
  </g>
  
  <!-- Character: The Listener (Intimidated) -->
  <g transform="translate(70, 90)">
    <circle cx="0" cy="0" r="25" fill="#cbd5e1"/>
    <circle cx="-8" cy="-5" r="3" fill="#1e293b"/>
    <circle cx="8" cy="-5" r="3" fill="#1e293b"/>
    <path d="M-8 10 L8 10" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <rect x="-30" y="25" width="60" height="100" rx="10" fill="#fb923c"/>
  </g>
  
  <!-- Speech Bubble Indicator (Visualizing the tone) -->
  <path d="M120 50 L140 30 L160 50" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="140" cy="20" r="4" fill="#fbbf24"/>
  <circle cx="140" cy="10" r="2" fill="#fbbf24"/>
  
  <!-- Ambient Details -->
  <circle cx="200" cy="40" r="2" fill="#f8fafc" opacity="0.5"/>
  <circle cx="210" cy="30" r="3" fill="#f8fafc" opacity="0.3"/>
  <rect x="20" y="20" width="40" height="4" rx="2" fill="#334155"/>
  <rect x="20" y="30" width="30" height="4" rx="2" fill="#334155"/>
</svg>