<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Accent -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Central Physical Object: Imperial Crown / Throne Representation of Rule and Dominion (统治) -->
  <g transform="translate(0, 5)">
    <!-- Base Platform / Throne Seat -->
    <path d="M 70 160 L 170 160 L 160 175 L 80 175 Z" fill="#2D3342"/>
    <rect x="65" y="175" width="110" height="8" rx="2" fill="#E5A93B"/>

    <!-- Backrest of Authority -->
    <path d="M 85 70 L 155 70 L 165 150 L 75 150 Z" fill="#1F2430"/>
    <path d="M 95 80 L 145 80 L 150 140 L 90 140 Z" fill="#252A34"/>

    <!-- The Crown (Symbol of Sovereign Rule) -->
    <!-- Crown Base -->
    <path d="M 85 115 L 155 115 L 150 135 L 90 135 Z" fill="#D69927"/>
    <rect x="83" y="132" width="74" height="6" rx="2" fill="#E5A93B"/>
    
    <!-- Crown Jewels on Base -->
    <circle cx="105" cy="125" r="3" fill="#E74C3C"/>
    <circle cx="120" cy="125" r="3.5" fill="#3498DB"/>
    <circle cx="135" cy="125" r="3" fill="#E74C3C"/>

    <!-- Crown Peaks -->
    <path d="M 85 115 L 90 85 L 105 105 L 120 75 L 135 105 L 150 85 L 155 115 Z" fill="#F1C40F"/>
    
    <!-- Highlights on Peaks -->
    <polygon points="90,85 93,105 87,105" fill="#FDE38A" opacity="0.6"/>
    <polygon points="120,75 124,100 116,100" fill="#FDE38A" opacity="0.6"/>
    <polygon points="150,85 153,105 147,105" fill="#FDE38A" opacity="0.6"/>

    <!-- Scepter of Dominion (Crossing diagonally behind the crown) -->
    <g transform="rotate(-15 120 120)">
      <!-- Staff -->
      <rect x="116" y="55" width="8" height="130" rx="2" fill="#D69927"/>
      <!-- Scepter Top Orb -->
      <circle cx="120" cy="48" r="9" fill="#E5A93B"/>
      <circle cx="120" cy="48" r="5" fill="#F1C40F"/>
      <!-- Scepter Rings -->
      <rect x="114" y="90" width="12" height="4" rx="1" fill="#B57C1E"/>
      <rect x="114" y="140" width="12" height="4" rx="1" fill="#B57C1E"/>
    </g>

    <!-- Radiating Authority Glow / Accent Marks -->
    <path d="M 120 40 L 120 30" stroke="#E5A93B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 75 60 L 68 53" stroke="#E5A93B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 165 60 L 172 53" stroke="#E5A93B" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>