<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative kitchen glow / environment -->
  <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Stove / Induction Cooktop base -->
  <rect x="60" y="160" width="120" height="20" rx="4" fill="#2D323E"/>
  <rect x="75" y="165" width="20" height="4" rx="2" fill="#4B5563"/>
  <rect x="145" y="165" width="20" height="4" rx="2" fill="#4B5563"/>

  <!-- Hot burner glow -->
  <ellipse cx="120" cy="155" rx="35" ry="12" fill="#F59E0B" opacity="0.2"/>
  <ellipse cx="120" cy="155" rx="25" ry="8" fill="#EF4444" opacity="0.4"/>

  <!-- Cooking Pot / Wok -->
  <path d="M 85 130 C 85 130 95 155 120 155 C 145 155 155 130 155 130 Z" fill="#374151"/>
  <path d="M 75 125 L 165 125 L 155 130 L 85 130 Z" fill="#4B5563"/>
  <path d="M 70 120 C 70 117 73 115 76 115 L 85 115 L 85 125 L 70 125 Z" fill="#9CA3AF"/>
  <path d="M 170 120 C 170 117 167 115 164 115 L 155 115 L 155 125 L 170 125 Z" fill="#9CA3AF"/>

  <!-- Pot Lid -->
  <path d="M 95 115 C 95 105 105 100 120 100 C 135 100 145 105 145 115 Z" fill="#6B7280"/>
  <circle cx="120" cy="97" r="5" fill="#9CA3AF"/>

  <!-- Steam / Motion lines indicating active cooking -->
  <path d="M 110 85 C 105 75 115 65 110 55" fill="none" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 130 85 C 135 75 125 65 130 55" fill="none" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 120 80 C 120 70 120 60 120 45" fill="none" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Chef / Character (Upper body leaning in) -->
  <!-- Body/Apron -->
  <path d="M 80 210 C 80 180 100 170 120 170 C 140 170 160 180 160 210 Z" fill="#3B82F6"/>
  <path d="M 95 175 L 145 175 L 150 210 L 90 210 Z" fill="#F9FAFB"/>
  <circle cx="120" cy="185" r="8" fill="#F59E0B"/>

  <!-- Arms stirring / interacting -->
  <!-- Left arm -->
  <path d="M 80 185 C 80 185 95 160 110 145" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
  <!-- Right arm holding spatula -->
  <path d="M 160 185 C 160 185 145 150 135 135" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>

  <!-- Spatula tool inside pot -->
  <path d="M 130 130 L 125 110" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="124" cy="107" rx="6" ry="4" fill="#6B7280"/>

  <!-- Head & Hair -->
  <circle cx="120" cy="130" r="22" fill="#FBD38D"/>
  <path d="M 100 125 C 100 110 110 100 120 100 C 130 100 140 110 140 125 C 140 125 135 112 120 112 C 105 112 100 125 100 125 Z" fill="#1F2937"/>

  <!-- Action / Motion Effects for Stirring -->
  <path d="M 105 138 C 115 132 130 132 135 140" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>