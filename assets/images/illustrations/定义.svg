<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lamp-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Room Environment & Bookshelf in background -->
  <g opacity="0.4">
    <!-- Bookshelf structure -->
    <rect x="25" y="40" width="60" height="110" fill="#334155" rx="2"/>
    <rect x="30" y="65" width="50" height="4" fill="#475569"/>
    <rect x="30" y="95" width="50" height="4" fill="#475569"/>
    <rect x="30" y="125" width="50" height="4" fill="#475569"/>
    <!-- Books on shelf -->
    <path d="M35 50 h8 v15 h-8 z" fill="#38bdf8"/>
    <path d="M45 47 h6 v18 h-6 z" fill="#f43f5e"/>
    <path d="M53 52 h10 v13 h-10 z" fill="#10b981"/>
    <path d="M35 80 h7 v15 h-7 z" fill="#fb923c"/>
    <path d="M44 75 h9 v20 h-9 z" fill="#a855f7"/>
  </g>

  <!-- Hanging Lamp & Light Cone -->
  <path d="M140 10 L140 50" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M125 50 L155 50 L165 65 L115 65 Z" fill="#475569"/>
  <polygon points="110,65 170,65 210,180 70,180" fill="url(#lamp-glow)" style="mix-blend-mode: screen;" />

  <!-- Study Desk -->
  <rect x="30" y="170" width="180" height="60" fill="url(#desk-grad)" rx="4"/>
  <rect x="30" y="170" width="180" height="6" fill="#475569" rx="2"/>

  <!-- Props on Desk: Open Dictionary / Notebook -->
  <g transform="translate(65, 145)">
    <!-- Book Shadow -->
    <path d="M 10 35 Q 50 45 90 35 L 95 45 Q 50 55 5 45 Z" fill="#0f172a" opacity="0.6"/>
    <!-- Open Book Base -->
    <path d="M 10 30 Q 50 40 90 30 L 90 55 Q 50 65 10 55 Z" fill="#f8fafc"/>
    <!-- Book Center Binding -->
    <path d="M 48 33 Q 50 42 52 33 L 52 58 Q 50 63 48 58 Z" fill="#cbd5e1"/>
    <!-- Page Lines (Simulated text representing definitions) -->
    <path d="M 18 37 h 22 M 18 43 h 20 M 18 49 h 15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 58 37 h 20 M 58 43 h 22 M 58 49 h 18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Highlight Sparkle indicating "Definition/Word focus" -->
    <circle cx="70" cy="40" r="3" fill="#f59e0b" filter="url(#glow)"/>
    <path d="M 70 34 v 12 M 64 40 h 12" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Secondary Prop: Coffee Mug -->
  <g transform="translate(165, 150)">
    <rect x="0" y="5" width="14" height="18" rx="3" fill="#38bdf8"/>
    <path d="M 14 9 c 4 0 4 8 0 8" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 4 0 q 2 -3 0 -6" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 10 -1 q 2 -3 0 -6" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Main Character: Student/User pointing at/defining the word -->
  <g transform="translate(20, 75)">
    <!-- Body & Torso -->
    <path d="M 65 95 C 65 80 85 80 85 95 L 95 125 L 35 125 Z" fill="#10b981"/>
    <path d="M 60 85 L 75 85 L 70 100 Z" fill="#f8fafc"/> <!-- Collar -->

    <!-- Neck -->
    <rect x="62" y="70" width="16" height="15" fill="#fcd34d" rx="4"/>

    <!-- Head -->
    <circle cx="70" cy="55" r="22" fill="#fcd34d"/>

    <!-- Hair -->
    <path d="M 48 55 C 48 35 92 35 92 55 C 92 55 85 45 70 45 C 55 45 48 55 48 55 Z" fill="#1e293b"/>
    <path d="M 48 52 C 55 42 75 42 88 50 C 90 44 85 38 70 38 C 55 38 48 45 48 52 Z" fill="#334155"/>

    <!-- Facial Expressions (Thoughtful, Explaining) -->
    <!-- Eyes (Focused, looking down at book) -->
    <circle cx="62" cy="55" r="2.5" fill="#1e293b"/>
    <circle cx="78" cy="55" r="2.5" fill="#1e293b"/>
    <!-- Eyebrows (Slightly arched, engaged) -->
    <path d="M 58 50 q 4 -3 8 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 74 50 q 4 -3 8 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Gentle confident smile -->
    <path d="M 66 63 q 4 3 8 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="56" cy="60" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="84" cy="60" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Pointing / Explaining Arm & Hand -->
    <!-- Right Arm pointing towards the book/definition -->
    <path d="M 80 90 Q 95 95 105 85" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="107" cy="83" r="4" fill="#fcd34d"/> <!-- Hand pointing -->

    <!-- Left Arm resting -->
    <path d="M 50 90 Q 42 105 45 120" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="45" cy="122" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Accent elements: Floating conceptual sparkle/focus (representing 'meaning/definition' clarity) -->
  <g transform="translate(140, 85)" filter="url(#glow)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(50, 110)" filter="url(#glow)">
    <path d="M 0 -5 L 1.5 -1.5 L 5 0 L 1.5 1.5 L 0 5 L -1.5 1.5 L -5 0 L -1.5 -1.5 Z" fill="#38bdf8"/>
  </g>
</svg>