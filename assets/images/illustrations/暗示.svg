<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Meeting Room Table -->
  <rect x="20" y="160" width="200" height="40" rx="8" fill="#334155"/>
  <rect x="30" y="170" width="180" height="10" rx="2" fill="#475569"/>
  
  <!-- Person A (The one giving the hint) -->
  <g transform="translate(130, 80)">
    <circle cx="20" cy="20" r="25" fill="#fbbf24"/>
    <path d="M10 20 Q 20 28 30 20" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
    <path d="M15 12 L 25 12" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 50 L 20 120" stroke="#fbbf24" stroke-width="15" stroke-linecap="round"/>
    <path d="M-10 80 L 20 60 L 50 80" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Person B (The one receiving the hint) -->
  <g transform="translate(60, 90)">
    <circle cx="20" cy="20" r="25" fill="#38bdf8"/>
    <path d="M10 25 Q 20 32 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="18" r="3" fill="#0f172a"/>
    <circle cx="28" cy="18" r="3" fill="#0f172a"/>
    <path d="M20 50 L 20 120" stroke="#38bdf8" stroke-width="15" stroke-linecap="round"/>
    <path d="M-10 80 L 20 60 L 50 80" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The Hint (Visual line of sight) -->
  <path d="M140 100 L 90 110" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="140" cy="100" r="4" fill="#fb923c"/>
  
  <!-- Context Props: Documents on table -->
  <rect x="40" y="175" width="30" height="20" rx="2" fill="#e2e8f0"/>
  <rect x="80" y="175" width="30" height="20" rx="2" fill="#e2e8f0"/>
  
  <!-- Ambient lighting/Background elements -->
  <circle cx="200" cy="40" r="60" fill="#1e293b" opacity="0.5"/>
  <rect x="180" y="20" width="40" height="40" rx="4" fill="#334155" opacity="0.3"/>
</svg>