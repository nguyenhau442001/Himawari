<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Drop Shadow for Papers/Stamp -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT: Office Room Context -->
  <!-- Window with Night City Silhouette / Blue light -->
  <path d="M160 30 L210 30 L210 95 L160 95 Z" fill="url(#window-light)" stroke="#334155" stroke-width="2"/>
  <line x1="185" y1="30" x2="185" y2="95" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="62" x2="210" y2="62" stroke="#334155" stroke-width="1.5"/>
  <!-- Cityscape outside window -->
  <rect x="165" y="65" width="8" height="30" fill="#334155" opacity="0.6"/>
  <rect x="176" y="55" width="10" height="40" fill="#334155" opacity="0.8"/>
  <rect x="190" y="70" width="12" height="25" fill="#334155" opacity="0.5"/>

  <!-- Bookshelf Background -->
  <rect x="25" y="40" width="40" height="70" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="2"/>
  <line x1="25" y1="65" x2="65" y2="65" stroke="#334155" stroke-width="1.5"/>
  <line x1="25" y1="90" x2="65" y2="90" stroke="#334155" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="30" y="48" width="6" height="17" fill="#38bdf8" opacity="0.7" rx="1"/>
  <rect x="38" y="45" width="8" height="20" fill="#ec4899" opacity="0.7" rx="1"/>
  <rect x="48" y="50" width="5" height="15" fill="#10b981" opacity="0.7" rx="1"/>
  <rect x="30" y="73" width="7" height="17" fill="#fb923c" opacity="0.7" rx="1"/>
  <rect x="39" y="76" width="12" height="14" fill="#38bdf8" opacity="0.5" rx="1"/>

  <!-- Desk & Lamp -->
  <!-- Lamp fixture -->
  <path d="M120 10 L135 35 L105 35 Z" fill="#fbbf24"/>
  <circle cx="120" cy="35" r="70" fill="url(#lamp-glow)" pointer-events="none"/>
  <path d="M120 35 L120 70" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 70 L140 70" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Wooden Desk Surface -->
  <rect x="15" y="150" width="210" height="70" fill="#334155" rx="4"/>
  <rect x="10" y="145" width="220" height="10" fill="#475569" rx="3"/>

  <!-- PROPS: Official Legal Document (Law being abolished) -->
  <g filter="url(#shadow)">
    <!-- Document Base -->
    <path d="M60 120 L130 115 L133 175 L63 180 Z" fill="#f8fafc"/>
    <!-- Document Header Lines -->
    <line x1="72" y1="130" x2="110" y2="127" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="140" x2="120" y2="136" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="69" y1="148" x2="105" y2="145" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="156" x2="115" y2="152" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- BIG RED "VOID / ABOLISHED" STAMP (Crucial for "废除" concept) -->
    <g transform="translate(75, 135) rotate(-15)">
      <rect x="0" y="0" width="45" height="24" fill="none" stroke="#ef4444" stroke-width="3" rx="3"/>
      <!-- Stylized rejection cross / slash inside stamp -->
      <line x1="6" y1="4" x2="39" y2="20" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <line x1="39" y1="4" x2="6" y2="20" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Secondary Document Stack (Unimportant/Archived) -->
  <g opacity="0.6">
    <rect x="140" y="155" width="50" height="35" rx="2" fill="#e2e8f0" transform="rotate(8 140 155)"/>
    <rect x="145" y="148" width="45" height="35" rx="2" fill="#f1f5f9" transform="rotate(-3 145 148)"/>
  </g>

  <!-- CHARACTER: Official / Professional Person sitting at desk -->
  <!-- Body / Suit (Torso) -->
  <path d="M75 220 C75 190 95 180 115 180 C135 180 155 190 155 220 Z" fill="#1e293b"/>
  <!-- Shirt Collar & Tie -->
  <path d="M100 180 L115 198 L130 180 Z" fill="#f8fafc"/>
  <polygon points="112,192 118,192 116,215 114,215" fill="#ef4444"/>

  <!-- Head & Face -->
  <circle cx="115" cy="140" r="22" fill="#fed7aa"/>
  <!-- Hair -->
  <path d="M95 138 C95 122 105 116 115 116 C125 116 135 122 135 138 C135 140 133 140 133 135 C133 125 125 120 115 120 C105 120 97 125 97 135 C97 140 95 140 95 138 Z" fill="#334155"/>
  <!-- Glasses (Smart/Professional look) -->
  <rect x="103" y="132" width="11" height="8" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="116" y="132" width="11" height="8" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
  <line x1="114" y1="135" x2="116" y2="135" stroke="#475569" stroke-width="1.5"/>
  <!-- Determined / Satisfied Expression -->
  <path d="M112 150 C114 153 118 153 120 150" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="108" cy="135" r="1.5" fill="#1e293b"/>
  <circle cx="122" cy="135" r="1.5" fill="#1e293b"/>

  <!-- Arms & Hands executing the action (Holding official red stamp seal) -->
  <!-- Left arm resting -->
  <path d="M80 190 C75 190 68 205 68 220" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Right arm holding the stamp down -->
  <path d="M145 185 C155 190 140 210 125 200" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand holding handle -->
  <circle cx="123" cy="195" r="6" fill="#fed7aa"/>
  
  <!-- Stamp Tool in Hand -->
  <g transform="translate(100, 160)">
    <!-- Wooden/Metal Stamp Handle -->
    <rect x="20" y="15" width="8" height="15" rx="2" fill="#b45309"/>
    <ellipse cx="24" cy="15" rx="5" ry="2" fill="#d97706"/>
    <!-- Stamp Base pressing onto paper -->
    <rect x="16" y="30" width="16" height="6" rx="1" fill="#dc2626"/>
  </g>

  <!-- Foreground Atmospheric Details (Floating dust/sparkles in lamp light) -->
  <circle cx="90" cy="90" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="75" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="70" cy="110" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="115" r="1.5" fill="#fbbf24" opacity="0.5"/>

</svg>