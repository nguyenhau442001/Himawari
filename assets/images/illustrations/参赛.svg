<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Track/Field Ground -->
  <path d="M40 180 C 100 160, 140 160, 200 180 L 200 190 L 40 190 Z" fill="#2D343E"/>
  <path d="M40 185 L 200 185" stroke="#FFB800" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Runner Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-10 -20 L 5 -20 L 10 20 L -5 20 Z" fill="#FFB800"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="15" fill="#FFB800"/>
    <!-- Legs in motion -->
    <path d="M-5 20 L -20 50 L -10 50 L 5 25" fill="#FFB800"/>
    <path d="M5 20 L 20 45 L 30 40" fill="#FFB800"/>
    <!-- Arms in motion -->
    <path d="M-10 -15 L -30 -5" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
    <path d="M5 -15 L 25 -5" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Motion Lines -->
  <path d="M30 120 Q 50 100 70 120" stroke="#4A5568" stroke-width="3" fill="none"/>
  <path d="M20 140 Q 40 120 60 140" stroke="#4A5568" stroke-width="3" fill="none"/>
  
  <!-- Starting Block/Marker -->
  <rect x="30" y="170" width="10" height="20" rx="2" fill="#FFB800"/>
  
  <!-- Competition Flag/Marker -->
  <path d="M180 180 L 180 100 L 200 120 L 180 140" fill="#FFB800"/>
</svg>