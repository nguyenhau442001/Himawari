<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background decorative glowing elements for modern dark theme -->
  <circle cx="120" cy="120" r="75" fill="#252A34" opacity="0.6"/>
  <path d="M120 50 L120 190 M50 120 L190 120" stroke="#2F3640" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Main Object: Open Book representing literary work / subject matter / "Đề tài" -->
  <g transform="translate(0, 10)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="165" rx="70" ry="12" fill="#111318"/>

    <!-- Book Base / Cover -->
    <path d="M50 145 C50 145 85 155 120 145 C155 155 190 145 190 145 L190 158 C190 158 155 168 120 158 C85 168 50 158 50 158 Z" fill="#2D3748"/>

    <!-- Left Page -->
    <path d="M120 60 C90 55 55 65 50 75 L50 145 C55 135 90 125 120 130 Z" fill="#E2E8F0"/>
    
    <!-- Right Page -->
    <path d="M120 60 C150 55 185 65 190 75 L190 145 C185 135 150 125 120 130 Z" fill="#CBD5E0"/>

    <!-- Center Spine Shadow -->
    <path d="M120 60 L120 130 C120 130 118 132 120 133 C122 132 120 130 120 130 Z" fill="#A0AEC0"/>

    <!-- Left Page Content Lines (Abstract Text) -->
    <line x1="65" y1="85" x2="105" y2="80" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="100" x2="100" y2="95" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="115" x2="95" y2="110" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Page Content Lines -->
    <line x1="135" y1="80" x2="175" y2="85" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="95" x2="175" y2="100" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="110" x2="175" y2="115" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>

    <!-- Focal Point: Glowing Spark / New Idea emerging from the book (representing "新颖" / Novel subject matter) -->
    <g transform="translate(120, 50)">
      <!-- Outer glow -->
      <circle cx="0" cy="0" r="22" fill="#F6AD55" opacity="0.2"/>
      <circle cx="0" cy="0" r="14" fill="#ED8936" opacity="0.4"/>
      
      <!-- Central Star / Diamond representing core theme/subject -->
      <path d="M0 -16 C1 -6 6 -1 16 0 C6 1 1 6 0 16 C-1 6 -6 1 -16 0 C-6 -1 -1 -6 0 -16 Z" fill="#F6E05E"/>
      
      <!-- Sparkle highlights -->
      <circle cx="8" cy="-8" r="2" fill="#FFFFFF"/>
      <circle cx="-10" cy="6" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Floating conceptual icons representing diverse "Themes" (题材) rising from the book -->
    <!-- Idea 1: Compass / Exploration theme -->
    <g transform="translate(75, 25)">
      <circle cx="0" cy="0" r="12" fill="#3182CE"/>
      <polygon points="0,-7 3,2 0,5 -3,2" fill="#EBF8FF"/>
      <polygon points="0,7 3,-2 0,-5 -3,-2" fill="#63B3ED"/>
    </g>

    <!-- Idea 2: Gear / Technology theme -->
    <g transform="translate(165, 28)">
      <circle cx="0" cy="0" r="11" fill="#38A169"/>
      <path d="M-3 -8 L3 -8 L4 -5 L7 -4 L9 -7 L11 -5 L9 -3 L10 0 L12 2 L10 5 L7 4 L5 7 L2 9 L-1 8 L-2 5 L-5 7 L-7 5 L-5 2 L-7 0 L-6 -3 L-9 -4 L-7 -7 L-4 -5 Z" fill="#E6FFFA"/>
      <circle cx="0" cy="0" r="4" fill="#38A169"/>
    </g>

    <!-- Connection arcs (dotted lines showing themes springing from the core text) -->
    <path d="M85 32 Q100 45 110 42" stroke="#F6AD55" stroke-width="2" stroke-dasharray="2 2" fill="none" opacity="0.8"/>
    <path d="M155 35 Q140 45 130 42" stroke="#F6AD55" stroke-width="2" stroke-dasharray="2 2" fill="none" opacity="0.8"/>
  </g>
</svg>