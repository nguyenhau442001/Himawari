<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 60)">
    <!-- House 1 -->
    <path d="M20,60 L20,100 L60,100 L60,60 L40,40 Z" fill="#FFB347"/>
    <rect x="30" y="75" width="20" height="25" fill="#2D3436"/>
    
    <!-- House 2 -->
    <path d="M90,50 L90,100 L130,100 L130,50 L110,30 Z" fill="#FFD700"/>
    <rect x="100" y="70" width="20" height="30" fill="#2D3436"/>
    
    <!-- House 3 -->
    <path d="M160,70 L160,100 L200,100 L200,70 L180,50 Z" fill="#FFA500"/>
    <rect x="170" y="80" width="20" height="20" fill="#2D3436"/>
    
    <!-- House 4 (Back) -->
    <path d="M50,110 L50,150 L90,150 L90,110 L70,90 Z" fill="#FF8C00"/>
    <rect x="60" y="125" width="20" height="25" fill="#2D3436"/>
    
    <!-- House 5 (Back) -->
    <path d="M120,100 L120,150 L160,150 L160,100 L140,80 Z" fill="#FFC125"/>
