<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="screenGlow" x1="0" y1="0" x2="240" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="warmTearGlow" cx="130" cy="95" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="screenClip">
      <rect x="35" y="45" width="170" height="105" rx="8"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Room Environment / Background Props -->
  <!-- Wallpaper subtle lines -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="25" y="150" width="30" height="30" rx="4" fill="#334155" opacity="0.3"/>
  <circle cx="205" cy="40" r="12" fill="#334155" opacity="0.2"/>

  <!-- Cinema Screen / Monitor Frame -->
  <rect x="30" y="40" width="180" height="115" rx="12" fill="#090d16" stroke="#475569" stroke-width="3"/>
  
  <!-- Movie Display Content (Scene: Emotional story moment on screen) -->
  <g clip-path="url(#screenClip)">
    <rect x="35" y="45" width="170" height="105" fill="#111827"/>
    
    <!-- Screen Ambient Light -->
    <rect x="35" y="45" width="170" height="105" fill="url(#screenGlow)"/>

    <!-- Cinematic Landscape / Narrative Art inside screen -->
    <!-- Distant mountains/hills -->
    <path d="M 35 110 L 75 85 L 115 100 L 160 75 L 205 95 L 205 150 L 35 150 Z" fill="#1e293b"/>
    <path d="M 50 150 L 95 95 L 140 120 L 180 90 L 205 110 L 205 150 Z" fill="#312e81" opacity="0.6"/>

    <!-- Warm Glowing Star / Moon representing the emotional plot climax -->
    <circle cx="120" cy="70" r="16" fill="#f59e0b" opacity="0.9"/>
    <circle cx="120" cy="70" r="26" fill="#f59e0b" opacity="0.2"/>

    <!-- Silhouette figures on screen hugging/sharing a touching moment -->
    <path d="M 112 120 C 112 110 118 102 124 102 C 130 102 136 110 136 120 L 136 150 L 112 150 Z" fill="#e2e8f0"/>
    <circle cx="124" cy="95" r="5" fill="#e2e8f0"/>
  </g>

  <!-- Screen Stand -->
  <path d="M 105 155 L 135 155 L 142 170 L 98 170 Z" fill="#475569"/>
  <rect x="80" y="170" width="80" height="5" rx="2" fill="#64748b"/>

  <!-- Desk Surface -->
  <path d="M 10 190 L 230 190 L 220 215 L 20 215 Z" fill="#334155"/>
  <rect x="10" y="185" width="220" height="6" rx="2" fill="#475569"/>

  <!-- Desk Props (Cozy, emotional atmosphere) -->
  <!-- Mug with warm drink -->
  <rect x="180" y="168" width="16" height="20" rx="3" fill="#f43f5e"/>
  <path d="M 196 173 C 201 173 201 183 196 183" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <!-- Steam wisp -->
  <path d="M 186 160 C 188 156 184 152 186 148" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Tissues box (indicating crying at the touching plot) -->
  <rect x="35" y="173" width="26" height="15" rx="3" fill="#38bdf8"/>
  <ellipse cx="48" cy="173" rx="8" ry="3" fill="#e0f2fe"/>
  <!-- Tissue paper pulled out -->
  <path d="M 46 173 C 44 165 52 163 48 156" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Foreground Character: Immersed Viewer experiencing emotional plot -->
  <!-- Character Head & Hair (Overlapping lower right/left edge of screen or seated in foreground) -->
  <!-- Let's position a cozy viewer character on the right side looking left at the screen -->
  <g transform="translate(145, 110)">
    <!-- Ambient tear glow behind character -->
    <circle cx="-15" cy="-15" r="30" fill="url(#warmTearGlow)"/>

    <!-- Character Body / Hoodie -->
    <path d="M -30 90 C -30 65 -15 50 15 50 C 45 50 60 65 60 90 Z" fill="#8b5cf6"/>
    <!-- Hoodie Hood/Collar -->
    <path d="M -25 58 C -15 45 15 45 25 58" stroke="#7c3aed" stroke-width="4" fill="none"/>

    <!-- Neck -->
    <rect x="-3" y="40" width="10" height="15" fill="#fbcfe8"/>

    <!-- Head Profile/Semi-profile -->
    <circle cx="0" cy="20" r="18" fill="#fbcfe8"/>
    
    <!-- Hair -->
    <path d="M -18 15 C -20 -2 -5 -5 12 5 C 18 8 16 22 16 22 C 16 22 5 18 -4 18 C -10 18 -15 15 -18 15 Z" fill="#334155"/>

    <!-- Face details: Expressive touched/crying look -->
    <!-- Closed moved/touched eye -->
    <path d="M -3 18 C -1 21 3 21 5 18" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Rosy emotional cheek -->
    <circle cx="2" cy="24" r="5" fill="#f43f5e" opacity="0.4"/>

    <!-- Glowing Tear drop rolling down -->
    <path d="M 4 23 C 4 27 7 28 7 30 C 7 32 5 33 4 33 C 3 33 1 32 1 30 C 1 28 4 27 4 23 Z" fill="#38bdf8"/>

    <!-- Hand gently touching cheek -->
    <circle cx="8" cy="32" r="6" fill="#fbcfe8"/>
    <path d="M 10 37 C 15 42 22 40 25 36" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Secondary decorative atmospheric elements: floating heart/emotion particles representing "gǎn rén" (touching/moving plot) -->
  <g transform="translate(115, 25)">
    <path d="M 0 5 C -4 0 -10 2 -10 8 C -10 14 0 20 0 20 C 0 20 10 14 10 8 C 10 2 4 0 0 5 Z" fill="#f43f5e" opacity="0.8"/>
  </g>
  <g transform="translate(85, 30) scale(0.6)">
    <path d="M 0 5 C -4 0 -10 2 -10 8 C -10 14 0 20 0 20 C 0 20 10 14 10 8 C 10 2 4 0 0 5 Z" fill="#fb7185" opacity="0.6"/>
  </g>
</svg>