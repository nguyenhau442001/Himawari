<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Object representation of "限度" (Limit / Boundary / Threshold): 
       A sturdy mechanical pressure cylinder/gauge or a physical boundary barrier 
       representing a concrete physical limit of capacity or physical endurance.
       Let's use a clear physical object: A thick glass containment cylinder 
       with a clear liquid level reaching a defined physical red marker line. -->

  <!-- Background decorative depth -->
  <circle cx="120" cy="120" r="80" fill="#222730"/>

  <!-- Cylinder Base -->
  <ellipse cx="120" cy="190" rx="55" ry="14" fill="#2A303C"/>
  <ellipse cx="120" cy="190" rx="45" ry="10" fill="#384152"/>

  <!-- Cylinder Glass Body (Outer Wall) -->
  <path d="M 75 70 L 75 190 C 75 198, 165 198, 165 190 L 165 70" fill="none" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Cylinder Interior Back -->
  <path d="M 77 70 L 77 190 C 77 197, 163 197, 163 190 L 163 70 Z" fill="#252D3A"/>

  <!-- Liquid Fill (representing energy/capacity nearing the limit) -->
  <path d="M 77 110 L 77 190 C 77 197, 163 197, 163 190 L 163 110 Z" fill="#2563EB" opacity="0.85"/>
  <ellipse cx="120" cy="110" rx="43" ry="10" fill="#3B82F6"/>

  <!-- Limit Threshold Line (The exact 'limit' marker in high-contrast orange/gold) -->
  <!-- Marker brackets on the sides -->
  <path d="M 67 100 L 77 100 L 77 120 L 67 120" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 173 100 L 163 100 L 163 120 L 173 120" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
  <!-- Dotted limit line across -->
  <line x1="77" y1="110" x2="163" y2="110" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Cylinder Top Rim -->
  <ellipse cx="120" cy="70" rx="45" ry="10" fill="#384152"/>
  <ellipse cx="120" cy="70" rx="40" ry="8" fill="#1A1D24"/>

  <!-- Warning / Alert Accent (Small precise indicator) -->
  <circle cx="120" cy="45" r="8" fill="#EF4444"/>
  <path d="M 120 41 L 120 46 M 120 48 L 120 49" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Highlights on glass for clean vector look -->
  <path d="M 83 80 L 83 170" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
</svg>