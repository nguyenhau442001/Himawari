<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Accent -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Conceptual Illustration for "施加" (Applying pressure/weight downward) -->
  <g transform="translate(0, 0)">
    <!-- Base Object (Represented as a stylized platform/object receiving pressure) -->
    <path d="M 70 160 L 170 160 L 180 180 L 60 180 Z" fill="#3A4256"/>
    <rect x="75" y="150" width="90" height="10" rx="3" fill="#4E5D78"/>

    <!-- Downward Force Arrows (Representing "施加" / application of force/pressure) -->
    <g fill="#F59E0B">
      <!-- Left Arrow -->
      <path d="M 95 60 L 105 60 L 105 100 L 112 100 L 100 118 L 88 100 L 95 100 Z"/>
      <!-- Center Arrow (Main Focus) -->
      <path d="M 115 50 L 125 50 L 125 105 L 133 105 L 120 125 L 107 105 L 115 105 Z"/>
      <!-- Right Arrow -->
      <path d="M 135 60 L 145 60 L 145 100 L 152 100 L 140 118 L 128 100 L 135 100 Z"/>
    </g>

    <!-- Top Source/Weight bar -->
    <rect x="80" y="40" width="80" height="12" rx="4" fill="#FBBF24"/>

    <!-- Pressure Waves / Impact effect at the base -->
    <path d="M 50 190 Q 120 180 190 190" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 65 198 Q 120 190 175 198" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>