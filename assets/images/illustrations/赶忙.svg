<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background motion lines suggesting speed/hurrying (赶忙) -->
  <g opacity="0.25" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="110" x2="70" y2="110" />
    <line x1="20" y1="130" x2="60" y2="130" />
    <line x1="40" y1="150" x2="80" y2="150" />
  </g>

  <!-- Bus/Transit Interior Context (Inspired by contextual reference: 上车/让座) -->
  <g>
    <!-- Bus handrail vertical pole -->
    <rect x="180" y="50" width="8" height="150" rx="4" fill="#64748B"/>
    <!-- Ceiling anchor -->
    <path d="M170 50 L200 50 L194 62 L176 62 Z" fill="#475569"/>
    <!-- Hanging ring strap -->
    <path d="M184 62 C184 80 184 90 184 95 C176 95 170 100 170 108 C170 114 176 118 184 118 C192 118 198 114 198 108 C198 100 192 95 184 95" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

    <!-- Bus Window showing motion outside -->
    <rect x="25" y="45" width="100" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <line x1="45" y1="45" x2="35" y2="105" stroke="#1E293B" stroke-width="6"/>
    <line x1="85" y1="45" x2="75" y2="105" stroke="#1E293B" stroke-width="6"/>
  </g>

  <!-- Elderly passenger sitting safely (represented clearly as a character) -->
  <g transform="translate(135, 115)">
    <!-- Seat -->
    <rect x="-10" y="30" width="55" height="10" rx="3" fill="#3B82F6"/>
    <path d="M-5 10 L-5 35 L40 35 L40 10 Z" fill="#1D4ED8" opacity="0.6"/>
    <!-- Elderly body sitting -->
    <circle cx="15" cy="-2" r="10" fill="#E2E8F0"/> <!-- Head -->
    <path d="M5 10 C5 5 25 5 25 10 L30 35 L0 35 Z" fill="#64748B"/> <!-- Torso -->
    <!-- Walking cane resting beside -->
    <line x1="-15" y1="-5" x2="-15" y2="45" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15 -5 C-15 -10 -10 -12 -7 -10" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Main Character acting out "赶忙" (hurrying up to offer seat) -->
  <g transform="translate(60, 100)">
    <!-- Motion lines behind character emphasizing sudden quick movement -->
    <path d="M -20 20 L -5 20" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -25 45 L -10 45" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -15 70 L 0 70" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Dynamic leaning posture representing "赶忙" (vội vàng / rushing forward) -->
    <g transform="rotate(-12, 10, 40)">
      <!-- Legs in motion (stepping forward) -->
      <line x1="15" y1="50" x2="5" y2="90" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
      <line x1="15" y1="50" x2="35" y2="85" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
      <!-- Shoes -->
      <ellipse cx="2" cy="92" rx="6" ry="3" fill="#0F172A"/>
      <ellipse cx="38" cy="87" rx="6" ry="3" fill="#0F172A"/>

      <!-- Torso (Active vibrant clothing - modern orange accent for focus) -->
      <path d="M 0 15 L 25 15 L 30 55 L -5 55 Z" fill="#F59E0B"/>
      
      <!-- Head leaning forward eagerly -->
      <circle cx="22" cy="0" r="11" fill="#FDE047"/>
      <!-- Hair -->
      <path d="M 12 -4 C 15 -9 25 -9 30 -4 C 28 -7 15 -7 12 -4 Z" fill="#1E293B"/>

      <!-- Arms reaching out / gesturing politely to offer seat -->
      <path d="M 22 20 L 55 28" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
      <circle cx="56" cy="28" r="4" fill="#FDE047"/> <!-- Hand -->
      
      <path d="M 10 20 L -5 35" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Speed / Action Indicator Icon Floating Subtly (Semantics: Quickness / Urgency of 赶忙) -->
  <g transform="translate(100, 35)">
    <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <path d="M -6 -2 L 2 -8 L 0 3 L 6 2 L -2 8 L 0 -3 Z" fill="#F59E0B"/>
  </g>
</svg>