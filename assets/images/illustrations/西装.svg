<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Elements: Wedding Decor -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.15"/>
  <path d="M120 120 L150 180 L90 180 Z" fill="#fb923c" opacity="0.2"/>
  <ellipse cx="120" cy="180" rx="60" ry="15" fill="#334155" opacity="0.4"/>
  
  <!-- Character: The Man in the Suit -->
  <!-- Legs -->
  <rect x="100" y="140" width="15" height="70" fill="#0f172a" rx="4"/>
  <rect x="125" y="140" width="15" height="70" fill="#0f172a" rx="4"/>
  
  <!-- Suit Jacket -->
  <path d="M90 80 L150 80 L155 145 L85 145 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M120 80 L135 120 L120 145 L105 120 Z" fill="#0f172a"/>
  
  <!-- Shirt & Tie -->
  <path d="M110 80 L130 80 L125 110 L115 110 Z" fill="#f8fafc"/>
