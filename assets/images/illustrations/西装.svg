  <path d="M150 90 L170 120" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="120" cy="65" r="20" fill="#fcd34d"/>
  <path d="M110 60 A 5 5 0 0 1 120 60" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M130 60 A 5 5 0 0 1 140 60" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M115 75 Q 120 80 125 75" stroke="#0f172a" stroke-width="2" fill="none"/>
  
  <!-- Hair -->
  <path d="M100 60 Q 120 30 140 60 Q 120 45 100 60" fill="#0f172a"/>
  
  <!-- Wedding Props -->
  <circle cx="60" cy="180" r="15" fill="#ec4899" opacity="0.6"/>
