<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#151e33" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="trainLight" cx="100%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beamGradient" x1="0%" y1="50%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#skyGradient)" />

    <!-- Stars & Background Details -->
    <g fill="#94a3b8" opacity="0.6">
      <circle cx="30" cy="40" r="1" />
      <circle cx="70" cy="25" r="1.5" />
      <circle cx="120" cy="50" r="1" />
      <circle cx="180" cy="30" r="1.2" />
      <circle cx="215" cy="65" r="1" />
    </g>

    <!-- Distant Mountains / Hills -->
    <path d="M-10 160 Q 50 110, 110 135 T 250 125 L 250 200 L -10 200 Z" fill="#17223b" />
    <path d="M-10 175 Q 80 130, 150 160 T 250 150 L 250 200 L -10 200 Z" fill="#1e293b" />

    <!-- City Skyline Silhouettes -->
    <g fill="#111827" opacity="0.7">
      <rect x="20" y="110" width="15" height="40" />
      <rect x="38" y="95" width="22" height="55" />
      <polygon points="38,95 49,82 60,95" fill="#111827" />
      <rect x="65" y="125" width="12" height="25" />
      <rect x="180" y="100" width="18" height="50" />
      <rect x="202" y="115" width="25" height="35" />
    </g>

    <!-- Warm windows in city -->
    <g fill="#fbbf24" opacity="0.8">
      <rect x="43" y="102" width="3" height="4" />
      <rect x="51" y="102" width="3" height="4" />
      <rect x="43" y="112" width="3" height="4" />
      <rect x="51" y="112" width="3" height="4" />
      <rect x="185" y="110" width="3" height="5" />
      <rect x="192" y="110" width="3" height="5" />
      <rect x="185" y="122" width="3" height="5" />
    </g>

    <!-- PERSPECTIVE TRACKS (轨道 - Guidao) -->
    <!-- Ballast / Groundbed -->
    <polygon points="50,210 190,210 220,240 20,240" fill="#0f172a" />
    <path d="M 45 210 L 195 210 L 225 240 L 15 240 Z" fill="#334155" opacity="0.5" />

    <!-- Wooden Sleepers (枕木) -->
    <g fill="#475569">
      <polygon points="68,210 172,210 176,213 64,213" />
      <polygon points="62,216 178,216 183,220 57,220" />
      <polygon points="54,223 186,223 192,228 48,228" />
      <polygon points="44,231 196,231 204,236 36,236" />
      <polygon points="32,240 208,240 216,245 24,245" />
    </g>

    <!-- Steel Rails (轨道 - Left and Right parallel lines converging) -->
    <!-- Left Rail -->
    <path d="M 75 210 L 115 165" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <path d="M 73 210 L 113 165" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Right Rail -->
    <path d="M 165 210 L 131 165" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <path d="M 167 210 L 133 165" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Rail ties / connectors (Perspective lines) -->
    <line x1="85" y1="198" x2="155" y2="198" stroke="#475569" stroke-width="2" />
    <line x1="93" y1="188" x2="147" y2="188" stroke="#475569" stroke-width="2" />
    <line x1="100" y1="178" x2="140" y2="178" stroke="#475569" stroke-width="2" />
    <line x1="106" y1="170" x2="135" y2="170" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

    <!-- MOTION LINES ON TRACK -->
    <path d="M 110 175 L 85 200" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <path d="M 130 175 L 155 200" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />

    <!-- THE TRAIN (火车 - Huoche) -->
    <g transform="translate(0, -5)">
      <!-- Headlight Beam (Cone of light) -->
      <polygon points="120,150 10,185 10,115" fill="url(#beamGradient)" />
      
      <!-- Train Body (Modern Bullet Train Style) -->
      <!-- Main Chassis -->
      <path d="M 100 135 L 140 135 C 145 135, 150 142, 152 148 L 158 165 C 160 170, 155 175, 150 175 L 90 175 C 85 175, 80 170, 82 165 L 88 148 C 90 142, 95 135, 100 135 Z" fill="#f8fafc" />

      <!-- Train Nose/Front Cone -->
      <path d="M 120 120 C 115 120, 105 130, 100 135 L 140 135 C 135 130, 125 120, 120 120 Z" fill="#e2e8f0" />
      <path d="M 120 122 C 116 122, 108 130, 104 135 L 136 135 C 132 130, 124 122, 120 122 Z" fill="#38bdf8" />

      <!-- Red Accent Stripe -->
      <path d="M 85 153 L 155 153 L 157 159 L 83 159 Z" fill="#ef4444" />

      <!-- Windshield / Cabin Glass -->
      <path d="M 112 127 L 128 127 C 132 127, 135 130, 136 135 L 104 135 C 105 130, 108 127, 112 127 Z" fill="#0f172a" />
      <!-- Glass reflection -->
      <path d="M 114 129 L 122 129 L 120 133 L 113 133 Z" fill="#38bdf8" opacity="0.6" />

      <!-- Side Windows row -->
      <rect x="92" y="142" width="7" height="6" rx="2" fill="#0f172a" />
      <rect x="102" y="142" width="7" height="6" rx="2" fill="#0f172a" />
      <rect x="131" y="142" width="7" height="6" rx="2" fill="#0f172a" />
      <rect x="141" y="142" width="7" height="6" rx="2" fill="#0f172a" />

      <!-- Headlight Glowing Core -->
      <circle cx="120" cy="138" r="4" fill="#fef08a" />
      <circle cx="120" cy="138" r="7" fill="url(#trainLight)" style="mix-blend-mode: screen;" />

      <!-- Wheels / Underbody -->
      <rect x="95" y="174" width="15" height="4" rx="2" fill="#334155" />
      <rect x="130" y="174" width="15" height="4" rx="2" fill="#334155" />
      <circle cx="102" cy="178" r="3" fill="#64748b" />
      <circle cx="138" cy="178" r="3" fill="#64748b" />
    </g>

    <!-- Speed Lines / Wind Effects -->
    <path d="M 65 140 L 85 140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M 50 150 L 75 150" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 70 165 L 80 165" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.3" />

    <!-- FOREGROUND ELEMENTS (Framing & Rich Environment) -->
    <!-- Foreground Hill / Platform edge on the left -->
    <path d="M -10 240 L -10 210 Q 20 205, 45 215 L 60 240 Z" fill="#0f172a" />
    
    <!-- Electric / Signal Pole on the side (Context prop) -->
    <g transform="translate(35, 130)">
      <rect x="0" y="0" width="4" height="90" fill="#334155" />
      <rect x="-8" y="10" width="20" height="3" fill="#475569" />
      <line x1="-8" y1="10" x2="-12" y2="15" stroke="#475569" stroke-width="2" />
      <!-- Insulators & Signal Light -->
      <circle cx="-12" cy="15" r="2" fill="#ef4444" />
      <circle cx="-12" cy="15" r="4" fill="#ef4444" opacity="0.4" />
      <rect x="-2" y="35" width="10" height="2" fill="#475569" />
      <!-- Diagonal support wire -->
      <line x1="2" y1="20" x2="25" y2="85" stroke="#64748b" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Foliage / Bushes for depth -->
    <path d="M -5 240 C 10 230, 20 220, 35 225 C 45 228, 50 240, 50 240 Z" fill="#1e3a38" />
    <path d="M 15 240 C 25 232, 35 230, 48 235 C 55 238, 60 240, 60 240 Z" fill="#0d9488" opacity="0.6" />
    <circle cx="25" cy="230" r="8" fill="#134e4a" />
    <circle cx="40" cy="233" r="6" fill="#115e59" />

    <!-- Sparkles / Atmosphere -->
    <g fill="#38bdf8" opacity="0.8">
      <circle cx="165" cy="130" r="1.5" />
      <circle cx="175" cy="125" r="1" />
      <circle cx="155" cy="115" r="2" />
    </g>
    <g fill="#f59e0b" opacity="0.8">
      <circle cx="85" cy="120" r="1.5" />
      <circle cx="95" cy="110" r="1" />
    </g>

    <!-- Subtle Vignette / Border Glow -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />
  </g>
</svg>