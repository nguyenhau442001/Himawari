<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow representing legend/myth -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.08"/>
  <circle cx="120" cy="115" r="50" fill="#FFB703" opacity="0.12"/>

  <!-- Ancient Scroll (Physical Object representing Legend / 相传) -->
  <!-- Scroll Handles (Rollers) - Back Layer -->
  <rect x="52" y="65" width="12" height="100" rx="6" fill="#D4A373"/>
  <rect x="176" y="65" width="12" height="100" rx="6" fill="#D4A373"/>

  <!-- Scroll Body (Parchment Paper) -->
  <path d="M 58 65 L 182 65 C 185 65 188 68 188 71 L 188 159 C 188 162 185 165 182 165 L 58 165 C 55 165 52 162 52 159 L 52 71 C 52 68 55 65 58 65 Z" fill="#F4F1DE"/>
  
  <!-- Scroll Paper Inner Shading (Curled ends) -->
  <path d="M 58 65 L 68 65 L 68 165 L 58 165 C 55 165 52 162 52 159 L 52 71 C 52 68 55 65 58 65 Z" fill="#E6E0C6"/>
  <path d="M 172 65 L 182 65 C 185 65 188 68 188 71 L 188 159 C 188 162 185 165 182 165 L 172 165 Z" fill="#E6E0C6"/>

  <!-- Scroll Wooden Rod Caps -->
  <circle cx="58" cy="62" r="7" fill="#CCD5AE"/>
  <circle cx="182" cy="62" r="7" fill="#CCD5AE"/>
  <circle cx="58" cy="168" r="7" fill="#CCD5AE"/>
  <circle cx="182" cy="168" r="7" fill="#CCD5AE"/>

  <!-- Mythical Landscape Illustration inside the scroll (Lake & Fairy/Ancient lore context) -->
  <!-- Distant Mountains -->
  <path d="M 75 125 L 95 95 L 115 125 Z" fill="#90A955" opacity="0.6"/>
  <path d="M 105 125 L 130 85 L 155 125 Z" fill="#52796F" opacity="0.7"/>
  <path d="M 135 125 L 155 100 L 175 125 Z" fill="#90A955" opacity="0.5"/>

  <!-- Glowing Sun / Celestial element -->
  <circle cx="130" cy="100" r="12" fill="#FFB703"/>

  <!-- Clear Lake (matching contextual reference: 古时候的清澈湖泊) -->
  <ellipse cx="125" cy="135" rx="42" ry="14" fill="#48CAE4" opacity="0.8"/>
  <ellipse cx="125" cy="137" rx="35" ry="9" fill="#90E0EF" opacity="0.6"/>

  <!-- Magical / Mythical sparkles rising from the scroll -->
  <path d="M 120 52 L 122 47 L 127 45 L 122 43 L 120 38 L 118 43 L 113 45 L 118 47 Z" fill="#FFB703"/>
  <path d="M 90 58 L 91 55 L 94 54 L 91 53 L 90 50 L 89 53 L 86 54 L 89 55 Z" fill="#FFB703" opacity="0.7"/>
  <path d="M 150 58 L 151 55 L 154 54 L 151 53 L 150 50 L 149 53 L 146 54 L 149 55 Z" fill="#FFB703" opacity="0.7"/>

  <!-- Ribbon / Seal accent -->
  <rect x="112" y="110" width="16" height="40" rx="3" fill="#E63946" opacity="0.85"/>
  <polygon points="120,158 112,148 128,148" fill="#E63946" opacity="0.85"/>

  <!-- Base UI/Card Accent Line -->
  <line x1="80" y1="195" x2="160" y2="195" stroke="#FFB703" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>