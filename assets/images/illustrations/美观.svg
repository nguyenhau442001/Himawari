<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- The "Practical and Beautiful" Object: A Modern Desk Lamp -->
  <!-- Base -->
  <ellipse cx="120" cy="175" rx="30" ry="8" fill="#475569"/>
  <!-- Stand -->
  <rect x="115" y="100" width="10" height="70" rx="2" fill="#94a3b8"/>
  <!-- Lamp Head (The Design) -->
  <path d="M90 100 L150 100 L160 80 L80 80 Z" fill="#fbbf24"/>
  <path d="M85 80 A35 35 0 0 1 155 80" fill="#fb923c"/>
  
  <!-- Light Beam -->
  <path d="M95 100 L70 180 L170 180 L145 100 Z" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Character: Designer/User -->
  <!-- Head -->
  <circle cx="60" cy="120" r="20" fill="#cbd5e1"/>
  <!-- Hair -->
  <path d="M45 115 C45 100 75 100 75 115 C75 125 45 125 45 115" fill="#334155"/>
  <!-- Body -->
  <path d="M40 140 C40 130 80 130 80 140 L75 170 L45 170 Z" fill="#38bdf8"/>
  <!-- Arm reaching to switch -->
  <path d="M75 145 L95 135" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Context Props: Notebook and Pen -->
  <rect x="160" y="165" width="40" height="50" rx="2" fill="#e2e8f0"/>
  <line x1="165" y1="175" x2="195" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="165" y1="185" x2="195" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <rect x="190" y="150" width="5" height="20" rx="1" fill="#ec4899" transform="rotate(20 192 160)"/>
  
  <!-- Decorative elements for "Beautiful" aesthetic -->
  <circle cx="200" cy="50" r="3" fill="#10b981"/>
  <circle cx="30" cy="60" r="4" fill="#38bdf8"/>
  <path d="M210 100 L220 90 L230 100 L220 110 Z" fill="#fb923c" opacity="0.6"/>
</svg>