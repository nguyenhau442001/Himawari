<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle motion lines -->
  <path d="M120 80 L120 160 M100 100 L140 100" stroke="#2D343E" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character Body -->
  <path d="M90 220 C90 180, 150 180, 150 220" fill="#3D4A5D"/>
  <circle cx="120" cy="110" r="25" fill="#FFB84D"/>
  
  <!-- Raised Arm (Action) -->
  <path d="M135 115 L170 70" stroke="#FFB84D" stroke-width="12" stroke-linecap="round"/>
  <path d="M170 70 L185 55" stroke="#FFB84D" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Hand -->
  <circle cx="185" cy="55" r="8" fill="#FFB84D"/>
  
  <!-- Motion Lines for Oath -->
  <path d="M195 50 L210 35" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M200 60 L215 45" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Other Arm -->
  <path d="M105 115 L80 150" stroke="#3D4A5D" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Formal attire detail -->
  <path d="M105 130 L135 130" stroke="#2D343E" stroke-width="4" stroke-linecap="round"/>
</svg>