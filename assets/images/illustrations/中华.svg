<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements: Traditional architecture silhouette -->
  <path d="M40 180 L40 120 L70 90 L100 120 L100 180 Z" fill="#334155"/>
  <path d="M140 180 L140 100 L170 70 L200 100 L200 180 Z" fill="#334155"/>
  <circle cx="180" cy="60" r="15" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Characters: Two people standing together in a friendly, connected pose -->
  <!-- Person 1 -->
  <g transform="translate(70, 110)">
    <circle cx="30" cy="30" r="12" fill="#fbbf24"/>
    <path d="M20 50 Q30 40 40 50 L35 110 L25 110 Z" fill="#38bdf8"/>
    <path d="M25 110 L25 140 L20 140 Z" fill="#38bdf8"/>
    <path d="M35 110 L35 140 L40 140 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(120, 110)">
    <circle cx="30" cy="30" r="12" fill="#fb923c"/>
    <path d="M20 50 Q30 40 40 50 L35 110 L25 110 Z" fill="#ec4899"/>
    <path d="M25 110 L25 140 L20 140 Z" fill="#ec4899"/>
    <path d="M35 110 L35 140 L40 140 Z" fill="#ec4899"/>
  </g>
  
  <!-- Connecting element: Warm glow between them representing unity -->
  <ellipse cx="120" cy="150" rx="40" ry="10" fill="#f59e0b" opacity="0.2"/>
  
  <!-- Foreground details: Lanterns -->
  <circle cx="50" cy="190" r="8" fill="#fb923c"/>
  <rect x="49" y="198" width="2" height="10" fill="#fb923c"/>
  <circle cx="190" cy="190" r="8" fill="#fb923c"/>
  <rect x="189" y="198" width="2" height="10" fill="#fb923c"/>
  
  <!-- Ground -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
</svg>