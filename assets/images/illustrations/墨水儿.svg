<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The Ink Bottle -->
  <g transform="translate(140, 110)">
    <!-- Bottle Body -->
    <path d="M10 20 L50 20 L45 70 L15 70 Z" fill="#fb923c"/>
    <!-- Ink Level (Low) -->
    <path d="M12 65 L48 65 L47 60 L13 60 Z" fill="#0f172a"/>
    <path d="M13 60 L47 60 L46 55 L14 55 Z" fill="#1e293b"/>
    <!-- Bottle Cap -->
    <rect x="15" y="10" width="30" height="10" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Character: Writer/Student -->
  <g transform="translate(40, 80)">
    <!-- Head -->
    <circle cx="30" cy="30" r="25" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M10 30 Q30 0 50 30" fill="#78350f"/>
    <!-- Glasses -->
    <circle cx="20" cy="30" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="40" cy="30" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <!-- Body -->
    <path d="M5 60 Q30 50 55 60 L50 120 L10 120 Z" fill="#38bdf8"/>
    <!-- Arm reaching -->
    <path d="M55 80 L90 100" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Quill/Pen -->
  <path d="M90 100 L135 75" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Paper -->
  <rect x="80" y="170" width="100" height="40" rx="2" fill="#f1f5f9"/>
  <path d="M90 180 L160 180 M90 190 L140 190" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Decorative Light Glow -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
</svg>