<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Living Room Interior -->
  <path d="M20 180 L220 180 L220 220 L20 220 Z" fill="#334155"/>
  <rect x="40" y="100" width="60" height="80" rx="4" fill="#475569"/>
  <circle cx="70" cy="120" r="15" fill="#f59e0b"/>
  
  <!-- The Family (Parents) -->
  <g transform="translate(140, 130)">
    <circle cx="10" cy="10" r="12" fill="#fbbf24"/>
    <path d="M0 25 L20 25 L15 60 L5 60 Z" fill="#38bdf8"/>
    <circle cx="40" cy="15" r="12" fill="#fbbf24"/>
    <path d="M30 30 L50 30 L45 60 L35 60 Z" fill="#ec4899"/>
  </g>
  
  <!-- The Nanny (保姆) -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="15" fill="#fb923c"/>
    <path d="M5 40 L35 40 L30 100 L10 100 Z" fill="#10b981"/>
    <path d="M10 45 L30 45" stroke="#064e3b" stroke-width="2"/>
    <!-- Holding a cleaning cloth/toy -->
    <rect x="35" y="50" width="15" height="15" rx="2" fill="#f8fafc"/>
  </g>
  
  <!-- Decorative elements -->
  <path d="M180 60 L200 60 L200 80 L180 80 Z" fill="#fbbf24" opacity="0.6"/>
  <circle cx="190" cy="40" r="5" fill="#38bdf8"/>
  
  <!-- Floor details -->
  <line x1="20" y1="180" x2="220" y2="180" stroke="#475569" stroke-width="2"/>
</svg>