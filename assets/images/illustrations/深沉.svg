<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle depth elements -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#2A2F3D" stroke-width="1" opacity="0.3"/>

  <!-- Focused Character Silhouette representing "深沉" (composed, profound personality) -->
  <g transform="translate(0, 5)">
    <!-- Shoulders and Body Base -->
    <path d="M 70 170 C 70 145, 92 135, 120 135 C 148 135, 170 145, 170 170 Z" fill="#242B38"/>
    
    <!-- Inner collar/shirt detail (minimalist) -->
    <path d="M 105 135 L 120 150 L 135 135" fill="none" stroke="#353E52" stroke-width="2" stroke-linecap="round"/>

    <!-- Head / Face Profile (Contemplative, calm, turned slightly or strong clean silhouette) -->
    <path d="M 105 105 C 105 85, 112 75, 125 75 C 138 75, 145 85, 145 105 C 145 125, 138 130, 125 130 C 112 130, 105 125, 105 105 Z" fill="#303A4D"/>

    <!-- Hair styling: neat, composed -->
    <path d="M 104 100 C 103 80, 112 72, 125 71 C 139 71, 147 80, 146 102 C 140 96, 132 94, 125 94 C 117 94, 110 96, 104 100 Z" fill="#1A1D24"/>

    <!-- Calm, closed eyes / thoughtful expression line -->
    <path d="M 128 102 Q 134 104, 140 102" fill="none" stroke="#606E8A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Abstract glowing core representing depth and profound inner wisdom (Sovereign Gold / Warm Orange accent) -->
  <g transform="translate(0, 5)">
    <!-- Radiant core aura -->
    <circle cx="120" cy="105" r="28" fill="#F59E0B" opacity="0.15"/>
    <circle cx="120" cy="105" r="18" fill="#F59E0B" opacity="0.25"/>
    
    <!-- Concentrated profound element (Glowing core suspended inside/beside the calm mind) -->
    <circle cx="120" cy="105" r="8" fill="#F59E0B"/>
    <circle cx="120" cy="105" r="3" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Accent light rays or depth ripples (representing calmness & profound depth) -->
  <path d="M 90 105 L 100 105" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 140 105 L 150 105" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Floating geometric particles for modern flat educational aesthetic -->
  <circle cx="75" cy="75" r="3" fill="#3B82F6" opacity="0.6"/>
  <circle cx="165" cy="85" r="2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="155" cy="155" r="3.5" fill="#3B82F6" opacity="0.5"/>
  <circle cx="85" cy="145" r="2" fill="#F59E0B" opacity="0.6"/>
</svg>