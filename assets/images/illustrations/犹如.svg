<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative ambient lighting (Warm spring sunrise concept) -->
  <circle cx="120" cy="130" r="70" fill="#FFB703" opacity="0.08"/>
  <path d="M50 180 Q120 190 190 180" stroke="#2D333B" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Motion / Analogy connection lines (Semantic bridge: A is like B) -->
  <path d="M75 115 Q120 85 165 115" stroke="#FF9F43" stroke-width="2.5" stroke-dasharray="4 4" fill="none" opacity="0.7"/>
  <path d="M85 125 Q120 100 155 125" stroke="#FF9F43" stroke-width="1.5" opacity="0.4"/>
  
  <g transform="translate(0, 5)">
    <!-- Left element: Smiling Human Character representing "Her smile" (她的笑容) -->
    <g transform="translate(60, 95)">
      <!-- Head / Face -->
      <circle cx="0" cy="0" r="26" fill="#F6BD60"/>
      <!-- Hair -->
      <path d="M -22 -10 C -25 -30, 25 -30, 22 -10 C 26 5, 20 20, 15 25 C 10 15, -10 15, -15 25 C -20 20, -26 5, -22 -10 Z" fill="#2B2D42"/>
      <!-- Warm Gentle Smile (Action/Expression) -->
      <path d="M -8 6 C -3 12, 3 12, 8 6" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Gentle closed happy eyes -->
      <path d="M -11 -3 C -9 -6, -5 -6, -3 -3" stroke="#2B2D42" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 3 -3 C 5 -6, 9 -6, 11 -3" stroke="#2B2D42" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Soft blush -->
      <circle cx="-14" cy="4" r="4" fill="#FF6B6B" opacity="0.4"/>
      <circle cx="14" cy="4" r="4" fill="#FF6B6B" opacity="0.4"/>
      <!-- Body / Shoulders -->
      <path d="M -20 38 C -20 25, 20 25, 20 38" fill="#FF6B6B" opacity="0.9"/>
    </g>

    <!-- Right element: Vibrant Spring Sprout / Warmth (春天般温暖) -->
    <g transform="translate(180, 95)">
      <!-- Pot / Base -->
      <path d="M -15 35 L 15 35 L 12 20 L -12 20 Z" fill="#4A5568"/>
      <!-- Soil -->
      <ellipse cx="0" cy="20" rx="12" ry="4" fill="#2D3748"/>
      
      <!-- Dynamic growing spring plant (Action of blooming/warmth) -->
      <path d="M 0 20 C 0 5, -12 -5, -16 -12" stroke="#2EC4B6" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 0 10 C 2 -2, 12 -10, 16 -16" stroke="#2EC4B6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Sprout leaves -->
      <path d="M -16 -12 C -22 -18, -12 -24, -6 -18 C -2 -14, -10 -8, -16 -12 Z" fill="#2EC4B6"/>
      <path d="M 16 -16 C 22 -22, 14 -28, 8 -22 C 4 -18, 10 -12, 16 -16 Z" fill="#4CB944"/>
      <path d="M 0 0 C -6 -8, 2 -14, 8 -10 C 12 -6, 4 -2, 0 0 Z" fill="#2EC4B6"/>
    </g>

    <!-- Center Comparison / Interaction Spark -->
    <g transform="translate(120, 95)">
      <circle cx="0" cy="-10" r="14" fill="#FF9F43" opacity="0.15"/>
      <!-- Radiating warmth rays -->
      <path d="M 0 -30 L 0 -24" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -14 -16 L -10 -12" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 14 -16 L 10 -12" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>