<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Shadow under the bowl -->
  <ellipse cx="120" cy="188" rx="55" ry="12" fill="#111318"/>

  <!-- Bowl Base (Sleek dark mode ceramic bowl) -->
  <path d="M 72 135 C 72 175, 168 175, 168 135 Z" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
  <ellipse cx="120" cy="135" rx="48" ry="10" fill="#3B4252" stroke="#4C566A" stroke-width="2"/>

  <!-- Salad Contents inside Bowl (凉拌黄瓜 - Smashed cucumbers & chili) -->
  <g clip-path="url(#bowlClip)">
    <clipPath id="bowlClip">
      <ellipse cx="120" cy="135" rx="46" ry="9"/>
    </clipPath>
    <!-- Bed of cucumbers -->
    <ellipse cx="120" cy="134" rx="44" ry="8" fill="#88C0D0"/>
    
    <!-- Cucumber chunks (irregular bright green wedges) -->
    <path d="M 95 130 L 105 138 L 98 142 Z" fill="#A3BE8C"/>
    <path d="M 110 128 L 122 134 L 115 140 Z" fill="#A3BE8C"/>
    <path d="M 130 132 L 142 128 L 138 140 Z" fill="#A3BE8C"/>
    <path d="M 102 136 L 114 130 L 108 138 Z" fill="#8FBCBB"/>
    <path d="M 125 136 L 135 142 L 120 140 Z" fill="#8FBCBB"/>

    <!-- Chili flakes & Garlic bits (Vibrant orange/red accents) -->
    <circle cx="103" cy="134" r="2.5" fill="#BF616A"/>
    <circle cx="128" cy="132" r="2" fill="#BF616A"/>
    <circle cx="118" cy="138" r="3" fill="#D08770"/>
    <circle cx="138" cy="136" r="2" fill="#EBCB8B"/>
    <circle cx="98" cy="138" r="2" fill="#EBCB8B"/>
  </g>

  <!-- Chopsticks & Mixing Motion (Visualizing '拌' - tossing/mixing) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Chopstick 1 -->
    <line x1="60" y1="70" x2="115" y2="128" stroke="#D08770" stroke-width="4"/>
    <!-- Chopstick 2 -->
    <line x1="180" y1="75" x2="125" y2="130" stroke="#D08770" stroke-width="4"/>
    
    <!-- Action / Motion swirl lines indicating mixing -->
    <path d="M 95 115 C 105 108, 135 108, 145 116" fill="none" stroke="#EBCB8B" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 100 123 C 110 118, 130 118, 140 124" fill="none" stroke="#EBCB8B" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Floating fresh ingredients elements (Adding context to the cold dish concept) -->
  <!-- Fresh Chili slice -->
  <path d="M 175 95 C 180 93, 185 97, 183 102 C 181 107, 174 105, 175 95 Z" fill="#BF616A"/>
  <circle cx="178" cy="98" r="1" fill="#EBCB8B"/>

  <!-- Garlic clove icon top left -->
  <path d="M 60 90 C 65 85, 72 90, 68 98 C 64 102, 57 96, 60 90 Z" fill="#ECEFF4"/>
  <path d="M 64 92 C 66 94, 66 96, 64 98" fill="none" stroke="#D8DEE9" stroke-width="1"/>
</svg>