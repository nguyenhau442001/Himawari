<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bookstore Shelf Background -->
  <rect x="20" y="40" width="200" height="100" rx="4" fill="#334155"/>
  <rect x="30" y="50" width="40" height="30" fill="#fb923c"/>
  <rect x="80" y="50" width="40" height="35" fill="#38bdf8"/>
  <rect x="130" y="50" width="40" height="25" fill="#ec4899"/>
  <rect x="180" y="50" width="30" height="40" fill="#fbbf24"/>
  
  <!-- Counter -->
  <rect x="0" y="160" width="240" height="80" fill="#1e293b"/>
  <path d="M0 160 L240 160 L230 240 L10 240 Z" fill="#0f172a"/>
  
  <!-- Bookseller -->
  <circle cx="180" cy="140" r="25" fill="#f8fafc"/>
  <path d="M165 170 L170 210 M195 170 L190 210" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Customer -->
  <circle cx="60" cy="140" r="25" fill="#fbbf24"/>
  <path d="M45 170 L50 210 M75 170 L70 210" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  
  <!-- The Book and Bookmark -->
  <rect x="90" y="170" width="60" height="40" rx="2" fill="#f59e0b"/>
  <rect x="100" y="160" width="10" height="50" rx="2" fill="#10b981"/>
  
  <!-- Handing over action -->
  <path d="M150 180 L170 180" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="175" cy="180" r="6" fill="#10b981"/>
  
  <!-- Decorative light -->
  <circle cx="120" cy="30" r="40" fill="#fbbf24" opacity="0.1"/>
</svg>