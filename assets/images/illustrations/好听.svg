<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative sound wave ripples (faint, chaotic background representing ordinary noise vs focused musical beauty) -->
  <path d="M 30,120 Q 40,100 50,120 T 70,120" stroke="#2D323E" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 170,120 Q 180,140 190,120 T 210,120" stroke="#2D323E" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Central Visual Contrast (Adjective Rule: Scale exaggeration & emotional expression) -->
  <!-- Left/Bottom: Small, flat, muted acoustic wave -->
  <g transform="translate(45, 120)">
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="-25" x2="12" y2="25" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="-10" x2="24" y2="10" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right/Main Focus: Exaggerated, vibrant, golden musical elegance ("好听" - wonderfully sounding) -->
  <!-- Stylized Elegant Note & Radiating Harmonious Waves -->
  <g transform="translate(110, 70)">
    <!-- Golden radiant glow rings -->
    <circle cx="20" cy="50" r="45" fill="none" stroke="#F6AD55" stroke-width="1.5" opacity="0.2"/>
    <circle cx="20" cy="50" r="32" fill="none" stroke="#F6AD55" stroke-width="2" opacity="0.4"/>
    <circle cx="20" cy="50" r="18" fill="none" stroke="#F6AD55" stroke-width="2.5" opacity="0.6"/>

    <!-- Dual Musical Notes (Melody/曲子 context) -->
    <!-- Note 1 -->
    <ellipse cx="10" cy="65" rx="8" ry="6" fill="#F6AD55" transform="rotate(-15 10 65)"/>
    <path d="M 16,63 L 16,25 Q 16,18 24,15 L 24,15" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Note 2 -->
    <ellipse cx="38" cy="55" rx="8" ry="6" fill="#F6AD55" transform="rotate(-15 38 55)"/>
    <path d="M 44,53 L 44,15 Q 44,8 52,5 L 52,5" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Connecting Beam -->
    <path d="M 16,28 L 44,18 L 44,24 L 16,34 Z" fill="#F6AD55"/>
  </g>

  <!-- Harmonious Flowing Sound Waves (Emphasizing the 'pleasing to the ear' quality) -->
  <path d="M 75,170 C 95,145 145,145 165,170" stroke="#ED8936" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 60,185 C 90,150 150,150 180,185" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none"/>
  <path d="M 90,158 C 105,145 135,145 150,158" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" fill="none"/>

  <!-- Sparkles of beauty/excellence -->
  <path d="M 75,70 L 78,78 L 86,81 L 78,84 L 75,92 L 72,84 L 64,81 L 72,78 Z" fill="#F6AD55" opacity="0.8"/>
  <path d="M 175,95 L 177,100 L 182,102 L 177,104 L 175,109 L 173,104 L 168,102 L 173,100 Z" fill="#F6AD55" opacity="0.6"/>
  <path d="M 95,120 L 96,123 L 99,124 L 96,125 L 95,128 L 94,125 L 91,124 L 94,123 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>