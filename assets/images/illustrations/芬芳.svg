    <circle cx="0" cy="0" r="8" fill="#FFD700"/>
    
    <!-- Scent/Aroma Waves -->
    <path d="M0 -50 Q 20 -65, 0 -80 M0 -50 Q -20 -65, 0 -80" stroke="#FFD700" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M30 -30 Q 50 -45, 30 -60 M30 -30 Q 10 -45, 30 -60" stroke="#FFD700" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M-30 -30 Q -10 -45, -30 -60 M-30 -30 Q -50 -45, -30 -60" stroke="#FFD700" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    
    <!-- Stem and Leaf -->
