<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Booth Structure -->
  <path d="M30 180 L30 80 L210 80 L210 180 Z" fill="#334155" opacity="0.5"/>
  <rect x="40" y="140" width="160" height="40" rx="4" fill="#475569"/>
  <rect x="40" y="140" width="160" height="10" fill="#334155"/>
  
  <!-- Background elements (Expo banners) -->
  <rect x="60" y="90" width="30" height="50" fill="#fb923c" rx="2"/>
  <rect x="110" y="90" width="30" height="50" fill="#38bdf8" rx="2"/>
  <rect x="160" y="90" width="30" height="50" fill="#10b981" rx="2"/>
  
  <!-- Characters -->
  <!-- Left: Local Merchant -->
  <g transform="translate(60, 130)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 35 Q20 45 30 35" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <rect x="5" y="50" width="30" height="50" rx="5" fill="#f59e0b"/>
  </g>
  
  <!-- Right: International Merchant -->
  <g transform="translate(150, 130)">
    <circle cx="20" cy="20" r="15" fill="#bae6fd"/>
    <path d="M10 35 Q20 45 30 35" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <rect x="5" y="50" width="30" height="50" rx="5" fill="#38bdf8"/>
  </g>
  
  <!-- Interaction Props -->
  <rect x="105" y="145" width="30" height="20" rx="2" fill="#e2e8f0"/>
  <path d="M110 150 L130 150 M110 155 L125 155" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Lighting/Atmosphere -->
  <circle cx="120" cy="60" r="40" fill="#f59e0b" opacity="0.1"/>
  <circle cx="120" cy="60" r="20" fill="#f59e0b" opacity="0.2"/>
</svg>