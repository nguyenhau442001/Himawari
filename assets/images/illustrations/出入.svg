<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural Portal/Gateway representing "出入" (In/Out, Movement, Discrepancy threshold) -->
  <!-- Outer Frame -->
  <path d="M70 50 L170 50 L170 190 L155 190 L155 70 L85 70 L85 190 L70 190 Z" fill="#2D3748" />
  
  <!-- Threshold Floor -->
  <rect x="50" y="190" width="140" height="8" rx="2" fill="#4A5568" />
  
  <!-- Left Side (Entrance/Exit Zone A) -->
  <rect x="75" y="75" width="30" height="110" fill="#252D3D" />
  <!-- Right Side (Entrance/Exit Zone B) -->
  <rect x="135" y="75" width="30" height="110" fill="#252D3D" />

  <!-- Directional Flow Arrows representing the action of going in and out -->
  <!-- Exit Arrow (Going Right/Out) -->
  <path d="M95 110 L130 110 M120 100 L135 110 L120 120" stroke="#F6AD55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Entrance Arrow (Going Left/In) -->
  <path d="M145 150 L110 150 M120 140 L105 150 L120 160" stroke="#63B3ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Discrepancy / Variance Indicators (Floating Data Nodes symbolizing "sai lệch, chênh lệch") -->
  <!-- Node 1 (Top Left offset) -->
  <circle cx="55" cy="90" r="6" fill="#F56565" opacity="0.8" />
  <line x1="55" y1="96" x2="55" y2="110" stroke="#F56565" stroke-dasharray="2 2" stroke-width="2" />
  <circle cx="55" cy="115" r="3" fill="#F56565" />

  <!-- Node 2 (Top Right offset) -->
  <circle cx="185" cy="120" r="6" fill="#48BB78" opacity="0.8" />
  <line x1="185" y1="114" x2="185" y2="95" stroke="#48BB78" stroke-dasharray="2 2" stroke-width="2" />
  <circle cx="185" cy="90" r="3" fill="#48BB78" />

  <!-- Central Focal Point: Physical doorway emblem -->
  <circle cx="120" cy="130" r="12" fill="#1A1D24" stroke="#E2E8F0" stroke-width="3" />
  <path d="M116 130 L124 130 M120 126 L124 130 L120 134" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

</svg>