<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Window Frame -->
  <rect x="40" y="40" width="160" height="160" rx="8" fill="#2C3440" stroke="#4A5568" stroke-width="4"/>
  
  <!-- Glass Pane (Transparency effect) -->
  <rect x="44" y="44" width="152" height="152" rx="4" fill="#3B82F6" fill-opacity="0.15"/>
  
  <!-- Cityscape Silhouette (Viewed through the glass) -->
  <path d="M60 180 L60 140 L75 120 L90 150 L105 110 L120 160 L135 130 L150 170 L165 140 L180 180 Z" fill="#F59E0B" fill-opacity="0.6"/>
  <rect x="70" y="130" width="10" height="20" fill="#1A1D24" fill-opacity="0.3"/>
  <rect x="110" y="120" width="10" height="30" fill="#1A1D24" fill-opacity="0.3"/>
  <rect x="150" y="150" width="10" height="20" fill="#1A1D24" fill-opacity="0.3"/>
  
  <!-- Focus highlight on the glass surface -->
  <path d="M44 44 L196 44 L196 60 L60 196 L44 196 Z" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <!-- Frame Detail -->
  <line x1="120" y1="40" x2="120" y2="200" stroke="#4A5568" stroke-width="4"/>
  <line x1="40" y1="120" x2="200" y2="120" stroke="#4A5568" stroke-width="4"/>
</svg>