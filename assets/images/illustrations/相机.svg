<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(32, 60)">
    <!-- Camera Body -->
    <rect x="20" y="44" width="136" height="88" rx="16" fill="#2E3440"/>
    <rect x="20" y="44" width="136" height="88" rx="16" fill="none" stroke="#4C566A" stroke-width="2"/>
    
    <!-- Top Viewfinder / Flash Housing -->
    <path d="M68 44 L80 28 h16 L108 44 Z" fill="#3B4252"/>
    <path d="M68 44 L80 28 h16 L108 44 Z" fill="none" stroke="#4C566A" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Shutter Button -->
    <rect x="36" y="36" width="16" height="8" rx="3" fill="#D8DEE9"/>
    <rect x="36" y="36" width="16" height="8" rx="3" fill="none" stroke="#4C566A" stroke-width="2"/>

    <!-- Dial -->
    <rect x="124" y="36" width="20" height="8" rx="2" fill="#D8DEE9"/>
    <rect x="124" y="36" width="20" height="8" rx="2" fill="none" stroke="#4C566A" stroke-width="2"/>

    <!-- Main Lens Outer -->
    <circle cx="88" cy="88" r="32" fill="#D8DEE9"/>
    <circle cx="88" cy="88" r="32" fill="none" stroke="#4C566A" stroke-width="3"/>
    
    <!-- Lens Middle -->
    <circle cx="88" cy="88" r="24" fill="#3B4252"/>
    <circle cx="88" cy="88" r="24" fill="none" stroke="#D8DEE9" stroke-width="2"/>
    
    <!-- Lens Inner Glass -->
    <circle cx="88" cy="88" r="16" fill="#88C0D0"/>
    
    <!-- Lens Reflection / Highlight -->
    <path d="M78 78 Q88 74 98 78" stroke="#E5E9F0" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Viewfinder Window -->
    <rect x="124" y="56" width="16" height="12" rx="3" fill="#3B4252"/>
    <rect x="124" y="56" width="16" height="12" rx="3" fill="none" stroke="#4C566A" stroke-width="1.5"/>

    <!-- Flash / Sensor -->
    <circle cx="44" cy="60" r="6" fill="#EBCB8B"/>
    <circle cx="44" cy="60" r="6" fill="none" stroke="#4C566A" stroke-width="1.5"/>
    
    <!-- Grip Accent / Strap Lug Left -->
    <rect x="14" y="72" width="6" height="12" rx="2" fill="#D8DEE9"/>
    <!-- Grip Accent / Strap Lug Right -->
    <rect x="156" y="72" width="6" height="12" rx="2" fill="#D8DEE9"/>

    <!-- Focus Accent / LED Light -->
    <circle cx="52" cy="104" r="3" fill="#BF616A"/>
  </g>
</svg>