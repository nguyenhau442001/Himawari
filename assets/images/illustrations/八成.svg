<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmospheric background & dark storm clouds -->
  <path d="M40 70 C40 55, 60 45, 75 55 C90 35, 120 35, 135 55 C155 45, 180 55, 185 75 C200 80, 205 100, 195 115 C200 130, 185 145, 165 145 L65 145 C45 145, 35 130, 40 115 C30 100, 30 80, 40 70 Z" fill="#2A3241"/>
  <path d="M60 85 C60 70, 80 60, 95 70 C110 50, 140 50, 155 70 C175 60, 200 70, 205 90 C220 95, 225 115, 215 130 C220 145, 205 160, 185 160 L75 160 C55 160, 45 145, 50 130 C40 115, 45 95, 60 85 Z" fill="#353E50"/>
  
  <!-- Heavy rain streams (representing the imminent downpour) -->
  <line x1="75" y1="165" x2="60" y2="200" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="100" y1="170" x2="85" y2="205" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="125" y1="165" x2="110" y2="200" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="150" y1="170" x2="135" y2="205" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="175" y1="165" x2="160" y2="200" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Central physical object: A classic sturdy yellow umbrella (representing preparedness for the likely rain) -->
  <!-- Handle -->
  <path d="M120 160 L120 200 C120 210, 132 210, 132 200 L132 195" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Canopy -->
  <path d="M70 145 C70 145, 95 130, 120 130 C145 130, 170 145, 170 145 C170 145, 190 100, 120 95 C50 100, 70 145, 70 145 Z" fill="#F5A623"/>
  <path d="M120 95 L120 148" fill="none" stroke="#D9822B" stroke-width="2"/>
  <path d="M95 137 C105 143, 135 143, 145 137" fill="none" stroke="#D9822B" stroke-width="1.5"/>
  <path d="M82 121 C95 127, 145 127, 158 121" fill="none" stroke="#D9822B" stroke-width="1.5"/>
  
  <!-- Subtle glowing probability indicator rim highlighting "eight-tenths" likelihood -->
  <path d="M70 145 C70 145, 95 130, 120 130 C145 130, 170 145, 170 145" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="120" stroke-dashoffset="24" opacity="0.4"/>
</svg>