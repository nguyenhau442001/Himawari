<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Contextual Football Team Joining / Inclusion Vector Graphic -->
  <!-- Subtle circular field/pitch base element representing the team entity -->
  <circle cx="120" cy="130" r="70" fill="#222831" stroke="#2D3748" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Football (central physical object representing the sports team context) -->
  <g transform="translate(120, 130)">
    <!-- Ball body -->
    <circle cx="0" cy="0" r="28" fill="#F7FAFC"/>
    <!-- Classic soccer ball pentagon patterns -->
    <path d="M0,-12 L8,-5 L5,5 L-5,5 L-8,-5 Z" fill="#1A1D24"/>
    <path d="M15,-22 L22,-14 L18,-5 L10,-12 Z" fill="#1A1D24"/>
    <path d="M-15,-22 L-10,-12 L-18,-5 L-22,-14 Z" fill="#1A1D24"/>
    <path d="M18,12 L22,22 L12,25 L8,15 Z" fill="#1A1D24"/>
    <path d="M-18,12 L-8,15 L-12,25 L-22,22 Z" fill="#1A1D24"/>
  </g>

  <!-- Player 1 (Left - Existing team member welcoming) -->
  <g transform="translate(60, 130)">
    <!-- Body -->
    <path d="M-12,35 C-12,20 -6,15 0,15 C6,15 12,20 12,35 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="2" r="9" fill="#CBD5E0"/>
    <!-- Welcoming waving arm -->
    <path d="M-8,18 C-18,10 -25,0 -22,-5" fill="none" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Player 2 (Right - New member joining, stepping in with an open posture) -->
  <g transform="translate(180, 130)">
    <!-- Body -->
    <path d="M-12,35 C-12,20 -6,15 0,15 C6,15 12,20 12,35 Z" fill="#FF8C00"/>
    <!-- Head -->
    <circle cx="0" cy="2" r="9" fill="#F7FAFC"/>
    <!-- Stepping/reaching arm towards the center/ball -->
    <path d="M-8,18 C-15,18 -20,15 -28,12" fill="none" stroke="#F7FAFC" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Joining Arrow / Path indicating "Entry / Integration" into the group -->
  <g transform="translate(120, 55)">
    <!-- Curved entry path arrow pointing downward into the team space -->
    <path d="M-40,-10 C-40,-25 40,-25 40,-10" fill="none" stroke="#FF8C00" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M0,-15 L0,5 M-6,-1 L0,6 L6,-1" fill="none" stroke="#FF8C00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top accent focal badge representing addition/joining concept cleanly -->
  <circle cx="120" cy="40" r="16" fill="#FF8C00"/>
  <path d="M120,32 V48 M112,40 H128" fill="none" stroke="#1A1D24" stroke-width="3.5" stroke-linecap="round"/>

</svg>