<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow & Depth Elements -->
  <circle cx="120" cy="120" r="90" fill="#252A34" opacity="0.5"/>

  <!-- Visual Contrast (Adjective/State Rule): Ancient/Untouched Nature vs Structured Geometry -->
  <!-- Left Side: Untouched, Massive, Organic "原始" (Primal/Primitive) Forest -->
  <g id="primal-forest">
    <!-- Massive Organic Ancient Tree Trunk -->
    <path d="M 65 190 Q 70 140 60 100 Q 55 80 50 70 L 85 70 Q 88 90 90 110 Q 95 150 95 190 Z" fill="#8B5A2B"/>
    <!-- Deep bark texture lines -->
    <path d="M 68 110 Q 75 130 72 160" stroke="#5C3A21" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 78 95 Q 82 130 80 170" stroke="#5C3A21" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Lush, Dense, Overgrown Canopy (Scale Exaggeration) -->
    <circle cx="50" cy="75" r="32" fill="#2E6F40"/>
    <circle cx="85" cy="65" r="38" fill="#388E3C"/>
    <circle cx="70" cy="45" r="30" fill="#4CAF50"/>

    <!-- Secondary Primitive Ferns / Ground Flora -->
    <path d="M 40 190 Q 45 170 55 190 Z" fill="#4CAF50"/>
    <path d="M 90 190 Q 100 165 110 190 Z" fill="#2E6F40"/>
    <path d="M 25 190 C 30 175 40 175 45 190 Z" fill="#66BB6A"/>
  </g>

  <!-- Right Side: Clean, Modern, Geometric Contrast (To highlight the "Primal" wildness by contrast) -->
  <g id="modern-contrast" opacity="0.25">
    <!-- Clean architectural grid lines / subtle geometric structures in background -->
    <line x1="170" y1="70" x2="170" y2="190" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="200" y1="100" x2="200" y2="190" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="155" y="130" width="60" height="60" fill="none" stroke="#00E5FF" stroke-width="1" rx="4"/>
  </g>

  <!-- Focus Elements: Glowing Fireflies / Magic of Untouched Wilderness (Accent Color: Gold/Orange) -->
  <g id="primal-accents">
    <circle cx="55" cy="110" r="3.5" fill="#FFB703"/>
    <circle cx="95" cy="90" r="2.5" fill="#FFB703"/>
    <circle cx="40" cy="140" r="2" fill="#FFB703"/>
    <circle cx="75" cy="130" r="4" fill="#FB8500"/>
    <!-- Subtle divine ray filtering through the ancient canopy -->
    <path d="M 50 45 L 30 190 L 45 190 L 70 45 Z" fill="#FFB703" opacity="0.08"/>
  </g>

  <!-- Ground Line -->
  <path d="M 20 190 L 220 190" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
</svg>