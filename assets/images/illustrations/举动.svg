<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Office Environment -->
  <rect x="30" y="120" width="180" height="80" rx="4" fill="#334155"/>
  <rect x="40" y="130" width="160" height="60" rx="2" fill="#1e293b"/>
  
  <!-- Suspicious Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fb923c"/>
    <path d="M10 25 Q20 35 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
    <rect x="5" y="40" width="30" height="80" rx="5" fill="#fb923c"/>
    <path d="M5 50 L-10 70 M35 50 L50 70" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- The suspicious action: hiding a folder -->
    <rect x="-20" y="55" width="25" height="35" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Observing Character -->
  <g transform="translate(50, 100)">
    <circle cx="20" cy="20" r="20" fill="#38bdf8"/>
    <path d="M10 25 Q20 30 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
    <!-- Eyebrow raised in suspicion -->
    <path d="M8 10 L16 8 M24 8 L32 10" stroke="#0f172a" stroke-width="2"/>
    <rect x="5" y="40" width="30" height="80" rx="5" fill="#38bdf8"/>
  </g>
  
  <!-- Question mark glow -->
  <path d="M110 50 Q125 30 140 50 T140 80" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="140" cy="95" r="4" fill="#f59e0b"/>
</svg>