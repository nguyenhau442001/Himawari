<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements for depth in dark mode -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>

  <!-- Character / Object representing "不以为然" (dismissive, skeptical posture with head turned away and slight smirk/dismissive hand wave) -->
  <g transform="translate(0, 10)">
    <!-- Shoulders and Body -->
    <path d="M 70 175 C 70 145, 95 135, 120 135 C 145 135, 170 145, 170 175 L 185 200 C 185 205, 180 210, 175 210 L 65 210 C 60 210, 55 205, 55 200 Z" fill="#2E3648"/>
    <path d="M 90 155 L 120 175 L 150 155" fill="none" stroke="#636E85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="110" y="115" width="20" height="30" rx="6" fill="#F4B89C"/>

    <!-- Head (Tilted backward/sideways in a dismissive posture) -->
    <circle cx="125" cy="95" r="35" fill="#F4B89C"/>

    <!-- Hair (Sleek modern style) -->
    <path d="M 93 90 C 93 65, 115 60, 135 62 C 155 64, 158 85, 158 100 L 150 100 C 150 80, 140 70, 125 70 C 105 70, 100 85, 100 95 Z" fill="#3D4451"/>

    <!-- Facial Expression: Dismissive / Skeptical Eyes (Closed, half-moon lines looking away) -->
    <path d="M 115 90 C 120 86, 128 86, 133 90" fill="none" stroke="#2E3648" stroke-width="3" stroke-linecap="round"/>
    <path d="M 138 90 C 143 86, 150 86, 155 90" fill="none" stroke="#2E3648" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyebrows (Raised skeptically) -->
    <path d="M 113 81 C 120 78, 128 79, 133 83" fill="none" stroke="#3D4451" stroke-width="3" stroke-linecap="round"/>
    <path d="M 137 83 C 143 79, 150 78, 157 81" fill="none" stroke="#3D4451" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 148 98 C 152 98, 153 104, 149 106" fill="none" stroke="#E09F7D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Mouth (Smirk / Turning down slightly, dismissive curl) -->
    <path d="M 134 115 C 140 112, 148 114, 152 118" fill="none" stroke="#D16D5B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Hand dismissing (Waving off gesture near the chin/face) -->
    <path d="M 155 135 C 165 130, 175 140, 170 150 C 168 155, 160 155, 155 150" fill="#F4B89C"/>
    <path d="M 160 133 L 175 125" stroke="#F4B89C" stroke-width="6" stroke-linecap="round"/>

    <!-- Focus / Accent elements (Highlighting the attitude of disbelief/dismissal) -->
    <path d="M 85 75 L 75 70" fill="none" stroke="#E67E22" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 90 L 68 88" fill="none" stroke="#E67E22" stroke-width="3" stroke-linecap="round"/>
    <path d="M 85 105 L 75 110" fill="none" stroke="#E67E22" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>