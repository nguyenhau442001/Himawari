<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Floor line representing the timeline/ground -->
    <path d="M40 180 L200 180" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- Left side (Past/Darker, faded tone) representing "过去" (The Past) -->
    <!-- Old-style Beijing Hutong traditional gateway / architectural silhouette -->
    <g opacity="0.4">
      <!-- Roof structure -->
      <path d="M55 125 L95 125 L102 110 L48 110 Z" fill="#6B7280"/>
      <path d="M42 125 L108 125 L112 130 L38 130 Z" fill="#4B5563"/>
      <!-- Wall structure -->
      <rect x="48" y="130" width="52" height="50" fill="#374151"/>
      <!-- Traditional Chinese door -->
      <path d="M62 145 C62 138 78 138 78 145 L78 180 L62 180 Z" fill="#1F2937"/>
      <!-- Glowing vintage lantern -->
      <circle cx="50" cy="140" r="5" fill="#F59E0B" opacity="0.8"/>
      <line x1="50" y1="130" x2="50" y2="135" stroke="#9CA3AF" stroke-width="1.5"/>
    </g>

    <!-- Center/Right transition / Focus: Iconic physical object representing a remembered place in the past -->
    <!-- Vintage suitcase with travel elements suggesting "Living in Beijing in the past" (matches context: 过去我住在北京) -->
    <g transform="translate(100, 100)">
      <!-- Suitcase Shadow -->
      <ellipse cx="20" cy="83" rx="35" ry="5" fill="#111827"/>
      
      <!-- Suitcase Body (Warm retro leather brown) -->
      <rect x="-2" y="30" width="44" height="30" rx="4" fill="#D97706"/>
      <rect x="-6" y="38" width="52" height="38" rx="6" fill="#B45309"/>
      
      <!-- Suitcase Straps & Details -->
      <rect x="8" y="38" width="6" height="38" fill="#78350F"/>
      <rect x="26" y="38" width="6" height="38" fill="#78350F"/>
      <rect x="-2" y="52" width="48" height="4" fill="#78350F"/>
      
      <!-- Handle -->
      <path d="M12 30 C12 24 28 24 28 30" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Brass Clasps -->
      <rect x="9" y="36" width="4" height="4" rx="1" fill="#FBBF24"/>
      <rect x="27" y="36" width="4" height="4" rx="1" fill="#FBBF24"/>

      <!-- Subtle architectural token resting on suitcase (Traditional Chinese roof tile silhouette pendant/stamp) -->
      <path d="M14 46 L26 46 L23 52 L17 52 Z" fill="#FCD34D"/>
    </g>

    <!-- Flow arrow pointing from past to present (left to right, curved upward) -->
    <path d="M 75 115 C 95 90, 125 90, 145 115" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.8"/>
    <path d="M 141 108 L 148 116 L 139 119" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sparkle / Memory indicator -->
    <path d="M 70 85 L 73 93 L 81 96 L 73 99 L 70 107 L 67 99 L 59 96 L 67 93 Z" fill="#F59E0B" opacity="0.6"/>
    <path d="M 165 135 L 167 140 L 172 142 L 167 144 L 165 149 L 163 144 L 158 142 L 163 140 Z" fill="#60A5FA" opacity="0.5"/>
  </g>
</svg>