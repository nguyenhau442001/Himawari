<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight for Volunteers -->
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character 1 Shirt Gradient (New Volunteer) -->
    <linearGradient id="shirt-new" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character Shirt Gradients (Group Volunteers) -->
    <linearGradient id="shirt-vol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Table & Equipment Gradients -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Context: Community Park / Donation Station Background Elements -->
  <g id="background-environment">
    <!-- Park Trees / Foliage silhouettes -->
    <path d="M20 160 Q35 120 50 160 Z" fill="#334155" opacity="0.4" />
    <path d="M35 150 Q50 100 65 150 Z" fill="#475569" opacity="0.3" />
    <path d="M190 170 Q210 110 230 170 Z" fill="#334155" opacity="0.4" />
    
    <!-- Canopy String Lights -->
    <path d="M0 50 Q 60 70 120 50 T 240 60" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="40" cy="58" r="3" fill="#fbbf24" />
    <circle cx="90" cy="55" r="3" fill="#fbbf24" />
    <circle cx="150" cy="52" r="3" fill="#fbbf24" />
    <circle cx="200" cy="58" r="3" fill="#fbbf24" />

    <!-- Ambient Glow from Canopy -->
    <ellipse cx="120" cy="60" rx="100" ry="40" fill="url(#spotlight)" />
  </g>

  <!-- Setup Booth / Donation Table -->
  <g id="booth-setup" transform="translate(15, 135)">
    <!-- Table Body -->
    <rect x="0" y="25" width="120" height="40" rx="4" fill="url(#table-grad)" />
    <rect x="-5" y="20" width="130" height="8" rx="2" fill="#64748b" />
    <!-- Relief Box / Supply Boxes on Table -->
    <rect x="15" y="5" width="25" height="20" rx="2" fill="#fb923c" />
    <rect x="45" y="8" width="20" height="15" rx="2" fill="#ec4899" />
    <!-- Volunteer Vest / Badge prop on table -->
    <path d="M85 10 L95 10 L98 25 L82 25 Z" fill="#10b981" />
  </g>

  <!-- HANG LIE (The Row / Queue of Volunteers) -->
  <!-- Volunteer 3 (Back of the queue) -->
  <g id="volunteer-3" transform="translate(195, 105)">
    <!-- Body & Vest -->
    <path d="M-8 40 L8 40 L12 75 L-12 75 Z" fill="#059669" />
    <rect x="-10" y="38" width="20" height="15" rx="3" fill="#10b981" />
    <!-- Head & Hair -->
    <circle cx="0" cy="20" r="10" fill="#fbcfe8" />
    <path d="M-9 15 Q0 10 9 15 L10 22 L-10 22 Z" fill="#475569" />
    <!-- Arm raised joining the line -->
    <path d="M-8 45 Q-20 30 -15 25" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Volunteer 2 (Middle of the queue) -->
  <g id="volunteer-2" transform="translate(160, 100)">
    <!-- Body & Vest -->
    <path d="M-10 42 L10 42 L14 80 L-14 80 Z" fill="#059669" />
    <rect x="-12" y="40" width="24" height="16" rx="3" fill="#10b981" />
    <!-- Head & Hair -->
    <circle cx="0" cy="20" r="11" fill="#fed7aa" />
    <path d="M-11 15 Q0 8 11 15 L11 22 L-11 22 Z" fill="#334155" />
    <!-- Arms -->
    <path d="M10 48 L20 58" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Volunteer 1 (Front of the queue, standing beside organizer) -->
  <g id="volunteer-1" transform="translate(125, 95)">
    <!-- Body -->
    <path d="M-10 45 L10 45 L15 85 L-15 85 Z" fill="#059669" />
    <rect x="-12" y="43" width="24" height="18" rx="3" fill="#10b981" />
    <!-- Head & Face -->
    <circle cx="0" cy="22" r="11" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M-11 16 Q0 8 11 16 Q12 24 8 26 L-8 26 Q-12 24 -11 16" fill="#1e293b" />
    <!-- Friendly Expression (Facing slightly left) -->
    <circle cx="-3" cy="22" r="1.5" fill="#1e293b" />
    <path d="M-5 27 Q -2 30 1 27" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Arms -->
    <path d="M-10 50 L-20 60" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: The Protagonist stepping into the ranks / joining the queue ("他加入了志愿者的行列") -->
  <g id="main-character-joining" transform="translate(75, 85)">
    <!-- Motion / Action Flow Lines indicating stepping into the row -->
    <path d="M-25 50 Q -10 45 0 50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
    <path d="M-20 70 Q -10 65 -5 70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />

    <!-- Legs & Walking Stance -->
    <!-- Back Leg -->
    <path d="M-5 75 L-12 110" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <!-- Front Leg (Stepping forward dynamically into alignment) -->
    <path d="M5 75 L15 110" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <path d="M12 110 L22 112" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

    <!-- Torso (Leaning slightly forward with enthusiasm) -->
    <g transform="rotate(-10)">
      <!-- Shirt (Distinct blue to highlight 'he' joining the green volunteer ranks) -->
      <path d="M-12 35 L12 35 L16 75 L-16 75 Z" fill="url(#shirt-new)" />
      
      <!-- Volunteer Sash / Stole being put on as symbol of joining -->
      <path d="M-10 35 L15 75 L10 75 L-14 35 Z" fill="#fbbf24" opacity="0.9" />

      <!-- Head & Welcoming Expression -->
      <circle cx="0" cy="15" r="12" fill="#fed7aa" />
      <!-- Stylish Hair -->
      <path d="M-12 12 Q -2 -1 12 10 Q 13 18 8 20 L -8 20 Q -13 18 -12 12" fill="#0f172a" />
      <!-- Eye (Determined & Happy) -->
      <circle cx="3" cy="15" r="1.5" fill="#1e293b" />
      <!-- Smile -->
      <path d="M1 19 Q 4 23 7 20" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

      <!-- Arms: One raised in greeting/acceptance, one holding a volunteer clipboard -->
      <path d="M10 42 Q 25 35 28 48" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
      <path d="M-10 42 Q -22 55 -15 65" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
      <!-- Clipboard Prop -->
      <rect x="-22" y="60" width="12" height="15" rx="1" fill="#f8fafc" />
      <path d="M-20 63 L-12 63" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M-20 67 L-14 67" stroke="#94a3b8" stroke-width="1.5" />
    </g>
  </g>

  <!-- Foreground Atmospheric Details -->
  <g id="foreground-accents" opacity="0.8">
    <!-- Little grass tufts at the bottom -->
    <path d="M15 225 Q18 215 22 225" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M25 227 Q28 218 31 227" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M210 226 Q214 216 218 226" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>