<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Interior -->
  <path d="M20 180 L220 180 L220 200 C220 211 211 220 200 220 L40 220 C29 220 20 211 20 200 Z" fill="#334155"/>
  
  <!-- Parents (Seated on sofa) -->
  <g transform="translate(40, 120)">
    <circle cx="30" cy="30" r="15" fill="#fde68a"/>
    <path d="M15 50 Q30 70 45 50" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <rect x="15" y="60" width="30" height="40" rx="5" fill="#64748b"/>
    
    <circle cx="80" cy="35" r="15" fill="#fde68a"/>
    <path d="M65 55 Q80 75 95 55" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <rect x="65" y="65" width="30" height="35" rx="5" fill="#475569"/>
  </g>

  <!-- Young Adult (The child) -->
  <g transform="translate(140, 100)">
    <circle cx="30" cy="30" r="18" fill="#fde68a"/>
    <path d="M15 50 Q30 75 45 50" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <path d="M10 80 L50 80 L45 130 L15 130 Z" fill="#38bdf8"/>
    <path d="M20 130 L20 150 L30 150 L30 130" fill="#38bdf8"/>
    <path d="M40 130 L40 150 L50 150 L50 130" fill="#38bdf8"/>
  </g>

  <!-- The Gift (Symbolizing "Repayment/Gratitude") -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#fb923c"/>
    <rect x="12" y="0" width="6" height="30" fill="#fef3c7"/>
    <rect x="0" y="12" width="30" height="6" fill="#fef3c7"/>
    <path d="M5 -5 Q15 -15 25 -5" stroke="#ec4899" stroke-width="4" fill="none"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="180" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="40" r="2" fill="#fbbf24"/>
  <circle cx="210" cy="70" r="4" fill="#fbbf24"/>
  
  <!-- Warm glow overlay -->
  <ellipse cx="120" cy="120" rx="100" ry="80" fill="#f59e0b" opacity="0.05"/>
</svg>