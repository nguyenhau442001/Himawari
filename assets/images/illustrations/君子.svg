<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment: A park setting with a bench -->
  <path d="M40 180 L200 180 L200 210 L40 210 Z" fill="#334155"/>
  <path d="M60 180 L60 150 L180 150 L180 180" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The "Junzi" character: Helping an elderly person -->
  <!-- Elderly person -->
  <circle cx="80" cy="130" r="12" fill="#fbbf24"/>
  <path d="M70 140 L90 140 L80 170 Z" fill="#64748b"/>
  <path d="M75 160 L65 180" stroke="#94a3b8" stroke-width="3"/>
  
  <!-- The Junzi (Subject) -->
  <g transform="translate(140, 100)">
    <circle cx="0" cy="0" r="14" fill="#fb923c"/>
    <path d="M-15 15 L15 15 L10 60 L-10 60 Z" fill="#38bdf8"/>
    <path d="M-5 60 L-5 100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 60 L5 100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M-20 20 L-40 40" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 20 L40 10" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <!-- Gesture of kindness: holding a dropped bag -->
    <rect x="25" y="5" width="20" height="25" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Decorative elements: Tree and light -->
  <path d="M20 150 C 10 100, 30 80, 20 50" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <circle cx="20" cy="45" r="15" fill="#10b981" opacity="0.6"/>
  <circle cx="220" cy="40" r="20" fill="#f59e0b" opacity="0.2"/>
  <circle cx="220" cy="40" r="10" fill="#f59e0b"/>
</svg>