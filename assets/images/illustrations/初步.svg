<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Glass/Window Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- BACKGROUND ARCHITECTURE / OFFICE INTERIOR -->
  <!-- Wall panels and windows -->
  <path d="M0 0 H240 V150 H0 Z" fill="#162032" />
  <line x1="0" y1="150" x2="240" y2="150" stroke="#334155" stroke-width="2" />
  
  <!-- Large Office Window showing city lights at night -->
  <rect x="140" y="25" href="#" width="75" height="100" rx="4" fill="url(#glassGrad)" stroke="#334155" stroke-width="1.5" />
  <!-- City skyline silhouettes through window -->
  <path d="M148 125 V95 H156 V125 M160 125 V75 H172 V125 M176 125 V105 H190 V125 M194 125 V60 H207 V125" fill="#1e293b" />
  <!-- Window mullions -->
  <line x1="177" y1="25" x2="177" y2="125" stroke="#334155" stroke-width="1.5" />
  <line x1="140" y1="75" x2="215" y2="75" stroke="#334155" stroke-width="1.5" />

  <!-- Indoor Ambient Light (Warm Desk Lamp Beam) -->
  <circle cx="105" cy="40" r="60" fill="url(#lampGlow)" />
  <path d="M95 10 L115 10 L135 150 H75 Z" fill="#fbbf24" opacity="0.05" />

  <!-- Bookshelf / Plant in background -->
  <rect x="20" y="50" width="30" height="70" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="75" x2="50" y2="75" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="100" x2="50" y2="100" stroke="#334155" stroke-width="1" />
  <!-- Plant pot -->
  <path d="M28 72 H42 L40 64 H30 Z" fill="#10b981" />
  <circle cx="35" cy="61" r="6" fill="#059669" />

  <!-- MAIN FURNITURE: MEETING DESK -->
  <!-- Wooden Tabletop -->
  <path d="M20 155 H220 L210 185 H30 Z" fill="#334155" filter="url(#shadow)" />
  <!-- Desk front face -->
  <rect x="30" y="185" width="180" height="35" rx="2" fill="#1e293b" />
  <!-- Desk leg highlights -->
  <rect x="45" y="185" width="8" height="35" fill="#0f172a" />
  <rect x="187" y="185" width="8" height="35" fill="#0f172a" />

  <!-- PROPS ON DESK: Draft Agreement, Pens, Coffee Mug -->
  <!-- Coffee Mug -->
  <rect x="45" y="142" width="14" height="16" rx="2" fill="#cbd5e1" />
  <path d="M59 146 C63 146 63 154 59 154" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <ellipse cx="52" cy="142" rx="7" ry="2" fill="#94a3b8" />

  <!-- Preliminary Agreement Document (Centerpiece) -->
  <g transform="translate(90, 135) rotate(-5)" filter="url(#shadow)">
    <!-- Paper base -->
    <rect width="60" height="45" rx="2" fill="#f8fafc" />
    <!-- Header line -->
    <rect x="8" y="8" width="25" height="4" rx="1" fill="#38bdf8" />
    <!-- Text lines representing clauses -->
    <line x1="8" y1="18" x2="52" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="24" x2="45" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="30" x2="35" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    
    <!-- Red Stamp / Seal indicating "Preliminary/Draft" -->
    <circle cx="45" cy="35" r="8" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 1" />
    <path d="M41 35 L44 38 L50 32" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Fountain Pen resting beside agreement -->
  <path d="M75 162 L95 152 L97 155 L77 165 Z" fill="#475569" />
  <path d="M73 163 L76 166 L74 167 Z" fill="#fbbf24" />


  <!-- CHARACTERS: TWO BUSINESS PARTNERS SHAKING HANDS -->
  
  <!-- Character Left (Person A - Teal Shirt) -->
  <g id="character-left">
    <!-- Body / Torso -->
    <path d="M45 190 C45 165 65 160 75 150 L90 170 L85 190 Z" fill="#0d9488" />
    <!-- Collar / Tie -->
    <polygon points="68,155 75,165 82,155" fill="#f8fafc" />
    <polygon points="73,165 75,180 77,165" fill="#f43f5e" />
    
    <!-- Head & Face -->
    <circle cx="75" cy="122" r="14" fill="#fed7aa" />
    <!-- Hair (Dark modern crop) -->
    <path d="M62 122 C62 110 88 110 88 122 C88 118 85 112 75 112 C65 112 62 118 62 122 Z" fill="#334155" />
    <!-- Friendly smiling expression -->
    <path d="M78 124 Q81 127 84 124" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <circle cx="72" cy="120" r="1.5" fill="#1e293b" />

    <!-- Left Arm & Hand reaching for handshake -->
    <path d="M60 165 Q75 160 95 145" stroke="#0d9488" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="98" cy="143" r="5" fill="#fed7aa" />
  </g>

  <!-- Character Right (Person B - Navy/Orange Suit) -->
  <g id="character-right">
    <!-- Body / Torso -->
    <path d="M195 190 C195 165 175 160 165 150 L150 170 L155 190 Z" fill="#1e3a8a" />
    <!-- Inner Shirt & Accent -->
    <polygon points="172,155 165,165 158,155" fill="#f8fafc" />
    <polygon points="163,165 165,180 167,165" fill="#fb923c" />

    <!-- Head & Face -->
    <circle cx="165" cy="122" r="14" fill="#fbcfe8" />
    <!-- Hair (Stylish bun/bob) -->
    <path d="M152 122 C152 110 178 110 178 122 C178 115 172 108 165 108 C158 108 152 115 152 122 Z" fill="#b45309" />
    <!-- Friendly smiling expression -->
    <path d="M146 124 Q149 127 152 124" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <circle cx="158" cy="120" r="1.5" fill="#1e293b" />

    <!-- Right Arm & Hand meeting in the middle for handshake -->
    <path d="M180 165 Q165 160 102 143" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hand shaking intersection -->
    <circle cx="100" cy="143" r="5" fill="#fbcfe8" />
  </g>

  <!-- OVERLAY ACCENTS FOR SUCCESSFUL AGREEMENT (Subtle glowing particles/sparkles) -->
  <g fill="#fbbf24">
    <circle cx="99" cy="130" r="2" opacity="0.9" />
    <circle cx="112" cy="135" r="1.5" opacity="0.7" />
    <circle cx="88" cy="138" r="1" opacity="0.8" />
    <path d="M 105 118 L 107 122 L 111 124 L 107 126 L 105 130 L 103 126 L 99 124 L 103 122 Z" fill="#38bdf8" opacity="0.6" transform="scale(0.5) translate(110, 220)" />
  </g>

</svg>