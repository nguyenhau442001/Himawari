<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 30)">
    <!-- Manual Base / Paper Sheet -->
    <path d="M20,10 L120,10 L140,30 L140,170 C140,178.284 133.284,185 125,185 L20,185 C11.7157,185 5,178.284 5,170 L5,25 C5,16.7157 11.7157,10 20,10 Z" fill="#2D323E"/>
    
    <!-- Folded corner (dog-ear) -->
    <path d="M120,10 L140,30 L120,30 Z" fill="#1A1D24"/>
    <path d="M120,10 L140,30 L120,30 Z" fill="#404656"/>
    <path d="M120,10 L120,30 L140,30 Z" opacity="0.3" fill="#111317"/>

    <!-- Cover Graphic Header (Gear/Setup Icon in flat style) -->
    <circle cx="72" cy="55" r="16" fill="#FFA500" opacity="0.2"/>
    <circle cx="72" cy="55" r="10" fill="none" stroke="#FFA500" stroke-width="3" stroke-dasharray="4 2"/>
    <circle cx="72" cy="55" r="4" fill="#FFA500"/>

    <!-- Document Content Lines (Abstract instructions) -->
    <rect x="25" y="85" width="94" height="6" rx="3" fill="#606A7B"/>
    
    <!-- Step 1 Icon & Lines -->
    <circle cx="32" cy="113" r="6" fill="#FFA500"/>
    <text x="32" y="116" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1A1D24" text-anchor="middle">1</text>
    <rect x="46" y="110" width="73" height="5" rx="2.5" fill="#404656"/>

    <!-- Step 2 Icon & Lines -->
    <circle cx="32" cy="135" r="6" fill="#FFA500"/>
    <text x="32" y="138" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1A1D24" text-anchor="middle">2</text>
    <rect x="46" y="132" width="60" height="5" rx="2.5" fill="#404656"/>

    <!-- Step 3 Icon & Lines -->
    <circle cx="32" cy="157" r="6" fill="#FFA500"/>
    <text x="32" y="160" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1A1D24" text-anchor="middle">3</text>
    <rect x="46" y="154" width="73" height="5" rx="2.5" fill="#404656"/>

    <!-- Magnifying glass highlighting the instructions (Focus/Reading aspect) -->
    <g transform="translate(85, 95)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#FFA500" stroke-width="6"/>
      <circle cx="28" cy="28" r="20" fill="#FFA500" fill-opacity="0.15"/>
      <line x1="13" y1="43" x2="-2" y2="58" stroke="#FFA500" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>