<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Museum Building representing the "Container" of all things -->
  <path d="M60 180 L180 180 L180 100 L120 70 L60 100 Z" fill="#2D343E" stroke="#FFB84D" stroke-width="2"/>
  <rect x="75" y="110" width="30" height="70" fill="#3D4754"/>
  <rect x="135" y="110" width="30" height="70" fill="#3D4754"/>
  
  <!-- Representing "Wan Xiang" (Ten Thousand Things) inside the museum -->
  <!-- A collection of diverse icons representing nature, history, and science -->
  
  <!-- Celestial/Nature (Sun/Moon) -->
  <circle cx="90" cy="130" r="8" fill="#FFB84D"/>
  
  <!-- Ancient Artifact (Vase) -->
  <path d="M150 130 C150 120, 160 120, 160 130 L160 150 C160 160, 150 160, 150 150 Z" fill="#A8B1C0"/>
  
  <!-- Plant/Life -->
  <path d="M120 160 C120 150, 125 145, 130 145 C135 145, 140 150, 140 160" stroke="#66D9EF" stroke-width="3" fill="none"/>
  
  <!-- Book/Knowledge -->
  <rect x="80" y="150" width="20" height="15" fill="#FF8C00"/>
  <line x1="85" y1="153" x2="95" y2="153" stroke="#1A1D24" stroke-width="1"/>
  <line x1="85" y1="157" x2="95" y2="157" stroke="#1A1D24" stroke-width="1"/>
  
  <!-- Star/Galaxy -->
  <path d="M140 110 L143 118 L151 118 L144 123 L147 131 L140 126 L133 131 L136 123 L129 118 L137 118 Z" fill="#FFB84D"/>
  
  <!-- Geometric Shape (Crystal/Mineral) -->
  <polygon points="110,120 120,115 130,120 120,135" fill="#66D9EF"/>
</svg>