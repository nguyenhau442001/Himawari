<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Modern Office Environment -->
  <rect x="20" y="30" width="200" height="150" rx="6" fill="#1e293b"/>
  <!-- Window view background -->
  <path d="M160 45 L200 45 L200 95 L160 95 Z" fill="#0284c7" opacity="0.2"/>
  <path d="M165 50 L195 50 L195 90 L165 90 Z" fill="#38bdf8" opacity="0.15"/>
  <line x1="180" y1="45" x2="180" y2="95" stroke="#0f172a" stroke-width="2"/>
  <line x1="160" y1="70" x2="200" y2="70" stroke="#0f172a" stroke-width="2"/>

  <!-- Bookshelf / Plants in background -->
  <rect x="30" y="50" width="25" height="40" rx="2" fill="#334155"/>
  <path d="M35 60 C35 55 40 55 45 60" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Office Desk -->
  <path d="M40 145 L200 145 L190 185 L50 185 Z" fill="#334155"/>
  <rect x="35" y="140" width="170" height="8" rx="2" fill="#475569"/>

  <!-- Desk props -->
  <!-- Laptop -->
  <path d="M65 135 L95 135 L100 144 L60 144 Z" fill="#94a3b8"/>
  <path d="M68 122 L92 122 L95 135 L65 135 Z" fill="#cbd5e1"/>
  <!-- Coffee Mug -->
  <rect x="110" y="128" width="12" height="15" rx="2" fill="#f8fafc"/>
  <path d="M122 132 C126 132 126 139 122 139" stroke="#f8fafc" stroke-width="2" fill="none"/>

  <!-- Character 1 (Employee - Junior, pointing/asking) -->
  <g transform="translate(10, 15)">
    <!-- Body & Shirt -->
    <path d="M45 135 C45 120 55 110 70 110 C85 110 95 120 95 135 L95 160 L45 160 Z" fill="#38bdf8"/>
    <!-- Tie -->
    <polygon points="68,110 72,110 74,130 70,140 66,130" fill="#0284c7"/>
    <!-- Head & Hair -->
    <circle cx="70" cy="90" r="15" fill="#fbcfe8"/>
    <path d="M55 90 C55 75 85 75 85 90 C85 95 80 90 70 85 C60 90 55 95 55 90 Z" fill="#334155"/>
    <!-- Pointing Arm reaching forward with document -->
    <path d="M80 120 C95 115 115 115 125 110" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Document / Folder being shown -->
    <path d="M110 100 L135 105 L130 130 L105 125 Z" fill="#ffffff"/>
    <line x1="115" y1="108" x2="125" y2="110" stroke="#94a3b8" stroke-width="2"/>
    <line x1="115" y1="115" x2="128" y2="117" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Character 2 (Leader - Senior, listening thoughtfully) -->
  <g transform="translate(70, 0)">
    <!-- Chair back -->
    <path d="M110 80 L140 80 L145 160 L105 160 Z" fill="#1e293b"/>
    <rect x="115" y="85" width="20" height="65" rx="4" fill="#334155"/>

    <!-- Body & Suit -->
    <path d="M95 150 C95 130 110 120 125 120 C140 120 155 130 155 150 L155 180 L95 180 Z" fill="#475569"/>
    <!-- Inner Shirt & Collar -->
    <path d="M115 120 L135 120 L130 135 L120 135 Z" fill="#f8fafc"/>
    <!-- Golden Badge / Accent on Leader -->
    <circle cx="118" cy="132" r="3" fill="#f59e0b"/>

    <!-- Head & Hair (Leader) -->
    <circle cx="125" cy="100" r="16" fill="#fbcfe8"/>
    <path d="M110 95 C110 80 140 80 140 95 C135 93 115 93 110 95 Z" fill="#1e293b"/>
    
    <!-- Thoughtful hand on chin pose -->
    <path d="M115 130 C110 125 115 110 122 112" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Expressive Eyebrows (Nodding / Approving or Listening) -->
    <line x1="117" y1="94" x2="123" y2="96" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="127" y1="96" x2="133" y2="94" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Warm Overhead Desk Lamp Lighting Glow -->
  <path d="M0 0 L240 0 L240 60 L120 140 L0 60 Z" fill="#fbbf24" opacity="0.04" style="pointer-events: none;"/>
</svg>