<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Glow for Modern Dark Theme -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>
  
  <!-- Scale of Justice / Legal Framework (Representing "法" - Law) -->
  <!-- Base Stand -->
  <rect x="114" y="145" width="12" height="45" rx="3" fill="#64748B"/>
  <rect x="94" y="190" width="52" height="10" rx="4" fill="#94A3B8"/>
  <rect x="117" y="60" width="6" height="90" fill="#64748B"/>
  
  <!-- Top Beam -->
  <rect x="70" y="60" width="100" height="8" rx="4" fill="#F59E0B"/>
  <circle cx="120" cy="64" r="7" fill="#FBBF24"/>
  
  <!-- Left Scale Pan -->
  <line x1="74" y1="68" x2="55" y2="115" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="68" x2="93" y2="115" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="68" x2="74" y2="105" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 115 Q 74 135 98 115 Z" fill="#3B82F6" opacity="0.9"/>
  <path d="M 50 115 Q 74 135 98 115 Q 74 123 50 115" fill="#60A5FA"/>

  <!-- Right Scale Pan -->
  <line x1="166" y1="68" x2="147" y2="115" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="166" y1="68" x2="185" y2="115" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="166" y1="68" x2="166" y2="105" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 142 115 Q 166 135 190 115 Z" fill="#3B82F6" opacity="0.9"/>
  <path d="M 142 115 Q 166 135 190 115 Q 166 123 142 115" fill="#60A5FA"/>

  <!-- Legal Document / Constitution (Representing "定" - Stipulated/Fixed by law) -->
  <g transform="translate(85, 80)">
    <!-- Document background -->
    <rect x="-15" y="-35" width="50" height="64" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-10" y="-27" width="25" height="4" rx="2" fill="#334155"/>
    <rect x="-10" y="-17" width="40" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="-10" y="-10" width="35" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="-10" y="-3" width="38" height="3" rx="1.5" fill="#94A3B8"/>
    
    <!-- Official Red Wax Seal (Stamp of official legal enactment) -->
    <circle cx="10" cy="15" r="8" fill="#EF4444"/>
    <path d="M 7 15 L 9 17 L 14 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Accent Sparkles for Clarity & Focus -->
  <path d="M 195 55 L 198 62 L 205 65 L 198 68 L 195 75 L 192 68 L 185 65 L 192 62 Z" fill="#FBBF24"/>
  <path d="M 45 75 L 47 80 L 52 82 L 47 84 L 45 89 L 43 84 L 38 82 L 43 80 Z" fill="#60A5FA" opacity="0.8"/>
