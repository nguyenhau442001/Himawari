<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Hoodie/Jacket Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Accent Glow Gradient for Determination -->
    <radialGradient id="focusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Motion lines or tension lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements: Gym/Room Interior Context -->
  <!-- Back Wall Details -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" opacity="0.5"/>
  <rect x="30" y="40" width="60" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.6"/>
  <circle cx="60" cy="85" r="15" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Motivational ambient glow behind character -->
  <circle cx="120" cy="110" r="80" fill="url(#focusGlow)"/>

  <!-- Character Body & Environment Context -->
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="210" rx="65" ry="12" fill="#0b0f19" opacity="0.8"/>

  <!-- Character Torso & Shoulders (Determined Pose) -->
  <!-- Back arm -->
  <path d="M95 130 L70 165 L85 175" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Torso (Hoodie) -->
  <path d="M85 115 C85 115 95 105 120 105 C145 105 155 115 155 115 L165 190 C165 195 160 200 155 200 L85 200 C80 200 75 195 75 190 Z" fill="url(#hoodieGrad)"/>
  
  <!-- Hoodie Strings & Detail -->
  <path d="M110 115 L110 145" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 115 L130 145" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 105 C100 95 140 95 140 105 L155 135 C155 135 135 125 120 125 C105 125 85 135 85 135 Z" fill="#0369a1"/>

  <!-- Neck & Head -->
  <path d="M110 100 L110 85 C110 85 115 80 120 80 C125 80 130 85 130 85 L130 100 Z" fill="url(#skinGrad)"/>
  
  <!-- Head -->
  <circle cx="120" cy="68" r="24" fill="url(#skinGrad)"/>
  
  <!-- Hair (Stylized Modern Cut) -->
  <path d="M96 70 C96 52 110 44 125 44 C140 44 146 55 146 65 C146 65 144 72 142 70 C140 68 138 60 130 58 C122 56 108 60 102 68 C98 73 96 70 96 70 Z" fill="#0f172a"/>
  
  <!-- Facial Expression (Determined, Focused) -->
  <!-- Eyebrows (Slanted down in determination) -->
  <path d="M106 63 L116 66" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M134 63 L124 66" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes (Determined dots/lines) -->
  <circle cx="111" cy="70" r="2.5" fill="#0f172a"/>
  <circle cx="129" cy="70" r="2.5" fill="#0f172a"/>
  <!-- Mouth (Firm line) -->
  <path d="M115 80 L125 80" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- FRONT ARMS & THE FOCUSED TARGET: THE TIGHT FISTS (拳头 - quántou) -->
  <!-- Left Arm holding tight (Viewer's left, Character's right) -->
  <path d="M85 120 L55 145 L75 165" fill="none" stroke="url(#hoodieGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Fist (Tight Clenched) -->
  <g transform="translate(68, 160)">
    <circle cx="0" cy="0" r="12" fill="url(#skinGrad)" filter="url(#glow)"/>
    <!-- Knuckle details showing tension -->
    <circle cx="-4" cy="-4" r="4" fill="#fbbf24" opacity="0.3"/>
    <path d="M-6 4 L6 4" stroke="#c2410c" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <path d="M-8 -1 L4 -3" stroke="#c2410c" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Right Arm clenching tight (Viewer's right, Character's left) - Hero Element -->
  <path d="M155 120 L185 145 L165 165" fill="none" stroke="url(#hoodieGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Fist (Extremely Tight Clenched - Main Visual Focus) -->
  <g transform="translate(172, 160)">
    <!-- Energy/Tension aura around the fist -->
    <circle cx="0" cy="0" r="16" fill="#f59e0b" opacity="0.25"/>
    <!-- Main fist mass -->
    <circle cx="0" cy="0" r="13" fill="url(#skinGrad)"/>
    <!-- Knuckles & Finger tight lines -->
    <path d="M-5 -6 C-2 -8 4 -6 6 -3" stroke="#ea580c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-6 -1 C-1 -3 5 -1 7 2" stroke="#ea580c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-5 4 C0 3 4 5 5 7" stroke="#ea580c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Thumb pressed tightly across -->
    <path d="M-7 -2 C-8 3 -3 6 1 4" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="1"/>
  </g>

  <!-- Dynamic Accent Sparks (Representing intense strength, willpower, or focus) -->
  <path d="M195 140 L202 135" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M200 155 L210 155" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M45 140 L38 135" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 155 L30 155" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

</svg>