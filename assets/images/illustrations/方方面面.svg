<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow to enhance sleek modern flat design -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="55" fill="none" stroke="#2A2F3D" stroke-width="1.5"/>

  <!-- Connecting lines representing multiple dimensions/aspects radiating from a central focal point -->
  <line x1="120" y1="120" x2="120" y2="50" stroke="#3A4256" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="190" y2="120" stroke="#3A4256" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="120" y2="190" stroke="#3A4256" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="50" y2="120" stroke="#3A4256" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="170" y2="70" stroke="#3A4256" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="70" y2="170" stroke="#3A4256" stroke-width="2" stroke-linecap="round"/>

  <!-- Aspect 1: Housing/Home (Top) -->
  <g transform="translate(105, 35)">
    <circle cx="15" cy="15" r="20" fill="#242B38" stroke="#F59E0B" stroke-width="2"/>
    <path d="M7 16 L15 9 L23 16 V22 H19 V17 H11 V22 H7 Z" fill="#F59E0B"/>
  </g>

  <!-- Aspect 2: Commerce/Shopping (Top-Right) -->
  <g transform="translate(155, 55)">
    <circle cx="15" cy="15" r="20" fill="#242B38" stroke="#3B82F6" stroke-width="2"/>
    <path d="M8 11 H10 L13 18 H20 L22 11 H10" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="21" r="1.5" fill="#3B82F6"/>
    <circle cx="19" cy="21" r="1.5" fill="#3B82F6"/>
  </g>

  <!-- Aspect 3: Education/Growth (Right) -->
  <g transform="translate(175, 105)">
    <circle cx="15" cy="15" r="20" fill="#242B38" stroke="#10B981" stroke-width="2"/>
    <path d="M9 18 L15 14 L21 18 L15 22 Z" fill="#10B981"/>
    <path d="M11 19.5 V23 C11 24 13 25 15 25 C17 25 19 24 19 23 V19.5" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="M21 15.5 V19" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Aspect 4: Health/Medical (Bottom-Right) -->
  <g transform="translate(155, 155)">
    <circle cx="15" cy="15" r="20" fill="#242B38" stroke="#EF4444" stroke-width="2"/>
    <rect x="13.5" y="8" width="3" height="14" rx="1.5" fill="#EF4444"/>
    <rect x="8" y="13.5" width="14" height="3" rx="1.5" fill="#EF4444"/>
  </g>

  <!-- Aspect 5: Work/Career (Bottom-Left) -->
  <g transform="translate(65, 155)">
    <circle cx="15" cy="15" r="20" fill="#242B38" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="8" y="12" width="14" height="10" rx="2" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M11 12 V10 C11 9 12 8 13 8 H17 C18 8 19 9 19 10 V12" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  </g>

  <!-- Aspect 6: Environment/Nature (Left) -->
  <g transform="translate(45, 105)">
    <circle cx="15" cy="15" r="20" fill="#242B38" stroke="#06B6D4" stroke-width="2"/>
    <path d="M15 22 V12 M15 15 C15 12 11 10 9 12 C7 14 10 18 15 18 Z" fill="#06B6D4"/>
    <path d="M15 17 C15 14 19 12 21 14 C23 16 20 20 15 20 Z" fill="#06B6D4"/>
  </g>

  <!-- Central Core Object representing the comprehensive whole (Life / Society / Everyday existence) -->
  <circle cx="120" cy="120" r="24" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="120" cy="120" r="18" fill="#F59E0B"/>
  
  <!-- Central icon: Abstract human/community hub symbol representing all aspects of daily life -->
  <path d="M120 110 C116 110 113 113 113 117 C113 121 116 124 120 124 C124 124 127 121 127 117 C127 113 124 110 120 110 Z" fill="#1A1D24"/>
  <path d="M110 132 C110 128 114 126 120 126 C126 126 130 128 130 132 V134 H110 Z" fill="#1A1D24"/>
</svg>