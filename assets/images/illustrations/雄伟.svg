<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain Range Background -->
  <path d="M0 240 L0 140 L40 100 L80 160 L120 80 L160 140 L200 60 L240 120 L240 240 Z" fill="#2C313C"/>
  <path d="M20 240 L20 160 L60 120 L100 180 L140 110 L180 170 L220 100 L240 130 L240 240 Z" fill="#3A414F"/>
  
  <!-- The Great Wall (Scale exaggeration) -->
  <path d="M0 180 L60 160 L120 175 L180 150 L240 170 L240 190 L180 170 L120 195 L60 180 L0 200 Z" fill="#FFB84D"/>
  
  <!-- Watchtower -->
  <rect x="100" y="130" width="40" height="50" fill="#FFB84D"/>
  <rect x="105" y="115" width="30" height="15" fill="#FFB84D"/>
  
  <!-- Human scale for contrast -->
  <g transform="translate(180, 190)">
    <circle cx="5" cy="-15" r="4" fill="#E0E6ED"/>
    <rect x="3" y="-11" width="4" height="10" fill="#E0E6ED"/>
  </g>
  
  <!-- Atmospheric clouds -->
  <path d="M20 80 Q40 70 60 80 T100 80" stroke="#4A5568" stroke-width="2" fill="none"/>
  <path d="M140 60 Q160 50 180 60 T220 60" stroke="#4A5568" stroke-width="2" fill="none"/>
</svg>