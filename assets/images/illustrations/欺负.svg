<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lockerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- School Hallway Environment -->
  <!-- Back Wall -->
  <rect x="0" y="0" width="240" height="165" fill="#1e293b"/>
  
  <!-- Lockers in Background -->
  <g opacity="0.5">
    <rect x="15" y="30" width="45" height="120" fill="#334155" rx="4"/>
    <line x1="37" y1="30" x2="37" y2="150" stroke="#1e293b" stroke-width="2"/>
    <circle cx="33" cy="85" r="2" fill="#64748b"/>

    <rect x="65" y="30" width="45" height="120" fill="#334155" rx="4"/>
    <line x1="87" y1="30" x2="87" y2="150" stroke="#1e293b" stroke-width="2"/>
    <circle cx="83" cy="85" r="2" fill="#64748b"/>

    <rect x="180" y="30" width="45" height="120" fill="#334155" rx="4"/>
    <line x1="202" y1="30" x2="202" y2="150" stroke="#1e293b" stroke-width="2"/>
    <circle cx="198" cy="85" r="2" fill="#64748b"/>
  </g>

  <!-- Notice Board on Wall -->
  <rect x="125" y="45" width="45" height="35" fill="#475569" rx="2"/>
  <rect x="130" y="50" width="35" height="25" fill="#f8fafc" rx="1"/>
  <line x1="135" y1="56" x2="155" y2="56" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="135" y1="63" x2="150" y2="63" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Floor -->
  <path d="M0 165 L240 165 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <!-- Floor tile lines for perspective -->
  <line x1="0" y1="165" x2="-60" y2="240" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
  <line x1="80" y1="165" x2="40" y2="240" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
  <line x1="160" y1="165" x2="160" y2="240" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
  <line x1="240" y1="165" x2="300" y2="240" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>

  <!-- Dramatic Overhead Light Cone -->
  <polygon points="120,0 40,240 200,240" fill="url(#warmLight)"/>

  <!-- SCENE ELEMENTS / PROPS -->
  <!-- Fallen School Bag and Scattered Books -->
  <g transform="translate(45, 180)" filter="url(#shadow)">
    <!-- Backpack -->
    <path d="M 0 10 Q 0 0 10 0 L 25 0 Q 35 0 35 10 L 35 35 Q 35 45 25 45 L 10 45 Q 0 45 0 35 Z" fill="#3b82f6"/>
    <path d="M 8 15 L 27 15 L 27 38 L 8 38 Z" fill="#1d4ed8" rx="2"/>
    <path d="M 12 0 C 12 -5 23 -5 23 0" fill="none" stroke="#2563eb" stroke-width="3"/>
    
    <!-- Scattered notebook/papers -->
    <g transform="translate(32, 15) rotate(25)">
      <rect x="0" y="0" width="18" height="22" fill="#f8fafc" rx="1"/>
      <line x1="3" y1="4" x2="15" y2="4" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="3" y1="8" x2="15" y2="8" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="3" y1="12" x2="12" y2="12" stroke="#cbd5e1" stroke-width="1"/>
    </g>
    <g transform="translate(-15, 25) rotate(-15)">
      <rect x="0" y="0" width="16" height="20" fill="#f43f5e" rx="1"/>
    </g>
  </g>

  <!-- CHARACTERS -->
  
  <!-- AGGRESSOR 1 (Standing tall, pointing/mocking) -->
  <g id="bully-one" transform="translate(135, 105)" filter="url(#shadow)">
    <!-- Legs -->
    <path d="M 22 55 L 25 95 L 35 95 L 32 55 Z" fill="#334155"/>
    <path d="M 3 55 L -2 90 L 8 92 L 12 55 Z" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="30" cy="95" rx="7" ry="3" fill="#0f172a"/>
    <ellipse cx="2" cy="92" rx="7" ry="3" fill="#0f172a"/>

    <!-- Torso / Hoodie -->
    <path d="M 5 20 L 35 20 L 40 55 L 0 55 Z" fill="#ec4899"/>
    <!-- Hoodie Pocket -->
    <path d="M 10 40 L 30 40 L 27 53 L 13 53 Z" fill="#db2777"/>

    <!-- Right Arm (Akimbo / Hip) -->
    <path d="M 32 25 L 48 40 L 38 48 Z" fill="#ec4899"/>

    <!-- Left Arm (Pointing forward aggressively) -->
    <path d="M 8 22 L -12 35 L -8 40 L 12 28 Z" fill="#ec4899"/>
    <circle cx="-14" cy="36" r="4" fill="#f5d0b1"/>

    <!-- Head & Hair -->
    <circle cx="20" cy="8" r="14" fill="#f5d0b1"/>
    <!-- Spiky Hair -->
    <path d="M 6 5 Q 12 -8 24 -4 Q 32 -6 34 5 Q 36 15 26 15 Q 15 15 6 5 Z" fill="#0f172a"/>

    <!-- Angry Face Expression -->
    <path d="M 12 7 L 18 10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 7 L 29 10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 18 15 Q 21 12 24 15" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- AGGRESSOR 2 (Laughing/Leaning in background) -->
  <g id="bully-two" transform="translate(170, 115)" filter="url(#shadow)">
    <!-- Legs -->
    <path d="M 10 50 L 15 88 L 23 88 L 18 50 Z" fill="#1e293b"/>
    <path d="M -5 50 L -8 85 L 1 87 L 5 50 Z" fill="#1e293b"/>
    <ellipse cx="19" cy="88" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="-2" cy="86" rx="6" ry="3" fill="#0f172a"/>

    <!-- Torso (Jacket) -->
    <path d="M -8 18 L 22 18 L 18 50 L -12 50 Z" fill="#8b5cf6"/>
    <path d="M 0 18 L 5 50" stroke="#6d28d9" stroke-width="3"/>

    <!-- Arms -->
    <path d="M 18 22 L 32 35 L 25 40 L 15 30 Z" fill="#8b5cf6"/>
    
    <!-- Head (Tilted laughing) -->
    <circle cx="8" cy="5" r="12" fill="#f5d0b1"/>
    <path d="M -3 -2 Q 8 -12 18 -4 Q 15 8 2 5 Z" fill="#334155"/> <!-- Cap -->
    <!-- Laughing Face -->
    <path d="M 4 4 L 9 6" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 12 4 L 16 6" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 6 10 Q 10 16 14 10 Z" fill="#0f172a"/> <!-- Open mouth laughing -->
  </g>

  <!-- VICTIM (The boy being bullied, cowering on the ground/against lockers) -->
  <g id="victim" transform="translate(75, 125)" filter="url(#shadow)">
    <!-- Body cowering / sitting / leaning back -->
    <!-- Legs pulled up -->
    <path d="M 15 65 Q 25 55 35 70 L 10 85 Z" fill="#0284c7"/>
    <ellipse cx="37" cy="72" rx="5" ry="3" fill="#334155"/>
    <ellipse cx="8" cy="87" rx="5" ry="3" fill="#334155"/>

    <!-- Torso leaning back -->
    <path d="M 10 30 L 35 45 L 25 70 L 0 55 Z" fill="#38bdf8"/>

    <!-- Arms wrapped around knees / protective -->
    <path d="M 15 45 Q 25 50 32 65 L 22 70 Q 15 55 8 50 Z" fill="#0284c7"/>
    <circle cx="33" cy="67" r="4" fill="#f5d0b1"/> <!-- Hand -->

    <!-- Head ducked down / shoulders hunched -->
    <g transform="translate(12, 22) rotate(-15)">
      <!-- Hair -->
      <path d="M -5 -5 Q 5 -15 15 -5 Q 22 -2 18 8 Q 5 8 -5 3 Z" fill="#334155"/>
      <!-- Face (sad/worried) -->
      <circle cx="8" cy="4" r="11" fill="#f5d0b1"/>
      <!-- Worried Eyes (closed tight in distress) -->
      <path d="M 3 3 L 7 5" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 9 3 L 13 5" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Sad Mouth -->
      <path d="M 7 10 Q 9 8 11 10" stroke="#0f172a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- Sweat drop -->
      <path d="M 16 -2 Q 18 3 16 6 Q 14 3 16 -2 Z" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERIC EFFECTS -->
  <!-- Subtle particle dust in light beam -->
  <circle cx="110" cy="90" r="1.5" fill="#f8fafc" opacity="0.6"/>
  <circle cx="95" cy="140" r="1" fill="#f8fafc" opacity="0.4"/>
  <circle cx="130" cy="180" r="2" fill="#f8fafc" opacity="0.5"/>
  <circle cx="70" cy="110" r="1" fill="#f8fafc" opacity="0.3"/>
</svg>