<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/circle for focus -->
  <circle cx="120" cy="125" r="70" fill="#222733" opacity="0.6"/>

  <!-- RECYCLING BIN / CONTAINER (Bottom Center) -->
  <g id="recycling-bin">
    <!-- Bin Body -->
    <path d="M 85,130 L 95,195 C 95,200 99,204 104,204 L 136,204 C 141,204 145,200 145,195 L 155,130 Z" fill="#2E3646"/>
    <!-- Bin Shading / Highlight -->
    <path d="M 95,130 L 102,195 C 102,198 105,200 108,200 L 120,200 L 120,130 Z" fill="#363F52" opacity="0.5"/>
    
    <!-- Bin Rim -->
    <rect x="78" y="120" width="84" height="12" rx="4" fill="#404B60"/>
    <rect x="82" y="117" width="76" height="4" rx="2" fill="#525E75"/>
    
    <!-- Recycling Arrow Symbol on Bin -->
    <path d="M 120,145 L 125,155 L 115,155 Z" fill="#3E495E"/>
    <path d="M 112,160 Q 120,158 128,162 Q 125,172 120,172 Q 115,172 112,160 Z" fill="none" stroke="#3E495E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FEIPIN (RECYCLABLE WASTE / SCRAP ITEMS) -->
  <!-- Falling / Stacked Scrap Objects representing "废品" (Old books, newspapers, metal cans, cardboard) -->
  
  <!-- Old Newspaper Roll / Stack -->
  <g transform="translate(100, 75) rotate(-15)">
    <rect x="0" y="0" width="50" height="35" rx="4" fill="#8B9BB4"/>
    <rect x="5" y="6" width="40" height="5" rx="2" fill="#D1D9E6"/>
    <rect x="5" y="15" width="30" height="3" rx="1.5" fill="#525E75"/>
    <rect x="5" y="22" width="35" height="3" rx="1.5" fill="#525E75"/>
    <!-- Tie / String -->
    <rect x="23" y="0" width="4" height="35" fill="#E5983B"/>
  </g>

  <!-- Crushed Metal Can -->
  <g transform="translate(135, 100) rotate(25)">
    <ellipse cx="15" cy="10" rx="10" ry="6" fill="#A4B3C6"/>
    <path d="M 5,10 C 2,18 8,25 12,30 C 18,25 22,18 25,10 Z" fill="#7D8D9F"/>
    <!-- Can Accent Label -->
    <path d="M 7,16 C 10,19 20,19 23,16" stroke="#E5983B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="15" cy="30" rx="10" ry="6" fill="#647385"/>
  </g>

  <!-- Cardboard Box (Flattened / Broken) -->
  <g transform="translate(70, 95) rotate(10)">
    <polygon points="10,25 45,15 50,35 15,45" fill="#C28E58"/>
    <polygon points="45,15 65,22 70,42 50,35" fill="#A67746"/>
    <line x1="45" y1="15" x2="50" y2="35" stroke="#7E5630" stroke-width="2"/>
    <line x1="15" y1="20" x2="40" y2="12" stroke="#E2B17C" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Old Broken Book / Magazine -->
  <g transform="translate(115, 55) rotate(40)">
    <!-- Cover -->
    <path d="M 0,0 L 35,10 L 30,35 L -5,25 Z" fill="#E55D5D"/>
    <!-- Pages -->
    <path d="M 3,4 L 33,12 L 28,32 L -2,24 Z" fill="#F0F4F8"/>
    <line x1="12" y1="10" x2="25" y2="14" stroke="#8B9BB4" stroke-width="1.5"/>
    <line x1="10" y1="16" x2="22" y2="20" stroke="#8B9BB4" stroke-width="1.5"/>
  </g>

  <!-- Focus / Eco Indicator Sparkle (Golden accent reflecting recycling/sorting) -->
  <g transform="translate(145, 65)">
    <path d="M 0,-8 C 1,-3 3,-1 8,0 C 3,1 1,3 0,8 C -1,3 -3,1 -8,0 C -3,-1 -1,-3 0,-8 Z" fill="#E5983B"/>
  </g>
  <g transform="translate(75, 125) scale(0.6)">
    <path d="M 0,-8 C 1,-3 3,-1 8,0 C 3,1 1,3 0,8 C -1,3 -3,1 -8,0 C -3,-1 -1,-3 0,-8 Z" fill="#E5983B"/>
  </g>

</svg>