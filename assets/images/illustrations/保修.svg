<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.3"/>

  <!-- Physical Object representing 保修 (Warranty / Guaranteed Repair): A Modern Laptop with a shield/maintenance check badge -->
  <g transform="translate(0, 5)">
    <!-- Laptop Base -->
    <path d="M 60 160 L 180 160 C 185 160, 188 163, 188 167 L 188 170 C 188 173, 185 176, 180 176 L 60 176 C 55 176, 52 173, 52 170 L 52 167 C 52 163, 55 160, 60 160 Z" fill="#4A5568"/>
    <!-- Trackpad area -->
    <rect x="105" y="165" width="30" height="6" rx="2" fill="#2D3748"/>

    <!-- Laptop Screen Casing -->
    <rect x="68" y="70" width="104" height="85" rx="8" fill="#2D3748" stroke="#718096" stroke-width="2"/>
    <!-- Laptop Screen Display -->
    <rect x="74" y="76" width="92" height="73" rx="4" fill="#1A202C"/>

    <!-- Screen UI Elements (Abstract Settings / Support Window) -->
    <rect x="84" y="88" width="72" height="49" rx="3" fill="#252F3F"/>
    <!-- Header bar -->
    <rect x="84" y="88" width="72" height="12" fill="#2D3748"/>
    <circle cx="90" cy="94" r="2" fill="#E53E3E"/>
    <circle cx="97" cy="94" r="2" fill="#D69E2E"/>
    <circle cx="104" cy="94" r="2" fill="#38A169"/>

    <!-- Code/Lines inside screen -->
    <rect x="92" y="106" width="40" height="4" rx="2" fill="#4A5568"/>
    <rect x="92" y="114" width="56" height="4" rx="2" fill="#4A5568"/>
    <rect x="92" y="122" width="28" height="4" rx="2" fill="#4A5568"/>

    <!-- Prominent Maintenance/Warranty Shield Badge overlaying bottom right of screen -->
    <g transform="translate(130, 110)">
      <!-- Shield Drop Shadow -->
      <path d="M 16 2 C 16 2, 28 4, 30 12 C 30 22, 24 30, 16 36 C 8 30, 2 22, 2 12 C 4 4, 16 2, 16 2 Z" fill="#000000" opacity="0.4"/>
      <!-- Shield Base -->
      <path d="M 16 0 C 16 0, 28 2, 30 10 C 30 20, 24 28, 16 34 C 8 28, 2 20, 2 10 C 4 2, 16 0, 16 0 Z" fill="#DD6B20"/>
      <!-- Shield Inner Accent -->
      <path d="M 16 3 C 16 3, 25 4.5, 27 10.5 C 27 18.5, 22 25.5, 16 31 C 10 25.5, 5 18.5, 5 10.5 C 7 4.5, 16 3, 16 3 Z" fill="#ED8936"/>
      <!-- Checkmark / Wrench element representing repair/guarantee -->
      <path d="M 10 16 L 14 20 L 23 11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>