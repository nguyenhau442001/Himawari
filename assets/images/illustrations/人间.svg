<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Paradise Glow Gradient -->
    <radialGradient id="paradiseGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Water/Pool Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Foliage Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Character Skin & Hair -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting / "Heavenly" Glow -->
  <circle cx="120" cy="90" r="110" fill="url(#paradiseGlow)" />

  <!-- Floating Sparkles / Magic Paradise Dust -->
  <g fill="#fde047">
    <circle cx="60" cy="50" r="2" opacity="0.8" />
    <circle cx="180" cy="65" r="3" opacity="0.9" />
    <circle cx="150" cy="30" r="1.5" opacity="0.7" />
    <circle cx="90" cy="40" r="2.5" opacity="0.6" />
    <circle cx="40" cy="110" r="2" opacity="0.8" />
    <circle cx="205" cy="130" r="2.5" opacity="0.7" />
  </g>
  <g fill="#ec4899">
    <circle cx="75" cy="70" r="2" opacity="0.8" />
    <circle cx="165" cy="45" r="2.5" opacity="0.9" />
    <circle cx="110" cy="25" r="1.5" opacity="0.7" />
  </g>

  <!-- Distant Tropical Mountains / Hills -->
  <path d="M 0 140 Q 60 100, 120 130 T 240 120 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.5" />
  <path d="M 0 150 Q 90 120, 160 145 T 240 135 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.7" />

  <!-- Lush Jungle Foliage (Foreground framing) -->
  <!-- Top Left Palm Fronds -->
  <path d="M -10 -10 Q 40 20, 70 80 Q 30 50, -10 30 Z" fill="url(#leafGrad)" />
  <path d="M -10 20 Q 50 50, 90 110 Q 40 80, -10 70 Z" fill="#059669" />

  <!-- Top Right Exotic Flowers / Hanging Vines -->
  <path d="M 250 -10 Q 190 20, 160 80 Q 200 50, 250 30 Z" fill="url(#leafGrad)" />
  <!-- Hanging Hibiscus / Orchids -->
  <path d="M 190,10 Q 195,25 190,40 Q 185,25 190,10 Z" fill="#f43f5e" />
  <circle cx="190" cy="42" r="4" fill="#fb7185" />
  <path d="M 220,20 Q 225,35 220,50 Q 215,35 220,20 Z" fill="#f43f5e" />
  <circle cx="220" cy="52" r="4" fill="#fb7185" />

  <!-- Resort Architecture / Wooden Pavilion Structure (Human World element) -->
  <g filter="url(#softShadow)">
    <!-- Wooden Pillars -->
    <rect x="25" y="100" width="12" height="110" rx="4" fill="url(#trunkGrad)" />
    <rect x="203" y="100" width="12" height="110" rx="4" fill="url(#trunkGrad)" />
    <!-- Roof Beam -->
    <path d="M 15 100 L 120 65 L 225 100 L 215 110 L 120 78 L 25 110 Z" fill="#78350f" />
    <!-- Hanging Lantern -->
    <line x1="120" y1="78" x2="120" y2="105" stroke="#78350f" stroke-width="3" />
    <circle cx="120" cy="115" r="10" fill="#f59e0b" />
    <path d="M 113 108 L 127 108 L 124 122 L 116 122 Z" fill="#d97706" />
  </g>

  <!-- Infinity Pool / Crystal Clear Water (Earthly Paradise setting) -->
  <path d="M 15 170 Q 120 150, 225 170 L 235 230 Q 120 245, 5 230 Z" fill="url(#waterGrad)" />
  <!-- Water Reflection Highlights -->
  <path d="M 50 190 Q 80 185, 110 190" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 140 205 Q 170 200, 195 205" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 70 220 Q 90 216, 120 220" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Tropical Palm Tree (Right side) -->
  <path d="M 210 230 Q 195 160, 220 90" stroke="url(#trunkGrad)" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Palm Fronds Top Right -->
  <path d="M 220 90 Q 250 60, 260 70 Q 230 100, 220 90 Z" fill="#10b981" />
  <path d="M 220 90 Q 200 50, 170 60 Q 200 90, 220 90 Z" fill="#059669" />
  <path d="M 220 90 Q 250 90, 270 110 Q 230 110, 220 90 Z" fill="#34d399" />
  <path d="M 220 90 Q 180 80, 160 100 Q 200 110, 220 90 Z" fill="#10b981" />

  <!-- MAIN CHARACTER: Relaxing in the earthly paradise ("Human world paradise") -->
  <g transform="translate(0, 15)" filter="url(#softShadow)">
    <!-- Wooden Lounge Chair / Float -->
    <path d="M 75 160 L 165 160 L 175 175 L 65 175 Z" fill="#b45309" />
    <line x1="85" y1="160" x2="85" y2="175" stroke="#78350f" stroke-width="3" />
    <line x1="115" y1="160" x2="115" y2="175" stroke="#78350f" stroke-width="3" />
    <line x1="145" y1="160" x2="145" y2="175" stroke="#78350f" stroke-width="3" />

    <!-- Character Body (Relaxed, arms stretched, enjoying the moment) -->
    <!-- Torso in vibrant summer outfit -->
    <path d="M 90 145 Q 120 135, 150 145 L 155 165 L 85 165 Z" fill="#06b6d4" />
    <!-- Swim Shorts / Legs resting -->
    <path d="M 85 162 L 120 162 L 118 182 L 83 182 Z" fill="#f43f5e" />
    <path d="M 120 162 L 155 162 L 157 182 L 122 182 Z" fill="#f43f5e" />
    <!-- Feet -->
    <ellipse cx="75" cy="184" rx="6" ry="4" fill="url(#skinGrad)" />
    <ellipse cx="165" cy="184" rx="6" ry="4" fill="url(#skinGrad)" />

    <!-- Arms stretched out blissfully -->
    <path d="M 90 142 Q 70 135, 55 145" stroke="url(#skinGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 150 142 Q 170 135, 185 145" stroke="url(#skinGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hands -->
    <circle cx="53" cy="147" r="4" fill="url(#skinGrad)" />
    <circle cx="187" cy="147" r="4" fill="url(#skinGrad)" />

    <!-- Neck & Head -->
    <rect x="115" y="130" width="10" height="16" rx="4" fill="url(#skinGrad)" />
    <circle cx="120" cy="118" r="18" fill="url(#skinGrad)" />

    <!-- Happy/Blissful Facial Expression -->
    <!-- Closed happy eyes ^ ^ -->
    <path d="M 112 115 Q 116 111, 120 115" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 120 115 Q 124 111, 128 115" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks (Blushing with happiness) -->
    <circle cx="111" cy="120" r="3" fill="#f43f5e" opacity="0.6" />
    <circle cx="129" cy="120" r="3" fill="#f43f5e" opacity="0.6" />
    <!-- Big joyful smile -->
    <path d="M 115 123 Q 120 129, 125 123" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Stylish Hair -->
    <path d="M 102 118 Q 105 100, 120 100 Q 138 100, 138 118 Q 135 110, 120 106 Q 105 110, 102 118 Z" fill="#334155" />
    <!-- Sunglasses pushed up on head -->
    <path d="M 108 109 Q 120 106, 132 109" stroke="#0f172a" stroke-width="2.5" fill="none" />
    <rect x="110" y="106" width="8" height="6" rx="2" fill="#0f172a" />
    <rect x="122" y="106" width="8" height="6" rx="2" fill="#0f172a" />
  </g>

  <!-- Side Table with Tropical Drink (Contextual prop) -->
  <g transform="translate(0, 15)" filter="url(#softShadow)">
    <ellipse cx="190" cy="170" rx="14" ry="7" fill="#b45309" />
    <rect x="187" y="170" width="6" height="15" fill="#78350f" />
    <ellipse cx="190" cy="185" rx="8" ry="4" fill="#78350f" />
    
    <!-- Cocktail Glass -->
    <path d="M 183 155 L 197 155 L 193 167 L 187 167 Z" fill="#38bdf8" opacity="0.8" />
    <line x1="190" y1="167" x2="190" y2="173" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Straw & Umbrella -->
    <line x1="187" y1="155" x2="182" y2="142" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <path d="M 190 155 L 196 142" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M 190 142 Q 196 138, 202 142 Z" fill="#f43f5e" />
  </g>

  <!-- Foreground Tropical Plants (Left Bottom framing) -->
  <path d="M 0 240 Q 20 200, 50 240 Z" fill="#065f46" />
  <path d="M -5 220 Q 30 180, 60 210 Q 30 230, -5 240 Z" fill="#10b981" />
  <!-- Glowing Fireflies / Magic Sparkles near water -->
  <circle cx="70" cy="190" r="2" fill="#fde047" opacity="0.9" />
  <circle cx="160" cy="200" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="115" cy="180" r="2" fill="#fde047" opacity="0.7" />
</svg>