<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sea level reference background -->
  <line x1="30" y1="180" x2="210" y2="180" stroke="#3A4454" stroke-dash-array="4,4" stroke-width="1.5"/>
  
  <!-- Ocean / Water representation below sea level -->
  <path d="M30,180 Q60,175 90,180 T150,180 T210,180 L210,200 L30,200 Z" fill="#22304A" opacity="0.6"/>
  <path d="M30,185 Q75,180 120,185 T210,185" fill="none" stroke="#4A90E2" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Mountain base and peak (Physical Object) -->
  <path d="M70,180 L130,90 L190,180 Z" fill="#2C3648"/>
  <!-- Mountain snow cap / highlight -->
  <path d="M130,90 L148,118 L130,112 L112,118 Z" fill="#F0F4F8"/>
  <!-- Mountain main ridge shadow side -->
  <path d="M130,90 L190,180 L130,180 Z" fill="#222B38"/>

  <!-- Sea level indicator label graphic -->
  <circle cx="30" cy="180" r="3" fill="#4A90E2"/>
  
  <!-- Altitude measurement line (vertical from sea level to peak) -->
  <line x1="130" y1="180" x2="130" y2="90" stroke="#F39C12" stroke-width="2" stroke-dash-array="3,3"/>
  
  <!-- Altitude peak indicator marker -->
  <circle cx="130" cy="90" r="4" fill="#F39C12"/>
  
  <!-- Elevation bracket/dimension indicator on the side -->
  <path d="M142,90 L150,90 L150,135 L154,135 L150,135 L150,180 L142,180" fill="none" stroke="#E67E22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Highlight accent dot -->
  <circle cx="150" cy="135" r="2.5" fill="#E67E22"/>
  
  <!-- Sun/Atmosphere element in dark mode -->
  <circle cx="180" cy="65" r="12" fill="#E67E22" opacity="0.2"/>
</svg>