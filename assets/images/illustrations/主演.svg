<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle stage background elements -->
  <path d="M 40 190 L 200 190" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Curtains left/right -->
  <path d="M 24 24 C 24 24, 40 100, 24 216 L 24 24 Z" fill="#222733"/>
  <path d="M 216 24 C 216 24, 200 100, 216 216 L 216 24 Z" fill="#222733"/>

  <!-- Spotlight beam -->
  <path d="M 120 16 L 40 200 L 200 200 Z" fill="url(#spotlight)" opacity="0.15"/>
  
  <defs>
    <linearGradient id="spotlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="actor-suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Motion / Drama lines representing performance and focus -->
  <path d="M 90 70 Q 120 60 150 70" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 80 85 Q 120 75 160 85" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Supporting cast / background silhouettes (smaller, darker) -->
  <g opacity="0.4">
    <!-- Actor left -->
    <circle cx="75" cy="115" r="10" fill="#64748B"/>
    <path d="M 60 150 C 60 135, 90 135, 90 150 L 90 190 L 60 190 Z" fill="#475569"/>
    <!-- Actor right -->
    <circle cx="165" cy="115" r="10" fill="#64748B"/>
    <path d="M 150 150 C 150 135, 180 135, 180 150 L 180 190 L 150 190 Z" fill="#475569"/>
  </g>

  <!-- MAIN ACTOR (主演 - Center stage, dynamic acting pose) -->
  <g transform="translate(0, 5)">
    <!-- Stage floor shadow -->
    <ellipse cx="120" cy="185" rx="25" ry="6" fill="#0D0F12" opacity="0.6"/>

    <!-- Dynamic action limbs / body lean -->
    <!-- Torso -->
    <path d="M 108 105 L 132 105 L 138 150 L 102 150 Z" fill="url(#actor-suit)"/>
    
    <!-- Golden costume accent / collar -->
    <path d="M 108 105 L 120 120 L 132 105 Z" fill="#F59E0B"/>

    <!-- Head -->
    <circle cx="120" cy="85" r="14" fill="#FDE047"/>
    <!-- Hair -->
    <path d="M 106 82 C 106 70, 134 70, 134 82 C 130 76, 110 76, 106 82 Z" fill="#1E293B"/>

    <!-- Expressive arms gesturing (Action verb representation) -->
    <!-- Left arm raised dramatically -->
    <path d="M 108 108 L 85 95 L 75 105" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="73" cy="107" r="5" fill="#FDE047"/>

    <!-- Right arm extended outward -->
    <path d="M 132 108 L 155 125 L 165 115" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="167" cy="113" r="5" fill="#FDE047"/>

    <!-- Legs in dynamic stance -->
    <path d="M 110 150 L 100 182 L 88 182" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 130 150 L 138 182 L 152 182" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Spotlight accent star / focal point marker -->
  <path d="M 120 35 L 123 42 L 130 45 L 123 48 L 120 55 L 117 48 L 110 45 L 117 42 Z" fill="#F59E0B"/>
  <path d="M 95 55 L 96.5 59 L 100 60.5 L 96.5 62 L 95 65.5 L 93.5 62 L 90 60.5 L 93.5 59 Z" fill="#F59E0B" opacity="0.7"/>
  <path d="M 145 55 L 146.5 59 L 150 60.5 L 146.5 62 L 145 65.5 L 143.5 62 L 140 60.5 L 143.5 59 Z" fill="#F59E0B" opacity="0.7"/>
</svg>