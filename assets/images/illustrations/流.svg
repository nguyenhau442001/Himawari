<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative depth elements -->
  <path d="M 60 70 Q 120 40 180 70" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  <path d="M 50 170 Q 120 140 190 170" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 6" fill="none"/>

  <!-- Stylized human profile head representing the contextual reference (Cô ấy - emotional context) -->
  <!-- Hair & Neck Base -->
  <path d="M 65 140 C 60 110, 75 80, 105 75 C 135 70, 155 95, 155 120 C 155 145, 145 160, 140 180 L 85 180 C 80 160, 70 155, 65 140 Z" fill="#2E3548"/>

  <!-- Face Silhouette -->
  <path d="M 100 75 C 130 75, 148 95, 145 130 C 143 145, 135 160, 125 180 L 95 180 C 95 160, 95 145, 95 130 C 95 110, 97 90, 100 75 Z" fill="#3B4459"/>

  <!-- Closed calm/emotional eye -->
  <path d="M 115 118 Q 123 124 131 118" stroke="#8A99AD" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Soft eyelashes -->
  <path d="M 118 120 L 115 123" stroke="#8A99AD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 128 120 L 131 123" stroke="#8A99AD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Subtle gentle eyebrow -->
  <path d="M 113 108 Q 123 104 133 110" stroke="#5C687E" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Soft lips (neutral, calm) -->
  <path d="M 122 152 Q 127 155 133 152" stroke="#7A889E" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- STREAM / FLOW (流 - liú / teardrop stream concept) -->
  <!-- Main central teardrop rolling down -->
  <path d="M 127 130 C 127 130, 134 140, 134 148 C 134 152.4 130.4 156 126 156 C 121.6 156, 118 152.4, 118 148 C 118 140, 127 130, 127 130 Z" fill="#38BDF8" opacity="0.9"/>
  <!-- Teardrop highlight -->
  <path d="M 125 138 C 125 138, 128 143, 128 146" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Trailing droplets of the stream (流 - flowing effect) -->
  <circle cx="126" cy="166" r="3.5" fill="#38BDF8" opacity="0.75"/>
  <circle cx="125" cy="178" r="2.5" fill="#38BDF8" opacity="0.5"/>
  <circle cx="125" cy="188" r="1.5" fill="#38BDF8" opacity="0.3"/>

  <!-- Secondary subtle stream line representing fluid motion -->
  <path d="M 126 128 Q 128 150 125 185" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="1 3" stroke-linecap="round" fill="none"/>

  <!-- Focus accent glow ring around the main teardrop area -->
  <circle cx="126" cy="148" r="18" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" fill="none"/>
</svg>