<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow & Interface Elements -->
  <circle cx="120" cy="120" r="85" fill="#222732" opacity="0.6"/>
  <!-- Subtle UI screen frame representing online shopping context -->
  <rect x="36" y="36" width="168" height="168" rx="16" fill="none" stroke="#2A303C" stroke-width="2"/>

  <!-- Stylized Smartphone / Screen displaying the Ticket Purchase -->
  <rect x="70" y="55" width="100" height="130" rx="12" fill="#15181E" stroke="#3A4252" stroke-width="2"/>
  
  <!-- Movie Ticket on Screen -->
  <rect x="85" y="70" width="70" height="40" rx="6" fill="#F39C12"/>
  <circle cx="85" cy="90" r="5" fill="#15181E"/>
  <circle cx="155" cy="90" r="5" fill="#15181E"/>
  <!-- Ticket perforations -->
  <line x1="120" y1="70" x2="120" y2="110" stroke="#15181E" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="95" y="80" width="30" height="4" rx="2" fill="#15181E" opacity="0.4"/>
  <rect x="95" y="90" width="20" height="4" rx="2" fill="#15181E" opacity="0.4"/>

  <!-- UI Checkout Button (Orange/Gold focus) -->
  <rect x="85" y="125" width="70" height="20" rx="10" fill="#F39C12"/>
  <rect x="105" y="133" width="30" height="4" rx="2" fill="#FFFFFF"/>

  <!-- Motion Lines indicating action -->
  <path d="M 145 155 C 150 165, 160 170, 175 170" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 155 145 C 165 150, 175 155, 185 160" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Dynamic Human Hand Interacting (Verbs / Action requirement) -->
  <g transform="translate(140, 140)">
    <!-- Palm & Wrist -->
    <path d="M 25 35 L 45 55 C 48 58, 52 56, 54 52 L 65 25 C 67 20, 63 15, 58 17 L 38 25 Z" fill="#E0A96D"/>
    <!-- Pointing Index Finger tapping the buy action -->
    <path d="M 15 25 C 10 20, 0 10, -10 5 C -15 2, -12 -3, -7 -1 C 2 3, 12 12, 18 20 Z" fill="#E0A96D"/>
    <!-- Thumb -->
    <path d="M 32 30 C 22 35, 15 45, 12 50 C 10 54, 15 57, 18 53 C 24 45, 32 38, 38 33 Z" fill="#D0985D"/>
  </g>

  <!-- Floating Success / Completion Star Accent -->
  <path d="M 55 75 L 58 83 L 66 85 L 59 90 L 61 98 L 55 93 L 49 98 L 51 90 L 44 85 L 52 83 Z" fill="#F39C12" opacity="0.9"/>
  <path d="M 185 85 L 187 89 L 191 90 L 188 93 L 189 97 L 185 94 L 181 97 L 182 93 L 179 90 L 183 89 Z" fill="#F39C12" opacity="0.6"/>

</svg>