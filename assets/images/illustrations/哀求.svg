<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mother figure -->
  <g transform="translate(140, 60)">
    <circle cx="20" cy="20" r="18" fill="#F4A261"/>
    <path d="M5 40 Q 20 60 35 40" stroke="#F4A261" stroke-width="4" fill="none"/>
    <rect x="5" y="50" width="30" height="100" rx="5" fill="#E76F51"/>
  </g>

  <!-- Little boy figure -->
  <g transform="translate(60, 80)">
    <!-- Head -->
    <circle cx="20" cy="20" r="18" fill="#F4A261"/>
    <!-- Tear -->
    <path d="M30 25 Q 35 35 30 40 Q 25 35 30 25" fill="#5DADE2"/>
    <!-- Hands clasped in pleading -->
    <g transform="translate(35, 60)">
      <rect x="0" y="0" width="10" height="25" rx="3" fill="#F4A261"/>
      <rect x="5" y="5" width="10" height="25" rx="3" fill="#F4A261"/>
    </g>
    <!-- Body -->
    <rect x="5" y="50" width="30" height="80" rx="5" fill="#2A9D8F"/>
  </g>

  <!-- Book icon on the ground -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="40" height="30" rx="2" fill="#E9C46A"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#1A1D24" stroke-width="2"/>
  </g>
</svg>