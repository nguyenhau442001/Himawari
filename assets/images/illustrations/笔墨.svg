<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle elements (Ink wash abstraction hinting at nature/mountains) -->
  <path d="M40 180 Q90 130 140 170 T220 160 L220 200 L40 200 Z" fill="#242933" opacity="0.6"/>
  <path d="M20 190 Q80 140 130 180 T220 175 L220 200 L20 200 Z" fill="#2A313D" opacity="0.8"/>

  <!-- Chinese Ink Stone (砚台 - Yàntái) -->
  <path d="M60 170 L180 170 C195 170, 200 155, 185 145 L170 135 C150 120, 90 120, 70 135 L55 145 C40 155, 45 170, 60 170 Z" fill="#2E3542"/>
  <ellipse cx="120" cy="148" rx="45" ry="12" fill="#1F242D"/>
  <!-- Ink pool (glossy black) -->
  <ellipse cx="120" cy="149" rx="38" ry="9" fill="#0D1015"/>
  <ellipse cx="110" cy="147" rx="20" ry="4" fill="#212630" opacity="0.4"/>

  <!-- Chinese Calligraphy Brush (毛笔 - Máobǐ) -->
  <!-- Brush Body/Handle angled across -->
  <g transform="rotate(-30 120 120)">
    <!-- Hanging cord loop -->
    <path d="M120 35 C115 25, 125 20, 120 15" fill="none" stroke="#E6AF2E" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bamboo handle segments -->
    <rect x="115" y="35" width="10" height="110" rx="2" fill="#D4A373"/>
    <line x1="115" y1="55" x2="125" y2="55" stroke="#B08968" stroke-width="2"/>
    <line x1="115" y1="85" x2="125" y2="85" stroke="#B08968" stroke-width="2"/>
    <line x1="115" y1="115" x2="125" y2="115" stroke="#B08968" stroke-width="2"/>
    <line x1="120" y1="35" x2="120" y2="145" stroke="#C89666" stroke-width="1" opacity="0.5"/>

    <!-- Brush Ferrule (collar) -->
    <path d="M114 145 L126 145 L125 155 L115 155 Z" fill="#E6AF2E"/>

    <!-- Brush Hair (dark wet tip dipping into ink) -->
    <path d="M115 155 L125 155 C124 165, 123 175, 120 185 C117 175, 116 165, 115 155 Z" fill="#111318"/>
  </g>

  <!-- Flying Ink Splatters / Creative strokes representing words and nature depiction -->
  <circle cx="75" cy="75" r="4" fill="#E6AF2E" opacity="0.9"/>
  <circle cx="165" cy="65" r="6" fill="#E6AF2E" opacity="0.7"/>
  <path d="M150 85 Q158 80 162 88 T155 95 Z" fill="#E6AF2E" opacity="0.8"/>
  <path d="M80 110 Q85 105 92 112 T85 118 Z" fill="#E6AF2E" opacity="0.7"/>

  <!-- Glowing Accent representing artistic creation -->
  <circle cx="120" cy="149" r="2" fill="#E6AF2E" opacity="0.6"/>
</svg>