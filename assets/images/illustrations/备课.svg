<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Surface -->
  <path d="M 32 184 L 208 184 L 216 196 L 24 196 Z" fill="#252A34"/>
  <rect x="24" y="196" width="192" height="6" fill="#1E222B" rx="2"/>

  <!-- Warm Desk Lamp (Late night study context) -->
  <!-- Lamp Base -->
  <ellipse cx="190" cy="184" rx="14" ry="4" fill="#3A4252"/>
  <path d="M 188 184 L 194 130 L 186 130 L 182 184 Z" fill="#4E5D6C"/>
  <!-- Lamp Arm -->
  <path d="M 190 132 C 190 110 170 100 150 105" fill="none" stroke="#4E5D6C" stroke-width="4" stroke-linecap="round"/>
  <!-- Lamp Shade & Cone of Light -->
  <path d="M 140 95 L 160 95 L 168 110 L 132 110 Z" fill="#F59E0B"/>
  <path d="M 115 110 L 185 110 L 215 184 L 85 184 Z" fill="#F59E0B" opacity="0.06"/>

  <!-- Open Lesson Plan Book (教材/教案) -->
  <g transform="translate(64, 135)">
    <!-- Book Shadows -->
    <path d="M -2 4 L 60 18 L 60 49 L -2 35 Z" fill="#111318"/>
    <path d="M 62 18 L 124 4 L 124 35 L 62 49 Z" fill="#111318"/>
    
    <!-- Left Page -->
    <path d="M 0 0 C 20 -3 40 -3 60 4 L 60 45 C 40 38 20 38 0 41 Z" fill="#F0F3F6"/>
    <!-- Right Page -->
    <path d="M 62 4 C 82 -3 102 -3 122 0 C 122 21 122 41 122 41 C 102 38 82 38 62 45 Z" fill="#F0F3F6"/>
    <!-- Center Binding -->
    <path d="M 59 2 C 61 2 61 43 63 43 C 61 43 61 2 59 2 Z" fill="#CBD5E1"/>

    <!-- Text Lines (Preparation content) -->
    <rect x="12" y="10" width="36" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="12" y="17" width="28" height="2" rx="1" fill="#CBD5E1"/>
    <rect x="12" y="23" width="32" height="2" rx="1" fill="#CBD5E1"/>
    <rect x="12" y="29" width="20" height="2" rx="1" fill="#CBD5E1"/>

    <rect x="74" y="8" width="34" height="3" rx="1.5" fill="#F59E0B"/>
    <rect x="74" y="15" width="38" height="2" rx="1" fill="#CBD5E1"/>
    <rect x="74" y="21" width="24" height="2" rx="1" fill="#CBD5E1"/>
    <rect x="74" y="27" width="32" height="2" rx="1" fill="#CBD5E1"/>
  </g>

  <!-- Reference Material Stack / Laptop / Notebook -->
  <g transform="translate(36, 150)">
    <rect x="0" y="12" width="55" height="10" rx="2" fill="#3B82F6" opacity="0.8"/>
    <rect x="4" y="6" width="48" height="8" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="8" y="0" width="40" height="8" rx="2" fill="#6366F1" opacity="0.8"/>
  </g>

  <!-- Reading Glasses (Detailed prep equipment) -->
  <g transform="translate(130, 145)">
    <!-- Left Lens Frame -->
    <circle cx="14" cy="10" r="10" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="14" cy="10" r="8.5" fill="#1E222B" fill-opacity="0.3"/>
    
    <!-- Right Lens Frame -->
    <circle cx="38" cy="10" r="10" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="38" cy="10" r="8.5" fill="#1E222B" fill-opacity="0.3"/>

    <!-- Bridge & Temples -->
    <path d="M 24 10 C 27 7 25 7 28 10" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 4 8 C -2 5 -6 2 -10 -2" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 48 8 C 54 5 58 2 62 -2" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Pen/Marker for Lesson Planning -->
  <g transform="translate(100, 115) rotate(-25)">
    <rect x="0" y="0" width="28" height="5" rx="2.5" fill="#EF4444"/>
    <rect x="25" y="1" width="6" height="3" rx="1" fill="#FBBF24"/>
    <path d="M 31 2.5 L 35 2.5" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

</svg>