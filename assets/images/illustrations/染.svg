<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mirror Reflection Gradient -->
    <linearGradient id="mirror-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ambient Glow for Red Hair -->
    <radialGradient id="hair-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Salon Interior Backdrop -->
  <!-- Vanity Counter -->
  <rect x="20" y="170" width="200" height="40" rx="4" fill="#334155" />
  <rect x="30" y="175" width="60" height="8" rx="2" fill="#475569" />
  
  <!-- Salon Mirror (Round) -->
  <circle cx="120" cy="95" r="55" fill="url(#mirror-grad)" stroke="#64748b" stroke-width="4" />
  <!-- Mirror Inner Highlight -->
  <path d="M 85 70 A 45 45 0 0 1 155 70" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4" />

  <!-- PROPS ON COUNTER -->
  <!-- Dye Bowl (Teal accent) -->
  <path d="M 65 160 Q 75 145 85 160 Z" fill="#38bdf8" />
  <ellipse cx="75" cy="160" rx="10" ry="4" fill="#0ea5e9" />
  <!-- Brush in bowl -->
  <line x1="78" y1="155" x2="90" y2="135" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  <path d="M 87 138 L 93 133 L 95 137 L 89 142 Z" fill="#ef4444" />

  <!-- Spray Bottle / Tool -->
  <rect x="155" y="145" width="12" height="25" rx="3" fill="#f43f5e" />
  <path d="M 155 148 L 148 143 L 167 143 Z" fill="#cbd5e1" />

  <!-- CHARACTER REFLECTION / HEAD IN MIRROR -->
  <!-- Ambient red hair glow inside mirror -->
  <circle cx="120" cy="95" r="35" fill="url(#hair-glow)" />

  <!-- Character Back/Shoulders (Foreground facing mirror) -->
  <!-- Body/Cape -->
  <path d="M 70 240 L 70 205 C 70 185 95 180 120 180 C 145 180 170 185 170 205 L 170 240 Z" fill="#0ea5e9" />
  <!-- Salon Cape Collar -->
  <path d="M 90 190 Q 120 205 150 190 L 160 215 Q 120 230 80 215 Z" fill="#e2e8f0" />

  <!-- Neck & Head -->
  <rect x="108" y="150" width="24" height="35" rx="8" fill="#fbcfe8" />
  <!-- Face profile/angle hint -->
  <circle cx="120" cy="130" r="22" fill="#fbcfe8" />

  <!-- STRIKING VIBRANT RED HAIR (The core of "染" - Dyed hair) -->
  <!-- Flowing vibrant red hair styling -->
  <path d="M 95 115 C 90 90 105 75 120 75 C 135 75 150 90 145 115 C 152 100 155 80 140 70 C 125 60 105 60 95 75 C 85 90 90 110 95 115 Z" fill="#ef4444" />
  <path d="M 100 125 C 95 105 100 90 110 85 C 105 100 108 115 115 128 Z" fill="#f87171" />
  <path d="M 140 125 C 145 105 140 90 130 85 C 135 100 132 115 125 128 Z" fill="#dc2626" />
  <!-- Top hair shine highlight -->
  <path d="M 110 82 C 115 78 125 78 130 82" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- GLOWING ATMOSPHERE / ACTION SPARKLES -->
  <!-- Sparkles indicating the transformation/freshly dyed result -->
  <path d="M 50 80 L 53 88 L 61 91 L 53 94 L 50 102 L 47 94 L 39 91 L 47 88 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M 185 100 L 187 105 L 192 107 L 187 109 L 185 114 L 183 109 L 178 107 L 183 105 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M 170 55 L 171 58 L 174 59 L 171 60 L 170 63 L 169 60 L 166 59 L 169 58 Z" fill="#f43f5e" opacity="0.8" />

  <!-- Warm ambient light splash from top right -->
  <circle cx="200" cy="30" r="40" fill="#fbbf24" opacity="0.15" filter="blur(10px)" />
</svg>