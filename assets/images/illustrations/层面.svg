<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Base Platform / Foundation Level (Bottom Plane) -->
    <path d="M -70 50 L 0 75 L 70 50 L 0 25 Z" fill="#2A303C" stroke="#3E4756" stroke-width="2"/>
    <path d="M -70 50 L -70 65 L 0 90 L 0 75 Z" fill="#1F242D" stroke="#3E4756" stroke-width="2"/>
    <path d="M 70 50 L 70 65 L 0 90 L 0 75 Z" fill="#252A35" stroke="#3E4756" stroke-width="2"/>
    
    <!-- Middle Level (Second Plane) -->
    <path d="M -70 0 L 0 25 L 70 0 L 0 -25 Z" fill="#323B4A" stroke="#4B566A" stroke-width="2"/>
    <path d="M -70 0 L -70 15 L 0 40 L 0 25 Z" fill="#252C37" stroke="#4B566A" stroke-width="2"/>
    <path d="M 70 0 L 70 15 L 0 40 L 0 25 Z" fill="#2C3442" stroke="#4B566A" stroke-width="2"/>

    <!-- Top Level (Upper Plane) with Accent Color -->
    <path d="M -70 -50 L 0 -25 L 70 -50 L 0 -75 Z" fill="#3B475A" stroke="#FF9F43" stroke-width="2"/>
    <path d="M -70 -50 L -70 -35 L 0 -10 L 0 -25 Z" fill="#2C3544" stroke="#FF9F43" stroke-width="2"/>
    <path d="M 70 -50 L 70 -35 L 0 -10 L 0 -25 Z" fill="#343F4F" stroke="#FF9F43" stroke-width="2"/>

    <!-- Central Vertical Axis connecting the planes -->
    <line x1="0" y1="-75" x2="0" y2="90" stroke="#FF9F43" stroke-width="3" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Focal Physical Object on Top Layer (Representing a distinct dimension/facet) -->
    <circle cx="0" cy="-50" r="14" fill="#FF9F43"/>
    <circle cx="0" cy="-50" r="8" fill="#1A1D24"/>
    <circle cx="0" cy="-50" r="4" fill="#FF9F43"/>

    <!-- Supporting Elements on Other Layers -->
    <circle cx="-25" cy="0" r="6" fill="#6272A4"/>
    <circle cx="25" cy="0" r="6" fill="#6272A4"/>
    
    <rect x="-8" y="59" width="16" height="6" rx="3" fill="#6272A4"/>
  </g>
</svg>