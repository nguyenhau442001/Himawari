<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Streetlight Gradient -->
    <radialGradient id="light-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Car Light Trails -->
    <linearGradient id="red-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="white-trail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- City Skyline Silhouette (Background) -->
  <g fill="#1e293b" opacity="0.6">
    <rect x="15" y="90" width="22" height="70" />
    <rect x="37" y="70" width="30" height="90" />
    <rect x="75" y="100" width="25" height="60" />
    <rect x="135" y="60" width="35" height="100" />
    <rect x="172" y="85" width="28" height="75" />
    <rect x="202" y="110" width="24" height="50" />
    <!-- Building Windows (Tiny glowing dots) -->
    <fill color="#f59e0b" opacity="0.4">
      <rect x="42" y="80" width="4" height="6" fill="#f59e0b" opacity="0.4"/>
      <rect x="52" y="80" width="4" height="6" fill="#f59e0b" opacity="0.4"/>
      <rect x="42" y="95" width="4" height="6" fill="#f59e0b" opacity="0.2"/>
      <rect x="145" y="75" width="6" height="8" fill="#38bdf8" opacity="0.5"/>
      <rect x="157" y="75" width="6" height="8" fill="#38bdf8" opacity="0.5"/>
      <rect x="145" y="95" width="6" height="8" fill="#f59e0b" opacity="0.3"/>
      <rect x="180" y="100" width="5" height="5" fill="#f59e0b" opacity="0.5"/>
    </fill>
  </g>

  <!-- Elevated Highway Overpass -->
  <path d="M-10 160 Q120 130 250 165 L250 185 Q120 150 -10 175 Z" fill="#475569" />
  <path d="M-10 160 Q120 130 250 165" stroke="#64748b" stroke-width="3" fill="none" />
  <path d="M-10 172 Q120 142 250 177" stroke="#334155" stroke-width="2" fill="none" />

  <!-- Streetlight Pole & Glow -->
  <path d="M190 145 L190 50 L200 45" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round" />
  <circle cx="200" cy="45" r="35" fill="url(#light-glow)" />
  <circle cx="200" cy="45" r="4" fill="#fef08a" />

  <!-- Traffic Light Pole (Foreground Left) -->
  <rect x="35" y="80" width="6" height="110" fill="#334155" />
  <!-- Traffic Light Box -->
  <rect x="29" y="85" width="18" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Red Traffic Light (ON) -->
  <circle cx="38" cy="95" r="4" fill="#ef4444" />
  <circle cx="38" cy="95" r="6" fill="#ef4444" opacity="0.4" />
  <!-- Yellow Light -->
  <circle cx="38" cy="106" r="4" fill="#334155" />
  <!-- Green Light -->
  <circle cx="38" cy="117" r="4" fill="#334155" />

  <!-- Ground / Lower Street -->
  <rect x="0" y="165" width="240" height="75" fill="#0f172a" />
  
  <!-- Road Markings (Dashed lines) -->
  <path d="M0 200 L240 200" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="12,8" opacity="0.6" fill="none" />

  <!-- Heavy Traffic Stream (Motion Trails) -->
  <!-- Upper Deck Traffic (Red Tail Lights) -->
  <path d="M 20 155 Q 120 132 230 158" stroke="url(#red-trail)" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 50 160 Q 140 138 240 162" stroke="url(#red-trail)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 0 150 Q 100 128 210 153" stroke="url(#red-trail)" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Lower Deck Traffic (Headlights & Taillights stuck in jam) -->
  <path d="M 230 185 Q 120 160 10 190" stroke="url(#white-trail)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 210 193 Q 110 168 0 198" stroke="url(#red-trail)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 240 215 Q 130 190 20 220" stroke="url(#white-trail)" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Detailed Stopped Car (Stuck in Jam, Foreground Right) -->
  <g transform="translate(130, 185)">
    <!-- Car body -->
    <path d="M10 15 L25 5 L65 5 L80 15 L90 30 L5 30 Z" fill="#38bdf8" />
    <path d="M28 7 L62 7 L73 16 L20 16 Z" fill="#0f172a" opacity="0.8" />
    <!-- Wheels -->
    <circle cx="25" cy="30" r="8" fill="#1e293b" />
    <circle cx="25" cy="30" r="4" fill="#64748b" />
    <circle cx="70" cy="30" r="8" fill="#1e293b" />
    <circle cx="70" cy="30" r="4" fill="#64748b" />
    <!-- Red Taillight Glow -->
    <circle cx="6" cy="22" r="3" fill="#f87171" />
    <circle cx="6" cy="22" r="5" fill="#ef4444" opacity="0.5" />
  </g>

  <!-- Detailed Stopped Taxi (Foreground Left) -->
  <g transform="translate(45, 200)">
    <!-- Car body -->
    <path d="M5 12 L18 2 L62 2 L75 12 L85 25 L0 25 Z" fill="#f59e0b" />
    <path d="M20 4 L58 4 L68 13 L12 13 Z" fill="#0f172a" opacity="0.8" />
    <!-- Taxi Sign -->
    <rect x="35" y="-3" width="12" height="5" rx="1" fill="#fef08a" />
    <!-- Wheels -->
    <circle cx="20" cy="25" r="7" fill="#1e293b" />
    <circle cx="20" cy="25" r="3" fill="#64748b" />
    <circle cx="65" cy="25" r="7" fill="#1e293b" />
    <circle cx="65" cy="25" r="3" fill="#64748b" />
    <!-- Headlight Glow -->
    <circle cx="82" cy="18" r="3" fill="#fef08a" />
    <circle cx="82" cy="18" r="6" fill="#fef08a" opacity="0.4" />
  </g>

  <!-- Commuter / Pedestrian Character on Sidewalk (Frustrated/Waiting) -->
  <g transform="translate(95, 155)">
    <!-- Body / Suit Jacket -->
    <path d="M12 35 L20 22 L28 35 L24 55 L16 55 Z" fill="#334155" />
    <path d="M16 22 L20 30 L24 22" fill="#cbd5e1" /> <!-- Shirt/Tie -->
    
    <!-- Head & Hair -->
    <circle cx="20" cy="13" r="7" fill="#fbcfe8" /> <!-- Skin -->
    <path d="M13 12 C13 7 27 7 27 12 C27 15 25 10 20 10 C15 10 13 12 13 12 Z" fill="#0f172a" /> <!-- Hair -->

    <!-- Arms crossed / checking watch expression -->
    <path d="M14 30 L26 30 L23 38 L17 38 Z" fill="#334155" /> <!-- Arms -->
    <circle cx="20" cy="35" r="2" fill="#f59e0b" /> <!-- Watch detail -->

    <!-- Legs -->
    <rect x="15" y="55" width="4" height="20" fill="#1e293b" />
    <rect x="21" y="55" width="4" height="20" fill="#1e293b" />
    <path d="M13 75 L16 75 L16 77 L13 77 Z" fill="#0f172a" />
    <path d="M23 75 L26 75 L26 77 L23 77 Z" fill="#0f172a" />

    <!-- Briefcase -->
    <rect x="27" y="38" width="8" height="10" rx="1" fill="#78350f" />
    <path d="M29 38 L33 38 L33 36 L29 36 Z" stroke="#b45309" stroke-width="1.5" fill="none" />
  </g>

  <!-- City Atmosphere: Floating Pollution/Dust Particles in Lights -->
  <circle cx="180" cy="70" r="1.5" fill="#fef08a" opacity="0.6" />
  <circle cx="215" cy="60" r="1" fill="#fef08a" opacity="0.4" />
  <circle cx="165" cy="50" r="2" fill="#fef08a" opacity="0.5" />
  <circle cx="195" cy="90" r="1" fill="#fef08a" opacity="0.3" />

</svg>