<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize the core object -->
  <circle cx="120" cy="115" r="70" fill="#2D323E" opacity="0.4"/>
  
  <!-- Central Physical Object: The Master Key & Mechanism representing "Sở dĩ / Lý do / Nguyên nhân gốc rễ" -->
  <!-- Gear/Mechanism representing the underlying reason/cause -->
  <g transform="translate(120, 105)">
    <!-- Outer Gear -->
    <path d="M-30,-50 L-22,-48 L-18,-58 L-8,-55 L-6,-65 L5,-62 L10,-71 L20,-65 L21,-75 L32,-68 L30,-58 L40,-53 L35,-44 L45,-39 L38,-30 L45,-22 L36,-15 L41,-6 L31,0 L35,10 L26,15 L28,25 L19,27 L20,38 L11,37 L10,48 L1,45 L-2,55 L-11,50 L-16,60 L-25,53 L-28,43 L-37,45 L-38,34 L-47,33 L-45,23 L-55,20 L-50,11 L-59,6 L-51,-3 L-60,-9 L-50,-16 L-58,-24 L-47,-29 L-53,-38 L-42,-41 L-46,-51 L-35,-51 Z" fill="#2A313E" stroke="#3E4756" stroke-width="2"/>
    
    <!-- Inner Mechanism Ring -->
    <circle cx="0" cy="0" r="32" fill="#1E232D" stroke="#E59C38" stroke-width="2.5" stroke-dasharray="6 3"/>
    
    <!-- Central Key (The Core Reason/Key Factor unlocking success) -->
    <g transform="rotate(45) translate(-6, -38)">
      <!-- Key Stem -->
      <rect x="2" y="10" width="8" height="60" rx="4" fill="#E59C38"/>
      
      <!-- Key Bow (Head) -->
      <circle cx="6" cy="10" r="14" fill="none" stroke="#E59C38" stroke-width="6"/>
      <circle cx="6" cy="10" r="5" fill="#1A1D24"/>
      
      <!-- Key Teeth (The specific mechanism/cause detail) -->
      <path d="M10,50 L18,50 L18,56 L10,56 Z" fill="#E59C38"/>
      <path d="M10,62 L15,62 L15,68 L10,68 Z" fill="#E59C38"/>
    </g>
  </g>

  <!-- Ground / Base platform representing foundation and achievement -->
  <path d="M60,185 L180,185 C185,185 188,188 188,193 C188,198 185,201 180,201 L60,201 C55,201 52,198 52,193 C52,188 55,185 60,185 Z" fill="#2A323D"/>
  
  <!-- Upward radiating success indicator emanating from the core reason -->
  <path d="M95,170 L95,160" stroke="#E59C38" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M120,173 L120,157" stroke="#E59C38" stroke-width="3" stroke-linecap="round"/>
  <path d="M145,170 L145,160" stroke="#E59C38" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>