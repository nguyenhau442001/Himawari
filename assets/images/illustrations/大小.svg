<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Contextual Visual Representation for "大小" (Size / Shoe size: 这双鞋的大小正合适) -->
  <!-- Sleek Modern Sneaker / Shoe (representing physical object & size) -->
  <g transform="translate(48, 70)">
    <!-- Shoe sole -->
    <path d="M 12 75 C 20 75 110 75 125 75 C 135 75 142 70 144 65 C 146 60 140 58 132 58 C 115 58 20 58 12 58 Z" fill="#2E3646"/>
    <path d="M 14 71 C 25 71 115 71 127 71 C 135 71 140 67 141 64 C 130 64 25 64 14 64 Z" fill="#F39C12" opacity="0.8"/>

    <!-- Shoe main body -->
    <path d="M 15 58 C 18 45 35 32 55 30 C 70 28 85 35 95 42 C 105 48 125 48 135 58 Z" fill="#3A4454"/>
    
    <!-- Toe cap overlay -->
    <path d="M 15 58 C 16 48 25 38 42 34 C 35 44 28 52 15 58 Z" fill="#4E5D73"/>

    <!-- Laces area -->
    <path d="M 45 34 C 55 33 75 38 90 47 C 80 43 60 38 45 34 Z" fill="#F5F7FA"/>
    <!-- Individual laces -->
    <line x1="53" y1="35" x2="57" y2="40" stroke="#2E3646" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="63" y1="37" x2="67" y2="42" stroke="#2E3646" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="73" y1="40" x2="77" y2="45" stroke="#2E3646" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Accent ankle collar -->
    <path d="M 90 47 C 100 45 120 45 135 58 C 120 58 100 55 90 47 Z" fill="#F39C12"/>

    <!-- Heel counter detail -->
    <path d="M 125 48 C 132 50 137 54 135 58 C 130 58 125 54 125 48 Z" fill="#E67E22"/>
  </g>

  <!-- Scale/Size Indicator Markers (Framing the shoe to signify measurement/size) -->
  <!-- Left size bracket -->
  <path d="M 36 90 L 30 90 L 30 135 L 36 135" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30" y1="112" x2="24" y2="112" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right size bracket -->
  <path d="M 204 90 L 210 90 L 210 135 L 204 135" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="210" y1="112" x2="216" y2="112" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Checkmark representing "正合适" (just right / perfect fit) -->
  <g transform="translate(102, 148)">
    <circle cx="18" cy="18" r="16" fill="#2ECC71" opacity="0.2"/>
    <circle cx="18" cy="18" r="12" fill="#2ECC71"/>
    <path d="M 11 18 L 15 22 L 25 13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>