<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Door frame -->
  <path d="M80 50h80v140H80z" fill="#2D343E" stroke="#4A5568" stroke-width="4"/>
  <rect x="120" y="50" width="40" height="140" fill="#3A4351" stroke="#4A5568" stroke-width="4"/>
  
  <!-- Door handle -->
  <circle cx="130" cy="120" r="4" fill="#FFB347"/>
  
  <!-- Character Action -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M40 130c0-15 10-25 20-25s20 10 20 25v50H40z" fill="#E2E8F0"/>
    <!-- Head -->
    <circle cx="60" cy="90" r="15" fill="#E2E8F0"/>
    <!-- Arm reaching forward -->
    <path d="M75 115l25-10" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Motion Lines -->
  <g stroke="#FFB347" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M100 90l15 5"/>
    <path d="M105 105l15 5"/>
    <path d="M100 120l15 5"/>
  </g>
  
  <!-- Floor shadow -->
  <ellipse cx="120" cy="190" rx="60" ry="10" fill="#000" opacity="0.2"/>
</svg>