<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#475569"/>
  <rect x="50" y="150" width="10" height="80" rx="2" fill="#334155"/>
  <rect x="180" y="150" width="10" height="80" rx="2" fill="#334155"/>
  
  <!-- Characters -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40 Q20 50 30 40" stroke="#fde68a" stroke-width="3" fill="none"/>
    <rect x="5" y="55" width="30" height="60" rx="5" fill="#38bdf8"/>
  </g>
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40 Q20 50 30 40" stroke="#fde68a" stroke-width="3" fill="none"/>
    <rect x="5" y="55" width="30" height="60" rx="5" fill="#ec4899"/>
  </g>
  
  <!-- Schedule Paper -->
  <rect x="80" y="100" width="80" height="100" rx="4" fill="#f8fafc"/>
  <line x1="90" y1="115" x2="150" y2="115" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="90" y1="130" x2="150" y2="130" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="90" y1="145" x2="150" y2="145" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="90" y1="160" x2="150" y2="160" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="90" y1="175" x2="150" y2="175" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Icons on paper -->
  <circle cx="100" cy="115" r="4" fill="#fb923c"/>
  <circle cx="100" cy="130" r="4" fill="#10b981"/>
  <circle cx="100" cy="145" r="4" fill="#38bdf8"/>
  <circle cx="100" cy="160" r="4" fill="#ec4899"/>
  <circle cx="100" cy="175" r="4" fill="#fbbf24"/>
  
  <!-- Coffee Mug -->
  <rect x="170" y="120" width="20" height="20" rx="2" fill="#fbbf24"/>
  <path d="M190 125 Q200 125 200 135" stroke="#fbbf24" stroke-width="3" fill="none"/>
  
  <!-- Clock -->
  <circle cx="120" cy="40" r="25" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="40" x2="120" y2="25" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="40" x2="135" y2="40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
</svg>