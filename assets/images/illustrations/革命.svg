<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Podium Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gear Metal Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environmental Atmosphere & Spotlight -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Background Architecture & Industrial Detail (Representing Historic Transition/Revolution) -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <line x1="20" y1="200" x2="220" y2="200" />
    <line x1="60" y1="40" x2="60" y2="200" />
    <line x1="180" y1="40" x2="180" y2="200" />
  </g>

  <!-- Large Symbolic Gears representing "Cách mạng" (Movement, Industrial/Social Shift) -->
  <g transform="translate(185, 60)" opacity="0.35">
    <circle cx="0" cy="0" r="18" fill="url(#gearGrad)" />
    <!-- Gear Teeth Representation -->
    <rect x="-3" y="-23" width="6" height="6" fill="#fbbf24" rx="1" />
    <rect x="-3" y="17" width="6" height="6" fill="#fbbf24" rx="1" />
    <rect x="-23" y="-3" width="6" height="6" fill="#fbbf24" rx="1" />
    <rect x="17" y="-3" width="6" height="6" fill="#fbbf24" rx="1" />
    <circle cx="0" cy="0" r="8" fill="#0f172a" />
  </g>

  <g transform="translate(55, 90) scale(0.75)" opacity="0.3">
    <circle cx="0" cy="0" r="18" fill="url(#gearGrad)" />
    <rect x="-3" y="-23" width="6" height="6" fill="#fbbf24" rx="1" />
    <rect x="-3" y="17" width="6" height="6" fill="#fbbf24" rx="1" />
    <rect x="-23" y="-3" width="6" height="6" fill="#fbbf24" rx="1" />
    <rect x="17" y="-3" width="6" height="6" fill="#fbbf24" rx="1" />
    <circle cx="0" cy="0" r="8" fill="#0f172a" />
  </g>

  <!-- Raising Flag / Banners symbolizing movement and historic change -->
  <path d="M 85 180 L 85 60 L 135 75 L 85 90" fill="#ef4444" opacity="0.85" />
  <line x1="85" y1="40" x2="85" y2="200" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

  <!-- The Speaker / Revolutionary Leader at the Podium -->
  <!-- Podium Base -->
  <path d="M 95 180 L 145 180 L 155 210 L 85 210 Z" fill="url(#podiumGrad)" stroke="#475569" stroke-width="1.5" />
  <!-- Podium Accent Line -->
  <line x1="91" y1="195" x2="149" y2="195" stroke="#f59e0b" stroke-width="2" />

  <!-- Character Body & Coat (Heroic/Expressive silhouette) -->
  <path d="M 100 140 L 140 140 L 148 185 L 92 185 Z" fill="#1e3a8a" /> <!-- Suit/Coat -->
  <path d="M 112 140 L 128 140 L 133 165 L 107 165 Z" fill="#ffffff" /> <!-- Shirt front -->
  <polygon points="120,143 115,155 125,155" fill="#dc2626" /> <!-- Red Tie -->

  <!-- Character Head & Neck -->
  <rect x="114" y="112" width="12" height="12" fill="#fbcfe8" rx="3" />
  <circle cx="120" cy="112" r="14" fill="#fbcfe8" /> <!-- Head -->

  <!-- Hair (Dynamic, swept back) -->
  <path d="M 106 105 C 108 95, 120 95, 130 102 C 134 105, 134 112, 134 112 L 106 112 Z" fill="#0f172a" />

  <!-- Facial Expression (Determined, passionate speaker) -->
  <path d="M 124 110 Q 128 110 130 112" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round" /> <!-- Eye -->
  <path d="M 124 118 Q 128 122 132 118" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round" /> <!-- Open mouth shouting/inspiring -->

  <!-- Expressive Gestures (Raised Fist / Arm sweeping action) -->
  <!-- Left arm resting/gripping podium -->
  <path d="M 100 142 L 90 170 L 98 172" fill="none" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right arm raised high in passionate speech / revolution -->
  <path d="M 138 142 L 160 115 L 170 120" fill="none" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Raised Fist -->
  <circle cx="173" cy="119" r="5" fill="#fbcfe8" />

  <!-- Foreground / Ground Details -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

  <!-- Sparks of Inspiration / Dynamic Particles floating upward -->
  <circle cx="155" cy="85" r="3" fill="#fbbf24" opacity="0.9" />
  <circle cx="170" cy="65" r="2" fill="#f59e0b" opacity="0.7" />
  <circle cx="140" cy="50" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="95" cy="100" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="75" cy="75" r="2.5" fill="#10b981" opacity="0.7" />

  <!-- Dramatic Lighting Highlights on the scene edges -->
  <path d="M 0 0 L 240 0" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
</svg>