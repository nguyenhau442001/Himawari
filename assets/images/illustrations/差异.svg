<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Scale Base / Stand -->
    <path d="M120 170 L120 205 M90 205 L150 205" stroke="#64748B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="170" r="8" fill="#F59E0B"/>
    
    <!-- Central Pivot / Beam -->
    <path d="M120 75 L120 170" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Balance Beam -->
    <g transform="rotate(-12 120 75)">
      <!-- Beam Bar -->
      <line x1="60" y1="75" x2="180" y2="75" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
      <polygon points="120,68 124,78 116,78" fill="#F59E0B"/>
      
      <!-- Left Chain & Pan (Lower, Heavier Object) -->
      <line x1="60" y1="75" x2="60" y2="120" stroke="#64748B" stroke-width="2"/>
      <path d="M40 120 Q60 135 80 120" fill="none" stroke="#64748B" stroke-width="2"/>
      <ellipse cx="60" cy="120" rx="22" ry="6" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
      <!-- Large Solid Physical Object (Cube) on Left Pan -->
      <rect x="46" y="94" rx="3" width="28" ry="3" height="28" fill="#F59E0B"/>
      <path d="M46 94 L56 86 L84 86 L74 94 Z" fill="#FBBF24"/>
      <path d="M74 94 L84 86 L84 114 L74 122 Z" fill="#D97706"/>

      <!-- Right Chain & Pan (Higher, Lighter/Different Object) -->
      <line x1="180" y1="75" x2="180" y2="120" stroke="#64748B" stroke-width="2"/>
      <path d="M160 120 Q180 135 200 120" fill="none" stroke="#64748B" stroke-width="2"/>
      <ellipse cx="180" cy="120" rx="22" ry="6" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
      <!-- Different Physical Object (Sphere/Orb) on Right Pan -->
      <circle cx="180" cy="104" r="14" fill="#38BDF8"/>
      <circle cx="176" cy="100" r="3" fill="#BAE6FD" opacity="0.8"/>
    </g>
    
    <!-- Accent Ground Shadow -->
    <ellipse cx="120" cy="210" rx="40" ry="4" fill="#0F172A"/>
  </g>
</svg>