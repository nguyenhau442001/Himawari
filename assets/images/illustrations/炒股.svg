<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle grid and background graph elements for context -->
  <path d="M30 190 H210" stroke="#2A2F3A" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M30 150 H210" stroke="#2A2F3A" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M30 110 H210" stroke="#2A2F3A" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M30 70 H210" stroke="#2A2F3A" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Dynamic rising stock chart line (Green/Gold financial theme) -->
  <path d="M30 170 L70 155 L110 165 L150 110 L180 95 L210 60" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing data points on the chart -->
  <circle cx="150" cy="110" r="4" fill="#10B981"/>
  <circle cx="180" cy="95" r="4" fill="#10B981"/>
  <circle cx="210" cy="60" r="5" fill="#10B981"/>

  <!-- Candlestick chart markers showing volatility/action -->
  <line x1="110" y1="145" x2="110" y2="185" stroke="#EF4444" stroke-width="2"/>
  <rect x="106" y="155" width="8" height="20" fill="#EF4444" rx="2"/>

  <line x1="150" y1="90" x2="150" y2="135" stroke="#10B981" stroke-width="2"/>
  <rect x="146" y="100" width="8" height="25" fill="#10B981" rx="2"/>

  <line x1="180" y1="75" x2="180" y2="120" stroke="#10B981" stroke-width="2"/>
  <rect x="176" y="85" width="8" height="25" fill="#10B981" rx="2"/>

  <!-- Motion lines indicating active trading/analysis -->
  <path d="M190 45 C195 40, 205 40, 210 45" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <path d="M198 38 C204 32, 214 32, 220 38" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>

  <!-- Human Character Action (Upper body leaning forward, interacting with the digital screen/chart) -->
  <!-- Torso / Clothing -->
  <path d="M40 215 C40 185, 60 170, 85 170 C110 170, 130 185, 130 215 Z" fill="#3B82F6"/>
  
  <!-- Neck & Head -->
  <path d="M75 145 L75 175 L95 175 L95 145 Z" fill="#FBBF24"/>
  <circle cx="85" cy="125" r="16" fill="#FBBF24"/>
  <!-- Hair -->
  <path d="M69 120 C69 110, 77 107, 85 107 C93 107, 101 110, 101 120 L101 127 L69 127 Z" fill="#1E293B"/>

  <!-- Active Arm reaching forward to point/interact with the stock trend -->
  <path d="M85 180 C95 160, 115 140, 145 135" fill="none" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="148" cy="133" r="6" fill="#FBBF24"/>

  <!-- Secondary supporting arm -->
  <path d="M85 185 C75 170, 65 160, 55 165" fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round"/>

  <!-- Focus interface element / tablet / trading screen in hand -->
  <rect x="125" y="115" width="50" height="35" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <path d="M132 135 L142 125 L150 130 L160 118" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
</svg>