<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Silhouette of a person looking into a mirror -->
    <path d="M60 20 C 30 20, 20 30, 20 60 L 20 100 C 20 130, 30 140, 60 140 L 60 20 Z" fill="#2D343E"/>
    <path d="M60 20 C 90 20, 100 30, 100 60 L 100 100 C 100 130, 90 140, 60 140 L 60 20 Z" fill="#FFB84D"/>
    
    <!-- Head -->
    <circle cx="60" cy="50" r="25" fill="#FFB84D"/>
    <circle cx="60" cy="50" r="25" fill="#2D343E" transform="translate(0, 0) scale(0.5) translate(60, 50)"/>
    
    <!-- Mirror Frame -->
    <rect x="10" y="10" width="100" height="120" rx="10" stroke="#4A5568" stroke-width="4" fill="none"/>
    
    <!-- Reflection Detail -->
    <path d="M60 80 L 60 120 M 40 100 L 80 100" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>