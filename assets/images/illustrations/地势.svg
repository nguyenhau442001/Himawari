<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient (Dawn/Day transition) -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Ground Gradient for Flat Plain -->
    <linearGradient id="ground-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="path-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Scene Atmosphere / Sky -->
  <rect x="0" y="0" width="240" height="150" fill="url(#sky-grad)" opacity="0.6"/>

  <!-- Distant Soft Hills (Showing wide, flat horizon) -->
  <path d="M-20 130 Q60 120 140 126 T300 125 L300 160 L-20 160 Z" fill="#047857" opacity="0.5"/>
  <path d="M-10 138 Q80 132 180 136 T260 135 L260 160 L-10 160 Z" fill="#059669" opacity="0.8"/>

  <!-- Main Flat Plain Ground (Illustrating "地势平坦" - flat terrain) -->
  <path d="M0 135 Q120 135 240 135 L240 240 L0 240 Z" fill="url(#ground-grad)"/>

  <!-- Horizon Detail Lines to emphasize flatness -->
  <path d="M20 145 L220 145" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M50 155 L190 155" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Safe, wide flat hiking path crossing the terrain -->
  <path d="M-10 200 Q80 165 250 170 L250 200 Q80 195 -10 220 Z" fill="url(#path-grad)" opacity="0.85"/>
  <path d="M0 206 Q80 175 245 180" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" opacity="0.6"/>

  <!-- Environment Props: Trees and Camping/Touring gear showing accessible flat land -->
  <!-- Low bushes -->
  <circle cx="35" cy="142" r="8" fill="#047857"/>
  <circle cx="43" cy="140" r="10" fill="#059669"/>
  <circle cx="210" cy="144" r="9" fill="#047857"/>
  <circle cx="203" cy="142" r="7" fill="#059669"/>

  <!-- A small modern camping tent (indicating flat ground use) -->
  <polygon points="180,165 210,150 215,165" fill="#f43f5e"/>
  <polygon points="180,165 195,150 210,150" fill="#fb7185"/>
  <polygon points="180,165 195,165 195,150" fill="#e11d48"/>
  <!-- Tent peg rope -->
  <line x1="180" y1="165" x2="170" y2="170" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Secondary Tree (Right background) -->
  <rect x="215" y="110" width="4" height="35" fill="#78350f" rx="1"/>
  <circle cx="217" cy="105" r="14" fill="#059669"/>
  <circle cx="212" cy="100" r="10" fill="#34d399"/>

  <!-- Primary Tree (Left background) -->
  <rect x="22" y="115" width="5" height="30" fill="#78350f" rx="1"/>
  <circle cx="24" cy="110" r="12" fill="#059669"/>
  <circle cx="20" cy="105" r="9" fill="#34d399"/>

  <!-- Characters: Two hikers walking comfortably on the flat ground -->
  <!-- Character 1 (Lead Hiker - Female) -->
  <!-- Legs -->
  <line x1="95" y1="185" x2="90" y2="205" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="102" y1="185" x2="108" y2="203" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <!-- Body/Torso with backpack -->
  <rect x="91" y="160" width="16" height="26" rx="6" fill="#38bdf8"/>
  <rect x="95" y="162" width="12" height="18" rx="3" fill="#0284c7"/> <!-- backpack -->
  <!-- Head & Hat -->
  <circle cx="99" cy="151" r="7" fill="#fbcfe8"/>
  <path d="M91 148 Q99 144 107 148" fill="#f59e0b"/>
  <!-- Arms -->
  <path d="M91 166 L83 176" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
  <path d="M107 166 L115 174" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
  <!-- Walking Pole -->
  <line x1="82" y1="174" x2="72" y2="205" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Character 2 (Following Hiker - Male) -->
  <!-- Legs -->
  <line x1="65" y1="182" x2="60" y2="202" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="72" y1="182" x2="78" y2="200" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Body/Torso -->
  <rect x="61" y="157" width="16" height="27" rx="6" fill="#fb923c"/>
  <!-- Head & Hair -->
  <circle cx="69" cy="148" r="7" fill="#fed7aa"/>
  <path d="M62 147 Q69 142 76 147" fill="#78350f"/>
  <!-- Arms -->
  <path d="M61 163 L53 175" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
  <path d="M77 163 L84 172" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>

  <!-- Foreground aesthetic foliage frame elements -->
  <path d="M-5 240 Q10 215 30 240 Z" fill="#065f46" opacity="0.9"/>
  <path d="M220 240 Q235 220 245 240 Z" fill="#065f46" opacity="0.9"/>
  <path d="M15 240 Q25 225 35 240 Z" fill="#34d399" opacity="0.6"/>

  <!-- Sun / Warm Glow in Sky -->
  <circle cx="120" cy="50" r="18" fill="#fbbf24" opacity="0.2"/>
  <circle cx="120" cy="50" r="10" fill="#f59e0b" opacity="0.4"/>

  <!-- Subtle UI / Vignette frame border effect -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>