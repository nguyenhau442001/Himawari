<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient screen glow behind camera -->
  <circle cx="120" cy="110" r="75" fill="#243044" opacity="0.5"/>
  <ellipse cx="120" cy="185" rx="55" ry="12" fill="#111418" opacity="0.8"/>

  <!-- Security Camera Bracket / Mount -->
  <path d="M105 40 L135 40 L130 65 L110 65 Z" fill="#4A5568"/>
  <rect x="112" y="32" width="16" height="10" rx="2" fill="#718096"/>
  <circle cx="120" cy="65" r="10" fill="#2D3748"/>

  <!-- Camera Body -->
  <path d="M85 70 L155 70 C168 70, 175 78, 175 90 L175 110 C175 122, 168 130, 155 130 L85 130 C72 130, 65 122, 65 110 L65 90 C65 78, 72 70, 85 70 Z" fill="#2B6CB0"/>
  
  <!-- Camera Details & Highlight -->
  <path d="M85 73 L155 73 C165 73, 170 79, 172 87 L68 87 C70 79, 75 73, 85 73 Z" fill="#4299E1"/>
  <rect x="75" y="95" width="12" height="6" rx="3" fill="#63B3ED"/>
  
  <!-- Camera Lens Housing -->
  <circle cx="120" cy="100" r="26" fill="#1A202C"/>
  <circle cx="120" cy="100" r="22" fill="#2D3748"/>
  <circle cx="120" cy="100" r="16" fill="#1A202C"/>
  <circle cx="120" cy="100" r="10" fill="#EBF8FF"/>
  <circle cx="116" cy="96" r="3.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Recording Status Indicator (Glowing Red LED) -->
  <circle cx="155" cy="85" r="4" fill="#E53E3E"/>
  <circle cx="155" cy="85" r="7" fill="#FC8181" opacity="0.4"/>

  <!-- Video Footage Frame / Viewfinder -->
  <rect x="45" y="145" width="150" height="70" rx="8" fill="#111318" stroke="#2D3748" stroke-width="2"/>
  
  <!-- Inner Screen Content representing playback/monitoring -->
  <!-- Road Intersection Line Mockup -->
  <path d="M70 195 L110 165" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 195 L130 165" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Playback Timeline UI Bar -->
  <rect x="57" y="197" width="126" height="4" rx="2" fill="#2D3748"/>
  <rect x="57" y="197" width="75" height="4" rx="2" fill="#ECC94B"/>
  <circle cx="132" cy="199" r="5" fill="#F6E05E"/>

  <!-- Recording UI Elements (Red Dot & Timestamp vibe) -->
  <circle cx="58" cy="157" r="4" fill="#E53E3E"/>
  <rect x="68" y="154" width="24" height="6" rx="3" fill="#E53E3E" opacity="0.8"/>
  
  <!-- Crosshairs / Viewfinder Corners -->
  <path d="M53 168 L53 165 L56 165" stroke="#CBD5E0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M187 168 L187 165 L184 165" stroke="#CBD5E0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M53 182 L53 185 L56 185" stroke="#CBD5E0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M187 182 L187 185 L184 185" stroke="#CBD5E0" stroke-width="2" fill="none" stroke-linecap="round"/>
