<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Trap/Glow Gradient -->
    <radialGradient id="trapGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character shadow -->
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Props -->
  <!-- Floor Grid Lines / Isometric Perspective Hint -->
  <path d="M 0 170 L 240 170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 30 190 L 210 190" stroke="#334155" stroke-width="1" />
  
  <!-- Mysterious Back Alley / Office Wall Corner Architecture -->
  <path d="M 0 0 L 0 170 L 240 170 L 240 0 Z" fill="none" />
  <rect x="25" y="40" width="45" height="60" rx="4" fill="#334155" opacity="0.4" />
  <rect x="170" y="30" width="40" height="80" rx="4" fill="#334155" opacity="0.3" />

  <!-- Glowing Trap Details on Floor (圈套 - Hidden glowing trap mechanism with shiny coin/document bait) -->
  <g transform="translate(120, 185)">
    <!-- Trap activation glow -->
    <ellipse cx="0" cy="0" rx="45" ry="16" fill="url(#trapGlow)" />
    <!-- Trap outer ring / steel circle -->
    <ellipse cx="0" cy="0" rx="36" ry="12" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 3" />
    <ellipse cx="0" cy="0" rx="32" ry="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    
    <!-- The "Bait" - Glowing golden document/contract folder -->
    <g transform="translate(0, -6)">
      <polygon points="-8,-4 8,-4 12,4 -12,4" fill="#fbbf24" />
      <rect x="-5" y="-8" width="10" height="6" rx="1" fill="#fef08a" />
    </g>

    <!-- Trap teeth / springs snapping (suggesting it just triggered) -->
    <path d="M -28 -4 L -22 -14 L -18 -4" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 18 -4 L 22 -14 L 28 -4" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Falling / Stumbling Character (Anh ấy lỡ rơi vào cái bẫy) -->
  <g transform="translate(120, 105)">
    <!-- Character Drop Shadow -->
    <ellipse cx="0" cy="70" rx="22" ry="7" fill="url(#shadowGrad)" />

    <!-- Motion / Speed Lines -->
    <path d="M -30 -10 L -45 -5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 35 -20 L 50 -15" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M -25 15 L -40 25" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Left Leg (stumbling forward) -->
    <path d="M -5 35 L -20 60 L -12 65" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Shoe -->
    <path d="M -16 64 L -8 67 L -10 63 Z" fill="#0f172a" />

    <!-- Right Leg (caught up in the action) -->
    <path d="M 5 35 L 18 55 L 28 50" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Shoe -->
    <path d="M 24 51 L 32 48 L 28 54 Z" fill="#0f172a" />

    <!-- Torso (wearing neat business-casual attire - blue shirt, dark vest/jacket) -->
    <path d="M -12 0 L 12 -5 L 15 38 L -15 38 Z" fill="#3b82f6" />
    <!-- Vest / Jacket Open -->
    <path d="M -12 0 L -3 38 L -15 38 Z" fill="#1e293b" />
    <path d="M 12 -5 L 3 38 L 15 38 Z" fill="#1e293b" />
    <!-- Red Tie (surprised/comic flutter) -->
    <polygon points="0,2 5,18 0,25 -5,18" fill="#ef4444" />

    <!-- Left Arm (flailing backward in surprise) -->
    <path d="M -10 5 L -28 -8 L -38 -2" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand -->
    <circle cx="-40" cy="0" r="4" fill="#fcd34d" />

    <!-- Right Arm (flailing forward, dropping papers) -->
    <path d="M 10 5 L 30 -5 L 42 2" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Hand -->
    <circle cx="44" cy="4" r="4" fill="#fcd34d" />

    <!-- Flying Papers / Documents (Dropped accidentally) -->
    <g transform="translate(35, -15) rotate(25)">
      <rect x="0" y="0" width="10" height="13" rx="1" fill="#f8fafc" />
      <line x1="2" y1="3" x2="8" y2="3" stroke="#cbd5e1" stroke-width="1" />
      <line x1="2" y1="6" x2="6" y2="6" stroke="#cbd5e1" stroke-width="1" />
    </g>
    <g transform="translate(-45, -25) rotate(-15)">
      <rect x="0" y="0" width="8" height="11" rx="1" fill="#f8fafc" />
      <line x1="2" y1="3" x2="6" y2="3" stroke="#cbd5e1" stroke-width="1" />
    </g>

    <!-- Head & Face (Shocked/Surprised Expression) -->
    <g transform="translate(0, -18)">
      <!-- Hair (Stylish dark hair) -->
      <path d="M -13 -2 C -13 -12 -3 -15 4 -12 C 12 -9 13 -2 14 3 C 10 2 6 0 0 1 C -6 0 -10 1 -13 -2 Z" fill="#0f172a" />
      
      <!-- Head Base -->
      <circle cx="0" cy="0" r="12" fill="#fcd34d" />

      <!-- Surprised Eyebrows (Raised high) -->
      <path d="M -7 -5 C -5 -8 -2 -8 0 -6" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 2 -6 C 4 -8 7 -8 9 -5" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

      <!-- Wide Shocked Eyes -->
      <circle cx="-3" cy="-2" r="2.5" fill="#ffffff" />
      <circle cx="-3" cy="-2" r="1" fill="#0f172a" />
      <circle cx="6" cy="-2" r="2.5" fill="#ffffff" />
      <circle cx="6" cy="-2" r="1" fill="#0f172a" />

      <!-- Open "O" Mouth (Shocked realization) -->
      <ellipse cx="1.5" cy="5" rx="3" ry="4" fill="#0f172a" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements & Lighting -->
  <!-- Ambient lighting highlights on floor and corners -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#090d16" opacity="0.6" />
  
  <!-- Subtle warning / dramatic rim light on character edges -->
  <circle cx="120" cy="190" r="30" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.25" />
  
  <!-- Top vignette / atmospheric shadow -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.1" />
</svg>