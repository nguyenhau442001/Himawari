<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="115" r="70" fill="#2D3748" opacity="0.3"/>

  <!-- Documentary / Special Topic (专题片) physical object representation: A professional broadcast/cinema camera pointing towards an educational/documentary subject (marine life theme from context) -->
  
  <!-- Camera Tripod Legs -->
  <path d="M120 135 L95 200" stroke="#4A5568" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 135 L145 200" stroke="#4A5568" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 135 L120 205" stroke="#2D3748" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Camera Body -->
  <g transform="translate(85, 90)">
    <!-- Main Body -->
    <rect x="0" y="10" width="70" height="45" rx="6" fill="#3B82F6"/>
    <!-- Top Handle -->
    <rect x="15" y="0" width="35" height="10" rx="3" fill="#60A5FA"/>
    <!-- Viewfinder/Mic -->
    <rect x="50" y="18" width="16" height="12" rx="2" fill="#1E3A8A"/>
    <rect x="-10" y="20" width="12" height="15" rx="3" fill="#1E3A8A"/>
    <!-- Record Light -->
    <circle cx="58" cy="6" r="3" fill="#EF4444"/>
  </g>

  <!-- Camera Lens -->
  <g transform="translate(145, 107)">
    <rect x="0" y="0" width="22" height="28" rx="3" fill="#1E293B"/>
    <path d="M22 4 L32 0 L32 32 L22 28 Z" fill="#475569"/>
    <!-- Lens Glass Reflection -->
    <ellipse cx="32" cy="16" rx="3" ry="12" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- Focused Subject on Screen/Projection (Whale/Marine life representing the documentary topic) -->
  <g transform="translate(45, 45)">
    <!-- Screen Frame representing a dedicated special broadcast -->
    <rect x="0" y="0" width="60" height="42" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- Documentary content: Whale tail diving into water -->
    <path d="M15 28 C 22 22, 38 22, 45 28 C 42 22, 38 10, 30 12 C 22 10, 18 22, 15 28 Z" fill="#38BDF8"/>
    <!-- Ocean waves line -->
    <path d="M8 32 Q 15 29, 22 32 T 36 32 T 52 32" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Special Focus Target Reticle -->
    <path d="M 5 5 L 12 5 M 5 5 L 5 12" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 55 5 L 48 5 M 55 5 L 55 12" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 5 37 L 12 37 M 5 37 L 5 30" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 55 37 L 48 37 M 55 37 L 55 30" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Connecting beam of light from camera to topic screen (Special focus / 专题 concept) -->
  <polygon points="120,115 105,80 105,70" fill="#F59E0B" opacity="0.15"/>

  <!-- Golden Accent Badge/Marker indicating "Special / Focus" (专) -->
  <circle cx="120" cy="35" r="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <path d="M113 35 L118 40 L128 28" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>