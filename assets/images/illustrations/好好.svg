<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Visual Contrast Representation:
       Left side (Chaotic/Rushed): Messy, scattered, unorganized state.
       Right side (Careful/Diligent - "好好"): Structured, polished, bright, and meticulous state.
       This directly contrasts the adjective/state of "careful, diligent, thoroughly well" vs "slapdash". -->

  <!-- Left: Chaotic/Slapdash State (Faded, smaller, messy) -->
  <g opacity="0.35" transform="translate(15, 0)">
    <!-- Messy papers / careless work -->
    <path d="M45 125L65 115L75 135L55 145Z" fill="#8C939D" />
    <path d="M35 140L55 130L60 148L40 158Z" fill="#656C76" />
    <!-- Jagged careless scribble line -->
    <path d="M42 130L52 140L48 145" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="32" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8C939D">?</text>
  </g>

  <!-- Divider indicating transformation / contrast -->
  <line x1="90" y1="70" x2="90" y2="180" stroke="#2B313D" stroke-dasharray="4 4" stroke-width="2"/>

  <!-- Right: Diligent, Careful, Thorough State ("好好" - Bright Gold/Orange Accent) -->
  <g transform="translate(15, 0)">
    <!-- Desk surface -->
    <rect x="95" y="165" href="#" width="105" height="8" rx="4" fill="#2B313D"/>
    
    <!-- Organized, meticulous stack of books / completed work -->
    <rect x="110" y="145" width="75" height="18" rx="3" fill="#323846"/>
    <rect x="115" y="125" width="65" height="18" rx="3" fill="#3D4455"/>
    <rect x="120" y="105" width="55" height="18" rx="3" fill="#F5A623"/>

    <!-- Precision instrument / magnifying glass / focus icon representing thoroughness -->
    <circle cx="147" cy="75" r="22" fill="none" stroke="#F5A623" stroke-width="5"/>
    <line x1="163" y1="91" x2="182" y2="110" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Checkmark of quality/thoroughness inside the focus lens -->
    <path d="M137 75L144 82L159 66" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sparkles / glowing meticulous effort -->
    <path d="M105 70L108 78L116 81L108 84L105 92L102 84L94 81L102 78Z" fill="#F5A623" opacity="0.9"/>
    <path d="M185 55L187 60L192 62L187 64L185 69L183 64L178 62L183 60Z" fill="#F5A623" opacity="0.7"/>
  </g>

</svg>