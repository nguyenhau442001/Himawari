<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing whispered murmurs -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>
  <ellipse cx="120" cy="180" rx="45" ry="10" fill="#111318" opacity="0.8"/>

  <!-- Person 1 (Left) -->
  <g id="person-left">
    <!-- Body / Suit -->
    <path d="M 60 185 L 60 160 C 60 145, 72 135, 90 135 L 95 135 C 95 145, 90 160, 90 185 Z" fill="#2E3648"/>
    <path d="M 72 135 L 83 135 L 78 165 Z" fill="#F39C12" opacity="0.9"/> <!-- Tie -->
    <!-- Head & Neck -->
    <rect x="75" y="120" width="12" height="20" fill="#E0A96D"/>
    <circle cx="81" cy="105" r="18" fill="#E0A96D"/>
    <!-- Hair -->
    <path d="M 63 102 C 63 90, 75 90, 85 92 C 95 90, 99 100, 99 105 L 95 105 C 95 98, 85 95, 81 95 C 75 95, 67 98, 63 102 Z" fill="#3E4C59"/>
    <!-- Ear -->
    <circle cx="98" cy="106" r="3" fill="#D0985C"/>
    <!-- Eye (skeptical/whispering look) -->
    <line x1="88" y1="103" x2="94" y2="105" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth leaning forward, whispering -->
    <path d="M 95 113 Q 102 113, 105 111" fill="none" stroke="#A85C32" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Person 2 (Right) -->
  <g id="person-right">
    <!-- Body / Suit -->
    <path d="M 180 185 L 180 160 C 180 145, 168 135, 150 135 L 145 135 C 145 145, 150 160, 150 185 Z" fill="#344155"/>
    <path d="M 168 135 L 157 135 L 162 165 Z" fill="#E67E22" opacity="0.9"/> <!-- Tie -->
    <!-- Head & Neck -->
    <rect x="153" y="120" width="12" height="20" fill="#F4C29B"/>
    <circle cx="159" cy="105" r="18" fill="#F4C29B"/>
    <!-- Hair -->
    <path d="M 141 105 C 141 95, 150 92, 159 92 C 168 92, 177 95, 177 105 C 172 103, 165 102, 159 102 C 153 102, 146 103, 141 105 Z" fill="#2C3E50"/>
    <!-- Ear -->
    <circle cx="142" cy="106" r="3" fill="#E2B088"/>
    <!-- Eye -->
    <line x1="152" y1="103" x2="146" y2="105" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth listening/whispering back -->
    <path d="M 145 113 Q 138 113, 135 111" fill="none" stroke="#C47E55" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Interlocking sound/whisper waves (The core semantic visual for "嘀咕" - murmuring/whispering) -->
  <g id="whisper-waves" transform="translate(120, 95)">
    <!-- Left side sound waves emitting from person 1 -->
    <path d="M -15 -10 C -22 -5, -22 5, -15 10" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M -22 -16 C -31 -8, -31 8, -22 16" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Right side sound waves emitting from person 2 -->
    <path d="M 15 -10 C 22 -5, 22 5, 15 10" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 22 -16 C 31 -8, 31 8, 22 16" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Central subtle murmur speech bubbles overlapping discreetly -->
    <path d="M -8 -18 C -14 -18, -14 -8, -8 -8 C -5 -8, -2 -11, -2 -13 C -2 -16, -5 -18, -8 -18 Z" fill="#2E3648" stroke="#F39C12" stroke-width="1.5"/>
    <path d="M 8 -12 C 14 -12, 14 -2, 8 -2 C 5 -2, 2 -5, 2 -7 C 2 -10, 5 -12, 8 -12 Z" fill="#2E3648" stroke="#F39C12" stroke-width="1.5"/>
    
    <!-- Small interactive dots representing low voice / whispering murmurs -->
    <circle cx="-3" cy="-5" r="1.5" fill="#F39C12"/>
    <circle cx="3" cy="-14" r="1.5" fill="#F39C12"/>
  </g>

  <!-- Accent Focus Glow -->
  <circle cx="120" cy="95" r="2" fill="#FFFFFF"/>
</svg>