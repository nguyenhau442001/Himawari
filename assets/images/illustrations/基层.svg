<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight Glow -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Window Grille Clip -->
    <clipPath id="windowClip">
      <rect x="150" y="25" width="60" height="85" rx="6"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Neighborhood Office / Grassroots Community Center -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#334155" rx="4"/>

  <!-- Flooring / Baseboard -->
  <rect x="20" y="170" width="200" height="50" fill="#1e293b"/>
  <rect x="20" y="166" width="200" height="4" fill="#475569"/>

  <!-- Window to local neighborhood (Grassroots setting) -->
  <rect x="150" y="25" width="60" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <g clip-path="url(#windowClip)">
    <rect x="150" y="25" width="60" height="85" fill="url(#windowGlow)"/>
    <!-- Distant cute buildings / trees representing the community level -->
    <path d="M155 85 L165 65 L175 65 L180 85 Z" fill="#1e293b"/>
    <rect x="183" y="70" width="22" height="40" fill="#1e293b"/>
    <circle cx="168" cy="45" r="8" fill="#fbbf24" opacity="0.8"/> <!-- Moon -->
    <!-- Window pane crosses -->
    <line x1="180" y1="25" x2="180" y2="110" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="67" x2="210" y2="67" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Notice board on the back wall (Community interaction props) -->
  <rect x="40" y="30" width="55" height="50" rx="3" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <rect x="46" y="38" width="18" height="14" rx="1" fill="#cbd5e1"/>
  <rect x="68" y="38" width="18" height="22" rx="1" fill="#f8fafc"/>
  <rect x="46" y="56" width="18" height="18" rx="1" fill="#fb923c"/>
  <!-- Push pin -->
  <circle cx="55" cy="35" r="2" fill="#ef4444"/>

  <!-- Filing cabinet / Shelves filled with folders (Denoting front-line administrative work) -->
  <rect x="105" y="35" width="35" height="65" rx="2" fill="#475569"/>
  <line x1="105" y1="55" x2="140" y2="55" stroke="#334155" stroke-width="2"/>
  <line x1="105" y1="75" x2="140" y2="75" stroke="#334155" stroke-width="2"/>
  <rect x="112" y="44" width="8" height="4" rx="1" fill="#94a3b8"/>
  <rect x="112" y="64" width="8" height="4" rx="1" fill="#94a3b8"/>
  <rect x="112" y="84" width="8" height="4" rx="1" fill="#94a3b8"/>

  <!-- Desk & Lamp Lighting Area -->
  <circle cx="90" cy="130" r="80" fill="url(#lampGlow)"/>

  <!-- Wooden Desk -->
  <path d="M 35 150 L 175 150 L 190 175 L 20 175 Z" fill="#64748b"/>
  <rect x="30" y="142" width="150" height="8" rx="2" fill="#94a3b8"/>
  <!-- Desk support legs -->
  <rect x="45" y="175" width="10" height="45" fill="#334155"/>
  <rect x="155" y="175" width="10" height="45" fill="#334155"/>

  <!-- PROPS ON DESK -->
  <!-- Laptop -->
  <path d="M 65 145 L 95 145 L 100 135 L 60 135 Z" fill="#cbd5e1"/>
  <rect x="55" y="145" width="50" height="3" rx="1.5" fill="#94a3b8"/>
  <!-- Stack of documents / grassroots reports -->
  <rect x="125" y="132" width="26" height="12" rx="1" fill="#f8fafc" transform="rotate(-5 125 132)"/>
  <rect x="127" y="137" width="24" height="10" rx="1" fill="#e2e8f0" transform="rotate(-5 127 137)"/>
  <!-- Mug -->
  <rect x="158" y="128" width="12" height="15" rx="3" fill="#38bdf8"/>
  <path d="M 170 132 C 175 132 175 140 170 140" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Gooseneck Desk Lamp -->
  <path d="M 50 142 L 50 120 C 50 100 70 95 75 90" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 68 85 L 82 85 L 88 95 L 62 95 Z" fill="#fbbf24"/>

  <!-- MAIN CHARACTER: Dedicated worker at the grassroots level -->
  <!-- Chair Back -->
  <rect x="72" y="110" width="30" height="50" rx="8" fill="#475569"/>

  <!-- Character Body / Torso (Warm sweater / professional vest indicating local community worker) -->
  <path d="M 65 155 C 62 135 77 125 90 125 C 103 125 118 135 115 155 Z" fill="#10b981"/>
  <!-- Shirt collar -->
  <path d="M 82 125 L 90 135 L 98 125" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="90" cy="140" r="2" fill="#f8fafc"/>
  <circle cx="90" cy="147" r="2" fill="#f8fafc"/>

  <!-- Character Head & Face -->
  <!-- Neck -->
  <rect x="85" y="118" width="10" height="12" fill="#fcd34d"/>
  <!-- Head base -->
  <circle cx="90" cy="102" r="16" fill="#fcd34d"/>

  <!-- Hair Style (Neat, diligent professional look) -->
  <path d="M 74 100 C 74 88 84 86 90 86 C 96 86 106 88 106 100 C 106 102 105 95 102 92 C 98 88 90 89 82 91 C 77 93 74 97 74 100 Z" fill="#1e293b"/>

  <!-- Facial Expressions (Focused, calm, earnest) -->
  <!-- Glasses -->
  <rect x="80" y="96" width="9" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="91" y="96" width="9" height="7" rx="1.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="89" y1="99" x2="91" y2="99" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Eyes (Concentrated) -->
  <circle cx="84.5" cy="99.5" r="1" fill="#1e293b"/>
  <circle cx="95.5" cy="99.5" r="1" fill="#1e293b"/>
  <!-- Smile / Expression -->
  <path d="M 87 108 C 89 110 91 110 93 108" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="79" cy="105" r="3" fill="#f87171" opacity="0.4"/>
  <circle cx="101" cy="105" r="3" fill="#f87171" opacity="0.4"/>

  <!-- Arms actively writing / working -->
  <!-- Left Arm (Holding paper/desk) -->
  <path d="M 68 135 L 75 148 L 85 145" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="85" cy="145" r="4" fill="#fcd34d"/>

  <!-- Right Arm (Holding pen actively over documents) -->
  <path d="M 112 135 L 105 145 L 98 142" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="98" cy="142" r="4" fill="#fcd34d"/>
  <!-- Pen -->
  <line x1="95" y1="140" x2="90" y2="135" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Secondary decorative plant (Adds warmth and organic feel to the grassroots workspace) -->
  <rect x="195" y="145" width="16" height="25" rx="3" fill="#f43f5e"/>
  <ellipse cx="203" cy="145" rx="9" ry="3" fill="#fda4af"/>
  <!-- Plant leaves sprouting -->
  <path d="M 203 142 C 203 130 190 120 192 110 C 194 105 200 115 203 130 Z" fill="#10b981"/>
  <path d="M 203 142 C 203 125 215 115 213 105 C 211 100 205 112 203 130 Z" fill="#34d399"/>
  <path d="M 203 142 C 203 135 203 120 203 110 C 203 105 203 115 203 130 Z" fill="#059669"/>

  <!-- Floor details (rug) -->
  <ellipse cx="90" cy="180" rx="70" ry="15" fill="#475569" opacity="0.4"/>
</svg>