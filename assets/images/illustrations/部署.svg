<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle grid lines to represent strategy/planning map context -->
  <g opacity="0.15" stroke="#4A5568" stroke-width="0.5">
    <line x1="30" y1="60" x2="210" y2="60" stroke-dasharray="4 4"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke-dasharray="4 4"/>
    <line x1="30" y1="180" x2="210" y2="180" stroke-dasharray="4 4"/>
    <line x1="60" y1="30" x2="60" y2="210" stroke-dasharray="4 4"/>
    <line x1="120" y1="30" x2="120" y2="210" stroke-dasharray="4 4"/>
    <line x1="180" y1="30" x2="180" y2="210" stroke-dasharray="4 4"/>
  </g>

  <!-- Holographic / Digital Strategy Table (Deployment Board) -->
  <g transform="translate(120, 165)">
    <ellipse cx="0" cy="0" rx="75" ry="25" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="65" ry="20" fill="#1A202C"/>
    <!-- Projected tactical grid -->
    <ellipse cx="0" cy="-5" rx="50" ry="14" fill="none" stroke="#319795" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Tactical Markers (Deployment units / Plan elements) -->
  <g transform="translate(120, 155)">
    <!-- Target destination marker (Orange/Gold accent for focus) -->
    <path d="M -25 -10 L -25 -25 L -10 -25" fill="none" stroke="#ED8936" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-17" cy="-17" r="4" fill="#ED8936"/>
    <circle cx="-17" cy="-17" r="8" fill="none" stroke="#ED8936" stroke-width="1" opacity="0.5"/>

    <!-- Deployment vector path / motion lines -->
    <path d="M -17 -10 Q 0 5 20 -15" fill="none" stroke="#319795" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="18,-18 24,-14 18,-10" fill="#319795"/>

    <!-- Secondary marker -->
    <circle cx="25" cy="5" r="3" fill="#E2E8F0"/>
    <circle cx="25" cy="5" r="6" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Human Character (Commander / Planner making the deployment) -->
  <g transform="translate(120, 95)">
    <!-- Torso -->
    <path d="M -22 55 L -18 30 C -18 22, 18 22, 18 30 L 22 55 Z" fill="#2B6CB0"/>
    <!-- Collar / Shirt details -->
    <path d="M -8 30 L 0 38 L 8 30" fill="none" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Head -->
    <circle cx="0" cy="5" r="14" fill="#CBD5E0"/>
    <!-- Hair -->
    <path d="M -14 2 C -14 -4, -6 -9, 0 -9 C 6 -9, 14 -4, 14 2 C 10 -1, -10 -1, -14 2 Z" fill="#4A5568"/>

    <!-- Left Arm & Hand (Pointing/Deploying action) -->
    <path d="M -18 35 C -28 35, -38 45, -42 42" fill="none" stroke="#2B6CB0" stroke-width="7" stroke-linecap="round"/>
    <!-- Pointing finger gesture -->
    <circle cx="-44" cy="41" r="3.5" fill="#CBD5E0"/>

    <!-- Right Arm & Hand (Supporting action over the board) -->
    <path d="M 18 35 C 28 38, 35 48, 30 52" fill="none" stroke="#2B6CB0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="28" cy="53" r="3.5" fill="#CBD5E0"/>
  </g>

  <!-- Dynamic Action / Command Waves (Visualizing "bùshǔ" execution and organization) -->
  <g transform="translate(120, 145)">
    <path d="M -45 -10 C -25 -25, 25 -25, 45 -10" fill="none" stroke="#ED8936" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M -30 -2 C -15 -12, 15 -12, 30 -2" fill="none" stroke="#ED8936" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Floating Strategy Nodes (Representing systematic arrangement and planning) -->
  <g transform="translate(120, 35)">
    <!-- Central node -->
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#319795" opacity="0.9"/>
    <circle cx="0" cy="0" r="5" fill="#1A1D24"/>
    
    <!-- Connecting lines to sub-nodes -->
    <line x1="-12" y1="0" x2="-35" y2="15" stroke="#4A5568" stroke-width="1.5"/>
    <line x1="12" y1="0" x2="35" y2="15" stroke="#4A5568" stroke-width="1.5"/>

    <!-- Left sub-node -->
    <circle cx="-35" cy="15" r="6" fill="#ED8936"/>
    <!-- Right sub-node -->
    <circle cx="35" cy="15" r="6" fill="#ED8936"/>
  </g>

</svg>