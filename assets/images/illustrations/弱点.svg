<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Gradients (Strong/Confident) -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Gradients (Nervous/Vulnerable) -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- ENVIRONMENT / CONTEXT PROPS (Office Stage Setting) -->
  <!-- Floor -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="#0b1329" />
  <!-- Back Wall Art/Acoustic Panels -->
  <rect x="30" y="40" width="40" height="70" rx="4" fill="#334155" opacity="0.4" />
  <rect x="170" y="40" width="40" height="70" rx="4" fill="#334155" opacity="0.4" />
  
  <!-- Podium/Presentation Stand -->
  <path d="M90 150 L150 150 L140 195 L100 195 Z" fill="#475569" filter="url(#shadow)" />
  <path d="M85 145 L155 145 L150 153 L90 153 Z" fill="#64748b" />
  <!-- Glass/Microphone on podium -->
  <rect x="110" y="132" width="6" height="15" rx="2" fill="#cbd5e1" opacity="0.8" />
  <ellipse cx="113" cy="132" rx="4" ry="2" fill="#94a3b8" />

  <!-- CHARACTERS REPRESENTING "EVERYONE HAS THEIR VULNERABILITY" -->

  <!-- CHARACTER 1: The Confident Presenter (Left) -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <!-- Shadow beneath -->
    <ellipse cx="25" cy="120" rx="20" ry="6" fill="#000000" opacity="0.4" />
    <!-- Body/Suit -->
    <path d="M10 70 L40 70 L45 120 L5 120 Z" fill="url(#suitGrad)" />
    <!-- Collar & Tie -->
    <polygon points="25,70 20,85 30,85" fill="#f8fafc" />
    <polygon points="25,82 23,105 27,105" fill="#ec4899" />
    <!-- Head -->
    <circle cx="25" cy="45" rx="16" ry="17" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M9 42 C9 25 41 25 41 42 C35 32 15 32 9 42 Z" fill="#334155" />
    <!-- Confident Expression -->
    <path d="M19 45 Q25 50 31 45" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="19" cy="40" r="2" fill="#1e293b" />
    <circle cx="31" cy="40" r="2" fill="#1e293b" />
    <!-- Gesturing Arm -->
    <path d="M10 75 Q-5 85 5 100" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- CHARACTER 2: The Vulnerable/Nervous Speaker at Podium (Center-Right) -->
  <g transform="translate(115, 60)" filter="url(#shadow)">
    <!-- Shadow beneath -->
    <ellipse cx="25" cy="135" rx="22" ry="6" fill="#000000" opacity="0.4" />
    
    <!-- Sweater Body -->
    <path d="M8 85 L42 85 L48 135 L2 135 Z" fill="url(#sweaterGrad)" />
    <!-- Collar -->
    <path d="M15 85 Q25 95 35 85" stroke="#ffedd5" stroke-width="4" fill="none" />
    
    <!-- Head -->
    <circle cx="25" cy="55" rx="17" ry="18" fill="#fcd34d" />
    
    <!-- Nervous Sweat Drop -->
    <path d="M42 50 C42 50 46 56 46 59 C46 61 44 63 42 63 C40 63 38 61 38 59 C38 56 42 50 42 50 Z" fill="#38bdf8" />

    <!-- Hair -->
    <path d="M8 55 C8 35 42 35 42 55 C38 43 12 43 8 55 Z" fill="#78350f" />
    
    <!-- Nervous/Vulnerable Expression (Wobbly mouth, worried eyes) -->
    <path d="M18 60 Q25 55 32 60" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Sweervy worried eyebrows -->
    <path d="M16 48 L21 51" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <path d="M34 48 L29 51" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <circle cx="18" cy="53" r="2" fill="#78350f" />
    <circle cx="32" cy="53" r="2" fill="#78350f" />

    <!-- Trembling/Clutched Hands on Podium Edge -->
    <circle cx="12" cy="95" r="5" fill="#fcd34d" />
    <circle cx="38" cy="95" r="5" fill="#fcd34d" />
  </g>

  <!-- VISUAL METAPHOR FOR "WEAKNESS / VULNERABILITY" -->
  <!-- Subtle glowing fracture/crack line near the vulnerable character -->
  <g transform="translate(140, 110)">
    <path d="M0 0 L8 15 L3 20 L12 35" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="3 2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    <circle cx="12" cy="35" r="3" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- ADDITIONAL SCENERY / AMBIANCE -->
  <!-- Floating ambient light particles representing diversity of traits -->
  <circle cx="60" cy="40" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="180" cy="80" r="3" fill="#fbbf24" opacity="0.5" />
  <circle cx="210" cy="150" r="2.5" fill="#ec4899" opacity="0.6" />
  <circle cx="30" cy="160" r="1.5" fill="#10b981" opacity="0.7" />

  <!-- Soft Vignette / Frame Border overlay for app UI polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>