<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 源于 (Origin / Source):
       Represented as a deep underground spring/aquifer (the source) bubbling up
       and transforming into a clear, vibrant stream of water flowing upward and outward,
       symbolizing "stemming from" or "originating from". -->

  <!-- Glow effect from the source -->
  <circle cx="120" cy="180" r="35" fill="#3B82F6" opacity="0.15"/>
  <circle cx="120" cy="180" r="20" fill="#3B82F6" opacity="0.25"/>

  <!-- Underground Earth Layer -->
  <path d="M 30 170 Q 120 160 210 170 L 210 215 Q 120 220 30 215 Z" fill="#222630"/>
  <!-- Earth texture lines -->
  <path d="M 50 185 Q 90 180 130 188" stroke="#2D3340" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 120 200 Q 160 195 190 202" stroke="#2D3340" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 45 205 Q 75 200 100 207" stroke="#2D3340" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- The Source Basin / Spring Opening (Golden Accent for Focus) -->
  <ellipse cx="120" cy="170" rx="25" ry="10" fill="#F59E0B" opacity="0.3"/>
  <ellipse cx="120" cy="170" rx="18" ry="7" fill="#F59E0B"/>

  <!-- Water Spring Core -->
  <ellipse cx="120" cy="170" rx="10" ry="4" fill="#60A5FA"/>

  <!-- Rising/Emanating Water Streams (Symbol of Origin flowing outward) -->
  <!-- Central upward jet -->
  <path d="M 116 166 C 116 130 112 100 120 70 C 122 62 118 55 120 50" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 120 166 C 120 130 124 100 120 70 C 118 62 122 55 120 50" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Left branching stream -->
  <path d="M 112 168 C 95 150 70 125 55 100" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 95 135 C 80 115 70 100 65 90" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Right branching stream -->
  <path d="M 128 168 C 145 150 170 125 185 100" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 145 135 C 160 115 170 100 175 90" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Droplets / Sparks of origin emanating -->
  <circle cx="120" cy="40" r="3" fill="#93C5FD"/>
  <circle cx="50" cy="92" r="2.5" fill="#93C5FD"/>
  <circle cx="190" cy="92" r="2.5" fill="#93C5FD"/>
  <circle cx="85" cy="115" r="2" fill="#60A5FA"/>
  <circle cx="155" cy="115" r="2" fill="#60A5FA"/>

  <!-- Resulting Life / Bloom at the top (Representing what springs forth) -->
  <path d="M 120 50 C 115 42 110 35 120 25 C 130 35 125 42 120 50 Z" fill="#10B981"/>
  <path d="M 120 50 C 112 47 105 45 100 52 C 105 60 112 55 120 50 Z" fill="#34D399"/>
  <path d="M 120 50 C 128 47 135 45 140 52 C 135 60 128 55 120 50 Z" fill="#34D399"/>
</svg>