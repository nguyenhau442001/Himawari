<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Architectural Background Elements (Subtle skyscraper silhouettes) -->
  <rect x="35" y="70" width="30" height="130" fill="#242933" opacity="0.6"/>
  <rect x="175" y="90" width="30" height="110" fill="#242933" opacity="0.6"/>

  <!-- Main Skyscraper (Representing "tầng cao" / high-rise building) -->
  <g>
    <!-- Building Body -->
    <rect x="75" y="40" width="90" height="160" rx="4" fill="#2D3440"/>
    
    <!-- Glass Facade / Window Grid -->
    <!-- Column 1 -->
    <rect x="85" y="55" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="85" y="85" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="85" y="115" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="85" y="145" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="85" y="175" width="18" height="15" rx="2" fill="#3E4859"/>

    <!-- Column 2 (Highlighted/Glowing high-level executive floors - "cấp cao") -->
    <rect x="111" y="55" width="18" height="22" rx="2" fill="#F39C12" opacity="0.9"/>
    <rect x="111" y="85" width="18" height="22" rx="2" fill="#F39C12" opacity="0.9"/>
    <rect x="111" y="115" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="111" y="145" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="111" y="175" width="18" height="15" rx="2" fill="#3E4859"/>

    <!-- Column 3 -->
    <rect x="137" y="55" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="137" y="85" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="137" y="115" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="137" y="145" width="18" height="22" rx="2" fill="#3E4859"/>
    <rect x="137" y="175" width="18" height="15" rx="2" fill="#3E4859"/>

    <!-- Roof detail / Antenna -->
    <rect x="115" y="28" width="10" height="12" fill="#4E5D73"/>
    <line x1="120" y1="28" x2="120" y2="15" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="13" r="3" fill="#F39C12"/>
  </g>

  <!-- Focus / Elevation Indicator (Stylized upward chevron/arrow framing the upper levels) -->
  <g transform="translate(0, 0)" opacity="0.85">
    <path d="M 60 95 L 68 85 L 76 95" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 164 95 L 172 85 L 180 95" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>