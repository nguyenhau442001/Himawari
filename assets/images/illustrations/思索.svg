<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Outer radiating thought circles/waves -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#FFA726" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFA726" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FFA726" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 4"/>

    <!-- Abstract glowing core representing deep contemplation -->
    <circle cx="0" cy="0" r="28" fill="#1A1D24" stroke="#FFA726" stroke-width="2.5"/>

    <!-- Minimalist side-profile head outline looking left/inward -->
    <path d="M -4 14 
             C -12 14, -18 6, -16 -4 
             C -15 -12, -8 -18, 0 -18 
             C 6 -18, 12 -14, 14 -8 
             C 16 -2, 14 6, 10 12" 
          fill="none" stroke="#E0E6ED" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Nose / Face contour -->
    <path d="M 0 -18 C -3 -10, -8 -2, -4 6" fill="none" stroke="#E0E6ED" stroke-width="3" stroke-linecap="round"/>

    <!-- Glowing focal point / spark of insight inside the mind -->
    <circle cx="-6" cy="-8" r="4" fill="#FFA726"/>
    <circle cx="-6" cy="-8" r="8" fill="#FFA726" fill-opacity="0.3"/>

    <!-- Floating conceptual nodes representing thoughts -->
    <circle cx="-32" cy="-28" r="4" fill="#FFA726"/>
    <path d="M -26 -24 L -16 -16" stroke="#FFA726" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

    <circle cx="36" cy="-18" r="3" fill="#64B5F6"/>
    <path d="M 28 -14 L 14 -10" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

    <circle cx="24" cy="28" r="5" fill="#FFA726"/>
    <path d="M 18 20 L 8 10" stroke="#FFA726" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

    <circle cx="-28" cy="22" r="3.5" fill="#64B5F6"/>
    <path d="M -22 16 L -10 10" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
</svg>