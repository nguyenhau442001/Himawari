<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Factory Interior (车间 - Workshop) -->
  <!-- Background Wall & Floor Grid -->
  <path d="M30 60 H210 V180 H30 Z" fill="#222733"/>
  <!-- Floor perspective lines -->
  <path d="M30 180 L70 210 H170 L210 180" fill="#2C3342"/>
  <path d="M70 180 V210 M120 180 V210 M170 180 V210" stroke="#1A1D24" stroke-width="2"/>
  <line x1="30" y1="120" x2="210" y2="120" stroke="#1A1D24" stroke-width="2"/>

  <!-- Overhead Industrial Crane / Beams -->
  <rect x="40" y="40" width="160" height="8" rx="4" fill="#3E4758"/>
  <rect x="90" y="48" width="60" height="12" fill="#2C3342"/>
  <!-- Crane Hook -->
  <line x1="120" y1="60" x2="120" y2="90" stroke="#D18338" stroke-width="3"/>
  <path d="M114 90 C114 96 126 96 126 90" fill="none" stroke="#D18338" stroke-width="3" stroke-linecap="round"/>

  <!-- Industrial Machinery / CNC Machine -->
  <!-- Main Body -->
  <rect x="50" y="100" width="80" height="80" rx="6" fill="#343B48"/>
  <rect x="60" y="110" width="60" height="40" rx="4" fill="#222733"/>
  <!-- Machine screen/glow -->
  <rect x="70" y="120" width="40" height="20" rx="2" fill="#D18338" fill-opacity="0.2"/>
  <line x1="75" y1="127" x2="95" y2="127" stroke="#D18338" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="133" x2="85" y2="133" stroke="#D18338" stroke-width="2" stroke-linecap="round"/>
  <!-- Control buttons -->
  <circle x="70" y="160" r="4" fill="#EF5350"/>
  <circle x="85" y="160" r="4" fill="#66BB6A"/>
  <circle x="100" y="160" r="4" fill="#FFA726"/>

  <!-- Robotic Arm -->
  <path d="M150 160 L140 120 L165 100 L185 115" fill="none" stroke="#525F75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="160" r="6" fill="#D18338"/>
  <circle cx="140" cy="120" r="5" fill="#D18338"/>
  <circle cx="165" cy="100" r="5" fill="#D18338"/>
  <!-- Robotic Toolhead -->
  <path d="M185 115 L195 125" stroke="#D18338" stroke-width="6" stroke-linecap="round"/>

  <!-- Workpiece / Gear on table -->
  <circle cx="90" cy="180" r="14" fill="#525F75"/>
  <circle cx="90" cy="180" r="6" fill="#222733"/>
  <rect x="87" y="162" width="6" height="36" fill="#525F75"/>
  <rect x="72" y="177" width="36" height="6" fill="#525F75"/>

  <!-- Hazard / Warning Sign (Contextual link to safety: "车间内严禁吸烟") -->
  <g transform="translate(165, 45)">
    <polygon points="15,0 30,26 0,26" fill="#FFA726"/>
    <text x="15" y="21" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1D24" text-anchor="middle">!</text>
  </g>

  <!-- Ambient Lighting / Glow highlights -->
  <path d="M30 60 L120 100 L210 60" fill="none" stroke="#D18338" stroke-width="1" stroke-opacity="0.3"/>
</svg>