<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for sorrow/melancholy atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.3" filter="blur(20px)"/>

  <!-- Character representing "悲伤" (Sorrow/Grief) -->
  <g transform="translate(0, 10)">
    <!-- Drooping shoulders / slumped posture body outline -->
    <path d="M 85 140 C 85 125 95 115 120 115 C 145 115 155 125 155 140 L 165 195 C 165 200 160 205 155 205 L 85 205 C 80 205 75 200 75 195 Z" fill="#2B3648"/>
    
    <!-- Head slumped forward -->
    <circle cx="120" cy="95" r="32" fill="#E2E8F0"/>
    
    <!-- Hair style hiding eyes/expression to emphasize sorrow -->
    <path d="M 88 85 C 90 70 105 60 120 60 C 135 60 150 70 152 85 C 145 88 135 92 120 92 C 105 92 95 88 88 85 Z" fill="#4A5568"/>
    
    <!-- Downcast face profile / shadow -->
    <path d="M 112 95 C 112 99 116 102 120 102 C 124 102 128 99 128 95" stroke="#718096" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Single prominent tear dropping down -->
    <g>
      <path d="M 120 108 C 120 108 116 116 116 120 C 116 122.2 117.8 124 120 124 C 122.2 124 124 122.2 124 120 C 124 116 120 108 120 108 Z" fill="#63B3ED"/>
      <!-- Tear highlight -->
      <circle cx="118.5" cy="119" r="0.8" fill="#FFFFFF"/>
    </g>

    <!-- Hands resting or covering face subtly (lowered head gesture) -->
    <path d="M 100 125 C 105 120 115 120 120 125 C 125 120 135 120 140 125" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Accent design element: minimalist drooping raindrops representing grief/sadness -->
  <g opacity="0.6">
    <line x1="60" y1="80" x2="56" y2="92" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="90" x2="176" y2="102" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="130" x2="66" y2="142" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>