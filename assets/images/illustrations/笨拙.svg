<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#475569"/>
  <rect x="50" y="175" width="10" height="50" fill="#334155"/>
  <rect x="180" y="175" width="10" height="50" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <path d="M-30 60 Q-30 20 0 20 T30 60" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-5" r="3" fill="#1e293b"/>
    <circle cx="8" cy="-5" r="3" fill="#1e293b"/>
    <!-- Mouth -->
    <path d="M-5 10 Q0 15 5 10" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Arms/Action -->
  <path d="M90 160 L70 120" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 160 L170 130" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Falling Objects -->
  <circle cx="70" cy="110" r="8" fill="#ec4899"/>
  <rect x="165" y="115" width="12" height="12" rx="2" fill="#fb923c"/>
  <path d="M175 125 L185 115" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Spilled Coffee/Liquid -->
  <path d="M80 175 Q100 190 120 175" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Background Details -->
  <circle cx="200" cy="50" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M180 50 L220 50 M200 30 L200 70" stroke="#334155" stroke-width="2"/>
</svg>