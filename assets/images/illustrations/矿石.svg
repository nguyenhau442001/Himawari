<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mine Entrance / Background -->
  <path d="M40 240 L40 120 C40 80 80 60 120 60 C160 60 200 80 200 120 L200 240 Z" fill="#334155"/>
  <path d="M50 240 L50 125 C50 90 85 70 120 70 C155 70 190 90 190 125 L190 240 Z" fill="#0f172a"/>
  
  <!-- Ore Piles -->
  <circle cx="70" cy="210" r="25" fill="#475569"/>
  <circle cx="90" cy="220" r="20" fill="#64748b"/>
  <circle cx="110" cy="215" r="15" fill="#475569"/>
  
  <!-- Ore Details (Golden/Amber accents) -->
  <path d="M65 200 L75 195 L80 205 L70 210 Z" fill="#f59e0b"/>
  <path d="M105 210 L115 205 L120 215 L110 220 Z" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(140, 140)">
    <!-- Body -->
    <path d="M0 0 L20 0 L15 80 L-15 80 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="15" fill="#fde68a"/>
    <!-- Hard Hat -->
    <path d="M-18 -25 L18 -25 C20 -35 10 -45 0 -45 C-10 -45 -20 -35 -18 -25 Z" fill="#fb923c"/>
    <!-- Arm holding pickaxe -->
    <path d="M15 10 L35 30" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 30 L45 20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 35 L40 25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Ground/Foreground -->
  <path d="M0 220 Q120 200 240 220 L240 240 L0 240 Z" fill="#1e293b"/>
  
  <!-- Sparkles/Action -->
  <circle cx="160" cy="160" r="2" fill="#10b981"/>
  <circle cx="170" cy="150" r="3" fill="#ec4899"/>
</svg>