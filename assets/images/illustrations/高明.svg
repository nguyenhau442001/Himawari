<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Glow Gradient for Smart Idea/Invention -->
    <radialGradient id="idea-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT / ARCHITECTURE -->
  <!-- Back Wall Details -->
  <rect x="24" y="20" width="192" height="155" rx="6" fill="#1b2a47" />
  
  <!-- Large Window showing city skyline at night -->
  <rect x="140" y="35" width="60" height="90" rx="4" fill="#0f172a" />
  <path d="M140 35 L200 35 L200 125 L140 125 Z" fill="url(#window-light)" />
  <!-- Window Grid -->
  <line x1="170" y1="35" x2="170" y2="125" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="80" x2="200" y2="80" stroke="#1e293b" stroke-width="2" />
  <!-- City Skyline Silhouette through Window -->
  <path d="M145 125 L145 105 L150 105 L150 95 L155 95 L155 125 Z" fill="#253858" />
  <path d="M160 125 L160 85 L166 85 L166 125 Z" fill="#253858" />
  <path d="M172 125 L172 75 L182 75 L182 125 Z" fill="#253858" />
  <path d="M188 125 L188 95 L195 95 L195 125 Z" fill="#253858" />
  <!-- Tiny City Lights -->
  <circle cx="177" cy="85" r="1" fill="#fbbf24" />
  <circle cx="163" cy="95" r="1" fill="#38bdf8" />
  <circle cx="191" cy="105" r="1" fill="#fbbf24" />

  <!-- Bookshelf on Back Wall -->
  <rect x="40" y="40" width="50" height="6" rx="2" fill="#334155" />
  <rect x="48" y="25" width="8" height="15" rx="1" fill="#ec4899" />
  <rect x="58" y="28" width="6" height="12" rx="1" fill="#38bdf8" />
  <rect x="66" y="22" width="10" height="18" rx="1" fill="#10b981" />

  <!-- Smart Solution / Project Board (The "Brilliant Method" Blueprint) -->
  <rect x="40" y="55" width="55" height="40" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <!-- Clever schematic lines on board representing a smart puzzle solution -->
  <circle cx="55" cy="70" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="80" cy="70" r="6" fill="none" stroke="#10b981" stroke-width="1.5" />
  <path d="M61 70 L74 70" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M55 76 L67 87 L80 76" fill="none" stroke="#ec4899" stroke-width="1.5" />

  <!-- Large Wooden Desk Surface -->
  <path d="M15 175 C15 172 18 170 22 170 L218 170 C222 170 225 172 225 175 L225 185 C225 188 222 190 218 190 L22 190 C18 190 15 188 15 185 Z" fill="#334155" />
  <rect x="25" y="190" width="15" height="40" rx="3" fill="#1e293b" />
  <rect x="200" y="190" width="15" height="40" rx="3" fill="#1e293b" />

  <!-- DESK PROPS: The Clever Invention/Puzzle Model & Laptop -->
  <!-- Laptop -->
  <path d="M155 170 L195 170 L205 174 L145 174 Z" fill="#64748b" />
  <rect x="150" y="145" width="48" height="26" rx="3" fill="#475569" />
  <rect x="153" y="148" width="42" height="20" rx="2" fill="#0f172a" />
  <!-- UI graphs on laptop screen -->
  <polyline points="157,162 163,158 169,163 175,153 181,159 189,150" fill="none" stroke="#10b981" stroke-width="1.5" />

  <!-- The "Clever Method" Model (Interlocking Gear/Puzzle Mechanism on desk) -->
  <circle cx="110" cy="162" r="12" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 3" filter="url(#shadow)" />
  <circle cx="92" cy="162" r="9" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 2" />
  <circle cx="110" cy="162" r="4" fill="#fb923c" />
  <circle cx="92" cy="162" r="3" fill="#38bdf8" />
  <!-- Connection bridge representing ingenuity -->
  <path d="M101 159 L101 165" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />

  <!-- Desk Lamp -->
  <path d="M195 140 L205 170 L215 170 L205 140 Z" fill="#475569" />
  <path d="M190 120 C190 110 205 110 208 120 Z" fill="#fbbf24" filter="url(#shadow)" />

  <!-- MAIN CHARACTER: Smart, Creative Inventor / Professional -->
  <!-- Character Body / Torso (Leaning forward with confidence) -->
  <g transform="translate(0, 5)">
    <!-- Chair Back -->
    <rect x="68" y="115" width="22" height="55" rx="8" fill="#475569" />

    <!-- Brilliant Idea Glow Effect behind head -->
    <circle cx="95" cy="100" r="35" fill="url(#idea-glow)" />

    <!-- Torso (Teal Hoodie/Shirt) -->
    <path d="M75 168 C75 145 85 135 105 135 C125 135 135 145 135 168 Z" fill="#0d9488" filter="url(#shadow)" />
    <!-- Collar -->
    <path d="M92 135 L105 145 L118 135 Z" fill="#0f766e" />

    <!-- Neck -->
    <rect x="98" y="122" width="14" height="16" rx="4" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="105" cy="108" r="18" fill="#fbcfe8" />

    <!-- Hair (Stylish dark slate modern cut) -->
    <path d="M87 106 C87 93 94 88 105 88 C118 88 124 94 124 108 L124 112 L120 112 C120 100 114 92 105 92 C95 92 91 100 91 112 L87 112 Z" fill="#1e293b" />
    <path d="M100 89 C105 86 112 87 116 90 C112 88 105 88 100 89 Z" fill="#334155" />

    <!-- Expressive Face (Smart, Confident Smile & Sparkling Eyes) -->
    <!-- Eyebrows (Confident tilt) -->
    <path d="M96 102 Q100 100 104 102" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M108 102 Q112 100 116 102" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="100" cy="107" r="2" fill="#1e293b" />
    <circle cx="112" cy="107" r="2" fill="#1e293b" />
    <!-- Sparkle in eyes for brilliance -->
    <circle cx="101" cy="106" r="0.7" fill="#ffffff" />
    <circle cx="113" cy="106" r="0.7" fill="#ffffff" />
    <!-- Clever Smirk / Smile -->
    <path d="M101 115 Q106 120 111 114" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="94" cy="112" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="118" cy="112" r="3" fill="#f43f5e" opacity="0.3" />

    <!-- ARMS & HANDS (Interacting smartly with the desk model) -->
    <!-- Left Arm (Resting back or stabilizing) -->
    <path d="M78 145 L88 165 L78 170" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="76" cy="171" r="5" fill="#fbcfe8" />

    <!-- Right Arm (Pointing cleverly / presenting the ingenious solution) -->
    <path d="M128 142 L115 158 L104 158" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand pointing at the puzzle model -->
    <circle cx="100" cy="158" r="4.5" fill="#fbcfe8" />
    <path d="M96 158 L92 158" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- LIGHTBULB MOMENT / SPARK OF GENIUS SYMBOLS (Floating near head to emphasize "Gāomíng" / brilliant talent) -->
  <g transform="translate(145, 75)" filter="url(#shadow)">
    <!-- Lightbulb body -->
    <path d="M0 0 C-8 -8 -8 -18 0 -22 C8 -18 8 -8 0 0 Z" fill="#fbbf24" />
    <!-- Bulb base -->
    <rect x="-3" y="1" width="6" height="4" rx="1" fill="#94a3b8" />
    <!-- Glow rays -->
    <line x1="0" y1="-28" x2="0" y2="-32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <line x1="-10" y1="-22" x2="-13" y2="-25" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="-22" x2="13" y2="-25" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sparkle accents representing brilliant insight -->
  <path d="M45 110 L48 118 L56 121 L48 124 L45 132 L42 124 L34 121 L42 118 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M125 50 L127 55 L132 57 L127 59 L125 64 L123 59 L118 57 L123 55 Z" fill="#fbbf24" opacity="0.9" />
  <circle cx="185" cy="55" r="2.5" fill="#ec4899" />
  <circle cx="35" cy="85" r="2" fill="#10b981" />

  <!-- Foreground Atmospheric Elements / Vignette Borders -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>