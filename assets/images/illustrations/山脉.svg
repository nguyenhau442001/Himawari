<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Mountain Gradient - Far -->
    <linearGradient id="mountFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Mountain Gradient - Mid -->
    <linearGradient id="mountMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Mountain Gradient - Near -->
    <linearGradient id="mountNear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Sunset Glow -->
    <radialGradient id="sunGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Sky & Atmosphere -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- Celestial Body / Sun -->
  <circle cx="185" cy="65" r="18" fill="#fbbf24" opacity="0.9"/>
  <circle cx="185" cy="65" r="26" fill="#fbbf24" opacity="0.2"/>

  <!-- Atmospheric Clouds / Haze -->
  <path d="M-10,90 Q30,70 80,90 T180,85 T250,95 L250,140 L-10,140 Z" fill="#38bdf8" opacity="0.08"/>

  <!-- ENDLESS MOUNTAIN RANGE (山脉 - Shānmài) -->
  <!-- Far Mountain Ridge (Fading into horizon) -->
  <path d="M-10,120 L25,95 L65,115 L110,85 L155,105 L200,80 L250,100 L250,180 L-10,180 Z" fill="url(#mountFar)"/>

  <!-- Mid Mountain Ridge (Stretching across hundreds of km) -->
  <path d="M-10,135 L40,105 L85,130 L130,95 L175,120 L220,90 L250,110 L250,190 L-10,190 Z" fill="url(#mountMid)"/>

  <!-- Foreground Mountain Ridge with Snow Caps -->
  <path d="M-10,150 L50,120 L95,145 L140,105 L190,135 L240,105 L250,210 L-10,210 Z" fill="url(#mountNear)"/>
  
  <!-- Snow peaks for foreground range -->
  <path d="M140,105 L150,120 L133,122 Z" fill="#f8fafc" opacity="0.9"/>
  <path d="M190,135 L198,146 L182,145 Z" fill="#f8fafc" opacity="0.8"/>
  <path d="M240,105 L248,118 L233,115 Z" fill="#f8fafc" opacity="0.85"/>

  <!-- Distance indicator / Perspective lines (subtle winding path/river in valley) -->
  <path d="M110,138 Q130,142 150,135 T190,130" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- FOREGROUND CLIFF / OBSERVATION PLATFORM -->
  <path d="M-10,195 Q60,185 120,195 T250,185 L250,240 L-10,240 Z" fill="#0f172a"/>
  <path d="M0,200 Q70,190 140,205 T240,195 L240,240 L0,240 Z" fill="#1e293b"/>

  <!-- TRAVELERS / OBSERVERS (Providing human scale to the immense mountain range) -->
  <!-- Character 1 (Standing, pointing at the vast horizon) -->
  <g transform="translate(75, 175)">
    <!-- Body -->
    <path d="M10,18 L15,32 L8,33 L5,18 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="11" cy="11" r="5" fill="#fbcfe8"/>
    <!-- Hat -->
    <path d="M5,8 Q11,5 17,8 L16,9 L6,9 Z" fill="#ef4444"/>
    <!-- Arm pointing -->
    <path d="M12,19 L22,14" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="9" y1="32" x2="7" y2="42" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="13" y1="32" x2="15" y2="42" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Sitting/Leaning with a backpack, looking out) -->
  <g transform="translate(50, 185)">
    <!-- Backpack -->
    <rect x="2" y="10" width="8" height="12" rx="2" fill="#38bdf8"/>
    <!-- Body -->
    <path d="M8,12 L14,24 L7,26 L5,15 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="10" cy="7" r="4.5" fill="#fbcfe8"/>
    <!-- Legs -->
    <line x1="10" y1="25" x2="16" y2="30" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Hiking/Context Props on the platform -->
  <!-- Telescope/Binocular on a tripod -->
  <g transform="translate(110, 180)">
    <line x1="5" y1="18" x2="0" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="5" y1="18" x2="10" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="5" y1="18" x2="5" y2="32" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Scope body -->
    <path d="M-2,15 L12,17 L11,14 L-3,12 Z" fill="#cbd5e1"/>
    <circle cx="5" cy="11" r="3" fill="#64748b"/>
  </g>

  <!-- Hiking Pole & Map Pack -->
  <line x1="30" y1="190" x2="26" y2="215" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M25,200 L32,204 L28,210 Z" fill="#f43f5e"/>

  <!-- Distance birds for scale & depth -->
  <path d="M160,70 Q165,65 170,70 Q175,65 180,70 Q175,73 170,70 Q165,73 160,70 Z" fill="#94a3b8" opacity="0.6" transform="scale(0.6) translate(100, 30)"/>
  <path d="M160,70 Q165,65 170,70 Q175,65 180,70 Q175,73 170,70 Q165,73 160,70 Z" fill="#94a3b8" opacity="0.5" transform="scale(0.4) translate(220, 80)"/>

</svg>