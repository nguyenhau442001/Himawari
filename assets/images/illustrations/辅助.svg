<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="holoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment / Background Room details -->
  <!-- Window / Night City View -->
  <g opacity="0.4">
    <rect x="160" y="30" width="55" height="70" rx="4" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <rect x="168" y="38" width="16" height="24" fill="#38bdf8" opacity="0.6"/>
    <rect x="191" y="38" width="16" height="24" fill="#f59e0b" opacity="0.4"/>
    <rect x="168" y="68" width="16" height="24" fill="#f59e0b" opacity="0.5"/>
    <rect x="191" y="68" width="16" height="24" fill="#38bdf8" opacity="0.3"/>
  </g>
  
  <!-- Wall Shelf with props -->
  <path d="M25 65 L95 65" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <rect x="35" y="48" width="12" height="17" rx="2" fill="#ec4899"/>
  <rect x="50" y="43" width="14" height="22" rx="2" fill="#38bdf8"/>
  <circle cx="75" cy="53" r="8" fill="#10b981"/>

  <!-- Hanging Lamp -->
  <path d="M110 10 L110 35" stroke="#64748b" stroke-width="2"/>
  <path d="M95 35 L125 35 L130 45 L90 45 Z" fill="#64748b"/>
  <path d="M95 45 L125 45" stroke="#fef08a" stroke-width="3" filter="url(#glow)"/>
  <!-- Light Cone -->
  <polygon points="110,45 60,165 160,165" fill="#fef08a" opacity="0.06"/>

  <!-- Back Wall & Floor separation -->
  <line x1="0" y1="165" x2="240" y2="165" stroke="#334155" stroke-width="2"/>

  <!-- Desk & Workspace Surface -->
  <path d="M15 165 L225 165 L210 205 L30 205 Z" fill="url(#deskGrad)"/>
  <path d="M15 165 L225 165" stroke="#64748b" stroke-width="1.5"/>

  <!-- Character: Creator / Worker -->
  <!-- Chair Back -->
  <rect x="80" y="105" width="30" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Character Body / Torso -->
  <path d="M75 165 C75 135 115 135 115 165 Z" fill="#6366f1"/>
  <!-- Character Neck & Head -->
  <rect x="91" y="118" width="8" height="15" fill="#fbcfe8"/>
  <circle cx="95" cy="110" r="14" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M81 108 C81 98 109 98 109 108 C109 113 105 112 105 112 C105 112 99 103 91 107 C87 109 81 108 81 108 Z" fill="#334155"/>

  <!-- Character Arms (Interacting with Assistant Tool) -->
  <path d="M80 145 Q65 155 68 168" stroke="#6366f1" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="68" cy="168" r="4" fill="#fbcfe8"/>

  <path d="M110 145 Q125 155 120 168" stroke="#6366f1" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="168" r="4" fill="#fbcfe8"/>

  <!-- THE ASSISTANT TOOL (Holographic / Smart Projector & Robotic Arm / Constructing the Task) -->
  <!-- Projector Base on Desk -->
  <rect x="125" y="175" width="36" height="12" rx="3" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="143" cy="175" r="4" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Holographic Projection Cone / Beam -->
  <polygon points="143,175 100,110 186,110" fill="url(#holoGrad)"/>
  
  <!-- Floating Holographic Elements (Representing the "Task" being assisted/completed) -->
  <!-- Central floating holographic UI / Task Board -->
  <g transform="translate(112, 100)">
    <rect x="0" y="0" width="62" height="42" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Task items inside hologram -->
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <line x1="22" y1="12" x2="50" y2="12" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <circle cx="12" cy="24" r="4" fill="#10b981"/>
    <line x1="22" y1="24" x2="42" y2="24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="12" cy="36" r="4" fill="#f59e0b"/>
    <line x1="22" y1="36" x2="46" y2="36" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Assisting Robotic Arm / Constructing Element (The 'Assistant' in action) -->
  <g filter="url(#glow)">
    <path d="M165 170 L175 130 L160 115" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="165" cy="170" r="4" fill="#fb923c"/>
    <circle cx="175" cy="130" r="3" fill="#fb923c"/>
    <!-- Robotic Claw supporting / pointing at the task -->
    <path d="M160 115 L152 110 M160 115 L156 122" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Sparkles / Assistive magic dots -->
    <circle cx="148" cy="105" r="2.5" fill="#fef08a"/>
    <circle cx="130" cy="95" r="2" fill="#38bdf8"/>
    <circle cx="178" cy="98" r="2" fill="#10b981"/>
  </g>

  <!-- Foreground Desk Props for Rich Context -->
  <!-- Coffee Mug -->
  <rect x="45" y="175" width="14" height="18" rx="3" fill="#fbbf24"/>
  <path d="M59 180 C63 180 63 188 59 190" stroke="#fbbf24" stroke-width="2" fill="none"/>
  
  <!-- Notebook / Papers -->
  <polygon points="180,185 210,178 218,195 188,202" fill="#f8fafc"/>
  <line x1="188" y1="187" x2="204" y2="183" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="191" y1="194" x2="207" y2="190" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Expressive Character Face (Happy, confident as task is supported) -->
  <path d="M91 114 Q95 119 99 114" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Sparkle in eyes -->
  <circle cx="92" cy="109" r="1.5" fill="#1e293b"/>
  <circle cx="98" cy="109" r="1.5" fill="#1e293b"/>
  <!-- Cheeks -->
  <circle cx="89" cy="113" r="2" fill="#fda4af" opacity="0.6"/>
  <circle cx="101" cy="113" r="2" fill="#fda4af" opacity="0.6"/>
</svg>