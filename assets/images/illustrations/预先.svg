<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Timeline Path -->
  <path d="M40 180 L200 180" stroke="#3A3F4B" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Progression Markers -->
  <circle cx="60" cy="180" r="6" fill="#3A3F4B"/>
  <circle cx="120" cy="180" r="6" fill="#3A3F4B"/>
  
  <!-- The "Pre-action" Event (The focus of "预先") -->
  <g>
    <rect x="150" y="100" width="40" height="60" rx="4" fill="#FFB86C"/>
    <rect x="155" y="110" width="30" height="4" rx="2" fill="#1A1D24"/>
    <rect x="155" y="120" width="30" height="4" rx="2" fill="#1A1D24"/>
    <rect x="155" y="130" width="20" height="4" rx="2" fill="#1A1D24"/>
    
    <!-- Notification Signal -->
    <path d="M170 90 L170 70 M165 75 L170 70 L175 75" stroke="#FFB86C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="170" cy="65" r="4" fill="#FFB86C"/>
  </g>
  
  <!-- Future Event Marker -->
  <g>
    <rect x="180" y="160" width="20" height="20" rx="2" fill="#6272A4"/>
    <path d="M185 165 L195 175 M195 165 L185 175" stroke="#1A1D24" stroke-width="2"/>
  </g>
  
  <!-- Causality Arrow -->
  <path d="M170 100 L170 180" stroke="#FFB86C" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Visual Metaphor: Preparation/Anticipation -->
  <path d="M80 140 C 90 120, 110 120, 120 140" stroke="#FFB86C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="130" r="2" fill="#FFB86C"/>
</svg>