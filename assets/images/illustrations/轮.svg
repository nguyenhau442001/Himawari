<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Progression Pathway (Escalation / Tournament Rounds) -->
    <!-- Background Track -->
    <path d="M 30 160 C 70 160, 80 100, 110 100 C 140 100, 150 40, 190 40" fill="none" stroke="#2A2F3D" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Active Progression / Next Stage Line (Gold Accent) -->
    <path d="M 110 100 C 140 100, 150 40, 190 40" fill="none" stroke="#F39C12" stroke-width="8" stroke-linecap="round"/>

    <!-- Stage 1 Node (Past Round) -->
    <circle cx="30" cy="160" r="14" fill="#2A2F3D"/>
    <circle cx="30" cy="160" r="6" fill="#4E5D6C"/>

    <!-- Stage 2 Node (Current/Transition Round) -->
    <circle cx="110" cy="100" r="16" fill="#1A1D24" stroke="#F39C12" stroke-width="4"/>
    <circle cx="110" cy="100" r="6" fill="#F39C12"/>

    <!-- Stage 3 Node (Next Round / Peak Target) -->
    <circle cx="190" cy="40" r="20" fill="#F39C12" opacity="0.2"/>
    <circle cx="190" cy="40" r="14" fill="#F39C12"/>
    <!-- Trophy / Pinnacle Icon inside final stage -->
    <path d="M 185 34 L 195 34 L 193 42 C 193 44, 191 46, 190 46 C 189 46, 187 44, 187 42 Z" fill="#1A1D24"/>
    <path d="M 184 32 H 196 V 34 H 184 Z" fill="#1A1D24"/>

    <!-- Cyclic Rotation / Turn Metaphor (Abstract subtle rings around milestones) -->
    <!-- Orbit 1 -->
    <path d="M 95 85 A 22 22 0 0 1 125 115" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="125" cy="115" r="3" fill="#F39C12"/>

    <!-- Orbit 2 (Final stage escalation ring) -->
    <path d="M 170 20 A 28 28 0 0 1 210 60" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="210" cy="60" r="3" fill="#F39C12"/>

    <!-- Upward Momentum Arrows (Escalation / Progression) -->
    <g transform="translate(145, 60) rotate(-30)" opacity="0.8">
      <path d="M 0 0 L 12 0 M 8 -4 L 12 0 L 8 4" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(65, 120) rotate(-35)" opacity="0.5">
      <path d="M 0 0 L 10 0 M 6 -3 L 10 0 L 6 3" fill="none" stroke="#4E5D6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Base Platform / Foundation -->
    <rect x="15" y="195" width="186" height="6" rx="3" fill="#2A2F3D"/>
    
    <!-- Step markers / nodes on base -->
    <circle cx="30" cy="198" r="2" fill="#4E5D6C"/>
    <circle cx="110" cy="198" r="2" fill="#4E5D6C"/>
    <circle cx="190" cy="198" r="2" fill="#4E5D6C"/>
  </g>
</svg>