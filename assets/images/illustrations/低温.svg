<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow indicating low temperature / cold zone -->
  <circle cx="120" cy="125" r="75" fill="#22304A" opacity="0.4"/>
  
  <!-- Refrigerator / Cold Storage Unit (Physical Object representing "低温" place) -->
  <!-- Outer Cabinet -->
  <rect x="75" y="45" width="90" height="150" rx="10" fill="#2E384D" stroke="#4A5A75" stroke-width="3"/>
  
  <!-- Inner compartment visible through frost/door seam -->
  <line x1="75" y1="105" x2="165" y2="105" stroke="#1A1D24" stroke-width="3"/>
  
  <!-- Handles -->
  <rect x="145" y="70" width="6" height="20" rx="3" fill="#64B5F6"/>
  <rect x="145" y="130" width="6" height="20" rx="3" fill="#64B5F6"/>
  
  <!-- Ice / Frost crystals emphasizing "Low Temperature" -->
  <path d="M95 75 L100 85 L90 85 Z" fill="#E3F2FD"/>
  <path d="M120 135 L123 143 L117 143 Z" fill="#E3F2FD"/>
  
  <!-- Thermometer showing low temperature (Blue liquid, low level) -->
  <g transform="translate(42, 75)">
    <!-- Thermometer Body -->
    <rect x="0" y="0" width="12" height="70" rx="6" fill="#2E384D" stroke="#64B5F6" stroke-width="2"/>
    <!-- Bulb at bottom -->
    <circle cx="6" cy="65" r="8" fill="#64B5F6" stroke="#2E384D" stroke-width="1"/>
    <!-- Low mercury level -->
    <rect x="4" y="50" width="4" height="15" rx="2" fill="#64B5F6"/>
    <!-- Cold marker dashes -->
    <line x1="13" y1="20" x2="17" y2="20" stroke="#8A9BA8" stroke-width="2"/>
    <line x1="13" y1="35" x2="17" y2="35" stroke="#8A9BA8" stroke-width="2"/>
    <line x1="13" y1="50" x2="17" y2="50" stroke="#64B5F6" stroke-width="2"/>
  </g>
  
  <!-- Snowflake icon floating nearby to reinforce cold/low temperature concept -->
  <g transform="translate(180, 85)" stroke="#64B5F6" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="15" x2="30" y2="15"/>
    <line x1="15" y1="0" x2="15" y2="30"/>
    <line x1="4" y1="4" x2="26" y2="26"/>
    <line x1="4" y1="26" x2="26" y2="4"/>
    <circle cx="15" cy="15" r="3" fill="#1A1D24"/>
  </g>
  
  <!-- Medical cross on refrigerator door to contextualize pharmaceutical storage ("这种药要放在低温的地方") -->
  <g transform="translate(100, 70)">
    <rect x="0" y="6" width="20" height="8" rx="2" fill="#FF5252"/>
    <rect x="6" y="0" width="8" height="20" rx="2" fill="#FF5252"/>
  </g>
  
  <!-- Ground shadow -->
  <ellipse cx="120" cy="205" rx="55" ry="6" fill="#111418"/>
</svg>