<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid lines for financial context -->
  <line x1="30" y1="60" x2="210" y2="60" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="30" y1="110" x2="210" y2="110" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="30" y1="160" x2="210" y2="160" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="30" y1="210" x2="210" y2="210" stroke="#2A2F3D" stroke-width="1"/>
  <line x1="30" y1="30" x2="30" y2="210" stroke="#2A2F3D" stroke-width="1"/>

  <!-- Glowing Area Under the Chart (Decline volume) -->
  <path d="M 40 70 L 80 100 L 130 90 L 190 190 L 40 190 Z" fill="#FF5252" opacity="0.1"/>

  <!-- Main Trend Line representing Sharp Drop (跌幅 - Magnitude of fall) -->
  <polyline points="40,70 80,100 130,90 190,190" fill="none" stroke="#FF5252" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data Nodes -->
  <!-- Start Point (Previous high) -->
  <circle cx="40" cy="70" r="5" fill="#1A1D24" stroke="#FF5252" stroke-width="3"/>
  
  <!-- Intermediate fluctuation -->
  <circle cx="80" cy="100" r="4" fill="#1A1D24" stroke="#FF5252" stroke-width="3"/>
  <circle cx="130" cy="90" r="4" fill="#1A1D24" stroke="#FF5252" stroke-width="3"/>

  <!-- Final Low Point (The significant drop magnitude) -->
  <circle cx="190" cy="190" r="7" fill="#FF5252"/>
  <circle cx="190" cy="190" r="12" fill="none" stroke="#FF5252" stroke-width="2" opacity="0.6"/>

  <!-- Vertical Drop Magnitude Indicator Bracket (Highlighting the "幅度" - depth/amplitude of fall) -->
  <!-- Vertical span line -->
  <line x1="212" y1="90" x2="212" y2="190" stroke="#FFB74D" stroke-width="2" stroke-linecap="round"/>
  <!-- Top bracket tick -->
  <line x1="207" y1="90" x2="217" y2="90" stroke="#FFB74D" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom bracket tick -->
  <line x1="207" y1="190" x2="217" y2="190" stroke="#FFB74D" stroke-width="2" stroke-linecap="round"/>

  <!-- Directional Arrow Head pointing downward for the drop -->
  <path d="M 182 170 L 190 192 L 200 176" fill="none" stroke="#FF5252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

</svg>