<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Starry night sky background -->
  <g fill="#4A5568" opacity="0.6">
    <circle cx="45" cy="50" r="1.5"/>
    <circle cx="85" cy="35" r="1"/>
    <circle cx="125" cy="65" r="1.5"/>
    <circle cx="180" cy="40" r="1"/>
    <circle cx="210" cy="75" r="1.5"/>
    <circle cx="30" cy="90" r="1"/>
    <circle cx="155" cy="30" r="1.2"/>
  </g>

  <!-- Distant mountain silhouette -->
  <path d="M0 180 L50 130 L90 160 L140 110 L190 150 L240 120 L240 240 L0 240 Z" fill="#242B35"/>

  <!-- Foreground jagged mountains (崇山峻岭) -->
  <path d="M0 200 L70 120 L130 170 L190 95 L240 140 L240 240 L0 240 Z" fill="#2E3846"/>

  <!-- Wind streams (dãi gió) -->
  <g opacity="0.3" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M15 85 Q40 75 70 90"/>
    <path d="M50 105 Q75 95 105 110"/>
    <path d="M140 70 Q170 55 200 75"/>
    <path d="M165 90 Q190 80 225 95"/>
  </g>

  <!-- Geological explorer camping setup (luân/sú - eating & sleeping outdoors) -->
  <!-- Explorer's backpack and gear on the ground -->
  <g transform="translate(65, 155)">
    <!-- Sleeping roll / tent pack -->
    <rect x="0" y="25" width="35" height="20" rx="6" fill="#D69E2E"/>
    <path d="M10 25 L10 45" stroke="#744210" stroke-width="2"/>
    <path d="M25 25 L25 45" stroke="#744210" stroke-width="2"/>
    <!-- Backpack -->
    <path d="M35 15 C35 8 41 4 48 4 C55 4 61 8 61 15 L61 45 L35 45 Z" fill="#319795"/>
    <rect x="42" y="20" width="12" height="15" rx="2" fill="#234E52"/>
    <!-- Geological hammer leaning on gear -->
    <path d="M68 10 L78 25" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round"/>
    <path d="M64 8 L72 12 L68 16 Z" fill="#E2E8F0"/>
  </g>

  <!-- Campfire with a pot (eating outdoors - 风餐) -->
  <g transform="translate(155, 160)">
    <!-- Firewood -->
    <path d="M0 35 L30 35" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 30 L25 40" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <!-- Flames -->
    <path d="M15 32 Q10 20 16 10 Q22 20 17 32 Z" fill="#ED8936"/>
    <path d="M15 32 Q12 22 15 15 Q18 22 16 32 Z" fill="#ECC94B"/>
    <!-- Cooking pot hanging or sitting -->
    <path d="M5 12 L25 12 L28 28 C28 31 25 33 15 33 C5 33 2 31 2 28 Z" fill="#4A5568"/>
    <path d="M8 12 L8 6 C8 4 10 2 15 2 C20 2 22 4 22 6 L22 12" fill="none" stroke="#718096" stroke-width="2"/>
    <!-- Steam / heat lines -->
    <path d="M12 2 Q10 -2 14 -5" stroke="#CBD5E0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M18 2 Q20 -2 16 -5" stroke="#CBD5E0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Sleeping bag / resting figure (露宿 - sleeping under the open sky) -->
  <g transform="translate(100, 165)">
    <!-- Sleeping bag body -->
    <path d="M0 25 C0 10 15 5 30 5 L75 15 C85 18 90 25 85 35 C80 45 65 45 30 40 C10 38 0 35 0 25 Z" fill="#E53E3E"/>
    <!-- Pillow / Head part -->
    <circle cx="18" cy="20" r="10" fill="#FEB2B2"/>
    <!-- Explorer cap profile -->
    <path d="M10 15 L22 13 L24 17 L10 17 Z" fill="#2C7A7B"/>
  </g>

  <!-- Subtle glowing moon providing the only night light -->
  <circle cx="195" cy="55" r="14" fill="#FEFCBF" opacity="0.9"/>
</svg>