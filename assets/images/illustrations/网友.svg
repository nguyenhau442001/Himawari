<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing digital connection background grid / network nodes -->
  <g opacity="0.3">
    <line x1="60" y1="80" x2="120" y2="120" stroke="#3A4454" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="180" y1="80" x2="120" y2="120" stroke="#3A4454" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="120" y1="120" x2="120" y2="180" stroke="#3A4454" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="60" cy="80" r="4" fill="#3A4454"/>
    <circle cx="180" cy="80" r="4" fill="#3A4454"/>
    <circle cx="120" cy="180" r="4" fill="#3A4454"/>
  </g>

  <!-- Central Network Communication Beam -->
  <path d="M75 110 C90 90, 150 90, 165 110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Left Netizen (User A) -->
  <g transform="translate(45, 75)">
    <!-- Laptop / Device Base -->
    <path d="M-15 85 L45 85 L35 70 L-5 70 Z" fill="#4B5563"/>
    <rect x="-20" y="85" width="70" height="4" rx="2" fill="#9CA3AF"/>
    
    <!-- Screen -->
    <rect x="-10" y="30" width="50" height="42" rx="4" fill="#111827" stroke="#374151" stroke-width="2"/>
    <rect x="-6" y="34" width="42" height="34" rx="2" fill="#1F2937"/>
    <!-- Chat bubble icon on screen -->
    <rect x="2" y="42" width="26" height="18" rx="3" fill="#F59E0B"/>
    <path d="M8 60 L12 66 L14 60 Z" fill="#F59E0B"/>

    <!-- Person A Silhouette/Body -->
    <path d="M15 70 C5 70, -2 80, -5 95 L35 95 C32 80, 25 70, 15 70 Z" fill="#3B82F6"/>
    <!-- Head & Hair -->
    <circle cx="15" cy="15" r="14" fill="#E5E7EB"/>
    <path d="M1 12 C2 3, 28 3, 29 12 C29 15, 27 18, 25 14 C23 7, 7 7, 5 14 C3 18, 1 15, 1 12 Z" fill="#1F2937"/>
    <!-- Friendly expression -->
    <circle cx="11" cy="14" r="1.5" fill="#1F2937"/>
    <circle cx="19" cy="14" r="1.5" fill="#1F2937"/>
    <path d="M13 19 Q15 21 17 19" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Right Netizen (User B) -->
  <g transform="translate(135, 75)">
    <!-- Laptop / Device Base -->
    <path d="M15 85 L75 85 L65 70 L25 70 Z" fill="#4B5563"/>
    <rect x="10" y="85" width="70" height="4" rx="2" fill="#9CA3AF"/>
    
    <!-- Screen -->
    <rect x="30" y="30" width="50" height="42" rx="4" fill="#111827" stroke="#374151" stroke-width="2"/>
    <rect x="34" y="34" width="42" height="34" rx="2" fill="#1F2937"/>
    <!-- Video/Avatar icon on screen -->
    <circle cx="55" cy="47" r="8" fill="#10B981"/>
    <path d="M45 62 C45 56, 65 56, 65 62 Z" fill="#10B981"/>

    <!-- Person B Silhouette/Body -->
    <path d="M55 70 C45 70, 38 80, 35 95 L75 95 C72 80, 65 70, 55 70 Z" fill="#EC4899"/>
    <!-- Head & Hair -->
    <circle cx="55" cy="15" r="14" fill="#E5E7EB"/>
    <path d="M41 15 C41 6, 69 6, 69 15 C69 18, 67 15, 65 11 C60 5, 50 5, 45 11 C43 15, 41 18, 41 15 Z" fill="#4B5563"/>
    <!-- Friendly expression -->
    <circle cx="51" cy="14" r="1.5" fill="#1F2937"/>
    <circle cx="59" cy="14" r="1.5" fill="#1F2937"/>
    <path d="M53 19 Q55 21 57 19" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Global Connectivity Symbol (Floating between them) -->
  <g transform="translate(120, 55)">
    <circle cx="0" cy="0" r="16" fill="#1F2937" stroke="#F59E0B" stroke-width="2"/>
    <path d="M-8 -3 C-2 -7, 2 -7, 8 -3" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M-10 3 C-3 7, 3 7, 10 3" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#F59E0B"/>
  </g>

  <!-- Connection Nodes / Signals -->
  <path d="M98 50 C105 40, 115 40, 120 40" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M142 50 C135 40, 125 40, 120 40" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>