<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative pattern representing repetition/routine (frequently/often) -->
  <g opacity="0.1" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <circle cx="120" cy="120" r="85"/>
    <circle cx="120" cy="120" r="65"/>
  </g>

  <!-- Physical Object representing a regular, recurring destination: A welcoming Bookstore storefront (based on contextual sentence: "我常去那家书店") -->
  <!-- Awning / Canopy -->
  <path d="M 60 90 L 180 90 L 190 110 L 50 110 Z" fill="#F59E0B"/>
  <path d="M 50 110 L 190 110 L 190 116 L 50 116 Z" fill="#D97706"/>
  
  <!-- Alternate stripes on awning -->
  <polygon points="75,90 90,90 85,110 70,110" fill="#1A1D24" opacity="0.2"/>
  <polygon points="105,90 120,90 115,110 100,110" fill="#1A1D24" opacity="0.2"/>
  <polygon points="135,90 150,90 145,110 130,110" fill="#1A1D24" opacity="0.2"/>
  <polygon points="165,90 180,90 175,110 160,110" fill="#1A1D24" opacity="0.2"/>

  <!-- Building Base / Facade -->
  <rect x="65" y="116" width="110" height="84" fill="#2D3748" rx="4"/>

  <!-- Large Glass Storefront Window -->
  <rect x="77" y="130" width="86" height="70" fill="#1E293B" rx="2"/>
  
  <!-- Books visible inside the window -->
  <g transform="translate(85, 150)">
    <rect x="0" y="20" width="70" height="6" fill="#4A5568" rx="1"/>
    <!-- Book spines -->
    <rect x="8" y="0" width="8" height="20" fill="#E2E8F0" rx="1"/>
    <rect x="18" y="-3" width="9" height="23" fill="#F59E0B" rx="1"/>
    <rect x="29" y="2" width="7" height="18" fill="#38BDF8" rx="1"/>
    <rect x="38" y="-1" width="10" height="21" fill="#EC4899" rx="1"/>
    <rect x="50" y="4" width="8" height="16" fill="#10B981" rx="1"/>
  </g>

  <!-- Glass Door Frame & Glass Highlight -->
  <path d="M 105 200 L 105 165 L 135 165 L 135 200 Z" fill="#334155"/>
  <path d="M 80 135 L 120 135 L 110 170 L 80 170 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Warm interior lighting glow -->
  <circle cx="120" cy="140" r="35" fill="#F59E0B" opacity="0.12" filter="blur(8px)"/>

  <!-- Repeated Footprints approaching the storefront, visualizing "常" (frequently visiting/going often) -->
  <g fill="#F59E0B" opacity="0.85">
    <!-- Step 1 (Back) -->
    <ellipse cx="100" cy="222" rx="4" ry="7" transform="rotate(-15 100 222)"/>
    <!-- Step 2 -->
    <ellipse cx="130" cy="210" rx="4" ry="7" transform="rotate(10 130 210)"/>
    <!-- Step 3 (Close to entrance) -->
    <ellipse cx="112" cy="198" rx="4" ry="7" transform="rotate(-5 112 198)"/>
  </g>

</svg>