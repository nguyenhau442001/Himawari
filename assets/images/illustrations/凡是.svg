<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall & Floor Grid Glow -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Warning Red Glow -->
    <radialGradient id="warnGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Clipboard Glow -->
    <linearGradient id="clipboardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    
    <!-- Stamp Red -->
    <linearGradient id="stampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environmental Context: Office / Inspection Room Background -->
  <!-- Floor -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#1e293b" stroke-width="2"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#1e293b" stroke-width="2"/>

  <!-- Back Wall with subtle paneling -->
  <rect x="20" y="30" width="200" height="140" rx="6" fill="url(#wallGrad)" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Window or Bulletin Board in background -->
  <rect x="140" y="45" width="60" height="75" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <!-- Warning sign pinned to board (Universal Prohibition Symbol) -->
  <circle cx="170" cy="82" r="22" fill="#ef4444" opacity="0.9" filter="url(#shadow)"/>
  <circle cx="170" cy="82" r="17" fill="#f8fafc"/>
  <line x1="157" y1="69" x2="183" y2="95" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>

  <!-- Ambient Warning Glow overlaying the scene -->
  <circle cx="120" cy="120" r="110" fill="url(#warnGlow)"/>

  <!-- Desk / Counter -->
  <rect x="15" y="155" width="125" height="30" rx="4" fill="#334155" filter="url(#shadow)"/>
  <rect x="15" y="155" width="125" height="6" fill="#64748b" rx="2"/>

  <!-- PROPS ON DESK -->
  <!-- Official Rulebook / Clipboard -->
  <g transform="translate(30, 135) rotate(-8)">
    <rect x="0" y="0" width="35" height="45" rx="3" fill="url(#clipboardGrad)" filter="url(#shadow)"/>
    <!-- Metal clip -->
    <rect x="11" y="-3" width="13" height="6" rx="2" fill="#94a3b8"/>
    <!-- Lines representing rules -->
    <line x1="6" y1="10" x2="29" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="25" y2="18" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="22" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="34" x2="27" y2="34" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Penalty Ticket / Warning Slip being handed over -->
  <g transform="translate(85, 125) rotate(15)" filter="url(#shadow)">
    <rect x="0" y="0" width="32" height="42" fill="#fef08a" rx="2" stroke="#eab308" stroke-width="1"/>
    <!-- Red Stamp on ticket -->
    <rect x="6" y="12" width="20" height="12" rx="2" fill="url(#stampGrad)" transform="rotate(-10 16 18)"/>
    <line x1="8" y1="8" x2="24" y2="8" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="20" y2="32" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CHARACTER 1: Inspector / Authority Figure (Left) -->
  <g id="inspector" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 35 170 L 35 130 C 35 120, 45 115, 55 115 L 75 115 C 85 115, 95 120, 95 130 L 95 170 Z" fill="#1e293b"/>
    <!-- Uniform Shirt -->
    <path d="M 45 115 L 65 140 L 85 115 Z" fill="#f8fafc"/>
    <!-- Tie -->
    <polygon points="62,130 68,130 66,155 64,155" fill="#ef4444"/>

    <!-- Head & Face -->
    <circle cx="65" cy="95" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 50 93 C 50 82, 60 78, 65 78 C 72 78, 80 82, 80 93 Z" fill="#334155"/>
    <!-- Glasses -->
    <rect x="55" y="88" width="10" height="6" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="67" y="88" width="10" height="6" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="65" y1="91" x2="67" y2="91" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Serious Expression -->
    <path d="M 60 102 Q 65 100 70 102" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Inspector Arm pointing firmly forward -->
    <path d="M 80 125 L 110 135 L 115 130" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="115" cy="130" r="5" fill="#fcd34d"/>
  </g>


  <!-- CHARACTER 2: Violator / Person facing penalty (Right) -->
  <g id="violator" filter="url(#shadow)">
    <!-- Body / Torso (slumped/regretful posture) -->
    <path d="M 160 170 C 155 150, 160 135, 170 125 L 195 135 C 205 145, 210 160, 210 170 Z" fill="#3b82f6"/>
    
    <!-- Head & Face (Downward/Guilty gaze) -->
    <circle cx="178" cy="105" r="16" fill="#fcd34d"/>
    <!-- Messy Hair -->
    <path d="M 163 100 C 163 90, 175 88, 185 92 C 193 95, 195 102, 193 108 Z" fill="#1e293b"/>
    <!-- Sweat Drop (Showing stress/regret) -->
    <path d="M 195 100 C 195 105, 199 107, 199 110 C 199 113, 197 115, 195 115 C 193 115, 191 113, 191 110 C 191 107, 195 105, 195 100 Z" fill="#38bdf8"/>
    <!-- Surprised/Guilty Eyes -->
    <circle cx="172" cy="104" r="2" fill="#0f172a"/>
    <circle cx="182" cy="104" r="2" fill="#0f172a"/>
    <!-- Worried Mouth (O shape) -->
    <circle cx="177" cy="113" r="3" fill="#b45309"/>

    <!-- Arms crossed or hands up in surrender/realization -->
    <path d="M 165 135 L 140 145 L 145 155" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="145" cy="155" r="4" fill="#fcd34d"/>
  </g>

  <!-- FOREGROUND ACCENTS & DYNAMIC ENERGETIC TOUCH -->
  <!-- Floating warning sparkles/particles to emphasize rule enforcement -->
  <g fill="#fbbf24">
    <path d="M 125 70 L 128 78 L 136 81 L 128 84 L 125 92 L 122 84 L 114 81 L 122 78 Z" transform="scale(0.5) translate(120, 50)" opacity="0.8"/>
    <path d="M 125 70 L 128 78 L 136 81 L 128 84 L 125 92 L 122 84 L 114 81 L 122 78 Z" transform="scale(0.3) translate(280, 260)" opacity="0.6"/>
    <path d="M 125 70 L 128 78 L 136 81 L 128 84 L 125 92 L 122 84 L 114 81 L 122 78 Z" transform="scale(0.4) translate(80, 240)" opacity="0.7"/>
  </g>

  <!-- Dramatic top rim light / border styling -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.5"/>
</svg>