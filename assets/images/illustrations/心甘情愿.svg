<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person representing the subject -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 100 C-30 70, -20 50, 0 50 C20 50, 30 70, 30 100" fill="#F4A261"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#F4A261"/>
    <!-- Hair -->
    <path d="M-25 30 C-25 5, 0 -5, 25 30" fill="#2A2E38"/>
    
    <!-- Arms in a gesture of offering/giving -->
    <path d="M-25 60 L-50 80" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
    <path d="M25 60 L50 80" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
    
    <!-- The object being offered (a small house representing family/home) -->
    <g transform="translate(0, -20)">
      <path d="M-20 0 L0 -20 L20 0 L20 20 L-20 20 Z" fill="#E9C46A"/>
      <rect x="-5" y="5" width="10" height="15" fill="#1A1D24"/>
    </g>
    
    <!-- Expression: Warm smile -->
    <path d="M-10 40 Q0 48 10 40" stroke="#1A1D24" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>