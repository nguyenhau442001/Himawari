<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Living Room Interior Elements -->
  <path d="M20 180 L220 180 L210 230 L30 230 Z" fill="#334155"/>
  <circle cx="180" cy="80" r="30" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Table -->
  <rect x="60" y="150" width="120" height="15" rx="2" fill="#94a3b8"/>
  <rect x="70" y="165" width="10" height="30" fill="#64748b"/>
  <rect x="160" y="165" width="10" height="30" fill="#64748b"/>
  
  <!-- Food/Props -->
  <circle cx="90" cy="145" r="8" fill="#ec4899"/>
  <circle cx="120" cy="140" r="12" fill="#fb923c"/>
  <circle cx="150" cy="145" r="7" fill="#10b981"/>
  
  <!-- Characters -->
  <!-- Father -->
  <g transform="translate(50, 90)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="50" rx="5" fill="#38bdf8"/>
    <path d="M10 45 L0 60 M30 45 L40 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Mother -->
  <g transform="translate(150, 95)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="50" rx="5" fill="#ec4899"/>
    <path d="M10 45 L5 65 M30 45 L35 65" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Child -->
  <g transform="translate(105, 110)">
    <circle cx="15" cy="15" r="10" fill="#fde68a"/>
    <rect x="10" y="25" width="10" height="30" rx="3" fill="#fbbf24"/>
  </g>

  <!-- Decorative Lighting -->
  <circle cx="40" cy="50" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="40" r="4" fill="#fbbf24"/>
  <circle cx="120" cy="30" r="2" fill="#fbbf24"/>
</svg>