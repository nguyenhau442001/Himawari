<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Human Silhouette -->
  <g transform="translate(60, 40)">
    <path d="M60 20c-8 0-15 7-15 15s7 15 15 15 15-7 15-15-7-15-15-15z" fill="#FFB347"/>
    <path d="M60 55c-15 0-25 10-25 25v50c0 5 5 10 10 10h30c5 0 10-5 10-10V80c0-15-10-25-25-25z" fill="#FFB347"/>
  </g>

  <!-- Circulatory Path (Blood flow representation) -->
