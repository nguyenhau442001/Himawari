    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Directional Arrows -->
  <path d="M120 100 L 125 95 L 120 105 L 115 95 Z" fill="#FF5733"/>
  <path d="M180 150 L 185 145 L 175 145 Z" fill="#FF5733"/>
  <path d="M120 200 L 125 205 L 120 195 L 115 205 Z" fill="#FF5733"/>
  <path d="M60 150 L 55 145 L 65 145 Z" fill="#FF5733"/>
</svg>