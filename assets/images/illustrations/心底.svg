<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background glow representing depth -->
  <circle cx="120" cy="130" r="70" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="120" r="45" fill="#2E3646" opacity="0.4"/>

  <!-- Conceptual illustration for "心底" (tận đáy lòng / the deepest core of the heart) -->
  <!-- We visualize a sleek, stylized anatomical human heart silhouette placed centrally, 
       with a glowing core and upward-radiating golden energy particles representing the 
       spontaneous arising of deep pride (自豪感油然而生) -->
  
  <!-- Radiating warm golden rays from the depths -->
  <path d="M120 120 L105 75" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M120 120 L135 70" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M120 120 L120 60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 120 L90 85" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M120 120 L150 80" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating golden particles ascending from the deep core -->
  <circle cx="120" cy="75" r="3" fill="#FBBF24"/>
  <circle cx="100" cy="95" r="2" fill="#FBBF24" opacity="0.8"/>
  <circle cx="140" cy="90" r="2.5" fill="#FBBF24" opacity="0.9"/>
  <circle cx="112" cy="62" r="1.5" fill="#FEEEE4" opacity="0.9"/>
  <circle cx="132" cy="58" r="2" fill="#FBBF24"/>
  <circle cx="120" cy="45" r="1" fill="#FEEEE4" opacity="0.7"/>

  <!-- Stylized Heart Silhouette (Physical Object representation) -->
  <path d="M120 148 C120 148 158 118 158 92 C158 76 145 64 130 64 C120 64 120 74 120 74 C120 74 120 64 110 64 C95 64 82 76 82 92 C82 118 120 148 120 148 Z" 
        fill="#E11D48" 
        stroke="#FB7185" 
        stroke-width="2"/>

  <!-- Glowing deep core inside the heart ("tận đáy lòng") -->
  <circle cx="120" cy="98" r="16" fill="#F43F5E"/>
  <circle cx="120" cy="98" r="8" fill="#FEE2E2" opacity="0.9"/>
  <circle cx="120" cy="98" r="3" fill="#FFFFFF"/>

  <!-- Subtle grounding base representing the innermost foundation ("đáy") -->
  <path d="M90 170 Q120 178 150 170" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M102 178 Q120 183 138 178" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>