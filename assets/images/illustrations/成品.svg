<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow for the central object -->
  <circle cx="120" cy="120" r="70" fill="#2D323E" opacity="0.5"/>

  <!-- Conveyor belt / Production line base -->
  <rect x="50" y="155" width="140" height="8" rx="4" fill="#3A4252"/>
  <rect x="70" y="163" width="100" height="6" rx="3" fill="#282E3A"/>
  <!-- Conveyor rollers -->
  <circle cx="65" cy="159" r="4" fill="#5A657D"/>
  <circle cx="95" cy="159" r="4" fill="#5A657D"/>
  <circle cx="120" cy="159" r="4" fill="#5A657D"/>
  <circle cx="145" cy="159" r="4" fill="#5A657D"/>
  <circle cx="175" cy="159" r="4" fill="#5A657D"/>

  <!-- Sparkles / Polish marks indicating "Finished/Completed" product -->
  <g fill="#F59E0B">
    <!-- Top-left sparkle -->
    <path d="M75 75 Q75 83 67 83 Q75 83 75 91 Q75 83 83 83 Q75 83 75 75 Z"/>
    <!-- Top-right sparkle -->
    <path d="M175 90 Q175 95 170 95 Q175 95 175 100 Q175 95 180 95 Q175 95 175 90 Z"/>
    <!-- Right side small sparkle -->
    <path d="M165 130 Q165 134 161 134 Q165 134 165 138 Q165 134 169 134 Q165 134 165 130 Z"/>
  </g>

  <!-- The Finished Product (A sleek, modern stylized mechanical device/gadget on a pedestal box) -->
  <!-- Product Base/Stand -->
  <path d="M90 145 L150 145 L140 125 L100 125 Z" fill="#4B5563"/>
  
  <!-- Main Body of the Finished Product -->
  <rect x="95" y="85" width="50" height="42" rx="8" fill="#3B82F6"/>
  <rect x="101" y="91" width="38" height="30" rx="4" fill="#1E293B"/>

  <!-- Screen / Interface on the Product (Glowing Blue) -->
  <rect x="105" y="95" width="30" height="22" rx="2" fill="#60A5FA" opacity="0.9"/>
  <!-- Status checkmark on screen -->
  <path d="M113 106 L118 111 L129 99" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top precision component / lens -->
  <circle cx="120" cy="73" r="10" fill="#F59E0B"/>
  <circle cx="120" cy="73" r="5" fill="#FEF3C7"/>

  <!-- Connection neck -->
  <rect x="114" y="79" width="12" height="7" fill="#D97706"/>

  <!-- Quality Assurance Check Badge (Subtle indicator floating top right) -->
  <circle cx="172" cy="62" r="14" fill="#10B981" opacity="0.2"/>
  <circle cx="172" cy="62" r="11" fill="#10B981"/>
  <path d="M166 62 L170 66 L178 57" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>