<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow / Ambient Light -->
  <circle cx="120" cy="120" r="70" fill="#38BDF8" opacity="0.05" filter="blur(10px)"/>

  <!-- Document / Physical Object (Noun Representation of "书面" - written/in writing) -->
  <g transform="translate(0, 4)">
    <!-- Document Drop Shadow -->
    <path d="M72 44h80l36 36v112a12 12 0 0 1-12 12H72a12 12 0 0 1-12-12V56a12 12 0 0 1 12-12z" fill="#0F1115" opacity="0.4"/>

    <!-- Document Base Sheet -->
    <path d="M72 40h80l36 36v112a12 12 0 0 1-12 12H72a12 12 0 0 1-12-12V52a12 12 0 0 1 12-12z" fill="#F8FAFC"/>

    <!-- Document Fold Corner -->
    <path d="M152 40v36h36l-36-36z" fill="#CBD5E1"/>

    <!-- Document Text Lines (Abstract representation of written text) -->
    <rect x="84" y="80" width="72" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="84" y="102" width="52" height="6" rx="3" fill="#E2E8F0"/>
    
    <!-- Highlighted Line / Focus -->
    <rect x="84" y="124" width="72" height="6" rx="3" fill="#F59E0B"/>

    <rect x="84" y="146" width="60" height="6" rx="3" fill="#E2E8F0"/>

    <!-- Modern Fountain Pen / Writing Tool (Emphasizing "written form") -->
    <g transform="translate(125, 115) rotate(45)">
      <!-- Pen Shadow -->
      <path d="M-6-40h12v70h-12z" fill="#0F1115" opacity="0.3" transform="translate(4, 4)"/>
      
      <!-- Pen Body -->
      <path d="M-6-40h12v50c0 3.3-2.7 6-6 6s-6-2.7-6-6v-50z" fill="#38BDF8"/>
      
      <!-- Pen Grip/Accent -->
      <rect x="-6" y="-15" width="12" height="12" fill="#0284C7"/>
      
      <!-- Pen Nib -->
      <path d="M-6 10h12l-6 30z" fill="#94A3B8"/>
      
      <!-- Nib Split Line -->
      <line x1="0" y1="15" x2="0" y2="30" stroke="#64748B" stroke-width="1.5"/>
      
      <!-- Nib Tip Glow -->
      <circle cx="0" cy="38" r="1.5" fill="#F59E0B"/>
    </g>

    <!-- Official Stamp / Seal (Signifying formal "written application" context) -->
    <g transform="translate(145, 155)">
      <circle cx="15" cy="15" r="18" fill="#EF4444" opacity="0.15"/>
      <circle cx="15" cy="15" r="14" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4 2"/>
      <circle cx="15" cy="15" r="9" fill="#EF4444"/>
      <!-- Checkmark inside stamp -->
      <path d="M11 15l3 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>