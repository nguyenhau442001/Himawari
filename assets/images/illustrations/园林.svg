<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow & Subtle Scenery Elements -->
  <circle cx="120" cy="120" r="85" fill="#242B38" opacity="0.6"/>
  
  <!-- Moon / Sky Accent -->
  <circle cx="170" cy="70" r="16" fill="#F39C12" opacity="0.2"/>

  <!-- Traditional Chinese Classical Garden (园林) Composition -->
  <!-- Distant Pagoda / Roof Outline -->
  <path d="M100 85 L120 70 L140 85 Z" fill="#2C3E50"/>
  <path d="M92 90 L120 75 L148 90 Z" fill="#34495E"/>

  <!-- Moon Gate (Traditional Circular Gateway - Core Icon of Suzhou Garden) -->
  <circle cx="120" cy="130" r="48" fill="#1A1D24" stroke="#F1C40F" stroke-width="4"/>
  <path d="M120 82 V178" stroke="#34495E" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Rockery (假山) -->
  <path d="M70 170 C75 145, 90 140, 105 150 C112 135, 130 135, 138 152 C150 145, 168 150, 172 170 Z" fill="#4B6584"/>
  <path d="M85 170 C90 155, 100 152, 108 160 C115 148, 128 148, 135 160 C145 155, 160 158, 165 170 Z" fill="#778CA3"/>

  <!-- Water & Reflection Surface -->
  <path d="M45 175 C80 170, 160 170, 195 175 C200 190, 40 190, 45 175 Z" fill="#1B4F72" opacity="0.6"/>
  <path d="M70 181 Q120 177 170 181" stroke="#5DADE2" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M90 186 Q120 184 150 186" stroke="#5DADE2" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Zigzag Bridge (九曲桥) -->
  <polyline points="65,168 85,162 105,168 125,162" fill="none" stroke="#E67E22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="85" y1="162" x2="85" y2="171" stroke="#D35400" stroke-width="2"/>
  <line x1="105" y1="168" x2="105" y2="175" stroke="#D35400" stroke-width="2"/>

  <!-- Classical Architecture Roof (Corridor / Pavilion) on Left -->
  <path d="M40 135 C50 120, 75 120, 85 135 Z" fill="#E74C3C"/>
  <rect x="48" y="135" width="6" height="35" fill="#C0392B"/>
  <rect x="70" y="135" width="6" height="35" fill="#C0392B"/>
  <line x1="45" y1="135" x2="80" y2="135" stroke="#F39C12" stroke-width="3"/>

  <!-- Elegant Willow / Flora Branch Overlay -->
  <path d="M175 90 C175 110, 185 120, 195 140" fill="none" stroke="#27AE60" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M185 105 C180 110, 175 115, 172 120" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"/>
  <path d="M190 120 C195 125, 198 130, 202 135" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="170" cy="122" rx="4" ry="2" fill="#2ECC71" transform="rotate(-30 170 122)"/>
  <ellipse cx="204" cy="137" rx="4" ry="2" fill="#2ECC71" transform="rotate(30 204 137)"/>

  <!-- Foreground Bamboo / Foliage Accent (Right) -->
  <line x1="195" y1="175" x2="195" y2="140" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
  <line x1="202" y1="175" x2="202" y2="148" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"/>
  <path d="M195 150 C190 148, 185 152, 182 155" fill="none" stroke="#2ECC71" stroke-width="1.5"/>
  <path d="M202 158 C207 155, 212 158, 215 162" fill="none" stroke="#2ECC71" stroke-width="1.5"/>

  <!-- Focus / Accent Glow Top of Moon Gate -->
  <circle cx="120" cy="82" r="3" fill="#F1C40F"/>
</svg>