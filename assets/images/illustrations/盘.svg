<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle decorative ambient lighting/glow -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Xiangqi (Chinese Chess) Board & Pieces Representation for "一盘象棋" -->
  
  <!-- Wooden Board Surface (Flat vector perspective) -->
  <rect x="50" y="70" width="140" height="100" rx="6" fill="#D4A373" stroke="#FAEDCD" stroke-width="2"/>
  <rect x="56" y="76" width="128" height="88" fill="#E9EDC9" opacity="0.15"/>

  <!-- Board Grid Lines -->
  <!-- Horizontal lines -->
  <line x1="60" y1="90" x2="180" y2="90" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="60" y1="110" x2="180" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="60" y1="130" x2="180" y2="130" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="60" y1="150" x2="180" y2="150" stroke="#8C6239" stroke-width="1.5"/>

  <!-- Vertical lines (top half) -->
  <line x1="60" y1="70" x2="60" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="90" y1="70" x2="90" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="120" y1="70" x2="120" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="150" y1="70" x2="150" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="180" y1="70" x2="180" y2="110" stroke="#8C6239" stroke-width="1.5"/>

  <!-- Vertical lines (bottom half) -->
  <line x1="60" y1="110" x2="60" y2="150" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="90" y1="110" x2="90" y2="150" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="120" y1="110" x2="120" y2="150" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="150" y1="110" x2="150" y2="150" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="180" y1="110" x2="180" y2="150" stroke="#8C6239" stroke-width="1.5"/>

  <!-- River Gap (楚河汉界) -->
  <rect x="60" y="105" width="120" height="10" fill="#CCD5AE" opacity="0.3"/>

  <!-- Palace Diagonals -->
  <line x1="90" y1="70" x2="150" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="150" y1="70" x2="90" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="90" y1="150" x2="150" y2="110" stroke="#8C6239" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="90" y2="110" stroke="#8C6239" stroke-width="1.5"/>

  <!-- Chess Pieces (Round tokens representing "盘" - a game/board of chess) -->
  <!-- Red Pieces -->
  <circle cx="120" cy="130" r="10" fill="#F4A261" stroke="#E76F51" stroke-width="2"/>
  <circle cx="90" cy="110" r="10" fill="#F4A261" stroke="#E76F51" stroke-width="2"/>
  <circle cx="150" cy="90" r="10" fill="#F4A261" stroke="#E76F51" stroke-width="2"/>

  <!-- Dark/Green Pieces -->
  <circle cx="120" cy="90" r="10" fill="#2A9D8F" stroke="#264653" stroke-width="2"/>
  <circle cx="90" cy="130" r="10" fill="#2A9D8F" stroke="#264653" stroke-width="2"/>
  <circle cx="150" cy="130" r="10" fill="#2A9D8F" stroke="#264653" stroke-width="2"/>

  <!-- Highlight active central piece with modern focus ring -->
  <circle cx="120" cy="130" r="13" fill="none" stroke="#E9C46A" stroke-width="2" stroke-dasharray="4 2"/>

</svg>