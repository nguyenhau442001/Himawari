<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle dark-mode glow/vignette background element -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.4"/>

  <!-- Detailed central physical object representing 稻草 (a single straw/stalk of rice straw) -->
  <g transform="translate(120, 120)">
    <!-- Dramatic focus upward-angled golden straw representing hope/lifeline -->
    <g transform="rotate(-35)">
      <!-- Main stalk body -->
      <path d="M-4,80 L-2,-60 C-2,-70 2,-70 2,-60 L4,80 Z" fill="url(#strawGrad)" />
      
      <!-- Straw texture lines -->
      <line x1="-1" y1="-50" x2="-1" y2="70" stroke="#E6A15C" stroke-width="0.8" opacity="0.6"/>
      <line x1="1" y1="-40" x2="1" y2="60" stroke="#FFD17A" stroke-width="0.8" opacity="0.4"/>

      <!-- Natural joints (nodes) on the straw -->
      <rect x="-5" y="-10" width="10" height="3" rx="1" fill="#D48B3C"/>
      <line x1="-5" y1="-8.5" x2="5" y2="-8.5" stroke="#F5C272" stroke-width="0.8"/>

      <rect x="-4.5" y="30" width="9" height="3" rx="1" fill="#D48B3C"/>
      <line x1="-4.5" y1="31.5" x2="4.5" y2="31.5" stroke="#F5C272" stroke-width="0.8"/>

      <!-- Straw top frayed opening -->
      <path d="M-3,-60 L-7,-72 M-1,-60 L-2,-75 M2,-60 L4,-73 M3,-60 L8,-70" fill="none" stroke="#F5C272" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Dried side leaf blade wrapping gracefully -->
      <path d="M-3,10 C-15,5 -28,15 -35,30 C-38,36 -32,40 -28,35 C-22,25 -12,18 -3,14 Z" fill="#E6A15C" opacity="0.9"/>
      <path d="M-3,10 C-15,5 -28,15 -35,30" fill="none" stroke="#FFD17A" stroke-width="0.7" opacity="0.6"/>
    </g>

    <!-- Subtle glowing accent to emphasize the "lifeline" contextual concept without violating rules -->
    <circle cx="15" cy="-25" r="3" fill="#FFD17A" opacity="0.8"/>
    <circle cx="35" cy="-45" r="1.5" fill="#FFD17A" opacity="0.6"/>
    <circle cx="-15" cy="25" r="2" fill="#FFD17A" opacity="0.5"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C27A2F"/>
      <stop offset="45%" stop-color="#E6A15C"/>
      <stop offset="70%" stop-color="#F5C272"/>
      <stop offset="100%" stop-color="#C27A2F"/>
    </linearGradient>
  </defs>
</svg>