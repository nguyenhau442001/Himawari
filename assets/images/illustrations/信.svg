<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 40)">
    <!-- Shadow for Envelope Back/Flap -->
    <path d="M10 65 L90 120 L170 65" fill="none" stroke="#0D0F12" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    
    <!-- Envelope Body (Back) -->
    <rect x="10" y="55" width="160" height="110" rx="12" fill="#2D323E"/>
    
    <!-- Letter / Note sliding out slightly -->
    <g transform="translate(25, 20)">
      <rect x="0" y="0" width="130" height="95" rx="8" fill="#F4F5F7"/>
      <!-- Text lines on the letter -->
      <rect x="18" y="22" width="70" height="6" rx="3" fill="#D0D5DD"/>
      <rect x="18" y="38" width="94" height="6" rx="3" fill="#D0D5DD"/>
      <rect x="18" y="54" width="80" height="6" rx="3" fill="#D0D5DD"/>
      <rect x="18" y="70" width="50" height="6" rx="3" fill="#D0D5DD"/>
      <!-- Mini avatar/stamp accent -->
      <circle cx="100" cy="25" r="8" fill="#FFB703"/>
    </g>

    <!-- Envelope Front Triangle (Pockets) -->
    <path d="M10 60 L90 120 L170 60" fill="none" stroke="#373D4D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M10 165 L75 110" fill="none" stroke="#373D4D" stroke-width="3" stroke-linecap="round"/>
    <path d="M170 165 L105 110" fill="none" stroke="#373D4D" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 165 L170 165" fill="#2D323E"/>
    <path d="M10 55 L90 115 L170 55" fill="#3E4556" stroke="#4A5265" stroke-width="3" stroke-linejoin="round"/>

    <!-- Envelope Flap (Top) -->
    <path d="M10 55 L90 15 L170 55" fill="#4A5265" stroke="#5D667E" stroke-width="3" stroke-linejoin="round"/>

    <!-- Accent Seal / Stamp -->
    <circle cx="90" cy="85" r="16" fill="#FFB703"/>
    <path d="M84 85 L88 89 L97 80" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>