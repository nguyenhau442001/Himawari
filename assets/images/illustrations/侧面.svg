<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#334155"/>
  <rect x="50" y="175" width="10" height="50" fill="#1e293b"/>
  <rect x="180" y="175" width="10" height="50" fill="#1e293b"/>
  
  <!-- The "Problem" Object (A complex 3D geometric puzzle) -->
  <g transform="translate(120, 130)">
    <path d="M-20 -20 L20 -20 L30 0 L-10 0 Z" fill="#fbbf24"/>
    <path d="M-20 -20 L-10 0 L-10 20 L-20 0 Z" fill="#f59e0b"/>
    <path d="M20 -20 L30 0 L30 20 L20 0 Z" fill="#d97706"/>
  </g>
  
  <!-- Character 1: Looking from the front -->
  <g transform="translate(80, 140)">
    <circle cx="0" cy="-20" r="15" fill="#e2e8f0"/>
    <rect x="-12" y="-5" width="24" height="20" rx="4" fill="#38bdf8"/>
    <circle cx="-5" cy="-22" r="2" fill="#0f172a"/>
    <circle cx="5" cy="-22" r="2" fill="#0f172a"/>
    <path d="M-5 -15 Q0 -12 5 -15" stroke="#0f172a" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Character 2: Looking from the side (The "侧面" perspective) -->
  <g transform="translate(160, 140)">
    <circle cx="0" cy="-20" r="15" fill="#f8fafc"/>
    <rect x="-12" y="-5" width="24" height="20" rx="4" fill="#ec4899"/>
    <circle cx="8" cy="-22" r="2" fill="#0f172a"/>
    <path d="M5 -15 Q8 -12 11 -15" stroke="#0f172a" stroke-width="1" fill="none"/>
    <!-- Pointing hand -->
    <path d="M-15 -5 L-25 -15" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Ambient light/glow -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="160" cy="130" r="20" fill="#ec4899" opacity="0.1"/>
</svg>