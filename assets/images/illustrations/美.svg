<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Scenery (Contrasting Scale & Natural Beauty) -->
  <g id="landscape-scene">
    <!-- Distant glowing moon / sun accent -->
    <circle cx="185" cy="65" r="16" fill="#FFB74D" opacity="0.15"/>
    <circle cx="185" cy="65" r="12" fill="#FFB74D" opacity="0.3"/>
    <circle cx="185" cy="65" r="8" fill="#FFB74D"/>
    
    <!-- Distant Mountains -->
    <path d="M 30,150 Q 80,90 130,130 Q 180,80 220,120 L 220,180 L 30,180 Z" fill="#252A34"/>
    <path d="M 15,160 Q 60,110 110,145 Q 160,105 225,150 L 225,180 L 15,180 Z" fill="#2D3340"/>
    
    <!-- Majestic Layered Pines / Flora (Scale Exaggeration for beauty/grandeur) -->
    <!-- Far forest silhouette -->
    <path d="M30,165 L35,155 L40,165 L45,150 L50,165 L55,145 L60,165 L65,152 L70,165 L85,155 L100,168 L120,150 L140,168 L160,145 L180,168 L200,155 L210,168 Z" fill="#384152"/>
    
    <!-- Foreground Hills -->
    <path d="M 0,165 Q 90,140 240,165 L 240,210 L 0,210 Z" fill="#1E232D"/>
    
    <!-- Primary Focus: Exaggerated, Elegant Pine Tree (Representing natural beauty/aesthetics) -->
    <g transform="translate(60, 60)">
      <!-- Tree Trunk -->
      <path d="M 32,80 Q 30,60 28,40 L 36,40 Q 34,60 38,80 Z" fill="#606A7D"/>
      
      <!-- Layered Pine Foliage (Sleek modern flat design with gold/orange accent rim for "beauty" quality) -->
      <!-- Bottom Layer -->
      <path d="M 10,65 Q 34,45 58,65 Q 44,75 34,70 Q 24,75 10,65 Z" fill="#2C3544"/>
      <path d="M 10,65 Q 34,45 58,65" fill="none" stroke="#FFB74D" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Middle Layer -->
      <path d="M 15,48 Q 34,25 53,48 Q 42,55 34,50 Q 26,55 15,48 Z" fill="#354154"/>
      <path d="M 15,48 Q 34,25 53,48" fill="none" stroke="#FFB74D" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Top Layer -->
      <path d="M 20,30 Q 34,8 48,30 Q 40,35 34,32 Q 28,35 20,30 Z" fill="#404E64"/>
      <path d="M 20,30 Q 34,8 48,30" fill="none" stroke="#FFB74D" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Secondary Focus: Graceful Flowing Water / Reflection (Classic trope for scenic beauty) -->
    <path d="M 100,185 Q 140,175 180,185 Q 210,192 240,185 L 240,205 Q 180,215 120,200 Q 60,185 0,205 L 0,185 Q 50,175 100,185 Z" fill="#2A3446"/>
    <path d="M 130,192 Q 160,187 190,193" fill="none" stroke="#FFB74D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 80,198 Q 110,192 140,198" fill="none" stroke="#FFB74D" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Visual Contrast Elements (Flocking birds for scale and scenic depth) -->
  <g fill="#FFB74D" opacity="0.8">
    <path d="M 130,55 Q 135,48 140,55 Q 145,48 150,55 Q 145,52 140,57 Q 135,52 130,55 Z"/>
    <path d="M 152,42 Q 155,37 158,42 Q 161,37 164,42 Q 161,40 158,44 Q 155,40 152,42 Z" transform="scale(0.8) translate(50, 10)"/>
  </g>
</svg>