<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle warm ambient lighting from behind the characters to convey emotional warmth -->
  <circle cx="120" cy="115" r="70" fill="#FF8C42" opacity="0.08" filter="blur(15px)"/>

  <!-- Character 1: Storyteller / Speaker (Left, leaning forward, expressive hands) -->
  <g transform="translate(15, 10)">
    <!-- Body/Torso -->
    <path d="M 45 135 C 45 120, 55 110, 75 110 C 95 110, 105 120, 105 135 L 105 150 L 45 150 Z" fill="#2E4057"/>
    <!-- Head -->
    <circle cx="75" cy="85" r="18" fill="#F4A261"/>
    <!-- Hair -->
    <path d="M 57 82 C 57 70, 70 65, 85 70 C 90 72, 93 78, 93 85 L 90 85 C 85 75, 68 76, 57 82 Z" fill="#2D3748"/>
    <!-- Gentle facial expression (profile) -->
    <circle cx="82" cy="84" r="1.5" fill="#1A1D24"/>
    <path d="M 83 91 Q 86 93 88 91" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Arm gesturing warmly -->
    <path d="M 90 120 Q 105 125, 115 115" stroke="#F4A261" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 2: Listener deeply moved (Right, hands clasped near chest, head slightly tilted) -->
  <g transform="translate(100, 10)">
    <!-- Body/Torso -->
    <path d="M 45 135 C 45 120, 55 110, 75 110 C 95 110, 105 120, 105 135 L 105 150 L 45 150 Z" fill="#3D5A80"/>
    <!-- Head (tilted towards speaker) -->
    <circle cx="73" cy="84" r="18" fill="#E76F51"/>
    <!-- Hair -->
    <path d="M 55 85 C 55 70, 72 65, 88 75 C 91 80, 91 85, 91 85 C 80 75, 63 76, 55 85 Z" fill="#2D3748"/>
    <!-- Facial expression: touched, tearful/moved (closed gentle smiling/moved eye, slight soft cheek) -->
    <path d="M 64 83 Q 67 86 70 83" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- A small sparkling tear of joy/deep emotion near the eye -->
    <circle cx="67" cy="89" r="2" fill="#4EA8DE"/>
    <!-- Clasped hands near chest representing being deeply touched ("感动") -->
    <circle cx="75" cy="122" r="8" fill="#E76F51"/>
  </g>

  <!-- Symbolic glowing warmth / emotional connection between them (Warm golden particles/sparkles ascending gracefully) -->
  <g fill="#FFB703">
    <circle cx="110" cy="70" r="3" opacity="0.9"/>
    <circle cx="125" cy="55" r="4" opacity="0.7"/>
    <circle cx="140" cy="75" r="2.5" opacity="0.8"/>
    <circle cx="100" cy="85" r="2" opacity="0.6"/>
  </g>

  <!-- Base ground line to anchor the scene -->
  <path d="M 50 160 L 190 160" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
</svg>