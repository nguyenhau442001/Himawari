<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor line for spatial anchoring -->
  <line x1="30" y1="185" x2="210" y2="185" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Interior setting: door frame & welcoming element in the background -->
  <path d="M45 75 L75 55 L75 185 L45 185 Z" fill="#222733"/>
  <rect x="55" y="90" width="12" height="60" rx="6" fill="#1A1D24"/> <!-- Door handle / detail -->

  <!-- Host character (inside, welcoming) -->
  <g transform="translate(140, 95)">
    <!-- Body -->
    <path d="M 15 45 C 15 30, 35 30, 35 45 L 45 90 C 45 90, 42 90, 35 90 L 30 65 L 15 65 L 10 90 C 3 90, 0 90, 0 45 Z" fill="#4B6584"/>
    <!-- Head -->
    <circle cx="25" cy="18" r="13" fill="#F19066"/>
    <!-- Hair -->
    <path d="M 12 18 C 12 10, 20 6, 26 6 C 33 6, 38 12, 38 18 C 34 14, 28 12, 23 12 C 17 12, 14 15, 12 18 Z" fill="#30336B"/>
    <!-- Welcoming arm gesture (raising hand) -->
    <path d="M 33 35 Q 48 30, 42 45" fill="none" stroke="#F19066" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Guest character (arriving, holding a polite host gift / fruit basket, stepping in) -->
  <g transform="translate(70, 85)">
    <!-- Body (leaning forward slightly in polite motion) -->
    <path d="M 20 45 C 20 30, 40 30, 40 45 L 45 100 C 45 100, 38 100, 30 100 L 25 70 L 15 70 L 10 100 C 3 100, -2 100, 5 55 Z" fill="#E77F67"/>
    <!-- Head -->
    <circle cx="28" cy="18" r="13" fill="#F8A5C2"/>
    <!-- Hair -->
    <path d="M 16 16 C 16 8, 22 5, 29 5 C 36 5, 41 10, 41 18 C 37 13, 31 11, 26 11 C 21 11, 18 13, 16 16 Z" fill="#596275"/>
    
    <!-- Motion lines indicating arrival -->
    <path d="M -15 50 Q -5 50, -2 50" fill="none" stroke="#FDCB6E" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M -18 65 Q -8 65, -5 65" fill="none" stroke="#FDCB6E" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Gift/Fruit basket held out politely -->
    <g transform="translate(35, 50)">
      <!-- Basket body -->
      <path d="M 0 10 L 18 10 L 15 28 L 3 28 Z" fill="#E1B12C"/>
      <!-- Basket handle -->
      <path d="M 3 10 Q 9 2, 15 10" fill="none" stroke="#84817A" stroke-width="2" stroke-linecap="round"/>
      <!-- Fruits inside (orange/red circles) -->
      <circle cx="7" cy="8" r="4" fill="#FF6B6B"/>
      <circle cx="12" cy="7" r="4.5" fill="#FFA502"/>
      <circle cx="9.5" cy="4" r="3.5" fill="#FF5252"/>
    </g>

    <!-- Arm extending the gift -->
    <path d="M 28 40 Q 42 45, 40 52" fill="none" stroke="#F8A5C2" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Focus accent: Warm welcoming glow / friendly speech bubble outline above -->
  <path d="M 105 50 Q 120 38, 135 50 Q 145 58, 135 68 Q 120 75, 105 68 Q 95 58, 105 50 Z" fill="none" stroke="#FDCB6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Teardrop dots for warmth/dialogue icon -->
  <circle cx="120" cy="59" r="3" fill="#FDCB6E"/>
</svg>