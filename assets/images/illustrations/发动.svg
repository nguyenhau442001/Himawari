<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environment / Garage Context -->
  <!-- Workshop Wall and Shelf -->
  <path d="M20 40 L220 40" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />
  <rect x="30" y="25" width="60" height="6" rx="2" fill="#334155" />
  <circle cx="45" cy="22" r="5" fill="#ef4444" />
  <circle cx="65" cy="22" r="5" fill="#38bdf8" />
  <rect x="150" y="20" width="50" height="8" rx="2" fill="#334155" />
  
  <!-- Hanging Tools Background Silhouette -->
  <path d="M175 45 L175 75 M170 50 L180 50" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M195 45 L190 70 L200 70 Z" fill="#475569" />

  <!-- Ambient Glow from Engine Ignition -->
  <circle cx="120" cy="150" r="70" fill="url(#glowGrad)" />

  <!-- MAIN SCENE: Engine Block / Machinery & Character -->
  
  <!-- Workbench / Base -->
  <rect x="30" y="190" width="180" height="15" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <rect x="50" y="205" width="15" height="25" fill="#334155" />
  <rect x="175" y="205" width="15" height="25" fill="#334155" />

  <!-- Engine Block (Động cơ) -->
  <g transform="translate(85, 115)">
    <!-- Engine Main Housing -->
    <rect x="10" y="20" width="60" height="55" rx="8" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Engine Cooling Fins -->
    <line x1="15" y1="30" x2="65" y2="30" stroke="#334155" stroke-width="3" />
    <line x1="15" y1="38" x2="65" y2="38" stroke="#334155" stroke-width="3" />
    <line x1="15" y1="46" x2="65" y2="46" stroke="#334155" stroke-width="3" />
    
    <!-- Engine Cylinder / Piston Top -->
    <path d="M25 20 L25 10 L55 10 L55 20 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="40" cy="8" r="4" fill="#fb923c" />

    <!-- Spark / Energy burst representing "发动" (Starting up) -->
    <path d="M35 0 L40 -12 L48 -5 L53 -18" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
    <circle cx="40" cy="-12" r="3" fill="#fef08a" />
    <circle cx="53" cy="-18" r="2" fill="#38bdf8" />

    <!-- Exhaust / Pipe side -->
    <path d="M70 40 C85 40 85 60 95 60" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <path d="M90 55 C93 52 97 52 100 55 C103 58 107 58 110 55" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Character (Anh ấy - The Mechanic/User starting the engine) -->
  <g transform="translate(15, 80)">
    <!-- Body / Torso -->
    <path d="M40 90 L60 65 L85 75 L80 115 L35 115 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2" stroke-linejoin="round" />
    <!-- Blue jumpsuit uniform details -->
    <path d="M50 72 L65 77 L60 115" fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Head & Face -->
    <circle cx="55" cy="42" r="16" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M39 42 C39 28 50 25 65 30 C70 32 72 38 71 42 Z" fill="#334155" />
    <!-- Determined expression / Eye -->
    <circle cx="61" cy="42" r="2" fill="#1e293b" />
    <path d="M57 38 L65 40" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Smiling/Focused mouth -->
    <path d="M60 50 C63 52 66 50 68 48" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Safety Goggles on Forehead -->
    <path d="M42 33 Q55 26 68 33" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="48" cy="31" r="5" fill="#bae6fd" opacity="0.6" />
    <circle cx="62" cy="31" r="5" fill="#bae6fd" opacity="0.6" />

    <!-- Arm reaching out to activate / Pull cord or push button -->
    <!-- Shoulder to elbow -->
    <path d="M70 75 L95 85" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Forearm & Hand pulling starter cord -->
    <path d="M95 85 L115 100" fill="none" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" />
    <circle cx="118" cy="102" r="5" fill="#ef4444" filter="url(#neonGlow)" />
  </g>

  <!-- Dynamic Ignition Effects / Motion Lines -->
  <path d="M110 115 Q130 110 145 125" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M125 105 Q140 100 155 115" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  
  <!-- Sparks floating in air -->
  <circle cx="150" cy="100" r="3" fill="#f59e0b" filter="url(#neonGlow)" />
  <circle cx="165" cy="120" r="2" fill="#ef4444" filter="url(#neonGlow)" />
  <circle cx="135" cy="90" r="2" fill="#fbbf24" />
  <circle cx="105" cy="135" r="2.5" fill="#38bdf8" filter="url(#neonGlow)" />

  <!-- Foreground details: wrench on workbench -->
  <g transform="translate(45, 180) rotate(-15)">
    <rect x="0" y="0" width="25" height="6" rx="3" fill="#94a3b8" />
    <circle cx="2" cy="3" r="4" fill="#94a3b8" />
    <circle cx="23" cy="3" r="4" fill="#94a3b8" />
    <circle cx="2" cy="3" r="1.5" fill="#0f172a" />
  </g>

  <!-- Oil can prop -->
  <path d="M200 170 L215 170 L210 190 L195 190 Z" fill="#10b981" />
  <path d="M210 170 L220 155 L225 158 L215 172 Z" fill="#059669" />
  <path d="M205 160 C202 165 202 175 205 180" fill="none" stroke="#059669" stroke-width="2" />
</svg>