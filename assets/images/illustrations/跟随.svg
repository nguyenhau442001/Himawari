<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow / Path of movement -->
  <path d="M40 140 C80 140, 90 90, 130 90 C170 90, 180 140, 210 140" fill="none" stroke="#2A2F3B" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Motion / Following trails -->
  <path d="M55 125 C75 125, 80 105, 100 105" fill="none" stroke="#E58E26" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 125 C140 125, 145 105, 165 105" fill="none" stroke="#E58E26" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.8"/>

  <!-- Lead Duck (Adult Duck representing 鸭妈妈) -->
  <g transform="translate(145, 80)">
    <!-- Body -->
    <ellipse cx="25" cy="28" rx="20" ry="14" fill="#F1C40F"/>
    <!-- Head -->
    <circle cx="42" cy="16" r="10" fill="#F1C40F"/>
    <!-- Beak -->
    <path d="M50 14 L58 16 L50 18 Z" fill="#E67E22"/>
    <!-- Wing -->
    <path d="M18 24 C22 24, 30 28, 26 34 C22 34, 15 30, 18 24 Z" fill="#D4AC0D"/>
    <!-- Eye -->
    <circle cx="45" cy="14" r="1.5" fill="#1A1D24"/>
  </g>

  <!-- Following Duck 1 (小鸭子 1) -->
  <g transform="translate(95, 95)">
    <!-- Body -->
    <ellipse cx="20" cy="24" rx="14" ry="10" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="32" cy="13" r="7" fill="#F39C12"/>
    <!-- Beak -->
    <path d="M38 11 L43 13 L38 15 Z" fill="#D35400"/>
    <!-- Eye -->
    <circle cx="34" cy="12" r="1" fill="#1A1D24"/>
  </g>

  <!-- Following Duck 2 (小鸭子 2) -->
  <g transform="translate(55, 110)">
    <!-- Body -->
    <ellipse cx="18" cy="22" rx="12" ry="9" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="28" cy="12" r="6" fill="#F39C12"/>
    <!-- Beak -->
    <path d="M33 10 L38 12 L33 14 Z" fill="#D35400"/>
    <!-- Eye -->
    <circle cx="30" cy="11" r="1" fill="#1A1D24"/>
  </g>

  <!-- Water Ripples beneath characters -->
  <path d="M35 145 C45 142, 55 142, 65 145" fill="none" stroke="#3498DB" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M75 145 C85 142, 95 142, 105 145" fill="none" stroke="#3498DB" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M115 145 C125 142, 135 142, 145 145" fill="none" stroke="#3498DB" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M155 145 C165 142, 175 142, 185 145" fill="none" stroke="#3498DB" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Secondary directional arrow indicating "Following / Going behind" action -->
  <path d="M125 175 L110 185 L125 195" fill="none" stroke="#E58E26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 185 L135 185" fill="none" stroke="#E58E26" stroke-width="3" stroke-linecap="round"/>
</svg>