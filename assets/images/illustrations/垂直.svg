<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Architectural grid background detailing -->
  <rect width="240" height="240" rx="24" fill="url(#grid)"/>

  <!-- Ambient lighting / spotlight from top -->
  <path d="M 60 0 L 180 0 L 210 240 L 30 240 Z" fill="url(#glowGrad)" pointer-events="none"/>

  <!-- SCENE ELEMENTS: Drafting Table / Surface -->
  <g id="drafting-table">
    <!-- Table shadow -->
    <path d="M 30 195 L 210 195 L 220 220 L 20 220 Z" fill="#090d16" opacity="0.6"/>
    <!-- Table surface -->
    <polygon points="20,185 220,185 210,205 30,205" fill="#334155"/>
    <polygon points="25,185 215,185 210,190 30,190" fill="#475569"/>
    <!-- Table legs -->
    <rect x="45" y="205" width="10" height="25" fill="#1e293b"/>
    <rect x="185" y="205" width="10" height="25" fill="#1e293b"/>
  </g>

  <!-- ENVIRONMENT PROPS: Architectural tools and plants -->
  <g id="environment-props">
    <!-- Blueprint paper roll -->
    <circle cx="50" cy="180" r="8" fill="#e2e8f0"/>
    <rect x="42" y="176" width="16" height="4" fill="#cbd5e1"/>
    
    <!-- Small desk lamp -->
    <path d="M 190 185 L 185 145 L 195 145 Z" fill="#64748b"/>
    <path d="M 175 135 L 205 135 L 200 145 L 180 145 Z" fill="#38bdf8"/>
    <ellipse cx="190" cy="135" rx="15" ry="5" fill="#bae6fd"/>

    <!-- Potted plant for warmth and life -->
    <path d="M 18 175 L 28 175 L 26 190 L 20 190 Z" fill="#f43f5e"/>
    <path d="M 15 175 L 31 175 L 23 170 Z" fill="#fb7185"/>
    <!-- Plant leaves -->
    <path d="M 23 170 Q 15 155 10 160 Q 15 170 23 170 Z" fill="#10b981"/>
    <path d="M 23 170 Q 30 150 35 155 Q 30 170 23 170 Z" fill="#34d399"/>
    <path d="M 23 170 Q 23 145 23 150 Q 23 170 23 170 Z" fill="#059669"/>
  </g>

  <!-- CHARACTER: Architect / Designer -->
  <g id="character">
    <!-- Body / Torso -->
    <path d="M 125 155 C 125 140 145 135 155 145 L 165 190 L 115 190 Z" fill="#4f46e5"/>
    
    <!-- Left Arm (Holding the T-Square / Ruler against the vertical line) -->
    <path d="M 130 148 L 105 162 L 115 170 L 138 155 Z" fill="#6366f1"/>
    <!-- Hand -->
    <circle cx="103" cy="164" r="5" fill="#fbcfe8"/>

    <!-- Neck -->
    <rect x="138" y="125" width="10" height="15" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="143" cy="115" r="15" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 128 115 C 128 100 158 100 158 115 C 152 108 134 108 128 115 Z" fill="#1e293b"/>
    <!-- Face profile detail -->
    <path d="M 155 113 Q 158 116 154 119" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Concentrated Expression (Eyebrow) -->
    <line x1="148" y1="110" x2="154" y2="112" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- THE CORE SCENARIO: TWO PERPENDICULAR LINES (垂直 - chuízhí) -->
  <g id="perpendicular-lines-focus">
    <!-- Drop shadow for the graphic board/surface where lines are drawn -->
    <polygon points="65,95 145,75 165,155 85,175" fill="#0f172a" opacity="0.4"/>
    
    <!-- Architectural Drawing Board -->
    <polygon points="60,90 140,70 160,150 80,170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="65,95 135,77 152,145 82,163" fill="#ffffff"/>

    <!-- Horizontal Line (Line 1) -->
    <line x1="72" y1="135" x2="148" y2="115" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

    <!-- Vertical Line (Line 2) - Formally meeting at 90 degrees -->
    <line x1="102" y1="83" x2="128" y2="155" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Angle Indicator Box (Crucial visual cue for 垂直 / perpendicular) -->
    <g transform="translate(112, 119) rotate(15)">
      <!-- Rotation matches the angle of intersection -->
      <path d="M 0 0 L 0 10 L 10 10" fill="none" stroke="#ef4444" stroke-width="2.5"/>
      <circle cx="5" cy="5" r="1.5" fill="#ef4444"/>
    </g>

    <!-- Sparkle / Precision Glow at the intersection point -->
    <circle cx="115" cy="125" r="3" fill="#ffffff"/>
    <circle cx="115" cy="125" r="6" fill="#f59e0b" opacity="0.4"/>
  </g>

  <!-- FOREGROUND ACCENTS / DEPTH -->
  <!-- Floating technical compass / divider tool -->
  <g transform="translate(70, 140) rotate(-20)">
    <line x1="0" y1="0" x2="-8" y2="25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#cbd5e1"/>
  </g>
</svg>