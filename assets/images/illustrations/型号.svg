<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Device Body -->
  <rect x="70" y="60" width="100" height="120" rx="8" fill="#2D343E" stroke="#FFB84D" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="80" y="75" width="80" height="60" rx="4" fill="#1A1D24" stroke="#4A5568" stroke-width="1"/>
  
  <!-- Identification Label Area -->
  <rect x="80" y="145" width="80" height="25" rx="4" fill="#3A4250"/>
  
  <!-- Model Number Representation (Lines representing alphanumeric code) -->
  <line x1="90" y1="152" x2="140" y2="152" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="162" x2="120" y2="162" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Magnifying Glass focusing on the model number -->
  <circle cx="135" cy="155" r="25" fill="none" stroke="#FFB84D" stroke-width="3"/>
  <line x1="152" y1="172" x2="175" y2="195" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
</svg>