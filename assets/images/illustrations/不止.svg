<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Character 1 (Left - Sitting on ground) -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M10 40 Q20 60 30 40" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <rect x="5" y="55" width="30" height="40" rx="5" fill="#fb923c"/>
    <rect x="10" y="95" width="8" height="10" fill="#fb923c"/>
    <rect x="22" y="95" width="8" height="10" fill="#fb923c"/>
    <!-- Bandage -->
    <rect x="12" y="65" width="16" height="6" fill="#e2e8f0" rx="2"/>
  </g>

  <!-- Character 2 (Right - Standing/Leaning) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <rect x="5" y="40" width="30" height="60" rx="5" fill="#38bdf8"/>
    <!-- Bandage on arm -->
    <rect x="2" y="55" width="6" height="15" fill="#e2e8f0" rx="2"/>
    <rect x="10" y="100" width="8" height="15" fill="#38bdf8"/>
    <rect x="22" y="100" width="8" height="15" fill="#38bdf8"/>
  </g>

  <!-- Context: Fallen items (implying accident) -->
  <path d="M100 190 L120 170 L140 190 Z" fill="#ec4899" opacity="0.6"/>
  <circle cx="110" cy="200" r="5" fill="#10b981"/>
  <rect x="150" y="195" width="20" height="5" fill="#fbbf24" rx="2"/>
  
  <!-- Environment details -->
  <path d="M20 220 L220 220" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="200" cy="50" r="30" fill="#fbbf24" opacity="0.1"/>
</svg>