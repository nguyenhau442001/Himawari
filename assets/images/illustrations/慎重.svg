<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Background Glow -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual Object: Precision Scale / Balance representing Careful Deliberation (thận trọng) -->
  <g transform="translate(120, 115)">
    <!-- Base / Stand -->
    <path d="M-12,65 L12,65 L8,50 L-8,50 Z" fill="#4E5D6C"/>
    <rect x="-3" y="10" width="6" height="42" fill="#8C9BA5" rx="1"/>
    
    <!-- Central Pivot / Top Dome -->
    <circle cx="0" cy="10" r="8" fill="#F39C12"/>
    <circle cx="0" cy="10" r="4" fill="#1A1D24"/>

    <!-- Beam (Slightly tilted to show careful weighing/thinking) -->
    <g transform="rotate(-5)">
      <rect x="-65" y="6" width="130" height="6" rx="3" fill="#8C9BA5"/>
      
      <!-- Left Chain & Pan -->
      <path d="M-60,12 L-60,45" stroke="#8C9BA5" stroke-width="2" stroke-linecap="round"/>
      <path d="M-60,45 C-60,52 -45,55 -35,55 C-45,55 -75,55 -75,45 Z" fill="none"/> <!-- spacer logic -->
      <path d="M-75,42 C-75,42 -60,45 -60,45 C-60,45 -45,42 -45,42 C-48,50 -72,50 -75,42 Z" fill="#F39C12"/>
      <path d="M-72,32 L-60,42 L-48,32" stroke="#8C9BA5" stroke-width="1.5" fill="none"/>

      <!-- Right Chain & Pan (Holding a glowing decision/thought node) -->
      <path d="M60,12 L60,45" stroke="#8C9BA5" stroke-width="2" stroke-linecap="round"/>
      <path d="M45,42 C45,42 60,45 60,45 C60,45 75,42 75,42 C72,50 48,50 45,42 Z" fill="#F39C12"/>
      <path d="M48,32 L60,42 L72,32" stroke="#8C9BA5" stroke-width="1.5" fill="none"/>

      <!-- Glowing Thought/Decision Sphere inside Right Pan -->
      <circle cx="60" cy="27" r="10" fill="#3498DB" opacity="0.9"/>
      <circle cx="58" cy="25" r="3" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Base Platform / Reflection -->
    <ellipse cx="0" cy="72" r="35" fill="#15181E" opacity="0.8"/>
  </g>

  <!-- Accent Focus Element (Sparkle of careful consideration) -->
  <g transform="translate(170, 70)">
    <path d="M0,-8 C1,-3 3,-1 8,0 C3,1 1,3 0,8 C-1,3 -3,1 -8,0 C-3,-1 -1,-3 0,-8 Z" fill="#F39C12"/>
  </g>
  <g transform="translate(70, 85) scale(0.6)">
    <path d="M0,-8 C1,-3 3,-1 8,0 C3,1 1,3 0,8 C-1,3 -3,1 -8,0 C-3,-1 -1,-3 0,-8 Z" fill="#F39C12" opacity="0.7"/>
  </g>
</svg>