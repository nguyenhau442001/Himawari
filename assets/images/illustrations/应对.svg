<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Desk -->
  <rect x="20" y="140" width="200" height="15" rx="2" fill="#334155"/>
  <rect x="30" y="155" width="10" height="60" rx="2" fill="#475569"/>
  <rect x="200" y="155" width="10" height="60" rx="2" fill="#475569"/>
  
  <!-- Laptop with Alert Glow -->
  <path d="M70 140 L170 140 L185 100 L55 100 Z" fill="#334155"/>
  <rect x="60" y="105" width="120" height="35" rx="2" fill="#1e293b"/>
  <circle cx="120" cy="122" r="8" fill="#fb923c" opacity="0.8"/>
  <path d="M117 118 L123 126 M123 118 L117 126" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-40 60 C-40 30, -20 20, 0 20 C20 20, 40 30, 40 60" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#fde68a"/>
    <!-- Calm Face -->
    <line x1="-8" y1="-15" x2="-4" y2="-15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="-15" x2="8" y2="-15" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6 -5 Q0 0 6 -5" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hands on keyboard -->
    <circle cx="-20" cy="10" r="8" fill="#fde68a"/>
    <circle cx="20" cy="10" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Floating elements representing the 'unexpected situation' -->
  <path d="M190 50 L200 30 L210 50 Z" fill="#ec4899"/>
  <circle cx="40" cy="60" r="6" fill="#10b981"/>
  <rect x="180" y="80" width="10" height="10" rx="2" fill="#fbbf24"/>
  
  <!-- Ambient light -->
  <circle cx="120" cy="120" r="40" fill="#fb923c" opacity="0.05"/>
</svg>