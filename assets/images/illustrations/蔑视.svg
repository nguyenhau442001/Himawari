<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Light -->
    <radialGradient id="deskLight" cx="30%" cy="40%" r="70%" fx="30%" fy="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Character 2 Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#deskLight)" />

  <!-- ENVIRONMENT: Modern Office Interior -->
  <!-- Background Wall Panel -->
  <rect x="24" y="24" width="192" height="136" rx="8" fill="#1e293b" />
  <path d="M24 70 L216 70" stroke="#334155" stroke-width="2" />
  <path d="M24 130 L216 130" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Window with City View Silhouette -->
  <path d="M150 40 L200 40 L200 110 L150 110 Z" fill="#090d16" />
  <path d="M160 55 L170 55 L170 110 L160 110 Z" fill="#1e293b" opacity="0.3" />
  <path d="M180 48 L190 48 L190 110 L180 110 Z" fill="#1e293b" opacity="0.3" />
  <!-- City glow -->
  <circle cx="175" cy="75" r="12" fill="#f59e0b" opacity="0.2" />

  <!-- Indoor Plant -->
  <path d="M38 120 C35 110 40 100 45 95 C45 90 55 90 55 95 C60 100 65 110 62 120 Z" fill="#10b981" />
  <path d="M50 120 L48 105 L52 105 Z" fill="#059669" />
  <path d="M40 120 L42 135 L58 135 L60 120 Z" fill="#64748b" />

  <!-- Office Desk Surface -->
  <path d="M10 160 L230 160 L220 200 L20 200 Z" fill="#334155" />
  <path d="M10 160 L230 160 L230 165 L10 165 Z" fill="#475569" />

  <!-- Desk Props: Laptop & Coffee -->
  <!-- Laptop -->
  <path d="M140 145 L185 145 L190 158 L135 158 Z" fill="#94a3b8" />
  <path d="M135 158 L190 158 L193 162 L132 162 Z" fill="#cbd5e1" />
  <path d="M145 130 L180 130 L180 145 L145 145 Z" fill="#64748b" />
  <!-- Coffee Mug -->
  <rect x="110" y="143" width="14" height="17" rx="3" fill="#f8fafc" />
  <path d="M124 147 C128 147 128 155 124 155" stroke="#f8fafc" stroke-width="2" fill="none" />

  <!-- TABLE OBJECT: Discarded/Messy Project Paper (The "Behavior" in question) -->
  <g filter="url(#shadow)">
    <path d="M75 148 L105 142 L112 165 L82 171 Z" fill="#f1f5f9" />
    <path d="M83 152 L98 149" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M82 158 L102 154" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <path d="M85 164 L95 162" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  </g>


  <!-- CHARACTER 1: The Subject Expressing Scorn/Contempt (Standing, leaning slightly) -->
  <g id="contemptuous-character" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M75 100 C75 90 95 90 95 100 L100 155 L70 155 Z" fill="url(#jacketGrad)" />
    
    <!-- Shirt Collar / Tie -->
    <path d="M82 100 L85 110 L88 100 Z" fill="#f8fafc" />
    <path d="M85 110 L85 130" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

    <!-- Head & Neck -->
    <path d="M80 85 L90 85 L90 95 L80 95 Z" fill="#fbcfe8" />
    <circle cx="85" cy="72" r="16" fill="#fbcfe8" />

    <!-- Hair (Styled neat modern short hair) -->
    <path d="M69 70 C69 55 101 55 101 70 C101 75 99 72 99 68 C99 58 71 58 71 68 C71 72 69 75 69 70 Z" fill="#1e293b" />
    <path d="M70 70 L75 75 L80 69 Z" fill="#1e293b" />

    <!-- Facial Expression: DISDAIN / SCORN (蔑视) -->
    <!-- Eyebrows: Asymmetrical, lowered critically -->
    <path d="M76 66 L83 69" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <path d="M87 68 L94 65" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    
    <!-- Eyes: Narrowed, looking down sideways with cold detachment -->
    <circle cx="79" cy="73" r="2" fill="#0f172a" />
    <circle cx="91" cy="73" r="2" fill="#0f172a" />
    <!-- Eyelids / Glare -->
    <path d="M76 71 L82 72" stroke="#0f172a" stroke-width="1.5" />
    <path d="M88 72 L94 71" stroke="#0f172a" stroke-width="1.5" />

    <!-- Nose -->
    <path d="M86 74 L84 79 L87 80" stroke="#e2e8f0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth: Smirk / Sneer (One side raised, showing strong contempt) -->
    <path d="M79 84 C82 82 87 82 91 85" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M88 83.5 L91 85" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Crossed Arms (Classic Body Language for Dismissal/Contempt) -->
    <!-- Back Arm -->
    <path d="M75 105 C65 110 60 120 70 125 L85 115 Z" fill="#1d4ed8" />
    <!-- Front Arm / Hand tucking under elbow -->
    <path d="M95 105 C105 110 100 125 85 125 L75 118 Z" fill="#3b82f6" />
    <!-- Hand clasping -->
    <circle cx="75" cy="118" r="5" fill="#fbcfe8" />
  </g>


  <!-- CHARACTER 2: The Target of Scorn (Sitting, looking submissive or awkward) -->
  <g id="target-character" opacity="0.95" filter="url(#shadow)">
    <!-- Back / Body sitting -->
    <path d="M190 120 C190 110 210 110 210 120 L215 165 L185 165 Z" fill="url(#suitGrad)" />

    <!-- Head & Neck -->
    <path d="M195 105 L205 105 L205 115 L195 115 Z" fill="#fbcfe8" />
    <circle cx="200" cy="92" r="14" fill="#fbcfe8" />

    <!-- Hair -->
    <path d="M188 90 C188 80 212 80 212 90 C212 93 210 90 208 88 C204 83 196 83 192 88 C190 90 188 93 188 90 Z" fill="#334155" />

    <!-- Expression: Uncomfortable / Nervous (Looking down at the messy paper) -->
    <!-- Eyes looking down -->
    <circle cx="196" cy="94" r="1.5" fill="#0f172a" />
    <circle cx="204" cy="94" r="1.5" fill="#0f172a" />
    <!-- Nervous mouth -->
    <path d="M198 101 L202 101" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Reaching/Fidgeting Hand -->
    <path d="M190 135 C175 140 160 148 150 152" stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="147" cy="153" r="4" fill="#fbcfe8" />
  </g>

  <!-- FOREGROUND VIGNETTE / POLISH -->
  <!-- Subtle light accent hitting character's shoulder -->
  <path d="M75 95 C80 95 85 97 88 100 L85 110 C80 105 76 100 75 95 Z" fill="#93c5fd" opacity="0.4" />

  <!-- Action Emphasis Lines (Subtle visual cue near the sneering face/body language) -->
  <path d="M62 100 L68 104" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M60 112 L67 114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>