<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- School Gate (The Reference Point) -->
  <path d="M100 180 L100 90 L140 90 L140 180" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="105" y="100" width="30" height="80" fill="#334155"/>
  
  <!-- The Left Side (Focus Area) -->
  <g transform="translate(40, 100)">
    <!-- Tall Poplar Trees -->
    <path d="M20 80 L20 20 M10 80 L10 30 M30 80 L30 30" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="15" r="8" fill="#F59E0B"/>
    <circle cx="10" cy="25" r="6" fill="#F59E0B"/>
    <circle cx="30" cy="25" r="6" fill="#F59E0B"/>
  </g>
  
  <!-- Directional Indicator (Subtle highlight for "Left") -->
  <path d="M60 50 L40 70 L60 90" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="70" x2="80" y2="70" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
</svg>