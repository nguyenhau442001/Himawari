<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Sanctuary Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#4ade80" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Foliage Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <linearGradient id="leafGradL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <linearGradient id="leafGradR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Hand Skin Gradients -->
    <linearGradient id="skinL" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <linearGradient id="skinR" x1="100%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Sleeves -->
    <linearGradient id="sleeveL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="sleeveR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.6" />
    </filter>

    <filter id="glowPlant" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Rounded Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Harsh Rain Outside Sanctuary (Context: What it is protected from) -->
  <g stroke="#38bdf8" stroke-linecap="round" opacity="0.22">
    <line x1="22" y1="16" x2="38" y2="42" stroke-width="1.8" />
    <line x1="54" y1="10" x2="68" y2="32" stroke-width="1.4" />
    <line x1="14" y1="55" x2="28" y2="78" stroke-width="1.6" />
    <line x1="202" y1="16" x2="218" y2="44" stroke-width="1.8" />
    <line x1="222" y1="52" x2="234" y2="74" stroke-width="1.4" />
    <line x1="180" y1="12" x2="192" y2="30" stroke-width="1.2" />
  </g>

  <!-- Night Sky Stars -->
  <g fill="#94a3b8" opacity="0.35">
    <circle cx="36" cy="34" r="1.2" />
    <circle cx="84" cy="22" r="1" />
    <circle cx="156" cy="26" r="1.2" />
    <circle cx="212" cy="36" r="1" />
  </g>

  <!-- Warm Sanctuary Glow surrounding the sprout inside the hands -->
  <circle cx="120" cy="124" r="76" fill="url(#coreGlow)" />

  <!-- Back Fingers Cupping Upwards (Rear Protective Layer) -->
  <g filter="url(#dropShadow)">
    <!-- Left Hand Fingers -->
    <path d="M58 190 C50 170 54 150 64 136 C66 132 72 134 71 138 C64 150 62 166 70 182 Z" fill="#ea580c" />
    <path d="M68 184 C62 162 66 140 76 124 C78 120 84 122 83 126 C75 140 73 158 82 176 Z" fill="#f97316" />
    <path d="M78 180 C74 155 80 132 90 114 C92 110 98 112 97 116 C89 132 86 152 94 172 Z" fill="#fdba74" />
    <path d="M88 178 C86 156 94 136 104 120 C106 116 112 118 111 122 C103 136 98 154 104 172 Z" fill="#fed7aa" />

    <!-- Right Hand Fingers -->
    <path d="M182 190 C190 170 186 150 176 136 C174 132 168 134 169 138 C176 150 178 166 170 182 Z" fill="#c2410c" />
    <path d="M172 184 C178 162 174 140 164 124 C162 120 156 122 157 126 C165 140 167 158 158 176 Z" fill="#ea580c" />
    <path d="M162 180 C166 155 160 132 150 114 C148 110 142 112 143 116 C151 132 154 152 146 172 Z" fill="#f97316" />
    <path d="M152 178 C154 156 146 136 136 120 C134 116 128 118 129 122 C137 136 142 154 136 172 Z" fill="#fdba74" />
  </g>

  <!-- Fertile Earth Mound Held in Center -->
  <g filter="url(#dropShadow)">
    <ellipse cx="120" cy="172" rx="44" ry="15" fill="#1c1917" />
    <ellipse cx="120" cy="170" rx="36" ry="11" fill="#292524" />
    <ellipse cx="120" cy="168" rx="24" ry="7" fill="#3f3f46" />
    <circle cx="106" cy="170" r="1.5" fill="#78350f" />
    <circle cx="118" cy="171" r="1.2" fill="#a16207" />
    <circle cx="133" cy="169" r="1.4" fill="#78350f" />
  </g>

  <!-- ================= THE SPROUT (Subject being protected) ================= -->
  <g id="sprout" filter="url(#glowPlant)">
    <!-- Root Anchor Base -->
    <path d="M116 168 Q120 164 124 168" stroke="#a16207" stroke-width="2.5" stroke-linecap="round" />

    <!-- Stem (Graceful curve upward) -->
    <path d="M120 168 C119 148 117 132 120 112" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Left Hearty Leaf -->
    <path d="M119 140 C95 138 78 118 82 100 C102 100 117 120 119 130 Z" fill="url(#leafGradL)" />
    <path d="M118 128 C106 120 95 112 88 104" stroke="#bbf7d0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85" />
    <!-- Dewdrop on Left Leaf -->
    <circle cx="94" cy="107" r="2.5" fill="#f0fdf4" opacity="0.95" />
    <circle cx="93.5" cy="106" r="0.8" fill="#ffffff" />

    <!-- Right Hearty Leaf -->
    <path d="M120 132 C144 128 158 110 154 92 C136 94 122 114 120 124 Z" fill="url(#leafGradR)" />
    <path d="M121 122 C132 114 142 106 147 98" stroke="#86efac" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85" />
    <!-- Dewdrop on Right Leaf -->
    <circle cx="146" cy="98" r="2.2" fill="#f0fdf4" opacity="0.95" />
    <circle cx="145.5" cy="97.2" r="0.7" fill="#ffffff" />

    <!-- Center Tender Bud (New Life) -->
    <path d="M120 114 C116 104 118 94 120 88 C122 94 124 104 120 114 Z" fill="#86efac" />
  </g>

  <!-- Golden Vitality Particles & Warmth -->
  <circle cx="105" cy="116" r="1.5" fill="#fef08a" opacity="0.95" />
  <circle cx="135" cy="118" r="1.8" fill="#fef08a" opacity="0.95" />
  <circle cx="120" cy="80" r="1.5" fill="#86efac" opacity="0.9" />
  <circle cx="111" cy="144" r="1.2" fill="#fef08a" opacity="0.85" />
  <circle cx="131" cy="142" r="1.2" fill="#86efac" opacity="0.85" />

  <!-- ================= FOREGROUND PALMS & CRADLE ================= -->
  <g filter="url(#dropShadow)">
    <!-- Left Forearm & Palm Base -->
    <path d="M50 240 L54 212 C56 195 70 186 92 186 C105 186 116 190 120 196 L120 240 Z" fill="url(#skinL)" />
    <!-- Left Sleeve Cuff -->
    <path d="M48 240 L52 216 L76 218 L76 240 Z" fill="url(#sleeveL)" />
    <path d="M52 216 L76 218" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" />

    <!-- Right Forearm & Palm Base -->
    <path d="M190 240 L186 212 C184 195 170 186 148 186 C135 186 124 190 120 196 L120 240 Z" fill="url(#skinR)" />
    <!-- Right Sleeve Cuff -->
    <path d="M192 240 L188 216 L164 218 L164 240 Z" fill="url(#sleeveR)" />
    <path d="M188 216 L164 218" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Left Thumb resting tenderly along front-left edge of soil -->
    <path d="M74 186 C 86 178, 104 180, 118 187 C 121 189, 117 193, 111 193 C 96 193, 84 189, 74 186 Z" fill="#fed7aa" />

    <!-- Right Thumb resting tenderly along front-right edge of soil -->
    <path d="M166 186 C 154 178, 136 180, 122 187 C 119 189, 123 193, 129 193 C 144 193, 156 189, 166 186 Z" fill="#fed7aa" />

    <!-- Center Palm Highlight where hands meet -->
    <ellipse cx="120" cy="194" rx="16" ry="5" fill="#ffedd5" opacity="0.55" />
    <circle cx="120" cy="193" r="2" fill="#ffffff" opacity="0.7" />
  </g>
</svg>