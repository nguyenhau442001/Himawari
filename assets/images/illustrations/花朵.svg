<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing garden atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Stem and Leaves -->
  <g>
    <!-- Main stem -->
    <path d="M120 135 C 118 160, 122 185, 120 205" stroke="#4ADE80" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Left leaf -->
    <path d="M119 165 C 100 160, 85 170, 95 185 C 105 195, 118 180, 119 165 Z" fill="#22C55E"/>
    <path d="M119 165 C 110 172, 102 180, 95 185" stroke="#15803D" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Right leaf -->
    <path d="M120 175 C 138 170, 155 180, 145 195 C 135 205, 122 190, 120 175 Z" fill="#22C55E"/>
    <path d="M120 175 C 128 182, 137 190, 145 195" stroke="#15803D" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Flower Head (花朵) -->
  <g transform="translate(120, 110)">
    <!-- Outer Petals (Back layer for depth) -->
    <g fill="#FB923C">
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(0)"/>
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(45)"/>
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(90)"/>
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(135)"/>
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(180)"/>
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(225)"/>
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(270)"/>
      <ellipse cx="0" cy="-42" rx="18" ry="28" transform="rotate(315)"/>
    </g>

    <!-- Inner Petals (Foreground layer for richness) -->
    <g fill="#FBBF24">
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(22.5)"/>
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(67.5)"/>
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(112.5)"/>
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(157.5)"/>
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(202.5)"/>
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(247.5)"/>
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(292.5)"/>
      <ellipse cx="0" cy="-35" rx="14" ry="22" transform="rotate(337.5)"/>
    </g>

    <!-- Flower Center (Receptacle) -->
    <circle cx="0" cy="0" r="22" fill="#D97706"/>
    <circle cx="0" cy="0" r="16" fill="#F59E0B"/>
    
    <!-- Decorative pollen dots inside center -->
    <circle cx="-5" cy="-5" r="2" fill="#B45309"/>
    <circle cx="6" cy="-4" r="2" fill="#B45309"/>
    <circle cx="-3" cy="6" r="2" fill="#B45309"/>
    <circle cx="5" cy="5" r="2" fill="#B45309"/>
    <circle cx="0" cy="0" r="2.5" fill="#B45309"/>
  </g>

  <!-- Contextual Garden Elements (Subtle sparkling/dot accents around flower) -->
  <g fill="#FBBF24" opacity="0.6">
    <circle cx="65" cy="75" r="2"/>
    <circle cx="180" cy="85" r="1.5"/>
    <circle cx="70" cy="140" r="1.5"/>
    <circle cx="170" cy="150" r="2"/>
    <circle cx="95" cy="55" r="1"/>
    <circle cx="145" cy="50" r="1.5"/>
  </g>
</svg>