<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Details -->
  <circle cx="120" cy="120" r="70" fill="#222733" />
  
  <!-- Ticket Gate / Turnstile Structure -->
  <path d="M70 180 L70 130 L100 130 L100 180 Z" fill="#2E3646" />
  <path d="M170 180 L170 130 L140 130 L140 180 Z" fill="#2E3646" />
  
  <!-- Gate Barrier Arms (Active/Swinging) -->
  <path d="M100 145 L145 125" stroke="#FFA726" stroke-width="8" stroke-linecap="round" />
  
  <!-- Scanner / Terminal Box -->
  <rect x="90" y="85" width="60" height="70" rx="8" fill="#2F3646" />
  <rect x="100" y="95" width="40" height="30" rx="4" fill="#11151C" />
  
  <!-- Scanner Screen Light / Scanning Beam -->
  <rect x="104" y="99" width="32" height="22" rx="2" fill="#0D47A1" />
  <polygon points="104,99 136,99 144,125 96,125" fill="#4FC3F7" opacity="0.3" />
  <line x1="104" y1="112" x2="136" y2="112" stroke="#29B6F6" stroke-width="2" />

  <!-- Target: Train Ticket Being Inserted / Scanned -->
  <g transform="translate(120, 105) rotate(-25)">
    <!-- Ticket Body -->
    <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#FFF" />
    <!-- Ticket Strip / Accent -->
    <rect x="-35" y="-12" width="20" height="24" fill="#FFA726" />
    <!-- Barcode lines on ticket -->
    <line x1="-8" y1="-6" x2="-8" y2="6" stroke="#333" stroke-width="2" />
    <line x1="-3" y1="-6" x2="-3" y2="6" stroke="#333" stroke-width="1" />
    <line x1="1" y1="-6" x2="1" y2="6" stroke="#333" stroke-width="3" />
    <line x1="7" y1="-6" x2="7" y2="6" stroke="#333" stroke-width="1" />
    <line x1="11" y1="-6" x2="11" y2="6" stroke="#333" stroke-width="2" />
    <!-- Notch / Punch hole -->
    <circle cx="25" cy="0" r="3" fill="#1A1D24" />
  </g>

  <!-- Success Indicator Light -->
  <circle cx="120" cy="145" r="5" fill="#66BB6A" />
  
  <!-- Floor base line -->
  <line x1="50" y1="180" x2="190" y2="180" stroke="#374151" stroke-width="4" stroke-linecap="round" />
</svg>