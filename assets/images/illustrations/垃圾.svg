<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/shadow behind the main object -->
  <circle cx="120" cy="130" r="50" fill="#2E3440" opacity="0.5"/>

  <!-- Trash Can / Bin Object -->
  <!-- Can Body -->
  <path d="M 85 90 L 95 185 C 95 190, 99 195, 105 195 L 135 195 C 141 195, 145 190, 145 185 L 155 90 Z" fill="#3B4252"/>
  
  <!-- Can Ribs / Texture Lines -->
  <line x1="105" y1="105" x2="102" y2="180" stroke="#4C566A" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="105" x2="120" y2="180" stroke="#4C566A" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="105" x2="138" y2="180" stroke="#4C566A" stroke-width="3" stroke-linecap="round"/>

  <!-- Can Rim -->
  <path d="M 75 80 L 165 80 C 168 80, 170 83, 168 86 L 162 92 C 161 93, 159 94, 157 94 L 83 94 C 81 94, 79 93, 78 92 L 72 86 C 70 83, 72 80, 75 80 Z" fill="#D8DEE9"/>

  <!-- Lid (Open, angled up) -->
  <g transform="translate(120, 75) rotate(-25) translate(-120, -75)">
    <path d="M 80 65 L 160 65 C 163 65, 165 67, 164 70 L 158 77 C 157 78, 156 79, 154 79 L 86 79 C 84 79, 83 78, 82 77 L 76 70 C 75 67, 77 65, 80 65 Z" fill="#E5E9F0"/>
    <!-- Lid Handle -->
    <path d="M 110 65 C 110 59, 130 59, 130 65" fill="none" stroke="#4C566A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Emerging Trash / Garbage items (Focus on "lājī" / rác) -->
  <!-- Crumpled Paper Ball -->
  <path d="M 105 75 C 98 70, 95 60, 102 52 C 109 45, 118 48, 124 54 C 130 50, 138 58, 135 66 C 140 72, 133 80, 125 78 C 118 83, 108 80, 105 75 Z" fill="#ECEFF4"/>
  <path d="M 110 60 Q 118 62 120 70" fill="none" stroke="#D8DEE9" stroke-width="2" stroke-linecap="round"/>

  <!-- Banana Peel -->
  <path d="M 140 70 C 150 65, 165 55, 170 45" fill="none" stroke="#EBCB8B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 145 75 C 160 70, 175 75, 185 85" fill="none" stroke="#EBCB8B" stroke-width="7" stroke-linecap="round"/>
  <path d="M 135 78 C 140 90, 135 105, 128 115" fill="none" stroke="#EBCB8B" stroke-width="6" stroke-linecap="round"/>

  <!-- Tin Can / Soda Can (Crushed/Discarded) -->
  <rect x="75" y="60" width="18" height="25" rx="4" transform="rotate(15 84 72)" fill="#BF616A"/>
  <rect x="78" y="65" width="12" height="4" rx="1" transform="rotate(15 84 72)" fill="#ECEFF4"/>

  <!-- Action indicator: Subtle downward motion lines (indicating throwing away) -->
  <path d="M 120 28 L 120 42" stroke="#88C0D0" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 100 32 L 108 44" stroke="#88C0D0" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
</svg>