<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sun rising over a horizon line -->
  <circle cx="120" cy="160" r="45" fill="#1A1D24" stroke="#FFB347" stroke-width="4"/>
  <path d="M75 160 A 45 45 0 0 1 165 160" fill="#FFB347"/>
  
  <!-- Rays of light -->
  <line x1="120" y1="100" x2="120" y2="80" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="120" x2="175" y2="105" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="65" y2="105" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Landscape element: A small tree or sprout representing fresh air/nature -->
  <path d="M120 160 L120 130 M120 130 L110 120 M120 130 L130 120" stroke="#77DD77" stroke-width="6" stroke-linecap="round"/>
  <circle cx="110" cy="120" r="6" fill="#77DD77"/>
  <circle cx="130" cy="120" r="6" fill="#77DD77"/>
  
  <!-- Horizon line -->
  <line x1="40" y1="160" x2="200" y2="160" stroke="#4A5568" stroke-width="2"/>
</svg>