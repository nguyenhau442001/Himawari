<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing atmospheric aura behind the headphones -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Headphones Graphic (Noun: 耳机) -->
  <g transform="translate(0, 5)">
    <!-- Headband Arc -->
    <path d="M 75 110 C 75 55, 165 55, 165 110" 
          fill="none" 
          stroke="#343B48" 
          stroke-width="12" 
          stroke-linecap="round"/>
    
    <!-- Inner Accent Arc (Orange/Gold focus) -->
    <path d="M 82 110 C 82 64, 158 64, 158 110" 
          fill="none" 
          stroke="#F39C12" 
          stroke-width="4" 
          stroke-linecap="round"
          opacity="0.9"/>

    <!-- Left & Right Extension Rods -->
    <rect x="71" y="105" width="8" height="20" rx="4" fill="#4F5D73"/>
    <rect x="161" y="105" width="8" height="20" rx="4" fill="#4F5D73"/>

    <!-- Left Ear Cup Assembly -->
    <g transform="translate(62, 120)">
      <!-- Connector Joint -->
      <rect x="11" y="-5" width="12" height="15" rx="3" fill="#2C323D"/>
      <!-- Main Cup Housing -->
      <rect x="0" y="5" width="34" height="64" rx="16" fill="#2C323D"/>
      <!-- Accent Rim -->
      <rect x="24" y="9" width="6" height="56" rx="3" fill="#F39C12"/>
      <!-- Subtle detail lines -->
      <line x1="8" y1="20" x2="16" y2="20" stroke="#4F5D73" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="37" x2="16" y2="37" stroke="#4F5D73" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Right Ear Cup Assembly -->
    <g transform="translate(144, 120)">
      <!-- Connector Joint -->
      <rect x="11" y="-5" width="12" height="15" rx="3" fill="#2C323D"/>
      <!-- Main Cup Housing -->
      <rect x="0" y="5" width="34" height="64" rx="16" fill="#2C323D"/>
      <!-- Accent Rim -->
      <rect x="4" y="9" width="6" height="56" rx="3" fill="#F39C12"/>
      <!-- Subtle detail lines -->
      <line x1="18" y1="20" x2="26" y2="20" stroke="#4F5D73" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="37" x2="26" y2="37" stroke="#4F5D73" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Audio Waves (Subtle context for music/listening) -->
  <g opacity="0.4" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Left Waves -->
    <path d="M 42 135 C 36 142, 36 158, 42 165"/>
    <path d="M 30 127 C 21 138, 21 162, 30 173"/>
    
    <!-- Right Waves -->
    <path d="M 198 135 C 204 142, 204 158, 198 165"/>
    <path d="M 210 127 C 219 138, 219 162, 210 173"/>
  </g>
</svg>