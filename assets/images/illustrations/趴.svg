<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Bedding & Frame Gradients -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <linearGradient id="mattressGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pillowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props -->
  <!-- Cozy Room Wall / Wallpaper line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="80" width="45" height="60" rx="4" fill="#334155" opacity="0.4"/>
  <path d="M 30 110 Q 42.5 95 55 110" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Bedside Lamp & Nightstand -->
  <rect x="185" y="110" width="35" height="70" fill="#334155"/>
  <path d="M 190 110 L 202.5 90 L 215 110 Z" fill="#f59e0b"/>
  <!-- Lamp Light Effect -->
  <circle cx="202.5" cy="120" r="45" fill="url(#lampGlow)"/>

  <!-- The Bed (Wooden Frame & Mattress) -->
  <rect x="15" y="150" width="210" height="35" rx="6" fill="url(#woodGrad)"/>
  <rect x="20" y="135" width="200" height="25" rx="8" fill="url(#mattressGrad)"/>
  <!-- Headboard -->
  <rect x="15" y="105" width="16" height="55" rx="4" fill="#92400e"/>

  <!-- Pillow -->
  <rect x="35" y="125" width="55" height="22" rx="8" fill="url(#pillowGrad)"/>

  <!-- Child Lying Prone (趴 - pā) on the Bed -->
  <g id="child-prone">
    <!-- Legs dangling/bent happily behind -->
    <path d="M 155 145 C 175 140, 185 160, 175 170 C 170 175, 160 165, 150 152" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
    <!-- Feet/Socks -->
    <circle cx="177" cy="170" r="5" fill="#ec4899"/>

    <!-- Torso lying flat (horizontal perspective) -->
    <rect x="90" y="132" width="70" height="24" rx="10" fill="#38bdf8"/>

    <!-- Hoodie Details / Sleeves resting forward -->
    <path d="M 85 135 L 70 148 L 75 155 L 90 142 Z" fill="#0284c7"/>
    <path d="M 105 135 L 90 150 L 98 156 L 112 140 Z" fill="#0284c7"/>
    <!-- Hands propping up the head -->
    <circle cx="70" cy="142" r="6" fill="#fbcfe8"/>
    <circle cx="92" cy="142" r="6" fill="#fbcfe8"/>

    <!-- Head lifted up slightly to read -->
    <g transform="translate(62, 115)">
      <!-- Hair -->
      <circle cx="12" cy="12" r="14" fill="#1e293b"/>
      <!-- Face profile/front -->
      <circle cx="16" cy="15" r="12" fill="#fbcfe8"/>
      <!-- Cheeks -->
      <circle cx="21" cy="18" r="3" fill="#fda4af" opacity="0.7"/>
      <!-- Eye (focused downward) -->
      <circle cx="20" cy="14" r="1.5" fill="#0f172a"/>
      <!-- Cute happy expression curve -->
      <path d="M 21 19 Q 24 21 22 23" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Open Book Propped Up in front of the Child -->
  <g transform="translate(45, 138)">
    <!-- Book Cover -->
    <path d="M 0 5 L 15 -3 L 30 5 L 30 25 L 15 20 L 0 25 Z" fill="#ec4899"/>
    <!-- Open Pages -->
    <path d="M 2 7 Q 15 2 15 18 Q 15 2 28 7 L 28 22 Q 15 17 2 22 Z" fill="#f8fafc"/>
    <!-- Page Lines (Simulating Text/Stories) -->
    <line x1="6" y1="10" x2="12" y2="12" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="11" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="10" x2="24" y2="12" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="14" x2="23" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Book Spine -->
    <line x1="15" y1="3" x2="15" y2="20" stroke="#be185d" stroke-width="1"/>
  </g>

  <!-- Floating playful magic elements / cozy atmosphere sparkles -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="55" cy="95" r="2"/>
    <circle cx="120" cy="100" r="1.5"/>
    <circle cx="160" cy="115" r="2.5"/>
    <!-- Tiny star/sparkle -->
    <path d="M 105 85 L 107 90 L 112 92 L 107 94 L 105 99 L 103 94 L 98 92 L 103 90 Z" fill="#f59e0b" transform="scale(0.5) translate(110, 80)"/>
  </g>
</svg>