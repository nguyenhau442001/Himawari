<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Stream / Water Object Visualization for "清" (trong vắt, trong trẻo) -->
  <g transform="translate(0, 10)">
    <!-- Stream Bank / Ground -->
    <path d="M20 185 Q 120 170 220 185 L 220 215 L 20 215 Z" fill="#2A303C"/>
    
    <!-- Stream Channel Cutout / Water Body Container -->
    <path d="M40 120 Q 120 100 200 120 L 210 180 Q 120 195 30 180 Z" fill="#14181F"/>

    <!-- Crystal Clear Water Layer with transparency effect -->
    <path d="M45 125 Q 120 107 195 125 Q 205 155 195 175 Q 120 188 45 175 Q 35 155 45 125 Z" fill="#1E3A5F" opacity="0.6"/>

    <!-- Refraction & Clarity Highlights (Showing absolute transparency) -->
    <path d="M60 135 Q 120 120 180 135" stroke="#64B5F6" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M70 148 Q 120 135 170 148" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.3"/>

    <!-- Clean Stream Bed Pebbles (Visible clearly through the water) -->
    <circle cx="80" cy="160" r="8" fill="#5D4037" opacity="0.8"/>
    <circle cx="74" cy="156" r="4" fill="#8D6E63" opacity="0.9"/>

    <circle cx="150" cy="165" r="10" fill="#4E342E" opacity="0.8"/>
    <circle cx="156" cy="160" r="5" fill="#795548" opacity="0.9"/>

    <circle cx="115" cy="150" r="6" fill="#6D4C41" opacity="0.8"/>
    
    <ellipse cx="100" cy="170" rx="7" ry="4" fill="#5D4037" opacity="0.8"/>

    <!-- Swimming Little Fish (Crystal clear visibility matching the context) -->
    <!-- Fish 1 -->
    <g transform="translate(100, 138) scale(0.8)">
      <path d="M0 10 C 15 0, 25 5, 30 10 C 25 15, 15 20, 0 10 Z" fill="#FFB74D"/>
      <polygon points="0,5 -8,2 -5,10 -8,18 0,15" fill="#FFA726"/>
      <circle cx="22" cy="8" r="1.5" fill="#1A1D24"/>
    </g>

    <!-- Fish 2 -->
    <g transform="translate(145, 148) scale(0.6) rotate(-10)">
      <path d="M0 10 C 15 0, 25 5, 30 10 C 25 15, 15 20, 0 10 Z" fill="#FF7043"/>
      <polygon points="0,5 -8,2 -5,10 -8,18 0,15" fill="#F4511E"/>
      <circle cx="22" cy="8" r="1.5" fill="#1A1D24"/>
    </g>

    <!-- Water Surface Ripple / Sparkle Accent (Focus on purity/clarity) -->
    <path d="M95 118 Q 100 115 105 118 Q 110 121 115 118" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M135 125 Q 138 122 141 125 Q 144 128 147 125" stroke="#FFFFFF" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Tiny star/sparkle for absolute pristine clarity -->
    <path d="M120 95 L 122 102 L 129 104 L 122 106 L 120 113 L 118 106 L 111 104 L 118 102 Z" fill="#FFE082" opacity="0.85"/>
    <path d="M75 108 L 76 112 L 80 113 L 76 114 L 75 118 L 74 114 L 70 113 L 74 112 Z" fill="#FFE082" opacity="0.6"/>
  </g>
</svg>