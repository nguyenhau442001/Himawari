<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Wall surrounding the window -->
  <path d="M 36,36 L 204,36 L 204,204 L 36,204 Z" fill="#2A2F3D" rx="4"/>

  <!-- Outer Window Frame (Deep inset shadow/depth) -->
  <rect x="52" y="52" width="136" height="136" rx="8" fill="#15181F"/>

  <!-- Window Sill/Base -->
  <rect x="46" y="184" width="148" height="10" rx="3" fill="#3E4556"/>

  <!-- Glass Panes (Warm cozy indoor light glowing through) -->
  <g>
    <!-- Top Left Pane -->
    <rect x="62" y="62" width="55" height="55" rx="3" fill="#FFB74D" opacity="0.85"/>
    <!-- Top Right Pane -->
    <rect x="123" y="62" width="55" height="55" rx="3" fill="#FFB74D" opacity="0.85"/>
    <!-- Bottom Left Pane -->
    <rect x="62" y="123" width="55" height="55" rx="3" fill="#FFA726" opacity="0.85"/>
    <!-- Bottom Right Pane -->
    <rect x="123" y="123" width="55" height="55" rx="3" fill="#FFA726" opacity="0.85"/>
  </g>

  <!-- Window Pane Inner Highlights (Simulating light gradient reflection) -->
  <path d="M 64,64 L 115,64 L 95,115 L 64,115 Z" fill="#FFFFFF" opacity="0.12"/>
  <path d="M 125,64 L 175,64 L 175,115 L 155,115 Z" fill="#FFFFFF" opacity="0.12"/>

  <!-- Window Frame Structure (Mullions & Outer Trim) -->
  <!-- Outer Frame -->
  <rect x="58" y="58" width="124" height="124" fill="none" stroke="#4E566D" stroke-width="6" rx="4"/>
  
  <!-- Vertical Crossbar -->
  <rect x="117" y="58" width="6" height="124" fill="#3E4556"/>
  
  <!-- Horizontal Crossbar -->
  <rect x="58" y="117" width="124" height="6" fill="#3E4556"/>

  <!-- Action indicator: Sleek modern arrows indicating "Opening" outward -->
  <g stroke="#64B5F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <!-- Top right open motion arc -->
    <path d="M 188,72 C 205,80 215,95 218,112"/>
    <polyline points="210,105 219,114 210,121"/>
  </g>

  <!-- Subtle wind / fresh air breeze lines -->
  <g stroke="#81D4FA" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <path d="M 22,85 C 32,85 38,80 44,80"/>
    <path d="M 14,110 C 24,110 30,105 38,105"/>
    <path d="M 20,135 C 28,135 34,130 42,130"/>
  </g>

  <!-- Outdoor foliage hint in bottom corner of glass for contextual depth -->
  <path d="M 160,170 Q 170,155 185,160 Q 180,175 160,170 Z" fill="#66BB6A" opacity="0.9"/>
</svg>