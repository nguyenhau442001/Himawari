<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Floor/Ground -->
    <path d="M40 185 L200 185" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Person (Seeker / Asking for guidance) -->
    <g transform="translate(65, 115)">
      <!-- Body/Torso -->
      <path d="M-15 70 C-15 45, 15 45, 15 70 Z" fill="#3B82F6"/>
      <!-- Head -->
      <circle cx="0" cy="22" r="14" fill="#FFD166"/>
      <!-- Hair -->
      <path d="M-13 18 C-13 10, -5 8, 0 8 C8 8, 13 10, 13 18 C13 22, 10 22, 0 20 C-10 22, -13 22, -13 18 Z" fill="#2D3748"/>
      <!-- Body angle - leaning slightly forward respectfully -->
      <!-- Arms in a polite, slightly raised open gesture of asking -->
      <path d="M-10 45 L15 50" stroke="#FFD166" stroke-width="8" stroke-linecap="round"/>
      <path d="M15 50 L25 42" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Right Person (Advisor / Offering guidance / Pointing out) -->
    <g transform="translate(175, 110)">
      <!-- Body/Torso -->
      <path d="M-15 75 C-15 50, 15 50, 15 75 Z" fill="#10B981"/>
      <!-- Head -->
      <circle cx="0" cy="22" r="14" fill="#FFD166"/>
      <!-- Hair -->
      <path d="M-14 19 C-10 12, 5 12, 14 19 C10 10, -5 10, -14 19 Z" fill="#4A5568"/>
      <!-- Advisor pointing forward to help -->
      <path d="M-12 45 L-28 35" stroke="#FFD166" stroke-width="8" stroke-linecap="round"/>
      <path d="M-28 35 L-38 32" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Glowing idea/guidance symbol representing "指点" (direction/advice being given) -->
    <g transform="translate(120, 80)">
      <!-- Lightbulb / Guidance Sparkle -->
      <circle cx="0" cy="-5" r="12" fill="#F59E0B" opacity="0.2"/>
      <path d="M-5 5 L5 5 L3 -2 L-3 -2 Z" fill="#F59E0B"/>
      <rect x="-2" y="5" width="4" height="4" fill="#D97706"/>
      <!-- Sparkle rays -->
      <path d="M0 -22 L0 -26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-14 -12 L-17 -15" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M14 -12 L17 -15" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>