<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Desert Landscape Background Elements -->
  <path d="M 20 170 Q 70 140 120 160 T 220 150 L 220 210 L 20 210 Z" fill="#252A34"/>
  
  <!-- Rolling Desert Dunes (Background & Foreground) -->
  <path d="M 0 175 Q 60 145 130 170 T 240 160 L 240 220 L 0 220 Z" fill="#323846"/>
  <path d="M 0 190 Q 90 165 160 195 T 240 185 L 240 220 L 0 220 Z" fill="#3D4455"/>

  <!-- Sun / Sky Accent -->
  <circle cx="190" cy="65" r="22" fill="#FFA726" opacity="0.15"/>
  <circle cx="190" cy="65" r="16" fill="#FFA726" opacity="0.3"/>

  <!-- Motion Lines (Showing "Crossing Through" / "chuānguò") -->
  <g stroke="#FFA726" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="45" y1="115" x2="75" y2="115" />
    <line x1="30" y1="130" x2="65" y2="130" />
    <line x1="50" y1="145" x2="85" y2="145" />
  </g>

  <!-- Dynamic Human Character Walking/Crossing -->
  <g transform="translate(80, 95)">
    <!-- Backpack -->
    <rect x="-10" y="16" width="12" height="18" rx="3" fill="#E65100"/>
    
    <!-- Back Leg (Stepping forward) -->
    <path d="M 2 34 L 14 50 L 22 48" fill="none" stroke="#FFA726" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Body / Torso -->
    <path d="M -2 15 L 6 36 L -4 38 Z" fill="#FFB74D"/>
    
    <!-- Front Arm (Swinging) -->
    <path d="M 2 18 L 16 28" fill="none" stroke="#FFA726" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Back Arm -->
    <path d="M -2 18 L -12 28" fill="none" stroke="#E65100" stroke-width="5" stroke-linecap="round"/>

    <!-- Head & Hat -->
    <circle cx="2" cy="7" r="7" fill="#FFE0B2"/>
    <path d="M -7 4 Q 2 -1 11 4 Z" fill="#E65100"/> <!-- Sun hat brim -->
    
    <!-- Front Leg -->
    <path d="M 4 34 L -4 52 L -12 50" fill="none" stroke="#FFB74D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Dust/Sand Particle Accents -->
  <circle cx="120" cy="185" r="2" fill="#FFA726" opacity="0.7"/>
  <circle cx="135" cy="190" r="1.5" fill="#FFA726" opacity="0.5"/>
  <circle cx="100" cy="195" r="1" fill="#FFA726" opacity="0.6"/>
</svg>