<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual illustration: A sturdy physical shield forged with interlocking structural layers representing "Strengthening / 加强" in a concrete, physical object form -->
  <g transform="translate(0, 0)">
    <!-- Outer energy/reinforcement rim -->
    <path d="M120 40 L175 60 C175 110 155 155 120 185 C85 155 65 110 65 60 Z" fill="none" stroke="#FFA726" stroke-width="3" stroke-dasharray="6 4" opacity="0.5"/>

    <!-- Main Shield Base (Back layer) -->
    <path d="M120 48 L167 64 C167 106 149 144 120 170 C91 144 73 106 73 64 Z" fill="#2C3544"/>

    <!-- Inner Shield Plate (Reinforced Layer) -->
    <path d="M120 56 L159 69 C159 102 143 134 120 157 C97 134 81 102 81 69 Z" fill="#3A465B"/>

    <!-- Center Core Emblem (Reinforcement symbol / Upward structural bolt) -->
    <path d="M120 75 L138 100 H128 V135 H112 V100 H102 Z" fill="#FFA726"/>

    <!-- Rivets / Reinforcement Bolts -->
    <circle cx="120" cy="68" r="4" fill="#E0E6ED"/>
    <circle cx="100" cy="85" r="3.5" fill="#E0E6ED"/>
    <circle cx="140" cy="85" r="3.5" fill="#E0E6ED"/>
    <circle cx="95" cy="120" r="3.5" fill="#E0E6ED"/>
    <circle cx="145" cy="120" r="3.5" fill="#E0E6ED"/>
    <circle cx="120" cy="146" r="4" fill="#E0E6ED"/>

    <!-- Dynamic upward reinforcing arrow accents flanking the shield -->
    <path d="M52 110 L62 95 L72 110 Z" fill="#FFA726" opacity="0.8"/>
    <path d="M62 98 V130" stroke="#FFA726" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <path d="M168 110 L178 95 L188 110 Z" fill="#FFA726" opacity="0.8"/>
    <path d="M178 98 V130" stroke="#FFA726" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>