<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmospheric background details (soft twilight/evening sky for a town) -->
  <circle cx="180" cy="70" r="22" fill="#3A3F4B" opacity="0.4"/>
  
  <!-- Ground plane -->
  <path d="M 20 185 L 220 185" stroke="#3A3F4B" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Town / Settlement silhouette structures (Background layer) -->
  <!-- Small house left -->
  <path d="M 35 185 L 35 155 L 55 140 L 75 155 L 75 185 Z" fill="#262C3A"/>
  <rect x="50" y="165" width="10" height="20" fill="#1A1D24"/>

  <!-- Small house right background -->
  <path d="M 170 185 L 170 145 L 195 125 L 220 145 L 220 185 Z" fill="#262C3A"/>
  <rect x="185" y="160" width="12" height="25" fill="#1A1D24"/>

  <!-- Main Town Center Foreground Structures (Thriving small town / 城镇) -->
  <!-- Left Building (Shop/Residential) -->
  <path d="M 60 185 L 60 110 L 95 90 L 130 110 L 130 185 Z" fill="#2E3646"/>
  <!-- Roof accent -->
  <path d="M 55 110 L 95 85 L 135 110 L 130 115 L 95 92 L 60 115 Z" fill="#F39C12"/>
  
  <!-- Windows on left building -->
  <rect x="73" y="125" width="14" height="18" rx="2" fill="#4E5D6C"/>
  <rect x="103" y="125" width="14" height="18" rx="2" fill="#4E5D6C"/>
  <rect x="73" y="152" width="14" height="18" rx="2" fill="#4E5D6C"/>
  <rect x="103" y="152" width="14" height="18" rx="2" fill="#4E5D6C"/>
  
  <!-- Central Town Hall / Clock Tower (Focal Point) -->
  <rect x="115" y="95" width="45" height="90" fill="#353F50"/>
  <!-- Clock Tower Roof -->
  <path d="M 110 95 L 137.5 60 L 165 95 Z" fill="#F39C12"/>
  <!-- Clock Face -->
  <circle cx="137.5" cy="115" r="10" fill="#1A1D24"/>
  <circle cx="137.5" cy="115" r="8" fill="#F5F7FA"/>
  <line x1="137.5" y1="115" x2="137.5" y2="109" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="137.5" y1="115" x2="142" y2="115" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Door of Town Hall -->
  <path d="M 130 185 L 130 160 C 130 155 145 155 145 160 L 145 185 Z" fill="#1A1D24"/>
  
  <!-- Windows on Clock Tower -->
  <rect x="123" y="132" width="10" height="14" rx="1" fill="#4E5D6C"/>
  <rect x="143" y="132" width="10" height="14" rx="1" fill="#4E5D6C"/>

  <!-- Connecting road / Infrastructure representing connectivity -->
  <path d="M 10 190 Q 90 185 230 190" stroke="#F39C12" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 10 190 Q 90 185 230 190" stroke="#1A1D24" stroke-width="1" stroke-dasharray="6,6" fill="none"/>

  <!-- Natural elements (Greenery/Trees typical of a town/countryside mix) -->
  <!-- Tree left -->
  <circle cx="38" cy="165" r="14" fill="#2ECC71" opacity="0.8"/>
  <path d="M 38 170 L 38 185" stroke="#3A3F4B" stroke-width="3"/>
  
  <!-- Tree right -->
  <circle cx="160" cy="170" r="12" fill="#2ECC71" opacity="0.8"/>
  <path d="M 160 175 L 160 185" stroke="#3A3F4B" stroke-width="3"/>
</svg>