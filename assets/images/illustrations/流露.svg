<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Joy -->
    <radialGradient id="joy-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <!-- Hair Color -->
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Sweater Gradient -->
    <linearGradient id="sweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Interior Details -->
  <g id="room-interior">
    <!-- Wallpaper / Wall Texture -->
    <rect x="0" y="0" width="240" height="170" fill="#1e293b" />
    <path d="M0 170 L240 170" stroke="#334155" stroke-width="2" />
    <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
    <line x1="0" y1="173" x2="240" y2="173" stroke="#475569" stroke-width="1" />

    <!-- Window with Night Cityscape outside -->
    <g id="window" transform="translate(140, 20)">
      <rect x="0" y="0" width="75" height="110" rx="4" fill="#090d16" stroke="#475569" stroke-width="2" />
      <!-- Window Panes & City Lights -->
      <rect x="8" y="10" width="26" height="40" fill="#1e293b" rx="2" />
      <rect x="41" y="10" width="26" height="40" fill="#1e293b" rx="2" />
      <rect x="8" y="58" width="26" height="40" fill="#1e293b" rx="2" />
      <rect x="41" y="58" width="26" height="40" fill="#1e293b" rx="2" />
      <!-- Tiny abstract city lights -->
      <circle cx="15" cy="25" r="1.5" fill="#fbbf24" />
      <circle cx="25" cy="35" r="1.5" fill="#38bdf8" />
      <circle cx="50" cy="20" r="1.5" fill="#f43f5e" />
      <circle cx="60" cy="75" r="1.5" fill="#fbbf24" />
      <circle cx="18" cy="80" r="1.5" fill="#38bdf8" />
      <!-- Window light beam streaming in -->
      <polygon points="0,0 75,0 100,150 -40,150" fill="url(#window-light)" opacity="0.6" />
    </g>

    <!-- Bookshelf & Props in Background -->
    <g id="shelf" transform="translate(20, 45)">
      <rect x="0" y="0" width="50" height="6" fill="#475569" rx="1" />
      <!-- Books -->
      <rect x="5" y="-20" width="8" height="20" fill="#38bdf8" rx="1" />
      <rect x="14" y="-25" width="10" height="25" fill="#f43f5e" rx="1" />
      <rect x="25" y="-18" width="7" height="18" fill="#fbbf24" rx="1" />
      <!-- Plant Pot -->
      <path d="M38 -12 L48 -12 L46 0 L40 0 Z" fill="#94a3b8" />
      <circle cx="43" cy="-14" r="7" fill="#10b981" />
      <circle cx="39" cy="-17" r="5" fill="#059669" />
      <circle cx="47" cy="-16" r="6" fill="#34d399" />
    </g>

    <!-- Warm Joy Glow radiating from character -->
    <circle cx="105" cy="115" r="90" fill="url(#joy-glow)" />

    <!-- Wooden Desk in Foreground -->
    <g id="desk">
      <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#0f172a" />
      <rect x="0" y="170" width="240" height="12" fill="#334155" rx="2" />
      <rect x="15" y="182" width="210" height="58" fill="#1e293b" />
      <!-- Desk Objects: Open Letter / Reading Material & Coffee Mug -->
      <g transform="translate(45, 185)">
        <!-- Opened Letter showing a happy message/news (abstract lines) -->
        <polygon points="0,5 35,0 35,30 0,35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <line x1="8" y1="10" x2="27" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="8" y1="16" x2="22" y2="14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="8" y1="22" x2="18" y2="20" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- Ceramic Coffee Mug with steam -->
      <g transform="translate(185, 178)">
        <path d="M0 5 C0 2 3 0 6 0 L16 0 C19 0 22 2 22 5 L20 22 C20 24 18 26 16 26 L6 26 C4 26 2 24 2 22 Z" fill="#38bdf8" />
        <path d="M22 8 C25 8 27 10 27 13 C27 16 25 18 22 18" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
        <!-- Steam -->
        <path d="M8 -3 C8 -6 12 -8 12 -11" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- MAIN CHARACTER: Young Woman experiencing radiant joy (流露 - bộc lộ niềm vui) -->
  <g id="character-woman" transform="translate(75, 48)">
    <!-- Torso / Sweater -->
    <path d="M15 95 C15 75 35 70 60 70 C85 70 105 75 105 95 L115 125 L5 125 Z" fill="url(#sweater)" />
    <!-- Collar -->
    <path d="M45 70 C45 78 75 78 75 70 C75 66 45 66 45 70 Z" fill="#fda4af" />
    <!-- Neck -->
    <path d="M48 55 L48 72 L72 72 L72 55 Z" fill="url(#skin)" />

    <!-- Head and Face Group -->
    <g id="head" transform="translate(35, -5)">
      <!-- Back Hair -->
      <path d="M5 20 C5 -5 55 -5 75 20 C85 35 80 65 75 60 C65 50 65 35 55 30 C35 25 20 40 15 55 C10 45 5 30 5 20 Z" fill="url(#hair)" />

      <!-- Face Base -->
      <rect x="12" y="10" width="56" height="62" rx="28" fill="url(#skin)" />

      <!-- Ears -->
      <circle cx="9" cy="42" r="5" fill="url(#skin)" />
      <circle cx="69" cy="42" r="5" fill="url(#skin)" />

      <!-- Bangs / Front Hair -->
      <path d="M14 15 C20 5 45 5 66 12 C60 25 50 20 40 22 C25 24 18 18 14 15 Z" fill="url(#hair)" />
      <path d="M60 14 C66 22 68 35 68 35 C68 35 63 22 55 18 Z" fill="url(#hair)" />

      <!-- Facial Expressions: Depicting "流露" (bộc lộ ra bên ngoài một cách tự nhiên) -> Radiant, genuine smile with sparkling eyes and flushed cheeks -->
      <!-- Rosy Cheeks (Highlighting emotional expression) -->
      <ellipse cx="23" cy="48" rx="7" ry="4" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="57" cy="48" rx="7" ry="4" fill="#f43f5e" opacity="0.35" />

      <!-- Expressive Closed-Happy / Sparkling Eyes (Curved upward joyful arcs with eyelashes) -->
      <path d="M22 38 C25 34 31 34 34 38" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      <path d="M46 38 C49 34 55 34 58 38" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      <!-- Eyelashes / Sparkle accents -->
      <path d="M33 35 L36 33" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <path d="M47 35 L44 33" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

      <!-- Eyebrows (Relaxed, lifted high in joy) -->
      <path d="M20 30 C24 26 30 26 34 29" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
      <path d="M46 29 C50 26 56 26 60 30" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

      <!-- Cute Nose -->
      <path d="M40 43 C40 47 38 47 38 45" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

      <!-- Wide Radiant Open Smile (Showing pure joy naturally flowing out) -->
      <path d="M28 52 C28 64 52 64 52 52 C52 52 49 53 40 53 C31 53 28 52 28 52 Z" fill="#9f1239" />
      <path d="M32 55 C36 59 44 59 48 55 C44 53 36 53 32 55 Z" fill="#fb7185" />
    </g>

    <!-- Arms and Hands Gesturing (Natural posture emphasizing expression) -->
    <!-- Left Arm & Hand resting near chin/chest -->
    <path d="M15 90 C15 85 25 80 35 95 C45 110 30 120 25 125" fill="none" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="23" cy="125" r="6" fill="url(#skin)" />

    <!-- Right Arm & Hand touching cheek or holding edge of desk -->
    <path d="M105 90 C105 85 95 80 85 95 C75 110 90 120 95 125" fill="none" stroke="#be123c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="97" cy="125" r="6" fill="url(#skin)" />
  </g>

  <!-- Foreground Atmospheric Particles (Sparkles / Joy Bubbles floating up) -->
  <g id="sparkles" fill="#fbbf24">
    <circle cx="45" cy="85" r="3" opacity="0.8" />
    <path d="M185,60 Q190,50 200,50 Q190,50 190,40 Q190,50 180,50 Q190,50 185,60 Z" opacity="0.9" />
    <path d="M55,35 Q58,28 65,28 Q58,28 58,21 Q58,28 51,28 Q58,28 55,35 Z" opacity="0.7" />
    <circle cx="160" cy="110" r="2" opacity="0.6" />
    <circle cx="80" cy="140" r="2.5" opacity="0.9" />
    <circle cx="130" cy="70" r="1.5" opacity="0.5" />
  </g>
</svg>