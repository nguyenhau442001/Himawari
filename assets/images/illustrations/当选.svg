<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Blackboard Gradient -->
    <linearGradient id="boardGrad" x1="20" y1="20" x2="220" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="spotlight" cx="120" cy="110" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI / Badge Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Spotlight -->
  <circle cx="120" cy="120" r="110" fill="url(#spotlight)"/>

  <!-- Classroom Interior Background -->
  <!-- Back Wall & Chalkboard -->
  <rect x="25" y="22" width="190" height="95" rx="8" fill="#334155" opacity="0.4"/>
  <rect x="28" y="25" width="184" height="89" rx="6" fill="url(#boardGrad)" stroke="#065f46" stroke-width="2"/>
  
  <!-- Abstract Chalk Drawings on Board (No text) -->
  <path d="M 45 55 Q 55 40 65 55 T 85 55" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="65" cy="75" r="12" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.5"/>
  <path d="M 180 40 L 195 65 L 165 65 Z" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
  <line x1="105" y1="45" x2="145" y2="45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="110" y1="58" x2="140" y2="58" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Classroom Windows / Details -->
  <rect x="195" y="130" width="25" height="45" rx="3" fill="#3b82f6" opacity="0.15"/>
  <rect x="20" y="130" width="25" height="45" rx="3" fill="#3b82f6" opacity="0.15"/>

  <!-- Foreground / Classmate Silhouettes (Context) -->
  <!-- Left Classmate clapping/smiling -->
  <circle cx="60" cy="180" r="14" fill="#64748b"/>
  <path d="M 40 215 C 40 195 50 190 60 190 C 70 190 80 195 80 215 Z" fill="#3b82f6"/>
  <!-- Right Classmate -->
  <circle cx="180" cy="185" r="13" fill="#64748b"/>
  <path d="M 160 220 C 160 200 170 195 180 195 C 190 195 200 200 200 220 Z" fill="#10b981"/>

  <!-- Teacher / Presenter framing right side -->
  <path d="M 210 220 L 210 160 C 210 150 220 145 230 145 L 245 145 L 245 220 Z" fill="#475569" opacity="0.8"/>

  <!-- MAIN SUBJECT: The Newly Elected Class President ("他") -->
  <!-- Center Floor/Desk Reference -->
  <ellipse cx="120" cy="215" rx="45" ry="12" fill="#0f172a" opacity="0.6"/>

  <!-- Character Torso & Suit/Uniform (Proud standing posture) -->
  <path d="M 95 210 L 95 150 C 95 135 105 125 120 125 C 135 125 145 135 145 150 L 145 210 Z" fill="#1e3a8a"/>
  <!-- White Shirt Collar & Red Tie (Class President Identifier) -->
  <polygon points="120,132 110,148 130,148" fill="#f8fafc"/>
  <polygon points="117,148 123,148 125,185 120,192 115,185" fill="#ef4444" filter="url(#softShadow)"/>

  <!-- Character Arms (One raising hand in gratitude/confidence, one holding badge/sash) -->
  <path d="M 98 145 C 80 155 75 140 70 125" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="68" cy="120" r="7" fill="#fbcfe8"/> <!-- Left Hand -->

  <path d="M 142 145 C 160 150 168 135 175 120" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="178" cy="116" r="7" fill="#fbcfe8"/> <!-- Right Hand -->

  <!-- Character Head & Face -->
  <circle cx="120" cy="102" r="22" fill="#fbcfe8" filter="url(#softShadow)"/>
  
  <!-- Stylish Hair (Dark, neat student cut) -->
  <path d="M 99 100 C 98 85 110 78 120 78 C 132 78 142 85 142 100 C 142 100 138 90 130 87 C 122 84 112 87 105 93 Z" fill="#0f172a"/>

  <!-- Facial Expression: Big confident smile, bright eyes -->
  <circle cx="112" cy="100" r="2.5" fill="#0f172a"/>
  <circle cx="128" cy="100" r="2.5" fill="#0f172a"/>
  <!-- Rosy Cheeks -->
  <circle cx="110" cy="106" r="3.5" fill="#fda4af" opacity="0.6"/>
  <circle cx="130" cy="106" r="3.5" fill="#fda4af" opacity="0.6"/>
  <!-- Smile -->
  <path d="M 114 108 Q 120 115 126 108" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>


  <!-- CONTEXT PROP: The "Class President" Honor Sash (红绶带) draped diagonally -->
  <path d="M 95 135 L 145 175 L 138 185 L 90 145 Z" fill="#fbbf24" filter="url(#softShadow)"/>
  <path d="M 95 135 L 145 175 L 138 185 L 90 145 Z" fill="url(#bgGrad)" opacity="0.1"/>
  <!-- Gold fringe/trim on sash -->
  <line x1="92" y1="140" x2="89" y2="145" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="141" y1="180" x2="138" y2="185" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- CONTEXT PROP: Floating Celebration Elements (Confetti / Victory Stars) -->
  <g fill="#f59e0b">
    <path d="M 75 65 L 78 72 L 85 75 L 78 78 L 75 85 L 72 78 L 65 75 L 72 72 Z" transform="scale(0.8) translate(20, 10)" filter="url(#softShadow)"/>
    <path d="M 75 65 L 78 72 L 85 75 L 78 78 L 75 85 L 72 78 L 65 75 L 72 72 Z" fill="#38bdf8" transform="scale(0.6) translate(190, 40)"/>
    <circle cx="165" cy="85" r="4" fill="#ec4899"/>
    <circle cx="75" cy="105" r="3" fill="#10b981"/>
    <circle cx="150" cy="65" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- Floating Honor Badge (Visual anchor for "当选" / Election & Success) -->
  <g transform="translate(120, 45)" filter="url(#softShadow)">
    <!-- Ribbon tails -->
    <path d="M -8 15 L -18 30 L -5 24 L 0 28 Z" fill="#ef4444"/>
    <path d="M 8 15 L 18 30 L 5 24 L 0 28 Z" fill="#ef4444"/>
    <!-- Gold circular medal base -->
    <circle cx="0" cy="5" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="0" cy="5" r="14" fill="#fbbf24"/>
    <!-- Star icon inside medal representing election/win -->
    <path d="M 0 -2 L 3 4 L 9 5 L 4 9 L 6 15 L 0 11 L -6 15 L -4 9 L -9 5 L -3 4 Z" fill="#b45309" transform="scale(0.7) translate(0, 1)"/>
  </g>

</svg>