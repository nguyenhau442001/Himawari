<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Rain effect (Causality: The Cause) -->
  <g stroke="#5DADE2" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="40" x2="40" y2="70"/>
    <line x1="60" y1="30" x2="60" y2="60"/>
    <line x1="80" y1="45" x2="80" y2="75"/>
    <line x1="100" y1="35" x2="100" y2="65"/>
  </g>

  <!-- Domino Effect (Causality: The Mechanism) -->
  <rect x="50" y="120" width="20" height="60" rx="2" fill="#F39C12"/>
  <rect x="90" y="135" width="20" height="60" rx="2" fill="#F39C12" transform="rotate(20 100 165)"/>
  <rect x="140" y="150" width="20" height="60" rx="2" fill="#F39C12" transform="rotate(45 150 180)"/>

  <!-- The Result (The outcome of staying inside) -->
  <path d="M180 180h40v30h-40z" fill="#34495E"/>
  <path d="M185 150h30v30h-30z" fill="#7F8C8D"/>
  <path d="M200 120l-25 30h50z" fill="#E74C3C"/>
  
  <!-- Connection Arrow -->
  <path d="M110 90 C 140 90 150 110 170 130" fill="none" stroke="#BDC3C7" stroke-width="4" stroke-dasharray="6 6"/>
  <path d="M170 130 l-5 10 l 15 -5 z" fill="#BDC3C7"/>
</svg>