<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative atmosphere representing open air/environment -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Thermometer Physical Object representing 气温 (Air Temperature Noun) -->
  <g transform="translate(0, 0)">
    <!-- Thermometer Outer Glow/Backdrop -->
    <rect x="108" y="45" width="24" height="135" rx="12" fill="#2A303C"/>
    
    <!-- Thermometer Stem (Glass tube) -->
    <rect x="114" y="52" width="12" height="115" rx="6" fill="#1E232D"/>

    <!-- Temperature Mercury/Fluid Level (High Temperature matching "今天的气温比昨天高") -->
    <!-- Bulb center (120, 160), radius 16. Stem goes from y=150 up to y=75 -->
    <path d="M 114 150 L 114 85 A 6 6 0 0 1 126 85 L 126 150 Z" fill="#FF5722"/>

    <!-- Thermometer Bulb (Bottom circle) -->
    <circle cx="120" cy="160" r="16" fill="#FF5722"/>
    <circle cx="120" cy="160" r="10" fill="#FF8A65"/>
    <circle cx="116" cy="156" r="3" fill="#FFCCBC" opacity="0.8"/>

    <!-- Measurement Ticks / Scale Marks -->
    <!-- Top mark -->
    <line x1="98" y1="70" x2="108" y2="70" stroke="#8C9EA0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Middle-high mark -->
    <line x1="102" y1="92" x2="108" y2="92" stroke="#8C9EA0" stroke-width="2" stroke-linecap="round"/>
    <!-- Middle mark -->
    <line x1="98" y1="114" x2="108" y2="114" stroke="#8C9EA0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Middle-low mark -->
    <line x1="102" y1="136" x2="108" y2="136" stroke="#8C9EA0" stroke-width="2" stroke-linecap="round"/>

    <!-- Thermometer Ring/Cap Top -->
    <path d="M 112 45 A 8 8 0 0 1 128 45 Z" fill="#FFB74D"/>
    <rect x="115" y="41" width="10" height="6" rx="2" fill="#FFA726"/>
  </g>

  <!-- Sun Element representing atmospheric weather / heat context -->
  <g transform="translate(0, 0)">
    <!-- Sun Ray 1 (Top Left) -->
    <line x1="65" y1="65" x2="52" y2="52" stroke="#FFB74D" stroke-width="3" stroke-linecap="round"/>
    <!-- Sun Ray 2 (Top Right) -->
    <line x1="175" y1="65" x2="188" y2="52" stroke="#FFB74D" stroke-width="3" stroke-linecap="round"/>
    <!-- Sun Core -->
    <circle cx="180" cy="80" r="14" fill="#FFA726"/>
    <circle cx="180" cy="80" r="18" fill="#FFA726" opacity="0.2"/>
  </g>

  <!-- Upward Trend Indicator (Visualizing "高" - higher than yesterday) -->
  <g transform="translate(18, 5)">
    <!-- Arrow Icon backing -->
    <circle cx="55" cy="95" r="18" fill="#FF5722" opacity="0.15"/>
    <!-- Upward arrow -->
    <path d="M 55 107 L 55 83 M 47 91 L 55 83 L 63 91" stroke="#FF5722" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>