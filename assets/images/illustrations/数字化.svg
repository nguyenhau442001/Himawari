<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing digital network -->
  <circle cx="120" cy="120" r="85" fill="#222834" opacity="0.6"/>
  <path d="M 60 120 L 180 120 M 120 60 L 120 180" stroke="#2A3241" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Physical Object: Traditional Library Book transforming into Digital Data (数字化) -->
  <!-- Book Base / Cover -->
  <path d="M 70 145 C 70 140, 90 135, 120 135 C 150 135, 170 140, 170 145 L 170 175 C 170 180, 150 185, 120 185 C 90 185, 70 180, 70 175 Z" fill="#2E384D"/>
  
  <!-- Book Pages (Physical) -->
  <path d="M 75 142 C 75 138, 93 134, 120 134 C 147 134, 165 138, 165 142 L 165 168 C 165 172, 147 176, 120 176 C 93 176, 75 172, 75 168 Z" fill="#E2E8F0"/>
  <path d="M 120 134 L 120 176" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Book Spine -->
  <path d="M 65 140 L 70 145 L 70 175 L 65 170 Z" fill="#1E2530"/>

  <!-- Digital Transformation Stream (Rising Binary / Data Grid) -->
  <g fill="#F59E0B">
    <rect x="95" y="105" width="8" height="12" rx="2" opacity="0.4"/>
    <rect x="110" y="95" width="8" height="12" rx="2" opacity="0.7"/>
    <rect x="125" y="110" width="8" height="12" rx="2" opacity="0.5"/>
    <rect x="140" y="100" width="8" height="12" rx="2" opacity="0.9"/>
  </g>

  <!-- Floating Digital Screen / Tablet displaying the digitized content -->
  <rect x="80" y="45" width="80" height="60" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
  <rect x="88" y="53" width="64" height="44" rx="3" fill="#1E293B"/>

  <!-- UI elements inside digital screen (Abstract code/book lines) -->
  <rect x="96" y="61" width="30" height="4" rx="2" fill="#38BDF8"/>
  <rect x="96" y="71" width="48" height="3" rx="1.5" fill="#64748B"/>
  <rect x="96" y="79" width="40" height="3" rx="1.5" fill="#64748B"/>
  <rect x="96" y="87" width="24" height="3" rx="1.5" fill="#F59E0B"/>

  <!-- Connection Beams from Book to Screen -->
  <path d="M 105 134 L 105 105" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 135 134 L 135 105" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Glowing Accent Nodes -->
  <circle cx="105" cy="134" r="3" fill="#F59E0B"/>
  <circle cx="135" cy="134" r="3" fill="#F59E0B"/>
  <circle cx="105" cy="105" r="3" fill="#38BDF8"/>
  <circle cx="135" cy="105" r="3" fill="#38BDF8"/>
</svg>