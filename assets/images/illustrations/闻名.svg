<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow representing worldwide fame/radiance -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>
  <circle cx="120" cy="115" r="50" fill="#2E384D" opacity="0.5"/>

  <!-- Radiating light beams (Fame / Renown concept) -->
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="120" y1="35" x2="120" y2="25"/>
    <line x1="120" y1="195" x2="120" y2="205"/>
    <line x1="40" y1="115" x2="30" y2="115"/>
    <line x1="200" y1="115" x2="210" y2="115"/>
    <line x1="63" y1="58" x2="56" y2="51"/>
    <line x1="177" y1="58" x2="184" y2="51"/>
    <line x1="63" y1="172" x2="56" y2="179"/>
    <line x1="177" y1="172" x2="184" y2="179"/>
  </g>

  <!-- Golden Stars (Excellence / World-renowned status) -->
  <g fill="#F59E0B">
    <path d="M120,38 L122.5,45 L130,45 L124,49 L126.5,56 L120,52 L113.5,56 L116,49 L110,45 L117.5,45 Z" transform="scale(0.7) translate(51, 10)" opacity="0.9"/>
    <path d="M120,38 L122.5,45 L130,45 L124,49 L126.5,56 L120,52 L113.5,56 L116,49 L110,45 L117.5,45 Z" transform="scale(0.5) translate(145, 60)" opacity="0.7"/>
    <path d="M120,38 L122.5,45 L130,45 L124,49 L126.5,56 L120,52 L113.5,56 L116,49 L110,45 L117.5,45 Z" transform="scale(0.5) translate(65, 60)" opacity="0.7"/>
  </g>

  <!-- Iconic Physical Object representing "闻名" (World-famous Jingdezhen Ceramic Vase) -->
  <g id="ceramic-vase">
    <!-- Vase Shadow / Glow -->
    <ellipse cx="120" cy="182" r="30" fill="#0E1116" opacity="0.5"/>
    
    <!-- Vase Base -->
    <path d="M 104 175 L 136 175 L 133 167 L 107 167 Z" fill="#D97706"/>
    
    <!-- Vase Body (Exquisite Porcelain) -->
    <path d="M 107 167 C 95 155 88 135 88 115 C 88 88 102 75 107 72 L 133 72 C 138 75 152 88 152 115 C 152 135 145 155 133 167 Z" fill="#F3F4F6"/>
    
    <!-- Porcelain Neck & Rim -->
    <path d="M 107 72 L 109 58 L 131 58 L 133 72 Z" fill="#E5E7EB"/>
    <ellipse cx="120" cy="58" rx="11" ry="3.5" fill="#D1D5DB"/>
    <ellipse cx="120" cy="57" rx="9" ry="2.5" fill="#F3F4F6"/>

    <!-- Traditional Blue & White Porcelain Pattern (Cultural Renown) -->
    <path d="M 94 110 C 105 100 135 100 146 110" stroke="#1E40AF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 90 128 C 105 118 135 118 150 128" stroke="#1E40AF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="120" cy="90" r="4" fill="#1E40AF"/>
    <circle cx="103" cy="142" r="3" fill="#1E40AF"/>
    <circle cx="137" cy="142" r="3" fill="#1E40AF"/>
  </g>

  <!-- Accent Focus Glow Ring -->
  <circle cx="120" cy="115" r="54" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.6"/>

</svg>