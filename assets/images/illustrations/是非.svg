<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glowing background separator/axis -->
  <line x1="120" y1="40" x2="120" y2="200" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Left Side: "Shì" (Right / Correct) - Warm Gold/Orange Accent, Upward/Stable Scale -->
  <g transform="translate(60, 120)">
    <!-- Scale exaggeration: Larger, stable, glowing correct symbol -->
    <circle cx="0" cy="0" r="42" fill="#252D3D" opacity="0.6"/>
    <circle cx="0" cy="0" r="34" fill="#FFB800" opacity="0.15"/>
    <!-- Checkmark representing "Right / Correct" -->
    <path d="M-12 -2 L-3 8 L16 -10" fill="none" stroke="#FFB800" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Side: "Fēi" (Wrong / Incorrect) - Muted Cool Slate, Tilted/Contrasting Scale -->
  <g transform="translate(180, 120)">
    <!-- Scale exaggeration: Smaller, offset, crossed incorrect symbol -->
    <circle cx="0" cy="0" r="34" fill="#252D3D" opacity="0.6"/>
    <circle cx="0" cy="0" r="26" fill="#EF4444" opacity="0.1"/>
    <!-- Cross/X representing "Wrong / Incorrect" -->
    <path d="M-9 -9 L9 9 M9 -9 L-9 9" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Central Analytical / Distinguishing Element (Visualizing "分清" - Distinguishing between them) -->
  <g transform="translate(120, 120)">
    <!-- Glowing split cursor / lens representing discernment -->
    <circle cx="0" cy="0" r="16" fill="#1A1D24" stroke="#4F46E5" stroke-width="3"/>
    <path d="M-6 0 L6 0 M0 -6 L0 6" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>