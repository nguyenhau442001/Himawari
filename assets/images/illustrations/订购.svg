<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow representing e-commerce / transaction network -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>
  <path d="M70 155 L120 180 L170 155" stroke="#2F3644" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M70 135 L120 160 L170 135" stroke="#2F3644" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>

  <!-- MAIN OBJECT: Delivery Box / Order Package (representing the physical noun of an ordered good) -->
  <!-- Box Base/Sides -->
  <polygon points="120,70 175,95 120,120 65,95" fill="#3D4654"/>
  <polygon points="65,95 120,120 120,175 65,150" fill="#2D333D"/>
  <polygon points="175,95 120,120 120,175 175,150" fill="#343C48"/>

  <!-- Box Flaps Open (showing readiness / incoming order) -->
  <polygon points="65,95 95,65 120,80 85,100" fill="#475263"/>
  <polygon points="175,95 145,65 120,80 155,100" fill="#475263"/>

  <!-- FOCUS / ACCENT: Digital Ordering Interface / Clipboard overlay with golden checkmark -->
  <!-- Floating Clipboard representing the "Đặt hàng" (Order placement) -->
  <rect x="85" y="85" width="70" height="90" rx="6" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="102" y="78" width="36" height="14" rx="3" fill="#E2E8F0"/>
  
  <!-- Document lines -->
  <line x1="97" y1="110" x2="130" y2="110" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="97" y1="125" x2="143" y2="125" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="97" y1="140" x2="120" y2="140" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- Golden Accent: Success/Order Confirmed Checkmark Badge -->
  <circle cx="132" cy="152" r="18" fill="#F59E0B"/>
  <path d="M124 152 L129 157 L141 145" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative dynamic elements: Delivery / Connection dots -->
  <circle cx="55" cy="85" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="190" cy="120" r="5" fill="#60A5FA" opacity="0.8"/>
  <circle cx="80" cy="180" r="3" fill="#34D399" opacity="0.8"/>
  <circle cx="165" cy="65" r="3.5" fill="#F472B6" opacity="0.8"/>
</svg>