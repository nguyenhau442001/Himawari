<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Metaphor: Causality/Intentionality (The "Targeting" mechanism) -->
  <!-- The background lines represent the path of action -->
  <path d="M40 120 L200 120" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- The "Intent" - A focused trajectory -->
  <g>
    <!-- The source point (The Mind/Internal state) -->
    <circle cx="60" cy="120" r="12" fill="#F59E0B" fill-opacity="0.2"/>
    <circle cx="60" cy="120" r="6" fill="#F59E0B"/>
    
    <!-- The trajectory path showing deliberate aim -->
    <path d="M72 120 L160 120" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- The "Target" (The deliberate outcome) -->
    <g transform="translate(180, 120)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <circle cx="0" cy="0" r="3" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Visualizing the "Causality/Contrast" between accidental and intentional -->
  <!-- Accidental (faded/scattered) vs Intentional (focused/linear) -->
  <g opacity="0.4">
    <path d="M60 120 L80 90 L100 110 L120 80" stroke="#6B7280" stroke-width="2" fill="none" stroke-dasharray="2 2"/>
  </g>
  
  <!-- Focus highlight on the intentional path -->
  <path d="M140 100 L160 120 L140 140" stroke="#F59E0B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>