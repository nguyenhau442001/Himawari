<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Theater Comedy Mask (Traditional representation of Comedy) -->
  <g transform="translate(120, 120)">
    <!-- Main Mask Shape -->
    <path d="M-50,-40 C-50,-70 -20,-80 0,-80 C20,-80 50,-70 50,-40 C50,20 20,50 0,50 C-20,50 -50,20 -50,-40 Z" fill="#FFB84D"/>
    
    <!-- Eyes -->
    <path d="M-25,-30 C-25,-45 -15,-50 -10,-50 C-5,-50 5,-45 5,-30 C5,-15 -5,-10 -10,-10 C-15,-10 -25,-15 -25,-30 Z" fill="#1A1D24"/>
    <path d="M15,-30 C15,-45 25,-50 30,-50 C35,-50 45,-45 45,-30 C45,-15 35,-10 30,-10 C25,-10 15,-15 15,-30 Z" fill="#1A1D24"/>
    
    <!-- Wide Laughing Mouth -->
    <path d="M-30,10 C-30,30 -10,40 0,40 C10,40 30,30 30,10 C30,25 10,35 0,35 C-10,35 -30,25 -30,10 Z" fill="#1A1D24"/>
    
    <!-- Cheek blush/highlight -->
    <circle cx="-35" cy="0" r="5" fill="#E69138" opacity="0.6"/>
    <circle cx="35" cy="0" r="5" fill="#E69138" opacity="0.6"/>
  </g>
</svg>