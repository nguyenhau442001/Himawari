<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle city skyline representing the unfamiliar metropolis -->
  <path d="M40 180V120H55V180H40ZM70 180V95H90V180H70ZM150 180V110H170V180H150ZM185 180V85H215V180H185Z" fill="#252A34" opacity="0.6"/>
  <rect x="20" y="180" width="200" height="4" fill="#303642" rx="2"/>
  
  <!-- Ambient glow/fog representing vulnerability and the overwhelming environment -->
  <circle cx="120" cy="130" r="60" fill="#2E384D" opacity="0.3" filter="blur(10px)"/>

  <!-- Scale Exaggeration / Emotional Contrast: Tiny vulnerable figure set against vast empty dark space -->
  <!-- Giant abstract subtle outline representing the overwhelming presence/inevitability of the city/emotion -->
  <circle cx="120" cy="130" r="50" fill="none" stroke="#3A4454" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Young student figure (Small, centered, huddled for emotional resonance: "孤单忐忑" / inevitable vulnerability) -->
  <g transform="translate(120, 135)">
    <!-- Shadow -->
    <ellipse cx="0" cy="45" rx="14" ry="4" fill="#111318"/>
    
    <!-- Backpack (representing the newcomer / student context) -->
    <rect x="-10" y="10" width="8" height="18" rx="3" fill="#E58B35"/>
    
    <!-- Body / Huddled posture -->
    <path d="M-8 35C-8 25 -4 20 0 22C4 20 8 25 8 35V45H-8V35Z" fill="#3B82F6"/>
    
    <!-- Head -->
    <circle cx="0" cy="10" r="9" fill="#F1F5F9"/>
    <path d="M-9 7C-9 3 -5 1 0 1C5 1 9 3 9 7C9 9 7 8 5 8C2 8 -2 8 -5 8C-7 8 -9 9 -9 7Z" fill="#94A3B8"/>
    
    <!-- Subtle emotional posture lines / slight trembling or inward focus -->
    <path d="M-12 25C-15 28 -16 33 -14 38" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M12 25C15 28 16 33 14 38" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Visualizing "不免" (Inescapable/Unavoidable state - gentle enveloping emotional weather/currents) -->
  <g stroke="#E58B35" stroke-width="2" stroke-linecap="round" opacity="0.8" fill="none">
    <!-- Flowing curves indicating the natural, unavoidable wave of emotion settling in -->
    <path d="M60 100C80 90 90 110 110 100C130 90 140 110 160 100" />
    <path d="M75 115C90 107 105 123 120 115C135 107 150 123 165 115" opacity="0.5"/>
  </g>

  <!-- Accent focal point: Warm golden emotional glow highlighting the internal state -->
  <circle cx="120" cy="145" r="3" fill="#E58B35"/>
</svg>