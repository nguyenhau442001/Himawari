<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: Moon and stars -->
  <circle cx="185" cy="55" r="16" fill="#F39C12" opacity="0.2"/>
  <circle cx="55" cy="75" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="140" cy="40" r="1" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="85" cy="45" r="1.2" fill="#FFFFFF" opacity="0.5"/>

  <!-- Rolling Hills / Mountains -->
  <!-- Background mountain -->
  <path d="M 20 180 L 90 110 L 170 180 Z" fill="#2C3E50"/>
  <!-- Foreground mountain -->
  <path d="M 70 180 L 150 95 L 220 180 Z" fill="#34495E"/>
  <!-- Mountain snow cap accent -->
  <path d="M 150 95 L 132 120 L 168 120 Z" fill="#ECF0F1" opacity="0.8"/>

  <!-- Ground plane -->
  <rect x="0" y="180" width="240" height="60" fill="#16202A"/>
  <path d="M 0 180 Q 60 172 120 180 T 240 180" fill="none" stroke="#1E2B38" stroke-width="4"/>

  <!-- Central iconic nature element: Majestic Pine Tree -->
  <!-- Tree trunk -->
  <rect x="114" y="145" width="12" height="40" fill="#785942" rx="2"/>

  <!-- Tree foliage layers (Flat geometric style) -->
  <polygon points="120,80 85,125 155,125" fill="#27AE60"/>
  <polygon points="120,105 92,150 148,150" fill="#2ECC71"/>
  <polygon points="120,60 95,95 145,95" fill="#1E8449"/>

  <!-- Additional natural element: Glowing Eco Sprout (representing life/protection context of 大自然) -->
  <path d="M 75 185 C 75 165 95 165 95 185" fill="none" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  <path d="M 85 185 Q 85 173 78 170" fill="none" stroke="#2ECC71" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Leaf left -->
  <path d="M 85 178 C 77 175 75 180 85 185 Z" fill="#2ECC71"/>
  <!-- Leaf right -->
  <path d="M 85 176 C 93 173 95 178 85 183 Z" fill="#27AE60"/>

  <!-- Glowing accent orb (focus point) -->
  <circle cx="120" cy="60" r="3" fill="#F39C12"/>
</svg>