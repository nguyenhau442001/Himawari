<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Chalkboard Glow -->
    <linearGradient id="boardGlow" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Classroom Interior Background -->
  <!-- Back Wall -->
  <rect x="15" y="15" width="210" height="150" fill="url(#boardGlow)" rx="4"/>
  <!-- Blackboard frame -->
  <rect x="25" y="25" width="130" height="85" fill="#0f172a" rx="2" stroke="#475569" stroke-width="2"/>
  <rect x="30" y="30" width="120" height="75" fill="#1e293b" rx="1"/>

  <!-- Abstract Geo shapes on blackboard (math/learning icons instead of text) -->
  <circle cx="50" cy="55" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="75,45 85,65 65,65" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <line x1="100" y1="45" x2="125" y2="65" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="100" y1="65" x2="125" y2="45" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Window with light beam -->
  <rect x="170" y="25" width="45" height="85" fill="#334155" rx="2"/>
  <rect x="174" y="29" width="37" height="77" fill="#64748b" rx="1"/>
  <line x1="192" y1="29" x2="192" y2="106" stroke="#1e293b" stroke-width="2"/>
  <line x1="174" y1="67" x2="211" y2="67" stroke="#1e293b" stroke-width="2"/>
  <!-- Light beam effect -->
  <polygon points="174,29 211,29 235,180 150,180" fill="url(#sunbeam)"/>

  <!-- Classroom Floor -->
  <path d="M 0 165 L 240 165 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <path d="M 0 165 L 240 165" stroke="#334155" stroke-width="2"/>

  <!-- Teacher's Podium / Desk -->
  <rect x="20" y="145" width="65" height="40" fill="#334155" rx="3"/>
  <rect x="15" y="140" width="75" height="8" fill="#475569" rx="2"/>
  
  <!-- Teacher Character (Pointing proudly at the new computer) -->
  <!-- Body -->
  <path d="M 45 155 Q 55 130 65 155 Z" fill="#10b981"/>
  <!-- Head -->
  <circle cx="55" cy="115" r="12" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M 43 112 Q 55 100 67 112 Q 60 106 50 108 Z" fill="#334155"/>
  <!-- Arm pointing -->
  <path d="M 58 135 L 78 120" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 52 135 L 42 150" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

  <!-- STUDENT DESK & MODERN COMPUTER SETUP (The focal point of 配备 - equipped) -->
  <!-- Student Desk -->
  <rect x="120" y="150" width="95" height="45" fill="#475569" rx="3"/>
  <rect x="115" y="145" width="105" height="7" fill="#64748b" rx="2"/>
  <rect x="130" y="195" width="8" height="35" fill="#334155"/>
  <rect x="195" y="195" width="8" height="35" fill="#334155"/>

  <!-- Desktop Computer (The core 'equipped' item) -->
  <!-- Monitor Stand -->
  <rect x="160" y="125" width="15" height="20" fill="#cbd5e1"/>
  <ellipse cx="167" cy="146" rx="14" ry="3" fill="#94a3b8"/>
  <!-- Monitor Screen -->
  <rect x="135" y="90" width="64" height="38" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="138" y="93" width="58" height="32" rx="2" fill="url(#screenGrad)"/>
  
  <!-- UI elements on screen (abstract code/graphs) -->
  <rect x="144" y="99" width="20" height="4" rx="1" fill="#ffffff" opacity="0.8"/>
  <rect x="144" y="106" width="35" height="3" rx="1" fill="#bae6fd" opacity="0.7"/>
  <rect x="144" y="113" width="15" height="3" rx="1" fill="#bae6fd" opacity="0.7"/>
  <!-- Mini bar chart on screen -->
  <rect x="182" y="112" width="4" height="10" rx="1" fill="#f59e0b"/>
  <rect x="188" y="106" width="4" height="16" rx="1" fill="#10b981"/>

  <!-- Keyboard & Mouse -->
  <rect x="150" y="153" width="34" height="12" rx="2" fill="#e2e8f0"/>
  <circle cx="191" cy="159" r="3" fill="#e2e8f0"/>

  <!-- Student Character (Sitting happily, using the computer) -->
  <!-- Chair back -->
  <rect x="95" y="130" width="14" height="50" rx="4" fill="#334155"/>
  <!-- Head -->
  <circle cx="102" cy="122" r="11" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M 91 120 Q 102 110 113 120 Q 105 114 97 116 Z" fill="#f59e0b"/>
  <!-- Body/Torso -->
  <path d="M 90 140 Q 102 130 114 140 L 110 170 L 94 170 Z" fill="#3b82f6"/>
  <!-- Arm reaching for keyboard -->
  <path d="M 108 145 L 140 155" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>

  <!-- Ambient glowing particles representing modern smart classroom environment -->
  <circle cx="130" cy="70" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="80" cy="50" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="210" cy="130" r="1.5" fill="#10b981" opacity="0.6"/>
  <circle cx="100" cy="100" r="2" fill="#38bdf8" opacity="0.4"/>

  <!-- Plant pot for extra cozy real-world classroom context -->
  <path d="M 15 160 L 27 160 L 25 178 L 17 178 Z" fill="#f97316"/>
  <ellipse cx="21" cy="160" rx="6" ry="2" fill="#fdba74"/>
  <!-- Plant leaves -->
  <path d="M 21 158 Q 15 145 10 150 Q 15 158 21 158 Z" fill="#10b981"/>
  <path d="M 21 158 Q 28 140 32 148 Q 26 158 21 158 Z" fill="#34d399"/>
  <path d="M 21 158 Q 21 142 21 138 Q 21 142 21 158 Z" fill="#059669"/>

</svg>