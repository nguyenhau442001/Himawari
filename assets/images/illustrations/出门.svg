<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: Door frame and indoor/outdoor setting -->
  <path d="M70 40 L170 40 L170 210 L70 210 Z" fill="#242832" />
  <!-- Doorway opening revealing outdoor dark blue atmospheric night/rain scene -->
  <rect x="76" y="46" width="88" height="164" fill="#15181E" />

  <!-- Rain elements outside / around the doorway (contextual: "偏偏下起了雨") -->
  <line x1="85" y1="60" x2="77" y2="85" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="105" y1="50" x2="97" y2="75" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="155" y1="70" x2="147" y2="95" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <line x1="185" y1="90" x2="177" y2="115" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="205" y1="60" x2="197" y2="85" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="215" y1="120" x2="207" y2="145" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Open Door panel -->
  <path d="M76 46 L50 60 L50 200 L76 210 Z" fill="#2D333F" />
  <!-- Door handle -->
  <circle cx="63" cy="130" r="3" fill="#F5A623"/>

  <!-- Dynamic Human Character stepping outside (Action: 出门) -->
  <!-- Legs in motion (stepping out of the threshold) -->
  <!-- Back leg (inside) -->
  <path d="M110 160 L105 190 L115 195" fill="none" stroke="#E0E6ED" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front leg (stepping forward across threshold) -->
  <path d="M125 155 L140 185 L155 180" fill="none" stroke="#E0E6ED" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Torso & Coat/Clothing in accent color (Focus) -->
  <path d="M100 100 L135 105 L130 160 L105 160 Z" fill="#F5A623"/>
  
  <!-- Head & Hair -->
  <circle cx="118" cy="80" r="14" fill="#FAD0C4"/>
  <path d="M104 76 C104 68 128 68 132 78 C132 78 125 73 118 73 C111 73 104 76 104 76 Z" fill="#3E4A59"/>

  <!-- Arms with dynamic action (holding umbrella / about to open) -->
  <!-- Back arm -->
  <path d="M110 105 L90 120 L100 135" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front arm reaching out -->
  <path d="M125 110 L150 125 L165 115" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Umbrella being prepared / held -->
  <line x1="165" y1="115" x2="185" y2="95" stroke="#E0E6ED" stroke-width="3" stroke-linecap="round"/>
  <path d="M165 95 C175 80 195 80 205 95 Z" fill="#4A90E2"/>

  <!-- Motion lines indicating the action of moving forward/out -->
  <path d="M85 140 L70 140" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M90 155 L75 155" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Floor threshold line -->
  <rect x="70" y="208" width="100" height="4" fill="#3E4A59"/>
</svg>