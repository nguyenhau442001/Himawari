<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Turbulent Water Background Elements -->
  <path d="M0 160 Q 60 140, 120 160 T 240 160 L 240 240 L 0 240 Z" fill="#2C3E50" opacity="0.6"/>
  <path d="M0 180 Q 80 150, 160 180 T 240 180 L 240 240 L 0 240 Z" fill="#34495E" opacity="0.8"/>
  
  <!-- The Rescuer (Dynamic Pose) -->
  <g transform="translate(120, 120)">
    <!-- Body in motion -->
    <path d="M-20 -40 L 10 -10 L 0 40 L -30 20 Z" fill="#F39C12"/>
    <!-- Arm reaching forward -->
    <path d="M10 -10 L 50 -30 L 60 -10 L 20 10 Z" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="-15" cy="-50" r="12" fill="#F39C12"/>
    <!-- Leg kicking back -->
    <path d="M-10 30 L -40 60 L -20 70 L 5 40 Z" fill="#E67E22"/>
  </g>
  
  <!-- Contrast: The "Chaotic" Water vs "Focused" Action -->
  <path d="M20 200 L 40 180 M 60 210 L 80 190 M 180 200 L 200 180" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Focus Accent: Gold motion lines indicating forward momentum -->
  <path d="M80 80 L 120 60 M 90 100 L 130 80" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
</svg>