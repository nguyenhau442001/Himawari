<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Fabric / Shirt surface -->
  <path d="M70,90 Q120,70 170,90 L180,180 Q120,200 60,180 Z" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Fabric texture lines -->
  <path d="M90,110 L150,110 M85,135 L155,135" stroke="#3F4D63" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Motion lines for the action of sewing/attaching (钉) -->
  <path d="M120,50 Q130,80 120,115" fill="none" stroke="#F6AD55" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <path d="M116,45 L120,38 L124,45" fill="#F6AD55"/> <!-- Needle path indicator arrow -->

  <!-- Button being attached -->
  <g transform="translate(120, 115)">
    <circle cx="0" cy="0" r="14" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#A0AEC0" stroke-width="1"/>
    <!-- Button holes & thread -->
    <circle cx="-3" cy="-3" r="1.5" fill="#1A1D24"/>
    <circle cx="3" cy="-3" r="1.5" fill="#1A1D24"/>
    <circle cx="-3" cy="3" r="1.5" fill="#1A1D24"/>
    <circle cx="3" cy="3" r="1.5" fill="#1A1D24"/>
    <!-- Thread crisscross (钉/sewing action) -->
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ED8936" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="3" x2="3" y2="-3" stroke="#ED8936" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Hand holding a needle performing the action -->
  <g transform="translate(110, 45)">
    <!-- Needle -->
    <line x1="10" y1="-15" x2="10" y2="70" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="10" cy="-10" r="1" fill="#ED8936"/> <!-- Thread eye -->
    
    <!-- Thread trailing off -->
    <path d="M10,-15 Q5,-30 20,-40" fill="none" stroke="#ED8936" stroke-width="2" stroke-linecap="round"/>

    <!-- Fingers (Flat vector style, warm tone) -->
    <path d="M-10,25 C-10,15 0,10 15,15 C20,17 25,25 20,35 C15,45 -5,45 -10,35 Z" fill="#F6AD55"/>
    <path d="M5,12 C10,5 25,5 30,12 C35,18 30,28 20,25 C10,22 2,18 5,12 Z" fill="#ED8936"/>
  </g>

  <!-- Focus accent highlight -->
  <circle cx="120" cy="115" r="24" fill="none" stroke="#ED8936" stroke-width="2" opacity="0.4"/>
</svg>