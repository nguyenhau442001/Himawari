<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual Illustration for "查" (Dictionary / Investigation / Checking object: A modern sleek dictionary with a magnifying glass) -->
  <g transform="translate(0, 0)">
    <!-- Dictionary Book Base (Thick physical object representing the noun context: 词典) -->
    <!-- Book Shadow/Back Cover -->
    <path d="M 68 152 L 120 168 L 172 152 L 172 176 C 172 181.5 167.5 186 162 186 L 78 186 C 72.5 186 68 181.5 68 176 Z" fill="#2D3748"/>
    
    <!-- Book Pages Block -->
    <path d="M 70 78 L 120 94 L 170 78 L 170 152 L 120 168 L 70 152 Z" fill="#E2E8F0"/>
    
    <!-- Book Cover (Deep Blue/Slate with Gold Accent) -->
    <!-- Left Cover -->
    <path d="M 65 75 L 120 90 L 120 166 L 65 151 Z" fill="#2B6CB0"/>
    <!-- Right Cover -->
    <path d="M 120 90 L 175 75 L 175 151 L 120 166 Z" fill="#3182CE"/>
    
    <!-- Spine / Center Ridge -->
    <path d="M 116 91 L 120 92 L 120 166 L 116 165 Z" fill="#1A365D"/>

    <!-- Gold Bookmark Ribbon hanging down -->
    <path d="M 115 90 L 119 90 L 119 140 L 117 145 L 115 140 Z" fill="#ECC94B"/>

    <!-- Page lines detail -->
    <line x1="130" y1="102" x2="160" y2="94" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="112" x2="163" y2="104" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="122" x2="155" y2="114" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
    
    <line x1="80" y1="102" x2="110" y2="94" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="112" x2="105" y2="104" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="122" x2="110" y2="114" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>

    <!-- Magnifying Glass overlay (representing "checking" / "tra") -->
    <!-- Glass Lens Outer Rim -->
    <circle cx="120" cy="115" r="32" fill="#1A202C" opacity="0.3"/>
    <circle cx="120" cy="115" r="28" fill="#EBF8FF" opacity="0.85"/>
    <circle cx="120" cy="115" r="28" fill="none" stroke="#ECC94B" stroke-width="6"/>

    <!-- Lens Reflection Highlight -->
    <path d="M 104 105 A 18 18 0 0 1 125 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Magnifying Glass Handle -->
    <path d="M 140 135 L 168 163 C 172 167 172 173 168 177 C 164 181 158 181 154 177 L 126 149 Z" fill="#D69E2E"/>
    <path d="M 143 138 L 165 160" stroke="#B7791F" stroke-width="2" stroke-linecap="round"/>
