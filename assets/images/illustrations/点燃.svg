<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect for the flame -->
  <circle cx="120" cy="110" r="50" fill="#FF8C00" opacity="0.15" filter="blur(8px)"/>
  <circle cx="120" cy="100" r="30" fill="#FFD700" opacity="0.2" filter="blur(6px)"/>

  <!-- Candle/Torch body (Physical Object representing "点燃") -->
  <g transform="translate(0, 10)">
    <!-- Candle Base -->
    <rect x="105" y="115" width="30" height="75" rx="4" fill="#E2E8F0"/>
    <!-- Candle top rim (ellipse) -->
    <ellipse cx="120" cy="115" rx="15" ry="5" fill="#CBD5E1"/>
    
    <!-- Wick -->
    <rect x="118" y="103" width="4" height="14" fill="#475569"/>

    <!-- Dynamic Flame (Châm lửa / Thắp sáng) -->
    <!-- Outer orange flame -->
    <path d="M120 45 C120 45 142 75 142 97 C142 110 132 120 120 120 C108 120 98 110 98 97 C98 75 120 45 120 45 Z" fill="#FF7A00"/>
    
    <!-- Inner bright yellow flame -->
    <path d="M120 62 C120 62 133 84 133 99 C133 107 127 113 120 113 C113 113 107 107 107 99 C107 84 120 62 120 62 Z" fill="#FFD600"/>
    
    <!-- Core white-hot spark -->
    <path d="M120 80 C120 80 125 93 125 101 C125 105 123 108 120 108 C117 108 115 105 115 101 C115 93 120 80 120 80 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Radiating light rays / sparks representing "khơi dậy" -->
  <g stroke="#FFD600" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="85" y1="80" x2="73" y2="72" />
    <line x1="155" y1="80" x2="167" y2="72" />
    <line x1="80" y1="110" x2="64" y2="110" />
    <line x1="160" y1="110" x2="176" y2="110" />
    <line x1="92" y1="60" x2="82" y2="50" />
    <line x1="148" y1="60" x2="158" y2="50" />
  </g>

  <!-- Small floating sparks / energy particles -->
  <circle cx="95" cy="42" r="2" fill="#FFD600" opacity="0.9"/>
  <circle cx="148" cy="45" r="1.5" fill="#FF8C00" opacity="0.8"/>
  <circle cx="168" cy="90" r="2" fill="#FFD600" opacity="0.7"/>
  <circle cx="72" cy="95" r="1.5" fill="#FF8C00" opacity="0.9"/>
  <circle cx="102" cy="30" r="1" fill="#FFFFFF" opacity="0.8"/>

  <!-- Surface Reflection / Shadow Base -->
  <ellipse cx="120" cy="195" rx="45" ry="6" fill="#0F1115"/>
</svg>