<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="120" r="45" fill="#FFB703" opacity="0.05"/>

  <!-- Seashell (贝壳) - Main Noun Focus -->
  <g transform="translate(0, 5)">
    <!-- Main Shell Body (Fan shape with ridges) -->
    <path d="M 120 60 
             C 145 65, 175 90, 180 135 
             C 182 155, 170 175, 150 185 
             C 135 192, 105 192, 90 185 
             C 70 175, 58 155, 60 135 
             C 65 90, 95 65, 120 60 Z" 
          fill="#FB8500" />
          
    <!-- Highlight Surface for Modern Flat Depth -->
    <path d="M 120 65 
             C 140 70, 168 93, 172 133 
             C 174 150, 163 168, 147 177 
             C 133 184, 107 184, 93 177 
             C 77 168, 66 150, 68 133 
             C 72 93, 100 70, 120 65 Z" 
          fill="#FFB703" />

    <!-- Ridge lines radiating from bottom hinge -->
    <!-- Center ridge -->
    <line x1="120" y1="185" x2="120" y2="60" stroke="#FB8500" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Inner ridges -->
    <line x1="120" y1="185" x2="95" y2="72" stroke="#FB8500" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="185" x2="145" y2="72" stroke="#FB8500" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="120" y1="185" x2="72" y2="95" stroke="#FB8500" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="120" y1="185" x2="168" y2="95" stroke="#FB8500" stroke-width="2.5" stroke-linecap="round"/>
    
    <line x1="120" y1="185" x2="62" y2="125" stroke="#FB8500" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="185" x2="178" y2="125" stroke="#FB8500" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Hinge Detail -->
    <path d="M 112 178 Q 120 188 128 178 Q 120 183 112 178 Z" fill="#D47300"/>
    
    <!-- Glossy Accent Shape -->
    <path d="M 95 85 Q 120 75 145 85 Q 130 78 120 78 Q 110 78 95 85 Z" fill="#FFE5A3" opacity="0.6"/>
  </g>

  <!-- Contextual decorative beach elements (subtle sand grain dots at the base) -->
  <g fill="#8E9AAF" opacity="0.4">
    <circle cx="85" cy="198" r="2.5"/>
    <circle cx="100" cy="204" r="1.5"/>
    <circle cx="155" cy="200" r="2"/>
    <circle cx="140" cy="205" r="1"/>
    <circle cx="115" cy="206" r="2"/>
    <circle cx="128" cy="202" r="1.5"/>
  </g>
</svg>