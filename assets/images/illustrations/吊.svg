<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Light Beam Gradient -->
    <linearGradient id="light-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Lighting Effect -->
  <circle cx="120" cy="90" r="100" fill="url(#lamp-glow)" />

  <!-- Room Interior Background -->
  <!-- Ceiling -->
  <rect x="0" y="0" width="240" height="40" fill="#090d16" />
  <line x1="0" y1="40" x2="240" y2="40" stroke="#334155" stroke-width="2" />

  <!-- Wall Art (Cozy Interior context) -->
  <rect x="35" y="60" width="30" height="40" rx="2" fill="#334155" />
  <rect x="38" y="63" width="24" height="34" fill="#64748b" />
  <!-- Mini landscape inside picture frame -->
  <path d="M38 87 L50 72 L62 87 Z" fill="#10b981" opacity="0.6" />
  <circle cx="56" cy="70" r="3" fill="#fde047" />

  <!-- Bookshelf Background Prop -->
  <rect x="175" y="70" width="45" height="110" fill="#334155" rx="3" />
  <line x1="175" y1="105" x2="220" y2="105" stroke="#1e293b" stroke-width="3" />
  <line x1="175" y1="140" x2="220" y2="140" stroke="#1e293b" stroke-width="3" />
  <!-- Colorful books -->
  <rect x="180" y="85" width="8" height="20" fill="#ec4899" rx="1" />
  <rect x="190" y="82" width="10" height="23" fill="#38bdf8" rx="1" />
  <rect x="202" y="87" width="6" height="18" fill="#fbbf24" rx="1" />
  <rect x="182" y="118" width="12" height="22" fill="#10b981" rx="1" />
  <rect x="196" y="120" width="9" height="20" fill="#f43f5e" rx="1" />

  <!-- Light Beam projection -->
  <polygon points="105,40 135,40 170,220 70,220" fill="url(#light-beam)" />

  <!-- THE TARGET: HSK Vocabulary "吊" (Hanging Lamp) - Centered & Prominent -->
  <!-- Ceiling Mount -->
  <rect x="114" y="0" width="12" height="10" fill="#475569" rx="2" />
  <!-- Suspension Cord/Wire -->
  <line x1="120" y1="10" x2="120" y2="45" stroke="#94a3b8" stroke-width="2.5" />
  <!-- Lamp Shade -->
  <path d="M95,45 L145,45 L155,65 L85,65 Z" fill="#fbbf24" />
  <!-- Lamp Shade Inner Rim/Shadow -->
  <ellipse cx="120" cy="65" rx="35" ry="6" fill="#f59e0b" />
  <!-- Glowing Bulb -->
  <circle cx="120" cy="62" r="8" fill="#ffffff" />
  <circle cx="120" cy="62" r="12" fill="#fef08a" opacity="0.6" />

  <!-- Furniture: Sofa / Living Room setting -->
  <!-- Sofa Backrest -->
  <rect x="30" y="145" width="110" height="50" rx="10" fill="#475569" />
  <!-- Sofa Cushions -->
  <rect x="35" y="155" width="50" height="45" rx="8" fill="#64748b" />
  <rect x="88" y="155" width="50" height="45" rx="8" fill="#64748b" />
  <!-- Sofa Armrest Left -->
  <rect x="20" y="140" width="18" height="65" rx="6" fill="#334155" />
  <!-- Sofa Base -->
  <rect x="22" y="195" width="126" height="10" rx="3" fill="#1e293b" />
  <!-- Sofa Legs -->
  <rect x="30" y="205" width="6" height="15" fill="#0f172a" />
  <rect x="134" y="205" width="6" height="15" fill="#0f172a" />

  <!-- Foreground Character Relaxing on Sofa -->
  <!-- Character Head -->
  <circle cx="75" cy="130" r="14" fill="#fbcfe8" />
  <!-- Hair -->
  <path d="M62,130 C62,120 70,115 80,118 C88,121 88,130 88,130 Z" fill="#334155" />
  <!-- Character Body / Cozy Sweater -->
  <path d="M55,160 C55,145 65,140 75,140 C85,140 95,145 95,160 Z" fill="#38bdf8" />
  <!-- Arm reading a book -->
  <path d="M68,148 L80,155 L70,162" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Open Book in lap -->
  <polygon points="65,158 80,154 85,164 70,168" fill="#f8fafc" />
  <line x1="75" y1="156" x2="77" y2="166" stroke="#cbd5e1" stroke-width="1" />

  <!-- Floor Surface -->
  <rect x="0" y="210" width="240" height="30" fill="#090d16" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

  <!-- Coffeetable Prop -->
  <rect x="120" y="185" width="45" height="25" rx="3" fill="#cbd5e1" />
  <rect x="123" y="210" width="4" height="15" fill="#475569" />
  <rect x="158" y="210" width="4" height="15" fill="#475569" />
  <!-- Teacup on Table -->
  <ellipse cx="135" cy="183" rx="5" ry="2" fill="#f43f5e" />
  <rect x="133" y="180" width="4" height="4" fill="#f43f5e" rx="1" />

  <!-- Atmospheric ambient particles (warm light dust) -->
  <circle cx="100" cy="100" r="1.5" fill="#fde047" opacity="0.6" />
  <circle cx="140" cy="120" r="2" fill="#fde047" opacity="0.4" />
  <circle cx="110" cy="150" r="1" fill="#fde047" opacity="0.8" />
  <circle cx="155" cy="90" r="1.5" fill="#fde047" opacity="0.5" />
</svg>