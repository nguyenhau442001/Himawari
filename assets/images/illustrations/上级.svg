<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background hierarchy lines -->
  <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M40 130 L200 130" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M40 80 L200 80" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Upward directional arrow accent (representing "上" - upper/superior) -->
  <path d="M120 45 L105 60 L135 60 Z" fill="#F59E0B" />
  <rect x="117" y="58" width="6" height="15" fill="#F59E0B" />

  <!-- Lower level figure (Subordinate / Employee) -->
  <g transform="translate(0, 15)">
    <!-- Body / Suit -->
    <path d="M85 145 C85 135 95 125 105 125 L115 125 C125 125 135 135 135 145 Z" fill="#3B82F6"/>
    <path d="M100 125 L105 138 L110 125 Z" fill="#FFFFFF"/>
    <!-- Head -->
    <circle cx="110" cy="105" r="12" fill="#E0E6ED"/>
    <!-- Hair -->
    <path d="M98 102 C98 96 103 93 110 93 C117 93 122 96 122 102 Z" fill="#64748B"/>
  </g>

  <!-- Upper level figure (Superior / Boss - "上级") -->
  <g transform="translate(0, -15)">
    <!-- Elevated Platform / Desk element -->
    <rect x="70" y="115" width="100" height="8" rx="4" fill="#334155" />
    <path d="M90 123 L95 145 L145 145 L150 123 Z" fill="#1E293B" />
    
    <!-- Body / Suit with Gold/Orange Accent (Focus) -->
    <path d="M110 105 C110 95 120 85 130 85 L140 85 C150 85 160 95 160 105 Z" fill="#F59E0B"/>
    <path d="M130 85 L135 98 L140 85 Z" fill="#FFFFFF"/>
    <!-- Head -->
    <circle cx="135" cy="65" r="14" fill="#E0E6ED"/>
    <!-- Hair -->
    <path d="M121 61 C121 54 127 51 135 51 C143 51 149 54 149 61 Z" fill="#1E293B"/>
    
    <!-- Superior Badge / Star Icon -->
    <polygon points="135,33 138,40 145,40 140,44 142,51 135,47 128,51 130,44 125,40 132,40" fill="#FBBF24"/>
  </g>

  <!-- Connection / Reporting upward line with pulse/dots -->
  <line x1="110" y1="125" x2="130" y2="95" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Focus ring around the superior -->
  <circle cx="135" cy="50" r="32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 6"/>
</svg>