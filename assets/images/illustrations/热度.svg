<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filter for heat emission -->
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Flame gradient -->
    <linearGradient id="flame-grad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFEB3B"/>
    </linearGradient>

    <!-- Phone screen gradient -->
    <linearGradient id="phone-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2F3D"/>
      <stop offset="100%" stop-color="#222632"/>
    </linearGradient>
  </defs>

  <!-- Central Physical Object: A sleek modern smartphone displaying social network activity bursting into flames of "redu" (heat/popularity) -->
  
  <!-- Outer radiating heat waves / discussion intensity -->
  <g opacity="0.25" stroke="#FF9800" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 65 95 C 50 110 50 140 65 155" />
    <path d="M 175 95 C 190 110 190 140 175 155" />
    <path d="M 75 75 C 55 95 55 135 75 155" opacity="0.5"/>
    <path d="M 165 75 C 185 95 185 135 165 155" opacity="0.5"/>
  </g>

  <!-- Phone Body (Physical Object representing social media platform) -->
  <rect x="80" y="60" width="80" height="135" rx="12" fill="#363C4E" stroke="#4F566D" stroke-width="2"/>
  <rect x="86" y="68" width="68" height="119" rx="8" fill="url(#phone-screen)"/>

  <!-- Speaker notch / camera -->
  <rect x="108" y="74" width="24" height="4" rx="2" fill="#4F566D"/>

  <!-- Social network feed posts on screen (abstracted lines and chat bubbles) -->
  <g transform="translate(94, 88)">
    <!-- Post 1 -->
    <rect x="0" y="0" width="52" height="26" rx="4" fill="#3A4154"/>
    <circle cx="10" cy="13" r="4" fill="#64748B"/>
    <rect x="18" y="10" width="24" height="3" rx="1.5" fill="#64748B"/>
    <rect x="18" y="16" width="16" height="2" rx="1" fill="#4F566D"/>

    <!-- Post 2 -->
    <rect x="0" y="32" width="52" height="26" rx="4" fill="#3A4154"/>
    <circle cx="10" cy="45" r="4" fill="#64748B"/>
    <rect x="18" y="42" width="24" height="3" rx="1.5" fill="#64748B"/>
    <rect x="18" y="48" width="16" height="2" rx="1" fill="#4F566D"/>

    <!-- Post 3 (Highlighted rising post) -->
    <rect x="0" y="64" width="52" height="36" rx="4" fill="#FF9800" fill-opacity="0.15" stroke="#FF9800" stroke-width="1"/>
    <circle cx="10" cy="77" r="4" fill="#FF9800"/>
    <rect x="18" y="74" width="26" height="3" rx="1.5" fill="#FFD54F"/>
    <rect x="18" y="80" width="20" height="2" rx="1" fill="#FF9800" fill-opacity="0.6"/>
    <rect x="18" y="86" width="12" height="2" rx="1" fill="#FF9800" fill-opacity="0.6"/>
  </g>

  <!-- Home indicator bar -->
  <rect x="105" y="179" width="30" height="3" rx="1.5" fill="#64748B"/>

  <!-- Dramatic Flames Erupting from the top of the phone (Visualizing "热度" - high discussion heat/popularity) -->
  <g filter="url(#flame-glow)">
    <!-- Outer flame wisps -->
    <path d="M 120 65 C 105 45 100 30 110 15 C 120 30 125 40 120 65 Z" fill="#FF5722" opacity="0.9"/>
    <path d="M 135 65 C 145 45 155 30 145 10 C 130 30 125 45 135 65 Z" fill="#FF5722" opacity="0.9"/>
    
    <!-- Mid flame layer -->
    <path d="M 115 68 C 100 48 105 25 120 5 C 135 25 140 48 125 68 Z" fill="url(#flame-grad)"/>

    <!-- Core bright flame -->
    <path d="M 120 62 C 112 48 115 35 120 20 C 125 35 128 48 120 62 Z" fill="#FFEB3B"/>
  </g>

  <!-- Floating hot sparks / interaction embers -->
  <g fill="#FFD54F">
    <circle cx="95" cy="40" r="3" opacity="0.8"/>
    <circle cx="150" cy="35" r="2" opacity="0.9"/>
    <circle cx="105" cy="20" r="1.5" opacity="0.7"/>
    <circle cx="140" cy="22" r="2.5" opacity="0.8"/>
    <circle cx="120" cy="8" r="2" opacity="0.9"/>
  </g>
</svg>