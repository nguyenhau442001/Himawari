<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Decorative Ambient Glow -->
  <circle cx="120" cy="120" r="70" fill="#2D323F" opacity="0.4"/>

  <!-- Conceptual Object: Book Chapter / Seal (章) combined graphic -->
  <!-- We visualize an open book with a prominent ribbon bookmark/chapter marker and a glowing seal stamp intersecting, representing both "chapter" and "stamp/seal" -->
  
  <g transform="translate(0, 5)">
    <!-- Open Book Base -->
    <!-- Left Page -->
    <path d="M 60,110 C 60,105 85,95 120,95 L 120,175 C 85,175 60,165 60,160 Z" fill="#2E3548"/>
    <path d="M 68,118 C 68,115 88,107 116,107 L 116,165 C 88,165 68,157 68,154 Z" fill="#3B4256"/>
    
    <!-- Right Page -->
    <path d="M 180,110 C 180,105 155,95 120,95 L 120,175 C 155,175 180,165 180,160 Z" fill="#2E3548"/>
    <path d="M 172,118 C 172,115 152,107 124,107 L 124,165 C 152,165 172,157 172,154 Z" fill="#3B4256"/>

    <!-- Book Spine / Center Shadow -->
    <line x1="120" y1="95" x2="120" y2="175" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

    <!-- Text Lines on Pages (representing chapters/reading) -->
    <!-- Left Page Lines -->
    <line x1="78" y1="125" x2="105" y2="121" stroke="#5A637C" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="137" x2="108" y2="133" stroke="#5A637C" stroke-width="3" stroke-linecap="round"/>
    <line x1="77" y1="149" x2="98" y2="146" stroke="#5A637C" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Page Lines -->
    <line x1="135" y1="121" x2="162" y2="125" stroke="#5A637C" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="133" x2="164" y2="137" stroke="#5A637C" stroke-width="3" stroke-linecap="round"/>
    <line x1="142" y1="146" x2="163" y2="149" stroke="#5A637C" stroke-width="3" stroke-linecap="round"/>

    <!-- Chapter Ribbon Bookmark (Hanging down from top center) -->
    <path d="M 114,95 L 114,145 L 120,152 L 126,145 L 126,95 Z" fill="#FF8C42"/>
    <polygon points="114,145 120,152 126,145" fill="#E0702B"/>

    <!-- Seal / Stamp (Con dấu - the other core meaning of 章) stamping onto the page -->
    <g transform="translate(120, 60)">
      <!-- Seal Handle -->
      <path d="M -10,-12 L 10,-12 C 12,-12 13,-10 12,-8 L 8,0 L -8,0 L -12,-8 C -13,-10 -12,-12 -10,-12 Z" fill="#FFB703"/>
      <!-- Seal Handle Top Knob -->
      <rect x="-6" y="-18" width="12" height="6" rx="3" fill="#FB8500"/>
      <!-- Seal Base (Square) -->
      <rect x="-16" y="0" width="32" height="12" rx="2" fill="#E65F2B"/>
      <rect x="-14" y="12" width="28" height="6" rx="1" fill="#FF8C42"/>
      <!-- Seal Imprint Glow / Effect -->
      <rect x="-22" y="24" width="44" height="24" rx="4" fill="#FFB703" opacity="0.2"/>
    </g>

    <!-- Prominent Red/Gold Official Seal Mark on the Page (Showing the duality of 章) -->
    <g transform="translate(120, 138) scale(0.8)">
      <rect x="-14" y="-14" width="28" height="28" rx="4" fill="none" stroke="#FF5722" stroke-width="3"/>
      <circle cx="0" cy="0" r="6" fill="#FF5722"/>
    </g>

    <!-- Dynamic Sparkles / Focus Accents -->
    <circle cx="70" cy="85" r="3" fill="#FFB703"/>
    <circle cx="175" cy="95" r="2" fill="#FF8C42"/>
    <circle cx="155" cy="55" r="3.5" fill="#FFB703"/>
    <path d="M 50,130 L 53,133 L 50,136 L 47,133 Z" fill="#FF8C42"/>
    <path d="M 190,140 L 192,142 L 190,144 L 188,142 Z" fill="#FFB703"/>
  </g>
</svg>