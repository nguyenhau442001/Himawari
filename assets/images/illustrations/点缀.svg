<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light for Flowers -->
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Garden Foliage Gradient -->
    <linearGradient id="bushGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soil/Ground Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadows for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Glow in background -->
  <circle cx="120" cy="140" r="90" fill="url(#flowerGlow)" />

  <!-- Garden Structure / Stone Archway Background Detail -->
  <path d="M60 170 L60 100 C60 65 90 45 120 45 C150 45 180 65 180 100 L180 170" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M50 170 L190 170" stroke="#334155" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Background Greenery / Bushes -->
  <circle cx="85" cy="155" r="35" fill="url(#bushGrad)" opacity="0.8" />
  <circle cx="155" cy="155" r="38" fill="url(#bushGrad)" opacity="0.8" />
  <circle cx="120" cy="160" r="45" fill="url(#bushGrad)" />

  <!-- Foreground Garden Bed / Soil -->
  <path d="M30 180 Q120 150 210 180 L220 210 Q120 220 20 210 Z" fill="url(#soilGrad)" filter="url(#shadow)" />
  <path d="M30 180 Q120 150 210 180" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- Character / Gardener setting flowers (Upper Body leaning in) -->
  <g id="gardener" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M95 195 C95 170 105 150 120 150 C135 150 145 170 145 195 Z" fill="#38bdf8" />
    
    <!-- Apron -->
    <path d="M105 160 L135 160 L138 200 L102 200 Z" fill="#f8fafc" opacity="0.9" />
    <path d="M115 160 L115 185 L125 185 L125 160" fill="#e2e8f0" />

    <!-- Head & Hair -->
    <circle cx="120" cy="130" r="16" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M104 130 C104 112 136 112 136 130 C136 138 130 135 130 135 C130 135 125 118 120 118 C115 118 110 135 110 135 C110 135 104 138 104 130 Z" fill="#475569" /> <!-- Hair -->

    <!-- Arms reaching out to plant -->
    <path d="M98 165 Q80 175 75 165" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="73" cy="163" r="5" fill="#fbcfe8" /> <!-- Hand -->

    <path d="M142 165 Q155 175 160 168" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="162" cy="167" r="5" fill="#fbcfe8" /> <!-- Hand holding small flower -->
  </g>

  <!-- Decorative Flowers "Tô điểm" (Embellishing the garden) -->
  <!-- Flower Group Left -->
  <g class="flower" filter="url(#shadow)">
    <path d="M75 180 L75 160" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <circle cx="75" cy="157" r="8" fill="#f43f5e" />
    <circle cx="75" cy="157" r="3" fill="#fbbf24" />
  </g>
  <g class="flower" filter="url(#shadow)">
    <path d="M60 185 L62 170" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="62" cy="167" r="6" fill="#ec4899" />
    <circle cx="62" cy="167" r="2" fill="#fbbf24" />
  </g>

  <!-- Flower Group Center (Being placed/highlighted) -->
  <g class="flower-main" filter="url(#shadow)">
    <path d="M120 175 L120 155" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <circle cx="120" cy="150" r="10" fill="#fbbf24" />
    <circle cx="120" cy="150" r="4" fill="#ffffff" />
    <!-- Petals -->
    <circle cx="110" cy="150" r="5" fill="#f59e0b" />
    <circle cx="130" cy="150" r="5" fill="#f59e0b" />
    <circle cx="120" cy="140" r="5" fill="#f59e0b" />
    <circle cx="120" cy="160" r="5" fill="#f59e0b" />
  </g>

  <!-- Flower Group Right -->
  <g class="flower" filter="url(#shadow)">
    <path d="M165 180 L163 162" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <circle cx="163" cy="159" r="8" fill="#a855f7" />
    <circle cx="163" cy="159" r="3" fill="#fbbf24" />
  </g>
  <g class="flower" filter="url(#shadow)">
    <path d="M180 185 L178 168" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="178" cy="165" r="7" fill="#38bdf8" />
    <circle cx="178" cy="165" r="2.5" fill="#fbbf24" />
  </g>
  <g class="flower" filter="url(#shadow)">
    <path d="M145 185 L148 167" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="148" cy="164" r="6" fill="#f43f5e" />
    <circle cx="148" cy="164" r="2" fill="#fbbf24" />
  </g>
  <g class="flower" filter="url(#shadow)">
    <path d="M95 188 L93 172" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="93" cy="169" r="7" fill="#a855f7" />
    <circle cx="93" cy="169" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Floating Sparkles / Joyful Atmosphere representing "Tô điểm" / Embellishment -->
  <g fill="#fbbf24">
    <path d="M 50 110 Q 50 120 40 120 Q 50 120 50 130 Q 50 120 60 120 Q 50 120 50 110 Z" opacity="0.8" />
    <path d="M 190 100 Q 190 108 182 108 Q 190 108 190 116 Q 190 108 198 108 Q 190 108 190 100 Z" opacity="0.9" />
    <path d="M 140 85 Q 140 93 132 93 Q 140 93 140 101 Q 140 93 148 93 Q 140 93 140 85 Z" opacity="0.7" />
  </g>

  <!-- Garden Tool (Trowel resting on the ground) -->
  <g transform="translate(180, 185) rotate(25)" filter="url(#shadow)">
    <rect x="0" y="0" width="4" height="25" rx="2" fill="#b45309" />
    <path d="M-3 0 L7 0 L2 -12 Z" fill="#94a3b8" />
  </g>

  <!-- Additional glowing dots for magic/beautifying effect -->
  <circle cx="75" cy="135" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="165" cy="130" r="2.5" fill="#f43f5e" opacity="0.8" />
  <circle cx="100" cy="100" r="1.5" fill="#fbbf24" opacity="0.9" />
</svg>