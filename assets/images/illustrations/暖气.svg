<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background room scene elements (window with snow outside) -->
  <path d="M40 40 H200 V190 H40 Z" fill="#222731"/>
  
  <!-- Window frame & snow falling outside -->
  <rect x="55" y="55" width="55" height="75" rx="4" fill="#14171E"/>
  <!-- Snowflakes outside window -->
  <circle cx="70" cy="70" r="1.5" fill="#8B9BB4" opacity="0.6"/>
  <circle cx="95" cy="85" r="1.5" fill="#8B9BB4" opacity="0.6"/>
  <circle cx="80" cy="110" r="1.5" fill="#8B9BB4" opacity="0.6"/>
  <path d="M65 95 L72 92 M68 98 L75 95" stroke="#8B9BB4" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <path d="M85 70 L90 75" stroke="#8B9BB4" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Radiator Unit (The physical object representing "暖气") -->
  <g transform="translate(115, 80)">
    <!-- Radiator mounting brackets / shadow -->
    <rect x="-1" y="95" width="82" height="6" rx="3" fill="#101217"/>
    
    <!-- Radiator Body (Modern multi-fin design) -->
    <!-- Fin 1 -->
    <rect x="0" y="10" width="12" height="85" rx="3" fill="#2E3748"/>
    <rect x="3" y="18" width="6" height="69" rx="2" fill="#384357"/>
    
    <!-- Fin 2 -->
    <rect x="14" y="10" width="12" height="85" rx="3" fill="#2E3748"/>
    <rect x="17" y="18" width="6" height="69" rx="2" fill="#384357"/>

    <!-- Fin 3 -->
    <rect x="28" y="10" width="12" height="85" rx="3" fill="#2E3748"/>
    <rect x="31" y="18" width="6" height="69" rx="2" fill="#384357"/>

    <!-- Fin 4 -->
    <rect x="42" y="10" width="12" height="85" rx="3" fill="#2E3748"/>
    <rect x="45" y="18" width="6" height="69" rx="2" fill="#384357"/>

    <!-- Fin 5 -->
    <rect x="56" y="10" width="12" height="85" rx="3" fill="#2E3748"/>
    <rect x="59" y="18" width="6" height="69" rx="2" fill="#384357"/>

    <!-- Top & Bottom horizontal manifolds -->
    <rect x="-2" y="6" width="72" height="8" rx="4" fill="#384357"/>
    <rect x="-2" y="90" width="72" height="8" rx="4" fill="#384357"/>

    <!-- Temperature Control Valve (Modern golden/orange accent) -->
    <rect x="62" y="35" width="14" height="20" rx="3" fill="#E59838"/>
    <rect x="65" y="42" width="8" height="6" rx="1.5" fill="#FFF"/>
    <circle cx="69" cy="27" r="5" fill="#E59838"/>
    <rect x="68" y="22" width="2" height="5" fill="#D08020"/>

    <!-- Heat Waves / Warmth indicator (Minimal, elegant flat vectors emanating upwards) -->
    <path d="M12 2 C16 -4, 20 -4, 24 2" stroke="#E59838" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M36 0 C40 -6, 44 -6, 48 0" stroke="#E59838" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    
    <path d="M6 -10 C10 -16, 14 -16, 18 -10" stroke="#E59838" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M48 -8 C52 -14, 56 -14, 60 -8" stroke="#E59838" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Floor line -->
  <path d="M40 190 H200" stroke="#2E3748" stroke-width="3" stroke-linecap="round"/>
</svg>