<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Composition for "分工" (Division of labor / Task assignment) -->
  <!-- A central project hub distributing distinct colored tasks/roles to three team member silhouettes -->
  
  <g transform="translate(0, 5)">
    <!-- Central Project / Core Hub -->
    <circle cx="120" cy="70" r="22" fill="#252A34" stroke="#FFB74D" stroke-width="2.5"/>
    <path d="M110 70 L118 78 L132 62" fill="none" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Connecting Pathways / Task Distribution Lines -->
    <path d="M103 83 L65 115" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
    <path d="M137 83 L175 115" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
    <path d="M120 92 L120 135" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>

    <!-- Left Team Member & Specific Assigned Task Icon -->
    <g transform="translate(45, 115)">
      <!-- Person avatar background -->
      <circle cx="20" cy="20" r="18" fill="#21262D"/>
      <!-- Person head & body -->
      <circle cx="20" cy="14" r="6" fill="#60A5FA"/>
      <path d="M10 32 C10 24, 30 24, 30 32" fill="#60A5FA"/>
      <!-- Assigned Task Card (Code/Design icon) -->
      <rect x="5" y="44" width="30" height="22" rx="4" fill="#161B22" stroke="#60A5FA" stroke-width="1.5"/>
      <path d="M12 51 L16 55 L12 59" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 51 L28 55" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Center Team Member & Specific Assigned Task Icon -->
    <g transform="translate(100, 135)">
      <!-- Person avatar background -->
      <circle cx="20" cy="20" r="18" fill="#21262D"/>
      <!-- Person head & body -->
      <circle cx="20" cy="14" r="6" fill="#34D399"/>
      <path d="M10 32 C10 24, 30 24, 30 32" fill="#34D399"/>
      <!-- Assigned Task Card (Data/Chart icon) -->
      <rect x="5" y="44" width="30" height="22" rx="4" fill="#161B22" stroke="#34D399" stroke-width="1.5"/>
      <rect x="11" y="55" width="3" height="7" rx="1" fill="#34D399"/>
      <rect x="16" y="52" width="3" height="10" rx="1" fill="#34D399"/>
      <rect x="21" y="48" width="3" height="14" rx="1" fill="#34D399"/>
    </g>

    <!-- Right Team Member & Specific Assigned Task Icon -->
    <g transform="translate(155, 115)">
      <!-- Person avatar background -->
      <circle cx="20" cy="20" r="18" fill="#21262D"/>
      <!-- Person head & body -->
      <circle cx="20" cy="14" r="6" fill="#F472B6"/>
      <path d="M10 32 C10 24, 30 24, 30 32" fill="#F472B6"/>
      <!-- Assigned Task Card (Document/Text icon) -->
      <rect x="5" y="44" width="30" height="22" rx="4" fill="#161B22" stroke="#F472B6" stroke-width="1.5"/>
      <line x1="11" y1="51" x2="23" y2="51" stroke="#F472B6" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="11" y1="56" x2="19" y2="56" stroke="#F472B6" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>