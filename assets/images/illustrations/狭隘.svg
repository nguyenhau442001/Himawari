<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The Vast World (Visible through the slit) -->
  <rect x="110" y="0" width="20" height="240" fill="#2D333B"/>
  <circle cx="120" cy="90" r="40" fill="#FF9F1C"/>
  <path d="M110 120 L130 110 L130 150 L110 160 Z" fill="#4CC9F0" opacity="0.8"/>
  
  <!-- The Narrowing Walls (Obstruction) -->
  <rect x="0" y="0" width="114" height="240" fill="#1A1D24"/>
  <rect x="126" y="0" width="114" height="240" fill="#1A1D24"/>
  
  <!-- Wall Edges (Depth/Highlight) -->
  <rect x="112" y="0" width="2" height="240" fill="#373E47"/>
  <rect x="126" y="0" width="2" height="240" fill="#373E47"/>
  
  <!-- Light Glow on Edges -->
  <linearGradient id="edgeGlowLeft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFD166" stop-opacity="0"/>
    <stop offset="100%" stop-color="#FFD166" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="edgeGlowRight" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFD166" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
  </linearGradient>
  
  <rect x="110" y="0" width="4" height="240" fill="url(#edgeGlowLeft)"/>
  <rect x="126" y="0" width="4" height="240" fill="url(#edgeGlowRight)"/>

  <!-- The Observer (Silhouette) -->
  <!-- Shoulders -->
  <path d="M60 240 Q120 190 180 240 Z" fill="#0D0F12"/>
  <!-- Head -->
  <circle cx="120" cy="195" r="35" fill="#0D0F12"/>
  
  <!-- Visualizing the "Narrow Vision" -->
  <path d="M120 195 L114 0 L126 0 Z" fill="#FFD166" opacity="0.1"/>
</svg>