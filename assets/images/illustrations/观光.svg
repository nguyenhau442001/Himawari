<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Sky Gradient (Sunset/Dusk Tourism) -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Scenic Viewfinder Glow -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- SCENE BACKGROUND: Famous Landmark & Sightseeing Deck -->
  <g id="scenery">
    <!-- Sky -->
    <rect x="0" y="0" width="240" height="150" rx="24" fill="url(#sky-grad)"/>
    
    <!-- Distant Mountains / Hills -->
    <path d="M0 110 Q 60 80, 130 105 T 240 95 L 240 150 L 0 150 Z" fill="#475569" opacity="0.4"/>
    <path d="M0 120 Q 90 95, 170 115 T 240 105 L 240 150 L 0 150 Z" fill="#334155" opacity="0.6"/>

    <!-- Stylized Iconic Pagoda/Tower (Landmark for Sightseeing) -->
    <g transform="translate(170, 45)">
      <!-- Tower Body -->
      <polygon points="15,10 25,10 28,100 12,100" fill="#cbd5e1"/>
      <!-- Roof Tiers -->
      <path d="M5 30 Q 20 20, 35 30 L 32 35 Q 20 28, 8 35 Z" fill="#f59e0b"/>
      <path d="M3 55 Q 20 45, 37 55 L 34 60 Q 20 53, 6 60 Z" fill="#f59e0b"/>
      <path d="M0 80 Q 20 70, 40 80 L 36 86 Q 20 78, 4 86 Z" fill="#f59e0b"/>
      <!-- Spire -->
      <line x1="20" y1="10" x2="20" y2="0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Warm Sunset Sun -->
    <circle cx="70" cy="70" r="18" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- OBSERVATION DECK / PLATFORM -->
  <g id="deck" transform="translate(0, 150)">
    <!-- Floor -->
    <rect x="0" y="0" width="240" height="90" fill="#334155"/>
    <rect x="0" y="0" width="240" height="10" fill="#475569"/>
    
    <!-- Railing -->
    <path d="M 0 10 L 240 10" stroke="#94a3b8" stroke-width="4"/>
    <line x1="30" y1="10" x2="30" y2="40" stroke="#64748b" stroke-width="3"/>
    <line x1="90" y1="10" x2="90" y2="40" stroke="#64748b" stroke-width="3"/>
    <line x1="150" y1="10" x2="150" y2="40" stroke="#64748b" stroke-width="3"/>
    <line x1="210" y1="10" x2="210" y2="40" stroke="#64748b" stroke-width="3"/>
    <path d="M 0 25 L 240 25" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- FOREGROUND / MIDGROUND TOURISTS (Characters actively sightseeing) -->
  
  <!-- Character 1: Tourist taking photo with camera (Left) -->
  <g id="tourist-photographer" transform="translate(35, 135)" filter="url(#shadow)">
    <!-- Body & Clothes -->
    <path d="M15 35 Q 12 60, 10 85 L 28 85 Q 30 60, 32 35 Z" fill="#3b82f6"/>
    <!-- Head & Hair -->
    <circle cx="21" cy="22" r="10" fill="#fbcfe8"/>
    <path d="M11 20 Q 21 10, 31 20 Q 31 16, 21 14 Q 11 16, 11 20 Z" fill="#1e293b"/>
    <!-- Arms holding camera -->
    <path d="M15 38 Q 5 45, 18 48" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
    <!-- Camera Prop -->
    <rect x="15" y="42" width="14" height="10" rx="2" fill="#0f172a"/>
    <circle cx="22" cy="47" r="3" fill="#38bdf8"/>
    <!-- Legs -->
    <line x1="15" y1="85" x2="13" y2="105" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="85" x2="27" y2="105" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Tourist pointing and looking at the view (Center-Right) -->
  <g id="tourist-pointing" transform="translate(130, 125)" filter="url(#shadow)">
    <!-- Backpack -->
    <rect x="25" y="32" width="12" height="25" rx="4" fill="#ef4444"/>
    <!-- Body & Clothes -->
    <path d="M12 35 Q 18 60, 22 85 L 38 85 Q 35 60, 30 35 Z" fill="#10b981"/>
    <!-- Head & Hat -->
    <circle cx="21" cy="20" r="10" fill="#fde68a"/>
    <path d="M10 18 Q 21 12, 32 18 Z" fill="#f59e0b"/> <!-- Sun hat -->
    <!-- Pointing Arm -->
    <path d="M25 38 Q 45 30, 48 26" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="49" cy="25" r="3" fill="#fde68a"/>
    <!-- Legs -->
    <line x1="18" y1="85" x2="15" y2="115" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="32" y1="85" x2="35" y2="115" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Character 3: Tourist holding binoculars looking far away (Right edge) -->
  <g id="tourist-binoculars" transform="translate(185, 130)" filter="url(#shadow)">
    <!-- Body -->
    <path d="M12 40 Q 15 65, 18 90 L 32 90 Q 30 65, 28 40 Z" fill="#8b5cf6"/>
    <!-- Head -->
    <circle cx="20" cy="24" r="10" fill="#ffedd5"/>
    <path d="M10 22 Q 20 14, 30 22 Z" fill="#475569"/>
    <!-- Binoculars -->
    <rect x="12" y="32" width="18" height="9" rx="2" fill="#0f172a"/>
    <circle cx="16" cy="36" r="3" fill="#38bdf8"/>
    <circle cx="26" cy="36" r="3" fill="#38bdf8"/>
    <!-- Legs -->
    <line x1="17" y1="90" x2="15" y2="110" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="27" y1="90" x2="29" y2="110" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- CONTEXT DETAILS: Sightseeing props on railing (Coin-operated telescope) -->
  <g id="telescope" transform="translate(95, 125)">
    <!-- Stand -->
    <path d="M15 35 L 20 65 L 10 65 Z" fill="#64748b"/>
    <!-- Base -->
    <ellipse cx="15" cy="65" rx="8" ry="3" fill="#475569"/>
    <!-- Scope Cylinder -->
    <path d="M 5 25 L 35 20 L 37 28 L 7 33 Z" fill="#e2e8f0"/>
    <!-- Lens -->
    <ellipse cx="36" cy="24" rx="3" ry="4" fill="#38bdf8"/>
    <!-- Eyepiece -->
    <rect x="4" y="27" width="4" height="4" fill="#1e293b"/>
  </g>

  <!-- AMBIENT ATMOSPHERE: Floating birds in the sky -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M 95 40 Q 100 35, 105 40 Q 110 35, 115 40"/>
    <path d="M 118 48 Q 122 44, 126 48 Q 130 44, 134 48"/>
    <path d="M 85 52 Q 88 48, 91 52 Q 94 48, 97 52"/>
  </g>

  <!-- CAMERA FLASH / VIEWFINDER ACCENT FRAME (Subtle overlay to emphasize sightseeing capture) -->
  <rect x="16" y="16" width="208" height="208" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
</svg>