<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Glow for Mentor -->
    <radialGradient id="mentorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Environment / Backdrop -->
  <!-- Back Wall Details -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Bookshelf / Prop Background Left -->
  <rect x="35" y="40" width="30" height="90" rx="4" fill="#1b263b"/>
  <rect x="40" y="50" width="20" height="4" fill="#475569"/>
  <rect x="40" y="70" width="20" height="4" fill="#38bdf8"/>
  <rect x="40" y="90" width="20" height="4" fill="#f59e0b"/>

  <!-- Window Right with City Silhouette -->
  <path d="M170 35 L205 35 L205 110 L170 110 Z" fill="url(#windowLight)" stroke="#475569" stroke-width="1.5"/>
  <path d="M178 70 L185 60 L192 65 L192 110 L178 110 Z" fill="#1e293b"/>
  <path d="M192 50 L198 45 L202 48 L202 110 L192 110 Z" fill="#1e293b"/>

  <!-- Achievement Board / Certificate Frame (The "Role Model" context) -->
  <rect x="100" y="35" width="40" height="30" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="120" cy="47" r="6" fill="#f59e0b"/>
  <path d="M116 57 L124 57 L122 61 L118 61 Z" fill="#f59e0b"/>

  <!-- Wooden Desk Surface -->
  <path d="M15 160 L225 160 L235 185 L5 185 Z" fill="#334155" filter="url(#shadow)"/>
  <rect x="5" y="185" width="230" height="8" fill="#1e293b" rx="2"/>

  <!-- Desk Props -->
  <!-- Laptop on Left -->
  <path d="M25 165 L55 165 L60 155 L20 155 Z" fill="#64748b"/>
  <rect x="22" y="152" width="36" height="15" rx="2" fill="#94a3b8"/>
  <rect x="25" y="154" width="30" height="11" rx="1" fill="#38bdf8"/>
  
  <!-- Architectural Model / Trophy Prop -->
  <path d="M75 160 L85 140 L95 160 Z" fill="#fb923c"/>
  <circle cx="85" cy="138" r="4" fill="#f59e0b"/>

  <!-- CHARACTERS: THE MENTOR (榜样) & THE LEARNER -->
  
  <!-- Mentor Glow Behind -->
  <circle cx="145" cy="115" r="50" fill="url(#mentorGlow)"/>

  <!-- Character 1: The Mentor (Standing, confident, pointing/guiding) -->
  <g transform="translate(115, 65)">
    <!-- Body / Torso -->
    <path d="M 25 50 C 25 40 35 30 50 30 C 65 30 75 40 75 50 L 75 90 L 25 90 Z" fill="#0284c7" filter="url(#shadow)"/>
    <!-- Collar / Shirt -->
    <path d="M 40 30 L 50 45 L 60 30 Z" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="50" cy="18" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 36 18 C 36 10 42 6 50 6 C 58 6 64 10 64 18 C 64 20 62 20 60 16 C 56 10 44 10 40 16 C 38 20 36 20 36 18 Z" fill="#1e293b"/>
    <!-- Glasses / Friendly eyes -->
    <circle cx="45" cy="17" r="3" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="55" cy="17" r="3" fill="none" stroke="#1e293b" stroke-width="1"/>
    <line x1="48" y1="17" x2="52" y2="17" stroke="#1e293b" stroke-width="1"/>
    <!-- Smiling Mouth -->
    <path d="M 47 24 Q 50 27 53 24" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm pointing to screen/work -->
    <path d="M 25 45 C 15 45 5 55 0 60" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-1" cy="61" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: The Learner (Sitting, taking notes, admiring) -->
  <g transform="translate(65, 85)">
    <!-- Chair Back -->
    <rect x="-10" y="10" width="16" height="70" rx="6" fill="#475569"/>
    <!-- Torso -->
    <path d="M 5 40 C 5 30 15 20 30 20 C 45 20 55 30 55 40 L 55 85 L 5 85 Z" fill="#10b981" filter="url(#shadow)"/>
    <!-- Head -->
    <circle cx="30" cy="8" r="13" fill="#fbcfe8"/>
    <!-- Hair (Ponytail/Bun style) -->
    <path d="M 17 8 C 17 1 23 -3 30 -3 C 37 -3 43 1 43 8 C 43 11 40 13 43 16 C 45 18 48 18 48 16 C 48 10 43 5 30 5 C 17 5 17 8 17 8 Z" fill="#b45309"/>
    <!-- Face / Eyes looking up attentively -->
    <circle cx="26" cy="8" r="1.5" fill="#1e293b"/>
    <circle cx="34" cy="8" r="1.5" fill="#1e293b"/>
    <path d="M 28 13 Q 30 16 32 13" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm holding pen / writing -->
    <path d="M 45 45 C 55 45 65 60 65 65" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <circle cx="66" cy="66" r="3.5" fill="#fbcfe8"/>
    <!-- Pen -->
    <line x1="66" y1="66" x2="73" y2="73" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Notebook / Sketchpad on Desk in front of Learner -->
  <path d="M 75 160 L 135 150 L 140 170 L 80 180 Z" fill="#f8fafc" filter="url(#shadow)"/>
  <line x1="85" y1="168" x2="125" y2="161" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="88" y1="173" x2="120" y2="167" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Foreground decorative plants for depth -->
  <path d="M 5 210 Q 15 170 25 210 Z" fill="#047857"/>
  <path d="M 18 215 Q 28 180 35 215 Z" fill="#10b981"/>
  <circle cx="22" cy="185" r="4" fill="#f43f5e"/>
  <circle cx="12" cy="195" r="3" fill="#f59e0b"/>

</svg>