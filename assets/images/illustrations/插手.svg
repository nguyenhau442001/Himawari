<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background gear/system representing internal company/process structure -->
    <path d="M120 70 L130 90 L150 95 L135 110 L140 130 L120 120 L100 130 L105 110 L90 95 L110 90 Z" fill="#2A303C" opacity="0.6"/>
    <circle cx="120" cy="110" r="25" fill="none" stroke="#3A4252" stroke-width="6" stroke-dasharray="6 4"/>
    
    <!-- Inner document / structure block (Company internal affair) -->
    <rect x="95" y="85" width="50" height="60" rx="4" fill="#242B38" stroke="#3A4252" stroke-width="2"/>
    <line x1="105" y1="100" x2="135" y2="100" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="112" x2="125" y2="112" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="124" x2="130" y2="124" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>

    <!-- Boundary / Barrier (representing external boundary that shouldn't be crossed) -->
    <path d="M70 150 Q120 165 170 150" fill="none" stroke="#E5534B" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Intruding Hand (插手 - chāshǒu / meddling / interfering) coming from the side -->
    <!-- Sleeve / Arm from outside -->
    <path d="M220 135 L165 135 C150 135 145 145 135 155 L120 170" fill="none" stroke="#1A1D24" stroke-width="20" stroke-linecap="round"/>
    <path d="M220 135 L165 135 C150 135 145 145 135 155 L120 170" fill="none" stroke="#4F46E5" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Cuff -->
    <path d="M165 125 L165 145" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <!-- Hand interfering directly into the center/process -->
    <circle cx="123" cy="138" r="10" fill="#FBBF24"/>
    <path d="M123 128 L123 118" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
    <path d="M115 130 L110 120" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <path d="M131 130 L136 120" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <path d="M113 137 L103 135" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>

    <!-- Warning / Interruption accent (small geometric warning indicator) -->
    <circle cx="120" cy="110" r="6" fill="#E5534B"/>
    <path d="M120 107 L120 111" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="114" r="0.8" fill="#FFFFFF"/>
  </g>
</svg>