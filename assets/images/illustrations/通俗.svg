<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#FFB703" opacity="0.05"/>

  <!-- Central Object: An open book transforming into a clear, bright light/unfolding path representing "easily understood / accessible language" -->
  <g transform="translate(120, 120)">
    <!-- Glow behind the center -->
    <path d="M-40 -20 L0 -45 L40 -20 L40 30 L0 55 L-40 30 Z" fill="#FFB703" opacity="0.15"/>

    <!-- Left Page -->
    <path d="M -5 -35 C -25 -40 -50 -30 -60 -20 L -60 30 C -50 20 -25 10 -5 15 Z" fill="#2B303C"/>
    <!-- Right Page -->
    <path d="M 5 -35 C 25 -40 50 -30 60 -20 L 60 30 C 50 20 25 10 5 15 Z" fill="#3A4150"/>
    
    <!-- Book Spine -->
    <line x1="0" y1="-38" x2="0" y2="18" stroke="#1A1D24" stroke-width="3"/>

    <!-- Text lines on pages (abstract, clean) -->
    <line x1="-48" y1="-12" x2="-20" y2="-18" stroke="#6C7A9C" stroke-width="3" stroke-linecap="round"/>
    <line x1="-48" y1="-2" x2="-25" y2="-8" stroke="#6C7A9C" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="20" y1="-18" x2="48" y2="-12" stroke="#6C7A9C" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="-8" x2="48" y2="-2" stroke="#6C7A9C" stroke-width="3" stroke-linecap="round"/>

    <!-- Rising, crystal-clear light beam / checkmark / simplification icon emerging from the book -->
    <!-- Large prominent glowing arrow/bulb rising up representing clarity and accessibility -->
    <path d="M-18 5 L0 -15 L18 5 L9 5 L9 35 L-9 35 L-9 5 Z" fill="#FFB703"/>
    
    <!-- Inner detail on the rising beacon -->
    <path d="M0 -5 L8 3 L4 3 L4 25 L-4 25 L-4 3 L-8 3 Z" fill="#FFE566"/>

    <!-- Sparkles/Stars representing "easy/clear" understanding -->
    <path d="M -45 -55 Q -45 -42 -32 -42 Q -45 -42 -45 -29 Q -45 -42 -58 -42 Q -45 -42 -45 -55 Z" fill="#FFB703" opacity="0.9"/>
    <path d="M 52 -45 Q 52 -35  62 -35 Q 52 -35 52 -25 Q 52 -35 42 -35 Q 52 -35 52 -45 Z" fill="#FFB703" opacity="0.8"/>
    <path d="M 50 25 Q 50 33  58 33 Q 50 33 50 41 Q 50 33 42 33 Q 50 33 50 25 Z" fill="#6EE7B7" opacity="0.9"/>

    <!-- Base platform / book stand -->
    <path d="M-40 42 L40 42 L55 52 L-55 52 Z" fill="#21252D"/>
  </g>
</svg>