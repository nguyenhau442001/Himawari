<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background storm elements (Wind lines & Rain) -->
  <g opacity="0.3">
    <!-- Wind streaks -->
    <path d="M25 70 Q50 70 75 65" stroke="#7E8B99" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M15 110 Q45 110 70 105" stroke="#7E8B99" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M30 155 Q60 155 85 150" stroke="#7E8B99" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Rain drops -->
    <line x1="45" y1="50" x2="35" y2="70" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="75" y1="40" x2="65" y2="60" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="95" x2="20" y2="115" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="125" x2="50" y2="145" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Doorframe structure -->
  <path d="M72 48 H168 V200 H72 Z" fill="#2D3748" />
  <path d="M66 40 H174 V48 H66 Z" fill="#4A5568" />

  <!-- The Wooden Door (Sturdy / 抵挡 Object) angled open to show resistance -->
  <!-- Door shadow -->
  <path d="M90 56 L160 70 V192 L90 192 Z" fill="#0F172A" opacity="0.5"/>
  
  <!-- Main door panel (Isometric / 3D perspective representing physical block) -->
  <g>
    <!-- Door face -->
    <path d="M92 52 L155 64 V190 L92 190 Z" fill="#B45309"/>
    
    <!-- Wooden planks shading & texture -->
    <path d="M113 56 V186" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    <path d="M134 60 V188" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Horizontal wooden grain/shadows -->
    <path d="M93 85 L154 97" stroke="#78350F" stroke-width="2" opacity="0.4"/>
    <path d="M93 125 L154 137" stroke="#78350F" stroke-width="2" opacity="0.4"/>
    <path d="M93 165 L154 177" stroke="#78350F" stroke-width="2" opacity="0.4"/>

    <!-- Heavy iron reinforcement bands (giving it the 'resistant' defense feel) -->
    <path d="M92 72 L155 84 V90 L92 78 Z" fill="#334155"/>
    <path d="M92 152 L155 164 V170 L92 158 Z" fill="#334155"/>

    <!-- Iron rivets -->
    <circle cx="102" cy="77" r="2" fill="#94A3B8"/>
    <circle cx="140" cy="85" r="2" fill="#94A3B8"/>
    <circle cx="102" cy="157" r="2" fill="#94A3B8"/>
    <circle cx="140" cy="165" r="2" fill="#94A3B8"/>

    <!-- Sturdy Door Handle (Gold accent) -->
    <circle cx="138" cy="125" r="5" fill="#F59E0B"/>
    <circle cx="138" cy="125" r="2" fill="#B45309"/>
  </g>

  <!-- Impact / Force hitting the door (Visualizing the outward pressure being resisted) -->
  <g>
    <!-- Force wave / pressure arrows bouncing off the door -->
    <path d="M140 100 Q170 105 195 95" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M185 85 L197 97 L183 103" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <path d="M145 140 Q175 145 200 135" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M190 125 L202 137 L188 143" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Ground debris/splatters showing intensity -->
  <circle cx="180" cy="185" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="195" cy="175" r="2" fill="#38BDF8" opacity="0.6"/>
  <circle cx="165" cy="190" r="2" fill="#38BDF8" opacity="0.6"/>
</svg>