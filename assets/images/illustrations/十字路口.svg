<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Intersection Roads (Crossroads / 十字路口) -->
  <path d="M100 20 H140 V220 H100 Z" fill="#2D323F"/>
  <path d="M20 100 H220 V140 H20 Z" fill="#2D323F"/>
  
  <!-- Road Markings (Dashed Center Lines) -->
  <line x1="120" y1="20" x2="120" y2="85" stroke="#F6C90E" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="120" y1="155" x2="120" y2="220" stroke="#F6C90E" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="20" y1="120" x2="85" y2="120" stroke="#F6C90E" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="155" y1="120" x2="220" y2="120" stroke="#F6C90E" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Crosswalk (Pedestrian Zebra Crossing) -->
  <g fill="#A0AAB2" opacity="0.8">
    <rect x="91" y="85" width="6" height="15"/>
    <rect x="101" y="85" width="6" height="15"/>
    <rect x="111" y="85" width="6" height="15"/>
    <rect x="121" y="85" width="6" height="15"/>
    <rect x="131" y="85" width="6" height="15"/>
    <rect x="141" y="85" width="6" height="15"/>

    <rect x="91" y="140" width="6" height="15"/>
    <rect x="101" y="140" width="6" height="15"/>
    <rect x="111" y="140" width="6" height="15"/>
    <rect x="121" y="140" width="6" height="15"/>
    <rect x="131" y="140" width="6" height="15"/>
    <rect x="141" y="140" width="6" height="15"/>

    <rect x="85" y="91" width="15" height="6"/>
    <rect x="85" y="101" width="15" height="6"/>
    <rect x="85" y="111" width="15" height="6"/>
    <rect x="85" y="121" width="15" height="6"/>
    <rect x="85" y="131" width="15" height="6"/>

    <rect x="140" y="91" width="15" height="6"/>
    <rect x="140" y="101" width="15" height="6"/>
    <rect x="140" y="111" width="15" height="6"/>
    <rect x="140" y="121" width="15" height="6"/>
    <rect x="140" y="131" width="15" height="6"/>
  </g>
  
  <!-- Dynamic Pedestrian Character Approaching and Turning (Verb/Action Context) -->
  <g transform="translate(0, 0)">
    <!-- Motion / Direction Curves (Turning Left indication) -->
    <path d="M 120 180 Q 120 140 90 125" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round"/>
    <path d="M 95 128 L 90 125 L 94 120" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Character Body (Walking Upwards towards center, turning left) -->
    <!-- Head -->
    <circle cx="120" cy="185" r="7" fill="#F43F5E"/>
    <!-- Torso / Jacket -->
    <path d="M115 194 L125 194 L127 208 L113 208 Z" fill="#38BDF8"/>
    <!-- Arms in motion -->
    <line x1="115" y1="197" x2="108" y2="204" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <line x1="125" y1="197" x2="132" y2="201" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs in motion -->
    <line x1="116" y1="208" x2="112" y2="218" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <line x1="124" y1="208" x2="128" y2="216" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Focus / Contextual Pin at Center Intersection -->
  <circle cx="120" cy="120" r="4" fill="#F6C90E"/>
  <circle cx="120" cy="120" r="12" fill="none" stroke="#F6C90E" stroke-width="2" opacity="0.6"/>
</svg>