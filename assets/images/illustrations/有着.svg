<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "有着" (Possessing/Having a physical landmark/history object: Ancient City Tower with glowing historic aura) -->
  <!-- Background Glow & Urban Silhouette -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>
  
  <!-- Modern/Ancient city skyline background elements -->
  <rect x="55" y="130" width="18" height="50" fill="#2E3646" rx="2"/>
  <rect x="167" y="120" width="20" height="60" fill="#2E3646" rx="2"/>
  <rect x="75" y="105" width="15" height="75" fill="#242B38" rx="2"/>
  <rect x="150" y="110" width="15" height="70" fill="#242B38" rx="2"/>

  <!-- Central iconic object: Majestic Historic City Tower / Gate (representing "这座城市有着悠久的历史") -->
  <!-- Base wall structure -->
  <path d="M 75 180 L 75 145 C 75 140, 80 135, 85 135 L 155 135 C 160 135, 165 140, 165 145 L 165 180 Z" fill="#3E4859"/>
  <!-- Gateway arch -->
  <path d="M 105 180 L 105 155 C 105 147, 135 147, 135 155 L 135 180 Z" fill="#1A1D24"/>

  <!-- Traditional Multi-tiered Roof Structure representing Heritage/History -->
  <!-- Lower roof tier -->
  <path d="M 65 138 L 175 138 L 185 125 L 55 125 Z" fill="#D97706"/>
  <path d="M 70 125 L 170 125 L 175 118 L 65 118 Z" fill="#B45309"/>

  <!-- Upper roof tier -->
  <path d="M 80 118 L 160 118 L 170 102 L 70 102 Z" fill="#D97706"/>
  <path d="M 85 102 L 155 102 L 160 95 L 80 95 Z" fill="#B45309"/>

  <!-- Roof peak decoration -->
  <circle cx="120" cy="91" r="5" fill="#F59E0B"/>

  <!-- Glowing accent elements symbolizing "Possession" / "Having" / Historic value radiating outward -->
  <circle cx="120" cy="115" r="45" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  
  <!-- Radiant focus sparkles for the historic essence -->
  <path d="M 120 70 L 122 78 L 130 80 L 122 82 L 120 90 L 118 82 L 110 80 L 118 78 Z" fill="#F59E0B" opacity="0.8"/>
  <path d="M 175 95 L 176 99 L 180 100 L 176 101 L 175 105 L 174 101 L 170 100 L 174 99 Z" fill="#F59E0B" opacity="0.6"/>
  <path d="M 65 95 L 66 99 L 70 100 L 66 101 L 65 105 L 64 101 L 60 100 L 64 99 Z" fill="#F59E0B" opacity="0.6"/>

  <!-- Ground reflection / base platform -->
  <ellipse cx="120" cy="180" rx="55" ry="6" fill="#2E3646"/>
</svg>