<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Crumbling Palace Architecture -->
  <path d="M40 200 L40 120 L70 90 L110 120 L110 200 Z" fill="#334155"/>
  <path d="M130 200 L130 140 L160 110 L200 140 L200 200 Z" fill="#334155"/>
  <path d="M70 90 L90 70 L110 90 Z" fill="#475569"/>
  <path d="M160 110 L180 90 L200 110 Z" fill="#475569"/>
  
  <!-- Cracks and Debris -->
  <path d="M40 120 L60 140 L50 160" stroke="#fb923c" stroke-width="2" fill="none"/>
  <circle cx="120" cy="180" r="4" fill="#fb923c"/>
  <circle cx="150" cy="190" r="3" fill="#fb923c"/>
  
  <!-- The Fallen Throne/King Figure -->
  <g transform="translate(100, 150)">
    <path d="M20 40 L60 40 L55 20 L25 20 Z" fill="#f59e0b"/>
    <rect x="30" y="10" width="20" height="10" fill="#fbbf24"/>
    <path d="M35 5 L45 5 L40 0 Z" fill="#fbbf24"/>
    <!-- Slumped Figure -->
    <ellipse cx="40" cy="30" rx="10" ry="12" fill="#94a3b8"/>
    <circle cx="40" cy="25" r="6" fill="#cbd5e1"/>
  </g>
  
  <!-- Atmospheric Dust/Glow -->
  <circle cx="180" cy="60" r="20" fill="#fb923c" opacity="0.1"/>
  <circle cx="190" cy="50" r="10" fill="#fb923c" opacity="0.2"/>
  
  <!-- Sunset Horizon -->
  <path d="M0 200 Q120 230 240 200 L240 240 L0 240 Z" fill="#1e293b"/>
  <path d="M0 200 Q120 230 240 200" stroke="#334155" stroke-width="2" fill="none"/>
</svg>