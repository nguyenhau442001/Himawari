<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Effect for "Effective/Cured" -->
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Glow highlights -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light/Glow behind character -->
  <circle cx="120" cy="120" r="90" fill="url(#magicGlow)"/>

  <!-- Interior Background Elements (Cozy Room) -->
  <!-- Wallpaper/Wall details -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Window showing night/evening -->
  <path d="M175 40 L215 40 L215 105 L175 105 Z" fill="#090d16" stroke="#475569" stroke-width="2" rx="4"/>
  <path d="M195 40 L195 105" stroke="#475569" stroke-width="1.5"/>
  <path d="M175 72 L215 72" stroke="#475569" stroke-width="1.5"/>
  <!-- Star outside window -->
  <circle cx="187" cy="55" r="1.5" fill="#facc15"/>
  <circle cx="203" cy="85" r="1" fill="#facc15"/>

  <!-- Shelf with medicine bottles in background -->
  <rect x="25" y="55" width="50" height="6" rx="2" fill="#475569"/>
  <rect x="35" y="38" width="10" height="17" rx="3" fill="#ec4899"/>
  <rect x="49" y="43" width="12" height="12" rx="2" fill="#10b981"/>

  <!-- Bed/Pillow setup -->
  <path d="M30 180 L210 180 L210 215 L30 215 Z" fill="#334155" rx="8"/>
  <!-- Blanket -->
  <path d="M30 190 C60 180, 180 180, 210 190 L210 215 L30 215 Z" fill="#4f46e5" rx="4"/>

  <!-- Nightstand -->
  <rect x="175" y="125" width="45" height="55" rx="4" fill="#334155"/>
  <rect x="182" y="135" width="31" height="14" rx="2" fill="#1e293b"/>
  <!-- Lamp on nightstand -->
  <path d="M190 125 L205 125 L200 110 L195 110 Z" fill="#fbbf24"/>
  <line x1="197" y1="125" x2="197" y2="110" stroke="#64748b" stroke-width="2"/>

  <!-- Medicine Bottle on Nightstand (The focal prop) -->
  <rect x="185" y="153" width="10" height="14" rx="2" fill="#f8fafc"/>
  <rect x="187" y="151" width="6" height="3" rx="1" fill="#ef4444"/>

  <!-- MAIN CHARACTER: Happy/Relieved Person -->
  <!-- Body/Shoulders under blanket -->
  <path d="M80 185 C80 155, 120 150, 150 185 Z" fill="#6366f1"/>

  <!-- Neck -->
  <rect x="108" y="132" width="16" height="22" rx="8" fill="#f5d0b1"/>

  <!-- Head (Relieved/Smiling Expression) -->
  <circle cx="116" cy="115" r="24" fill="#f5d0b1"/>

  <!-- Hair -->
  <path d="M92 110 C92 90, 140 90, 140 115 C140 120, 138 115, 134 110 C125 98, 105 98, 96 108 Z" fill="#1e293b"/>

  <!-- Facial Features (Healthy & Energized - "见效") -->
  <!-- Closed happy eyes (arcs) -->
  <path d="M104 112 C107 116, 111 116, 114 112" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M120 112 C123 116, 127 116, 130 112" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cheeks -->
  <circle cx="103" cy="120" r="4" fill="#fda4af" opacity="0.6"/>
  <circle cx="131" cy="120" r="4" fill="#fda4af" opacity="0.6"/>

  <!-- Big happy smile -->
  <path d="M110 123 C113 128, 121 128, 124 123" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Raised Arms showing vitality/recovery -->
  <!-- Left arm -->
  <path d="M85 160 C70 145, 75 130, 85 130" stroke="#f5d0b1" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Right arm stretching up energetically -->
  <path d="M147 160 C165 145, 160 120, 150 115" stroke="#f5d0b1" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Hand waving/energized -->
  <circle cx="150" cy="111" r="5" fill="#f5d0b1"/>

  <!-- EFFECT / SPEED VISUAL CUES ("很快就见效") -->
  <!-- Sparkling magic rising from character / medicine -->
  <g transform="translate(0, -5)">
    <!-- Sparkle 1 (Top Right) -->
    <path d="M155 75 Q155 85 165 85 Q155 85 155 95 Q155 85 145 85 Q155 85 155 75 Z" fill="#38bdf8"/>
    <!-- Sparkle 2 (Mid Air) -->
    <path d="M85 95 Q85 102 92 102 Q85 102 85 109 Q85 102 78 102 Q85 102 85 95 Z" fill="#fbbf24"/>
    <!-- Sparkle 3 (Small) -->
    <circle cx="135" cy="70" r="3" fill="#34d399"/>
    <circle cx="105" cy="80" r="2" fill="#38bdf8"/>
  </g>

  <!-- Speed lines indicating fast effect -->
  <path d="M140 100 L148 90" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M152 105 L162 98" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M90 105 L82 95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Glowing Medicine Pill Icon (Stylized conceptual representation of fast recovery) -->
  <g transform="translate(110, 45) rotate(-25)">
    <rect x="-16" y="-7" width="32" height="14" rx="7" fill="url(#pillGrad)"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  </g>
</svg>