<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.1"/>
  <path d="M0 180 Q 120 150 240 180 L 240 240 L 0 240 Z" fill="#334155" opacity="0.3"/>
  
  <!-- Photographer Body -->
  <g transform="translate(60, 100)">
    <path d="M20 80 L60 80 L55 120 L25 120 Z" fill="#38bdf8"/>
    <ellipse cx="40" cy="70" rx="15" ry="18" fill="#fde68a"/>
    <path d="M30 50 L50 50 L45 70 L35 70 Z" fill="#fb923c"/>
  </g>

  <!-- Camera and Lens -->
  <g transform="translate(95, 140)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="#64748b"/>
    <circle cx="20" cy="15" r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="20" cy="15" r="5" fill="#38bdf8"/>
  </g>

  <!-- The "Moment" (Subject being captured) -->
  <g transform="translate(160, 120)">
    <path d="M0 0 L20 -30 L40 0 L20 10 Z" fill="#ec4899"/>
    <circle cx="20" cy="-15" r="8" fill="#fef3c7"/>
    <path d="M10 -20 L30 -20 M15 -10 L25 -10" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flash/Focus Effect -->
  <path d="M135 145 L170 110 L180 120 Z" fill="#fbbf24" opacity="0.4"/>
  <circle cx="170" cy="110" r="4" fill="#ffffff"/>
  
  <!-- Environment Details -->
  <path d="M20 200 L40 180 M50 210 L70 190 M180 200 L200 180" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
</svg>