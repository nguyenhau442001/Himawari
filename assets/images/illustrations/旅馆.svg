<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Icon: Small Hotel / Inn (旅馆) -->
  <g transform="translate(40, 35)">
    <!-- Main Building Structure -->
    <rect x="35" y="55" width="90" height="105" rx="4" fill="#2D3748" />
    
    <!-- Roof / Awning detail -->
    <polygon points="25,55 80,15 135,55" fill="#E2E8F0" />
    <polygon points="30,55 80,20 130,55" fill="#FFA726" />
    
    <!-- Hotel Sign / Neon Board (representing 旅馆 lodging) -->
    <rect x="65" y="68" width="30" height="16" rx="3" fill="#1A1D24" />
    <path d="M73 76 H87 M80 71 V81" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Windows Top Row -->
    <rect x="48" y="94" width="18" height="20" rx="2" fill="#4A5568" />
    <rect x="94" y="94" width="18" height="20" rx="2" fill="#4A5568" />
    
    <!-- Windows Bottom Row / Balcony hint -->
    <rect x="48" y="124" width="18" height="20" rx="2" fill="#4A5568" />
    <rect x="94" y="124" width="18" height="20" rx="2" fill="#4A5568" />

    <!-- Entrance Door -->
    <path d="M 68 160 V 132 C 68 128, 92 128, 92 132 V 160 Z" fill="#CBD5E0" />
    <circle cx="86" cy="146" r="1.5" fill="#1A1D24" />

    <!-- Cozy Warm Light Glow (representing a welcoming small inn) -->
    <circle cx="80" cy="10" r="4" fill="#FFD54F" opacity="0.6"/>
  </g>
</svg>