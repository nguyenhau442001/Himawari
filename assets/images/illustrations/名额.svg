<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- University Entrance Signage -->
  <rect x="40" y="40" width="160" height="120" rx="8" fill="#334155"/>
  <rect x="50" y="50" width="140" height="100" rx="4" fill="#f1f5f9"/>
  
  <!-- The "Limited" slots visual representation -->
  <circle cx="80" cy="80" r="12" fill="#10b981"/>
  <circle cx="120" cy="80" r="12" fill="#10b981"/>
  <circle cx="160" cy="80" r="12" fill="#10b981"/>
  <circle cx="80" cy="120" r="12" fill="#cbd5e1"/>
  <circle cx="120" cy="120" r="12" fill="#cbd5e1"/>
  <circle cx="160" cy="120" r="12" fill="#cbd5e1"/>
  
  <!-- Character: Student looking concerned -->
  <g transform="translate(60, 150)">
    <path d="M20 80 Q 40 40 60 80" fill="#fb923c"/>
    <circle cx="40" cy="30" r="20" fill="#fde68a"/>
    <path d="M32 25 L36 28 M44 25 L48 28" stroke="#0f172a" stroke-width="2"/>
    <path d="M35 38 Q40 42 45 38" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Character: Administrator pointing to the sign -->
  <g transform="translate(140, 150)">
    <rect x="20" y="20" width="30" height="60" rx="5" fill="#38bdf8"/>
    <circle cx="35" cy="10" r="12" fill="#fde68a"/>
    <path d="M50 30 L70 20" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="18" r="4" fill="#fde68a"/>
  </g>
  
  <!-- Decorative elements -->
  <path d="M180 180 L220 180 L200 210 Z" fill="#fbbf24"/>
  <circle cx="30" cy="200" r="10" fill="#ec4899" opacity="0.6"/>
