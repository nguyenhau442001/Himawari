<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: A mysterious puzzle/box that looks complicated on the outside, but has a glowing simple core inside (representing "kànsì" - seeming/appearing vs reality) -->
  
  <g transform="translate(120, 120)">
    <!-- Outer complicated geometric cage/frame (The "Appearing" complex exterior) -->
    <path d="M-50 -50 L0 -75 L50 -50 L75 0 L50 50 L0 75 L-50 50 L-75 0 Z" fill="none" stroke="#3A4252" stroke-width="3" stroke-dasharray="6 4" />
    
    <!-- Complex interlocking lines (Math problem illusion) -->
    <path d="M-40 -40 L40 40 M-40 40 L40 -40 M0 -60 L0 60 M-60 0 L60 0" stroke="#4A5568" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Outer nodes / puzzle joints -->
    <circle cx="0" cy="-75" r="5" fill="#4A5568"/>
    <circle cx="75" cy="0" r="5" fill="#4A5568"/>
    <circle cx="0" cy="75" r="5" fill="#4A5568"/>
    <circle cx="-75" cy="0" r="5" fill="#4A5568"/>

    <!-- Glowing core revealed in the center (The simple solution/truth) -->
    <circle cx="0" cy="0" r="28" fill="#1A1D24" stroke="#F6AD55" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="#F6AD55" opacity="0.2"/>
    
    <!-- Key/Solution icon inside the core -->
    <path d="M-6 2 L6 -10 M6 -10 L10 -10 M6 -10 L6 -6" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-9" cy="5" r="5" fill="none" stroke="#F6AD55" stroke-width="3"/>

    <!-- Focus accent glow ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#F6AD55" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 6"/>
  </g>
</svg>