<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 35)">
    <!-- Globe/World Background representing domestic and international (国内外) -->
    <circle cx="80" cy="80" r="55" fill="#252A34" stroke="#3A4252" stroke-width="3"/>
    
    <!-- Simplified continents / world map lines -->
    <path d="M50 70 Q60 55 80 65 T110 75 Q100 95 85 90 T50 70 Z" fill="#303846" opacity="0.8"/>
    <path d="M85 105 Q105 110 115 125 T85 135 Z" fill="#303846" opacity="0.8"/>
    <path d="M55 95 Q40 100 45 115 T65 110 Z" fill="#303846" opacity="0.8"/>
    
    <!-- Orbiting ring for global scope -->
    <ellipse cx="80" cy="80" rx="70" ry="25" fill="none" stroke="#FFA500" stroke-width="2" stroke-dasharray="6,4" transform="rotate(-20 80 80)"/>

    <!-- Modern News / Broadcast Interface Layer (Representing Current Events / 时事) -->
    <!-- Main screen / document -->
    <rect x="45" y="45" width="70" height="70" rx="8" fill="#1A1D24" stroke="#FFA500" stroke-width="3" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))"/>
    
    <!-- News ticker / headlines elements inside screen -->
    <rect x="55" y="57" width="35" height="6" rx="3" fill="#FFA500"/>
    <rect x="55" y="70" width="50" height="4" rx="2" fill="#8C95A5"/>
    <rect x="55" y="80" width="42" height="4" rx="2" fill="#8C95A5"/>
    
    <!-- Live broadcast indicator (red dot + pulse) -->
    <circle cx="102" cy="60" r="4" fill="#FF4757"/>
    <circle cx="102" cy="60" r="7" fill="none" stroke="#FF4757" stroke-width="1.5" opacity="0.6"/>

    <!-- Clock / Time Element (时) integrated onto the news feed -->
    <g transform="translate(75, 92)">
      <circle cx="20" cy="20" r="16" fill="#252A34" stroke="#FFA500" stroke-width="2.5"/>
      <polyline points="20,10 20,20 27,20" fill="none" stroke="#FFA500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Floating Sparkle/Focus Accents -->
    <path d="M25 35 L28 42 L35 45 L28 48 L25 55 L22 48 L15 45 L22 42 Z" fill="#FFA500" opacity="0.8"/>
    <path d="M135 115 L137 120 L142 122 L137 124 L135 129 L133 124 L128 122 L133 120 Z" fill="#FFCF40" opacity="0.9"/>
  </g>
</svg>