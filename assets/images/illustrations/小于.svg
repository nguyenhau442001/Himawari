<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="175" width="10" height="50" fill="#475569"/>
  <rect x="200" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Character -->
  <circle cx="120" cy="90" r="35" fill="#fde68a"/>
  <path d="M105 85 Q110 80 115 85 M125 85 Q130 80 135 85" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M110 100 Q120 105 130 100" stroke="#475569" stroke-width="2" fill="none"/>
  <rect x="85" y="125" width="70" height="40" rx="10" fill="#fb923c"/>
  
  <!-- Math Props: 10 vs 20 -->
  <!-- 10 stack -->
  <g transform="translate(60, 130)">
    <rect width="25" height="25" rx="4" fill="#38bdf8"/>
    <circle cx="12.5" cy="12.5" r="6" fill="#0f172a" fill-opacity="0.2"/>
  </g>
  
  <!-- 20 stack -->
  <g transform="translate(155, 120)">
    <rect width="25" height="25" rx="4" fill="#10b981"/>
    <rect x="0" y="30" width="25" height="25" rx="4" fill="#10b981"/>
    <circle cx="12.5" cy="12.5" r="6" fill="#0f172a" fill-opacity="0.2"/>
    <circle cx="12.5" cy="42.5" r="6" fill="#0f172a" fill-opacity="0.2"/>
  </g>
  
  <!-- Comparison indicator -->
  <path d="M100 145 L130 135 L100 125" stroke="#ec4899" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Background decor -->
  <circle cx="200" cy="40" r="20" fill="#f59e0b" fill-opacity="0.1"/>
  <circle cx="30" cy="50" r="10" fill="#fbbf24" fill-opacity="0.1"/>
</svg>