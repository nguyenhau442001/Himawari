<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="130" r="60" fill="#FFB703" opacity="0.06" filter="blur(10px)"/>

  <!-- Honey Dipper Stick -->
  <g transform="rotate(25 120 115)">
    <!-- Handle -->
    <line x1="120" y1="35" x2="120" y2="100" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
    <!-- Dipper head rings -->
    <ellipse cx="120" cy="98" rx="14" ry="5" fill="#A1887F"/>
    <ellipse cx="120" cy="106" rx="16" ry="6" fill="#A1887F"/>
    <ellipse cx="120" cy="114" rx="14" ry="5" fill="#A1887F"/>
    <circle cx="120" cy="93" r="5" fill="#8D6E63"/>
  </g>

  <!-- Glass Honey Jar Base/Body -->
  <path d="M 85 95 
           C 85 90, 92 88, 120 88 
           C 148 88, 155 90, 155 95 
           L 165 175 
           C 165 188, 153 195, 120 195 
           C 87 195, 75 188, 75 175 
           Z" 
        fill="#2A2F3D" stroke="#3E4556" stroke-width="3" stroke-linejoin="round"/>

  <!-- Honey Fill inside Jar (Liquid level) -->
  <path d="M 78 120 
           Q 120 128, 162 120 
           L 165 175 
           C 165 188, 153 195, 120 195 
           C 87 195, 75 188, 75 175 
           Z" 
        fill="#FFB703"/>

  <!-- Honey Drip from Dipper -->
  <path d="M 124 125 
           Q 122 145, 118 160 
           Q 115 170, 120 170 
           Q 125 170, 122 160 
           Q 120 145, 124 125" 
        fill="#FFAA00"/>

  <!-- Honey Jar Neck & Rim -->
  <path d="M 95 72 L 95 88 L 145 88 L 145 72 Z" fill="#2A2F3D" stroke="#3E4556" stroke-width="3" stroke-linejoin="round"/>
  <rect x="91" y="66" width="58" height="8" rx="3" fill="#3E4556"/>

  <!-- Glass Reflection Highlights -->
  <path d="M 83 130 C 80 150, 83 170, 88 185" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.15"/>
  <path d="M 148 98 C 153 120, 150 150, 145 170" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.1"/>

  <!-- Honeycomb pattern on label area -->
  <g transform="translate(120, 148)" opacity="0.25">
    <polygon points="0,-10 8,-5 8,5 0,10 -8,5 -8,-5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <polygon points="14,-19 22,-14 22,-4 14,1 6,-4 6,-14" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <polygon points="-14,-19 -6,-14 -6,-4 -14,1 -22,-4 -22,-14" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Sweet Golden Sparkles/Bubbles -->
  <circle cx="98" cy="155" r="2.5" fill="#FFE56C" opacity="0.8"/>
  <circle cx="140" cy="168" r="2" fill="#FFE56C" opacity="0.8"/>
  <circle cx="132" cy="138" r="1.5" fill="#FFE56C" opacity="0.6"/>
</svg>