<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative workbench surface -->
  <path d="M 36 180 L 204 180" stroke="#2D333F" stroke-width="4" stroke-linecap="round"/>

  <!-- Transformation concept: Ordinary bottle transforming into a useful vase with a green plant -->
  
  <!-- Step 1: Humble discarded plastic bottle (left side, slightly faded/simple) -->
  <g transform="translate(60, 110)">
    <path d="M10 15 L14 15 L14 22 L22 62 C23 66, 20 70, 16 70 L6 70 C2 70, -1 66, 0 62 L8 22 L8 15 Z" fill="#3B4252" opacity="0.6"/>
    <rect x="11" y="10" width="4" height="5" rx="1" fill="#3B4252" opacity="0.6"/>
    <!-- Slight crumple detail -->
    <path d="M2 35 L20 38" stroke="#262B35" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M4 50 L18 48" stroke="#262B35" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Transformation arrow / magical upgrade flow -->
  <path d="M 95 125 C 105 115, 115 115, 125 125" fill="none" stroke="#F69D62" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="124,121 131,126 123,131" fill="#F69D62"/>

  <!-- Step 2: The "Yongchu" (High Utility/Value) - Beautiful recycled planter/vase with vibrant plant (right-center focus) -->
  <g transform="translate(140, 85)">
    <!-- Glow/Highlight aura representing "Great Use / Value" -->
    <circle cx="20" cy="55" r="32" fill="#F69D62" opacity="0.1"/>

    <!-- Plant Sprouts (Utility & Life) -->
    <path d="M20 30 C 20 15, 10 10, 2 5" fill="none" stroke="#A3BE8C" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M20 25 C 20 12, 30 8, 38 2" fill="none" stroke="#A3BE8C" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M2 5 C -2 0, 7 -2, 10 5 Z" fill="#A3BE8C"/>
    <path d="M38 2 C 43 0, 38 10, 32 8 Z" fill="#A3BE8C"/>
    <path d="M20 32 C 16 20, 25 18, 28 24 Z" fill="#8FBCBB"/>

    <!-- Reused Bottle Vase (Transformed object) -->
    <!-- Base bottle body -->
    <path d="M12 40 L16 40 L16 46 L28 92 C29 97, 25 102, 20 102 L20 102 C15 102, 11 97, 12 92 L24 46 L24 40 Z" fill="#88C0D0"/>
    <!-- Bottle neck & cap -->
    <rect x="16" y="32" width="8" height="8" rx="2" fill="#EBCB8B"/>
    <rect x="15" y="30" width="10" height="3" rx="1.5" fill="#D08770"/>

    <!-- Decorative craft pattern showing "upcycled" care -->
    <path d="M15 65 L25 65" stroke="#E5E9F0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M14 75 L26 75" stroke="#E5E9F0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="20" cy="85" r="2" fill="#EBCB8B"/>
  </g>

  <!-- Sparkles / Accent indicators of utility and brilliance -->
  <path d="M 45 75 L 47 80 L 52 82 L 47 84 L 45 89 L 43 84 L 38 82 L 43 80 Z" fill="#EBCB8B"/>
  <path d="M 195 60 L 196 63 L 199 64 L 196 65 L 195 68 L 194 65 L 191 64 L 194 63 Z" fill="#F69D62"/>
</svg>