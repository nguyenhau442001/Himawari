<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Anger Aura Gradient -->
    <radialGradient id="anger-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Card Container -->
    <clipPath id="card-clip">
      <rect width="240" height="240" rx="24" ry="24" />
    </clipPath>
  </defs>

  <!-- Full-Bleed Container -->
  <g clip-path="url(#card-clip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bg-grad)" />

    <!-- Ambient Room Details (Office/Desk Setting) -->
    <!-- Wallpaper / Panel Lines -->
    <line x1="0" y1="160" x2="240" y2="160" stroke="#0f172a" stroke-width="4" />
    <rect x="25" y="40" width="50" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <line x1="35" y1="55" x2="65" y2="55" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="35" y1="70" x2="65" y2="70" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="35" y1="85" x2="55" y2="85" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Bookshelf in background -->
    <rect x="175" y="50" width="40" height="90" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <line x1="175" y1="80" x2="215" y2="80" stroke="#334155" stroke-width="2" />
    <line x1="175" y1="110" x2="215" y2="110" stroke="#334155" stroke-width="2" />
    <!-- Books -->
    <rect x="181" y="58" width="8" height="22" fill="#ef4444" rx="1" />
    <rect x="191" y="55" width="10" height="25" fill="#38bdf8" rx="1" />
    <rect x="183" y="88" width="12" height="22" fill="#10b981" rx="1" />

    <!-- Window with night city lights -->
    <rect x="95" y="30" width="50" height="85" rx="6" fill="#0b0f19" stroke="#475569" stroke-width="2" />
    <line x1="120" y1="30" x2="120" y2="115" stroke="#475569" stroke-width="2" />
    <line x1="95" y1="72" x2="145" y2="72" stroke="#475569" stroke-width="2" />
    <!-- City lights through window -->
    <circle cx="105" cy="50" r="1.5" fill="#fde047" />
    <circle cx="112" cy="62" r="1" fill="#fde047" />
    <circle cx="132" cy="45" r="1.5" fill="#fde047" />
    <circle cx="138" cy="85" r="1" fill="#fde047" />

    <!-- Desk Surface -->
    <path d="M 0 185 L 240 185 L 240 240 L 0 240 Z" fill="#334155" />
    <path d="M 0 180 L 240 180 L 240 185 L 0 185 Z" fill="#1e293b" />

    <!-- Desk Props (Broken Laptop / Papers flying / Coffee mug knocked over) -->
    <!-- Coffee Spill & Mug -->
    <path d="M 185 195 Q 200 192 215 198 Q 210 205 185 200 Z" fill="#78350f" opacity="0.8" />
    <ellipse cx="175" cy="190" rx="8" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Knocked over cup lines -->
    <path d="M 170 185 L 165 175" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

    <!-- Scattered Paperwork -->
    <polygon points="50,195 75,190 80,210 55,215" fill="#f8fafc" transform="rotate(-15 65 200)" />
    <line x1="58" y1="200" x2="70" y2="198" stroke="#cbd5e1" stroke-width="1" />
    <line x1="56" y1="205" x2="68" y2="203" stroke="#cbd5e1" stroke-width="1" />

    <polygon points="140,190 165,195 160,215 135,210" fill="#f8fafc" transform="rotate(25 150 200)" />
    <line x1="145" y1="198" x2="155" y2="200" stroke="#cbd5e1" stroke-width="1" />

    <!-- Modern Laptop showing broken screen graphic -->
    <path d="M 85 170 L 135 170 L 140 182 L 80 182 Z" fill="#94a3b8" />
    <path d="M 85 115 L 135 115 C 137 115 138 116 138 118 L 138 171 C 138 173 137 174 135 174 L 85 174 C 83 174 82 173 82 171 L 82 118 C 82 116 83 115 85 115 Z" fill="#475569" />
    <!-- Screen content: Red Error / Cracked vector -->
    <rect x="86" y="119" width="48" height="51" fill="#0f172a" />
    <path d="M 95 130 L 125 155 M 125 130 L 95 155" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

    <!-- ANGER AURA EFFECT BEHIND CHARACTER -->
    <circle cx="120" cy="130" r="60" fill="url(#anger-aura)" />

    <!-- MAIN CHARACTER (Expressive, furious body language) -->
    <!-- Torso (leaning forward aggressively) -->
    <path d="M 95 140 L 135 145 L 145 190 L 90 190 Z" fill="#1d4ed8" /> <!-- Blue shirt -->
    <!-- Suit jacket / vest overlay -->
    <path d="M 95 140 L 115 190 L 90 190 Z" fill="#1e293b" />
    <path d="M 135 145 L 115 190 L 145 190 Z" fill="#1e293b" />

    <!-- Neck -->
    <rect x="108" y="105" width="14" height="20" fill="#f5d0b1" />

    <!-- Head (Tensed, clenched jaw, tilted forward in rage) -->
    <circle cx="115" cy="95" r="22" fill="#f5d0b1" />

    <!-- Hair (Messy, stylized dark hair) -->
    <path d="M 93 90 C 93 75 105 70 120 72 C 135 70 140 85 138 100 C 135 90 130 78 115 78 C 100 78 95 85 93 90 Z" fill="#0f172a" />

    <!-- Angry Facial Features -->
    <!-- Angled Eyebrows (Downward, fierce) -->
    <path d="M 98 88 L 110 93" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 130 88 L 118 93" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

    <!-- Eyes (Determined, furious slants) -->
    <circle cx="104" cy="97" r="2.5" fill="#0f172a" />
    <circle cx="124" cy="97" r="2.5" fill="#0f172a" />

    <!-- Clenched Gritted Mouth -->
    <path d="M 107 107 L 121 107" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 110 109 L 118 109" stroke="#ffffff" stroke-width="2" stroke-linecap="round" /> <!-- Teeth bared -->

    <!-- Flush / Red Cheeks of Anger -->
    <ellipse cx="100" cy="101" rx="4" ry="2" fill="#ef4444" opacity="0.6" />
    <ellipse cx="128" cy="101" rx="4" ry="2" fill="#ef4444" opacity="0.6" />

    <!-- Arms & Fists (Pounding or gripping desk in rage) -->
    <!-- Left Arm & Slamming Fist -->
    <path d="M 95 145 C 80 150 70 170 65 185" fill="none" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" />
    <circle cx="63" cy="188" r="9" fill="#f5d0b1" /> <!-- Clenched Fist -->
    <!-- Motion lines for slam -->
    <path d="M 50 180 L 60 185" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 48 190 L 58 188" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Arm & Raised/Clenched Fist -->
    <path d="M 135 145 C 150 150 160 165 165 180" fill="none" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" />
    <circle cx="168" cy="183" r="9" fill="#f5d0b1" /> <!-- Clenched Fist -->

    <!-- Comic/Graphic Rage Symbols (Floating anger veins/symbols near head) -->
    <!-- Anger Vein Symbol on Forehead -->
    <path d="M 112 78 Q 115 82 118 78 M 115 77 L 115 83" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
    
    <path d="M 138 75 L 146 65" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    <path d="M 142 63 L 146 65 L 144 69" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" />

    <path d="M 90 75 L 82 65" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    <path d="M 86 63 L 82 65 L 84 69" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" />

    <!-- Vignette / Frame Border (Clean rounded inset) -->
    <rect width="240" height="240" rx="24" ry="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
  </g>
</svg>