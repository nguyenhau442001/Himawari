<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filter for lucky elements -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Red gradient for spring couplet banner -->
    <linearGradient id="redBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#D91E18"/>
    </linearGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59F00"/>
    </linearGradient>

    <!-- Cloud gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A404E"/>
      <stop offset="100%" stop-color="#282D37"/>
    </linearGradient>
  </defs>

  <!-- Background decorative auspicious cloud patterns (traditional ruyi motifs) -->
  <path d="M50 80 C40 80 35 70 42 63 C49 56 60 62 60 70 Z" fill="#282D37" opacity="0.6"/>
  <path d="M190 90 C180 90 175 80 182 73 C189 66 200 72 200 80 Z" fill="#282D37" opacity="0.6"/>
  <path d="M60 170 C50 170 45 160 52 153 C59 146 70 152 70 160 Z" fill="#282D37" opacity="0.6"/>
  <path d="M180 160 C170 160 165 150 172 143 C179 136 190 142 190 150 Z" fill="#282D37" opacity="0.6"/>

  <!-- Main Physical Object: Red Spring Festival Couplet Scroll / Banner with Auspicious Cloud (Cát Tường - 吉祥 physical embodiment) -->
  <!-- Hanging strings -->
  <line x1="95" y1="40" x2="95" y2="60" stroke="#F59F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="40" x2="145" y2="60" stroke="#F59F00" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Scroll Top & Bottom Rods -->
  <rect x="80" y="55" width="80" height="10" rx="5" fill="url(#goldGrad)"/>
  <rect x="80" y="185" width="80" height="10" rx="5" fill="url(#goldGrad)"/>

  <!-- Scroll Red Body -->
  <rect x="88" y="65" width="64" height="120" rx="4" fill="url(#redBannerGrad)"/>
  
  <!-- Subtle inner border line for the couplet scroll -->
  <rect x="94" y="71" width="52" height="108" rx="2" fill="none" stroke="#FFE066" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8"/>

  <!-- Central Auspicious Motif on Scroll: Ruyi Cloud & Blooming Flower (representing 吉祥 - good fortune & wellbeing) -->
  <g transform="translate(120, 125)" filter="url(#goldGlow)">
    <!-- Outer Ruyi cloud formations -->
    <path d="M-20 -5 C-30 -5 -35 -15 -25 -22 C-15 -29 -5 -20 -10 -10 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M20 -5 C30 -5 35 -15 25 -22 C15 -29 5 -20 10 -10 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Central Plum Blossom / Lucky Bloom -->
    <circle cx="0" cy="-5" r="8" fill="#FFE066"/>
    <circle cx="0" cy="-18" r="7" fill="#FFE066"/>
    <circle cx="12" cy="-10" r="7" fill="#FFE066"/>
    <circle cx="12" cy="5" r="7" fill="#FFE066"/>
    <circle cx="-12" cy="5" r="7" fill="#FFE066"/>
    <circle cx="-12" cy="-10" r="7" fill="#FFE066"/>
    <!-- Center stamen -->
    <circle cx="0" cy="-5" r="4" fill="#D91E18"/>
  </g>

  <!-- Hanging tassels at the bottom -->
  <path d="M120 195 L120 215" stroke="#F59F00" stroke-width="3" stroke-linecap="round"/>
  <polygon points="112,215 128,215 120,230" fill="#F59F00"/>

  <!-- Sparkling / Lucky Star Accents (representing auspiciousness & brightness) -->
  <!-- Top Left Star -->
  <path d="M55 95 Q65 95 65 85 Q65 95 75 95 Q65 95 65 105 Q65 95 55 95 Z" fill="#FFE066" filter="url(#goldGlow)"/>
  <!-- Top Right Star -->
  <path d="M175 65 Q183 65 183 57 Q183 65 191 65 Q183 65 183 73 Q183 65 175 65 Z" fill="#FFE066" filter="url(#goldGlow)"/>
  <!-- Bottom Right Sparkle -->
  <path d="M165 175 Q170 175 170 170 Q170 175 175 175 Q170 175 170 180 Q170 175 165 175 Z" fill="#FFE066" opacity="0.8"/>
</svg>