<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Workbench surface -->
    <path d="M-90 60 L90 60 L75 85 L-75 85 Z" fill="#2A2F3D"/>
    <rect x="-90" y="85" width="180" height="8" rx="2" fill="#1E222D"/>

    <!-- Sparks / Particles -->
    <circle cx="15" cy="-25" r="2" fill="#FFB703"/>
    <circle cx="28" cy="-18" r="1.5" fill="#FFB703"/>
    <circle cx="35" cy="-32" r="2" fill="#FB8500"/>
    <circle cx="22" cy="-40" r="1" fill="#FFB703"/>

    <!-- The Jade / Raw Stone Object (Being polished) -->
    <path d="M-15 15 C-25 15 -35 30 -25 45 C-15 60 15 60 25 45 C35 30 25 15 15 15 Z" fill="#2A9D8F"/>
    <!-- Highlight on polished section -->
    <path d="M-5 25 C-10 25 -15 35 -10 42 C-5 48 5 45 8 38 C10 30 5 25 -5 25 Z" fill="#E9C46A" opacity="0.8"/>

    <!-- Polishing Tool (Angle Grinder / Polisher Head) -->
    <!-- Articulated arm coming from top right -->
    <path d="M40 -70 L15 -25" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Tool Body -->
    <rect x="0" y="-35" width="30" height="40" rx="6" fill="#64748B" transform="rotate(30 15 -15)"/>
    
    <!-- Grip / Handle detail -->
    <rect x="25" y="-60" width="12" height="35" rx="4" fill="#334155" transform="rotate(30 31 -42.5)"/>

    <!-- Rotating Polishing Pad / Contact Point -->
    <ellipse cx="10" cy="-15" rx="14" ry="7" fill="#F4A261" transform="rotate(30 10 -15)"/>
    <ellipse cx="10" cy="-15" rx="10" ry="4" fill="#E76F51" transform="rotate(30 10 -15)"/>

    <!-- Hand guiding/holding the work or tool action -->
    <path d="M-45 35 C-45 25 -30 20 -20 25" stroke="#F6BD60" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>