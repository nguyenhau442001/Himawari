<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative cognitive mesh/dots representing mental processing -->
  <g fill="#2A2F3D" opacity="0.6">
    <circle cx="50" cy="60" r="2"/>
    <circle cx="70" cy="40" r="1.5"/>
    <circle cx="190" cy="70" r="2"/>
    <circle cx="210" cy="100" r="1.5"/>
    <circle cx="40" cy="180" r="1.5"/>
    <circle cx="200" cy="190" r="2"/>
    <!-- Connecting dashed cognitive lines -->
    <path d="M50 60 L70 40 L90 50" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <path d="M190 70 L210 100" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
  </g>

  <!-- Central Dynamic Interaction: Human Action / Verb (疑惑 - Doubt/Puzzlement) -->
  <g id="character-and-speech-interaction">
    <!-- Sound wave / statement source coming from the left/off-screen ("他的话...") -->
    <g transform="translate(15, 120)">
      <path d="M0 0 C 10 -15, 10 15, 0 0" stroke="#6C7A9C" stroke-width="2" fill="none" opacity="0.4"/>
      <path d="M8 -8 C 15 -20, 15 20, 8 8" stroke="#6C7A9C" stroke-width="2.5" fill="none" opacity="0.7"/>
      <path d="M16 -16 C 25 -30, 25 30, 16 16" stroke="#FFA726" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Character Torso & Shoulders -->
    <path d="M 75 195 C 75 165, 100 155, 120 155 C 140 155, 165 165, 165 195 Z" fill="#2C3E50"/>
    
    <!-- Character Neck -->
    <rect x="110" y="135" width="20" height="25" fill="#E0AC9D"/>

    <!-- Character Head -->
    <circle cx="120" cy="115" r="28" fill="#E0AC9D"/>

    <!-- Hair (Modern flat style) -->
    <path d="M 92 110 C 92 92, 105 85, 120 85 C 135 85, 148 92, 148 115 L 148 122 L 140 120 C 135 100, 110 100, 100 120 Z" fill="#3E2723"/>

    <!-- Puzzled Facial Expression (Dynamic interaction with statement) -->
    <!-- Eyebrows in asymmetric skeptical/confused angle -->
    <path d="M 104 103 L 114 107" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 126 105 L 136 100" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Eyes (looking slightly up and right, deep thought) -->
    <circle cx="110" cy="113" r="2.5" fill="#3E2723"/>
    <circle cx="130" cy="111" r="2.5" fill="#3E2723"/>

    <!-- Mouth in slight hesitation/puzzlement (asymmetric flat line) -->
    <path d="M 115 127 Q 120 124 125 127" stroke="#3E2723" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Hand interacting with chin (Classic gesture of doubt/puzzlement: 疑惑) -->
    <!-- Arm/Hand rising up to chin -->
    <path d="M 140 170 C 145 150, 135 130, 125 124" stroke="#E0AC9D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 140 170 C 145 150, 135 130, 125 124" stroke="#2C3E50" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="25 40"/> <!-- sleeve/arm separation -->
    <!-- Hand Palm & Fingers touching chin -->
    <circle cx="123" cy="122" r="8" fill="#E0AC9D"/>
    
    <!-- Motion lines near the head showing sudden realization/doubt process -->
    <path d="M 152 95 Q 160 90 155 85" stroke="#FFA726" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 157 105 Q 168 102 163 95" stroke="#FFA726" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Conceptual Focus: Glowing/Accent Question Marks and Thought Matrix (Semantic focus: 疑惑) -->
  <g id="puzzlement-elements">
    <!-- Large prominent golden question mark hovering above, representing the core concept -->
    <path d="M 155 60 C 155 45, 175 42, 175 58 C 175 70, 160 72, 160 85" stroke="#FFA726" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="102" r="3.5" fill="#FFA726"/>

    <!-- Secondary smaller floating abstract question marks / nodes -->
    <g opacity="0.5">
      <path d="M 85 80 C 85 73, 95 71, 95 79 C 95 85, 88 86, 88 93" stroke="#6C7A9C" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="88" cy="101" r="2" fill="#6C7A9C"/>
    </g>

    <g opacity="0.3">
      <path d="M 110 45 C 110 40, 118 39, 118 46 C 118 51, 112 52, 112 57" stroke="#6C7A9C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="112" cy="63" r="1.5" fill="#6C7A9C"/>
    </g>
  </g>

  <!-- Subtle floor shadow / grounding -->
  <ellipse cx="120" cy="210" rx="55" ry="6" fill="#13151A"/>
</svg>