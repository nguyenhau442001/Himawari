<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: subtle ambient lighting rays/glow indicating focus and aesthetic appeal -->
  <circle cx="120" cy="115" r="75" fill="#2D323E" opacity="0.4"/>
  <path d="M120 35 L127 55 L147 52 L133 67 L142 85 L120 75 L98 85 L107 67 L93 52 L113 55 Z" fill="#F59E0B" opacity="0.12"/>
  <circle cx="175" cy="70" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="65" cy="160" r="2" fill="#F59E0B" opacity="0.6"/>
  <circle cx="165" cy="170" r="2.5" fill="#F59E0B" opacity="0.5"/>

  <!-- Adjective Visual Contrast: Ordinary/Dull shoe (small, grayscale) vs. Magnificent/Attractive leather shoe (large, high-contrast, polished, glowing accent) -->
  
  <!-- Left/Back: Dull/Plain Shoe (Representing baseline/average) -->
  <g transform="translate(42, 115) scale(0.65)" opacity="0.4">
    <!-- Sole -->
    <path d="M10 50 L85 50 C95 50 100 44 95 40 L15 40 C8 40 5 46 10 50 Z" fill="#64748B"/>
    <!-- Shoe Upper -->
    <path d="M15 40 C15 25 35 15 65 20 C85 23 92 35 95 40 L15 40 Z" fill="#475569"/>
    <!-- Plain laces -->
    <line x1="45" y1="22" x2="55" y2="30" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="55" y1="20" x2="65" y2="28" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right/Front: "Hǎokàn" (Attractive, Beautiful, Handsome) - Sleek, stylish leather shoe, exaggerated scale, vibrant gloss & gold accents -->
  <g transform="translate(80, 75)">
    <!-- Soft glowing aura behind the main object to emphasize "Hǎokàn" (appealing/striking quality) -->
    <ellipse cx="65" cy="55" r="50" fill="#F59E0B" opacity="0.15"/>
    <ellipse cx="65" cy="55" r="35" fill="#F59E0B" opacity="0.2"/>

    <!-- Main Leather Shoe (Derby/Oxford style) -->
    <!-- Shadow beneath -->
    <ellipse cx="65" cy="95" rx="55" ry="8" fill="#0F1115" opacity="0.6"/>

    <!-- Sole with layered welt -->
    <path d="M8 82 L112 82 C124 82 130 73 120 68 L16 68 C6 68 2 76 8 82 Z" fill="#B45309"/>
    <path d="M10 78 L110 78 C118 78 122 72 115 69 L15 69 C8 69 6 74 10 78 Z" fill="#D97706"/>

    <!-- Shoe Upper Body (Rich dark navy/slate leather base) -->
    <path d="M16 69 C16 48 42 32 75 35 C102 37 116 55 120 68 L16 69 Z" fill="#1E293B"/>
    
    <!-- Premium gloss highlight on toe cap -->
    <path d="M16 69 C16 48 42 32 75 35 C88 36 98 42 104 50 C80 50 55 58 40 69 Z" fill="#334155"/>
    <path d="M22 65 C22 52 38 40 60 38 C42 42 28 52 24 65 Z" fill="#64748B" opacity="0.4"/>

    <!-- Cap-toe stitching detail -->
    <path d="M38 42 C38 42 42 55 40 69" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2,2" fill="none" opacity="0.7"/>

    <!-- Lacing area & Eyelets -->
    <path d="M72 37 L95 44 L92 56 L68 48 Z" fill="#0F172A"/>
    <circle cx="78" cy="42" r="1.5" fill="#F59E0B"/>
    <circle cx="84" cy="44" r="1.5" fill="#F59E0B"/>
    <circle cx="90" cy="46" r="1.5" fill="#F59E0B"/>
    
    <!-- Elegant Gold Laces tied neatly -->
    <path d="M78 42 C75 35 68 32 65 38 C62 44 72 45 70 41" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M90 46 C95 38 102 36 100 42 C98 48 88 47 92 43" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sleek Specular Highlights (The "Look" / Aesthetic Appeal indicator) -->
    <path d="M30 52 C45 45 65 44 80 48" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M25 58 C35 55 50 54 60 57" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Sparkle / Aesthetic indicator star floating near the shoe -->
    <g transform="translate(105, 30)">
      <path d="M0 -8 C0 -2 2 0 8 0 C2 0 0 2 0 8 C0 2 -2 0 -8 0 C-2 0 0 -2 0 -8 Z" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(25, 25) scale(0.6)">
      <path d="M0 -8 C0 -2 2 0 8 0 C2 0 0 2 0 8 C0 2 -2 0 -8 0 C-2 0 0 -2 0 -8 Z" fill="#F59E0B" opacity="0.8"/>
    </g>
  </g>

</svg>