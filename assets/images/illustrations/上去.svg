<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Motion lines indicating upward movement -->
  <g opacity="0.4" stroke-linecap="round" stroke-width="2">
    <line x1="165" y1="110" x2="165" y2="85" stroke="#F59E0B" stroke-dasharray="3 3"/>
    <line x1="185" y1="120" x2="185" y2="90" stroke="#F59E0B" stroke-dasharray="3 3"/>
  </g>

  <!-- Wall/Surface representing context ("请把图片粘贴上去") -->
  <rect x="50" y="45" width="140" height="150" rx="4" fill="#252A34" stroke="#374151" stroke-width="2"/>
  <rect x="65" y="60" width="110" height="120" rx="2" fill="#1F242D" opacity="0.6"/>

  <!-- Target Outline on the wall (where the image goes UP to) -->
  <rect x="90" y="75" width="60" height="45" rx="3" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- The Image/Photo being moved UP -->
  <g transform="translate(0, -10)">
    <!-- Photo Shadow -->
    <rect x="92" y="137" width="56" height="41" rx="3" fill="#000000" opacity="0.3"/>
    <!-- Photo Body -->
    <rect x="90" y="135" width="56" height="41" rx="3" fill="#3B82F6"/>
    <!-- Photo Landscape Detail (Mountain/Sun inside photo) -->
    <circle cx="103" cy="147" r="4" fill="#FBBF24"/>
    <path d="M 90 168 L 105 152 L 120 168 L 135 155 L 146 168 Z" fill="#60A5FA"/>
  </g>

  <!-- Upward Arrow indicator showing action "上去" -->
  <g fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 118 122 L 118 95"/>
    <path d="M 110 103 L 118 95 L 126 103"/>
  </g>

  <!-- Human Hand interacting to push/stick the image up -->
  <g>
    <!-- Arm -->
    <path d="M 120 180 C 120 165 115 150 115 140" fill="none" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand -->
    <path d="M 110 142 C 110 137 115 135 118 135 C 122 135 125 138 125 142 Z" fill="#D1D5DB"/>
    <!-- Fingers pressing the photo up -->
    <rect x="110" y="135" width="16" height="8" rx="2" fill="#E5E7EB"/>
  </g>

</svg>