<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Light / Sunset Glow -->
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="backpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Binoculars Gradient -->
    <linearGradient id="binoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Sparkle / Insight Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- SCENE BACKGROUND: Travel / Mountain Overlook Setting -->
  <!-- Distant Sun / Glow -->
  <circle cx="160" cy="90" r="45" fill="url(#sunGlow)" filter="url(#glow)"/>
  <circle cx="160" cy="90" r="25" fill="#fef08a" opacity="0.6"/>

  <!-- Distant Mountains -->
  <path d="M 0 160 L 50 110 L 110 150 L 170 100 L 240 140 L 240 240 L 0 240 Z" fill="url(#mountainFar)"/>

  <!-- Near Mountains / Cliff Edge -->
  <path d="M 0 180 L 70 140 L 130 175 L 200 135 L 240 160 L 240 240 L 0 240 Z" fill="url(#mountainNear)"/>

  <!-- Travel / Environment Props: Wooden Lookouts / Railing & Map -->
  <!-- Wooden Viewing Platform Edge -->
  <path d="M 20 240 L 20 205 L 220 205 L 220 240 Z" fill="#b45309"/>
  <path d="M 15 205 L 225 205 L 225 212 L 15 212 Z" fill="#d97706"/>
  <!-- Wooden Support Beams -->
  <rect x="40" y="212" width="12" height="28" fill="#78350f"/>
  <rect x="180" y="212" width="12" height="28" fill="#78350f"/>

  <!-- Travel Compass / Map Prop resting on railing -->
  <g transform="translate(185, 190)">
    <circle cx="12" cy="12" r="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <polygon points="12,4 15,12 12,20 9,12" fill="#ef4444"/>
    <polygon points="12,20 15,12 12,4 9,12" fill="#94a3b8"/>
  </g>

  <!-- CAMPING TENT (Context Prop in background) -->
  <g transform="translate(35, 150)">
    <polygon points="25,0 0,40 50,40" fill="#f43f5e"/>
    <polygon points="25,0 50,40 38,40" fill="#be123c"/>
    <polygon points="21,15 29,15 27,40 23,40" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- MAIN CHARACTER: Young Traveler / Explorer experiencing new sights -->
  <g transform="translate(85, 105)">
    <!-- Backpack -->
    <path d="M -15 35 Q -25 45 -22 75 L -5 80 L -2 40 Z" fill="url(#backpackGrad)"/>
    <rect x="-24" y="55" width="4" height="12" rx="2" fill="#c2410c"/>

    <!-- Body / Torso in Jacket -->
    <path d="M -15 35 L 15 35 L 20 85 L -20 85 Z" fill="url(#jacketGrad)"/>
    <!-- Jacket Zipper & Details -->
    <line x1="0" y1="35" x2="0" y2="85" stroke="#0369a1" stroke-width="2"/>
    <path d="M -15 45 L -20 55" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 45 L 20 55" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Neck & Head -->
    <rect x="-5" y="24" width="10" height="13" fill="#fbcfe8"/>
    <!-- Scarf -->
    <path d="M -12 32 Q 0 38 12 32 L 15 38 Q 0 44 -12 38 Z" fill="#ec4899"/>

    <!-- Head & Hair -->
    <circle cx="0" cy="14" r="15" fill="#fbcfe8"/>
    <!-- Hair Style -->
    <path d="M -15 10 Q -18 -2 0 -2 Q 16 -2 15 12 Q 10 5 0 6 Q -10 5 -15 10 Z" fill="#1e293b"/>
    <!-- Friendly Happy Expression -->
    <circle cx="-4" cy="13" r="1.5" fill="#1e293b"/>
    <circle cx="5" cy="13" r="1.5" fill="#1e293b"/>
    <path d="M -2 18 Q 0 21 3 18" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Raised Arms holding Binoculars -->
    <!-- Left Arm -->
    <path d="M -12 38 L -22 25 L -15 20" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm -->
    <path d="M 12 38 L 22 25 L 15 20" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Binoculars up to eyes -->
    <g transform="translate(-8, 10) rotate(-10)">
      <rect x="0" y="0" width="18" height="10" rx="3" fill="url(#binoGrad)"/>
      <circle cx="4" cy="5" r="4" fill="#38bdf8"/>
      <circle cx="14" cy="5" r="4" fill="#38bdf8"/>
    </g>
  </g>

  <!-- SECOND CHARACTER (Friend sharing the experience / broadening horizons together) -->
  <g transform="translate(135, 115)">
    <!-- Body -->
    <path d="M -12 30 L 12 30 L 16 75 L -16 75 Z" fill="#10b981"/>
    <!-- Neck & Head -->
    <rect x="-4" y="20" width="8" height="12" fill="#fed7aa"/>
    <circle cx="0" cy="10" r="13" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M -13 6 Q 0 -4 13 6 Q 10 2 0 1 Q -10 2 -13 6 Z" fill="#78350f"/>
    <!-- Expression / Pointing -->
    <circle cx="-3" cy="9" r="1.2" fill="#1e293b"/>
    <circle cx="4" cy="9" r="1.2" fill="#1e293b"/>
    <path d="M -1 14 Q 1 17 3 14" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Pointing Arm toward the horizon (signifying discovery & new knowledge/insight) -->
    <path d="M 10 35 L 25 20 L 35 18" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SPARKLES / INSIGHT / HORIZON EXPANSION VISUAL METAPHORS -->
  <!-- Glowing Floating Sparkles symbolizing "见识" (growing wisdom/broadened horizons) -->
  <g fill="#fde047" filter="url(#glow)">
    <!-- Sparkle 1 -->
    <path d="M 190 60 Q 190 70 200 70 Q 190 70 190 80 Q 190 70 180 70 Q 190 70 190 60 Z"/>
    <!-- Sparkle 2 -->
    <path d="M 110 50 Q 110 56 116 56 Q 110 56 110 62 Q 110 56 104 56 Q 110 56 110 50 Z"/>
    <!-- Sparkle 3 -->
    <path d="M 70 80 Q 70 84 74 84 Q 70 84 70 88 Q 70 84 66 84 Q 70 84 70 80 Z"/>
  </g>

  <!-- Small floating birds in distance for realism and depth -->
  <path d="M 70 50 Q 73 46 76 50 Q 79 46 82 50" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 85 43 Q 87 40 89 43 Q 91 40 93 43" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
</svg>