<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="counterWarmth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
    <clipPath id="windowClip">
      <path d="M 20 20 L 100 20 L 100 130 L 20 130 Z" />
    </clipPath>
  </defs>

  <!-- Background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- WALL & INTERIOR ENVIRONMENT (Travel Agency / Ticket Counter in Off-Season) -->
  <!-- Ambient lighting backdrop -->
  <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z" fill="none" />
  
  <!-- Large Window showing peaceful, empty off-season tourist beach scene -->
  <g clip-path="url(#windowClip)">
    <rect x="20" y="20" width="80" height="110" fill="#0284c7" />
    <!-- Sky & Sun -->
    <circle cx="60" cy="55" r="14" fill="#fbbf24" opacity="0.8" />
    <!-- Calm Sea -->
    <path d="M 20 85 Q 60 80 100 85 L 100 130 L 20 130 Z" fill="#0284c7" />
    <!-- Empty Beach & Palm Tree (symbolizing lonely off-season resort) -->
    <path d="M 20 105 Q 60 95 100 105 L 100 130 L 20 130 Z" fill="#fde047" opacity="0.4" />
    <!-- Palm Trunk -->
    <path d="M 85 110 Q 82 85 88 70" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Palm Leaves -->
    <path d="M 88 70 Q 75 60 65 65 M 88 70 Q 95 58 105 63 M 88 70 Q 90 55 85 50" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Lone Seagull -->
    <path d="M 35 45 Q 40 40 45 45 Q 50 40 55 45" stroke="#f1f5f9" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Window Frame -->
  <rect x="20" y="20" width="80" height="110" fill="none" stroke="#475569" stroke-width="4" />
  <!-- Vertical window pane divider -->
  <line x1="60" y1="20" x2="60" y2="130" stroke="#475569" stroke-width="3" />
  <!-- Horizontal window pane divider -->
  <line x1="20" y1="75" x2="100" y2="75" stroke="#475569" stroke-width="3" />

  <!-- Travel Agency Interior Wall Decor & Calendar -->
  <rect x="190" y="30" width="30" height="38" rx="2" fill="#e2e8f0" />
  <rect x="195" y="35" width="20" height="6" rx="1" fill="#ef4444" />
  <line x1="195" y1="46" x2="215" y2="46" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="195" y1="52" x2="210" y2="52" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="195" y1="58" x2="212" y2="58" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Desk / Counter Structure -->
  <!-- Counter front panel -->
  <path d="M 10 160 L 230 160 L 220 220 L 20 220 Z" fill="url(#counterWarmth)" />
  <!-- Counter top surface -->
  <path d="M 0 150 L 240 150 L 230 160 L 10 160 Z" fill="url(#deskWood)" />
  <!-- Counter edge highlight -->
  <line x1="0" y1="150" x2="240" y2="150" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />

  <!-- Props on Counter & Background -->
  <!-- Computer monitor showing empty booking chart (flat lines) -->
  <rect x="155" y="95" width="45" height="32" rx="3" fill="#334155" />
  <rect x="158" y="98" width="39" height="23" fill="#0f172a" />
  <!-- Flat flatline chart on screen (symbolizing zero/low bookings) -->
  <polyline points="163,115 173,115 183,115 193,115" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Monitor stand -->
  <rect x="171" y="127" width="13" height="4" fill="#64748b" />
  <path d="M 166 131 L 186 131" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Stack of unused brochures -->
  <g transform="translate(115, 135)">
    <polygon points="0,15 25,10 30,22 5,27" fill="#38bdf8" />
    <polygon points="2,12 27,7 32,19 7,24" fill="#0284c7" />
    <polygon points="4,9 29,4 34,16 9,21" fill="#7dd3fc" />
  </g>

  <!-- Cute potted plant adding life to the quiet desk -->
  <path d="M 205 135 L 220 135 L 217 150 L 208 150 Z" fill="#f43f5e" />
  <path d="M 212 135 Q 212 120 205 115" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 213 135 Q 218 122 225 120" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="205" cy="115" r="5" fill="#4ade80" />
  <circle cx="225" cy="120" r="5" fill="#4ade80" />

  <!-- CHARACTER: Travel Agent leaning on the counter, bored/relaxed, resting chin on hand -->
  <g transform="translate(60, 80)">
    <!-- Body / Torso -->
    <path d="M 35 75 Q 45 55 65 55 Q 85 55 95 75 L 105 100 L 25 100 Z" fill="#38bdf8" />
    <!-- Shirt collar -->
    <polygon points="65,55 58,68 72,68" fill="#f8fafc" />
    
    <!-- Neck -->
    <rect x="58" y="44" width="14" height="14" rx="4" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="65" cy="32" r="18" fill="#fbcfe8" />
    <!-- Hair (Stylish modern neat cut) -->
    <path d="M 47 32 Q 46 15 65 15 Q 84 15 83 32 Q 80 20 65 20 Q 50 20 47 32 Z" fill="#1e293b" />
    <path d="M 78 27 Q 85 30 83 38" fill="#1e293b" />

    <!-- Face details (Relaxed, slightly bored expression) -->
    <!-- Closed / relaxed eyes -->
    <path d="M 57 32 Q 60 35 63 32" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 69 32 Q 72 35 75 32" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Gentle calm mouth -->
    <path d="M 63 40 Q 65 42 67 40" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="56" cy="37" r="3" fill="#fda4af" opacity="0.6" />
    <circle cx="74" cy="37" r="3" fill="#fda4af" opacity="0.6" />

    <!-- Arms & Hands supporting chin -->
    <!-- Left Arm (resting flat) -->
    <path d="M 35 75 Q 25 70 20 85" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Right Arm (bent up to support head) -->
    <path d="M 85 75 Q 80 50 72 42" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
    <!-- Hand supporting chin -->
    <circle cx="68" cy="40" r="7" fill="#fbcfe8" />
  </g>

  <!-- Foreground Atmospheric Elements (Dust motes or lighting ambiance) -->
  <circle cx="130" cy="90" r="1.5" fill="#fbbf24" opacity="0.5" />
  <circle cx="145" cy="70" r="1" fill="#fbbf24" opacity="0.4" />
  <circle cx="110" cy="65" r="2" fill="#fbbf24" opacity="0.3" />
  <circle cx="160" cy="50" r="1.5" fill="#fbbf24" opacity="0.6" />

  <!-- Subtle floor shadow under the counter base -->
  <rect x="15" y="215" width="210" height="8" rx="4" fill="#090d16" opacity="0.6" />
</svg>