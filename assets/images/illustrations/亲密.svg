<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Character 1 Shading -->
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Shading -->
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background Context -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" opacity="0.6"/>
  
  <!-- Window with Night View & Stars -->
  <g transform="translate(145, 30)">
    <rect width="65" height="85" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="53" height="73" rx="3" fill="url(#nightSky)"/>
    <!-- Tiny Stars -->
    <circle cx="15" cy="20" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="45" cy="35" r="1.5" fill="#fde047" opacity="0.9"/>
    <circle cx="25" cy="60" r="1" fill="#ffffff" opacity="0.6"/>
    <!-- Crescent Moon -->
    <path d="M 48 18 A 8 8 0 0 1 40 26 A 8 8 0 0 0 48 18 Z" fill="#fef08a"/>
    <!-- Window Frame Grid -->
    <line x1="32" y1="6" x2="32" y2="79" stroke="#334155" stroke-width="2"/>
    <line x1="6" y1="42" x2="59" y2="42" stroke="#334155" stroke-width="2"/>
    <!-- Cute Curtains -->
    <path d="M 6 6 Q 15 20 6 35 Z" fill="#475569" opacity="0.5"/>
    <path d="M 59 6 Q 50 20 59 35 Z" fill="#475569" opacity="0.5"/>
  </g>

  <!-- Bookshelf Background Prop -->
  <g transform="translate(25, 35)">
    <rect width="35" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Shelves & Books -->
    <line x1="0" y1="25" x2="35" y2="25" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="35" y2="50" stroke="#334155" stroke-width="1.5"/>
    <!-- Colorful book spines -->
    <rect x="5" y="8" width="5" height="17" rx="1" fill="#f97316"/>
    <rect x="11" y="10" width="6" height="15" rx="1" fill="#10b981"/>
    <rect x="18" y="7" width="4" height="18" rx="1" fill="#8b5cf6"/>
    <rect x="5" y="32" width="7" height="18" rx="1" fill="#ec4899"/>
    <rect x="13" y="35" width="5" height="15" rx="1" fill="#38bdf8"/>
    <rect x="22" y="30" width="8" height="20" rx="1" fill="#eab308"/>
  </g>

  <!-- Hanging Warm Lamp -->
  <circle cx="110" cy="50" r="45" fill="url(#lampGlow)" />
  <path d="M 110 0 L 110 25" stroke="#475569" stroke-width="2" />
  <path d="M 95 25 L 125 25 L 130 35 L 90 35 Z" fill="#64748b" />
  <circle cx="110" cy="37" r="4" fill="#fbbf24" />

  <!-- Wooden Floor & Sofa/Couch Base -->
  <rect x="20" y="170" width="200" height="40" fill="#090d16" />
  <!-- Cozy Couch / Bean Bag structure -->
  <path d="M 40 185 Q 120 150 200 185 L 210 205 Q 120 215 30 205 Z" fill="#334155" />
  <ellipse cx="120" cy="180" rx="75" ry="25" fill="#475569" />
  <!-- Cushion Highlights -->
  <ellipse cx="90" cy="178" rx="35" ry="15" fill="#64748b" opacity="0.5" />
  <ellipse cx="150" cy="178" rx="35" ry="15" fill="#64748b" opacity="0.5" />

  <!-- MAIN CHARACTERS: Two Close Friends (亲密) Sharing a Warm Moment -->
  <g id="close-friends">
    <!-- Character 1 (Left - Leaning in, laughing/smiling warmly) -->
    <g transform="translate(85, 115)">
      <!-- Body & Shirt -->
      <path d="M -15 30 C -15 15 -5 10 10 10 C 25 10 35 15 35 30 L 40 60 C 40 65 35 70 25 70 L -5 70 C -15 70 -20 65 -15 60 Z" fill="url(#shirt1)" />
      <!-- Collar -->
      <path d="M 0 10 L 10 22 L 20 10 Z" fill="#bae6fd" />
      
      <!-- Head & Hair -->
      <circle cx="10" cy="-5" r="16" fill="#fcd34d" /> <!-- Skin tone base -->
      <path d="M -5 -12 C -5 -22 25 -22 25 -12 C 25 -5 20 -3 20 -3 C 20 -3 15 -10 10 -10 C 5 -10 -2 -5 -5 -12 Z" fill="#334155" /> <!-- Stylish dark hair -->
      
      <!-- Warm Expressive Face (Close/Friendly Interaction) -->
      <!-- Smiling happy eyes (closed arches) -->
      <path d="M 3 -6 Q 6 -2 9 -6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 13 -6 Q 16 -2 19 -6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Rosy Cheeks -->
      <circle cx="5" cy="0" r="3" fill="#f43f5e" opacity="0.4" />
      <circle cx="17" cy="0" r="3" fill="#f43f5e" opacity="0.4" />
      <!-- Big Friendly Smile -->
      <path d="M 8 3 Q 11 8 14 3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Arm resting/leaning on friend -->
      <path d="M 25 25 C 35 25 42 35 48 45" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none" />
      <!-- Hand holding phone or shared warm object / gesture -->
      <circle cx="48" cy="46" r="5" fill="#fcd34d" />
    </g>

    <!-- Character 2 (Right - Leaning close, laughing together, bonded posture) -->
    <g transform="translate(135, 110)">
      <!-- Body & Shirt -->
      <path d="M -10 35 C -10 20 0 15 15 15 C 30 15 40 20 40 35 L 45 65 C 45 70 40 75 30 75 L 0 75 C -10 75 -15 70 -10 65 Z" fill="url(#shirt2)" />
      <!-- Collar -->
      <path d="M 10 15 L 18 25 L 26 15 Z" fill="#ffe4e6" />

      <!-- Head & Hair (Slightly tilted towards Character 1 for intimacy) -->
      <circle cx="15" cy="-2" r="16" fill="#fcd34d" />
      <!-- Hair -->
      <path d="M 0 -8 C 0 -20 30 -20 30 -8 C 30 -2 25 0 25 0 C 25 0 20 -6 15 -6 C 10 -6 3 0 0 -8 Z" fill="#78350f" />
      <circle cx="28" cy="-2" r="4" fill="#78350f" /> <!-- Ponytail or bun accent -->

      <!-- Face -->
      <!-- Joyful closed eyes -->
      <path d="M 9 -3 Q 12 1 15 -3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 18 -3 Q 21 1 24 -3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Cheeks -->
      <circle cx="11" cy="3" r="3" fill="#fb7185" opacity="0.5" />
      <circle cx="22" cy="3" r="3" fill="#fb7185" opacity="0.5" />
      <!-- Happy Open Smile -->
      <path d="M 13 6 Q 16.5 10 20 6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="#1e293b" />

      <!-- Arm around friend / shared interaction -->
      <path d="M -5 30 C -15 35 -20 40 -25 48" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none" />
      <circle cx="-26" cy="50" r="5" fill="#fcd34d" />
    </g>

    <!-- Shared Smartphone / Photo Frame Showing Connection -->
    <g transform="translate(108, 142) rotate(-10)">
      <rect width="26" height="34" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <rect x="3" y="3" width="20" height="24" rx="2" fill="#38bdf8" />
      <!-- Mini abstract scenery inside phone screen representing shared happy memories -->
      <circle cx="13" cy="12" r="5" fill="#fef08a" />
      <path d="M 3 20 Q 8 15 13 20 Q 18 25 23 20 L 23 27 L 3 27 Z" fill="#10b981" />
      <!-- Home bar -->
      <line x1="9" y1="30" x2="17" y2="30" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Foreground Atmospheric Details (Warm Motes / Cozy Vibe) -->
  <g opacity="0.6">
    <circle cx="60" cy="90" r="2" fill="#fde047" />
    <circle cx="180" cy="80" r="1.5" fill="#fde047" />
    <circle cx="45" cy="140" r="2.5" fill="#fde047" opacity="0.4" />
    <circle cx="195" cy="130" r="2" fill="#fde047" opacity="0.5" />
    <circle cx="100" cy="105" r="1" fill="#ffffff" />
  </g>

  <!-- Coffee Table with Mugs in Foreground Context -->
  <g transform="translate(85, 195)">
    <!-- Table Surface -->
    <ellipse cx="35" cy="12" rx="45" ry="12" fill="#334155" />
    <ellipse cx="35" cy="10" rx="43" ry="10" fill="#1e293b" />
    
    <!-- Cozy Mugs -->
    <!-- Mug 1 -->
    <rect x="15" y="2" width="10" height="12" rx="2" fill="#f43f5e" />
    <path d="M 25 5 C 28 5 28 10 25 11" stroke="#f43f5e" stroke-width="1.5" fill="none" />
    <!-- Steam wisp -->
    <path d="M 18 -1 Q 20 -4 18 -7" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Mug 2 -->
    <rect x="45" y="3" width="10" height="12" rx="2" fill="#38bdf8" />
    <path d="M 45 6 C 42 6 42 11 45 12" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <!-- Steam wisp -->
    <path d="M 49 0 Q 51 -3 49 -6" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>