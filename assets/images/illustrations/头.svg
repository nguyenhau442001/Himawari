<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Exterior Cold Night -->
  <path d="M0 120 L240 120 L240 240 L0 240 Z" fill="#1e293b"/>
  <circle cx="200" cy="40" r="20" fill="#f8fafc" opacity="0.3"/>
  
  <!-- House Interior (The "里头") -->
  <rect x="40" y="60" width="160" height="150" rx="8" fill="#334155"/>
  <rect x="50" y="70" width="140" height="130" rx="4" fill="#fef3c7"/>
  
  <!-- Warm Glow Effect -->
  <circle cx="120" cy="135" r="60" fill="#fbbf24" opacity="0.15"/>
  
  <!-- Characters -->
  <!-- Person inside (Welcoming) -->
  <g transform="translate(140, 110)">
    <circle cx="0" cy="0" r="12" fill="#fb923c"/>
    <path d="M-10 15 Q0 25 10 15 L5 40 L-5 40 Z" fill="#fb923c"/>
    <path d="M-15 10 L-25 5 M15 10 L25 5" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Person outside (Entering) -->
  <g transform="translate(70, 130)">
    <circle cx="0" cy="0" r="12" fill="#38bdf8"/>
    <path d="M-10 15 Q0 25 10 15 L5 40 L-5 40 Z" fill="#38bdf8"/>
    <path d="M-5 5 L-15 15 M5 5 L15 15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Door Frame -->
  <rect x="100" y="100" width="40" height="100" fill="#1e293b"/>
  <rect x="105" y="105" width="30" height="95" fill="#334155"/>
  
  <!-- Decor Details -->
  <rect x="50" y="80" width="20" height="40" fill="#fbbf24" opacity="0.2"/>
  <rect x="170" y="80" width="20" height="40" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Snowflakes outside -->
  <circle cx="30" cy="150" r="2" fill="#e2e8f0"/>
  <circle cx="20" cy="180" r="1.5" fill="#e2e8f0"/>
  <circle cx="220" cy="160" r="2" fill="#e2e8f0"/>
</svg>