  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 180 C 80 170, 160 170, 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Scientist -->
  <g transform="translate(60, 80)">
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <path d="M30 45 L50 45 L45 100 L35 100 Z" fill="#38bdf8"/>
    <path d="M25 50 L35 70 L45 70 L55 50" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="35" y="95" width="10" height="20" rx="2" fill="#475569"/>
  </g>
  
  <!-- Action: Collecting Sample -->
  <g transform="translate(130, 140)">
    <path d="M0 0 L20 -30 L25 -25 L5 5 Z" fill="#fb923c"/>
    <circle cx="22" cy="-28" r="8" fill="#10b981"/>
