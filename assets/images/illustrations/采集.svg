  </g>
  
  <!-- Environment: Nature/Field -->
  <circle cx="180" cy="190" r="15" fill="#10b981" opacity="0.3"/>
  <circle cx="200" cy="200" r="10" fill="#10b981" opacity="0.5"/>
  <path d="M190 190 L195 170 M195 190 L200 175" stroke="#10b981" stroke-width="2"/>
  
  <!-- Tools/Equipment -->
  <rect x="150" y="100" width="40" height="50" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="160" y="110" width="20" height="10" rx="2" fill="#ec4899"/>
  <rect x="160" y="125" width="20" height="10" rx="2" fill="#fbbf24"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="140" cy="140" r="40" fill="#f59e0b" opacity="0.05"/>
