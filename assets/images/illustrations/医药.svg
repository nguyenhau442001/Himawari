<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Glow Effect Background -->
    <circle cx="0" cy="0" r="65" fill="#2563EB" opacity="0.15" filter="blur(10px)" />
    
    <!-- Medical Cross Background Badge -->
    <path d="M-30,-50 L30,-50 C41,-50 50,-41 50,-30 L50,30 C50,41 41,50 30,50 L-30,50 C-41,50 -50,41 -50,30 L-50,-30 C-50,-41 -41,-50 -30,-50 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- Red Cross Symbol -->
    <path d="M-10,-32 H10 V-10 H32 V10 H10 V32 H-10 V10 H-32 V-10 H-10 Z" fill="#EF4444" opacity="0.9"/>
    <path d="M-6,-24 H6 V-6 H24 V6 H6 V24 H-6 V6 H-24 V-6 H-6 Z" fill="#F87171"/>

    <!-- Medicine Bottle / Vial (Yào - 药) -->
    <g transform="translate(-45, -5)">
      <!-- Vial Body -->
      <path d="M-14,10 C-14,3 -12,-2 -5,-5 V-18 C-5,-21 5,-21 5,-18 V-5 C12,-2 14,3 14,10 V32 C14,36 10,40 5,40 H-5 C-10,40 -14,36 -14,32 Z" fill="#38BDF8" opacity="0.9"/>
      <!-- Vial Neck & Cap -->
      <rect x="-6" y="-23" width="12" height="5" rx="1.5" fill="#94A3B8"/>
      <rect x="-8" y="-27" width="16" height="4" rx="2" fill="#E2E8F0"/>
      <!-- Liquid Inside -->
      <path d="M-12,14 C-7,12 -3,18 2,14 C7,10 10,15 12,18 V31 C12,35 9,37 5,37 H-5 C-9,37 -12,35 -12,31 Z" fill="#0284C7"/>
      <!-- Highlight -->
      <path d="M-10,12 C-10,8 -8,4 -4,0" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Medical Pestle & Mortar / Healthcare (Yī - 医) -->
    <g transform="translate(42, -5)">
      <!-- Mortar Base -->
      <path d="M-22,-4 C-20,16 -12,28 0,28 C12,28 20,16 22,-4 Z" fill="#F59E0B"/>
      <!-- Mortar Rim -->
      <ellipse cx="0" cy="-4" rx="23" ry="7" fill="#FBBF24"/>
      <!-- Inner Bowl -->
      <ellipse cx="0" cy="-4" rx="18" ry="4" fill="#D97706"/>
      <!-- Pestle -->
      <path d="M6,-32 L18,-10 C18,-10 14,-6 8,-12 L-4,-30 C-7,-34 -2,-38 6,-32 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Herbs/Leaves in Mortar -->
      <path d="M-6,-6 C-4,-12 2,-10 4,-5 C0,-3 -4,-2 -6,-6 Z" fill="#10B981"/>
      <path d="M2,-7 C6,-12 12,-8 10,-4 C6,-3 3,-4 2,-7 Z" fill="#34D399"/>
    </g>

    <!-- Floating Sparkles / Efficacy Indicators -->
    <circle cx="-15" cy="-55" r="3" fill="#38BDF8"/>
    <circle cx="25" cy="-45" r="2" fill="#F59E0B"/>
    <circle cx="55" cy="-25" r="2.5" fill="#34D399"/>
    <circle cx="-55" cy="15" r="2" fill="#F87171"/>
  </g>
</svg>