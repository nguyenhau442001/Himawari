<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle decorative background elements -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="120" cy="120" r="65" fill="#222733"/>

  <!-- Stylized Globe / Country representation -->
  <g transform="translate(120, 115)">
    <!-- Globe Base -->
    <circle cx="0" cy="0" r="50" fill="#2E384D"/>
    
    <!-- Continent Landmasses (Abstract vector shapes for modern flat aesthetic) -->
    <path d="M-30 -20 C-15 -35, 10 -40, 25 -25 C40 -10, 35, 15, 20, 30 C5, 45, -20, 35, -35, 15 C-45, 0, -45, -5, -30, -20 Z" fill="#3B82F6" opacity="0.3"/>
    <path d="M-25 -10 C-10 -25, 15 -25, 25 -10 C35, 5, 25, 25, 10, 30 C-5, 35, -15, 20, -25, 5 Z" fill="#10B981" opacity="0.4"/>
    
    <!-- Meridian and Latitude lines -->
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#4B5563" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="20" ry="50" fill="none" stroke="#4B5563" stroke-width="1.5" opacity="0.5"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#4B5563" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#4B5563" stroke-width="1.5" opacity="0.5"/>

    <!-- Outer ring for structure/modern design -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Architectural Landmark / Capital building symbol representing a nation -->
  <g transform="translate(120, 105)">
    <!-- Building Base -->
    <rect x="-22" y="15" width="44" height="25" fill="#F59E0B" rx="2"/>
    <!-- Pillars -->
    <rect x="-16" y="-5" width="4" height="22" fill="#FDE68A"/>
    <rect x="-8" y="-5" width="4" height="22" fill="#FDE68A"/>
    <rect x="4" y="-5" width="4" height="22" fill="#FDE68A"/>
    <rect x="12" y="-5" width="4" height="22" fill="#FDE68A"/>
    <!-- Roof / Pediment -->
    <polygon points="0,-22 26,-5 -26,-5" fill="#F59E0B"/>
    <polygon points="0,-26 28,-7 -28,-7" fill="#D97706" opacity="0.4"/>
    <!-- Doorway cutouts -->
    <rect x="-4" y="23" width="8" height="17" fill="#1A1D24" rx="4"/>
  </g>

  <!-- Focus Pin / Location Marker on top representing territory/country -->
  <g transform="translate(120, 48)">
    <path d="M0 -12 C-7 -12 -12 -7 -12 0 C-12 8, 0 18, 0 18 C0 18, 12 8, 12 0 C12 -7, 7 -12, 0 -12 Z" fill="#EF4444"/>
    <circle cx="0" cy="-1" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Ground reflection/shadow -->
  <ellipse cx="120" cy="180" rx="45" ry="6" fill="#111318"/>
</svg>