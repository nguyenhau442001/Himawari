<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient Glow for Dark Mode Focus -->
  <circle cx="120" cy="120" r="70" fill="#F59E0B" opacity="0.08" filter="blur(12px)"/>
  
  <!-- Subtle plate / surface -->
  <ellipse cx="120" cy="175" rx="75" ry="16" fill="#2A2E39" opacity="0.8"/>
  <ellipse cx="120" cy="172" rx="70" ry="13" fill="#323846"/>

  <!-- Mooncake Group -->
  <g transform="translate(120, 115)">
    <!-- Drop Shadow for Mooncake -->
    <ellipse cx="0" cy="42" rx="52" ry="12" fill="#000000" opacity="0.4"/>

    <!-- Main Body Base (Cylindrical shape) -->
    <path d="M -52 10 
             C -52 38, 52 38, 52 10 
             L 52 -15 
             C 52 -43, -52 -43, -52 -15 Z" 
          fill="#B45309"/>

    <!-- Side ridges/flutes of the traditional baked mooncake -->
    <!-- We can create a scalloped perimeter or vertical segments using shading -->
    <path d="M -52 -15 C -52 10, -52 25, -52 10" stroke="#92400E" stroke-width="2" fill="none"/>
    <path d="M 52 -15 C 52 10, 52 25, 52 10" stroke="#92400E" stroke-width="2" fill="none"/>

    <!-- Top Surface (Ellipse) -->
    <ellipse cx="0" cy="-15" rx="52" ry="24" fill="#D97706"/>

    <!-- Inner Decorative Ridge -->
    <ellipse cx="0" cy="-15" rx="44" ry="19" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Traditional Center Pattern (Lotus / Geometric motif) -->
    <!-- Outer petals -->
    <path d="M 0 -34 Q 10 -24 0 -14 Q -10 -24 0 -34 Z" fill="#B45309" opacity="0.85"/>
    <path d="M 0 4 Q 10 -6 0 -16 Q -10 -6 0 4 Z" fill="#B45309" opacity="0.85"/>
    <path d="M -22 -15 Q -12 -5 -2 -15 Q -12 -25 -22 -15 Z" fill="#B45309" opacity="0.85"/>
    <path d="M 22 -15 Q 12 -5 2 -15 Q 12 -25 22 -15 Z" fill="#B45309" opacity="0.85"/>

    <!-- Diagonal Petals -->
    <path d="M -15 -25 Q -5 -18 -10 -10 Q -20 -15 -15 -25 Z" fill="#B45309" opacity="0.85"/>
    <path d="M 15 -5 Q 5 -12 10 -20 Q 20 -15 15 -5 Z" fill="#B45309" opacity="0.85"/>
    <path d="M -15 -5 Q -5 -12 -10 -20 Q -20 -15 -15 -5 Z" fill="#B45309" opacity="0.85" transform="scale(1, -1) translate(0, -30)"/>
    
    <!-- Center Blossom Dot -->
    <circle cx="0" cy="-15" r="5" fill="#92400E"/>
    <circle cx="0" cy="-15" r="2" fill="#FDE68A"/>

    <!-- Highlight for glossy baked finish -->
    <path d="M -35 -27 C -20 -33, 20 -33, 35 -27 C 25 -36, -25 -36, -35 -27 Z" fill="#FDE68A" opacity="0.35"/>
  </g>
</svg>