<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements (snowflakes/stars) -->
  <g fill="#2A303C" opacity="0.6">
    <circle cx="45" cy="50" r="2" />
    <circle cx="195" cy="70" r="1.5" />
    <circle cx="210" cy="150" r="2" />
    <circle cx="35" cy="180" r="1.5" />
    <path d="M45,40 L45,46 M42,43 L48,43" stroke="#2A303C" stroke-width="1" stroke-linecap="round"/>
    <path d="M190,120 L190,126 M187,123 L193,123" stroke="#2A303C" stroke-width="1" stroke-linecap="round"/>
    <path d="M70,90 L70,94 M68,92 L72,92" stroke="#2A303C" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Snowy Mountain Slope Background -->
  <path d="M20,200 L220,130 L220,200 Z" fill="#242B38"/>
  
  <!-- Snow slope -->
  <path d="M0,130 L240,110 L240,240 L0,240 Z" fill="#222834"/>
  <path d="M0,130 Q120,115 240,110 L240,140 Q120,145 0,160 Z" fill="#E2E8F0" opacity="0.15"/>

  <!-- Skis (crossing diagonally, representing skiing) -->
  <g transform="rotate(-25 120 120)">
    <!-- Ski 1 -->
    <rect x="60" y="112" width="120" height="4" rx="2" fill="#E2E8F0"/>
    <path d="M175,114 Q185,114 190,111 L185,114 Z" fill="#E2E8F0"/>
    <!-- Ski binding 1 -->
    <rect x="110" y="110" width="16" height="8" rx="2" fill="#FF7043"/>
    
    <!-- Ski 2 -->
    <rect x="60" y="126" width="120" height="4" rx="2" fill="#CBD5E1"/>
    <path d="M175,128 Q185,128 190,125 L185,128 Z" fill="#CBD5E1"/>
    <!-- Ski binding 2 -->
    <rect x="110" y="124" width="16" height="8" rx="2" fill="#FF7043"/>
  </g>

  <!-- Ski Poles -->
  <g stroke-linecap="round" stroke-width="2.5">
    <!-- Pole 1 -->
    <line x1="70" y1="65" x2="160" y2="175" stroke="#94A3B8" />
    <circle cx="68" cy="63" r="3" fill="#FF7043"/>
    <path d="M154,171 L166,179" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Pole 2 -->
    <line x1="90" y1="55" x2="180" y2="165" stroke="#94A3B8" />
    <circle cx="88" cy="53" r="3" fill="#FF7043"/>
    <path d="M174,161 L186,169" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Central Dynamic Focus Accent (Snow splash / Motion particles) -->
  <g fill="#FF7043">
    <circle cx="100" cy="135" r="4" />
    <circle cx="85" cy="142" r="3" />
    <circle cx="115" cy="125" r="2.5" />
    <circle cx="75" cy="130" r="2" />
  </g>
</svg>