<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tier-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tier-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="tier-bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Workshop Background Elements -->
  <path d="M20 180 L220 180" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Ambient light from display shelves -->
  <path d="M40 70 L200 70 L220 180 L20 180 Z" fill="#38bdf8" opacity="0.03"/>

  <!-- Display Shelving Structure (Showing Grades/Tiers) -->
  <!-- Tier 3: Bronze Level Shelf (Bottom) -->
  <rect x="30" y="150" width="180" height="6" rx="3" fill="#475569"/>
  <!-- Tier 2: Silver Level Shelf (Middle) -->
  <rect x="40" y="115" width="160" height="6" rx="3" fill="#475569"/>
  <!-- Tier 1: Gold Level Shelf (Top) -->
  <rect x="50" y="80" width="140" height="6" rx="3" fill="#475569"/>

  <!-- PRODUCTS CATEGORIZED BY TIER (Different Product Models / Grades) -->
  
  <!-- Tier 1 Products (Gold/Premium Grade - Sleek Gadgets) -->
  <g transform="translate(0, -5)">
    <!-- Premium Item A -->
    <rect x="75" y="55" width="22" height="25" rx="4" fill="url(#tier-gold)" filter="url(#glow)"/>
    <circle cx="86" cy="67" r="4" fill="#fef3c7"/>
    <!-- Premium Item B -->
    <polygon points="120,53 132,80 108,80" fill="url(#tier-gold)" filter="url(#glow)"/>
    <circle cx="120" cy="68" r="3" fill="#fef3c7"/>
    <!-- Premium Item C -->
    <rect x="145" y="58" width="20" height="22" rx="10" fill="url(#tier-gold)" filter="url(#glow)"/>
  </g>

  <!-- Tier 2 Products (Silver/Standard Grade) -->
  <g transform="translate(0, 0)">
    <!-- Standard Item A -->
    <rect x="65" y="92" width="24" height="23" rx="3" fill="url(#tier-silver)"/>
    <path d="M70 100 L84 100" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Standard Item B -->
    <circle cx="120" cy="103" r="11" fill="url(#tier-silver)"/>
    <circle cx="120" cy="103" r="5" fill="#cbd5e1"/>
    <!-- Standard Item C -->
    <rect x="150" y="95" width="22" height="20" rx="3" fill="url(#tier-silver)"/>
  </g>

  <!-- Tier 3 Products (Bronze/Basic Grade) -->
  <g transform="translate(0, 5)">
    <!-- Basic Item A -->
    <rect x="55" y="128" width="20" height="22" rx="2" fill="url(#tier-bronze)"/>
    <!-- Basic Item B -->
    <rect x="90" y="130" width="26" height="20" rx="2" fill="url(#tier-bronze)"/>
    <path d="M96 136 L110 136" stroke="#ffedd5" stroke-width="2"/>
    <!-- Basic Item C -->
    <polygon points="150,150 166,150 158,130" fill="url(#tier-bronze)"/>
    <!-- Basic Item D -->
    <circle cx="180" cy="140" r="10" fill="url(#tier-bronze)"/>
  </g>

  <!-- Quality Control Inspector Character (Quality Assurance Assorted Grading) -->
  <g transform="translate(14, 15)">
    <!-- Inspector Body / Torso -->
    <path d="M165 140 C165 125 185 125 185 140 L195 185 C195 190 185 195 175 195 C165 195 155 190 155 185 Z" fill="#38bdf8"/>
    <!-- Clipboard in Hand -->
    <rect x="175" y="130" width="18" height="24" rx="2" fill="#e2e8f0" transform="rotate(15 175 130)"/>
    <path d="M178 135 L188 135" stroke="#64748b" stroke-width="1.5" transform="rotate(15 175 130)"/>
    <path d="M178 140 L185 140" stroke="#64748b" stroke-width="1.5" transform="rotate(15 175 130)"/>
    <path d="M178 145 L186 145" stroke="#ef4444" stroke-width="1.5" transform="rotate(15 175 130)"/>

    <!-- Inspector Neck & Head -->
    <rect x="170" y="105" width="10" height="12" fill="#fcd34d"/>
    <circle cx="175" cy="98" r="14" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M161 95 C161 88 189 88 189 95 C189 98 185 92 175 92 C165 92 161 98 161 95 Z" fill="#334155"/>
    <!-- Face Profile / Expression (Thoughtful & Directing) -->
    <circle cx="182" cy="98" r="1.5" fill="#1e293b"/>
    <!-- Pointing Finger / Arm -->
    <path d="M165 135 C150 135 130 125 120 120" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="118" cy="119" r="3.5" fill="#fcd34d"/>
  </g>

  <!-- Decorative Studio Lighting & Foreground Elements -->
  <circle cx="45" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="195" cy="40" r="3" fill="#f59e0b" opacity="0.8" filter="url(#glow)"/>
  <circle cx="210" cy="110" r="1.5" fill="#38bdf8" opacity="0.4"/>

  <!-- Tier Level Indicator Markers (Abstract Graphic Tagging on Shelves) -->
  <!-- Gold Badge Indicator -->
  <circle cx="42" cy="73" r="4" fill="url(#tier-gold)"/>
  <!-- Silver Badge Indicator -->
  <circle cx="32" cy="108" r="4" fill="url(#tier-silver)"/>
  <!-- Bronze Badge Indicator -->
  <circle cx="22" cy="143" r="4" fill="url(#tier-bronze)"/>

</svg>