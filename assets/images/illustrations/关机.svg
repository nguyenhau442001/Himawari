<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#2D343E"/>
  
  <!-- Laptop Body -->
  <rect x="70" y="100" width="100" height="60" rx="4" fill="#4A5568"/>
  <rect x="75" y="105" width="90" height="45" rx="2" fill="#1A1D24"/>
  
  <!-- Screen Content (Dark) -->
  <rect x="85" y="115" width="70" height="25" rx="2" fill="#2D343E"/>
  
  <!-- Hand Action -->
  <g>
    <!-- Motion lines -->
    <path d="M145 90 L145 75" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M155 95 L165 85" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    
    <!-- Finger pressing -->
    <circle cx="140" cy="95" r="8" fill="#FFD180"/>
    <rect x="132" y="95" width="16" height="15" rx="4" fill="#FFD180"/>
    
    <!-- Power Button Indicator -->
    <circle cx="140" cy="135" r="4" fill="#FF4D4D"/>
  </g>
  
  <!-- Laptop Hinge/Details -->
  <rect x="70" y="155" width="100" height="5" rx="1" fill="#374151"/>
</svg>