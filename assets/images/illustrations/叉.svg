<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow to create depth for modern dark mode UI -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>

  <!-- Main Object: Western Dining Fork (Cái nĩa/dĩa) representing "叉" -->
  <g transform="rotate(-15 120 120)">
    <!-- Fork handle -->
    <path d="M113 135 L113 205 C113 210, 127 210, 127 205 L127 135 Z" fill="#7C8B9F" />
    
    <!-- Fork bolster / neck -->
    <path d="M110 120 L130 120 L127 135 L113 135 Z" fill="#9AA8BA" />

    <!-- Fork head base -->
    <path d="M106 80 L134 80 L130 120 L110 120 Z" fill="#E2E8F0" />

    <!-- Tines (Prongs) and cutouts -->
    <!-- Left tine -->
    <path d="M106 80 L106 45 C106 42, 110 42, 110 45 L110 80 Z" fill="#E2E8F0" />
    <!-- Inner left tine -->
    <path d="M116 80 L116 48 C116 45, 120 45, 120 48 L120 80 Z" fill="#E2E8F0" />
    <!-- Inner right tine -->
    <path d="M124 80 L124 48 C124 45, 128 45, 128 48 L128 80 Z" fill="#E2E8F0" />
    <!-- Right tine -->
    <path d="M134 80 L134 45 C134 42, 138 42, 138 45 L138 80 Z" fill="#E2E8F0" />

    <!-- Highlights for sleek metallic flat vector look -->
    <path d="M114 135 L114 203 C114 205, 116 205, 116 203 L116 135 Z" fill="#B0C4DE" opacity="0.6"/>
    <path d="M108 50 L108 80 L110 80 L110 50 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Focus Accent Elements (Modern minimal aesthetic dots/accents) -->
  <circle cx="185" cy="70" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="55" cy="170" r="3" fill="#F59E0B" opacity="0.6"/>
  <path d="M175 160 L185 170 M185 160 L175 170" stroke="#4A5568" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>