<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/ambience for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual illustration for 稿子 (draft/manuscript/speech draft) -->
  <g transform="translate(0, 0)">
    <!-- Back/Under manuscript pages (stacked effect) -->
    <path d="M78 68 L152 68 L170 162 L96 162 Z" fill="#2C3240" rx="2"/>
    
    <!-- Secondary stacked draft paper -->
    <path d="M74 74 L158 74 L164 168 L80 168 Z" fill="#363C4E" rx="2"/>

    <!-- Main Manuscript / Speech Draft (Primary Sheet) -->
    <rect x="68" y="52" width="96" height="136" rx="4" fill="#EAECEF"/>
    
    <!-- Red Accent Header / Speech Title Marker -->
    <rect x="84" y="66" width="36" height="6" rx="3" fill="#FF5C5C"/>

    <!-- Text lines representing manuscript content (speech draft) -->
    <g fill="#9AA0A6">
      <rect x="84" y="82" width="64" height="4" rx="2"/>
      <rect x="84" y="94" width="72" height="4" rx="2"/>
      <rect x="84" y="106" width="50" height="4" rx="2"/>
      
      <!-- Paragraph break / spacing -->
      <rect x="84" y="124" width="68" height="4" rx="2"/>
      <rect x="84" y="136" width="72" height="4" rx="2"/>
      <rect x="84" y="148" width="58" height="4" rx="2"/>
      <rect x="84" y="160" width="40" height="4" rx="2"/>
    </g>

    <!-- Fold / Curl effect at bottom right corner of the paper -->
    <path d="M152 188 L164 176 L164 188 Z" fill="#CBD0D8"/>
    <path d="M152 188 L164 176 L152 176 Z" fill="#B0B5BC"/>

    <!-- Interactive / Focus Element: Editing / Reading Marker (Gold/Orange accent) -->
    <!-- Highlighting pen / editing pointer resting on the manuscript -->
    <g transform="translate(130, 115) rotate(-35)">
      <!-- Pen body -->
      <rect x="0" y="0" width="10" height="50" rx="3" fill="#F39C12"/>
      <!-- Pen grip/cap -->
      <rect x="0" y="35" width="10" height="8" fill="#D68910"/>
      <!-- Pen tip -->
      <path d="M0 50 L5 58 L10 50 Z" fill="#2C3240"/>
      <!-- Clip -->
      <rect x="4" y="8" width="2" height="20" rx="1" fill="#FCE5CD"/>
    </g>

    <!-- Subtle focal highlight circles -->
    <circle cx="160" cy="72" r="4" fill="#FF5C5C" opacity="0.8"/>
  </g>
</svg>