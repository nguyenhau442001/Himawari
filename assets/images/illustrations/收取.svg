<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/card base representing the bank counter/interface -->
  <rect x="36" y="50" width="168" height="140" rx="16" fill="#222730" stroke="#2D333F" stroke-width="2"/>
  
  <!-- Decorative ATM/Terminal Slot elements -->
  <path d="M70 76H170" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <rect x="90" y="92" width="60" height="6" rx="3" fill="#374151"/>

  <!-- Physical Object representing the Noun context: A formal transaction receipt / fee document being collected -->
  <!-- Document base -->
  <rect x="85" y="105" width="70" height="85" rx="6" fill="#F3F4F6"/>
  <!-- Document header line -->
  <rect x="95" y="118" width="30" height="5" rx="2.5" fill="#9CA3AF"/>
  <!-- Document text lines -->
  <rect x="95" y="133" width="50" height="3" rx="1.5" fill="#D1D5DB"/>
  <rect x="95" y="142" width="40" height="3" rx="1.5" fill="#D1D5DB"/>
  <rect x="95" y="151" width="45" height="3" rx="1.5" fill="#D1D5DB"/>
  
  <!-- Accent highlight: The exact fee/amount collected (Gold/Orange focus per rules) -->
  <circle cx="140" cy="168" r="10" fill="#F59E0B"/>
  <text x="140" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A1D24" text-anchor="middle">$</text>

  <!-- Physical hands representing the action of taking/collecting (收取) -->
  <!-- Receiving Hand (User/System gathering the fee) coming from bottom right -->
  <path d="M165 210C165 210 145 180 130 170C118 162 105 160 95 165" fill="none" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Fingers securely grasping the receipt/fee object -->
  <path d="M125 165L138 178" stroke="#E5E7EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M112 163L122 176" stroke="#E5E7EB" stroke-width="9" stroke-linecap="round"/>

  <!-- Top accent indicator showing active collection/transaction -->
  <circle cx="120" cy="35" r="4" fill="#F59E0B"/>
</svg>