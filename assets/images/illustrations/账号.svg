    <!-- Hair -->
    <path d="M-25 -5 C-30 -20 -10 -30 0 -30 C10 -30 30 -20 25 -5" fill="#fbbf24"/>
  </g>
  
  <!-- Hand pointing to screen -->
  <path d="M140 110 L155 100 L165 115" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="4" fill="#10b981"/>
  <circle cx="40" cy="60" r="6" fill="#ec4899"/>
  <path d="M180 80 L190 70 L200 80" stroke="#fb923c" stroke-width="3" fill="none"/>
