<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" fill="#475569"/>
  
  <!-- Laptop -->
  <path d="M70 160 L170 160 L185 130 L55 130 Z" fill="#64748b"/>
  <path d="M60 130 L180 130 L180 125 C180 120 175 115 170 115 L70 115 C65 115 60 120 60 125 Z" fill="#94a3b8"/>
  
  <!-- Screen Interface (Abstract shapes only) -->
  <rect x="70" y="120" width="100" height="35" rx="2" fill="#0f172a"/>
  <circle cx="85" cy="130" r="5" fill="#fb923c"/>
  <rect x="95" y="128" width="40" height="4" rx="1" fill="#38bdf8"/>
  <rect x="95" y="136" width="60" height="4" rx="1" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(120, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-5" r="3" fill="#1e293b"/>
    <circle cx="8" cy="-5" r="3" fill="#1e293b"/>
    <!-- Smile -->
