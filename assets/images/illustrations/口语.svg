<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/ring -->
  <circle cx="120" cy="115" r="75" fill="none" stroke="#262B35" stroke-width="4" stroke-dasharray="8 6"/>
  
  <!-- Floating sound wave particles / speech elements -->
  <g fill="#FFA500" opacity="0.6">
    <circle cx="65" cy="85" r="3"/>
    <circle cx="175" cy="85" r="3"/>
    <circle cx="75" cy="155" r="2.5"/>
    <circle cx="165" cy="155" r="2.5"/>
  </g>

  <!-- Left Character/Avatar (Profile silhouette) -->
  <g transform="translate(15, 0)">
    <!-- Shoulders/Body -->
    <path d="M 35 175 C 35 150, 50 140, 75 140 C 100 140, 115 150, 115 175 Z" fill="#2B313C"/>
    <!-- Head -->
    <circle cx="75" cy="110" r="20" fill="#2B313C"/>
    <!-- Sound Waves from speaker -->
    <path d="M 105 105 A 15 15 0 0 1 105 125" fill="none" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    <path d="M 112 97 A 25 25 0 0 1 112 133" fill="none" stroke="#FFA500" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Central Iconic Object: Modern Stylized Mouth & Speech Bubble / Spoken Language Concept -->
  <g transform="translate(0, -5)">
    <!-- Outer Speech Bubble Backdrop -->
    <path d="M 75 65 C 75 45, 165 45, 165 65 C 165 85, 140 100, 120 115 C 100 100, 75 85, 75 65 Z" fill="#222730" stroke="#323846" stroke-width="3"/>
    
    <!-- Sound wave inside bubble -->
    <rect x="95" y="58" width="5" height="14" rx="2.5" fill="#FFA500"/>
    <rect x="105" y="50" width="5" height="30" rx="2.5" fill="#FFA500"/>
    <rect x="115" y="44" width="5" height="42" rx="2.5" fill="#FFC107"/>
    <rect x="125" y="50" width="5" height="30" rx="2.5" fill="#FFA500"/>
    <rect x="135" y="58" width="5" height="14" rx="2.5" fill="#FFA500"/>

    <!-- Direct Spoken Word Symbol: Distinct Modern Lips / Mouth representing "Kǒuyǔ" (Oral Speech) -->
    <!-- Lower Face Base Glow -->
    <ellipse cx="120" cy="130" rx="35" ry="25" fill="#1A1D24"/>
    
    <!-- Upper Lip -->
    <path d="M 95 122 Q 120 105 145 122 Q 135 130 120 125 Q 105 130 95 122 Z" fill="#FFA500"/>
    
    <!-- Lower Lip -->
    <path d="M 97 125 Q 120 122 143 125 Q 120 152 97 125 Z" fill="#FF8C00"/>
    
    <!-- Open Mouth Cavity (Speech creation) -->
    <path d="M 103 124 Q 120 128 137 124 Q 120 142 103 124 Z" fill="#1A1D24"/>
    
    <!-- White Teeth hint -->
    <path d="M 108 125 Q 120 129 132 125 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Right Character/Avatar (Profile silhouette, listening) -->
  <g transform="translate(110, 0)" style="transform: scaleX(-1); transform-origin: 180px 120px;">
    <!-- Shoulders/Body -->
    <path d="M 35 175 C 35 150, 50 140, 75 140 C 100 140, 115 150, 115 175 Z" fill="#2B313C"/>
    <!-- Head -->
    <circle cx="75" cy="110" r="20" fill="#2B313C"/>
    <!-- Sound Waves towards listener -->
    <path d="M 105 105 A 15 15 0 0 1 105 125" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>