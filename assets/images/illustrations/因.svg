<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Domino Effect Metaphor for Causality -->
  <g transform="translate(40, 100)">
    <!-- First Domino (The Cause) -->
    <rect x="0" y="40" width="20" height="60" rx="2" fill="#FFB84D"/>
    
    <!-- Second Domino (The Transition) -->
    <rect x="40" y="20" width="20" height="80" rx="2" fill="#FF9F43"/>
    
    <!-- Third Domino (The Effect) -->
    <rect x="80" y="0" width="20" height="100" rx="2" fill="#FF8C00"/>
    
    <!-- Fourth Domino (The Final Outcome) -->
    <rect x="120" y="-20" width="20" height="120" rx="2" fill="#E67E22"/>
    
    <!-- Ground Line -->
    <path d="M-10 100 L170 100" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Arrow indicating the flow of causality -->
  <path d="M40 130 L200 130" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M195 125 L200 130 L195 135" fill="none" stroke="#5D6D7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>