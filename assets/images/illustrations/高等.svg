<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative academic architectural lines (subtle campus arches) -->
  <path d="M60 160 L60 120 C60 100, 75 90, 90 90 L150 90 C165 90, 180 100, 180 120 L180 160" fill="none" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 90 L120 60" fill="none" stroke="#2A2F3D" stroke-width="2"/>
  <circle cx="120" cy="55" r="5" fill="#2A2F3D"/>

  <!-- Stepped platform representing "Higher/Advanced" (高等) -->
  <!-- Base tier (Lower education/ground) -->
  <rect x="40" y="160" width="160" height="12" rx="3" fill="#2E3646"/>
  <rect x="55" y="145" width="130" height="15" rx="3" fill="#3B4459"/>

  <!-- Top tier (Higher education/advanced plateau) -->
  <rect x="75" y="130" width="90" height="15" rx="3" fill="#4B5873"/>

  <!-- Scale Exaggeration: Tall, elegant Graduation Cap & Diploma representing Higher Education/Advancement -->
  
  <!-- Glowing subtle aura behind the cap for "Higher/Elite" concept -->
  <ellipse cx="120" cy="85" rx="40" ry="20" fill="#F59E0B" opacity="0.1"/>

  <!-- Modern Flat Design Graduation Cap (Mortarboard) positioned high up -->
  <polygon points="120,60 165,75 120,90 75,75" fill="#F59E0B"/>
  <polygon points="120,60 165,75 120,90 75,75" stroke="#FBBF24" stroke-width="1.5" stroke-linejoin="round" fill="none"/>

  <!-- Cap Skull Cap / Base -->
  <path d="M98 83 V100 C98 112, 142 112, 142 100 V83" fill="#D97706"/>

  <!-- Tassel hanging gracefully to the right -->
  <path d="M140 82 Q155 90 152 110" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="152" cy="112" r="3.5" fill="#FBBF24"/>

  <!-- Floating Open Scroll / Diploma (Symbol of academic achievement) -->
  <g transform="translate(95, 115) rotate(-10)">
    <!-- Scroll body -->
    <rect x="0" y="0" width="50" height="16" rx="4" fill="#F3F4F6"/>
    <!-- Scroll inner shadow/lines -->
    <line x1="10" y1="4" x2="40" y2="4" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="8" x2="35" y2="8" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Red ribbon/seal -->
    <rect x="22" y="0" width="6" height="16" fill="#EF4444"/>
  </g>

  <!-- Upward directional indicator lines (Visualizing 'Cao' / High / Elevation) -->
  <g stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <polyline points="30,120 38,110 46,120"/>
    <line x1="38" y1="130" x2="38" y2="110"/>

    <polyline points="202,120 210,110 218,120"/>
    <line x1="210" y1="130" x2="210" y2="110"/>
  </g>

  <!-- Star accents for distinction / premium quality (高等) -->
  <path d="M55 70 L57.5 76 L64 77 L59 81 L60.5 87 L55 83.5 L49.5 87 L51 81 L46 77 L52.5 76 Z" fill="#FBBF24" opacity="0.9"/>
  <path d="M185 70 L187.5 76 L194 77 L189 81 L190.5 87 L185 83.5 L179.5 87 L181 81 L176 77 L182.5 76 Z" fill="#FBBF24" opacity="0.9"/>
</svg>