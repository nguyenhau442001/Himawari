<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle mountain contour and atmosphere -->
  <path d="M 40,200 L 120,120 L 220,210 Z" fill="#222733" opacity="0.5"/>
  <path d="M 100,200 L 170,140 L 240,210 Z" fill="#2B3240" opacity="0.4"/>

  <!-- Descending Stone Stairs (representing "下去" - going down) -->
  <g transform="translate(30, 90)">
    <!-- Stair steps -->
    <path d="M 10,10 L 40,10 L 40,30 L 70,30 L 70,50 L 100,50 L 100,70 L 130,70 L 130,90 L 160,90 L 160,110 L 190,110 L 190,130 L 210,130" 
          fill="none" stroke="#3A4454" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Step top surfaces for depth -->
    <polygon points="10,10 40,10 40,14 10,14" fill="#4E5D73"/>
    <polygon points="40,30 70,30 70,34 40,34" fill="#4E5D73"/>
    <polygon points="70,50 100,50 100,54 70,54" fill="#4E5D73"/>
    <polygon points="100,70 130,70 130,74 100,74" fill="#4E5D73"/>
    <polygon points="130,90 160,90 160,94 130,94" fill="#4E5D73"/>
    <polygon points="160,110 190,110 190,114 160,114" fill="#4E5D73"/>
  </g>

  <!-- Motion lines indicating downward movement (下去) -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="145" y1="125" x2="135" y2="140"/>
    <line x1="155" y1="133" x2="145" y2="148"/>
    <line x1="135" y1="117" x2="125" y2="132"/>
  </g>

  <!-- Dynamic Human Character walking down the stairs -->
  <g transform="translate(100, 85)">
    <!-- Back Leg (stepping down) -->
    <path d="M 22,38 L 10,55 L 0,55" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso -->
    <path d="M 20,20 L 25,40 L 15,42 Z" fill="#3B82F6"/>

    <!-- Front Leg (planting/moving forward) -->
    <path d="M 25,40 L 35,62 L 45,65" fill="none" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Back Arm (balancing motion) -->
    <path d="M 22,25 L 8,30" fill="none" stroke="#64748B" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="23" cy="11" r="7" fill="#FDE047"/>

    <!-- Front Arm (reaching forward/down) -->
    <path d="M 22,25 L 36,35" fill="none" stroke="#93C5FD" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Ground / Base of the mountain -->
  <path d="M 0,220 Q 120,210 240,220 L 240,240 L 0,240 Z" fill="#111318"/>

  <!-- Directional arrow accent (Subtle, focused on action) -->
  <path d="M 175,155 L 182,168 L 169,168 Z" fill="#F59E0B"/>
  <path d="M 182,150 L 189,163 L 176,163" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>