<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background sky gradient (dusk transitioning to night) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#162238" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Huangpu River gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1325" />
    </linearGradient>

    <!-- Glass observation deck gradient -->
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Oriental Pearl Tower-inspired shape gradient -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
  </defs>

  <!-- Full bleed container background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Background Skyscrapers & International City Skyline -->
  <!-- Far background buildings -->
  <rect x="15" y="70" width="18" height="110" fill="#1e293b" opacity="0.6" />
  <rect x="35" y="85" width="22" height="95" fill="#0f172a" opacity="0.7" />
  <rect x="175" y="60" width="25" height="120" fill="#1e293b" opacity="0.6" />
  <rect x="205" y="75" width="20" height="105" fill="#0f172a" opacity="0.7" />

  <!-- Midground Skyscrapers (The Bund / Lujiazui silhouettes) -->
  <polygon points="55,180 55,50 65,40 75,50 75,180" fill="#1e293b" />
  <polygon points="85,180 85,75 97,60 109,75 109,180" fill="#334155" />

  <!-- Iconic Shanghai Oriental Pearl TV Tower (Stylized representation) -->
  <g transform="translate(135, 30)">
    <!-- Spire -->
    <line x1="10" y1="-10" x2="10" y2="150" stroke="#fda4af" stroke-width="1.5" />
    <!-- Spheres -->
    <circle cx="10" cy="35" r="8" fill="url(#towerGrad)" filter="url(#neonGlow)" />
    <circle cx="10" cy="70" r="12" fill="url(#towerGrad)" filter="url(#neonGlow)" />
    <ellipse cx="10" cy="105" rx="14" ry="7" fill="url(#towerGrad)" filter="url(#neonGlow)" />
    <!-- Supporting columns -->
    <path d="M5,70 L2,150 M15,70 L18,150" stroke="#f43f5e" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Supertall "Bottle Opener" Tower (Shanghai World Financial Center silhouette) -->
  <path d="M195,180 L195,45 Q202,38 209,45 L209,180 Z" fill="#334155" />
  <!-- The iconic trapezoid window opening -->
  <polygon points="200,60 204,55 204,68 200,68" fill="#090d16" />

  <!-- Futuristic Spiral Tower (Shanghai Tower silhouette) -->
  <path d="M150,180 L153,60 Q157,50 160,40 L163,50 Q167,60 170,180 Z" fill="#475569" />

  <!-- Glowing City Lights & Windows (Vector Dots and Dashes) -->
  <g fill="#38bdf8" opacity="0.8">
    <rect x="60" y="60" width="3" height="3" />
    <rect x="68" y="70" width="3" height="3" />
    <rect x="60" y="80" width="3" height="3" />
    <rect x="68" y="90" width="3" height="3" />
    <rect x="90" y="95" width="4" height="2" fill="#fbbf24" />
    <rect x="98" y="105" width="4" height="2" fill="#fbbf24" />
    <rect x="90" y="115" width="4" height="2" fill="#fbbf24" />
    <rect x="156" y="70" width="2" height="4" fill="#ec4899" />
    <rect x="162" y="90" width="2" height="4" fill="#ec4899" />
  </g>

  <!-- Ambient lighting/glow from the bustling metropolis -->
  <circle cx="135" cy="130" r="45" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="90" cy="140" r="35" fill="#f59e0b" opacity="0.1" filter="url(#softGlow)" />

  <!-- Huangpu River with light reflections -->
  <rect x="0" y="170" width="240" height="70" fill="url(#riverGrad)" />
  <!-- Water reflection streaks -->
  <ellipse cx="135" cy="185" rx="35" ry="2" fill="#38bdf8" opacity="0.5" filter="url(#softGlow)" />
  <ellipse cx="105" cy="195" rx="20" ry="1.5" fill="#fbbf24" opacity="0.4" filter="url(#softGlow)" />
  <ellipse cx="165" cy="200" rx="45" ry="2" fill="#ec4899" opacity="0.4" filter="url(#softGlow)" />
  <ellipse cx="80" cy="210" rx="15" ry="1" fill="#38bdf8" opacity="0.3" />
  <ellipse cx="180" cy="220" rx="25" ry="1.5" fill="#38bdf8" opacity="0.4" />

  <!-- Foreground: Observation Deck Interior / Balcony Railing -->
  <path d="M0,200 L240,200 L240,240 L0,240 Z" fill="url(#deckGrad)" />
  <!-- Glass railing bar with warm accent lighting -->
  <rect x="0" y="196" width="240" height="4" fill="#38bdf8" opacity="0.6" filter="url(#neonGlow)" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#0f172a" stroke-width="2" />
  
  <!-- Vertical structural pillars of the modern interior -->
  <rect x="0" y="160" width="12" height="80" fill="#0f172a" opacity="0.9" />
  <rect x="228" y="160" width="12" height="80" fill="#0f172a" opacity="0.9" />

  <!-- EXPRESSIVE CHARACTERS (Foreground subject experiencing the international metropolis) -->
  <!-- Character 1: Young woman pointing excitedly at the view -->
  <g transform="translate(145, 145)">
    <!-- Body / Jacket -->
    <path d="M30,35 Q30,20 42,20 Q54,20 54,35 L58,55 L26,55 Z" fill="#10b981" />
    <!-- Scarf -->
    <path d="M35,18 Q42,25 48,18 L50,28 Q42,32 33,28 Z" fill="#f59e0b" />
    <!-- Head -->
    <circle cx="42" cy="10" r="9" fill="#fde047" />
    <!-- Hair (Stylish bob) -->
    <path d="M33,6 Q42,0 51,6 Q53,14 50,18 L34,18 Q31,14 33,6 Z" fill="#1e293b" />
    <!-- Arm pointing forward -->
    <path d="M50,25 L68,18" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="70" cy="17" r="3" fill="#fde047" />
    <!-- Other arm resting -->
    <path d="M32,30 L26,45" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Character 2: Companion smiling and holding a camera/phone taking a picture -->
  <g transform="translate(90, 150)">
    <!-- Body / Coat -->
    <path d="M25,30 Q25,18 37,18 Q49,18 49,30 L52,50 L22,50 Z" fill="#38bdf8" />
    <!-- Head -->
    <circle cx="37" cy="8" r="8.5" fill="#fde047" />
    <!-- Hair -->
    <path d="M29,4 Q37,-2 45,4 Q47,10 44,12 L30,12 Q27,10 29,4 Z" fill="#334155" />
    <!-- Holding smartphone/camera device towards view -->
    <rect x="38" y="20" width="14" height="9" rx="2" fill="#fb923c" />
    <rect x="41" y="22" width="8" height="5" rx="1" fill="#0f172a" />
    <!-- Arms holding device -->
    <path d="M33,25 L40,23" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" />
    <path d="M48,23 L52,25" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Foreground bokeh particles / atmosphere -->
  <circle cx="65" cy="185" r="2" fill="#38bdf8" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="185" cy="175" r="3" fill="#f59e0b" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="120" cy="190" r="1.5" fill="#ec4899" opacity="0.7" filter="url(#softGlow)" />

</svg>