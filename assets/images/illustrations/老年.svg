<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/circle for focus -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Character / Elderly Person Illustration -->
  <g transform="translate(0, 5)">
    <!-- Shoulders and Coat (Warm amber/gold professional accent color) -->
    <path d="M75 185 C75 160 95 145 120 145 C145 145 165 160 165 185 L180 205 C180 210 175 215 170 215 L70 215 C65 215 60 210 60 205 Z" fill="#D97706"/>
    
    <!-- Inner shirt collar -->
    <path d="M100 145 L120 165 L140 145 Z" fill="#E2E8F0"/>
    <path d="M112 165 L120 175 L128 165 Z" fill="#3B82F6"/>

    <!-- Neck -->
    <rect x="110" y="125" width="20" height="25" rx="6" fill="#FBBF24"/>

    <!-- Head / Face Base -->
    <circle cx="120" cy="105" r="32" fill="#FCD34D"/>

    <!-- Gentle Smile Lines / Wisdom Wrinkles -->
    <path d="M102 108 C105 113 115 113 118 108" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M138 108 C135 113 125 113 122 108" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Friendly Eyes (Closed happy crescent eyes denoting elderly wisdom/warmth) -->
    <path d="M103 98 C106 102 111 102 114 98" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M126 98 C129 102 134 102 137 98" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Gentle Smile -->
    <path d="M112 116 C116 120 124 120 128 116" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Classic Elderly Hair (Silver/White neat tufts on sides and top) -->
    <path d="M88 100 C85 80 100 65 120 65 C140 65 155 80 152 100 C155 90 155 75 140 70 C125 65 115 70 120 70 C100 70 90 85 88 100 Z" fill="#F1F5F9"/>
    
    <!-- Distinguished Silver Hair Sides -->
    <path d="M89 95 C88 105 92 115 98 120 C94 112 93 102 96 95 Z" fill="#CBD5E1"/>
    <path d="M151 95 C152 105 148 115 142 120 C146 112 147 102 144 95 Z" fill="#CBD5E1"/>

    <!-- Glasses (Classic round intellectual frames denoting seniority/wisdom) -->
    <circle cx="108" cy="98" r="11" fill="none" stroke="#64748B" stroke-width="3"/>
    <circle cx="132" cy="98" r="11" fill="none" stroke="#64748B" stroke-width="3"/>
    <line x1="119" y1="98" x2="121" y2="98" stroke="#64748B" stroke-width="3"/>
  </g>
</svg>