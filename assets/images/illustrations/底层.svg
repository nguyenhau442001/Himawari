<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- High-contrast accent lighting for depth -->
  <radialGradient id="bgGlow" cx="50%" cy="80%" r="60%">
    <stop offset="0%" stop-color="#E5A93B" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#bgGlow)"/>

  <!-- Conceptual illustration representing "底层" (Bottom layer/ground floor/base of society) -->
  <!-- We visualize a towering multi-tiered architectural/societal structure, with a distinct, glowing, emphasized bottom-most foundation layer. -->

  <!-- Upper tiers (abstracted, muted tones to give context to the "bottom") -->
  <g opacity="0.35">
    <!-- Top tier -->
    <rect x="85" y="45" width="70" height="20" rx="4" fill="#4A5568"/>
    <rect x="95" y="50" width="10" height="10" fill="#1A1D24"/>
    <rect x="115" y="50" width="10" height="10" fill="#1A1D24"/>
    <rect x="135" y="50" width="10" height="10" fill="#1A1D24"/>

    <!-- Middle tier -->
    <rect x="70" y="70" width="100" height="24" rx="4" fill="#3E4C59"/>
    <rect x="82" y="77" width="12" height="12" fill="#1A1D24"/>
    <rect x="102" y="77" width="12" height="12" fill="#1A1D24"/>
    <rect x="124" y="77" width="12" height="12" fill="#1A1D24"/>
    <rect x="146" y="77" width="12" height="12" fill="#1A1D24"/>

    <!-- Lower-middle tier -->
    <rect x="55" y="98" width="130" height="26" rx="4" fill="#2D3748"/>
    <rect x="68" y="105" width="14" height="14" fill="#1A1D24"/>
    <rect x="90" y="105" width="14" height="14" fill="#1A1D24"/>
    <rect x="113" y="105" width="14" height="14" fill="#1A1D24"/>
    <rect x="136" y="105" width="14" height="14" fill="#1A1D24"/>
    <rect x="158" y="105" width="14" height="14" fill="#1A1D24"/>
  </g>

  <!-- Connecting vertical pillars showing structural weight pressing down -->
  <g fill="#2D3748" opacity="0.5">
    <rect x="88" y="124" width="8" height="20"/>
    <rect x="144" y="124" width="8" height="20"/>
  </g>

  <!-- THE CORE FOCUS: "底层" (The Bottom Layer / Ground Floor) -->
  <g>
    <!-- Foundation Base Platform (Ground level) -->
    <rect x="30" y="186" width="180" height="10" rx="3" fill="#E5A93B"/>

    <!-- Bottom Tier Main Structure -->
    <rect x="40" y="144" width="160" height="42" rx="6" fill="#242B35" stroke="#E5A93B" stroke-width="2.5"/>

    <!-- Ground Floor Windows and Door (Warm, human-centric lighting) -->
    <!-- Door -->
    <rect x="108" y="158" width="24" height="28" rx="4" fill="#E5A93B" opacity="0.9"/>
    <circle cx="126" cy="173" r="1.5" fill="#1A1D24"/>

    <!-- Left Window -->
    <rect x="60" y="158" width="22" height="20" rx="3" fill="#E5A93B" opacity="0.3"/>
    <line x1="71" y1="158" x2="71" y2="178" stroke="#1A1D24" stroke-width="1.5"/>
    <line x1="60" y1="168" x2="82" y2="168" stroke="#1A1D24" stroke-width="1.5"/>

    <!-- Right Window -->
    <rect x="158" y="158" width="22" height="20" rx="3" fill="#E5A93B" opacity="0.3"/>
    <line x1="169" y1="158" x2="169" y2="178" stroke="#1A1D24" stroke-width="1.5"/>
    <line x1="158" y1="168" x2="180" y2="168" stroke="#1A1D24" stroke-width="1.5"/>
  </g>

  <!-- Ground surface indicator -->
  <path d="M 15 200 L 225 200" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
  <path d="M 35 208 L 205 208" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle downward gravity/foundation indicator brackets highlighting the bottom position -->
  <g stroke="#E5A93B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <path d="M 22 144 L 16 144 L 16 186 L 22 186"/>
    <polyline points="19,161 24,165 19,169"/>
  </g>
</svg>