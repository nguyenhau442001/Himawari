<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Central Character Silhouette & Artistic Aura representing "Duocai Duoyi" (Multi-talented person) -->
  <g transform="translate(120, 125)">
    <!-- Ambient glowing talented aura ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#2D323E" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>

    <!-- Person Head & Shoulders (Sleek Modern Flat Design) -->
    <!-- Shoulders/Body -->
    <path d="M-36 52 C-36 34 -18 28 0 28 C18 28 36 34 36 52 L36 58 L-36 58 Z" fill="#3B82F6"/>
    <!-- Neck -->
    <rect x="-6" y="16" width="12" height="16" fill="#FDE68A"/>
    <!-- Head -->
    <circle cx="0" cy="2" r="18" fill="#FDE68A"/>
    <!-- Hair -->
    <path d="M-18 -3 C-18 -15 -8 -20 0 -20 C8 -20 18 -15 18 -3 C18 4 14 10 12 4 C6 2 -6 2 -12 4 C-14 10 -18 4 -18 -3 Z" fill="#1E293B"/>

    <!-- Floating Talent Icons representing "琴棋书画" (Music, Go/Chess, Calligraphy, Painting) -->
    
    <!-- 1. Music (Guqin / Musical notes) - Top Left -->
    <g transform="translate(-52, -36)">
      <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
      <!-- Music Note -->
      <path d="M-3 4 L-3 -4 L5 -6 L5 2" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-5" cy="4" r="2.5" fill="#60A5FA"/>
      <circle cx="3" cy="2" r="2.5" fill="#60A5FA"/>
    </g>

    <!-- 2. Painting (Palette & Brush) - Top Right -->
    <g transform="translate(52, -36)">
      <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <!-- Palette -->
      <path d="M-5 -3 C-5 -7 5 -7 6 -2 C7 3 2 7 -3 5 C-7 3 -5 -1 -5 -3 Z" fill="#FCD34D"/>
      <circle cx="-3" cy="-1" r="1.5" fill="#EF4444"/>
      <circle cx="2" cy="-3" r="1.5" fill="#3B82F6"/>
      <circle cx="3" cy="2" r="1.5" fill="#10B981"/>
    </g>

    <!-- 3. Calligraphy (Brush & Scroll) - Bottom Left -->
    <g transform="translate(-60, 20)">
      <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
      <!-- Brush -->
      <path d="M-5 6 L5 -4 L7 -2 L-3 8 Z" fill="#94A3B8"/>
      <path d="M-5 6 L-7 8 L-6 5 Z" fill="#1E293B"/>
    </g>

    <!-- 4. Chess / Strategy (Go pieces / Star) - Bottom Right -->
    <g transform="translate(60, 20)">
      <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
      <!-- Star / Achievement symbol -->
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#F472B6"/>
    </g>

    <!-- Sparkles of Talent (Gold accents) -->
    <circle cx="0" cy="-62" r="3" fill="#F59E0B"/>
    <circle cx="-38" cy="-55" r="2" fill="#F59E0B"/>
    <circle cx="38" cy="-55" r="2.5" fill="#F59E0B"/>
  </g>
</svg>