<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow behind the service window -->
  <circle cx="120" cy="115" r="70" fill="#2D3748" opacity="0.4"/>

  <!-- Service Counter (Quầy giao dịch context) -->
  <!-- Counter base structure -->
  <path d="M 50,165 L 190,165 L 180,205 L 60,205 Z" fill="#2563EB" opacity="0.2"/>
  <rect x="40" y="155" width="160" height="14" rx="3" fill="#3B82F6"/>
  <rect x="50" y="169" width="140" height="36" fill="#1E293B"/>

  <!-- Counter Glass Partition & Ticket Dispenser Element -->
  <!-- Partition frame -->
  <rect x="70" y="70" width="100" height="85" rx="4" fill="none" stroke="#64748B" stroke-width="3"/>
  
  <!-- Glass reflection / transparency -->
  <rect x="74" y="74" width="92" height="77" fill="#38BDF8" opacity="0.08"/>
  <path d="M 90,74 L 74,110" stroke="#F8FAFC" stroke-width="2" opacity="0.2" stroke-linecap="round"/>

  <!-- Transaction Opening (Service Slot at bottom of glass) -->
  <rect x="100" y="130" width="40" height="15" rx="3" fill="#0F172A" stroke="#475569" stroke-width="2"/>

  <!-- Number Display Badge (Indicating "Quầy số 3" from the reference sentence) -->
  <rect x="105" y="42" width="30" height="20" rx="4" fill="#F59E0B"/>
  <text x="120" y="57" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1A1D24" text-anchor="middle">3</text>

  <!-- Document / Passport application icon gliding through the window slot -->
  <!-- Passport booklet -->
  <g transform="translate(102, 105) rotate(-10)">
    <rect x="0" y="0" width="36" height="46" rx="4" fill="#EF4444"/>
    <!-- Passport emblem crest -->
    <circle cx="18" cy="18" r="7" fill="#FDE047"/>
    <!-- Passport lines -->
    <rect x="8" y="30" width="20" height="3" rx="1.5" fill="#FEE2E2"/>
    <rect x="11" y="36" width="14" height="2" rx="1" fill="#FEE2E2"/>
  </g>

  <!-- Stylized modern desk lamp / lighting accent on counter -->
  <path d="M 170,155 L 165,135" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="164" cy="133" r="4" fill="#FCD34D"/>

  <!-- Customer interaction indicator (Subtle silhouette of hands/person at counter) -->
  <path d="M 60,205 C 60,185 80,185 90,195" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
</svg>