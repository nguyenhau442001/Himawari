<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Landscape Elements -->
  <!-- Rolling hills/banks -->
  <path d="M0 130 C60 110, 140 110, 240 130 L240 240 L0 240 Z" fill="#222733"/>
  <path d="M0 150 C80 140, 160 160, 240 145 L240 240 L0 240 Z" fill="#1E232F"/>

  <!-- The River (河 - hé) winding from top to bottom -->
  <path d="M100 20 C105 60, 140 90, 130 140 C120 190, 150 210, 160 240 L80 240 C75 210, 50 190, 60 140 C70 90, 95 60, 90 20 Z" fill="#2563EB"/>
  
  <!-- Crystal clear water surface ripples / flow lines -->
  <path d="M92 50 C95 55, 100 55, 103 50" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M115 95 C118 99, 123 99, 126 95" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M100 140 C104 145, 110 145, 114 140" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M135 185 C138 189, 143 189, 146 185" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Fresh clean water highlights (Reflecting "水很干净") -->
  <path d="M85 70 C88 73, 92 73, 95 70" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M125 120 C127 123, 131 123, 133 120" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M110 165 C112 168, 116 168, 118 165" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Bank details / Nature elements (Trees on the riverbank) -->
  <!-- Left bank tree -->
  <circle cx="50" cy="115" r="16" fill="#10B981"/>
  <circle cx="38" cy="125" r="12" fill="#059669"/>
  <rect x="47" y="125" width="6" height="15" fill="#78350F" rx="2"/>

  <!-- Right bank tree / vegetation -->
  <circle cx="190" cy="130" r="18" fill="#10B981"/>
  <circle cx="205" cy="140" r="14" fill="#059669"/>
  <rect x="187" y="140" width="6" height="18" fill="#78350F" rx="2"/>

  <!-- Focus accent: Golden sun or reflection representing clarity and outdoor scene -->
  <circle cx="180" cy="50" r="14" fill="#F59E0B" opacity="0.9"/>
  <path d="M180 28 L180 34" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M158 50 L164 50" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M164 34 L168 38" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
</svg>