<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background atmosphere & water body -->
  <path d="M 0 160 Q 120 150 240 160 L 240 240 L 0 240 Z" fill="#16202B"/>
  <path d="M 0 175 Q 120 165 240 175 L 240 240 L 0 240 Z" fill="#101720"/>

  <!-- Left Landmass (Island) -->
  <path d="M 0 160 C 20 160, 35 150, 55 160 C 65 165, 75 180, 75 240 L 0 240 Z" fill="#2B3748"/>
  <circle cx="35" cy="140" r="10" fill="#3B82F6" opacity="0.8"/>
  <path d="M 35 125 L 35 145 M 25 135 L 45 135" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Landmass (Mainland) -->
  <path d="M 185 160 C 205 150, 220 155, 240 150 L 240 240 L 165 240 C 165 190, 175 170, 185 160 Z" fill="#2B3748"/>
  <rect x="195" y="125" width="12" height="25" fill="#3B82F6" rx="2"/>
  <rect x="210" y="115" width="16" height="35" fill="#60A5FA" rx="2"/>

  <!-- Bridge Pillars/Foundations -->
  <rect x="75" y="150" width="8" height="40" fill="#4B5563"/>
  <rect x="157" y="145" width="8" height="45" fill="#4B5563"/>

  <!-- Cable-stayed Bridge Deck (The physical "xiānglián" connection) -->
  <!-- Main deck road -->
  <path d="M 50 155 L 190 148" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
  <!-- Highlight on deck -->
  <path d="M 50 153 L 190 146" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bridge Towers -->
  <path d="M 85 152 L 85 100 L 71 152 Z" fill="#6B7280"/>
  <path d="M 153 147 L 153 95 L 167 147 Z" fill="#6B7280"/>

  <!-- Suspension Cables (Connecting tower to deck) -->
  <!-- Left tower cables -->
  <line x1="79" y1="105" x2="52" y2="153" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="79" y1="105" x2="65" y2="152" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="79" y1="105" x2="78" y2="151" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="79" y1="105" x2="90" y2="151" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="79" y1="105" x2="105" y2="150" stroke="#F59E0B" stroke-width="1.2"/>

  <!-- Right tower cables -->
  <line x1="160" y1="100" x2="135" y2="149" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="160" y1="100" x2="150" y2="148" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="160" y1="100" x2="162" y2="148" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="160" y1="100" x2="175" y2="147" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="160" y1="100" x2="188" y2="146" stroke="#F59E0B" stroke-width="1.2"/>

  <!-- Center span cables linking the bridge together -->
  <path d="M 105 150 Q 120 135 135 149" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- Focus / Connection Pulse Nodes (subtle emphasis on linkage) -->
  <circle cx="120" cy="141" r="3" fill="#F59E0B"/>
  <circle cx="120" cy="141" r="6" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>

</svg>