<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Glowing background accent for focus -->
    <circle cx="0" cy="5" r="70" fill="#FFB703" opacity="0.1"/>
    
    <!-- Shopping Bag (Representing value / buying) -->
    <!-- Bag Body -->
    <path d="M-55,-10 L-45,65 C-44,72 -38,78 -30,78 L30,78 C38,78 44,72 45,65 L55,-10 Z" fill="#2A3142" stroke="#485675" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Bag Front Pocket / Fold Overlay -->
    <path d="M-42,-10 L-35,60 C-34,65 -30,69 -25,69 L25,69 C30,69 34,65 35,60 L42,-10 Z" fill="#323C52" opacity="0.5"/>
    
    <!-- Handles -->
    <path d="M-25,-10 C-25,-35 25,-35 25,-10" fill="none" stroke="#FFB703" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Gold Coin / Value Element 1 (Large, overlapping front) -->
    <circle cx="15" cy="25" r="24" fill="#E69500"/>
    <circle cx="15" cy="25" r="19" fill="#FFB703"/>
    <path d="M15,13 L15,37 M9,19 L21,19 M9,31 L21,31" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Gold Coin 2 (Medium, sticking out of bag) -->
    <circle cx="-20" cy="-5" r="18" fill="#D97706"/>
    <circle cx="-20" cy="-5" r="14" fill="#FFB703"/>
    <path d="M-20,-13 L-20,3 M-25,-8 L-15,-8 M-25,-2 L-15,-2" stroke="#E69500" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sparkles indicating "great deal / bargain" (shíhuì) -->
    <path d="M-50,-40 L-46,-50 L-36,-54 L-46,-58 L-50,-68 L-54,-58 L-64,-54 L-54,-50 Z" fill="#FFB703"/>
    <path d="M50,-20 L53,-27 L60,-30 L53,-33 L50,-40 L47,-33 L40,-30 L47,-27 Z" fill="#FFB703"/>
    <path d="M-60,40 L-58,35 L-53,33 L-58,31 L-60,26 L-62,31 L-67,33 L-62,35 Z" fill="#FFB703" opacity="0.8"/>
  </g>
</svg>