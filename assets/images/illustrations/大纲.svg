<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for depth -->
  <g opacity="0.15">
    <line x1="40" y1="40" x2="40" y2="200" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="80" y1="40" x2="80" y2="200" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="120" y1="40" x2="120" y2="200" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Physical Object: Detailed Blueprint / Outline Document (Dàgāng) -->
  <g transform="translate(48, 32)">
    <!-- Document Base / Shadow -->
    <rect x="12" y="12" width="120" height="160" rx="8" fill="#1E293B" opacity="0.5"/>
    
    <!-- Main Document Sheet -->
    <rect x="8" y="8" width="120" height="160" rx="8" fill="#283548" stroke="#334155" stroke-width="2"/>
    
    <!-- Header Section (Title representation) -->
    <rect x="24" y="24" width="48" height="10" rx="3" fill="#F59E0B"/>
    <rect x="80" y="27" width="32" height="4" rx="2" fill="#64748B"/>

    <!-- Structural Hierarchical Outline (Tree structure representing "Gang" / Framework) -->
    <!-- Level 1 Item 1 -->
    <circle cx="28" cy="56" r="4" fill="#60A5FA"/>
    <line x1="28" y1="60" x2="28" y2="108" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="108" x2="38" y2="108" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <rect x="40" y="52" width="60" height="8" rx="3" fill="#E2E8F0"/>
    
    <!-- Level 2 Sub-item A -->
    <rect x="48" y="70" width="45" height="6" rx="2" fill="#94A3B8"/>
    
    <!-- Level 2 Sub-item B -->
    <rect x="48" y="86" width="55" height="6" rx="2" fill="#94A3B8"/>

    <!-- Level 1 Item 2 -->
    <circle cx="28" cy="124" r="4" fill="#F59E0B"/>
    <line x1="28" y1="128" x2="28" y2="152" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="152" x2="38" y2="152" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <rect x="40" y="120" width="50" height="8" rx="3" fill="#E2E8F0"/>
    
    <!-- Level 2 Sub-item -->
    <rect x="48" y="138" width="40" height="6" rx="2" fill="#94A3B8"/>

    <!-- Floating Accent: Professional Drafting Pen / Stylus pointing to the structure -->
    <g transform="translate(90, 80) rotate(45)">
      <!-- Pen Body -->
      <path d="M 0,-30 L 6,-24 L 2,30 L -2,30 L -6,-24 Z" fill="#F59E0B"/>
      <!-- Pen Tip -->
      <polygon points="0,38 -2,30 2,30" fill="#CBD5E1"/>
      <!-- Grip Detail -->
      <rect x="-2" y="-15" width="4" height="20" fill="#D97706" opacity="0.5"/>
    </g>
  </g>
</svg>