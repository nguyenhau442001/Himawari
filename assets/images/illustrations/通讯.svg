<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative concentric signal waves -->
  <path d="M75 120 C75 95 95 75 120 75 C145 75 165 95 165 120" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M55 120 C55 84 84 55 120 55 C156 55 185 84 185 120" stroke="#242835" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" fill="none"/>

  <!-- Left Communication Node (Terminal/Device) -->
  <g transform="translate(55, 95)">
    <!-- Node Body -->
    <rect x="0" y="0" width="36" height="50" rx="6" fill="#2E364F"/>
    <rect x="4" y="6" width="28" height="32" rx="3" fill="#1A1D24"/>
    <!-- Screen content: wave -->
    <path d="M10 22 L14 16 L18 26 L22 18 L26 22" stroke="#FFA800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Home button / indicator -->
    <circle cx="18" cy="43" r="2" fill="#5A6585"/>
  </g>

  <!-- Right Communication Node (Terminal/Device) -->
  <g transform="translate(149, 95)">
    <!-- Node Body -->
    <rect x="0" y="0" width="36" height="50" rx="6" fill="#2E364F"/>
    <rect x="4" y="6" width="28" height="32" rx="3" fill="#1A1D24"/>
    <!-- Screen content: wave -->
    <path d="M10 22 L14 16 L18 26 L22 18 L26 22" stroke="#FFA800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Home button / indicator -->
    <circle cx="18" cy="43" r="2" fill="#5A6585"/>
  </g>

  <!-- Central Core: Glowing Satellite/Communication Dish representing transmission (通讯) -->
  <g transform="translate(120, 120)">
    <!-- Outer Glow / Base Circle -->
    <circle cx="0" cy="0" r="28" fill="#252B3B" stroke="#353E57" stroke-width="2"/>
    
    <!-- Pulse ring -->
    <circle cx="0" cy="0" r="38" stroke="#FFA800" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>

    <!-- Dish Base Mount -->
    <path d="M-6 16 L6 16 L4 8 L-4 8 Z" fill="#5A6585"/>
    <rect x="-2" y="4" width="4" height="6" fill="#7A87A8"/>

    <!-- Satellite Dish -->
    <path d="M-14 -4 C-14 -14 14 -14 14 -4 C14 2 10 8 0 10 C-10 8 -14 2 -14 -4 Z" fill="#FFA800"/>
    <!-- Inner dish curve/shadow -->
    <path d="M-10 -4 C-10 -10 10 -10 10 -4 C10 0 6 4 0 5 C-6 4 -10 0 -10 -4 Z" fill="#FF8800"/>

    <!-- Signal Emitter Pin & Waves -->
    <circle cx="0" cy="-6" r="2" fill="#1A1D24"/>
    <line x1="0" y1="-6" x2="0" y2="-15" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>

    <!-- Dynamic Signal Arcs (Transmitting/Receiving) -->
    <path d="M-8 -20 C-4 -24 4 -24 8 -20" stroke="#FFA800" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-13 -26 C-7 -31 7 -31 13 -26" stroke="#FF3366" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Connecting Data/Signal Streams (Connecting left & right nodes to center) -->
  <!-- Left stream to center -->
  <path d="M93 112 C100 112 104 116 110 116" stroke="#FFA800" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none"/>
  <!-- Right stream to center -->
  <path d="M147 112 C140 112 136 116 130 116" stroke="#FF3366" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none"/>

  <!-- Floating Data Packets / Nodes -->
  <circle cx="78" cy="90" r="3" fill="#FFA800"/>
  <circle cx="162" cy="90" r="3" fill="#FF3366"/>
  <rect x="117" y="65" width="6" height="6" rx="1.5" transform="rotate(45 120 68)" fill="#FFA800"/>
</svg>