<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 报刊 (Newspapers and Magazines) -->
  <g transform="translate(0, 5)">
    <!-- Background glow/shadow for depth -->
    <ellipse cx="120" cy="185" rx="70" ry="12" fill="#111318" opacity="0.8"/>

    <!-- Bottom item: Folded Newspaper (报) -->
    <g transform="translate(65, 85) rotate(-8)">
      <!-- Newspaper back sheet -->
      <path d="M 10 20 L 90 5 L 110 85 L 30 100 Z" fill="#2E3542"/>
      <!-- Newspaper main body -->
      <rect x="20" y="15" width="80" height="90" rx="2" fill="#E2E8F0"/>
      <!-- Masthead -->
      <rect x="30" y="25" width="60" height="8" rx="1" fill="#3B82F6"/>
      <!-- Text lines / columns -->
      <line x1="30" y1="40" x2="60" y2="40" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="48" x2="50" y2="48" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <rect x="65" y="38" width="25" height="25" rx="1" fill="#CBD5E1"/>
      <line x1="30" y1="70" x2="90" y2="70" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="30" y1="78" x2="80" y2="78" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="30" y1="86" x2="85" y2="86" stroke="#CBD5E1" stroke-width="2"/>
    </g>

    <!-- Top item: Glossy Magazine (刊) overlapping the newspaper -->
    <g transform="translate(85, 60) rotate(6)">
      <!-- Magazine cover spine shadow -->
      <path d="M 18 10 L 25 10 L 25 110 L 18 105 Z" fill="#B91C1C"/>
      <!-- Magazine base -->
      <rect x="22" y="8" width="85" height="100" rx="3" fill="#EF4444"/>
      <!-- Cover photo placeholder -->
      <rect x="32" y="18" width="65" height="50" rx="2" fill="#1E293B"/>
      <circle cx="64" cy="43" r="12" fill="#3B82F6" opacity="0.8"/>
      <path d="M 52 55 L 64 43 L 76 55 Z" fill="#60A5FA"/>
      <!-- Magazine title header -->
      <rect x="32" y="75" width="50" height="6" rx="1" fill="#FFFFFF"/>
      <!-- Subtitle bars -->
      <line x1="32" y1="88" x2="70" y2="88" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="96" x2="60" y2="96" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Accent floating reading glasses / focal element -->
    <g transform="translate(100, 115)">
      <!-- Glasses shadow -->
      <circle cx="20" cy="20" r="16" fill="#000000" opacity="0.3"/>
      <!-- Left lens frame -->
      <circle cx="20" cy="20" r="15" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
      <circle cx="20" cy="20" r="13" fill="#3B82F6" fill-opacity="0.2"/>
      <!-- Right lens frame -->
      <circle cx="56" cy="20" r="15" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
      <circle cx="56" cy="20" r="13" fill="#3B82F6" fill-opacity="0.2"/>
      <!-- Bridge -->
      <path d="M 35 17 C 38 14 38 14 41 17" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <!-- Temples -->
      <path d="M 5 20 C -2 15 -8 5 -12 -2" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Decorative subtle reading sparkles -->
    <path d="M 50 45 L 53 52 L 60 55 L 53 58 L 50 65 L 47 58 L 40 55 L 47 52 Z" fill="#F59E0B" opacity="0.6"/>
    <path d="M 175 105 L 177 109 L 181 111 L 177 113 L 175 117 L 173 113 L 169 111 L 173 109 Z" fill="#3B82F6" opacity="0.7"/>
  </g>
</svg>