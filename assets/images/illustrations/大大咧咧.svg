<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Character Head / Upper Body representation for "dàdaliēliē" (carefree, scatterbrained, nonchalant character) -->
    
    <!-- Background subtle casual aura/lines -->
    <path d="M70,80 Q50,70 40,50" stroke="#3A4252" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M170,80 Q190,70 200,50" stroke="#3A4252" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M50,110 Q30,110 20,100" stroke="#3A4252" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Casual / slightly tilted head -->
    <g transform="rotate(8, 120, 130)">
      
      <!-- Shoulders & Outfit (A bit misaligned/casual outfit: flipped collar) -->
      <path d="M75,190 C75,155 95,145 120,145 C145,145 165,155 165,190 Z" fill="#2E3646"/>
      <!-- Jacket / Shirt details -->
      <path d="M100,145 L115,190" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
      <path d="M140,145 L130,190" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
      <path d="M95,145 L85,130 L105,125 Z" fill="#E5A93B"/> <!-- Mismatched/flipped collar -->
      <path d="M145,145 L155,130 L135,125 Z" fill="#E5A93B"/>
      
      <!-- Neck -->
      <rect x="106" y="118" width="28" height="35" rx="8" fill="#F0C293"/>
      
      <!-- Head / Face (Relaxed, carefree, smiling with eyes closed or whimsical) -->
      <rect x="85" y="65" width="70" height="75" rx="32" fill="#F0C293"/>
      
      <!-- Casual messy hair -->
      <path d="M80,85 C75,60 95,45 120,50 C145,45 165,65 155,90 C165,75 180,90 170,105 C165,65 140,40 120,40 C95,40 75,60 80,85 Z" fill="#D97706"/>
      <path d="M110,43 C120,30 140,35 145,48" stroke="#D97706" stroke-width="6" stroke-linecap="round" fill="none"/>

      <!-- Carefree closed eyes (happy / unbothered arcs ^ ^) -->
      <path d="M100,92 Q107,85 114,92" stroke="#4A3525" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M126,92 Q133,85 140,92" stroke="#4A3525" stroke-width="3.5" stroke-linecap="round" fill="none"/>

      <!-- Rosy cheeks -->
      <circle cx="99" cy="103" r="7" fill="#F87171" opacity="0.6"/>
      <circle cx="141" cy="103" r="7" fill="#F87171" opacity="0.6"/>

      <!-- Wide carefree open mouth -->
      <path d="M110,110 Q120,124 130,110 Z" fill="#4A3525"/>
      <path d="M114,113 Q120,120 126,113" fill="#F87171"/>

    </g>

    <!-- Floating "scatterbrained" / careless symbols (keys, dropped items) floating casually -->
    <g transform="translate(165, 95) rotate(25)">
      <!-- Dropped Key representing "丢三落四" (forgetful/scatterbrained trait) -->
      <circle cx="0" cy="0" r="8" fill="none" stroke="#E5A93B" stroke-width="3"/>
      <line x1="6" y1="5" x2="18" y2="17" stroke="#E5A93B" stroke-width="3" stroke-linecap="round"/>
      <line x1="13" y1="12" x2="10" y2="15" stroke="#E5A93B" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="15" x2="13" y2="18" stroke="#E5A93B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Motion / careless shrug lines -->
    <path d="M65,160 Q55,150 48,155" stroke="#E5A93B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M175,160 Q185,150 192,155" stroke="#E5A93B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="45" cy="153" r="2.5" fill="#E5A93B"/>
    <circle cx="195" cy="153" r="2.5" fill="#E5A93B"/>
    
    <!-- Little musical note / carefree vibe symbol -->
    <path d="M70,55 L70,40 L82,37 L82,52" stroke="#3A4252" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="67" cy="53" r="3.5" fill="#3A4252"/>
    <circle cx="79" cy="50" r="3.5" fill="#3A4252"/>
  </g>
</svg>