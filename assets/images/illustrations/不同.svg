<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Ground line / base platform -->
    <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Object 1 (Left): Tall Cylindrical Vase in Teal -->
    <g transform="translate(65, 110)">
      <!-- Vase Body -->
      <path d="M-15 0 C-15 50 -10 65 -10 70 L10 70 C10 65 15 50 15 0 Z" fill="#2DD4BF" opacity="0.9"/>
      <!-- Vase Neck & Rim -->
      <path d="M-10 0 L10 0 L8 -12 L-8 -12 Z" fill="#5EEAD4"/>
      <ellipse cx="0" cy="-12" rx="8" ry="2.5" fill="#99F6E4"/>
      <!-- Decorative pattern on vase -->
      <circle cx="0" cy="30" r="3" fill="#1A1D24" opacity="0.3"/>
      <circle cx="0" cy="45" r="3" fill="#1A1D24" opacity="0.3"/>
      
      <!-- Plant / Stem coming out -->
      <path d="M0 -12 C0 -30 -15 -40 -20 -45" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M0 -12 C0 -30 15 -40 20 -45" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Leaves -->
      <path d="M-20 -45 C-30 -45 -35 -30 -20 -30 C-15 -30 -18 -40 -20 -45 Z" fill="#22C55E"/>
      <path d="M20 -45 C30 -45 35 -30 20 -30 C15 -30 18 -40 20 -45 Z" fill="#22C55E"/>
    </g>

    <!-- Object 2 (Right): Wide Rounded Bowl in Orange/Gold (High Contrast) -->
    <g transform="translate(175, 125)">
      <!-- Bowl Body -->
      <path d="M-28 15 C-28 45 28 45 28 15 Z" fill="#FB923C" opacity="0.9"/>
      <ellipse cx="0" cy="15" rx="28" ry="6" fill="#FDBA74"/>
      
      <!-- Cactus / Round plant inside bowl -->
      <circle cx="0" cy="-5" r="16" fill="#38BDF8"/>
      <circle cx="-8" cy="2" r="10" fill="#0EA5E9"/>
      <circle cx="8" cy="2" r="10" fill="#0EA5E9"/>
      
      <!-- Cactus details (dots/spikes) -->
      <circle cx="0" cy="-10" r="1.5" fill="#E0F2FE"/>
      <circle cx="-5" cy="-2" r="1.5" fill="#E0F2FE"/>
      <circle cx="5" cy="-2" r="1.5" fill="#E0F2FE"/>
      <circle cx="-10" cy="6" r="1.5" fill="#E0F2FE"/>
      <circle cx="10" cy="6" r="1.5" fill="#E0F2FE"/>
    </g>

    <!-- Difference / Contrast Indicator (Visualizing "不 同" - Not The Same) -->
    <g transform="translate(120, 115)">
      <!-- Subtle dividing axis / comparison zone -->
      <line x1="0" y1="-50" x2="0" y2="40" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      
      <!-- Distinct contrast symbol in gold/orange accent -->
      <circle cx="0" cy="-5" r="16" fill="#1A1D24" stroke="#F59E0B" stroke-width="2.5"/>
      
      <!-- Crossed / Not-equal stylized indicator inside circle -->
      <path d="M-7 -10 L7 0" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-7 0 L7 10" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>