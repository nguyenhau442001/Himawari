<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Illustration for "承接" (Receiving / Undertaking a project or responsibility) -->
  <!-- Background subtle grid/structure representing municipal engineering / blueprint -->
  <g opacity="0.15" stroke="#4F5D75" stroke-width="1" stroke-dasharray="3 3">
    <line x1="30" y1="60" x2="210" y2="60" />
    <line x1="30" y1="120" x2="210" y2="120" />
    <line x1="30" y1="180" x2="210" y2="180" />
    <line x1="60" y1="30" x2="60" y2="210" />
    <line x1="120" y1="30" x2="120" y2="210" />
    <line x1="180" y1="30" x2="180" y2="210" />
  </g>

  <!-- Central Physical Object: Architectural blueprint / Municipal project scroll transitioning into firm hands (Contract/Project Undertaking) -->
  
  <!-- Blueprint Document Base -->
  <g transform="translate(60, 45)">
    <!-- Document shadow/back -->
    <rect x="10" y="5" width="100" height="120" rx="6" fill="#2A2F3D" />
    <!-- Main Blueprint Paper -->
    <rect x="5" y="0" width="100" height="120" rx="6" fill="#323B52" stroke="#4F6EF2" stroke-width="2" />
    
    <!-- Blueprint graphics (Municipal engineering lines) -->
    <path d="M 20 25 L 50 25 L 60 40 L 90 40" fill="none" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="55" width="30" height="40" rx="2" fill="none" stroke="#63B3ED" stroke-width="2"/>
    <circle cx="80" cy="75" r="15" fill="none" stroke="#63B3ED" stroke-width="2"/>
    
    <!-- Gold Accent Seal / Stamp representing official agreement/contract acceptance -->
    <circle cx="85" cy="95" r="10" fill="#F6AD55" />
    <path d="M 81 95 L 84 98 L 90 91" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The Act of "Receiving/Taking Over" (Strong, professional hands accepting the project) -->
  <g transform="translate(0, 10)">
    <!-- Left Hand (Passing / Assigning) -->
    <path d="M 35 115 C 35 105, 50 100, 60 105 C 70 110, 75 115, 80 125 L 75 130 C 70 123, 60 118, 50 118 C 45 118, 40 122, 40 128 Z" fill="#E2E8F0" opacity="0.4"/>
    
    <!-- Right Hands (Firmly Receiving / Undertaking - 承接) -->
    <!-- Lower/Supporting Hands -->
    <path d="M 75 160 C 95 160, 115 155, 135 145 L 140 155 C 115 170, 95 175, 70 170 Z" fill="#CBD5E0" />
    
    <!-- Main Accepting Hands (Sleek flat vector style with high-contrast accent cuffs) -->
    <!-- Left receiving hand -->
    <path d="M 55 135 Q 75 130 95 135 L 90 148 Q 75 145 60 148 Z" fill="#FEEBC8" />
    <path d="M 50 137 L 60 148 L 55 158 C 45 155, 42 145, 50 137 Z" fill="#DD6B20" /> <!-- Cuff -->

    <!-- Right receiving hand -->
    <path d="M 145 135 Q 125 130 105 135 L 110 148 Q 125 145 140 148 Z" fill="#FEEBC8" />
    <path d="M 150 137 L 140 148 L 145 158 C 155 155, 158 145, 150 137 Z" fill="#DD6B20" /> <!-- Cuff -->
  </g>

  <!-- Dynamic Focus Elements (Golden energy/spark representing successful undertaking/commitment) -->
  <circle cx="120" cy="115" r="3" fill="#F6AD55" />
  <circle cx="160" cy="85" r="2" fill="#F6AD55" opacity="0.8" />
  <circle cx="70" cy="75" r="2" fill="#63B3ED" />
</svg>