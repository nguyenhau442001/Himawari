<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Visualizing "间" (Space/Interval/Room) as a structural division/progression -->
  <!-- Using a series of architectural portals/frames to represent the concept of 'between' or 'a space within' -->
  
  <g fill="none" stroke="#FFB800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame 1: Baseline -->
    <path d="M60 180 V80 H100 V180" opacity="0.4"/>
    
    <!-- Frame 2: Progression/Interval -->
    <path d="M100 160 V60 H140 V160" opacity="0.7"/>
    
    <!-- Frame 3: The Focus/The "Room" (The peak/the specific space) -->
    <path d="M140 140 V40 H180 V140" stroke-width="4"/>
    
    <!-- Connecting lines to show the progression/causality of space -->
    <path d="M80 180 L120 160 L160 140" stroke-dasharray="4 4" opacity="0.5"/>
  </g>
  
  <!-- Accent highlight for the specific "room" or "interval" -->
  <rect x="145" y="45" width="30" height="90" fill="#FFB800" opacity="0.2"/>
  
  <!-- Minimalist architectural detail to imply the 'room' aspect without generic office clutter -->
  <path d="M150 120 H170 M150 100 H170 M150 80 H170" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
</svg>