<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="8"/>
  
  <!-- Character Hands -->
  <g transform="translate(40, 60)">
    <!-- Left Hand -->
    <path d="M40 100 C 20 100, 10 120, 20 140 L 40 140 Z" fill="#fcd34d"/>
    <path d="M30 110 L 20 100 L 10 110 L 20 120 Z" fill="#fcd34d"/>
    
    <!-- Right Hand -->
    <path d="M120 100 C 140 100, 150 120, 140 140 L 120 140 Z" fill="#fcd34d"/>
    <path d="M130 110 L 140 100 L 150 110 L 140 120 Z" fill="#fcd34d"/>
  </g>
  
  <!-- Bread -->
  <g transform="translate(60, 130)">
    <!-- Left Half -->
    <path d="M0 0 C -10 -30, 40 -30, 50 0 L 50 20 L 0 20 Z" fill="#fb923c"/>
    <path d="M5 5 C 10 0, 40 0, 45 5" stroke="#92400e" stroke-width="2" fill="none"/>
    
    <!-- Right Half -->
    <path d="M60 0 C 70 -30, 120 -30, 130 0 L 130 20 L 60 20 Z" fill="#fb923c"/>
    <path d="M65 5 C 70 0, 100 0, 105 5" stroke="#92400e" stroke-width="2" fill="none"/>
    
    <!-- Crumbs -->
    <circle cx="55" cy="15" r="2" fill="#fbbf24"/>
    <circle cx="58" cy="22" r="1.5" fill="#fbbf24"/>
  </g>
  
  <!-- Background Decor -->
  <circle cx="200" cy="40" r="30" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <path d="M180 40 L 220 40 M 200 20 L 200 60" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Warm Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.1"/>
</svg>