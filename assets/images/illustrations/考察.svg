<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 190, 160 190, 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Expert 1 (The observer) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 40 L 30 40 L 35 100 L 5 100 Z" fill="#38bdf8"/>
    <rect x="15" y="100" width="10" height="30" fill="#38bdf8"/>
    <path d="M20 35 L 35 50 L 20 60" stroke="#1e293b" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Expert 2 (The note taker) -->
  <g transform="translate(120, 110)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M5 40 L 35 40 L 30 100 L 10 100 Z" fill="#ec4899"/>
    <rect x="25" y="50" width="20" height="15" fill="#f1f5f9" rx="2"/>
    <path d="M30 55 L 40 55 M30 60 L 40 60" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Local Environment Details -->
  <!-- Plant/Tree -->
  <path d="M180 200 L 180 140 M180 140 L 160 120 M180 140 L 200 120" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="120" r="10" fill="#10b981"/>
  <circle cx="200" cy="120" r="10" fill="#10b981"/>
  
  <!-- Clipboard/Tool -->
  <rect x="90" y="140" width="20" height="25" fill="#fb923c" rx="2"/>
  <path d="M95 145 L 105 145 M95 150 L 105 150" stroke="#fff" stroke-width="2"/>
  
  <!-- Distant Landscape -->
  <path d="M0 180 L 40 140 L 80 170 L 120 130 L 160 160 L 240 150 L 240 200 L 0 200 Z" fill="#1e293b" opacity="0.5"/>
  
  <!-- Sun/Light -->
  <circle cx="200" cy="40" r="20" fill="#f59e0b" opacity="0.3"/>
