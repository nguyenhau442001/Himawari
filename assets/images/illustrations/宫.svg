<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural Glow / Background Elements -->
  <circle cx="120" cy="130" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Imperial Palace (Gong - 宫) Illustration -->
  <g transform="translate(0, 10)">
    <!-- Base Platform / Terraces (Hanmuchui/Yuetai) -->
    <path d="M 50,165 L 190,165 L 180,185 L 60,185 Z" fill="#3E4452"/>
    <path d="M 40,185 L 200,185 L 210,205 L 30,205 Z" fill="#2C313A"/>
    
    <!-- White Stone Railings (Simplified classical balustrades) -->
    <path d="M 45,185 H 195" stroke="#8D96A0" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 35,205 H 205" stroke="#8D96A0" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Main Hall Structure (Body) -->
    <rect x="65" y="115" width="110" height="50" fill="#B23B3B"/>
    
    <!-- Traditional Pillars (Red columns) -->
    <rect x="80" y="115" width="6" height="50" fill="#7D2323"/>
    <rect x="100" y="115" width="6" height="50" fill="#7D2323"/>
    <rect x="134" y="115" width="6" height="50" fill="#7D2323"/>
    <rect x="154" y="115" width="6" height="50" fill="#7D2323"/>

    <!-- Doors and Windows (Recessed dark areas) -->
    <rect x="91" y="130" width="13" height="35" fill="#1A1D24"/>
    <rect x="110" y="130" width="20" height="35" fill="#1A1D24"/>
    <rect x="136" y="130" width="13" height="35" fill="#1A1D24"/>

    <!-- Gold Accents on Architecture (Liangfang / Beam decorations) -->
    <rect x="65" y="115" width="110" height="5" fill="#D4AF37"/>
    <rect x="65" y="155" width="110" height="4" fill="#D4AF37"/>

    <!-- Lower Roof -->
    <path d="M 55,115 Q 120,105 185,115 L 195,125 Q 120,118 45,125 Z" fill="#323842"/>
    <path d="M 45,125 L 195,125 L 190,132 L 50,132 Z" fill="#D4AF37"/>

    <!-- Grand Imperial Roof (Upper Curved Roof with Gold Ridge) -->
    <path d="M 50,85 Q 120,65 190,85 L 205,100 Q 120,80 35,100 Z" fill="#B85D13"/>
    <path d="M 35,100 L 205,100 L 195,115 Q 120,95 45,115 Z" fill="#E07A26"/>
    
    <!-- Golden Roof Ridge and Chiwen (Roof ornaments) -->
    <path d="M 75,85 Q 120,73 165,85" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <polygon points="50,85 45,75 55,82" fill="#D4AF37"/>
    <polygon points="190,85 195,75 185,82" fill="#D4AF37"/>
  </g>

  <!-- Atmospheric / Accent Details -->
  <!-- Subtle decorative glowing sun/moon in background -->
  <circle cx="120" cy="50" r="16" fill="#D4AF37" opacity="0.15"/>
</svg>