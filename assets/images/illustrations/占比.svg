<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Outer container / base platform -->
    <ellipse cx="0" cy="55" rx="75" ry="16" fill="#252A34"/>
    <ellipse cx="0" cy="55" rx="65" ry="12" fill="#1A1D24" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Giant Physical Coin representing total volume/mass -->
    <!-- Coin back rim -->
    <path d="M -50 0 A 50 20 0 0 0 50 0 L 50 40 A 50 20 0 0 1 -50 40 Z" fill="#1E232D" stroke="#D4AF37" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="#2E3646" stroke="#D4AF37" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="38" ry="14" fill="#232833" stroke="#D4AF37" stroke-dasharray="4 3" stroke-width="1.5"/>

    <!-- Physical High-Tech Segment Block (The "占比" - specific proportion part) -->
    <!-- 3D Extruded Pie/Sector Block carved from the coin, lifting up -->
    <g transform="translate(0, -35)">
      <!-- Back inner depth -->
      <path d="M 0 0 L 25 -25 A 50 20 0 0 0 -35 -35 L 0 0" fill="#E67E22" opacity="0.6"/>
      <path d="M 0 0 L 0 -45 A 50 20 0 0 0 -35 -35 L 0 0" fill="#D35400" opacity="0.4"/>
      
      <!-- Side walls of the highlighted sector -->
      <path d="M 0 15 L 0 -15 L 38 -38 L 38 -8 Z" fill="#CA6F1E"/>
      <path d="M 0 15 L 0 -15 L -35 -35 L -35 -5 Z" fill="#BA4A00"/>
      
      <!-- Top surface of the proportion wedge -->
      <path d="M 0 0 L 38 -22 A 44 17 0 0 1 -35 -20 Z" fill="#F39C12" stroke="#F1C40F" stroke-width="2"/>
      
      <!-- High-tech chip circuit lines on top of the wedge -->
      <path d="M 0 -5 L 12 -12 M 15 -10 L 22 -14" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <circle cx="12" cy="-12" r="2" fill="#FFF"/>
      <circle cx="22" cy="-14" r="2" fill="#FFF"/>
    </g>
    
    <!-- Floating Sparkle/Focus elements -->
    <g transform="translate(42, -5)">
      <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#F1C40F"/>
    </g>
    <g transform="translate(-48, -20) scale(0.6)">
      <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#F39C12"/>
    </g>
  </g>
</svg>