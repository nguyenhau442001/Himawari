<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="teacherGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed container with gradient background -->
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Back wall -->
  <rect x="0" y="0" width="240" height="170" fill="#36455a"/>
  <!-- Floor -->
  <rect x="0" y="170" width="240" height="70" fill="#2d3a4b"/>

  <!-- Whiteboard/Screen behind teacher -->
  <rect x="60" y="40" width="120" height="80" rx="8" fill="#4a5568"/>
  <rect x="65" y="45" width="110" height="70" rx="6" fill="#e2e8f0"/>
  <!-- Subtle screen content (abstract shapes, not text) -->
  <circle cx="90" cy="65" r="8" fill="#38bdf8"/>
  <rect x="105" y="70" width="40" height="10" rx="3" fill="#10b981"/>
  <path d="M155 60 L165 70 L155 80 Z" fill="#ec4899"/>

  <!-- Teacher's podium/desk -->
  <rect x="90" y="135" width="60" height="40" rx="6" fill="#4a5568"/>
  <rect x="85" y="130" width="70" height="10" rx="4" fill="#5a677d"/>

  <!-- Teacher character -->
  <!-- Body (suit/dress shirt) -->
  <rect x="100" y="80" width="40" height="60" rx="8" fill="#60a5fa"/>
  <!-- Collar/tie -->
  <path d="M115 80 L125 80 L120 90 Z" fill="#fbbf24"/>
  <!-- Head -->
  <circle cx="120" cy="65" r="18" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M102 55 C95 45, 120 40, 138 55 L138 65 L102 65 Z" fill="#a0aec0"/>
  <!-- Arms & Hands (one gesturing, one resting) -->
  <path d="M100 90 Q90 100, 95 115 L100 120 L105 110 L100 90 Z" fill="#4a90e2"/> <!-- Left arm -->
  <circle cx="97" cy="118" r="6" fill="#fbcfe8"/> <!-- Left hand -->
  <path d="M140 90 Q150 100, 145 115 L140 120 L135 110 L140 90 Z" fill="#4a90e2"/> <!-- Right arm -->
  <circle cx="143" cy="118" r="6" fill="#fbcfe8"/> <!-- Right hand -->
  <!-- Face details (simple, kind expression) -->
  <circle cx="115" cy="62" r="2.5" fill="#334155"/>
  <circle cx="125" cy="62" r="2.5" fill="#334155"/>
  <path d="M115 70 Q120 73, 125 70" stroke="#334155" stroke-width="2" fill="none"/> <!-- Smile -->

  <!-- Students characters (3 students showing respect) -->

  <!-- Student 1 (front left, slightly leaning forward) -->
  <rect x="20" y="160" width="30" height="50" rx="7" fill="#10b981"/>
  <circle cx="35" cy="145" r="14" fill="#fbcfe8"/>
  <path d="M20 138 C18 130, 35 125, 50 138 L50 145 L20 145 Z" fill="#6b46c1"/>
  <path d="M28 150 Q35 155, 42 150" stroke="#334155" stroke-width="1.5" fill="none"/> <!-- Attentive mouth -->
  <circle cx="32" cy="142" r="2" fill="#334155"/>
  <circle cx="38" cy="142" r="2" fill="#334155"/>
  <!-- Arms (clasped politely) -->
  <rect x="25" y="170" width="10" height="25" rx="4" fill="#0e9f6e"/>
  <rect x="35" y="170" width="10" height="25" rx="4" fill="#0e9f6e"/>

  <!-- Student 2 (front right, hands on lap/desk) -->
  <rect x="190" y="160" width="30" height="50" rx="7" fill="#a78bfa"/>
  <circle cx="205" cy="145" r="14" fill="#fbcfe8"/>
  <path d="M190 138 C188 130, 205 125, 220 138 L220 145 L190 145 Z" fill="#fbbf24"/>
  <path d="M198 150 Q205 155, 212 150" stroke="#334155" stroke-width="1.5" fill="none"/>
  <circle cx="202" cy="142" r="2" fill="#334155"/>
  <circle cx="208" cy="142" r="2" fill="#334155"/>
  <!-- Arms (resting) -->
  <rect x="195" y="170" width="10" height="25" rx="4" fill="#8b5cf6"/>
  <rect x="205" y="170" width="10" height="25" rx="4" fill="#8b5cf6"/>

  <!-- Student 3 (middle back, slightly smaller, thoughtful) -->
  <rect x="100" y="180" width="25" height="40" rx="6" fill="#38bdf8"/>
  <circle cx="112.5" cy="168" r="12" fill="#fbcfe8"/>
  <path d="M100 162 C98 155, 112.5 150, 125 162 L125 168 L100 168 Z" fill="#fb923c"/>
  <path d="M108 172 Q112.5 174, 117 172" stroke="#334155" stroke-width="1.2" fill="none"/>
  <circle cx="110" cy="165" r="1.5" fill="#334155"/>
  <circle cx="115" cy="165" r="1.5" fill="#334155"/>
  <!-- Arms (attentive) -->
  <rect x="103" y="185" width="8" height="20" rx="3" fill="#0ea5e9"/>
  <rect x="114" y="185" width="8" height="20" rx="3" fill="#0ea5e9"/>

  <!-- Subtle glow around the teacher to emphasize their presence -->
  <circle cx="120" cy="90" r="60" fill="url(#teacherGlow)"/>

</svg>