<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background architectural/grid lines for tech enterprise theme -->
  <g opacity="0.1" stroke="#4F46E5" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="180" x2="200" y2="180"/>
    <line x1="120" y1="60" x2="120" y2="180"/>
  </g>

  <!-- Ground foundation / Platform -->
  <path d="M 60 180 L 180 180 C 190 180, 195 185, 190 190 C 185 195, 55 195, 50 190 C 45 185, 50 180, 60 180 Z" fill="#2D3748"/>
  <rect x="70" y="175" width="100" height="5" rx="2" fill="#4A5568"/>

  <!-- Modern Tech Enterprise Building (Representing the founded institution/company) -->
  <g>
    <!-- Main building body -->
    <path d="M 85 90 L 155 90 L 165 175 L 75 175 Z" fill="#252F3F"/>
    
    <!-- Glass facade panels (dark cyan/blue) -->
    <path d="M 92 100 L 148 100 L 154 168 L 86 168 Z" fill="#1E293B"/>
    
    <!-- Architectural grid / windows -->
    <g fill="#38BDF8" opacity="0.8">
      <!-- Row 1 -->
      <rect x="98" y="108" width="11" height="16" rx="2"/>
      <rect x="114.5" y="108" width="11" height="16" rx="2"/>
      <rect x="131" y="108" width="11" height="16" rx="2"/>
      
      <!-- Row 2 -->
      <rect x="96" y="130" width="11" height="16" rx="2"/>
      <rect x="113" y="130" width="11" height="16" rx="2"/>
      <rect x="130" y="130" width="11" height="16" rx="2"/>
      
      <!-- Row 3 -->
      <rect x="94" y="152" width="11" height="12" rx="2"/>
      <rect x="111.5" y="152" width="11" height="12" rx="2"/>
      <rect x="129" y="152" width="11" height="12" rx="2"/>
    </g>

    <!-- Entrance canopy -->
    <path d="M 105 168 L 135 168 L 138 175 L 102 175 Z" fill="#F59E0B"/>
  </g>

  <!-- Futuristic / Innovation glowing node on top of the building (Startup/Innovation element) -->
  <g>
    <circle cx="120" cy="70" r="12" fill="#F59E0B" opacity="0.2"/>
    <circle cx="120" cy="70" r="7" fill="#F59E0B"/>
    <circle cx="120" cy="70" r="3" fill="#FFFFFF"/>
    <!-- Radiating connection beams -->
    <path d="M 120 78 L 120 90" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 108 65 L 95 55" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 132 65 L 145 55" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="95" cy="55" r="2.5" fill="#38BDF8"/>
    <circle cx="145" cy="55" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Collaborative hands/figures at the base building it (representing "联手创办" - joint founding) -->
  <g>
    <!-- Left founder figure -->
    <path d="M 55 175 C 55 160, 65 150, 75 150 C 85 150, 90 160, 90 175 Z" fill="#4F46E5"/>
    <circle cx="72.5" cy="140" r="7" fill="#CBD5E1"/>

    <!-- Right founder figure -->
    <path d="M 150 175 C 150 160, 155 150, 165 150 C 175 150, 185 160, 185 175 Z" fill="#3B82F6"/>
    <circle cx="167.5" cy="140" r="7" fill="#CBD5E1"/>
    
    <!-- Action/creation sparks at the base of the enterprise -->
    <path d="M 68 165 L 82 172" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 172 165 L 158 172" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>