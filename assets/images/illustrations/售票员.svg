<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background ticket booth counter / partition -->
  <path d="M40 180 L200 180 L200 135 L170 120 L70 120 L40 135 Z" fill="#242B38"/>
  <rect x="60" y="145" width="120" height="40" rx="4" fill="#2C3545"/>
  
  <!-- Glass barrier with ticket window opening -->
  <path d="M80 70 L160 70 L160 130 L80 130 Z" fill="#38445C" fill-opacity="0.25"/>
  <path d="M95 105 L145 105 L145 130 L95 130 Z" fill="#1A1D24" fill-opacity="0.4"/>

  <!-- Ticket Seller Character (售票员) -->
  <!-- Torso & Uniform -->
  <path d="M90 180 L150 180 L140 135 L100 135 Z" fill="#2563EB"/>
  <!-- Collar & Necktie -->
  <polygon points="120,135 110,148 130,148" fill="#FFFFFF"/>
  <polygon points="117,148 123,148 125,170 120,175 115,170" fill="#EF4444"/>
  
  <!-- Head & Face -->
  <circle cx="120" cy="108" r="22" fill="#FDE047"/>
  <!-- Friendly Smile -->
  <path d="M112 116 Q120 123 128 116" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <circle cx="112" cy="104" r="2.5" fill="#1F2937"/>
  <circle cx="128" cy="104" r="2.5" fill="#1F2937"/>

  <!-- Service Hat -->
  <path d="M97 93 C97 93 120 86 143 93 L149 84 C149 84 120 78 91 84 Z" fill="#1E40AF"/>
  <ellipse cx="120" cy="87" rx="24" ry="5" fill="#1D4ED8"/>
  <ellipse cx="120" cy="86" rx="10" ry="2" fill="#F59E0B"/>

  <!-- Action: Holding/Issuing a train ticket -->
  <!-- Hand & Arm -->
  <path d="M140 145 C150 150 160 140 165 135" stroke="#FDE047" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Train Ticket (Highlight item representing 售票员) -->
  <g transform="translate(150, 115) rotate(-15)">
    <rect width="45" height="26" rx="4" fill="#F8FAFC"/>
    <circle cx="8" cy="13" r="3" fill="#1A1D24"/>
    <circle cx="37" cy="13" r="3" fill="#1A1D24"/>
    <line x1="14" y1="9" x2="31" y2="9" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="17" x2="25" y2="17" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent glow / focus element on ticket counter -->
  <circle cx="120" cy="200" r="2" fill="#3B82F6" opacity="0"/>
</svg>