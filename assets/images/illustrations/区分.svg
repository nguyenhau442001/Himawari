<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Desk Lamp -->
    <radialGradient id="lamp-glow" cx="120" cy="90" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Folder A Color Gradient -->
    <linearGradient id="folder-a" x1="45" y1="120" x2="85" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Folder B Color Gradient -->
    <linearGradient id="folder-b" x1="155" y1="120" x2="195" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>

    <!-- Window City View Gradient -->
    <linearGradient id="window-grad" x1="30" y1="20" x2="30" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Environmental Context: Office Window showing evening city -->
  <rect x="25" y="25" width="55" height="65" rx="4" fill="url(#window-grad)" stroke="#475569" stroke-width="2"/>
  <line x1="52" y1="25" x2="52" y2="90" stroke="#475569" stroke-width="2"/>
  <line x1="25" y1="55" x2="80" y2="55" stroke="#475569" stroke-width="2"/>
  <!-- City building lights outside window -->
  <rect x="32" y="35" width="6" height="10" rx="1" fill="#fbbf24" opacity="0.6"/>
  <rect x="42" y="40" width="6" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="60" y="38" width="6" height="15" rx="1" fill="#fbbf24" opacity="0.5"/>
  <rect x="68" y="45" width="6" height="8" rx="1" fill="#f43f5e" opacity="0.6"/>

  <!-- Shelves on the back wall -->
  <rect x="140" y="30" width="75" height="6" rx="2" fill="#334155"/>
  <path d="M150 30 L150 20 L165 20 L165 30 Z" fill="#10b981"/>
  <path d="M175 30 L175 15 L190 15 L190 30 Z" fill="#f59e0b"/>
  <circle cx="202" cy="24" r="5" fill="#ec4899"/>

  <!-- Ambient Light from Lamp -->
  <circle cx="120" cy="90" r="90" fill="url(#lamp-glow)" pointer-events="none"/>

  <!-- Hanging Desk Lamp -->
  <path d="M120 0 L120 40" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M95 40 L145 40 L155 52 L85 52 Z" fill="#475569"/>
  <ellipse cx="120" cy="52" rx="35" ry="12" fill="#fbbf24" opacity="0.9"/>

  <!-- Office Desk Surface -->
  <path d="M10 185 L230 185 L220 220 L20 220 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="15" y="178" width="210" height="8" rx="2" fill="#475569"/>

  <!-- Two distinct cases/folders being sorted (Visualizing "区分" - differentiating two situations) -->
  <!-- Case A (Blue Folder with Document Icons) -->
  <g transform="translate(45, 125)">
    <path d="M0 10 C0 4 4 0 10 0 L30 0 L40 10 L60 10 C66 10 70 14 70 20 L70 50 C70 56 66 60 60 60 L10 60 C4 60 0 56 0 50 Z" fill="url(#folder-a)"/>
    <rect x="12" y="20" width="22" height="4" rx="2" fill="#e0f2fe"/>
    <rect x="12" y="30" width="35" height="4" rx="2" fill="#e0f2fe"/>
    <rect x="12" y="40" width="28" height="4" rx="2" fill="#e0f2fe"/>
  </g>

  <!-- Case B (Pink Folder with Different Document Icons) -->
  <g transform="translate(125, 125)">
    <path d="M0 10 C0 4 4 0 10 0 L30 0 L40 10 L60 10 C66 10 70 14 70 20 L70 50 C70 56 66 60 60 60 L10 60 C4 60 0 56 0 50 Z" fill="url(#folder-b)"/>
    <circle cx="22" cy="30" r="8" fill="#fce7f3"/>
    <rect x="36" y="26" width="22" height="4" rx="2" fill="#fce7f3"/>
    <rect x="36" y="36" width="16" height="4" rx="2" fill="#fce7f3"/>
  </g>

  <!-- Sorting / Analyzing Divider (representing criteria or distinction) -->
  <path d="M117 115 L123 115 L125 185 L115 185 Z" fill="#fbbf24" opacity="0.8"/>
  <circle cx="120" cy="115" r="5" fill="#f59e0b"/>

  <!-- Main Character: Focused Professional analyzing and sorting -->
  <!-- Body/Torso (Teal Shirt) -->
  <path d="M95 185 C95 160 105 145 120 145 C135 145 145 160 145 185 Z" fill="#0d9488"/>
  <path d="M110 145 L120 165 L130 145 Z" fill="#ccfbf1"/>

  <!-- Neck -->
  <rect x="113" y="132" width="14" height="15" fill="#fcd34d"/>

  <!-- Head -->
  <circle cx="120" cy="118" r="18" fill="#fcd34d"/>

  <!-- Hair (Stylish dark slate) -->
  <path d="M102 118 C102 102 110 100 120 100 C130 100 138 102 138 118 C138 122 136 115 136 110 C136 103 129 102 120 102 C111 102 104 103 104 110 C104 115 102 122 102 118 Z" fill="#334155"/>

  <!-- Facial expression: Thoughtful, focused eyebrows -->
  <line x1="110" y1="113" x2="116" y2="115" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="115" x2="130" y2="113" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes (Dots of focus) -->
  <circle cx="113" cy="120" r="2" fill="#1e293b"/>
  <circle cx="127" cy="120" r="2" fill="#1e293b"/>
  <!-- Gentle focused mouth -->
  <path d="M117 127 Q120 130 123 127" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms pointing / comparing the two scenarios -->
  <!-- Left Arm reaching toward Blue Folder -->
  <path d="M98 155 L65 150 L55 135" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="135" r="4" fill="#fcd34d"/>

  <!-- Right Arm reaching toward Pink Folder -->
  <path d="M142 155 L170 150 L180 135" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="135" r="4" fill="#fcd34d"/>

  <!-- Magnifying Glass / Analysis Tool held in hand or floating to emphasize distinction -->
  <g transform="translate(112, 160) scale(0.75)">
    <circle cx="10" cy="10" r="14" fill="none" stroke="#e2e8f0" stroke-width="5"/>
    <circle cx="10" cy="10" r="14" fill="#38bdf8" fill-opacity="0.2"/>
    <line x1="20" y1="20" x2="32" y2="32" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>