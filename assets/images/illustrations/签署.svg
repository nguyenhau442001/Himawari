<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Desk Light Glow -->
    <radialGradient id="deskLight" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadow for Paper -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Environment: Office Wall & Ambient Glow -->
  <rect x="0" y="0" width="240" height="150" fill="#111827" opacity="0.4" />
  <rect width="240" height="240" rx="24" fill="url(#deskLight)" />

  <!-- Background Decor: Office Window with City Silhouette -->
  <g opacity="0.25">
    <rect x="160" y="25" width="55" height="85" rx="4" fill="#38bdf8" />
    <rect x="165" y="30" width="20" height="35" fill="#0f172a" />
    <rect x="190" y="30" width="20" height="35" fill="#0f172a" />
    <rect x="165" y="70" width="20" height="35" fill="#0f172a" />
    <rect x="190" y="70" width="20" height="35" fill="#0f172a" />
  </g>

  <!-- Bookshelf / Plant Decor in Background -->
  <circle cx="45" cy="45" r="12" fill="#10b981" opacity="0.6" />
  <path d="M35 55 Q45 40 55 55 Z" fill="#334155" />
  <rect x="25" y="80" width="35" height="6" rx="3" fill="#334155" opacity="0.5" />

  <!-- Wooden Meeting Table -->
  <path d="M 20 165 L 220 165 L 205 210 L 35 210 Z" fill="#334155" />
  <path d="M 15 155 L 225 155 L 220 165 L 20 165 Z" fill="#475569" />
  <!-- Table Wood Highlight -->
  <path d="M 25 157 L 215 157 L 212 163 L 28 163 Z" fill="#64748b" opacity="0.6" />

  <!-- CENTRAL PROP: The Agreement Document with Golden Seal -->
  <g filter="url(#shadow)">
    <!-- Folder / Base -->
    <polygon points="75,135 165,135 175,185 65,185" fill="#0284c7" />
    <polygon points="70,130 170,130 175,135 65,135" fill="#0369a1" />
    
    <!-- Open Contract Papers -->
    <path d="M 80,125 L 160,125 L 165,175 L 75,175 Z" fill="url(#docGrad)" />
    <!-- Mock text lines on document -->
    <line x1="90" y1="137" x2="130" y2="137" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="90" y1="147" x2="145" y2="147" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="90" y1="155" x2="120" y2="155" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    
    <!-- Official Red/Gold Seal (红章) -->
    <circle cx="145" cy="165" r="9" fill="#dc2626" opacity="0.9" />
    <circle cx="145" cy="165" r="6" fill="none" stroke="#fef08a" stroke-width="1.5" />

    <!-- Second Paper Stacked -->
    <path d="M 95,115 L 175,115 L 170,160 L 90,160 Z" fill="#ffffff" opacity="0.9" />
    <line x1="105" y1="125" x2="140" y2="125" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="105" y1="133" x2="155" y2="133" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="105" y1="140" x2="130" y2="140" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 1: Left Person (Business Suit - Professional/Formal) -->
  <g id="character-left">
    <!-- Body/Torso -->
    <path d="M 35,210 L 35,160 Q 35,140 60,140 L 75,140 L 85,210 Z" fill="#1e293b" />
    <!-- Shirt & Tie -->
    <polygon points="52,140 68,140 60,165" fill="#ffffff" />
    <polygon points="58,150 62,150 63,175 60,182 57,175" fill="#f59e0b" />
    <!-- Lapels -->
    <path d="M 52,140 L 60,165 L 45,190" fill="#334155" />
    <path d="M 68,140 L 60,165 L 75,190" fill="#334155" />

    <!-- Head & Hair -->
    <circle cx="60" cy="115" r="18" fill="#fbcfe8" />
    <!-- Hair (Dark modern cut) -->
    <path d="M 43,115 Q 43,95 60,95 Q 77,95 77,115 Q 75,103 60,102 Q 45,103 43,115 Z" fill="#0f172a" />
    
    <!-- Face Profile (Smiling, confident) -->
    <circle cx="68" cy="117" r="1.5" fill="#334155" />
    <path d="M 67,123 Q 70,126 73,123" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Arm & Hand reaching out to sign -->
    <path d="M 45,150 Q 55,160 85,155 L 88,162 L 55,170 Z" fill="#1e293b" />
    <!-- Hand holding pen -->
    <circle cx="92" cy="162" r="5" fill="#fbcfe8" />
    <line x1="90" y1="160" x2="108" y2="175" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    <circle cx="108" cy="175" r="1.5" fill="#fbbf24" />
  </g>

  <!-- CHARACTER 2: Right Person (Smiling Partner/Witness - Handshaking / Gesturing Agreement) -->
  <g id="character-right">
    <!-- Body/Torso -->
    <path d="M 205,210 L 205,160 Q 205,140 180,140 L 165,140 L 155,210 Z" fill="#0284c7" />
    <!-- Inner Blouse / Lapel -->
    <polygon points="188,140 172,140 180,165" fill="#f8fafc" />

    <!-- Head & Hair -->
    <circle cx="180" cy="112" r="17" fill="#fbcfe8" />
    <!-- Hair (Stylized professional bun/bob) -->
    <path d="M 163,110 Q 163,92 180,92 Q 197,92 197,112 Q 195,120 185,122 L 192,105 Z" fill="#334155" />

    <!-- Face (Friendly expression, eyes crinkled with joy) -->
    <path d="M 188,114 Q 191,112 194,114" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <!-- Warm Smile -->
    <path d="M 189,120 Q 192,124 195,120" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="193" cy="117" r="2" fill="#fda4af" opacity="0.6" />

    <!-- Right Arm gesturing in approval / pointing at document -->
    <path d="M 195,150 Q 185,165 155,160" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="152" cy="158" r="5" fill="#fbcfe8" />
  </g>

  <!-- Foreground Dynamic Sparkles / Success Indicator -->
  <g fill="#fbbf24">
    <path d="M 130,85 L 132,92 L 139,94 L 132,96 L 130,103 L 128,96 L 121,94 L 128,92 Z" opacity="0.8" />
    <path d="M 105,70 L 106,74 L 110,75 L 106,76 L 105,80 L 104,76 L 100,75 L 104,74 Z" opacity="0.6" transform="scale(0.8) translate(30, 20)" />
    <path d="M 155,95 L 156,98 L 159,99 L 156,100 L 155,103 L 154,100 L 151,99 L 154,98 Z" opacity="0.9" />
  </g>
</svg>