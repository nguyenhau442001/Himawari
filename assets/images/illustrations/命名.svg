<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 L240 180 L240 185 L0 185 Z" fill="#475569"/>
  
  <!-- Hero Statue Base -->
  <rect x="90" y="120" width="60" height="60" rx="4" fill="#64748b"/>
  <rect x="100" y="110" width="40" height="10" rx="2" fill="#94a3b8"/>
  
  <!-- Hero Statue Silhouette -->
  <path d="M110 110 L130 110 L125 70 L115 70 Z" fill="#f59e0b"/>
  <circle cx="120" cy="65" r="8" fill="#f59e0b"/>
  
  <!-- Street Sign Post -->
  <rect x="180" y="80" width="4" height="100" fill="#94a3b8"/>
  <rect x="170" y="60" width="40" height="20" rx="4" fill="#38bdf8"/>
  
  <!-- Characters -->
  <!-- Person 1 (Pointing) -->
  <g transform="translate(40, 140)">
    <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
    <path d="M10 18 L10 40 M10 25 L20 35 M10 25 L0 35 M10 40 L15 60 M10 40 L5 60" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (Looking up) -->
  <g transform="translate(70, 150)">
    <circle cx="10" cy="10" r="8" fill="#ec4899"/>
    <path d="M10 18 L10 40 M10 25 L20 20 M10 40 L15 60 M10 40 L5 60" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative City Elements -->
  <rect x="10" y="100" width="30" height="80" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="200" y="120" width="30" height="60" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Street Lamps -->
  <circle cx="20" cy="90" r="4" fill="#fb923c"/>
  <circle cx="215" cy="110" r="4" fill="#fb923c"/>
</svg>