<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a" />
  
  <defs>
    <!-- Sky & background gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    
    <!-- Hill gradient representing the steep slope (坡) -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Road gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky & Ambient Light -->
  <rect x="0" y="0" width="240" height="140" fill="url(#skyGrad)" />
  <circle cx="190" cy="50" r="24" fill="#fbbf24" opacity="0.15" />
  <circle cx="190" cy="50" r="40" fill="url(#glow)" />

  <!-- Distant Background Scenery (Houses, Trees) -->
  <path d="M 15 110 L 30 90 L 45 110 Z" fill="#312e81" opacity="0.6" />
  <path d="M 40 105 L 55 85 L 70 105 Z" fill="#312e81" opacity="0.5" />
  <rect x="85" y="90" width="18" height="20" fill="#312e81" opacity="0.4" />
  <polygon points="80,90 94,78 108,90" fill="#1e1b4b" opacity="0.5" />

  <!-- STEEP SLOPE / HILL (坡) -->
  <!-- The hill structure creating the steep incline from top-left down to bottom-right -->
  <path d="M 0 60 L 240 170 L 240 240 L 0 240 Z" fill="url(#hillGrad)" />

  <!-- Road winding down the steep slope -->
  <!-- A sharp diagonal band representing the steep road (这条坡很陡) -->
  <path d="M 100 40 L 140 60 L 210 240 L 170 240 Z" fill="url(#roadGrad)" />
  
  <!-- Road safety markings / dashed center line -->
  <path d="M 120 48 L 130 53 M 145 68 L 168 110 M 180 135 L 200 180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />

  <!-- Warning Sign (Caution / Careful - 小心) -->
  <g transform="translate(65, 95) scale(0.8)">
    <polygon points="15,2 30,28 0,28" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
    <line x1="15" y1="12" x2="15" y2="19" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="15" cy="23" r="1.5" fill="#1e293b" />
  </g>

  <!-- Trees & Bushes along the slope for environmental richness -->
  <circle cx="35" cy="120" r="12" fill="#047857" />
  <path d="M 35 120 L 35 135" stroke="#065f46" stroke-width="3" />
  
  <circle cx="20" cy="150" r="15" fill="#065f46" />
  <circle cx="12" cy="160" r="10" fill="#047857" />
  
  <circle cx="215" cy="140" r="14" fill="#047857" />
  <path d="M 215 140 L 215 160" stroke="#065f46" stroke-width="3" />

  <!-- MAIN SUBJECT: Cyclist navigating the steep slope carefully (骑车要小心) -->
  <g transform="translate(100, 95)">
    
    <!-- Motion / Speed lines indicating steepness & movement -->
    <path d="M -15 -5 L -5 -3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M -20 5 L -8 7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

    <!-- Bicycle Frame & Wheels -->
    <!-- Rear Wheel -->
    <circle cx="-12" cy="32" r="12" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="-12" cy="32" r="3" fill="#64748b" />
    
    <!-- Front Wheel -->
    <circle cx="28" cy="32" r="12" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="28" cy="32" r="3" fill="#64748b" />

    <!-- Bike Frame Structure -->
    <path d="M -12 32 L 8 16 L 28 32 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
    <path d="M 8 16 L 3 32" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path d="M 8 16 L 15 -2" fill="none" stroke="#38bdf8" stroke-width="3" /> <!-- Handlebar stem -->
    <path d="M 12 -5 L 20 -2" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" /> <!-- Handlebars -->

    <!-- Character Body (Leaning back carefully to brake) -->
    <!-- Legs (Pedaling / braced) -->
    <path d="M 3 32 L -2 20 L -12 32" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Torso (Tilted backward for stability on the steep downward slope) -->
    <path d="M 5 15 L -2 -3" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />

    <!-- Backpack -->
    <path d="M -8 -8 C -12 -8 -14 -2 -10 2 C -6 6 -4 0 -4 -4 Z" fill="#f97316" />

    <!-- Arms reaching forward to handlebars -->
    <path d="M -2 -2 L 10 0 L 15 -2" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Head & Helmet (Safety gear - 小心) -->
    <circle cx="-5" cy="-12" r="7" fill="#fde047" />
    <!-- Helmet shell -->
    <path d="M -12 -13 C -12 -19 3 -19 3 -13 Z" fill="#38bdf8" />
    <!-- Determined / Focused face expression -->
    <circle cx="-7" cy="-11" r="1.5" fill="#1e293b" />

  </g>

  <!-- Foreground details to frame the scene -->
  <path d="M 0 225 Q 60 210 120 230 T 240 220 L 240 240 L 0 240 Z" fill="#064e3b" opacity="0.8" />
  
  <!-- Small tufts of grass -->
  <path d="M 50 222 L 53 216 L 56 223" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <path d="M 180 230 L 183 224 L 187 231" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <path d="M 190 232 L 194 225 L 197 233" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

</svg>