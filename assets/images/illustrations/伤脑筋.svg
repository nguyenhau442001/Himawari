<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lamp Lighting Effect -->
  <circle cx="120" cy="50" r="100" fill="url(#lampGlow)"/>

  <!-- Background Environment & Props -->
  <!-- Bookshelf / Wall details -->
  <rect x="25" y="40" width="45" height="70" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="30" y="50" width="35" height="8" rx="2" fill="#475569"/>
  <rect x="30" y="65" width="25" height="8" rx="2" fill="#0ea5e9" opacity="0.7"/>
  <rect x="30" y="80" width="30" height="8" rx="2" fill="#f97316" opacity="0.7"/>
  
  <rect x="170" y="35" width="45" height="80" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="175" y="45" width="35" height="8" rx="2" fill="#10b981" opacity="0.7"/>
  <rect x="175" y="60" width="30" height="8" rx="2" fill="#a855f7" opacity="0.7"/>
  <rect x="175" y="75" width="35" height="8" rx="2" fill="#f43f5e" opacity="0.7"/>

  <!-- Wall Clock showing late hours -->
  <circle cx="120" cy="35" r="14" fill="#334155" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="35" r="11" fill="#1e293b"/>
  <line x1="120" y1="35" x2="120" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="35" x2="127" y2="35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Desk Surface -->
  <path d="M 10 190 L 230 190 L 220 220 L 20 220 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <rect x="0" y="215" width="240" height="25" fill="#0f172a"/>

  <!-- Computer Monitor (Displaying complex charts/problems) -->
  <rect x="75" y="80" width="90" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <!-- Screen Area -->
  <rect x="80" y="85" width="80" height="50" rx="3" fill="url(#screenGlow)"/>
  <!-- Complex Graph Lines on Screen (Representing the "difficult problem") -->
  <path d="M 88 120 Q 100 95, 115 110 T 145 95 L 155 125" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="115" cy="110" r="3" fill="#f43f5e"/>
  <circle cx="145" cy="95" r="3" fill="#f43f5e"/>
  <path d="M 88 125 L 155 125" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Monitor Stand -->
  <path d="M 110 140 L 130 140 L 135 165 L 105 165 Z" fill="#475569"/>
  <ellipse cx="120" cy="165" rx="22" ry="4" fill="#334155"/>

  <!-- Desk Props (Coffee cup, scattered papers) -->
  <!-- Coffee Cup -->
  <rect x="52" y="150" width="16" height="22" rx="3" fill="#f8fafc"/>
  <path d="M 68 155 C 74 155, 74 167, 68 167" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam from coffee -->
  <path d="M 57 144 Q 55 138, 60 132" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Scattered Papers / Documents with messy notes -->
  <g transform="rotate(-12 185 160)">
    <rect x="170" y="145" width="30" height="38" rx="2" fill="#f8fafc"/>
    <line x1="175" y1="152" x2="192" y2="152" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="175" y1="160" x2="195" y2="160" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="175" y1="168" x2="185" y2="168" stroke="#f43f5e" stroke-width="2"/>
  </g>
  <g transform="rotate(8 50 175)">
    <rect x="35" y="160" width="32" height="26" rx="2" fill="#e2e8f0"/>
    <line x1="40" y1="168" x2="58" y2="168" stroke="#94a3b8" stroke-width="2"/>
    <line x1="40" y1="176" x2="52" y2="176" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Main Character (Experiencing "伤脑筋" / headache & stress over the problem) -->
  <!-- Torso & Hoodie -->
  <path d="M 90 220 C 90 190, 100 175, 120 175 C 140 175, 150 190, 150 220 Z" fill="#0ea5e9"/>
  <!-- Hoodie Collar / Details -->
  <path d="M 105 175 L 120 192 L 135 175" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head & Neck -->
  <rect x="111" y="140" width="18" height="38" rx="6" fill="#fcd34d"/> <!-- Neck -->
  <circle cx="120" cy="130" r="28" fill="#fcd34d" filter="url(#shadow)"/>

  <!-- Hair (Messy, stressed style) -->
  <path d="M 93 130 C 93 110, 105 102, 122 102 C 140 102, 148 112, 148 130 C 144 120, 138 112, 125 110 C 110 108, 100 115, 93 130 Z" fill="#1e293b"/>
  <!-- Extra messy hair tuft -->
  <path d="M 125 104 C 130 96, 138 98, 135 106 Z" fill="#1e293b"/>
  <path d="M 105 106 C 100 98, 92 102, 98 110 Z" fill="#1e293b"/>

  <!-- Expressive Facial Features (Stressed/Thinking hard) -->
  <!-- Furrowed Angled Eyebrows -->
  <line x1="108" y1="122" x2="116" y2="126" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <line x1="126" y1="126" x2="134" y2="122" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <!-- Closed / Stressed Eyes (Tightly shut or overwhelmed squint) -->
  <path d="M 108 132 Q 112 136, 116 132" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 126 132 Q 130 136, 134 132" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Stressed Mouth (Grimace / Wavy line) -->
  <path d="M 114 146 Q 120 142, 126 146" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hands Holding Head / Temples (Classic "Đau đầu / 伤脑筋" gesture) -->
  <!-- Left Arm & Hand on Temple -->
  <path d="M 90 205 C 80 185, 95 140, 110 135" fill="none" stroke="#0ea5e9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="111" cy="133" r="8" fill="#fcd34d" filter="url(#shadow)"/> <!-- Left fingers pressing temple -->
  
  <!-- Right Arm & Hand on Temple -->
  <path d="M 150 205 C 160 185, 145 140, 130 135" fill="none" stroke="#0ea5e9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="129" cy="133" r="8" fill="#fcd34d" filter="url(#shadow)"/> <!-- Right fingers pressing temple -->

  <!-- Subtle Sweat Drops (Signifying mental exhaustion & hard puzzle) -->
  <path d="M 96 122 C 96 122, 92 128, 92 131 C 92 133.2, 93.8 135, 96 135 C 98.2 135, 100 133.2, 100 131 C 100 128, 96 122, 96 122 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 148 126 C 148 126, 145 130, 145 132 C 145 133.7, 146.3 135, 148 135 C 149.7 135, 151 133.7, 151 132 C 151 130, 148 126, 148 126 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Overhead Thought/Dilemma Elements (Abstract glowing problem sparks, completely non-textual) -->
  <g transform="translate(120, 75)">
    <!-- Question mark floating abstractly to represent the tricky problem -->
    <path d="M -3 -8 C -3 -14, 5 -14, 5 -8 C 5 -4, -1 -4, -1 2" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-1" cy="7" r="1.5" fill="#fbbf24"/>
    
    <!-- Floating tiny sparkles representing brain-work / headache stress -->
    <path d="M -16 -4 L -12 -4 M -14 -6 L -14 -2" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 14 -2 L 18 -2 M 16 -4 L 16 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>