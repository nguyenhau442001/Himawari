<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Shield / Rules being shattered (Background element) -->
    <path d="M-55,-65 L55,-65 L65,15 C65,50 35,75 0,85 C-35,75 -65,50 -65,15 Z" fill="none" stroke="#2D323E" stroke-width="6" stroke-dasharray="8 6" />
    
    <!-- Broken/Scatter fragments of regulations (representing rules) -->
    <path d="M-60,-30 L-35,-45" stroke="#E056FD" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M45,-50 L65,-35" stroke="#E056FD" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M-70,10 L-45,20" stroke="#E056FD" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- Central Character/Figure representing unbridled, audacious defiance -->
    <!-- Bold energetic body leaning forward -->
    <path d="M-10,45 C-10,25 -25,10 -35,-5 C-45,-20 -35,-40 -15,-45 C5,-50 20,-35 25,-15 C30,5 25,25 20,45" fill="none" stroke="#FFA800" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Head with arrogant backward tilt -->
    <circle cx="20" cy="-35" r="14" fill="#FFA800"/>
    
    <!-- Dynamic sweeping arms shattering boundaries -->
    <!-- Left arm flinging back -->
    <path d="M-25,-25 L-55,-15" fill="none" stroke="#FFA800" stroke-width="7" stroke-linecap="round"/>
    <!-- Right arm slicing forward forcefully -->
    <path d="M10,-10 L55,-5" fill="none" stroke="#FFA800" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Action impact lines / Unstoppable momentum energy -->
    <path d="M-70,-5 L-45,-12" stroke="#FF4757" stroke-width="5" stroke-linecap="round"/>
    <path d="M60,0 L85,-5" stroke="#FF4757" stroke-width="5" stroke-linecap="round"/>
    <path d="M50,25 L75,35" stroke="#FF4757" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Glowing aura of absolute disregard for limits (recklessness) -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#FF4757" stroke-width="3" stroke-dasharray="12 18" opacity="0.8"/>
    
    <!-- Impact star/burst at the center of action -->
    <path d="M0,-20 L4,-8 L16,-12 L8,0 L20,4 L8,8 L12,20 L0,12 L-12,20 L-8,8 L-20,4 L-8,0 L-16,-12 L-4,-8 Z" fill="#FF4757" transform="scale(0.8) translate(10, -20)"/>
  </g>
</svg>