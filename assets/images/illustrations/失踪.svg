<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing Search / Mystery Background Elements -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#2A313C" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="120" cy="115" r="50" fill="none" stroke="#2A313C" stroke-width="1.5"/>

  <!-- Magnifying Glass (Investigation / Missing Context) -->
  <g transform="rotate(-45 120 115)">
    <!-- Glass Rim -->
    <circle cx="105" cy="115" r="32" fill="#1A1D24" stroke="#F59E0B" stroke-width="6"/>
    <!-- Glass Reflection / Lens glow -->
    <path d="M 85 100 A 24 24 0 0 1 125 100" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Handle -->
    <rect x="101" y="147" width="8" height="42" rx="4" fill="#F59E0B"/>
    <rect x="103" y="147" width="4" height="42" rx="2" fill="#FDE68A" opacity="0.4"/>
  </g>

  <!-- Central Concept: Disappearing Human Silhouette / Person Missing -->
  <!-- Solid Lower Body / Torso fading into dotted particles -->
  <g fill="#60A5FA">
    <!-- Head -->
    <circle cx="120" cy="92" r="10" />
    <!-- Shoulders & Torso Base -->
    <path d="M 100 128 C 100 112 110 108 120 108 C 130 108 140 112 140 128 L 142 134 C 142 134 98 134 100 128 Z" />
    
    <!-- Fading / Dissolving Upper Torso & Head Silhouette -->
    <!-- Floating pixel/particle effects drifting upward-right (shīzōng / missing) -->
    <rect x="114" y="74" width="4" height="4" rx="1" opacity="0.8"/>
    <rect x="126" y="78" width="5" height="5" rx="1" opacity="0.6"/>
    <rect x="104" y="82" width="3" height="3" rx="0.5" opacity="0.5"/>
    <rect x="135" y="86" width="6" height="6" rx="1.5" opacity="0.4"/>
    <rect x="110" y="66" width="3" height="3" rx="0.5" opacity="0.3"/>
    <rect x="122" y="62" width="4" height="4" rx="1" opacity="0.2"/>
    <circle cx="132" cy="70" r="1.5" opacity="0.5" fill="#F59E0B"/>
    <circle cx="102" cy="74" r="2" opacity="0.4" fill="#F59E0B"/>
  </g>

  <!-- Question Mark / Unknown Element subtly integrated -->
  <path d="M 148 88 C 148 82 143 78 136 78 C 129 78 126 83 126 86" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="148" cy="98" r="1.5" fill="#F59E0B" opacity="0.6"/>
</svg>