<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Timeline / Progression Metaphor for "Already / Completed" -->
  <g transform="translate(0, 0)">
    <!-- Background grid / structural lines representing the timeline -->
    <line x1="40" y1="120" x2="200" y2="120" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Past / Starting Point (Dimmed, inactive) -->
    <circle cx="60" cy="120" r="8" fill="#2A2F3D"/>
    <rect x="48" y="136" width="24" height="6" rx="3" fill="#2A2F3D"/>

    <!-- Journey path with progression gradient/segments -->
    <path d="M 60 120 L 140 120" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>

    <!-- The Pivot Point / Transition (The exact moment of completion) -->
    <circle cx="140" cy="120" r="14" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
    <circle cx="140" cy="120" r="6" fill="#3B82F6"/>

    <!-- Future / Closed Path (Dashed or shaded to show completion/boundary) -->
    <path d="M 140 120 L 200 120" stroke="#334155" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>

    <!-- Sharp Peak / Escalation / Completed Milestone Icon: Checkmark / Accomplished Goal -->
    <!-- Floating achievement card / marker above the completion point -->
    <rect x="115" y="55" width="50" height="42" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Checkmark inside the achievement card (Visualizing "Done / Completed") -->
    <path d="M 130 76 L 138 84 L 153 67" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Connection beam from completion point to the milestone -->
    <line x1="140" y1="106" x2="140" y2="97" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Accent glow / aura around the completion node -->
    <circle cx="140" cy="120" r="24" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <!-- Secondary visual anchors: Progress steps / state change representation -->
  <g transform="translate(0, 150)">
    <!-- Step 1: Before (Unchecked / Open) -->
    <rect x="52" y="15" width="20" height="20" rx="4" fill="#2A2F3D"/>
    
    <!-- Arrow moving forward -->
    <path d="M 84 25 L 100 25 M 94 20 L 100 25 L 94 30" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 2: In Progress / Active transition -->
    <rect x="110" y="15" width="20" height="20" rx="4" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="120" cy="25" r="4" fill="#3B82F6"/>

    <!-- Arrow moving forward -->
    <path d="M 142 25 L 158 25 M 152 20 L 158 25 L 152 30" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 3: Done / Final State (Highlighted with gold accent) -->
    <rect x="168" y="15" width="20" height="20" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 174 25 L 178 29 L 184 21" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>