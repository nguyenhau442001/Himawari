<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight for Desk -->
    <radialGradient id="deskLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Hologram Glow -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Environment Lighting -->
  <circle cx="120" cy="120" r="110" fill="url(#deskLight)"/>

  <!-- Background Office Details -->
  <!-- Window Grid -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.6">
    <line x1="30" y1="40" x2="90" y2="40"/>
    <line x1="30" y1="70" x2="90" y2="70"/>
    <line x1="60" y1="20" x2="60" y2="90"/>
  </g>

  <!-- Bookshelf / Architecture Lines -->
  <rect x="170" y="30" width="40" height="8" rx="2" fill="#334155"/>
  <rect x="175" y="38" width="10" height="25" rx="1" fill="#475569"/>
  <rect x="188" y="42" width="15" height="21" rx="1" fill="#38bdf8" opacity="0.5"/>

  <!-- Desk Surface -->
  <path d="M 20 185 L 220 185 L 205 210 L 35 210 Z" fill="#0f172a" filter="url(#shadow)"/>
  <path d="M 20 185 L 220 185" stroke="#334155" stroke-width="2"/>
  <path d="M 30 185 L 210 185" stroke="#475569" stroke-width="1"/>

  <!-- Main Product (A stylized modern smart teapot/device on the desk) -->
  <g transform="translate(95, 130)">
    <!-- Product Shadow -->
    <ellipse cx="25" cy="58" rx="28" ry="8" fill="#020617" opacity="0.6"/>
    
    <!-- Product Body -->
    <path d="M 8 20 C 8 10, 42 10, 42 20 L 45 48 C 45 54, 5 54, 5 48 Z" fill="#334155" filter="url(#shadow)"/>
    <!-- Product Metallic Sheen -->
    <path d="M 12 22 C 12 15, 38 15, 38 22 L 39 35 C 39 35, 11 35, 12 22 Z" fill="#475569"/>
    
    <!-- Product Handle -->
    <path d="M 42 22 C 55 22, 55 42, 42 45" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Product Spout -->
    <path d="M 8 25 L -4 18 C -6 17, -6 21, -3 23 L 6 32" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <!-- THE DEFECT / FLAW (Glowing red crack/dent on the product) -->
    <g transform="translate(18, 22)">
      <path d="M 2 2 L 6 9 L 4 12 L 9 18" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
      <circle cx="4" cy="12" r="3" fill="#ef4444" opacity="0.6"/>
      <!-- Glow effect -->
      <circle cx="4" cy="12" r="7" fill="#ef4444" opacity="0.3"/>
    </g>
  </g>

  <!-- Floating Holographic Diagnostic UI (Showing the Design Flaw) -->
  <g transform="translate(130, 75)" filter="url(#shadow)">
    <!-- Hologram Box -->
    <rect x="0" y="0" width="70" height="45" rx="6" fill="url(#holoGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    
    <!-- Magnifier Icon pointing at defect -->
    <circle cx="20" cy="22" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="27" y1="29" x2="35" y2="37" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Warning/Issue Lines inside hologram -->
    <line x1="40" y1="15" x2="60" y2="15" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="23" x2="55" y2="23" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="31" x2="50" y2="31" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Character: Designer/Engineer (Focused, examining the product) -->
  <g transform="translate(25, 80)">
    <!-- Character Body / Lab Coat / Shirt -->
    <path d="M 45 95 C 45 75, 75 75, 75 95 L 85 115 L 35 115 Z" fill="#38bdf8"/>
    <!-- Collar -->
    <path d="M 50 75 L 60 88 L 70 75 Z" fill="#f8fafc"/>

    <!-- Neck -->
    <rect x="53" y="62" width="14" height="15" fill="#f1f5f9"/>

    <!-- Head -->
    <circle cx="60" cy="48" r="18" fill="#f8fafc" filter="url(#shadow)"/>
    
    <!-- Hair (Neat stylish bob) -->
    <path d="M 43 45 C 43 30, 77 30, 77 48 C 77 50, 75 42, 72 38 C 65 30, 55 30, 48 38 C 45 42, 43 46, 43 45 Z" fill="#334155"/>

    <!-- Concentrated Eyebrows & Eyes looking down at product -->
    <path d="M 50 44 L 58 46" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 62 46 L 70 44" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="54" cy="49" r="2" fill="#1e293b"/>
    <circle cx="66" cy="49" r="2" fill="#1e293b"/>

    <!-- Thoughtful / Concerned Mouth -->
    <path d="M 58 57 Q 60 55 62 57" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arm pointing/touching chin in realization -->
    <path d="M 68 85 L 85 70 L 78 60" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="60" r="5" fill="#f8fafc"/>
  </g>

  <!-- Blueprint / Design Sheet on Desk -->
  <g transform="translate(50, 150) rotate(-10)">
    <rect x="0" y="0" width="55" height="40" rx="2" fill="#0284c7" opacity="0.9" filter="url(#shadow)"/>
    <!-- Blueprint lines -->
    <line x1="8" y1="10" x2="47" y2="10" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="27" cy="25" r="10" fill="none" stroke="#bae6fd" stroke-width="1.5"/>
    <path d="M 22 25 L 32 25" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Coffee Mug for office context -->
  <g transform="translate(180, 150)">
    <rect x="0" y="5" width="14" height="18" rx="2" fill="#e2e8f0" filter="url(#shadow)"/>
    <path d="M 14 8 C 19 8, 19 20, 14 20" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="7" cy="5" rx="7" ry="2" fill="#cbd5e1"/>
    <!-- Steam -->
    <path d="M 4 0 Q 7 -4 4 -8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Foreground Atmospheric Elements (Subtle dust motes / glowing particles) -->
  <circle cx="45" cy="110" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="160" cy="50" r="2" fill="#f59e0b" opacity="0.5"/>
  <circle cx="190" cy="120" r="1" fill="#38bdf8" opacity="0.8"/>
  <circle cx="115" cy="40" r="1.5" fill="#f59e0b" opacity="0.7"/>

</svg>