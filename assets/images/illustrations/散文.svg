<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Moonlight Glow -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Character Outfit Colors -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- BACKGROUND ENVIRONMENT -->
  <!-- Window framing the night scene -->
  <rect x="25" y="20" width="75" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
  <rect x="29" y="24" width="67" height="82" rx="2" fill="url(#windowGlow)" />
  <!-- Window crossbars -->
  <line x1="62" y1="20" x2="62" y2="110" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="65" x2="100" y2="65" stroke="#334155" stroke-width="2" />
  <!-- Crescent moon outside -->
  <path d="M 80 38 A 12 12 0 0 1 70 52 A 10 10 0 0 0 80 38 Z" fill="#fef08a" opacity="0.8" />
  <!-- Tiny stars -->
  <circle cx="40" cy="35" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="50" cy="48" r="0.8" fill="#ffffff" opacity="0.4" />
  <circle cx="42" cy="85" r="1.2" fill="#ffffff" opacity="0.5" />

  <!-- Bookshelf in background -->
  <rect x="180" y="30" width="35" height="85" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <line x1="180" y1="55" x2="215" y2="55" stroke="#334155" stroke-width="1.5" />
  <line x1="180" y1="80" x2="215" y2="80" stroke="#334155" stroke-width="1.5" />
  <!-- Colored books on shelf -->
  <rect x="184" y="42" width="6" height="13" rx="1" fill="#38bdf8" />
  <rect x="192" y="39" width="5" height="16" rx="1" fill="#f59e0b" />
  <rect x="199" y="44" width="7" height="11" rx="1" fill="#ec4899" />
  <rect x="185" y="67" width="8" height="13" rx="1" fill="#10b981" />
  <rect x="195" y="65" width="6" height="15" rx="1" fill="#6366f1" />

  <!-- Potted Plant on Desk / Corner -->
  <path d="M 205 138 L 215 138 L 218 150 L 202 150 Z" fill="#94a3b8" />
  <path d="M 210 138 C 210 125 225 120 220 105 C 210 115 200 125 210 138 Z" fill="url(#leafGrad)" />
  <path d="M 208 138 C 198 128 190 120 192 108 C 200 115 208 125 208 138 Z" fill="url(#leafGrad)" />

  <!-- MIDGROUND: DESK & LIGHTING -->
  <!-- Lamp Glow Circle -->
  <circle cx="150" cy="85" r="70" fill="url(#lampGlow)" />

  <!-- Wooden Desk Surface -->
  <rect x="15" y="150" width="210" height="12" rx="3" fill="#334155" />
  <rect x="10" y="162" width="220" height="68" fill="#1e293b" />
  <!-- Desk leg highlights -->
  <rect x="25" y="162" width="6" height="78" fill="#0f172a" />
  <rect x="209" y="162" width="6" height="78" fill="#0f172a" />

  <!-- DESK PROPS -->
  <!-- Desk Lamp -->
  <path d="M 160 150 L 160 105 L 145 90 L 135 90" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 125 80 L 155 80 L 145 95 L 135 95 Z" fill="#f59e0b" />
  <ellipse cx="140" cy="95" rx="10" ry="4" fill="#fef08a" />

  <!-- Coffee Mug with steam -->
  <rect x="185" y="132" width="16" height="18" rx="3" fill="#cbd5e1" />
  <path d="M 201 137 C 206 137 206 145 201 145" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
  <path d="M 190 124 C 191 120 188 118 190 114" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 195 126 C 196 122 193 120 195 116" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Open Notebook / Manuscript (散文 - Tản văn being written) -->
  <g transform="translate(70, 135) rotate(-4)">
    <!-- Book shadow -->
    <rect x="-2" y="2" width="64" height="26" rx="2" fill="#0f172a" opacity="0.5" />
    <!-- Left page -->
    <rect x="0" y="0" width="30" height="25" fill="#f8fafc" rx="1" />
    <line x1="6" y1="6" x2="24" y2="6" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="11" x2="22" y2="11" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="16" x2="25" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <!-- Right page -->
    <rect x="30" y="0" width="30" height="25" fill="#f8fafc" rx="1" />
    <line x1="36" y1="6" x2="52" y2="6" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="36" y1="11" x2="55" y2="11" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="36" y1="16" x2="48" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <!-- Spine binding -->
    <line x1="30" y1="0" x2="30" y2="25" stroke="#94a3b8" stroke-width="1" />
    <!-- Artistic flourishes / glowing creative ink dots suggesting poetry/prose -->
    <circle cx="15" cy="20" r="1" fill="#f43f5e" />
    <circle cx="45" cy="20" r="1.5" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND: CHARACTER (Writer deeply immersed in crafting prose) -->
  <g transform="translate(0, 5)">
    <!-- Chair back -->
    <rect x="42" y="85" width="22" height="65" rx="6" fill="#334155" />

    <!-- Character Body / Cozy Sweater -->
    <path d="M 60 148 C 50 148 42 155 35 168 L 95 168 C 88 155 80 148 70 148 Z" fill="url(#sweaterGrad)" />

    <!-- Neck & Head -->
    <rect x="61" y="118" width="18" height="15" rx="6" fill="#fcd34d" />
    <!-- Face structure -->
    <circle cx="70" cy="112" r="18" fill="#fcd34d" />

    <!-- Hair (Stylized expressive bob cut with warm tones) -->
    <path d="M 52 110 C 50 90 90 90 88 110 C 92 110 94 125 90 140 C 85 125 80 120 70 120 C 60 120 53 125 50 140 C 46 125 48 110 52 110 Z" fill="#451a03" />
    <!-- Cute hair bangs over forehead -->
    <path d="M 58 102 C 64 108 76 108 82 102 C 78 106 62 106 58 102 Z" fill="#78350f" />

    <!-- Facial Expression (Focused, inspired, serene) -->
    <!-- Gentle closed/focused eyes -->
    <path d="M 63 113 Q 66 116 69 113" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 73 113 Q 76 116 79 113" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="62" cy="118" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="80" cy="118" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Soft peaceful smile -->
    <path d="M 69 121 Q 71 123 73 121" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms & Hands actively writing -->
    <!-- Left arm resting -->
    <path d="M 55 145 C 50 155 55 162 62 165" fill="none" stroke="#e11d48" stroke-width="10" stroke-linecap="round" />
    <!-- Right arm holding pen -->
    <path d="M 75 145 C 85 152 88 160 85 165" fill="none" stroke="#e11d48" stroke-width="10" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="85" cy="165" r="4" fill="#fcd34d" />

    <!-- Pen / Quill -->
    <line x1="85" y1="165" x2="98" y2="152" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="98" cy="152" r="1.5" fill="#fef08a" />
  </g>

  <!-- Flying Sparkles / Creative Inspiration Particles (Evoking beauty of prose/literature) -->
  <g opacity="0.8">
    <path d="M 120 110 L 123 115 L 128 118 L 123 121 L 120 126 L 117 121 L 112 118 L 117 115 Z" fill="#fbbf24" transform="scale(0.6) translate(80, 50)" />
    <path d="M 160 70 L 162 73 L 165 75 L 162 77 L 160 80 L 158 77 L 155 75 L 158 73 Z" fill="#38bdf8" transform="scale(0.5) translate(140, 20)" />
    <path d="M 100 80 L 102 83 L 105 85 L 102 87 L 100 90 L 98 87 L 95 85 L 98 83 Z" fill="#f43f5e" transform="scale(0.5) translate(80, 40)" />
  </g>
</svg>