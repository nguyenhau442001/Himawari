<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="120" cy="115" r="55"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Environment / Background Architecture (University setting) -->
  <!-- Ambient light from top window/lamp -->
  <path d="M 60 0 L 180 0 L 210 160 L 30 160 Z" fill="url(#wallGrad)" opacity="0.6"/>

  <!-- Large arched University window showing night campus & warm glow -->
  <path d="M 90,45 L 150,45 L 150,110 Q 150,135 120,135 Q 90,135 90,110 Z" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <!-- Campus view inside window -->
  <g clip-path="url(#circleClip)" transform="translate(0, -10)">
    <rect x="65" y="50" width="110" height="90" fill="#0b0f19"/>
    <!-- Distant campus tower/building -->
    <rect x="105" y="70" width="30" height="60" fill="url(#buildingGrad)"/>
    <polygon points="120,55 100,70 140,70" fill="#64748b"/>
    <!-- Tiny glowing windows in background -->
    <rect x="112" y="80" width="5" height="8" fill="#fbbf24" opacity="0.8"/>
    <rect x="123" y="80" width="5" height="8" fill="#fbbf24" opacity="0.5"/>
    <rect x="112" y="95" width="5" height="8" fill="#fbbf24" opacity="0.4"/>
    <rect x="123" y="95" width="5" height="8" fill="#fbbf24" opacity="0.9"/>
  </g>
  <!-- Window frame border -->
  <path d="M 90,45 L 150,45 L 150,110 Q 150,135 120,135 Q 90,135 90,110 Z" fill="none" stroke="#334155" stroke-width="4"/>
  <line x1="120" y1="45" x2="120" y2="135" stroke="#334155" stroke-width="2"/>

  <!-- Ivy / Foliage hanging decor -->
  <path d="M 35 30 Q 45 45 40 60 T 30 85" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="38" cy="50" r="4" fill="#059669"/>
  <circle cx="43" cy="70" r="5" fill="#10b981"/>
  <circle cx="33" cy="85" r="4" fill="#047857"/>

  <!-- Floor / Ground plane -->
  <rect x="0" y="195" width="240" height="45" fill="#0f172a"/>
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="2"/>

  <!-- CENTRAL CONCEPT: TWO CHARACTERS HOLDING THE SAME UNIVERSITY BANNER/EMBLEM -->
  <!-- University Banner/Scroll bridge connecting them, representing "The Same University" -->
  <path d="M 75 135 Q 120 120 165 135 L 165 160 Q 120 145 75 160 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 85 140 Q 120 128 155 140" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Golden Laurel / Emblem on the banner representing identical alma mater -->
  <circle cx="120" cy="141" r="9" fill="#f59e0b"/>
  <circle cx="120" cy="141" r="6" fill="#fbbf24"/>

  <!-- CHARACTER 1 (Left - Graduate with cap and gown style) -->
  <g transform="translate(45, 125)">
    <!-- Body / Torso -->
    <path d="M 15 45 L 35 45 L 40 75 L 10 75 Z" fill="#1e293b" />
    <!-- Graduation gown collar (Blue/Dark) -->
    <path d="M 20 45 L 30 45 L 35 55 L 15 55 Z" fill="#2563eb" />
    <!-- Neck -->
    <rect x="22" y="37" width="6" height="8" fill="#fbcfe8" />
    <!-- Head -->
    <circle cx="25" cy="27" r="11" fill="#fbcfe8" />
    <!-- Hair (Stylish dark hair) -->
    <path d="M 14 27 Q 15 16 25 16 Q 35 16 36 27 Q 32 21 25 21 Q 18 21 14 27 Z" fill="#334155" />
    <!-- Happy Expression -->
    <path d="M 22 28 Q 25 31 28 28" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="21" cy="25" r="1" fill="#0f172a"/>
    <circle cx="29" cy="25" r="1" fill="#0f172a"/>
    
    <!-- Graduation Cap (Mortarboard) -->
    <polygon points="25,12 40,16 25,20 10,16" fill="#0f172a" />
    <polygon points="25,13 38,16 25,19 12,16" fill="#1e293b" />
    <rect x="22" y="18" width="6" height="4" fill="#0f172a" />
    <!-- Tassel -->
    <path d="M 37 17 Q 40 22 38 27" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="38" cy="27" r="1.5" fill="#f59e0b" />

    <!-- Arm holding banner -->
    <path d="M 32 48 Q 45 50 50 38" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="50" cy="38" r="4" fill="#fbcfe8" />
  </g>

  <!-- CHARACTER 2 (Right - Graduate colleague/friend) -->
  <g transform="translate(135, 125)">
    <!-- Body / Torso -->
    <path d="M 10 45 L 30 45 L 35 75 L 5 75 Z" fill="#1e293b" />
    <!-- Graduation gown collar -->
    <path d="M 15 45 L 25 45 L 30 55 L 10 55 Z" fill="#2563eb" />
    <!-- Neck -->
    <rect x="18" y="37" width="6" height="8" fill="#fbcfe8" />
    <!-- Head -->
    <circle cx="21" cy="27" r="11" fill="#fbcfe8" />
    <!-- Hair (Warm brown, styled bob) -->
    <path d="M 10 25 Q 11 15 21 15 Q 31 15 32 25 Q 30 33 25 33 Q 15 33 10 25 Z" fill="#78350f" />
    <!-- Happy Expression -->
    <path d="M 18 28 Q 21 31 24 28" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="17" cy="25" r="1" fill="#0f172a"/>
    <circle cx="25" cy="25" r="1" fill="#0f172a"/>

    <!-- Graduation Cap -->
    <polygon points="21,12 36,16 21,20 6,16" fill="#0f172a" />
    <polygon points="21,13 34,16 21,19 8,16" fill="#1e293b" />
    <rect x="18" y="18" width="6" height="4" fill="#0f172a" />
    <!-- Tassel -->
    <path d="M 8 16 Q 5 22 7 27" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="7" cy="27" r="1.5" fill="#f59e0b" />

    <!-- Arm holding banner -->
    <path d="M 14 48 Q 1 50 -4 38" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-4" cy="38" r="4" fill="#fbcfe8" />
  </g>

  <!-- Foreground Props: Diplomas / Degrees tied with red ribbon -->
  <g transform="translate(100, 185) rotate(-15)">
    <rect x="0" y="0" width="30" height="10" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="12" y="0" width="6" height="10" fill="#ef4444"/>
  </g>
  <g transform="translate(115, 180) rotate(20)">
    <rect x="0" y="0" width="35" height="10" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="14" y="0" width="6" height="10" fill="#dc2626"/>
  </g>

  <!-- Atmospheric Lighting Overlay (Warm highlights on characters) -->
  <circle cx="120" cy="110" r="80" fill="url(#warmLight)" style="mix-blend-mode: overlay;" pointer-events="none"/>

  <!-- Minimal framing border -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>