<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Timeline track representing past/earlier) -->
  <line x1="40" y1="120" x2="200" y2="120" stroke="#2B323D" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 8"/>
  
  <!-- Future/Present marker (right) -->
  <circle cx="170" cy="120" r="12" fill="#2B323D"/>
  <circle cx="170" cy="120" r="6" fill="#4B5563"/>

  <!-- "Xianqian" (Earlier/Previously) core physical artifact: An antique mechanical pocket watch pointing to an earlier time, rendered as a concrete physical object -->
  <!-- Outer shadow / Glow -->
  <circle cx="100" cy="120" r="54" fill="#111318" opacity="0.5"/>

  <!-- Pocket watch outer casing -->
  <circle cx="100" cy="120" r="48" fill="#D97706" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="100" cy="120" r="42" fill="#1E232B"/>

  <!-- Watch stem/ring at the top -->
  <rect x="96" y="66" width="8" height="6" fill="#D97706" rx="2"/>
  <circle cx="100" cy="63" r="7" fill="none" stroke="#D97706" stroke-width="3"/>

  <!-- Dial markers -->
  <line x1="100" y1="84" x2="100" y2="88" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="152" x2="100" y2="156" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="120" x2="68" y2="120" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  <line x1="132" y1="120" x2="136" y2="120" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>

  <!-- Clock hands pointing backward / earlier (e.g., 10:10 indicating past) -->
  <line x1="100" y1="120" x2="82" y2="105" stroke="#F3F4F6" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="122" y2="98" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Center pin -->
  <circle cx="100" cy="120" r="4" fill="#F59E0B"/>

  <!-- Focus accent: Highlight beam / indicator showing "Prior/Earlier" point on timeline -->
  <circle cx="100" cy="120" r="54" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="120 220" transform="rotate(-90 100 120)" opacity="0.8"/>
</svg>