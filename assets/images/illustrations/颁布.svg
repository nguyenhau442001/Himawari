<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Document Gold Accent -->
    <linearGradient id="doc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Background Details -->
  <!-- Back Wall Panel / Office Setting -->
  <rect x="20" y="20" width="200" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  
  <!-- Large Official Window -->
  <path d="M150 35 L200 35 L200 120 L150 120 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <!-- Window Panes -->
  <line x1="175" y1="35" x2="175" y2="120" stroke="#475569" stroke-width="1.5" />
  <line x1="150" y1="77" x2="200" y2="77" stroke="#475569" stroke-width="1.5" />
  <!-- Cityscape silhouette outside window -->
  <path d="M155 120 L155 95 L162 95 L162 120 L168 120 L168 85 L173 85 L173 120 L180 120 L180 70 L188 70 L188 120 L195 120 L195 100 L198 100 L198 120 Z" fill="#334155" opacity="0.6" />

  <!-- Light Beam from Window -->
  <polygon points="150,35 200,35 230,170 110,170" fill="url(#light-beam)" />

  <!-- Hanging Official Emblem / Star Motif (Abstract Representation of Government Authority) -->
  <circle cx="85" cy="50" r="14" fill="#334155" stroke="#f59e0b" stroke-width="2" />
  <polygon points="85,41 87.5,47 94,47 89,51 91,57 85,53 79,57 81,51 76,47 82.5,47" fill="#f59e0b" />

  <!-- Bookshelf Background Prop -->
  <rect x="35" y="40" width="25" height="70" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <line x1="35" y1="65" x2="60" y2="65" stroke="#334155" stroke-width="1" />
  <line x1="35" y1="90" x2="60" y2="90" stroke="#334155" stroke-width="1" />
  <!-- Books -->
  <rect x="39" y="45" width="5" height="18" fill="#38bdf8" rx="1" />
  <rect x="46" y="48" width="6" height="15" fill="#ec4899" rx="1" />
  <rect x="39" y="70" width="12" height="18" fill="#10b981" rx="1" />

  <!-- Large Executive Desk -->
  <path d="M10 160 L230 160 L220 210 L20 210 Z" fill="url(#desk-grad)" stroke="#475569" stroke-width="1.5" />
  <!-- Desk front highlight edge -->
  <path d="M10 160 L230 160 L235 166 L5 166 Z" fill="#475569" opacity="0.5" />

  <!-- Foreground Props on Desk -->
  <!-- Official Seal / Stamp Stand -->
  <rect x="180" y="145" width="16" height="20" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
  <path d="M176 143 L200 143 L198 147 L178 147 Z" fill="#ef4444" />
  <circle cx="188" cy="138" r="5" fill="#ef4444" />

  <!-- Small Plant Pot -->
  <path d="M35 152 L45 152 L47 165 L33 165 Z" fill="#f8fafc" />
  <circle cx="40" cy="147" r="8" fill="#10b981" />
  <circle cx="36" cy="144" r="6" fill="#34d399" />
  <circle cx="44" cy="145" r="7" fill="#059669" />

  <!-- Main Document (The New Law Being Promulgated) -->
  <g transform="translate(115, 135) rotate(-8)">
    <!-- Paper base -->
    <rect x="0" y="0" width="45" height="55" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <!-- Header Stamp/Seal -->
    <circle cx="22" cy="12" r="6" fill="#ef4444" opacity="0.85" />
    <!-- Text Lines Representation -->
    <line x1="8" y1="24" x2="37" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="32" x2="37" y2="32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="40" x2="25" y2="40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Ribbon / Gold Seal -->
    <path d="M30 46 L35 55 L32 57 L29 55 L24 57 L27 46 Z" fill="url(#doc-gold)" />
  </g>

  <!-- CHARACTER: Government Official / Leader Promulgating the Law -->
  <!-- Character Body / Suit (Sitting Behind Desk) -->
  <path d="M75 190 C75 160 115 160 115 190 Z" fill="#1e293b" />
  <!-- White Shirt Collar & Red Tie -->
  <polygon points="95,160 90,172 100,172" fill="#f8fafc" />
  <polygon points="95,168 93,185 97,185" fill="#ef4444" />
  <!-- Suit Lapels -->
  <path d="M75 162 L90 178 L80 195" fill="#0f172a" />
  <path d="M115 162 L100 178 L110 195" fill="#0f172a" />

  <!-- Character Neck -->
  <rect x="89" y="148" width="12" height="15" fill="#fcd34d" />

  <!-- Character Head -->
  <circle cx="95" cy="130" r="20" fill="#fcd34d" />
  
  <!-- Hair -->
  <path d="M75 130 C75 115 82 110 95 110 C108 110 115 115 115 130 C115 130 112 118 95 118 C78 118 75 130 75 130 Z" fill="#334155" />

  <!-- Friendly, Confident Facial Expression -->
  <!-- Eyebrows -->
  <path d="M83 123 Q88 120 93 123" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <path d="M97 123 Q102 120 107 123" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <!-- Eyes (Happy / Focused) -->
  <circle cx="88" cy="128" r="2" fill="#1e293b" />
  <circle cx="102" cy="128" r="2" fill="#1e293b" />
  <!-- Smile -->
  <path d="M91 137 Q95 142 99 137" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Cheeks (Warm glow) -->
  <circle cx="84" cy="133" r="3" fill="#f87171" opacity="0.4" />
  <circle cx="106" cy="133" r="3" fill="#f87171" opacity="0.4" />

  <!-- Character Arms & Hands Actively Presenting/Pointing at the Document -->
  <!-- Left Arm (Supporting/Pointing) -->
  <path d="M78 175 C70 180 85 195 105 180" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
  <!-- Left Hand resting on desk near the document -->
  <circle cx="107" cy="172" r="5" fill="#fcd34d" />

  <!-- Right Arm (Active Gesture presenting the law) -->
  <path d="M112 175 C125 170 120 155 125 145" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
  <!-- Right Hand pointing proudly toward the new decree -->
  <circle cx="127" cy="142" r="5" fill="#fcd34d" />
  <!-- Pointing index finger -->
  <path d="M130 140 L136 137 L132 144 Z" fill="#fcd34d" />

  <!-- Foreground Ambient Highlights / Sparkles indicating importance & official action -->
  <g transform="translate(155, 95)">
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="#fbbf24" />
  </g>
  <g transform="translate(100, 105)">
    <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" fill="#38bdf8" />
  </g>
  <g transform="translate(65, 140)">
    <polygon points="0,-5 1.2,-1.2 5,0 1.2,1.2 0,5 -1.2,1.2 -5,0 -1.2,-1.2" fill="#fbbf24" />
  </g>
</svg>