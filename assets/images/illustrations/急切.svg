<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk Warm Light Gradient -->
    <radialGradient id="lamp-glow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Envelope Seal Glow -->
    <radialGradient id="env-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light from Lamp -->
  <circle cx="120" cy="90" r="110" fill="url(#lamp-glow)" />

  <!-- Background Environment: Room Interior & Bookshelf -->
  <!-- Bookshelf Background -->
  <g opacity="0.4">
    <rect x="25" y="40" width="45" height="90" rx="4" fill="#334155" />
    <rect x="30" y="55" width="35" height="8" fill="#475569" />
    <rect x="30" y="75" width="35" height="8" fill="#475569" />
    <rect x="30" y="95" width="35" height="8" fill="#475569" />
    <!-- Window with Night City -->
    <path d="M 170 35 L 210 35 L 210 110 L 170 110 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <path d="M 180 45 L 190 45 L 190 70 L 180 70 Z" fill="#38bdf8" opacity="0.3" />
    <path d="M 198 55 L 205 55 L 205 85 L 198 85 Z" fill="#fbbf24" opacity="0.2" />
    <line x1="190" y1="35" x2="190" y2="110" stroke="#334155" stroke-width="2" />
    <line x1="170" y1="72" x2="210" y2="72" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Hanging Desk Lamp -->
  <path d="M 120 0 L 120 45" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M 100 45 L 140 45 L 148 55 L 92 55 Z" fill="#475569" />
  <ellipse cx="120" cy="55" rx="28" ry="8" fill="#f59e0b" opacity="0.9" filter="url(#shadow)" />

  <!-- Wooden Desk Surface -->
  <rect x="15" y="165" width="210" height="60" rx="6" fill="#334155" filter="url(#shadow)" />
  <rect x="15" y="165" width="210" height="8" fill="#475569" />

  <!-- Desk Props (Coffee cup, notebook, lamp base) -->
  <!-- Coffee Cup with steam -->
  <rect x="180" y="135" width="16" height="22" rx="3" fill="#cbd5e1" />
  <path d="M 196 140 C 202 140 202 150 196 152" stroke="#cbd5e1" stroke-width="2" fill="none" />
  <path d="M 185 130 Q 187 124 185 118" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  
  <!-- Opened Results Document / Envelope (The Focus of "Result") -->
  <g transform="translate(100, 150)">
    <!-- Glow behind envelope -->
    <circle cx="20" cy="15" r="25" fill="url(#env-glow)" />
    <!-- Paper Folder / Document -->
    <path d="M -5 30 L 45 30 L 40 -10 L 0 -10 Z" fill="#f8fafc" filter="url(#shadow)" />
    <path d="M 5 35 L 55 35 L 50 -5 L 10 -5 Z" fill="#e2e8f0" filter="url(#shadow)" />
    <!-- Abstract graphs representing results -->
    <line x1="15" y1="10" x2="35" y2="10" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="18" x2="45" y2="18" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="26" x2="25" y2="26" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Checkmark badge of result -->
    <circle cx="42" cy="12" r="8" fill="#10b981" />
    <path d="M 38 12 L 40.5 14.5 L 46 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Character: Eager Young Man leaning over desk -->
  <!-- Body / Torso (leaning forward) -->
  <path d="M 65 170 C 65 140 85 125 105 135 L 120 170 Z" fill="#38bdf8" />
  
  <!-- Chair Back -->
  <rect x="45" y="115" width="16" height="65" rx="8" fill="#475569" />

  <!-- Arms / Hands gripping edge of desk (expressing "Jíqiè" - eagerness/urgency) -->
  <!-- Left Arm -->
  <path d="M 85 135 C 95 135 115 145 125 155" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Left Hand gripping desk edge -->
  <circle cx="128" cy="158" r="7" fill="#fcd34d" />

  <!-- Right Arm -->
  <path d="M 95 135 C 105 140 120 150 132 158" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Right Hand gripping desk edge -->
  <circle cx="135" cy="160" r="7" fill="#fcd34d" />

  <!-- Neck & Head -->
  <path d="M 92 125 L 98 115 L 108 122 Z" fill="#fcd34d" />
  
  <!-- Head (Leaned forward intently) -->
  <circle cx="106" cy="100" r="22" fill="#fcd34d" />
  
  <!-- Hair (Neat modern styling) -->
  <path d="M 86 100 C 86 85 100 80 115 85 C 122 88 126 95 126 95 C 126 95 120 83 108 82 C 95 81 88 90 86 100 Z" fill="#1e293b" />

  <!-- Facial Features (Intense, focused, wide-eyed expression of anxious expectation) -->
  <!-- Eyebrows (Slanted upward in eagerness/concentration) -->
  <path d="M 96 93 L 104 95" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 112 95 L 120 93" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Eyes (Wide and attentive) -->
  <circle cx="100" cy="98" r="3.5" fill="#1e293b" />
  <circle cx="116" cy="98" r="3.5" fill="#1e293b" />
  <!-- Eye Sparkles -->
  <circle cx="101" cy="97" r="1" fill="#ffffff" />
  <circle cx="117" cy="97" r="1" fill="#ffffff" />

  <!-- Mouth (Firmly set, biting lip or slight open anticipation) -->
  <path d="M 106 108 C 108 108 110 108 112 107" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Sweat drop / Emotion cue for eagerness/urgency -->
  <path d="M 124 88 C 124 88 128 93 128 96 C 128 98 126 100 124 100 C 122 100 120 98 120 96 C 120 93 124 88 124 88 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Dynamic Motion / Anticipation Lines near the head -->
  <path d="M 134 85 Q 140 90 136 95" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 138 78 Q 146 85 142 92" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />

</svg>