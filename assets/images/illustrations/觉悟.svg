<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="80" rx="2" fill="#334155"/>
  <rect x="180" y="150" width="10" height="80" rx="2" fill="#334155"/>
  
  <!-- Clutter representing the "before" state -->
  <path d="M60 135 L80 135 L75 120 Z" fill="#475569"/>
  <circle cx="100" cy="130" r="8" fill="#475569"/>
  
  <!-- The Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 100 C-30 60, 30 60, 30 100" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#fde68a"/>
    <!-- Eyes (Wide, realization look) -->
    <ellipse cx="-8" cy="25" rx="3" ry="4" fill="#0f172a"/>
    <ellipse cx="8" cy="25" rx="3" ry="4" fill="#0f172a"/>
    <!-- Mouth (Small gasp) -->
    <circle cx="0" cy="38" r="3" fill="#0f172a"/>
  </g>
  
  <!-- The "Aha!" Moment (Lightbulb/Glow) -->
  <g>
    <circle cx="160" cy="60" r="15" fill="#fbbf24" opacity="0.8"/>
    <circle cx="160" cy="60" r="25" fill="#fbbf24" opacity="0.2"/>
    <path d="M160 75 L160 90 M155 90 L165 90" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Scattered papers/clutter being pushed away -->
  <path d="M140 130 L160 125 L155 110 Z" fill="#94a3b8"/>
  <rect x="170" y="130" width="20" height="5" rx="1" fill="#94a3b8" transform="rotate(20 180 130)"/>
  
  <!-- Ambient glow on desk -->
  <ellipse cx="120" cy="140" rx="40" ry="10" fill="#fbbf24" opacity="0.1"/>
</svg>