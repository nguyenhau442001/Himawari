<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Warm Impulsive Glow -->
    <radialGradient id="impulse-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Splash Gradient -->
    <linearGradient id="liquid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Wallpaper Patterns & Environment Context -->
  <g opacity="0.15">
    <!-- Bookshelf lines / office backdrop -->
    <rect x="20" y="20" width="50" height="70" rx="4" fill="#94a3b8"/>
    <rect x="80" y="30" width="40" height="60" rx="4" fill="#94a3b8"/>
    <rect x="170" y="15" width="50" height="75" rx="4" fill="#94a3b8"/>
    <line x1="20" y1="55" x2="70" y2="55" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="65" x2="120" y2="65" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Floor Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="url(#floor-grad)"/>
  <!-- Floor Baseboard Line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Impulsive Energy Aura behind Character -->
  <circle cx="110" cy="120" r="70" fill="url(#impulse-glow)"/>

  <!-- Office Desk -->
  <path d="M40 140 L200 140 L210 180 L30 180 Z" fill="url(#desk-grad)"/>
  <rect x="35" y="135" width="170" height="8" rx="2" fill="#94a3b8"/>

  <!-- Messy Desk Props (Causing the trouble) -->
  <!-- Laptop -->
  <path d="M130 135 L180 135 L190 120 L120 120 Z" fill="#cbd5e1"/>
  <path d="M120 120 L190 120 L190 122 L120 122 Z" fill="#64748b"/>
  <!-- Glowing laptop screen -->
  <path d="M133 118 L177 118 L183 95 L127 95 Z" fill="#0f172a"/>
  <path d="M136 115 L174 115 L178 98 L132 98 Z" fill="#38bdf8" opacity="0.4"/>

  <!-- Flying Documents / Papers scattering -->
  <g fill="#f8fafc">
    <path d="M150 90 L170 80 L175 90 L155 100 Z" transform="rotate(-15 160 90)" opacity="0.9"/>
    <path d="M165 70 L185 75 L180 85 L160 80 Z" transform="rotate(25 175 78)" opacity="0.9"/>
    <path d="M185 100 L205 110 L200 120 L180 110 Z" transform="rotate(45 190 110)" opacity="0.8"/>
  </g>

  <!-- Fallen / Knocked-over Coffee Mug & Splash -->
  <ellipse cx="95" cy="142" rx="12" ry="6" fill="#0f172a"/>
  <!-- Coffee Liquid Splash arc in mid-air -->
  <path d="M85 130 C75 110, 60 125, 50 100 C45 85, 60 70, 75 90 C85 105, 90 120, 85 130 Z" fill="url(#liquid-grad)"/>
  <!-- Falling Coffee Drops -->
  <circle cx="55" cy="85" r="3" fill="#38bdf8"/>
  <circle cx="45" cy="110" r="2" fill="#38bdf8"/>
  <circle cx="68" cy="75" r="2.5" fill="#38bdf8"/>
  <!-- Mug body rolling -->
  <path d="M85 135 L105 130 L108 145 L88 150 Z" fill="#f43f5e"/>
  <path d="M100 132 C112 130, 112 145, 103 147" stroke="#f43f5e" stroke-width="3" fill="none"/>

  <!-- CHARACTER: The impulsive man causing trouble -->
  <g transform="translate(10, 0)">
    <!-- Body / Torso (Dynamic leaning forward posture) -->
    <path d="M90 130 L115 110 L135 150 L105 175 Z" fill="#2563eb"/>
    
    <!-- Arms (Wild, impulsive gesture knocking things over) -->
    <!-- Back Arm -->
    <path d="M95 120 L70 110 L60 125" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front Arm swinging forward -->
    <path d="M120 115 L95 135 L80 130" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Hand -->
    <circle cx="75" cy="130" r="6" fill="#fbcfe8"/>

    <!-- Head & Expressive Face (Shocked, realizing he messed up) -->
    <circle cx="120" cy="85" r="22" fill="#fbcfe8"/>
    
    <!-- Hair (Messy, animated) -->
    <path d="M98 85 C98 65, 120 60, 135 75 C142 68, 148 78, 142 88 C145 92, 140 98, 135 95 C125 98, 105 95, 98 85 Z" fill="#1e293b"/>

    <!-- Shocked Face Features -->
    <!-- Wide open eyes -->
    <circle cx="120" cy="83" r="4" fill="#0f172a"/>
    <circle cx="132" cy="83" r="4" fill="#0f172a"/>
    <circle cx="121" cy="82" r="1.5" fill="#ffffff"/>
    <circle cx="133" cy="82" r="1.5" fill="#ffffff"/>
    <!-- Surprised Eyebrows (high up) -->
    <path d="M115 74 Q120 70 125 75" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M128 74 Q133 70 138 75" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Open 'O' Mouth of regret/panic -->
    <ellipse cx="127" cy="94" rx="4" ry="6" fill="#0f172a"/>

    <!-- Sweat Drop (Classic trouble trope) -->
    <path d="M142 75 C142 75, 148 83, 148 88 C148 91, 145 93, 142 93 C139 93, 136 91, 136 88 C136 83, 142 75, 142 75 Z" fill="#38bdf8"/>
  </g>

  <!-- Foreground Warning / Action Elements (Visualizing "Gây họa/Rắc rối") -->
  <!-- Exclamation marks / tension lines floating around the accident zone -->
  <g fill="#f59e0b">
    <path d="M60 65 L64 85 L58 87 L55 67 Z"/>
    <circle cx="59.5" cy="93" r="3"/>
    
    <path d="M180 50 L184 70 L178 72 L175 52 Z" transform="rotate(15 180 60)"/>
    <circle cx="178" cy="78" r="3" transform="rotate(15 180 60)"/>
  </g>

  <!-- Subtle vignette/border framing -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>
</svg>