<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements to give context of text/language study -->
  <g opacity="0.15">
    <line x1="40" y1="60" x2="100" y2="60" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="85" x2="80" y2="85" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="180" x2="90" y2="180" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Central Physical Object representing "词" (A book/dictionary opened to a page displaying vocabulary, symbolizing words) -->
  <g transform="translate(0, 5)">
    <!-- Dictionary / Book Base (Shadow/Back) -->
    <path d="M 60 70 L 120 55 L 180 70 L 180 165 L 120 150 L 60 165 Z" fill="#2C3440"/>
    
    <!-- Left Page -->
    <path d="M 65 74 L 118 60 L 118 153 L 65 166 Z" fill="#F0F4F8"/>
    
    <!-- Right Page -->
    <path d="M 122 60 L 175 74 L 175 166 L 122 153 Z" fill="#E2E8F0"/>

    <!-- Center Binding Shadow -->
    <line x1="120" y1="58" x2="120" y2="153" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Lines of Text (Left Page) -->
    <g fill="#94A3B8">
      <rect x="75" y="80" width="30" height="4" rx="2"/>
      <rect x="75" y="92" width="36" height="4" rx="2"/>
      <rect x="75" y="104" width="28" height="4" rx="2"/>
      <rect x="75" y="116" width="34" height="4" rx="2"/>
    </g>

    <!-- Highlighted Focus Word Block on Right Page (Representing the core concept of a specific 'word') -->
    <g transform="translate(132, 85)">
      <!-- Focus background badge -->
      <rect x="0" y="0" width="34" height="24" rx="4" fill="#F59E0B"/>
      <!-- Abstract representation of character/word strokes inside the badge -->
      <line x1="8" y1="8" x2="26" y2="8" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="16" x2="20" y2="16" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Additional text lines on right page -->
    <g fill="#94A3B8">
      <rect x="132" y="125" width="30" height="4" rx="2"/>
      <rect x="132" y="137" width="24" height="4" rx="2"/>
    </g>
  </g>

  <!-- Magnifying Glass (Tool to inspect/use the word, directly answering "这个词怎么用") -->
  <g transform="translate(110, 105)">
    <!-- Glass shadow -->
    <circle cx="51" cy="51" r="32" fill="#000000" opacity="0.3"/>
    
    <!-- Glass Rim -->
    <circle cx="50" cy="50" r="32" fill="none" stroke="#3B82F6" stroke-width="7"/>
    
    <!-- Lens reflection/background -->
    <circle cx="50" cy="50" r="28" fill="#E0F2FE" opacity="0.9"/>
    
    <!-- Handle -->
    <path d="M 28 72 L 7 93 C 3 97 3 103 7 107 C 11 111 17 111 21 107 L 42 86 Z" fill="#F59E0B"/>
    <path d="M 28 72 L 7 93 C 3 97 3 103 7 107 C 11 111 17 111 21 107 L 42 86 Z" fill="#000000" opacity="0.1"/>

    <!-- Focus marker inside lens (pointing precisely at the word meaning) -->
    <path d="M 42 42 L 58 58 M 58 42 L 42 58" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>