<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="attachment-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light / Window Glow from behind -->
  <path d="M 60,0 L 180,0 L 210,120 L 30,120 Z" fill="#38bdf8" opacity="0.04" />
  
  <!-- Desk Surface -->
  <path d="M 0,175 L 240,175 L 240,240 L 0,240 Z" fill="#0f172a" />
  <rect x="0" y="170" width="240" height="7" rx="3" fill="#334155" />

  <!-- Office Plant Context Prop (Left) -->
  <g transform="translate(18, 125)" filter="url(#soft-shadow)">
    <!-- Pot -->
    <path d="M 8,25 L 22,25 L 26,45 L 4,45 Z" fill="#64748b" />
    <ellipse cx="15" cy="25" rx="7" ry="2" fill="#94a3b8" />
    <!-- Leaves -->
    <path d="M 15,25 Q 2,15 0,5 Q 12,12 15,25 Z" fill="#10b981" />
    <path d="M 15,25 Q 25,10 30,0 Q 20,12 15,25 Z" fill="#059669" />
    <path d="M 15,25 Q 12,2 18,-5 Q 18,12 15,25 Z" fill="#34d399" />
  </g>

  <!-- Coffee Mug Context Prop (Right) -->
  <g transform="translate(195, 140)" filter="url(#soft-shadow)">
    <!-- Handle -->
    <path d="M 14,6 C 22,6 22,18 14,20" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
    <!-- Cup Body -->
    <rect x="0" y="2" width="16" height="24" rx="3" fill="#f1f5f9" />
    <!-- Coffee Surface -->
    <ellipse cx="8" cy="4" rx="7" ry="2" fill="#78350f" />
    <!-- Steam -->
    <path d="M 5,-2 C 3,-5 9,-7 7,-10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Computer Monitor & Workstation -->
  <g transform="translate(45, 45)" filter="url(#soft-shadow)">
    <!-- Monitor Stand -->
    <path d="M 62,110 L 88,110 L 95,128 L 55,128 Z" fill="#475569" />
    <rect x="40" y="126" width="75" height="6" rx="3" fill="#64748b" />
    
    <!-- Monitor Frame -->
    <rect x="0" y="0" width="150" height="112" rx="10" fill="#334155" />
    <rect x="6" y="6" width="138" height="100" rx="6" fill="url(#screen-grad)" />

    <!-- UI: Email Header -->
    <rect x="16" y="16" width="118" height="16" rx="4" fill="#1e293b" opacity="0.4" />
    <circle cx="24" cy="24" r="4" fill="#ef4444" />
    <circle cx="36" cy="24" r="4" fill="#f59e0b" />
    <circle cx="48" cy="24" r="4" fill="#10b981" />

    <!-- UI: Email Body Lines -->
    <rect x="18" y="42" width="90" height="6" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="18" y="54" width="70" height="5" rx="2.5" fill="#ffffff" opacity="0.6" />

    <!-- THE TARGET CONCEPT: ATTACHMENT (Tệp đính kèm / 附件) -->
    <!-- Glowing pulse highlighting the attachment box -->
    <rect x="16" y="66" width="118" height="30" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#glow)" />
    
    <!-- Attachment Icon (Paperclip & Document) -->
    <g transform="translate(24, 73)">
      <!-- Mini doc icon -->
      <rect x="0" y="0" width="12" height="16" rx="2" fill="#f8fafc" />
      <path d="M 3,4 L 9,4 M 3,8 L 9,8 M 3,12 L 7,12" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Paperclip symbol -->
      <path d="M 18,3 L 18,13 C 18,15 15,15 15,13 L 15,5 C 15,3 13,3 13,5 L 13,12 C 13,14 11,14 11,12 L 11,4" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Attachment Label Lines -->
    <rect x="52" y="76" width="55" height="5" rx="2.5" fill="#f1f5f9" />
    <rect x="52" y="86" width="30" height="4" rx="2" fill="#fbbf24" />

    <!-- Glowing Notification Dot -->
    <circle cx="126" cy="81" r="5" fill="#ef4444" />
    <circle cx="126" cy="81" r="8" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Character (Lower Left / Foreground interacting) -->
  <g transform="translate(15, 115)" filter="url(#soft-shadow)">
    <!-- Body / Shoulders -->
    <path d="M 10,75 C 10,55 35,50 50,50 C 65,50 90,55 90,75 L 90,90 L 10,90 Z" fill="#4f46e5" />
    <!-- Collar -->
    <path d="M 35,50 L 50,65 L 65,50 Z" fill="#ffffff" />

    <!-- Neck -->
    <rect x="42" y="38" width="16" height="15" rx="6" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="50" cy="28" r="18" fill="#fbcfe8" />
    
    <!-- Hair -->
    <path d="M 32,28 C 32,14 42,10 50,10 C 58,10 68,14 68,28 C 68,32 66,22 60,18 C 54,14 46,14 40,18 C 34,22 32,28 32,28 Z" fill="#1e293b" />

    <!-- Ear -->
    <circle cx="32" cy="28" r="3" fill="#fbcfe8" />

    <!-- Friendly facial expression looking up at screen -->
    <circle cx="43" cy="27" r="1.5" fill="#1e293b" />
    <circle cx="53" cy="27" r="1.5" fill="#1e293b" />
    <!-- Smile -->
    <path d="M 46,32 Q 48,35 51,32" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cute blush -->
    <ellipse cx="41" cy="31" rx="2.5" ry="1.5" fill="#fda4af" opacity="0.6" />
    <ellipse cx="55" cy="31" rx="2.5" ry="1.5" fill="#fda4af" opacity="0.6" />

    <!-- Pointing / Active Arm reaching towards monitor -->
    <path d="M 75,65 C 85,60 95,50 105,45" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <!-- Hand -->
    <circle cx="107" cy="44" r="5" fill="#fbcfe8" />
  </g>

</svg>