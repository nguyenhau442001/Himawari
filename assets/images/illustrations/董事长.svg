<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window City Glow Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Desk / Wood Tone -->
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Suit Gradient -->
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- INTERIOR ENVIRONMENT: Executive Office -->
  <!-- Wallpaper Paneling Line -->
  <line x1="0" y1="130" x2="240" y2="130" stroke="#334155" stroke-width="2" />
  
  <!-- Large Executive Window in Background -->
  <g transform="translate(140, 30)">
    <rect width="70" height="90" rx="4" fill="url(#window-glow)" stroke="#475569" stroke-width="2" />
    <!-- City Skyline Silhouette through window -->
    <path d="M10 90 L10 60 L18 60 L18 90 L25 90 L25 45 L35 45 L35 90 L45 90 L45 35 L55 35 L55 90 L62 90 L62 55 L70 55 L70 90 Z" fill="#38bdf8" opacity="0.2" />
    <!-- Window Panes Grid -->
    <line x1="35" y1="0" x2="35" y2="90" stroke="#475569" stroke-width="1.5" />
    <line x1="0" y1="45" x2="70" y2="45" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Bookshelf / Decor Background Element -->
  <g transform="translate(20, 45)">
    <rect width="30" height="70" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="25" x2="30" y2="25" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="30" y2="50" stroke="#334155" stroke-width="1.5"/>
    <!-- Books -->
    <rect x="6" y="10" width="5" height="15" rx="1" fill="#f59e0b" opacity="0.8"/>
    <rect x="13" y="12" width="4" height="13" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="8" y="35" width="14" height="15" rx="1" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Corporate Wall Art / Plaque -->
  <g transform="translate(75, 35)" filter="url(#soft-shadow)">
    <rect width="36" height="26" rx="2" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="18" cy="11" r="5" fill="#fbbf24" opacity="0.8"/>
    <path d="M11 20 C11 16 25 16 25 20" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
  </g>

  <!-- EXECUTIVE DESK -->
  <!-- Desk Base Surface (Front facing) -->
  <path d="M30 180 L210 180 L220 215 L20 215 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <!-- Desk Top Surface -->
  <polygon points="20,165 220,165 210,180 30,180" fill="url(#wood-desk)" stroke="#475569" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- DESK PROPS -->
  <!-- Modern Laptop -->
  <g transform="translate(130, 150)">
    <path d="M0 16 L35 16 L40 20 L-5 20 Z" fill="#64748b" />
    <rect x="3" y="2" width="29" height="15" rx="1" fill="#94a3b8" />
    <rect x="5" y="4" width="25" height="11" fill="#0f172a" />
  </g>
  <!-- Name Plate (Signifying Chairman / 董事长 Position) -->
  <g transform="translate(60, 158)" filter="url(#soft-shadow)">
    <path d="M0 7 L26 7 L22 0 L4 0 Z" fill="#fbbf24" />
    <rect x="2" y="7" width="22" height="3" rx="1" fill="#d97706" />
    <!-- Decorative gold emblem on plate -->
    <circle cx="13" cy="3" r="1.5" fill="#78350f" />
  </g>
  <!-- Plant in Pot -->
  <g transform="translate(185, 142)">
    <ellipse cx="9" cy="18" rx="8" ry="3" fill="#334155" />
    <path d="M4 18 L6 26 L12 26 L14 18 Z" fill="#e2e8f0" />
    <path d="M9 18 C9 10 2 8 2 4 C6 4 9 10 9 18 Z" fill="#10b981" />
    <path d="M9 18 C9 8 16 6 16 2 C12 2 9 8 9 18 Z" fill="#34d399" />
  </g>

  <!-- CHAIRMAN CHARACTER (董事长) -->
  <g transform="translate(85, 80)" filter="url(#soft-shadow)">
    <!-- Office Chair Backrest -->
    <rect x="10" y="-10" width="50" height="75" rx="12" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <!-- Chair Headrest -->
    <rect x="22" y="-22" width="26" height="14" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Character Torso & Suit -->
    <!-- Shoulders / Suit Jacket -->
    <path d="M5 65 L20 40 L50 40 L65 65 L60 90 L10 90 Z" fill="url(#suit-grad)" />
    <!-- Crisp White Shirt Collar -->
    <polygon points="35,40 28,52 42,52" fill="#f8fafc" />
    <!-- Executive Silk Tie -->
    <polygon points="33,50 37,50 39,78 35,82 31,78" fill="#ef4444" />
    <!-- Lapel Accent Pin (Gold Board Member Badge) -->
    <circle cx="25" cy="48" r="2.5" fill="#fbbf24" />

    <!-- Character Neck -->
    <rect x="29" y="30" width="12" height="14" rx="4" fill="#fbcfe8" />

    <!-- Character Head & Face -->
    <ellipse cx="35" cy="15" rx="16" ry="18" fill="#fbcfe8" />
    
    <!-- Friendly, Confident Chairman Expression -->
    <!-- Professional Hair Style (Dark, Neatly Combed Side Part) -->
    <path d="M19 12 C19 3 26 0 36 1 C47 2 51 8 51 16 C51 18 50 12 48 8 C44 2 34 2 24 5 C20 7 19 10 19 12 Z" fill="#1e293b" />
    
    <!-- Confident Eyes (Friendly curve with glasses) -->
    <circle cx="28" cy="14" r="3.5" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="42" cy="14" r="3.5" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <line x1="31.5" y1="14" x2="38.5" y2="14" stroke="#1e293b" stroke-width="1.5" />
    <!-- Eyebrows -->
    <path d="M25 8 Q28 6 31 9" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M39 9 Q42 6 45 8" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Warm Welcoming Smile -->
    <path d="M30 22 Q35 27 40 22" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

    <!-- Gesturing Hands (One hand open, welcoming/leading) -->
    <!-- Left Arm & Hand (Resting on desk edge) -->
    <path d="M8 65 Q -5 75 -2 88 L12 85 Z" fill="#334155" />
    <circle cx="-3" cy="89" r="4.5" fill="#fbcfe8" />

    <!-- Right Arm (Active leadership gesture) -->
    <path d="M62 65 Q 75 70 68 85 L55 80 Z" fill="#334155" />
    <circle cx="70" cy="85" r="4.5" fill="#fbcfe8" />
  </g>

  <!-- FOREGROUND LIGHTING & VIGNETTE EFFECT -->
  <!-- Top Rim Light from ceiling fixture -->
  <path d="M0 0 L240 0 L240 4 L0 4 Z" fill="url(#gold-glow)" opacity="0.6" />
  
  <!-- Subtle corner shadows for rich depth -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#020617" stop-opacity="0.6" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none" />
</svg>