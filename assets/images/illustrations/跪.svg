<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient floor shadow for depth -->
  <ellipse cx="120" cy="192" rx="64" ry="10" fill="#12141A" opacity="0.8"/>
  
  <!-- Traditional floor mat / tatami base -->
  <rect x="68" y="184" width="104" height="12" rx="4" fill="#2A2F3D"/>
  <rect x="76" y="182" width="88" height="4" rx="2" fill="#363C4E"/>

  <!-- Kneeling Character (Person representing "跪" - Guì) -->
  <g id="kneeling-figure">
    <!-- Lower body / Bent legs and knees touching the ground -->
    <path d="M96 160 C 96 172, 104 184, 120 184 C 136 184, 144 172, 144 160 C 144 150, 138 144, 132 140 L 108 140 C 102 144, 96 150, 96 160 Z" fill="#3B82F6"/>
    
    <!-- Robe / Traditional attire body fold -->
    <path d="M92 120 C 92 108, 104 96, 120 96 C 136 96, 148 108, 148 120 L 152 152 C 152 160, 144 168, 136 168 L 104 168 C 96 168, 88 160, 88 152 Z" fill="#2563EB"/>
    <path d="M106 102 L 120 130 L 134 102 Z" fill="#1D4ED8" opacity="0.4"/>

    <!-- Torso / Upper Body leaning slightly forward in respect -->
    <path d="M94 104 C 94 84, 104 76, 120 76 C 136 76, 146 84, 146 104 L 146 124 C 146 130, 140 136, 132 136 L 108 136 C 100 136, 94 130, 94 124 Z" fill="#3B82F6"/>

    <!-- Head -->
    <circle cx="120" cy="56" r="16" fill="#FDE047"/>
    <!-- Hair -->
    <path d="M104 56 C 104 44, 112 40, 120 40 C 128 40, 136 44, 136 56 Z" fill="#1E293B"/>

    <!-- Arms stretched forward in respectful bow/obeisance -->
    <path d="M100 108 C 84 112, 72 124, 68 136" stroke="#2563EB" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M140 108 C 156 112, 168 124, 172 136" stroke="#2563EB" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Hands placed respectfully -->
    <circle cx="66" cy="140" r="5" fill="#FDE047"/>
    <circle cx="174" cy="140" r="5" fill="#FDE047"/>
  </g>

  <!-- Accent focal elements: golden celebratory rays/sparks indicating traditional ceremony/New Year context -->
  <g fill="#F59E0B">
    <circle cx="60" cy="80" r="2.5" opacity="0.8"/>
    <circle cx="180" cy="80" r="2.5" opacity="0.8"/>
    <circle cx="120" cy="28" r="3" opacity="0.9"/>
    <circle cx="90" cy="36" r="2" opacity="0.6"/>
    <circle cx="150" cy="36" r="2" opacity="0.6"/>
  </g>
</svg>