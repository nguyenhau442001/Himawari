<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Archaeological Base / Pedestal -->
    <path d="M 60 175 L 180 175 L 195 190 L 45 190 Z" fill="#2A2F3D"/>
    <rect x="70" y="165" width="100" height="10" rx="2" fill="#3A4256"/>
    
    <!-- Broken Ancient Artifact (Fragmented on the left side, restored on the right) -->
    <!-- Left fragmented/wireframe scanning state -->
    <g transform="translate(0, 0)">
      <!-- Back broken piece -->
      <path d="M 95 110 L 115 100 L 115 140 L 95 145 Z" fill="#4E5970" opacity="0.6"/>
      <!-- Floating shards -->
      <polygon points="80,120 90,115 88,130" fill="#E5A93B" opacity="0.5"/>
      <polygon points="105,90 115,95 110,105" fill="#E5A93B" opacity="0.6"/>
      <polygon points="85,145 95,140 92,155" fill="#D49427" opacity="0.5"/>
    </g>

    <!-- Digital Scanner / Restoration Beam Effect -->
    <defs>
      <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
        <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
      </linearGradient>
      <linearGradient id="goldVessel" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FACC15"/>
        <stop offset="100%" stop-color="#CA8A04"/>
      </linearGradient>
    </defs>
    
    <!-- Holographic grid lines & scanning arc -->
    <path d="M 120 70 L 120 175" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M 90 85 Q 120 70 150 85" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
    <path d="M 75 110 Q 120 90 165 110" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <path d="M 65 140 Q 120 120 175 140" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

    <!-- Right Side: Fully Restored Ancient Bronze/Gold Ritual Vessel (Ding/Vase) -->
    <g transform="translate(15, 0)">
      <!-- Main Vessel Body -->
      <path d="M 105 95 C 105 90 112 85 120 85 C 128 85 135 90 135 95 C 145 100 152 115 148 135 C 145 150 135 160 120 165 C 105 160 95 150 92 135 C 88 115 95 100 105 95 Z" fill="url(#goldVessel)"/>
      
      <!-- Vessel Rim -->
      <ellipse cx="120" cy="85" rx="16" ry="5" fill="#FEF08A"/>
      <ellipse cx="120" cy="85" rx="12" ry="3" fill="#CA8A04"/>

      <!-- Traditional Chinese/Ancient Motif Engraving on Vessel -->
      <path d="M 112 105 Q 120 115 128 105" fill="none" stroke="#713F12" stroke-width="2" stroke-linecap="round"/>
      <path d="M 110 125 Q 120 135 130 125" fill="none" stroke="#713F12" stroke-width="2" stroke-linecap="round"/>
      <circle cx="120" cy="115" r="3" fill="#713F12"/>
      
      <!-- Vessel Handles -->
      <path d="M 105 92 C 95 92 92 105 98 112" fill="none" stroke="url(#goldVessel)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 135 92 C 145 92 148 105 142 112" fill="none" stroke="url(#goldVessel)" stroke-width="4" stroke-linecap="round"/>

      <!-- Vessel Base/Feet -->
      <path d="M 108 163 L 102 173 L 112 173 Z" fill="#CA8A04"/>
      <path d="M 132 163 L 138 173 L 128 173 Z" fill="#CA8A04"/>
      <path d="M 120 165 L 120 175 L 124 175 Z" fill="#CA8A04"/>
    </g>

    <!-- Sci-fi / Tech Restoration Elements (Floating nodes & particles) -->
    <circle cx="145" cy="80" r="2.5" fill="#38BDF8"/>
    <circle cx="165" cy="120" r="2" fill="#38BDF8" opacity="0.8"/>
    <circle cx="135" cy="155" r="3" fill="#38BDF8" opacity="0.6"/>
    <circle cx="75" cy="95" r="2" fill="#E5A93B"/>
    <circle cx="60" cy="130" r="1.5" fill="#38BDF8"/>
    
    <!-- Laser emitter arm (Top right corner detail) -->
    <path d="M 195 55 L 165 75" stroke="#4B5563" stroke-width="4" stroke-linecap="round"/>
    <circle cx="165" cy="75" r="4" fill="#38BDF8"/>
    <!-- Light beam from emitter to artifact -->
    <polygon points="165,75 120,85 120,165" fill="url(#scanBeam)" opacity="0.4"/>
  </g>
</svg>