<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road surface -->
  <path d="M40 160 L200 160 L180 220 L60 220 Z" fill="#2D3436"/>
  <path d="M40 160 L60 220" stroke="#4A5568" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M120 160 L120 220" stroke="#4A5568" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M200 160 L180 220" stroke="#4A5568" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Barrier structure -->
  <rect x="50" y="120" width="140" height="20" rx="4" fill="#F6AD55"/>
  <rect x="50" y="140" width="10" height="40" fill="#A0AEC0"/>
  <rect x="180" y="140" width="10" height="40" fill="#A0AEC0"/>
  
  <!-- "X" warning sign on barrier -->
  <path d="M95 125 L105 135 M105 125 L95 135" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 125 L145 135 M145 125 L135 135" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Fog/Atmospheric effect -->
  <ellipse cx="120" cy="140" rx="90" ry="40" fill="#E2E8F0" fill-opacity="0.15"/>
  <ellipse cx="120" cy="120" rx="70" ry="30" fill="#E2E8F0" fill-opacity="0.1"/>
</svg>