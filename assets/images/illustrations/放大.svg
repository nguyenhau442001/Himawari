<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Magnifier Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props -->
  <!-- Bookshelf / Wall Decor -->
  <rect x="25" y="35" width="45" height="4" rx="2" fill="#334155"/>
  <rect x="35" y="20" width="12" height="15" rx="2" fill="#f43f5e"/>
  <rect x="50" y="23" width="10" height="12" rx="2" fill="#38bdf8"/>
  
  <!-- Desk Surface -->
  <path d="M10 195 L230 195 L220 215 L20 215 Z" fill="#090d16"/>
  <rect x="0" y="210" width="240" height="30" fill="#020617"/>
  <!-- Ambient Desk Lamp Glow -->
  <circle cx="190" cy="110" r="60" fill="url(#deskGlow)"/>

  <!-- Modern Desk Lamp -->
  <path d="M185 195 L195 195 L192 130 L188 130 Z" fill="#475569"/>
  <path d="M175 80 Q190 70 205 90 L195 95 Q188 85 180 88 Z" fill="#f59e0b"/>
  <ellipse cx="190" cy="95" rx="12" ry="6" fill="#fbbf24"/>
  <path d="M182 95 Q190 120 190 195" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="3"/>

  <!-- Computer Monitor -->
  <!-- Stand -->
  <path d="M100 195 L140 195 L135 175 L105 175 Z" fill="#334155"/>
  <rect x="90" y="193" width="60" height="3" rx="1.5" fill="#475569"/>
  <!-- Monitor Frame -->
  <rect x="45" y="70" width="150" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <!-- Screen Interior -->
  <rect x="51" y="76" width="138" height="93" rx="4" fill="url(#screenGrad)"/>
  <circle cx="120" cy="122" r="45" fill="url(#screenGlow)"/>

  <!-- Digital Photo Inside Monitor (Mountain/Sun Landscape) -->
  <g clip-path="url(#screenClip)">
    <clipPath id="screenClip">
      <rect x="51" y="76" width="138" height="93" rx="4"/>
    </clipPath>
    <!-- Photo Sky -->
    <rect x="51" y="76" width="138" height="93" fill="#1e1b4b"/>
    <!-- Sun -->
    <circle cx="140" cy="105" r="12" fill="#fb923c"/>
    <!-- Distant Mountains -->
    <path d="M51 145 L85 115 L115 140 L155 105 L189 145 Z" fill="#312e81"/>
    <!-- Foreground Hills (The Subject Photo Being Magnified) -->
    <path d="M51 155 L95 125 L135 150 L189 130 L189 169 L51 169 Z" fill="#059669"/>
    
    <!-- Detailed Cute Hiking Character inside the photo -->
    <circle cx="115" cy="130" r="4" fill="#f43f5e"/> <!-- backpack -->
    <circle cx="115" cy="125" r="3" fill="#fde047"/> <!-- head/hat -->
    <path d="M113 128 L117 128 L116 135 L114 135 Z" fill="#38bdf8"/> <!-- body -->
  </g>

  <!-- Monitor UI Frame Overlay -->
  <rect x="51" y="76" width="138" height="93" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Zoom UI overlay element (magnifying glass icon on screen top right) -->
  <rect x="165" y="82" width="18" height="12" rx="3" fill="#0f172a" opacity="0.8"/>
  <circle cx="171" cy="88" r="3" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="173.5" y1="90.5" x2="178" y2="95" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Floating Magnified View Bubble (Visualizing '放大' - Zoom In effect) -->
  <g transform="translate(110, 45)">
    <!-- Connecting dashed line to monitor -->
    <line x1="-15" y1="50" x2="-25" y2="75" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    
    <!-- Outer magnifying glass ring/bubble -->
    <circle cx="0" cy="0" r="28" fill="url(#lensGrad)" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Magnified Content Inside Bubble (Enlarged Hiker & Landscape details) -->
    <g clip-path="url(#bubbleClip)">
      <clipPath id="bubbleClip">
        <circle cx="0" cy="0" r="26"/>
      </clipPath>
      <!-- Enlarge landscape slice -->
      <rect x="-30" y="-30" width="60" height="60" fill="#059669"/>
      <path d="M-30 10 L-5 -10 L15 5 L30 -5 L30 30 L-30 30 Z" fill="#10b981"/>
      <circle cx="10" cy="-5" r="6" fill="#fde047"/>
      
      <!-- Supersized Cute Hiker Character (Center of Zoom Action) -->
      <circle cx="-2" cy="2" r="7" fill="#f43f5e"/> <!-- Red Backpack -->
      <circle cx="-2" cy="-5" r="6" fill="#fde047"/> <!-- Yellow Hat -->
      <path d="M-5 1 Q-2 1 0 -2 L2 6 L-6 6 Z" fill="#38bdf8"/> <!-- Blue Shirt -->
      <!-- Tiny binoculars -->
      <rect x="2" y="-5" width="5" height="3" rx="1.5" fill="#cbd5e1"/>
    </g>
    
    <!-- Lens Glass Specular Highlight -->
    <path d="M-16 -16 Q-5 -22 10 -16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Foreground Character (User actively performing the action) -->
  <g transform="translate(25, 120)">
    <!-- Body/Torso -->
    <path d="M30 65 Q45 50 65 65 L70 95 L25 95 Z" fill="#6366f1"/>
    <!-- Collar / Shirt Detail -->
    <path d="M42 58 L48 68 L54 58 Z" fill="#e0e7ff"/>
    
    <!-- Head & Face -->
    <circle cx="48" cy="38" r="16" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M33 38 Q33 20 48 22 Q63 20 63 38 Q63 30 55 25 Q48 24 41 26 Q33 30 33 38 Z" fill="#1e293b"/>
    <!-- Friendly Concentrated Expression -->
    <circle cx="42" cy="38" r="2" fill="#1e293b"/>
    <circle cx="54" cy="38" r="2" fill="#1e293b"/>
    <path d="M46 44 Q48 47 50 44" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arm reaching out towards computer/photo -->
    <path d="M60 62 Q75 60 85 72 L80 82 Q70 72 58 72 Z" fill="#fcd34d"/>
    <!-- Hand pointing / interacting -->
    <circle cx="85" cy="74" r="5" fill="#fcd34d"/>

    <!-- Desk Chair Back (partial) -->
    <path d="M10 50 Q10 30 25 35 L20 85 Q10 80 10 50 Z" fill="#334155" opacity="0.5"/>
  </g>

  <!-- Interactive UI Cursor / Pointer hovering the screen -->
  <g transform="translate(100, 115)">
    <polygon points="0,0 0,16 5,12 10,18 13,16 8,10 14,10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  </g>

</svg>