<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Steam / Heat Rising (Modern Flat Lines) -->
    <path d="M-20 -55 C-25 -65, -15 -75, -20 -85" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 -60 C-5 -72, 5 -80, 0 -92" fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M20 -55 C15 -65, 25 -75, 20 -85" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Chopsticks resting on top -->
    <g transform="rotate(-15)">
      <rect x="-55" y="-62" width="110" height="4" rx="2" fill="#D97706"/>
      <rect x="-53" y="-55" width="105" height="3" rx="1.5" fill="#F59E0B"/>
    </g>

    <!-- Noodle Cup Outer Rim (Top Ellipse) -->
    <ellipse cx="0" cy="-45" rx="65" ry="16" fill="#F8FAFC"/>
    <ellipse cx="0" cy="-45" rx="59" ry="13" fill="#0F172A"/>

    <!-- Noodles inside (Spiral/Wavy texture) -->
    <path d="M-40 -45 C-30 -38, -20 -48, -10 -42 C 0 -48,  10 -38,  20 -45 C 30 -40,  40 -48,  45 -42" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M-45 -48 C-35 -42, -25 -52, -15 -46 C-5 -52,  5 -42,  15 -48 C 25 -42,  35 -52,  42 -46" fill="none" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-30 -42 C-20 -36, -10 -46,   0 -40 C10 -46,  20 -36,  30 -42" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>

    <!-- Cup Body (Truncated Cone) -->
    <path d="M-59 -45 L-42 62 C-41 65, -38 67, -35 67 L35 67 C38 67, 41 65, 42 62 L59 -45 Z" fill="#EF4444"/>
    
    <!-- Cup Design Accent (Curved Band/Stripe) -->
    <path d="M-52 -10 L52 -10 L47 25 L-47 25 Z" fill="#DC2626"/>
    
    <!-- Decorative geometric flash on the cup (Abstract tasty icon representation) -->
    <circle cx="0" cy="7" r="10" fill="#FEF3C7"/>
    <path d="M-4 7 L-1 11 L5 3" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cup Bottom Ellipse -->
    <ellipse cx="0" cy="67" rx="35" ry="8" fill="#B91C1C"/>

    <!-- Flavor / Ingredient Accents (Shrimp/Egg/Veggie blocks floating realistically) -->
    <!-- Green Pea/Veggie -->
    <circle cx="-25" cy="-20" r="5" fill="#10B981"/>
    <circle cx="-22" cy="-18" r="1.5" fill="#6EE7B7"/>
    
    <!-- Corn Kernel -->
    <rect x="22" y="-25" width="8" height="8" rx="2" fill="#FBBF24" transform="rotate(15 26 -21)"/>
    
    <!-- Dried Carrot Slice -->
    <circle cx="28" cy="-5" r="6" fill="#F97316"/>
    <circle cx="28" cy="-5" r="3" fill="#FB923C"/>
  </g>
</svg>