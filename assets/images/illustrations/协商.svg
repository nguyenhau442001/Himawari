<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Table Surface -->
  <path d="M40 180 L200 180 L210 200 L30 200 Z" fill="#2D3139"/>
  
  <!-- The Solution/Plan Document -->
  <g transform="translate(120, 175) rotate(-5)">
    <rect x="-35" y="-45" width="70" height="50" rx="2" fill="#E0E0E0"/>
    <!-- Plan details (abstract lines) -->
    <rect x="-25" y="-35" width="30" height="4" rx="1" fill="#FF9F1C"/>
    <rect x="10" y="-35" width="15" height="4" rx="1" fill="#A0A0A0"/>
    <rect x="-25" y="-25" width="50" height="2" rx="1" fill="#A0A0A0"/>
    <rect x="-25" y="-18" width="50" height="2" rx="1" fill="#A0A0A0"/>
    <rect x="-25" y="-11" width="20" height="8" rx="1" fill="#FF9F1C" opacity="0.8"/>
    <rect x="5" y="-11" width="20" height="8" rx="1" fill="#4A90E2" opacity="0.8"/>
  </g>

  <!-- Character Left (The Negotiator) -->
  <g>
    <!-- Body -->
    <path d="M45 210 Q45 130 85 130 Q105 130 105 170" fill="#3D5A80"/>
    <!-- Head -->
    <circle cx="85" cy="110" r="16" fill="#FFDBAC"/>
    <!-- Arm/Hand Pointing to the Plan -->
    <path d="M100 165 L125 155" stroke="#FFDBAC" stroke-width="8" stroke-linecap="round"/>
    <!-- Motion lines for speech -->
    <path d="M108 105 Q115 105 115 112" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M112 100 Q122 100 122 112" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Character Right (The Partner) -->
  <g>
    <!-- Body -->
    <path d="M195 210 Q195 130 155 130 Q135 130 135 170" fill="#565E70"/>
    <!-- Head -->
    <circle cx="155" cy="110" r="16" fill="#F1C27D"/>
    <!-- Arm/Hand Gesturing/Listening -->
    <path d="M140 165 L120 168" stroke="#F1C27D" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand near chin (thinking/listening) -->
    <path d="M145 125 L148 118" stroke="#F1C27D" stroke-width="6" stroke-linecap="round"/>
    <!-- Motion lines for speech -->
    <path d="M132 105 Q125 105 125 112" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Interaction Focus (The Point of Negotiation) -->
  <circle cx="125" cy="155" r="4" fill="#FF9F1C">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>