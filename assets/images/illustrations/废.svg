<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Context reference: Broken heavy machine core, discarded/abandoned action -->
    <!-- Machine background frame -->
    <rect x="20" y="30" width="160" height="130" rx="12" fill="#282D37" stroke="#3A4252" stroke-width="3"/>
    
    <!-- Warning stripes on machine top -->
    <path d="M 30 30 L 40 30 L 35 42 L 25 42 Z" fill="#F59E0B" opacity="0.8"/>
    <path d="M 50 30 L 60 30 L 55 42 L 45 42 Z" fill="#F59E0B" opacity="0.3"/>
    <path d="M 70 30 L 80 30 L 75 42 L 65 42 Z" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Broken gears / cogs inside (damaged/worn out) -->
    <g transform="translate(70, 85)">
      <!-- Shattered/Broken Gear -->
      <path d="M-25,-5 L-18,-8 L-15,-18 L-8,-15 L-2,-22 L5,-15 L12,-20 L15,-10 L25,-12 L18,-3 L25,5 L15,8 L18,18 L8,15 L3,22 L-3,15 L-12,20 L-10,10 L-20,12 L-15,3 Z" fill="#4B5563" stroke="#1A1D24" stroke-width="2"/>
      <!-- Crack in the center gear -->
      <path d="M-5,-5 L8,8 M5,-5 L-8,8" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#1A1D24"/>
    </g>

    <!-- Secondary small broken gear flying off -->
    <g transform="translate(140, 55)">
      <circle cx="0" cy="0" r="10" fill="#4B5563" stroke="#F59E0B" stroke-dasharray="4,3" stroke-width="2"/>
      <path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#1A1D24" stroke-width="2"/>
    </g>

    <!-- Dynamic motion/discard lines -->
    <path d="M 125 45 C 135 35, 145 35, 155 45" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="3,3"/>
    <path d="M 135 38 C 142 30, 150 30, 157 38" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Sparks of failure -->
    <path d="M 95 65 L 105 55" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 55 100 L 45 108" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="110" cy="50" r="2" fill="#EF4444"/>
    <circle cx="40" cy="112" r="2" fill="#EF4444"/>

    <!-- Human Action: Hand casting aside / discarding the broken component -->
    <g transform="translate(10, 10)">
      <!-- Arm and hand discarding downward/outward -->
      <path d="M 105 130 C 120 135, 140 145, 155 135 C 165 128, 170 115, 160 110" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
      <!-- Hand palm pushing away -->
      <path d="M 152 105 C 158 102, 165 106, 168 112 C 171 118, 168 124, 162 127 L 155 130 Z" fill="#60A5FA"/>
    </g>

    <!-- Floor / Ground line -->
    <line x1="10" y1="180" x2="190" y2="180" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Debris on the ground representing "废" (discarded/ruined state) -->
    <path d="M 45 180 L 55 168 L 65 180 Z" fill="#4B5563"/>
    <rect x="110" y="172" width="16" height="8" rx="2" fill="#EF4444" transform="rotate(15 118 176)"/>
    <path d="M 80 180 L 85 172 L 95 175 L 90 180 Z" fill="#6B7280"/>
  </g>
</svg>