<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle Surface Shadow / Depth for Plate -->
  <ellipse cx="120" cy="185" rx="75" ry="15" fill="#111318" opacity="0.6"/>

  <!-- Modern Sleek Dinner Plate -->
  <ellipse cx="120" cy="180" rx="80" ry="20" fill="#2E3440" stroke="#3B4252" stroke-width="2"/>
  <ellipse cx="120" cy="177" rx="65" ry="15" fill="#242933"/>

  <!-- Fresh, Uncooked Meat Cut (Steak / Pork Slice) representing "生" (raw/uncooked) -->
  <!-- Meat Base (Fresh Red/Pinkish Raw Tone) -->
  <path d="M 80 165 
           C 70 150, 75 125, 95 110 
           C 115 95, 145 90, 165 105 
           C 185 120, 190 145, 175 165 
           C 160 185, 95 185, 80 165 Z" 
        fill="#E06C75" stroke="#BF616A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner Marbling / Fresh Texture (Fat layers characteristic of raw meat) -->
  <!-- Fat Layer 1 -->
  <path d="M 95 130 C 105 125, 120 135, 130 125 C 135 120, 140 125, 145 130" 
        fill="none" stroke="#ECEFF4" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Fat Layer 2 -->
  <path d="M 110 150 C 125 140, 140 155, 155 145" 
        fill="none" stroke="#ECEFF4" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Fat Layer 3 (Edge marbling) -->
  <path d="M 88 145 C 92 140, 96 148, 100 142" 
        fill="none" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Highlight / Freshness Gleam -->
  <path d="M 105 108 C 115 103, 130 105, 140 110" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Focus / Context Accent (Subtle warm amber glow underneath the plate) -->
  <ellipse cx="120" cy="190" rx="45" ry="6" fill="#D19A66" opacity="0.15"/>
</svg>