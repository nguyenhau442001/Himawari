<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(20, 40)">
    <!-- Office Desk -->
    <rect x="10" y="120" width="180" height="10" rx="2" fill="#334155"/>
    <rect x="20" y="130" width="10" height="40" fill="#475569"/>
    <rect x="170" y="130" width="10" height="40" fill="#475569"/>
    
    <!-- Paperwork with red marks (representing the flaws/弊病) -->
    <rect x="40" y="80" width="120" height="150" rx="4" fill="#f8fafc"/>
    <path d="M50 100 h100 M50 120 h100 M50 140 h100" stroke="#94a3b8" stroke-width="2"/>
    <path d="M60 160 l10 10 m0 -10 l-10 10" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 180 l10 10 m0 -10 l-10 10" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M140 160 l10 10 m0 -10 l-10 10" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Frustrated Character -->
    <circle cx="120" cy="50" r="25" fill="#fbbf24"/>
    <path d="M105 45 l5 5 m10 -5 l-5 5" stroke="#1e293b" stroke-width="2"/>
    <path d="M110 60 q10 5 20 0" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M95 70 l-10 20 l20 -5" fill="#38bdf8"/>
    <path d="M145 70 l10 20 l-20 -5" fill="#38bdf8"/>
    
    <!-- Clock on wall showing overtime -->
    <circle cx="200" cy="30" r="15" fill="#334155"/>
    <line x1="200" y1="30" x2="200" y2="20" stroke="#fb923c" stroke-width="2"/>
    <line x1="200" y1="30" x2="210" y2="30" stroke="#fb923c" stroke-width="2"/>
  </g>
</svg>