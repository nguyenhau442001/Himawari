<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: subtle ambient lighting for modern flat UI -->
  <circle cx="120" cy="120" r="90" fill="#252A34" opacity="0.4"/>

  <!-- Motion lines indicating dynamic speech/action ("出口") -->
  <path d="M 65 95 C 55 100, 50 110, 50 120 C 50 130, 55 140, 65 145" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 55 105 C 47 110, 43 115, 43 120 C 43 125, 47 130, 55 135" stroke="#FFA726" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Dynamic human character (Lecturer/Speaker facing right) -->
  <!-- Body/Suit -->
  <path d="M 75 180 L 75 145 C 75 135, 83 125, 95 125 L 115 125 C 127 125, 135 135, 135 145 L 135 180 Z" fill="#2D3748"/>
  <!-- Inner shirt & collar -->
  <path d="M 95 125 L 105 140 L 115 125 Z" fill="#E2E8F0"/>
  
  <!-- Head & Hair -->
  <circle cx="105" cy="98" r="18" fill="#F6AD55"/>
  <path d="M 90 95 C 90 85, 100 80, 115 85 C 122 88, 124 95, 122 102 C 115 97, 100 97, 90 95 Z" fill="#4A5568"/>

  <!-- Gesturing arm pointing forward/up -->
  <path d="M 125 135 L 155 115 L 165 125" stroke="#F6AD55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- The "Article / Composition" forming dynamically from speech ("成章") -->
  <!-- Floating structured document glowing with gold accent -->
  <g transform="translate(145, 60)">
    <!-- Document background -->
    <rect x="0" y="0" width="56" height="72" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="0" y="0" width="56" height="72" rx="4" fill="url(#docGrad)" opacity="0.2"/>
    
    <!-- Code/Text lines representing fluent prose forming instantly -->
    <rect x="10" y="14" width="36" height="5" rx="2.5" fill="#FFA726"/>
    <rect x="10" y="26" width="28" height="4" rx="2" fill="#718096"/>
    <rect x="10" y="36" width="36" height="4" rx="2" fill="#718096"/>
    <rect x="10" y="46" width="32" height="4" rx="2" fill="#718096"/>
    <rect x="10" y="56" width="20" height="4" rx="2" fill="#FFA726"/>
    
    <!-- Sparkle/Success indicator denoting eloquence -->
    <path d="M 46 8 L 48 4 L 52 2 L 48 0 L 46 -4 L 44 0 L 40 2 L 44 4 Z" fill="#FFD700"/>
  </g>

  <!-- Speech stream particles transitioning into the document -->
  <circle cx="130" cy="105" r="4" fill="#FFA726"/>
  <circle cx="140" cy="90" r="3" fill="#FFD700"/>
  <circle cx="138" cy="75" r="2" fill="#FFA726"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>
</svg>