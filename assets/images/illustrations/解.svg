<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Outer Glow / Atmosphere -->
    <circle cx="120" cy="120" r="70" fill="#FFB020" opacity="0.08"/>
    <circle cx="120" cy="120" r="50" fill="#FFB020" opacity="0.12"/>

    <!-- Dynamic Release / Untangling Energy Waves -->
    <path d="M 75 95 C 90 70, 150 70, 165 95" stroke="#4FD1C5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 60 115 C 85 85, 155 85, 180 115" stroke="#4FD1C5" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 45 135 C 75 100, 165 100, 195 135" stroke="#4FD1C5" stroke-width="4" stroke-linecap="round" fill="none" opacity="1"/>

    <!-- Central Object representing "Giải" (Giải tỏa / Cởi bỏ / Knot untying) -->
    <!-- The Knots / Untangling elements -->
    <!-- Left entangled loop -->
    <path d="M 95 120 C 85 100, 105 85, 120 105 C 130 118, 120 135, 105 135 C 90 135, 80 120, 95 105" 
          fill="none" stroke="#2D3748" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          
    <path d="M 95 120 C 85 100, 105 85, 120 105 C 130 118, 120 135, 105 135 C 90 135, 80 120, 95 105" 
          fill="none" stroke="#718096" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right freeing ribbon / untangled part ending in bright gold/orange -->
    <path d="M 120 105 C 135 125, 150 140, 175 130 C 190 124, 200 105, 195 90" 
          fill="none" stroke="#FFB020" stroke-width="8" stroke-linecap="round"/>

    <!-- Left freeing ribbon ending -->
    <path d="M 95 105 C 75 90, 60 95, 45 110" 
          fill="none" stroke="#FFB020" stroke-width="8" stroke-linecap="round"/>

    <!-- Sparkles / Resolution Indicators -->
    <circle cx="175" cy="85" r="4" fill="#FFB020"/>
    <circle cx="65" cy="135" r="3" fill="#4FD1C5"/>
    <circle cx="150" cy="70" r="3" fill="#FFB020"/>
    
    <!-- Central Bright Core representing clarity / giải tỏa -->
    <circle cx="120" cy="120" r="10" fill="#FFFFFF"/>
    <circle cx="120" cy="120" r="5" fill="#FFB020"/>
  </g>
</svg>