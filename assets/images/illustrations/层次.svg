<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#334155"/>
  <rect x="40" y="175" width="10" height="50" rx="2" fill="#475569"/>
  <rect x="190" y="175" width="10" height="50" rx="2" fill="#475569"/>
  
  <!-- Character (Upper body) -->
  <circle cx="120" cy="100" r="25" fill="#fde68a"/>
  <path d="M95 100 Q120 130 145 100" fill="#fb923c"/>
  <rect x="80" y="125" width="80" height="60" rx="10" fill="#38bdf8"/>
  
  <!-- The Document (The visual representation of '层次分明') -->
  <g transform="translate(150, 60) rotate(10)">
    <rect width="60" height="80" rx="4" fill="#f1f5f9"/>
    <!-- Structured layers/sections -->
    <rect x="5" y="10" width="50" height="8" rx="2" fill="#fbbf24"/>
    <rect x="5" y="25" width="50" height="4" rx="1" fill="#94a3b8"/>
    <rect x="5" y="35" width="50" height="4" rx="1" fill="#94a3b8"/>
    <rect x="5" y="45" width="50" height="4" rx="1" fill="#94a3b8"/>
    <rect x="5" y="60" width="30" height="8" rx="2" fill="#10b981"/>
  </g>
  
  <!-- Highlighter/Pen -->
  <path d="M70 140 L90 120 L95 125 L75 145 Z" fill="#ec4899"/>
  
  <!-- Ambient light/decor -->
  <circle cx="200" cy="40" r="15" fill="#fbbf24" opacity="0.2"/>
  <circle cx="200" cy="40" r="8" fill="#fbbf24" opacity="0.4"/>
