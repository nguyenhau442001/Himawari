<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Background grid/dots -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2E3440" opacity="0.6"/>
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#FF9F43" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>

    <linearGradient id="focusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="240" height="240" fill="url(#grid)"/>

  <!-- Visual Metaphor: Pointing / Directing Attention (Contrast & Progression towards a specific distant object) -->
  
  <!-- Ambient background glow for the target object -->
  <circle cx="180" cy="95" r="45" fill="url(#focusGlow)"/>

  <!-- Water Surface & Boat (Contextual reference: 我们坐船去那个岛) -->
  <!-- Distant Island ("那个岛" - The That Island) -->
  <g transform="translate(155, 75)">
    <!-- Island Base -->
    <path d="M5 30 Q25 15 45 30 Q35 32 25 32 Z" fill="#4B5563"/>
    <!-- Palm Tree / Foliage on Island -->
    <path d="M22 18 C22 18 15 5 10 2 C18 8 22 18 22 18 Z" fill="#10B981"/>
    <path d="M23 18 C23 18 30 6 36 4 C28 9 23 18 23 18 Z" fill="#059669"/>
    <path d="M21 20 L21 30" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Target Indicator / Focus marker above the island (Demonstrating demonstrative specificity "那个") -->
    <polygon points="25, -8 20, -18 30, -18" fill="#FF9F43"/>
    <circle cx="25" cy="-24" r="5" fill="#FF9F43"/>
  </g>

  <!-- Water Layer -->
  <path d="M0 160 Q60 150 120 160 T240 160 L240 240 L0 240 Z" fill="url(#waterGrad)"/>
  <path d="M20 175 Q80 165 140 175 T240 175" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.4"/>
  <path d="M0 190 Q70 180 140 190 T240 190" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.3"/>

  <!-- The Boat -->
  <g transform="translate(70, 150)">
    <path d="M10 15 L70 15 L60 30 L20 30 Z" fill="url(#hullGrad)"/>
    <!-- Mast -->
    <line x1="40" y1="15" x2="40" y2="-10" stroke="#9CA3AF" stroke-width="2"/>
    <!-- Sail -->
    <path d="M42 -8 Q55 3 42 12 Z" fill="#F3F4F6" opacity="0.9"/>
    
    <!-- Traveler inside boat -->
    <circle cx="33" cy="8" r="4" fill="#FBBF24"/>
    <path d="M30 16 L36 16 L35 8 L31 8 Z" fill="#3B82F6"/>
  </g>

  <!-- Directional Beam / Pointing Metaphor (Connecting here/observer to 'that' distant object) -->
  <polygon points="45,115 155,85 155,95 45,135" fill="url(#beamGrad)" opacity="0.7"/>

  <!-- Foreground Observer / Pointing Character (Representing the speaker pointing to "那个") -->
  <g transform="translate(30, 110)">
    <!-- Body / Torso -->
    <path d="M15 45 C15 35 25 30 35 30 C45 30 55 35 55 45 L55 70 L15 70 Z" fill="#4F46E5"/>
    
    <!-- Head -->
    <circle cx="35" cy="18" r="11" fill="#FBBF24"/>
    
    <!-- Hair -->
    <path d="M24 16 C25 10 30 8 38 9 C43 10 46 13 46 13 C46 13 42 7 35 7 C28 7 24 12 24 16 Z" fill="#1F2937"/>

    <!-- Pointing Arm (Extended towards the distant island) -->
    <!-- Shoulder to elbow -->
    <path d="M25 35 L45 42" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
    <!-- Forearm pointing precisely -->
    <path d="M45 42 L72 38" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Pointing Finger indicator -->
    <circle cx="72" cy="38" r="3" fill="#FF9F43"/>
    
    <!-- Focus Ray originating from finger -->
    <line x1="72" y1="38" x2="135" y2="25" stroke="#FF9F43" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  </g>

  <!-- Framing / UI polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#374151" stroke-width="2" opacity="0.5"/>
</svg>