<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative academic pattern (subtle) -->
  <path d="M40 180 L200 180" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="190" cy="60" r="25" fill="#222733"/>

  <!-- Motion/Action lines for teaching interaction -->
  <path d="M85 95 Q95 90 105 98" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M80 105 Q92 100 102 110" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Chalkboard / Screen in background -->
  <rect x="110" y="55" width="90" height="65" rx="6" fill="#222B38" stroke="#323D4E" stroke-width="2"/>
  <!-- Geometric diagram on chalkboard representing knowledge/teaching -->
  <circle cx="155" cy="80" r="14" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <path d="M145 92 L155 70 L165 92 Z" stroke="#F43F5E" stroke-width="2" fill="none"/>

  <!-- Teacher Character (Left, dynamic action) -->
  <!-- Body/Torso -->
  <path d="M55 155 L55 125 C55 115 65 110 75 110 C85 110 95 115 95 125 L95 155 Z" fill="#3B82F6"/>
  <!-- Head -->
  <circle cx="75" cy="95" r="13" fill="#FBBF24"/>
  <!-- Hair -->
  <path d="M62 93 C62 85 88 85 88 93 Z" fill="#1E293B"/>
  <!-- Pointing Arm (Action/Verb visualization) -->
  <path d="M85 118 L115 102" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <!-- Hand pointing towards board -->
  <circle cx="118" cy="100" r="4" fill="#F59E0B"/>
  <!-- Other arm resting/gesturing -->
  <path d="M65 125 L55 140" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>

  <!-- Student Character (Right, receiving/learning) -->
  <!-- Body/Torso -->
  <path d="M150 160 L150 135 C150 125 160 120 170 120 C180 120 190 125 190 135 L190 160 Z" fill="#10B981"/>
  <!-- Head -->
  <circle cx="170" cy="105" r="12" fill="#FBBF24"/>
  <!-- Hair -->
  <path d="M158 103 C158 95 182 95 182 103 Z" fill="#374151"/>
  <!-- Desk/Podium -->
  <path d="M40 165 L200 165 L190 195 L50 195 Z" fill="#2A3441"/>
  <rect x="45" y="160" width="150" height="8" rx="3" fill="#3E4C59"/>

  <!-- Learning Materials on Desk (Open Book) -->
  <path d="M115 170 Q130 162 145 170 L145 188 Q130 180 115 188 Z" fill="#F8FAFC"/>
  <path d="M145 170 Q160 162 175 170 L175 188 Q160 180 145 188 Z" fill="#E2E8F0"/>
  <line x1="145" y1="170" x2="145" y2="188" stroke="#CBD5E1" stroke-width="2"/>
</svg>