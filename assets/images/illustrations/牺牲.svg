<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character representing the person making the sacrifice -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 L-20 60 L20 60 L20 20 Z" fill="#4A90E2"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#FFD700"/>
    <!-- Arm reaching out to give/let go -->
    <path d="M20 30 L60 10" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
    <!-- Motion lines showing the object being released -->
    <path d="M70 5 L90 -5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M75 15 L95 5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- The object being sacrificed (a personal possession/symbol of value) -->
  <g transform="translate(180, 120)">
    <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#FF8C00"/>
    <path d="M-15 -5 L15 -5" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Silhouette of family representing the beneficiary -->
  <g transform="translate(60, 160) scale(0.7)">
    <circle cx="0" cy="-20" r="15" fill="#A0A0A0"/>
    <path d="M-15 0 L15 0 L10 40 L-10 40 Z" fill="#A0A0A0"/>
  </g>
  <g transform="translate(30, 160) scale(0.6)">
    <circle cx="0" cy="-20" r="12" fill="#A0A0A0"/>
    <path d="M-12 0 L12 0 L8 35 L-8 35 Z" fill="#A0A0A0"/>
  </g>
</svg>