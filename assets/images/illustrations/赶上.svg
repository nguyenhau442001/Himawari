<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: Last Bus / Catching up (赶上 - To catch up with, to make it just in time) -->
  <!-- Ground track/road -->
  <path d="M 30,190 L 210,190" stroke="#2C323D" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="190" x2="80" y2="190" stroke="#4A5568" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="100" y1="190" x2="130" y2="190" stroke="#4A5568" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="150" y1="190" x2="180" y2="190" stroke="#4A5568" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Bus Stop Sign -->
  <rect x="35" y="115" width="4" height="75" fill="#64748B"/>
  <circle cx="37" cy="110" r="12" fill="#334155" stroke="#F59E0B" stroke-width="2"/>
  <path d="M33 110 L41 110 M37 106 L37 114" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- The Bus (Departing / Just caught) -->
  <!-- Bus Body -->
  <rect x="110" y="125" width="85" height="55" rx="10" fill="#F59E0B"/>
  <path d="M 180,125 L 195,138 L 195,170 L 180,170 Z" fill="#D97706"/> <!-- Front curve / shadow -->
  
  <!-- Windows -->
  <rect x="120" y="133" width="22" height="18" rx="4" fill="#1E293B"/>
  <rect x="148" y="133" width="22" height="18" rx="4" fill="#1E293B"/>
  <rect x="176" y="133" width="14" height="18" rx="4" fill="#1E293B"/>

  <!-- Headlight & Tail light -->
  <rect x="193" y="155" width="3" height="8" rx="1.5" fill="#FEF08A"/>
  <rect x="108" y="155" width="3" height="8" rx="1.5" fill="#EF4444"/>

  <!-- Wheels -->
  <circle cx="132" cy="180" r="10" fill="#0F172A"/>
  <circle cx="132" cy="180" r="4" fill="#94A3B8"/>
  <circle cx="178" cy="180" r="10" fill="#0F172A"/>
  <circle cx="178" cy="180" r="4" fill="#94A3B8"/>

  <!-- Character making it just in time (Leaping/Reaching out) -->
  <!-- Head -->
  <circle cx="82" cy="138" r="8" fill="#E2E8F0"/>
  <!-- Body (Dynamic running/reaching pose) -->
  <path d="M 82,146 C 82,158 75,168 68,178" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <!-- Arms (Reaching forward to the bus) -->
  <path d="M 82,152 C 90,150 98,148 108,145" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 80,152 C 75,158 72,165 70,172" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs (Running stride) -->
  <path d="M 68,178 L 56,187" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 68,178 L 78,187" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

  <!-- Motion / Success indicators (Just in time!) -->
  <path d="M 98,135 C 102,138 102,142 98,145" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 104,131 C 110,136 110,144 104,150" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>