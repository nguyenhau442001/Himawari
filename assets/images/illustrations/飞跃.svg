<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Growth Line Glow & Gradient -->
    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Golden Leap Arch Gradient -->
    <linearGradient id="leap-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Window Cityscape Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Drop Shadow for Character -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Interior Wall & Window Background Context -->
  <!-- Large Office Window showing booming cityscape / economic growth -->
  <path d="M 140 30 L 210 30 L 210 160 L 140 160 Z" fill="url(#window-glow)" stroke="#334155" stroke-width="2"/>
  <!-- City Skyline silhouettes through window -->
  <rect x="148" y="90" width="10" height="70" fill="#3f3f46" opacity="0.6"/>
  <rect x="160" y="70" width="14" height="90" fill="#52525b" opacity="0.7"/>
  <rect x="176" y="100" width="12" height="60" fill="#3f3f46" opacity="0.5"/>
  <rect x="190" y="60" width="12" height="100" fill="#71717a" opacity="0.8"/>
  <!-- Window Grid Lines -->
  <line x1="175" y1="30" x2="175" y2="160" stroke="#1e293b" stroke-width="2"/>
  <line x1="140" y1="95" x2="210" y2="95" stroke="#1e293b" stroke-width="2"/>

  <!-- Office Desk Setup -->
  <rect x="20" y="150" width="120" height="10" rx="3" fill="#475569" />
  <rect x="35" y="160" width="12" height="40" fill="#334155" />
  <rect x="113" y="160" width="12" height="40" fill="#334155" />

  <!-- Holographic / Projected Growth Chart on Desk -->
  <!-- Area fill under growth curve -->
  <path d="M 35 140 L 50 135 L 70 125 L 95 105 L 125 65 L 125 140 Z" fill="url(#chart-grad)" />
  <!-- Spark lines / Grid on desk monitor representation -->
  <line x1="30" y1="140" x2="135" y2="140" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="30" y1="110" x2="135" y2="110" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="30" y1="80" x2="135" y2="80" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- The Dramatic Economic Leap Curve (飞跃 - soaring upward) -->
  <path d="M 35 140 Q 75 145 95 105 T 125 55" fill="none" stroke="url(#leap-grad)" stroke-width="4" stroke-linecap="round" filter="url(#shadow)" />
  
  <!-- Data nodes along the growth curve -->
  <circle cx="35" cy="140" r="3" fill="#38bdf8"/>
  <circle cx="65" cy="132" r="3" fill="#38bdf8"/>
  <circle cx="95" cy="105" r="4" fill="#fbbf24"/>
  <circle cx="125" cy="55" r="6" fill="#f43f5e" filter="url(#shadow)"/>
  <!-- Floating upward particles (growth sparks) -->
  <circle cx="132" cy="42" r="2" fill="#fbbf24" />
  <circle cx="115" cy="40" r="1.5" fill="#38bdf8" />
  <circle cx="138" cy="65" r="1.5" fill="#f43f5e" />

  <!-- Props on Desk -->
  <!-- Laptop -->
  <path d="M 45 150 L 75 150 L 78 142 L 42 142 Z" fill="#64748b" />
  <rect x="40" y="150" width="40" height="3" rx="1.5" fill="#94a3b8" />
  <!-- Coffee Mug -->
  <rect x="95" y="132" width="12" height="18" rx="2" fill="#cbd5e1" />
  <path d="M 107 137 C 112 137 112 145 107 145" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <!-- Character: Enthusiastic Entrepreneur / Analyst experiencing the "Leap" -->
  <g transform="translate(70, 75)" filter="url(#shadow)">
    <!-- Body / Torso (leaning slightly back in amazed celebration) -->
    <path d="M 15 50 C 15 35 25 25 35 25 C 45 25 55 35 55 50 L 60 75 L 10 75 Z" fill="#2563eb" />
    <!-- Collar / Tie -->
    <polygon points="32,28 38,28 35,42" fill="#ffffff" />
    <polygon points="34,42 36,42 37,55 35,58 33,55" fill="#f43f5e" />

    <!-- Head -->
    <path d="M 23 12 C 23 2 47 2 47 12 C 47 22 23 22 23 12 Z" fill="#fbcfe8" /> <!-- Hair Base/Back -->
    <circle cx="35" cy="14" r="12" fill="#fde68a" /> <!-- Face -->
    <!-- Modern hairstyle -->
    <path d="M 23 10 C 25 2 42 2 47 8 C 45 4 30 4 23 10 Z" fill="#1e293b" />
    <!-- Facial expression: Eyes wide, joyful smile -->
    <circle cx="31" cy="13" r="1.5" fill="#1e293b" />
    <circle cx="39" cy="13" r="1.5" fill="#1e293b" />
    <path d="M 33 18 C 34.5 20 37.5 20 39 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="29" cy="16" r="2" fill="#f43f5e" opacity="0.4" />
    <circle cx="41" cy="16" r="2" fill="#f43f5e" opacity="0.4" />

    <!-- Arms in celebratory/amazed pose -->
    <!-- Left Arm (bent up) -->
    <path d="M 18 35 C 10 32 2 20 5 15" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <circle cx="5" cy="15" r="3.5" fill="#fde68a" />
    <!-- Right Arm (raised high cheering) -->
    <path d="M 52 35 C 62 25 72 15 75 10" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <circle cx="75" cy="8" r="3.5" fill="#fde68a" />
  </g>

  <!-- Foreground decorative elements for depth (Plant leaf corner) -->
  <path d="M 0 240 C 0 200 15 180 30 170 C 20 190 10 220 0 240 Z" fill="#059669" />
  <path d="M 0 220 C 10 195 30 185 45 180 C 30 200 15 220 0 240 Z" fill="#10b981" />

</svg>