<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Scenic Area Landscape -->
  <!-- Distant Mountains -->
  <path d="M40 160 L70 100 L100 160 Z" fill="#2D343E"/>
  <path d="M80 160 L120 80 L160 160 Z" fill="#3A424E"/>
  <path d="M130 160 L170 110 L200 160 Z" fill="#2D343E"/>
  
  <!-- Ground/Path -->
  <path d="M0 160 H240 V240 H0 Z" fill="#252A33"/>
  
  <!-- Iconic Scenic Landmark (Pagoda/Pavilion) -->
  <g transform="translate(120, 140)">
    <!-- Base -->
    <rect x="-30" y="0" width="60" height="15" rx="2" fill="#FFB84D"/>
    <!-- Pillars -->
    <rect x="-20" y="-30" width="8" height="30" fill="#FFD180"/>
    <rect x="12" y="-30" width="8" height="30" fill="#FFD180"/>
    <!-- Roof -->
    <path d="M-35 -30 L0 -60 L35 -30 Z" fill="#FF9500"/>
    <rect x="-35" y="-35" width="70" height="5" fill="#E68A00"/>
  </g>
  
  <!-- People (Representing "many people") -->
  <g transform="translate(60, 180)">
    <circle cx="0" cy="-10" r="6" fill="#A0AEC0"/>
    <path d="M-8 15 L-8 0 L8 0 L8 15 Z" fill="#A0AEC0"/>
  </g>
  <g transform="translate(90, 190)">
    <circle cx="0" cy="-10" r="6" fill="#A0AEC0"/>
    <path d="M-8 15 L-8 0 L8 0 L8 15 Z" fill="#A0AEC0"/>
  </g>
  <g transform="translate(150, 185)">
    <circle cx="0" cy="-10" r="6" fill="#A0AEC0"/>
    <path d="M-8 15 L-8 0 L8 0 L8 15 Z" fill="#A0AEC0"/>
  </g>
  <g transform="translate(180, 195)">
    <circle cx="0" cy="-10" r="6" fill="#A0AEC0"/>
    <path d="M-8 15 L-8 0 L8 0 L8 15 Z" fill="#A0AEC0"/>
  </g>
  
  <!-- Decorative Tree -->
  <path d="M30 160 L30 120 M30 120 L20 100 M30 120 L40 100" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="100" r="12" fill="#2D343E"/>
  <circle cx="40" cy="100" r="12" fill="#2D343E"/>
  <circle cx="30" cy="85" r="12" fill="#2D343E"/>
</svg>