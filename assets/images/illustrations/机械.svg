<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Workshop Details -->
  <!-- Ambient light from advanced machinery -->
  <polygon points="120,60 170,180 70,180" fill="url(#beam-grad)" />
  
  <!-- Facility Wall & Shelving -->
  <rect x="20" y="30" width="200" height="15" rx="3" fill="#334155" opacity="0.5" />
  <circle cx="40" cy="37" r="3" fill="#10b981" />
  <circle cx="52" cy="37" r="3" fill="#f59e0b" />
  
  <!-- Floor Grid Lines -->
  <line x1="20" y1="180" x2="220" y2="180" stroke="#334155" stroke-width="2" />
  <line x1="40" y1="180" x2="20" y2="210" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <line x1="100" y1="180" x2="80" y2="210" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <line x1="160" y1="180" x2="160" y2="210" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <line x1="200" y1="180" x2="220" y2="210" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- Advanced Mechanical Equipment (The "机械设备") -->
  <!-- Machine Base -->
  <path d="M 80,180 L 100,120 L 180,120 L 200,180 Z" fill="url(#metal-grad)" />
  <rect x="95" y="130" width="80" height="40" rx="4" fill="#1e293b" />
  
  <!-- Glowing Interactive Hologram/Control Panel on Machine -->
  <rect x="110" y="140" width="50" height="22" rx="3" fill="#0f172a" />
  <line x1="116" y1="147" x2="136" y2="147" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="116" y1="155" x2="148" y2="155" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <circle cx="154" cy="151" r="3" fill="#ec4899" filter="url(#glow)" />

  <!-- Robotic Arm / Precision Tool attached to Machine -->
  <path d="M 120,120 L 110,95 L 140,85 L 155,100" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="110" cy="95" r="4" fill="#94a3b8" />
  <circle cx="140" cy="85" r="4" fill="#94a3b8" />
  <!-- Laser/Scanning Beam emitter -->
  <polygon points="152,98 158,104 165,140 148,140" fill="url(#screen-glow)" opacity="0.8" />
  <circle cx="155" cy="102" r="3" fill="#38bdf8" filter="url(#glow)" />

  <!-- Status Hologram Ring Floating Above Machine -->
  <ellipse cx="140" cy="75" rx="22" ry="7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" filter="url(#glow)" />
  <ellipse cx="140" cy="70" rx="14" ry="4" fill="none" stroke="#10b981" stroke-width="1.5" />

  <!-- Engineer Character (Observing and controlling the advanced machinery) -->
  <!-- Body/Torso -->
  <path d="M 50,180 C 50,155 70,145 85,145 C 100,145 120,155 120,180 Z" fill="#0ea5e9" />
  <!-- Safety Vest / Details -->
  <path d="M 70,145 L 75,180 L 82,180 L 78,145 Z" fill="#f59e0b" />
  <path d="M 100,145 L 95,180 L 88,180 L 92,145 Z" fill="#f59e0b" />
  
  <!-- Neck & Head -->
  <rect x="78" y="130" width="14" height="18" rx="4" fill="#fed7aa" />
  <circle cx="85" cy="120" r="15" fill="#fed7aa" />
  
  <!-- Hair -->
  <path d="M 70,120 C 70,108 80,105 92,110 C 97,112 100,118 100,124 L 98,124 C 98,115 90,110 84,110 C 76,110 72,115 72,124 Z" fill="#334155" />

  <!-- Smart Safety Glasses (Tech/Advanced vibe) -->
  <rect x="76" y="114" width="18" height="6" rx="2" fill="#0f172a" />
  <rect x="78" y="115" width="6" height="4" fill="#38bdf8" opacity="0.8" />
  <rect x="86" y="115" width="6" height="4" fill="#38bdf8" opacity="0.8" />

  <!-- Arms and Gesture (Interacting with the advanced system) -->
  <!-- Back Arm -->
  <path d="M 65,155 L 50,165" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
  
  <!-- Front Arm reaching forward confidently -->
  <path d="M 105,155 L 125,145" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
  <!-- Hand -->
  <circle cx="127" cy="144" r="4" fill="#fed7aa" />

  <!-- Foreground Interface / Tablet Device -->
  <rect x="112" y="148" width="22" height="16" rx="2" transform="rotate(-15 112 148)" fill="#334155" stroke="#94a3b8" stroke-width="1" />
  <rect x="115" y="151" width="16" height="10" rx="1" transform="rotate(-15 115 151)" fill="#38bdf8" opacity="0.9" />

  <!-- Foreground details to create depth -->
  <circle cx="35" cy="200" r="8" fill="#334155" opacity="0.6" />
  <circle cx="210" cy="195" r="12" fill="#334155" opacity="0.4" />
</svg>