<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <!-- Bill/Invoice object representing "fee" or "cost" -->
  <g transform="translate(120, 120) rotate(-5)"> <!-- Center and slight rotation for visual interest -->
    <rect x="-70" y="-90" width="140" height="180" rx="10" fill="#F0F2F5"/> <!-- Bill paper -->

    <!-- Header line (placeholder for "Invoice" or "Bill") -->
    <rect x="-50" y="-70" width="100" height="10" rx="3" fill="#D0D2D5"/>

    <!-- Item lines (placeholders for services/products) -->
    <rect x="-50" y="-45" width="80" height="8" rx="2" fill="#D0D2D5"/>
    <rect x="-50" y="-30" width="90" height="8" rx="2" fill="#D0D2D5"/>
    <rect x="-50" y="-15" width="70" height="8" rx="2" fill="#D0D2D5"/>
    <rect x="-50" y="0" width="85" height="8" rx="2" fill="#D0D2D5"/>

    <!-- Separator line before total -->
    <rect x="-50" y="25" width="100" height="2" fill="#D0D2D5"/>

    <!-- "Total Due" label (placeholder) -->
    <rect x="-50" y="40" width="40" height="10" rx="3" fill="#D0D2D5"/>

    <!-- Total amount section - highlighted with accent color -->
    <rect x="-50" y="60" width="100" height="30" rx="6" fill="#FF9900"/> <!-- Accent color for focus -->
    <!-- Placeholder for the amount value inside the total section (no actual numbers) -->
    <rect x="-30" y="70" width="60" height="10" rx="3" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>