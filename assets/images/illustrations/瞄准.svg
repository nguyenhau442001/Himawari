<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a" />
  
  <!-- Atmospheric Background Elements (Deep forest night/twilight) -->
  <defs>
    <radialGradient id="moonlight" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ground-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" fill="url(#moonlight)" />

  <!-- Distant Forest/Nature Context (Trees & Foliage) -->
  <g fill="#162032">
    <path d="M10 160 L25 110 L40 160 Z" />
    <path d="M30 165 L50 100 L70 165 Z" />
    <path d="M190 170 L210 120 L230 170 Z" />
    <path d="M170 165 L190 95 L210 165 Z" />
  </g>

  <!-- Ground Layer & Foreground Foliage -->
  <path d="M0 160 Q 70 145, 140 155 T 240 150 L 240 240 L 0 240 Z" fill="url(#ground-grad)" />
  
  <!-- Glowing target focus beam / sight line -->
  <polygon points="95,128 220,105 220,125 95,138" fill="url(#beam)" />

  <!-- Target Animal: The Prey (Cute stylized deer in the distance) -->
  <g transform="translate(190, 110)">
    <!-- Deer Body -->
    <ellipse cx="20" cy="30" rx="14" ry="10" fill="#fb923c" />
    <!-- Deer Head -->
    <ellipse cx="32" cy="18" rx="7" ry="6" fill="#fb923c" />
    <!-- Antlers -->
    <path d="M30 12 L27 6 M34 12 L37 6" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" />
    <!-- Deer Legs -->
    <rect x="12" y="38" width="3" height="15" rx="1.5" fill="#f97316" />
    <rect x="25" y="38" width="3" height="15" rx="1.5" fill="#f97316" />
    <!-- Cute Alert Ear -->
    <path d="M35 15 L40 11" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />
    <!-- Alert Eye (Glowing soft amber) -->
    <circle cx="34" cy="17" r="1.5" fill="#fef08a" />
  </g>

  <!-- Environment props: Bush and rocks in foreground -->
  <path d="M-10 170 Q 20 130, 50 170 Z" fill="#0f172a" />
  <path d="M25 160 Q 45 135, 65 160 Z" fill="#1e293b" />
  <circle cx="18" cy="155" r="4" fill="#334155" />

  <!-- Main Subject: The Hunter (Kneeling/crouching aiming a bow/crossbow or modern sleek rifle) -->
  <!-- Let's use a stylized outdoor adventurer/hunter with a bow & arrow for clean aesthetic -->
  <g transform="translate(40, 95)">
    <!-- Back leg / knee -->
    <path d="M45 45 L30 65 L45 68 Z" fill="#047857" />
    
    <!-- Torso (Leaning forward into the aim) -->
    <path d="M35 25 L55 35 L45 55 L25 45 Z" fill="#065f46" />
    
    <!-- Head & Cap -->
    <circle cx="62" cy="22" r="9" fill="#fbcfe8" />
    <!-- Skin/Face profile -->
    <path d="M68 20 L72 23 L67 26 Z" fill="#f472b6" />
    <!-- Cap -->
    <path d="M53 17 Q 62 12, 71 18 L 68 22 L 53 18 Z" fill="#047857" />

    <!-- Front Arm & Bow alignment -->
    <!-- Holding the bow shaft -->
    <path d="M50 32 L 85 28" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    
    <!-- The Bow -->
    <path d="M85 8 Q 95 28, 85 48" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
    
    <!-- Bowstring & Arrow -->
    <path d="M85 8 L 50 28 L 85 48" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="50" y1="28" x2="155" y2="18" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />

    <!-- Back arm pulling string -->
    <path d="M40 32 Q 45 25, 52 28" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round" />

    <!-- Front kneeling leg -->
    <path d="M35 45 L 55 68 L 75 65 L 60 48 Z" fill="#059669" />
    
    <!-- Quiver on back -->
    <rect x="20" y="25" width="8" height="22" rx="3" transform="rotate(15 24 36)" fill="#b45309" />
    <path d="M23 20 L 26 27" stroke="#fef08a" stroke-width="2" />
    <path d="M26 22 L 29 29" stroke="#fef08a" stroke-width="2" />
  </g>

  <!-- Reticle / Aiming focus element (Visualizing "瞄准" - targeting concept cleanly integrated) -->
  <g transform="translate(195, 120)" opacity="0.8">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
    <circle cx="0" cy="0" r="3" fill="#f43f5e" />
    <line x1="-18" y1="0" x2="-8" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="8" y1="0" x2="18" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="-18" x2="0" y2="-8" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="8" x2="0" y2="18" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Foreground details: Grass tufts -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round">
    <path d="M20 165 L18 152" />
    <path d="M25 167 L27 154" />
    <path d="M130 160 L128 148" />
    <path d="M136 162 L140 147" />
    <path d="M210 168 L212 155" />
  </g>

  <!-- Stars in the night sky -->
  <g fill="#94a3b8">
    <circle cx="40" cy="40" r="1" />
    <circle cx="90" cy="25" r="1.5" opacity="0.6" />
    <circle cx="140" cy="50" r="1" />
    <circle cx="70" cy="80" r="0.8" />
    <circle cx="170" cy="35" r="1.2" />
  </g>
</svg>