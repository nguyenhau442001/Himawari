<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow representing context -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- First Book (Left) -->
  <g transform="translate(62, 85)">
    <!-- Book shadow/depth -->
    <path d="M 0 10 L 40 0 L 40 70 L 0 80 Z" fill="#3E4C59"/>
    <path d="M 40 0 L 80 10 L 80 80 L 40 70 Z" fill="#2C3E50"/>
    <!-- Pages side -->
    <path d="M 3 15 L 39 7 L 39 73 L 3 81 Z" fill="#E2E8F0"/>
    <path d="M 41 7 L 77 15 L 77 81 L 41 73 Z" fill="#CBD5E1"/>
    <!-- Cover Left -->
    <path d="M 0 10 C 15 8, 30 5, 40 0 L 40 70 C 30 75, 15 78, 0 80 Z" fill="#FF8A00"/>
    <!-- Cover Right -->
    <path d="M 40 0 C 50 5, 65 8, 80 10 L 80 80 C 65 78, 50 75, 40 70 Z" fill="#FF6B00"/>
    <!-- Bookmark ribbon -->
    <path d="M 40 35 L 45 45 L 40 42 L 35 45 Z" fill="#E74C3C"/>
  </g>

  <!-- Second Book (Right, slightly overlapping/offset to clearly show quantity of two) -->
  <g transform="translate(104, 75)">
    <!-- Book shadow/depth -->
    <path d="M 0 10 L 40 0 L 40 70 L 0 80 Z" fill="#2A4365"/>
    <path d="M 40 0 L 80 10 L 80 80 L 40 70 Z" fill="#1A365D"/>
    <!-- Pages side -->
    <path d="M 3 15 L 39 7 L 39 73 L 3 81 Z" fill="#E2E8F0"/>
    <path d="M 41 7 L 77 15 L 77 81 L 41 73 Z" fill="#CBD5E1"/>
    <!-- Cover Left -->
    <path d="M 0 10 C 15 8, 30 5, 40 0 L 40 70 C 30 75, 15 78, 0 80 Z" fill="#00B4D8"/>
    <!-- Cover Right -->
    <path d="M 40 0 C 50 5, 65 8, 80 10 L 80 80 C 65 78, 50 75, 40 70 Z" fill="#0077B6"/>
    <!-- Bookmark ribbon -->
    <path d="M 40 35 L 45 45 L 40 42 L 35 45 Z" fill="#E74C3C"/>
  </g>

</svg>