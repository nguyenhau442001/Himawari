<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm Light Accent -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Cards/UI elements -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Glowing Effect for the Mindmap Structure -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Desk Light -->
  <circle cx="120" cy="110" r="100" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- ENVIRONMENT & PROPS (Office/Study Desk Context) -->
  <!-- Bookshelf / Window Grid Background -->
  <g opacity="0.15">
    <line x1="30" y1="40" x2="210" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="30" y1="80" x2="210" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="80" y1="40" x2="80" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="40" x2="160" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#090d16"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- Desk Lamp -->
  <g>
    <path d="M 205 200 L 215 200 L 210 130 Z" fill="#334155"/>
    <path d="M 195 130 L 225 130 L 215 100 L 205 100 Z" fill="#475569"/>
    <path d="M 190 90 Q 210 70 230 100" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- Light Cone Projection -->
    <polygon points="210,100 130,200 200,200" fill="#fbbf24" opacity="0.05"/>
  </g>

  <!-- Potted Plant (Adds Life) -->
  <g transform="translate(15, 170)">
    <path d="M 5 30 L 15 30 L 18 10 L 2 10 Z" fill="#64748b"/>
    <path d="M 10 10 C 10 -5 -5 -5 2 -15 C 10 -5 20 -10 25 0" fill="#10b981"/>
    <path d="M 10 10 C 15 -10 30 -5 22 5" fill="#059669"/>
  </g>


  <!-- VISUALIZING "清晰" (CLEAR THOUGHT / MINDMAP / STRUCTURE) -->
  <!-- Glowing Connection Lines representing structured, clear thoughts -->
  <g filter="url(#neonGlow)" opacity="0.85">
    <!-- Main stem from head -->
    <path d="M 120 105 Q 120 70 145 60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120 105 Q 100 70 75 65" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120 105 Q 140 100 165 95" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120 105 Q 95 110 70 120" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sub-branches -->
    <path d="M 145 60 L 175 45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 75 65 L 45 55" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 165 95 L 195 105" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Idea Nodes (Glowing Orbs) -->
    <circle cx="145" cy="60" r="6" fill="#38bdf8"/>
    <circle cx="175" cy="45" r="4" fill="#38bdf8" opacity="0.7"/>

    <circle cx="75" cy="65" r="6" fill="#10b981"/>
    <circle cx="45" cy="55" r="4" fill="#10b981" opacity="0.7"/>

    <circle cx="165" cy="95" r="6" fill="#f59e0b"/>
    <circle cx="195" cy="105" r="4" fill="#f59e0b" opacity="0.7"/>

    <circle cx="70" cy="120" r="6" fill="#ec4899"/>
  </g>

  <!-- Central Focus Sparkle (Clarity Accent) -->
  <g transform="translate(120, 50)" fill="#fbbf24">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z"/>
  </g>


  <!-- CENTRAL CHARACTER (Thoughtful, Confident, Organized Professional) -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Torso -->
    <path d="M 75 200 C 75 160 90 145 120 145 C 150 145 165 160 165 200 Z" fill="#1e3a8a" filter="url(#softShadow)"/>
    <!-- Collar / Shirt -->
    <path d="M 105 145 L 120 165 L 135 145 L 125 145 L 120 155 L 115 145 Z" fill="#f8fafc"/>
    <!-- Tie (Sharp, structured) -->
    <polygon points="117,155 123,155 125,185 120,195 115,185" fill="#f43f5e"/>

    <!-- Neck -->
    <rect x="110" y="130" width="20" height="20" fill="#fcd34d" rx="4"/>

    <!-- Head & Face -->
    <path d="M 95 100 C 95 75 145 75 145 100 C 145 125 135 135 120 135 C 105 135 95 125 95 100 Z" fill="#fde047"/>

    <!-- Hair (Neat, modern styling) -->
    <path d="M 96 100 C 94 75 110 65 122 65 C 140 65 146 80 146 100 C 140 90 125 88 120 88 C 105 88 98 92 96 100 Z" fill="#0f172a"/>

    <!-- Facial Expression: Focused, Bright Eyes, Calm Confident Smile -->
    <!-- Eyebrows (Slanted slightly inward with confidence, not stress) -->
    <path d="M 103 92 L 113 94" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 137 92 L 127 94" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Open, Clear Eyes -->
    <circle cx="108" cy="100" r="4" fill="#0f172a"/>
    <circle cx="132" cy="100" r="4" fill="#0f172a"/>
    <circle cx="109" cy="99" r="1.5" fill="#ffffff"/>
    <circle cx="133" cy="99" r="1.5" fill="#ffffff"/>

    <!-- Glasses (Enhancing the intellectual/clear-thinking vibe) -->
    <rect x="102" y="94" width="13" height="12" rx="3" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="125" y="94" width="13" height="12" rx="3" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="115" y1="100" x2="125" y2="100" stroke="#64748b" stroke-width="2"/>

    <!-- Confident Smile -->
    <path d="M 113 118 Q 120 124 127 118" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="103" cy="112" r="4" fill="#f43f5e" opacity="0.25"/>
    <circle cx="137" cy="112" r="4" fill="#f43f5e" opacity="0.25"/>
  </g>

  <!-- FOREGROUND DESK PROPS (Notebook showing structured/clear notes) -->
  <g transform="translate(70, 175) rotate(-5)" filter="url(#softShadow)">
    <rect width="60" height="35" rx="4" fill="#f8fafc"/>
    <line x1="10" y1="10" x2="30" y2="10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="45" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="25" x2="35" y2="25" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Checkmark indicating clarity/organization -->
    <path d="M 42 8 L 47 13 L 53 5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(160, 175)" filter="url(#softShadow)">
    <rect x="0" y="0" width="20" height="25" rx="3" fill="#e2e8f0"/>
    <path d="M 20 5 C 28 5 28 20 20 20" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Steam indicating warmth -->
    <path d="M 6 -5 Q 10 -10 6 -15" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 14 -3 Q 10 -8 14 -13" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

</svg>