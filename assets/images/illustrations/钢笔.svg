<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="rotate(-45 120 120)">
    <!-- Pen Cap -->
    <path d="M105,40 L135,40 L137,85 L103,85 Z" fill="#2D3748"/>
    <!-- Cap Clip -->
    <rect x="117" y="45" width="6" height="32" rx="3" fill="#D69E2E"/>
    <!-- Clip Ring -->
    <rect x="103" y="80" width="34" height="6" rx="2" fill="#D69E2E"/>

    <!-- Pen Body / Barrel -->
    <rect x="105" y="90" width="30" height="90" fill="#2B6CB0"/>
    
    <!-- Gold Accents on Barrel -->
    <rect x="104" y="86" width="32" height="4" rx="1" fill="#D69E2E"/>

    <!-- Grip Section -->
    <path d="M105,180 L135,180 L133,200 L107,200 Z" fill="#2D3748"/>
    <line x1="110" y1="185" x2="130" y2="185" stroke="#4A5568" stroke-width="2"/>
    <line x1="110" y1="190" x2="130" y2="190" stroke="#4A5568" stroke-width="2"/>
    <line x1="110" y1="195" x2="130" y2="195" stroke="#4A5568" stroke-width="2"/>

    <!-- Fountain Pen Nib -->
    <path d="M107,200 L133,200 C133,200 130,225 120,230 C110,225 107,200 107,200 Z" fill="#D69E2E"/>
    
    <!-- Nib Details (Breather hole and slit) -->
    <circle cx="120" cy="210" r="2.5" fill="#1A1D24"/>
    <line x1="120" y1="212.5" x2="120" y2="228" stroke="#1A1D24" stroke-width="1.5"/>
  </g>

  <!-- Flowing Ink Drops (Referencing smoothness in sentence) -->
  <circle cx="50" cy="190" r="3" fill="#3182CE" opacity="0.8"/>
  <circle cx="40" cy="180" r="2" fill="#3182CE" opacity="0.5"/>
  <path d="M48,160 Q45,170 52,175" stroke="#3182CE" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>