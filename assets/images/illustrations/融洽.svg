<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="teaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Warm ambient lighting overlay -->
  <rect width="240" height="240" rx="24" fill="url(#warmLight)" />

  <!-- Room Interior & Background Props -->
  <!-- Bookshelf & books -->
  <g opacity="0.4">
    <rect x="25" y="45" width="40" height="70" rx="2" fill="#475569" />
    <line x1="25" y1="65" x2="65" y2="65" stroke="#334155" stroke-width="2" />
    <line x1="25" y1="90" x2="65" y2="90" stroke="#334155" stroke-width="2" />
    <!-- Books -->
    <rect x="29" y="50" width="8" height="13" rx="1" fill="#38bdf8" />
    <rect x="39" y="48" width="6" height="15" rx="1" fill="#ec4899" />
    <rect x="47" y="52" width="10" height="11" rx="1" fill="#10b981" />
    <rect x="30" y="72" width="12" height="16" rx="1" fill="#f59e0b" />
    <rect x="44" y="75" width="8" height="13" rx="1" fill="#a855f7" />
  </g>

  <!-- Hanging Potted Plant -->
  <g>
    <path d="M195 20 L215 20 L205 40 Z" fill="#64748b" />
    <path d="M205 40 Q190 60 185 50" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <path d="M205 40 Q225 65 220 55" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <path d="M205 40 Q205 68 200 60" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <circle cx="183" cy="48" r="5" fill="#34d399" />
    <circle cx="222" cy="53" r="5" fill="#10b981" />
    <circle cx="198" cy="62" r="4" fill="#059669" />
  </g>

  <!-- Window with soft night city glow -->
  <g transform="translate(140, 25)">
    <rect width="65" height="75" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <line x1="32" y1="0" x2="32" y2="75" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="38" x2="65" y2="38" stroke="#475569" stroke-width="2" />
    <!-- City silhouette outside -->
    <rect x="8" y="45" width="10" height="30" fill="#334155" opacity="0.6" />
    <rect x="22" y="30" width="14" height="45" fill="#334155" opacity="0.6" />
    <rect x="42" y="40" width="15" height="35" fill="#334155" opacity="0.6" />
    <circle cx="13" cy="50" r="1" fill="#fbbf24" />
    <circle cx="27" cy="35" r="1" fill="#fbbf24" />
    <circle cx="48" cy="45" r="1" fill="#38bdf8" />
  </g>

  <!-- Warm Pendant Light -->
  <circle cx="120" cy="30" r="50" fill="url(#lampGlow)" />
  <path d="M120 0 L120 15" stroke="#64748b" stroke-width="2" />
  <path d="M110 15 L130 15 L135 22 L105 22 Z" fill="#475569" />

  <!-- Main Table & Center Stage -->
  <ellipse cx="120" cy="185" rx="85" ry="25" fill="#0f172a" opacity="0.5" />
  <!-- Wooden Tabletop -->
  <path d="M45 150 L195 150 L210 175 L30 175 Z" fill="#b45309" filter="url(#softShadow)" />
  <path d="M48 153 L192 153 L206 172 L34 172 Z" fill="#d97706" />
  <!-- Table Legs -->
  <rect x="55" y="172" width="10" height="40" rx="3" fill="#92400e" />
  <rect x="175" y="172" width="10" height="40" rx="3" fill="#92400e" />

  <!-- Table Props: Teapot, Cups, Open Book, and Laptop -->
  <!-- Teapot -->
  <circle cx="120" cy="155" r="10" fill="#f8fafc" />
  <path d="M112 150 Q105 145 110 140" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <path d="M128 153 Q136 150 133 160" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="120" cy="143" r="2" fill="#cbd5e1" />
  <!-- Teacups -->
  <ellipse cx="95" cy="162" rx="6" ry="4" fill="#f8fafc" />
  <ellipse cx="145" cy="162" rx="6" ry="4" fill="#f8fafc" />
  <!-- Open Notebook -->
  <path d="M70 162 Q80 158 90 164 L90 172 Q80 166 70 170 Z" fill="#f1f5f9" />
  <path d="M90 164 Q100 158 110 162 L110 170 Q100 166 90 172 Z" fill="#f1f5f9" />
  <line x1="90" y1="164" x2="90" y2="172" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Laptop on the side -->
  <path d="M155 158 L180 153 L185 167 L160 172 Z" fill="#94a3b8" />
  <path d="M157 159 L178 155 L176 138 L155 142 Z" fill="#64748b" />
  <path d="M160 143 L173 140 L174 152 L161 155 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Characters representing "融洽" (Harmonious/Warm Relationship) -->

  <!-- CHARACTER 1: Left (Woman, smiling warmly, expressive hand gesture) -->
  <g transform="translate(40, 75)">
    <!-- Body & Torso -->
    <path d="M45 75 Q45 55 60 55 Q75 55 75 75 L85 110 L35 110 Z" fill="#ec4899" filter="url(#softShadow)" />
    <!-- Collar/Details -->
    <path d="M52 55 L60 65 L68 55" fill="none" stroke="#fce7f3" stroke-width="3" stroke-linecap="round" />

    <!-- Left Arm gesturing -->
    <path d="M47 70 Q30 75 25 85" fill="none" stroke="#ec4899" stroke-width="12" stroke-linecap="round" />
    <circle cx="23" cy="87" r="6" fill="#fbcfe8" /> <!-- Hand -->

    <!-- Head & Hair -->
    <circle cx="60" cy="35" r="18" fill="#fbcfe8" />
    <!-- Hair back/base -->
    <path d="M42 35 Q40 15 60 15 Q80 15 78 35 Q80 50 70 52 L50 52 Q42 45 42 35 Z" fill="#1e1b4b" />
    <!-- Hair bangs & ponytail bounce -->
    <path d="M44 32 Q55 25 65 30" fill="none" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round" />
    <circle cx="75" cy="45" r="8" fill="#1e1b4b" /> <!-- Ponytail -->

    <!-- Face (Warm, genuine smile, happy eyes) -->
    <!-- Eyes (happy curves) -->
    <path d="M52 33 Q56 37 60 33" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M64 33 Q68 37 72 33" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="53" cy="39" r="4" fill="#fda4af" opacity="0.6" />
    <circle cx="71" cy="39" r="4" fill="#fda4af" opacity="0.6" />
    <!-- Warm open smile -->
    <path d="M58 41 Q62 46 66 41" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" />
  </g>


  <!-- CHARACTER 2: Right (Man, leaning forward, laughing/engaged in friendly chat) -->
  <g transform="translate(125, 70)">
    <!-- Body & Torso (Leaning forward slightly) -->
    <path d="M50 75 Q50 55 65 55 Q80 55 80 75 L95 115 L35 115 Z" fill="#3b82f6" filter="url(#softShadow)" />
    <!-- Shirt collar/tie -->
    <path d="M57 55 L65 65 L73 55" fill="none" stroke="#eff6ff" stroke-width="3" stroke-linecap="round" />
    <polygon points="63,65 67,65 65,80" fill="#1d4ed8" />

    <!-- Right Arm resting/gesturing on table -->
    <path d="M75 75 Q95 85 105 100" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
    <circle cx="107" cy="102" r="6" fill="#fed7aa" /> <!-- Hand -->

    <!-- Head & Hair -->
    <circle cx="65" cy="32" r="18" fill="#fed7aa" />
    <!-- Modern stylish hair -->
    <path d="M47 30 Q50 12 68 15 Q83 17 83 32 Q83 38 78 40 L52 40 Q47 36 47 30 Z" fill="#334155" />
    <path d="M63 15 Q72 10 78 20" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" />

    <!-- Face (Laughing, eyes closed in joy, warm harmony) -->
    <!-- Eyes (Happy closed arcs) -->
    <path d="M57 30 Q61 34 65 30" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M69 30 Q73 34 77 30" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="58" cy="36" r="4" fill="#fca5a5" opacity="0.6" />
    <circle cx="76" cy="36" r="4" fill="#fca5a5" opacity="0.6" />
    <!-- Big joyful smile -->
    <path d="M63 38 Q67 44 71 38" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Atmospheric Harmony Floating Elements (Hearts/Sparkles indicating warm rapport) -->
  <g>
    <!-- Sparkle 1 -->
    <path d="M120 75 L122 82 L129 84 L122 86 L120 93 L118 86 L111 84 L118 82 Z" fill="#fbbf24" opacity="0.9" />
    <!-- Sparkle 2 (Smaller) -->
    <path d="M95 55 L96 59 L100 60 L96 61 L95 65 L94 61 L90 60 L94 59 Z" fill="#f43f5e" opacity="0.8" />
    <!-- Soft glowing floating heart -->
    <path d="M145 50 Q145 42 153 42 Q159 42 159 50 Q159 58 145 66 Q131 58 131 50 Q131 42 137 42 Q145 42 145 50 Z" fill="#f43f5e" opacity="0.85" transform="scale(0.6) translate(120, 20)" />
  </g>

</svg>