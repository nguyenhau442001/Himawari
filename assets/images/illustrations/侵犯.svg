<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Architectural Background -->
  <!-- Back Wall Details / Window / Frame -->
  <rect x="30" y="30" width="180" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Warm office light from window -->
  <path d="M40 40 L100 40 L100 140 L40 140 Z" fill="#38bdf8" fill-opacity="0.05"/>
  <circle cx="70" cy="70" r="15" fill="#fbbf24" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Bookshelf / Office Props in background -->
  <rect x="120" y="50" width="30" height="8" rx="2" fill="#475569"/>
  <rect x="125" y="58" width="8" height="25" rx="1" fill="#f43f5e"/>
  <rect x="135" y="55" width="6" height="28" rx="1" fill="#38bdf8"/>
  <rect x="143" y="60" width="5" height="23" rx="1" fill="#10b981"/>

  <!-- Plant -->
  <path d="M185 130 C185 115 195 110 195 100 C195 110 205 115 205 130 Z" fill="#10b981"/>
  <path d="M190 130 C180 120 175 115 170 110 C177 118 185 125 190 130 Z" fill="#34d399"/>
  <path d="M200 130 C210 120 215 115 220 110 C213 118 205 125 200 130 Z" fill="#34d399"/>
  <path d="M185 130 L195 130 L198 145 L182 145 Z" fill="#64748b"/>

  <!-- Wooden Desk Surface -->
  <path d="M15 155 L225 155 L215 205 L25 205 Z" fill="url(#deskGrad)"/>
  <path d="M15 155 L225 155 L225 160 L15 160 Z" fill="#475569"/>

  <!-- Desk Props (Person B's workspace / personal items) -->
  <!-- Laptop -->
  <path d="M135 150 L175 150 L185 170 L125 170 Z" fill="#cbd5e1"/>
  <path d="M120 170 L190 170 L195 173 L115 173 Z" fill="#94a3b8"/>
  <path d="M140 153 L170 153 L175 167 L135 167 Z" fill="#0f172a"/>

  <!-- Character B (The Owner of Rights / Seated defending territory) -->
  <!-- Chair Back -->
  <path d="M45 105 C45 90 65 90 65 105 L65 165 L45 165 Z" fill="#475569"/>
  <!-- Body / Torso (Person B) -->
  <path d="M45 130 C45 115 75 115 75 130 L70 160 L50 160 Z" fill="#6366f1"/>
  <!-- Head (Person B) -->
  <circle cx="60" cy="100" r="14" fill="#fbcfe8"/>
  <!-- Hair (Person B) -->
  <path d="M48 97 C48 85 72 85 72 97 C72 100 68 93 60 93 C52 93 48 100 48 97 Z" fill="#334155"/>
  <!-- Arm (Person B holding ground / defensive posture) -->
  <path d="M65 130 L95 125 L95 135 L65 140 Z" fill="#6366f1"/>

  <!-- Protective Energy Barrier / Shield (Visualizing "No Infringement") -->
  <g filter="url(#glow)">
    <path d="M100 80 C105 80 110 110 110 140 C110 170 100 200 100 200 C100 200 90 170 90 140 C90 110 95 80 100 80 Z" fill="url(#shieldGrad)" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <!-- Check / Stop Symbol inside barrier representing boundary protection -->
    <circle cx="100" cy="140" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M92 140 L108 140" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Character A (The Intruder trying to cross the boundary - halted) -->
  <!-- Body / Torso (Person A) -->
  <path d="M150 120 C150 110 175 110 175 120 L170 165 L155 165 Z" fill="#f43f5e"/>
  <!-- Head (Person A) -->
  <circle cx="162" cy="95" r="13" fill="#fed7aa"/>
  <!-- Hair (Person A) -->
  <path d="M151 92 C151 82 173 82 173 92 C173 95 169 90 162 90 C155 90 151 95 151 92 Z" fill="#78350f"/>
  <!-- Reaching Arm (Person A trying to grab/infringe) -->
  <path d="M150 125 L115 133 L115 141 L150 133 Z" fill="#f43f5e"/>
  <!-- Hand attempting to cross -->
  <circle cx="112" cy="137" r="4" fill="#fed7aa"/>

  <!-- Warning / Boundary Marker Elements on Desk -->
  <path d="M96 160 L104 160 L102 185 L98 185 Z" fill="#64748b"/>
  <ellipse cx="100" cy="160" rx="8" ry="3" fill="#cbd5e1"/>

</svg>