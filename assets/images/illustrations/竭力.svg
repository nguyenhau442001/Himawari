<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Success Circle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- NIGHT WINDOW (Context: Working Late) -->
  <rect x="165" y="22" width="52" height="58" rx="8" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <!-- Window Pane Lines -->
  <line x1="191" y1="22" x2="191" y2="80" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="165" y1="50" x2="217" y2="50" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Moon & Stars -->
  <circle cx="180" cy="38" r="6" fill="#fef08a"/>
  <circle cx="182" cy="36" r="5" fill="#090d16"/> <!-- Moon Crescent cutout -->
  <circle cx="202" cy="34" r="1" fill="#f8fafc" opacity="0.8"/>
  <circle cx="208" cy="44" r="0.8" fill="#f8fafc" opacity="0.6"/>
  <circle cx="174" cy="62" r="0.8" fill="#f8fafc" opacity="0.5"/>

  <!-- WALL CLOCK (Showing 11:58 late night deadline) -->
  <circle cx="50" cy="42" r="13" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="50" cy="42" r="1.5" fill="#94a3b8"/>
  <!-- Clock Hands -->
  <line x1="50" y1="42" x2="48" y2="34" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="50" y2="31" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>

  <!-- LAMP & LIGHT CONE -->
  <polygon points="18,105 110,185 10,185" fill="url(#lampGlow)"/>
  <!-- Lamp Structure -->
  <path d="M 22 175 L 22 110 L 32 102" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 28 100 L 40 106 L 32 114 Z" fill="#f59e0b"/>
  <rect x="16" y="173" width="12" height="4" rx="1" fill="#334155"/>

  <!-- DESK SURFACE -->
  <path d="M 0 178 L 240 178 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <line x1="0" y1="178" x2="240" y2="178" stroke="#334155" stroke-width="2"/>

  <!-- PROPS: COFFEE MUGS (Indicating intense effort/all-nighter) -->
  <!-- Mug 1 (Tilted/Finished) -->
  <rect x="25" y="166" width="10" height="12" rx="2" fill="#ef4444" transform="rotate(-70 25 166)"/>
  <!-- Mug 2 (Empty on desk) -->
  <rect x="42" y="162" width="11" height="15" rx="2" fill="#3b82f6"/>
  <path d="M 53 165 C 56 165 56 172 53 172" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- PROPS: STACK OF COMPLETED PAPERS -->
  <rect x="185" y="168" width="36" height="10" rx="1" fill="#334155"/>
  <rect x="187" y="164" width="34" height="6" rx="1" fill="#475569"/>
  <rect x="184" y="160" width="35" height="5" rx="1" fill="#f8fafc"/>
  <!-- Green Checkmark on finished documents stack -->
  <circle cx="201" cy="153" r="6" fill="#10b981"/>
  <path d="M 198 153 L 200 155 L 204 151" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LAPTOP & SCREEN (The Task Being Completed) -->
  <!-- Screen Back Ambient Glow -->
  <circle cx="115" cy="135" r="45" fill="url(#screenGlow)"/>
  
  <!-- Laptop Screen Shell -->
  <rect x="75" y="102" width="70" height="48" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <!-- Laptop Display Content -->
  <rect x="78" y="105" width="64" height="42" rx="2" fill="#1e293b"/>
  
  <!-- "TASK COMPLETED" Visual on Screen -->
  <!-- Progress Bar (100% Full) -->
  <rect x="86" y="136" width="48" height="4" rx="2" fill="#334155"/>
  <rect x="86" y="136" width="48" height="4" rx="2" fill="#10b981"/>
  
  <!-- Success Badge on Screen -->
  <circle cx="110" cy="120" r="10" fill="#10b981" filter="url(#glow)"/>
  <path d="M 105 120 L 109 123 L 115 117" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Laptop Base / Keyboard -->
  <path d="M 62 150 L 158 150 L 168 174 L 52 174 Z" fill="#334155"/>
  <path d="M 72 153 L 148 153 L 154 167 L 66 167 Z" fill="#1e293b"/>
  <!-- Keyboard Keys details -->
  <line x1="75" y1="158" x2="145" y2="158" stroke="#475569" stroke-width="2" stroke-dasharray="3 1.5"/>
  <line x1="73" y1="162" x2="147" y2="162" stroke="#475569" stroke-width="2" stroke-dasharray="4 1.5"/>

  <!-- CHARACTER (Exerting utmost effort / 竭力) -->
  <g id="character">
    <!-- Back/Torso leaning heavily forward -->
    <path d="M 160 210 C 155 180 165 150 185 140 C 195 135 210 145 215 165 C 220 185 220 210 220 210 Z" fill="#0284c7"/>
    
    <!-- Shadow under character -->
    <ellipse cx="140" cy="175" rx="30" ry="4" fill="#090d16" opacity="0.5"/>

    <!-- Left Arm (Bracing on desk with strain) -->
    <path d="M 180 155 L 150 172 L 132 172" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Hand gripping desk edge -->
    <circle cx="130" cy="172" r="5" fill="#f0a07c"/>

    <!-- Head & Face (Showing intense exertion & determination) -->
    <g transform="translate(162, 100)">
      <!-- Hair Back -->
      <path d="M -2 -8 C 5 -18 25 -18 32 -6 C 35 5 30 15 30 15 Z" fill="#0f172a"/>
      <!-- Head Base -->
      <circle cx="12" cy="10" r="14" fill="#f0a07c"/>
      <!-- Hair Front / Style -->
      <path d="M -1 4 C 4 -8 20 -12 28 -2 C 24 -2 18 -4 12 0 C 8 3 3 8 -1 4 Z" fill="#1e293b"/>
      
      <!-- Intense Eyebrows (V-angled for effort) -->
      <path d="M 2 6 L 8 9" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      <path d="M 18 9 L 23 7" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Determined/Slightly Strained Eyes -->
      <ellipse cx="6" cy="11" rx="1.5" ry="2" fill="#0f172a"/>
      <ellipse cx="20" cy="11" rx="1.5" ry="2" fill="#0f172a"/>
      
      <!-- Gritted Teeth / Triumphant Grin (Exertion) -->
      <path d="M 8 18 Q 13 22 18 18 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <line x1="10" y1="19" x2="16" y2="19" stroke="#0f172a" stroke-width="0.7"/>

      <!-- Sweat Droplets (Symbolizing "竭力" / Extreme Effort) -->
      <path d="M -3 8 Q -6 11 -3 13 Q 0 11 -3 8 Z" fill="#38bdf8"/>
      <path d="M 26 12 Q 24 14 26 16 Q 28 14 26 12 Z" fill="#38bdf8"/>
    </g>

    <!-- Right Arm (Stretching out dramatically to hit the final key) -->
    <path d="M 190 150 L 155 152 L 118 163" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 190 150 L 155 152 L 118 163" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    
    <!-- Hand / Extended Index Finger pressing key -->
    <circle cx="116" cy="164" r="5" fill="#f0a07c"/>
    <path d="M 116 164 L 108 166" stroke="#f0a07c" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ACTION / DYNAMIC LINES (Representing the exertion of full power) -->
  <!-- Impact / Final Touch Energy Spark at Finger -->
  <path d="M 104 161 L 98 156" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 106 172 L 100 176" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 102 166 L 94 166" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="107" cy="166" r="2" fill="#fef08a"/>

  <!-- Motion / Effort Lines around Character -->
  <path d="M 215 130 C 222 135 225 145 223 155" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 175 90 Q 185 85 195 92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>