<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing document scanning/printing light -->
  <circle cx="120" cy="110" r="70" fill="#2A3245" opacity="0.5"/>
  
  <!-- Document base (Paper) -->
  <g transform="translate(70, 45)">
    <!-- Paper sheet -->
    <rect x="0" y="0" width="100" height="130" rx="4" fill="#F0F4F8"/>
    <!-- Document lines -->
    <rect x="15" y="20" width="70" height="6" rx="3" fill="#D1DCE5"/>
    <rect x="15" y="36" width="50" height="6" rx="3" fill="#D1DCE5"/>
    <rect x="15" y="52" width="60" height="6" rx="3" fill="#D1DCE5"/>
    
    <!-- Printed content simulation (blue text/image lines) -->
    <rect x="15" y="75" width="40" height="5" rx="2.5" fill="#3B82F6" opacity="0.6"/>
    <rect x="15" y="87" width="70" height="5" rx="2.5" fill="#3B82F6" opacity="0.6"/>
  </g>
  
  <!-- Red Seal / Stamp (印章 - yìn) stamping onto the document -->
  <g transform="translate(115, 110)">
    <!-- Motion lines indicating downward stamping action -->
    <path d="M25 -35 L25 -25" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M12 -38 L15 -28" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M38 -38 L35 -28" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Seal Handle -->
    <rect x="15" y="-30" width="20" height="15" rx="3" fill="#E64A19"/>
    <!-- Seal Grip Ring -->
    <rect x="10" y="-38" width="30" height="8" rx="4" fill="#FF7043"/>
    
    <!-- Seal Base (Block) -->
    <path d="M5 -15 L45 -15 L50 0 L0 0 Z" fill="#D32F2F"/>
    
    <!-- Red Ink Stamp Imprint on Paper (Bottom layer for visual context) -->
    <g transform="translate(-25, 20)">
      <rect x="0" y="0" width="36" height="36" rx="4" fill="#FF3D00" opacity="0.85"/>
      <!-- Internal decorative patterns inside the stamp (abstract seal script representation) -->
      <path d="M8 10 H28 M8 18 H28 M18 8 V28 M12 13 L24 23 M24 13 L12 23" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <!-- Modern UI Focus Accent / Corner framing -->
  <path d="M24 40 V28 C28 28 28 24 24 24 H40" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M216 40 V28 C212 28 212 24 216 24 H200" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M24 200 V212 C28 212 28 216 24 216 H40" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M216 200 V212 C212 212 212 216 216 216 H200" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" fill="none"/>

</svg>