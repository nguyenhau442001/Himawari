<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Parents (The listeners) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#F39C12"/>
    <path d="M5 40 Q20 55 35 40" stroke="#F39C12" stroke-width="4" fill="none"/>
    <circle cx="40" cy="60" r="20" fill="#F39C12"/>
  </g>
  <g transform="translate(170, 110)">
    <circle cx="20" cy="20" r="15" fill="#F39C12"/>
    <path d="M5 40 Q20 55 35 40" stroke="#F39C12" stroke-width="4" fill="none"/>
    <circle cx="40" cy="60" r="20" fill="#F39C12"/>
  </g>

  <!-- The Child (The accuser/reporter) -->
  <g transform="translate(50, 100)">
    <circle cx="20" cy="20" r="12" fill="#3498DB"/>
    <path d="M10 35 L30 35 L25 80 L15 80 Z" fill="#3498DB"/>
    <!-- Pointing gesture -->
    <path d="M30 45 L50 40" stroke="#3498DB" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- The Accused (The one being reported) -->
  <g transform="translate(80, 140)" opacity="0.6">
    <circle cx="15" cy="15" r="10" fill="#7F8C8D"/>
    <path d="M5 25 L25 25 L22 60 L8 60 Z" fill="#7F8C8D"/>
  </g>

  <!-- Visual indicator of "reporting" (A simple speech bubble shape without text) -->
  <path d="M65 80 L90 80 L100 60 L110 80 L130 80 L130 110 L65 110 Z" fill="#2C3E50" stroke="#F39C12" stroke-width="2"/>
</svg>