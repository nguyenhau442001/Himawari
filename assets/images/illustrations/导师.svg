<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow behind the mentor -->
  <circle cx="120" cy="115" r="70" fill="#2D333F" opacity="0.6"/>

  <!-- Advisor/Mentor Character (導師) - Sleek flat vector design -->
  <!-- Body/Suit -->
  <path d="M75 195 C75 165 95 155 120 155 C145 155 165 165 165 195 Z" fill="#2563EB"/>
  <path d="M105 155 L135 155 L140 185 L100 185 Z" fill="#1E40AF"/>
  <!-- Shirt & Tie -->
  <polygon points="120,165 130,185 110,185" fill="#F3F4F6"/>
  <polygon points="120,173 123,195 120,205 117,195" fill="#F59E0B"/>

  <!-- Neck -->
  <rect x="111" y="138" width="18" height="22" fill="#FBBF24"/>

  <!-- Head -->
  <circle cx="120" cy="115" r="28" fill="#FBBF24"/>

  <!-- Hair -->
  <path d="M92 115 C92 95 105 90 120 90 C135 90 148 95 148 115 C148 115 145 103 120 101 C95 103 92 115 92 115 Z" fill="#1F2937"/>

  <!-- Glasses (Symbol of wisdom/academic advisor) -->
  <rect x="103" y="106" width="14" height="9" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="123" y="106" width="14" height="9" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <line x1="117" y1="110" x2="123" y2="110" stroke="#F59E0B" stroke-width="2"/>

  <!-- Friendly, encouraging smile / mentoring expression -->
  <path d="M113 125 Q120 131 127 125" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Academic symbol / Research document floating gently to the side -->
  <g transform="translate(170, 75)">
    <rect x="-10" y="0" width="36" height="46" rx="4" fill="#E5E7EB"/>
    <rect x="-4" y="8" width="24" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="-4" y="16" width="18" height="3" rx="1.5" fill="#9CA3AF"/>
    <rect x="-4" y="23" width="22" height="3" rx="1.5" fill="#9CA3AF"/>
    <!-- Gold star/grade indicating guidance and evaluation -->
    <polygon points="8,35 10,40 15,40 11,43 13,48 8,45 3,48 5,43 1,40 6,40" fill="#F59E0B"/>
  </g>

  <!-- Pointing/Guiding hand gesture (Representing direction/instruction) -->
  <path d="M152 145 C157 145 162 140 160 135 C159 132 155 131 153 134" fill="#FBBF24"/>
  <rect x="135" y="142" width="20" height="10" rx="3" fill="#2563EB" transform="rotate(-15 135 142)"/>
</svg>