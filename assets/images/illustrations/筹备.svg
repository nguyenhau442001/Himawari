<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#warmGlow)" />

  <!-- Room Interior & Background Props -->
  <!-- Floor line -->
  <line x1="20" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Window with fairy lights -->
  <rect x="90" y="45" width="60" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <line x1="120" y1="45" x2="120" y2="120" stroke="#334155" stroke-width="2" />
  <line x1="90" y1="82" x2="150" y2="82" stroke="#334155" stroke-width="2" />
  <!-- Fairy lights on window -->
  <circle cx="100" cy="55" r="2.5" fill="#fbbf24" />
  <circle cx="110" cy="58" r="2.5" fill="#f43f5e" />
  <circle cx="120" cy="55" r="2.5" fill="#38bdf8" />
  <circle cx="130" cy="58" r="2.5" fill="#10b981" />
  <circle cx="140" cy="55" r="2.5" fill="#fbbf24" />

  <!-- Decorative Wedding Bunting / Garland -->
  <path d="M 20 35 Q 60 55 100 35 T 180 35 T 220 35" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
  <polygon points="45,43 50,53 55,43" fill="#ec4899" />
  <polygon points="85,41 90,51 95,41" fill="#fbbf24" />
  <polygon points="135,41 140,51 145,41" fill="#38bdf8" />
  <polygon points="175,43 180,53 185,43" fill="#ec4899" />

  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="70" width="35" height="60" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="95" x2="60" y2="95" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="115" x2="60" y2="115" stroke="#334155" stroke-width="2" />
  <!-- Small plant on shelf -->
  <path d="M 38 70 Q 38 60 43 60 Q 48 60 48 70 Z" fill="#10b981" />
  <rect x="35" y="70" width="16" height="8" rx="2" fill="#cbd5e1" />

  <!-- Central Table (Wedding planning desk) -->
  <rect x="75" y="150" width="90" height="50" rx="4" fill="#334155" />
  <rect x="80" y="153" width="80" height="6" fill="#1e293b" rx="2" />
  <!-- Table legs -->
  <line x1="88" y1="200" x2="80" y2="225" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line x1="152" y1="200" x2="160" y2="225" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- Props on Table: Wedding blueprints, color swatches, laptop -->
  <!-- Laptop -->
  <path d="M 105 153 L 135 153 L 138 143 L 102 143 Z" fill="#94a3b8" />
  <rect x="107" y="133" width="26" height="11" rx="1" fill="#cbd5e1" />
  <!-- Wedding Invitation / Blueprint sketch -->
  <rect x="140" y="145" width="20" height="15" rx="1" fill="#f8fafc" />
  <circle cx="150" cy="152" r="3" fill="#ec4899" />
  <!-- Color swatches / ribbons -->
  <path d="M 85 147 Q 90 143 95 147" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 87 150 Q 92 146 97 150" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Characters -->

  <!-- Character 1 (Left - Woman planning/smiling) -->
  <!-- Body/Torso -->
  <path d="M 45 200 C 45 175 65 170 75 170 C 85 170 95 175 95 200 Z" fill="#38bdf8" />
  <!-- Neck -->
  <rect x="67" y="152" width="10" height="20" fill="#fbcfe8" />
  <!-- Head -->
  <circle cx="72" cy="142" r="15" fill="#fbcfe8" />
  <!-- Hair (Brown/Styled) -->
  <path d="M 57 140 C 57 125 87 125 87 140 C 87 148 83 152 83 152 L 61 152 Z" fill="#451a03" />
  <!-- Face features (Smiling, focused) -->
  <circle cx="68" cy="143" r="1.5" fill="#1e293b" />
  <circle cx="77" cy="143" r="1.5" fill="#1e293b" />
  <path d="M 71 147 Q 73 150 75 147" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Arm pointing/holding pen -->
  <path d="M 70 175 C 70 175 90 165 98 152" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />
  <circle cx="98" cy="151" r="3" fill="#38bdf8" />

  <!-- Character 2 (Right - Man holding ring box or checklist) -->
  <!-- Body/Torso -->
  <path d="M 145 200 C 145 175 165 170 175 170 C 185 170 205 175 205 200 Z" fill="#10b981" />
  <!-- Neck -->
  <rect x="167" y="152" width="10" height="20" fill="#fbcfe8" />
  <!-- Head -->
  <circle cx="172" cy="142" r="15" fill="#fbcfe8" />
  <!-- Hair (Dark modern cut) -->
  <path d="M 158 138 C 158 128 186 128 186 138 C 186 142 182 144 182 144 L 162 144 Z" fill="#0f172a" />
  <!-- Face features -->
  <circle cx="168" cy="143" r="1.5" fill="#1e293b" />
  <circle cx="177" cy="143" r="1.5" fill="#1e293b" />
  <path d="M 171 148 Q 173 150 175 148" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Arm holding clipboard / checklist -->
  <path d="M 175 175 C 175 175 160 165 152 155" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round" />
  <!-- Checklist Prop -->
  <rect x="138" y="142" width="18" height="24" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="142" y1="148" x2="148" y2="148" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="142" y1="154" x2="152" y2="154" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="142" y1="160" x2="150" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Foreground Atmospheric Wedding Elements -->
  <!-- Floating heart accents (symbolizing wedding preparation theme) -->
  <path d="M 112 110 C 112 105 118 102 120 107 C 122 102 128 105 128 110 C 128 115 120 120 120 120 C 120 120 112 115 112 110 Z" fill="#ec4899" opacity="0.8" />
  <path d="M 75 90 C 75 86 80 84 82 87 C 84 84 89 86 89 90 C 89 94 82 98 82 98 C 82 98 75 94 75 90 Z" fill="#fbbf24" opacity="0.6" transform="scale(0.8) translate(30, 20)" />

</svg>