<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Environment: Command / Investigation Room background -->
  <!-- Window grid showing night city/base -->
  <path d="M30 30 H110 V110 H30 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M70 30 V110 M30 70 H110" stroke="#334155" stroke-width="1"/>
  <path d="M40 40 L60 50 L50 80" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  
  <!-- Map Board on wall -->
  <rect x="130" y="30" width="80" height="70" rx="4" fill="#1b263b" stroke="#334155" stroke-width="2"/>
  <!-- Map lines & pins -->
  <path d="M140 50 Q160 35 180 60 T200 80" fill="none" stroke="#64748b" stroke-dasharray="2,2" stroke-width="1.5"/>
  <circle cx="140" cy="50" r="3" fill="#ef4444"/>
  <circle cx="180" cy="60" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="80" r="3" fill="#10b981"/>
  
  <!-- Ambient light glow -->
  <circle cx="120" cy="140" r="80" fill="url(#glow)"/>

  <!-- Desk & Equipment -->
  <rect x="20" y="165" width="200" height="12" rx="3" fill="#334155"/>
  <rect x="35" y="177" width="170" height="40" fill="#0f172a"/>
  
  <!-- Computer Monitors (Left & Right displaying intelligence data) -->
  <!-- Left Monitor -->
  <rect x="25" y="110" width="55" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="30" y="115" width="45" height="35" rx="2" fill="#1e293b"/>
  <path d="M35 135 L45 125 L55 130 L65 120" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="47" y="165" width="10" height="5" fill="#64748b"/>
  
  <!-- Right Monitor -->
  <rect x="160" y="110" width="55" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="165" y="115" width="45" height="35" rx="2" fill="#1e293b"/>
  <!-- Radar/Grid circle -->
  <circle cx="187" cy="132" r="14" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M187 118 V146 M173 132 H201" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M187 132 L197 122" stroke="#10b981" stroke-width="1.5"/>
  <rect x="182" y="165" width="10" height="5" fill="#64748b"/>

  <!-- Character (Analyst collecting/reviewing intelligence) -->
  <!-- Torso & Jacket -->
  <path d="M85 190 C85 155 95 145 120 145 C145 145 155 155 155 190 Z" fill="#2563eb"/>
  <path d="M105 145 L120 170 L135 145" fill="#1e40af"/>
  <!-- Shirt collar -->
  <polygon points="110,145 120,155 130,145" fill="#f8fafc"/>

  <!-- Head & Face -->
  <circle cx="120" cy="120" r="18" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M102 120 C102 105 138 105 138 120 C138 112 130 102 120 102 C110 102 102 112 102 120 Z" fill="#1e293b"/>
  
  <!-- Expression / Glasses -->
  <rect x="110" y="114" width="10" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="120" y="114" width="10" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="110" y1="117" x2="130" y2="117" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="120" cy="125" r="1.5" fill="#b45309"/>

  <!-- Arms interacting with tactical file / folder -->
  <!-- Left Arm -->
  <path d="M95 155 L75 165 L85 175" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm reaching forward -->
  <path d="M145 155 L155 168 L140 175" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Props: Intelligence Folder & Documents on Desk -->
  <g transform="translate(95, 158)">
    <!-- Folder -->
    <path d="M0 10 L10 0 L40 0 L50 10 L50 25 L0 25 Z" fill="#d97706"/>
    <path d="M5 5 L45 5 L45 22 L5 22 Z" fill="#fffbeb"/>
    <!-- Stamp 'Top Secret' implied via red stylized graphic -->
    <rect x="15" y="10" width="20" height="8" rx="1" fill="#ef4444" opacity="0.8"/>
  </g>

  <!-- Magnifying Glass hovering (symbolizing gathering/investigating intelligence) -->
  <g transform="translate(130, 130)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" fill-opacity="0.2"/>
    <line x1="8" y1="8" x2="20" y2="20" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Accent lighting highlights -->
  <path d="M20 166 H220" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>