<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="40" y="140" width="160" height="15" rx="2" fill="#334155"/>
  <rect x="50" y="155" width="10" height="80" fill="#475569"/>
  <rect x="180" y="155" width="10" height="80" fill="#475569"/>
  
  <!-- The Subject (The "Conservative" thinker) -->
  <g transform="translate(60, 60)">
    <circle cx="40" cy="40" r="25" fill="#f8fafc"/>
    <path d="M25 45 Q40 55 55 45" stroke="#1e293b" stroke-width="2" fill="none"/>
    <circle cx="32" cy="35" r="3" fill="#1e293b"/>
    <circle cx="48" cy="35" r="3" fill="#1e293b"/>
    <rect x="25" y="15" width="30" height="10" rx="2" fill="#38bdf8"/>
    <rect x="20" y="20" width="40" height="5" rx="1" fill="#38bdf8"/>
  </g>
  
  <!-- The "Modern" Idea (A glowing lightbulb, rejected/ignored) -->
  <g transform="translate(150, 70)">
    <path d="M10 0 A10 10 0 0 1 10 20 A10 10 0 0 1 10 0" fill="#fbbf24"/>
    <rect x="7" y="20" width="6" height="5" fill="#fbbf24"/>
    <path d="M5 25 L15 25 L13 30 L7 30 Z" fill="#94a3b8"/>
    <circle cx="10" cy="10" r="3" fill="#1e293b"/>
  </g>
  
  <!-- Traditional Paper/Files (Representing conservative approach) -->
  <rect x="60" y="110" width="50" height="30" rx="2" fill="#e2e8f0"/>
  <rect x="65" y="115" width="40" height="3" fill="#94a3b8"/>
  <rect x="65" y="122" width="40" height="3" fill="#94a3b8"/>
  <rect x="65" y="129" width="20" height="3" fill="#94a3b8"/>
  
  <!-- Crossed arms gesture -->
  <path d="M80 100 L110 100 L120 120" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M80 110 L110 110 L120 90" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Decorative background elements -->
  <circle cx="200" cy="30" r="2" fill="#fb923c" opacity="0.5"/>
  <circle cx="220" cy="50" r="3" fill="#ec4899" opacity="0.5"/>
  <circle cx="30" cy="200" r="4" fill="#10b981" opacity="0.3"/>
</svg>