<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glowing elements (subtle warm sunrise/soil atmosphere) -->
  <circle cx="120" cy="110" r="70" fill="#262B36" opacity="0.6"/>

  <!-- Farmland Soil (The physical place/environment) -->
  <path d="M 40,165 Q 120,150 200,165 L 208,195 Q 120,205 32,195 Z" fill="#3E2723"/>
  <path d="M 32,195 Q 120,205 208,195 L 214,215 Q 120,225 26,215 Z" fill="#271C18"/>

  <!-- Furrows / Tilled soil lines -->
  <path d="M 60,175 Q 120,167 180,178" stroke="#4E342E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 45,190 Q 120,182 195,193" stroke="#1F1612" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Farmer (Character representing the noun concept of farming/farm work) -->
  <!-- Body/Torso (Blue worker jacket) -->
  <path d="M 100,140 L 140,140 L 148,180 L 92,180 Z" fill="#3B82F6"/>
  
  <!-- Head -->
  <circle cx="120" cy="104" r="16" fill="#FBBF24"/>
  
  <!-- Conical Straw Hat (Traditional farming hat) -->
  <path d="M 90,96 C 90,92 104,86 120,86 C 136,86 150,92 150,96 L 164,102 C 164,102 120,95 76,102 Z" fill="#FDE047"/>
  <ellipse cx="120" cy="96" rx="30" ry="6" fill="#EAB308"/>

  <!-- Arms in working pose -->
  <path d="M 104,142 L 85,155 L 95,165" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 136,142 L 155,152 L 145,162" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Farming Tool (Hoe / Spade digging into earth) -->
  <line x1="140" y1="120" x2="165" y2="175" stroke="#9A3412" stroke-width="5" stroke-linecap="round"/>
  <path d="M 155,170 L 175,178 L 168,185 Z" fill="#94A3B8"/>

  <!-- Growing Green Sprout (The crop being cultivated) -->
  <g transform="translate(85, 130)">
    <!-- Soil mound for sprout -->
    <ellipse cx="15" cy="35" rx="14" ry="5" fill="#5D4037"/>
    <!-- Stem -->
    <path d="M 15,35 Q 12,22 15,12" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Left Leaf -->
    <path d="M 15,22 Q 5,16 4,22 Q 4,28 15,25 Z" fill="#4ADE80"/>
    <!-- Right Leaf -->
    <path d="M 15,18 Q 25,12 26,18 Q 26,24 15,21 Z" fill="#22C55E"/>
  </g>

  <!-- Atmospheric accents (sun / nature warmth) -->
  <circle cx="190" cy="65" r="16" fill="#F59E0B" opacity="0.8"/>
  <path d="M 190,40 L 190,45" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 190,85 L 190,90" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 165,65 L 170,65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 210,65 L 215,65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
</svg>