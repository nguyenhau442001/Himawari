<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Shadow for depth -->
  <ellipse cx="120" cy="195" rx="55" ry="8" fill="#111318"/>

  <!-- Hanging Sign / Brand Plaque (牌子) -->
  <g transform="translate(0, 10)">
    <!-- Support hooks and chains -->
    <path d="M90 35 L90 60" stroke="#8C9BAE" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 35 L150 60" stroke="#8C9BAE" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="35" r="4" fill="#F39C12"/>
    <circle cx="150" cy="35" r="4" fill="#F39C12"/>

    <!-- Main Plaque Body (Rounded Rectangle) -->
    <rect x="65" y="60" width="110" height="75" rx="12" fill="#2C3544" stroke="#F39C12" stroke-width="3"/>
    
    <!-- Inner border detail -->
    <rect x="73" y="68" width="94" height="59" rx="8" fill="none" stroke="#3E4C60" stroke-width="1.5"/>

    <!-- Brand / Trademark Symbol (Stylized Crown / Crest representing "Brand/Trademark" meaning) -->
    <g transform="translate(120, 92)">
      <path d="M-18 8 L-22 -8 L-8 -2 L0 -14 L8 -2 L22 -8 L18 8 Z" fill="#F39C12"/>
      <circle cx="-22" cy="-10" r="3" fill="#E67E22"/>
      <circle cx="0" cy="-16" r="3.5" fill="#E67E22"/>
      <circle cx="22" cy="-10" r="3" fill="#E67E22"/>
      <!-- Base bar of the crest -->
      <rect x="-18" y="11" width="36" height="4" rx="2" fill="#E67E22"/>
    </g>
  </g>

  <!-- Physical Object Example context: Sleek modern smartphone leaning against the plaque to reference "你的手机是什么牌子的？" -->
  <g transform="translate(130, 115)">
    <!-- Phone Shadow -->
    <rect x="2" y="2" width="54" height="84" rx="10" fill="#0E1013"/>
    <!-- Phone Body -->
    <rect x="0" y="0" width="54" height="84" rx="10" fill="#3B82F6"/>
    <!-- Phone Screen -->
    <rect x="4" y="4" width="46" height="76" rx="7" fill="#1E293B"/>
    <!-- Screen UI Elements (Abstract app interface) -->
    <circle cx="27" cy="32" r="12" fill="#3B82F6"/>
    <rect x="14" y="52" width="26" height="4" rx="2" fill="#475569"/>
    <rect x="18" y="60" width="18" height="3" rx="1.5" fill="#334155"/>
    <!-- Camera Notch -->
    <rect x="21" y="8" width="12" height="3" rx="1.5" fill="#0F172A"/>
  </g>
</svg>