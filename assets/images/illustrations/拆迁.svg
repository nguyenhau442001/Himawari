<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: Building Demolition & Relocation Site (拆迁) -->
  <g transform="translate(0, 0)">
    <!-- Ground / Foundation -->
    <path d="M40 185 L200 185 L200 195 L40 195 Z" fill="#2D323E"/>
    <line x1="45" y1="185" x2="195" y2="185" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Building Structure - Left intact part -->
    <path d="M50 185 L50 90 L110 90 L110 185 Z" fill="#252A34"/>
    <!-- Windows intact -->
    <rect x="62" y="105" width="14" height="20" rx="2" fill="#3E4553"/>
    <rect x="84" y="105" width="14" height="20" rx="2" fill="#F59E0B" opacity="0.8"/>
    <rect x="62" y="135" width="14" height="20" rx="2" fill="#3E4553"/>
    <rect x="84" y="135" width="14" height="20" rx="2" fill="#3E4553"/>

    <!-- Building Structure - Demolishing/Falling Center-Right part -->
    <path d="M110 110 L160 80 L180 140 L130 185 Z" fill="#2A303C" opacity="0.7"/>
    <!-- Diagonal split lines & rubble -->
    <polygon points="120,120 150,100 140,160 115,170" fill="#1F242D"/>
    
    <!-- Demolition Wrecking Ball & Crane Hook Action -->
    <!-- Crane Arm (Top Right) -->
    <path d="M210 50 L140 70 L130 65" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <!-- Crane Cable -->
    <path d="M140 70 L135 125" fill="none" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Wrecking Ball striking the building -->
    <circle cx="125" cy="135" r="16" fill="#EF4444"/>
    <path d="M115 125 L125 135 L135 125" fill="none" stroke="#DC2626" stroke-width="3"/>

    <!-- Impact Effect / Debris / Dust Sparks -->
    <circle cx="138" cy="120" r="3" fill="#F59E0B"/>
    <circle cx="110" cy="145" r="2.5" fill="#F59E0B"/>
    <circle cx="145" cy="140" r="2" fill="#94A3B8"/>
    <path d="M100 175 L115 185 L95 188 Z" fill="#475569"/>
    <path d="M150 170 L170 185 L145 188 Z" fill="#475569"/>
    
    <!-- Relocation Box / Moving Symbolism at base -->
    <g transform="translate(160, 155)">
      <rect x="0" y="10" width="22" height="20" rx="2" fill="#D97706"/>
      <path d="M0 15 L22 15" stroke="#B45309" stroke-width="2"/>
      <path d="M6 10 L11 5 L16 10" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(182, 160)">
      <rect x="0" y="8" width="16" height="22" rx="2" fill="#B45309"/>
      <path d="M0 13 L16 13" stroke="#92400E" stroke-width="2"/>
    </g>
  </g>
</svg>