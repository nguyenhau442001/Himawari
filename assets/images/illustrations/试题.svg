<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/accent -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>
  
  <!-- Examination Paper (试题 - Noun object) -->
  <!-- Paper Base -->
  <g transform="translate(65, 40)">
    <!-- Shadow for depth -->
    <rect x="6" y="6" width="100" height="130" rx="6" fill="#111318"/>
    
    <!-- Main Paper Sheet -->
    <rect width="100" height="130" rx="6" fill="#F4F5F7"/>
    
    <!-- Header / Title placeholder -->
    <rect x="25" y="16" width="50" height="6" rx="3" fill="#D0D5DD"/>
    <circle cx="15" cy="19" r="3" fill="#FFA000"/>
    
    <!-- Question Lines & Checkboxes (Simulating a test paper) -->
    <!-- Question 1 -->
    <rect x="15" y="38" width="8" height="8" rx="2" fill="none" stroke="#667085" stroke-width="2"/>
    <line x1="28" y1="40" x2="75" y2="40" stroke="#98A2B3" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="48" x2="60" y2="48" stroke="#98A2B3" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Question 2 -->
    <rect x="15" y="66" width="8" height="8" rx="2" fill="none" stroke="#667085" stroke-width="2"/>
    <line x1="28" y1="68" x2="80" y2="68" stroke="#98A2B3" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="76" x2="50" y2="76" stroke="#98A2B3" stroke-width="3" stroke-linecap="round"/>

    <!-- Question 3 -->
    <rect x="15" y="94" width="8" height="8" rx="2" fill="none" stroke="#667085" stroke-width="2"/>
    <line x1="28" y1="96" x2="70" y2="96" stroke="#98A2B3" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="104" x2="65" y2="104" stroke="#98A2B3" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Writing Instrument / Pencil (Focus/Exam context) -->
  <g transform="translate(135, 115) rotate(35)">
    <!-- Pencil Body -->
    <polygon points="0,0 12,-12 18,-6 6,6" fill="#FFC107"/>
    <!-- Pencil Tip Wood -->
    <polygon points="0,0 -8,8 -4,12" fill="#FFE0B2"/>
    <!-- Pencil Lead -->
    <polygon points="-8,8 -4,12 -6,10" fill="#344054"/>
    <!-- Eraser Metal Band -->
    <rect x="12" y="-12" width="6" height="6" transform="rotate(45 15 -9)" fill="#98A2B3"/>
    <!-- Eraser -->
    <rect x="16" y="-16" width="6" height="8" transform="rotate(45 19 -12)" fill="#F06292"/>
  </g>

  <!-- Success/Focus Accent Checkmark badge -->
  <g transform="translate(155, 65)">
    <circle cx="14" cy="14" r="16" fill="#10B981"/>
    <path d="M8 14L12 18L21 9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>