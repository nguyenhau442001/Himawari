<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Neon Glow for Restaurant/Table -->
    <radialGradient id="table-glow" cx="120" cy="180" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skin-grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lantern-glow" cx="120" cy="40" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light Effects -->
  <circle cx="120" cy="40" r="90" fill="url(#lantern-glow)"/>
  <circle cx="120" cy="180" r="90" fill="url(#table-glow)"/>

  <!-- Background Environment: Cozy Restaurant Wall & Window -->
  <!-- Wall Panel -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Window showing night city bokeh -->
  <rect x="150" y="35" width="50" height="70" rx="6" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <circle cx="165" cy="55" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="185" cy="70" r="2" fill="#fb923c" opacity="0.8"/>
  <circle cx="170" cy="85" r="2.5" fill="#34d399" opacity="0.5"/>

  <!-- Wall Hanging Decor (Wooden plaque silhouette) -->
  <rect x="40" y="40" width="24" height="60" rx="4" fill="#334155"/>
  <line x1="52" y1="45" x2="52" y2="95" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Ceiling Lantern -->
  <line x1="120" y1="0" x2="120" y2="30" stroke="#64748b" stroke-width="2"/>
  <path d="M 105 30 L 135 30 L 142 50 L 98 50 Z" fill="#fbbf24"/>
  <ellipse cx="120" cy="50" rx="22" ry="6" fill="#f59e0b"/>

  <!-- Restaurant Table Surface -->
  <path d="M 30 185 L 210 185 L 225 215 L 15 215 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="50" y="215" width="16" height="25" fill="#1e293b"/>
  <rect x="174" y="215" width="16" height="25" fill="#1e293b"/>

  <!-- Central Props: Menu & Food -->
  <!-- Opened Menu on Table -->
  <path d="M 95 180 Q 120 170 145 180 L 140 198 Q 120 188 100 198 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="108" y1="184" x2="118" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="122" y1="184" x2="132" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="189" x2="116" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Hot Steaming Bowl (Right) -->
  <ellipse cx="170" cy="180" rx="16" ry="6" fill="#0f172a"/>
  <path d="M 154 180 C 154 193 186 193 186 180 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Steam lines -->
  <path d="M 166 168 Q 163 162 168 156" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 174 167 Q 177 161 172 155" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- CHARACTER 1: Person ordering/pointing (Left) -->
  <!-- Body & Hoodie -->
  <path d="M 45 200 C 45 170 65 155 85 155 C 105 155 125 170 125 200 Z" fill="#38bdf8"/>
  <!-- Hoodie Collar / Strings -->
  <path d="M 75 155 L 85 170 L 95 155" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="75" y="142" width="20" height="16" fill="url(#skin-grad)"/>
  <!-- Head -->
  <circle cx="85" cy="120" r="22" fill="url(#skin-grad)"/>
  <!-- Hair (Messy modern short dark hair) -->
  <path d="M 63 120 C 63 100 107 100 107 120 C 107 125 103 112 95 108 C 85 102 75 108 67 114 Z" fill="#0f172a"/>
  <!-- Facial expression: Curious, friendly open expression -->
  <circle cx="93" cy="120" r="2" fill="#0f172a"/>
  <path d="M 90 128 Q 94 133 98 128" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <!-- Raised arm pointing at menu (Active engagement) -->
  <path d="M 105 170 C 115 160 125 170 130 180" fill="none" stroke="url(#skin-grad)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="132" cy="183" r="4.5" fill="url(#skin-grad)"/>

  <!-- CHARACTER 2: Friend listening/attentive (Right, partially shown or seated opposite) -->
  <!-- Body & Jacket -->
  <path d="M 160 210 C 160 180 180 165 200 165 C 220 165 235 180 235 210 Z" fill="#ec4899"/>
  <!-- Neck -->
  <rect x="185" y="148" width="18" height="18" fill="url(#skin-grad)"/>
  <!-- Head -->
  <circle cx="194" cy="128" r="20" fill="url(#skin-grad)"/>
  <!-- Hair (Ponytail/Bun style) -->
  <path d="M 175 124 C 173 106 213 106 211 124 C 215 116 220 118 218 126" fill="#1e293b"/>
  <circle cx="218" cy="120" r="6" fill="#1e293b"/>
  <!-- Friendly attentive face -->
  <circle cx="187" cy="126" r="2" fill="#0f172a"/>
  <path d="M 183 134 Q 187 137 191 134" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hand resting near chin (Thinking/Listening pose) -->
  <path d="M 180 180 C 175 165 185 155 195 160" fill="none" stroke="url(#skin-grad)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="195" cy="158" r="4" fill="url(#skin-grad)"/>

  <!-- Foreground Atmospheric Details -->
  <!-- Chopsticks resting on holder -->
  <rect x="125" y="195" width="22" height="3" rx="1.5" fill="#f59e0b" transform="rotate(-10 125 195)"/>
  <rect x="125" y="200" width="22" height="3" rx="1.5" fill="#f59e0b" transform="rotate(-10 125 200)"/>

</svg>