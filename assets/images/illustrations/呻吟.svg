<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to represent pain/distress focus -->
  <circle cx="120" cy="120" r="70" fill="#FF5252" opacity="0.08"/>

  <!-- Patient Character Representation (Centered iconic figure) -->
  <g transform="translate(0, 10)">
    <!-- Bed / Pillow Support -->
    <path d="M 65 145 L 175 145 C 185 145, 185 160, 175 160 L 65 160 C 55 160, 55 145, 65 145 Z" fill="#2C323E"/>
    <path d="M 75 125 C 75 110, 90 100, 120 100 C 150 100, 165 110, 165 125 L 165 140 L 75 140 Z" fill="#3B4252"/>

    <!-- Head and Shoulders (Patient in pain) -->
    <circle cx="120" cy="115" r="32" fill="#E5C1A5"/>
    
    <!-- Pain Expression / Closed Eyes (wincing) -->
    <path d="M 105 112 Q 112 108 118 112" stroke="#4C566A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 122 112 Q 128 108 135 112" stroke="#4C566A" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Furrowed brow / pain lines -->
    <path d="M 113 103 L 127 103" stroke="#C49A7D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Open mouth (making the sound / groaning) -->
    <ellipse cx="120" cy="130" rx="6" ry="8" fill="#4C566A"/>
    <path d="M 114 126 C 117 125, 123 125, 126 126" fill="#E5C1A5"/>

    <!-- Hand clutching head / forehead (classic sign of pain/groaning) -->
    <path d="M 95 120 C 90 110, 100 95, 115 100" fill="#E5C1A5"/>
    <circle cx="102" cy="102" r="14" fill="#E5C1A5"/>
    <path d="M 92 105 C 95 98, 105 95, 112 100" stroke="#C49A7D" stroke-width="2" fill="none"/>

    <!-- Body/Blanket -->
    <path d="M 80 150 C 90 135, 150 135, 160 150 L 175 190 C 175 195, 165 200, 160 200 L 80 200 C 75 200, 65 195, 65 190 Z" fill="#5E81AC"/>
  </g>

  <!-- Semantic Sound Waves / Groan Visualization (Modern Flat Accents) -->
  <g transform="translate(120, 120)">
    <!-- Expanding sound waves indicating vocalization/groan -->
    <path d="M 45 -25 C 60 -10, 60 10, 45 25" stroke="#FFD166" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 60 -35 C 80 -15, 80 15, 60 35" stroke="#FFD166" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    
    <!-- Left side subtle echo wave -->
    <path d="M -45 -25 C -60 -10, -60 10, -45 25" stroke="#FFD166" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

  <!-- Pain Accent Marks (Floating minimalist visual indicators) -->
  <g fill="#FF5252">
    <!-- Top right pain spark -->
    <path d="M 180 65 L 185 75 L 195 80 L 185 85 L 180 95 L 175 85 L 165 80 L 175 75 Z" transform="scale(0.6) translate(130, 20)"/>
    <!-- Additional small pulse -->
    <circle cx="170" cy="55" r="3" opacity="0.8"/>
    <circle cx="65" cy="75" r="2.5" opacity="0.6"/>
  </g>
</svg>