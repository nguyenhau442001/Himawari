<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Road Surface Background -->
    <path d="M 30,160 L 210,160 L 225,200 L 15,200 Z" fill="#252A34"/>
    <!-- Curb -->
    <path d="M 15,160 L 225,160 L 225,166 L 15,166 Z" fill="#3A4252"/>
    <path d="M 15,160 L 225,160 L 225,163 L 15,163 Z" fill="#E5E9F0" opacity="0.3"/>
    
    <!-- Red/White Curb Striping (No Parking Zone) -->
    <path d="M 25,163 L 45,163 L 41,166 L 21,166 Z" fill="#EF4444"/>
    <path d="M 55,163 L 75,163 L 71,166 L 51,166 Z" fill="#EF4444"/>
    <path d="M 85,163 L 105,163 L 101,166 L 81,166 Z" fill="#EF4444"/>
    <path d="M 115,163 L 135,163 L 131,166 L 111,166 Z" fill="#EF4444"/>
    <path d="M 145,163 L 165,163 L 161,166 L 141,166 Z" fill="#EF4444"/>
    <path d="M 175,163 L 195,163 L 191,166 L 171,166 Z" fill="#EF4444"/>
    <path d="M 205,163 L 215,163 L 213,166 L 203,166 Z" fill="#EF4444"/>

    <!-- Parked Sedan Car (Modern Flat Design) -->
    <g transform="translate(60, 95)">
      <!-- Shadow -->
      <ellipse cx="60" cy="67" rx="54" ry="7" fill="#0D0F12" opacity="0.6"/>
      
      <!-- Wheels -->
      <circle cx="28" cy="58" r="14" fill="#0D0F12"/>
      <circle cx="28" cy="58" r="7" fill="#4C566A"/>
      <circle cx="92" cy="58" r="14" fill="#0D0F12"/>
      <circle cx="92" cy="58" r="7" fill="#4C566A"/>
      
      <!-- Car Body Bottom -->
      <path d="M 10,48 L 110,48 C 114,48 118,52 116,56 L 110,63 C 108,66 104,68 100,68 L 20,68 C 16,68 12,66 10,63 L 4,56 C 2,52 6,48 10,48 Z" fill="#3B82F6"/>
      
      <!-- Main Body & Fenders -->
      <path d="M 12,42 L 30,26 L 90,26 L 108,42 L 114,50 L 6,50 Z" fill="#60A5FA"/>
      
      <!-- Windows & Roof Arch -->
      <path d="M 34,26 L 42,12 L 80,12 L 86,26 Z" fill="#1E293B"/>
      <path d="M 36,26 L 43,14 L 79,14 L 84,26 Z" fill="#93C5FD" opacity="0.8"/>
      <!-- Window Divider -->
      <path d="M 60,14 L 60,26" stroke="#1E293B" stroke-width="2"/>
      
      <!-- Headlights & Details -->
      <rect x="104" y="44" width="4" height="4" rx="1" fill="#FBBF24"/>
      <rect x="12" y="44" width="4" height="4" rx="1" fill="#EF4444"/>
      
      <!-- Hazard Warning Light (Pulsing Indicator) -->
      <circle cx="60" cy="3" r="5" fill="#EF4444"/>
      <circle cx="60" cy="3" r="8" fill="#EF4444" opacity="0.4"/>
    </g>

    <!-- Violation Notice Sign / Ticket Symbol (Overlaying the scene clearly) -->
    <g transform="translate(145, 45)">
      <!-- Sign Pole -->
      <rect x="18" y="35" width="4" height="75" fill="#64748B"/>
      
      <!-- Circular Prohibition Sign (No Parking) -->
      <circle cx="20" cy="20" r="22" fill="#FFFFFF"/>
      <circle cx="20" cy="20" r="20" fill="#EF4444"/>
      <circle cx="20" cy="20" r="15" fill="#FFFFFF"/>
      
      <!-- Letter P with Prohibition Slash -->
      <path d="M 15,13 L 15,27 M 15,13 L 21,13 C 24,13 25,15 25,17 C 25,19 24,21 21,21 L 15,21" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 8,8 L 32,32" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Warning / Fine Ticket Accent Overlay -->
    <g transform="translate(45, 75) rotate(-12)">
      <rect width="32" height="42" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Ticket Header -->
      <rect x="4" y="6" width="24" height="5" rx="1" fill="#EF4444"/>
      <!-- Fake Text Lines representing fine citation -->
      <line x1="6" y1="16" x2="26" y2="16" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="22" x2="22" y2="22" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="28" x2="24" y2="28" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <!-- Red stamp mark -->
      <circle cx="22" cy="32" r="6" fill="none" stroke="#EF4444" stroke-width="1.5"/>
      <path d="M 19,32 L 21,34 L 25,30" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>