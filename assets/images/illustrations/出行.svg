<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines for travel -->
  <path d="M160 160 C 180 160 190 150 190 130" stroke="#FFB84D" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
  <path d="M150 170 C 180 170 200 150 200 120" stroke="#FFB84D" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.4"/>
  
  <!-- Character: Walking/Traveling -->
  <g transform="translate(100, 120)">
    <!-- Legs -->
    <path d="M-10 0 L-5 50 M10 0 L15 45" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M0 -40 L0 0" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M0 -20 L-20 10 M0 -20 L20 10" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-55" r="15" fill="#E0E0E0"/>
  </g>
  
  <!-- Luggage/Bag -->
  <rect x="130" y="130" width="20" height="30" rx="4" fill="#FFB84D"/>
  <path d="M135 130 L135 125 L145 125 L145 130" stroke="#FFB84D" stroke-width="3" fill="none"/>
  
  <!-- Ground line -->
  <line x1="40" y1="170" x2="200" y2="170" stroke="#374151" stroke-width="2"/>
</svg>