<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Golden Glow (Idealism/Aspiration) -->
    <radialGradient id="idealGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Golden Glow for "Noble/Lofty" Idea -->
  <circle cx="120" cy="90" r="100" fill="url(#idealGlow)" />

  <!-- ENVIRONMENT: Study Room / Architect's Studio -->
  <!-- Window Frame in Background -->
  <rect x="35" y="30" width="60" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- Window Panes & Night Sky View -->
  <path d="M40 35 L90 35 L90 115 L40 115 Z" fill="#1e293b" />
  <!-- Stars outside -->
  <circle cx="50" cy="45" r="1" fill="#cbd5e1" />
  <circle cx="75" cy="55" r="1.5" fill="#fef08a" />
  <circle cx="65" cy="85" r="1" fill="#cbd5e1" />
  <circle cx="82" cy="98" r="1.2" fill="#cbd5e1" />
  <!-- City skyline silhouette outside window -->
  <path d="M40 115 L40 95 L48 95 L48 115 L55 115 L55 80 L62 80 L62 115 L70 115 L70 70 L80 70 L80 115 Z" fill="#0f172a" />

  <!-- Light Beam coming through window -->
  <polygon points="40,35 180,200 60,200" fill="url(#lightBeam)" />

  <!-- Bookshelf on back wall -->
  <rect x="150" y="40" width="55" height="85" fill="#1e293b" />
  <line x1="150" y1="65" x2="205" y2="65" stroke="#334155" stroke-width="2" />
  <line x1="150" y1="95" x2="205" y2="95" stroke="#334155" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="155" y="48" width="8" height="17" fill="#3b82f6" rx="1" />
  <rect x="165" y="45" width="10" height="20" fill="#ec4899" rx="1" />
  <rect x="180" y="50" width="7" height="15" fill="#10b981" rx="1" />
  <rect x="156" y="75" width="12" height="20" fill="#f59e0b" rx="1" />
  <rect x="170" y="78" width="9" height="17" fill="#8b5cf6" rx="1" />

  <!-- Floating Conceptual Elements (Lofty Ideals / Architecture / Vision) -->
  <g opacity="0.8">
    <!-- Stylized architectural wireframe building model floating -->
    <path d="M175 110 L190 120 L190 150 L175 140 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M160 117 L175 110 L175 140 L160 147 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="175" cy="95" r="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M171 95 L179 95 M175 91 L175 99" stroke="#fbbf24" stroke-width="1.5" />
  </g>

  <!-- WORKING DESK -->
  <rect x="20" y="185" width="200" height="35" rx="4" fill="url(#deskGrad)" />
  <rect x="20" y="185" width="200" height="5" fill="#64748b" rx="1" />
  <!-- Desk Lamp -->
  <path d="M50 185 L55 155 L65 155 L60 185 Z" fill="#64748b" />
  <path d="M45 157 C45 145 65 140 70 155 Z" fill="#f59e0b" />
  <ellipse cx="58" cy="157" rx="8" ry="4" fill="#fbbf24" />
  <!-- Laptop & Blueprints -->
  <rect x="80" y="165" width="40" height="20" rx="2" fill="#94a3b8" />
  <polygon points="75,185 125,185 130,190 70,190" fill="#64748b" />
  <path d="M135 175 L165 170 L175 185 L145 190 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <path d="M142 176 L158 173 M145 182 L162 179" stroke="#3b82f6" stroke-width="1" />
  <!-- Coffee Mug -->
  <rect x="185" y="170" width="12" height="15" rx="2" fill="#e2e8f0" />
  <path d="M197 173 C202 173 202 181 197 181" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- MAIN CHARACTER: Dreamer/Idealist working late -->
  <!-- Chair Back -->
  <path d="M100 130 L115 110 L130 130 L125 185 L105 185 Z" fill="#334155" />
  <rect x="110" y="135" width="10" height="45" fill="#1e293b" rx="3" />

  <!-- Character Body (Sitting, leaning forward inspired) -->
  <g transform="translate(95, 115)">
    <!-- Torso -->
    <path d="M12 25 L38 22 L45 70 L10 70 Z" fill="#2563eb" /> <!-- Blue shirt -->
    <!-- Collar -->
    <path d="M22 25 L25 32 L28 25 Z" fill="#f8fafc" />

    <!-- Arms & Hands -->
    <!-- Left Arm resting on desk -->
    <path d="M15 30 L5 55 L25 65" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="65" r="5" fill="#f87171" /> <!-- Hand -->

    <!-- Right Arm raised pensively to chin -->
    <path d="M35 28 L48 45 L38 35" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="38" cy="33" r="5" fill="#f87171" /> <!-- Hand near chin -->

    <!-- Head & Neck -->
    <rect x="22" y="12" width="10" height="15" fill="#f87171" />
    <!-- Face Profile / 3/4 view -->
    <path d="M20 0 C12 0 10 10 12 20 C14 25 22 25 27 20 C32 15 32 5 28 2 Z" fill="#ffedd5" />
    <!-- Hair (Neat, modern short dark hair) -->
    <path d="M18 5 C18 -2 30 -2 32 5 C33 8 30 7 28 4 C24 1 20 2 18 5 Z" fill="#0f172a" />
    <path d="M12 10 C11 14 13 18 15 20 C15 15 14 11 12 10 Z" fill="#0f172a" />

    <!-- Facial Expression: Inspired, thoughtful gaze upward -->
    <!-- Eye looking up-right -->
    <circle cx="25" cy="11" r="1.5" fill="#0f172a" />
    <!-- Subtle confident/hopeful smile -->
    <path d="M25 17 Q27 19 29 17" fill="none" stroke="#9a3412" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Particles (Golden Sparkles of Inspiration) -->
  <circle cx="105" cy="60" r="2" fill="#fbbf24" opacity="0.9" />
  <circle cx="130" cy="45" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="90" cy="85" r="2.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="145" cy="90" r="1" fill="#fef08a" opacity="0.7" />
  <path d="M120 50 L122 55 L127 57 L122 59 L120 64 L118 59 L113 57 L118 55 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M95 40 L96 43 L99 44 L96 45 L95 48 L94 45 L91 44 L94 43 Z" fill="#fbbf24" opacity="0.6" />

  <!-- Vignette Frame Border (Clean rounded inset) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>