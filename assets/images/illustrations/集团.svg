<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glass Window Gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Globe Gradients -->
    <linearGradient id="globe-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screen-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Details: Modern High-rise Office Interior -->
  <!-- Floor -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#090d16" />
  <line x1="0" y1="200" x2="240" y2="200" stroke="#334155" stroke-width="1.5" />

  <!-- City Skyline through Window (International Theme) -->
  <g opacity="0.4">
    <rect x="20" y="80" width="22" height="120" fill="#334155" />
    <rect x="46" y="60" width="30" height="140" fill="#475569" />
    <rect x="80" y="90" width="18" height="110" fill="#334155" />
    <rect x="170" y="70" width="26" height="130" fill="#334155" />
    <rect x="200" y="100" width="20" height="100" fill="#475569" />
    <!-- City lights -->
    <circle cx="31" cy="95" r="1.5" fill="#f59e0b" />
    <circle cx="31" cy="115" r="1.5" fill="#f59e0b" />
    <circle cx="61" cy="85" r="1.5" fill="#38bdf8" />
    <circle cx="61" cy="115" r="1.5" fill="#38bdf8" />
    <circle cx="61" cy="145" r="1.5" fill="#f59e0b" />
    <circle cx="183" cy="90" r="1.5" fill="#38bdf8" />
    <circle cx="183" cy="120" r="1.5" fill="#f59e0b" />
  </g>

  <!-- Window Frame -->
  <rect x="15" y="45" width="210" height="155" fill="none" stroke="#475569" stroke-width="3" rx="4" />
  <rect x="15" y="45" width="210" height="155" fill="url(#glass)" />
  <line x1="120" y1="45" x2="120" y2="200" stroke="#475569" stroke-width="2" />
  <line x1="15" y1="130" x2="225" y2="130" stroke="#475569" stroke-width="2" />

  <!-- Holographic Corporate Globe & Network (Representing Multinational Group) -->
  <g transform="translate(175, 95)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="26" fill="url(#globe-glow)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
    <!-- Continents abstract -->
    <path d="M-10 -8 C-5 -15 8 -12 12 -5 C15 2 5 10 -5 8 C-12 6 -15 -2 -10 -8 Z" fill="#38bdf8" opacity="0.4" />
    <path d="M5 5 C12 8 18 15 12 20 C6 25 -2 18 5 5 Z" fill="#10b981" opacity="0.4" />
    <!-- Orbiting nodes -->
    <circle cx="-18" cy="-12" r="3" fill="#fbbf24" />
    <circle cx="15" cy="14" r="2.5" fill="#ec4899" />
    <line x1="-18" y1="-12" x2="0" y2="0" stroke="#38bdf8" stroke-width="0.75" opacity="0.6" />
    <line x1="15" y1="14" x2="0" y2="0" stroke="#38bdf8" stroke-width="0.75" opacity="0.6" />
  </g>

  <!-- Office Desk -->
  <g filter="url(#shadow)">
    <path d="M30 175 L210 175 L220 200 L20 200 Z" fill="#334155" />
    <rect x="30" y="170" width="180" height="7" rx="2" fill="#64748b" />
  </g>

  <!-- Desk Props: Laptop & Analytics Display -->
  <g transform="translate(110, 140)">
    <!-- Laptop Base -->
    <path d="M-22 32 L22 32 L28 38 L-28 38 Z" fill="#94a3b8" />
    <!-- Laptop Screen -->
    <rect x="-20" y="4" width="40" height="29" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <rect x="-17" y="7" width="34" height="23" fill="url(#screen-glow)" />
    <!-- Chart lines on screen -->
    <polyline points="-12,25 -5,17 2,21 12,11" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="12" cy="11" r="2" fill="#fbbf24" />
  </g>

  <!-- Professional Characters (Diverse Executives Collaborating) -->
  
  <!-- Character 1: Executive pointing at data (Left) -->
  <g transform="translate(75, 120)" filter="url(#shadow)">
    <!-- Body / Suit -->
    <path d="M-15 80 L-22 45 L-5 35 L10 45 L5 80 Z" fill="#1e293b" />
    <path d="M-8 37 L0 52 L8 37 L0 32 Z" fill="#ffffff" /> <!-- Shirt -->
    <polygon points="0,42 -3,58 3,58" fill="#ef4444" /> <!-- Red Tie -->
    
    <!-- Head & Hair -->
    <circle cx="0" cy="18" r="14" fill="#fbcfe8" /> <!-- Skin tone -->
    <path d="M-13 15 C-14 5 -5 3 0 3 C8 3 14 6 13 16 C8 13 -4 13 -13 15 Z" fill="#0f172a" /> <!-- Stylish hair -->
    
    <!-- Facial expression: Confident smile -->
    <path d="M-3 22 Q0 25 3 22" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="-4" cy="16" r="1.5" fill="#334155" />
    <circle cx="4" cy="16" r="1.5" fill="#334155" />

    <!-- Arm gesturing towards laptop -->
    <path d="M8 42 Q25 45 35 32" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <circle cx="35" cy="32" r="4" fill="#fbcfe8" />
  </g>

  <!-- Character 2: Executive taking notes / listening attentively (Right) -->
  <g transform="translate(155, 125)" filter="url(#shadow)">
    <!-- Body / Blazer -->
    <path d="M-12 75 L-18 40 L-2 35 L15 45 L10 75 Z" fill="#3b82f6" />
    <path d="M-6 37 L0 50 L6 37 L0 32 Z" fill="#1e293b" /> <!-- Inner top -->

    <!-- Head & Hair -->
    <circle cx="0" cy="16" r="13" fill="#fbcfe8" />
    <path d="M-12 14 C-12 4 -2 2 4 6 C10 10 12 18 12 18 C5 14 -5 13 -12 14 Z" fill="#9a3412" /> <!-- Auburn hair -->

    <!-- Facial expression -->
    <path d="M-2 21 Q0 23 2 21" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="-3" cy="14" r="1.5" fill="#334155" />
    <circle cx="3" cy="14" r="1.5" fill="#334155" />

    <!-- Arms resting on desk holding tablet -->
    <path d="M-12 45 Q-20 50 -10 60 L10 60" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    <!-- Tablet prop -->
    <rect x="-5" y="50" width="22" height="15" rx="1" fill="#0f172a" transform="rotate(-15 5 55)" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Subtle Ambient Lighting / Highlights -->
  <circle cx="120" cy="45" r="80" fill="#38bdf8" opacity="0.05" pointer-events="none" />
</svg>