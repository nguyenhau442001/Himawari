<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Interior Wall & Room Background -->
  <rect x="20" y="20" width="200" height="155" rx="8" fill="#1e293b"/>
  
  <!-- Window showing late evening / night sky -->
  <rect x="35" y="35" width="55" height="75" rx="4" fill="#090d16"/>
  <!-- Window pane frame cross -->
  <line x1="62" y1="35" x2="62" y2="110" stroke="#1e293b" stroke-width="2"/>
  <line x1="35" y1="72" x2="90" y2="72" stroke="#1e293b" stroke-width="2"/>
  <!-- Moon outside -->
  <circle cx="75" cy="52" r="8" fill="#fef08a" opacity="0.9"/>
  <!-- Wall clock showing late hour -->
  <circle cx="120" cy="50" r="14" fill="#334155" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="50" x2="120" y2="42" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="128" y2="53" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="120" cy="50" r="1.5" stroke-width="0" fill="#fbbf24"/>

  <!-- Warm indoor hanging lamp casting soft light downward -->
  <path d="M 175 20 L 175 45" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 160 45 L 190 45 L 198 56 L 152 56 Z" fill="#fbbf24"/>
  <!-- Ambient light pool on floor and table -->
  <ellipse cx="145" cy="170" rx="55" ry="12" fill="#fbbf24" opacity="0.08"/>

  <!-- Wooden Table/Sideboard with teapot and cups -->
  <rect x="135" y="115" width="70" height="60" fill="#334155" rx="4"/>
  <path d="M 155 105 Q 160 95 165 105" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/> <!-- Teapot body -->
  <path d="M 162 100 L 168 100" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/> <!-- Lid -->
  <ellipse cx="185" cy="110" rx="4" ry="3" fill="#cbd5e1"/> <!-- Teacup -->

  <!-- Wooden Floor -->
  <rect x="20" y="175" width="200" height="45" rx="4" fill="#0f172a"/>
  <line x1="20" y1="175" x2="220" y2="175" stroke="#334155" stroke-width="2"/>

  <!-- Character 1: Host (Standing, waving politely in farewell) -->
  <g transform="translate(150, 95)">
    <!-- Body/Torso -->
    <path d="M 15 45 Q 15 30 25 30 L 35 30 Q 45 30 45 45 L 45 80 L 15 80 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="30" cy="18" r="11" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 19 16 Q 30 5 41 16 Q 41 12 30 9 Q 19 12 19 16 Z" fill="#1e293b"/>
    <!-- Arm gesturing farewell -->
    <path d="M 40 38 Q 50 35 52 28" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="20" y="80" width="8" height="28" fill="#1e293b"/>
    <rect x="32" y="80" width="8" height="28" fill="#1e293b"/>
  </g>

  <!-- Character 2: Guest (Bowing slightly, making a parting gesture/cáocí) -->
  <g transform="translate(65, 88)">
    <!-- Torso leaning forward slightly for polite bow -->
    <path d="M 20 40 Q 30 32 40 38 L 45 75 L 15 75 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="32" cy="22" r="11" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 21 20 Q 32 10 43 20 Q 37 13 32 13 Q 27 13 21 20 Z" fill="#334155"/>
    
    <!-- Bowing/Parting hands gesture (cupping fist in hand - traditional polite gesture) -->
    <circle cx="45" cy="50" r="6" fill="#fed7aa"/>
    <path d="M 35 42 Q 45 46 45 50" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>

    <!-- Legs -->
    <rect x="18" y="75" width="8" height="33" fill="#1e293b"/>
    <rect x="32" y="75" width="8" height="33" fill="#1e293b"/>
  </g>

  <!-- Slippers / shoes by the door/exit area -->
  <ellipse cx="45" cy="210" rx="6" ry="3" fill="#64748b"/>
  <ellipse cx="60" cy="212" rx="6" ry="3" fill="#64748b"/>

  <!-- Warm ambient glow overlay to tie the late-night indoor scene together -->
  <circle cx="175" cy="50" r="35" fill="#f59e0b" opacity="0.1" style="mix-blend-mode: screen;"/>

</svg>