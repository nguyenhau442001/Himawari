<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Desert Floor -->
  <path d="M40 180 C 80 170, 160 170, 200 180 L 200 200 L 40 200 Z" fill="#2D3436"/>
  
  <!-- The Scientist (Character) -->
  <g transform="translate(120, 160)">
    <!-- Body -->
    <path d="M-20 0 L 20 0 L 15 -60 L -15 -60 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="-80" r="20" fill="#E2E8F0"/>
    <!-- Hair/Hat -->
    <path d="M-20 -85 A 20 20 0 0 1 20 -85 L 20 -95 A 20 20 0 0 0 -20 -95 Z" fill="#A0AEC0"/>
  </g>
  
  <!-- The Tree (Symbolizing time/growth over years) -->
  <g transform="translate(120, 160)">
    <!-- Trunk -->
    <rect x="-5" y="-100" width="10" height="40" fill="#D69E2E"/>
    <!-- Branches showing layers/years -->
    <path d="M0 -100 L -30 -130 M0 -90 L 30 -120 M0 -80 L -25 -105" stroke="#D69E2E" stroke-width="4" stroke-linecap="round"/>
    <!-- Leaves/Growth -->
    <circle cx="-30" cy="-130" r="8" fill="#48BB78"/>
    <circle cx="30" cy="-120" r="8" fill="#48BB78"/>
    <circle cx="-25" cy="-105" r="6" fill="#48BB78"/>
  </g>

  <!-- Sun/Time indicator (Golden accent) -->
  <circle cx="190" cy="50" r="25" fill="#F6E05E" opacity="0.3"/>
  <circle cx="190" cy="50" r="15" fill="#F6E05E"/>
  
  <!-- Ground Texture/Lines -->
  <path d="M50 190 L 70 190 M90 192 L 110 192 M130 190 L 150 190 M170 192 L 190 192" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
</svg>