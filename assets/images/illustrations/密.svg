<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Dense Forest Canopy Representation -->
  <g transform="translate(120, 120)">
    <!-- Tree Trunks -->
    <rect x="-60" y="20" width="8" height="80" fill="#4A5568"/>
    <rect x="-20" y="30" width="10" height="70" fill="#4A5568"/>
    <rect x="20" y="25" width="8" height="75" fill="#4A5568"/>
    <rect x="50" y="35" width="10" height="65" fill="#4A5568"/>
    
    <!-- Overlapping Dense Foliage Layers -->
    <path d="M-90 20 C-90 -20, -30 -20, -30 20 C-30 60, -90 60, -90 20" fill="#2F855A"/>
    <path d="M-50 10 C-50 -30, 10 -30, 10 10 C 10 50, -50 50, -50 10" fill="#38A169"/>
    <path d="M-10 20 C-10 -20, 50 -20, 50 20 C 50 60, -10 60, -10 20" fill="#2F855A"/>
    <path d="M20 10 C20 -30, 80 -30, 80 10 C 80 50, 20 50, 20 10" fill="#38A169"/>
    <path d="M-30 -10 C-30 -50, 30 -50, 30 -10 C 30 30, -30 30, -30 -10" fill="#48BB78"/>
    
    <!-- Accent: Tiny sliver of gold light trying to penetrate -->
    <path d="M-5 15 L5 5" stroke="#ECC94B" stroke-width="2" stroke-linecap="round"/>
    <path d="M-10 10 L-2 2" stroke="#ECC94B" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>