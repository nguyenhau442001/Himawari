<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Storm Elements -->
  <path d="M40 80 L60 80" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 60 L200 60" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>
  <path d="M190 140 L210 140" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 150 L50 150" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>

  <!-- Snowflakes / Blizzard lines -->
  <path d="M70 70 L60 90" stroke="#8A99AD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M170 90 L160 110" stroke="#8A99AD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M90 150 L80 170" stroke="#8A99AD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M150 140 L140 160" stroke="#8A99AD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ground / Snow Drift -->
  <path d="M30 200 Q 120 185 210 200 L210 220 L30 220 Z" fill="#2B3240"/>

  <!-- Forward March Path / Directional Arrow Indicator representing "must go / stubborn push forward" -->
  <path d="M70 185 Q 120 175 180 185" fill="none" stroke="#FFA800" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
  <polygon points="185,185 175,180 175,190" fill="#FFA800"/>

  <!-- Main Character (Stepping firmly forward into the storm) -->
  <!-- Legs / Boots -->
  <path d="M105 160 L115 195 L130 195" fill="none" stroke="#4A5568" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M125 155 L145 190 L160 192" fill="none" stroke="#4A5568" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coat / Body leaning forward aggressively -->
  <path d="M95 120 L135 125 L145 165 L100 165 Z" fill="#2F3848"/>
  <path d="M90 120 L130 115 L140 160 L95 160 Z" fill="#3B4659"/>

  <!-- Backpack (Traveler going on a long journey) -->
  <rect x="75" y="125" width="20" height="35" rx="4" fill="#E67E22"/>
  <path d="M85 125 L85 160" stroke="#B96719" stroke-width="2"/>

  <!-- Head with Hood / Winter Gear -->
  <circle cx="120" cy="100" r="18" fill="#3B4659"/>
  <!-- Hood brim / Wind resistance shape -->
  <path d="M105 92 Q 120 85 135 95 L130 110 L105 110 Z" fill="#E67E22"/>
  
  <!-- Focused Determination Face (Visor/Shadow) -->
  <path d="M125 97 Q 133 99 135 103" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

  <!-- Forward Arm holding walking stick / pushing through -->
  <path d="M125 120 L155 135 L170 170" fill="none" stroke="#3B4659" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Walking Stick / Trekking Pole piercing forward -->
  <line x1="165" y1="120" x2="190" y2="195" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>

  <!-- Visual Accent: Intense Focus/Willpower Ring around character -->
  <circle cx="125" cy="130" r="70" fill="none" stroke="#FFA800" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
</svg>