<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow (Physical discomfort/pain atmosphere) -->
  <circle cx="120" cy="130" r="70" fill="#FF5722" opacity="0.08" filter="blur(15px)"/>

  <!-- Thermometer showing fever / sickness -->
  <g transform="translate(165, 75)">
    <rect x="0" y="0" width="10" height="60" rx="5" fill="#2E333F"/>
    <rect x="3" y="15" width="4" height="40" rx="2" fill="#FF5722"/>
    <circle cx="5" cy="53" r="7" fill="#FF5722"/>
    <!-- Heat waves / motion -->
    <path d="M 15 10 C 20 15, 20 20, 15 25" stroke="#FF5722" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 18 30 C 23 35, 23 40, 18 45" stroke="#FF5722" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Ice pack / Cold compress on head (Action of enduring suffering/sickness) -->
  <g transform="translate(100, 50)">
    <rect x="-15" y="0" width="40" height="22" rx="6" fill="#00BCD4"/>
    <line x1="-5" y1="11" x2="15" y2="11" stroke="#E0F7FA" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="1" x2="5" y2="21" stroke="#E0F7FA" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character Head & Upper Body (Suffering / Shòuzuì) -->
  <!-- Shoulders / Clothes -->
  <path d="M 60 200 C 60 165, 80 150, 120 150 C 160 150, 180 165, 180 200 Z" fill="#2E333F"/>

  <!-- Neck -->
  <rect x="108" y="130" width="24" height="30" fill="#E0AC9D"/>

  <!-- Head / Face -->
  <circle cx="120" cy="110" r="38" fill="#E0AC9D"/>

  <!-- Flush cheeks (Fever) -->
  <circle cx="95" cy="120" r="8" fill="#FF5722" opacity="0.3"/>
  <circle cx="145" cy="120" r="8" fill="#FF5722" opacity="0.3"/>

  <!-- Closed, strained eyes (Showing discomfort/pain) -->
  <path d="M 92 104 L 104 108" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
  <path d="M 136 108 L 148 104" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyebrows tilted in distress -->
  <path d="M 90 97 C 95 93, 102 95, 106 98" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 134 98 C 138 95, 145 93, 150 97" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Grimacing / Frowning mouth -->
  <path d="M 108 132 C 114 127, 126 127, 132 132" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Messy hair -->
  <path d="M 82 95 C 80 80, 95 70, 110 75 C 120 60, 140 65, 150 78 C 160 75, 168 90, 160 102" fill="#37474F"/>

  <!-- Dynamic Action/Pain Sweating & Stress Lines -->
  <!-- Sweat drop 1 -->
  <path d="M 155 90 C 155 90, 162 100, 162 105 C 162 109, 159 112, 155 112 C 151 112, 148 109, 148 105 C 148 100, 155 90, 155 90 Z" fill="#00BCD4"/>
  <!-- Sweat drop 2 -->
  <path d="M 85 100 C 85 100, 80 106, 80 110 C 80 113, 82 115, 85 115 C 88 115, 90 113, 90 110 C 90 106, 85 100, 85 100 Z" fill="#00BCD4"/>

  <!-- Action/Pain Radiating Auras (Yellow-Orange Focus Accents) -->
  <path d="M 65 75 Q 55 85, 60 95" stroke="#FFC107" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 175 75 Q 185 85, 180 95" stroke="#FFC107" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>