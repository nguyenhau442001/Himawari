<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines for action -->
  <path d="M120 80 L140 60 M125 85 L145 65" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  
  <!-- Character (Butcher) -->
  <g fill="#E0E0E0">
    <!-- Arm -->
    <path d="M80 120 L120 90" stroke="#E0E0E0" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand holding tool -->
    <circle cx="125" cy="85" r="8" fill="#E0E0E0"/>
    <!-- Tool -->
    <path d="M130 80 L150 60" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M60 140 C60 120, 100 120, 100 140 L90 200 L70 200 Z" fill="#4A5568"/>
  </g>
  
  <!-- Sheep -->
  <g fill="#F7FAFC">
    <!-- Body -->
    <ellipse cx="170" cy="170" rx="35" ry="25"/>
    <!-- Head -->
    <circle cx="140" cy="160" r="15"/>
    <!-- Legs -->
    <rect x="155" y="190" width="6" height="20" rx="2"/>
    <rect x="185" y="190" width="6" height="20" rx="2"/>
  </g>
  
  <!-- Ground -->
  <path d="M40 210 L200 210" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
</svg>