<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="booth-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="curtain-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Ambient Environment / Voting Booth Structure -->
  <path d="M 60 70 L 180 70 L 190 200 L 50 200 Z" fill="url(#curtain-grad)" />
  
  <!-- Polling Booth Back Wall -->
  <rect x="75" y="80" width="90" height="120" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Official Ballot Box on Stand -->
  <g transform="translate(140, 115)">
    <!-- Stand -->
    <rect x="15" y="45" width="10" height="40" fill="#475569" rx="2" />
    <path d="M 5 85 L 35 85 L 40 90 L 0 90 Z" fill="#334155" />
    <!-- Box Body -->
    <rect x="-2" y="10" width="44" height="35" rx="4" fill="#0284c7" />
    <rect x="-2" y="10" width="44" height="35" rx="4" fill="#38bdf8" fill-opacity="0.2" />
    <!-- Box Lid -->
    <rect x="-5" y="6" width="50" height="6" rx="2" fill="#0369a1" />
    <!-- Slot -->
    <rect x="12" y="3" width="16" height="3" rx="1.5" fill="#0f172a" />
    <!-- Accent Star/Symbol (Abstract civic design) -->
    <circle cx="20" cy="25" r="6" fill="#f59e0b" fill-opacity="0.8" />
    <path d="M 20 20 L 21.5 23.5 L 25 24 L 22.5 26.5 L 23 30 L 20 28.5 L 17 30 L 17.5 26.5 L 15 24 L 18.5 23.5 Z" fill="#fef08a" transform="translate(20,25) scale(0.6) translate(-20,-25)" />
  </g>

  <!-- Desk inside booth -->
  <rect x="70" y="150" width="100" height="8" rx="2" fill="#475569" />

  <!-- Character: Citizen Voting (Active Scene) -->
  <g transform="translate(15, 30)">
    <!-- Body & Torso -->
    <path d="M 65 110 C 60 100 70 85 85 85 L 105 85 C 120 85 130 100 125 110 L 130 170 L 60 170 Z" fill="#10b981" />
    <!-- Jacket collar/details -->
    <path d="M 85 85 L 95 105 L 105 85" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    
    <!-- Head & Hair -->
    <circle cx="95" cy="62" r="18" fill="#fcd34d" />
    <!-- Hair style -->
    <path d="M 77 62 C 77 50 85 43 95 43 C 105 43 113 50 113 62 C 113 64 112 66 112 66 C 112 66 108 55 95 55 C 82 55 78 66 78 66 C 78 66 77 64 77 62 Z" fill="#334155" />

    <!-- Face Expression (Focused, proud, participating) -->
    <circle cx="89" cy="60" r="1.5" fill="#1e293b" />
    <circle cx="101" cy="60" r="1.5" fill="#1e293b" />
    <path d="M 93 68 Q 95 71 97 68" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Raised Arm holding Ballot Paper -->
    <g transform="translate(105, 90)">
      <!-- Arm -->
      <path d="M 0 0 C 15 -10 25 -5 30 -20" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
      <!-- Hand -->
      <circle cx="30" cy="-20" r="4" fill="#fcd34d" />
      <!-- Ballot Paper dropping into slot -->
      <g transform="translate(25, -35) rotate(15)">
        <rect x="0" y="0" width="16" height="22" rx="2" fill="#ffffff" filter="url(#glow)" />
        <line x1="3" y1="5" x2="13" y2="5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
        <line x1="3" y1="10" x2="10" y2="10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
        <circle cx="5" cy="16" r="2" fill="#10b981" />
        <polyline points="7,15 9,17 13,13" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Other Arm resting/confident -->
    <path d="M 75 100 C 65 110 65 125 70 135" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" />
    <circle cx="70" cy="135" r="3.5" fill="#fcd34d" />
  </g>

  <!-- Foreground Elements / Environmental Polish -->
  <!-- Privacy Curtains Sides -->
  <path d="M 0 0 L 50 0 L 40 240 L 0 240 Z" fill="#0f172a" fill-opacity="0.8" />
  <path d="M 240 0 L 190 0 L 200 240 L 240 240 Z" fill="#0f172a" fill-opacity="0.8" />

  <!-- Floor reflection/glow -->
  <ellipse cx="120" cy="210" rx="70" ry="12" fill="#38bdf8" fill-opacity="0.1" />

  <!-- Festive / Official Ambient Lights (Top) -->
  <circle cx="90" cy="30" r="2" fill="#fef08a" filter="url(#glow)" />
  <circle cx="150" cy="25" r="1.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="120" cy="40" r="2" fill="#fef08a" filter="url(#glow)" />

</svg>