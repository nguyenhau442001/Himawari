<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Graphic: Software Piracy / Counterfeit Physical Object Representation -->
  <g transform="translate(0, 0)">
    <!-- Official / Genuine Optical Disc (Subdued, in background / slightly tilted) -->
    <g transform="translate(95, 75) rotate(-15)">
      <!-- Disc Body -->
      <circle cx="35" cy="35" r="32" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
      <!-- Hologram sheen representation -->
      <path d="M35 3c17.67 0 32 14.33 32 32s-14.33 32-32 32a32 32 0 0 1-15-3.71L47 35H35z" fill="#434C5E" opacity="0.6"/>
      <!-- Center Hole -->
      <circle cx="35" cy="35" r="8" fill="#1A1D24"/>
      <circle cx="35" cy="35" r="4" fill="#2E3440"/>
    </g>

    <!-- Main Subject: Counterfeit / Bootleg Optical Disc (Front and center, marked with warning/unauthorized symbol) -->
    <g transform="translate(110, 105)">
      <!-- Disc Body -->
      <circle cx="35" cy="35" r="34" fill="#3B4252" stroke="#D08770" stroke-width="3"/>
      
      <!-- Counterfeit texture rings -->
      <circle cx="35" cy="35" r="26" fill="none" stroke="#4C566A" stroke-width="1.5" stroke-dasharray="4 2"/>
      <circle cx="35" cy="35" r="18" fill="none" stroke="#4C566A" stroke-width="1.5"/>

      <!-- Center Hub -->
      <circle cx="35" cy="35" r="8" fill="#1A1D24"/>
      <circle cx="35" cy="35" r="3" fill="#3B4252"/>

      <!-- Unauthorized / Warning Stamp overlay (Red/Orange accent) -->
      <circle cx="35" cy="35" r="34" fill="#BF616A" opacity="0.15"/>
      
      <!-- Prohibition / Warning symbol on the disc -->
      <circle cx="53" cy="17" r="10" fill="#BF616A"/>
      <path d="M48 12l10 10M58 12l-10 10" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Packaging / Jewel Case opened or angled showing duplication context -->
    <g transform="translate(50, 90)">
      <!-- Jewel Case Back/Base -->
      <rect x="0" y="0" width="70" height="90" rx="4" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
      <!-- Case Inner Tray -->
      <rect x="6" y="6" width="58" height="78" rx="2" fill="#242933"/>
      <!-- Cover insert slipping out -->
      <path d="M-10 20 L50 10 L50 80 L-10 90 Z" fill="#3B4252" stroke="#EBCB8B" stroke-width="1.5" opacity="0.9"/>
      <!-- Faded unauthorized print lines on slip -->
      <line x1="5" y1="30" x2="35" y2="25" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="40" x2="40" y2="34" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Digital Duplication / Unauthorized Copying Vectors (Data streams / Matrix style falling lines) -->
    <g opacity="0.6">
      <line x1="85" y1="40" x2="85" y2="70" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
      <line x1="155" y1="50" x2="155" y2="85" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
      <line x1="175" y1="120" x2="175" y2="155" stroke="#EBCB8B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    </g>

    <!-- Prominent Warning Badge (Visualizing copyright infringement / illegal copy) -->
    <g transform="translate(155, 65)">
      <circle cx="0" cy="0" r="16" fill="#BF616A" stroke="#1A1D24" stroke-width="3"/>
      <!-- Exclamation mark / Unauthorized marker -->
      <path d="M0 -7v6M0 5v2" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>