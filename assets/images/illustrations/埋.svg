<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definition Context: 村民们把枯树枝埋在土里当肥料 (Villagers bury dead tree branches in the soil as fertilizer) -->
  <!-- Visualizing the exact physical object representing the noun/act of burial (埋): Dead branches embedded inside a cross-section of rich dark soil -->

  <!-- Soil Cross-Section / Underground Layer -->
  <path d="M 28 120 Q 70 115 120 120 Q 170 125 212 120 L 212 204 C 212 213 205 220 196 220 L 44 220 C 35 220 28 213 28 204 Z" fill="#2E241F"/>
  
  <!-- Soil texture and organic layers -->
  <path d="M 28 140 Q 80 135 130 142 Q 180 148 212 138" fill="none" stroke="#3D3028" stroke-width="3" stroke-linecap="round"/>
  <path d="M 35 175 Q 90 180 150 172 Q 190 168 208 178" fill="none" stroke="#3D3028" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Soil particles / nutrients (Gold/Orange accent to highlight fertilizer aspect) -->
  <circle cx="65" cy="155" r="3" fill="#E6A15C" opacity="0.8"/>
  <circle cx="105" cy="190" r="2.5" fill="#E6A15C" opacity="0.7"/>
  <circle cx="160" cy="160" r="3.5" fill="#E6A15C" opacity="0.9"/>
  <circle cx="185" cy="200" r="2" fill="#E6A15C" opacity="0.8"/>
  <circle cx="85" cy="205" r="3" fill="#E6A15C" opacity="0.6"/>

  <!-- Underground Dead Tree Branches (Buried inside soil) -->
  <!-- Main branch trunk -->
  <path d="M 75 130 L 110 165 L 155 155 L 180 180" fill="none" stroke="#8C6747" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Branch details/bark texture -->
  <path d="M 95 145 L 85 160" fill="none" stroke="#5E432E" stroke-width="3" stroke-linecap="round"/>
  <!-- Secondary dead twig 1 -->
  <path d="M 110 165 L 90 190" fill="none" stroke="#705138" stroke-width="5" stroke-linecap="round"/>
  <!-- Secondary dead twig 2 -->
  <path d="M 140 158 L 145 190" fill="none" stroke="#705138" stroke-width="4" stroke-linecap="round"/>
  <!-- Small broken twig tip -->
  <path d="M 155 155 L 175 140" fill="none" stroke="#5E432E" stroke-width="4" stroke-linecap="round"/>

  <!-- Above Ground Surface Layer (Smooth grassy mound indicating ground level) -->
  <path d="M 28 120 C 60 110 100 105 120 105 C 140 105 180 110 212 120" fill="none" stroke="#4E6E5D" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Surface grass tufts -->
  <path d="M 60 113 L 57 103 L 64 109" fill="#588C73"/>
  <path d="M 90 108 L 91 97 L 97 105" fill="#588C73"/>
  <path d="M 150 110 L 153 98 L 158 107" fill="#588C73"/>
  <path d="M 185 115 L 189 104 L 193 113" fill="#588C73"/>

  <!-- Emerging Life / Sprout (Showing the result of the buried organic matter acting as fertilizer) -->
  <!-- Stem -->
  <path d="M 120 105 Q 120 85 112 70" fill="none" stroke="#588C73" stroke-width="4" stroke-linecap="round"/>
  <!-- Left Leaf -->
  <path d="M 116 83 C 105 78 95 85 98 92 C 102 96 112 92 116 83 Z" fill="#73B090"/>
  <!-- Right Leaf (Accent Orange/Gold to tie into semantic context of healthy growth/fertilizer) -->
  <path d="M 116 78 C 127 73 137 80 134 87 C 130 91 120 87 116 78 Z" fill="#E6A15C"/>
</svg>