<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <path d="M40 180 L200 180 L190 200 L50 200 Z" fill="#334155"/>
  <rect x="50" y="200" width="10" height="30" fill="#475569"/>
  <rect x="180" y="200" width="10" height="30" fill="#475569"/>
  
  <!-- Coffee Mugs -->
  <circle cx="80" cy="175" r="12" fill="#fb923c"/>
  <circle cx="160" cy="175" r="12" fill="#38bdf8"/>
  
  <!-- Person 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <path d="M10 25 Q20 35 30 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="3" fill="#78350f"/>
    <circle cx="28" cy="15" r="3" fill="#78350f"/>
    <path d="M0 40 L40 40 L35 90 L5 90 Z" fill="#fb923c"/>
  </g>
  
  <!-- Person 2 (Right) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="20" fill="#fde68a"/>
    <path d="M10 25 Q20 35 30 25" stroke="#78350f" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="3" fill="#78350f"/>
    <circle cx="28" cy="15" r="3" fill="#78350f"/>
    <path d="M0 40 L40 40 L35 90 L5 90 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Speech Bubbles (Visualizing Communication/Understanding) -->
  <path d="M100 80 Q120 60 140 80 T180 80" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="70" r="4" fill="#ec4899"/>
  <circle cx="140" cy="60" r="6" fill="#fbbf24"/>
  <circle cx="160" cy="70" r="4" fill="#10b981"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
</svg>