<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background terrain/foliage gradient -->
    <linearGradient id="terrainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    
    <!-- Soldier uniform/camouflage tones (Dark mode adapted) -->
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#319795" />
      <stop offset="100%" stop-color="#234E52" />
    </linearGradient>
    
    <!-- Focal orange glow for environment/accent -->
    <radialGradient id="focusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ED8936" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ED8936" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient background glow behind the action -->
  <circle cx="120" cy="130" r="80" fill="url(#focusGlow)"/>

  <!-- TERRAIN / HIDING ENVIRONMENT (Bushes & Terrain) -->
  <!-- Back terrain mound -->
  <path d="M 30,170 Q 70,120 130,135 T 220,165 L 220,200 L 30,200 Z" fill="#202A36"/>
  
  <!-- Foreground concealing bushes -->
  <path d="M 10,195 Q 25,140 60,155 Q 95,130 130,150 Q 165,125 195,150 Q 230,135 235,195 Z" fill="url(#terrainGrad)"/>
  
  <!-- Foliage details / texture -->
  <circle cx="50" cy="155" r="22" fill="#2D3748" opacity="0.6"/>
  <circle cx="90" cy="145" r="25" fill="#2D3748" opacity="0.7"/>
  <circle cx="150" cy="150" r="28" fill="#2D3748" opacity="0.6"/>
  <circle cx="185" cy="160" r="20" fill="#2D3748" opacity="0.5"/>

  <!-- SOLDIER CHARACTER (Action: Crouching / Hiding behind cover) -->
  <g transform="translate(10, 5)">
    <!-- Helmet -->
    <path d="M 95,85 C 90,75 110,65 125,65 C 140,65 155,75 150,85 Z" fill="#2C5282"/>
    <ellipse cx="123" cy="84" rx="28" ry="6" fill="#2A4365"/>

    <!-- Head / Face tucked down -->
    <circle cx="122" cy="94" r="11" fill="#CBD5E0"/>

    <!-- Torso (crouched, leaning forward) -->
    <path d="M 105,103 Q 120,100 135,108 L 140,135 Q 120,145 100,132 Z" fill="url(#uniformGrad)"/>

    <!-- Back-slung gear / Backpack blending into background -->
    <rect x="95" y="108" width="16" height="22" rx="4" transform="rotate(15 95 108)" fill="#1A202C"/>

    <!-- Arms holding position (Action interaction) -->
    <path d="M 130,112 L 150,122 L 145,132" fill="none" stroke="#234E52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Legs (crouched compact stance) -->
    <path d="M 105,132 Q 90,140 95,155 L 115,158" fill="none" stroke="#1A202C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 130,138 Q 140,150 130,160 L 110,160" fill="none" stroke="#1A202C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND OBSCURING BUSHES (Creating depth, cutting across the character to show "隱蔽" / hidden effect) -->
  <path d="M -10,210 Q 40,165 80,185 Q 130,155 170,180 Q 210,160 250,210 Z" fill="#1A202C"/>
  <path d="M 20,215 Q 70,175 120,200 Q 170,170 220,215 Z" fill="#14181F"/>
  
  <!-- High-contrast Accent Visual Elements (Focus on the hidden aspect) -->
  <!-- Subtle scanning / focal bracket elements (Modern UI/UX flat aesthetic, framing the concealed subject) -->
  <path d="M 75,90 L 75,75 L 90,75" fill="none" stroke="#ED8936" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 165,90 L 165,75 L 150,75" fill="none" stroke="#ED8936" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  
  <!-- Motion / Camouflage blending lines -->
  <path d="M 105,100 Q 115,95 125,100" fill="none" stroke="#ED8936" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
  <path d="M 115,105 Q 125,100 135,105" fill="none" stroke="#ED8936" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>

</svg>