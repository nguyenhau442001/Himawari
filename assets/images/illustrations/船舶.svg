<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Sky gradient (Dusk/Evening harbour atmosphere) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Water gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm golden glow for port lights and sunset haze -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Crane yellow gradient -->
    <linearGradient id="craneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Ship hull dark -->
    <linearGradient id="hullDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Ship hull red -->
    <linearGradient id="hullRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- ==================== SKY & BACKGROUND ==================== -->
  <rect width="240" height="130" fill="url(#skyGrad)"/>

  <!-- Distant mountains / breakwater -->
  <path d="M0 110 L40 95 L90 102 L140 90 L180 96 L240 85 L240 130 L0 130 Z" fill="#1e293b" opacity="0.8"/>

  <!-- Port background structures & warehouse -->
  <rect x="150" y="80" width="70" height="35" fill="#334155" rx="2"/>
  <polygon points="145,80 185,65 225,80" fill="#475569"/>
  <!-- Warehouse warm windows -->
  <rect x="160" y="90" width="8" height="12" fill="#fbbf24" opacity="0.8"/>
  <rect x="175" y="90" width="8" height="12" fill="#fbbf24" opacity="0.8"/>
  <rect x="190" y="90" width="8" height="12" fill="#fbbf24" opacity="0.8"/>
  <rect x="205" y="90" width="8" height="12" fill="#fbbf24" opacity="0.8"/>

  <!-- Large Harbor Cranes (Background context) -->
  <!-- Crane 1 -->
  <path d="M210 115 L215 50 L220 50 L218 115 Z" fill="url(#craneGrad)"/>
  <path d="M180 55 L235 55 L235 50 L180 50 Z" fill="url(#craneGrad)"/>
  <path d="M195 55 L210 80" stroke="#b45309" stroke-width="2"/>
  
  <!-- Crane 2 (Further left) -->
  <path d="M130 115 L135 60 L139 60 L136 115 Z" fill="url(#craneGrad)"/>
  <path d="M110 65 L155 65 L155 60 L110 60 Z" fill="url(#craneGrad)"/>

  <!-- ==================== WATER LAYER ==================== -->
  <rect y="125" width="240" height="115" fill="url(#waterGrad)"/>

  <!-- Subtle water reflection lines -->
  <path d="M30 145 Q 60 143, 90 145 T 150 145" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" fill="none"/>
  <path d="M100 175 Q 130 173, 160 175 T 220 175" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" fill="none"/>
  <path d="M20 205 Q 70 203, 120 205 T 220 205" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.1" fill="none"/>

  <!-- ==================== DOCK / PIER ==================== -->
  <path d="M0 120 L70 120 L90 140 L0 140 Z" fill="#475569"/>
  <rect x="0" y="115" width="75" height="7" fill="#64748b" rx="1"/>
  <!-- Bollards on dock -->
  <rect x="20" y="112" width="6" height="6" fill="#cbd5e1" rx="1"/>
  <rect x="50" y="112" width="6" height="6" fill="#cbd5e1" rx="1"/>
  <rect x="75" y="125" width="6" height="6" fill="#cbd5e1" rx="1"/>

  <!-- ==================== SHIPS & BOATS (船舶) ==================== -->
  
  <!-- Ship 1: Large Cargo Ship (Foreground Mid-Right) -->
  <g transform="translate(100, 110)">
    <!-- Reflection -->
    <ellipse cx="60" cy="45" rx="50" ry="6" fill="#38bdf8" opacity="0.15"/>
    <!-- Hull -->
    <path d="M10 35 L20 50 L100 50 L115 35 Z" fill="url(#hullRed)"/>
    <path d="M10 25 L15 35 L110 35 L115 25 Z" fill="url(#hullDark)"/>
    <!-- Containers stacked on deck -->
    <rect x="30" y="10" width="20" height="15" fill="#38bdf8" rx="1"/>
    <rect x="52" y="10" width="20" height="15" fill="#f59e0b" rx="1"/>
    <rect x="74" y="12" width="18" height="13" fill="#10b981" rx="1"/>
    <rect x="40" y="-3" width="18" height="13" fill="#ec4899" rx="1"/>
    <rect x="60" y="-3" width="18" height="13" fill="#3b82f6" rx="1"/>
    <!-- Superstructure (Bridge) -->
    <rect x="85" y="5" width="20" height="20" fill="#e2e8f0" rx="2"/>
    <rect x="90" y="0" width="10" height="5" fill="#94a3b8"/>
    <!-- Mast & Light -->
    <line x1="95" y1="0" x2="95" y2="-8" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="95" cy="-8" r="1.5" fill="#ef4444"/>
  </g>

  <!-- Ship 2: Medium Tugboat (Mid-Left) -->
  <g transform="translate(45, 125)">
    <!-- Reflection -->
    <ellipse cx="25" cy="30" rx="22" ry="4" fill="#38bdf8" opacity="0.15"/>
    <!-- Hull -->
    <path d="M5 20 L10 32 L45 32 L50 20 Z" fill="#1e3a8a"/>
    <path d="M5 12 L8 20 L47 20 L50 12 Z" fill="#f8fafc"/>
    <!-- Cabin -->
    <rect x="20" y="2" width="18" height="12" fill="#f59e0b" rx="2"/>
    <!-- Windows -->
    <rect x="23" y="5" width="4" height="5" fill="#0f172a" rx="1"/>
    <rect x="29" y="5" width="4" height="5" fill="#0f172a" rx="1"/>
    <!-- Funnel -->
    <rect x="26" y="-3" width="5" height="5" fill="#ef4444" rx="1"/>
    <!-- Mast -->
    <line x1="28" y1="-3" x2="28" y2="-9" stroke="#64748b" stroke-width="1"/>
    <circle cx="28" cy="-9" r="1" fill="#fef08a"/>
  </g>

  <!-- Ship 3: Small Fishing Boat / Sailboat (Foreground Left) -->
  <g transform="translate(15, 145)">
    <!-- Reflection -->
    <ellipse cx="20" cy="22" rx="18" ry="3" fill="#38bdf8" opacity="0.15"/>
    <!-- Hull -->
    <path d="M5 15 L10 24 L30 24 L35 15 Z" fill="#b45309"/>
    <!-- Cabin -->
    <rect x="15" y="7" width="12" height="8" fill="#e2e8f0" rx="1"/>
    <!-- Mast & Sail/Flag -->
    <line x1="12" y1="15" x2="12" y2="-5" stroke="#475569" stroke-width="1.5"/>
    <path d="M12 -5 L22 2 L12 7 Z" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Ship 4: Distant Cargo ship silhouette (Background Right) -->
  <g transform="translate(165, 108)" opacity="0.7">
    <path d="M5 15 L8 22 L55 22 L58 15 Z" fill="#475569"/>
    <rect x="15" y="5" width="12" height="10" fill="#64748b"/>
    <rect x="30" y="7" width="15" height="8" fill="#64748b"/>
  </g>


  <!-- ==================== FOREGROUND & CHARACTERS ==================== -->
  <!-- Pier railing and foreground observer characters enjoying the view -->
  
  <!-- Character 1: Woman leaning on railing -->
  <g transform="translate(50, 85)">
    <!-- Body / Jacket -->
    <path d="M 12 25 Q 15 35, 18 45 L 30 45 Q 26 35, 25 25 Z" fill="#ec4899"/>
    <!-- Head & Hair -->
    <circle cx="20" cy="14" r="7" fill="#fcd34d"/>
    <path d="M 13 14 C 13 8, 27 8, 27 14 C 27 18, 23 20, 20 20 C 16 20, 13 18, 13 14 Z" fill="#1e293b"/>
    <!-- Arm resting on rail -->
    <path d="M 15 28 L 5 32" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <circle cx="4" cy="32" r="3" fill="#fcd34d"/>
  </g>

  <!-- Character 2: Man pointing at the ships -->
  <g transform="translate(25, 82)">
    <!-- Body / Sweater -->
    <path d="M 10 28 Q 14 38, 15 48 L 26 48 Q 23 38, 22 28 Z" fill="#38bdf8"/>
    <!-- Head & Hair -->
    <circle cx="18" cy="16" r="7" fill="#fcd34d"/>
    <path d="M 11 15 C 11 10, 25 10, 25 15 Z" fill="#334155"/>
    <!-- Pointing Arm -->
    <path d="M 14 30 L 28 24" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="29" cy="24" r="2.5" fill="#fcd34d"/>
  </g>

  <!-- Pier Railing foreground element -->
  <path d="M0 115 L95 115" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="15" y1="115" x2="15" y2="132" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="45" y1="115" x2="45" y2="135" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="75" y1="115" x2="75" y2="138" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Warm Harbor Light Post (Atmosphere) -->
  <line x1="90" y1="125" x2="90" y2="75" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 85 75 L 95 75 L 90 70 Z" fill="#cbd5e1"/>
  <!-- Light Glow Cone -->
  <polygon points="90,76 60,135 120,135" fill="url(#glowGrad)" style="mix-blend-mode: screen;" pointer-events="none"/>
  <circle cx="90" cy="76" r="4" fill="#fef08a"/>

  <!-- Little seagulls in the sky -->
  <path d="M 140 45 Q 145 38, 150 45 Q 155 38, 160 45" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 110 30 Q 114 25, 118 30 Q 122 25, 126 30" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 170 35 Q 174 30, 178 35 Q 182 30, 186 35" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

</svg>