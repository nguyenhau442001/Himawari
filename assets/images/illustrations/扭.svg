<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Stairs structure representing "下楼梯" (Going down stairs) -->
    <g fill="#2A2F3D" stroke="#3A4254" stroke-width="2">
      <rect x="20" y="140" width="60" height="40" rx="2"/>
      <rect x="80" y="160" width="60" height="40" rx="2"/>
      <rect x="140" y="180" width="80" height="40" rx="2"/>
    </g>

    <!-- Leg and Ankle twisting animation / focus (扭/trẹo) -->
    <!-- Lower Leg -->
    <path d="M 115 80 L 125 130" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Shoe / Foot angled sideways to show sprain/twist -->
    <g transform="translate(130, 145) rotate(-35)">
      <!-- Foot / Sneaker -->
      <path d="M -15 -8 L 25 -8 C 32 -8 38 -2 38 6 L 38 12 L -20 12 C -24 12 -26 4 -20 0 Z" fill="#FF5722"/>
      <path d="M -20 10 L 38 10 L 38 16 L -20 16 Z" fill="#FFFFFF"/>
      <!-- Sock -->
      <path d="M -15 -18 L 5 -18 L 5 -8 L -15 -8 Z" fill="#94A3B8"/>
    </g>

    <!-- Joint Pain / Twist Indicator (Dynamic glowing accent arcs around ankle) -->
    <path d="M 112 125 A 12 12 0 0 1 128 120" stroke="#FFC107" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 132 135 A 12 12 0 0 1 116 140" stroke="#FFC107" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Motion / Pain Sparkles -->
    <path d="M 145 110 L 153 102" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <path d="M 152 115 L 160 115" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <path d="M 100 115 L 92 107" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>