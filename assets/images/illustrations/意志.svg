<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Mountain/Path background representing difficulty -->
    <path d="M 60 170 L 120 110 L 180 170 Z" fill="#252A34" opacity="0.6"/>
    
    <!-- Central Physical Object: A glowing, forged steel anvil with a glowing core and a strong hammer striking down, symbolizing forged willpower, unyielding strength and determination -->
    <!-- Anvil Base -->
    <path d="M 90 175 L 150 175 L 140 195 L 100 195 Z" fill="#4F5D75"/>
    <rect x="105" y="155" width="30" height="20" fill="#6C7A89"/>
    
    <!-- Anvil Body -->
    <path d="M 80 135 C 80 135, 110 130, 120 135 C 130 140, 160 130, 165 130 C 170 130, 175 135, 170 145 C 165 155, 150 155, 140 155 L 100 155 C 90 155, 82 145, 80 135 Z" fill="#95A5A6"/>
    <path d="M 95 135 L 145 135 L 140 155 L 100 155 Z" fill="#BDC3C7"/>

    <!-- Sparks of determination/effort -->
    <circle cx="120" cy="120" r="4" fill="#FFB703"/>
    <circle cx="100" cy="115" r="3" fill="#FB8500"/>
    <circle cx="140" cy="115" r="3" fill="#FB8500"/>
    <path d="M 120 105 L 122 112 L 128 110 L 123 115 L 126 121 L 120 117 L 114 121 L 117 115 L 112 110 L 118 112 Z" fill="#FFB703"/>

    <!-- Strong Vertical Pillar of Energy/Will cutting upward through resistance -->
    <rect x="114" y="60" width="12" height="70" rx="6" fill="url(#willGradient)" />
    <circle cx="120" cy="60" r="10" fill="#FFB703" filter="drop-shadow(0px 0px 8px #FB8500)"/>

    <!-- Defiant upward vector arrow formed cleanly -->
    <path d="M 120 40 L 105 60 L 135 60 Z" fill="#FFB703"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="willGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FB8500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFB703" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>