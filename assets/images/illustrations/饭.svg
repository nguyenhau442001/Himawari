<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Steam / Wafting warmth (representing "rice still remains/fresh") -->
    <path d="M95 65 C90 55, 100 45, 95 35" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M120 60 C115 48, 125 40, 120 28" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M145 65 C150 55, 140 45, 145 35" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Chopsticks resting across -->
    <path d="M75 92 L170 108" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 98 L165 114" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>

    <!-- Bowl Rim (Elliptical Opening) -->
    <ellipse cx="120" cy="115" rx="75" ry="25" fill="#334155" stroke="#64748B" stroke-width="3"/>
    
    <!-- Bowl Interior (Showing "a little left" - partial filling at the bottom) -->
    <ellipse cx="120" cy="117" rx="65" ry="18" fill="#1E293B"/>

    <!-- Rice pile (partial, illustrating "饭还剩一点" - a small mound at the center bottom) -->
    <ellipse cx="120" cy="120" rx="38" ry="10" fill="#F1F5F9"/>
    <path d="M 82 120 Q 120 102 158 120 Q 120 130 82 120 Z" fill="#FFFFFF"/>
    
    <!-- Rice grain texture details (stylized small dots/strokes for cooked rice) -->
    <ellipse cx="108" cy="118" rx="4" ry="2" fill="#E2E8F0" transform="rotate(-15 108 118)"/>
    <ellipse cx="125" cy="116" rx="4.5" ry="2" fill="#E2E8F0" transform="rotate(10 125 116)"/>
    <ellipse cx="135" cy="121" rx="4" ry="2" fill="#E2E8F0" transform="rotate(-5 135 131)"/>
    <ellipse cx="115" cy="123" rx="4" ry="2" fill="#E2E8F0" transform="rotate(25 115 123)"/>

    <!-- Bowl Body (Outer curved surface) -->
    <path d="M 45 115 C 45 165, 80 185, 120 185 C 160 185, 195 165, 195 115 Z" fill="#475569" stroke="#64748B" stroke-width="3"/>
    
    <!-- Bowl Base / Foot -->
    <path d="M 95 185 L 95 195 C 95 198, 100 200, 120 200 C 140 200, 145 198, 145 195 L 145 185 Z" fill="#334155"/>
    
    <!-- Highlight on bowl for modern glossy flat look -->
    <path d="M 54 125 C 50 145, 60 165, 75 175" stroke="#64748B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>