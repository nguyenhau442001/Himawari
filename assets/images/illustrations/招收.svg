<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/beam for focal center -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Iconic Physical Object/Scene representing "招收" (Recruitment/Enrollment Hub) -->
  <g transform="translate(0, 5)">
    <!-- Desk / Reception Counter -->
    <path d="M 60,140 L 180,140 L 195,175 L 45,175 Z" fill="#2E3646"/>
    <path d="M 40,135 L 200,135 L 180,140 L 60,140 Z" fill="#3E495E"/>
    <!-- Desk Accent Light Line -->
    <line x1="68" y1="140" x2="172" y2="140" stroke="#FFA000" stroke-width="2" stroke-linecap="round"/>

    <!-- Open Application Folder / Document (Symbolizing Recruitment/Enrollment) -->
    <!-- Folder Back -->
    <path d="M 85,95 L 115,95 L 125,105 L 155,105 C 160,105 165,110 165,115 L 165,145 C 165,150 160,155 155,155 L 85,155 C 80,155 75,150 75,145 L 75,105 C 75,100 80,95 85,95 Z" fill="#3A4454"/>
    
    <!-- Papers inside -->
    <rect x="85" y="105" width="70" height="45" rx="3" fill="#E8ECEF"/>
    
    <!-- Abstract text lines on paper -->
    <line x1="93" y1="115" x2="135" y2="115" stroke="#A0AAB8" stroke-width="3" stroke-linecap="round"/>
    <line x1="93" y1="125" x2="147" y2="125" stroke="#A0AAB8" stroke-width="3" stroke-linecap="round"/>
    <line x1="93" y1="135" x2="120" y2="135" stroke="#A0AAB8" stroke-width="3" stroke-linecap="round"/>

    <!-- Folder Front Cover -->
    <path d="M 75,115 L 165,115 L 165,148 C 165,153 160,158 155,158 L 85,158 C 80,158 75,153 75,148 Z" fill="#4B566D"/>

    <!-- Acceptance / Selection Badge (Golden checkmark seal representing successful enrollment/recruitment) -->
    <circle cx="145" cy="132" r="14" fill="#FFC107"/>
    <circle cx="145" cy="132" r="11" fill="#FFA000"/>
    <polyline points="139,132 143,136 151,127" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hand placing/accepting documents (Recruitment action) -->
    <!-- Arm -->
    <path d="M 160,185 L 185,150 C 190,143 185,135 178,138 L 155,148 Z" fill="#E0A96D"/>
    <!-- Cuff / Sleeve -->
    <path d="M 175,163 L 192,141 L 198,146 L 181,170 Z" fill="#3B82F6"/>
    <!-- Hand / Fingers -->
    <path d="M 155,148 C 152,149 148,152 145,155 C 148,157 152,157 155,155 Z" fill="#E0A96D"/>

    <!-- Incoming Candidate Profile Icon (Floating above folder indicating incoming applicants) -->
    <circle cx="120" cy="65" r="16" fill="#3B82F6"/>
    <!-- Person Head -->
    <circle cx="120" cy="61" r="7" fill="#FFFFFF"/>
    <!-- Person Body/Shoulders -->
    <path d="M 106,78 C 106,72 112,70 120,70 C 128,70 134,72 134,78 Z" fill="#FFFFFF"/>

    <!-- Directional Arrow pointing inward (Admission / Intake) -->
    <path d="M 120,25 L 120,48" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    <polyline points="113,41 120,49 127,41" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>