<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Buildings Gradient -->
    <linearGradient id="bldg-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Neon Glows -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Urban Background & Cityscape -->
  <!-- Far background buildings -->
  <rect x="15" y="60" width="35" height="100" fill="#1e293b" opacity="0.6"/>
  <rect x="55" y="40" width="45" height="120" fill="#334155" opacity="0.5"/>
  <rect x="105" y="70" width="30" height="90" fill="#1e293b" opacity="0.7"/>
  <rect x="140" y="50" width="50" height="110" fill="#334155" opacity="0.4"/>
  <rect x="195" y="65" width="30" height="95" fill="#1e293b" opacity="0.6"/>

  <!-- Glowing Windows in background -->
  <g fill="#fbbf24" opacity="0.6">
    <rect x="62" y="50" width="6" height="8" rx="1"/>
    <rect x="74" y="50" width="6" height="8" rx="1"/>
    <rect x="62" y="65" width="6" height="8" rx="1"/>
    <rect x="74" y="65" width="6" height="8" rx="1"/>
    <rect x="150" y="60" width="8" height="10" rx="1"/>
    <rect x="165" y="60" width="8" height="10" rx="1"/>
    <rect x="150" y="80" width="8" height="10" rx="1"/>
    <rect x="165" y="80" width="8" height="10" rx="1"/>
  </g>

  <!-- Neo-futuristic Billboard Signage (Abstract shapes, NO TEXT) -->
  <rect x="90" y="30" width="60" height="20" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
  <path d="M 100 40 L 120 40 M 130 35 L 145 45" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)"/>

  <!-- Street Bridge / Elevated Walkway structure -->
  <path d="M 0 110 L 240 110 L 240 120 L 0 120 Z" fill="#475569"/>
  <rect x="0" y="115" width="240" height="2" fill="#94a3b8"/>
  <!-- Walkway pillars -->
  <rect x="40" y="120" width="8" height="40" fill="#334155"/>
  <rect x="120" y="120" width="8" height="40" fill="#334155"/>
  <rect x="200" y="120" width="8" height="40" fill="#334155"/>

  <!-- Pedestrian Character on Elevated Walkway (Context) -->
  <g transform="translate(130, 92)">
    <!-- Body/Coat -->
    <path d="M 10 10 L 18 25 L 12 27 L 6 15 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="12" cy="5" r="4" fill="#fbcfe8"/>
    <!-- Scarf -->
    <path d="M 8 8 Q 12 11 16 8 L 15 11 Q 12 13 9 11 Z" fill="#ef4444"/>
    <!-- Legs walking -->
    <line x1="10" y1="25" x2="7" y2="33" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="25" x2="17" y2="33" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN ROADWAY -->
  <rect x="0" y="150" width="240" height="90" fill="#0f172a"/>
  
  <!-- Road Surface & Markings -->
  <path d="M 0 195 Q 120 185 240 195" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="12,12" opacity="0.8"/>
  <path d="M 0 165 Q 120 155 240 165" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 0 225 Q 120 215 240 225" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- TRAFFIC FLOW LAYER (川流不息 - Continuous stream of vehicles) -->

  <!-- Light Streaks / Motion Blur Background -->
  <path d="M 10 180 L 90 180" stroke="#ef4444" stroke-width="2" opacity="0.5" stroke-linecap="round" filter="url(#neon-glow)"/>
  <path d="M 130 170 L 220 170" stroke="#f59e0b" stroke-width="2" opacity="0.5" stroke-linecap="round" filter="url(#neon-glow)"/>
  <path d="M 40 210 L 150 210" stroke="#38bdf8" stroke-width="2" opacity="0.5" stroke-linecap="round" filter="url(#neon-glow)"/>
  <path d="M 80 200 L 190 200" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" filter="url(#neon-glow)"/>

  <!-- Vehicle 1: Modern Sedan (Moving Right) -->
  <g transform="translate(150, 195)">
    <!-- Car Body -->
    <path d="M 5 10 L 15 2 L 45 2 L 55 10 L 60 18 L 0 18 Z" fill="#3b82f6"/>
    <!-- Windows & Roof -->
    <path d="M 18 3 L 24 10 L 42 10 L 44 3 Z" fill="#93c5fd"/>
    <!-- Wheels -->
    <circle cx="15" cy="18" r="5" fill="#0f172a"/>
    <circle cx="15" cy="18" r="2" fill="#cbd5e1"/>
    <circle cx="45" cy="18" r="5" fill="#0f172a"/>
    <circle cx="45" cy="18" r="2" fill="#cbd5e1"/>
    <!-- Headlights -->
    <circle cx="58" cy="13" r="2" fill="#fef08a" filter="url(#neon-glow)"/>
    <!-- Motion lines -->
    <line x1="-5" y1="12" x2="-15" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Vehicle 2: City Delivery Van (Moving Left) -->
  <g transform="translate(60, 160)">
    <!-- Van Body -->
    <path d="M 10 5 L 20 2 L 55 2 L 60 18 L 5 18 Z" fill="#f43f5e"/>
    <rect x="13" y="5" width="12" height="10" rx="1" fill="#fbcfe8"/>
    <!-- Wheels -->
    <circle cx="18" cy="18" r="5" fill="#0f172a"/>
    <circle cx="18" cy="18" r="2" fill="#cbd5e1"/>
    <circle cx="48" cy="18" r="5" fill="#0f172a"/>
    <circle cx="48" cy="18" r="2" fill="#cbd5e1"/>
    <!-- Headlights -->
    <circle cx="3" cy="13" r="2.5" stroke="#fef08a" stroke-width="1.5" fill="#ffffff" filter="url(#neon-glow)"/>
    <!-- Motion lines -->
    <line x1="65" y1="12" x2="75" y2="12" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Vehicle 3: Sleek Electric Car (Moving Right, foreground overlap) -->
  <g transform="translate(20, 205)">
    <!-- Car Body -->
    <path d="M 8 12 L 20 4 L 50 4 L 62 12 L 68 20 L 2 20 Z" fill="#10b981"/>
    <!-- Roof/Windshield -->
    <path d="M 23 5 L 30 11 L 48 11 L 52 5 Z" fill="#a7f3d0"/>
    <!-- Wheels -->
    <circle cx="18" cy="20" r="5" fill="#0f172a"/>
    <circle cx="18" cy="20" r="2" fill="#cbd5e1"/>
    <circle cx="54" cy="20" r="5" fill="#0f172a"/>
    <circle cx="54" cy="20" r="2" fill="#cbd5e1"/>
    <!-- Tail/Headlights -->
    <path d="M 66 14 L 68 16" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)"/>
    <circle cx="4" cy="15" r="2" fill="#fef08a" filter="url(#neon-glow)"/>
  </g>

  <!-- Vehicle 4: Scooter / Delivery Motorbike (weaving through traffic) -->
  <g transform="translate(130, 185)">
    <!-- Rider body -->
    <path d="M 12 4 L 16 12 L 10 14 Z" fill="#fb923c"/>
    <circle cx="13" cy="1" r="3" fill="#fbcfe8"/>
    <!-- Scooter frame -->
    <path d="M 8 15 L 18 12 L 22 20 L 4 20 Z" fill="#a855f7"/>
    <!-- Wheels -->
    <circle cx="8" cy="21" r="3" fill="#0f172a"/>
    <circle cx="20" cy="21" r="3" fill="#0f172a"/>
    <!-- Headlight beam -->
    <path d="M 23 18 L 35 15 L 35 23 Z" fill="#fef08a" opacity="0.4"/>
  </g>

  <!-- Foreground Atmospheric Elements & Street Lamps -->
  <g stroke="#64748b" stroke-width="2">
    <!-- Left Street Lamp Pole -->
    <line x1="15" y1="150" x2="15" y2="80"/>
    <path d="M 15 80 L 25 75" fill="none"/>
  </g>
  <!-- Lamp Glow -->
  <circle cx="25" cy="75" r="4" fill="#fef08a" filter="url(#neon-glow)"/>
  <path d="M 20 78 L 10 110 L 40 110 Z" fill="#fef08a" opacity="0.1"/>

  <g stroke="#64748b" stroke-width="2">
    <!-- Right Street Lamp Pole -->
    <line x1="225" y1="150" x2="225" y2="80"/>
    <path d="M 225 80 L 215 75" fill="none"/>
  </g>
  <!-- Lamp Glow -->
  <circle cx="215" cy="75" r="4" fill="#fef08a" filter="url(#neon-glow)"/>
  <path d="M 220 78 L 200 110 L 230 110 Z" fill="#fef08a" opacity="0.1"/>

</svg>