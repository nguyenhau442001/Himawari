<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/shadow for depth -->
  <ellipse cx="120" cy="195" rx="60" ry="12" fill="#000000" opacity="0.4"/>

  <!-- Cement Bag (Main Noun Object) -->
  <g transform="translate(65, 45)">
    <!-- Bag Body (Stacked 3D perspective / folded look) -->
    <!-- Back/Shadow fold of the bag -->
    <path d="M 25 15 L 85 15 L 100 135 L 10 135 Z" fill="#7C8792" />
    
    <!-- Main Front Face of the Bag -->
    <path d="M 20 20 L 90 20 L 100 140 L 10 140 Z" fill="#9DA9B4" />
    
    <!-- Top folded opening (tied nozzle area) -->
    <path d="M 35 20 L 75 20 L 70 8 L 40 8 Z" fill="#8895A1" />
    <path d="M 42 14 L 68 14" stroke="#6C7A86" stroke-width="3" stroke-linecap="round" />

    <!-- Bag creases & shading -->
    <path d="M 20 20 L 40 140" stroke="#7C8792" stroke-width="4" opacity="0.4" fill="none" />
    <path d="M 90 20 L 75 140" stroke="#B0BAC3" stroke-width="6" opacity="0.4" fill="none" />

    <!-- Brand / Label Area on Bag (Orange Accent) -->
    <rect x="25" y="45" width="60" height="55" rx="4" fill="#FFA500" />
    
    <!-- Graphic on Label (Stylized Trowel/Building icon inside label) -->
    <path d="M 42 65 L 72 65 L 64 82 L 50 82 Z" fill="#1A1D24" opacity="0.8"/>
    <rect x="54" y="82" width="4" height="8" fill="#1A1D24" opacity="0.8"/>

    <!-- Label text simulation lines (abstract icons) -->
    <rect x="33" y="53" width="44" height="4" rx="2" fill="#1A1D24" opacity="0.8"/>
    <rect x="37" y="107" width="36" height="6" rx="3" fill="#6C7A86" />
  </g>

  <!-- Spilled Cement / Mound at the base for clear context -->
  <g transform="translate(0, 10)">
    <!-- Soft grey powder pile -->
    <path d="M 50 175 Q 90 160 120 165 Q 170 160 190 175 Q 210 190 195 200 Q 120 210 45 200 Q 30 190 50 175 Z" fill="#65717D" />
    <!-- Highlight on powder -->
    <path d="M 80 174 Q 120 168 160 174 Q 130 182 80 174 Z" fill="#8895A1" opacity="0.6" />
    
    <!-- Construction Trowel (Tool associated with cement) -->
    <g transform="translate(140, 130) rotate(-15)">
      <!-- Trowel blade -->
      <path d="M 10 35 L 60 10 L 55 55 Z" fill="#E2E8F0" />
      <path d="M 10 35 L 60 10 L 35 32 Z" fill="#CBD5E1" /> <!-- Metallic sheen -->
      <!-- Metal neck/shank -->
      <path d="M 5 37 L -10 42" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none" />
      <!-- Wooden Handle -->
      <path d="M -10 42 C -20 45 -35 55 -40 60 C -45 65 -45 70 -40 75 C -35 80 -30 80 -25 75 C -20 70 -10 55 -5 50 Z" fill="#D97706" />
      <path d="M -10 42 L -5 50" stroke="#B45309" stroke-width="3" />
    </g>
  </g>
</svg>