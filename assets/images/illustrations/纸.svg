<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow/shadow for focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Main Object: Sheet of Paper (纸) with crisp folded corner and lines -->
  <g transform="translate(75, 45)">
    <!-- Back shadow/stack effect for realism -->
    <path d="M 12 12 L 78 12 L 90 24 L 90 138 L 12 138 Z" fill="#2A303C" opacity="0.5"/>
    
    <!-- Main Paper Body -->
    <path d="M 8 8 L 74 8 L 86 20 L 86 134 L 8 134 Z" fill="#F0F3F9"/>
    
    <!-- Folded Corner Triangle -->
    <path d="M 74 8 L 74 20 L 86 20 Z" fill="#D0D7DE"/>
    <path d="M 74 8 L 86 20 L 74 20 Z" fill="#B0B8C1"/>

    <!-- Subtle Content Lines (representing text on paper) -->
    <rect x="20" y="32" width="46" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="20" y="48" width="54" height="4" rx="2" fill="#E1E6ED"/>
    <rect x="20" y="64" width="40" height="4" rx="2" fill="#E1E6ED"/>
    <rect x="20" y="80" width="50" height="4" rx="2" fill="#E1E6ED"/>
    <rect x="20" y="96" width="30" height="4" rx="2" fill="#E1E6ED"/>
  </g>

  <!-- Accent Hand / Offering Gesture representing "请给我一张纸" context -->
  <g transform="translate(0, 10)">
    <!-- Sleek minimal hand offering/pointing towards the paper with gold/orange accent -->
    <path d="M 115 150 C 115 150 125 142 135 145 C 145 148 150 156 150 156 L 140 170 L 120 170 Z" fill="#F6AD55" opacity="0.85"/>
  </g>
</svg>