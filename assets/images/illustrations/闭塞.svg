<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Distant Mountain Range -->
  <path d="M0 180 L40 120 L80 160 L130 90 L180 150 L240 110 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M20 240 L70 140 L120 190 L160 130 L210 200 L240 240 Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>

  <!-- The Isolated Mountain Village -->
  <g transform="translate(80, 140)">
    <!-- Small Hut -->
    <path d="M10 40 L50 40 L50 70 L10 70 Z" fill="#fb923c"/>
    <path d="M5 40 L30 15 L55 40 Z" fill="#94a3b8"/>
    <rect x="20" y="50" width="10" height="20" fill="#0f172a"/>
    <circle cx="35" cy="55" r="2" fill="#fbbf24"/>
  </g>

  <!-- Winding Path leading to nowhere -->
  <path d="M120 210 C150 210 160 180 140 170" stroke="#475569" stroke-width="4" fill="none" stroke-dasharray="6 4"/>

  <!-- Character looking at the distance -->
  <g transform="translate(160, 160)">
    <circle cx="10" cy="10" r="8" fill="#f59e0b"/>
    <path d="M10 18 L10 35 M10 25 L2 20 M10 25 L18 20 M10 35 L5 50 M10 35 L15 50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Atmosphere: Fog/Isolation -->
  <ellipse cx="120" cy="180" rx="100" ry="30" fill="#38bdf8" opacity="0.05"/>
  
  <!-- Stars/Night Sky -->
  <circle cx="30" cy="30" r="1" fill="#f8fafc"/>
  <circle cx="200" cy="40" r="1.5" fill="#f8fafc"/>
  <circle cx="150" cy="20" r="1" fill="#f8fafc"/>
  <circle cx="50" cy="80" r="1" fill="#f8fafc"/>
  
  <!-- Moon -->
  <circle cx="200" cy="50" r="15" fill="#fbbf24" opacity="0.2"/>
</svg>