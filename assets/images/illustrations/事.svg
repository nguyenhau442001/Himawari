<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/context -->
  <circle cx="120" cy="120" r="70" fill="#242B38" />

  <!-- Physical Object representing an Event / Matter / "Sì" (Thứ, Việc) -->
  <!-- A sleek modern dossier / folder / document package with a highlighted active item tag representing a specific "matter" or "affair" -->
  
  <!-- Main Document Folder / File Body -->
  <g transform="translate(65, 55)">
    <!-- Back folder tab -->
    <path d="M 20 15 L 45 15 L 60 30 L 90 30 C 98 30 105 37 105 45 L 105 115 C 105 123 98 130 90 130 L 20 130 C 12 130 5 123 5 115 L 5 30 C 5 22 12 15 20 15 Z" fill="#3A4454"/>
    
    <!-- Inside papers -->
    <rect x="15" y="42" width="80" height="85" rx="4" fill="#E2E8F0"/>
    
    <!-- Document content lines -->
    <rect x="25" y="55" width="40" height="6" rx="3" fill="#94A3B8"/>
    <rect x="25" y="70" width="60" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="25" y="80" width="50" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="25" y="90" width="55" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Front folder cover -->
    <path d="M 10 38 L 100 38 C 106 38 111 43 111 49 L 111 120 C 111 126 106 131 100 131 L 10 131 C 4 131 -1 126 -1 120 L -1 49 C -1 43 4 38 10 38 Z" fill="#2B3441" opacity="0.95"/>
    <path d="M 10 38 L 100 38 C 106 38 111 43 111 49 L 111 120 C 111 126 106 131 100 131 L 10 131 C 4 131 -1 126 -1 120 L -1 49 C -1 43 4 38 10 38 Z" fill="none" stroke="#475569" stroke-width="2"/>
    
    <!-- Focus Accent: A distinct golden/orange bookmark tag representing the specific "Matter" (这件事) -->
    <path d="M 75 25 L 95 25 L 95 65 L 85 55 L 75 65 Z" fill="#F59E0B"/>
    
    <!-- Checkmark on the document / matter emblem -->
    <circle cx="55" cy="105" r="16" fill="#10B981"/>
    <path d="M 48 105 L 53 110 L 63 100" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>