<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Environment: Park setting -->
  <circle cx="200" cy="40" r="30" fill="#fbbf24" opacity="0.2"/>
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#10b981" opacity="0.3"/>
  
  <!-- Mother Character -->
  <g transform="translate(120, 120)">
    <path d="M-20 10 C -20 -10, -10 -20, 0 -20 C 10 -20, 20 -10, 20 10 L 20 80 L -20 80 Z" fill="#ec4899"/>
    <circle cx="0" cy="-30" r="15" fill="#fde68a"/>
    <path d="M-15 40 L -40 20 L -20 30" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 40 L 40 20 L 20 30" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Child Character -->
  <g transform="translate(120, 150)">
    <circle cx="0" cy="-10" r="10" fill="#fde68a"/>
    <path d="M-10 0 L -10 30 L 10 30 L 10 0 Z" fill="#38bdf8"/>
    <path d="M-5 30 L -5 50 L -15 50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 30 L 5 50 L 15 50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Protective Gesture: Shielding motion -->
  <path d="M80 100 C 60 80, 60 40, 120 40 C 180 40, 180 80, 160 100" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  
  <!-- Falling leaf/object (The threat) -->
  <path d="M180 20 L 190 30 L 180 40 L 170 30 Z" fill="#fb923c"/>
</svg>