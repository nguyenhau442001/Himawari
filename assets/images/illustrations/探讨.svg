<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Central Discussion Platform / Table (Object/Place representation for noun/concept) -->
    <!-- Glowing background aura representing research/discussion -->
    <circle cx="0" cy="15" r="55" fill="#FF9F43" opacity="0.12"/>
    <ellipse cx="0" cy="62" r="70" fill="#FF9F43" opacity="0.08"/>
    
    <!-- Central document/problem being discussed -->
    <g transform="translate(0, -10)">
      <rect x="-24" y="-28" width="48" height="60" rx="6" fill="#2D323F" stroke="#FF9F43" stroke-width="2.5"/>
      <line x1="-14" y1="-14" x2="14" y2="-14" stroke="#A0AAB2" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#A0AAB2" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-14" y1="10" x2="6" y2="10" stroke="#A0AAB2" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Magnifying glass examining the core issue (research aspect) -->
      <g transform="translate(14, 12)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#FF9F43" stroke-width="3.5"/>
        <line x1="11" y1="11" x2="22" y2="22" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Interlocking Speech Bubbles (representing dialogue/discussion) -->
    <!-- Left Bubble -->
    <g transform="translate(-48, -25)">
      <path d="M -26 -16 C -26 -24 -18 -30 -8 -30 L 16 -30 C 26 -30 32 -24 32 -16 L 32 4 C 32 12 26 18 16 18 L 4 18 L -6 28 L -4 18 L -8 18 C -18 18 -26 12 -26 4 Z" fill="#2E4A62" stroke="#4DA3FF" stroke-width="2.5"/>
      <line x1="-14" y1="-12" x2="20" y2="-12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
      <line x1="-14" y1="-2" x2="10" y2="-2" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- Right Bubble (Orange Accent) -->
    <g transform="translate(48, -5)">
      <path d="M 26 16 C 26 24 18 30 8 30 L -16 30 C -26 30 -32 24 -32 16 L -32 -4 C -32 -12 -26 -18 -16 -18 L -4 -18 L 6 -28 L 4 -18 L 8 -18 C 18 -18 26 -12 26 -4 Z" fill="#4D3522" stroke="#FF9F43" stroke-width="2.5"/>
      <line x1="-10" y1="-4" x2="14" y2="-4" stroke="#FFE5D0" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <line x1="-10" y1="6" x2="4" y2="6" stroke="#FFE5D0" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Connecting nodes/spark of collaboration above -->
    <circle cx="0" cy="-62" r="4" fill="#FF9F43"/>
    <path d="M -26 -41 C -18 -55 -10 -58 0 -62 C 10 -58 18 -55 26 -41" fill="none" stroke="#FF9F43" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
  </g>
</svg>