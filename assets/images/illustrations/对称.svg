<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Subtle Background Wall & Studio Elements -->
  <rect x="16" y="16" width="208" height="180" rx="16" fill="#1e293b"/>
  <!-- Ambient warm spotlight from top-right -->
  <circle cx="180" cy="50" r="80" fill="#f59e0b" opacity="0.08" filter="blur(20px)"/>
  
  <!-- Interior Desk/Workspace -->
  <rect x="16" y="160" width="208" height="36" fill="#0f172a" rx="4"/>
  <rect x="24" y="164" width="192" height="6" fill="#334155" rx="3"/>

  <!-- Character 1: Young Designer pointing and explaining (Left side) -->
  <g transform="translate(15, 60)">
    <!-- Body/Torso -->
    <path d="M 35 70 L 15 104 L 55 104 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="35" cy="42" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 21 38 C 21 28, 49 28, 49 38 C 49 42, 45 42, 43 36 C 39 30, 31 30, 27 36 C 25 42, 21 42, 21 38 Z" fill="#334155"/>
    <!-- Face Profile (Facing right) -->
    <path d="M 42 42 Q 46 45 42 48" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm pointing at the graphic -->
    <path d="M 35 65 L 55 58" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="58" cy="57" r="4" fill="#fed7aa"/>
  </g>

  <!-- Character 2: Curious Friend/Colleague observing (Right side) -->
  <g transform="translate(160, 65)">
    <!-- Body/Torso -->
    <path d="M 25 65 L 5 99 L 45 99 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="25" cy="37" r="13" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M 12 33 C 12 22, 38 22, 38 33 C 38 38, 30 38, 25 32 C 20 38, 12 38, 12 33 Z" fill="#1e1b4b"/>
    <!-- Arm resting/posing -->
    <path d="M 25 60 L 12 75" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
    <circle cx="10" cy="78" r="3.5" fill="#ffedd5"/>
  </g>

  <!-- Central Display Stand & Perfect Symmetric Graphic Object -->
  <g transform="translate(75, 45)">
    <!-- Stand/Easel Base -->
    <path d="M 25 120 L 45 120 L 35 85 Z" fill="#475569"/>
    <rect x="15" y="115" width="40" height="6" rx="3" fill="#64748b"/>

    <!-- Art Canvas/Board -->
    <rect x="-10" y="5" width="90" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Dotted Symmetry Axis Line -->
    <line x1="35" y1="5" x2="35" y2="95" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Detailed Symmetric Butterfly/Geometric Paper Art on Canvas -->
    <!-- Left Wing Complex Shape -->
    <path d="M 35 25 C 20 20, 5 35, 10 55 C 15 70, 25 75, 35 80 Z" fill="#f43f5e" opacity="0.9"/>
    <path d="M 35 35 C 25 32, 18 42, 22 55 C 25 62, 30 68, 35 72 Z" fill="#fb923c" opacity="0.8"/>
    <circle cx="22" cy="45" r="4" fill="#fef08a"/>

    <!-- Right Wing Complex Shape (Exact Mirror) -->
    <path d="M 35 25 C 50 20, 65 35, 60 55 C 55 70, 45 75, 35 80 Z" fill="#f43f5e" opacity="0.9"/>
    <path d="M 35 35 C 45 32, 52 42, 48 55 C 45 62, 40 68, 35 72 Z" fill="#fb923c" opacity="0.8"/>
    <circle cx="48" cy="45" r="4" fill="#fef08a"/>

    <!-- Central Body of the Graphic -->
    <ellipse cx="35" cy="52" rx="3" ry="25" fill="#1e293b"/>
    <circle cx="35" cy="27" r="3.5" fill="#1e293b"/>
  </g>

  <!-- Foreground Props on Desk -->
  <!-- Ruler / Measuring Tool (Symbolizing precision and symmetry) -->
  <g transform="translate(90, 162) rotate(-5)">
    <rect x="0" y="0" width="60" height="8" rx="2" fill="#fbbf24"/>
    <line x1="10" y1="0" x2="10" y2="4" stroke="#78350f" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="4" stroke="#78350f" stroke-width="1"/>
    <line x1="30" y1="0" x2="30" y2="6" stroke="#78350f" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="4" stroke="#78350f" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="4" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Coffee Cup / Creative Studio Vibe -->
  <g transform="translate(45, 150)">
    <rect x="0" y="4" width="16" height="18" rx="3" fill="#10b981"/>
    <path d="M 16 8 C 20 8, 20 18, 16 18" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 4 2 Q 8 -2 12 2" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- UI Frame Accent (Clean Rounded Border) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>