<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow -->
  <circle cx="120" cy="130" r="90" fill="url(#glow)" />

  <!-- Environment / Laboratory Terrarium Setup -->
  <!-- Main Glass Terrarium Outline -->
  <rect x="35" y="50" width="170" height="150" rx="12" fill="#334155" fill-opacity="0.2" stroke="#475569" stroke-width="3" />
  <!-- Terrarium highlight/shine -->
  <path d="M 45 60 L 45 180" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.2" />
  <path d="M 50 55 L 70 55" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.2" />

  <!-- Soil Bed at bottom -->
  <path d="M 37 170 Q 120 160 203 170 L 203 198 Q 120 202 37 198 Z" fill="url(#soilGrad)" />
  <!-- Little tufts of grass / plants in terrarium -->
  <path d="M 50 170 Q 55 155 62 170 M 58 170 Q 64 158 70 170" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <path d="M 180 170 Q 175 155 170 170 M 174 170 Q 168 158 162 170" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <!-- Rapid Multiplication / Reproduction Theme: Cute Hamsters/Rodents in 3 Stages/Sizes -->
  <!-- Adult Hamster (Left) -->
  <g transform="translate(60, 115)">
    <!-- Body -->
    <ellipse cx="20" cy="30" rx="18" ry="15" fill="#fbbf24" />
    <!-- Ears -->
    <circle cx="10" cy="18" r="4" fill="#f59e0b" />
    <circle cx="25" cy="17" r="4" fill="#f59e0b" />
    <!-- Eyes & Nose -->
    <circle cx="14" cy="27" r="1.5" fill="#1e293b" />
    <circle cx="21" cy="27" r="1.5" fill="#1e293b" />
    <ellipse cx="17" cy="30" rx="1.5" ry="1" fill="#e11d48" />
    <!-- Cheeks -->
    <circle cx="11" cy="31" r="2.5" fill="#fb923c" fill-opacity="0.6" />
    <!-- Paws -->
    <ellipse cx="14" cy="42" rx="3" ry="2" fill="#fde047" />
    <ellipse cx="26" cy="42" rx="3" ry="2" fill="#fde047" />
  </g>

  <!-- Growing Offspring Group (Center-Right, multiple emerging to show "fast reproduction") -->
  <!-- Medium Offspring 1 -->
  <g transform="translate(100, 130)">
    <ellipse cx="15" cy="25" rx="13" ry="11" fill="#fbbf24" />
    <circle cx="7" cy="16" r="3" fill="#f59e0b" />
    <circle cx="18" cy="15" r="3" fill="#f59e0b" />
    <circle cx="10" cy="23" r="1.2" fill="#1e293b" />
    <circle cx="16" cy="23" r="1.2" fill="#1e293b" />
    <ellipse cx="13" cy="26" rx="1" ry="0.8" fill="#e11d48" />
  </g>

  <!-- Medium Offspring 2 -->
  <g transform="translate(135, 125)">
    <ellipse cx="15" cy="25" rx="13" ry="11" fill="#fbbf24" />
    <circle cx="7" cy="16" r="3" fill="#f59e0b" />
    <circle cx="18" cy="15" r="3" fill="#f59e0b" />
    <circle cx="10" cy="23" r="1.2" fill="#1e293b" />
    <circle cx="16" cy="23" r="1.2" fill="#1e293b" />
    <ellipse cx="13" cy="26" rx="1" ry="0.8" fill="#e11d48" />
  </g>

  <!-- Tiny Newborn 1 -->
  <g transform="translate(115, 155)">
    <circle cx="10" cy="15" r="8" fill="#fde047" />
    <circle cx="5" cy="9" r="2" fill="#fbbf24" />
    <circle cx="13" cy="9" r="2" fill="#fbbf24" />
    <circle cx="8" cy="14" r="1" fill="#1e293b" />
    <circle cx="12" cy="14" r="1" fill="#1e293b" />
  </g>

  <!-- Tiny Newborn 2 -->
  <g transform="translate(155, 150)">
    <circle cx="10" cy="15" r="8" fill="#fde047" />
    <circle cx="5" cy="9" r="2" fill="#fbbf24" />
    <circle cx="13" cy="9" r="2" fill="#fbbf24" />
    <circle cx="8" cy="14" r="1" fill="#1e293b" />
    <circle cx="12" cy="14" r="1" fill="#1e293b" />
  </g>

  <!-- Tiny Newborn 3 (bursting with energy / rapid growth vibe) -->
  <g transform="translate(170, 135)">
    <circle cx="8" cy="12" r="6" fill="#fde047" />
    <circle cx="4" cy="7" r="1.5" fill="#fbbf24" />
    <circle cx="11" cy="7" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Action / Growth Speed Indicators (Dynamic Motion/Sparkles) -->
  <path d="M 90 100 Q 100 90 110 100" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 130 95 Q 140 80 150 95" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Sparkles representing fast multiplication/vitality -->
  <path d="M 125 110 L 128 115 L 133 118 L 128 121 L 125 126 L 122 121 L 117 118 L 122 115 Z" fill="#38bdf8" />
  <path d="M 75 90 L 77 93 L 80 95 L 77 97 L 75 100 L 73 97 L 70 95 L 73 93 Z" fill="#fbbf24" />
  <path d="M 165 115 L 167 118 L 170 120 L 167 122 L 165 125 L 163 122 L 160 120 L 163 118 Z" fill="#10b981" />

  <!-- Foreground Scientist / Observer Character Element (Peeking from side/bottom or holding a clipboard evaluating the rapid growth) -->
  <!-- Let's add a neat high-tech observation interface/magnifying glass or clipboard prop -->
  <g transform="translate(18, 90)">
    <!-- Clipboard base -->
    <rect x="0" y="0" width="22" height="28" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Clip -->
    <rect x="6" y="-3" width="10" height="5" rx="1" fill="#475569" />
    <!-- Graph lines representing rapid exponential growth curve -->
    <path d="M 4 20 L 9 15 L 14 17 L 18 8" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="18" cy="8" r="2.5" fill="#ec4899" />
  </g>

  <!-- Magnifying Glass hovering to inspect detail -->
  <g transform="translate(130, 65)">
    <circle cx="18" cy="18" r="14" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8" />
    <path d="M 8 28 L 0 36" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

</svg>