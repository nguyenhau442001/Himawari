<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Cityscape -->
  <path d="M20 200 L60 140 L100 180 L140 120 L180 160 L220 130 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- The Explosion (The "Bàofā" moment) -->
  <circle cx="120" cy="110" r="45" fill="#fb923c" opacity="0.3"/>
  <circle cx="120" cy="110" r="30" fill="#f59e0b"/>
  <path d="M120 70 L130 100 L160 100 L135 120 L145 150 L120 130 L95 150 L105 120 L80 100 L110 100 Z" fill="#fbbf24"/>
  
  <!-- Debris/Fragments -->
  <rect x="80" y="80" width="8" height="8" transform="rotate(20 84 84)" fill="#ec4899"/>
  <rect x="160" y="90" width="6" height="6" transform="rotate(-15 163 93)" fill="#38bdf8"/>
  <rect x="100" y="150" width="10" height="4" transform="rotate(45 105 152)" fill="#10b981"/>
  
  <!-- Character 1 (Running away) -->
  <g transform="translate(40, 160)">
    <circle cx="10" cy="10" r="8" fill="#f8fafc"/>
    <path d="M10 18 L10 35 M10 25 L20 30 M10 25 L0 30 M10 35 L15 50 M10 35 L5 50" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (Looking back in shock) -->
  <g transform="translate(180, 170)">
    <circle cx="10" cy="10" r="8" fill="#f8fafc"/>
    <path d="M10 18 L10 35 M10 25 L5 35 M10 25 L15 35 M10 35 L12 50 M10 35 L8 50" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Ground impact -->
  <ellipse cx="120" cy="200" rx="80" ry="10" fill="#0f172a" opacity="0.5"/>
</svg>