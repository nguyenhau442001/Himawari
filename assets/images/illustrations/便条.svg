<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="150" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- The Note (便条) -->
  <rect x="130" y="110" width="60" height="70" rx="4" fill="#fef3c7"/>
  <path d="M130 110 L190 110 L180 125 L130 125 Z" fill="#fde68a"/>
  <line x1="140" y1="135" x2="180" y2="135" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="145" x2="180" y2="145" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="155" x2="160" y2="155" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <circle cx="60" cy="170" r="15" fill="#fb923c"/>
  <rect x="75" y="165" width="5" height="10" rx="2" fill="#fb923c"/>
  
  <!-- Character: The person who left the note (walking away) -->
  <g transform="translate(40, 60)">
    <circle cx="20" cy="30" r="12" fill="#fde68a"/>
    <path d="M10 50 L15 90 M30 50 L35 90" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 60 L20 75 L35 60" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="40" width="20" height="30" rx="5" fill="#fbbf24"/>
  </g>
  
  <!-- Character: The person receiving the note (looking at it) -->
  <g transform="translate(140, 140)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <path d="M15 15 L17 17 M23 15 L25 17" stroke="#0f172a" stroke-width="2"/>
    <path d="M15 25 Q20 28 25 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="5" y="35" width="30" height="40" rx="5" fill="#38bdf8"/>
    <path d="M5 65 L0 90 M35 65 L40 90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Ambient light -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
</svg>