<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>

  <!-- Snowy Ground -->
  <path d="M0 200 Q120 190 240 205 V240 H0 Z" fill="#334155" />
  <path d="M0 210 Q120 205 240 215 V240 H0 Z" fill="#475569" />

  <!-- The Monument (Symbolizing the Union) -->
  <!-- Left Section -->
  <path d="M60 195 L55 60 L115 55 L118 100 L110 140 L115 195 Z" fill="#94a3b8" />
  <!-- Right Section (Separating/Falling) -->
  <path d="M125 195 L122 145 L130 105 L125 58 L185 65 L180 195 Z" fill="#64748b" transform="rotate(2, 125, 195) translate(5, 0)" />
  
  <!-- Cracks and Fragments -->
  <path d="M118 60 L110 100 L125 140 L115 195" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Falling Debris -->
  <rect x="110" y="70" width="8" height="8" rx="1" fill="#94a3b8" transform="rotate(15)" />
  <rect x="130" y="120" width="6" height="6" rx="1" fill="#475569" transform="rotate(-10)" />
  <rect x="115" y="160" width="10" height="5" rx="1" fill="#64748b" transform="rotate(45)" />
  <rect x="140" y="185" width="7" height="7" rx="1" fill="#94a3b8" />

  <!-- Distant Cityscape Silhouettes -->
  <path d="M0 200 L20 170 L40 185 L60 160 L80 190 M180 195 L200 175 L220 185 L240 165" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Street Lamp (Warm Glow) -->
  <rect x="30" y="120" width="2" height="80" fill="#0f172a" />
  <path d="M25 120 L37 120 L31 110 Z" fill="#0f172a" />
  <circle cx="31" cy="115" r="6" fill="#f59e0b" opacity="0.6" filter="url(#glow)" />
  <circle cx="31" cy="115" r="3" fill="#fbbf24" />

  <!-- Human Figures (Witnesses) -->
  <!-- Figure 1: Adult in long coat -->
  <g transform="translate(190, 185)">
    <path d="M0 0 Q-5 -10 -5 -25 Q0 -30 5 -25 Q5 -10 0 0" fill="#cbd5e1" />
    <circle cx="0" cy="-32" r="4" fill="#cbd5e1" />
    <!-- Scarf -->
    <path d="M-4 -26 Q0 -24 4 -26" fill="none" stroke="#ec4899" stroke-width="2" />
  </g>

  <!-- Figure 2: Child/Smaller figure -->
  <g transform="translate(210, 195)">
    <path d="M0 0 Q-4 -8 -4 -18 Q0 -22 4 -18 Q4 -8 0 0" fill="#94a3b8" />
    <circle cx="0" cy="-24" r="3" fill="#94a3b8" />
    <!-- Hat -->
    <path d="M-3 -25 Q0 -28 3 -25" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Atmospheric Elements (Snowflakes) -->
  <circle cx="40" cy="40" r="1" fill="#f1f5f9" opacity="0.5" />
  <circle cx="100" cy="20" r="1" fill="#f1f5f9" opacity="0.3" />
  <circle cx="160" cy="50" r="1" fill="#f1f5f9" opacity="0.6" />
  <circle cx="220" cy="30" r="1" fill="#f1f5f9" opacity="0.4" />
  <circle cx="80" cy="100" r="1" fill="#f1f5f9" opacity="0.2" />
  <circle cx="200" cy="120" r="1" fill="#f1f5f9" opacity="0.5" />

  <!-- Subtle highlight on the monument -->
  <path d="M60 65 L65 190" stroke="#f1f5f9" stroke-width="0.5" opacity="0.2" />
</svg>