<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Street Asphalt Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glowing Light Effect -->
    <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Urban Night Sky / Buildings Background -->
  <g id="cityscape" opacity="0.4">
    <rect x="15" y="40" width="30" height="100" fill="#334155" rx="2" />
    <rect x="55" y="20" width="35" height="120" fill="#475569" rx="2" />
    <rect x="150" y="30" width="40" height="110" fill="#334155" rx="2" />
    <rect x="198" y="50" width="28" height="90" fill="#475569" rx="2" />
    <!-- Building Windows -->
    <rect x="22" y="50" width="6" height="8" fill="#fbbf24" rx="1" />
    <rect x="33" y="50" width="6" height="8" fill="#fbbf24" rx="1" opacity="0.6"/>
    <rect x="65" y="35" width="8" height="10" fill="#38bdf8" rx="1" />
    <rect x="78" y="35" width="8" height="10" fill="#38bdf8" rx="1" />
    <rect x="65" y="55" width="8" height="10" fill="#38bdf8" rx="1" opacity="0.5"/>
    <rect x="160" y="45" width="8" height="10" fill="#fbbf24" rx="1" />
    <rect x="174" y="65" width="8" height="10" fill="#fbbf24" rx="1" />
  </g>

  <!-- Street / Road Surface -->
  <polygon points="0,140 240,140 240,240 0,240" fill="url(#roadGrad)" />

  <!-- Road Markings (Dotted Center Line) -->
  <line x1="120" y1="140" x2="120" y2="240" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10,10" opacity="0.8" />

  <!-- TRAFFIC JAM SCENE (堵塞 - Tắc nghẽn) -->

  <!-- 1. Red Car (Blocked in front) -->
  <g id="redCar" transform="translate(135, 145)">
    <!-- Car Body -->
    <path d="M 10 35 L 25 15 L 65 15 L 80 35 L 85 55 L 5 55 Z" fill="#ef4444" />
    <!-- Roof/Windows -->
    <path d="M 30 15 L 40 5 L 55 5 L 63 15 Z" fill="#b91c1c" />
    <polygon points="32,14 41,6 54,6 61,14" fill="#93c5fd" opacity="0.8" />
    <!-- Wheels -->
    <circle cx="25" cy="55" r="9" fill="#0f172a" />
    <circle cx="25" cy="55" r="4" fill="#94a3b8" />
    <circle cx="65" cy="55" r="9" fill="#0f172a" />
    <circle cx="65" cy="55" r="4" fill="#94a3b8" />
    <!-- Tail lights -->
    <rect x="3" y="38" width="4" height="8" fill="#f87171" rx="1" />
    <rect x="83" y="38" width="4" height="8" fill="#fef08a" rx="1" />
  </g>

  <!-- 2. Blue Taxi (Stuck directly behind red car, Driver looking frustrated) -->
  <g id="blueTaxi" transform="translate(60, 150)">
    <!-- Headlight beam projecting forward -->
    <path d="M 85 30 L 140 10 L 140 50 Z" fill="url(#headlightGlow)" />

    <!-- Car Body -->
    <path d="M 10 35 L 25 15 L 65 15 L 80 35 L 85 55 L 5 55 Z" fill="#3b82f6" />
    <!-- Roof/Windows -->
    <path d="M 30 15 L 40 5 L 55 5 L 63 15 Z" fill="#1d4ed8" />
    <polygon points="32,14 41,6 54,6 61,14" fill="#93c5fd" opacity="0.8" />
    
    <!-- Taxi Sign -->
    <rect x="42" y="0" width="12" height="5" fill="#facc15" rx="1" />

    <!-- Driver Character inside -->
    <g transform="translate(42, 8)">
      <!-- Head -->
      <circle cx="6" cy="6" r="6" fill="#fcd34d" />
      <!-- Frustrated expression / angled eyebrows -->
      <line x1="3" y1="4" x2="6" y2="5" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
      <line x1="7" y1="5" x2="10" y2="4" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
      <!-- Hands on steering wheel (implied lean) -->
    </g>

    <!-- Wheels -->
    <circle cx="25" cy="55" r="9" fill="#0f172a" />
    <circle cx="25" cy="55" r="4" fill="#94a3b8" />
    <circle cx="65" cy="55" r="9" fill="#0f172a" />
    <circle cx="65" cy="55" r="4" fill="#94a3b8" />
    <!-- Headlights -->
    <rect x="83" y="38" width="4" height="8" fill="#fef08a" rx="1" />
  </g>

  <!-- 3. Delivery Scooter (Weaving tight through the traffic jam) -->
  <g id="scooter" transform="translate(20, 165)">
    <!-- Scooter Body -->
    <path d="M 10 25 L 30 20 L 45 35 L 45 45 L 10 45 Z" fill="#10b981" />
    <!-- Delivery Box -->
    <rect x="5" y="10" width="18" height="18" fill="#f97316" rx="2" />
    <line x1="5" y1="19" x2="23" y2="19" stroke="#ea580c" stroke-width="2" />
    <!-- Rider -->
    <circle cx="32" cy="12" r="6" fill="#fcd34d" /> <!-- Helmet/Head -->
    <path d="M 28 18 L 38 28 L 32 35 Z" fill="#065f46" /> <!-- Body -->
    <!-- Wheels -->
    <circle cx="12" cy="48" r="7" fill="#0f172a" />
    <circle cx="40" cy="48" r="7" fill="#0f172a" />
    <!-- Handlebar -->
    <line x1="35" y1="20" x2="42" y2="15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 4. Pedestrian waiting patiently at crosswalk -->
  <g id="pedestrian" transform="translate(190, 140)">
    <!-- Head & Hair -->
    <circle cx="12" cy="14" r="7" fill="#fcd34d" />
    <path d="M 5 12 C 5 7, 19 7, 19 14 Z" fill="#475569" />
    <!-- Body (Coat & Scarf) -->
    <path d="M 7 21 L 17 21 L 20 45 L 4 45 Z" fill="#ec4899" />
    <path d="M 8 21 L 16 21 L 14 26 L 10 26 Z" fill="#f43f5e" /> <!-- Scarf -->
    <!-- Legs -->
    <line x1="9" y1="45" x2="9" y2="65" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="15" y1="45" x2="15" y2="65" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <!-- Hand holding phone / waiting gesture -->
    <circle cx="17" cy="32" r="3" fill="#fcd34d" />
  </g>

  <!-- Traffic Light Pole & Signal (Showing Red Light - symbolizing stoppage) -->
  <g id="trafficLight" transform="translate(180, 50)">
    <!-- Pole -->
    <rect x="8" y="20" width="4" height="75" fill="#64748b" />
    <!-- Housing -->
    <rect x="2" y="0" width="16" height="35" fill="#334155" rx="3" />
    <!-- Lights: Red (ON), Yellow (OFF), Green (OFF) -->
    <circle cx="10" cy="8" r="4" fill="#ef4444" />
    <circle cx="10" cy="17" r="4" fill="#334155" />
    <circle cx="10" cy="26" r="4" fill="#334155" />
    <!-- Glow around red light -->
    <circle cx="10" cy="8" r="7" fill="#ef4444" opacity="0.3" />
  </g>

  <!-- Atmospheric Elements: Streetlamp Glow -->
  <path d="M 0 0 L 240 0" stroke="#38bdf8" stroke-width="2" opacity="0.1" />

</svg>