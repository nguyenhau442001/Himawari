<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements -->
  <g opacity="0.3">
    <circle cx="120" cy="120" r="85" fill="none" stroke="#2D3340" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="120" cy="120" r="65" fill="none" stroke="#2D3340" stroke-width="1"/>
  </g>

  <!-- Central Physical Object: Modern Key/Portal representing "Opportunity" (机遇) -->
  <!-- Radiating light/energy rays behind the object -->
  <g opacity="0.8">
    <line x1="120" y1="45" x2="120" y2="30" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="172.5" y1="67.5" x2="183" y2="57" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="195" y1="120" x2="210" y2="120" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="172.5" y1="172.5" x2="183" y2="183" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="67.5" y1="67.5" x2="57" y2="57" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="120" x2="30" y2="120" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="67.5" y1="172.5" x2="57" y2="183" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Outer glow -->
  <circle cx="120" cy="120" r="42" fill="#FFB703" opacity="0.15"/>

  <!-- The Key (Physical Object representing access, timing, and opportunity) -->
  <g transform="translate(120, 120) rotate(-45)">
    <!-- Key Shaft -->
    <rect x="-6" y="-35" width="12" height="60" rx="3" fill="#E5E7EB"/>
    
    <!-- Key Head (Open Loop representing an open door/portal) -->
    <circle cx="0" cy="-42" r="20" fill="none" stroke="#FFB703" stroke-width="7"/>
    <circle cx="0" cy="-42" r="14" fill="#1A1D24"/>
    
    <!-- Key Teeth (Precision cuts indicating right moment/fit) -->
    <path d="M 6 10 L 18 10 L 18 17 L 12 17 L 12 24 L 6 24 Z" fill="#FFB703"/>
    
    <!-- Inner Highlight on Shaft -->
    <rect x="-2" y="-25" width="4" height="40" rx="1" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Sparkles / Accent highlights indicating dynamic moment of breakthrough -->
  <g fill="#FFB703">
    <!-- Top right star -->
    <path d="M 175 75 Q 175 85 185 85 Q 175 85 175 95 Q 175 85 165 85 Q 175 85 175 75 Z"/>
    <!-- Bottom left small star -->
    <path d="M 65 155 Q 65 161 71 161 Q 65 161 65 167 Q 65 161 59 161 Q 65 161 65 155 Z"/>
  </g>

</svg>