<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Mountain Trail Background -->
  <path d="M0 240 L60 140 L120 180 L180 120 L240 200 L240 240 Z" fill="#334155"/>
  <circle cx="180" cy="60" r="20" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Character: Exhausted Hiker -->
  <g transform="translate(120, 140)">
    <!-- Backpack -->
    <rect x="-15" y="20" width="30" height="40" rx="5" fill="#fb923c"/>
    <!-- Body -->
    <path d="M-10 20 L-5 80 L5 80 L10 20 Z" fill="#38bdf8"/>
    <!-- Arms (Hanging down) -->
    <path d="M-12 30 L-25 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M12 30 L25 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs (Bent) -->
    <path d="M-5 80 L-15 120" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 80 L15 120" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="15" fill="#fde68a"/>
    <!-- Exhaustion lines -->
    <path d="M15 5 L25 -5" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 10 L28 5" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes closed -->
    <path d="M-8 5 L-2 10 M2 10 L8 5" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Hiking Pole -->
  <line x1="90" y1="180" x2="80" y2="220" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Sweat droplets -->
  <circle cx="110" cy="130" r="2" fill="#38bdf8"/>
  <circle cx="105" cy="135" r="3" fill="#38bdf8"/>
  
  <!-- Ground/Rocks -->
  <ellipse cx="120" cy="230" rx="100" ry="10" fill="#0f172a" opacity="0.5"/>
</svg>