<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Glow -->
    <radialGradient id="light-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- UI/Blueprint glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light Effects -->
  <circle cx="120" cy="110" r="100" fill="url(#light-glow)" />
  <polygon points="110,0 200,0 160,240 70,240" fill="url(#window-light)" />

  <!-- Architectural Background Elements (Office/Studio) -->
  <g id="environment">
    <!-- Window Frame in Background -->
    <rect x="90" y="25" width="60" height="75" rx="4" fill="#334155" opacity="0.4" />
    <line x1="120" y1="25" x2="120" y2="100" stroke="#1e293b" stroke-width="2" />
    <line x1="90" y1="62" x2="150" y2="62" stroke="#1e293b" stroke-width="2" />

    <!-- Shelves & Plants in Background -->
    <rect x="25" y="45" width="45" height="4" rx="2" fill="#475569" opacity="0.6" />
    <path d="M35 45 Q37 35 42 35 Q47 35 49 45 Z" fill="#10b981" />
    <rect x="170" y="55" width="45" height="4" rx="2" fill="#475569" opacity="0.6" />
    <path d="M185 55 L190 42 L195 55 Z" fill="#38bdf8" />
  </g>

  <!-- Giant Project Blueprint / Shared Board on Large Table -->
  <g id="centerpiece-table">
    <!-- Table Base / Legs -->
    <path d="M55 195 L75 145 L165 145 L185 195 Z" fill="#0f172a" opacity="0.8" />
    <ellipse cx="120" cy="148" rx="65" ry="14" fill="#334155" />
    
    <!-- Big Blueprint Paper (Task successfully completed) -->
    <ellipse cx="120" cy="145" rx="52" ry="10" fill="#e2e8f0" />
    
    <!-- Abstract success charts / icons on blueprint -->
    <polyline points="95,147 105,142 115,146 130,138 145,144" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="130" cy="138" r="3" fill="#10b981" />
    <circle cx="105" cy="142" r="2" fill="#f59e0b" />
  </g>

  <!-- Central Action: Four Hands Assembled Together (齐心协力 Core Metaphor) -->
  <g id="united-hands" filter="url(#glow)">
    <!-- Golden Achievement Star/Spark at the center of hands -->
    <circle cx="120" cy="130" r="14" fill="#fbbf24" opacity="0.9" />
    <path d="M120 120 L122 127 L129 127 L123 131 L125 138 L120 134 L115 138 L117 131 L111 127 L118 127 Z" fill="#ffffff" />

    <!-- Hand 1: Top (Manager/Leader - Teal sleeve) -->
    <path d="M114 110 C114 110 117 122 120 126 C123 122 126 110 126 110 Z" fill="#f8fafc" />
    <path d="M110 100 L130 100 L128 112 L112 112 Z" fill="#0d9488" rx="2" />

    <!-- Hand 2: Bottom (Teammate 1 - Amber sleeve) -->
    <path d="M114 150 C114 150 117 138 120 134 C123 138 126 150 126 150 Z" fill="#fdedd6" />
    <path d="M110 155 L130 155 L128 148 L112 148 Z" fill="#ea580c" rx="2" />

    <!-- Hand 3: Left (Teammate 2 - Blue sleeve) -->
    <path d="M100 124 C100 124 112 127 116 130 C112 133 100 136 100 136 Z" fill="#f8fafc" />
    <path d="M90 120 L90 140 L102 138 L102 122 Z" fill="#2563eb" rx="2" />

    <!-- Hand 4: Right (Teammate 3 - Pink sleeve) -->
    <path d="M140 124 C140 124 128 127 124 130 C128 133 140 136 140 136 Z" fill="#fdedd6" />
    <path d="M150 120 L150 140 L138 138 L138 122 Z" fill="#db2777" rx="2" />
  </g>

  <!-- Expressive Characters Surrounding the Table -->
  <g id="characters">
    <!-- Character 1: Left (Excited Woman with Glasses) -->
    <g transform="translate(38, 95)">
      <!-- Body/Torso -->
      <path d="M12 45 C12 30 25 25 35 25 C45 25 58 30 58 45 L52 85 L18 85 Z" fill="#2563eb" />
      <!-- Head & Hair -->
      <circle cx="35" cy="18" r="14" fill="#fed7aa" />
      <path d="M21 16 C21 8 28 4 35 4 C42 4 49 8 49 16 C49 22 45 24 45 24 L25 24 C25 24 21 22 21 16 Z" fill="#334155" />
      <!-- Ponytail -->
      <path d="M47 14 C54 14 58 18 56 24 C52 24 47 20 47 14 Z" fill="#334155" />
      <!-- Face Expression (Happy/Smiling eyes) -->
      <path d="M29 18 Q31 15 33 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M37 18 Q39 15 41 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M32 23 Q35 26 38 23" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
      <!-- Raised arm reaching center -->
      <path d="M52 35 L75 38 L84 35" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="82" cy="35" r="4" fill="#fed7aa" />
    </g>

    <!-- Character 2: Right (Joyful Man with Hoodie) -->
    <g transform="translate(145, 95)">
      <!-- Body/Torso -->
      <path d="M15 45 C15 30 25 25 35 25 C45 25 55 30 55 45 L50 85 L20 85 Z" fill="#db2777" />
      <!-- Head & Hair -->
      <circle cx="35" cy="18" r="14" fill="#f8fafc" />
      <path d="M21 15 C23 6 30 4 38 4 C46 5 49 11 49 16 L21 15 Z" fill="#0f172a" />
      <!-- Face Expression -->
      <circle cx="31" cy="17" r="1.5" fill="#1e293b" />
      <circle cx="39" cy="17" r="1.5" fill="#1e293b" />
      <path d="M32 22 Q35 25 38 22" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
      <!-- Reaching arm -->
      <path d="M18 35 L-2 38 L-10 35" fill="none" stroke="#db2777" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-8" cy="35" r="4" fill="#f8fafc" />
    </g>

    <!-- Character 3: Foreground Left (Cheering Man) -->
    <g transform="translate(65, 135)">
      <!-- Head -->
      <circle cx="20" cy="15" r="13" fill="#fde047" /> <!-- stylized friendly tone -->
      <circle cx="20" cy="15" r="12" fill="#fed7aa" />
      <!-- Hair -->
      <path d="M9 14 C10 6 16 4 22 5 C28 6 31 11 31 15 L9 15 Z" fill="#78350f" />
      <!-- Face -->
      <path d="M15 14 Q17 12 19 14" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M21 14 Q23 12 25 14" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M17 19 Q20 22 23 19" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
      <!-- Torso -->
      <path d="M8 28 C8 24 15 22 20 22 C25 22 32 24 32 28 L30 65 L10 65 Z" fill="#0d9488" />
      <!-- Arm resting/supporting -->
      <path d="M28 32 L48 10" fill="none" stroke="#0d9488" stroke-width="7" stroke-linecap="round" />
      <circle cx="48" cy="9" r="3.5" fill="#fed7aa" />
    </g>

    <!-- Character 4: Foreground Right (Confident Woman) -->
    <g transform="translate(138, 135)">
      <!-- Head -->
      <circle cx="20" cy="15" r="12" fill="#fed7aa" />
      <!-- Hair Bob -->
      <path d="M8 12 C8 4 15 2 22 3 C29 4 32 10 32 22 L30 22 C28 14 24 12 20 12 C16 12 10 14 8 12 Z" fill="#ea580c" />
      <!-- Face -->
      <path d="M16 14 Q18 12 20 14" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M22 14 Q24 12 26 14" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M18 19 Q21 22 24 19" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
      <!-- Torso -->
      <path d="M8 28 C8 24 15 22 20 22 C25 22 32 24 32 28 L30 65 L10 65 Z" fill="#ea580c" />
      <!-- Arm supporting -->
      <path d="M12 32 L-8 10" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" />
      <circle cx="-8" cy="9" r="3.5" fill="#fed7aa" />
    </g>
  </g>

  <!-- Foreground Props for Real-World Depth -->
  <g id="desk-props">
    <!-- Coffee Mug on Table Edge -->
    <rect x="85" y="152" width="10" height="12" rx="2" fill="#f8fafc" />
    <path d="M95 155 C98 155 98 160 95 162" fill="none" stroke="#f8fafc" stroke-width="2" />
    <ellipse cx="90" cy="152" rx="5" ry="2" fill="#cbd5e1" />
    <!-- Steam -->
    <path d="M88 145 Q90 140 88 135" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Laptop showing completed task graph -->
    <path d="M135 155 L165 155 L170 168 L130 168 Z" fill="#64748b" />
    <path d="M137 128 L163 128 L165 155 L135 155 Z" fill="#0f172a" />
    <polyline points="142,148 148,142 154,146 160,135" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

    <!-- Confetti / Success Sparks floating -->
    <circle cx="70" cy="75" r="3" fill="#f59e0b" opacity="0.8" />
    <circle cx="175" cy="85" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="155" cy="65" r="2" fill="#ec4899" opacity="0.8" />
    <rect x="80" y="90" width="4" height="4" rx="1" fill="#10b981" transform="rotate(25 82 92)" opacity="0.8" />
    <rect x="135" y="75" width="5" height="3" rx="1" fill="#f59e0b" transform="rotate(-15 137 76)" opacity="0.8" />
  </g>
</svg>