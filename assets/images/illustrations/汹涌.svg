<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sea Waves -->
  <path d="M0 180 C 40 140, 80 220, 120 180 C 160 140, 200 220, 240 180 L 240 240 L 0 240 Z" fill="#2C3E50"/>
  <path d="M0 160 C 50 110, 100 210, 150 160 C 200 110, 250 210, 280 160 L 280 240 L 0 240 Z" fill="#34495E"/>
  
  <!-- Character interacting with the waves -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-10 20 L-10 60 L10 60 L10 20 Z" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#F39C12"/>
    <!-- Arms in dynamic motion -->
    <path d="M-15 25 L-40 10" stroke="#F39C12" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 25 L40 10" stroke="#F39C12" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Motion Lines for "汹涌" (Turbulence/Action) -->
  <path d="M40 130 Q 60 110 80 130" stroke="#F1C40F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M160 130 Q 180 110 200 130" stroke="#F1C40F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M100 100 Q 120 80 140 100" stroke="#F1C40F" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Spray/Splash effects -->
  <circle cx="50" cy="150" r="4" fill="#BDC3C7"/>
  <circle cx="190" cy="150" r="4" fill="#BDC3C7"/>
  <circle cx="120" cy="90" r="5" fill="#BDC3C7"/>
</svg>