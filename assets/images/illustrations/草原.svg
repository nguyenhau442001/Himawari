<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2433"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>

    <!-- Grass Layer 1 Gradient (Background Hills) -->
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E6930"/>
      <stop offset="100%" stop-color="#1E4620"/>
    </linearGradient>

    <!-- Grass Layer 2 Gradient (Foreground Plains) -->
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>

    <!-- Horse Gradient -->
    <linearGradient id="horseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="240" height="130" fill="url(#skyGrad)"/>

  <!-- Celestial / Warm Horizon Glow -->
  <circle cx="180" cy="90" r="40" fill="#FFA726" opacity="0.15" filter="blur(10px)"/>
  <circle cx="180" cy="90" r="16" fill="#FFE082" opacity="0.9"/>

  <!-- Distant Rolling Hills (草原 background) -->
  <path d="M0 120 Q60 90 130 110 T240 100 L240 140 L0 140 Z" fill="url(#hillGrad1)"/>

  <!-- Foreground Vast Steppe / Grassland (草原 foreground) -->
  <path d="M0 130 Q80 100 240 120 L240 240 L0 240 Z" fill="url(#hillGrad2)"/>

  <!-- Stylized Grass Blades / Texture -->
  <path d="M30 160 L32 148 M34 162 L37 150 M70 180 L72 168 M190 175 L188 162 M193 177 L196 165" stroke="#81C784" stroke-width="2" stroke-linecap="round"/>

  <!-- Galloping Horse (骏马在草原上奔驰 - Contextual Visual) -->
  <g transform="translate(60, 115) scale(0.85)">
    <!-- Motion dust/wind trail -->
    <path d="M -15 35 Q -5 32 10 38" stroke="#A5D6A7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M -8 40 Q 2 38 15 44" stroke="#A5D6A7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Tail -->
    <path d="M -4 14 Q -14 18 -18 28 Q -10 24 -4 14 Z" fill="#E65100"/>

    <!-- Hind Legs (Dynamic running pose) -->
    <path d="M 4 22 L -2 40 L 4 42 L 8 28 Z" fill="url(#horseGrad)"/>
    <path d="M 12 24 L 18 39 L 24 38 L 16 23 Z" fill="url(#horseGrad)"/>

    <!-- Body -->
    <ellipse cx="22" cy="18" rx="16" ry="10" fill="url(#horseGrad)" transform="rotate(-10 22 18)"/>

    <!-- Forelegs (Extended forward in gallop) -->
    <path d="M 28 20 L 42 34 L 47 31 L 32 17 Z" fill="url(#horseGrad)"/>
    <path d="M 30 20 L 36 37 L 41 35 L 34 17 Z" fill="url(#horseGrad)"/>

    <!-- Neck & Head -->
    <path d="M 30 14 Q 42 2 46 -6 Q 44 4 34 16 Z" fill="url(#horseGrad)"/>
    
    <!-- Head / Muzzle -->
    <path d="M 42 -6 Q 50 -10 52 -6 Q 48 0 42 -2 Z" fill="url(#horseGrad)"/>

    <!-- Mane -->
    <path d="M 32 8 Q 38 2 44 -2 Q 38 6 30 12 Z" fill="#E65100"/>
  </g>

  <!-- Additional Distant Horizon Elements (Trees for scale) -->
  <g fill="#143815" opacity="0.8">
    <path d="M25 125 L28 115 L31 125 Z"/>
    <path d="M28 127 L30 118 L32 127 Z"/>
    <path d="M210 118 L213 108 L216 118 Z"/>
  </g>

  <!-- Subtle Accent Frame -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
</svg>