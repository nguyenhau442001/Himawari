<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 200 C 80 190, 160 190, 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Soldier 1 -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <rect x="12" y="32" width="16" height="30" rx="4" fill="#38bdf8"/>
    <rect x="10" y="35" width="6" height="20" rx="2" fill="#38bdf8" transform="rotate(-20 10 35)"/>
    <rect x="24" y="35" width="6" height="20" rx="2" fill="#38bdf8" transform="rotate(20 24 35)"/>
    <rect x="14" y="60" width="5" height="25" rx="2" fill="#475569"/>
    <rect x="21" y="60" width="5" height="25" rx="2" fill="#475569"/>
  </g>
  
  <!-- Soldier 2 -->
  <g transform="translate(120, 110)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <rect x="12" y="32" width="16" height="30" rx="4" fill="#fb923c"/>
    <rect x="8" y="40" width="24" height="6" rx="2" fill="#fb923c"/>
    <rect x="14" y="60" width="5" height="25" rx="2" fill="#475569"/>
    <rect x="21" y="60" width="5" height="25" rx="2" fill="#475569"/>
  </g>

  <!-- Soldier 3 -->
  <g transform="translate(180, 100)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <rect x="12" y="32" width="16" height="30" rx="4" fill="#10b981"/>
    <rect x="10" y="35" width="6" height="20" rx="2" fill="#10b981" transform="rotate(20 10 35)"/>
    <rect x="24" y="35" width="6" height="20" rx="2" fill="#10b981" transform="rotate(-20 24 35)"/>
    <rect x="14" y="60" width="5" height="25" rx="2" fill="#475569"/>
    <rect x="21" y="60" width="5" height="25" rx="2" fill="#475569"/>
  </g>

  <!-- Training Obstacle -->
  <rect x="150" y="170" width="40" height="10" rx="2" fill="#ec4899"/>
  <rect x="155" y="180" width="5" height="20" fill="#64748b"/>
  <rect x="180" y="180" width="5" height="20" fill="#64748b"/>
  
  <!-- Sun/Light -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24" opacity="0.3"/>
  <circle cx="200" cy="40" r="10" fill="#f59e0b"/>
</svg>