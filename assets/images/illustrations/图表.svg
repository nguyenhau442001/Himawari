<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambient light -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.2" filter="blur(20px)"/>

  <!-- Chart Board / Main Object -->
  <rect x="48" y="56" width="144" height="128" rx="8" fill="#232731" stroke="#3A4252" stroke-width="2"/>
  
  <!-- Board Header -->
  <rect x="48" y="56" width="144" height="28" rx="8" fill="#2A303C"/>
  <rect x="48" y="70" width="144" height="14" fill="#2A303C"/>
  <!-- Window dots -->
  <circle cx="64" cy="70" r="3" fill="#FF5F56"/>
  <circle cx="76" cy="70" r="3" fill="#FFBD2E"/>
  <circle cx="88" cy="70" r="3" fill="#27C93F"/>

  <!-- Grid lines -->
  <line x1="68" y1="104" x2="172" y2="104" stroke="#2D3748" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="68" y1="128" x2="172" y2="128" stroke="#2D3748" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="68" y1="152" x2="172" y2="152" stroke="#2D3748" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Axes -->
  <line x1="68" y1="164" x2="176" y2="164" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="96" x2="68" y2="168" stroke="#718096" stroke-width="2" stroke-linecap="round"/>

  <!-- Bar Chart Elements -->
  <!-- Bar 1 -->
  <rect x="80" y="136" width="14" height="28" rx="2" fill="#3B82F6"/>
  <!-- Bar 2 -->
  <rect x="104" y="116" width="14" height="48" rx="2" fill="#3B82F6"/>
  <!-- Bar 3 (Focus/Accent Bar) -->
  <rect x="128" y="96" width="14" height="68" rx="2" fill="#F59E0B"/>

  <!-- Line Chart Overlay -->
  <path d="M 87 136 L 111 110 L 135 88 L 163 116" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data Points on Line -->
  <circle cx="87" cy="136" r="3.5" fill="#1A1D24" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="111" cy="110" r="3.5" fill="#1A1D24" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="135" cy="88" r="4" fill="#F59E0B" stroke="#1A1D24" stroke-width="1.5"/>
  <circle cx="163" cy="116" r="3.5" fill="#1A1D24" stroke="#10B981" stroke-width="2.5"/>

  <!-- Floating Highlight Sparkle -->
  <path d="M 172 78 C 172 78, 172 84, 178 84 C 172 84, 172 90, 172 90 C 172 90, 172 84, 166 84 C 172 84, 172 78, 172 78 Z" fill="#F59E0B"/>
</svg>