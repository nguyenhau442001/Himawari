<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Parent Character -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="18" fill="#fbbf24"/>
    <path d="M5 40 Q20 35 35 40 L30 100 L10 100 Z" fill="#38bdf8"/>
    <rect x="15" y="100" width="10" height="40" fill="#38bdf8"/>
    <rect x="25" y="100" width="10" height="40" fill="#38bdf8"/>
    <path d="M0 45 L-20 70" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Child Character -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="15" fill="#f59e0b"/>
    <path d="M5 35 Q20 30 35 35 L30 80 L10 80 Z" fill="#ec4899"/>
    <rect x="15" y="80" width="8" height="30" fill="#ec4899"/>
    <rect x="25" y="80" width="8" height="30" fill="#ec4899"/>
    <!-- Child reaching out but not touching -->
    <path d="M35 40 L50 30" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Symbolic "Support" structure (a ladder being pulled away) -->
  <g transform="translate(110, 150)">
    <rect x="0" y="0" width="4" height="60" fill="#64748b"/>
    <rect x="20" y="0" width="4" height="60" fill="#64748b"/>
    <rect x="0" y="10" width="24" height="4" fill="#64748b"/>
    <rect x="0" y="40" width="24" height="4" fill="#64748b"/>
  </g>
  
  <!-- Motion lines for pulling away -->
  <path d="M140 160 L170 140" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M145 170 L175 150" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Environment details -->
  <circle cx="200" cy="50" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M180 50 L220 50 M200 30 L200 70" stroke="#334155" stroke-width="2"/>
</svg>