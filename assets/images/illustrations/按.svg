<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient lighting/shadow for depth -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>

  <!-- Electronic Device / Control Panel Base -->
  <rect x="70" y="70" width="100" height="100" rx="20" fill="#2D3342" stroke="#3F485F" stroke-width="4"/>

  <!-- Inner Bezel -->
  <rect x="85" y="85" width="70" height="70" rx="14" fill="#1E232F"/>

  <!-- The Button (Physical Object representing '按' - press/push) -->
  <g id="button-press">
    <!-- Outer button ring / recess shadow -->
    <circle cx="120" cy="120" r="28" fill="#141821"/>
    <!-- The physical pressable button (Accent color: Orange/Gold for focus) -->
    <circle cx="120" cy="116" r="24" fill="#FF8C37"/>
    <!-- Button top highlight -->
    <circle cx="120" cy="113" r="19" fill="#FFA559"/>
    <!-- Center icon/dot on button -->
    <circle cx="120" cy="113" r="6" fill="#E66A12"/>
  </g>

  <!-- Human Finger Pressing Down Action -->
  <g id="pressing-finger">
    <!-- Motion / downward pressure indicator lines -->
    <path d="M 100 56 L 100 66" stroke="#525D78" stroke-width="3" stroke-linecap="round"/>
    <path d="M 140 56 L 140 66" stroke="#525D78" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Finger Silhouette (Modern flat style, warm skin tone) -->
    <path d="M 104 35 
             C 104 22, 136 22, 136 35 
             C 136 60, 132 85, 128 98 
             C 127 103, 113 103, 112 98 
             C 108 85, 104 60, 104 35 Z" 
          fill="#FFC899"/>
          
    <!-- Finger knuckle / shading detail -->
    <path d="M 108 45 C 114 49, 126 49, 132 45" stroke="#E6A875" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>