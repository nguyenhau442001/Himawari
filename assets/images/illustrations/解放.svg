<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Industrial Heavy Base (represents heavy agricultural/manual labor) -->
    <path d="M-60,50 L60,50 L45,75 L-45,75 Z" fill="#2E3646" />
    <rect x="-20" y="20" width="40" height="30" fill="#3A4454" />
    
    <!-- Shackle / Heavy Industrial Cuffs (breaking free) -->
    <!-- Left Broken Shackle Part -->
    <path d="M-30,-20 C-30,-40 -15,-55 0,-55 C15,-55 25,-45 28,-30" fill="none" stroke="#6C7A9C" stroke-width="8" stroke-linecap="round"/>
    <path d="M-30,-20 L-30,10 C-30,15 -25,20 -20,20 L-10,20 C-5,20 0,15 0,10 L0,-20 Z" fill="#52607D" />
    
    <!-- Right Broken Shackle Part (flying off) -->
    <g transform="translate(45, -35) rotate(35)">
      <path d="M0,-20 C0,-40 15,-55 30,-55 C45,-55 55,-45 58,-30" fill="none" stroke="#6C7A9C" stroke-width="8" stroke-linecap="round"/>
      <path d="M0,-20 L0,10 C0,15 5,20 10,20 L20,20 C25,20 30,15 30,10 L30,-20 Z" fill="#52607D" />
      <path d="M25,-30 L45,-45" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Glowing Rising Mechanism / Automation & Freedom Symbol (Golden/Orange Accent) -->
    <circle cx="0" cy="-10" r="22" fill="#1A1D24" />
    <path d="M-12,-10 L-3,-1 L12,-18" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Release Energy Sparks -->
    <path d="M-50,-5 L-65,-8" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
    <path d="M50,-5 L65,-8" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,-65 L0,-80" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
    <path d="M-35,-50 L-45,-60" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
    <path d="M35,-50 L45,-60" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Modern UI subtle frame glow / accent dots -->
  <circle cx="30" cy="30" r="3" fill="#3A4454"/>
  <circle cx="210" cy="30" r="3" fill="#3A4454"/>
  <circle cx="30" cy="210" r="3" fill="#3A4454"/>
  <circle cx="210" cy="210" r="3" fill="#3A4454"/>
</svg>