<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bamboo counting sticks (筹) - historical and literal meaning -->
  <g transform="translate(120, 120)">
    <!-- Bundle of bamboo sticks -->
    <rect x="-12" y="-60" width="8" height="120" rx="2" fill="#D4AF37"/>
    <rect x="-2" y="-55" width="8" height="110" rx="2" fill="#B8860B"/>
    <rect x="8" y="-65" width="8" height="130" rx="2" fill="#DAA520"/>
    <rect x="-22" y="-50" width="8" height="100" rx="2" fill="#B8860B"/>
    
    <!-- Binding rope -->
    <rect x="-25" y="-10" width="45" height="10" rx="2" fill="#4A5568"/>
    <rect x="-25" y="5" width="45" height="10" rx="2" fill="#4A5568"/>
  </g>
</svg>