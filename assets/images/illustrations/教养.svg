<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Umbrella Interior Glow -->
    <radialGradient id="umbrellaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Street Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Umbrella Surface Gradient -->
    <linearGradient id="umbrellaTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Puddle Reflection Gradient -->
    <linearGradient id="puddleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Distant City Silhouettes -->
  <path d="M 0 170 L 25 170 L 25 140 L 45 140 L 45 170 L 70 170 L 70 125 L 95 125 L 95 170 L 240 170 L 240 240 L 0 240 Z" fill="#0b1329" opacity="0.7"/>

  <!-- Background Glowing Windows -->
  <rect x="30" y="148" width="4" height="6" rx="1" fill="#fbbf24" opacity="0.3"/>
  <rect x="38" y="148" width="4" height="6" rx="1" fill="#38bdf8" opacity="0.3"/>
  <rect x="76" y="135" width="5" height="7" rx="1" fill="#fbbf24" opacity="0.4"/>
  <rect x="85" y="135" width="5" height="7" rx="1" fill="#fbbf24" opacity="0.2"/>
  <rect x="76" y="148" width="5" height="7" rx="1" fill="#38bdf8" opacity="0.3"/>

  <!-- Wet Street Ground -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <ellipse cx="110" cy="188" rx="85" ry="14" fill="url(#puddleGrad)"/>
  <ellipse cx="40" cy="205" rx="30" ry="5" fill="#1e293b" opacity="0.8"/>
  <ellipse cx="180" cy="210" rx="40" ry="6" fill="#1e293b" opacity="0.8"/>

  <!-- Ground Light Reflections -->
  <ellipse cx="105" cy="186" rx="35" ry="4" fill="#f59e0b" opacity="0.15"/>
  <ellipse cx="32" cy="185" rx="12" ry="2" fill="#fef08a" opacity="0.2"/>

  <!-- Street Lamp (Left) -->
  <path d="M 30 185 L 34 185 L 33 80 L 37 72 L 32 65 L 27 72 L 31 80 Z" fill="#334155"/>
  <circle cx="32" cy="72" r="18" fill="url(#lampGlow)"/>
  <circle cx="32" cy="72" r="5" fill="#fef08a"/>

  <!-- Rain Layer - Background -->
  <path d="M 10 20 L 0 40 M 40 10 L 30 30 M 80 15 L 70 35 M 120 5 L 110 25 M 160 15 L 150 35 M 200 10 L 190 30 M 230 20 L 220 40" stroke="#38bdf8" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <path d="M 20 70 L 10 90 M 60 60 L 50 80 M 100 65 L 90 85 M 140 55 L 130 75 M 180 65 L 170 85 M 220 70 L 210 90" stroke="#38bdf8" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

  <!-- Safe "Dry Zone" Warm Light Field under Umbrella -->
  <path d="M 50 185 L 70 100 Q 115 80 160 105 L 170 185 Z" fill="url(#umbrellaGlow)"/>

  <!-- CHARACTER 1: Elderly Woman (Left) -->
  <!-- Body/Coat -->
  <path d="M 62 182 C 60 155 64 140 76 138 C 84 139 88 150 88 182 Z" fill="#9d174d"/>
  <!-- Scarf -->
  <path d="M 72 138 C 70 135 80 132 84 138 L 86 152 L 78 154 Z" fill="#10b981"/>
  <!-- Head & Hair -->
  <circle cx="75" cy="126" r="10" fill="#fbcfe8"/> <!-- Face -->
  <path d="M 66 124 C 65 113 83 111 84 122 C 86 122 86 127 84 128 C 80 120 68 120 66 124 Z" fill="#cbd5e1"/> <!-- Grey Hair -->
  <circle cx="65" cy="120" r="4" fill="#cbd5e1"/> <!-- Hair Bun -->
  <!-- Expressive Face (Grateful / Smiling) -->
  <path d="M 71 126 Q 73 128 75 126" stroke="#831843" stroke-width="1" fill="none"/> <!-- Eye -->
  <path d="M 72 130 Q 75 133 77 130" stroke="#831843" stroke-width="1" fill="none"/> <!-- Smile -->
  <!-- Walking Cane -->
  <path d="M 60 155 L 56 185" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 60 155 Q 62 150 57 150" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Hand on Cane -->
  <circle cx="58" cy="153" r="2.5" fill="#fbcfe8"/>

  <!-- CHARACTER 2: Polite Young Man (Right - Subject "他") -->
  <!-- Body/Coat (Leaning forward politely) -->
  <path d="M 125 182 L 128 145 C 128 135 148 130 158 135 L 160 182 Z" fill="#1e40af"/>
  <!-- Inner Sweater -->
  <path d="M 137 135 L 144 135 L 146 150 L 135 150 Z" fill="#f8fafc"/>
  <!-- Head -->
  <circle cx="140" cy="118" r="9.5" fill="#fde047" opacity="0.2"/> <!-- Soft highlight -->
  <circle cx="140" cy="118" r="9" fill="#fed7aa"/>
  <!-- Neat Hair -->
  <path d="M 131 118 C 130 108 147 106 149 114 C 151 116 146 110 138 111 C 133 112 132 116 131 118 Z" fill="#0f172a"/>
  <!-- Gentle, Polite Face Expression -->
  <path d="M 134 118 Q 136 116 138 118" stroke="#9a3412" stroke-width="1" fill="none"/> <!-- Eye -->
  <path d="M 133 122 Q 137 125 141 122" stroke="#9a3412" stroke-width="1" fill="none"/> <!-- Kind Smile -->
  <circle cx="133" cy="120" r="1" fill="#fb923c" opacity="0.6"/> <!-- Blush -->

  <!-- Arm holding Umbrella and tilting it towards the elderly lady -->
  <!-- Extending arm -->
  <path d="M 148 140 L 122 120" stroke="#1e40af" stroke-width="5" stroke-linecap="round"/>
  <circle cx="121" cy="119" r="2.5" fill="#fed7aa"/> <!-- Hand -->

  <!-- The Umbrella (Tilted heavily towards the lady to protect her) -->
  <!-- Shaft -->
  <line x1="121" y1="120" x2="105" y2="85" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Canopy Shadow/Inside -->
  <path d="M 65 92 Q 108 72 148 98 Z" fill="#78350f"/>
  <!-- Canopy Exterior -->
  <path d="M 62 92 Q 106 60 150 98 C 138 90 120 88 106 90 C 90 88 75 90 62 92 Z" fill="url(#umbrellaTop)"/>
  <!-- Umbrella Ribs/Highlights -->
  <path d="M 106 63 Q 106 80 106 90" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 106 63 Q 86 78 78 91" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 106 63 Q 126 80 134 95" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Umbrella Top Finial -->
  <path d="M 105 64 L 107 58" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Water Drops Splashing Off Umbrella (Protecting Her) -->
  <path d="M 60 95 L 56 100 M 55 93 L 48 96 M 153 100 L 158 106" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Rain Layer - Foreground (Outside dry zone) -->
  <path d="M 25 120 L 15 140 M 45 150 L 35 170 M 175 110 L 165 130 M 195 90 L 185 110 M 215 130 L 205 150 M 185 160 L 175 180 M 225 170 L 215 190" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>

  <!-- Raindrops falling on the Young Man's exposed shoulder (showing his selfless manners/教养) -->
  <path d="M 158 125 L 154 133" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="157" cy="134" r="1" fill="#38bdf8"/>

  <!-- Heart / Atmosphere Sparkles (Visualizing Good Manners & Kindness) -->
  <path d="M 98 108 Q 100 104 102 108 Q 104 112 100 114 Q 96 112 98 108 Z" fill="#f43f5e" opacity="0.7"/>
  <circle cx="118" cy="102" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="85" cy="105" r="1" fill="#fbbf24" opacity="0.8"/>
</svg>