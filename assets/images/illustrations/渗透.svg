<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background / Atmosphere Glow -->
  <circle cx="120" cy="120" r="90" fill="#1E2330" opacity="0.6"/>

  <!-- Soil Cross-section Object (Noun Representation of 渗透) -->
  <g transform="translate(40, 40)">
    <!-- Soil Layer Container (Rounded rect for sleek flat design) -->
    <rect x="0" y="0" width="160" height="160" rx="16" fill="#252A37"/>

    <!-- Soil Texture / Strata -->
    <path d="M0 60 C40 50, 120 70, 160 55 L160 144 C160 153 153 160 144 160 L16 160 C7 160 0 153 0 144 Z" fill="#2D3342"/>
    <path d="M0 110 C50 100, 110 120, 160 105 L160 144 C160 153 153 160 144 160 L16 160 C7 160 0 153 0 144 Z" fill="#222632"/>

    <!-- Surface Ground Line -->
    <rect x="0" y="0" width="160" height="20" rx="16" fill="#343B4C"/>
    <rect x="0" y="10" width="160" height="10" fill="#343B4C"/>

    <!-- Raindrops on Surface (Top) -->
    <g fill="#38BDF8">
      <ellipse cx="40" cy="10" rx="3" ry="5"/>
      <ellipse cx="80" cy="10" rx="3" ry="5"/>
      <ellipse cx="120" cy="10" rx="3" ry="5"/>
    </g>

    <!-- Penetration Paths / Water Droplets Flowing Downward (Orange/Gold accent for focus) -->
    <g fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <!-- Main central penetration stream -->
      <path d="M50 20 Q 55 50, 45 80 Q 35 110, 60 140" stroke-dasharray="4 4"/>
      <path d="M110 20 Q 105 60, 120 90 Q 135 120, 110 145" stroke-dasharray="4 4"/>
    </g>

    <!-- Diffused Water Droplets Inside Soil (Emphasizing seepage/infiltration) -->
    <g fill="#F59E0B">
      <!-- Upper infiltration -->
      <circle cx="70" cy="45" r="2.5" opacity="0.5"/>
      <circle cx="95" cy="35" r="2" opacity="0.4"/>
      
      <!-- Mid-depth seepage -->
      <path d="M45 80 C40 85, 50 90, 45 95" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="85" cy="75" r="3.5"/>
      <circle cx="120" cy="65" r="3"/>
      
      <!-- Deep soil absorption -->
      <circle cx="65" cy="120" r="4"/>
      <circle cx="105" cy="130" r="5"/>
      <circle cx="135" cy="115" r="3"/>
      
      <!-- Deepest droplets -->
      <ellipse cx="85" cy="148" rx="4" ry="2" opacity="0.8"/>
    </g>

    <!-- Subtle upward glow / focal ring -->
    <circle cx="105" cy="130" r="12" fill="#F59E0B" opacity="0.2"/>
    <circle cx="65" cy="120" r="10" fill="#F59E0B" opacity="0.2"/>
  </g>
</svg>