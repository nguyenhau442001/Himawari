<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" rx="4" fill="#475569"/>
  <rect x="40" y="175" width="10" height="50" rx="2" fill="#334155"/>
  <rect x="190" y="175" width="10" height="50" rx="2" fill="#334155"/>
  
  <!-- Books and Study Materials -->
  <rect x="50" y="130" width="60" height="30" rx="2" fill="#f59e0b"/>
  <rect x="55" y="135" width="50" height="20" rx="1" fill="#fbbf24"/>
  <rect x="120" y="140" width="50" height="20" rx="2" fill="#ec4899"/>
  <circle cx="185" cy="145" r="10" fill="#38bdf8"/>
  
  <!-- Student Character (Upper body) -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-40 100 C-40 60, 40 60, 40 100 L 30 130 L -30 130 Z" fill="#64748b"/>
    <!-- Head -->
    <circle cx="0" cy="40" r="35" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-35 40 C-35 10, -10 5, 0 5 C 10 5, 35 10, 35 40 L 35 20 C 35 0, 0 -10, -35 20 Z" fill="#1e293b"/>
    <!-- Eyes -->
    <circle cx="-12" cy="35" r="4" fill="#0f172a"/>
    <circle cx="12" cy="35" r="4" fill="#0f172a"/>
    <!-- Mouth (Concentration) -->
    <path d="M-8 55 Q 0 60 8 55" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Hands -->
    <circle cx="-45" cy="100" r="10" fill="#fde68a"/>
    <circle cx="45" cy="100" r="10" fill="#fde68a"/>
  </g>
  
  <!-- Calendar/Schedule on wall -->
  <rect x="170" y="30" width="40" height="50" rx="4" fill="#334155"/>
  <rect x="175" y="45" width="30" height="5" rx="1" fill="#94a3b8"/>
  <rect x="175" y="55" width="30" height="5" rx="1" fill="#94a3b8"/>
  <rect x="175" y="65" width="15" height="5" rx="1" fill="#10b981"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.2"/>
</svg>