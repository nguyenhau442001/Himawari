<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Interior Wall & Window Background Context -->
  <path d="M20 20 H220 V150 H20 Z" fill="#1b263b" />
  
  <!-- Window with Warm Night Glow -->
  <rect x="145" y="40" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="150" y="45" width="50" height="70" fill="#f59e0b" fill-opacity="0.15" />
  <line x1="175" y1="40" x2="175" y2="120" stroke="#334155" stroke-width="2"/>
  <line x1="145" y1="80" x2="205" y2="80" stroke="#334155" stroke-width="2"/>
  <!-- Plant on windowsill -->
  <path d="M155 110 H170 V115 H155 Z" fill="#64748b" />
  <path d="M162 110 C162 100 155 95 155 95 C155 95 162 98 162 90 C162 98 169 95 169 95 C169 95 162 100 162 110 Z" fill="#10b981" />

  <!-- Warm Desk Lamp Light Cone -->
  <polygon points="50,0 10,160 130,160" fill="#fbbf24" fill-opacity="0.05" />

  <!-- Wooden Desk Surface -->
  <path d="M0 160 H240 V240 H0 Z" fill="url(#desk-grad)" />
  <path d="M0 160 H240 V166 H0 Z" fill="#475569" />

  <!-- APPLICATION FORM (Central Prop) -->
  <g filter="url(#shadow)" transform="rotate(-5, 110, 160)">
    <!-- Form Base -->
    <rect x="65" y="115" width="90" height="105" rx="4" fill="url(#paper-grad)" />
    
    <!-- Form Header Graphic/Badge placeholder -->
    <circle cx="80" cy="130" r="6" fill="#38bdf8" />
    <rect x="92" y="127" width="45" height="5" rx="2" fill="#cbd5e1" />
    <rect x="92" y="135" width="30" height="3" rx="1.5" fill="#e2e8f0" />

    <!-- Form Fields -->
    <rect x="75" y="150" width="70" height="12" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="75" y="167" width="70" height="12" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Highlighted Target Field (Spouse Name Line) -->
    <rect x="73" y="183" width="74" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Abstract text lines inside spouse field -->
    <rect x="78" y="189" width="35" height="4" rx="2" fill="#d97706" />
  </g>

  <!-- HUSBAND CHARACTER (Standing / Leaning in, pointing to form) -->
  <g id="husband">
    <!-- Body / Torso -->
    <path d="M150 200 C150 175 170 165 185 165 C200 165 215 175 220 200 Z" fill="#38bdf8" />
    <!-- Collar -->
    <path d="M175 165 L185 175 L195 165 Z" fill="#f8fafc" />
    <!-- Head -->
    <circle cx="185" cy="140" r="18" fill="#ffd166" />
    <!-- Hair -->
    <path d="M167 138 C167 125 180 120 190 122 C202 125 203 138 203 138 C203 138 198 128 185 128 C172 128 167 138 167 138 Z" fill="#334155" />
    <!-- Friendly Face / Smiling -->
    <circle cx="191" cy="138" r="1.5" fill="#1e293b" />
    <path d="M190 145 Q194 149 198 145" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Arm & Hand Pointing at the Form -->
    <path d="M170 175 L135 185 L125 180" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="122" cy="179" r="4" fill="#ffd166" />
  </g>

  <!-- WIFE CHARACTER (Sitting, holding pen, filling out the form) -->
  <g id="wife">
    <!-- Body / Torso -->
    <path d="M40 220 C40 185 60 170 80 170 C100 170 115 185 120 220 Z" fill="#ec4899" />
    <!-- Neck & Head -->
    <circle cx="80" cy="145" r="18" fill="#ffecd0" />
    <!-- Hair Style (Bun) -->
    <circle cx="68" cy="135" r="8" fill="#1e293b" />
    <path d="M62 145 C62 130 75 125 90 130 C98 133 98 148 98 148 C98 148 90 138 80 138 C70 138 62 145 62 145 Z" fill="#1e293b" />
    <!-- Face Profile -->
    <circle cx="73" cy="144" r="1.5" fill="#1e293b" />
    <path d="M72 150 Q75 153 78" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arm & Hand Writing -->
    <path d="M75 180 L95 190 L105 185" fill="none" stroke="#ec4899" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="107" cy="183" r="4" fill="#ffecd0" />

    <!-- Pen -->
    <line x1="107" y1="183" x2="115" y2="188" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Desk Lamp Object -->
  <g id="lamp">
    <!-- Base -->
    <ellipse cx="30" cy="160" rx="12" ry="4" fill="#64748b" />
    <!-- Stand -->
    <path d="M30 160 L30 120 L45 100" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shade -->
    <path d="M35 95 L55 105 L45 85 Z" fill="#f59e0b" />
  </g>

  <!-- Coffee Mug Prop -->
  <g id="mug" transform="translate(15, 175)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#f8fafc" />
    <path d="M16 4 C20 4 20 12 16 14" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M5 -4 C5 -7 8 -7 8 -10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M11 -3 C11 -6 14 -6 14 -9" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

</svg>