<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Golden Light / Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient for Medals/Decorations -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Uniform Dark Blue Gradient -->
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Golden Spotlight Effect -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Background Environment: Command Center / Office with Maps & Flags -->
  <g id="environment">
    <!-- Wooden bookshelf / paneling accent -->
    <rect x="25" y="40" width="45" height="110" rx="4" fill="#1e1b4b" opacity="0.6"/>
    <rect x="170" y="40" width="45" height="110" rx="4" fill="#1e1b4b" opacity="0.6"/>
    
    <!-- Tactical Map on Wall -->
    <rect x="75" y="35" width="90" height="65" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Map details (contours & markers) -->
    <path d="M85 55 Q 100 45, 120 60 T 155 50" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M85 75 Q 110 85, 130 70 T 155 80" fill="none" stroke="#334155" stroke-width="2"/>
    <!-- Map pins -->
    <circle cx="100" cy="55" r="3" fill="#ef4444"/>
    <circle cx="135" cy="70" r="3" fill="#38bdf8"/>
    <line x1="100" y1="55" x2="135" y2="70" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>

    <!-- Tactical Desk / Table -->
    <path d="M 40 180 L 200 180 L 210 210 L 30 210 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="50" y="185" width="140" height="6" fill="#1e293b" rx="2"/>

    <!-- Desk Props: Scroll / Blueprint & Compass -->
    <rect x="65" y="188" width="30" height="12" rx="3" fill="#fbbf24" opacity="0.9" transform="rotate(-10 80 194)"/>
    <!-- Compass / Protractor -->
    <circle cx="150" cy="193" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="145" y1="193" x2="155" y2="193" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="150" y1="188" x2="150" y2="198" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Main Subject: The General (将军) -->
  <g id="general" filter="url(#shadow)">
    <!-- Shoulders & Uniform Torso -->
    <path d="M 80 180 L 80 140 C 80 130, 95 120, 120 120 C 145 120, 160 130, 160 140 L 160 180 Z" fill="url(#uniformGrad)"/>

    <!-- Uniform Lapels & High Collar -->
    <path d="M 100 120 L 120 145 L 140 120 Z" fill="#0f172a"/>
    <path d="M 105 120 L 120 135 L 135 120 Z" fill="#1e3a8a"/>

    <!-- Epaulets (Shoulder Boards with Stars signifying rank) -->
    <g id="epaulets">
      <!-- Left Epaulet -->
      <path d="M 75 125 L 95 122 L 98 132 L 78 135 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
      <circle cx="84" cy="128" r="2" fill="#ffffff"/>
      <circle cx="90" cy="127" r="2" fill="#ffffff"/>

      <!-- Right Epaulet -->
      <path d="M 165 125 L 145 122 L 142 132 L 162 135 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
      <circle cx="156" cy="128" r="2" fill="#ffffff"/>
      <circle cx="150" cy="127" r="2" fill="#ffffff"/>
    </g>

    <!-- Chest Medals & Ribbons (Signifying fame/accomplishment - "著名的") -->
    <g id="medals" transform="translate(100, 140)">
      <!-- Ribbon Bar -->
      <rect x="0" y="0" width="16" height="5" rx="1" fill="#ef4444"/>
      <rect x="18" y="0" width="16" height="5" rx="1" fill="#3b82f6"/>
      <rect x="36" y="0" width="16" height="5" rx="1" fill="#10b981"/>
      <!-- Hanging Star Medal -->
      <circle cx="26" cy="15" r="7" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1"/>
      <path d="M 26 10 L 27.5 13.5 L 31 14 L 28.5 16.5 L 29.2 20 L 26 18.2 L 22.8 20 L 23.5 16.5 L 21 14 L 24.5 13.5 Z" fill="#ffffff" transform="scale(0.5) translate(26, 17)"/>
    </g>

    <!-- Gold Uniform Buttons -->
    <circle cx="120" cy="148" r="3" fill="url(#goldGrad)"/>
    <circle cx="120" cy="162" r="3" fill="url(#goldGrad)"/>
    <circle cx="120" cy="176" r="3" fill="url(#goldGrad)"/>

    <!-- Neck & Head -->
    <rect x="110" y="105" width="20" height="22" rx="6" fill="#fde047" />
    <path d="M 110 110 C 110 100, 130 100, 130 110 Z" fill="#ca8a04" opacity="0.3"/> <!-- Neck shadow -->

    <!-- Head Base -->
    <circle cx="120" cy="90" r="26" fill="#fef08a" />
    <path d="M 96 90 C 96 72, 144 72, 144 90 C 144 106, 96 106, 96 90 Z" fill="#fde047" /> <!-- Face contour shade -->

    <!-- Mature, Wise Facial Features -->
    <!-- Determined / Confident Eyebrows (Grey/Dark for seasoned veteran) -->
    <path d="M 103 81 L 115 84" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M 137 81 L 125 84" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (Focused, calm, authoritative) -->
    <circle cx="110" cy="88" r="3.5" fill="#1e293b"/>
    <circle cx="130" cy="88" r="3.5" fill="#1e293b"/>
    <circle cx="111" cy="87" r="1" fill="#ffffff"/>
    <circle cx="131" cy="87" r="1" fill="#ffffff"/>
    
    <!-- Gentle Smile / Confident Expression -->
    <path d="M 115 102 Q 120 106, 125 102" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Distinguished Grey Temples & Short Hair -->
    <path d="M 94 92 C 94 75, 105 66, 120 66 C 135 66, 146 75, 146 92 C 143 82, 135 74, 120 74 C 105 74, 97 82, 94 92 Z" fill="#64748b"/>
    <!-- Sideburn highlights -->
    <path d="M 95 86 C 94 92, 96 98, 98 102 C 96 96, 95 90, 95 86 Z" fill="#94a3b8"/>
    <path d="M 145 86 C 146 92, 144 98, 142 102 C 144 96, 145 90, 145 86 Z" fill="#94a3b8"/>

    <!-- General's Visor Cap (Military Peak Cap) -->
    <g id="military-cap">
      <!-- Crown -->
      <path d="M 96 74 C 95 62, 105 56, 120 56 C 135 56, 145 62, 144 74 Z" fill="#1e3a8a"/>
      <!-- Cap Band -->
      <path d="M 94 72 C 105 76, 135 76, 146 72 L 148 77 C 135 81, 105 81, 92 77 Z" fill="#0f172a"/>
      <!-- Gold Visor Cord / Trim -->
      <path d="M 97 76 C 105 79, 135 79, 143 76" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <!-- Cap Badge / Emblem -->
      <circle cx="120" cy="74" r="5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
      <path d="M 120 71 L 121.5 73.5 L 124 74 L 122 75.5 L 122.5 78 L 120 76.5 L 117.5 78 L 118 75.5 L 116 74 L 118.5 73.5 Z" fill="#ffffff" transform="scale(0.35) translate(221, 130)"/>
      <!-- Visor Peak (Shiny Black Brim) -->
      <path d="M 94 77 C 105 85, 135 85, 146 77 C 140 89, 100 89, 94 77 Z" fill="#020617" stroke="#334155" stroke-width="1"/>
      <!-- Brim Highlight -->
      <path d="M 100 79 C 110 84, 130 84, 140 79" fill="none" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements / Glows -->
  <!-- Subtle ambient particles representing importance and respect -->
  <circle cx="50" cy="90" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="190" cy="70" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="210" cy="130" r="1" fill="#fef08a" opacity="0.5"/>
  <circle cx="35" cy="140" r="2" fill="#fef08a" opacity="0.4"/>
</svg>