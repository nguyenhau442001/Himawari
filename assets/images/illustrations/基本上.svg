    <path d="M-64 36 L64 36 L76 68 L-76 68 Z" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    <rect x="-60" y="44" width="120" height="16" fill="#3B4252" rx="2"/>

    <!-- Main Structure Pillar -->
    <rect x="-44" y="-36" width="88" height="72" fill="#3B4252" rx="4"/>
    <path d="M-52 -36 L52 -36 L64 -48 L-64 -48 Z" fill="#4C566A"/>

    <!-- Structural details (windows representing completeness/substance) -->
