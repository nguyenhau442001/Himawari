<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Shadow/glow under the central object -->
  <ellipse cx="120" cy="180" rx="60" ry="16" fill="#111318" opacity="0.8"/>
  
  <!-- Scalpel Handle -->
  <path d="M 85,155 L 140,100 L 148,108 L 93,163 Z" fill="#64748B"/>
  <!-- Scalpel Grip Lines -->
  <line x1="90" y1="150" x2="98" y2="158" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="97" y1="143" x2="105" y2="151" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="136" x2="112" y2="144" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="111" y1="129" x2="119" y2="137" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Scalpel Blade -->
  <path d="M 140,100 L 165,75 C 172,68 175,73 170,80 L 148,108 Z" fill="#E2E8F0"/>
