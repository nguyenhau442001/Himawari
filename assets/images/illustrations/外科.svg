  <path d="M 165,75 C 172,68 175,73 170,80 L 148,108 Z" fill="#FFFFFF" opacity="0.6"/>

  <!-- Medical Cross Accent Floating -->
  <g transform="translate(145, 60)">
    <rect x="-8" y="-3" width="16" height="6" rx="2" fill="#F59E0B"/>
    <rect x="-3" y="-8" width="6" height="16" rx="2" fill="#F59E0B"/>
  </g>
  
  <g transform="translate(75, 140)">
    <rect x="-6" y="-2" width="12" height="4" rx="1" fill="#F59E0B" opacity="0.8"/>
    <rect x="-2" y="-6" width="4" height="12" rx="1" fill="#F59E0B" opacity="0.8"/>
  </g>
</svg>