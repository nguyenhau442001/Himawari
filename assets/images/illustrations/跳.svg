<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bed -->
  <rect x="60" y="150" width="120" height="30" rx="4" fill="#3A404D"/>
  <rect x="65" y="135" width="110" height="15" rx="2" fill="#4B5563"/>
  
  <!-- Puppy in mid-air -->
  <g transform="translate(100, 80)">
    <!-- Body -->
    <ellipse cx="20" cy="20" rx="25" ry="18" fill="#F59E0B"/>
    <!-- Head -->
    <circle cx="45" cy="10" r="15" fill="#F59E0B"/>
    <!-- Ears -->
    <path d="M35 5 L30 -10 L40 5 Z" fill="#D97706"/>
    <path d="M55 5 L60 -10 L50 5 Z" fill="#D97706"/>
    <!-- Legs in motion -->
    <rect x="10" y="35" width="6" height="12" rx="2" fill="#F59E0B"/>
    <rect x="25" y="35" width="6" height="12" rx="2" fill="#F59E0B"/>
    <!-- Tail -->
    <path d="M-5 20 Q-15 10 -10 5" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Motion lines -->
  <path d="M90 120 Q110 100 130 120" stroke="#4B5563" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M80 130 Q110 110 140 130" stroke="#4B5563" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
</svg>