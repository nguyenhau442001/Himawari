<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Night-to-Twilight Port Gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hullGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="craneYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGradient)" />

  <!-- Distant Port City / Skyline silhouetted -->
  <path d="M10 120 L20 100 L30 105 L45 90 L60 120 Z" fill="#334155" opacity="0.5"/>
  <path d="M50 120 L70 95 L90 120 Z" fill="#475569" opacity="0.6"/>
  
  <!-- Sky elements: Stars and Glowing Sunset/Sunrise Horizon -->
  <circle cx="40" cy="40" r="1" fill="#cbd5e1" opacity="0.8"/>
  <circle cx="80" cy="30" r="1.5" fill="#f8fafc" opacity="0.9"/>
  <circle cx="190" cy="45" r="1" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="210" cy="25" r="1.2" fill="#f8fafc" opacity="0.9"/>
  <ellipse cx="120" cy="115" rx="90" ry="15" fill="#f59e0b" opacity="0.15" />

  <!-- Harbor Crane Background (Port Infrastructure - "Important Port") -->
  <g transform="translate(150, 45)">
    <!-- Crane Tower -->
    <path d="M20 75 L30 15 L35 15 L40 75 Z" fill="url(#craneYellow)" />
    <!-- Crane Arm (Jib) -->
    <path d="M5 20 L55 5 L55 12 L5 25 Z" fill="url(#craneYellow)" />
    <!-- Counter Jib -->
    <path d="M35 15 L45 25 L40 27 L32 18 Z" fill="#b45309" />
    <!-- Cable and Hook -->
    <line x1="45" y1="10" x2="45" y2="45" stroke="#0f172a" stroke-width="1.5" />
    <rect x="41" y="45" width="8" height="10" rx="1" fill="#1e293b" />
  </g>

  <!-- Water Surface -->
  <rect x="0" y="115" width="240" height="125" fill="url(#waterGradient)" />
  <path d="M0 125 Q 30 120, 60 125 T 120 125 T 180 125 T 240 125 L 240 240 L 0 240 Z" fill="#0284c7" opacity="0.5" />
  <!-- Water ripples -->
  <path d="M20 140 Q 40 137, 60 140" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M140 155 Q 165 152, 190 155" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M70 180 Q 95 177, 120 180" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M160 205 Q 185 202, 210 205" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Cargo Ship (Main Maritime Element) -->
  <g transform="translate(15, 110)">
    <!-- Hull -->
    <path d="M10 20 L130 20 L115 45 L25 45 Z" fill="url(#hullGradient)" />
    <!-- Waterline shadow -->
    <path d="M22 45 L118 45 L121 50 L19 50 Z" fill="#0f172a" />
    <!-- Deck/Containers -->
    <rect x="35" y="5" width="20" height="15" rx="1" fill="#38bdf8" />
    <rect x="60" y="2" width="25" height="18" rx="1" fill="#10b981" />
    <rect x="90" y="8" width="18" height="12" rx="1" fill="#f59e0b" />
    <!-- Superstructure / Bridge -->
    <rect x="100" y="-8" width="22" height="28" rx="2" fill="#f8fafc" />
    <rect x="104" y="-3" width="6" height="6" rx="1" fill="#0f172a" />
    <rect x="113" y="-3" width="6" height="6" rx="1" fill="#0f172a" />
    <!-- Funnel -->
    <rect x="108" y="-16" width="6" height="8" fill="#ef4444" />
  </g>

  <!-- Foreground Wharf / Pier Structure -->
  <path d="M0 160 L140 160 L140 240 L0 240 Z" fill="#334155" />
  <!-- Pier Deck Details / Concrete Panels -->
  <line x1="0" y1="160" x2="140" y2="160" stroke="#64748b" stroke-width="3" />
  <line x1="40" y1="160" x2="40" y2="240" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6" />
  <line x1="90" y1="160" x2="90" y2="240" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6" />
  
  <!-- Stacked Cargo Containers on the Pier -->
  <g transform="translate(15, 135)">
    <!-- Bottom Container -->
    <rect x="0" y="10" width="35" height="15" rx="1" fill="#0284c7" />
    <line x1="10" y1="10" x2="10" y2="25" stroke="#0369a1" stroke-width="1.5" />
    <line x1="25" y1="10" x2="25" y2="25" stroke="#0369a1" stroke-width="1.5" />
    <!-- Top Container -->
    <rect x="5" y="-3" width="28" height="13" rx="1" fill="#ec4899" />
    <line x1="14" y1="-3" x2="14" y2="10" stroke="#db2777" stroke-width="1.5" />
  </g>

  <g transform="translate(55, 130)">
    <!-- Yellow Container Stack -->
    <rect x="0" y="5" width="32" height="20" rx="1" fill="#f59e0b" />
    <line x1="16" y1="5" x2="16" y2="25" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Lighthouse / Navigation Beacon on the Pier edge -->
  <g transform="translate(125, 115)">
    <path d="M3 45 L7 15 L13 15 L17 45 Z" fill="#f8fafc" />
    <path d="M4 30 L16 30 M5 20 L15 20" stroke="#ef4444" stroke-width="2" />
    <!-- Beacon Light Room -->
    <rect x="7" y="10" width="6" height="5" fill="#0f172a" />
    <circle cx="10" cy="12" r="3" fill="#38bdf8" />
    <!-- Light Beam Effect -->
    <polygon points="10,12 -30,-10 -15,30" fill="url(#beaconGlow)" opacity="0.7"/>
  </g>

  <!-- Human Characters (Port Director / Inspector & Logistics Officer) -->
  <!-- Character 1: Logistics Officer inspecting clipboard -->
  <g transform="translate(85, 145)">
    <!-- Shadow -->
    <ellipse cx="12" cy="79" rx="10" ry="3" fill="#0f172a" opacity="0.4" />
    <!-- Boots -->
    <path d="M6 72 L6 78 L11 78 L11 72 Z" fill="#334155" />
    <path d="M14 72 L14 78 L19 78 L19 72 Z" fill="#334155" />
    <!-- Pants -->
    <path d="M7 50 L11 50 L11 73 L7 73 Z" fill="#1e3a8a" />
    <path d="M13 50 L17 50 L17 73 L13 73 Z" fill="#1e3a8a" />
    <!-- Torso (High-vis vest over jacket) -->
    <path d="M5 28 L19 28 L21 52 L3 52 Z" fill="#1e293b" />
    <!-- Vest (Orange/Amber) -->
    <path d="M5 28 L11 28 L10 52 L3 52 Z" fill="#f59e0b" />
    <path d="M13 28 L19 28 L21 52 L14 52 Z" fill="#f59e0b" />
    <rect x="9" y="35" width="4" height="12" fill="#f8fafc" opacity="0.8"/>
    <!-- Head & Safety Helmet -->
    <circle cx="12" cy="18" r="6" fill="#fde047" />
    <path d="M5 16 C5 12, 19 12, 19 16 Z" fill="#f59e0b" /> <!-- Hard hat -->
    <!-- Arms & Clipboard -->
    <path d="M4 30 L2 44 L9 46" stroke="#fde047" stroke-width="4" stroke-linecap="round" fill="none" />
    <rect x="2" y="40" width="10" height="12" rx="1" fill="#f8fafc" transform="rotate(15 2 40)" />
  </g>

  <!-- Character 2: Pointing Harbor Master / Expert discussing the important port -->
  <g transform="translate(50, 142)">
    <!-- Shadow -->
    <ellipse cx="12" cy="82" rx="10" ry="3" fill="#0f172a" opacity="0.4" />
    <!-- Shoes -->
    <rect x="7" y="78" width="5" height="4" rx="2" fill="#0f172a" />
    <rect x="13" y="78" width="5" height="4" rx="2" fill="#0f172a" />
    <!-- Outfit / Blue Uniform -->
    <path d="M7 52 L17 52 L16 80 L8 80 Z" fill="#1e3a8a" />
    <!-- Torso -->
    <path d="M4 28 L20 28 L22 54 L2 54 Z" fill="#2563eb" />
    <!-- Gold Buttons/Epaulets -->
    <circle cx="12" cy="34" r="1" fill="#fbbf24" />
    <circle cx="12" cy="40" r="1" fill="#fbbf24" />
    <!-- Head & Cap -->
    <circle cx="12" cy="18" r="6" fill="#fde047" />
    <!-- Captain Hat -->
    <ellipse cx="12" cy="14" rx="6" ry="3" fill="#1e293b" />
    <path d="M5 15 C8 12, 16 12, 19 15 C17 18, 7 18, 5 15 Z" fill="#f8fafc" />
    <path d="M7 16 C10 18, 14 18, 17 16" stroke="#fbbf24" stroke-width="1.5" fill="none" />
    <!-- Pointing Arm (Showing off the port scale) -->
    <path d="M19 32 Q 28 26, 32 23" stroke="#2563eb" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="33" cy="22" r="2" fill="#fde047" />
    <!-- Other arm -->
    <path d="M5 32 L2 45" stroke="#2563eb" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Seagulls flying in the background (Adds atmosphere) -->
  <path d="M110 50 Q 115 45, 120 50 Q 125 45, 130 50 Q 125 48, 120 52 Q 115 48, 110 50 Z" fill="#cbd5e1" opacity="0.8" />
  <path d="M75 70 Q 79 66, 83 70 Q 87 66, 91 70 Q 87 68, 83 72 Q 79 68, 75 70 Z" fill="#cbd5e1" opacity="0.7" />

  <!-- Frame border accent subtle -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>