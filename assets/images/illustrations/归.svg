<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Office Interior Environment -->
  <!-- Large Window -->
  <path d="M140 30 L210 30 L210 120 L140 120 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M140 30 L210 30 L210 120 L140 120 Z" fill="url(#window-glow)" />
  <line x1="175" y1="30" x2="175" y2="120" stroke="#334155" stroke-width="1.5" />
  <line x1="140" y1="75" x2="210" y2="75" stroke="#334155" stroke-width="1.5" />

  <!-- City Skyline Silhouette outside window -->
  <path d="M145 120 L145 90 L153 90 L153 120 L162 120 L162 70 L172 70 L172 120 L185 120 L185 85 L195 85 L195 120 L205 120 L205 100 L208 100 L208 120 Z" fill="#1e293b" opacity="0.8" />

  <!-- Wall Shelf with Plant -->
  <rect x="30" y="55" width="60" height="4" rx="2" fill="#475569" />
  <!-- Pot -->
  <path d="M50 55 L53 40 L67 40 L70 55 Z" fill="#ec4899" />
  <!-- Plant Leaves -->
  <path d="M60 40 C60 30 50 25 45 28 C50 32 55 35 60 40 Z" fill="#10b981" />
  <path d="M60 40 C65 25 75 25 78 30 C72 34 65 37 60 40 Z" fill="#34d399" />
  <path d="M60 40 C60 20 63 20 60 40 Z" fill="#10b981" />

  <!-- Office Desk Surface -->
  <path d="M15 170 L225 170 L235 210 L5 210 Z" fill="url(#desk-grad)" />
  <rect x="15" y="165" width="210" height="7" rx="3.5" fill="#475569" />

  <!-- Corporate Building Plaque / Logo Frame on Wall (Abstract geometric structure representing Company) -->
  <g transform="translate(75, 30)">
    <rect x="0" y="0" width="40" height="25" rx="3" fill="#334155" stroke="#64748b" stroke-width="1" />
    <path d="M12 18 L12 10 L20 7 L28 10 L28 18 Z" fill="#38bdf8" opacity="0.8" />
    <circle cx="20" cy="13" r="3" fill="#fbbf24" />
  </g>

  <!-- Character (Professional Office Worker / Manager) -->
  <!-- Body/Suit -->
  <path d="M95 170 C95 140 100 130 115 130 C130 130 135 140 135 170 Z" fill="#1e293b" />
  <!-- Shirt & Tie -->
  <path d="M110 130 L120 130 L122 155 L118 170 L112 170 L108 155 Z" fill="#f8fafc" />
  <polygon points="115,138 118,155 112,155" fill="#ef4444" />
  <!-- Suit Lapels -->
  <path d="M115 130 L105 160 L110 170" fill="#334155" />
  <path d="M115 130 L125 160 L120 170" fill="#334155" />

  <!-- Neck -->
  <rect x="110" y="120" width="10" height="15" fill="#fca5a5" />

  <!-- Head -->
  <circle cx="115" cy="105" r="18" fill="#f87171" />
  <!-- Hair -->
  <path d="M98 105 C98 90 105 85 115 85 C125 85 132 92 132 105 C128 98 122 93 115 93 C108 93 102 98 98 105 Z" fill="#334155" />

  <!-- Facial expression: Confident / Professional smile -->
  <path d="M111 112 Q115 116 119 112" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="109" cy="103" r="1.5" fill="#1e293b" />
  <circle cx="121" cy="103" r="1.5" fill="#1e293b" />

  <!-- Arms and Hands gesturing toward the funds -->
  <!-- Left arm -->
  <path d="M100 135 L75 155 L85 165" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right arm reaching out to present/hand over the money -->
  <path d="M130 135 L155 145 L150 155" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="150" cy="157" r="5" fill="#fca5a5" />

  <!-- Props: The Wealth / Funds ("这笔钱") - Glowing Gold Coins, Ledger & Secure Briefcase -->
  <!-- Open Corporate Ledger / Document on Desk -->
  <g transform="translate(30, 160) rotate(-10)">
    <polygon points="0,20 40,5 50,30 10,45" fill="#f1f5f9" />
    <polygon points="50,30 90,15 100,40 60,55" fill="#e2e8f0" />
    <line x1="20" y1="18" x2="35" y2="12" stroke="#cbd5e1" stroke-width="2" />
    <line x1="18" y1="26" x2="38" y2="19" stroke="#cbd5e1" stroke-width="2" />
    <line x1="65" y1="28" x2="80" y2="22" stroke="#cbd5e1" stroke-width="2" />
    <line x1="63" y1="36" x2="85" y2="29" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Secure Metallic Briefcase (Open, revealing funds) -->
  <g transform="translate(135, 165)">
    <!-- Briefcase body -->
    <rect x="0" y="10" width="60" height="35" rx="4" fill="#475569" stroke="#64748b" stroke-width="1.5" />
    <path d="M5 10 L15 0 L45 0 L55 10 Z" fill="#334155" />
    <!-- Gold / Money Stacks Inside Briefcase -->
    <rect x="8" y="15" width="20" height="25" rx="2" fill="url(#gold-grad)" filter="url(#glow)" />
    <rect x="32" y="15" width="20" height="25" rx="2" fill="url(#gold-grad)" filter="url(#glow)" />
    <!-- Currency detail lines -->
    <line x1="18" y1="15" x2="18" y2="40" stroke="#b45309" stroke-width="1.5" opacity="0.6" />
    <line x1="42" y1="15" x2="42" y2="40" stroke="#b45309" stroke-width="1.5" opacity="0.6" />
    
    <!-- Floating Glowing Gold Coins (representing ownership transfer / belonging to the company) -->
    <circle cx="10" cy="-5" r="7" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="30" cy="-15" r="9" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="50" cy="-8" r="6" fill="url(#gold-grad)" filter="url(#glow)" />
    
    <!-- Sparkles/Aura indicating official assignment / belonging -->
    <path d="M30 -30 L33 -23 L40 -20 L33 -17 L30 -10 L27 -17 L20 -20 L27 -23 Z" fill="#fbbf24" />
    <path d="M65 0 L66.5 4 L70.5 5.5 L66.5 7 L65 11 L63.5 7 L59.5 5.5 L63.5 4 Z" fill="#38bdf8" />
  </g>

  <!-- Laptop on Desk (Context prop) -->
  <g transform="translate(90, 160)">
    <path d="M5 25 L35 25 L40 35 L0 35 Z" fill="#64748b" />
    <rect x="8" y="5" width="24" height="20" rx="2" fill="#1e293b" stroke="#94a3b8" stroke-width="1" />
    <rect x="11" y="8" width="18" height="12" rx="1" fill="#38bdf8" opacity="0.3" />
    <!-- Chart on screen representing company assets -->
    <polyline points="13,17 16,13 20,15 25,10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Coffee Mug -->
  <rect x="72" y="165" width="12" height="15" rx="2" fill="#f8fafc" />
  <path d="M84 170 C88 170 88 177 84 178" stroke="#f8fafc" stroke-width="2" fill="none" />

  <!-- Ambient lighting effects for top-tier visual polish -->
  <circle cx="115" cy="105" r="30" fill="#fbbf24" opacity="0.05" filter="url(#glow)" />
</svg>