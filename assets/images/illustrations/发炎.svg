<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Inflammation Glow -->
    <radialGradient id="inflamed-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#fb7185" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environmental Context: Room Interior & Shelf -->
  <g id="environment">
    <!-- Back wall shelf -->
    <rect x="30" y="55" width="90" height="6" rx="3" fill="#334155" />
    <path d="M45 55 L45 35 L75 35 L75 55 Z" fill="#475569" opacity="0.4" />
    <!-- Medicine bottle prop on shelf -->
    <rect x="52" y="38" width="16" height="17" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="56" y="35" width="8" height="3" rx="1.5" fill="#e2e8f0" />

    <!-- Wall Lamp Lighting -->
    <circle cx="185" cy="50" r="70" fill="url(#lamp-glow)" />
    <path d="M185 20 L185 40" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M165 40 L205 40 L195 55 L175 55 Z" fill="#fbbf24" filter="url(#soft-shadow)" />

    <!-- Nightstand / Table Surface -->
    <rect x="20" y="195" width="200" height="12" rx="4" fill="#334155" />
    <rect x="35" y="207" width="170" height="20" fill="#1e293b" />
    <!-- First aid box prop on table -->
    <rect x="155" y="170" width="40" height="25" rx="4" fill="#f8fafc" filter="url(#soft-shadow)" />
    <rect x="170" y="178" width="10" height="10" fill="#ef4444" rx="1" />
    <rect x="167" y="181" width="16" height="4" fill="#ef4444" rx="1" />
  </g>

  <!-- Main Subject: Character Experiencing Inflamed Wound -->
  <g id="character-and-action" filter="url(#soft-shadow)">
    <!-- Character Body / Torso (Sitting / Leaning forward) -->
    <path d="M75 195 C75 160 90 145 115 145 C140 145 155 160 155 195 Z" fill="#38bdf8" />
    
    <!-- Character Neck -->
    <path d="M103 125 L123 125 L125 148 L101 148 Z" fill="#fed7aa" />

    <!-- Character Head -->
    <circle cx="112" cy="105" r="26" fill="#fed7aa" />

    <!-- Hair -->
    <path d="M87 105 C87 88 100 80 115 80 C132 80 139 92 138 110 C130 102 120 98 110 98 C100 98 93 101 87 105 Z" fill="#334155" />

    <!-- Worried Facial Expression -->
    <!-- Eyebrows (tilted up inward for concern) -->
    <path d="M98 97 Q104 93 110 97" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M116 97 Q122 93 128 97" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Eyes (closed in wincing/discomfort) -->
    <path d="M100 106 Q104 109 108 106" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M118 106 Q122 109 126 106" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Mouth (slight grimace) -->
    <path d="M110 118 Q114 114 118 118" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Left Arm & Hand (Holding/Examining Forearm) -->
    <path d="M85 155 C70 165 65 185 80 195 C95 205 105 185 100 170 Z" fill="#38bdf8" />
    <!-- Left Hand Fingers wrapping around arm -->
    <circle cx="92" cy="183" r="8" fill="#fed7aa" />

    <!-- Right Arm -->
    <path d="M140 155 C155 165 150 185 135 195" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />

    <!-- Focal Point: The Inflamed Arm & Wound -->
    <!-- Forearm protruding forward -->
    <path d="M70 180 C80 175 105 175 115 185 C105 195 80 195 70 180 Z" fill="#fed7aa" />

    <!-- Inflammation Heat Aura / Glow -->
    <circle cx="92" cy="185" r="22" fill="url(#inflamed-glow)" />

    <!-- The Wound itself (Red, swollen, infected look) -->
    <ellipse cx="92" cy="185" rx="8" ry="6" fill="#f43f5e" />
    <ellipse cx="92" cy="185" rx="4" ry="3" fill="#be123c" />

    <!-- Heat Radiating Lines (Indicating Fever / Inflammation "fāyán") -->
    <path d="M84 167 L82 162" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <path d="M92 165 L92 159" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <path d="M100 167 L102 162" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Details -->
  <!-- Floating subtle ambient sparkles/dust in warm light -->
  <circle cx="160" cy="90" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="195" cy="120" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="145" cy="70" r="1" fill="#fbbf24" opacity="0.8" />
  <circle cx="210" cy="80" r="1.5" fill="#fbbf24" opacity="0.5" />
</svg>