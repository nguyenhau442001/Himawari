<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric background shapes -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <path d="M 20 200 L 220 200" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Warm ambient light glow representing collaboration and success -->
  <circle cx="120" cy="95" r="50" fill="#f59e0b" opacity="0.12" filter="blur(8px)"/>

  <!-- Architecture & Office Window backdrop -->
  <path d="M 60 70 L 180 70 L 190 190 L 50 190 Z" fill="#1e293b" opacity="0.4"/>
  <line x1="120" y1="70" x2="120" y2="190" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="120" x2="175" y2="120" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Large Modern Meeting Desk (The Foundation / Platform) -->
  <!-- Desk base structure -->
  <path d="M 50 170 L 190 170 L 205 210 L 35 210 Z" fill="#334155"/>
  <!-- Desk top surface with warm highlight -->
  <path d="M 35 155 L 205 155 L 190 170 L 50 170 Z" fill="#475569"/>
  <path d="M 45 157 L 195 157" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Props on Desk: Architectural Blueprint / Contract (symbolizing the foundation of cooperation) -->
  <rect x="95" y="160" width="50" height="25" rx="2" fill="#f8fafc" transform="rotate(-5 120 172)"/>
  <line x1="102" y1="166" x2="130" y2="164" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="172" x2="125" y2="170" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small glowing checkmark on document -->
  <circle cx="137" cy="172" r="4" fill="#10b981"/>
  <path d="M 135 172 L 136.5 174 L 140 170" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Coffee Cups / Collaboration Props -->
  <rect x="65" y="158" width="12" height="15" rx="2" fill="#38bdf8"/>
  <path d="M 77 162 C 80 162 80 168 77 168" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

  <!-- Character Left (Partner A - Handshake/Engagement) -->
  <!-- Torso -->
  <path d="M 50 170 C 50 145 75 145 75 170 Z" fill="#3b82f6"/>
  <!-- Head & Hair -->
  <circle cx="62" cy="120" rx="13" ry="13" fill="#fcd34d"/>
  <path d="M 49 118 C 50 110 60 106 72 112 C 75 114 74 120 74 120 Z" fill="#1e293b"/>
  <!-- Arm reaching forward for handshake/foundation placing -->
  <path d="M 65 148 L 95 158" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="95" cy="158" r="4" fill="#fcd34d"/>

  <!-- Character Right (Partner B - Handshake/Engagement) -->
  <!-- Torso -->
  <path d="M 165 170 C 165 145 190 145 190 170 Z" fill="#10b981"/>
  <!-- Head & Hair -->
  <circle cx="178" cy="120" rx="13" ry="13" fill="#fcd34d"/>
  <path d="M 166 116 C 170 108 185 108 191 116 C 185 115 175 115 166 116 Z" fill="#451a03"/>
  <!-- Arm reaching forward -->
  <path d="M 175 148 L 145 158" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  <circle cx="145" cy="158" r="4" fill="#fcd34d"/>

<!-- Central Action: Golden Building Blocks / Foundation Stones being locked into place (Visual metaphor for "Diàndìng" - laying the foundation) -->
  <!-- Base block 1 -->
  <polygon points="110,135 130,127 150,135 130,143" fill="#f59e0b"/>
  <polygon points="110,135 130,143 130,152 110,144" fill="#d97706"/>
  <polygon points="150,135 130,143 130,152 150,144" fill="#fbbf24"/>

  <!-- Base block 2 (left) -->
  <polygon points="90,143 110,135 130,143 110,151" fill="#f59e0b"/>
  <polygon points="90,143 110,151 110,160 90,152" fill="#d97706"/>
  <polygon points="130,143 110,151 110,160 130,152" fill="#fbbf24"/>

  <!-- Base block 3 (right) -->
  <polygon points="130,143 150,135 170,143 150,151" fill="#f59e0b"/>
  <polygon points="130,143 150,151 150,160 130,152" fill="#d97706"/>
  <polygon points="170,143 150,151 150,160 170,152" fill="#fbbf24"/>

  <!-- Top Keystone Block being placed (The solid foundation achievement) -->
  <polygon points="110,118 130,110 150,118 130,126" fill="#fbbf24"/>
  <polygon points="110,118 130,126 130,135 110,127" fill="#f59e0b"/>
  <polygon points="150,118 130,126 130,135 150,127" fill="#fcd34d"/>

  <!-- Sparkles / Success indicators around the foundation -->
  <path d="M 120 95 L 122 102 L 129 104 L 122 106 L 120 113 L 118 106 L 111 104 L 118 102 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 155 110 L 156 114 L 160 115 L 156 116 L 155 120 L 154 116 L 150 115 L 154 114 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 85 125 L 86 128 L 89 129 L 86 130 L 85 133 L 84 130 L 81 129 L 84 128 Z" fill="#10b981" opacity="0.8"/>

  <!-- Foreground plant for depth framing -->
  <path d="M 20 220 Q 25 190 40 185 Q 35 210 20 220 Z" fill="#059669"/>
  <path d="M 15 225 Q 22 200 32 195 Q 28 215 15 225 Z" fill="#10b981"/>
</svg>