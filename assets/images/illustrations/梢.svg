<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stylized dark mode tree trunk and main branch pointing upwards -->
  <path d="M 80,210 L 100,120 L 110,70" stroke="#3E4553" stroke-width="10" stroke-linecap="round" fill="none"/>
  
  <!-- Focus area: The very top tip of the branch (树梢 - shāo) highlighted with a warm golden glow -->
  <path d="M 110,70 Q 115,50 125,40" stroke="#E5C158" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Delicate leaves at the tip -->
  <path d="M 125,40 C 135,35 145,45 140,55 C 135,60 125,50 125,40 Z" fill="#4ADE80" opacity="0.85"/>
  <path d="M 125,40 C 115,30 105,38 112,48 C 118,52 125,40 125,40 Z" fill="#22C55E" opacity="0.9"/>
  <path d="M 110,70 C 100,65 95,75 102,80 C 108,82 110,70 110,70 Z" fill="#22C55E" opacity="0.7"/>

  <!-- Small bird perched precisely on the shāo (tip of the branch) -->
  <g transform="translate(118, 30)">
    <!-- Bird body -->
    <ellipse cx="6" cy="8" rx="8" ry="6" fill="#60A5FA"/>
    <!-- Bird head -->
    <circle cx="14" cy="4" r="5" fill="#60A5FA"/>
    <!-- Beak -->
    <polygon points="18,4 23,5 18,7" fill="#F59E0B"/>
    <!-- Wing -->
    <path d="M 2,6 C 6,4 10,8 8,11 C 6,11 3,9 2,6 Z" fill="#3B82F6"/>
    <!-- Tail -->
    <polygon points="-1,9 -6,6 -3,12" fill="#3B82F6"/>
  </g>

  <!-- Focus ring/indicator highlighting the "shāo" concept -->
  <circle cx="125" cy="40" r="28" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.6"/>
  <circle cx="125" cy="40" r="34" stroke="#F59E0B" stroke-width="1" fill="none" opacity="0.2"/>
</svg>