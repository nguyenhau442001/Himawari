<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Spotlight/Glow Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Flag Gradient (Victory Red/Orange) -->
    <linearGradient id="flag-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Confetti Gradients -->
    <linearGradient id="confetti-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Dramatic Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment / Mountain Peak Silhouette & Stars -->
  <g fill="#334155" opacity="0.6">
    <polygon points="20,200 70,140 120,200"/>
    <polygon points="90,200 150,110 220,200"/>
  </g>
  <g fill="#475569" opacity="0.8">
    <polygon points="50,200 110,130 170,200"/>
    <polygon points="140,200 185,150 230,200"/>
  </g>

  <!-- Distant Stars / Sparkles -->
  <circle cx="45" cy="50" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="85" cy="35" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="190" cy="45" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="210" cy="80" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="30" cy="90" r="1" fill="#38bdf8" opacity="0.5"/>

  <!-- Confetti Elements in Air -->
  <rect x="55" y="80" width="6" height="3" rx="1" fill="url(#confetti-gold)" transform="rotate(25 58 81.5)"/>
  <rect x="175" y="100" width="8" height="4" rx="1" fill="#38bdf8" transform="rotate(-30 179 102)"/>
  <circle cx="155" cy="65" r="2" fill="#f43f5e"/>
  <circle cx="70" cy="120" r="2.5" fill="#fbbf24"/>
  <rect x="195" y="150" width="5" height="3" rx="1" fill="#10b981" transform="rotate(45 197.5 151.5)"/>

  <!-- Ground Platform -->
  <rect x="20" y="200" width="200" height="6" rx="3" fill="#334155"/>
  <rect x="40" y="206" width="160" height="4" rx="2" fill="#1e293b"/>

  <!-- Character & Flag Group (Centered / Dynamic Pose) -->
  <g transform="translate(15, 10)">
    
    <!-- Shadow beneath character -->
    <ellipse cx="105" cy="193" rx="22" ry="5" fill="#020617" opacity="0.6"/>

    <!-- Left Foot & Leg -->
    <path d="M95 160 L90 193 L105 193 L108 175" fill="#1e293b"/>
    <path d="M90 193 L110 193 L110 196 L88 196 Z" fill="#0f172a"/>

    <!-- Right Foot & Leg (Striding forward) -->
    <path d="M115 160 L125 190 L138 190 L130 170" fill="#1e293b"/>
    <path d="M123 190 L140 190 L140 194 L121 194 Z" fill="#0f172a"/>

    <!-- Torso (Twisted triumphantly) -->
    <path d="M92 120 L122 120 L125 160 L90 160 Z" fill="url(#suit-grad)" rx="6"/>
    
    <!-- Belt -->
    <rect x="91" y="155" width="32" height="5" fill="#0f172a"/>
    <rect x="103" y="155" width="8" height="5" fill="#fbbf24"/>

    <!-- Head & Face -->
    <circle cx="107" cy="98" r="16" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M91 96 C91 84, 123 84, 123 96 C123 98, 121 94, 117 92 C113 90, 101 90, 97 92 C93 94, 91 96, 91 96 Z" fill="#0f172a"/>
    <!-- Face Expression (Joyful, shouting in victory) -->
    <path d="M103 103 Q107 108 111 103" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="97" r="1.5" fill="#0f172a"/>
    <circle cx="114" cy="97" r="1.5" fill="#0f172a"/>
    <!-- Cheeks (Excitement Blush) -->
    <circle cx="98" cy="101" r="2" fill="#f43f5e" opacity="0.4"/>
    <circle cx="116" cy="101" r="2" fill="#f43f5e" opacity="0.4"/>

    <!-- Left Arm (Akimbo / Balance) -->
    <path d="M92 124 L75 140 L82 150 L95 135" fill="#2563eb"/>

    <!-- Flagpole (Held high diagonally) -->
    <!-- Extends from ground-ish area up and far right -->
    <line x1="60" y1="180" x2="175" y2="35" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Pole tip finial -->
    <circle cx="175" cy="35" r="4" fill="#fbbf24"/>

    <!-- Right Arm (Reaching up to grip pole) -->
    <path d="M122 122 L145 105 L152 115 L132 135" fill="#38bdf8"/>
    <circle cx="147" cy="110" r="4" fill="#fbcfe8"/> <!-- Hand -->

    <!-- THE FLAG: 旗帜 (Waving dynamically from the pole) -->
    <g>
      <!-- Flag Shadow / Depth -->
      <path d="M172 37 Q150 75 160 115 Q130 95 100 110 Q125 70 120 40 Z" fill="#e11d48" opacity="0.3"/>
      
      <!-- Main Waving Flag Shape -->
      <path d="M172 38 
               C150 65, 165 90, 155 115 
               C130 100, 115 108, 100 105 
               C115 80, 110 55, 120 38 
               Z" 
            fill="url(#flag-grad)"/>

      <!-- Dynamic Wave Highlight Lines on Flag -->
      <path d="M165 55 Q150 75 135 70" stroke="#fef08a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M150 90 Q130 95 115 85" stroke="#ffe4e6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

      <!-- Victory Emblem Symbol on Flag (Abstract star/laurel motif matching context without words) -->
      <g transform="translate(138, 70) scale(0.6)">
        <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,5 -7,9 -5,1 -11,-4 -3,-4" fill="#fef08a"/>
      </g>
    </g>

  </g>

  <!-- Foreground Atmospheric Sparkles -->
  <circle cx="50" cy="155" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="180" cy="180" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="120" cy="25" r="1.5" fill="#f43f5e" opacity="0.7"/>

  <!-- Subtle Vignette Frame Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>