<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk / Interior Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Light Cone (Magnifier Effect) -->
    <radialGradient id="magnifierLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Genuine Item Glow -->
    <radialGradient id="genuineGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Interior Elements (Antique Shop / Expert Desk) -->
  <g id="environment">
    <!-- Bookshelf in background -->
    <rect x="25" y="40" width="45" height="70" rx="4" fill="#1b263b" opacity="0.6"/>
    <rect x="30" y="55" width="35" height="6" fill="#334155" opacity="0.8"/>
    <rect x="30" y="75" width="35" height="6" fill="#334155" opacity="0.8"/>
    <rect x="30" y="95" width="35" height="6" fill="#334155" opacity="0.8"/>
    
    <!-- Warm background lamp glow -->
    <circle cx="190" cy="50" r="30" fill="#f59e0b" opacity="0.15"/>
    <path d="M180 20 L200 20 L205 45 L175 45 Z" fill="#475569"/>
    <line x1="190" y1="20" x2="190" y2="10" stroke="#475569" stroke-width="2"/>

    <!-- Desk Surface -->
    <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
    <path d="M0 160 L240 160" stroke="#475569" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Objects on Desk: Two Similar Vases/Artifacts (Real vs Fake) -->
  <g id="artifacts" filter="url(#softShadow)">
    <!-- Item A (Left - Genuine with subtle green aura) -->
    <circle cx="75" cy="140" r="25" fill="url(#genuineGlow)"/>
    <!-- Vase Body A -->
    <path d="M65 160 C60 140 65 125 75 120 C85 125 90 140 85 160 Z" fill="#0d9488"/>
    <!-- Vase Neck A -->
    <path d="M70 120 L80 120 L82 112 L68 112 Z" fill="#0f766e"/>
    <!-- Vase Pattern A (Gold accent) -->
    <path d="M72 135 Q75 140 78 135" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <circle cx="75" cy="148" r="2" fill="#fbbf24"/>

    <!-- Item B (Right - Counterfeit / Questionable with subtle pink/amber highlight) -->
    <!-- Vase Body B -->
    <path d="M155 160 C150 140 155 125 165 120 C175 125 180 140 175 160 Z" fill="#0d9488"/>
    <!-- Vase Neck B -->
    <path d="M160 120 L170 120 L172 112 L158 112 Z" fill="#0f766e"/>
    <!-- Vase Pattern B (Slightly flawed/different gold accent) -->
    <path d="M162 135 Q164 138 168 134" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <!-- Tiny subtle crack on item B to show "fake/flawed" -->
    <path d="M168 145 L171 150" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Main Character: Apprehensive / Concentrating Evaluator -->
  <g id="character" filter="url(#softShadow)">
    <!-- Character Body / Torso -->
    <path d="M90 220 C90 190 100 175 120 175 C140 175 150 190 150 220 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt Detail -->
    <path d="M110 175 L120 190 L130 175" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round"/>

    <!-- Character Neck -->
    <rect x="112" y="160" width="16" height="20" fill="#f1d0b5"/>

    <!-- Character Head -->
    <circle cx="120" cy="135" r="24" fill="#f1d0b5"/>

    <!-- Hair -->
    <path d="M96 135 C96 115 110 110 120 110 C135 110 144 120 144 138 C144 138 140 120 120 118 C100 116 96 135 96 135 Z" fill="#1e293b"/>

    <!-- Confused / Concentrating Facial Expression -->
    <!-- Eyebrows (tilted inward in dilemma/confusion) -->
    <path d="M107 128 L115 131" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M125 131 L133 128" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Focused straight ahead) -->
    <circle cx="111" cy="136" r="2.5" fill="#1e293b"/>
    <circle cx="129" cy="136" r="2.5" fill="#1e293b"/>

    <!-- Puzzled Mouth (Small wavy line indicating uncertainty) -->
    <path d="M116 148 Q120 145 124 148" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Sweat Drop (Classic confusion/dilemma trope) -->
    <path d="M138 126 C138 126 143 132 143 135 C143 137.2 141.2 139 139 139 C136.8 139 135 137.2 135 135 C135 132 138 126 138 126 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Props: Magnifying Glass inspecting the items -->
  <g id="magnifying-glass" filter="url(#softShadow)">
    <!-- Hand holding magnifier -->
    <path d="M100 190 C100 180 110 170 115 165 C120 160 125 165 120 172 C115 178 110 185 105 195 Z" fill="#f1d0b5"/>

    <!-- Magnifier Handle -->
    <path d="M105 185 L85 205" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
    <path d="M105 185 L85 205" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Magnifier Rim -->
    <circle cx="115" cy="155" r="22" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Magnifier Glass (Lens Area with Glow and Distortion Effect) -->
    <circle cx="115" cy="155" r="19" fill="url(#magnifierLight)"/>
    
    <!-- Enlarged visual details inside lens (showing comparison between true/false) -->
    <!-- Mini checkmark vs question mark concept rendered graphically without text -->
    <circle cx="115" cy="155" r="14" fill="#38bdf8" opacity="0.15"/>
    
    <!-- Stylized split indicator beam inside lens -->
    <line x1="115" y1="138" x2="115" y2="172" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>
  </g>

  <!-- Dynamic floating dilemma indicators (Abstract glowing decision icons, no text) -->
  <g id="indicators">
    <!-- Glowing Question Mark / Choice aura above objects -->
    <path d="M68 95 C68 88 75 85 80 90 C85 95 78 102 78 106" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="78" cy="113" r="1.5" fill="#fbbf24"/>

    <path d="M162 95 C162 88 169 85 174 90 C179 95 172 102 172 106" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="172" cy="113" r="1.5" fill="#f43f5e"/>
  </g>

</svg>