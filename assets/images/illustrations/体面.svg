<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to highlight the central object -->
  <circle cx="120" cy="115" r="70" fill="#2D323E" opacity="0.5"/>

  <!-- Conceptual Object: "体面" (Dignity, Respectability, "face") represented as a sleek, modern, well-tailored golden-trimmed lapel/suit jacket with a glowing tie and a subtle crown/shield crest, symbolizing honor and standing. -->
  <g transform="translate(0, 5)">
    <!-- Shoulders / Suit Body -->
    <path d="M 70 165 L 70 145 C 70 130 80 115 95 105 L 105 95 L 85 65 C 85 65 105 55 120 55 C 135 55 155 65 155 65 L 135 95 L 145 105 C 160 115 170 130 170 145 L 170 165 Z" fill="#252A34"/>
    
    <!-- Inner Shirt V-Neck -->
    <path d="M 105 95 L 120 120 L 135 95 L 120 65 Z" fill="#E2E8F0"/>
    
    <!-- Golden Accent Lapels (Symbolizing "Face"/Prestige) -->
    <path d="M 105 95 L 120 120 L 115 140 L 95 110 Z" fill="#F59E0B" opacity="0.2"/>
    <path d="M 135 95 L 120 120 L 125 140 L 145 110 Z" fill="#F59E0B" opacity="0.2"/>
    <polygon points="105,95 120,65 120,120" fill="#F8FAFC"/>
    <polygon points="135,95 120,65 120,120" fill="#CBD5E1"/>

    <!-- Tie (Center) -->
    <polygon points="120,80 125,135 120,150 115,135" fill="#F59E0B"/>
    <polygon points="120,75 123,83 120,87 117,83" fill="#D97706"/>

    <!-- Lapel Outlines (Sleek Gold Trim) -->
    <polyline points="85,65 105,95 120,65 135,95 155,65" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dignified Crest / Badge on Chest (Representing status, living well, 'tǐmiàn') -->
    <g transform="translate(120, 130)">
      <path d="M 0 -12 L 10 -4 L 7 10 L 0 15 L -7 10 L -10 -4 Z" fill="#1A1D24" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Star in crest -->
      <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#F59E0B"/>
    </g>

    <!-- Floating Sparkles / Prestige Indicators -->
    <path d="M 75 80 L 77 85 L 82 87 L 77 89 L 75 94 L 73 89 L 68 87 L 73 85 Z" fill="#F59E0B" opacity="0.8"/>
    <path d="M 165 80 L 167 85 L 172 87 L 167 89 L 165 94 L 163 89 L 158 87 L 163 85 Z" fill="#F59E0B" opacity="0.8"/>
    <circle cx="95" cy="55" r="2" fill="#F59E0B" opacity="0.6"/>
    <circle cx="145" cy="55" r="2" fill="#F59E0B" opacity="0.6"/>
  </g>
</svg>