<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="50" y="150" width="10" height="90" fill="#334155"/>
  <rect x="180" y="150" width="10" height="90" fill="#334155"/>
  
  <!-- Laptop -->
  <rect x="70" y="100" width="100" height="60" rx="4" fill="#475569"/>
  <rect x="75" y="105" width="90" height="45" rx="2" fill="#1e293b"/>
  <circle cx="120" cy="127" r="8" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Characters -->
  <!-- Person 1 (Anxious) -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M12 20 Q15 15 18 20 M22 20 Q25 15 28 20" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M15 28 Q20 25 25 28" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="60" rx="5" fill="#fb923c"/>
  </g>
  
  <!-- Person 2 (Reassuring) -->
  <g transform="translate(140, 110)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <ellipse cx="15" cy="18" rx="2" ry="3" fill="#475569"/>
    <ellipse cx="25" cy="18" rx="2" ry="3" fill="#475569"/>
    <path d="M12 28 Q20 32 28 28" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="5" y="40" width="30" height="70" rx="5" fill="#10b981"/>
    <!-- Hand gesture -->
    <path d="M-5 50 L-20 45" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-22" cy="44" r="5" fill="#fde68a"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="20" fill="#fbbf24" opacity="0.1"/>
  <path d="M180 60 L220 60" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
</svg>