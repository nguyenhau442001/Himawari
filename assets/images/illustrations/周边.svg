<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central School Building -->
  <rect x="95" y="95" width="50" height="50" fill="#F39C12" rx="4"/>
  <rect x="105" y="105" width="10" height="15" fill="#1A1D24"/>
  <rect x="125" y="105" width="10" height="15" fill="#1A1D24"/>
  <rect x="110" y="125" width="20" height="20" fill="#1A1D24"/>
  
  <!-- Surrounding Area Elements (The "Zhoubian") -->
  <!-- Shop 1 -->
  <rect x="30" y="80" width="30" height="30" fill="#3498DB" rx="4"/>
  <rect x="35" y="95" width="20" height="15" fill="#1A1D24"/>
  
  <!-- Shop 2 -->
  <rect x="180" y="80" width="30" height="30" fill="#3498DB" rx="4"/>
  <rect x="185" y="95" width="20" height="15" fill="#1A1D24"/>
  
  <!-- Park/Tree -->
  <circle cx="50" cy="170" r="15" fill="#27AE60"/>
  <rect x="47" y="185" width="6" height="15" fill="#95A5A6"/>
  
  <!-- Cafe/Bench -->
  <rect x="160" y="170" width="40" height="10" fill="#E67E22" rx="2"/>
  <rect x="165" y="180" width="5" height="10" fill="#95A5A6"/>
  <rect x="190" y="180" width="5" height="10" fill="#95A5A6"/>
  
  <!-- Pathways connecting center to surroundings -->
  <path d="M120 145 L120 180" stroke="#5D6D7E" stroke-width="4" stroke-dasharray="4 4"/>
  <path d="M95 120 L60 120" stroke="#5D6D7E" stroke-width="4" stroke-dasharray="4 4"/>
  <path d="M145 120 L180 120" stroke="#5D6D7E" stroke-width="4" stroke-dasharray="4 4"/>
  <path d="M120 95 L120 60" stroke="#5D6D7E" stroke-width="4" stroke-dasharray="4 4"/>
</svg>