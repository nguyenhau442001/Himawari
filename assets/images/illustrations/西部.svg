<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background glowing elements / atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>

  <!-- Compass / Directional Indicator representing "West" (西部) -->
  <g transform="translate(120, 115)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#2F384B" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="62" fill="#1E2430" stroke="#3A465C" stroke-width="2"/>

    <!-- Direction Markers (N, E, S, W) -->
    <!-- North -->
    <rect x="-1.5" y="-56" width="3" height="8" fill="#5C6C8A" rx="1.5"/>
    <!-- East -->
    <rect x="48" y="-1.5" width="8" height="3" fill="#5C6C8A" rx="1.5"/>
    <!-- South -->
    <rect x="-1.5" y="48" width="3" height="8" fill="#5C6C8A" rx="1.5"/>
    <!-- West (Highlighted in bright orange/gold for focus) -->
    <rect x="-56" y="-1.5" width="8" height="3" fill="#F59E0B" rx="1.5"/>

    <!-- Mountain Landscape inside the compass representing Western China's high mountains (中国西部有很多高山) -->
    <g transform="translate(0, 0)">
      <!-- Clip path for the compass inner circle -->
      <clipPath id="compass-clip">
        <circle cx="0" cy="0" r="60"/>
      </clipPath>

      <g clip-path="url(#compass-clip)">
        <!-- Sky gradient -->
        <rect x="-60" y="-60" width="120" height="120" fill="#161A23"/>

        <!-- Distant Mountains -->
        <polygon points="-60,20 -20,-15 20,10 60,-5 60,60 -60,60" fill="#2A3548"/>

        <!-- Main Majestic Mountains (Western Highlands) -->
        <polygon points="-60,30 -10,-20 40,35 60,20 60,60 -60,60" fill="#36455E"/>

        <!-- Snow Peaks (Highlight) -->
        <polygon points="-10,-20 2,-8 -5,-2" fill="#E2E8F0" opacity="0.9"/>
        <polygon points="40,35 48,27 53,32" fill="#E2E8F0" opacity="0.8"/>
        <polygon points="-35,5 -25,-3 -18,4" fill="#E2E8F0" opacity="0.7"/>

        <!-- Sun / Glow representing the Western Sunset -->
        <circle cx="-25" cy="-25" r="12" fill="#F59E0B" opacity="0.3"/>
        <circle cx="-25" cy="-25" r="8" fill="#F59E0B" opacity="0.9"/>
      </g>
    </g>

    <!-- Compass Needle pointing West -->
    <g transform="rotate(270)">
      <!-- West-pointing needle (Gold/Orange accent) -->
      <polygon points="0,0 -8,-45 0,-55" fill="#F59E0B"/>
      <!-- East-pointing tail (Slate) -->
      <polygon points="0,0 8,30 0,38" fill="#64748B"/>
      <!-- Center pin -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.5" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Location Pin / Focus Icon floating at top of West indicator -->
  <path d="M120 34 C112 34 106 40 106 48 C106 58 120 70 120 70 C120 70 134 58 134 48 C134 40 128 34 120 34 Z" fill="#F59E0B"/>
  <circle cx="120" cy="47" r="4" fill="#1A1D24"/>

  <!-- Bottom Label Area / Clean framing lines -->
  <line x1="60" y1="205" x2="180" y2="205" stroke="#2F384B" stroke-width="2" stroke-linecap="round"/>
</svg>