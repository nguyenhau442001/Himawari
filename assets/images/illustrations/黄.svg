<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative soft glow -->
  <circle cx="120" cy="120" r="80" fill="#E5A93B" opacity="0.05" />

  <!-- Ground layer / carpet of autumn -->
  <path d="M 40 180 Q 120 165 200 180 L 210 195 Q 120 210 30 195 Z" fill="#2C2318" />
  <path d="M 30 195 Q 120 210 210 195 L 215 205 Q 120 220 25 205 Z" fill="#1E1710" />

  <!-- Fallen Autumn Leaves (金黄的落叶) representing the noun "黄" -->
  <!-- Leaf 1 (Left background) -->
  <g transform="translate(65, 145) rotate(-25)">
    <path d="M0,25 C-15,10 -15,-10 0,-25 C15,-10 15,10 0,25 Z" fill="#F5B041" />
    <path d="M0,25 L0,-25" stroke="#7D5717" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,10 L-8,3" stroke="#7D5717" stroke-width="1" stroke-linecap="round"/>
    <path d="M0,0 L8,-7" stroke="#7D5717" stroke-width="1" stroke-linecap="round"/>
    <path d="M0,-10 L-6,-15" stroke="#7D5717" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Leaf 2 (Center prominent golden leaf) -->
  <g transform="translate(120, 125) rotate(10) scale(1.4)">
    <!-- Main leaf body -->
    <path d="M0,32 C-20,15 -22,-10 0,-35 C22,-10 20,15 0,32 Z" fill="#F39C12" />
    <!-- Leaf veins -->
    <path d="M0,32 L0,-35" stroke="#784212" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,15 L-12,5" stroke="#784212" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0,5 L12,-5" stroke="#784212" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0,-8 L-9,-18" stroke="#784212" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0,-8 L9,-18" stroke="#784212" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Leaf 3 (Right foreground overlap) -->
  <g transform="translate(160, 155) rotate(45) scale(1.1)">
    <path d="M0,25 C-15,10 -15,-10 0,-25 C15,-10 15,10 0,25 Z" fill="#F1C40F" />
    <path d="M0,25 L0,-25" stroke="#9A7D0A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,10 L-8,3" stroke="#9A7D0A" stroke-width="1" stroke-linecap="round"/>
    <path d="M0,0 L8,-7" stroke="#9A7D0A" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Leaf 4 (Small lower left) -->
  <g transform="translate(85, 175) rotate(-60) scale(0.85)">
    <path d="M0,25 C-15,10 -15,-10 0,-25 C15,-10 15,10 0,25 Z" fill="#F39C12" />
    <path d="M0,25 L0,-25" stroke="#784212" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Leaf 5 (Small lower right) -->
  <g transform="translate(145, 170) rotate(-15) scale(0.8)">
    <path d="M0,25 C-15,10 -15,-10 0,-25 C15,-10 15,10 0,25 Z" fill="#F5B041" />
    <path d="M0,25 L0,-25" stroke="#7D5717" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Falling motion trails / Wind breeze hint -->
  <path d="M 60 70 Q 90 60 110 85" fill="none" stroke="#E5A93B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 130 50 Q 150 65 170 55" fill="none" stroke="#E5A93B" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Additional small falling leaf mid-air -->
  <g transform="translate(95, 75) rotate(-35) scale(0.65)">
    <path d="M0,25 C-15,10 -15,-10 0,-25 C15,-10 15,10 0,25 Z" fill="#F1C40F" />
    <path d="M0,25 L0,-25" stroke="#9A7D0A" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>