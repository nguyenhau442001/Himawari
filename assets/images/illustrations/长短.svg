<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Measuring Tape / Guideline Grid background accents -->
    <line x1="30" y1="180" x2="210" y2="180" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="60" y1="50" x2="60" y2="180" stroke="#2A303C" stroke-width="1" opacity="0.5" />
    <line x1="180" y1="50" x2="180" y2="180" stroke="#2A303C" stroke-width="1" opacity="0.5" />

    <!-- Left Trousers (Short) -->
    <g transform="translate(60, 95)">
      <!-- Waistband -->
      <rect x="-22" y="0" width="44" height="8" rx="3" fill="#3A4256" />
      <line x1="-15" y1="4" x2="15" y2="4" stroke="#FFA726" stroke-width="1.5" />
      
      <!-- Short Legs -->
      <path d="M-20,8 L-20,45 C-20,48 -18,50 -15,50 C-12,50 -10,48 -10,45 L-10,18 L0,18 L10,18 L10,45 C10,48 12,50 15,50 C18,50 20,48 20,45 L20,8 Z" fill="#4F79A8" />
      <!-- Cuff Highlights -->
      <path d="M-20,42 L-10,42" stroke="#669ACD" stroke-width="2" />
      <path d="M10,42 L20,42" stroke="#669ACD" stroke-width="2" />
    </g>

    <!-- Right Trousers (Long) - Demonstrating contrast/scale for "长短" -->
    <g transform="translate(180, 65)">
      <!-- Waistband -->
      <rect x="-22" y="0" width="44" height="8" rx="3" fill="#3A4256" />
      <line x1="-15" y1="4" x2="15" y2="4" stroke="#FFA726" stroke-width="1.5" />
      
      <!-- Long Legs -->
      <path d="M-20,8 L-20,105 C-20,108 -18,110 -15,110 C-12,110 -10,108 -10,105 L-10,18 L0,18 L10,18 L10,105 C10,108 12,110 15,110 C18,110 20,108 20,105 L20,8 Z" fill="#5C93D6" />
      <!-- Cuff Highlights -->
      <path d="M-20,102 L-10,102" stroke="#7BA9E8" stroke-width="2" />
      <path d="M10,102 L20,102" stroke="#7BA9E8" stroke-width="2" />
    </g>

    <!-- Scale Comparison Indicators (Tailor's style bracket & accent) -->
    <g transform="translate(0, 0)">
      <!-- Short Bracket Left -->
      <path d="M38,95 L32,95 L32,155 L38,155" fill="none" stroke="#FFA726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="32" cy="125" r="3" fill="#FFA726" />

      <!-- Long Bracket Right -->
      <path d="M202,65 L208,65 L208,185 L202,185" fill="none" stroke="#FFA726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="208" cy="125" r="3" fill="#FFA726" />
      
      <!-- Center comparison indicator icon (Modern sleek ruler / adjustment node) -->
      <g transform="translate(120, 135)">
        <rect x="-14" y="-8" width="28" height="16" rx="4" fill="#2A303C" stroke="#FFA726" stroke-width="2"/>
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
        <circle cx="-8" cy="0" r="1.5" fill="#1A1D24"/>
        <circle cx="8" cy="0" r="1.5" fill="#1A1D24"/>
      </g>
    </g>
  </g>
</svg>