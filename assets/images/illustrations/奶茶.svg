<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow and energetic aura elements (referencing the 'refreshment' context) -->
  <g opacity="0.3">
    <circle cx="120" cy="120" r="75" fill="#FFB74D" filter="blur(16px)"/>
  </g>

  <!-- Bubble Tea Cup Base Group -->
  <g transform="translate(0, 5)">
    <!-- Wide straw sticking out -->
    <path d="M125 40 L155 90 L145 95 L118 45 Z" fill="#E0E0E0" opacity="0.9"/>
    <path d="M125 40 L135 40 L145 45 L135 45 Z" fill="#B0BEC5"/> <!-- Straw opening tip -->

    <!-- Sealing Lid -->
    <path d="M85 75 C85 70 95 68 120 68 C145 68 155 70 155 75 C155 80 145 82 120 82 C95 82 85 80 85 75 Z" fill="#FF7043"/>
    
    <!-- Translucent Cup Body -->
    <path d="M90 82 L100 180 C100 185 105 188 110 188 L130 188 C135 188 140 185 140 180 L150 82 Z" fill="#2C313C" stroke="#3A4150" stroke-width="2"/>
    
    <!-- Milk Tea Liquid Fill -->
    <path d="M92 95 L99 178 C99 182 103 185 108 185 L132 185 C137 185 141 182 141 178 L148 95 Z" fill="#D7CCC8"/>

    <!-- Tea Gradient / Rich Layer -->
    <path d="M92 95 L95 120 C110 125 130 125 145 120 L148 95 Z" fill="#8D6E63" opacity="0.7"/>

    <!-- Tapioca Pearls (Boba) at the bottom -->
    <g fill="#3E2723">
      <circle cx="112" cy="176" r="6"/>
      <circle cx="128" cy="178" r="6.5"/>
      <circle cx="102" cy="172" r="5.5"/>
      <circle cx="138" cy="173" r="5"/>
      <circle cx="120" cy="180" r="6"/>
      <circle cx="119" cy="167" r="5.5"/>
      <circle cx="107" cy="164" r="5"/>
      <circle cx="133" cy="165" r="5.5"/>
    </g>

    <!-- Cup Highlight for glossy plastic effect -->
    <path d="M96 90 L102 165" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  </g>

  <!-- Energy / Refreshment sparkles (Contextual tie-in: 提提神) -->
  <g fill="#FFB74D">
    <!-- Top-left sparkle -->
    <path d="M70 70 Q70 85 55 85 Q70 85 70 100 Q70 85 85 85 Q70 85 70 70 Z"/>
    <!-- Top-right sparkle -->
    <path d="M180 90 Q180 100 170 100 Q180 100 180 110 Q180 100 190 100 Q180 100 180 90 Z"/>
    <!-- Small star accent -->
    <circle cx="62" cy="130" r="2.5" opacity="0.8"/>
    <circle cx="178" cy="145" r="2" opacity="0.6"/>
  </g>
</svg>