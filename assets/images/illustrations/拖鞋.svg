<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Doorway/Entryway Area -->
  <path d="M40 200 L40 40 L200 40 L200 200 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="110" y="80" width="20" height="120" fill="#1e293b" opacity="0.5"/>
  
  <!-- Shoe Rack -->
  <rect x="45" y="150" width="60" height="40" rx="4" fill="#475569"/>
  <rect x="45" y="165" width="60" height="5" fill="#334155"/>
  
  <!-- Outdoor Shoes (Left) -->
  <path d="M55 155 L75 155 L78 162 L52 162 Z" fill="#fb923c"/>
  
  <!-- Indoor Slippers (Right - The Focus) -->
  <g id="slippers">
    <path d="M130 170 L150 170 L152 185 L128 185 Z" fill="#38bdf8"/>
    <path d="M160 175 L180 175 L182 190 L158 190 Z" fill="#38bdf8"/>
    <ellipse cx="140" cy="175" rx="8" ry="4" fill="#bae6fd"/>
    <ellipse cx="170" cy="180" rx="8" ry="4" fill="#bae6fd"/>
  </g>
  
  <!-- Character Legs/Feet -->
  <g id="character">
    <path d="M140 120 L140 170" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M170 120 L170 175" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Pants -->
    <rect x="130" y="100" width="20" height="30" fill="#f59e0b"/>
    <rect x="160" y="100" width="20" height="30" fill="#f59e0b"/>
  </g>
  
  <!-- Ambient Light/Warmth -->
  <circle cx="200" cy="40" r="30" fill="#fbbf24" opacity="0.1"/>
  <path d="M120 195 L180 195" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
</svg>