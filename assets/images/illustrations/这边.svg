<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor perspective line indicating physical space/direction -->
  <path d="M40 180 L200 180" stroke="#2A313C" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Directional path / floor guide pointing to "this side" (left-center focus) -->
  <path d="M70 180 Q100 140 130 180" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Exhibition entrance pillar / Gallery element on the right -->
  <rect x="180" y="80" width="30" height="90" rx="4" fill="#252A34"/>
  <rect x="185" y="90" width="20" height="40" rx="2" fill="#1E232D"/>
  
  <!-- Guide / Host character on the right gesturing toward "this side" -->
  <!-- Body / Torso -->
  <path d="M150 180 L150 135 C150 120 162 110 175 110 C188 110 200 120 200 135 L200 180 Z" fill="#3B82F6"/>
  <!-- Head -->
  <circle cx="175" cy="85" r="16" fill="#FDE047"/>
  <!-- Friendly smiling expression / Head tilt -->
  <path d="M170 87 Q175 92 180 87" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Guiding Arm (Pointing/gesturing to the left - "bên này / phía này") -->
  <path d="M160 125 L125 115" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="120" cy="114" r="7" fill="#FDE047"/>
  
  <!-- Direction indicator arrows floating gracefully, pointing to the designated side -->
  <g transform="translate(95, 100)">
    <path d="M15 0 L0 12 L15 24" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(75, 100)">
    <path d="M15 0 L0 12 L15 24" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
  
  <!-- Visitor / Guest character on the left looking toward the direction -->
  <!-- Body -->
  <path d="M60 180 L60 140 C60 128 70 118 82 118 C94 118 104 128 104 140 L104 180 Z" fill="#64748B"/>
  <!-- Head -->
  <circle cx="82" cy="94" r="14" fill="#CBD5E1"/>
  
  <!-- Ground spotlight / focal highlight at destination -->
  <ellipse cx="80" cy="180" rx="35" ry="10" fill="#F59E0B" opacity="0.15"/>
</svg>