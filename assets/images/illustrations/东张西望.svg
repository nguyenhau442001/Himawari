<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and lighting effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Streetlamp Cone Light -->
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Glow for Ambience -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND LAYER: Urban Street Scene -->
  <!-- Distant Building Silhouettes -->
  <path d="M 0 160 L 0 240 L 240 240 L 240 150 L 210 150 L 210 120 L 180 120 L 180 160 Z" fill="#1e293b"/>
  <rect x="15" y="130" width="22" height="110" fill="#162032"/>
  <rect x="45" y="110" width="30" height="130" fill="#162032"/>
  <rect x="85" y="95" width="35" height="145" fill="#162032"/>
  <rect x="130" y="125" width="25" height="115" fill="#162032"/>
  <rect x="195" y="105" width="30" height="135" fill="#162032"/>

  <!-- Building Windows (Glowing in dark mode) -->
  <g fill="#334155" opacity="0.6">
    <rect x="20" y="140" width="4" height="6"/><rect x="28" y="140" width="4" height="6"/>
    <rect x="20" y="155" width="4" height="6"/><rect x="28" y="155" width="4" height="6"/>
    <rect x="52" y="120" width="6" height="8"/><rect x="64" y="120" width="6" height="8"/>
    <rect x="52" y="135" width="6" height="8"/><rect x="64" y="135" width="6" height="8"/>
    <rect x="93" y="105" width="5" height="7"/><rect x="103" y="105" width="5" height="7"/>
    <rect x="93" y="120" width="5" height="7"/><rect x="103" y="120" width="5" height="7"/>
    <rect x="203" y="115" width="6" height="8"/><rect x="213" y="115" width="6" height="8"/>
  </g>

  <!-- Ground / Pavement -->
  <path d="M 0 195 Q 120 190 240 195 L 240 240 L 0 240 Z" fill="#0b1325"/>
  <!-- Pavement Edge Highlight -->
  <path d="M 0 195 Q 120 190 240 195" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Streetlamp Pole & Fixture (Left Side) -->
  <rect x="35" y="60" width="5" height="150" fill="#334155"/>
  <path d="M 37 60 L 37 40 L 50 35" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Lamp Housing -->
  <path d="M 42 35 L 58 35 L 52 45 L 48 45 Z" fill="#475569"/>
  <!-- Lamp Glow & Light Cone -->
  <polygon points="50,45 5,210 135,210" fill="url(#lightCone)"/>
  <circle cx="50" cy="45" r="8" fill="url(#lampGlow)"/>
  <circle cx="50" cy="45" r="3" fill="#fef08a"/>

  <!-- MIDGROUND LAYER: Character "Looking Around" (东张西望) -->
  <!-- Dynamic Action Lines / Gaze Indicator -->
  <g opacity="0.6" stroke-linecap="round">
    <!-- Left Looking Arc -->
    <path d="M 90 95 Q 75 90 70 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Right Looking Arc -->
    <path d="M 150 95 Q 165 90 170 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Question Marks suggesting "Searching / Looking for someone" -->
    <text x="165" y="75" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fbbf24" opacity="0.8">?</text>
    <text x="70" y="80" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fbbf24" opacity="0.6">?</text>
  </g>

  <!-- CHARACTER: Man standing, twisting body, looking left and right -->
  <!-- Shadow under feet -->
  <ellipse cx="120" cy="202" rx="22" ry="5" fill="#020617" opacity="0.6"/>

  <!-- Legs & Shoes -->
  <!-- Left Leg (tilted back) -->
  <path d="M 110 160 L 100 195 L 90 198" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Leg (stepping) -->
  <path d="M 130 160 L 135 194 L 146 197" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="88" cy="198" rx="7" ry="3" fill="#0f172a"/>
  <ellipse cx="148" cy="197" rx="8" ry="3" fill="#0f172a"/>

  <!-- Torso (Wearing a modern jacket/hoodie - e.g., orange/amber accent) -->
  <path d="M 104 115 L 136 115 L 142 165 L 98 165 Z" fill="#fb923c"/>
  <!-- Jacket Zipper / Details -->
  <line x1="120" y1="115" x2="120" y2="165" stroke="#c2410c" stroke-width="2"/>
  <!-- Inner shirt peek -->
  <path d="M 113 115 L 120 125 L 127 115 Z" fill="#f8fafc"/>

  <!-- Arms in active gesture (one hand shielding eyes/looking, one out) -->
  <!-- Left Arm (bent up near head) -->
  <path d="M 104 118 L 88 105 L 96 92" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Hand -->
  <circle cx="97" cy="90" r="4" fill="#fcd34d"/>

  <!-- Right Arm (reaching out/balancing) -->
  <path d="M 136 118 L 152 130 L 160 122" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Hand -->
  <circle cx="162" cy="120" r="4" fill="#fcd34d"/>

  <!-- Neck -->
  <rect x="114" y="106" width="12" height="12" fill="#fcd34d"/>

  <!-- Head (Turned sharply, adding dynamic tension) -->
  <circle cx="120" cy="94" r="17" fill="#fcd34d"/>
  
  <!-- Hair (Stylish dark hair cut) -->
  <path d="M 103 94 C 103 80, 110 77, 120 77 C 132 77, 137 83, 137 94 C 137 91, 133 82, 120 81 C 108 81, 103 91, 103 94 Z" fill="#0f172a"/>

  <!-- Facial Expression: Eyes wide open looking sideways, anxious/searching -->
  <!-- Glasses / Expressive Eyebrows -->
  <path d="M 110 88 Q 116 85 122 88" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 114 93 L 120 93" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <!-- Slightly open worried mouth -->
  <ellipse cx="118" cy="101" rx="3" ry="2" fill="#9a3412"/>

  <!-- FOREGROUND LAYER: Ambient details for depth -->
  <!-- Small park bench on the right side -->
  <g transform="translate(180, 160)">
    <!-- Bench Legs -->
    <rect x="5" y="15" width="3" height="15" fill="#334155"/>
    <rect x="35" y="15" width="3" height="15" fill="#334155"/>
    <!-- Bench Seat & Backrest -->
    <rect x="0" y="10" width="42" height="5" rx="2" fill="#475569"/>
    <rect x="0" y="2" width="42" height="6" rx="2" fill="#475569"/>
    <rect x="5" y="18" width="32" height="3" fill="#1e293b"/>
  </g>

  <!-- Potted plant / shrubbery on the left -->
  <circle cx="15" cy="195" r="14" fill="#065f46" opacity="0.8"/>
  <circle cx="25" cy="188" r="12" fill="#047857" opacity="0.9"/>
  <circle cx="10" cy="185" r="10" fill="#059669" opacity="0.7"/>

  <!-- Soft glowing highlights from streetlamp hitting the character -->
  <!-- Shoulder highlight -->
  <path d="M 104 115 L 112 115" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Head highlight -->
  <path d="M 110 82 C 114 80, 120 80, 124 82" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.5"/>
</svg>