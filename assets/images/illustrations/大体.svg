<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradient (Standing / Explaining) -->
    <linearGradient id="shirt1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradient (Sitting / Understanding) -->
    <linearGradient id="shirt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Light Beam for "Overview/Concept" Effect -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Light from Ceiling Lamp -->
  <circle cx="120" cy="0" r="140" fill="url(#lampGlow)"/>

  <!-- Background Environment: Office / Studio Interior -->
  <g id="environment">
    <!-- Back wall & floor line -->
    <rect x="0" y="0" width="240" height="175" fill="#1e293b"/>
    <rect x="0" y="175" width="240" height="65" fill="#0f172a"/>
    <line x1="0" y1="175" x2="240" y2="175" stroke="#334155" stroke-width="2"/>

    <!-- Window showing night city silhouette -->
    <rect x="150" y="25" width="60" height="90" rx="4" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <rect x="158" y="33" width="20" height="35" rx="2" fill="#1e293b" opacity="0.6"/>
    <rect x="182" y="33" width="20" height="50" rx="2" fill="#1e293b" opacity="0.6"/>
    <rect x="158" y="75" width="20" height="32" rx="2" fill="#1e293b" opacity="0.6"/>
    <!-- Window muntins -->
    <line x1="180" y1="25" x2="180" y2="115" stroke="#334155" stroke-width="2"/>
    <line x1="150" y1="70" x2="210" y2="70" stroke="#334155" stroke-width="2"/>

    <!-- Bookshelf with colorful abstract spines -->
    <rect x="20" y="30" width="45" height="90" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="60" x2="65" y2="60" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="90" x2="65" y2="90" stroke="#334155" stroke-width="2"/>
    <rect x="26" y="42" width="6" height="18" rx="1" fill="#f59e0b"/>
    <rect x="34" y="38" width="8" height="22" rx="1" fill="#10b981"/>
    <rect x="44" y="45" width="5" height="15" rx="1" fill="#38bdf8"/>
    <rect x="26" y="72" width="10" height="18" rx="1" fill="#ec4899"/>
    <rect x="38" y="68" width="7" height="22" rx="1" fill="#fb923c"/>

    <!-- Ceiling Lamp Fixture -->
    <path d="M110,0 L130,0 L125,25 L115,25 Z" fill="#475569"/>
    <line x1="120" y1="0" x2="120" y2="10" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="120" cy="25" rx="12" ry="4" fill="#fbbf24"/>
  </g>

  <!-- Central Working Desk -->
  <g id="desk" filter="url(#shadow)">
    <!-- Desk surface -->
    <path d="M70,135 L210,135 L225,165 L55,165 Z" fill="#334155"/>
    <!-- Desk front panel -->
    <rect x="55" y="165" width="170" height="12" fill="#1e293b"/>
    <!-- Desk legs -->
    <rect x="75" y="177" width="8" height="35" fill="#0f172a"/>
    <rect x="205" y="177" width="8" height="35" fill="#0f172a"/>

    <!-- Desk Props: Laptop & Documents (representing "the matter / the project") -->
    <!-- Laptop Base -->
    <path d="M120,140 L160,140 L168,152 L112,152 Z" fill="#94a3b8"/>
    <!-- Laptop Screen -->
    <path d="M121,120 L159,120 L160,140 L120,140 Z" fill="#cbd5e1"/>
    <rect x="125" y="124" width="30" height="12" rx="1" fill="#0f172a"/>
    <!-- Chart lines on laptop screen simulating a project/overview -->
    <polyline points="128,132 135,128 142,130 152,126" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Organized Papers / Project Folder -->
    <path d="M85,143 L110,140 L115,155 L90,158 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="92" y1="147" x2="105" y2="146" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="92" y1="151" x2="102" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Big Picture / Concept Light Beam (Visualizing "Overview / Understanding the gist") -->
  <polygon points="125,50 165,135 85,135" fill="url(#lightBeam)" style="mix-blend-mode: screen;"/>
  <!-- Floating conceptual mind-map nodes (Abstracting "overall grasp") -->
  <g opacity="0.85">
    <circle cx="125" cy="85" r="4" fill="#38bdf8" filter="url(#shadow)"/>
    <circle cx="105" cy="105" r="3" fill="#f59e0b" filter="url(#shadow)"/>
    <circle cx="145" cy="100" r="3.5" fill="#10b981" filter="url(#shadow)"/>
    <line x1="125" y1="85" x2="105" y2="105" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="125" y1="85" x2="145" y2="100" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Character 1: Explaining / Presenting (Standing Left) -->
  <g id="character-standing" filter="url(#shadow)">
    <!-- Legs -->
    <rect x="68" y="170" width="8" height="40" fill="#334155"/>
    <rect x="82" y="170" width="8" height="40" fill="#334155"/>
    <!-- Shoes -->
    <ellipse cx="72" cy="210" rx="6" ry="3" fill="#0f172a"/>
    <ellipse cx="86" cy="210" rx="6" ry="3" fill="#0f172a"/>

    <!-- Torso / Shirt -->
    <path d="M68,125 L92,125 L96,172 L64,172 Z" fill="url(#shirt1)"/>
    <!-- Arms -->
    <!-- Left arm resting -->
    <path d="M66,128 L56,155 L63,158 L70,135" fill="#0284c7"/>
    <!-- Right arm gesturing toward the desk/overview -->
    <path d="M94,128 L115,142 L112,148 L93,136" fill="#38bdf8"/>

    <!-- Head & Hair -->
    <circle cx="80" cy="108" r="15" fill="#fde047"/> <!-- Skin tone -->
    <!-- Hair (Dark stylish cut) -->
    <path d="M65,108 C65,96 72,92 82,92 C92,92 97,98 95,110 C92,104 88,100 80,100 C72,100 68,104 65,108 Z" fill="#1e293b"/>
    <!-- Facial expression: Confident, friendly smile -->
    <path d="M76,112 Q80,116 84,112" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="76" cy="107" r="1.5" fill="#1e293b"/>
    <circle cx="84" cy="107" r="1.5" fill="#1e293b"/>
  </g>

  <!-- Character 2: Listening & Understanding (Sitting Right) -->
  <g id="character-sitting" filter="url(#shadow)">
    <!-- Chair -->
    <rect x="160" y="150" width="28" height="35" rx="4" fill="#475569"/>
    <rect x="168" y="185" width="4" height="25" fill="#334155"/>
    <rect x="178" y="185" width="4" height="25" fill="#334155"/>

    <!-- Body & Torso -->
    <path d="M152,118 L178,118 L182,160 L150,160 Z" fill="url(#shirt2)"/>

    <!-- Arms -->
    <!-- Left arm leaning on desk -->
    <path d="M154,122 L135,138 L140,144 L160,128" fill="#be123c"/>
    <!-- Right arm relaxed -->
    <path d="M176,122 L185,145 L178,148 L170,130" fill="#e11d48"/>

    <!-- Head & Hair -->
    <circle cx="166" cy="102" r="14" fill="#fde047"/>
    <!-- Hair (Bob cut, warm brown) -->
    <path d="M152,100 C152,90 160,86 168,86 C176,86 182,92 181,106 C179,102 176,96 168,96 C160,96 155,100 152,100 Z" fill="#78350f"/>
    <!-- Facial expression: Nodding/Understanding, bright eyes & slight smile -->
    <path d="M162,107 Q166,111 170,107" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Satisfied/Understanding gentle closed/creased eyes -->
    <path d="M160,101 Q163,99 165,101" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M168,101 Q171,99 173,101" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- "Aha!" / Comprehension glowing indicator above head -->
    <g transform="translate(180, 75)">
      <circle cx="0" cy="0" r="10" fill="#fbbf24" opacity="0.9"/>
      <path d="M-3,3 L0,-4 L3,3 M-2,1 L2,1" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Potted plant for depth) -->
  <g id="foreground-plant">
    <path d="M15,190 C15,175 28,175 28,190 L25,225 L18,225 Z" fill="#475569" filter="url(#shadow)"/>
    <ellipse cx="21.5" cy="190" rx="6.5" ry="2" fill="#64748b"/>
    <!-- Plant stems & leaves -->
    <path d="M21,188 Q10,165 5,170" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M22,188 Q30,150 40,155" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M21,188 Q20,155 18,150" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>