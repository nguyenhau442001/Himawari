<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Baseline branch context (Tree structure fading into abstraction) -->
    <path d="M 60 170 Q 100 170 140 140 T 190 90" fill="none" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Primary branching mechanism (Visualizing "nhánh", "lượng từ" division and categorization) -->
    <!-- Main stem point -->
    <circle cx="120" cy="155" r="4" fill="#4A5568"/>
    
    <!-- Escalation / Progression / Categorization pathways (Abstract grammar/measure word mapping) -->
    <!-- Branch 1: Upward escalation -->
    <path d="M 120 155 C 120 120, 150 90, 175 75" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="175" cy="75" r="6" fill="#DD6B20"/>
    
    <!-- Branch 2: Diverging perspective (Unit / Measure concept) -->
    <path d="M 120 155 C 100 130, 80 115, 65 110" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="65" cy="110" r="5" fill="#DD6B20"/>

    <!-- Branch 3: Detailed structural extension -->
    <path d="M 145 138 C 160 130, 175 130, 190 125" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="190" cy="125" r="4" fill="#CBD5E0"/>

    <!-- Focal point: Precision magnifier / categorization node analyzing units (lượng từ / abstract classifier) -->
    <circle cx="120" cy="115" r="28" fill="#252A34" stroke="#F6AD55" stroke-width="3"/>
    <line x1="139" y1="134" x2="155" y2="150" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>

    <!-- Abstract parsed elements inside the lens (Structured individual units) -->
    <line x1="110" y1="105" x2="130" y2="105" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="110" y1="115" x2="125" y2="115" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="110" y1="125" x2="120" y2="125" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Structural nodes representing distinct discrete entities (flowers/branches counted) -->
    <g transform="translate(0, -5)">
      <!-- Unit 1 -->
      <path d="M 65 95 C 65 90, 70 85, 75 90 C 70 95, 65 95, 65 95 Z" fill="#F6AD55"/>
      <path d="M 65 95 Q 60 90 55 95" fill="none" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>

      <!-- Unit 2 -->
      <path d="M 175 60 C 175 55, 180 50, 185 55 C 180 60, 175 60, 175 60 Z" fill="#F6AD55"/>
      <path d="M 175 60 Q 170 50 165 45" fill="none" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>