<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="80" r="110" fill="url(#lamp-glow)" pointer-events="none" />

  <!-- Background Room Elements -->
  <!-- Shelf in background -->
  <rect x="35" y="45" width="60" height="6" rx="3" fill="#334155" />
  <rect x="45" y="25" width="14" height="20" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="63" y="28" width="18" height="17" rx="2" fill="#ec4899" opacity="0.8" />
  <rect x="84" y="22" width="10" height="23" rx="2" fill="#10b981" opacity="0.8" />

  <!-- Hanging Plant Pot -->
  <path d="M190,30 L200,30 L198,45 L192,45 Z" fill="#64748b" />
  <path d="M185,25 C185,20 205,20 205,25 Z" fill="#10b981" />
  <path d="M195,10 L195,30" stroke="#475569" stroke-width="1.5" />
  <circle cx="180" cy="22" r="6" fill="#10b981" />
  <circle cx="210" cy="24" r="7" fill="#10b981" />
  <circle cx="195" cy="18" r="8" fill="#34d399" />

  <!-- Wooden Desk Surface -->
  <path d="M20,165 L220,165 L230,220 L10,220 Z" fill="url(#table-grad)" filter="url(#shadow)" />
  <rect x="15" y="158" width="210" height="8" rx="4" fill="#64748b" />

  <!-- Desk Lamp Arm (Top Right) -->
  <path d="M190,80 L160,110 L175,130" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M165,65 L195,85 L180,95 L150,75 Z" fill="#94a3b8" />
  <circle cx="170" cy="77" r="8" fill="#fbbf24" />

  <!-- SCENE: Crafting / Gluing Paper (Dán giấy bằng hồ) -->

  <!-- Paper being glued down -->
  <g transform="rotate(-8 100 135)" filter="url(#shadow)">
    <!-- Base Paper Sheet -->
    <polygon points="60,110 140,100 145,150 65,160" fill="#f8fafc" />
    <!-- Origami/Decorative shape folded over -->
    <polygon points="60,110 100,105 90,135 65,160" fill="#e2e8f0" />
    <!-- Glowing Paste/Glue layer application spot (Target concept: 糊) -->
    <path d="M95,120 Q115,115 125,135 Q105,145 95,130 Z" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Secondary Paper Sheet (being aligned) -->
  <g transform="rotate(12 130 140)" filter="url(#shadow)">
    <polygon points="100,120 160,115 155,165 95,170" fill="#cbd5e1" opacity="0.95" />
    <!-- Wet paste glistening edge -->
    <path d="M110,130 Q130,125 140,140 Q120,150 110,130 Z" fill="#fef3c7" />
  </g>

  <!-- The Paste Jar (Container of 浆糊) -->
  <g transform="translate(45, 125)" filter="url(#shadow)">
    <!-- Jar Body -->
    <path d="M10,15 L20,5 L35,5 L45,15 L40,40 C40,45 15,45 15,40 Z" fill="#cbd5e1" />
    <!-- Jar Lid Open -->
    <path d="M18,3 L37,3 L37,-2 L18,-2 Z" fill="#64748b" />
    <line x1="27" y1="-2" x2="27" y2="-7" stroke="#64748b" stroke-width="2" />
    <!-- Paste Inside Jar (Visible top surface) -->
    <ellipse cx="27.5" cy="15" rx="10" ry="3" fill="#fbbf24" />
    <!-- Sticky Paste Drip on Jar Side -->
    <path d="M36,25 Q41,28 39,33 Q36,31 35,27 Z" fill="#f59e0b" />
    <!-- Wooden Brush / Stick dipped in paste -->
    <path d="M22,35 L33,-12 L37,-12 L30,35 Z" fill="#d97706" />
  </g>

  <!-- CHARACTER: Enthusiastic Crafter / Student -->
  <!-- Character Body / Torso -->
  <path d="M110,220 C110,180 130,170 145,170 C160,170 180,180 180,220 Z" fill="#38bdf8" />
  <!-- Collar -->
  <path d="M130,170 L145,185 L160,170 Z" fill="#f8fafc" />

  <!-- Neck -->
  <rect x="137" y="152" width="16" height="22" rx="6" fill="#fcd34d" />

  <!-- Head -->
  <circle cx="145" cy="132" r="26" fill="#fcd34d" />

  <!-- Hair Style -->
  <path d="M120,130 C118,110 135,104 145,104 C155,104 172,112 170,132 C170,132 172,118 160,114 C150,110 135,112 124,120 Z" fill="#0f172a" />
  <circle cx="123" cy="128" r="5" fill="#0f172a" />
  <circle cx="166" cy="130" r="4" fill="#0f172a" />

  <!-- Facial Expression (Focused & Happy) -->
  <circle cx="137" cy="130" r="2.5" fill="#1e293b" />
  <circle cx="153" cy="130" r="2.5" fill="#1e293b" />
  <!-- Cheeks -->
  <circle cx="134" cy="136" r="4" fill="#f43f5e" opacity="0.35" />
  <circle cx="156" cy="136" r="4" fill="#f43f5e" opacity="0.35" />
  <!-- Smile -->
  <path d="M141,138 Q145,143 149,138" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- Arms and Hands actively applying glue -->
  <!-- Left arm holding paper edge steady -->
  <path d="M120,180 L95,160 L105,150" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="100" cy="153" r="6" fill="#fcd34d" />

  <!-- Right arm holding application brush / finger pointing down -->
  <path d="M165,180 L140,155 L130,140" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="127" cy="138" r="6" fill="#fcd34d" />

  <!-- Small details on desk: Additional crafting tools -->
  <circle cx="185" cy="185" r="12" fill="#ef4444" opacity="0.9" filter="url(#shadow)" /> <!-- Scissors handle -->
  <circle cx="185" cy="185" r="5" fill="#334155" />
  <path d="M178,195 L170,210" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M192,195 L200,210" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

  <!-- Extra loose paper snippets on desk -->
  <polygon points="80,180 110,175 115,190 85,195" fill="#ffffff" opacity="0.7" />
  <polygon points="140,190 165,185 170,200 145,205" fill="#38bdf8" opacity="0.6" />

</svg>