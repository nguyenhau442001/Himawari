<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Strategic map / radar grid subtle accent) -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#262B35" stroke-width="1"/>
  <line x1="120" y1="35" x2="120" y2="205" stroke="#262B35" stroke-width="1"/>
  <line x1="35" y1="120" x2="205" y2="120" stroke="#262B35" stroke-width="1"/>

  <!-- Commander Character / Icon Representation (司令 - Military Commander) -->
  <g transform="translate(0, 5)">
    <!-- Shoulders & Uniform Body -->
    <path d="M 80,185 L 80,155 C 80,140 95,125 120,125 C 145,125 160,140 160,155 L 160,185 Z" fill="#2E3646"/>
    <path d="M 95,185 L 95,150 C 95,142 105,135 120,135 C 135,135 145,142 145,150 L 145,185 Z" fill="#1E232D"/>
    
    <!-- Uniform Collar & Tie / Insignia -->
    <polygon points="120,140 105,160 135,160" fill="#F59E0B"/>
    <rect x="116" y="160" width="8" height="25" fill="#D97706"/>

    <!-- Epaulets (Shoulder Stars indicating high rank) -->
    <polygon points="80,138 95,133 92,145 79,145" fill="#FBBF24"/>
    <polygon points="160,138 145,133 148,145 161,145" fill="#FBBF24"/>
    
    <!-- Neck -->
    <rect x="110" y="112" width="20" height="20" fill="#E5E7EB"/>

    <!-- Head / Face silhouette -->
    <path d="M 98,90 C 98,70 107,62 120,62 C 133,62 142,70 142,90 L 142,105 C 142,118 133,122 120,122 C 107,122 98,118 98,105 Z" fill="#F3F4F6"/>

    <!-- Cap Peak / Visor -->
    <path d="M 92,72 L 148,72 L 154,65 L 86,65 Z" fill="#111827"/>
    
    <!-- Military Cap Body -->
    <path d="M 95,65 C 95,45 102,40 120,40 C 138,40 145,45 145,65 Z" fill="#374151"/>
    
    <!-- Cap Badge / Gold Accents -->
    <ellipse cx="120" cy="55" rx="8" ry="5" fill="#F59E0B"/>
    <circle cx="120" cy="55" r="3" fill="#B45309"/>

    <!-- Star symbol on chest (Commander status) -->
    <polygon points="120,145 122,151 128,151 123,155 125,161 120,157 115,161 117,155 112,151 118,151" fill="#FEF3C7"/>
  </g>

  <!-- Focus / Authority Accent Glow (Golden halo / frame accents) -->
  <path d="M 70,80 L 65,75 M 170,80 L 175,75" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
</svg>