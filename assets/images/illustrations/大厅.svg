<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Floor and Walls of the Grand Lobby -->
  <!-- Floor -->
  <polygon points="20,185 220,185 200,210 40,210" fill="#222730"/>
  <!-- Floor tile perspective lines -->
  <line x1="70" y1="185" x2="60" y2="210" stroke="#2B313D" stroke-width="1.5"/>
  <line x1="120" y1="185" x2="120" y2="210" stroke="#2B313D" stroke-width="1.5"/>
  <line x1="170" y1="185" x2="180" y2="210" stroke="#2B313D" stroke-width="1.5"/>

  <!-- Back wall -->
  <rect x="20" y="45" width="200" height="140" fill="#252B36"/>

  <!-- Large Architectural Pillars -->
  <rect x="20" y="45" width="22" height="140" fill="#2D3442"/>
  <rect x="198" y="45" width="22" height="140" fill="#2D3442"/>
  <rect x="16" y="40" width="30" height="8" rx="2" fill="#353D4D"/>
  <rect x="194" y="40" width="30" height="8" rx="2" fill="#353D4D"/>

  <!-- Background Reception Desk / Counter -->
  <rect x="85" y="135" width="70" height="40" rx="4" fill="#323A4A"/>
  <rect x="80" y="130" width="80" height="8" rx="2" fill="#F5A623"/>

  <!-- Modern Grand Chandelier hanging from ceiling -->
  <line x1="120" y1="25" x2="120" y2="55" stroke="#3E475A" stroke-width="2"/>
  <ellipse cx="120" cy="55" rx="35" ry="12" fill="none" stroke="#F5A623" stroke-width="2"/>
  <!-- Chandelier lights -->
  <circle cx="95" cy="58" r="3" fill="#FFE194"/>
  <circle cx="120" cy="62" r="3" fill="#FFE194"/>
  <circle cx="145" cy="58" r="3" fill="#FFE194"/>
  <circle cx="107" cy="53" r="2.5" fill="#FFE194"/>
  <circle cx="133" cy="53" r="2.5" fill="#FFE194"/>

  <!-- Waiting area (Armchair) -->
  <path d="M50,150 C50,140 60,135 70,135 C80,135 90,140 90,150 L90,175 L50,175 Z" fill="#3A4456"/>
  <path d="M45,155 C42,155 40,158 40,165 C40,172 45,175 48,175 L92,175 C95,175 100,172 100,165 C100,158 98,155 95,155 Z" fill="#2D3442"/>
  <rect x="53" y="175" width="4" height="10" fill="#F5A623"/>
  <rect x="83" y="175" width="4" height="10" fill="#F5A623"/>

  <!-- Elegant Tall Plant (Potted Palm/Ficus in lobby) -->
  <rect x="180" y="150" width="12" height="35" rx="3" fill="#3A4456"/>
  <ellipse cx="186" cy="148" rx="16" ry="8" fill="#2E7D32"/>
  <path d="M186,140 Q160,120 170,105 Q190,125 186,140 Z" fill="#4CAF50"/>
  <path d="M186,140 Q210,120 200,105 Q180,125 186,140 Z" fill="#4CAF50"/>
  <path d="M186,140 Q186,110 186,95 Q186,110 186,140 Z" fill="#66BB6A"/>

  <!-- Glass Entrance Doors in the background center -->
  <rect x="105" y="85" width="30" height="50" fill="#1E232C" stroke="#3A4456" stroke-width="2"/>
  <line x1="120" y1="85" x2="120" y2="135" stroke="#3A4456" stroke-width="2"/>
  <circle cx="114" cy="110" r="2" fill="#F5A623"/>
  <circle cx="126" cy="110" r="2" fill="#F5A623"/>

  <!-- Focal Accent Lighting / Glows -->
  <circle cx="120" cy="55" r="25" fill="#F5A623" opacity="0.1" filter="blur(8px)"/>
</svg>