<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="150" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Old Concept: Vintage Typewriter -->
  <g transform="translate(50, 100)">
    <rect x="0" y="30" width="60" height="20" rx="4" fill="#94a3b8"/>
    <rect x="10" y="10" width="40" height="20" rx="2" fill="#64748b"/>
    <circle cx="20" cy="40" r="4" fill="#fb923c"/>
    <circle cx="40" cy="40" r="4" fill="#fb923c"/>
  </g>
  
  <!-- New Concept: Sleek Tablet/Laptop -->
  <g transform="translate(130, 90)">
    <rect x="0" y="20" width="70" height="50" rx="4" fill="#38bdf8"/>
    <rect x="5" y="25" width="60" height="40" rx="2" fill="#0f172a"/>
    <rect x="15" y="35" width="40" height="4" rx="1" fill="#38bdf8"/>
    <rect x="15" y="45" width="30" height="4" rx="1" fill="#38bdf8"/>
  </g>
  
  <!-- Character: Young person interacting with both -->
  <g transform="translate(100, 130)">
    <!-- Body -->
    <path d="M20 80 L60 80 L55 40 L25 40 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="40" cy="30" r="15" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M25 30 Q40 10 55 30" fill="#fbbf24"/>
    <!-- Hands -->
    <circle cx="25" cy="50" r="6" fill="#fde68a"/>
    <circle cx="55" cy="50" r="6" fill="#fde68a"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="40" r="3" fill="#10b981"/>
  <path d="M40 50 L50 40" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M190 120 L200 110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>