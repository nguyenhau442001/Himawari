<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for the ancient pagoda -->
  <circle cx="120" cy="120" r="80" fill="#2A3241" opacity="0.4"/>

  <!-- Ancient Pagoda (representing "现存" - surviving historic wooden structure) -->
  <g transform="translate(0, 5)">
    <!-- Base / Foundation -->
    <path d="M95 195 L145 195 L140 205 L100 205 Z" fill="#4A5568"/>
    <rect x="105" y="185" width="30" height="10" fill="#718096"/>

    <!-- Tier 1 (Bottom) -->
    <path d="M85 185 L155 185 L165 175 L75 175 Z" fill="#D69E2E"/>
    <rect x="95" y="150" width="50" height="25" fill="#C53030"/>
    <rect x="100" y="155" width="10" height="15" fill="#1A1D24"/>
    <rect x="130" y="155" width="10" height="15" fill="#1A1D24"/>
    <line x1="90" y1="185" x2="150" y2="185" stroke="#9B2C2C" stroke-width="2"/>

    <!-- Tier 2 (Middle) -->
    <path d="M80 150 L160 150 L168 140 L72 140 Z" fill="#D69E2E"/>
    <rect x="100" y="120" width="40" height="20" fill="#C53030"/>
    <rect x="112" y="125" width="16" height="12" fill="#1A1D24"/>
    <line x1="85" y1="150" x2="155" y2="150" stroke="#9B2C2C" stroke-width="2"/>

    <!-- Tier 3 (Top) -->
    <path d="M88 120 L152 120 L158 112 L82 112 Z" fill="#D69E2E"/>
    <rect x="107" y="95" width="26" height="17" fill="#C53030"/>
    <rect x="114" y="100" width="12" height="10" fill="#1A1D24"/>
    <line x1="93" y1="120" x2="147" y2="120" stroke="#9B2C2C" stroke-width="2"/>

    <!-- Spire / Roof Top -->
    <path d="M96 95 L144 95 L120 70 Z" fill="#D69E2E"/>
    <line x1="120" y1="70" x2="120" y2="55" stroke="#ECC94B" stroke-width="3"/>
    <circle cx="120" cy="53" r="3" fill="#ECC94B"/>
  </g>

  <!-- Accent glow emphasizing preservation/survival against time -->
  <circle cx="120" cy="130" r="65" stroke="#ECC94B" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
</svg>