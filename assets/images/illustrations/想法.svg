<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "想法" (Idea/Thought) as a physical object: A glowing lightbulb representing a clear idea inside a sleek modern head/mind silhouette, perfectly centered -->
  
  <g transform="translate(120, 115)">
    <!-- Head silhouette backglow / subtle aura -->
    <path d="M-30,45 C-30,15 -15,5 0,5 C15,5 30,15 30,45 C30,75 25,85 25,95 C25,100 20,105 15,105 C10,105 5,100 5,95 L-5,95 C-5,100 -10,105 -15,105 C-20,105 -25,100 -25,95 C-25,85 -30,75 -30,45 Z" fill="#252A34" opacity="0.6"/>

    <!-- Brain / Thought process network lines -->
    <path d="M-15,35 Q-20,25 -10,15 Q0,5 10,15 Q20,25 15,35" fill="none" stroke="#3E4553" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-12" cy="22" r="2.5" fill="#3E4553"/>
    <circle cx="12" cy="22" r="2.5" fill="#3E4553"/>

    <!-- Central Idea: The Lightbulb Object -->
    <!-- Glow effect -->
    <circle cx="0" cy="-25" r="32" fill="#F5A623" opacity="0.12"/>
    <circle cx="0" cy="-25" r="22" fill="#F5A623" opacity="0.2"/>

    <!-- Bulb glass -->
    <path d="M-14,-25 C-14,-37 -7,-44 0,-44 C7,-44 14,-37 14,-25 C14,-17 9,-11 6,-7 L6,-2 L-6,-2 L-6,-7 C-9,-11 -14,-17 -14,-25 Z" fill="#FFC542"/>

    <!-- Bulb filament -->
    <path d="M-3,-22 L0,-28 L3,-22" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-28" x2="0" y2="-17" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>

    <!-- Bulb base (screw threads) -->
    <rect x="-5" y="-1" width="10" height="4" rx="1" fill="#8C94A0"/>
    <rect x="-5" y="4" width="10" height="4" rx="1" fill="#8C94A0"/>
    <path d="M-4,8 L4,8 C4,10 2,12 0,12 C-2,12 -4,10 -4,8 Z" fill="#686F7C"/>

    <!-- Head silhouette foreground (chin, neck, shoulder base) -->
    <path d="M-32,55 C-32,25 -18,10 0,10 C18,10 32,25 32,55 C32,80 28,92 28,102 C28,108 22,112 16,112 L-16,112 C-22,112 -28,108 -28,102 C-28,92 -32,80 -32,55 Z" fill="#2D3340"/>

    <!-- Neck and collar highlight to give depth -->
    <path d="M-16,112 L16,112 C24,112 36,120 48,135 C20,135 -20,135 -48,135 C-36,120 -24,112 -16,112 Z" fill="#1F242D"/>
  </g>

  <!-- Accent sparkling ideas floating outward (representing creative insight) -->
  <g transform="translate(120, 115)">
    <!-- Sparkle 1 (Top Left) -->
    <path d="M-45,-45 L-41,-45 C-41,-45 -41,-49 -41,-49 C-41,-49 -41,-45 -41,-45 L-37,-45 C-37,-45 -41,-45 -41,-45 C-41,-45 -41,-41 -41,-41 C-41,-41 -41,-45 -41,-45 Z" fill="#FFC542"/>
    
    <!-- Sparkle 2 (Top Right) -->
    <path d="M45,-35 L48,-35 C48,-35 48,-38 48,-38 C48,-38 48,-35 48,-35 L51,-35 C51,-35 48,-35 48,-35 C48,-35 48,-32 48,-32 C48,-32 48,-35 48,-35 Z" fill="#FFC542"/>

    <!-- Sparkle 3 (Far Left) -->
    <path d="M-60,-10 L-57,-10 C-57,-10 -57,-13 -57,-13 C-57,-13 -57,-10 -57,-10 L-54,-10 C-54,-10 -57,-10 -57,-10 C-57,-10 -57,-7 -57,-7 C-57,-7 -57,-10 -57,-10 Z" fill="#FFC542" opacity="0.7"/>

    <!-- Sparkle 4 (Far Right) -->
    <path d="M58,-5 L61,-5 C61,-5 61,-8 61,-8 C61,-8 61,-5 61,-5 L64,-5 C64,-5 61,-5 61,-5 C61,-5 61,-2 61,-2 C61,-2 61,-5 61,-5 Z" fill="#FFC542" opacity="0.7"/>
  </g>
</svg>