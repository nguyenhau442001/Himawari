<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow -->
  <circle cx="120" cy="120" r="80" fill="#2563EB" opacity="0.08"/>

  <!-- Browser Window / Web Page (网页) Object -->
  <g transform="translate(40, 48)">
    <!-- Window Drop Shadow -->
    <rect x="2" y="6" width="160" height="136" rx="10" fill="#0D0F12" opacity="0.5"/>
    
    <!-- Main Window Body -->
    <rect x="0" y="0" width="160" height="136" rx="10" fill="#222730" stroke="#374151" stroke-width="2"/>
    
    <!-- Title Bar -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 150 0 A 10 10 0 0 1 160 0 L 160 28 L 0 28 Z" fill="#2D3542"/>
    
    <!-- Window Control Dots -->
    <circle cx="14" cy="14" r="3.5" fill="#EF4444"/>
    <circle cx="26" cy="14" r="3.5" fill="#F59E0B"/>
    <circle cx="38" cy="14" r="3.5" fill="#10B981"/>
    
    <!-- Address Bar -->
    <rect x="52" y="7" width="86" height="14" rx="4" fill="#1A1D24"/>
    <circle cx="59" cy="14" r="2" fill="#6B7280"/>
    <rect x="67" y="12" width="40" height="4" rx="2" fill="#6B7280" opacity="0.6"/>

    <!-- Content Area (Web Page elements) -->
    <!-- Hero Image Placeholder -->
    <rect x="16" y="44" width="72" height="48" rx="6" fill="#3B82F6" opacity="0.2"/>
    <circle cx="36" cy="62" r="8" fill="#3B82F6" opacity="0.4"/>
    <path d="M 22 82 L 42 66 L 58 78 L 78 62 L 88 74 L 88 84 L 22 84 Z" fill="#3B82F6" opacity="0.3"/>

    <!-- Text Lines Placeholder -->
    <rect x="100" y="46" width="44" height="6" rx="3" fill="#F3F4F6" opacity="0.9"/>
    <rect x="100" y="58" width="30" height="4" rx="2" fill="#6B7280" opacity="0.7"/>
    <rect x="100" y="66" width="38" height="4" rx="2" fill="#6B7280" opacity="0.7"/>

    <!-- Additional Content Blocks -->
    <rect x="16" y="104" width="38" height="20" rx="4" fill="#374151" opacity="0.6"/>
    <rect x="61" y="104" width="38" height="20" rx="4" fill="#374151" opacity="0.6"/>
    <rect x="106" y="104" width="38" height="20" rx="4" fill="#374151" opacity="0.6"/>
  </g>

  <!-- Focus Cursor / Pointer interacting with the Web Page -->
  <g transform="translate(145, 120)">
    <!-- Cursor Shadow -->
    <path d="M2 2L10 24L15 17L22 16L2 2Z" fill="#000000" opacity="0.3"/>
    <!-- Main Cursor -->
    <path d="M0 0L8 22L13 15L20 14L0 0Z" fill="#F59E0B" stroke="#1A1D24" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>