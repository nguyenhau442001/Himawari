<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Plaza Floor with Perspective -->
  <ellipse cx="120" cy="180" rx="100" ry="40" fill="#252A34"/>
  <ellipse cx="120" cy="180" rx="80" ry="32" fill="none" stroke="#3A4250" stroke-width="1.5"/>
  <ellipse cx="120" cy="180" rx="55" ry="22" fill="none" stroke="#3A4250" stroke-width="1.5"/>
  <ellipse cx="120" cy="180" rx="30" ry="12" fill="none" stroke="#3A4250" stroke-width="1.5"/>
  
  <!-- Radial Lines pointing to center -->
  <line x1="120" y1="140" x2="120" y2="168" stroke="#3A4250" stroke-width="1.5"/>
  <line x1="120" y1="192" x2="120" y2="220" stroke="#3A4250" stroke-width="1.5"/>
