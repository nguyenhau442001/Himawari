<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight for Memorial/Respectful Atmosphere -->
    <radialGradient id="spotlight" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Portrait Frame Gold Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Ambient background elements: subtle traditional architectural arch / museum alcove -->
  <path d="M70 45 L170 45 L170 195 L70 195 Z" fill="#1b263b" opacity="0.6" />
  <path d="M80 55 C80 50, 160 50, 160 55 L160 190 L80 190 Z" fill="#111827" opacity="0.8" />
  <!-- Alcove inner shadow/depth -->
  <path d="M85 60 L155 60 L155 185 L85 185 Z" fill="#0d1322" />

  <!-- Memorial Portrait Frame (Centerpiece) -->
  <g id="portrait-frame">
    <!-- Outer frame shadow -->
    <rect x="92" y="67" width="56" height="71" rx="4" fill="#000" opacity="0.4" />
    <!-- Golden ornate frame -->
    <rect x="90" y="65" width="60" height="75" rx="6" fill="url(#goldGrad)" />
    <!-- Inner matte board -->
    <rect x="94" y="69" width="52" height="67" rx="3" fill="#f8fafc" />
    
    <!-- Venerable Elder Portrait (Stylized 2D flat art) -->
    <!-- Background of portrait -->
    <rect x="94" y="69" width="52" height="67" fill="#e2e8f0" />
    <!-- Elder body/suit -->
    <path d="M120 136 C105 136, 98 128, 98 120 L108 105 L120 112 L132 105 L142 120 C142 128, 135 136, 120 136 Z" fill="#334155" />
    <!-- Shirt collar & tie -->
    <path d="M115 110 L120 116 L125 110 L122 107 L120 109 L118 107 Z" fill="#ffffff" />
    <path d="M119 114 L121 114 L122 126 L120 128 L118 126 Z" fill="#ef4444" />
    <!-- Elder face & features -->
    <circle cx="120" cy="93" r="14" fill="#fbcfe8" />
    <path d="M106 93 C106 83, 134 83, 134 93 Z" fill="#cbd5e1" /> <!-- Grey hair -->
    <path d="M113 90 Q116 88 119 90" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Glasses/brow -->
    <path d="M121 90 Q124 88 127 90" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="120" cy="94" r="1.5" fill="#475569" /> <!-- Smile/Gentle expression -->
    <path d="M117 99 Q120 102 123 99" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Memorial Altar / Table Surface -->
  <g id="altar-table">
    <!-- Table shadow -->
    <ellipse cx="120" cy="190" rx="75" ry="10" fill="#000000" opacity="0.5" />
    <!-- Table top -->
    <path d="M45 180 L195 180 L205 195 L35 195 Z" fill="#334155" />
    <!-- Table front edge -->
    <rect x="35" y="195" width="170" height="8" rx="2" fill="#1e293b" />
    <!-- Red ceremonial table runner / cloth -->
    <path d="M90 180 L150 180 L155 210 L85 210 Z" fill="#dc2626" />
    <path d="M85 210 L120 220 L155 210 L150 215 L120 224 L90 215 Z" fill="#b91c1c" />
  </g>

  <!-- Offerings & Context Props on Altar -->
  <g id="offerings">
    <!-- Fresh Chrysanthemum Flower Arrangement (Left) -->
    <!-- Vase -->
    <path d="M60 175 L68 150 L72 150 L80 175 Z" fill="#e2e8f0" />
    <!-- Stems -->
    <path d="M70 150 L65 130" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M70 150 L75 125" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <!-- Yellow Chrysanthemum Blossoms -->
    <circle cx="63" cy="128" r="8" fill="#fbbf24" filter="url(#softGlow)" />
    <circle cx="76" cy="123" r="9" fill="#f59e0b" />
    <circle cx="76" cy="123" r="6" fill="#fbbf24" />

    <!-- Ceremonial Incense Burner / Bronze Bowl (Right) -->
    <path d="M165 170 C160 170, 155 175, 158 180 L182 180 C185 175, 180 170, 175 170 Z" fill="#d97706" />
    <ellipse cx="170" cy="170" rx="10" ry="3" fill="#b45309" />
    <!-- Incense smoke wisps -->
    <path d="M168 167 C164 160, 172 155, 168 145" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M172 167 C176 161, 168 156, 173 148" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Anniversary Candles with Warm Golden Glow (Flank Portrait) -->
    <!-- Left Candle -->
    <rect x="80" y="165" width="6" height="15" rx="1" fill="#f8fafc" />
    <ellipse cx="83" cy="165" rx="3" ry="1" fill="#cbd5e1" />
    <path d="M83 165 L83 162" stroke="#475569" stroke-width="1" />
    <path d="M83 160 C80 156, 86 154, 83 150 C80 154, 86 156, 83 160 Z" fill="#fbbf24" filter="url(#softGlow)" />

    <!-- Right Candle -->
    <rect x="154" y="165" width="6" height="15" rx="1" fill="#f8fafc" />
    <ellipse cx="157" cy="165" rx="3" ry="1" fill="#cbd5e1" />
    <path d="M157 165 L157 162" stroke="#475569" stroke-width="1" />
    <path d="M157 160 C154 156, 160 154, 157 150 C154 154, 160 156, 157 160 Z" fill="#fbbf24" filter="url(#softGlow)" />
  </g>

  <!-- Foreground Characters: Descendant paying respectful homage -->
  <g id="respectful-character">
    <!-- Character bowing/standing respectfully in foreground right -->
    <!-- Body/Torso leaning slightly in respect -->
    <path d="M175 240 L185 200 C185 195, 195 190, 202 205 L210 240 Z" fill="#1e3a8a" />
    <!-- Head and hair -->
    <circle cx="192" cy="182" r="11" fill="#fbcfe8" />
    <path d="M182 180 C182 172, 202 172, 202 182 C202 185, 198 185, 198 182 Z" fill="#0f172a" />
    <!-- Hands clasped in respectful traditional gesture (拱手/bowing posture) -->
    <ellipse cx="196" cy="205" rx="6" ry="5" fill="#fbcfe8" />
  </g>

  <!-- Second Character on the left (Family member joining the memorial) -->
  <g id="second-character">
    <!-- Body -->
    <path d="M65 240 L58 205 C58 200, 48 195, 45 210 L38 240 Z" fill="#0f766e" />
    <!-- Head & Hair -->
    <circle cx="50" cy="185" r="10" fill="#fbcfe8" />
    <path d="M40 185 C40 176, 60 176, 60 185 C55 192, 45 192, 40 185 Z" fill="#334155" />
    <!-- Hand holding a single fresh flower -->
    <path d="M55 208 L62 202" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <circle cx="63" cy="200" r="4" fill="#fbbf24" />
  </g>

  <!-- Atmospheric Lighting Overlays -->
  <!-- Warm glow reflecting on the floor and lower elements -->
  <ellipse cx="120" cy="235" rx="50" ry="5" fill="#f59e0b" opacity="0.15" filter="url(#softGlow)" />
</svg>