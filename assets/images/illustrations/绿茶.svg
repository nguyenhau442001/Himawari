<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 112)">
    <!-- Steam / Aroma (Sleek modern flat lines) -->
    <path d="M-15 -62 C-15 -74, -5 -78, -5 -90 C-5 -102, -15 -106, -15 -118" fill="none" stroke="#68D391" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M12 -58 C12 -68, 2 -72, 2 -84 C2 -96, 12 -100, 12 -110" fill="none" stroke="#68D391" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Tea Cup Saucer -->
    <ellipse cx="0" cy="52" rx="55" ry="14" fill="#2D3748"/>
    <ellipse cx="0" cy="50" rx="46" ry="10" fill="#4A5568"/>
    
    <!-- Tea Cup Body (Back/Inside) -->
    <path d="M-45 -35 L-38 35 C-38 43, -20 48, 0 48 C20 48, 38 43, 38 35 L45 -35 Z" fill="#E2E8F0"/>
    
    <!-- Tea Liquid (Green Tea) -->
    <ellipse cx="0" cy="-35" rx="45" ry="12" fill="#48BB78"/>
    <path d="M-43 -35 C-43 -23, -20 -20, 0 -20 C20 -20, 43 -23, 43 -35 C43 -23, 20 -10, 0 -10 C-20 -10, -43 -23, -43 -35 Z" fill="#38A169" opacity="0.6"/>
    
    <!-- Cup Handle -->
    <path d="M42 -25 C62 -25, 62 15, 38 22" fill="none" stroke="#CBD5E0" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Tea Cup Body (Front shading/cut) -->
    <path d="M-38 35 C-38 43, -20 48, 0 48 C20 48, 38 43, 38 35 L34 -35 C34 -35, 15 -32, 0 -32 C-15 -32, -34 -35, -34 -35 Z" fill="#CBD5E0"/>
    
    <!-- Fresh Tea Leaves Floating/Garnishing -->
    <g transform="translate(-12, -40) rotate(-25)">
      <path d="M0 0 C10 -15, 25 -15, 30 0 C25 15, 10 15, 0 0 Z" fill="#48BB78"/>
      <path d="M5 0 C12 -5, 18 -5, 25 0" fill="none" stroke="#2F855A" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(10, -45) rotate(35)">
      <path d="M0 0 C8 -12, 20 -12, 24 0 C20 12, 8 12, 0 0 Z" fill="#68D391"/>
      <path d="M4 0 C10 -4, 15 -4, 20 0" fill="none" stroke="#38A169" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>