<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Glow for Ahead/Distance -->
  <circle cx="120" cy="110" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Railway/Perspective Grid representing "Forward/Front" (前方) -->
  <g opacity="0.75">
    <!-- Tracks converging to the vanishing point (ahead) -->
    <line x1="40" y1="200" x2="108" y2="100" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="132" y2="100" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Railroad ties -->
    <line x1="60" y1="170" x2="180" y2="170" stroke="#2C3542" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="145" x2="160" y2="145" stroke="#2C3542" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="125" x2="144" y2="125" stroke="#2C3542" stroke-width="3" stroke-linecap="round"/>
    <line x1="108" y1="110" x2="132" y2="110" stroke="#2C3542" stroke-width="2" stroke-linecap="round"/>

    <!-- Ground plane -->
    <path d="M 12 200 L 228 200" stroke="#3A4454" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Destination / Object Ahead (Modern Train representing "Beijing Station" context) -->
  <g transform="translate(0, -5)">
    <!-- Train Body / Front -->
    <path d="M 92 85 L 148 85 C 158 85, 164 95, 160 105 L 144 140 C 141 146, 135 150, 128 150 L 112 150 C 105 150, 99 146, 96 140 L 80 105 C 76 95, 82 85, 92 85 Z" fill="#2E3846"/>
    <path d="M 96 88 L 144 88 C 152 88, 157 95, 154 103 L 140 137 C 138 142, 133 145, 127 145 L 113 145 C 107 145, 102 142, 100 137 L 86 103 C 83 95, 88 88, 96 88 Z" fill="#435266"/>

    <!-- Train Windshield -->
    <path d="M 100 95 L 140 95 C 145 95, 148 100, 146 105 L 138 125 C 137 128, 134 130, 130 130 L 110 130 C 106 130, 103 128, 102 125 L 94 105 C 92 100, 95 95, 100 95 Z" fill="#1A1D24"/>
    <path d="M 103 98 L 137 98 C 141 98, 143 102, 142 106 L 135 122 C 134 125, 132 127, 128 127 L 112 127 C 108 127, 106 125, 105 122 L 98 106 C 97 102, 99 98, 103 98 Z" fill="#5CE1E6" opacity="0.85"/>
    <!-- Windshield reflection -->
    <path d="M 106 101 L 122 101 L 114 120 L 108 120 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- Headlights (Gold/Orange accent for focus) -->
    <circle cx="103" cy="138" r="4" fill="#FFB703"/>
    <circle cx="137" cy="138" r="4" fill="#FFB703"/>
    <circle cx="103" cy="138" r="7" fill="#FFB703" opacity="0.3"/>
    <circle cx="137" cy="138" r="7" fill="#FFB703" opacity="0.3"/>

    <!-- Light Beams shining forward -->
    <path d="M 98 142 L 55 195 L 85 195 Z" fill="#FFB703" opacity="0.12"/>
    <path d="M 142 142 L 185 195 L 155 195 Z" fill="#FFB703" opacity="0.12"/>
  </g>

  <!-- Directional / "Ahead" Focus Arrow / Indicator floating subtly above -->
  <g transform="translate(120, 52)">
    <!-- Pulsing chevron pointing straight ahead/up -->
    <path d="M -12 8 L 0 -4 L 12 8" stroke="#FFB703" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M -12 18 L 0 6 L 12 18" stroke="#FFB703" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
  </g>
</svg>