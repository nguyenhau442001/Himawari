<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Master (Shifu) -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 80 C-40 40, -20 20, 0 20 C20 20, 40 40, 40 80" fill="#3D4451"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="35" fill="#F4B400"/>
    <!-- Beard/Features -->
    <path d="M-20 5 C-20 25, 20 25, 20 5" fill="#FFFFFF" opacity="0.8"/>
    <!-- Robe Detail -->
    <path d="M-30 40 L30 40 L20 80 L-20 80 Z" fill="#2D3440"/>
    
    <!-- Apprentice -->
    <g transform="translate(-70, 30)">
      <circle cx="0" cy="0" r="20" fill="#8AB4F8"/>
      <path d="M-20 20 C-20 0, 20 0, 20 20 L15 50 L-15 50 Z" fill="#5E6C84"/>
    </g>
    
    <!-- Interaction: Guiding Gesture -->
    <path d="M15 -5 L45 -20 L55 -5" stroke="#F4B400" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="55" cy="-5" r="6" fill="#F4B400"/>
    
    <!-- Traditional Craft Element (Pottery/Vase) -->
    <path d="M-60 60 L-40 60 L-45 90 L-55 90 Z" fill="#E8710A"/>
    <ellipse cx="-50" cy="60" rx="10" ry="4" fill="#F4B400"/>
  </g>
</svg>