<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/connection elements indicating correspondence/matching -->
  <g opacity="0.15" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <line x1="60" y1="120" x2="180" y2="120" />
    <circle cx="60" cy="120" r="25" />
    <circle cx="180" cy="120" r="25" />
  </g>

  <!-- Left Side: Cause / Input Element (Government/Action symbol: Document/Policy) -->
  <g transform="translate(45, 85)">
    <!-- Document background -->
    <rect x="0" y="0" width="35" height="45" rx="4" fill="#2D3748" stroke="#4A5568" stroke-width="1.5"/>
    <!-- Document lines (representing measures/policies) -->
    <line x1="8" y1="12" x2="27" y2="12" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="22" y2="20" stroke="#A0AEC0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="28" x2="25" y2="28" stroke="#A0AEC0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Dynamic connecting motion lines (Action/Correspondence) -->
  <g fill="none" stroke-linecap="round">
    <!-- Top arc line -->
    <path d="M 90 95 Q 120 70 150 95" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <!-- Arrowhead pointing right -->
    <path d="M 145 90 L 152 96 L 144 100" fill="#F59E0B" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>

    <!-- Bottom arc line (balancing response) -->
    <path d="M 150 145 Q 120 170 90 145" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;8" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <!-- Arrowhead pointing left -->
    <path d="M 95 150 L 88 144 L 96 140" fill="#3B82F6" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Right Side: Effect / Corresponding Output Element (Action/Measure taken) -->
  <g transform="translate(160, 85)">
    <!-- Gear/Action mechanism representing implementation/measures -->
    <circle cx="17.5" cy="22.5" r="16" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
    <path d="M 17.5 4.5 L 17.5 9.5 M 17.5 35.5 L 17.5 40.5 M 4.5 22.5 L 9.5 22.5 M 30.5 22.5 L 35.5 22.5 M 8 13 L 11 16 M 24 29 L 27 32 M 8 32 L 11 29 M 24 16 L 27 13" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17.5" cy="22.5" r="6" fill="#1A1D24" stroke="#60A5FA" stroke-width="2"/>
  </g>

  <!-- Central Human Interaction element indicating dynamic responsive action -->
  <g transform="translate(108, 95)">
    <!-- Stylized dynamic hands meeting in agreement / corresponding action -->
    <path d="M 0 15 L 12 15 C 16 15 20 18 22 22" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 24 15 L 12 15 C 8 15 4 12 2 8" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="15" r="3" fill="#E2E8F0"/>
  </g>

</svg>