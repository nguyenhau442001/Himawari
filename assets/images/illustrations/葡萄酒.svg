<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements -->
  <circle cx="120" cy="120" r="85" fill="#222630" opacity="0.6"/>
  
  <!-- Wine Bottle -->
  <g>
    <!-- Bottle Body -->
    <path d="M102 68 L138 68 L141 175 C141 187 132 196 120 196 C108 196 99 187 99 175 Z" fill="#801321"/>
    <!-- Bottle Neck -->
    <rect x="108" y="38" width="24" height="32" fill="#801321"/>
    <!-- Bottle Lip / Rim -->
    <rect x="106" y="34" width="28" height="5" rx="2" fill="#590C16"/>
    <!-- Cork / Foil Top -->
    <path d="M108 39 L132 39 L132 52 L108 52 Z" fill="#D4AF37"/>
    <!-- Bottle Neck Highlight -->
    <path d="M111.5 56 L116.5 56 L116.5 130 L111.5 130 Z" fill="#FFFFFF" opacity="0.12"/>
    <!-- Bottle Body Highlight -->
    <path d="M105 105 L111 105 L108 170 L104 170 Z" fill="#FFFFFF" opacity="0.15"/>
    <!-- Wine Label -->
    <rect x="105" y="102" width="30" height="42" rx="3" fill="#F4F4F6"/>
    <rect x="110" y="110" width="20" height="3" rx="1.5" fill="#D4AF37"/>
    <line x1="112" y1="118" x2="128" y2="118" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="114" y1="124" x2="126" y2="124" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <circle cx="120" cy="133" r="2" fill="#801321"/>
  </g>

  <!-- Wine Glass -->
  <g transform="translate(18, 15)">
    <!-- Base -->
    <ellipse cx="65" cy="184" rx="20" ry="5" fill="#D4AF37"/>
    <!-- Stem -->
    <rect x="62.5" y="130" width="5" height="55" fill="#D4AF37"/>
    <!-- Bowl (Back & Liquid) -->
    <path d="M 45 80 C 45 110, 85 110, 85 80 Z" fill="#801321"/>
    <!-- Bowl (Glass Outline/Front) -->
    <path d="M 45 80 C 45 115, 50 125, 65 125 C 80 125, 85 115, 85 80 Z" fill="none" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Rim -->
    <ellipse cx="65" cy="80" rx="20" ry="6" fill="none" stroke="#D4AF37" stroke-width="3"/>
    <!-- Glass Highlight -->
    <path d="M 50 87 C 52 100, 56 112, 60 118" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- Grapes Cluster (Accentuating the "Grape Wine" meaning) -->
  <g transform="translate(142, 115) scale(0.85)">
    <!-- Vine/Stem -->
    <path d="M22 12 Q30 5 45 2" fill="none" stroke="#8E6B23" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Grape circles -->
    <circle cx="30" cy="20" r="10" fill="#6A1B9A"/>
    <circle cx="48" cy="16" r="10" fill="#9C27B0"/>
    <circle cx="62" cy="26" r="10" fill="#6A1B9A"/>
    
    <circle cx="20" cy="34" r="10.5" fill="#8E24AA"/>
    <circle cx="38" cy="32" r="11" fill="#7B1FA2"/>
    <circle cx="55" cy="38" r="10.5" fill="#6A1B9A"/>
    
    <circle cx="28" cy="47" r="11" fill="#9C27B0"/>
    <circle cx="45" cy="46" r="11.5" fill="#8E24AA"/>
    <circle cx="62" cy="50" r="10" fill="#7B1FA2"/>
    
    <circle cx="36" cy="61" r="10.5" fill="#6A1B9A"/>
    <circle cx="53" cy="59" r="11" fill="#8E24AA"/>
    
    <circle cx="44" cy="73" r="10" fill="#7B1FA2"/>

    <!-- Grape Highlights for 3D glossy vector look -->
    <circle cx="27" cy="17" r="3" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="45" cy="13" r="3" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="59" cy="23" r="3" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="17" cy="31" r="3" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="35" cy="29" r="3.5" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="52" cy="35" r="3" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="25" cy="44" r="3.5" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="42" cy="43" r="3.5" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="59" cy="47" r="3" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="33" cy="58" r="3.5" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="50" cy="56" r="3.5" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="41" cy="70" r="3" fill="#FFFFFF" opacity="0.35"/>

    <!-- Leaf -->
    <path d="M42 2 C35 -6 18 -4 14 6 C8 20 22 24 30 15 Z" fill="#2E7D32"/>
    <path d="M22 10 Q28 10 30 15" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>