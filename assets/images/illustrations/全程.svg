<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Winding road representing the "whole journey" (全程) -->
    <path d="M 30 150 C 60 150, 70 80, 110 80 C 150 80, 160 160, 200 160 C 215 160, 220 140, 220 130" 
          fill="none" stroke="#2D323E" stroke-width="20" stroke-linecap="round"/>
          
    <!-- Main glowing progress path showing the complete journey -->
    <path d="M 30 150 C 60 150, 70 80, 110 80 C 150 80, 160 160, 200 160 C 215 160, 220 140, 220 130" 
          fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- Start marker (Flag A) -->
    <g transform="translate(30, 145)">
      <circle cx="0" cy="0" r="10" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 -22 L 14 -16 L 0 -10 Z" fill="#EF4444"/>
    </g>

    <!-- End marker (Flag B / Finish) -->
    <g transform="translate(220, 130)">
      <circle cx="0" cy="0" r="10" fill="#1A1D24" stroke="#10B981" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 -22 L 14 -16 L 0 -10 Z" fill="#10B981"/>
    </g>

    <!-- Central physical object: Sleek Modern Bicycle representing the contextual race/journey -->
    <g transform="translate(100, 95)">
      <!-- Back Wheel -->
      <circle cx="-25" cy="15" r="14" fill="none" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="-25" cy="15" r="3" fill="#38BDF8"/>
      
      <!-- Front Wheel -->
      <circle cx="25" cy="15" r="14" fill="none" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="25" cy="15" r="3" fill="#38BDF8"/>
      
      <!-- Bike Frame -->
      <path d="M -25 15 L -5 5 L 15 15 L -5 -5 Z" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="-5 5, -12 -12, -2 -15" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="15 15, 20 -8, 25 -5" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Cyclist Simplified -->
      <!-- Helmet -->
      <circle cx="-2" cy="-22" r="5" fill="#F59E0B"/>
      <!-- Body/Torso leaning forward -->
      <path d="M -5 -15 L 8 -2" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Distance Indicator Badge representing 120km context visually -->
    <g transform="translate(120, 36)">
      <rect x="-35" y="-14" width="70" height="28" rx="8" fill="#2D323E" stroke="#F59E0B" stroke-width="1.5"/>
      <polyline points="-22 0, -12 -6, -2 4, 8 -6, 18 2" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>