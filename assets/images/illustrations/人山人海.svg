<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Layer (Mountains made of overlapping people/silhouettes in deep blue) -->
  <path d="M 20 200 L 70 120 L 110 160 L 160 90 L 220 200 Z" fill="#242B38" />
  
  <!-- Secondary mountain layer -->
  <path d="M 10 200 L 50 140 L 90 180 L 140 110 L 190 170 L 230 200 Z" fill="#2D3748" />

  <!-- Mountain Peak 1 (Left Peak - Human Shape Accent) -->
  <circle cx="70" cy="110" r="8" fill="#F59E0B" opacity="0.8"/>
  <path d="M 62 130 C 62 118 78 118 78 130 Z" fill="#F59E0B" opacity="0.8"/>
  
  <!-- Mountain Peak 2 (Right Peak - Human Shape Accent) -->
  <circle cx="160" cy="80" r="10" fill="#F59E0B"/>
  <path d="M 150 102 C 150 88 170 88 170 102 Z" fill="#F59E0B"/>

  <!-- Foreground "Sea" of People (Dense overlapping crowds) -->
  <g fill="#374151">
    <!-- Back row of crowd -->
    <circle cx="30" cy="180" r="7"/> <path d="M 24 195 C 24 186 36 186 36 195 Z"/>
    <circle cx="50" cy="175" r="8"/> <path d="M 42 192 C 42 182 58 182 58 192 Z"/>
    <circle cx="75" cy="170" r="7"/> <path d="M 69 185 C 69 176 81 176 81 185 Z"/>
    <circle cx="95" cy="178" r="8"/> <path d="M 87 195 C 87 185 103 185 103 195 Z"/>
    <circle cx="120" cy="165" r="9"/> <path d="M 111 182 C 111 171 129 171 129 182 Z"/>
    <circle cx="145" cy="175" r="8"/> <path d="M 137 192 C 137 182 153 182 153 192 Z"/>
    <circle cx="170" cy="168" r="8"/> <path d="M 162 185 C 162 175 178 175 178 185 Z"/>
    <circle cx="195" cy="176" r="7"/> <path d="M 189 192 C 189 183 201 183 201 192 Z"/>
    <circle cx="215" cy="180" r="8"/> <path d="M 207 198 C 207 188 223 188 223 198 Z"/>
  </g>

  <g fill="#4B5563">
    <!-- Middle row of crowd -->
    <circle cx="15" cy="195" r="9"/>  <path d="M 6 215 C 6 204 24 204 24 215 Z"/>
    <circle cx="38" cy="190" r="10"/> <path d="M 28 210 C 28 198 48 198 48 210 Z"/>
    <circle cx="62" cy="188" r="9"/>  <path d="M 53 208 C 53 197 71 197 71 208 Z"/>
    <circle cx="85" cy="193" r="10"/> <path d="M 75 214 C 75 202 95 202 95 214 Z"/>
    <circle cx="110" cy="185" r="11"/><path d="M 99 207 C 99 194 121 194 121 207 Z"/>
    <circle cx="135" cy="192" r="10"/><path d="M 125 212 C 125 200 145 200 145 212 Z"/>
    <circle cx="158" cy="187" r="9"/> <path d="M 149 207 C 149 196 167 196 167 207 Z"/>
    <circle cx="182" cy="191" r="10"/><path d="M 172 212 C 172 200 192 200 192 212 Z"/>
    <circle cx="208" cy="194" r="9"/> <path d="M 199 214 C 199 203 217 203 217 214 Z"/>
    <circle cx="228" cy="198" r="8"/> <path d="M 220 216 C 220 207 236 207 236 216 Z"/>
  </g>

  <!-- Front row of crowd with vibrant accent colors (Focus/Hero elements) -->
  <!-- Person 1 (Left) -->
  <circle cx="25" cy="210" r="10" fill="#E5E7EB"/>
  <path d="M 15 235 C 15 220 35 220 35 235 Z" fill="#3B82F6"/>

  <!-- Person 2 (Mid-Left) -->
  <circle cx="55" cy="205" r="11" fill="#FCD34D"/>
  <path d="M 43 232 C 43 216 67 216 67 232 Z" fill="#EF4444"/>

  <!-- Person 3 (Center - Raising hands, immersed in the crowd) -->
  <circle cx="95" cy="200" r="12" fill="#E5E7EB"/>
  <path d="M 81 230 C 81 212 109 212 109 230 Z" fill="#F59E0B"/>
  <!-- Raised arms -->
  <path d="M 85 208 L 73 195" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M 105 208 L 117 195" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>

  <!-- Person 4 (Center-Right) -->
  <circle cx="138" cy="204" r="11" fill="#93C5FD"/>
  <path d="M 126 232 C 126 216 150 216 150 232 Z" fill="#10B981"/>

  <!-- Person 5 (Right) -->
  <circle cx="175" cy="208" r="10" fill="#FCA5A5"/>
  <path d="M 163 234 C 163 219 187 219 187 234 Z" fill="#8B5CF6"/>

  <!-- Person 6 (Far Right) -->
  <circle cx="210" cy="212" r="10" fill="#E5E7EB"/>
  <path d="M 200 238 C 200 223 220 223 220 238 Z" fill="#3B82F6"/>

  <!-- Atmosphere / Floating abstract indicators of overwhelming scale -->
  <circle cx="120" cy="45" r="2" fill="#F59E0B" opacity="0.6"/>
  <circle cx="105" cy="60" r="1.5" fill="#F59E0B" opacity="0.4"/>
  <circle cx="135" cy="55" r="1" fill="#F59E0B" opacity="0.5"/>
  <circle cx="85" cy="50" r="1.5" fill="#F59E0B" opacity="0.3"/>
  <circle cx="155" cy="65" r="2" fill="#F59E0B" opacity="0.5"/>
</svg>