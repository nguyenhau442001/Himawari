<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Voucher / Coupon / Ticket Object -->
    <!-- Drop shadow for depth -->
    <path d="M52,80 L188,80 C194.627,80 200,85.3726 200,92 L200,148 C200,154.627 194.627,160 188,160 L52,160 C45.3726,160 40,154.627 40,148 L40,92 C40,85.3726 45.3726,80 52,80 Z" fill="#111318" opacity="0.4" transform="translate(0, 6)"/>
    
    <!-- Main Ticket Body -->
    <path d="M52,76 L188,76 C194.627,76 200,81.3726 200,88 L200,144 C200,150.627 194.627,156 188,156 L52,156 C45.3726,156 40,150.627 40,144 L40,88 C40,81.3726 45.3726,76 52,76 Z" fill="#2D333B"/>
    
    <!-- Perforated Tear-off Line / Dashed Divider -->
    <line x1="150" y1="76" x2="150" y2="156" stroke="#1A1D24" stroke-width="2.5" stroke-dasharray="6,4"/>
    
    <!-- Left Notch (Semi-circle cutout) -->
    <path d="M40,110 C46.6274,110 52,115.373 52,122 C52,128.627 46.6274,134 40,134 Z" fill="#1A1D24"/>
    
    <!-- Right Notch (Semi-circle cutout) -->
    <path d="M200,110 C193.373,110 188,115.373 188,122 C188,128.627 193.373,134 200,134 Z" fill="#1A1D24"/>
    
    <!-- Accent Color Block / Left Stub Banner -->
    <path d="M52,76 L85,76 L85,156 L52,156 C45.3726,156 40,150.627 40,144 L40,88 C40,81.3726 45.3726,76 52,76 Z" fill="#F59E0B" opacity="0.15"/>
    
    <!-- Focus Icon: Discount Percent / Tag graphic inside main body -->
    <circle cx="95" cy="116" r="14" fill="#F59E0B" opacity="0.2"/>
    <circle cx="95" cy="116" r="6" fill="#F59E0B"/>
    
    <!-- Decorative Lines (Representing text / barcode) -->
    <!-- Left stub lines -->
    <rect x="58" y="100" width="14" height="4" rx="2" fill="#F59E0B"/>
    <rect x="58" y="112" width="10" height="3" rx="1.5" fill="#8B949E"/>
    <rect x="58" y="124" width="14" height="3" rx="1.5" fill="#8B949E"/>
    
    <!-- Right main section lines -->
    <rect x="115" y="96" width="22" height="6" rx="3" fill="#E6EDF3"/>
    <rect x="115" y="110" width="26" height="3" rx="1.5" fill="#8B949E"/>
    <rect x="115" y="120" width="18" height="3" rx="1.5" fill="#8B949E"/>
    
    <!-- Barcode at the bottom right of the ticket -->
    <g transform="translate(162, 102)" fill="#8B949E">
      <rect x="0" y="0" width="2" height="28" rx="1"/>
      <rect x="4" y="0" width="4" height="28" rx="1"/>
      <rect x="10" y="0" width="2" height="28" rx="1"/>
      <rect x="14" y="0" width="3" height="28" rx="1"/>
      <rect x="19" y="0" width="2" height="28" rx="1"/>
    </g>
    
    <!-- Sparkle / Highlight accent (Orange/Gold) -->
    <path d="M185,55 C185,61.0751 180.075,66 174,66 C180.075,66 185,70.9249 185,77 C185,70.9249 189.925,66 196,66 C189.925,66 185,61.0751 185,55 Z" fill="#F59E0B"/>
    <path d="M60,165 C60,168.866 56.866,172 53,172 C56.866,172 60,175.134 60,179 C60,175.134 63.134,172 67,172 C63.134,172 60,168.866 60,165 Z" fill="#F59E0B" opacity="0.6"/>
  </g>
</svg>