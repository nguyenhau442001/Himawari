<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow/pedestal -->
  <ellipse cx="120" cy="180" rx="70" ry="16" fill="#111317"/>

  <!-- Electric Vehicle (国产新能源车) Illustration -->
  <g transform="translate(0, 10)">
    <!-- Rear Wheel -->
    <circle cx="75" cy="140" r="18" fill="#2C313A"/>
    <circle cx="75" cy="140" r="10" fill="#1A1D24"/>
    <circle cx="75" cy="140" r="4" fill="#6272A4"/>

    <!-- Front Wheel -->
    <circle cx="165" cy="140" r="18" fill="#2C313A"/>
    <circle cx="165" cy="140" r="10" fill="#1A1D24"/>
    <circle cx="165" cy="140" r="4" fill="#6272A4"/>

    <!-- Car Body Shadow/Underglow -->
    <path d="M 55 136 L 185 136 C 185 136, 175 142, 120 142 C 65 142, 55 136, 55 136 Z" fill="#0E1013" opacity="0.6"/>

    <!-- Main Car Body (Sleek Modern EV Shape) -->
    <path d="M 45 125 
             C 50 120, 65 105, 80 100 
             C 95 95, 120 92, 155 98 
             C 175 102, 190 115, 198 126 
             L 200 135 
             L 40 135 Z" fill="#FFB86C"/>

    <!-- Roof and Windows (Cabin) -->
    <path d="M 88 98 
             C 105 80, 135 80, 152 98 
             Z" fill="#282C37"/>
    <!-- Window Glass Detail -->
    <path d="M 92 98 
             C 107 83, 133 83, 148 98 
             Z" fill="#1A1D24"/>

    <!-- Headlight (Modern LED accent) -->
    <path d="M 190 123 
             C 196 123, 199 125, 201 127 
             C 199 129, 195 130, 190 130 
             Z" fill="#8BE9FD"/>
    <path d="M 198 126 L 205 127 L 198 129 Z" fill="#8BE9FD" opacity="0.6"/> <!-- light beam effect -->

    <!-- Taillight -->
    <path d="M 43 125 
             C 41 125, 40 127, 41 129 
             C 43 130, 46 130, 48 130 
             Z" fill="#FF5555"/>

    <!-- Door Panels & Modern EV Lines -->
    <path d="M 115 98 L 115 135" stroke="#E59850" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 82 118 L 160 118" stroke="#E59850" stroke-width="1" opacity="0.5"/>

    <!-- Charging / New Energy Leaf Accent (Subtle local manufacturing/eco symbol) -->
    <circle cx="120" cy="118" r="8" fill="#1A1D24"/>
    <path d="M 120 113 C 122 113, 123 115, 122 117 C 120 119, 118 121, 117 122 C 117 120, 118 116, 120 113 Z" fill="#50FA7B"/>
    <path d="M 120 115 C 119 117, 118 119, 117 122" stroke="#50FA7B" stroke-width="0.75" fill="none"/>

    <!-- Sleek Door Handle -->
    <rect x="125" y="115" width="10" height="2" rx="1" fill="#282C37"/>
  </g>
</svg>