<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Ground -->
  <path d="M0 190h240v50H0z" fill="#334155"/>
  
  <!-- Truck Body -->
  <rect x="40" y="110" width="160" height="70" rx="4" fill="#fb923c"/>
  <rect x="45" y="115" width="150" height="60" rx="2" fill="#ea580c"/>
  
  <!-- Vegetables in truck -->
  <circle cx="60" cy="130" r="8" fill="#10b981"/>
  <circle cx="85" cy="125" r="10" fill="#22c55e"/>
  <circle cx="110" cy="135" r="7" fill="#10b981"/>
  <circle cx="135" cy="128" r="9" fill="#22c55e"/>
  <circle cx="160" cy="132" r="8" fill="#10b981"/>
  <circle cx="185" cy="125" r="10" fill="#22c55e"/>
  
  <!-- Truck Cab -->
  <rect x="160" y="130" width="40" height="50" rx="4" fill="#f59e0b"/>
  <rect x="170" y="135" width="20" height="15" rx="2" fill="#38bdf8"/>
  
  <!-- Wheels -->
  <circle cx="70" cy="190" r="15" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="170" cy="190" r="15" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  
  <!-- Driver Character -->
  <g transform="translate(175, 135)">
    <circle cx="5" cy="5" r="8" fill="#fde68a"/>
    <rect x="0" y="15" width="10" height="20" rx="2" fill="#ec4899"/>
  </g>
  
  <!-- Supermarket Building Silhouette -->
  <rect x="20" y="60" width="40" height="50" rx="4" fill="#334155"/>
  <rect x="25" y="70" width="30" height="30" rx="2" fill="#1e293b"/>
  <rect x="35" y="100" width="10" height="10" fill="#f59e0b"/>
  
  <!-- Motion Lines -->
  <path d="M20 150h-10M15 160h-15M10 170h-5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>