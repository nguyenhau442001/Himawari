<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#232733" opacity="0.6"/>

  <!-- Central Physical Object: Elegant Speech Bubbles forming words/language -->
  <!-- Back larger conversational layer / tone -->
  <path d="M 75 80 
           C 60 80, 50 90, 50 105 
           C 50 115, 58 123, 70 127 
           L 62 143 
           L 84 133 
           C 90 135, 96 136, 102 136
           C 117 136, 127 126, 127 111
           C 127 96, 117 80, 75 80 Z" 
        fill="#2A303C" opacity="0.7"/>

  <!-- Front primary speech bubble (representing speech/words) -->
  <path d="M 155 95 
           C 135 95, 120 108, 120 125 
           C 120 137, 130 148, 145 152 
           L 137 172, 162 160 
           C 170 163, 179 164, 188 164 
           C 208 164, 222 151, 222 134 
           C 222 112, 195 95, 155 95 Z" 
        fill="#242B38" stroke="#3A4454" stroke-width="2"/>

  <!-- Accent Orange/Gold Core: Stylized words/text lines flowing from the speech bubble -->
  <!-- Text line 1 (Long) -->
  <rect x="142" y="115" width="56" height="6" rx="3" fill="#F59E0B"/>
  
  <!-- Text line 2 (Medium) -->
  <rect x="142" y="131" width="40" height="6" rx="3" fill="#F59E0B" opacity="0.85"/>

  <!-- Secondary floating language elements (representing eloquent words) -->
  <!-- Small upper bubble -->
  <path d="M 85 70 
           C 75 70, 68 76, 68 84 
           C 68 90, 74 96, 82 98 
           L 78 108, 91 103 
           C 95 104, 99 104, 103 104 
           C 112 104, 118 97, 118 87 
           C 118 78, 105 70, 85 70 Z" 
        fill="#1F2633" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Mini text line inside small bubble -->
  <rect x="80" y="83" width="26" height="4" rx="2" fill="#F59E0B" opacity="0.6"/>

  <!-- Sound/Speech wave emanations / poetic expression marks -->
  <path d="M 35 110 C 30 115, 30 125, 35 130" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 27 102 C 20 110, 20 125, 27 138" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" fill="none"/>

  <!-- Elegant sparkling star accent indicating "eloquent / beautiful words" -->
  <path d="M 185 70 L 188 78 L 196 81 L 188 84 L 185 92 L 182 84 L 174 81 L 182 78 Z" fill="#FBBF24"/>
  <path d="M 70 155 L 72 160 L 77 162 L 72 164 L 70 169 L 68 164 L 63 162 L 68 160 Z" fill="#FBBF24" opacity="0.6"/>
</svg>