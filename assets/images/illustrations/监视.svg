<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Monitor Screen Glow & Gradients -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="cone-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>

    <!-- Window City View Gradient -->
    <linearGradient id="night-city" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- BACKGROUND: INVESTIGATION ROOM / POLICE STATION -->
  <!-- Venetian Blinds / Wall Panels -->
  <g opacity="0.15">
    <line x1="0" y1="40" x2="240" y2="40" stroke="#94a3b8" stroke-width="2" />
    <line x1="0" y1="80" x2="240" y2="80" stroke="#94a3b8" stroke-width="2" />
    <line x1="0" y1="120" x2="240" y2="120" stroke="#94a3b8" stroke-width="2" />
    <line x1="0" y1="160" x2="240" y2="160" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Window showing suspect outside in city environment -->
  <g transform="translate(145, 25)">
    <!-- Window Frame -->
    <rect width="70" height="85" rx="4" fill="url(#night-city)" stroke="#334155" stroke-width="3" />
    <line x1="35" y1="0" x2="35" y2="85" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="42" x2="70" y2="42" stroke="#334155" stroke-width="2" />

    <!-- Distant city lights outside -->
    <rect x="10" y="20" width="6" height="10" fill="#f59e0b" opacity="0.6" />
    <rect x="20" y="15" width="4" height="15" fill="#38bdf8" opacity="0.5" />
    <rect x="45" y="50" width="8" height="12" fill="#f59e0b" opacity="0.4" />
    <rect x="58" y="30" width="5" height="25" fill="#ef4444" opacity="0.6" />

    <!-- SUSPECT SILHOUETTE (The target being watched) -->
    <g transform="translate(40, 45)">
      <!-- Street lamp light pool -->
      <path d="M-20,-5 L25,-5 L40,40 L-35,40 Z" fill="url(#amber-glow)" />
      <!-- Suspect character -->
      <circle cx="0" cy="5" r="5" fill="#cbd5e1" />
      <path d="M-6,12 L6,12 L8,32 L-8,32 Z" fill="#475569" />
      <!-- Trench coat flap -->
      <path d="M-8,16 L-12,28 L-6,28 Z" fill="#334155" />
      <path d="M8,16 L12,28 L6,28 Z" fill="#334155" />
    </g>
    
    <!-- Target Reticle Overlay on Window (Surveillance tracking) -->
    <path d="M 35,45 M 30,35 L 25,35 L 25,40" stroke="#ef4444" stroke-width="1.5" fill="none" />
    <path d="M 40,35 L 45,35 L 45,40" stroke="#ef4444" stroke-width="1.5" fill="none" />
    <path d="M 30,55 L 25,55 L 25,50" stroke="#ef4444" stroke-width="1.5" fill="none" />
    <path d="M 40,55 L 45,55 L 45,50" stroke="#ef4444" stroke-width="1.5" fill="none" />
    <circle cx="35" cy="45" r="12" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" fill="none" opacity="0.8" />
  </g>

  <!-- DESK & PROPS -->
  <!-- Main Desk Surface -->
  <path d="M 10,180 L 230,180 L 220,215 L 20,215 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="15" y="175" width="210" height="8" rx="2" fill="#475569" />

  <!-- Coffee Mug -->
  <rect x="185" y="155" width="14" height="18" rx="2" fill="#e2e8f0" />
  <path d="M 199,160 C 204,160 204,168 199,170" stroke="#e2e8f0" stroke-width="2" fill="none" />
  <!-- Steam -->
  <path d="M 190,148 Q 192,143 190,138" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Case Files / Folders -->
  <g transform="translate(150, 160) rotate(-5)">
    <rect width="26" height="18" rx="2" fill="#f59e0b" />
    <rect x="3" y="3" width="20" height="3" rx="1" fill="#fff" opacity="0.6" />
  </g>
  <g transform="translate(130, 163) rotate(3)">
    <rect width="28" height="20" rx="2" fill="#3b82f6" />
    <rect x="3" y="3" width="15" height="3" rx="1" fill="#fff" opacity="0.6" />
  </g>

  <!-- MULTIPLE SURVEILLANCE MONITORS (Centerpiece) -->
  <g transform="translate(30, 95)">
    <!-- Stand / Base -->
    <path d="M 35,80 L 65,80 L 75,88 L 25,88 Z" fill="#475569" />
    <rect x="45" y="55" width="10" height="28" fill="#334155" />

    <!-- Center Monitor (Main view of suspect) -->
    <rect x="5" y="5" width="90" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <rect x="9" y="9" width="82" height="47" rx="2" fill="url(#screen-glow)" />

    <!-- Screen Content: Suspect Close-up Feed -->
    <circle cx="50" cy="28" r="10" fill="#64748b" />
    <path d="M 38,45 Q 50,32 62,45 Z" fill="#334155" />
    <!-- Live Recording Dot & Timecode UI -->
    <circle cx="16" cy="16" r="3" fill="#ef4444" />
    <text x="23" y="18" font-family="monospace" font-size="6" fill="#ef4444" font-weight="bold">REC</text>
    <text x="70" y="18" font-family="monospace" font-size="6" fill="#38bdf8">00:42:15</text>
    <!-- Focus Box -->
    <rect x="30" y="14" width="40" height="36" rx="2" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" fill="none" opacity="0.7" />

    <!-- Left Secondary Monitor (Graph/Data) -->
    <g transform="translate(-52, 12)">
      <rect width="50" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <!-- Waveform / Audio monitoring -->
      <path d="M 6,25 L 12,15 L 18,30 L 24,10 L 30,35 L 36,20 L 44,25" stroke="#10b981" stroke-width="1.5" fill="none" />
      <line x1="5" y1="21" x2="45" y2="21" stroke="#334155" stroke-width="0.5" stroke-dasharray="1,1" />
    </g>

    <!-- Right Secondary Monitor (Map / Location Tracking) -->
    <g transform="translate(97, 12)">
      <rect width="50" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <!-- Grid lines -->
      <line x1="10" y1="0" x2="10" y2="42" stroke="#1e293b" stroke-width="1" />
      <line x1="25" y1="0" x2="25" y2="42" stroke="#1e293b" stroke-width="1" />
      <line x1="40" y1="0" x2="40" y2="42" stroke="#1e293b" stroke-width="1" />
      <!-- Map route & Target pin -->
      <path d="M 10,35 Q 25,10 40,25" stroke="#3b82f6" stroke-width="2" fill="none" />
      <circle cx="28" cy="18" r="3" fill="#ef4444" />
      <circle cx="28" cy="18" r="6" stroke="#ef4444" stroke-width="1" fill="none" opacity="0.6" />
    </g>
  </g>

  <!-- Screen illumination gradient cast upward -->
  <path d="M 50,150 L 90,150 L 130,210 L 10,210 Z" fill="url(#cone-light)" style="mix-blend-mode: screen;" />

  <!-- POLICE DETECTIVE CHARACTER (Foreground) -->
  <g transform="translate(85, 120)">
    <!-- Body / Torso in dark police uniform/jacket -->
    <path d="M 10,75 L 40,75 L 50,95 L 0,95 Z" fill="#1e3a8a" />
    <!-- Collar & Tie -->
    <path d="M 20,75 L 25,85 L 30,75 Z" fill="#cbd5e1" />
    <path d="M 24,82 L 25,92 L 26,82 Z" fill="#ef4444" />

    <!-- Neck -->
    <rect x="20" y="65" width="10" height="12" fill="#f87171" rx="3" /> <!-- Skin tone base with shadow -->
    <rect x="21" y="65" width="8" height="12" fill="#ffedd5" rx="2" />

    <!-- Head -->
    <circle cx="25" cy="48" r="18" fill="#ffedd5" />

    <!-- Hair -->
    <path d="M 9,48 C 9,35 18,32 25,32 C 32,32 41,35 41,48 C 38,40 32,37 25,37 C 18,37 12,40 9,48 Z" fill="#334155" />

    <!-- Focused Eyes & Eyebrows (Intensely watching) -->
    <path d="M 16,45 L 22,47" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 28,47 L 34,45" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle cx="19" cy="50" r="2" fill="#0f172a" />
    <circle cx="31" cy="50" r="2" fill="#0f172a" />

    <!-- Serious Expression / Mouth -->
    <path d="M 23,58 Q 25,57 27,58" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Hand resting near chin/keyboard -->
    <g transform="translate(25, 68)">
      <circle cx="0" cy="5" r="5" fill="#ffedd5" />
      <path d="M -5,5 L 5,12 L 0,15 Z" fill="#1e3a8a" />
    </g>

    <!-- Detective Badge / Earpiece -->
    <path d="M 40,48 L 44,52 L 42,56" stroke="#94a3b8" stroke-width="2" fill="none" />
    <rect x="42" y="52" width="3" height="4" fill="#f59e0b" />
  </g>

  <!-- KEYBOARD ON DESK -->
  <g transform="translate(75, 195)">
    <rect width="60" height="16" rx="3" fill="#334155" />
    <!-- Key rows illusion -->
    <line x1="5" y1="5" x2="55" y2="5" stroke="#64748b" stroke-width="1" />
    <line x1="5" y1="10" x2="55" y2="10" stroke="#64748b" stroke-width="1" />
    <!-- Glowing light reflection on keyboard -->
    <rect x="15" y="4" width="12" height="8" rx="1" fill="#38bdf8" opacity="0.4" />
  </g>
</svg>