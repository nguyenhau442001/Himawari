<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Deep sea background elements -->
  <!-- Subtle water currents/depth lines -->
  <path d="M0 60 Q 60 50, 120 70 T 240 60" fill="none" stroke="#252A34" stroke-width="2" opacity="0.5"/>
  <path d="M0 130 Q 80 140, 160 120 T 240 130" fill="none" stroke="#252A34" stroke-width="3" opacity="0.4"/>
  <path d="M0 190 Q 70 200, 150 185 T 240 195" fill="none" stroke="#252A34" stroke-width="2" opacity="0.3"/>

  <!-- Glowing rays from deep sea abyss / magic treasure glow -->
  <path d="M120 120 L80 220 L160 220 Z" fill="#F5A623" opacity="0.08"/>
  <path d="M120 120 L50 200 L90 220 Z" fill="#F5A623" opacity="0.06"/>
  <path d="M120 120 L150 220 L190 200 Z" fill="#F5A623" opacity="0.06"/>

  <!-- Sea floor -->
  <path d="M0 215 Q 60 205, 120 212 T 240 208 L240 240 L0 240 Z" fill="#13151B"/>
  
  <!-- Coral and marine flora elements -->
  <path d="M35 215 Q 30 185, 20 170 Q 35 180, 45 213" fill="#2E3544"/>
  <path d="M42 214 Q 55 180, 70 165 Q 60 190, 48 214" fill="#252B38"/>
  <circle cx="20" cy="165" r="4" fill="#4B5563" opacity="0.6"/>
  <circle cx="70" cy="160" r="5" fill="#4B5563" opacity="0.6"/>

  <path d="M205 212 Q 215 180, 225 165 Q 205 185, 195 210" fill="#2E3544"/>
  <circle cx="225" cy="160" r="6" fill="#4B5563" opacity="0.6"/>

  <!-- Centerpiece: The Treasure Chest (Kho báu / Kho tàng quý giá) -->
  <g transform="translate(0, 5)">
    <!-- Chest Base / Lower Body -->
    <path d="M75 130 L165 130 C173 130, 178 135, 178 143 L178 175 C178 183, 173 188, 165 188 L75 188 C67 188, 62 183, 62 175 L62 143 C62 135, 67 130, 75 130 Z" fill="#8B4513"/>
    <!-- Wood plank shading -->
    <rect x="62" y="153" width="116" height="5" fill="#65300B" opacity="0.4"/>
    <rect x="62" y="172" width="116" height="5" fill="#65300B" opacity="0.4"/>

    <!-- Chest Metal Reinforcements (Straps & Corners) -->
    <rect x="78" y="130" width="10" height="58" fill="#D4AF37"/>
    <rect x="152" y="130" width="10" height="58" fill="#D4AF37"/>
    <rect x="62" y="138" width="116" height="6" fill="#D4AF37"/>
    <rect x="62" y="180" width="116" height="6" fill="#D4AF37"/>

    <!-- Treasure Overflowing (Gems, Pearls, Gold Coins) -->
    <!-- Glow behind treasure -->
    <circle cx="120" cy="120" r="35" fill="#F5A623" opacity="0.2" filter="blur(8px)"/>

    <!-- Mound of treasure inside/spilling out -->
    <path d="M75 130 C75 105, 95 95, 120 95 C145 95, 165 105, 165 130 Z" fill="#E09F1F"/>
    
    <!-- Individual Treasure Elements (Coins, Gems, Pearls) -->
    <!-- Pearls/Gems cluster 1 -->
    <circle cx="100" cy="115" r="10" fill="#FCE988"/>
    <circle cx="100" cy="115" r="7" fill="#F5A623"/>
    
    <circle cx="140" cy="110" r="12" fill="#E63946"/> <!-- Ruby -->
    <path d="M140 98 L146 110 L134 110 Z" fill="#FF6B6B" opacity="0.5"/> <!-- Ruby facet -->

    <circle cx="120" cy="100" r="9" fill="#4CC9F0"/> <!-- Sapphire -->
    <circle cx="90" cy="125" r="8" fill="#38B000"/>  <!-- Emerald -->
    <circle cx="150" cy="122" r="9" fill="#FCE988"/>  <!-- Gold coin -->
    <circle cx="115" cy="115" r="11" fill="#F5A623"/> <!-- Gold mound -->
    
    <circle cx="130" cy="120" r="7" fill="#FFFFFF" opacity="0.9"/> <!-- Large Pearl -->
    <circle cx="105" cy="100" r="6" fill="#FFFFFF" opacity="0.9"/> <!-- Pearl -->

    <!-- Chest Lid (Open, tilted back) -->
    <path d="M72 125 C72 100, 95 78, 120 78 C145 78, 168 100, 168 125 Z" fill="#A0522D" transform="rotate(-35 120 125)"/>
    <!-- Lid metal rim -->
    <path d="M70 123 C70 98, 93 76, 120 76 C147 76, 170 98, 170 123" fill="none" stroke="#D4AF37" stroke-width="6" transform="rotate(-35 120 125)"/>

    <!-- Chest Lock Plate (Front Center) -->
    <path d="M112 152 L128 152 L128 172 L112 172 Z" fill="#D4AF37"/>
    <circle cx="120" cy="160" r="3" fill="#1A1D24"/>
    <path d="M118 160 L122 160 L122 166 L118 166 Z" fill="#1A1D24"/>
  </g>

  <!-- Ambient magical sparkles/bubbles rising from the treasure -->
  <circle cx="95" cy="75" r="3" fill="#FCE988" opacity="0.8"/>
  <circle cx="145" cy="65" r="2" fill="#FCE988" opacity="0.6"/>
  <circle cx="110" cy="50" r="2.5" fill="#4CC9F0" opacity="0.7"/>
  <circle cx="135" cy="40" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Tiny floating marine bubbles -->
  <circle cx="70" cy="90" r="2" fill="#4CC9F0" opacity="0.4"/>
  <circle cx="170" cy="85" r="3" fill="#4CC9F0" opacity="0.3"/>
  <circle cx="55" cy="130" r="1.5" fill="#4CC9F0" opacity="0.5"/>
  <circle cx="185" cy="115" r="2" fill="#4CC9F0" opacity="0.4"/>
</svg>