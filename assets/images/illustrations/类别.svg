<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="#334155"/>
  
  <!-- Character -->
  <g transform="translate(40, 80)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <rect x="10" y="35" width="20" height="40" rx="4" fill="#38bdf8"/>
    <path d="M15 50 L5 70 M25 50 L35 70" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sorting Action: Documents -->
  <!-- Pile 1: Blue -->
  <rect x="90" y="140" width="30" height="40" rx="2" fill="#38bdf8"/>
  <rect x="95" y="135" width="30" height="40" rx="2" fill="#38bdf8" opacity="0.7"/>
  
  <!-- Pile 2: Pink -->
  <rect x="130" y="140" width="30" height="40" rx="2" fill="#ec4899"/>
  <rect x="135" y="135" width="30" height="40" rx="2" fill="#ec4899" opacity="0.7"/>
  
  <!-- Pile 3: Green -->
  <rect x="170" y="140" width="30" height="40" rx="2" fill="#10b981"/>
  <rect x="175" y="135" width="30" height="40" rx="2" fill="#10b981" opacity="0.7"/>

  <!-- Floating papers being sorted -->
  <rect x="60" y="100" width="20" height="25" rx="2" fill="#fb923c" transform="rotate(-15)"/>
  
  <!-- Decorative Background Elements -->
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="180" cy="60" r="2" fill="#fbbf24"/>
  <circle cx="220" cy="80" r="2" fill="#fbbf24"/>
  
  <!-- Shelf/Wall detail -->
  <rect x="20" y="70" width="200" height="4" fill="#475569"/>
</svg>