<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural Embassy Building (使馆) -->
  <g transform="translate(0, 0)">
    <!-- Embassy Base/Steps -->
    <path d="M 60 190 L 180 190 L 190 205 L 50 205 Z" fill="#4B5563"/>
    <path d="M 70 175 L 170 175 L 180 190 L 60 190 Z" fill="#6B7280"/>
    
    <!-- Main Building Body -->
    <rect x="75" y="95" width="90" height="80" fill="#9CA3AF"/>
    <rect x="85" y="105" width="70" height="70" fill="#E5E7EB"/>
    
    <!-- Columns -->
    <rect x="95" y="115" width="8" height="60" fill="#F3F4F6"/>
    <rect x="116" y="115" width="8" height="60" fill="#F3F4F6"/>
    <rect x="137" y="115" width="8" height="60" fill="#F3F4F6"/>
    
    <!-- Entrance Door -->
    <path d="M 108 145 L 132 145 L 132 175 L 108 175 Z" fill="#1F2937"/>
    <path d="M 120 145 A 12 12 0 0 1 132 157 L 132 175 L 108 175 L 108 157 A 12 12 0 0 1 120 145 Z" fill="#374151"/>

    <!-- Classic Roof/Pediment -->
    <path d="M 65 95 L 175 95 L 120 55 Z" fill="#374151"/>
    <path d="M 70 95 L 170 95 L 120 60 Z" fill="#4B5563"/>
  </g>

  <!-- Diplomatic Flag (Accent) -->
  <g transform="translate(0, 0)">
    <!-- Flagpole -->
    <rect x="117" y="25" width="3" height="35" fill="#9CA3AF"/>
    <!-- Flag Banner (Gold/Orange focus color) -->
    <path d="M 120 28 L 145 36 L 120 44 Z" fill="#F59E0B"/>
  </g>

  <!-- Passport / Visa context accent (Subtle icon at bottom corner) -->
  <g transform="translate(155, 155)">
    <rect x="0" y="0" width="36" height="46" rx="4" fill="#EF4444"/>
    <rect x="4" y="4" width="28" height="38" rx="2" fill="#B91C1C"/>
    <!-- Crest/Seal on Passport -->
    <circle cx="18" cy="20" r="7" fill="#FBBF24"/>
    <rect x="10" y="33" width="16" height="3" rx="1.5" fill="#E5E7EB"/>
  </g>
</svg>