<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric background glow -->
  <circle cx="120" cy="110" r="90" fill="url(#lampGlow)"/>

  <!-- Restaurant Interior Background -->
  <!-- Wall panels/decor -->
  <rect x="25" y="30" width="190" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="40" width="50" height="65" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="95" y="40" width="50" height="65" rx="6" fill="#0f172a" opacity="0.6"/>
  <rect x="155" y="40" width="50" height="65" rx="6" fill="#0f172a" opacity="0.6"/>

  <!-- Warm hanging lamps -->
  <path d="M70 15 L70 45" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 45 L85 45 L80 55 L60 55 Z" fill="#fbbf24"/>
  <path d="M60 55 Q70 70 80 55" fill="#f59e0b" opacity="0.8"/>
  <polygon points="50,55 90,55 105,120 35,120" fill="url(#warmLight)"/>

  <path d="M170 15 L170 45" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M155 45 L185 45 L180 55 L160 55 Z" fill="#fbbf24"/>
  <polygon points="150,55 190,55 205,120 135,120" fill="url(#warmLight)"/>

  <!-- Restaurant Table -->
  <path d="M50 145 L190 145 L205 175 L35 175 Z" fill="#334155"/>
  <rect x="40" y="140" width="160" height="8" rx="4" fill="#475569"/>
  <!-- Table legs -->
  <rect x="65" y="175" width="10" height="40" fill="#1e293b"/>
  <rect x="165" y="175" width="10" height="40" fill="#1e293b"/>

  <!-- Food & Table Props -->
  <!-- Steaming bowl center -->
  <ellipse cx="120" cy="142" rx="18" ry="7" fill="#64748b"/>
  <path d="M102 142 C102 155 138 155 138 142 Z" fill="#f8fafc"/>
  <ellipse cx="120" cy="142" rx="16" ry="5" fill="#e2e8f0"/>
  <!-- Broth & Noodles -->
  <ellipse cx="120" cy="143" rx="14" ry="4" fill="#fb923c"/>
  <!-- Steam lines -->
  <path d="M115 130 Q112 120 118 112" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M125 128 Q128 118 122 110" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Side dish plates -->
  <ellipse cx="85" cy="148" rx="12" ry="5" fill="#64748b"/>
  <ellipse cx="85" cy="147" rx="10" ry="4" fill="#f8fafc"/>
  <circle cx="83" cy="147" r="3" fill="#10b981"/>
  <circle cx="88" cy="146" r="2" fill="#ef4444"/>

  <ellipse cx="155" cy="148" rx="12" ry="5" fill="#64748b"/>
  <ellipse cx="155" cy="147" rx="10" ry="4" fill="#f8fafc"/>
  <circle cx="153" cy="147" r="2.5" fill="#fbbf24"/>
  <circle cx="158" cy="148" r="2" fill="#ef4444"/>

  <!-- Character 1 (Left - Eating/Smiling) -->
  <!-- Chair back -->
  <rect x="45" y="105" width="22" height="60" rx="6" fill="#1e293b"/>
  <!-- Body/Torso -->
  <path d="M45 155 L75 155 L80 185 L40 185 Z" fill="#38bdf8"/>
  <!-- Arms -->
  <path d="M50 155 L70 155 L85 142" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chopsticks & Hands -->
  <circle cx="85" cy="141" r="4" fill="#fcd34d"/>
  <line x1="83" y1="141" x2="105" y2="135" stroke="#b45309" stroke-width="2"/>
  <line x1="86" y1="143" x2="107" y2="138" stroke="#b45309" stroke-width="2"/>

  <!-- Neck & Head -->
  <rect x="58" y="95" width="10" height="15" fill="#fcd34d"/>
  <circle cx="63" cy="85" rx="16" ry="17" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M48 83 C48 70 78 70 78 83 C78 88 72 85 63 85 C54 85 48 88 48 83 Z" fill="#0f172a"/>
  <path d="M48 80 C50 72 60 70 70 73" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Face expressions -->
  <circle cx="58" cy="83" r="1.5" fill="#1e293b"/>
  <circle cx="68" cy="83" r="1.5" fill="#1e293b"/>
  <path d="M61 88 Q63 92 65 88" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Happy blush -->
  <ellipse cx="56" cy="87" r="2.5" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="70" cy="87" r="2.5" fill="#f43f5e" opacity="0.4"/>


  <!-- Character 2 (Right - Talking/Happy gesture) -->
  <!-- Chair back -->
  <rect x="173" y="105" width="22" height="60" rx="6" fill="#1e293b"/>
  <!-- Body/Torso -->
  <path d="M165 155 L195 155 L200 185 L160 185 Z" fill="#ec4899"/>
  <!-- Arms -->
  <path d="M190 155 L170 155 L155 138" stroke="#ec4899" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand -->
  <circle cx="153" cy="137" r="4" fill="#fcd34d"/>

  <!-- Neck & Head -->
  <rect x="172" y="95" width="10" height="15" fill="#fcd34d"/>
  <circle cx="177" cy="85" rx="16" ry="17" fill="#fcd34d"/>
  <!-- Hair (Ponytail style) -->
  <path d="M162 83 C162 70 192 70 192 83 C192 90 185 92 177 92 C169 92 162 90 162 83 Z" fill="#334155"/>
  <path d="M190 80 Q202 75 198 88" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Face expressions -->
  <circle cx="173" cy="83" r="1.5" fill="#1e293b"/>
  <circle cx="183" cy="83" r="1.5" fill="#1e293b"/>
  <path d="M176 88 Q178 93 180 88" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Happy blush -->
  <ellipse cx="170" cy="87" r="2.5" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="185" cy="87" r="2.5" fill="#f43f5e" opacity="0.4"/>

  <!-- Ambient lighting/highlights on floor -->
  <ellipse cx="120" cy="210" rx="80" ry="12" fill="#000000" opacity="0.3"/>
</svg>