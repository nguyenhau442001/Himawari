<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle workbench background -->
  <rect x="36" y="170" width="168" height="8" rx="4" fill="#2A2F3B"/>
  
  <!-- Jade / Precious Stone being carved (Central Physical Object) -->
  <path d="M90 100 L120 75 L165 95 L155 145 L100 150 Z" fill="#2DD4BF" opacity="0.9"/>
  <!-- Jade facets / internal shimmer lines -->
  <path d="M120 75 L120 120 L165 95 Z" fill="#5EEAD4" opacity="0.6"/>
  <path d="M120 120 L155 145 L100 150 Z" fill="#14B8A6" opacity="0.8"/>
  <path d="M90 100 L120 120 L100 150 Z" fill="#0F766E" opacity="0.5"/>

  <!-- Precision Crafting Tool (Carving Chisel/Graver) -->
  <g transform="rotate(-35 130 90)">
    <!-- Tool handle -->
    <rect x="125" y="40" width="10" height="40" rx="3" fill="#64748B"/>
    <!-- Metal shaft -->
    <rect x="127" y="80" width="6" height="45" fill="#E2E8F0"/>
    <!-- Sharp carved tip touching the jade -->
    <polygon points="127,125 133,125 130,135" fill="#F8FAFC"/>
  </g>

  <!-- High-precision spark/focus highlights (Gold/Orange accent representing mastery) -->
  <circle cx="120" cy="115" r="3" fill="#FBBF24"/>
  <path d="M115 110 L125 120 M125 110 L115 120" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  
  <circle cx="138" cy="98" r="2" fill="#FBBF24"/>
  <circle cx="108" cy="130" r="1.5" fill="#F59E0B"/>
</svg>