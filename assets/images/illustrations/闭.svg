<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing calm rest -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Main Object: Sleeping / Resting Human Figure (representing "bì" - closing eyes/resting) -->
  <g transform="translate(0, 10)">
    <!-- Head circle -->
    <circle cx="120" cy="95" r="32" fill="#E6EDF3"/>
    
    <!-- Peaceful closed eyes (arcs curving downward) -->
    <path d="M 108 96 Q 112 101 116 96" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 124 96 Q 128 101 132 96" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Gentle resting expression / mouth -->
    <path d="M 118 111 Q 120 113 122 111" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Shoulders and torso resting -->
    <path d="M 72 155 C 72 128 92 122 120 122 C 148 122 168 128 168 155 Z" fill="#3B82F6"/>
    
    <!-- Collar details for modern flat look -->
    <path d="M 105 122 L 120 134 L 135 122" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Accent elements representing quiet, calm rest (zzz or peaceful particles in warm gold) -->
  <g fill="#F59E0B" opacity="0.8">
    <path d="M 160 70 L 175 70 L 163 88 L 178 88" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="185" cy="55" r="3"/>
    <circle cx="198" cy="40" r="2"/>
  </g>

</svg>