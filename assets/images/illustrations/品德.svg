<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Aura Gradient (representing noble character / "高尚") -->
    <radialGradient id="auraGlow" cx="120" cy="110" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="120" y1="30" x2="60" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="coatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="elderRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT BACKGROUND & PROPS -->
  <!-- Back wall & bookshelf structure -->
  <rect x="24" y="30" width="192" height="150" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
  <!-- Bookshelf shelves -->
  <line x1="24" y1="90" x2="216" y2="90" stroke="#334155" stroke-width="1.5"/>
  <line x1="24" y1="145" x2="216" y2="145" stroke="#334155" stroke-width="1.5"/>

  <!-- Books on Shelf (Row 1) -->
  <rect x="35" y="60" width="10" height="30" rx="2" fill="#475569"/>
  <rect x="47" y="55" width="14" height="35" rx="2" fill="#0ea5e9"/>
  <rect x="63" y="62" width="8" height="28" rx="2" fill="#f43f5e"/>
  <rect x="73" y="58" width="12" height="32" rx="2" fill="#10b981"/>
  <!-- Plant on Shelf -->
  <rect x="180" y="68" width="20" height="22" rx="4" fill="#334155"/>
  <path d="M190 68 C190 55, 175 50, 175 42 C175 42, 185 45, 190 38 C195 45, 205 42, 205 42 C205 50, 190 55, 190 68 Z" fill="#10b981"/>

  <!-- Window with Warm Light -->
  <rect x="155" y="95" width="45" height="45" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <path d="M155 95 L200 140 M200 95 L155 140" stroke="#475569" stroke-width="1.5"/>
  <!-- Light Beam projection -->
  <polygon points="155,95 200,95 216,180 130,180" fill="url(#lightBeam)"/>

  <!-- Noble Aura Glow around the central interaction -->
  <circle cx="120" cy="115" r="75" fill="url(#auraGlow)"/>

  <!-- Flooring -->
  <path d="M15 180 L225 180 L235 220 L5 220 Z" fill="#0b1322"/>
  <line x1="15" y1="180" x2="225" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Desk & Object Details -->
  <rect x="75" y="165" width="90" height="15" rx="3" fill="#334155"/>
  <rect x="85" y="180" width="10" height="35" fill="#1e293b"/>
  <rect x="145" y="180" width="10" height="35" fill="#1e293b"/>
  <!-- Helping Props: Warm tea set & bouquet (symbolizing respect, gratitude, and good character) -->
  <circle cx="100" cy="160" r="7" fill="#f8fafc"/>
  <path d="M107 157 C111 157, 112 163, 107 163" stroke="#f8fafc" stroke-width="1.5" fill="none"/>
  <!-- Gift box / thoughtful token -->
  <rect x="120" y="152" width="18" height="13" rx="2" fill="#ec4899"/>
  <path d="M129 152 V165 M120 158 H138" stroke="#fbcfe8" stroke-width="1.5"/>

  <!-- CHARACTERS (Depicting respect and noble virtue/character) -->

  <!-- Character 1: Older Person / Recipient (Seated on right) -->
  <g id="elderPerson">
    <!-- Body & Chair -->
    <rect x="165" y="130" width="30" height="40" rx="6" fill="#64748b"/>
    <path d="M160 120 C160 115, 180 115, 180 120 L180 170 L160 170 Z" fill="url(#elderRobe)"/>
    <!-- Head -->
    <circle cx="172" cy="103" r="13" fill="#fed7aa"/>
    <!-- Gentle facial expression / smiling eyes -->
    <path d="M167 100 Q169 98 171 100" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M174 100 Q176 98 178 100" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M171 107 Q173 110 175 107" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- White hair/temples -->
    <path d="M159 103 C159 94, 185 94, 185 103 C180 101, 164 101, 159 103 Z" fill="#f8fafc"/>
  </g>

  <!-- Character 2: Young Person of Noble Character / Helpful & Respectful (Standing/Leaning respectfully on left) -->
  <g id="noblePerson">
    <!-- Legs -->
    <rect x="85" y="170" width="10" height="40" rx="3" fill="#1e293b"/>
    <rect x="103" y="170" width="10" height="40" rx="3" fill="#1e293b"/>
    <!-- Torso in polite bow / leaning forward slightly -->
    <path d="M82 130 C82 120, 105 115, 115 130 L110 170 L85 170 Z" fill="url(#coatGrad)"/>
    <!-- Arms reaching out warmly/respectfully -->
    <path d="M95 135 C110 140, 125 150, 135 150" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="137" cy="150" r="5" fill="#fed7aa"/> <!-- Hand -->
    <!-- Head & Hair -->
    <circle cx="95" cy="108" r="14" fill="#fed7aa"/>
    <!-- Hair styling -->
    <path d="M82 108 C82 98, 108 96, 109 108 C105 102, 85 102, 82 108 Z" fill="#0f172a"/>
    <!-- Facial expression: Warm, sincere, honest eyes -->
    <circle cx="98" cy="106" r="1.5" stroke="#1e293b" stroke-width="1" fill="#1e293b"/>
    <!-- Warm gentle smile -->
    <path d="M97 113 Q100 116 103 113" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheek for kindness -->
    <circle cx="101" cy="111" r="3" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- FLOATING SYMBOLIC PARTICLES (Golden sparkles emphasizing "高尚" - nobility/virtue) -->
  <g fill="#fbbf24">
    <!-- Sparkle 1 -->
    <path d="M 120 75 Q 120 85 110 85 Q 120 85 120 95 Q 120 85 130 85 Q 120 85 120 75 Z" opacity="0.9"/>
    <!-- Sparkle 2 -->
    <path d="M 75 55 Q 75 61 69 61 Q 75 61 75 67 Q 75 61 81 61 Q 75 61 75 55 Z" opacity="0.7"/>
    <!-- Sparkle 3 -->
    <path d="M 155 50 Q 155 56 149 56 Q 155 56 155 62 Q 155 56 161 56 Q 155 56 155 50 Z" opacity="0.8"/>
    <!-- Tiny floating dots -->
    <circle cx="138" cy="95" r="2" opacity="0.6"/>
    <circle cx="102" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="60" cy="110" r="2" opacity="0.5"/>
    <circle cx="170" cy="75" r="1.5" opacity="0.7"/>
  </g>

</svg>