<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background Glow (Subtle Warm Horizon) -->
  <radialGradient id="bgGlow" cx="50%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#E58E26" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
  </radialGradient>
  <circle cx="120" cy="140" r="90" fill="url(#bgGlow)"/>

  <!-- Ground Line -->
  <path d="M 60 175 L 180 175" stroke="#2F3542" stroke-width="3" stroke-linecap="round"/>

  <!-- Protective Hands (Cupping concept representing conservation/rescue) -->
  <!-- Lower/Back Hand -->
  <path d="M 75 165 C 85 180, 110 185, 125 180 C 145 175, 155 160, 160 150" fill="none" stroke="#57606F" stroke-width="6" stroke-linecap="round"/>

  <!-- Endangered Animal Focus: Slender, vulnerable snow leopard cub / wild cat silhouette in sharp focus -->
  <g id="endangered-animal" transform="translate(0, 5)">
    <!-- Body -->
    <path d="M 95 145 C 90 135, 95 120, 105 115 C 115 110, 130 115, 135 125 C 140 135, 145 155, 145 165 L 95 165 Z" fill="#E4C1A9"/>
    
    <!-- Head -->
    <circle cx="105" cy="105" r="14" fill="#E4C1A9"/>
    
    <!-- Ears -->
    <polygon points="95,97 93,90 99,94" fill="#E4C1A9"/>
    <polygon points="115,97 117,90 111,94" fill="#E4C1A9"/>

    <!-- Facial Markings / Spots (Stylized minimalist wildcat) -->
    <circle cx="101" cy="106" r="1.5" fill="#2F3542"/>
    <circle cx="109" cy="106" r="1.5" fill="#2F3542"/>
    <path d="M 103 111 Q 105 113 107 111" fill="none" stroke="#2F3542" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tail (Curled gracefully, emphasizing fragility) -->
    <path d="M 145 160 C 160 160, 165 145, 160 135 C 158 130, 153 130, 152 135" fill="none" stroke="#E4C1A9" stroke-width="5" stroke-linecap="round"/>

    <!-- Natural Spot Details -->
    <circle cx="125" cy="130" r="2" fill="#57606F" opacity="0.6"/>
    <circle cx="135" cy="145" r="2" fill="#57606F" opacity="0.6"/>
    <circle cx="115" cy="150" r="2.5" fill="#57606F" opacity="0.6"/>
  </g>

  <!-- Front Protective Hand (Cupping from below and front) -->
  <path d="M 80 172 C 90 185, 120 188, 140 178 C 155 170, 165 155, 172 140" fill="none" stroke="#747D8C" stroke-width="7" stroke-linecap="round"/>

  <!-- Critical Focal Accent: A single fragile, glowing golden leaf / sprout symbolizing rare life hanging by a thread -->
  <g transform="translate(112, 118)">
    <path d="M 8 15 C 8 10, 0 5, -5 0 C 0 -2, 5 -1, 8 15 Z" fill="#F1C40F"/>
    <path d="M 0 5 C 3 3, 5 0, 8 15" fill="none" stroke="#E58E26" stroke-width="1.5"/>
  </g>

  <!-- High-contrast Warning / Alert Indicator (Sleek minimalist orange focal dot, strictly non-abstract framing) -->
  <circle cx="120" cy="50" r="16" fill="#1A1D24" stroke="#E58E26" stroke-width="3"/>
  <path d="M 120 41 L 120 51" stroke="#E58E26" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="57" r="1.5" fill="#E58E26"/>
</svg>