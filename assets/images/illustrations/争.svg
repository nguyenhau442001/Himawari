<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Clock Background -->
  <circle cx="120" cy="120" r="90" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <path d="M120 40 L120 120 L180 120" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Desk -->
  <rect x="30" y="160" width="180" height="15" fill="#334155" rx="2"/>
  
  <!-- Character: Focused Worker -->
  <g transform="translate(60, 80)">
    <circle cx="40" cy="30" r="25" fill="#fde68a"/>
    <path d="M30 35 Q40 45 50 35" stroke="#475569" stroke-width="3" fill="none"/>
    <circle cx="32" cy="25" r="3" fill="#475569"/>
    <circle cx="48" cy="25" r="3" fill="#475569"/>
    <rect x="15" y="60" width="50" height="80" rx="10" fill="#38bdf8"/>
    <rect x="25" y="55" width="30" height="10" fill="#fb923c" rx="2"/>
  </g>
  
  <!-- Laptop/Work -->
  <rect x="110" y="120" width="80" height="50" rx="4" fill="#64748b"/>
  <rect x="115" y="125" width="70" height="35" fill="#0f172a" rx="2"/>
  <path d="M120 135 L140 135 M120 145 L150 145 M120 155 L135 155" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Speed/Urgency Lines -->
  <path d="M180 80 L210 70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 90 L220 85" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <rect x="190" y="140" width="20" height="20" fill="#ec4899" rx="3"/>
  <path d="M210 145 Q220 145 220 155" stroke="#ec4899" stroke-width="3" fill="none"/>
  
  <!-- Papers -->
  <rect x="40" y="145" width="30" height="15" fill="#e2e8f0" rx="2"/>
  <rect x="45" y="135" width="30" height="15" fill="#94a3b8" rx="2"/>
</svg>