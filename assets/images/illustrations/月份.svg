<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Decorative Elements (Calendar Atmosphere) -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="#252A34" stroke-width="1" opacity="0.5"/>

  <!-- Calendar Icon Base (Physical Object representing "月份" - Month) -->
  <g transform="translate(60, 48)">
    <!-- Calendar Back Shadow/Depth -->
    <rect x="0" y="12" width="120" height="120" rx="16" fill="#15181E"/>
    
    <!-- Main Calendar Body -->
    <rect x="0" y="0" width="120" height="120" rx="16" fill="#222834" stroke="#2D3548" stroke-width="2"/>
    
    <!-- Top Header Banner (Month Identifier Color) -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 104 0 C 112.837 0 120 7.163 120 16 L 120 36 L 0 36 Z" fill="#F59E0B"/>
    
    <!-- Binding Rings / Spirals -->
    <rect x="32" y="-8" width="8" height="16" rx="4" fill="#4B5563"/>
    <rect x="80" y="-8" width="8" height="16" rx="4" fill="#4B5563"/>
    <circle cx="36" cy="0" r="3" fill="#1A1D24"/>
    <circle cx="84" cy="0" r="3" fill="#1A1D24"/>

    <!-- Calendar Grid / Days Representation -->
    <!-- Row 1 -->
    <rect x="18" y="52" width="16" height="14" rx="3" fill="#2E384D"/>
    <rect x="40" y="52" width="16" height="14" rx="3" fill="#2E384D"/>
    <rect x="62" y="52" width="16" height="14" rx="3" fill="#2E384D"/>
    <rect x="84" y="52" width="16" height="14" rx="3" fill="#2E384D"/>

    <!-- Row 2 (Highlighted/Focal Date representing the specific month period) -->
    <rect x="18" y="72" width="16" height="14" rx="3" fill="#2E384D"/>
    <!-- Highlighted Active Day -->
    <rect x="38" y="70" width="20" height="18" rx="4" fill="#F59E0B"/>
    <rect x="62" y="72" width="16" height="14" rx="3" fill="#2E384D"/>
    <rect x="84" y="72" width="16" height="14" rx="3" fill="#2E384D"/>

    <!-- Row 3 -->
    <rect x="18" y="92" width="16" height="14" rx="3" fill="#2E384D"/>
    <rect x="40" y="92" width="16" height="14" rx="3" fill="#2E384D"/>
    <rect x="62" y="92" width="16" height="14" rx="3" fill="#2E384D"/>
    <rect x="84" y="92" width="16" height="14" rx="3" fill="#2E384D"/>
  </g>

  <!-- Contextual Nature Accent (Reflecting "天气特别好" - Beautiful weather associated with the month) -->
  <!-- Sun & Cloud icon floating gently near top right of calendar to symbolize seasonal climate -->
  <g transform="translate(150, 36)">
    <!-- Sun -->
    <circle cx="16" cy="16" r="12" fill="#F59E0B"/>
    <!-- Sun rays -->
    <line x1="16" y1="-2" x2="16" y2="2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="30" x2="16" y2="34" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-2" y1="16" x2="2" y2="16" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="16" x2="34" y2="16" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Small overlapping cloud -->
    <path d="M 22 24 A 6 6 0 0 1 34 24 A 5 5 0 0 1 39 29 A 5 5 0 0 1 34 34 L 20 34 A 6 6 0 0 1 22 24 Z" fill="#60A5FA" opacity="0.9"/>
  </g>

</svg>