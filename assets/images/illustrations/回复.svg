<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative Background Glow/Elements for Modern Context -->
  <circle cx="120" cy="120" r="90" fill="#222732" opacity="0.5"/>

  <!-- Email Interface Representation -->
  <g transform="translate(36, 45)">
    <!-- Main Email Card Background -->
    <rect x="0" y="0" width="168" height="110" rx="12" fill="#282E3D" stroke="#353E52" stroke-width="2"/>
    
    <!-- Incoming Mail Header -->
    <circle cx="24" cy="24" r="8" fill="#4B5563"/>
    <rect x="40" y="20" width="60" height="6" rx="3" fill="#4B5563"/>
    
    <!-- Incoming Message Lines -->
    <rect x="24" y="44" width="100" height="4" rx="2" fill="#3B4252"/>
    <rect x="24" y="56" width="70" height="4" rx="2" fill="#3B4252"/>

    <!-- Action: Dynamic Reply Bubble (Focus Accent) -->
    <g transform="translate(44, 70)">
      <!-- Reply Background -->
      <rect x="0" y="0" width="100" height="32" rx="8" fill="#FFB800"/>
      <!-- Reply Text Placeholder Lines -->
      <rect x="14" y="11" width="50" height="4" rx="2" fill="#1A1D24"/>
      <rect x="14" y="19" width="30" height="4" rx="2" fill="#1A1D24"/>
      
      <!-- Motion/Action Indicator Arrow -->
      <path d="M 76 16 L 86 16 M 82 12 L 86 16 L 82 20" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Dynamic Action Element: Outgoing Arrow representing 'Returning/Replying' -->
  <g transform="translate(120, 175)">
    <!-- Curved Action Motion Line -->
    <path d="M -40 -10 C -20 -25, 20 -25, 40 -10" fill="none" stroke="#FFB800" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    
    <!-- Send/Reply Pointer Hand or Arrow icon -->
    <circle cx="0" cy="-20" r="16" fill="#FFB800"/>
    <path d="M -5 -23 L 5 -20 L -1 -15 Z" fill="#1A1D24"/>
  </g>

</svg>