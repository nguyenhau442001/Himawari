    <!-- Hair -->
    <path d="M-25 -15 C-25 -35, 25 -35, 25 -15 L25 -10 C10 -20, -10 -20, -25 -10 Z" fill="#1e293b"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="180" r="8" fill="#ec4899"/>
  <circle cx="190" cy="190" r="6" fill="#10b981"/>
  <path d="M180 60 L190 50 L200 60 L190 70 Z" fill="#fb923c"/>
  
