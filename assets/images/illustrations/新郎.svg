      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Archway -->
  <path d="M70 60 C70 30, 170 30, 170 60 L170 240 L70 240 Z" fill="#334155" opacity="0.5"/>
  <circle cx="120" cy="60" r="50" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Groom Character -->
