<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow representing visual impact/cinematic atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#0EA5E9" opacity="0.08"/>
  <circle cx="120" cy="115" r="45" fill="#F59E0B" opacity="0.05"/>

  <!-- Futuristic Sci-Fi VR/Visual Headset (representing "视觉" / Vision & Cinematic FX) -->
  <g transform="translate(120, 115)">
    <!-- Holographic projection beam lines shooting out forward -->
    <path d="M -30 -35 L -75 -65 M 30 -35 L 75 -65" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M -35 0 L -85 0 M 35 0 L 85 0" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M -30 35 L -75 65 M 30 35 L 75 65" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Holographic floating visual nodes (spark of visual shock / impact) -->
    <circle cx="-85" cy="0" r="3" fill="#0EA5E9"/>
    <circle cx="85" cy="0" r="3" fill="#0EA5E9"/>
    <circle cx="-75" cy="-65" r="2" fill="#F59E0B"/>
    <circle cx="75" cy="-65" r="2" fill="#F59E0B"/>
    <circle cx="-75" cy="65" r="2" fill="#F59E0B"/>
    <circle cx="75" cy="65" r="2" fill="#F59E0B"/>

    <!-- Headband / Strap -->
    <path d="M -45 -22 C -70 -15 -75 15 -45 22" fill="none" stroke="#2D3748" stroke-width="8" stroke-linecap="round"/>
    <path d="M 45 -22 C 70 -15 75 15 45 22" fill="none" stroke="#2D3748" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 -52 C -40 -50 -55 -25 -45 -22" fill="none" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>

    <!-- Main Visor Body (Sleek modern curve) -->
    <path d="M -44 -26 C -20 -30 20 -30 44 -26 C 54 -24 58 -10 52 14 C 44 32 -44 32 -52 14 C -58 -10 -54 -24 -44 -26 Z" fill="#2D3748"/>
    
    <!-- Inner Dark Screen Area -->
    <path d="M -38 -20 C -18 -23 18 -23 38 -20 C 45 -19 48 -10 42 8 C 36 24 -36 24 -42 8 C -48 -10 -45 -19 -38 -20 Z" fill="#0B0E14"/>

    <!-- Glowing Eye Lenses (Vibrant Cyan and Gold accentuating sight/visuals) -->
    <g>
      <!-- Left Lens -->
      <path d="M -32 -14 C -20 -16 -10 -16 -4 -12 C -6 2 -22 4 -30 -2 C -33 -6 -33 -12 -32 -14 Z" fill="#0EA5E9"/>
      <path d="M -26 -11 C -18 -12 -12 -12 -8 -9 C -10 -1 -18 0 -23 -3 C -25 -6 -26 -9 -26 -11 Z" fill="#E0F2FE" opacity="0.6"/>

      <!-- Right Lens -->
      <path d="M 32 -14 C 20 -16 10 -16 4 -12 C 6 2 22 4 30 -2 C 33 -6 33 -12 32 -14 Z" fill="#F59E0B"/>
      <path d="M 26 -11 C 18 -12 12 -12 8 -9 C 10 -1 18 0 23 -3 C 25 -6 26 -9 26 -11 Z" fill="#FEF3C7" opacity="0.7"/>
    </g>

    <!-- Central Sleek Accent / Sensor -->
    <rect x="-3" y="-6" width="6" height="12" rx="3" fill="#64748B"/>
    <circle cx="0" cy="0" r="1.5" fill="#1A1D24"/>
  </g>

  <!-- Bottom visual grounding line to complete clean tech aesthetic -->
  <path d="M 80 190 L 160 190" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="190" r="3" fill="#0EA5E9"/>
</svg>