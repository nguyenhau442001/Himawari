<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Riverbed and Water -->
  <path d="M40 140 C 80 120, 160 120, 200 140 L 200 190 C 160 170, 80 170, 40 190 Z" fill="#2C3E50"/>
  <path d="M40 140 C 80 120, 160 120, 200 140 L 200 165 C 160 145, 80 145, 40 165 Z" fill="#3498DB"/>
  
  <!-- Restoration elements: Clean water and greenery -->
  <path d="M50 155 Q 70 145, 90 155 T 130 155 T 170 155 T 210 155" stroke="#81D4FA" stroke-width="2" fill="none"/>
  
  <!-- Greenery on banks -->
  <circle cx="60" cy="135" r="8" fill="#2ECC71"/>
  <circle cx="75" cy="132" r="10" fill="#27AE60"/>
  <circle cx="90" cy="138" r="7" fill="#2ECC71"/>
  
  <circle cx="180" cy="138" r="8" fill="#2ECC71"/>
  <circle cx="165" cy="132" r="10" fill="#27AE60"/>
  <circle cx="150" cy="138" r="7" fill="#2ECC71"/>
  
  <!-- Mechanical/Treatment intervention: A stylized water filtration/purification gate -->
  <rect x="110" y="110" width="20" height="60" rx="2" fill="#F39C12"/>
  <rect x="105" y="100" width="30" height="10" rx="2" fill="#E67E22"/>
  <rect x="108" y="160" width="24" height="5" rx="1" fill="#D35400"/>
  
  <!-- Flow lines indicating movement and cleaning -->
  <path d="M120 120 L 120 150" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 130 L 125 130" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 140 L 125 140" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
</svg>