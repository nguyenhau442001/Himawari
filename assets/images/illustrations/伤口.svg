<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow behind the wound for infection/medical context -->
  <circle cx="120" cy="120" r="60" fill="#2D1F24" opacity="0.8"/>
  <circle cx="120" cy="120" r="45" fill="#3D1A22" opacity="0.6"/>

  <!-- Skin surface representation -->
  <g opacity="0.15">
    <path d="M50 80 Q 90 75 140 85 T 190 75" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M45 160 Q 95 165 140 155 T 195 165" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>

  <!-- Infection aura/glow -->
  <path d="M85 105 Q 120 90 155 105 Q 170 140 150 165 Q 120 180 90 165 Q 70 140 85 105 Z" fill="#992D22" opacity="0.3"/>

  <!-- Main Wound (伤口) - Central physical object -->
  <g transform="translate(120, 120)">
    <!-- Deep tissue / incision gap -->
    <path d="M-35 -15 C -15 -25 15 -25 35 -15 C 20 25 -20 25 -35 -15 Z" fill="#781C1C"/>
    
    <!-- Inner wound depth & blood pooling -->
    <path d="M-25 -10 C -10 -18 10 -18 25 -10 C 15 15 -15 15 -25 -10 Z" fill="#4A0E0E"/>
    <path d="M-15 -5 C -5 -10 5 -10 15 -5 C 8 8 -8 8 -15 -5 Z" fill="#2E0505"/>

    <!-- Angry red inflamed skin edges -->
    <path d="M-40 -18 C -18 -32 18 -32 40 -18 C 45 -5 30 20 40 32 C 15 28 -15 28 -40 32 C -30 20 -45 -5 -40 -18 Z" fill="none" stroke="#E74C3C" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Infection highlights (greenish/yellowish tint context for infection) -->
    <circle cx="-12" cy="-2" r="3" fill="#F1C40F" opacity="0.7"/>
    <circle cx="15" cy="5" r="2.5" fill="#2ECC71" opacity="0.6"/>
    <circle cx="2" cy="12" r="2" fill="#F1C40F" opacity="0.5"/>
  </g>

  <!-- Medical Cross / Focus Indicator in subtle gold/orange accent -->
  <g transform="translate(120, 48)">
    <circle cx="0" cy="0" r="14" fill="#232A36" stroke="#F39C12" stroke-width="2"/>
    <path d="M-5 -1 L-5 -5 L-1 -5 L-1 -1 L5 -1 L5 1 L-1 1 L-1 5 L-5 5 L-5 1 L-9 1 L-9 -1 Z" fill="#F39C12"/>
  </g>

  <!-- Surgical stitches / staples hinting at the wound nature -->
  <path d="M92 102 L98 118" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  <path d="M148 102 L142 118" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 128 L114 142" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 128 L126 142" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
</svg>