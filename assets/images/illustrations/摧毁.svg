<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Wind/Tornado motion lines -->
  <path d="M200 40 C 180 40, 160 80, 140 120 C 120 160, 100 200, 80 200" stroke="#FF9F1C" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.6"/>
  <path d="M220 60 C 200 60, 180 100, 160 140 C 140 180, 120 220, 100 220" stroke="#FF9F1C" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Collapsing Building Structure -->
  <g transform="translate(40, 120)">
    <!-- Base -->
    <rect x="0" y="60" width="120" height="20" fill="#4A5568"/>
    <!-- Falling segments -->
    <rect x="10" y="20" width="40" height="30" fill="#E53E3E" transform="rotate(-15 30 35)"/>
    <rect x="70" y="10" width="40" height="40" fill="#E53E3E" transform="rotate(10 90 30)"/>
    <!-- Debris -->
    <path d="M20 80 L30 100 L40 80 Z" fill="#A0AEC0"/>
    <path d="M80 80 L95 105 L110 80 Z" fill="#A0AEC0"/>
    <circle cx="50" cy="90" r="4" fill="#718096"/>
    <circle cx="90" cy="95" r="3" fill="#718096"/>
  </g>

  <!-- Impact/Force Indicator -->
  <path d="M130 100 L160 70 M150 110 L180 80" stroke="#FF9F1C" stroke-width="6" stroke-linecap="round"/>
</svg>