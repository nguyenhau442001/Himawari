<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Document Red Stamp Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment: Office Interior -->
  <g id="environment">
    <!-- Back Wall -->
    <rect x="20" y="20" width="200" height="150" fill="#1e293b"/>
    
    <!-- Window Frame & View -->
    <g transform="translate(150, 35)">
      <rect x="0" y="0" width="55" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <!-- Window panes -->
      <line x1="27" y1="0" x2="27" y2="70" stroke="#334155" stroke-width="1.5"/>
      <line x1="0" y1="35" x2="55" y2="35" stroke="#334155" stroke-width="1.5"/>
      <!-- City silhouette outside -->
      <path d="M 5 70 L 5 45 L 12 45 L 12 70 Z" fill="#1e293b" opacity="0.8"/>
      <path d="M 15 70 L 15 30 L 25 30 L 25 70 Z" fill="#1e293b" opacity="0.8"/>
      <path d="M 30 70 L 30 50 L 40 50 L 40 70 Z" fill="#1e293b" opacity="0.8"/>
      <path d="M 42 70 L 42 38 L 50 38 L 50 70 Z" fill="#1e293b" opacity="0.8"/>
    </g>

    <!-- Light Beam from Window crossing the scene -->
    <polygon points="150,35 205,35 230,170 100,170" fill="url(#lightBeam)"/>

    <!-- Bookshelf / Files in background -->
    <rect x="25" y="35" width="30" height="60" fill="#334155" rx="2"/>
    <line x1="25" y1="55" x2="55" y2="55" stroke="#1e293b" stroke-width="2"/>
    <line x1="25" y1="75" x2="55" y2="75" stroke="#1e293b" stroke-width="2"/>
    <rect x="30" y="40" width="6" height="13" fill="#fb923c" rx="1"/>
    <rect x="38" y="42" width="5" height="11" fill="#38bdf8" rx="1"/>
    <rect x="32" y="60" width="12" height="13" fill="#10b981" rx="1"/>

    <!-- Office Wall Clock showing late hours -->
    <circle cx="105" cy="45" r="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="105" y1="45" x2="105" y2="39" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="105" y1="45" x2="111" y2="47" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Office Desk Surface -->
  <rect x="15" y="170" width="210" height="50" fill="url(#deskGrad)" rx="3"/>
  <rect x="15" y="167" width="210" height="5" fill="#64748b" rx="1"/>

  <!-- Desktop Props -->
  <!-- Laptop -->
  <path d="M 30,170 L 55,145 L 85,145 L 110,170 Z" fill="#64748b"/>
  <path d="M 28,170 L 112,170 L 115,173 L 25,173 Z" fill="#94a3b8" rx="1"/>
  <!-- Glowing screen -->
  <path d="M 35,166 L 57,148 L 83,148 L 105,166 Z" fill="#0f172a"/>

  <!-- Main Subject (Employee receiving discipline/punishment) -->
  <g id="employee">
    <!-- Body / Torso leaning down -->
    <path d="M 100,170 C 100,150 115,135 130,135 C 145,135 155,150 158,170 Z" fill="#3b82f6"/>
    <!-- Suit collar / Tie -->
    <polygon points="128,135 133,135 130,155" fill="#f8fafc"/>
    <polygon points="130,140 132,140 134,165 130,170 126,165" fill="#ef4444"/>

    <!-- Head & Hair (Downward, remorseful posture) -->
    <circle cx="138" cy="118" r="16" fill="#fbcfe8"/>
    <!-- Hair style -->
    <path d="M 122,116 C 122,105 135,100 150,108 C 152,115 150,122 150,122 L 126,122 Z" fill="#1e293b"/>
    <!-- Worried facial expression brow lines -->
    <line x1="142" y1="114" x2="148" y2="117" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="130" y1="114" x2="126" y2="117" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms resting on desk / head in hands -->
    <path d="M 115,150 C 125,140 135,140 145,150" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="148" r="5" fill="#fbcfe8"/>
    <circle cx="115" cy="148" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Official Disciplinary Notice / Document on Desk -->
  <g id="official-document" transform="translate(135, 150)">
    <!-- Paper base -->
    <rect x="0" y="0" width="40" height="25" fill="#f8fafc" rx="1" transform="rotate(-8)" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Text lines placeholder on paper -->
    <line x1="6" y1="6" x2="26" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" transform="rotate(-8)"/>
    <line x1="6" y1="11" x2="32" y2="10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" transform="rotate(-8)"/>
    <line x1="6" y1="16" x2="20" y2="15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" transform="rotate(-8)"/>
    
    <!-- Heavy Red Official Penalty Stamp (處分 / Xử phạt concept) -->
    <g transform="translate(18, 8) rotate(-12)">
      <rect x="-2" y="-2" width="20" height="14" fill="none" stroke="#dc2626" stroke-width="2" rx="2" filter="url(#glow)"/>
      <line x1="1" y1="5" x2="17" y2="5" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="1" y1="8" x2="17" y2="8" stroke="#dc2626" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Dramatic Atmosphere Elements (Subtle Warning/Serious Vibe) -->
  <g id="atmosphere-accents">
    <!-- Ambient glowing caution light or shadow overlay -->
    <circle cx="195" cy="90" r="35" fill="#ef4444" opacity="0.04" filter="url(#glow)"/>
  </g>
</svg>