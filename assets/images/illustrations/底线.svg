<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing background effect for the boundary line -->
  <line x1="30" y1="160" x2="210" y2="160" stroke="#FF4D4D" stroke-width="8" stroke-opacity="0.25" stroke-linecap="round"/>
  
  <!-- The Red Line (Bottom line / lằn ranh đỏ) -->
  <line x1="30" y1="160" x2="210" y2="160" stroke="#FF4D4D" stroke-width="4" stroke-linecap="round"/>

  <!-- Warning hatching stripes above the bottom line -->
  <g opacity="0.35">
    <line x1="40" y1="156" x2="55" y2="144" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="156" x2="85" y2="144" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="156" x2="115" y2="144" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="156" x2="145" y2="144" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="156" x2="175" y2="144" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round"/>
    <line x1="190" y1="156" x2="205" y2="144" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Physical Object: A standing upright barrier / boundary marker (Vật thể: Cọc mốc giới hạn kiên cố) -->
  <g transform="translate(120, 115)">
    <!-- Base plate -->
    <path d="M-22 45 L22 45 L16 35 L-16 35 Z" fill="#64748B"/>
    <rect x="-18" y="42" width="36" height="4" rx="2" fill="#94A3B8"/>
    
    <!-- Vertical post -->
    <rect x="-8" y="-15" width="16" height="52" rx="4" fill="#3B82F6"/>
    <rect x="-5" y="-15" width="5" height="52" fill="#60A5FA"/> <!-- Highlight -->

    <!-- Top Cap -->
    <path d="M-12 -15 C-12 -22 12 -22 12 -15 Z" fill="#E2E8F0"/>
    <circle cx="0" cy="-21" r="3" fill="#F59E0B"/>

    <!-- Warning Band on Post -->
    <rect x="-8" y="2" width="16" height="10" fill="#F59E0B"/>
  </g>

  <!-- Footstep approaching the line (representing actions/behavior stepping close to the boundary) -->
  <g transform="translate(120, 185)">
    <!-- Left shoe print -->
    <ellipse cx="-16" cy="0" rx="7" ry="12" fill="#475569" transform="rotate(-10 -16 0)"/>
    <!-- Right shoe print (stopping right before crossing) -->
    <ellipse cx="14" cy="-15" rx="7" ry="12" fill="#64748B" transform="rotate(5 14 -15)"/>
  </g>

  <!-- Scale/Floor grid lines for depth -->
  <line x1="30" y1="195" x2="210" y2="195" stroke="#2A2F3D" stroke-width="2"/>
</svg>