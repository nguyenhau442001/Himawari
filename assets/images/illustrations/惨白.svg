<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background atmosphere: subtle dark blue gradient effect -->
  <circle cx="120" cy="120" r="100" fill="#252A33" opacity="0.5"/>
  
  <!-- Character silhouette -->
  <g transform="translate(60, 40)">
    <!-- Shoulders and Torso -->
    <path d="M20 160 C20 130, 40 110, 60 110 C80 110, 100 130, 100 160 L100 180 L20 180 Z" fill="#2F3542"/>
    
    <!-- Neck -->
    <rect x="50" y="95" width="20" height="20" fill="#3D4451"/>
    
    <!-- Face: The focal point of "惨白" (ghastly pale) -->
    <!-- Using a stark, high-contrast off-white/pale grey to represent the loss of color -->
    <path d="M40 40 C40 20, 55 10, 60 10 C65 10, 80 20, 80 40 L80 90 C80 105, 40 105, 40 90 Z" fill="#E0E6ED"/>
    
    <!-- Hair -->
    <path d="M40 40 C40 10, 60 0, 80 10 L80 40 L60 20 L40 40 Z" fill="#1A1D24"/>
    
    <!-- Eyes: Wide and shocked -->
    <circle cx="52" cy="55" r="5" fill="#1A1D24"/>
    <circle cx="68" cy="55" r="5" fill="#1A1D24"/>
    
    <!-- Mouth: Small, trembling, shocked -->
    <ellipse cx="60" cy="75" rx="4" ry="2" fill="#1A1D24"/>
    
    <!-- Visual contrast: A warm, vibrant orange accent representing the 'normal' skin tone that has drained away, 
         placed as a small floating reference point to emphasize the extreme paleness of the face -->
    <circle cx="160" cy="120" r="15" fill="#FFB86C"/>
    <path d="M150 120 L170 120 M160 110 L160 130" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Motion lines to indicate shaking/trembling -->
  <path d="M50 120 L40 125 M50 140 L40 145" stroke="#44475A" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 120 L140 125 M130 140 L140 145" stroke="#44475A" stroke-width="2" stroke-linecap="round"/>
</svg>