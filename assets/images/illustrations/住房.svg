      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background building silhouettes -->
  <path d="M30 180h40v40H30z" fill="#334155"/>
  <path d="M80 150h50v70H80z" fill="#475569"/>
  <path d="M140 130h60v90H140z" fill="#334155"/>
  
  <!-- Government Official Character -->
  <g transform="translate(40, 120)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M10 40h20l-5 30h-10z" fill="#38bdf8"/>
    <rect x="15" y="70" width="10" height="20" fill="#38bdf8"/>
  </g>
  
  <!-- Document/Policy Paper -->
  <rect x="70" y="150" width="30" height="40" rx="2" fill="#f1f5f9"/>
  <path d="M75 160h20M75 170h20M75 180h10" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Happy Family (Residents) -->
  <g transform="translate(150, 140)">
    <circle cx="15" cy="15" r="10" fill="#fb923c"/>
    <circle cx="35" cy="15" r="10" fill="#ec4899"/>
    <path d="M10 30h10v20h-10z" fill="#10b981"/>
    <path d="M30 30h10v20h-10z" fill="#fb923c"/>
  </g>
  
  <!-- Improved Housing Element (New window/balcony) -->
  <rect x="155" y="80" width="40" height="40" rx="4" fill="#fbbf24" fill-opacity="0.2"/>
  <rect x="160" y="85" width="30" height="30" rx="2" fill="#fef3c7"/>
  <path d="M175 85v30M160 100h30" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Decorative Sparkles/Improvement indicators -->
  <circle cx="120" cy="100" r="3" fill="#10b981"/>
  <circle cx="130" cy="80" r="2" fill="#38bdf8"/>
  <path d="M110 140l10-10" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
