<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing pulse effect in background -->
  <circle cx="120" cy="120" r="70" fill="#FF5252" opacity="0.08"/>
  <circle cx="120" cy="120" r="50" fill="#FF5252" opacity="0.12"/>

  <!-- Blood Pressure Monitor (Sphygmomanometer) -->
  <!-- Main Body (Monitor) -->
  <rect x="85" y="70" width="70" height="95" rx="12" fill="#2D323E" stroke="#3A4252" stroke-width="2"/>
  
  <!-- Screen Area -->
  <rect x="95" y="82" width="50" height="40" rx="6" fill="#14171D"/>
  
  <!-- Digital Numbers (High BP indication: e.g., 140/90) -->
  <!-- Systolic -->
  <text x="103" y="102" fill="#FF5252" font-family="monospace" font-size="12" font-weight="bold">140</text>
  <text x="130" y="102" fill="#8C94A0" font-family="monospace" font-size="9">mmHg</text>
  <!-- Divider -->
  <line x1="103" y1="108" x2="137" y2="108" stroke="#3A4252" stroke-width="1.5"/>
  <!-- Diastolic -->
  <text x="103" y="118" fill="#4CD964" font-family="monospace" font-size="12" font-weight="bold">90</text>

  <!-- Monitor Buttons -->
  <circle cx="105" cy="138" r="4" fill="#FF9F0A"/>
  <circle cx="120" cy="138" r="4" fill="#3A4252"/>
  <circle cx="135" cy="138" r="4" fill="#3A4252"/>

  <!-- Connector Port -->
  <rect x="112" y="165" width="16" height="5" rx="2" fill="#3A4252"/>

  <!-- Curled Tubing -->
  <path d="M 120 170 Q 120 190 100 195 T 70 185 T 50 160" fill="none" stroke="#8C94A0" stroke-width="4" stroke-linecap="round"/>

  <!-- Arm Cuff -->
  <g transform="translate(30, 90)">
    <rect x="0" y="0" width="28" height="70" rx="6" fill="#FF9F0A" opacity="0.9"/>
    <rect x="6" y="8" width="16" height="54" rx="3" fill="#E58E00"/>
    <!-- Velcro lines / details -->
    <line x1="6" y1="20" x2="22" y2="20" stroke="#CC7A00" stroke-width="2"/>
    <line x1="6" y1="35" x2="22" y2="35" stroke="#CC7A00" stroke-width="2"/>
    <line x1="6" y1="50" x2="22" y2="50" stroke="#CC7A00" stroke-width="2"/>
  </g>

  <!-- Pulse Wave / ECG line crossing background subtly -->
  <path d="M 20 180 L 70 180 L 85 180 L 95 150 L 105 210 L 115 130 L 125 195 L 135 180 L 160 180 L 220 180" fill="none" stroke="#FF5252" stroke-width="2" opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>