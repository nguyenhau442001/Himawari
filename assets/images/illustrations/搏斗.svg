<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed and Patient -->
  <g transform="translate(40, 120)">
    <rect x="0" y="40" width="160" height="20" rx="4" fill="#334155"/>
    <path d="M20 40 L40 0 L120 0 L140 40 Z" fill="#475569"/>
    <!-- Patient -->
    <path d="M50 10 Q80 -20 110 10" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="10" r="8" fill="#fbbf24"/>
  </g>

  <!-- Medical Equipment (The 'Opponent') -->
  <g transform="translate(150, 60)">
    <rect x="0" y="0" width="50" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="10" y="15" width="30" height="5" rx="2" fill="#38bdf8"/>
    <rect x="10" y="30" width="30" height="5" rx="2" fill="#38bdf8"/>
    <rect x="10" y="45" width="30" height="5" rx="2" fill="#38bdf8"/>
    <circle cx="25" cy="65" r="8" fill="#ec4899"/>
  </g>

  <!-- Symbolic 'Years' / Time passing -->
  <g transform="translate(20, 30)">
    <path d="M0 20 L40 20 M20 0 L20 40" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="20" cy="20" r="15" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="20 10"/>
  </g>

  <!-- Window/Atmosphere -->
  <rect x="180" y="20" width="40" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="200" cy="40" r="10" fill="#fbbf24"/>
  
  <!-- Decorative accents -->
  <circle cx="120" cy="180" r="3" fill="#10b981"/>
  <circle cx="140" cy="190" r="2" fill="#38bdf8"/>
</svg>