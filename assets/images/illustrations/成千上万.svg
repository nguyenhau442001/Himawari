      <path d="M-50 0 C-30 -10 -10 0 10 -5 C30 -10 50 0 70 -5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M-65 20 C-45 10 -25 20 -5 15 C15 10 35 20 55 15" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M-40 40 C-20 30 0 40 20 35 C40 30 60 40 80 35" stroke="#FFB84D" stroke-width="2" fill="none"/>
      
      <!-- Individual bird silhouettes (V-shapes) -->
      <path d="M-80 -50 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M-20 -60 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M40 -70 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M-90 -10 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M80 -10 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M-70 30 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M20 50 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M-30 60 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M60 60 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M-100 10 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
      <path d="M90 20 l5 -5 l5 5" stroke="#FFB84D" stroke-width="2" fill="none"/>
    </g>
