<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="100%" stop-color="#14171F"/>
    </linearGradient>

    <!-- Metallic/Slate Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B88A1"/>
      <stop offset="50%" stop-color="#56627A"/>
      <stop offset="100%" stop-color="#3C4659"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4CB"/>
      <stop offset="100%" stop-color="#7B88A1"/>
    </linearGradient>

    <!-- Horn Gradients (The distinctive feature of 未 / Ram / Goat) -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>

    <!-- Accent Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow Behind Subject -->
  <circle cx="120" cy="120" r="70" fill="#F39C12" opacity="0.06" filter="url(#goldGlow)"/>

  <!-- Graphic Subject: Stylized Modern Ram/Goat (Representing the physical entity "未" / The Eighth Earthly Branch) -->
  <g transform="translate(0, 5)">
    <!-- Majestic Curled Horns (Symbolic structural reference to the top strokes of 未) -->
    <!-- Left Horn -->
    <path d="M 92 82 C 60 70 50 95 62 115 C 70 128 85 125 90 115 C 95 105 88 95 80 95" 
          fill="none" stroke="url(#hornGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Right Horn -->
    <path d="M 148 82 C 180 70 190 95 178 115 C 170 128 155 125 150 115 C 145 105 152 95 160 95" 
          fill="none" stroke="url(#hornGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Ears -->
    <ellipse cx="85" cy="103" rx="10" ry="5" fill="#4E5D75" transform="rotate(-20 85 103)"/>
    <ellipse cx="155" cy="103" rx="10" ry="5" fill="#4E5D75" transform="rotate(20 155 103)"/>

    <!-- Head / Snout Structure -->
    <path d="M 98 85 Q 120 75 142 85 L 148 115 Q 120 135 92 115 Z" fill="url(#headGrad)"/>

    <!-- Muzzle / Nose Area -->
    <ellipse cx="120" cy="120" rx="14" ry="9" fill="#363E4D"/>
    <polygon points="116,117 124,117 120,123" fill="#F39C12"/>

    <!-- Eyes (Calm, focused expression) -->
    <circle cx="104" cy="98" r="3.5" fill="#1E222D"/>
    <circle cx="136" cy="98" r="3.5" fill="#1E222D"/>
    <circle cx="105" cy="97" r="1" fill="#FFFFFF"/>
    <circle cx="137" cy="97" r="1" fill="#FFFFFF"/>

    <!-- Body Torso / Pedestal -->
    <path d="M 90 132 L 150 132 C 162 132 170 140 170 152 L 170 175 C 170 180 166 184 160 184 L 80 184 C 74 184 70 180 70 175 L 70 152 C 70 140 78 132 90 132 Z" fill="url(#bodyGrad)"/>

    <!-- Modern Geometric Accents (Chest Plate / Core) -->
    <polygon points="120,145 135,165 105,165" fill="#F39C12" opacity="0.9"/>
    <circle cx="120" cy="158" r="3" fill="#1E222D"/>
  </g>

  <!-- Sleek Minimal Frame Accent -->
  <rect x="16" y="16" width="208" height="208" rx="16" fill="none" stroke="#2B313F" stroke-width="1.5" opacity="0.6"/>
</svg>