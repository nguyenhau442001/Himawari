<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background cavern walls (Deep ravine / 谷) -->
  <path d="M20 20 L80 180 L100 220 L140 220 L160 180 L220 20 Z" fill="#222733"/>
  <path d="M20 20 L65 160 L90 220 L70 220 L40 160 L10 20 Z" fill="#161921"/>
  <path d="M220 20 L175 160 L150 220 L170 220 L200 160 L230 20 Z" fill="#161921"/>
  
  <!-- Rocky ground at the bottom (低谷 floor) -->
  <path d="M70 220 L95 195 L120 210 L145 195 L170 220 Z" fill="#2A303C"/>
  <ellipse cx="120" cy="205" rx="55" ry="12" fill="#12141A"/>
  
  <!-- Central Physical Object/Scene: A lone climber in a deep rocky valley looking up toward a distant speck of light, representing the low point in life (低谷) -->
  
  <!-- Distant light at the top -->
  <ellipse cx="120" cy="28" rx="25" ry="6" fill="#FFA726" opacity="0.3"/>
  
  <!-- Boulder obstacle -->
  <circle cx="100" cy="180" r="18" fill="#323846"/>
  <path d="M85 185 Q95 160 115 170 T110 190 Z" fill="#3D4454"/>
  
  <!-- Lone human figure (Climber/Person in hardship) sitting/resting at the bottom -->
  <!-- Legs -->
  <path d="M110 195 L125 195 L128 205 L112 205 Z" fill="#546E7A"/>
  <!-- Torso -->
  <path d="M106 175 C106 170, 118 170, 118 175 L120 195 L108 195 Z" fill="#EF6C00"/>
  <!-- Head -->
  <circle cx="113" cy="163" r="6" fill="#FFCCBC"/>
  <!-- Bent arm leaning on knee -->
  <path d="M110 178 L118 185 L113 189" stroke="#EF6C00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Glowing accent light from above illuminating the person (The ray of hope/friendship reference) -->
  <polygon points="120,20 100,200 140,200" fill="#FFA726" opacity="0.08"/>
  
  <!-- Small sprout growing from the rock crack, symbolizing resilience in the low point -->
  <path d="M135 198 Q137 190 142 188" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M142 188 C145 185, 148 188, 146 191 C144 193, 140 192, 142 188 Z" fill="#66BB6A"/>
  <path d="M140 192 C137 190, 136 193, 138 195 C140 197, 141 194, 140 192 Z" fill="#81C784"/>
</svg>