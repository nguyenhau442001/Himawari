<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground line / Road surface -->
  <path d="M40 180 L200 180" stroke="#2D333B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Glowing focus effect behind the wallet -->
  <circle cx="120" cy="145" r="45" fill="#FFB703" opacity="0.1"/>
  
  <!-- Dropped/Found Wallet (Object representing "拾" - picking up/finding an object) -->
  <g transform="translate(120, 145) rotate(-15)">
    <!-- Wallet Shadow -->
    <rect x="-32" y="-18" width="64" height="42" rx="8" fill="#000000" opacity="0.3" transform="translate(0, 8)"/>
    
    <!-- Wallet Main Body -->
    <rect x="-30" y="-20" width="60" height="40" rx="6" fill="#D4A373"/>
    
    <!-- Wallet Fold/Flap Texture -->
    <path d="M-30 -2 L30 -2" stroke="#BC6C25" stroke-width="2"/>
    <rect x="-30" y="-15" width="60" height="25" rx="4" fill="#CCD5AE" opacity="0.2"/>
    
    <!-- Wallet Clasp / Buckle -->
    <rect x="5" y="-8" width="16" height="12" rx="3" fill="#FEFAE0"/>
    <circle cx="13" cy="-2" r="2.5" fill="#283618"/>
  </g>

  <!-- Hand reaching down to pick up the wallet -->
  <g transform="translate(120, 75)">
    <!-- Arm/Hand path reaching from top -->
    <path d="M 0,-35 C 0,-10 5,0 15,35" stroke="#E9C46A" stroke-width="16" stroke-linecap="round" fill="none"/>
    
    <!-- Fingers curving to grasp -->
    <path d="M 12,28 C 10,38 -5,48 -15,42 C -22,38 -20,32 -10,35" stroke="#E9C46A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Thumb -->
    <path d="M 8,20 C 18,22 25,30 22,35" stroke="#E9C46A" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkles/Action indicators highlighting the action of picking up -->
  <g fill="#FFB703">
    <!-- Top left sparkle -->
    <path d="M 75 90 Q 75 97 68 97 Q 75 97 75 104 Q 75 97 82 97 Q 75 97 75 90" />
    <!-- Bottom right sparkle -->
    <path d="M 165 130 Q 165 135 160 135 Q 165 135 165 140 Q 165 135 170 135 Q 165 135 165 130" />
  </g>
</svg>