<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid and baseline -->
  <line x1="36" y1="180" x2="204" y2="180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Drop trajectory (falling phase - grayed out) -->
  <path d="M 60 70 Q 90 70 110 140" fill="none" stroke="#3A4254" stroke-width="2.5" stroke-dasharray="4,4" stroke-linecap="round"/>
  
  <!-- Rebound trajectory (rising phase - vibrant gold/orange) -->
  <path d="M 110 140 Q 140 70 180 60" fill="none" stroke="url(#reboundGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Arrow head at the peak of rebound -->
  <path d="M 168 58 L 181 60 L 176 72" fill="none" stroke="#FFB020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Motion lines / upward energy trails -->
  <line x1="140" y1="95" x2="135" y2="75" stroke="#FFB020" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="155" y1="80" x2="153" y2="60" stroke="#FFB020" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- The Bouncing Physical Object (Globe/Sphere representing commodity/oil price) -->
  <g transform="translate(180, 60)">
    <!-- Glow effect -->
    <circle cx="0" cy="0" r="18" fill="#FFB020" opacity="0.15"/>
    <!-- Main ball body -->
    <circle cx="0" cy="0" r="13" fill="#FFB020"/>
    <!-- 3D/Flat shading highlight -->
    <circle cx="-3" cy="-3" r="10" fill="#FFA500" opacity="0.3"/>
    <path d="M -9 0 A 9 9 0 0 0 9 0 Z" fill="#FFF" opacity="0.2"/>
  </g>

  <!-- Impact point shadow/flash on the ground -->
  <ellipse cx="110" cy="180" rx="12" ry="4" fill="#FFB020" opacity="0.4"/>
  <circle cx="110" cy="180" r="4" fill="#FFF" opacity="0.8"/>

  <!-- Starting point indicator (ghost ball) -->
  <circle cx="60" cy="70" r="10" fill="#3A4254" opacity="0.5"/>

  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="reboundGrad" x1="110" y1="140" x2="180" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
  </defs>
</svg>