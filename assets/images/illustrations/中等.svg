<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "中等" (Medium/Average) as a central, balanced physical object: A stack of three books of equal size, with the middle one highlighted in gold to signify the "middle" position in a sequence. -->
  
  <!-- Bottom book -->
  <rect x="70" y="150" width="100" height="20" rx="2" fill="#4A5568"/>
  <rect x="72" y="152" width="96" height="16" rx="1" fill="#2D3748"/>
  
  <!-- Middle book (The "Middle/中" focus) -->
  <rect x="70" y="125" width="100" height="20" rx="2" fill="#D69E2E"/>
  <rect x="72" y="127" width="96" height="16" rx="1" fill="#B7791F"/>
  
  <!-- Top book -->
  <rect x="70" y="100" width="100" height="20" rx="2" fill="#4A5568"/>
  <rect x="72" y="102" width="96" height="16" rx="1" fill="#2D3748"/>
  
  <!-- Supporting surface -->
  <rect x="50" y="175" width="140" height="8" rx="4" fill="#718096"/>
</svg>