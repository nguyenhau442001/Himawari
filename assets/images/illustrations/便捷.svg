<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Ambient glow behind phone -->
    <circle cx="120" cy="115" r="50" fill="#FFB703" opacity="0.08"/>
    
    <!-- Chaotic / Slow Side (Left indicator representing cumbersome old way - subtle contrast) -->
    <g opacity="0.25">
      <path d="M50 95 L65 95 M57.5 87.5 L57.5 102.5" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="45" y="115" width="25" height="15" rx="3" fill="none" stroke="#94A3B8" stroke-width="2"/>
    </g>

    <!-- Sleek Modern Smartphone (Center Stage) representing 便捷 (Convenience) -->
    <rect x="92" y="55" width="56" height="110" rx="10" fill="#283044" stroke="#475569" stroke-width="2"/>
    <rect x="98" y="65" width="44" height="84" rx="4" fill="#0F172A"/>
    
    <!-- Phone Notch / Dynamic Island -->
    <rect x="110" y="60" width="20" height="4" rx="2" fill="#475569"/>

    <!-- App Interface UI - Simplified Fast Payment / Convenient Scan -->
    <!-- QR Code Graphic Area -->
    <rect x="106" y="78" width="28" height="28" rx="4" fill="#1E293B"/>
    <rect x="110" y="82" width="8" height="8" rx="1" fill="#FFB703"/>
    <rect x="122" y="82" width="8" height="8" rx="1" fill="#FFB703"/>
    <rect x="110" y="94" width="8" height="8" rx="1" fill="#FFB703"/>
    <rect x="124" y="96" width="4" height="4" fill="#FFB703"/>

    <!-- Success Checkmark representing smooth completion -->
    <circle cx="120" cy="123" r="10" fill="#10B981"/>
    <path d="M115 123 L118 126 L125 119" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Motion / Speed / Instant Action Lines (Adjective representation: fast & smooth) -->
    <path d="M158 85 L175 85" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <path d="M165 95 L183 95" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <path d="M158 105 L172 105" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>

    <!-- Contactless Wave / NFC Signals representing effortless interaction -->
    <path d="M80 88 C75 95, 75 105, 80 112" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M74 83 C67 93, 67 107, 74 117" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Base / Surface line -->
    <path d="M70 180 L170 180" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>