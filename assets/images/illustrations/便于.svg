<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="15" rx="4" fill="#334155"/>
  
  <!-- Character: Manager/Organizer -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 35 Q20 45 30 35" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="5" y="50" width="30" height="60" rx="5" fill="#38bdf8"/>
    <rect x="10" y="55" width="20" height="10" rx="2" fill="#1e293b"/>
  </g>

  <!-- Organized Files/Boxes -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="35" height="50" rx="4" fill="#ec4899"/>
    <rect x="40" y="10" width="35" height="40" rx="4" fill="#10b981"/>
    <rect x="80" y="20" width="35" height="30" rx="4" fill="#fb923c"/>
  </g>

  <!-- Shelving/Background Elements -->
  <rect x="30" y="60" width="180" height="5" fill="#475569"/>
  <rect x="30" y="90" width="180" height="5" fill="#475569"/>
  
  <!-- Action Lines/Emphasis -->
  <path d="M130 70 L110 50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 65 L120 45" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative light glow -->
  <circle cx="200" cy="40" r="20" fill="#f59e0b" opacity="0.1"/>
</svg>