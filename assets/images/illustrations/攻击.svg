<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="attack-flash" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="blast-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Environment & Strategy Table Background -->
  <g id="command-center-room">
    <!-- Walls and floor grid lines for tactical setting -->
    <path d="M0 160 L240 160" stroke="#334155" stroke-width="1.5" />
    <path d="M0 180 L240 180" stroke="#1e293b" stroke-width="1" />
    
    <!-- Tactical Map / Holographic Table -->
    <ellipse cx="120" cy="185" rx="85" ry="30" fill="#090d16" stroke="#334155" stroke-width="2" />
    <ellipse cx="120" cy="185" rx="75" ry="24" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 2" opacity="0.6" />
  </g>

  <!-- Attack Indicators (The 'Gongji' Vector Action) -->
  <g id="attack-projectiles">
    <!-- Incoming projectile trajectory lines -->
    <path d="M220 30 Q 170 60, 140 110" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4" />
    <path d="M235 60 Q 180 80, 145 125" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Exploding Impact / Fireball on the left defensive position -->
    <circle cx="140" cy="115" r="18" fill="url(#blast-glow)" />
    <polygon points="140,95 146,110 160,115 148,125 152,140 140,130 128,140 132,125 120,115 134,110" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Defender (Left Side - Resisting the Attack) -->
  <g id="defender-character">
    <!-- Chair -->
    <rect x="55" y="130" width="22" height="35" rx="4" fill="#475569" />
    <path d="M50 165 L82 165" stroke="#334155" stroke-width="4" stroke-linecap="round" />

    <!-- Defender Body -->
    <path d="M55 140 Q 65 125, 75 140 L80 165 L50 165 Z" fill="#0284c7" />
    <!-- Head -->
    <circle cx="65" cy="112" r="12" fill="#cbd5e1" />
    <path d="M53 110 C53 100, 77 100, 77 110 Z" fill="#334155" />
    
    <!-- Arm raised controlling shield/defense -->
    <path d="M60 130 L75 120 L85 135" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Defensive Shield Energy Bubble -->
    <ellipse cx="95" cy="125" rx="15" ry="30" fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Attacking Force / Enemy Unit (Right Side - Launching the Attack) -->
  <g id="attacker-character">
    <!-- Attacker Desk / Command Console -->
    <path d="M160 140 L210 130 L220 170 L150 170 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <rect x="175" y="115" width="25" height="25" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <!-- Glowing screen on attacker console -->
    <rect x="180" y="120" width="15" height="12" rx="1" fill="#ef4444" opacity="0.8" />

    <!-- Attacker Body -->
    <path d="M175 145 Q 185 135, 195 145 L200 170 L170 170 Z" fill="#991b1b" />
    <!-- Head -->
    <circle cx="185" cy="122" r="11" fill="#cbd5e1" />
    <path d="M174 120 C174 112, 196 112, 196 120 Z" fill="#7f1d1d" />

    <!-- Attacking Arm pushing the launch button / directing assault -->
    <path d="M180 138 L195 128" fill="none" stroke="#991b1b" stroke-width="5" stroke-linecap="round" />
    <circle cx="196" cy="126" r="4" fill="#f87171" />
  </g>

  <!-- Foreground Dramatic Lighting & Attack Shockwave Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#attack-flash)" pointer-events="none" />

  <!-- Action lines radiating from impact -->
  <g stroke="#f87171" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="110" x2="105" y2="100" />
    <line x1="135" y1="95" x2="125" y2="80" />
    <line x1="155" y1="105" x2="170" y2="95" />
    <line x1="150" y1="130" x2="165" y2="140" />
  </g>
</svg>