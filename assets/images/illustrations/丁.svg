<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="countertop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="meat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Kitchen Environment Details -->
  <!-- Back wall & warm kitchen lighting -->
  <circle cx="120" cy="50" r="90" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
  
  <!-- Wall tile lines -->
  <path d="M 0 90 L 240 90 M 0 120 L 240 120" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <path d="M 60 90 L 60 120 M 120 90 L 120 120 M 180 90 L 180 120" stroke="#334155" stroke-width="1" opacity="0.4"/>

  <!-- Countertop -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#countertop)"/>
  <rect x="0" y="160" width="240" height="6" fill="#475569"/>

  <!-- Kitchen shelf/props in background -->
  <rect x="30" y="65" width="50" height="6" rx="3" fill="#64748b"/>
  <circle cx="45" cy="53" r="8" fill="#10b981"/>
  <circle cx="65" cy="50" r="10" fill="#38bdf8"/>

  <!-- CHARACTER (Chef/Home cook) -->
  <!-- Body/Torso (Chef jacket) -->
  <path d="M 90 200 C 90 175 105 160 120 160 C 135 160 150 175 150 200 Z" fill="#f8fafc"/>
  <!-- Apron -->
  <path d="M 102 170 L 138 170 L 142 225 L 98 225 Z" fill="#38bdf8"/>
  <circle cx="120" cy="170" r="4" fill="#0284c7"/>

  <!-- Head & Face -->
  <circle cx="120" cy="132" r="18" fill="#fde047"/>
  <!-- Chef Hat -->
  <path d="M 106 122 C 102 105 138 105 134 122 Z" fill="#ffffff"/>
  <rect x="108" y="120" width="24" height="6" rx="2" fill="#e2e8f0"/>
  <!-- Face expression (Focused eyes & smile) -->
  <circle cx="114" cy="130" r="1.5" fill="#334155"/>
  <circle cx="126" cy="130" r="1.5" fill="#334155"/>
  <path d="M 118 136 Q 120 139 122 136" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms & Action -->
  <!-- Left arm (holding board/steadying) -->
  <path d="M 95 180 C 85 185 80 195 75 205" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none"/>
  
  <!-- Right arm (holding knife, mid-chop) -->
  <path d="M 145 175 C 155 170 162 185 155 195" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none"/>
  
  <!-- Chef hand holding knife -->
  <circle cx="154" cy="195" r="5" fill="#fde047"/>

  <!-- FOREGROUND CUTTING SCENE -->
  <!-- Wooden Cutting Board (Perspective) -->
  <path d="M 70 175 L 180 165 C 195 165 200 185 185 195 L 75 205 C 60 205 55 185 70 175 Z" fill="url(#board)"/>
  <!-- Cutting board grain highlight -->
  <path d="M 85 181 L 165 173" stroke="#b45309" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- MEAT & CUBED PIECES (丁 - Dīng) -->
  <!-- Uncut portion of meat -->
  <path d="M 80 182 C 78 177 88 173 95 177 C 102 181 100 190 92 192 C 84 194 82 187 80 182 Z" fill="url(#meat)" filter="url(#glow)"/>
  <path d="M 84 182 Q 88 178 92 184" stroke="#fda4af" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- The "丁" (Small diced meat squares neatly arranged) -->
  <!-- Row 1 (Crisp squares) -->
  <rect x="110" y="178" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(12 114 182)"/>
  <rect x="121" y="176" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(-5 125 180)"/>
  <rect x="132" y="179" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(25 136 183)"/>
  
  <!-- Row 2 -->
  <rect x="106" y="188" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(-8 110 192)"/>
  <rect x="117" y="186" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(15 121 190)"/>
  <rect x="128" y="188" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(-12 132 192)"/>
  <rect x="140" y="185" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(8 144 189)"/>

  <!-- Row 3 (Scattered nicely towards right) -->
  <rect x="112" y="196" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(35 116 200)"/>
  <rect x="124" y="194" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(-15 128 198)"/>
  <rect x="136" y="195" width="8" height="8" rx="1.5" fill="url(#meat)" transform="rotate(5 140 199)"/>

  <!-- Highlights on individual cubes for glossy 2D vector pop -->
  <line x1="123" y1="178" x2="125" y2="180" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="134" y1="181" x2="136" y2="183" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="119" y1="188" x2="121" y2="190" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142" y1="187" x2="144" y2="189" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Chef's Knife (Actively chopping down) -->
  <g transform="translate(150, 145) rotate(-25)">
    <!-- Knife blade -->
    <path d="M 0 0 L 12 0 C 12 25 2 35 -5 40 L -2 0 Z" fill="#cbd5e1"/>
    <!-- Blade edge sharp highlight -->
    <path d="M -2 0 L -5 40 L 0 38 L 8 0 Z" fill="#f1f5f9"/>
    <!-- Knife handle -->
    <rect x="-3" y="-18" width="5" height="20" rx="2.5" fill="#334155"/>
    <circle cx="-0.5" cy="-13" r="1" fill="#94a3b8"/>
    <circle cx="-0.5" cy="-7" r="1" fill="#94a3b8"/>
  </g>

  <!-- Motion lines / Action effect for cutting -->
  <path d="M 142 145 L 148 165" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 152 140 L 158 160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>