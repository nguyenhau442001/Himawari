<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Calendar Grid Background -->
  <rect x="60" y="60" width="120" height="120" rx="8" fill="#2A2E38"/>
  
  <!-- Calendar Header -->
  <rect x="60" y="60" width="120" height="24" rx="8" fill="#FF9F1C"/>
  
  <!-- Grid lines for calendar -->
  <path d="M60 84h120M60 108h120M60 132h120M60 156h120" stroke="#3D4451" stroke-width="1"/>
  <path d="M84 84v96M108 84v96M132 84v96M156 84v96" stroke="#3D4451" stroke-width="1"/>
  
  <!-- Highlight for the last 10 days (21-30/31) -->
  <!-- Row 4: 21-24 -->
  <rect x="60" y="132" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  <rect x="84" y="132" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  <rect x="108" y="132" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  <rect x="132" y="132" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  
  <!-- Row 5: 25-31 -->
  <rect x="60" y="156" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  <rect x="84" y="156" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  <rect x="108" y="156" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  <rect x="132" y="156" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  <rect x="156" y="156" width="24" height="24" fill="#FF9F1C" fill-opacity="0.2"/>
  
  <!-- Focus Marker on the last section -->
  <rect x="60" y="132" width="120" height="48" rx="4" stroke="#FF9F1C" stroke-width="3" fill="none"/>
  
  <!-- Decorative calendar ring holes -->
  <circle cx="80" cy="60" r="4" fill="#1A1D24"/>
  <circle cx="120" cy="60" r="4" fill="#1A1D24"/>
  <circle cx="160" cy="60" r="4" fill="#1A1D24"/>
</svg>