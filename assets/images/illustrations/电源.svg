<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background & Atmosphere -->
  <defs>
    <!-- Room background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk gradient -->
    <linearGradient id="deskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm lamp glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>

    <!-- Power strip glow (on state) -->
    <radialGradient id="powerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Room Interior Elements (Shelf and Books in background) -->
  <g opacity="0.6">
    <rect x="25" y="40" width="70" height="6" rx="3" fill="#475569" />
    <path d="M35 20 h10 v20 h-10 z" fill="#f43f5e" rx="2" />
    <path d="M48 25 h8 v15 h-8 z" fill="#38bdf8" rx="2" />
    <path d="M58 22 h14 v18 h-14 z" fill="#fbbf24" rx="2" />
    
    <!-- Window with night city silhouette -->
    <rect x="155" y="25" width="55" height="75" rx="4" fill="#090d16" stroke="#475569" stroke-width="2" />
    <rect x="162" y="32" width="18" height="28" fill="#1e293b" />
    <rect x="185" y="32" width="18" height="28" fill="#1e293b" />
    <rect x="162" y="65" width="18" height="28" fill="#1e293b" />
    <rect x="185" y="65" width="18" height="28" fill="#1e293b" />
  </g>

  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGradient)" />
  <rect x="0" y="170" width="240" height="5" fill="#475569" />

  <!-- Desk Props: Laptop & Desk Lamp -->
  <!-- Desk Lamp -->
  <g>
    <path d="M 45 170 L 55 170 L 52 130 L 48 130 Z" fill="#64748b" />
    <path d="M 50 135 L 35 110 L 40 105 L 53 125 Z" fill="#64748b" />
    <path d="M 32 105 L 43 90 L 58 100 L 48 118 Z" fill="#cbd5e1" filter="url(#shadow)" />
    <!-- Lamp Light Cone -->
    <polygon points="41,105 10,210 90,210" fill="url(#lampGlow)" />
  </g>

  <!-- Open Laptop -->
  <g transform="translate(65, 125)">
    <!-- Screen -->
    <path d="M 5 35 L 12 5 L 68 5 L 75 35 Z" fill="#334155" />
    <path d="M 8 33 L 14 8 L 66 8 L 72 33 Z" fill="#0f172a" />
    <rect x="25" y="15" width="30" height="12" rx="2" fill="#38bdf8" opacity="0.6" />
    <!-- Base -->
    <path d="M 0 38 L 80 38 L 75 43 L 5 43 Z" fill="#94a3b8" />
  </g>

  <!-- MAIN PROP: The Power Strip & Cable ("电源") -->
  <g id="power-strip-system" filter="url(#shadow)">
    <!-- Cord trailing from desk back -->
    <path d="M 175 170 Q 185 150 170 130 Q 155 110 165 95" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" />

    <!-- Power Strip Body (Angled prominently) -->
    <g transform="translate(140, 80) rotate(-15)">
      <!-- Strip base -->
      <rect x="0" y="0" width="65" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
      
      <!-- Outlets -->
      <rect x="10" y="8" width="12" height="14" rx="2" fill="#334155" />
      <circle cx="16" cy="12" r="1.5" fill="#94a3b8" />
      <circle cx="16" cy="18" r="1.5" fill="#94a3b8" />

      <rect x="28" y="8" width="12" height="14" rx="2" fill="#334155" />
      <circle cx="34" cy="12" r="1.5" fill="#94a3b8" />
      <circle cx="34" cy="18" r="1.5" fill="#94a3b8" />

      <!-- Main Power Switch Button (Being pressed / turned off) -->
      <!-- Switch casing -->
      <rect x="46" y="6" width="14" height="18" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <!-- Indicator light turning off (faint red/gray instead of glowing green) -->
      <circle cx="53" cy="10" r="2" fill="#ef4444" opacity="0.5" />
      <!-- Switch rocker flipped UP/OFF -->
      <rect x="49" y="13" width="8" height="9" rx="1.5" fill="#64748b" />
    </g>
  </g>

  <!-- CHARACTER: Person turning off the power strip -->
  <g id="character">
    <!-- Character Body / Torso (Leaning in) -->
    <path d="M 130 240 C 120 200 135 170 155 160 C 175 150 190 170 195 240 Z" fill="#3b82f6" />
    
    <!-- Collar / Shirt detail -->
    <path d="M 148 162 L 160 175 L 172 162" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Head & Hair -->
    <!-- Neck -->
    <path d="M 152 155 L 160 165 L 168 155 Z" fill="#fcd34d" />
    <!-- Head circle -->
    <circle cx="160" cy="125" r="25" fill="#fcd34d" />
    <!-- Hair (Stylish modern dark hair) -->
    <path d="M 135 120 C 135 100 150 95 165 98 C 180 100 188 115 185 135 C 185 135 180 110 162 106 C 144 102 138 120 135 120 Z" fill="#1e293b" />

    <!-- Focused Facial Expression -->
    <!-- Eyebrow (focused downward angle) -->
    <path d="M 150 120 L 162 123" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Eye (focused) -->
    <circle cx="156" cy="127" r="2.5" fill="#1e293b" />
    <!-- Gentle determined mouth -->
    <path d="M 153 138 Q 158 141 163 138" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

    <!-- Active Arm & Hand Reaching to Switch Off Power -->
    <!-- Upper arm -->
    <path d="M 165 160 C 175 145 185 130 155 105" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Forearm & Hand pressing down on the switch -->
    <path d="M 155 105 L 140 92" fill="none" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" />
    <!-- Thumb/Finger pressing interaction -->
    <circle cx="138" cy="90" r="6" fill="#fcd34d" filter="url(#shadow)" />
  </g>

  <!-- Foreground Atmospheric Depth Elements -->
  <!-- Subtle light vignette overlay -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
</svg>