<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: Flower bed / Garden ambiance -->
  <path d="M40 190 Q120 180 200 190 L200 215 Q120 220 40 215 Z" fill="#242B38"/>
  <circle cx="65" cy="185" r="8" fill="#F59E0B" opacity="0.4"/>
  <circle cx="175" cy="188" r="6" fill="#EC4899" opacity="0.4"/>
  <circle cx="150" cy="183" r="7" fill="#60A5FA" opacity="0.4"/>

  <!-- Character: 慈祥的老太太 (Kind Elderly Woman) -->
  <g transform="translate(0, 10)">
    <!-- Body / Torso (Wearing cozy cardigan) -->
    <path d="M85 145 C85 130 100 120 120 120 C140 120 155 130 155 145 L170 190 C170 195 165 200 160 200 L80 200 C75 200 70 195 70 190 Z" fill="#3B82F6"/>
    <!-- Cardigan Details (Buttons and lapel) -->
    <line x1="120" y1="125" x2="120" y2="195" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="140" r="2.5" fill="#FBBF24"/>
    <circle cx="120" cy="160" r="2.5" fill="#FBBF24"/>
    <circle cx="120" cy="180" r="2.5" fill="#FBBF24"/>

    <!-- Neck -->
    <rect x="112" y="105" width="16" height="20" rx="8" fill="#FDE68A"/>

    <!-- Head -->
    <circle cx="120" cy="85" r="28" fill="#FDE68A"/>

    <!-- Gentle Facial Expression / Wrinkles & Smile -->
    <path d="M110 82 Q120 88 130 82" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none"/> <!-- Warm smile -->
    <!-- Gentle eyes (crinkled happily) -->
    <path d="M106 75 Q110 78 114 75" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M126 75 Q130 78 134 75" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="102" cy="85" r="4" fill="#FCA5A5" opacity="0.6"/>
    <circle cx="138" cy="85" r="4" fill="#FCA5A5" opacity="0.6"/>

    <!-- Silver/White Hair Bun and Hair -->
    <path d="M92 80 C90 60 105 52 120 52 C135 52 150 60 148 80 C150 90 140 95 120 95 C100 95 90 90 92 80 Z" fill="#E2E8F0"/>
    <!-- Classic Elderly Hair Bun -->
    <circle cx="120" cy="44" r="10" fill="#CBD5E1"/>
    <path d="M115 50 Q120 40 125 50" stroke="#94A3B8" stroke-width="2" fill="none"/>

    <!-- Glasses (慈祥眼镜) -->
    <circle cx="110" cy="76" r="7" stroke="#D97706" stroke-width="1.5" fill="none"/>
    <circle cx="130" cy="76" r="7" stroke="#D97706" stroke-width="1.5" fill="none"/>
    <line x1="117" y1="76" x2="123" y2="76" stroke="#D97706" stroke-width="1.5"/>

    <!-- Arms & Hands (Knitting Activity) -->
    <!-- Left arm holding yarn/needle -->
    <path d="M85 135 Q65 145 75 165" stroke="#3B82F6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="75" cy="168" r="5" fill="#FDE68A"/>

    <!-- Right arm holding needle -->
    <path d="M155 135 Q175 145 165 165" stroke="#3B82F6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="165" cy="168" r="5" fill="#FDE68A"/>

    <!-- Lap / Knitting Project (织毛衣) -->
    <!-- Cozy blanket/sweater on lap -->
    <path d="M90 160 Q120 150 150 160 L160 185 Q120 195 80 185 Z" fill="#F59E0B"/>
    <!-- Texture pattern on knitting -->
    <path d="M95 167 Q105 172 115 167 M125 167 Q135 172 145 167" stroke="#D97706" stroke-width="2" fill="none"/>
    <path d="M100 175 Q110 180 120 175 M130 175 Q140 180 150 175" stroke="#D97706" stroke-width="2" fill="none"/>

    <!-- Knitting Needles & Yarn Ball -->
    <line x1="60" y1="150" x2="180" y2="180" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="65" y1="175" x2="175" y2="145" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Yarn Ball beside her -->
    <circle cx="178" cy="180" r="12" fill="#EF4444"/>
    <path d="M170 175 Q178 170 186 182" stroke="#FCA5A5" stroke-width="1.5" fill="none"/>
    <path d="M172 184 Q180 188 184 175" stroke="#FCA5A5" stroke-width="1.5" fill="none"/>
    <!-- Yarn thread leading to knitting -->
    <path d="M166 180 Q170 170 155 165" stroke="#EF4444" stroke-width="2" fill="none"/>
  </g>
</svg>