<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow/plane -->
  <ellipse cx="120" cy="195" rx="70" ry="10" fill="#14161B"/>

  <!-- Character representing "听话" (A polite, well-behaved young boy standing respectfully) -->
  <g transform="translate(0, 10)">
    <!-- Boy's Body / Torso (Blue jacket/shirt) -->
    <path d="M 95 125 C 95 115 105 110 120 110 C 135 110 145 115 145 125 L 152 165 C 153 170 148 175 142 175 L 98 175 C 92 175 87 170 88 165 Z" fill="#3B82F6"/>
    
    <!-- Collar -->
    <path d="M 110 110 L 120 122 L 130 110 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Arms held neatly at sides (signifying discipline/obedient posture) -->
    <rect x="86" y="125" rx="6" width="12" height="35" fill="#2563EB" transform="rotate(5, 92, 125)"/>
    <rect x="142" y="125" rx="6" width="12" height="35" fill="#2563EB" transform="rotate(-5, 148, 125)"/>

    <!-- Hands -->
    <circle cx="89" cy="163" r="5" fill="#FFD166"/>
    <circle cx="151" cy="163" r="5" fill="#FFD166"/>

    <!-- Neck -->
    <rect x="114" y="98" width="12" height="15" fill="#FFD166"/>

    <!-- Head -->
    <circle cx="120" cy="80" r="24" fill="#FFD166"/>

    <!-- Hair (Modern neat short haircut) -->
    <path d="M 96 80 C 96 64 106 54 120 54 C 134 54 144 64 144 80 L 144 72 C 144 60 134 50 120 50 C 106 50 96 60 96 72 Z" fill="#1E293B"/>

    <!-- Facial features: Calm, attentive, smiling politely -->
    <!-- Eyes (gentle, happy arcs) -->
    <path d="M 110 77 Q 114 73 118 77" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 122 77 Q 126 73 130 77" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Gentle Smile -->
    <path d="M 115 88 Q 120 92 125 88" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Rosy cheeks -->
    <circle cx="108" cy="85" r="3" fill="#F43F5E" opacity="0.4"/>
    <circle cx="132" cy="85" r="3" fill="#F43F5E" opacity="0.4"/>
  </g>

  <!-- Focus/Attention Indicator (Gold accent floating gently above to represent receptiveness/good listening) -->
  <g transform="translate(120, 26)">
    <!-- Elegant minimal glowing aura/sparkle representing compliance and attentiveness -->
    <circle cx="0" cy="0" r="14" fill="#F59E0B" opacity="0.15"/>
    <circle cx="0" cy="0" r="8" fill="#F59E0B" opacity="0.3"/>
    
    <!-- Checkmark icon inside accent circle symbolizing "correct behavior / obedience" -->
    <path d="M -3 1 L -1 3 L 4 -2" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>