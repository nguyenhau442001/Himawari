<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road Surface -->
  <path d="M40 180 L200 180 L180 230 L60 230 Z" fill="#2D3436"/>
  <path d="M70 205 L170 205" stroke="#FDCB6E" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Vehicle 1 (Top) -->
  <g transform="translate(110, 100)">
    <rect x="-20" y="-10" width="40" height="20" rx="4" fill="#E17055"/>
    <rect x="-15" y="-12" width="10" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="-12" cy="12" r="5" fill="#2D3436"/>
    <circle cx="12" cy="12" r="5" fill="#2D3436"/>
  </g>
  
  <!-- Vehicle 2 (Middle) -->
  <g transform="translate(70, 130)">
    <rect x="-20" y="-10" width="40" height="20" rx="4" fill="#0984E3"/>
    <rect x="5" y="-12" width="10" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="-12" cy="12" r="5" fill="#2D3436"/>
    <circle cx="12" cy="12" r="5" fill="#2D3436"/>
  </g>
  
  <!-- Vehicle 3 (Bottom) -->
  <g transform="translate(150, 150)">
    <rect x="-20" y="-10" width="40" height="20" rx="4" fill="#00B894"/>
    <rect x="-15" y="-12" width="10" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="-12" cy="12" r="5" fill="#2D3436"/>
    <circle cx="12" cy="12" r="5" fill="#2D3436"/>
  </g>

  <!-- Flow lines (representing traffic density) -->
  <path d="M20 150 Q 120 120 220 150" stroke="#FDCB6E" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M20 165 Q 120 135 220 165" stroke="#FDCB6E" stroke-width="2" fill="none" opacity="0.4"/>
</svg>