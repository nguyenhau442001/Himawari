<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Water background layer -->
  <path d="M 0,160 Q 30,150 60,160 T 120,160 T 180,160 T 240,160 L 240,240 L 0,240 Z" fill="#1E293B"/>
  <path d="M 0,180 Q 40,170 80,180 T 160,180 T 240,180 L 240,240 L 0,240 Z" fill="#0F172A"/>
  
  <!-- Water ripples -->
  <ellipse cx="140" cy="175" rx="18" ry="4" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="140" cy="175" rx="8" ry="2" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
  
  <!-- Fishing Rod (Modern, sleek flat style) -->
  <path d="M 40,200 L 140,70" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M 140,70 L 140,175" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  
  <!-- Fishing float (Bobber) -->
  <path d="M 140,130 C 137,130 135,127 135,124 C 135,121 140,110 140,110 C 140,110 145,121 145,124 C 145,127 143,130 140,130 Z" fill="#EF4444"/>
  <path d="M 140,130 C 137,130 135,127 135,124 C 135,121 140,117 140,117 C 140,117 145,121 145,124 C 145,127 143,130 140,130 Z" fill="#F87171"/>
  <rect x="139" y="106" width="2" height="4" fill="#94A3B8"/>
  
  <!-- Fish swimming underwater -->
  <path d="M 160,200 C 175,190 190,205 200,195 C 190,203 175,210 160,200 Z" fill="#38BDF8"/>
  <polygon points="158,197 152,192 153,205" fill="#38BDF8"/>
  <circle cx="192" cy="197" r="1.5" fill="#0F172A"/>
  
  <!-- Hook -->
  <path d="M 140,170 C 140,178 146,180 149,176" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
</svg>