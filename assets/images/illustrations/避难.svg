<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background glowing volcano hints & atmosphere -->
  <path d="M40 200 L120 120 L200 200 Z" fill="#242933"/>
  <circle cx="120" cy="110" r="18" fill="#FF5722" opacity="0.3"/>
  
  <!-- The Emergency Shelter / Safe Haven Building (Noun: Địa điểm lánh nạn) -->
  <!-- Ground platform -->
  <rect x="50" y="190" width="140" height="10" rx="4" fill="#2C3440"/>
  
  <!-- Main building structure -->
  <rect x="70" y="100" width="100" height="90" fill="#2D3748" rx="4"/>
  
  <!-- Roof structure with safe haven / emergency motif -->
  <path d="M60 100 L120 55 L180 100 Z" fill="#3B82F6"/>
  <path d="M68 96 L120 58 L172 96 Z" fill="#2563EB"/>
  
  <!-- Emergency / Safe Haven Symbol (Medical/Relief Cross) on the roof -->
  <circle cx="120" cy="78" r="12" fill="#FFFFFF"/>
  <rect x="116" y="70" width="8" height="16" rx="1.5" fill="#EF4444"/>
  <rect x="112" y="74" width="16" height="8" rx="1.5" fill="#EF4444"/>
  
  <!-- Safe Entrance Door -->
  <rect x="105" y="145" width="30" height="45" rx="3" fill="#1E293B"/>
  <circle cx="130" cy="170" r="2" fill="#3B82F6"/>
  
  <!-- Side Windows with warm welcoming light -->
  <rect x="82" y="115" width="16" height="20" rx="2" fill="#F59E0B" opacity="0.8"/>
  <rect x="142" y="115" width="16" height="20" rx="2" fill="#F59E0B" opacity="0.8"/>
  <line x1="90" y1="115" x2="90" y2="135" stroke="#1E293B" stroke-width="2"/>
  <line x1="150" y1="115" x2="150" y2="135" stroke="#1E293B" stroke-width="2"/>

  <!-- Directional / Evacuation safety indicator pointing to the shelter -->
  <g transform="translate(0, -10)">
    <!-- Safe zone marker post on the left -->
    <rect x="35" y="150" width="6" height="50" fill="#64748B"/>
    <rect x="25" y="125" width="26" height="28" rx="4" fill="#10B981"/>
    <!-- Safety check icon -->
    <path d="M33 139 L38 144 L45 133" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Safe Zone boundary arc / barrier indicating protection -->
  <path d="M 45 110 A 90 90 0 0 1 195 110" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- Glowing accent representing safety and security -->
  <circle cx="120" cy="78" r="18" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
</svg>