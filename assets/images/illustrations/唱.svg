  <path d="M135 100 Q145 90 155 100" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M135 120 Q150 105 165 120" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M135 140 Q145 150 155 140" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
  
