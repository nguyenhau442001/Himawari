<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Treasure Chest Body -->
  <path d="M70 110 L170 110 L160 180 L80 180 Z" fill="#D4AF37"/>
  <path d="M70 110 L80 180 L160 180 L170 110 Z" fill="#B8860B"/>
  
  <!-- Chest Lid -->
  <path d="M70 110 A50 40 0 0 1 170 110 L160 90 L80 90 Z" fill="#FFD700"/>
  <path d="M70 110 A50 40 0 0 1 170 110" fill="none" stroke="#1A1D24" stroke-width="4"/>
  
  <!-- Chest Details -->
  <rect x="115" y="100" width="10" height="20" fill="#1A1D24"/>
  <rect x="70" y="110" width="100" height="10" fill="#B8860B"/>
  
  <!-- Treasure Contents (Herbal/Medical scrolls and gold) -->
  <rect x="90" y="75" width="20" height="40" rx="2" fill="#E0E0E0" transform="rotate(-15 100 95)"/>
  <rect x="130" y="80" width="20" height="35" rx="2" fill="#E0E0E0" transform="rotate(10 140 95)"/>
  <circle cx="110" cy="150" r="8" fill="#FFD700"/>
  <circle cx="130" cy="160" r="10" fill="#FFD700"/>
  <circle cx="95" cy="165" r="7" fill="#FFD700"/>
  
  <!-- Decorative highlights -->
  <path d="M80 90 L160 90" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
</svg>