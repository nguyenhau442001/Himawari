<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Floor -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b" />
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Window Frame & Night View (Background Context) -->
  <g transform="translate(145, 25)">
    <!-- Window Outer Frame -->
    <rect x="-4" y="-4" width="68" height="98" rx="2" fill="#0f172a" />
    <!-- Night Sky View -->
    <rect x="0" y="0" width="60" height="90" fill="url(#nightSky)" rx="1"/>
    <!-- Distant City Lights / Stars -->
    <circle cx="12" cy="20" r="1" fill="#fbbf24" opacity="0.8"/>
    <circle cx="48" cy="35" r="1.5" fill="#38bdf8" opacity="0.6"/>
    <circle cx="30" cy="15" r="0.8" fill="#ffffff" opacity="0.9"/>
    <rect x="10" y="70" width="8" height="20" fill="#1e293b" opacity="0.7"/>
    <rect x="22" y="55" width="12" height="35" fill="#1e293b" opacity="0.7"/>
    <rect x="38" y="65" width="10" height="25" fill="#1e293b" opacity="0.7"/>
    <!-- Window Panes (Cross) -->
    <line x1="30" y1="0" x2="30" y2="90" stroke="#0f172a" stroke-width="3"/>
    <line x1="0" y1="45" x2="60" y2="45" stroke="#0f172a" stroke-width="3"/>
    <!-- Window Sill -->
    <rect x="-8" y="90" width="76" height="5" rx="1" fill="#334155"/>
  </g>

  <!-- Light Beam from Window -->
  <polygon points="145,70 205,70 240,190 70,190" fill="url(#lightBeam)" />

  <!-- Room Props: Bookshelf & Books in Background -->
  <g transform="translate(15, 40)">
    <rect x="0" y="0" width="45" height="110" fill="#0f172a" rx="2"/>
    <line x1="0" y1="35" x2="45" y2="35" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="75" x2="45" y2="75" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="6" y="15" width="6" height="20" rx="1" fill="#38bdf8"/>
    <rect x="14" y="12" width="8" height="23" rx="1" fill="#f43f5e"/>
    <rect x="24" y="18" width="5" height="17" rx="1" fill="#fbbf24"/>
    <rect x="6" y="52" width="7" height="23" rx="1" fill="#10b981"/>
    <rect x="15" y="57" width="6" height="18" rx="1" fill="#8b5cf6"/>
  </g>

  <!-- Potted Plant on Floor -->
  <g transform="translate(25, 145)">
    <path d="M5,15 L15,15 L18,30 L2,30 Z" fill="#64748b"/>
    <ellipse cx="10" cy="15" rx="5" ry="2" fill="#475569"/>
    <!-- Drooping stems (representing melancholy/solitude) -->
    <path d="M10,15 Q3,10 0,18" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M10,15 Q18,8 22,16" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <path d="M10,15 Q10,5 12,0" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Cozy Rug under Chair -->
  <ellipse cx="105" cy="195" rx="55" ry="15" fill="#334155" opacity="0.6"/>

  <!-- Large Comfy Armchair -->
  <g transform="translate(70, 95)" filter="url(#softShadow)">
    <!-- Chair Back -->
    <path d="M15,10 C15,-5 55,-5 55,10 L65,75 C65,85 55,90 50,90 L20,90 C15,90 5,85 5,75 Z" fill="#334155"/>
    <path d="M20,15 C20,5 50,5 50,15 L57,70 C57,75 52,80 48,80 L22,80 C18,80 13,75 13,70 Z" fill="#475569"/>
    <!-- Cushion / Seat -->
    <rect x="5" y="70" width="60" height="22" rx="8" fill="#64748b"/>
    <!-- Chair Armrests -->
    <ellipse cx="8" cy="75" rx="7" ry="12" fill="#475569"/>
    <ellipse cx="62" cy="75" rx="7" ry="12" fill="#475569"/>
  </g>

  <!-- MAIN CHARACTER: Sitting alone, hugging knees, feeling lonely -->
  <g transform="translate(72, 90)" filter="url(#softShadow)">
    <!-- Legs/Knees pulled up -->
    <!-- Cozy oversized sweater folds covering legs -->
    <path d="M22,50 C18,42 25,32 35,35 C42,37 46,45 42,55 C38,65 25,60 22,50 Z" fill="#38bdf8"/>
    
    <!-- Shoes / Feet tucked -->
    <ellipse cx="20" cy="62" rx="6" ry="4" fill="#cbd5e1"/>

    <!-- Torso leaning slightly forward/slouching -->
    <path d="M25,30 C22,20 32,15 40,22 C45,26 44,38 38,45 C32,50 27,40 25,30 Z" fill="#0284c7"/>

    <!-- Head & Hair (Thoughtful, melancholic tilt downwards) -->
    <!-- Hair Back -->
    <circle cx="35" cy="14" r="13" fill="#0f172a"/>
    <!-- Face Profile / Front-Three-Quarters angled down -->
    <circle cx="37" cy="15" r="11" fill="#fed7aa"/>
    <!-- Hair Front/Bangs -->
    <path d="M26,10 C28,5 36,4 46,10 C42,16 34,16 26,10 Z" fill="#0f172a"/>

    <!-- Closed / Downcast Melancholic Eye (Simple curved stroke) -->
    <path d="M41,15 Q43,17 45,15" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Gentle sad mouth -->
    <path d="M43,21 Q45,22 47,20" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Rosy shy/sad cheek -->
    <circle cx="44" cy="18" r="2.5" fill="#f43f5e" opacity="0.3"/>

    <!-- Arms wrapped tightly around knees (Embracing oneself for comfort) -->
    <!-- Back arm -->
    <path d="M30,28 C26,30 22,38 25,44 C27,48 32,45 35,40 Z" fill="#0284c7"/>
    <!-- Hands clasped / holding knee -->
    <circle cx="28" cy="45" r="3" fill="#fed7aa"/>
    <!-- Front arm wrapping around -->
    <path d="M38,26 C43,30 42,42 32,46 C28,48 25,44 28,40 C35,38 37,32 38,26 Z" fill="#0284c7"/>

    <!-- Mug of hot tea/coffee on small side table next to her -->
  </g>

  <!-- Side Table & Warm Mug -->
  <g transform="translate(45, 145)">
    <!-- Table Leg & Top -->
    <rect x="0" y="10" width="20" height="3" rx="1" fill="#475569"/>
    <line x1="10" y1="13" x2="10" y2="35" stroke="#334155" stroke-width="3"/>
    <!-- Mug -->
    <rect x="5" y="0" width="10" height="12" rx="2" fill="#f43f5e"/>
    <path d="M15,3 C18,3 18,9 15,9" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <!-- Steam wisps (quiet, solitary atmosphere) -->
    <path d="M8,-3 Q6,-7 10,-10 Q14,-13 10,-16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Ambient lighting/mood particles floating in the room -->
  <circle cx="110" cy="70" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="130" cy="110" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="95" cy="50" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="160" cy="140" r="1.5" fill="#fbbf24" opacity="0.3"/>

</svg>