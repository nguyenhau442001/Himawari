<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle lighting grid for precision atmosphere -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="60" y1="30" x2="60" y2="210" />
    <line x1="120" y1="30" x2="120" y2="210" />
    <line x1="180" y1="30" x2="180" y2="210" />
    <line x1="30" y1="70" x2="210" y2="70" />
    <line x1="30" y1="120" x2="210" y2="120" />
    <line x1="30" y1="170" x2="210" y2="170" />
  </g>

  <!-- Desk Surface -->
  <path d="M 30 190 L 210 190" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Precision Craft / Drafting Character Representation -->
  <g transform="translate(120, 115)">
    <!-- Character Head & Upper Body -->
    <path d="M -15 35 L 15 35 L 25 75 L -25 75 Z" fill="#334155"/>
    <circle cx="0" cy="15" r="14" fill="#F8FAFC"/>
    <!-- Hair -->
    <path d="M -13 10 C -15 -2 -5 -5 2 -2 C 10 -2 14 5 14 10 Z" fill="#64748B"/>
    <!-- Glasses -->
    <rect x="-8" y="11" rid="6" height="6" rx="1" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="2" y="11" width="6" height="6" rx="1" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="-2" y1="14" x2="2" y2="14" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Concentrated Expression/Pose: Bent over work -->
    <!-- Arm holding magnifying glass -->
    <path d="M -12 40 L -25 45 L -35 30" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Blueprint / Detailed Drawing Surface on Desk -->
  <g transform="translate(70, 140)">
    <polygon points="0,40 80,20 120,40 40,60" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Detailed intricate lines representing meticulous work -->
    <path d="M 15 35 L 35 30 M 45 42 L 65 37 M 70 30 L 95 38" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="55" cy="38" r="3" fill="#F59E0B"/>
    <circle cx="25" cy="33" r="2" fill="#F59E0B"/>
  </g>

  <!-- Giant Magnifying Glass focusing on meticulous detail (Central Icon Element) -->
  <g transform="translate(145, 95)">
    <!-- Glass Lens Area -->
    <circle cx="0" cy="0" r="32" fill="#38BDF8" fill-opacity="0.1" stroke="#F59E0B" stroke-width="3.5"/>
    
    <!-- Highlight Reflection on Lens -->
    <path d="M -18 -18 C -10 -25 0 -22 -10 -10 Z" fill="#F8FAFC" fill-opacity="0.3"/>

    <!-- Magnified Object/Detail inside lens: Ultra precise gear/mechanism -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#F8FAFC" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#F59E0B"/>
      <!-- Gear teeth -->
      <line x1="0" y1="-13" x2="0" y2="-10" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="0" y2="13" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-13" y1="0" x2="-10" y2="0" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="10" y1="0" x2="13" y2="0" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Magnifying Glass Handle -->
    <path d="M 22 22 L 48 48" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
    <path d="M 22 22 L 48 48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Sparkle of absolute precision / perfection -->
  <g transform="translate(180, 50)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F59E0B"/>
  </g>
  <g transform="translate(75, 75)">
    <path d="M0 -5 L1 -1 L5 0 L1 1 L0 5 L-1 1 L-5 0 L-1 -1 Z" fill="#38BDF8" opacity="0.8"/>
  </g>

</svg>