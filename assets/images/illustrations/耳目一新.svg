<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to represent modern gallery space / opening up -->
  <circle cx="120" cy="110" r="80" fill="#252A34" opacity="0.6"/>
  <path d="M 60,150 L 120,70 L 180,150 Z" fill="#2D3343" opacity="0.4"/>

  <!-- Left side: The old, mundane view (monochrome, rigid, dark gray/blue) -->
  <g opacity="0.35">
    <!-- Traditional rigid frame -->
    <rect x="40" y="70" width="60" height="80" rx="4" fill="none" stroke="#8C95A1" stroke-width="3"/>
    <!-- Boring traditional lines inside -->
    <line x1="52" y1="95" x2="88" y2="95" stroke="#8C95A1" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="115" x2="78" y2="115" stroke="#8C95A1" stroke-width="3" stroke-linecap="round"/>
    <!-- Closed eye outline representing old perspective -->
    <path d="M 55,140 Q 70,130 85,140" fill="none" stroke="#8C95A1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Transition/Explosion of freshness in the center (scale exaggeration & contrast) -->
  <g>
    <!-- Radiant burst rays (Gold/Orange accent for high-contrast focus) -->
    <line x1="120" y1="40" x2="120" y2="25" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="52" x2="162" y2="40" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="52" x2="78" y2="40" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="120" cy="50" r="4" fill="#FFB703"/>
    <circle cx="155" cy="80" r="3" fill="#FFB703"/>
    <circle cx="85" cy="80" r="3" fill="#FFB703"/>
  </g>

  <!-- Right side: The refreshed, eye-opening vivid new experience (vibrant, modern, glowing orange & cyan) -->
  <g>
    <!-- Dynamic angled modern floating frame (Scale & Contrast: larger, vibrant, tilted) -->
    <rect x="110" y="60" width="85" height="100" rx="8" transform="rotate(8 152 110)" fill="#1A1D24" stroke="#00F5D4" stroke-width="3.5"/>
    
    <!-- Abstract vibrant art piece inside the new frame (representing modern art exhibition) -->
    <g transform="rotate(8 152 110)">
      <!-- Vibrant geometric shapes (Orange and Cyan contrast) -->
      <circle cx="152" cy="100" r="22" fill="#FFB703" opacity="0.9"/>
      <path d="M 130,135 L 152,95 L 174,135 Z" fill="#00F5D4" opacity="0.85"/>
      <circle cx="152" cy="115" r="8" fill="#1A1D24"/>
    </g>

    <!-- Wide open vivid eye (symbolizing '耳目一新' - eyes and mind instantly refreshed/opened) -->
    <g transform="translate(100, 155)">
      <!-- Eye white/glow -->
      <path d="M 0,15 Q 20,0 40,15 Q 20,30 0,15 Z" fill="#00F5D4" opacity="0.2"/>
      <!-- Eye contour -->
      <path d="M 2,15 Q 20,2 38,15 Q 20,28 2,15 Z" fill="none" stroke="#00F5D4" stroke-width="3" stroke-linecap="round"/>
      <!-- Bright pupil -->
      <circle cx="20" cy="15" r="7" fill="#FFB703"/>
      <circle cx="22" cy="13" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Ground reflection / grounding line -->
  <path d="M 40,195 L 200,195" stroke="#2D3343" stroke-width="2" stroke-linecap="round"/>
</svg>