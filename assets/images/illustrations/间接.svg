<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Indirect flow representation: Sunlight (Source) -> Tree (Mediator) -> Human (Beneficiary) -->
  
  <!-- Sunlight (Source) -->
  <circle cx="120" cy="50" r="15" fill="#FFB84D"/>
  <path d="M120 70 L120 90 M100 50 L80 50 M140 50 L160 50" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Tree (The Mediator/Indirect agent) -->
  <path d="M120 100 L120 160 M100 130 L140 130 M105 110 L135 110" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="100" r="20" fill="#4CAF50"/>
  
  <!-- Human (Beneficiary) -->
  <g transform="translate(120, 190)">
    <circle cx="0" cy="-25" r="10" fill="#E0E0E0"/>
    <path d="M-15 0 L15 0 M0 0 L0 -15" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Indirect Path Indicator (Dashed curve showing influence passing through) -->
  <path d="M120 70 Q 160 120 120 170" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
</svg>