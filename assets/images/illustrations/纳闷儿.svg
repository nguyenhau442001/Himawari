<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="15" rx="4" fill="#334155"/>
  <rect x="50" y="175" width="10" height="40" rx="2" fill="#475569"/>
  <rect x="180" y="175" width="10" height="40" rx="2" fill="#475569"/>

  <!-- Character A (The one reacting strangely) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="25" fill="#fbbf24"/>
    <path d="M10 25 Q20 35 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="10" cy="15" r="3" fill="#0f172a"/>
    <circle cx="30" cy="15" r="3" fill="#0f172a"/>
    <path d="M15 50 L15 100 M25 50 L25 100" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Character B (The one feeling 'nà mènr' - băn khoăn) -->
  <g transform="translate(40, 70)">
    <circle cx="30" cy="30" r="30" fill="#38bdf8"/>
    <path d="M15 20 Q20 15 25 20" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M35 20 Q40 15 45 20" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M20 45 Q30 38 40 45" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M10 60 L10 120 M50 60 L50 120" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <!-- Question mark shape representing confusion -->
    <path d="M60 10 C75 5 80 20 70 30 L70 40 M70 50 L70 52" stroke="#ec4899" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Props -->
  <circle cx="100" cy="150" r="8" fill="#fb923c"/>
  <rect x="150" y="140" width="20" height="20" rx="2" fill="#10b981"/>
</svg>