<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient Laboratory Glow / Lighting -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  <circle cx="170" cy="70" r="40" fill="#38bdf8" opacity="0.08"/>
  <circle cx="70" cy="170" r="50" fill="#10b981" opacity="0.06"/>

  <!-- Lab Workbench -->
  <path d="M 20 180 L 220 180 L 220 220 L 20 220 Z" fill="#334155"/>
  <path d="M 20 180 L 220 180 L 220 186 L 20 186 Z" fill="#475569"/>
  <rect x="35" y="195" width="25" height="12" rx="3" fill="#1e293b"/>
  <circle cx="47" cy="201" r="3" fill="#fbbf24"/>

  <!-- Background Lab Details (Shelves & Equipment) -->
  <path d="M 30 90 L 110 90" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Beaker on shelf -->
  <path d="M 45 70 L 55 70 L 58 90 L 42 90 Z" fill="#38bdf8" opacity="0.4"/>
  <rect x="43" y="66" width="14" height="4" rx="1" fill="#64748b"/>
  <!-- Flask on shelf -->
  <circle cx="85" cy="78" r="10" fill="#10b981" opacity="0.3"/>
  <rect x="82" y="64" width="6" height="8" fill="#64748b"/>

  <!-- Character: Scientist / Material Engineer -->
  <!-- Body/Lab Coat -->
  <path d="M 140 180 C 140 150 160 135 175 135 C 190 135 210 150 210 180 Z" fill="#f8fafc"/>
  <!-- Lab Coat lapels & buttons -->
  <path d="M 175 135 L 165 180 M 175 135 L 185 180" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="175" cy="155" r="2" fill="#94a3b8"/>
  <circle cx="175" cy="167" r="2" fill="#94a3b8"/>

  <!-- Neck & Head -->
  <rect x="168" y="118" width="14" height="22" fill="#fcd34d"/>
  <!-- Face profile/glasses -->
  <circle cx="175" cy="110" r="16" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 159 104 C 159 94 167 92 176 92 C 187 92 192 100 191 110 C 185 106 170 106 160 110 Z" fill="#334155"/>
  <!-- Safety Glasses -->
  <rect x="167" y="104" width="16" height="8" rx="2" fill="#38bdf8" opacity="0.7"/>
  <path d="M 160 107 L 167 107 M 183 107 L 190 107" stroke="#334155" stroke-width="2"/>

  <!-- Character Arms / Hands gesturing towards composite material -->
  <path d="M 145 145 C 130 150 120 155 110 145" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <circle cx="106" cy="142" r="6" fill="#fcd34d"/>

  <!-- MAIN PROP: The Advanced Composite Material Specimen -->
  <!-- Stands/Mount for the sample -->
  <rect x="85" y="150" width="30" height="30" rx="4" fill="#475569"/>
  <path d="M 90 150 L 110 150 L 115 130 L 85 130 Z" fill="#64748b"/>

  <!-- Composite Material Block (Showing layered/fibrous structure clearly indicating "复合" / composite) -->
  <g transform="translate(75, 95)">
    <!-- Main block isometric/3D look -->
    <path d="M 20 10 L 60 25 L 60 65 L 20 50 Z" fill="#334155"/>
    <path d="M 60 25 L 90 10 L 50 0 L 20 10 Z" fill="#64748b"/>
    <path d="M 60 65 L 90 50 L 90 10 L 60 25 Z" fill="#1e293b"/>

    <!-- Layer 1: Carbon fiber mesh pattern -->
    <path d="M 28 20 L 52 30 L 52 45 L 28 35 Z" fill="#0f172a"/>
    <path d="M 32 23 L 48 29 M 32 27 L 48 33 M 32 31 L 48 37" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Layer 2: Matrix polymer / metallic interwoven core (Composite highlight) -->
    <path d="M 65 20 L 85 12 L 85 42 L 65 50 Z" fill="#334155"/>
    <circle cx="75" cy="25" r="4" fill="#fbbf24"/>
    <circle cx="75" cy="38" r="4" fill="#10b981"/>
    <path d="M 68 31 L 82 25" stroke="#fb923c" stroke-width="2"/>

    <!-- Glowing holographic scan line indicating high-tech composite analysis -->
    <line x1="10" y1="35" x2="100" y2="35" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" opacity="0.8"/>
    <circle cx="55" cy="35" r="5" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Magnifying Detail floating element (Highlighting composite structure) -->
  <circle cx="125" cy="70" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 138 83 L 152 97" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <!-- Inside magnifying glass: Multi-material matrix representation -->
  <circle cx="120" cy="65" r="3" fill="#fbbf24"/>
  <circle cx="130" cy="72" r="3" fill="#10b981"/>
  <circle cx="125" cy="75" r="2.5" fill="#ec4899"/>
  <line x1="115" y1="65" x2="132" y2="72" stroke="#f8fafc" stroke-width="1.5"/>
  <line x1="120" y1="65" x2="125" y2="75" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- Ambient light particles/sparkles for modern tech feel -->
  <circle cx="200" cy="50" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="35" cy="130" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="140" cy="210" r="2" fill="#10b981" opacity="0.7"/>
</svg>