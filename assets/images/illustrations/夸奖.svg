<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Senior Figure (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#FFB84D"/>
    <path d="M5 40 Q20 30 35 40 L30 100 L10 100 Z" fill="#4A90E2"/>
    <!-- Arm gesturing towards the younger person -->
    <path d="M30 50 L55 70" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
    <path d="M55 70 L70 60" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Younger Figure (Right) -->
  <g transform="translate(140, 110)">
    <circle cx="20" cy="20" r="15" fill="#A0CFFF"/>
    <path d="M5 40 Q20 30 35 40 L30 100 L10 100 Z" fill="#50E3C2"/>
    <!-- Bowing posture -->
    <path d="M20 40 L40 60" stroke="#A0CFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Motion/Action lines indicating the verbal praise -->
  <g stroke="#FFB84D" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4">
    <path d="M90 60 Q110 40 130 60"/>
    <path d="M95 70 Q115 50 135 70"/>
  </g>
</svg>