<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle atmospheric glow -->
  <radialGradient id="sunsetGlow" cx="120" cy="160" r="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#FF5E62" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#sunsetGlow)"/>

  <!-- Setting Sun -->
  <circle cx="120" cy="170" r="35" fill="#FFD200"/>
  <circle cx="120" cy="170" r="45" fill="#FFD200" opacity="0.2"/>

  <!-- Rosy Clouds (霞 - Xiá) -->
  <!-- Top Cloud Layer -->
  <path d="M50 95 C 70 80, 100 80, 120 95 C 140 110, 170 110, 190 95" stroke="#FF4E50" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
  
  <!-- Middle Cloud Layer -->
  <path d="M30 125 C 60 110, 90 110, 120 125 C 150 140, 180 140, 210 125" stroke="#FC913A" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
  
  <!-- Bottom Cloud Layer -->
  <path d="M70 150 C 90 140, 120 140, 140 150 C 160 160, 180 160, 200 150" stroke="#F9D423" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Distant Horizon Silhouette -->
  <path d="M0 190 Q 60 180, 120 190 T 240 190 L 240 240 L 0 240 Z" fill="#0F1115"/>
  
  <!-- Reflection on Horizon -->
  <path d="M80 195 H 160" stroke="#FFD200" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M100 205 H 140" stroke="#FC913A" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>