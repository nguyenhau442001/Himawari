<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for dramatic tension -->
  <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%" fx="50%" fy="45%">
    <stop offset="0%" stop-color="#E53935" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#bgGlow)"/>

  <!-- Conceptual Object: A sleek, modern smartphone/tablet displaying a shattering emergency alert (representing tragic breaking news / "hung tin") -->
  
  <!-- Device Drop Shadow -->
  <rect x="72" y="44" width="96" height="152" rx="14" fill="#0D0F13" opacity="0.6"/>

  <!-- Device Outer Body -->
  <rect x="70" y="42" width="100" height="156" rx="16" fill="#2D333B" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Device Screen -->
  <rect x="76" y="48" width="88" height="144" rx="10" fill="#15181C"/>

  <!-- Notification Banner / Alert Box -->
  <rect x="86" y="76" width="68" height="38" rx="6" fill="#2A1B1D" stroke="#E53935" stroke-width="1.5"/>

  <!-- Warning / Shock Icon (Exclamation inside Triangle) -->
  <polygon points="120,83 133,103 107,103" fill="#FFB74D"/>
  <rect x="118" y="90" width="4" height="7" rx="2" fill="#2A1B1D"/>
  <circle cx="120" cy="100" r="2" fill="#2A1B1D"/>

  <!-- Breaking News Text Lines (Abstract Representation) -->
  <rect x="88" y="128" width="64" height="6" rx="3" fill="#E0E0E0"/>
  <rect x="88" y="142" width="44" height="5" rx="2.5" fill="#718096"/>

  <!-- Shatter / Crack Graphic (Visualizing the devastating impact of the news) -->
  <path d="M 76 100 L 96 110 L 90 125 L 110 135" stroke="#E53935" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M 164 120 L 145 130 L 152 145 L 135 155" stroke="#E53935" stroke-width="1.5" fill="none" opacity="0.8"/>
  <circle cx="120" cy="120" r="75" stroke="#E53935" stroke-width="0.5" fill="none" stroke-dasharray="3 6" opacity="0.4"/>

  <!-- Accents / Focus Lighting (Orange/Gold) -->
  <circle cx="120" cy="48" r="1.5" fill="#A0AEC0"/>
</svg>