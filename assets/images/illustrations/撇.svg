<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="lamp-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment & Window -->
  <g id="environment">
    <!-- Window showing night city / calm background -->
    <rect x="140" y="25" width="70" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <path d="M175 25 v80 M140 65 h70" stroke="#334155" stroke-width="2" />
    <!-- Distant city lights -->
    <circle cx="155" cy="85" r="1.5" fill="#f59e0b" opacity="0.6" />
    <circle cx="165" cy="75" r="1.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="190" cy="90" r="1.5" fill="#f59e0b" opacity="0.4" />
    <circle cx="195" cy="70" r="1.5" fill="#ec4899" opacity="0.5" />

    <!-- Wall Shelf with books/plant -->
    <rect x="30" y="45" width="75" height="4" rx="2" fill="#475569" />
    <rect x="40" y="25" width="12" height="20" rx="2" fill="#ef4444" opacity="0.8" />
    <rect x="54" y="28" width="10" height="17" rx="2" fill="#38bdf8" opacity="0.8" />
    <path d="M75 45 c0 -8 8 -8 8 -16 c0 8 8 8 8 16 z" fill="#10b981" />
    <rect x="81" y="37" width="4" height="8" fill="#94a3b8" />
  </g>

  <!-- Floating "Worries" being cast away / discarded (Visualizing 撇 - to cast aside, brush off) -->
  <g id="discarded-worries" filter="url(#soft-glow)" opacity="0.9">
    <!-- Swirling abstract worry clouds/symbols floating away to the left/up -->
    <path d="M95 75 Q80 65 70 80 T45 70" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
    <path d="M105 55 Q90 45 80 60" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Worry icons/elements fading out -->
    <g transform="translate(60, 50) scale(0.7)" opacity="0.7">
      <circle cx="0" cy="0" r="12" fill="#ef4444" opacity="0.2" />
      <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <g transform="translate(35, 75) scale(0.5)" opacity="0.5">
      <circle cx="0" cy="0" r="10" fill="#f97316" opacity="0.2" />
      <path d="M-4 -2 L0 4 L4 -2" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Desk Surface -->
  <rect x="0" y="170" width="240" height="70" fill="url(#desk-grad)" />
  <rect x="0" y="170" width="240" height="4" fill="#475569" />

  <!-- Desk Props (Working Context) -->
  <!-- Laptop -->
  <g id="laptop" transform="translate(130, 130)">
    <!-- Base -->
    <path d="M-25 40 L65 40 L55 55 L-15 55 Z" fill="#64748b" />
    <rect x="-10" y="47" width="50" height="3" rx="1.5" fill="#475569" />
    <!-- Screen -->
    <path d="M-20 -5 L60 -5 L65 40 L-25 40 Z" fill="#334155" />
    <rect x="-15" y="0" width="70" height="37" fill="#0f172a" />
    <!-- Code / Work UI on screen -->
    <rect x="-10" y="5" width="30" height="4" rx="2" fill="#38bdf8" opacity="0.8" />
    <rect x="-10" y="12" width="50" height="3" rx="1.5" fill="#334155" />
    <rect x="-10" y="18" width="40" height="3" rx="1.5" fill="#10b981" opacity="0.7" />
    <rect x="-10" y="24" width="45" height="3" rx="1.5" fill="#334155" />
  </g>

  <!-- Coffee Mug -->
  <g id="mug" transform="translate(195, 155)">
    <rect x="0" y="0" width="14" height="18" rx="3" fill="#cbd5e1" />
    <path d="M14 4 c4 0 4 10 0 10" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
    <path d="M4 -3 Q7 -8 10 -3" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Desk Lamp -->
  <g id="lamp">
    <path d="M30 170 L35 120 L45 120 L50 170" fill="#475569" />
    <ellipse cx="40" cy="170" rx="15" ry="4" fill="#334155" />
    <!-- Lamp head & Light cone -->
    <path d="M25 90 L55 90 L65 110 L15 110 Z" fill="#3b82f6" />
    <path d="M-10 110 L90 110 L130 180 L-50 180 Z" fill="url(#lamp-cone)" />
  </g>

  <!-- Main Character: Focused Professional (专心工作) -->
  <g id="character" transform="translate(85, 95)">
    <!-- Chair Back -->
    <path d="M-25 15 Q-25 -25 10 -30 Q45 -25 45 15 Z" fill="#334155" />
    <rect x="-8" y="15" width="16" height="65" fill="#1e293b" />

    <!-- Character Body / Torso -->
    <path d="M-22 40 Q-25 10 0 10 Q25 10 22 40 L30 85 L-30 85 Z" fill="#0ea5e9" />
    <!-- Collar / Shirt details -->
    <path d="M-8 10 L0 22 L8 10" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arms actively typing / focused -->
    <!-- Left Arm -->
    <path d="M-20 25 Q-35 40 -20 55 L15 50" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Arm -->
    <path d="M20 25 Q35 45 25 55 L45 52" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hands -->
    <circle cx="15" cy="50" r="5" fill="#fcd34d" />
    <circle cx="45" cy="52" r="5" fill="#fcd34d" />

    <!-- Character Neck -->
    <rect x="-5" y="3" width="10" height="12" fill="#fcd34d" />

    <!-- Character Head -->
    <circle cx="0" cy="-15" r="22" fill="#fcd34d" />

    <!-- Hair (Stylish, neat modern cut) -->
    <path d="M-22 -18 Q-25 -38 0 -38 Q25 -38 22 -18 Q20 -28 0 -28 Q-20 -28 -22 -18 Z" fill="#1e293b" />
    <path d="M-22 -18 Q-15 -35 5 -32" fill="#1e293b" />

    <!-- Facial Expression: Deeply Focused, calm, determined (专心) -->
    <!-- Closed/Focused Eyes (Concentrated downward arc) -->
    <path d="M-10 -12 Q-6 -9 -2 -12" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M2 -12 Q6 -9 10 -12" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    
    <!-- Eyebrows showing determination -->
    <path d="M-12 -18 L-2 -16" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M2 -16 L12 -18" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Gentle confident smile -->
    <path d="M-5 -3 Q0 1 5 -3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Cute rosy cheeks -->
    <circle cx="-13" cy="-7" r="4" fill="#f43f5e" opacity="0.3" />
    <circle cx="13" cy="-7" r="4" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Foreground Atmospheric Lighting / Polish -->
  <circle cx="40" cy="120" r="60" fill="#38bdf8" opacity="0.05" filter="url(#soft-glow)" />
</svg>