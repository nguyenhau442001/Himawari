<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Wall -->
  <rect x="40" y="30" width="160" height="180" rx="4" fill="#cbd5e1"/>
  
  <!-- The Crack (裂缝) -->
  <path d="M110 50 L115 80 L105 110 L112 150 L108 190" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M112 80 L120 95" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Character -->
  <g transform="translate(130, 120)">
    <!-- Body -->
    <path d="M20 90 L60 90 L55 50 L25 50 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="40" cy="35" r="15" fill="#fbbf24"/>
    <!-- Arm pointing -->
    <path d="M55 60 L75 50" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="35" cy="32" r="2" fill="#0f172a"/>
    <circle cx="45" cy="32" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Context Props -->
  <rect x="50" y="180" width="40" height="30" fill="#fb923c" rx="2"/>
  <circle cx="70" cy="160" r="10" fill="#ec4899"/>
  
  <!-- Floor -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
</svg>