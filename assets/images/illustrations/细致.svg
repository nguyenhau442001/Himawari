<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Surface -->
  <rect x="40" y="160" width="160" height="8" rx="2" fill="#343A46"/>
  
  <!-- Magnifying Glass (The focus tool) -->
  <circle cx="150" cy="100" r="35" fill="none" stroke="#FFB84D" stroke-width="6"/>
  <line x1="175" y1="125" x2="195" y2="145" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
  
  <!-- The "Work" - A complex gear mechanism being inspected -->
  <!-- Large gear representing the overall project -->
  <circle cx="90" cy="130" r="40" fill="#2D3446" stroke="#4A5568" stroke-width="4"/>
  
  <!-- Small intricate details being highlighted by the lens -->
  <circle cx="140" cy="90" r="8" fill="#FFB84D"/>
  <rect x="138" y="70" width="4" height="12" fill="#FFB84D" rx="1"/>
  <rect x="138" y="98" width="4" height="12" fill="#FFB84D" rx="1"/>
  <rect x="128" y="88" width="12" height="4" fill="#FFB84D" rx="1"/>
  <rect x="148" y="88" width="12" height="4" fill="#FFB84D" rx="1"/>
  
  <!-- Small precision dots/components -->
  <circle cx="80" cy="120" r="3" fill="#636E72"/>
  <circle cx="100" cy="140" r="3" fill="#636E72"/>
  <circle cx="75" cy="145" r="2" fill="#636E72"/>
  
  <!-- Stylized hand holding the lens -->
  <path d="M180 130 L205 155 C210 160 215 155 212 150 L185 125 Z" fill="#A0AEC0"/>
</svg>