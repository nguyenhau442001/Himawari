<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Compass / Directional Indicator (Northeast focus) -->
  <g transform="translate(120, 120)">
    <!-- Outer compass ring -->
    <circle cx="0" cy="0" r="88" fill="#222732" stroke="#2F3644" stroke-width="2"/>
    <circle cx="0" cy="0" r="64" fill="#1A1D24" stroke="#2F3644" stroke-width="1.5"/>

    <!-- Compass tick marks -->
    <line x1="0" y1="-80" x2="0" y2="-72" stroke="#525E75" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="0" x2="72" y2="0" stroke="#525E75" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="0" y2="72" stroke="#525E75" stroke-width="2" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="-72" y2="0" stroke="#525E75" stroke-width="2" stroke-linecap="round"/>

    <!-- Minor ticks -->
    <line x1="56.5" y1="-56.5" x2="50.9" y2="-50.9" stroke="#525E75" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="56.5" y1="56.5" x2="50.9" y2="50.9" stroke="#525E75" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-56.5" y1="56.5" x2="-50.9" y2="50.9" stroke="#525E75" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-56.5" y1="-56.5" x2="-50.9" y2="-50.9" stroke="#525E75" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cardinal direction labels (Dots/Markers instead of text) -->
    <circle cx="0" cy="-70" r="3" fill="#525E75"/>
    <circle cx="70" cy="0" r="3" fill="#525E75"/>
    <circle cx="0" cy="70" r="3" fill="#525E75"/>
    <circle cx="-70" cy="0" r="3" fill="#525E75"/>

    <!-- Northeast highlighted quadrant arc/glow -->
    <path d="M 0 -64 A 64 64 0 0 1 64 0 L 0 0 Z" fill="#F59E0B" fill-opacity="0.15"/>

    <!-- Northeast highlighted needle (Pointing to top-right: Northeast) -->
    <polygon points="0,0 48,-48 24,-58" fill="#D97706"/>
    <polygon points="0,0 48,-48 58,-24" fill="#F59E0B"/>
    
    <!-- Counter needle (Southwest) -->
    <polygon points="0,0 -32,32 -16,38" fill="#3B4252"/>
    <polygon points="0,0 -32,32 -38,16" fill="#2E3440"/>

    <!-- Center pivot -->
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="4" fill="#1A1D24"/>
  </g>

  <!-- Regional Icon Overlay: Northeastern China winter scene (Pine tree, snow peak, cold aesthetic) -->
  <g transform="translate(120, 120)">
    <!-- Highlight pointer arrow / badge representing Northeast -->
    <path d="M 45 -45 L 72 -72 M 72 -72 L 56 -72 M 72 -72 L 72 -56" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mini snowy mountain peak / pine graphic inside top-right quadrant -->
    <g transform="translate(42, -42) scale(0.55)">
      <!-- Snow cap -->
      <path d="M0 -20 L16 8 L-16 8 Z" fill="#E2E8F0"/>
      <path d="M0 -20 L6 -6 L0 -2 L-6 -6 Z" fill="#FFFFFF"/>
      <!-- Mountain base -->
      <path d="M-16 8 L-22 22 L22 22 L16 8 Z" fill="#3B4252"/>
      <!-- Pine tree symbolizing northern taiga -->
      <path d="M24 10 L32 22 L16 22 Z" fill="#10B981"/>
      <path d="M24 2 L30 12 L18 12 Z" fill="#059669"/>
    </g>
  </g>

  <!-- Decorative frost / winter atmosphere elements -->
  <circle cx="50" cy="50" r="2" fill="#E2E8F0" opacity="0.4"/>
  <circle cx="190" cy="70" r="1.5" fill="#E2E8F0" opacity="0.3"/>
  <circle cx="45" cy="180" r="2.5" fill="#E2E8F0" opacity="0.3"/>
  <circle cx="185" cy="175" r="2" fill="#E2E8F0" opacity="0.4"/>
</svg>