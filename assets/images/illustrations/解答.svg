<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Conceptual Object: Open Book (Knowledge/Problem) and Glowing Lightbulb (Solution/Answer) -->
  <g transform="translate(0, 5)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="175" rx="65" ry="12" fill="#111318"/>

    <!-- Book Base / Pages -->
    <path d="M 60 145 C 80 140, 110 148, 120 155 C 130 148, 160 140, 180 145 L 180 170 C 160 165, 130 172, 120 180 C 110 172, 80 165, 60 170 Z" fill="#E2E8F0"/>
    
    <!-- Book Cover -->
    <path d="M 55 140 C 75 135, 110 143, 120 150 C 130 143, 165 135, 185 140 L 185 145 C 165 140, 130 148, 120 155 C 110 148, 75 140, 55 145 Z" fill="#3B82F6"/>
    <path d="M 55 145 L 55 170 C 75 165, 110 172, 120 180 L 120 155 C 110 148, 75 140, 55 145 Z" fill="#2563EB"/>
    <path d="M 185 145 L 185 170 C 165 165, 130 172, 120 180 L 120 155 C 130 148, 165 140, 185 145 Z" fill="#1D4ED8"/>

    <!-- Problem lines on pages (abstract math/text) -->
    <line x1="72" y1="152" x2="95" y2="152" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="160" x2="88" y2="160" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="145" y1="152" x2="168" y2="152" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="152" y1="160" x2="168" y2="160" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

    <!-- Solution / Lightbulb representing "Jiědá" (Answering/Resolving) -->
    <!-- Glow rays -->
    <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="120" y1="40" x2="120" y2="52"/>
      <line x1="83" y1="55" x2="93" y2="63"/>
      <line x1="157" y1="55" x2="147" y2="63"/>
      <line x1="68" y1="90" x2="80" y2="90"/>
      <line x1="172" y1="90" x2="160" y2="90"/>
    </g>

    <!-- Bulb Glass -->
    <path d="M 98 90 C 98 72, 107 65, 120 65 C 133 65, 142 72, 142 90 C 142 102, 133 110, 128 116 L 128 126 L 112 126 L 112 116 C 107 110, 98 102, 98 90 Z" fill="#FBBF24"/>
    
    <!-- Bulb Highlight -->
    <path d="M 108 82 C 108 76, 112 72, 118 70" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Bulb Base/Socket -->
    <rect x="112" y="126" width="16" height="6" rx="1" fill="#64748B"/>
    <rect x="114" y="132" width="12" height="5" rx="1" fill="#475569"/>
    <path d="M 117 137 C 117 140, 123 140, 123 137 Z" fill="#334155"/>

    <!-- Connection beam from book to bulb (Resolution/Clarity) -->
    <path d="M 120 148 L 120 142" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 4"/>
  </g>
</svg>