<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Elements for depth -->
  <circle cx="120" cy="120" r="90" fill="#222732" opacity="0.6"/>
  
  <!-- The Script / Screenplay (Physical Object) -->
  <g transform="translate(0, 5)">
    <!-- Back pages / thickness -->
    <rect x="74" y="44" width="92" height="132" rx="4" fill="#2C3240"/>
    <rect x="72" y="48" width="96" height="132" rx="4" fill="#343B4C"/>
    
    <!-- Main Cover -->
    <rect x="70" y="52" width="100" height="132" rx="4" fill="#1E232E"/>
    
    <!-- Binding spine / clips -->
    <rect x="70" y="52" width="10" height="132" fill="#E65C00"/>
    <rect x="73" y="72" width="4" height="8" rx="2" fill="#1E232E"/>
    <rect x="73" y="112" width="4" height="8" rx="2" fill="#1E232E"/>
    <rect x="73" y="152" width="4" height="8" rx="2" fill="#1E232E"/>
    
    <!-- Cover Design Elements (Cinematic / Dramatic motif) -->
    <!-- Clapperboard silhouette or title layout on cover -->
    <rect x="94" y="74" width="52" height="36" rx="2" fill="#2A303D"/>
    <!-- Clapper top stripes -->
    <path d="M94 74 L104 64 L114 74 Z" fill="#E65C00"/>
    <path d="M114 74 L124 64 L134 74 Z" fill="#D8D8D8"/>
    <path d="M134 74 L144 64 L146 66 L136 76 Z" fill="#E65C00"/>
    
    <!-- Text placeholder lines on cover -->
    <rect x="94" y="124" width="52" height="6" rx="3" fill="#E65C00"/>
    <rect x="94" y="138" width="36" height="4" rx="2" fill="#4A5265"/>
    <rect x="94" y="148" width="44" height="4" rx="2" fill="#4A5265"/>
  </g>

  <!-- Attached Fountain Pen / Quill (Writing the script) -->
  <g transform="translate(10, 10) rotate(25 150 140)">
    <!-- Pen Body -->
    <path d="M144 100 L156 100 L160 160 L140 160 Z" fill="#E65C00"/>
    <!-- Pen Cap / Accent -->
    <rect x="143" y="90" width="14" height="12" rx="2" fill="#FF8533"/>
    <rect x="148" y="86" width="4" height="5" fill="#D8D8D8"/>
    <!-- Pen Nib -->
    <path d="M140 160 L150 180 L160 160 Z" fill="#D8D8D8"/>
    <!-- Nib slit -->
    <line x1="150" y1="163" x2="150" y2="175" stroke="#1A1D24" stroke-width="1.5"/>
  </g>

  <!-- Glowing creative spark / focus accent -->
  <circle cx="178" cy="74" r="3" fill="#FFC700"/>
  <circle cx="62" cy="158" r="2.5" fill="#FFC700" opacity="0.8"/>
  <circle cx="140" cy="40" r="2" fill="#E65C00" opacity="0.6"/>
</svg>