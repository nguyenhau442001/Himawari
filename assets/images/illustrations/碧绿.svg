<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background / Environment Elements -->
  <defs>
    <!-- Deep water gradient -->
    <linearGradient id="deepWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14262E"/>
      <stop offset="100%" stop-color="#0B1318"/>
    </linearGradient>

    <!-- Vibrant emerald water gradient for 'bìlǜ' (green and lucid) -->
    <linearGradient id="emeraldWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E699"/>
      <stop offset="50%" stop-color="#00B377"/>
      <stop offset="100%" stop-color="#0A5C3D"/>
    </linearGradient>

    <!-- Golden morning light gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Dark Scene -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="url(#deepWater)"/>

  <!-- Scale Exaggeration & Contrast (Adjective rule): 
       Contrasting the vast, deep dark void with an intensely vibrant, 
       glowing emerald lake expanse that embodies "碧绿" (vivid, piercing blue-green). -->
       
  <!-- Distant subtle ripples (depth) -->
  <path d="M50 90 Q 90 85, 120 92 T 190 88" stroke="#104E38" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M40 110 Q 100 105, 140 112 T 200 106" stroke="#104E38" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Main Emerald Body of Water (Central Focus) -->
  <g filter="url(#glow)">
    <path d="M 45 130 C 45 100, 70 95, 120 95 C 170 95, 195 100, 195 130 C 195 170, 160 190, 120 190 C 80 190, 45 170, 45 130 Z" fill="url(#emeraldWater)"/>
  </g>

  <!-- Inner Clarity / Transparency Highlights -->
  <path d="M 60 135 C 60 115, 80 110, 120 110 C 160 110, 180 115, 180 135 C 180 160, 150 175, 120 175 C 90 175, 60 160, 60 135 Z" fill="#00FFAD" opacity="0.15"/>

  <!-- Golden Morning Ripples (Contextual reference: 金色微波) -->
  <path d="M 75 125 Q 90 120, 110 126" stroke="#FFE082" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 125 145 Q 145 138, 165 146" stroke="#FFE082" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 90 160 Q 115 152, 135 161" stroke="#FFE082" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Crystal-clear light refractions (晶莹剔透) -->
  <circle cx="145" cy="120" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="85" cy="140" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="115" cy="135" r="4" fill="#FFE082" opacity="0.9"/>
  <circle cx="160" cy="155" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Morning Sunbeams cutting across -->
  <path d="M 30 20 L 110 200" stroke="url(#goldLight)" stroke-width="24" stroke-linecap="round" opacity="0.15"/>
  <path d="M 70 20 L 150 200" stroke="url(#goldLight)" stroke-width="12" stroke-linecap="round" opacity="0.2"/>

  <!-- Foreground accent: Stylized floating lotus leaf / aquatic flora for scale and vivid contrast -->
  <g transform="translate(140, 120)">
    <path d="M 0 0 C 15 -15, 35 -10, 40 5 C 45 20, 25 35, 5 30 C -15 25, -15 10, 0 0 Z" fill="#00C875"/>
    <path d="M 2 5 C 10 5, 20 12, 22 20" stroke="#00854D" stroke-width="1.5" fill="none"/>
    <circle cx="23" cy="21" r="1.5" fill="#FFE082"/>
  </g>
  <g transform="translate(75, 150) scale(0.6)">
    <path d="M 0 0 C 15 -15, 35 -10, 40 5 C 45 20, 25 35, 5 30 C -15 25, -15 10, 0 0 Z" fill="#00B368"/>
    <path d="M 2 5 C 10 5, 20 12, 22 20" stroke="#006639" stroke-width="1.5" fill="none"/>
  </g>

</svg>