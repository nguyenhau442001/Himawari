<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Historical Glow -->
    <radialGradient id="sunbeam" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Artifact Gold/Bronze Gradient -->
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- UI/Accent Glow -->
    <radialGradient id="childGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunbeam)"/>

  <!-- ENVIRONMENT: Museum / Heritage Site Interior -->
  <!-- Subtle architectural columns and background display -->
  <g opacity="0.4">
    <rect x="25" y="40" width="18" height="150" fill="#334155"/>
    <rect x="197" y="40" width="18" height="150" fill="#334155"/>
    <path d="M 20 40 L 220 40 L 220 48 L 20 48 Z" fill="#475569"/>
    <!-- Display Arch in Background -->
    <path d="M 85 90 Q 120 60 155 90 L 155 180 L 85 180 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- ANCIENT RELIC (The "Old Heritage" - 古迹) -->
  <g transform="translate(100, 75)" filter="url(#softShadow)">
    <!-- Relic Pedestal -->
    <path d="M -25 70 L 45 70 L 35 90 L -15 90 Z" fill="#334155"/>
    <rect x="-20" y="60" width="60" height="10" fill="#475569" rx="2"/>

    <!-- Bronze Ding / Ancient Vessel Motif -->
    <!-- Vessel Body -->
    <path d="M -15 25 Q -25 45 -10 60 L 30 60 Q 45 45 35 25 Z" fill="url(#bronzeGrad)"/>
    <!-- Rim & Handles -->
    <ellipse cx="10" cy="25" rx="26" ry="6" fill="#f59e0b"/>
    <path d="M -16 22 C -26 22 -26 8 -14 12" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <path d="M 36 22 C 46 22 46 8 34 12" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <!-- Ancient Engravings / Patterns -->
    <path d="M 2 32 L 8 42 L 18 32" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="48" r="3" fill="#78350f"/>
  </g>

  <!-- CHARACTERS: The Elder (Grandfather) passing down to the Child (Descendant - 后代) -->
  <!-- Atmospheric focus glow around characters -->
  <circle cx="120" cy="150" r="70" fill="url(#childGlow)"/>

  <!-- GRANDFATHER (Older Generation) -->
  <g transform="translate(55, 110)" filter="url(#softShadow)">
    <!-- Body & Torso -->
    <path d="M 15 40 Q 30 40 40 80 L -10 80 Q 0 50 15 40 Z" fill="#3b82f6"/>
    <!-- Arm reaching out to point/present -->
    <path d="M 25 45 Q 45 50 55 40" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="58" cy="38" r="5" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="20" cy="20" r="16" fill="#fbcfe8"/>
    <!-- Hair (Grey/White) & Glasses -->
    <path d="M 6 16 Q 20 4 34 16 Q 34 10 20 8 Q 6 10 6 16 Z" fill="#94a3b8"/>
    <circle cx="15" cy="19" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="25" cy="19" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="20" y1="19" x2="20" y2="18" stroke="#64748b" stroke-width="1.5"/>
    <!-- Warm, Wise Smile -->
    <path d="M 17 26 Q 20 29 23 26" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- CHILD (The Descendant / 后代 - Next Generation) -->
  <g transform="translate(135, 100)" filter="url(#softShadow)">
    <!-- Body & Bright Hoodie -->
    <path d="M 25 50 Q 15 50 5 90 L 55 90 Q 45 50 35 50 Z" fill="#10b981"/>
    <!-- Backpack strap -->
    <path d="M 18 52 L 8 90" fill="none" stroke="#047857" stroke-width="4"/>

    <!-- Arm pointing/reaching up towards the artifact -->
    <path d="M 15 55 Q -5 45 -18 35" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="-21" cy="32" r="5" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="20" cy="22" r="18" fill="#fbcfe8"/>
    <!-- Playful Modern Hair -->
    <path d="M 2 18 Q 20 -2 38 18 Q 30 8 20 10 Q 10 8 2 18 Z" fill="#d97706"/>
    <!-- Curious, Wide Eyes -->
    <circle cx="14" cy="21" r="2.5" fill="#0f172a"/>
    <circle cx="26" cy="21" r="2.5" fill="#0f172a"/>
    <circle cx="15" cy="20" r="1" fill="#ffffff"/>
    <circle cx="27" cy="20" r="1" fill="#ffffff"/>
    <!-- Happy Open Smile -->
    <path d="M 17 28 Q 20 32 23 28" fill="#be185d"/>

    <!-- Cute Red Scarf representing care & passing down -->
    <path d="M 8 36 Q 20 42 32 36 L 34 44 Q 20 48 6 44 Z" fill="#ef4444"/>
    <path d="M 26 42 L 32 58 L 24 60 Z" fill="#dc2626"/>
  </g>

  <!-- FOREGROUND / INTERACTION ELEMENTS -->
  <!-- Museum Glass Barrier / Railing at the bottom for depth -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" opacity="0.8"/>
  <rect x="0" y="206" width="240" height="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="40" cy="208" r="3" fill="#cbd5e1"/>
  <circle cx="200" cy="208" r="3" fill="#cbd5e1"/>

  <!-- Atmospheric Light Beams from Museum Ceiling -->
  <path d="M 80 0 L 100 240 L 60 240 L 40 0 Z" fill="#ffffff" opacity="0.03"/>
  <path d="M 140 0 L 180 240 L 140 240 L 110 0 Z" fill="#ffffff" opacity="0.03"/>

</svg>