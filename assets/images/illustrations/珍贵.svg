    <!-- The "Precious" object: A glowing heart-shaped locket held between them -->
    <g transform="translate(95, 100)">
      <path d="M10 0 C10 -10 20 -10 20 0 C20 10 10 15 0 10 C-10 15 -20 10 -20 0 C-20 -10 -10 -10 -10 0 Z" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    </g>
    
    <!-- Decorative sparkles -->
    <path d="M80 50 L85 45 L90 50 L85 55 Z" fill="#fbbf24"/>
    <path d="M150 70 L153 67 L156 70 L153 73 Z" fill="#fbbf24"/>
    <path d="M110 30 L114 26 L118 30 L114 34 Z" fill="#fbbf24"/>
