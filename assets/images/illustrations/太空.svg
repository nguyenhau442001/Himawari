<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container with Dark Mode Theme -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative stars / space elements -->
  <g fill="#4A5568" opacity="0.6">
    <circle cx="45" cy="55" r="1.5" />
    <circle cx="195" cy="45" r="1" />
    <circle cx="205" cy="180" r="1.5" />
    <circle cx="50" cy="190" r="2" />
    <circle cx="100" cy="35" r="1" />
    <circle cx="180" cy="115" r="1.5" />
    <circle cx="35" cy="120" r="1" />
  </g>

  <!-- Distant Planet / Celestial Body -->
  <circle cx="185" cy="85" r="28" fill="#2D3748"/>
  <path d="M165 75 C175 90, 200 90, 210 75" stroke="#4A5568" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Central Iconic Subject: Astronaut in Space (Noun - Person/Object in Space) -->
  <g transform="translate(120, 125)">
    <!-- Tether / Orbit Line -->
    <path d="M -70 40 C -30 60, 20 40, 50 -20" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.3"/>

    <!-- Astronaut Body / Suit -->
    <!-- Backpack -->
    <rect x="-22" y="-18" width="10" height="30" rx="3" fill="#A0AEC0"/>
    
    <!-- Torso -->
    <rect x="-15" y="-15" width="30" height="36" rx="10" fill="#EDF2F7"/>
    <path d="M-15 0 L15 0 L15 15 C15 20, 10 21, 0 21 C-10 21, -15 20, -15 15 Z" fill="#CBD5E0"/>
    
    <!-- Chest Control Panel Accent -->
    <rect x="-6" y="-8" width="12" height="8" rx="2" fill="#E53E3E"/>
    <circle cx="0" cy="-4" r="2" fill="#F6E05E"/>

    <!-- Helmet -->
    <circle cx="0" cy="-30" r="18" fill="#EDF2F7"/>
    <!-- Visor -->
    <path d="M -12 -34 C -12 -42, 12 -42, 12 -34 C 12 -26, -12 -26, -12 -34 Z" fill="#1A202C"/>
    <!-- Visor Reflection -->
    <path d="M -8 -36 C -4 -40, 2 -38, 4 -35" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Arms (Floating) -->
    <!-- Left Arm -->
    <path d="M -15 -10 C -25 -5, -30 5, -28 12" stroke="#EDF2F7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="-28" cy="14" r="5" fill="#CBD5E0"/>

    <!-- Right Arm (Raised) -->
    <path d="M 15 -10 C 25 -15, 32 -5, 30 5" stroke="#EDF2F7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="7" r="5" fill="#CBD5E0"/>

    <!-- Legs (Floating) -->
    <!-- Left Leg -->
    <path d="M -8 21 C -12 30, -8 40, -15 48" stroke="#EDF2F7" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Right Leg -->
    <path d="M 8 21 C 15 32, 20 38, 25 45" stroke="#EDF2F7" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- High-contrast decorative floating elements / Focus Accent -->
  <g transform="translate(55, 65)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#F6E05E"/>
  </g>
  <g transform="translate(170, 160)">
    <polygon points="0,-5 1,-1 5,0 1,1 0,5 -1,1 -5,0 -1,-1" fill="#ED8936"/>
  </g>
</svg>