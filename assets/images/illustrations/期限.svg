<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / SCENERY -->
  <!-- Window Frame in Background -->
  <g opacity="0.6">
    <rect x="156" y="25" width="55" height="75" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="160" y="29" width="22" height="67" fill="url(#window-light)"/>
    <rect x="185" y="29" width="22" height="67" fill="url(#window-light)"/>
    <!-- Cityscape Silhouette through window -->
    <path d="M164 70 L164 96 L172 96 L172 65 Z" fill="#475569" opacity="0.5"/>
    <path d="M176 55 L176 96 L184 96 L184 50 Z" fill="#475569" opacity="0.7"/>
    <path d="M190 62 L190 96 L202 96 L202 58 Z" fill="#475569" opacity="0.6"/>
  </g>

  <!-- Bookshelf / Plant Background Details -->
  <rect x="25" y="30" width="45" height="8" rx="2" fill="#334155"/>
  <rect x="35" y="15" width="25" height="15" rx="2" fill="#fb923c" opacity="0.8"/>
  <rect x="63" y="18" width="5" height="12" rx="1" fill="#38bdf8" opacity="0.8"/>
  <!-- Potted Plant -->
  <path d="M 28 30 C 28 24, 34 24, 34 30 Z" fill="#10b981"/>
  <path d="M 31 27 C 31 20, 37 20, 37 27 Z" fill="#34d399"/>
  <path d="M 26 30 L 36 30 L 34 38 L 28 38 Z" fill="#cbd5e1"/>

  <!-- Wall Clock (Showing impending deadline / time passing) -->
  <g transform="translate(110, 35)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="4" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" stroke="#334155" fill="#ef4444"/>
    <!-- Clock ticks -->
    <line x1="0" y1="-11" x2="0" y2="-9" stroke="#94a3b8" stroke-width="1"/>
    <line x1="11" y1="0" x2="9" y2="0" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="11" x2="0" y2="9" stroke="#94a3b8" stroke-width="1"/>
    <line x1="-11" y1="0" x2="-9" y2="0" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- MAIN DESK -->
  <rect x="15" y="170" width="210" height="45" rx="6" fill="url(#desk-grad)" filter="url(#soft-shadow)"/>
  <path d="M 15 170 L 225 170 L 225 176 L 15 176 Z" fill="#475569"/>

  <!-- PROPS ON DESK -->
  <!-- Coffee Mug -->
  <g transform="translate(35, 148)" filter="url(#soft-shadow)">
    <rect x="0" y="5" width="16" height="18" rx="3" fill="#f43f5e"/>
    <path d="M 16 9 C 20 9, 20 18, 16 18" stroke="#f43f5e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 5 2 C 7 0, 5 -2, 7 -4" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 11 1 C 13 -1, 11 -3, 13 -5" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Laptop (Displaying Application Form / Deadline Visual) -->
  <g transform="translate(135, 115)" filter="url(#soft-shadow)">
    <!-- Laptop Base -->
    <path d="M -15 55 L 75 55 L 65 63 L -5 63 Z" fill="#94a3b8"/>
    <rect x="25" y="57" width="10" height="4" rx="1" fill="#64748b"/>
    <!-- Screen Back -->
    <rect x="-10" y="5" width="70" height="52" rx="4" fill="#334155"/>
    <!-- Screen Display -->
    <rect x="-6" y="9" width="62" height="44" rx="2" fill="#0f172a"/>
    <!-- UI Elements on Screen (Application Form layout without text) -->
    <rect x="-2" y="13" width="25" height="4" rx="1" fill="#38bdf8"/>
    <rect x="-2" y="21" width="54" height="3" rx="1.5" fill="#475569"/>
    <rect x="-2" y="27" width="40" height="3" rx="1.5" fill="#475569"/>
    <rect x="-2" y="33" width="48" height="3" rx="1.5" fill="#475569"/>
    <!-- Submit Button Glowing (Action: Submitting application) -->
    <rect x="24" y="41" width="28" height="8" rx="3" fill="#10b981" filter="url(#glow)"/>
    <!-- Arrow icon inside submit button -->
    <path d="M 35 45 L 41 45 M 38 42 L 41 45 L 38 48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Paper document sticking out / floating up representing submission -->
    <g transform="translate(15, -15)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="24" height="32" rx="2" fill="#f8fafc"/>
      <line x1="4" y1="6" x2="16" y2="6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="12" x2="20" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="18" x2="14" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <!-- Checkmark Stamp on document -->
      <circle cx="17" cy="24" r="5" fill="#10b981"/>
      <path d="M 14.5 24 L 16.5 26 L 20 21.5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- CHARACTER (Focused professional actively submitting on time) -->
  <g transform="translate(70, 75)" filter="url(#soft-shadow)">
    <!-- Chair Back -->
    <path d="M -35 85 L -35 15 C -35 5, -25 0, -15 0 L -5 0 C 5 0, 15 5, 15 15 L 15 85 Z" fill="#1e293b"/>
    <rect x="-25" y="20" width="30" height="55" rx="4" fill="#334155" opacity="0.5"/>

    <!-- Body / Torso (Wearing stylish yellow/amber shirt matching color theme) -->
    <path d="M -25 95 C -25 70, 5 70, 5 95 L 10 120 L -30 120 Z" fill="#f59e0b"/>
    <!-- Collar / Tie accent -->
    <path d="M -10 70 L -5 85 L 0 70 Z" fill="#ffffff"/>
    <path d="M -7 75 L -7 92 L -5 95 L -3 92 L -3 75 Z" fill="#ef4444"/>

    <!-- Arms & Hands interacting with Laptop -->
    <!-- Back Arm -->
    <path d="M -20 78 C -30 85, -20 105, -5 105" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Front Arm & Hand clicking/submitting -->
    <path d="M 0 78 C 15 85, 25 95, 45 92" stroke="#d97706" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="48" cy="91" r="5" fill="#fcd34d"/>

    <!-- Neck -->
    <rect x="-12" y="58" width="10" height="15" fill="#fcd34d"/>

    <!-- Head & Face -->
    <circle cx="-7" cy="40" r="18" fill="#fcd34d"/>

    <!-- Hair (Modern dark styling) -->
    <path d="M -25 38 C -25 20, 5 20, 10 38 C 10 42, 8 45, 8 45 C 8 45, 5 30, -8 28 C -20 26, -24 32, -25 38 Z" fill="#1e293b"/>

    <!-- Friendly, focused facial expression -->
    <!-- Glasses -->
    <rect x="-17" y="32" width="10" height="7" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-5" y="32" width="10" height="7" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="-7" y1="35" x2="-5" y2="35" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Eyes (focused/determined) -->
    <circle cx="-12" cy="35" r="1" fill="#1e293b"/>
    <circle cx="0" cy="35" r="1" fill="#1e293b"/>
    <!-- Smile (confident accomplishment) -->
    <path d="M -8 44 C -6 47, -4 47, -2 44" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheek -->
    <circle cx="-14" cy="41" r="3" fill="#f87171" opacity="0.4"/>
  </g>

  <!-- URGENCY / TIMELINE ACCENT (Visual metaphor for deadline/time limit without text) -->
  <g transform="translate(20, 85)" filter="url(#soft-shadow)">
    <!-- Subtle Hourglass / Time representation -->
    <rect x="0" y="0" width="18" height="28" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <path d="M 3 3 L 15 3 L 9 12 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M 3 25 L 15 25 L 9 16 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Glowing pulse highlighting the "in time" aspect -->
    <circle cx="9" cy="14" r="3" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- Foreground Lighting Polish (Vignette & Warm Rim Light) -->
  <circle cx="120" cy="120" r="120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.1"/>
</svg>