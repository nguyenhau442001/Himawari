<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Grass/Ground -->
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#10b981" opacity="0.3"/>
  
  <!-- Flying Disc -->
  <ellipse cx="160" cy="90" rx="15" ry="5" fill="#fb923c" transform="rotate(-15 160 90)"/>
  <ellipse cx="160" cy="88" rx="15" ry="4" fill="#f59e0b"/>
  
  <!-- Dog Body -->
  <path d="M80 130 Q 100 120 120 130 L 130 170 Q 80 180 70 170 Z" fill="#fbbf24"/>
  <circle cx="100" cy="110" r="25" fill="#fbbf24"/>
  
  <!-- Dog Face & Open Mouth (The Target Action) -->
  <path d="M115 115 Q 140 115 140 135 Q 140 155 115 150 Z" fill="#0f172a"/>
  <path d="M120 125 Q 135 125 135 135" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <path d="M110 100 L 125 100 L 115 85 Z" fill="#fbbf24"/>
  <circle cx="95" cy="105" r="3" fill="#0f172a"/>
  <circle cx="110" cy="105" r="3" fill="#0f172a"/>
  
  <!-- Ears -->
  <path d="M85 90 Q 75 70 90 80 Z" fill="#fbbf24"/>
  <path d="M115 90 Q 125 70 110 80 Z" fill="#fbbf24"/>
  
  <!-- Tail -->
  <path d="M75 140 Q 60 130 50 150" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Owner's Arm -->
  <path d="M240 120 Q 200 110 170 100" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="230" cy="125" r="10" fill="#fb923c"/>
  
  <!-- Motion Lines -->
  <path d="M140 90 L 150 90" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <path d="M135 80 L 145 80" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
</svg>