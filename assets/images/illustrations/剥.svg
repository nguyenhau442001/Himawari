<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Hand peeling the orange -->
  <g transform="translate(60, 60)">
    <!-- Orange segments -->
    <path d="M60 120 C 80 120, 100 100, 100 60 C 100 20, 80 0, 60 0 C 40 0, 20 20, 20 60 C 20 100, 40 120, 60 120" fill="#FF9F1C"/>
    <path d="M60 10 C 75 10, 90 25, 90 60 C 90 95, 75 110, 60 110 C 45 110, 30 95, 30 60 C 30 25, 45 10, 60 10" fill="#FFB347"/>
    
    <!-- Peel being pulled back -->
    <path d="M60 0 C 40 0, 20 20, 20 60 C 20 80, 0 90, -10 80 C -20 70, -10 50, 10 40 Z" fill="#E67E22"/>
    
    <!-- Hand -->
    <path d="M-5 70 C -15 70, -25 60, -25 50 C -25 40, -15 30, -5 30 L 5 40 L 15 35 L 25 45 L 10 55 L 5 65 Z" fill="#FFD1A9"/>
    <path d="M-5 70 L -10 85 L 5 90 L 10 75 Z" fill="#FFD1A9"/>
  </g>
  
  <!-- Sunlight effect -->
  <circle cx="200" cy="40" r="20" fill="#F1C40F" opacity="0.3"/>
  <line x1="180" y1="40" x2="160" y2="40" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="60" x2="200" y2="80" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
</svg>