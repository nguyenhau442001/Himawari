<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle broadcast studio elements -->
  <path d="M40 180 L200 180" stroke="#2A303C" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="110" r="70" fill="#222733"/>
  
  <!-- Microphone & Stand (representing TV studio / expert commentary context) -->
  <g transform="translate(120, 115)">
    <!-- Stand base -->
    <path d="M-15 45 L15 45" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 45 L0 15" stroke="#4A5568" stroke-width="4"/>
    
    <!-- Microphone body -->
    <rect x="-12" y="-30" width="24" height="40" rx="12" fill="#F6AD55"/>
    <!-- Mic grille details -->
    <path d="M-8 -18 L8 -18 M-8 -10 L8 -10 M-8 -2 L8 -2" stroke="#DD6B20" stroke-width="2" stroke-linecap="round"/>
    
    <!-- U-shaped bracket -->
    <path d="M-16 -16 C-16 10 16 10 16 -16" fill="none" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="16" r="3" fill="#CBD5E0"/>
  </g>

  <!-- Analytical / Insight Layers (representing "Phân tích, lý giải sâu sắc") -->
  <g transform="translate(120, 115)">
    <!-- Document / Policy sheet unfurling in background -->
    <rect x="-55" y="-55" width="110" height="130" rx="8" fill="#2D3748" opacity="0.8"/>
    <path d="M-35 -30 H35 M-35 -15 H15 M-35 0 H25 M-35 15 H5" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Glowing analytical lens / magnifying insight effect -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#F6AD55" stroke-width="4" opacity="0.3"/>
    
    <!-- Highlight accent spark for "deep insight" -->
    <path d="M 50 -40 Q 60 -40 60 -30 Q 60 -40 70 -40 Q 60 -40 60 -50 Q 60 -40 50 -40 Z" fill="#F6AD55"/>
    <path d="M -60 30 Q -52 30 -52 38 Q -52 30 -44 30 Q -52 30 -52 22 Q -52 30 -60 30 Z" fill="#63B3ED"/>
  </g>
</svg>