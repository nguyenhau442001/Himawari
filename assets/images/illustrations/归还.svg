<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow/surface -->
  <ellipse cx="120" cy="185" rx="70" ry="12" fill="#13151A"/>

  <!-- Library Desk / Surface -->
  <path d="M 40 170 L 200 170 L 210 185 L 30 185 Z" fill="#242833"/>
  <rect x="40" y="170" width="160" height="4" fill="#323846" rx="2"/>

  <!-- Returned Book (stacked flat on the left) -->
  <g transform="translate(65, 145)">
    <!-- Book shadow -->
    <ellipse cx="25" cy="22" rx="22" ry="6" fill="#13151A" opacity="0.6"/>
    <!-- Cover -->
    <path d="M 5 15 L 45 5 L 50 15 L 10 25 Z" fill="#3B82F6"/>
    <!-- Pages -->
    <path d="M 7 17 L 47 7 L 47 11 L 7 21 Z" fill="#E2E8F0"/>
    <!-- Spine/Thickness -->
    <path d="M 5 15 L 10 25 L 10 28 L 5 18 Z" fill="#2563EB"/>
  </g>

  <!-- Returning Action: Second Book being placed/returned -->
  <g transform="translate(100, 90) rotate(-15)">
    <!-- Motion trails / returning indicator -->
    <path d="M -15 -5 C -25 5 -30 20 -25 35" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M -20 32 L -25 35 L -21 39" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    
    <!-- Active Book being returned -->
    <rect x="0" y="0" width="55" height="40" rx="4" fill="#EF4444" transform="rotate(10)" />
    <!-- Book spine -->
    <rect x="0" y="0" width="8" height="40" rx="2" fill="#B91C1C" transform="rotate(10)" />
    <!-- Page edges -->
    <path d="M 8 5 L 50 13 L 50 37 L 8 29 Z" fill="#F8FAFC" />
    <!-- Bookmark ribbon hanging out -->
    <path d="M 35 22 L 45 24 L 42 35 L 38 31 L 35 34 Z" fill="#F59E0B" />
  </g>

  <!-- Checkmark badge signifying successful return/completion -->
  <g transform="translate(145, 60)">
    <circle cx="16" cy="16" r="16" fill="#10B981" />
    <path d="M 9 16 L 13 20 L 23 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>