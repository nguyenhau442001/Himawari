<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character: Representing the active process of "Cognition/Realization" -->
  <!-- Head and Brain area focus -->
  <circle cx="120" cy="110" r="45" fill="#2C313C"/>
  
  <!-- Dynamic Action: Hand reaching to place a glowing "insight" piece -->
  <path d="M145 130 L170 100 L185 115 L160 145 Z" fill="#FFB84D"/>
  <path d="M155 120 L175 95" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The "Cognition" object: A puzzle piece being integrated into the mind -->
  <path d="M100 80 L140 80 L140 120 L100 120 Z" fill="#4D94FF"/>
  <circle cx="120" cy="100" r="10" fill="#1A1D24"/>
  
  <!-- Motion lines indicating the action of processing/realizing -->
  <path d="M90 70 Q120 50 150 70" stroke="#FFB84D" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M85 80 Q110 60 135 80" stroke="#FFB84D" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Supporting visual: Expanding field of vision/perspective -->
  <path d="M60 180 L180 180 L200 220 L40 220 Z" fill="#2C313C"/>
  <path d="M70 190 L170 190 M80 200 L160 200 M90 210 L150 210" stroke="#4D94FF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character shoulders -->
  <path d="M75 160 C75 150 165 150 165 160 L165 200 L75 200 Z" fill="#3E4451"/>
</svg>