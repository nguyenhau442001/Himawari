<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- House A (Left) -->
  <path d="M20 180 L80 180 L80 120 L50 90 L20 120 Z" fill="#334155" stroke="#fb923c" stroke-width="2"/>
  <rect x="35" y="140" width="20" height="40" fill="#fb923c"/>
  <circle cx="45" cy="160" r="2" fill="#0f172a"/>
  
  <!-- House B (Right) -->
  <path d="M160 180 L220 180 L220 120 L190 90 L160 120 Z" fill="#334155" stroke="#10b981" stroke-width="2"/>
  <rect x="175" y="140" width="20" height="40" fill="#10b981"/>
  <circle cx="185" cy="160" r="2" fill="#0f172a"/>

  <!-- Pathway -->
  <path d="M80 180 Q120 170 160 180" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Characters -->
  <!-- Family A (Left) -->
  <g transform="translate(60, 150)">
    <circle cx="0" cy="-10" r="8" fill="#f59e0b"/>
    <path d="M-5 0 L5 0 L2 20 L-2 20 Z" fill="#f59e0b"/>
  </g>
  
  <!-- Family B (Right) -->
  <g transform="translate(180, 150)">
    <circle cx="0" cy="-10" r="8" fill="#38bdf8"/>
    <path d="M-5 0 L5 0 L2 20 L-2 20 Z" fill="#38bdf8"/>
  </g>

  <!-- Interaction Elements (Gift/Food) -->
  <rect x="115" y="145" width="10" height="10" fill="#ec4899" rx="2"/>
  <path d="M120 145 L120 135" stroke="#ec4899" stroke-width="2"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="2" fill="#fbbf24"/>
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <path d="M100 60 L140 60" stroke="#475569" stroke-width="1" stroke-dasharray="2 4"/>
</svg>