<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow -->
  <circle cx="120" cy="110" r="70" fill="#FFB703" opacity="0.06"/>

  <!-- Motion lines showing the dynamic action of receiving/earning -->
  <path d="M75 75 C 90 60, 110 55, 130 65" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M165 75 C 150 60, 130 55, 110 65" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Golden Award Certificate / Scroll representing Scholarship (奖学金) -->
  <g transform="translate(85, 55)">
    <!-- Certificate Base -->
    <rect x="0" y="0" width="70" height="50" rx="4" fill="#21262D" stroke="#FFB703" stroke-width="2"/>
    <!-- Document Lines -->
    <line x1="12" y1="14" x2="45" y2="14" stroke="#8B949E" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="24" x2="58" y2="24" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="35" y2="32" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
    <!-- Gold Seal / Ribbon -->
    <circle cx="52" cy="35" r="8" fill="#FFB703"/>
    <path d="M48 41 L52 47 L56 41 Z" fill="#E69500"/>
  </g>

  <!-- Glowing Coins (Value/Grant aspect of 奖学金) -->
  <g transform="translate(0, 0)">
    <circle cx="65" cy="100" r="10" fill="#FFB703"/>
    <circle cx="65" cy="100" r="6" fill="#1A1D24"/>
    <text x="65" y="103" font-family="sans-serif" font-size="10" fill="#FFB703" text-anchor="middle" font-weight="bold">$</text>
  </g>
  <g transform="translate(0, 0)">
    <circle cx="175" cy="100" r="12" fill="#FFB703"/>
    <circle cx="175" cy="100" r="8" fill="#1A1D24"/>
    <text x="175" y="104" font-family="sans-serif" font-size="11" fill="#FFB703" text-anchor="middle" font-weight="bold">$</text>
  </g>

  <!-- Dynamic Human Character Action (Receiving / Holding up achievement) -->
  <g transform="translate(0, 10)">
    <!-- Body/Torso -->
    <path d="M90 170 C 90 145, 150 145, 150 170 L 155 210 L 85 210 Z" fill="#2F81F7"/>
    
    <!-- Neck -->
    <rect x="112" y="125" width="16" height="22" rx="6" fill="#F0B27A"/>

    <!-- Head with joyful expression -->
    <circle cx="120" cy="105" r="22" fill="#F0B27A"/>
    <!-- Hair -->
    <path d="M 98 105 C 98 85, 142 85, 142 105 C 142 95, 135 90, 120 90 C 105 90, 98 95, 98 105 Z" fill="#30363D"/>
    <!-- Smile -->
    <path d="M 113 115 Q 120 121 127 115" fill="none" stroke="#A04000" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (happy closed arcs) -->
    <path d="M 110 102 Q 114 98 118 102" fill="none" stroke="#A04000" stroke-width="2" stroke-linecap="round"/>
    <path d="M 122 102 Q 126 98 130 102" fill="none" stroke="#A04000" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms reaching up dynamically to receive/hold the scholarship -->
    <!-- Left Arm -->
    <path d="M 92 145 C 75 130, 65 110, 75 95" fill="none" stroke="#2F81F7" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Hand -->
    <circle cx="75" cy="95" r="6" fill="#F0B27A"/>

    <!-- Right Arm -->
    <path d="M 148 145 C 165 130, 175 110, 165 95" fill="none" stroke="#2F81F7" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Hand -->
    <circle cx="165" cy="95" r="6" fill="#F0B27A"/>
  </g>

</svg>