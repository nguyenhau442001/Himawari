<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Cellular Cross-Section / Organ Tissue Base -->
    <circle cx="0" cy="0" r="75" fill="#242B38" stroke="#323B4D" stroke-width="2"/>
    
    <!-- Healthy Tissue Cells (Background elements) -->
    <circle cx="-35" cy="-35" r="14" fill="#2A364F"/>
    <circle cx="38" cy="-28" r="12" fill="#2A364F"/>
    <circle cx="-25" cy="40" r="15" fill="#2A364F"/>
    <circle cx="30" cy="35" r="13" fill="#2A364F"/>
    
    <!-- Central Malignant Tumor Mass (Malignant / 恶性) -->
    <!-- Irregular aggressive growth shape -->
    <path d="M 0,-38 C 18,-42 35,-30 42,-12 C 52,2 48,22 34,36 C 20,50 -2,46 -18,44 C -34,42 -46,28 -44,10 C -42,-8 -22,-34 0,-38 Z" fill="#E65100" opacity="0.15"/>
    <path d="M 0,-28 C 12,-32 26,-22 31,-9 C 38,2 35,16 25,26 C 15,36 -2,33 -13,31 C -25,30 -33,20 -31,7 C -30,-6 -16,-24 0,-28 Z" fill="#FF6D00"/>
    
    <!-- Malignant Cell Nuclei (Aggressive, irregular, multi-lobed) -->
    <path d="M -8,-6 C -3,-8 5,-4 3,3 C 1,10 -7,8 -9,2 Z" fill="#B71C1C"/>
    <circle cx="12" cy="10" r="4" fill="#B71C1C"/>
    <circle cx="-3" cy="-14" r="3.5" fill="#B71C1C"/>
    <path d="M 7,-12 C 11,-15 15,-10 13,-6 C 11,-2 6,-3 7,-12 Z" fill="#B71C1C"/>

    <!-- Diagnostic Indicator / Magnifying Glass (Contextual Reference to Pathology) -->
    <g transform="translate(15, -15) rotate(25)">
      <!-- Magnifier Glass Circle -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FFB300" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="42" fill="#FFB300" opacity="0.05"/>
      <!-- Focus Crosshairs on Malignancy -->
      <line x1="-8" y1="0" x2="-3" y2="0" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="3" y1="0" x2="8" y2="0" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="-8" x2="0" y2="-3" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="3" x2="0" y2="8" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Magnifier Handle -->
      <rect x="-3.5" y="42" width="7" height="30" rx="3.5" fill="#FFB300"/>
    </g>
  </g>
</svg>