<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg_grad)"/>

  <!-- The "Pressure" Environment (Left Side) -->
  <g opacity="0.4">
    <rect x="20" y="160" width="80" height="40" rx="4" fill="#334155"/> <!-- Desk -->
    <rect x="30" y="120" width="25" height="35" rx="2" fill="#475569"/> <!-- Paper Stack 1 -->
    <rect x="35" y="110" width="25" height="35" rx="2" fill="#64748b"/> <!-- Paper Stack 2 -->
    <rect x="65" y="135" width="30" height="20" rx="2" fill="#475569"/> <!-- Laptop base -->
    <path d="M65 135 L95 135 L100 115 L70 115 Z" fill="#94a3b8"/> <!-- Laptop screen -->
  </g>

  <!-- Visual Metaphor of Weight Falling Away -->
  <path d="M110 140 Q100 145 90 160" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
  <rect x="85" y="165" width="12" height="12" rx="2" fill="#475569" transform="rotate(15 91 171)"/>
  <rect x="70" y="175" width="10" height="10" rx="2" fill="#334155" transform="rotate(-10 75 180)"/>

  <!-- The Character (Center-Right) -->
  <g transform="translate(120, 110)">
    <!-- Legs in motion -->
    <path d="M-5 60 L-15 90" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M5 60 L25 85" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Torso leaning forward -->
    <path d="M0 10 Q15 35 0 65" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Arms outstretched in relief -->
    <path d="M5 25 Q35 15 55 20" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-5 25 Q-35 5 -45 15" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Head tilted back -->
    <circle cx="15" cy="-5" r="14" fill="#fbbf24"/>
    <!-- Expressive face (simplified) -->
    <path d="M12 -8 Q15 -10 18 -8" stroke="#1e293b" stroke-width="1.5" fill="none"/> <!-- Eye -->
    <path d="M22 -6 Q25 -8 28 -6" stroke="#1e293b" stroke-width="1.5" fill="none"/> <!-- Eye -->
    <path d="M18 2 Q22 5 26 2" stroke="#1e293b" stroke-width="1.5" fill="none"/> <!-- Smile -->
  </g>

  <!-- Light/Freedom Elements (Right Side) -->
  <rect x="160" y="0" width="80" height="240" fill="url(#glow_grad)"/>
  
  <!-- Floating particles of relief -->
  <circle cx="190" cy="60" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="110" r="2" fill="#10b981" opacity="0.5"/>
  <circle cx="200" cy="160" r="4" fill="#38bdf8" opacity="0.4"/>
  <path d="M215 40 L225 50 M225 40 L215 50" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  
  <!-- Ground/Shadow -->
  <ellipse cx="130" cy="210" rx="60" ry="8" fill="#0f172a" opacity="0.5"/>
</svg>