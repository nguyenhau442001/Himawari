<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/pedestal to isolate the object clearly -->
  <ellipse cx="120" cy="180" rx="45" ry="12" fill="#252A34" opacity="0.6"/>

  <!-- Upper Garment (上衣) Illustration -->
  <g transform="translate(0, 5)">
    <!-- Main garment body -->
    <path d="M75 55 
             C85 50, 100 48, 120 48 
             C140 48, 155 50, 165 55 
             L190 85 
             L170 95 
             L165 80 
             L165 190 
             L75 190 
             L75 80 
             L70 95 
             L50 85 
             Z" 
          fill="#3B82F6"/>
    
    <!-- Collar (V-neck / Crew neck cutout) -->
    <path d="M95 48 
             C95 70, 145 70, 145 48 
             C135 48, 120 58, 120 58 
             C120 58, 105 48, 95 48 Z" 
          fill="#1A1D24"/>

    <!-- Inner collar rim accent -->
    <path d="M97 48 C105 65, 135 65, 143 48" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>

    <!-- Accent seam lines / modern styling details -->
    <path d="M75 80 L60 88" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M165 80 L180 88" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

    <!-- Center vertical fold/shadow line for depth -->
    <line x1="120" y1="58" x2="120" y2="190" stroke="#2563EB" stroke-width="2" opacity="0.4"/>

    <!-- Left sleeve hem -->
    <path d="M50 85 L70 95" stroke="#2563EB" stroke-width="2"/>
    <!-- Right sleeve hem -->
    <path d="M190 85 L170 95" stroke="#2563EB" stroke-width="2"/>

    <!-- Modern collar tag detail -->
    <rect x="114" y="48" width="12" height="6" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Focused highlight ring / badge accent (subtle modern UI framing) -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="6 6"/>
</svg>