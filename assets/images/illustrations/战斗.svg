<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative motion/energy lines indicating intensity -->
  <g opacity="0.25" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <line x1="35" y1="110" x2="65" y2="110" />
    <line x1="25" y1="135" x2="55" y2="135" />
    <line x1="45" y1="160" x2="70" y2="160" />
    <line x1="175" y1="80" x2="205" y2="80" />
    <line x1="185" y1="105" x2="215" y2="105" />
  </g>

  <!-- Ground plane / terrain -->
  <path d="M 20 190 L 220 190" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <polygon points="20,190 220,190 220,210 20,210" fill="#0F172A" opacity="0.8"/>

  <!-- Character 1: Defender/Fighter (Dynamic action pose, advancing forward) -->
  <g transform="translate(10, 0)">
    <!-- Dynamic motion trails behind character -->
    <path d="M 60 140 Q 80 140 100 135" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" opacity="0.6" stroke-linecap="round"/>
    
    <!-- Torso & Armor (Modern flat design styling, slate blue and orange accents) -->
    <path d="M 85 110 L 105 105 L 110 145 L 80 145 Z" fill="#3B82F6"/>
    <path d="M 90 105 L 105 105 L 100 130 L 90 130 Z" fill="#60A5FA"/>
    <circle cx="95" cy="120" r="4" fill="#F59E0B"/>

    <!-- Head & Helmet -->
    <circle cx="100" cy="85" r="13" fill="#94A3B8"/>
    <path d="M 88 83 C 92 72 108 72 112 83 L 112 88 L 88 88 Z" fill="#475569"/>
    <!-- Visor / Face guard -->
    <path d="M 93 85 L 109 85 L 107 90 L 95 90 Z" fill="#1E293B"/>

    <!-- Back Leg (Lunge) -->
    <path d="M 85 140 L 65 175 L 80 185" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Leg (Planted/Stretching) -->
    <path d="M 105 140 L 125 170 L 110 188" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Back Arm (Holding Shield/Guard) -->
    <path d="M 95 110 L 75 125 L 90 135" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Arm (Thrusting/Action interaction) -->
    <path d="M 105 110 L 135 115" fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>

    <!-- Action Weapon / Tool (Sleek modern staff/baton with glowing energy tip) -->
    <line x1="120" y1="117" x2="165" y2="120" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
    <!-- Motion effect on weapon tip -->
    <circle cx="165" cy="120" r="6" fill="#F59E0B"/>
    <path d="M 155 110 L 175 130 M 155 130 L 175 110" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Adversary / Target Silhouette (Representing the conflict/combat dynamic clearly) -->
  <g transform="translate(30, 0)">
    <!-- Impact shockwave lines -->
    <path d="M 150 110 L 160 100 M 155 125 L 170 125 M 150 140 L 160 150" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Opponent character reacting to the action -->
    <!-- Torso -->
    <path d="M 160 115 L 180 110 L 175 150 L 155 150 Z" fill="#64748B"/>
    <!-- Head -->
    <circle cx="168" cy="92" r="11" fill="#475569"/>
    <path d="M 158 90 L 178 90 L 175 95 L 161 95 Z" fill="#334155"/>
    
    <!-- Legs in defensive retreat -->
    <path d="M 160 148 L 145 178 L 160 188" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 170 148 L 185 175 L 170 185" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arms recoiling -->
    <path d="M 165 115 L 140 130" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M 175 115 L 190 100" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Foreground dynamic particle sparks emphasizing the action (Cause & Effect) -->
  <g fill="#F59E0B">
    <circle cx="150" cy="95" r="2.5" />
    <circle cx="145" cy="135" r="3" />
    <circle cx="138" cy="105" r="1.5" />
    <circle cx="162" cy="155" r="2" />
  </g>
</svg>