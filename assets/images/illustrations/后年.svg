<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Calendar Icon Base representing "Year after next" (后年) -->
  <!-- Subtle background glow/orbit indicating time progression -->
  <circle cx="120" cy="125" r="70" fill="none" stroke="#252B36" stroke-width="6"/>
  <path d="M 120 55 A 70 70 0 0 1 190 125" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Main Calendar Body -->
  <rect x="75" y="75" width="90" height="95" rx="12" fill="#222831" stroke="#3A4454" stroke-width="3"/>
  
  <!-- Calendar Header -->
  <path d="M 75 87 C 75 80.3726 80.3726 75 87 75 L 153 75 C 159.627 75 165 80.3726 165 87 L 165 105 L 75 105 Z" fill="#F5A623"/>
  
  <!-- Binding Rings -->
  <rect x="95" y="65" width="8" height="18" rx="4" fill="#3A4454"/>
  <rect x="137" y="65" width="8" height="18" rx="4" fill="#3A4454"/>
  
  <!-- Grid of Days (Past / Present / Future) -->
  <!-- Row 1 -->
  <circle cx="98" cy="125" r="5" fill="#3A4454"/>
  <circle cx="120" cy="125" r="5" fill="#3A4454"/>
  <!-- Target Year Highlight (Blinking / Glowing effect for Year After Next) -->
  <circle cx="142" cy="125" r="8" fill="#1A1D24"/>
  <circle cx="142" cy="125" r="6" fill="#F5A623"/>
  
  <!-- Row 2 -->
  <circle cx="98" cy="147" r="5" fill="#3A4454"/>
  <circle cx="120" cy="147" r="5" fill="#3A4454"/>
  <circle cx="142" cy="147" r="5" fill="#3A4454"/>

  <!-- Forward Arrow Indicators emphasizing "Two years ahead" -->
  <path d="M 175 115 L 195 125 L 175 135" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 160 115 L 180 125 L 160 135" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
</svg>