<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Department Store Building / Display Concept -->
  <g transform="translate(40, 30)">
    <!-- Main Store Building Base -->
    <rect x="20" y="30" width="120" height="150" rx="6" fill="#252A34" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Store Front Awning -->
    <path d="M10 30 L150 30 L140 15 L20 15 Z" fill="#F39C12"/>
    <path d="M10 30 Q30 40 50 30 Q70 40 90 30 Q110 40 130 30 Q150 40 150 30" fill="#E67E22"/>

    <!-- Glass Display Windows / Shelves Grid representing "Variety of Goods" (百货) -->
    <!-- Row 1: Clothing/Apparel -->
    <rect x="32" y="45" width="28" height="35" rx="3" fill="#1E222B" stroke="#343D4E" stroke-width="1.5"/>
    <path d="M42 55 L46 52 L50 55 L48 55 L48 70 L44 70 L44 55 Z" fill="#3498DB"/>

    <!-- Row 1: Household Electronics -->
    <rect x="70" y="45" width="28" height="35" rx="3" fill="#1E222B" stroke="#343D4E" stroke-width="1.5"/>
    <rect x="77" y="55" width="14" height="10" rx="1" fill="#F1C40F"/>
    <circle x="84" y="68" r="2" fill="#E74C3C"/>

    <!-- Row 1: Cosmetics / Perfume -->
    <rect x="108" y="45" width="28" height="35" rx="3" fill="#1E222B" stroke="#343D4E" stroke-width="1.5"/>
    <path d="M118 62 L122 62 L122 70 L118 70 Z" fill="#9B59B6"/>
    <path d="M119 55 L121 55 L122 62 L118 62 Z" fill="#BDC3C7"/>

    <!-- Row 2: Shoes & Accessories -->
    <rect x="32" y="90" width="28" height="35" rx="3" fill="#1E222B" stroke="#343D4E" stroke-width="1.5"/>
    <path d="M38 108 Q44 100 52 108 L52 114 L38 114 Z" fill="#E67E22"/>

    <!-- Row 2: Kitchenware / Teapot -->
    <rect x="70" y="90" width="28" height="35" rx="3" fill="#1E222B" stroke="#343D4E" stroke-width="1.5"/>
    <circle cx="84" cy="107" r="8" fill="#1ABC9C"/>
    <path d="M78 105 L74 102" stroke="#1ABC9C" stroke-width="2" stroke-linecap="round"/>

    <!-- Row 2: Toys / Gift Box -->
    <rect x="108" y="90" width="28" height="35" rx="3" fill="#1E222B" stroke="#343D4E" stroke-width="1.5"/>
    <rect x="115" y="102" width="14" height="14" rx="1" fill="#E74C3C"/>
    <rect x="120" y="102" width="4" height="14" fill="#F1C40F"/>

    <!-- Entrance Double Doors -->
    <rect x="68" y="145" width="24" height="35" rx="2" fill="#1E222B" stroke="#3A4252" stroke-width="1.5"/>
    <line x1="80" y1="145" x2="80" y2="180" stroke="#3A4252" stroke-width="1.5"/>

    <!-- Store Signage Graphic (Shopping Bag Icon instead of text) -->
    <rect x="65" y="5" width="30" height="8" rx="2" fill="#F39C12"/>
    <path d="M74 5 C74 2 86 2 86 5" fill="none" stroke="#1A1D24" stroke-width="1.5"/>
  </g>

  <!-- Shopping / Retail Accents -->
  <!-- Floating Price Tag Accent -->
  <g transform="translate(175, 45)">
    <path d="M0 15 L15 0 L35 0 L35 20 L20 35 L0 15 Z" fill="#E74C3C"/>
    <circle cx="26" cy="9" r="3" fill="#1A1D24"/>
  </g>

  <!-- Shopping Bag Icon on the left -->
  <g transform="translate(18, 90)">
    <rect x="2" y="10" width="24" height="28" rx="3" fill="#3498DB"/>
    <path d="M8 10 C8 3 20 3 20 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Star badge on bag -->
    <path d="M14 18 L16 22 L20 22 L17 25 L18 29 L14 27 L10 29 L11 25 L8 22 L12 22 Z" fill="#F1C40F" transform="scale(0.5) translate(10, 18)"/>
  </g>
</svg>