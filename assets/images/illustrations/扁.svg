<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#334155"/>
  
  <!-- The Flat Box (Subject) -->
  <rect x="80" y="145" width="80" height="15" rx="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <rect x="85" y="148" width="70" height="9" rx="1" fill="#fcd34d"/>
  
  <!-- Character: Person pointing/explaining -->
  <g transform="translate(40, 60)">
    <!-- Body -->
    <path d="M40 120 L80 120 L75 160 L45 160 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="60" cy="90" r="20" fill="#fde68a"/>
    <!-- Eye -->
    <circle cx="68" cy="85" r="2" fill="#0f172a"/>
    <!-- Arm pointing -->
    <path d="M75 110 L100 95" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="105" cy="92" r="4" fill="#fde68a"/>
  </g>

  <!-- Secondary Character: Looking at box -->
  <g transform="translate(120, 70)">
    <!-- Body -->
    <path d="M40 110 L80 110 L75 150 L45 150 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="60" cy="80" r="20" fill="#fde68a"/>
    <!-- Eye -->
    <circle cx="52" cy="75" r="2" fill="#0f172a"/>
    <!-- Hair -->
    <path d="M45 65 Q60 55 75 65" fill="#fb923c"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="30" cy="50" r="2" fill="#fb923c" opacity="0.6"/>
  <path d="M180 100 L190 110 M190 100 L180 110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>