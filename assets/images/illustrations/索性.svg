<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow to enhance sleek modern flat look -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.6"/>
  <circle cx="120" cy="120" r="50" fill="#2A3142" opacity="0.4"/>

  <!-- Iconographic Object representing "Thẳng luôn, dứt khoát luôn" (A bold, decisive slash mark breaking a barrier / cutting through cleanly) -->
  <g transform="translate(120, 120)">
    <!-- Outer accent ring representing the decisive moment/action -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#343B4D" stroke-width="3" stroke-dasharray="8 6"/>
    
    <!-- Central Target / Foundation Node -->
    <circle cx="0" cy="0" r="42" fill="#1E2330" stroke="#3A445C" stroke-width="2"/>
    
    <!-- Decisive Slash / Arrow (Direct, Unwavering, "Suoxing") -->
    <!-- Shadow effect for depth -->
    <path d="M-30 20 L25 -35 L15 -45 L-40 10 Z" fill="#000" opacity="0.3"/>
    
    <!-- Main Blade / Path representing "Straight to the point / Dứt khoát" -->
    <path d="M-34 24 L28 -38" stroke="#FF9F43" stroke-width="12" stroke-linecap="round"/>
    
    <!-- High-contrast crisp inner core line -->
    <path d="M-30 20 L22 -32" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Sharp striking points / Impact spark to emphasize "Thẳng luôn" -->
    <path d="M 28 -38 L 38 -42 L 34 -32 Z" fill="#FF9F43"/>
    <circle cx="32" cy="-38" r="3" fill="#FFF"/>
  </g>
</svg>