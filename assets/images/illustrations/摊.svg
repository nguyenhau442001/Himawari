<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle elements (street ground) -->
  <path d="M30 185H210" stroke="#2A2F3D" stroke-width="3" stroke-linecap="round"/>

  <!-- Street Stall (摊) Illustration -->
  <g transform="translate(0, 5)">
    <!-- Awning / Canopy -->
    <path d="M60 80L80 50H160L180 80Z" fill="#F97316"/>
    <path d="M60 80H180V90C180 95 175 100 170 100H70C65 100 60 95 60 90V80Z" fill="#EA580C"/>
    <!-- Awning Scallops / Stripes -->
    <path d="M60 90C65 95 70 95 75 90C80 85 85 85 90 90C95 95 100 95 105 90C110 85 115 85 120 90C125 95 130 95 135 90C140 85 145 85 150 90C155 95 160 95 165 90C170 85 175 85 180 90" stroke="#FFF" stroke-width="2" fill="none" opacity="0.3"/>
    
    <!-- Support Poles -->
    <rect x="75" y="100" width="6" height="85" fill="#64748B"/>
    <rect x="159" y="100" width="6" height="85" fill="#64748B"/>

    <!-- Counter / Table Structure -->
    <rect x="50" y="115" width="140" height="12" rx="3" fill="#3B82F6"/>
    <rect x="55" y="127" width="130" height="58" fill="#1E293B"/>
    <!-- Wooden texture detail for counter -->
    <line x1="75" y1="127" x2="75" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="127" x2="120" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="165" y1="127" x2="165" y2="185" stroke="#334155" stroke-width="2"/>

    <!-- Displayed Goods (Items on the stall) -->
    <!-- Item 1: Bowl/Pot (e.g., street food) -->
    <ellipse cx="85" cy="115" rx="14" ry="4" fill="#94A3B8"/>
    <path d="M71 115C71 123 99 123 99 115Z" fill="#E2E8F0"/>
    <path d="M80 107C82 104 88 104 90 107" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Item 2: Box / Container -->
    <rect x="105" y="105" width="22" height="10" rx="2" fill="#10B981"/>
    <rect x="132" y="103" width="18" height="12" rx="2" fill="#FACC15"/>

    <!-- Hanging Lantern / Light (Atmospheric) -->
    <path d="M120 50V35" stroke="#64748B" stroke-width="2"/>
    <circle cx="120" cy="33" r="10" fill="#FACC15"/>
    <path d="M115 30H125V36H115Z" fill="#CA8A04"/>
  </g>

  <!-- Focus / Accent glow ring underneath -->
  <ellipse cx="120" cy="188" rx="80" ry="6" fill="#F97316" opacity="0.15"/>
</svg>