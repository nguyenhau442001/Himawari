<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Glow/Atmosphere background elements representing the symphony/music -->
    <path d="M-60 -30 C-30 -70, 30 -70, 60 -30" stroke="#3A4454" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.5"/>
    <path d="M-80 -10 C-40 -90, 40 -90, 80 -10" stroke="#3A4454" stroke-width="2" fill="none" opacity="0.3"/>

    <!-- Flowing Music Staff Lines -->
    <path d="M-70 -20 C-35 -25, 35 -15, 70 -20" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-70 -10 C-35 -15, 35 -5, 70 -10" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-70 0 C-35 -5, 35 5, 70 0" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-70 10 C-35 5, 35 15, 70 10" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-70 20 C-35 15, 35 25, 70 20" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Elegant Musical Notes (representing "乐曲" - piece of music) -->
    <!-- Note 1 -->
    <circle cx="-45" cy="5" r="7" fill="#F6AD55"/>
    <path d="M-38 5 L-38 -30" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <path d="M-38 -30 C-28 -28, -25 -20, -22 -15" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Note 2 (Beamed pair) -->
    <circle cx="-5" cy="-5" r="6" fill="#F6AD55"/>
    <path d="M1 -5 L1 -35" stroke="#F6AD55" stroke-width="3.5" stroke-linecap="round"/>
    
    <circle cx="20" cy="2" r="6" fill="#F6AD55"/>
    <path d="M26 2 L26 -28" stroke="#F6AD55" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Beam -->
    <path d="M0 -34 L27 -27 L27 -23 L0 -30 Z" fill="#F6AD55"/>

    <!-- High Note / Floating element -->
    <circle cx="50" cy="-25" r="5" fill="#ED8936"/>
    <path d="M55 -25 L55 -50" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    <path d="M55 -50 C62 -48, 65 -40, 68 -35" stroke="#ED8936" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Dynamic Accents representing "震撼人心" (moving/impactful music) -->
    <path d="M-85 -45 L-75 -35" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M75 -40 L85 -50" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M80 25 L92 32" stroke="#ED8936" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>