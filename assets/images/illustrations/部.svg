<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "部" (Department / Division / Film Reel unit) -->
  <!-- Centered iconic physical object representing a structural division/department and film unit -->
  <g transform="translate(0, 0)">
    <!-- Ambient Glow / Background structure -->
    <circle cx="120" cy="120" r="70" fill="#242933" opacity="0.8"/>
    
    <!-- Outer Organization Grid / Department Hub Framework -->
    <rect x="75" y="70" width="90" height="100" rx="12" fill="#2D333D" stroke="#3E4756" stroke-width="3"/>
    
    <!-- Top Header bar representing head department -->
    <path d="M 75 82 C 75 75.3726 80.3726 70 87 70 L 153 70 C 159.627 70 165 75.3726 165 82 L 165 96 L 75 96 Z" fill="#F59E0B"/>
    <circle cx="89" cy="83" r="3" fill="#1A1D24"/>
    <circle cx="101" cy="83" r="3" fill="#1A1D24"/>
    
    <!-- Sub-divisions (Sub-departments / Bộ phận) -->
    <!-- Division 1 -->
    <rect x="87" y="108" width="66" height="22" rx="6" fill="#3B82F6" opacity="0.8"/>
    <circle cx="100" cy="119" r="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="112" y="116" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Division 2 -->
    <rect x="87" y="136" width="66" height="22" rx="6" fill="#10B981" opacity="0.8"/>
    <circle cx="100" cy="147" r="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="112" y="144" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>

    <!-- Central Focus Accent: Film Strip / Reel (representing "bộ phim") integrated into the structural unit -->
    <g transform="translate(120, 115) scale(0.85)">
      <!-- Cinematic highlight badge floating above the structural grid -->
      <circle cx="0" cy="-65" r="28" fill="#1A1D24" stroke="#F59E0B" stroke-width="4"/>
      <!-- Film reel icon inside -->
      <circle cx="0" cy="-65" r="12" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <path d="M -8 -73 L 8 -57 M -8 -57 L 8 -73" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-65" r="3" fill="#F59E0B"/>
    </g>

    <!-- Connection nodes representing compartmentalization -->
    <line x1="120" y1="96" x2="120" y2="108" stroke="#4B5563" stroke-width="3" stroke-dasharray="2 2"/>
    <line x1="120" y1="130" x2="120" y2="136" stroke="#4B5563" stroke-width="3" stroke-dasharray="2 2"/>
  </g>
</svg>