<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow Gradient for Medicine/Effect -->
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Shelf Shadows -->
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment: Cozy Living Room / Home Pharmacy Setting -->
  <!-- Wallpaper / Wall lines -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="2" opacity="0.4"/>
  <rect x="0" y="160" width="240" height="80" fill="#090d16" opacity="0.5"/>

  <!-- Shelf in Background with bottles -->
  <rect x="140" y="80" width="70" height="6" rx="3" fill="url(#shelfGrad)" />
  <!-- Small background bottles -->
  <rect x="150" y="58" width="12" height="22" rx="4" fill="#38bdf8" opacity="0.6"/>
  <rect x="168" y="52" width="16" height="28" rx="4" fill="#f43f5e" opacity="0.6"/>
  <rect x="190" y="62" width="10" height="18" rx="3" fill="#10b981" opacity="0.6"/>

  <!-- Window with night city view / warm home light -->
  <path d="M25 40 Q25 25 40 25 L85 25 Q100 25 100 40 L100 130 L25 130 Z" fill="#0b1329" stroke="#334155" stroke-width="3"/>
  <!-- Window panes -->
  <line x1="62" y1="25" x2="62" y2="130" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="77" x2="100" y2="77" stroke="#334155" stroke-width="2"/>
  <!-- Cozy plant outside/inside window sill -->
  <path d="M35 130 Q35 110 48 115 Q60 110 60 130 Z" fill="#10b981" opacity="0.8"/>
  <rect x="20" y="128" width="55" height="6" rx="3" fill="#64748b"/>

  <!-- Magical efficacy glowing aura behind the main medicine bottle -->
  <circle cx="115" cy="115" r="50" fill="url(#glowEffect)" />

  <!-- Floating Sparkles / Efficacy Indicators -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 85 85 Q 85 92 78 92 Q 85 92 85 99 Q 85 92 92 92 Q 85 92 85 85 Z" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M 145 75 Q 145 81 139 81 Q 145 81 145 87 Q 145 81 151 81 Q 145 81 145 75 Z" opacity="0.7"/>
    <!-- Star 3 -->
    <path d="M 130 140 Q 130 146 124 146 Q 130 146 130 152 Q 130 146 136 146 Q 130 146 130 140 Z" opacity="0.8"/>
  </g>

  <!-- Small floating energy bubbles -->
  <circle cx="95" cy="110" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="138" cy="105" r="3" fill="#10b981" opacity="0.9"/>
  <circle cx="125" cy="80" r="2.5" fill="#fb923c" opacity="0.9"/>

  <!-- MAIN CHARACTER: Happy woman holding a medicine bottle, showing great satisfaction/health -->
  <!-- Body / Torso -->
  <path d="M 50 200 C 50 170 70 160 90 160 C 110 160 130 170 130 200 Z" fill="#38bdf8" />
  <!-- Collar -->
  <path d="M 75 160 L 90 175 L 105 160 Z" fill="#f8fafc" />

  <!-- Neck -->
  <rect x="80" y="142" width="20" height="25" rx="8" fill="#fcd34d" />

  <!-- Head -->
  <circle cx="90" cy="120" r="26" fill="#fcd34d" />

  <!-- Hair (Stylish Bob Cut, Dark Slate) -->
  <path d="M 64 115 C 62 90 118 90 116 115 C 118 135 120 150 116 150 C 112 150 108 130 108 130 L 100 145 L 80 145 L 72 130 C 72 130 68 150 64 150 C 60 150 62 135 64 115 Z" fill="#0f172a" />
  <!-- Bangs -->
  <path d="M 68 112 Q 90 122 112 112 Q 105 102 90 105 Q 75 102 68 112 Z" fill="#0f172a" />

  <!-- Face Expression (Happy, Eyes Closed in delight ^_^, Smiling mouth) -->
  <path d="M 78 118 Q 82 114 86 118" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 94 118 Q 98 114 102 118" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="76" cy="123" r="4" fill="#f43f5e" opacity="0.4"/>
  <circle cx="104" cy="123" r="4" fill="#f43f5e" opacity="0.4"/>
  <!-- Smile -->
  <path d="M 85 126 Q 90 132 95 126" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Left Arm (Holding up the medicine bottle proudly) -->
  <path d="M 65 170 Q 75 135 100 135" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <!-- Left Hand -->
  <circle cx="103" cy="133" r="7" fill="#fcd34d" />

  <!-- Right Arm (Bent happily on hip or relaxed) -->
  <path d="M 115 170 C 125 180 120 195 110 205" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <circle cx="110" cy="207" r="6" fill="#fcd34d" />

  <!-- FOREGROUND HERO PROP: The Medicine Bottle (Clear symbol of "药" and "功效") -->
  <!-- Floating/held prominently in front -->
  <!-- Bottle Shadow/Glow -->
  <circle cx="115" cy="125" r="22" fill="url(#sparkleGlow)" />

  <!-- Bottle Body (Glass style cyan/emerald gradient) -->
  <rect x="104" y="105" width="22" height="34" rx="6" fill="#10b981" opacity="0.9" stroke="#6ee7b7" stroke-width="2"/>
  <!-- Bottle Neck -->
  <rect x="110" y="97" width="10" height="9" rx="2" fill="#047857" />
  <!-- Bottle Cap -->
  <rect x="108" y="92" width="14" height="6" rx="3" fill="#fbbf24" />

  <!-- Label on Bottle (Abstract cross symbol representing medical/health efficacy) -->
  <rect x="108" y="112" width="14" height="18" rx="3" fill="#f8fafc" />
  <path d="M 115 116 L 115 126 M 110 121 L 120 121" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Table / Counter surface at the bottom -->
  <rect x="0" y="215" width="240" height="25" fill="#334155" />
  <rect x="0" y="210" width="240" height="6" fill="#475569" />

  <!-- Props on Counter: Glass of water & Spoon (context for taking medicine) -->
  <!-- Glass Cup -->
  <path d="M 155 185 L 163 210 L 187 210 L 195 185 Z" fill="#e2e8f0" opacity="0.3" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
  <!-- Water inside cup -->
  <path d="M 158 193 L 163 208 L 187 208 L 192 193 Z" fill="#38bdf8" opacity="0.6"/>
  <!-- Water surface ellipse -->
  <ellipse cx="175" cy="193" rx="17" ry="4" fill="#7dd3fc" opacity="0.7"/>

  <!-- Medicine Box opened on table -->
  <path d="M 30 200 L 50 190 L 70 200 L 50 210 Z" fill="#047857" />
  <path d="M 30 200 L 30 215 L 50 225 L 50 210 Z" fill="#065f46" />
  <path d="M 70 200 L 70 215 L 50 225 L 50 210 Z" fill="#059669" />
  <!-- Box flap open -->
  <path d="M 30 200 L 40 185 L 50 190 Z" fill="#10b981" />

</svg>