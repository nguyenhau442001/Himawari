<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- UI Screen Glow -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Hologram/Guideline Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Environment: High-Tech Control Room / Laboratory -->
  <!-- Wall Panels & Windows -->
  <path d="M20 20 H220 V170 H20 Z" fill="#1e293b" />
  <line x1="80" y1="20" x2="80" y2="130" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="160" y1="20" x2="160" y2="130" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Ambient Wall Screens (Context Props) -->
  <rect x="35" y="35" width="45" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <path d="M42 45 L50 55 L65 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="160" y="35" width="45" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="182" cy="50" r="8" fill="none" stroke="#f59e0b" stroke-width="2" />
  <path d="M182 42 V50 H188" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- Main Industrial Control Console Desk -->
  <path d="M20 170 H220 V210 H20 Z" fill="#334155" />
  <path d="M10 160 H230 V174 H10 Z" fill="#475569" filter="url(#soft-shadow)" />
  
  <!-- Console Control Elements (Buttons, Dials, Sliders) -->
  <circle cx="45" cy="167" r="4" fill="#ef4444" />
  <circle cx="60" cy="167" r="4" fill="#10b981" />
  <rect x="80" y="164" width="20" height="6" rx="3" fill="#64748b" />
  <rect x="190" y="164" width="20" height="6" rx="3" fill="#64748b" />
  <!-- Main Operational Lever/Joystick -->
  <circle cx="140" cy="167" r="7" fill="#64748b" />
  <path d="M140 167 L148 153" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <circle cx="149" cy="151" r="4" fill="#f59e0b" />

  <!-- Holographic Standard/Guideline Overlay (Representing 'Guifan' / Standard Operating Procedure) -->
  <g filter="url(#soft-shadow)">
    <!-- Hologram Screen Frame -->
    <rect x="70" y="70" width="100" height="65" rx="6" fill="url(#screen-glow)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 3" />
    
    <!-- Precision Alignment Crosshairs & Correct Posture Graphic inside Hologram -->
    <path d="M120 75 V130" stroke="url(#holo-grad)" stroke-width="1" />
    <path d="M75 102 H165" stroke="url(#holo-grad)" stroke-width="1" />
    
    <!-- Checkmark icon inside hologram symbolizing correct standard -->
    <circle cx="120" cy="102" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M112 103 L118 109 L128 95" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Character: Professional Technician / Operator -->
  <!-- Body / Lab Coat / Uniform -->
  <path d="M90 220 C90 195 105 180 120 180 C135 180 150 195 150 220 Z" fill="#e2e8f0" />
  <!-- Collar & Necktie / Details -->
  <path d="M110 180 L120 195 L130 180" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <path d="M120 195 V220" stroke="#cbd5e1" stroke-width="2" />
  <path d="M115 187 L125 187" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />

  <!-- Character Neck & Head -->
  <path d="M112 180 H128 V185 H112 Z" fill="#fcd34d" />
  <circle cx="120" cy="155" r="20" fill="#fcd34d" />

  <!-- Hair -->
  <path d="M100 150 C100 135 110 132 120 132 C130 132 140 135 140 150 C140 155 138 152 135 145 C130 138 125 138 120 138 C115 138 110 138 105 145 C102 152 100 155 100 150 Z" fill="#334155" />

  <!-- Focused Facial Expression / Safety Glasses -->
  <rect x="110" y="148" width="20" height="9" rx="2" fill="#0f172a" fill-opacity="0.3" stroke="#0f172a" stroke-width="1.5" />
  <path d="M105 150 L110 152" stroke="#0f172a" stroke-width="1.5" />
  <path d="M135 150 L130 152" stroke="#0f172a" stroke-width="1.5" />
  <path d="M116 163 C118 166 122 166 124 163" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- Active Hands Performing Precision Operation (Matching Action: "Operate according to standard") -->
  <!-- Left Arm & Hand reaching control panel -->
  <path d="M95 190 Q85 175 100 165" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
  <circle cx="103" cy="163" r="5" fill="#fcd34d" />

  <!-- Right Arm & Hand actively interacting with the holographic interface / console -->
  <path d="M145 190 Q155 170 140 155" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
  <circle cx="137" cy="153" r="5" fill="#fcd34d" />

  <!-- Foreground Atmospheric Highlights & Floating Operation Particles -->
  <circle cx="85" cy="120" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="155" cy="115" r="2" fill="#10b981" opacity="0.8" />
  <circle cx="100" cy="85" r="1" fill="#38bdf8" opacity="0.5" />
  <circle cx="140" cy="80" r="1.5" fill="#f59e0b" opacity="0.7" />

  <!-- Professional Desk Edge Light Refraction -->
  <path d="M10 160 H230" stroke="#64748b" stroke-width="1" opacity="0.5" />
</svg>