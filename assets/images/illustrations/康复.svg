<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambience -->
  <circle cx="120" cy="120" r="70" fill="#2E384D" opacity="0.3"/>

  <!-- Central Physical Object: Medical Support & Recovery Symbol -->
  <!-- Crutches / Mobility support transforming into a growing plant/leaf to symbolize restoration of health -->
  
  <g transform="translate(0, 5)">
    <!-- Medical Cross / Shield Base -->
    <path d="M120 40 L160 65 L160 115 C160 145 140 170 120 185 C100 170 80 145 80 115 L80 65 Z" fill="#242C3D" stroke="#3B475E" stroke-width="2"/>
    
    <!-- Subtle Inner Shield Highlight -->
    <path d="M120 48 L152 70 L152 113 C152 138 135 159 120 172 C105 159 88 138 88 113 L88 70 Z" fill="#1E2533"/>

    <!-- Supporting Hands (Care and Recovery) -->
    <!-- Left Hand -->
    <path d="M75 145 C75 135 85 130 95 135 C100 137 103 142 105 148" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Hand -->
    <path d="M165 145 C165 135 155 130 145 135 C140 137 137 142 135 148" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <!-- Dynamic Rejuvenation / Growth Motif (Sprout / Health) -->
    <!-- Stem -->
    <path d="M120 160 Q120 120 120 90" fill="none" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Leaves representing renewal/recovery -->
    <path d="M120 115 C100 115 90 95 105 85 C115 78 120 95 120 115 Z" fill="#22C55E"/>
    <path d="M120 95 C140 95 150 75 135 65 C125 58 120 75 120 95 Z" fill="#4ADE80"/>

    <!-- Sparkles of vitality/healing (Geometric stars, no random dots) -->
    <!-- Top Right Sparkle -->
    <path d="M160 70 L162 78 L170 80 L162 82 L160 90 L158 82 L150 80 L158 78 Z" fill="#FACC15"/>
    <!-- Top Left Sparkle -->
    <path d="M80 85 L81.5 90.5 L87 92 L81.5 93.5 L80 99 L78.5 93.5 L73 92 L78.5 90.5 Z" fill="#FACC15" transform="scale(0.8) translate(20, -10)"/>
  </g>

  <!-- Accent frame elements -->
  <circle cx="120" cy="120" r="96" fill="none" stroke="#2E384D" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
</svg>