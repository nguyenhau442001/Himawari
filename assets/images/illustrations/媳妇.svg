<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 40)">
    <!-- Elder figure (Parent-in-law) -->
    <g transform="translate(0, 40)">
      <circle cx="30" cy="30" r="20" fill="#FFB347"/>
      <path d="M15 60 Q30 80 45 60" stroke="#FFB347" stroke-width="4" fill="none"/>
      <rect x="10" y="80" width="40" height="60" rx="5" fill="#4A90E2"/>
    </g>
    <!-- Younger figure (Daughter-in-law) -->
    <g transform="translate(70, 20)">
      <circle cx="30" cy="30" r="25" fill="#FFD700"/>
      <path d="M15 60 Q30 85 45 60" stroke="#FFD700" stroke-width="5" fill="none"/>
      <rect x="5" y="80" width="50" height="80" rx="8" fill="#FFD700"/>
      <path d="M20 160 L20 200 M40 160 L40 200" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- Connection/Interaction -->
    <path d="M55 70 L75 70" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 4"/>
  </g>
</svg>