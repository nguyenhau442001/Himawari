<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Outer Bound / Frame representing "The Limit" (限于) -->
  <rect x="52" y="44" width="136" height="152" rx="8" fill="none" stroke="#3A4150" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Document / Article representational object inside the boundary -->
  <g transform="translate(68, 60)">
    <!-- Document background -->
    <rect x="0" y="0" width="104" height="120" rx="6" fill="#252A34"/>
    
    <!-- Document Header bar -->
    <rect x="16" y="16" width="72" height="10" rx="3" fill="#E5A93B"/>

    <!-- Document body lines (Simulating text space constrained by boundary) -->
    <rect x="16" y="38" width="60" height="6" rx="2" fill="#4E5668"/>
    <rect x="16" y="52" width="72" height="6" rx="2" fill="#4E5668"/>
    <rect x="16" y="66" width="50" height="6" rx="2" fill="#4E5668"/>
    <rect x="16" y="80" width="65" height="6" rx="2" fill="#4E5668"/>
    <rect x="16" y="94" width="40" height="6" rx="2" fill="#4E5668"/>
  </g>

  <!-- Physical boundary indicator corners (Brackets emphasizing strict limit) -->
  <path d="M 46 64 L 46 48 L 62 48" fill="none" stroke="#E5A93B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 194 64 L 194 48 L 178 48" fill="none" stroke="#E5A93B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 46 176 L 46 192 L 62 192" fill="none" stroke="#E5A93B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 194 176 L 194 192 L 178 192" fill="none" stroke="#E5A93B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>