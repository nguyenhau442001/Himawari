<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping paths -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Stage / Event Ambient Light -->
    <radialGradient id="stageGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Beam Light -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#stageGlow)"/>

  <!-- Architectural Background / Event Venue -->
  <!-- Large arched window / modern event hall backdrop -->
  <path d="M40 90 L40 200 L200 200 L200 90 A 80 80 0 0 0 40 90 Z" fill="#1b263b" opacity="0.6"/>
  <path d="M50 100 L50 190 L190 190 L190 100 A 70 70 0 0 0 50 100 Z" fill="#111827" opacity="0.7"/>

  <!-- Window Panes & Ambient Lights -->
  <line x1="120" y1="30" x2="120" y2="190" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="130" x2="190" y2="130" stroke="#334155" stroke-width="1.5" opacity="0.4"/>

  <!-- Stage Spotlight Beams -->
  <polygon points="120,0 60,200 90,200" fill="url(#beam)"/>
  <polygon points="120,0 150,200 180,200" fill="url(#beam)"/>

  <!-- Conference / Event Stage Floor -->
  <polygon points="10,200 230,200 240,240 0,240" fill="#0b0f19"/>
  <ellipse cx="120" cy="205" rx="100" ry="12" fill="#1e293b" opacity="0.5"/>

  <!-- Podium / Lectern -->
  <path d="M100 160 L140 160 L145 205 L95 205 Z" fill="#334155"/>
  <path d="M96 160 L144 160 L148 168 L92 168 Z" fill="#475569"/>
  <!-- Microphone on Podium -->
  <path d="M120 160 L120 148" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="145" r="3" fill="#cbd5e1"/>

  <!-- Characters representing "社会人士" (Respectable Professionals / Society Figures) -->
  
  <!-- Character 1: Professional / Executive (Left) -->
  <g transform="translate(45, 125)">
    <!-- Body / Suit -->
    <path d="M12 45 L28 45 L35 80 L5 80 Z" fill="#0ea5e9"/>
    <path d="M15 45 L25 45 L28 75 L12 75 Z" fill="#f8fafc"/> <!-- Shirt & Tie -->
    <polygon points="20,50 17,65 23,65" fill="#ef4444"/> <!-- Red Tie -->
    
    <!-- Head & Hair -->
    <circle cx="20" cy="24" r="13" fill="#fbcfe8"/>
    <path d="M8 22 C8 12, 32 12, 32 22 C32 26, 28 27, 20 27 C12 27, 8 26, 8 22 Z" fill="#334155"/>
    
    <!-- Glasses & Smile -->
    <rect x="13" y="20" rx="2" width="6" height="4" fill="none" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="21" y="20" rx="2" width="6" height="4" fill="none" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="19" y1="22" x2="21" y2="22" stroke="#0f172a" stroke-width="1.2"/>
    <path d="M17 31 Q20 34 23 31" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Gesturing Hand (Participating / Applauding) -->
    <circle cx="34" cy="55" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Character 2: Speaker / Distinguished Guest (Center, behind podium) -->
  <g transform="translate(95, 100)">
    <!-- Body / Formal Blazer -->
    <path d="M15 45 L35 45 L45 95 L5 95 Z" fill="#1e3a8a"/>
    <path d="M18 45 L32 45 L35 80 L15 80 Z" fill="#1e293b"/>
    <path d="M22 45 L28 45 L26 70 L24 70 Z" fill="#fbbf24"/> <!-- Gold Lapel Pin / Tie -->

    <!-- Head & Hair -->
    <circle cx="25" cy="22" r="14" fill="#fed7aa"/>
    <path d="M12 20 C12 8, 38 8, 38 20 C38 23, 33 22, 25 22 C17 22, 12 23, 12 20 Z" fill="#451a03"/>
    
    <!-- Facial Features (Confident & Welcoming) -->
    <circle cx="20" cy="20" r="1.5" fill="#1f2937"/>
    <circle cx="30" cy="20" r="1.5" fill="#1f2937"/>
    <path d="M21 28 Q25 32 29 28" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Raised Hand Waving / Presenting -->
    <path d="M38 45 Q48 35 44 25" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <circle cx="44" cy="23" r="4" fill="#fed7aa"/>
  </g>

  <!-- Character 3: Academic / Expert Figure (Right) -->
  <g transform="translate(155, 120)">
    <!-- Body / Cardigan & Shirt -->
    <path d="M10 50 L40 50 L48 90 L2 90 Z" fill="#10b981"/>
    <path d="M16 50 L34 50 L30 85 L20 85 Z" fill="#f8fafc"/>
    <path d="M22 50 L28 50 L27 75 L23 75 Z" fill="#047857"/>

    <!-- Head & Hair -->
    <circle cx="25" cy="25" r="13" fill="#fde047"/>
    <!-- Stylish Glasses & Gentle Smile -->
    <circle cx="25" cy="23" r="12" fill="none"/>
    <rect x="18" y="21" rx="2" width="6" height="5" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    <rect x="26" y="21" rx="2" width="6" height="5" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="24" y1="23" x2="26" y2="23" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M22 32 Q25 35 28 32" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hair Bun / Style -->
    <circle cx="25" cy="11" r="5" fill="#713f12"/>
    <path d="M13 25 C13 14, 37 14, 37 25 C37 28, 30 27, 25 27 C20 27, 13 28, 13 25 Z" fill="#713f12"/>
  </g>

  <!-- Foreground Event Props & Atmosphere -->
  <!-- Floating decorative elements / Activity / Success indicators -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="35" cy="80" r="3"/>
    <circle cx="205" cy="95" r="2"/>
    <circle cx="185" cy="60" r="4"/>
    <circle cx="65" cy="50" r="2.5"/>
  </g>

  <!-- Modern UI-style Glassmorphism Accent Card (Bottom Corner Context) -->
  <rect x="15" y="165" rx="10" width="70" height="26" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
  <circle cx="28" cy="178" r="5" fill="#38bdf8"/>
  <circle cx="42" cy="178" r="5" fill="#10b981"/>
  <circle cx="56" cy="178" r="5" fill="#f59e0b"/>
  <line x1="66" y1="178" x2="74" y2="178" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Soft Vignette / Border Glow -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
</svg>