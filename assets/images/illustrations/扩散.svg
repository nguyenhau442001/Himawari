<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="80" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- Microscope -->
  <path d="M120 80 L120 140 M100 140 L140 140" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="80" r="15" fill="none" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- The Virus/Diffusion Effect -->
  <g>
    <circle cx="120" cy="110" r="8" fill="#ec4899"/>
    <circle cx="120" cy="110" r="15" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="120" cy="110" r="25" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="120" cy="110" r="35" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 8" opacity="0.3"/>
  </g>

  <!-- Scientist Character -->
  <g transform="translate(40, 60)">
    <circle cx="30" cy="30" r="15" fill="#fde68a"/>
    <path d="M25 35 Q30 40 35 35" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="15" y="50" width="30" height="60" rx="5" fill="#38bdf8"/>
    <rect x="20" y="55" width="20" height="5" fill="#bae6fd"/>
  </g>

  <!-- Observation Monitor -->
  <rect x="150" y="40" width="60" height="50" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="180" cy="65" r="10" fill="#ec4899"/>
  <circle cx="180" cy="65" r="18" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.5"/>
  
  <!-- Floating Particles -->
  <circle cx="160" cy="120" r="3" fill="#10b981"/>
  <circle cx="80" cy="100" r="2" fill="#10b981"/>
  <circle cx="190" cy="130" r="4" fill="#10b981"/>
</svg>