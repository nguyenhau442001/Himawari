<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid lines for modern professional look -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2A2F3A" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="60" x2="40" y2="190" stroke="#2A2F3A" stroke-width="2" stroke-linecap="round"/>

  <!-- Diverging paths representing differentiation/fēnhuà (分化) -->
  <!-- Upward thriving branch -->
  <path d="M 60 140 C 100 140, 110 90, 160 70 L 180 60" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <!-- Upward trend bars -->
  <rect x="155" y="85" width="10" height="35" rx="3" fill="#38BDF8" opacity="0.8"/>
  <rect x="175" y="65" width="10" height="55" rx="3" fill="#38BDF8"/>
  <polygon points="190,60 175,52 175,68" fill="#38BDF8"/>

  <!-- Downward declining branch -->
  <path d="M 60 140 C 100 140, 110 150, 160 170 L 180 180" fill="none" stroke="#FB7185" stroke-width="4" stroke-linecap="round"/>
  <!-- Downward trend bars -->
  <rect x="155" y="145" width="10" height="25" rx="3" fill="#FB7185" opacity="0.8"/>
  <rect x="175" y="130" width="10" height="15" rx="3" fill="#FB7185"/>
  <polygon points="190,180 180,192 173,178" fill="#FB7185"/>

  <!-- Central starting point node (Unified state before divergence) -->
  <circle cx="60" cy="140" r="14" fill="#F59E0B"/>
  <circle cx="60" cy="140" r="7" fill="#1A1D24"/>

  <!-- Secondary connecting node -->
  <circle cx="110" cy="140" r="8" fill="#64748B"/>
  <circle cx="110" cy="140" r="4" fill="#1A1D24"/>

  <!-- Highlighting divergence point with clean minimalist indicators -->
  <!-- Accent dots on paths -->
  <circle cx="135" cy="105" r="4" fill="#38BDF8"/>
  <circle cx="135" cy="160" r="4" fill="#FB7185"/>

</svg>