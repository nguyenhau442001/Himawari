<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/stars -->
  <circle cx="120" cy="120" r="80" fill="#1E2330" opacity="0.6"/>
  <circle cx="80" cy="70" r="1.5" fill="#4F5D75"/>
  <circle cx="170" cy="85" r="1" fill="#4F5D75"/>
  <circle cx="160" cy="165" r="1.5" fill="#4F5D75"/>
  <circle cx="75" cy="155" r="1" fill="#4F5D75"/>

  <!-- Astronomical Telescope (Central Iconic Noun Representation) -->
  <g transform="translate(120, 120)">
    <!-- Tripod Legs -->
    <path d="M 0 35 L -35 75" stroke="#4F5D75" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 35 L 35 75" stroke="#4F5D75" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 35 L 5 78" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>

    <!-- Mount / Base -->
    <circle cx="0" cy="32" r="7" fill="#6C7A9C"/>
    <rect x="-4" y="28" width="8" height="8" fill="#3A4454"/>

    <!-- Telescope Body (Angled upward to the right) -->
    <g transform="rotate(-35)">
      <!-- Main Tube -->
      <rect x="-55" y="-14" width="85" height="26" rx="4" fill="#E4E9F0"/>
      <!-- Tube Shading/Highlight -->
      <rect x="-55" y="-14" width="85" height="12" fill="#FFFFFF" opacity="0.15"/>
      <rect x="-55" y="2" width="85" height="10" fill="#CBD5E1"/>

      <!-- Dew Shield (Front objective end) -->
      <rect x="-68" y="-17" width="16" height="32" rx="3" fill="#3B82F6"/>
      <rect x="-68" y="-17" width="16" height="14" fill="#60A5FA"/>

      <!-- Focus knob / Eyepiece attachment -->
      <rect x="20" y="-19" width="8" height="6" fill="#F59E0B"/>
      <rect x="27" y="-23" width="5" height="10" rx="1" fill="#3A4454"/>

      <!-- Lens Glow (Focus Accent) -->
      <ellipse cx="-68" cy="-1" rx="2" ry="14" fill="#93C5FD"/>
    </g>

    <!-- Celestial Focus Object (Gold/Orange accent representing stars/cosmos) -->
    <g transform="translate(62, -55)">
      <circle cx="0" cy="0" r="16" fill="#F59E0B" opacity="0.15"/>
      <circle cx="0" cy="0" r="10" fill="#F59E0B" opacity="0.3"/>
      <circle cx="0" cy="0" r="5" fill="#FBBF24"/>
      <!-- Star Sparkle -->
      <path d="M 0 -10 L 0 10 M -10 0 L 10 0" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Small Planet with Ring -->
    <g transform="translate(-65, -35)">
      <ellipse cx="0" cy="0" rx="9" ry="4" fill="none" stroke="#F59E0B" stroke-width="2" transform="rotate(-20)" opacity="0.8"/>
      <circle cx="0" cy="0" r="6" fill="#38BDF8"/>
      <path d="M -6 0 A 6 6 0 0 0 6 0 A 5 3 0 0 1 -6 0" fill="#0284C7"/>
    </g>
  </g>
</svg>