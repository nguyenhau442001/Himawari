<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Heavy Stone Pedestal (Symbolizing Unyielding/Rooted) -->
  <path d="M60 190 L180 190 L195 215 L45 215 Z" fill="#37474F"/>
  <rect x="70" y="180" width="100" height="12" rx="2" fill="#454B54"/>
  
  <!-- Character - Stiff, Rooted Legs -->
  <path d="M100 180 L100 150" stroke="#E0E0E0" stroke-width="16" stroke-linecap="butt"/>
  <path d="M140 180 L140 150" stroke="#E0E0E0" stroke-width="16" stroke-linecap="butt"/>
  
  <!-- Character - Square Torso -->
  <rect x="85" y="95" width="70" height="65" rx="4" fill="#E0E0E0"/>
  
  <!-- Crossed Arms (Iconic gesture of stubbornness) -->
  <path d="M85 115 H155" stroke="#1A1D24" stroke-width="10" stroke-linecap="round"/>
  <path d="M85 135 H155" stroke="#1A1D24" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Head with "Stubborn Thought" Accent -->
  <circle cx="120" cy="65" r="22" fill="#E0E0E0"/>
  
  <!-- Orange Accent: The "Stubborn Core" in the mind -->
  <circle cx="120" cy="65" r="10" fill="#FF9F1C"/>
  <path d="M120 55 V75 M110 65 H130" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Visual "Unmoving" Sparkles/Highlights -->
  <circle cx="55" cy="180" r="3" fill="#FF9F1C" opacity="0.6"/>
  <circle cx="185" cy="180" r="3" fill="#FF9F1C" opacity="0.6"/>
</svg>