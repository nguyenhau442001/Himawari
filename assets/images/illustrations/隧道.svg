<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain base (Slate/Dark Gray shape) -->
  <path d="M 30 190 Q 120 70 210 190 Z" fill="#282E3D"/>
  
  <!-- Mountain face texture / lighting -->
  <path d="M 120 70 Q 165 130 210 190 L 120 190 Z" fill="#323A4D" opacity="0.6"/>

  <!-- Tunnel Entrance (Dark cavity) -->
  <path d="M 90 190 A 30 35 0 0 1 150 190 Z" fill="#111317"/>

  <!-- Tunnel Interior perspective lines -->
  <path d="M 97 190 L 112 155" stroke="#1C212B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 143 190 L 128 155" stroke="#1C212B" stroke-width="2" stroke-linecap="round"/>

  <!-- Tunnel Arch Frame (Concrete portal in Accent Gold/Orange) -->
  <path d="M 85 190 V 153 A 35 40 0 0 1 155 153 V 190" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Portal Inner Shadow Accent -->
  <path d="M 88 190 V 155 A 32 37 0 0 1 152 155 V 190" fill="none" stroke="#D97706" stroke-width="2" opacity="0.5"/>

  <!-- Ground / Road outside the tunnel -->
  <path d="M 0 190 H 240 V 215 H 0 Z" fill="#1E2330"/>
  <path d="M 105 190 L 95 215 H 145 L 135 190 Z" fill="#282E3D"/> <!-- Road perspective leading in -->
  
  <!-- Glowing light emerging from inside tunnel (implies piercing through) -->
  <ellipse cx="120" cy="172" rx="12" ry="15" fill="#FDE68A" opacity="0.3"/>
  <ellipse cx="120" cy="172" rx="6" ry="8" fill="#FFFFFF" opacity="0.8"/>

  <!-- Modern minimalist accent elements (flashcard styling dots/border) -->
  <circle cx="24" cy="24" r="3" fill="#323A4D"/>
  <circle cx="216" cy="24" r="3" fill="#323A4D"/>
</svg>