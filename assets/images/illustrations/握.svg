<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Elements: Office/Signing Ceremony -->
  <rect x="40" y="140" width="160" height="10" rx="2" fill="#334155"/>
  <rect x="45" y="150" width="150" height="5" rx="2" fill="#475569"/>
  <path d="M70 140 L80 100 L160 100 L170 140 Z" fill="#1e293b" opacity="0.5"/>
  
  <!-- Table Props -->
  <rect x="80" y="142" width="20" height="3" rx="1" fill="#fbbf24"/>
  <rect x="140" y="142" width="20" height="3" rx="1" fill="#fbbf24"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#cbd5e1"/>
    <path d="M5 40 Q20 35 35 40 L30 80 L10 80 Z" fill="#38bdf8"/>
    <rect x="15" y="75" width="10" height="20" fill="#38bdf8"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(140, 100)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M5 40 Q20 35 35 40 L30 80 L10 80 Z" fill="#ec4899"/>
    <rect x="15" y="75" width="10" height="20" fill="#ec4899"/>
  </g>
  
  <!-- The Handshake (The Action) -->
  <g transform="translate(105, 130)">
    <circle cx="15" cy="15" r="12" fill="#fb923c" stroke="#0f172a" stroke-width="2"/>
    <path d="M10 15 L20 15 M15 10 L15 20" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Lighting/Ambience -->
  <circle cx="120" cy="60" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="100" cy="50" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="140" cy="50" r="1" fill="#fbbf24" opacity="0.4"/>
</svg>