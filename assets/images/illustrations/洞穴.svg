<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark slate background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="flashlightBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="caveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Cave Outer Rock Formation (Dark silhouette) -->
  <path d="M0 0 H240 V240 H0 Z" fill="#0b1329" />
  
  <!-- Cave Entrance Arch -->
  <path d="M40 240 V100 C40 60 70 30 120 30 C170 30 200 60 200 100 V240 Z" fill="url(#caveGrad)" />
  
  <!-- Inner Cave Depth (Darkness) -->
  <ellipse cx="130" cy="150" rx="45" ry="55" fill="#030712" />

  <!-- Stalactites & Stalagmites (Cave details) -->
  <path d="M80 30 L90 70 L100 35 Z" fill="#1e293b" />
  <path d="M150 30 L160 85 L175 35 Z" fill="#1e293b" />
  <path d="M50 80 L75 110 L60 90 Z" fill="#1e293b" />
  <path d="M180 90 L165 125 L190 100 Z" fill="#1e293b" />
  
  <path d="M70 240 L85 180 L100 240 Z" fill="#1e293b" />
  <path d="M160 240 L175 190 L195 240 Z" fill="#1e293b" />

  <!-- Flashlight Beam Light Cone -->
  <polygon points="120,135 60,85 40,165" fill="url(#flashlightBeam)" style="mix-blend-mode: screen;" />

  <!-- Glowing crystals inside the cave -->
  <polygon points="135,145 140,135 145,145 140,160 Z" fill="#38bdf8" />
  <polygon points="115,160 120,150 125,160 120,175 Z" fill="#34d399" />
  <polygon points="150,165 154,158 158,165 154,178 Z" fill="#f43f5e" />

  <!-- Explorer Character (Discovering the cave) -->
  <!-- Explorer Body & Backpack -->
  <rect x="75" y="140" width="22" height="35" rx="5" fill="#f97316" /> <!-- Orange jacket -->
  <rect x="68" y="145" width="10" height="25" rx="3" fill="#334155" /> <!-- Backpack -->

  <!-- Explorer Head & Hat -->
  <circle cx="86" cy="122" rx="10" fill="#fcd34d" />
  <!-- Explorer Khaki Hat -->
  <ellipse cx="86" cy="115" rx="13" ry="4" fill="#d97706" />
  <path d="M78 113 C78 108 94 108 94 113 Z" fill="#d97706" />

  <!-- Pointing Arm & Flashlight -->
  <path d="M86 135 L120 135" stroke="#f97316" stroke-width="6" stroke-linecap="round" />
  <circle cx="121" cy="135" r="4" fill="#fef08a" /> <!-- Flashlight -->

  <!-- Explorer Legs -->
  <rect x="78" y="172" width="7" height="30" rx="3" fill="#1e3a8a" />
  <rect x="88" y="172" width="7" height="30" rx="3" fill="#1e3a8a" />
  <!-- Boots -->
  <path d="M74 200 H85 V204 H74 Z" fill="#451a03" />
  <path d="M87 200 H98 V204 H87 Z" fill="#451a03" />

  <!-- Foreground Ground Texture -->
  <path d="M0 210 Q60 195 120 215 Q180 235 240 210 V240 H0 Z" fill="#0f172a" />

  <!-- Tiny Exploration Elements -->
  <!-- Compass / Map in hand or belt (Optional subtle detail) -->
  <circle cx="81" cy="155" r="3" fill="#e2e8f0" />
</svg>