<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow representing ambient warmth -->
  <circle cx="120" cy="130" r="70" fill="#FF9F43" opacity="0.08" filter="blur(15px)"/>

  <!-- Contextual Scene: Spring breeze and warm cozy feeling (Contrasting chilly wind vs golden warmth) -->
  
  <!-- Left Side: Chilly blue wind lines (representing the crisp breeze/cold baseline) -->
  <path d="M 25 80 Q 40 70 55 85" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 15 110 Q 35 100 50 115" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 30 140 Q 45 135 60 145" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- Right/Center Side: Warm golden gentle breeze and radiant warmth (Scale exaggeration of cozy comfort) -->
  <path d="M 175 75 Q 195 65 215 80" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 185 110 Q 210 100 225 120" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Central Visual Subject: A person experiencing comforting warmth (Serene expression, closed peaceful eyes, leaning slightly into a radiant soft sun/warm glow) -->
  
  <!-- Radiant Sun / Warmth Source behind the head -->
  <circle cx="120" cy="115" r="42" fill="url(#sunGlow)" opacity="0.85"/>
  
  <!-- Sun rays / thermal waves -->
  <path d="M 120 58 L 120 66" stroke="#FFD37A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 78 100 L 86 102" stroke="#FFD37A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 162 100 L 154 102" stroke="#FFD37A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 90 73 L 96 79" stroke="#FFD37A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 150 73 L 144 79" stroke="#FFD37A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Person Shoulders & Outfit (Dark slate/teal professional styling with warm collar accent) -->
  <path d="M 80 185 C 80 160 95 150 120 150 C 145 150 160 160 160 185 Z" fill="#2C3545"/>
  <!-- Cozy knitted sweater texture lines -->
  <path d="M 100 165 C 110 168 130 168 140 165" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 95 174 C 110 178 130 178 145 174" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Neck -->
  <rect x="110" y="132" width="20" height="25" rx="6" fill="#FCE4D6"/>

  <!-- Head / Face (Calm, relaxed, eyes closed in contentment) -->
  <ellipse cx="120" cy="118" rx="26" ry="30" fill="#FCE4D6"/>

  <!-- Hair (Stylized modern flat dark hair) -->
  <path d="M 94 115 C 92 90 105 82 120 82 C 135 82 148 90 146 115 C 146 115 150 100 140 92 C 130 84 110 84 100 92 C 90 100 94 115 94 115 Z" fill="#242B38"/>

  <!-- Peaceful Closed Eyes (Arc downward for serene expression) -->
  <path d="M 106 118 Q 111 122 116 118" stroke="#4A5568" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 124 118 Q 129 122 134 118" stroke="#4A5568" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Gentle Content Smile -->
  <path d="M 114 130 Q 120 135 126 130" stroke="#4A5568" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cheeks (Visual accent for warmth/nuǎn) -->
  <circle cx="104" cy="125" r="5" fill="#FF7675" opacity="0.4" filter="blur(1px)"/>
  <circle cx="136" cy="125" r="5" fill="#FF7675" opacity="0.4" filter="blur(1px)"/>

  <!-- Floating Gentle Spring Leaves (Symbolizing natural harmony and soft outdoor breeze) -->
  <path d="M 68 155 Q 75 145 82 155 Q 75 165 68 155 Z" fill="#2ECC71" opacity="0.8" transform="rotate(-20 75 155)"/>
  <path d="M 162 145 Q 169 135 176 145 Q 169 155 162 145 Z" fill="#2ECC71" opacity="0.8" transform="rotate(35 169 145)"/>

  <!-- Gradients -->
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD37A" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FF9F43" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>