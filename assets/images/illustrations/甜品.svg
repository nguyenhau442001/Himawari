<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M20 180 L220 180 L230 220 L10 220 Z" fill="#334155"/>
  
  <!-- Empty Dinner Plate -->
  <ellipse cx="80" cy="195" rx="35" ry="10" fill="#64748b" opacity="0.3"/>
  <circle cx="80" cy="190" r="25" fill="#f1f5f9"/>
  <path d="M65 190 Q80 185 95 190" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  
  <!-- Dessert Plate with Cake -->
  <circle cx="160" cy="170" r="30" fill="#f8fafc"/>
  <path d="M140 170 L180 170 L175 190 L145 190 Z" fill="#fb923c"/>
  <circle cx="160" cy="165" r="10" fill="#ec4899"/>
  
  <!-- Character: Happy Person -->
  <g transform="translate(120, 100)">
    <!-- Body -->
    <path d="M-30 80 Q0 60 30 80 L20 120 L-20 120 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#fde68a"/>
    <!-- Eyes (Happy) -->
    <path d="M-10 25 Q-5 20 0 25 M10 25 Q15 20 20 25" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M-8 40 Q0 48 8 40" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="-35" cy="70" r="8" fill="#fde68a"/>
    <circle cx="35" cy="70" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Ambient Glows -->
  <circle cx="160" cy="160" r="40" fill="#fbbf24" opacity="0.05"/>
  <circle cx="120" cy="120" r="80" fill="#38bdf8" opacity="0.03"/>
</svg>