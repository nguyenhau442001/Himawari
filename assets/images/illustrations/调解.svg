<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/circle for focus -->
  <circle cx="120" cy="120" r="75" fill="#252A34" opacity="0.6"/>

  <!-- Central Object: Scales of Justice / Mediation Symbol -->
  <g transform="translate(120, 112)">
    <!-- Base -->
    <path d="M-20 68 L20 68 C22 68 22 72 20 72 L-20 72 C-22 72 -22 68 -20 68 Z" fill="#94A3B8"/>
    <rect x="-4" y="24" width="8" height="46" rx="2" fill="#94A3B8"/>
    <circle cx="0" cy="24" r="7" fill="#F59E0B"/>

    <!-- Central Pillar/Beam -->
    <path d="M-50 20 L50 20 C52 20 52 24 50 24 L-50 24 C-52 24 -52 20 -50 20 Z" fill="#F59E0B" rx="2"/>

    <!-- Left Arm & Pan (Party A) -->
    <line x1="-48" y1="22" x2="-68" y2="60" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-85 62 C-85 62 -75 74 -68 74 C-61 74 -51 62 -51 62 Z" fill="#3B82F6"/>

    <!-- Right Arm & Pan (Party B) -->
    <line x1="48" y1="22" x2="68" y2="60" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M51 62 C51 62 61 74 68 74 C75 74 85 62 85 62 Z" fill="#3B82F6"/>

    <!-- Central Handshake / Agreement Element (Mediation Core) -->
    <circle cx="0" cy="30" r="22" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Stylized Handshake Icon -->
    <path d="M-10 32 L-2 26 L6 32" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-6 28 L0 34 L8 28" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Decorative Accent Nodes representing harmony/balance -->
  <circle cx="65" cy="55" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="175" cy="55" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="120" cy="35" r="3" fill="#10B981" opacity="0.9"/>
</svg>