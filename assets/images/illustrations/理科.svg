<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Central visual representing 理科 (Natural Sciences / STEM education concept):
         A modern, sleek desk object combining mathematics, physics, and chemistry/science:
         - An atom/orbital structure (Physics/Chemistry)
         - Mathematical symbols or geometric structure
         - Clean modern flat vector aesthetic with dark mode high-contrast palette (slate, teal, orange/gold accents). -->
         
    <!-- Desk base shadow / flat floor plane -->
    <ellipse cx="120" cy="190" rx="70" ry="12" fill="#121418"/>
    
    <!-- Central Beaker / Flask base (Science) -->
    <path d="M 95 160 L 145 160 L 135 125 L 142 95 L 98 95 L 105 125 Z" fill="#252A34" stroke="#3E4556" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Liquid inside flask with orange/gold accent -->
    <path d="M 101 135 L 139 135 L 143 155 L 97 155 Z" fill="#F39C12"/>
    
    <!-- Bubbles in flask -->
    <circle cx="115" cy="145" r="3" fill="#FDE3A7"/>
    <circle cx="127" cy="142" r="2" fill="#FDE3A7"/>
    
    <!-- Flask neck -->
    <rect x="106" y="80" width="28" height="15" rx="2" fill="#252A34" stroke="#3E4556" stroke-width="3"/>
    
    <!-- Orbital / Atom rings intersecting the flask (Physics) -->
    <ellipse cx="120" cy="120" rx="75" ry="30" fill="none" stroke="#00CEC9" stroke-width="3" transform="rotate(-30 120 120)"/>
    <ellipse cx="120" cy="120" rx="75" ry="30" fill="none" stroke="#6C5CE7" stroke-width="3" transform="rotate(30 120 120)"/>
    
    <!-- Electron dots on orbitals -->
    <circle cx="60" cy="95" r="5" fill="#00CEC9"/>
    <circle cx="180" cy="145" r="5" fill="#00CEC9"/>
    <circle cx="155" cy="65" r="5" fill="#6C5CE7"/>
    <circle cx="85" cy="175" r="5" fill="#6C5CE7"/>
    
    <!-- Mathematical / Geometric accents floating gracefully (Math) -->
    <!-- Pi symbol representation / geometric triangle top-right -->
    <path d="M 175 60 L 195 90 L 165 90 Z" fill="none" stroke="#E17055" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Square root / angle accent bottom-left -->
    <path d="M 50 130 L 60 130 L 68 145 L 80 100" fill="none" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Core nucleus element -->
    <circle cx="120" cy="120" r="8" fill="#E17055"/>
  </g>
</svg>