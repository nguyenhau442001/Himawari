<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Light Glow -->
    <radialGradient id="window-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Letter Gradient -->
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- BACKGROUND ENVIRONMENT / ROOM INTERIOR -->
  <!-- Warm Ambient Window Light Cone -->
  <polygon points="120,0 240,180 0,180" fill="url(#window-glow)" opacity="0.6" />

  <!-- Wall Shelf -->
  <rect x="25" y="55" width="90" height="6" rx="3" fill="#334155" />
  
  <!-- Potted Plant on Shelf -->
  <path d="M40,55 L45,40 L55,40 L60,55 Z" fill="#64748b" />
  <path d="M50,40 Q45,25 35,20 Q48,32 50,40 Z" fill="url(#leaf-grad)" />
  <path d="M50,40 Q55,22 65,18 Q53,32 50,40 Z" fill="url(#leaf-grad)" />
  <path d="M50,42 Q50,28 50,15 Q50,28 50,42 Z" fill="#10b981" />

  <!-- Warm Reading Lamp in Background -->
  <path d="M195,90 L205,90 L210,140 L190,140 Z" fill="#475569" />
  <circle cx="200" cy="85" r="15" fill="#f59e0b" opacity="0.8" filter="url(#soft-shadow)" />

  <!-- Wooden Desk Surface -->
  <rect x="0" y="175" width="240" height="65" fill="#0f172a" />
  <rect x="0" y="170" width="240" height="8" rx="2" fill="#334155" />

  <!-- Desk Props: Coffee Mug -->
  <rect x="25" y="145" width="22" height="25" rx="4" fill="#38bdf8" />
  <path d="M47,150 C54,150 54,165 47,165" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <!-- Steam from mug -->
  <path d="M32,138 Q36,132 32,126" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- MAIN PROP: The Important Letter / Message Sheet (Trigger for tears) -->
  <g transform="translate(95, 140) rotate(-6)" filter="url(#soft-shadow)">
    <rect width="60" height="45" rx="3" fill="url(#letter-grad)" />
    <!-- Abstract text lines representing good news -->
    <line x1="10" y1="12" x2="45" y2="12" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="22" x2="50" y2="22" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="32" x2="35" y2="32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Gold star seal on letter -->
    <circle cx="45" cy="32" r="5" fill="#f59e0b" />
  </g>

  <!-- CHARACTER: Sitting at desk, deeply touched (热泪盈眶) -->
  <g id="character" transform="translate(0, 10)">
    <!-- Body / Torso with Cozy Cardigan -->
    <path d="M90,180 C90,150 100,140 120,140 C140,140 150,150 150,180 Z" fill="#ec4899" filter="url(#soft-shadow)" />
    <path d="M105,140 L120,165 L135,140 Z" fill="#f472b6" /> <!-- Inner collar -->
    <circle cx="120" cy="155" r="3" fill="#fb7185" />
    <circle cx="120" cy="170" r="3" fill="#fb7185" />

    <!-- Neck -->
    <rect x="112" y="125" width="16" height="20" rx="8" fill="url(#skin-grad)" />

    <!-- Head & Hair Base -->
    <circle cx="120" cy="100" r="32" fill="url(#skin-grad)" filter="url(#soft-shadow)" />
    
    <!-- Hair Back/Sides -->
    <path d="M88,100 C88,75 152,75 152,100 C152,120 145,135 140,135 C135,135 132,120 128,115 C112,115 108,135 100,135 C95,135 88,120 88,100 Z" fill="#334155" />
    <!-- Hair Bangs -->
    <path d="M92,95 Q120,70 148,95 Q130,85 120,90 Q110,85 92,95 Z" fill="#334155" />

    <!-- Face Details -->
    <!-- Closed Happy/Moved Eyes (Crescent shapes showing emotional overwhelmed state) -->
    <path d="M104,98 Q110,105 116,98" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
    <path d="M124,98 Q130,105 136,98" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />

    <!-- Gentle Rosy Cheeks (Blush) -->
    <circle cx="103" cy="106" r="7" fill="#f43f5e" opacity="0.35" />
    <circle cx="137" cy="106" r="7" fill="#f43f5e" opacity="0.35" />

    <!-- Gentle Moved Smile -->
    <path d="M113,115 Q120,121 127,115" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- THE CORE CONCEPT: 热泪盈眶 (Tears welling up / sparkling in eyes) -->
    <!-- Left Eye Tears -->
    <circle cx="110" cy="103" r="4.5" fill="#38bdf8" filter="url(#soft-shadow)" />
    <circle cx="109" cy="102" r="1.5" fill="#ffffff" />
    <path d="M108,107 Q106,115 110,118" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Eye Tears -->
    <circle cx="130" cy="103" r="4.5" fill="#38bdf8" filter="url(#soft-shadow)" />
    <circle cx="129" cy="102" r="1.5" fill="#ffffff" />
    <path d="M132,107 Q134,115 130,118" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Hands clasped emotionally near chest / chin -->
    <g transform="translate(0, 5)">
      <path d="M100,145 C95,140 105,130 112,138 Z" fill="url(#skin-grad)" filter="url(#soft-shadow)" />
      <path d="M140,145 C145,140 135,130 128,138 Z" fill="url(#skin-grad)" filter="url(#soft-shadow)" />
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERIC DETAILS (Lighting overlay & floating sparkles of emotion) -->
  <circle cx="75" cy="80" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="165" cy="70" r="3" fill="#fbbf24" opacity="0.6" />
  <circle cx="150" cy="110" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="90" cy="120" r="2" fill="#38bdf8" opacity="0.7" />
</svg>