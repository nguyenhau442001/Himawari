<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M40 180 L80 140 L120 180" stroke="#334155" stroke-width="4" fill="none"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(40, 80)">
    <circle cx="40" cy="40" r="25" fill="#fb923c"/>
    <path d="M25 80 Q40 120 55 80" fill="#fb923c"/>
    <path d="M30 40 L50 40" stroke="#0f172a" stroke-width="2"/>
    <path d="M35 80 L35 130" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M45 80 L55 110" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(120, 80)">
    <circle cx="40" cy="40" r="25" fill="#38bdf8"/>
    <path d="M25 80 Q40 120 55 80" fill="#38bdf8"/>
    <path d="M30 40 L50 40" stroke="#0f172a" stroke-width="2"/>
    <path d="M35 80 L35 130" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M45 80 L55 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The Connection (The "Contact" visual) -->
  <path d="M80 120 C100 80, 140 80, 160 120" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
  <circle cx="120" cy="100" r="6" fill="#fbbf24"/>
  
  <!-- Handshake/Wave Gesture -->
  <g transform="translate(100, 150)">
    <path d="M0 0 L20 -20 L40 0" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="-25" r="4" fill="#f59e0b"/>
  </g>
  
  <!-- Environment Details -->
  <rect x="20" y="200" width="200" height="4" rx="2" fill="#334155"/>
  <circle cx="200" cy="180" r="10" fill="#10b981" opacity="0.3"/>
</svg>