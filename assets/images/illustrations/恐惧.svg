<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Shadow/Darkness element representing the source of fear -->
  <path d="M120 60 C 80 60, 50 90, 50 130 C 50 170, 80 200, 120 200 C 160 200, 190 170, 190 130 C 190 90, 160 60, 120 60 Z" fill="#2D343E"/>
  
  <!-- Person trembling in fear -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-20 40 L-25 0 L25 0 L20 40 Z" fill="#FFB84D"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="20" fill="#FFB84D"/>
    <!-- Eyes (Wide/Fearful) -->
    <circle cx="-8" cy="-30" r="3" fill="#1A1D24"/>
    <circle cx="8" cy="-30" r="3" fill="#1A1D24"/>
    <!-- Mouth (Trembling/Open) -->
    <ellipse cx="0" cy="-18" rx="4" ry="2" fill="#1A1D24"/>
    <!-- Arms (Hugging self) -->
    <path d="M-25 5 C-40 5, -40 25, -20 20" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M25 5 C40 5, 40 25, 20 20" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Trembling lines -->
  <path d="M90 100 L95 105 M150 100 L145 105" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
</svg>