<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Grid/Atmosphere for Educational Context -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="30" y1="60" x2="210" y2="60" stroke-dasharray="3 3"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke-dasharray="3 3"/>
    <line x1="30" y1="180" x2="210" y2="180" stroke-dasharray="3 3"/>
  </g>

  <!-- Teacher (Demonstrator) Character -->
  <g id="teacher">
    <!-- Body / Torso -->
    <path d="M70 170 C70 145 85 135 100 135 C115 135 130 145 130 170 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="100" cy="105" r="18" fill="#FDE047"/>
    <!-- Hair -->
    <path d="M82 100 C82 90 90 85 100 85 C110 85 118 90 118 100 Z" fill="#1E293B"/>
    <!-- Active Arm (Demonstrating / Pointing / Writing) -->
    <path d="M115 145 L145 130 L165 115" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="168" cy="112" r="5" fill="#FDE047"/>
  </g>

  <!-- Action / Motion Lines (Showing "doing/demonstrating") -->
  <g id="motion-and-focus">
    <!-- Curved motion arc -->
    <path d="M 140 95 Q 160 85 175 100" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M 145 85 Q 170 70 190 90" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Object being demonstrated (Geometric model / Target) -->
  <g id="target-object" transform="translate(170, 110)">
    <!-- Base stand -->
    <rect x="-10" y="45" width="20" height="6" rx="3" fill="#64748B"/>
    <line x1="0" y1="25" x2="0" y2="45" stroke="#64748B" stroke-width="4"/>
    
    <!-- Highlighted Object / Shape being demonstrated (Golden Accent) -->
    <polygon points="0,0 20,25 -20,25" fill="#F97316"/>
    <circle cx="0" cy="12" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Student (Observer / Receiver of Action) Character -->
  <g id="student" transform="translate(30, 15)">
    <!-- Body -->
    <path d="M20 155 C20 135 30 125 42 125 C54 125 64 135 64 155 Z" fill="#06B6D4"/>
    <!-- Head -->
    <circle cx="42" cy="95" r="14" fill="#FDE047"/>
    <!-- Hair -->
    <path d="M28 92 C28 83 34 80 42 80 C50 80 56 83 56 92 Z" fill="#334155"/>
    <!-- Attentive Posture (Hands folded/watching) -->
    <path d="M32 135 L42 140 L52 135" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Focal Glow / Sparkles (Highlighting the "Model / Example" concept) -->
  <g id="sparkles" fill="#FDE047">
    <path d="M 185 70 L 187 78 L 195 80 L 187 82 L 185 90 L 183 82 L 175 80 L 183 78 Z"/>
    <path d="M 125 65 L 126 70 L 131 71 L 126 72 L 125 77 L 124 72 L 119 71 L 124 70 Z" opacity="0.7"/>
  </g>

</svg>