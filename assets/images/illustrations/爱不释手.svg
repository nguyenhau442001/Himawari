<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Window/Background element -->
  <rect x="160" y="40" width="40" height="60" rx="4" fill="#334155"/>
  <circle cx="180" cy="70" r="15" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Chair -->
  <path d="M40 180h60v10h-60z" fill="#475569"/>
  <path d="M50 140h40v40h-40z" fill="#64748b"/>
  
  <!-- Character -->
  <g transform="translate(60, 100)">
    <!-- Legs -->
    <rect x="15" y="60" width="10" height="20" fill="#38bdf8"/>
    <rect x="35" y="60" width="10" height="20" fill="#38bdf8"/>
    <!-- Torso -->
    <path d="M10 20h40v40h-40z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="30" cy="10" r="15" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M15 5c0-10 10-15 15-15s15 5 15 15" fill="#78350f"/>
    <!-- Arms holding book -->
    <path d="M5 30l-10 10" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <path d="M55 30l10 10" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- The Book (The focus) -->
  <g transform="translate(110, 130) rotate(-10)">
    <rect x="0" y="0" width="60" height="80" rx="4" fill="#ec4899"/>
    <rect x="5" y="10" width="50" height="5" fill="#fff" opacity="0.2"/>
    <rect x="5" y="20" width="50" height="5" fill="#fff" opacity="0.2"/>
    <rect x="5" y="30" width="50" height="5" fill="#fff" opacity="0.2"/>
    <rect x="5" y="40" width="50" height="5" fill="#fff" opacity="0.2"/>
    <rect x="5" y="50" width="50" height="5" fill="#fff" opacity="0.2"/>
  </g>
  
  <!-- Sparkles/Emotion -->
  <path d="M180 120l5-10 5 10z" fill="#fbbf24"/>
  <path d="M190 140l3-6 3 6z" fill="#fbbf24"/>
  <circle cx="170" cy="150" r="3" fill="#10b981"/>
</svg>