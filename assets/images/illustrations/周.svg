<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 30)">
    <!-- Calendar Body -->
    <rect x="20" y="30" width="140" height="130" rx="12" fill="#252A34" stroke="#3A4256" stroke-width="4"/>
    
    <!-- Calendar Top Header -->
    <path d="M 20 42 C 20 35.3726 25.3726 30 32 30 L 148 30 C 154.627 30 160 35.3726 160 42 L 160 60 L 20 60 Z" fill="#E65C00"/>
    
    <!-- Binding Rings -->
    <rect x="50" y="20" width="10" height="18" rx="5" fill="#A0AAB8"/>
    <rect x="120" y="20" width="10" height="18" rx="5" fill="#A0AAB8"/>
    
    <!-- Grid of Days (7 days in a row representing a full week cycle) -->
    <!-- Row 1: Mon-Sun highlighted -->
    <circle cx="38" cy="80" r="7" fill="#E65C00"/>
    <circle cx="58" cy="80" r="7" fill="#3A4256"/>
    <circle cx="78" cy="80" r="7" fill="#3A4256"/>
    <circle cx="98" cy="80" r="7" fill="#3A4256"/>
    <circle cx="118" cy="80" r="7" fill="#3A4256"/>
    <circle cx="138" cy="80" r="7" fill="#3A4256"/>
    <circle cx="158" cy="80" r="7" fill="#3A4256"/>

    <!-- Row 2 -->
    <circle cx="38" cy="105" r="7" fill="#3A4256"/>
    <circle cx="58" cy="105" r="7" fill="#3A4256"/>
    <circle cx="78" cy="105" r="7" fill="#3A4256"/>
    <circle cx="98" cy="105" r="7" fill="#3A4256"/>
    <circle cx="118" cy="105" r="7" fill="#3A4256"/>
    <circle cx="138" cy="105" r="7" fill="#3A4256"/>
    <circle cx="158" cy="105" r="7" fill="#3A4256"/>

    <!-- Row 3 -->
    <circle cx="38" cy="130" r="7" fill="#3A4256"/>
    <circle cx="58" cy="130" r="7" fill="#3A4256"/>
    <circle cx="78" cy="130" r="7" fill="#3A4256"/>
    <circle cx="98" cy="130" r="7" fill="#3A4256"/>
    <circle cx="118" cy="130" r="7" fill="#3A4256"/>
    <circle cx="138" cy="130" r="7" fill="#3A4256"/>
    <circle cx="158" cy="130" r="7" fill="#3A4256"/>

    <!-- Continuous loop arrow encircling the calendar to signify a complete cycle (week) -->
    <path d="M 12 110 C 2 70, 40 10, 100 12 C 160 14, 188 65, 175 110" fill="none" stroke="#FFA726" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
    
    <!-- Arrowhead pointing forward to complete the cycle -->
    <path d="M 167 98 L 178 112 L 189 101" fill="none" stroke="#FFA726" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>