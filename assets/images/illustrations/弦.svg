<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(40, 40) scale(0.66)">
    <!-- Guitar neck base -->
    <rect x="80" y="0" width="80" height="240" rx="10" fill="#3E4451"/>
    <!-- Tuning pegs -->
    <rect x="60" y="20" width="20" height="10" fill="#FFB347"/>
    <rect x="60" y="50" width="20" height="10" fill="#FFB347"/>
    <rect x="160" y="20" width="20" height="10" fill="#FFB347"/>
    <rect x="160" y="50" width="20" height="10" fill="#FFB347"/>
    <!-- Frets -->
    <rect x="80" y="80" width="80" height="4" fill="#2C313C"/>
    <rect x="80" y="120" width="80" height="4" fill="#2C313C"/>
    <rect x="80" y="160" width="80" height="4" fill="#2C313C"/>
    <rect x="80" y="200" width="80" height="4" fill="#2C313C"/>
    <!-- Strings -->
    <line x1="100" y1="0" x2="100" y2="240" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="240" stroke="#9CA3AF" stroke-width="2"/>
    <!-- The broken string (highlighted) -->
    <path d="M140 0 L140 110" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 130 L140 240" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
    <!-- Frayed ends of the broken string -->
    <circle cx="140" cy="110" r="3" fill="#FFB347"/>
    <circle cx="140" cy="130" r="3" fill="#FFB347"/>
  </g>
</svg>