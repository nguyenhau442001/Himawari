<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative historical architecture / origin elements -->
  <g opacity="0.15" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3">
    <path d="M40 200 L120 160 L200 200" />
    <path d="M120 160 L120 90" />
  </g>

  <!-- Conceptual Central Object: A magnificent, ancient-style scroll/chronicle unfurling (representing origin, history, background) -->
  <g>
    <!-- Scroll background glow -->
    <circle cx="120" cy="120" r="60" fill="#F59E0B" opacity="0.1" filter="blur(8px)"/>

    <!-- Scroll Lower Rod (Left & Right handles) -->
    <rect x="75" y="158" width="90" height="10" rx="5" fill="#D97706" />
    <circle cx="75" cy="163" r="6" fill="#B45309" />
    <circle cx="165" cy="163" r="6" fill="#B45309" />

    <!-- Scroll Upper Rod -->
    <rect x="75" y="72" width="90" height="10" rx="5" fill="#D97706" />
    <circle cx="75" cy="77" r="6" fill="#B45309" />
    <circle cx="165" cy="77" r="6" fill="#B45309" />

    <!-- Unfurled Parchment Base -->
    <path d="M80 80 C80 80, 75 120, 80 160 L160 160 C165 120, 160 80, 160 80 Z" fill="#FEF3C7" />
    
    <!-- Parchment Inner Shadow/Texture (representing depth of history) -->
    <path d="M85 85 C85 85, 82 120, 85 155 L155 155 C158 120, 155 85, 155 85 Z" fill="#FDE68A" />

    <!-- Historical Timeline / Roots / Origin Motif on the Scroll -->
    <!-- Branching root / lineage graphic symbolizing "Yóulái" (origin/source) -->
    <path d="M120 145 L120 105" stroke="#92400E" stroke-width="3" stroke-linecap="round" />
    
    <!-- Origin Node -->
    <circle cx="120" cy="145" r="5" fill="#B45309" />

    <!-- Expanding Branches / History spreading upward -->
    <path d="M120 125 C110 120, 100 115, 95 105" stroke="#B45309" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M120 125 C130 120, 140 115, 145 105" stroke="#B45309" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M120 110 L120 95" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />

    <!-- Branch nodes -->
    <circle cx="95" cy="105" r="3.5" fill="#D97706" />
    <circle cx="145" cy="105" r="3.5" fill="#D97706" />
    <circle cx="120" cy="95" r="3.5" fill="#D97706" />

    <!-- Subtle horizontal text simulation lines representing historical records -->
    <line x1="98" y1="133" x2="112" y2="133" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="128" y1="133" x2="142" y2="133" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Accent Focus Elements: Glowing spark at the root (the core beginning / origin point) -->
  <circle cx="120" cy="145" r="8" fill="#F59E0B" opacity="0.4" filter="blur(2px)"/>
  <circle cx="120" cy="145" r="3" fill="#FFFFFF" />

  <!-- Outer frame accent marks (modern sleek UI aesthetic) -->
  <path d="M30 45 L30 30 L45 30" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M210 45 L210 30 L195 30" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 195 L30 210 L45 210" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M210 195 L210 210 L195 210" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>