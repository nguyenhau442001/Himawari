<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 覆盖 (Noun/Covering: Ocean covering the Earth) -->
  <g transform="translate(120, 120)">
    <!-- Deep Space / Background Glow -->
    <circle cx="0" cy="0" r="85" fill="#252A34" />
    
    <!-- Earth Base (Landmass underneath) -->
    <circle cx="0" cy="0" r="70" fill="#8D5524" opacity="0.6"/>
    <!-- Land details -->
    <path d="M-40 -30 Q-20 -50 10 -40 T50 -10 T30 40 T-20 30 Z" fill="#4E7C38" opacity="0.8"/>
    <path d="M-60 10 Q-40 30 -30 60 T-50 70 Z" fill="#4E7C38" opacity="0.8"/>

    <!-- Ocean Layer Covering the Earth (Semantically representing 覆盖) -->
    <mask id="earth-mask">
      <circle cx="0" cy="0" r="70" fill="white"/>
    </mask>

    <g mask="url(#earth-mask)">
      <!-- Blue Ocean Layer flowing over and covering the globe -->
      <path d="M-80 -70 C-30 -70 20 -90 80 -70 C80 20 80 80 80 80 C20 80 -30 80 -80 80 Z" fill="#2A82E4" opacity="0.9"/>
      
      <!-- Ocean Waves / Curvature highlights showing the covering layer -->
      <path d="M-70 -20 Q -40 -40 0 -30 T 70 -40" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M-60 10 Q -10 0 30 20 T 70 10" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M-50 45 Q -20 35 10 50 T 60 45" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Globe Outline / Atmosphere Glow -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6"/>

    <!-- Accent Overlay Indicator (Highlighting the "Cover" action) -->
    <path d="M-50 -55 A 70 70 0 0 1 50 -55" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <polygon points="50,-55 42,-61 45,-53" fill="#F59E0B"/>
    <polygon points="-50,-55 -42,-49 -45,-57" fill="#F59E0B"/>
  </g>
</svg>