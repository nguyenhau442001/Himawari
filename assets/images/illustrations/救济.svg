  <!-- Recipient -->
  <g transform="translate(40, 90)">
    <circle cx="30" cy="30" r="15" fill="#fcd34d"/>
    <path d="M15 60c0-10 5-20 15-20s15 10 15 20v40h-30z" fill="#94a3b8"/>
  </g>
  
  <!-- Money/Envelope -->
  <rect x="100" y="130" width="40" height="25" rx="2" fill="#10b981"/>
  <path d="M100 130l20 12l20-12" stroke="#065f46" stroke-width="2" fill="none"/>
  
  <!-- Background Details -->
  <rect x="40" y="50" width="60" height="40" rx="2" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="50" y1="65" x2="90" y2="65" stroke="#475569" stroke-width="4"/>
  <line x1="50" y1="75" x2="80" y2="75" stroke="#475569" stroke-width="4"/>
  
  <!-- Decorative light -->
