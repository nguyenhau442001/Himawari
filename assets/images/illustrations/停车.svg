<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Road Elements -->
  <path d="M 40 180 L 200 180" stroke="#2A2F3D" stroke-width="24" stroke-linecap="round"/>
  <!-- Road dashes -->
  <line x1="80" y1="180" x2="110" y2="180" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="180" x2="160" y2="180" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>

  <!-- Central Physical Object: Sleek Modern Car in Profile (Noun Representation) -->
  <g transform="translate(48, 115)">
    <!-- Car Shadow -->
    <ellipse cx="72" cy="55" rx="60" ry="6" fill="#111318"/>

    <!-- Car Body Base -->
    <path d="M 18 36 L 36 15 C 40 10, 48 8, 56 8 L 88 8 C 96 8, 104 10, 108 15 L 126 36 C 132 38, 136 44, 136 50 L 136 56 C 136 62, 131 67, 125 67 L 19 67 C 13 67, 8 62, 8 56 L 8 50 C 8 44, 12 38, 18 36 Z" fill="#E65100"/>
    
    <!-- Car Cabin / Roof -->
    <path d="M 42 12 L 58 12 L 86 12 L 102 36 L 38 36 Z" fill="#FFA726"/>

    <!-- Windows (Glass) -->
    <path d="M 45 14 L 57 14 L 57 34 L 41 34 Z" fill="#29B6F6" opacity="0.6"/>
    <path d="M 61 14 L 83 14 L 99 34 L 61 34 Z" fill="#29B6F6" opacity="0.6"/>

    <!-- Headlight & Taillight -->
    <rect x="128" y="42" width="6" height="8" rx="2" fill="#FFF59D"/>
    <rect x="10" y="42" width="5" height="8" rx="2" fill="#EF5350"/>

    <!-- Wheels -->
    <g transform="translate(35, 52)">
      <circle cx="0" cy="0" r="14" fill="#2C3E50"/>
      <circle cx="0" cy="0" r="8" fill="#78909C"/>
      <circle cx="0" cy="0" r="3" fill="#CFD8DC"/>
    </g>
    <g transform="translate(108, 52)">
      <circle cx="0" cy="0" r="14" fill="#2C3E50"/>
      <circle cx="0" cy="0" r="8" fill="#78909C"/>
      <circle cx="0" cy="0" r="3" fill="#CFD8DC"/>
    </g>
  </g>

  <!-- Prohibition / Stop Indicator overlay (Contextualizing "No parking / Stopped") -->
  <g transform="translate(120, 52)">
    <!-- Outer Red Circle -->
    <circle cx="0" cy="0" r="24" fill="#1A1D24" stroke="#EF5350" stroke-width="5"/>
    <!-- Letter P for Parking -->
    <path d="M -5 9 L -5 -7 L 1 -7 C 4 -7, 6 -5, 6 -2 C 6 1, 4 3, 1 3 L -5 3" fill="none" stroke="#F5F7FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash Line indicating restriction / completed stop state -->
    <line x1="-16" y1="16" x2="16" y2="-16" stroke="#EF5350" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>