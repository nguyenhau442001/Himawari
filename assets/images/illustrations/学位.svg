<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Academic Cap (Graduation Cap / Mortarboard) -->
    <!-- Cap top diamond -->
    <polygon points="0,-52 85,-15 0,22 -85,-15" fill="#2C3545" stroke="#3E4C63" stroke-width="2"/>
    <polygon points="0,-48 75,-15 0,18 -75,-15" fill="#1E2530"/>
    
    <!-- Cap central skullcap base -->
    <path d="M-35,5 C-35,28 -15,35 0,35 C15,35 35,28 35,5 Z" fill="#1E2530" stroke="#3E4C63" stroke-width="2"/>

    <!-- Tassel string & button -->
    <circle cx="0" cy="-15" r="5" fill="#F59E0B"/>
    <path d="M0,-15 Q35,-5 52,32" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <!-- Tassel fringe -->
    <path d="M52,32 L47,45 L57,45 Z" fill="#F59E0B"/>

    <!-- Diploma Scroll tied with ribbon, positioned below the cap -->
    <g transform="translate(0, 75)">
      <!-- Diploma shadow/back roll -->
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#E2E8F0"/>
      <!-- Inner roll texture lines -->
      <line x1="-55" y1="-5" x2="55" y2="-5" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="-55" y1="2" x2="55" y2="2" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Ribbon around diploma -->
      <rect x="-10" y="-14" width="20" height="28" rx="3" fill="#F59E0B"/>
      <!-- Ribbon tails -->
      <path d="M-5,14 L-12,26 L-2,22 Z" fill="#D97706"/>
      <path d="M5,14 L12,26 L2,22 Z" fill="#D97706"/>
    </g>
  </g>
</svg>