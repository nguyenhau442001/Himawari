<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sunset Sky Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dreamy Thought Bubble Gradient -->
    <linearGradient id="thought-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Window & Outside View -->
  <!-- Window Frame Outer Recess -->
  <rect x="135" y="25" width="80" height="150" rx="4" fill="#0f172a" />
  
  <!-- Outside Sky Scene -->
  <rect x="138" y="28" width="74" height="144" rx="2" fill="url(#sky-grad)" />
  
  <!-- Distant Silhouette Buildings/Trees Outside -->
  <path d="M138 135 L145 115 L152 125 L162 105 L172 120 L185 95 L195 110 L212 90 L212 172 L138 172 Z" fill="#1e293b" opacity="0.6" />

  <!-- Window Pane Inner Grid & Highlights -->
  <!-- Vertical divider -->
  <line x1="175" y1="28" x2="175" y2="172" stroke="#0f172a" stroke-width="4" />
  <!-- Horizontal divider -->
  <line x1="138" y1="100" x2="212" y2="100" stroke="#0f172a" stroke-width="4" />

  <!-- Window Sill -->
  <rect x="130" y="172" width="90" height="8" rx="2" fill="#475569" />
  <rect x="125" y="180" width="100" height="4" rx="1" fill="#334155" />

  <!-- Potted Plant on Window Sill -->
  <path d="M195 155 L205 155 L208 172 L192 172 Z" fill="#f43f5e" /> <!-- Pot -->
  <ellipse cx="200" cy="155" rx="5" ry="2" fill="#fda4af" />
  <!-- Plant Leaves (Monstera/Pothos style) -->
  <path d="M200 153 C190 145 190 135 195 130 C200 135 205 130 208 140 C210 145 205 152 200 153 Z" fill="#10b981" />
  <path d="M200 153 C210 148 215 138 212 133 C208 138 203 133 198 138 C195 142 198 150 200 153 Z" fill="#34d399" />

  <!-- Warm Light Beam casting into room -->
  <polygon points="138,100 212,100 240,240 80,240" fill="url(#window-light)" style="mix-blend-mode: screen;" />

  <!-- BACKGROUND PROPS: Bookshelf & Room Interior -->
  <!-- Bookshelf on left wall -->
  <rect x="15" y="40" width="45" height="120" fill="#1e293b" rx="2" />
  <line x1="15" y1="75" x2="60" y2="75" stroke="#334155" stroke-width="3" />
  <line x1="15" y1="110" x2="60" y2="110" stroke="#334155" stroke-width="3" />
  <line x1="15" y1="145" x2="60" y2="145" stroke="#334155" stroke-width="3" />
  
  <!-- Colorful Books on Shelf -->
  <rect x="19" y="55" width="8" height="20" rx="1" fill="#f43f5e" />
  <rect x="28" y="52" width="6" height="23" rx="1" fill="#38bdf8" />
  <rect x="35" y="58" width="10" height="17" rx="1" fill="#fbbf24" />
  <rect x="19" y="88" width="12" height="22" rx="1" fill="#10b981" />
  <rect x="33" y="92" width="7" height="18" rx="1" fill="#a855f7" />

  <!-- Cozy Floor Lamp / Plant stand shadow details -->
  <path d="M0 210 Q120 200 240 210 L240 240 L0 240 Z" fill="#0f172a" opacity="0.4" />

  <!-- FOREGROUND / CHARACTER: The Girl sitting by the window -->
  <!-- Chair / Stool -->
  <rect x="75" y="145" width="45" height="55" rx="6" fill="#334155" />
  <!-- Chair cushion -->
  <rect x="72" y="140" width="51" height="12" rx="4" fill="#64748b" />
  <!-- Chair legs -->
  <line x1="82" y1="200" x2="72" y2="230" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line x1="112" y1="200" x2="122" y2="230" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- Character Body & Pose (Sitting, leaning head on hand, spacing out) -->
  <!-- Legs folded/dangling casually -->
  <path d="M85 152 L75 185 L95 190 L100 160 Z" fill="#3b82f6" /> <!-- Pants/Skirt -->
  <ellipse cx="98" cy="192" rx="8" ry="4" fill="#cbd5e1" /> <!-- Shoes -->

  <!-- Torso -->
  <path d="M82 120 C82 105 108 105 110 120 L115 155 L85 155 Z" fill="#f43f5e" /> <!-- Cozy Sweater -->
  
  <!-- Sleeves & Arms -->
  <!-- Left arm hanging relaxed -->
  <path d="M82 125 L68 145 L75 150 L85 135 Z" fill="#e11d48" />
  <circle cx="72" cy="152" r="5" fill="#fbcfe8" /> <!-- Hand -->

  <!-- Right arm bent up, propping head (crucial for 'fādāi' / spacing out pose) -->
  <path d="M110 122 C120 120 125 105 115 95" fill="none" stroke="#e11d48" stroke-width="10" stroke-linecap="round" />
  
  <!-- Neck -->
  <path d="M92 98 L92 110 L102 110 L102 98 Z" fill="#fbcfe8" />

  <!-- Head (tilted slightly, dreamy expression) -->
  <circle cx="98" cy="85" r="18" fill="#fbcfe8" />

  <!-- Hair (Stylized bob/long hair flowing back) -->
  <path d="M80 80 C80 65 116 65 118 85 C120 100 115 120 115 120 C115 120 105 105 100 100 C90 100 82 90 80 80 Z" fill="#1e293b" />
  <path d="M82 82 C80 95 85 115 90 125 C90 125 87 110 86 95 Z" fill="#0f172a" /> <!-- Hair strand -->

  <!-- Face Details (Eyes vacant/glassy, daydreaming look - no intense focus) -->
  <!-- Closed/Half-lidded dreamy eyes -->
  <path d="M90 83 Q94 87 98 83" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <path d="M102 83 Q106 87 110 83" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <!-- Soft neutral mouth, blank expression -->
  <path d="M98 92 Q101 94 104 92" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <!-- Rosy cheeks representing relaxed daydream -->
  <circle cx="89" cy="88" r="3" fill="#fda4af" opacity="0.6" />
  <circle cx="111" cy="88" r="3" fill="#fda4af" opacity="0.6" />

  <!-- Hand propping up the chin -->
  <ellipse cx="112" cy="94" rx="6" ry="5" fill="#fbcfe8" />

  <!-- DREAMY THOUGHT BUBBLES (Visualizing "ngẩn ngơ" / zoning out) -->
  <g filter="url(#soft-glow)">
    <!-- Small bubbles leading up -->
    <circle cx="75" cy="65" r="3" fill="#38bdf8" opacity="0.4" />
    <circle cx="68" cy="52" r="5" fill="#38bdf8" opacity="0.5" />
    <circle cx="58" cy="38" r="7" fill="#38bdf8" opacity="0.6" />

    <!-- Main Thought Cloud containing abstract dreamy shapes -->
    <path d="M40 30 C30 30 25 40 32 48 C25 55 35 65 45 60 C55 65 65 55 60 45 C68 38 60 25 50 30 C45 22 40 30 40 30 Z" fill="url(#thought-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    
    <!-- Abstract dreamy icons inside thought bubble (Coffee cup & star/music note representing wandering thoughts) -->
    <!-- Floating Star -->
    <path d="M48 38 L50 43 L55 44 L51 47 L53 52 L48 49 L43 52 L45 47 L41 44 L46 43 Z" fill="#fbbf24" opacity="0.7" transform="scale(0.6) translate(35, 10)" />
    <!-- Floating Coffee/Teacup -->
    <path d="M35 45 L45 45 C45 52 35 52 35 45 Z" fill="#cbd5e1" opacity="0.7" />
    <path d="M45 46 Q48 46 48 48.5 Q48 51 45 51" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- FOREGROUND DETAILS / DESK & MUG (Context Props) -->
  <!-- Small wooden side table next to chair -->
  <rect x="50" y="165" width="28" height="35" rx="2" fill="#334155" />
  <line x1="53" y1="200" x2="48" y2="230" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <line x1="75" y1="200" x2="78" y2="230" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Ceramic Mug on Table (Warming up with steam) -->
  <rect x="56" y="152" width="12" height="15" rx="2" fill="#f8fafc" />
  <path d="M68 155 C72 155 72 163 68 165" fill="none" stroke="#f8fafc" stroke-width="2" />
  <!-- Steam wisps -->
  <path d="M60 148 Q62 144 60 140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M65 146 Q63 142 65 138" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Open Book on Table -->
  <path d="M38 178 L52 173 L52 190 L38 193 Z" fill="#f1f5f9" />
  <path d="M52 173 L66 178 L66 193 L52 190 Z" fill="#e2e8f0" />
  <line x1="52" y1="173" x2="52" y2="190" stroke="#94a3b8" stroke-width="1" />
  <!-- Text lines suggestion in book -->
  <line x1="41" y1="180" x2="48" y2="178" stroke="#cbd5e1" stroke-width="1" />
  <line x1="41" y1="184" x2="49" y2="182" stroke="#cbd5e1" stroke-width="1" />
  <line x1="56" y1="179" x2="63" y2="181" stroke="#cbd5e1" stroke-width="1" />
  <line x1="56" y1="185" x2="62" y2="187" stroke="#cbd5e1" stroke-width="1" />

  <!-- Ambient lighting highlights on floor and edge -->
  <ellipse cx="90" cy="235" rx="40" ry="3" fill="#000000" opacity="0.3" />
</svg>