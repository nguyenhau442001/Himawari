<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Environment -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <circle cx="180" cy="60" r="25" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Street Lamp -->
  <rect x="190" y="80" width="4" height="100" fill="#475569"/>
  <rect x="180" y="70" width="24" height="10" rx="2" fill="#f59e0b"/>
  
  <!-- The Character -->
  <g transform="translate(60, 120)">
    <!-- Backpack -->
    <rect x="-15" y="20" width="30" height="40" rx="5" fill="#fb923c"/>
    <!-- Body -->
    <path d="M-10 20 L10 20 L15 80 L-15 80 Z" fill="#64748b"/>
    <!-- Legs -->
    <rect x="-10" y="80" width="8" height="30" fill="#475569"/>
    <rect x="2" y="80" width="8" height="30" fill="#475569"/>
    <!-- Arms -->
    <path d="M-15 30 L-30 50" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 30 L25 45" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="5" r="15" fill="#fde68a"/>
    <!-- Hat -->
    <path d="M-20 0 L20 0 L15 -10 L-15 -10 Z" fill="#334155"/>
  </g>

  <!-- Wandering Path/Dust -->
  <ellipse cx="100" cy="210" rx="40" ry="5" fill="#0f172a" opacity="0.2"/>
  
  <!-- Distant City Silhouette -->
  <path d="M0 180 L20 140 L40 160 L60 130 L80 150 L100 120 L120 170 L140 140 L160 180 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Accents -->
  <circle cx="20" cy="40" r="2" fill="#38bdf8"/>
  <circle cx="40" cy="30" r="3" fill="#10b981"/>
  <circle cx="220" cy="20" r="2" fill="#ec4899"/>
</svg>