<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for 副 (Deputy / Second-in-command) -->
  <!-- Context: Two professional figures in a modern office, one primary (leader) and one secondary (deputy) with distinct visual hierarchy -->
  
  <!-- Background subtle office structure lines -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <rect x="80" y="80" width="80" height="50" rx="4" fill="none" stroke="#2A2F3D" stroke-width="2"/>
  
  <!-- Primary/Main Figure (Left, slightly larger, central focus of authority) -->
  <g transform="translate(70, 95)">
    <!-- Body / Suit -->
    <path d="M 12 40 L 0 85 L 36 85 L 24 40 Z" fill="#3B82F6"/>
    <!-- Tie / Collar -->
    <polygon points="18,40 21,55 24,40" fill="#F59E0B"/>
    <!-- Shoulders -->
    <path d="M 0 45 C 0 32, 36 32, 36 45 Z" fill="#2563EB"/>
    <!-- Head -->
    <circle cx="18" cy="20" r="12" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M 8 16 C 8 10, 28 10, 28 16 C 26 12, 10 12, 8 16 Z" fill="#64748B"/>
  </g>

  <!-- Deputy/Secondary Figure (Right, slightly smaller, positioned subordinately, holding a supportive/co-working pose) -->
  <g transform="translate(134, 103)">
    <!-- Body / Suit (Distinct secondary color/accent to show deputy role) -->
    <path d="M 10 32 L 0 77 L 30 77 L 20 32 Z" fill="#475569"/>
    <!-- Tie -->
    <polygon points="15,32 17,45 19,32" fill="#94A3B8"/>
    <!-- Shoulders -->
    <path d="M 0 37 C 0 26, 30 26, 30 37 Z" fill="#334155"/>
    <!-- Head -->
    <circle cx="15" cy="16" r="10" fill="#CBD5E1"/>
    <!-- Hair -->
    <path d="M 7 13 C 7 8, 23 8, 23 13 C 21 10, 9 10, 7 13 Z" fill="#475569"/>
  </g>

  <!-- Hierarchy / Organizational Indicator: Gold structural badge floating above, clearly marking "Deputy" relationship -->
  <g transform="translate(120, 52)">
    <!-- Connecting lines showing hierarchy -->
    <path d="M -35 18 L 0 5 L 35 18" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Gold focal badge representing secondary/deputy status -->
    <circle cx="0" cy="0" r="14" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="10" fill="#1A1D24"/>
    <!-- Inner secondary marker icon -->
    <circle cx="-3" cy="0" r="2.5" fill="#F59E0B"/>
    <circle cx="4" cy="0" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Modern UI Focus Accent Frame -->
  <path d="M 30 50 L 30 40 L 40 40" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 210 50 L 210 40 L 200 40" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30 190 L 30 200 L 40 200" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 210 190 L 210 200 L 200 200" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>