<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glowing grid/accent for precision crafting -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A313C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M120 25 V45 M120 195 V215 M25 120 H45 M195 120 H215" stroke="#3A4454" stroke-width="2" stroke-linecap="round"/>

  <!-- MOTION LINES showing the action of embedding (镶嵌) -->
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3">
    <path d="M75 55 L98 78"/>
    <path d="M165 55 L142 78"/>
  </g>

  <!-- PRECISION TOOL (Tweezers / Setting tool held by user hand) -->
  <!-- Hand & Tool -->
  <g transform="translate(150, 40) rotate(35)">
    <!-- Arm/Hand sleeve -->
    <path d="M40 -20 L90 -20 L90 20 L40 20 Z" fill="#3B82F6" rx="4"/>
    <!-- Fingers -->
    <circle cx="45" cy="0" r="10" fill="#FCD34D"/>
    <!-- Tweezers -->
    <path d="M45 0 L-25 -35 L-30 -30 L20 0 L-30 30 L-25 35 Z" fill="#94A3B8"/>
  </g>

  <!-- THE DIAMOND (Being embedded) -->
  <g transform="translate(120, 85)">
    <!-- Glowing aura for focus -->
    <polygon points="0,-18 16,-6 10,14 -10,14 -16,-6" fill="#FEF08A" opacity="0.2"/>
    <!-- Diamond facets -->
    <polygon points="0,-15 13,-5 8,12 -8,12 -13,-5" fill="#FDE047"/>
    <polygon points="0,-15 13,-5 0,12" fill="#FEF08A"/>
    <polygon points="0,-15 -13,-5 0,12" fill="#EAB308"/>
    <polygon points="0,-15 13,-5 0,-8" fill="#FFF"/>
  </g>

  <!-- THE RING (Object receiving the inlay) -->
  <g transform="translate(120, 140)">
    <!-- Ring Band (Gold/Yellow metallic) -->
    <ellipse cx="0" cy="20" rx="48" ry="32" fill="none" stroke="#D97706" stroke-width="10"/>
    <ellipse cx="0" cy="20" rx="48" ry="32" fill="none" stroke="#F59E0B" stroke-width="6"/>
    
    <!-- Setting Head / Prong Base (Where the diamond sits) -->
    <path d="M -16 -8 L -12 -22 L 12 -22 L 16 -8 Z" fill="#B45309"/>
    <path d="M -12 -22 L 12 -22 L 8 -12 L -8 -12 Z" fill="#D97706"/>
    
    <!-- Inner shadow/depth of ring -->
    <ellipse cx="0" cy="22" rx="40" ry="24" fill="none" stroke="#1A1D24" stroke-width="3"/>
  </g>

  <!-- Sparkle accents for finished/active craftsmanship -->
  <path d="M75 110 L78 116 L84 119 L78 122 L75 128 L72 122 L66 119 L72 116 Z" fill="#FCD34D"/>
  <path d="M170 130 L172 134 L176 136 L172 138 L170 142 L168 138 L164 136 L168 134 Z" fill="#60A5FA"/>

</svg>