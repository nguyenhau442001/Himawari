<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural Corner (Walls intersecting in perspective) -->
  <!-- Left Wall -->
  <polygon points="24,192 120,216 120,48 24,72" fill="#222730"/>
  <!-- Right Wall -->
  <polygon points="120,216 216,192 216,72 120,48" fill="#2A313D"/>
  <!-- Floor base -->
  <polygon points="24,192 120,216 216,192 120,168" fill="#15181F"/>
  
  <!-- Warm ambient light from the corner/top -->
  <path d="M120,48 L120,216 L216,192 Z" fill="#FFA726" opacity="0.04"/>

  <!-- Bookshelf in the corner background -->
  <g opacity="0.85">
    <!-- Vertical frame line -->
    <line x1="120" y1="60" x2="120" y2="150" stroke="#3A4454" stroke-width="2"/>
    <!-- Shelves -->
    <line x1="105" y1="90" x2="120" y2="84" stroke="#485468" stroke-width="2"/>
    <line x1="108" y1="120" x2="120" y2="114" stroke="#485468" stroke-width="2"/>
    <!-- Books on shelf -->
    <rect x="108" y="70" width="3" height="18" fill="#D32F2F" rx="0.5"/>
    <rect x="112" y="72" width="4" height="16" fill="#1976D2" rx="0.5"/>
    <rect x="110" y="102" width="5" height="15" fill="#388E3C" rx="0.5"/>
  </g>

  <!-- Floor Lamp casting warm glow in the corner -->
  <g>
    <!-- Lamp Stand -->
    <line x1="180" y1="174" x2="180" y2="80" stroke="#485468" stroke-width="3" stroke-linecap="round"/>
    <!-- Lamp Base -->
    <ellipse cx="180" cy="174" rx="12" ry="4" fill="#3A4454"/>
    <!-- Lampshade -->
    <polygon points="168,76 192,76 198,92 162,92" fill="#FFA726"/>
    <!-- Light Cone / Glow on wall and floor -->
    <path d="M168,76 L135,160 L225,160 Z" fill="#FFA726" opacity="0.12"/>
  </g>

  <!-- Comfortable Leather Reading Armchair (Focused Object in the Corner) -->
  <g transform="translate(0, 5)">
    <!-- Shadow beneath chair -->
    <ellipse cx="95" cy="162" rx="36" ry="12" fill="#0D0F13" opacity="0.6"/>

    <!-- Chair Backrest -->
    <path d="M70,105 C70,95 80,88 95,88 C110,88 120,95 120,105 L120,150 C120,155 110,160 95,160 C80,160 70,155 70,150 Z" fill="#D35400"/>
    <!-- Backrest Cushion Indents/Tufting -->
    <path d="M95,98 L95,145" stroke="#BA4A00" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M85,110 L85,135" stroke="#BA4A00" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <path d="M105,110 L105,135" stroke="#BA4A00" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Left Armrest -->
    <path d="M62,115 C62,108 72,105 78,105 C84,105 84,145 78,150 C72,155 62,148 62,135 Z" fill="#E67E22"/>

    <!-- Right Armrest -->
    <path d="M128,115 C128,108 118,105 112,105 C106,105 106,145 112,150 C118,155 128,148 128,135 Z" fill="#BA4A00"/>

    <!-- Seat Cushion (Plush) -->
    <path d="M66,138 C66,132 78,130 95,130 C112,130 124,132 124,138 C124,146 112,158 95,158 C78,158 66,146 66,138 Z" fill="#E67E22"/>

    <!-- Wooden Legs -->
    <line x1="75" y1="156" x2="70" y2="168" stroke="#795548" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="115" y1="156" x2="120" y2="168" stroke="#795548" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Coziness details: Open book resting on the armchair -->
  <g transform="translate(83, 138) scale(0.6)">
    <!-- Book pages -->
    <path d="M0,10 C15,5 25,5 40,10 L40,30 C25,25 15,25 0,30 Z" fill="#F5F5F5"/>
    <path d="M40,10 C55,5 65,5 80,10 L80,30 C65,25 55,25 40,30 Z" fill="#E0E0E0"/>
    <!-- Center spine -->
    <line x1="40" y1="10" x2="40" y2="30" stroke="#BDBDBD" stroke-width="1.5"/>
    <!-- Text lines indication -->
    <line x1="10" y1="15" x2="30" y2="13" stroke="#9E9E9E" stroke-width="1"/>
    <line x1="10" y1="20" x2="25" y2="18" stroke="#9E9E9E" stroke-width="1"/>
    <line x1="50" y1="13" x2="70" y2="15" stroke="#9E9E9E" stroke-width="1"/>
    <line x1="50" y1="18" x2="65" y2="20" stroke="#9E9E9E" stroke-width="1"/>
  </g>

  <!-- Small Rug under the armchair to anchor the corner scene -->
  <ellipse cx="95" cy="172" rx="42" ry="15" fill="#323B4D"/>
</svg>