<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Floor line -->
  <path d="M40 190 L200 190" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character: The one admitting fault (Bowing) -->
  <g transform="translate(80, 190)">
    <path d="M-10 -80 L10 -50" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-85" r="12" fill="#F59E0B"/>
    <path d="M-20 -50 L0 -50 L10 -20" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Character: The one receiving the apology (Standing upright, listening/accepting) -->
  <g transform="translate(160, 190)">
    <path d="M0 -90 L0 -30" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-95" r="12" fill="#E5E7EB"/>
    <path d="M-15 -70 L0 -50 L15 -70" fill="none" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Motion lines indicating the bow/action -->
  <path d="M95 120 Q110 110 125 120" stroke="#4B5563" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4 4"/>
  <path d="M95 130 Q110 120 125 130" stroke="#4B5563" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Visual cue of the 'mistake' (a broken object on the floor) -->
  <g transform="translate(50, 185)">
    <path d="M0 0 L10 -15 L20 0" stroke="#EF4444" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>