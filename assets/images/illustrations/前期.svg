<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptualizing "Early Stage" (前期) as the foundational phase of a project -->
  <!-- Base platform/foundation -->
  <rect x="60" y="180" width="120" height="12" rx="4" fill="#3D4451"/>
  
  <!-- The "Early Stage" object: A blueprint/sketch on a drawing board -->
  <path d="M70 180 L80 140 L160 140 L170 180 Z" fill="#2C313C"/>
  <path d="M85 150 L155 150 M85 160 L155 160 M85 170 L130 170" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- A sprout emerging from the blueprint to symbolize the beginning/start -->
  <path d="M120 140 C 120 120, 110 110, 105 105" stroke="#FFB84D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M120 140 C 120 120, 130 110, 135 105" stroke="#FFB84D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="120" cy="140" rx="6" ry="6" fill="#FFB84D"/>
  
  <!-- Construction tools indicating the "Research/Development" phase -->
  <path d="M180 100 L200 80 L210 90 L190 110 Z" fill="#FFB84D"/>
  <rect x="188" y="88" width="10" height="10" transform="rotate(45 193 93)" fill="#1A1D24"/>
  <path d="M190 110 L180 120" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
</svg>