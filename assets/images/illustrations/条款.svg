<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/accent for central object -->
  <circle cx="120" cy="120" r="70" fill="#252A36" opacity="0.6"/>

  <!-- Document / Contract Base -->
  <g transform="translate(70, 48)">
    <!-- Document background shadow/layer -->
    <rect x="0" y="0" width="100" height="136" rx="8" fill="#2A303C"/>
    <!-- Main Document -->
    <rect x="6" y="6" width="100" height="136" rx="8" fill="#1E232E" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Document Header Accent -->
    <circle cx="26" cy="26" r="6" fill="#F59E0B"/>
    <rect x="40" y="22" width="46" height="8" rx="4" fill="#3A4252"/>

    <!-- Content Lines representing "条款" (Clauses/Articles) -->
    <g transform="translate(18, 46)">
      <!-- Clause 1 (Highlighted/Focused item) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#F59E0B"/>
        <path d="M3.5 6L5.5 8L8.5 4" fill="none" stroke="#1E232E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="18" y="2" width="60" height="4" rx="2" fill="#F59E0B" opacity="0.85"/>
        <rect x="18" y="10" width="44" height="4" rx="2" fill="#F59E0B" opacity="0.4"/>
      </g>

      <!-- Clause 2 -->
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#3A4252"/>
        <rect x="18" y="2" width="56" height="4" rx="2" fill="#8E99A8" opacity="0.7"/>
        <rect x="18" y="10" width="38" height="4" rx="2" fill="#8E99A8" opacity="0.4"/>
      </g>

      <!-- Clause 3 -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#3A4252"/>
        <rect x="18" y="2" width="62" height="4" rx="2" fill="#8E99A8" opacity="0.7"/>
        <rect x="18" y="10" width="50" height="4" rx="2" fill="#8E99A8" opacity="0.4"/>
      </g>
    </g>

    <!-- Signature line at the bottom -->
    <line x1="18" y1="122" x2="50" y2="122" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Magnifying glass highlighting the specific clause/terms (tiáokuǎn) -->
  <g transform="translate(112, 80)">
    <!-- Glass shadow -->
    <circle cx="36" cy="36" r="28" fill="#1A1D24" opacity="0.3"/>
    <!-- Outer rim -->
    <circle cx="36" cy="36" r="26" fill="none" stroke="#F59E0B" stroke-width="5"/>
    <!-- Lens reflection -->
    <path d="M19 23 A 22 22 0 0 1 53 19" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Handle -->
    <path d="M17 55 L-2 74" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <path d="M17 55 L-2 74" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>