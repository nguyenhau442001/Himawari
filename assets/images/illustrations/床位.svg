<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect for hospital bed/medical context -->
  <circle cx="120" cy="120" r="80" fill="#0EA5E9" opacity="0.08"/>

  <!-- Hospital Bed (床位) - Sleek Modern Flat Design -->
  <g transform="translate(35, 65)">
    <!-- IV Pole in background -->
    <rect x="22" y="10" width="3" height="90" fill="#64748B" rx="1.5"/>
    <path d="M18 18 L25 10 L32 18" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- IV Bag -->
    <path d="M19 25 C19 22 25 22 25 25 C25 28 21 32 21 35 L23 35 C23 32 27 28 27 25 C27 22 21 22 21 25" fill="#38BDF8" opacity="0.8"/>
    <!-- IV Drip Tube -->
    <path d="M23 35 Q23 55 45 60" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Bed Frame & Mattress -->
    <!-- Headboard & Footboard -->
    <rect x="10" y="45" width="8" height="60" rx="4" fill="#94A3B8"/>
    <rect x="152" y="55" width="8" height="50" rx="4" fill="#94A3B8"/>

    <!-- Main Bed Base / Frame -->
    <rect x="14" y="85" width="142" height="12" rx="3" fill="#334155"/>
    
    <!-- Mattress -->
    <rect x="18" y="52" width="134" height="35" rx="6" fill="#F8FAFC"/>

    <!-- Pillow -->
    <rect x="25" y="58" width="28" height="23" rx="8" fill="#E2E8F0"/>

    <!-- Medical/Hospital Blanket layered over lower body -->
    <path d="M50 87 L152 87 L152 65 Q110 65 80 67 L50 87 Z" fill="#0EA5E9"/>
    <rect x="50" y="85" width="102" height="15" rx="4" fill="#0284C7"/>

    <!-- Medical Cross Badge on Headboard (indicating hospital bed) -->
    <rect x="12" y="65" width="4" height="20" rx="1" fill="#EF4444"/>
    <rect x="4" y="73" width="20" height="4" rx="1" fill="#EF4444"/>

    <!-- Bed Legs -->
    <rect x="25" y="97" width="6" height="15" rx="2" fill="#64748B"/>
    <rect x="139" y="97" width="6" height="15" rx="2" fill="#64748B"/>
  </g>

  <!-- Focus Accent: Medical monitor / vital sign wave curve floating subtly above -->
  <path d="M 75 185 Q 95 185 105 170 T 125 195 T 145 185 L 165 185" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>