<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient background glow -->
  <circle cx="120" cy="120" r="80" fill="#3A4D6C" opacity="0.15" filter="blur(20px)"/>

  <!-- Central Physical Object: A sleek modern mechanical tally counter / physical counting device representing "数目" (specific countable items / total quantity) -->
  <g transform="translate(120, 120)">
    <!-- Shadow for depth -->
    <rect x="-55" y="-45" width="110" height="90" rx="16" fill="#0D0F12" opacity="0.6" transform="translate(0, 10)"/>

    <!-- Main Device Body (Sleek Dark Metallic Slate) -->
    <rect x="-60" y="-50" width="120" height="100" rx="18" fill="#252A34" stroke="#3E4756" stroke-width="2"/>
    
    <!-- Inner Bezel / Screen Area -->
    <rect x="-46" y="-36" width="92" height="52" rx="8" fill="#12151B" stroke="#2D3542" stroke-width="1.5"/>

    <!-- Count Digits Screen (Glowing Gold/Orange LCD Style representing counted numbers) -->
    <text x="0" y="2" font-family="monospace, sans-serif" font-weight="bold" font-size="28" fill="#FFB703" text-anchor="middle" letter-spacing="4">8492</text>

    <!-- Top Mechanical Plunger / Button -->
    <rect x="-14" y="-66" width="28" height="18" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <path d="M-22 -50 L22 -50 L18 -66 L-18 -66 Z" fill="#3E4756" stroke="#4B5563" stroke-width="1"/>

    <!-- Side reset knob -->
    <rect x="60" y="-10" width="8" height="20" rx="2" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>

    <!-- Decorative Accent Nodes / Indicators -->
    <circle cx="-42" cy="34" r="3" fill="#EF4444"/>
    <circle cx="-32" cy="34" r="3" fill="#10B981"/>

    <!-- Floating visual quantity representation (abstracting countable items coming together) -->
    <circle cx="-85" cy="-60" r="6" fill="#FFB703" opacity="0.8"/>
    <circle cx="85" cy="-65" r="5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="-95" cy="20" r="7" fill="#10B981" opacity="0.8"/>
    <circle cx="90" cy="45" r="6" fill="#F59E0B" opacity="0.8"/>

    <!-- Connecting thin coordinate lines showing precision data / quantity -->
    <path d="M-75 -55 L-46 -36" stroke="#3E4756" stroke-dasharray="2,2" stroke-width="1.5" opacity="0.6"/>
    <path d="M75 -55 L46 -36" stroke="#3E4756" stroke-dasharray="2,2" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>